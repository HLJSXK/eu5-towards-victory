 TV_ENGINEERING_DEBATE_HELP_TEXT_2: "Assim que [tv_wonder_domestic_support|e] atingir #Y 100#!, você poderá declarar o debate concluído e passar para [tv_wonder_survey|e]."
 TV_ENGINEERING_DEBATE_HELP_TEXT_3: "O apoio pode continuar acumulando até #Y 200#! mesmo após o término do debate, ficando reservado para as etapas seguintes."
