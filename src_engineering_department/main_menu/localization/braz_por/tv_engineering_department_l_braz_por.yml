 TV_ENGINEERING_CEREMONY_HELP_GENERIC_TEXT_1: "Após a construção, escolha um estilo [tv_wonder_ceremony|e] e satisfaça seus requisitos para definir o efeito final da maravilha."
 TV_ENGINEERING_CEREMONY_UNIQUE_SECTION_TITLE: "@construction! Maravilhas Únicas"
 TV_ENGINEERING_CEREMONY_HELP_UNIQUE_TEXT_1: "A maioria dos [tv_wonder_unique|e]s inicia seu [tv_wonder_ceremony|e] automaticamente assim que a construção é concluída, sem nenhum estilo para escolher manualmente."
 TV_ENGINEERING_CEREMONY_HELP_UNIQUE_TEXT_2: "O [tv_wonder_ceremony|e] passa por 8 estágios, avançando automaticamente um estágio a cada poucos meses; cada etapa tem seu próprio custo e sabor."
