 TV_ENGINEERING_CONSTRUCTION_PROGRESS_TT: "Cada unidade [tv_wonder_construction_part|e] usa o progresso [tv_wonder_construction|e] do [tv_engineering_department|e]. Os requisitos do módulo são configurados através do Community Mod Menu; os requisitos padrão de Pequeno, Médio e Grande são 100.000, 200.000 e 300.000 de progresso."
