 TV_ENGINEERING_CONSTRUCTION_INFO_TEXT: "O nível do Grande Projeto é igual à menor contagem de unidades concluídas entre seus quatro [tv_wonder_construction_part|e]s. A conclusão de uma unidade concede [tv_wonder_domestic_support|e]; aumentar o nível total concede outro bônus de suporte."
 TV_ENGINEERING_FINISH_CONSTRUCTION_BUTTON: "@trigger_yes! declara o grande projeto concluído"
 TV_ENGINEERING_CONSTRUCTION_HELP_TEXT_1: "$BULLET$ [tv_wonder_construction|e] avança quatro [tv_wonder_construction_part|e]s de uma vez: Fundação, Estrutura Principal, Função e Coroamento. Use os botões acima para mudar a peça atualmente em construção."
 TV_ENGINEERING_CONSTRUCTION_HELP_TEXT_2: "$BULLET$ O nível do [tv_wonder_construction|e] depende da parte que está mais atrás; o nível total só aumenta quando a parte atrasada completa uma nova unidade."
 TV_ENGINEERING_CONSTRUCTION_HELP_TEXT_3: "$BULLET$ Você pode declarar o [tv_wonder_construction|e] concluído depois de concluir pelo menos um nível."
 TV_ENGINEERING_CONSTRUCTION_HELP_TEXT_4: "$BULLET$ Você pode, portanto, concluir primeiro um projeto de menor escala e depois buscar um [tv_wonder_expansion|e] em uma escala maior, sem perder nenhuma recompensa de conclusão já obtida."
 TV_ENGINEERING_CONSTRUCTION_HELP_TEXT_5: "$BULLET$ A conclusão de qualquer unidade de construção concede [tv_wonder_domestic_support|e]; se essa unidade também aumentar o nível total do Grande Projeto, ela concederá outro bônus [tv_wonder_domestic_support|e]."
 TV_ENGINEERING_CONSTRUCTION_HELP_TT: "#T Construction#!\n[tv_wonder_construction|e] avança quatro [tv_wonder_construction_part|e]s de uma vez: Fundação, Estrutura Principal, Função e Coroamento. Use os botões acima para alternar a peça atualmente em construção.\nO nível do [tv_wonder_construction|e] depende da peça que está mais atrás; o nível total só aumenta quando a parte atrasada conclui uma nova unidade.\nVocê pode declarar o [tv_wonder_construction|e] completo depois de concluir pelo menos um nível.\nVocê pode, portanto, concluir um projeto de menor escala primeiro e expandi-lo para uma escala maior posteriormente, sem perder nenhuma recompensa de conclusão já obtida.\nConcluir qualquer unidade de construção concede [tv_wonder_domestic_support|e]; se essa unidade também aumentar o nível total do Grande Projeto, ela concederá outro bônus [tv_wonder_domestic_support|e]."
