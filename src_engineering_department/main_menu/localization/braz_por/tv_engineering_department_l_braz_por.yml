 TV_WONDER_FINAL_SUPPORT_REWARD_TT: "Como temos Suporte Doméstico [ROOT.GetVariable('tv_wonder_final_support_reward_source').GetValue|0] restante, ganhamos:"
 tv_engineering_department.10.t: "[tv_great_engineer|E]：Grande engenheiro morreu"
 tv_engineering_department.10.d: "Nosso [tv_great_engineer|E] faleceu. A notícia passa pelo [tv_engineering_department|e] por meio de caixas de desenho fechadas, mesas de levantamento paradas e assistentes repentinamente relutantes em apagar as últimas marcas de giz. Cada plano inacabado parece agora mais frágil do que ontem. O mecanismo milagroso pode manter seus registros, mas [tv_wonder_construction|e] precisa de uma mente viva para transformar a ambição em sequência. Até que um sucessor seja nomeado, o reino tem pedra, trabalho e esperança, mas nenhum mestre construtor para fazê-los concordar.\n\n#weak A posição do Grande Engenheiro agora está vaga - nomeie um sucessor no Departamento de Engenharia o mais rápido possível para manter a construção da maravilha em movimento.#!"
 tv_engineering_department.10.a: "Encontre um sucessor antes que os planos esfriem."
 tv_engineering_department.20.t: "[tv_wonder_construction|E]：Colapsos do projeto"
 tv_engineering_department.20.d: "A reserva de [tv_wonder_domestic_support|e] foi esgotada. Os cortesãos que outrora elogiaram o projecto lembram-se agora de negócios urgentes noutros locais, os porta-vozes imobiliários redescobrem as suas objecções e os fornecedores pedem pagamento antes que outro carrinho se mova. Com o grande projeto indefensável, o [tv_engineering_department|e] deve abandonar a maravilha trancada e suportar a desgraça. O terreno permanece, as primeiras marcas permanecem e talvez algumas pedras permaneçam, mas a ponte política abaixo delas ruiu. Nenhum monumento pode resistir ao silêncio, ao medo e a promessas não pagas.\n\n#weak A maravilha foi abandonada à força - você pode reavaliar o local e os planos no Departamento de Engenharia e começar de novo a qualquer momento.#!"
 tv_engineering_department.20.a: "Deixe a vergonha ser registrada de forma limpa."
 tv_engineering_department.30.t: "[tv_wonder_construction|E]：Um design toma forma"
 tv_engineering_department.30.d: "O [tv_great_engineer|E] preencheu as primeiras páginas: elevações acidentadas, dúvidas dispendiosas, pontos fortes ocultos do terreno e algumas impossibilidades elegantes riscadas com arrependimento visível. O conceito não é mais um clima na oficina. Ele está pronto para se tornar uma proposta que o tribunal pode comparar, contestar e, finalmente, escolher.\n\n#weak O conceito de design está pronto - vá ao Departamento de Engenharia para revisar a proposta do [tv_great_engineer|E], aceitando-a ou exigindo que a reconcebam, e então avance no debate sobre a maravilha para construir suporte doméstico suficiente.#!"
 tv_engineering_department.30.a: "Mostre-nos os desenhos."
 tv_engineering_department.100.t: "[tv_wonder_debate|E]：Rally das Casas Nobres"
 tv_engineering_department.100.d: "Várias casas nobres decidiram que a maravilha irá ampliar a sua própria memória tanto quanto a do reino. Seus arautos falam de assentos ancestrais, nomes imortais e da agradável possibilidade de que as gerações futuras possam confundir glória privada com propósito público. O [tv_engineering_department|e] não os corrige. Suporte é suporte, e [tv_wonder_domestic_support|e] muitas vezes chega usando joias. Suas vozes agora ecoam pela corte com um volume útil."
 tv_engineering_department.100.a: "Deixe-os ser vistos."
 tv_engineering_department.101.t: "[tv_wonder_debate|E]: Folga Nobre"
 tv_engineering_department.101.d: "Espalharam-se rumores de que a maravilha consumirá privilégios nobres sem devolver honra suficiente. Algumas casas começaram a contar não o esplendor futuro do monumento, mas os assentos, isenções, trabalhadores e precedência cerimonial que isso pode lhes custar. O [tv_engineering_department|e] pode medir pedras, mas a classificação dos feridos é mais difícil de avaliar. O apoio entre a aristocracia vacila e cada hesitação faz com que todo o projecto pareça mais pesado. O orgulho pode ser mais leve que o mármore, mas é muito mais difícil de levantar."
 tv_engineering_department.101.a: "Seu orgulho é caro."
 tv_engineering_department.102.t: "[tv_wonder_debate|E]：Burgueses veem oportunidade"
 tv_engineering_department.102.d: "Guildmasters e financiadores começam a falar de contratos, estradas, armazéns e futuras multidões. Eles veem na maravilha não apenas magnificência, mas faturas, direitos de transporte, quartos alugados e netos ainda cobrando taxas. O [tv_engineering_department|e] escuta com atenção, porque o comércio tem o talento de fazer com que a ambição pareça prática. O seu entusiasmo dá ao debate um novo impulso. A prosperidade chegou com dedos manchados de tinta e excelente aritmética."
 tv_engineering_department.102.a: "A prosperidade tem uma voz persuasiva."
 tv_engineering_department.103.t: "[tv_wonder_debate|E]：Comerciantes contam o custo"
 tv_engineering_department.103.d: "Alguns burgueses alertam agora que a maravilha irá prejudicar o trabalho, o crédito e o transporte. Eles não denunciam a glória abertamente; eles apenas perguntam quantos vagões, salários e armazéns devem ficar presos abaixo dele. Essa cautela é mais difícil de descartar do que o pânico, porque cada frase chega com uma coluna plausível de números. O [tv_engineering_department|e] sente a confiança do público diminuir gradativamente. Os livros contábeis podem ferir tão acentuadamente quanto os discursos quando lidos em voz alta."
 tv_engineering_department.103.a: "Os livros contábeis podem ferir tão acentuadamente quanto os discursos."
 tv_engineering_department.104.t: "[tv_wonder_debate|E]：Bênção Clerical"
 tv_engineering_department.104.d: "Clérigos proeminentes enquadram a maravilha como um sinal visível de ordem e devoção. Os sermões comparam a pedra medida às almas obedientes, os fundamentos estáveis à doutrina fiel e o trabalho público à disciplina de um povo justo. O [tv_engineering_department|e] se beneficia dessa linguagem mesmo quando os engenheiros, em particular, preferem linhas de prumo a metáforas. O debate ganha um tom solene e tranquilizador. [tv_wonder_domestic_support|E] sobe mais facilmente quando o céu parece aprovar os andaimes."
 tv_engineering_department.104.a: "Uma bênção útil."
 tv_engineering_department.105.t: "[tv_wonder_debate|E]：Sermões contra o excesso"
 tv_engineering_department.105.d: "Os pregadores condenam o projeto como uma vaidade revestida de pedra. Eles perguntam se uma aldeia faminta precisa de mármore, se a alma do governante pode ser salva pela altura e se o orgulho se torna sagrado apenas porque um pedreiro o mediu. A acusação encontra ouvintes entre aqueles que já estão preocupados com o custo. O [tv_engineering_department|e] pode responder a muitas objeções, mas os sermões são construídos para sobreviver a contra-argumentos. A fé pode abençoar os alicerces e também pode recusá-los."
 tv_engineering_department.105.a: "A fé também pode recusar o mármore."
 tv_engineering_department.200.t: "[tv_wonder_construction|E]：Uma unidade de construção concluída"
 tv_engineering_department.200.d: "Outra parte da maravilha ultrapassou um limiar visível. Os andaimes são baixados, os supervisores marcam a unidade concluída e os trabalhadores recuam com o orgulho cauteloso de quem sabe que a próxima tarefa será igualmente pesada. O público pode finalmente ver que o impossível está se tornando pedra, viga, canal ou abóbada. Até os críticos acham mais difícil zombar de algo que lança uma sombra. [tv_wonder_construction|E] obteve não apenas progresso, mas também provas.\n\n#weak Esta unidade de construção está completa - o Departamento de Engenharia continuará em direção à próxima unidade da maravilha.#!"
 tv_engineering_department.200.a: "Mantenha o trabalho em andamento."
 tv_engineering_department.201.t: "[tv_wonder_construction|E]：O Projeto Cresce"
 tv_engineering_department.201.d: "No [SCOPE.sLocation('tv_wonder_event_location').GetName], os quatro módulos concluídos cumpriram seu propósito. Suas obras temporárias agora podem ser desmanteladas e a construção pode finalmente começar no núcleo preservado da própria maravilha. Fundação, corpo, função e coroamento não são mais fragmentos concorrentes; eles estão prontos para serem dobrados em um único monumento.\n\n#weak Os quatro módulos se fundiram no núcleo da maravilha - observe o painel do Departamento de Engenharia, pois o edifício final começará a ser construído automaticamente assim que a maravilha atingir seu nível de conclusão.#!"
 tv_engineering_department.201.a: "Desmonte os módulos e levante o núcleo."
 tv_engineering_department.202.t: "[tv_wonder_construction|E]：Os suportes de trabalho estão completos"
 tv_engineering_department.202.d: "O [tv_engineering_department|E] declarou a fase de construção concluída. Os canteiros de obras são desmontados, as equipes de trabalho se retiram e os últimos livros de empreiteiros fecham com uma satisfação que só os contadores realmente desfrutam. O monumento está de pé, mas a pedra por si só ainda não é o destino. A questão inacabada mudou de como construí-lo para como consagrá-lo. O reino criou um corpo; o [tv_wonder_ceremony|e] deve agora dar-lhe uma alma pública.\n\n#weak A fase de construção está concluída - visite o Departamento de Engenharia para escolher um estilo de cerimônia de dedicação e iniciar a cerimônia da maravilha.#!"
 tv_engineering_department.202.a: "Prepare a cerimônia."
 tv_engineering_department.202.a.tt: "O $tv_wonder_labor_camp$ no canteiro de obras será demolido."
 tv_engineering_department.203.t: "[tv_wonder_construction|E]：O debate está resolvido"
 tv_engineering_department.203.d: "O tribunal anunciou o fim do debate maravilhoso. A oposição não desapareceu, mas foi contabilizada, respondida, comprada ou incluída no plano oficial. O projeto agora deixa os discursos para trás e entra no mundo medido de solo, estradas, declives e distâncias. O [tv_great_engineer|e] solicita um local para levantamento. Deste ponto em diante, [tv_wonder_domestic_support|e] irá drenar lentamente, então o próximo pedido deve ser prático: escolha onde o monumento pode realmente ficar.\n\n#weak O debate terminou - escolha um local de construção para a maravilha no Departamento de Engenharia para começar o levantamento e a construção.#!"
 tv_engineering_department.203.a: "Comece a pesquisa."
 tv_engineering_department.300.t: "[tv_wonder_survey|E]：Pesquisa concluída"
 tv_engineering_department.300.d_high: "O [tv_wonder_survey|E] retorna com leituras excelentes. O terreno escolhido pode suportar ambição, os suprimentos podem alcançá-lo e as equipes de trabalho veem um caminho através do terreno antes que o primeiro acampamento permanente seja erguido. O [tv_great_engineer|e] lê as tabelas duas vezes, não porque os números sejam duvidosos, mas porque boas notícias merecem verificação. Escala, logística e organização apontam agora na mesma direção. O site parece quase ansioso para se tornar difícil de maneiras úteis."
 tv_engineering_department.300.d_mid: "O [tv_wonder_survey|E] retorna com leituras utilizáveis. O site não tornará o trabalho fácil, mas nenhuma surpresa honesta jamais prometeu isso. O terreno tem limites, as estradas têm humores e o plano de trabalho precisará de disciplina em vez de romance. Ainda assim, o [tv_engineering_department|e] agora pode planejar os pontos fracos que nomeou. Um obstáculo medido já está meio domesticado."
 tv_engineering_department.300.d_low: "O [tv_wonder_survey|E] retorna com leituras preocupantes. O local ainda pode ser declarado, mas os mapas parecem nervosos e os topógrafos escolhem as palavras com cuidado profissional. O terreno, as rotas ou a organização laboral podem resistir à nossa ambição mais do que inicialmente esperado. O [tv_engineering_department|e] alerta que um local diferente pode atender melhor à maravilha. Prosseguir aqui seria uma decisão tomada com os olhos abertos, o que é melhor que a cegueira e mais caro que a confiança."
 tv_engineering_department.300.a: "Revise o resultado."
 tv_engineering_department.310.t: "[tv_wonder_survey|E]：Fundações Ocultas"
 tv_engineering_department.310.d: "Os topógrafos descobrem terreno estável e pedras antigas sob as obras propostas. O que antes parecia apenas sólido agora parece quase preparado, como se alguma mão esquecida tivesse deixado a terra em ordem útil. As equipes [tv_wonder_survey|e] discutem alegremente sobre carga, profundidade e o raro prazer de encontrar um problema que se resolveu sozinho. A escala possível da maravilha parece mais generosa do que se supunha inicialmente. Até mesmo o [tv_great_engineer|e] permite um sorriso antes de solicitar outra medição."
 tv_engineering_department.310.a: "Excelente."
 tv_engineering_department.311.t: "[tv_wonder_survey|E]：Terreno traiçoeiro"
 tv_engineering_department.311.d: "O terreno muda onde os primeiros mapas prometiam certeza. As apostas diminuem, as linhas de giz não concordam mais entre si e as equipes de pesquisa começam a falar em frases mais curtas. Apoios adicionais irão reduzir a escala prática desta maravilha, não porque a ambição tenha enfraquecido, mas porque a Terra respondeu com condições próprias. O [tv_engineering_department|e] ainda pode prosseguir. Deve simplesmente parar de fingir que a base é passiva."
 tv_engineering_department.311.a: "Ajuste os planos."
 tv_engineering_department.312.t: "[tv_wonder_survey|E]:Limpar linhas de abastecimento"
 tv_engineering_department.312.d: "O [tv_wonder_survey|E] encontra rotas que podem transportar pedras, madeira e ferramentas com menos atrito do que o esperado. Uma estrada abandonada se junta a uma curva utilizável de um rio, um campo de teste se mostra mais amplo do que a memória e os transportadores locais já conhecem atalhos que nenhum mapa real se preocupou em aprender. [tv_wonder_materials|E] se moverá de forma mais limpa porque o terreno ofereceu vários favores silenciosos. A logística, pela primeira vez, não chega como acusação. Chega como um mapa com boas margens."
 tv_engineering_department.312.a: "Marque-os com cuidado."
 tv_engineering_department.313.t: "[tv_wonder_survey|E]：Abordagens quebradas"
 tv_engineering_department.313.d: "Estradas, cursos de água e locais de preparação revelam-se piores do que afirmavam os primeiros relatórios. As rodas afundam onde a estrada deveria aguentar, os barcos perdem tempo onde a água deveria chegar e os campos de preparação encolhem no momento em que vagões reais entram neles. A logística será mais difícil de domar e [tv_wonder_materials|e] não perdoará o otimismo. O [tv_engineering_department|e] enfrenta agora a velha verdade das grandes obras: um monumento começa muito antes de a pedra chegar até ele. Às vezes começa com lama."
 tv_engineering_department.313.a: "Nós vamos compensar."
 tv_engineering_department.314.t: "[tv_wonder_survey|E]：Ordem no Campo"
 tv_engineering_department.314.d: "As equipes de medição estabelecem um ritmo limpo. Bandeiras são colocadas, notas são copiadas, os supervisores param de se contradizer e as observações aproximadas tornam-se um sistema que o trabalho futuro pode realmente obedecer. Esta não é uma descoberta dramática, mas pode ser mais útil do que uma. [tv_wonder_construction|E] depende do milagre monótono de muitas pessoas fazendo a mesma coisa na mesma ordem. Hoje, esse milagre parece possível."
 tv_engineering_department.314.a: "Um bom hábito."
 tv_engineering_department.315.t: "[tv_wonder_survey|E]：Confusão na pesquisa"
 tv_engineering_department.315.d: "Mapas contraditórios e superintendentes rivais retardam o trabalho. Uma equipe jura pelo cume, outra pela estrada, e uma terceira produziu uma tabela tão precisa que todos desconfiam dela imediatamente. O [tv_engineering_department|e] perde a confiança em seu plano organizacional futuro porque a confusão, uma vez escrita, parece quase oficial. A maravilha pode sobreviver a terrenos ruins com mais facilidade do que a um comando ruim. Antes do início do trabalho, alguém deve ensinar os mapas a concordar."
 tv_engineering_department.315.a: "Desembarace-o."
 tv_engineering_department.320.t: "[tv_wonder_survey|E]：Instrumentos Especiais Solicitados"
 tv_engineering_department.320.d: "Os topógrafos solicitam instrumentos caros e artesãos especializados. Eles falam de ângulos finos demais para a visão comum, testes de solo delicados demais para suposições e medições que tornariam a avaliação da escala do [tv_great_engineer|e] menos dependente do otimismo nobre. O tribunal ouve despesas; os engenheiros ouvem precisão. Financiá-los deverá melhorar a pesquisa, mas também ensinará a todos os futuros solicitantes que a precisão tem um preço. A recusa deixa as velhas ferramentas no lugar e os desconhecidos sorriem educadamente."
 tv_engineering_department.320.a: "Pague pela precisão."
 tv_engineering_department.320.b: "Contentar-se com o que temos."
 tv_engineering_department.321.t: "[tv_wonder_survey|E]：Prestígio de Experiência"
 tv_engineering_department.321.d: "O [tv_great_engineer|E] pede ao tribunal que apoie publicamente um método logístico controverso. A proposta promete um movimento mais rápido de [tv_wonder_materials|e], menos trabalhadores ociosos e exatamente o tipo de novidade que faz com que os supervisores conservadores comecem a pigarrear. Dar o prestígio do reino pode tornar o plano de abastecimento mais convincente. Se falhar, o constrangimento também será público. Grandes projetos muitas vezes pedem ao Estado que aposte antes que a primeira multidão entenda as regras."
 tv_engineering_department.321.a: "Aposte nosso nome nisso."
 tv_engineering_department.321.b: "Sem endosso público."
 tv_engineering_department.322.t: "[tv_wonder_survey|E]：Coordenação da Guilda"
 tv_engineering_department.322.d: "Os fornecedores urbanos podem ajudar a padronizar os registos dos inquéritos, mas esperam concessões em caso de perturbação. Seus funcionários entendem pesos, contagens, rotas e a tirania silenciosa de combinar uma lista com outra. O [tv_engineering_department|e] poderia usar essa competência, especialmente antes que o [tv_wonder_materials|e] começasse a se mover para valer. No entanto, cada concessão inscreve o comércio um pouco mais profundamente na memória do monumento. Podemos comprar ordem, mas a ordem lembrará quem a vendeu."
 tv_engineering_department.322.a: "Apoie-se nas guildas."
 tv_engineering_department.322.b: "Evite novas obrigações."
 tv_engineering_department.401.t: "[tv_wonder_ceremony|E]：A meditação começa"
 tv_engineering_department.401.d: "A maravilha completa é velada em silêncio. Padres, engenheiros e observadores reais retiram-se do espetáculo comum para que um ano de austeridade possa dar ao monumento o seu significado final. O [tv_wonder_ceremony|e] não começa com ruído, mas com a recusa deliberada dele. Até mesmo o [tv_engineering_department|e] deve aprender a ter paciência, pois nenhum cálculo pode apressar um ritual destinado a ensinar moderação. Os visitantes acham o silêncio enervante no início. Então eles começam a abaixar a voz antes de entenderem o porquê."
 tv_engineering_department.401.a: "Deixe o ano virar."
 tv_engineering_department.410.t: "[tv_wonder_ceremony|E]：Enviados solicitados"
 tv_engineering_department.410.d: "Um tribunal vizinho pede que enviemos um emissário para testemunhar a inauguração do seu grande eixo. O convite é cerimonial, mas é nas cerimônias que os estados praticam ser lembrados. A assistência colocará o nosso nome entre aqueles que viram primeiro o novo monumento, aplaudiram no momento certo e compreenderam a mensagem sem necessidade de explicação. Recusar salvaria a jornada e perderia o lugar em sua história. Algumas pedras são construídas em casa; outros esperam testemunhas do exterior."
 tv_engineering_department.410.a: "Envie o emissário."
 tv_engineering_department.410.b: "Recuse o convite."
 tv_engineering_department.411.t: "[tv_wonder_ceremony|E]：Um Emissário Chega"
 tv_engineering_department.411.d: "O tribunal convidado aceitou. Outro emissário estrangeiro junta-se à procissão ritual com dignidade ensaiada, uma comitiva viajante e olhos treinados para perceber tanto a grandeza como a fraqueza. O [tv_wonder_ceremony|e] fica mais convincente a cada testemunha externa, porque a glória é mais alta quando repetida em outro sotaque. Os mestres da procissão ajustam a ordem de entrada; escribas ajustam a lista de convidados de honra. O progresso cerimonial da maravilha avança, uma corte por vez."
 tv_engineering_department.411.a: "Receba-os com honra."
 tv_engineering_department.412.t: "[tv_wonder_ceremony|E]：Convite recusado"
 tv_engineering_department.412.d: "O tribunal convidado recusou-se a enviar um emissário. A resposta deles é educada o suficiente para evitar insultos e fria o suficiente para ser lembrada. O [tv_wonder_ceremony|e] deve encontrar o seu público noutro lugar, pois um monumento que procura admiração estrangeira não pode permitir-se um lugar diplomático vazio. Os cortesãos já sugerem novos nomes, rotas mais lisonjeiras e cartas que soam menos como pedidos. Glory não gosta de recusa, mas pode ser redirecionada."
 tv_engineering_department.412.a: "Convide outro vizinho."
 tv_engineering_department.421.t: "[tv_wonder_ceremony|E]：Começa a Parada do Triunfo"
 tv_engineering_department.421.d: "Bandeiras são hasteadas ao longo do eixo, mas o desfile ainda carece de comprovação. Os bateristas podem ensaiar, os cavalos podem polir as pedras com cascos cerimoniais e os oficiais podem se organizar com uma bela confiança, mas nada disso é vitória. O [tv_wonder_ceremony|e] exige um triunfo que a própria guerra deve certificar. Até então, a Cidade Militar está vestida com uma honra que não mereceu integralmente. Só a vitória na guerra dará ao monumento a memória que ele pede."
 tv_engineering_department.421.a: "Então a vitória deve vir."
 tv_engineering_department.431.t: "[tv_wonder_ceremony|E]：Começa o Festival Cívico"
 tv_engineering_department.431.d: "A cidade abre suas praças ordenadas para um ano de cerimônias, jogos, procissões e instrução pública. Os workshops são lentos, mas as pessoas aprendem a forma da disciplina cívica percorrendo-a, observando-a e queixando-se dela até parecer familiar. O [tv_wonder_ceremony|e] transforma o espaço urbano em uma lição repetida a céu aberto. As crianças memorizam os percursos antes de compreenderem os slogans. A Capital Cívica está ensinando obediência tornando-a festiva."
 tv_engineering_department.431.a: "Deixe os cidadãos se reunirem."
 tv_engineering_department.461.t: "[tv_wonder_ceremony|E]：Começa o Festival de Livre Comércio"
 tv_engineering_department.461.d: "Comerciantes, enviados e corretores enchem o porto com promessas de troca aberta. A receita diminui por um tempo, porque a generosidade sempre parece mais nobre antes de as contas serem encerradas. O [tv_wonder_ceremony|e] transforma cais, armazéns e mesas lotadas em palco de confiança estrangeira. Cada contrato assinado em público ensina o porto a falar uma língua que os tribunais distantes entendem. Durante um ano, o lucro diminui para que a reputação possa passar."
 tv_engineering_department.461.a: "Abra o cais."
 tv_engineering_department.471.t: "[tv_wonder_ceremony|E]：Começa o Festival dos Ancestrais"
 tv_engineering_department.471.d: "A necrópole entra em um ano de incenso, genealogias e luto comedido. Os nomes são recitados até parecerem mais pesados do que os corpos aos quais pertenceram, e as oficinas ficam lentas enquanto a memória tem prioridade sobre a produção. O [tv_wonder_ceremony|e] ensina o reino a tratar a ancestralidade como arquitetura. Cada oferta coloca mais uma pedra no argumento de que os vivos são governados pelos mortos ordenados. O luto, quando organizado, torna-se autoridade."
 tv_engineering_department.471.a: "Deixe os ancestrais se reunirem."
 tv_engineering_department.481.t: "[tv_wonder_ceremony|E]：A Guilda dos Navegadores começa"
 tv_engineering_department.481.d: "Pilotos, cartógrafos, mestres de cordas e funcionários do porto vigiam sua guilda sob o farol. Eles chegam com cartas marítimas, nós, discussões sobre precedência e a confiança peculiar de pessoas que conseguem ler o litoral em mau tempo. O farol não estará completo até que sua instituição esteja de pé. Só uma luz avisa os navios; uma guilda ensina um país como entender o aviso. O [tv_wonder_ceremony|e] agora espera pela burocracia com sal nos cabelos."
 tv_engineering_department.481.a: "Construa a guilda."
 tv_engineering_department.491.t: "[tv_wonder_ceremony|E]：Começa o Festival da Água"
 tv_engineering_department.491.d: "Os canais são enfeitados com guirlandas, as comportas são abençoadas e as oficinas são silenciadas para um ano de ritos aquáticos. A água é feita para parecer obediente, o que qualquer pessoa que já assistiu a uma inundação sabe que é uma afirmação teológica ousada. A produção se curva para que o complexo possa reivindicar a ordem sagrada por meio do [tv_wonder_ceremony|e]. Os engenheiros observam os padres abençoarem o que prefeririam inspecionar, e os padres observam os engenheiros medirem o que prefeririam santificar. Entre eles, a água continua se movendo."
 tv_engineering_department.491.a: "Deixe as águas virarem."
 tv_engineering_department.501.t: "[tv_wonder_ceremony|E]：Início da drenagem profunda"
 tv_engineering_department.501.d: "Os engenheiros conduzem as obras de drenagem para baixo, até a cidade mineira. Os poços ficarão quase silenciosos durante um ano enquanto bombas, suportes e canais conquistam as profundezas. Os mineiros detestam o silêncio quase tanto quanto a água, mas ambos devem ser suportados antes que riquezas mais profundas possam ser reivindicadas. O [tv_wonder_ceremony|e] aqui não é gentil; é uma barganha com a escuridão, a umidade e a paciência. Quando as obras finalmente respirarem, a cidade saberá até onde pode chegar abaixo do medo."
 tv_engineering_department.501.a: "Drene o escuro."
 tv_engineering_department.511.t: "[tv_wonder_ceremony|E]：O catálogo Star começa"
 tv_engineering_department.511.d: "O observatório se fecha em torno de lâmpadas, mesas e insônia disciplinada. Os astrónomos marcam uma estrela após a outra, não como luzes dispersas, mas como entradas numa ordem pública que os futuros estudiosos podem testar. A legislação desacelera enquanto o tribunal presta atenção ao céu e aos instrumentos. O [tv_wonder_ceremony|e] não terminará em espetáculo hoje; terminará quando os céus forem copiados com paciência suficiente para se tornarem úteis."
 tv_engineering_department.511.a: "Deixe-os contar o céu."
 tv_engineering_department.521.t: "[tv_wonder_ceremony|E]：Começa a Proclamação do Eclipse"
 tv_engineering_department.521.d: "O observatório emitiu a sua previsão: um eclipse chegará e o tribunal estará pronto para nomeá-lo antes que o medo possa nomeá-lo primeiro. Sacerdotes, estudiosos, marinheiros e céticos olham agora para cima com esperanças diferentes. Cada mês que passa testa a afirmação. Se o céu obedecer às tabelas, o [tv_wonder_ceremony|e] se tornará a prova de que o reino pode ler o céu sem se render a ele."
 tv_engineering_department.521.a: "Observe os céus."
 tv_engineering_department.522.t: "[tv_wonder_ceremony|E]：O Eclipse chega"
 tv_engineering_department.522.d: "A luz muda exatamente onde o observatório disse que mudaria. As multidões ficam em silêncio, mas o silêncio não é de pânico; os arautos já lhes contaram o que as tábuas eruditas predizem. O [tv_wonder_ceremony|e] torna-se uma certeza pública no espaço entre o sol, a sombra e a respiração. Quando a luz regressa, o tribunal não se limita a reivindicar sabedoria. Ele demonstrou timing, coragem e domínio da admiração."
 tv_engineering_department.522.a: "Deixe o reino se lembrar da previsão."
 tv_engineering_department.531.t: "[tv_wonder_ceremony|E]：Homenagem Recebida"
 tv_engineering_department.531.d: "Outra contribuição temática entra no Palácio das Nações. É exibido com cuidado polido: não apenas riqueza, mas uma discussão sobre posição social tornada visível a todos os enviados que passam pelo salão. A galeria de tributos fica mais persuasiva a cada oferta porque a subordinação, assim como a glória, fica mais fácil de acreditar quando se trata de arquitetura. A cerimônia promove um ato medido de obediência por vez."
 tv_engineering_department.531.a: "Grave a homenagem."
 tv_engineering_department.541.t: "[tv_wonder_ceremony|E]：Começa o Bairro das Embaixadas"
 tv_engineering_department.541.d: "As fundações estão marcadas para o bairro das embaixadas ao lado do Palácio das Nações. As casas estrangeiras ganharão portas, pátios, passagens de empregados e todas as pequenas dignidades práticas que fazem da diplomacia uma presença diária e não uma visita ocasional. O [tv_wonder_ceremony|e] agora aguarda em um distrito construído para outros tribunais habitarem. Um palácio pode chamar a atenção; um bairro da embaixada ensina a atenção a permanecer."
 tv_engineering_department.541.a: "Construa lugares para olhares estrangeiros."
 tv_engineering_department.500.t: "[tv_wonder_ceremony|E]：O projeto é inaugurado"
 tv_engineering_department.500.d: "O [tv_engineering_department|E] completou o [tv_wonder_ceremony|e], e o monumento agora é um sinal permanente da ambição do reino. Os andaimes desapareceram, os livros-razão foram lacrados e o público começou o trabalho que nenhum engenheiro pode terminar: decidir o que significa a maravilha. Alguns chamarão isso de glória, alguns de excesso, alguns de prova de que a época mudou. Todos eles terão que olhar para isso. Isso já é uma forma de vitória."
 tv_engineering_department.500.a: "Deixe a idade se lembrar disso."
 tv_engineering_department.600.t: "[tv_wonder_construction|E]：Uma maravilha do mundo foi concluída"
 tv_engineering_department.600.d: "Chegam notícias de [SCOPE.sCountry('tv_wonder_builder_country').GetName]: uma maravilha do mundo foi concluída em [SCOPE.sLocation('tv_wonder_completed_site').GetName]. Os relatórios divergem quanto ao custo, beleza, propósito e sabedoria, mas concordam num ponto. O trabalho é muito grande para permanecer local. Entrou na conversa comum dos governantes."
 tv_engineering_department.600.a: "O mundo ouviu."

