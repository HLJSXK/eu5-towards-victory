 TV_ENGINEERING_ORG_LOG_HELP_ORGANIZATION_TEXT_1: "A velocidade do [tv_wonder_construction|e] depende do número de [ShowBuildingTypeName('tv_wonder_labor_camp')]s efetivos."
 TV_ENGINEERING_ORG_LOG_HELP_ORGANIZATION_TEXT_2: "Cada [ShowBuildingTypeName('tv_wonder_labor_camp')] operacional fornece #P 1000#! progresso [tv_wonder_construction|e] mensal."
 TV_ENGINEERING_ORG_LOG_HELP_ORGANIZATION_TEXT_3: "O progresso mensal da construção é modificado ainda mais pelo [tv_wonder_logistics_competence|e] do local."
 TV_ENGINEERING_ORG_LOG_HELP_ORGANIZATION_TEXT_4: "Cada [ShowBuildingTypeName('tv_wonder_labor_camp')] operacional custa cerca de #N 25#!@gold! em manutenção mensal."
 TV_ENGINEERING_ORG_LOG_HELP_ORGANIZATION_TEXT_5: "O limite [ShowBuildingTypeName('tv_wonder_labor_camp')] depende do [tv_wonder_organization_competence|e] do local."
 TV_ENGINEERING_ORG_LOG_HELP_LOGISTICS_TEXT_1: "[ShowBuildingTypeName('tv_wonder_material_dispatch_point')] transforma materiais básicos em [ShowGoodsName('tv_wonder_materials')]."
 TV_ENGINEERING_ORG_LOG_HELP_LOGISTICS_TEXT_2: "A escassez de [ShowGoodsName('tv_wonder_materials')] aumenta a manutenção de [ShowBuildingTypeName('tv_wonder_labor_camp')]; escassez severa reduz o rendimento."
 TV_ENGINEERING_ORG_LOG_HELP_LOGISTICS_TEXT_3: "Os países com IA podem construir [ShowBuildingTypeName('tv_wonder_material_dispatch_point')], portanto as importações são viáveis."
