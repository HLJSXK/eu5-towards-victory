 tv_engineering_department.551.t: "[tv_wonder_ceremony|E]：Os estudiosos se reúnem"
 tv_engineering_department.551.d: "A Cidade Universitária abaixa sua voz no estudo. Mestres, estudantes, copistas e funcionários reúnem-se em torno de listas de palestras e leituras disputadas, transformando as ruas concluídas numa convocação que dura um ano. O [tv_wonder_ceremony|e] não será apressado. Ele pede ao reino que troque a velocidade administrativa por um plano de estudos que possa durar mais que o tribunal atual."
 tv_engineering_department.551.a: "Deixe os estudiosos levarem o seu ano."
 tv_engineering_department.552.t: "[tv_wonder_ceremony|E]：Começa o Salão Colegiado"
 tv_engineering_department.552.d: "As plantas do Collegiate Hall estão seladas ao lado da Cidade Universitária. O novo salão dará aos mestres um lugar para discutir formalmente, aos estudantes um lugar para se tornarem menos seguros em aspectos úteis, e à coroa uma estrutura através da qual a aprendizagem pode ser reconhecida sem ser totalmente domesticada. O [tv_wonder_ceremony|e] agora aguarda portas, bancos, estatutos e um teto sob o qual o estudo pode reivindicar permanência."
 tv_engineering_department.552.a: "Construa uma casa para discussão."
 tv_engineering_department.561.t: "[tv_wonder_ceremony|E]：A cúpula está velada"
 tv_engineering_department.561.d: "A grande cúpula está velada para consagração. Os padres marcam os limiares, os cantores ensaiam a ordem comedida de reverência e o tribunal aceita um ano em que a legitimidade deve mover-se mais lentamente para que a santidade possa mover-se com cuidado. O [tv_wonder_ceremony|e] pede ao reino que espere sob um céu coberto até que o templo esteja pronto para abrir seus céus."
 tv_engineering_department.561.a: "Deixe a cúpula ser santificada."
 tv_engineering_department.571.t: "[tv_wonder_ceremony|E]：A Escada do Peregrino se abre"
 tv_engineering_department.571.d: "A escada do templo da torre é dada aos peregrinos durante um ano de subida, pausa, canto e pés doloridos. As oficinas reclamam quando o trabalho se curva em direção às procissões, mas o [tv_wonder_ceremony|e] foi criado para ensinar altura por meio do esforço. Cada passo transforma a torre de objeto em rota, e cada rota torna a devoção visível."
 tv_engineering_department.571.a: "Deixe-os subir."
 tv_engineering_department.572.t: "[tv_wonder_ceremony|E]：A Escola do Templo começa"
 tv_engineering_department.572.d: "Professores, secretários e construtores marcam os alicerces de uma escola do templo abaixo da torre. O [tv_wonder_ceremony|e] agora atende salas de aula onde a doutrina pode se tornar hábito, alfabetização e discussão disciplinada por ritual. Uma torre pode atrair os olhos para cima; uma escola ensinará às vozes o que dizer quando olham."
 tv_engineering_department.572.a: "Construa a escola."
 tv_engineering_department.581.t: "[tv_wonder_ceremony|E]：Começa a Feira do Rio"
 tv_engineering_department.581.d: "Barracas, barcaças, mesas de pedágio e faixas de festivais se reúnem ao longo do rio alargado. O comércio desacelera à medida que se pede ao rio que se torne espetáculo antes de voltar a ser artéria. O [tv_wonder_ceremony|e] passará um ano fazendo com que comerciantes, barqueiros e autoridades realizem juntos a nova ordem da água."
 tv_engineering_department.581.a: "Deixe o rio conhecer seu novo público."
 tv_engineering_department.582.t: "[tv_wonder_ceremony|E]：O Canal Office começa"
 tv_engineering_department.582.d: "Os topógrafos marcam um escritório permanente para a autoridade do canal. O edifício não será suficientemente grande para rivalizar com as obras fluviais, e é precisamente por isso que é importante: eclusas, disputas, portagens, reparações e reclamações durante a estação seca precisam de um lugar onde a responsabilidade não possa esconder-se. O [tv_wonder_ceremony|e] agora aguarda a administração para adquirir paredes."
 tv_engineering_department.582.a: "Dê uma mesa ao rio."
 tv_engineering_department.591.t: "[tv_wonder_ceremony|E]：O Escritório do Almirantado começa"
 tv_engineering_department.591.d: "O estaleiro reserva terreno para um escritório do almirantado. Lançamentos e guindastes podem construir navios, mas as frotas também exigem ordens, cartas, inspeções e funcionários com paciência para fazer com que a madeira se torne política. O [tv_wonder_ceremony|e] agora espera que o estaleiro ganhe uma mente naval."
 tv_engineering_department.591.a: "Construa o escritório."
 tv_engineering_department.601.t: "[tv_wonder_ceremony|E]：Bastiões sob julgamento"
 tv_engineering_department.601.d: "A Star Fortress City começa um ano de provações. Engenheiros testam ângulos, artilheiros testam campos de tiro e trabalhadores descobrem que uma parede projetada para a matemática ainda precisa ser paga com músculos. A produção diminui à medida que o [tv_wonder_ceremony|e] ensina a fortaleza a responder à teoria com pedra."
 tv_engineering_department.601.a: "Teste todos os ângulos."
 tv_engineering_department.602.t: "[tv_wonder_ceremony|E]：Começa o trimestre do Arsenal"
 tv_engineering_department.602.d: "As fundações estão marcadas para um bairro de arsenal dentro da cidade-fortaleza. Ele unirá oficinas de reparos, depósitos de pólvora e pátios de coleta em um distrito disciplinado. O [tv_wonder_ceremony|e] agora aguarda na parte da fortaleza que torna a defesa repetível após o primeiro alarme desaparecer."
 tv_engineering_department.602.a: "Construa o bairro do arsenal."
 tv_engineering_department.611.t: "[tv_wonder_ceremony|E]：Incêndios de sinalização estão acesos"
 tv_engineering_department.611.d: "Observe os postes ao longo da parede iniciando um ano de prática de sinalização. Fumaça, chamas, passageiros e mercados locais se curvam ao novo ritmo, e o comércio sofre enquanto cada rota aprende a perceber os avisos primeiro. O [tv_wonder_ceremony|e] torna a vigilância pública o suficiente para que até mesmo as viagens de rotina pareçam observadas."
 tv_engineering_department.611.a: "Mantenha o relógio brilhante."
 tv_engineering_department.621.t: "[tv_wonder_ceremony|E]：Início do Salão dos Mestres Armeiros"
 tv_engineering_department.621.d: "O arsenal marca as bases para um salão de mestres armeiros. Os maiores depósitos de armas não podem depender apenas de ferro e livros-razão; eles precisam de mãos habilidosas, capazes de julgar as falhas antes da batalha. O [tv_wonder_ceremony|e] agora aguarda que a embarcação adquira uma corte permanente."
 tv_engineering_department.621.a: "Construa para os mestres."
 tv_engineering_department.631.t: "[tv_wonder_ceremony|E]：Começa o Catálogo Nacional"
 tv_engineering_department.631.d: "A Biblioteca da Nação inicia seu catálogo. Os estudiosos fecham portas, desenrolam inventários e retardam a máquina legislativa do país enquanto ensinam a memória a encontrar-se novamente. O [tv_wonder_ceremony|e] não é um desfile, mas um índice: silencioso, preciso e poderoso depois de concluído."
 tv_engineering_department.631.a: "Deixe o catálogo crescer."
 tv_engineering_department.632.t: "[tv_wonder_ceremony|E]：Início do Escritório de Depósito Legal"
 tv_engineering_department.632.d: "Os construtores marcam o escritório de depósito legal ao lado da biblioteca. A partir daqui, livros, decretos, cópias e argumentos serão reunidos não como favores, mas como obrigações. O [tv_wonder_ceremony|e] agora aguarda a sala onde a memória escrita do realm irá parar dependendo do acidente."
 tv_engineering_department.632.a: "Construa o escritório da memória."

