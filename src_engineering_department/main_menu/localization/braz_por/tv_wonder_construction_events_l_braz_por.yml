 tv_engineering_department.7000.t:0 "Construção: As ruas aplaudem o local"
 tv_engineering_department.7000.d:0 "Alguns sucessos visíveis em cima do muro transformam a curiosidade em orgulho. Os anciões da guilda emprestam nomes, os vizinhos param de tratar as obras como uma vaidade real e o projeto ganha uma posição mais forte sobre [tv_wonder_domestic_support|E]."
 tv_engineering_department.7000.a:0 "Permite que a nova boa vontade dos anciões da guilda leve o trabalho adiante."
 tv_engineering_department.7001.t:0 "Construção: Uma Linha Mais Ampla na Terra"
 tv_engineering_department.7001.d:0 "Novas medições revelam terrenos que podem suportar uma pegada mais ampla. O que parecia ambição em pergaminho agora tem uma base tolerável e [tv_wonder_scale_competence|E] dá um salto adiante."
 tv_engineering_department.7001.a:0 "Reivindica o terreno mais amplo que a pesquisa acabou de provar."
 tv_engineering_department.7002.t:0 "Construção:Nomes e pedidos se encaixam"
 tv_engineering_department.7002.d:0 "O pátio acorda com novas escalações. As tripulações sabem onde se posicionar, os funcionários sabem qual contagem é importante e o [tv_wonder_organization_competence|E] aumenta porque a confusão tem menos lugares para se esconder."
 tv_engineering_department.7002.a:0 "Fixamos as novas escalações antes que a confusão volte."
 tv_engineering_department.7003.t:0 "Construção: Estradas e carrinhos encontram seu ritmo"
 tv_engineering_department.7003.d:0 "Uma rota melhor liga estrada, água, armazém e andaime. O primeiro comboio a usá-lo chega quase embaraçosamente na hora certa e o [tv_wonder_logistics_competence|E] surge."
 tv_engineering_department.7003.a:0 "Mantenha esses carrinhos rolando na hora certa!"
 tv_engineering_department.7004.t:0 "Construção: A pedra ultrapassa o marco"
 tv_engineering_department.7004.d:0 "A parte ativa ultrapassa sua marca antes que a luz falhe. Nenhum milagre explica isso; os elevadores, articulações e ponteiros simplesmente se encontram na hora certa, impulsionando o progresso do [tv_wonder_construction|E]."
 tv_engineering_department.7004.a:0 "Permite que os elevadores ultrapassem a marca."
 tv_engineering_department.7005.t:0 "Construção: Street Talk Turns"
 tv_engineering_department.7005.d:0 "O ruído ao redor do local diminui. Não é aclamação, mas é permissão suficiente para que as carroças passem e as discussões terminem mais cedo; [tv_wonder_domestic_support|E] aumenta por uma margem útil."
 tv_engineering_department.7005.a:0 "Deixa os carrinhos passarem e as discussões cessarem."
 tv_engineering_department.7006.t:0 "Construção: A medida está corrigida"
 tv_engineering_department.7006.d:0 "Um ângulo estreito é redesenhado, um caminho de serviço é alargado e a linha principal do monumento respira novamente. A melhoria no [tv_wonder_scale_competence|E] é pequena, mas real."
 tv_engineering_department.7006.a:0 "Amplia o caminho e deixa o design respirar."
 tv_engineering_department.7007.t:0 "Construção: O pátio aprende seu ritmo"
 tv_engineering_department.7007.d:0 "Um conjunto de transferências perdidas é reparado. O trabalho é muito árido para cerimônia, mas mantém as ferramentas em movimento e melhora o [tv_wonder_organization_competence|E]."
 tv_engineering_department.7007.a:0 "Corrigimos a transferência e mantemos as ferramentas em movimento."
 tv_engineering_department.7008.t:0 "Construção：Ruts encontram uma estrada melhor"
 tv_engineering_department.7008.d:0 "Uma falha na linha de abastecimento é corrigida. Menos carrinhos esperam vazios, menos cargas chegam quebradas e o [tv_wonder_logistics_competence|E] melhora."
 tv_engineering_department.7008.a:0 "Endireita a curva ruim antes que mais cargas quebrem."
 tv_engineering_department.7009.t:0 "Construção: Conclusão do desenho dos martelos próximo"
 tv_engineering_department.7009.d:0 "Uma junta teimosa finalmente se encaixa, e a próxima equipe pode começar sem mais um mês de espera. O progresso do [tv_wonder_construction|E] avança da maneira mais satisfatória: visivelmente."
 tv_engineering_department.7009.a:0 "Enfim, cabe!"
 tv_engineering_department.7010.t:0 "Construção: Pão Dinheiro no Portão"
 tv_engineering_department.7010.d:0 "Uma multidão se reúne no portão, murmurando que o prodígio come pão destinado aos pobres. Se o tesouro abrir seu [gold|E] à vista da rua e pagar agora, as reclamações se acalmariam e o [tv_wonder_domestic_support|E] subiria – mas a moeda não voltaria."
 tv_engineering_department.7010.a:0 "Pague à vista da multidão."
 tv_engineering_department.7010.b:0 "Os livros-razão são bastante escassos sem uma distribuição pública."
 tv_engineering_department.7011.t:0 "Construção：Um Pregador Questiona o Direito da Coroa"
 tv_engineering_department.7011.d:0 "Um pregador local diz ao seu rebanho que a maravilha se baseia no orgulho, e não em qualquer direito que a coroa tenha de exigi-lo. Colocar o [legitimacy|E] real por trás de um decreto escrito resolveria o assunto e estabilizaria o [tv_wonder_domestic_support|E], antes que o sermão se espalhasse ainda mais."
 tv_engineering_department.7011.a:0 "Sele o decreto e deixe a palavra da coroa encerrar o assunto."
 tv_engineering_department.7011.b:0 "Um decreto real sobre as queixas de um pregador parece fraqueza, não força."
 tv_engineering_department.7012.t:0 "Construção:A estrada da pedreira divide um campo comum"
 tv_engineering_department.7012.d:0 "A nova estrada da pedreira atravessa os campos comuns de duas aldeias. Gastar [stability|E] para forçar o reassentamento limparia a estrada e levantaria [tv_wonder_domestic_support|E] entre aqueles que querem que a maravilha terminasse - ao custo da paz adquirida com essas aldeias."
 tv_engineering_department.7012.a:0 "Ordene o reassentamento e deixe a estrada passar."
 tv_engineering_department.7012.b:0 "Os campos de duas aldeias não valem um percurso mais curto de carroça."
 tv_engineering_department.7013.t:0 "Construção: Enviados estrangeiros zombam do projeto Vanity"
 tv_engineering_department.7013.d:0 "Enviados de uma corte rival consideram a maravilha um projeto de vaidade grande demais para o tesouro que está por trás dele. Gastar [prestige|E] em uma recepção luxuosa poderia mudar a história que eles levam para casa e aumentar [tv_wonder_domestic_support|E] - mas a posição da coroa, uma vez gasta para lisonjear convidados, não é facilmente recarregada."
 tv_engineering_department.7013.a:0 "Gaste na recepção e troque o que os enviados levam para casa."
 tv_engineering_department.7013.b:0 "Não vale a pena gastar a posição da coroa em fofocas estrangeiras."
 tv_engineering_department.7014.t:0 "Construção: A caçada de um nobre se transforma em um depósito de madeira"
 tv_engineering_department.7014.d:0 "Os pedreiros da maravilha querem um trecho de caçada nobre para preparar sua madeira. Ele irá concedê-lo, mas apenas como um favor que a coroa deve contar contra [estate_satisfaction|E] entre os nobres - gasto agora, ainda levantaria [tv_wonder_domestic_support|E] assim que a madeira começar a se mover."
 tv_engineering_department.7014.a:0 "Conceda o favor e tome o terreno da madeira."
 tv_engineering_department.7014.b:0 "A boa vontade de um nobre não vale a pena ter uma dívida com ele."
 tv_engineering_department.7015.t:0 "Construção：O Sino Paroquial é Pedido pelo seu Bronze"
 tv_engineering_department.7015.d:0 "Os fundadores da maravilha querem requisitar o sino paroquial para remodelação. O padre desviará o olhar de uma torre sineira vazia, mas ela custa [estate_satisfaction|E] entre o clero – um preço que ainda deixaria [tv_wonder_domestic_support|E] em melhor situação do que um cadafalso inacabado."
 tv_engineering_department.7015.a:0 "Pergunte corretamente e deixe a campainha ir para a fundição."
 tv_engineering_department.7015.b:0 "Uma torre sineira vazia atrairá mais comentários do que os acessórios valem."
 tv_engineering_department.7016.t:0 "Construção: Carrinhos de abastecimento obstruem a praça do mercado"
 tv_engineering_department.7016.d:0 "Os carrinhos de abastecimento da maravilha continuam bloqueando a praça do mercado nos dias de entrega. Os mestres da guilda redirecionarão suas próprias barracas ao redor das carroças, mas isso atrairá [estate_satisfaction|E] entre os burgueses – um custo que ainda compraria de volta alguns [tv_wonder_domestic_support|E] quando a praça parasse de lutar contra as carroças."
 tv_engineering_department.7016.a:0 "Pergunte diretamente às guildas e deixe os carrinhos passarem."
 tv_engineering_department.7016.b:0 "Multar os carroceiros é mais simples do que pedir favores às guildas."
 tv_engineering_department.7017.t:0 "Construção: O Corvee é mantido após a colheita"
 tv_engineering_department.7017.d:0 "O capataz quer que as turmas de corvee sejam retidas depois da colheita para terminar as fundações antes da geada. Os anciãos da aldeia concordarão, mas custa [estate_satisfaction|E] entre os camponeses - gasto agora, ainda deixaria [tv_wonder_domestic_support|E] mais alto do que uma fundação deixada meio cavada durante o inverno."
 tv_engineering_department.7017.a:0 "Diga isso claramente e mantenha as gangues além da colheita."
 tv_engineering_department.7017.b:0 "A colheita não pode esperar nos alicerces."
 tv_engineering_department.7018.t:0 "Construção: Uma fileira de cortiços atrapalha"
 tv_engineering_department.7018.d:0 "Os pedreiros dizem que o local é muito apertado para erguer a próxima fiada sem demolir o cortiço ao lado. Encomendá-lo imediatamente reduziria o [development|E] no local à medida que os edifícios se desfizessem, mas permitiria que o trabalho - e o [tv_wonder_domestic_support|E] com ele - avançasse novamente."
 tv_engineering_department.7018.a:0 "Encomende a linha arrasada e amplie o terreno."
 tv_engineering_department.7018.b:0 "É mais fácil viver num local apertado do que numa rua cheia de inquilinos despejados."
 tv_engineering_department.7019.t:0 "Construção: Curvas Comerciais Comuns para o Local"
 tv_engineering_department.7019.d:0 "Carroceiros e pedreiros locais foram retirados de seu comércio habitual para manter o local abastecido. Deixar isso continuar iria sangrar [prosperity|E] no local à medida que os negócios comuns diminuíssem - mas as entregas mais constantes ainda seriam vistas como [tv_wonder_domestic_support|E] que vale a pena ter."
 tv_engineering_department.7019.a:0 "Que o comércio local continue inclinado para as obras."
 tv_engineering_department.7019.b:0 "A cidade precisa mais do seu comércio normal do que o local precisa de entregas mais rápidas."
 tv_engineering_department.7020.t:0 "Construção: A ponte da capital espera pelos seus pedreiros"
 tv_engineering_department.7020.d:0 "Os reparos da ponte na capital foram paralisados porque seus pedreiros foram atraídos para a maravilha. Mantê-los lá custaria [development|E] na capital, já que a ponte está inacabada, mas manteria o progresso da maravilha – e [tv_wonder_domestic_support|E] – em movimento."
 tv_engineering_department.7020.a:0 "Mantenha os pedreiros atentos e deixe a ponte esperar."
 tv_engineering_department.7020.b:0 "A própria ponte da capital não pode esperar a programação da maravilha."
 tv_engineering_department.7021.t:0 "Construção：Agentes compram madeira da capital"
 tv_engineering_department.7021.d:0 "Os agentes da maravilha estão a comprar madeira e pedra a preços que o mercado normal não consegue igualar. Deixar a compra continuar drenaria [prosperity|E] na capital à medida que o comércio diminuísse no local, mas manteria as obras fornecidas e [tv_wonder_domestic_support|E] com elas."
 tv_engineering_department.7021.a:0 "Deixe a compra continuar e alimente o site."
 tv_engineering_department.7021.b:0 "Os próprios mercados da capital não deveriam ser esgotados por causa de um único projecto."
 tv_engineering_department.7022.t:0 "Construção: Propõe-se um turno noturno dobrado"
 tv_engineering_department.7022.d:0 "O feitor quer que o turno da noite seja duplicado para compensar os dias perdidos com a última geada. Encomendá-lo desgastaria o trabalho do [population|E] no local, pois as horas extras cobrariam seu preço, mas levaria o trabalho adiante e aumentaria o [tv_wonder_domestic_support|E] com ele."
 tv_engineering_department.7022.a:0 "Duplique os turnos e impulsione o trabalho."
 tv_engineering_department.7022.b:0 "Trabalhadores exaustos constroem mais lentamente do que os descansados."
 tv_engineering_department.7023.t:0 "Construção: Uma base mais ampla na mesa do tesoureiro"
 tv_engineering_department.7023.d:0 "O chefe dos pedreiros estabelece um plano de base mais amplo na mesa do tesoureiro, alegando que o terreno será ocupado se cursos extras forem feitos antes das chuvas de outono. O tesoureiro pode liberar o ouro para a pedra e as mãos adicionadas agora, ou o plano aguarda a pesquisa do próximo ano."
 tv_engineering_department.7023.a:0 "Solte o ouro e deixe os pedreiros estabelecerem uma base mais ampla antes das chuvas."
 tv_engineering_department.7023.b:0 "Segure a moeda; as chuvas ainda estarão lá na próxima primavera."
 tv_engineering_department.7024.t:0 "Construção: As estacas de pesquisa param em uma cerca"
 tv_engineering_department.7024.d:0 "As estacas do agrimensor param na cerca de um vizinho, e o vizinho se recusa a deixá-las passar. Um mandado real estabeleceria a fronteira hoje, mas invocar o nome da coroa sobre uma sebe disputada não passará despercebido."
 tv_engineering_department.7024.a:0 "Envie o mandado e coloque o nome da coroa atrás da borda mais larga."
 tv_engineering_department.7024.b:0 "Deixe a cerca permanecer; o nome da coroa não é gasto em disputas de hedge."
 tv_engineering_department.7025.t:0 "Construção: O Plano Mais Amplo Cruza o Comum"
 tv_engineering_department.7025.d:0 "O plano mais amplo atravessa diretamente o pasto de uma aldeia. Mover agora os marcos divisórios através da aldeia resolveria a questão do inquérito, mas os agregados familiares não esquecerão quem os moveu."
 tv_engineering_department.7025.a:0 "Mova as pedras e deixe a pesquisa assentar na área maior."
 tv_engineering_department.7025.b:0 "Deixe o comum como está; uma aldeia ressentida não vale uma base mais ampla."
 tv_engineering_department.7026.t:0 "Construção: O preço de um maçom estrangeiro por seu selo"
 tv_engineering_department.7026.d:0 "Um mestre pedreiro estrangeiro se oferece para certificar o projeto mais amplo, mas somente se o nome do tribunal for apresentado como seu patrono nos registros de sua própria guilda em seu país de origem. O endosso resolveria a questão do tamanho aqui; o pedido é público e não pode ser deixado de lado."
 tv_engineering_department.7026.a:0 "Conceda o endosso e acredite na palavra do mestre em uma área mais ampla."
 tv_engineering_department.7026.b:0 "Omitir o nome do tribunal; o livro-razão de uma guilda estrangeira não é o lugar para gastá-lo."
 tv_engineering_department.7027.t:0 "Construção：O Plano de Base Cruza a Caçada do Barão"
 tv_engineering_department.7027.d:0 "O plano mais amplo atravessa o terreno que um barão local usa há muito tempo para sua caça. Pedir-lhe para segurar a língua enquanto os topógrafos terminam provaria o som em maior escala, mas a nobre paciência despendida aqui é a paciência que ele espera ser retribuída."
 tv_engineering_department.7027.a:0 "Peça paciência ao barão e deixe os topógrafos terminarem seu terreno de caça."
 tv_engineering_department.7027.b:0 "Percurso pelo terreno do barão; não vale a pena gastar sua boa vontade em uma linha de pesquisa."
 tv_engineering_department.7028.t:0 "Construção：O Plano quer um canto de solo sagrado"
 tv_engineering_department.7028.d:0 "O plano mais amplo prevê um recanto de terreno consagrado que a paróquia mantém desde antes da memória viva. Os padres permitiriam uma vistoria se solicitado corretamente, mas pedir ao clero que ceda um terreno sagrado para uma linha de andaime é um favor gasto, não emprestado."
 tv_engineering_department.7028.a:0 "Peça aos sacerdotes que cedam o canto e confirmem a pesquisa mais ampla."
 tv_engineering_department.7028.b:0 "Mantenha a pesquisa dentro dos limites antigos; solo consagrado não é o lugar para testar."
 tv_engineering_department.7029.t:0 "Construção: Procura-se a pista dos comerciantes de lã"
 tv_engineering_department.7029.d:0 "A pegada mais ampla engoliria o caminho que os comerciantes de lã usam nos dias de mercado. Os vereadores da guilda concederiam um desvio se solicitados, mas os burgueses que emprestam suas ruas para um canteiro de obras lembram-se do inconveniente por mais tempo do que a pesquisa."
 tv_engineering_department.7029.a:0 "Peça o desvio aos vereadores e confirme a pegada mais larga ao longo da via."
 tv_engineering_department.7029.b:0 "Deixe a rua dos mercadores em paz; o ágio do mercado não é gasto em uma linha de andaime."
 tv_engineering_department.7030.t:0 "Construção: A vila é solicitada a cavar"
 tv_engineering_department.7030.d:0 "O capataz diz que a base mais ampla pode ser comprovada dentro de uma semana, se a aldeia vizinha se dedicar à escavação em vez de cuidar dos seus próprios campos. A aldeia responderia ao reeve, mas uma taxa cobrada na época de plantio não é esquecida no outono."
 tv_engineering_department.7030.a:0 "Chame o imposto da aldeia e cave uma base mais ampla antes do fim da semana."
 tv_engineering_department.7030.b:0 "Deixe a aldeia manter-se nos seus campos; o capataz pode esperar por mãos contratadas."
 tv_engineering_department.7031.t:0 "Construção:Uma fileira de oficinas está na área"
 tv_engineering_department.7031.d:0 "A única maneira de enquadrar a área mais ampla é derrubar uma fileira de oficinas já existentes na extremidade do local. A pedra e a base iriam direto para o novo plano, mas demolir o que o local já construiu não é algo desfeito."
 tv_engineering_department.7031.a:0 "Puxe a linha para baixo e dobre a pedra na pegada mais larga."
 tv_engineering_department.7031.b:0 "Deixar as oficinas em pé; o site pode crescer em outra direção."
 tv_engineering_department.7032.t:0 "Construção: Os comerciantes de madeira são solicitados a escolher um comprador"
 tv_engineering_department.7032.d:0 "Os comerciantes de madeira no local têm o estoque e os vagões para transportar hoje em dia para uma base mais ampla, se seu comércio normal for reservado para o contrato da coroa. Os mercados do local responderiam às obras, mas uma rota comercial voltada para um comprador não se recupera sozinha."
 tv_engineering_department.7032.a:0 "Dobre o comércio local para as obras e transporte o aterro para uma área de cobertura mais ampla."
 tv_engineering_department.7032.b:0 "Deixe os comerciantes com seu comércio normal; o preenchimento pode ser obtido de outra maneira."
 tv_engineering_department.7033.t:0 "Construção: Os reparadores de estradas da capital são procurados em outro lugar"
 tv_engineering_department.7033.d:0 "Os próprios reparadores de estradas e construtores de estradas da capital são as únicas equipes livres para realizar a pesquisa de confirmação neste mês. Retirá-los das reparações da própria capital resolveria a questão mais ampla da pegada, mas as ruas da capital mostrarão a lacuna que deixaram."
 tv_engineering_department.7033.a:0 "Redistribua as equipes da capital e deixe-as confirmar a presença mais ampla."
 tv_engineering_department.7033.b:0 "Deixe os reparos da capital em paz; a pesquisa pode esperar por mãos ociosas em outros lugares."
 tv_engineering_department.7034.t:0 "Construção:As Guildhalls oferecem os lucros desta temporada"
 tv_engineering_department.7034.d:0 "As guildas da capital oferecem-se para subscrever a pesquisa de confirmação das receitas comerciais desta temporada, desde que a moeda seja sorteada antes que as feiras de inverno fechem os seus livros. Os mercados da capital provariam ter uma pegada mais ampla, mas os lucros de uma temporada voltados para uma maravilha são uma temporada pela qual as guildhalls vão querer que haja resposta."
 tv_engineering_department.7034.a:0 "Aproveite as receitas comerciais da capital e confirme a presença mais ampla antes do encerramento das feiras."
 tv_engineering_department.7034.b:0 "Deixe os livros das guildas em paz; a pesquisa pode esperar pelo tesouro."
 tv_engineering_department.7035.t:0 "Construção: Dias de descanso são solicitados às tripulações"
 tv_engineering_department.7035.d:0 "O capataz diz que a base mais ampla pode ser comprovada este mês se as equipes que já estão no local trabalharem durante os dias de descanso, em vez de descansar entre os turnos. A pesquisa resolveria o projeto mais amplo, mas nem todos os trabalhadores que ultrapassam o seu ritmo normal permanecem trabalhadores por muito tempo."
 tv_engineering_department.7035.a:0 "Conduza as equipes durante seus dias de descanso e estabeleça uma situação mais ampla este mês."
 tv_engineering_department.7035.b:0 "Que as tripulações tenham seus dias de descanso; a pesquisa pode esperar por um ritmo mais lento."
 tv_engineering_department.7036.t:0 "Construção: Procura-se um funcionário para os quadros de turno"
 tv_engineering_department.7036.d:0 "O encarregado da obra quer que um encarregado de obras adequado redesenhe os quadros de turnos e os coloque onde as equipes possam realmente lê-los. O tesouro pode fornecer o homem e sua tinta por um preço, e [tv_wonder_organization_competence|E] seguiria as novas placas."
 tv_engineering_department.7036.a:0 "Contratamos o escriturário e publicamos as novas placas hoje."
 tv_engineering_department.7036.b:0 "As placas antigas duraram tanto tempo; eles podem durar um pouco mais."
 tv_engineering_department.7037.t:0 "Construção: Dois capatazes recusam ordens um do outro"
 tv_engineering_department.7037.d:0 "Duas equipes da guilda no local se recusam a receber ordens dos capatazes um do outro, e a discussão paralisou o turno da manhã duas vezes esta semana. Somente um mandado carregando o [legitimacy|E] da coroa estabeleceria precedência entre eles, e [tv_wonder_organization_competence|E] seguiria assim que a discussão terminasse."
 tv_engineering_department.7037.a:0 "O mandado é redigido e selado; as tripulações respondem a isso ou não respondem a ninguém."
 tv_engineering_department.7037.b:0 "A palavra da coroa não é gasta para decidir qual pedreiro amaldiçoa mais alto."
 tv_engineering_department.7038.t:0 "Construção：A Velha Rota Esqueceu a Colheita"
 tv_engineering_department.7038.d:0 "A mão-de-obra recrutada da aldeia era elaborada de acordo com um calendário antigo que nunca contabilizava a colheita, e metade das equipas iam embora quando os seus campos precisavam dela. Forçar a rota através de objeções locais reduziria o [stability|E] do país, mas as tripulações finalmente manteriam os horários fixos, e o [tv_wonder_organization_competence|E] seguiria."
 tv_engineering_department.7038.a:0 "Nós empurramos a rota; a colheita pode esperar pela maravilha pelo menos uma vez."
 tv_engineering_department.7038.b:0 "Forçar a questão agora apenas troca uma escassez por outra pior."
 tv_engineering_department.7039.t:0 "Construção：Os maçons não responderão ao novo superintendente"
 tv_engineering_department.7039.d:0 "Os mestres pedreiros não respondem ao jovem feitor enviado para reorganizar seus turnos, e dizem isso ao alcance da voz de todo o pátio. Somente um nome apoiado pelo [prestige|E] do tribunal tem peso suficiente para fazê-los se alinhar, e [tv_wonder_organization_competence|E] seguiria sua conformidade."
 tv_engineering_department.7039.a:0 "Emprestamos ao superintendente o nome do tribunal; os maçons respondem por isso, pelo menos por outra coisa."
 tv_engineering_department.7039.b:0 "A autoridade de um jovem superintendente deveria ser conquistada no pátio, e não emprestada do palácio."
 tv_engineering_department.7040.t:0 "Construção：Um senhor vizinho oferece seu mordomo"
 tv_engineering_department.7040.d:0 "O senhor vizinho se oferece para emprestar seu próprio mordomo para elaborar novas escalas de tripulação, um homem que dirige os turnos de uma mansão há vinte anos. Conceder o favor devido custa [estate_satisfaction|E] entre os nobres, mas as listas do administrador trariam [tv_wonder_organization_competence|E]."
 tv_engineering_department.7040.a:0 "Aceitamos o mordomo e devemos ao senhor o que lhe é devido."
 tv_engineering_department.7040.b:0 "Uma dívida para com aquele senhor em particular vale mais do que listas organizadas."
 tv_engineering_department.7041.t:0 "Construção: As trompas de mudança respondem aos sinos da catedral"
 tv_engineering_department.7041.d:0 "As buzinas do local sempre seguiram os sinos da catedral, e os sinos não serão movidos para atender a uma maravilha. Pedir ao capítulo para ligar mais uma hora para marcar mudanças de turno custa [estate_satisfaction|E] entre o clero, mas as equipes finalmente entregariam seus cargos a tempo, trazendo [tv_wonder_organization_competence|E]."
 tv_engineering_department.7041.a:0 "Pedimos ao capítulo o sino extra, por mais que isso nos custe."
 tv_engineering_department.7041.b:0 "Os sinos marcam as horas de Deus, não a mudança de turno do capataz."
 tv_engineering_department.7042.t:0 "Construção: Carrinhos de materiais fazem fila no mercado"
 tv_engineering_department.7042.d:0 "Carrinhos de materiais agora fazem fila na praça do mercado duas vezes por dia, e os feirantes da guilda perdem seus melhores momentos com o barulho e a lama. Liberar a praça para os carrinhos em um horário fixo custa [estate_satisfaction|E] entre os burgueses, mas os carrinhos finalmente chegariam em um horário que as equipes podem planejar, trazendo [tv_wonder_organization_competence|E]."
 tv_engineering_department.7042.a:0 "Acertamos o horário e liberamos a praça, com barracas ou sem barracas."
 tv_engineering_department.7042.b:0 "O mercado alimenta a cidade antes de alimentar a maravilha."
 tv_engineering_department.7043.t:0 "Construção：Uma segunda rotação é solicitada às aldeias"
 tv_engineering_department.7043.d:0 "As aldeias vizinhas são solicitadas a enviar uma segunda rotação de mãos antes que as atuais equipes entrem em colapso devido à duplicação de postos. Retirá-los das suas próprias parcelas entre a plantação e a colheita custa [estate_satisfaction|E] entre os camponeses, mas uma segunda rotação completa permitiria que o local finalmente executasse os turnos adequados, trazendo [tv_wonder_organization_competence|E]."
 tv_engineering_department.7043.a:0 "Chamamos a segunda rotação e deixamos os campos aguardarem a sua vez."
 tv_engineering_department.7043.b:0 "Os campos vazios no outono custam mais ao país do que um horário irregular de turnos."
 tv_engineering_department.7044.t:0 "Construção: O pátio de preparação é muito estreito para passar"
 tv_engineering_department.7044.d:0 "O pátio de preparação é muito apertado para que as equipes passem umas pelas outras sem parar o trabalho, e o emaranhado custa uma hora todas as manhãs. A limpeza de um bloco adjacente para um pátio adequado afeta [development|E] no local, mas as equipes finalmente se moveriam sem colidir, trazendo [tv_wonder_organization_competence|E]."
 tv_engineering_department.7044.a:0 "Derrubamos o quarteirão e damos espaço às equipes para se moverem."
 tv_engineering_department.7044.b:0 "O bloco permanece; um quintal apertado é mais barato que um demolido."
 tv_engineering_department.7045.t:0 "Construção: Carters locais são redirecionados silenciosamente"
 tv_engineering_department.7045.d:0 "Carroceiros e carregadores locais que costumavam fazer as próprias tarefas do local foram silenciosamente redirecionados para o transporte de materiais maravilhosos, e o comércio comum em torno das obras diminuiu como resultado. Formalizar o acordo, vinculando essas mãos à programação da maravilha, custa [prosperity|E] no local, mas [tv_wonder_organization_competence|E] seguiria as equipes que não esperam mais pelos carrinhos perdidos."
 tv_engineering_department.7045.a:0 "Formalizamos o acordo; os carroceiros respondem agora à programação da maravilha."
 tv_engineering_department.7045.b:0 "O comércio normal mantém a população do local alimentada; a maravilha pode esperar a sua vez pelas carroças."
 tv_engineering_department.7046.t:0 "Construção: A Capital Empresta Seus Capatazes"
 tv_engineering_department.7046.d:0 "As próprias obras de construção da capital emprestaram os seus capatazes para ajudar a redesenhar as listas de turnos da maravilha, e o empréstimo deixou os próprios projectos da capital com falta de pessoal. Tornar o empréstimo permanente custa [development|E] na capital, mas o local maravilhoso manteria um capataz que realmente sabe administrar uma escalação, trazendo [tv_wonder_organization_competence|E]."
 tv_engineering_department.7046.a:0 "Tornamos o empréstimo permanente; os projetos da capital funcionarão sem ele."
 tv_engineering_department.7046.b:0 "As próprias obras da capital precisam mais do seu capataz de volta do que a maravilha precisa de outro."
 tv_engineering_department.7047.t:0 "Construção: A ordem do porto foi reorganizada"
 tv_engineering_department.7047.d:0 "Os comerciantes da capital tiveram seus dias de entrega discretamente reorganizados para que os materiais maravilhosos saíssem primeiro do porto, e o comércio normal da capital agora espera atrás das carroças das maravilhas. A confirmação do novo pedido do porto custa [prosperity|E] na capital, mas o local finalmente receberia materiais dentro de um cronograma que as equipes poderiam formar turnos, trazendo [tv_wonder_organization_competence|E]."
 tv_engineering_department.7047.a:0 "Confirmamos o novo pedido no porto; os comerciantes se ajustarão com o tempo."
 tv_engineering_department.7047.b:0 "O próprio comércio da capital não deve ficar atrás de canteiros de obras de outra cidade."
 tv_engineering_department.7048.t:0 "Construção: Retreinamento pede que as tripulações dobrem"
 tv_engineering_department.7048.d:0 "O local carece de duas equipes completas para o retreinamento que as novas escalações exigiriam, de modo que os trabalhadores já disponíveis são solicitados a dobrar seus postos até que o novo cronograma seja implementado. Dirigir o laborioso [population|E] no local durante semanas custa caro, mas o retreinamento finalmente funcionaria, trazendo o [tv_wonder_organization_competence|E]."
 tv_engineering_department.7048.a:0 "Duplicamos as postagens por enquanto; as novas escalações valem o esforço."
 tv_engineering_department.7048.b:0 "Tripulações desgastadas não aprendem nada; a reciclagem pode esperar por mãos descansadas."
 tv_engineering_department.7049.t:0 "Construção: Um único Ford faz backup de cada carrinho"
 tv_engineering_department.7049.d:0 "Um único vau estreito está dando ré em cada carroça com destino ao local. O intendente quer [gold|E] agora, para tábuas e uma equipe paga de construtores de pontes, para que o [tv_wonder_logistics_competence|E] possa se mover novamente antes que a fila cresça mais do que a própria estrada."
 tv_engineering_department.7049.a:0 "Pague aos construtores da ponte e limpe o vau."
 tv_engineering_department.7049.b:0 "O tesouro tem usos melhores para essa moeda do que atravessar uma poça."
 tv_engineering_department.7050.t:0 "Construção:Proprietários recusam passagem do comboio"
 tv_engineering_department.7050.d:0 "Os proprietários de terras ao longo da nova rota recusam-se a permitir que carroças cruzem os seus campos sem um mandado real. Gastar o [legitimacy|E] da coroa aqui abriria os portões e deixaria o [tv_wonder_logistics_competence|E] avançar, mas apenas nesta estrada, e apenas hoje."
 tv_engineering_department.7050.a:0 "Emitir o mandado e abrir os campos para os carrinhos."
 tv_engineering_department.7050.b:0 "A palavra da coroa não é dada a todos os proprietários de terras teimosos."
 tv_engineering_department.7051.t:0 "Construção: A trilha do carrinho atravessa o Village Green"
 tv_engineering_department.7051.d:0 "A antiga trilha de carroças passa direto por uma área verde da vila, e os mestres da estrada querem que ela seja alargada com a mudança de três casas e um poço. O pedido avançaria o [tv_wonder_logistics_competence|E], mas custaria o [stability|E] da coroa, com aqueles que ficaram reclamando."
 tv_engineering_department.7051.a:0 "Dêem a ordem, casas e que se danem."
 tv_engineering_department.7051.b:0 "Deixe a aldeia manter o seu verde; a estrada pode contorná-lo."
 tv_engineering_department.7052.t:0 "Construção:Os únicos cavalos sobressalentes pertencem a outra guilda"
 tv_engineering_department.7052.d:0 "A guilda de carroças da província vizinha possui os únicos cavalos de tração sobressalentes para alugar. Seus mestres irão emprestá-los, e deixar o [tv_wonder_logistics_competence|E] alcançá-lo, apenas como um favor gasto pelo [prestige|E] do tribunal, que não é ilimitado."
 tv_engineering_department.7052.a:0 "Peça o favor e coloque esses cavalos na estrada."
 tv_engineering_department.7052.b:0 "Salve o bom nome do tribunal para uma dívida que vale a pena cobrar."
 tv_engineering_department.7053.t:0 "Construção：As equipes de transporte dos nobres são procuradas para a pedra"
 tv_engineering_department.7053.d:0 "Os mestres da estrada estão com falta de carroças e querem que as próprias carruagens dos nobres locais sejam colocadas para transportar pedras em vez de convidados. O [tv_wonder_logistics_competence|E] ganharia terreno, mas custaria [estate_satisfaction|E] entre os nobres, que reclamarão do transtorno."
 tv_engineering_department.7053.a:0 "Requisite as carruagens e coloque-as para transportar pedras."
 tv_engineering_department.7053.b:0 "Deixem os nobres em suas carruagens; encontre os vagões em outro lugar."
 tv_engineering_department.7054.t:0 "Construção：O Armazém do Mosteiro é procurado"
 tv_engineering_department.7054.d:0 "O mosteiro mais próximo tem o único armazém seco ao longo do caminho, e os mestres da estrada querem que ele seja esvaziado para guardar grãos e ferramentas. Limpá-lo ajudaria o [tv_wonder_logistics_competence|E], mas custaria [estate_satisfaction|E] ao clero, que não esquecerá quais carroções o encheram."
 tv_engineering_department.7054.a:0 "Esvazie o armazém e empilhe-o com suprimentos."
 tv_engineering_department.7054.b:0 "Deixe as lojas do mosteiro intactas."
 tv_engineering_department.7055.t:0 "Construção：O comboio precisa da praça do mercado"
 tv_engineering_department.7055.d:0 "O comboio precisa da praça do mercado da cidade para movimentar seus vagões, mas essa praça também é dia de mercado. O fechamento das barracas movimentaria as carroças ao meio-dia e ajudaria o [tv_wonder_logistics_competence|E], ao custo de [estate_satisfaction|E] entre os burgueses cujas barracas permaneceram fechadas."
 tv_engineering_department.7055.a:0 "Feche o mercado e deixe passar os vagões."
 tv_engineering_department.7055.b:0 "O mercado permanece aberto; os vagões podem esperar um dia."
 tv_engineering_department.7056.t:0 "Construção: Um trecho lamacento engole a estrada"
 tv_engineering_department.7056.d:0 "Um trecho da estrada virou lama e nenhuma junta de bois consegue passar por ele sozinha. Colocar os próprios bois da aldeia nas cordas iria limpá-la e ajudaria o [tv_wonder_logistics_competence|E], mas custaria [estate_satisfaction|E] entre os camponeses, que precisam desses bois para o plantio da primavera."
 tv_engineering_department.7056.a:0 "Coloque os bois e as costas da própria aldeia nas cordas."
 tv_engineering_department.7056.b:0 "Que os camponeses guardem os seus bois para a plantação da Primavera."
 tv_engineering_department.7057.t:0 "Construção: O pátio de preparação não consegue conter os vagões"
 tv_engineering_department.7057.d:0 "O pátio de preparação no local é muito apertado para os vagões que chegam diariamente. A limpeza dos armazéns semi-construídos em sua borda abriria espaço para o [tv_wonder_logistics_competence|E] funcionar, ao custo do [development|E] no local já embutido nesses armazéns."
 tv_engineering_department.7057.a:0 "Limpe os armazéns e alargue o quintal."
 tv_engineering_department.7057.b:0 "Mantenha os armazéns; os vagões podem fazer fila do lado de fora."
 tv_engineering_department.7058.t:0 "Construção:Os estalajadeiros são instruídos a servir os comboios primeiro"
 tv_engineering_department.7058.d:0 "Os estalajadeiros e carroceiros próximos ao local foram instruídos a guardar primeiro o estoque de sobra para os comboios da maravilha, vendendo apenas o que sobrou para todos os outros. Isso manteria o [tv_wonder_logistics_competence|E] alimentado, mas ao custo de [prosperity|E] no local, à medida que o comércio local diminuía."
 tv_engineering_department.7058.a:0 "Mantenha o estoque para os comboios primeiro."
 tv_engineering_department.7058.b:0 "Deixe a cidade negociar como sempre."
 tv_engineering_department.7059.t:0 "Construção：As equipes de pavimentação da capital são procuradas nas estradas"
 tv_engineering_department.7059.d:0 "As equipas de pavimentação da capital estão a meio caminho da construção de uma rua comercial quando os mestres da estrada pedem por elas, para firmar os sulcos no caminho para o local. Redistribuí-los impulsionaria o [tv_wonder_logistics_competence|E], ao custo do [development|E] na capital, cuja rua permanece semi-paralelepípeda."
 tv_engineering_department.7059.a:0 "Tire as equipes da rua e mande-as para a rota."
 tv_engineering_department.7059.b:0 "Termine primeiro a rua do mercado; a rota pode esperar."
 tv_engineering_department.7060.t:0 "Construção：Os Celeiros da Capital são Procurados para a Rota"
 tv_engineering_department.7060.d:0 "Os celeiros mais próximos da porta da capital são a forma mais rápida de abastecer os vagões para a rota, e os mestres da estrada querem que sejam abertos. Vender a reserva ajudaria o [tv_wonder_logistics_competence|E], ao custo de [prosperity|E] na capital, à medida que seus próprios mercados diminuíssem por uma temporada."
 tv_engineering_department.7060.a:0 "Abra os celeiros e abasteça os vagões."
 tv_engineering_department.7060.b:0 "Manter os celeiros fechados durante uma época de escassez."
 tv_engineering_department.7061.t:0 "Construção: Os trabalhadores são solicitados a descarregar o backlog"
 tv_engineering_department.7061.d:0 "Os próprios trabalhadores do local são os únicos com mãos livres para descarregar os vagões de apoio, e o capataz quer que eles deixem suas tarefas regulares e façam turnos extras nas cordas. Isso levaria o [tv_wonder_logistics_competence|E] adiante, mas se baseia no trabalho do [population|E] no local, desgastado pelas horas extras."
 tv_engineering_department.7061.a:0 "Puxe os trabalhadores para turnos extras e elimine o acúmulo."
 tv_engineering_department.7061.b:0 "Que os trabalhadores cumpram as suas tarefas regulares."
 tv_engineering_department.7062.t:0 "Construção: Os guindastes ficam parados por falta de moedas"
 tv_engineering_department.7062.d:0 "Os guindastes ficam parados a cada três dias por falta de pessoal remunerado, embora o escriturário jure que a moeda está guardada, sem ser contada, no cofre. Soltá-lo agora colocaria as cordas de volta nas mãos antes que a geada chegasse."
 tv_engineering_department.7062.a:0 "Abra o cofre e gaste o [gold|E] em turnos duplos, comprando o progresso do [tv_wonder_construction|E]."
 tv_engineering_department.7062.b:0 "Deixe a casa-forte lacrada; as tripulações esperam no dia normal de pagamento."
 tv_engineering_department.7063.t:0 "Construção：Os maçons exigem o selo da própria coroa"
 tv_engineering_department.7063.d:0 "Os maçons recusam-se a cruzar os limites disputados sem um mandado com o selo da própria coroa, e não do governador. Colocar o nome do soberano na ordem resolveria a questão hoje, embora cada mandado desse tipo gasto com os pedreiros seja um a menos para o tribunal e o conselho."
 tv_engineering_department.7063.a:0 "Sele o mandado em nome do soberano, gastando [legitimacy|E] para comprar o progresso [tv_wonder_construction|E] além dos limites."
 tv_engineering_department.7063.b:0 "Retenha o selo real e deixe o próprio governador discutir a fronteira."
 tv_engineering_department.7064.t:0 "Construção: Duas aldeias bloqueiam a estrada de transporte"
 tv_engineering_department.7064.d:0 "Duas aldeias ficam ao lado da estrada de transporte planejada, e seus chefes disseram claramente não, duas vezes. Mandá-los de lado limparia a estrada dentro de uma semana, à custa do silêncio que a coroa manteve com eles desde a última colheita ruim."
 tv_engineering_department.7064.a:0 "Ordene que as aldeias cedam, gastando [stability|E] para limpar o progresso de [tv_wonder_construction|E] ao longo da estrada de transporte."
 tv_engineering_department.7064.b:0 "Redirecione a estrada de transporte ao redor das aldeias e deixe os chefes em paz."
 tv_engineering_department.7065.t:0 "Construção: O Mestre da Guilda determina seu preço para pular a fila"
 tv_engineering_department.7065.d:0 "O mestre da guilda dos lapidários só furará a fila dos pedreiros da maravilha se o tribunal cobrar um favor devido desde a última visita de estado. Pedir agora moveria o pedido para a frente do livro-razão, mas um favor pronunciado em voz alta é um favor gasto."
 tv_engineering_department.7065.a:0 "Peça o favor e gaste [prestige|E] para avançar o pedido, comprando o progresso de [tv_wonder_construction|E]."
 tv_engineering_department.7065.b:0 "Deixe a ordem permanecer por sua vez e guarde o favor para mais tarde."
 tv_engineering_department.7066.t:0 "Construção：Um Senhor Oferece Suas Taxas Domésticas"
 tv_engineering_department.7066.d:0 "Um senhor local oferece aos seus próprios impostos domésticos para transportar pedras durante o próximo mês, desde que ninguém mencione que foi prometido aos seus homens uma temporada de folga após a última reunião. Seu administrador já está elaborando a lista."
 tv_engineering_department.7066.a:0 "Aceite os impostos do senhor, gastando o [estate_satisfaction|E] dos nobres para comprar o progresso do [tv_wonder_construction|E]."
 tv_engineering_department.7066.b:0 "Recuse os impostos e deixe os homens do senhor cumprirem a temporada prometida."
 tv_engineering_department.7067.t:0 "Construção: O Fundo da Almshouse da Abadia poderia cobrir a madeira"
 tv_engineering_department.7067.d:0 "O fundo do asilo da abadia está farto neste trimestre, e o prior deu a entender que poderia cobrir a madeira dos andaimes se a coroa apenas pedisse abertamente, em vez de apenas responder. Perguntar abertamente é a parte que o capítulo lembrará."
 tv_engineering_department.7067.a:0 "Pergunte ao prior e gaste o clero [estate_satisfaction|E] em madeira para andaimes, comprando o progresso [tv_wonder_construction|E]."
 tv_engineering_department.7067.b:0 "Deixe o fundo do asilo em paz e encontre a madeira em outro lugar."
 tv_engineering_department.7068.t:0 "Construção: Trens de vagões emaranhados com dia de mercado"
 tv_engineering_department.7068.d:0 "Os trens de carroções destinados ao local da maravilha continuam emaranhados com o tráfego dos dias de mercado nas mesmas três esquinas. Fechar essas ruas ao comércio nos dias de entrega desvendaria a rota imediatamente, embora os feirantes perderiam imediatamente essas horas de alfândega."
 tv_engineering_department.7068.a:0 "Fechar as ruas nos dias de entrega, gastando o [estate_satisfaction|E] dos burgueses para comprar o progresso do [tv_wonder_construction|E]."
 tv_engineering_department.7068.b:0 "Deixe as ruas do mercado abertas e deixe as carroças aguardarem a sua vez."
 tv_engineering_department.7069.t:0 "Construção: As equipes de escavação são solicitadas para a terraplenagem"
 tv_engineering_department.7069.d:0 "O oficial de justiça diz que as aldeias vizinhas podem dispensar mãos para os trabalhos de terraplenagem, mas apenas as mesmas mãos já devidas às valas de Outono que evitam que os seus próprios campos sejam inundados. Elaborá-los agora significa que o abandono espera."
 tv_engineering_department.7069.a:0 "Recrute os trabalhadores da aldeia para a terraplenagem, gastando [estate_satisfaction|E] dos camponeses no progresso [tv_wonder_construction|E]."
 tv_engineering_department.7069.b:0 "Deixe as aldeias abandonadas e encontre trabalho em outro lugar."
 tv_engineering_department.7070.t:0 "Construção: O antigo armazém de grãos fica onde o andaime deve subir"
 tv_engineering_department.7070.d:0 "O antigo armazém de grãos, onde o andaime oeste precisa ser colocado, é sólido o suficiente para ser mantido, mas sua pedra e sua pegada responderiam tanto à escassez do pedreiro quanto à reclamação do agrimensor de uma só vez. Puxá-lo para baixo é o caminho mais rápido."
 tv_engineering_department.7070.a:0 "Desmonte o armazém de grãos, gastando [development|E] no local para comprar o progresso [tv_wonder_construction|E]."
 tv_engineering_department.7070.b:0 "Deixe o armazém de grãos em pé e encontre a sala do andaime em outro lugar."
 tv_engineering_department.7071.t:0 "Construção: Taverneiros se voltam silenciosamente em direção à maravilha"
 tv_engineering_department.7071.d:0 "Os taverneiros e carroceiros do próprio local começaram silenciosamente a desviar seu costume para entregas de maravilhas, já que as tripulações pagam em moedas prontas e o comércio comum não. A formalização desse acordo aceleraria as entregas, à custa do comércio em que esses detentores construíram o seu costume."
 tv_engineering_department.7071.a:0 "Formalize o desvio, gastando [prosperity|E] no local para comprar o progresso [tv_wonder_construction|E]."
 tv_engineering_department.7071.b:0 "Deixe o comércio local seguir seu curso normal e deixe as entregas como estão."
 tv_engineering_department.7072.t:0 "Construção: Uma Ponte ou Uma Maravilha"
 tv_engineering_department.7072.d:0 "A reparação da ponte da capital está paralisada por falta de pedreiros, e cada pedreiro nela é um pedreiro que não corta pela maravilha. Redistribuir a tripulação faria com que a maravilha avançasse imediatamente, e a ponte simplesmente esperaria sua vez."
 tv_engineering_department.7072.a:0 "Redesigne a tripulação da ponte para a maravilha, gastando [development|E] na capital no progresso de [tv_wonder_construction|E]."
 tv_engineering_department.7072.b:0 "Deixe a tripulação da ponte onde está e deixe a ponte terminar primeiro."
 tv_engineering_department.7073.t:0 "Construção：Fatores de grãos oferecem seu excedente, por um preço"
 tv_engineering_department.7073.d:0 "Os produtores de cereais da capital ofereceram-se para vender o seu excedente directamente às lojas da maravilha a um preço justo, desde que a coroa lhes permitisse afixar a venda na praça principal como prova do favor real. Isso alimentaria as equipes durante o mês de vacas magras e visivelmente inclinaria o mercado em direção a um comprador."
 tv_engineering_department.7073.a:0 "Deixe os fatores postarem a venda, gastando [prosperity|E] no capital para comprar o progresso [tv_wonder_construction|E]."
 tv_engineering_department.7073.b:0 "Recuse a venda pública e compre os grãos das tripulações pelos canais habituais."
 tv_engineering_department.7074.t:0 "Construção：O Supervisor propõe trabalhar durante a noite"
 tv_engineering_department.7074.d:0 "O supervisor propõe comandar as próprias equipes do local durante o turno da noite, em vez de esperar por mãos novas do recrutador, uma vez que as tochas e o testamento já estão lá. Isso eliminaria o acúmulo ao amanhecer, embora os mesmos homens voltassem ao amanhecer, sem descanso entre eles."
 tv_engineering_department.7074.a:0 "Encomende o turno da noite, gastando o trabalho [population|E] no local para comprar o progresso [tv_wonder_construction|E]."
 tv_engineering_department.7074.b:0 "Mande as equipes para suas camas e espere por novas mãos do recrutador."
 tv_engineering_department.7075.t:0 "Construção: Opinião no Scaffold Wavers"
 tv_engineering_department.7075.d:0 "Uma manifestação pública no local atrai uma multidão que pode se tornar espectadores fiéis ou críticos ofendidos. Os andaimes esperam enquanto o boato decide se o [tv_wonder_domestic_support|E] foi ajudado ou prejudicado."
 tv_engineering_department.7075.a:0 "Deixe a manifestação falar por si."
 tv_engineering_department.7076.t:0 "Construção: O plano supera a página"
 tv_engineering_department.7076.d:0 "Um ajustamento ousado leva o plano para além dos seus antigos limites. Pode ser a decisão que tornou o monumento grandioso, ou a nota que os futuros escriturários sublinharão em vermelho."
 tv_engineering_department.7076.a:0 "Empurra o design além de seus antigos limites."
 tv_engineering_department.7077.t:0 "Construção: Mudança de pedidos sob o toldo"
 tv_engineering_department.7077.d:0 "Uma nova cadeia de comando é imposta sob os toldos. Pode disciplinar o estaleiro ou simplesmente ensinar a cada capataz uma nova maneira de argumentar."
 tv_engineering_department.7077.a:0 "Empurramos a nova cadeia de comando pelo pátio."
 tv_engineering_department.7078.t:0 "Construção: A rota passa pela lama"
 tv_engineering_department.7078.d:0 "Uma rota arriscada promete encurtar a linha de abastecimento. Se o tempo se mantiver, será elogiado como uma previsão; se falhar, todos se lembrarão de quem ordenou a virada."
 tv_engineering_department.7078.a:0 "Pegue o caminho mais curto!"
 tv_engineering_department.7079.t:0 "Construção: Um novo método paira no ar"
 tv_engineering_department.7079.d:0 "Um método mais rápido é tentado na parte ativa. Isso pode salvar o mês ou forçar a próxima equipe a reparar um belo erro."
 tv_engineering_department.7079.a:0 "Tenta o método mais rápido na seção ativa."
 tv_engineering_department.7080.t:0 "Construção: Trabalhadores desistem de suas ferramentas por causa de uma promessa quebrada"
 tv_engineering_department.7080.d:0 "Os trabalhadores largaram suas ferramentas esta manhã, murmurando que a maravilha está sangrando a prata da coroa. O capataz acalmou-os com uma promessa de bônus salariais, uma promessa que o tesouro agora deveria honrar ou quebrar diante da multidão."
 tv_engineering_department.7080.a:0 "Quebre o bônus prometido e deixe que as reclamações dos trabalhadores se espalhem pelo local."
 tv_engineering_department.7080.b:0 "Honre o bônus prometido e deixe-o sair do tesouro."
 tv_engineering_department.7081.t:0 "Construção：Um panfleto questiona o selo do mandado"
 tv_engineering_department.7081.d:0 "Um funcionário viajante leu em voz alta na praça um panfleto afirmando que o mandado da coroa autorizando a maravilha nunca foi legalmente selado. Quer a dúvida sobre o projeto permaneça sem resposta ou o próprio mandado seja discretamente alterado, algo deve acontecer."
 tv_engineering_department.7081.a:0 "Deixe o panfleto sem resposta e deixe que as dúvidas sobre a maravilha continuem se espalhando."
 tv_engineering_department.7081.b:0 "Altere discretamente o texto do mandado para responder ao desafio e aceite a redução do mandato da coroa."
 tv_engineering_department.7082.t:0 "Construção: Um Levy provoca uma briga daqui a dois dias"
 tv_engineering_department.7082.d:0 "Chegou a notícia de que o recrutamento de carregadores de pedras para a maravilha provocou uma briga entre oficiais de recrutamento e moradores a dois dias de viagem do local. Acalmá-lo custará alguma coisa, seja naquele distrito ou nos portões do local."
 tv_engineering_department.7082.a:0 "Deixe que os portões do local absorvam os protestos e deixem a agitação do distrito se extinguir."
 tv_engineering_department.7082.b:0 "Envie tropas para colonizar o distrito silenciosamente antes que a agitação se espalhe ainda mais."
 tv_engineering_department.7083.t:0 "Construção: Jibe de um enviado viaja do porto ao palácio"
 tv_engineering_department.7083.d:0 "Um enviado estrangeiro riu no banquete, dizendo que a maravilha rasteja mais devagar do que um boi, e a zombaria agora se repete em todas as tavernas, do porto ao palácio. Alguém tem de engoli-lo, seja a posição da coroa no exterior ou o orgulho dos habitantes da cidade pelo que está a ser construído."
 tv_engineering_department.7083.a:0 "Ignore a zombaria do enviado e deixe o orgulho dos habitantes da cidade pela maravilha levar a melhor."
 tv_engineering_department.7083.b:0 "Responda ao enviado com uma contra-exibição luxuosa e gaste a posição da coroa para silenciá-lo."
 tv_engineering_department.7084.t:0 "Construção: O Comissário de Lord Aldric Fumega no Portão"
 tv_engineering_department.7084.d:0 "A nova estrada da pedreira foi cortada através da reserva de caça de Lorde Aldric na semana passada, e seu administrador tem estado furioso no portão do local desde então. Ou a família do senhor é aplacada ou os cidadãos que assistem ao impasse tiram as suas próprias conclusões."
 tv_engineering_department.7084.a:0 "Deixe o impasse se arrastar sem solução e deixe a opinião da multidão sobre o projeto azedar."
 tv_engineering_department.7084.b:0 "Conceda à família do senhor um pedido formal de desculpas e uma compensação para resolver o assunto."
 tv_engineering_department.7085.t:0 "Construção: A trincheira da fundação revela sepulturas antigas"
 tv_engineering_department.7085.d:0 "Os escavadores que preparavam a trincheira encontraram pedras funerárias antigas que ninguém tinha registado, e o pároco recusa-se a abençoar trabalhos futuros até que os mortos sejam devidamente enterrados. Ou os ritos de novo sepultamento são pagos integralmente ou a escavação continua apesar das objeções do padre."
 tv_engineering_department.7085.a:0 "Ignore o padre e continue cavando, deixando que a notícia dos túmulos perturbados perturbe a multidão."
 tv_engineering_department.7085.b:0 "Pague pelos ritos de enterro completos para satisfazer o padre e a paróquia."
 tv_engineering_department.7086.t:0 "Construção: Postes de andaimes bloqueiam a fila dos comerciantes"
 tv_engineering_department.7086.d:0 "Postes de andaimes colocados ao longo da rua bloquearam o tráfego de carroças para a rua dos comerciantes durante seis dias consecutivos, e os feirantes estão exigindo que alguém responda pelo comércio perdido. Ou suas perdas são compensadas ou a rua fica fechada e a multidão fica sabendo disso."
 tv_engineering_department.7086.a:0 "Deixe os comerciantes descompensados e deixe a rua fechada alimentar os protestos da multidão."
 tv_engineering_department.7086.b:0 "Compense imediatamente a fila dos comerciantes pela negociação bloqueada."
 tv_engineering_department.7087.t:0 "Construção: Os campos de amadurecimento permanecem sem cortes"
 tv_engineering_department.7087.d:0 "Os responsáveis pela arrecadação da colheita retiraram os trabalhadores dos vilarejos dos campos maduros para transportar a madeira para a maravilha, e os grãos agora permanecem intactos enquanto as costas dos trabalhadores doem no local. Ou as aldeias recuperam as mãos para a colheita, ou a multidão ouve como a maravilha esvaziou os campos."
 tv_engineering_department.7087.a:0 "Mantenha as mãos mobilizadas no local e deixe que a notícia dos grãos em pé chegue à multidão."
 tv_engineering_department.7087.b:0 "Liberte as mãos da aldeia de volta à colheita imediatamente."
 tv_engineering_department.7088.t:0 "Construção: O antigo bairro do curtume está meio demolido"
 tv_engineering_department.7088.d:0 "O plano dos pedreiros prevê que o antigo bairro do curtume seja limpo para dar lugar às fundações da maravilha, e metade dele foi destruído antes que alguém pensasse em perguntar o que o substituiria. Ou o distrito é demolido conforme planejado, ou o plano é reduzido e as pessoas começam a perguntar por que a maravilha precisava de tanto espaço."
 tv_engineering_department.7088.a:0 "Reduza a folga e deixe as pessoas questionarem por que a maravilha precisava de tanto terreno em primeiro lugar."
 tv_engineering_department.7088.b:0 "Termine de demolir o curtume conforme planejado e preocupe-se com o que o substituirá mais tarde."
 tv_engineering_department.7089.t:0 "Construção: O mercado não voltou"
 tv_engineering_department.7089.d:0 "O pátio da maravilha engoliu o mercado semanal pelo terceiro mês consecutivo, e as barracas que o enchiam simplesmente pararam de voltar. Ou o mercado é devolvido antes de ser esquecido, ou o estaleiro o mantém e o comércio do local continua diminuindo."
 tv_engineering_department.7089.a:0 "Mantenha o pátio onde está e deixe o comércio do mercado do local esfriar."
 tv_engineering_department.7089.b:0 "Devolva o mercado antes que as barracas semanais esqueçam o caminho de volta."
 tv_engineering_department.7090.t:0 "Construção: O Almshouse fica intocado perto da ponte velha"
 tv_engineering_department.7090.d:0 "O agrimensor da cidade requisitou todos os pedreiros da capital para a construção da pedra da maravilha e, como resultado, o asilo semiconstruído junto à ponte velha permaneceu intocado durante dois meses. Ou o asilo espera até que a maravilha seja realizada, ou os pedreiros são puxados de volta para a capital e o local demora a explicar o porquê."
 tv_engineering_department.7090.a:0 "Mantenha todos os pedreiros atentos e deixe os projetos incompletos da capital esperarem."
 tv_engineering_department.7090.b:0 "Chame os pedreiros para terminar o asilo e deixe a multidão do local se perguntar sobre o atraso."
 tv_engineering_department.7091.t:0 "Construção: Vagões de pedra obstruem a melhor rua da capital"
 tv_engineering_department.7091.d:0 "Vagões de pedra trabalhada com destino à maravilha estão estacionados ao longo da melhor rua comercial da capital há uma semana, e os lojistas dizem que o costume acabou com a estrada bloqueada. Ou os vagões logo encontram outro caminho ou ficam e o comércio da própria capital continua esfriando."
 tv_engineering_department.7091.a:0 "Deixe os vagões onde estão e deixe que o próprio progresso do local assuma a culpa."
 tv_engineering_department.7091.b:0 "Redirecione os vagões imediatamente e deixe a rua comercial da capital respirar novamente."
 tv_engineering_department.7092.t:0 "Construção: Um colapso de andaime deixa uma dúzia quebrada"
 tv_engineering_department.7092.d:0 "O desabamento de um andaime no local, há três dias, deixou uma dúzia de trabalhadores com ossos quebrados, e o restante da equipe agora reclama que nenhum salário vale o risco. Ou os feitores forçam o ritmo e os trabalhadores começam a fugir durante a noite, ou o ritmo diminui e a notícia do perigo se espalha pela cidade."
 tv_engineering_department.7092.a:0 "Deixe que o perigo se torne assunto comum na cidade e mantenha todos os trabalhadores no local."
 tv_engineering_department.7092.b:0 "Force o ritmo de qualquer maneira e aceite que os trabalhadores assustados escaparão durante a noite."
 tv_engineering_department.7093.t:0 "Construção: O cofre é mais leve do que afirma o livro-razão"
 tv_engineering_department.7093.d:0 "O tesoureiro do site abre o cofre e o considera mais leve do que afirma o livro-razão. Alguém já gastou moedas que nunca foram contabilizadas e o déficit será compensado em [tv_wonder_scale_competence|E] ou em [gold|E]."
 tv_engineering_department.7093.a:0 "Reduza o design para corresponder ao que o baú ainda pode pagar."
 tv_engineering_department.7093.b:0 "Cubra o déficit do tesouro e continue construindo em grande escala."
 tv_engineering_department.7094.t:0 "Construção: Um rival sussurra que nenhuma carta permite isso"
 tv_engineering_department.7094.d:0 "Um requerente rival começou a sussurrar que nenhuma carta permite um monumento deste tamanho. Os funcionários dizem que o assunto pode ser resolvido silenciosamente, mas não sem custos para [tv_wonder_scale_competence|E] ou para [legitimacy|E]."
 tv_engineering_department.7094.a:0 "Retire silenciosamente as maiores reivindicações do estatuto."
 tv_engineering_department.7094.b:0 "Faça com que a coroa reafirme a carta na íntegra e responda diretamente aos sussurros."
 tv_engineering_department.7095.t:0 "Construção：Três Freguesias Bloqueiam Estrada Sobre as Fundações"
 tv_engineering_department.7095.d:0 "Homens de três paróquias derrubaram ferramentas nas fundações alargadas, bloqueando a estrada com carroças. O oficial de justiça pode dispersá-los, mas apenas cedendo terreno em algum lugar - seja o [tv_wonder_scale_competence|E] do plano ou o [stability|E] do distrito."
 tv_engineering_department.7095.a:0 "Limite as fundações à linha original e mande os homens satisfeitos para casa."
 tv_engineering_department.7095.b:0 "Envie homens armados para limpar a estrada e manter as fundações mais amplas."
 tv_engineering_department.7096.t:0 "Construção：Os Arautos se recusam a viajar sem remuneração"
 tv_engineering_department.7096.d:0 "Os arautos que iriam proclamar o monumento no estrangeiro ficaram sem receber durante dois meses e agora recusam-se a viajar. Alguém deve ficar satisfeito imediatamente, seja isso significando cortar o [tv_wonder_scale_competence|E] do design ou gastar o [prestige|E] da coroa para comprar seu silêncio."
 tv_engineering_department.7096.a:0 "Anuncie um monumento menor e mais barato e deixe que os arautos carreguem essa palavra."
 tv_engineering_department.7096.b:0 "Pague aos arautos o nome e a reputação da própria coroa."
 tv_engineering_department.7097.t:0 "Construção: O Administrador do Barão conta o dobro da madeira"
 tv_engineering_department.7097.d:0 "O mordomo de um barão contou a madeira requisitada das florestas de seu senhor e encontrou o dobro do combinado. O senhor aceitará um corte menor daqui para frente, reduzindo o [tv_wonder_scale_competence|E] do plano, ou um pedido formal de desculpas e novas concessões ao [estate_satisfaction|E] entre os nobres."
 tv_engineering_department.7097.a:0 "Reduza as futuras cotas de madeira e reduza o projeto para corresponder."
 tv_engineering_department.7097.b:0 "Envie um pedido formal de desculpas e mais subsídios à casa do barão."
 tv_engineering_department.7098.t:0 "Construção: A nave mais larga engoliria o antigo cemitério"
 tv_engineering_department.7098.d:0 "Um bispo descobriu que o desenho mais amplo da nave engolirá o antigo cemitério do capítulo. Ele não abençoará as obras novamente, a menos que o plano seja cortado, ou a menos que as queixas do capítulo em relação a [estate_satisfaction|E] entre o clero sejam totalmente respondidas."
 tv_engineering_department.7098.a:0 "Redesenhe a nave para poupar o cemitério."
 tv_engineering_department.7098.b:0 "Conceda ao capítulo novos privilégios para responder às suas queixas."
 tv_engineering_department.7099.t:0 "Construção: A estrada alargada atravessa os armazéns"
 tv_engineering_department.7099.d:0 "Os comerciantes de lã relatam que a estrada alargada para o local passou direto pela área de seus armazéns e as mercadorias agora estão apodrecendo nos cruzamentos. Ou a estrada se estreita novamente, aparando o [tv_wonder_scale_competence|E] de toda a abordagem, ou a coroa compensa o [estate_satisfaction|E] entre os burgueses de uma vez."
 tv_engineering_department.7099.a:0 "Estreite a estrada de acesso e poupe os armazéns."
 tv_engineering_department.7099.b:0 "Pague aos comerciantes suas perdas e mantenha o caminho mais largo."
 tv_engineering_department.7100.t:0 "Construção:Uma vila enterrou três homens este mês"
 tv_engineering_department.7100.d:0 "Corre a notícia de que uma aldeia perto da pedreira enterrou três homens este mês, que trabalharam até tarde na encomenda ampliada. O reeve diz que a corvéia deve ser reduzida, a menos que a coroa prefira responder por [estate_satisfaction|E] entre os camponeses com grãos e prata em vez de encolher [tv_wonder_scale_competence|E]."
 tv_engineering_department.7100.a:0 "Reduza a ordem da corvéia ao que a aldeia pode suportar."
 tv_engineering_department.7100.b:0 "Envie grãos e prata para a aldeia e guarde a corvéia conforme ordenado."
 tv_engineering_department.7101.t:0 "Construção: Uma fileira de casas desce para o terreno de trabalho"
 tv_engineering_department.7101.d:0 "O capataz derrubou uma fileira de casas no local para ampliar o terreno de trabalho, e os moradores da cidade estão perguntando o que será construído em seu lugar. A resposta reduzirá o design, poupando o [tv_wonder_scale_competence|E] de nenhum terreno que ele não precise, ou significará limpar ainda mais e perder mais do [development|E] do local."
 tv_engineering_department.7101.a:0 "Interrompa a limpeza adicional e redesenhe o plano para ajustá-lo ao terreno já ocupado."
 tv_engineering_department.7101.b:0 "Ordene que a compensação continue e deixe o local absorver a perda."
 tv_engineering_department.7102.t:0 "Construção: O mercado que antes circundava o local acabou"
 tv_engineering_department.7102.d:0 "O mercado que antes circundava o canteiro de obras foi afastado por andaimes e barulho, e as barracas não voltaram. O superintendente deve decidir se aproxima as obras, desistindo de alguns [tv_wonder_scale_competence|E], ou deixa o [prosperity|E] do local continuar sangrando enquanto o mercado permanece banido."
 tv_engineering_department.7102.a:0 "Puxe o andaime e deixe o mercado retornar."
 tv_engineering_department.7102.b:0 "Mantenha as obras amplamente divulgadas e deixe o comércio do local definhar."
 tv_engineering_department.7103.t:0 "Construção: Os maçons da ponte foram puxados para a maravilha"
 tv_engineering_department.7103.d:0 "Os pedreiros convocados para a maravilha foram retirados diretamente dos reparos da ponte da capital, que agora estão semiacabados antes do inverno. Alguém deve dar: ou o [tv_wonder_scale_competence|E] da maravilha encolhe para que os pedreiros possam ir para casa, ou o [development|E] da capital é deixado para esperar o fim da temporada sem reparos."
 tv_engineering_department.7103.a:0 "Liberte os pedreiros de volta à capital e reduza a maravilha."
 tv_engineering_department.7103.b:0 "Mantenha os pedreiros maravilhados e deixe os reparos da capital esperarem."
 tv_engineering_department.7104.t:0 "Construção: As Guildhalls da Capital ficaram em silêncio"
 tv_engineering_department.7104.d:0 "As próprias guildas da capital ficaram em silêncio, seus artesãos e carroceiros foram afastados para alimentar o apetite da maravilha por pedras e mãos. O conselho pergunta claramente se o projecto será finalmente reduzido à medida, poupando [tv_wonder_scale_competence|E], ou se o [prosperity|E] da capital deve continuar a financiar um monumento que já não vê construído nas suas próprias ruas."
 tv_engineering_department.7104.a:0 "Reduza o projeto e libere os membros da guilda de volta à capital."
 tv_engineering_department.7104.b:0 "Mantenha os membros da guilda no local e deixe o comércio da capital continuar pagando por isso."
 tv_engineering_department.7105.t:0 "Construção: O cirurgião avisa que mais cairão"
 tv_engineering_department.7105.d:0 "Um andaime desabou na camada alargada ontem à noite, e o cirurgião diz que mais cairão se o ritmo contra o plano maior não diminuir. O supervisor pode reduzir o projeto a um ritmo que as equipes possam sobreviver, poupando o [tv_wonder_scale_competence|E], ou continuar conduzindo o trabalho mais amplo e aceitar que o trabalho do [population|E] no local continuará diminuindo."
 tv_engineering_department.7105.a:0 "Diminua o ritmo e reduza o plano ao que as tripulações podem suportar."
 tv_engineering_department.7105.b:0 "Mantenha o trabalho mais amplo avançando e aceite o tributo sobre os trabalhadores."
 tv_engineering_department.7106.t:0 "Construção: Dois funcionários contam duas vezes o mesmo déficit"
 tv_engineering_department.7106.d:0 "O cofre do tesoureiro falhou na contagem da noite passada, duas vezes, por dois funcionários diferentes. Ou a moeda perdida é baixada ao tesouro, ou toda a escala de turnos é destruída e todas as tripulações são realocadas do nada. [tv_wonder_organization_competence|E] ou [gold|E] pagará pela aritmética dos funcionários."
 tv_engineering_department.7106.a:0 "Rasgue a lista de turnos e reatribua todas as equipes do zero."
 tv_engineering_department.7106.b:0 "Baixa a moeda perdida no tesouro e deixa a lista conforme contabilizada."
 tv_engineering_department.7107.t:0 "Construção: Uma concessão forjada é lida em voz alta para as equipes"
 tv_engineering_department.7107.d:0 "Um arauto que nenhum capataz reconhece leu uma concessão forjada dos direitos madeireiros do local a um senhor rival, na plena audiência das tripulações. Perseguir o homem e refutar a afirmação diante dos trabalhadores reunidos tira todos os capatazes de seus postos naquele dia. Deixar a falsificação sem resposta mantém as tripulações trabalhando, mas a afirmação já se repete nas tabernas como fato. [tv_wonder_organization_competence|E] ou [legitimacy|E] carregará a mentira do falsificador."
 tv_engineering_department.7107.a:0 "Tire todos os capatazes de seu posto para caçar o pregoeiro e esclarecer as coisas."
 tv_engineering_department.7107.b:0 "Deixe a reivindicação forjada ficar sem resposta e mantenha as equipes trabalhando."
 tv_engineering_department.7108.t:0 "Construção: Um fósforo se espalha pela rua"
 tv_engineering_department.7108.d:0 "Um fósforo empurrou no refeitório, mais de meio saco de grãos estragados, espalhou-se pelo portão e caiu na rua antes que o vigia o quebrasse. As equipes podem ser reorganizadas e alimentadas em horários escalonados para que as duas gangues nunca mais se encontrem, ou a guarda pode fazer suas prisões na praça aberta para resolver a questão de uma vez por todas. [tv_wonder_organization_competence|E] ou [stability|E] respondem pelo grão estragado."
 tv_engineering_department.7108.a:0 "Reorganize cada turno da bagunça para que as duas gangues nunca mais se cruzem."
 tv_engineering_department.7108.b:0 "Deixe o relógio fazer suas prisões na praça aberta."
 tv_engineering_department.7109.t:0 "Construção：O enviado chega a um portão não tripulado"
 tv_engineering_department.7109.d:0 "Um enviado estrangeiro chegou um dia antes e encontrou o portão de honra desguarnecido e os estandartes ainda dobrados no peito. A lista de serviço pode ser rasgada no local para conseguir uma recepção adequada, ou o enviado pode ser conduzido pelo local exatamente como está e reportá-lo para casa como o viu. [tv_wonder_organization_competence|E] ou [prestige|E] paga pela chegada antecipada."
 tv_engineering_department.7109.a:0 "Rasgue a escala de serviço no local para conseguir uma recepção adequada."
 tv_engineering_department.7109.b:0 "Conduza o enviado pelo site exatamente como está."
 tv_engineering_department.7110.t:0 "Construção：Os bois emprestados estão atrasados desde o Natal"
 tv_engineering_department.7110.d:0 "As parelhas de bois emprestadas da propriedade de um senhor vizinho deveriam retornar em Michaelmas e ainda estão transportando pedras fora do prazo. As equipes podem ser enviadas para casa dentro do prazo e as equipes de reboque reorganizadas para arrastar as cargas manualmente, ou os bois podem ser mantidos por mais quinze dias enquanto o mordomo do senhor é instruído a esperar. [tv_wonder_organization_competence|E] ou [estate_satisfaction|E] entre os nobres carrega os bois atrasados."
 tv_engineering_department.7110.a:0 "Mande os bois para casa no prazo e reorganize as equipes para rebocá-los manualmente."
 tv_engineering_department.7110.b:0 "Fique com os bois por mais quinze dias e diga ao mordomo do senhor que espere."
 tv_engineering_department.7111.t:0 "Construção: Os martelos abafam a procissão de relíquias"
 tv_engineering_department.7111.d:0 "Os pedreiros continuaram avançando na procissão de relíquias esta semana, e os cânticos não puderam ser ouvidos no local, a três ruas de distância. O calendário de turnos pode ser redesenhado em torno de cada festa e dia de procissão a partir de agora, ou a rota da procissão pode simplesmente ser alterada e o clero informado que o trabalho não irá parar por causa disso. [tv_wonder_organization_competence|E] ou [estate_satisfaction|E] entre o clero responde pelo barulho."
 tv_engineering_department.7111.a:0 "Redesenhe o calendário de turnos em torno de cada dia de festa e procissão."
 tv_engineering_department.7111.b:0 "Desloque o percurso da procissão e diga ao clero que os trabalhos não vão parar."
 tv_engineering_department.7112.t:0 "Construção: Vagões do local bloqueiam a pista do mercado de grãos"
 tv_engineering_department.7112.d:0 "Uma fila de vagões bloqueou a pista de carregamento do mercado de grãos durante seis dias consecutivos, e a associação de comerciantes parou de enviar seu funcionário para reclamar pessoalmente. O cronograma de entrega pode ser destruído e reconstruído em torno de uma rota mais longa que mantenha a pista livre, ou os vagões podem permanecer parados enquanto a guilda é deixada para redirecionar seu próprio negócio. [tv_wonder_organization_competence|E] ou [estate_satisfaction|E] entre os burgueses paga pela faixa bloqueada."
 tv_engineering_department.7112.a:0 "Rasgue o cronograma de entrega e reconstrua-o em torno de uma rota mais longa."
 tv_engineering_department.7112.b:0 "Deixe as carroças onde estão e deixe a guilda se redirecionar."
 tv_engineering_department.7113.t:0 "Construção: A época de plantio chega sem as mãos"
 tv_engineering_department.7113.d:0 "As gangues de corvéias que devem retornar às suas aldeias para plantar ainda estão cortando pedras, e chegou a notícia de que os campos deste ano não serão semeados sem eles. As gangues podem ser libertadas dentro do prazo e os turnos de trabalho do local reconstruídos a partir de quem sobrou, ou a corvéia pode ser mantida além do prazo enquanto as aldeias sobrevivem sem mãos. [tv_wonder_organization_competence|E] ou [estate_satisfaction|E] entre os camponeses paga pelos campos não plantados."
 tv_engineering_department.7113.a:0 "Liberte as gangues da corvéia dentro do cronograma e reconstrua os turnos do local com os que sobraram."
 tv_engineering_department.7113.b:0 "Mantenha o prazo da corvéia e deixe as aldeias se virarem."
 tv_engineering_department.7114.t:0 "Construção: Uma parede desabada observa a própria pavimentação do local"
 tv_engineering_department.7114.d:0 "Um muro de contenção cedeu durante a noite, e a pedra trabalhada mais próxima foi a pavimentação já colocada ao longo da estrada de acesso ao local. A pavimentação pode ser deixada onde está e cada mão livre pode realizar outras tarefas para extrair pedra fresca, ou a estrada pode simplesmente ser rasgada novamente para remendar a parede antes do amanhecer. [tv_wonder_organization_competence|E] ou [development|E] no local paga pela parede desabada."
 tv_engineering_department.7114.a:0 "Retire todas as mãos livres de outras tarefas para extrair pedra fresca."
 tv_engineering_department.7114.b:0 "Rasgue novamente a estrada de acesso para remendar o muro pela manhã."
 tv_engineering_department.7115.t:0 "Construção: Os vendedores de pão deixam salários atrasados"
 tv_engineering_department.7115.d:0 "Os vendedores de pão do mercado do acampamento fizeram as malas e partiram depois que o pagamento da semana passada foi entregue com três dias de atraso e metade em moedas cortadas. Os salários podem ser redefinidos para um calendário mais rigoroso e mais frequente para atrair os vendedores de volta, destruindo a actual rota salarial para o fazer, ou o campo pode simplesmente ficar sem o seu mercado e os trabalhadores podem cuidar das suas próprias refeições. [tv_wonder_organization_competence|E] ou [prosperity|E] no local paga os salários atrasados."
 tv_engineering_department.7115.a:0 "Rasgue a rota de pagamento e redesenhe-a em um cronograma mais rígido para atrair os vendedores de volta."
 tv_engineering_department.7115.b:0 "Deixe o acampamento ficar sem mercado e deixe os trabalhadores cuidarem das refeições."
 tv_engineering_department.7116.t:0 "Construção: O andaime da ponte desaparece durante a noite"
 tv_engineering_department.7116.d:0 "Os andaimes prontos para o reparo da ponte da capital foram silenciosamente carregados nos vagões durante a noite, e a equipe da ponte chegou e descobriu que a madeira havia desaparecido. Os percursos de abastecimento do próprio local podem ser prolongados e os seus turnos reconstruídos em torno de uma fonte de madeira mais distante, ou a ponte da capital pode simplesmente esperar enquanto as suas vigas terminam a maravilha primeiro. [tv_wonder_organization_competence|E] ou [development|E] na capital paga pelos andaimes faltantes."
 tv_engineering_department.7116.a:0 "Prolongue os ciclos de abastecimento do local e reconstrua os seus turnos em torno de uma fonte de madeira mais distante."
 tv_engineering_department.7116.b:0 "Deixe a ponte da capital esperar enquanto suas vigas terminam primeiro a maravilha."
 tv_engineering_department.7117.t:0 "Construção: O Guild Hall fica vazio ao meio-dia"
 tv_engineering_department.7117.d:0 "Metade dos vidraceiros e marceneiros da capital estão no local há três semanas consecutivas, e o salão da guilda em casa agora está praticamente vazio ao meio-dia. Os mestres podem ser transferidos para casa e as equipes locais reconstruídas em torno dos aprendizes restantes, ou os mestres podem simplesmente permanecer onde estão enquanto as próprias oficinas da capital ficam ociosas por mais algum tempo. [tv_wonder_organization_competence|E] ou [prosperity|E] na capital paga pelo salão da guilda vazio."
 tv_engineering_department.7117.a:0 "Leve os mestres para casa e reconstrua as equipes do local com os aprendizes restantes."
 tv_engineering_department.7117.b:0 "Mantenha os mestres no local e deixe as oficinas da capital paradas."
 tv_engineering_department.7118.t:0 "Construção:Uma plataforma com mão curta perde a corda"
 tv_engineering_department.7118.d:0 "Um cabo de elevação se partiu esta manhã quando uma equipe com poucos funcionários se dobrou na plataforma para marcar a hora, e três homens afundaram com ele. As gangues de reserva podem ser retiradas de suas próprias tarefas e jogadas na plataforma amanhã, independentemente do que aconteça com o cronograma, ou a mesma tripulação pode ser enviada de volta com falta de mão de obra assim que os feridos forem levados. [tv_wonder_organization_competence|E] ou o [population|E] que trabalha no local paga pela corda partida."
 tv_engineering_department.7118.a:0 "Tire as gangues de reserva de suas próprias tarefas e jogue-as na plataforma, dane-se o cronograma."
 tv_engineering_department.7118.b:0 "Envie a mesma tripulação com falta de pessoal de volta assim que os feridos forem levados."
 tv_engineering_department.7119.t:0 "Construção: Uma ponte curvada prende o comboio na lama"
 tv_engineering_department.7119.d:0 "Uma ponte sobre a estrada de abastecimento cedeu sob o peso das carroças de pedra, e metade do comboio está agora encalhado na lama abaixo dela. Os barqueiros na travessia dizem que farão o transporte dos vagões por um preço, e alguém vai pagar de uma forma ou de outra."
 tv_engineering_department.7119.a:0 "Deixe os vagões onde estão e encaminhe o resto ao redor da ponte quebrada, custe o que custar o [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7119.b:0 "Pague o preço dos barqueiros com o tesouro para fazer a travessia dos vagões hoje, drenando [gold|E]."
 tv_engineering_department.7120.t:0 "Construção: O selo Tollgate não é mais respeitado"
 tv_engineering_department.7120.d:0 "Os batedores do comboio foram rechaçados no pedágio de um vizinho, e seu alvará trazia um selo que o senhor local não honra mais. Alguém deve decidir se forçará a abertura do portão em nome da coroa ou deixará as carroças ficarem do lado de fora."
 tv_engineering_department.7120.a:0 "Vire o comboio de volta e encontre uma rota mais longa ao redor do pedágio disputado, deixando escapar [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7120.b:0 "Invoque a autoridade da coroa para forçar a abertura do portão agora, gastando [legitimacy|E] em uma disputa ainda não resolvida."
 tv_engineering_department.7121.t:0 "Construção: Aldeões bloqueiam a estrada devido a uma terceira requisição"
 tv_engineering_department.7121.d:0 "Os aldeões bloquearam a estrada com suas próprias carroças, recusando-se a se mover até que a terceira requisição desta temporada seja cancelada. O comboio não pode passar sem recuar ou trazer soldados para abrir caminho."
 tv_engineering_department.7121.a:0 "Volte, redirecione o comboio ao redor do bloqueio e aceite a paralisação que isso deixa em [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7121.b:0 "Envie soldados para limpar a estrada à força e conte o custo em [stability|E]."
 tv_engineering_department.7122.t:0 "Construção: O capataz recusa cavalos diante das testemunhas"
 tv_engineering_department.7122.d:0 "O capataz do comboio teve que recusar cavalos de tração novos em um tribunal rival e foi mandado embora na frente de testemunhas. Conseguir os cavalos agora significa cobrar favores que envergonham o tribunal; não pegá-los significa que os vagões rastejarão pelo resto do caminho."
 tv_engineering_department.7122.a:0 "Mande o capataz com os cavalos cansados que ele já tem e deixe o atraso aparecer no [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7122.b:0 "Cobrar favores publicamente para envergonhar o tribunal rival e fazê-lo entregar cavalos novos, gastando [prestige|E] nisso."
 tv_engineering_department.7123.t:0 "Construção: Os Carters comandam os cavalos de uma casa nobre"
 tv_engineering_department.7123.d:0 "Os carroceiros do comboio confiscaram os cavalos de carruagem de uma casa nobre quando as parelhas da maravilha ficaram aquém, e a família está exigindo-os de volta antes do anoitecer. A devolução dos cavalos paralisa as carroças; mantê-los prejudica a paciência da família."
 tv_engineering_department.7123.a:0 "Devolva os cavalos para a casa nobre esta noite e deixe as carroças esperarem sem eles, ao custo de [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7123.b:0 "Mantenha os cavalos emprestados trabalhando no comboio por mais algum tempo, não importa o que isso faça com [estate_satisfaction|E] entre os nobres."
 tv_engineering_department.7124.t:0 "Construção：Os vagões passaram em um dia de festa"
 tv_engineering_department.7124.d:0 "A estrada de abastecimento mais curta atravessa as terras do mosteiro, e as carroças passavam por ali num dia de festa, antes que alguém pensasse em pedir licença. Os monges fecharam o portão e querem que o comboio seja devolvido ou respondido."
 tv_engineering_department.7124.a:0 "Vire as carroças de volta e encontre outro caminho ao redor do mosteiro, deixando o desvio custar [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7124.b:0 "Empurre o comboio através do portão conforme planejado e deixe a ofensa ficar com [estate_satisfaction|E] entre o clero."
 tv_engineering_department.7125.t:0 "Construção：O comboio aguarda a tempestade na praça do mercado"
 tv_engineering_department.7125.d:0 "O comboio estacionou seus vagões na praça do mercado da cidade durante a noite para esperar a tempestade passar, e os feirantes não conseguiram abrir desde então. Os comerciantes estão exigindo que a praça seja limpa hoje, com ou sem tempestade."
 tv_engineering_department.7125.a:0 "Mova os vagões para o clima agora e deixe a tempestade desacelerar [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7125.b:0 "Segure os vagões na praça mais um pouco e deixe a raiva dos comerciantes recair sobre [estate_satisfaction|E] entre os burgueses."
 tv_engineering_department.7126.t:0 "Construção：A mesma aldeia perde seus bois pela terceira vez"
 tv_engineering_department.7126.d:0 "A mesma aldeia teve os seus bois e carroças requisitados para o comboio três vezes este mês, e os campos estão por arar. Ou os animais voltam para o arado ou as carroças se puxam sozinhas."
 tv_engineering_department.7126.a:0 "Mande os bois de volta aos campos e deixe o comboio mancar sem eles, ao custo de [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7126.b:0 "Requisite os bois pela quarta vez e deixe o esgotamento da aldeia transparecer em [estate_satisfaction|E] entre os camponeses."
 tv_engineering_department.7127.t:0 "Construção: Um deslizamento de terra enterra a estrada até o local"
 tv_engineering_department.7127.d:0 "Um deslizamento de terra enterrou o último trecho da estrada no local, e a única solução rápida é demolir os pátios recém-construídos para preenchimento e tábuas. Ou o local desiste de sua própria base ou o comboio espera do lado de fora do escorregador."
 tv_engineering_department.7127.a:0 "Deixe os pátios de preparação intactos e deixe o comboio ficar fora do escorregador, ao custo de [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7127.b:0 "Rasgue os pátios recém-construídos para preenchimento e tábuas para limpar a estrada, gastando [development|E] no local."
 tv_engineering_department.7128.t:0 "Construção: A estrada precisa ser ampliada além das barracas de trabalhadores"
 tv_engineering_department.7128.d:0 "Os vagões precisam que a estrada seja alargada, passando pelas barracas dos trabalhadores do local, e os vendedores não têm mais onde negociar. Ou as barracas descem para deixar o comboio passar ou as carroças passam lentamente."
 tv_engineering_department.7128.a:0 "Deixe os vagões passarem rastejantes e deixarem as barracas em pé, ao custo de [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7128.b:0 "Limpe as barracas dos vendedores para alargar a estrada para o comboio, gastando [prosperity|E] no local."
 tv_engineering_department.7129.t:0 "Construção: As ruas da capital são destruídas para empurrar o comboio"
 tv_engineering_department.7129.d:0 "Os próprios carroceiros e equipes de paralelepípedos da capital foram retirados de seu trabalho habitual para empurrar o comboio parado até o último quilômetro da cidade. As ruas da capital estão meio rasgadas e meio ociosas, quer as carroças esperem ou não."
 tv_engineering_department.7129.a:0 "Mande as tripulações da capital de volta ao seu trabalho e deixe o comboio parar nos portões, ao custo de [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7129.b:0 "Manter as tripulações da capital afastadas das ruas para terminar de puxar os vagões, gastando [development|E] na capital."
 tv_engineering_department.7130.t:0 "Obra：Carga Paralisada Ocupa Praça do Mercado da Capital"
 tv_engineering_department.7130.d:0 "O comboio requisitou a praça central do mercado da capital para armazenar a carga estagnada da maravilha, e as caravanas que normalmente ali comercializam foram recusadas por uma semana. Ou a carga segue em frente e o mercado reabre, ou a praça fica ainda mais um armazém."
 tv_engineering_department.7130.a:0 "Mova a carga para fora imediatamente, mesmo que de maneira brusca, e alivie a pressão sobre [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7130.b:0 "Deixe a carga na praça e mantenha as caravanas fechadas, gastando [prosperity|E] na capital."
 tv_engineering_department.7131.t:0 "Construção: Trabalhadores são colocados nas cordas em vez de bois"
 tv_engineering_department.7131.d:0 "Com os animais de tração esgotados e sem animais novos disponíveis, os capatazes do local começaram a colocar trabalhadores nas cordas para arrastar manualmente as carroças encalhadas. Ou os homens continuam puxando até a exaustão ou as carroças ficam onde estavam presas."
 tv_engineering_department.7131.a:0 "Deixe os carrinhos presos onde estão, em vez de continuar a trabalhar os homens, ao custo de [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7131.b:0 "Mantenha os trabalhadores puxando as cordas até que os carrinhos se movam, gastando o trabalho [population|E] no local."
 tv_engineering_department.7132.t:0 "Construção: Os cortadores de pedra param de trabalhar, sem remuneração"
 tv_engineering_department.7132.d:0 "A guilda dos lapidários parou de trabalhar, sem remuneração, por dois meses consecutivos. O capataz fica no portão com um livro-razão e o punho fechado, e alguém deve abrir o pátio ou o tesouro."
 tv_engineering_department.7132.a:0 "Deixe os cortadores andarem e deixe o progresso do [tv_wonder_construction|E] aguardar."
 tv_engineering_department.7132.b:0 "Pague os atrasados em [gold|E] e mantenha os cinzéis em movimento."
 tv_engineering_department.7133.t:0 "Construção: Um pretendente cita o mandado perdido"
 tv_engineering_department.7133.d:0 "Chegou ao conselho a notícia de que os pedreiros do local foram cobrados sem o mandado habitual, e um pretendente já está citando isso como prova de que a coroa governa por capricho. Alguém deve responder pelo atalho – seja pela obra em si, seja pelo mandato que a ordenou."
 tv_engineering_department.7133.a:0 "Retire a taxa e deixe o progresso do [tv_wonder_construction|E] ficar para trás."
 tv_engineering_department.7133.b:0 "Cumpra o mandado e deixe que custe a coroa [legitimacy|E]."
 tv_engineering_department.7134.t:0 "Construção: Os aldeões bloqueiam a pista do carrinho com seus corpos"
 tv_engineering_department.7134.d:0 "Os aldeões cujas áreas comuns foram cercadas para a estrada da pedreira bloquearam a trilha das carroças com seus próprios corpos. Ou as carroças voltam esta noite, ou os soldados limpam a estrada e o campo se lembra disso."
 tv_engineering_department.7134.a:0 "Vire os carrinhos e deixe o progresso do [tv_wonder_construction|E] aguardar."
 tv_engineering_department.7134.b:0 "Mande o guarda limpar a pista e gaste o [stability|E] que custa."
 tv_engineering_department.7135.t:0 "Construção:Um embaixador visita um andaime semi-desmoronado"
 tv_engineering_department.7135.d:0 "Um embaixador estrangeiro visitou o local cedo e encontrou um andaime meio desmoronado sobre argamassa verde; seu relatório já está sendo elaborado. O superintendente pode interromper o trabalho para refazê-lo corretamente ou deixar o embaixador escrever o que viu."
 tv_engineering_department.7135.a:0 "Elimine a seção defeituosa e deixe o progresso do [tv_wonder_construction|E] retroceder."
 tv_engineering_department.7135.b:0 "Deixe o andaime em pé e deixe a letra custar a coroa [prestige|E]."
 tv_engineering_department.7136.t:0 "Construção：Um Lorde Descobre Sua Reserva de Caça Marcada para a Pedreira"
 tv_engineering_department.7136.d:0 "Um senhor local descobriu sua reserva de caça marcada para a pedreira da maravilha e cavalgou até a corte furioso, exigindo a retirada dos agrimensores ou a honra de sua família seria respondida. Alguém abaixo deve ceder terreno."
 tv_engineering_department.7136.a:0 "Chame os topógrafos de volta e deixe o progresso do [tv_wonder_construction|E] ficar para trás."
 tv_engineering_department.7136.b:0 "Segure a linha da pedreira e deixe-a custar [estate_satisfaction|E] entre os nobres."
 tv_engineering_department.7137.t:0 "Construção: A Fundação transforma um antigo cemitério"
 tv_engineering_department.7137.d:0 "Os escavadores que preparavam a fundação encontraram um antigo cemitério paroquial que ninguém havia registrado, e os padres recusam-se a abençoar trabalhos futuros até que seja devidamente enterrado novamente. Alguém deve escolher entre as pás e os sacramentos."
 tv_engineering_department.7137.a:0 "Pare os escavadores até que o rito de enterro termine e deixe o progresso do [tv_wonder_construction|E] aguardar."
 tv_engineering_department.7137.b:0 "Ordene que a escavação continue e deixe custar [estate_satisfaction|E] entre o clero."
 tv_engineering_department.7138.t:0 "Construção：Carrinhos de alvenaria engolem a Praça dos Mercadores"
 tv_engineering_department.7138.d:0 "A praça dos mercadores está meio engolida por carroças de alvenaria há uma semana, e os mestres da guilda dizem que mais uma semana assim arruinará a feira de outono. Ou as carroças encontram um novo caminho esta noite, ou a feira se abre para um canteiro de obras."
 tv_engineering_department.7138.a:0 "Redirecione os carrinhos e deixe o progresso do [tv_wonder_construction|E] lento."
 tv_engineering_department.7138.b:0 "Mantenha os carrinhos na praça e deixe custar [estate_satisfaction|E] entre os burgueses."
 tv_engineering_department.7139.t:0 "Construção: As equipes do Corvee perdem a última semana seca"
 tv_engineering_department.7139.d:0 "As equipas de corvéia retiradas de três aldeias para a campanha deste mês perderam a última semana seca para a colheita, e os chefes estão a perguntar se os seus campos ou a maravilha vêm primeiro. Um dos dois deve dar."
 tv_engineering_department.7139.a:0 "Envie as equipes de volta aos campos e deixe o progresso do [tv_wonder_construction|E] lento."
 tv_engineering_department.7139.b:0 "Mantenha as equipes no local e deixe custar [estate_satisfaction|E] entre os camponeses."
 tv_engineering_department.7140.t:0 "Construção: Uma parede desabada enterra as próprias oficinas do local"
 tv_engineering_department.7140.d:0 "Um muro de contenção cedeu durante a noite e enterrou as oficinas e lojas inacabadas que haviam crescido ao redor do local. Reconstruí-los adequadamente custará algo ao local de qualquer maneira - mão-de-obra extraída da maravilha ou o que existe ao seu redor."
 tv_engineering_department.7140.a:0 "Retire as equipes da maravilha para reforçar as oficinas e deixe o progresso do [tv_wonder_construction|E] retroceder."
 tv_engineering_department.7140.b:0 "Deixe as oficinas como escombros e deixe custar [development|E] no local."
 tv_engineering_department.7141.t:0 "Construção: Vendedores ambulantes são expulsos para um novo pátio de estoque"
 tv_engineering_department.7141.d:0 "Os vendedores ambulantes e as pequenas oficinas que surgiram para alimentar as equipes de trabalho foram expulsos esta semana para limpar o terreno para um novo pátio de armazenamento, e a pouca economia do local acalmou-se com eles. O estoque ou o próprio comércio do local – um dos dois mantém o terreno."
 tv_engineering_department.7141.a:0 "Devolva o terreno aos mascates e deixe o progresso do [tv_wonder_construction|E] aguardar no estoque."
 tv_engineering_department.7141.b:0 "Mantenha o pátio de estoque e deixe custar [prosperity|E] no local."
 tv_engineering_department.7142.t:0 "Construção：Todos os pedreiros da capital são requisitados"
 tv_engineering_department.7142.d:0 "Os reparos da ponte da capital foram paralisados porque todos os pedreiros e carroças da cidade foram requisitados para a mais recente empreitada da maravilha. Os magistrados querem suas tripulações de volta antes que o período falhe; o site quer mais um mês."
 tv_engineering_department.7142.a:0 "Solte os pedreiros de volta à capital e deixe o progresso do [tv_wonder_construction|E] diminuir."
 tv_engineering_department.7142.b:0 "Mantenha os pedreiros no local e deixe custar [development|E] na capital."
 tv_engineering_department.7143.t:0 "Obra：Carrinhos de Pedra Fecham Duas Ruas da Capital"
 tv_engineering_department.7143.d:0 "Cargas de pedras trabalhadas que circulam pelo distrito comercial da capital fecharam duas ruas durante uma semana, e os lojistas dizem que o comércio já está se deslocando para outros lugares. Ou os comboios encontram uma rota mais longa ou o distrito continua sangrando."
 tv_engineering_department.7143.a:0 "Redirecione os comboios no caminho mais longo e deixe o progresso do [tv_wonder_construction|E] ficar para trás."
 tv_engineering_department.7143.b:0 "Mantenha os comboios na rota curta e deixe custar [prosperity|E] na capital."
 tv_engineering_department.7144.t:0 "Construção：Uma febre se espalha pelo acampamento dos trabalhadores"
 tv_engineering_department.7144.d:0 "Uma febre percorreu o acampamento dos trabalhadores e os médicos dizem que os doentes devem descansar ou ela se espalhará por toda a tripulação. Alguém deve escolher entre trabalhar com eles e perder o trabalho, ou demiti-los e perder os trabalhadores."
 tv_engineering_department.7144.a:0 "Deixe as equipes se recuperarem e deixe o progresso do [tv_wonder_construction|E] escapar."
 tv_engineering_department.7144.b:0 "Trabalhe com os doentes e deixe que custe o trabalho [population|E] no local."
 tv_engineering_department.7145.t:0 "Construção: Uma nova lacuna no Tesouro"
 tv_engineering_department.7145.d:0 "A maravilha tira moedas mais rápido do que os livros esperavam. O tesouro pode explicar a escassez, mas a explicação não cunha prata."
 tv_engineering_department.7145.a:0 "Estica os livros para cobrir a lacuna."
 tv_engineering_department.7146.t:0 "Construção:Poeira no Selo Real"
 tv_engineering_department.7146.d:0 "O endosso real se estende a muitos compromissos. O selo ainda mantém, mas parece mais fino."
 tv_engineering_department.7146.a:0 "Deixa o selo real ficar um pouco mais fino."
 tv_engineering_department.7147.t:0 "Construção:Cidades tranquilas são perturbadas"
 tv_engineering_department.7147.d:0 "O ritmo da construção pressiona a vida cotidiana. Os mercados abrem até tarde, as aldeias reclamam e a ordem cede um pouco."
 tv_engineering_department.7147.a:0 "Deixamos as aldeias reclamarem e prosseguirmos independentemente."
 tv_engineering_department.7148.t:0 "Construção：A quadra perde a cor"
 tv_engineering_department.7148.d:0 "A quadra empresta cor às obras e recebe em troca poeira. O prestígio desaparece em pequenas piadas públicas e ostentações incompletas."
 tv_engineering_department.7148.a:0 "Troca um pouco de brilho por algumas piadas judiciais."
 tv_engineering_department.7149.t:0 "Construção：Palavras Frias em Mesas Nobres"
 tv_engineering_department.7149.d:0 "As famílias nobres cederam mais uma vez. A concessão é formal e fria, o que muitas vezes é pior que a recusa."
 tv_engineering_department.7149.a:0 "Aceita a concessão fria e formal dos nobres."
 tv_engineering_department.7150.t:0 "Construção: Franzindo a testa diante do altar"
 tv_engineering_department.7150.d:0 "O calendário sagrado se curva novamente para o canteiro de obras. O clero obedece, mas a obediência tem arestas."
 tv_engineering_department.7150.a:0 "Aceitamos a obediência do clero, com limites e tudo."
 tv_engineering_department.7151.t:0 "Construção: Ledgers mais finos no mercado"
 tv_engineering_department.7151.d:0 "Os negócios de mercado giram em torno do projeto. Os burgueses podem lucrar com a grandeza, mas não quando todos os caminhos para isso estão bloqueados."
 tv_engineering_department.7151.a:0 "Limpe as estradas e continue construindo!"
 tv_engineering_department.7152.t:0 "Construção: Costas Mais Pesadas nas Aldeias"
 tv_engineering_department.7152.d:0 "Os ombros rurais suportam outro fardo. O projeto avança e a paciência da aldeia se torna cada vez mais escassa."
 tv_engineering_department.7152.a:0 "Empilha a carga extra nos ombros rurais."
 tv_engineering_department.7153.t:0 "Construção：O local desiste de suas ruas"
 tv_engineering_department.7153.d:0 "O site abre mão de mais de seu tecido comum. Uma maravilha do futuro ganha espaço, enquanto as ruas atuais perdem uso."
 tv_engineering_department.7153.a:0 "Sinaliza estas ruas para a maravilha de amanhã."
 tv_engineering_department.7154.t:0 "Construção: O local fica mais silencioso"
 tv_engineering_department.7154.d:0 "O local fica comercialmente mais silencioso à medida que a troca comum é direcionada para o monumento. A prosperidade só pode ser redirecionada algumas vezes antes de diminuir."
 tv_engineering_department.7154.a:0 "Direcionamos o comércio do local para o monumento mais uma vez."
 tv_engineering_department.7155.t:0 "Construção: Projetos de capital abrem caminho"
 tv_engineering_department.7155.d:0 "Os projetos de capital abrem caminho novamente para a maravilha. A cidade real continua grandiosa, mas parte de sua estrutura está sendo emprestada."
 tv_engineering_department.7155.a:0 "Empresta a própria estrutura da capital à maravilha."
 tv_engineering_department.7156.t:0 "Construção：Ruas Mais Tranquilas da Capital"
 tv_engineering_department.7156.d:0 "Os mercados de capitais perdem um pouco de brilho à medida que o projecto atrai crédito e bens. O tribunal pode chamar isso de patriótico; os comerciantes chamam isso de comércio mais lento."
 tv_engineering_department.7156.a:0 "Cada monumento empresta seu brilho de algum lugar."
 tv_engineering_department.7157.t:0 "Construção: Nomes adicionados à lista de lesões"
 tv_engineering_department.7157.d:0 "Os nomes são adicionados às listas de lesões. O trabalho continua, mas cada nova marca muda a forma como os trabalhadores olham para a pedra."
 tv_engineering_department.7157.a:0 "Anote os nomes e continue!"
 tv_engineering_department.7158.t:0 "Construção：Silêncio na Porta do Tesouro"
 tv_engineering_department.7158.d:0 "Uma forte demanda do local deixa o tesouro visivelmente vazio. O monumento continua, e o reino paga antes de poder admirar qualquer coisa."
 tv_engineering_department.7158.a:0 "Esvazia o tesouro e deixa a pedra subir de qualquer maneira."
 tv_engineering_department.7159.t:0 "Construção: rachaduras obrigatórias antes do local"
 tv_engineering_department.7159.d:0 "As exigências do canteiro de obras obrigam a coroa a uma postura indigna. A promessa de grandeza agora depende de uma autoridade prejudicada."
 tv_engineering_department.7159.a:0 "Deixamos a coroa dobrar para que as paredes possam subir."
 tv_engineering_department.7160.t:0 "Construção: Encomende lascas no imposto"
 tv_engineering_department.7160.d:0 "Uma perturbação mais severa ultrapassa a cerca. As autoridades podem nomear a causa, mas não podem fazer com que o país se sinta resolvido ao nomeá-la."
 tv_engineering_department.7160.a:0 "Deixa a agitação seguir seu curso além da cerca."
 tv_engineering_department.7161.t:0 "Construção: Honra vacila em público"
 tv_engineering_department.7161.d:0 "Um constrangimento público no site viaja mais rápido do que qualquer correção oficial. A honra paga pela pedra que ainda não está de pé."
 tv_engineering_department.7161.a:0 "Deixe-os falar!"
 tv_engineering_department.7162.t:0 "Construção: A nobre paciência é esculpida"
 tv_engineering_department.7162.d:0 "O projeto corta a paciência nobre até que a cortesia não consiga mais cobrir o som. Um monumento é um mau hóspede quando come uma herança."
 tv_engineering_department.7162.a:0 "Deixa os nobres resmungarem enquanto a alvenaria avança."
 tv_engineering_department.7163.t:0 "Construção: A paciência se esgota na sacristia"
 tv_engineering_department.7163.d:0 "Uma demanda de construção pisa muito perto do altar. O clero não esquece quando a piedade é tratada como um espaço aberto."
 tv_engineering_department.7163.a:0 "Aceitamos o silêncio frio do clero como o preço da pedra."
 tv_engineering_department.7164.t:0 "Construção: A raiva chega às ruas"
 tv_engineering_department.7164.d:0 "A raiva chega às vitrines enquanto o local de trabalho engole espaço, tempo e crédito. A cidade ouve o monumento antes de vê-lo."
 tv_engineering_department.7164.a:0 "Deixa as fachadas das lojas resmungarem enquanto os andaimes sobem."
 tv_engineering_department.7165.t:0 "Construção: A raiva rural não permanecerá quieta"
 tv_engineering_department.7165.d:0 "A raiva rural não ficará quieta após esta taxação. A sombra da maravilha atinge fazendas que talvez nunca vejam sua face acabada."
 tv_engineering_department.7165.a:0 "Deixe os campos aguentarem!"
 tv_engineering_department.7166.t:0 "Construção: O local recua"
 tv_engineering_department.7166.d:0 "As obras esvaziam o local com força suficiente para atrasá-lo. O monumento ainda não foi erguido, mas o local ao seu redor já foi pago."
 tv_engineering_department.7166.a:0 "Atrasa o local para que o monumento possa avançar."
 tv_engineering_department.7167.t:0 "Construção: A prosperidade do local está sufocada"
 tv_engineering_department.7167.d:0 "O canteiro de obras sufoca o mercado local por um tempo. As carroças ainda chegam, mas menos delas servem a cidade ao redor da pedra."
 tv_engineering_department.7167.a:0 "Permite que o mercado local diminua enquanto as obras continuam."
 tv_engineering_department.7168.t:0 "Construção：O Capital Paga em Pedra"
 tv_engineering_department.7168.d:0 "O capital paga em pedra, trabalho e reparos atrasados. Um monumento distante torna-se mais real enquanto os planos próximos se tornam vazios."
 tv_engineering_department.7168.a:0 "Deixamos que os reparos da capital aguardassem a maravilha distante."
 tv_engineering_department.7169.t:0 "Construção: O comércio da Cidade Real está pressionado"
 tv_engineering_department.7169.d:0 "O comércio da cidade real é pressionado pelas obras. A grandeza distante embota as ruas que devem financiá-la."
 tv_engineering_department.7169.a:0 "Entorpece as ruas da cidade real para financiar a grandeza em outro lugar."
 tv_engineering_department.7170.t:0 "Construção: O suor se transforma em sangue"
 tv_engineering_department.7170.d:0 "O suor se transforma em sangue no local. O monumento não foi cancelado, o que pode ser a parte mais cruel da lição."
 tv_engineering_department.7170.a:0 "Continuamos, embora o site tenha pago com sangue."
 tv_engineering_department.7171.t:0 "Construção：[tv_great_engineer|E] vence a rua"
 tv_engineering_department.7171.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] transforma um tour técnico em um triunfo público. O resultado é uma grande melhoria em [tv_wonder_domestic_support|E].\n\n#G Este evento ocorreu porque o atual [tv_great_engineer|E] tem capacidade militar efetiva acima de 80.#!"
 tv_engineering_department.7171.a:0 "Transforma uma inspeção de rotina em um triunfo público."
 tv_engineering_department.7172.t:0 "Construção：[tv_great_engineer|E] redesenha a Grand Line"
 tv_engineering_department.7172.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] redesenha o eixo principal com uma confiança que torna o plano maior confiável. O resultado é uma grande melhoria em [tv_wonder_scale_competence|E].\n\n#G Este evento ocorreu porque o atual [tv_great_engineer|E] tem capacidade militar efetiva acima de 80.#!"
 tv_engineering_department.7172.a:0 "Faz com que o grande eixo pareça inevitável, e não imprudente."
 tv_engineering_department.7173.t:0 "Construção：[tv_great_engineer|E] reconstrói a programação"
 tv_engineering_department.7173.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] reconstrói o cronograma de forma tão clara que até mesmo os encarregados rivais o obedecem. O resultado é uma grande melhoria em [tv_wonder_organization_competence|E].\n\n#G Este evento ocorreu porque o atual [tv_great_engineer|E] tem capacidade militar efetiva acima de 80.#!"
 tv_engineering_department.7173.a:0 "Alinhamo-nos com o novo horário."
 tv_engineering_department.7174.t:0 "Construção：[tv_great_engineer|E] abre o caminho"
 tv_engineering_department.7174.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] abre uma rota de abastecimento que faz com que os antigos atrasos pareçam quase tolos. O resultado é uma grande melhoria em [tv_wonder_logistics_competence|E].\n\n#G Este evento ocorreu porque o atual [tv_great_engineer|E] tem capacidade militar efetiva acima de 80.#!"
 tv_engineering_department.7174.a:0 "A estrada está finalmente aberta!"
 tv_engineering_department.7175.t:0 "Construção：[tv_great_engineer|E] impulsiona as principais obras"
 tv_engineering_department.7175.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] conduz as obras principais através de um problema que paralisou mãos menores. O resultado é uma grande melhoria no progresso do [tv_wonder_construction|E].\n\n#G Este evento ocorreu porque o atual [tv_great_engineer|E] tem capacidade militar efetiva acima de 80.#!"
 tv_engineering_department.7175.a:0 "Limpa as obras paralisadas."
 tv_engineering_department.7176.t:0 "Construção:[tv_great_engineer|E] acalma o boato"
 tv_engineering_department.7176.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] responde aos rumores com explicações claras o suficiente para estabilizar a confiança do público. O projeto ganha uma melhoria mais constante em [tv_wonder_domestic_support|E].\n\n#G Este evento ocorreu porque o atual [tv_great_engineer|E] possui capacidade militar efetiva acima de 50.#!"
 tv_engineering_department.7176.a:0 "Acalma os rumores com conversa franca."
 tv_engineering_department.7177.t:0 "Construção:[tv_great_engineer|E] define a medida"
 tv_engineering_department.7177.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] encontra margem suficiente no local para poupar o projeto de um design tímido. O projeto ganha uma melhoria mais constante em [tv_wonder_scale_competence|E].\n\n#G Este evento ocorreu porque o atual [tv_great_engineer|E] possui capacidade militar efetiva acima de 50.#!"
 tv_engineering_department.7177.a:0 "Damos ao plano espaço suficiente para ser ousado."
 tv_engineering_department.7178.t:0 "Construção:[tv_great_engineer|E] endireita os rolos"
 tv_engineering_department.7178.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] resolve uma bagunça teimosa de equipes, ferramentas e relógios. O projeto ganha uma melhoria mais constante em [tv_wonder_organization_competence|E].\n\n#G Este evento ocorreu porque o atual [tv_great_engineer|E] possui capacidade militar efetiva acima de 50.#!"
 tv_engineering_department.7178.a:0 "Coloca as equipes, ferramentas e relógios em ordem."
 tv_engineering_department.7179.t:0 "Construção：[tv_great_engineer|E] libera o comboio"
 tv_engineering_department.7179.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] elimina o pior nó na programação do comboio. O projeto ganha uma melhoria mais constante em [tv_wonder_logistics_competence|E].\n\n#G Este evento ocorreu porque o atual [tv_great_engineer|E] possui capacidade militar efetiva acima de 50.#!"
 tv_engineering_department.7179.a:0 "Elimina o pior nó na linha de abastecimento."
 tv_engineering_department.7180.t:0 "Construção: [tv_great_engineer|E] se adapta à junta crítica"
 tv_engineering_department.7180.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] se ajusta à peça crítica e permite que o próximo estágio comece mais cedo. O projeto obtém uma melhoria mais constante no progresso do [tv_wonder_construction|E].\n\n#G Este evento ocorreu porque o atual [tv_great_engineer|E] tem capacidade militar efetiva acima de 50.#!"
 tv_engineering_department.7180.a:0 "A toda velocidade!"
 tv_engineering_department.7181.t:0 "Construção：[tv_great_engineer|E] corteja a multidão"
 tv_engineering_department.7181.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] coloca as obras inacabadas diante da multidão e confia no espetáculo. A decisão pode suspender [tv_wonder_domestic_support|E] ou custar caro ao site.\n\n#Y Este evento ocorreu porque o atual [tv_great_engineer|E] tem capacidade militar efetiva entre 20 e 80.#!"
 tv_engineering_department.7181.a:0 "Deixa a multidão julgar as pedras inacabadas."
 tv_engineering_department.7182.t:0 "Construção：[tv_great_engineer|E] amplia o plano"
 tv_engineering_department.7182.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] encomenda o plano ampliado antes que todas as dúvidas sejam sanadas. A decisão pode suspender [tv_wonder_scale_competence|E] ou custar caro ao site.\n\n#Y Este evento ocorreu porque o atual [tv_great_engineer|E] tem capacidade militar efetiva entre 20 e 80.#!"
 tv_engineering_department.7182.a:0 "Encomende a planta ampliada antes que as dúvidas sejam sanadas."
 tv_engineering_department.7183.t:0 "Construção：[tv_great_engineer|E] reescreve a mudança"
 tv_engineering_department.7183.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] reescreve os turnos em uma única tarde e desafia o estaleiro a acompanhar. A decisão pode suspender [tv_wonder_organization_competence|E] ou custar caro ao site.\n\n#Y Este evento ocorreu porque o atual [tv_great_engineer|E] tem capacidade militar efetiva entre 20 e 80.#!"
 tv_engineering_department.7183.a:0 "Reescrevemos os turnos e desafiamos o quintal a acompanhar."
 tv_engineering_department.7184.t:0 "Construção:[tv_great_engineer|E] segue o caminho arriscado"
 tv_engineering_department.7184.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] envia os carrinhos por um caminho difícil e confia no cálculo ao invés do hábito. A decisão pode suspender [tv_wonder_logistics_competence|E] ou custar caro ao site.\n\n#Y Este evento ocorreu porque o atual [tv_great_engineer|E] tem capacidade militar efetiva entre 20 e 80.#!"
 tv_engineering_department.7184.a:0 "Envia os carrinhos pelo caminho mais difícil, confiando no cálculo ao invés do hábito."
 tv_engineering_department.7185.t:0 "Construção:[tv_great_engineer|E] testa um método mais rápido"
 tv_engineering_department.7185.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] testa um método mais rápido onde a falha seria muito pública. A decisão pode aumentar o progresso do [tv_wonder_construction|E] ou custar caro ao site.\n\n#Y Este evento ocorreu porque o atual [tv_great_engineer|E] tem capacidade militar efetiva entre 20 e 80.#!"
 tv_engineering_department.7185.a:0 "Experimente o método mais rápido - deixe-o provar seu valor em público!"
 tv_engineering_department.7186.t:0 "Construção:[tv_great_engineer|E] conta erroneamente a moeda"
 tv_engineering_department.7186.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] avalia mal o custo de uma correção e deixa o tesouro para cobrir a elegância. As obras continuam, mas [gold|E] sofre pelo descuido.\n\n#R Este evento ocorreu porque o atual [tv_great_engineer|E] possui capacidade militar efetiva inferior a 50.#!"
 tv_engineering_department.7186.a:0 "Resolve silenciosamente o déficit antes que a conta seja questionada."
 tv_engineering_department.7187.t:0 "Construção：[tv_great_engineer|E] Esquece o Tribunal"
 tv_engineering_department.7187.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] esquece que a autoridade real também é material e a gasta descuidadamente. As obras continuam, mas [legitimacy|E] sofre pelo descuido.\n\n#R Este evento ocorreu porque o atual [tv_great_engineer|E] possui capacidade militar efetiva inferior a 50.#!"
 tv_engineering_department.7187.a:0 "Controlamos o uso descuidado do nome da coroa."
 tv_engineering_department.7188.t:0 "Construção：[tv_great_engineer|E] interpreta mal as aldeias"
 tv_engineering_department.7188.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] subestima quanta perturbação uma resposta de engenharia simples pode causar. As obras continuam, mas [stability|E] sofre pelo descuido.\n\n#R Este evento ocorreu porque o atual [tv_great_engineer|E] possui capacidade militar efetiva inferior a 50.#!"
 tv_engineering_department.7188.a:0 "Suaviza a perturbação que a solução organizada deixou para trás."
 tv_engineering_department.7189.t:0 "Construção:[tv_great_engineer|E] fala muito em breve"
 tv_engineering_department.7189.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] fala com muita confiança antes que o trabalho possa sustentar o orgulho. As obras continuam, mas [prestige|E] sofre pelo descuido.\n\n#R Este evento ocorreu porque o atual [tv_great_engineer|E] possui capacidade militar efetiva inferior a 50.#!"
 tv_engineering_department.7189.a:0 "Volte com orgulho!"
 tv_engineering_department.7190.t:0 "Construção:[tv_great_engineer|E] menospreza os nobres"
 tv_engineering_department.7190.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] trata a paciência nobre como se fosse outro estoque de suprimentos. As obras continuam, mas [estate_satisfaction|E] entre os nobres sofre pelo descuido.\n\n#R Este evento ocorreu porque o atual [tv_great_engineer|E] possui capacidade militar efetiva inferior a 50.#!"
 tv_engineering_department.7190.a:0 "Lembra ao engenheiro que a nobre paciência não é um estoque para se extrair."
 tv_engineering_department.7191.t:0 "Construção：[tv_great_engineer|E] perturba o calendário"
 tv_engineering_department.7191.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] percorre o calendário religioso como se fosse uma mesa de entrega. As obras continuam, mas [estate_satisfaction|E] entre o clero sofre pelo descuido.\n\n#R Este evento ocorreu porque o atual [tv_great_engineer|E] possui capacidade militar efetiva inferior a 50.#!"
 tv_engineering_department.7191.a:0 "Afinal, deixe os altares manterem seu próprio calendário."
 tv_engineering_department.7192.t:0 "Construção:[tv_great_engineer|E] bloqueia o mercado"
 tv_engineering_department.7192.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] bloqueia o comércio normal enquanto busca uma linha mais limpa para o site. As obras continuam, mas [estate_satisfaction|E] entre os burgueses sofre pelo descuido.\n\n#R Este evento ocorreu porque o atual [tv_great_engineer|E] possui capacidade militar efetiva inferior a 50.#!"
 tv_engineering_department.7192.a:0 "Reabrimos a rua do mercado que o local havia fechado."
 tv_engineering_department.7193.t:0 "Construção：[tv_great_engineer|E] Subestima as Aldeias"
 tv_engineering_department.7193.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] confunde aldeias esgotadas com uma reserva não utilizada. As obras continuam, mas [estate_satisfaction|E] entre os camponeses sofre pelo descuido.\n\n#R Este evento ocorreu porque o atual [tv_great_engineer|E] possui capacidade militar efetiva inferior a 50.#!"
 tv_engineering_department.7193.a:0 "Permite que as aldeias exaustas descansem em vez de serem atraídas novamente."
 tv_engineering_department.7194.t:0 "Construção：[tv_great_engineer|E] corta as ruas erradas"
 tv_engineering_department.7194.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] elimina os arranjos locais errados e considera a lacuna útil. As obras continuam, mas [development|E] no local sofre pelo descuido.\n\n#R Este evento ocorreu porque o atual [tv_great_engineer|E] possui capacidade militar efetiva inferior a 50.#!"
 tv_engineering_department.7194.a:0 "Remendos nos arranjos que foram cortados por engano."
 tv_engineering_department.7195.t:0 "Construção：[tv_great_engineer|E] lota os meios de subsistência do local"
 tv_engineering_department.7195.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] exclui meios de subsistência locais enquanto abre espaço para as obras. As obras continuam, mas [prosperity|E] no local sofre pelo descuido.\n\n#R Este evento ocorreu porque o atual [tv_great_engineer|E] possui capacidade militar efetiva inferior a 50.#!"
 tv_engineering_department.7195.a:0 "Abrimos espaço novamente para os meios de subsistência que a clareira lotou."
 tv_engineering_department.7196.t:0 "Construção：[tv_great_engineer|E] faz mau uso do capital"
 tv_engineering_department.7196.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] faz mau uso de recursos de capital como se a cidade real não tivesse planos próprios. As obras continuam, mas [development|E] na capital sofre pelo descuido.\n\n#R Este evento ocorreu porque o atual [tv_great_engineer|E] possui capacidade militar efetiva inferior a 50.#!"
 tv_engineering_department.7196.a:0 "Devolve os recursos mal utilizados aos planos da própria capital."
 tv_engineering_department.7197.t:0 "Construção：[tv_great_engineer|E] perturba a cidade real"
 tv_engineering_department.7197.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] perturba o comércio da cidade real enquanto resolve um problema de engenharia local. As obras continuam, mas [prosperity|E] na capital sofre pelo descuido.\n\n#R Este evento ocorreu porque o atual [tv_great_engineer|E] possui capacidade militar efetiva inferior a 50.#!"
 tv_engineering_department.7197.a:0 "Acalmaremos o comércio da cidade real antes que a perturbação se espalhe."
 tv_engineering_department.7198.t:0 "Construção：[tv_great_engineer|E] avalia mal o limite de mão de obra"
 tv_engineering_department.7198.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] avalia mal o limite de corpos de trabalho. As obras continuam, mas laborando [population|E] no local sofre pelo descuido.\n\n#R Este evento ocorreu porque o atual [tv_great_engineer|E] possui capacidade militar efetiva inferior a 50.#!"
 tv_engineering_department.7198.a:0 "Alivie a tensão antes que mais ceda!"
 tv_engineering_department.7199.t:0 "Construção:[tv_great_engineer|E] quebra o razão"
 tv_engineering_department.7199.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] permite que um erro evitável invada as contas e esvazie mais moedas do que o orgulho pode desculpar. O erro não é suficiente para acabar com a maravilha, que pode ser a parte mais feia dela.\n\n#R Este evento ocorreu porque o atual [tv_great_engineer|E] tem capacidade militar efetiva abaixo de 20.#!"
 tv_engineering_department.7199.a:0 "Calcula a perda e fecha silenciosamente o livro-razão."
 tv_engineering_department.7200.t:0 "Construção:[tv_great_engineer|E] fere a coroa"
 tv_engineering_department.7200.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] transforma uma falha local evitável em um ferimento visível na coroa. O erro não é suficiente para acabar com a maravilha, que pode ser a parte mais feia dela.\n\n#R Este evento ocorreu porque o atual [tv_great_engineer|E] tem capacidade militar efetiva abaixo de 20.#!"
 tv_engineering_department.7200.a:0 "Usamos a nova cicatriz da coroa e seguimos em frente."
 tv_engineering_department.7201.t:0 "Construção：[tv_great_engineer|E] perturba o país"
 tv_engineering_department.7201.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] leva o país à desordem ao tentar resolver um problema no local. O erro não é suficiente para acabar com a maravilha, que pode ser a parte mais feia dela.\n\n#R Este evento ocorreu porque o atual [tv_great_engineer|E] tem capacidade militar efetiva abaixo de 20.#!"
 tv_engineering_department.7201.a:0 "Deixa a desordem se extinguir."
 tv_engineering_department.7202.t:0 "Construção:[tv_great_engineer|E] faz um espetáculo"
 tv_engineering_department.7202.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] torna o site um espetáculo e traz consigo a honra da corte. O erro não é suficiente para acabar com a maravilha, que pode ser a parte mais feia dela.\n\n#R Este evento ocorreu porque o atual [tv_great_engineer|E] tem capacidade militar efetiva abaixo de 20.#!"
 tv_engineering_department.7202.a:0 "Deixe o tribunal ter seu espetáculo!"
 tv_engineering_department.7203.t:0 "Construção：[tv_great_engineer|E] irrita as casas"
 tv_engineering_department.7203.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] irrita as casas ao resolver um problema do local por meio de seus privilégios. O erro não é suficiente para acabar com a maravilha, que pode ser a parte mais feia dela.\n\n#R Este evento ocorreu porque o atual [tv_great_engineer|E] tem capacidade militar efetiva abaixo de 20.#!"
 tv_engineering_department.7203.a:0 "Gasta a boa vontade das casas para manter a obra em andamento."
 tv_engineering_department.7204.t:0 "Construção：[tv_great_engineer|E] ofende o clero"
 tv_engineering_department.7204.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] ofende o clero ao fazer com que a paciência sagrada pague pela pedra secular. O erro não é suficiente para acabar com a maravilha, que pode ser a parte mais feia dela.\n\n#R Este evento ocorreu porque o atual [tv_great_engineer|E] tem capacidade militar efetiva abaixo de 20.#!"
 tv_engineering_department.7204.a:0 "Deixamos que a paciência sagrada pague a conta da pedra secular."
 tv_engineering_department.7205.t:0 "Construção：[tv_great_engineer|E] provoca os burgueses"
 tv_engineering_department.7205.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] provoca os burgueses ao tratar o comércio como um andaime solto. O erro não é suficiente para acabar com a maravilha, que pode ser a parte mais feia dela.\n\n#R Este evento ocorreu porque o atual [tv_great_engineer|E] tem capacidade militar efetiva abaixo de 20.#!"
 tv_engineering_department.7205.a:0 "Deixa os comerciantes consertarem seus próprios andaimes."
 tv_engineering_department.7206.t:0 "Construção：[tv_great_engineer|E] quebra as aldeias"
 tv_engineering_department.7206.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] quebra a paciência da aldeia com uma exigência que deveria ter sido evitada. O erro não é suficiente para acabar com a maravilha, que pode ser a parte mais feia dela.\n\n#R Este evento ocorreu porque o atual [tv_great_engineer|E] tem capacidade militar efetiva abaixo de 20.#!"
 tv_engineering_department.7206.a:0 "Pedimos perdão às aldeias por uma exigência que poderíamos ter poupado."
 tv_engineering_department.7207.t:0 "Construção：[tv_great_engineer|E] fere o local"
 tv_engineering_department.7207.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] prejudica o local ao resolver um problema técnico com destruição local. O erro não é suficiente para acabar com a maravilha, que pode ser a parte mais feia dela.\n\n#R Este evento ocorreu porque o atual [tv_great_engineer|E] tem capacidade militar efetiva abaixo de 20.#!"
 tv_engineering_department.7207.a:0 "Remenda a ferida que os próprios reparos causaram."
 tv_engineering_department.7208.t:0 "Construção:[tv_great_engineer|E] elimina os mercados do local"
 tv_engineering_department.7208.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] extingue os mercados do site por meio de uma decisão evitável. O erro não é suficiente para acabar com a maravilha, que pode ser a parte mais feia dela.\n\n#R Este evento ocorreu porque o atual [tv_great_engineer|E] tem capacidade militar efetiva abaixo de 20.#!"
 tv_engineering_department.7208.a:0 "Que assim seja – deixem as barracas ficarem em silêncio!"
 tv_engineering_department.7209.t:0 "Construção：[tv_great_engineer|E] esvazia os planos da capital"
 tv_engineering_department.7209.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] desfaz os planos da capital para encobrir um erro no local. O erro não é suficiente para acabar com a maravilha, que pode ser a parte mais feia dela.\n\n#R Este evento ocorreu porque o atual [tv_great_engineer|E] tem capacidade militar efetiva abaixo de 20.#!"
 tv_engineering_department.7209.a:0 "Destrói os planos da capital para corrigir o erro do site."
 tv_engineering_department.7210.t:0 "Construção：[tv_great_engineer|E] diminui a prosperidade da capital"
 tv_engineering_department.7210.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] diminui a prosperidade do capital através de um fracasso que nunca deveria ter chegado ao mercado. O erro não é suficiente para acabar com a maravilha, que pode ser a parte mais feia dela.\n\n#R Este evento ocorreu porque o atual [tv_great_engineer|E] tem capacidade militar efetiva abaixo de 20.#!"
 tv_engineering_department.7210.a:0 "Vemos o brilho da capital diminuir devido a um fracasso que nunca deveria ter visto."
 tv_engineering_department.7211.t:0 "Construção:[tv_great_engineer|E] causa vítimas"
 tv_engineering_department.7211.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] causa vítimas ao permitir que uma falha evitável passe pelas tripulações. O erro não é suficiente para acabar com a maravilha, que pode ser a parte mais feia dela.\n\n#R Este evento ocorreu porque o atual [tv_great_engineer|E] tem capacidade militar efetiva abaixo de 20.#!"
 tv_engineering_department.7211.a:0 "Conta os mortos que as tripulações nunca deveriam ter perdido."
