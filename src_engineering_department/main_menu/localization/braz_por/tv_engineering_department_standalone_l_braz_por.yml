 tv_engineering_department_standalone.1.d: "Seu país agora tem um Departamento de Engenharia, a instituição por trás de cada Grande Projeto que ele pode realizar.\n\nNomeie um Grande Engenheiro para começar. Eles primeiro desenvolvem um #high Conception#! para um projeto viável, que seu tribunal então avalia no #high Debate#! doméstico. Uma #high Survey#! confirma o local escolhido e, em seguida, a própria #high Construction#! começa, elevando o projeto em quatro partes até seu nível final. A conclusão é marcada por uma #high Cerimônia#! que concede uma recompensa duradoura.\n\nAbra o painel do Departamento de Engenharia a qualquer momento para verificar o progresso ou nomear um Grande Engenheiro."
