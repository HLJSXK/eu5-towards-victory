 TV_ENGINEERING_DEMAND_CLERGY_8: "Der Klerus verlangt, dass weltliche Stände sich vor der Segnung erniedrigen."
 TV_ENGINEERING_SOLUTION_CLERGY_8: "Lösung: Adlige und Bürger verlieren jeweils #N 5%#! Zufriedenheit."
 TV_ENGINEERING_DEMAND_CLERGY_9: "Der Klerus fordert Stiftungen, die die Inflation anheizen."
 TV_ENGINEERING_SOLUTION_CLERGY_9: "Lösung: #N 2,5 %#! Inflation gewinnen."
 TV_ENGINEERING_DEMAND_CLERGY_10: "Der Klerus fordert die Abberufung eines ungeeigneten Kabinettsmitglieds."
 TV_ENGINEERING_SOLUTION_CLERGY_10: "Lösung: Entfernen Sie ein zufälliges Kabinettsmitglied."
 TV_ENGINEERING_DEMAND_CLERGY_11: "Der Klerus fordert die Entfernung eines Künstlers, dem Eitelkeit vorgeworfen wird."
 TV_ENGINEERING_SOLUTION_CLERGY_11: "Lösung: Verliere einen zufälligen Künstler."
 TV_ENGINEERING_DEMAND_CLERGY_12: "Der Klerus verlangt die Herausgabe eines Kunstwerks für einen heiligen Zweck."
 TV_ENGINEERING_SOLUTION_CLERGY_12: "Lösung: Verliere ein zufälliges Kunstwerk."
