 TV_ENGINEERING_CEREMONY_UNIQUE_SECTION_TITLE: "@construction! Einzigartige Wunder"
 TV_ENGINEERING_CEREMONY_HELP_UNIQUE_TEXT_1: "Die meisten [tv_wonder_unique|e]s beginnen ihren [tv_wonder_ceremony|e] automatisch, sobald die Konstruktion abgeschlossen ist, ohne dass ein Stil manuell ausgewählt werden muss."
 TV_ENGINEERING_CEREMONY_HELP_UNIQUE_TEXT_2: "Der [tv_wonder_ceremony|e] durchläuft 8 Stufen und rückt alle paar Monate automatisch eine Stufe vor; Jede Phase hat ihre eigenen Kosten und ihren eigenen Geschmack."
