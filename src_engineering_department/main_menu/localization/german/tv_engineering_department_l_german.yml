 tv_engineering_department.551.t: "[tv_wonder_ceremony|E]: Die Gelehrten versammeln sich"
 tv_engineering_department.551.d: "Die Universitätsstadt senkt ihre Stimme zum Studieren. Meister, Studenten, Kopisten und Beamte versammeln sich um Vorlesungslisten und umstrittene Lesungen und verwandeln die fertiggestellten Straßen in eine einjährige Versammlung. Der [tv_wonder_ceremony|e] lässt sich nicht beeilen. Es fordert das Reich auf, Verwaltungsgeschwindigkeit gegen einen Lehrplan einzutauschen, der das derzeitige Gericht überdauern kann."
 tv_engineering_department.551.a: "Lassen Sie die Gelehrten ihr Jahr verbringen."
 tv_engineering_department.552.t: "[tv_wonder_ceremony|E]:Die Collegiate Hall beginnt"
 tv_engineering_department.552.d: "Die Pläne für die Collegiate Hall sind neben der Universitätsstadt versiegelt. Die neue Halle wird den Meistern einen Ort geben, an dem sie sich formell streiten können, den Studenten einen Ort, an dem sie sich auf nützliche Weise weniger sicher werden können, und die Krone wird eine Struktur bieten, durch die Gelerntes anerkannt werden kann, ohne völlig gezähmt zu werden. Der [tv_wonder_ceremony|e] wartet nun auf Türen, Bänke, Satzungen und ein Dach, unter dem das Studium Dauerhaftigkeit beanspruchen kann."
 tv_engineering_department.552.a: "Bauen Sie ein Haus zum Streiten."
 tv_engineering_department.561.t: "[tv_wonder_ceremony|E]: Die Kuppel ist verschleiert"
 tv_engineering_department.561.d: "Zur Weihe wird die große Kuppel verhüllt. Priester markieren Schwellenwerte, Sänger proben die maßvolle Reihenfolge der Ehrfurcht, und das Gericht akzeptiert ein Jahr, in dem sich die Legitimität langsamer entwickeln muss, damit die Heiligkeit vorsichtig voranschreiten kann. Der [tv_wonder_ceremony|e] bittet das Reich, unter einem bedeckten Himmel zu warten, bis der Tempel bereit ist, seinen Himmel zu öffnen."
 tv_engineering_department.561.a: "Lass die Kuppel geheiligt werden."
 tv_engineering_department.571.t: "[tv_wonder_ceremony|E]:Die Pilgertreppe öffnet sich"
 tv_engineering_department.571.d: "Die Treppe des Turmtempels wird den Pilgern für ein Jahr zum Aufstieg, Innehalten, Singen und für schmerzende Füße zur Verfügung gestellt. Die Werkstätten beschweren sich darüber, dass die Arbeitskräfte sich den Prozessionen beugen, aber der [tv_wonder_ceremony|e] ist dazu gedacht, Körpergröße durch Anstrengung zu lehren. Jeder Schritt macht den Turm vom Objekt zum Weg, und jeder Weg macht Hingabe sichtbar."
 tv_engineering_department.571.a: "Lass sie klettern."
 tv_engineering_department.572.t: "[tv_wonder_ceremony|E]:Die Tempelschule beginnt"
 tv_engineering_department.572.d: "Lehrer, Angestellte und Bauarbeiter markieren die Fundamente einer Tempelschule unter dem Turm. Der [tv_wonder_ceremony|e] wartet nun auf Klassenzimmer, in denen Lehren zur Gewohnheit, zum Lesen und Schreiben und zur rituellen Disziplinierung von Argumenten werden können. Ein Turm kann den Blick nach oben lenken; Eine Schule wird Stimmen beibringen, was sie sagen sollen, wenn sie hinschauen."
 tv_engineering_department.572.a: "Baue die Schule."
 tv_engineering_department.581.t: "[tv_wonder_ceremony|E]: Die Flussmesse beginnt"
 tv_engineering_department.581.d: "Entlang des verbreiterten Flusses versammeln sich Stände, Kähne, Mauttafeln und Festivalbanner. Der Handel verlangsamt sich, da der Fluss zum Spektakel werden soll, bevor er wieder zur Verkehrsader wird. Der [tv_wonder_ceremony|e] wird ein Jahr lang Händler, Schiffer und Beamte dazu bringen, gemeinsam die neue Wasserordnung durchzuführen."
 tv_engineering_department.581.a: "Lass den Fluss seine neue Menge kennenlernen."
 tv_engineering_department.582.t: "[tv_wonder_ceremony|E]:Das Kanalbüro beginnt"
 tv_engineering_department.582.d: "Vermessungsingenieure markieren ein ständiges Büro für die Kanalbehörde. Das Gebäude wird nicht groß genug sein, um mit den Flusswerken mithalten zu können, und genau deshalb ist es wichtig: Schleusen, Streitigkeiten, Zölle, Reparaturen und Beschwerden über die Trockenzeit brauchen einen Ort, an dem sich die Verantwortung nicht verstecken kann. Der [tv_wonder_ceremony|e] wartet nun darauf, dass die Verwaltung Wände erhält."
 tv_engineering_department.582.a: "Geben Sie dem Fluss einen Schreibtisch."
 tv_engineering_department.591.t: "[tv_wonder_ceremony|E]: Das Admiralitätsbüro beginnt"
 tv_engineering_department.591.d: "Die Werft stellt Gelände für ein Admiralitätsbüro bereit. Startrampen und Kräne können zwar Schiffe bauen, aber Flotten erfordern auch Befehle, Karten, Inspektionen und Beamte mit der Geduld, Holz zur Richtlinie zu machen. Der [tv_wonder_ceremony|e] wartet nun darauf, dass die Werft einen Marine-Geist erhält."
 tv_engineering_department.591.a: "Baue das Büro."
 tv_engineering_department.601.t: "[tv_wonder_ceremony|E]: Bastionen im Prozess"
 tv_engineering_department.601.d: "Für die Star Fortress City beginnt ein Jahr voller Prüfungen. Ingenieure testen Winkel, Kanoniere testen Schussfelder und Arbeiter entdecken, dass eine für Mathematik konzipierte Mauer immer noch mit Muskelkraft bezahlt werden muss. Die Produktion verlangsamt sich, da der [tv_wonder_ceremony|e] der Festung beibringt, die Theorie mit Stein zu beantworten."
 tv_engineering_department.601.a: "Testen Sie jeden Winkel."
 tv_engineering_department.602.t: "[tv_wonder_ceremony|E]: Das Arsenal-Viertel beginnt"
 tv_engineering_department.602.d: "Innerhalb der Festungsstadt sind Fundamente für ein Arsenalviertel markiert. Es wird Reparaturwerkstätten, Pulverlager und Sammelplätze in einem disziplinierten Bezirk zusammenfassen. Der [tv_wonder_ceremony|e] wartet nun auf den Teil der Festung, der die Verteidigung wiederholbar macht, nachdem der erste Alarm abgeklungen ist."
 tv_engineering_department.602.a: "Baue das Arsenalviertel."
 tv_engineering_department.611.t: "[tv_wonder_ceremony|E]: Signalfeuer werden angezündet"
 tv_engineering_department.611.d: "Wachposten entlang der Mauer beginnen ein Jahr mit Signalübungen. Rauch, Flammen, Reiter und lokale Märkte – sie alle folgen dem neuen Rhythmus, und der Handel leidet, während jede Route lernt, Warnungen zuerst zu bemerken. Der [tv_wonder_ceremony|e] macht die Wachsamkeit so öffentlich, dass selbst routinemäßige Reisen das Gefühl haben, beobachtet zu werden."
 tv_engineering_department.611.a: "Halten Sie die Uhr hell."
 tv_engineering_department.621.t: "[tv_wonder_ceremony|E]:Die Halle der Waffenmeister beginnt"
 tv_engineering_department.621.d: "Die Waffenkammer markiert den Grundstein für eine Halle der Waffenmeister. Die größten Waffengeschäfte können sich nicht nur auf Eisen und Hauptbücher verlassen; Sie brauchen erfahrene Hände, die Misserfolge beurteilen können, bevor es zum Kampf kommt. Der [tv_wonder_ceremony|e] wartet nun darauf, dass das Schiff einen dauerhaften Platz erhält."
 tv_engineering_department.621.a: "Bauen Sie für die Meister."
 tv_engineering_department.631.t: "[tv_wonder_ceremony|E]:Der nationale Katalog beginnt"
 tv_engineering_department.631.d: "Die Library of Nation beginnt mit ihrem Katalog. Wissenschaftler schließen Türen, entrollen Inventare und verlangsamen die Gesetzgebungsmaschinerie des Landes, während sie dem Gedächtnis beibringen, sich selbst wiederzufinden. Der [tv_wonder_ceremony|e] ist keine Parade, sondern ein Index: leise, anspruchsvoll und kraftvoll, wenn er fertig ist."
 tv_engineering_department.631.a: "Lassen Sie den Katalog wachsen."
 tv_engineering_department.632.t: "[tv_wonder_ceremony|E]: Das Pflichtexemplarbüro beginnt"
 tv_engineering_department.632.d: "Bauherren markieren die gesetzliche Hinterlegungsstelle neben der Bibliothek. Von hier aus werden Bücher, Dekrete, Kopien und Argumente nicht als Gefälligkeiten, sondern als Verpflichtungen gesammelt. Der [tv_wonder_ceremony|e] wartet nun auf den Raum, in dem der geschriebene Speicher des Realms zufällig stoppt."
 tv_engineering_department.632.a: "Bauen Sie das Büro der Erinnerung."

