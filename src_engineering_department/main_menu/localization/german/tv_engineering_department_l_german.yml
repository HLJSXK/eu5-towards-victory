 TV_ENGINEERING_ORG_LOG_HELP_ORGANIZATION_TEXT_1: "Die Geschwindigkeit des [tv_wonder_construction|e] hängt von der Anzahl der effektiven [ShowBuildingTypeName('tv_wonder_labor_camp')]s ab."
 TV_ENGINEERING_ORG_LOG_HELP_ORGANIZATION_TEXT_2: "Jeder Betrieb [ShowBuildingTypeName('tv_wonder_labor_camp')] bietet #P 1000#! monatlichen [tv_wonder_construction|e] Fortschritt."
 TV_ENGINEERING_ORG_LOG_HELP_ORGANIZATION_TEXT_3: "Der monatliche Baufortschritt wird durch den [tv_wonder_logistics_competence|e] des Standorts weiter modifiziert."
 TV_ENGINEERING_ORG_LOG_HELP_ORGANIZATION_TEXT_4: "Jeder in Betrieb befindliche [ShowBuildingTypeName('tv_wonder_labor_camp')] kostet etwa #N 25#!@gold! an monatlicher Wartung."
 TV_ENGINEERING_ORG_LOG_HELP_ORGANIZATION_TEXT_5: "Die [ShowBuildingTypeName('tv_wonder_labor_camp')]-Obergrenze hängt vom [tv_wonder_organization_competence|e] des Standorts ab."
 TV_ENGINEERING_ORG_LOG_HELP_LOGISTICS_TEXT_1: "[ShowBuildingTypeName('tv_wonder_material_dispatch_point')] wandelt Basismaterialien in [ShowGoodsName('tv_wonder_materials')] um."
 TV_ENGINEERING_ORG_LOG_HELP_LOGISTICS_TEXT_2: "[ShowGoodsName('tv_wonder_materials')]-Engpässe erhöhen den Unterhalt von [ShowBuildingTypeName('tv_wonder_labor_camp')]; Schwere Engpässe reduzieren den Durchsatz."
 TV_ENGINEERING_ORG_LOG_HELP_LOGISTICS_TEXT_3: "KI-Länder können [ShowBuildingTypeName('tv_wonder_material_dispatch_point')] bauen, sodass Importe rentabel sind."
