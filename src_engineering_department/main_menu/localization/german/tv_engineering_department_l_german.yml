 TV_ENGINEERING_SURVEY_HELP_TEXT_1: "Wählen Sie einen Ihrer eigenen Standorte, um [tv_wonder_survey|e] für das gesperrte [tv_wonder_construction|e] zu beginnen."
 TV_ENGINEERING_SURVEY_HELP_TEXT_2: "Der Vermessungsfortschritt steigt monatlich mit der militärischen Fertigkeit des [tv_great_engineer|e]."
 TV_ENGINEERING_SURVEY_HELP_TEXT_3: "Nach Abschluss der Umfrage werden die Standorte [tv_wonder_scale_competence|e], [tv_wonder_logistics_competence|e] und [tv_wonder_organization_competence|e] angezeigt."
 TV_ENGINEERING_SURVEY_HELP_TEXT_4: "Durch die Bestätigung des Standorts werden diese Kompetenzwerte gesichert und Organisation, Logistik und Konstruktion freigeschaltet."
 TV_ENGINEERING_SURVEY_HELP_TEXT_5: "Einige [tv_wonder_unique|e]s, die beim Spielstart bereits vorhanden sind, benötigen kein [tv_wonder_survey|e]."
