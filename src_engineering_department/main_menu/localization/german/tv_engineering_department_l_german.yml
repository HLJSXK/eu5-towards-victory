 TV_ENGINEERING_CEREMONY_PROTOCOL_WAITING: "Wählen Sie zunächst einen Zeremonienstil. [tv_wonder_generic|e]s machen drei Zweige verfügbar; [tv_wonder_unique|e]s können dieses Stadium erreichen, wenn bereits ein Skriptzweig ausgewählt ist."
 TV_ENGINEERING_CEREMONY_PROTOCOL_READY: "Der ausgewählte Ritus wird inszeniert und kann nun gestartet werden. Bewegen Sie den Mauszeiger über die Zeremonie-Schaltfläche, um die genauen Skriptkosten, den Auslöser und die Belohnung für diesen Zweig anzuzeigen."
 TV_ENGINEERING_CEREMONY_PROTOCOL_ONGOING: "Dieser Ritus ist bereits im Gange. Der Abschluss hängt nun vom Skript-Timer, dem Hilfsgebäude oder der vom Listener gesteuerten Abschlussbedingung des ausgewählten Zweigs ab."
 TV_ENGINEERING_CEREMONY_PROTOCOL_LOCKED: "Dieses großartige Projekt nutzt einen verschlossenen Zeremonienzweig. Überprüfen Sie den ausgewählten Ritus und das Dossier zum Großen Projekt für den erhaltenen Pfad."
 TV_ENGINEERING_CEREMONY_PROTOCOL_FINALIZED: "Das Great Project hat seine Einweihung bereits abgeschlossen. Der Ritus ist abgeschlossen und seine endgültigen Auswirkungen sind nun gesichert."
 TV_ENGINEERING_CEREMONY_ACTION_HINT: "Beim Starten der Zeremonie wird der aktuell ausgewählte Zweig verwendet und automatisch zu seiner kostenlosen, Gold- oder Prestige-Bestätigungsaktion weitergeleitet."
