 TV_ENGINEERING_CONSTRUCTION_UNIT_PENDING_TT: "Diese Baueinheit ist noch nicht fertig."
 TV_ENGINEERING_CONSTRUCTION_INFO_TEXT: "Die Stufe des Great Project entspricht der niedrigsten Anzahl abgeschlossener Einheiten unter seinen vier [tv_wonder_construction_part|e]s. Das Abschließen einer Einheit gewährt [tv_wonder_domestic_support|e]; Eine Erhöhung des Gesamtlevels gewährt einen weiteren Unterstützungsbonus."
 TV_ENGINEERING_FINISH_CONSTRUCTION_BUTTON: "@trigger_yes! Erklären Sie das großartige Projekt für abgeschlossen"
 TV_ENGINEERING_CONSTRUCTION_HELP_TEXT_1: "$BULLET$ [tv_wonder_construction|e] erweitert vier [tv_wonder_construction_part|e]s gleichzeitig: Fundament, Hauptstruktur, Funktion und Krönung. Verwenden Sie die Schaltflächen oben, um das aktuell im Bau befindliche Teil zu wechseln."
 TV_ENGINEERING_CONSTRUCTION_HELP_TEXT_2: "$BULLET$ Der Pegel von [tv_wonder_construction|e] hängt davon ab, welcher Teil am weitesten dahinter liegt; Das Gesamtniveau steigt erst, wenn der zurückgebliebene Teil eine neue Einheit vervollständigt."
 TV_ENGINEERING_CONSTRUCTION_HELP_TEXT_3: "$BULLET$ Sie können [tv_wonder_construction|e] für abgeschlossen erklären, sobald es mindestens eine Ebene abgeschlossen hat."
 TV_ENGINEERING_CONSTRUCTION_HELP_TEXT_4: "$BULLET$ Sie können daher zunächst ein kleineres Projekt abschließen und später ein größeres [tv_wonder_expansion|e]-Projekt verfolgen, ohne bereits verdiente Abschlussbelohnungen zu verlieren."
 TV_ENGINEERING_CONSTRUCTION_HELP_TEXT_5: "$BULLET$ Abschluss einer Baueinheit gewährt [tv_wonder_domestic_support|e]; Wenn diese Einheit auch die Gesamtstufe des Großen Projekts erhöht, gewährt sie einen weiteren [tv_wonder_domestic_support|e]-Bonus."
 TV_ENGINEERING_CONSTRUCTION_HELP_TT: "#T Construction#!\n[tv_wonder_construction|e] advances four [tv_wonder_construction_part|e]s at once: Foundation, Main Structure, Function, and Crowning. Use the buttons above to switch the part currently under construction.\nThe [tv_wonder_construction|e]'s level depends on whichever part is furthest behind; the total level only rises once that lagging part completes a new unit.\nYou can declare the [tv_wonder_construction|e] complete once it has finished at least one level.\nYou can therefore complete a smaller-scale project first and expand it to a larger scale later without losing any completion rewards already earned.\nCompleting any construction unit grants [tv_wonder_domestic_support|e]; if that unit also raises the Great Project's total level, it grants another [tv_wonder_domestic_support|e] bonus."
