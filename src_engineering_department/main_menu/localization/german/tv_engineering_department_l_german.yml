 TV_ENGINEERING_DEBATE_HELP_TEXT_1: "Die Adligen, Bürger und Geistlichen stellen jeweils ihre eigene Forderung; Die Befriedigung einer Forderung oder die Beantwortung mit Widerlegen/Bestechen führt zu [tv_wonder_domestic_support|e]."
 TV_ENGINEERING_DEBATE_HELP_TEXT_2: "Sobald [tv_wonder_domestic_support|e] #Y 100#! erreicht, können Sie die Debatte für beendet erklären und mit [tv_wonder_survey|e] fortfahren."
 TV_ENGINEERING_DEBATE_HELP_TEXT_3: "Die Unterstützung kann sich auch nach Ende der Debatte noch bis zu #Y 200#! ansammeln und für die folgenden Phasen in Reserve gehalten werden."
 TV_ENGINEERING_DEBATE_HELP_TEXT_4: "Sobald die Debatte abgeschlossen ist, lässt die Reserveunterstützung mit der Zeit nach."
