 tv_engineering_department.10.t: "[tv_great_engineer|E]:Großartiger Ingenieur ist gestorben"
 tv_engineering_department.10.d: "Unser [tv_great_engineer|E] ist verstorben. Die Nachricht bewegt sich durch den [tv_engineering_department|e], vorbei an geschlossenen Zeichenkästen, gestoppten Vermessungstischen und Assistenten, die plötzlich nicht mehr bereit sind, die letzten Kreidestriche zu löschen. Jeder unvollendete Plan sieht jetzt fragiler aus als gestern. Der Wundermechanismus kann seine Bücher behalten, aber [tv_wonder_construction|e] braucht einen lebendigen Geist, um den Ehrgeiz in die Tat umzusetzen. Bis ein Nachfolger ernannt wird, verfügt das Reich über Steine, Arbeit und Hoffnung, aber keinen Baumeister, der sie zur Zustimmung bewegen könnte.\n\n#weak Die Position des Großen Ingenieurs ist jetzt vakant – ernennen Sie so schnell wie möglich einen Nachfolger in der Ingenieursabteilung, um den Bau des Wunderwerks am Laufen zu halten.#!"
 tv_engineering_department.10.a: "Finden Sie einen Nachfolger, bevor die Pläne scheitern."
 tv_engineering_department.20.t: "[tv_wonder_construction|E]:Projekt bricht zusammen"
 tv_engineering_department.20.d: "Die Reserve von [tv_wonder_domestic_support|e] ist aufgebraucht. Höflinge, die das Projekt einst gelobt hatten, erinnern sich jetzt an dringende Geschäfte an anderer Stelle, Sprecher des Anwesens entdecken ihre Einwände wieder und Lieferanten verlangen eine Zahlung, bevor sich ein weiterer Karren bewegt. Da das großartige Projekt nicht mehr zu rechtfertigen ist, muss der [tv_engineering_department|e] das verschlossene Wunder aufgeben und die Schande ertragen. Der Boden ist geblieben, die ersten Spuren sind geblieben und vielleicht sind noch ein paar Steine übrig, aber die politische Brücke darunter ist eingestürzt. Kein Denkmal kann auf Stille, Angst und unbezahlten Versprechen bestehen.\n\n#weak Das Wunder wurde gewaltsam aufgegeben – Sie können den Standort und die Pläne jederzeit in der Ingenieurabteilung neu bewerten und von vorne beginnen.#!"
 tv_engineering_department.20.a: "Lassen Sie die Scham sauber aufzeichnen."
 tv_engineering_department.30.t: "[tv_wonder_construction|E]: Ein Design nimmt Gestalt an"
 tv_engineering_department.30.d: "Der [tv_great_engineer|E] hat die ersten Seiten gefüllt: raue Höhen, kostspielige Zweifel, verborgene Stärken des Geländes und ein paar elegante Unmöglichkeiten, die mit sichtbarem Bedauern durchgestrichen wurden. Das Konzept ist keine Stimmung mehr in der Werkstatt. Es ist bereit, zu einem Vorschlag zu werden, den das Gericht vergleichen, anfechten und schließlich entscheiden kann.\n\n#weak Das Designkonzept ist fertig – gehen Sie zur technischen Abteilung, um den Vorschlag des [tv_great_engineer|E] zu überprüfen, ihn anzunehmen oder von ihnen zu verlangen, ihn neu zu konzipieren, und treiben Sie dann die Debatte über das Wunder voran, um genügend inländische Unterstützung aufzubauen.#!"
 tv_engineering_department.30.a: "Zeigen Sie uns die Designs."
 tv_engineering_department.100.t: "[tv_wonder_debate|E]: Kundgebung der Adelshäuser"
 tv_engineering_department.100.d: "Mehrere Adelshäuser haben beschlossen, dass das Wunder ihr eigenes Andenken ebenso bereichern wird wie das des Reiches. Ihre Herolde sprechen von Stammsitzen, unsterblichen Namen und der angenehmen Möglichkeit, dass zukünftige Generationen privaten Ruhm mit öffentlichen Zwecken verwechseln könnten. Der [tv_engineering_department|e] korrigiert sie nicht. Unterstützung ist Unterstützung, und [tv_wonder_domestic_support|e] trägt oft Schmuck. Ihre Stimmen hallen jetzt mit nützlicher Lautstärke durch den Gerichtssaal."
 tv_engineering_department.100.a: "Lass sie gesehen werden."
 tv_engineering_department.101.t: "[tv_wonder_debate|E]: Edles Spiel"
 tv_engineering_department.101.d: "Es verbreiteten sich Gerüchte, dass das Wunder die Privilegien des Adels aufzehren würde, ohne ihm genügend Ehre zurückzugeben. Einige Häuser rechnen nicht mehr mit der künftigen Pracht des Denkmals, sondern mit den Sitzplätzen, Befreiungen, Arbeitern und dem zeremoniellen Vorrang, den es sie kosten könnte. Der [tv_engineering_department|e] kann Steine messen, aber der Rang der Verwundeten ist schwieriger zu ermitteln. Der Rückhalt in der Aristokratie lässt nach, und jedes Zögern lässt das ganze Projekt schwerer klingen. Pride ist vielleicht leichter als Marmor, lässt sich aber viel schwerer heben."
 tv_engineering_department.101.a: "Ihr Stolz ist teuer."
 tv_engineering_department.102.t: "[tv_wonder_debate|E]:Bürger sehen ihre Chance"
 tv_engineering_department.102.d: "Zunftmeister und Finanziers beginnen über Verträge, Straßen, Lagerhäuser und zukünftige Menschenmengen zu sprechen. Sie sehen in dem Wunder nicht nur Pracht, sondern auch Rechnungen, Transportrechte, gemietete Zimmer und Enkelkinder, die noch Gebühren einziehen. Der [tv_engineering_department|e] hört aufmerksam zu, denn der Handel hat ein Talent dafür, Ambitionen praktisch klingen zu lassen. Ihre Begeisterung verleiht der Debatte neuen Schwung. Der Wohlstand ist mit tintenfleckigen Fingern und hervorragender Arithmetik angekommen."
 tv_engineering_department.102.a: "Wohlstand hat eine überzeugende Stimme."
 tv_engineering_department.103.t: "[tv_wonder_debate|E]: Händler zählen die Kosten"
 tv_engineering_department.103.d: "Einige Bürger warnen nun, dass das Wunder Arbeit, Kredit und Transport binden wird. Sie prangern den Ruhm nicht direkt an; Sie fragen lediglich, wie viele Wagen, Löhne und Lager darunter eingeschlossen sein müssen. Diese Vorsicht lässt sich schwerer abtun als die Panik, denn jeder Satz kommt mit einer plausiblen Zahlenkolonne daher. Der [tv_engineering_department|e] sorgt dafür, dass das öffentliche Vertrauen allmählich abnimmt. Bücher können beim Vorlesen genauso heftig verletzen wie Reden."
 tv_engineering_department.103.a: "Bücher können ebenso heftig verletzen wie Reden."
 tv_engineering_department.104.t: "[tv_wonder_debate|E]: Geistlicher Segen"
 tv_engineering_department.104.d: "Prominente Geistliche gestalten das Wunder als sichtbares Zeichen von Ordnung und Hingabe. In Predigten wird gemessener Stein mit gehorsamen Seelen verglichen, stabile Fundamente mit treuer Lehre und öffentliche Arbeit mit der Disziplin eines gerechten Volkes. Der [tv_engineering_department|e] profitiert von dieser Sprache, auch wenn die Ingenieure privat Lotlinien Metaphern vorziehen. Die Debatte erhält einen feierlichen, beruhigenden Ton. [tv_wonder_domestic_support|E] erhebt sich leichter, wenn der Himmel die Gerüste zu genehmigen scheint."
 tv_engineering_department.104.a: "Ein nützlicher Segen."
 tv_engineering_department.105.t: "[tv_wonder_debate|E]: Predigten gegen Exzesse"
 tv_engineering_department.105.d: "Prediger verurteilen das Projekt als in Stein gemeißelte Eitelkeit. Sie fragen, ob ein hungriges Dorf Marmor braucht, ob die Seele des Herrschers durch die Höhe gerettet werden kann und ob Stolz nur deshalb heilig wird, weil ein Maurer ihn abgemessen hat. Der Vorwurf trifft Zuhörer unter denen, die ohnehin schon mit den Kosten unzufrieden sind. Der [tv_engineering_department|e] kann viele Einwände beantworten, aber Predigten sind so aufgebaut, dass sie Gegenargumente überstehen. Der Glaube kann Stiftungen segnen, aber er kann sie auch ablehnen."
 tv_engineering_department.105.a: "Der Glaube kann Marmor auch ablehnen."
 tv_engineering_department.200.t: "[tv_wonder_construction|E]: Eine Baueinheit fertiggestellt"
 tv_engineering_department.200.d: "Ein weiterer Abschnitt des Wunders hat eine sichtbare Schwelle überschritten. Gerüste werden abgebaut, Aufseher markieren die fertiggestellte Einheit und Arbeiter treten mit dem vorsichtigen Stolz von Menschen zurück, die wissen, dass die nächste Aufgabe genauso schwer sein wird. Die Öffentlichkeit kann endlich sehen, dass das Unmögliche zu Stein, Balken, Kanal oder Gewölbe wird. Selbst Kritikern fällt es schwerer, sich über etwas lustig zu machen, das einen Schatten wirft. [tv_wonder_construction|E] hat nicht nur Fortschritte gemacht, sondern auch Beweise.\n\n#weak Diese Baueinheit ist fertig – die technische Abteilung wird mit der nächsten Einheit des Wunders fortfahren.#!"
 tv_engineering_department.200.a: "Halten Sie die Arbeit in Bewegung."
 tv_engineering_department.201.t: "[tv_wonder_construction|E]:Das Projekt entsteht"
 tv_engineering_department.201.d: "Bei [SCOPE.sLocation('tv_wonder_event_location').GetName] haben die vier fertiggestellten Module ihren Zweck erfüllt. Ihre provisorischen Werke können nun abgebaut werden und der Bau des erhaltenen Kerns des Wunderwerks selbst kann endlich beginnen. Fundament, Körper, Funktion und Krönung sind keine konkurrierenden Fragmente mehr; Sie sind bereit, zu einem einzigen Monument zusammengelegt zu werden.\n\n#weak Die vier Module sind zum Kern des Wunders verschmolzen – sehen Sie sich die Technikabteilung an, wie das endgültige Gebäude automatisch mit dem Bau beginnt, sobald das Wunder seinen Fertigstellungsgrad erreicht.#!"
 tv_engineering_department.201.a: "Demontieren Sie die Module und heben Sie den Kern an."
 tv_engineering_department.202.t: "[tv_wonder_construction|E]: Die Arbeitsständer sind komplett"
 tv_engineering_department.202.d: "Der [tv_engineering_department|E] hat die Bauphase für abgeschlossen erklärt. Die Baustellen werden abgebaut, die Arbeitstrupps ziehen sich zurück und die Bücher der letzten Auftragnehmer schließen mit einer Zufriedenheit ab, die nur Buchhalter wirklich genießen. Das Denkmal steht jetzt, aber Stein allein ist noch nicht das Schicksal. Die unvollendete Frage hat sich von der Frage, wie man es baut, zur Frage, wie man es weiht, gewandelt. Das Reich hat einen Körper geschaffen; Das [tv_wonder_ceremony|e] muss ihm nun eine öffentliche Seele verleihen.\n\n#weak Die Bauphase ist abgeschlossen – besuchen Sie die technische Abteilung, um einen Stil für die Einweihungszeremonie auszuwählen und mit der Zeremonie des Wunders zu beginnen.#!"
 tv_engineering_department.202.a: "Bereiten Sie die Zeremonie vor."
 tv_engineering_department.202.a.tt: "Der $tv_wonder_labor_camp$ auf der Baustelle wird abgerissen."
 tv_engineering_department.203.t: "[tv_wonder_construction|E]: Die Debatte ist beigelegt"
 tv_engineering_department.203.d: "Das Gericht hat das Ende der Wunderdebatte verkündet. Der Widerstand ist nicht verschwunden, aber er wurde gezählt, beantwortet, unterdrückt oder in den offiziellen Plan integriert. Das Projekt lässt nun Reden hinter sich und betritt die gemessene Welt von Boden, Straßen, Gefällen und Entfernungen. Der [tv_great_engineer|e] fragt nach einem zu vermessenden Standort. Ab diesem Zeitpunkt wird sich [tv_wonder_domestic_support|e] langsam entleeren, daher sollte die nächste Reihenfolge praktisch sein: Wählen Sie, wo das Denkmal tatsächlich stehen kann.\n\n#weak Die Debatte ist beendet – wählen Sie einen Bauplatz für das Wunder in der Ingenieurabteilung, um mit der Vermessung und dem Bau zu beginnen.#!"
 tv_engineering_department.203.a: "Beginnen Sie mit der Umfrage."
 tv_engineering_department.300.t: "[tv_wonder_survey|E]:Umfrage abgeschlossen"
 tv_engineering_department.300.d_high: "Der [tv_wonder_survey|E] kehrt mit hervorragenden Messwerten zurück. Der gewählte Boden ist für Ehrgeiz geeignet, Vorräte können ihn erreichen und die Arbeitstrupps sehen einen Weg durch das Gelände, bevor das erste dauerhafte Lager errichtet wird. Der [tv_great_engineer|e] liest die Tabellen zweimal, nicht weil die Zahlen zweifelhaft sind, sondern weil gute Nachrichten eine Überprüfung verdienen. Größe, Logistik und Organisation weisen nun in die gleiche Richtung. Die Seite scheint geradezu bestrebt zu sein, auf nützliche Weise schwierig zu werden."
 tv_engineering_department.300.d_mid: "Der [tv_wonder_survey|E] kehrt mit nutzbaren Messwerten zurück. Die Website wird die Arbeit nicht mühelos machen, aber kein ehrliches Wunder hat das jemals versprochen. Der Boden hat Grenzen, die Straßen haben Stimmungen und der Arbeitsplan erfordert eher Disziplin als Romantik. Dennoch kann der [tv_engineering_department|e] die genannten Schwachstellen nun umplanen. Ein gemessenes Hindernis ist bereits zur Hälfte domestiziert."
 tv_engineering_department.300.d_low: "Der [tv_wonder_survey|E] kehrt mit beunruhigenden Messwerten zurück. Der Standort kann noch deklariert werden, aber die Karten sehen nervös aus und die Vermesser wählen ihre Worte mit professioneller Sorgfalt. Der Boden, die Routen oder die Arbeitsorganisation können unserem Ehrgeiz stärker entgegenwirken als zunächst erwartet. Der [tv_engineering_department|e] warnt davor, dass ein anderer Standort dem Wunder möglicherweise besser dient. Hier weiterzumachen, wäre eine mit offenen Augen getroffene Entscheidung, die besser ist als Blindheit und teurer als Vertrauen."
 tv_engineering_department.300.a: "Überprüfen Sie das Ergebnis."
 tv_engineering_department.310.t: "[tv_wonder_survey|E]: Versteckte Fundamente"
 tv_engineering_department.310.d: "Gutachter entdecken stabilen Boden und alten Stein unter den geplanten Arbeiten. Was zunächst nur fest schien, erscheint nun fast vorbereitet, als hätte eine vergessene Hand die Erde in nützlicher Ordnung hinterlassen. Die [tv_wonder_survey|e]-Teams streiten sich fröhlich über Belastung, Tiefe und das seltene Vergnügen, ein Problem zu finden, das sich von selbst gelöst hat. Die mögliche Größe des Wunders sieht großzügiger aus als zunächst angenommen. Sogar der [tv_great_engineer|e] erlaubt ein Lächeln, bevor er nach einer weiteren Messung fragt."
 tv_engineering_department.310.a: "Ausgezeichnet."
 tv_engineering_department.311.t: "[tv_wonder_survey|E]:Tückischer Boden"
 tv_engineering_department.311.d: "Der Boden verschiebt sich dort, wo die ersten Karten Gewissheit versprachen. Die Pfähle werden dünner, die Kreidelinien stimmen nicht mehr überein und die Vermessungsteams fangen an, in kürzeren Sätzen zu sprechen. Zusätzliche Unterstützung wird den praktischen Umfang des Wunders einschränken, nicht weil der Ehrgeiz nachgelassen hat, sondern weil die Erde mit eigenen Bedingungen geantwortet hat. Der [tv_engineering_department|e] kann weiterhin fortfahren. Es muss einfach aufhören, so zu tun, als sei der Boden passiv."
 tv_engineering_department.311.a: "Passen Sie die Pläne an."
 tv_engineering_department.312.t: "[tv_wonder_survey|E]: Versorgungsleitungen löschen"
 tv_engineering_department.312.d: "Der [tv_wonder_survey|E] findet Routen, die Steine, Holz und Werkzeuge mit weniger Reibung als erwartet transportieren können. Eine vernachlässigte Straße mündet in eine nutzbare Flussbiegung, ein Bereitstellungsfeld erweist sich als größer als die Erinnerung, und örtliche Transportunternehmen kennen bereits Abkürzungen, die keine königliche Karte kennengelernt hat. [tv_wonder_materials|E] wird sich sauberer bewegen, weil das Land mehrere stille Gefälligkeiten geboten hat. Logistik kommt ausnahmsweise nicht als Vorwurf daher. Es handelt sich um eine Karte mit guten Rändern."
 tv_engineering_department.312.a: "Markieren Sie sie sorgfältig."
 tv_engineering_department.313.t: "[tv_wonder_survey|E]: Defekte Ansätze"
 tv_engineering_department.313.d: "Straßen, Wasserstraßen und Stützpunkte erweisen sich als schlimmer als in den ersten Berichten behauptet. Räder versinken dort, wo die Straße halten soll, Boote verlieren Zeit dort, wo das Wasser fließen soll, und Bereitstellungsfelder schrumpfen, sobald echte Wagen in sie hineinfahren. Die Logistik wird schwieriger zu bändigen sein, und [tv_wonder_materials|e] wird den Optimismus nicht verzeihen. Der [tv_engineering_department|e] stellt sich nun der alten Wahrheit großer Werke: Ein Denkmal beginnt lange bevor der Stein es erreicht. Manchmal beginnt es mit Schlamm."
 tv_engineering_department.313.a: "Wir werden kompensieren."
 tv_engineering_department.314.t: "[tv_wonder_survey|E]:Ordnung im Feld"
 tv_engineering_department.314.d: "Die Messtrupps finden einen sauberen Rhythmus. Flaggen werden gesetzt, Notizen werden kopiert, Aufseher hören auf, einander zu widersprechen, und grobe Beobachtungen werden zu einem System, dem zukünftige Arbeiter tatsächlich gehorchen können. Dies ist keine dramatische Entdeckung, aber sie könnte nützlicher sein als eine. [tv_wonder_construction|E] beruht auf dem langweiligen Wunder, dass viele Leute das Gleiche in der gleichen Reihenfolge tun. Heute scheint dieses Wunder möglich."
 tv_engineering_department.314.a: "Eine gute Angewohnheit."
 tv_engineering_department.315.t: "[tv_wonder_survey|E]: Umfrageverwirrung"
 tv_engineering_department.315.d: "Widersprüchliche Karten und rivalisierende Aufseher verlangsamen die Arbeit. Eine Mannschaft schwört auf den Bergrücken, eine andere auf die Straße, und eine dritte hat eine Tabelle erstellt, die so präzise ist, dass jeder ihr sofort misstraut. Der [tv_engineering_department|e] verliert das Vertrauen in seinen zukünftigen Organisationsplan, weil Verwirrung, sobald sie niedergeschrieben ist, fast offiziell aussieht. Das Wunder kann schlechteren Boden leichter überstehen als schlechtes Kommando. Bevor die Wehen beginnen, muss jemand den Karten beibringen, sich zu einigen."
 tv_engineering_department.315.a: "Entwirre es."
 tv_engineering_department.320.t: "[tv_wonder_survey|E]:Spezielle Instrumente angefordert"
 tv_engineering_department.320.d: "Die Vermesser benötigen teure Instrumente und spezialisierte Handwerker. Sie sprechen von Winkeln, die für normales Sehen zu fein sind, von Bodentests, die zu heikel für Vermutungen sind, und von Messungen, die die Maßstabsbeurteilung des [tv_great_engineer|e] weniger abhängig von edlem Optimismus machen würden. Das Gericht entscheidet über die Kosten; Die Ingenieure hören Präzision. Ihre Finanzierung sollte die Umfrage verbessern, aber sie wird auch jedem zukünftigen Antragsteller zeigen, dass Genauigkeit ihren Preis hat. Durch die Weigerung bleiben die alten Werkzeuge an Ort und Stelle und die Unbekannten lächeln höflich."
 tv_engineering_department.320.a: "Zahlen Sie für Präzision."
 tv_engineering_department.320.b: "Begnügen wir uns mit dem, was wir haben."
 tv_engineering_department.321.t: "[tv_wonder_survey|E]: Prestige des Fachwissens"
 tv_engineering_department.321.d: "Der [tv_great_engineer|E] fordert das Gericht auf, eine umstrittene Logistikmethode öffentlich zu unterstützen. Der Vorschlag verspricht eine schnellere Bewegung von [tv_wonder_materials|e], weniger untätige Arbeiter und genau die Art von Neuheit, die konservative Aufseher dazu bringt, sich zu räuspern. Durch die Erhöhung des Ansehens des Reiches könnte der Versorgungsplan überzeugender werden. Scheitert es, wird die Peinlichkeit auch öffentlich. Bei großen Projekten wird der Staat oft dazu aufgefordert, zu spielen, bevor die erste Masse die Regeln versteht."
 tv_engineering_department.321.a: "Setzen Sie unseren Namen darauf."
 tv_engineering_department.321.b: "Keine öffentliche Unterstützung."
 tv_engineering_department.322.t: "[tv_wonder_survey|E]:Gildenkoordination"
 tv_engineering_department.322.d: "Städtische Lieferanten können bei der Standardisierung der Erhebungsaufzeichnungen helfen, erwarten aber Zugeständnisse für die Störung. Ihre Angestellten verstehen Gewichte, Zählungen, Routen und die stille Tyrannei, eine Liste einer anderen zuzuordnen. Der [tv_engineering_department|e] könnte diese Kompetenz gebrauchen, insbesondere bevor [tv_wonder_materials|e] ernsthaft mit der Arbeit beginnt. Doch jedes Zugeständnis schreibt den Handel ein Stück tiefer in die Erinnerung des Denkmals ein. Wir können die Bestellung kaufen, aber die Bestellung wird sich daran erinnern, wer sie verkauft hat."
 tv_engineering_department.322.a: "Stützen Sie sich auf die Gilden."
 tv_engineering_department.322.b: "Vermeiden Sie neue Verpflichtungen."
 tv_engineering_department.401.t: "[tv_wonder_ceremony|E]: Die Meditation beginnt"
 tv_engineering_department.401.d: "Das vollendete Wunder liegt im Schweigen. Priester, Ingenieure und königliche Beobachter ziehen sich aus dem gewöhnlichen Spektakel zurück, damit ein Jahr der Sparmaßnahmen dem Denkmal seine endgültige Bedeutung verleihen kann. Der [tv_wonder_ceremony|e] beginnt nicht mit Lärm, sondern mit der bewussten Ablehnung davon. Sogar der [tv_engineering_department|e] muss Geduld lernen, denn keine Berechnung kann ein Ritual beschleunigen, das Zurückhaltung lehren soll. Besucher empfinden die Stille zunächst als beunruhigend. Dann beginnen sie, ihre Stimme zu senken, bevor sie verstehen, warum."
 tv_engineering_department.401.a: "Lass das Jahr sich wenden."
 tv_engineering_department.410.t: "[tv_wonder_ceremony|E]: Gesandte angefordert"
 tv_engineering_department.410.d: "Ein benachbartes Gericht bittet uns, einen Abgesandten zu entsenden, um der Einweihung seiner großen Achse beizuwohnen. Die Einladung ist zeremoniell, aber bei Zeremonien üben Staaten, sich ihrer zu erinnern. Durch die Anwesenheit werden wir uns unter denjenigen profilieren, die das neue Denkmal zuerst gesehen haben, im richtigen Moment applaudiert haben und die Botschaft verstanden haben, ohne dass sie einer Erklärung bedurfte. Eine Ablehnung würde die Reise retten und den Platz in ihrer Geschichte einbüßen. Manche Steine werden zu Hause gebaut; andere erwarten Zeugen aus dem Ausland."
 tv_engineering_department.410.a: "Schicken Sie den Abgesandten."
 tv_engineering_department.410.b: "Lehnen Sie die Einladung ab."
 tv_engineering_department.411.t: "[tv_wonder_ceremony|E]: Ein Abgesandter trifft ein"
 tv_engineering_department.411.d: "Das eingeladene Gericht hat angenommen. Ein weiterer ausländischer Abgesandter schließt sich der rituellen Prozession mit geübter Würde, einem reisenden Gefolge und einem Blick darauf an, sowohl Erhabenheit als auch Schwäche zu erkennen. Der [tv_wonder_ceremony|e] wird mit jedem externen Zeugen überzeugender, weil Ruhm lauter wird, wenn er mit einem anderen Akzent wiederholt wird. Prozessionsleiter passen die Reihenfolge des Einzugs an; Schriftgelehrte passen die Liste der Ehrengäste an. Der zeremonielle Fortschritt des Wunders schreitet voran, einer nach dem anderen."
 tv_engineering_department.411.a: "Empfange sie mit Ehre."
 tv_engineering_department.412.t: "[tv_wonder_ceremony|E]: Einladung abgelehnt"
 tv_engineering_department.412.d: "Das geladene Gericht lehnte die Entsendung eines Abgesandten ab. Ihre Antwort ist höflich genug, um Beleidigungen zu vermeiden, und kalt genug, um im Gedächtnis zu bleiben. Der [tv_wonder_ceremony|e] muss sein Publikum woanders finden, denn ein Denkmal, das ausländische Ehrfurcht erweckt, kann sich keinen leeren diplomatischen Platz leisten. Höflinge schlagen bereits neue Namen, schmeichelhaftere Routen und Briefe vor, die weniger wie Bitten klingen. Glory mag keine Ablehnung, aber sie kann umgeleitet werden."
 tv_engineering_department.412.a: "Laden Sie einen anderen Nachbarn ein."
 tv_engineering_department.421.t: "[tv_wonder_ceremony|E]: Die Triumphparade beginnt"
 tv_engineering_department.421.d: "Entlang der Achse werden Banner gehisst, doch der Parade fehlt noch der Beweis. Trommler können proben, Pferde können die Steine mit zeremoniellen Hufen polieren und Offiziere können sich wunderbar selbstbewusst arrangieren, doch nichts davon ist ein Sieg. Der [tv_wonder_ceremony|e] fordert einen Triumph, den der Krieg selbst bescheinigen muss. Bis dahin bereitet sich die Militärstadt auf eine Ehre vor, die sie nicht vollständig verdient hat. Nur ein Sieg im Krieg wird dem Denkmal die Erinnerung geben, die es verlangt."
 tv_engineering_department.421.a: "Dann muss der Sieg kommen."
 tv_engineering_department.431.t: "[tv_wonder_ceremony|E]: Das Bürgerfest beginnt"
 tv_engineering_department.431.d: "Die Stadt öffnet ihre geordneten Plätze für ein Jahr voller Zeremonien, Spiele, Prozessionen und öffentlicher Belehrung. Die Werkstätten gehen langsam voran, aber die Menschen lernen die Form der Bürgerdisziplin kennen, indem sie sie durchlaufen, beobachten und sich darüber beschweren, bis sie sich vertraut anfühlen. Der [tv_wonder_ceremony|e] verwandelt den städtischen Raum in eine Lektion, die unter freiem Himmel wiederholt wird. Kinder merken sich Routen, bevor sie die Parolen verstehen. Die Bürgerhauptstadt lehrt Gehorsam, indem sie ihn festlich gestaltet."
 tv_engineering_department.431.a: "Lasst die Bürger zusammenkommen."
 tv_engineering_department.461.t: "[tv_wonder_ceremony|E]: Das Freihandelsfest beginnt"
 tv_engineering_department.461.d: "Kaufleute, Gesandte und Makler füllen den Hafen mit Versprechungen eines offenen Austauschs. Die Einnahmen schrumpfen vorübergehend, denn Großzügigkeit sieht immer am edelsten aus, bevor die Konten geschlossen werden. Der [tv_wonder_ceremony|e] verwandelt Kais, Lagerhäuser und überfüllte Tische in eine Bühne für ausländisches Vertrauen. Jeder öffentlich unterzeichnete Vertrag lehrt den Hafen, eine Sprache zu sprechen, die auch entfernte Gerichte verstehen. Ein Jahr lang sinkt der Gewinn, sodass der Ruf vergehen kann."
 tv_engineering_department.461.a: "Öffnen Sie die Kais."
 tv_engineering_department.471.t: "[tv_wonder_ceremony|E]: Das Ahnenfest beginnt"
 tv_engineering_department.471.d: "Für die Nekropole beginnt ein Jahr voller Weihrauch, Genealogie und maßvoller Trauer. Namen werden rezitiert, bis sie sich schwerer anfühlen als die Körper, denen sie einst angehörten, und die Workshops werden langsamer, während die Erinnerung Vorrang vor der Produktion hat. Der [tv_wonder_ceremony|e] bringt dem Reich bei, Abstammung als Architektur zu behandeln. Jedes Opfer setzt einen weiteren Stein in der Argumentation, dass die Lebenden von den befohlenen Toten regiert werden. Trauer wird, wenn sie organisiert ist, zur Autorität."
 tv_engineering_department.471.a: "Lasst die Vorfahren sich versammeln."
 tv_engineering_department.481.t: "[tv_wonder_ceremony|E]: Die Navigator-Gilde beginnt"
 tv_engineering_department.481.d: "Lotsen, Kartenmacher, Seilmeister und Hafenbeamte stecken ihr Zunfthaus unter dem Leuchtturm ab. Sie kommen mit Seekarten, Knoten, Streitereien um Vorrang und dem besonderen Selbstvertrauen von Menschen, die Küstenlinien bei schlechtem Wetter lesen können. Das Leuchtfeuer wird erst dann fertig sein, wenn ihre Institution steht. Ein Licht allein warnt Schiffe; Eine Gilde bringt einem Land bei, wie man die Warnung versteht. Der [tv_wonder_ceremony|e] wartet nun mit Salz im Haar auf die Bürokratie."
 tv_engineering_department.481.a: "Baue die Gilde auf."
 tv_engineering_department.491.t: "[tv_wonder_ceremony|E]: Das Wasserfest beginnt"
 tv_engineering_department.491.d: "Die Kanäle sind mit Girlanden geschmückt, Schleusen gesegnet und Werkstätten für ein Jahr voller Wasserriten stillgelegt. Wasser soll gehorsam aussehen, und jeder, der jemals eine Flut beobachtet hat, weiß, dass dies eine kühne theologische Behauptung ist. Die Produktion biegt ab, sodass der Komplex durch das [tv_wonder_ceremony|e] die heilige Ordnung beanspruchen kann. Ingenieure beobachten, wie Priester segnen, was sie lieber inspizieren würden, und Priester beobachten, wie Ingenieure messen, was sie lieber weihen würden. Zwischen ihnen bewegt sich das Wasser weiter."
 tv_engineering_department.491.a: "Lass das Wasser sich drehen."
 tv_engineering_department.501.t: "[tv_wonder_ceremony|E]: Die Tiefentwässerung beginnt"
 tv_engineering_department.501.d: "Ingenieure treiben die Entwässerungsarbeiten nach unten in die Bergbaustadt. Ein Jahr lang wird es in den Schächten nahezu still sein, während Pumpen, Stützen und Kanäle die Tiefen erobern. Bergleute verabscheuen Ruhe fast so sehr wie Wasser, aber beides muss ertragen werden, bevor tieferer Reichtum beansprucht werden kann. Der [tv_wonder_ceremony|e] hier ist nicht sanft; es ist ein Handel mit Dunkelheit, Feuchtigkeit und Geduld. Wenn die Arbeiten endlich atmen, wird die Stadt wissen, wie weit sie unter die Angst kommen kann."
 tv_engineering_department.501.a: "Die Dunkelheit abgießen."
 tv_engineering_department.511.t: "[tv_wonder_ceremony|E]: Der Sternenkatalog beginnt"
 tv_engineering_department.511.d: "Das Observatorium schließt sich um Lampen, Tische und disziplinierte Schlaflosigkeit ein. Astronomen markieren einen Stern nach dem anderen, nicht als verstreute Lichter, sondern als Einträge in einer öffentlichen Ordnung, die zukünftige Wissenschaftler testen können. Die Gesetzgebung wird langsamer, während das Gericht sich auf Himmel und Instrument konzentriert. Der [tv_wonder_ceremony|e] wird heute nicht in einem Spektakel enden; es wird enden, wenn die Himmel mit genug Geduld kopiert wurden, um nützlich zu werden."
 tv_engineering_department.511.a: "Lass sie den Himmel zählen."
 tv_engineering_department.521.t: "[tv_wonder_ceremony|E]: Die Eclipse-Proklamation beginnt"
 tv_engineering_department.521.d: "Das Observatorium hat seine Vorhersage gemacht: Es wird eine Sonnenfinsternis kommen, und das Gericht wird bereit sein, sie zu benennen, bevor die Angst sie zuerst benennen kann. Priester, Gelehrte, Seeleute und Skeptiker blicken nun alle mit unterschiedlichen Hoffnungen nach oben. Jeder Monat, der vergeht, prüft den Anspruch. Wenn der Himmel den Tabellen gehorcht, wird der [tv_wonder_ceremony|e] zum Beweis dafür, dass das Reich den Himmel lesen kann, ohne sich ihm hinzugeben."
 tv_engineering_department.521.a: "Beobachte den Himmel."
 tv_engineering_department.522.t: "[tv_wonder_ceremony|E]: Die Sonnenfinsternis kommt"
 tv_engineering_department.522.d: "Das Licht ändert sich genau dort, wo das Observatorium es angekündigt hat. Die Menge verstummt, aber die Stille ist keine Panik; Schreier haben ihnen bereits gesagt, was die gelehrten Tafeln vorhergesagt haben. Der [tv_wonder_ceremony|e] wird zur öffentlichen Gewissheit im Raum zwischen Sonne, Schatten und Atem. Wenn das Licht zurückkehrt, beansprucht das Gericht nicht nur Weisheit. Es hat Timing, Mut und die Beherrschung des Staunens bewiesen."
 tv_engineering_department.522.a: "Möge das Reich sich an die Vorhersage erinnern."
 tv_engineering_department.531.t: "[tv_wonder_ceremony|E]:Tribut erhalten"
 tv_engineering_department.531.d: "Ein weiterer Themenbeitrag hält Einzug in den Palast der Nationen. Es wird mit ausgefeilter Sorgfalt zur Schau gestellt: nicht nur Reichtum, sondern ein Streit um den Rang, der für jeden Gesandten sichtbar ist, der durch die Halle geht. Die Tribute-Galerie wird mit jedem Angebot überzeugender, weil Unterordnung ebenso wie Ruhm leichter zu glauben ist, wenn sie Architektur hat. Bei der Zeremonie wird jeweils ein maßvoller Akt des Gehorsams vorangetrieben."
 tv_engineering_department.531.a: "Nehmen Sie die Hommage auf."
 tv_engineering_department.541.t: "[tv_wonder_ceremony|E]: Das Botschaftsviertel beginnt"
 tv_engineering_department.541.d: "Für das Botschaftsviertel neben dem Palast der Nationen sind Fundamente markiert. Ausländische Häuser werden Türen, Höfe, Dienstbotengänge und all die kleinen praktischen Würden erhalten, die Diplomatie zu einer täglichen Präsenz und nicht zu einem gelegentlichen Besuch machen. Der [tv_wonder_ceremony|e] wartet nun auf einen Bezirk, der für die Besiedlung durch andere Gerichte gebaut wurde. Ein Palast kann Aufmerksamkeit erregen; Ein Botschaftsviertel lehrt Aufmerksamkeit zum Bleiben."
 tv_engineering_department.541.a: "Bauen Sie Orte für fremde Augen."
 tv_engineering_department.500.t: "[tv_wonder_ceremony|E]: Das Projekt ist eröffnet"
 tv_engineering_department.500.d: "Der [tv_engineering_department|E] hat den [tv_wonder_ceremony|e] fertiggestellt und das Denkmal steht nun als dauerhaftes Zeichen der Ambitionen des Reiches. Gerüste sind verschwunden, Geschäftsbücher sind versiegelt und die Öffentlichkeit hat mit der Arbeit begonnen, die kein Ingenieur zu Ende bringen kann: zu entscheiden, was das Wunder bedeutet. Manche nennen es Ruhm, manche Übermaß, manche Beweis dafür, dass sich das Zeitalter verändert hat. Alle werden es sich ansehen müssen. Das ist schon eine Form des Sieges."
 tv_engineering_department.500.a: "Lass das Zeitalter sich daran erinnern."
 tv_engineering_department.600.t: "[tv_wonder_construction|E]: Ein Weltwunder ist vollendet"
 tv_engineering_department.600.d: "Es kommt eine Nachricht von [SCOPE.sCountry('tv_wonder_builder_country').GetName]: Bei [SCOPE.sLocation('tv_wonder_completed_site').GetName] wurde ein Weltwunder vollendet. Die Berichte unterscheiden sich hinsichtlich Kosten, Schönheit, Zweck und Weisheit, aber in einem Punkt sind sie sich einig. Die Arbeit ist zu groß, um lokal zu bleiben. Es ist in das allgemeine Gespräch der Herrscher eingegangen."
 tv_engineering_department.600.a: "Die Welt hat es gehört."

