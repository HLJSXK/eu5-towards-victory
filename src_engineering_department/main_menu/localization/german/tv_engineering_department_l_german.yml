 TV_ENGINEERING_CONSTRUCTION_PROGRESS_TT: "Jede [tv_wonder_construction_part|e]-Einheit verwendet den [tv_wonder_construction|e]-Fortschritt von [tv_engineering_department|e]. Modulanforderungen werden über das Community-Mod-Menü konfiguriert; Die Standardanforderungen für Klein, Mittel und Groß sind 100.000, 200.000 und 300.000 Fortschritt."
