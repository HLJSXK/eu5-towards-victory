 # ── Engineering Department / Wonder Construction ──────────────────────────
 game_concept_tv_engineering_department: "Ingenieurabteilung"
 game_concept_tv_engineering_department_desc: "Eine nicht eindeutige internationale Organisation, die bei der Kampagneninitialisierung automatisch für jedes Land eingerichtet wird. Es hält das [tv_great_engineer|e]-Büro und verwaltet jede Phase eines [tv_wonder_construction|e]: [tv_wonder_concept|e], Standort [tv_wonder_survey|e], Organisation, Logistik und abschließendes [tv_wonder_ceremony|e]."
 game_concept_tv_engineering_department_europedia_desc: "Dies wird automatisch für jedes Land zu Beginn der Kampagne oder beim ersten Hinzufügen der technischen Abteilung zu einem vorhandenen Speicher eingerichtet und ist die ständige Institution hinter jedem [tv_wonder_construction|e], den ein Land versucht. Sein einziger Offizier, der [tv_great_engineer|e], leitet persönlich die Pipeline: Seine administrativen Fähigkeiten verbessern sich [tv_wonder_concept|e], seine militärischen Fähigkeiten verbessern sich [tv_wonder_survey|e] und seine Amtszeit bestimmt, an wen man sich beim letzten [tv_wonder_ceremony|e] erinnert. Ein bereits laufendes Projekt wird nicht durch den Verlust oder Ersatz des Großen Ingenieurs zurückgesetzt, aber ein vakantes Büro verzögert den Fortschritt von Konzeption und Vermessung, bis ein Nachfolger ernannt wird."

 game_concept_tv_great_engineer: "Großartiger Ingenieur"
 game_concept_tv_great_engineer_desc: "Der ernannte Charakter, der das [tv_engineering_department|e] leitet. Der [tv_great_engineer|e] wird als Ländervariable gespeichert und kann im [tv_engineering_department|e]-Panel ernannt, ersetzt oder entlassen werden."

 game_concept_tv_wonder_concept: "Konzeption"
 game_concept_tv_wonder_concept_desc: "Die Angebotsphase, die ein neues [tv_wonder_construction|e] öffnet. Jeden Monat fördert die administrative Fähigkeit des [tv_great_engineer|e] den Empfängnisfortschritt; Sobald es abgeschlossen ist, schlägt der [tv_great_engineer|e] ein realisierbares [tv_wonder_small|e]-, [tv_wonder_medium|e]- oder [tv_wonder_large|e]-Projekt vor, das das Land verfolgen kann."
 game_concept_tv_wonder_concept_europedia_desc: "Die Empfängnis beginnt in dem Moment, in dem ein [tv_great_engineer|e] ernannt wird: Eine versteckte Fortschrittsanzeige beginnt bei 0 und steigt jeden Monat ein wenig an, abhängig von den Verwaltungsfähigkeiten des Beamten. Es kann Jahre dauern, bis ein schwacher Administrator die Konzeption abgeschlossen hat, während ein Land, das nacheinander mehrere fähige Administratoren einsetzt, die angesammelten Fortschritte vorantreibt, unabhängig davon, wer derzeit das Amt innehat. Nach Abschluss lässt der Ingenieur das Land nicht frei wählen – er schlägt ein machbares [tv_wonder_small|e]-, [tv_wonder_medium|e]- oder [tv_wonder_large|e]-Unternehmen vor, das sich an dem orientiert, was das Land derzeit unterstützen kann, und das das Land weiterverfolgen soll."

 game_concept_tv_wonder_survey: "Umfrage"
 game_concept_tv_wonder_survey_desc: "Die Standortbewertungsphase von [tv_wonder_construction|e]. Der Vermessungsfortschritt steigt monatlich anhand der militärischen Fähigkeiten des [tv_great_engineer|e], deckt [tv_wonder_scale_competence|e], [tv_wonder_logistics_competence|e] und [tv_wonder_organization_competence|e] auf und ermöglicht dem Land, eine Baustelle zu bestätigen, sobald die Messungen abgeschlossen sind."
 game_concept_tv_wonder_survey_europedia_desc: "Sobald die Debatte geklärt ist, bewerten die Gutachter drei verborgene Qualitäten des ausgewählten Standorts – [tv_wonder_scale_competence|e], [tv_wonder_organization_competence|e] und [tv_wonder_logistics_competence|e] – wobei jede die natürliche Eignung des Standorts mit den Verwaltungsfähigkeiten des [tv_great_engineer|e] verbindet. Alle drei Messwerte steigen zusammen, wenn der Vermessungsfortschritt aufgrund der militärischen Fähigkeiten des Ingenieurs zunimmt, und keiner von ihnen kann nach Baubeginn erneut verbessert werden. Wenn ein Land also einen marginalen Standort gegen ein längeres Warten auf einen besseren Standort abwägt, geht er einen echten Kompromiss ein."

 game_concept_tv_wonder_debate: "Debatte"
 game_concept_tv_wonder_debate_desc: "Die inländische Debattenphase von [tv_wonder_construction|e]. Befriedigung von Immobilienanforderungen und Diskussionsveranstaltungen baut [tv_wonder_domestic_support|e] auf; Sobald der Wert 100 erreicht, kann das Land die Debatte für beendet erklären und mit [tv_wonder_survey|e] fortfahren."
 game_concept_tv_wonder_debate_europedia_desc: "Bevor der Spatenstich gemacht wird, muss das vorgeschlagene Projekt eine nationale Debatte überstehen. Der Adel, die Bürger und der Klerus erheben jeweils Forderungen, deren Befriedigung [tv_wonder_domestic_support|e] gewährt, und Debattenveranstaltungen gewähren darüber hinaus mehr. Die Unterstützung liegt auf einer Skala von 0 bis 200, aber nur die ersten 100 Punkte sind erforderlich, um die Debatte zu beenden und zu [tv_wonder_survey|e] überzugehen. Die Unterstützung nimmt nicht für immer zu: Sobald die Debatte zu Ende ist, nimmt sie jeden Monat ein wenig ab, so dass ein Land, das die Debatte bereits abschließen kann, wenig davon hat, sie offen zu lassen, und ein Projekt, das die Unterstützung bis auf Null sinken lässt, bevor es seine Zeremonie verdient, riskiert, völlig zusammenzubrechen."

 game_concept_tv_wonder_materials: "Baumaterialien"
 game_concept_tv_wonder_materials_desc: "Ein produziertes Marktgut, das zur Aufrechterhaltung von $tv_wonder_labor_camp$ während eines aktiven [tv_wonder_construction|e] verwendet wird. Jeder $tv_wonder_material_dispatch_point$ wandelt grundlegende Baugüter in [tv_wonder_materials|e] um, sodass Angebot und Preis über den normalen Markt abgewickelt werden."
 game_concept_tv_wonder_materials_europedia_desc: "Wundermaterialien werden nicht im Voraus gelagert – jeder $tv_wonder_material_dispatch_point$ verfeinert sie bei Bedarf aus gewöhnlichen Baugütern, die bereits auf dem Markt sind, und das $tv_wonder_labor_camp$-Gebäude, das tatsächlich auf der Baustelle arbeitet, verbraucht sie beim Bau. Da beide Enden der Kette auf dem normalen Markt angesiedelt sind, konkurriert ein Großprojekt mit dem Rest der Wirtschaft des Landes um die gleichen Grundgüter, und ein Mangel zeigt sich eher in einer langsameren Bautätigkeit als in einem harten Stopp."

 game_concept_tv_wonder_ceremony: "Zeremonie"
 game_concept_tv_wonder_ceremony_desc: "Die endgültige Widmung eines abgeschlossenen [tv_wonder_construction|e]-Projekts. Der gewählte Zweig der Zeremonie bestimmt das endgültige Gebäude des Denkmals, den permanenten Ländermodifikator und den letzten Schub an Prestige, Stabilität und Legitimität aus dem verbleibenden [tv_wonder_domestic_support|e]."
 game_concept_tv_wonder_ceremony_europedia_desc: "Wie ein großartiges Projekt abgeschlossen wird, hängt davon ab, um welche Art von Wunder es sich handelt. Bei der Einweihung eines [tv_wonder_generic|e]-Projekts kann das Land zwischen drei Zeremonienstilen wählen: einer einjährigen Bürde, die mit einer dauerhaften Segnung endet, einem Nebengebäude, das die Macht des örtlichen Anwesens stärkt, oder einer einmaligen Dekoration, die mit Kunst, Gold und Prestige bezahlt wird. Die meisten [tv_wonder_unique|e]-Wunder durchlaufen stattdessen nach Abschluss der Bauarbeiten automatisch eine gemeinsame achtstufige Zeremonie, erreichen etwa eine neue Stufe pro Quartal und gipfeln in einem permanenten Ländermodifikator. Eine Handvoll historisch charakteristischer Stätten – darunter der Pharos-Leuchtturm und die Hagia Sophia – umgehen diesen gemeinsamen Rahmen vollständig und nutzen stattdessen ihr eigenes, handverfasstes Ritual."

 game_concept_tv_wonder_construction: "Tolles Projekt"
 game_concept_tv_wonder_construction_desc: "Ein großartiger Projektmechanismus, der über [tv_engineering_department|e] verwaltet wird. Sobald das [tv_great_engineer|e] und das [tv_wonder_concept|e] ein realisierbares [tv_wonder_small|e]-, [tv_wonder_medium|e]- oder [tv_wonder_large|e]-Projekt hervorbringen und das Land die innenpolitische Debatte beilegt, schließt es ein [tv_wonder_survey|e] ab, organisiert die Arbeitskräfte, sammelt [tv_wonder_materials|e] und bringt vier [tv_wonder_construction_part|e] voran das Projekt auf sein endgültiges Niveau zu heben."
 game_concept_tv_wonder_construction_europedia_desc: "Ein großartiges Projekt ist der landesweite Faden, der ein Wunder von der Idee zum Denkmal trägt. Ein [tv_great_engineer|e] vervollständigt zunächst [tv_wonder_concept|e], um ein realisierbares [tv_wonder_small|e]-, [tv_wonder_medium|e]- oder [tv_wonder_large|e]-Unternehmen vorzuschlagen. das Land löst dann das inländische [tv_wonder_debate|e] auf; ein [tv_wonder_survey|e] bestätigt, dass der ausgewählte Standort es vertragen kann; und erst dann beginnt der eigentliche Bau, wobei vier [tv_wonder_construction_part|e]s gemeinsam auf [tv_wonder_materials|e] aufsteigen und die Arbeitskräfte organisiert werden, bis das gesamte Projekt seinen endgültigen Stand erreicht und mit einem [tv_wonder_ceremony|e] abgeschlossen wird. Ein fertiges [tv_wonder_generic|e]-Projekt kann später durch [tv_wonder_expansion|e] weitergeführt werden, ohne dass eine der früheren Phasen wiederholt werden muss."

 game_concept_tv_wonder_expansion: "Erweiterung"
 game_concept_tv_wonder_expansion_desc: "Fortsetzung eines bereits eingeweihten [tv_wonder_construction|e] am selben Standort in größerem Maßstab. Eine Erweiterung verwendet den [tv_wonder_ceremony|e]-Stil, der bei der früheren Einweihung dieses Wunders gewählt wurde, wieder, verliert keine bereits verdienten Abschlussbelohnungen und greift weiterhin auf die erhaltene [tv_wonder_survey|e]-Kompetenz der Site zurück."

 game_concept_tv_wonder_construction_part: "Konstruktionsteil"
 game_concept_tv_wonder_construction_part_desc: "Eine der vier parallelen Spuren – Fundament, Hauptstruktur, Funktion und Krönung – die ein [tv_wonder_construction|e] gleichzeitig voranschreitet. Das Niveau des Projekts wird dadurch bestimmt, welcher der vier Teile am weitesten hinterherhinkt, daher muss der Fortschritt gleichmäßig verteilt werden und darf nicht auf einer einzigen Schiene beschleunigt werden."
 game_concept_tv_wonder_construction_part_europedia_desc: "Bei jedem großen Projekt handelt es sich tatsächlich um vier parallel entstehende Gebäude – Fundament, Hauptstruktur, Funktion und Krönung –, die jeweils unabhängig voneinander mit eigener Arbeit und eigenen Materialien vorangetrieben werden. Das Gesamtniveau des Projekts ist kein Durchschnitt der vier; Es wird auf den Teil begrenzt, der am weitesten zurückgefallen ist. Wenn alle Ressourcen in eine Vorzeigestrecke gesteckt werden und die anderen vernachlässigt werden, bleibt das gesamte Monument nur auf der Ebene seines schwächsten Teils stehen, so dass ein ausgewogener Fortschritt über alle vier ein Rennen ist, bei dem es darum geht, eine einzelne Strecke zuerst zu beenden."

 game_concept_tv_wonder_small: "Kleines Projekt"
 game_concept_tv_wonder_small_desc: "A [tv_wonder_construction|e] size class. Small projects may be built more than once. Their base country effect is limited to value movement, while local effects and ceremony effects are unrestricted.\nEach level of a small project typically costs about #Y 10,000@gold!#!."

 game_concept_tv_wonder_medium: "Mittleres Projekt"
 game_concept_tv_wonder_medium_desc: "A [tv_wonder_construction|e] size class between small and large projects. A country may not start a second medium project of the same type, but its base country effects, local effects, and ceremony effects are unrestricted.\nEach level of a medium project typically costs about #Y 20,000@gold!#!."

 game_concept_tv_wonder_large: "Großes Projekt"
 game_concept_tv_wonder_large_desc: "A [tv_wonder_construction|e] size class. A country may not start a second large project of the same type, but its base country effects, local effects, and ceremony effects are unrestricted.\nEach level of a large project typically costs about #Y 30,000@gold!#!."

 game_concept_tv_wonder_generic: "Generisches Wunder"
 game_concept_tv_wonder_generic_desc: "Ein vom [tv_wonder_construction|e] vorgeschlagener [tv_great_engineer|e], der sich frei im Maßstab [tv_wonder_small|e], [tv_wonder_medium|e] oder [tv_wonder_large|e] befindet, im Gegensatz zu einem auf der Karte fixierten [tv_wonder_unique|e]. Bei seiner Einführung können Sie einen [tv_wonder_ceremony|e]-Stil wählen."
 game_concept_tv_wonder_generic_europedia_desc: "Ein generisches Wunder ist an keinen festen Standort gebunden: Das Land wählt selbst, wo gebaut werden soll, sobald [tv_wonder_survey|e] einen geeigneten Standort bestätigt, unabhängig davon, welche der Klassen [tv_wonder_small|e], [tv_wonder_medium|e] oder [tv_wonder_large|e] der [tv_great_engineer|e] vorgeschlagen hat. Kleine generische Projekte können sogar mehr als einmal an einem neuen Standort neu erstellt werden, wodurch ein Land wiederholbaren Zugriff auf die Zeremonienbelohnungen dieses Archetyps erhält – im Gegensatz zu einem [tv_wonder_unique|e], das während des gesamten Spiels genau einmal an einem Ort existiert."

 game_concept_tv_wonder_unique: "Einzigartiges Wunder"
 game_concept_tv_wonder_unique_desc: "Ein historischer [tv_wonder_construction|e], der an einem bestimmten Standort auf der Karte fixiert ist, im Gegensatz zu einem frei platzierten [tv_wonder_generic|e]. Die meisten einzigartigen Wunder durchlaufen automatisch einen 8-stufigen [tv_wonder_ceremony|e], sobald der Bau abgeschlossen ist; Einige haben stattdessen ihre eigene manuelle Zeremonie."
 game_concept_tv_wonder_unique_europedia_desc: "Ein einzigartiges Wunder ist von Beginn der Kampagne an an einen einzigen realen Standort gebunden, und nur das Land, das diesen Standort tatsächlich kontrolliert, kann es jemals bauen – es gibt keine freie Standortwahl wie bei einem [tv_wonder_generic|e]. Als Gegenleistung für diese historische Stabilität teilen sich 134 der 136 einzigartigen Wunder des Mods nach Fertigstellung ein einheitliches, automatisches achtstufiges [tv_wonder_ceremony|e], sodass keine weiteren Spielereingaben erforderlich sind, um ihre dauerhafte Belohnung zu erhalten. Die einzigen Ausnahmen sind der Leuchtturm Pharos und die Hagia Sophia, die jeweils ihr eigenes, maßgeschneidertes, mehrstufiges Ritual durchführen."

 game_concept_tv_wonder_domestic_support: "Inländische Unterstützung"
 game_concept_tv_wonder_domestic_support_desc: "Eine [tv_wonder_construction|e]-Ressource, die die Bereitschaft der Elite und der Öffentlichkeit repräsentiert, ein großes Großprojekt aufrechtzuerhalten. Erreichen Sie 100, um die erste Debatte zu beenden; Die Unterstützung kann bis zu 200 gespeichert werden und fällt nach Ende der Debatte ab."

 game_concept_tv_wonder_scale_competence: "Skalierungskompetenz"
 game_concept_tv_wonder_scale_competence_desc: "Ein [tv_wonder_survey|e]-Wert, der zeigt, wie gut der ausgewählte Standort die geplante Größe, Achsen, Fundamente und öffentliche Ausrichtung des Projekts tragen kann, ohne den Entwurf in eine unangenehme Form zu zwingen. Die maximale Stufe \"Großartiges Projekt\" wird auf 20 %, 40 %, 60 %, 80 % und 100 % festgelegt, wobei Stufe 6 100 % erfordert."

 game_concept_tv_wonder_organization_competence: "Organisationskompetenz"
 game_concept_tv_wonder_organization_competence_desc: "Eine [tv_wonder_survey|e]-Messung, die zeigt, wie sauber Arbeitspläne, Vorarbeiter, Werkstätten und Bauphasen erstellt werden können, um einem Plan statt vielen konkurrierenden Aufträgen gerecht zu werden. Es legt die maximale Great Project Worksite-Stufe linear von 0 bis 20 fest."

 game_concept_tv_wonder_logistics_competence: "Logistikkompetenz"
 game_concept_tv_wonder_logistics_competence_desc: "Ein [tv_wonder_survey|e]-Messwert für Straßen, Karren, Häfen, Brücken und Übergabepunkte, der bestimmt, ob [tv_wonder_materials|e] die Baustelle erreicht, wenn die Maurer sie benötigen."

