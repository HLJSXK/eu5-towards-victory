 tv_engineering_department.7000.t:0 "Bau: Die Straßen applaudieren dem Standort"
 tv_engineering_department.7000.d:0 "Ein paar sichtbare Erfolge am Zaun machen aus Neugier Stolz. Gildenälteste verleihen Namen, Nachbarn behandeln die Arbeiten nicht mehr als königliche Eitelkeit und das Projekt erhält einen schärferen Anspruch auf [tv_wonder_domestic_support|E]."
 tv_engineering_department.7000.a:0 "Lässt das neue Wohlwollen der Gildenältesten die Arbeit vorantreiben."
 tv_engineering_department.7001.t:0 "Konstruktion: Eine breitere Linie auf der Erde"
 tv_engineering_department.7001.d:0 "Neue Messungen zeigen Bodenflächen, die einen größeren Fußabdruck vertragen. Was auf Pergament wie Ehrgeiz aussah, hat jetzt eine erträgliche Grundlage, und [tv_wonder_scale_competence|E] springt vorwärts."
 tv_engineering_department.7001.a:0 "Erhebt Anspruch auf die breitere Grundlage, die die Umfrage gerade bewiesen hat."
 tv_engineering_department.7002.t:0 "Konstruktion: Namen und Befehle fügen sich zusammen"
 tv_engineering_department.7002.d:0 "Der Hof erwacht unter neuen Dienstplänen. Die Besatzungen wissen, wo sie stehen müssen, die Angestellten wissen, worauf es ankommt, und [tv_wonder_organization_competence|E] steigt, weil es für Verwirrung weniger Orte gibt, an denen man sich verstecken kann."
 tv_engineering_department.7002.a:0 "Wir sperren die neuen Kader, bevor wieder Verwirrung herrscht."
 tv_engineering_department.7003.t:0 "Bau: Straßen und Karren finden ihren Rhythmus"
 tv_engineering_department.7003.d:0 "Eine bessere Route verbindet Straße, Wasser, Lagerplatz und Gerüst. Der erste Konvoi, der es nutzt, kommt fast peinlich pünktlich an und [tv_wonder_logistics_competence|E] steigt."
 tv_engineering_department.7003.a:0 "Sorgen Sie dafür, dass Ihre Karren pünktlich rollen!"
 tv_engineering_department.7004.t:0 "Konstruktion: Stein erhebt sich über das Ziel hinaus"
 tv_engineering_department.7004.d:0 "The active part rises past its mark before the light fails. No single miracle explains it; the lifts, joints, and hands simply meet at the right hour, pushing [tv_wonder_construction|E] progress ahead."
 tv_engineering_department.7004.a:0 "Lässt die Lifte über die Markierung hinaus voranschreiten."
 tv_engineering_department.7005.t:0 "Konstruktion: Street Talk Turns"
 tv_engineering_department.7005.d:0 "Der Lärm rund um das Gelände wird leiser. Es ist kein Beifall, aber es ist eine ausreichende Erlaubnis, damit die Karren vorbeiziehen und die Auseinandersetzungen früher enden; [tv_wonder_domestic_support|E] steigt um einen sinnvollen Abstand."
 tv_engineering_department.7005.a:0 "Lässt die Karren durch und die Auseinandersetzungen verebben."
 tv_engineering_department.7006.t:0 "Konstruktion: Die Maßnahme wurde korrigiert"
 tv_engineering_department.7006.d:0 "Ein enger Winkel wird neu gezeichnet, ein Versorgungsweg verbreitert und die Hauptlinie des Denkmals atmet wieder auf. Die Verbesserung gegenüber [tv_wonder_scale_competence|E] ist klein, aber real."
 tv_engineering_department.7006.a:0 "Verbreitert den Weg und lässt das Design atmen."
 tv_engineering_department.7007.t:0 "Aufbau: Der Hof lernt seinen Rhythmus"
 tv_engineering_department.7007.d:0 "Eine Reihe fehlender Übergaben wird repariert. Die Arbeit ist zu trocken für Zeremonien, aber sie hält die Werkzeuge in Bewegung und verbessert [tv_wonder_organization_competence|E]."
 tv_engineering_department.7007.a:0 "Wir flicken die Übergabe und halten die Werkzeuge in Bewegung."
 tv_engineering_department.7008.t:0 "Konstruktion: Spurrillen finden einen besseren Weg"
 tv_engineering_department.7008.d:0 "Eine fehlerhafte Kurve in der Versorgungsleitung wurde korrigiert. Weniger Wagen warten leer, weniger Ladungen kommen beschädigt an und [tv_wonder_logistics_competence|E] verbessert sich."
 tv_engineering_department.7008.a:0 "Begradigt die schlechte Kurve, bevor weitere Ladungen platzen."
 tv_engineering_department.7009.t:0 "Bau: Hämmer stehen kurz vor der Fertigstellung"
 tv_engineering_department.7009.d:0 "Eine hartnäckige Verbindung passt endlich und die nächste Crew kann ohne weiteren Monat Wartezeit beginnen. [tv_wonder_construction|E] Der Fortschritt schreitet auf die erfreulichste Weise voran: sichtbar."
 tv_engineering_department.7009.a:0 "Endlich passt es!"
 tv_engineering_department.7010.t:0 "Aufbau: Brotgeld am Tor"
 tv_engineering_department.7010.d:0 "Eine Menschenmenge versammelt sich am Tor und murmelt, dass das Wunder Brot isst, das für die Armen bestimmt ist. Wenn die Staatskasse ihre [gold|E] in voller Sicht auf die Straße öffnet und jetzt auszahlt, würde das Murren verstummen und [tv_wonder_domestic_support|E] würde steigen – aber die Münze kommt nicht zurück."
 tv_engineering_department.7010.a:0 "Zahlen Sie es vor den Augen der Menge aus."
 tv_engineering_department.7010.b:0 "Die Bücher sind dünn genug, ohne dass eine öffentliche Zuteilung erforderlich wäre."
 tv_engineering_department.7011.t:0 "Aufbau: Ein Prediger stellt das Recht der Krone in Frage"
 tv_engineering_department.7011.d:0 "Ein örtlicher Prediger erzählt seiner Herde, dass das Wunder auf Stolz beruht und nicht auf dem Recht der Krone, es zu fordern. Den königlichen [legitimacy|E] hinter ein schriftliches Dekret zu setzen, würde die Angelegenheit klären und [tv_wonder_domestic_support|E] stabilisieren, bevor sich die Predigt weiter verbreitet."
 tv_engineering_department.7011.a:0 "Besiegeln Sie das Dekret und lassen Sie das Wort der Krone die Angelegenheit abschließen."
 tv_engineering_department.7011.b:0 "Ein königlicher Erlass über das Murren eines Predigers sieht nach Schwäche und nicht nach Stärke aus."
 tv_engineering_department.7012.t:0 "Konstruktion: Die Quarry Road teilt ein gemeinsames Feld"
 tv_engineering_department.7012.d:0 "Die neue Steinbruchstraße verläuft direkt durch die gemeinsamen Felder zweier Dörfer. Wenn man [stability|E] ausgibt, um die Umsiedlung durchzusetzen, würde man den Weg frei machen und [tv_wonder_domestic_support|E] unter denen verbreiten, die das Wunder vollenden wollen – auf Kosten des Friedens, den man mit diesen Dörfern erkauft hat."
 tv_engineering_department.7012.a:0 "Befehlen Sie die Umsiedlung und lassen Sie die Straße durchgehen."
 tv_engineering_department.7012.b:0 "Die Felder zweier Dörfer sind eine kürzere Karrenroute nicht wert."
 tv_engineering_department.7013.t:0 "Bau: Ausländische Gesandte verspotten das Vanity-Projekt"
 tv_engineering_department.7013.d:0 "Gesandte eines konkurrierenden Gerichts nennen das Wunder ein Eitelkeitsprojekt, das zu groß für die dahinter stehende Staatskasse sei. Die Ausgabe von [prestige|E] für einen rauschenden Empfang könnte die Geschichte, die sie nach Hause tragen, verändern und [tv_wonder_domestic_support|E] erhöhen – aber das Ansehen der Krone, das einmal für das Schmeichelei der Gäste ausgegeben wurde, lässt sich nicht so leicht wieder auffüllen."
 tv_engineering_department.7013.a:0 "Geben Sie Geld für den Empfang aus und ändern Sie, was die Gesandten mit nach Hause nehmen."
 tv_engineering_department.7013.b:0 "Ausländischer Klatsch ist es nicht wert, das Ansehen der Krone dafür auszugeben."
 tv_engineering_department.7014.t:0 "Bau: Der Jagdauslauf eines Adligen wird zum Holzplatz"
 tv_engineering_department.7014.d:0 "Die Maurer des Wunders wollen einen Abschnitt der Jagdstrecke eines Adligen für die Lagerung ihres Holzes. Er wird es gewähren, aber nur als Gefallen muss die Krone gegen [estate_satisfaction|E] unter den Adligen angerechnet werden – wenn sie jetzt ausgegeben wird, würde sie immer noch [tv_wonder_domestic_support|E] anheben, sobald sich das Holz in Bewegung setzt."
 tv_engineering_department.7014.a:0 "Gewähren Sie den Gefallen und nehmen Sie den Holzboden ein."
 tv_engineering_department.7014.b:0 "Der gute Wille eines Adligen ist es nicht wert, ihm eine Schuld zu schulden."
 tv_engineering_department.7015.t:0 "Konstruktion: Die Pfarrglocke wird um ihre Bronze gebeten"
 tv_engineering_department.7015.d:0 "Die Gründer des Wunderwerks wollen die Pfarrglocke für den Umbau in Armaturen beschlagnahmen. Der Priester wird den Blick von einem leeren Glockenturm abwenden, aber dafür kostet er unter den Geistlichen [estate_satisfaction|E] – ein Preis, bei dem [tv_wonder_domestic_support|E] immer noch besser dran wäre als ein unfertiges Gerüst."
 tv_engineering_department.7015.a:0 "Fragen Sie richtig und lassen Sie die Glocke in die Gießerei gehen."
 tv_engineering_department.7015.b:0 "Ein leerer Glockenturm wird mehr Aufsehen erregen, als die Ausstattung wert ist."
 tv_engineering_department.7016.t:0 "Konstruktion: Versorgungswagen verstopfen den Marktplatz"
 tv_engineering_department.7016.d:0 "An Liefertagen blockieren die Versorgungskarren des Wunders immer wieder den Marktplatz. Die Gildenmeister werden ihre eigenen Stände um die Karren herum umleiten, aber das zieht [estate_satisfaction|E] unter die Bürger – ein Preis, der immer noch etwas [tv_wonder_domestic_support|E] zurückkaufen würde, wenn der Platz aufhört, gegen die Karren zu kämpfen."
 tv_engineering_department.7016.a:0 "Fragen Sie direkt bei den Gilden nach und lassen Sie die Karren durch."
 tv_engineering_department.7016.b:0 "Die Fuhrleute zu bestrafen ist einfacher, als die Gilden um einen Gefallen zu bitten."
 tv_engineering_department.7017.t:0 "Aufbau: Der Corvee wird nach der Ernte festgehalten"
 tv_engineering_department.7017.d:0 "The overseer wants the corvee gangs held past the harvest to finish the foundations before the frost. The village elders will agree, but it costs [estate_satisfaction|E] among the peasants - spent now, it would still leave [tv_wonder_domestic_support|E] higher than a foundation left half-dug through winter."
 tv_engineering_department.7017.a:0 "Sagen Sie es deutlich und halten Sie die Banden an der Ernte vorbei."
 tv_engineering_department.7017.b:0 "Die Ernte kann nicht auf den Grundfesten warten."
 tv_engineering_department.7018.t:0 "Bau: Eine Mietshausreihe steht im Weg"
 tv_engineering_department.7018.d:0 "Die Maurer sagen, das Gelände sei zu eng, um die nächste Schicht anzuheben, ohne die daneben liegende Mietshausreihe abzureißen. Eine direkte Bestellung würde dazu führen, dass [development|E] vor Ort in Anspruch genommen wird, wenn die Gebäude auseinanderfallen, die Arbeit – und damit auch [tv_wonder_domestic_support|E] – aber wieder voranschreiten kann."
 tv_engineering_department.7018.a:0 "Ordnen Sie an, die Reihe abzureißen und das Gelände zu erweitern."
 tv_engineering_department.7018.b:0 "Auf einem beengten Grundstück lässt es sich leichter leben als in einer Straße voller vertriebener Mieter."
 tv_engineering_department.7019.t:0 "Konstruktion: Gewöhnliche Handelsbögen zum Standort"
 tv_engineering_department.7019.d:0 "Local carters and stonecutters have been pulled off their usual trade to keep the site supplied. Letting this continue would bleed [prosperity|E] at the site as ordinary business thins out - but the steadier deliveries would still be seen as [tv_wonder_domestic_support|E] worth having."
 tv_engineering_department.7019.a:0 "Lassen Sie den örtlichen Handel weiterhin den Arbeiten nachgehen."
 tv_engineering_department.7019.b:0 "Die Stadt braucht ihren normalen Handel mehr als der Standort schnellere Lieferungen braucht."
 tv_engineering_department.7020.t:0 "Bau: Die Brücke der Hauptstadt wartet auf ihre Maurer"
 tv_engineering_department.7020.d:0 "Die Reparaturarbeiten an der Brücke der Hauptstadt sind ins Stocken geraten, weil ihre Maurer auf das Wunder gezogen wurden. Sie dort zu belassen, würde in der Hauptstadt [development|E] kosten, da die Brücke noch nicht fertiggestellt ist, aber es würde den Fortschritt des Wunders – und [tv_wonder_domestic_support|E] – am Laufen halten."
 tv_engineering_department.7020.a:0 "Halten Sie die Maurer auf dem Wunder und lassen Sie die Brücke warten."
 tv_engineering_department.7020.b:0 "Die eigene Brücke der Hauptstadt kann nicht auf den Zeitplan des Wunders warten."
 tv_engineering_department.7021.t:0 "Bau: Makler kaufen das Holz der Hauptstadt auf"
 tv_engineering_department.7021.d:0 "Die Agenten des Wunders kaufen wertvolles Holz und Stein zu Preisen auf, die der normale Markt nicht erreichen kann. Würde man den Kauf fortführen, würde dies den [prosperity|E] in der Hauptstadt belasten, da der Handel rund um den Standort abnimmt, aber die Werke würden weiterhin versorgt bleiben und [tv_wonder_domestic_support|E] dabei bleiben."
 tv_engineering_department.7021.a:0 "Lassen Sie den Kauf weitergehen und füttern Sie die Website."
 tv_engineering_department.7021.b:0 "Die eigenen Märkte der Hauptstadt sollten nicht für ein Projekt ausgeblutet werden."
 tv_engineering_department.7022.t:0 "Konstruktion: Es wird eine doppelte Nachtschicht vorgeschlagen"
 tv_engineering_department.7022.d:0 "Der Aufseher möchte, dass die Nachtschicht verdoppelt wird, um die durch den letzten Frost verlorenen Tage auszugleichen. Die Bestellung würde den arbeitenden [population|E] vor Ort zermürben, da die zusätzlichen Stunden ihren Tribut fordern, aber es würde die Arbeit vorantreiben und [tv_wonder_domestic_support|E] mit sich bringen."
 tv_engineering_department.7022.a:0 "Verdoppeln Sie die Schichten und treiben Sie die Arbeit voran."
 tv_engineering_department.7022.b:0 "Erschöpfte Arbeiter bauen langsamer als ausgeruhte."
 tv_engineering_department.7023.t:0 "Aufbau: Eine breitere Basis auf dem Schreibtisch des Schatzmeisters"
 tv_engineering_department.7023.d:0 "Der Obermaurer legt dem Schatzmeister einen umfassenderen Fundamentplan vor und behauptet, dass der Boden ihn verkraften würde, wenn vor dem Herbstregen zusätzliche Gänge angelegt würden. Der Schatzmeister kann das Gold jetzt für den hinzugefügten Stein und die hinzugefügten Hände freigeben, oder der Plan wartet auf die Erhebung im nächsten Jahr."
 tv_engineering_department.7023.a:0 "Geben Sie das Gold frei und lassen Sie die Maurer vor dem Regen eine breitere Grundlage schaffen."
 tv_engineering_department.7023.b:0 "Halten Sie die Münze zurück; Auch im nächsten Frühling wird es noch regnen."
 tv_engineering_department.7024.t:0 "Konstruktion: Die Vermessungspfähle enden an einem Zaun"
 tv_engineering_department.7024.d:0 "Die Pfähle des Vermessers enden kurz vor der Zaunlinie eines Nachbarn und der Nachbar weigert sich, sie passieren zu lassen. Ein königlicher Erlass würde die Grenze heute festlegen, aber die Berufung auf den Namen der Krone wegen einer umstrittenen Hecke wird nicht unbemerkt bleiben."
 tv_engineering_department.7024.a:0 "Senden Sie die Urkunde und tragen Sie den Namen der Krone hinter die breitere Grenze ein."
 tv_engineering_department.7024.b:0 "Lass den Zaun stehen; Der Name der Krone wird nicht für einen Heckenstreit ausgegeben."
 tv_engineering_department.7025.t:0 "Konstruktion: Der umfassendere Plan geht über das Gemeinsame hinaus"
 tv_engineering_department.7025.d:0 "Der größere Plan verläuft direkt durch die Weidefläche eines Weilers. Das Verschieben der Grenzsteine durch das Dorf würde die Umfragefrage klären, aber die Haushalte werden nicht vergessen, wer sie verlegt hat."
 tv_engineering_department.7025.a:0 "Bewegen Sie die Steine und lassen Sie die Vermessung auf der größeren Grundfläche ruhen."
 tv_engineering_department.7025.b:0 "Lassen Sie das Gemeinsame so wie es ist; Ein verärgertes Dorf ist eine breitere Basis nicht wert."
 tv_engineering_department.7026.t:0 "Konstruktion: Der Preis eines ausländischen Maurers für sein Siegel"
 tv_engineering_department.7026.d:0 "Ein ausländischer Maurermeister bietet an, den umfassenderen Entwurf zu zertifizieren, allerdings nur, wenn der Name des Gerichts als sein Patron in den Aufzeichnungen seiner eigenen Zunft zu Hause aufgeführt ist. Die Billigung würde hier die Größenfrage klären; Die Bitte ist öffentlich und kann nicht ungenutzt bleiben."
 tv_engineering_department.7026.a:0 "Gewähren Sie die Zustimmung und vertrauen Sie dem Wort des Meisters hinsichtlich des größeren Fußabdrucks."
 tv_engineering_department.7026.b:0 "Den Namen des Gerichts zurückhalten; Das Hauptbuch einer ausländischen Gilde ist nicht der richtige Ort, um es auszugeben."
 tv_engineering_department.7027.t:0 "Konstruktion: Der Grundriss kreuzt die Jagd des Barons"
 tv_engineering_department.7027.d:0 "Der breitere Grundriss verläuft über das Gelände, das ein ortsansässiger Baron seit langem für seine Jagd nutzt. Ihn zu bitten, den Mund zu halten, während die Gutachter fertig sind, würde beweisen, dass es sich um einen größeren Maßstab handelt, aber edle Geduld, die hier aufgewendet wird, ist Geduld, von der er erwartet, dass sie zurückgegeben wird."
 tv_engineering_department.7027.a:0 "Bitten Sie den Baron um Geduld und lassen Sie die Landvermesser sein Jagdrevier durchqueren."
 tv_engineering_department.7027.b:0 "Route um das Gelände des Barons; Sein Wohlwollen ist es nicht wert, für eine Umfragelinie ausgegeben zu werden."
 tv_engineering_department.7028.t:0 "Bau: Der Plan sieht eine Ecke heiligen Bodens vor"
 tv_engineering_department.7028.d:0 "Der umfassendere Plan sieht eine Ecke geweihten Geländes vor, über das die Pfarrgemeinde seit Menschengedenken verfügt. Die Priester würden eine Besichtigung darüber gestatten, wenn sie entsprechend darum gebeten würden, aber wenn man den Klerus bittet, heiligen Boden für eine Gerüstlinie zur Verfügung zu stellen, ist das eine gewährte und keine geliehene Gefälligkeit."
 tv_engineering_department.7028.a:0 "Bitten Sie die Priester, die Ecke nachzugeben und die umfassendere Übersicht zu bestätigen."
 tv_engineering_department.7028.b:0 "Halten Sie die Vermessung innerhalb der alten Grenze; Geweihter Boden ist nicht der Ort zum Testen."
 tv_engineering_department.7029.t:0 "Bau: Die Wollhändlergasse wird gesucht"
 tv_engineering_department.7029.d:0 "Die größere Fläche würde die Gasse verschlingen, die die Wollhändler an Markttagen nutzen. Die Zunfträte würden auf Anfrage einen Umweg gewähren, aber Bürger, die ihre Straßen einer Baustelle zur Verfügung stellen, erinnern sich länger als die Umfrage an die Unannehmlichkeiten."
 tv_engineering_department.7029.a:0 "Bitten Sie die Stadträte um die Umleitung und bestätigen Sie die größere Grundfläche über der Straße."
 tv_engineering_department.7029.b:0 "Lassen Sie die Einkaufsstraße in Ruhe; Der Goodwill des Marktes wird nicht für eine Gerüstlinie ausgegeben."
 tv_engineering_department.7030.t:0 "Bau: Das Dorf wird zum Graben aufgefordert"
 tv_engineering_department.7030.d:0 "Der Vorarbeiter sagt, dass sich die breitere Grundlage innerhalb einer Woche als solide erweisen kann, wenn das nahegelegene Dorf seine Hände zum Graben bereitstellt, anstatt seine eigenen Felder zu bestellen. Das Dorf wäre dem Vogt unterstellt, aber eine Abgabe, die zur Pflanzsaison erhoben wird, ist bis zum Herbst nicht vergessen."
 tv_engineering_department.7030.a:0 "Rufen Sie die Dorfabgabe an und graben Sie die breitere Grundlage aus, bevor die Woche zu Ende ist."
 tv_engineering_department.7030.b:0 "Das Dorf soll auf seinen Feldern bleiben; Stattdessen kann der Vorarbeiter auf Leiharbeiter warten."
 tv_engineering_department.7031.t:0 "Bau: Eine Reihe von Werkstätten steht im Grundriss"
 tv_engineering_department.7031.d:0 "Die einzige Möglichkeit, die größere Grundfläche auszugleichen, besteht darin, eine Reihe bereits bestehender Werkstätten am Rande des Geländes abzureißen. Ihr Stein und ihr Fundament würden direkt in den neuen Plan einfließen, aber der Abriss dessen, was auf dem Gelände bereits gebaut wurde, wird nicht rückgängig gemacht."
 tv_engineering_department.7031.a:0 "Ziehen Sie die Reihe nach unten und falten Sie den Stein in die breitere Grundfläche."
 tv_engineering_department.7031.b:0 "Lassen Sie die Werkstätten stehen; Die Seite kann in eine andere Richtung wachsen."
 tv_engineering_department.7032.t:0 "Bau: Holzhändler werden gebeten, einen Käufer auszuwählen"
 tv_engineering_department.7032.d:0 "Die Holzhändler vor Ort verfügen heute über die Vorräte und die Wagen, die sie für die breitere Basis transportieren müssen, wenn ihr gewöhnliches Gewerbe stattdessen für den Vertrag mit der Krone reserviert wird. Die Märkte des Standorts würden auf die Arbeiten reagieren, aber eine Handelsroute, die auf einen Käufer ausgerichtet ist, kehrt nicht von alleine zurück."
 tv_engineering_department.7032.a:0 "Beugen Sie den örtlichen Handel den Arbeiten vor und transportieren Sie die Füllung für die größere Grundfläche."
 tv_engineering_department.7032.b:0 "Überlassen Sie die Kaufleute ihrem gewöhnlichen Gewerbe; Die Füllung kann auf andere Weise beschafft werden."
 tv_engineering_department.7033.t:0 "Baugewerbe: Die Straßenarbeiter der Hauptstadt werden anderswo gesucht"
 tv_engineering_department.7033.d:0 "Die Straßen- und Hallenbauer der Hauptstadt sind die einzigen Teams, die diesen Monat die bestätigende Umfrage durchführen können. Wenn man sie von den eigenen Reparaturen der Hauptstadt abzieht, wäre die Frage der größeren Fläche geklärt, aber die Straßen der Hauptstadt werden die Lücke zeigen, die sie hinterlassen haben."
 tv_engineering_department.7033.a:0 "Ordnen Sie die Besatzungen der Hauptstadt neu zu und lassen Sie sie die größere Präsenz bestätigen."
 tv_engineering_department.7033.b:0 "Lassen Sie die Reparaturen der Hauptstadt in Ruhe; Die Umfrage kann woanders auf ungenutzte Hände warten."
 tv_engineering_department.7034.t:0 "Bau: Die Guildhalls bieten die Einnahmen dieser Saison an"
 tv_engineering_department.7034.d:0 "Die Zunfthäuser der Hauptstadt bieten an, die bestätigende Umfrage aus den Handelseinnahmen dieser Saison zu finanzieren, vorausgesetzt, die Münze wird gezogen, bevor die Wintermessen ihre Bücher schließen. Die Märkte der Hauptstadt würden die breitere Präsenz beweisen, aber die Einnahmen einer Saison, die einem Wunder zugute kommen, sind eine Saison, für die die Zunfthallen eine Antwort haben wollen."
 tv_engineering_department.7034.a:0 "Nutzen Sie die Handelseinnahmen der Hauptstadt und bestätigen Sie die größere Präsenz, bevor die Messen schließen."
 tv_engineering_department.7034.b:0 "Lassen Sie die Bücher der Zunfthäuser in Ruhe; Die Umfrage kann stattdessen auf das Finanzministerium warten."
 tv_engineering_department.7035.t:0 "Bau: Von den Besatzungen werden Ruhetage verlangt"
 tv_engineering_department.7035.d:0 "Der Vorarbeiter sagt, dass die breitere Basis in diesem Monat bewiesen werden kann, wenn die Teams, die bereits vor Ort sind, ihre Ruhetage absolvieren, anstatt sich zwischen den Schichten auszuruhen. Die Umfrage würde den größeren Entwurf klären, aber Arbeiter, die über ihr normales Tempo hinausgehen, bleiben nicht alle lange Arbeiter."
 tv_engineering_department.7035.a:0 "Führen Sie die Mannschaften durch ihre Ruhetage und regeln Sie diesen Monat die allgemeine Situation."
 tv_engineering_department.7035.b:0 "Lassen Sie die Besatzungen ihre Ruhetage einhalten; Die Umfrage kann auf ein langsameres Tempo warten."
 tv_engineering_department.7036.t:0 "Konstruktion: Es wird ein Sachbearbeiter für die Schichtverwaltung gesucht"
 tv_engineering_department.7036.d:0 "Der Bauleiter möchte, dass ein richtiger Sachbearbeiter die Schichttafeln neu zeichnet und sie dort anbringt, wo die Mannschaften sie tatsächlich lesen können. Das Finanzministerium kann den Mann und seine Tinte gegen einen Preis zur Verfügung stellen, und [tv_wonder_organization_competence|E] würde den neuen Tafeln folgen."
 tv_engineering_department.7036.a:0 "Wir stellen den Sachbearbeiter ein und veröffentlichen heute die neuen Tafeln."
 tv_engineering_department.7036.b:0 "Die alten Bretter haben so lange gehalten; sie können etwas länger halten."
 tv_engineering_department.7037.t:0 "Bau: Zwei Vorarbeiter verweigern sich gegenseitig die Befehle"
 tv_engineering_department.7037.d:0 "Zwei Zunftmannschaften auf der Baustelle weigern sich, Befehle von den Vorarbeitern des anderen entgegenzunehmen, und der Streit hat diese Woche zweimal die Frühschicht zum Stillstand gebracht. Nur eine Urkunde mit der Krone [legitimacy|E] würde den Vorrang zwischen ihnen regeln, und [tv_wonder_organization_competence|E] würde folgen, sobald der Streit beendet ist."
 tv_engineering_department.7037.a:0 "Das Schreiben wird verfasst und versiegelt; Die Besatzungen antworten darauf oder antworten niemandem."
 tv_engineering_department.7037.b:0 "Das Wort der Krone wird nicht darauf verwendet, darüber zu entscheiden, welcher Maurer am lautesten flucht."
 tv_engineering_department.7038.t:0 "Aufbau: Die alte Rota hat die Ernte vergessen"
 tv_engineering_department.7038.d:0 "Die eingezogenen Dorfarbeiter wurden nach einem alten Zeitplan zusammengestellt, der die Ernte nie berücksichtigte, und die Hälfte der Mannschaften zog ab, wenn ihre Felder sie brauchten. Die Durchsetzung des Dienstplans aufgrund örtlicher Einwände würde den [stability|E] des Landes in Anspruch nehmen, aber die Besatzungen würden sich schließlich an feste Arbeitszeiten halten, und [tv_wonder_organization_competence|E] würde folgen."
 tv_engineering_department.7038.a:0 "Wir schieben die Rota durch; Die Ernte kann einmal auf das Wunder warten."
 tv_engineering_department.7038.b:0 "Wenn man die Emission jetzt forciert, tauscht man nur eine Knappheit gegen eine noch schlimmere ein."
 tv_engineering_department.7039.t:0 "Bau: Die Freimaurer werden dem neuen Aufseher nicht antworten"
 tv_engineering_department.7039.d:0 "Die Maurermeister werden dem jungen Aufseher, der geschickt wurde, um ihre Schichten neu zu organisieren, nicht antworten, und das sagen sie in Hörweite des ganzen Hofes. Nur ein Name, der durch [prestige|E] des Gerichts gestützt wird, hat genug Gewicht, um sie dazu zu bringen, in die Reihe zu fallen, und [tv_wonder_organization_competence|E] würde ihrer Einhaltung folgen."
 tv_engineering_department.7039.a:0 "Wir verleihen dem Aufseher den Namen des Gerichts; Die Maurer antworten nicht zuletzt darauf."
 tv_engineering_department.7039.b:0 "Die Autorität eines jungen Aufsehers sollte auf dem Hof erworben und nicht vom Palast geliehen werden."
 tv_engineering_department.7040.t:0 "Aufbau: Ein Nachbarherr bietet seinen Verwalter an"
 tv_engineering_department.7040.d:0 "Der benachbarte Herr bietet an, seinen eigenen Hausverwalter zur Erstellung neuer Dienstpläne zur Verfügung zu stellen, einen Mann, der seit zwanzig Jahren die Schichten eines Herrenhauses leitet. Den Gefallen zu gewähren kostet unter den Adligen [estate_satisfaction|E], aber die Dienstpläne des Verwalters würden [tv_wonder_organization_competence|E] einbringen."
 tv_engineering_department.7040.a:0 "Wir akzeptieren den Verwalter und schulden dem Herrn, was ihm zusteht."
 tv_engineering_department.7040.b:0 "Eine Schuld gegenüber diesem bestimmten Herrn ist mehr wert als ordentliche Dienstpläne."
 tv_engineering_department.7041.t:0 "Konstruktion: Die Schalthörner sind die Antwort auf die Glocken der Kathedrale"
 tv_engineering_department.7041.d:0 "Die Schiebehörner der Stätte folgten schon immer den Glocken der Kathedrale, und die Glocken werden nicht wie ein Wunder bewegt. Die Aufforderung an das Kapitel, eine zusätzliche Stunde zu klingeln, um Schichtwechsel zu markieren, kostete den Geistlichen [estate_satisfaction|E], aber die Mannschaften übergaben ihre Posten schließlich pünktlich und brachten [tv_wonder_organization_competence|E]."
 tv_engineering_department.7041.a:0 "Wir bitten das Kapitel um die zusätzliche Glocke, was auch immer uns das Murren kostet."
 tv_engineering_department.7041.b:0 "Die Glocken markieren Gottes Stunden, nicht den Schichtwechsel eines Vorarbeiters."
 tv_engineering_department.7042.t:0 "Konstruktion: Materialkarren stehen Schlange auf dem Markt"
 tv_engineering_department.7042.d:0 "Mittlerweile stehen zweimal am Tag Materialkarren auf dem Marktplatz Schlange, und die Standbesitzer der Zunft verbringen ihre schönsten Stunden durch den Lärm und den Schlamm. Die Räumung des Platzes für die Karren nach einem festen Zeitplan kostet unter den Bürgern [estate_satisfaction|E], aber die Karren würden schließlich nach einem Zeitplan ankommen, den die Besatzungen planen können, und [tv_wonder_organization_competence|E] bringen."
 tv_engineering_department.7042.a:0 "Wir legen den Zeitplan fest und räumen den Platz, Stände hin oder her."
 tv_engineering_department.7042.b:0 "Der Markt ernährt die Stadt, bevor er das Wunder nährt."
 tv_engineering_department.7043.t:0 "Bau: Von den Dörfern wird eine zweite Rotation verlangt"
 tv_engineering_department.7043.d:0 "Die umliegenden Dörfer werden gebeten, einen zweiten Handwechsel zu schicken, bevor die derzeitigen Besatzungen aufgrund der Verdoppelung ihrer Posten zusammenbrechen. Sie von ihren eigenen Parzellen zwischen der Aussaat und der Ernte zu entfernen, kostet die Bauern [estate_satisfaction|E], aber eine vollständige zweite Rotation würde es dem Standort endlich ermöglichen, ordnungsgemäße Schichten durchzuführen, was zu [tv_wonder_organization_competence|E] führt."
 tv_engineering_department.7043.a:0 "Wir rufen die zweite Rotation auf und lassen die Felder warten, bis sie an der Reihe sind."
 tv_engineering_department.7043.b:0 "Leere Felder im Herbst kosten das Land mehr als ein unregelmäßiger Schichtplan."
 tv_engineering_department.7044.t:0 "Konstruktion: Der Bereitstellungshof ist zu eng, um ihn zu passieren"
 tv_engineering_department.7044.d:0 "Der Bereitstellungshof ist zu eng, als dass die Mannschaften ohne Arbeitsunterbrechung aneinander vorbeikommen könnten, und das Durcheinander kostet jeden Morgen eine Stunde. Die Räumung eines angrenzenden Blocks für einen richtigen Hof verschlingt [development|E] auf der Baustelle, aber die Besatzungen konnten sich endlich bewegen, ohne zusammenzustoßen, was zu [tv_wonder_organization_competence|E] führte."
 tv_engineering_department.7044.a:0 "Wir reißen den Block ab und geben den Besatzungen Bewegungsfreiheit."
 tv_engineering_department.7044.b:0 "Der Block bleibt; Ein enger Garten ist billiger als ein abgerissener."
 tv_engineering_department.7045.t:0 "Bau: Lokale Fuhrleute werden stillschweigend umgeleitet"
 tv_engineering_department.7045.d:0 "Örtliche Fuhrleute und Träger, die früher die Besorgungen vor Ort selbst erledigten, wurden stillschweigend auf den Transport von Wundermaterialien umgestellt, und der normale Handel rund um das Werk ist infolgedessen zurückgegangen. Die Formalisierung der Vereinbarung und die Bindung dieser Hände an den Zeitplan des Wunders kostet vor Ort [prosperity|E], aber [tv_wonder_organization_competence|E] würde von den Besatzungen ausgehen, die nicht mehr auf fehlende Karren warten müssen."
 tv_engineering_department.7045.a:0 "Wir formalisieren die Vereinbarung; Die Fuhrleute reagieren jetzt auf den Zeitplan des Wunders."
 tv_engineering_department.7045.b:0 "Der normale Handel sorgt dafür, dass die Menschen vor Ort ernährt werden. Das Wunder kann auf Karren warten, bis es an der Reihe ist."
 tv_engineering_department.7046.t:0 "Bau: Die Hauptstadt stellt ihre Vorarbeiter zur Verfügung"
 tv_engineering_department.7046.d:0 "Die Bauwerke der Hauptstadt haben ihre Vorarbeiter ausgeliehen, um bei der Neugestaltung der Schichtpläne des Wunderwerks zu helfen, und der Kredit hat dazu geführt, dass die eigenen Projekte der Hauptstadt unterbesetzt sind. Die dauerhafte Bereitstellung des Darlehens kostet in der Hauptstadt [development|E], aber die Wonder-Site würde einen Vorarbeiter behalten, der tatsächlich weiß, wie man einen Dienstplan führt, und [tv_wonder_organization_competence|E] einbringen."
 tv_engineering_department.7046.a:0 "Wir machen das Darlehen dauerhaft; Die Projekte der Hauptstadt werden ohne ihn auskommen."
 tv_engineering_department.7046.b:0 "Die Werke der Hauptstadt brauchen ihren Vorarbeiter mehr als das Wunder einen anderen braucht."
 tv_engineering_department.7047.t:0 "Bau: Die Ordnung des Hafens wird neu gemischt"
 tv_engineering_department.7047.d:0 "Die Liefertermine der Händler in der Hauptstadt wurden stillschweigend neu gemischt, sodass Wundermaterialien zuerst den Hafen verlassen und der normale Handel der Hauptstadt nun hinter den Karren der Wunder wartet. Die Bestätigung der neuen Hafenordnung kostet in der Hauptstadt [prosperity|E], aber der Standort würde endlich Materialien nach einem Zeitplan erhalten, in dem die Besatzungen Schichten aufbauen können, was [tv_wonder_organization_competence|E] bringt."
 tv_engineering_department.7047.a:0 "Wir bestätigen die neue Bestellung im Hafen; Die Händler werden sich mit der Zeit anpassen."
 tv_engineering_department.7047.b:0 "Der eigene Handel der Hauptstadt sollte nicht hinter der Baustelle einer anderen Stadt warten."
 tv_engineering_department.7048.t:0 "Konstruktion: Bei der Umschulung müssen die Besatzungen ihre Kräfte verdoppeln"
 tv_engineering_department.7048.d:0 "Für die Umschulung, die neue Dienstpläne erfordern würden, mangelt es auf der Baustelle an zwei vollständigen Mannschaften. Daher werden die bereits vorhandenen Arbeitskräfte gebeten, ihre Posten zu verdoppeln, bis der neue Zeitplan in Kraft tritt. Es kostete sie viel Geld, den arbeitenden [population|E] wochenlang auf der Baustelle so hart zu fahren, aber die Umschulung hielt schließlich an und brachte [tv_wonder_organization_competence|E]."
 tv_engineering_department.7048.a:0 "Wir verdoppeln die Beiträge vorerst; Die neuen Dienstpläne sind die Mühe wert."
 tv_engineering_department.7048.b:0 "Erschöpfte Mannschaften lernen nichts; Die Umschulung kann auf ausgeruhte Hände warten."
 tv_engineering_department.7049.t:0 "Konstruktion: Ein einziger Ford unterstützt jeden Wagen"
 tv_engineering_department.7049.d:0 "Eine einzige schmale Furt bildet den Rückwärtsgang für jeden Karren, der zur Baustelle fährt. Der Quartiermeister will jetzt [gold|E] für die Beplankung und ein bezahltes Team von Brückenbauern, damit sich die [tv_wonder_logistics_competence|E] wieder bewegen kann, bevor die Schlange länger wird als die Straße selbst."
 tv_engineering_department.7049.a:0 "Bezahle die Brückenbauer und räume die Furt frei."
 tv_engineering_department.7049.b:0 "Das Finanzministerium hat für diese Münze einen besseren Verwendungszweck als eine Pfützenüberquerung."
 tv_engineering_department.7050.t:0 "Bau: Landbesitzer verweigern die Konvoi-Passage"
 tv_engineering_department.7050.d:0 "Die Landbesitzer entlang der neuen Route weigern sich, Karren ohne königliche Genehmigung über ihre Felder fahren zu lassen. Den [legitimacy|E] der Krone hier auszugeben, würde die Tore öffnen und den [tv_wonder_logistics_competence|E] voranbringen, aber nur auf diesem Weg und nur heute."
 tv_engineering_department.7050.a:0 "Erteilen Sie den Bescheid und öffnen Sie die Felder für die Einkaufswagen."
 tv_engineering_department.7050.b:0 "Das Wort der Krone wird nicht für jeden hartnäckigen Landbesitzer ausgegeben."
 tv_engineering_department.7051.t:0 "Konstruktion: Der Karrenweg führt durch den Dorfplatz"
 tv_engineering_department.7051.d:0 "Der alte Karrenweg verläuft direkt durch einen Dorfplatz, und die Straßenmeister wollen ihn durch die Verlegung von drei Häusern und einem Brunnen verbreitern. Die Bestellung würde den [tv_wonder_logistics_competence|E] voranbringen, aber sie würde den [stability|E] der Krone kosten, was diejenigen, die noch murren, befürchten wird."
 tv_engineering_department.7051.a:0 "Geben Sie den Befehl, Häuser und seien Sie verdammt."
 tv_engineering_department.7051.b:0 "Lass das Dorf sein Grün behalten; Die Straße kann sich darum biegen."
 tv_engineering_department.7052.t:0 "Konstruktion: Die einzigen Ersatzpferde gehören einer anderen Gilde"
 tv_engineering_department.7052.d:0 "Die Wagenzunft in der nächsten Provinz besitzt die einzigen verfügbaren Zugpferde. Seine Herren werden sie leihen und den [tv_wonder_logistics_competence|E] aufholen lassen, nur als Gefallen des [prestige|E] des Gerichts, der nicht unbegrenzt ist."
 tv_engineering_department.7052.a:0 "Fordern Sie den Gefallen und bringen Sie die Pferde auf die Straße."
 tv_engineering_department.7052.b:0 "Bewahren Sie den guten Namen des Gerichts für eine Schuld, die es wert ist, eingefordert zu werden."
 tv_engineering_department.7053.t:0 "Bau: Die Kutschenteams der Adligen werden für Stein gesucht"
 tv_engineering_department.7053.d:0 "Den Straßenmeistern sind die Wagen ausgegangen und sie wollen, dass die Kutschenteams der örtlichen Adligen statt Gästen Steine transportieren. Der [tv_wonder_logistics_competence|E] würde an Boden gewinnen, aber unter den Adligen, die über die Unannehmlichkeiten meckern werden, würde er [estate_satisfaction|E] kosten."
 tv_engineering_department.7053.a:0 "Requiriert die Kutschen und setzt sie zum Steintransport ein."
 tv_engineering_department.7053.b:0 "Überlassen Sie den Adligen ihre Kutschen; Finden Sie die Wagen woanders."
 tv_engineering_department.7054.t:0 "Bau: Das Lagerhaus des Klosters wird gesucht"
 tv_engineering_department.7054.d:0 "Das nächstgelegene Kloster verfügt über das einzige Trockenlager entlang der Route, und die Straßenmeister wollen, dass es für Getreide und Werkzeuge geleert wird. Es zu räumen, würde dem [tv_wonder_logistics_competence|E] weiterhelfen, aber es würde den Geistlichen [estate_satisfaction|E] kosten, die nicht vergessen werden, wessen Wagen es gefüllt haben."
 tv_engineering_department.7054.a:0 "Leeren Sie das Lagerhaus und stapeln Sie es mit Vorräten."
 tv_engineering_department.7054.b:0 "Lassen Sie die Geschäfte des Klosters unberührt."
 tv_engineering_department.7055.t:0 "Bau: Der Konvoi braucht den Marktplatz"
 tv_engineering_department.7055.d:0 "Der Konvoi braucht den Marktplatz der Stadt, um seine Wagen umzudrehen, aber auf diesem Platz ist auch Markttag. Das Schließen der Stände würde die Karren bis Mittag durchbringen und den [tv_wonder_logistics_competence|E] helfen, auf Kosten von [estate_satisfaction|E] unter den Bürgern, deren Stände geschlossen blieben."
 tv_engineering_department.7055.a:0 "Schließen Sie den Markt und lassen Sie die Wagen durch."
 tv_engineering_department.7055.b:0 "Der Markt bleibt geöffnet; Die Wagen können einen Tag warten."
 tv_engineering_department.7056.t:0 "Bau: Eine schlammige Strecke verschluckt die Straße"
 tv_engineering_department.7056.d:0 "Ein Teil der Straße ist zu Schlamm geworden, und kein Ochsengespann kann ihn alleine bewältigen. Die eigenen Ochsen und Rücken des Dorfes an die Leine zu legen, würde es räumen und den [tv_wonder_logistics_competence|E] helfen, aber es würde [estate_satisfaction|E] bei den Bauern kosten, die diese Ochsen für die Frühjahrssaat benötigen."
 tv_engineering_department.7056.a:0 "Bringen Sie die dorfeigenen Ochsen und Rücken an die Leine."
 tv_engineering_department.7056.b:0 "Lassen Sie die Bauern ihre Ochsen für die Frühjahrssaat behalten."
 tv_engineering_department.7057.t:0 "Konstruktion: Der Bereitstellungshof kann die Waggons nicht aufnehmen"
 tv_engineering_department.7057.d:0 "Für die nun täglich ankommenden Waggons ist der Bereitstellungshof am Standort zu eng. Die Räumung der halbfertigen Lagerhäuser am Rand würde Platz für die Arbeit des [tv_wonder_logistics_competence|E] schaffen, allerdings auf Kosten des [development|E] am Standort, der bereits in diesen Lagerhäusern versunken ist."
 tv_engineering_department.7057.a:0 "Räumt die Lagerhäuser und erweitert den Hof."
 tv_engineering_department.7057.b:0 "Behalte die Lagerhäuser; Die Waggons können draußen anstehen."
 tv_engineering_department.7058.t:0 "Bau: Gastwirte werden angewiesen, zuerst die Konvois zu bedienen"
 tv_engineering_department.7058.d:0 "Den Gastwirten und Fuhrleuten in der Nähe des Ortes wurde gesagt, dass sie ihre überschüssigen Vorräte zunächst für die Konvois des Wunders aufbewahren und nur den Rest an alle anderen verkaufen sollen. Dadurch würde der [tv_wonder_logistics_competence|E] weiter versorgt, allerdings auf Kosten des [prosperity|E] am Standort, da der lokale Handel zurückgeht."
 tv_engineering_department.7058.a:0 "Halten Sie zuerst den Vorrat für die Konvois bereit."
 tv_engineering_department.7058.b:0 "Lassen Sie die Stadt wie immer handeln."
 tv_engineering_department.7059.t:0 "Bau: Die Pflasterarbeiter der Hauptstadt werden auf der Straße gesucht"
 tv_engineering_department.7059.d:0 "Die Pflastertrupps der Hauptstadt sind gerade dabei, eine Marktstraße neu zu verlegen, als die Straßenbaumeister stattdessen nach ihnen fragen, um die Spurrillen auf dem Weg zur Baustelle auszubessern. Eine Neuzuweisung würde den [tv_wonder_logistics_competence|E] nach vorne bringen, auf Kosten des [development|E] in der Hauptstadt, deren Straße weiterhin zur Hälfte mit Kopfsteinpflaster bedeckt ist."
 tv_engineering_department.7059.a:0 "Ziehen Sie die Besatzungen von der Straße ab und schicken Sie sie auf die Strecke."
 tv_engineering_department.7059.b:0 "Beenden Sie zuerst die Marktstraße. Die Route kann warten."
 tv_engineering_department.7060.t:0 "Bau: Für die Strecke werden die Getreidespeicher der Hauptstadt gesucht"
 tv_engineering_department.7060.d:0 "Die Getreidespeicher am nächsten zum Tor der Hauptstadt sind die schnellste Möglichkeit, die Waggons für die Route zu lagern, und die Straßenmeister wollen, dass sie geöffnet werden. Der Verkauf der Reserve würde dem [tv_wonder_logistics_competence|E] weiterhelfen, auf Kosten des [prosperity|E] in der Hauptstadt, da die eigenen Märkte eine Saison lang dünner werden."
 tv_engineering_department.7060.a:0 "Öffnen Sie die Getreidespeicher und bestücken Sie die Wagen."
 tv_engineering_department.7060.b:0 "Halten Sie die Getreidespeicher geschlossen, um einer mageren Saison vorzubeugen."
 tv_engineering_department.7061.t:0 "Bau: Die Arbeiter werden gebeten, den Rückstand abzuladen"
 tv_engineering_department.7061.d:0 "Die Arbeiter auf der Baustelle sind die einzigen, die freie Hände haben, um die zurückgestellten Waggons zu entladen, und der Vorarbeiter möchte, dass sie von ihren regulären Aufgaben abgezogen werden und stattdessen Sonderschichten an den Seilen übernehmen. Es würde den [tv_wonder_logistics_competence|E] vorantreiben, aber es greift auf den arbeitenden [population|E] vor Ort zurück, der durch die zusätzlichen Stunden erschöpft ist."
 tv_engineering_department.7061.a:0 "Ziehen Sie die Arbeiter in zusätzliche Schichten und beseitigen Sie den Rückstand."
 tv_engineering_department.7061.b:0 "Lassen Sie die Arbeiter ihren regulären Aufgaben nachgehen."
 tv_engineering_department.7062.t:0 "Konstruktion: Die Kräne stehen aus Mangel an Münzen still"
 tv_engineering_department.7062.d:0 "Die Hebekräne stehen jeden dritten Tag aus Mangel an bezahlten Mannschaften still, obwohl der Finanzbeamte schwört, dass die Münze ungezählt im Tresorraum liegt. Wenn man es jetzt loslässt, sind die Seile wieder in der Hand, bevor der Frost einsetzt."
 tv_engineering_department.7062.a:0 "Öffnen Sie den Tresorraum und geben Sie [gold|E] für Doppelschichten aus, um [tv_wonder_construction|E] Fortschritt zu kaufen."
 tv_engineering_department.7062.b:0 "Lassen Sie den Tresorraum verschlossen; Die Mannschaften warten auf den gewöhnlichen Zahltag."
 tv_engineering_department.7063.t:0 "Konstruktion: Die Freimaurer fordern das Siegel der Krone"
 tv_engineering_department.7063.d:0 "Die Maurer weigern sich, die umstrittenen Grenzsteine ohne eine Urkunde zu überschreiten, die das Siegel der Krone und nicht das eines Gouverneurs trägt. Mit der Nennung des Namens des Souveräns auf dem Befehl würde die Angelegenheit heute geklärt sein, obwohl jedes Gericht und der Rat mit jedem solchen Schreiben, das für Steinbrucharbeiter ausgegeben wird, eins weniger zahlen müssen."
 tv_engineering_department.7063.a:0 "Besiegeln Sie die Verfügung im Namen des Souveräns und geben Sie [legitimacy|E] aus, um [tv_wonder_construction|E] Fortschritt über die Grenzsteine hinaus zu kaufen."
 tv_engineering_department.7063.b:0 "Halten Sie das königliche Siegel zurück und lassen Sie den Gouverneur selbst über die Grenze entscheiden."
 tv_engineering_department.7064.t:0 "Bau: Zwei Weiler blockieren die Transportstraße"
 tv_engineering_department.7064.d:0 "Zwei Weiler liegen quer über der geplanten Transportstraße, und ihre Vorsteher haben zweimal klar \"Nein\" gesagt. Sie beiseite zu befehlen, würde die Straße innerhalb einer Woche frei machen, auf Kosten der Ruhe, die die Krone seit der letzten schlechten Ernte um sie herum bewahrt hat."
 tv_engineering_department.7064.a:0 "Befehlen Sie den Weilern, Platz zu machen, und geben Sie [stability|E] aus, um [tv_wonder_construction|E] den Fortschritt entlang der Transportstraße freizumachen."
 tv_engineering_department.7064.b:0 "Verlegen Sie die Transportstraße um die Weiler herum und lassen Sie die Häuptlinge in Ruhe."
 tv_engineering_department.7065.t:0 "Aufbau: Der Gildenmeister nennt seinen Preis, um die Warteschlange zu überspringen"
 tv_engineering_department.7065.d:0 "Der Zunftmeister der Steinmetze tritt nur dann in die Warteschlange für die Maurer des Wunders, wenn das Gericht einen seit dem letzten Staatsbesuch geschuldeten Gefallen einfordert. Wenn Sie jetzt fragen, wird die Bestellung an den Anfang des Hauptbuchs verschoben, aber ein Gefallen, der laut genannt wird, ist ein Gefallen, der ausgegeben wird."
 tv_engineering_department.7065.a:0 "Rufen Sie den Gefallen an und geben Sie [prestige|E] aus, um die Bestellung voranzutreiben, und kaufen Sie [tv_wonder_construction|E] Fortschritt."
 tv_engineering_department.7065.b:0 "Lassen Sie die Reihenfolge der Reihe nach bestehen und heben Sie sich den Gefallen für später auf."
 tv_engineering_department.7066.t:0 "Aufbau: Ein Herr bietet seinen Haushaltsabgaben an"
 tv_engineering_department.7066.d:0 "Ein örtlicher Fürst bietet seinem eigenen Haushalt Abgaben an, um im kommenden Monat Steine zu schleppen, vorausgesetzt, dass niemand erwähnt, dass seinen Männern nach dem letzten Aufmarsch eine Saisonpause versprochen wurde. Sein Steward erstellt bereits den Dienstplan."
 tv_engineering_department.7066.a:0 "Nehmen Sie die Abgaben des Herrn und geben Sie die [estate_satisfaction|E] der Adligen aus, um [tv_wonder_construction|E] Fortschritt zu kaufen."
 tv_engineering_department.7066.b:0 "Lehnen Sie die Abgaben ab und lassen Sie die Männer des Lords ihre versprochene Saison einhalten."
 tv_engineering_department.7067.t:0 "Bau: Der Armenhausfonds der Abtei könnte das Holz decken"
 tv_engineering_department.7067.d:0 "Der Fonds für das Armenhaus der Abtei ist in diesem Viertel reichlich vorhanden, und der Prior hat angedeutet, dass er Gerüstholz abdecken könnte, wenn die Krone nur direkt darum bitten würde, anstatt nur eine Antwort zu geben. Das direkte Fragen ist der Teil, an den sich das Kapitel erinnern wird."
 tv_engineering_department.7067.a:0 "Fragen Sie den Prior direkt und geben Sie den Geistlichen [estate_satisfaction|E] für Gerüstholz aus und kaufen Sie [tv_wonder_construction|E] Fortschritt."
 tv_engineering_department.7067.b:0 "Lassen Sie die Finanzierung des Armenhauses in Ruhe und besorgen Sie das Holz woanders."
 tv_engineering_department.7068.t:0 "Bau: Waggonzüge verwickeln sich mit dem Markttag"
 tv_engineering_department.7068.d:0 "Die Waggonzüge, die für die Stätte des Wunders bestimmt sind, geraten an denselben drei Ecken immer wieder in den Marktverkehr. Die Sperrung dieser Straßen für den Handel an Liefertagen würde die Route sofort entwirren, obwohl die Standbesitzer diese stundenlangen Bräuche völlig verlieren würden."
 tv_engineering_department.7068.a:0 "Schließen Sie an Liefertagen die Straßen und geben Sie die [estate_satisfaction|E] der Bürger aus, um [tv_wonder_construction|E] Fortschritt zu kaufen."
 tv_engineering_department.7068.b:0 "Lassen Sie die Marktstraßen offen und lassen Sie die Wagen warten, bis sie an der Reihe sind."
 tv_engineering_department.7069.t:0 "Bau: Die Grabungsmannschaften werden für die Erdarbeiten eingesetzt"
 tv_engineering_department.7069.d:0 "Der Gerichtsvollzieher sagt, die umliegenden Dörfer könnten Hände für die Erdarbeiten entbehren, hätten aber nur die gleichen Hände, die bereits für die Grabenlegung im Herbst zur Verfügung stünden, die ihre eigenen Felder vor Überschwemmungen bewahrt. Wenn man sie jetzt einzieht, muss man warten."
 tv_engineering_department.7069.a:0 "Stellen Sie die Dorfarbeiter für die Erdarbeiten ein und geben Sie die [estate_satisfaction|E] der Bauern für den [tv_wonder_construction|E] Fortschritt aus."
 tv_engineering_department.7069.b:0 "Überlassen Sie die Dörfer ihrer Not und finden Sie anderswo Arbeitskräfte."
 tv_engineering_department.7070.t:0 "Konstruktion: Das alte Getreidelager steht dort, wo das Gerüst errichtet werden muss"
 tv_engineering_department.7070.d:0 "Das alte Getreidelager, das dort steht, wo das Westgerüst hingehört, ist stabil genug, um es zu behalten, aber sein Stein und seine Grundfläche würden sowohl den Mangel des Maurers als auch die Beschwerde des Vermessers auf einen Schlag beantworten. Das Herunterziehen ist der schnelle Weg."
 tv_engineering_department.7070.a:0 "Öffnen Sie den Getreidespeicher und geben Sie [development|E] vor Ort aus, um [tv_wonder_construction|E] Fortschritt zu kaufen."
 tv_engineering_department.7070.b:0 "Lassen Sie den Getreidespeicher stehen und suchen Sie sich den Gerüstraum woanders."
 tv_engineering_department.7071.t:0 "Aufbau: Wirtsleute wenden sich ruhig dem Wunder zu"
 tv_engineering_department.7071.d:0 "Die Tavernenbesitzer und Fuhrleute des Ortes haben in aller Stille damit begonnen, ihre Gewohnheiten auf Wunderlieferungen umzuleiten, da die Mannschaften mit barem Geld bezahlen, der normale Handel jedoch nicht. Die Formalisierung dieser Vereinbarung würde die Lieferungen beschleunigen, allerdings auf Kosten des Handels, auf dem die Besitzer ihren Brauch aufgebaut haben."
 tv_engineering_department.7071.a:0 "Formulieren Sie die Umleitung, indem Sie [prosperity|E] auf der Website ausgeben, um [tv_wonder_construction|E] Fortschritt zu kaufen."
 tv_engineering_department.7071.b:0 "Lassen Sie den örtlichen Handel seinen normalen Lauf nehmen und lassen Sie die Lieferungen so, wie sie sind."
 tv_engineering_department.7072.t:0 "Konstruktion: Eine Brücke oder ein Wunder"
 tv_engineering_department.7072.d:0 "Die Reparatur der eigenen Brücke in der Hauptstadt ist aus Mangel an Steinmetzen ins Stocken geraten, und jeder Maurer, der dort arbeitet, ist ein Maurer, der nicht für das Wunder arbeitet. Eine Neuzuteilung der Besatzung würde das Wunder sofort voranbringen und die Brücke würde einfach warten, bis sie an der Reihe ist."
 tv_engineering_department.7072.a:0 "Weisen Sie die Brückenmannschaft dem Wunder zu und geben Sie [development|E] in der Hauptstadt für den Fortschritt von [tv_wonder_construction|E] aus."
 tv_engineering_department.7072.b:0 "Lassen Sie die Brückenmannschaft dort, wo sie ist, und lassen Sie die Brücke zuerst fertig werden."
 tv_engineering_department.7073.t:0 "Konstruktion: Getreidefaktoren bieten ihren Überschuss zu einem Preis"
 tv_engineering_department.7073.d:0 "Die Getreidefabriken der Hauptstadt haben angeboten, ihre Überschüsse zu einem fairen Preis direkt an die Geschäfte des Wunders zu verkaufen, vorausgesetzt, die Krone erlaubt ihnen, den Verkauf als Beweis der königlichen Gunst auf dem Hauptplatz auszuhängen. Es würde die Mannschaften durch den mageren Monat ernähren und den Markt sichtbar auf einen einzigen Käufer ausdehnen."
 tv_engineering_department.7073.a:0 "Lassen Sie die Faktoren den Verkauf verbuchen und geben Sie [prosperity|E] im Kapital aus, um den Fortschritt von [tv_wonder_construction|E] zu kaufen."
 tv_engineering_department.7073.b:0 "Lehnen Sie den öffentlichen Verkauf ab und kaufen Sie das Getreide der Mannschaften über die üblichen Kanäle."
 tv_engineering_department.7074.t:0 "Konstruktion: Der Aufseher schlägt vor, die Nacht durchzuarbeiten"
 tv_engineering_department.7074.d:0 "Der Aufseher schlägt vor, die eigenen Teams der Baustelle durch die Nachtschicht zu führen, anstatt auf neue Hände des Personalvermittlers zu warten, da die Fackeln und das Testament bereits da sind. Bis zum Morgengrauen würde der Rückstand beseitigt sein, obwohl dieselben Männer bei Tagesanbruch ohne Pause zurück sein würden."
 tv_engineering_department.7074.a:0 "Bestellen Sie die Nachtschicht und verbringen Sie die Arbeit [population|E] vor Ort, um [tv_wonder_construction|E] Fortschritt zu kaufen."
 tv_engineering_department.7074.b:0 "Schicken Sie die Mannschaften in ihre Betten und warten Sie auf neue Hände vom Personalvermittler."
 tv_engineering_department.7075.t:0 "Konstruktion: Meinung bei den Scaffold Wavers"
 tv_engineering_department.7075.d:0 "Eine öffentliche Demonstration vor Ort zieht eine Menschenmenge an, die zu treuen Zuschauern oder beleidigten Kritikern werden kann. Die Gerüste warten, während Gerüchte darüber entscheiden, ob [tv_wonder_domestic_support|E] geholfen oder geschadet wurde."
 tv_engineering_department.7075.a:0 "Lassen Sie die Demonstration für sich sprechen."
 tv_engineering_department.7076.t:0 "Konstruktion: Der Plan wächst über die Seite hinaus"
 tv_engineering_department.7076.d:0 "Eine mutige Anpassung sprengt den Plan über seine alten Grenzen hinaus. Es kann die Entscheidung sein, die das Denkmal großartig gemacht hat, oder die Notiz, die zukünftige Beamte rot unterstreichen."
 tv_engineering_department.7076.a:0 "Bringt das Design über seine alten Grenzen hinaus."
 tv_engineering_department.7077.t:0 "Konstruktion: Befehle ändern sich unter der Markise"
 tv_engineering_department.7077.d:0 "Unter den Markisen wird eine neue Befehlskette eingeführt. Es kann den Hof disziplinieren oder einfach jedem Vorarbeiter eine neue Art des Argumentierens beibringen."
 tv_engineering_department.7077.a:0 "Wir schieben die neue Befehlskette durch den Hof."
 tv_engineering_department.7078.t:0 "Konstruktion: Die Route verläuft durch Schlamm"
 tv_engineering_department.7078.d:0 "Ein riskanter Weg verspricht eine Verkürzung der Nachschublinie. Wenn das Wetter hält, wird es als Voraussicht gelobt; Wenn es fehlschlägt, wird sich jeder daran erinnern, wer den Zug angeordnet hat."
 tv_engineering_department.7078.a:0 "Nehmen Sie den kürzeren Weg!"
 tv_engineering_department.7079.t:0 "Konstruktion: Eine neue Methode liegt in der Luft"
 tv_engineering_department.7079.d:0 "Am aktiven Teil wird eine schnellere Methode ausprobiert. Es kann den Monat retten oder die nächste Crew dazu zwingen, einen schönen Fehler zu beheben."
 tv_engineering_department.7079.a:0 "Versucht die schnellere Methode im aktiven Abschnitt."
 tv_engineering_department.7080.t:0 "Baugewerbe: Arbeiter legen ihre Werkzeuge wegen eines gebrochenen Versprechens nieder"
 tv_engineering_department.7080.d:0 "Die Arbeiter legten heute Morgen ihre Werkzeuge nieder und murmelten, dass das Wunder darin bestehe, das Silber der Krone auszubluten. Der Vorarbeiter beruhigte sie mit dem Versprechen eines Bonuslohns, ein Versprechen, das die Staatskasse nun entweder einhalten oder vor der Menge brechen muss."
 tv_engineering_department.7080.a:0 "Brechen Sie die versprochene Prämie und lassen Sie das Murren der Arbeiter auf der Baustelle verbreiten."
 tv_engineering_department.7080.b:0 "Halten Sie den versprochenen Bonus ein und lassen Sie ihn aus der Kasse kommen."
 tv_engineering_department.7081.t:0 "Konstruktion: Eine Broschüre stellt das Siegel der Urkunde in Frage"
 tv_engineering_department.7081.d:0 "Ein reisender Angestellter las auf dem Platz laut eine Broschüre vor, in der er behauptete, dass das Schreiben der Krone, mit dem das Wunder genehmigt wurde, nie rechtmäßig versiegelt worden sei. Ob die Zweifel am Projekt unbeantwortet bleiben oder das Schreiben selbst stillschweigend geändert wird, es muss etwas passieren."
 tv_engineering_department.7081.a:0 "Lassen Sie die Broschüre unbeantwortet und sorgen Sie dafür, dass sich weiterhin Zweifel an dem Wunder verbreiten."
 tv_engineering_department.7081.b:0 "Ändern Sie in aller Stille den Wortlaut des Schreibens, um der Herausforderung gerecht zu werden, und akzeptieren Sie die Beeinträchtigung des Mandats der Krone."
 tv_engineering_department.7082.t:0 "Aufbau: Eine Abgabe löst in zwei Tagen eine Rauferei aus"
 tv_engineering_department.7082.d:0 "Es kam die Nachricht, dass die Entsendung von Steintransportern für das Wunder zwei Tagesritte von der Stätte entfernt zu einer Auseinandersetzung zwischen Wehrpflichtigen und Dorfbewohnern geführt habe. Die Beruhigung wird etwas kosten, entweder in diesem Bezirk oder vor den Toren des Geländes."
 tv_engineering_department.7082.a:0 "Lassen Sie die Tore des Geländes das Murren absorbieren und lassen Sie die Unruhe im Bezirk ausbrennen."
 tv_engineering_department.7082.b:0 "Entsenden Sie Truppen, um den Bezirk ruhig zu regeln, bevor sich die Unruhen weiter ausbreiten."
 tv_engineering_department.7083.t:0 "Konstruktion: Der Halsen eines Gesandten reist vom Hafen zum Palast"
 tv_engineering_department.7083.d:0 "Ein ausländischer Gesandter lachte beim Bankett, dass das Wunder langsamer kriecht als ein Pflugochse, und dieser Spott wird jetzt in jeder Taverne vom Hafen bis zum Palast wiederholt. Jemand muss es schlucken, entweder das Ansehen der Krone im Ausland oder der Stolz der Stadtbewohner auf das, was gebaut wird."
 tv_engineering_department.7083.a:0 "Ignorieren Sie den Spott des Gesandten und lassen Sie den Stolz der Stadtbewohner auf das Wunder über sich ergehen."
 tv_engineering_department.7083.b:0 "Antworten Sie dem Gesandten mit einer großzügigen Gegenpräsentation und nutzen Sie das Ansehen der Krone, um ihn zum Schweigen zu bringen."
 tv_engineering_department.7084.t:0 "Konstruktion: Lord Aldric's Steward Dämpfe am Tor"
 tv_engineering_department.7084.d:0 "Die neue Steinbruchstraße wurde letzte Woche direkt durch Lord Aldrics Jagdrevier geschnitten, und sein Verwalter steht seitdem vor Wut am Grundstückstor. Entweder ist der Haushalt des Lords besänftigt, oder das Volk, das die Pattsituation beobachtet, zieht seine eigenen Schlussfolgerungen."
 tv_engineering_department.7084.a:0 "Lassen Sie zu, dass sich die Pattsituation ungelöst hinzieht, und lassen Sie zu, dass die Meinung der Masse über das Projekt sauer wird."
 tv_engineering_department.7084.b:0 "Gewähren Sie dem Haushalt des Herrn eine formelle Entschuldigung und eine Entschädigung, um die Angelegenheit zu regeln."
 tv_engineering_department.7085.t:0 "Konstruktion: Der Fundamentgraben bringt alte Gräber zum Vorschein"
 tv_engineering_department.7085.d:0 "Bagger, die den Fundamentgraben vorbereiteten, stießen auf alte Grabsteine, die niemand dokumentiert hatte, und der Gemeindepfarrer weigert sich, weitere Arbeiten zu segnen, bis die Toten ordnungsgemäß umgebettet sind. Entweder werden die Umbettungsriten vollständig bezahlt, oder die Ausgrabungen werden trotz der Einwände des Priesters fortgesetzt."
 tv_engineering_department.7085.a:0 "Setzen Sie sich über den Priester hinweg und graben Sie weiter. Lassen Sie stattdessen zu, dass die Nachricht von den aufgewühlten Gräbern die Menge verunsichert."
 tv_engineering_department.7085.b:0 "Bezahlen Sie die vollständigen Umbettungsriten, um den Priester und die Gemeinde zufrieden zu stellen."
 tv_engineering_department.7086.t:0 "Bau: Gerüststangen blockieren die Händlerreihe"
 tv_engineering_department.7086.d:0 "Über die Hauptstraße gelegte Gerüststangen blockieren seit sechs Tagen in Folge den Karrenverkehr zur Händlerreihe, und die Standbesitzer verlangen, dass jemand für den entgangenen Handel zur Rechenschaft gezogen wird. Entweder werden ihre Verluste ausgeglichen, oder die Straße bleibt geschlossen und die Menge erfährt davon."
 tv_engineering_department.7086.a:0 "Lassen Sie die Händler ohne Entschädigung und lassen Sie zu, dass die gesperrte Straße das Murren der Menge anheizt."
 tv_engineering_department.7086.b:0 "Kompensieren Sie die Reihe der Händler für den blockierten Handel sofort."
 tv_engineering_department.7087.t:0 "Konstruktion: Die Reifefelder bleiben ungeschnitten"
 tv_engineering_department.7087.d:0 "Die Erntehelfer zogen die Dorfarbeiter von den reifenden Feldern ab, um Holz für das Wunder zu schleppen, und das Getreide steht nun ungeschnitten da, während den Arbeitern auf der Baustelle der Rücken schmerzt. Entweder bekommen die Dörfer ihre Hände für die Ernte zurück, oder die Menge hört, wie das Wunder die Felder leerte."
 tv_engineering_department.7087.a:0 "Halten Sie die erhobenen Hände an Ort und Stelle und lassen Sie die Menge über das stehende Getreide informieren."
 tv_engineering_department.7087.b:0 "Geben Sie die Hände des Dorfes sofort wieder zur Ernte frei."
 tv_engineering_department.7088.t:0 "Bau: Das alte Gerbereiviertel ist zur Hälfte abgerissen"
 tv_engineering_department.7088.d:0 "Der Plan der Maurer sieht vor, das alte Gerbereiviertel zu räumen, um Platz für die Fundamente des Wunderwerks zu schaffen, und die Hälfte davon wurde eingestürzt, bevor jemand auf die Idee kam, sich zu fragen, was es ersetzen würde. Entweder wird der Bezirk wie geplant dem Erdboden gleichgemacht, oder der Plan wird zurückgefahren und die Leute fragen sich, warum das Wunder so viel Platz braucht."
 tv_engineering_department.7088.a:0 "Reduzieren Sie den Abstand und lassen Sie die Leute fragen, warum das Wunderwerk überhaupt so viel Boden brauchte."
 tv_engineering_department.7088.b:0 "Beenden Sie die Zerstörung des Gerbereiviertels wie geplant und machen Sie sich Gedanken darüber, was es später ersetzen wird."
 tv_engineering_department.7089.t:0 "Bau: Das Marktgelände ist nicht zurückgekehrt"
 tv_engineering_department.7089.d:0 "Der Schauplatz des Wunderwerks hat im dritten Monat in Folge das Gelände des Wochenmarktes verschluckt, und die Stände, die ihn einst füllten, kommen einfach nicht mehr zurück. Entweder wird das Marktgelände zurückgegeben, bevor es in Vergessenheit gerät, oder der Hof behält es und der Handel auf dem Gelände wird immer dünner."
 tv_engineering_department.7089.a:0 "Behalten Sie den Bereitstellungsplatz, wo er ist, und lassen Sie den standorteigenen Markthandel weiter abkühlen."
 tv_engineering_department.7089.b:0 "Kehren Sie zum Marktgelände zurück, bevor die Wochenstände den Rückweg vergessen."
 tv_engineering_department.7090.t:0 "Konstruktion: Das Armenhaus liegt unberührt von der alten Brücke"
 tv_engineering_department.7090.d:0 "Der Stadtvermesser beschlagnahmte jeden freien Maurer in der Hauptstadt für das Mauerwerk des Wunderwerks, und das halbfertige Armenhaus an der alten Brücke blieb daher zwei Monate lang unberührt. Entweder wartet das Armenhaus, bis das Wunder vollbracht ist, oder die Maurer werden in die Hauptstadt zurückgezogen und die Website wird langsamer, um zu erklären, warum."
 tv_engineering_department.7090.a:0 "Halten Sie jeden Maurer auf dem Laufenden und lassen Sie die halbfertigen Projekte der Hauptstadt warten."
 tv_engineering_department.7090.b:0 "Erinnern Sie die Maurer daran, das Armenhaus fertigzustellen, und lassen Sie die Menschen vor Ort über die Verzögerung staunen."
 tv_engineering_department.7091.t:0 "Bau: Steinwagen verstopfen die schönste Straße der Hauptstadt"
 tv_engineering_department.7091.d:0 "Seit einer Woche parken entlang der schönsten Einkaufsstraße der Hauptstadt Waggons aus behauenem Stein, die für das Wunder bestimmt sind, und die dortigen Ladenbesitzer sagen, dass der Brauch versiegt sei, da die Straße blockiert sei. Entweder finden die Wagen bald eine andere Route, oder sie bleiben und der Eigenhandel der Hauptstadt kühlt weiter ab."
 tv_engineering_department.7091.a:0 "Lassen Sie die Wagen dort, wo sie sind, und überlassen Sie stattdessen dem eigenen Fortschritt der Baustelle die Schuld."
 tv_engineering_department.7091.b:0 "Leiten Sie die Waggons sofort um und lassen Sie die Einkaufsstraße der Hauptstadt wieder aufatmen."
 tv_engineering_department.7092.t:0 "Konstruktion: Ein Gerüsteinsturz lässt ein Dutzend kaputt zurück"
 tv_engineering_department.7092.d:0 "Bei einem Gerüsteinsturz auf der Baustelle vor drei Tagen erlitten ein Dutzend Arbeiter Knochenbrüche, und der Rest der Besatzung murrt nun, dass kein Lohn das Risiko wert sei. Entweder erzwingen die Aufseher das Tempo und die Arbeiter beginnen sich mitten in der Nacht davonzumachen, oder das Tempo verlangsamt sich und die Nachricht von der Gefahr verbreitet sich in der Stadt."
 tv_engineering_department.7092.a:0 "Lassen Sie die Gefahr in der Stadt zum Alltagsgespräch werden und halten Sie jeden Arbeiter auf der Baustelle."
 tv_engineering_department.7092.b:0 "Erzwingen Sie trotzdem das Tempo und akzeptieren Sie, dass verängstigte Arbeiter nachts davonlaufen."
 tv_engineering_department.7093.t:0 "Konstruktion: Der Tresor ist leichter als die Ledger-Ansprüche"
 tv_engineering_department.7093.d:0 "Der Zahlmeister der Website öffnet den Tresor und stellt fest, dass er leichter ist als die Forderungen im Hauptbuch. Jemand hat bereits Münzen ausgegeben, die nie gezählt wurden, und der Fehlbetrag wird entweder in [tv_wonder_scale_competence|E] oder in [gold|E] ausgeglichen."
 tv_engineering_department.7093.a:0 "Schrumpfen Sie das Design so, dass es dem entspricht, was die Truhe noch leisten kann."
 tv_engineering_department.7093.b:0 "Decken Sie das Defizit aus der Staatskasse und bauen Sie weiter in großem Maßstab."
 tv_engineering_department.7094.t:0 "Bau: Ein Rivale flüstert, dass keine Charta dies zulasse"
 tv_engineering_department.7094.d:0 "Ein Mitbewerber hat zu flüstern begonnen, dass keine Charta ein Denkmal dieser Größe zulasse. Die Sachbearbeiter sagen, die Angelegenheit könne stillschweigend geklärt werden, allerdings nicht ohne Kosten für [tv_wonder_scale_competence|E] oder [legitimacy|E]."
 tv_engineering_department.7094.a:0 "Ziehen Sie die größten Ansprüche stillschweigend aus der Charta zurück."
 tv_engineering_department.7094.b:0 "Lassen Sie die Krone die Charta vollständig bestätigen und antworten Sie direkt auf die Einflüsterungen."
 tv_engineering_department.7095.t:0 "Bau: Drei Gemeinden blockieren die Straße über den Fundamenten"
 tv_engineering_department.7095.d:0 "Männer aus drei Gemeinden haben Werkzeuge über die verbreiterten Fundamente geworfen und die Straße mit Karren blockiert. Der Gerichtsvollzieher kann sie zerstreuen, aber nur, indem er irgendwo nachgibt – entweder den [tv_wonder_scale_competence|E] des Plans oder den [stability|E] des Bezirks."
 tv_engineering_department.7095.a:0 "Verengen Sie die Fundamente wieder auf die ursprüngliche Linie und schicken Sie die Männer zufrieden nach Hause."
 tv_engineering_department.7095.b:0 "Schicken Sie bewaffnete Männer los, um die Straße freizumachen und die breiteren Fundamente zu erhalten."
 tv_engineering_department.7096.t:0 "Aufbau: Die Heralds weigern sich, unbezahlt zu reisen"
 tv_engineering_department.7096.d:0 "Die Herolde, die das Denkmal im Ausland verkünden sollten, haben seit zwei Monaten keinen Lohn erhalten und verweigern nun die Reise. Jemand muss sofort zufrieden sein, ob das nun bedeutet, den [tv_wonder_scale_competence|E] des Designs zu kürzen oder den [prestige|E] der Krone auszugeben, um seine Stille zu erkaufen."
 tv_engineering_department.7096.a:0 "Kündigen Sie ein kleineres, billigeres Denkmal an und lassen Sie stattdessen die Herolde dieses Wort tragen."
 tv_engineering_department.7096.b:0 "Bezahle die Herolde mit dem eigenen Namen und Ruf der Krone."
 tv_engineering_department.7097.t:0 "Konstruktion: Der Verwalter des Barons zählt doppelt so viel Holz"
 tv_engineering_department.7097.d:0 "Der Verwalter eines Barons hat das aus den Wäldern seines Herrn beschlagnahmte Holz gezählt und findet das Doppelte der vereinbarten Menge. Der Lord wird entweder eine kleinere Kürzung akzeptieren, die den [tv_wonder_scale_competence|E] des Plans verkleinert, oder eine formelle Entschuldigung und weitere Zugeständnisse der Adligen an [estate_satisfaction|E]."
 tv_engineering_department.7097.a:0 "Reduzieren Sie zukünftige Holzquoten und verkleinern Sie das Design entsprechend."
 tv_engineering_department.7097.b:0 "Senden Sie eine formelle Entschuldigung und weitere Zuschüsse an das Haus des Barons."
 tv_engineering_department.7098.t:0 "Konstruktion: Das breitere Kirchenschiff würde die alte Grabstätte verschlucken"
 tv_engineering_department.7098.d:0 "Ein Bischof hat erfahren, dass die breitere Gestaltung des Kirchenschiffs die alte Grabstätte des Kapitels verschlucken wird. Er wird die Werke nicht erneut segnen, es sei denn, der Plan wird gekürzt oder die Beschwerden des Kapitels gegenüber [estate_satisfaction|E] im Klerus werden vollständig beantwortet."
 tv_engineering_department.7098.a:0 "Zeichnen Sie das Kirchenschiff neu, um die Grabstätte zu schonen."
 tv_engineering_department.7098.b:0 "Gewähren Sie dem Kapitel neue Privilegien, um auf seine Beschwerde einzugehen."
 tv_engineering_department.7099.t:0 "Bau: Die verbreiterte Straße führt durch die Lagerhäuser"
 tv_engineering_department.7099.d:0 "Die Wollhändler berichten, dass die verbreiterte Straße zum Gelände ihre Lagerreihe durchtrennt hat und die Waren jetzt an der Kreuzung verrotten. Entweder wird die Straße wieder schmaler und schneidet den [tv_wonder_scale_competence|E] der gesamten Zufahrt ab, oder die Krone gleicht den [estate_satisfaction|E] unter den Bürgern komplett aus."
 tv_engineering_department.7099.a:0 "Verengen Sie die Zufahrtsstraße und schonen Sie die Lagerhäuser."
 tv_engineering_department.7099.b:0 "Zahlen Sie den Händlern ihre Verluste und behalten Sie die breitere Straße."
 tv_engineering_department.7100.t:0 "Bau: Ein Dorf hat diesen Monat drei Männer begraben"
 tv_engineering_department.7100.d:0 "Es kommt die Nachricht, dass ein Dorf in der Nähe des Steinbruchs diesen Monat drei Männer begraben hat, die bis in die Dunkelheit hinein an dem erweiterten Auftrag gearbeitet haben. Der Vogt sagt, dass die Korvee gekürzt werden muss, es sei denn, die Krone würde lieber für [estate_satisfaction|E] unter den Bauern mit Getreide und Silber einstehen, anstatt [tv_wonder_scale_competence|E] zu schrumpfen."
 tv_engineering_department.7100.a:0 "Reduzieren Sie die Frondienste auf das, was das Dorf ertragen kann."
 tv_engineering_department.7100.b:0 "Schicken Sie Getreide und Silber ins Dorf und behalten Sie die Korvee wie befohlen."
 tv_engineering_department.7101.t:0 "Bau: Eine Reihe von Häusern wird als Baugrundstück abgerissen"
 tv_engineering_department.7101.d:0 "Der Vorarbeiter hat auf der Baustelle eine Reihe stehender Häuser abgerissen, um das Arbeitsgelände zu verbreitern, und die Bürger fragen, was an ihrer Stelle gebaut werden soll. Die Antwort besteht darin, entweder das Design zu verkleinern und [tv_wonder_scale_competence|E] keinen Grund zu ersparen, den es nicht benötigt, oder es bedeutet, noch weiter zu räumen und mehr von [development|E] der Site zu verlieren."
 tv_engineering_department.7101.a:0 "Stoppen Sie weitere Rodungen und entwerfen Sie den Plan neu, um ihn an das bereits belegte Gelände anzupassen."
 tv_engineering_department.7101.b:0 "Ordnen Sie an, die Räumung fortzusetzen, und lassen Sie die Baustelle den Verlust auffangen."
 tv_engineering_department.7102.t:0 "Bau: Der Markt, der einst das Gelände umgab, ist verschwunden"
 tv_engineering_department.7102.d:0 "Der Markt, der einst die Baustelle umgab, wurde durch Gerüste und Lärm vertrieben, und die Stände sind nicht zurückgekehrt. Der Aufseher muss entscheiden, ob er die Arbeiten näher heranziehen und dabei etwas [tv_wonder_scale_competence|E] aufgeben soll oder ob er die [prosperity|E] des Standorts weiter ausbluten lässt, während der Markt verbannt bleibt."
 tv_engineering_department.7102.a:0 "Ziehen Sie das Gerüst ein und lassen Sie den Markt zurückkehren."
 tv_engineering_department.7102.b:0 "Halten Sie die Arbeiten weit verbreitet und lassen Sie den Handel der Website verkümmern."
 tv_engineering_department.7103.t:0 "Bau: Die Brückenbauer wurden zum Wunder hingezogen"
 tv_engineering_department.7103.d:0 "Die für das Wunderwerk rekrutierten Maurer wurden direkt aus den Brückenreparaturarbeiten der Hauptstadt abgezogen, die nun vor dem Winter halb fertig sind. Irgendwer muss nachgeben: Entweder schrumpft der [tv_wonder_scale_competence|E] des Wunders, damit die Maurer nach Hause gehen können, oder der [development|E] der Hauptstadt bleibt unrepariert die Saison überlassen."
 tv_engineering_department.7103.a:0 "Lassen Sie die Maurer zurück in die Hauptstadt und verkleinern Sie das Wunder."
 tv_engineering_department.7103.b:0 "Behalten Sie die Maurer am Wunder und lassen Sie die Reparaturen der Hauptstadt warten."
 tv_engineering_department.7104.t:0 "Bau: In den Gildenhallen der Hauptstadt ist es still geworden"
 tv_engineering_department.7104.d:0 "In den Zunfthallen der Hauptstadt ist es still geworden, und ihre Handwerker und Fuhrleute wurden abgezogen, um den Appetit des Wunders auf Steine und Hände zu stillen. Der Stadtrat stellt die klare Frage, ob der Entwurf schließlich zugeschnitten wird und [tv_wonder_scale_competence|E] verschont wird, oder ob der [prosperity|E] der Hauptstadt weiterhin ein Denkmal finanzieren muss, das in seinen eigenen Straßen nicht mehr errichtet wird."
 tv_engineering_department.7104.a:0 "Verkleinern Sie das Design und lassen Sie die Gildenmitglieder zurück in die Hauptstadt."
 tv_engineering_department.7104.b:0 "Halten Sie die Gildenmitglieder vor Ort und lassen Sie den Handel der Hauptstadt weiterhin dafür bezahlen."
 tv_engineering_department.7105.t:0 "Bau: Der Chirurg warnt davor, dass noch mehr fallen werden"
 tv_engineering_department.7105.d:0 "Letzte Nacht ist ein Gerüst auf der verbreiterten Ebene eingestürzt, und der Chirurg sagt, dass noch mehr herunterfallen werden, wenn das Tempo gegenüber dem größeren Plan nicht verlangsamt wird. Der Aufseher kann entweder den Entwurf auf ein Tempo reduzieren, das die Mannschaften überleben können, und [tv_wonder_scale_competence|E] schonen, oder die umfassendere Arbeit weiter vorantreiben und akzeptieren, dass die Zahl der arbeitenden [population|E] auf der Baustelle weiter abnimmt."
 tv_engineering_department.7105.a:0 "Verlangsamen Sie das Tempo und reduzieren Sie den Plan auf das, was die Besatzungen ertragen können."
 tv_engineering_department.7105.b:0 "Lassen Sie die umfassendere Arbeit voranschreiten und nehmen Sie den Tribut an die Arbeiter in Kauf."
 tv_engineering_department.7106.t:0 "Konstruktion: Zwei Angestellte zählen den gleichen Fehlbetrag zweimal"
 tv_engineering_department.7106.d:0 "Bei der Zählung gestern Abend durch zwei verschiedene Angestellte war der Geldschrank des Zahlmeisters leer. Entweder wird die fehlende Münze von der Staatskasse abgeschrieben, oder der gesamte Schichtplan wird zerrissen und jede Mannschaft aus dem Nichts neu zugewiesen. [tv_wonder_organization_competence|E] oder [gold|E] übernimmt die Rechnung der Sachbearbeiter."
 tv_engineering_department.7106.a:0 "Zerreißen Sie den Schichtplan und weisen Sie jede Crew von Grund auf neu zu."
 tv_engineering_department.7106.b:0 "Schreiben Sie die fehlende Münze von der Kasse ab und hinterlassen Sie die Liste wie gezählt."
 tv_engineering_department.7107.t:0 "Bau: Ein gefälschter Zuschuss wird den Besatzungen vorgelesen"
 tv_engineering_department.7107.d:0 "Ein Ausrufer, den kein Vorarbeiter kennt, verliest einem rivalisierenden Herrn eine gefälschte Gewährung der Holzrechte für das Gelände, vor den Augen der Mannschaften. Den Mann jagen und die Behauptung widerlegen, bevor die versammelten Arbeiter jeden Vorarbeiter für diesen Tag von seinem Posten holen. Dass die Fälschung unbeantwortet bleibt, hält die Trupps auf Trab, aber die Behauptung wird in den Tavernen bereits als Tatsache wiederholt. [tv_wonder_organization_competence|E] oder [legitimacy|E] tragen die Lüge des Fälschers."
 tv_engineering_department.7107.a:0 "Ziehen Sie jeden Vorarbeiter von seinem Posten, um den Ausrufer zu jagen und die Sache richtigzustellen."
 tv_engineering_department.7107.b:0 "Lassen Sie die gefälschte Behauptung unbeantwortet und lassen Sie die Mitarbeiter bei der Arbeit bleiben."
 tv_engineering_department.7108.t:0 "Aufbau: Ein Streichholz ergießt sich auf die Straße"
 tv_engineering_department.7108.d:0 "Ein schiebendes Streichholz an der Messelinie, über einen halben Sack verdorbenes Getreide, ergoss sich aus dem Tor und auf die Straße, bevor die Wache es auseinanderbrach. Die Besatzungen können zu versetzten Zeiten neu gemischt und gefüttert werden, sodass sich die beiden Banden nie wieder treffen, oder die Wache kann auf offenem Platz Verhaftungen vornehmen, um die Angelegenheit endgültig zu regeln. [tv_wonder_organization_competence|E] oder [stability|E] antwortet auf das verdorbene Getreide."
 tv_engineering_department.7108.a:0 "Mischen Sie jede Chaos-Schicht neu, damit sich die Wege der beiden Banden nie wieder kreuzen."
 tv_engineering_department.7108.b:0 "Lassen Sie die Wache ihre Festnahmen auf dem offenen Platz durchführen."
 tv_engineering_department.7109.t:0 "Aufbau: Der Gesandte kommt an einem unbemannten Tor an"
 tv_engineering_department.7109.d:0 "Ein ausländischer Gesandter traf einen ganzen Tag früher ein und stellte fest, dass das Ehrentor unbesetzt war und die Banner noch gefaltet in seiner Brust steckten. Der Dienstplan kann an Ort und Stelle zerrissen werden, um eine angemessene Begrüßung zusammenzukratzen, oder der Gesandte kann genau durch das Gelände geführt werden, wie es ist, und es nach Hause melden, wie er es gesehen hat. [tv_wonder_organization_competence|E] oder [prestige|E] zahlt für die vorzeitige Ankunft."
 tv_engineering_department.7109.a:0 "Zerreißen Sie sofort den Dienstplan, um einen angemessenen Empfang zusammenzukratzen."
 tv_engineering_department.7109.b:0 "Führen Sie den Gesandten genau so durch die Baustelle, wie sie ist."
 tv_engineering_department.7110.t:0 "Bau: Die geliehenen Ochsen sind seit Michaelis überfällig"
 tv_engineering_department.7110.d:0 "Die Ochsengespanne, die vom Anwesen eines benachbarten Gutsbesitzers geliehen wurden, sollten zu Michaelis zurückkommen und schleppen nach Ablauf der Frist immer noch Steine. Die Gespanne können pünktlich nach Hause geschickt und die Transporttrupps neu organisiert werden, um die Lasten von Hand zu ziehen, oder die Ochsen können weitere zwei Wochen behalten werden, während der Verwalter des Lords aufgefordert wird, zu warten. [tv_wonder_organization_competence|E] oder der [estate_satisfaction|E] unter den Adligen trägt die überfälligen Ochsen."
 tv_engineering_department.7110.a:0 "Schicken Sie die Ochsen pünktlich nach Hause und organisieren Sie die Mannschaften neu, um sie von Hand zu schleppen."
 tv_engineering_department.7110.b:0 "Behalten Sie die Ochsen noch vierzehn Tage und sagen Sie dem Verwalter des Herrn, er solle warten."
 tv_engineering_department.7111.t:0 "Aufbau: Die Hämmer übertönen die Reliquienprozession"
 tv_engineering_department.7111.d:0 "Die Maurer hämmerten diese Woche während der Reliquienprozession weiter, und der Gesang war über dem Gelände drei Straßen entfernt nicht zu hören. Der Schichtkalender kann von nun an um jeden Fest- und Prozessionstag herum neu erstellt werden, oder die Prozessionsroute kann einfach verschoben werden und der Klerus teilt mit, dass die Arbeit dafür nicht unterbrochen wird. [tv_wonder_organization_competence|E] oder der [estate_satisfaction|E] unter den Geistlichen sind für den Lärm verantwortlich."
 tv_engineering_department.7111.a:0 "Zeichnen Sie den Schichtkalender an jedem Fest- und Prozessionstag neu."
 tv_engineering_department.7111.b:0 "Verschieben Sie die Prozessionsroute und teilen Sie dem Klerus mit, dass die Arbeit nicht aufhören wird."
 tv_engineering_department.7112.t:0 "Bau: Bauwagen blockieren die Gasse des Getreidemarktes"
 tv_engineering_department.7112.d:0 "Seit sechs Tagen blockiert eine Reihe von Bauwagen die Ladestraße des Getreidemarktes, und die Händlerzunft schickt ihren Angestellten nicht mehr persönlich zur Beschwerde. Der Lieferplan kann auseinandergerissen und auf eine längere Route umgestellt werden, bei der die Fahrspur frei bleibt, oder die Wagen können an Ort und Stelle bleiben, während die Gilde ihre eigenen Geschäfte umleiten muss. [tv_wonder_organization_competence|E] oder der [estate_satisfaction|E] unter den Bürgern zahlt für die gesperrte Fahrspur."
 tv_engineering_department.7112.a:0 "Zerlegen Sie den Lieferplan und bauen Sie ihn auf einer längeren Strecke neu auf."
 tv_engineering_department.7112.b:0 "Lassen Sie die Wagen dort, wo sie stehen, und lassen Sie die Gilde ihre Route umleiten."
 tv_engineering_department.7113.t:0 "Konstruktion: Die Pflanzsaison kommt ohne ihre Hände"
 tv_engineering_department.7113.d:0 "Die Korvee-Truppen, die zur Bepflanzung in ihre Dörfer zurückkehren sollen, schneiden immer noch Steine, und es hat sich herumgesprochen, dass die Felder dieses Jahr ohne sie nicht gesät werden. Die Banden können termingerecht freigelassen werden und die Arbeitsschichten des Standorts können mit den verbleibenden Personen wieder aufgebaut werden, oder die Korvee kann über ihre Amtszeit hinaus festgehalten werden, während die Dörfer ohne Hilfskräfte auskommen. [tv_wonder_organization_competence|E] oder der [estate_satisfaction|E] unter den Bauern zahlt für die unbepflanzten Felder."
 tv_engineering_department.7113.a:0 "Lassen Sie die Korvee-Banden termingerecht frei und bauen Sie die Standortschichten aus den verbliebenen wieder auf."
 tv_engineering_department.7113.b:0 "Halten Sie die Korve über ihre Laufzeit hinaus und lassen Sie die Dörfer auskommen."
 tv_engineering_department.7114.t:0 "Konstruktion: Eine eingestürzte Mauer blickt auf die Pflasterung des Geländes"
 tv_engineering_department.7114.d:0 "Eine Stützmauer gab über Nacht nach, und der nächstgelegene bearbeitete Stein, der zur Hand war, war das Pflaster, das bereits entlang der Zufahrtsstraße des Geländes verlegt war. Die Pflasterung kann dort belassen werden, wo sie liegt, und jede freie Hand kann sich stattdessen anderen Aufgaben widmen, um frischen Stein abzubauen, oder die Straße kann einfach wieder aufgerissen werden, um die Mauer vor dem Morgen auszubessern. [tv_wonder_organization_competence|E] oder [development|E] vor Ort bezahlt die eingestürzte Wand."
 tv_engineering_department.7114.a:0 "Nehmen Sie jede freie Hand von anderen Aufgaben ab, um stattdessen frischen Stein abzubauen."
 tv_engineering_department.7114.b:0 "Reißen Sie die Zufahrtsstraße erneut auf, um die Mauer bis zum Morgen auszubessern."
 tv_engineering_department.7115.t:0 "Konstruktion: Die Brotverkäufer hinterlassen verspätete Löhne"
 tv_engineering_department.7115.d:0 "Die Brotverkäufer des Lagermarktes packten ihre Sachen und machten sich auf den Weg, nachdem der Lohn der letzten Woche mit drei Tagen Verspätung und zur Hälfte in Münzen ausgegeben worden war. Die Löhne können nach einem strengeren und häufigeren Zeitplan angepasst werden, um die Verkäufer wieder anzulocken, wodurch der aktuelle Lohnplan auseinandergerissen wird, oder das Lager kann einfach auf seinen Markt verzichten und die Arbeiter können für ihre eigenen Mahlzeiten aufkommen. [tv_wonder_organization_competence|E] oder [prosperity|E] vor Ort zahlt für den verspäteten Lohn."
 tv_engineering_department.7115.a:0 "Brechen Sie den Gehaltsplan auseinander und gestalten Sie ihn nach einem strengeren Zeitplan neu, um die Verkäufer zurückzulocken."
 tv_engineering_department.7115.b:0 "Lassen Sie das Lager ohne Markt bestehen und überlassen Sie es den Arbeitern, für die Mahlzeiten zu sorgen."
 tv_engineering_department.7116.t:0 "Bau: Das Gerüst der Brücke verschwindet über Nacht"
 tv_engineering_department.7116.d:0 "Das Gerüst, das für die Reparatur der eigenen Brücke in der Hauptstadt bereitstand, wurde über Nacht still und leise auf Baustellenwagen verladen, und als die Brückenmannschaft eintraf, stellte sie fest, dass ihr Bauholz verschwunden war. Die eigenen Versorgungsläufe des Standorts können verlängert und die Schichten stattdessen um eine weiter entfernte Holzquelle herum neu aufgebaut werden, oder die Brücke der Hauptstadt kann einfach warten, bis ihre Balken das Wunder zuerst vollenden. [tv_wonder_organization_competence|E] oder [development|E] in der Hauptstadt zahlt für das fehlende Gerüst."
 tv_engineering_department.7116.a:0 "Verlängern Sie die Versorgungsläufe des Standorts und bauen Sie die Schichten um eine weiter entfernte Holzquelle herum neu auf."
 tv_engineering_department.7116.b:0 "Lassen Sie die Brücke der Hauptstadt warten, während ihre Balken das Wunder zuerst vollenden."
 tv_engineering_department.7117.t:0 "Bau: Die Gildenhalle steht mittags leer"
 tv_engineering_department.7117.d:0 "Die Hälfte der Glaser und Tischler der Hauptstadt waren drei Wochen hintereinander vor Ort, und die Zunfthalle zu Hause steht jetzt mittags größtenteils leer. Die Meister können nach Hause versetzt werden und die Baustellenteams um die verbleibenden Lehrlinge herum neu zusammengestellt werden, oder die Meister können einfach dort bleiben, während die Werkstätten der Hauptstadt noch eine Weile stillstehen. [tv_wonder_organization_competence|E] oder [prosperity|E] in der Hauptstadt zahlt für die leere Gildenhalle."
 tv_engineering_department.7117.a:0 "Versetzen Sie die Meister nach Hause und stellen Sie die Baustellenmannschaften aus den verbleibenden Lehrlingen neu zusammen."
 tv_engineering_department.7117.b:0 "Halten Sie die Meister vor Ort und lassen Sie die Werkstätten der Hauptstadt brachliegen."
 tv_engineering_department.7118.t:0 "Konstruktion: Eine unterbesetzte Plattform verliert ihr Seil"
 tv_engineering_department.7118.d:0 "Ein Hebeseil riss heute Morgen, als sich eine unterbesetzte Mannschaft auf der Plattform zusammendrängte, um die Stunde zu schaffen, und drei Männer stürzten mit ihm in die Tiefe. Die Reservetrupps können von ihren eigenen Aufgaben abgezogen und morgen auf den Bahnsteig geworfen werden, unabhängig davon, was sich auf den Zeitplan auswirkt, oder die gleiche Mannschaft kann unterbesetzt wieder nach oben geschickt werden, sobald die Verletzten abtransportiert sind. [tv_wonder_organization_competence|E] oder der arbeitende [population|E] vor Ort zahlt für das geteilte Seil."
 tv_engineering_department.7118.a:0 "Ziehen Sie die Reservetrupps von ihren eigenen Aufgaben ab und werfen Sie sie auf den Bahnsteig, verdammt noch mal."
 tv_engineering_department.7118.b:0 "Schicken Sie dieselbe unterbesetzte Mannschaft wieder zurück, sobald die Verletzten abtransportiert sind."
 tv_engineering_department.7119.t:0 "Konstruktion: Eine Brücke mit Knicken setzt den Konvoi im Schlamm fest"
 tv_engineering_department.7119.d:0 "Eine Brücke über der Versorgungsstraße gab unter der Last der Steinkarren nach, und der halbe Konvoi sitzt nun gestrandet im Schlamm darunter. Die Fährleute an der Kreuzung sagen, dass sie die Waggons gegen eine Gebühr überfahren werden, und jemand wird es auf die eine oder andere Weise bezahlen."
 tv_engineering_department.7119.a:0 "Lassen Sie die Waggons dort, wo sie stehen, und leiten Sie den Rest um die kaputte Brücke herum, was auch immer es kostet, den [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7119.b:0 "Bezahlen Sie den Preis der Fährleute aus der Staatskasse, um die Wagen heute überzusetzen, was [gold|E] verschlingt."
 tv_engineering_department.7120.t:0 "Bau: Das Mautstellensiegel wird nicht mehr geehrt"
 tv_engineering_department.7120.d:0 "Die Vorreiter des Konvois wurden an der Mautstelle eines Nachbarn zurückgewiesen, ihre Charter trug ein Siegel, das der örtliche Lord nicht mehr ehrt. Jemand muss entscheiden, ob das Tor im Namen der Krone gewaltsam geöffnet werden soll oder ob die Wagen draußen stehen bleiben sollen."
 tv_engineering_department.7120.a:0 "Drehen Sie den Konvoi um und finden Sie eine längere Route um die umstrittene Mautstelle herum, wobei Sie [tv_wonder_logistics_competence|E] entgehen lassen."
 tv_engineering_department.7120.b:0 "Rufen Sie die Autorität der Krone an, um das Tor jetzt zu öffnen, und geben Sie [legitimacy|E] für einen noch nicht beigelegten Streit aus."
 tv_engineering_department.7121.t:0 "Bau: Dorfbewohner blockieren die Straße wegen einer dritten Anforderung"
 tv_engineering_department.7121.d:0 "Die Dorfbewohner haben die Straße mit ihren eigenen Karren blockiert und sich geweigert, sich zu bewegen, bis die dritte Requirierung in dieser Saison abgesagt wird. Der Konvoi kann nicht passieren, ohne entweder einen Rückzieher zu machen oder Soldaten mitzubringen, um den Weg freizumachen."
 tv_engineering_department.7121.a:0 "Gehen Sie zurück, leiten Sie den Konvoi um die Blockade herum und akzeptieren Sie den dadurch verursachten Stillstand in [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7121.b:0 "Schicken Sie Soldaten, um die Straße gewaltsam freizumachen, und berechnen Sie die Kosten in [stability|E]."
 tv_engineering_department.7122.t:0 "Konstruktion: Dem Vorarbeiter werden Pferde vor Zeugen verweigert"
 tv_engineering_department.7122.d:0 "Dem Vorarbeiter des Konvois wurden an einem konkurrierenden Gericht frische Zugpferde verweigert und er wurde vor Zeugen weggeschickt. Jetzt die Pferde zu bekommen bedeutet, Gefälligkeiten einzufordern, die das Gericht beschämen, damit es sich daran hält; Wenn man sie nicht bekommt, müssen die Wagen den Rest des Weges kriechen."
 tv_engineering_department.7122.a:0 "Schicken Sie den Vorarbeiter mit den müden Pferden, die er bereits hat, weiter und lassen Sie die Verzögerung auf [tv_wonder_logistics_competence|E] erkennen."
 tv_engineering_department.7122.b:0 "Bitten Sie öffentlich um Gefälligkeiten, um das gegnerische Gericht zu beschämen und es dazu zu bringen, frische Pferde zu übergeben und dafür [prestige|E] auszugeben."
 tv_engineering_department.7123.t:0 "Bau: Die Carters befehligen die Pferde eines Adelshauses"
 tv_engineering_department.7123.d:0 "Die Fuhrleute des Konvois beschlagnahmten die eigenen Kutschpferde eines Adelshauses, als die Teams des Wunders nicht ausreichten, und der Haushalt fordert sie vor Einbruch der Dunkelheit zurück. Das Zurückbringen der Pferde bringt die Wagen zum Stehen; Wenn man sie behält, wird die Geduld des Haushalts geschwächt."
 tv_engineering_department.7123.a:0 "Bringen Sie die Pferde heute Abend zum Adelshaus zurück und lassen Sie die Wagen ohne sie warten, zum Preis von [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7123.b:0 "Lassen Sie die geliehenen Pferde noch eine Weile im Konvoi arbeiten, was auch immer das für [estate_satisfaction|E] unter den Adligen bedeutet."
 tv_engineering_department.7124.t:0 "Aufbau: Die Wagen rollten an einem Festtag durch"
 tv_engineering_department.7124.d:0 "Die kürzeste Versorgungsstraße führt über das Klostergelände, und an einem Festtag rollten die Wagen durch, bevor irgendjemand auf die Idee kam, um Erlaubnis zu bitten. Die Mönche haben das Tor geschlossen und wollen, dass der Konvoi entweder umgedreht oder verantwortet wird."
 tv_engineering_department.7124.a:0 "Drehen Sie die Wagen um und finden Sie einen anderen Weg um das Klostergelände herum, wobei der Umweg [tv_wonder_logistics_competence|E] kostet."
 tv_engineering_department.7124.b:0 "Schieben Sie den Konvoi wie geplant durch das Tor und lassen Sie die Offensive mit [estate_satisfaction|E] unter den Geistlichen ruhen."
 tv_engineering_department.7125.t:0 "Aufbau: Der Konvoi wartet auf dem Marktplatz auf den Sturm"
 tv_engineering_department.7125.d:0 "Der Konvoi parkte seine Wagen über Nacht auf dem Marktplatz der Stadt, um einen Sturm abzuwarten, und die Standbesitzer konnten seitdem nicht mehr öffnen. Händler fordern die Räumung des Platzes heute, Sturm hin oder her."
 tv_engineering_department.7125.a:0 "Bewegen Sie die Wagen jetzt ins Freie und lassen Sie den Sturm nachlassen [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7125.b:0 "Halten Sie die Wagen noch eine Weile auf dem Platz und lassen Sie die Wut der Händler auf [estate_satisfaction|E] unter den Bürgern fallen."
 tv_engineering_department.7126.t:0 "Aufbau: Dasselbe Dorf verliert ein drittes Mal seine Ochsen"
 tv_engineering_department.7126.d:0 "Die Ochsen und Karren desselben Dorfes wurden diesen Monat dreimal für den Konvoi beschlagnahmt, und die Felder werden ungepflügt. Entweder gehen die Tiere zurück zum Pflug oder die Wagen ziehen sich selbst."
 tv_engineering_department.7126.a:0 "Schicken Sie die Ochsen zurück auf die Felder und lassen Sie den Konvoi ohne sie dahinhumpeln, zum Preis von [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7126.b:0 "Requirieren Sie die Ochsen ein viertes Mal und lassen Sie die Erschöpfung des Dorfes in [estate_satisfaction|E] unter den Bauern sichtbar werden."
 tv_engineering_department.7127.t:0 "Bau: Ein Erdrutsch verschüttet den Weg zur Baustelle"
 tv_engineering_department.7127.d:0 "Ein Erdrutsch hat den letzten Straßenabschnitt auf dem Gelände verschüttet, und die einzige schnelle Lösung besteht darin, die neu angelegten Bereitstellungshöfe zum Aufschütten und Beplanken abzureißen. Entweder gibt der Standort seine eigenen Vorarbeiten auf oder der Konvoi wartet außerhalb der Rutsche."
 tv_engineering_department.7127.a:0 "Lassen Sie die Bereitstellungshöfe intakt und lassen Sie den Konvoi zum Preis von [tv_wonder_logistics_competence|E] außerhalb der Rutsche stehen."
 tv_engineering_department.7127.b:0 "Reißen Sie die neu angelegten Höfe zum Füllen und Beplanken ab, um die Straße freizumachen, und investieren Sie [development|E] auf der Baustelle."
 tv_engineering_department.7128.t:0 "Bau: Die Straße muss über die Arbeiterstände hinaus verbreitert werden"
 tv_engineering_department.7128.d:0 "Für die Wagen muss die Straße an den eigenen Arbeiterständen vorbei verbreitert werden, und die Händler dort haben keinen anderen Ort, an dem sie handeln können. Entweder werden die Stände heruntergefahren, um den Konvoi durchzulassen, oder die Wagen drängen sich im Kriechtempo vorbei."
 tv_engineering_department.7128.a:0 "Lassen Sie die Wagen im Kriechtempo vorbeikriechen und lassen Sie die Stände stehen, zum Preis von [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7128.b:0 "Räumen Sie die Verkaufsstände auf, um die Straße für den Konvoi zu verbreitern, und geben Sie [prosperity|E] vor Ort aus."
 tv_engineering_department.7129.t:0 "Bau: Die Straßen der Hauptstadt werden aufgerissen, um den Konvoi voranzutreiben"
 tv_engineering_department.7129.d:0 "Die Fuhrleute und Kopfsteinpflasterteams der Hauptstadt wurden von ihrer üblichen Arbeit abgezogen, um den festgefahrenen Konvoi die letzte Meile in die Stadt zu schieben. Die Straßen der Hauptstadt sind dafür halb aufgerissen und halb leer, ob die Wagen warten oder nicht."
 tv_engineering_department.7129.a:0 "Schicken Sie die Besatzungen der Hauptstadt an ihre eigene Arbeit zurück und lassen Sie den Konvoi zum Preis von [tv_wonder_logistics_competence|E] vor den Toren stehen."
 tv_engineering_department.7129.b:0 "Halten Sie die Mannschaften der Hauptstadt von der Straße fern, um den Transport der Wagen abzuschließen und [development|E] in der Hauptstadt auszugeben."
 tv_engineering_department.7130.t:0 "Bau: Festgefahrene Fracht besetzt den Marktplatz der Hauptstadt"
 tv_engineering_department.7130.d:0 "Der Konvoi beschlagnahmte den zentralen Marktplatz der Hauptstadt, um die festgefahrene Fracht des Wunders zu lagern, und die Karawanen, die normalerweise dort Handel treiben, wurden eine Woche lang abgewiesen. Entweder wandert die Ladung weiter und der Markt öffnet wieder, oder der Platz bleibt noch eine Weile ein Lagerhaus."
 tv_engineering_department.7130.a:0 "Bewegen Sie die Ladung sofort, wenn auch grob, heraus und nehmen Sie den Druck auf [tv_wonder_logistics_competence|E] auf."
 tv_engineering_department.7130.b:0 "Lassen Sie die Ladung auf dem Platz und halten Sie die Karawanen fern, indem Sie [prosperity|E] in der Hauptstadt ausgeben."
 tv_engineering_department.7131.t:0 "Bauwesen: Anstelle von Ochsen werden Arbeiter an die Seile geschickt"
 tv_engineering_department.7131.d:0 "Da die Zugtiere erschöpft sind und keine neuen zu bekommen sind, haben die Vorarbeiter der Baustelle damit begonnen, Arbeiter an die Seile zu schicken, um die liegengebliebenen Karren von Hand zu schleppen. Entweder schleppen die Männer ihre Erschöpfung weiter, oder die Karren bleiben dort, wo sie stecken geblieben sind."
 tv_engineering_department.7131.a:0 "Lassen Sie die Karren stehen, wo sie sind, anstatt die Männer auf Kosten von [tv_wonder_logistics_competence|E] weiter zu beschäftigen."
 tv_engineering_department.7131.b:0 "Lassen Sie die Arbeiter an den Seilen ziehen, bis sich die Karren bewegen, und verbringen Sie die Arbeitskraft [population|E] auf der Baustelle."
 tv_engineering_department.7132.t:0 "Bau: Die Steinmetze stellen ihre Arbeit ein, unbezahlt"
 tv_engineering_department.7132.d:0 "Die Steinmetze-Innung hat ihre Arbeit eingestellt und ist seit zwei Monaten in Folge unbezahlt. Ihr Vorarbeiter steht mit einem Hauptbuch und geschlossener Faust am Tor, und jemand muss entweder den Hof oder die Schatzkammer öffnen."
 tv_engineering_department.7132.a:0 "Lassen Sie die Messer laufen und lassen Sie den [tv_wonder_construction|E]-Fortschritt warten."
 tv_engineering_department.7132.b:0 "Bezahlen Sie die Rückstände in [gold|E] und halten Sie die Meißel in Bewegung."
 tv_engineering_department.7133.t:0 "Konstruktion: Ein Prätendent zitiert die fehlende Urkunde"
 tv_engineering_department.7133.d:0 "Dem Rat ist bekannt geworden, dass die Maurer des Standorts ohne den üblichen Gerichtsbeschluss ausgebeutet wurden, und ein Prätendent führt dies bereits als Beweis dafür an, dass die Krone nach Lust und Laune regiert. Für die Abkürzung muss sich jemand verantworten – entweder das Werk selbst oder der Auftrag, der es angeordnet hat."
 tv_engineering_department.7133.a:0 "Erinnern Sie sich an die Abgabe und lassen Sie den [tv_wonder_construction|E]-Fortschritt ins Hintertreffen geraten."
 tv_engineering_department.7133.b:0 "Bleiben Sie bei dem Schreiben und lassen Sie es die Krone [legitimacy|E] kosten."
 tv_engineering_department.7134.t:0 "Aufbau: Dorfbewohner blockieren die Karrenstrecke mit ihren Körpern"
 tv_engineering_department.7134.d:0 "Dorfbewohner, deren Gemeindegelände für die Steinbruchstraße eingezäunt war, haben den Karrenweg mit ihren eigenen Körpern blockiert. Entweder kehren die Karren heute Nacht um, oder Soldaten räumen die Straße und die Landschaft erinnert sich daran."
 tv_engineering_department.7134.a:0 "Drehen Sie die Wagen zurück und lassen Sie den Fortschritt von [tv_wonder_construction|E] warten."
 tv_engineering_department.7134.b:0 "Schicken Sie den Wachmann, um die Strecke zu räumen und geben Sie dafür die Kosten von [stability|E] aus."
 tv_engineering_department.7135.t:0 "Bau: Ein Botschafter besichtigt ein halb eingestürztes Gerüst"
 tv_engineering_department.7135.d:0 "Ein ausländischer Botschafter besichtigte das Gelände frühzeitig und fand ein halb eingestürztes Gerüst über grünem Mörtel; Sein Bericht zu Hause wird bereits verfasst. Der Aufseher kann die Arbeit unterbrechen, um sie ordnungsgemäß zu wiederholen, oder den Botschafter aufschreiben lassen, was er gesehen hat."
 tv_engineering_department.7135.a:0 "Zerlegen Sie den fehlerhaften Abschnitt und lassen Sie den [tv_wonder_construction|E]-Fortschritt zurückfallen."
 tv_engineering_department.7135.b:0 "Lassen Sie das Gerüst stehen und lassen Sie den Buchstaben [prestige|E] die Krone kosten."
 tv_engineering_department.7136.t:0 "Bau: Ein Lord entdeckt sein Jagdrevier, das für den Steinbruch vorgesehen ist"
 tv_engineering_department.7136.d:0 "Ein ortsansässiger Fürst entdeckte, dass sein Jagdrevier für den Steinbruch des Wunders vorgesehen war, und ritt wütend vor Gericht und verlangte, dass entweder die Landvermesser sich zurückziehen oder die Ehre seiner Familie aufs Spiel gesetzt werde. Jemand unten muss nachgeben."
 tv_engineering_department.7136.a:0 "Rufen Sie die Gutachter zurück und lassen Sie den [tv_wonder_construction|E]-Fortschritt ins Hintertreffen geraten."
 tv_engineering_department.7136.b:0 "Halten Sie die Beutelinie und lassen Sie es unter den Adligen [estate_satisfaction|E] kosten."
 tv_engineering_department.7137.t:0 "Bau: Die Stiftung lässt einen alten Friedhof wieder aufleben"
 tv_engineering_department.7137.d:0 "Bagger, die das Fundament vorbereiteten, stießen auf einen alten Friedhof der Pfarrei, über den niemand berichtet hatte, und die Priester weigern sich, weitere Arbeiten zu segnen, bis er ordnungsgemäß umgebettet wurde. Jemand muss sich zwischen den Schaufeln und den Sakramenten entscheiden."
 tv_engineering_department.7137.a:0 "Halt the diggers until the reburial rite is finished, and let [tv_wonder_construction|E] progress wait."
 tv_engineering_department.7137.b:0 "Ordnen Sie an, mit den Ausgrabungen fortzufahren, und lassen Sie dafür sorgen, dass die Kosten unter den Geistlichen [estate_satisfaction|E] betragen."
 tv_engineering_department.7138.t:0 "Konstruktion: Mauerwerkskarren verschlingen den Händlerplatz"
 tv_engineering_department.7138.d:0 "Der Händlerplatz ist seit einer Woche halb von gemauerten Karren überschwemmt, und die Gildenmeister sagen, dass eine weitere Woche davon den Herbstmarkt ruinieren wird. Entweder finden die Karren heute Abend eine neue Route, oder die Messe öffnet sich auf einen Bauhof."
 tv_engineering_department.7138.a:0 "Leiten Sie die Wagen um und lassen Sie [tv_wonder_construction|E] langsam voranschreiten."
 tv_engineering_department.7138.b:0 "Halten Sie die Karren auf dem Platz und lassen Sie es unter den Bürgern [estate_satisfaction|E] kosten."
 tv_engineering_department.7139.t:0 "Konstruktion: Die Corvee Crews verpassen die letzte trockene Woche"
 tv_engineering_department.7139.d:0 "Die Korvee-Besatzungen, die für den Vormarsch dieses Monats aus drei Dörfern abgezogen wurden, haben die letzte trockene Woche zur Ernte verpasst, und die Häuptlinge fragen sich, ob ihre Felder oder das Wunder an erster Stelle stehen. Einer der beiden muss geben."
 tv_engineering_department.7139.a:0 "Schicken Sie die Mannschaften zurück auf die Felder und lassen Sie [tv_wonder_construction|E] langsam vorankommen."
 tv_engineering_department.7139.b:0 "Behalten Sie die Besatzungen vor Ort und lassen Sie es unter den Bauern [estate_satisfaction|E] kosten."
 tv_engineering_department.7140.t:0 "Bau: Eine eingestürzte Mauer begräbt die eigenen Werkstätten des Standorts"
 tv_engineering_department.7140.d:0 "Eine Stützmauer gab über Nacht nach und begrub die halbfertigen Werkstätten und Geschäfte, die rund um das Gelände entstanden waren, unter sich. Der ordnungsgemäße Wiederaufbau wird den Standort in jedem Fall etwas kosten – Arbeitskraft, die dem Wunder oder dem, was um es herum steht, entzogen wird."
 tv_engineering_department.7140.a:0 "Ziehen Sie Besatzungen vom Wunder ab, um die Werkstätten zu unterstützen, und lassen Sie den [tv_wonder_construction|E]-Fortschritt zurückfallen."
 tv_engineering_department.7140.b:0 "Lassen Sie die Werkstätten in Schutt und Asche und lassen Sie die Kosten vor Ort auf [development|E] sinken."
 tv_engineering_department.7141.t:0 "Bau: Hausierer werden wegen eines neuen Lagerplatzes vertrieben"
 tv_engineering_department.7141.d:0 "Die Hausierer und kleinen Werkstätten, die entstanden waren, um die Arbeitstrupps zu ernähren, wurden diese Woche vertrieben, um Platz für einen neuen Lagerplatz zu schaffen, und mit ihnen ist auch die geringe Wirtschaftlichkeit des Geländes stillgelegt worden. Der Vorrat oder der standorteigene Handel – einer von beiden behält den Boden."
 tv_engineering_department.7141.a:0 "Geben Sie den Boden den Händlern zurück und lassen Sie den [tv_wonder_construction|E]-Fortschritt auf dem Vorrat warten."
 tv_engineering_department.7141.b:0 "Behalten Sie den Lagerplatz und lassen Sie ihn vor Ort [prosperity|E] kosten."
 tv_engineering_department.7142.t:0 "Bau: Jeder Maurer in der Hauptstadt wird requiriert"
 tv_engineering_department.7142.d:0 "Die Reparaturarbeiten an der Brücke in der Hauptstadt sind ins Stocken geraten, weil jeder Maurer und Karren in der Stadt für den jüngsten Vorstoß des Wunders requiriert wurde. Die Richter wollen ihre Mannschaften zurückhaben, bevor die Spanne versagt; Die Website möchte, dass sie einen Monat länger bleiben."
 tv_engineering_department.7142.a:0 "Lassen Sie die Maurer zurück in die Hauptstadt und lassen Sie [tv_wonder_construction|E] langsam voranschreiten."
 tv_engineering_department.7142.b:0 "Behalten Sie die Maurer vor Ort und lassen Sie es in der Hauptstadt [development|E] kosten."
 tv_engineering_department.7143.t:0 "Bau: Steinkarren sperren zwei Straßen in der Hauptstadt"
 tv_engineering_department.7143.d:0 "Wagenladungen behauener Steine, die durch das Marktviertel der Hauptstadt rollen, haben zwei Straßen eine Woche lang gesperrt, und die dortigen Ladenbesitzer sagen, der Handel verlagere sich bereits woanders hin. Entweder finden die Konvois eine längere Route, oder der Bezirk blutet weiter aus."
 tv_engineering_department.7143.a:0 "Leiten Sie die Konvois auf lange Sicht um und lassen Sie den Fortschritt von [tv_wonder_construction|E] zurückfallen."
 tv_engineering_department.7143.b:0 "Halten Sie die Konvois auf der kurzen Strecke und lassen Sie sie in der Hauptstadt [prosperity|E] kosten."
 tv_engineering_department.7144.t:0 "Bau: Ein Fieber breitet sich im Arbeiterlager aus"
 tv_engineering_department.7144.d:0 "Im Arbeiterlager herrscht Fieber, und die Ärzte sagen, die Kranken müssten sich ausruhen, sonst breitet sich das Fieber auf die gesamte Mannschaft aus. Jemand muss sich entscheiden, ob er sie durcharbeiten und die Arbeit verlieren möchte oder ob er sie zurückweisen und die Arbeiter verlieren möchte."
 tv_engineering_department.7144.a:0 "Halten Sie die Besatzungen zurück, um sich zu erholen, und lassen Sie den Fortschritt von [tv_wonder_construction|E] verstreichen."
 tv_engineering_department.7144.b:0 "Arbeiten Sie die Kranken durch und lassen Sie es die arbeitenden [population|E] vor Ort kosten."
 tv_engineering_department.7145.t:0 "Konstruktion: Eine neue Lücke im Finanzministerium"
 tv_engineering_department.7145.d:0 "Das Wunder zieht Münzen schneller als von den Büchern erwartet. Das Finanzministerium kann den Mangel erklären, aber die Erklärung prägt kein Silber."
 tv_engineering_department.7145.a:0 "Streckt die Hauptbücher, um die Lücke zu schließen."
 tv_engineering_department.7146.t:0 "Konstruktion: Staub auf dem königlichen Siegel"
 tv_engineering_department.7146.d:0 "Die Zustimmung des Königs geht über zu viele Kompromisse. Die Versiegelung hält noch, sieht aber dünner aus."
 tv_engineering_department.7146.a:0 "Lässt das königliche Siegel etwas dünner tragen."
 tv_engineering_department.7147.t:0 "Bau: Ruhige Städte werden gestört"
 tv_engineering_department.7147.d:0 "Der Baurhythmus drängt gegen den Alltag. Die Märkte öffnen spät, die Dörfer murren und die Ordnung gibt ein wenig nach."
 tv_engineering_department.7147.a:0 "Wir lassen die Dörfer murren und machen trotzdem weiter."
 tv_engineering_department.7148.t:0 "Konstruktion: Das Spielfeld verliert an Farbe"
 tv_engineering_department.7148.d:0 "Der Hof verleiht den Werken Farbe und erhält dafür Staub. Prestige verschwindet in kleinen öffentlichen Witzen und halbfertigen Prahlereien."
 tv_engineering_department.7148.a:0 "Tauscht ein wenig Glanz gegen ein paar Gerichtswitze."
 tv_engineering_department.7149.t:0 "Aufbau: Kalte Worte an edlen Tischen"
 tv_engineering_department.7149.d:0 "Adelige Haushalte geben erneut nach. Das Zugeständnis ist formell und kalt, was oft schlimmer ist als eine Ablehnung."
 tv_engineering_department.7149.a:0 "Akzeptiert das kalte, formelle Zugeständnis der Adligen."
 tv_engineering_department.7150.t:0 "Aufbau: Stirnrunzeln vor dem Altar"
 tv_engineering_department.7150.d:0 "Der heilige Kalender beugt sich erneut für die Baustelle. Der Klerus gehorcht, aber der Gehorsam hat seine Grenzen."
 tv_engineering_department.7150.a:0 "Wir akzeptieren den Gehorsam des Klerus, seine Grenzen und alles."
 tv_engineering_department.7151.t:0 "Konstruktion: Dünnere Hauptbücher auf dem Markt"
 tv_engineering_department.7151.d:0 "Das Marktgeschäft konzentriert sich auf das Projekt. Die Bürger können von Größe profitieren, aber nicht, wenn jeder Weg dorthin versperrt ist."
 tv_engineering_department.7151.a:0 "Räumen Sie die Straßen frei und bauen Sie weiter!"
 tv_engineering_department.7152.t:0 "Konstruktion: Schwerere Rücken in den Dörfern"
 tv_engineering_department.7152.d:0 "Die Schultern des ländlichen Raums tragen eine weitere Belastung. Das Projekt schreitet voran und die Geduld des Dorfes lässt nach."
 tv_engineering_department.7152.a:0 "Läuft die zusätzliche Last auf ländliche Schultern."
 tv_engineering_department.7153.t:0 "Bau: Der Standort gibt seine Straßen auf"
 tv_engineering_department.7153.d:0 "Die Seite gibt mehr von ihrer gewöhnlichen Struktur auf. Ein zukünftiges Wunder gewinnt an Platz, während die heutigen Straßen an Nutzung verlieren."
 tv_engineering_department.7153.a:0 "Beschildert diese Straßen für das Wunder von morgen."
 tv_engineering_department.7154.t:0 "Konstruktion: Die Website wird ruhiger"
 tv_engineering_department.7154.d:0 "Der Standort wird kommerziell ruhiger, da sich der normale Austausch auf das Denkmal konzentriert. Der Wohlstand kann nur so oft umgelenkt werden, bevor er abnimmt."
 tv_engineering_department.7154.a:0 "Wir lenken den Handel des Ortes noch einmal auf das Denkmal."
 tv_engineering_department.7155.t:0 "Bauwesen: Kapitalprojekte machen Platz"
 tv_engineering_department.7155.d:0 "Kapitalprojekte machen dem Wunder wieder Platz. Die königliche Stadt bleibt großartig, aber ein Teil ihres Rahmens wird übernommen."
 tv_engineering_department.7155.a:0 "Verleiht dem Wunder den eigenen Rahmen der Hauptstadt."
 tv_engineering_department.7156.t:0 "Bau: Ruhigere Straßen in der Hauptstadt"
 tv_engineering_department.7156.d:0 "Die Märkte der Hauptstadt verlieren etwas an Helligkeit, da das Projekt Kredite und Waren anzieht. Das Gericht könnte es als patriotisch bezeichnen; Händler nennen es langsameren Handel."
 tv_engineering_department.7156.a:0 "Jedes Denkmal leiht sich seinen Glanz von irgendwoher."
 tv_engineering_department.7157.t:0 "Konstruktion: Namen zur Verletzungsliste hinzugefügt"
 tv_engineering_department.7157.d:0 "Den Verletzungslisten werden Namen hinzugefügt. Die Arbeit geht weiter, aber jede neue Markierung verändert die Sichtweise der Arbeiter auf den Stein."
 tv_engineering_department.7157.a:0 "Notieren Sie sich die Namen und machen Sie weiter!"
 tv_engineering_department.7158.t:0 "Aufbau: Stille an der Tür der Schatzkammer"
 tv_engineering_department.7158.d:0 "Eine harte Nachfrage seitens der Seite hinterlässt eine sichtbare Leere in der Staatskasse. Das Denkmal bleibt bestehen, und das Reich zahlt, bevor es etwas bewundern kann."
 tv_engineering_department.7158.a:0 "Entleert die Schatzkammer und lässt den Stein trotzdem steigen."
 tv_engineering_department.7159.t:0 "Konstruktion: Risse vor der Baustelle vorschreiben"
 tv_engineering_department.7159.d:0 "Die Anforderungen der Baustelle zwingen die Krone in eine unwürdige Haltung. Das Versprechen von Größe beruht nun auf beschädigter Autorität."
 tv_engineering_department.7159.a:0 "Wir lassen die Krone biegen, damit die Wände steigen können."
 tv_engineering_department.7160.t:0 "Konstruktion: Bestellen Sie Splinters in the Levy"
 tv_engineering_department.7160.d:0 "Eine schlimmere Störung breitet sich am Zaun vorbei aus. Beamte können die Ursache benennen, aber sie können dem Land nicht durch die Benennung das Gefühl geben, beruhigt zu sein."
 tv_engineering_department.7160.a:0 "Lässt die Unruhe über den Zaun hinaus ihren Lauf nehmen."
 tv_engineering_department.7161.t:0 "Bau: Ehrenfalter in der Öffentlichkeit"
 tv_engineering_department.7161.d:0 "Eine öffentliche Peinlichkeit vor Ort verbreitet sich schneller als jede offizielle Korrektur. Ehre zahlt für einen Stein, der noch nicht steht."
 tv_engineering_department.7161.a:0 "Lass sie reden!"
 tv_engineering_department.7162.t:0 "Konstruktion: Edle Geduld wird durchgemeißelt"
 tv_engineering_department.7162.d:0 "Das Projekt schneidet in edler Geduld ab, bis die Höflichkeit den Ton nicht mehr überdecken kann. Ein Denkmal ist ein armer Gast, wenn es Erbe frisst."
 tv_engineering_department.7162.a:0 "Lässt die Adligen murren, während die Freimaurerei voranschreitet."
 tv_engineering_department.7163.t:0 "Aufbau: In der Sakristei geht die Geduld zur Neige"
 tv_engineering_department.7163.d:0 "Eine Bauforderung trampelt auch in der Nähe des Altars herum. Der Klerus vergisst es nicht, wenn Frömmigkeit als offener Raum behandelt wird."
 tv_engineering_department.7163.a:0 "Wir akzeptieren das kalte Schweigen des Klerus als Preis für Stein."
 tv_engineering_department.7164.t:0 "Konstruktion: Wut erreicht die Straßen"
 tv_engineering_department.7164.d:0 "Die Wut breitet sich in den Ladenfronten aus, während die Baustelle Platz, Zeit und Kredit verschlingt. Die Stadt hört das Denkmal, bevor sie es sieht."
 tv_engineering_department.7164.a:0 "Lässt die Ladenfronten murren, während das Gerüst steigt."
 tv_engineering_department.7165.t:0 "Konstruktion: Der ländliche Zorn bleibt nicht still"
 tv_engineering_department.7165.d:0 "Die Wut auf dem Land wird nach dieser Abgabe nicht still bleiben. Der Schatten des Wunders erreicht Farmen, die vielleicht nie sein vollendetes Gesicht sehen werden."
 tv_engineering_department.7165.a:0 "Lass die Felder es ertragen!"
 tv_engineering_department.7166.t:0 "Konstruktion: Die Website fällt zurück"
 tv_engineering_department.7166.d:0 "Die Arbeiten höhlen das Gelände so stark aus, dass es zurückgeworfen wird. Das Denkmal ist noch nicht errichtet, aber der Platz um es herum hat sich bereits bezahlt gemacht."
 tv_engineering_department.7166.a:0 "Setzt den Standort zurück, damit das Denkmal vorwärts bewegt werden kann."
 tv_engineering_department.7167.t:0 "Bau: Der Wohlstand des Standorts wird erstickt"
 tv_engineering_department.7167.d:0 "Die Baustelle erstickt den lokalen Markt zeitweise. Es kommen immer noch Karren an, aber weniger davon bedienen die Stadt rund um den Stein."
 tv_engineering_department.7167.a:0 "Lässt den lokalen Markt dünner werden, während die Arbeiten weitergehen."
 tv_engineering_department.7168.t:0 "Konstruktion: Das Kapital zahlt sich in Stein aus"
 tv_engineering_department.7168.d:0 "Das Kapital zahlt in Stein, Arbeit und verspäteten Reparaturen. Ein fernes Denkmal wird realer, während Pläne in der Nähe hohl werden."
 tv_engineering_department.7168.a:0 "Wir lassen die eigenen Reparaturen der Hauptstadt auf das ferne Wunder warten."
 tv_engineering_department.7169.t:0 "Bauwesen: Der Handel der königlichen Stadt ist unter Druck"
 tv_engineering_department.7169.d:0 "Der Handel der Königsstadt wird durch die Arbeiten geschwächt. Weit entfernte Größe macht die Straßen, die sie finanzieren müssen, langweilig."
 tv_engineering_department.7169.a:0 "Macht die Straßen der königlichen Stadt langweilig, um andernorts Pracht zu schaffen."
 tv_engineering_department.7170.t:0 "Konstruktion: Schweiß geht in Blut über"
 tv_engineering_department.7170.d:0 "An der Stelle geht der Schweiß ins Blut über. Das Denkmal wird nicht abgesagt, was vielleicht der grausamste Teil der Lektion ist."
 tv_engineering_department.7170.a:0 "Wir machen weiter, obwohl die Seite mit Blut bezahlt hat."
 tv_engineering_department.7171.t:0 "Konstruktion: [tv_great_engineer|E] gewinnt die Straße"
 tv_engineering_department.7171.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] macht aus einer technischen Tour einen öffentlichen Triumph. Das Ergebnis ist eine wesentliche Verbesserung von [tv_wonder_domestic_support|E].\n\n#G . Dieses Ereignis trat auf, weil das aktuelle [tv_great_engineer|E] über eine effektive militärische Fähigkeit von über 80.#! verfügt"
 tv_engineering_department.7171.a:0 "Verwandelt eine Routineinspektion in einen öffentlichen Triumph."
 tv_engineering_department.7172.t:0 "Konstruktion: [tv_great_engineer|E] Zeichnet die Grand Line neu"
 tv_engineering_department.7172.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] zeichnet die Hauptachse mit einer Zuversicht neu, die den größeren Plan glaubwürdig macht. Das Ergebnis ist eine wesentliche Verbesserung von [tv_wonder_scale_competence|E].\n\n#G . Dieses Ereignis trat auf, weil das aktuelle [tv_great_engineer|E] über eine effektive militärische Fähigkeit von über 80.#! verfügt"
 tv_engineering_department.7172.a:0 "Lässt die große Achse unvermeidlich und nicht rücksichtslos aussehen."
 tv_engineering_department.7173.t:0 "Konstruktion: [tv_great_engineer|E] Baut den Zeitplan neu auf"
 tv_engineering_department.7173.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] stellt den Zeitplan so sauber wieder her, dass selbst konkurrierende Vorarbeiter ihn befolgen. Das Ergebnis ist eine wesentliche Verbesserung von [tv_wonder_organization_competence|E].\n\n#G . Dieses Ereignis trat auf, weil das aktuelle [tv_great_engineer|E] über eine effektive militärische Fähigkeit von über 80.#! verfügt"
 tv_engineering_department.7173.a:0 "Wir bleiben hinter dem neuen Zeitplan stehen."
 tv_engineering_department.7174.t:0 "Konstruktion: [tv_great_engineer|E] öffnet die Straße"
 tv_engineering_department.7174.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] eröffnet einen Versorgungsweg, der die alten Verzögerungen fast lächerlich erscheinen lässt. Das Ergebnis ist eine wesentliche Verbesserung von [tv_wonder_logistics_competence|E].\n\n#G . Dieses Ereignis trat auf, weil das aktuelle [tv_great_engineer|E] über eine effektive militärische Fähigkeit von über 80.#! verfügt"
 tv_engineering_department.7174.a:0 "Endlich ist die Straße frei!"
 tv_engineering_department.7175.t:0 "Bau: [tv_great_engineer|E] treibt die Hauptwerke an"
 tv_engineering_department.7175.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] drives the main works through a problem that had stalled lesser hands. The result is a major improvement in [tv_wonder_construction|E] progress.\n\n#G This event occurred because the current [tv_great_engineer|E] has effective military ability above 80.#!"
 tv_engineering_department.7175.a:0 "Fährt die festgefahrenen Arbeiten sauber durch."
 tv_engineering_department.7176.t:0 "Konstruktion: [tv_great_engineer|E] Besänftigt das Gerücht"
 tv_engineering_department.7176.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] beantwortet Gerüchte mit ausreichend klaren Erklärungen, um das Vertrauen der Öffentlichkeit zu stärken. Das Projekt erzielt eine stetige Verbesserung in [tv_wonder_domestic_support|E].\n\n#G . Dieses Ereignis trat auf, weil das aktuelle [tv_great_engineer|E] über eine effektive militärische Fähigkeit von über 50.#! verfügt"
 tv_engineering_department.7176.a:0 "Besänftigt Gerüchte mit Klartext."
 tv_engineering_department.7177.t:0 "Konstruktion: [tv_great_engineer|E] legt das Maß fest"
 tv_engineering_department.7177.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] findet auf der Website genügend Spielraum, um dem Projekt ein zaghaftes Design zu ersparen. Das Projekt erzielt eine stetige Verbesserung in [tv_wonder_scale_competence|E].\n\n#G . Dieses Ereignis trat auf, weil das aktuelle [tv_great_engineer|E] über eine effektive militärische Fähigkeit von über 50.#! verfügt"
 tv_engineering_department.7177.a:0 "Wir geben dem Plan genügend Raum, um mutig zu sein."
 tv_engineering_department.7178.t:0 "Konstruktion: [tv_great_engineer|E] richtet die Rollen gerade aus"
 tv_engineering_department.7178.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] richtet ein hartnäckiges Durcheinander aus Besatzungen, Werkzeugen und Wachen wieder auf. Das Projekt erzielt eine stetige Verbesserung in [tv_wonder_organization_competence|E].\n\n#G . Dieses Ereignis trat auf, weil das aktuelle [tv_great_engineer|E] über eine effektive militärische Fähigkeit von über 50.#! verfügt"
 tv_engineering_department.7178.a:0 "Bringt die Besatzungen, Werkzeuge und Wachen wieder in Ordnung."
 tv_engineering_department.7179.t:0 "Konstruktion: [tv_great_engineer|E] Löscht den Konvoi"
 tv_engineering_department.7179.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] überwindet den schlimmsten Knoten im Konvoiplan. Das Projekt erzielt eine stetige Verbesserung in [tv_wonder_logistics_competence|E].\n\n#G . Dieses Ereignis trat auf, weil das aktuelle [tv_great_engineer|E] über eine effektive militärische Fähigkeit von über 50.#! verfügt"
 tv_engineering_department.7179.a:0 "Beseitigt den schlimmsten Knoten in der Versorgungsleitung."
 tv_engineering_department.7180.t:0 "Konstruktion: [tv_great_engineer|E] Passt in die kritische Verbindung"
 tv_engineering_department.7180.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] passt zum kritischen Teil und lässt die nächste Phase früher beginnen. Das Projekt erzielt eine stetige Verbesserung des [tv_wonder_construction|E]-Fortschritts.\n\n#G Dieses Ereignis trat auf, weil das aktuelle [tv_great_engineer|E] über eine effektive militärische Fähigkeit von über 50 verfügt.#!"
 tv_engineering_department.7180.a:0 "Volle Kraft voraus!"
 tv_engineering_department.7181.t:0 "Konstruktion: [tv_great_engineer|E] wirbt um die Menge"
 tv_engineering_department.7181.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] places the unfinished works before the crowd and trusts the spectacle. The decision may lift [tv_wonder_domestic_support|E] or cost the site dearly.\n\n#Y This event occurred because the current [tv_great_engineer|E] has effective military ability between 20 and 80.#!"
 tv_engineering_department.7181.a:0 "Lässt die Menge über die unvollendeten Steine urteilen."
 tv_engineering_department.7182.t:0 "Konstruktion: [tv_great_engineer|E] erweitert den Plan"
 tv_engineering_department.7182.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] orders the plan enlarged before all doubts have been paid for. The decision may lift [tv_wonder_scale_competence|E] or cost the site dearly.\n\n#Y This event occurred because the current [tv_great_engineer|E] has effective military ability between 20 and 80.#!"
 tv_engineering_department.7182.a:0 "Befiehlt, den Bauplan zu erweitern, bevor die Zweifel ausgeräumt sind."
 tv_engineering_department.7183.t:0 "Konstruktion: [tv_great_engineer|E] schreibt die Schicht neu"
 tv_engineering_department.7183.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] rewrites the shifts in a single afternoon and dares the yard to keep up. The decision may lift [tv_wonder_organization_competence|E] or cost the site dearly.\n\n#Y This event occurred because the current [tv_great_engineer|E] has effective military ability between 20 and 80.#!"
 tv_engineering_department.7183.a:0 "Wir schreiben die Schichten neu und fordern die Werft heraus, mitzuhalten."
 tv_engineering_department.7184.t:0 "Konstruktion: [tv_great_engineer|E] geht den riskanten Weg"
 tv_engineering_department.7184.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] sends the carts by a difficult road and trusts calculation over habit. The decision may lift [tv_wonder_logistics_competence|E] or cost the site dearly.\n\n#Y This event occurred because the current [tv_great_engineer|E] has effective military ability between 20 and 80.#!"
 tv_engineering_department.7184.a:0 "Schickt die Karren auf die härtere Straße und vertraut dabei auf Berechnung statt auf Gewohnheit."
 tv_engineering_department.7185.t:0 "Konstruktion: [tv_great_engineer|E] testet eine schnellere Methode"
 tv_engineering_department.7185.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] testet eine schnellere Methode, bei der ein Fehler sehr öffentlich wäre. Die Entscheidung könnte den Fortschritt von [tv_wonder_construction|E] beeinträchtigen oder den Standort teuer zu stehen kommen.\n\n#Y Dieses Ereignis trat auf, weil das aktuelle [tv_great_engineer|E] über eine effektive militärische Fähigkeit zwischen 20 und 80 verfügt.#!"
 tv_engineering_department.7185.a:0 "Probieren Sie die schnellere Methode aus – lassen Sie sie sich in der Öffentlichkeit beweisen!"
 tv_engineering_department.7186.t:0 "Konstruktion: [tv_great_engineer|E] zählt die Münze falsch"
 tv_engineering_department.7186.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] schätzt die Kosten einer Reparatur falsch ein und überlässt die Kosten dem Finanzministerium. Die Arbeiten gehen weiter, aber [gold|E] leidet unter dem Versehen.\n\n#R Dieses Ereignis trat auf, weil die effektive militärische Fähigkeit des aktuellen [tv_great_engineer|E] unter 50 liegt.#!"
 tv_engineering_department.7186.a:0 "Gleicht den Fehlbetrag stillschweigend aus, bevor das Konto in Frage gestellt wird."
 tv_engineering_department.7187.t:0 "Konstruktion: [tv_great_engineer|E] vergisst das Gericht"
 tv_engineering_department.7187.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] vergisst, dass auch königliche Autorität ein Material ist, und gibt es sorglos aus. Die Arbeiten gehen weiter, aber [legitimacy|E] leidet unter dem Versehen.\n\n#R Dieses Ereignis trat auf, weil die effektive militärische Fähigkeit des aktuellen [tv_great_engineer|E] unter 50 liegt.#!"
 tv_engineering_department.7187.a:0 "Wir zügeln die unvorsichtige Verwendung des Namens der Krone."
 tv_engineering_department.7188.t:0 "Konstruktion: [tv_great_engineer|E] interpretiert die Dörfer falsch"
 tv_engineering_department.7188.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] unterschätzt, wie viel Störung eine saubere technische Antwort verursachen kann. Die Arbeiten gehen weiter, aber [stability|E] leidet unter dem Versehen.\n\n#R Dieses Ereignis trat auf, weil die effektive militärische Fähigkeit des aktuellen [tv_great_engineer|E] unter 50 liegt.#!"
 tv_engineering_department.7188.a:0 "Glättet die Störung, die die aufgeräumte Lösung hinterlassen hat."
 tv_engineering_department.7189.t:0 "Konstruktion: [tv_great_engineer|E] spricht zu früh"
 tv_engineering_department.7189.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] spricht zu selbstbewusst, bevor die Arbeit die Prahlerei unterstützen kann. Die Arbeiten gehen weiter, aber [prestige|E] leidet unter dem Versehen.\n\n#R Dieses Ereignis trat auf, weil die effektive militärische Fähigkeit des aktuellen [tv_great_engineer|E] unter 50 liegt.#!"
 tv_engineering_department.7189.a:0 "Gehen Sie die Prahlerei zurück!"
 tv_engineering_department.7190.t:0 "Konstruktion: [tv_great_engineer|E] Erniedrigt die Adligen"
 tv_engineering_department.7190.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] behandelt die edle Geduld, als wäre sie ein weiterer Vorratsvorrat. Die Arbeiten gehen weiter, aber [estate_satisfaction|E] unter den Adligen leidet unter dem Versehen.\n\n#R Dieses Ereignis trat auf, weil die effektive militärische Fähigkeit des aktuellen [tv_great_engineer|E] unter 50 liegt.#!"
 tv_engineering_department.7190.a:0 "Erinnert den Ingenieur daran, dass edle Geduld kein Vorrat ist, aus dem man schöpfen kann."
 tv_engineering_department.7191.t:0 "Konstruktion: [tv_great_engineer|E] stört den Kalender"
 tv_engineering_department.7191.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] bewegt sich durch den religiösen Kalender, als wäre es ein Liefertisch. Die Arbeiten gehen weiter, aber [estate_satisfaction|E] unter den Geistlichen leidet unter dem Versehen.\n\n#R Dieses Ereignis trat auf, weil die effektive militärische Fähigkeit des aktuellen [tv_great_engineer|E] unter 50 liegt.#!"
 tv_engineering_department.7191.a:0 "Lässt die Altäre doch ihren eigenen Kalender führen."
 tv_engineering_department.7192.t:0 "Konstruktion: [tv_great_engineer|E] blockiert den Markt"
 tv_engineering_department.7192.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] blockiert den normalen Handel und strebt gleichzeitig nach einer saubereren Linie für die Website. Die Arbeiten gehen weiter, aber [estate_satisfaction|E] unter den Bürgern leidet unter dem Versehen.\n\n#R Dieses Ereignis trat auf, weil die effektive militärische Fähigkeit des aktuellen [tv_great_engineer|E] unter 50 liegt.#!"
 tv_engineering_department.7192.a:0 "Wir öffnen die Marktgasse, die das Gelände gesperrt hatte, wieder."
 tv_engineering_department.7193.t:0 "Konstruktion: [tv_great_engineer|E] unterschätzt die Dörfer"
 tv_engineering_department.7193.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] verwechselt erschöpfte Dörfer mit einem ungenutzten Reservat. Die Arbeiten gehen weiter, aber [estate_satisfaction|E] unter den Bauern leidet unter dem Versehen.\n\n#R Dieses Ereignis trat auf, weil die effektive militärische Fähigkeit des aktuellen [tv_great_engineer|E] unter 50 liegt.#!"
 tv_engineering_department.7193.a:0 "Lässt die erschöpften Dörfer ruhen, anstatt erneut herangezogen zu werden."
 tv_engineering_department.7194.t:0 "Konstruktion: [tv_great_engineer|E] schneidet die falschen Wege"
 tv_engineering_department.7194.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] durchbricht die falschen lokalen Vereinbarungen und bezeichnet die Lücke als nützlich. Die Arbeiten gehen weiter, aber [development|E] am Standort leidet unter der Aufsicht.\n\n#R Dieses Ereignis trat auf, weil die effektive militärische Fähigkeit des aktuellen [tv_great_engineer|E] unter 50 liegt.#!"
 tv_engineering_department.7194.a:0 "Patches über den Arrangements, die versehentlich durchgeschnitten wurden."
 tv_engineering_department.7195.t:0 "Bau: [tv_great_engineer|E] Besetzt die Lebensgrundlagen des Standorts"
 tv_engineering_department.7195.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] verdrängt lokale Lebensgrundlagen und schafft gleichzeitig Platz für die Arbeiten. Die Arbeiten gehen weiter, aber [prosperity|E] am Standort leidet unter der Aufsicht.\n\n#R Dieses Ereignis trat auf, weil die effektive militärische Fähigkeit des aktuellen [tv_great_engineer|E] unter 50 liegt.#!"
 tv_engineering_department.7195.a:0 "Wir schaffen wieder Platz für die Lebensgrundlagen, die durch die Rodung verdrängt wurden."
 tv_engineering_department.7196.t:0 "Konstruktion: [tv_great_engineer|E] missbraucht das Kapital"
 tv_engineering_department.7196.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] missbraucht Kapitalressourcen, als hätte die Königsstadt keine eigenen Pläne. Die Arbeiten gehen weiter, aber [development|E] in der Hauptstadt leidet unter der Aufsicht.\n\n#R Dieses Ereignis trat auf, weil die effektive militärische Fähigkeit des aktuellen [tv_great_engineer|E] unter 50 liegt.#!"
 tv_engineering_department.7196.a:0 "Gibt die zweckentfremdeten Ressourcen in die eigenen Pläne der Hauptstadt zurück."
 tv_engineering_department.7197.t:0 "Konstruktion: [tv_great_engineer|E] Stört die königliche Stadt"
 tv_engineering_department.7197.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] stört den Handel der königlichen Stadt und löst gleichzeitig ein lokales technisches Problem. Die Arbeiten gehen weiter, aber [prosperity|E] in der Hauptstadt leidet unter der Aufsicht.\n\n#R Dieses Ereignis trat auf, weil die effektive militärische Fähigkeit des aktuellen [tv_great_engineer|E] unter 50 liegt.#!"
 tv_engineering_department.7197.a:0 "Wir beruhigen den Handel der königlichen Stadt, bevor sich die Störung ausbreitet."
 tv_engineering_department.7198.t:0 "Konstruktion: [tv_great_engineer|E] schätzt das Arbeitslimit falsch ein"
 tv_engineering_department.7198.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] schätzt die Grenze der arbeitenden Körperschaften falsch ein. Die Arbeiten gehen weiter, aber die Arbeiten am Standort [population|E] leiden unter der Aufsicht.\n\n#R Dieses Ereignis ist aufgetreten, weil die effektive militärische Fähigkeit des aktuellen [tv_great_engineer|E] unter 50 liegt.#!"
 tv_engineering_department.7198.a:0 "Erleichtern Sie die Belastung, bevor Sie mehr ausgeben!"
 tv_engineering_department.7199.t:0 "Konstruktion: [tv_great_engineer|E] bricht das Hauptbuch"
 tv_engineering_department.7199.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] lässt einen vermeidbaren Fehler die Konten durchbrechen und mehr Münzen verschwenden, als Stolz entschuldigen kann. Der Fehler reicht nicht aus, um das Wunder zu beenden, das möglicherweise der hässlichste Teil davon ist.\n\n#R Dieses Ereignis trat auf, weil die aktuelle militärische Fähigkeit [tv_great_engineer|E] unter 20 liegt.#!"
 tv_engineering_department.7199.a:0 "Zählt den Verlust zusammen und schließt leise das Hauptbuch."
 tv_engineering_department.7200.t:0 "Konstruktion: [tv_great_engineer|E] Verwundet die Krone"
 tv_engineering_department.7200.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] verwandelt einen vermeidbaren Standortfehler in eine sichtbare Wunde an der Krone. Der Fehler reicht nicht aus, um das Wunder zu beenden, das möglicherweise der hässlichste Teil davon ist.\n\n#R Dieses Ereignis trat auf, weil die aktuelle militärische Fähigkeit [tv_great_engineer|E] unter 20 liegt.#!"
 tv_engineering_department.7200.a:0 "Wir tragen die neue Narbe der Krone und machen weiter."
 tv_engineering_department.7201.t:0 "Konstruktion:[tv_great_engineer|E] verunsichert das Land"
 tv_engineering_department.7201.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] bringt das Land in Unordnung, während er versucht, ein Standortproblem zu lösen. Der Fehler reicht nicht aus, um das Wunder zu beenden, das möglicherweise der hässlichste Teil davon ist.\n\n#R Dieses Ereignis trat auf, weil die aktuelle militärische Fähigkeit [tv_great_engineer|E] unter 20 liegt.#!"
 tv_engineering_department.7201.a:0 "Lässt die Störung sich selbst ausbrennen."
 tv_engineering_department.7202.t:0 "Konstruktion: [tv_great_engineer|E] macht ein Spektakel"
 tv_engineering_department.7202.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] macht den Ort zu einem Spektakel und bringt höfische Ehre mit sich. Der Fehler reicht nicht aus, um das Wunder zu beenden, das möglicherweise der hässlichste Teil davon ist.\n\n#R Dieses Ereignis trat auf, weil die aktuelle militärische Fähigkeit [tv_great_engineer|E] unter 20 liegt.#!"
 tv_engineering_department.7202.a:0 "Lassen Sie das Gericht sein Spektakel haben!"
 tv_engineering_department.7203.t:0 "Konstruktion: [tv_great_engineer|E] Verärgert die Häuser"
 tv_engineering_department.7203.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] verärgert die Häuser, indem es ein Standortproblem durch ihre Privilegien löst. Der Fehler reicht nicht aus, um das Wunder zu beenden, das möglicherweise der hässlichste Teil davon ist.\n\n#R Dieses Ereignis trat auf, weil die aktuelle militärische Fähigkeit [tv_great_engineer|E] unter 20 liegt.#!"
 tv_engineering_department.7203.a:0 "Gibt den guten Willen der Häuser aus, um die Arbeit am Laufen zu halten."
 tv_engineering_department.7204.t:0 "Konstruktion: [tv_great_engineer|E] Beleidigt den Klerus"
 tv_engineering_department.7204.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] beleidigt den Klerus, indem es heilige Geduld für weltlichen Stein bezahlen lässt. Der Fehler reicht nicht aus, um das Wunder zu beenden, das möglicherweise der hässlichste Teil davon ist.\n\n#R Dieses Ereignis trat auf, weil die aktuelle militärische Fähigkeit [tv_great_engineer|E] unter 20 liegt.#!"
 tv_engineering_department.7204.a:0 "Wir überlassen es heiliger Geduld, die Rechnung für weltlichen Stein zu bezahlen."
 tv_engineering_department.7205.t:0 "Konstruktion: [tv_great_engineer|E] Provoziert die Bürger"
 tv_engineering_department.7205.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] provoziert die Bürger, indem es den Handel als loses Gerüst betrachtet. Der Fehler reicht nicht aus, um das Wunder zu beenden, das möglicherweise der hässlichste Teil davon ist.\n\n#R Dieses Ereignis trat auf, weil die aktuelle militärische Fähigkeit [tv_great_engineer|E] unter 20 liegt.#!"
 tv_engineering_department.7205.a:0 "Überlässt es den Händlern, ihr eigenes Gerüst zu reparieren."
 tv_engineering_department.7206.t:0 "Konstruktion: [tv_great_engineer|E] zerstört die Dörfer"
 tv_engineering_department.7206.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] bricht die Geduld des Dorfes mit einer Forderung, die hätte vermieden werden sollen. Der Fehler reicht nicht aus, um das Wunder zu beenden, das möglicherweise der hässlichste Teil davon ist.\n\n#R Dieses Ereignis trat auf, weil die aktuelle militärische Fähigkeit [tv_great_engineer|E] unter 20 liegt.#!"
 tv_engineering_department.7206.a:0 "Wir bitten die Dörfer um Verzeihung für eine Forderung, die wir ihnen hätten ersparen können."
 tv_engineering_department.7207.t:0 "Konstruktion: [tv_great_engineer|E] Verletzt die Site"
 tv_engineering_department.7207.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] schadet der Site, indem es ein technisches Problem mit lokaler Zerstörung löst. Der Fehler reicht nicht aus, um das Wunder zu beenden, das möglicherweise der hässlichste Teil davon ist.\n\n#R Dieses Ereignis trat auf, weil die aktuelle militärische Fähigkeit [tv_great_engineer|E] unter 20 liegt.#!"
 tv_engineering_department.7207.a:0 "Flickt die Wunde, die durch die Reparatur selbst entstanden ist."
 tv_engineering_department.7208.t:0 "Konstruktion: [tv_great_engineer|E] eliminiert die Märkte der Site"
 tv_engineering_department.7208.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] schaltet die Märkte der Website durch eine vermeidbare Entscheidung aus. Der Fehler reicht nicht aus, um das Wunder zu beenden, das möglicherweise der hässlichste Teil davon ist.\n\n#R Dieses Ereignis trat auf, weil die aktuelle militärische Fähigkeit [tv_great_engineer|E] unter 20 liegt.#!"
 tv_engineering_department.7208.a:0 "Sei es so – lasst die Stände schweigen!"
 tv_engineering_department.7209.t:0 "Konstruktion: [tv_great_engineer|E] macht die Pläne der Hauptstadt zunichte"
 tv_engineering_department.7209.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] macht die Pläne der Hauptstadt zunichte, einen Fehler am Standort zu decken. Der Fehler reicht nicht aus, um das Wunder zu beenden, das möglicherweise der hässlichste Teil davon ist.\n\n#R Dieses Ereignis trat auf, weil die aktuelle militärische Fähigkeit [tv_great_engineer|E] unter 20 liegt.#!"
 tv_engineering_department.7209.a:0 "Entlarvt die eigenen Pläne der Hauptstadt, den Fehler der Website zu beheben."
 tv_engineering_department.7210.t:0 "Konstruktion: [tv_great_engineer|E] trübt den Wohlstand der Hauptstadt"
 tv_engineering_department.7210.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] schwächt den Wohlstand des Kapitals durch einen Misserfolg, der niemals auf den Markt hätte gelangen dürfen. Der Fehler reicht nicht aus, um das Wunder zu beenden, das möglicherweise der hässlichste Teil davon ist.\n\n#R Dieses Ereignis trat auf, weil die aktuelle militärische Fähigkeit [tv_great_engineer|E] unter 20 liegt.#!"
 tv_engineering_department.7210.a:0 "Wir beobachten, wie der Glanz der Hauptstadt über einen Misserfolg schwindet, den sie nie hätte erleben dürfen."
 tv_engineering_department.7211.t:0 "Konstruktion: [tv_great_engineer|E] verursacht Verluste"
 tv_engineering_department.7211.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] verursacht Verluste, indem es einen vermeidbaren Fehler durch die Besatzungen passieren lässt. Der Fehler reicht nicht aus, um das Wunder zu beenden, das möglicherweise der hässlichste Teil davon ist.\n\n#R Dieses Ereignis trat auf, weil die aktuelle militärische Fähigkeit [tv_great_engineer|E] unter 20 liegt.#!"
 tv_engineering_department.7211.a:0 "Zählt die Toten, die die Besatzungen niemals hätten verlieren dürfen."
