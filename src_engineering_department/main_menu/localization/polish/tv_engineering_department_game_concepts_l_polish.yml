 TV_ENCYCLOPEDIA_TAB_TITLE: "Dział Inżynierii"
 TV_ENCYCLOPEDIA_FILTER_ALL: "Wszystko"
 TV_ENCYCLOPEDIA_FILTER_ALL_TOOLTIP: "Pokaż każdy wpis Działu Inżynierii."
 TV_ENCYCLOPEDIA_FILTER_MECHANICS: "Mechanika"
 TV_ENCYCLOPEDIA_FILTER_MECHANICS_TOOLTIP: "Pokaż tylko wpisy dotyczące mechaniki Wielkiego Projektu."
 TV_ENCYCLOPEDIA_FILTER_GENERIC: "Ogólne cuda"
 TV_ENCYCLOPEDIA_FILTER_GENERIC_TOOLTIP: "Pokaż tylko ogólne wpisy dotyczące Cudów."
 TV_ENCYCLOPEDIA_FILTER_UNIQUE: "Unikalne cuda"
 TV_ENCYCLOPEDIA_FILTER_UNIQUE_TOOLTIP: "Pokaż tylko unikalne wpisy Cudów."
