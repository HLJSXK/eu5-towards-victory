 tv_engineering_department.7000.t:0 "Budowa: Ulice oklaskują to miejsce"
 tv_engineering_department.7000.d:0 "Kilka widocznych sukcesów na płocie zamienia ciekawość w dumę. Starsi gildii nadają nazwiska, sąsiedzi przestają traktować dzieła jako królewską próżność, a projekt zyskuje ostrzejsze pretensje do [tv_wonder_domestic_support|E]."
 tv_engineering_department.7000.a:0 "Niech nowa dobra wola starszych gildii poprowadzi dzieło do przodu."
 tv_engineering_department.7001.t:0 "Konstrukcja: Szersza linia na Ziemi"
 tv_engineering_department.7001.d:0 "Nowe pomiary ujawniają, że grunt może wytrzymać szerszy ślad. To, co wyglądało jak ambicja na pergaminie, ma teraz znośne podstawy, a [tv_wonder_scale_competence|E] skacze do przodu."
 tv_engineering_department.7001.a:0 "Roszczenie do szerszego zakresu, które właśnie wykazało badanie."
 tv_engineering_department.7002.t:0 "Konstrukcja: Nazwy i zamówienia układają się w całość"
 tv_engineering_department.7002.d:0 "Podwórko budzi się pod nowymi dyżurami. Załoga wie, gdzie się ustawić, urzędnicy wiedzą, co jest istotne, a [tv_wonder_organization_competence|E] rośnie, ponieważ zamieszanie ma mniej miejsc do ukrycia."
 tv_engineering_department.7002.a:0 "Zablokujemy nowe składy, zanim zamieszanie powróci."
 tv_engineering_department.7003.t:0 "Konstrukcja: Drogi i wózki odnajdują swój rytm"
 tv_engineering_department.7003.d:0 "Lepsza trasa łączy drogę, wodę, skład i rusztowanie. Pierwszy konwój, który z niego skorzysta, przybywa niemal zawstydzająco na czas, a [tv_wonder_logistics_competence|E] rośnie."
 tv_engineering_department.7003.a:0 "Niech te wózki jeżdżą na czas!"
 tv_engineering_department.7004.t:0 "Konstrukcja: Kamień wznosi się poza znak"
 tv_engineering_department.7004.d:0 "Część aktywna przekracza swój znak, zanim światło przestanie działać. Żaden pojedynczy cud tego nie wyjaśnia; podnośniki, stawy i dłonie po prostu spotykają się o właściwej porze, przyspieszając postęp [tv_wonder_construction|E]."
 tv_engineering_department.7004.a:0 "Pozwala windom kontynuować jazdę poza znak."
 tv_engineering_department.7005.t:0 "Budowa: Rozmowy uliczne zakręcają"
 tv_engineering_department.7005.d:0 "Hałas wokół obiektu ucichnie. Nie jest to uznanie, ale wystarczające pozwolenie, aby przejechały wozy i kłótnie zakończyły się wcześniej; [tv_wonder_domestic_support|E] wzrasta o użyteczny margines."
 tv_engineering_department.7005.a:0 "Przepuszcza wózki i kłótnie ucichają."
 tv_engineering_department.7006.t:0 "Konstrukcja: Miara została poprawiona"
 tv_engineering_department.7006.d:0 "Przerysowano ciasny kąt, poszerzono ścieżkę usługową, a główna linia pomnika znów oddycha. Ulepszenie [tv_wonder_scale_competence|E] jest niewielkie, ale realne."
 tv_engineering_department.7006.a:0 "Poszerza ścieżkę i pozwala projektowi oddychać."
 tv_engineering_department.7007.t:0 "Konstrukcja: Ogród uczy się swojego rytmu"
 tv_engineering_department.7007.d:0 "Naprawiono zestaw brakujących przekazań. Praca jest zbyt sucha na ceremonię, ale utrzymuje narzędzia w ruchu i ulepsza [tv_wonder_organization_competence|E]."
 tv_engineering_department.7007.a:0 "Łatamy przekazanie i utrzymujemy narzędzia w ruchu."
 tv_engineering_department.7008.t:0 "Konstrukcja: Koleny Znajdź lepszą drogę"
 tv_engineering_department.7008.d:0 "Naprawiono jeden zły skręt w linii zasilającej. Mniej wózków czeka pustych, mniej ładunków dociera popękanych, a [tv_wonder_logistics_competence|E] poprawia się."
 tv_engineering_department.7008.a:0 "Prostuje zły zakręt, zanim pęknie więcej ładunków."
 tv_engineering_department.7009.t:0 "Budowa: Młoty zbliżają się do końca"
 tv_engineering_department.7009.d:0 "Uparty joint w końcu pasuje i następna załoga może ruszyć bez kolejnego miesiąca czekania. Postęp [tv_wonder_construction|E] postępuje w najbardziej satysfakcjonujący sposób: w sposób widoczny."
 tv_engineering_department.7009.a:0 "Wreszcie pasuje!"
 tv_engineering_department.7010.t:0 "Budowa: Chleb Pieniądze u Bramy"
 tv_engineering_department.7010.d:0 "Tłum gromadzi się u bramy i mamrocze, że cud je chleb przeznaczony dla biednych. Jeśli skarbiec otworzy swój [gold|E] na pełnym widoku ulicy i wypłaci teraz, narzekanie ucichnie, a [tv_wonder_domestic_support|E] wzrośnie – ale moneta nie wróci."
 tv_engineering_department.7010.a:0 "Wypłać je na oczach tłumu."
 tv_engineering_department.7010.b:0 "Księgi są wystarczająco cienkie i nie wymagają publicznych ulotek."
 tv_engineering_department.7011.t:0 "Konstrukcja: Kaznodzieja kwestionuje prawa korony"
 tv_engineering_department.7011.d:0 "Miejscowy kaznodzieja mówi swojej trzódce, że cud opiera się na dumie, a nie na jakimkolwiek prawie, którego korona się domaga. Postawienie królewskiego [legitimacy|E] na pisemnym dekrecie rozwiązałoby sprawę i ustabilizowało [tv_wonder_domestic_support|E], zanim kazanie rozprzestrzeni się dalej."
 tv_engineering_department.7011.a:0 "Zapieczętuj dekret i pozwól, aby słowo korony zamknęło sprawę."
 tv_engineering_department.7011.b:0 "Dekret królewski w związku z narzekaniem jednego kaznodziei wygląda na słabość, a nie siłę."
 tv_engineering_department.7012.t:0 "Budowa: Droga do kamieniołomu dzieli wspólne pole"
 tv_engineering_department.7012.d:0 "Nowa droga do kamieniołomu biegnie prosto przez wspólne pola dwóch wiosek. Wydanie [stability|E] na wymuszenie przesiedlenia oczyściłoby drogę i zniosło [tv_wonder_domestic_support|E] wśród tych, którzy chcą, aby cud został ukończony – kosztem pokoju zakupionego z tymi wioskami."
 tv_engineering_department.7012.a:0 "Zamów przesiedlenie i pozwól, aby droga przeszła."
 tv_engineering_department.7012.b:0 "Pola dwóch wsi nie są warte krótszej trasy wozów."
 tv_engineering_department.7013.t:0 "Konstrukcja: Zagraniczni wysłannicy kpią z projektu próżności"
 tv_engineering_department.7013.d:0 "Wysłannicy konkurencyjnego dworu nazywają ten cud próżnym projektem zbyt dużym dla stojącego za nim skarbu. Wydanie [prestige|E] na wystawne przyjęcie może zmienić historię, którą niosą do domu i podnieść [tv_wonder_domestic_support|E] – ale pozycji korony, raz wydanej na schlebianie gościom, nie da się łatwo przywrócić."
 tv_engineering_department.7013.a:0 "Wydaj na przyjęcie i zmień to, co wysłannicy przynoszą do domu."
 tv_engineering_department.7013.b:0 "Nie warto tracić pozycji korony na zagraniczne plotki."
 tv_engineering_department.7014.t:0 "Budowa: Wybieg myśliwski szlachcica staje się składem drewna"
 tv_engineering_department.7014.d:0 "Murarze cudu chcą odcinka szlacheckiego polowania, w którym mogliby wystawiać drewno. Udzieli go, ale tylko za przysługę, korona musi liczyć się z [estate_satisfaction|E] wśród szlachty - wydana teraz, nadal będzie podnosić [tv_wonder_domestic_support|E], gdy drewno zacznie się poruszać."
 tv_engineering_department.7014.a:0 "Wyświadcz przysługę i zajmij drewno."
 tv_engineering_department.7014.b:0 "Dobra wola jednego szlachcica nie jest warta długu."
 tv_engineering_department.7015.t:0 "Konstrukcja: Dzwon parafialny jest proszony o brąz"
 tv_engineering_department.7015.d:0 "Założyciele cudu chcą zarekwirować dzwon parafialny w celu przerobienia go na okucia. Ksiądz odwróci wzrok od pustej dzwonnicy, ale wśród duchowieństwa będzie to kosztować [estate_satisfaction|E] – cena, która i tak sprawi, że [tv_wonder_domestic_support|E] będzie w lepszym stanie niż niedokończone rusztowanie."
 tv_engineering_department.7015.a:0 "Zapytaj właściwie, a dzwon niech pojedzie do odlewni."
 tv_engineering_department.7015.b:0 "Pusta dzwonnica wywoła więcej rozmów niż warte jest wyposażenie."
 tv_engineering_department.7016.t:0 "Konstrukcja: Wózki z zaopatrzeniem dławią rynek"
 tv_engineering_department.7016.d:0 "Wozy z zaopatrzeniem cudu blokują rynek w dni dostaw. Mistrzowie gildii przekierują swoje własne stragany wokół wozów, ale to przyciągnie [estate_satisfaction|E] wśród mieszczan – koszt, który i tak odkupi trochę [tv_wonder_domestic_support|E], gdy plac przestanie walczyć z wozami."
 tv_engineering_department.7016.a:0 "Zapytaj bezpośrednio gildię i przepuść wózki."
 tv_engineering_department.7016.b:0 "Nałożenie kary na woźniców jest prostsze niż proszenie gildii o przysługę."
 tv_engineering_department.7017.t:0 "Budowa: Corvee jest trzymany po żniwach"
 tv_engineering_department.7017.d:0 "Nadzorca chce, aby gangi pańszczyźniane przetrzymywane po żniwach ukończyły fundamenty przed przymrozkami. Starsi wioski zgodzą się, ale wśród chłopów będzie to kosztować [estate_satisfaction|E] – wydane teraz nadal pozostawią [tv_wonder_domestic_support|E] wyższe niż fundament pozostawiony w połowie wykopany przez zimę."
 tv_engineering_department.7017.a:0 "Powiedz to wyraźnie i powstrzymaj gangi przed żniwami."
 tv_engineering_department.7017.b:0 "Żniwa nie mogą czekać na fundamenty."
 tv_engineering_department.7018.t:0 "Budowa: Na przeszkodzie stoi rząd kamienic"
 tv_engineering_department.7018.d:0 "Murarze twierdzą, że teren jest zbyt ciasny, aby wznieść następny poziom bez zrównania z ziemią sąsiadującej z nim kamienicy. Zamówienie go od razu spowodowałoby pobranie [development|E] na miejscu w miarę rozpadu budynków, ale umożliwiłoby prace – a wraz z nimi [tv_wonder_domestic_support|E] – ponowne posunięcie się do przodu."
 tv_engineering_department.7018.a:0 "Zamów rząd zrównany z ziemią i poszerz witrynę."
 tv_engineering_department.7018.b:0 "Łatwiej jest żyć w ciasnym miejscu niż na ulicy eksmitowanych lokatorów."
 tv_engineering_department.7019.t:0 "Konstrukcja: Zwykłe zakręty handlowe na budowie"
 tv_engineering_department.7019.d:0 "Lokalni woźnicy i kamieniarze zostali odsunięci od swojego zwykłego zawodu, aby zapewnić zaopatrzenie terenu. Kontynuowanie tego spowodowałoby utratę [prosperity|E] na miejscu w miarę wyczerpywania się zwykłej działalności biznesowej - ale stabilniejsze dostawy nadal byłyby postrzegane jako warte posiadania [tv_wonder_domestic_support|E]."
 tv_engineering_department.7019.a:0 "Niech lokalny handel pochyli się w stronę robót."
 tv_engineering_department.7019.b:0 "Miasto bardziej potrzebuje zwykłego handlu niż miejsce szybszych dostaw."
 tv_engineering_department.7020.t:0 "Budowa: Most stolicy czeka na masonów"
 tv_engineering_department.7020.d:0 "Remont mostu w stolicy utknął w martwym punkcie, ponieważ na cud wciągnięto ich murarzy. Utrzymanie ich tam kosztowałoby [development|E] w stolicy, ponieważ most pozostaje niedokończony, ale umożliwiłoby utrzymanie postępu cudu – i [tv_wonder_domestic_support|E] – w ruchu."
 tv_engineering_department.7020.a:0 "Niech murarze pracują nad cudem i niech most poczeka."
 tv_engineering_department.7020.b:0 "Most stolicy nie może czekać na harmonogram cudu."
 tv_engineering_department.7021.t:0 "Budownictwo: Agenci skupują drewno ze stolicy"
 tv_engineering_department.7021.d:0 "Agenci cudu skupują drewno i kamień po cenach, których zwykły rynek nie jest w stanie dorównać. Kontynuowanie zakupów spowodowałoby wyczerpanie zapasów [prosperity|E] w stolicy w związku z osłabieniem handlu w całym zakładzie, ale spowodowałoby zatrzymanie dostaw i [tv_wonder_domestic_support|E] wraz z nimi."
 tv_engineering_department.7021.a:0 "Pozwól zakupom kontynuować i zasilaj witrynę."
 tv_engineering_department.7021.b:0 "Nie należy wykrwawiać rynków własnych stolicy dla jednego projektu."
 tv_engineering_department.7022.t:0 "Konstrukcja: Proponowana jest podwójna zmiana nocna"
 tv_engineering_department.7022.d:0 "Nadzorca chce podwoić nocną zmianę, aby nadrobić dni utracone po ostatnich przymrozkach. Zamawianie go spowodowałoby zmęczenie [population|E] na miejscu, ponieważ dodatkowe godziny zbierałyby żniwo, ale popchnęłoby pracę do przodu i podniosłoby [tv_wonder_domestic_support|E] wraz z nią."
 tv_engineering_department.7022.a:0 "Podwój zmiany i popychaj pracę do przodu."
 tv_engineering_department.7022.b:0 "Zmęczeni robotnicy budują wolniej niż wypoczęci."
 tv_engineering_department.7023.t:0 "Konstrukcja: Szersza podstawa na biurku skarbnika"
 tv_engineering_department.7023.d:0 "Główny murarz kładzie na biurku skarbnika szerszy plan fundamentów, twierdząc, że ziemia go udźwignie, jeśli przed jesiennymi deszczami zostaną uruchomione dodatkowe kursy. Skarbnik może zwolnić złoto za dodany kamień i ręce już teraz, w przeciwnym razie plan może poczekać do przyszłorocznej ankiety."
 tv_engineering_department.7023.a:0 "Uwolnij złoto i pozwól murarzom położyć szerszą podstawę przed deszczami."
 tv_engineering_department.7023.b:0 "Przytrzymaj monetę; deszcze będą nadal występować następnej wiosny."
 tv_engineering_department.7024.t:0 "Konstrukcja: Stawki badawcze zatrzymują się na płocie"
 tv_engineering_department.7024.d:0 "Palki geodety zatrzymują się na linii ogrodzenia sąsiada, a sąsiad nie pozwala im przejść. Nakaz królewski ustaliłby dziś tę granicę, ale powołanie się na imię korony w sprawie spornego żywopłotu nie pozostanie niezauważone."
 tv_engineering_department.7024.a:0 "Wyślij nakaz i umieść imię korony za szerszą granicą."
 tv_engineering_department.7024.b:0 "Niech płot stanie; imię korony nie jest wydawane na spór o zabezpieczenie."
 tv_engineering_department.7025.t:0 "Konstrukcja: Szerszy plan przecina to, co wspólne"
 tv_engineering_department.7025.d:0 "Szerszy plan biegnie prosto przez pastwisko wioski. Przesunięcie kamieni granicznych przez wioskę rozstrzygnęłoby teraz kwestię ankiety, ale gospodarstwa domowe nie zapomną, kto je przesunął."
 tv_engineering_department.7025.a:0 "Przesuń kamienie i pozwól, aby badanie osiedliło się na większym obszarze."
 tv_engineering_department.7025.b:0 "Pozostaw to, co wspólne, takim jakie jest; urażona wioska nie jest warta szerszej bazy."
 tv_engineering_department.7026.t:0 "Konstrukcja: Cena zagranicznego masona za jego pieczęć"
 tv_engineering_department.7026.d:0 "Zagraniczny mistrz murarski oferuje poświadczenie szerszego projektu, ale tylko wtedy, gdy nazwisko dworu zostanie wymienione jako jego patron w aktach jego własnego cechu w kraju. Potwierdzenie rozwiązałoby tutaj kwestię rozmiaru; prośba jest publiczna i nie można jej nie wykorzystać."
 tv_engineering_department.7026.a:0 "Udziel poparcia i uwierz mistrzowi na słowo w sprawie szerszego śladu."
 tv_engineering_department.7026.b:0 "Zataić nazwę sądu; księga obcej gildii nie jest miejscem na jej wydawanie."
 tv_engineering_department.7027.t:0 "Konstrukcja: Plan fundamentów przecina Polowanie na Barona"
 tv_engineering_department.7027.d:0 "Szerszy plan stóp przecina teren, którego miejscowy baron od dawna używał do swoich polowań. Poproszenie go, aby ugryzł się w język, gdy geodeci skończą, byłoby dowodem na dźwięk na większą skalę, ale szlachetna cierpliwość okazana tutaj to cierpliwość, której będzie oczekiwać w zamian."
 tv_engineering_department.7027.a:0 "Poproś barona o cierpliwość i pozwól geodetom zakończyć jego tereny łowieckie."
 tv_engineering_department.7027.b:0 "Trasa wokół posiadłości barona; jego dobrej woli nie warto wydawać na ankietę."
 tv_engineering_department.7028.t:0 "Konstrukcja: Plan zakłada kącik świętej ziemi"
 tv_engineering_department.7028.d:0 "Szerszy plan wymaga wydzielenia rogu poświęconej ziemi, którą parafia zajmowała od niepamiętnych czasów. Kapłani pozwoliliby na dokonanie przeglądu, gdyby zostali o to odpowiednio poproszeni, ale proszenie duchownych o ustąpienie poświęconej ziemi pod rusztowanie jest przysługą wydaną, a nie pożyczoną."
 tv_engineering_department.7028.a:0 "Poproś kapłanów, aby ustąpili z rogu i potwierdzili szersze badanie."
 tv_engineering_department.7028.b:0 "Trzymaj ankietę wewnątrz starej granicy; poświęcona ziemia nie jest miejscem do testowania."
 tv_engineering_department.7029.t:0 "Budowa: Poszukiwany jest pas handlarzy wełną"
 tv_engineering_department.7029.d:0 "Szerszy ślad pochłonąłby ulicę, którą handlarze wełną korzystają w dni targowe. Radni cechowi zgodziliby się na objazd, gdyby zostali o to poproszeni, ale mieszczanie użyczający swoje ulice pod budowę pamiętają tę niedogodność dłużej niż ankieta."
 tv_engineering_department.7029.a:0 "Poproś radnych o objazd i potwierdź szerszy ślad na pasie."
 tv_engineering_department.7029.b:0 "Zostaw ulicę kupiecką w spokoju; dobrej woli rynku nie marnuje się na rusztowanie."
 tv_engineering_department.7030.t:0 "Budowa: Wioska jest proszona o kopanie"
 tv_engineering_department.7030.d:0 "Brygadzista twierdzi, że szersze podstawy można udowodnić w ciągu tygodnia, jeśli pobliska wioska zaangażuje się w kopanie, zamiast zajmować się własnymi polami. Wieś odpowiadała przed wójtem, ale jesienią nie zapomniano o dacie pobieranej w okresie sadzenia."
 tv_engineering_department.7030.a:0 "Zadzwoń do opłaty wiejskiej i wykop szerszą podstawę przed końcem tygodnia."
 tv_engineering_department.7030.b:0 "Niech wioska trzyma się swoich pól; Zamiast tego brygadzista może poczekać na najemników."
 tv_engineering_department.7031.t:0 "Konstrukcja: W śladzie stoi rząd warsztatów"
 tv_engineering_department.7031.d:0 "Jedynym sposobem na wyrównanie szerszego zasięgu jest rozbiórka rzędu warsztatów już stojących na skraju terenu. Ich kamień i fundamenty wpisują się bezpośrednio w nowy plan, ale zburzenie tego, co już zbudowano, nie jest czymś cofniętym."
 tv_engineering_department.7031.a:0 "Rozciągnij rząd i złóż jego kamień w szerszy ślad."
 tv_engineering_department.7031.b:0 "Pozostaw warsztaty stojące; witryna może rozwijać się w innym kierunku."
 tv_engineering_department.7032.t:0 "Budownictwo: Sprzedawcy drewna proszeni są o wybranie kupującego"
 tv_engineering_department.7032.d:0 "Handlarze drewnem w tym miejscu mają zapasy i wozy, które mogą dziś przewieźć na potrzeby szerszego grona odbiorców, jeśli zamiast tego ich zwykły handel zostanie zarezerwowany na kontrakty koronne. Rynki w tym miejscu poddałyby się pracom, ale szlak handlowy nastawiony na jednego kupującego sam się nie cofnie."
 tv_engineering_department.7032.a:0 "Zaangażuj lokalny handel do robót i zaciągnij wypełnienie, aby uzyskać szerszy ślad."
 tv_engineering_department.7032.b:0 "Zostaw kupców ich zwykłemu zajęciu; wypełnienie można pozyskać w inny sposób."
 tv_engineering_department.7033.t:0 "Budowa: Naprawiacze dróg w stolicy są poszukiwani gdzie indziej"
 tv_engineering_department.7033.d:0 "Naprawcy dróg i murarze stołeczni to jedyne ekipy, które mogą w tym miesiącu przeprowadzić badanie potwierdzające. Wyciągnięcie ich z własnych napraw stolicy rozwiązałoby szerszą kwestię zasięgu, ale ulice stolicy ukażą lukę, którą pozostawiły."
 tv_engineering_department.7033.a:0 "Przydziel ponownie załogi stolicy i pozwól im potwierdzić szerszy zasięg."
 tv_engineering_department.7033.b:0 "Zostawcie naprawy stolicy; ankieta może poczekać na bezczynne ręce gdzie indziej."
 tv_engineering_department.7034.t:0 "Budowa: Ratusze oferują dochody z tego sezonu"
 tv_engineering_department.7034.d:0 "Ratusze gildii stolicy oferują poręczenie ankiety potwierdzającej wpływy handlowe w tym sezonie, pod warunkiem, że moneta zostanie wylosowana przed zamknięciem ksiąg zimowych jarmarków. Rynki stolicy udowodniłyby szerszy zasięg, ale zyski z sezonu zwróciły się w stronę jednego cudu, to sezon, za który ratule gildii będą chciały odpowiedzieć."
 tv_engineering_department.7034.a:0 "Skorzystaj z wpływów handlowych stolicy i potwierdź szerszy zasięg przed zamknięciem targów."
 tv_engineering_department.7034.b:0 "Zostaw księgi gildii w spokoju; zamiast tego ankieta może poczekać do skarbca."
 tv_engineering_department.7035.t:0 "Budowa: Załogi proszone są o dni odpoczynku"
 tv_engineering_department.7035.d:0 "Brygadzista twierdzi, że szersze możliwości można będzie wykazać w tym miesiącu, jeśli załogi już na miejscu przepracują dni wolne, zamiast odpoczywać między zmianami. Badanie rozstrzygnęłoby szerszy projekt, ale nie wszyscy robotnicy, którzy przekroczyli swoje zwykłe tempo, pozostają robotnikami na długo."
 tv_engineering_department.7035.a:0 "Przeprowadź załogę przez dni odpoczynku i w tym miesiącu zajmij się szerszą sytuacją."
 tv_engineering_department.7035.b:0 "Niech załogi zachowają dni odpoczynku; badanie może poczekać na wolniejsze tempo."
 tv_engineering_department.7036.t:0 "Budowa: Poszukiwany urzędnik do tablic zmianowych"
 tv_engineering_department.7036.d:0 "Kierownik budowy potrzebuje odpowiedniego urzędnika, który przerysuje tablice zmianowe i powiesi je w miejscu, w którym załoga będzie mogła je przeczytać. Skarbiec może dostarczyć człowieka i jego atrament za odpowiednią opłatą, a [tv_wonder_organization_competence|E] będzie zgodny z nowymi tablicami."
 tv_engineering_department.7036.a:0 "Zatrudniamy urzędnika i dzisiaj wywieszamy nowe tablice."
 tv_engineering_department.7036.b:0 "Stare deski wytrzymały tak długo; mogą wytrzymać trochę dłużej."
 tv_engineering_department.7037.t:0 "Budowa: Dwóch brygadzistów odmawia sobie nawzajem poleceń"
 tv_engineering_department.7037.d:0 "Dwie załogi gildii na miejscu odmawiają wzajemnego wykonywania poleceń swoich brygadzistów, a kłótnia dwukrotnie w tym tygodniu utknęła w martwym punkcie porannej zmiany. Jedynie nakaz zawierający [legitimacy|E] korony ustaliłby pierwszeństwo między nimi, a [tv_wonder_organization_competence|E] nastąpiłby po zakończeniu sporu."
 tv_engineering_department.7037.a:0 "Nakaz jest sporządzony i opieczętowany; załogi odpowiadają na to lub nie odpowiadają nikomu."
 tv_engineering_department.7037.b:0 "Słowo korony nie ogranicza się do rozstrzygania, który murarz przeklina głośniej."
 tv_engineering_department.7038.t:0 "Konstrukcja: Stara Rota zapomniała o żniwach"
 tv_engineering_department.7038.d:0 "Poborowi do pracy na wsi pracowali według starego harmonogramu, który nigdy nie uwzględniał żniw, a połowa załóg odchodziła, gdy ich pola były potrzebne. Narzucanie rotacji ze względu na lokalne sprzeciwy spowodowałoby zmniejszenie krajowego [stability|E], ale załogi w końcu trzymałyby się ustalonych godzin, a [tv_wonder_organization_competence|E] podążyłoby za nimi."
 tv_engineering_department.7038.a:0 "Przepychamy rotację; żniwa mogą choć raz poczekać na cud."
 tv_engineering_department.7038.b:0 "Narzucanie problemu teraz powoduje wymianę tylko jednego niedoboru na gorszy."
 tv_engineering_department.7039.t:0 "Konstrukcja: Masoni nie będą odpowiadać przed nowym nadzorcą"
 tv_engineering_department.7039.d:0 "Mistrzowie murarze nie odpowiadają młodemu nadzorcy wysłanemu w celu reorganizacji ich zmian i mówią to w zasięgu słuchu całego podwórza. Tylko nazwa poparta [prestige|E] sądu ma wystarczającą wagę, aby pasowały, a [tv_wonder_organization_competence|E] będzie śledzić ich zgodność."
 tv_engineering_department.7039.a:0 "Pożyczamy nadzorcy imię dworu; murarze odpowiadają na to pytanie, jeśli nie na nic innego."
 tv_engineering_department.7039.b:0 "Na władzę młodego nadzorcy należy zdobywać na podwórzu, a nie pożyczać ją z pałacu."
 tv_engineering_department.7040.t:0 "Konstrukcja: Sąsiadujący Pan ofiarowuje swego zarządcę"
 tv_engineering_department.7040.d:0 "Sąsiedni pan proponuje, że pożyczy swojemu zarządcy domu, aby sporządził nowe składy załogi, człowieka, który od dwudziestu lat kieruje jedną zmianą w dworku. Udzielenie przysługi wiąże się z kosztami [estate_satisfaction|E] wśród szlachty, ale lista zarządców przyniosłaby [tv_wonder_organization_competence|E]."
 tv_engineering_department.7040.a:0 "Przyjmujemy zarządcę i jesteśmy winni panu to, co mu się należy."
 tv_engineering_department.7040.b:0 "Dług wobec tego konkretnego lorda jest wart więcej niż uporządkowane listy."
 tv_engineering_department.7041.t:0 "Konstrukcja: rogi zmiany biegów odpowiadają dzwonom katedralnym"
 tv_engineering_department.7041.d:0 "Sygnalizatory zmiany miejsca zawsze podążały za dzwonami katedralnymi i dzwony nie zostaną przesunięte w zależności od cudu. Poproszenie kapituły o zadzwonienie o dodatkową godzinę w celu oznaczenia zmian zmian kosztuje wśród duchownych [estate_satisfaction|E], ale załogi w końcu przekażą swoje stanowiska na czas, przynosząc [tv_wonder_organization_competence|E]."
 tv_engineering_department.7041.a:0 "Prosimy kapitułę o dodatkowy dzwonek, niezależnie od tego, ile kosztuje nas narzekanie."
 tv_engineering_department.7041.b:0 "Dzwony wyznaczają godziny pracy Boga, a nie zmianę brygadzisty."
 tv_engineering_department.7042.t:0 "Budowa: Wózki z materiałami ustawiają się w kolejce po rynku"
 tv_engineering_department.7042.d:0 "Wozy z materiałami ustawiają się teraz w kolejce po rynku dwa razy dziennie, a straganiarze gildii tracą najlepsze godziny z powodu hałasu i błota. Oczyszczenie placu dla wozów według ustalonego harmonogramu kosztuje mieszczan [estate_satisfaction|E], ale wozy w końcu dotrą na miejsce zgodnie z harmonogramem, który załogi mogą zaplanować, przywożąc [tv_wonder_organization_competence|E]."
 tv_engineering_department.7042.a:0 "Ustalamy harmonogram i sprzątamy plac, stragany lub ich brak."
 tv_engineering_department.7042.b:0 "Rynek karmi miasto, zanim nakarmi cud."
 tv_engineering_department.7043.t:0 "Budowa: Wioski proszone są o drugą rotację"
 tv_engineering_department.7043.d:0 "Okoliczne wioski proszone są o wysłanie drugiej rotacji rąk, zanim obecna załoga upadnie w wyniku podwojenia słupków. Wyciąganie ich z własnych działek pomiędzy sadzeniem a zbiorami kosztuje chłopów [estate_satisfaction|E], ale pełna druga rotacja pozwoliłaby w końcu na prawidłowe funkcjonowanie zakładu, przynosząc [tv_wonder_organization_competence|E]."
 tv_engineering_department.7043.a:0 "Przywołujemy drugą rotację i pozwalamy polom poczekać na swoją kolej."
 tv_engineering_department.7043.b:0 "Puste pola jesienią kosztują kraj więcej niż nierówny harmonogram zmian."
 tv_engineering_department.7044.t:0 "Konstrukcja: Plac postojowy jest zbyt wąski, aby go przejść"
 tv_engineering_department.7044.d:0 "Plac postojowy jest zbyt ciasny, aby załogi mogły się mijać bez przerywania pracy, a plątanina kosztuje godzinę każdego ranka. Oczyszczenie sąsiedniego bloku w celu uzyskania odpowiedniego podwórza wcina się w [development|E] na miejscu, ale załogi w końcu mogły ruszyć bez kolizji, przynosząc [tv_wonder_organization_competence|E]."
 tv_engineering_department.7044.a:0 "Zburzymy blok i damy załodze swobodę ruchu."
 tv_engineering_department.7044.b:0 "Blok pozostaje; ciasne podwórko jest tańsze niż zburzone."
 tv_engineering_department.7045.t:0 "Konstrukcja: Lokalni przewoźnicy są cicho przekierowywani"
 tv_engineering_department.7045.d:0 "Lokalni woźnicy i tragarze, którzy wcześniej zajmowali się własnymi sprawami w tym miejscu, zostali po cichu przekierowani do przewożenia cudownych materiałów, w wyniku czego zwykły handel wokół zakładów został ograniczony. Sformalizowanie porozumienia i związanie tych rąk z harmonogramem cudu kosztuje [prosperity|E] na miejscu, ale [tv_wonder_organization_competence|E] będzie pochodzić od załóg, które nie czekają już na brakujące wózki."
 tv_engineering_department.7045.a:0 "Formalizujemy układ; Carters odpowiadają teraz na harmonogram cudu."
 tv_engineering_department.7045.b:0 "Zwykły handel zapewnia wyżywienie ludziom w tym miejscu; cud może poczekać na swoją kolej na wózki."
 tv_engineering_department.7046.t:0 "Budowa: Stolica pożycza swoich brygadzistów"
 tv_engineering_department.7046.d:0 "Własne stołeczne zakłady budowlane wypożyczyły swoich brygadzistów, aby pomogli w sporządzeniu harmonogramów zmian cudu, a dzięki pożyczce zabrakło rąk do realizacji własnych projektów w stolicy. Zaciągnięcie pożyczki na stałe kosztuje [development|E] w stolicy, ale w cudownym miejscu zatrudniony zostanie brygadzista, który faktycznie wie, jak prowadzić grafik, przynoszący [tv_wonder_organization_competence|E]."
 tv_engineering_department.7046.a:0 "Udzielamy pożyczki na stałe; projekty stolicy poradzą sobie bez niego."
 tv_engineering_department.7046.b:0 "Własne zakłady stolicy bardziej potrzebują powrotu majstra niż cud innego."
 tv_engineering_department.7047.t:0 "Budowa: Porządek portu został zmieniony"
 tv_engineering_department.7047.d:0 "Dni dostaw dla kupców w stolicy zostały po cichu przetasowane, tak że cudowne materiały najpierw opuszczają port, a zwykły handel stolicy czeka teraz za wozami cudu. Potwierdzenie nowego zamówienia w porcie kosztuje [prosperity|E] w stolicy, ale obiekt w końcu otrzyma materiały zgodnie z harmonogramem, a załogi będą mogły budować zmiany, przywożąc [tv_wonder_organization_competence|E]."
 tv_engineering_department.7047.a:0 "Potwierdzamy nowy porządek w porcie; kupcy dostosują się z czasem."
 tv_engineering_department.7047.b:0 "Własny handel stolicy nie powinien czekać za placem budowy innego miasta."
 tv_engineering_department.7048.t:0 "Konstrukcja: Przekwalifikowanie wymaga od załóg podwojenia siły"
 tv_engineering_department.7048.d:0 "Na placu brakuje dwóch pełnych załóg do przekwalifikowania nowych grafików, dlatego pracownicy już zatrudnieni proszeni są o podwojenie swoich stanowisk do czasu wejścia w życie nowego harmonogramu. Tak ciężka jazda pracującym [population|E] na miejscu przez wiele tygodni drogo ich kosztuje, ale przekwalifikowanie w końcu będzie trwało, przynosząc [tv_wonder_organization_competence|E]."
 tv_engineering_department.7048.a:0 "Na razie podwajamy liczbę postów; nowe składy są warte wysiłku."
 tv_engineering_department.7048.b:0 "Zmęczone załogi niczego się nie uczą; przekwalifikowanie może poczekać na wypoczęte ręce."
 tv_engineering_department.7049.t:0 "Konstrukcja: Jeden Ford obsługuje każdy wózek"
 tv_engineering_department.7049.d:0 "Każdy wózek jadący na miejsce stoi jeden wąski bród. Kwatermistrz chce teraz [gold|E] do pomostów i płatnej załogi mostowców, aby [tv_wonder_logistics_competence|E] mógł ponownie ruszyć, zanim kolejka stanie się dłuższa niż sama droga."
 tv_engineering_department.7049.a:0 "Zapłać budowniczym mostu i oczyść bród."
 tv_engineering_department.7049.b:0 "Skarbiec ma lepsze zastosowania dla tej monety niż przeprawa przez kałużę."
 tv_engineering_department.7050.t:0 "Budowa: Właściciele gruntów odmawiają przejazdu konwojowi"
 tv_engineering_department.7050.d:0 "Właściciele ziemscy wzdłuż nowej trasy nie pozwalają wozom przejeżdżać przez pola bez nakazu królewskiego. Wydanie tutaj koronnego [legitimacy|E] otworzyłoby bramy i pozwoliło [tv_wonder_logistics_competence|E] na rozwój, ale tylko na tej drodze i tylko dzisiaj."
 tv_engineering_department.7050.a:0 "Wystaw nakaz i otwórz pola dla wozów."
 tv_engineering_department.7050.b:0 "Słowo korony nie jest wydawane na każdego upartego właściciela ziemskiego."
 tv_engineering_department.7051.t:0 "Budowa: Tor wózkowy przecina zieleń wioski"
 tv_engineering_department.7051.d:0 "Stary tor wózkowy biegnie prosto przez wiejską zieleń, a zarządcy dróg chcą go poszerzyć poprzez przeniesienie trzech domów i studni. Zamówienie przyspieszy [tv_wonder_logistics_competence|E], ale będzie kosztować [stability|E] korony, a ci, którzy pozostaną, będą narzekać."
 tv_engineering_department.7051.a:0 "Wydajcie rozkaz, domy i niech was diabli."
 tv_engineering_department.7051.b:0 "Niech wioska zachowa zieleń; droga może się wokół niego zakręcić."
 tv_engineering_department.7052.t:0 "Konstrukcja: Jedyne zapasowe konie należą do innej gildii"
 tv_engineering_department.7052.d:0 "Gildia wozów w następnej prowincji posiada jedyne wolne konie pociągowe do wynajęcia. Jego panowie pożyczą je i pozwolą [tv_wonder_logistics_competence|E] nadrobić zaległości, tylko jako przysługę wydaną od dworskiego [prestige|E], który nie jest nieograniczony."
 tv_engineering_department.7052.a:0 "Wezwij przysługę i wyprowadź te konie na drogę."
 tv_engineering_department.7052.b:0 "Zachowaj dobre imię sądu dla długu, o który warto walczyć."
 tv_engineering_department.7053.t:0 "Konstrukcja: Poszukiwane są bryczki przewozowe szlachty do kamienia"
 tv_engineering_department.7053.d:0 "Kierowcom zabrakło wozów i chcą, aby zamiast gości woziły kamienie własne brygady miejscowej szlachty. Model [tv_wonder_logistics_competence|E] zyskałby na popularności, ale wśród szlachty kosztowałby [estate_satisfaction|E], którzy będą narzekać na niedogodności."
 tv_engineering_department.7053.a:0 "Zamów wozy i zabierz je do ciągnięcia kamienia."
 tv_engineering_department.7053.b:0 "Zostawcie szlachcie ich powozy; znajdź wagony gdzie indziej."
 tv_engineering_department.7054.t:0 "Budowa: Poszukiwany jest magazyn klasztorny"
 tv_engineering_department.7054.d:0 "W najbliższym klasztorze znajduje się jedyny na trasie suchy magazyn, a drogowcy chcą go opróżnić z zboża i narzędzi. Usunięcie go pomogłoby [tv_wonder_logistics_competence|E] w transporcie, ale kosztowałoby [estate_satisfaction|E] wśród duchowieństwa, które nie zapomni, czyje wozy go wypełniły."
 tv_engineering_department.7054.a:0 "Opróżnij magazyn i ułóż w nim zapasy."
 tv_engineering_department.7054.b:0 "Pozostaw zapasy klasztoru nietknięte."
 tv_engineering_department.7055.t:0 "Budowa: Konwój potrzebuje rynku"
 tv_engineering_department.7055.d:0 "Konwój potrzebuje miejskiego rynku, aby zawrócić swoje wagony, ale na tym placu jest także dzień targowy. Zamknięcie straganów umożliwiłoby przejazd wozami do południa i pomogłoby [tv_wonder_logistics_competence|E], kosztem [estate_satisfaction|E] wśród mieszczan, których stragany pozostały zamknięte."
 tv_engineering_department.7055.a:0 "Zamknąć rynek i przepuścić wozy."
 tv_engineering_department.7055.b:0 "Rynek pozostaje otwarty; wagony mogą poczekać jeden dzień."
 tv_engineering_department.7056.t:0 "Konstrukcja: Błotnisty odcinek połyka drogę"
 tv_engineering_department.7056.d:0 "Część drogi zamieniła się w błoto i żadna zaprzęg wołów nie jest w stanie przejść przez nią samotnie. Przywiązanie do lin własnych wołów i grzbietów wioski oczyściłoby problem i pomogło [tv_wonder_logistics_competence|E], ale kosztowałoby [estate_satisfaction|E] wśród chłopów, którzy potrzebują tych wołów do wiosennych siewów."
 tv_engineering_department.7056.a:0 "Przywiąż do lin woły i grzbiety mieszkańców wioski."
 tv_engineering_department.7056.b:0 "Niech chłopi zatrzymają woły na wiosenne siewy."
 tv_engineering_department.7057.t:0 "Konstrukcja: Stacja postojowa nie może pomieścić wagonów"
 tv_engineering_department.7057.d:0 "Plac postojowy na tym terenie jest zbyt ciasny dla wozów przyjeżdżających obecnie codziennie. Oczyszczenie na wpół zbudowanych magazynów na ich krawędzi umożliwiłoby pracę [tv_wonder_logistics_competence|E], kosztem [development|E] w miejscu już zagłębionym w tych magazynach."
 tv_engineering_department.7057.a:0 "Oczyść magazyny i poszerz podwórze."
 tv_engineering_department.7057.b:0 "Utrzymuj magazyny; wagony mogą stać w kolejce na zewnątrz."
 tv_engineering_department.7058.t:0 "Konstrukcja: Karczmarzom każe się najpierw obsługiwać konwoje"
 tv_engineering_department.7058.d:0 "Karczmarzom i woźnicom w pobliżu tego miejsca powiedziano, aby najpierw zatrzymali zapasy na potrzeby konwojów cudu, a pozostałym sprzedali tylko to, co zostało. Zapewniłoby to zasilanie [tv_wonder_logistics_competence|E], ale kosztem [prosperity|E] na miejscu, jak uważa lokalny handel."
 tv_engineering_department.7058.a:0 "Najpierw zatrzymaj zapasy dla konwojów."
 tv_engineering_department.7058.b:0 "Niech miasto handluje tak jak zawsze."
 tv_engineering_department.7059.t:0 "Budowa: Na drogach poszukiwani są ekipy brukarskie ze stolicy"
 tv_engineering_department.7059.d:0 "Brukarze w stolicy są już w połowie układania ulicy targowej, kiedy zarządcy dróg poprosili ich o utwardzenie kolein na trasie do miejsca budowy. Ponowne przypisanie ich popchnęłoby [tv_wonder_logistics_competence|E] do przodu kosztem [development|E] w stolicy, której ulica pozostaje w połowie brukowana."
 tv_engineering_department.7059.a:0 "Ściągnij ekipę z ulicy i wyślij na trasę."
 tv_engineering_department.7059.b:0 "Najpierw ukończ ulicę targową; trasa może poczekać."
 tv_engineering_department.7060.t:0 "Budowa: Na trasie potrzebne są stołeczne spichlerze"
 tv_engineering_department.7060.d:0 "Najszybciej można zaopatrzyć wozy na trasę w spichlerzach znajdujących się najbliżej bramy stolicy, a zarządcy dróg chcą je otworzyć. Sprzedaż rezerwy pomogłaby spółce [tv_wonder_logistics_competence|E] w utrzymaniu się, kosztem [prosperity|E] w stolicy, ponieważ jej rynki były przez sezon słabo rozwinięte."
 tv_engineering_department.7060.a:0 "Otwórz spichlerze i zapełnij wozy."
 tv_engineering_department.7060.b:0 "Trzymaj spichlerze zamknięte na wypadek uboższej pory roku."
 tv_engineering_department.7061.t:0 "Budowa: Robotnicy proszeni są o rozładowanie zaległości"
 tv_engineering_department.7061.d:0 "Tylko pracownicy zakładu mają wolne ręce i mogą rozładowywać cofane wagony, a brygadzista chce, aby odciągnięto ich od zwykłych zadań i zajęto się dodatkowymi zmianami przy linach. Poruszałoby to [tv_wonder_logistics_competence|E] dalej, ale opiera się na pracującym [population|E] na miejscu, zużytym przez dodatkowe godziny."
 tv_engineering_department.7061.a:0 "Wciągnij pracowników na dodatkowe zmiany i usuń zaległości."
 tv_engineering_department.7061.b:0 "Niech robotnicy wykonują swoje zwykłe zadania."
 tv_engineering_department.7062.t:0 "Konstrukcja: Żurawie stoją bezczynnie z powodu braku monet"
 tv_engineering_department.7062.d:0 "Dźwigi stoją bezczynnie co trzeci dzień z powodu braku płatnej załogi, choć urzędnik skarbowy przysięga, że moneta leży w skarbcu niezliczona. Zwolnienie go teraz sprawi, że liny będą z powrotem w zasięgu ręki, zanim nadejdzie mróz."
 tv_engineering_department.7062.a:0 "Otwórz skarbiec i wydaj [gold|E] na podwójną zmianę, kupując postęp [tv_wonder_construction|E]."
 tv_engineering_department.7062.b:0 "Pozostaw skarbiec zamknięty; załogi czekają w zwykły dzień wypłaty."
 tv_engineering_department.7063.t:0 "Konstrukcja: Masoni żądają własnej pieczęci korony"
 tv_engineering_department.7063.d:0 "Murarze odmawiają przekroczenia spornych kamieni granicznych bez nakazu opatrzonego pieczęcią korony, a nie gubernatora. Umieszczenie nazwiska władcy na rozporządzeniu rozwiązałoby sprawę dzisiaj, chociaż każdy taki nakaz wydany na górników to o jeden mniej dla sądu i rady."
 tv_engineering_department.7063.a:0 "Zapieczętuj nakaz w imieniu władcy, wydając [legitimacy|E] na zakup postępu [tv_wonder_construction|E] za kamieniami granicznymi."
 tv_engineering_department.7063.b:0 "Zatrzymaj pieczęć królewską i pozwól namiestnikowi samemu rozstrzygnąć kwestię granicy."
 tv_engineering_department.7064.t:0 "Budowa: Dwie wioski blokują drogę transportową"
 tv_engineering_department.7064.d:0 "Dwie wioski leżą okrakiem na planowanej drodze transportowej, a ich sołtysi dwukrotnie powiedzieli wyraźnie \"nie\". Nakazanie ich na bok oczyściłoby drogę w ciągu tygodnia, kosztem spokoju, jaki zachowała korona od ostatnich złych żniw."
 tv_engineering_department.7064.a:0 "Nakaż wioskom ustąpić, wydając [stability|E], aby oczyścić postęp [tv_wonder_construction|E] na drodze transportowej."
 tv_engineering_department.7064.b:0 "Zmień trasę wokół wiosek i zostaw naczelników w spokoju."
 tv_engineering_department.7065.t:0 "Konstrukcja: Mistrz Gildii podaje cenę za przeskoczenie kolejki"
 tv_engineering_department.7065.d:0 "Mistrz gildii kamieniarzy przeskoczy kolejkę do murarzy cudu tylko wtedy, gdy sąd zażąda przysługi należnej od ostatniej wizyty państwowej. Zapytanie teraz przesunęłoby zamówienie na początek księgi, ale przysługa wymieniona na głos jest przysługą wydaną."
 tv_engineering_department.7065.a:0 "Wezwij przysługę i wydaj [prestige|E], aby przesunąć zamówienie do przodu, kupując postęp [tv_wonder_construction|E]."
 tv_engineering_department.7065.b:0 "Niech porządek stanie na swoim miejscu, a przysługę zachowaj na później."
 tv_engineering_department.7066.t:0 "Konstrukcja: Pan oferuje swoje podatki domowe"
 tv_engineering_department.7066.d:0 "Miejscowy lord oferuje swoim gospodarstwom domowym daniny za wóz kamienia przez nadchodzący miesiąc, pod warunkiem, że nikt nie wspomni, że jego ludziom obiecano sezon wolny po ostatniej zbiórce. Jego steward już pracuje nad składem."
 tv_engineering_department.7066.a:0 "Weź daniny lorda, wydając [estate_satisfaction|E] szlachty, aby kupić postęp [tv_wonder_construction|E]."
 tv_engineering_department.7066.b:0 "Odrzuć daniny i pozwól ludziom pana dotrzymać obiecanego sezonu."
 tv_engineering_department.7067.t:0 "Budowa: Fundusz przytułku opactwa mógłby pokryć drewno"
 tv_engineering_department.7067.d:0 "Fundusz opactwa na przytułki jest w tym kwartale bardzo duży, a przeor zasugerował, że mógłby pokryć pokrycie drewna na rusztowania, gdyby korona tylko poprosiła wprost, a nie tylko zasugerowała. Pytanie wprost to część, którą rozdział zapamięta."
 tv_engineering_department.7067.a:0 "Zapytaj wprost przeora i wydaj duchownemu [estate_satisfaction|E] na drewno na rusztowania, kupując postęp [tv_wonder_construction|E]."
 tv_engineering_department.7067.b:0 "Niech przytułek finansuje w spokoju i szuka drewna gdzie indziej."
 tv_engineering_department.7068.t:0 "Budowa: Pociągi wagonowe splatają się z dniem targowym"
 tv_engineering_department.7068.d:0 "Wagony przeznaczone na miejsce cudu wplatają się w ruch w dni targowe na tych samych trzech rogach. Zamknięcie tych ulic dla handlu w dni dostaw natychmiast rozplątałoby trasę, choć handlarze straganami natychmiast stracą te godziny zwyczajowe."
 tv_engineering_department.7068.a:0 "W dni dostaw zamykajcie ulice, wydając [estate_satisfaction|E] mieszczan na zakup postępu [tv_wonder_construction|E]."
 tv_engineering_department.7068.b:0 "Zostawcie ulice targowe otwarte i pozwólcie wozom poczekać na swoją kolej."
 tv_engineering_department.7069.t:0 "Budowa: Ekipy zajmujące się kopaniem proszone są o wykonanie robót ziemnych"
 tv_engineering_department.7069.d:0 "Komornik twierdzi, że okoliczne wsie mogą oszczędzić rąk do robót ziemnych, ale tylko tych, które już zaciągnęły do jesiennych rowów, które chronią ich pola przed zalaniem. Sporządzenie ich teraz oznacza, że porzucenie czeka."
 tv_engineering_department.7069.a:0 "Przygotuj ręce wiejskie do robót ziemnych, wydając [estate_satisfaction|E] chłopów na postęp [tv_wonder_construction|E]."
 tv_engineering_department.7069.b:0 "Zostawcie wioski samym sobie i znajdźcie siłę roboczą gdzie indziej."
 tv_engineering_department.7070.t:0 "Konstrukcja: Stary magazyn zbożowy stoi tam, gdzie trzeba wznieść rusztowanie"
 tv_engineering_department.7070.d:0 "Stary skład zboża, stojący w miejscu, gdzie trzeba postawić zachodnie rusztowanie, jest wystarczająco solidny, aby go utrzymać, ale jego kamień i jego ślad za jednym zamachem rozwiążą zarówno brak murarza, jak i skargę geodety. Najszybszym sposobem jest pociągnięcie go w dół."
 tv_engineering_department.7070.a:0 "Rozbij magazyn zbożowy, wydając [development|E] na miejscu, aby kupić postęp [tv_wonder_construction|E]."
 tv_engineering_department.7070.b:0 "Zostaw magazyn zbożowy i znajdź pomieszczenie na rusztowanie gdzie indziej."
 tv_engineering_department.7071.t:0 "Konstrukcja: Karczmarze cicho zwracają się w stronę cudu"
 tv_engineering_department.7071.d:0 "Właściciele tawern i woźnicy zaczęli po cichu zmieniać swoje zwyczaje na dostawy cudów, ponieważ załogi płacą gotowymi monetami, a zwykły handel nie. Sformalizowanie tego porozumienia przyspieszyłoby dostawy kosztem handlu, na którym strażnicy zbudowali swój zwyczaj."
 tv_engineering_department.7071.a:0 "Sformalizuj przekierowanie, wydając [prosperity|E] na stronie, aby kupić postęp [tv_wonder_construction|E]."
 tv_engineering_department.7071.b:0 "Niech lokalny handel toczy się swoim normalnym torem, a dostawy pozostawiamy bez zmian."
 tv_engineering_department.7072.t:0 "Konstrukcja: Jeden most lub jeden cud"
 tv_engineering_department.7072.d:0 "Remont mostu w stolicy utknął w martwym punkcie z powodu braku kamieniarzy, a każdy murarz na nim to murarz, który nie tnie dla cudu. Przeniesienie załogi natychmiast przesunęłoby cud do przodu, a most po prostu czekałby na swoją kolej."
 tv_engineering_department.7072.a:0 "Przydziel ponownie załogę mostu do cudu, wydając [development|E] w stolicy na postęp [tv_wonder_construction|E]."
 tv_engineering_department.7072.b:0 "Zostaw załogę mostka tam, gdzie się znajduje i pozwól mostkowi dokończyć pierwszy."
 tv_engineering_department.7073.t:0 "Konstrukcja: Producenci zboża oferują swoje nadwyżki za odpowiednią cenę"
 tv_engineering_department.7073.d:0 "Stołeczni dystrybutorzy zboża zaproponowali, że sprzedają swoje nadwyżki bezpośrednio do sklepów cudów po uczciwej cenie, pod warunkiem, że korona pozwoli im wystawić sprzedaż na głównym placu jako dowód królewskiej łaski. Zapewniłoby to załodze przetrwanie chudego miesiąca i wyraźnie skierowałoby rynek w stronę jednego nabywcy."
 tv_engineering_department.7073.a:0 "Niech faktorzy opublikują sprzedaż, wydając [prosperity|E] w stolicy, aby kupić postęp [tv_wonder_construction|E]."
 tv_engineering_department.7073.b:0 "Odrzuć sprzedaż publiczną i kupuj zboże dla załóg zwykłymi kanałami."
 tv_engineering_department.7074.t:0 "Konstrukcja: Nadzorca proponuje pracę w nocy"
 tv_engineering_department.7074.d:0 "Nadzorca proponuje, aby ekipy zatrudnione w placówce pracowały na nocnej zmianie, zamiast czekać na świeże ręce od rekrutera, ponieważ zarówno pochodnie, jak i testament już są na miejscu. Nadrobi zaległości do świtu, choć ci sami ludzie wrócą o świcie, bez przerwy między nimi."
 tv_engineering_department.7074.a:0 "Zamów nocną zmianę, wydając [population|E] na miejscu, aby kupić postęp [tv_wonder_construction|E]."
 tv_engineering_department.7074.b:0 "Wyślij załogi do łóżek i poczekaj na świeże ręce od rekrutera."
 tv_engineering_department.7075.t:0 "Konstrukcja: Opinia na Scaffold Wavers"
 tv_engineering_department.7075.d:0 "Publiczna demonstracja w tym miejscu przyciąga tłum, który może stać się lojalnymi widzami lub urażonymi krytykami. Rusztowania czekają, aż plotka zadecyduje, czy [tv_wonder_domestic_support|E] otrzymał pomoc, czy zaszkodził."
 tv_engineering_department.7075.a:0 "Niech demonstracja mówi sama za siebie."
 tv_engineering_department.7076.t:0 "Konstrukcja: Plan przerasta stronę"
 tv_engineering_department.7076.d:0 "Odważna korekta wyciąga plan poza jego dawne ograniczenia. Może to być decyzja, która nadała pomnikowi wielkość, lub notatka, którą przyszli urzędnicy podkreślają na czerwono."
 tv_engineering_department.7076.a:0 "Wypycha projekt poza jego stare ograniczenia."
 tv_engineering_department.7077.t:0 "Budowa: Zmiana zamówień pod markizą"
 tv_engineering_department.7077.d:0 "Pod markizami narzucony jest nowy łańcuch dowodzenia. Może zdyscyplinować stocznię lub po prostu nauczyć każdego brygadzisty nowego sposobu argumentowania."
 tv_engineering_department.7077.a:0 "Przepychamy nowy łańcuch dowodzenia przez podwórze."
 tv_engineering_department.7078.t:0 "Konstrukcja: Trasa wiedzie przez błoto"
 tv_engineering_department.7078.d:0 "Ryzykowna trasa obiecuje skrócenie linii zaopatrzenia. Jeśli pogoda się utrzyma, będzie to chwalone za przewidywanie; jeśli się nie powiedzie, wszyscy będą pamiętać, kto zarządził turę."
 tv_engineering_department.7078.a:0 "Wybierz krótszą drogę!"
 tv_engineering_department.7079.t:0 "Konstrukcja: nowa metoda wisi w powietrzu"
 tv_engineering_department.7079.d:0 "Na części aktywnej wypróbowywana jest szybsza metoda. Może to uratować miesiąc lub zmusić następną załogę do naprawienia pięknego błędu."
 tv_engineering_department.7079.a:0 "Próbuje szybszej metody na aktywnej sekcji."
 tv_engineering_department.7080.t:0 "Budowa: Pracownicy zużywają narzędzia z powodu złamanej obietnicy"
 tv_engineering_department.7080.d:0 "Dziś rano robotnicy porzucili swoje narzędzia, mamrocząc, że cudem jest wykrwawianie srebra korony do sucha. Brygadzista uspokoił ich obietnicą premii, którą skarb musi teraz albo dotrzymać, albo złamać na oczach tłumu."
 tv_engineering_department.7080.a:0 "Złam obiecaną premię i pozwól, aby narzekanie pracowników rozprzestrzeniło się po całym zakładzie."
 tv_engineering_department.7080.b:0 "Dotrzymaj obiecanej premii i pozwól jej wyjść ze skarbca."
 tv_engineering_department.7081.t:0 "Konstrukcja: Broszura kwestionuje pieczęć pisma"
 tv_engineering_department.7081.d:0 "Podróżujący urzędnik przeczytał na placu broszurę, w której twierdził, że nakaz koronny zezwalający na cud nigdy nie został zgodnie z prawem zapieczętowany. Niezależnie od tego, czy wątpliwości co do projektu pozostaną bez odpowiedzi, czy też sam nakaz zostanie po cichu poprawiony, coś musi się wydarzyć."
 tv_engineering_department.7081.a:0 "Pozostaw broszurę bez odpowiedzi i pozwól, aby wątpliwości co do cudu rozprzestrzeniały się dalej."
 tv_engineering_department.7081.b:0 "Zmień po cichu sformułowanie nakazu, aby odpowiedzieć na wyzwanie i zaakceptuj naruszenie mandatu korony."
 tv_engineering_department.7082.t:0 "Budowa: opłata wywołuje bójkę dwa dni stąd"
 tv_engineering_department.7082.d:0 "Nadeszła wiadomość, że zaciągniecie wozów kamieni do cudu wywołało bójkę między oficerami poborowymi a mieszkańcami wioski oddalonej o dwa dni jazdy od miejsca zdarzenia. Wyciszenie będzie coś kosztować, czy to w tej dzielnicy, czy przy bramach."
 tv_engineering_department.7082.a:0 "Niech bramy zakładu pochłoną narzekanie i pozostawią niepokój dzielnicy, aby się wypaliła."
 tv_engineering_department.7082.b:0 "Wyślij żołnierzy, aby po cichu zasiedlili dzielnicę, zanim niepokoje się rozprzestrzenią."
 tv_engineering_department.7083.t:0 "Konstrukcja: Jibe wysłannika podróżuje z portu do pałacu"
 tv_engineering_department.7083.d:0 "Zagraniczny poseł śmiał się na bankiecie, że cud pełza wolniej niż pług, a kpiny powtarzają się teraz w każdej tawernie, od portu po pałac. Ktoś musi to przełknąć – albo pozycja korony za granicą, albo duma mieszczan z tego, co się buduje."
 tv_engineering_department.7083.a:0 "Zignoruj drwiny wysłannika i pozwól, aby duma mieszkańców miasta z cudu wzięła żądło."
 tv_engineering_department.7083.b:0 "Odpowiedz wysłannikowi wystawną ladą i wykorzystaj reputację korony, aby go uciszyć."
 tv_engineering_department.7084.t:0 "Konstrukcja: Zarządca Lorda Aldrica wścieka się u Bramy"
 tv_engineering_department.7084.d:0 "W zeszłym tygodniu nowa droga do kamieniołomu została przecięta prosto przez rezerwat łowiecki lorda Aldrica i od tego czasu jego zarządca wścieka się przy bramie. Albo dom pana zostanie udobruchany, albo społeczeństwo obserwujące konflikt wyciągnie własne wnioski."
 tv_engineering_department.7084.a:0 "Niech spór będzie się przeciągał bez rozstrzygnięcia i niech opinia publiczności o projekcie będzie kwaśna."
 tv_engineering_department.7084.b:0 "Udziel domowi pana formalnych przeprosin i odszkodowania, aby zakończyć sprawę."
 tv_engineering_department.7085.t:0 "Budowa: Rów fundamentowy odkopuje stare groby"
 tv_engineering_department.7085.d:0 "Kopacze przygotowujący wykop pod fundamenty odnaleźli stare kamienie nagrobne, których nikt nie odnotował, a proboszcz odmawia błogosławienia dalszych prac do czasu należytego pochówku zmarłych. Albo obrzędy ponownego pochówku zostaną w pełni opłacone, albo kopanie będzie kontynuowane pomimo sprzeciwu księdza."
 tv_engineering_department.7085.a:0 "Unieważnij księdza i kop dalej, pozwalając zamiast tego, aby wieść o naruszonych grobach zaniepokoiła tłum."
 tv_engineering_department.7085.b:0 "Zapłać za pełne obrzędy ponownego pochówku, aby zadowolić księdza i parafię."
 tv_engineering_department.7086.t:0 "Konstrukcja: Słupy rusztowania blokują rząd handlarzy"
 tv_engineering_department.7086.d:0 "Słupy rusztowania ułożone po drugiej stronie głównej ulicy blokują ruch wozów prowadzących do szeregu kupców przez sześć dni z rzędu, a handlarze żądają, aby ktoś odpowiedział za utracony handel. Albo ich straty zostaną naprawione, albo ulica pozostanie zamknięta i tłum o tym usłyszy."
 tv_engineering_department.7086.a:0 "Pozostaw kupcom bez wynagrodzenia i pozwól, aby zamknięta ulica podsycała narzekanie tłumu."
 tv_engineering_department.7086.b:0 "Zrekompensuj rząd kupców za zablokowany handel z ręki."
 tv_engineering_department.7087.t:0 "Konstrukcja: Dojrzewające pola stoją niecięte"
 tv_engineering_department.7087.d:0 "Osoby odpowiedzialne za pobieranie opłat żniwnych zdjęły ręce z dojrzewających pól, aby wozić drewno na cud, a zboże stoi teraz nieskoszone, a robotników bolą plecy na miejscu. Albo wioski odzyskają ręce do żniw, albo tłum usłyszy, jak cud opróżnił pola."
 tv_engineering_department.7087.a:0 "Trzymaj wyciągnięte ręce na miejscu i pozwól, aby wieść o stojącym zbożu dotarła do tłumu."
 tv_engineering_department.7087.b:0 "Natychmiast zwolnij ręce wioski z powrotem do żniw."
 tv_engineering_department.7088.t:0 "Budowa: Stara dzielnica garbarni jest w połowie zburzona"
 tv_engineering_department.7088.d:0 "Plan murarzy zakłada oczyszczenie starej dzielnicy garbarni, aby zrobić miejsce pod fundamenty cudu, a połowa zawaliła się, zanim komukolwiek przyszło do głowy zapytać, co ją zastąpi. Albo dzielnica zostanie zrównana z ziemią zgodnie z planem, albo plan zostanie ograniczony i ludzie zaczną pytać, dlaczego cud potrzebował tak dużo miejsca."
 tv_engineering_department.7088.a:0 "Zmniejsz prześwit i pozwól ludziom zastanawiać się, dlaczego cud potrzebował tak dużej powierzchni."
 tv_engineering_department.7088.b:0 "Zakończ burzenie dzielnicy garbarni zgodnie z planem i martw się o to, co zastąpi ją później."
 tv_engineering_department.7089.t:0 "Budowa: Rynek nie wrócił"
 tv_engineering_department.7089.d:0 "Plac postojowy cudu już trzeci miesiąc z rzędu pochłonął cotygodniowe targowisko, a stragany, które je wypełniały, po prostu przestały wracać. Albo teren targowy zostanie zwrócony, zanim zostanie zapomniany, albo stocznia go zatrzyma, a handel w tym miejscu będzie się zmniejszał."
 tv_engineering_department.7089.a:0 "Zachowaj plac postojowy tam, gdzie jest i pozwól, aby handel na rynku ostygł."
 tv_engineering_department.7089.b:0 "Wróć na teren targowiska, zanim cotygodniowe stragany zapomną drogi powrotnej."
 tv_engineering_department.7090.t:0 "Konstrukcja: Przytułek stoi nietknięty przez Stary Most"
 tv_engineering_department.7090.d:0 "Geodeta miejski zarekwirował wszystkich wolnomularzy w stolicy na wykonanie kamieniarki cudu, w wyniku czego na wpół wybudowany przytułek przy starym moście stoi nietknięty przez dwa miesiące. Albo przytułek czeka, aż cud się dokona, albo murarze zostaną odciągnięci z powrotem do stolicy, a budowa zwalnia, aby wyjaśnić dlaczego."
 tv_engineering_department.7090.a:0 "Zachwyć każdego murarza cudem i pozwól, aby na wpół zrealizowane projekty stolicy poczekały."
 tv_engineering_department.7090.b:0 "Przypomnij murarzom, aby dokończyli przytułek i pozwól publiczności dziwić się opóźnieniu."
 tv_engineering_department.7091.t:0 "Budowa: Kamienne wagony dławią najpiękniejszą ulicę stolicy"
 tv_engineering_department.7091.d:0 "Wozy z obrobionym kamieniem przeznaczone dla cudu stoją od tygodnia przy najpiękniejszej ulicy handlowej stolicy, a tamtejsi sklepikarze twierdzą, że zwyczaje zanikły, bo droga została zablokowana. Albo wozy wkrótce znajdą inną trasę, albo zostają, a handel w stolicy wciąż ochładza się."
 tv_engineering_department.7091.a:0 "Zostaw wozy tam, gdzie są i pozwól, aby zamiast tego winę ponosił postęp witryny."
 tv_engineering_department.7091.b:0 "Natychmiast przekieruj wozy i pozwól, aby ulica handlowa stolicy znów odetchnęła."
 tv_engineering_department.7092.t:0 "Konstrukcja: Zawalenie się rusztowania powoduje uszkodzenie kilkunastu"
 tv_engineering_department.7092.d:0 "Trzy dni temu zawalenie się rusztowania na budowie spowodowało, że kilkunastu robotników miało połamane kości, a reszta załogi narzeka teraz, że żadna płaca nie jest warta ryzyka. Albo nadzorcy narzucają tempo i robotnicy zaczną uciekać w nocy, albo tempo zwalnia i po mieście rozchodzi się wieść o niebezpieczeństwie."
 tv_engineering_department.7092.a:0 "Niech niebezpieczeństwo stanie się powszechnym tematem w mieście i zatrzymaj wszystkich robotników na miejscu."
 tv_engineering_department.7092.b:0 "Niezależnie od tego narzucaj tempo i zaakceptuj fakt, że przestraszeni pracownicy uciekną w nocy."
 tv_engineering_department.7093.t:0 "Konstrukcja: Kaseta jest lżejsza niż podaje księga"
 tv_engineering_department.7093.d:0 "Płatnik witryny otwiera sejf i stwierdza, że jest on lżejszy, niż twierdzi księga. Ktoś wydał już monetę, która nigdy nie została policzona, a niedobór zostanie uzupełniony w [tv_wonder_scale_competence|E] lub [gold|E]."
 tv_engineering_department.7093.a:0 "Zmniejsz projekt, aby dopasować go do tego, na co wciąż może sobie pozwolić skrzynia."
 tv_engineering_department.7093.b:0 "Pokryj niedobory ze skarbca i kontynuuj budowanie na dużą skalę."
 tv_engineering_department.7094.t:0 "Konstrukcja: Rywal szepcze, że żadna karta na to nie pozwala"
 tv_engineering_department.7094.d:0 "Konkurencyjny wnioskodawca zaczął szeptać, że żaden statut nie zezwala na wzniesienie pomnika tej wielkości. Urzędnicy twierdzą, że sprawę można rozwiązać po cichu, ale nie bez kosztów dla [tv_wonder_scale_competence|E] lub [legitimacy|E]."
 tv_engineering_department.7094.a:0 "Po cichu wycofaj największe roszczenia ze statutu."
 tv_engineering_department.7094.b:0 "Niech korona ponownie potwierdzi statut i bezpośrednio odpowie na szepty."
 tv_engineering_department.7095.t:0 "Budowa: Trzy parafie blokują drogę nad fundamentami"
 tv_engineering_department.7095.d:0 "Mężczyźni z trzech parafii zrzucili narzędzia na poszerzone fundamenty, blokując drogę wozami. Komornik może je rozproszyć, ale tylko podając gdzieś grunt - albo [tv_wonder_scale_competence|E] planu, albo [stability|E] powiatu."
 tv_engineering_department.7095.a:0 "Zawęź fundamenty z powrotem do pierwotnej linii i odeślij ludzi do domu zadowolonych."
 tv_engineering_department.7095.b:0 "Wyślij uzbrojonych ludzi, aby oczyścić drogę i utrzymać szersze fundamenty."
 tv_engineering_department.7096.t:0 "Konstrukcja: Heroldowie odmawiają bezpłatnej podróży"
 tv_engineering_department.7096.d:0 "Heroldowie, którzy mieli głosić pomnik za granicą, od dwóch miesięcy nie otrzymują wynagrodzenia i obecnie odmawiają podróży. Ktoś musi być od razu usatysfakcjonowany, niezależnie od tego, czy oznacza to przycięcie [tv_wonder_scale_competence|E] projektu, czy wydanie korony [prestige|E], aby kupić ich ciszę."
 tv_engineering_department.7096.a:0 "Ogłoście mniejszy, tańszy pomnik i pozwólcie heroldom nieść to słowo."
 tv_engineering_department.7096.b:0 "Płacić heroldom z własnego imienia i reputacji korony."
 tv_engineering_department.7097.t:0 "Konstrukcja: Steward barona liczy podwójnie drewno"
 tv_engineering_department.7097.d:0 "Zarządca barona przeliczył drewno zarekwirowane w lasach jego pana i stwierdził, że jest dwa razy tyle, co uzgodniono. Pan zaakceptuje albo mniejsze cięcie w przyszłości, zmniejszając [tv_wonder_scale_competence|E] planu, albo formalne przeprosiny i dalsze ustępstwa na rzecz [estate_satisfaction|E] wśród szlachty."
 tv_engineering_department.7097.a:0 "Zmniejsz przyszłe limity drewna i zmniejsz rozmiar projektu, aby dopasować go do potrzeb."
 tv_engineering_department.7097.b:0 "Wyślij oficjalne przeprosiny i dalsze dotacje do domu barona."
 tv_engineering_department.7098.t:0 "Konstrukcja: Szersza nawa pochłonęłaby stary cmentarz"
 tv_engineering_department.7098.d:0 "Biskup dowiedział się, że szersza nawa pochłonie dawny cmentarz kapituły. Nie pobłogosławi dzieł ponownie, chyba że plan zostanie ograniczony lub jeśli skargi kapituły wobec [estate_satisfaction|E] wśród duchowieństwa nie zostaną w pełni rozpatrzone."
 tv_engineering_department.7098.a:0 "Przerysuj nawę, aby oszczędzić miejsce pochówku."
 tv_engineering_department.7098.b:0 "Daj kapitule nowe przywileje, aby mogła odpowiedzieć na ich skargi."
 tv_engineering_department.7099.t:0 "Budowa: poszerzona droga przecina magazyny"
 tv_engineering_department.7099.d:0 "Handlarze wełną donoszą, że poszerzona droga prowadząca na miejsce przecinała rząd ich magazynów i towary obecnie gniją na skrzyżowaniach. Albo droga zwęża się z powrotem, przycinając [tv_wonder_scale_competence|E] całego podejścia, albo korona wprost rekompensuje [estate_satisfaction|E] wśród mieszczan."
 tv_engineering_department.7099.a:0 "Zwęź drogę dojazdową i oszczędź magazyny."
 tv_engineering_department.7099.b:0 "Zapłać kupcom straty i trzymaj się szerszej drogi."
 tv_engineering_department.7100.t:0 "Budowa: W tym miesiącu wioska pochowała trzech mężczyzn"
 tv_engineering_department.7100.d:0 "Dociera do nas wieść, że w wiosce niedaleko kamieniołomu pochowano w tym miesiącu trzech mężczyzn, którzy pracowali po zmroku nad powiększonym zamówieniem. Wójt mówi, że pańszczyznę należy obciąć, chyba że korona wolałaby raczej odpowiadać za [estate_satisfaction|E] wśród chłopów zbożem i srebrem, zamiast kurczyć się [tv_wonder_scale_competence|E]."
 tv_engineering_department.7100.a:0 "Zmniejsz porządek corvee z powrotem do tego, co wioska może znieść."
 tv_engineering_department.7100.b:0 "Wyślij zboże i srebro do wioski i trzymaj corvee zgodnie z rozkazem."
 tv_engineering_department.7101.t:0 "Budowa: rząd domów zjeżdża na miejsce pracy"
 tv_engineering_department.7101.d:0 "Burmistrz wyburzył na miejscu rząd stojących domów, aby poszerzyć teren robót, a mieszkańcy pytają, co powstanie na ich miejscu. Odpowiedź albo zmniejszy projekt, oszczędzając [tv_wonder_scale_competence|E] niepotrzebnej ziemi, albo będzie oznaczać dalsze czyszczenie i utratę większej części [development|E] witryny."
 tv_engineering_department.7101.a:0 "Wstrzymaj dalsze oczyszczanie i przerysuj plan, aby dopasować go do już zajętego terenu."
 tv_engineering_department.7101.b:0 "Nakaż kontynuację rozliczeń i pozwól, aby strona pokryła stratę."
 tv_engineering_department.7102.t:0 "Budowa: Rynek, który kiedyś otaczał to miejsce, zniknął"
 tv_engineering_department.7102.d:0 "Targowisko, które niegdyś otaczało plac budowy, zostało wyparte przez rusztowania i hałas, a stragany nie wróciły. Nadzorca musi zdecydować, czy przyspieszyć prace, rezygnując z części [tv_wonder_scale_competence|E], czy też pozwolić, aby [prosperity|E] zakładu nadal się wykrwawiało, podczas gdy rynek pozostanie wygnany."
 tv_engineering_department.7102.a:0 "Wciągnij rusztowanie i pozwól, aby rynek powrócił."
 tv_engineering_department.7102.b:0 "Niech prace będą szeroko rozpowszechnione i niech handel w tym miejscu uschnie."
 tv_engineering_department.7103.t:0 "Budowa: Murarze mostowi zostali wciągnięci do cudu"
 tv_engineering_department.7103.d:0 "Murarzy powołanych do budowy cudu ściągnięto bezpośrednio z naprawy mostów w stolicy, które obecnie są w połowie ukończone przed zimą. Ktoś musi dać: albo [tv_wonder_scale_competence|E] cudu kurczy się, aby murarze mogli wrócić do domu, albo [development|E] stolicy czeka na sezon nienaprawiony."
 tv_engineering_department.7103.a:0 "Wypuść murarzy z powrotem do stolicy i zmniejsz skalę cudu."
 tv_engineering_department.7103.b:0 "Trzymaj murarzy w miejscu cudu i pozwól, aby naprawy stolicy poczekały."
 tv_engineering_department.7104.t:0 "Budowa: W stołecznych ratuszach ucichła"
 tv_engineering_department.7104.d:0 "W stolicy gildie ucichły, a ich rzemieślnicy i woźnicy zostali odciągnięci, by zaspokoić apetyt cudu na kamień i dłonie. Rada pyta wyraźnie, czy projekt zostanie ostatecznie przycięty do odpowiednich rozmiarów, oszczędzając [tv_wonder_scale_competence|E], czy też stołeczny [prosperity|E] będzie musiał w dalszym ciągu finansować pomnik, którego nie widzi już budowanego na swoich własnych ulicach."
 tv_engineering_department.7104.a:0 "Zmniejsz projekt i wypuść członków gildii z powrotem do stolicy."
 tv_engineering_department.7104.b:0 "Zatrzymaj członków gildii na miejscu i pozwól, aby handel ze stolicy nadal za to płacił."
 tv_engineering_department.7105.t:0 "Konstrukcja: Chirurg ostrzega, że spadnie więcej"
 tv_engineering_department.7105.d:0 "Zeszłej nocy na poszerzonym poziomie zawaliło się rusztowanie i chirurg twierdzi, że spadną kolejne, jeśli tempo realizacji większego planu nie zwolni. Nadzorca może albo przyspieszyć projekt do tempa, w którym załoga jest w stanie przetrwać, oszczędzając [tv_wonder_scale_competence|E], albo kontynuować szerszą pracę i zaakceptować fakt, że [population|E] pracujący na budowie będzie się zmniejszać."
 tv_engineering_department.7105.a:0 "Zwolnij tempo i ogranicz plan do tego, co załoga jest w stanie udźwignąć."
 tv_engineering_department.7105.b:0 "Kontynuuj szersze prace i zaakceptuj straty, jakie poniosą pracownicy."
 tv_engineering_department.7106.t:0 "Konstrukcja: Dwóch urzędników dwukrotnie liczy ten sam niedobór"
 tv_engineering_department.7106.d:0 "Podczas wczorajszego liczenia, w kasie skarbnika, dwukrotnie zabrakło środków przez dwóch różnych urzędników. Albo brakująca moneta zostanie spisana w skarbcu, albo cały grafik zmian zostanie zniszczony, a każda załoga przeniesiona z niczego. [tv_wonder_organization_competence|E] lub [gold|E] zapłaci za arytmetykę urzędników."
 tv_engineering_department.7106.a:0 "Zniszcz harmonogram zmian i przydziel każdą załogę od nowa."
 tv_engineering_department.7106.b:0 "Odpisz brakującą monetę do skarbca i zostaw listę zgodnie z przeliczeniem."
 tv_engineering_department.7107.t:0 "Budowa: Sfałszowany grant jest czytany załogom na głos"
 tv_engineering_department.7107.d:0 "Wołacz, którego nie rozpoznaje żaden brygadzista, odczytał sfałszowane przyznanie praw do drewna rywalizującemu władcy, przy pełnym przesłuchaniu załóg. Ściganie mężczyzny i odparcie jego twierdzeń przed zgromadzonymi robotnikami zdejmuje na cały dzień wszystkich brygadzistów ze stanowisk. Pozostawienie fałszerstwa bez odpowiedzi wstrzymuje załogę w pracy, ale twierdzenie to jest już powtarzane w tawernach jako fakt. [tv_wonder_organization_competence|E] lub [legitimacy|E] przeniesie kłamstwo fałszerza."
 tv_engineering_department.7107.a:0 "Ściągnij każdego brygadzistę ze swojego stanowiska, aby wytropić krzykacza i wyjaśnić sprawę."
 tv_engineering_department.7107.b:0 "Niech sfałszowane roszczenie pozostanie bez odpowiedzi, a załoga nie zabierze się do pracy."
 tv_engineering_department.7108.t:0 "Konstrukcja: Zapałka rozsypuje się na ulicę"
 tv_engineering_department.7108.d:0 "Zapałka do pchania przy mesie, ponad pół worka zepsutego zboża, wysypała się przez bramę na ulicę, zanim zegarek ją rozbił. Załogi można przetasowywać i karmić w różnych godzinach, tak aby oba gangi nigdy więcej się nie spotkały, albo wachta może dokonać aresztowań na otwartym placu, aby zakończyć sprawę na dobre. Odpowiedzi [tv_wonder_organization_competence|E] lub [stability|E] na zepsute ziarno."
 tv_engineering_department.7108.a:0 "Przetasuj każdą zmianę bałaganu, aby ścieżki obu gangów nigdy więcej się nie skrzyżowały."
 tv_engineering_department.7108.b:0 "Niech wachta dokona aresztowań na otwartym placu."
 tv_engineering_department.7109.t:0 "Konstrukcja: Wysłannik przybywa do bezzałogowej bramy"
 tv_engineering_department.7109.d:0 "Zagraniczny wysłannik przybył cały dzień wcześniej i zastał bramę honorową bez załogi, a sztandary wciąż złożone na piersi. Grafik dyżurów można rozłożyć na miejscu, aby przygotować odpowiednie powitanie, albo można też przeprowadzić posłannika po obiekcie w jego obecnym stanie i zgłosić go do domu w takim stanie, w jakim go widział. [tv_wonder_organization_competence|E] lub [prestige|E] płaci za wcześniejsze przybycie."
 tv_engineering_department.7109.a:0 "Zerwij na miejscu harmonogram obowiązków, aby przygotować odpowiednie powitanie."
 tv_engineering_department.7109.b:0 "Przejdź posłańca po witrynie dokładnie tak, jak jest."
 tv_engineering_department.7110.t:0 "Budowa: Pożyczone woły są spóźnione od dnia Świętego Mikołaja"
 tv_engineering_department.7110.d:0 "Zaprzęgi wołów pożyczone z posiadłości sąsiedniego pana miały wrócić w święto Świętego Mikołaja i nadal przewożą kamień po upływie terminu. Zespoły mogą zostać odesłane do domu zgodnie z harmonogramem, a załogi holownicze zreorganizowane tak, aby ręcznie przeciągały ładunki, albo woły można przetrzymać przez kolejne dwa tygodnie, podczas gdy zarządca każe czekać. [tv_wonder_organization_competence|E] lub [estate_satisfaction|E] wśród szlachty niesie zaległe woły."
 tv_engineering_department.7110.a:0 "Wyślij woły do domu zgodnie z harmonogramem i zreorganizuj załogę, aby ciągnęła ją ręcznie."
 tv_engineering_department.7110.b:0 "Zatrzymaj woły jeszcze przez dwa tygodnie i powiedz zarządcy pana, żeby zaczekał."
 tv_engineering_department.7111.t:0 "Konstrukcja: Młoty zagłuszają procesję relikwii"
 tv_engineering_department.7111.d:0 "W tym tygodniu murarze bez przerwy przebijali się przez procesję relikwii, a śpiewu nie było słychać w miejscu znajdującym się trzy ulice dalej. Od tej chwili kalendarz zmian będzie można przerysować wokół każdego święta i dnia procesji lub po prostu przesunąć trasę procesji i poinformować duchownych, że praca nie będzie na tym przerywana. [tv_wonder_organization_competence|E] lub [estate_satisfaction|E] wśród duchownych odpowiadają za hałas."
 tv_engineering_department.7111.a:0 "Narysuj na nowo kalendarz zmian wokół każdego dnia święta i procesji."
 tv_engineering_department.7111.b:0 "Przesuń trasę procesji i powiedz duchownym, że prace nie zostaną wstrzymane."
 tv_engineering_department.7112.t:0 "Budowa: Wozy budowlane blokują pas targu zbożowego"
 tv_engineering_department.7112.d:0 "Rząd wozów budowlanych blokował pas załadunkowy targu zbożowego przez sześć dni z rzędu, a cech handlarzy przestał wysyłać swoich urzędników, aby osobiście składali skargi. Harmonogram dostaw można rozebrać i przebudować na dłuższą trasę, która zapewni czystość szlaku, lub wozy mogą pozostać na miejscu, podczas gdy gildia będzie musiała przekierować własną działalność. [tv_wonder_organization_competence|E] lub [estate_satisfaction|E] wśród mieszczan płaci za zablokowany pas."
 tv_engineering_department.7112.a:0 "Rozbij harmonogram dostaw i odbuduj go wokół dłuższej trasy."
 tv_engineering_department.7112.b:0 "Zostaw wozy tam, gdzie stoją i pozwól gildii zmienić trasę."
 tv_engineering_department.7113.t:0 "Budowa: Sezon sadzenia nadchodzi bez jego rąk"
 tv_engineering_department.7113.d:0 "Gangi pańszczyźniane, które mają wrócić do swoich wiosek na sadzenie, nadal rąbią kamień i przyszła wieść, że bez nich tegoroczne pola pozostaną niezasiane. Gangi mogą zostać zwolnione zgodnie z harmonogramem, a pracownicy na miejscu zostaną odbudowani od tych, którzy pozostali, albo pańszczyzna może zostać przetrzymywana po upływie terminu, podczas gdy wioski radzą sobie bez rąk. [tv_wonder_organization_competence|E] lub [estate_satisfaction|E] wśród chłopów płaci za nieobsadzone pola."
 tv_engineering_department.7113.a:0 "Zwolnij gangi corvee zgodnie z harmonogramem i odbuduj zmiany w miejscu od tych, które pozostały."
 tv_engineering_department.7113.b:0 "Zatrzymaj corvee po upływie terminu i pozwól wioskom dać sobie radę."
 tv_engineering_department.7114.t:0 "Konstrukcja: Zawalona ściana spogląda na nawierzchnię terenu"
 tv_engineering_department.7114.d:0 "Ściana oporowa zawaliła się w ciągu nocy, a najbliższym ubitym kamieniem, jaki można było znaleźć, była nawierzchnia już ułożona wzdłuż drogi dojazdowej do miejsca budowy. Nawierzchnię można zostawić na miejscu i każdą wolną ręką zająć się innymi zadaniami polegającymi na wydobyciu świeżego kamienia, albo po prostu ponownie rozebrać drogę, aby do rana załatać ścianę. [tv_wonder_organization_competence|E] lub [development|E] na miejscu płaci za zawaloną ścianę."
 tv_engineering_department.7114.a:0 "Zamiast tego odciągnij każdą wolną rękę od innych zadań, aby zamiast tego wydobywać świeży kamień."
 tv_engineering_department.7114.b:0 "Rozwal ponownie drogę dojazdową, aby do rana załatać ścianę."
 tv_engineering_department.7115.t:0 "Konstrukcja: Sprzedawcy chleba odchodzą z powodu zaległych zarobków"
 tv_engineering_department.7115.d:0 "Sprzedawcy chleba z targu obozowego spakowali się i wyjechali po tym, jak za zeszły tydzień wypłacono pensję z trzydniowym opóźnieniem i połowę obciętą monetą. Płace można przełożyć na bardziej rygorystyczny i częstszy harmonogram, aby zwabić sprzedawców z powrotem, rozrywając w tym celu obecną rotację wynagrodzeń, albo obóz może po prostu obejść się bez rynku, a robotnicy będą mogli sami zająć się wyżywieniem. [tv_wonder_organization_competence|E] lub [prosperity|E] na miejscu płaci za zaległe wynagrodzenia."
 tv_engineering_department.7115.a:0 "Rozerwij harmonogram wynagrodzeń i narysuj go na nowo zgodnie z bardziej rygorystycznym harmonogramem, aby przyciągnąć sprzedawców z powrotem."
 tv_engineering_department.7115.b:0 "Niech obóz zostanie pozbawiony rynku, a robotnicy niech zajmą się jedzeniem."
 tv_engineering_department.7116.t:0 "Budowa: Rusztowanie mostu znika z dnia na dzień"
 tv_engineering_department.7116.d:0 "Rusztowanie gotowe do naprawy mostu w stolicy zostało w nocy po cichu załadowane na wagony budowlane, a ekipa mostowa przybyła i stwierdziła, że zniknęło drewno. Można wydłużyć własne ciągi zaopatrzenia obiektu i zamiast tego przebudować jego przejścia wokół dalszego źródła drewna, albo most stołeczny może po prostu poczekać, aż jego belki jako pierwsze dokończą cud. [tv_wonder_organization_competence|E] lub [development|E] w stolicy płaci za brakujące rusztowanie."
 tv_engineering_department.7116.a:0 "Wydłużenie dostaw surowca do zakładu i odbudowanie jego zmian w oparciu o dalsze źródło drewna."
 tv_engineering_department.7116.b:0 "Niech most stolicy poczeka, aż jego belki jako pierwsze dokończą cud."
 tv_engineering_department.7117.t:0 "Budowa: Sala Gildii stoi pusta w południe"
 tv_engineering_department.7117.d:0 "Połowa szklarzy i stolarzy stolicy pracowała na miejscu przez trzy tygodnie z rzędu, a w południe sala gildii w kraju jest obecnie w większości pusta. Mistrzowie mogą zostać przeniesieni do domów, a ekipy budowlane przebudowane wokół pozostałych uczniów, albo mistrzowie mogą po prostu pozostać na miejscu, podczas gdy stołeczne warsztaty będą przez jakiś czas bezczynne. [tv_wonder_organization_competence|E] lub [prosperity|E] w stolicy płaci za pustą salę gildii."
 tv_engineering_department.7117.a:0 "Obróć mistrzów do domu i odbuduj ekipę budowlaną z pozostałych uczniów."
 tv_engineering_department.7117.b:0 "Zatrzymaj mistrzów na miejscu, a stołeczne warsztaty niech stoją bezczynnie."
 tv_engineering_department.7118.t:0 "Konstrukcja: Platforma o krótkich rękach traci linę"
 tv_engineering_department.7118.d:0 "Lina wyciągowa zerwała się dziś rano, gdy niepełna załoga zebrała się na platformie, aby zdążyć na godzinę, i trzech ludzi zeszło z nią na dół. Gangi rezerwowe mogą zostać odsunięte od swoich zadań i jutro wrzucone na platformę, niezależnie od tego, co stanie się z harmonogramem, albo ta sama załoga może zostać odesłana z powrotem w skąpym składzie, gdy ranni zostaną wyniesieni. [tv_wonder_organization_competence|E] lub pracownik [population|E] na miejscu płaci za rozdzieloną linę."
 tv_engineering_department.7118.a:0 "Odciągnij gangi rezerwowe od ich własnych zadań i wrzuć je na platformę, do cholery z harmonogramem."
 tv_engineering_department.7118.b:0 "Wyślij tę samą ubogą załogę z powrotem, gdy ranni zostaną zabrani."
 tv_engineering_department.7119.t:0 "Konstrukcja: Zapięty most utknął konwój w błocie"
 tv_engineering_department.7119.d:0 "Most nad drogą zaopatrzeniową ugiął się pod ciężarem wozów z kamieniami i połowa konwoju tkwi teraz w błocie pod nim. Przewoźnicy na przeprawie mówią, że przewiezieją wozy za odpowiednią cenę i ktoś w ten czy inny sposób za to zapłaci."
 tv_engineering_department.7119.a:0 "Zostaw wagony tam, gdzie stoją, a resztę poprowadź wokół zepsutego mostu, niezależnie od kosztów [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7119.b:0 "Zapłać cenę przewoźnikom ze skarbca, aby przewieźć wozy dzisiaj, wyczerpując [gold|E]."
 tv_engineering_department.7120.t:0 "Konstrukcja: Pieczęć bramki drogowej nie jest już honorowana"
 tv_engineering_department.7120.d:0 "Jeźdźcy konwoju zostali zawróceni do bramki sąsiada, a na ich czarterach widniała pieczęć, której miejscowy władca już nie honorował. Ktoś musi zdecydować, czy w imieniu korony wyważyć bramę, czy też pozwolić wozom stanąć przed nią."
 tv_engineering_department.7120.a:0 "Zawróć konwój i znajdź dłuższą trasę wokół spornej bramki, pozwalając [tv_wonder_logistics_competence|E] się wyślizgnąć."
 tv_engineering_department.7120.b:0 "Przywołaj władzę korony, aby teraz wyważyć bramę, wydając [legitimacy|E] na nierozstrzygniętą jeszcze kłótnię."
 tv_engineering_department.7121.t:0 "Budowa: Wieśniacy blokują drogę w związku z trzecim zapotrzebowaniem"
 tv_engineering_department.7121.d:0 "Mieszkańcy wsi zablokowali drogę własnymi wozami, odmawiając poruszania się do czasu odwołania trzeciego zapotrzebowania w tym sezonie. Konwój nie może przejść bez wycofania się lub sprowadzenia żołnierzy, aby oczyścili drogę."
 tv_engineering_department.7121.a:0 "Wycofaj się, skieruj konwój wokół blokady i zaakceptuj zastój, jaki powoduje to w [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7121.b:0 "Wyślij żołnierzy, aby siłą oczyścili drogę i policz koszty w [stability|E]."
 tv_engineering_department.7122.t:0 "Konstrukcja: Brygadzista odmawia przyjmowania koni przed świadkami"
 tv_engineering_department.7122.d:0 "Brygadzista konwoju odmówiono doprowadzenia świeżych koni pociągowych na konkurencyjnym dworze i odesłano na oczach świadków. Zdobycie koni oznacza teraz wyłudzanie przysług, które zawstydzają sąd, aby się zgodził; ich brak oznacza, że wozy czołgają się przez resztę drogi."
 tv_engineering_department.7122.a:0 "Wyślij brygadzistę ze zmęczonymi końmi, które już ma, i pozwól, aby opóźnienie dało znać o [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7122.b:0 "Wyzywaj publicznie przysługi, aby zawstydzić konkurencyjny dwór do wydania świeżych koni, wydając na to [prestige|E]."
 tv_engineering_department.7123.t:0 "Konstrukcja: Carters dowodzą końmi rodu szlacheckiego"
 tv_engineering_department.7123.d:0 "Woźnicy konwoju zarekwirowali konie zaprzęgowe należące do szlacheckiego rodu, gdy zaprzęgom cudu zabrakło, a domownicy żądają ich zwrotu przed zapadnięciem zmroku. Zawracanie koni zatrzymuje wozy; trzymanie ich opóźnia cierpliwość domowników."
 tv_engineering_department.7123.a:0 "Wróć dziś wieczorem konie do domu szlacheckiego i pozwól wozom poczekać bez nich, kosztem [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7123.b:0 "Niech pożyczone konie będą pracować w konwoju trochę dłużej, niezależnie od tego, co zrobi to z [estate_satisfaction|E] wśród szlachty."
 tv_engineering_department.7124.t:0 "Konstrukcja: Wozy przejechały w święto"
 tv_engineering_department.7124.d:0 "Najkrótsza droga zaopatrzeniowa przecina teren klasztoru i wozy przejeżdżały przez nią w święto, zanim komukolwiek przyszło do głowy poprosić o pozwolenie. Mnisi zamknęli bramę i chcą, aby konwój albo zawrócił, albo odpowiedział."
 tv_engineering_department.7124.a:0 "Zawróć wozy i znajdź inną drogę wokół terenu klasztoru, pozwalając, aby objazd kosztował [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7124.b:0 "Przepchnij konwój przez bramę zgodnie z planem i pozwól, aby przestępstwo usiadło z [estate_satisfaction|E] wśród duchowieństwa."
 tv_engineering_department.7125.t:0 "Budowa: Konwój przeczekuje burzę na Rynku"
 tv_engineering_department.7125.d:0 "Konwój zaparkował swoje wagony na noc na rynku miejskim, aby przeczekać burzę, i od tego czasu straganiarze nie mogli otworzyć. Handlarze żądają dzisiaj oczyszczenia placu, niezależnie od tego, czy będzie burza, czy nie."
 tv_engineering_department.7125.a:0 "Wysuńcie teraz wozy na zewnątrz i pozwólcie, aby burza spowolniła [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7125.b:0 "Zatrzymajcie jeszcze chwilę wozy na placu i pozwólcie, aby gniew handlarzy spadł na [estate_satisfaction|E] wśród mieszczan."
 tv_engineering_department.7126.t:0 "Budowa: Ta sama wioska traci woły po raz trzeci"
 tv_engineering_department.7126.d:0 "W tym miesiącu trzy razy w tej samej wiosce zamawiano woły i wozy do konwoju, a pola nie były zaorane. Albo zwierzęta wrócą do pługa, albo wozy same się ciągną."
 tv_engineering_department.7126.a:0 "Wyślij woły z powrotem na pola i pozwól konwojowi kuśtykać bez nich, kosztem [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7126.b:0 "Zarekwiruj woły po raz czwarty i pozwól chłopom pokazać zmęczenie wioski w [estate_satisfaction|E]."
 tv_engineering_department.7127.t:0 "Budowa: Osuwisko zasypuje drogę do miejsca budowy"
 tv_engineering_department.7127.d:0 "Osuwisko wkopało ostatni odcinek drogi w teren i jedynym szybkim rozwiązaniem jest rozebranie nowo ułożonego placu postojowego w celu wypełnienia i poszycia. Albo obiekt zrezygnuje z własnych prac przygotowawczych, albo konwój będzie czekał przed zjeżdżalnią."
 tv_engineering_department.7127.a:0 "Pozostaw place postojowe nienaruszone i pozwól konwojowi usiąść na zewnątrz zjeżdżalni, kosztem [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7127.b:0 "Zniszcz nowo ułożone place w celu wypełnienia i poszycia, aby oczyścić drogę, wydając [development|E] na miejscu."
 tv_engineering_department.7128.t:0 "Budowa: Należy poszerzyć drogę za straganami robotniczymi"
 tv_engineering_department.7128.d:0 "Wagony wymagają poszerzenia drogi obok stoisk pracowników na terenie zakładu, a tamtejsi sprzedawcy nie mają gdzie handlować. Albo stragany opadają, żeby przepuścić konwój, albo wozy przeciskają się obok nich czołgając się."
 tv_engineering_department.7128.a:0 "Niech wozy przecisną się pełzając i pozostawią stoiska w pozycji stojącej, kosztem [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7128.b:0 "Oczyść stragany sprzedawców, aby poszerzyć drogę dla konwoju, wydając [prosperity|E] na miejscu."
 tv_engineering_department.7129.t:0 "Budowa: Ulice stolicy są podarte, aby zepchnąć konwój"
 tv_engineering_department.7129.d:0 "W stolicy woźnicy i ekipy brukarskie zostały odciągnięte od swojej zwykłej pracy, aby zepchnąć zablokowany konwój ostatnią milę do miasta. Ulice stolicy są na wpół zniszczone i na wpół puste, niezależnie od tego, czy wozy czekają, czy nie."
 tv_engineering_department.7129.a:0 "Wyślij załogę stolicy z powrotem do swojej pracy i pozwól konwojowi utknąć u bram, kosztem [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7129.b:0 "Zatrzymaj załogę stolicy wycofaną z ulic, aby dokończyła wciąganie wozów, wydając [development|E] w stolicy."
 tv_engineering_department.7130.t:0 "Budowa: Zatrzymany ładunek zajmuje stołeczny Rynek"
 tv_engineering_department.7130.d:0 "Konwój zarekwirował centralny rynek stolicy, aby składować zablokowany ładunek cudu, a karawany, które zwykle tam handlowały, zostały zawrócone na tydzień. Albo ładunek ruszy dalej i rynek zostanie ponownie otwarty, albo plac na dłużej pozostanie magazynem."
 tv_engineering_department.7130.a:0 "Natychmiast przesuń ładunek, choćby z grubsza, i odciąż [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7130.b:0 "Zostaw ładunek na placu i trzymaj karawany z daleka, wydając [prosperity|E] w stolicy."
 tv_engineering_department.7131.t:0 "Konstrukcja: Robotnicy są przywiązywani do lin zamiast wołów"
 tv_engineering_department.7131.d:0 "Ponieważ zwierzęta pociągowe wyczerpały się i nie było już nowych, brygadziści zaczęli przywiązywać robotników do lin, aby ręcznie ciągnęli osierocone wozy. Albo mężczyźni będą dalej ciągnąć, aż do wyczerpania, albo wózki pozostaną tam, gdzie utknęły."
 tv_engineering_department.7131.a:0 "Zamiast pracować dalej, zostaw wózki tam, gdzie stoją, kosztem [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7131.b:0 "Trzymaj robotników ciągnących liny, dopóki wózki nie poruszą się, spędzając [population|E] na miejscu."
 tv_engineering_department.7132.t:0 "Budowa: Kamieniarze przerywają pracę za darmo"
 tv_engineering_department.7132.d:0 "Cech kamieniarzy wstrzymał pracę, nie otrzymując wynagrodzenia przez dwa miesiące z rzędu. Ich majster stoi przy bramie z księgą i zaciśniętą pięścią, a ktoś musi otworzyć albo podwórze, albo skarbiec."
 tv_engineering_department.7132.a:0 "Pozwól nożom pracować, a postęp [tv_wonder_construction|E] poczekaj."
 tv_engineering_department.7132.b:0 "Zapłać zaległości w [gold|E] i utrzymuj dłuta w ruchu."
 tv_engineering_department.7133.t:0 "Konstrukcja: pretendent powołuje się na brakujący nakaz"
 tv_engineering_department.7133.d:0 "Do rady dotarła wieść, że od murarzy pobierano opłaty bez zwyczajowego nakazu, a pretendent już przytacza to jako dowód, że korona rządzi według kaprysu. Za skrót musi ktoś odpowiedzieć – albo samo dzieło, albo zlecenie, które je zleciło."
 tv_engineering_department.7133.a:0 "Przypomnij sobie opłatę i pozwól, aby postęp [tv_wonder_construction|E] pozostał w tyle."
 tv_engineering_department.7133.b:0 "Podtrzymaj nakaz i pozwól, aby kosztował koronę [legitimacy|E]."
 tv_engineering_department.7134.t:0 "Konstrukcja: Wieśniacy blokują tor wózka swoimi ciałami"
 tv_engineering_department.7134.d:0 "Mieszkańcy wsi, których posesje zostały ogrodzone ze względu na drogę do kamieniołomu, własnymi ciałami zablokowali tor dla wozów. Albo wozy zawrócą dziś wieczorem, albo żołnierze oczyszczą drogę i wieś o tym pamięta."
 tv_engineering_department.7134.a:0 "Zawróć wózki i pozwól, aby postęp [tv_wonder_construction|E] poczekał."
 tv_engineering_department.7134.b:0 "Wyślij strażnika, aby oczyścił tor i wydaj [stability|E], który kosztuje."
 tv_engineering_department.7135.t:0 "Budowa: Ambasador zwiedza na wpół zawalone rusztowanie"
 tv_engineering_department.7135.d:0 "Zagraniczny ambasador odwiedził to miejsce wcześnie i znalazł rusztowanie do połowy zawalone na zielonej zaprawie; jego raport domowy jest już w przygotowaniu. Nadzorca może wstrzymać pracę, aby ją ponownie wykonać prawidłowo, lub pozwolić ambasadorowi napisać to, co zobaczył."
 tv_engineering_department.7135.a:0 "Zniszcz wadliwą sekcję i pozwól, aby postęp [tv_wonder_construction|E] uległ zahamowaniu."
 tv_engineering_department.7135.b:0 "Pozostaw rusztowanie w pozycji stojącej i pozwól, aby list kosztował koronę [prestige|E]."
 tv_engineering_department.7136.t:0 "Konstrukcja: Lord odkrywa swój rezerwat myśliwski oznaczony jako kamieniołom"
 tv_engineering_department.7136.d:0 "Miejscowy władca odkrył swój rezerwat myśliwski, na którym znajdował się kamieniołom cudu, i wściekły udał się do sądu, żądając albo wycofania się geodetów, albo naprawienia honoru jego rodziny. Ktoś poniżej musi ustąpić."
 tv_engineering_department.7136.a:0 "Wezwij inspektorów i pozwól, aby postęp [tv_wonder_construction|E] pozostał w tyle."
 tv_engineering_department.7136.b:0 "Utrzymaj linię kamieniołomu i pozwól, aby wśród szlachty kosztowało to [estate_satisfaction|E]."
 tv_engineering_department.7137.t:0 "Budowa: Fundacja odbudowuje stare cmentarzysko"
 tv_engineering_department.7137.d:0 "Kopacze przygotowujący fundamenty odnaleźli stary parafialny cmentarz, którego nikt nie odnotował, a księża odmawiają pobłogosławienia dalszych prac, dopóki nie zostanie należycie pochowany. Ktoś musi wybrać pomiędzy łopatami a sakramentami."
 tv_engineering_department.7137.a:0 "Zatrzymaj kopaczy do czasu zakończenia rytuału ponownego pochówku i poczekaj na postęp [tv_wonder_construction|E]."
 tv_engineering_department.7137.b:0 "Nakaż kontynuację kopania i niech wśród duchowieństwa będzie to kosztować [estate_satisfaction|E]."
 tv_engineering_department.7138.t:0 "Konstrukcja: Wozy murowane połykają plac handlowy"
 tv_engineering_department.7138.d:0 "Plac handlowy od tygodnia jest w połowie pochłonięty przez murowane wozy, a mistrzowie cechu twierdzą, że kolejny tydzień zrujnuje jesienny jarmark. Albo wozy znajdą dziś nową trasę, albo targi otworzą się na plac budowy."
 tv_engineering_department.7138.a:0 "Przekieruj wózki i pozwól [tv_wonder_construction|E] spowolnić postęp."
 tv_engineering_department.7138.b:0 "Trzymaj wozy na placu i niech kosztują [estate_satisfaction|E] wśród mieszczan."
 tv_engineering_department.7139.t:0 "Konstrukcja: Załoga Corvee tęskni za ostatnim suchym tygodniem"
 tv_engineering_department.7139.d:0 "Załogi pańszczyźniane ściągnięte z trzech wiosek na misję w tym miesiącu przegapiły ostatni suchy tydzień żniw, a naczelnicy pytają, czy na pierwszym miejscu są ich pola, czy cud. Jedno z dwojga musi dać."
 tv_engineering_department.7139.a:0 "Wyślij załogi z powrotem na pola i pozwól [tv_wonder_construction|E] spowolnić postęp."
 tv_engineering_department.7139.b:0 "Zatrzymaj załogi na miejscu i niech to będzie kosztować wśród chłopów [estate_satisfaction|E]."
 tv_engineering_department.7140.t:0 "Budowa: Zawalona ściana zakopuje własne warsztaty"
 tv_engineering_department.7140.d:0 "Ściana oporowa zawaliła się w ciągu nocy i pogrzebała niedokończone warsztaty i sklepy, które wyrosły wokół tego miejsca. Właściwa ich odbudowa będzie kosztować witrynę coś w obu przypadkach – robocizna wciągnięta w cud lub to, co się wokół niego kryje."
 tv_engineering_department.7140.a:0 "Odciągnij załogi od cudu, aby wesprzeć warsztaty i pozwól, aby postęp [tv_wonder_construction|E] spadł."
 tv_engineering_department.7140.b:0 "Zostaw warsztaty w gruzach i niech kosztują [development|E] na miejscu."
 tv_engineering_department.7141.t:0 "Budowa: Handlarze wypędzani w kierunku nowego składowiska"
 tv_engineering_department.7141.d:0 "Handlarze i małe warsztaty, które powstały, aby nakarmić brygady robocze, zostały w tym tygodniu wypędzone, aby oczyścić teren pod nowe składowisko, a wraz z nimi niewielka gospodarka zakładu ucichła. Zapasy lub zajęcie własne obiektu – jedno z dwóch utrzymuje ziemię."
 tv_engineering_department.7141.a:0 "Oddaj ziemię handlarzom i pozwól, aby postęp [tv_wonder_construction|E] czekał na stosie."
 tv_engineering_department.7141.b:0 "Zachowaj plac składowania i pozwól, aby koszt był [prosperity|E] na miejscu."
 tv_engineering_department.7142.t:0 "Budowa: Każdy mason w stolicy jest zajęty"
 tv_engineering_department.7142.d:0 "Naprawa mostów w stolicy utknęła w martwym punkcie, ponieważ do najnowszego projektu cudu zarezerwowano wszystkich murarzy i wóz w mieście. Sędziowie chcą, aby ich załoga wróciła przed upadkiem przęsła; strona chce, żeby były o miesiąc dłużej."
 tv_engineering_department.7142.a:0 "Wypuść masonów z powrotem do stolicy i pozwól, aby postęp [tv_wonder_construction|E] spowolnił."
 tv_engineering_department.7142.b:0 "Zatrzymaj murarzy na miejscu i pozwól, aby w stolicy kosztowało to [development|E]."
 tv_engineering_department.7143.t:0 "Budowa: Kamienne wózki zamykają dwie ulice w stolicy"
 tv_engineering_department.7143.d:0 "Wozy z obrobionym kamieniem przewożące się przez dzielnicę targową stolicy zamknęły na tydzień dwie ulice, a tamtejsi sklepikarze twierdzą, że handel przenosi się już gdzie indziej. Albo konwoje znajdą dłuższą trasę, albo dzielnica nadal krwawi według zwyczaju."
 tv_engineering_department.7143.a:0 "Przekieruj konwoje na dłuższą metę i pozwól, aby postęp [tv_wonder_construction|E] pozostał w tyle."
 tv_engineering_department.7143.b:0 "Utrzymuj konwoje na krótkiej trasie i pozwól, aby w stolicy kosztowało to [prosperity|E]."
 tv_engineering_department.7144.t:0 "Budowa: Gorączka rozprzestrzenia się po obozie robotniczym"
 tv_engineering_department.7144.d:0 "Przez obóz robotniczy przeszła gorączka, a lekarze mówią, że chorzy muszą odpocząć, bo inaczej choroba rozprzestrzeni się na całą załogę. Ktoś musi wybrać pomiędzy przepracowaniem ich i utratą pracy, a powstrzymaniem ich i utratą pracowników."
 tv_engineering_department.7144.a:0 "Powstrzymaj załogę, aby zregenerowała się i pozwól, aby postęp [tv_wonder_construction|E] uległ spowolnieniu."
 tv_engineering_department.7144.b:0 "Przepracuj przez to chorych i pozwól, aby kosztowało to pracę [population|E] na miejscu."
 tv_engineering_department.7145.t:0 "Budowa: Nowa luka w skarbcu"
 tv_engineering_department.7145.d:0 "Cud losuje monety szybciej, niż oczekiwały księgi. Skarbiec może wyjaśnić niedobór, ale wyjaśnieniem nie jest bicie srebra."
 tv_engineering_department.7145.a:0 "Rozciąga księgi, aby zakryć szczelinę."
 tv_engineering_department.7146.t:0 "Konstrukcja: Kurz na pieczęci królewskiej"
 tv_engineering_department.7146.d:0 "Królewskie poparcie jest rozciągnięte ze względu na zbyt wiele kompromisów. Uszczelnienie nadal trzyma, ale wygląda na cieńsze."
 tv_engineering_department.7146.a:0 "Pozwala, aby pieczęć królewska była odrobinę cieńsza."
 tv_engineering_department.7147.t:0 "Budowa: Ciche miasta są zakłócone"
 tv_engineering_department.7147.d:0 "Rytm budowy napiera na zwyczajne życie. Rynki otwierają się do późna, wioski narzekają, a porządek daje trochę spokoju."
 tv_engineering_department.7147.a:0 "Pozwalamy wioskom narzekać i bez względu na wszystko idziemy dalej."
 tv_engineering_department.7148.t:0 "Konstrukcja: Trybunał traci kolor"
 tv_engineering_department.7148.d:0 "Dwór nadaje kolor dziełom, a w zamian otrzymuje kurz. Prestiż blaknie w drobnych publicznych żartach i niedokończonych przechwałkach."
 tv_engineering_department.7148.a:0 "Zamienia trochę blasku na kilka dworskich żartów."
 tv_engineering_department.7149.t:0 "Konstrukcja: Zimne słowa przy szlachetnych stołach"
 tv_engineering_department.7149.d:0 "Szlacheckie domy po raz kolejny ustępują. Ustępstwo ma charakter formalny i zimny, co często jest gorsze niż odmowa."
 tv_engineering_department.7149.a:0 "Akceptuje zimne, formalne ustępstwo szlachty."
 tv_engineering_department.7150.t:0 "Konstrukcja: Marszczy brwi przed ołtarzem"
 tv_engineering_department.7150.d:0 "Święty kalendarz ponownie pochyla się nad miejscem pracy. Duchowni są posłuszni, ale posłuszeństwo ma granice."
 tv_engineering_department.7150.a:0 "Akceptujemy posłuszeństwo duchowieństwa, bez względu na jego krawędzie i tak dalej."
 tv_engineering_department.7151.t:0 "Konstrukcja: Cieńsze księgi rachunkowe na rynku"
 tv_engineering_department.7151.d:0 "Biznes rynkowy jest skupiony wokół projektu. Mieszczanie mogą czerpać korzyści z wielkości, ale nie wtedy, gdy wszystkie drogi do niej są zablokowane."
 tv_engineering_department.7151.a:0 "Oczyść drogi i buduj dalej!"
 tv_engineering_department.7152.t:0 "Budowa: Cięższe plecy na wsiach"
 tv_engineering_department.7152.d:0 "Rolnictwo wiejskie bierze na siebie kolejny ciężar. Projekt postępuje, a cierpliwość wioski staje się coraz cieńsza."
 tv_engineering_department.7152.a:0 "Zrzuca dodatkowy ciężar na wiejskie barki."
 tv_engineering_department.7153.t:0 "Budowa: Teren rezygnuje ze swoich ulic"
 tv_engineering_department.7153.d:0 "Strona rezygnuje z większej części swojej zwykłej tkaniny. Cud przyszłości zyskuje przestrzeń, a obecne ulice tracą użytkowanie."
 tv_engineering_department.7153.a:0 "Znakuje te ulice dla jutrzejszego cudu."
 tv_engineering_department.7154.t:0 "Budowa: Na terenie obiektu robi się ciszej"
 tv_engineering_department.7154.d:0 "W miarę jak zwykła giełda zbliża się do pomnika, na miejscu robi się spokojniej pod względem handlowym. Dobrobyt można przekierować tylko tyle razy, zanim się przerzedzi."
 tv_engineering_department.7154.a:0 "Po raz kolejny kierujemy handel obiektem w stronę pomnika."
 tv_engineering_department.7155.t:0 "Budowa: projekty kapitałowe ustępują miejsca"
 tv_engineering_department.7155.d:0 "Projekty kapitałowe znów ustępują miejsca cudom. Miasto królewskie pozostaje wspaniałe, ale część jego konstrukcji jest pożyczona."
 tv_engineering_department.7155.a:0 "Nadaje cudowi oprawę stolicy."
 tv_engineering_department.7156.t:0 "Budowa: Cichsze ulice w stolicy"
 tv_engineering_department.7156.d:0 "Rynki stolicy tracą nieco jasności, gdy projekt przyciąga kredyty i towary. Sąd może nazwać to patriotycznym; kupcy nazywają to wolniejszym handlem."
 tv_engineering_department.7156.a:0 "Każdy pomnik skądś czerpie swój blask."
 tv_engineering_department.7157.t:0 "Konstrukcja: Nazwiska dodane do listy kontuzji"
 tv_engineering_department.7157.d:0 "Nazwiska są dodawane do listy obrażeń. Praca trwa, ale każdy nowy znak zmienia sposób, w jaki robotnicy patrzą na kamień."
 tv_engineering_department.7157.a:0 "Zapamiętaj nazwy i kontynuuj!"
 tv_engineering_department.7158.t:0 "Konstrukcja: Cisza u drzwi skarbca"
 tv_engineering_department.7158.d:0 "Ostre żądanie ze strony strony powoduje, że skarbiec jest wyraźnie pusty. Pomnik nadal stoi, a królestwo płaci, zanim będzie mogło cokolwiek podziwiać."
 tv_engineering_department.7158.a:0 "Opróżnia skarbiec i mimo wszystko pozwala, aby kamień wzniósł się w górę."
 tv_engineering_department.7159.t:0 "Konstrukcja: Mandat Pęknięcia przed budową"
 tv_engineering_department.7159.d:0 "Wymagania w miejscu pracy zmuszają koronę do przyjęcia niegodnej postawy. Obietnica wielkości opiera się teraz na nadszarpniętym autorytecie."
 tv_engineering_department.7159.a:0 "Pozwalamy koronie się zgiąć, aby ściany mogły się podnieść."
 tv_engineering_department.7160.t:0 "Budowa: Zamów drzazgi w opłacie"
 tv_engineering_department.7160.d:0 "Gwałtowne zakłócenia przedostają się za płot. Urzędnicy mogą podać przyczynę, ale nie mogą sprawić, że kraj poczuje się uspokojony, wymieniając ją."
 tv_engineering_department.7160.a:0 "Pozwólmy niepokojom wypłynąć poza płot."
 tv_engineering_department.7161.t:0 "Konstrukcja: Honor słabnie w miejscach publicznych"
 tv_engineering_department.7161.d:0 "Publiczne zakłopotanie na stronie rozprzestrzenia się szybciej niż jakiekolwiek oficjalne sprostowanie. Honor płaci za kamień, który jeszcze nie stoi."
 tv_engineering_department.7161.a:0 "Niech mówią!"
 tv_engineering_department.7162.t:0 "Konstrukcja: Szlachetna cierpliwość jest wyrzeźbiona"
 tv_engineering_department.7162.d:0 "Projekt wcina się w szlachetną cierpliwość, dopóki uprzejmość nie jest już w stanie zasłonić dźwięku. Pomnik jest biednym gościem, gdy zjada dziedzictwo."
 tv_engineering_department.7162.a:0 "Pozwala szlachcie narzekać, podczas gdy murarstwo się rozwija."
 tv_engineering_department.7163.t:0 "Budowa: W zakrystii kończy się cierpliwość"
 tv_engineering_department.7163.d:0 "Żądanie budowlane depcze zbyt blisko ołtarza. Duchowni nie zapominają, kiedy pobożność traktowana jest jako otwarta przestrzeń."
 tv_engineering_department.7163.a:0 "Przyjmujemy zimne milczenie duchowieństwa jako cenę kamienia."
 tv_engineering_department.7164.t:0 "Budowa: Gniew dociera na ulice"
 tv_engineering_department.7164.d:0 "Gniew dociera do witryn sklepowych, gdy miejsce pracy pochłania przestrzeń, czas i kredyt. Miasto słyszy pomnik, zanim go zobaczy."
 tv_engineering_department.7164.a:0 "Pozwala, aby witryny sklepowe narzekały, podczas gdy rusztowanie się wspinało."
 tv_engineering_department.7165.t:0 "Budowa: Wiejski gniew nie będzie cichy"
 tv_engineering_department.7165.d:0 "Gniew mieszkańców wsi nie będzie ucichł po tej dacie. Cień cudu dociera do gospodarstw, które mogą nigdy nie ujrzeć jego ukończonego oblicza."
 tv_engineering_department.7165.a:0 "Niech pola to zniosą!"
 tv_engineering_department.7166.t:0 "Budowa: Witryna się cofa"
 tv_engineering_department.7166.d:0 "Prace drążą teren na tyle mocno, że można go cofnąć. Pomnik jeszcze nie powstał, ale miejsce wokół niego już zapłaciło."
 tv_engineering_department.7166.a:0 "Cofa miejsce, aby pomnik mógł ruszyć do przodu."
 tv_engineering_department.7167.t:0 "Budowa: Dobrobyt obiektu został zahamowany"
 tv_engineering_department.7167.d:0 "Miejsce pracy przez pewien czas tłumi lokalny rynek. Wozy wciąż przybywają, ale mniej z nich obsługuje miasto wokół kamienia."
 tv_engineering_department.7167.a:0 "Pozwól, aby lokalny rynek się rozrzedził, podczas gdy prace będą kontynuowane."
 tv_engineering_department.7168.t:0 "Konstrukcja: Kapitał płaci kamieniem"
 tv_engineering_department.7168.d:0 "Kapitał płaci kamieniem, robocizną i opóźnionymi naprawami. Odległy pomnik staje się bardziej realny, a plany pobliskich stają się puste."
 tv_engineering_department.7168.a:0 "Pozwoliliśmy, aby naprawy stolicy poczekały na odległy cud."
 tv_engineering_department.7169.t:0 "Budowa: Handel Królewskiego Miasta jest ograniczony"
 tv_engineering_department.7169.d:0 "Prace utrudniają handel w mieście królewskim. Wspaniałość w oddali przytępia ulice, które muszą ją finansować."
 tv_engineering_department.7169.a:0 "Przytępia ulice królewskiego miasta, aby finansować wspaniałość gdzie indziej."
 tv_engineering_department.7170.t:0 "Konstrukcja: Pot przenika do krwi"
 tv_engineering_department.7170.d:0 "Pot przenika do krwi w tym miejscu. Pomnik nie zostaje odwołany, co może być najokrutniejszą częścią lekcji."
 tv_engineering_department.7170.a:0 "Działamy dalej, choć strona zapłaciła za to krwią."
 tv_engineering_department.7171.t:0 "Konstrukcja: [tv_great_engineer|E] wygrywa na ulicy"
 tv_engineering_department.7171.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] zmienia wycieczkę techniczną w publiczny triumf. Rezultatem jest znaczna poprawa [tv_wonder_domestic_support|E].\n\n#G To zdarzenie miało miejsce, ponieważ obecny [tv_great_engineer|E] ma efektywną zdolność wojskową powyżej 80.#!"
 tv_engineering_department.7171.a:0 "Zmienia rutynową inspekcję w publiczny triumf."
 tv_engineering_department.7172.t:0 "Konstrukcja: [tv_great_engineer|E] Przerysowuje wielką linię"
 tv_engineering_department.7172.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] przerysowuje główną oś z pewnością, która czyni większy plan wiarygodnym. Rezultatem jest znaczna poprawa [tv_wonder_scale_competence|E].\n\n#G To zdarzenie miało miejsce, ponieważ obecny [tv_great_engineer|E] ma efektywną zdolność wojskową powyżej 80.#!"
 tv_engineering_department.7172.a:0 "Sprawia, że wielka oś wygląda na nieuniknioną, a nie lekkomyślną."
 tv_engineering_department.7173.t:0 "Konstrukcja: [tv_great_engineer|E] Odbudowuje harmonogram"
 tv_engineering_department.7173.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] przebudowuje harmonogram tak przejrzyście, że przestrzegają go nawet rywalizujący brygadziści. Rezultatem jest znaczna poprawa [tv_wonder_organization_competence|E].\n\n#G To zdarzenie miało miejsce, ponieważ obecny [tv_great_engineer|E] ma efektywną zdolność wojskową powyżej 80.#!"
 tv_engineering_department.7173.a:0 "Dotrzymujemy kroku nowemu harmonogramowi."
 tv_engineering_department.7174.t:0 "Konstrukcja: [tv_great_engineer|E] otwiera drogę"
 tv_engineering_department.7174.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] otwiera drogę dostaw, która sprawia, że stare opóźnienia wyglądają niemal głupio. Rezultatem jest znaczna poprawa [tv_wonder_logistics_competence|E].\n\n#G To zdarzenie miało miejsce, ponieważ obecny [tv_great_engineer|E] ma efektywną zdolność wojskową powyżej 80.#!"
 tv_engineering_department.7174.a:0 "Droga wreszcie otwarta!"
 tv_engineering_department.7175.t:0 "Konstrukcja: [tv_great_engineer|E] kieruje głównymi pracami"
 tv_engineering_department.7175.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] kieruje głównymi pracami przez problem, który utknął w martwym punkcie mniejszych rąk. Rezultatem jest znaczna poprawa postępu [tv_wonder_construction|E].\n\n#G To zdarzenie miało miejsce, ponieważ obecny [tv_great_engineer|E] ma efektywną zdolność wojskową powyżej 80.#!"
 tv_engineering_department.7175.a:0 "Przejeżdża zablokowane prace w czystości."
 tv_engineering_department.7176.t:0 "Konstrukcja: [tv_great_engineer|E] uspokaja plotki"
 tv_engineering_department.7176.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] odpowiada na plotki, podając wystarczająco proste wyjaśnienia, aby zapewnić zaufanie opinii publicznej. Projekt zyskuje coraz większą poprawę w [tv_wonder_domestic_support|E].\n\n#G To zdarzenie miało miejsce, ponieważ obecny [tv_great_engineer|E] ma efektywną zdolność wojskową powyżej 50.#!"
 tv_engineering_department.7176.a:0 "Ucisza plotki zwykłą rozmową."
 tv_engineering_department.7177.t:0 "Konstrukcja: [tv_great_engineer|E] Ustawia miarę"
 tv_engineering_department.7177.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] znajduje wystarczający margines w witrynie, aby oszczędzić projektowi nieśmiałego projektu. Projekt zyskuje coraz większą poprawę w [tv_wonder_scale_competence|E].\n\n#G To zdarzenie miało miejsce, ponieważ obecny [tv_great_engineer|E] ma efektywną zdolność wojskową powyżej 50.#!"
 tv_engineering_department.7177.a:0 "Dajemy planowi wystarczająco dużo miejsca, aby był odważny."
 tv_engineering_department.7178.t:0 "Konstrukcja: [tv_great_engineer|E] prostuje rolki"
 tv_engineering_department.7178.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] porządkuje uporczywy bałagan ekip, narzędzi i zegarków. Projekt zyskuje coraz większą poprawę w [tv_wonder_organization_competence|E].\n\n#G To zdarzenie miało miejsce, ponieważ obecny [tv_great_engineer|E] ma efektywną zdolność wojskową powyżej 50.#!"
 tv_engineering_department.7178.a:0 "Przywraca porządek załodze, narzędziom i wachtom."
 tv_engineering_department.7179.t:0 "Konstrukcja: [tv_great_engineer|E] Opuszcza konwój"
 tv_engineering_department.7179.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] usuwa najgorszy węzeł w harmonogramie konwoju. Projekt zyskuje coraz większą poprawę w [tv_wonder_logistics_competence|E].\n\n#G To zdarzenie miało miejsce, ponieważ obecny [tv_great_engineer|E] ma efektywną zdolność wojskową powyżej 50.#!"
 tv_engineering_department.7179.a:0 "Usuwa najgorszy węzeł na linii zasilającej."
 tv_engineering_department.7180.t:0 "Konstrukcja: [tv_great_engineer|E] Pasuje do złącza krytycznego"
 tv_engineering_department.7180.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] pasuje do najważniejszego elementu i pozwala szybciej rozpocząć kolejny etap. Projekt zyskuje coraz większą poprawę postępu w [tv_wonder_construction|E].\n\n#G To zdarzenie miało miejsce, ponieważ obecny [tv_great_engineer|E] ma efektywną zdolność wojskową powyżej 50.#!"
 tv_engineering_department.7180.a:0 "Cała naprzód!"
 tv_engineering_department.7181.t:0 "Konstrukcja: [tv_great_engineer|E] podbija tłum"
 tv_engineering_department.7181.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] stawia niedokończone dzieła przed tłumem i ufa spektaklowi. Decyzja może unieważnić [tv_wonder_domestic_support|E] lub słono kosztować placówkę.\n\n#Y To zdarzenie miało miejsce, ponieważ obecny [tv_great_engineer|E] ma efektywną zdolność wojskową od 20 do 80.#!"
 tv_engineering_department.7181.a:0 "Pozwala tłumowi osądzić niedokończone kamienie."
 tv_engineering_department.7182.t:0 "Konstrukcja: [tv_great_engineer|E] powiększa plan"
 tv_engineering_department.7182.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] zleca powiększenie planu, zanim rozwiane zostaną wszelkie wątpliwości. Decyzja może unieważnić [tv_wonder_scale_competence|E] lub słono kosztować placówkę.\n\n#Y To zdarzenie miało miejsce, ponieważ obecny [tv_great_engineer|E] ma efektywną zdolność wojskową od 20 do 80.#!"
 tv_engineering_department.7182.a:0 "Nakazuje powiększenie planu, zanim wątpliwości zostaną wyjaśnione."
 tv_engineering_department.7183.t:0 "Konstrukcja: [tv_great_engineer|E] przepisuje zmianę"
 tv_engineering_department.7183.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] przepisuje zmiany w ciągu jednego popołudnia i rzuca wyzwanie podwórkowi, aby dotrzymać kroku. Decyzja może unieważnić [tv_wonder_organization_competence|E] lub słono kosztować placówkę.\n\n#Y To zdarzenie miało miejsce, ponieważ obecny [tv_great_engineer|E] ma efektywną zdolność wojskową od 20 do 80.#!"
 tv_engineering_department.7183.a:0 "Przepisujemy zmiany i rzucamy wyzwanie stoczni, aby dotrzymać kroku."
 tv_engineering_department.7184.t:0 "Konstrukcja: [tv_great_engineer|E] wybiera ryzykowną drogę"
 tv_engineering_department.7184.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] wysyła wózki na trudną drogę i przedkłada kalkulację nad przyzwyczajenie. Decyzja może unieważnić [tv_wonder_logistics_competence|E] lub słono kosztować placówkę.\n\n#Y To zdarzenie miało miejsce, ponieważ obecny [tv_great_engineer|E] ma efektywną zdolność wojskową od 20 do 80.#!"
 tv_engineering_department.7184.a:0 "Wysyła wózki na trudniejszą drogę, stawiając kalkulację nad przyzwyczajeniem."
 tv_engineering_department.7185.t:0 "Konstrukcja: [tv_great_engineer|E] testuje szybszą metodę"
 tv_engineering_department.7185.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] testuje szybszą metodę, w przypadku której awaria byłaby bardzo publiczna. Decyzja może zahamować postęp [tv_wonder_construction|E] lub słono kosztować placówkę.\n\n#Y To zdarzenie miało miejsce, ponieważ obecny [tv_great_engineer|E] ma efektywną zdolność wojskową od 20 do 80.#!"
 tv_engineering_department.7185.a:0 "Wypróbuj szybszą metodę - niech sprawdzi się publicznie!"
 tv_engineering_department.7186.t:0 "Konstrukcja: [tv_great_engineer|E] błędnie liczy monetę"
 tv_engineering_department.7186.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] błędnie ocenia koszt naprawy i pozostawia skarb na pokrycie elegancji. Prace trwają, ale [gold|E] cierpi z powodu przeoczenia.\n\n#R To zdarzenie miało miejsce, ponieważ obecny [tv_great_engineer|E] ma efektywne zdolności wojskowe poniżej 50.#!"
 tv_engineering_department.7186.a:0 "Po cichu reguluje braki, zanim konto zostanie zakwestionowane."
 tv_engineering_department.7187.t:0 "Konstrukcja: [tv_great_engineer|E] Zapomina o sądzie"
 tv_engineering_department.7187.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] zapomina, że władza królewska to też materiał i wydaje ją beztrosko. Prace trwają, ale [legitimacy|E] cierpi z powodu przeoczenia.\n\n#R To zdarzenie miało miejsce, ponieważ obecny [tv_great_engineer|E] ma efektywne zdolności wojskowe poniżej 50.#!"
 tv_engineering_department.7187.a:0 "Powstrzymujemy nieostrożne używanie imienia korony."
 tv_engineering_department.7188.t:0 "Konstrukcja: [tv_great_engineer|E] błędnie odczytuje wioski"
 tv_engineering_department.7188.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] nie docenia, ile zakłóceń może spowodować schludne rozwiązanie inżynieryjne. Prace trwają, ale [stability|E] cierpi z powodu przeoczenia.\n\n#R To zdarzenie miało miejsce, ponieważ obecny [tv_great_engineer|E] ma efektywne zdolności wojskowe poniżej 50.#!"
 tv_engineering_department.7188.a:0 "Wygładza zakłócenia pozostawione po uporządkowanym rozwiązaniu."
 tv_engineering_department.7189.t:0 "Konstrukcja: [tv_great_engineer|E] mówi za wcześnie"
 tv_engineering_department.7189.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] mówi zbyt pewnie, zanim praca będzie mogła poprzeć przechwałki. Prace trwają, ale [prestige|E] cierpi z powodu przeoczenia.\n\n#R To zdarzenie miało miejsce, ponieważ obecny [tv_great_engineer|E] ma efektywne zdolności wojskowe poniżej 50.#!"
 tv_engineering_department.7189.a:0 "Wracaj z przechwałkami!"
 tv_engineering_department.7190.t:0 "Konstrukcja: [tv_great_engineer|E] lekceważy szlachtę"
 tv_engineering_department.7190.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] traktuje szlachetną cierpliwość tak, jakby była kolejnym zapasem zapasów. Prace trwają, ale [estate_satisfaction|E] wśród szlachty cierpi z powodu przeoczenia.\n\n#R To zdarzenie miało miejsce, ponieważ obecny [tv_great_engineer|E] ma efektywną zdolność wojskową poniżej 50.#!"
 tv_engineering_department.7190.a:0 "Przypomina inżynierowi, że szlachetna cierpliwość nie jest zbiorem, z którego można czerpać."
 tv_engineering_department.7191.t:0 "Konstrukcja: [tv_great_engineer|E] zakłóca kalendarz"
 tv_engineering_department.7191.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] porusza się po kalendarzu religijnym tak, jakby był tabelą dostaw. Prace trwają, ale [estate_satisfaction|E] wśród duchownych cierpi z powodu przeoczenia.\n\n#R To zdarzenie miało miejsce, ponieważ obecny [tv_great_engineer|E] ma efektywną zdolność wojskową poniżej 50.#!"
 tv_engineering_department.7191.a:0 "Niech jednak ołtarze prowadzą swój własny kalendarz."
 tv_engineering_department.7192.t:0 "Konstrukcja: [tv_great_engineer|E] blokuje rynek"
 tv_engineering_department.7192.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] blokuje zwykły handel, starając się zapewnić czystszą linię dla witryny. Prace trwają, ale [estate_satisfaction|E] wśród mieszczan cierpi z powodu przeoczenia.\n\n#R To zdarzenie miało miejsce, ponieważ obecny [tv_great_engineer|E] ma efektywną zdolność wojskową poniżej 50.#!"
 tv_engineering_department.7192.a:0 "Ponownie otwieramy pas targowy, który został zamknięty."
 tv_engineering_department.7193.t:0 "Konstrukcja: [tv_great_engineer|E] nie docenia wiosek"
 tv_engineering_department.7193.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] myli wyczerpane wioski z niewykorzystaną rezerwą. Prace trwają, ale [estate_satisfaction|E] wśród chłopów cierpi z powodu przeoczenia.\n\n#R To zdarzenie miało miejsce, ponieważ obecny [tv_great_engineer|E] ma efektywną zdolność wojskową poniżej 50.#!"
 tv_engineering_department.7193.a:0 "Daj odpocząć wyczerpanym wioskom, zamiast dać się ponownie wciągnąć."
 tv_engineering_department.7194.t:0 "Konstrukcja: [tv_great_engineer|E] przecina niewłaściwe ulice"
 tv_engineering_department.7194.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] pomija błędne ustalenia lokalne i nazywa lukę użyteczną. Prace trwają, ale [development|E] na miejscu cierpi z powodu przeoczenia.\n\n#R To zdarzenie miało miejsce, ponieważ obecny [tv_great_engineer|E] ma efektywną zdolność wojskową poniżej 50.#!"
 tv_engineering_department.7194.a:0 "Łatki na aranżacjach, które zostały przez pomyłkę przecięte."
 tv_engineering_department.7195.t:0 "Konstrukcja: [tv_great_engineer|E] zapewnia źródło utrzymania obiektu"
 tv_engineering_department.7195.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] wypiera lokalne źródła utrzymania, jednocześnie zwalniając miejsce na prace. Prace trwają, ale [prosperity|E] na miejscu cierpi z powodu przeoczenia.\n\n#R To zdarzenie miało miejsce, ponieważ obecny [tv_great_engineer|E] ma efektywną zdolność wojskową poniżej 50.#!"
 tv_engineering_department.7195.a:0 "Znów robimy miejsce dla źródeł utrzymania, które wypchnęła polana."
 tv_engineering_department.7196.t:0 "Konstrukcja: [tv_great_engineer|E] nadużywa kapitału"
 tv_engineering_department.7196.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] nadużywa zasobów kapitałowych, jak gdyby miasto królewskie nie miało własnych planów. Prace trwają, ale [development|E] w stolicy cierpi z powodu przeoczenia.\n\n#R To zdarzenie miało miejsce, ponieważ obecny [tv_great_engineer|E] ma efektywną zdolność wojskową poniżej 50.#!"
 tv_engineering_department.7196.a:0 "Zwraca niewłaściwie wykorzystane zasoby do własnych planów stolicy."
 tv_engineering_department.7197.t:0 "Konstrukcja: [tv_great_engineer|E] zakłóca działanie Królewskiego Miasta"
 tv_engineering_department.7197.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] zakłóca handel miasta królewskiego, rozwiązując lokalny problem inżynieryjny. Prace trwają, ale [prosperity|E] w stolicy cierpi z powodu przeoczenia.\n\n#R To zdarzenie miało miejsce, ponieważ obecny [tv_great_engineer|E] ma efektywną zdolność wojskową poniżej 50.#!"
 tv_engineering_department.7197.a:0 "Uspokajamy handel w mieście królewskim, zanim zakłócenia się rozprzestrzenią."
 tv_engineering_department.7198.t:0 "Konstrukcja: [tv_great_engineer|E] błędnie ocenia limit pracy"
 tv_engineering_department.7198.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] błędnie ocenia limit ciał pracujących. Prace są kontynuowane, ale robotnik [population|E] na miejscu cierpi z powodu przeoczenia.\n\n#R To zdarzenie miało miejsce, ponieważ obecny [tv_great_engineer|E] ma efektywną zdolność wojskową poniżej 50.#!"
 tv_engineering_department.7198.a:0 "Zmniejsz napięcie, zanim rozdasz więcej!"
 tv_engineering_department.7199.t:0 "Konstrukcja: [tv_great_engineer|E] łamie księgę"
 tv_engineering_department.7199.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] pozwala, aby możliwy do uniknięcia błąd przedarł się przez konta i opróżnił więcej monet, niż duma może usprawiedliwić. Błąd nie wystarczy, aby zakończyć cud, który może być jego najbrzydszą częścią.\n\n#R To zdarzenie miało miejsce, ponieważ obecny [tv_great_engineer|E] ma efektywną zdolność wojskową poniżej 20.#!"
 tv_engineering_department.7199.a:0 "Zaznacza stratę i po cichu zamyka księgę."
 tv_engineering_department.7200.t:0 "Konstrukcja: [tv_great_engineer|E] rani koronę"
 tv_engineering_department.7200.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] zamienia możliwe do uniknięcia uszkodzenie miejsca korony w widoczną ranę korony. Błąd nie wystarczy, aby zakończyć cud, który może być jego najbrzydszą częścią.\n\n#R To zdarzenie miało miejsce, ponieważ obecny [tv_great_engineer|E] ma efektywną zdolność wojskową poniżej 20.#!"
 tv_engineering_department.7200.a:0 "Nosimy nową bliznę korony i kontynuujemy."
 tv_engineering_department.7201.t:0 "Konstrukcja: [tv_great_engineer|E] niepokoi kraj"
 tv_engineering_department.7201.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] wpędza kraj w chaos, próbując rozwiązać problem z witryną. Błąd nie wystarczy, aby zakończyć cud, który może być jego najbrzydszą częścią.\n\n#R To zdarzenie miało miejsce, ponieważ obecny [tv_great_engineer|E] ma efektywną zdolność wojskową poniżej 20.#!"
 tv_engineering_department.7201.a:0 "Pozostawia zaburzenie, które samo się wypala."
 tv_engineering_department.7202.t:0 "Konstrukcja: [tv_great_engineer|E] robi spektakl"
 tv_engineering_department.7202.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] czyni z witryny spektakl i wciąga w nią dworski honor. Błąd nie wystarczy, aby zakończyć cud, który może być jego najbrzydszą częścią.\n\n#R To zdarzenie miało miejsce, ponieważ obecny [tv_great_engineer|E] ma efektywną zdolność wojskową poniżej 20.#!"
 tv_engineering_department.7202.a:0 "Niech sąd będzie miał swoje widowisko!"
 tv_engineering_department.7203.t:0 "Konstrukcja: [tv_great_engineer|E] gniewa domy"
 tv_engineering_department.7203.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] denerwuje domy, rozwiązując problem z witryną za pomocą ich uprawnień. Błąd nie wystarczy, aby zakończyć cud, który może być jego najbrzydszą częścią.\n\n#R To zdarzenie miało miejsce, ponieważ obecny [tv_great_engineer|E] ma efektywną zdolność wojskową poniżej 20.#!"
 tv_engineering_department.7203.a:0 "Wykorzystuje dobrą wolę domów, aby prace mogły trwać."
 tv_engineering_department.7204.t:0 "Konstrukcja: [tv_great_engineer|E] obraża duchowieństwo"
 tv_engineering_department.7204.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] obraża duchowieństwo, zmuszając świętą cierpliwość do zapłaty za świecki kamień. Błąd nie wystarczy, aby zakończyć cud, który może być jego najbrzydszą częścią.\n\n#R To zdarzenie miało miejsce, ponieważ obecny [tv_great_engineer|E] ma efektywną zdolność wojskową poniżej 20.#!"
 tv_engineering_department.7204.a:0 "Pozwalamy, aby święta cierpliwość opłacała rachunek za świecki kamień."
 tv_engineering_department.7205.t:0 "Konstrukcja: [tv_great_engineer|E] prowokuje mieszczan"
 tv_engineering_department.7205.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] prowokuje mieszczan, traktując handel jak luźne rusztowanie. Błąd nie wystarczy, aby zakończyć cud, który może być jego najbrzydszą częścią.\n\n#R To zdarzenie miało miejsce, ponieważ obecny [tv_great_engineer|E] ma efektywną zdolność wojskową poniżej 20.#!"
 tv_engineering_department.7205.a:0 "Pozostawia kupcom naprawę własnego rusztowania."
 tv_engineering_department.7206.t:0 "Konstrukcja: [tv_great_engineer|E] niszczy wioski"
 tv_engineering_department.7206.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] przełamuje cierpliwość wioski żądaniem, którego należało unikać. Błąd nie wystarczy, aby zakończyć cud, który może być jego najbrzydszą częścią.\n\n#R To zdarzenie miało miejsce, ponieważ obecny [tv_great_engineer|E] ma efektywną zdolność wojskową poniżej 20.#!"
 tv_engineering_department.7206.a:0 "Prosimy mieszkańców wsi o ułaskawienie, ponieważ mogliśmy im oszczędzić."
 tv_engineering_department.7207.t:0 "Konstrukcja: [tv_great_engineer|E] uszkadza miejsce"
 tv_engineering_department.7207.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] szkodzi witrynie, rozwiązując problem techniczny z lokalnym zniszczeniem. Błąd nie wystarczy, aby zakończyć cud, który może być jego najbrzydszą częścią.\n\n#R To zdarzenie miało miejsce, ponieważ obecny [tv_great_engineer|E] ma efektywną zdolność wojskową poniżej 20.#!"
 tv_engineering_department.7207.a:0 "Załata ranę, którą spowodowały same naprawy."
 tv_engineering_department.7208.t:0 "Konstrukcja: [tv_great_engineer|E] niszczy rynki witryny"
 tv_engineering_department.7208.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] niszczy rynki witryny poprzez decyzję, której można zapobiec. Błąd nie wystarczy, aby zakończyć cud, który może być jego najbrzydszą częścią.\n\n#R To zdarzenie miało miejsce, ponieważ obecny [tv_great_engineer|E] ma efektywną zdolność wojskową poniżej 20.#!"
 tv_engineering_department.7208.a:0 "Niech tak będzie – niech stragany ucichną!"
 tv_engineering_department.7209.t:0 "Konstrukcja: [tv_great_engineer|E] Wydrąża plany stolicy"
 tv_engineering_department.7209.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] podważa plany stolicy mające na celu zatuszowanie błędu na miejscu. Błąd nie wystarczy, aby zakończyć cud, który może być jego najbrzydszą częścią.\n\n#R To zdarzenie miało miejsce, ponieważ obecny [tv_great_engineer|E] ma efektywną zdolność wojskową poniżej 20.#!"
 tv_engineering_department.7209.a:0 "Odważa się na własne plany stolicy mające na celu załatanie błędu na stronie."
 tv_engineering_department.7210.t:0 "Konstrukcja: [tv_great_engineer|E] przyćmiewa dobrobyt stolicy"
 tv_engineering_department.7210.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] osłabia dobrobyt kapitału poprzez porażkę, która nigdy nie powinna była dotrzeć na rynek. Błąd nie wystarczy, aby zakończyć cud, który może być jego najbrzydszą częścią.\n\n#R To zdarzenie miało miejsce, ponieważ obecny [tv_great_engineer|E] ma efektywną zdolność wojskową poniżej 20.#!"
 tv_engineering_department.7210.a:0 "Obserwujemy, jak blask stolicy przygasa w związku z porażką, której nigdy nie powinna była widzieć."
 tv_engineering_department.7211.t:0 "Konstrukcja: [tv_great_engineer|E] powoduje ofiary w ludziach"
 tv_engineering_department.7211.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] powoduje ofiary, przepuszczając przez załogi awarię, której można zapobiec. Błąd nie wystarczy, aby zakończyć cud, który może być jego najbrzydszą częścią.\n\n#R To zdarzenie miało miejsce, ponieważ obecny [tv_great_engineer|E] ma efektywną zdolność wojskową poniżej 20.#!"
 tv_engineering_department.7211.a:0 "Liczy zabitych, których załogi nigdy nie powinny były stracić."
