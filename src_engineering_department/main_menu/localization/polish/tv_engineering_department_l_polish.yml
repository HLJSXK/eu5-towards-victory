 TV_ENGINEERING_CEREMONY_LOCKED_TEXT: "Przed rozpoczęciem zadania [tv_wonder_construction|E] należy ukończyć zadanie [tv_wonder_ceremony|e]."
 TV_ENGINEERING_CEREMONY_GENERIC_SECTION_TITLE: "@construction! Ogólne cuda"
 TV_ENGINEERING_CEREMONY_HELP_GENERIC_TEXT_1: "Po zbudowaniu wybierz jeden styl [tv_wonder_ceremony|e] i spełnij jego wymagania, aby określić końcowy efekt cudu."
 TV_ENGINEERING_CEREMONY_UNIQUE_SECTION_TITLE: "@construction! Unikalne cuda"
 TV_ENGINEERING_CEREMONY_HELP_UNIQUE_TEXT_1: "Większość modeli [tv_wonder_unique|e] rozpoczyna pracę nad [tv_wonder_ceremony|e] automatycznie po zakończeniu budowy, bez konieczności ręcznego wybierania stylu."
 TV_ENGINEERING_CEREMONY_HELP_UNIQUE_TEXT_2: "[tv_wonder_ceremony|e] przebiega przez 8 etapów, automatycznie przechodząc do kolejnego etapu co kilka miesięcy; każdy etap ma swój własny koszt i smak."
