 TV_ENGINEERING_ORG_LOG_HELP_ORGANIZATION_TEXT_3: "Miesięczny postęp budowy jest dodatkowo modyfikowany przez [tv_wonder_logistics_competence|e] lokalizacji."
 TV_ENGINEERING_ORG_LOG_HELP_ORGANIZATION_TEXT_4: "Każdy działający [ShowBuildingTypeName('tv_wonder_labor_camp')] kosztuje około #N 25#!@gold! w miesięcznym utrzymaniu."
