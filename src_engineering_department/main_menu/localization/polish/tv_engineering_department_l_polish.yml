 TV_WONDER_FINAL_LEVEL_REWARD_TT: "Dzięki ukończeniu poziomu [ROOT.GetVariable('tv_wonder_level').GetValue|0] Great Project zyskujemy:"
 TV_WONDER_FINAL_SUPPORT_REWARD_TT: "Ponieważ pozostało nam wsparcie krajowe [ROOT.GetVariable('tv_wonder_final_support_reward_source').GetValue|0], zyskujemy:"
 tv_engineering_department.10.t: "[tv_great_engineer|E]: Zmarł wielki inżynier"
 tv_engineering_department.10.d: "Nasz [tv_great_engineer|E] nie żyje. Wiadomości krążą po [tv_engineering_department|e] poprzez zamknięte skrzynki na rysunki, przestają przeglądać stoły i asystenci nagle nie chcą wymazać ostatnich znaków kredą. Każdy niedokończony plan wydaje się teraz bardziej kruchy niż wczoraj. Cudowny mechanizm może prowadzić swoje księgi, ale [tv_wonder_construction|e] potrzebuje żywego umysłu, aby zamienić ambicje w sekwencję. Dopóki nie zostanie wyznaczony następca, królestwo ma kamień, siłę roboczą i nadzieję, ale nie ma mistrza budowlanego, który by ich nakłonił do wyrażenia zgody.\n\n#weak Stanowisko Wielkiego Inżyniera jest teraz wolne — jak najszybciej wyznacz następcę w Dziale Inżynierii, aby konstrukcja cudu mogła działać.#!"
 tv_engineering_department.10.a: "Znajdź następcę, zanim plany staną się zimne."
 tv_engineering_department.20.t: "[tv_wonder_construction|E]: Projekt się załamuje"
 tv_engineering_department.20.d: "Rezerwa [tv_wonder_domestic_support|e] została wyczerpana. Dworzanie, którzy kiedyś chwalili projekt, teraz pamiętają, że pilne sprawy załatwiono gdzie indziej, rzecznicy nieruchomości na nowo odkrywają swoje zastrzeżenia, a dostawcy proszą o zapłatę, zanim ruszy kolejny wózek. Ponieważ wielkiego projektu nie da się obronić, [tv_engineering_department|e] musi porzucić zamknięty cud i znieść hańbę. Ziemia pozostaje, wczesne ślady pozostały i być może pozostały pewne kamienie, ale polityczny most pod nimi zawalił się. Żaden pomnik nie może opierać się na ciszy, strachu i niespłaconych obietnicach.\n\n#weak Cud został siłą porzucony — możesz ponownie ocenić lokalizację i plany w Dziale Inżynierskim i zacząć od nowa w dowolnym momencie.#!"
 tv_engineering_department.20.a: "Niech wstyd zostanie wyraźnie zapisany."
 tv_engineering_department.30.t: "[tv_wonder_construction|E]: Projekt nabiera kształtu"
 tv_engineering_department.30.d: "[tv_great_engineer|E] wypełnił pierwsze strony: trudne wzniesienia, kosztowne wątpliwości, ukryte zalety terenu i kilka eleganckich niemożliwości przekreślonych z widocznym żalem. Koncepcja nie jest już nastrojem w warsztacie. Jest gotowy, aby stać się propozycją, którą sąd może porównać, zakwestionować i ostatecznie wybrać.\n\n#weak Koncepcja projektu jest gotowa — udaj się do Działu Inżynieryjnego, aby przejrzeć propozycję [tv_great_engineer|E], zaakceptować ją lub wymagać ponownego przemyślenia, a następnie przyspieszyć debatę na temat cudu zbudowania wystarczającego wsparcia krajowego.#!"
 tv_engineering_department.30.a: "Pokaż nam projekty."
 tv_engineering_department.100.t: "[tv_wonder_debate|E]: Zlot Domów Szlachetnych"
 tv_engineering_department.100.d: "Kilka rodów szlacheckich zdecydowało, że cud poszerzy ich pamięć tak samo jak pamięć królestwa. Ich heroldowie mówią o siedzibach przodków, nieśmiertelnych imionach i przyjemnej możliwości, że przyszłe pokolenia mogą pomylić prywatną chwałę z celem publicznym. [tv_engineering_department|e] ich nie koryguje. Wsparcie to wsparcie, a [tv_wonder_domestic_support|e] często pojawia się w biżuterii. Ich głosy odbijają się teraz echem po sądzie z użyteczną głośnością."
 tv_engineering_department.100.a: "Niech będą widoczne."
 tv_engineering_department.101.t: "[tv_wonder_debate|E]: Szlachetny luz"
 tv_engineering_department.101.d: "Rozeszły się pogłoski, że cud pochłonie szlachetne przywileje, nie przywracając wystarczającego honoru. Kilka domów zaczęło liczyć nie tyle na przyszłą świetność pomnika, ile na miejsca, zwolnienia, robotników i pierwszeństwo ceremonii, jakie może je to kosztować. [tv_engineering_department|e] może mierzyć kamień, ale stopień rannych jest trudniejszy do zbadania. Poparcie wśród arystokracji słabnie, a każde wahanie sprawia, że cały projekt wydaje się cięższy. Duma może być lżejsza od marmuru, ale znacznie trudniej ją podnieść."
 tv_engineering_department.101.a: "Ich duma jest kosztowna."
 tv_engineering_department.102.t: "[tv_wonder_debate|E]: Mieszczanie widzą szansę"
 tv_engineering_department.102.d: "Mistrzowie gildii i finansiści zaczynają mówić o kontraktach, drogach, magazynach i przyszłych tłumach. Widzą w cudzie nie tylko wspaniałości, ale faktury, prawa do transportu, wynajęte pokoje i wnuki wciąż pobierające opłaty. [tv_engineering_department|e] słucha uważnie, ponieważ handel ma talent do sprawiania, by ambicje brzmiały praktycznie. Ich entuzjazm nadaje debacie nowy impet. Dobrobyt nadszedł z ubrudzonymi atramentem palcami i doskonałą arytmetyką."
 tv_engineering_department.102.a: "Dobrobyt ma przekonujący głos."
 tv_engineering_department.103.t: "[tv_wonder_debate|E]: Sprzedawcy liczą koszty"
 tv_engineering_department.103.d: "Niektórzy mieszczanie ostrzegają teraz, że cud zwiąże siłę roboczą, kredyty i transport. Nie potępiają wprost chwały; pytają jedynie, ile wozów, zarobków i magazynów musi być pod nim uwięzionych. Taką ostrożność trudniej jest odrzucić niż panikę, ponieważ każde zdanie ma wiarygodną kolumnę liczb. [tv_engineering_department|e] stopniowo budzi zaufanie opinii publicznej. Księgi księgowe mogą ranić równie mocno jak przemówienia czytane na głos."
 tv_engineering_department.103.a: "Księgi rachunkowe mogą ranić równie mocno jak przemówienia."
 tv_engineering_department.104.t: "[tv_wonder_debate|E]: Błogosławieństwo duchowne"
 tv_engineering_department.104.d: "Wybitni duchowni postrzegają ten cud jako widzialny znak porządku i oddania. Kazania porównują mierzony kamień do posłusznych dusz, stabilne fundamenty do wiernej doktryny, a pracę publiczną do karności sprawiedliwego ludu. [tv_engineering_department|e] czerpie korzyści z tego języka nawet wtedy, gdy inżynierowie prywatnie wolą piony od metafor. Debata nabiera uroczystego, uspokajającego tonu. [tv_wonder_domestic_support|E] wznosi się łatwiej, gdy wydaje się, że niebo aprobuje rusztowania."
 tv_engineering_department.104.a: "Przydatne błogosławieństwo."
 tv_engineering_department.105.t: "[tv_wonder_debate|E]: Kazania przeciwko nadmiarowi"
 tv_engineering_department.105.d: "Kaznodzieje potępiają ten projekt jako marność wykutą w kamieniu. Pytają, czy głodna wioska potrzebuje marmuru, czy wysokość władcy może ocalić duszę i czy duma staje się święta tylko dlatego, że ją zmierzył murarz. Opłata znajduje słuchaczy wśród tych, którzy już są zaniepokojeni kosztami. [tv_engineering_department|e] może odpowiedzieć na wiele zastrzeżeń, ale kazania są zbudowane tak, aby przetrwać kontrargumenty. Wiara może błogosławić fundamenty, ale może też je odrzucić."
 tv_engineering_department.105.a: "Wiara może także odrzucić marmur."
 tv_engineering_department.200.t: "[tv_wonder_construction|E]: Jednostka konstrukcyjna ukończona"
 tv_engineering_department.200.d: "Kolejna część cudu przekroczyła widoczny próg. Schodzą rusztowania, nadzorcy zaznaczają ukończoną jednostkę, a pracownicy cofają się z ostrożną dumą ludzi, którzy wiedzą, że następne zadanie będzie równie ciężkie. Opinia publiczna wreszcie może zobaczyć, że niemożliwe staje się kamieniem, belką, kanałem czy sklepieniem. Nawet krytykom trudniej jest kpić z czegoś, co rzuca cień. [tv_wonder_construction|E] zyskał nie tylko postęp, ale także dowód.\n\n#weak Ta jednostka konstrukcyjna jest ukończona — Dział Inżynierii będzie kontynuował prace nad następną jednostką cudu.#!"
 tv_engineering_department.200.a: "Kontynuuj pracę."
 tv_engineering_department.201.t: "[tv_wonder_construction|E]: Projekt powstaje"
 tv_engineering_department.201.d: "W [SCOPE.sLocation('tv_wonder_event_location').GetName] cztery ukończone moduły spełniły swoje zadanie. Można teraz rozebrać ich tymczasowe prace i w końcu rozpocząć budowę zachowanego rdzenia samego cudu. Fundament, korpus, funkcja i zwieńczenie nie są już fragmentami rywalizującymi; są gotowe do złożenia w jeden pomnik.\n\n#weak Cztery moduły połączyły się w rdzeń cudu — obejrzyj panel Działu Inżynierii, ponieważ budowa ostatecznego budynku rozpocznie się automatycznie, gdy cud osiągnie poziom ukończenia.#!"
 tv_engineering_department.201.a: "Zdemontuj moduły i podnieś rdzeń."
 tv_engineering_department.202.t: "[tv_wonder_construction|E]: Prace są zakończone"
 tv_engineering_department.202.d: "[tv_engineering_department|E] ogłosił zakończenie fazy konstrukcyjnej. Miejsca pracy są demontowane, ekipy robocze wycofują się, a księgi ostatnich wykonawców zamykają się z satysfakcją, którą naprawdę cieszą się tylko księgowi. Pomnik już stoi, ale sam kamień nie jest jeszcze przeznaczeniem. Niedokończone pytanie zmieniło się z tego, jak go zbudować, na jak go poświęcić. Królestwo stworzyło ciało; [tv_wonder_ceremony|e] musi teraz nadać mu publiczną duszę.\n\n#weak Faza budowy została ukończona — odwiedź Dział Inżynierii, aby wybrać styl ceremonii poświęcenia i rozpocząć ceremonię cudu.#!"
 tv_engineering_department.202.a: "Przygotuj ceremonię."
 tv_engineering_department.202.a.tt: "$tv_wonder_labor_camp$ na miejscu pracy zostanie rozebrany."
 tv_engineering_department.203.t: "[tv_wonder_construction|E]: Debata została rozstrzygnięta"
 tv_engineering_department.203.d: "Sąd ogłosił koniec debaty nad cudami. Opozycja nie zniknęła, ale została policzona, udzielono odpowiedzi, przekupiona lub włączona do oficjalnego planu. Projekt pozostawia teraz za sobą przemówienia i wkracza w mierzony świat terenu, dróg, nachyleń i odległości. [tv_great_engineer|e] pyta o lokalizację do sprawdzenia. Od tego momentu [tv_wonder_domestic_support|e] będzie powoli spływać, więc następna kolejność powinna być praktyczna: wybierz, gdzie faktycznie może stanąć pomnik.\n\n#weak Debata się zakończyła — wybierz miejsce budowy cudu w Dziale Inżynierii, aby rozpocząć prace geodezyjne i budowę.#!"
 tv_engineering_department.203.a: "Rozpocznij ankietę."
 tv_engineering_department.300.t: "[tv_wonder_survey|E]: Ankieta zakończona"
 tv_engineering_department.300.d_high: "[tv_wonder_survey|E] powraca z doskonałymi odczytami. Wybrany teren może znieść ambicje, zaopatrzenie może do niego dotrzeć, a ekipy robocze widzą ścieżkę przez teren, zanim zostanie założony pierwszy stały obóz. [tv_great_engineer|e] czyta tabele dwukrotnie, nie dlatego, że liczby są wątpliwe, ale dlatego, że dobre wieści zasługują na weryfikację. Skala, logistyka i organizacja zmierzają obecnie w tym samym kierunku. Strona wydaje się niemal gotowa stać się trudna w użyteczny sposób."
 tv_engineering_department.300.d_mid: "[tv_wonder_survey|E] powraca z użytecznymi odczytami. Ta strona nie ułatwi pracy, ale żaden uczciwy cud nigdy tego nie obiecał. Ziemia ma ograniczenia, drogi mają nastroje, a plan pracy będzie wymagał dyscypliny, a nie romantyzmu. Mimo to [tv_engineering_department|e] może teraz planować z uwzględnieniem wymienionych przez siebie słabości. Zmierzona przeszkoda jest już w połowie udomowiona."
 tv_engineering_department.300.d_low: "[tv_wonder_survey|E] powraca z niepokojącymi odczytami. Teren można jeszcze zadeklarować, ale mapy wyglądają nerwowo, a geodeci dobierają słowa z profesjonalną starannością. Teren, trasy lub organizacja pracowników mogą oprzeć się naszym ambicjom bardziej, niż początkowo oczekiwano. [tv_engineering_department|e] ostrzega, że inna lokalizacja może lepiej służyć cudowi. Postępowanie w tym przypadku byłoby decyzją podjętą z otwartymi oczami, co jest lepsze niż ślepota i droższe niż pewność siebie."
 tv_engineering_department.300.a: "Przejrzyj wynik."
 tv_engineering_department.310.t: "[tv_wonder_survey|E]: Ukryte podstawy"
 tv_engineering_department.310.d: "Pod proponowanymi pracami geodeci odkrywają stabilny grunt i stary kamień. To, co początkowo wydawało się jedynie solidne, teraz wydaje się prawie przygotowane, jakby jakaś zapomniana ręka pozostawiła ziemię w użytecznym porządku. Zespoły [tv_wonder_survey|e] radośnie kłócą się o obciążenie, głębokość i rzadką przyjemność znalezienia problemu, który sam się rozwiązał. Możliwa skala cudu wygląda na bardziej hojną, niż początkowo zakładano. Nawet [tv_great_engineer|e] pozwala na uśmiech przed prośbą o kolejny pomiar."
 tv_engineering_department.310.a: "Znakomicie."
 tv_engineering_department.311.t: "[tv_wonder_survey|E]: Zdradziecka ziemia"
 tv_engineering_department.311.d: "Ziemia zmienia się tam, gdzie pierwsze mapy obiecywały pewność. Stawki są chude, linie kredy nie zgadzają się już ze sobą, a ekipy badawcze zaczynają mówić krótszymi zdaniami. Dodatkowe wsparcie zawęzi praktyczną skalę cudu nie dlatego, że ambicje osłabły, ale dlatego, że Ziemia odpowiedziała, stawiając własne warunki. [tv_engineering_department|e] może nadal kontynuować. Musi po prostu przestać udawać, że uziemienie jest pasywne."
 tv_engineering_department.311.a: "Dostosuj plany."
 tv_engineering_department.312.t: "[tv_wonder_survey|E]: Oczyść linie zasilające"
 tv_engineering_department.312.d: "[tv_wonder_survey|E] wyszukuje trasy, którymi można przewozić kamień, drewno i narzędzia z mniejszym tarciem niż oczekiwano. Zaniedbana droga łączy się z użytecznym zakola rzeki, pole postojowe okazuje się szersze niż pamięć, a lokalni przewoźnicy znają już skróty, których żadna królewska mapa nie zadała sobie trudu poznania. [tv_wonder_materials|E] będzie poruszać się bardziej czysto, ponieważ ziemia zaoferowała kilka cichych przysług. Logistyka chociaż raz nie jest oskarżeniem. Pojawia się jako mapa z dobrymi marginesami."
 tv_engineering_department.312.a: "Zaznacz je dokładnie."
 tv_engineering_department.313.t: "[tv_wonder_survey|E]: Przerwane podejścia"
 tv_engineering_department.313.d: "Drogi, szlaki wodne i miejsca postoju okazują się gorsze, niż twierdzono w pierwszych raportach. Koła toną tam, gdzie powinna trzymać się droga, łodzie tracą czas tam, gdzie powinna nieść woda, a pola postojowe kurczą się w momencie, gdy wjeżdżają na nie prawdziwe wozy. Logistykę trudniej będzie okiełznać, a [tv_wonder_materials|e] nie wybaczy optymizmu. [tv_engineering_department|e] mierzy się teraz ze starą prawdą o wielkich dziełach: pomnik zaczyna się na długo przed dotarciem do niego kamienia. Czasem zaczyna się od błota."
 tv_engineering_department.313.a: "Zrekompensujemy."
 tv_engineering_department.314.t: "[tv_wonder_survey|E]: Zamówienie w terenie"
 tv_engineering_department.314.d: "Ekipy pomiarowe wpadają w czysty rytm. Wywieszane są flagi, kopiowane są notatki, nadzorcy przestają sobie zaprzeczać, a pobieżne obserwacje stają się systemem, którego przyszli pracownicy mogą faktycznie przestrzegać. Nie jest to jakieś dramatyczne odkrycie, ale może być bardziej przydatne. [tv_wonder_construction|E] polega na nudnym cudzie wielu ludzi robiących to samo w tej samej kolejności. Dziś ten cud wydaje się możliwy."
 tv_engineering_department.314.a: "Dobry nawyk."
 tv_engineering_department.315.t: "[tv_wonder_survey|E]: Zamieszanie w ankiecie"
 tv_engineering_department.315.d: "Sprzeczne mapy i rywalizujący ze sobą nadzorcy spowalniają pracę. Jedna załoga przysięga na grań, druga na drogę, a trzecia stworzyła stół tak precyzyjny, że wszyscy od razu mu nie ufają. [tv_engineering_department|e] traci zaufanie do swojego przyszłego planu organizacyjnego, ponieważ po spisaniu zamieszanie wygląda niemal oficjalnie. Cud może przetrwać zły grunt łatwiej niż złe dowodzenie. Zanim zacznie się poród, ktoś musi nauczyć mapy, aby się zgadzały."
 tv_engineering_department.315.a: "Rozwiąż to."
 tv_engineering_department.320.t: "[tv_wonder_survey|E]: Wymagane są instrumenty specjalne"
 tv_engineering_department.320.d: "Geodeci wymagają kosztownych instrumentów i wyspecjalizowanych rzemieślników. Mówią o kątach zbyt małych, by można było je zobaczyć zwykłym okiem, testach gleby zbyt delikatnych, by można było zgadywać, oraz pomiarach, które sprawiłyby, że ocena skali [tv_great_engineer|e] byłaby mniej zależna od szlachetnego optymizmu. Sąd rozpoznaje wydatki; inżynierowie słyszą precyzję. Finansowanie ich powinno usprawnić badanie, ale nauczy także każdego przyszłego wnioskodawcę, że dokładność ma swoją cenę. Odmowa pozostawia stare narzędzia na swoim miejscu, a nieznane uprzejmie się uśmiechają."
 tv_engineering_department.320.a: "Zapłać za precyzję."
 tv_engineering_department.320.b: "Pozbądź się tego, co mamy."
 tv_engineering_department.321.t: "[tv_wonder_survey|E]: Prestiż wiedzy specjalistycznej"
 tv_engineering_department.321.d: "[tv_great_engineer|E] zwraca się do sądu o publiczne poparcie kontrowersyjnej metody logistycznej. Propozycja obiecuje szybsze przemieszczanie [tv_wonder_materials|e], mniej bezczynnych pracowników i dokładnie ten rodzaj nowości, która sprawia, że konserwatywni nadzorcy zaczynają odchrząkać. Użyczenie prestiżu królestwa może sprawić, że plan zaopatrzenia będzie bardziej przekonujący. Jeśli się nie uda, zawstydzenie również będzie publiczne. Wielkie projekty często wymagają od państwa zagrania, zanim pierwszy tłum zrozumie zasady."
 tv_engineering_department.321.a: "Postaw na tym nasze imię."
 tv_engineering_department.321.b: "Brak publicznego poparcia."
 tv_engineering_department.322.t: "[tv_wonder_survey|E]: Koordynacja gildii"
 tv_engineering_department.322.d: "Dostawcy miejscy mogą pomóc w ujednoliceniu wyników badań, ale oczekują ustępstw za zakłócenia. Ich urzędnicy rozumieją wagi, zestawienia, trasy i cichą tyranię dopasowywania jednej listy do drugiej. [tv_engineering_department|e] może wykorzystać tę kompetencję, zwłaszcza zanim [tv_wonder_materials|e] zacznie działać na dobre. Jednak każda koncesja wpisuje handel nieco głębiej w pamięć pomnika. Możemy kupić zamówienie, ale porządek będzie pamiętał, kto go sprzedał."
 tv_engineering_department.322.a: "Oprzyj się na gildiach."
 tv_engineering_department.322.b: "Unikaj nowych obowiązków."
 tv_engineering_department.401.t: "[tv_wonder_ceremony|E]: Rozpoczyna się medytacja"
 tv_engineering_department.401.d: "Ukończony cud jest zasłonięty ciszą. Księża, inżynierowie i obserwatorzy królewscy odrywają się od zwykłego widowiska, aby rok oszczędności mógł nadać pomnikowi ostateczne znaczenie. [tv_wonder_ceremony|e] nie zaczyna się od hałasu, ale od jego celowej odmowy. Nawet [tv_engineering_department|e] musi nauczyć się cierpliwości, gdyż żadne obliczenia nie mogą przyspieszyć rytuału mającego uczyć powściągliwości. Odwiedzających początkowo ta cisza wytrąca z równowagi. Potem zaczynają ściszać głos, zanim zrozumieją dlaczego."
 tv_engineering_department.401.a: "Niech rok się odwróci."
 tv_engineering_department.410.t: "[tv_wonder_ceremony|E]: Prośba o wysłanników"
 tv_engineering_department.410.d: "Sąsiedni sąd prosi, abyśmy wysłali emisariusza, który będzie świadkiem inauguracji jego wielkiej osi. Zaproszenie ma charakter ceremonialny, ale podczas ceremonii państwa ćwiczą pamiętanie. Dzięki frekwencji nasze nazwisko znajdzie się wśród tych, którzy jako pierwsi zobaczyli nowy pomnik, oklaskiwali go w odpowiednim momencie i zrozumieli przesłanie bez potrzeby jego wyjaśniania. Odmowa uratowałaby podróż i utraciła miejsce w ich historii. Niektóre kamienie buduje się w domu; inni oczekują świadków z zagranicy."
 tv_engineering_department.410.a: "Wyślij emisariusza."
 tv_engineering_department.410.b: "Odrzuć zaproszenie."
 tv_engineering_department.411.t: "[tv_wonder_ceremony|E]: Przybywa emisariusz"
 tv_engineering_department.411.d: "Zaproszony sąd zgodził się. Do rytualnej procesji przyłącza się inny zagraniczny emisariusz z wyćwiczoną godnością, podróżującym orszakiem i oczami wyszkolonymi do dostrzegania zarówno wielkości, jak i słabości. [tv_wonder_ceremony|e] staje się coraz bardziej przekonujący z każdym zewnętrznym świadkiem, ponieważ chwała jest głośniejsza, gdy jest powtarzana z innym akcentem. Mistrzowie procesji ustalają kolejność wejścia; skrybowie korygują listę honorowych gości. Ceremoński postęp cudu postępuje, pojedynczo obserwując dwór."
 tv_engineering_department.411.a: "Przyjmij je z honorem."
 tv_engineering_department.412.t: "[tv_wonder_ceremony|E]: Zaproszenie odrzucone"
 tv_engineering_department.412.d: "Zaproszony dwór odmówił wysłania emisariusza. Ich odpowiedź jest na tyle uprzejma, aby uniknąć obrazy i wystarczająco chłodna, aby zostać zapamiętaną. [tv_wonder_ceremony|e] musi znaleźć swoją publiczność gdzie indziej, gdyż pomnik szukający obcego zachwytu nie może sobie pozwolić na puste miejsce w placówce dyplomatycznej. Dworzanie już sugerują nowe nazwiska, bardziej pochlebne trasy i listy, które nie brzmią jak prośby. Chwała nie lubi odmowy, ale można ją przekierować."
 tv_engineering_department.412.a: "Zaproś innego sąsiada."
 tv_engineering_department.421.t: "[tv_wonder_ceremony|E]: Rozpoczyna się Parada Triumfów"
 tv_engineering_department.421.d: "Wzdłuż osi wznoszą się transparenty, ale paradzie wciąż brakuje dowodu. Dobosze mogą ćwiczyć, konie mogą polerować kamienie ceremonialnymi kopytami, a oficerowie mogą zyskać piękną pewność siebie, ale nic z tego nie jest zwycięstwem. [tv_wonder_ceremony|e] żąda triumfu, który musi poświadczyć sama wojna. Do tego czasu Miasteczko Wojskowe będzie ubrane zgodnie z honorem, na który w pełni nie zasłużyło. Tylko zwycięstwo w wojnie zapewni pomnikowi pamięć, o którą prosi."
 tv_engineering_department.421.a: "Wtedy musi nadejść zwycięstwo."
 tv_engineering_department.431.t: "[tv_wonder_ceremony|E]: Rozpoczyna się Festiwal Obywatelski"
 tv_engineering_department.431.d: "Miasto otwiera swoje uporządkowane place na rok ceremonii, gier, procesji i nauczania publicznego. Warsztaty powolne, ale ludzie uczą się kształtu dyscypliny obywatelskiej, chodząc po niej, obserwując i narzekając na nią, aż stanie się ona znajoma. [tv_wonder_ceremony|e] zamienia przestrzeń miejską w lekcję powtarzaną pod gołym niebem. Dzieci zapamiętują trasy, zanim zrozumieją hasła. Stolica Obywatelska uczy posłuszeństwa, czyniąc je uroczystym."
 tv_engineering_department.431.a: "Niech obywatele się zbiorą."
 tv_engineering_department.461.t: "[tv_wonder_ceremony|E]: Rozpoczyna się Festiwal Wolnego Handlu"
 tv_engineering_department.461.d: "Kupcy, wysłannicy i brokerzy wypełniają port obietnicami otwartej wymiany. Dochody rosną na jakiś czas, ponieważ hojność zawsze wygląda najszlachetniej przed zamknięciem kont. [tv_wonder_ceremony|e] zamienia nabrzeża, magazyny i zatłoczone stoły w scenę wzbudzającą zaufanie zagranicznego społeczeństwa. Każdy kontrakt podpisywany publicznie uczy port mówić językiem zrozumiałym dla odległych sądów. Przez rok zysk się ugina, więc reputacja może minąć."
 tv_engineering_department.461.a: "Otwórz nabrzeża."
 tv_engineering_department.471.t: "[tv_wonder_ceremony|E]: Rozpoczyna się Festiwal Przodków"
 tv_engineering_department.471.d: "Nekropolia wkracza w rok kadzidła, genealogii i wymierzonej żałoby. Recytuje się imiona, aż wydają się cięższe od ciał, do których kiedyś należeli, a warsztaty zwalniają, a pamięć ma pierwszeństwo przed produkcją. [tv_wonder_ceremony|e] uczy dziedzinę traktowania przodków jako architektury. Każda ofiara stanowi kolejny kamień w argumencie, że żywi są rządzeni przez uporządkowanych umarłych. Żałoba, jeśli jest zorganizowana, staje się autorytetem."
 tv_engineering_department.471.a: "Niech przodkowie się zbiorą."
 tv_engineering_department.481.t: "[tv_wonder_ceremony|E]: Rozpoczyna się gildia nawigatorów"
 tv_engineering_department.481.d: "Piloci, twórcy map, mistrzowie lin i urzędnicy portowi obserwują swój ratusz pod latarnią morską. Przybywają z mapami morskimi, węzłami, kłótniami o pierwszeństwo i szczególną pewnością siebie ludzi, którzy potrafią czytać linie brzegowe przy złej pogodzie. Latarnia nie będzie ukończona, dopóki ich instytucja nie stanie. Samo światło ostrzega statki; gildia uczy kraj, jak rozumieć ostrzeżenie. [tv_wonder_ceremony|e] czeka teraz na biurokrację z solą we włosach."
 tv_engineering_department.481.a: "Zbuduj gildię."
 tv_engineering_department.491.t: "[tv_wonder_ceremony|E]: Rozpoczyna się Festiwal Wody"
 tv_engineering_department.491.d: "Kanały są ozdobione girlandami, poświęcono śluzy, a warsztaty wyciszono na rok wodnych rytuałów. Woda sprawia wrażenie posłusznej, co każdy, kto kiedykolwiek widział powódź, wie, że jest to śmiałe twierdzenie teologiczne. Produkcja nakręca się, aby kompleks mógł zapanować nad świętym porządkiem poprzez [tv_wonder_ceremony|e]. Inżynierowie patrzą, jak kapłani błogosławią to, co woleliby sprawdzić, a kapłani patrzą, jak inżynierowie mierzą to, co woleliby uświęcić. Między nimi woda wciąż się porusza."
 tv_engineering_department.491.a: "Niech wody się odwrócą."
 tv_engineering_department.501.t: "[tv_wonder_ceremony|E]: Rozpoczyna się głęboki drenaż"
 tv_engineering_department.501.d: "Inżynierowie kierują prace odwadniające w dół do miasta górniczego. Szyby będą prawie bezgłośne przez rok, podczas gdy pompy, usztywnienia i kanały podbiją głębiny. Górnicy nie lubią ciszy prawie tak samo jak wody, ale trzeba znieść jedno i drugie, zanim będzie można sięgnąć po głębsze bogactwo. [tv_wonder_ceremony|e] nie jest tutaj delikatny; to targ z ciemnością, wilgocią i cierpliwością. Kiedy prace wreszcie odetchną, miasto będzie wiedziało, jak daleko od strachu może sięgnąć."
 tv_engineering_department.501.a: "Opróżnij ciemność."
 tv_engineering_department.511.t: "[tv_wonder_ceremony|E]: Rozpoczyna się katalog gwiazd"
 tv_engineering_department.511.d: "Obserwatorium zamyka się wokół lamp, stołów i zdyscyplinowanej bezsenności. Astronomowie zaznaczają jedną gwiazdę po drugiej, nie jako rozproszone światła, ale jako wpisy w porządku publicznym, które przyszli uczeni mogą sprawdzić. Ustawodawstwo zwalnia, podczas gdy sąd skupia uwagę na niebie i instrumencie. [tv_wonder_ceremony|e] nie zakończy się dziś spektaklem; zakończy się, gdy niebiosa zostaną skopiowane z wystarczającą cierpliwością, aby stać się użytecznymi."
 tv_engineering_department.511.a: "Niech policzą niebo."
 tv_engineering_department.521.t: "[tv_wonder_ceremony|E]: Rozpoczyna się proklamacja zaćmienia"
 tv_engineering_department.521.d: "Obserwatorium przedstawiło swoją prognozę: nadejdzie zaćmienie, a sąd będzie gotowy nadać mu nazwę, zanim strach będzie mógł je nazwać pierwszy. Kapłani, uczeni, żeglarze i sceptycy – wszyscy teraz patrzą w górę z różnymi nadziejami. Każdy mijający miesiąc sprawdza roszczenie. Jeśli niebo będzie posłuszne tabelom, [tv_wonder_ceremony|e] stanie się dowodem na to, że królestwo potrafi czytać niebo, nie poddając się mu."
 tv_engineering_department.521.a: "Obserwuj niebo."
 tv_engineering_department.522.t: "[tv_wonder_ceremony|E]: Nadchodzi zaćmienie"
 tv_engineering_department.522.d: "Światło zmienia się dokładnie tam, gdzie przewidywało obserwatorium. Tłumy milkną, ale cisza nie jest paniką; wołacze powiedzieli im już, co przepowiadały uczone tablice. [tv_wonder_ceremony|e] staje się powszechnym zaufaniem w przestrzeni pomiędzy słońcem, cieniem i oddechem. Kiedy światło powróci, sąd nie tylko powoła się na mądrość. Wykazał się wyczuciem czasu, odwagą i umiejętnością zadziwienia."
 tv_engineering_department.522.a: "Niech królestwo zapamięta przepowiednię."
 tv_engineering_department.531.t: "[tv_wonder_ceremony|E]: Hołd otrzymany"
 tv_engineering_department.531.d: "Kolejny wkład przedmiotowy trafia do Pałacu Narodów. Jest on pokazany z należytą starannością: nie tylko bogactwo, ale spór o rangę widoczny dla każdego posła, który przechodzi przez salę. Galeria hołdów staje się coraz bardziej przekonująca z każdą ofiarą, ponieważ podporządkowanie, podobnie jak chwała, staje się łatwiejsze do uwierzenia, gdy ma architekturę. Ceremonia rozwija jeden wyważony akt posłuszeństwa na raz."
 tv_engineering_department.531.a: "Nagraj hołd."
 tv_engineering_department.541.t: "[tv_wonder_ceremony|E]: Rozpoczyna się dzielnica ambasad"
 tv_engineering_department.541.d: "Oznaczono fundamenty dzielnicy ambasad obok Pałacu Narodów. Obce domy zyskają drzwi, dziedzińce, przejścia dla służby i wszystkie drobne, praktyczne dostojeństwa, które sprawią, że dyplomacja będzie codzienną obecnością, a nie okazjonalną wizytą. [tv_wonder_ceremony|e] czeka teraz na zbudowaną dzielnicę, w której będą mogły zamieszkać inne sądy. Pałac może przyciągać uwagę; dzielnica ambasad uczy uwagi, jak należy pozostać."
 tv_engineering_department.541.a: "Buduj miejsca dla obcych oczu."
 tv_engineering_department.500.t: "[tv_wonder_ceremony|E]: Inauguracja projektu"
 tv_engineering_department.500.d: "[tv_engineering_department|E] ukończył [tv_wonder_ceremony|e], a pomnik jest teraz trwałym znakiem ambicji królestwa. Rusztowania zniknęły, księgi rachunkowe zostały opieczętowane, a społeczeństwo rozpoczęło pracę, której nie jest w stanie dokończyć żaden inżynier: podjęcie decyzji, co oznacza ten cud. Niektórzy nazwą to chwałą, inni nadmiarem, niektórzy dowodem na to, że wiek się zmienił. Wszyscy będą musieli się temu przyjrzeć. To już jest forma zwycięstwa."
 tv_engineering_department.500.a: "Niech wiek to zapamięta."
 tv_engineering_department.600.t: "[tv_wonder_construction|E]: Cud świata został ukończony"
 tv_engineering_department.600.d: "Nadchodzą wieści z [SCOPE.sCountry('tv_wonder_builder_country').GetName]: cud świata został ukończony w [SCOPE.sLocation('tv_wonder_completed_site').GetName]. Raporty różnią się kosztem, pięknem, przeznaczeniem i mądrością, ale są zgodne w jednym punkcie. Praca jest zbyt duża, aby pozostać lokalną. Weszło to do powszechnej rozmowy władców."
 tv_engineering_department.600.a: "Świat usłyszał."

