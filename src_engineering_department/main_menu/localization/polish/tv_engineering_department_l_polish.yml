 TV_ENGINEERING_CONSTRUCTION_PROGRESS_TT: "Każda jednostka [tv_wonder_construction_part|e] wykorzystuje postęp [tv_wonder_construction|e] z [tv_engineering_department|e]. Wymagania modułu są konfigurowane poprzez menu modów społeczności; domyślne wymagania dotyczące małych, średnich i dużych to 100 000, 200 000 i 300 000 postępów."
