 TV_ENGINEERING_CONSTRUCTION_INFO_TEXT: "Poziom Wielkiego Projektu jest równy najniższej liczbie ukończonych jednostek spośród czterech [tv_wonder_construction_part|e]. Ukończenie jednostki zapewnia [tv_wonder_domestic_support|e]; podniesienie całkowitego poziomu zapewnia kolejny bonus wsparcia."
 TV_ENGINEERING_FINISH_CONSTRUCTION_BUTTON: "@trigger_yes! Ogłoś ukończenie wielkiego projektu"
 TV_ENGINEERING_CONSTRUCTION_HELP_TEXT_1: "$BULLET$ [tv_wonder_construction|e] rozwija cztery [tv_wonder_construction_part|e] jednocześnie: Fundament, Główna konstrukcja, Funkcja i Ukoronowanie. Użyj powyższych przycisków, aby przełączyć aktualnie budowaną część."
 TV_ENGINEERING_CONSTRUCTION_HELP_TEXT_2: "$BULLET$ Poziom [tv_wonder_construction|e] zależy od tego, która część jest najbardziej z tyłu; całkowity poziom wzrasta dopiero wtedy, gdy opóźniona część ukończy nową jednostkę."
 TV_ENGINEERING_CONSTRUCTION_HELP_TEXT_3: "$BULLET$ Możesz zadeklarować, że [tv_wonder_construction|e] jest ukończony, gdy ukończy on co najmniej jeden poziom."
 TV_ENGINEERING_CONSTRUCTION_HELP_TEXT_4: "$BULLET$ Można zatem najpierw ukończyć projekt na mniejszą skalę, a później kontynuować [tv_wonder_expansion|e] na większą skalę, nie tracąc już zdobytych nagród za ukończenie."
 TV_ENGINEERING_CONSTRUCTION_HELP_TEXT_5: "$BULLET$ Ukończenie dowolnej jednostki budowlanej zapewnia [tv_wonder_domestic_support|e]; jeśli ta jednostka również podniesie całkowity poziom Wielkiego Projektu, zapewnia kolejny bonus [tv_wonder_domestic_support|e]."
 TV_ENGINEERING_CONSTRUCTION_HELP_TT: "#T Construction#!\n[tv_wonder_construction|e] rozwija cztery [tv_wonder_construction_part|e] jednocześnie: Fundament, Główna konstrukcja, Funkcja i Ukoronowanie. Użyj powyższych przycisków, aby przełączyć część aktualnie w budowie.\nPoziom [tv_wonder_construction|e] zależy od tego, która część jest najbardziej z tyłu; całkowity poziom wzrasta dopiero wtedy, gdy opóźniona część ukończy nową jednostkę.\nMożesz ogłosić, że [tv_wonder_construction|e] jest ukończony, gdy ukończy co najmniej jeden poziom.\nMożesz zatem najpierw ukończyć projekt na mniejszą skalę, a później rozszerzyć go na większą skalę, nie tracąc już zdobytych nagród za ukończenie.\nUkończenie dowolnego grantu na jednostkę konstrukcyjną [tv_wonder_domestic_support|e]; jeśli ta jednostka również podniesie całkowity poziom Wielkiego Projektu, zapewnia kolejny bonus [tv_wonder_domestic_support|e]."
