 tv_engineering_department.551.t: "[tv_wonder_ceremony|E]: Zgromadzenie uczonych"
 tv_engineering_department.551.d: "Miasto Uniwersyteckie ścisza głos w sprawie studiów. Mistrzowie, studenci, kopiści i urzędnicy gromadzą się wokół list wykładów i spornych odczytów, zamieniając ukończone ulice w całoroczne zgromadzenie. [tv_wonder_ceremony|e] nie będzie się spieszyć. Prosi królestwo o zamianę szybkości administracyjnej na program nauczania, który przetrwa obecny sąd."
 tv_engineering_department.551.a: "Niech uczeni dożyją roku."
 tv_engineering_department.552.t: "[tv_wonder_ceremony|E]: Rozpoczyna się sala kolegialna"
 tv_engineering_department.552.d: "Plany Sali Kolegialnej są zapieczętowane obok Miasta Uniwersyteckiego. Nowa sala zapewni mistrzom miejsce do formalnych kłótni, uczniom miejsce, w którym stracą pewność w przydatnych sprawach, a korona stanie się strukturą, dzięki której będzie można rozpoznać naukę bez całkowitego oswajania. [tv_wonder_ceremony|e] czeka teraz na drzwi, ławki, statuty i dach, pod którym badania mogą twierdzić, że są trwałe."
 tv_engineering_department.552.a: "Zbuduj dom do kłótni."
 tv_engineering_department.561.t: "[tv_wonder_ceremony|E]: Kopuła jest zasłonięta"
 tv_engineering_department.561.d: "Wielka kopuła jest zasłonięta na czas poświęcenia. Księża wyznaczają progi, śpiewacy ćwiczą odmierzony porządek czci, a sąd akceptuje rok, w którym legitymizacja musi przebiegać wolniej, aby świętość mogła poruszać się ostrożnie. [tv_wonder_ceremony|e] prosi królestwo, aby poczekało pod zakrytym niebem, aż świątynia będzie gotowa do otwarcia nieba."
 tv_engineering_department.561.a: "Niech kopuła będzie poświęcona."
 tv_engineering_department.571.t: "[tv_wonder_ceremony|E]: Otwierają się schody pielgrzyma"
 tv_engineering_department.571.d: "Schody do wieży świątyni są udostępniane pielgrzymom na rok wspinaczki, pauzy, śpiewu i obolałych stóp. Warsztaty narzekają, gdy praca skłania się ku procesjom, ale [tv_wonder_ceremony|e] ma uczyć wzrostu poprzez wysiłek. Każdy krok zamienia wieżę z obiektu w trasę, a każda trasa uwidacznia oddanie."
 tv_engineering_department.571.a: "Niech się wspinają."
 tv_engineering_department.572.t: "[tv_wonder_ceremony|E]: Rozpoczyna się szkoła świątynna"
 tv_engineering_department.572.d: "Nauczyciele, urzędnicy i budowniczowie kładą pod wieżą fundamenty szkoły świątynnej. [tv_wonder_ceremony|e] czeka teraz na sale lekcyjne, w których doktryna może stać się nawykiem, umiejętnością czytania i pisania, a argumentacja zdyscyplinowana poprzez rytuał. Wieża może przyciągać wzrok w górę; szkoła będzie uczyć głosy, co mają powiedzieć, gdy spojrzą."
 tv_engineering_department.572.a: "Zbuduj szkołę."
 tv_engineering_department.581.t: "[tv_wonder_ceremony|E]: Rozpoczyna się Jarmark Rzeczny"
 tv_engineering_department.581.d: "Wzdłuż poszerzonej rzeki gromadzą się budki, barki, tablice opłat i banery festiwalowe. Handel spowalnia, ponieważ rzeka ma stać się widowiskiem, zanim ponownie stanie się arterią. [tv_wonder_ceremony|e] spędzi rok, zmuszając kupców, żeglarzy i urzędników do wspólnego wprowadzenia nowego porządku wody."
 tv_engineering_department.581.a: "Niech rzeka pozna swój nowy tłum."
 tv_engineering_department.582.t: "[tv_wonder_ceremony|E]: Rozpoczyna się działalność Biura Kanału"
 tv_engineering_department.582.d: "Geodeci wyznaczają stałą siedzibę władz kanału. Budynek nie będzie na tyle okazały, by konkurować z wodociągami i właśnie dlatego jest tak ważny: śluzy, spory, opłaty za przejazd, naprawy i skargi związane z porą suchą potrzebują miejsca, w którym odpowiedzialność nie będzie mogła się ukryć. [tv_wonder_ceremony|e] czeka teraz, aż administracja przejmie ściany."
 tv_engineering_department.582.a: "Daj rzece biurko."
 tv_engineering_department.591.t: "[tv_wonder_ceremony|E]: Rozpoczyna się działalność Biura Admiralicji"
 tv_engineering_department.591.d: "Stocznia przeznacza grunt pod biuro admiralicji. Platformy startowe i dźwigi mogą budować statki, ale floty wymagają również zamówień, map, inspekcji i cierpliwych urzędników, aby drewno stało się polityką. [tv_wonder_ceremony|e] czeka teraz, aż stocznia zdobędzie uznanie marynarki wojennej."
 tv_engineering_department.591.a: "Zbuduj biuro."
 tv_engineering_department.601.t: "[tv_wonder_ceremony|E]: Bastiony w fazie prób"
 tv_engineering_department.601.d: "Miasto Star Fortress rozpoczyna rok prób. Inżynierowie testują kąty, strzelcy testują pola ostrzału, a pracownicy odkrywają, że na ścianę zaprojektowaną dla matematyki nadal trzeba płacić mięśniami. Produkcja spowalnia, gdy [tv_wonder_ceremony|e] uczy fortecę, jak odpowiadać na teorię za pomocą kamienia."
 tv_engineering_department.601.a: "Przetestuj każdy kąt."
 tv_engineering_department.602.t: "[tv_wonder_ceremony|E]: Rozpoczyna się dzielnica Arsenalu"
 tv_engineering_department.602.d: "Zaznaczono fundamenty pod dzielnicę arsenału wewnątrz miasta-twierdzy. Połączy warsztaty naprawcze, prochownie i punkty zbiórki w jedną zdyscyplinowaną dzielnicę. [tv_wonder_ceremony|e] czeka teraz na część twierdzy, która sprawi, że obrona będzie powtarzalna po ustaniu pierwszego alarmu."
 tv_engineering_department.602.a: "Zbuduj dzielnicę arsenału."
 tv_engineering_department.611.t: "[tv_wonder_ceremony|E]: Zapalają się płomienie sygnałowe"
 tv_engineering_department.611.d: "Obserwuj, jak słupki wzdłuż ściany rozpoczynają rok ćwiczeń sygnalizacyjnych. Dym, płomienie, jeźdźcy i lokalne targi – wszystko to podlega nowemu rytmowi, a handel cierpi, podczas gdy każda trasa uczy się najpierw zauważać ostrzeżenia. [tv_wonder_ceremony|e] sprawia, że czujność jest na tyle publiczna, że nawet rutynowe podróże wydają się przestrzegane."
 tv_engineering_department.611.a: "Zadbaj o jasność zegarka."
 tv_engineering_department.621.t: "[tv_wonder_ceremony|E]: Rozpoczęcie pracy w hali mistrzów płatnerzy"
 tv_engineering_department.621.d: "Zbrojownia wyznacza fundamenty sali mistrzów płatnerzy. Największe magazyny broni nie mogą opierać się wyłącznie na żelazie i księgach; potrzebują wykwalifikowanych rąk, które potrafią ocenić niepowodzenia, zanim nastąpi bitwa. [tv_wonder_ceremony|e] czeka teraz, aż jednostka zdobędzie stałe boisko."
 tv_engineering_department.621.a: "Buduj dla mistrzów."
 tv_engineering_department.631.t: "[tv_wonder_ceremony|E]: Rozpoczyna się katalog krajowy"
 tv_engineering_department.631.d: "Biblioteka Narodowa rozpoczyna swój katalog. Uczeni zamykają drzwi, rozwijają inwentarze i spowalniają machinę stanowienia prawa w kraju, jednocześnie ucząc pamięć, jak odnaleźć siebie na nowo. [tv_wonder_ceremony|e] to nie parada, ale indeks: cichy, wymagający i mocny po ukończeniu."
 tv_engineering_department.631.a: "Niech katalog rośnie."
 tv_engineering_department.632.t: "[tv_wonder_ceremony|E]: Rozpoczyna się działalność Biura Depozytów Prawnych"
 tv_engineering_department.632.d: "Budowniczowie zaznaczają biuro depozytowe obok biblioteki. Stąd będą zbierane księgi, dekrety, kopie i argumenty nie jako przysługi, ale jako zobowiązania. [tv_wonder_ceremony|e] czeka teraz na pomieszczenie, w którym zapisana pamięć krainy zostanie zatrzymana w zależności od wypadku."
 tv_engineering_department.632.a: "Zbuduj biuro pamięci."

