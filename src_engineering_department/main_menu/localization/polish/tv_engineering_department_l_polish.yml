 TV_ENGINEERING_ORG_LOG_HELP_LOGISTICS_TEXT_2: "Niedobory [ShowGoodsName('tv_wonder_materials')] powodują konieczność utrzymania [ShowBuildingTypeName('tv_wonder_labor_camp')]; poważne niedobory zmniejszają przepustowość."
