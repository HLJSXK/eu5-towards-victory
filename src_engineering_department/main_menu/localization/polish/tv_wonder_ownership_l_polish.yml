 tv_wonder_ownership.900.t:0 "[tv_wonder_construction|E]: Zaginiony cud świata"
 tv_wonder_ownership.900.d:0 "Po utracie [SCOPE.sLocation('tv_wonder_ownership_site').GetName] ukończony [tv_wonder_construction|E] nie obsługuje już naszej domeny. Wszelkie stałe korzyści związane z ceremonią narodową powiązane tylko z tym cudem zostały wycofane z naszych rejestrów.\n\n#weak Wraz z utratą prowincji stałe korzyści z cudu znikają — jeśli zostaną później odzyskane, potwierdź jego status w Dziale Inżynierii.#!"
 tv_wonder_ownership.900.a:0 "Zapisz stratę."
