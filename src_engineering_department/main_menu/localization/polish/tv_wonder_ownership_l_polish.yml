 tv_wonder_ownership.800.t:0 "[tv_wonder_construction|E]: Cud Świata zabezpieczony"
 tv_wonder_ownership.800.d:0 "Nowo nabyta prowincja [SCOPE.sLocation('tv_wonder_ownership_site').GetName] zawiera ukończony [tv_wonder_construction|E]. Jego podstawowe efekty odpowiadają teraz naszej regule, a nasi inżynierowie uznali je za możliwe miejsce rozbudowy, jeśli zachowana skala pozwoli na dalsze prace.\n\n#weak Cud należy teraz do nas — przejrzyj jego efekty w Dziale Inżynierii i zastanów się, czy można go dalej rozwijać.#!"
