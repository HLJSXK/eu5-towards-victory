 tv_engineering_department.7000.t:0 "Construcción: Las calles aplauden el sitio"
 tv_engineering_department.7000.d:0 "Unos pocos éxitos visibles en la valla convierten la curiosidad en orgullo. Los ancianos del gremio prestan nombres, los vecinos dejan de tratar las obras como una vanidad real y el proyecto gana un mayor reclamo sobre [tv_wonder_domestic_support|E]."
 tv_engineering_department.7000.a:0 "Dejemos que la nueva buena voluntad de los ancianos del gremio haga avanzar el trabajo."
 tv_engineering_department.7001.t:0 "Construcción: Una línea más amplia en la Tierra"
 tv_engineering_department.7001.d:0 "Nuevas mediciones revelan un terreno que puede tener una huella más amplia. Lo que parecía una ambición escrita en pergamino ahora tiene una base tolerable y [tv_wonder_scale_competence|E] da un salto adelante."
 tv_engineering_department.7001.a:0 "Reivindica el terreno más amplio que acaba de demostrar la encuesta."
 tv_engineering_department.7002.t:0 "Construcción: los nombres y los pedidos se ajustan a su lugar"
 tv_engineering_department.7002.d:0 "El patio se despierta con nuevas plantillas. Los equipos saben dónde ubicarse, los empleados saben qué conteo importa y [tv_wonder_organization_competence|E] aumenta porque la confusión tiene menos lugares donde esconderse."
 tv_engineering_department.7002.a:0 "Bloqueamos las nuevas listas antes de que regrese la confusión."
 tv_engineering_department.7003.t:0 "Construcción: Las carreteras y los carros encuentran su ritmo"
 tv_engineering_department.7003.d:0 "Una ruta mejor une la carretera, el agua, el almacén y el andamio. El primer convoy que lo utiliza llega casi vergonzosamente a tiempo y [tv_wonder_logistics_competence|E] aumenta."
 tv_engineering_department.7003.a:0 "¡Mantenga esos carros rodando a tiempo!"
 tv_engineering_department.7004.t:0 "Construcción: La piedra se eleva más allá de la marca"
 tv_engineering_department.7004.d:0 "La parte activa supera su marca antes de que falle la luz. Ningún milagro lo explica; los ascensores, las articulaciones y las manos simplemente se encuentran en el momento adecuado, impulsando el progreso del [tv_wonder_construction|E]."
 tv_engineering_department.7004.a:0 "Deja que los ascensores sigan pasando la marca."
 tv_engineering_department.7005.t:0 "Construcción: La conversación callejera cambia"
 tv_engineering_department.7005.d:0 "El ruido alrededor del sitio se suaviza. No es aclamación, pero sí permiso suficiente para que pasen los carros y terminen antes las discusiones; [tv_wonder_domestic_support|E] sube por un margen útil."
 tv_engineering_department.7005.a:0 "Deja pasar los carros y las discusiones se calman."
 tv_engineering_department.7006.t:0 "Construcción: Se corrige la medida"
 tv_engineering_department.7006.d:0 "Se rediseña un ángulo estrecho, se amplía un camino de servicio y la línea principal del monumento vuelve a respirar. La mejora del [tv_wonder_scale_competence|E] es pequeña pero real."
 tv_engineering_department.7006.a:0 "Amplía el camino y deja respirar el diseño."
 tv_engineering_department.7007.t:0 "Construcción: El patio aprende su ritmo"
 tv_engineering_department.7007.d:0 "Se repara un conjunto de traspasos faltantes. El trabajo es demasiado seco para una ceremonia, pero mantiene las herramientas en movimiento y mejora [tv_wonder_organization_competence|E]."
 tv_engineering_department.7007.a:0 "Parchamos la entrega y mantenemos las herramientas en movimiento."
 tv_engineering_department.7008.t:0 "Construcción: Los surcos encuentran un camino mejor"
 tv_engineering_department.7008.d:0 "Se corrige un mal giro en la línea de suministro. Menos carros esperan vacíos, menos cargas llegan rotas y [tv_wonder_logistics_competence|E] mejora."
 tv_engineering_department.7008.a:0 "Endereza el mal giro antes de que se rompan más cargas."
 tv_engineering_department.7009.t:0 "Construcción: Los martillos se acercan a su finalización"
 tv_engineering_department.7009.d:0 "Un porro rebelde finalmente encaja y el siguiente equipo puede comenzar sin otro mes de espera. El progreso de [tv_wonder_construction|E] avanza de la manera más satisfactoria: visiblemente."
 tv_engineering_department.7009.a:0 "¡Por fin encaja!"
 tv_engineering_department.7010.t:0 "Construcción: Dinero para el pan en la puerta"
 tv_engineering_department.7010.d:0 "Una multitud se reúne en la puerta y murmura que la maravilla come pan destinado a los pobres. Si el Tesoro abre su [gold|E] a la vista de la calle y paga ahora, las quejas se calmarán y [tv_wonder_domestic_support|E] subirá, pero la moneda no volverá."
 tv_engineering_department.7010.a:0 "Pague a la vista de la multitud."
 tv_engineering_department.7010.b:0 "Los libros de contabilidad son lo suficientemente delgados como para necesitar una limosna pública."
 tv_engineering_department.7011.t:0 "Construcción: Un predicador cuestiona el derecho de la Corona"
 tv_engineering_department.7011.d:0 "Un predicador local le dice a su rebaño que la maravilla se basa en el orgullo, no en ningún derecho que tenga la corona para exigirlo. Poner al real [legitimacy|E] detrás de un decreto escrito resolvería el asunto y estabilizaría [tv_wonder_domestic_support|E], antes de que el sermón se difunda más."
 tv_engineering_department.7011.a:0 "Sella el decreto y deja que la palabra de la corona cierre el asunto."
 tv_engineering_department.7011.b:0 "Un decreto real sobre las quejas de un predicador parece debilidad, no fuerza."
 tv_engineering_department.7012.t:0 "Construcción: The Quarry Road divide un campo común"
 tv_engineering_department.7012.d:0 "El nuevo camino de la cantera atraviesa los campos comunes de dos pueblos. Gastar [stability|E] para forzar el reasentamiento despejaría el camino y elevaría [tv_wonder_domestic_support|E] entre aquellos que quieren terminar la maravilla, a costa de la paz comprada con esas aldeas."
 tv_engineering_department.7012.a:0 "Ordena el reasentamiento y deja pasar el camino."
 tv_engineering_department.7012.b:0 "Los campos de dos pueblos no merecen una ruta más corta en carro."
 tv_engineering_department.7013.t:0 "Construcción: Enviados extranjeros se burlan del proyecto Vanity"
 tv_engineering_department.7013.d:0 "Los enviados de una corte rival califican la maravilla como un proyecto vanidoso demasiado grande para el tesoro que lo respalda. Gastar [prestige|E] en una lujosa recepción podría cambiar la historia que llevan a casa y aumentar [tv_wonder_domestic_support|E], pero la posición de la corona, una vez gastada en halagar a los invitados, no se recupera fácilmente."
 tv_engineering_department.7013.a:0 "Gasta en la recepción y cambia lo que los enviados llevan a casa."
 tv_engineering_department.7013.b:0 "No vale la pena gastar la posición de la corona en los chismes extranjeros."
 tv_engineering_department.7014.t:0 "Construcción: El campo de caza de un noble se convierte en un almacén de madera"
 tv_engineering_department.7014.d:0 "Los albañiles de la maravilla quieren un tramo del recorrido de caza de un noble para colocar su madera. Él lo concederá, pero sólo por un favor que la corona debe contar contra [estate_satisfaction|E] entre los nobles; gastado ahora, aún levantaría [tv_wonder_domestic_support|E] una vez que la madera comience a moverse."
 tv_engineering_department.7014.a:0 "Concédeme el favor y toma el suelo de madera."
 tv_engineering_department.7014.b:0 "La buena voluntad de un noble no justifica tenerle una deuda."
 tv_engineering_department.7015.t:0 "Construcción: Se pide la campana parroquial por su bronce"
 tv_engineering_department.7015.d:0 "Los fundadores de la maravilla quieren encargar la campana parroquial para remodelarla. El sacerdote apartará la mirada de un campanario vacío, pero cuesta [estate_satisfaction|E] entre el clero, un precio que aún dejaría a [tv_wonder_domestic_support|E] en mejor situación que un andamio sin terminar."
 tv_engineering_department.7015.a:0 "Pregunta correctamente y deja que la campana vaya a la fundición."
 tv_engineering_department.7015.b:0 "Un campanario vacío dará más que hablar de lo que valen los accesorios."
 tv_engineering_department.7016.t:0 "Construcción: Los carros de suministros ahogan la plaza del mercado"
 tv_engineering_department.7016.d:0 "Los carros de suministros de la maravilla siguen bloqueando la plaza del mercado los días de entrega. Los maestros del gremio redirigirán sus propios puestos alrededor de los carros, pero eso atrae [estate_satisfaction|E] entre los burgueses, un costo que aún permitiría recuperar algo de [tv_wonder_domestic_support|E] una vez que la plaza deje de luchar contra los carros."
 tv_engineering_department.7016.a:0 "Pregunta directamente a los gremios y deja pasar los carros."
 tv_engineering_department.7016.b:0 "Multar a los carreteros es más sencillo que pedir favores a los gremios."
 tv_engineering_department.7017.t:0 "Construcción: El Corvee se lleva a cabo después de la cosecha"
 tv_engineering_department.7017.d:0 "El capataz quiere que las cuadrillas de corvee permanezcan después de la cosecha para terminar los cimientos antes de las heladas. Los ancianos de la aldea estarán de acuerdo, pero cuesta [estate_satisfaction|E] entre los campesinos; gastado ahora, aún dejaría [tv_wonder_domestic_support|E] por encima de una base que se dejó a medio cavar durante el invierno."
 tv_engineering_department.7017.a:0 "Dígalo claramente y mantenga a las pandillas más allá de la cosecha."
 tv_engineering_department.7017.b:0 "La cosecha no puede esperar en los cimientos."
 tv_engineering_department.7018.t:0 "Construcción: una hilera de viviendas se interpone en el camino"
 tv_engineering_department.7018.d:0 "Los albañiles dicen que el sitio es demasiado estrecho para levantar la siguiente hilera sin demoler la hilera de viviendas al lado. Ordenarlo directamente atraería [development|E] en el sitio a medida que los edificios se desmoronan, pero permitiría que el trabajo, y [tv_wonder_domestic_support|E] con él, avanzara nuevamente."
 tv_engineering_department.7018.a:0 "Ordenar arrasar la hilera y ampliar el solar."
 tv_engineering_department.7018.b:0 "Es más fácil vivir en un sitio estrecho que en una calle de inquilinos desalojados."
 tv_engineering_department.7019.t:0 "Construcción: El comercio ordinario se inclina hacia el sitio"
 tv_engineering_department.7019.d:0 "Los carreteros y canteros locales han sido retirados de su oficio habitual para mantener el sitio abastecido. Dejar que esto continúe sangraría [prosperity|E] en el sitio a medida que el negocio ordinario disminuye, pero las entregas más constantes aún se considerarían como [tv_wonder_domestic_support|E] que vale la pena tener."
 tv_engineering_department.7019.a:0 "Que el comercio local siga inclinándose hacia las obras."
 tv_engineering_department.7019.b:0 "La ciudad necesita su comercio ordinario más que el sitio necesita entregas más rápidas."
 tv_engineering_department.7020.t:0 "Construcción: El puente de la capital espera a sus albañiles"
 tv_engineering_department.7020.d:0 "Las reparaciones de los puentes de la capital se han estancado porque sus albañiles fueron arrastrados hacia la maravilla. Mantenerlos allí costaría [development|E] en la capital, ya que el puente está sin terminar, pero mantendría el progreso de la maravilla, y [tv_wonder_domestic_support|E], en movimiento."
 tv_engineering_department.7020.a:0 "Mantenga a los albañiles en el asombro y deje que el puente espere."
 tv_engineering_department.7020.b:0 "El propio puente de la capital no puede esperar al calendario de la maravilla."
 tv_engineering_department.7021.t:0 "Construcción: Agentes compran madera de la capital"
 tv_engineering_department.7021.d:0 "Los agentes de la maravilla están comprando madera y piedra a precios que el mercado ordinario no puede igualar. Dejar que continúen las compras agotaría [prosperity|E] en la capital a medida que el comercio disminuye alrededor del sitio, pero mantendría las obras abastecidas y [tv_wonder_domestic_support|E] con ellas."
 tv_engineering_department.7021.a:0 "Deje que la compra continúe y alimente el sitio."
 tv_engineering_department.7021.b:0 "Los propios mercados de la capital no deberían desangrarse por un solo proyecto."
 tv_engineering_department.7022.t:0 "Construcción: se propone duplicar el turno de noche"
 tv_engineering_department.7022.d:0 "El supervisor quiere duplicar el turno de noche para compensar los días perdidos por la última helada. Ordenarlo desgastaría al [population|E] que trabaja en el sitio ya que las horas extra pasan factura, pero impulsaría el trabajo hacia adelante y levantaría al [tv_wonder_domestic_support|E] con él."
 tv_engineering_department.7022.a:0 "Duplique los turnos e impulse el trabajo hacia adelante."
 tv_engineering_department.7022.b:0 "Los trabajadores agotados construyen más lentamente que los descansados."
 tv_engineering_department.7023.t:0 "Construcción: Una base más amplia en el escritorio del tesorero"
 tv_engineering_department.7023.d:0 "El jefe de albañiles coloca un plano más amplio sobre el escritorio del tesorero, afirmando que el terreno aguantará si se colocan hileras adicionales antes de las lluvias de otoño. El tesorero puede liberar ahora el oro para la piedra y las manos añadidas, o el plan esperará hasta el estudio del próximo año."
 tv_engineering_department.7023.a:0 "Liberen el oro y dejen que los albañiles coloquen una base más amplia antes de las lluvias."
 tv_engineering_department.7023.b:0 "Retenga la moneda; Las lluvias seguirán ahí la próxima primavera."
 tv_engineering_department.7024.t:0 "Construcción: Las apuestas de la encuesta se detienen en una valla"
 tv_engineering_department.7024.d:0 "Las estacas del topógrafo se detienen en la cerca de un vecino, y el vecino se niega a dejarlas pasar. Una orden real establecería el límite hoy, pero invocar el nombre de la corona sobre un seto en disputa no pasará desapercibido."
 tv_engineering_department.7024.a:0 "Envíe la orden y ponga el nombre de la corona detrás del límite más amplio."
 tv_engineering_department.7024.b:0 "Dejemos la cerca en pie; el nombre de la corona no se gasta en una disputa de cobertura."
 tv_engineering_department.7025.t:0 "Construcción: El plan más amplio cruza lo común"
 tv_engineering_department.7025.d:0 "El plan más amplio discurre directamente a través del campo de pastoreo de una aldea. Mover los mojones a través de la aldea ahora resolvería la pregunta de la encuesta, pero los hogares no olvidarán quién los movió."
 tv_engineering_department.7025.a:0 "Mueve las piedras y deja que el estudio se asiente en la huella más grande."
 tv_engineering_department.7025.b:0 "Dejar lo común como está; un pueblo resentido no merece una base más amplia."
 tv_engineering_department.7026.t:0 "Construcción: El precio de un albañil extranjero por su sello"
 tv_engineering_department.7026.d:0 "Un maestro albañil extranjero se ofrece a certificar el diseño más amplio, pero sólo si el nombre de la corte aparece como su patrón en los registros de su propio gremio en su país. El respaldo resolvería aquí la cuestión del tamaño; la petición es pública y no puede cancelarse."
 tv_engineering_department.7026.a:0 "Otorgue el respaldo y confíe en la palabra del maestro sobre una huella más amplia."
 tv_engineering_department.7026.b:0 "Retener el nombre del tribunal; el libro de contabilidad de un gremio extranjero no es el lugar para gastarlo."
 tv_engineering_department.7027.t:0 "Construcción: El plan de base cruza la caza del barón"
 tv_engineering_department.7027.d:0 "El plano más amplio cruza un terreno que un barón local ha utilizado durante mucho tiempo para su caza. Pedirle que se calle mientras los topógrafos terminan demostraría que el sonido es a mayor escala, pero la noble paciencia invertida aquí es una paciencia que esperará que le devuelvan."
 tv_engineering_department.7027.a:0 "Pídele paciencia al barón y deja que los topógrafos terminen su recorrido de caza."
 tv_engineering_department.7027.b:0 "Ruta por el terreno del barón; No vale la pena gastar su buena voluntad en una línea de encuesta."
 tv_engineering_department.7028.t:0 "Construcción: El plan quiere un rincón de tierra santa"
 tv_engineering_department.7028.d:0 "El plan más amplio exige un rincón de terreno consagrado que la parroquia ha mantenido desde tiempos inmemoriales. Los sacerdotes permitirían un reconocimiento si se les pidiera adecuadamente, pero pedir al clero que ceda terreno sagrado para una línea de andamios es un favor gastado, no prestado."
 tv_engineering_department.7028.a:0 "Pide a los sacerdotes que cedan la esquina y confirmen el estudio más amplio."
 tv_engineering_department.7028.b:0 "Mantener la encuesta dentro de los límites antiguos; La tierra consagrada no es el lugar para probar."
 tv_engineering_department.7029.t:0 "Construcción: Se busca el carril de los comerciantes de lana"
 tv_engineering_department.7029.d:0 "La huella más amplia abarcaría el carril que utilizan los comerciantes de lana los días de mercado. Los concejales del gremio aceptarían un desvío si se les pidiera, pero los burgueses que prestan sus calles a una obra recuerdan el inconveniente durante más tiempo que la encuesta."
 tv_engineering_department.7029.a:0 "Pregunta a los concejales por el desvío y confirma la huella más ancha sobre el carril."
 tv_engineering_department.7029.b:0 "Dejen en paz el carril de los comerciantes; La buena voluntad del mercado no se gasta en una línea de andamio."
 tv_engineering_department.7030.t:0 "Construcción: Se pide a la aldea que excave"
 tv_engineering_department.7030.d:0 "El capataz dice que se puede demostrar que la base más amplia es sólida en una semana, si el pueblo cercano se dedica a cavar en lugar de cuidar sus propios campos. El pueblo respondería ante el alcalde, pero en otoño no se olvida un impuesto cobrado durante la temporada de siembra."
 tv_engineering_department.7030.a:0 "Llame a la tasa del pueblo y excave una base más amplia antes de que termine la semana."
 tv_engineering_department.7030.b:0 "Que el pueblo se quede en sus campos; el capataz puede esperar a los trabajadores contratados."
 tv_engineering_department.7031.t:0 "Construcción: Una hilera de talleres se encuentra en la huella"
 tv_engineering_department.7031.d:0 "La única forma de cuadrar la huella más amplia es derribar una hilera de talleres que ya se encuentran en el borde del sitio. Su piedra y sus bases entrarían directamente en el nuevo plan, pero derribar lo que el sitio ya ha construido no es algo que se pueda deshacer."
 tv_engineering_department.7031.a:0 "Baje la fila y doble su piedra en la huella más ancha."
 tv_engineering_department.7031.b:0 "Dejar en pie los talleres; el sitio puede crecer en otra dirección."
 tv_engineering_department.7032.t:0 "Construcción: Se pide a los comerciantes de madera que elijan un comprador"
 tv_engineering_department.7032.d:0 "Los comerciantes de madera en el sitio tienen el stock y los carros para transportar el relleno para la base más amplia hoy, si su comercio ordinario se reserva para el contrato de la corona. Los mercados del sitio responderían a las obras, pero una ruta comercial inclinada hacia un comprador no se recupera por sí sola."
 tv_engineering_department.7032.a:0 "Involucrar al comercio local en las obras y transportar el relleno para lograr una huella más amplia."
 tv_engineering_department.7032.b:0 "Deja a los comerciantes con su comercio ordinario; el relleno se puede obtener de otra manera."
 tv_engineering_department.7033.t:0 "Construcción: Se buscan reparadores de carreteras de la capital en otros lugares"
 tv_engineering_department.7033.d:0 "Los propios reparadores de carreteras y maquinistas de la capital son los únicos equipos libres para realizar el estudio de confirmación este mes. Sacarlos de las propias reparaciones de la capital resolvería la cuestión más amplia de la huella, pero las calles de la capital mostrarán el vacío que dejaron."
 tv_engineering_department.7033.a:0 "Reasigne las cuadrillas de la capital y déjeles confirmar la huella más amplia."
 tv_engineering_department.7033.b:0 "Dejen en paz las reparaciones de la capital; la encuesta puede esperar a que lleguen manos ociosas en otros lugares."
 tv_engineering_department.7034.t:0 "Construcción: Los ayuntamientos ofrecen los ingresos de esta temporada"
 tv_engineering_department.7034.d:0 "Los ayuntamientos de la capital se ofrecen a financiar el estudio de confirmación con los ingresos comerciales de esta temporada, siempre que la moneda se extraiga antes de que las ferias de invierno cierren sus libros. Los mercados de la capital demostrarían tener una huella más amplia, pero las recaudaciones de una temporada orientadas hacia una maravilla es una temporada por la que los gremios querrán responder."
 tv_engineering_department.7034.a:0 "Aproveche los ingresos comerciales de la capital y confirme la presencia más amplia antes del cierre de las ferias."
 tv_engineering_department.7034.b:0 "Dejen en paz los libros de los gremios; En cambio, la encuesta puede esperar al Tesoro."
 tv_engineering_department.7035.t:0 "Construcción: Se piden días de descanso a las tripulaciones"
 tv_engineering_department.7035.d:0 "El capataz dice que este mes se podrá demostrar una base más amplia si los equipos que ya están en el lugar trabajan durante sus días de descanso en lugar de descansar entre turnos. La encuesta resolvería el diseño más amplio, pero los trabajadores que superan su ritmo normal no todos permanecen como trabajadores por mucho tiempo."
 tv_engineering_department.7035.a:0 "Conduzca a las tripulaciones durante sus días de descanso y establezca una base más amplia este mes."
 tv_engineering_department.7035.b:0 "Que las tripulaciones guarden sus días de descanso; la encuesta puede esperar a un ritmo más lento."
 tv_engineering_department.7036.t:0 "Construcción: Se busca un empleado para las juntas de turnos"
 tv_engineering_department.7036.d:0 "El capataz del sitio quiere un empleado de obra adecuado para volver a dibujar los tableros de turnos y publicarlos donde las cuadrillas puedan leerlos. El tesoro puede proporcionar al hombre y su tinta por un precio, y [tv_wonder_organization_competence|E] seguiría los nuevos tableros."
 tv_engineering_department.7036.a:0 "Contratamos al secretario y publicamos los nuevos tableros hoy."
 tv_engineering_department.7036.b:0 "Las viejas tablas han durado tanto tiempo; pueden durar un poco más."
 tv_engineering_department.7037.t:0 "Construcción: Dos capataces rechazan las órdenes del otro"
 tv_engineering_department.7037.d:0 "Dos equipos del gremio en el lugar se niegan a recibir órdenes de los capataces de cada uno, y la discusión ha paralizado el turno de la mañana dos veces esta semana. Sólo una orden judicial que lleve el [legitimacy|E] de la corona establecería el precedente entre ellos, y [tv_wonder_organization_competence|E] seguiría una vez que termine la discusión."
 tv_engineering_department.7037.a:0 "El auto está redactado y sellado; las tripulaciones responden ante él o no responden ante nadie."
 tv_engineering_department.7037.b:0 "La palabra de la corona no se gasta en decidir qué albañil maldice más fuerte."
 tv_engineering_department.7038.t:0 "Construcción: La Vieja Rota Se Olvidó De La Cosecha"
 tv_engineering_department.7038.d:0 "La mano de obra reclutada en las aldeas se establecía según un antiguo cronograma que nunca tomaba en cuenta la cosecha, y la mitad de las cuadrillas se marchaban cuando sus campos los necesitaban. Forzar la rotación a pesar de las objeciones locales reduciría el [stability|E] del país, pero las tripulaciones finalmente mantendrían un horario fijo y el [tv_wonder_organization_competence|E] seguiría."
 tv_engineering_department.7038.a:0 "Impulsamos la rota; la cosecha puede esperar la maravilla por una vez."
 tv_engineering_department.7038.b:0 "Forzar el problema ahora sólo cambia una escasez por otra peor."
 tv_engineering_department.7039.t:0 "Construcción: Los masones no responderán al nuevo supervisor"
 tv_engineering_department.7039.d:0 "Los maestros albañiles no responden ante el joven capataz enviado para reorganizar sus turnos, y lo dicen al alcance del oído de todo el patio. Sólo un nombre respaldado por el [prestige|E] del tribunal tiene suficiente peso para que se alineen, y [tv_wonder_organization_competence|E] seguiría su cumplimiento."
 tv_engineering_department.7039.a:0 "Le prestamos al supervisor el nombre del tribunal; los albañiles responden a eso al menos."
 tv_engineering_department.7039.b:0 "La autoridad de un joven supervisor debería ganarse en el patio, no tomarse prestada del palacio."
 tv_engineering_department.7040.t:0 "Construcción: Un señor vecino ofrece a su mayordomo"
 tv_engineering_department.7040.d:0 "El señor vecino se ofrece a prestar a su propio mayordomo para elaborar nuevas listas de tripulación, un hombre que ha dirigido los turnos de una mansión durante veinte años. Conceder el favor que le corresponde cuesta [estate_satisfaction|E] entre los nobles, pero las listas del mayordomo traerían [tv_wonder_organization_competence|E]."
 tv_engineering_department.7040.a:0 "Aceptamos al mayordomo y le debemos al señor lo que le corresponde."
 tv_engineering_department.7040.b:0 "Una deuda con ese señor en particular vale más que unas listas ordenadas."
 tv_engineering_department.7041.t:0 "Construcción: La respuesta de los cuernos de cambio a las campanas de la catedral"
 tv_engineering_department.7041.d:0 "Los cuernos de cambio del sitio siempre han seguido a las campanas de la catedral, y las campanas no se moverán para adaptarse a una maravilla. Pedir al capítulo que suene una hora extra para marcar los cambios de turno cuesta [estate_satisfaction|E] entre el clero, pero las cuadrillas finalmente entregarían sus puestos a tiempo, trayendo [tv_wonder_organization_competence|E]."
 tv_engineering_department.7041.a:0 "Le pedimos al capítulo la campana extra, cueste lo que cueste refunfuñar."
 tv_engineering_department.7041.b:0 "Las campanas marcan las horas de Dios, no el cambio de turno de un capataz."
 tv_engineering_department.7042.t:0 "Construcción: Carros de materiales hacen cola en el mercado"
 tv_engineering_department.7042.d:0 "Los carros de material ahora hacen cola en la plaza del mercado dos veces al día, y los vendedores gremios pierden sus mejores horas entre el ruido y el barro. Limpiar la plaza para los carros en un horario fijo cuesta [estate_satisfaction|E] entre los burgueses, pero los carros finalmente llegarían en un horario que los equipos pueden planificar, trayendo [tv_wonder_organization_competence|E]."
 tv_engineering_department.7042.a:0 "Fijamos el horario y despejamos la plaza, con platea o sin platea."
 tv_engineering_department.7042.b:0 "El mercado alimenta a la ciudad antes que a la maravilla."
 tv_engineering_department.7043.t:0 "Construcción: Se pide una segunda rotación de las aldeas"
 tv_engineering_department.7043.d:0 "Se pide a los pueblos de los alrededores que envíen una segunda rotación de personal antes de que las cuadrillas actuales colapsen al duplicar los puestos. Sacarlos de sus propias parcelas entre la siembra y la cosecha cuesta [estate_satisfaction|E] entre los campesinos, pero una segunda rotación completa permitiría que el sitio finalmente funcionara con los turnos adecuados, generando [tv_wonder_organization_competence|E]."
 tv_engineering_department.7043.a:0 "Llamamos a la segunda rotación y dejamos que los campos esperen su turno."
 tv_engineering_department.7043.b:0 "Los campos vacíos en otoño le cuestan al país más que un horario de turnos irregular."
 tv_engineering_department.7044.t:0 "Construcción: El patio de preparación es demasiado estrecho para pasar"
 tv_engineering_department.7044.d:0 "El patio de preparación es demasiado estrecho para que los equipos puedan cruzarse sin detener el trabajo, y el enredo cuesta una hora cada mañana. Limpiar un bloque contiguo para un patio adecuado devora [development|E] en el sitio, pero las cuadrillas finalmente se movieron sin chocar, trayendo a [tv_wonder_organization_competence|E]."
 tv_engineering_department.7044.a:0 "Derribamos el bloque y damos a las tripulaciones espacio para moverse."
 tv_engineering_department.7044.b:0 "El bloque permanece; un patio estrecho es más barato que uno demolido."
 tv_engineering_department.7045.t:0 "Construcción: Los Carters Locales Son Redirigidos Silenciosamente"
 tv_engineering_department.7045.d:0 "Los carreteros y porteadores locales que solían hacer los propios recados del sitio han sido redirigidos silenciosamente a transportar materiales maravillosos y, como resultado, el comercio ordinario alrededor de las obras se ha reducido. Formalizar el acuerdo, vincular esas manos al cronograma de la maravilla, cuesta [prosperity|E] en el sitio, pero [tv_wonder_organization_competence|E] seguiría de las cuadrillas que ya no esperan a los carros perdidos."
 tv_engineering_department.7045.a:0 "Formalizamos el acuerdo; Los Carter responden ahora al horario de la maravilla."
 tv_engineering_department.7045.b:0 "El comercio ordinario mantiene alimentada a la gente del sitio; la maravilla puede esperar su turno para los carros."
 tv_engineering_department.7046.t:0 "Construcción: La capital presta sus capataces"
 tv_engineering_department.7046.d:0 "Las propias obras de construcción de la capital han prestado a sus capataces para ayudar a rediseñar los turnos de la maravilla, y el préstamo ha dejado a los propios proyectos de la capital con escasez de personal. Hacer que el préstamo sea permanente cuesta [development|E] en la capital, pero el sitio maravilloso mantendría a un capataz que realmente sabe cómo administrar una lista, lo que traería [tv_wonder_organization_competence|E]."
 tv_engineering_department.7046.a:0 "Hacemos que el préstamo sea permanente; Los proyectos de la capital funcionarán sin él."
 tv_engineering_department.7046.b:0 "Las propias obras de la capital necesitan de vuelta a su capataz más que la maravilla necesita otro."
 tv_engineering_department.7047.t:0 "Construcción: Se reorganiza el orden del puerto"
 tv_engineering_department.7047.d:0 "Los días de entrega de los comerciantes de la capital se han reorganizado silenciosamente para que los materiales maravillosos salgan primero del puerto, y el comercio ordinario de la capital ahora espera detrás de los carros de las maravillas. Confirmar el nuevo pedido del puerto cuesta [prosperity|E] en la capital, pero el sitio finalmente recibiría materiales en un horario en el que las cuadrillas pueden construir turnos, trayendo [tv_wonder_organization_competence|E]."
 tv_engineering_department.7047.a:0 "Confirmamos el nuevo pedido en el puerto; Los comerciantes se adaptarán con el tiempo."
 tv_engineering_department.7047.b:0 "El propio comercio de la capital no debería quedarse detrás de las obras de otra ciudad."
 tv_engineering_department.7048.t:0 "Construcción: el reciclaje exige que las tripulaciones se dupliquen"
 tv_engineering_department.7048.d:0 "Al sitio le faltan dos equipos completos para el reentrenamiento que requerirían las nuevas plantillas, por lo que se pide a los trabajadores que ya están disponibles que dupliquen sus puestos hasta que se establezca el nuevo cronograma. Conducir el [population|E] en el sitio con tanta fuerza durante semanas les costó caro, pero el reentrenamiento finalmente se mantuvo, trayendo al [tv_wonder_organization_competence|E]."
 tv_engineering_department.7048.a:0 "Duplicamos las publicaciones por ahora; Las nuevas plantillas valen la pena."
 tv_engineering_department.7048.b:0 "Las tripulaciones agotadas no aprenden nada; el reentrenamiento puede esperar a que las manos descansen."
 tv_engineering_department.7049.t:0 "Construcción: un solo Ford respalda cada carro"
 tv_engineering_department.7049.d:0 "Un único vado estrecho respalda a todos los carros que se dirigen al lugar. El intendente quiere [gold|E] ahora, para tablas y un equipo pagado de instaladores de puentes, para que el [tv_wonder_logistics_competence|E] pueda moverse nuevamente antes de que la cola crezca más que la carretera misma."
 tv_engineering_department.7049.a:0 "Paga a los constructores del puente y limpia el vado."
 tv_engineering_department.7049.b:0 "El tesoro tiene mejores usos para esa moneda que cruzar un charco."
 tv_engineering_department.7050.t:0 "Construcción: Los terratenientes rechazan el paso del convoy"
 tv_engineering_department.7050.d:0 "Los terratenientes a lo largo de la nueva ruta se niegan a permitir que los carros crucen sus campos sin una orden real. Gastar el [legitimacy|E] de la corona aquí abriría las puertas y permitiría avanzar al [tv_wonder_logistics_competence|E], pero sólo en este camino, y sólo hoy."
 tv_engineering_department.7050.a:0 "Emitir el auto y abrir los campos a los carros."
 tv_engineering_department.7050.b:0 "La palabra de la corona no se gasta en cada terrateniente testarudo."
 tv_engineering_department.7051.t:0 "Construcción: El carril para carros atraviesa el Village Green"
 tv_engineering_department.7051.d:0 "El antiguo camino para carros atraviesa una zona verde del pueblo y los encargados de la carretera quieren ampliarlo trasladando tres casas y un pozo. El pedido adelantaría el [tv_wonder_logistics_competence|E], pero le costará el [stability|E] de la corona y los que quedan se quejan."
 tv_engineering_department.7051.a:0 "Dad la orden, casas y al diablo."
 tv_engineering_department.7051.b:0 "Que el pueblo mantenga su verde; el camino puede rodearlo."
 tv_engineering_department.7052.t:0 "Construcción: Los únicos caballos de repuesto pertenecen a otro gremio"
 tv_engineering_department.7052.d:0 "El gremio de carros de la provincia vecina posee los únicos caballos de tiro sobrantes para alquilar. Sus amos los prestarán y dejarán que el [tv_wonder_logistics_competence|E] los alcance, solo como un favor gastado por el [prestige|E] de la corte, que no es ilimitado."
 tv_engineering_department.7052.a:0 "Pide el favor y pon esos caballos en el camino."
 tv_engineering_department.7052.b:0 "Guarde el buen nombre del tribunal para una deuda que vale la pena reclamar."
 tv_engineering_department.7053.t:0 "Construcción: Se buscan equipos de transporte de los nobles para la piedra"
 tv_engineering_department.7053.d:0 "Los jefes de caminos se han quedado sin carruajes y quieren que los carruajes de los nobles locales se encarguen de transportar piedras en lugar de invitados. El [tv_wonder_logistics_competence|E] ganaría terreno, pero costaría el [estate_satisfaction|E] entre los nobles, quienes se quejarán del inconveniente."
 tv_engineering_department.7053.a:0 "Requisa los carruajes y ponlos a transportar piedras."
 tv_engineering_department.7053.b:0 "Dejad a los nobles sus carruajes; Encuentra los vagones en otra parte."
 tv_engineering_department.7054.t:0 "Construcción: Se busca el almacén del monasterio"
 tv_engineering_department.7054.d:0 "El monasterio más cercano tiene el único almacén seco a lo largo de la ruta, y los encargados de los caminos quieren vaciarlo para guardar grano y herramientas. Limpiarlo ayudaría al [tv_wonder_logistics_competence|E], pero le costaría [estate_satisfaction|E] al clero, que no olvidará quiénes fueron los carros que lo llenaron."
 tv_engineering_department.7054.a:0 "Vacíe el almacén y apílelo con suministros."
 tv_engineering_department.7054.b:0 "Deja intactas las tiendas del monasterio."
 tv_engineering_department.7055.t:0 "Construcción: El convoy necesita la plaza del mercado"
 tv_engineering_department.7055.d:0 "El convoy necesita la plaza del mercado de la ciudad para hacer girar sus carros, pero esa plaza también es día de mercado. Cerrar los puestos permitiría que los carros pasaran antes del mediodía y ayudaría a [tv_wonder_logistics_competence|E], a costa de [estate_satisfaction|E] entre los burgueses cuyos puestos permanecían cerrados."
 tv_engineering_department.7055.a:0 "Cierra el mercado y deja pasar los carros."
 tv_engineering_department.7055.b:0 "El mercado permanece abierto; los vagones pueden esperar un día."
 tv_engineering_department.7056.t:0 "Construcción: Un tramo fangoso se traga la carretera"
 tv_engineering_department.7056.d:0 "Un tramo del camino se ha convertido en barro y ninguna yunta de bueyes puede atravesarlo solo. Poner los propios bueyes y las espaldas de la aldea en las cuerdas la limpiaría y ayudaría a [tv_wonder_logistics_competence|E], pero costaría [estate_satisfaction|E] entre los campesinos, que necesitan esos bueyes para la siembra de primavera."
 tv_engineering_department.7056.a:0 "Pon los bueyes del propio pueblo y las espaldas contra las cuerdas."
 tv_engineering_department.7056.b:0 "Que los campesinos guarden sus bueyes para la siembra de primavera."
 tv_engineering_department.7057.t:0 "Construcción: El patio de preparación no puede albergar los vagones"
 tv_engineering_department.7057.d:0 "El patio de espera del lugar es demasiado estrecho para los carros que ahora llegan diariamente. Limpiar los almacenes a medio construir en su borde abriría espacio para que funcione el [tv_wonder_logistics_competence|E], a costa del [development|E] en el sitio ya hundido en esos almacenes."
 tv_engineering_department.7057.a:0 "Limpia los almacenes y amplía el patio."
 tv_engineering_department.7057.b:0 "Guarda los almacenes; Los vagones pueden hacer cola afuera."
 tv_engineering_department.7058.t:0 "Construcción: A los posaderos se les dice que atiendan a los convoyes primero"
 tv_engineering_department.7058.d:0 "A los posaderos y carreteros cercanos al sitio se les ha dicho que primero guarden sus existencias sobrantes para los convoyes de la maravilla, y vendan solo lo que quede a los demás. Mantendría alimentado el [tv_wonder_logistics_competence|E], pero a costa de [prosperity|E] en el sitio a medida que el comercio local disminuye."
 tv_engineering_department.7058.a:0 "Primero mantén el stock para los convoyes."
 tv_engineering_department.7058.b:0 "Dejemos que la ciudad negocie como siempre lo ha hecho."
 tv_engineering_department.7059.t:0 "Construcción: Se necesitan equipos de pavimentación de la capital en la carretera"
 tv_engineering_department.7059.d:0 "Los equipos de pavimentación de la capital están a medio camino de rehabilitar una calle comercial cuando los encargados de la carretera los solicitan para consolidar los surcos en el camino hacia el lugar. Reasignarlos haría avanzar el [tv_wonder_logistics_competence|E], a costa del [development|E] en la capital, cuya calle permanece medio adoquinada."
 tv_engineering_department.7059.a:0 "Saque a las cuadrillas de la calle y envíelas a la ruta."
 tv_engineering_department.7059.b:0 "Termina primero la calle del mercado; la ruta puede esperar."
 tv_engineering_department.7060.t:0 "Construcción: Se buscan hórreos de la capital para la ruta"
 tv_engineering_department.7060.d:0 "Los graneros más cercanos a la puerta de la capital son la forma más rápida de almacenar los vagones para la ruta, y los encargados de los caminos quieren que se abran. Vender la reserva ayudaría al [tv_wonder_logistics_competence|E] a costar el [prosperity|E] en la capital, ya que sus propios mercados se adelgazan durante una temporada."
 tv_engineering_department.7060.a:0 "Abre los graneros y abastece los carros."
 tv_engineering_department.7060.b:0 "Mantenga los graneros cerrados en caso de una temporada de escasez."
 tv_engineering_department.7061.t:0 "Construcción: Se pide a los trabajadores que descarguen el trabajo atrasado"
 tv_engineering_department.7061.d:0 "Los propios trabajadores del sitio son las únicas manos libres para descargar los vagones atascados, y el capataz quiere que dejen sus tareas habituales y trabajen en turnos adicionales en las cuerdas. Movería el [tv_wonder_logistics_competence|E], pero recurre al trabajador [population|E] en el sitio, desgastado por las horas extra."
 tv_engineering_department.7061.a:0 "Colocar a los trabajadores en turnos adicionales y eliminar el trabajo atrasado."
 tv_engineering_department.7061.b:0 "Que los trabajadores sigan con sus tareas habituales."
 tv_engineering_department.7062.t:0 "Construcción: Las grúas permanecen inactivas por falta de monedas"
 tv_engineering_department.7062.d:0 "Las grúas elevadoras permanecen inactivas cada tres días por falta de personal remunerado, aunque el secretario del Tesoro jura que la moneda permanece sin contar en la cámara acorazada. Soltarlo ahora devolvería las cuerdas a la mano antes de que llegue la escarcha."
 tv_engineering_department.7062.a:0 "Abre la cámara acorazada y gasta el [gold|E] en turnos dobles, comprando progreso [tv_wonder_construction|E]."
 tv_engineering_department.7062.b:0 "Deje la cámara acorazada sellada; las tripulaciones esperan el día de pago habitual."
 tv_engineering_department.7063.t:0 "Construcción: Los masones exigen el propio sello de la Corona"
 tv_engineering_department.7063.d:0 "Los albañiles se niegan a cruzar los mojones en disputa sin una orden que lleve el sello de la corona, no el del gobernador. Poner el nombre del soberano en la orden resolvería el asunto hoy, aunque cada auto de este tipo que se gasta en los canteros es uno menos para el tribunal y el consejo."
 tv_engineering_department.7063.a:0 "Selle la orden judicial en nombre del soberano, gastando [legitimacy|E] para comprar [tv_wonder_construction|E] progreso más allá de los límites."
 tv_engineering_department.7063.b:0 "Retenga el sello real y deje que el gobernador discuta él mismo los límites."
 tv_engineering_department.7064.t:0 "Construcción: Dos aldeas bloquean el camino de acarreo"
 tv_engineering_department.7064.d:0 "Dos aldeas se encuentran a lo largo del camino de transporte planeado, y sus jefes han dicho claramente que no, dos veces. Ordenarlos aparte despejaría el camino en una semana, a costa de la tranquilidad que la corona ha mantenido con ellos desde la última mala cosecha."
 tv_engineering_department.7064.a:0 "Ordena a las aldeas que cedan el paso y gasta [stability|E] para despejar el progreso de [tv_wonder_construction|E] a lo largo del camino de transporte."
 tv_engineering_department.7064.b:0 "Desvíe el camino de transporte alrededor de las aldeas y deje en paz a los jefes."
 tv_engineering_department.7065.t:0 "Construcción: El Maestro del Gremio nombra su precio para saltar la cola"
 tv_engineering_department.7065.d:0 "El maestro del gremio de canteros se saltará la cola de los albañiles de la maravilla sólo si el tribunal reclama un favor adeudado desde la última visita de estado. Preguntar ahora movería la orden al frente del libro mayor, pero un favor mencionado en voz alta es un favor gastado."
 tv_engineering_department.7065.a:0 "Solicite el favor y gaste [prestige|E] para hacer avanzar la orden, comprando el progreso de [tv_wonder_construction|E]."
 tv_engineering_department.7065.b:0 "Deje que el pedido se mantenga y guarde el favor para más tarde."
 tv_engineering_department.7066.t:0 "Construcción: Un Señor ofrece impuestos a su hogar"
 tv_engineering_department.7066.d:0 "Un señor local ofrece a sus propios levas domésticos para transportar piedra durante el próximo mes, siempre que nadie mencione que a sus hombres se les prometió la temporada libre después de la última reunión. Su mayordomo ya está redactando la plantilla."
 tv_engineering_department.7066.a:0 "Tome los impuestos del señor y gaste el [estate_satisfaction|E] de los nobles para comprar el progreso [tv_wonder_construction|E]."
 tv_engineering_department.7066.b:0 "Rechaza las levas y deja que los hombres del señor mantengan libre la temporada prometida."
 tv_engineering_department.7067.t:0 "Construcción: El fondo del asilo de la Abadía podría cubrir la madera"
 tv_engineering_department.7067.d:0 "El fondo del asilo de la abadía está lleno este trimestre, y el prior ha insinuado que podría cubrir la madera para los andamios si la corona lo pidiera abiertamente en lugar de simplemente insinuarlo. Preguntar abiertamente es la parte que el capítulo recordará."
 tv_engineering_department.7067.a:0 "Pregúntele directamente al anterior y gaste al clero [estate_satisfaction|E] en madera para andamios, comprando progreso [tv_wonder_construction|E]."
 tv_engineering_department.7067.b:0 "Dejemos en paz el fondo del asilo y busquemos la madera en otra parte."
 tv_engineering_department.7068.t:0 "Construcción: Vagones de vagones se enredan con el día de mercado"
 tv_engineering_department.7068.d:0 "Las caravanas destinadas al lugar de la maravilla siguen enredándose con el tráfico del día de mercado en las mismas tres esquinas. Cerrar esas calles al comercio en los días de entrega desenredaría la ruta de inmediato, aunque los vendedores perderían esas horas de atención por completo."
 tv_engineering_department.7068.a:0 "Cierra las calles los días de entrega y gasta el [estate_satisfaction|E] de los burgueses para comprar [tv_wonder_construction|E] progreso."
 tv_engineering_department.7068.b:0 "Deja abiertas las calles del mercado y deja que los carros esperen su turno."
 tv_engineering_department.7069.t:0 "Construcción: Se pide a los equipos de zanjeo que realicen los movimientos de tierras"
 tv_engineering_department.7069.d:0 "El alguacil dice que los pueblos de los alrededores pueden disponer de mano de obra para los movimientos de tierra, pero sólo la misma mano de obra que ya se debe a los zanjas de otoño que evitan que sus propios campos se inunden. Redactarlos ahora significa que el abandono espera."
 tv_engineering_department.7069.a:0 "Recluta a los peones de la aldea para los movimientos de tierra, gastando el [estate_satisfaction|E] de los campesinos en el progreso [tv_wonder_construction|E]."
 tv_engineering_department.7069.b:0 "Dejemos las aldeas abandonadas y busquemos mano de obra en otra parte."
 tv_engineering_department.7070.t:0 "Construcción: El antiguo almacén de cereales se encuentra donde debe levantarse el andamio"
 tv_engineering_department.7070.d:0 "El antiguo almacén de cereales que se encuentra donde debe ir el andamio occidental es lo suficientemente sólido como para conservarlo, pero su piedra y su huella responderían tanto a la escasez del albañil como a la queja del topógrafo de un solo golpe. Tirarlo hacia abajo es el camino más rápido."
 tv_engineering_department.7070.a:0 "Baje el almacén de granos y gaste [development|E] en el sitio para comprar progreso [tv_wonder_construction|E]."
 tv_engineering_department.7070.b:0 "Deje el almacén de granos en pie y busque la sala del andamio en otro lugar."
 tv_engineering_department.7071.t:0 "Construcción: Los taberneros se vuelven silenciosamente hacia la maravilla"
 tv_engineering_department.7071.d:0 "Los propios taberneros y carreteros del lugar han comenzado silenciosamente a desviar su costumbre hacia entregas maravillosas, ya que las tripulaciones pagan con moneda corriente y el comercio ordinario no lo hace. Formalizar ese acuerdo aceleraría las entregas, a costa del comercio en el que esos poseedores construyeron su costumbre."
 tv_engineering_department.7071.a:0 "Formalice el desvío, gastando [prosperity|E] en el sitio para comprar progreso [tv_wonder_construction|E]."
 tv_engineering_department.7071.b:0 "Deje que el comercio local siga su curso normal y deje las entregas como están."
 tv_engineering_department.7072.t:0 "Construcción: Un puente o una maravilla"
 tv_engineering_department.7072.d:0 "La reparación del puente de la capital se ha estancado por falta de canteros, y cada albañil que lo construye es un albañil que no corta por la maravilla. Reasignar la tripulación haría avanzar la maravilla de inmediato, y el puente simplemente esperaría su turno."
 tv_engineering_department.7072.a:0 "Reasigna a la tripulación del puente a la maravilla, gastando [development|E] en la capital en el progreso de [tv_wonder_construction|E]."
 tv_engineering_department.7072.b:0 "Deja a la tripulación del puente donde está y deja que el puente termine primero."
 tv_engineering_department.7073.t:0 "Construcción: Los factores de cereales ofrecen su excedente, por un precio"
 tv_engineering_department.7073.d:0 "Los productores de cereales de la capital han ofrecido vender su excedente directamente a los almacenes de la maravilla a un precio justo, siempre que la corona les permita publicar la venta en la plaza principal como prueba del favor real. Alimentaría a las tripulaciones durante el mes de escasez y visiblemente inclinaría el mercado hacia un comprador."
 tv_engineering_department.7073.a:0 "Dejemos que los factores publiquen la venta, gastando [prosperity|E] en el capital para comprar el progreso [tv_wonder_construction|E]."
 tv_engineering_department.7073.b:0 "Rechazar la venta pública y comprar el grano de las cuadrillas por los canales habituales."
 tv_engineering_department.7074.t:0 "Construcción: El supervisor propone trabajar toda la noche"
 tv_engineering_department.7074.d:0 "El supervisor propone que el personal de la obra trabaje durante el turno de noche en lugar de esperar a que el reclutador le entregue nuevas manos, ya que tanto las antorchas como el testamento ya están allí. Se eliminaría el retraso al amanecer, aunque los mismos hombres regresarían con las primeras luces del día sin descanso entre medias."
 tv_engineering_department.7074.a:0 "Ordene el turno de noche y gaste el trabajo [population|E] en el sitio para comprar el progreso [tv_wonder_construction|E]."
 tv_engineering_department.7074.b:0 "Envíe a las tripulaciones a sus camas y espere manos frescas del reclutador."
 tv_engineering_department.7075.t:0 "Construcción: Opinión en el Scaffold Wavers"
 tv_engineering_department.7075.d:0 "Una manifestación pública en el lugar atrae a una multitud que puede convertirse en espectadores leales o críticos ofendidos. Los andamios esperan mientras los rumores deciden si [tv_wonder_domestic_support|E] ha sido ayudado o perjudicado."
 tv_engineering_department.7075.a:0 "Dejemos que la manifestación hable por sí misma."
 tv_engineering_department.7076.t:0 "Construcción: El plan supera la página"
 tv_engineering_department.7076.d:0 "Un ajuste audaz llevará el plan más allá de sus antiguos límites. Puede ser la decisión que hizo grandioso el monumento, o la nota que los futuros empleados subrayaron en rojo."
 tv_engineering_department.7076.a:0 "Lleva el diseño más allá de sus antiguos límites."
 tv_engineering_department.7077.t:0 "Construcción: los pedidos cambian bajo el toldo."
 tv_engineering_department.7077.d:0 "Una nueva cadena de mando se impone bajo las marquesinas. Puede disciplinar el astillero o simplemente enseñar a cada capataz una nueva forma de discutir."
 tv_engineering_department.7077.a:0 "Impulsamos la nueva cadena de mando a través del patio."
 tv_engineering_department.7078.t:0 "Construcción: La ruta gira a través del barro"
 tv_engineering_department.7078.d:0 "Una ruta arriesgada promete acortar la línea de suministro. Si el tiempo lo permite, será elogiado como previsión; si falla, todos recordarán quién ordenó el turno."
 tv_engineering_department.7078.a:0 "¡Toma el camino más corto!"
 tv_engineering_department.7079.t:0 "Construcción: un nuevo método flota en el aire"
 tv_engineering_department.7079.d:0 "Se prueba un método más rápido en la parte activa. Puede salvar el mes u obligar al próximo equipo a reparar un hermoso error."
 tv_engineering_department.7079.a:0 "Prueba el método más rápido en la sección activa."
 tv_engineering_department.7080.t:0 "Construcción: Los trabajadores abandonan sus herramientas por una promesa incumplida"
 tv_engineering_department.7080.d:0 "Los trabajadores dejaron sus herramientas esta mañana, murmurando que la maravilla está desangrando la plata de la corona. El capataz los calmó con la promesa de salarios extraordinarios, una promesa que el tesoro ahora debe cumplir o romper frente a la multitud."
 tv_engineering_department.7080.a:0 "Romper el bono prometido y dejar que las quejas de los trabajadores se propaguen por la obra."
 tv_engineering_department.7080.b:0 "Honra el bono prometido y déjalo salir del tesoro."
 tv_engineering_department.7081.t:0 "Construcción: Un folleto cuestiona el sello de la orden judicial"
 tv_engineering_department.7081.d:0 "Un empleado viajero leyó en voz alta en la plaza un panfleto que afirmaba que la orden de la corona que autorizaba la maravilla nunca fue sellada legalmente. Ya sea que la duda sobre el proyecto quede sin respuesta o que la propia orden judicial se modifique silenciosamente, algo debe ceder."
 tv_engineering_department.7081.a:0 "Deja el folleto sin respuesta y deja que las dudas sobre la maravilla sigan extendiéndose."
 tv_engineering_department.7081.b:0 "Modifique silenciosamente la redacción de la orden judicial para responder al desafío y acepte la mella en el mandato de la corona."
 tv_engineering_department.7082.t:0 "Construcción: un impuesto provoca una pelea dentro de dos días"
 tv_engineering_department.7082.d:0 "Llegó la noticia de que los reclutas que transportaban piedras para la maravilla provocaron una pelea entre los oficiales de reclutamiento y los aldeanos a dos días de viaje del lugar. Silenciarlo costará algo, ya sea en ese distrito o en las puertas del sitio."
 tv_engineering_department.7082.a:0 "Dejemos que las puertas del sitio absorban las quejas y dejemos que el malestar del distrito se extinga por sí solo."
 tv_engineering_department.7082.b:0 "Envíe tropas para asentar el distrito silenciosamente antes de que los disturbios se extiendan más."
 tv_engineering_department.7083.t:0 "Construcción: La burla de un enviado viaja del puerto al palacio"
 tv_engineering_department.7083.d:0 "Un enviado extranjero se rió durante el banquete de que la maravilla avanza más lentamente que un buey de arado, y la burla se repite ahora en todas las tabernas, desde el puerto hasta el palacio. Alguien debe tragárselo, ya sea la posición de la corona en el extranjero o el orgullo de la gente del pueblo por lo que se está construyendo."
 tv_engineering_department.7083.a:0 "Ignora la burla del enviado y deja que el orgullo de la gente del pueblo por la maravilla se haga cargo."
 tv_engineering_department.7083.b:0 "Responde al enviado con una fastuosa contraexhibición y gasta la posición de la corona para silenciarlo."
 tv_engineering_department.7084.t:0 "Construcción: El mayordomo de Lord Aldric echa humo en la puerta"
 tv_engineering_department.7084.d:0 "El nuevo camino de la cantera fue cortado directamente a través del coto de caza de Lord Aldric la semana pasada, y su mayordomo ha estado furioso en la puerta del sitio desde entonces. O la casa del señor se apacigua o los comunes que observan el enfrentamiento sacan sus propias conclusiones."
 tv_engineering_department.7084.a:0 "Dejemos que el enfrentamiento se prolongue sin resolverse y que la opinión de la multitud sobre el proyecto se agrie."
 tv_engineering_department.7084.b:0 "Concede a la casa del señor una disculpa formal y una compensación para resolver el asunto."
 tv_engineering_department.7085.t:0 "Construcción: La trinchera de los cimientos revela tumbas antiguas"
 tv_engineering_department.7085.d:0 "Los excavadores que preparaban la zanja de cimentación encontraron viejas lápidas que nadie había registrado y el párroco se niega a bendecir los trabajos posteriores hasta que los muertos sean enterrados de nuevo adecuadamente. O los ritos del nuevo entierro se pagan en su totalidad o la excavación continúa a pesar de las objeciones del sacerdote."
 tv_engineering_department.7085.a:0 "Anula al sacerdote y sigue cavando, dejando que la noticia de las tumbas perturbadas inquiete a la multitud."
 tv_engineering_department.7085.b:0 "Pagar por los ritos de entierro completos para satisfacer al sacerdote y a la parroquia."
 tv_engineering_department.7086.t:0 "Construcción: postes de andamios bloquean la fila de comerciantes"
 tv_engineering_department.7086.d:0 "Los postes de andamios colocados a lo largo de la calle principal han bloqueado el tráfico de carros hacia la fila de los comerciantes durante seis días consecutivos, y los vendedores exigen que alguien responda por el comercio perdido. O se compensan sus pérdidas o la calle permanece cerrada y la multitud se entera."
 tv_engineering_department.7086.a:0 "Dejar a los comerciantes sin compensación y dejar que la calle cerrada alimente las quejas de la multitud."
 tv_engineering_department.7086.b:0 "Compense de inmediato la disputa de los comerciantes por el comercio bloqueado."
 tv_engineering_department.7087.t:0 "Construcción: Los campos de maduración permanecen sin cortar"
 tv_engineering_department.7087.d:0 "Los encargados de la cosecha sacaron a los trabajadores de los campos maduros para transportar madera para la maravilla, y el grano ahora permanece sin cortar mientras a los trabajadores les duele la espalda en el lugar. O los pueblos recuperan sus manos para la cosecha, o la multitud escucha cómo la maravilla vació los campos."
 tv_engineering_department.7087.a:0 "Mantenga las manos reclutadas en el lugar y deje que la noticia del grano en pie llegue a la multitud."
 tv_engineering_department.7087.b:0 "Libere a las manos del pueblo para que regresen a la cosecha de inmediato."
 tv_engineering_department.7088.t:0 "Construcción: El antiguo barrio de las curtidurías está medio derribado"
 tv_engineering_department.7088.d:0 "El plan de los albañiles exige que se despeje el antiguo barrio de la curtiduría para dejar espacio para los cimientos de la maravilla, y la mitad se derrumbó antes de que nadie pensara en preguntar qué lo reemplazaría. O el distrito es arrasado como estaba previsto, o el plan se reduce y la gente empieza a preguntarse por qué la maravilla necesitaba tanto espacio."
 tv_engineering_department.7088.a:0 "Reduzca el espacio libre y deje que la gente se pregunte por qué la maravilla necesitaba tanto terreno en primer lugar."
 tv_engineering_department.7088.b:0 "Termina de arrasar el barrio de la curtiduría según lo planeado y preocúpate por lo que lo reemplazará más adelante."
 tv_engineering_department.7089.t:0 "Construcción: El mercado no ha regresado"
 tv_engineering_department.7089.d:0 "El patio de espera de la maravilla se ha tragado el terreno del mercado semanal por tercer mes consecutivo, y los puestos que solían llenarlo simplemente han dejado de regresar. O se devuelve el terreno del mercado antes de que se olvide, o el astillero se lo queda y el comercio del sitio sigue disminuyendo."
 tv_engineering_department.7089.a:0 "Mantenga el patio de preparación donde está y deje que el propio mercado del sitio se enfríe."
 tv_engineering_department.7089.b:0 "Regrese al mercado antes de que los puestos semanales olviden el camino de regreso."
 tv_engineering_department.7090.t:0 "Construcción: El asilo se encuentra intacto junto al puente viejo"
 tv_engineering_department.7090.d:0 "El agrimensor de la ciudad requisó a todos los albañiles de la capital para la mampostería de la maravilla y, como resultado, el asilo a medio construir junto al viejo puente permaneció intacto durante dos meses. O el asilo espera hasta que se haga la maravilla, o los albañiles son llevados de regreso a la capital y el sitio se ralentiza para explicar por qué."
 tv_engineering_department.7090.a:0 "Mantenga a todos los albañiles atentos y deje esperar los proyectos a medio construir de la capital."
 tv_engineering_department.7090.b:0 "Llame a los albañiles para que terminen el asilo y deje que la propia multitud del lugar se sorprenda por el retraso."
 tv_engineering_department.7091.t:0 "Construcción: Los carros de piedra ahogan la mejor calle de la capital"
 tv_engineering_department.7091.d:0 "Carros de piedra labrada con destino a esta maravilla han estado estacionados a lo largo de la mejor calle comercial de la capital durante una semana, y los comerciantes allí dicen que la costumbre se ha secado con la carretera bloqueada. O los carros encuentran pronto otra ruta o se quedan y el comercio de la capital sigue enfriándose."
 tv_engineering_department.7091.a:0 "Dejemos los vagones donde están y dejemos que el propio progreso del sitio cargue con la culpa."
 tv_engineering_department.7091.b:0 "Desvíe los vagones de inmediato y deje que la calle comercial de la capital respire nuevamente."
 tv_engineering_department.7092.t:0 "Construcción: El derrumbe de un andamio deja una docena de rotos"
 tv_engineering_department.7092.d:0 "El colapso de un andamio en el lugar hace tres días dejó a una docena de trabajadores con huesos rotos, y el resto del equipo ahora se queja de que ningún salario vale la pena correr el riesgo. O los capataces aceleran el paso y los trabajadores empiezan a escabullirse durante la noche, o el paso disminuye y la noticia del peligro se extiende por la ciudad."
 tv_engineering_department.7092.a:0 "Deje que el peligro se convierta en una comidilla común en la ciudad y mantenga a todos los trabajadores en el lugar."
 tv_engineering_department.7092.b:0 "Fuerce el ritmo de todos modos y acepte que los trabajadores asustados se escabullirán en la noche."
 tv_engineering_department.7093.t:0 "Construcción: La caja fuerte es más liviana de lo que afirma el libro mayor"
 tv_engineering_department.7093.d:0 "El pagador del sitio abre la caja fuerte y la encuentra más liviana de lo que afirma el libro mayor. Alguien ya gastó una moneda que nunca se contó y el déficit se compensará en [tv_wonder_scale_competence|E] o en [gold|E]."
 tv_engineering_department.7093.a:0 "Reduzca el diseño para que coincida con lo que el cofre todavía puede permitirse."
 tv_engineering_department.7093.b:0 "Cubrir el déficit del tesoro y seguir construyendo a escala."
 tv_engineering_department.7094.t:0 "Construcción: un rival susurra que ningún contrato lo permite"
 tv_engineering_department.7094.d:0 "Un demandante rival ha comenzado a susurrar que ningún estatuto permite un monumento de este tamaño. Los empleados dicen que el asunto se puede resolver tranquilamente, pero no sin costo para [tv_wonder_scale_competence|E] o [legitimacy|E]."
 tv_engineering_department.7094.a:0 "Retire silenciosamente las reclamaciones más importantes de la carta."
 tv_engineering_department.7094.b:0 "Haga que la corona reafirme la carta en su totalidad y responda a los susurros directamente."
 tv_engineering_department.7095.t:0 "Construcción: Tres parroquias bloquean el camino sobre los cimientos"
 tv_engineering_department.7095.d:0 "Hombres de tres parroquias arrojaron herramientas sobre los cimientos ensanchados y bloquearon la carretera con carros. El alguacil puede dispersarlos, pero sólo cediendo terreno en algún lugar: ya sea en el [tv_wonder_scale_competence|E] del plan o en el [stability|E] del distrito."
 tv_engineering_department.7095.a:0 "Estreche los cimientos hasta la línea original y envíe a los hombres a casa satisfechos."
 tv_engineering_department.7095.b:0 "Envía hombres armados para despejar el camino y conservar los cimientos más amplios."
 tv_engineering_department.7096.t:0 "Construcción: Los Heraldos se niegan a viajar sin remuneración"
 tv_engineering_department.7096.d:0 "Los heraldos que iban a proclamar el monumento en el extranjero llevan dos meses sin cobrar y ahora se niegan a viajar. Alguien debe estar satisfecho de inmediato, ya sea que eso signifique recortar el [tv_wonder_scale_competence|E] del diseño o gastar el [prestige|E] de la corona para comprar su silencio."
 tv_engineering_department.7096.a:0 "Anuncie un monumento más pequeño y más barato y deje que los heraldos lleven esa palabra."
 tv_engineering_department.7096.b:0 "Paga a los heraldos con el nombre y la reputación de la corona."
 tv_engineering_department.7097.t:0 "Construcción: El mayordomo del barón cuenta el doble de madera"
 tv_engineering_department.7097.d:0 "El mayordomo de un barón ha contado la madera requisada en los bosques de su señor y encuentra el doble de lo acordado. El señor aceptará un recorte menor en el futuro, reduciendo el [tv_wonder_scale_competence|E] del plan, o una disculpa formal y más concesiones a [estate_satisfaction|E] entre los nobles."
 tv_engineering_department.7097.a:0 "Reduzca las futuras cuotas de madera y reduzca el diseño para que coincida."
 tv_engineering_department.7097.b:0 "Envíe una disculpa formal y más subvenciones a la casa del barón."
 tv_engineering_department.7098.t:0 "Construcción: La nave más ancha se tragaría el antiguo cementerio"
 tv_engineering_department.7098.d:0 "Un obispo se ha enterado de que el diseño de la nave más amplia se tragará el antiguo cementerio del cabildo. No volverá a bendecir las obras a menos que se reduzca el plan, o a menos que las quejas del capítulo hacia [estate_satisfaction|E] entre el clero sean respondidas en su totalidad."
 tv_engineering_department.7098.a:0 "Vuelva a dibujar la nave para salvar el cementerio."
 tv_engineering_department.7098.b:0 "Otorgue al capítulo nuevos privilegios para responder a sus quejas."
 tv_engineering_department.7099.t:0 "Construcción: La carretera ampliada atraviesa los almacenes"
 tv_engineering_department.7099.d:0 "Los comerciantes de lana informan que la carretera ampliada que conduce al lugar ha atravesado directamente su hilera de almacenes y que ahora las mercancías se pudren en el cruce. O el camino se vuelve a estrechar, recortando el [tv_wonder_scale_competence|E] de todo el acceso, o la corona compensa directamente al [estate_satisfaction|E] entre los burgueses."
 tv_engineering_department.7099.a:0 "Estreche el camino de acceso y evite los almacenes."
 tv_engineering_department.7099.b:0 "Pagad a los comerciantes sus pérdidas y conservad el camino más ancho."
 tv_engineering_department.7100.t:0 "Construcción: Un pueblo ha enterrado a tres hombres este mes"
 tv_engineering_department.7100.d:0 "Llega la noticia de que un pueblo cercano a la cantera ha enterrado a tres hombres este mes, que trabajaron hasta el anochecer en la orden ampliada. El juez dice que hay que reducir el servicio de corvee, a menos que la Corona prefiera responder por [estate_satisfaction|E] entre los campesinos con grano y plata en lugar de reducir [tv_wonder_scale_competence|E]."
 tv_engineering_department.7100.a:0 "Reducir el servicio de corvee a lo que el pueblo pueda soportar."
 tv_engineering_department.7100.b:0 "Envía grano y plata al pueblo y mantén el servicio de corvee según lo ordenado."
 tv_engineering_department.7101.t:0 "Construcción: una hilera de casas se derriba para trabajar en terreno"
 tv_engineering_department.7101.d:0 "El capataz ha arrancado una hilera de casas en pie en el lugar para ampliar el terreno de trabajo, y los habitantes preguntan qué se construirá en su lugar. La respuesta será reducir el diseño, sin ahorrarle a [tv_wonder_scale_competence|E] ningún terreno que no necesita, o significará limpiar aún más y perder más [development|E] del sitio."
 tv_engineering_department.7101.a:0 "Detener la limpieza adicional y volver a trazar el plano para que se ajuste al terreno ya ocupado."
 tv_engineering_department.7101.b:0 "Ordene que continúe la limpieza y deje que el sitio absorba la pérdida."
 tv_engineering_department.7102.t:0 "Construcción: El mercado que alguna vez rodeó el sitio ya no existe"
 tv_engineering_department.7102.d:0 "El mercado que antes rodeaba la zona de construcción ha sido ahuyentado por los andamios y el ruido, y los puestos no han regresado. El supervisor debe decidir si acerca las obras, renunciando a algo de [tv_wonder_scale_competence|E], o dejando que el [prosperity|E] del sitio siga sangrando mientras el mercado permanece desterrado."
 tv_engineering_department.7102.a:0 "Retira los andamios y deja que el mercado regrese."
 tv_engineering_department.7102.b:0 "Mantenga las obras extendidas y deje que el comercio del sitio se marchite."
 tv_engineering_department.7103.t:0 "Construcción: Los albañiles del puente quedaron maravillados"
 tv_engineering_department.7103.d:0 "Los albañiles reclutados para esta maravilla fueron retirados directamente de las reparaciones del puente de la propia capital, que ahora están a medio terminar antes del invierno. Alguien debe ceder: o el [tv_wonder_scale_competence|E] de la maravilla se encoge para que los albañiles puedan volver a casa, o el [development|E] de la capital se queda esperando a que pase la temporada sin ser reparado."
 tv_engineering_department.7103.a:0 "Libera a los albañiles de regreso a la capital y reduce la maravilla."
 tv_engineering_department.7103.b:0 "Mantenga a los albañiles en el asombro y deje que las reparaciones de la capital esperen."
 tv_engineering_department.7104.t:0 "Construcción: Los ayuntamientos de la capital se han quedado en silencio"
 tv_engineering_department.7104.d:0 "Los propios ayuntamientos de la capital se han quedado en silencio, y sus artesanos y carreteros se han alejado para alimentar el apetito de piedra y manos de la maravilla. El ayuntamiento se pregunta claramente si finalmente se adaptará el diseño, evitando el [tv_wonder_scale_competence|E], o si el [prosperity|E] de la capital debe seguir financiando un monumento que ya no ve construido en sus propias calles."
 tv_engineering_department.7104.a:0 "Reduce el diseño y libera a los miembros del gremio de regreso a la capital."
 tv_engineering_department.7104.b:0 "Mantén a los miembros del gremio en el lugar y deja que el comercio de la capital siga pagando por ello."
 tv_engineering_department.7105.t:0 "Construcción: el cirujano advierte que caerán más"
 tv_engineering_department.7105.d:0 "Anoche se derrumbó un andamio en la grada ampliada, y el cirujano dice que caerán más si el ritmo del plan más amplio no disminuye. El supervisor puede reducir el diseño a un ritmo al que las cuadrillas puedan sobrevivir, ahorrando [tv_wonder_scale_competence|E], o continuar impulsando el trabajo más amplio y aceptar que el [population|E] en el sitio seguirá disminuyendo."
 tv_engineering_department.7105.a:0 "Reduzca el ritmo y reduzca el plan a lo que las tripulaciones puedan soportar."
 tv_engineering_department.7105.b:0 "Mantengamos el trabajo en general avanzando y aceptemos el costo de los trabajadores."
 tv_engineering_department.7106.t:0 "Construcción: Dos empleados cuentan dos veces el mismo déficit"
 tv_engineering_department.7106.d:0 "La caja fuerte del pagador se quedó corta en el recuento de anoche, dos veces, por parte de dos empleados diferentes. O la moneda faltante se debita del tesoro, o toda la lista de turnos se destruye y cada equipo se reasigna de la nada. [tv_wonder_organization_competence|E] o [gold|E] pagarán la aritmética de los empleados."
 tv_engineering_department.7106.a:0 "Rompe la lista de turnos y reasigna a cada equipo desde cero."
 tv_engineering_department.7106.b:0 "Anule la moneda faltante contra el tesoro y deje la lista como contada."
 tv_engineering_department.7107.t:0 "Construcción: Una subvención falsificada se lee en voz alta a las tripulaciones"
 tv_engineering_department.7107.d:0 "Un pregonero que ningún capataz reconoce leyó una concesión falsificada de los derechos madereros del sitio a un señor rival, en plena audiencia de las cuadrillas. Perseguir al hombre y refutar el reclamo antes de que los trabajadores reunidos saquen a todos los capataces de su puesto por ese día. Dejar la falsificación sin respuesta mantiene a los equipos trabajando, pero la afirmación ya se repite en las tabernas como un hecho. [tv_wonder_organization_competence|E] o [legitimacy|E] llevarán la mentira del falsificador."
 tv_engineering_department.7107.a:0 "Saque a cada capataz de su puesto para cazar al pregonero y dejar las cosas claras."
 tv_engineering_department.7107.b:0 "Dejemos que la reclamación falsificada quede sin respuesta y mantengamos a las tripulaciones trabajando."
 tv_engineering_department.7108.t:0 "Construcción: Una pelea de empujones termina en la calle"
 tv_engineering_department.7108.d:0 "Una pelea de empujones en la línea del comedor, más de medio saco de grano podrido, se derramó por la puerta y salió a la calle antes de que la guardia lo rompiera. Las tripulaciones pueden ser reorganizadas y alimentadas en horas escalonadas para que las dos bandas nunca se vuelvan a encontrar, o la guardia puede realizar sus arrestos en la plaza abierta para resolver el asunto definitivamente. [tv_wonder_organization_competence|E] o [stability|E] responden al grano estropeado."
 tv_engineering_department.7108.a:0 "Reorganiza cada turno de desorden para que las dos pandillas nunca más se crucen."
 tv_engineering_department.7108.b:0 "Que la guardia se detenga en la plaza abierta."
 tv_engineering_department.7109.t:0 "Construcción: El enviado llega a una puerta no tripulada"
 tv_engineering_department.7109.d:0 "Un enviado extranjero llegó un día antes y encontró la puerta de honor sin personal y los estandartes todavía doblados en el pecho. La lista de tareas se puede dividir en el acto para preparar una bienvenida adecuada, o se puede acompañar al enviado por el sitio exactamente como está e informarlo a casa tal como lo vio. [tv_wonder_organization_competence|E] o [prestige|E] paga por la llegada anticipada."
 tv_engineering_department.7109.a:0 "Rompe la lista de turnos en el acto para organizar una bienvenida adecuada."
 tv_engineering_department.7109.b:0 "Guíe al enviado por el sitio exactamente como está."
 tv_engineering_department.7110.t:0 "Construcción: Los bueyes prestados están atrasados desde Michaelmas"
 tv_engineering_department.7110.d:0 "Las yuntas de bueyes tomadas prestadas de la finca de un señor vecino debían regresar a San Miguel y todavía están transportando piedra después de la fecha límite. Los equipos pueden ser enviados a casa a tiempo y los equipos de transporte reorganizados para arrastrar las cargas a mano, o los bueyes pueden quedarse otros quince días mientras se le dice al mayordomo del señor que espere. [tv_wonder_organization_competence|E] o el [estate_satisfaction|E] entre los nobles lleva los bueyes atrasados."
 tv_engineering_department.7110.a:0 "Envíe los bueyes a casa a tiempo y reorganice las cuadrillas para que los arrastren a mano."
 tv_engineering_department.7110.b:0 "Quédate con los bueyes otros quince días y dile al mayordomo del señor que espere."
 tv_engineering_department.7111.t:0 "Construcción: Los martillos ahogan la procesión de reliquias"
 tv_engineering_department.7111.d:0 "Los albañiles siguieron martillando la procesión de reliquias esta semana, y los cánticos no se podían escuchar en el lugar a tres calles de distancia. El calendario de turnos se puede volver a trazar para cada fiesta y día de procesión a partir de ahora, o simplemente se puede cambiar la ruta de la procesión y decirle al clero que el trabajo no se detendrá por ello. [tv_wonder_organization_competence|E] o [estate_satisfaction|E] entre el clero responde por el ruido."
 tv_engineering_department.7111.a:0 "Vuelva a dibujar el calendario de turnos para cada día de fiesta y procesión."
 tv_engineering_department.7111.b:0 "Mueva la ruta de la procesión y dígale al clero que el trabajo no se detendrá."
 tv_engineering_department.7112.t:0 "Construcción: Los vagones del sitio bloquean el carril del mercado de granos"
 tv_engineering_department.7112.d:0 "Una hilera de vagones de obra bloquea desde hace seis días la vía de carga del mercado de cereales y el gremio de comerciantes ha dejado de enviar a sus empleados a quejarse en persona. El cronograma de entrega se puede dividir y reconstruir en torno a una ruta más larga que mantenga el carril despejado, o los vagones pueden quedarse quietos mientras el gremio debe desviar su propio negocio. El [tv_wonder_organization_competence|E] o el [estate_satisfaction|E] entre los burgueses paga por el carril bloqueado."
 tv_engineering_department.7112.a:0 "Destruya el cronograma de entrega y reconstrúyalo en torno a una ruta más larga."
 tv_engineering_department.7112.b:0 "Deja los carros donde están y deja que el gremio se desvíe."
 tv_engineering_department.7113.t:0 "Construcción: La temporada de siembra llega sin sus manos"
 tv_engineering_department.7113.d:0 "Las cuadrillas de corvee que debían regresar a sus aldeas para plantar todavía están cortando piedra, y ha llegado la noticia de que los campos de este año quedarán sin sembrar sin ellos. Las cuadrillas pueden ser liberadas a tiempo y los turnos de trabajo del sitio reconstruidos con quien quede, o el servicio de corvee puede mantenerse más allá de su término mientras las aldeas se las arreglan sin manos. [tv_wonder_organization_competence|E] o [estate_satisfaction|E] entre los campesinos paga por los campos no plantados."
 tv_engineering_department.7113.a:0 "Liberar a las bandas de corvee a tiempo y reconstruir los turnos del sitio a partir de los que quedan."
 tv_engineering_department.7113.b:0 "Mantenga la corvee más allá de su plazo y deje que las aldeas se las arreglen."
 tv_engineering_department.7114.t:0 "Construcción: una pared derrumbada observa el propio pavimento del sitio"
 tv_engineering_department.7114.d:0 "Un muro de contención cedió durante la noche y la piedra labrada más cercana a la mano era el pavimento ya colocado a lo largo del camino de acceso al sitio. El pavimento se puede dejar donde está y cada mano libre dedicarse a otras tareas para extraer piedra fresca, o simplemente se puede romper la carretera nuevamente para parchar la pared antes de la mañana. [tv_wonder_organization_competence|E] o [development|E] en el sitio paga por el muro derrumbado."
 tv_engineering_department.7114.a:0 "Retire todas las manos libres de otras tareas para extraer piedra fresca."
 tv_engineering_department.7114.b:0 "Vuelva a abrir el camino de acceso para reparar el muro por la mañana."
 tv_engineering_department.7115.t:0 "Construcción: Los vendedores de pan se van por los salarios atrasados"
 tv_engineering_department.7115.d:0 "Los vendedores de pan del mercado del campamento hicieron las maletas y se marcharon después de que el salario de la semana pasada fuera entregado con tres días de retraso y la mitad en monedas recortadas. Los salarios pueden ajustarse a un cronograma más estricto y más frecuente para atraer a los vendedores a regresar, rompiendo la actual rotación salarial para hacerlo, o el campamento puede simplemente quedarse sin su mercado y los trabajadores pueden valerse por sus propios alimentos. [tv_wonder_organization_competence|E] o [prosperity|E] en el sitio paga los salarios atrasados."
 tv_engineering_department.7115.a:0 "Destruya la rotación salarial y vuelva a dibujarla en un cronograma más estricto para atraer a los vendedores a regresar."
 tv_engineering_department.7115.b:0 "Dejemos que el campamento se quede sin mercado y dejemos que los trabajadores se las arreglen para conseguir sus alimentos."
 tv_engineering_department.7116.t:0 "Construcción: Los andamios del puente desaparecen de la noche a la mañana"
 tv_engineering_department.7116.d:0 "Los andamios que estaban listos para la reparación del puente de la capital se cargaron silenciosamente en los vagones de la obra durante la noche, y el personal del puente llegó y descubrió que no había madera. Los propios tramos de suministro del sitio pueden alargarse y sus desplazamientos reconstruirse alrededor de una fuente de madera más lejana, o el puente de la capital puede simplemente esperar mientras sus vigas terminan la maravilla primero. [tv_wonder_organization_competence|E] o [development|E] en la capital paga los andamios que faltan."
 tv_engineering_department.7116.a:0 "Ampliar los recorridos de suministro del sitio y reconstruir sus desplazamientos alrededor de una fuente de madera más lejana."
 tv_engineering_department.7116.b:0 "Que espere el puente de la capital mientras sus vigas terminan primero la maravilla."
 tv_engineering_department.7117.t:0 "Construcción: La Sala del Gremio permanece vacía al mediodía"
 tv_engineering_department.7117.d:0 "La mitad de los vidrieros y carpinteros de la capital han estado en el lugar durante tres semanas seguidas, y la sala del gremio en casa ahora está prácticamente vacía al mediodía. Los maestros pueden rotarse de regreso a casa y las cuadrillas de trabajo reconstruirse alrededor de los aprendices que queden, o los maestros pueden simplemente quedarse donde están mientras los propios talleres de la capital permanecen inactivos por un tiempo más. [tv_wonder_organization_competence|E] o [prosperity|E] en la capital paga por la sala del gremio vacía."
 tv_engineering_department.7117.a:0 "Rota a los maestros a casa y reconstruye las cuadrillas del sitio con los aprendices restantes."
 tv_engineering_department.7117.b:0 "Mantenga a los maestros en el lugar y deje que los talleres de la capital permanezcan inactivos."
 tv_engineering_department.7118.t:0 "Construcción: una plataforma con personal reducido pierde su cuerda"
 tv_engineering_department.7118.d:0 "Un cable de elevación se partió esta mañana cuando un equipo con poca mano de obra se dobló en la plataforma para hacer la hora, y tres hombres se hundieron con él. Las pandillas de reserva pueden ser retiradas de sus propias tareas y arrojadas a la plataforma mañana sin importar lo que haga con el cronograma, o la misma tripulación puede ser enviada de regreso con escasez de personal una vez que se lleven a los heridos. [tv_wonder_organization_competence|E] o el trabajador [population|E] en el sitio paga por la cuerda partida."
 tv_engineering_department.7118.a:0 "Saque a las bandas de reserva de sus propias tareas y tírelas a la plataforma, al diablo con el horario."
 tv_engineering_department.7118.b:0 "Envíe a la misma tripulación escasa de personal una vez que se hayan llevado a los heridos."
 tv_engineering_department.7119.t:0 "Construcción: Un puente torcido deja al convoy en el barro"
 tv_engineering_department.7119.d:0 "Un puente sobre la carretera de suministros se combó bajo el peso de los carros de piedra, y la mitad del convoy ahora se encuentra varado en el barro debajo de él. Los barqueros en el cruce dicen que transportarán los vagones en balsas por un precio y que alguien los pagará de una forma u otra."
 tv_engineering_department.7119.a:0 "Deja los vagones donde están y dirige el resto alrededor del puente roto, cueste lo que cueste el [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7119.b:0 "Paga el precio de los barqueros con cargo al tesoro para que los vagones crucen hoy, drenando [gold|E]."
 tv_engineering_department.7120.t:0 "Construcción: Ya no se respeta el sello del peaje"
 tv_engineering_department.7120.d:0 "Los escoltas del convoy fueron rechazados en el peaje de un vecino, y su carta llevaba un sello que el señor local ya no honra. Alguien debe decidir si forzar la apertura de la puerta en nombre de la corona o dejar que los carros permanezcan afuera."
 tv_engineering_department.7120.a:0 "Haga retroceder el convoy y encuentre una ruta más larga alrededor del peaje en disputa, dejando escapar [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7120.b:0 "Invoca la autoridad de la corona para forzar la apertura de la puerta ahora, gastando [legitimacy|E] en una disputa aún no resuelta."
 tv_engineering_department.7121.t:0 "Construcción: Los aldeanos bloquean la carretera debido a una tercera requisa"
 tv_engineering_department.7121.d:0 "Los aldeanos han bloqueado la carretera con sus propios carros, negándose a moverse hasta que se cancele la tercera requisa de esta temporada. El convoy no puede pasar sin retroceder o sin traer soldados para despejar el camino."
 tv_engineering_department.7121.a:0 "Retrocede, desvía el convoy alrededor del bloqueo y acepta la paralización que esto deja en [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7121.b:0 "Envíe soldados para despejar el camino por la fuerza y cuente el costo en [stability|E]."
 tv_engineering_department.7122.t:0 "Construcción: Al capataz se le niegan los caballos ante los testigos"
 tv_engineering_department.7122.d:0 "Al capataz del convoy se le negaron caballos de tiro frescos en un tribunal rival y se le despidió delante de testigos. Conseguir los caballos ahora significa pedir favores que avergüenzan al tribunal para que cumpla; no conseguirlos significa que los vagones se arrastrarán el resto del camino."
 tv_engineering_department.7122.a:0 "Envía al capataz con los caballos cansados que ya tiene y deja que el retraso se note en [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7122.b:0 "Pide favores públicamente para avergonzar a la corte rival y obligarla a entregar caballos frescos, gastando [prestige|E] en ellos."
 tv_engineering_department.7123.t:0 "Construcción: Los Carters se apoderan de los caballos de una casa noble."
 tv_engineering_department.7123.d:0 "Los carreteros del convoy se apoderaron de los caballos del carruaje de una casa noble cuando los equipos de la maravilla se quedaron cortos, y la familia exige que se los devuelvan antes del anochecer. La devolución de los caballos detiene los carros; mantenerlos agota la paciencia de la familia."
 tv_engineering_department.7123.a:0 "Devuelve los caballos a la casa noble esta noche y deja que los carros esperen sin ellos, al costo de [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7123.b:0 "Mantenga los caballos prestados trabajando en el convoy un tiempo más, sin importar lo que le haga a [estate_satisfaction|E] entre los nobles."
 tv_engineering_department.7124.t:0 "Construcción: Los carros pasaron en un día festivo"
 tv_engineering_department.7124.d:0 "El camino de abastecimiento más corto atraviesa tierras del monasterio, y los carros pasaban por allí en un día festivo antes de que a nadie se le ocurriera pedir permiso. Los monjes han cerrado la puerta y quieren que el convoy regrese o respondan por él."
 tv_engineering_department.7124.a:0 "Haga retroceder los carros y busque otro camino alrededor de los terrenos del monasterio, dejando que el desvío cueste [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7124.b:0 "Empuja el convoy a través de la puerta como estaba planeado y deja que la ofensiva se quede con [estate_satisfaction|E] entre el clero."
 tv_engineering_department.7125.t:0 "Construcción: El convoy espera a que pase la tormenta en la plaza del mercado"
 tv_engineering_department.7125.d:0 "El convoy estacionó sus vagones frente a la plaza del mercado de la ciudad durante la noche para esperar a que pasara una tormenta, y los vendedores no han podido abrir desde entonces. Los comerciantes exigen que la plaza sea despejada hoy, con tormenta o sin ella."
 tv_engineering_department.7125.a:0 "Mueva los vagones hacia el clima ahora y deje que la tormenta desacelere [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7125.b:0 "Mantenga los carros en la plaza un rato más y deje que la ira de los comerciantes caiga sobre [estate_satisfaction|E] entre los burgueses."
 tv_engineering_department.7126.t:0 "Construcción: El mismo pueblo pierde sus bueyes por tercera vez"
 tv_engineering_department.7126.d:0 "A la misma aldea le han requisado tres veces este mes sus bueyes y sus carros para el convoy, y los campos están sin arar. O los animales vuelven al arado o los carros tiran solos."
 tv_engineering_department.7126.a:0 "Envía los bueyes de regreso a los campos y deja que el convoy avance sin ellos, a un costo de [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7126.b:0 "Requisa los bueyes por cuarta vez y deja que el cansancio del pueblo se refleje en [estate_satisfaction|E] entre los campesinos."
 tv_engineering_department.7127.t:0 "Construcción: Un deslizamiento de tierra entierra el camino hacia el sitio"
 tv_engineering_department.7127.d:0 "Un deslizamiento de tierra ha sepultado el último tramo de la carretera hacia el sitio, y la única solución rápida es destruir los patios de preparación recién colocados para rellenarlos y entablarlos. O el sitio abandona su propio terreno o el convoy espera fuera del tobogán."
 tv_engineering_department.7127.a:0 "Deje los patios de preparación intactos y deje que el convoy se quede fuera del tobogán, al costo de [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7127.b:0 "Rompe los patios recién colocados para rellenarlos y entablarlos para despejar el camino, gastando [development|E] en el sitio."
 tv_engineering_department.7128.t:0 "Construcción: Es necesario ampliar la carretera más allá de los puestos de trabajadores"
 tv_engineering_department.7128.d:0 "Los carros necesitan que se ensanche el camino más allá de los puestos de los trabajadores del sitio, y los vendedores no tienen otro lugar donde comerciar. O los puestos bajan para dejar pasar al convoy o los vagones pasan a paso lento."
 tv_engineering_department.7128.a:0 "Deje que los vagones pasen a paso lento y deje los puestos en pie, al coste de [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7128.b:0 "Despeja los puestos de vendedores para ensanchar el camino para el convoy, gastando [prosperity|E] en el sitio."
 tv_engineering_department.7129.t:0 "Construcción: Las calles de la capital están destrozadas para empujar el convoy"
 tv_engineering_department.7129.d:0 "Los propios carreteros y cuadrillas de adoquines de la capital fueron retirados de su trabajo habitual para empujar el convoy estancado el último kilómetro hacia la ciudad. Las calles de la capital están medio desgarradas y medio vacías, ya sea que los carros esperen o no."
 tv_engineering_department.7129.a:0 "Envía a las tripulaciones de la capital a su propio trabajo y deja que el convoy se detenga en las puertas, a un coste de [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7129.b:0 "Mantén a los equipos de la capital fuera de las calles para terminar de transportar los vagones, gastando [development|E] en la capital."
 tv_engineering_department.7130.t:0 "Construcción: Carga estancada ocupa la plaza del mercado de la capital"
 tv_engineering_department.7130.d:0 "El convoy se apoderó de la plaza del mercado central de la capital para almacenar el cargamento estancado de la maravilla, y las caravanas que normalmente comercian allí han sido rechazadas durante una semana. O la carga sigue su camino y el mercado vuelve a abrir, o la plaza sigue siendo un almacén por un tiempo más."
 tv_engineering_department.7130.a:0 "Saque la carga de inmediato, aunque sea bruscamente, y ejerza presión sobre [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7130.b:0 "Deja la carga en la plaza y mantén alejadas a las caravanas, gastando [prosperity|E] en la capital."
 tv_engineering_department.7131.t:0 "Construcción: Se pone a los trabajadores contra las cuerdas en lugar de los bueyes"
 tv_engineering_department.7131.d:0 "Con los animales de tiro agotados y sin otros nuevos, los capataces del sitio han comenzado a poner trabajadores a las cuerdas para arrastrar a mano los carros varados. O los hombres siguen acarreando hasta quedar exhaustos o los carros se quedan donde se quedaron atrapados."
 tv_engineering_department.7131.a:0 "Deje los carros atascados donde están en lugar de hacer trabajar más a los hombres, a un costo de [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7131.b:0 "Mantenga a los trabajadores tirando de las cuerdas hasta que los carros se muevan, gastando el [population|E] de trabajo en el sitio."
 tv_engineering_department.7132.t:0 "Construcción: Los picapedreros dejan de trabajar sin recibir remuneración"
 tv_engineering_department.7132.d:0 "El gremio de canteros ha dejado de trabajar y no ha recibido ningún pago durante dos meses consecutivos. Su capataz está en la puerta con un libro de contabilidad y el puño cerrado, y alguien debe abrir el patio o el tesoro."
 tv_engineering_department.7132.a:0 "Deje que los cortadores caminen y deje que el progreso de [tv_wonder_construction|E] espere."
 tv_engineering_department.7132.b:0 "Pague los atrasos en [gold|E] y mantenga los cinceles en movimiento."
 tv_engineering_department.7133.t:0 "Construcción: Un pretendiente cita el escrito perdido"
 tv_engineering_department.7133.d:0 "Ha llegado al consejo la noticia de que los albañiles del lugar fueron reclutados sin la orden judicial habitual, y un pretendiente ya lo está citando como prueba de que la corona gobierna por capricho. Alguien debe responder por el atajo: ya sea la obra en sí o el mandato que la ordenó."
 tv_engineering_department.7133.a:0 "Retirar el impuesto y dejar que el progreso [tv_wonder_construction|E] se quede atrás."
 tv_engineering_department.7133.b:0 "Respalden la orden judicial y dejen que cueste la corona [legitimacy|E]."
 tv_engineering_department.7134.t:0 "Construcción: Los aldeanos bloquean el camino de los carros con sus cuerpos"
 tv_engineering_department.7134.d:0 "Los aldeanos cuyos espacios comunes estaban vallados para el camino de la cantera bloquearon el camino de los carros con sus propios cuerpos. O los carros regresan esta noche, o los soldados despejan el camino y el campo lo recuerda."
 tv_engineering_department.7134.a:0 "Gire los carros hacia atrás y deje esperar el progreso de [tv_wonder_construction|E]."
 tv_engineering_department.7134.b:0 "Manda al guardia a despejar la pista y gasta el [stability|E] que cuesta."
 tv_engineering_department.7135.t:0 "Construcción: Un embajador recorre un andamio medio derrumbado"
 tv_engineering_department.7135.d:0 "Un embajador extranjero recorrió el lugar temprano y encontró un andamio medio derrumbado sobre mortero verde; Su informe a casa ya se está redactando. El supervisor puede detener el trabajo para rehacerlo correctamente o dejar que el embajador escriba lo que vio."
 tv_engineering_department.7135.a:0 "Derribe la sección defectuosa y deje que el progreso de [tv_wonder_construction|E] retroceda."
 tv_engineering_department.7135.b:0 "Deja el andamio en pie y deja que la carta cueste la corona [prestige|E]."
 tv_engineering_department.7136.t:0 "Construcción: Un señor descubre su coto de caza marcado para la cantera"
 tv_engineering_department.7136.d:0 "Un señor local descubrió que su coto de caza estaba marcado para la cantera de la maravilla y cabalgó furioso hacia la corte, exigiendo que los topógrafos se retiraran o que se respondiera por el honor de su familia. Alguien de abajo debe ceder terreno."
 tv_engineering_department.7136.a:0 "Recuerde a los topógrafos y deje que el progreso de [tv_wonder_construction|E] se quede atrás."
 tv_engineering_department.7136.b:0 "Mantén la línea de la cantera y deja que cueste [estate_satisfaction|E] entre los nobles."
 tv_engineering_department.7137.t:0 "Construcción: La Fundación revela un viejo cementerio"
 tv_engineering_department.7137.d:0 "Los excavadores que preparaban los cimientos encontraron un antiguo cementerio parroquial que nadie había registrado, y los sacerdotes se niegan a bendecir más trabajos hasta que se vuelva a enterrar adecuadamente. Alguien debe elegir entre las palas y los sacramentos."
 tv_engineering_department.7137.a:0 "Detén a los excavadores hasta que finalice el rito del nuevo entierro y deja que el progreso de [tv_wonder_construction|E] espere."
 tv_engineering_department.7137.b:0 "Ordene que continúe la excavación y que cueste [estate_satisfaction|E] entre el clero."
 tv_engineering_department.7138.t:0 "Construcción: Carros de mampostería se tragan la plaza de los comerciantes"
 tv_engineering_department.7138.d:0 "La plaza de los comerciantes lleva una semana medio devorada por carros de albañilería, y los maestros del gremio dicen que otra semana más arruinará la feria de otoño. O los carros encuentran una nueva ruta esta noche o la feria se abre a un patio de obras."
 tv_engineering_department.7138.a:0 "Redirigir los carros y dejar que [tv_wonder_construction|E] avance lentamente."
 tv_engineering_department.7138.b:0 "Mantén los carros en la plaza y deja que cueste [estate_satisfaction|E] entre los burgueses."
 tv_engineering_department.7139.t:0 "Construcción: Las cuadrillas de Corvee se pierden la última semana seca"
 tv_engineering_department.7139.d:0 "Los equipos de corvee retirados de tres aldeas para la campaña de este mes se han perdido la última semana seca para la cosecha, y los jefes se preguntan si sus campos o la maravilla son lo primero. Uno de los dos debe ceder."
 tv_engineering_department.7139.a:0 "Envíe a las cuadrillas de regreso a los campos y deje que [tv_wonder_construction|E] progrese lentamente."
 tv_engineering_department.7139.b:0 "Mantenga las cuadrillas en el sitio y deje que cueste [estate_satisfaction|E] entre los campesinos."
 tv_engineering_department.7140.t:0 "Construcción: Un muro derrumbado entierra los propios talleres del sitio"
 tv_engineering_department.7140.d:0 "Un muro de contención cedió durante la noche y enterró los talleres y tiendas a medio terminar que habían crecido alrededor del sitio. Reconstruirlos adecuadamente le costará algo al sitio de cualquier manera: mano de obra extraída de la maravilla o de lo que se encuentra a su alrededor."
 tv_engineering_department.7140.a:0 "Saque a los equipos de la maravilla para apuntalar los talleres y deje que el progreso de [tv_wonder_construction|E] retroceda."
 tv_engineering_department.7140.b:0 "Deje los talleres como escombros y déjelo costar [development|E] en el sitio."
 tv_engineering_department.7141.t:0 "Construcción: Los vendedores ambulantes son expulsados hacia un nuevo depósito de almacenamiento"
 tv_engineering_department.7141.d:0 "Los vendedores ambulantes y los pequeños talleres que habían surgido para alimentar a los equipos de trabajo fueron expulsados esta semana para limpiar el terreno para un nuevo depósito de almacenamiento, y la pequeña economía del sitio se ha calmado con ellos. El almacén o el propio comercio del lugar: uno de los dos mantiene el terreno."
 tv_engineering_department.7141.a:0 "Devuélvele el terreno a los vendedores ambulantes y deja que el progreso de [tv_wonder_construction|E] espere en la reserva."
 tv_engineering_department.7141.b:0 "Mantenga el depósito de almacenamiento y déjelo costar [prosperity|E] en el sitio."
 tv_engineering_department.7142.t:0 "Construcción: Todos los albañiles de la capital son requisados"
 tv_engineering_department.7142.d:0 "Las reparaciones de los puentes de la capital se han estancado porque todos los albañiles y carros de la ciudad fueron requisados para el último impulso de la maravilla. Los magistrados quieren que sus tripulaciones regresen antes de que falle el tramo; el sitio los quiere un mes más."
 tv_engineering_department.7142.a:0 "Libere a los albañiles de regreso a la capital y deje que [tv_wonder_construction|E] avance lentamente."
 tv_engineering_department.7142.b:0 "Mantenga a los albañiles en el sitio y deje que cueste [development|E] en la capital."
 tv_engineering_department.7143.t:0 "Construcción: Carros de piedra cierran dos calles de la capital"
 tv_engineering_department.7143.d:0 "Carros cargados de piedra labrada que circulan por el distrito comercial de la capital han cerrado dos calles durante una semana, y los comerciantes dicen que el comercio ya se está trasladando a otros lugares. O los convoyes encuentran una ruta más larga o el distrito sigue perdiendo costumbres."
 tv_engineering_department.7143.a:0 "Redirige los convoyes por el camino más largo y deja que el progreso de [tv_wonder_construction|E] se quede atrás."
 tv_engineering_department.7143.b:0 "Mantenga los convoyes en la ruta corta y deje que cueste [prosperity|E] en la capital."
 tv_engineering_department.7144.t:0 "Construcción: La fiebre se extiende por el campo de trabajadores"
 tv_engineering_department.7144.d:0 "La fiebre se ha extendido por el campo de trabajadores y los médicos dicen que los enfermos deben descansar o se propagará a toda la tripulación. Alguien debe elegir entre obligarlos a superar esto y perder el trabajo, o dejarlos y perder a los trabajadores."
 tv_engineering_department.7144.a:0 "Detenga a las tripulaciones para recuperarse y deje que el progreso de [tv_wonder_construction|E] se deslice."
 tv_engineering_department.7144.b:0 "Trabaje a los enfermos y deje que le cueste al trabajador [population|E] en el sitio."
 tv_engineering_department.7145.t:0 "Construcción: un nuevo vacío en la tesorería"
 tv_engineering_department.7145.d:0 "La maravilla atrae monedas más rápido de lo que esperaban los libros de contabilidad. El Tesoro puede explicar la escasez, pero la explicación no acuña plata."
 tv_engineering_department.7145.a:0 "Estira los libros de contabilidad para cubrir el hueco."
 tv_engineering_department.7146.t:0 "Construcción: Polvo en el Sello Real"
 tv_engineering_department.7146.d:0 "El respaldo real se extiende a demasiados compromisos. El sello aún se mantiene, pero parece más delgado."
 tv_engineering_department.7146.a:0 "Deja que el sello real se diluya un poco."
 tv_engineering_department.7147.t:0 "Construcción: Las ciudades tranquilas están perturbadas"
 tv_engineering_department.7147.d:0 "El ritmo de la construcción presiona contra la vida ordinaria. Los mercados abren tarde, los pueblos se quejan y el orden cede un poco de terreno."
 tv_engineering_department.7147.a:0 "Dejamos que los pueblos se quejen y sigan adelante a pesar de todo."
 tv_engineering_department.7148.t:0 "Construcción: La cancha pierde color"
 tv_engineering_department.7148.d:0 "La corte presta color a las obras y recibe polvo a cambio. El prestigio se desvanece en pequeñas bromas públicas y alardes a medio terminar."
 tv_engineering_department.7148.a:0 "Cambia un poco de brillo por algunos chistes judiciales."
 tv_engineering_department.7149.t:0 "Construcción: Palabras frías en mesas nobles"
 tv_engineering_department.7149.d:0 "Las familias nobles vuelven a ceder. La concesión es formal y fría, lo que a menudo es peor que el rechazo."
 tv_engineering_department.7149.a:0 "Acepta la fría y formal concesión de los nobles."
 tv_engineering_department.7150.t:0 "Construcción: Fruncir el ceño ante el altar."
 tv_engineering_department.7150.d:0 "El calendario sagrado vuelve a doblarse hacia el lugar de trabajo. El clero obedece, pero la obediencia tiene aristas."
 tv_engineering_department.7150.a:0 "Aceptamos la obediencia del clero, con límites y todo."
 tv_engineering_department.7151.t:0 "Construcción: Libros mayores más delgados en el mercado"
 tv_engineering_department.7151.d:0 "Los negocios del mercado están volcados en torno al proyecto. Los burgueses pueden beneficiarse de la grandeza, pero no cuando todos los caminos hacia ella están bloqueados."
 tv_engineering_department.7151.a:0 "¡Despeja los caminos y sigue construyendo!"
 tv_engineering_department.7152.t:0 "Construcción: espaldas más pesadas en las aldeas"
 tv_engineering_department.7152.d:0 "Los hombros rurales soportan otra carga. El proyecto avanza y la paciencia del pueblo se agota."
 tv_engineering_department.7152.a:0 "Acumula la carga adicional sobre los hombros rurales."
 tv_engineering_department.7153.t:0 "Construcción: El sitio cede sus calles"
 tv_engineering_department.7153.d:0 "El sitio renuncia a más de su tejido habitual. Una maravilla del futuro gana espacio, mientras las calles del presente pierden uso."
 tv_engineering_department.7153.a:0 "Señala estas calles para las maravillas del mañana."
 tv_engineering_department.7154.t:0 "Construcción: El sitio se vuelve más silencioso"
 tv_engineering_department.7154.d:0 "El sitio se vuelve más tranquilo comercialmente a medida que el intercambio ordinario se dirige hacia el monumento. La prosperidad sólo puede redirigirse un número determinado de veces antes de que disminuya."
 tv_engineering_department.7154.a:0 "Dirigimos una vez más el comercio del sitio hacia el monumento."
 tv_engineering_department.7155.t:0 "Construcción: los proyectos de capital abren paso"
 tv_engineering_department.7155.d:0 "Los proyectos de capital vuelven a dejar paso a la maravilla. La ciudad real sigue siendo grandiosa, pero se está tomando prestada parte de su estructura."
 tv_engineering_department.7155.a:0 "Le da el marco propio de la capital a la maravilla."
 tv_engineering_department.7156.t:0 "Construcción: Calles más tranquilas en la capital"
 tv_engineering_department.7156.d:0 "Los mercados de la capital pierden un poco de brillo a medida que el proyecto atrae créditos y bienes. El tribunal puede llamarlo patriótico; los comerciantes lo llaman comercio más lento."
 tv_engineering_department.7156.a:0 "Cada monumento toma prestado su brillo de alguna parte."
 tv_engineering_department.7157.t:0 "Construcción: Nombres agregados a la lista de lesiones"
 tv_engineering_department.7157.d:0 "Los nombres se añaden a las tiradas de heridos. El trabajo continúa, pero cada nueva marca cambia la forma en que los trabajadores miran la piedra."
 tv_engineering_department.7157.a:0 "¡Anota los nombres y continúa!"
 tv_engineering_department.7158.t:0 "Construcción：Silencio en la Puerta del Tesoro"
 tv_engineering_department.7158.d:0 "Una dura exigencia por parte del sitio deja al tesoro visiblemente vacío. El monumento continúa y el reino paga antes de poder admirar algo."
 tv_engineering_department.7158.a:0 "Vacía el tesoro y deja que la piedra suba de todos modos."
 tv_engineering_department.7159.t:0 "Construcción: mandato de grietas antes del sitio"
 tv_engineering_department.7159.d:0 "Las exigencias del lugar de trabajo obligan a la corona a adoptar una postura indigna. La promesa de grandeza ahora se apoya en una autoridad dañada."
 tv_engineering_department.7159.a:0 "Dejamos que la corona se doble para que las paredes puedan levantarse."
 tv_engineering_department.7160.t:0 "Construcción: Orden de astillas en el impuesto"
 tv_engineering_department.7160.d:0 "Una perturbación más dura trasciende la valla. Los funcionarios pueden nombrar la causa, pero no pueden hacer que el país se sienta resuelto al nombrarla."
 tv_engineering_department.7160.a:0 "Dejemos que los disturbios sigan su curso más allá de la valla."
 tv_engineering_department.7161.t:0 "Construcción: El honor flaquea en público"
 tv_engineering_department.7161.d:0 "Una vergüenza pública en el sitio viaja más rápido que cualquier corrección oficial. El honor paga por la piedra que aún no está en pie."
 tv_engineering_department.7161.a:0 "¡Déjalos hablar!"
 tv_engineering_department.7162.t:0 "Construcción: La noble paciencia está cincelada"
 tv_engineering_department.7162.d:0 "El proyecto corta la noble paciencia hasta que la cortesía ya no puede tapar el sonido. Un monumento es un mal huésped cuando devora la herencia."
 tv_engineering_department.7162.a:0 "Que los nobles refunfuñen mientras avanza la mampostería."
 tv_engineering_department.7163.t:0 "Construcción: La paciencia se acaba en la sacristía"
 tv_engineering_department.7163.d:0 "Una demanda de construcción pisotea demasiado cerca del altar. El clero no olvida que la piedad es tratada como un espacio abierto."
 tv_engineering_department.7163.a:0 "Aceptamos el frío silencio del clero como precio de la piedra."
 tv_engineering_department.7164.t:0 "Construcción: La ira llega a las calles"
 tv_engineering_department.7164.d:0 "La ira llega a las fachadas de las tiendas mientras el lugar de trabajo devora espacio, tiempo y crédito. La ciudad oye el monumento antes de verlo."
 tv_engineering_department.7164.a:0 "Deja que los escaparates refunfuñen mientras los andamios suben."
 tv_engineering_department.7165.t:0 "Construcción: La ira rural no se quedará callada"
 tv_engineering_department.7165.d:0 "La ira rural no se quedará callada tras este impuesto. La sombra de la maravilla llega a granjas que tal vez nunca vean su rostro terminado."
 tv_engineering_department.7165.a:0 "¡Que los campos lo soporten!"
 tv_engineering_department.7166.t:0 "Construcción: El sitio retrocede"
 tv_engineering_department.7166.d:0 "Las obras huecan el sitio lo suficiente como para retrasarlo. El monumento aún no se ha levantado, pero el lugar que lo rodea ya ha pagado."
 tv_engineering_department.7166.a:0 "Retrocede el sitio para que el monumento pueda avanzar."
 tv_engineering_department.7167.t:0 "Construcción: La prosperidad del sitio está sofocada"
 tv_engineering_department.7167.d:0 "El lugar de trabajo asfixia el mercado local por un tiempo. Todavía llegan carros, pero son menos los que sirven al pueblo alrededor de la piedra."
 tv_engineering_department.7167.a:0 "Permite que el mercado local se vaya reduciendo mientras continúan las obras."
 tv_engineering_department.7168.t:0 "Construcción: La capital paga en piedra"
 tv_engineering_department.7168.d:0 "El capital paga en piedra, mano de obra y reparaciones retrasadas. Un monumento lejano se vuelve más real mientras los planos cercanos se vuelven vacíos."
 tv_engineering_department.7168.a:0 "Dejamos que las propias reparaciones de la capital esperen la maravilla lejana."
 tv_engineering_department.7169.t:0 "Construcción: El comercio de la Ciudad Real está bajo presión"
 tv_engineering_department.7169.d:0 "El comercio de la ciudad real se ve afectado por las obras. La grandeza lejana embota las calles que deben financiarla."
 tv_engineering_department.7169.a:0 "Eclipsa las calles de la ciudad real para financiar la grandeza en otros lugares."
 tv_engineering_department.7170.t:0 "Construcción: El sudor se convierte en sangre"
 tv_engineering_department.7170.d:0 "El sudor se convierte en sangre en el lugar. El monumento no se cancela, lo que puede ser la parte más cruel de la lección."
 tv_engineering_department.7170.a:0 "Seguimos adelante, aunque el sitio ha pagado con sangre."
 tv_engineering_department.7171.t:0 "Construcción: [tv_great_engineer|E] gana la calle"
 tv_engineering_department.7171.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] convierte un recorrido técnico en un triunfo público. El resultado es una mejora importante en [tv_wonder_domestic_support|E].\n\n#G . Este evento ocurrió porque el [tv_great_engineer|E] actual tiene una capacidad militar efectiva superior a 80.#!."
 tv_engineering_department.7171.a:0 "Convierte una inspección de rutina en un triunfo público."
 tv_engineering_department.7172.t:0 "Construcción: [tv_great_engineer|E] vuelve a dibujar la gran línea"
 tv_engineering_department.7172.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] vuelve a dibujar el eje principal con una confianza que hace creíble el plan más amplio. El resultado es una mejora importante en [tv_wonder_scale_competence|E].\n\n#G . Este evento ocurrió porque el [tv_great_engineer|E] actual tiene una capacidad militar efectiva superior a 80.#!."
 tv_engineering_department.7172.a:0 "Hace que el gran eje parezca inevitable, no imprudente."
 tv_engineering_department.7173.t:0 "Construcción: [tv_great_engineer|E] reconstruye el cronograma"
 tv_engineering_department.7173.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] reconstruye el cronograma con tanta claridad que incluso los capataces rivales lo obedecen. El resultado es una mejora importante en [tv_wonder_organization_competence|E].\n\n#G . Este evento ocurrió porque el [tv_great_engineer|E] actual tiene una capacidad militar efectiva superior a 80.#!."
 tv_engineering_department.7173.a:0 "Nos alineamos con el nuevo horario."
 tv_engineering_department.7174.t:0 "Construcción: [tv_great_engineer|E] abre el camino"
 tv_engineering_department.7174.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] abre una ruta de suministro que hace que los viejos retrasos parezcan casi una tontería. El resultado es una mejora importante en [tv_wonder_logistics_competence|E].\n\n#G . Este evento ocurrió porque el [tv_great_engineer|E] actual tiene una capacidad militar efectiva superior a 80.#!."
 tv_engineering_department.7174.a:0 "¡Por fin el camino está abierto!"
 tv_engineering_department.7175.t:0 "Construcción: [tv_great_engineer|E] impulsa las obras principales"
 tv_engineering_department.7175.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] impulsa las obras principales a través de un problema que había estancado a manos menores. El resultado es una mejora importante en el progreso del [tv_wonder_construction|E].\n\n#G Este evento ocurrió porque el [tv_great_engineer|E] actual tiene una capacidad militar efectiva superior a 80.#!"
 tv_engineering_department.7175.a:0 "Impulsa limpiamente las piezas estancadas."
 tv_engineering_department.7176.t:0 "Construcción: [tv_great_engineer|E] calma el rumor"
 tv_engineering_department.7176.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] responde a los rumores con explicaciones lo suficientemente sencillas como para estabilizar la confianza del público. El proyecto obtiene una mejora más constante en [tv_wonder_domestic_support|E].\n\n#G . Este evento ocurrió porque el [tv_great_engineer|E] actual tiene una capacidad militar efectiva superior a 50.#!."
 tv_engineering_department.7176.a:0 "Acalla los rumores con palabras sencillas."
 tv_engineering_department.7177.t:0 "Construcción: [tv_great_engineer|E] establece la medida"
 tv_engineering_department.7177.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] encuentra suficiente margen en el sitio para evitar que el proyecto tenga un diseño tímido. El proyecto obtiene una mejora más constante en [tv_wonder_scale_competence|E].\n\n#G . Este evento ocurrió porque el [tv_great_engineer|E] actual tiene una capacidad militar efectiva superior a 50.#!."
 tv_engineering_department.7177.a:0 "Le damos al plan suficiente espacio para que sea audaz."
 tv_engineering_department.7178.t:0 "Construcción: [tv_great_engineer|E] endereza los rollos"
 tv_engineering_department.7178.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] arregla un lío persistente de equipos, herramientas y relojes. El proyecto obtiene una mejora más constante en [tv_wonder_organization_competence|E].\n\n#G . Este evento ocurrió porque el [tv_great_engineer|E] actual tiene una capacidad militar efectiva superior a 50.#!."
 tv_engineering_department.7178.a:0 "Vuelve a poner en orden las tripulaciones, las herramientas y los relojes."
 tv_engineering_department.7179.t:0 "Construcción: [tv_great_engineer|E] despeja el convoy"
 tv_engineering_department.7179.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] despeja el peor nudo en el itinerario del convoy. El proyecto obtiene una mejora más constante en [tv_wonder_logistics_competence|E].\n\n#G . Este evento ocurrió porque el [tv_great_engineer|E] actual tiene una capacidad militar efectiva superior a 50.#!."
 tv_engineering_department.7179.a:0 "Despeja el peor nudo en la línea de suministro."
 tv_engineering_department.7180.t:0 "Construcción: [tv_great_engineer|E] se adapta a la junta crítica"
 tv_engineering_department.7180.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] encaja en la pieza crítica y permite que la siguiente etapa comience antes. El proyecto obtiene una mejora más constante en el progreso de [tv_wonder_construction|E].\n\n#G Este evento ocurrió porque el [tv_great_engineer|E] actual tiene una capacidad militar efectiva superior a 50.#!"
 tv_engineering_department.7180.a:0 "¡A toda velocidad!"
 tv_engineering_department.7181.t:0 "Construcción: [tv_great_engineer|E] corteja a la multitud"
 tv_engineering_department.7181.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] coloca las obras inacabadas ante la multitud y confía en el espectáculo. La decisión puede levantar a [tv_wonder_domestic_support|E] o costarle caro al sitio.\n\n#Y Este evento ocurrió porque el [tv_great_engineer|E] actual tiene una capacidad militar efectiva de entre 20 y 80.#!"
 tv_engineering_department.7181.a:0 "Deja que la multitud juzgue las piedras inacabadas."
 tv_engineering_department.7182.t:0 "Construcción:[tv_great_engineer|E] amplía el plan"
 tv_engineering_department.7182.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] ordena ampliar el plan antes de que se hayan pagado todas las dudas. La decisión puede levantar a [tv_wonder_scale_competence|E] o costarle caro al sitio.\n\n#Y Este evento ocurrió porque el [tv_great_engineer|E] actual tiene una capacidad militar efectiva de entre 20 y 80.#!"
 tv_engineering_department.7182.a:0 "Ordena ampliar el plano antes de resolver las dudas."
 tv_engineering_department.7183.t:0 "Construcción: [tv_great_engineer|E] reescribe el turno"
 tv_engineering_department.7183.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] reescribe los turnos en una sola tarde y desafía al patio a seguir el ritmo. La decisión puede levantar a [tv_wonder_organization_competence|E] o costarle caro al sitio.\n\n#Y Este evento ocurrió porque el [tv_great_engineer|E] actual tiene una capacidad militar efectiva de entre 20 y 80.#!"
 tv_engineering_department.7183.a:0 "Reescribimos los turnos y desafiamos al patio a seguir el ritmo."
 tv_engineering_department.7184.t:0 "Construcción: [tv_great_engineer|E] toma el camino arriesgado"
 tv_engineering_department.7184.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] envía los carros por un camino difícil y confía en el cálculo antes que en la costumbre. La decisión puede levantar a [tv_wonder_logistics_competence|E] o costarle caro al sitio.\n\n#Y Este evento ocurrió porque el [tv_great_engineer|E] actual tiene una capacidad militar efectiva de entre 20 y 80.#!"
 tv_engineering_department.7184.a:0 "Envía los carros por el camino más difícil, confiando en el cálculo antes que en el hábito."
 tv_engineering_department.7185.t:0 "Construcción:[tv_great_engineer|E] prueba un método más rápido"
 tv_engineering_department.7185.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] prueba un método más rápido donde el error sería muy público. La decisión puede mejorar el progreso de [tv_wonder_construction|E] o costarle caro al sitio.\n\n#Y Este evento ocurrió porque el [tv_great_engineer|E] actual tiene una capacidad militar efectiva de entre 20 y 80.#!"
 tv_engineering_department.7185.a:0 "Pruebe el método más rápido: ¡déjelo demostrar en público!"
 tv_engineering_department.7186.t:0 "Construcción: [tv_great_engineer|E] Cuenta mal la moneda"
 tv_engineering_department.7186.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] calcula mal el coste de una reparación y deja que el tesoro cubra la elegancia. Los trabajos continúan, pero [gold|E] sufre por el descuido.\n\n#R Este evento ocurrió porque el actual [tv_great_engineer|E] tiene una capacidad militar efectiva inferior a 50.#!"
 tv_engineering_department.7186.a:0 "Salda silenciosamente el déficit antes de que se cuestione la cuenta."
 tv_engineering_department.7187.t:0 "Construcción：[tv_great_engineer|E] Se olvida de la corte"
 tv_engineering_department.7187.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] olvida que la autoridad real también es material y la gasta sin cuidado. Los trabajos continúan, pero [legitimacy|E] sufre por el descuido.\n\n#R Este evento ocurrió porque el actual [tv_great_engineer|E] tiene una capacidad militar efectiva inferior a 50.#!"
 tv_engineering_department.7187.a:0 "Frenamos el uso descuidado del nombre de la corona."
 tv_engineering_department.7188.t:0 "Construcción: [tv_great_engineer|E] malinterpreta las aldeas"
 tv_engineering_department.7188.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] subestima cuántas perturbaciones puede causar una respuesta de ingeniería ordenada. Los trabajos continúan, pero [stability|E] sufre por el descuido.\n\n#R Este evento ocurrió porque el actual [tv_great_engineer|E] tiene una capacidad militar efectiva inferior a 50.#!"
 tv_engineering_department.7188.a:0 "Suaviza la perturbación que dejó la solución ordenada."
 tv_engineering_department.7189.t:0 "Construcción: [tv_great_engineer|E] habla demasiado pronto"
 tv_engineering_department.7189.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] habla con demasiada confianza antes de que el trabajo pueda respaldar el alarde. Los trabajos continúan, pero [prestige|E] sufre por el descuido.\n\n#R Este evento ocurrió porque el actual [tv_great_engineer|E] tiene una capacidad militar efectiva inferior a 50.#!"
 tv_engineering_department.7189.a:0 "¡Vuelve el alarde!"
 tv_engineering_department.7190.t:0 "Construcción: [tv_great_engineer|E] desprecia a los nobles"
 tv_engineering_department.7190.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] trata la noble paciencia como si fuera otra reserva de suministros. Las obras continúan, pero [estate_satisfaction|E] entre los nobles sufre por el descuido.\n\n#R Este evento ocurrió porque el actual [tv_great_engineer|E] tiene una capacidad militar efectiva inferior a 50.#!"
 tv_engineering_department.7190.a:0 "Le recuerda al ingeniero que la noble paciencia no es una reserva de la que sacar provecho."
 tv_engineering_department.7191.t:0 "Construcción:[tv_great_engineer|E] perturba el calendario"
 tv_engineering_department.7191.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] se desplaza por el calendario religioso como si de una mesa de parto se tratase. Las obras continúan, pero [estate_satisfaction|E] entre el clero sufre por el descuido.\n\n#R Este evento ocurrió porque el actual [tv_great_engineer|E] tiene una capacidad militar efectiva inferior a 50.#!"
 tv_engineering_department.7191.a:0 "Después de todo, dejemos que los altares mantengan su propio calendario."
 tv_engineering_department.7192.t:0 "Construcción: [tv_great_engineer|E] bloquea el mercado"
 tv_engineering_department.7192.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] bloquea el comercio ordinario mientras busca una línea más limpia para el sitio. Las obras continúan, pero [estate_satisfaction|E] entre los burgueses sufre por el descuido.\n\n#R Este evento ocurrió porque el actual [tv_great_engineer|E] tiene una capacidad militar efectiva inferior a 50.#!"
 tv_engineering_department.7192.a:0 "Reabrimos el carril del mercado que el sitio había cerrado."
 tv_engineering_department.7193.t:0 "Construcción: [tv_great_engineer|E] subestima las aldeas"
 tv_engineering_department.7193.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] confunde aldeas agotadas con una reserva no utilizada. Las obras continúan, pero [estate_satisfaction|E] entre los campesinos sufre por el descuido.\n\n#R Este evento ocurrió porque el actual [tv_great_engineer|E] tiene una capacidad militar efectiva inferior a 50.#!"
 tv_engineering_department.7193.a:0 "Dejemos que los pueblos exhaustos descansen en lugar de ser atacados nuevamente."
 tv_engineering_department.7194.t:0 "Construcción: [tv_great_engineer|E] corta las calles equivocadas"
 tv_engineering_department.7194.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] elimina los acuerdos locales incorrectos y considera que la brecha es útil. Las obras continúan, pero [development|E] en el sitio sufre por la supervisión.\n\n#R Este evento ocurrió porque el actual [tv_great_engineer|E] tiene una capacidad militar efectiva inferior a 50.#!"
 tv_engineering_department.7194.a:0 "Parches sobre los arreglos que fueron cortados por error."
 tv_engineering_department.7195.t:0 "Construcción: [tv_great_engineer|E] llena los medios de vida del sitio"
 tv_engineering_department.7195.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] desplaza los medios de vida locales al tiempo que libera espacio para las obras. Las obras continúan, pero [prosperity|E] en el sitio sufre por la supervisión.\n\n#R Este evento ocurrió porque el actual [tv_great_engineer|E] tiene una capacidad militar efectiva inferior a 50.#!"
 tv_engineering_department.7195.a:0 "Volvemos a hacer espacio para los medios de vida que el claro desplazó."
 tv_engineering_department.7196.t:0 "Construcción: [tv_great_engineer|E] hace un mal uso del capital"
 tv_engineering_department.7196.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] hace un mal uso de los recursos de capital como si la ciudad real no tuviera planes propios. Las obras continúan, pero [development|E] en la capital sufre por el descuido.\n\n#R Este evento ocurrió porque el actual [tv_great_engineer|E] tiene una capacidad militar efectiva inferior a 50.#!"
 tv_engineering_department.7196.a:0 "Devuelve los recursos mal utilizados a los propios planes de la capital."
 tv_engineering_department.7197.t:0 "Construcción：[tv_great_engineer|E] perturba la ciudad real"
 tv_engineering_department.7197.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] perturba el comercio de la ciudad real mientras resuelve un problema de ingeniería local. Las obras continúan, pero [prosperity|E] en la capital sufre por el descuido.\n\n#R Este evento ocurrió porque el actual [tv_great_engineer|E] tiene una capacidad militar efectiva inferior a 50.#!"
 tv_engineering_department.7197.a:0 "Calmamos el comercio de la ciudad real antes de que se extienda la perturbación."
 tv_engineering_department.7198.t:0 "Construcción: [tv_great_engineer|E] calcula mal el límite de mano de obra"
 tv_engineering_department.7198.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] calcula mal el límite de cuerpos de trabajo. Los trabajos continúan, pero el trabajador [population|E] en el sitio sufre por la supervisión.\n\n#R Este evento ocurrió porque el actual [tv_great_engineer|E] tiene una capacidad militar efectiva inferior a 50.#!"
 tv_engineering_department.7198.a:0 "¡Alivie la tensión antes de que se agote más!"
 tv_engineering_department.7199.t:0 "Construcción: [tv_great_engineer|E] rompe el libro mayor"
 tv_engineering_department.7199.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] permite que un error evitable atraviese las cuentas y vacíe más monedas de las que el orgullo puede excusar. El error no es suficiente para poner fin a la maravilla, que puede ser la parte más fea de la misma.\n\n#R Este evento ocurrió porque el [tv_great_engineer|E] actual tiene una capacidad militar efectiva inferior a 20.#!"
 tv_engineering_department.7199.a:0 "Anota la pérdida y cierra silenciosamente el libro mayor."
 tv_engineering_department.7200.t:0 "Construcción: [tv_great_engineer|E] hiere la corona"
 tv_engineering_department.7200.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] convierte una falla evitable en el sitio en una herida visible en la corona. El error no es suficiente para poner fin a la maravilla, que puede ser la parte más fea de la misma.\n\n#R Este evento ocurrió porque el [tv_great_engineer|E] actual tiene una capacidad militar efectiva inferior a 20.#!"
 tv_engineering_department.7200.a:0 "Nos ponemos la nueva cicatriz de la corona y seguimos adelante."
 tv_engineering_department.7201.t:0 "Construcción：[tv_great_engineer|E] Desestabiliza al País"
 tv_engineering_department.7201.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] empuja al país al desorden mientras intenta resolver un problema del sitio. El error no es suficiente para poner fin a la maravilla, que puede ser la parte más fea de la misma.\n\n#R Este evento ocurrió porque el [tv_great_engineer|E] actual tiene una capacidad militar efectiva inferior a 20.#!"
 tv_engineering_department.7201.a:0 "Deja que el desorden se consuma por sí solo."
 tv_engineering_department.7202.t:0 "Construcción: [tv_great_engineer|E] es un espectáculo"
 tv_engineering_department.7202.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] convierte el lugar en un espectáculo y arrastra hacia él el honor cortés. El error no es suficiente para poner fin a la maravilla, que puede ser la parte más fea de la misma.\n\n#R Este evento ocurrió porque el [tv_great_engineer|E] actual tiene una capacidad militar efectiva inferior a 20.#!"
 tv_engineering_department.7202.a:0 "¡Que la corte tenga su espectáculo!"
 tv_engineering_department.7203.t:0 "Construcción：[tv_great_engineer|E] enfurece a las casas"
 tv_engineering_department.7203.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] enoja a las casas al resolver un problema de sitio a través de sus privilegios. El error no es suficiente para poner fin a la maravilla, que puede ser la parte más fea de la misma.\n\n#R Este evento ocurrió porque el [tv_great_engineer|E] actual tiene una capacidad militar efectiva inferior a 20.#!"
 tv_engineering_department.7203.a:0 "Gasta la buena voluntad de las casas para mantener el trabajo en marcha."
 tv_engineering_department.7204.t:0 "Construcción：[tv_great_engineer|E] ofende al clero"
 tv_engineering_department.7204.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] ofende al clero al hacer que la paciencia sagrada pague por una piedra secular. El error no es suficiente para poner fin a la maravilla, que puede ser la parte más fea de la misma.\n\n#R Este evento ocurrió porque el [tv_great_engineer|E] actual tiene una capacidad militar efectiva inferior a 20.#!"
 tv_engineering_department.7204.a:0 "Dejamos que la paciencia sagrada pague la factura de la piedra secular."
 tv_engineering_department.7205.t:0 "Construcción:[tv_great_engineer|E] provoca a los burgueses"
 tv_engineering_department.7205.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] provoca a los burgueses al tratar el comercio como un andamio suelto. El error no es suficiente para poner fin a la maravilla, que puede ser la parte más fea de la misma.\n\n#R Este evento ocurrió porque el [tv_great_engineer|E] actual tiene una capacidad militar efectiva inferior a 20.#!"
 tv_engineering_department.7205.a:0 "Deja que los comerciantes arreglen sus propios andamios."
 tv_engineering_department.7206.t:0 "Construcción: [tv_great_engineer|E] rompe las aldeas"
 tv_engineering_department.7206.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] rompe la paciencia del pueblo con una exigencia que debería haberse evitado. El error no es suficiente para poner fin a la maravilla, que puede ser la parte más fea de la misma.\n\n#R Este evento ocurrió porque el [tv_great_engineer|E] actual tiene una capacidad militar efectiva inferior a 20.#!"
 tv_engineering_department.7206.a:0 "Pedimos perdón a los pueblos por una exigencia que podríamos haberles evitado."
 tv_engineering_department.7207.t:0 "Construcción: [tv_great_engineer|E] daña el sitio"
 tv_engineering_department.7207.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] daña el sitio al resolver un problema técnico con destrucción local. El error no es suficiente para poner fin a la maravilla, que puede ser la parte más fea de la misma.\n\n#R Este evento ocurrió porque el [tv_great_engineer|E] actual tiene una capacidad militar efectiva inferior a 20.#!"
 tv_engineering_department.7207.a:0 "Parcha la herida causada por las propias reparaciones."
 tv_engineering_department.7208.t:0 "Construcción: [tv_great_engineer|E] acaba con los mercados del sitio"
 tv_engineering_department.7208.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] acaba con los mercados del sitio mediante una decisión evitable. El error no es suficiente para poner fin a la maravilla, que puede ser la parte más fea de la misma.\n\n#R Este evento ocurrió porque el [tv_great_engineer|E] actual tiene una capacidad militar efectiva inferior a 20.#!"
 tv_engineering_department.7208.a:0 "Que así sea: ¡que se callen los puestos!"
 tv_engineering_department.7209.t:0 "Construcción:[tv_great_engineer|E] ahueca los planes de la capital"
 tv_engineering_department.7209.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] arruina los planes de la capital para cubrir un error en el sitio. El error no es suficiente para poner fin a la maravilla, que puede ser la parte más fea de la misma.\n\n#R Este evento ocurrió porque el [tv_great_engineer|E] actual tiene una capacidad militar efectiva inferior a 20.#!"
 tv_engineering_department.7209.a:0 "Destruye los propios planes de la capital para corregir el error del sitio."
 tv_engineering_department.7210.t:0 "Construcción: [tv_great_engineer|E] empaña la prosperidad de la capital"
 tv_engineering_department.7210.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] empaña la prosperidad del capital a través de un fracaso que nunca debería haber llegado al mercado. El error no es suficiente para poner fin a la maravilla, que puede ser la parte más fea de la misma.\n\n#R Este evento ocurrió porque el [tv_great_engineer|E] actual tiene una capacidad militar efectiva inferior a 20.#!"
 tv_engineering_department.7210.a:0 "Vemos cómo el brillo de la capital se apaga ante un fracaso que nunca debería haber visto."
 tv_engineering_department.7211.t:0 "Construcción: [tv_great_engineer|E] causa víctimas"
 tv_engineering_department.7211.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] causa víctimas al dejar pasar una falla evitable entre las tripulaciones. El error no es suficiente para poner fin a la maravilla, que puede ser la parte más fea de la misma.\n\n#R Este evento ocurrió porque el [tv_great_engineer|E] actual tiene una capacidad militar efectiva inferior a 20.#!"
 tv_engineering_department.7211.a:0 "Cuenta los muertos que las tripulaciones nunca debieron haber perdido."
