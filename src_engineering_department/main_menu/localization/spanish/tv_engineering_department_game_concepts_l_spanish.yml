 # ── Engineering Department / Wonder Construction ──────────────────────────
 game_concept_tv_engineering_department: "Departamento de Ingeniería"
 game_concept_tv_engineering_department_desc: "Una organización internacional no única establecida automáticamente para cada país durante la inicialización de la campaña. Mantiene la oficina [tv_great_engineer|e] y gestiona todas las etapas de un [tv_wonder_construction|e]: [tv_wonder_concept|e], sitio [tv_wonder_survey|e], organización, logística y [tv_wonder_ceremony|e] final."
 game_concept_tv_engineering_department_europedia_desc: "Establecida automáticamente para cada país al inicio de la campaña, o la primera vez que se agrega el Departamento de Ingeniería a una partida guardada existente, esta es la institución permanente detrás de cada [tv_wonder_construction|e] que intenta un país. Su único oficial, el [tv_great_engineer|e], conduce personalmente el oleoducto: su habilidad administrativa avanza [tv_wonder_concept|e], su habilidad militar avanza [tv_wonder_survey|e] y su mandato determina quién es recordado en el [tv_wonder_ceremony|e] final. Un proyecto que ya está en marcha no se reinicia al perder o reemplazar al Gran Ingeniero, pero un cargo vacante detiene el progreso de Concepción y Estudio hasta que se nombre un sucesor."

 game_concept_tv_great_engineer: "Gran ingeniero"
 game_concept_tv_great_engineer_desc: "El personaje designado que lidera el [tv_engineering_department|e]. El [tv_great_engineer|e] se almacena como una variable de país y se puede designar, reemplazar o descartar desde el panel [tv_engineering_department|e]."

 game_concept_tv_wonder_concept: "Concepción"
 game_concept_tv_wonder_concept_desc: "La etapa de propuesta que abre un nuevo [tv_wonder_construction|e]. Cada mes, la habilidad administrativa del [tv_great_engineer|e] avanza en el progreso de Concepción; una vez que se complete, el [tv_great_engineer|e] presenta un proyecto factible [tv_wonder_small|e], [tv_wonder_medium|e] o [tv_wonder_large|e] para que el país lo lleve a cabo."
 game_concept_tv_wonder_concept_europedia_desc: "La concepción comienza en el momento en que se nombra un [tv_great_engineer|e]: un medidor de progreso oculto comienza en 0 y aumenta un poco cada mes, impulsado por la habilidad administrativa del oficial. Un administrador débil puede tardar años en completar Concepción, mientras que un país que pasa por varios administradores capaces sucesivamente lleva adelante el progreso acumulado independientemente de quién ocupe actualmente el cargo. Al finalizar, el ingeniero no deja que el país elija libremente: propone una empresa factible [tv_wonder_small|e], [tv_wonder_medium|e] o [tv_wonder_large|e], determinada por lo que el país puede apoyar actualmente, para que el país la lleve a cabo."

 game_concept_tv_wonder_survey: "Encuesta"
 game_concept_tv_wonder_survey_desc: "La etapa de evaluación del sitio de [tv_wonder_construction|e]. El progreso de la encuesta aumenta mensualmente a partir de la habilidad militar del [tv_great_engineer|e], revela [tv_wonder_scale_competence|e], [tv_wonder_logistics_competence|e] y [tv_wonder_organization_competence|e], y permite al país confirmar un sitio de construcción una vez que se completan las lecturas."
 game_concept_tv_wonder_survey_europedia_desc: "Una vez resuelto el debate, los topógrafos evalúan tres cualidades ocultas del sitio elegido: [tv_wonder_scale_competence|e], [tv_wonder_organization_competence|e] y [tv_wonder_logistics_competence|e], cada una de las cuales combina la idoneidad natural del sitio con la habilidad administrativa del [tv_great_engineer|e]. Las tres lecturas aumentan juntas a medida que se acumula el progreso del estudio gracias a la habilidad militar del ingeniero, y ninguna de ellas puede mejorarse nuevamente una vez que la construcción ha comenzado, por lo que un país que sopesa un sitio marginal con una espera más larga por uno mejor está haciendo una verdadera compensación."

 game_concept_tv_wonder_debate: "debate"
 game_concept_tv_wonder_debate_desc: "La etapa de debate interno de [tv_wonder_construction|e]. Satisfacer las demandas patrimoniales y los eventos de debate construye [tv_wonder_domestic_support|e]; una vez que llegue a 100, el país puede declarar concluido el debate y pasar a [tv_wonder_survey|e]."
 game_concept_tv_wonder_debate_europedia_desc: "Antes de iniciar cualquier terreno, el proyecto propuesto debe sobrevivir a un debate interno. La nobleza, los burgueses y el clero plantean demandas cuya satisfacción otorga [tv_wonder_domestic_support|e], y los eventos de debate otorgan más. El soporte se presenta en una escala de 0 a 200, pero solo se necesitan los primeros 100 puntos para cerrar el debate y pasar a [tv_wonder_survey|e]. El apoyo no se sigue acumulando para siempre: una vez que termina el debate, decae un poco cada mes, por lo que un país que ya puede cerrar el debate gana poco si lo deja abierto, y un proyecto que deja que el apoyo decaiga hasta cero antes de ganarse la ceremonia corre el riesgo de colapsar por completo."

 game_concept_tv_wonder_materials: "Materiales de construcción"
 game_concept_tv_wonder_materials_desc: "Un bien de mercado producido utilizado para mantener $tv_wonder_labor_camp$ durante un [tv_wonder_construction|e] activo. Cada $tv_wonder_material_dispatch_point$ convierte bienes de construcción básicos en [tv_wonder_materials|e], por lo que el suministro y el precio se manejan a través del mercado normal."
 game_concept_tv_wonder_materials_europedia_desc: "Los Wonder Materials no se almacenan de antemano: cada $tv_wonder_material_dispatch_point$ los refina según demanda a partir de bienes de construcción ordinarios que ya se mueven en el mercado, y el edificio $tv_wonder_labor_camp$ que realmente trabaja en el sitio los consume a medida que se construye. Debido a que ambos extremos de la cadena se encuentran en el mercado normal, un Gran Proyecto compite con el resto de la economía del país por los mismos bienes básicos, y una escasez se manifiesta como una construcción más lenta en lugar de una parada brusca."

 game_concept_tv_wonder_ceremony: "Ceremonia"
 game_concept_tv_wonder_ceremony_desc: "La dedicación final de un proyecto [tv_wonder_construction|e] completado. La rama de ceremonia elegida determina la construcción final del monumento, el modificador permanente del país y el último estallido de prestigio, estabilidad y legitimidad del [tv_wonder_domestic_support|e] restante."
 game_concept_tv_wonder_ceremony_europedia_desc: "La forma en que se cierra un Gran Proyecto depende del tipo de maravilla que sea. La inauguración de un proyecto [tv_wonder_generic|e] permite al país elegir entre tres estilos de ceremonia: una carga de un año que termina en una bendición permanente, un edificio anexo auxiliar que aumenta el poder inmobiliario local o una decoración única pagada con arte, oro y prestigio. En cambio, la mayoría de las maravillas [tv_wonder_unique|e] avanzan automáticamente a través de una ceremonia compartida de ocho etapas una vez que se completa la construcción, alcanzando aproximadamente una nueva etapa por trimestre y culminando con un modificador de país permanente. Un puñado de sitios históricamente distintivos, entre ellos el faro de Pharos y Hagia Sophia, pasan por alto ese marco compartido por completo para dedicarse a su propio ritual escrito a mano."

 game_concept_tv_wonder_construction: "Gran proyecto"
 game_concept_tv_wonder_construction_desc: "Un mecanismo de Gran Proyecto gestionado a través del [tv_engineering_department|e]. Una vez que el [tv_great_engineer|e] del [tv_wonder_concept|e] produce un proyecto factible [tv_wonder_small|e], [tv_wonder_medium|e] o [tv_wonder_large|e] y el país resuelve el debate interno, completa un [tv_wonder_survey|e], organiza el trabajo, reúne el [tv_wonder_materials|e] y avanza cuatro [tv_wonder_construction_part|e]. para llevar el proyecto a su nivel final."
 game_concept_tv_wonder_construction_europedia_desc: "Un Gran Proyecto es el hilo conductor a nivel nacional que lleva una maravilla desde la idea hasta el monumento. Un [tv_great_engineer|e] primero completa [tv_wonder_concept|e] para proponer una empresa [tv_wonder_small|e], [tv_wonder_medium|e] o [tv_wonder_large|e] factible; luego el país resuelve [tv_wonder_debate|e] interno; un [tv_wonder_survey|e] confirma que el sitio elegido puede soportarlo; y sólo entonces comienza la construcción propiamente dicha, con cuatro [tv_wonder_construction_part|e] subiendo juntos sobre [tv_wonder_materials|e] y mano de obra organizada hasta que todo el proyecto alcanza su nivel final y se cierra con un [tv_wonder_ceremony|e]. Un proyecto [tv_wonder_generic|e] terminado se puede continuar posteriormente a través de [tv_wonder_expansion|e] sin repetir ninguna de las etapas anteriores."

 game_concept_tv_wonder_expansion: "Expansión"
 game_concept_tv_wonder_expansion_desc: "Continuación a mayor escala de un [tv_wonder_construction|e] ya inaugurado en el mismo sitio. Una expansión reutiliza el estilo [tv_wonder_ceremony|e] elegido en la inauguración anterior de esa maravilla, no pierde ninguna recompensa por completarla ya obtenida y continúa aprovechando la competencia [tv_wonder_survey|e] preservada en el sitio."

 game_concept_tv_wonder_construction_part: "Parte de construcción"
 game_concept_tv_wonder_construction_part_desc: "Una de las cuatro pistas paralelas (Cimentación, Estructura principal, Función y Coronación) que avanza un [tv_wonder_construction|e] a la vez. El nivel del proyecto lo establece cuál de las cuatro partes está más rezagada, por lo que el progreso debe distribuirse de manera uniforme en lugar de apresurarse por una sola vía."
 game_concept_tv_wonder_construction_part_europedia_desc: "Cada Gran Proyecto son en realidad cuatro edificios que se levantan en paralelo (Cimentación, Estructura Principal, Función y Coronación), cada uno de los cuales avanza de forma independiente con su propia mano de obra y materiales. El nivel general del proyecto no es un promedio de los cuatro; se limita a la parte que se haya quedado más atrás. Destinar todos los recursos a una pista principal y descuidar las demás solo detiene todo el monumento al nivel de su parte más débil, por lo que el progreso equilibrado en las cuatro es mejor que una carrera para terminar cualquiera de ellas primero."

 game_concept_tv_wonder_small: "Pequeño proyecto"
 game_concept_tv_wonder_small_desc: "Una clase de tamaño [tv_wonder_construction|e]. Los proyectos pequeños se pueden construir más de una vez. Su efecto de país base se limita al movimiento de valores, mientras que los efectos locales y los efectos de ceremonia no tienen restricciones. \n Cada nivel de un proyecto pequeño normalmente cuesta alrededor de #Y 10,000@gold!#!."

 game_concept_tv_wonder_medium: "Proyecto mediano"
 game_concept_tv_wonder_medium_desc: "Una clase de tamaño [tv_wonder_construction|e] entre proyectos pequeños y grandes. Un país no puede iniciar un segundo proyecto mediano del mismo tipo, pero sus efectos de país base, efectos locales y efectos de ceremonia no tienen restricciones. \n Cada nivel de un proyecto mediano generalmente cuesta alrededor de #Y 20,000@gold!#!."

 game_concept_tv_wonder_large: "Proyecto grande"
 game_concept_tv_wonder_large_desc: "Una clase de tamaño [tv_wonder_construction|e]. Es posible que un país no inicie un segundo gran proyecto del mismo tipo, pero sus efectos de país base, efectos locales y efectos de ceremonia no tienen restricciones. \n Cada nivel de un proyecto grande normalmente cuesta alrededor de #Y 30,000@gold!#!."

 game_concept_tv_wonder_generic: "Maravilla genérica"
 game_concept_tv_wonder_generic_desc: "Un [tv_wonder_construction|e] propuesto por el [tv_great_engineer|e] y ubicado libremente en la escala [tv_wonder_small|e], [tv_wonder_medium|e] o [tv_wonder_large|e], a diferencia de un [tv_wonder_unique|e] fijo en el mapa. Su inauguración te permite elegir un estilo [tv_wonder_ceremony|e]."
 game_concept_tv_wonder_generic_europedia_desc: "Una maravilla genérica no está ligada a ninguna ubicación fija: el propio país elige dónde construir una vez que [tv_wonder_survey|e] confirma un sitio adecuado, en cualquiera de las clases [tv_wonder_small|e], [tv_wonder_medium|e] o [tv_wonder_large|e] que propuso [tv_great_engineer|e]. Los pequeños proyectos genéricos pueden incluso reconstruirse más de una vez en un nuevo sitio, dando a un país acceso repetible a las recompensas de la ceremonia de ese arquetipo, a diferencia de un [tv_wonder_unique|e], que existe exactamente una vez, en un lugar, durante todo el juego."

 game_concept_tv_wonder_unique: "Maravilla única"
 game_concept_tv_wonder_unique_desc: "Un [tv_wonder_construction|e] histórico fijado en una ubicación específica del mapa, a diferencia de un [tv_wonder_generic|e] ubicado libremente. La mayoría de las maravillas únicas avanzan automáticamente a través de un [tv_wonder_ceremony|e] de 8 etapas una vez que se completa la construcción; algunos tienen su propia ceremonia manual dedicada."
 game_concept_tv_wonder_unique_europedia_desc: "Una maravilla única está vinculada a una única ubicación del mundo real desde el comienzo de la campaña, y solo el país que realmente controla esa ubicación puede construirla; no hay opción de ubicación libre como ocurre con un [tv_wonder_generic|e]. A cambio de esa fijeza histórica, 134 de las 136 maravillas únicas del mod comparten un [tv_wonder_ceremony|e] uniforme y automático de ocho etapas una vez terminado, y no necesitan más participación del jugador para alcanzar su recompensa permanente. El faro de Pharos y Hagia Sophia son las únicas excepciones, cada uno de los cuales lleva a cabo su propio ritual personalizado de varios pasos."

 game_concept_tv_wonder_domestic_support: "Apoyo interno"
 game_concept_tv_wonder_domestic_support_desc: "Un recurso [tv_wonder_construction|e] que representa la voluntad pública y de élite de sostener un Gran Proyecto importante. Llega a 100 para finalizar el debate inicial; El soporte se puede almacenar hasta 200 y decae una vez finalizado el debate."

 game_concept_tv_wonder_scale_competence: "Competencia de escala"
 game_concept_tv_wonder_scale_competence_desc: "Una lectura [tv_wonder_survey|e] sobre qué tan bien el sitio elegido puede cumplir con el tamaño, los ejes, los cimientos y el enfoque público previstos para el proyecto sin forzar el diseño a adoptar una forma incómoda. Establece el nivel máximo de Gran Proyecto en 20%, 40%, 60%, 80% y 100%, y el nivel 6 requiere 100%."

 game_concept_tv_wonder_organization_competence: "Competencia de la organización"
 game_concept_tv_wonder_organization_competence_desc: "Una lectura [tv_wonder_survey|e] sobre cómo se pueden crear listas de mano de obra, capataces, talleres y etapas de construcción de manera limpia para responder a un plan en lugar de muchos pedidos en competencia. Establece linealmente el nivel máximo del sitio de trabajo del Gran Proyecto de 0 a 20."

 game_concept_tv_wonder_logistics_competence: "Competencia logística"
 game_concept_tv_wonder_logistics_competence_desc: "Una lectura [tv_wonder_survey|e] para carreteras, carros, puertos, puentes y puntos de traspaso que determina si [tv_wonder_materials|e] llega al sitio cuando los albañiles los necesitan."

