 TV_ENGINEERING_DEBATE_HELP_TEXT_2: "Una vez que [tv_wonder_domestic_support|e] llegue a #Y 100#!, podrá declarar concluido el debate y pasar a [tv_wonder_survey|e]."
 TV_ENGINEERING_DEBATE_HELP_TEXT_3: "El apoyo puede seguir acumulándose hasta #Y 200#! incluso después de que finalice el debate, mantenido en reserva para las siguientes etapas."
 TV_ENGINEERING_DEBATE_HELP_TEXT_4: "Una vez que concluye el debate, el apoyo a las reservas decae con el tiempo."
 TV_ENGINEERING_END_DEBATE_BUTTON: "@trigger_yes! Anuncian el fin del debate"
 TV_ENGINEERING_ABANDON_WONDER_BUTTON: "@trigger_no! Abandonar [tv_wonder_construction|E]"
 TV_ENGINEERING_SURVEY_CARD_TITLE: "[tv_wonder_survey|E]"
 TV_ENGINEERING_SURVEY_HELP_TEXT_1: "Elija una de sus propias ubicaciones para iniciar [tv_wonder_survey|e] para el [tv_wonder_construction|e] bloqueado."
 TV_ENGINEERING_SURVEY_HELP_TEXT_2: "El progreso de la encuesta avanza mensualmente desde la habilidad militar del [tv_great_engineer|e]."
 TV_ENGINEERING_SURVEY_HELP_TEXT_3: "Completar la encuesta revela los datos [tv_wonder_scale_competence|e], [tv_wonder_logistics_competence|e] y [tv_wonder_organization_competence|e] de esa ubicación."
 TV_ENGINEERING_SURVEY_HELP_TEXT_4: "Confirmar el sitio bloquea esos valores de competencia y desbloquea Organización, Logística y Construcción."
 TV_ENGINEERING_SURVEY_HELP_TEXT_5: "Algunos [tv_wonder_unique|e] que ya existen al inicio del juego no necesitan un [tv_wonder_survey|e]."
 TV_ENGINEERING_SURVEY_LOCKED_TEXT: "Debe completar Concepción y Debate antes de poder comenzar [tv_wonder_survey|e]."
