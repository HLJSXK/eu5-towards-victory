 TV_ENGINEERING_CONSTRUCTION_PROGRESS_TT: "Cada unidad [tv_wonder_construction_part|e] utiliza el progreso [tv_wonder_construction|e] del [tv_engineering_department|e]. Los requisitos del módulo se configuran a través del menú Community Mod; Los requisitos predeterminados Pequeño, Mediano y Grande son 100 000, 200 000 y 300 000 de progreso."
 TV_ENGINEERING_CONSTRUCTION_NO_ACTIVE_SITE_TEXT: "Ningún sitio de trabajo activo."
 TV_ENGINEERING_CONSTRUCTION_REMAINING_TEXT: "A la velocidad actual, se espera que esta maravillosa unidad necesite [Country.MakeScope.GetVariable('tv_wonder_remaining_years').GetValue|0] años y [Country.MakeScope.GetVariable('tv_wonder_remaining_months_mod').GetValue|0] meses."
 TV_ENGINEERING_CONSTRUCTION_PERCENT_TEXT: "[Country.MakeScope.GetVariable('tv_wonder_construction_progress_pct').GetValue|0]%/100%"
 TV_ENGINEERING_CONSTRUCTION_UNIT_COMPLETE_TT: "Esta unidad de construcción está completa."
 TV_ENGINEERING_CONSTRUCTION_UNIT_ACTIVE_TT: "Esta unidad de construcción se encuentra actualmente en construcción."
 TV_ENGINEERING_CONSTRUCTION_UNIT_PENDING_TT: "Esta unidad de construcción aún no está completa."
 TV_ENGINEERING_CONSTRUCTION_INFO_TEXT: "El nivel del Gran Proyecto equivale al recuento de unidades completadas más bajo entre sus cuatro [tv_wonder_construction_part|e]. Completar una unidad otorga [tv_wonder_domestic_support|e]; aumentar el nivel total otorga otra bonificación de apoyo."
 TV_ENGINEERING_FINISH_CONSTRUCTION_BUTTON: "@trigger_yes! Declarar completo el gran proyecto"
 TV_ENGINEERING_CONSTRUCTION_HELP_TEXT_1: "$BULLET$ [tv_wonder_construction|e] avanza cuatro [tv_wonder_construction_part|e] a la vez: Cimentación, Estructura principal, Función y Coronación. Utilice los botones de arriba para cambiar la pieza actualmente en construcción."
 TV_ENGINEERING_CONSTRUCTION_HELP_TEXT_2: "$BULLET$ El nivel del [tv_wonder_construction|e] depende de la parte que esté más atrás; el nivel total sólo aumenta una vez que la parte rezagada completa una nueva unidad."
 TV_ENGINEERING_CONSTRUCTION_HELP_TEXT_3: "$BULLET$ Puede declarar el [tv_wonder_construction|e] completo una vez que haya finalizado al menos un nivel."
 TV_ENGINEERING_CONSTRUCTION_HELP_TEXT_4: "$BULLET$ Por lo tanto, puede completar primero un proyecto de menor escala y luego continuar con un [tv_wonder_expansion|e] a mayor escala sin perder ninguna recompensa de finalización ya obtenida."
 TV_ENGINEERING_CONSTRUCTION_HELP_TEXT_5: "$BULLET$ Completar cualquier unidad de construcción otorga [tv_wonder_domestic_support|e]; si esa unidad también aumenta el nivel total del Gran Proyecto, otorga otra bonificación [tv_wonder_domestic_support|e]."
 TV_ENGINEERING_CONSTRUCTION_HELP_TT: "#T Construction#!\n[tv_wonder_construction|e] avanza cuatro [tv_wonder_construction_part|e] a la vez: Cimentación, Estructura principal, Función y Coronación. Utilice los botones de arriba para cambiar la pieza actualmente en construcción.\nEl nivel del [tv_wonder_construction|e] depende de la pieza que esté más atrás; el nivel total solo aumenta una vez que la parte rezagada completa una nueva unidad.\nPuede declarar el [tv_wonder_construction|e] completo una vez que haya terminado al menos un nivel.\nPor lo tanto, puede completar un proyecto de menor escala primero y expandirlo a una escala mayor más tarde sin perder ninguna recompensa de finalización ya obtenida.\nCompletar cualquier unidad de construcción otorga [tv_wonder_domestic_support|e]; si esa unidad también aumenta el nivel total del Gran Proyecto, otorga otra bonificación [tv_wonder_domestic_support|e]."
