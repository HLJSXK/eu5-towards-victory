 tv_engineering_department.551.t: "[tv_wonder_ceremony|E]：Los eruditos se reúnen"
 tv_engineering_department.551.d: "La Ciudad Universitaria baja la voz al estudio. Maestros, estudiantes, copistas y funcionarios se reúnen en torno a listas de conferencias y lecturas en disputa, convirtiendo las calles terminadas en una convocatoria de un año de duración. El [tv_wonder_ceremony|e] no tendrá prisa. Pide al reino que cambie la velocidad administrativa por un plan de estudios que pueda durar más que el tribunal actual."
 tv_engineering_department.551.a: "Dejemos que los eruditos tomen su año."
 tv_engineering_department.552.t: "[tv_wonder_ceremony|E]：Comienza el Salón Colegiado"
 tv_engineering_department.552.d: "Los planos para el Collegiate Hall están sellados al lado de la Ciudad Universitaria. La nueva sala brindará a los maestros un lugar para discutir formalmente, a los estudiantes un lugar para volverse menos seguros en aspectos útiles y, a la corona, una estructura a través de la cual se puede reconocer el aprendizaje sin ser totalmente domesticado. El [tv_wonder_ceremony|e] ahora espera en puertas, bancos, estatutos y un techo bajo el cual el estudio puede reclamar permanencia."
 tv_engineering_department.552.a: "Construye una casa para discutir."
 tv_engineering_department.561.t: "[tv_wonder_ceremony|E]：La Cúpula Está Velada"
 tv_engineering_department.561.d: "La gran cúpula está velada para la consagración. Los sacerdotes marcan umbrales, los cantantes ensayan el mesurado orden de reverencia y la corte acepta un año en el que la legitimidad debe avanzar más lentamente para que la santidad pueda avanzar con cuidado. El [tv_wonder_ceremony|e] le pide al reino que espere bajo un cielo cubierto hasta que el templo esté listo para abrir sus cielos."
 tv_engineering_department.561.a: "Que la cúpula sea santificada."
 tv_engineering_department.571.t: "[tv_wonder_ceremony|E]：Se abre la Escalera del Peregrino"
 tv_engineering_department.571.d: "La escalera del templo de la torre se entrega a los peregrinos para un año de ascenso, pausa, canto y dolor de pies. Los talleres se quejan cuando el trabajo se inclina hacia las procesiones, pero el [tv_wonder_ceremony|e] está destinado a enseñar altura a través del esfuerzo. Cada paso convierte la torre de un objeto en una ruta, y cada ruta hace visible la devoción."
 tv_engineering_department.571.a: "Déjalos subir."
 tv_engineering_department.572.t: "[tv_wonder_ceremony|E]：Comienza la Escuela del Templo"
 tv_engineering_department.572.d: "Maestros, empleados y constructores marcan los cimientos de una escuela del templo debajo de la torre. El [tv_wonder_ceremony|e] ahora espera en las aulas donde la doctrina puede convertirse en hábito, alfabetización y argumentos disciplinados por rituales. Una torre puede atraer la atención hacia arriba; una escuela enseñará a las voces qué decir cuando miran."
 tv_engineering_department.572.a: "Construir la escuela."
 tv_engineering_department.581.t: "[tv_wonder_ceremony|E]：Comienza la Feria del Río"
 tv_engineering_department.581.d: "Puestos, barcazas, mesas de peaje y carteles de festivales se reúnen a lo largo del río ensanchado. El comercio se desacelera a medida que se pide al río que se convierta en espectáculo antes de volver a ser arteria. El [tv_wonder_ceremony|e] pasará un año haciendo que comerciantes, barqueros y funcionarios realicen juntos el nuevo orden del agua."
 tv_engineering_department.581.a: "Deja que el río conozca su nueva multitud."
 tv_engineering_department.582.t: "[tv_wonder_ceremony|E]：Comienza la Oficina del Canal"
 tv_engineering_department.582.d: "Los topógrafos marcan una oficina permanente para la autoridad del canal. El edificio no será lo suficientemente grandioso como para rivalizar con las obras fluviales, que es precisamente lo que importa: las esclusas, las disputas, los peajes, las reparaciones y las quejas de la estación seca necesitan un lugar donde la responsabilidad no pueda esconderse. El [tv_wonder_ceremony|e] ahora espera a que la administración adquiera paredes."
 tv_engineering_department.582.a: "Dale un escritorio al río."
 tv_engineering_department.591.t: "[tv_wonder_ceremony|E]：Comienza la Oficina del Almirantazgo"
 tv_engineering_department.591.d: "El astillero reserva terreno para una oficina del Almirantazgo. Las vías de lanzamiento y las grúas pueden construir barcos, pero las flotas también requieren órdenes, mapas, inspecciones y funcionarios con paciencia para hacer que la madera se convierta en política. El [tv_wonder_ceremony|e] ahora espera que el astillero adquiera una mentalidad naval."
 tv_engineering_department.591.a: "Construye la oficina."
 tv_engineering_department.601.t: "[tv_wonder_ceremony|E]：Bastiones bajo prueba"
 tv_engineering_department.601.d: "La Star Fortress City comienza un año de pruebas. Los ingenieros prueban ángulos, los artilleros prueban campos de tiro y los trabajadores descubren que un muro diseñado para las matemáticas aún debe pagarse con músculos. La producción se ralentiza a medida que el [tv_wonder_ceremony|e] le enseña a la fortaleza a responder la teoría con piedra."
 tv_engineering_department.601.a: "Pruebe todos los ángulos."
 tv_engineering_department.602.t: "[tv_wonder_ceremony|E]：Comienza el cuarto del Arsenal"
 tv_engineering_department.602.d: "Los cimientos están marcados para un barrio de arsenal dentro de la ciudad fortaleza. Unirá los talleres de reparación, los depósitos de pólvora y los patios de reunión en un distrito disciplinado. El [tv_wonder_ceremony|e] ahora espera en la parte de la fortaleza que hace que la defensa sea repetible después de que se apaga la primera alarma."
 tv_engineering_department.602.a: "Construye el barrio del arsenal."
 tv_engineering_department.611.t: "[tv_wonder_ceremony|E]：Las señales de fuego están encendidas"
 tv_engineering_department.611.d: "Los puestos de vigilancia a lo largo de la pared comienzan un año de práctica de señales. El humo, las llamas, los pasajeros y los mercados locales se adaptan al nuevo ritmo, y el comercio sufre mientras cada ruta aprende a notar las advertencias primero. El [tv_wonder_ceremony|e] hace que la vigilancia sea lo suficientemente pública como para que incluso los viajes de rutina parezcan observados."
 tv_engineering_department.611.a: "Mantenga el reloj brillante."
 tv_engineering_department.621.t: "[tv_wonder_ceremony|E]：Comienza el Salón de los Maestros Armeros"
 tv_engineering_department.621.d: "La armería marca los cimientos de una sala de maestros armeros. Los mayores almacenes de armas no pueden depender sólo del hierro y los libros de contabilidad; necesitan manos expertas capaces de juzgar los fracasos antes de que lo haga la batalla. El [tv_wonder_ceremony|e] ahora espera que la nave adquiera una cancha permanente."
 tv_engineering_department.621.a: "Construye para los maestros."
 tv_engineering_department.631.t: "[tv_wonder_ceremony|E]：Comienza el catálogo nacional"
 tv_engineering_department.631.d: "La Biblioteca de la Nación inicia su catálogo. Los académicos cierran puertas, desenrollan inventarios y ralentizan la maquinaria legislativa del país mientras enseñan a la memoria a encontrarse a sí misma nuevamente. El [tv_wonder_ceremony|e] no es un desfile sino un índice: silencioso, exigente y potente una vez completado."
 tv_engineering_department.631.a: "Deja que el catálogo crezca."
 tv_engineering_department.632.t: "[tv_wonder_ceremony|E]：Inicia la Oficina de Depósito Legal"
 tv_engineering_department.632.d: "Los constructores marcan la oficina de depósito legal al lado de la biblioteca. De aquí se recogerán libros, decretos, ejemplares y argumentos no como favores sino como obligaciones. El [tv_wonder_ceremony|e] ahora espera la sala donde la memoria escrita del reino se detendrá dependiendo de un accidente."
 tv_engineering_department.632.a: "Construir la oficina de la memoria."

