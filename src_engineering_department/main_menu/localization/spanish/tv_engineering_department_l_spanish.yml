 TV_ENGINEERING_ORGANIZATION_SECTION_TITLE: "@organization! Organización"
 TV_ENGINEERING_LOGISTICS_SECTION_TITLE: "@supply! Logística"
 TV_ENGINEERING_ORG_LOG_HELP_ORGANIZATION_TEXT_1: "La velocidad del [tv_wonder_construction|e] depende del número de [ShowBuildingTypeName('tv_wonder_labor_camp')] efectivos."
 TV_ENGINEERING_ORG_LOG_HELP_ORGANIZATION_TEXT_2: "Cada [ShowBuildingTypeName('tv_wonder_labor_camp')] operativo proporciona #P 1000#! progreso mensual [tv_wonder_construction|e]."
 TV_ENGINEERING_ORG_LOG_HELP_ORGANIZATION_TEXT_3: "El progreso de construcción mensual se ve modificado aún más por el [tv_wonder_logistics_competence|e] de la ubicación."
 TV_ENGINEERING_ORG_LOG_HELP_ORGANIZATION_TEXT_4: "Cada [ShowBuildingTypeName('tv_wonder_labor_camp')] en funcionamiento cuesta alrededor de #N 25#!@gold! en mantenimiento mensual."
 TV_ENGINEERING_ORG_LOG_HELP_ORGANIZATION_TEXT_5: "El límite [ShowBuildingTypeName('tv_wonder_labor_camp')] depende del [tv_wonder_organization_competence|e] de la ubicación."
 TV_ENGINEERING_ORG_LOG_HELP_LOGISTICS_TEXT_1: "[ShowBuildingTypeName('tv_wonder_material_dispatch_point')] convierte los materiales base en [ShowGoodsName('tv_wonder_materials')]."
 TV_ENGINEERING_ORG_LOG_HELP_LOGISTICS_TEXT_2: "La escasez de [ShowGoodsName('tv_wonder_materials')] aumenta el mantenimiento de [ShowBuildingTypeName('tv_wonder_labor_camp')]; una escasez grave reduce el rendimiento."
 TV_ENGINEERING_ORG_LOG_HELP_LOGISTICS_TEXT_3: "Los países con IA pueden construir [ShowBuildingTypeName('tv_wonder_material_dispatch_point')], por lo que las importaciones son viables."
 TV_ENGINEERING_WORKSITE_PROGRESS_TT: "Niveles efectivos de [ShowBuildingTypeName('tv_wonder_labor_camp')]/límite de sitio de [tv_wonder_organization_competence|e]."
 TV_ENGINEERING_MATERIAL_WORKSHOP_PROGRESS_TT: "Niveles efectivos de [ShowBuildingTypeName('tv_wonder_material_dispatch_point')] / Demanda [ShowGoodsName('tv_wonder_materials')] de los sitios de trabajo activos."
