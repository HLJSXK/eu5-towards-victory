 TV_ENGINEERING_CEREMONY_GENERIC_SECTION_TITLE: "@construction! Maravillas genéricas"
 TV_ENGINEERING_CEREMONY_HELP_GENERIC_TEXT_1: "Después de la construcción, elija un estilo [tv_wonder_ceremony|e] y cumpla con sus requisitos para definir el efecto final de la maravilla."
 TV_ENGINEERING_CEREMONY_UNIQUE_SECTION_TITLE: "@construction! Maravillas Únicas"
 TV_ENGINEERING_CEREMONY_HELP_UNIQUE_TEXT_1: "La mayoría de los [tv_wonder_unique|e] comienzan su [tv_wonder_ceremony|e] automáticamente una vez que se completa la construcción, sin ningún estilo que elegir manualmente."
 TV_ENGINEERING_CEREMONY_HELP_UNIQUE_TEXT_2: "El [tv_wonder_ceremony|e] pasa por 8 etapas y avanza automáticamente una etapa cada pocos meses; cada etapa tiene su propio costo y sabor."
 TV_ENGINEERING_CEREMONY_CHOOSE_STYLE_PROMPT: "Elija una de las siguientes ceremonias:"
 TV_ENGINEERING_CEREMONY_LOCKED_BY_EXPANSION_TEXT: "@lock! Este es un [tv_wonder_expansion|e] de una maravilla existente, por lo que su [tv_wonder_ceremony|e] sigue siendo la ceremonia que ya se utiliza allí."
