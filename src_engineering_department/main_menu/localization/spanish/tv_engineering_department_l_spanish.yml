 TV_ENGINEERING_CEREMONY_PROTOCOL_READY: "El rito seleccionado se organiza y ahora se puede iniciar. Pase el cursor sobre el botón de ceremonia para ver el costo, el desencadenante y la recompensa exactos programados para esta rama."
 TV_ENGINEERING_CEREMONY_PROTOCOL_ONGOING: "Este rito ya está en marcha. Su finalización ahora depende del temporizador programado de la sucursal seleccionada, del edificio auxiliar o de la condición de finalización impulsada por el oyente."
 TV_ENGINEERING_CEREMONY_PROTOCOL_LOCKED: "Este Gran Proyecto está utilizando una rama de ceremonia cerrada. Revisar el rito seleccionado y el expediente del Gran Proyecto para el camino preservado."
