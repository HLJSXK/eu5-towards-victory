 TV_WONDER_FINAL_LEVEL_REWARD_TT: "Debido a que completamos un Gran Proyecto de nivel [ROOT.GetVariable('tv_wonder_level').GetValue|0], ganamos:"
 TV_WONDER_FINAL_SUPPORT_REWARD_TT: "Como nos queda la ayuda interna [ROOT.GetVariable('tv_wonder_final_support_reward_source').GetValue|0], obtenemos:"
 tv_engineering_department.10.t: "[tv_great_engineer|E]：Ha muerto un gran ingeniero"
 tv_engineering_department.10.d: "Nuestro [tv_great_engineer|E] ha fallecido. Las noticias se mueven a través del [tv_engineering_department|e] a través de cajas de dibujo cerradas, mesas de topografía detenidas y asistentes que de repente no quieren borrar las últimas marcas de tiza. Cada plan inconcluso parece ahora más frágil que ayer. El maravilloso mecanismo puede mantener sus libros de contabilidad, pero [tv_wonder_construction|e] necesita una mente viva para convertir la ambición en secuencia. Hasta que se nombre un sucesor, el reino tiene piedra, trabajo y esperanza, pero no hay un maestro de obras que los haga estar de acuerdo.\n\n#weak El puesto de Gran Ingeniero ahora está vacante: designe un sucesor en el Departamento de Ingeniería lo antes posible para mantener en marcha la construcción de la maravilla.#!"
 tv_engineering_department.10.a: "Encuentre un sucesor antes de que los planes se acaben."
 tv_engineering_department.20.t: "[tv_wonder_construction|E]：El proyecto colapsa"
 tv_engineering_department.20.d: "La reserva de [tv_wonder_domestic_support|e] se ha agotado. Los cortesanos que alguna vez elogiaron el proyecto ahora recuerdan asuntos urgentes en otros lugares, los portavoces de la propiedad redescubren sus objeciones y los proveedores exigen el pago antes de que se mueva otro carro. Con el gran proyecto indefendible, el [tv_engineering_department|e] debe abandonar la maravilla bloqueada y soportar la desgracia. El terreno permanece, las primeras marcas permanecen y tal vez queden algunas piedras, pero el puente político debajo de ellas se ha derrumbado. Ningún monumento puede resistir el silencio, el miedo y las promesas impagas.\n\n#weak La maravilla ha sido abandonada por la fuerza; puede volver a evaluar el sitio y los planos en el Departamento de Ingeniería y comenzar de nuevo en cualquier momento.#!"
 tv_engineering_department.20.a: "Que la vergüenza quede registrada limpiamente."
 tv_engineering_department.30.t: "[tv_wonder_construction|E]：Un diseño toma forma"
 tv_engineering_department.30.d: "El [tv_great_engineer|E] ha llenado las primeras páginas: elevaciones accidentadas, dudas valoradas, fortalezas ocultas del terreno y algunas imposibilidades elegantes tachadas con visible pesar. El concepto ya no es un estado de ánimo en el taller. Está listo para convertirse en una propuesta que el tribunal pueda comparar, disputar y finalmente elegir.\n\n#weak El concepto de diseño está listo: vaya al Departamento de Ingeniería para revisar la propuesta del [tv_great_engineer|E], aceptándola o exigiéndoles que la reconciban, luego avance en el debate sobre la maravilla para generar suficiente apoyo interno.#!"
 tv_engineering_department.30.a: "Muéstranos los diseños."
 tv_engineering_department.100.t: "[tv_wonder_debate|E]：Reunión de Casas Nobles"
 tv_engineering_department.100.d: "Varias casas nobles han decidido que la maravilla magnificará su propia memoria tanto como la del reino. Sus heraldos hablan de asientos ancestrales, nombres inmortales y la agradable posibilidad de que las generaciones futuras confundan la gloria privada con el propósito público. El [tv_engineering_department|e] no los corrige. El apoyo es el apoyo, y [tv_wonder_domestic_support|e] suele llegar con joyas. Sus voces ahora resuenan en la corte con un volumen útil."
 tv_engineering_department.100.a: "Que se dejen ver."
 tv_engineering_department.101.t: "[tv_wonder_debate|E]: Noble reacción"
 tv_engineering_department.101.d: "Se difunden rumores de que la maravilla consumirá los privilegios de los nobles sin devolver suficiente honor. Algunas casas han comenzado a contar no el esplendor futuro del monumento, sino los asientos, las exenciones, los trabajadores y la precedencia ceremonial que les puede costar. El [tv_engineering_department|e] puede medir piedras, pero el rango de heridos es más difícil de medir. El apoyo entre la aristocracia flaquea y cada vacilación hace que todo el proyecto parezca más pesado. El orgullo puede ser más ligero que el mármol, pero es mucho más difícil de levantar."
 tv_engineering_department.101.a: "Su orgullo es caro."
 tv_engineering_department.102.t: "[tv_wonder_debate|E]：Los burgueses ven la oportunidad"
 tv_engineering_department.102.d: "Los maestros gremiales y los financieros empiezan a hablar de contratos, carreteras, almacenes y multitudes futuras. Ven en el asombro no sólo magnificencia, sino también facturas, derechos de transporte, habitaciones alquiladas y nietos que siguen cobrando honorarios. El [tv_engineering_department|e] escucha con atención, porque el comercio tiene talento para hacer que la ambición parezca práctica. Su entusiasmo da al debate un nuevo impulso. La prosperidad ha llegado con los dedos manchados de tinta y una excelente aritmética."
 tv_engineering_department.102.a: "La prosperidad tiene una voz persuasiva."
 tv_engineering_department.103.t: "[tv_wonder_debate|E]：Los comerciantes cuentan el costo"
 tv_engineering_department.103.d: "Algunos burgueses advierten ahora que esta maravilla paralizará la mano de obra, el crédito y el transporte. No denuncian abiertamente la gloria; simplemente preguntan cuántos carros, salarios y almacenes deben quedar atrapados debajo de él. Esa cautela es más difícil de descartar que el pánico, porque cada frase llega acompañada de una columna plausible de números. El [tv_engineering_department|e] siente que la confianza del público se va enfriando poco a poco. Los libros de contabilidad pueden resultar tan nítidos como los discursos cuando se leen en voz alta."
 tv_engineering_department.103.a: "Los libros de contabilidad pueden herir tan agudamente como los discursos."
 tv_engineering_department.104.t: "[tv_wonder_debate|E]：Bendición clerical"
 tv_engineering_department.104.d: "El clero prominente enmarca la maravilla como un signo visible de orden y devoción. Los sermones comparan la piedra medida con las almas obedientes, los cimientos estables con la doctrina fiel y el trabajo público con la disciplina de un pueblo justo. El [tv_engineering_department|e] se beneficia de este lenguaje incluso cuando los ingenieros en privado prefieren las plomadas a las metáforas. El debate adquiere un tono solemne y tranquilizador. [tv_wonder_domestic_support|E] se eleva con mayor facilidad cuando el cielo parece aprobar los andamios."
 tv_engineering_department.104.a: "Una bendición útil."
 tv_engineering_department.105.t: "[tv_wonder_debate|E]：Sermones contra el exceso"
 tv_engineering_department.105.d: "Los predicadores condenan el proyecto como vanidad revestida de piedra. Se preguntan si una aldea hambrienta necesita mármol, si el alma del gobernante puede salvarse con la altura y si el orgullo se vuelve santo simplemente porque un albañil lo ha medido. El cargo encuentra oyentes entre aquellos que ya están incómodos con el costo. El [tv_engineering_department|e] puede responder a muchas objeciones, pero los sermones están diseñados para sobrevivir a los contraargumentos. La fe puede bendecir las fundaciones, pero también puede rechazarlas."
 tv_engineering_department.105.a: "La fe también puede rechazar el mármol."
 tv_engineering_department.200.t: "[tv_wonder_construction|E]：Una unidad de construcción completada"
 tv_engineering_department.200.d: "Otra sección de la maravilla ha cruzado un umbral visible. Los andamios bajan, los supervisores marcan la unidad terminada y los trabajadores retroceden con el orgullo cauteloso de las personas que saben que la próxima tarea será igual de pesada. El público por fin puede ver que lo imposible se está convirtiendo en piedra, viga, canal o bóveda. Incluso a los críticos les resulta más difícil burlarse de algo que proyecta una sombra. [tv_wonder_construction|E] no solo ha obtenido progreso, sino también pruebas.\n\n#weak Esta unidad de construcción está completa: el Departamento de Ingeniería continuará con la siguiente unidad de la maravilla.#!"
 tv_engineering_department.200.a: "Mantenga el trabajo en movimiento."
 tv_engineering_department.201.t: "[tv_wonder_construction|E]：El proyecto surge"
 tv_engineering_department.201.d: "En [SCOPE.sLocation('tv_wonder_event_location').GetName], los cuatro módulos completados han cumplido su propósito. Sus obras temporales ahora pueden ser desmanteladas y finalmente puede comenzar la construcción en el núcleo conservado de la maravilla misma. Fundación, cuerpo, función y coronación ya no son fragmentos en competencia; están listos para ser plegados en un solo monumento.\n\n#weak Los cuatro módulos se han fusionado en el núcleo de la maravilla; mire el panel del Departamento de Ingeniería, ya que el edificio final comenzará a construirse automáticamente una vez que la maravilla alcance su nivel de finalización.#!"
 tv_engineering_department.201.a: "Desmontar los módulos y levantar el núcleo."
 tv_engineering_department.202.t: "[tv_wonder_construction|E]：La obra está completa"
 tv_engineering_department.202.d: "El [tv_engineering_department|E] ha declarado completada la fase de construcción. Se desmantelan las obras, se retiran los equipos de trabajo y se cierran los últimos libros de contabilidad de los contratistas con una satisfacción que sólo los contables disfrutan verdaderamente. El monumento sigue en pie, pero la piedra por sí sola aún no es el destino. La cuestión inconclusa ha pasado de cómo construirlo a cómo consagrarlo. El reino ha formado un cuerpo; el [tv_wonder_ceremony|e] ahora debe darle un alma pública.\n\n#weak La fase de construcción está completa: visite el Departamento de Ingeniería para elegir un estilo de ceremonia de dedicación y comenzar la ceremonia de la maravilla.#!"
 tv_engineering_department.202.a: "Prepara la ceremonia."
 tv_engineering_department.202.a.tt: "El $tv_wonder_labor_camp$ en el lugar de trabajo será demolido."
 tv_engineering_department.203.t: "[tv_wonder_construction|E]：El debate está resuelto"
 tv_engineering_department.203.d: "El tribunal ha anunciado el fin del maravilloso debate. La oposición no ha desaparecido, pero ha sido contada, respondida, atenuada o incorporada al plan oficial. El proyecto deja ahora atrás los discursos y se adentra en el mundo mesurado del terreno, las carreteras, las pendientes y las distancias. El [tv_great_engineer|e] solicita un sitio para inspeccionar. A partir de este momento, [tv_wonder_domestic_support|e] se drenará lentamente, por lo que el siguiente orden debería ser práctico: elija dónde puede ubicarse realmente el monumento. \n\n#weak El debate ha terminado: elija un sitio de construcción para la maravilla en el Departamento de Ingeniería para comenzar el estudio y la construcción.#!"
 tv_engineering_department.203.a: "Comience la encuesta."
 tv_engineering_department.300.t: "[tv_wonder_survey|E]: Encuesta completada"
 tv_engineering_department.300.d_high: "El [tv_wonder_survey|E] regresa con excelentes lecturas. El terreno elegido puede soportar la ambición, los suministros pueden llegar hasta él y los equipos de trabajo ven un camino a través del terreno antes de que se levante el primer campamento permanente. El [tv_great_engineer|e] lee las tablas dos veces, no porque los números sean dudosos, sino porque una buena noticia merece verificación. La escala, la logística y la organización apuntan ahora en la misma dirección. El sitio parece casi ansioso por volverse difícil de manera útil."
 tv_engineering_department.300.d_mid: "El [tv_wonder_survey|E] regresa con lecturas utilizables. El sitio no hará que el trabajo sea sencillo, pero ninguna sorpresa sincera jamás lo prometió. El terreno tiene límites, los caminos tienen estados de ánimo y el plan laboral necesitará disciplina más que romance. Aun así, el [tv_engineering_department|e] ahora puede planificar en torno a las debilidades que ha nombrado. Un obstáculo mesurado ya está medio domesticado."
 tv_engineering_department.300.d_low: "El [tv_wonder_survey|E] regresa con lecturas preocupantes. El lugar aún puede ser declarado, pero los mapas parecen nerviosos y los topógrafos eligen sus palabras con cuidado profesional. El terreno, las rutas o la organización laboral pueden resistirse a nuestra ambición más de lo que se esperaba en un principio. El [tv_engineering_department|e] advierte que una ubicación diferente puede servir mejor para la maravilla. Proceder aquí sería una decisión tomada con los ojos abiertos, lo cual es mejor que la ceguera y más cara que la confianza."
 tv_engineering_department.300.a: "Revisa el resultado."
 tv_engineering_department.310.t: "[tv_wonder_survey|E]: Cimientos ocultos"
 tv_engineering_department.310.d: "Los topógrafos descubren terreno estable y piedra antigua debajo de las obras propuestas. Lo que al principio parecía meramente sólido ahora parece casi preparado, como si una mano olvidada hubiera abandonado la tierra en orden útil. Los equipos de [tv_wonder_survey|e] discuten alegremente sobre la carga, la profundidad y el raro placer de encontrar un problema que se ha resuelto por sí solo. La posible escala de la maravilla parece más generosa de lo que se suponía inicialmente. Incluso el [tv_great_engineer|e] permite sonreír antes de pedir otra medición."
 tv_engineering_department.310.a: "Excelente."
 tv_engineering_department.311.t: "[tv_wonder_survey|E]：Tierra traicionera"
 tv_engineering_department.311.d: "El terreno cambia donde los primeros mapas prometían certeza. Las apuestas disminuyen, las líneas de tiza ya no concuerdan entre sí y los equipos de inspección empiezan a hablar con frases más cortas. Apoyos adicionales reducirán la escala práctica de la maravilla, no porque la ambición se haya debilitado, sino porque la Tierra ha respondido con sus propias condiciones. El [tv_engineering_department|e] aún puede continuar. Simplemente debe dejar de pretender que el terreno es pasivo."
 tv_engineering_department.311.a: "Ajusta los planes."
 tv_engineering_department.312.t: "[tv_wonder_survey|E]: Borrar líneas de suministro"
 tv_engineering_department.312.d: "El [tv_wonder_survey|E] encuentra rutas que pueden transportar piedra, madera y herramientas con menos fricción de la esperada. Una carretera abandonada se une a un recodo de un río utilizable, un campo de preparación resulta más amplio que la memoria y los transportistas locales ya conocen atajos que ningún mapa real se molestó en aprender. [tv_wonder_materials|E] se moverá más limpiamente porque la tierra le ha ofrecido varios favores silenciosos. La logística, por una vez, no llega como acusación. Llega como un mapa con buenos márgenes."
 tv_engineering_department.312.a: "Márcalos con cuidado."
 tv_engineering_department.313.t: "[tv_wonder_survey|E]：Aproximaciones rotas"
 tv_engineering_department.313.d: "Las carreteras, vías fluviales y zonas de estacionamiento resultan peores de lo que afirmaban los primeros informes. Las ruedas se hunden donde debería mantenerse la carretera, los barcos pierden tiempo donde debería llevar el agua y los campos de estacionamiento se reducen en el momento en que los carros reales entran en ellos. La logística será más difícil de dominar y [tv_wonder_materials|e] no perdonará el optimismo. El [tv_engineering_department|e] se enfrenta ahora a la vieja verdad de las grandes obras: un monumento comienza mucho antes de que la piedra llegue a él. A veces comienza con barro."
 tv_engineering_department.313.a: "Lo compensaremos."
 tv_engineering_department.314.t: "[tv_wonder_survey|E]: Orden en el campo"
 tv_engineering_department.314.d: "Los equipos de medición adoptan un ritmo limpio. Se colocan banderas, se copian notas, los supervisores dejan de contradecirse entre sí y las observaciones aproximadas se convierten en un sistema que los trabajadores futuros realmente podrán obedecer. Este no es un descubrimiento dramático, pero puede ser más útil que uno. [tv_wonder_construction|E] depende del aburrido milagro de que muchas personas hagan lo mismo en el mismo orden. Hoy, ese milagro parece posible."
 tv_engineering_department.314.a: "Un buen hábito."
 tv_engineering_department.315.t: "[tv_wonder_survey|E]：Confusión en la encuesta"
 tv_engineering_department.315.d: "Los mapas contradictorios y los supervisores rivales ralentizan el trabajo. Un equipo confía en la cresta, otro en la carretera y un tercero ha elaborado una tabla tan precisa que todos desconfían de ella inmediatamente. El [tv_engineering_department|e] pierde confianza en su plan de organización futuro porque la confusión, una vez escrita, parece casi oficial. La maravilla puede sobrevivir en terrenos difíciles más fácilmente que un mal comando. Antes de que comience el parto, alguien debe enseñarle a los mapas a ponerse de acuerdo."
 tv_engineering_department.315.a: "Desenredarlo."
 tv_engineering_department.320.t: "[tv_wonder_survey|E]: Instrumentos especiales solicitados"
 tv_engineering_department.320.d: "Los agrimensores solicitan instrumentos costosos y artesanos especializados. Hablan de ángulos demasiado finos para la vista normal, pruebas de suelo demasiado delicadas para hacer conjeturas y mediciones que harían que la evaluación de escala del [tv_great_engineer|e] dependiera menos del noble optimismo. El tribunal conoce de los gastos; los ingenieros escuchan precisión. Financiarlos debería mejorar la encuesta, pero también enseñará a todos los futuros solicitantes que la precisión tiene un precio. La negativa deja las viejas herramientas en su lugar y los desconocidos sonríen cortésmente."
 tv_engineering_department.320.a: "Pague por la precisión."
 tv_engineering_department.320.b: "Conformarnos con lo que tenemos."
 tv_engineering_department.321.t: "[tv_wonder_survey|E]: Prestigio de la experiencia"
 tv_engineering_department.321.d: "El [tv_great_engineer|E] pide al tribunal que respalde públicamente un método logístico controvertido. La propuesta promete un movimiento más rápido de [tv_wonder_materials|e], menos trabajadores inactivos y exactamente el tipo de novedad que hace que los supervisores conservadores comiencen a aclararse la garganta. Prestar el prestigio del reino puede hacer que el plan de suministro sea más convincente. Si fracasa, la vergüenza también será pública. Los grandes proyectos a menudo piden al Estado que apueste antes de que la primera multitud entienda las reglas."
 tv_engineering_department.321.a: "Ponga nuestro nombre en ello."
 tv_engineering_department.321.b: "Sin respaldo público."
 tv_engineering_department.322.t: "[tv_wonder_survey|E]: Coordinación del gremio"
 tv_engineering_department.322.d: "Los proveedores urbanos pueden ayudar a estandarizar los registros de las encuestas, pero esperan concesiones por la interrupción. Sus empleados entienden los pesos, las cuentas, las rutas y la silenciosa tiranía de hacer coincidir una lista con otra. El [tv_engineering_department|e] podría utilizar esa competencia, especialmente antes de que el [tv_wonder_materials|e] comience a moverse en serio. Sin embargo, cada concesión escribe el comercio un poco más profundamente en la memoria del monumento. Podemos comprar pedido, pero el pedido recordará quién lo vendió."
 tv_engineering_department.322.a: "Apóyate en los gremios."
 tv_engineering_department.322.b: "Evite nuevas obligaciones."
 tv_engineering_department.401.t: "[tv_wonder_ceremony|E]：La meditación comienza"
 tv_engineering_department.401.d: "La maravilla consumada queda velada por el silencio. Sacerdotes, ingenieros y observadores reales se retiran del espectáculo ordinario para que un año de austeridad pueda dar al monumento su significado final. El [tv_wonder_ceremony|e] no comienza con el ruido, sino con su rechazo deliberado. Incluso el [tv_engineering_department|e] debe aprender a tener paciencia, ya que ningún cálculo puede acelerar un ritual destinado a enseñar a moderar. Los visitantes encuentran desconcertante el silencio al principio. Luego empiezan a bajar la voz antes de entender por qué."
 tv_engineering_department.401.a: "Que cambie el año."
 tv_engineering_department.410.t: "[tv_wonder_ceremony|E]：Se solicitan enviados"
 tv_engineering_department.410.d: "Un tribunal vecino pide que enviemos un emisario para presenciar la inauguración de su gran eje. La invitación es ceremonial, pero en las ceremonias los estados practican ser recordados. La asistencia colocará nuestro nombre entre quienes vieron primero el nuevo monumento, aplaudieron en el momento correcto y entendieron el mensaje sin necesidad de explicaciones. Rechazarlo salvaría el viaje y perdería el lugar en su historia. Algunas piedras se construyen en casa; otros esperan testigos del extranjero."
 tv_engineering_department.410.a: "Envía al emisario."
 tv_engineering_department.410.b: "Rechaza la invitación."
 tv_engineering_department.411.t: "[tv_wonder_ceremony|E]: Llega un emisario"
 tv_engineering_department.411.d: "El tribunal invitado ha aceptado. Otro emisario extranjero se une a la procesión ritual con dignidad ensayada, un séquito viajero y ojos entrenados para notar tanto la grandeza como la debilidad. El [tv_wonder_ceremony|e] se vuelve más convincente con cada testigo externo, porque la gloria es más fuerte cuando se repite con otro acento. Los maestros de procesión ajustan el orden de entrada; Los escribas ajustan la lista de invitados de honor. El progreso ceremonial de la maravilla avanza, una corte observando a la vez."
 tv_engineering_department.411.a: "Recíbelos con honor."
 tv_engineering_department.412.t: "[tv_wonder_ceremony|E]: Invitación rechazada"
 tv_engineering_department.412.d: "El tribunal invitado se ha negado a enviar un emisario. Su respuesta es lo suficientemente educada como para evitar insultos y lo suficientemente fría como para ser recordada. El [tv_wonder_ceremony|e] debe encontrar su audiencia en otra parte, ya que un monumento que busca admiración extranjera no puede permitirse un lugar diplomático vacío. Los cortesanos ya sugieren nuevos nombres, rutas más favorecedoras y cartas que suenan menos a peticiones. A Glory no le gusta el rechazo, pero puede ser redirigido."
 tv_engineering_department.412.a: "Invita a otro vecino."
 tv_engineering_department.421.t: "[tv_wonder_ceremony|E]：Comienza el Desfile del Triunfo"
 tv_engineering_department.421.d: "Se levantan pancartas a lo largo del eje, pero el desfile aún carece de su prueba. Los tamborileros pueden ensayar, los caballos pueden pulir las piedras con cascos ceremoniales y los oficiales pueden adoptar una hermosa confianza, pero nada de eso es una victoria. El [tv_wonder_ceremony|e] exige un triunfo que la propia guerra debe certificar. Hasta entonces, la Ciudad Militar se viste para un honor que no se ha merecido del todo. Sólo la victoria en la guerra dará al monumento el recuerdo que pide."
 tv_engineering_department.421.a: "Entonces debe llegar la victoria."
 tv_engineering_department.431.t: "[tv_wonder_ceremony|E]：Comienza el Festival Cívico"
 tv_engineering_department.431.d: "La ciudad abre sus ordenadas plazas a un año de ceremonias, juegos, procesiones e instrucción pública. Los talleres son lentos, pero la gente aprende la forma de la disciplina cívica recorriéndola, observándola y quejándose de ella hasta que le resulte familiar. El [tv_wonder_ceremony|e] convierte el espacio urbano en una lección repetida a cielo abierto. Los niños memorizan rutas antes de entender los lemas. La Capital Cívica enseña obediencia haciéndola festiva."
 tv_engineering_department.431.a: "Que los ciudadanos se reúnan."
 tv_engineering_department.461.t: "[tv_wonder_ceremony|E]：Comienza el Festival del Libre Comercio"
 tv_engineering_department.461.d: "Comerciantes, enviados y corredores llenan el puerto con promesas de intercambio abierto. Los ingresos disminuyen durante un tiempo, porque la generosidad siempre parece más noble antes de cerrar las cuentas. El [tv_wonder_ceremony|e] convierte muelles, almacenes y mesas abarrotadas en un escenario para la confianza extranjera. Cada contrato firmado en público enseña al puerto a hablar un idioma que los tribunales lejanos entienden. Durante un año, las ganancias disminuyen y la reputación puede pasar."
 tv_engineering_department.461.a: "Abre los muelles."
 tv_engineering_department.471.t: "[tv_wonder_ceremony|E]：Comienza el Festival de los Ancestros"
 tv_engineering_department.471.d: "La necrópolis entra en un año de incienso, genealogías y duelo mesurado. Los nombres se recitan hasta que se sienten más pesados que los cuerpos a los que alguna vez pertenecieron, y los talleres se ralentizan mientras la memoria tiene prioridad sobre la producción. El [tv_wonder_ceremony|e] enseña al reino a tratar la ascendencia como arquitectura. Cada ofrenda pone una piedra más en el argumento de que los vivos están gobernados por los muertos ordenados. El duelo, cuando se organiza, se convierte en autoridad."
 tv_engineering_department.471.a: "Que los ancestros se reúnan."
 tv_engineering_department.481.t: "[tv_wonder_ceremony|E]：Comienza el Gremio de Navegantes"
 tv_engineering_department.481.d: "Pilotos, cartógrafos, maestros de cuerdas y empleados del puerto vigilan su ayuntamiento debajo del faro. Llegan con cartas marinas, nudos, disputas sobre precedencia y la peculiar confianza de las personas que pueden leer las líneas costeras con mal tiempo. La baliza no estará completa hasta que su institución se alce. Una sola luz advierte a los barcos; un gremio le enseña a un país cómo entender la advertencia. El [tv_wonder_ceremony|e] ahora espera a la burocracia con sal en los pelos."
 tv_engineering_department.481.a: "Construye el gremio."
 tv_engineering_department.491.t: "[tv_wonder_ceremony|E]：Comienza el Festival del Agua"
 tv_engineering_department.491.d: "Se adornan los canales, se bendicen las compuertas y se silencian los talleres durante un año de ritos del agua. Se hace que el agua parezca obediente, lo cual cualquiera que haya visto una inundación sabe que es una afirmación teológica audaz. La producción se adapta para que el complejo pueda reclamar un orden sagrado a través del [tv_wonder_ceremony|e]. Los ingenieros observan a los sacerdotes bendecir lo que preferirían inspeccionar, y los sacerdotes observan a los ingenieros medir lo que preferirían santificar. Entre ellos, el agua sigue moviéndose."
 tv_engineering_department.491.a: "Deja que las aguas giren."
 tv_engineering_department.501.t: "[tv_wonder_ceremony|E]：Comienza el drenaje profundo"
 tv_engineering_department.501.d: "Los ingenieros conducen las obras de drenaje hacia la ciudad minera. Los pozos estarán casi en silencio durante un año mientras bombas, tirantes y canales conquistan las profundidades. A los mineros no les gusta la tranquilidad casi tanto como el agua, pero ambas cosas deben soportarse antes de poder reclamar una mayor riqueza. El [tv_wonder_ceremony|e] aquí no es suave; es un trato con la oscuridad, la humedad y la paciencia. Cuando las obras por fin respiren, la ciudad sabrá hasta dónde puede llegar el miedo."
 tv_engineering_department.501.a: "Escurrir la oscuridad."
 tv_engineering_department.511.t: "[tv_wonder_ceremony|E]：Comienza el catálogo de estrellas"
 tv_engineering_department.511.d: "El observatorio se cierra entre lámparas, mesas y un disciplinado desvelo. Los astrónomos marcan una estrella tras otra, no como luces dispersas, sino como entradas en un orden público que los futuros estudiosos pueden comprobar. La legislación se ralentiza mientras el tribunal presta atención al cielo y al instrumento. El [tv_wonder_ceremony|e] no terminará siendo un espectáculo hoy; terminará cuando los cielos hayan sido copiados con suficiente paciencia para resultar útiles."
 tv_engineering_department.511.a: "Que cuenten el cielo."
 tv_engineering_department.521.t: "[tv_wonder_ceremony|E]：Comienza la Proclamación del Eclipse"
 tv_engineering_department.521.d: "El observatorio ha emitido su predicción: se producirá un eclipse y el tribunal estará dispuesto a nombrarlo antes de que el miedo pueda nombrarlo primero. Sacerdotes, eruditos, marineros y escépticos ahora miran hacia arriba con diferentes esperanzas. Cada mes que pasa pone a prueba el reclamo. Si el cielo obedece a las tablas, el [tv_wonder_ceremony|e] se convertirá en la prueba de que el reino puede leer el cielo sin rendirse a él."
 tv_engineering_department.521.a: "Mira los cielos."
 tv_engineering_department.522.t: "[tv_wonder_ceremony|E]: Llega el eclipse"
 tv_engineering_department.522.d: "La luz cambia exactamente donde el observatorio dijo que cambiaría. Las multitudes guardan silencio, pero el silencio no es pánico; Los pregoneros ya les han contado lo que predecían las tablas eruditas. El [tv_wonder_ceremony|e] se convierte en certeza pública en el espacio entre el sol, la sombra y la respiración. Cuando vuelve la luz, el tribunal no se limita a reclamar sabiduría. Ha demostrado oportunidad, coraje y dominio de lo maravilloso."
 tv_engineering_department.522.a: "Que el reino recuerde la predicción."
 tv_engineering_department.531.t: "[tv_wonder_ceremony|E]：Homenaje recibido"
 tv_engineering_department.531.d: "Otro aporte temático ingresa al Palacio de las Naciones. Se muestra con pulido cuidado: no sólo riqueza, sino una discusión sobre el rango visible para cada enviado que pasa por la sala. La galería homenaje se vuelve más persuasiva con cada oferta porque la subordinación, como la gloria, se vuelve más fácil de creer cuando tiene arquitectura. La ceremonia avanza un acto medido de obediencia a la vez."
 tv_engineering_department.531.a: "Graba el homenaje."
 tv_engineering_department.541.t: "[tv_wonder_ceremony|E]：Comienza el Barrio de las Embajadas"
 tv_engineering_department.541.d: "Los cimientos están marcados para el barrio de la embajada al lado del Palacio de las Naciones. Las casas extranjeras obtendrán puertas, patios, pasillos de servicio y todas las pequeñas dignidades prácticas que hacen de la diplomacia una presencia diaria en lugar de una visita ocasional. El [tv_wonder_ceremony|e] ahora espera en un distrito construido para que lo habiten otros tribunales. Un palacio puede llamar la atención; un barrio de embajada enseña a prestar atención a quedarse."
 tv_engineering_department.541.a: "Construya lugares para ojos extranjeros."
 tv_engineering_department.500.t: "[tv_wonder_ceremony|E]：Se inaugura el proyecto"
 tv_engineering_department.500.d: "El [tv_engineering_department|E] ha completado el [tv_wonder_ceremony|e] y el monumento ahora se erige como un signo permanente de la ambición del reino. Los andamios han desaparecido, los libros de contabilidad están sellados y el público ha comenzado el trabajo que ningún ingeniero puede terminar: decidir qué significa la maravilla. Algunos lo llamarán gloria, otros exceso, alguna prueba de que la época ha cambiado. Todos tendrán que mirarlo. Eso ya es una forma de victoria."
 tv_engineering_department.500.a: "Que la época lo recuerde."
 tv_engineering_department.600.t: "[tv_wonder_construction|E]：Se completa una maravilla del mundo"
 tv_engineering_department.600.d: "Llegan noticias desde [SCOPE.sCountry('tv_wonder_builder_country').GetName]: se ha completado una maravilla mundial en [SCOPE.sLocation('tv_wonder_completed_site').GetName]. Los informes difieren en cuanto a su costo, belleza, propósito y sabiduría, pero coinciden en un punto. El trabajo es demasiado grande para seguir siendo local. Ha entrado en la conversación común de los gobernantes."
 tv_engineering_department.600.a: "El mundo lo ha escuchado."

