 tv_engineering_department_standalone.1.t: "[tv_wonder_construction|E]: El Departamento de Ingeniería"
 tv_engineering_department_standalone.1.d: "Su país ahora cuenta con un Departamento de Ingeniería, la institución detrás de cada Gran Proyecto que pueda emprender.\n\nNombra un Gran Ingeniero para comenzar. Primero desarrollan una #high Concepción#! para un proyecto factible, que luego su tribunal sopesa en #high Debate#! nacional. Una #high Survey#! confirma el sitio elegido, luego comienza la #high Construction#!, elevando el proyecto a través de cuatro partes hasta su nivel final. La finalización está marcada por una #high Ceremonia#! que otorga una recompensa duradera.\n\nAbra el panel del Departamento de Ingeniería en cualquier momento para verificar el progreso o designar a un Gran Ingeniero."
