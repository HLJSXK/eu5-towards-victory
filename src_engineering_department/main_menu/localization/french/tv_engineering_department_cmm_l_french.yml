l_french:
 tv_engineering_departmen_name: "Département d'ingénierie"
 tv_engineering_departmen__wonder_control_name: "Contr'le des merveilles"
 tv_engineering_departmen__wonder_control_desc: "Paramètres de construction et de cycle de vie du département d'ingénierie contrôlés par l'hôte."
 tv_engineering_departmen__wonder_control__access_name: "Accès au bâtiment"
 tv_engineering_departmen__wonder_control__access_desc: "Contrôle la manière dont les bâtiments Wonder du département d'ingénierie entrent dans l'interface de bâtiment ordinaire."
 tv_engineering_departmen__wonder_control__phases_name: "Contrôle du cycle de vie"
 tv_engineering_departmen__wonder_control__phases_desc: "Contrôle quelles phases du cycle de vie de grande merveille sont raccourcies ou désactivées. Les changements de saut d'étape s'appliquent uniquement lorsqu'un projet entre par la suite dans cette phase."
 tv_engineering_departmen__wonder_control__limits_name: "Limites de construction"
 tv_engineering_departmen__wonder_control__limits_desc: "Annule les limites de taille et de chantier basées sur l'adéquation."
 tv_engineering_departmen__wonder_control__construction_name: "Réglage de la construction"
 tv_engineering_departmen__wonder_control__construction_desc: "Contrôle les exigences de progression de la construction et les événements de construction aléatoires."
 tv_engineering_departmen__direct_build_name: "Construction Direct Wonder"
 tv_engineering_departmen__direct_build_desc: "Permet de construire les bâtiments grande merveille finaux directement à partir de la liste de construction normale en utilisant leurs prix d'or configurés et un long temps de construction. Les effets locaux s'appliquent immédiatement après l'achèvement; les effets nationaux sont actualisés lors de la prochaine impulsion mensuelle."
 tv_engineering_departmen__direct_build_small_price_name: "Petit prix de construction directe"
 tv_engineering_departmen__direct_build_small_price_desc: "Prix de l'or pour chaque niveau de petite merveille directement construit, en milliers."
 tv_engineering_departmen__direct_build_small_price_format: "[CMMV('tv_engineering_departmen__direct_build_small_price')]k"
 tv_engineering_departmen__direct_build_medium_price_name: "Prix de construction directe moyen"
 tv_engineering_departmen__direct_build_medium_price_desc: "Prix de l'or pour chaque niveau de merveille moyenne construit directement, en milliers."
 tv_engineering_departmen__direct_build_medium_price_format: "[CMMV('tv_engineering_departmen__direct_build_medium_price')]k"
 tv_engineering_departmen__direct_build_large_price_name: "Grand prix de construction directe"
 tv_engineering_departmen__direct_build_large_price_desc: "Prix de l'or pour chaque niveau de grande merveille directement construit, en des milliers."
 tv_engineering_departmen__direct_build_large_price_format: "[CMMV('tv_engineering_departmen__direct_build_large_price')]k"
 tv_engineering_departmen__skip_concept_name: "Sauter la conception"
 tv_engineering_departmen__skip_concept_desc: "Les nouvelles phases de conception se terminent via un événement caché après un délai d'une journée."
 tv_engineering_departmen__skip_debate_name: "Sauter le débat"
 tv_engineering_departmen__skip_debate_desc: "Les nouvelles phases de débat reçoivent immédiatement 200 soutiens nationaux et passent à l'enquête."
 tv_engineering_departmen__skip_survey_name: "Sauter l'enquête"
 tv_engineering_departmen__skip_survey_desc: "Les nouveaux projets terminent immédiatement l'enquête avec Scale 100, Logistique 85 et Organisation 85. Les projets de reprise et d'expansion conservent leur enquête enregistrée."
 tv_engineering_departmen__unlimited_scale_name: "Échelle de merveille illimitée"
 tv_engineering_departmen__unlimited_scale_desc: "Ignore l'adéquation de l'échelle lors de la détermination si une Grande Merveille peut atteindre le niveau 6."
 tv_engineering_departmen__unlimited_organization_name: "Organisation de chantier illimitée"
 tv_engineering_departmen__unlimited_organization_desc: "Permet aux camps de travail de Grande Merveille d'atteindre 100 niveaux, quelle que soit l'adéquation de l'organisation."
 tv_engineering_departmen__disable_survey_events_name: "Désactiver l'enquête. Événements"
 tv_engineering_departmen__disable_survey_events_desc: "Empêche l'apparition d'événements aléatoires de la phase d'enquête."
 tv_engineering_departmen__skip_construction_name: "Sauter la construction"
 tv_engineering_departmen__skip_construction_desc: "Augmente immédiatement les quatre composants de merveille et le bâtiment d'aide finale correspondant au niveau 6, puis passe à la cérémonie. #R Attention: cela perturbe gravement l'équilibre du jeu.#!"
 tv_engineering_departmen__small_module_requirement_name: "Exigences du module Small Wonder"
 tv_engineering_departmen__small_module_requirement_desc: "Progrès de construction requis pour chaque module Small Wonder, en milliers."
 tv_engineering_departmen__small_module_requirement_format: "[CMMV('tv_engineering_departmen__small_module_requirement')]k"
 tv_engineering_departmen__medium_module_requirement_name: "Exigences du module Medium Wonder"
 tv_engineering_departmen__medium_module_requirement_desc: "Progrès de construction requis pour chaque module Medium Wonder, en milliers."
 tv_engineering_departmen__medium_module_requirement_format: "[CMMV('tv_engineering_departmen__medium_module_requirement')]k"
 tv_engineering_departmen__large_module_requirement_name: "Module Large Wonder Exigence"
 tv_engineering_departmen__large_module_requirement_desc: "Progression de la construction requise pour chaque module Large Wonder, en milliers."
 tv_engineering_departmen__large_module_requirement_format: "[CMMV('tv_engineering_departmen__large_module_requirement')]k"
 tv_engineering_departmen__disable_construction_events_name: "Désactiver les événements de construction"
 tv_engineering_departmen__disable_construction_events_desc: "Empêche l'apparition d'événements aléatoires de la phase de construction."
 tv_engineering_departmen__skip_ceremony_name: "Ignorer les retards et les coûts des cérémonies"
 tv_engineering_departmen__skip_ceremony_desc: "Les cérémonies génériques conservent leur sélection mais se terminent immédiatement et sans frais. Les cérémonies de merveilles uniques se terminent automatiquement dès l'entrée dans la phase de cérémonie."
