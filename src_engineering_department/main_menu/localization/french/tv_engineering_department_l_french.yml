 TV_ENGINEERING_CONSTRUCTION_INFO_TEXT: "Le niveau du Grand Projet est égal au nombre d'unités achevées le plus bas parmi ses quatre [tv_wonder_construction_part|e]. La réalisation d'une unité octroie [tv_wonder_domestic_support|e]; augmenter le niveau total accorde un autre bonus de soutien."
