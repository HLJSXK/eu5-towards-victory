 TV_WONDER_FINAL_LEVEL_REWARD_TT: "Parce que nous avons terminé un niveau [ROOT.GetVariable('tv_wonder_level').GetValue|0] grand projet, nous gagnons:"
 TV_WONDER_FINAL_SUPPORT_REWARD_TT: "Parce qu'il nous reste [ROOT.GetVariable('tv_wonder_final_support_reward_source').GetValue|0] de soutien national, nous gagnons:"
 tv_engineering_department.10.t: "[tv_great_engineer|E]：Un Grand ingénieur est décédé"
 tv_engineering_department.10.d: "Notre [tv_great_engineer|E] est décédé. L'actualité circule à travers le [tv_engineering_department|e] au moyen de caisses à dessins fermées, ils ont cessé d'examiner les tables et les assistants ont soudainement refusé d'effacer les dernières marques de craie. Chaque projet inachevé semble désormais plus fragile qu'hier. Le mécanisme des merveilles peut tenir ses registres, mais [tv_wonder_construction|e] a besoin d'un esprit vivant pour transformer l'ambition en séquence. Jusqu'à ce qu'un successeur soit nommé, le royaume a de la pierre, du travail et de l'espoir, mais aucun maître d'œuvre pour les mettre d'accord.\n\n#weak Le poste de Grand ingénieur est désormais vacant: nommez un successeur au sein du département d'ingénierie dès que possible pour poursuivre la construction de la merveille.#!"
 tv_engineering_department.10.a: "Trouvez un successeur avant que les plans ne soient mis en œuvre. froid."
 tv_engineering_department.20.t: "[tv_wonder_construction|E]：Le projet s'effondre"
 tv_engineering_department.20.d: "La réserve de [tv_wonder_domestic_support|e] s'est vidé. Les courtisans qui faisaient autrefois l'éloge du projet se souviennent désormais d'affaires urgentes ailleurs, les porte-parole du domaine redécouvrent leurs objections et les fournisseurs demandent un paiement avant qu'un autre chariot ne bouge. Avec le grand projet indéfendable, le [tv_engineering_department|e] doit abandonner la merveille verrouillée et supporter la honte. Le sol demeure, les premières traces demeurent, et peut-être quelques pierres, mais le pont politique qui les sous-tend s'est effondré. Aucun monument ne peut subsister sur le silence, la peur et les promesses non tenues.\n\n#weak La merveille a été abandonnée de force: vous pouvez réévaluer le site et les plans au service d'ingénierie et recommencer à tout moment.#!"
 tv_engineering_department.20.a: "Que la honte soit clairement enregistrée."
 tv_engineering_department.30.t: "[tv_wonder_construction|E]：Une conception prend forme."
 tv_engineering_department.30.d: "Le [tv_great_engineer|E] a rempli les premières pages: des élévations brutales, des doutes chiffrés, des atouts cachés du terrain et quelques élégantes impossibilités barrées d'un visible regret. Le concept n'est plus une ambiance dans l'atelier. Elle est prête à devenir une proposition que le tribunal peut comparer, contester et finalement choisir.\n\n#weak Le concept de conception est prêt: rendez-vous au service d'ingénierie pour examiner le [tv_great_engineer|E], en l'acceptant ou en leur demandant de la repenser, puis de faire avancer le débat sur l'opportunité d'obtenir un soutien interne suffisant.#!"
 tv_engineering_department.30.a: "Montrez-nous le designs."
 tv_engineering_department.100.t: "[tv_wonder_debate|E]：Rassemblement des maisons nobles"
 tv_engineering_department.100.d: "Plusieurs maisons nobles ont décidé que la merveille magnifierait leur propre mémoire autant que celle du royaume. Leurs hérauts parlent de sièges ancestraux, de noms immortels et de la possibilité agréable que les générations futures puissent confondre gloire privée et objectif public. Le [tv_engineering_department|e] ne les corrige pas. Le soutien est le soutien, et [tv_wonder_domestic_support|e] arrive souvent avec des bijoux. Leurs voix résonnent désormais dans la cour avec un volume utile."
 tv_engineering_department.100.a: "Laissez-les être vus."
 tv_engineering_department.101.t: "[tv_wonder_debate|E]：Noble Backlash"
 tv_engineering_department.101.d: "Des rumeurs se répandent selon lesquelles la merveille consumerait les nobles privilèges sans rendre suffisamment d'honneur. Quelques maisons ont commencé à compter non pas la splendeur future du monument, mais les sièges, les exemptions, les ouvriers et la préséance cérémonielle que cela pourrait leur coûter. Le [tv_engineering_department|e] peut mesurer la pierre, mais le rang des blessés est plus difficile à évaluer. Le soutien au sein de l'aristocratie faiblit et chaque hésitation rend l'ensemble du projet plus lourd. La fierté est peut-être plus légère que le marbre, mais elle est beaucoup plus difficile à soulever."
 tv_engineering_department.101.a: "Leur fierté coûte cher."
 tv_engineering_department.102.t: "[tv_wonder_debate|E]：Les bourgeois voient une opportunité"
 tv_engineering_department.102.d: "Les maîtres de guilde et les financiers commencent à parler de contrats, de routes, d'entrepôts et de foules futures. Ils voient dans l'émerveillement non seulement la magnificence, mais aussi les factures, les droits de transport, les chambres louées et les petits-enfants qui continuent de percevoir des frais. Le [tv_engineering_department|e] écoute attentivement, car le commerce a le talent de rendre l'ambition pratique. Leur enthousiasme donne un nouvel élan au débat. La prospérité est arrivée avec des doigts tachés d'encre et un excellent calcul."
 tv_engineering_department.102.a: "La prospérité a une voix persuasive."
 tv_engineering_department.103.t: "[tv_wonder_debate|E]：Les marchands comptent le coût"
 tv_engineering_department.103.d: "Certains bourgeois préviennent maintenant que la merveille va bloquer le travail, le crédit et les transports. Ils ne dénoncent pas carrément la gloire; ils demandent simplement combien de wagons, de salaires et d'entrepôts doivent être enfermés dessous. Une telle prudence est plus difficile à rejeter que la panique, car chaque phrase est accompagnée d'une colonne de chiffres plausible. Le [tv_engineering_department|e] sent que la confiance du public se refroidit progressivement. Les registres peuvent être aussi tranchants que les discours lorsqu'ils sont lus à haute voix."
 tv_engineering_department.103.a: "Les registres peuvent être aussi tranchants que les discours."
 tv_engineering_department.104.t: "[tv_wonder_debate|E]：Bénédiction cléricale"
 tv_engineering_department.104.d: "D'éminents membres du clergé présentent cette merveille comme un signe visible d'ordre et de dévotion. Les sermons comparent la pierre mesurée aux âmes obéissantes, les fondations stables à la doctrine fidèle et le travail public à la discipline d'un peuple juste. Le [tv_engineering_department|e] bénéficie de ce langage même lorsque les ingénieurs préfèrent en privé les fils à plomb aux métaphores. Le débat prend un ton solennel et rassurant. [tv_wonder_domestic_support|E] s'élève plus facilement lorsque le ciel semble approuver les échafaudages."
 tv_engineering_department.104.a: "Une bénédiction utile."
 tv_engineering_department.105.t: "[tv_wonder_debate|E]：Sermons contre les excès"
 tv_engineering_department.105.d: "Les prédicateurs condamnent le projet comme une vanité habillée de pierre. Ils se demandent si un village affamé a besoin de marbre, si l'âme du dirigeant peut être sauvée par la hauteur et si l'orgueil devient sacré simplement parce qu'un maçon l'a mesuré. L'accusation trouve des auditeurs parmi ceux déjà inquiets du coût. Le [tv_engineering_department|e] peut répondre à de nombreuses objections, mais les sermons sont construits pour survivre aux contre-arguments. La foi peut bénir les fondations, et elle peut aussi les refuser."
 tv_engineering_department.105.a: "La foi peut aussi refuser le marbre."
 tv_engineering_department.200.t: "[tv_wonder_construction|E]：Une unité de construction terminée"
 tv_engineering_department.200.d: "Une autre partie de la merveille a franchi un seuil visible. Les échafaudages descendent, les surveillants marquent l'unité terminée et les ouvriers reculent avec la fierté prudente de ceux qui savent que la prochaine tâche sera tout aussi lourde. Le public peut enfin voir que l'impossible devient pierre, poutre, canal ou voûte. Même les critiques ont plus de mal à se moquer de quelque chose qui jette une ombre. [tv_wonder_construction|E] a acquis non seulement des progrès, mais aussi des preuves.\n\n#weak Cette unité de construction est terminée — le département d'ingénierie poursuivra sa route vers la prochaine unité de la merveille.#!"
 tv_engineering_department.200.a: "Poursuivez le travail."
 tv_engineering_department.201.t: "[tv_wonder_construction|E]：Le projet s'élève"
 tv_engineering_department.201.d: "À [SCOPE.sLocation('tv_wonder_event_location').GetName], les quatre modules complétés ont rempli leur fonction. Leurs ouvrages temporaires peuvent désormais être démontés et la construction peut enfin commencer sur le noyau préservé de la merveille elle-même. Fondation, corps, fonction et couronnement ne sont plus des fragments concurrents; ils sont prêts à être repliés en un seul monument.\n\n#weak Les quatre modules ont fusionné au cœur de la merveille. Surveillez le panneau du département d'ingénierie, car le bâtiment final commencera automatiquement sa construction une fois que la merveille aura atteint son niveau d'achèvement.#!"
 tv_engineering_department.201.a: "Démontez les modules et soulevez le noyau."
 tv_engineering_department.202.t: "[tv_wonder_construction|E]：Les supports de travail Complete"
 tv_engineering_department.202.d: "Le [tv_engineering_department|E] a déclaré la phase de construction terminée. Les chantiers sont démantelés, les équipes de travail se retirent et les derniers registres des entrepreneurs se clôturent avec une satisfaction dont seuls les comptables jouissent véritablement. Le monument existe désormais, mais la pierre seule n'est pas encore le destin. La question inachevée est passée de la manière de la construire à la manière de la consacrer. Le royaume a fait un corps; le [tv_wonder_ceremony|e] Il faut maintenant lui donner une âme publique.\n\n#weak La phase de construction est terminée: visitez le service d'ingénierie pour choisir un style de cérémonie d'inauguration et commencer la cérémonie de la merveille.#!"
 tv_engineering_department.202.a: "Préparez la cérémonie."
 tv_engineering_department.202.a.tt: "Le $tv_wonder_labor_camp$ sur le chantier sera démoli."
 tv_engineering_department.203.t: "[tv_wonder_construction|E]：Le débat est réglé"
 tv_engineering_department.203.d: "Le tribunal a annoncé la fin du débat sur les merveilles. L'opposition n'a pas disparu, mais elle a été prise en compte, répondue, réduite à néant ou intégrée au plan officiel. Le projet laisse désormais de côté les discours et entre dans le monde mesuré du sol, des routes, des dénivelés et des distances. Le [tv_great_engineer|e] demande un site à étudier. À partir de ce moment, [tv_wonder_domestic_support|e] va lentement s'écouler, la prochaine commande devrait donc être pratique: choisir où le monument peut réellement se tenir.\n\n#weak Le débat est terminé: choisissez un chantier de construction pour la merveille au sein du département d'ingénierie pour commencer l'arpentage et la construction.#!"
 tv_engineering_department.203.a: "Commencer le enquête."
 tv_engineering_department.300.t: "[tv_wonder_survey|E]：Enquête terminée"
 tv_engineering_department.300.d_high: "Le [tv_wonder_survey|E] revient avec d'excellentes lectures. Le terrain choisi peut supporter l'ambition, les fournitures peuvent y parvenir et les équipes de travail voient un chemin à travers le terrain avant que le premier camp permanent ne soit érigé. Le [tv_great_engineer|e] lit les tableaux deux fois, non pas parce que les chiffres sont douteux, mais parce qu'une bonne nouvelle mérite d'être vérifiée. L'échelle, la logistique et l'organisation vont désormais dans la même direction. Le site semble presque désireux de devenir difficile de manière utile."
 tv_engineering_department.300.d_mid: "Le [tv_wonder_survey|E] revient avec des lectures utilisables. Le site ne facilitera pas le travail, mais aucune merveille honnête n'a jamais promis cela. Le terrain a des limites, les routes ont des ambiances et le plan de travail aura besoin de discipline plutôt que de romantisme. Néanmoins, le [tv_engineering_department|e] peut désormais planifier en fonction des faiblesses qu'il a signalées. Un obstacle mesuré est déjà à moitié domestiqué."
 tv_engineering_department.300.d_low: "Le [tv_wonder_survey|E] revient avec des lectures troublantes. Le site peut encore être déclaré, mais les cartes semblent nerveuses et les géomètres choisissent leurs mots avec un soin professionnel. Le terrain, les routes ou l'organisation du travail pourraient résister à notre ambition plus que prévu. Le [tv_engineering_department|e] avertit qu'un emplacement différent pourrait mieux servir la merveille. Procéder ici serait une décision prise les yeux ouverts, ce qui vaut mieux que l'aveuglement et plus coûteux que la confiance."
 tv_engineering_department.300.a: "Examinez le résultat."
 tv_engineering_department.310.t: "[tv_wonder_survey|E]：Fondations cachées"
 tv_engineering_department.310.d: "Les géomètres découvrent un sol stable et de vieilles pierres sous les travaux proposés. Ce qui semblait d'abord simplement solide apparaît maintenant presque préparé, comme si une main oubliée avait laissé la terre en ordre utile. Les équipes de [tv_wonder_survey|e] discutent allègrement sur la charge, la profondeur et le rare plaisir de trouver un problème résolu tout seul. L'ampleur possible de la merveille semble plus généreuse qu'on ne le pensait initialement. Même le [tv_great_engineer|e] permet de sourire avant de demander une autre mesure."
 tv_engineering_department.310.a: "Excellent."
 tv_engineering_department.311.t: "[tv_wonder_survey|E]：Teracherous Ground"
 tv_engineering_department.311.d: "Le terrain se déplace là où les premières cartes promettaient une certitude. Les enjeux s'amenuisent, les lignes à la craie ne s'accordent plus les unes avec les autres et les équipes d'enquête commencent à parler avec des phrases plus courtes. Des soutiens supplémentaires réduiront l'ampleur pratique de la merveille, non pas parce que l'ambition s'est affaiblie, mais parce que la terre a répondu avec ses propres conditions. Le [tv_engineering_department|e] peut toujours continuer. Il doit simplement arrêter de prétendre que le sol est passif."
 tv_engineering_department.311.a: "Ajuster les plans."
 tv_engineering_department.312.t: "[tv_wonder_survey|E]：Effacer les lignes d'approvisionnement."
 tv_engineering_department.312.d: "Le [tv_wonder_survey|E] trouve des itinéraires pouvant transporter de la pierre, du bois et des outils avec moins de friction que prévu. Une route négligée rejoint un méandre de rivière utilisable, un terrain de transit s'avère plus large que la mémoire et les transporteurs locaux connaissent déjà des raccourcis qu'aucune carte royale n'a pris la peine d'apprendre. [tv_wonder_materials|E] se déplacera plus proprement car le terrain a offert plusieurs faveurs tranquilles. La logistique, pour une fois, n'arrive pas comme une accusation. Elle arrive sous forme de carte avec de bonnes marges."
 tv_engineering_department.312.a: "Marquez-les soigneusement."
 tv_engineering_department.313.t: "[tv_wonder_survey|E]：Approches brisées"
 tv_engineering_department.313.d: "Les routes, les voies navigables et les terrains de rassemblement s'avèrent pires que ce que prétendaient les premiers rapports. Les roues s'enfoncent là où la route devrait tenir, les bateaux perdent du temps là où l'eau devrait les transporter, et les champs de rassemblement rétrécissent au moment où de vrais chariots y pénètrent. La logistique sera plus difficile à maîtriser et [tv_wonder_materials|e] ne pardonnera pas l'optimisme. Le [tv_engineering_department|e] se retrouve désormais confronté à la vieille vérité des grandes œuvres: un monument commence bien avant que la pierre ne l'atteigne. Parfois, cela commence par de la boue."
 tv_engineering_department.313.a: "Nous compenserons."
 tv_engineering_department.314.t: "[tv_wonder_survey|E]：Ordre sur le terrain"
 tv_engineering_department.314.d: "Les équipes de mesure s'installent dans un rythme propre. Les drapeaux sont déployés, les notes sont copiées, les surveillants cessent de se contredire et les observations grossières deviennent un système auquel les travailleurs futurs peuvent réellement obéir. Ce n'est pas une découverte spectaculaire, mais elle pourrait s'avérer plus utile qu'une seule. [tv_wonder_construction|E] dépend du miracle ennuyeux de nombreuses personnes faisant la même chose dans le même ordre. Aujourd'hui, ce miracle semble possible."
 tv_engineering_department.314.a: "Une bonne habitude."
 tv_engineering_department.315.t: "[tv_wonder_survey|E]：Confusion des enquêtes"
 tv_engineering_department.315.d: "Des cartes contradictoires et des surveillants rivaux ralentissent le travail. Un équipage ne jure que par la crête, un autre par la route, et un troisième a réalisé un tableau si précis que tout le monde s'en méfie immédiatement. Le [tv_engineering_department|e] perd confiance dans son futur projet d'organisation car la confusion, une fois écrite, paraît presque officielle. La merveille peut survivre plus facilement à un mauvais terrain qu'à un mauvais commandement. Avant le début du travail, quelqu'un doit apprendre aux cartes à s'accorder."
 tv_engineering_department.315.a: "Démêlez-les."
 tv_engineering_department.320.t: "[tv_wonder_survey|E]：Instruments spéciaux demandés"
 tv_engineering_department.320.d: "Les géomètres demandent des instruments coûteux et des artisans spécialisés. Ils parlent d'angles trop fins pour une vue ordinaire, d'analyses de sol trop délicates pour des conjectures et de mesures qui rendraient l'évaluation à l'échelle du [tv_great_engineer|e] moins dépendante d'un noble optimisme. Le tribunal entend les dépenses; les ingénieurs entendent la précision. Leur financement devrait améliorer l'enquête, mais cela apprendra également à tous les futurs demandeurs que l'exactitude a un prix. Le refus laisse les anciens outils en place et les inconnus souriant poliment."
 tv_engineering_department.320.a: "Payez pour la précision."
 tv_engineering_department.320.b: "Faites-vous avec ce que nous avons."
 tv_engineering_department.321.t: "[tv_wonder_survey|E]：Prestige de l'expertise"
 tv_engineering_department.321.d: "Le [tv_great_engineer|E] demande au tribunal de soutenir publiquement une méthode logistique controversée. La proposition promet un mouvement plus rapide des [tv_wonder_materials|e], moins de travailleurs inactifs et exactement le genre de nouveauté qui incite les surveillants conservateurs à se racler la gorge. Prêter le prestige du royaume peut rendre le plan d'approvisionnement plus convaincant. Si cela échoue, l'embarras sera également public. Les grands projets demandent souvent à l'État de parier avant que la première foule ne comprenne les règles."
 tv_engineering_department.321.a: "Mettez notre nom dessus."
 tv_engineering_department.321.b: "Aucun soutien public."
 tv_engineering_department.322.t: "[tv_wonder_survey|E]：Coordination de guilde"
 tv_engineering_department.322.d: "Les fournisseurs urbains peuvent aider à standardiser les enregistrements d'enquête, mais ils attendent des concessions pour la perturbation. Leurs commis comprennent les poids, les décomptes, les itinéraires et la tyrannie tranquille de faire correspondre une liste à une autre. Le [tv_engineering_department|e] pourrait utiliser cette compétence, surtout avant que [tv_wonder_materials|e] ne commence sérieusement à agir. Pourtant, chaque concession inscrit le commerce un peu plus profondément dans la mémoire du monument. Nous pouvons acheter de l'ordre, mais l'ordre se souviendra de qui l'a vendu."
 tv_engineering_department.322.a: "Appuyez-vous sur les guildes."
 tv_engineering_department.322.b: "Évitez de nouvelles obligations."
 tv_engineering_department.401.t: "[tv_wonder_ceremony|E]：La méditation commence"
 tv_engineering_department.401.d: "Le miracle accompli est voilé dans le silence. Prêtres, ingénieurs et observateurs royaux se retirent du spectacle ordinaire pour qu'une année d'austérité puisse donner au monument son sens final. Le [tv_wonder_ceremony|e] ne commence pas par le bruit, mais par le refus délibéré de celui-ci. Même le [tv_engineering_department|e] doit apprendre la patience, car aucun calcul ne peut accélérer un rituel destiné à enseigner la retenue. Les visiteurs trouvent le calme déconcertant au début. Puis ils commencent à baisser la voix avant de comprendre pourquoi."
 tv_engineering_department.401.a: "Que l'année tourne."
 tv_engineering_department.410.t: "[tv_wonder_ceremony|E]：Envoyés demandés"
 tv_engineering_department.410.d: "Un tribunal voisin demande que nous envoyions un émissaire pour assister à l'inauguration de son grand axe. L'invitation est cérémoniale, mais les cérémonies sont le lieu où les États s'entraînent à se souvenir. Notre participation placera notre nom parmi ceux qui ont vu le nouveau monument en premier, l'ont applaudi au bon moment et ont compris le message sans avoir besoin d'explications. Refuser sauverait le voyage et perdrait la place dans leur histoire. Certaines pierres sont construites à la maison; d'autres attendent des témoins de l'étranger."
 tv_engineering_department.410.a: "Envoyez l'émissaire."
 tv_engineering_department.410.b: "Refusez l'invitation."
 tv_engineering_department.411.t: "[tv_wonder_ceremony|E]：Un émissaire arrive"
 tv_engineering_department.411.d: "Le tribunal invité a accepté. Un autre émissaire étranger se joint à la procession rituelle avec une dignité répétée, un cortège de voyageurs et des yeux exercés à remarquer à la fois la grandeur et la faiblesse. Le [tv_wonder_ceremony|e] devient plus convaincant avec chaque témoin extérieur, car la gloire est plus forte lorsqu'elle est répétée avec un autre accent. Les maîtres de cortège ajustent l'ordre d'entrée; les scribes ajustent la liste des invités d'honneur. La progression cérémonielle de la merveille avance, un observateur de cour à la fois."
 tv_engineering_department.411.a: "Recevez-les avec honneur."
 tv_engineering_department.412.t: "[tv_wonder_ceremony|E]：Invitation refusée"
 tv_engineering_department.412.d: "La cour invitée a refusé d'envoyer un émissaire. Leur réponse est suffisamment polie pour éviter les insultes et suffisamment froide pour qu'on s'en souvienne. Le [tv_wonder_ceremony|e] doit trouver son public ailleurs, car un monument qui cherche à susciter l'admiration de l'étranger ne peut pas se permettre une place diplomatique vide. Les courtisans suggèrent déjà de nouveaux noms, des itinéraires plus flatteurs et des lettres qui ressemblent moins à des requêtes. La gloire n'aime pas le refus, mais elle peut être redirigée."
 tv_engineering_department.412.a: "Invitez un autre voisin."
 tv_engineering_department.421.t: "[tv_wonder_ceremony|E]：Le défilé du triomphe commence"
 tv_engineering_department.421.d: "Des banderoles sont déployées le long de l'axe, mais le défilé manque encore de preuves. Les tambours peuvent répéter, les chevaux peuvent polir les pierres avec leurs sabots de cérémonie et les officiers peuvent se mettre en confiance, mais rien de tout cela n'est une victoire. Le [tv_wonder_ceremony|e] exige un triomphe que la guerre elle-même doit certifier. En attendant, la Cité militaire est habillée pour un honneur qu'elle n'a pas pleinement mérité. Seule la victoire dans la guerre donnera au monument le souvenir qu'il demande."
 tv_engineering_department.421.a: "Alors la victoire doit venir."
 tv_engineering_department.431.t: "[tv_wonder_ceremony|E]：Le festival civique commence"
 tv_engineering_department.431.d: "La ville ouvre ses places ordonnées à une année de cérémonies, de jeux, de processions et d'instruction publique. Les ateliers sont lents, mais les gens apprennent la forme de la discipline civique en la parcourant, en l'observant et en s'en plaignant jusqu'à ce qu'elle lui semble familière. Le [tv_wonder_ceremony|e] transforme l'espace urbain en une leçon répétée à ciel ouvert. Les enfants mémorisent les itinéraires avant de comprendre les slogans. La capitale civique enseigne l'obéissance en la rendant festive."
 tv_engineering_department.431.a: "Que les citoyens se rassemblent."
 tv_engineering_department.461.t: "[tv_wonder_ceremony|E]：Le festival du libre-échange commence"
 tv_engineering_department.461.d: "Les marchands, les envoyés et les courtiers remplissent le port de promesses d'échange ouvert. Les revenus diminuent pour un temps, car la générosité paraît toujours la plus noble avant la clôture des comptes. Le [tv_wonder_ceremony|e] transforme les quais, les entrepôts et les tables bondées en une scène de confiance étrangère. Chaque contrat signé en public apprend au port à parler une langue que les tribunaux éloignés comprennent. Pendant un an, les profits s'inclinent pour que la réputation passe."
 tv_engineering_department.461.a: "Ouvrez les quais."
 tv_engineering_department.471.t: "[tv_wonder_ceremony|E]：La Fête des Ancêtres Commence"
 tv_engineering_department.471.d: "La nécropole entre dans une année d'encens, de généalogies et de deuil mesuré. Les noms sont récités jusqu'à paraître plus lourds que les corps auxquels ils appartenaient autrefois, et les ateliers ralentissent tandis que la mémoire prend le pas sur la production. Le [tv_wonder_ceremony|e] enseigne au royaume à traiter l'ascendance comme une architecture. Chaque offrande pose une pierre supplémentaire à l'argument selon lequel les vivants sont gouvernés par les morts ordonnés. Le deuil, lorsqu'il est organisé, devient autorité."
 tv_engineering_department.471.a: "Que les ancêtres se rassemblent."
 tv_engineering_department.481.t: "[tv_wonder_ceremony|E]：La guilde des navigateurs commence"
 tv_engineering_department.481.d: "Des pilotes, des cartographes, des maîtres de cordes et des employés du port jalonnent leur guilde sous le phare. Ils arrivent avec des cartes marines, des nœuds, des querelles de préséance et la confiance particulière de ceux qui savent lire les côtes par mauvais temps. Le phare ne sera pas terminé tant que leur institution ne sera pas debout. Une lumière seule avertit les navires; une guilde enseigne à un pays comment comprendre l'avertissement. Le [tv_wonder_ceremony|e] attend désormais la bureaucratie avec du sel dans les cheveux."
 tv_engineering_department.481.a: "Construisez la guilde."
 tv_engineering_department.491.t: "[tv_wonder_ceremony|E]：Le festival de l'eau commence"
 tv_engineering_department.491.d: "Les canaux sont ornés de guirlandes, les écluses bénies et les ateliers apaisés pour une année de rites de l'eau. L'eau est faite pour paraître obéissante, ce que tous ceux qui ont déjà observé un déluge savent que c'est une affirmation théologique audacieuse. La production se plie pour que le complexe puisse revendiquer l'ordre sacré à travers le [tv_wonder_ceremony|e]. Les ingénieurs regardent les prêtres bénir ce qu'ils préfèrent inspecter, et les prêtres regardent les ingénieurs mesurer ce qu'ils préfèrent sanctifier. Entre eux, l'eau continue de circuler."
 tv_engineering_department.491.a: "Laissez les eaux tourner."
 tv_engineering_department.501.t: "[tv_wonder_ceremony|E]：Le drainage en profondeur commence"
 tv_engineering_department.501.d: "Les ingénieurs conduisent les travaux de drainage vers la ville minière. Les puits resteront presque silencieux pendant un an pendant que les pompes, les supports et les canaux conquièrent les profondeurs. Les mineurs détestent le calme presque autant que l'eau, mais ils doivent endurer les deux avant de pouvoir revendiquer une plus grande richesse. Le [tv_wonder_ceremony|e] ici n'est pas doux; c'est un marché avec l'obscurité, l'humidité et la patience. Quand les œuvres respireront enfin, la ville saura jusqu'où elle peut atteindre la peur."
 tv_engineering_department.501.a: "Drainez l'obscurité."
 tv_engineering_department.511.t: "[tv_wonder_ceremony|E]：Le catalogue des étoiles commence"
 tv_engineering_department.511.d: "L'observatoire s'enferme autour des lampes, des tables et de l'insomnie disciplinée. Les astronomes marquent une étoile après l'autre, non pas comme des lumières dispersées, mais comme des entrées dans un ordre public que les futurs chercheurs pourront tester. La législation ralentit tandis que le tribunal prête attention au ciel et aux instruments. Le [tv_wonder_ceremony|e] ne se terminera pas en spectacle aujourd'hui; cela prendra fin lorsque les cieux auront été copiés avec suffisamment de patience pour devenir utiles."
 tv_engineering_department.511.a: "Laissez-les compter le ciel."
 tv_engineering_department.521.t: "[tv_wonder_ceremony|E]：La proclamation de l'éclipse commence"
 tv_engineering_department.521.d: "L'observatoire a publié sa prédiction: une éclipse viendra, et la cour sera prête à la nommer avant que la peur puisse la nommer en premier. Prêtres, érudits, marins et sceptiques regardent tous désormais vers le haut avec des espoirs différents. Chaque mois qui passe teste la réclamation. Si le ciel obéit aux tables, le [tv_wonder_ceremony|e] deviendra la preuve que le royaume peut lire le ciel sans s'y abandonner."
 tv_engineering_department.521.a: "Observez le ciel."
 tv_engineering_department.522.t: "[tv_wonder_ceremony|E]：L'éclipse arrive"
 tv_engineering_department.522.d: "La lumière change exactement là où l'observatoire l'a dit. Les foules se taisent, mais le silence n'est pas la panique; les crieurs leur ont déjà dit ce que prédisaient les savantes tables. Le [tv_wonder_ceremony|e] devient une certitude publique dans l'espace entre le soleil, l'ombre et le souffle. Lorsque la lumière revient, le tribunal ne se contente pas de revendiquer la sagesse. Il a lui-même fait preuve de timing, de courage et de maîtrise de l'émerveillement."
 tv_engineering_department.522.a: "Que le royaume se souvienne de la prédiction."
 tv_engineering_department.531.t: "[tv_wonder_ceremony|E]：Hommage reçu"
 tv_engineering_department.531.d: "Une autre contribution thématique entre au Palais des Nations. Il est exposé avec un soin raffiné: pas seulement la richesse, mais un argument sur le rang rendu visible à chaque envoyé qui traverse la salle. La galerie d'hommage devient de plus en plus convaincante à chaque offre car la subordination, comme la gloire, devient plus facile à croire lorsqu'elle a de l'architecture. La cérémonie avance un acte d'obéissance mesuré à la fois."
 tv_engineering_department.531.a: "Enregistrez l'hommage."
 tv_engineering_department.541.t: "[tv_wonder_ceremony|E]：Le quartier de l'ambassade commence"
 tv_engineering_department.541.d: "Les fondations sont marquées pour le quartier de l'ambassade à côté du Palais des Nations. Les maisons étrangères gagneront des portes, des cours, des passages pour les domestiques et toutes les petites dignités pratiques qui font de la diplomatie une présence quotidienne plutôt qu'une visite occasionnelle. Le [tv_wonder_ceremony|e] attend désormais un quartier construit pour que d'autres tribunaux puissent l'habiter. Un palais peut attirer l'attention; un quartier d'ambassade enseigne à l'attention de rester."
 tv_engineering_department.541.a: "Construire des lieux pour les regards étrangers."
 tv_engineering_department.500.t: "[tv_wonder_ceremony|E]：Le projet est inauguré"
 tv_engineering_department.500.d: "Le [tv_engineering_department|E] a complété le [tv_wonder_ceremony|e], et le monument constitue désormais un signe permanent de l'ambition du royaume. Les échafaudages ont disparu, les registres sont scellés et le public a commencé le travail qu'aucun ingénieur ne peut terminer: décider de ce que signifie la merveille. Certains diront que c'est de la gloire, d'autres de l'excès, d'autres encore une preuve que les temps ont changé. Ils devront tous y jeter un coup d'oeil. C'est déjà une forme de victoire."
 tv_engineering_department.500.a: "Que l'époque s'en souvienne."
 tv_engineering_department.600.t: "[tv_wonder_construction|E]：Une merveille du monde est achevée"
 tv_engineering_department.600.d: "Des nouvelles arrivent de [SCOPE.sCountry('tv_wonder_builder_country').GetName]: une merveille du monde a été accomplie à [SCOPE.sLocation('tv_wonder_completed_site').GetName]. Les rapports diffèrent sur ses dépenses, sa beauté, son objectif et sa sagesse, mais ils s'accordent sur un point. Le travail est trop vaste pour rester local. Il est entré dans la conversation commune des dirigeants."
 tv_engineering_department.600.a: "Le monde a entendu."

