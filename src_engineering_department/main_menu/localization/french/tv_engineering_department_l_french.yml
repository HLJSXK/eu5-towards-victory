 TV_ENGINEERING_CONSTRUCTION_HELP_TEXT_1: "$BULLET$ [tv_wonder_construction|e] fait avancer quatre [tv_wonder_construction_part|e] à la fois: Fondation, Structure principale, Fonction et Couronnement. Utilisez les boutons ci-dessus pour changer la partie actuellement en construction."
 TV_ENGINEERING_CONSTRUCTION_HELP_TEXT_2: "$BULLET$ Le niveau du [tv_wonder_construction|e] dépend de la partie la plus en retard; le niveau total n'augmente que lorsque cette partie en retard termine une nouvelle unité."
 TV_ENGINEERING_CONSTRUCTION_HELP_TEXT_3: "$BULLET$ Vous pouvez déclarer le [tv_wonder_construction|e] terminé une fois qu'il a terminé au moins un niveau."
 TV_ENGINEERING_CONSTRUCTION_HELP_TEXT_4: "$BULLET$ Vous pouvez donc d'abord terminer un projet à plus petite échelle et poursuivre un [tv_wonder_expansion|e] à plus grande échelle plus tard sans perdre déjà les récompenses d'achèvement. gagné."
 TV_ENGINEERING_CONSTRUCTION_HELP_TEXT_5: "$BULLET$ Compléter toute subvention d'unité de construction [tv_wonder_domestic_support|e]; si cette unité augmente également le niveau total du Grand Projet, elle accorde un autre bonus [tv_wonder_domestic_support|e]."
 TV_ENGINEERING_CONSTRUCTION_HELP_TT: "#T Construction#!\n [tv_wonder_construction|e] fait avancer quatre [tv_wonder_construction_part|e] à la fois: Fondation, Structure principale, Fonction et Couronnement. Utilisez les boutons ci-dessus pour changer la partie actuellement en construction.\nLe niveau du [tv_wonder_construction|e] dépend de la partie la plus en retard; le niveau total n'augmente que lorsque cette partie en retard termine une nouvelle unité.\nVous pouvez déclarer le [tv_wonder_construction|e] terminé une fois qu'il a terminé au moins un niveau.\nVous pouvez donc d'abord terminer un projet à plus petite échelle et l'étendre à une plus grande échelle plus tard sans perdre les récompenses d'achèvement déjà gagnées.\nL'achèvement de toute unité de construction accorde [tv_wonder_domestic_support|e]; si cette unité augmente également le niveau total du Grand Projet, elle accorde un autre bonus [tv_wonder_domestic_support|e]."
