 tv_engineering_department.551.t: "[tv_wonder_ceremony|E]：Les érudits se rassemblent"
 tv_engineering_department.551.d: "La ville universitaire baisse la voix dans les études. Maîtres, étudiants, copistes et fonctionnaires se rassemblent autour de listes de conférences et de lectures contestées, transformant les rues achevées en une convocation d'un an. Le [tv_wonder_ceremony|e] ne sera pas précipité. Il demande au royaume d'échanger la rapidité administrative contre un programme qui peut survivre au tribunal actuel."
 tv_engineering_department.551.a: "Laissez les universitaires prendre leur année."
 tv_engineering_department.552.t: "[tv_wonder_ceremony|E]：La salle collégiale commence"
 tv_engineering_department.552.d: "Les plans de la salle collégiale sont scellés à côté de la ville universitaire. La nouvelle salle offrira aux maîtres un lieu où se disputer formellement, aux étudiants un lieu où ils pourront devenir moins sûrs de choses utiles, et à la couronne une structure à travers laquelle l'apprentissage pourra être reconnu sans être totalement apprivoisé. Le [tv_wonder_ceremony|e] attend désormais des portes, des bancs, des statuts et un toit sous lequel l'étude peut revendiquer la permanence."
 tv_engineering_department.552.a: "Construisez une maison pour l'argumentation."
 tv_engineering_department.561.t: "[tv_wonder_ceremony|E]：Le Dôme est voilé"
 tv_engineering_department.561.d: "Le grand dôme est voilé pour la consécration. Les prêtres marquent les seuils, les chanteurs répètent l'ordre mesuré de la révérence et la cour accepte une année au cours de laquelle la légitimité doit évoluer plus lentement afin que le caractère sacré puisse évoluer avec précaution. Le [tv_wonder_ceremony|e] demande au royaume d'attendre sous un ciel couvert jusqu'à ce que le temple soit prêt à ouvrir ses cieux."
 tv_engineering_department.561.a: "Que le dôme soit sanctifié."
 tv_engineering_department.571.t: "[tv_wonder_ceremony|E]：L'escalier des pèlerins s'ouvre"
 tv_engineering_department.571.d: "L'escalier du temple-tour est offert aux pèlerins pour une année d'ascension, de pause, de chant et de douleurs aux pieds. Les ateliers se plaignent du fait que les ouvriers se penchent vers les processions, mais le [tv_wonder_ceremony|e] est destiné à enseigner la hauteur par l'effort. Chaque étape transforme la tour d'un objet en un itinéraire, et chaque itinéraire rend la dévotion visible."
 tv_engineering_department.571.a: "Laissez-les grimper."
 tv_engineering_department.572.t: "[tv_wonder_ceremony|E]：L'école du temple commence"
 tv_engineering_department.572.d: "Les enseignants, les employés et les constructeurs marquent les fondations d'une école du temple sous la tour. Le [tv_wonder_ceremony|e] attend désormais les salles de classe où la doctrine peut devenir une habitude, une alphabétisation et un argument discipliné par un rituel. Une tour peut attirer les regards vers le haut; une école apprendra aux voix ce qu'elles doivent dire lorsqu'elles regardent."
 tv_engineering_department.572.a: "Construisez l'école."
 tv_engineering_department.581.t: "[tv_wonder_ceremony|E]：La foire fluviale commence"
 tv_engineering_department.581.d: "Des stands, des barges, des tables de péage et des bannières de festival se rassemblent le long de la rivière élargie. Le commerce ralentit à mesure que l'on demande au fleuve de devenir un spectacle avant de redevenir une artère. Le [tv_wonder_ceremony|e] passera un an à obliger les marchands, les bateliers et les fonctionnaires à exécuter ensemble le nouvel ordre de l'eau."
 tv_engineering_department.581.a: "Laissez la rivière apprendre sa nouvelle foule."
 tv_engineering_department.582.t: "[tv_wonder_ceremony|E]：Le bureau du canal commence"
 tv_engineering_department.582.d: "Les géomètres marquent un bureau permanent pour l'autorité du canal. Le bâtiment ne sera pas assez grand pour rivaliser avec les ouvrages fluviaux, et c'est précisément pour cela que c'est important: les écluses, les litiges, les péages, les réparations et les plaintes liées à la saison sèche ont besoin d'un endroit où la responsabilité ne peut se cacher. Le [tv_wonder_ceremony|e] attend maintenant que l'administration acquière des murs."
 tv_engineering_department.582.a: "Donnez un bureau à la rivière."
 tv_engineering_department.591.t: "[tv_wonder_ceremony|E]：Le bureau de l'Amirauté commence"
 tv_engineering_department.591.d: "Le chantier naval réserve un terrain pour un bureau d'amirauté. Les rampes de lancement et les grues peuvent construire des navires, mais les flottes ont également besoin d'ordres, de cartes, d'inspections et de fonctionnaires ayant la patience de faire du bois une politique. Le [tv_wonder_ceremony|e] attend maintenant que le chantier acquière un esprit naval."
 tv_engineering_department.591.a: "Construisez le bureau."
 tv_engineering_department.601.t: "[tv_wonder_ceremony|E]：Bastions à l'épreuve"
 tv_engineering_department.601.d: "La Star Fortress City entame une année d'essais. Les ingénieurs testent les angles, les artilleurs testent les champs de tir et les ouvriers découvrent qu'un mur conçu pour les mathématiques doit encore être payé par les muscles. La production ralentit à mesure que [tv_wonder_ceremony|e] apprend à la forteresse à répondre à la théorie avec de la pierre."
 tv_engineering_department.601.a: "Testez tous les angles."
 tv_engineering_department.602.t: "[tv_wonder_ceremony|E]：Le quartier de l'Arsenal commence"
 tv_engineering_department.602.d: "Les fondations sont marquées pour un quartier d'arsenal à l'intérieur de la ville forteresse. Il regroupera les ateliers de réparation, les magasins de poudre et les gares de rassemblement en un seul district discipliné. Le [tv_wonder_ceremony|e] attend désormais la partie de la forteresse qui rend la défense reproductible après la disparition de la première alarme."
 tv_engineering_department.602.a: "Construisez le quartier de l'arsenal."
 tv_engineering_department.611.t: "[tv_wonder_ceremony|E]：Les feux de signalisation sont allumés"
 tv_engineering_department.611.d: "Les postes de surveillance le long du mur commencent une année de pratique des signaux. La fumée, les flammes, les voyageurs et les marchés locaux s'adaptent tous au nouveau rythme, et le commerce en souffre pendant que chaque itinéraire apprend à remarquer les avertissements en premier. Le [tv_wonder_ceremony|e] rend la vigilance suffisamment publique pour que même les déplacements de routine semblent observés."
 tv_engineering_department.611.a: "Gardez la montre lumineuse."
 tv_engineering_department.621.t: "[tv_wonder_ceremony|E]：Début de la salle des maîtres armuriers"
 tv_engineering_department.621.d: "L'armurerie marque les fondations d'une salle des maîtres armuriers. Les plus grands magasins d'armes ne peuvent pas dépendre uniquement du fer et des livres de comptes; ils ont besoin de mains compétentes, capables de juger les échecs avant le début de la bataille. Le [tv_wonder_ceremony|e] attend maintenant que l'artisanat acquière une cour permanente."
 tv_engineering_department.621.a: "Construit pour les maîtres."
 tv_engineering_department.631.t: "[tv_wonder_ceremony|E]：Le catalogue national commence"
 tv_engineering_department.631.d: "La Bibliothèque nationale commence son catalogue. Les érudits ferment les portes, déroulent les inventaires et ralentissent la machine législative du pays tout en apprenant à la mémoire à se retrouver. Le [tv_wonder_ceremony|e] n'est pas un défilé mais un index: silencieux, exigeant et puissant une fois terminé."
 tv_engineering_department.631.a: "Laissez le catalogue s'agrandir."
 tv_engineering_department.632.t: "[tv_wonder_ceremony|E]：Le bureau du dépôt légal commence"
 tv_engineering_department.632.d: "Les constructeurs marquent le bureau du dépôt légal à côté de la bibliothèque. De là, livres, décrets, copies et arguments seront rassemblés non comme des faveurs mais comme des obligations. Le [tv_wonder_ceremony|e] attend maintenant la pièce où la mémoire écrite du royaume s'arrêtera en cas d'accident."
 tv_engineering_department.632.a: "Construisez le bureau de la mémoire."

