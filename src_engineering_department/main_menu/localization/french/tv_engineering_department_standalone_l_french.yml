 tv_engineering_department_standalone.1.t: "[tv_wonder_construction|E]：Le Département Ingénierie"
 tv_engineering_department_standalone.1.d: "Votre pays dispose désormais d'un département d'ingénierie, l'institution derrière chaque grand projet qu'il peut entreprendre.\n\nNommez un Grand ingénieur pour commencer. Ils développent d'abord un #high Conception#! pour un projet réalisable, que votre tribunal évalue ensuite au niveau national #high Débat#! . Un #high Enquête#! confirme le site choisi, puis #high Construction#! commence lui-même, élevant le projet en quatre parties jusqu'à son niveau final. L'achèvement est marqué par un #high Cérémonie#! qui accorde une récompense durable.\n\nOuvrez le panneau du département d'ingénierie à tout moment pour vérifier les progrès ou nommer un Grand ingénieur."
 tv_engineering_department_standalone.1.a: "Compris."
 tv_engineering_department_standalone.1.a.tt: "Crée le #G Département d'ingénierie#! ."
