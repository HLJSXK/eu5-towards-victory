 tv_engineering_department.7000.t:0 "Construction：Les rues applaudissent le site"
 tv_engineering_department.7000.d:0 "Quelques succès visibles à la clôture transforment la curiosité en fierté. Les anciens de la guilde prêtent des noms, les voisins cessent de traiter les travaux comme une vanité royale et le projet obtient une revendication plus nette sur [tv_wonder_domestic_support|E]."
 tv_engineering_department.7000.a:0 "Laisse la nouvelle bonne volonté des anciens de la guilde faire avancer le travail."
 tv_engineering_department.7001.t:0 "Construction: une ligne plus large sur la Terre"
 tv_engineering_department.7001.d:0 "De nouvelles mesures révèlent un terrain qui peut supporter une empreinte plus large. Ce qui ressemblait à de l'ambition sur parchemin a maintenant une base tolérable, et [tv_wonder_scale_competence|E] fait un bond en avant."
 tv_engineering_department.7001.a:0 "revendique le terrain plus large que l'enquête vient de prouver."
 tv_engineering_department.7002.t:0 "Construction: les noms et les ordres se mettent en place"
 tv_engineering_department.7002.d:0 "Le chantier se réveille sous de nouvelles listes. Les équipes savent où se situer, les commis savent quel décompte est important, et [tv_wonder_organization_competence|E] augmente parce que la confusion a moins d'endroits où se cacher."
 tv_engineering_department.7002.a:0 "Nous verrouillons les nouvelles listes avant que la confusion ne revienne."
 tv_engineering_department.7003.t:0 "Construction: les routes et les chariots trouvent leur rythme"
 tv_engineering_department.7003.d:0 "Un meilleur itinéraire relie la route, l'eau, le magasin et l'échafaudage. Le premier convoi à l'utiliser arrive presque à l'heure dans l'embarras, et [tv_wonder_logistics_competence|E] déferle."
 tv_engineering_department.7003.a:0 "Faites rouler ces chariots à l'heure!"
 tv_engineering_department.7004.t:0 "Construction: la pierre dépasse la marque"
 tv_engineering_department.7004.d:0 "La partie active dépasse sa marque avant que la lumière ne tombe en panne. Aucun miracle ne l'explique; les ascenseurs, les articulations et les mains se rencontrent simplement à la bonne heure, poussant [tv_wonder_construction|E] les progrès."
 tv_engineering_department.7004.a:0 "Laisse les ascenseurs continuer au-delà de la marque."
 tv_engineering_department.7005.t:0 "Construction：Street Talk Turns"
 tv_engineering_department.7005.d:0 "Le bruit autour du site s'adoucit. Ce n'est pas un acclamation, mais c'est une permission suffisante pour que les charrettes passent et que les disputes se terminent plus tôt; [tv_wonder_domestic_support|E] s'élève d'une marge utile."
 tv_engineering_department.7005.a:0 "Laisse passer les charrettes et les disputes s'éteignent."
 tv_engineering_department.7006.t:0 "Construction：La mesure est corrigée"
 tv_engineering_department.7006.d:0 "Un angle exigu est redessiné, une voie de service élargie et la ligne principale du monument respire à nouveau. L'amélioration apportée à [tv_wonder_scale_competence|E] est petite mais réelle."
 tv_engineering_department.7006.a:0 "Élargit le chemin et laisse le design respirer."
 tv_engineering_department.7007.t:0 "Construction: le chantier apprend son rythme"
 tv_engineering_department.7007.d:0 "Un ensemble de transferts manquants est réparé. Le travail est trop sec pour une cérémonie, mais il maintient les outils en mouvement et s'améliore [tv_wonder_organization_competence|E]."
 tv_engineering_department.7007.a:0 "Nous corrigeons la passation de pouvoir et maintenons les outils en mouvement."
 tv_engineering_department.7008.t:0 "Construction：Les ornières trouvent une meilleure route"
 tv_engineering_department.7008.d:0 "Un mauvais virage dans la ligne d'alimentation est corrigé. Moins de chariots attendent vides, moins de chargements arrivent fissurés et [tv_wonder_logistics_competence|E] s'améliore."
 tv_engineering_department.7008.a:0 "Redresse le mauvais virage avant que d'autres charges ne se fissurent."
 tv_engineering_department.7009.t:0 "Construction: les marteaux sont presque terminés"
 tv_engineering_department.7009.d:0 "Un joint tenace s'adapte enfin, et la prochaine équipe peut commencer sans attendre encore un mois. [tv_wonder_construction|E] les progrès avancent de la manière la plus satisfaisante: visiblement."
 tv_engineering_department.7009.a:0 "Enfin, ça rentre!"
 tv_engineering_department.7010.t:0 "Construction：L'argent du pain à la porte"
 tv_engineering_department.7010.d:0 "Une foule se rassemble à la porte, marmonnant que le prodige mange du pain destiné aux pauvres. Si le trésor ouvre son [gold|E] à la vue de la rue et paie maintenant, les grognements s'apaiseraient et [tv_wonder_domestic_support|E] augmenterait - mais la pièce ne reviendrait pas."
 tv_engineering_department.7010.a:0 "Payez-le à la vue de la foule."
 tv_engineering_department.7010.b:0 "Les comptes sont suffisamment minces sans l'aide du public."
 tv_engineering_department.7011.t:0 "Construction：Un prédicateur remet en question le droit de la Couronne"
 tv_engineering_department.7011.d:0 "Un prédicateur local dit à ses fidèles que la merveille repose sur la fierté et non sur le droit de la couronne de l'exiger. Mettre le royal [legitimacy|E] derrière un décret écrit réglerait la question et stabiliserait [tv_wonder_domestic_support|E], avant que le sermon ne se propage davantage."
 tv_engineering_department.7011.a:0 "Scellez le décret et laissez la parole de la couronne clore l'affaire."
 tv_engineering_department.7011.b:0 "Un décret royal suite aux grognements d'un prédicateur ressemble à de la faiblesse, pas à de la force."
 tv_engineering_department.7012.t:0 "Construction：La route de la carrière divise un champ commun"
 tv_engineering_department.7012.d:0 "La nouvelle route de la carrière traverse les champs communs de deux villages. Dépenser [stability|E] pour forcer la réinstallation permettrait de dégager la route et d'élever [tv_wonder_domestic_support|E] parmi ceux qui veulent que cette merveille soit terminée - au prix de la paix achetée avec ces villages."
 tv_engineering_department.7012.a:0 "Ordonnez la réinstallation et laissez passer la route."
 tv_engineering_department.7012.b:0 "Les champs de deux villages ne valent pas un trajet en charrette plus court."
 tv_engineering_department.7013.t:0 "Construction：Les envoyés étrangers se moquent du projet Vanity"
 tv_engineering_department.7013.d:0 "Les envoyés d'une cour rivale qualifient cette merveille de projet vaniteux trop important pour le trésor qui se cache derrière. Dépenser [prestige|E] pour une réception somptueuse pourrait changer l'histoire qu'ils rapportent à la maison et augmenter [tv_wonder_domestic_support|E] - mais la position de la couronne, une fois dépensée pour flatter les invités, n'est pas facile à reconstituer."
 tv_engineering_department.7013.a:0 "Dépensez pour la réception et changez ce que les envoyés rapportent à la maison."
 tv_engineering_department.7013.b:0 "Les commérages étrangers ne valent pas la peine de dépenser la position de la couronne."
 tv_engineering_department.7014.t:0 "Construction: le parcours de chasse d'un noble devient un parc à bois"
 tv_engineering_department.7014.d:0 "Les maçons de la merveille veulent une partie du parcours de chasse d'un noble pour y mettre en scène leur bois. Il l'accordera, mais seulement pour une faveur que la couronne doit compter contre [estate_satisfaction|E] parmi les nobles - dépensée maintenant, elle soulèverait encore [tv_wonder_domestic_support|E] une fois que le bois commencerait à bouger."
 tv_engineering_department.7014.a:0 "Accordez la faveur et prenez le bois."
 tv_engineering_department.7014.b:0 "La bonne volonté d'un noble ne vaut pas la peine de lui devoir une dette."
 tv_engineering_department.7015.t:0 "Construction：La cloche paroissiale est demandée pour son bronze"
 tv_engineering_department.7015.d:0 "Les fondateurs de la merveille souhaitent réquisitionner la cloche paroissiale pour la refondre en aménagement. Le prêtre détournera le regard d'un clocher vide, mais cela coûte [estate_satisfaction|E] parmi le clergé - un prix qui laisserait quand même [tv_wonder_domestic_support|E] dans une meilleure situation qu'un échafaud inachevé."
 tv_engineering_department.7015.a:0 "Demandez correctement et laissez la cloche aller à la fonderie."
 tv_engineering_department.7015.b:0 "Un clocher vide fera plus de bruit que les accessoires n'en valent la peine."
 tv_engineering_department.7016.t:0 "Construction: les chariots de ravitaillement étouffent la place du marché"
 tv_engineering_department.7016.d:0 "Les chariots de ravitaillement de la merveille bloquent la place du marché les jours de livraison. Les maîtres de guilde réorienteront leurs propres étals autour des charrettes, mais cela attire l'attention. [estate_satisfaction|E] parmi les bourgeois - un coût qui rachèterait encore une partie [tv_wonder_domestic_support|E] une fois que la place cessera de combattre les charrettes."
 tv_engineering_department.7016.a:0 "Demandez directement aux guildes et laissez passer les charrettes."
 tv_engineering_department.7016.b:0 "Infliger une amende aux charretiers est plus simple que de demander aux guildes une amende pour les charrettes. faveurs."
 tv_engineering_department.7017.t:0 "Construction：La corvée a lieu après la récolte"
 tv_engineering_department.7017.d:0 "Le surveillant veut que les bandes de la corvée tenues après la récolte terminent les fondations avant le gel. Les anciens du village seront d'accord, mais cela coûte [estate_satisfaction|E] aux paysans - dépensé maintenant, cela laisserait encore [tv_wonder_domestic_support|E] plus haut qu'une fondation laissée à moitié creusée pendant l'hiver."
 tv_engineering_department.7017.a:0 "Dites-le clairement et tenez les bandes au-delà de la récolte."
 tv_engineering_department.7017.b:0 "La récolte ne peut pas attendre sur les fondations."
 tv_engineering_department.7018.t:0 "Construction：Une rangée d'immeubles se dresse dans le Voie"
 tv_engineering_department.7018.d:0 "Les maçons disent que le site est trop exigu pour surélever le niveau suivant sans raser la rangée d'immeubles à côté. L'ordonner d'emblée réduirait [development|E] le site au fur et à mesure que les bâtiments se défont, mais permettrait aux travaux - et [tv_wonder_domestic_support|E] avec eux - d'avancer à nouveau."
 tv_engineering_department.7018.a:0 "Ordonner la rasage de la rangée et élargir le site."
 tv_engineering_department.7018.b:0 "Un site exigu est plus facile à vivre qu'une rue de locataires expulsés."
 tv_engineering_department.7019.t:0 "Construction：Ordinary Trade Bends au Site"
 tv_engineering_department.7019.d:0 "Les charretiers et tailleurs de pierre locaux ont été retirés de leur métier habituel pour assurer l'approvisionnement du site. Laisser cela continuer saignerait [prosperity|E] sur le site à mesure que les affaires ordinaires s'amenuisent - mais les livraisons plus régulières seraient toujours considérées comme [tv_wonder_domestic_support|E] valables."
 tv_engineering_department.7019.a:0 "Laissons le commerce local continuer à se pencher sur les travaux."
 tv_engineering_department.7019.b:0 "La ville a plus besoin de son commerce ordinaire que le site n'a besoin de livraisons plus rapides."
 tv_engineering_department.7020.t:0 "Construction：Le pont de la capitale attend son Maçons"
 tv_engineering_department.7020.d:0 "Les réparations des ponts de la capitale sont au point mort parce que leurs maçons ont été attirés vers la merveille. Les garder là coûterait [development|E] dans la capitale puisque le pont reste inachevé, mais cela permettrait de maintenir la progression de la merveille - et [tv_wonder_domestic_support|E] - en mouvement."
 tv_engineering_department.7020.a:0 "Gardez les maçons sur la merveille et laissez le pont attendre."
 tv_engineering_department.7020.b:0 "Le propre pont de la capitale ne peut pas attendre selon le calendrier de la merveille."
 tv_engineering_department.7021.t:0 "Construction：Les agents rachètent le Bois de la capitale"
 tv_engineering_department.7021.d:0 "Les agents de la merveille achètent du bois et de la pierre à des prix que le marché ordinaire ne peut égaler. Laisser les achats continuer drainerait [prosperity|E] dans la capitale à mesure que les échanges commerciaux s'amenuisent autour du site, mais cela permettrait de maintenir les travaux approvisionnés et [tv_wonder_domestic_support|E] avec eux."
 tv_engineering_department.7021.a:0 "Laissez les achats se poursuivre et alimenter le site."
 tv_engineering_department.7021.b:0 "Les propres marchés de la capitale ne devraient pas être saignés à blanc pour un seul projet."
 tv_engineering_department.7022.t:0 "Construction: une équipe de nuit doublée est proposée"
 tv_engineering_department.7022.d:0 "Le surveillant souhaite que l'équipe de nuit soit doublée pour rattraper les jours perdus à cause du dernier gel. L'ordonner épuiserait le personnel [population|E] sur le chantier à mesure que les heures supplémentaires font des ravages, mais cela ferait avancer le travail et soulèverait [tv_wonder_domestic_support|E] avec lui."
 tv_engineering_department.7022.a:0 "Doublerait les équipes et ferait avancer le travail."
 tv_engineering_department.7022.b:0 "Les ouvriers épuisés construisent plus lentement que ceux qui se sont reposés."
 tv_engineering_department.7023.t:0 "Construction: une assise plus large sur le trésorier Bureau"
 tv_engineering_department.7023.d:0 "Le chef maçon pose un plan de fondation plus large sur le bureau du trésorier, affirmant que le sol le supportera si des cours supplémentaires sont effectués avant les pluies d'automne. Le trésorier peut libérer l'or pour la pierre et les mains ajoutées maintenant, ou le plan attend l'enquête de l'année prochaine."
 tv_engineering_department.7023.a:0 "Libérez l'or et laissez les maçons poser les bases plus larges avant les pluies."
 tv_engineering_department.7023.b:0 "Retenez la pièce; les pluies seront encore là au printemps prochain."
 tv_engineering_department.7024.t:0 "Construction：Les piquets d'arpentage s'arrêtent à une clôture"
 tv_engineering_department.7024.d:0 "Les piquets de l'arpenteur s'arrêtent près de la clôture d'un voisin, et celui-ci refuse de les laisser passer. Un bref royal fixerait la limite aujourd'hui, mais invoquer le nom de la couronne sur une haie contestée ne passera pas inaperçu."
 tv_engineering_department.7024.a:0 "Envoyez le bref et inscrivez le nom de la couronne derrière la limite plus large."
 tv_engineering_department.7024.b:0 "Laissez la clôture debout; le nom de la couronne n'est pas dépensé pour un litige de haie."
 tv_engineering_department.7025.t:0 "Construction：Le plan plus large traverse la commune"
 tv_engineering_department.7025.d:0 "Le plan plus large traverse directement la commune de pâturage d'un hameau. Déplacer les bornes à travers le village maintenant réglerait la question de l'enquête, mais les ménages n'oublieront pas qui les a déplacées."
 tv_engineering_department.7025.a:0 "Déplacez les bornes et laissez l'enquête s'installer sur la plus grande superficie."
 tv_engineering_department.7025.b:0 "Laissez le commun tel quel; un village plein de ressentiment ne vaut pas une base plus large."
 tv_engineering_department.7026.t:0 "Construction：Prix d'un maçon étranger pour son sceau"
 tv_engineering_department.7026.d:0 "Un maître maçon étranger propose de certifier la conception plus large, mais seulement si le nom de la cour est proposé comme son patron dans les archives de sa propre guilde dans son pays. L'approbation réglerait ici la question du dimensionnement; la demande est publique et ne peut être dépensée."
 tv_engineering_department.7026.a:0 "Accordez l'approbation et prenez la parole du maître sur une empreinte plus large."
 tv_engineering_department.7026.b:0 "Retenez le nom du tribunal; le registre d'une guilde étrangère n'est pas l'endroit idéal pour le dépenser."
 tv_engineering_department.7027.t:0 "Construction：Le plan de base traverse la chasse du baron"
 tv_engineering_department.7027.d:0 "Le plan de base plus large traverse le terrain qu'un baron local a longtemps utilisé pour sa chasse. Lui demander de tenir sa langue pendant que les géomètres terminent prouverait que le son est à plus grande échelle, mais la noble patience dépensée ici est une patience qu'il s'attend à recevoir en retour."
 tv_engineering_department.7027.a:0 "Demandez la patience du baron et laissez les géomètres terminer à travers son terrain de chasse."
 tv_engineering_department.7027.b:0 "Route autour du terrain du baron; sa bonne volonté ne vaut pas la peine d'être dépensée pour une ligne d'arpentage."
 tv_engineering_department.7028.t:0 "Construction：Le plan veut un coin de terre sainte"
 tv_engineering_department.7028.d:0 "Le plan plus large appelle à un coin de terre consacrée que la paroisse détient depuis avant la mémoire vivante. Les prêtres autoriseraient une enquête à travers ce coin si cela était demandé correctement, mais demander au clergé de céder un terrain sacré pour une ligne d'échafaudage est une faveur dépensée et non prêtée."
 tv_engineering_department.7028.a:0 "Demandez aux prêtres de céder le coin et de confirmer l'enquête plus large."
 tv_engineering_department.7028.b:0 "Gardez l'enquête à l'intérieur de l'ancienne limite; le terrain consacré n'est pas l'endroit à tester."
 tv_engineering_department.7029.t:0 "Construction：L'allée des marchands de laine est recherchée"
 tv_engineering_department.7029.d:0 "L'empreinte plus large engloutirait l'allée que les marchands de laine utilisent les jours de marché. Les échevins de la guilde accorderaient un détour si on le leur demandait, mais les bourgeois qui prêtent leurs rues à un chantier se souviennent des inconvénients plus longtemps que l'enquête."
 tv_engineering_department.7029.a:0 "Demandez aux échevins le détour et confirmez l'empreinte plus large sur la ruelle."
 tv_engineering_department.7029.b:0 "Laissez tranquille la ruelle des commerçants; la bonne volonté du marché n'est pas dépensée pour une ligne d'échafaudage."
 tv_engineering_department.7030.t:0 "Construction：On demande au village de creuser"
 tv_engineering_department.7030.d:0 "Le contremaître dit que la base plus large peut être prouvée solide en une semaine, si le village voisin met la main à la pâte pour creuser au lieu de s'occuper de ses propres champs. Le village répondrait au préfet, mais un prélèvement demandé à la saison des semis n'est pas oublié à l'automne."
 tv_engineering_department.7030.a:0 "Appelez le prélèvement villageois et creusez la semelle plus large avant la fin de la semaine."
 tv_engineering_department.7030.b:0 "Que le village s'en tienne à ses champs; le contremaître peut attendre des ouvriers embauchés à la place."
 tv_engineering_department.7031.t:0 "Construction：Une rangée d'ateliers se trouve dans l'empreinte"
 tv_engineering_department.7031.d:0 "La seule façon de quadriller l'empreinte plus large est de démolir une rangée d'ateliers déjà debout en bordure du site. Leur pierre et leurs fondations iraient directement dans le nouveau plan, mais démolir ce que le site a déjà construit n'est pas une chose défaite."
 tv_engineering_department.7031.a:0 "Abaissez la rangée et pliez sa pierre dans l'empreinte plus large."
 tv_engineering_department.7031.b:0 "Laissez les ateliers debout; le site peut se développer dans une autre direction."
 tv_engineering_department.7032.t:0 "Construction：Les marchands de bois sont invités à choisir un acheteur"
 tv_engineering_department.7032.d:0 "Les marchands de bois sur le site ont aujourd'hui le stock et les wagons pour transporter le remblai pour la base plus large, si leur commerce ordinaire est plutôt réservé au contrat de la couronne. Les marchés du site répondraient aux travaux, mais une route commerciale orientée vers un acheteur ne se rétablirait pas d'elle-même."
 tv_engineering_department.7032.a:0 "Alimentez le commerce local aux travaux et transportez le remblai pour une empreinte plus large."
 tv_engineering_department.7032.b:0 "Laissez les marchands à leur commerce ordinaire; le remblai peut provenir d'une autre manière."
 tv_engineering_department.7033.t:0 "Construction：Les cantonniers de la capitale sont recherchés ailleurs"
 tv_engineering_department.7033.d:0 "Les cantonniers et les constructeurs de halls de la capitale sont les seules équipes libres de mener l'enquête de confirmation ce mois-ci. Les retirer des réparations de la capitale réglerait la question de l'empreinte plus large, mais les rues de la capitale montreront le vide qu'elles ont laissé."
 tv_engineering_department.7033.a:0 "Réaffectez les équipes de la capitale et laissez-les confirmer l'empreinte plus large."
 tv_engineering_department.7033.b:0 "Laissez les réparations de la capitale tranquilles; l'enquête peut attendre des mains inactives ailleurs."
 tv_engineering_department.7034.t:0 "Construction：Les corporations offrent les recettes de cette saison"
 tv_engineering_department.7034.d:0 "Les corporations de la capitale proposent de financer l'enquête de confirmation sur les recettes commerciales de cette saison, à condition que la pièce soit tirée avant la clôture des foires d'hiver. Les marchés de la capitale prouveraient que l'empreinte plus large est solide, mais les recettes d'une saison tournées vers une merveille sont une saison pour laquelle les halls de guilde voudront répondre."
 tv_engineering_department.7034.a:0 "Exploitez les recettes commerciales de la capitale et confirmez l'empreinte plus large avant la fermeture des foires."
 tv_engineering_department.7034.b:0 "Laissez les livres des corporations tranquilles; l'enquête peut plutôt attendre le Trésor."
 tv_engineering_department.7035.t:0 "Construction：Des jours de repos sont demandés aux équipes"
 tv_engineering_department.7035.d:0 "Le contremaître dit que l'assise plus large peut être prouvée ce mois-ci si les équipes déjà sur place travaillent pendant leurs jours de repos au lieu de se reposer entre les équipes. L'enquête réglerait le plan plus large, mais les ouvriers poussés au-delà de leur rythme habituel ne restent pas tous des ouvriers longtemps."
 tv_engineering_department.7035.a:0 "Conduisez les équipes pendant leurs jours de repos et installez les bases plus larges ce mois-ci."
 tv_engineering_department.7035.b:0 "Laissez les équipes garder leurs jours de repos; l'enquête peut attendre un rythme plus lent."
 tv_engineering_department.7036.t:0 "Construction：Un commis est recherché pour les tableaux de quarts de travail"
 tv_engineering_department.7036.d:0 "Le contremaître du chantier veut qu'un commis aux travaux approprié redessine les tableaux de quarts de travail et les affiche là où les équipes peuvent réellement les lire. Le trésor peut fournir l'homme et son encre moyennant un certain prix, et [tv_wonder_organization_competence|E] suivrait les nouveaux tableaux."
 tv_engineering_department.7036.a:0 "Nous engageons le commis et publions les nouveaux tableaux aujourd'hui."
 tv_engineering_department.7036.b:0 "Les anciens tableaux ont duré aussi longtemps; ils peuvent durer un peu plus longtemps."
 tv_engineering_department.7037.t:0 "Construction：Deux contremaîtres refusent les ordres de l'autre"
 tv_engineering_department.7037.d:0 "Deux équipes de guilde sur le chantier refusent de recevoir les ordres des contremaîtres de l'autre, et la dispute a bloqué l'équipe du matin à deux reprises cette semaine. Seul un bref portant le [legitimacy|E] de la couronne réglerait la préséance entre eux, et [tv_wonder_organization_competence|E] suivrait une fois la dispute terminée."
 tv_engineering_department.7037.a:0 "Le bref est rédigé et scellé; les équipes y répondent ou ne répondent à personne."
 tv_engineering_department.7037.b:0 "La parole de la couronne n'est pas dépensée pour décider quel maçon jure le plus fort."
 tv_engineering_department.7038.t:0 "Construction: La vieille Rota a oublié la récolte"
 tv_engineering_department.7038.d:0 "Le travail du village enrôlé était établi selon un ancien calendrier qui ne tenait jamais compte de la récolte, et la moitié des équipes partaient lorsque leurs champs en avaient besoin. Forcer la rotation malgré les objections locales réduirait le [stability|E] du pays, mais les équipes respecteraient finalement les heures fixes, et [tv_wonder_organization_competence|E] suivrait."
 tv_engineering_department.7038.a:0 "Nous faisons avancer la rotation; la récolte peut attendre le miracle pour une fois."
 tv_engineering_department.7038.b:0 "Forcer le problème n'échange désormais qu'une pénurie contre une pire."
 tv_engineering_department.7039.t:0 "Construction: Les maçons ne répondront pas au nouveau surveillant"
 tv_engineering_department.7039.d:0 "Les maîtres maçons ne répondront pas au jeune surveillant envoyé pour réorganiser leurs équipes, et ils le disent à portée de voix de toute la cour. Seul un nom soutenu par le [prestige|E] du tribunal a suffisamment de poids pour les faire s'aligner, et [tv_wonder_organization_competence|E] suivrait leur conformité."
 tv_engineering_department.7039.a:0 "Nous prêtons au surveillant le nom du tribunal; les maçons répondent à cela au moins."
 tv_engineering_department.7039.b:0 "L'autorité d'un jeune surveillant doit être gagnée sur la cour, et non empruntée au palais."
 tv_engineering_department.7040.t:0 "Construction: Un seigneur voisin offre son intendant"
 tv_engineering_department.7040.d:0 "Le seigneur voisin propose de prêter son propre intendant pour dresser de nouvelles listes d'équipage, un homme qui a dirigé les équipes d'un manoir pendant vingt ans. Accorder à la faveur son dû coûte [estate_satisfaction|E] parmi les nobles, mais les listes de l'intendant rapporteraient [tv_wonder_organization_competence|E]."
 tv_engineering_department.7040.a:0 "Nous acceptons l'intendant et devons au seigneur son dû."
 tv_engineering_department.7040.b:0 "Une dette envers ce seigneur en particulier vaut plus que des listes bien rangées."
 tv_engineering_department.7041.t:0 "Construction：Les cornes de changement répondent aux cloches de la cathédrale."
 tv_engineering_department.7041.d:0 "Les trompes de manœuvre du site ont toujours suivi les cloches de la cathédrale, et les cloches ne seront pas déplacées au gré d'une merveille. Demander au chapitre de sonner une heure supplémentaire pour marquer les changements d'équipe coûte [estate_satisfaction|E] au clergé, mais les équipes finiraient par remettre leurs postes à temps, apportant [tv_wonder_organization_competence|E]."
 tv_engineering_department.7041.a:0 "Nous demandons au chapitre la cloche supplémentaire, quelles que soient les grognements que cela nous coûte."
 tv_engineering_department.7041.b:0 "Les cloches marquent les heures de Dieu, pas l'équipe d'un contremaître. changement."
 tv_engineering_department.7042.t:0 "Construction：Les chariots de matériaux font la queue sur le marché"
 tv_engineering_department.7042.d:0 "Les chariots de matériaux font désormais la queue sur la place du marché deux fois par jour, et les marchands de la guilde perdent leurs meilleures heures à cause du bruit et de la boue. Dégager la place pour les charrettes selon un horaire fixe coûte [estate_satisfaction|E] aux bourgeois, mais les charrettes arriveraient finalement selon un horaire que les équipes peuvent planifier, apportant [tv_wonder_organization_competence|E]."
 tv_engineering_department.7042.a:0 "Nous fixons l'horaire et vidons la place, les étals ou pas d'étals."
 tv_engineering_department.7042.b:0 "Le marché nourrit la ville avant de nourrir la merveille."
 tv_engineering_department.7043.t:0 "Construction: une deuxième rotation Est demandé aux villages"
 tv_engineering_department.7043.d:0 "Il est demandé aux villages environnants d'envoyer une deuxième rotation de mains avant que les équipes actuelles ne s'effondrent à cause du doublement des postes. Les retirer de leurs propres parcelles entre la plantation et la récolte coûte [estate_satisfaction|E] aux paysans, mais une deuxième rotation complète permettrait au site d'effectuer enfin des rotations appropriées, ce qui amènerait [tv_wonder_organization_competence|E]."
 tv_engineering_department.7043.a:0 "Nous appelons la deuxième rotation et laissons les champs attendre leur tour."
 tv_engineering_department.7043.b:0 "Les champs vides en automne coûtent au pays plus cher qu'un horaire irrégulier."
 tv_engineering_department.7044.t:0 "Construction：Le chantier de préparation Est trop étroit pour passer"
 tv_engineering_department.7044.d:0 "La zone de rassemblement est trop exiguë pour que les équipes se croisent sans arrêter le travail, et l'enchevêtrement coûte une heure chaque matin. Le dégagement d'un bloc adjacent pour une cour appropriée ronge [development|E] sur le site, mais les équipes finissent par se déplacer sans entrer en collision, ce qui amène [tv_wonder_organization_competence|E]."
 tv_engineering_department.7044.a:0 "Nous démolissons le bloc et donnons aux équipes de la place pour se déplacer."
 tv_engineering_department.7044.b:0 "Le bloc reste; une cour exiguë coûte moins cher qu'une cour démolie."
 tv_engineering_department.7045.t:0 "Construction：Les charretiers locaux sont discrètement redirigés"
 tv_engineering_department.7045.d:0 "Les charretiers et les porteurs locaux qui faisaient les courses sur le site ont été discrètement redirigés vers le transport de matériaux merveilleux, et le commerce ordinaire autour des travaux s'est en conséquence diminué. Formaliser l'arrangement, liant ces mains au calendrier de la merveille, coûte [prosperity|E] sur le site, mais [tv_wonder_organization_competence|E] suivrait des équipages qui n'attendent plus les chariots manquants."
 tv_engineering_department.7045.a:0 "Nous officialisons l'arrangement; les charretiers répondent désormais aux horaires de la merveille."
 tv_engineering_department.7045.b:0 "Le commerce ordinaire nourrit les habitants du site; la merveille peut attendre son tour pour les charrettes."
 tv_engineering_department.7046.t:0 "Construction：La capitale prête ses contremaîtres"
 tv_engineering_department.7046.d:0 "Les propres travaux de construction de la capitale ont prêté leurs contremaîtres pour aider à redessiner les effectifs de la merveille, et le prêt a laissé les propres projets de la capitale à court de main d'oeuvre. Rendre le prêt permanent coûte [development|E] dans la capitale, mais le site des merveilles garderait un contremaître qui sait réellement comment gérer un fichier, apportant [tv_wonder_organization_competence|E]."
 tv_engineering_department.7046.a:0 "Nous rendons le prêt permanent; les projets de la capitale se réaliseront sans lui."
 tv_engineering_department.7046.b:0 "Les propres ouvrages de la capitale ont plus besoin de leur contremaître que la merveille n'en a besoin d'un autre."
 tv_engineering_department.7047.t:0 "Construction: l'ordre du port est remanié"
 tv_engineering_department.7047.d:0 "Les jours de livraison des marchands de la capitale ont été tranquillement remaniés afin que les matériaux des merveilles quittent le port en premier, et que le commerce ordinaire de la capitale attend désormais derrière les chariots de la merveille. La confirmation du nouvel ordre du port coûte [prosperity|E] dans la capitale, mais le site recevrait enfin les matériaux selon un calendrier où les équipes peuvent établir des équipes, amenant [tv_wonder_organization_competence|E]."
 tv_engineering_department.7047.a:0 "Nous confirmons le nouvel ordre au port; les marchands s'adapteront avec le temps."
 tv_engineering_department.7047.b:0 "Le commerce de la capitale ne devrait pas attendre derrière le chantier de construction d'une autre ville."
 tv_engineering_department.7048.t:0 "Construction: la reconversion demande aux équipes de doubler"
 tv_engineering_department.7048.d:0 "Le site manque de deux équipes complètes pour le recyclage dont les nouvelles équipes auraient besoin, donc les ouvriers déjà sur place sont invités à doubler leurs postes jusqu'à ce que le nouveau calendrier prenne effet. Conduire aussi durement les ouvriers [population|E] sur le site pendant des semaines leur coûte cher, mais la reconversion finirait par tenir, apportant [tv_wonder_organization_competence|E]."
 tv_engineering_department.7048.a:0 "Nous doublons les postes pour l'instant; les nouvelles équipes en valent la peine."
 tv_engineering_department.7048.b:0 "Les équipages épuisés n'apprennent rien; le recyclage peut attendre des mains reposées."
 tv_engineering_department.7049.t:0 "Construction：Un seul gué sauvegarde chaque chariot"
 tv_engineering_department.7049.d:0 "Un seul gué étroit sauvegarde chaque chariot à destination du site. Le quartier-maître veut [gold|E] maintenant, pour les planches et une équipe rémunérée de charpentiers de ponts, afin que le [tv_wonder_logistics_competence|E] puisse se déplacer à nouveau avant que la file d'attente ne devienne plus longue que la route elle-même."
 tv_engineering_department.7049.a:0 "Payez les charpentiers de ponts et dégagez le gué."
 tv_engineering_department.7049.b:0 "Le trésor a de meilleurs usages pour cette pièce qu'un passage à niveau."
 tv_engineering_department.7050.t:0 "Construction：Propriétaires fonciers Refusez le passage du convoi"
 tv_engineering_department.7050.d:0 "Les propriétaires fonciers le long de la nouvelle route refusent de laisser les charrettes traverser leurs champs sans un ordre royal. Dépenser les [legitimacy|E] de la couronne ici ouvrirait les portes et permettrait aux [tv_wonder_logistics_competence|E] d'avancer, mais seulement sur cette route, et seulement aujourd'hui."
 tv_engineering_department.7050.a:0 "Émettre le bref et ouvrir les champs aux charrettes."
 tv_engineering_department.7050.b:0 "La parole de la couronne n'est pas dépensée pour tous les propriétaires terriens obstinés."
 tv_engineering_department.7051.t:0 "Construction: la piste de charrette traverse le village. Vert"
 tv_engineering_department.7051.d:0 "L'ancien chemin de charrette traverse directement la verdure du village et les maîtres de route souhaitent l'élargir en déplaçant trois maisons et un puits. L'ordre ferait avancer le [tv_wonder_logistics_competence|E], mais cela coûterait le [stability|E] à la couronne avec ceux qui restent en grogne."
 tv_engineering_department.7051.a:0 "Donnez l'ordre, les maisons et le bien soient damnés."
 tv_engineering_department.7051.b:0 "Laissez le village garder son vert; la route peut la contourner."
 tv_engineering_department.7052.t:0 "Construction：Les seuls chevaux de trait de rechange appartiennent à une autre guilde"
 tv_engineering_department.7052.d:0 "La guilde des chariots de la province voisine possède les seuls chevaux de trait de rechange à louer. Ses maîtres les prêteront et laisseront le [tv_wonder_logistics_competence|E] rattraper leur retard, uniquement comme une faveur dépensée par le [prestige|E] de la cour, qui n'est pas illimitée."
 tv_engineering_department.7052.a:0 "Appelez la faveur et mettez ces chevaux sur la route."
 tv_engineering_department.7052.b:0 "Sauvegardez la bonne réputation de la cour pour une dette qui mérite d'être réclamée."
 tv_engineering_department.7053.t:0 "Construction：Les attelages de voitures des nobles sont Recherché pour Pierre"
 tv_engineering_department.7053.d:0 "Les maîtres des routes sont à court de chariots et veulent que les attelages de voitures des nobles locaux soient chargés de transporter la pierre à la place des invités. Le [tv_wonder_logistics_competence|E] gagnerait du terrain, mais cela coûterait [estate_satisfaction|E] aux nobles, qui se plaindront des inconvénients."
 tv_engineering_department.7053.a:0 "Réquisitionnez les voitures et mettez-les au transport de la pierre."
 tv_engineering_department.7053.b:0 "Laissez aux nobles leurs voitures; trouvez les chariots ailleurs."
 tv_engineering_department.7054.t:0 "Construction：L'entrepôt du monastère est recherché"
 tv_engineering_department.7054.d:0 "Le monastère le plus proche possède le seul entrepôt sec le long de la route, et les maîtres de route veulent qu'il soit vidé pour le grain et les outils. Le dégager aiderait le [tv_wonder_logistics_competence|E] à avancer, mais cela coûterait [estate_satisfaction|E] au clergé, qui n'oubliera pas quels chariots l'ont rempli."
 tv_engineering_department.7054.a:0 "Videz l'entrepôt et empilez-le de fournitures."
 tv_engineering_department.7054.b:0 "Laissez les magasins du monastère intacts."
 tv_engineering_department.7055.t:0 "Construction：Le convoi a besoin de la place du marché"
 tv_engineering_department.7055.d:0 "Le Le convoi a besoin de la place du marché de la ville pour faire tourner ses chariots, mais cette place est aussi le jour du marché. La fermeture des étals ferait passer les charrettes avant midi et aiderait les [tv_wonder_logistics_competence|E], au détriment des [estate_satisfaction|E] parmi les bourgeois dont les étals restaient fermés."
 tv_engineering_department.7055.a:0 "Fermez le marché et laissez passer les chariots."
 tv_engineering_department.7055.b:0 "Le marché reste ouvert; les chariots peuvent attendre un jour."
 tv_engineering_department.7056.t:0 "Construction：Un tronçon boueux avale la route"
 tv_engineering_department.7056.d:0 "Un tronçon de route s'est transformé en boue, et aucun attelage de bœufs ne peut s'en sortir seul. Mettre les bœufs et le dos du village aux cordes le dégagerait et aiderait les [tv_wonder_logistics_competence|E], mais cela coûterait [estate_satisfaction|E] aux paysans, qui ont besoin de ces bœufs pour les semailles du printemps."
 tv_engineering_department.7056.a:0 "Mettez les bœufs et le dos du village aux cordes."
 tv_engineering_department.7056.b:0 "Que les paysans gardent leurs bœufs pour le printemps. plantation."
 tv_engineering_department.7057.t:0 "Construction：La gare de transit ne peut pas contenir les wagons"
 tv_engineering_department.7057.d:0 "La gare de transit sur le site est trop exiguë pour les wagons qui arrivent désormais quotidiennement. Le dégagement des entrepôts à moitié construits à sa périphérie ouvrirait un espace pour le travail du [tv_wonder_logistics_competence|E], au prix de [development|E] sur le site déjà englouti dans ces entrepôts."
 tv_engineering_department.7057.a:0 "Dégagez les entrepôts et élargissez la cour."
 tv_engineering_department.7057.b:0 "Gardez les entrepôts; les wagons peuvent faire la queue à l'extérieur."
 tv_engineering_department.7058.t:0 "Construction：On dit aux aubergistes de servir les convois en premier"
 tv_engineering_department.7058.d:0 "Les aubergistes et les charretiers à proximité du site ont été invités à conserver d'abord leur stock de rechange pour les convois de la merveille, en ne vendant que ce qui reste à tout le monde. Cela permettrait de nourrir le [tv_wonder_logistics_competence|E], mais au prix de [prosperity|E] sur le site à mesure que le commerce local s'amenuise."
 tv_engineering_department.7058.a:0 "Maintenez d'abord le stock pour les convois."
 tv_engineering_department.7058.b:0 "Laissez la ville faire du commerce comme elle l'a toujours fait."
 tv_engineering_department.7059.t:0 "Construction：Les équipes de pavage de la capitale sont recherchées sur la route"
 tv_engineering_department.7059.d:0 "Le pavage de la capitale Les équipages sont à mi-chemin du relais d'une rue de marché lorsque les cantonniers les demandent à leur place, pour consolider les ornières sur le trajet vers le chantier. Les réaffecter ferait avancer le [tv_wonder_logistics_competence|E], au détriment du [development|E] dans la capitale, dont la rue reste à moitié pavée."
 tv_engineering_department.7059.a:0 "Retirez les équipages de la rue et envoyez-les sur l'itinéraire."
 tv_engineering_department.7059.b:0 "Terminez d'abord la rue du marché; le tracé peut attendre."
 tv_engineering_department.7060.t:0 "Construction：Les greniers de la capitale sont recherchés pour le tracé"
 tv_engineering_department.7060.d:0 "Les greniers les plus proches de la porte de la capitale constituent le moyen le plus rapide d'approvisionner les chariots pour la route, et les routiers veulent qu'ils soient ouverts. Vendre la réserve aiderait le [tv_wonder_logistics_competence|E] à avancer, au prix de [prosperity|E] dans la capitale alors que ses propres marchés s'amenuisent pendant une saison."
 tv_engineering_department.7060.a:0 "Ouvrez les greniers et stockez les wagons."
 tv_engineering_department.7060.b:0 "Gardez les greniers fermés en cas de saison creuse."
 tv_engineering_department.7061.t:0 "Construction: les ouvriers sont invités à décharger les Carnet de commandes"
 tv_engineering_department.7061.d:0 "Les ouvriers du site sont les seuls à avoir les mains libres pour décharger les wagons en attente, et le contremaître souhaite qu'ils interrompent leurs tâches habituelles et effectuent des quarts de travail supplémentaires aux cordes. Cela ferait avancer le [tv_wonder_logistics_competence|E], mais il fait appel à la main-d'œuvre [population|E] sur le site, épuisée par les heures supplémentaires."
 tv_engineering_department.7061.a:0 "Envoyez les ouvriers sur des quarts de travail supplémentaires et réduisez l'arriéré."
 tv_engineering_department.7061.b:0 "Laissez les ouvriers s'acquitter de leurs tâches habituelles."
 tv_engineering_department.7062.t:0 "Construction：Les grues restent inutilisées faute de Pièce"
 tv_engineering_department.7062.d:0 "Les grues de levage restent inutilisées tous les trois jours faute d'équipages rémunérés, bien que le commis aux finances jure que la pièce n'est pas comptée dans la chambre forte. Le relâcher maintenant permettrait de remettre les cordes en main avant que le gel ne s'installe."
 tv_engineering_department.7062.a:0 "Ouvrez la chambre forte et dépensez le [gold|E] en double service, achetant ainsi [tv_wonder_construction|E] la progression."
 tv_engineering_department.7062.b:0 "Laissez la chambre forte scellée; les équipages attendent le jour de paie ordinaire."
 tv_engineering_department.7063.t:0 "Construction：Les maçons exigent le propre sceau de la Couronne"
 tv_engineering_department.7063.d:0 "Les maçons refusent de franchir les bornes contestées sans un bref portant le propre sceau de la couronne, et non celui du gouverneur. Mettre le nom du souverain sur l'ordre réglerait la question aujourd'hui, même si chaque bref dépensé pour les carrières est un de moins pour la cour et le conseil."
 tv_engineering_department.7063.a:0 "Scellez le bref au nom du souverain, dépensant [legitimacy|E] pour acheter [tv_wonder_construction|E] le progrès au-delà des bornes."
 tv_engineering_department.7063.b:0 "Retenez le sceau royal et laissez le gouverneur défendre la frontière. lui-même."
 tv_engineering_department.7064.t:0 "Construction：Deux hameaux bloquent la route de transport"
 tv_engineering_department.7064.d:0 "Deux hameaux se trouvent à cheval sur la route de transport prévue, et leurs chefs ont clairement dit non à deux reprises. Les mettre de côté permettrait de dégager la route dans la semaine, au prix du calme que la couronne a gardé avec eux depuis la dernière mauvaise récolte."
 tv_engineering_department.7064.a:0 "Ordonnez aux hameaux de céder le passage, en dépensant [stability|E] pour dégager [tv_wonder_construction|E] la progression le long de la route de halage."
 tv_engineering_department.7064.b:0 "Déviez la route de halage autour des hameaux et laissez les chefs tranquilles."
 tv_engineering_department.7065.t:0 "Construction：La Guilde Le maître nomme son prix pour éviter la file d'attente"
 tv_engineering_department.7065.d:0 "Le maître de la guilde des tailleurs de pierre sautera la file d'attente des maçons de la merveille seulement si le tribunal appelle une faveur due depuis la dernière visite d'État. Demander maintenant déplacerait la commande vers le début du grand livre, mais une faveur prononcée à haute voix est une faveur dépensée."
 tv_engineering_department.7065.a:0 "Appelez la faveur et dépensez [prestige|E] pour faire avancer la commande, achetant ainsi [tv_wonder_construction|E] la progression."
 tv_engineering_department.7065.b:0 "Laissez la commande rester à son tour et gardez la faveur pour plus tard."
 tv_engineering_department.7066.t:0 "Construction: Un Seigneur offre sa maison. Prélèvements"
 tv_engineering_department.7066.d:0 "Un seigneur local propose à ses propres ménages des prélèvements pour transporter la pierre au cours du mois à venir, à condition que personne ne mentionne que ses hommes se sont vu promettre une saison de repos après le dernier rassemblement. Son intendant est déjà en train de rédiger la liste."
 tv_engineering_department.7066.a:0 "Prenez les prélèvements du seigneur, en dépensant les [estate_satisfaction|E] des nobles pour acheter du progrès [tv_wonder_construction|E]."
 tv_engineering_department.7066.b:0 "Refusez les prélèvements et laissez les hommes du seigneur respecter la saison promise."
 tv_engineering_department.7067.t:0 "Construction：Le fonds de l'hospice de l'abbaye pourrait couvrir le bois"
 tv_engineering_department.7067.d:0 "Le fonds de l'hospice de l'abbaye est bien garni ce trimestre, et le prieur a laissé entendre qu'il pourrait couvrir le bois d'échafaudage si la couronne le demandait directement au lieu de simplement faire allusion en retour. Demander directement est la partie dont le chapitre se souviendra."
 tv_engineering_department.7067.a:0 "Demandez directement au prieur et dépensez le clergé [estate_satisfaction|E] en bois d'échafaudage, en achetant [tv_wonder_construction|E] progrès."
 tv_engineering_department.7067.b:0 "Laissez l'hospice financer seul et trouvez le bois ailleurs."
 tv_engineering_department.7068.t:0 "Construction: les trains de wagons s'emmêlent avec le jour du marché"
 tv_engineering_department.7068.d:0 "Les trains de wagons destinés au site de la merveille continuent de se mêler au trafic des jours de marché aux trois mêmes coins. Fermer ces rues au commerce les jours de livraison débloquerait immédiatement l'itinéraire, même si les commerçants perdraient carrément ces heures de coutume."
 tv_engineering_department.7068.a:0 "Fermez les rues les jours de livraison, en dépensant les [estate_satisfaction|E] des bourgeois pour acheter du [tv_wonder_construction|E] progrès."
 tv_engineering_department.7068.b:0 "Laissez les rues du marché ouvertes et laissez les chariots attendre leur tour."
 tv_engineering_department.7069.t:0 "Construction：Les équipes de creusement sont sollicitées pour les travaux de terrassement"
 tv_engineering_department.7069.d:0 "L'huissier affirme que les villages environnants peuvent consacrer du temps aux travaux de terrassement, mais seulement les mêmes qui sont déjà dus à l'automne en raison des fossés qui empêchent leurs propres champs d'être inondés. Les rédiger maintenant signifie que l'abandon attend."
 tv_engineering_department.7069.a:0 "Enrôlez les ouvriers du village pour les travaux de terrassement, en dépensant les [estate_satisfaction|E] des paysans pour le progrès [tv_wonder_construction|E]."
 tv_engineering_department.7069.b:0 "Laissez les villages à l'abandon et trouvez de la main d'œuvre ailleurs."
 tv_engineering_department.7070.t:0 "Construction：L'ancien magasin à grains se trouve là où l'échafaudage doit s'élever"
 tv_engineering_department.7070.d:0 "Le vieux magasin à grains qui se trouve là où doit être placé l'échafaudage ouest est suffisamment solide pour être conservé, mais sa pierre et son empreinte répondraient d'un seul coup à la pénurie du maçon et à la plainte de l'arpenteur. Le tirer vers le bas est le moyen le plus rapide."
 tv_engineering_department.7070.a:0 "Détruisez le magasin de céréales et dépensez [development|E] sur le site pour acheter [tv_wonder_construction|E] progression."
 tv_engineering_department.7070.b:0 "Laissez le magasin de céréales debout et trouvez la salle de l'échafaudage ailleurs."
 tv_engineering_department.7071.t:0 "Construction：Les gardiens de taverne se tournent tranquillement vers la merveille"
 tv_engineering_department.7071.d:0 "Les taverniers et les charretiers du site ont commencé à détourner discrètement leur clientèle vers des livraisons de merveilles, puisque les équipages paient en pièces de monnaie et que le commerce ordinaire ne le fait pas. Officialiser cet arrangement accélérerait les livraisons, au détriment du commerce sur lequel ces détenteurs ont bâti leur clientèle."
 tv_engineering_department.7071.a:0 "Officialiser le détournement en dépensant [prosperity|E] sur le site pour acheter [tv_wonder_construction|E] progression."
 tv_engineering_department.7071.b:0 "Laissons le commerce local suivre son cours normal et laissons les livraisons telles quelles."
 tv_engineering_department.7072.t:0 "Construction：Un pont ou une merveille"
 tv_engineering_department.7072.d:0 "La réparation du pont de la capitale est au point mort faute de tailleurs de pierre, et chaque maçon qui s'y trouve est un maçon qui ne taille pas pour l'émerveillement. Réaffecter l'équipage ferait avancer la merveille immédiatement, et le pont attendrait simplement son tour."
 tv_engineering_department.7072.a:0 "Réaffectez l'équipage de la passerelle à la merveille, en dépensant [development|E] dans la capitale pour progresser [tv_wonder_construction|E]."
 tv_engineering_department.7072.b:0 "Laissez l'équipage du pont là où ils sont et laissez le pont finir en premier."
 tv_engineering_department.7073.t:0 "Construction：Les facteurs céréaliers offrent leur surplus, moyennant un prix"
 tv_engineering_department.7073.d:0 "Les facteurs céréaliers de la capitale ont proposé de vendre leur surplus directement aux magasins de la merveille à un prix équitable, à condition que la couronne les laisse afficher la vente sur la place principale comme preuve de la faveur royale. Cela nourrirait les équipes pendant le mois de soudure et cela plierait visiblement le marché vers un seul acheteur."
 tv_engineering_department.7073.a:0 "Laissez les facteurs publier la vente, dépensant [prosperity|E] dans la capitale pour acheter [tv_wonder_construction|E] le progrès."
 tv_engineering_department.7073.b:0 "Refusez la vente publique et achetez les céréales des équipes par les canaux habituels."
 tv_engineering_department.7074.t:0 "Construction：Le surveillant propose de travailler à travers le Nuit"
 tv_engineering_department.7074.d:0 "Le surveillant propose de faire fonctionner les équipes du site en équipe de nuit au lieu d'attendre les nouvelles mains du recruteur, puisque les flambeaux et la volonté sont déjà là. Cela éliminerait le retard à l'aube, même si les mêmes hommes seraient de retour aux premières lueurs du jour sans repos."
 tv_engineering_department.7074.a:0 "Ordonnez l'équipe de nuit, passant le travail [population|E] sur le site pour acheter [tv_wonder_construction|E] les progrès."
 tv_engineering_department.7074.b:0 "Envoyez les équipes dans leurs lits et attendez les nouvelles mains du recruteur."
 tv_engineering_department.7075.t:0 "Construction：Opinion à l'échafaudage. Wavers"
 tv_engineering_department.7075.d:0 "Une manifestation publique sur le site attire une foule qui peut devenir des spectateurs fidèles ou des critiques offensés. Les échafaudages attendent pendant que la rumeur décide si [tv_wonder_domestic_support|E] a été aidé ou blessé."
 tv_engineering_department.7075.a:0 "Laisse la manifestation parler d'elle-même."
 tv_engineering_department.7076.t:0 "Construction：Le plan dépasse la page"
 tv_engineering_department.7076.d:0 "Un ajustement audacieux tire le plan au-delà de ses anciennes limites. Cela peut devenir la décision qui a rendu le monument grandiose, ou la note que les futurs commis soulignent en rouge."
 tv_engineering_department.7076.a:0 "Pousse la conception au-delà de ses anciennes limites."
 tv_engineering_department.7077.t:0 "Construction: les ordres changent sous l'auvent"
 tv_engineering_department.7077.d:0 "Une nouvelle chaîne de commandement est imposée sous les auvents. Cela peut discipliner le chantier ou simplement apprendre à chaque contremaître une nouvelle façon d'argumenter."
 tv_engineering_department.7077.a:0 "Nous poussons la nouvelle chaîne de commandement à travers le chantier."
 tv_engineering_department.7078.t:0 "Construction: l'itinéraire tourne dans la boue"
 tv_engineering_department.7078.d:0 "Un itinéraire risqué promet de raccourcir la ligne d'approvisionnement. Si le temps se maintient, cela sera considéré comme une prévision; en cas d'échec, tout le monde se souviendra de qui a ordonné le virage."
 tv_engineering_department.7078.a:0 "Prenez le chemin le plus court!"
 tv_engineering_department.7079.t:0 "Construction: une nouvelle méthode est en suspens"
 tv_engineering_department.7079.d:0 "Une méthode plus rapide est essayée sur la partie active. Cela peut faire gagner un mois ou forcer l'équipe suivante à réparer une belle erreur."
 tv_engineering_department.7079.a:0 "Essaye la méthode la plus rapide sur la section active."
 tv_engineering_department.7080.t:0 "Construction: les ouvriers abandonnent leurs outils à cause d'une promesse non tenue"
 tv_engineering_department.7080.d:0 "Les ouvriers ont abattu leurs outils ce matin, marmonnant que la merveille saigne à sec l'argent de la couronne. Le contremaître les a calmés avec une promesse de primes de salaire, une promesse que le Trésor doit maintenant soit honorer, soit rompre devant la foule."
 tv_engineering_department.7080.a:0 "Brisez la prime promise et laissez la grogne des travailleurs se répandre sur le chantier."
 tv_engineering_department.7080.b:0 "Honorez la prime promise et laissez-la sortir du trésor."
 tv_engineering_department.7081.t:0 "Construction：Un pamphlet remet en question le sceau de l'écrit."
 tv_engineering_department.7081.d:0 "Un commis itinérant a lu à haute voix sur la place un pamphlet affirmant que le bref de la couronne autorisant la merveille n'avait jamais été légalement scellé. Que le doute sur le projet reste sans réponse ou que le mandat lui-même soit discrètement modifié, quelque chose doit céder."
 tv_engineering_department.7081.a:0 "Laissez le pamphlet sans réponse et laissez les doutes sur l'émerveillement continuer à se répandre."
 tv_engineering_department.7081.b:0 "Modifiez discrètement le libellé du bref pour répondre à la contestation et acceptez la brèche dans le mandat de la Couronne."
 tv_engineering_department.7082.t:0 "Construction：Un prélèvement déclenche une bagarre dans deux jours"
 tv_engineering_department.7082.d:0 "La nouvelle est arrivée que des levées de transporteurs de pierres pour la merveille ont déclenché une bagarre entre les officiers de conscription et les villageois à deux jours de route du site. Le calmer coûtera quelque chose, soit dans ce quartier, soit aux portes du site."
 tv_engineering_department.7082.a:0 "Laissons les portes du site absorber les grognements et laissons les troubles du quartier s'éteindre."
 tv_engineering_department.7082.b:0 "Envoyez des troupes pour coloniser tranquillement le district avant que les troubles ne s'étendent davantage."
 tv_engineering_department.7083.t:0 "Construction: l'empannage d'un envoyé voyage du port au palais"
 tv_engineering_department.7083.d:0 "Un envoyé étranger s'est moqué du banquet selon lequel la merveille rampe plus lentement qu'un bœuf de charrue, et la plaisanterie est maintenant répétée dans toutes les tavernes, du port au palais. Quelqu'un doit l'avaler, soit la position de la couronne à l'étranger, soit la fierté des citadins pour ce qui est en train d'être construit."
 tv_engineering_department.7083.a:0 "Ignorez les moqueries de l'envoyé et laissez la fierté des citadins pour cette merveille prendre le dessus."
 tv_engineering_department.7083.b:0 "Répondez à l'envoyé avec un contre-affichage somptueux et utilisez la couronne pour le faire taire."
 tv_engineering_department.7084.t:0 "Construction：L'intendant de Lord Aldric fume à la porte"
 tv_engineering_department.7084.d:0 "La nouvelle route de la carrière a traversé la réserve de chasse de Lord Aldric la semaine dernière, et depuis lors, son intendant est en colère contre la porte du site. Soit la maison du seigneur est apaisée, soit les communes qui observent l'impasse tirent leurs propres conclusions."
 tv_engineering_department.7084.a:0 "Laissez l'impasse traîner sans solution et laissez l'opinion de la foule sur le projet se détériorer."
 tv_engineering_department.7084.b:0 "Accordez à la maison du seigneur des excuses formelles et une compensation pour régler l'affaire."
 tv_engineering_department.7085.t:0 "Construction：La tranchée de fondation révèle d'anciennes tombes"
 tv_engineering_department.7085.d:0 "Les creuseurs préparant la tranchée de fondation ont découvert de vieilles pierres funéraires que personne n'avait enregistrées, et le curé de la paroisse refuse de bénir la poursuite des travaux jusqu'à ce que les morts soient correctement enterrés. Soit les rites de réinhumation sont entièrement payés, soit les fouilles continuent malgré les objections du prêtre."
 tv_engineering_department.7085.a:0 "Éliminez le prêtre et continuez à creuser, laissant la nouvelle des tombes perturbées perturber la foule."
 tv_engineering_department.7085.b:0 "Payer les rites de réinhumation complets pour satisfaire le curé et la paroisse."
 tv_engineering_department.7086.t:0 "Construction: des poteaux d'échafaudage bloquent la rangée des marchands"
 tv_engineering_department.7086.d:0 "Les poteaux d'échafaudage posés en travers de la rue principale ont bloqué la circulation des charrettes vers l'allée des marchands pendant six jours consécutifs, et les marchands exigent que quelqu'un réponde pour le commerce perdu. Soit leurs pertes sont compensées, soit la rue reste fermée et la foule en entend parler."
 tv_engineering_department.7086.a:0 "Laissez les commerçants sans compensation et laissez la rue fermée alimenter la grogne de la foule."
 tv_engineering_department.7086.b:0 "Compensez d'emblée la querelle des commerçants pour le commerce bloqué."
 tv_engineering_department.7087.t:0 "Construction: les champs de maturation sont intacts."
 tv_engineering_department.7087.d:0 "Les responsables des prélèvements sur les récoltes ont retiré les mains des villageois des champs en cours de maturation pour transporter le bois nécessaire à la merveille, et le grain reste désormais intact tandis que les travailleurs ont mal au dos sur le site. Soit les villages récupèrent la main pour la récolte, soit la foule entend comment le prodige a vidé les champs."
 tv_engineering_department.7087.a:0 "Gardez les mains levées sur le site et laissez la nouvelle du grain sur pied atteindre la foule."
 tv_engineering_department.7087.b:0 "Relâchez immédiatement les mains du village à la récolte."
 tv_engineering_department.7088.t:0 "Construction：L'ancien quartier des tanneries est à moitié démoli"
 tv_engineering_department.7088.d:0 "Le plan des maçons prévoit que l'ancien quartier de la tannerie soit dégagé pour faire place aux fondations de la merveille, et la moitié de celle-ci s'est effondrée avant que quiconque ne pense à demander ce qui la remplacerait. Soit le quartier est rasé comme prévu, soit le plan est réduit et les gens commencent à se demander pourquoi la merveille avait besoin d'autant d'espace."
 tv_engineering_department.7088.a:0 "Réduisez l'autorisation et laissez les gens se demander pourquoi la merveille avait besoin de tant de terrain en premier lieu."
 tv_engineering_department.7088.b:0 "Terminez de raser le quartier de la tannerie comme prévu et souciez-vous de ce qui le remplacera plus tard."
 tv_engineering_department.7089.t:0 "Construction：Le terrain du marché n'est pas revenu"
 tv_engineering_department.7089.d:0 "L'aire de rassemblement de la merveille a englouti l'espace du marché hebdomadaire pour le troisième mois consécutif, et les étals qui le remplissaient ont tout simplement cessé de revenir. Soit le terrain du marché est restitué avant qu'il ne soit oublié, soit le chantier le conserve et le commerce du site continue de s'amenuiser."
 tv_engineering_department.7089.a:0 "Gardez la zone de transit là où elle se trouve et laissez le commerce du site se refroidir."
 tv_engineering_department.7089.b:0 "Restituez le terrain du marché avant que les étals hebdomadaires n'oublient le chemin du retour."
 tv_engineering_department.7090.t:0 "Construction：L'hospice n'est pas touché par le vieux pont"
 tv_engineering_department.7090.d:0 "L'arpenteur de la ville a réquisitionné tous les francs-maçons de la capitale pour les travaux de pierre de la merveille, et l'hospice à moitié construit près du vieux pont est ainsi resté intact pendant deux mois. Soit l'hospice attend que le miracle soit accompli, soit les maçons sont rappelés dans la capitale et le chantier tarde à expliquer pourquoi."
 tv_engineering_department.7090.a:0 "Gardez tous les maçons sur la merveille et laissez attendre les projets à moitié construits de la capitale."
 tv_engineering_department.7090.b:0 "Rappelez les maçons pour terminer l'hospice et laissez la foule du site s'étonner du retard."
 tv_engineering_department.7091.t:0 "Construction：Des wagons en pierre étouffent la plus belle rue de la capitale"
 tv_engineering_department.7091.d:0 "Depuis une semaine, des wagons en pierre de taille à destination de la merveille sont garés le long de la plus belle rue commerçante de la capitale, et les commerçants affirment que la clientèle s'est tarie avec la route bloquée. Soit les wagons trouvent bientôt un autre itinéraire, soit ils restent et le commerce de la capitale continue de se refroidir."
 tv_engineering_department.7091.a:0 "Laissez les wagons là où ils sont et laissez plutôt la responsabilité du progrès du site être blâmée."
 tv_engineering_department.7091.b:0 "Détournez immédiatement les wagons et laissez respirer à nouveau la rue commerçante de la capitale."
 tv_engineering_department.7092.t:0 "Construction: l'effondrement d'un échafaudage laisse une douzaine de personnes brisées"
 tv_engineering_department.7092.d:0 "L'effondrement d'un échafaudage sur le site il y a trois jours a laissé une douzaine d'ouvriers avec des fractures, et le reste de l'équipe se plaint désormais qu'aucun salaire ne vaut le risque. Soit les surveillants forcent le pas et les ouvriers commencent à s'éclipser dans la nuit, soit le pas ralentit et la nouvelle du danger se répand dans la ville."
 tv_engineering_department.7092.a:0 "Que le danger devienne un sujet de conversation courant en ville et que tous les ouvriers restent sur le chantier."
 tv_engineering_department.7092.b:0 "Quoi qu'il en soit, forcez le rythme et acceptez que les travailleurs effrayés s'éloignent dans la nuit."
 tv_engineering_department.7093.t:0 "Construction: le coffre-fort est plus léger que ce que prétend le grand livre."
 tv_engineering_department.7093.d:0 "Le payeur du site ouvre le coffre-fort et le trouve plus léger que ce que prétend le grand livre. Quelqu'un a déjà dépensé des pièces qui n'ont jamais été comptées, et le manque à gagner sera comblé soit en [tv_wonder_scale_competence|E], soit en [gold|E]."
 tv_engineering_department.7093.a:0 "Réduisez le design pour qu'il corresponde à ce que la poitrine peut encore se permettre."
 tv_engineering_department.7093.b:0 "Comblez le déficit de trésorerie et continuez à construire à grande échelle."
 tv_engineering_department.7094.t:0 "Construction: un rival murmure qu'aucune charte ne le permet"
 tv_engineering_department.7094.d:0 "Un prétendant rival a commencé à chuchoter qu'aucune charte n'autorisait un monument de cette taille. Les greffiers disent que l'affaire peut être réglée tranquillement, mais non sans frais pour [tv_wonder_scale_competence|E] ou pour [legitimacy|E]."
 tv_engineering_department.7094.a:0 "Retirez discrètement les plus grandes revendications de la charte."
 tv_engineering_department.7094.b:0 "Demandez à la Couronne de réaffirmer la charte dans son intégralité et de répondre directement aux chuchotements."
 tv_engineering_department.7095.t:0 "Construction：Trois paroisses bloquent la route au-dessus des fondations"
 tv_engineering_department.7095.d:0 "Des hommes de trois paroisses ont abattu des outils sur les fondations élargies, bloquant la route avec des charrettes. L'huissier peut les disperser, mais seulement en cédant du terrain quelque part - soit le [tv_wonder_scale_competence|E] du plan, soit le [stability|E] du quartier."
 tv_engineering_department.7095.a:0 "Réduisez les fondations à la ligne d'origine et renvoyez les hommes chez eux satisfaits."
 tv_engineering_department.7095.b:0 "Envoyez des hommes armés pour dégager la route et maintenir les fondations plus larges."
 tv_engineering_department.7096.t:0 "Construction：Les Heralds refusent de voyager sans être payés"
 tv_engineering_department.7096.d:0 "Les hérauts qui devaient annoncer le monument à l'étranger sont restés impayés pendant deux mois et refusent désormais de voyager. Quelqu'un doit être satisfait immédiatement, que cela signifie couper le [tv_wonder_scale_competence|E] du dessin ou dépenser le [prestige|E] de la couronne pour acheter son silence."
 tv_engineering_department.7096.a:0 "Annoncez un monument plus petit et moins cher et laissez les hérauts porter ce mot à la place."
 tv_engineering_department.7096.b:0 "Payez les hérauts en fonction du nom et de la réputation de la couronne."
 tv_engineering_department.7097.t:0 "Construction：L'intendant du baron compte le double du bois"
 tv_engineering_department.7097.d:0 "L'intendant d'un baron a compté le bois réquisitionné dans les forêts de son seigneur et trouve le double de ce qui avait été convenu. Le seigneur acceptera soit une réduction plus faible à l'avenir, réduisant le [tv_wonder_scale_competence|E] du plan, soit des excuses formelles et de nouvelles concessions au [estate_satisfaction|E] parmi les nobles."
 tv_engineering_department.7097.a:0 "Réduisez les futurs quotas de bois et réduisez la conception en conséquence."
 tv_engineering_department.7097.b:0 "Envoyez des excuses officielles et d'autres subventions à la maison du baron."
 tv_engineering_department.7098.t:0 "Construction ： La nef plus large engloutirait l'ancien cimetière"
 tv_engineering_department.7098.d:0 "Un évêque a appris que la conception de la nef plus large engloutirait l'ancien cimetière du chapitre. Il ne bénira plus les œuvres à moins que le plan ne soit réduit, ou à moins que les griefs du chapitre envers [estate_satisfaction|E] parmi le clergé ne soient pleinement répondus."
 tv_engineering_department.7098.a:0 "Redessiner la nef pour épargner le cimetière."
 tv_engineering_department.7098.b:0 "Accordez au chapitre de nouveaux privilèges pour répondre à leurs griefs."
 tv_engineering_department.7099.t:0 "Construction：La route élargie traverse les entrepôts"
 tv_engineering_department.7099.d:0 "Les marchands de laine rapportent que la route élargie menant au site traverse directement leur entrepôt et que les marchandises pourrissent désormais au carrefour. Soit la route se rétrécit, réduisant le [tv_wonder_scale_competence|E] de toute l'approche, soit la couronne compense [estate_satisfaction|E] parmi les bourgeois."
 tv_engineering_department.7099.a:0 "Rétrécissez la route d'accès et épargnez les entrepôts."
 tv_engineering_department.7099.b:0 "Payez les pertes des marchands et gardez la route plus large."
 tv_engineering_department.7100.t:0 "Construction：Un village a enterré trois hommes. Mois"
 tv_engineering_department.7100.d:0 "On apprend qu'un village proche de la carrière a enterré trois hommes ce mois-ci, qui travaillaient jusqu'à la nuit tombée sur la commande élargie. Le préfet dit que la corvée doit être réduite, à moins que la couronne ne préfère répondre de [estate_satisfaction|E] parmi les paysans avec du grain et de l'argent au lieu de diminuer [tv_wonder_scale_competence|E]."
 tv_engineering_department.7100.a:0 "Réduisez l'ordre de la corvée à ce que le village peut supporter."
 tv_engineering_department.7100.b:0 "Envoyez du grain et de l'argent au village et gardez la corvée comme ordonné."
 tv_engineering_department.7101.t:0 "Construction：Une rangée de maisons Descend pour le terrain de travail"
 tv_engineering_department.7101.d:0 "Le contremaître a démoli une rangée de maisons debout sur le site pour élargir le terrain de travail, et les habitants se demandent ce qui sera construit à leur place. La solution consistera soit à réduire la conception, en n'épargnant [tv_wonder_scale_competence|E] aucun terrain dont il n'a pas besoin, soit à défricher davantage et à perdre davantage de [development|E] du site."
 tv_engineering_department.7101.a:0 "Arrêter le défrichement et redessiner le plan pour l'adapter au terrain déjà occupé."
 tv_engineering_department.7101.b:0 "Ordonner la poursuite du défrichement et laisser le site absorber la perte."
 tv_engineering_department.7102.t:0 "Construction：Le marché qui Une fois encerclé, le site a disparu."
 tv_engineering_department.7102.d:0 "Le marché qui entourait autrefois le chantier a été chassé par les échafaudages et le bruit, et les étals ne sont pas revenus. Le surveillant doit décider s'il doit rapprocher les travaux, en abandonner une partie [tv_wonder_scale_competence|E], ou laisser le [prosperity|E] du site continuer à saigner pendant que le marché reste banni."
 tv_engineering_department.7102.a:0 "Rapprochez les échafaudages et laissez le marché revenir."
 tv_engineering_department.7102.b:0 "Gardez les travaux largement étendus et laissez le commerce du site dépérir."
 tv_engineering_department.7103.t:0 "Construction：Les maçons du pont. Ont été attirés vers la merveille"
 tv_engineering_department.7103.d:0 "Les maçons recrutés pour la merveille ont été retirés directement des réparations du pont de la capitale, qui sont maintenant à moitié terminées avant l'hiver. Quelqu'un doit céder: soit le [tv_wonder_scale_competence|E] de la merveille rétrécit pour que les maçons puissent rentrer chez eux, soit le [development|E] de la capitale reste sans réparation en attendant la fin de la saison."
 tv_engineering_department.7103.a:0 "Relâchez les maçons dans la capitale et réduisez la taille de la merveille."
 tv_engineering_department.7103.b:0 "Gardez les maçons près de la merveille et laissez les réparations de la capitale attendez."
 tv_engineering_department.7104.t:0 "Construction：Les maisons de guilde de la capitale sont devenues silencieuses"
 tv_engineering_department.7104.d:0 "Les maisons de guilde de la capitale sont devenues silencieuses, leurs artisans et charretiers se sont retirés pour nourrir l'appétit de la merveille pour la pierre et les mains. Le conseil demande clairement si le projet sera finalement réduit à sa taille, en épargnant [tv_wonder_scale_competence|E], ou si le [prosperity|E] de la capitale doit continuer à financer un monument qu'il ne voit plus construit dans ses propres rues."
 tv_engineering_department.7104.a:0 "Réduisez le projet et relâchez les hommes de la guilde dans la capitale."
 tv_engineering_department.7104.b:0 "Gardez les hommes de la guilde sur le site et laissez le commerce de la capitale continuer à payer. it."
 tv_engineering_department.7105.t:0 "Construction：Le chirurgien prévient que d'autres vont tomber"
 tv_engineering_department.7105.d:0 "Un échafaudage s'est effondré sur le niveau élargi la nuit dernière, et le chirurgien dit que d'autres s'effondreront si le rythme du projet plus vaste ne ralentit pas. Le surveillant peut soit réduire la conception à un rythme auquel les équipes peuvent survivre, en épargnant [tv_wonder_scale_competence|E], soit continuer à diriger les travaux plus larges et accepter que les travaux [population|E] sur le site continueront à s'éclaircir."
 tv_engineering_department.7105.a:0 "Ralentir le rythme et réduire le plan à ce que les équipes peuvent supporter."
 tv_engineering_department.7105.b:0 "Poursuivre le travail plus large et accepter le prix à payer pour le ouvriers."
 tv_engineering_department.7106.t:0 "Construction：Deux employés comptent deux fois le même manque à gagner"
 tv_engineering_department.7106.d:0 "Le coffre-fort du payeur a échoué lors du décompte de la nuit dernière, deux fois, par deux employés différents. Soit la pièce manquante est déduite du trésor, soit l'ensemble des équipes est détruit et chaque équipage réaffecté à partir de rien. [tv_wonder_organization_competence|E] ou [gold|E] paieront les calculs des commis."
 tv_engineering_department.7106.a:0 "Déchirez la liste des équipes et réaffectez chaque équipe à partir de zéro."
 tv_engineering_department.7106.b:0 "Écrivez la pièce manquante dans le trésor et laissez la liste telle que comptée."
 tv_engineering_department.7107.t:0 "Construction: une fausse subvention est lue à haute voix au Équipages"
 tv_engineering_department.7107.d:0 "Un crieur qu'aucun contremaître ne reconnaît a lu une fausse concession des droits de coupe du site à un seigneur rival, en pleine audience des équipages. Poursuivre l'homme et réfuter l'affirmation avant que les ouvriers rassemblés ne retirent chaque contremaître de son poste pour la journée. Laisser le faux sans réponse maintient les équipes au travail, mais cette affirmation est déjà répétée dans les tavernes comme étant un fait. [tv_wonder_organization_competence|E] ou [legitimacy|E] porteront le mensonge du faussaire."
 tv_engineering_department.7107.a:0 "Retirez chaque contremaître de son poste pour traquer le crieur et remettre les pendules à l'heure."
 tv_engineering_department.7107.b:0 "Laissez la fausse déclaration sans réponse et gardez les équipes à leur travail."
 tv_engineering_department.7108.t:0 "Construction：Une bousculade se déverse dans le Rue"
 tv_engineering_department.7108.d:0 "Une bousculade à la file d'attente du mess, plus d'un demi-sac de céréales avariées, s'est répandue par la porte et dans la rue avant que la surveillance ne le brise. Les équipages peuvent être remaniés et nourris à des heures décalées afin que les deux gangs ne se rencontrent plus jamais, ou le guet peut procéder à ses arrestations en plein air pour régler définitivement l'affaire. [tv_wonder_organization_competence|E] ou [stability|E] répond pour le grain gâté."
 tv_engineering_department.7108.a:0 "Remaniez chaque service de mess afin que les deux gangs ne se croisent plus jamais."
 tv_engineering_department.7108.b:0 "Laissez la montre effectuer ses arrestations sur la place ouverte."
 tv_engineering_department.7109.t:0 "Construction：L'envoyé arrive à une porte sans personnel"
 tv_engineering_department.7109.d:0 "Un envoyé étranger est arrivé une journée entière plus tôt et a trouvé le porte d'honneur sans personnel et les banderoles toujours repliées sur leur poitrine. La liste de tâches peut être déchirée sur place pour préparer un accueil approprié, ou l'envoyé peut parcourir le site exactement tel qu'il est et le rapporter chez lui tel qu'il l'a vu. [tv_wonder_organization_competence|E] ou [prestige|E] paie pour une arrivée anticipée."
 tv_engineering_department.7109.a:0 "Déchirez le tableau de service sur place pour organiser un accueil approprié."
 tv_engineering_department.7109.b:0 "Promenez l'envoyé à travers le site exactement tel qu'il est."
 tv_engineering_department.7110.t:0 "Construction：Les bœufs empruntés sont en retard depuis la Saint-Michel."
 tv_engineering_department.7110.d:0 "Les attelages de bœufs empruntés au domaine d'un seigneur voisin devaient rentrer à Saint-Michel et continuent de transporter des pierres après la date limite. Les attelages peuvent être renvoyés chez eux à temps et les équipes de transport réorganisées pour tirer les charges à la main, ou les bœufs peuvent être gardés encore quinze jours pendant que l'intendant du seigneur est invité à attendre. [tv_wonder_organization_competence|E] ou le [estate_satisfaction|E] parmi les nobles transporte les bœufs en retard."
 tv_engineering_department.7110.a:0 "Renvoyez les bœufs à la maison dans les délais prévus et réorganisez les équipages pour les transporter à la main."
 tv_engineering_department.7110.b:0 "Gardez les bœufs encore quinze jours et dites à l'intendant du seigneur d'attendre."
 tv_engineering_department.7111.t:0 "Construction：Les marteaux noient la relique. Procession"
 tv_engineering_department.7111.d:0 "Les maçons ont continué à marteler la procession des reliques cette semaine, et les chants ne pouvaient pas être entendus sur le site à trois rues de là. Le calendrier des équipes peut désormais être redessiné autour de chaque jour de fête et de procession, ou le parcours de la procession peut simplement être déplacé et le clergé peut dire que le travail ne s'arrêtera pas pour cela. [tv_wonder_organization_competence|E] ou le [estate_satisfaction|E] parmi le clergé répond au bruit."
 tv_engineering_department.7111.a:0 "Redessinez le calendrier des équipes autour de chaque jour de fête et de procession."
 tv_engineering_department.7111.b:0 "Déplacez l'itinéraire de la procession et dites au clergé que le travail ne s'arrêtera pas."
 tv_engineering_department.7112.t:0 "Construction：Des wagons de chantier bloquent l'allée du marché aux céréales"
 tv_engineering_department.7112.d:0 "Une rangée de wagons de chantier a bloqué la voie de chargement du marché aux céréales pendant six jours consécutifs, et la corporation des marchands a cessé d'envoyer son employé se plaindre en personne. Le calendrier de livraison peut être détruit et reconstruit autour d'un itinéraire plus long qui maintient la voie dégagée, ou les chariots peuvent rester sur place pendant que la guilde doit réacheminer ses propres affaires. [tv_wonder_organization_competence|E] ou le [estate_satisfaction|E] parmi les bourgeois paie pour la voie bloquée."
 tv_engineering_department.7112.a:0 "Démolissez le calendrier de livraison et reconstruisez-le autour d'un itinéraire plus long."
 tv_engineering_department.7112.b:0 "Laissez les wagons là où ils sont et laissez la guilde se réorienter."
 tv_engineering_department.7113.t:0 "Construction：La saison des plantations arrive sans ses mains"
 tv_engineering_department.7113.d:0 "La corvée les gangs qui doivent revenir dans leurs villages pour planter sont toujours en train de tailler la pierre, et la rumeur circule que les champs de cette année ne seront pas semés sans eux. Les gangs peuvent être libérés à temps et les équipes de travail du site reconstruites par ceux qui restent, ou la corvée peut être maintenue au-delà de son terme pendant que les villages se débrouillent sans mains. [tv_wonder_organization_competence|E] ou le [estate_satisfaction|E] parmi les paysans paie pour les champs non plantés."
 tv_engineering_department.7113.a:0 "Libérez les gangs de la corvée dans les délais prévus et reconstruisez le site avec ceux qui restent."
 tv_engineering_department.7113.b:0 "Maintenez la corvée au-delà de son terme et laissez les villages se débrouiller."
 tv_engineering_department.7114.t:0 "Construction：Un mur effondré regarde le site. Pavage"
 tv_engineering_department.7114.d:0 "Un mur de soutènement a cédé du jour au lendemain et la pierre de taille la plus proche à portée de main était le pavage déjà posé le long de la route d'accès au site. Le pavage peut être laissé là où il se trouve et chaque main libre s'acquitte d'autres tâches pour extraire de la pierre fraîche à la place, ou la route peut simplement être démolie à nouveau pour réparer le mur avant le matin. [tv_wonder_organization_competence|E] ou [development|E] sur le site paie pour le mur effondré."
 tv_engineering_department.7114.a:0 "Retirez toute votre main libre d'autres tâches pour extraire de la pierre fraîche à la place."
 tv_engineering_department.7114.b:0 "Démolissez à nouveau la route d'accès pour réparer le mur le matin."
 tv_engineering_department.7115.t:0 "Construction：Les vendeurs de pain abandonnent leurs salaires en retard."
 tv_engineering_department.7115.d:0 "Les vendeurs de pain du marché du camp ont fait leurs valises et sont partis après que le salaire de la semaine dernière ait été distribué avec trois jours de retard et que la moitié soit en pièces de monnaie découpées. Les salaires peuvent être redessinés selon un calendrier plus strict et plus fréquent pour attirer les vendeurs à revenir, détruisant ainsi le système de rémunération actuel, ou le camp peut simplement se passer de son marché et les travailleurs peuvent se débrouiller seuls pour se nourrir. [tv_wonder_organization_competence|E] ou [prosperity|E] sur le site paie les salaires en retard."
 tv_engineering_department.7115.a:0 "Démantelez le système de rotation des salaires et redessinez-le selon un calendrier plus strict pour attirer les vendeurs."
 tv_engineering_department.7115.b:0 "Laissez le camp sans marché et laissez les ouvriers se débrouiller pour les repas."
 tv_engineering_department.7116.t:0 "Construction：Les échafaudages du pont disparaissent. Pendant la nuit"
 tv_engineering_department.7116.d:0 "Les échafaudages prêts pour la réparation du pont de la capitale ont été tranquillement chargés sur des wagons de chantier pendant la nuit, et l'équipe du pont est arrivée et a constaté que son bois avait disparu. Les parcours d'approvisionnement du site peuvent être allongés et ses déplacements reconstruits autour d'une source de bois plus éloignée, ou le pont de la capitale peut simplement attendre que ses poutres terminent la merveille en premier. [tv_wonder_organization_competence|E] ou [development|E] dans la capitale paie les échafaudages manquants."
 tv_engineering_department.7116.a:0 "Rallonger les circuits d'approvisionnement du site et reconstruire ses déplacements autour d'une source de bois plus éloignée."
 tv_engineering_department.7116.b:0 "Laissez le pont de la capitale attendre que ses poutres achèvent d'abord la merveille."
 tv_engineering_department.7117.t:0 "Construction：La salle de la guilde est vide à midi"
 tv_engineering_department.7117.d:0 "La moitié Les vitriers et les menuisiers de la capitale sont présents sur le chantier depuis trois semaines consécutives, et la salle des corporations est désormais pratiquement vide à midi. Les maîtres peuvent être rapatriés chez eux et les équipes de chantier reconstruites autour des apprentis restants, ou les maîtres peuvent simplement rester sur place pendant que les ateliers de la capitale restent inactifs un peu plus longtemps. [tv_wonder_organization_competence|E] ou [prosperity|E] dans la capitale paie pour le hall de guilde vide."
 tv_engineering_department.7117.a:0 "Faites pivoter la maison des maîtres et reconstruisez les équipes de chantier à partir des apprentis restants."
 tv_engineering_department.7117.b:0 "Gardez les maîtres sur le site et laissez les ateliers de la capitale rester inactifs."
 tv_engineering_department.7118.t:0 "Construction: une plate-forme à personnel réduit perd sa corde"
 tv_engineering_department.7118.d:0 "A Le câble du treuil s'est rompu ce matin lorsqu'un équipage réduit s'est replié sur la plate-forme pour gagner l'heure, et trois hommes sont descendus avec lui. Les équipes de réserve peuvent être retirées de leurs propres tâches et jetées sur la plate-forme demain, quelles que soient les conséquences sur le calendrier, ou le même équipage peut être renvoyé en désavantage numérique une fois les blessés évacués. [tv_wonder_organization_competence|E] ou le travail [population|E] sur le site paie la corde rompue."
 tv_engineering_department.7118.a:0 "Retirez les bandes de réserve de leurs propres tâches et jetez-les sur la plate-forme, au diable le calendrier."
 tv_engineering_department.7118.b:0 "Renvoyez la même équipe en désavantage numérique une fois les blessés évacués."
 tv_engineering_department.7119.t:0 "Construction: un pont bouclé bloque le convoi. Boue"
 tv_engineering_department.7119.d:0 "Un pont au-dessus de la route d'approvisionnement s'est déformé sous le poids des charrettes de pierre, et la moitié du convoi est désormais bloquée dans la boue en contrebas. Les passeurs au passage disent qu'ils transporteront les wagons en radeau moyennant un certain prix, et que quelqu'un va le payer d'une manière ou d'une autre."
 tv_engineering_department.7119.a:0 "Laissez les wagons là où ils sont assis et acheminez le reste autour du pont cassé, quel qu'en soit le prix [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7119.b:0 "Payez le prix des passeurs avec le trésor pour faire passer les wagons aujourd'hui, en drainant [gold|E]."
 tv_engineering_department.7120.t:0 "Construction：Le sceau du péage n'est plus honoré"
 tv_engineering_department.7120.d:0 "Les avant-gardes du convoi ont été refoulés au péage d'un voisin, leur charte portant un sceau que le seigneur local n'honore plus. Quelqu'un doit décider s'il faut forcer l'ouverture de la porte au nom de la couronne ou laisser les wagons rester à l'extérieur."
 tv_engineering_department.7120.a:0 "Faites demi-tour au convoi et trouvez un itinéraire plus long autour du péage controversé, en laissant passer [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7120.b:0 "Invoquez l'autorité de la couronne pour forcer l'ouverture de la porte maintenant, en dépensant [legitimacy|E] pour une querelle pas encore réglé."
 tv_engineering_department.7121.t:0 "Construction：Les villageois bloquent la route suite à une troisième réquisition"
 tv_engineering_department.7121.d:0 "Les villageois ont bloqué la route avec leurs propres charrettes, refusant de bouger jusqu'à ce que la troisième réquisition de cette saison soit annulée. Le convoi ne peut pas passer sans reculer ni sans amener des soldats pour dégager le passage."
 tv_engineering_department.7121.a:0 "Reculez, détournez le convoi autour du blocus et acceptez l'arrêt que cela laisse en [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7121.b:0 "Envoyez des soldats dégager la route de force, et comptez le coût en [stability|E]."
 tv_engineering_department.7122.t:0 "Construction：Le contremaître se voit refuser les chevaux avant Témoins"
 tv_engineering_department.7122.d:0 "Le contremaître du convoi s'est vu refuser des chevaux de trait frais par un tribunal rival et a été renvoyé devant témoins. Obtenir les chevaux signifie désormais faire appel à des faveurs qui font honte au tribunal et l'obligent à se conformer; ne pas les obtenir signifie que les chariots rampent jusqu'au bout."
 tv_engineering_department.7122.a:0 "Envoyez le contremaître avec les chevaux fatigués qu'il a déjà, et laissez le retard se faire sentir [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7122.b:0 "Appelez publiquement des faveurs pour faire honte à la cour rivale de lui remettre des chevaux frais, en dépensant [prestige|E] pour cela."
 tv_engineering_department.7123.t:0 "Construction：Les Carters Réquisitionnent un Noble Chevaux de la maison"
 tv_engineering_department.7123.d:0 "Les charretiers du convoi ont réquisitionné les chevaux de calèche d'une maison noble lorsque les attelages de la merveille ont échoué, et la maison les réclame avant la tombée de la nuit. Le retour des chevaux fait caler les chariots; les garder stoppe la patience de la maisonnée."
 tv_engineering_department.7123.a:0 "Renvoyez les chevaux à la maison noble ce soir et laissez les chariots attendre sans eux, au prix de [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7123.b:0 "Laissez les chevaux empruntés travailler dans le convoi un peu plus longtemps, quoi que cela fasse à [estate_satisfaction|E] parmi les nobles."
 tv_engineering_department.7124.t:0 "Construction：Les chariots ont roulé sur un Jour de fête"
 tv_engineering_department.7124.d:0 "La route d'approvisionnement la plus courte traverse les terres du monastère, et les chariots roulaient un jour de fête avant que quiconque ne pense à demander congé. Les moines ont fermé la porte et veulent que le convoi fasse demi-tour ou qu'on réponde."
 tv_engineering_department.7124.a:0 "Faites reculer les chariots et trouvez un autre chemin pour contourner le terrain du monastère, en laissant le détour coûter [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7124.b:0 "Poussez le convoi à travers la porte comme prévu et laissez l'offense se dérouler avec [estate_satisfaction|E] parmi le clergé."
 tv_engineering_department.7125.t:0 "Construction：Les convois attendent la sortie. Tempête sur la place du marché"
 tv_engineering_department.7125.d:0 "Le convoi a garé ses chariots toute la nuit sur la place du marché de la ville en attendant la fin de la tempête, et les commerçants n'ont pas pu ouvrir depuis. Les commerçants exigent que la place soit dégagée aujourd'hui, tempête ou pas."
 tv_engineering_department.7125.a:0 "Déplacez les chariots vers le mauvais temps maintenant et laissez la tempête ralentir [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7125.b:0 "Gardez les chariots sur la place encore un moment et laissez la colère des commerçants s'abattre sur [estate_satisfaction|E] parmi les bourgeois."
 tv_engineering_department.7126.t:0 "Construction：Le même village perd ses bœufs une troisième fois"
 tv_engineering_department.7126.d:0 "Le même village a vu ses bœufs et ses charrettes réquisitionnées pour le convoi trois fois ce mois-ci, et les champs ne sont pas labourés. Soit les animaux retournent à la charrue, soit les chariots se tirent d'eux-mêmes."
 tv_engineering_department.7126.a:0 "Renvoyer les bœufs aux champs et laisser le convoi boiter sans eux, au prix de [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7126.b:0 "Réquisitionner les bœufs une quatrième fois et laisser transparaître l'épuisement du village [estate_satisfaction|E] parmi les paysans."
 tv_engineering_department.7127.t:0 "Construction：Un glissement de terrain Enterre la route menant au site"
 tv_engineering_department.7127.d:0 "Un glissement de terrain a enfoui le dernier tronçon de route menant au site, et la seule solution rapide consiste à démolir les aires de rassemblement nouvellement aménagées pour les remblayer et les plancher. Soit le site abandonne ses propres fondations, soit le convoi attend à l'extérieur du toboggan."
 tv_engineering_department.7127.a:0 "Laissez les aires de rassemblement intactes et laissez le convoi s'asseoir à l'extérieur du toboggan, au prix de [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7127.b:0 "Démolissez les aires de stationnement nouvellement aménagées pour les remblayer et les planches pour dégager la route, en dépensant [development|E] sur le site."
 tv_engineering_department.7128.t:0 "Construction: la route doit être élargie au-delà. les étals des ouvriers"
 tv_engineering_department.7128.d:0 "Les chariots ont besoin que la route soit élargie au-delà des étals des ouvriers du site, et les vendeurs n'ont nulle part ailleurs où faire du commerce. Soit les étals descendent pour laisser passer le convoi, soit les wagons se faufilent au ralenti."
 tv_engineering_department.7128.a:0 "Laissez les wagons se faufiler au ralenti et laissez les étals debout, au prix de [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7128.b:0 "Dégagez les étals des vendeurs pour élargir la route au convoi, en dépensant [prosperity|E] sur le chantier."
 tv_engineering_department.7129.t:0 "Construction：Les rues de la capitale Sont déchirés pour pousser le convoi"
 tv_engineering_department.7129.d:0 "Les charretiers et les équipes de pavés de la capitale ont été retirés de leur travail habituel pour pousser le convoi en panne jusqu'au dernier kilomètre de la ville. Les rues de la capitale sont à moitié déchirées et à moitié vides, que les wagons attendent ou non."
 tv_engineering_department.7129.a:0 "Renvoyez les équipages de la capitale à leur propre travail et laissez le convoi caler aux portes, au prix de [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7129.b:0 "Maintenez les équipages de la capitale retirés de leurs rues pour terminer le transport des wagons, dépensant [development|E] dans le capitale."
 tv_engineering_department.7130.t:0 "Construction：Une cargaison bloquée occupe la place du marché de la capitale"
 tv_engineering_department.7130.d:0 "Le convoi a réquisitionné la place du marché central de la capitale pour stocker la cargaison bloquée de la merveille, et les caravanes qui y font habituellement du commerce ont été refoulées pendant une semaine. Soit la cargaison continue son chemin et le marché rouvre, soit la place reste un entrepôt un certain temps plus longtemps."
 tv_engineering_department.7130.a:0 "Déplacez la cargaison immédiatement, même si grossièrement, et soulagez [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7130.b:0 "Laissez la cargaison sur la place et gardez les caravanes fermées, en dépensant [prosperity|E] dans la capitale."
 tv_engineering_department.7131.t:0 "Construction：Les ouvriers sont plutôt mis dans les cordes de bœufs"
 tv_engineering_department.7131.d:0 "Les animaux de trait étant épuisés et sans nouveaux animaux disponibles, les contremaîtres du chantier ont commencé à mettre les ouvriers aux cordes pour tirer à la main les charrettes bloquées. Soit les hommes continuent de transporter jusqu'à épuisement, soit les charrettes restent là où elles sont bloquées."
 tv_engineering_department.7131.a:0 "Laisser les charrettes bloquées là où elles sont plutôt que de travailler davantage les hommes, au prix de [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7131.b:0 "Laisser les ouvriers tirer sur les cordes jusqu'à ce que les charrettes bougent, en passant le travail [population|E] sur le chantier."
 tv_engineering_department.7132.t:0 "Construction：Les tailleurs de pierre arrêtent le travail, non payés"
 tv_engineering_department.7132.d:0 "La guilde des tailleurs de pierre a arrêté le travail, impayé pendant deux mois consécutifs. Leur contremaître se tient à la porte avec un registre et un poing fermé, et quelqu'un doit ouvrir soit la cour, soit le trésor."
 tv_engineering_department.7132.a:0 "Laissez les coupeurs marcher et laissez [tv_wonder_construction|E] progresser."
 tv_engineering_department.7132.b:0 "Payez les arriérés en [gold|E] et laissez les ciseaux en mouvement."
 tv_engineering_department.7133.t:0 "Construction：Un prétendant cite les disparus. Writ"
 tv_engineering_department.7133.d:0 "La nouvelle est parvenue au conseil que les maçons du site ont été recrutés sans le bref d'usage, et un prétendant l'invoque déjà comme preuve que la couronne gouverne par caprice. Quelqu'un doit répondre du raccourci - soit l'ouvrage lui-même, soit le mandat qui l'a ordonné."
 tv_engineering_department.7133.a:0 "Rappelez le prélèvement et laissez [tv_wonder_construction|E] les progrès prendre du retard."
 tv_engineering_department.7133.b:0 "Tenez-vous en à l'ordre et laissez-le coûter la couronne [legitimacy|E]."
 tv_engineering_department.7134.t:0 "Construction：Les villageois bloquent le chemin des charrettes avec leurs corps"
 tv_engineering_department.7134.d:0 "Les villageois dont les communs étaient clôturés pour le chemin de la carrière ont bloqué le chemin des charrettes avec leurs propres corps. Soit les charrettes font demi-tour ce soir, soit les soldats dégagent la route et la campagne s'en souvient."
 tv_engineering_department.7134.a:0 "Retournez les charrettes et laissez [tv_wonder_construction|E] progresser."
 tv_engineering_department.7134.b:0 "Envoyez le garde dégager la piste et dépenser les [stability|E] que cela coûte."
 tv_engineering_department.7135.t:0 "Construction：Un ambassadeur visite un échafaudage à moitié effondré"
 tv_engineering_department.7135.d:0 "Un ambassadeur étranger J'ai visité le site tôt et j'ai trouvé un échafaudage à moitié effondré sur du mortier vert; son rapport de retour est déjà en cours de rédaction. Le surveillant peut interrompre les travaux pour les refaire correctement, ou laisser l'ambassadeur écrire ce qu'il a vu."
 tv_engineering_department.7135.a:0 "Démolissez la section défectueuse et laissez [tv_wonder_construction|E] progresser."
 tv_engineering_department.7135.b:0 "Laissez l'échafaud debout et laissez la lettre coûter la couronne [prestige|E]."
 tv_engineering_department.7136.t:0 "Construction：Un seigneur découvre sa réserve de chasse marquée pour le Carrière"
 tv_engineering_department.7136.d:0 "Un seigneur local a découvert sa réserve de chasse marquée pour la carrière de la merveille et s'est rendu au tribunal avec fureur, exigeant soit que les géomètres se retirent, soit que l'honneur de sa famille soit rendu. Quelqu'un en dessous doit céder du terrain."
 tv_engineering_department.7136.a:0 "Rappelez les géomètres et laissez [tv_wonder_construction|E] les progrès prendre du retard."
 tv_engineering_department.7136.b:0 "Maintenez la ligne de carrière et laissez-la coûter [estate_satisfaction|E] parmi les nobles."
 tv_engineering_department.7137.t:0 "Construction：La Fondation découvre un vieux cimetière"
 tv_engineering_department.7137.d:0 "Les creuseurs préparant la fondation ont découvert un vieux cimetière paroissial que personne n'avait enregistré, et les prêtres refusent de bénir la poursuite des travaux jusqu'à ce qu'ils soient correctement enterrés. Quelqu'un doit choisir entre les pelles et les sacrements."
 tv_engineering_department.7137.a:0 "Arrêtez les creuseurs jusqu'à ce que le rite de réinhumation soit terminé, et laissez [tv_wonder_construction|E] progresser."
 tv_engineering_department.7137.b:0 "Ordonnez que les fouilles continuent et qu'elles coûtent [estate_satisfaction|E] au clergé."
 tv_engineering_department.7138.t:0 "Construction：Des charrettes en maçonnerie engloutissent la place des marchands."
 tv_engineering_department.7138.d:0 "La place des marchands est à moitié engloutie par les charrettes en maçonnerie depuis une semaine, et les maîtres de guilde disent qu'une semaine supplémentaire de ce genre de situation gâcherait la foire d'automne. Soit les charrettes trouvent un nouvel itinéraire ce soir, soit la foire s'ouvre sur un chantier de construction."
 tv_engineering_department.7138.a:0 "Déviez les charrettes et laissez [tv_wonder_construction|E] progresser lentement."
 tv_engineering_department.7138.b:0 "Gardez les charrettes sur la place et laissez-les coûter [estate_satisfaction|E] parmi les bourgeois."
 tv_engineering_department.7139.t:0 "Construction：Les équipages de la Corvée ratent le dernier séchage. Semaine"
 tv_engineering_department.7139.d:0 "Les équipes de corvées venant de trois villages pour la campagne de ce mois-ci ont raté la dernière semaine sèche pour la récolte, et les chefs se demandent si leurs champs ou la merveille passent en premier. L'un des deux doit céder."
 tv_engineering_department.7139.a:0 "Renvoyer les équipes aux champs et laisser [tv_wonder_construction|E] progresser lentement."
 tv_engineering_department.7139.b:0 "Garder les équipes sur le site et laisser cela coûter [estate_satisfaction|E] aux paysans."
 tv_engineering_department.7140.t:0 "Construction：Un mur effondré enterre les propres ateliers du site"
 tv_engineering_department.7140.d:0 "Un mur de soutènement a cédé du jour au lendemain et enterré les ateliers et les magasins à moitié terminés qui s'étaient développés autour du site. Les reconstruire correctement coûtera quelque chose au site dans les deux cas - la main d'œuvre provenant de la merveille, ou de ce qui se trouve autour d'elle."
 tv_engineering_department.7140.a:0 "Retirez les équipes de la merveille pour consolider les ateliers, et laissez [tv_wonder_construction|E] les progrès reculer."
 tv_engineering_department.7140.b:0 "Laissez les ateliers en ruines et laissez les coûts coûter [development|E] sur le site."
 tv_engineering_department.7141.t:0 "Construction：Les colporteurs sont chassés pour un nouveau Parc de stockage"
 tv_engineering_department.7141.d:0 "Les colporteurs et les petits ateliers qui avaient surgi pour nourrir les équipes de travail ont été chassés cette semaine pour défricher le terrain pour un nouveau parc de stockage, et la petite économie du site s'est calmée avec eux. Le stock ou le métier propre du chantier - l'un des deux garde le terrain."
 tv_engineering_department.7141.a:0 "Rendre le terrain aux colporteurs et laisser [tv_wonder_construction|E] progresser sur le stock."
 tv_engineering_department.7141.b:0 "Garder le parc à stocks et le laisser coûter [prosperity|E] au chantier."
 tv_engineering_department.7142.t:0 "Construction：Chaque Maçon de la Capitale Est Réquisitionnés"
 tv_engineering_department.7142.d:0 "Les réparations des ponts de la capitale sont au point mort car tous les maçons et charrettes de la ville ont été réquisitionnés pour la dernière poussée de la merveille. Les magistrats veulent que leurs équipages reviennent avant que la travée ne tombe en panne; le chantier leur demande un mois de plus."
 tv_engineering_department.7142.a:0 "Relâchez les maçons dans la capitale et laissez [tv_wonder_construction|E] progresser lentement."
 tv_engineering_department.7142.b:0 "Gardez les maçons sur le chantier et laissez cela coûter [development|E] dans la capitale."
 tv_engineering_department.7143.t:0 "Construction：Des chariots en pierre ferment deux rues de la capitale"
 tv_engineering_department.7143.d:0 "Des charrettes de pierre de taille roulent Les commerçants du quartier du marché de la capitale ont fermé deux rues pendant une semaine et les commerçants affirment que le commerce se déplace déjà ailleurs. Soit les convois trouvent un itinéraire plus long, soit le district continue de saigner des coutumes."
 tv_engineering_department.7143.a:0 "Déviez les convois sur le long chemin et laissez [tv_wonder_construction|E] la progression prendre du retard."
 tv_engineering_department.7143.b:0 "Gardez les convois sur l'itinéraire court et laissez-le coûter [prosperity|E] dans la capitale."
 tv_engineering_department.7144.t:0 "Construction：Une fièvre se propage parmi les ouvriers. Camp"
 tv_engineering_department.7144.d:0 "La fièvre a envahi le camp des travailleurs et les médecins disent que les malades doivent se reposer sinon elle se propagera à tout l'équipage. Quelqu'un doit choisir entre les faire travailler et perdre le travail, ou les démissionner et perdre les travailleurs."
 tv_engineering_department.7144.a:0 "Reposez les équipes pour récupérer et laissez [tv_wonder_construction|E] progresser."
 tv_engineering_department.7144.b:0 "Travaillez les malades et laissez cela coûter le travail [population|E] sur le site."
 tv_engineering_department.7145.t:0 "Construction：Une nouvelle lacune dans le trésor"
 tv_engineering_department.7145.d:0 "La merveille tire les pièces plus rapidement que prévu. Le Trésor peut expliquer la pénurie, mais l'explication ne donne pas d'argent."
 tv_engineering_department.7145.a:0 "Étend les registres pour couvrir l'écart."
 tv_engineering_department.7146.t:0 "Construction：La poussière sur le sceau royal"
 tv_engineering_department.7146.d:0 "L'approbation royale repose sur trop de compromis. Le sceau tient toujours, mais il semble plus fin."
 tv_engineering_department.7146.a:0 "Permet au sceau royal de porter un peu plus fin."
 tv_engineering_department.7147.t:0 "Construction: les villes tranquilles sont perturbées"
 tv_engineering_department.7147.d:0 "Le rythme de la construction s'oppose à la vie ordinaire. Les marchés ouvrent tard, les villages grognent et l'ordre cède un peu de terrain."
 tv_engineering_department.7147.a:0 "Nous laissons les villages grogner et continuer malgré tout."
 tv_engineering_department.7148.t:0 "Construction：La cour perd sa couleur"
 tv_engineering_department.7148.d:0 "La cour donne de la couleur aux travaux et reçoit de la poussière en retour. Le prestige s'efface dans les petites plaisanteries publiques et les vantardises à moitié terminées."
 tv_engineering_department.7148.a:0 "Échange un peu d'éclat contre quelques blagues de cour."
 tv_engineering_department.7149.t:0 "Construction：Des mots froids aux tables nobles"
 tv_engineering_department.7149.d:0 "Les ménages nobles cèdent une fois de plus. La concession est formelle et froide, ce qui est souvent pire qu'un refus."
 tv_engineering_department.7149.a:0 "Accepte la concession froide et formelle des nobles."
 tv_engineering_department.7150.t:0 "Construction ： fronce les sourcils devant l'autel"
 tv_engineering_department.7150.d:0 "Le calendrier sacré se penche à nouveau pour le chantier. Le clergé obéit, mais l'obéissance a des limites."
 tv_engineering_department.7150.a:0 "Nous acceptons l'obéissance du clergé, avec les limites et tout."
 tv_engineering_department.7151.t:0 "Construction: des registres plus minces sur le marché"
 tv_engineering_department.7151.d:0 "Les affaires du marché sont centrées autour du projet. Les bourgeois peuvent profiter de la grandeur, mais pas lorsque toutes les routes qui y mènent sont bloquées."
 tv_engineering_department.7151.a:0 "Dégagez les routes et continuez à construire!"
 tv_engineering_department.7152.t:0 "Construction: des dos plus lourds dans les villages"
 tv_engineering_department.7152.d:0 "Les épaules rurales prennent une autre charge. Le projet avance et la patience du village s'amenuise."
 tv_engineering_department.7152.a:0 "La charge supplémentaire pèse sur les épaules des ruraux."
 tv_engineering_department.7153.t:0 "Construction：Le site abandonne ses rues"
 tv_engineering_department.7153.d:0 "Le site abandonne davantage son tissu ordinaire. Une merveille du futur gagne de l'espace, tandis que les rues actuelles perdent leur utilité."
 tv_engineering_department.7153.a:0 "Signe ces rues pour la merveille de demain."
 tv_engineering_department.7154.t:0 "Construction：Le site devient plus silencieux"
 tv_engineering_department.7154.d:0 "Le site devient commercialement plus silencieux à mesure que les échanges ordinaires sont attirés vers le monument. La prospérité ne peut être redirigée qu'un certain nombre de fois avant de diminuer."
 tv_engineering_department.7154.a:0 "Nous orientons à nouveau le commerce du site vers le monument."
 tv_engineering_department.7155.t:0 "Construction：Les projets d'investissement font place"
 tv_engineering_department.7155.d:0 "Les projets d'investissement ouvrent à nouveau la place à l'émerveillement. La ville royale reste grandiose, mais une partie de sa structure est empruntée."
 tv_engineering_department.7155.a:0 "Prend le cadre de la capitale à la merveille."
 tv_engineering_department.7156.t:0 "Construction：Des rues plus calmes dans la capitale"
 tv_engineering_department.7156.d:0 "Les marchés de la capitale perdent un peu de luminosité à mesure que le projet attire du crédit et des marchandises. Le tribunal peut le qualifier de patriotique; les marchands appellent cela un commerce plus lent."
 tv_engineering_department.7156.a:0 "Chaque monument emprunte son éclat quelque part."
 tv_engineering_department.7157.t:0 "Construction：Noms ajoutés au jet de blessures"
 tv_engineering_department.7157.d:0 "Les noms sont ajoutés aux jets de blessures. Le travail continue, mais chaque nouvelle marque change le regard des ouvriers sur la pierre."
 tv_engineering_department.7157.a:0 "Notez les noms et continuez!"
 tv_engineering_department.7158.t:0 "Construction：Silence à la porte du Trésor"
 tv_engineering_department.7158.d:0 "Une forte demande du site laisse le trésor visiblement vide. Le monument continue, et le royaume paie avant de pouvoir admirer quoi que ce soit."
 tv_engineering_department.7158.a:0 "Vide le trésor et laisse la pierre monter malgré tout."
 tv_engineering_department.7159.t:0 "Construction：Mandat des fissures avant le chantier"
 tv_engineering_department.7159.d:0 "Les exigences du chantier obligent la couronne à adopter une posture indigne. La promesse de grandeur s'appuie désormais sur une autorité endommagée."
 tv_engineering_department.7159.a:0 "Nous laissons la couronne se plier pour que les murs puissent s'élever."
 tv_engineering_department.7160.t:0 "Construction：Ordonnez des éclats dans le prélèvement"
 tv_engineering_department.7160.d:0 "Une perturbation plus sévère se répand au-delà de la clôture. Les responsables peuvent nommer la cause, mais ils ne peuvent pas donner au pays le sentiment d'être stable en la nommant."
 tv_engineering_department.7160.a:0 "Laisse les troubles suivre leur cours au-delà de la clôture."
 tv_engineering_department.7161.t:0 "Construction: l'honneur vacille en public"
 tv_engineering_department.7161.d:0 "Un embarras public sur le site se propage plus vite que n'importe quelle correction officielle. L'honneur paie pour une pierre qui n'est pas encore debout."
 tv_engineering_department.7161.a:0 "Laissez-les parler!"
 tv_engineering_department.7162.t:0 "Construction: la noble patience est ciselée"
 tv_engineering_department.7162.d:0 "Le projet coupe la noble patience jusqu'à ce que la courtoisie ne puisse plus couvrir le son. Un monument est un pauvre hôte quand il mange l'héritage."
 tv_engineering_department.7162.a:0 "Laisse les nobles grogner tandis que la maçonnerie avance."
 tv_engineering_department.7163.t:0 "Construction：La patience s'épuise dans la sacristie"
 tv_engineering_department.7163.d:0 "Une demande de construction piétine trop près de l'autel. Le clergé n'oublie pas quand la piété est traitée comme un espace ouvert."
 tv_engineering_department.7163.a:0 "Nous acceptons le silence froid du clergé comme le prix de la pierre."
 tv_engineering_department.7164.t:0 "Construction：La colère atteint les rues"
 tv_engineering_department.7164.d:0 "La colère atteint les devantures des magasins alors que le chantier engloutit l'espace, le temps et le crédit. La ville entend le monument avant de le voir."
 tv_engineering_department.7164.a:0 "Laisse les devantures des magasins grogner tandis que les échafaudages grimpent."
 tv_engineering_department.7165.t:0 "Construction：La colère rurale ne restera pas silencieuse"
 tv_engineering_department.7165.d:0 "La colère rurale ne restera pas silencieuse après ce prélèvement. L'ombre de la merveille atteint les fermes qui ne verront peut-être jamais son visage fini."
 tv_engineering_department.7165.a:0 "Laissez les champs le supporter!"
 tv_engineering_department.7166.t:0 "Construction：Le site retombe"
 tv_engineering_department.7166.d:0 "Les travaux creusent le site suffisamment fort pour le faire reculer. Le monument n'est pas encore élevé, mais l'espace autour a déjà payé."
 tv_engineering_department.7166.a:0 "Recule le site pour que le monument puisse avancer."
 tv_engineering_department.7167.t:0 "Construction：La prospérité du site est étouffée"
 tv_engineering_department.7167.d:0 "Le chantier étouffe pour un temps le marché local. Les charrettes arrivent encore, mais elles sont moins nombreuses à desservir la ville autour de la pierre."
 tv_engineering_department.7167.a:0 "Laisse le marché local s'éclaircir pendant que les travaux se poursuivent."
 tv_engineering_department.7168.t:0 "Construction：La capitale paie en pierre"
 tv_engineering_department.7168.d:0 "La capitale paie en pierre, en main d'œuvre et en réparations différées. Un monument lointain devient plus réel tandis que les plans à proximité deviennent creux."
 tv_engineering_department.7168.a:0 "Nous laissons les réparations de la capitale attendre la merveille lointaine."
 tv_engineering_department.7169.t:0 "Construction: le commerce de la ville royale est réduit au minimum"
 tv_engineering_department.7169.d:0 "Le commerce de la ville royale est réduit au minimum par les travaux. La grandeur au loin émousse les rues qui doivent la financer."
 tv_engineering_department.7169.a:0 "émousse les rues de la ville royale pour financer la grandeur ailleurs."
 tv_engineering_department.7170.t:0 "Construction：La sueur se transforme en sang"
 tv_engineering_department.7170.d:0 "La sueur se transforme en sang sur le site. Le monument n'est pas annulé, ce qui constitue peut-être la partie la plus cruelle de la leçon."
 tv_engineering_department.7170.a:0 "Nous continuons, même si le site a payé dans le sang."
 tv_engineering_department.7171.t:0 "Construction：[tv_great_engineer|E] Gagne la rue"
 tv_engineering_department.7171.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] transforme une visite technique en un triomphe public. Le résultat est une amélioration majeure de [tv_wonder_domestic_support|E].\n\n#G Cet événement s'est produit parce que le [tv_great_engineer|E] actuel a une capacité militaire effective supérieure à 80.#!"
 tv_engineering_department.7171.a:0 "Transforme une inspection de routine en un triomphe public."
 tv_engineering_department.7172.t:0 "Construction：[tv_great_engineer|E] Redessine le Grand Line"
 tv_engineering_department.7172.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] redessine l'axe principal avec une confiance qui rend crédible le plan plus large. Le résultat est une amélioration majeure de [tv_wonder_scale_competence|E].\n\n#G Cet événement s'est produit parce que le [tv_great_engineer|E] actuel a une capacité militaire effective supérieure à 80.#!"
 tv_engineering_department.7172.a:0 "Rend le grand axe inévitable, pas imprudent."
 tv_engineering_department.7173.t:0 "Construction：[tv_great_engineer|E] Reconstruit le Schedule"
 tv_engineering_department.7173.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] reconstruit le planning si proprement que même les contremaîtres rivaux y obéissent. Le résultat est une amélioration majeure de [tv_wonder_organization_competence|E].\n\n#G Cet événement s'est produit parce que le [tv_great_engineer|E] actuel a une capacité militaire effective supérieure à 80.#!"
 tv_engineering_department.7173.a:0 "Nous nous alignons sur le nouveau calendrier."
 tv_engineering_department.7174.t:0 "Construction：[tv_great_engineer|E] Ouvre le Road"
 tv_engineering_department.7174.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] ouvre une voie d'approvisionnement qui rend les anciens retards presque insensés. Le résultat est une amélioration majeure de [tv_wonder_logistics_competence|E].\n\n#G Cet événement s'est produit parce que le [tv_great_engineer|E] actuel a une capacité militaire effective supérieure à 80.#!"
 tv_engineering_department.7174.a:0 "La route est enfin ouverte!"
 tv_engineering_department.7175.t:0 "Construction：[tv_great_engineer|E] entraîne la principale Works"
 tv_engineering_department.7175.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] conduit les travaux principaux à travers un problème qui avait bloqué les moindres mains. Le résultat est une amélioration majeure de la progression de [tv_wonder_construction|E].\n\n#G Cet événement s'est produit parce que l'actuel [tv_great_engineer|E] a une capacité militaire effective supérieure à 80.#!"
 tv_engineering_department.7175.a:0 "Permet de mener à bien les travaux bloqués."
 tv_engineering_department.7176.t:0 "Construction：[tv_great_engineer|E] Calme le Rumeur"
 tv_engineering_department.7176.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] répond aux rumeurs avec des explications suffisamment claires pour stabiliser la confiance du public. Le projet obtient une amélioration plus constante dans [tv_wonder_domestic_support|E].\n\n#G Cet événement s'est produit parce que le [tv_great_engineer|E] actuel a une capacité militaire effective supérieure à 50.#!"
 tv_engineering_department.7176.a:0 "Calme les rumeurs avec un langage clair."
 tv_engineering_department.7177.t:0 "Construction：[tv_great_engineer|E] Définit le Measure"
 tv_engineering_department.7177.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] trouve suffisamment de marge dans le chantier pour épargner au projet une conception timide. Le projet obtient une amélioration plus constante dans [tv_wonder_scale_competence|E].\n\n#G Cet événement s'est produit parce que le [tv_great_engineer|E] actuel a une capacité militaire effective supérieure à 50.#!"
 tv_engineering_department.7177.a:0 "Nous donnons au plan suffisamment de place pour être audacieux."
 tv_engineering_department.7178.t:0 "Construction：[tv_great_engineer|E] Redresse le Rolls"
 tv_engineering_department.7178.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] redresse un désordre tenace d'équipages, d'outils et de montres. Le projet obtient une amélioration plus constante dans [tv_wonder_organization_competence|E].\n\n#G Cet événement s'est produit parce que le [tv_great_engineer|E] actuel a une capacité militaire effective supérieure à 50.#!"
 tv_engineering_department.7178.a:0 "Remet les équipages, les outils et les montres en ordre."
 tv_engineering_department.7179.t:0 "Construction：[tv_great_engineer|E] Efface le Convoi"
