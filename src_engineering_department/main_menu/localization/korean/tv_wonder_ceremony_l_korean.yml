 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_136:0 "#Y 진행 중#! — #high 상인의 맹세#!\n#F 길드 상인과 왕실 인사들은 카사 관리들 앞에서 모든 주괴와 진주를 보고할 것을 맹세하며, 부와 사기는 모두 왕관의 세심한 장부에 묶여 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_136:0 "#G 완료#! — #high 상인의 맹세#!\n#F 길드 상인과 왕실 인사들은 카사 관리들 앞에서 모든 주괴와 진주를 보고할 것을 맹세하며 부와 사기는 모두 왕관의 세심한 장부에 묶여 있습니다.#!"
