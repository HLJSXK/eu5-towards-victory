 TV_WONDER_CEREMONY_S3_DESC_173:0 "채석장과 가트 사이의 흐름을 모두 아는 뱃사공의 안내에 따라 채석된 돌을 실은 뗏목이 카시를 향해 하류로 떠내려갑니다. 인부들은 다음 뗏목이 도착하기 전에 각 뗏목을 내리기 위해 은행에 모였습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
