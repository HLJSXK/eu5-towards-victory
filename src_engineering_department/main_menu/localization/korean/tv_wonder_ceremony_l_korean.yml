 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_173:0 "#Y 진행 중#! — #high 사제 강둑을 축복하세요#!\n#F 사제들은 선택된 은행의 길이를 따라 축복을 외치고 각 층의 계단이 물로 내려가야 하는 위치를 표시합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_173:0 "#G 완료#! — #high 사제 강둑을 축복하세요#!\n#F 사제들은 선택된 은행의 길이를 따라 축복을 외치고 각 계단이 물에 내려가야 하는 위치를 표시합니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_173:0 "[tv_wonder_ceremony|E]:사제들이 강둑을 축복하다"
 TV_WONDER_CEREMONY_S2_DESC_173:0 "사제들은 선택된 은행의 길이를 따라 축복을 외치고 계단의 각 층이 물로 내려가야 하는 위치를 표시합니다. 강의 신성함에 걸맞은 돌을 공급할 수 있는 상류 채석장을 찾기 위해 현지 석공과 상의합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_173:0 "사제들은 축복을 마치고 상류의 채석장으로 소식을 보냅니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_173:0 "신성한 강조차도 천천히 제방을 개척합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_173:0 "@tv_ceremony_river!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_173:0 "#Y 진행 중#! — #high 돌이 강 아래로 뗏목으로 떠내려갑니다#!\n#F 채석장과 가트 사이의 흐름을 모두 아는 뱃사공의 안내에 따라 채석된 돌을 실은 뗏목이 카시를 향해 강 아래로 표류합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_173:0 "#G 완료#! — #high Stone은 강 아래로 뗏목으로 떠내려갑니다#!\n#F 채석장과 가트 사이의 모든 흐름을 아는 뱃사공의 안내에 따라 채석된 돌을 실은 뗏목이 카시를 향해 강 아래로 표류합니다.#!"
