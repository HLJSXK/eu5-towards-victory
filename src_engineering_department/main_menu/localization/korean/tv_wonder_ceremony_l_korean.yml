 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_197:0 "#Y 진행 중#! — #high 주교의 비전이 수도원을 요구하다#!\n#F 주교의 대천사 비전에 따라 헌장은 노르만 모래에서 솟아오른 조석 바위 위에 새 수도원을 건설할 것을 요구합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_197:0 "#G 완료#! — #high 주교의 비전에 수도원이 필요하다#!\n#F 대천사에 대한 주교의 비전에 따라 헌장은 노르만 해협에서 솟아오른 조석 바위 위에 새로운 수도원을 건설할 것을 요구합니다. 모래.#!"
