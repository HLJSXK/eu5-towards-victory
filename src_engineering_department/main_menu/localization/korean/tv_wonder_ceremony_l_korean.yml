 TV_WONDER_CEREMONY_CARD_ICON_S2_199:0 "@tv_ceremony_mapmode!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_199:0 "#Y 진행 중#! — #high 메이슨들이 외부 고리 조사#!\n#F 메이슨들과 군사 기술자들은 언덕에서 새로운 외벽의 선을 조사하고 성채에 대한 모든 접근을 포괄할 탑을 계획합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_199:0 "#G 완료#! — #high Masons 외부 링 조사#!\n#F Masons와 군사 엔지니어들은 언덕에서 새로운 외벽 선을 조사하고 성채에 대한 모든 접근을 포괄할 탑을 계획합니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_199:0 "[tv_wonder_ceremony|E]: 메이슨의 외부 링 조사"
 TV_WONDER_CEREMONY_S2_DESC_199:0 "석공과 군 기술자들은 새로운 외벽의 선을 찾기 위해 언덕을 조사하고 성채에 대한 모든 접근을 포괄할 탑을 계획합니다.\n\n#weak 식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_199:0 "우리는 이제 성채에 접근하는 모든 사람이 감시되지 않는다는 것을 언덕 비탈에 표시합니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_199:0 "엔지니어들은 측량 차트를 접고 언덕에서 물러납니다."
