 TV_WONDER_CEREMONY_CARD_ICON_S3_205:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_205:0 "#Y 진행 중#! — #high 사제들이 불타는 땅을 축복합니다#!\n#F 불사제들은 해질녘에 현장을 돌아다니며 오각형 안뜰과 중앙 제단이 서 있을 위치를 표시하여 불꽃이 돌로 둘러싸이지 않는 일이 없도록 합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_205:0 "#G 완료#! — #high 사제들이 불타는 땅을 축복합니다#!\n#F 불사제들은 해질녘에 현장을 돌아다니며 오각형 안뜰과 중앙 제단이 서 있을 위치를 표시하여 불꽃이 돌로 둘러싸이지 않는 일이 없도록 합니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_205:0 "[tv_wonder_ceremony|E]:사제들이 불타는 땅을 축복하다"
 TV_WONDER_CEREMONY_S3_DESC_205:0 "불의 사제들이 황혼 무렵 현장을 돌아다니며 오각형 안뜰과 중앙 제단이 서 있을 위치를 표시하여 불꽃이 돌로 둘러싸이지 않은 상태로 남지 않도록 합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_205:0 "그래서 땅은 축복받았습니다!"
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_205:0 "제사장들은 축복을 보류하고 표식을 먼지 속에 그대로 두었습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_205:0 "@tv_ceremony_build_icon!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_205:0 "#Y 진행중#! — #high 마당의 성벽이 솟아오른다#!\n#F 메이슨들이 불타는 땅 주위에 오각형 울타리의 첫 번째 돌을 놓았고, 모래 속의 표식에 불과했던 신전은 바람이 흩어지지 않는 건물이 된다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_205:0 "#G 완료#! — #high 뜰 성벽이 솟아오른다#!\n#F 메이슨들이 불타는 땅 주변에 오각형 울타리의 첫 번째 돌을 놓았고, 모래 속의 표식에 불과했던 신전은 바람이 흩어지지 않는 건물이 됩니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_205:0 "[tv_wonder_ceremony|E]: 안뜰 벽이 솟아오릅니다."
 TV_WONDER_CEREMONY_S4_DESC_205:0 "석공들은 불타는 땅 주위에 오각형 울타리의 첫 번째 돌을 놓았고, 모래 속의 표식에 불과했던 신사는 바람이 흩어지지 않는 건물이 됩니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_205:0 "석공들이 첫 번째 돌을 깔고 신전의 모양이 갖춰지기 시작합니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_205:0 "모래가 마커를 조금 더 오래 유지하게 해주세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S5_205:0 "@tv_ceremony_rite_power!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_205:0 "#Y 진행 중#! — #high 중앙 불꽃 제단#!\n#F A 돔형 제단은 가장 강한 불의 통풍구 바로 위에 세워져 있으며, 네 모퉁이 기둥은 불꽃 자체로 순례자의 눈을 위로 끌어당기도록 조각되어 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_205:0 "#G 완료#! — #high 중앙 불꽃 제단#!\n#F A 돔형 제단은 가장 강한 불의 통풍구 바로 위에 세워져 있으며, 네 모퉁이 기둥은 불꽃 자체로 순례자의 눈을 위로 끌어당기도록 조각되어 있습니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_205:0 "[tv_wonder_ceremony|E]：중앙 불꽃의 제단"
 TV_WONDER_CEREMONY_S5_DESC_205:0 "돔형 제단은 가장 강한 불의 통풍구 바로 위에 세워져 있으며, 그 네 모퉁이 기둥은 불꽃 자체와 함께 순례자들의 시선을 위로 끌어당길 수 있도록 조각되어 있습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 적절한 순간이 아닐 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_205:0 "우리는 모든 사람의 눈이 신성한 불꽃으로 이끌리도록 이 제단을 세웁니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_205:0 "법원은 제단을 지연시키고 통풍구는 열린 하늘 아래에서 불타고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_205:0 "@tv_ceremony_clergy!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_205:0 "#Y 진행 중#! — #high 고행자를 위한 세포#!\n#F 성스러운 불을 바라보며 여생의 일부를 수년을 보내야 하는 떠돌이 수행자들을 위한 작은 돌 세포가 안뜰 벽에 늘어서 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_205:0 "#G 완료#! — #high 고행자를 위한 세포#!\n#F 성스러운 불을 바라보며 여생의 일부를 수년을 보내야 하는 떠돌이 수행자들을 위해 작은 돌 세포가 안뜰 벽에 늘어서 있습니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_205:0 "[tv_wonder_ceremony|E]：수도자를 위한 세포"
 TV_WONDER_CEREMONY_S6_DESC_205:0 "남은 생애의 일부를 성스러운 불 앞에서 몇 년을 보내려는 고행자들을 위한 작은 돌 세포가 내부 안뜰 벽에 늘어서 있습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_205:0 "충실한 사람들을 위한 공간이 충분합니다!"
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_205:0 "법원은 고행자들을 내쫓고 안뜰 벽은 그대로 남아 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_205:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_205:0 "#Y 진행 중#! — #high A 순례자를 위한 캐러밴세라이#!\n#F 상인은 신사 옆에 게스트하우스와 마구간을 마련하여 카스피해 바람을 건너는 순례자와 상인이 계속 전진하기 전에 불꽃이 보이는 곳에서 휴식을 취할 수 있도록 합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_205:0 "#G 완료#! — #high A 순례자를 위한 캐러밴세라이#!\n#F 상인은 신사 옆에 게스트하우스와 마구간을 마련하여 카스피해 바람을 건너는 순례자와 상인이 계속 전진하기 전에 불꽃이 보이는 곳에서 휴식을 취할 수 있도록 합니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_205:0 "[tv_wonder_ceremony|E]：순례자를 위한 카라반세라이"
 TV_WONDER_CEREMONY_S7_DESC_205:0 "상인들은 신사 옆에 게스트하우스와 마구간을 마련하여 카스피해를 건너는 순례자들과 상인들이 계속 진행하기 전에 불꽃이 보이는 곳에서 휴식을 취할 수 있도록 합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우에는 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_205:0 "상인들은 카스피해의 바람을 타고 여행하는 모든 사람들을 위해 신사 옆에 게스트하우스와 마구간을 세웁니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_205:0 "지금은 피난처 없이 달리도록 놔두세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S8_205:0 "@tv_ceremony_prestige!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_205:0 "#Y 진행 중#! — #high 아테쉬가가 봉헌되었습니다#!\n#F 불의 사원은 압셰론 반도에 완공되어 그 불꽃은 한 번도 인간의 손으로 불을 붙일 필요가 없었고, 오늘부터 왕국의 명성은 순례자들을 위해 조금 더 밝게 타오르고 있습니다. 무승부.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_205:0 "#G 완료#! — #high 아테쉬가가 봉헌되다#!\n#F 불의 사원은 압셰론 반도에 완공되었으며, 그 불은 한 번도 인간의 손으로 불을 붙일 필요가 없었고, 오늘부터 왕국의 명성은 순례자들을 위해 조금 더 밝게 타오르고 있습니다. 무승부.#!"
 TV_WONDER_CEREMONY_S8_TITLE_205:0 "[tv_wonder_ceremony|E]: 아테쉬가가 봉헌되었습니다"
 TV_WONDER_CEREMONY_S8_DESC_205:0 "불의 사원 스탠드는 압셰론 반도에서 완성되었으며, 그 불꽃은 한 번도 인간의 손으로 불을 붙일 필요가 없었으며, 오늘부터 왕국의 위신은 이곳이 끌어들이는 순례자들을 위해 조금 더 밝게 타오릅니다.\n\n#weak 의식을 완료하는 데 필요한 대가를 지불하세요. 그 결과 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_205:0 "우리는 아테쉬가를 봉헌하고, 그 꺼지지 않는 불꽃이 이제 우리 왕국의 영광을 전합니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_205:0 "법원은 봉헌식을 연기하고, 완성된 성소는 합당한 명예를 조용히 기다립니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_206:0 "@tv_ceremony_government!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_206:0 "#Y 진행 중#! — #high 시장을 장악하기 위한 법령#!\n#F 사나의 주지사는 오래된 시장 구역이 산길을 건너는 캐러밴에 적합하도록 돌과 석고로 재건되어야 한다고 선언하고, 외침꾼들은 모든 길드에 소식을 전합니다. 홀.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_206:0 "#G 완료#! — #high 시장을 장악하기 위한 법령#!\n#F 사나의 주지사는 오래된 시장 구역이 산길을 건너는 캐러밴에 적합하도록 돌과 석고로 재건되어야 한다고 선언하고, 외침꾼들은 모든 길드에 소식을 전합니다. 홀.#!"
 TV_WONDER_CEREMONY_S1_TITLE_206:0 "[tv_wonder_ceremony|E]：시장을 장악하기 위한 법령"
 TV_WONDER_CEREMONY_S1_DESC_206:0 "Sana'a의 주지사는 산길을 건너는 캐러밴에 적합한 돌과 석고로 오래된 시장 구역을 재건해야 한다고 선언하고, 외치는 사람들은 모든 길드 홀에 소식을 전합니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 대가를 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_206:0 "우리는 오래된 시장이 돌과 석고로 다시 세워지고 바로 이 시간 모든 길드 홀에 외치는 사람들을 보낼 것이라고 법령을 내립니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_206:0 "주지사는 인감을 보류하고 시장 구역은 또 다른 시즌의 파멸을 기다립니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_206:0 "@tv_ceremony_organization!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_206:0 "#Y 진행 중#! — #high 길드에서 거래를 약속합니다#!\n#F 향 판매자, 커피 상인, 금속 세공인이 재건축을 위해 가판대와 동전을 서약합니다. 각 길드는 자신의 시장이 시장에 포함되기를 열망합니다. 최고급.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_206:0 "#G 완료#! — #high 길드가 거래를 약속합니다#!\n#F 향 판매자, 커피 상인, 금속 세공인이 재건축을 위해 가판대와 동전을 서약합니다. 최고급.#!"
 TV_WONDER_CEREMONY_S2_TITLE_206:0 "[tv_wonder_ceremony|E]：길드가 거래를 약속합니다"
 TV_WONDER_CEREMONY_S2_DESC_206:0 "향 판매자, 커피 상인, 금속 세공인들은 재건축을 위해 가판대와 동전을 서약하며, 각 길드는 자신이 속한 시장이 최고로 평가되기를 열망합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_206:0 "선의로 지출한 길드 코인은 신뢰의 10배로 돌아옵니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_206:0 "우리는 원장이 더 확실해질 때까지 길드에게 동전을 좀 더 오래 보관해 줄 것을 요청합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_206:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_206:0 "#Y 진행 중#! — #high 카디스가 재단을 축복합니다#!\n#F 판사와 성직자들이 새 구역의 경계를 거닐며 타워 하우스가 세워질 부지를 축복하고 누가 어디에 지을 것인지에 대한 분쟁을 해결합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_206:0 "#G 완료#! — #high 카디스가 재단을 축복합니다#!\n#F 판사와 성직자들이 새 구역의 경계를 거닐며 타워 하우스가 세워질 부지를 축복하고 누가 어디에 지을지에 대한 분쟁을 해결합니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_206:0 "[tv_wonder_ceremony|E]: 카디스가 재단을 축복합니다"
 TV_WONDER_CEREMONY_S3_DESC_206:0 "판사와 성직자들은 새 구역의 경계를 돌아다니며 타워 하우스가 세워질 장소를 축복하고 누가 어디에 지을 것인지에 대한 분쟁을 해결합니다.\n\n#weak 식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_206:0 "카디는 경계석을 걸으며 각 부지에 대한 축복의 말을 전합니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_206:0 "서둘러 그린 경계는 피로 다시 그린 경계이다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_206:0 "@tv_ceremony_building_levels!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_206:0 "#Y 진행 중#! — #high 타워 하우스 착공#!\n#F 메이슨은 사나의 우뚝 솟은 타워 하우스를 위해 현무암과 벽돌의 첫 번째 코스를 깔았고, 산악 도시는 마침내 계획자들이 약속한 하늘을 향해 오르기 시작했습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_206:0 "#G 완료#! — #high 타워 하우스 착공#!\n#F 메이슨은 Sana'a의 우뚝 솟은 타워 하우스를 위한 첫 번째 현무암과 벽돌 코스를 깔았고, 산악 도시는 마침내 계획자들이 약속한 하늘을 향해 오르기 시작했습니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_206:0 "[tv_wonder_ceremony|E]: 타워 하우스 착공"
 TV_WONDER_CEREMONY_S4_DESC_206:0 "석공들은 사나의 우뚝 솟은 타워 하우스를 위해 현무암과 벽돌의 첫 번째 코스를 깔았고, 산악 도시는 마침내 계획자들이 약속한 하늘을 향해 오르기 시작했습니다.\n\n#weak 식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_206:0 "Sana'a가 약속한 하늘을 향해 올라갈 수 있도록 우리는 첫 번째 돌을 스스로 놓았습니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_206:0 "석공들은 도구를 내려놓고 현무암 코스는 마당에서 사람의 손길이 닿지 않은 채 기다리고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_206:0 "@tv_ceremony_art_work!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_206:0 "#Y 진행 중#! — #high 석고 프리즈의 흔적이 남아있습니다#!\n#F 장인들은 모든 창문 주위에 흰색 석고 패턴을 다듬습니다. 이는 산빛을 받아 아라비아의 다른 집들로부터 사나의 집을 표시하기 위한 선세세공입니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_206:0 "#G 완료#! — #high 석고 프리즈의 흔적이 남아있습니다#!\n#F 장인들은 모든 창문 주위에 흰색 석고 패턴을 다듬습니다. 이는 산빛을 받아 사나의 집을 아라비아의 다른 집들로부터 표시하기 위한 선조세공입니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_206:0 "[tv_wonder_ceremony|E]：석고 프리즈가 추적됩니다"
 TV_WONDER_CEREMONY_S5_DESC_206:0 "장인들은 산의 빛을 받아 사나의 집을 아라비아의 다른 집들과 구별하기 위해 모든 창문 주위에 흰색 석고 패턴을 다듬습니다. \n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_206:0 "손이 석고 위에 흔적을 남긴 것을 빛은 영원히 기억합니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_206:0 "우리는 장인들에게 창문이 조금 더 오래 노출될 수 있다고 말합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_206:0 "@tv_ceremony_market!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_206:0 "#Y 진행 중#! — #high 무역으로 가득 찬 시장#!\n#F 향, 커피, 망치질한 금속 세공품의 가판대가 새로운 길을 가득 메우고, 도시 자체가 시야에 들어오기 훨씬 전에 고지대 시장의 냄새가 캐러밴 도로에 퍼집니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_206:0 "#G 완료#! — #high 무역으로 가득 찬 시장#!\n#F 향, 커피, 망치질한 금속 세공품 노점이 새로운 길을 가득 메우고, 고지대 시장의 냄새가 도시가 들어오기 훨씬 전에 캐러밴 도로에 닿습니다. view.#!"
 TV_WONDER_CEREMONY_S6_TITLE_206:0 "[tv_wonder_ceremony|E]：시장은 무역으로 가득 차 있습니다"
 TV_WONDER_CEREMONY_S6_DESC_206:0 "향, 커피, 망치로 만든 금속 세공품의 가판대들이 새로운 길을 가득 메우고, 도시 자체가 시야에 들어오기 훨씬 전에 고지대 시장의 냄새가 캐러밴 도로에 도달합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_206:0 "상인들은 시장이 넘칠 때까지 향, 커피, 망치질한 금속으로 새로운 길을 가득 채웁니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_206:0 "서둘러 개장한 시장은 곧 잊혀지는 시장이다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_206:0 "@tv_ceremony_holy_site!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_206:0 "#Y 진행 중#! — #high 지붕 위로 솟아오른 첨탑#!\n#F 모스크 첨탑이 타워 하우스 위로 올라가며, 새벽 시장부터 저녁 장사까지 바쁜 1/4 이상을 기도에 대한 부르짖음으로 전달합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_206:0 "#G 완료#! — #high 지붕 위로 솟아오른 첨탑#!\n#F 모스크 첨탑은 탑 위의 집 위로 올라가며, 새벽 시장부터 저녁 장사까지 바쁜 1/4 이상을 기도에 대한 부르짖음으로 전달합니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_206:0 "[tv_wonder_ceremony|E]: 지붕 위로 솟아오른 첨탑"
 TV_WONDER_CEREMONY_S7_DESC_206:0 "모스크 첨탑은 타워 하우스 위로 올라가며, 새벽 시장부터 저녁 장사까지 분주하게 4분의 1 이상을 전달하기 위해 기도를 요청합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_206:0 "우리는 기도의 부름이 이 구역의 모든 옥상에 전달될 수 있도록 첨탑을 직접 높입니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_206:0 "석공들은 반쯤 지어진 첨탑을 떠나고, 기도하라는 부름은 또 다른 새벽을 기다립니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_206:0 "@tv_ceremony_prosperity!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_206:0 "#Y 진행 중#! — #high 구시가지 완성#!\n#F 사나'a는 완성되었으며, 탑 주택과 지붕이 덮인 시장이 산빛 아래 번성하고 있으며, 오늘부터 이 곳의 무역과 평판은 고개 너머로 왕국의 이름을 이어가고 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_206:0 "#G 완료#! — #high 구시가지 완성#!\n#F 사나'a는 완성되었으며, 탑 주택과 지붕이 있는 시장은 산빛 아래 번성하고 있으며, 오늘부터 이 지역의 무역과 명성은 고개 너머로 왕국의 이름을 이어가고 있습니다.#!"
 TV_WONDER_CEREMONY_S8_TITLE_206:0 "[tv_wonder_ceremony|E]：구시가지가 완성되었습니다"
 TV_WONDER_CEREMONY_S8_DESC_206:0 "Sana'a는 완성되었으며, 탑 주택과 지붕이 있는 시장은 산빛 아래 번성하고 있으며, 오늘부터 이곳의 무역과 명성은 고개 너머로 왕국의 이름을 이어가고 있습니다.\n\n#weak 의식을 완료하는 데 필요한 가격을 지불하세요. 결과적으로 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_206:0 "사나(Sana'a)는 마침내 완성되었고, 캐러밴은 산길 너머 멀리까지 그 이름을 이어가고 있습니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_206:0 "우리는 구시가지가 아직 완성되지 않았다고 선언하고, 그 이름이 고개에서 좀 더 기다려지도록 놔두겠습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_207:0 "@tv_ceremony_government!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_207:0 "#Y 진행 중#! — #high 왕이 새로운 자리를 선포하다#!\n#F 합스부르크 궁정은 비엔나 외곽의 오래된 사냥터가 유럽의 모든 대사를 맞이할 만한 궁전을 갖게 될 것이라고 선언했습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_207:0 "#G 완료#! — #high 왕실이 새 자리를 선포하다#!\n#F 합스부르크 궁정은 비엔나 외곽의 옛 사냥터가 유럽의 모든 대사를 맞이할 만한 궁전을 갖게 될 것이라고 선언했습니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_207:0 "[tv_wonder_ceremony|E]:왕관이 새 자리를 선포하다"
 TV_WONDER_CEREMONY_S1_DESC_207:0 "합스부르크 궁정은 비엔나 외곽의 오래된 사냥터가 유럽의 모든 대사를 맞이할 만한 궁전을 갖게 될 것이라고 선언합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_207:0 "법원은 오래된 사냥터를 유럽 대사들의 미래 자리로 선포했습니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_207:0 "우리는 아직 이 땅을 궁전으로 명명할 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_207:0 "@tv_ceremony_build_icon!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_207:0 "#Y 진행 중#! — #high 피셔 폰 에를라흐(Fischer von Erlach)가 자신의 계획을 제시합니다.#!\n#F 궁정 건축가는 황후 앞에 넓은 그림을 그려 황실의 노란색 외관과 언덕 꼭대기 글로리엣을 향해 올라가는 정원을 약속합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_207:0 "#G 완료#! — #high Fischer von Erlach가 자신의 계획을 제시합니다.#!\n#F 궁정 건축가는 황후 앞에 넓은 그림을 그려 황실의 노란색 외관과 언덕 꼭대기 글로리엣을 향해 올라가는 정원을 약속합니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_207:0 "[tv_wonder_ceremony|E]:Fischer von Erlach가 자신의 계획을 제시합니다."
 TV_WONDER_CEREMONY_S2_DESC_207:0 "궁정 건축가는 황후 앞에 넓은 그림을 그리며 황실의 노란색 외관과 언덕 꼭대기 글로리엣을 향해 올라가는 정원을 약속합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_207:0 "건축가는 그림을 펼치고 황후는 고개를 끄덕이며 동의합니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_207:0 "황후는 노란색 외관과 언덕 꼭대기의 어리석은 짓에 확신을 갖지 못한 채 그림을 제쳐두었습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_207:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_207:0 "#Y 진행 중#! — #high 땅이 정리되고 축복받았습니다#!\n#F 법원 성직자는 건물 부지를 축복하고 측량사는 오래된 땅 전체에 길과 분수를 측량하며 첫 번째 돌은 기초 공물로 따로 보관됩니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_207:0 "#G 완료#! — #high 땅이 정리되고 축복받았습니다#!\n#F 법원 성직자는 건물 부지를 축복하고 측량사는 오래된 땅 전체에 길과 분수를 측설하고 첫 번째 돌은 기초로 따로 둡니다. 제공.#!"
 TV_WONDER_CEREMONY_S3_TITLE_207:0 "[tv_wonder_ceremony|E]: 땅이 깨끗해지고 축복받았습니다"
 TV_WONDER_CEREMONY_S3_DESC_207:0 "법원 성직자는 건물 부지를 축복하고 측량사는 오래된 땅 전체에 거리와 분수를 측설하고 첫 번째 돌은 기초 제물로 따로 보관합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_207:0 "우리는 첫 번째 돌을 치우고 이 땅에 하늘의 축복을 구합니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_207:0 "측량사는 그들의 지분을 철회하고 축복은 더 조용한 날을 기다립니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_207:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_207:0 "#Y 진행 중#! — #high 궁전 날개 착공#!\n#F 석공과 목수들이 궁전의 첫 번째 날개를 올리기 시작하고, 피셔 폰 에를라흐의 그림에서만 살던 것이 마침내 비엔나를 따라 비계로 떠오릅니다. 도로.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_207:0 "#G 완료#! — #high 궁전 날개 착공#!\n#F 석공과 목수들이 궁전의 첫 번째 날개를 올리기 시작하고, 피셔 폰 에를라흐의 그림에서만 살던 것이 마침내 비엔나를 따라 비계로 떠오릅니다. 도로.#!"
 TV_WONDER_CEREMONY_S4_TITLE_207:0 "[tv_wonder_ceremony|E]: 궁전 날개 착공"
 TV_WONDER_CEREMONY_S4_DESC_207:0 "석공과 목수들이 궁전의 첫 번째 날개를 올리기 시작하고, Fischer von Erlach의 그림에서만 살던 것이 마침내 비엔나 도로를 따라 비계로 세워졌습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_207:0 "석공과 목수들이 첫 번째 비계를 들어올리고, Fischer von Erlach의 그림이 마침내 길을 따라 형태를 갖추었습니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_207:0 "날개가 솟아오르기 전에 우리는 석공들을 잠시 동안 붙잡아 두었습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_207:0 "@tv_ceremony_painter!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_207:0 "#Y 진행 중#! — #high 외관이 임페리얼 노란색으로 변모했습니다#!\n#F 미장공은 언젠가 유럽 전역에서 쇤브룬 노란색으로 알려지게 될 연한 노란색으로 긴 외관을 마감하며, 창마다 흰색 돌 장식으로 프레임을 구성합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_207:0 "#G 완료#! — #high 외관이 임페리얼 노란색으로 변모했습니다#!\n#F 미장공은 언젠가 유럽 전역에서 간단하게 쇤부른 노란색으로 알려지게 될 옅은 노란색으로 긴 외관을 마감하며, 창마다 흰색 돌 장식으로 프레임을 구성합니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_207:0 "[tv_wonder_ceremony|E]: 외관이 황실 노란색을 띠고 있습니다."
 TV_WONDER_CEREMONY_S5_DESC_207:0 "미장공들은 언젠가 유럽 전역에서 쇤부른 노란색으로 알려지게 될 연한 노란색으로 긴 외관을 마감하고, 창문 하나하나를 흰 돌 장식으로 장식합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_207:0 "미장공은 긴 정면을 연한 노란색으로 봉인하고 창틀은 흰색 돌로 장식했습니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_207:0 "미장이들은 흙손을 내려놓고 정면은 반은 창백하고 반은 돌로 남겨 두었습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_207:0 "@tv_ceremony_building_levels!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_207:0 "#Y 진행 중#! — #high 글로리에테가 언덕을 장식하다#!\n#F 노동자들이 궁전 뒤 언덕에 아치형 글로리에테를 세웁니다. 이는 모든 창문에서 볼 수 있고 떠나는 대사가 마지막으로 기억하는 어리석은 일입니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_207:0 "#G 완료#! — #high 글로리에테가 언덕을 장식하다#!\n#F 노동자들이 궁전 뒤 언덕에 아치형 글로리에테를 세웁니다. 이는 모든 창문에서 볼 수 있고 떠나는 대사가 마지막으로 볼 수 있는 어리석은 일입니다. 기억합니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_207:0 "[tv_wonder_ceremony|E]: 글로리에트가 언덕을 장식하다"
 TV_WONDER_CEREMONY_S6_DESC_207:0 "노동자들은 궁전 뒤 언덕에 아치형 글로리에테를 세웁니다. 이는 모든 창문에서 볼 수 있고 떠나는 대사가 마지막으로 기억하는 어리석은 일입니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_207:0 "마침내 언덕에 왕관이 생겼습니다!"
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_207:0 "인부들은 언덕 꼭대기를 맨손으로 남겨두고 궁전의 창문에는 빈 풀만 보입니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_207:0 "@tv_ceremony_food_productivity!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_207:0 "#Y 진행 중#! — #high 정식 정원이 마련되었습니다.#!\n#F 정원사들은 궁전까지 정확한 갈래와 나무 길을 잘라 방문 법원이 정문에 도달하기 전에 왕조의 질서와 취향을 판단할 수 있도록 합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_207:0 "#G 완료#! — #high 정식 정원이 마련되었습니다#!\n#F 정원사들은 궁전까지 정확한 갈래와 나무 길을 잘라 방문 법원이 왕조의 질서와 취향을 그들이 전면에 도달하기 전에 판단할 수 있도록 합니다. 문.#!"
 TV_WONDER_CEREMONY_S7_TITLE_207:0 "[tv_wonder_ceremony|E]：정식 정원이 놓여 있다"
 TV_WONDER_CEREMONY_S7_DESC_207:0 "정원사들은 궁전까지 이어지는 나무 길을 정밀하게 잘라 방문 법원이 왕조의 질서와 맛을 정문에 도달하기 전에 판단할 수 있도록 합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우에는 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_207:0 "정원사는 궁전 문까지 정확한 파테르와 도로를 절단합니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_207:0 "아직은 아닙니다. 들풀이 아무도 판단하지 못하게 하십시오!"
 TV_WONDER_CEREMONY_CARD_ICON_S8_207:0 "@tv_ceremony_diplomacy!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_207:0 "#Y 진행 중#! — #high 쇤브룬이 유럽 법원을 받다#!\n#F 궁전은 정원에 완벽하게 자리잡고 있으며 이제 궁중, 외교관, 군주가 노란색 외관 아래 모여서 진행되는 모든 협상에 왕조의 명성을 실어 나릅니다. 지붕.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_207:0 "#G 완료#! — #high 쇤브룬이 유럽 법원을 받음#!\n#F 궁전은 정원에 완벽하게 자리잡고 있으며 이제 궁중, 외교관, 군주가 노란색 외관 아래 모여서 진행되는 모든 협상에 왕조의 명성을 실어 나릅니다. 지붕.#!"
 TV_WONDER_CEREMONY_S8_TITLE_207:0 "[tv_wonder_ceremony|E]：쇤브룬, 유럽 법원에 접수"
 TV_WONDER_CEREMONY_S8_DESC_207:0 "궁전은 정원으로 완벽하게 서 있고, 이제 궁중, 외교관, 군주들이 노란색 외관 아래에 모여 지붕 아래에서 진행되는 모든 협상에 왕조의 위신을 가져옵니다.\n\n#weak 의식을 완료하는 데 필요한 가격을 지불하세요. 결과적으로 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_207:0 "마침내 군주와 사절들이 노란색 정면 아래로 모이자 정원은 조용해졌습니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_207:0 "성문은 한동안 닫혀 있으며 유럽의 법원은 정원 너머에서 기다리고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_208:0 "@tv_ceremony_law!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_208:0 "#Y 진행 중#! — #high 황금 황소의 이름 프랑크푸르트#!\n#F 황제 법령에 따라 프랑크푸르트 암 마인은 선제후들이 로마 왕을 선택하기 위해 모이는 장소로 확정되었으며, 도시는 프랑크푸르트에 걸맞은 홀을 건설하라는 명령을 받았습니다. 명예.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_208:0 "#G 완료#! — #high 황금 황소의 이름 프랑크푸르트#!\n#F 황제 법령에 따라 프랑크푸르트 암 마인은 선제후들이 로마 왕을 선택하기 위해 모이는 장소로 확정되었으며, 도시는 프랑크푸르트에 걸맞는 홀을 건설하라는 명령을 받았습니다. 명예.#!"
 TV_WONDER_CEREMONY_S1_TITLE_208:0 "[tv_wonder_ceremony|E]:황금 황소가 프랑크푸르트를 지명하다"
 TV_WONDER_CEREMONY_S1_DESC_208:0 "제국 칙령에 따라 프랑크푸르트 암 마인은 선제후들이 모여 로마 왕을 선택해야 하는 장소로 정해졌으며, 도시는 그 명예에 걸맞은 홀을 지으라는 명령을 받았습니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 대가를 지불하고, 아니면 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_208:0 "나는 황금 황소의 법령에 프랑크푸르트의 명예를 맹세합니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_208:0 "의회는 황제의 책임에 대한 답변을 연기합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_208:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_208:0 "#Y 진행 중#! — #high 로머 광장이 정리되었습니다.#!\n#F 시의회 의원들이 로머 옆에 새 의회를 위한 공간을 확보하고 각 유권자의 사절이 순위, 좌석 및 우선 순위에 대한 지침을 보냅니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_208:0 "#G 완료#! — #high 로머 광장이 정리되었습니다.#!\n#F 시의회 의원들이 로머 옆에 새 의회를 위한 공간을 확보하고 각 유권자의 사절이 순위, 좌석 및 우선 순위에 대한 지침을 보냅니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_208:0 "[tv_wonder_ceremony|E]：로머 광장이 정리되었습니다"
 TV_WONDER_CEREMONY_S2_DESC_208:0 "시민 의원들은 Roemer 옆에 새 회의장을 위한 공간을 정리하고 각 유권자의 사절은 순위, 좌석 및 우선순위에 대한 지침을 보냅니다.\n\n#weak 식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_208:0 "마침내 광장을 건설할 우리의 것이 되었습니다!"
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_208:0 "나는 모든 사절의 우선순위가 결정될 때까지 기다리는 편이 낫습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_208:0 "@tv_ceremony_building_needs!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_208:0 "#Y 진행 중#! — #high 목재와 도장이 수집됩니다#!\n#F 목수들은 의회의 대들보로 사용할 노련한 참나무를 선택하고 사무원은 향후 모든 모임을 관리할 선거인의 인장과 판례서를 조립합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_208:0 "#G 완료#! — #high 목재와 인장이 수집됩니다#!\n#F 목수들은 의회의 기둥으로 양념한 참나무를 선택하고 서기는 향후 모든 모임을 관리할 선거인의 인장과 판례서를 조립합니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_208:0 "[tv_wonder_ceremony|E]：목재와 인장이 모인다"
 TV_WONDER_CEREMONY_S3_DESC_208:0 "목수들은 회의장 기둥에 사용할 노련한 참나무를 선택하고 서기는 향후 모든 모임을 관리할 선거인의 인장과 판례서를 조립합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_208:0 "목수는 최고급 참나무에 표시를 하고 사무원은 선행 도서를 봉인합니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_208:0 "아직은 아닙니다. 씰이 거의 건조되지 않았습니다!"
 TV_WONDER_CEREMONY_CARD_ICON_S4_208:0 "@tv_ceremony_organization!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_208:0 "#Y 진행 중#! — #high 회의실 프레임 상승#!\n#F 목재 골조공이 홀의 첫 번째 들보를 Roemer 옆에 올리고 양피지에 그려졌던 것이 마침내 광장 위에 참나무와 돌의 해골로 서 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_208:0 "#G 완료#! — #high 회의실 프레임 상승#!\n#F 목재 골조 제작자가 Roemer 옆에 있는 홀의 첫 번째 들보를 들어올리고, 양피지에 그려졌던 것은 마침내 광장 위에 참나무와 돌의 해골로 서 있습니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_208:0 "[tv_wonder_ceremony|E]：회의실의 틀이 올라간다"
 TV_WONDER_CEREMONY_S4_DESC_208:0 "목재 골조 제작자들이 Roemer 옆에 홀의 첫 번째 들보를 올렸고, 양피지에 그려졌던 것이 마침내 광장 위에 참나무와 돌의 뼈대로 서 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_208:0 "나는 우리의 양피지 계획이 마침내 참나무와 돌로 변하는 것을 지켜봅니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_208:0 "프레이머들은 잠시 멈췄고, 광선은 여전히 땅에 닿지 않은 채 놓여 있었습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_208:0 "@tv_ceremony_alliance!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_208:0 "#Y 진행 중#! — #high 선거인의 깃발이 걸려있습니다#!\n#F 황실의 깃발과 각 유권자의 팔이 회의장 벽을 따라 걸려 있으며, 여기에서 개최되는 모든 선거를 지배할 우선 순위를 나무와 천으로 고정합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_208:0 "#G 완료#! — #high 선거인의 깃발이 걸려있습니다#!\n#F 제국의 깃발과 각 유권자의 팔이 회의장 벽을 따라 걸려 있으며, 여기에서 개최되는 모든 선거를 지배할 우선 순위를 나무와 천으로 고정합니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_208:0 "[tv_wonder_ceremony|E]：선거인의 깃발이 걸려있습니다"
 TV_WONDER_CEREMONY_S5_DESC_208:0 "각 유권자의 제국 깃발과 문장이 회의장 벽을 따라 걸려 이곳에서 열리는 모든 선거에 적용되는 우선 순위를 나무와 천으로 고정합니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_208:0 "배너가 걸리면 순서도 고정됩니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_208:0 "나는 아직 나무와 천으로 이 순서를 정할 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_208:0 "@tv_ceremony_parliament!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_208:0 "#Y 진행 중#! — #high 의회 벤치가 설정되었습니다#!\n#F 참가자들은 선제후들이 엄격한 순서로 앉을 자리를 완성하고 논쟁을 벌일 수 있을 만큼 가깝고 어떤 선거인도 자신의 자리에서 모욕을 주장할 수 없을 만큼 격식을 차렸습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_208:0 "#G 완료#! — #high 의회 벤치가 설정되었습니다.#!\n#F 참가자들은 선제후들이 엄격한 순서로 앉을 자리를 완성하고 논쟁을 벌일 수 있을 만큼 가깝고 어떤 선거인도 모욕을 당할 수 없을 만큼 격식을 차렸습니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_208:0 "[tv_wonder_ceremony|E]：의회 벤치가 준비되었습니다"
 TV_WONDER_CEREMONY_S6_DESC_208:0 "참여자들은 선제후들이 엄격한 순서로 앉아 논쟁을 벌일 수 있을 만큼 가깝고 어떤 선거인도 자신의 자리에 대해 모욕을 주장할 수 없을 만큼 격식을 차린 조각된 벤치를 완성합니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 대가를 지불하거나 아직 때가 되지 않은 경우에는 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_208:0 "조이너들은 마지막 조각된 벤치를 주문한 위치에 정확하게 설치했습니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_208:0 "이제 조심하세요. 잘못된 벤치 하나가 왕자를 화나게 합니다!"
 TV_WONDER_CEREMONY_CARD_ICON_S7_208:0 "@tv_ceremony_political_power!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_208:0 "#Y 진행 중#! — #high 첫 번째 논쟁의 여지가 있는 선거#!\n#F 경쟁 후보와 그들의 대리인이 첫 번째 경쟁 투표 동안 미완성된 회의장을 가득 메웠고, 이 홀은 투표를 통해 제국이 만들어지고 무너지는 장소로 명성을 얻었습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_208:0 "#G 완료#! — #high 첫 번째 논쟁의 여지가 있는 선거#!\n#F 경쟁 후보와 그들의 대리인이 첫 번째 경쟁 투표 동안 미완성된 회의장을 가득 메우고 홀은 투표로 제국이 만들어지고 무너지는 장소로 명성을 얻습니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_208:0 "[tv_wonder_ceremony|E]：첫 번째 논쟁의 여지가 있는 선거"
 TV_WONDER_CEREMONY_S7_DESC_208:0 "첫 번째 경쟁 투표가 진행되는 동안 라이벌 후보자들과 그 대리인들이 미완성 회의실을 가득 메우고 홀은 투표로 제국이 만들어지고 무너지는 장소로 명성을 얻습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_208:0 "나는 제국이니 뭐니 해도 투표용지를 아무데나 떨어뜨리도록 두었습니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_208:0 "라이벌 요원들의 소란에 맞서 방의 문은 계속 잠겨 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_208:0 "@tv_ceremony_legitimacy!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_208:0 "#Y 진행 중#! — #high 선거 홀 선서 완료#!\n#F 의회는 Roemer 옆에 세워져 있고 벤치와 배너는 영구적으로 정리되어 있으며 오늘부터 왕국이 합법적인 통치에 대해 주장하는 모든 주장은 프랑크푸르트 선거인의 무게를 짊어집니다. it.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_208:0 "#G 완료#! — #high 선거 홀 선서 완료#!\n#F 의회는 Roemer 옆에 서 있고, 벤치와 배너는 영구적으로 정리되어 있으며, 오늘부터 왕국이 합법적인 통치에 대해 주장하는 모든 주장은 프랑크푸르트 선거인의 무게를 짊어집니다. it.#!"
 TV_WONDER_CEREMONY_S8_TITLE_208:0 "[tv_wonder_ceremony|E]：선거 홀 완성 선서"
 TV_WONDER_CEREMONY_S8_DESC_208:0 "회의장 스탠드는 Roemer 옆에 완성되었으며, 그 벤치와 배너는 영구적인 순서로 놓여 있으며, 오늘부터 왕국이 정당한 통치에 대해 주장하는 모든 주장은 그 뒤를 잇는 프랑크푸르트 선거인의 무게를 짊어집니다.\n\n#weak 의식을 완료하는 데 필요한 가격을 지불하십시오. 그 결과 불가사의의 최종 건물이 세워질 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_208:0 "보좌는 법으로 지어진 방 위에 가장 확실하게 서 있습니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_208:0 "나는 아직 왕국의 합법성을 이 전당에 묶을 생각이 없기 때문에 마지막 맹세를 유보합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_209:0 "@tv_ceremony_government!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_209:0 "#Y 진행 중#! — #high 샤를마뉴가 자신의 예배당을 선포하다#!\n#F 프랑크 왕은 아헨의 따뜻한 샘에 있는 궁정 옆에 그의 신앙과 제국을 모두 장식할 궁궐 예배당이 세워질 것이라고 선언합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_209:0 "#G 완료#! — #high 샤를마뉴가 자신의 예배당을 선포#!\n#F 프랑크 왕은 아헨의 따뜻한 샘에 있는 그의 궁정 옆에 그의 신앙과 제국을 모두 장식할 궁궐 예배당이 세워질 것이라고 선언합니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_209:0 "[tv_wonder_ceremony|E]：샤를마뉴가 자신의 예배당을 선포하다"
 TV_WONDER_CEREMONY_S1_DESC_209:0 "프랑크 왕은 아헨의 따뜻한 샘에 있는 그의 궁정 옆에 그의 신앙과 제국 모두를 위한 궁정 예배당이 세워질 것이라고 선언합니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_209:0 "샤를마뉴가 선언문을 봉인하고 예배당은 따뜻한 샘 옆에 위치하도록 지정되었습니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_209:0 "우리는 아직 이 예배당의 건립을 확정할 준비가 되지 않았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_209:0 "@tv_ceremony_build_icon!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_209:0 "#Y 진행 중#! — #high 메츠의 오도가 팔각형을 그립니다.#!\n#F 궁정 건축가는 라벤나의 교회를 뼈대로 그려서 알프스 북부와는 다른 8면 예배당의 디자인을 제시합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_209:0 "#G 완료#! — #high 메츠의 오도가 팔각형을 그립니다.#!\n#F 궁정 건축가는 라벤나의 교회를 뼈대로 그려서 알프스 북쪽과는 다른 8면 예배당을 위한 디자인을 제시합니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_209:0 "[tv_wonder_ceremony|E]：메츠의 오도가 팔각형을 그립니다"
 TV_WONDER_CEREMONY_S2_DESC_209:0 "궁정 건축가는 라벤나 교회의 뼈대를 본떠 알프스 북부와는 다른 8면 예배당 디자인을 제시합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_209:0 "메츠의 오도(Odo of Metz)는 그의 팔각형 그림을 법원 앞에 놓고 디자인이 승인되었습니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_209:0 "성급하게 세운 계획은 비뚤어진 벽을 세운다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_209:0 "@tv_ceremony_supply!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_209:0 "#Y 진행 중#! — #high 대리석은 로마에서 가져옴#!\n#F 황제의 명령에 따라 반암과 대리석 기둥이 로마와 라벤나에서 북쪽으로 운반되고 석공들은 이전에 프랑크족에서는 볼 수 없었던 돌을 받기 위해 기초를 준비합니다. lands.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_209:0 "#G 완료#! — #high 대리석은 로마에서 가져옵니다#!\n#F 황제의 명령에 따라 반암과 대리석 기둥이 로마와 라벤나에서 북쪽으로 운반되고, 석공들은 이전에 프랑크족에서는 볼 수 없었던 돌을 받기 위해 기초를 준비합니다. lands.#!"
 TV_WONDER_CEREMONY_S3_TITLE_209:0 "[tv_wonder_ceremony|E]:대리석은 로마에서 가져온 것입니다."
 TV_WONDER_CEREMONY_S3_DESC_209:0 "황제의 명령에 따라 반암과 대리석 기둥이 로마와 라벤나에서 북쪽으로 운반되고 석공들은 이전에 프랑크 땅에서 볼 수 없었던 돌을 받기 위해 기초를 준비합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하거나 아직 때가 되지 않은 경우에는 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_209:0 "우리는 로마의 대리석을 북쪽의 아헨으로 가져오는 데 비용을 아끼지 않습니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_209:0 "법원은 망설이고 대리석은 배송되지 않은 채 로마와 라벤나에 남아 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_209:0 "@tv_ceremony_holy_site!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_209:0 "#Y 진행 중#! — #high 팔각형의 벽이 솟아오른다#!\n#F 건축가들은 아헨에서 팔각형 코어의 첫 번째 고리를 세웠고, 샤를마뉴의 선언은 마침내 샘 옆에 솟아오르는 돌이 되었습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_209:0 "#G 완료#! — #high 팔각형의 벽이 솟아오른다#!\n#F Builders는 아헨에서 팔각형 코어의 첫 번째 고리를 설정했고 샤를마뉴의 선언은 마침내 샘 옆에 솟아오르는 돌이 되었습니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_209:0 "[tv_wonder_ceremony|E]：옥타곤의 벽이 솟아오른다"
 TV_WONDER_CEREMONY_S4_DESC_209:0 "건축업자들은 아헨에 팔각형 코어의 첫 번째 고리를 세웠고, 샤를마뉴의 선언은 마침내 샘 옆에 솟아오르는 돌이 되었습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_209:0 "메이슨은 첫 번째 돌 고리를 놓았고, 마침내 팔각형이 땅에서 솟아올랐습니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_209:0 "우리는 아직 이러한 기반을 마련할 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_209:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_209:0 "#Y 진행 중#! — #high 로마 기둥이 세워졌습니다.#!\n#F 고대 반암 기둥이 예배당의 상부 갤러리 내부에 들어 올려져 새로운 제국의 예배당을 옛 로마의 영광에 묶습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_209:0 "#G 완료#! — #high 로마 기둥이 세워졌습니다.#!\n#F 고대 반암 기둥이 예배당의 상부 갤러리 내부에 들어 올려져 새로운 제국의 예배당을 옛 로마의 영광에 묶습니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_209:0 "[tv_wonder_ceremony|E]：로마 기둥이 솟아오른다"
 TV_WONDER_CEREMONY_S5_DESC_209:0 "고대 반암 기둥은 예배당의 상부 갤러리 내부에 들어 올려져 새로운 제국의 예배당을 옛 로마의 영광에 묶어줍니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_209:0 "인부들은 고대 반암 기둥을 회랑으로 들어 올려 예배당을 옛 로마의 영광에 묶었습니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_209:0 "기둥은 아래 상자에 남아 있고 갤러리는 한동안 비어 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_209:0 "@tv_ceremony_gold!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_209:0 "#Y 진행 중#! — #high 황금 신전이 완성되었습니다#!\n#F 금세공인들이 예배당의 가장 성스러운 유물을 보관하기 위한 위대한 유물함을 완성했으며, 금박 패널이 돔 아래 촛불을 받고 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_209:0 "#G 완료#! — #high 황금 신전이 완성되었습니다#!\n#F 금세공인들이 예배당의 가장 성스러운 유물을 보관하기 위한 위대한 유물함을 완성했으며, 금박 패널이 돔 아래 촛불을 받고 있습니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_209:0 "[tv_wonder_ceremony|E]: 황금 신전이 완성되었습니다"
 TV_WONDER_CEREMONY_S6_DESC_209:0 "금세공인들이 예배당의 가장 성스러운 유물을 보관하기 위한 거대한 성물함을 완성했습니다. 금박 패널이 돔 아래 촛불을 받고 있습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_209:0 "우리는 금세공인에게 우리의 가장 신성한 유물을 보관할 성소를 완성하도록 의뢰합니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_209:0 "금세공인들이 연장을 내려놓고, 신사의 금박 작업이 끝나지 않은 채 기다리고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_209:0 "@tv_ceremony_ruler!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_209:0 "#Y 진행 중#! — #high 왕좌가 설정되었습니다.#!\n#F A 일반 대리석 왕좌가 상부 갤러리에 배치되어 미래의 왕이 아래 제단이 보이는 곳에 왕관을 씌울 수 있도록 배치되었습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_209:0 "#G 완료#! — #high 왕좌가 설정되었습니다.#!\n#F A 일반 대리석 왕좌가 상부 갤러리에 배치되어 미래의 왕이 아래 제단이 보이는 곳에 왕관을 씌울 수 있도록 배치되었습니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_209:0 "[tv_wonder_ceremony|E]:왕좌가 설정되었습니다"
 TV_WONDER_CEREMONY_S7_DESC_209:0 "일반 대리석 왕좌가 상부 회랑에 배치되어 미래의 왕이 아래 제단이 보이는 곳에 왕관을 씌울 수 있도록 배치되어 있습니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_209:0 "메이슨은 아래 제단이 보이는 갤러리에 대리석 왕좌를 설치했습니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_209:0 "우리는 아직 미래의 왕들이 즉위할 왕좌를 세울 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_209:0 "@tv_ceremony_religious_influence!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_209:0 "#Y 진행 중#! — #high 아헨이 봉헌되었습니다#!\n#F 팔라틴 예배당은 샤를마뉴의 궁정 옆에 봉헌되어 있으며, 왕좌와 유물은 왕관과 제단을 하나로 묶고 있으며, 오늘부터 왕국의 통치자들은 돔.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_209:0 "#G 완료#! — #high Aachen이 봉헌되었습니다#!\n#F 팔라틴 예배당은 샤를마뉴의 궁정 옆에 봉헌되어 있으며, 왕좌와 유물은 왕관과 제단을 함께 묶고 있으며, 이날부터 왕국의 통치자들은 샤를마뉴의 지휘 아래 권위를 그립니다. 돔.#!"
 TV_WONDER_CEREMONY_S8_TITLE_209:0 "[tv_wonder_ceremony|E]：아헨이 봉헌되다"
 TV_WONDER_CEREMONY_S8_DESC_209:0 "팔라티노 예배당은 샤를마뉴의 궁정 옆에 봉헌되어 있으며, 그 왕좌와 유물은 왕관과 제단을 함께 묶고 있으며, 이날부터 왕국의 통치자들은 돔 아래에서 권위를 행사합니다.\n\n#weak 의식을 완료하는 데 필요한 가격을 지불하세요. 그 결과 불가사의의 최종 건물이 세워질 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_209:0 "주교는 예배당을 봉헌하고, 왕관과 제단은 돔 아래에 함께 묶여 있습니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_209:0 "성직자들은 의식을 연기했고 예배당은 축성되지 않은 돔 아래에서 조금 더 기다립니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_210:0 "@tv_ceremony_government!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_210:0 "#Y 진행 중#! — #high 황제가 능선에 자리를 앉히라고 명령하다#!\n#F 황제 칙령은 뉘른베르크 위의 사암 능선을 모든 미래의 황제가 법정에 서야 하는 성터로 지정하여 자유 도시의 행운을 다음과 같이 묶습니다. 크라운.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_210:0 "#G 완료#! — #high 황제가 능선에 자리를 앉히라고 명령하다#!\n#F 황제 칙령은 뉘른베르크 위의 사암 능선을 미래의 모든 황제가 법정에 서야 하는 성터로 지정하여 자유 도시의 재산을 다음과 같이 묶습니다. 크라운.#!"
 TV_WONDER_CEREMONY_S1_TITLE_210:0 "[tv_wonder_ceremony|E]：황제가 능선에 자리를 앉히라고 명령하다"
 TV_WONDER_CEREMONY_S1_DESC_210:0 "제국 칙령에서는 미래의 모든 황제가 법정을 열어 자유 도시의 재산을 왕위에 묶어야 하는 성이 있는 곳으로 뉘른베르크 위의 사암 능선을 지정했습니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_210:0 "황제의 인장이 능선 헌장에 찍혀 있습니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_210:0 "총리실은 지금은 헌장을 따로 보관해 두었습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_210:0 "@tv_ceremony_parliament!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_210:0 "#Y 진행 중#! — #high 의회에서 헌장 확인#!\n#F 황실 의회의 사절들이 뉘른베르크의 헌장과 성의 특권을 확인하고, 석공들은 능선에서 앞으로 나올 성벽과 탑을 조사합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_210:0 "#G 완료#! — #high 국회에서 헌장 확인#!\n#F 황실 의회의 사절들이 뉘른베르크의 헌장과 성의 특권을 확인하고, 석공들은 능선에서 앞으로 나올 성벽과 탑을 조사합니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_210:0 "[tv_wonder_ceremony|E]：국회가 헌장을 확정합니다"
 TV_WONDER_CEREMONY_S2_DESC_210:0 "제국 의회의 사절들은 뉘른베르크의 헌장과 성의 특권을 확인하고, 석공들은 성벽과 탑이 세워질 능선을 조사합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우에는 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_210:0 "다이어트가 말했습니다!"
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_210:0 "사절들은 봉인을 풀고 철수한다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_210:0 "@tv_ceremony_building_needs!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_210:0 "#Y 진행 중#! — #high 목재 및 사암 조립#!\n#F 채석공은 창백한 현지 사암을 자르고 목수는 참나무 기둥을 다듬습니다. 첫 번째 마차는 아래 작업장에서 도시 위의 능선까지 오르기 시작합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_210:0 "#G 완료#! — #high 목재 및 사암 조립#!\n#F 채석공은 창백한 현지 사암을 자르고 목수는 참나무 들보를 다듬습니다. 첫 번째 마차는 아래 작업장에서 도시 위의 능선까지 오르기 시작합니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_210:0 "[tv_wonder_ceremony|E]: 목재 및 사암 조립"
 TV_WONDER_CEREMONY_S3_DESC_210:0 "채석공은 창백한 사암을 자르고 목수는 참나무 들보를 다듬고 첫 번째 마차는 아래 작업장에서 도시 위의 능선으로 오르기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_210:0 "돌과 참나무를 실은 마차들이 비탈길을 신음하며 올라갑니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_210:0 "아직은 아닙니다. 채석장은 기다리도록 하세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S4_210:0 "@tv_ceremony_building_default!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_210:0 "#Y 진행 중#! — #high 성벽이 땅을 파다#!\n#F 석공들이 능선을 따라 커튼월의 첫 번째 코스를 놓았고 황제의 법령은 마침내 뉘른베르크 지붕 위에 돌처럼 솟아올랐습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_210:0 "#G 완료#! — #high 성벽이 땅을 파다#!\n#F 메이슨은 능선을 따라 커튼월의 첫 번째 코스를 놓았고 황제의 법령은 마침내 뉘른베르크 지붕 위에 돌처럼 솟아올랐습니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_210:0 "[tv_wonder_ceremony|E]: 성벽 착공"
 TV_WONDER_CEREMONY_S4_DESC_210:0 "석공들은 능선을 따라 커튼월의 첫 번째 코스를 놓았고 황제의 법령은 마침내 뉘른베르크 지붕 위에 돌로 세워졌습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_210:0 "우리는 황제의 이름으로 이 첫 번째 돌을 놓았습니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_210:0 "석공들은 도구를 내려놓고 명령을 기다립니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_210:0 "@tv_ceremony_building_levels!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_210:0 "#Y 진행 중#! — #high 신웰 타워가 올라갑니다.#!\n#F A 원형 성채가 성 중심부에 솟아 있으며, 보초가 아래 자유 도시로 이어지는 모든 길을 감시할 수 있을 만큼 충분히 높습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_210:0 "#G 완료#! — #high 신웰 타워가 올라갑니다.#!\n#F A 원형 성채가 성 중심부에 솟아 있으며 보초가 아래 자유 도시로 이어지는 모든 길을 감시할 수 있을 만큼 충분히 높습니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_210:0 "[tv_wonder_ceremony|E]: 신웰 타워가 오르다"
 TV_WONDER_CEREMONY_S5_DESC_210:0 "성 중심부에는 보초가 아래 자유 도시로 이어지는 모든 도로를 감시할 수 있을 만큼 충분히 높은 원형 성채가 솟아 있습니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_210:0 "더 높이!"
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_210:0 "차라리 이 탑이 좀 더 평온한 하늘을 기다리길 바랍니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_210:0 "@tv_ceremony_holy_site!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_210:0 "#Y 진행 중#! — #high 이중 예배당이 건축되었습니다#!\n#F 메이슨들은 성벽 안에 2층 예배당을 세웠습니다. 낮은 층은 가족을 위한 예배당이고 위쪽 갤러리는 황제의 예배를 위해 예약되어 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_210:0 "#G 완료#! — #high 이중 예배당이 건축되었습니다.#!\n#F 메이슨들은 성벽 안에 2층 예배당을 세웠습니다. 낮은 층은 가족을 위한 예배당이고, 위쪽 갤러리는 황제의 예배를 위해 예약되어 있습니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_210:0 "[tv_wonder_ceremony|E]：이중 예배당이 건립되었습니다"
 TV_WONDER_CEREMONY_S6_DESC_210:0 "메이슨은 벽 안에 2층 예배당을 세웠는데, 낮은 층은 가족을 위한 공간이고 위쪽 갤러리는 황제의 숭배를 위한 공간입니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_210:0 "메이슨은 위의 갤러리와 아래의 본당을 봉인합니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_210:0 "이번 시즌은 아닙니다. 예배당을 기다려주세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S7_210:0 "@tv_ceremony_cannons!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_210:0 "#Y 진행 중#! — #high 아스날 안뜰 채우기#!\n#F 내부 안뜰에는 무기고와 작업장이 붐비고 있으며 자유 도시로 진군할 수 있는 군대에 맞서 능선을 방어할 수비대를 무장하고 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_210:0 "#G 완료#! — #high 아스날 안뜰 채우기#!\n#F 내부 안뜰에는 무기고와 작업장이 붐비고 있으며, 자유 도시로 진군할 수 있는 군대에 맞서 능선을 지킬 수 있는 수비대를 무장하고 있습니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_210:0 "[tv_wonder_ceremony|E]：아스날 코트야드 필"
 TV_WONDER_CEREMONY_S7_DESC_210:0 "무기고와 작업장이 내부 안뜰에 붐비고 자유 도시로 행진할 수 있는 군대에 맞서 능선을 방어할 수비대를 무장시킵니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_210:0 "우리는 우리 도시를 공격하려는 모든 자들에 맞서 이 수비대를 무장시켰습니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_210:0 "갑옷 제작자는 상자를 쌓고 추가 동전을 기다립니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_210:0 "@tv_ceremony_defensive_military_stance!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_210:0 "#Y 진행 중#! — #high 제국의 성곽 완성됨#!\n#F 성은 뉘른베르크의 지붕 위에 완성되었으며 수비대는 뚫려 있었고 성벽은 오랜 세월에 걸쳐 검증되었습니다. 오늘부터 왕국의 모든 요새는 이 위에 건설된 것에 비해 조금 더 견고해졌습니다. 능선.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_210:0 "#G 완료#! — #high 황제의 성곽 완성#!\n#F 성은 뉘른베르크의 지붕 위에 세워졌고 수비대는 뚫려 있었고 성벽은 오랜 세월에 걸쳐 입증되었습니다. 오늘부터 왕국의 모든 요새는 이 위에 건설된 것에 비해 조금 더 견고해졌습니다. 능선.#!"
 TV_WONDER_CEREMONY_S8_TITLE_210:0 "[tv_wonder_ceremony|E]: 황성이 완성되다"
 TV_WONDER_CEREMONY_S8_DESC_210:0 "성은 뉘른베르크의 지붕 위에 완성되었으며, 수비대가 뚫려 있고 성벽은 비바람과 세월에 대비하여 입증되었습니다. 오늘부터 왕국의 모든 요새는 이 능선에 건설된 것에 비해 조금 더 견고해졌습니다.\n\n#weak 의식을 완료하는 데 필요한 가격을 지불하세요. 그 결과 불가사의의 최종 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_210:0 "벽이 잘 둘러싸인 능선은 잘 관리된 영역을 보호합니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_210:0 "나는 아직 이 성이 완성되었다고 말할 준비가 되지 않았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_211:0 "@tv_ceremony_law!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_211:0 "#Y 진행 중#! — #high 푸거 헌장이 봉인되었습니다.#!\n#F A 헌장이 봉인되어 상인 가문이 아우크스부르크에 은행 건물을 설립할 수 있도록 허가하고, 왕자들에게 신용을 보장하고 그것을 감히 확장하는 가문에 이익을 약속합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_211:0 "#G 완료#! — #high 푸거 헌장이 봉인되었습니다.#!\n#F A 헌장이 봉인되어 상인 가문이 아우크스부르크에 은행 건물을 설립할 수 있도록 허가하고, 왕자들에게 신용을 보장하고 그것을 감히 확장하는 가문에 이익을 약속합니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_211:0 "[tv_wonder_ceremony|E]：푸거 헌장 봉인"
 TV_WONDER_CEREMONY_S1_DESC_211:0 "상인 가문이 아우크스부르크에 은행 홀을 설립할 수 있도록 허가하는 헌장이 봉인되어 왕자들에게는 신용을, 이를 감히 확장하는 가문에는 이익을 약속합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_211:0 "봉인된 헌장은 왕자의 말보다 더 많은 신뢰를 얻습니다."
