 TV_WONDER_CEREMONY_CARD_ICON_S2_211:0 "@tv_ceremony_market!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_211:0 "#Y 진행 중#! — #high 계산 분기가 확보되었습니다.#!\n#F 요원은 도시의 무역 거리 근처 상인 구역의 부지를 확보했습니다. 길드홀과 충분히 가까워 택배사가 한 시간 내에 모든 원장에 도달할 수 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_211:0 "#G 완료#! — #high 계산 분기가 확보되었습니다.#!\n#F 요원은 도시의 무역 거리 근처 상인 구역의 부지를 확보합니다. 길드홀과 충분히 가까워 택배사가 한 시간 내에 모든 원장에 도달할 수 있습니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_211:0 "[tv_wonder_ceremony|E]：회계 분기가 확보되었습니다"
 TV_WONDER_CEREMONY_S2_DESC_211:0 "에이전트는 배달원이 한 시간 내에 모든 원장에 도달할 수 있을 만큼 길드홀과 충분히 가까운 도시의 무역 거리 근처 상인 구역에 부지를 확보합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_211:0 "대리인은 상인 구역을 집 소유로 표시합니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_211:0 "서둘러 지은 집은 얕은 땅 위에 서 있다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_211:0 "@tv_ceremony_gold_balance!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_211:0 "#Y 진행 중#! — #high Ledger 및 준비금이 모였습니다.#!\n#F 직원이 하우스의 개시 원장과 동전 준비금을 모으고, 먼 도시의 특파원은 아우크스부르크로 신용장을 전달하기 시작하라는 지시를 받습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_211:0 "#G 완료#! — #high Ledger 및 준비금이 모였습니다.#!\n#F 직원이 하우스의 개시 원장과 동전 준비금을 모으고, 먼 도시의 통신원은 아우크스부르크로 신용장을 전달하기 시작하라는 지시를 받습니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_211:0 "[tv_wonder_ceremony|E]：원장과 준비금이 수집됩니다"
 TV_WONDER_CEREMONY_S3_DESC_211:0 "직원들은 하우스의 개장 원장과 동전 보유고를 수집하고, 먼 도시의 특파원들은 아우크스부르크로 신용장을 전달하기 시작하라는 지시를 받습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_211:0 "우리는 원장을 열고 예비 코인을 모두 계산합니다."
