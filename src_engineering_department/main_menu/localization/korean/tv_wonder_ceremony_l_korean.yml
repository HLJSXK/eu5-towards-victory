 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_139:0 "#Y 진행 중#! — #high 천개 지방의 목재#!\n#F 공무원들은 먼 산림에서 견목을 징발하고, 바지선은 조선소에서 필요하지 않은 용골을 위한 빔을 운반하는 몇 달 동안 양쯔강을 붐빕니다. 이전.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_139:0 "#G 완료#! — #high 천개 지방의 목재#!\n#F 공무원들은 먼 산림에서 견목을 징발하고 바지선은 조선소에서 필요로 하지 않았던 용골을 위한 빔을 운반하는 몇 달 동안 양쯔강을 붐빕니다. 이전.#!"
 TV_WONDER_CEREMONY_S2_TITLE_139:0 "[tv_wonder_ceremony|E]：천개 성의 목재"
 TV_WONDER_CEREMONY_S2_DESC_139:0 "관리들은 먼 산림에서 견목을 징발하고, 바지선은 이전에는 조선소에서 필요로 하지 않았던 용골을 운반할 빔을 싣고 몇 달 동안 양쯔강으로 붐빕니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_139:0 "바지선은 Longjiang의 통로를 향해 목재를 운반하면서 양쯔강을 가득 채웁니다."
