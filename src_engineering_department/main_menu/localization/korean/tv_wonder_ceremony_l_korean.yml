 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_139:0 "#G 완료#! — #high 왕이 보물 함대를 파견#!\n#F 황제의 칙령에 따라 난징의 롱장 야드가 이전 조선소보다 확장되어 보물 함대가 왕조의 깃발을 가장 먼 곳까지 운반할 수 있습니다. 바다.#!"
