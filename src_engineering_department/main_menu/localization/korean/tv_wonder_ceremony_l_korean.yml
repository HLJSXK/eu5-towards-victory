 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_138:0 "#G 완료#! — #high 물이 정원에 도달합니다#!\n#F 마침내 카나트의 입에서 이스파한 아래 계단식 정원과 들판으로 물이 쏟아지고, 고원의 숨겨진 관개 기술은 왕국에 대한 영구적인 선물로 선포되었습니다. 토양.#!"
 TV_WONDER_CEREMONY_S8_TITLE_138:0 "[tv_wonder_ceremony|E]: 물이 정원에 도달합니다."
 TV_WONDER_CEREMONY_S8_DESC_138:0 "마침내 카나트의 입에서 이스파한 아래 계단식 정원과 들판으로 물이 쏟아지고, 고원의 숨겨진 관개 기술이 왕국의 땅에 영구적인 선물로 선언되었습니다.\n\n#weak 의식을 완료하는 데 필요한 가격을 지불하세요. 그 결과 경이로운 마지막 건물이 솟아오를 것입니다.#!"
