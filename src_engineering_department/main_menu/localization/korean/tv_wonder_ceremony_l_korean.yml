 TV_WONDER_CEREMONY_S2_DESC_198:0 "왕실 기술자들은 8개의 탑과 깊은 해자를 측설하여 왕실 무기고와 감옥으로도 사용할 수 있는 요새를 계획하고 있습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
