 TV_WONDER_CEREMONY_S6_TITLE_107:0 "[tv_wonder_ceremony|E]：인티와타나 돌이 새겨져 있습니다"
 TV_WONDER_CEREMONY_S6_DESC_107:0 "메이슨은 단일 화강암 노두에서 태양의 걸림돌인 인티우아타나를 조각하며, 그 각도는 다가올 모든 수확의 지점을 표시하도록 설정되어 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
