 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_141:0 "#Y 진행 중#! — #high 블루스톤 말굽이 설정되었습니다#!\n#F 오랜 여행을 거친 블루스톤이 마침내 고유한 말굽 패턴으로 사르센 고리 안에 놓였습니다. it.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_141:0 "#G 완료#! — #high 블루스톤 말굽이 설정되었습니다#!\n#F 오랜 여행을 거친 블루스톤이 마침내 자신만의 말굽 패턴으로 사르센 고리 안에 놓였습니다. it.#!"
 TV_WONDER_CEREMONY_S7_TITLE_141:0 "[tv_wonder_ceremony|E]：블루스톤 말굽 세트"
 TV_WONDER_CEREMONY_S7_DESC_141:0 "오랫동안 여행한 청석은 마침내 자신만의 말굽 패턴으로 사르센 고리 안에 놓이게 되는데, 이는 그것을 시작한 부족의 한 세대 이상 지속된 노동입니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_141:0 "한 세대가 시작하면 다른 세대는 돌처럼 끝날 수도 있습니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_141:0 "나는 모든 청석이 제대로 될 때까지 이 말굽을 닫지 않을 것입니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_141:0 "@tv_ceremony_time!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_141:0 "#Y 진행 중#! — #high 대형 삼석탑을 통해 태양이 뜬다#!\n#F 동지의 새벽에, 사제와 마을 사람들이 조용히 지켜보는 가운데 태양은 대삼석탑을 정확하게 통과하며 올라가고, 원은 땅의 부족들을 회전에 묶는 영구적인 축으로 선언됩니다 천국.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_141:0 "#G 완료#! — #high 대형 삼석탑을 통해 태양이 뜬다#!\n#F 동지의 새벽에, 사제와 마을 사람들이 조용히 지켜보는 가운데 태양은 대삼석탑을 통해 정확하게 오르고, 원은 땅의 부족들을 회전에 묶는 영구적인 축으로 선언됩니다 천국.#!"
 TV_WONDER_CEREMONY_S8_TITLE_141:0 "[tv_wonder_ceremony|E]: 태양이 거대 트릴리톤을 통해 떠오른다"
 TV_WONDER_CEREMONY_S8_DESC_141:0 "동지날 새벽에 태양은 성직자와 마을 사람들이 조용히 지켜보는 가운데 거대한 삼석탑을 정확하게 통과하며, 그 원은 땅의 부족들을 회전하는 하늘에 묶는 영구적인 축으로 선언됩니다.\n\n#weak 의식을 완료하는 데 필요한 가격을 지불하십시오. 그러면 불가사의의 마지막 건물이 결과적으로 떠오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_141:0 "태양이 삼석탑을 덮을 때 모인 부족들은 침묵에 빠졌습니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_141:0 "태양조차도 적절한 시간을 기다립니다."
