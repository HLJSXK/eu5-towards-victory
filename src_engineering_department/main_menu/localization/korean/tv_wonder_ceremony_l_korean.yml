 TV_WONDER_CEREMONY_S6_DESC_173:0 "저녁 등불 행사를 위한 작은 사원과 탑이 계단을 따라 세워져 있으며, 황혼이 질 때마다 종소리가 곧 물 위로 울려 퍼집니다. 성직자들은 강에서 가장 가까운 신사에 영구 거주합니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
