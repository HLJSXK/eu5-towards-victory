 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_172:0 "#G 완료#! — #high 황제가 자리를 잡다#!\n#F 황제는 귀족, 사절, 사제들이 모인 법정 앞에서 처음으로 완성된 왕좌에 오른다. 황제의 보석으로 장식된 광채는 목격하는 모든 사람에게 그의 통치의 위대함을 확인시켜준다. it.#!"
 TV_WONDER_CEREMONY_S8_TITLE_172:0 "[tv_wonder_ceremony|E]: 황제가 자리에 앉다"
 TV_WONDER_CEREMONY_S8_DESC_172:0 "황제는 귀족, 사신, 사제들이 모인 법정 앞에서 처음으로 완성된 왕좌에 오릅니다. 왕좌의 보석으로 장식된 광채는 그것을 목격하는 모든 사람에게 그의 통치의 위대함을 확증해 줍니다. 왕좌의 반영된 영광이 왕국 위에 영구적으로 정착합니다.\n\n#weak 의식을 완료하는 데 필요한 대가를 지불하세요. 결과적으로 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_172:0 "합당한 왕이 감히 앉을 때까지 왕좌는 비어 있습니다."
