 TV_WONDER_CEREMONY_S1_DESC_236:0 "섬 감시원, 탑 석공, 연료 관리인, 항만 전령, 순찰 대장 및 함대 장교가 Zhoushan Beacon Network에 모여 신호 섬을 선택합니다. 무대는 현장 노동, 공개 증언, 섬의 봉화를 해양 존재와 해군의 전통으로 바꾸는 의식적 증거를 기록합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
