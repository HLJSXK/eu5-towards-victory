 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_139:0 "#G 완성#! — #high 9개의 돛대가 계단형임#!\n#F 장인들은 9개가 갑판을 따라 서 있을 때까지 우뚝 솟은 돛대를 이어 돛대를 들어올리고, 배의 크기에 대한 소문이 상인들과 함께 해안과 그 너머로 퍼지기 시작합니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_139:0 "[tv_wonder_ceremony|E]：9개의 마스트가 계단식으로 되어 있음"
 TV_WONDER_CEREMONY_S6_DESC_139:0 "장인들은 갑판을 따라 9개가 서 있을 때까지 우뚝 솟은 돛대를 이어 올리고, 배의 크기에 대한 소문이 해안과 그 너머의 상인들에게 퍼지기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_139:0 "우리는 아홉 번째 돛대를 밟고 이 배의 소식을 해안으로 전달합니다."
