 TV_WONDER_CEREMONY_CARD_ICON_S6_136:0 "@tv_ceremony_writer!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_136:0 "#Y 진행 중#! — #high 원장 홀은 아치형으로 되어 있습니다.#!\n#F Casa de Contratacion의 아치형 기록 보관소는 수십 년간의 서류, 왕실 5분의 1, 그리고 수천 명의 귀환 선원들의 논쟁의 여지가 있는 주장을 보관하기 위해 돌 하나하나 솟아오르고 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_136:0 "#G 완료#! — #high 원장 홀은 아치형으로 되어 있습니다#!\n#F Casa de Contratacion의 아치형 기록 보관소는 돌 하나하나 쌓여 수십 년에 걸친 서류, 왕실 5분의 1, 분쟁 중인 수천 명의 반환 청구서를 보관하기 위해 지어졌습니다. 선원.#!"
 TV_WONDER_CEREMONY_S6_TITLE_136:0 "[tv_wonder_ceremony|E]:원장 홀은 아치형입니다"
 TV_WONDER_CEREMONY_S6_DESC_136:0 "Casa de Contratacion의 아치형 기록 보관소는 수십 년간의 목록, 왕실 5분의 1, 그리고 수천 명의 귀환 선원들의 논쟁의 여지가 있는 주장을 보관하기 위해 건축되었습니다. \n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_136:0 "아치형 기록 보관소는 돌 하나하나가 종석을 향해 올라갑니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_136:0 "지금은 안돼!"
 TV_WONDER_CEREMONY_CARD_ICON_S7_136:0 "@tv_ceremony_naval_damage_taken!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_136:0 "#Y 진행 중#! — #high A 함대 상실, 함대 재구축#!\n#F 아조레스 제도의 폭풍으로 인해 짐을 실은 갤리온선이 요구되고 한동안 왕관은 파멸을 두려워합니다. 조선공과 금융가들은 어떠한 난파도 인도 제도 무역을 중단시키지 않을 것이라고 판단하면서 이에 관계없이 계속 노력하고 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_136:0 "#G Completed#! — #high A 함대 상실, 함대 재구축#!\n#F 아조레스 제도의 폭풍으로 인해 짐을 실은 갤리온선이 요구되고 한동안 왕관은 파멸을 두려워합니다. 조선공과 금융가들은 어떠한 난파도 인도 제도 무역을 중단시키지 않을 것이라고 판단하면서 이에 관계없이 계속 노력하고 있습니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_136:0 "[tv_wonder_ceremony|E]：함대 상실, 함대 재구축"
 TV_WONDER_CEREMONY_S7_DESC_136:0 "아조레스 제도의 폭풍은 짐을 실은 갤리온선을 요구하고 한동안 왕관은 파멸을 두려워합니다. 조선공과 금융가들은 어떠한 난파도 인도 제도 무역을 중단시키지 않을 것이라고 판단하고 이에 관계없이 계속 노력하고 있습니다.\n\n#weak 행사를 다음 단계로 진행하는 데 필요한 대가를 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_136:0 "우리는 한 번의 사고로 인해 인도 무역이 중단되도록 두지 않을 것입니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_136:0 "조선공들은 도구를 내려놓고 좀 더 안정적인 날을 기다리고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_136:0 "@tv_ceremony_gold!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_136:0 "#Y 진행 중#! — #high 보물 함대가 집으로 돌아오다#!\n#F 마침내 과달키비르 강 모퉁이를 돌 때 짐을 실은 갤리온선이 세비야 전역에 종소리가 울립니다. 군중이 환호하기 전에 선창이 갈라지고 Carrera de Indias가 선언되었습니다. 왕관의 부를 지속시키는 엔진.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_136:0 "#G 완료#! — #high 보물 함대가 집으로 돌아오다#!\n#F 마침내 과달키비르 강 모퉁이를 돌 때 짐을 실은 갤리온선이 세비야 전역에 종소리가 울립니다. 군중이 환호하기 전에 화물칸이 갈라지고 Carrera de Indias가 선언되었습니다. 왕관의 부를 지속시키는 엔진.#!"
 TV_WONDER_CEREMONY_S8_TITLE_136:0 "[tv_wonder_ceremony|E]:보물함대가 집으로 돌아옵니다"
 TV_WONDER_CEREMONY_S8_DESC_136:0 "마침내 짐을 실은 갈레온이 과달키비르 강 모퉁이를 돌면서 종소리가 세비야 전역에 울리고, 환호하는 군중 앞에서 그 선창이 갈라지고, 카레라 데 인디아스는 왕관의 부를 지속시키는 엔진으로 선언됩니다.\n\n#weak 식을 완료하는 데 필요한 가격을 지불하세요. 그 결과 경이로운 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_136:0 "항구에 도착할 때까지는 어떤 부도 진짜가 아닙니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_136:0 "우리는 아직 보물창고를 열 준비가 되지 않았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_137:0 "@tv_ceremony_paved_road!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_137:0 "#Y 진행 중#! — #high 술탄은 순례자 길을 포고했습니다#!\n#F 두 성스러운 성소의 종의 이름으로 술탄은 메카를 향해 걸어가는 모든 순례자들을 위해 건설된 보호 도로를 명령하여 제국의 명예를 그들의 금고에 묶습니다 통로.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_137:0 "#G 완료#! — #high 술탄은 순례자 길을 포고했습니다#!\n#F 두 거룩한 성소의 종의 이름으로 술탄은 메카를 향해 걸어가는 모든 순례자들을 위해 건설된 보호 도로를 명령하여 제국의 명예를 그들의 금고에 묶습니다 통로.#!"
 TV_WONDER_CEREMONY_S1_TITLE_137:0 "[tv_wonder_ceremony|E]: 술탄이 순례자의 길을 포고하다"
 TV_WONDER_CEREMONY_S1_DESC_137:0 "두 신성한 성역의 종의 이름으로 술탄은 메카를 향해 걸어가는 모든 순례자들을 위해 보호된 도로를 건설하도록 명령하여 제국의 명예를 그들의 안전한 통행에 묶어두었습니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 대가를 지불하십시오. 아니면 아직 때가 되지 않은 경우에는 기다리십시오.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_137:0 "황실 투그라를 밀랍에 밀어 넣어 법령을 봉인합니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_137:0 "아직은 아닙니다. 적절한 때가 올 때까지 우리는 이 길에 우리의 명예를 부여하지 않을 것입니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_137:0 "@tv_ceremony_mapmode!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_137:0 "#Y 진행 중#! — #high 사막 정거장 측량#!\n#F 측량사와 베두인 가이드는 순례길의 건조한 중간역을 통과하여 매년 캐러밴이 가야 할 우물, 그늘 및 방목지를 표시합니다. 휴식.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_137:0 "#G 완료#! — #high 사막 정거장 측량#!\n#F 측량사와 베두인 가이드는 순례길의 건조한 중간역을 통과하여 매년 캐러밴이 가야 할 우물, 그늘 및 방목지를 표시합니다. 휴식.#!"
 TV_WONDER_CEREMONY_S2_TITLE_137:0 "[tv_wonder_ceremony|E]：사막 관측소 측량"
 TV_WONDER_CEREMONY_S2_DESC_137:0 "측량사와 베두인 가이드는 순례길의 건조한 중간역을 통과하여 매년 캐러밴이 쉴 수 있는 우물, 그늘, 방목지를 표시합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우에는 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_137:0 "가이드는 낙타를 몰고 다음 황량한 길을 안내합니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_137:0 "측량사들은 텅 빈 모래 속으로 말을 타고 들어가는 것을 꺼리며 캠프에 머물고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_137:0 "@tv_ceremony_river!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_137:0 "#Y 진행 중#! — #high 물 관리인이 선서했습니다.#!\n#F 우물은 소유권을 주장하고 현지 셰이크의 축복을 받았습니다. 셰이크는 부유하든 가난하든 지나가는 모든 순례자에게 물을 깨끗하게 유지하고 저울을 정직하게 유지하겠다고 맹세합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_137:0 "#G 완료#! — #high 물 관리인이 맹세했습니다.#!\n#F 우물은 소유권을 주장하고 현지 셰이크의 축복을 받았습니다. 셰이크는 부유하든 가난하든 지나가는 모든 순례자에게 물을 깨끗하게 유지하고 저울을 정직하게 유지하겠다고 맹세합니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_137:0 "[tv_wonder_ceremony|E]: 물지기가 선서되었습니다"
 TV_WONDER_CEREMONY_S3_DESC_137:0 "우물은 소유권이 주장되고 저수조는 부유하든 가난하든 통과하는 모든 순례자에게 물을 깨끗하게 유지하고 저울을 정직하게 유지하겠다고 맹세하는 현지 셰이크의 축복을 받습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_137:0 "나는 부자든 가난한 사람이든 모든 순례자를 위해 이 물을 지킬 것을 하느님 앞에 맹세합니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_137:0 "셰이크는 맹세를 보류하고 우물은 소유권을 주장하지 않은 채로 남아 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_137:0 "@tv_ceremony_supply!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_137:0 "#Y 진행 중#! — #high 첫 번째 웨이스테이션 요새가 솟아오르다#!\n#F 메이슨들은 길의 진짜 돌에 첫 번째 요새화된 웨이스테이션의 벽을 쌓기 시작했고, 캐러밴 도로는 더 이상 양피지에 그려진 단순한 계획이 아닙니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_137:0 "#G 완료#! — #high 첫 번째 웨이스테이션 요새가 솟아오르다#!\n#F 메이슨들은 길의 진정한 돌에 첫 번째 요새화된 웨이스테이션의 벽을 쌓기 시작했고, 캐러밴 도로는 더 이상 양피지에 그려진 단순한 계획이 아닙니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_137:0 "[tv_wonder_ceremony|E]: 최초의 Waystation 요새가 솟아오릅니다."
 TV_WONDER_CEREMONY_S4_DESC_137:0 "메이슨은 길의 진짜 돌에 최초의 요새화된 중유역의 벽을 세우기 시작했고, 캐러밴 도로는 더 이상 양피지에 그려진 단순한 계획이 아닙니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_137:0 "석공이 첫 번째 돌을 제자리에 올리자 성벽이 솟아오르기 시작합니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_137:0 "우리는 석공을 저지하고 있습니다. 이 벽은 아직 돌을 돌릴 가치가 없습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_137:0 "@tv_ceremony_lake!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_137:0 "#Y 진행 중#! — #high 바위에 새겨진 물탱크#!\n#F 엔지니어들이 각 역 옆에 있는 바위에 큰 물탱크를 파서 각 순례 시즌을 통과할 수만 명의 목마름을 대비해 희귀한 사막 비를 저장합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_137:0 "#G 완료#! — #high 바위에 새겨진 물탱크#!\n#F 엔지니어들이 각 역 옆에 있는 바위에 큰 물탱크를 파서 각 순례 시즌을 통과할 수만 명의 목마름에 대비해 희귀한 사막 비를 저장합니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_137:0 "[tv_wonder_ceremony|E]:바위를 깎아 만든 수조"
 TV_WONDER_CEREMONY_S5_DESC_137:0 "엔지니어들은 각 역 옆에 있는 바위에 큰 수조를 파서 각 순례 시즌을 통과하는 수만 명의 갈증을 대비해 보기 드문 사막의 비를 저장합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_137:0 "엔지니어들은 끌을 깊이 박아 바위에 구멍을 뚫어 기다리고 있는 저수조를 만듭니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_137:0 "엔지니어들은 끌을 내려놓고 바위를 헐벗고 건조한 채로 두었습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_137:0 "@tv_ceremony_soldiers!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_137:0 "#Y 진행 중#! — #high 파수꾼에 맞서 싸우는 감시탑#!\n#F 노출된 도로를 따라 주둔한 감시탑이 솟아 있고, 그들의 보초는 캐러밴 종소리가 들리기 오래 전에 침입자에게 경고 신호를 보내도록 훈련받았습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_137:0 "#G 완료#! — #high 파수꾼에 맞서는 감시탑#!\n#F 노출된 도로를 따라 주둔한 감시탑이 솟아 있고, 그들의 보초는 캐러밴 종소리가 들리기 훨씬 전에 침입자에게 경고 신호를 보내도록 훈련받았습니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_137:0 "[tv_wonder_ceremony|E]: 감시탑은 침입자에 맞서고 있습니다"
 TV_WONDER_CEREMONY_S6_DESC_137:0 "노출된 도로를 따라 주둔한 감시탑이 솟아 있고, 그들의 보초는 캐러밴 종소리가 들리기 훨씬 전에 침입자에게 경고 신호를 보내도록 훈련되었습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_137:0 "경비하라!"
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_137:0 "반쯤 지어진 탑은 비어 있고 감시 초소도 무인입니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_137:0 "@tv_ceremony_climate!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_137:0 "#Y 진행 중#! — #high 폭풍 속에서도 살아남은 위대한 캐러밴#!\n#F A 갑작스러운 모래폭풍으로 인해 한 시즌의 캐러밴이 도로 중간 지점 근처에 흩어지고 새로 건설된 역과 저장된 물만이 모든 순례자를 살아나게 합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_137:0 "#G 완료#! — #high 폭풍 속에서도 살아남은 위대한 캐러밴#!\n#F A 갑작스런 모래폭풍이 한 계절의 캐러밴을 도로 중간 지점 근처로 흩어버리고 새로 건설된 역과 저장된 물만이 모든 순례자를 살아나게 합니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_137:0 "[tv_wonder_ceremony|E]: 폭풍 속에서도 살아남은 위대한 캐러밴"
 TV_WONDER_CEREMONY_S7_DESC_137:0 "갑작스러운 모래 폭풍이 도로 중간 지점 근처에서 한 계절의 캐러밴을 흩어지게 하고, 새로 건설된 역과 저장된 물만이 모든 순례자를 살아나게 합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_137:0 "캐러밴은 모래폭풍이 지나갈 때까지 정거장 벽 안에 대피합니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_137:0 "우리는 아직 폭풍에 맞서 도로를 시험해 볼 엄두를 내지 못하고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_137:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_137:0 "#Y 진행 중#! — #high 카바로 가는 길은 축복을 받습니다#!\n#F 이맘과 관리들은 도로가 완성되면 제국의 심장부에서 메카의 문까지의 전체 길이를 축복하기 위해 모이며, 술탄의 순례 여행 보호는 영구적인 기둥이 됩니다 왕국의 신앙과 입지에 대한 것입니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_137:0 "#G 완료#! — #high 카바로 가는 길은 축복받았습니다#!\n#F 이맘들과 관리들은 도로가 완성된 곳에 모여 제국의 심장부에서 메카의 성문까지의 전체 길이를 축복하며 술탄의 순례 여행 보호는 영구적이 됩니다. 왕국의 신앙과 입지의 기둥#!"
 TV_WONDER_CEREMONY_S8_TITLE_137:0 "[tv_wonder_ceremony|E]:카바로 가는 길은 축복받았습니다"
 TV_WONDER_CEREMONY_S8_DESC_137:0 "이맘과 관리들은 도로가 완성되면 제국의 심장부에서 메카의 성문까지의 전체 길이를 축복하기 위해 모이고, 순례에 대한 술탄의 보호는 왕국의 신앙과 지위의 영구적인 기둥이 됩니다.\n\n#weak 의식을 완료하려면 필요한 대가를 지불하세요. 경이로운 마지막 건물은 결과.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_137:0 "이맘들은 손을 들고 메카의 문까지 가는 길 전체를 축복합니다."
