 TV_WONDER_CEREMONY_CARD_ICON_S5_173:0 "@tv_ceremony_population!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_173:0 "#Y 진행 중#! — #high 계단이 둑을 오르다#!\n#F 계단이 둑을 오르며 새벽에 순례자의 행렬이 나란히 물가로 내려갈 수 있을 만큼 넓습니다.#!"
