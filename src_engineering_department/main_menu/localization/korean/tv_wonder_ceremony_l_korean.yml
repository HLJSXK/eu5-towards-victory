 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_199:0 "#G 완료#! — #high 감시탑은 새로운 고리를 따라 솟아오릅니다#!\n#F 둥근 망루는 새로운 외부 고리를 따라 간격을 두고 솟아 있으며, 각각 살인 구멍과 좁은 궁수 틈새가 장착되어 있습니다.#!"
