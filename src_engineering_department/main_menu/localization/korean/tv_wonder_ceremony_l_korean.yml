 TV_WONDER_CEREMONY_S1_DESC_197:0 "대천사에 대한 주교의 비전에 따라, 노르만 모래에서 솟아오른 조석 바위 위에 자리잡을 새 수도원을 요구하는 헌장입니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_197:0 "감독은 헌장에 서명하고 성직자는 비전에 대한 축복을 서약합니다."
