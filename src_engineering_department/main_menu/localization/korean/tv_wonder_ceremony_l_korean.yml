 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_196:0 "#G 완료#! — #high Lyon의 실크 지역이 세계에 옷을 입히다#!\n#F 실크 지역이 완성됨에 따라 종소리가 두 강을 가로질러 울리고 리옹의 직기는 전 세계 의류 코트와 시장을 시작합니다.#!"
