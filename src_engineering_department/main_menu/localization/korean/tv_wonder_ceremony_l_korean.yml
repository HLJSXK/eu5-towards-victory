 TV_WONDER_CEREMONY_S6_TITLE_186:0 "[tv_wonder_ceremony|E]：강둑에서 모습을 드러내는 차이카"
 TV_WONDER_CEREMONY_S6_DESC_186:0 "조선공과 대장장이가 나란히 일하면서 단일 참나무 줄기에서 차이카 보트의 속을 비우고 대장간에서는 쉬지 않고 세이버, 머스켓 총통, 편자를 두드려서 만듭니다. Sich는 캠프라기보다는 Dnieper의 떠다니는 무기고처럼 보이기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
