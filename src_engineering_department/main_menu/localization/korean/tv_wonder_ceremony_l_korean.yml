 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_198:0 "#Y 진행 중#! — #high 채석장 왕관의 부름에 응답하세요#!\n#F 파리 주변의 채석장은 공성 엔진을 견딜 수 있을 만큼 두꺼운 탑에 필요한 거대한 블록을 절단하는 작업에 투입되었습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_198:0 "#G 완료#! — #high 채석장 왕관의 부름에 응답하세요#!\n#F 파리 주변의 채석장은 공성 엔진을 견딜 수 있을 만큼 두꺼운 탑에 필요한 거대한 블록을 절단하는 작업에 투입됩니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_198:0 "[tv_wonder_ceremony|E]: 채석장은 왕관의 부름에 응답합니다"
 TV_WONDER_CEREMONY_S3_DESC_198:0 "파리 주변의 채석장은 공성 엔진을 견딜 수 있을 만큼 두꺼운 타워에 필요한 거대한 블록을 절단하는 작업에 투입됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_198:0 "나는 어떤 포위 공격도 견딜 수 있을 만큼 돌을 자르도록 채석장에 명령합니다."
