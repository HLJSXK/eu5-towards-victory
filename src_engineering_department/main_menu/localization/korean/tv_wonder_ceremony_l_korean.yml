 TV_WONDER_CEREMONY_S4_DESC_199:0 "외부 커튼월의 첫 번째 코스는 오래된 성벽 아래에서 착공되어 카르카손 이중 방어의 진정한 시작을 알립니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
