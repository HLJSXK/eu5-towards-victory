 TV_WONDER_CEREMONY_CARD_ICON_S4_141:0 "@tv_ceremony_rite_power!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_141:0 "#Y 진행 중#! — #high 새벽에 첫 번째 구덩이를 파다#!\n#F 뿔 곡괭이를 든 노동자들은 동이 트자마자 백악토를 부수고 첫 번째 돌 구멍을 파고, 평원의 오랫동안 계획된 기념물은 마침내 물리적 상처가 된다. 지상.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_141:0 "#G 완료#! — #high 새벽에 첫 번째 구덩이를 파다#!\n#F 뿔 곡괭이를 든 노동자들은 동이 트자마자 백악토를 부수고 첫 번째 돌 구멍을 파고, 평원의 오랫동안 계획된 기념물은 마침내 물리적 상처가 된다. 지상.#!"
 TV_WONDER_CEREMONY_S4_TITLE_141:0 "[tv_wonder_ceremony|E]：새벽에 첫 번째 구덩이를 파다"
 TV_WONDER_CEREMONY_S4_DESC_141:0 "사슴뿔 곡괭이를 든 인부들은 첫 번째 돌 구멍을 파기 위해 동이 트자마자 백악 흙을 부수고, 오랫동안 계획했던 평원의 기념물은 마침내 땅에 물리적인 상처가 됩니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우에는 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_141:0 "모든 기념물은 대지의 단 하나의 상처에서 시작됩니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_141:0 "나는 아직 이 신성한 땅에 첫 번째 절단을 명령할 수 없습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_141:0 "@tv_ceremony_laborers!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_141:0 "#Y 진행 중#! — #high 사르센이 똑바로 세워졌습니다#!\n#F 로프, 레버 및 수십 개의 긴장 등받이가 각각의 거대한 사르센을 대기 구덩이로 똑바로 끌어당기고, 잔해와 목재 쐐기로 단단히 포장되어 서 있을 때까지 기다립니다. 도움 없이.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_141:0 "#G 완료#! — #high 사르센이 똑바로 세워졌습니다#!\n#F 로프, 레버 및 수십 개의 긴장 등받이가 각 거대한 사르센을 대기 구덩이로 똑바로 세우고, 잔해와 목재 쐐기로 단단히 포장하여 서 있을 때까지 기다립니다. 도움 없이.#!"
 TV_WONDER_CEREMONY_S5_TITLE_141:0 "[tv_wonder_ceremony|E]: 사르센이 똑바로 세워진 모습"
 TV_WONDER_CEREMONY_S5_DESC_141:0 "로프, 레버, 수십 개의 등받이가 각각의 거대한 사르센을 대기 구덩이로 똑바로 끌어당기고, 잔해와 목재 쐐기가 빽빽하게 들어차서 도움 없이 설 수 있게 됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우에는 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_141:0 "긴장된 등이 마침내 거대한 사르센을 똑바로 세웁니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_141:0 "급히 세운 돌은 곧 다시 떨어진다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_141:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_141:0 "#Y 진행 중#! — #high 인방이 제자리로 들어 올려졌습니다.#!\n#F 조각된 상인방 돌을 천천히 목재 경사로 위로 끌어올려 장붓구멍 조인트로 서있는 기둥에 고정시켜 하늘을 향한 대권의 실루엣을 닫습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_141:0 "#G 완료#! — #high 인방이 제자리로 들어 올려졌습니다.#!\n#F 조각된 상인방 돌을 천천히 목재 경사로 위로 끌어올리고 장붓구멍 연결부가 있는 서있는 기둥에 고정하여 하늘을 향한 대권의 실루엣을 닫습니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_141:0 "[tv_wonder_ceremony|E]: 상인방이 제자리로 들어 올려졌습니다."
 TV_WONDER_CEREMONY_S6_DESC_141:0 "조각된 상인방 돌은 천천히 목재 경사로 위로 올라가 장붓구멍 조인트로 서있는 기둥에 고정되어 하늘을 향한 대권의 실루엣을 닫습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_141:0 "나는 상인방을 들어올려 원의 꼭대기를 닫으라고 명령한다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_141:0 "조각가들은 잠시 멈췄고, 장붓구멍 연결부는 아직 사실이 아닙니다."
