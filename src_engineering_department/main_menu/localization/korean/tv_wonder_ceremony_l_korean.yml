 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_198:0 "#Y 진행 중#! — #high 왕은 성문에 요새를 명령한다#!\n#F 왕은 파리로의 동쪽 접근을 두려워하여 성문을 지키기 위해 포르트 생 앙투안(Porte Saint-Antoine)에 새로운 요새를 세울 것을 명령한다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_198:0 "#G 완료#! — #high 왕관은 성문에 요새를 명령한다#!\n#F 왕국은 파리로의 동쪽 접근을 두려워하여 성문을 지키기 위해 포르트 생 앙투안(Porte Saint-Antoine)에 새로운 요새를 세울 것을 명령한다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_198:0 "[tv_wonder_ceremony|E]:왕관은 성문에 요새를 명령합니다"
 TV_WONDER_CEREMONY_S1_DESC_198:0 "파리로 동쪽으로 접근하는 것을 두려워한 왕은 도시의 문을 지키기 위해 Porte Saint-Antoine에 새로운 요새를 세울 것을 명령합니다.\n\n#weak 식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_198:0 "그렇게 하십시오. 성문에는 요새가 있을 것입니다!"
