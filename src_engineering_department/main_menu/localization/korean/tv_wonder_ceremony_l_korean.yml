 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_173:0 "#G 완료#! — #high 사원과 등탑이 세워졌습니다.#!\n#F 저녁 등불 행사를 위한 작은 사원과 탑이 계단을 따라 세워져 있으며, 황혼마다 물 위로 종소리가 곧 울립니다.#!"
