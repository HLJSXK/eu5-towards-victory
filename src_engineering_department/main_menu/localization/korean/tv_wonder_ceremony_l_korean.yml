 TV_WONDER_CEREMONY_S7_DESC_196:0 "전 세계의 상인들이 리옹의 패턴 북을 거래하기 위해 박람회를 열었고, 트라불은 작업장 사이에 운반된 더미로 분주해졌습니다.\n\n#weak 행사를 다음 단계로 진행하기 위해 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
