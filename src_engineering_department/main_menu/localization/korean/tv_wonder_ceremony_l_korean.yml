 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_204:0 "#G 완료#! — #high 망루는 더 높이 올라갑니다#!\n#F 성벽을 돌 때마다 둥근 탑이 솟아 있어 보초에게 쿠라 계곡과 포위 공격자가 선택할 수 있는 모든 접근 방식을 따라 명확한 선을 제공합니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_204:0 "[tv_wonder_ceremony|E]: 감시탑은 더 높이 올라간다"
