 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_107:0 "#G Completed#! — #high 인티 라이미가 성채를 봉헌하다#!\n#F 성채 전체가 봉헌되면서 사제들은 완성된 태양 사원에서 인티 라이미 의식을 거행하고, 산의 축복이 온 왕국을 통해 흘러내릴 것을 선언한다 수확합니다.#!"
 TV_WONDER_CEREMONY_S8_TITLE_107:0 "[tv_wonder_ceremony|E]: 인티 라이미가 성채를 봉헌하다"
 TV_WONDER_CEREMONY_S8_DESC_107:0 "성채 전체가 봉헌되면서 성직자들은 완성된 태양 사원에서 인티 라이미 의식을 거행하고, 산의 축복이 왕국 전체의 수확을 통해 흘러내릴 것이라고 선언합니다.\n\n#weak 의식을 완료하는 데 필요한 대가를 지불하세요. 결과적으로 불가사의의 최종 건물이 솟아오를 것입니다.#!"
