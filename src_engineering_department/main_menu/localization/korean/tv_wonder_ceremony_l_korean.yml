 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_197:0 "#Y 진행 중#! — #high 순례자들이 둑길을 표시하다#!\n#F 순례자들과 승려들은 흐르는 모래를 가로질러 안전한 길을 표시하고, 본토의 채석장은 앞으로의 등반에 필요한 화강암을 공급하기 위해 열립니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_197:0 "#G 완료#! — #high 순례자들이 둑길을 표시합니다#!\n#F 순례자들과 승려들이 흐르는 모래를 가로질러 안전한 길을 표시하고, 본토의 채석장은 앞으로의 등반에 필요한 화강암을 공급하기 위해 열립니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_197:0 "[tv_wonder_ceremony|E]：순례자들이 둑길의 길을 표시하다"
 TV_WONDER_CEREMONY_S2_DESC_197:0 "순례자들과 승려들은 움직이는 모래를 가로질러 안전한 길을 표시하고, 본토의 채석장은 앞으로의 등반에 필요한 화강암을 공급하기 위해 개방됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_197:0 "우리는 움직이는 모래 위에 돌로 깎은 표시로 순례자의 길을 설정했습니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_197:0 "측량사는 물러나고 이동하는 모래는 한동안 표시되지 않은 상태로 둡니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_197:0 "@tv_ceremony_ship!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_197:0 "#Y 진행 중#! — #high 화강암 블록 조수를 건너다#!\n#F 소 카트와 바지선은 바다의 전진과 후퇴 사이의 좁은 창에 맞춰 화강암 블록을 바위 바닥으로 가져오기 위해 조수 경주를 합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_197:0 "#G Completed#! — #high 화강암 블록 조수를 건너세요#!\n#F Ox 카트와 바지선은 바다의 전진과 후퇴 사이의 좁은 창에 맞춰 화강암 블록을 바위 바닥으로 가져오기 위해 조수 경주를 합니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_197:0 "[tv_wonder_ceremony|E]：조류를 건너는 화강암 블록"
 TV_WONDER_CEREMONY_S3_DESC_197:0 "황소 수레와 바지선은 바다의 전진과 후퇴 사이의 좁은 창문에 맞춰 화강암 블록을 바위 바닥으로 가져오기 위해 조수를 경주합니다.\n\n#weak 다음 단계로 의식을 진행하려면 필요한 가격을 지불하거나 아직 적절한 순간이 아닌 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_197:0 "카터와 바지선은 썰물 때 출발하여 화강암이 낮게 깔린 조수를 경주합니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_197:0 "조수가 좀 더 부드러워질 때까지 우리는 부두에 바지선을 붙잡고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_197:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_197:0 "#Y 진행 중#! — #high 수도원의 기초가 바위를 물다#!\n#F Masons는 첫 번째 기초를 화강암 산에 직접 절단하여 바람과 바다로부터 수도원을 바위 자체에 고정했습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_197:0 "#G 완료#! — #high 수도원의 기초가 바위를 물다#!\n#F Masons는 첫 번째 기초를 화강암 산에 직접 절단하여 바람과 바다로부터 수도원을 바위 자체에 고정시켰습니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_197:0 "[tv_wonder_ceremony|E]：The Abbey's Foundations Bite the Rock"
 TV_WONDER_CEREMONY_S4_DESC_197:0 "석공은 첫 번째 기초를 화강암 산에 직접 절단하여 바람과 바다에 맞서 수도원을 바위 자체에 고정시켰습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_197:0 "석공은 끌을 화강암에 박아 수도원을 산 자체에 고정시킵니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_197:0 "석공들은 도구를 내려 바위가 조금 더 손상되지 않은 상태로 유지되도록 합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_197:0 "@tv_ceremony_building_levels!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_197:0 "#Y 진행 중#! — #high 하늘을 향해 올라가는 본당#!\n#F 수도원의 본당은 산의 경사면을 따라 계단식으로 올라가며, 그 지지대는 불확실한 땅에서 돌의 무게를 지탱하도록 만들어졌습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_197:0 "#G 완료#! — #high 하늘을 향해 올라가는 본당#!\n#F 수도원의 본당은 산의 경사면을 따라 계단식으로 올라가며, 그 지지대는 불확실한 땅에서 돌의 무게를 지탱하도록 만들어졌습니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_197:0 "[tv_wonder_ceremony|E]：본당은 하늘을 향해 올라간다"
 TV_WONDER_CEREMONY_S5_DESC_197:0 "수도원의 본당은 산의 경사면을 따라 계단식으로 올라가며, 그 지지대는 불확실한 땅에서 돌의 무게를 지탱하도록 만들어졌습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_197:0 "우리는 돌이 하늘을 향해 돌을 운반할 것이라고 믿으며 지지대를 한 층씩 높입니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_197:0 "건축업자들이 불확실한 땅이 아직 준비되지 않았다고 판단할 때 비계는 유휴 상태로 서 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_197:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_197:0 "#Y 진행 중#! — #high 회랑이 파도 위에 세워졌습니다.#!\n#F A 회랑은 정상 근처에 세워져 마치 파도 위에 매달려 있는 것처럼 보이며, 비계가 첨탑에 여전히 붙어 있는 동안 승려들이 아케이드를 걷기 시작합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_197:0 "#G 완료#! — #high 파도 위에 세워진 회랑#!\n#F A 회랑은 정상 근처에 세워져 마치 파도 위에 떠 있는 것처럼 보이며, 비계가 첨탑에 여전히 붙어 있는 동안 승려들이 회랑을 걷기 시작합니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_197:0 "[tv_wonder_ceremony|E]：회랑이 파도 위에 솟아오른다"
 TV_WONDER_CEREMONY_S6_DESC_197:0 "정상 근처에 회랑이 솟아올라 파도 위에 매달려 있는 것처럼 보이고, 승려들은 첨탑에 비계가 아직 붙어 있는 동안에도 회랑을 걷기 시작합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_197:0 "비계가 여전히 위의 첨탑에 달라붙어 있는 동안에도 승려들은 새로운 아케이드를 따라 걸어갑니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_197:0 "우리는 승려들에게 회랑의 아치가 안전하게 서 있을 때까지 아래에서 기다리라고 명령했습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_197:0 "@tv_ceremony_defensive_military_stance!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_197:0 "#Y 진행 중#! — #high 요새화된 성벽이 순례자의 길을 둘러쌉니다.#!\n#F 요새 주변에 요새화된 성벽과 문이 솟아올라 폭풍과 침입자로부터 순례자들을 보호하며 매 시즌마다 둑길은 점점 더 붐비고 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_197:0 "#G 완료#! — #high 요새화된 성벽이 순례자의 길을 둘러쌉니다.#!\n#F 요새가 있는 성벽과 문은 매 시즌마다 둑길이 점점 더 붐비면서 폭풍과 침입자로부터 순례자들을 보호하기 위해 기지 주변에 솟아 있습니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_197:0 "[tv_wonder_ceremony|E]: 순례자의 길을 둘러싸는 요새화된 성벽"
 TV_WONDER_CEREMONY_S7_DESC_197:0 "매 시즌마다 둑길은 점점 더 붐비기 때문에 순례자들을 폭풍과 침입자로부터 보호하기 위해 기지 주위에 요새화된 벽과 문이 솟아 있습니다.\n\n#weak 필요한 가격을 지불하여 의식을 다음 단계로 진행하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_197:0 "석공들은 벽과 대문으로 기지를 둘러싸고 있어 더욱 붐비는 둑길을 보호합니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_197:0 "성문은 아직 건설되지 않은 채 서 있고 순례자들은 여전히 탁 트인 하늘 아래를 건너고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_197:0 "@tv_ceremony_holy_site!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_197:0 "#Y 진행 중#! — #high 몽생미셸이 파도의 왕관을 차지하다#!\n#F 수도원 첨탑이 봉헌되면서 모래 위에서 종소리가 울리고, 몽생미셸은 조수 위에 왕관을 씌워 조수에 대한 헌신의 등불로 서 있습니다. 영역.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_197:0 "#G Completed#! — #high 몽생미셸이 조수에 왕관을 씌우다#!\n#F 수도원 첨탑이 봉헌되면서 모래 위에서 종소리가 울리고, 몽생미셸은 조수 위에 왕관을 씌워 조수 위에 서 있습니다. 영역.#!"
 TV_WONDER_CEREMONY_S8_TITLE_197:0 "[tv_wonder_ceremony|E]: 몽생미셸이 조수를 차지하다"
 TV_WONDER_CEREMONY_S8_DESC_197:0 "수도원 첨탑이 봉헌되면서 모래 위에 종소리가 울리고, 몽생미셸은 왕국에 대한 헌신의 등대로서 조수 위에 왕관을 얹고 서 있습니다.\n\n#weak 식을 완료하려면 필요한 가격을 지불하세요. 결과적으로 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_197:0 "마침내 왕관을 썼습니다!"
