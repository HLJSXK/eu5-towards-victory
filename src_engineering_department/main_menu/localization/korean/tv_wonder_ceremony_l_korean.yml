 TV_WONDER_CEREMONY_S5_DESC_211:0 "철로 묶인 금고는 계산실의 기초에 설치되어 밤낮으로 보호되며, 왕자와 도시 모두가 의존하게 될 동전 상자를 보관할 준비가 되어 있습니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_211:0 "경비원은 철로 묶인 금고를 기초에 봉쇄합니다."
