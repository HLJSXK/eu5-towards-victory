 TV_WONDER_CEREMONY_S4_DESC_107:0 "석공들은 모르타르 없이 첫 번째 건석 옹벽을 경사면에 설치했습니다. 각 블록은 이웃에 맞닿아 고정되도록 형성되었으며, 테라스는 산비탈을 오르기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
