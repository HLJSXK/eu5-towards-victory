 TV_WONDER_CEREMONY_CARD_ICON_S4_198:0 "@tv_ceremony_defensive_military_stance!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_198:0 "#Y 진행 중#! — #high 첫 번째 망대 기초가 무너졌습니다.#!\n#F 여덟 개의 망대 중 첫 번째 기초가 땅 속 깊이 가라앉았고, 옛 성문 위로 요새가 솟아오르기 시작했습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_198:0 "#G 완료#! — #high 첫 번째 망대 기초가 무너졌습니다#!\n#F 여덟 개의 탑 중 첫 번째 기초가 땅 속 깊이 가라앉았고, 옛 성문 위로 요새가 솟아오르기 시작했습니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_198:0 "[tv_wonder_ceremony|E]: 최초의 타워 기초가 가라앉았습니다"
 TV_WONDER_CEREMONY_S4_DESC_198:0 "8개의 탑 중 첫 번째 탑의 기초가 땅 속 깊이 가라앉고 요새가 옛 성문 위로 솟아오르기 시작합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
