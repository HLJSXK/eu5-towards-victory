 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_187:0 "#G Completed#! — #high 교차로 광장 측량#!\n#F 법원 엔지니어들은 중국, 인도, 페르시아의 캐러밴 경로가 오랫동안 수렴되어 배경에 대한 첫 번째 위대한 마드라사의 발자국을 표시하는 열린 땅을 행진합니다. sun.#!"
 TV_WONDER_CEREMONY_S2_TITLE_187:0 "[tv_wonder_ceremony|E]：교차로 광장 측량"
 TV_WONDER_CEREMONY_S2_DESC_187:0 "법원 기술자들은 중국, 인도, 페르시아의 캐러밴 루트가 오랫동안 수렴되어 지는 해를 배경으로 최초의 위대한 마드라사의 발자국을 표시한 열린 땅을 행진합니다. 근처에는 도시의 유명한 파란색 및 청록색 유리 타일을 굽기 위해 가마가 세워져 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_187:0 "땅을 두 번 측량하면 그 성벽이 천년 동안 견고하리라."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_187:0 "우리는 아직 이 교차로에서 착공할 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_187:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_187:0 "#Y 진행 중#! — #high 학자들이 첫 번째 포털을 축복합니다#!\n#F 학식 있는 이맘과 천문학자들이 우뚝 솟은 입구 포털의 기초를 축복하고, 일꾼들이 지역의 기둥에 고정하기 위해 깊이 파기 시작하면서 구절을 낭송합니다. 지진.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_187:0 "#G 완료#! — #high 학자들이 첫 번째 포털을 축복합니다#!\n#F 학식 있는 이맘과 천문학자들이 우뚝 솟은 입구 포털의 기초를 축복하고, 노동자들이 지역의 기둥에 고정하기 위해 깊이 파기 시작하는 동안 구절을 낭송합니다. 지진.#!"
 TV_WONDER_CEREMONY_S3_TITLE_187:0 "[tv_wonder_ceremony|E]：학자들이 첫 번째 포털을 축복합니다"
 TV_WONDER_CEREMONY_S3_DESC_187:0 "숙련된 이맘과 천문학자들은 우뚝 솟은 입구 포털의 기초를 축복하고, 일꾼들이 지역의 지진에 대비해 포털을 고정하기 위해 깊이 파기 시작하는 동안 구절을 낭송합니다. 통과하는 캐러밴은 새로운 광장을 향해 타일, 목재 또는 동전을 지불해야 합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_187:0 "파는 사람들이 지구의 진동에 맞서 기초를 깊이 고정하는 동안 이맘들은 기초에 대해 암송합니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_187:0 "통행료도 지불하지 않고 축복도 얻지 못합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_187:0 "@tv_ceremony_building_levels!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_187:0 "#Y 진행 중#! — #high 마드라사의 포탈이 하늘을 향해 올라갑니다#!\n#F 벽돌을 하나씩 쌓아올려 첫 번째 마드라사의 솟아오른 이완 포탈이 광장 위로 솟아오릅니다. 측량 후 마침내 경이로운 작업이 진행되고 있습니다. 축복.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_187:0 "#G 완료#! — #high 마드라사의 포털이 하늘을 향해 올라갑니다#!\n#F 벽돌을 하나씩 쌓고, 첫 번째 마드라사의 솟아오르는 이완 포털이 광장 위로 솟아오릅니다. 경이로운 실제 작업은 측량 후 마침내 진행되고 있습니다. 축복.#!"
 TV_WONDER_CEREMONY_S4_TITLE_187:0 "[tv_wonder_ceremony|E]: 마드라사의 포털이 하늘을 향해 올라갑니다."
 TV_WONDER_CEREMONY_S4_DESC_187:0 "벽돌 하나하나, 첫 번째 마드라사의 솟아오른 이완 포털이 광장 위로 솟아 있으며, 측량과 축복을 마친 후 마침내 경이로운 실제 작업이 진행됩니다. 문 옆에 있는 미나렛 타워에 포플러 나무 비계가 조금씩 위로 올라가고 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_187:0 "이 포털 벽돌이 하늘에 닿을 때까지 벽돌 하나하나 들어 올립니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_187:0 "비계는 유휴 상태로 서 있고 이번 시즌에는 포털이 더 이상 올라가지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_187:0 "@tv_ceremony_art_work!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_187:0 "#Y 진행 중#! — #high 타일 마스터가 파란색으로 포털을 덮다#!\n#F 마스터 타일 세터가 청록색, 코발트, 금의 유약 모자이크로 거대한 포털을 덮고 우뚝 솟은 정면에 꾸란 구절을 흐르는 물결처럼 새깁니다. 캘리그래피.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_187:0 "#G 완료#! — #high 타일 마스터가 블루로 포털을 덮다#!\n#F 마스터 타일 세터는 청록색, 코발트, 금의 유약 모자이크로 거대한 포털을 덮고 우뚝 솟은 정면에 꾸란 구절을 흐르는 물결로 새깁니다. 캘리그래피.#!"
 TV_WONDER_CEREMONY_S5_TITLE_187:0 "[tv_wonder_ceremony|E]: 타일 마스터가 포털을 파란색으로 덮습니다."
 TV_WONDER_CEREMONY_S5_DESC_187:0 "타일 세공사의 대문은 청록색, 코발트, 금색 모자이크로 거대한 정문을 덮고 있으며, 우뚝 솟은 정면 전체에 흐르는 글씨체로 꾸란 구절을 적고 있습니다. 견습생들은 위의 비계와 보조를 맞추기 위해 청금석과 코발트 색소를 통으로 갈아냅니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우에는 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_187:0 "타일 마스터는 포털 전체에 청록색과 코발트 모자이크를 한 구절씩 빛나는 구절로 설정했습니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_187:0 "우리는 아직 이 정면에 청금석과 코발트를 사용하지 않을 것입니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_187:0 "@tv_ceremony_literacy!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_187:0 "#Y 진행 중#! — #high 학생 셀이 안뜰을 둘러싸고 있음#!\n#F 마드라사의 내부 안뜰을 중심으로 2층 높이의 아치형 후즈라 셀이 늘어서 있으며, 각 셀은 천문학, 신학 및 수년간 연구한 학생과 그의 책을 수용하기 위한 것입니다. law.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_187:0 "#G 완료#! — #high 학생 세포가 안뜰을 둘러싸고 있습니다#!\n#F 마드라사의 내부 안뜰을 중심으로 2층 높이의 아치형 후즈라 세포가 줄지어 솟아 있습니다. law.#!"
 TV_WONDER_CEREMONY_S6_TITLE_187:0 "[tv_wonder_ceremony|E]：학생 세포가 안뜰을 울린다"
 TV_WONDER_CEREMONY_S6_DESC_187:0 "아치형 후즈라 셀이 마드라사의 내부 안뜰 주위에 2층으로 솟아 있으며, 각 셀은 천문학, 신학 및 법학을 수년간 연구한 학생과 그의 책을 수용하기 위한 것입니다. 아직 미완성된 홀에 석고 가루가 걸려 있는 중에도 첫 번째 학자들이 도착합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_187:0 "최초의 학자들이 석고 먼지 속에 정착하면서 안뜰 주변에 후즈라 세포가 줄지어 솟아 있습니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_187:0 "서둘러 쌓인 지식은 제대로 보관되지 않은 지식입니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_187:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_187:0 "#Y 진행 중#! — #high A 두 번째 마드라사가 첫 번째를 마주하다#!\n#F 후세대의 통치자들은 광장을 가로질러 두 번째 그랜드 마드라사를 세웠는데, 그 포털의 포털은 의도적으로 첫 번째 마드라사를 반영하여 두 마드라사가 일치하는 화려함으로 서로 마주하게 됩니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_187:0 "#G 완료#! — #high A 두 번째 마드라사가 첫 번째를 마주하다#!\n#F 후세대의 통치자들은 광장을 가로질러 두 번째 그랜드 마드라사를 세웠는데, 그 포털의 포털은 의도적으로 첫 번째 마드라사를 반영하여 두 마드라사가 일치하는 화려함으로 서로 마주하게 됩니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_187:0 "[tv_wonder_ceremony|E]: 두 번째 마드라사가 첫 번째 마드라사와 마주하다"
 TV_WONDER_CEREMONY_S7_DESC_187:0 "후대의 통치자들은 광장 건너편에 두 번째 그랜드 마드라사를 세웠는데, 그 문은 의도적으로 첫 번째 마드라사를 반영하여 두 곳이 조화롭게 화려하게 서로 마주하게 했습니다. 타일 마스터는 사자와 태양을 외관에 추가하여 기존의 서예에서 과감하게 벗어났습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_187:0 "우리는 사자와 태양으로 장식된 첫 번째 마드라사를 마주하기 위해 두 번째 마드라사를 세웁니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_187:0 "광장은 비대칭으로 남아 있으며 두 번째 포털은 빈 땅에 건설되지 않았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_187:0 "@tv_ceremony_trade!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_187:0 "#Y 진행 중#! — #high 세계를 모으는 레기스탄#!\n#F 이맘들이 금으로 코팅된 돔 아래에서 시작 구절을 낭송하는 가운데 통치자, 학자, 상인이 완성된 광장에 모여 레기스탄이 배움을 추구하는 모든 사람에게 완전하고 개방되어 있음을 선언합니다. 무역.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_187:0 "#G 완료#! — #high 세계를 모으는 레기스탄#!\n#F 이맘이 금으로 코팅된 돔 아래에서 시작 구절을 낭송하는 가운데 통치자, 학자, 상인이 완성된 광장에 모여 레기스탄이 배움을 추구하는 모든 사람에게 완전하고 개방되어 있음을 선언합니다. 무역.#!"
 TV_WONDER_CEREMONY_S8_TITLE_187:0 "[tv_wonder_ceremony|E]: 레기스탄이 세계를 모으다"
 TV_WONDER_CEREMONY_S8_DESC_187:0 "통치자, 학자, 상인이 완성된 광장에 모여 이맘이 현재 금으로 코팅된 돔 아래에서 시작 구절을 낭송하며 레기스탄이 학습과 무역을 추구하는 모든 사람에게 완전하고 개방되어 있음을 선언합니다. 오늘부터 광장의 명성과 화려함은 부하라에서 델리까지 모든 궁정에서 통치자의 말에 새로운 무게를 더해 줍니다.\n\n#weak 의식을 완료하려면 필요한 가격을 지불하세요. 그 결과 경이로운 마지막 건물이 세워질 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_187:0 "레기스탄이 세계를 향한 문을 열 때 이맘들은 금박으로 덮인 돔 아래에서 낭송합니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_187:0 "우리는 아직 레기스탄의 완성을 전 세계에 선언할 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_188:0 "@tv_ceremony_ruler!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_188:0 "#Y 진행 중#! — #high 칸이 성벽 복원을 명령하다#!\n#F 히바의 칸은 부서진 진흙 벽돌과 모래로 뒤덮인 성문을 조사하면서 이찬 칼라의 고대 성벽을 옛 힘과 영광으로 복원하라고 명령합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_188:0 "#G 완료#! — #high 칸은 성벽을 복원하라고 명령했습니다.#!\n#F 히바의 칸은 부서진 진흙 벽돌과 모래로 뒤덮인 성문을 조사하면서 이찬 칼라의 고대 성벽을 옛 힘과 영광으로 복원하라고 명령합니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_188:0 "[tv_wonder_ceremony|E]：칸이 성벽 복원을 명령하다"
 TV_WONDER_CEREMONY_S1_DESC_188:0 "무너져가는 진흙 벽돌과 모래로 뒤덮인 성문을 조사하는 히바의 칸은 이찬 칼라의 고대 성벽을 옛 힘과 영광으로 복원하라고 명령합니다. 전령관들은 오래된 사막 점토에 능숙한 석공을 요구하며 오아시스 마을로 나갑니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_188:0 "칸의 전령들은 석공을 소환하기 위해 오아시스 마을로 달려갑니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_188:0 "나는 이 법령을 좀 더 오래 유지하겠습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_188:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_188:0 "#Y 진행 중#! — #high 오래된 성문에서 모래 제거#!\n#F 노동자들은 아타-다르보자(Ata-Darvoza)와 기타 오래된 성문의 바닥에서 여러 세대에 걸쳐 떠내려온 모래를 제거하여 오랫동안 잊힌 통치자들이 세운 토대를 드러냈습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_188:0 "#G 완료#! — #high 오래된 성문에서 모래 제거#!\n#F 노동자들은 아타-다르보자(Ata-Darvoza) 및 기타 오래된 성문의 바닥에서 여러 세대에 걸쳐 떠내려온 모래를 제거하여 오랫동안 잊힌 통치자들이 세운 토대를 드러냈습니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_188:0 "[tv_wonder_ceremony|E]：오래된 성문의 모래 제거"
 TV_WONDER_CEREMONY_S2_DESC_188:0 "노동자들은 Ata-Darvoza 및 기타 오래된 성문의 바닥에서 여러 세대에 걸쳐 떠내려온 모래를 제거하여 오랫동안 잊힌 통치자들이 세운 기초를 드러냅니다. 캐러밴은 다가오는 벽돌 공장에 공급하기 위해 오아시스 들판에서 짚과 점토를 운반해야 합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_188:0 "인부들은 마침내 오래된 대문에서 떠다니는 모래를 치우고 있습니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_188:0 "모래는 잠시 동안 문을 묻어두기 위해 남겨두었습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_188:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_188:0 "#Y 진행 중#! — #high Imams 복원을 축복#!\n#F Imams는 노동자의 안전과 복원된 도시의 인내를 위해 기도를 드리며 오래된 벽을 걸으며, 벽돌공은 짚, 점토, 사막 모래를 물려받은 비율로 섞습니다. 세기.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_188:0 "#G 완료#! — #high Imams 복원을 축복#!\n#F Imams는 노동자의 안전과 복원된 도시의 인내를 위해 기도를 드리며 오래된 벽을 걸으며, 벽돌공은 짚, 점토, 사막 모래를 물려받은 비율로 섞습니다. 세기.#!"
 TV_WONDER_CEREMONY_S3_TITLE_188:0 "[tv_wonder_ceremony|E]: 이맘들이 복원을 축복합니다"
 TV_WONDER_CEREMONY_S3_DESC_188:0 "이맘들은 노동자들의 안전과 복원된 도시의 인내를 위해 기도를 드리며 오래된 성벽을 거닐고, 벽돌공들은 수 세기 동안 전해 내려온 옛날 비율에 따라 짚, 점토, 사막 모래를 섞습니다. 첫 번째 복원된 코스는 가장 파괴된 벽을 따라 솟아 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_188:0 "성벽이 축복을 받기를 바랍니다!"
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_188:0 "이맘들은 지금은 기도를 보류하고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_188:0 "@tv_ceremony_building_needs!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_188:0 "#Y 진행 중#! — #high 이찬 칼라의 벽이 새로운 점토를 가져옴#!\n#F 신선한 진흙 벽돌 코스가 이찬 칼라의 고대 토대 위에 솟아 있으며, 정리와 축복 후에 진정한 복원 작업이 마침내 진행되고 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_188:0 "#G 완료#! — #high 이찬 칼라의 벽이 새로운 점토를 가져옴#!\n#F 신선한 진흙 벽돌 코스가 이찬 칼라의 고대 토대 위에 솟아 있으며, 정리와 축복 후에 진정한 복원 작업이 마침내 진행되고 있습니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_188:0 "[tv_wonder_ceremony|E]：이찬 칼라(Ichan Kala)의 벽이 새로운 점토를 사용합니다"
 TV_WONDER_CEREMONY_S4_DESC_188:0 "신선한 진흙 벽돌 코스가 이찬 칼라(Ichan Kala)의 고대 기초 위에 솟아 있으며, 개간과 축복 이후 마침내 진정한 복원 작업이 진행되고 있습니다. 석공들이 더위가 내리기 전 시원한 사막의 아침을 헤쳐나가는 동안 포플러 기둥의 비계가 벽을 따라 늘어서 있습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_188:0 "석공들은 사막의 열기가 시작되기 전에 새로운 진흙 벽돌을 쌓습니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_188:0 "아직은 아니다, 이 더위에!"
 TV_WONDER_CEREMONY_CARD_ICON_S5_188:0 "@tv_ceremony_building_levels!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_188:0 "#Y 진행 중#! — #high 청록색 첨탑은 웅크리고 넓게 자랍니다.#!\n#F 건축가들은 부하라의 모든 탑을 왜소하게 만들 만큼 거대한 첨탑의 넓은 청록색 타일 기반을 깔고 있지만, 의도된 위치에서는 영원히 미완성 상태로 서 있을 것입니다. 높이.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_188:0 "#G 완료#! — #high 청록색 첨탑은 웅장하고 넓게 성장합니다.#!\n#F 건축가들은 부하라의 모든 탑을 왜소하게 만들 거대한 첨탑의 넓은 청록색 타일 기반을 깔았지만, 의도한 대로 영원히 미완성 상태로 서 있을 것입니다. 높이.#!"
 TV_WONDER_CEREMONY_S5_TITLE_188:0 "[tv_wonder_ceremony|E]:청록색 첨탑이 웅크리고 넓게 자랍니다."
 TV_WONDER_CEREMONY_S5_DESC_188:0 "건축업자들은 부하라의 모든 탑을 왜소하게 만들 만큼 거대한 첨탑의 넓은 청록색 타일 기반을 깔았지만, 이 첨탑은 의도한 높이에서 영원히 미완성 상태로 서 있을 것입니다. 타일 세터들은 사막의 태양 아래 파란색과 녹색 유약 띠로 낮은 코스를 덮습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_188:0 "타일 세공인들은 미나렛의 넓은 바닥 전체에 청록색 유약 띠를 깔아 놓았습니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_188:0 "미나렛의 바닥에는 청록색 유약이 그대로 남아 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_188:0 "@tv_ceremony_literacy!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_188:0 "#Y 진행 중#! — #high 캐러밴 거리를 따라 솟아오르는 마드라사#!\n#F 새로운 마드라사는 내벽 사이의 주요 거리를 따라 솟아오릅니다. 조각된 나무 문과 오아시스 문을 통과하는 학생과 여행자를 환영하기 위해 복원된 청록색 포털이 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_188:0 "#G 완료#! — #high 캐러밴 거리를 따라 솟아오르는 마드라사#!\n#F 새로운 마드라사는 내벽 사이의 주요 거리를 따라 솟아오릅니다. 조각된 나무 문과 오아시스 문을 통과하는 학생과 여행자를 환영하기 위해 복원된 청록색 포털이 있습니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_188:0 "[tv_wonder_ceremony|E]: 캐러밴 거리를 따라 솟아오르는 마드라사스"
 TV_WONDER_CEREMONY_S6_DESC_188:0 "내부 벽 사이의 주요 거리를 따라 새로운 마드라사가 솟아 있으며, 조각된 나무 문과 청록색 정문이 복원되어 오아시스 문을 통과하는 학생과 여행자를 맞이합니다. 캐러밴 상인들은 아직 건물 정면에 붙어 있는 비계 그늘에서 흥정을 하고 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_188:0 "캐러밴 거리로 배움을 돌려주세요!"
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_188:0 "마드라사의 문은 한동안 닫혀 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_188:0 "@tv_ceremony_city_capital!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_188:0 "#Y 진행 중#! — #high 쿠냐 방주가 화려함을 되찾다#!\n#F 공예가들이 옛 쿠냐 방주 성채의 타일로 마감된 이완과 알현실을 복원하고 알현실 천장에 금을 입히고 하렘을 다시 칠합니다. 조각된 나무 기둥.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_188:0 "#G 완료#! — #high 쿠냐 방주가 화려함을 되찾다#!\n#F 공예가들이 옛 쿠냐 방주 성채의 타일로 마감된 이완과 알현실을 복원하고 왕좌의 방 천장을 금으로 칠하고 하렘의 조각된 나무 기둥.#!"
 TV_WONDER_CEREMONY_S7_TITLE_188:0 "[tv_wonder_ceremony|E]: 쿠냐 방주(Kunya-Ark)가 화려함을 되찾다"
 TV_WONDER_CEREMONY_S7_DESC_188:0 "장인들은 옛 쿠냐-아크 성채의 타일로 마감된 이완과 알현실을 복원하고, 알현실 천장에 금을 입히고 하렘의 조각된 나무 기둥을 다시 칠합니다. 칸은 거의 완료된 분기를 검사하고 모든 출입구를 직접 테스트합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_188:0 "칸이 각 출입구를 직접 테스트하는 동안 장인들이 알현실 천장에 금을 입혔습니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_188:0 "아직은 아닙니다. 성채는 그의 눈에 맞지 않습니다!"
 TV_WONDER_CEREMONY_CARD_ICON_S8_188:0 "@tv_ceremony_building_open!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_188:0 "#Y 진행 중#! — #high 성벽 도시가 다시 빛난다#!\n#F 이맘이 모든 문에서 축복을 낭송하고 이찬 칼라가 캐러밴과 학자의 새로운 시대를 위해 갱신되었음을 선언하는 동안 칸은 복원된 성벽 전체를 순회합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_188:0 "#G 완료#! — #high 성벽 도시가 다시 빛난다#!\n#F 이맘이 모든 문에서 축복을 낭송하는 동안 칸은 복원된 성벽 전체를 순회하며 이찬 칼라가 또 다른 캐러밴 시대를 위해 새롭게 되었다고 선언합니다. 학자.#!"
 TV_WONDER_CEREMONY_S8_TITLE_188:0 "[tv_wonder_ceremony|E]: 성벽 도시가 다시 빛난다"
 TV_WONDER_CEREMONY_S8_DESC_188:0 "칸은 이맘들이 모든 문에서 축복을 낭송하고 캐러밴과 학자들의 또 다른 시대를 위해 갱신된 이찬 칼라를 선언하는 동안 복원된 성벽 전체를 순회합니다. 오늘부터 성벽으로 둘러싸인 도시의 복원된 화려함은 칸국 전체에 걸쳐 칸의 통치에 새로운 무게와 입지를 부여합니다.\n\n#weak 의식을 완료하려면 필요한 가격을 지불하세요. 결과적으로 불가사의의 마지막 건물이 세워질 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_188:0 "나는 이 벽의 전체 순환을 타고 이찬 칼라가 갱신되었음을 선언합니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_188:0 "칸의 마지막 행렬을 위해 문은 닫혀 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_189:0 "@tv_ceremony_ruler!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_189:0 "#Y 진행 중#! — #high 아르슬란 칸이 천국으로 향하는 탑을 지휘하다#!\n#F 카라카니드 통치자 아르슬란 칸은 금요일 모스크 옆에 첨탑을 높이 세워 기도하라는 신호가 오아시스 전체에서 들을 수 있도록 명령한다. 부하라.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_189:0 "#G 완료#! — #high 아르슬란 칸이 천국으로 향하는 탑을 명령하다#!\n#F 카라카니드의 통치자 아르슬란 칸은 금요일 모스크 옆에 첨탑을 높이 세워 기도하라는 명령을 오아시스 전체에 들을 수 있도록 명령했다. 부하라.#!"
 TV_WONDER_CEREMONY_S1_TITLE_189:0 "[tv_wonder_ceremony|E]: 아르슬란 칸이 하늘로 향하는 탑을 지휘하다"
 TV_WONDER_CEREMONY_S1_DESC_189:0 "카라카니드의 통치자 아르슬란 칸(Arslan Khan)은 금요일 모스크 옆에 첨탑을 높이 세워 부하라의 오아시스 전체에서 기도를 외치는 소리를 들을 수 있도록 명령했습니다. 트란속시아나 전역의 장인 건축업자와 벽돌 제작자가 통치자의 궁정으로 소환됩니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_189:0 "나는 최고의 건축자들을 소환합니다. 이 첨탑은 하늘에 닿을 것입니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_189:0 "법원은 침묵에 빠졌고 소환장은 한동안 묵인 상태로 남아 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_189:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_189:0 "#Y 진행 중#! — #high 흐르는 모래에 맞서는 깊은 기초#!\n#F 엔지니어들은 유난히 깊은 기초를 파고 갈대를 묶음으로 포장합니다. 세기.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_189:0 "#G 완료#! — #high 움직이는 모래에 맞서는 깊은 기초#!\n#F 엔지니어들은 유난히 깊은 기초를 파고 갈대를 묶음으로 포장합니다. 세기.#!"
 TV_WONDER_CEREMONY_S2_TITLE_189:0 "[tv_wonder_ceremony|E]: 움직이는 모래에 맞서는 깊은 기초"
 TV_WONDER_CEREMONY_S2_DESC_189:0 "엔지니어들은 비정상적으로 깊은 기초를 파고 갈대를 묶음으로 포장합니다. 이는 수세기 동안 부하라의 변화하는 토양에 다가오는 타워를 똑바로 세우기 위한 기술입니다. 그 후 몇 주 동안 도시 주변의 가마에서는 수천 개의 구운 벽돌이 구워집니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_189:0 "탑은 뿌리가 깊어야 서게 된다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_189:0 "나는 아직 모래가 그런 무게를 지탱할 수 있다는 것을 믿지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_189:0 "@tv_ceremony_clergy!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_189:0 "#Y 진행 중#! — #high 카디가 첫 번째 코스를 축복합니다#!\n#F 시 추장 카디가 학자와 장인이 모이기 전에 첫 번째 구운 벽돌 코스를 축복하고 깊은 기초 구덩이 위에 시를 낭송합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_189:0 "#G 완료#! — #high 카디가 첫 번째 코스를 축복합니다#!\n#F 시 추장 카디가 학자와 장인이 모이기 전에 구운 벽돌의 첫 번째 코스를 축복하고 깊은 기초 구덩이 위에 시를 낭송합니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_189:0 "[tv_wonder_ceremony|E]：카디가 첫 번째 코스를 축복하다"
 TV_WONDER_CEREMONY_S3_DESC_189:0 "도시의 추장 카디는 학자와 장인이 모인 가운데 깊은 기초 구덩이 위에서 시를 낭송하며 구운 벽돌의 첫 번째 과정을 축복합니다. 인부들은 솟아오르는 통로를 따라 건설된 나선형 흙 경사로 위로 벽돌과 모르타르를 운반하는 긴 오르막길을 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_189:0 "카디는 갓 쌓은 벽돌을 축복하는 목소리를 높였습니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_189:0 "축복받지 못한 돌은 헛된 돌이다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_189:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_189:0 "#Y 진행 중#! — #high 미나렛의 수갱이 솟아오르기 시작합니다#!\n#F 과정을 거쳐 미나렛의 점점 가늘어지는 벽돌 자루가 모스크 안뜰 위로 올라가고, 깊은 굴착 작업과 카디의 작업을 거쳐 마침내 진정한 건물이 건설됩니다. 축복.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_189:0 "#G 완료#! — #high 미나렛의 수갱이 솟아오르기 시작합니다#!\n#F 과정을 거쳐 미나렛의 점점 가늘어지는 벽돌 자루가 모스크 안뜰 위로 올라가고, 깊은 굴착과 카디의 작업을 거쳐 마침내 진정한 건물이 건설됩니다. 축복.#!"
 TV_WONDER_CEREMONY_S4_TITLE_189:0 "[tv_wonder_ceremony|E]：미나렛의 샤프트가 올라가기 시작합니다"
 TV_WONDER_CEREMONY_S4_DESC_189:0 "코스를 거치면서 점점 가늘어지는 미나렛의 벽돌 기둥이 모스크 안뜰 위로 올라가고, 깊은 발굴 작업과 카디의 축복을 받은 후 마침내 진정한 건물이 건설됩니다. 나선형 경사로는 매달 타워가 하늘을 향해 점점 더 길어집니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_189:0 "나는 수갱의 오르막길을 코스별로 지켜보며 하늘이 점점 가까워지는 것을 느낀다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_189:0 "인부들은 도구를 내려놓았고 경사로는 아직 미완성 상태로 남아 있었습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_189:0 "@tv_ceremony_art_work!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_189:0 "#Y 진행 중#! — #high 상향 바람 패턴의 14개 밴드#!\n#F 마스터 벽돌 층은 탑의 표면을 나선형으로 나선형으로 그리는 14개의 서로 다른 기하학적 벽돌 밴드를 설정합니다. 각 패턴은 미묘하게 다르기 때문에 미나렛에 두 개의 고리가 생기지 않습니다. 반복.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_189:0 "#G 완료#! — #high 상향 바람 패턴의 14개 밴드#!\n#F 마스터 벽돌 층은 탑의 표면 위로 나선형으로 올라가는 14개의 서로 다른 기하학적 벽돌 밴드를 설정했습니다. 각 패턴은 미묘하게 다르기 때문에 미나렛에 두 개의 고리가 생기지 않습니다. 반복.#!"
 TV_WONDER_CEREMONY_S5_TITLE_189:0 "[tv_wonder_ceremony|E]: 패턴 바람의 14밴드 상향"
 TV_WONDER_CEREMONY_S5_DESC_189:0 "벽돌 시공 전문가들은 탑의 표면을 나선형으로 나선형으로 그리는 14개의 독특한 기하학적 벽돌 띠를 설정했는데, 각 패턴은 미묘하게 달라서 미나렛의 두 고리가 반복되지 않습니다. 청록색 유리 타일이 하나의 높은 띠로 설정되어 햇볕에 그을린 벽돌의 첫 번째 색상을 엿볼 수 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_189:0 "반복되는 아름다움은 잊혀진 아름다움입니다. 두 개의 반지가 동일하지 않도록 하십시오."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_189:0 "나는 아직 이 패턴이 탑에 합당한지 확신하지 못합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_189:0 "@tv_ceremony_building_levels!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_189:0 "#Y 진행 중#! — #high 갤러리가 샤프트를 장식합니다#!\n#F 건축업자는 타워 꼭대기 근처에 무에진 갤러리를 완성합니다. 아치 고리는 하루에 5번 좁은 내부 계단을 오르는 방문객을 보호하기 위한 것입니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_189:0 "#G 완료#! — #high 갤러리가 샤프트를 장식합니다#!\n#F 건축업자는 타워 정상 근처에 있는 무에진 갤러리를 완성합니다. 아치 고리는 좁은 내부 계단을 하루 5번 오르는 방문객을 보호하기 위한 것입니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_189:0 "[tv_wonder_ceremony|E]: 갤러리가 샤프트를 장식합니다"
 TV_WONDER_CEREMONY_S6_DESC_189:0 "건축업자들은 타워 꼭대기 근처에 무에진 갤러리를 완성합니다. 아치의 고리는 좁은 내부 계단을 하루에 5번 오르는 방문자를 보호하기 위한 것입니다. 아래에는 인접한 칼얀 모스크의 벽이 그 옆에 있는 첨탑과 보조를 맞춰 솟아 있습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_189:0 "건축업자들은 아치형 고리를 들어올려 마침내 미나렛의 정상을 장식합니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_189:0 "왕관이 없는 탑은 반만 말한 기도이다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_189:0 "@tv_ceremony_literacy!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_189:0 "#Y 진행 중#! — #high A 마드라사는 첨탑의 그림자 속에서 성장합니다#!\n#F A 새로운 마드라사는 우뚝 솟은 첨탑의 그늘에서 솟아오르고 있으며, 학생들은 이미 미완성 안뜰에 모여 탑의 랜턴이 각각의 처음과 마지막 빛을 받는 것을 지켜보고 있습니다. 일.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_189:0 "#G Completed#! — #high A 첨탑의 그림자 속에서 성장하는 마드라사#!\n#F A 새로운 마드라사가 우뚝 솟은 첨탑의 그늘에서 솟아오르고, 학생들은 이미 미완성 안뜰에 모여 탑의 랜턴이 각각의 처음과 마지막 빛을 받는 것을 지켜보고 있습니다. 일.#!"
 TV_WONDER_CEREMONY_S7_TITLE_189:0 "[tv_wonder_ceremony|E]：미나렛의 그림자 속에서 자라는 마드라사"
 TV_WONDER_CEREMONY_S7_DESC_189:0 "우뚝 솟은 첨탑의 그늘에 새로운 마드라사가 솟아 있고, 학생들은 이미 미완성 안뜰에 모여 탑의 등불이 매일의 첫 번째와 마지막 빛을 받는 것을 지켜보고 있습니다. 캐러밴 상인들은 하루 동안 대초원을 가로지르는 동안 탑이 보일 수 있다는 사실에 놀라며 모스크 문에서 잠시 멈춰 섰습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우에는 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_189:0 "나는 탑의 그림자 속에서 이 마드라사를 발견했습니다. 배움이 함께 성장할 수 있기를 바랍니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_189:0 "안뜰은 한동안 비어 있었고, 학생들은 아직 모이지 않았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_189:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_189:0 "#Y 진행 중#! — #high 오아시스를 가로질러 부르는 칼얀 첨탑#!\n#F 카디는 완성된 탑의 좁은 계단에 올라 갤러리에서 첫 번째 기도를 외칩니다. 이제 내화 벽돌 샤프트는 바그다드와 바그다드 사이에서 가장 높은 구조물입니다. 사마르칸트.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_189:0 "#G 완성#! — #high 오아시스를 가로질러 부르는 칼얀 첨탑#!\n#F 카디는 완성된 탑의 좁은 계단에 올라 갤러리에서 첫 번째 기도를 외칩니다. 내화 벽돌 샤프트는 현재 바그다드와 바그다드 사이에서 가장 높은 구조물입니다. 사마르칸트.#!"
 TV_WONDER_CEREMONY_S8_TITLE_189:0 "[tv_wonder_ceremony|E]: 오아시스를 가로질러 부르는 칼얀 첨탑"
 TV_WONDER_CEREMONY_S8_DESC_189:0 "카디는 완성된 탑의 좁은 계단을 올라 갤러리에서 기도를 요청하는 첫 번째 신호를 보냅니다. 이 탑의 구운 벽돌 샤프트는 현재 바그다드와 사마르칸트 사이에서 가장 높은 구조물입니다. 오늘부터 부하라 위에 있는 첨탑의 존재는 오아시스 전체에 메아리치는 그 부름을 듣는 모든 사람의 헌신을 더욱 깊게 합니다.\n\n#weak 의식을 완료하려면 필요한 대가를 지불하세요. 결과적으로 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_189:0 "카디의 부름은 갤러리에서 울려 퍼지며 오아시스 전체를 가로지릅니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_189:0 "나는 아직 탑의 목소리를 들을 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_190:0 "@tv_ceremony_ruler!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_190:0 "#Y 진행 중#! — #high 칸이 코칸드를 위해 궁전을 지휘하다#!\n#F 풍부한 페르가나 계곡의 통치자인 코칸드의 칸은 비단을 따라 성장하는 자신의 칸국의 부에 걸맞는 사절과 공물을 받기 위해 새로운 궁전이 일어나도록 명령합니다. 도로.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_190:0 "#G Completed#! — #high The Khan Commands a Palace for Kokand#!\n#F The Khan of Kokand, ruler of the rich Ferghana valley, commands that a new palace rise to receive envoys and tribute befitting his khanate's growing wealth along the silk roads.#!"
 TV_WONDER_CEREMONY_S1_TITLE_190:0 "[tv_wonder_ceremony|E]: 칸이 코칸드를 위해 궁전을 지휘하다"
 TV_WONDER_CEREMONY_S1_DESC_190:0 "풍요로운 페르가나 계곡의 통치자인 코칸드의 칸은 실크로드를 따라 성장하는 칸국의 부에 걸맞는 사절과 공물을 받기 위해 새로운 궁전을 세우라고 명령합니다. 부하라와 카슈가르의 건축가들이 소환되어 페인트칠된 홀과 정원에 대한 첫 번째 계획을 세웁니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_190:0 "칸은 부하라와 카슈가르에서 건축가를 소환하는 법령을 발표합니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_190:0 "건축가를 기다리게 하라. 우리는 아직 이것을 명령할 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_190:0 "@tv_ceremony_vegetation!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_190:0 "#Y 진행 중#! — #high 채색된 기둥 때문에 벌목된 포플러#!\n#F 나무꾼들이 계곡의 과수원에서 큰 포플러와 호두나무를 베어냈고, 이는 궁전의 유명한 그림이 될 목재에 양념을 더했습니다. 열.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_190:0 "#G 완료#! — #high 채색된 기둥을 위해 벌목된 포플러#!\n#F 나무꾼들은 계곡의 과수원에서 키 큰 포플러와 호두나무를 베어냈고, 이는 궁전의 유명한 그림이 될 목재에 양념을 더했습니다. 열.#!"
 TV_WONDER_CEREMONY_S2_TITLE_190:0 "[tv_wonder_ceremony|E]：페인팅된 기둥 때문에 쓰러진 포플러"
 TV_WONDER_CEREMONY_S2_DESC_190:0 "나무꾼들은 계곡의 과수원에서 큰 포플러와 호두나무를 베어내어 궁전의 유명한 그림 기둥이 될 목재에 양념을 가했습니다. 캐러밴은 칸국의 무역로 전역에서 염료, 금박, 조각된 대리석 외장을 가져옵니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_190:0 "나무꾼들은 계곡의 포플러나무를 쓰러뜨렸고, 대상들은 염료와 금박을 가지고 출발했습니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_190:0 "나무꾼들은 도끼를 내려놓았지만 대상들은 보내지 않은 채 남아있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_190:0 "@tv_ceremony_time!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_190:0 "#Y 진행 중#! — #high 궁정 점성가가 날짜를 선택합니다#!\n#F 칸의 궁정 점성가가 착공을 위해 상서로운 날을 선택하고, 물라는 신하들이 모이기 전에 궁전 부지를 축복합니다. 장인.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_190:0 "#G 완료#! — #high 궁정 점성가가 날짜를 선택합니다#!\n#F 칸의 궁정 점성가가 착공식을 위한 상서로운 날을 선택하고, 물라는 신하들이 모이기 전에 궁전 부지를 축복합니다. 장인.#!"
 TV_WONDER_CEREMONY_S3_TITLE_190:0 "[tv_wonder_ceremony|E]：궁정 점성가가 날짜를 선택합니다"
 TV_WONDER_CEREMONY_S3_DESC_190:0 "칸의 궁정 점성가는 착공을 위한 상서로운 날을 선택하고, 물라들은 신하와 장인들이 모이기 전에 궁전 부지를 축복합니다. 노동자들은 앞으로 뻗어나가는 안뜰 단지가 될 건물의 외벽을 올리기 시작합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 비용을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_190:0 "우리는 별을 읽었습니다. 땅이 축복받고 성벽이 건설되기 시작하십시오."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_190:0 "점성가는 인내심을 권고하지만 성벽은 건설되지 않은 채로 남아 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_190:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_190:0 "#Y 진행 중#! — #high 알현실의 목재가 세워진다#!\n#F 목수들이 대알람홀의 첫 번째 채색된 목재 기둥을 들어올리고, 점성술사의 축복과 함락 이후 마침내 궁전의 진정한 건축이 진행됩니다. 포플러.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_190:0 "#G 완료#! — #high 알현실의 목재가 세워졌습니다#!\n#F 목수들이 대알람홀의 첫 번째 채색된 목재 기둥을 올렸습니다. 점성술사의 축복과 함락 이후 마침내 진정한 궁전 건축이 진행됩니다. 포플러.#!"
 TV_WONDER_CEREMONY_S4_TITLE_190:0 "[tv_wonder_ceremony|E]：알현청의 목재를 키우다"
 TV_WONDER_CEREMONY_S4_DESC_190:0 "목수들은 대알람실의 첫 번째로 칠해진 목재 기둥을 세웁니다. 점성가의 축복과 포플러나무의 벌목 이후 마침내 궁전의 진정한 건물이 진행됩니다. 금도금업자와 화가들이 지붕 들보가 세팅되기도 전에 손을 잡고 바짝 따라갑니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_190:0 "목수들은 관객석의 칠해진 기둥을 제자리에 들어 올립니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_190:0 "우리는 아직 이 기둥을 들어 올리기 위해 목수를 부르지 않을 것입니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_190:0 "@tv_ceremony_painter!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_190:0 "#Y 진행 중#! — #high 화가들이 안뜰을 컬러로 칠합니다#!\n#F 마스터 화가들은 수십 개의 나무 기둥에 걸쳐 패널별로 작업하면서 빨간색, 파란색, 금색의 복잡한 꽃무늬와 기하학적 패턴으로 궁전의 안뜰을 칠합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_190:0 "#G 완료#! — #high 화가들이 안뜰을 컬러로 칠합니다#!\n#F 마스터 화가들은 수십 개의 나무 기둥에 걸쳐 패널별로 작업하면서 빨간색, 파란색, 금색의 복잡한 꽃무늬와 기하학적 패턴으로 궁전의 내부 안뜰을 칠합니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_190:0 "[tv_wonder_ceremony|E]：화가들이 마당을 색으로 칠하다"
 TV_WONDER_CEREMONY_S5_DESC_190:0 "대가들은 궁전의 내부 안뜰을 빨간색, 파란색, 금색의 복잡한 꽃무늬와 기하학적 패턴으로 칠하며, 수십 개의 나무 기둥에 걸쳐 패널을 하나씩 작업합니다. 이미 코칸드를 지나던 사절들은 반쯤 완성된 갤러리를 감상하기 위해 잠시 멈춥니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_190:0 "마스터 화가들은 안뜰 기둥 전체에 빨간색, 파란색, 금색을 뿌렸습니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_190:0 "화가들은 붓을 내려놓고 화랑은 절반만 색칠해 두었습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_190:0 "@tv_ceremony_gold!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_190:0 "#Y 진행 중#! — #high 알현실의 천장이 도금되었습니다.#!\n#F 장인들이 언젠가 칸이 상인과 라이벌 칸 모두로부터 공물을 받게 될 대알람실의 격자 천장에 금박을 입혔습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_190:0 "#G 완료#! — #high 알현실의 천장은 금박으로 장식되어 있습니다.#!\n#F 장인들은 언젠가 칸이 상인과 라이벌 칸 모두로부터 공물을 받게 될 대알람실의 격자 천장에 도금을 마쳤습니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_190:0 "[tv_wonder_ceremony|E]：알현실의 천장은 도금되어 있습니다"
 TV_WONDER_CEREMONY_S6_DESC_190:0 "장인들은 언젠가 칸이 상인과 라이벌 칸 모두로부터 공물을 받게 될 대알람실의 격자 천장에 금을 입혔습니다. 아래 벽에는 계곡 너머 채석장에서 엄청난 비용을 들여 가져온 대리석 외장이 설치되어 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_190:0 "태양 자체처럼 빛나게 해주세요!"
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_190:0 "금박공들이 기다리고 있고, 천장의 금고에는 금이 묻어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_190:0 "@tv_ceremony_food_productivity!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_190:0 "#Y 진행 중#! — #high 궁전 벽 뒤에 피어난 정원#!\n#F 정원사들은 궁전 뒤에 정식 정원을 배치하여 계곡 강에서 관개용수를 칸의 개인용 수영장과 과수원으로 연결합니다. 즐거움.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_190:0 "#G 완료#! — #high 궁전 벽 뒤에 피어난 정원#!\n#F 정원사들은 궁전 뒤에 정식 정원을 배치하고 계곡 강에서 관개용수를 칸의 개인용 연못과 과수원으로 연결합니다. 즐거움.#!"
 TV_WONDER_CEREMONY_S7_TITLE_190:0 "[tv_wonder_ceremony|E]:궁전 벽 뒤에 꽃이 핀 정원"
 TV_WONDER_CEREMONY_S7_DESC_190:0 "정원사들은 칸의 개인적인 즐거움을 위해 궁전 뒤에 정식 정원을 배치하고 계곡 강에서 웅덩이와 과수원으로 관개용수를 공급합니다. 길 건너편의 실크 상인들은 궁전의 새로운 산책길에 심을 희귀한 묘목을 선물로 남겨둡니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_190:0 "정원사는 계곡의 물을 새로운 과수원 사이의 웅덩이로 보냅니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_190:0 "아직은 아닙니다. 토양이 한 계절 더 쉬도록 하십시오!"
 TV_WONDER_CEREMONY_CARD_ICON_S8_190:0 "@tv_ceremony_wealth!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_190:0 "#Y 진행 중#! — #high 칸이 찬란하게 공물을 받다#!\n#F 칸은 완성된 궁전에서 첫 번째 대알현을 하고, 사절과 공물 운반자들은 칠해진 기둥과 금박을 입힌 천장을 지나 그의 앞에 비단, 은, 말을 놓았습니다. 왕좌.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_190:0 "#G 완료#! — #high 칸이 찬란하게 공물을 받다#!\n#F 칸은 완성된 궁전에서 첫 번째 대알현을 하고, 사절과 공물 운반자들은 칠해진 기둥과 금박을 입힌 천장을 지나 비단, 은, 말을 놓았습니다. 왕좌.#!"
 TV_WONDER_CEREMONY_S8_TITLE_190:0 "[tv_wonder_ceremony|E]: 칸이 찬란하게 공물을 받다"
 TV_WONDER_CEREMONY_S8_DESC_190:0 "칸은 완성된 궁전에서 처음으로 대규모 알현을 했으며, 사절과 공물 운반자들이 그려진 기둥과 금박을 입힌 천장을 지나 그의 왕좌 앞에 비단, 은, 말을 놓았습니다. 오늘부터 궁전의 화려함은 페르가나 계곡을 건너는 모든 사절 앞에서 칸의 약속에 새로운 무게를 더해 줍니다.\n\n#weak 의식을 완료하려면 필요한 대가를 지불하세요. 결과적으로 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_190:0 "칸은 마침내 금박을 입힌 천장 아래에서 조공을 받는 사람들을 맞이합니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_190:0 "왕좌의 방이 기다리고 있으며 공물을 바치는 사람들은 다른 날 다시 오라는 지시를 받습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_191:0 "@tv_ceremony_law!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_191:0 "#Y 진행 중#! — #high 칸의 바자회 법령#!\n#F A 법령이 차흐(Chach)의 옛 대상 문 아래에서 낭독됩니다. 실크로드 대상단이 이미 모여 있는 곳에 새로운 시장이 세워질 것이며, 통치자의 인장과 상인들의 축복을 받을 것입니다. 맹세합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_191:0 "#G 완료#! — #high 칸의 바자회 법령#!\n#F A 법령이 차흐(Chach)의 옛 대상 문 아래에서 읽혀졌습니다. 실크로드 대상단이 이미 모인 곳에 새로운 시장이 세워질 것이며, 통치자의 인장과 상인들의 축복을 받았습니다. 맹세합니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_191:0 "[tv_wonder_ceremony|E]：칸의 시장 칙령"
 TV_WONDER_CEREMONY_S1_DESC_191:0 "차흐(Chach)의 오래된 캐러밴 문 아래에서 칙령이 낭독됩니다. 실크로드 캐러밴이 이미 모인 곳에 새로운 시장이 열릴 것이며 통치자의 인장과 상인의 맹세에 의해 축복을 받을 것입니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_191:0 "나는 이 칙령에 도장을 찍었습니다. 차흐의 바자회를 일으키자."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_191:0 "서기관들은 더 상서로운 날을 기다리면서 그 법령을 제쳐두었습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_191:0 "@tv_ceremony_mapmode!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_191:0 "#Y 진행 중#! — #high 캐러밴 광장 측량#!\n#F 조사관은 캐러밴 사이의 먼지가 많은 광장을 빠르게 이동하여 지붕이 덮인 차선과 돔형 홀이 차 가판대와 짐을 싣는 동물 사이에 서게 될 위치를 표시합니다. 야드.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_191:0 "#G 완료#! — #high 캐러밴 광장 측량#!\n#F 조사관은 캐러밴 사이의 먼지가 많은 광장을 빠르게 이동하여 지붕이 있는 차선과 돔형 홀이 차 가판대와 짐을 싣는 동물 사이에 서게 될 위치를 표시합니다. 야드.#!"
 TV_WONDER_CEREMONY_S2_TITLE_191:0 "[tv_wonder_ceremony|E]：캐러밴 광장 조사"
 TV_WONDER_CEREMONY_S2_DESC_191:0 "측량사들은 캐러밴 사이의 먼지가 많은 광장을 돌아다니며 차 가판대와 동물 사육장 사이에 지붕이 있는 차선과 돔형 홀이 서게 될 위치를 표시합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_191:0 "선이 그려져 있어요!"
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_191:0 "측량사는 측정 코드를 접고 사각형에서 물러납니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_191:0 "@tv_ceremony_building_needs!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_191:0 "#Y 진행 중#! — #high 가마 및 캐러밴 조립#!\n#F 가마는 구운 벽돌과 유약 타일을 처음으로 굽고, 사마르칸트와 부하라에서 우회한 캐러밴은 목재, 구리 부속품 및 숙련된 석공을 가져옵니다. Chach.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_191:0 "#G 완료#! — #high Kilns and Caravans Assemble#!\n#F Kilns는 구운 벽돌과 유약 타일을 처음으로 굽고, 사마르칸트와 부하라에서 우회한 캐러밴은 목재, 구리 부속품 및 숙련된 석공을 가져옵니다. Chach.#!"
 TV_WONDER_CEREMONY_S3_TITLE_191:0 "[tv_wonder_ceremony|E]：가마와 캐러밴 조립"
 TV_WONDER_CEREMONY_S3_DESC_191:0 "가마에서는 구운 벽돌과 유약 타일을 처음으로 굽고, 사마르칸트와 부하라에서 출발한 캐러밴은 목재, 구리 부속품, 숙련된 석공을 차흐로 가져옵니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_191:0 "가마에 불을 붙이고 캐러밴을 소환하여 돌, 구리, 장인을 차흐로 가져옵니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_191:0 "아직은 아닙니다!"
 TV_WONDER_CEREMONY_CARD_ICON_S4_191:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_191:0 "#Y 진행 중#! — #high 첫 번째 돔 상승#!\n#F Masons는 지붕이 덮인 첫 번째 홀의 기초를 놓았고, 시장을 장식할 늑골이 있는 벽돌 돔이 시장 가판대 위로 천천히 오르기 시작합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_191:0 "#G 완료#! — #high 첫 번째 돔 상승#!\n#F Masons는 첫 번째 지붕이 있는 홀의 기초를 놓았고, 바자회를 장식할 늑골이 있는 벽돌 돔은 시장 가판대 위로 천천히 오르기 시작합니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_191:0 "[tv_wonder_ceremony|E]: 최초의 돔 상승"
 TV_WONDER_CEREMONY_S4_DESC_191:0 "석공들이 첫 번째 지붕이 있는 홀의 기초를 놓았으며 바자회를 장식할 늑골이 있는 벽돌 돔이 시장 가판대 위로 천천히 오르기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_191:0 "나는 직접 기초를 놓고 우리 돔이 올라가는 것을 지켜보았습니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_191:0 "석공들은 도구를 내려놓고 발판을 잠시 동안 그대로 두었습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_191:0 "@tv_ceremony_market!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_191:0 "#Y 진행 중#! — #high 아치형 차선의 형태가 바뀌다#!\n#F 공사가 끝나기 전에 섬유 상인과 환전상들이 이미 가장 좋은 가판대를 놓고 경쟁하고 있기 때문에 아치형 차선은 태양과 눈을 막는 지붕으로 늘어납니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_191:0 "#G 완료#! — #high 모양을 이루는 아치형 차선#!\n#F 목조상과 환전상들이 건설이 끝나기 전에 이미 가장 좋은 노점을 두고 서로 경쟁하고 있기 때문에 아치형 차선은 태양과 눈을 막는 지붕으로 늘어납니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_191:0 "[tv_wonder_ceremony|E]: 아치형 차선의 모양"
 TV_WONDER_CEREMONY_S5_DESC_191:0 "공사가 끝나기 전에 직물 상인과 환전상들이 이미 가장 좋은 가판대를 차지하려고 서로 경쟁하고 있기 때문에 햇빛과 눈을 막아주는 아치형 차선이 늘어납니다. \n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_191:0 "급하게 마감한 지붕은 오랫동안 아무도 피난처가 되지 않지만, 계절에 맞춰 지붕을 씌운 시장은 모두를 피난처로 삼는다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_191:0 "나는 차선이 서둘러 아치형으로 변하는 것을 보는 것보다 차라리 기다리는 편이 낫습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_191:0 "@tv_ceremony_lock!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_191:0 "#Y 진행 중#! — #high 캐러밴세라이 문이 걸려있습니다#!\n#F 무거운 조각 문이 시장 가장자리에 걸려 있으며, 캐러밴 시즌에 맞춰 대초원과 산에서 들어오는 기차를 받지 않고 받을 수 있습니다. 지연.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_191:0 "#G 완료#! — #high 캐러밴세라이 문이 걸려 있습니다#!\n#F 무거운 조각 문이 시장 가장자리에 걸려 있으며, 캐러밴 시즌에 맞춰 대초원과 산에서 들어오는 기차를 받지 않고 받을 수 있습니다. 지연.#!"
 TV_WONDER_CEREMONY_S6_TITLE_191:0 "[tv_wonder_ceremony|E]: 캐러밴세라이 문이 걸려있습니다"
 TV_WONDER_CEREMONY_S6_DESC_191:0 "무겁게 조각된 문이 바자회 가장자리에 걸려 있으며 캐러밴 시즌에 맞춰 대초원과 산에서 들어오는 기차를 지체 없이 받을 수 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_191:0 "대장장이들은 다음 캐러밴 시즌이 오기 전에 새겨진 문을 경첩에 걸어 놓습니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_191:0 "게이트를 기다려주세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S7_191:0 "@tv_ceremony_painter!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_191:0 "#Y 진행 중#! — #high 페인터와 타일 작업자가 홀 마무리#!\n#F 타일러는 아치 길을 따라 청록색과 코발트 패턴을 설정하고 화가는 길드 홀을 마무리하며 노점 배치에 대한 분쟁은 바자의 새 감독자.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_191:0 "#G 완료#! — #high 페인터와 타일러가 홀을 마무리합니다#!\n#F 타일러는 아치 길을 따라 청록색과 코발트 패턴을 설정하고 화가는 길드 홀을 마무리하며 노점 배치에 대한 분쟁은 바자회의 새 감독자.#!"
 TV_WONDER_CEREMONY_S7_TITLE_191:0 "[tv_wonder_ceremony|E]：페인터와 타일공이 홀을 마감합니다."
 TV_WONDER_CEREMONY_S7_DESC_191:0 "화가들이 길드 홀을 마무리하는 동안 타일공은 아치 길을 따라 청록색과 코발트 패턴을 설정하고, 노점 배치에 대한 분쟁은 바자의 새로운 감독자들에 의해 해결됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_191:0 "나는 청록색 타일 작업을 직접 의뢰하고 완성된 홀을 내 눈으로 감상합니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_191:0 "타일공이 패턴을 덮고 홀은 한동안 미완성 상태로 남아 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_191:0 "@tv_ceremony_trade!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_191:0 "#Y 진행 중#! — #high 차흐의 바자회가 세계를 향해 열린다#!\n#F 새로운 시장의 돔이 북소리와 기도 소리에 공개되고, 실크로드의 모든 방향에서 온 대상들이 이제 차흐를 무역의 중심지로 선호하고 외교.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_191:0 "#G 완료#! — #high 차흐의 바자회가 세계를 향해 열립니다#!\n#F 새로운 시장의 돔이 북소리와 기도에 공개되고, 실크로드의 모든 방향에서 온 대상들이 이제 무역과 무역의 중심지로서 차흐를 선호합니다. 외교.#!"
 TV_WONDER_CEREMONY_S8_TITLE_191:0 "[tv_wonder_ceremony|E]：Chach's Bazaar가 세계를 향해 열린다"
 TV_WONDER_CEREMONY_S8_DESC_191:0 "드럼과 기도 소리에 맞춰 새로운 시장의 돔이 공개되고, 실크로드의 모든 방향에서 온 대상들이 이제 무역과 외교의 중심지로서 차흐를 선호합니다.\n\n#weak 식을 완료하는 데 필요한 가격을 지불하세요. 결과적으로 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_191:0 "문을 열면 온 세상이 당신의 문으로 향할 것입니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_191:0 "나는 Chach를 세상에 공개하기 전에 드럼을 조금 더 조용히 유지합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_192:0 "@tv_ceremony_government!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_192:0 "#Y 진행 중#! — #high 왕관이 새로운 루브르 박물관을 선포하다#!\n#F 루브르 박물관의 오래된 중세 성채에서 왕관은 성벽을 지배 왕조의 얼굴로 대체하기 위해 아케이드와 갤러리로 이루어진 새로운 궁전을 선포합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_192:0 "#G 완료#! — #high 왕관이 새로운 루브르 박물관을 선포하다#!\n#F 루브르 박물관의 오래된 중세 성채에서 왕관은 성벽을 통치 왕조의 얼굴로 대체하기 위해 아케이드와 갤러리로 이루어진 새로운 궁전을 선포합니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_192:0 "[tv_wonder_ceremony|E]：왕관이 새로운 루브르 박물관을 선포하다"
 TV_WONDER_CEREMONY_S1_DESC_192:0 "루브르 박물관의 오래된 중세 성채에서 왕관은 성벽을 통치 왕조의 얼굴로 대체하기 위해 아케이드와 갤러리로 이루어진 새로운 궁전을 선포합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_192:0 "성벽 뒤에 숨은 왕조는 곧 잊혀진다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_192:0 "우리는 아직 이 성벽을 왕조의 얼굴로 바꿀 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_192:0 "@tv_ceremony_mapmode!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_192:0 "#Y 진행 중#! — #high 세느강에 소환된 건축가#!\n#F 건축가와 석공의 대가가 강둑 부지와 법원에 걸맞은 초안을 조사하기 위해 왕국 전역에서 소환됩니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_192:0 "#G 완료#! — #high 세느강에 소환된 건축가#!\n#F 건축가와 석공의 대가가 강둑 부지와 법원에 걸맞은 초안을 조사하기 위해 왕국 전역에서 소환됩니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_192:0 "[tv_wonder_ceremony|E]: 세느강에 소환된 건축가들"
 TV_WONDER_CEREMONY_S2_DESC_192:0 "건축가와 석공 석공들이 강둑 부지를 조사하고 법원에 걸맞는 건물 초안을 조사하기 위해 왕국 전역에서 소환됩니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_192:0 "소환이 나가고 석공의 대가들이 세느강으로 출발했습니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_192:0 "서둘러 그려진 외관은 법원을 거의 기쁘게하지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_192:0 "@tv_ceremony_art_work!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_192:0 "#Y 진행 중#! — #high 채석장 및 조각가 의뢰#!\n#F 센 강변의 채석장은 창백한 돌로 임대되었으며, 조각가들은 궁전의 새로운 날개를 장식할 장식을 조각하도록 의뢰 받았습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_192:0 "#G 완료#! — #high 채석장 및 조각가 의뢰#!\n#F 센 강변의 채석장은 창백한 돌로 임대되었으며, 조각가들은 궁전의 새로운 날개를 장식할 장식을 조각하도록 의뢰 받았습니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_192:0 "[tv_wonder_ceremony|E]:채석장과 조각가 의뢰"
 TV_WONDER_CEREMONY_S3_DESC_192:0 "세느강을 따라 있는 채석장은 창백한 돌로 임대되었으며, 조각가들은 궁전의 새로운 날개를 장식할 장식을 조각하도록 의뢰받습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_192:0 "나는 채석장을 의뢰하고 조각가들에게 끌을 얹어 주었습니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_192:0 "석공들은 잠시 멈추고 채석장 임대 계약서는 서명되지 않은 상태로 진행됩니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_192:0 "@tv_ceremony_building_default!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_192:0 "#Y 진행 중#! — #high 오래된 벽이 무너지다#!\n#F 오래된 루브르 박물관의 마지막 중세 탑이 해체되고 석공들이 법원의 시선 아래 첫 번째 안뜰 건물의 착공을 시작했습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_192:0 "#G 완료#! — #high 오래된 벽이 무너지다#!\n#F 오래된 루브르 박물관의 마지막 중세 탑이 해체되고 석공들이 법원의 눈앞에서 첫 번째 안뜰 건물의 착공을 시작했습니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_192:0 "[tv_wonder_ceremony|E]: 오래된 벽이 무너지다"
 TV_WONDER_CEREMONY_S4_DESC_192:0 "오래된 루브르 박물관의 마지막 중세 탑이 해체되고 석공들이 법원이 지켜보는 가운데 첫 번째 안뜰 건물의 착공을 시작했습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_192:0 "오래된 탑이 무너지고 첫 번째 안뜰 건물이 잔해 속에서 솟아오릅니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_192:0 "나는 아직 오래된 탑을 철거하라고 명령할 수 없습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_192:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_192:0 "#Y 진행 중#! — #high 스퀘어 코트가 형태를 취하다#!\n#F 아케이드 갤러리가 쿠르 카레 주변에 가까이 있으며 기둥과 페디먼트는 세심하게 고전적인 비율로 솟아있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_192:0 "#G 완료#! — #high 스퀘어 코트가 형태를 취하다#!\n#F 아케이드 갤러리가 Cour Carree 주변에 닫혀 있으며 기둥과 페디먼트는 세심하게 고전적인 비율로 솟아있습니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_192:0 "[tv_wonder_ceremony|E]：스퀘어 코트가 형태를 취하다"
 TV_WONDER_CEREMONY_S5_DESC_192:0 "Cour Carree 주변에는 아케이드 갤러리가 가까이 있으며 기둥과 페디먼트는 세심하게 고전적인 비율로 솟아 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_192:0 "아케이드는 안뜰 주위에 닫혀 있으며 조심스럽게 페디먼트로 장식되어 있습니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_192:0 "서두르면 비율이 깨집니다. 인내심이 그것을 만듭니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_192:0 "@tv_ceremony_building_levels!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_192:0 "#Y 진행 중#! — #high 강을 향해 뻗어 있는 그랑 갤러리#!\n#F A 긴 갤러리는 튀일리 궁 방향으로 확장되었으며 언젠가는 궁전과 정원을 연결하고 왕실의 보물을 보관하기 위해 건설되었습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_192:0 "#G 완료#! — #high 강을 향해 뻗어 있는 그랑 갤러리#!\n#F A 긴 갤러리는 튀일리 궁 방향으로 확장되었으며 언젠가는 궁전과 정원을 연결하고 왕실의 보물을 보관하기 위해 지어졌습니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_192:0 "[tv_wonder_ceremony|E]：강을 향해 뻗어 있는 그랑 갤러리"
 TV_WONDER_CEREMONY_S6_DESC_192:0 "긴 갤러리는 튀일리를 향해 확장되어 언젠가 궁전과 정원을 연결하고 왕관의 보물을 보관하기 위해 지어졌습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_192:0 "갤러리는 튀일리를 향해 돌 하나하나 뻗어있습니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_192:0 "우리는 아직 정원을 향해 벽을 확장할 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_192:0 "@tv_ceremony_painter!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_192:0 "#Y 진행 중#! — #high 화가와 도금공이 홀을 장식합니다.#!\n#F 화가, 도금공, 캐비닛 제작자가 국영 아파트를 프레스코화와 금박 금고로 가득 채워 외국 사절을 맞이할 방을 준비합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_192:0 "#G 완료#! — #high 화가와 금도금공이 홀을 장식합니다#!\n#F 화가, 금도금공, 캐비닛 제작자가 주립 아파트를 프레스코화와 금박 금고로 가득 채우고 외국인을 받을 수 있는 방을 준비합니다. 특사.#!"
 TV_WONDER_CEREMONY_S7_TITLE_192:0 "[tv_wonder_ceremony|E]: 화가와 도금공이 홀을 장식합니다."
 TV_WONDER_CEREMONY_S7_DESC_192:0 "화가, 금도금공, 캐비닛 제작자들이 국영 아파트를 프레스코화와 금박 금고로 가득 채우고 외국 사절을 맞이할 방을 준비합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_192:0 "나는 사절들을 위해 이 홀을 꾸미기 위해 화가들과 도금공들을 소집합니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_192:0 "도금공은 도구를 내려놓았고 프레스코화는 미완성 상태로 남아 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_192:0 "@tv_ceremony_ruler!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_192:0 "#Y 진행 중#! — #high 루브르 박물관은 왕의 자리로 우뚝 서 있습니다#!\n#F 종과 대포가 완성된 궁전에 경의를 표하고, 루브르 박물관은 논란의 여지가 없는 왕권과 권력의 자리로 센 강에 서 있습니다. 프레스티지.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_192:0 "#G 완성#! — #high 루브르 박물관은 왕의 자리로 우뚝 서 있습니다#!\n#F 종과 대포가 완성된 궁전에 경의를 표하고, 루브르 박물관은 논쟁의 여지가 없는 왕권과 왕권의 자리로 센 강에 서 있습니다. 프레스티지.#!"
 TV_WONDER_CEREMONY_S8_TITLE_192:0 "[tv_wonder_ceremony|E]:루브르 박물관은 왕의 자리로 우뚝 서 있습니다"
 TV_WONDER_CEREMONY_S8_DESC_192:0 "종과 대포가 완성된 궁전에 경의를 표하고, 루브르 박물관은 왕관의 권력과 명성이 입증된 자리로 센 강 위에 서 있습니다.\n\n#weak 의식을 완료하려면 필요한 가격을 지불하세요. 결과적으로 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_192:0 "루브르 박물관이 세느강 위에 완전히 서자 종소리와 대포가 울려 퍼졌습니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_192:0 "종소리는 조용하고 대포는 발사되지 않은 채로 기다립니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_193:0 "@tv_ceremony_ruler!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_193:0 "#Y 진행 중#! — #high 왕은 숲속 휴양지를 선택합니다#!\n#F 멜룬 근처의 사냥 숲 속에서 왕은 궁중 축제와 외교에 걸맞은 거주지로 재건할 오래된 저택을 선택합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_193:0 "#G 완료#! — #high 왕은 숲속 휴양지를 선택합니다#!\n#F 멜룬 근처의 사냥 숲 속에서 왕은 궁정 축제와 외교에 걸맞은 거주지로 재건할 오래된 저택을 선택합니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_193:0 "[tv_wonder_ceremony|E]：왕이 숲속 휴양지를 선택하다"
 TV_WONDER_CEREMONY_S1_DESC_193:0 "멜룬 근처의 사냥 숲에서 왕은 궁정 축제와 외교에 합당한 거주지로 재건할 오래된 저택을 선택합니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_193:0 "왕은 사냥의 숲으로 들어가 자신의 궁정으로 옛 저택을 차지합니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_193:0 "왕은 오래된 저택을 숲에 남겨두고 수도로 돌아갑니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_193:0 "@tv_ceremony_vegetation!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_193:0 "#Y 진행 중#! — #high 사냥꾼이 오래된 땅을 청소합니다.#!\n#F 사냥꾼과 삼림 관리인이 옛 성 주변의 길과 땅을 정리하고, 사절은 새로운 패션에 정통한 화가를 찾기 위해 이탈리아로 파견됩니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_193:0 "#G 완료#! — #high 사냥꾼이 오래된 땅을 청소합니다#!\n#F 사냥꾼과 삼림 관리인이 옛 성 주변의 길과 땅을 정리하고, 사절은 새로운 유행에 정통한 화가를 찾기 위해 이탈리아로 파견됩니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_193:0 "[tv_wonder_ceremony|E]: 헌츠맨이 옛 땅을 청소하다"
 TV_WONDER_CEREMONY_S2_DESC_193:0 "사냥꾼과 삼림 관리인들이 오래된 성 주변의 길과 땅을 정리하고, 새로운 패션에 정통한 화가를 찾기 위해 사절이 이탈리아로 파견됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_193:0 "숲으로, 그리고 이탈리아로!"
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_193:0 "사냥꾼들은 도끼를 내려놓고 이탈리아로 항해하는 사절은 없습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_193:0 "@tv_ceremony_building_needs!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_193:0 "#Y 진행 중#! — #high 돌과 화가 도착#!\n#F 석공과 이탈리아 장식가가 안료, 석고, 패턴 책을 가지고 도착하여 저택의 오래된 홀을 개조할 준비가 되었습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_193:0 "#G 완료#! — #high 돌과 화가 도착#!\n#F 석공과 이탈리아 장식가가 저택의 옛 홀을 개조할 준비가 된 안료, 석고, 패턴 책을 가지고 도착합니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_193:0 "[tv_wonder_ceremony|E]：돌과 화가가 도착하다"
 TV_WONDER_CEREMONY_S3_DESC_193:0 "석공과 이탈리아 장식가들이 안료, 석고, 패턴 책을 가지고 도착하여 저택의 오래된 홀을 개조할 준비를 합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_193:0 "석공들은 오래된 저택의 홀 앞에 석고와 안료를 내립니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_193:0 "아직은 아닙니다. 석공들이 기다리도록 하세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S4_193:0 "@tv_ceremony_building_levels!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_193:0 "#Y 진행 중#! — #high 말굽 계단 기초 공사 완료#!\n#F 건축가들이 유명한 말굽 계단 착공을 시작했는데, 이는 소박한 저택이 궁전으로 변모하고 있다는 첫 번째 신호입니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_193:0 "#G 완료#! — #high 말굽 계단 기초 공사가 완료되었습니다#!\n#F 건축가들이 유명한 말굽 계단 착공을 시작했는데, 이는 소박한 저택이 궁전으로 변모하고 있다는 첫 번째 신호입니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_193:0 "[tv_wonder_ceremony|E]：말굽 계단 기초가 놓였습니다"
 TV_WONDER_CEREMONY_S4_DESC_193:0 "건축업자들은 소박한 저택이 궁전으로 변모하고 있다는 첫 번째 신호인 유명한 말굽 계단에서 착공했습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_193:0 "건축업자들은 말굽 계단을 착공하고 저택은 궁전으로 솟아오르기 시작합니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_193:0 "건축업자들은 도구를 따로 보관해 두었고, 옛 저택은 변함없이 그대로 남아 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_193:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_193:0 "#Y 진행 중#! — #high 긴 갤러리는 아치형입니다.#!\n#F A 긴 갤러리는 아치형이며 벽은 왕관을 기념하는 프레스코화를 위해 준비되어 있으며 안뜰 주변의 날개는 일치하는 돌로 솟아 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_193:0 "#G 완료#! — #high 긴 갤러리는 아치형입니다.#!\n#F A 긴 갤러리는 아치형이며 벽은 왕관을 기념하는 프레스코화를 위해 준비되어 있으며 안뜰 주변의 날개는 일치하는 돌로 솟아 있습니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_193:0 "[tv_wonder_ceremony|E]：긴 갤러리는 아치형입니다"
 TV_WONDER_CEREMONY_S5_DESC_193:0 "긴 갤러리는 아치형으로 되어 있고, 벽은 왕관을 기념하는 프레스코화를 위해 준비되어 있으며, 안뜰 주변의 날개는 일치하는 돌로 솟아 있습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_193:0 "금고를 올려라!"
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_193:0 "석공들은 갤러리의 금고를 미완성 상태로 남겨두고 벽에는 프레스코화가 전혀 남아있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_193:0 "@tv_ceremony_painter!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_193:0 "#Y 진행 중#! — #high 프레스코가 왕립 미술관을 가득채우다#!\n#F 이탈리아와 프랑스 화가들은 법원의 요구에 부응하기 위해 촛불을 켜고 밤늦게까지 작업하며 신화적인 프레스코화와 치장벽토로 갤러리를 장식합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_193:0 "#G 완료#! — #high 프레스코로 왕립 미술관을 채우다#!\n#F 이탈리아와 프랑스 화가들은 신화적인 프레스코화와 치장벽토로 갤러리를 덮고 있으며, 법원의 요구에 부응하기 위해 촛불 아래서 늦게까지 작업하고 있습니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_193:0 "[tv_wonder_ceremony|E]: 프레스코화가 왕실 갤러리를 가득 채웁니다."
 TV_WONDER_CEREMONY_S6_DESC_193:0 "이탈리아와 프랑스 화가들은 신화적인 프레스코화와 치장벽토로 갤러리를 덮고 있으며, 법원의 요구에 부응하기 위해 촛불을 켜고 밤늦게까지 일하고 있습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우에는 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_193:0 "화가들은 촛불을 켜고 작업하며 갤러리를 신화적인 프레스코화로 채웁니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_193:0 "촛불을 기다리자!"
 TV_WONDER_CEREMONY_CARD_ICON_S7_193:0 "@tv_ceremony_food_productivity!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_193:0 "#Y 진행 중#! — #high 정원은 테라스에 배치되어 있습니다.#!\n#F 공식 정원은 벽 너머의 테라스와 운하에 배치되어 있으며 궁중들은 전체 궁전이 완성되기 전에 이미 완성된 건물을 거닐고 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_193:0 "#G 완료#! — #high 정원은 테라스에 배치되어 있습니다.#!\n#F 공식 정원은 벽 너머의 테라스와 운하에 배치되어 있으며 궁중들은 전체 궁전이 완성되기 전에 이미 완성된 건물을 거닐고 있습니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_193:0 "[tv_wonder_ceremony|E]：정원은 테라스에 배치되어 있습니다."
 TV_WONDER_CEREMONY_S7_DESC_193:0 "성벽 너머의 테라스와 운하에는 정식 정원이 배치되어 있으며, 궁전 전체가 완성되기 전에 궁중들은 이미 완성된 건물을 산책하고 있습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_193:0 "우리는 우리 궁정의 영광을 위해 이 테라스와 운하를 배치합니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_193:0 "정원사는 도구를 내려놓고 벽 너머의 땅은 그대로 남아 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_193:0 "@tv_ceremony_prestige!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_193:0 "#Y 진행 중#! — #high Fontainebleau가 법원을 환영합니다#!\n#F 사냥과 축제를 열망하는 법원의 문이 열려 있으며 Fontainebleau는 왕실의 총애와 합법성의 두 번째 자리로 자리 잡고 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_193:0 "#G 완료#! — #high Fontainebleau가 법원을 환영합니다#!\n#F 사냥과 축제를 열망하는 법원의 문이 열리며 Fontainebleau는 왕실의 총애와 합법성의 두 번째 자리로 자리 잡았습니다.#!"
 TV_WONDER_CEREMONY_S8_TITLE_193:0 "[tv_wonder_ceremony|E]：Fontainebleau가 법원을 환영합니다"
 TV_WONDER_CEREMONY_S8_DESC_193:0 "사냥과 축제를 열망하는 궁정으로 문이 열리며, 퐁텐블로는 왕실의 총애와 합법성의 두 번째 자리로 완벽하게 우뚝 서 있습니다.\n\n#weak 의식을 완료하려면 필요한 가격을 지불하세요. 결과적으로 불가사의의 마지막 건물이 세워질 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_193:0 "문을 열어라!"
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_193:0 "우리는 아직 법정 문을 열 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_194:0 "@tv_ceremony_market!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_194:0 "#Y 진행 중#! — #high 상공회의소에서 새로운 부두 요청#!\n#F 보르도 상인들은 와인 창고를 지나 줄을서는 바지선에 지쳐 가론느를 따라 더 넓은 석조 부두를 요청합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_194:0 "#G 완료#! — #high 상공회의소, 새로운 부두 요청#!\n#F 보르도 상인들은 와인 창고를 지나 줄을서는 바지선에 지쳐 가론느를 따라 더 넓은 석조 부두를 요청합니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_194:0 "[tv_wonder_ceremony|E]：상공회의소, 새로운 부두 요구"
 TV_WONDER_CEREMONY_S1_DESC_194:0 "보르도 상인들은 와인 창고를 지나 길게 늘어선 바지선에 지쳐 가론 강을 따라 더 넓은 석조 부두를 요청합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_194:0 "무역을 하기에는 너무 좁은 항구는 자체 와인통에 빠져버릴 것입니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_194:0 "우리는 아직 상공회의소의 청원을 받아들일 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_194:0 "@tv_ceremony_river!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_194:0 "#Y 진행 중#! — #high 측량사 강둑 산책#!\n#F 측량사와 항만 엔지니어가 진흙탕 강둑을 걸어 새로운 부두, 크레인, 세관이 세워질 위치를 표시합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_194:0 "#G 완료#! — #high 측량사 강둑 산책#!\n#F 측량사와 항만 엔지니어가 진흙탕 강둑을 걸어 새로운 부두, 크레인, 세관이 세워질 위치를 표시합니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_194:0 "[tv_wonder_ceremony|E]：측량사들이 강둑을 걷다"
 TV_WONDER_CEREMONY_S2_DESC_194:0 "측량사와 항만 기술자들이 진흙 투성이의 강둑을 걸어가며 새로운 부두, 크레인, 세관이 세워질 위치를 표시합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_194:0 "측량사는 진흙탕에 말뚝을 박고 항구의 미래 선을 표시합니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_194:0 "아직은 아닙니다. 진흙이 먼저 가라앉도록 놔두세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S3_194:0 "@tv_ceremony_employees!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_194:0 "#Y 진행 중#! — #high 배럴 제작자와 석공이 채용됩니다#!\n#F 쿠퍼, 석공, 항만 작업자가 다수 고용되고, 통 채석장과 채석용 돌이 바지선에 실려 도착하기 시작합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_194:0 "#G 완료#! — #high 배럴 제작자와 석공 채용#!\n#F 쿠퍼, 석공, 항만 작업자가 다수 고용되고, 통 채석장과 채석용 돌이 바지선에 실려 도착하기 시작합니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_194:0 "[tv_wonder_ceremony|E]：통 제작자와 석공을 고용합니다"
 TV_WONDER_CEREMONY_S3_DESC_194:0 "쿠퍼, 석공, 항만 작업자가 대량으로 고용되고 통나무와 채석된 돌이 바지선에 실려 도착하기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_194:0 "우리는 금고를 열고 모든 술꾼과 석공을 강둑으로 불러 모읍니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_194:0 "감독들은 기다리고 있고, 돌로 만든 바지선은 고용되지 않은 채로 서 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_194:0 "@tv_ceremony_port!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_194:0 "#Y 진행 중#! — #high 첫 번째 부두석이 설치되었습니다.#!\n#F 첫 번째 부두석 코스가 가론의 제방에 설치되고 오래된 진흙탕이 적절한 항구 전면으로 이어지기 시작합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_194:0 "#G 완료#! — #high 첫 번째 부두석이 설정되었습니다.#!\n#F 첫 번째 부두석 코스가 가론의 제방에 설치되고, 오래된 진흙탕이 적절한 항구 전면으로 이어지기 시작합니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_194:0 "[tv_wonder_ceremony|E]：첫 번째 부두석이 세워졌습니다"
 TV_WONDER_CEREMONY_S4_DESC_194:0 "안벽의 첫 번째 코스가 가론의 제방에 놓이고 오래된 진흙탕이 올바른 항구 전면으로 자리를 내주기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_194:0 "첫 번째 놓인 돌은 뒤에 있는 모든 돌을 굳게 세우느니라."
