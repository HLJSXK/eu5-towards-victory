 TV_WONDER_CEREMONY_S5_TITLE_139:0 "[tv_wonder_ceremony|E]：보물선 상승의 갈비뼈"
 TV_WONDER_CEREMONY_S5_DESC_139:0 "활주로를 따라 거대한 갈비뼈가 세워져 있으며, 수도에서 온 방문객들은 하나의 선체가 아래 강을 붐비는 상인 쓰레기를 왜소하게 만들 수 있다는 사실에 경탄합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
