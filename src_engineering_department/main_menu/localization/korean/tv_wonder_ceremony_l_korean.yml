 TV_WONDER_CEREMONY_S1_DESC_139:0 "제국의 칙령은 난징의 룽장 야드를 이전 조선소 이상으로 확장하여 보물 함대가 왕조의 깃발을 가장 먼 바다까지 운반할 수 있도록 명령합니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 대가를 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
