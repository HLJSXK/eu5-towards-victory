 TV_WONDER_CEREMONY_CARD_ICON_S5_198:0 "@tv_ceremony_building_levels!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_198:0 "#Y 진행 중#! — #high 타워가 일치하는 순위로 올라갑니다.#!\n#F 왕궁 근위대가 이미 완성된 부분을 순찰하고 있기 때문에 두꺼운 커튼월로 연결된 8개의 타워가 일치하는 순위로 올라갑니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_198:0 "#G 완료#! — #high 타워가 일치하는 순위로 올라갑니다.#!\n#F 왕궁 근위대가 이미 완성된 부분을 순찰하고 있으므로 두꺼운 커튼월로 연결된 8개의 타워가 일치하는 순위로 올라갑니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_198:0 "[tv_wonder_ceremony|E]: 매칭 순위가 올라가는 타워"
 TV_WONDER_CEREMONY_S5_DESC_198:0 "두꺼운 커튼월로 연결된 8개의 타워는 왕실 근위대가 이미 완성된 부분을 순찰하고 있는 가운데 동일한 순위로 올라갑니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_198:0 "여덟 개의 탑이 함께 솟아오르고, 왕실 근위대가 성벽 위에서 순회를 시작합니다."
