 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_139:0 "#G Completed#! — #high Fire가 조선소를 위협하다#!\n#F 단조에서 불꽃이 어느 건조한 가을밤 반쯤 완성된 선체를 거의 태워버릴 뻔했고, 조선소의 단련된 버킷 라인과 조선공의 빠른 도끼만이 용골을 위기에서 구해냈습니다. 파멸.#!"
 TV_WONDER_CEREMONY_S7_TITLE_139:0 "[tv_wonder_ceremony|E]: 화재가 마당을 위협합니다."
