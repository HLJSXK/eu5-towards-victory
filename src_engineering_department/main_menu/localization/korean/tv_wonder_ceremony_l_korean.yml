 TV_WONDER_CEREMONY_CARD_ICON_S7_150:0 "@tv_ceremony_building_levels!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_150:0 "#Y 진행 중#! — #high 기둥의 꼭대기에 있는 종탑#!\n#F A 소박한 종탑은 기둥 꼭대기에 세워져 있으며, 종탑의 고리는 계곡을 건너 이웃 바위에 있는 자매 집까지 전달되도록 되어 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_150:0 "#G 완료#! — #high 기둥의 꼭대기에 있는 종탑#!\n#F A 소박한 종탑은 기둥 꼭대기에 세워져 있으며, 그 고리는 계곡을 건너 이웃 바위에 있는 자매 집까지 전달되도록 되어 있습니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_150:0 "[tv_wonder_ceremony|E]: 종탑이 기둥을 장식합니다"
 TV_WONDER_CEREMONY_S7_DESC_150:0 "기둥 꼭대기에는 겸손한 종탑이 세워져 있으며, 종탑의 고리는 계곡을 건너 인근 바위에 있는 자매 집까지 전달되도록 되어 있습니다. 아래 순례자들은 이제 새벽에 모여 수도원에 첫 번째 빛이 들어오는 것을 지켜봅니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_150:0 "종탑이 정상에 우뚝 솟아 있고 첫 번째 종소리가 계곡을 가로질러 굴러갑니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_150:0 "잠시만 더 침묵하세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S8_150:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_150:0 "#Y 진행 중#! — #high 기둥이 하늘에 봉헌되었습니다#!\n#F 수도권은 완성된 계단을 올라 형제단이 모이기 전에 완성된 수도원을 봉헌하며 공중에 매달린 바위인 메테오라를 영원히 신앙의 피난처로 선언합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_150:0 "#G 완료#! — #high 기둥이 하늘에 봉헌되었습니다#!\n#F 수도권은 완성된 계단을 올라 형제단이 모이기 전에 완성된 수도원을 봉헌하며, 공중에 매달린 바위인 메테오라를 영원히 피난처로 선언합니다. 믿음.#!"
 TV_WONDER_CEREMONY_S8_TITLE_150:0 "[tv_wonder_ceremony|E]:기둥은 하늘에 봉헌됩니다"
 TV_WONDER_CEREMONY_S8_DESC_150:0 "수도권은 완성된 계단을 올라 형제단이 모이기 전에 완성된 수도원을 봉헌하며, 공중에 매달린 바위인 메테오라를 영원히 신앙의 피난처로 선언합니다. 이 높이에서 기둥들 사이에서 배양된 헌신은 이제 전체 영역의 결의를 확고히 합니다.\n\n#weak 의식을 완료하는 데 필요한 대가를 지불하십시오. 결과적으로 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_150:0 "우리는 이 기둥들을 영원히 믿음의 피난처인 하늘에 봉헌합니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_150:0 "봉헌은 연기되고 형제단은 정상 아래에서 기다립니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_151:0 "@tv_ceremony_government!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_151:0 "#Y 진행 중#! — #high 국왕은 강 파수꾼을 의뢰합니다#!\n#F 왕국은 리스본으로의 접근을 지키고 발견에서 돌아오는 모든 함대를 맞이하기 위해 벨렝의 타구스 해안에 세워진 요새화된 탑을 명령합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_151:0 "#G 완료#! — #high 왕은 강 감시병을 의뢰합니다#!\n#F 왕은 리스본으로 가는 길을 지키고 발견에서 돌아오는 모든 함대를 맞이하기 위해 벨렝의 타구스 해안에 세워진 요새화된 탑을 명령합니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_151:0 "[tv_wonder_ceremony|E]: 왕관은 강 파수꾼을 임명합니다"
 TV_WONDER_CEREMONY_S1_DESC_151:0 "왕관은 리스본으로의 접근을 보호하고 발견에서 돌아오는 모든 함대를 맞이하기 위해 벨렘의 타구스 암초에 세워진 요새화된 탑을 명령합니다. 왕실 석공들은 즉시 디자인을 시작하기 위해 다른 작업에서 끌려옵니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_151:0 "나는 이 파수꾼을 임명하고 그것을 위해 금고를 열었습니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_151:0 "석공들은 한동안 다른 작업에 남아 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_151:0 "@tv_ceremony_art_work!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_151:0 "#Y 진행 중#! — #high Manueline Masons Take the Shoal#!\n#F 새로운 마누엘 스타일에 정통한 석공들은 조석 떼를 조사하고 항해에서 얻은 로프, 혼천의, 산호 모티브로 얽힌 흉벽 조각을 계획합니다. 스스로.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_151:0 "#G Completed#! — #high Manueline Masons Take the Shoal#!\n#F 새로운 마누엘 스타일에 정통한 석공들은 조수 떼를 조사하고 항해에서 얻은 밧줄, 혼천의, 산호 모티브로 얽힌 흉벽을 조각했습니다. 스스로.#!"
 TV_WONDER_CEREMONY_S2_TITLE_151:0 "[tv_wonder_ceremony|E]: 마누엘린 메이슨이 떼를 차지하다"
 TV_WONDER_CEREMONY_S2_DESC_151:0 "새로운 마누엘 양식에 정통한 석공들은 조수 떼를 조사하여 밧줄, 혼천의, 항해에서 직접 가져온 산호 모티프로 얽힌 흉벽을 조각할 계획을 세웁니다. 바지선이 리스본 채석장에서 석회석을 운반하기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_151:0 "조수가 해안을 형성하듯 끌이 탑을 형성합니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_151:0 "바지선이 다시 항해하기 전에 채석장을 쉬게 할 것입니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_151:0 "@tv_ceremony_river!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_151:0 "#Y 진행 중#! — #high 조류에 가라앉은 기초#!\n#F 말뚝은 타구스 조수에 맞서 탑을 고정하기 위해 강바닥 깊숙이 박혀 있으며, 캐러벨 선장은 왕관의 탑에서 그들이 떠나는 것을 볼 수 있을 때까지 출발을 연기하라는 요청을 받습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_151:0 "#G 완료#! — #high 조류에 가라앉은 기초#!\n#F 말뚝은 타구스 조수에 맞서 탑을 고정하기 위해 강바닥 깊숙이 박혀 있으며, 캐러벨 선장은 왕관의 탑이 이를 볼 수 있을 때까지 출발을 연기하라는 요청을 받습니다. 떠나세요.#!"
 TV_WONDER_CEREMONY_S3_TITLE_151:0 "[tv_wonder_ceremony|E]: 조류에 가라앉은 기초"
 TV_WONDER_CEREMONY_S3_DESC_151:0 "타구스 조수에 맞서 탑을 고정하기 위해 말뚝을 강바닥 깊숙이 박아 넣고, 캐러벨 선장들은 왕관의 탑이 그들이 떠나는 것을 지켜볼 수 있을 때까지 출발을 연기하라는 요청을 받습니다. 왕실 재무는 신중하게 분할 자금을 공개하기 시작합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_151:0 "재무부가 일정 금액을 분할하여 자금을 지급하는 동안 직원들은 더미를 집으로 가져갑니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_151:0 "돌진한 기초는 익사한 탑과 같다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_151:0 "@tv_ceremony_maritime_presence!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_151:0 "#Y 진행 중#! — #high 탑의 첫 번째 돌이 강을 만납니다#!\n#F 창백한 마누엘식 돌의 첫 번째 코스가 강 여울에서 직접 솟아오르고, 측량 및 재무 장부였던 것이 이제는 실제로 물리적으로 서 있는 탑이 됩니다. 타구스.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_151:0 "#G 완료#! — #high 탑의 첫 번째 돌이 강을 만납니다#!\n#F 창백한 마누엘식 돌의 첫 번째 코스가 강 여울에서 직접 솟아오르고, 측량 및 재무 장부였던 것이 이제는 실제로 물리적으로 서 있는 탑이 됩니다. 타구스.#!"
 TV_WONDER_CEREMONY_S4_TITLE_151:0 "[tv_wonder_ceremony|E]：타워의 첫 번째 돌이 강을 만납니다"
 TV_WONDER_CEREMONY_S4_DESC_151:0 "창백한 마누엘식 돌의 첫 번째 코스는 강 여울에서 직접 솟아오르고, 측량 및 재무 장부였던 것이 이제는 타구스 강에 물리적으로 서있는 탑이 됩니다. 어부들은 돌 오르는 모습을 보기 위해 매일 노를 젓습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_151:0 "나는 첫 번째 돌이 솟아오르는 것을 지켜보고 이 탑을 리스본의 명예에 바칠 것을 맹세합니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_151:0 "원장은 원장으로 남아 있고 떼는 한동안 노출되어 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_151:0 "@tv_ceremony_cannons!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_151:0 "#Y 진행 중#! — #high 보루 테라스가 형태를 취하다#!\n#F A 낮은 보루 테라스는 타워 기저부 주위에 완성되었으며, 그 틈은 모든 각도에서 대포 발사로 강 수로를 지휘하기 위해 잘려졌습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_151:0 "#G 완료#! — #high 보루 테라스가 형태를 취하다#!\n#F A 낮은 보루 테라스는 타워 기저부 주위에 완성되었으며, 그 틈은 모든 각도에서 대포 발사로 강 수로를 지휘하기 위해 절단되었습니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_151:0 "[tv_wonder_ceremony|E]: 바스티온 테라스가 형태를 갖추다"
 TV_WONDER_CEREMONY_S5_DESC_151:0 "탑의 기초 주변에는 낮은 요새 테라스가 완성되어 있으며, 모든 각도에서 대포를 발사하여 강 수로를 지휘하기 위해 그 틈이 잘려 있습니다. 조각된 로프 몰딩이 처음으로 타워의 모서리를 감기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_151:0 "포수들은 새로운 흠집을 테스트하고 조각가들은 벽을 따라 로프 몰딩을 시작합니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_151:0 "나는 한 시즌 더 요새의 총을 침묵하게 놔둘 것입니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_151:0 "@tv_ceremony_artistic_skill_icon!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_151:0 "#Y 진행 중#! — #high 로지아와 조각된 시계#!\n#F 개방형 로지아는 요새 위에 솟아 있으며, 아케이드에는 혼천의와 꼬인 밧줄 모티브가 새겨져 있어 타워를 포르투갈 고유의 것으로 표시할 수 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_151:0 "#G 완성#! — #high 로지아와 조각된 시계#!\n#F 개방형 로지아는 요새 위에 솟아 있으며, 아케이드에는 혼천의와 꼬인 밧줄 모티브가 새겨져 있어 타워를 포르투갈 고유의 것으로 표시할 수 있습니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_151:0 "[tv_wonder_ceremony|E]: 로지아와 조각된 시계"
 TV_WONDER_CEREMONY_S6_DESC_151:0 "개방형 로지아가 요새 위에 세워져 있으며, 아케이드에는 혼천의 모양과 꼬인 밧줄 모티브가 새겨져 있어 이 탑을 포르투갈 특유의 것으로 표시할 수 있습니다. 석공들은 모퉁이 포탑 아래에 코뿔소 가고일을 새겼는데, 이는 항해 자체가 가져온 호기심입니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_151:0 "조각가들은 포탑 아래에 코뿔소 가고일을 놓고 혼천의로 로지아에 왕관을 씌웠습니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_151:0 "로지아의 아케이드는 한동안 드러나지 않은 채 호기심을 자극하지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_151:0 "@tv_ceremony_building_levels!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_151:0 "#Y 진행 중#! — #high 포탑이 최대 높이에 도달했습니다.#!\n#F 탑의 모퉁이 포탑은 작은 돔으로 덮여 있으며 주 천수각은 강 하구가 내려다보이는 최대 높이까지 솟아 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_151:0 "#G 완료#! — #high 포탑이 최대 높이에 도달했습니다.#!\n#F 탑의 모서리 포탑은 작은 돔으로 덮여 있으며 주 천수각은 강 하구가 내려다보이는 최대 높이까지 솟아 있습니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_151:0 "[tv_wonder_ceremony|E]: 포탑이 최대 높이에 도달했습니다."
 TV_WONDER_CEREMONY_S7_DESC_151:0 "탑의 모퉁이 포탑은 작은 돔으로 덮여 있으며, 주 천수각은 강 하구가 내려다보이는 최대 높이까지 솟아 있습니다. 출발하는 캐러벨은 이제 언젠가 줄 경례를 테스트하기 위해 미완성 흉벽 바로 아래로 항해합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_151:0 "나는 우리 함대가 경례를 연습할 수 있도록 포탑에 돔을 설치할 것을 명령합니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_151:0 "캐러벨은 미완성 흉벽을 지나 항해하며 경례는 아직 시도되지 않았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_151:0 "@tv_ceremony_ship!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_151:0 "#Y 진행 중#! — #high 탑이 해양 함대를 맞이합니다#!\n#F 완성된 탑이 강 가장자리에 봉헌되자 종과 대포가 함께 경례하고, 왕관은 탑을 바다로 향하거나 그곳에서 돌아오는 모든 함대의 영원한 문지기로 선언합니다. 발견.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_151:0 "#G 완료#! — #high 탑이 해양 함대를 맞이합니다#!\n#F 완성된 탑이 강 가장자리에 봉헌되자 종과 대포가 함께 경례하고, 왕관은 탑을 바다로 향하거나 그곳에서 돌아오는 모든 함대의 영원한 문지기로 선언합니다. 발견.#!"
 TV_WONDER_CEREMONY_S8_TITLE_151:0 "[tv_wonder_ceremony|E]: 타워가 해양 함대를 맞이합니다."
 TV_WONDER_CEREMONY_S8_DESC_151:0 "완성된 탑이 강 가장자리에 봉헌되자 종과 대포가 함께 경의를 표하고, 왕관은 이 탑을 발견지로 향하거나 그곳에서 돌아오는 모든 함대의 영원한 문지기로 선언합니다. 오늘부터 타구스 강의 감시로 인해 그 아래를 항해하는 모든 선박의 도달 거리가 길어지고 리스본 항구를 통해 집으로 흐르는 부가 부풀려집니다.\n\n#weak 행사를 완료하는 데 필요한 대가를 지불하세요. 결과적으로 불가사의의 마지막 건물이 세워질 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_151:0 "왕관이 타구스강의 영원한 문지기인 탑을 봉헌할 때 종과 대포가 함께 경례합니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_151:0 "나는 봉헌을 연기하고 함대가 한동안 감시 없이 지나가도록 할 것입니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_152:0 "@tv_ceremony_law!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_152:0 "#Y 진행 중#! — #high 왕이 신성한 재판소를 승인하다#!\n#F 왕과 톨레도 대주교는 옛 수도원 성벽 안에 세워질 영구 재판소를 공동으로 선포하고 왕국의 신앙을 조사할 권한을 부여받습니다. 과목.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_152:0 "#G 완료#! — #high 왕이 신성한 재판소를 승인하다#!\n#F 왕과 톨레도 대주교는 공동으로 오래된 수도원 성벽 안에 세워질 영구 재판소를 선포하고 왕국의 신앙을 조사할 권한을 부여받습니다. 과목.#!"
 TV_WONDER_CEREMONY_S1_TITLE_152:0 "[tv_wonder_ceremony|E]：왕관이 신성한 재판소를 승인하다"
 TV_WONDER_CEREMONY_S1_DESC_152:0 "왕관과 톨레도 대주교는 공동으로 옛 수도원 성벽 안에 영구 재판소를 설립하여 왕국 신민들의 신앙을 조사할 권한을 부여했습니다. 창립 헌장의 초안을 작성하기 위해 참회자와 교회법 변호사가 소환됩니다.\n\n#weak 행사를 다음 단계로 진행하는 데 필요한 대가를 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_152:0 "왕관은 재판소의 창립 헌장에 인장을 찍습니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_152:0 "우리는 지금으로서는 이 헌장에 서명하지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_152:0 "@tv_ceremony_clergy!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_152:0 "#Y 진행 중#! — #high 회랑이 분리되어 있습니다.#!\n#F 톨레도의 오래된 회랑은 재판소를 격리시키기 위해 수도원의 나머지 부분과 벽으로 둘러싸여 있으며, 그 문은 밤낮으로 침입과 탈출을 막고 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_152:0 "#G 완료#! — #high 회랑은 따로 설정되어 있습니다.#!\n#F 톨레도의 오래된 회랑은 수도원의 나머지 부분과 벽으로 둘러싸여 격리된 재판소를 수용하고 있으며, 그 문은 밤낮으로 침입과 탈출을 막고 있습니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_152:0 "[tv_wonder_ceremony|E]:회랑은 따로 떨어져 있습니다"
 TV_WONDER_CEREMONY_S2_DESC_152:0 "톨레도의 오래된 회랑은 재판소를 격리하기 위해 수도원의 나머지 부분과 벽으로 둘러싸여 있으며, 그 문은 침입과 탈출을 위해 밤낮으로 보호됩니다. 교회법 교육을 받은 수사들은 다른 가문에서 조용히 재배치됩니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_152:0 "메이슨은 오래된 회랑을 벽으로 막고 문에 경비원을 배치합니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_152:0 "회랑은 열려 있고 벽은 아직 올라가지 않았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_152:0 "@tv_ceremony_writer!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_152:0 "#Y 진행 중#! — #high 서기관 및 기록 보관소 조립됨#!\n#F 서기관은 점점 늘어나는 재판소의 증언과 판례 기록 보관소를 구축하기 위해 참여하고 있으며, 최초의 봉인된 양피지 상자가 경비를 받는 회랑으로 운반됩니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_152:0 "#G 완료#! — #high 서기 및 기록 보관소 조립됨#!\n#F 서기들은 재판소의 점점 늘어나는 증언과 판례 기록 보관소를 구축하기 위해 참여하고 있으며, 최초의 봉인된 양피지 상자가 아래 회랑으로 운반됩니다. 가드.#!"
 TV_WONDER_CEREMONY_S3_TITLE_152:0 "[tv_wonder_ceremony|E]：서기와 기록 보관소 조립"
 TV_WONDER_CEREMONY_S3_DESC_152:0 "서기들이 재판소의 점점 늘어나는 증언과 선례 기록 보관소를 구축하기 위해 참여하고 있으며, 최초의 봉인된 양피지 상자가 경비 하에 회랑으로 운반됩니다. 석공들은 심문실의 창살을 자르기 시작합니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_152:0 "아카이브가 시작됩니다!"
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_152:0 "서기관들은 펜을 내려놓았지만 상자는 아직 봉인되지 않았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_152:0 "@tv_ceremony_parliament!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_152:0 "#Y 진행 중#! — #high 협의회 회의소 재단#!\n#F 메이슨들은 재판소의 판사들이 앉을 대의회 회의소의 기초를 놓기 위해 회랑 바닥을 부수고 마침내 재판소는 헌장과 재판관이 아닌 물리적 구조가 됩니다. 약속.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_152:0 "#G 완료#! — #high 평의회 재단#!\n#F 메이슨들은 재판소의 판사들이 앉을 대의회실의 기초를 놓기 위해 회랑 바닥을 부수고 마침내 재판소는 헌장과 재판관이 아닌 물리적 구조가 됩니다. 약속.#!"
 TV_WONDER_CEREMONY_S4_TITLE_152:0 "[tv_wonder_ceremony|E]：회의실 재단"
 TV_WONDER_CEREMONY_S4_DESC_152:0 "프리메이슨은 재판소의 판사들이 앉을 대의회실의 기초를 놓기 위해 회랑 바닥을 부수고, 재판소는 마침내 헌장이나 약속이 아닌 물리적 구조가 됩니다. 아직 하늘을 향해 열려 있는 복도를 따라 횃불이 설치되어 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_152:0 "석공은 회랑 바닥을 부수고 방의 첫 번째 돌을 놓습니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_152:0 "잠깐만요. 오래된 바닥을 좀 더 쉬게 해주세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S5_152:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_152:0 "#Y 진행 중#! — #high 경호 예배당이 아치형으로 되어 있습니다.#!\n#F A 개인 예배당은 재판소 벽 내의 돌로 아치형 천장으로 되어 있으며, 판결이 통과되기 전에 피고인이 자백할 수 있는 곳입니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_152:0 "#G 완료#! — #high 경비원이 있는 예배당은 아치형으로 되어 있습니다.#!\n#F A 개인 예배당은 재판소 벽 안에 있는 돌로 아치형 천장으로 되어 있으며, 판결이 내려지기 전에 피고인이 자백할 수 있는 곳입니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_152:0 "[tv_wonder_ceremony|E]: 경비를 맡은 예배당이 아치형으로 되어 있습니다"
 TV_WONDER_CEREMONY_S5_DESC_152:0 "재판소 벽 안에는 돌로 된 아치형 개인 예배당이 있는데, 그곳에서 판결이 내려지기 전에 피고인이 자백을 할 수 있습니다. 건축업자들조차 침묵의 맹세를 하기 때문에 메이슨들은 면밀한 감시 하에 일합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우에는 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_152:0 "우리는 이 아치형 예배당이 요구하는 침묵을 위해 봉헌합니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_152:0 "예배당의 둥근 천장은 미완성으로 서 있고, 아직 침묵이 서약되지 않았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_152:0 "@tv_ceremony_lock!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_152:0 "#Y 진행 중#! — #high 기록 보관소가 봉인되었습니다.#!\n#F 평의회실 아래의 깊은 금고는 점점 늘어나는 자백과 선고 기록 보관소를 보관하기 위해 철제 문으로 봉인되어 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_152:0 "#G 완료#! — #high 기록 보관소가 봉인되었습니다.#!\n#F 평의회실 아래 깊은 금고는 점점 늘어나는 자백과 선고 기록 보관소를 보관하기 위해 철로 묶인 문으로 봉인되어 있습니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_152:0 "[tv_wonder_ceremony|E]：보관 금고는 봉인되었습니다"
 TV_WONDER_CEREMONY_S6_DESC_152:0 "의회실 아래에 있는 깊은 금고는 점점 늘어나는 자백과 형량에 대한 재판소의 기록 보관소를 보관하기 위해 철제 문으로 봉인되어 있습니다. 서기관은 교구별로 각 상자에 라벨을 붙이고 그 위에 앉은 모든 판사보다 오래 지속될 기록을 세웁니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_152:0 "봉인하고 영원히 봉인했습니다!"
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_152:0 "금고 문은 열려 있고, 상자에는 아직 라벨이 붙어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_152:0 "@tv_ceremony_control!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_152:0 "#Y 진행 중#! — #high 공적 심판의 뜰#!\n#F 집결된 마을 앞에서 문장을 낭독할 외부 안뜰이 완성되었으며, 돌 벤치와 단은 숨겨진 방과 함께 재판소의 공개적인 얼굴을 완성합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_152:0 "#G 완료#! — #high 공적 심판의 뜰#!\n#F 집결된 마을 앞에서 문장을 낭독할 외부 안뜰이 완성되었으며, 돌 벤치와 단은 숨겨진 방과 함께 재판소의 공개적인 얼굴을 완성합니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_152:0 "[tv_wonder_ceremony|E]：공적 심판의 안뜰"
 TV_WONDER_CEREMONY_S7_DESC_152:0 "집결된 도시 앞에서 문장이 낭독될 외부 안뜰이 완성되었으며, 석재 벤치와 단은 숨겨진 방과 함께 재판소의 공개적인 얼굴을 완성합니다. 재판소의 십자가가 새겨진 배너가 처음으로 문 위에 걸려 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_152:0 "마침내 재판소의 십자가가 새겨진 깃발이 문 위로 올라갑니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_152:0 "기다리세요. 배너가 조금 더 기다리도록 하세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S8_152:0 "@tv_ceremony_building_open!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_152:0 "#Y 진행 중#! — #high 재판소가 문을 엽니다#!\n#F 대주교가 완성된 재판소를 축성하고 첫 번째 판사들이 모인 성직자와 왕실 관리들 앞에 자리를 잡고 이제 공식적으로 왕국의 신앙을 선언합니다. 보호됨.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_152:0 "#G 완료#! — #high 재판소가 문을 열다#!\n#F 대주교는 완성된 재판소를 봉헌하고 첫 번째 판사들은 모인 성직자와 왕실 관리들 앞에 자리를 잡고 이제 공식적으로 왕국의 신앙을 선언합니다. 보호됨.#!"
 TV_WONDER_CEREMONY_S8_TITLE_152:0 "[tv_wonder_ceremony|E]：재판소가 문을 열다"
 TV_WONDER_CEREMONY_S8_DESC_152:0 "대주교는 완성된 재판소를 봉헌하고 첫 번째 재판관은 모인 성직자와 왕실 관리들 앞에 자리를 잡고 현재 공식적으로 보호되는 영역의 신앙을 선언합니다. 오늘부터 재판소의 규율은 왕국의 질서를 안정시키고 사람들이 하나의 신조로 빠르게 복귀하도록 합니다.\n\n#weak 의식을 완료하려면 필요한 대가를 지불하세요. 결과적으로 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_152:0 "우리는 이 법정이 열려 있음을 선언하며, 왕국의 신앙은 그 보호 아래 있습니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_152:0 "심사위원석은 비어 있고, 문은 여전히 닫혀 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_153:0 "@tv_ceremony_agenda!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_153:0 "#Y 진행 중#! — #high 플로렌스, 동등하지 않은 돔을 맹세하다#!\n#F 오페라 델 두오모는 산타 마리아 델 피오레가 고대 이래로 지어진 어떤 돔보다 더 큰 돔으로 왕관을 쓸 것이라고 선언합니다. 그러나 그러한 경간이 어떻게 무너지지 않고 서 있을 수 있는지 아직 아는 사람은 없습니다. 무게.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_153:0 "#G 완료#! — #high 플로렌스는 동등하지 않은 돔을 맹세합니다#!\n#F 오페라 델 두오모는 산타 마리아 델 피오레가 고대 이래로 지어진 어떤 돔보다 더 큰 돔으로 관을 씌울 것이라고 선언합니다. 그러나 그러한 경간이 어떻게 무너지지 않고 서 있을 수 있는지 아직 아는 사람은 없습니다. 자신의 무게.#!"
 TV_WONDER_CEREMONY_S1_TITLE_153:0 "[tv_wonder_ceremony|E]: 플로렌스는 동등하지 않은 돔을 맹세합니다"
 TV_WONDER_CEREMONY_S1_DESC_153:0 "오페라 델 두오모(Opera del Duomo)는 산타 마리아 델 피오레(Santa Maria del Fiore)가 고대 이래로 지어진 어떤 돔보다 더 큰 돔으로 장식될 것이라고 선언합니다. 그러나 그러한 경간이 어떻게 자체 무게로 무너지지 않고 버틸 수 있는지는 아직 아는 사람이 없습니다. 도시 전역의 길드가 도전을 위해 자금을 약속합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_153:0 "나는 세계가 본 적 없는 돔에 피렌체의 보물을 맡길 것을 맹세합니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_153:0 "길드들은 불평하며 한동안 약속을 유보한다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_153:0 "@tv_ceremony_advance!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_153:0 "#Y 진행 중#! — #high A 독창적인 모델 경쟁#!\n#F 건축가는 돔의 불가능한 엔지니어링 문제를 해결하기 위해 비계, 체인 및 헤링본 벽돌 패턴을 제안하는 목재 모델을 제출하고 오페라는 각 계획을 길드 마스터의 의견과 비교합니다. 의심스럽습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_153:0 "#G 완료#! — #high A 독창적인 모델 경쟁#!\n#F 건축가는 돔의 불가능한 엔지니어링 문제를 해결하기 위해 비계, 체인 및 헤링본 벽돌 패턴을 제안하는 목재 모델을 제출하고 오페라는 각 계획을 길드 마스터의 의견과 비교하여 평가합니다. 의심스럽습니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_153:0 "[tv_wonder_ceremony|E]: 독창적인 모델들의 경쟁"
 TV_WONDER_CEREMONY_S2_DESC_153:0 "건축가는 돔의 불가능한 엔지니어링 문제를 해결하기 위해 비계, 체인 및 헤링본 벽돌 패턴을 제안하는 목재 모델을 제출하고 오페라는 길드 마스터의 의심과 비교하여 각 계획을 평가합니다. 브루넬레스키의 파격적인 디자인은 서서히 호평을 받습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_153:0 "이성이 감히 접근할 수 있는 곳에서는 닫을 수 없을 만큼 넓은 금고는 없습니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_153:0 "나는 아직 내 앞에 제시된 어떤 모델도 확신하지 못합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_153:0 "@tv_ceremony_building_needs!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_153:0 "#Y 진행 중#! — #high 콘타도의 벽돌, 대리석 및 모래#!\n#F Ox 카트는 토스카나 콘타도의 벽돌, 창백한 대리석 및 강 모래를 도시로 운반하며 채석장 계약은 수년간 공급 흐름을 유지하기 위해 서명되었습니다. 와서.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_153:0 "#G Completed#! — #high 콘타도의 벽돌, 대리석 및 모래#!\n#F Ox 카트는 토스카나 콘타도의 벽돌, 창백한 대리석 및 강 모래를 도시로 운반하며 채석장 계약은 수년간 공급 흐름을 유지하기 위해 서명되었습니다. 와서.#!"
 TV_WONDER_CEREMONY_S3_TITLE_153:0 "[tv_wonder_ceremony|E]:Contado의 벽돌, 대리석 및 모래"
 TV_WONDER_CEREMONY_S3_DESC_153:0 "황소 수레는 토스카나 콘타도에서 벽돌, 창백한 대리석, 강 모래를 도시로 운반하며 채석장 계약을 체결하여 향후 수년간 공급을 유지합니다. 미완성된 본당 옆에 있는 종탑은 이미 긴 토스카나 그림자를 드리우고 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_153:0 "소 수레가 굴러가고 채석장 계약서는 밀랍과 맹세로 봉인됩니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_153:0 "너무 빨리 채석된 돌은 제철이 되기 전에 부서집니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_153:0 "@tv_ceremony_build_icon!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_153:0 "#Y 진행 중#! — #high Brunelleschi가 비계를 들어올립니다#!\n#F Brunelleschi의 독창적인 호이스트와 자립식 비계가 대성당의 드럼 위로 올라가고 돔의 헤링본 벽돌이 마침내 그림과 논증만 서 있던 자리에서 오르기 시작합니다. 이전.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_153:0 "#G Completed#! — #high Brunelleschi가 비계를 들어올립니다#!\n#F Brunelleschi의 독창적인 호이스트와 자립 비계가 대성당의 드럼 위로 올라가고 돔의 헤링본 벽돌이 마침내 그림과 논증만 있는 곳에서 오르기 시작합니다. 앞에 서 있었습니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_153:0 "[tv_wonder_ceremony|E]：브루넬레스키가 비계를 들어올리다"
 TV_WONDER_CEREMONY_S4_DESC_153:0 "브루넬레스키의 독창적인 호이스트와 자립식 비계가 대성당의 드럼 위로 올라가고, 돔의 헤링본 벽돌이 마침내 그림과 주장만 서 있던 자리에 오르기 시작합니다. 작업자들은 시간을 절약하기 위해 광장 위에 매달린 플랫폼에서 점심을 먹습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_153:0 "나는 호이스트와 비계를 올립니다. 마침내 벽돌을 쌓게 해주세요."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_153:0 "석공들은 도구를 낮추고 드럼 가장자리에서 기다립니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_153:0 "@tv_ceremony_building_levels!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_153:0 "#Y 진행 중#! — #high 더블 쉘 클라임#!\n#F 돔의 내부 쉘과 외부 쉘은 브루넬레스키가 영업 비밀로 보호하는 숨겨진 돌 사슬과 나무 끈으로 묶여 코스별로 함께 올라갑니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_153:0 "#G 완료#! — #high 더블 쉘 클라임#!\n#F 돔의 내부 및 외부 쉘은 브루넬레스키가 영업 비밀로 보호하는 숨겨진 돌 사슬과 나무 끈으로 묶여 코스별로 함께 올라갑니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_153:0 "[tv_wonder_ceremony|E]: 이중 껍질이 올라갑니다."
 TV_WONDER_CEREMONY_S5_DESC_153:0 "돔의 내부 및 외부 껍질은 브루넬레스키가 영업 비밀로 보호하는 숨겨진 돌 사슬과 나무 끈으로 묶여 코스별로 함께 솟아오릅니다. 아래 광장에 피렌체 사람들은 매일 저녁 모여서 벽돌 고리가 얼마나 높이 올라왔는지 측정합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_153:0 "손이 감추고 있는 것은 돔만이 시간이 지나면 드러납니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_153:0 "나는 체인과 넥타이를 한 시즌 더 오랫동안 숨겨 둡니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_153:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_153:0 "#Y 진행 중#! — #high 하늘에 가까운 오큘러스#!\n#F 돔은 정상을 향해 좁아지고 석공들은 언젠가 베로키오의 랜턴으로 장식할 오큘러스 주변의 마지막 벽돌 고리를 작업합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_153:0 "#G 완료#! — #high 하늘에 가까운 오큘러스#!\n#F 돔은 정상을 향해 좁아지고 석공들은 언젠가 베로키오의 랜턴으로 장식할 오큘러스 주변의 마지막 벽돌 고리를 작업합니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_153:0 "[tv_wonder_ceremony|E]: Oculus가 하늘에 가까워졌습니다."
 TV_WONDER_CEREMONY_S6_DESC_153:0 "돔은 꼭대기 쪽으로 좁아지고, 석공들은 언젠가 베로키오의 랜턴으로 돔을 장식할 오큘러스 주변의 마지막 벽돌 고리를 작업합니다. 한때 디자인을 조롱하던 길드 장로들은 이제 견습생들을 데리고 머리 위로 기적이 가까워지는 것을 지켜봅니다.\n\n#weak 필요한 가격을 지불하여 의식을 다음 단계로 진행하거나, 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_153:0 "석공들은 마지막 고리를 닫았고, 하늘은 벽돌 한 덩어리로 좁아졌습니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_153:0 "급히 닫혀진 고리는 하늘을 붙잡는 경우가 거의 없습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_153:0 "@tv_ceremony_painting!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_153:0 "#Y 진행 중#! — #high 대리석 외관이 새로운 색상을 띠고 있습니다.#!\n#F 성당의 외관은 흰색, 녹색, 분홍색 대리석의 최종 패턴으로 마감되어 있으며, 이는 이제 도시의 모든 곳에서 볼 수 있는 돔의 벽돌 왕관과 일치합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_153:0 "#G 완료#! — #high 대리석 외관에 색상이 추가되었습니다.#!\n#F 성당의 외관은 흰색, 녹색, 분홍색 대리석의 최종 패턴으로 마감되었으며, 이는 이제 도시의 모든 곳에서 볼 수 있는 돔의 벽돌 왕관과 일치합니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_153:0 "[tv_wonder_ceremony|E]:대리석 외관에 색상이 더해졌습니다"
 TV_WONDER_CEREMONY_S7_DESC_153:0 "대성당의 정면은 흰색, 녹색, 분홍색 대리석의 최종 패턴으로 마감되어 있으며, 이는 현재 도시의 모든 구역에서 볼 수 있는 돔의 벽돌 왕관과 일치합니다. 비계가 여러 부분으로 내려와 피렌체가 전체를 보기 위해 두 세대를 기다려온 건물을 드러냅니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_153:0 "나는 피렌체가 마침내 대성당 전체를 볼 수 있도록 비계를 치라고 명령합니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_153:0 "비계는 남아 있고 대리석은 나무 베일 뒤에 숨어 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_153:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_153:0 "#Y 진행 중#! — #high 돔이 도시 위에 축성됨#!\n#F 교황은 시뇨리아와 길드가 모이기 전에 산타 마리아 델 피오레를 직접 봉헌했으며, 브루넬레스키의 돔은 로마 돔 이후 기독교계에서 세워진 가장 위대한 작품으로 선언되었습니다. 고대.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_153:0 "#G 완료#! — #high 돔이 도시 위에 봉헌되었습니다#!\n#F 교황은 시뇨리아와 길드가 모이기 전에 산타 마리아 델 피오레를 직접 봉헌했으며, 브루넬레스키의 돔은 로마 돔 이후 기독교계에서 세워진 가장 위대한 작품으로 선언되었습니다. 고대.#!"
 TV_WONDER_CEREMONY_S8_TITLE_153:0 "[tv_wonder_ceremony|E]:돔은 도시 전체에 봉헌되었습니다"
 TV_WONDER_CEREMONY_S8_DESC_153:0 "교황은 시뇨리아와 길드가 모인 가운데 산타 마리아 델 피오레를 직접 봉헌했으며, 브루넬레스키의 돔은 고대 로마 이후 기독교계에서 제기된 가장 위대한 작품으로 선언되었습니다. 오늘부터 대성당의 영광은 피렌체의 예술과 학문에 활력을 불어넣고, 그 이름을 듣는 모든 궁정에서 자부심을 가지고 회자됩니다.\n\n#weak 의식을 완료하려면 필요한 대가를 지불하세요. 그 결과 불가사의의 마지막 건물이 세워질 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_153:0 "교황은 손을 들어 축성하고, 그리스도교국은 자부심을 가지고 피렌체의 이름을 부릅니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_153:0 "나는 봉헌을 보류합니다. 돔이 한동안 더 축복받지 못한 채 서 있게 해주세요."
 TV_WONDER_CEREMONY_CARD_ICON_S1_154:0 "@tv_ceremony_city!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_154:0 "#Y 진행 중#! — #high 피사가 대리석으로 만든 종탑을 의뢰하다#!\n#F 오페라 델라 프리마치알레(Opera della Primaziale)는 피사 대성당에 흰색 대리석으로 독립된 종탑이 주어질 것이라고 선언합니다. 이는 대성당과 데이 광장에 있는 세례당 옆에 세 번째 보석입니다. 미라콜리.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_154:0 "#G 완료#! — #high 피사가 대리석으로 만든 종탑을 의뢰하다#!\n#F 오페라 델라 프리마치알레(Opera della Primaziale)는 피사 대성당에 흰색 대리석으로 독립된 종탑이 주어질 것이라고 선언합니다. 이는 대성당과 광장 세례당 옆에 세 번째 보석입니다. 데이 미라콜리.#!"
 TV_WONDER_CEREMONY_S1_TITLE_154:0 "[tv_wonder_ceremony|E]: 피사가 대리석 종탑을 의뢰하다"
 TV_WONDER_CEREMONY_S1_DESC_154:0 "오페라 델라 프리마치알레(Opera della Primaziale)는 피사 대성당에 독립된 흰색 대리석 종탑이 주어질 것이며, 대성당과 미라콜리 광장(Piazza dei Miracoli)에 있는 세례당 옆에 세 번째 보석이 세워질 것이라고 선언합니다. Master Bonanno가 디자인을 맡았습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_154:0 "Opera della Primaziale는 헌장에 서명하고 Master Bonanno에게 타워 디자인을 의뢰합니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_154:0 "우리는 아직 그러한 대리석 보석을 의뢰할 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_154:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_154:0 "#Y 진행 중#! — #high 측량사가 연약한 지반을 테스트합니다#!\n#F 측량사는 광장의 습지 하층토를 조사하지만, 초원 아래의 모래 점토는 돌이 누르기 시작할 때까지 진정한 약점을 숨겨줍니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_154:0 "#G 완료#! — #high 측량사가 연약한 지반을 테스트합니다#!\n#F 측량사는 광장의 습지 하층토를 조사하지만 초원 아래의 모래 점토는 돌이 누르기 시작할 때까지 진정한 약점을 숨겨줍니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_154:0 "[tv_wonder_ceremony|E]: 측량사가 연약한 지반을 테스트합니다."
 TV_WONDER_CEREMONY_S2_DESC_154:0 "측량사는 광장의 습지 하층토를 조사하지만, 초원 아래의 모래 점토는 돌이 누르기 시작할 때까지 진정한 약점을 숨겨두게 됩니다. 카라라 근처 채석장과 대리석 계약이 체결되었습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_154:0 "측량사는 막대를 습지대에 가라앉히고 채석장 계약을 체결합니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_154:0 "측량사들은 아직 습지대를 신뢰하지 않고 물러납니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_154:0 "@tv_ceremony_building_needs!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_154:0 "#Y 진행 중#! — #high 대리석 블록 카트로 도착#!\n#F Ox 카트가 평야를 가로질러 빛나는 카라라 대리석 블록을 하나씩 피사로 가져오고, 석공들은 탑의 8개 부분을 울리는 아케이드와 기둥을 절단하기 시작합니다. 이야기.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_154:0 "#G Completed#! — #high 대리석 블록 카트로 도착#!\n#F Ox 카트는 평원을 가로질러 빛나는 카라라 대리석 블록을 하나씩 피사로 가져오고, 석공들은 탑의 8개 부분을 울리는 아케이드와 기둥을 절단하기 시작합니다. 이야기.#!"
 TV_WONDER_CEREMONY_S3_TITLE_154:0 "[tv_wonder_ceremony|E]:대리석 블록이 카트로 도착합니다."
 TV_WONDER_CEREMONY_S3_DESC_154:0 "황소 수레는 번쩍이는 카라라 대리석 블록을 평야를 가로질러 피사까지 가져오고, 석공들은 탑의 8층을 둘러쌀 아케이드와 기둥을 절단하기 시작합니다. 대성당 학교의 학자들은 땅이 실제로 그러한 무게를 지탱할 수 있는지에 대해 토론합니다.\n\n#weak 예식을 다음 단계로 진행하는 데 필요한 대가를 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_154:0 "우리는 카트를 내리라고 명령하고 석공에게 끌을 놓았습니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_154:0 "땅에 대한 논쟁이 계속되는 동안 황소 수레는 광장 가장자리에서 기다리고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_154:0 "@tv_ceremony_building_default!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_154:0 "#Y 진행 중#! — #high 첫 번째 기둥 고리가 솟아오릅니다.#!\n#F 석공들은 탑의 원형 기초를 놓고 블라인드 아케이드의 첫 번째 고리를 올렸으며, 피사의 종탑은 마침내 설계도판을 떠나 광장의 소프트 위에 대리석처럼 서 있습니다. 지구.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_154:0 "#G 완료#! — #high 첫 번째 기둥 고리가 솟아오릅니다#!\n#F 메이슨은 탑의 원형 기초를 놓고 블라인드 아케이드의 첫 번째 고리를 올렸으며, 피사의 종탑은 마침내 설계도판을 떠나 광장의 소프트 위에 대리석처럼 서 있습니다. 지구.#!"
 TV_WONDER_CEREMONY_S4_TITLE_154:0 "[tv_wonder_ceremony|E]: 기둥의 첫 번째 고리가 솟아오릅니다."
 TV_WONDER_CEREMONY_S4_DESC_154:0 "석공은 탑의 원형 기초를 놓고 블라인드 아케이드의 첫 번째 고리를 세웠으며, 피사의 종탑은 마침내 설계도를 떠나 광장의 부드러운 땅 위에 대리석처럼 서 있었습니다. 몇 개의 코스 내에서 주의 깊은 눈은 이미 북쪽의 희미한 목록을 발견합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하십시오. 아니면 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_154:0 "메이슨은 새로운 기초 위에 블라인드 아케이드의 첫 번째 고리를 완성합니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_154:0 "우리는 첫 번째 돌이 구부러져 고정되는 것을 보기보다는 차라리 잠시 멈추기를 원합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_154:0 "@tv_ceremony_warning_icon!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_154:0 "#Y 진행 중#! — #high 탑이 기울면서 작업이 중단됨#!\n#F 전쟁과 부채로 인해 공화국이 혼란에 빠지면서 거의 100년 동안 건설이 중단되고, 그 긴 멈춤 기간 동안 반쯤 지어진 탑은 그 아래 점토에 더 깊이 안착되어 기울어지는 것이 불가능해졌습니다. 무시.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_154:0 "#G 완료#! — #high 탑이 기울면서 작업이 중단됨#!\n#F 전쟁과 부채로 인해 공화국이 혼란에 빠지면서 거의 100년 동안 건설이 중단되고, 그 긴 멈춤 기간 동안 반쯤 지어진 탑은 그 아래 점토에 더 깊이 안착되어 기울어지는 것이 불가능해졌습니다. 무시.#!"
 TV_WONDER_CEREMONY_S5_TITLE_154:0 "[tv_wonder_ceremony|E]: 타워가 기울면서 작업이 중단됨"
 TV_WONDER_CEREMONY_S5_DESC_154:0 "전쟁과 부채로 인해 거의 100년 동안 건설이 중단되었고, 그 긴 멈춤 기간 동안 반쯤 지어진 탑은 그 아래 점토에 더욱 깊이 안착되어 무시할 수 없게 되었습니다. 피산 사람들은 탑이 세례당을 향해 고개를 숙이고 있다고 농담합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_154:0 "공화국은 오랜 침묵을 통해 버려진 작품들을 한데 모아 금고를 비운다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_154:0 "반쯤 지어진 탑은 흙과 세월이 흘러도 손대지 않은 채 그대로 남아 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_154:0 "@tv_ceremony_balance!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_154:0 "#Y 진행 중#! — #high 상층부 린(Lean) 수정#!\n#F 건축이 재개되면 마스터 Giovanni di Simone은 각각의 새로운 층을 기울어짐에 대해 조금씩 각도를 조정하여 타워의 상부 코스를 미묘하게 곡선으로 만들어 꼭대기를 원래대로 되돌립니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_154:0 "#G 완료#! — #high 상층부 린(Lean) 수정#!\n#F 건축이 재개되면 마스터 Giovanni di Simone은 각각의 새로운 층을 기울어짐에 대해 약간씩 각도를 조정하여 타워의 상부 코스를 미묘하게 곡선으로 만들어 꼭대기를 원래대로 되돌립니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_154:0 "[tv_wonder_ceremony|E]：상위 이야기가 린(Lean)을 교정합니다"
 TV_WONDER_CEREMONY_S6_DESC_154:0 "건축이 재개되면 마스터 Giovanni di Simone은 각각의 새로운 층을 기울어짐에 대해 약간씩 각도를 조정하여 타워의 꼭대기를 원래 위치로 되돌리려는 미묘한 시도로 타워의 상부 코스를 구부립니다. 그 결과 타워는 직선이 아니라 바나나처럼 구부러졌지만 모두 그대로 서 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_154:0 "구부러졌지만 서 있습니다!"
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_154:0 "조반니 디 시모네(Giovanni di Simone)는 더 이상 기울기를 유혹하지 않도록 조심하면서 계획을 세웁니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_154:0 "@tv_ceremony_building_levels!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_154:0 "#Y 진행 중#! — #high 종실이 탑을 장식합니다#!\n#F 종탑은 마침내 기울어진 샤프트 꼭대기에 추가되었으며, 종 자체가 수평으로 매달려 있도록 하기 위해 종탑의 낮은 쪽을 의도적으로 짧게 만든 아케이드가 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_154:0 "#G 완료#! — #high 종실이 탑을 장식합니다#!\n#F 종탑은 마침내 기울어진 샤프트 위에 추가되었으며, 종 자체가 수평으로 매달려 있도록 하기 위해 종탑의 낮은 쪽을 의도적으로 짧게 만든 아케이드가 있습니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_154:0 "[tv_wonder_ceremony|E]: 벨 챔버가 타워의 왕관을 장식합니다"
 TV_WONDER_CEREMONY_S7_DESC_154:0 "종탑은 마침내 경사진 꼭대기에 추가되었으며, 종 자체가 수평으로 매달려 있도록 하기 위해 종탑의 낮은 쪽 아케이드를 의도적으로 짧게 건설했습니다. 이제 학자들과 석공들은 단지 그 물건이 어떻게 남아 있는지 연구하기 위해 다른 도시에서 옵니다.\n\n#weak 예식을 다음 단계로 진행하는 데 필요한 대가를 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_154:0 "석공은 낮은 쪽이 더 짧게 자른 종탑으로 경사 샤프트를 장식합니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_154:0 "아직은 아닙니다. 종소리를 기다리도록 하세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S8_154:0 "@tv_ceremony_building_open!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_154:0 "#Y 진행 중#! — #high 사망탑이 첫 번째 종소리를 울린다#!\n#F 오페라가 거의 2세기에 걸친 작업이 완료되었음을 선언하면서 완성된 종탑에서 처음으로 종소리가 울립니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_154:0 "#G 완성#! — #high 사망탑이 첫 번째 종소리를 울린다#!\n#F 오페라가 거의 200년에 걸친 작업이 완료되었음을 선언하면서 완성된 종탑에서 처음으로 종소리가 울립니다.#!"
 TV_WONDER_CEREMONY_S8_TITLE_154:0 "[tv_wonder_ceremony|E]: 기울어진 탑이 첫 번째 종소리를 울린다"
 TV_WONDER_CEREMONY_S8_DESC_154:0 "오페라가 거의 2세기에 걸친 작업이 완료되었음을 선언하면서 완성된 종탑에서 처음으로 종소리가 울립니다. 오늘부터 피사의 탑은 학자와 경이로움을 찾는 사람들 모두를 끌어모으며 도시의 예술과 학문에 새로운 명성을 선사합니다.\n\n#weak 행사를 완료하는 데 필요한 가격을 지불하세요. 그 결과 불가사의의 마지막 건물이 세워질 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_154:0 "오페라는 종탑이 완성되었음을 선언하고 처음으로 미라콜리 광장(Piazza dei Miracoli) 위로 종소리가 울립니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_154:0 "종소리는 한동안 침묵을 유지하고 오페라는 최종 선언을 보류합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_155:0 "@tv_ceremony_clergy!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_155:0 "#Y 진행 중#! — #high 밀라노, 흰 대리석 대성당을 맹세하다#!\n#F 대주교와 비스콘티 공작은 밀라노가 롬바르디아의 어느 대성당과도 다른 고딕 양식의 대성당을 세울 것이라고 함께 선언합니다. Candoglia.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_155:0 "#G 완료#! — #high 밀라노, 흰 대리석 대성당을 맹세하다#!\n#F 대주교와 비스콘티 공작은 밀라노가 롬바르디아의 어느 대성당과도 다른 고딕 양식의 대성당을 세울 것이라고 함께 선언합니다. Candoglia.#!"
 TV_WONDER_CEREMONY_S1_TITLE_155:0 "[tv_wonder_ceremony|E]：밀라노, 흰 대리석 대성당을 맹세하다"
 TV_WONDER_CEREMONY_S1_DESC_155:0 "대주교와 비스콘티 공작은 함께 밀라노가 칸돌리아 채석장에서 나온 빛나는 흰색 대리석으로 전면을 덮은 롬바르디아의 어느 대성당과도 다른 고딕 양식의 대성당을 세울 것이라고 함께 선언합니다. Fabbrica del Duomo는 필요한 만큼 인력을 감독하기 위해 설립되었습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_155:0 "우리는 지금 맹세합니다. 아무리 시간이 걸리더라도 밀라노에는 흰색 대리석 대성당이 있을 것입니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_155:0 "밀라노의 통치자들은 입을 다물었고, 서약은 한동안 암묵적으로 지속되었습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_155:0 "@tv_ceremony_advance!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_155:0 "#Y 진행 중#! — #high 독일 마스터 디자인에 대한 협의#!\n#F 밀라노 마스터는 비율과 구조에 대한 분쟁을 해결하기 위해 알프스 너머의 건축가를 소환합니다. 롬바르디아의 어느 누구도 이전에 그러한 규모로 공중 부벽을 세운 적이 없기 때문입니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_155:0 "#G 완료#! — #high 독일 마스터 디자인에 대한 상담#!\n#F 밀라노 마스터는 비율과 구조에 대한 분쟁을 해결하기 위해 알프스 너머의 건축가를 소환합니다. 롬바르디아의 어느 누구도 이전에 그러한 규모로 공중 부벽을 세운 적이 없기 때문입니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_155:0 "[tv_wonder_ceremony|E]:독일 마스터가 디자인에 관해 상담하다"
 TV_WONDER_CEREMONY_S2_DESC_155:0 "밀라노의 거장들은 비율과 구조에 대한 분쟁을 해결하기 위해 알프스 너머의 건축가들을 소집합니다. 왜냐하면 롬바르디아의 어느 누구도 이전에 그러한 규모로 공중 부벽을 세운 적이 없기 때문입니다. Candoglia의 채석장은 Navigli 운하를 따라 대리석을 운반하기 위한 면세 통행권을 부여받았습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_155:0 "드디어 디자인이 잡혔네요!"
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_155:0 "파브리카는 알프스 너머의 마스터들에 대한 소환을 지연시킵니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_155:0 "@tv_ceremony_river!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_155:0 "#Y 진행 중#! — #high Navigli의 대리석 바지선#!\n#F Candoglia 대리석을 실은 바지선이 Navigli 운하를 따라 도시를 향해 미끄러져 내려갑니다. 각 블록에는 무료 통행료를 유지하기 위해 Fabbrica 마크가 찍혀 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_155:0 "#G 완료#! — #high Navigli의 대리석 바지선#!\n#F Candoglia 대리석을 실은 바지선이 Navigli 운하를 따라 도시를 향해 미끄러져 내려갑니다. 각 블록에는 무료 통행료를 유지하기 위해 Fabbrica 마크가 찍혀 있습니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_155:0 "[tv_wonder_ceremony|E]: Navigli의 대리석 바지선"
 TV_WONDER_CEREMONY_S3_DESC_155:0 "Candoglia 대리석을 실은 바지선은 Navigli 운하를 따라 도시를 향해 미끄러져 내려갑니다. 각 블록에는 무료 통행료를 유지하기 위해 Fabbrica 마크가 찍혀 있습니다. 조각가들의 작업장은 디자인에 필요한 수천 개의 조각상을 조각하기 위해 건축 현장 주변에 생겨납니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_155:0 "바지선은 강 하류에서 삐걱거리고 대리석 스탬프가 무료로 찍힌 상승 지역을 향해 삐걱거립니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_155:0 "아직은 아닙니다. 바지선을 기다리게 하세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S4_155:0 "@tv_ceremony_holy_site!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_155:0 "#Y 진행 중#! — #high 합창단의 기초 착공#!\n#F 메이슨들이 대성당 합창단 착공에 성공했고, 밀라노 대성당은 마침내 논쟁의 여지가 있는 도면에서 롬바르드 땅의 부두와 지지대로 솟아올랐습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_155:0 "#G 완료#! — #high 합창단의 기초 착공#!\n#F 메이슨이 대성당 합창단 착공에 성공했고, 밀라노 대성당은 마침내 논쟁의 여지가 있는 도면에서 롬바르드 땅의 부두와 지지대로 솟아올랐습니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_155:0 "[tv_wonder_ceremony|E]：합창단의 기초 착공식"
 TV_WONDER_CEREMONY_S4_DESC_155:0 "메이슨은 대성당 합창단의 착공을 시작했고 밀라노 대성당은 마침내 논쟁의 여지가 있는 도면에서 롬바르드 땅의 부두와 지지대로 솟아올랐습니다. 공작과 대주교는 둘 다 첫 번째 큰 기둥을 세우는 데 참석합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_155:0 "우리는 함께 이 땅을 허물고, 첫 번째 큰 기둥을 세웁니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_155:0 "합창단의 기초는 뚜렷하지만 여전히 깨지지 않았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_155:0 "@tv_ceremony_artistic_skill_icon!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_155:0 "#Y 진행 중#! — #high 본당의 기둥 숲#!\n#F 신도석을 둘러싸도록 솟아오른 교각의 줄은 각각 성인과 비스콘티 상징을 묘사한 조각된 대문자로 장식되어 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_155:0 "#G 완료#! — #high 본당의 기둥 숲#!\n#F 신도석을 둘러싸도록 솟아오른 교각의 줄은 각각 성인과 비스콘티 상징을 묘사한 조각된 대문자로 장식되어 있습니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_155:0 "[tv_wonder_ceremony|E]：본당의 기둥 숲"
 TV_WONDER_CEREMONY_S5_DESC_155:0 "높이 솟은 교각이 본당을 둘러싸고 있으며, 각 교각에는 성인과 비스콘티 상징을 모두 묘사한 조각된 주두가 장식되어 있습니다. 크레인은 트레드휠 리프트 블록을 사용하여 이전에 Lombard 건물에 도달하지 못한 높이까지 블록을 작동시켰습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_155:0 "기둥이 서 있듯이 도시도 서 있습니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_155:0 "우리는 아직 본당을 그렇게 높이 올릴 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_155:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_155:0 "#Y 진행 중#! — #high 플라잉 버트레스가 금고에 걸쳐 있다#!\n#F 플라잉 버트레스가 머리 위의 야심 찬 석조 금고를 지탱하기 위해 채광창에서 바깥쪽으로 호를 그리며, 이 해결책은 이탈리아와 알파인 횡단 사이의 수십 년간의 논쟁 끝에 마침내 해결되었습니다. 마스터.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_155:0 "#G 완료#! — #high 플라잉 버트레스(Flying Buttresses)가 금고에 걸쳐 있다#!\n#F 플라잉 버트레스(Flying Buttresses)는 머리 위의 야심 찬 석조 금고를 지탱하기 위해 채광창에서 바깥쪽으로 호를 그리며, 이 해결책은 이탈리아와 알파인 횡단 사이의 수십 년간의 논쟁 끝에 마침내 해결되었습니다. 마스터.#!"
 TV_WONDER_CEREMONY_S6_TITLE_155:0 "[tv_wonder_ceremony|E]: 둥근 천장을 가로지르는 날아다니는 지지대"
 TV_WONDER_CEREMONY_S6_DESC_155:0 "비행 부벽은 머리 위의 야심찬 석조 금고를 지탱하기 위해 채광창에서 바깥쪽으로 호를 그리며 이탈리아와 알파인 횡단 거장 사이의 수십 년 간의 논쟁 끝에 마침내 해결되었습니다. 건물의 고딕 양식의 첨탑이 밀라노 옥상 위로 솟아오르기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_155:0 "마침내 석공들이 금고를 보강하고 첨탑이 밀라노의 하늘을 뚫기 시작합니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_155:0 "아직은 아닙니다. 마스터들이 논쟁을 벌이도록 하세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S7_155:0 "@tv_ceremony_art_work!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_155:0 "#Y 진행 중#! — #high A 지붕 위 조각상의 숲#!\n#F 수천 개의 대리석 조각상과 첨탑이 지붕과 지지대에 세워져 있어 밀라노 사람들은 대성당이 제2의 성인 도시를 성장시킨다고 말할 정도로 많습니다. nave.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_155:0 "#G 완료#! — #high A 지붕 위 조각상의 숲#!\n#F 지붕과 지지대에는 수천 개의 대리석 조각상과 첨탑이 세워져 있어 밀라노 사람들은 대성당이 제2의 성인 도시를 성장시킨다고 말할 정도로 많습니다. nave.#!"
 TV_WONDER_CEREMONY_S7_TITLE_155:0 "[tv_wonder_ceremony|E]：지붕 위 조각상의 숲"
 TV_WONDER_CEREMONY_S7_DESC_155:0 "수천 개의 대리석 조각상과 첨탑이 지붕과 지지대에 세워져 있는데, 너무 많아서 밀라노 사람들은 대성당이 본당 위에 두 번째 성인 도시를 성장시킨다고 말합니다. 이제 모든 공예의 길드가 넓은 정면의 한 구석에 손을 뻗고 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_155:0 "우리는 천 명 중에 성자가 한 명 더 있는 정면에 손을 댔습니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_155:0 "길드들은 끌을 잠시 보류합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_155:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_155:0 "#Y 진행 중#! — #high 두오모가 문을 열다#!\n#F 대공, 대주교, 그리고 석공이나 대리석 블록을 빌려준 모든 길드 앞에서 대성당이 봉헌되면서 종소리가 밀라노 전역에 울립니다. 롬바르디아.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_155:0 "#G 완료#! — #high 두오모가 문을 열다#!\n#F 대공, 대주교, 그리고 석공이나 대리석 블록을 빌려준 모든 길드 앞에서 대성당이 봉헌되면서 종소리가 밀라노 전역에 울려 퍼집니다. 롬바르디아.#!"
 TV_WONDER_CEREMONY_S8_TITLE_155:0 "[tv_wonder_ceremony|E]：두오모가 문을 열다"
 TV_WONDER_CEREMONY_S8_DESC_155:0 "대성당이 공작, 대주교, 석공이나 대리석 블록을 빌려준 모든 길드 앞에서 봉헌되자 밀라노 전역에 종소리가 울리고, 첨탑 숲은 롬바르디아의 자존심을 선언합니다. 오늘부터 도시를 지켜보는 두오모의 관용적이고 주의 깊은 존재는 그 그림자 속에 있는 모든 종류의 신앙을 굳건히 하고, 그 영광은 공작 궁정에 신선한 빛을 더해 줍니다.\n\n#weak 의식을 완료하는 데 필요한 대가를 지불하세요. 그 결과 경이로운 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_155:0 "하나님의 집은 지붕 아래 모든 영혼을 보호합니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_155:0 "우리는 아직 밀라노로 향하는 문을 열 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_156:0 "@tv_ceremony_lock!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_156:0 "#Y 진행 중#! — #high 교황은 비밀 기록 보관소를 설립할 것을 명령했습니다#!\n#F 교황은 교황청의 흩어져 있는 기록, 교서 및 서신을 사도궁 내의 단일한 보호 기록 보관소에 모아야 하며, 그 내용은 명시 없이 왕관 없이 공유되어야 한다고 선언합니다. 떠나세요.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_156:0 "#G 완료#! — #high 교황은 비밀 기록 보관소를 설립할 것을 명령했습니다#!\n#F 교황은 교황청의 흩어져 있는 기록, 교서 및 서신을 사도궁 내의 단일한 보호 기록 보관소에 모아야 하며, 그 내용은 명시 없이 왕관 없이 공유되어야 한다고 선언합니다. 떠나세요.#!"
 TV_WONDER_CEREMONY_S1_TITLE_156:0 "[tv_wonder_ceremony|E]:교황이 비밀 기록 보관소를 설립하도록 명령함"
 TV_WONDER_CEREMONY_S1_DESC_156:0 "교황은 교황청의 흩어져 있는 기록부, 교서, 서신을 사도궁 내 단일한 보호 기록 보관소에 모아 명시적인 허가 없이는 왕관 없이 공유할 것이라고 선언합니다. 추기경은 이미 존재하는 것을 목록화하도록 설정되어 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_156:0 "비밀을 지키는 것은 힘을 배가시키는 것입니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_156:0 "우리는 아직 교황청의 기억을 엿보는 눈으로부터 봉쇄할 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_156:0 "@tv_ceremony_clergy!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_156:0 "#Y 진행 중#! — #high 추기경의 토론 무엇이 보관될 수 있는지에 대한 토론#!\n#F A 추기경 위원회는 어떤 외교, 종교 재판, 시성 기록이 새 기록 보관소에 보관될 가치가 있는지, 그리고 오래된 기록 보관소에 남아 있을 수 있는지 토론합니다. 레지스트리.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_156:0 "#G Completed#! — #high 추기경 토론 무엇이 보관될 수 있는지에 대한 토론#!\n#F A 추기경 위원회는 어떤 외교, 종교 재판, 시성 기록이 새로운 기록 보관소에 보관될 가치가 있는지, 그리고 이전에 흩어져 있는 기록 보관소에 남아 있을 수 있는지에 대해 토론합니다. 레지스트리.#!"
 TV_WONDER_CEREMONY_S2_TITLE_156:0 "[tv_wonder_ceremony|E]: 추기경, 무엇이 지켜져야 할지 논쟁"
 TV_WONDER_CEREMONY_S2_DESC_156:0 "추기경 위원회는 외교, 종교 재판, 시성 기록이 새 문서 보관소에 보관될 자격이 있는지, 그리고 이전에 분산된 기록부에 남을 수 있는지 토론합니다. 금고의 첫 번째 돌을 자르기 전에 교황에게 직접 축복을 구합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_156:0 "추기경들은 토론을 마무리하고 교황은 금고의 첫 번째 돌을 축복합니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_156:0 "성급한 판단은 모래 위에 세워진다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_156:0 "@tv_ceremony_writer!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_156:0 "#Y 진행 중#! — #high 서사와 봉인된 상자 도착#!\n#F 서사들이 점점 늘어나는 컬렉션을 복사하고 목록화하기 위해 이탈리아 전역에서 참여하고 있으며, 봉인된 양피지 상자는 아래의 오래된 바티칸 등록 기관에서 행렬로 운반됩니다. 가드.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_156:0 "#G 완료#! — #high 서기와 봉인된 상자 도착#!\n#F 서기관은 점점 늘어나는 컬렉션을 복사하고 목록화하기 위해 이탈리아 전역에서 참여하고 있으며, 봉인된 양피지 상자는 다음과 같은 오래된 바티칸 등록소에서 행렬로 운반됩니다. 가드.#!"
 TV_WONDER_CEREMONY_S3_TITLE_156:0 "[tv_wonder_ceremony|E]：서기와 봉인된 상자 도착"
 TV_WONDER_CEREMONY_S3_DESC_156:0 "증가하는 컬렉션을 복사하고 목록화하기 위해 이탈리아 전역에서 서기관들이 참여하고 있으며, 봉인된 양피지 상자는 보호를 받는 오래된 바티칸 기록부에서 행렬을 통해 운반됩니다. 목수들은 금고에 필요한 높은 선반을 설치하기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_156:0 "우리는 이탈리아의 서기관들을 소집하고 봉인된 상자를 로마로 가는 길에 놓았습니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_156:0 "목수들은 연장을 내려놓고 높은 선반은 반쯤 지어진 채로 남겨두었습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_156:0 "@tv_ceremony_building_default!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_156:0 "#Y 진행 중#! — #high 금고의 기초가 절단되었습니다#!\n#F 메이슨들은 궁전 아래에 있는 기록 보관소의 지하 금고의 기초를 깎았고, 프로젝트는 위원회 토론을 거쳐 수세기 동안 교회의 기억을 간직할 돌 복도로 넘어갔습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_156:0 "#G 완료#! — #high The Vault의 기초가 절단되었습니다.#!\n#F Masons는 궁전 아래에 있는 기록 보관소의 지하 금고의 기초를 자르고 프로젝트는 위원회 토론을 거쳐 수세기 동안 교회의 기억을 간직할 돌 복도로 넘어갑니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_156:0 "[tv_wonder_ceremony|E]: 금고의 기초가 절단되었습니다"
 TV_WONDER_CEREMONY_S4_DESC_156:0 "메이슨은 궁전 아래에 있는 기록 보관소의 지하 금고의 기초를 깎았고, 프로젝트는 위원회 토론을 거쳐 수세기 동안 교회의 기억을 간직할 돌 복도로 이어졌습니다. 위의 대리석 안뜰 아래에서 촛불이 켜진 통로가 형성되기 시작합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_156:0 "석공들은 대리석 안뜰 아래 깊은 곳에서 금고의 기초를 잘라냈습니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_156:0 "우리는 아직 사도궁 아래의 착공 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_156:0 "@tv_ceremony_literacy!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_156:0 "#Y 진행 중#! — #high 원고로 가득 찬 높은 선반#!\n#F 금고 천장까지 올라가는 선반은 제본된 원고로 채워지기 시작하며 번호가 매겨진 기록부 시스템은 어떤 황소나 편지도 한 시간 안에 다시 찾을 수 있도록 고안되었습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_156:0 "#G 완료#! — #high 원고로 가득 찬 높은 선반#!\n#F 보관소 천장까지 올라가는 선반은 제본된 원고로 채워지기 시작하며, 번호가 매겨진 기록부 시스템이 고안되어 황소나 편지를 보관소 내에서 다시 찾을 수 있습니다. 시간.#!"
 TV_WONDER_CEREMONY_S5_TITLE_156:0 "[tv_wonder_ceremony|E]： 원고로 가득한 높은 선반"
 TV_WONDER_CEREMONY_S5_DESC_156:0 "금고 천장까지 올라가는 선반은 제본된 원고로 채워지기 시작하고, 번호가 매겨진 기록부 시스템은 어떤 황소나 편지라도 한 시간 안에 다시 찾을 수 있도록 고안되었습니다. 기록 보관소의 좁은 문 하나에 경비원이 배치되어 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 비용을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_156:0 "선반이 아치형 천장을 향해 올라가면 직원이 각 계산대에 번호를 매깁니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_156:0 "인내는 서두르는 것보다 더 많은 선반을 채웁니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_156:0 "@tv_ceremony_advance!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_156:0 "#Y 진행 중#! — #high 열람실은 아치형으로 되어 있습니다.#!\n#F 보관형 열람실은 가장 깊은 저장실 위에 완성되었으며, 햇빛이 세심하게 비치고 있어 교황의 휴가로 인정받은 학자들이 양피지 근처에 불꽃을 들고 다니지 않고도 작업할 수 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_156:0 "#G 완료#! — #high 열람실은 아치형입니다.#!\n#F 보강형 열람실은 가장 깊은 저장실 위에 완성되었으며, 햇빛이 세심하게 비치고 있어 교황의 휴가를 받은 학자들이 양피지 근처에 불꽃을 들고 다니지 않고도 작업할 수 있습니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_156:0 "[tv_wonder_ceremony|E]：열람실은 아치형입니다"
 TV_WONDER_CEREMONY_S6_DESC_156:0 "가장 깊은 저장실 위에는 아치형 열람실이 완비되어 있으며, 교황의 허가를 받아 승인받은 학자들이 양피지 근처에 불꽃을 들고 다니지 않고도 작업할 수 있도록 조심스럽게 햇빛이 들어옵니다. 첫 번째 외국 사절의 내부 청원은 대부분 헛된 것이었습니다. \n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_156:0 "우리는 학자들이 이 아치형 홀에서 공부할 수 있도록 교황의 휴가를 부여합니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_156:0 "외국사절들은 다시 한번 외면당하고 열람실은 여전히 어두컴컴하다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_156:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_156:0 "#Y 진행 중#! — #high 촛불 대리석 복도#!\n#F 기록 보관소와 궁전을 연결하는 긴 대리석 복도는 마지막 촛대와 상감 바닥으로 마감되어 전체 단지가 법원 안의 법원의 조용한 웅장함을 선사합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_156:0 "#G 완료#! — #high 촛불 대리석 복도#!\n#F 기록 보관소와 궁전을 연결하는 긴 대리석 복도는 마지막 촛대와 상감 바닥으로 마감되어 전체 단지가 법원 안의 법원의 조용한 웅장함을 선사합니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_156:0 "[tv_wonder_ceremony|E]：촛불이 켜진 대리석의 복도"
 TV_WONDER_CEREMONY_S7_DESC_156:0 "기록 보관소와 궁전을 연결하는 긴 대리석 복도는 마지막 촛대와 상감 바닥으로 마감되어 전체 단지에 궁정 안의 조용한 웅장함을 선사합니다. 추기경들은 이제 어떤 왕관의 대사도 들을 수 없는 문제에 대해 오랫동안 논의합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_156:0 "마지막 촛대는 상감 대리석 복도를 따라 켜져 있습니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_156:0 "우리는 아직 속삭이는 조언으로 이 홀을 걸을 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_156:0 "@tv_ceremony_diplomacy!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_156:0 "#Y 진행 중#! — #high 기록 보관소는 봉인되었다가 즉시 공개됩니다#!\n#F 교황은 완성된 기록 보관소를 추기경단이 모여들기 전에 봉헌하고, 교황의 허가를 받아 학자들에게 공식적으로 열람실을 개방하는 동안에도 가장 깊은 금고를 봉인합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_156:0 "#G 완료#! — #high 기록 보관소는 봉인되었다가 즉시 공개됩니다#!\n#F 교황은 완성된 기록 보관소를 추기경단이 모여들기 전에 봉헌하고, 교황의 허가를 받아 학자들에게 공식적으로 열람실을 개방하더라도 가장 깊은 금고를 봉인합니다.#!"
 TV_WONDER_CEREMONY_S8_TITLE_156:0 "[tv_wonder_ceremony|E]：아카이브는 봉인과 개봉을 한번에"
 TV_WONDER_CEREMONY_S8_DESC_156:0 "교황은 완성된 기록 보관소를 추기경단이 모여들기 전에 봉헌하고, 교황 허가 하에 학자들에게 공식적으로 열람실을 개방하는 동안에도 가장 깊은 금고를 봉인합니다. 이날부터 교황청의 축적된 기억은 외교관들의 지혜를 날카롭게 하고 입국 허가를 받은 모든 사람의 학습을 가속화합니다.\n\n#weak 행사를 완료하려면 필요한 대가를 지불하세요. 결과적으로 불가사의의 마지막 건물이 세워질 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_156:0 "교황은 가장 깊은 금고를 봉인하고 열람실을 개방하면서 기록 보관소를 봉헌했습니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_156:0 "추기경 대학은 해산되고 기록 보관소의 문은 한동안 닫혀 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_157:0 "@tv_ceremony_ruler!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_157:0 "#Y 진행 중#! — #high 황제가 하늘에 제단을 쌓는 것을 명한다#!\n#F 천자는 도성 남쪽에 거대한 원형 사원이 세워질 것이라고 선포한다. 그곳에서 황제만이 하늘에 제사를 드리고 자신의 아래 있는 모든 사람을 대신하여 수확을 기원할 수 있다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_157:0 "#G 완료#! — #high 황제가 하늘에 제단을 세우라고 명하다#!\n#F 천자는 도성 남쪽에 거대한 원형 사원이 세워질 것이라고 선포합니다. 그곳에서 황제만이 하늘에 제물을 바치고 그의 아래 있는 모든 사람을 대신하여 수확을 기원할 수 있습니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_157:0 "[tv_wonder_ceremony|E]:황제가 하늘에 제단을 세우도록 명하다"
 TV_WONDER_CEREMONY_S1_DESC_157:0 "하늘의 아들은 수도 남쪽에 거대한 원형 사원이 세워질 것이며, 그곳에서 황제만이 하늘에 제물을 바치고 그의 아래 있는 모든 사람을 대신하여 수확을 기원할 것이라고 선포합니다. 궁정 천문학자들은 가장 상서로운 땅을 고치라는 명령을 받았습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_157:0 "황제가 칙령에 서명하고 사원 건축이 시작됩니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_157:0 "목사들은 인내심을 권고하지만 그 법령은 서명되지 않은 채 남아 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_157:0 "@tv_ceremony_time!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_157:0 "#Y 진행 중#! — #high 천문학자들이 신성한 축을 정렬하다#!\n#F 궁정 천문학자들은 궁전에서 제단까지의 황제의 길이 남쪽을 향하도록 사원의 미래 축을 정렬하고 경계벽은 둥근 하늘과 사각형 땅을 분리하기 위해 표시됩니다. 동봉합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_157:0 "#G 완료#! — #high 천문학자들은 신성한 축을 정렬합니다#!\n#F 궁정 천문학자들은 궁전에서 제단까지의 황제의 길이 남쪽을 향하도록 사원의 미래 축을 정렬하고 경계벽은 둥근 하늘과 사각형 땅을 분리하기 위해 표시되어 있습니다. 동봉합니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_157:0 "[tv_wonder_ceremony|E]: 천문학자들이 신성한 축을 정렬하다"
 TV_WONDER_CEREMONY_S2_DESC_157:0 "궁중 천문학자들은 궁전에서 제단까지의 황제의 길이 정남을 향하도록 사원의 미래 축을 정렬하고, 경계 벽은 둥근 하늘과 그것이 둘러싸게 될 사각형 땅을 분리하기 위해 표시되었습니다. 사이프러스 묘목은 언젠가 접근 방식을 그늘지게 할 숲으로 선택됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_157:0 "마침내 신성한 축이 진실이 되었습니다!"
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_157:0 "천문학자들은 선을 고치기 전에 별 아래에서 더 많은 밤을 보내도록 요구합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_157:0 "@tv_ceremony_painting!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_157:0 "#Y 진행 중#! — #high 천국을 위해 굽는 푸른 유약 타일#!\n#F 황제 가마는 오직 천국만을 위한 색인 가장 깊은 파란색의 타일을 굽도록 설정되어 있으며, 주변 지역의 코르비 노동자들이 신성한 곳을 청소하고 평준화하기 위해 소집됩니다. 선거구.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_157:0 "#G 완료#! — #high 하늘을 위해 굽는 청유기와#!\n#F 황제 가마는 오직 하늘만을 위한 색인 가장 깊은 파란색의 타일을 굽도록 설정되어 있으며, 주변 지방의 코르비 노동자들이 신성한 것을 청소하고 평준화하기 위해 소집됩니다. 선거구.#!"
 TV_WONDER_CEREMONY_S3_TITLE_157:0 "[tv_wonder_ceremony|E]：하늘을 위해 발사된 푸른 유리 타일"
 TV_WONDER_CEREMONY_S3_DESC_157:0 "황실 가마는 오직 하늘만을 위한 색인 가장 짙은 파란색의 타일로 만들어졌으며, 주변 지역의 코르비 인부들은 신성한 구역을 청소하고 평평하게 하기 위해 소집되었습니다. 대리석은 채석되어 제단의 3개 원형 층을 표시합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_157:0 "가마에 불이 켜지고 하늘의 푸른 타일이 불 속에서 나옵니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_157:0 "아직은 이 파란색이 천국의 파란색과 일치하지 않습니다!"
 TV_WONDER_CEREMONY_CARD_ICON_S4_157:0 "@tv_ceremony_holy_site!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_157:0 "#Y 진행 중#! — #high 둥근 제단의 첫 번째 테라스#!\n#F 인력들이 거대한 원형 제단 자체에서 착공하여 신성한 구역의 모든 측정을 관장하는 9의 수비학적 패턴으로 첫 번째 대리석 테라스를 배치합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_157:0 "#G 완료#! — #high 둥근 제단의 첫 번째 테라스#!\n#F 인력은 거대한 원형 제단 자체의 착공을 통해 신성한 구역의 모든 측정을 관장하는 9의 수비학적 패턴으로 첫 번째 대리석 테라스를 배치합니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_157:0 "[tv_wonder_ceremony|E]：둥근 제단의 첫 번째 테라스"
 TV_WONDER_CEREMONY_S4_DESC_157:0 "인부들은 크고 둥근 제단 자체의 착공을 통해 신성한 구역의 모든 측정을 관장하는 9개의 수비학적 패턴으로 최초의 대리석 테라스를 마련합니다. 수도에서 논의된 계획은 이제 탁 트인 하늘 아래 돌처럼 서 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_157:0 "노동자들은 최초의 대리석 테라스를 놓았고, 그 크기는 신성한 숫자 9에 묶여 있었습니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_157:0 "재무부 관계자는 자금이 확보될 때까지 채석을 기다려 달라고 요청했습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_157:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_157:0 "#Y 진행 중#! — #high 기도의 전당이 원을 그리다#!\n#F 목수들이 풍년기원전의 원형 목재 프레임을 들어올립니다. 3단 지붕은 단 하나의 쇠못도 없이 복잡한 서로 맞물린 나무 격자로 결합되어 있습니다. 브래킷.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_157:0 "#G 완료#! — #high 기도의 전당이 원을 그리다#!\n#F 목수들은 풍년기원전의 원형 목재 프레임을 들어올립니다. 3단 지붕은 단 하나의 쇠못도 없이 복잡한 나무 격자로 결합되어 있습니다. 브래킷.#!"
 TV_WONDER_CEREMONY_S5_TITLE_157:0 "[tv_wonder_ceremony|E]：기도의 전당이 원을 그리다"
 TV_WONDER_CEREMONY_S5_DESC_157:0 "목수들은 풍작을 위한 기도의 전당의 원형 목재 프레임을 들어올립니다. 이 홀의 3단 지붕은 단 하나의 쇠못도 없이 서로 맞물린 나무 브래킷의 복잡한 격자로 서로 결합되어 설계되었습니다. 황실 조사관들은 매주 비계에 올라가 가구 제조장의 정확성을 확인합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_157:0 "손톱 하나도 없어요!"
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_157:0 "검사관은 가구 제조의 정확성을 테스트하기 위해 일주일을 더 요청합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_157:0 "@tv_ceremony_advance!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_157:0 "#Y 진행 중#! — #high 28개의 기둥이 솟아오른다#!\n#F 홀의 내부 기둥은 규정된 숫자에 따라 높이 솟아 있으며, 계절에 따라 4개의 큰 기둥, 달에 대해 12개, 낮과 밤에 대해 12개가 더 솟아오르는 푸른 타일 아래에 모두 묶여 있습니다. 돔.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_157:0 "#G 완료#! — #high 28개의 기둥이 솟아오른다#!\n#F 홀의 내부 기둥은 규정된 수에 따라 높이 솟아 있으며, 계절에 따라 4개의 큰 기둥, 달에 대해 12개, 낮과 밤에 대해 12개가 더 솟아오르는 푸른 타일 아래에 모두 묶여 있습니다. 돔.#!"
 TV_WONDER_CEREMONY_S6_TITLE_157:0 "[tv_wonder_ceremony|E]：28개의 기둥이 솟아오른다"
 TV_WONDER_CEREMONY_S6_DESC_157:0 "홀의 내부 기둥은 정해진 수만큼 세워져 있는데, 계절을 나타내는 4개의 큰 기둥, 달을 나타내는 12개의 기둥, 낮과 밤의 시간을 나타내는 12개의 기둥이 모두 솟아오른 파란색 타일 돔 아래에 묶여 있습니다. 화가는 광선마다 용과 불사조 모티브를 그리기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_157:0 "28개의 기둥은 신성한 숫자로 솟아 있고, 화가들은 그 위의 들보에 붓을 얹었습니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_157:0 "잠깐만요, 용은 아직 그려지지 않았습니다!"
 TV_WONDER_CEREMONY_CARD_ICON_S7_157:0 "@tv_ceremony_paved_road!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_157:0 "#Y 진행 중#! — #high 의례의 길은 포장되었습니다#!\n#F 제단, 홀, 궁궐 문을 연결하는 돌담 통로의 마지막 석판은 포장되어 있으며, 길이를 따라 편백나무 숲이 황제의 길을 그늘지게 할 만큼 커집니다. 행렬.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_157:0 "#G 완료#! — #high 의례의 길은 포장되었습니다#!\n#F 제단, 홀, 궁전 문을 연결하는 돌담 통로의 마지막 석판은 포장되어 있으며, 길이를 따라 편백나무 숲이 황제의 길을 그늘지게 할 만큼 커집니다. 행렬.#!"
 TV_WONDER_CEREMONY_S7_TITLE_157:0 "[tv_wonder_ceremony|E]：의례의 길이 포장되었습니다"
 TV_WONDER_CEREMONY_S7_DESC_157:0 "제단, 홀, 궁전 문을 연결하는 높은 돌 통로는 마지막 석판에 포장되어 있으며 길이를 따라 사이프러스 숲이 황제의 행렬을 그늘지게 할 만큼 커졌습니다. 관리들은 거의 완성된 돔을 보면서 희생의 전체 순서를 연습합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_157:0 "우리는 우리 행렬이 걸어갈 길의 마지막 돌을 놓는다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_157:0 "관계자들은 마지막 돌을 놓기 전에 한 번 더 리허설을 요청합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_157:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_157:0 "#Y 진행중#! — #high 하늘이 황제의 제사를 받다#!\n#F 황제는 동지에 완성된 둥근 제단에 올라가 완성된 기도의 전당 아래 첫 번째 제사를 드리며, 법원은 이 성전을 영원히 천상과 천상의 만남의 장소로 선포한다 왕좌.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_157:0 "#G 완료#! — #high 하늘이 황제의 제사를 받다#!\n#F 황제는 동지에 완성된 둥근 제단에 올라가 완성된 기도의 전당 아래 첫 제사를 드리고, 법원은 이 성전을 영원히 천상과 천상의 만남의 장소로 선포한다. 왕좌.#!"
 TV_WONDER_CEREMONY_S8_TITLE_157:0 "[tv_wonder_ceremony|E]:하늘은 황제의 희생을 받아들인다"
 TV_WONDER_CEREMONY_S8_DESC_157:0 "황제는 동지 때 완성된 둥근 제단에 올라가서 완성된 기도의 전당 아래에 첫 제사를 드리고, 궁정에서는 이 성전을 영원히 하늘과 보좌가 만나는 장소로 선언합니다. 오늘부터 이곳에서 행해지는 의식은 백성들 앞에서 왕조의 위임을 확인하며, 하늘의 은총이 왕국 구석구석에 부드럽게 내려앉는다고 합니다.\n\n#weak 의식을 완료하려면 필요한 대가를 지불하세요. 결과적으로 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_157:0 "마침내 하늘이 희생을 받아들인다!"
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_157:0 "우리는 아직 천국 앞에 설 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_158:0 "@tv_ceremony_government!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_158:0 "#Y 진행 중#! — #high 민강 길들이기 칙령#!\n#F 지사는 청두의 끝없는 홍수와 가뭄이 끝날 것이라고 선포합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_158:0 "#G 완료#! — #high 민강을 길들이는 칙령#!\n#F 지사는 청두의 끝없는 홍수와 가뭄이 끝날 것이라고 선포합니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_158:0 "[tv_wonder_ceremony|E]：민강 길들이기의 칙령"
 TV_WONDER_CEREMONY_S1_DESC_158:0 "주지사는 청두의 끝없는 홍수와 가뭄이 끝날 것이라고 선언합니다. 측량사들은 물이 어디로 갈라져 이어질 수 있는지 연구하기 위해 상류로 파견됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 비용을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_158:0 "왕국을 길들이듯이 강을 길들이세요."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_158:0 "나는 이 칙령이 내리기 전까지 한동안 인감을 유지할 것입니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_158:0 "@tv_ceremony_mapmode!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_158:0 "#Y 진행 중#! — #high 강바닥이 조사됩니다.#!\n#F 엔지니어들이 관코우 근처의 얕은 곳을 헤치며 강이 산으로 갈라지는 지점을 표시합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_158:0 "#G 완료#! — #high 강바닥 조사#!\n#F 엔지니어들이 관커우 근처의 얕은 곳을 헤치며 강이 산으로 갈라지는 지점을 표시합니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_158:0 "[tv_wonder_ceremony|E]：강바닥을 조사하다"
 TV_WONDER_CEREMONY_S2_DESC_158:0 "엔지니어들은 관코우(Guankou) 근처의 얕은 곳을 헤치며 강이 산을 둘러싸고 갈라지는 곳을 표시합니다. 늙은 마을 사람들은 할아버지의 홍수를 회상하고 최악의 굴곡을 지적합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_158:0 "엔지니어들은 강의 숨겨진 이음새를 표시하기 위해 얕은 곳을 걸어 다녔습니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_158:0 "조금 더 기다려 보자!"
 TV_WONDER_CEREMONY_CARD_ICON_S3_158:0 "@tv_ceremony_laborers!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_158:0 "#Y 진행 중#! — #high 대나무 우리와 버드나무 말뚝#!\n#F 민강을 따라 있는 마을들은 거대한 대나무 우리를 엮고 수레에 따라 버드나무 말뚝을 자릅니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_158:0 "#G 완료#! — #high 대나무 우리와 버드나무 말뚝#!\n#F 민강을 따라 있는 마을들은 거대한 대나무 우리를 엮고 수레에 따라 버드나무 말뚝을 자릅니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_158:0 "[tv_wonder_ceremony|E]：대나무 우리와 버드나무 말뚝"
 TV_WONDER_CEREMONY_S3_DESC_158:0 "민강을 따라 있는 마을에서는 거대한 대나무 우리를 짜고 수레에 따라 버드나무 말뚝을 자릅니다. 인근 현에서 노동자를 징집하고 리빙의 방법은 장인의 신조처럼 낭송됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_158:0 "우리는 강을 따라 모든 손을 모아 직물을 짜고 운반합니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_158:0 "카운티는 현재 노동자들을 보류하고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_158:0 "@tv_ceremony_river!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_158:0 "#Y 진행중#! — #high 물고기 입이 강을 가르다#!\n#F 돌과 대나무 우리가 마침내 물살로 내려가고 민강은 강제로 내수로와 외수로로 갈라진다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_158:0 "#G 완성#! — #high 물고기 입이 강을 가르다#!\n#F 드디어 돌과 대나무 우리가 물살로 내려가고, 민강은 강제로 내수로와 외수로로 갈라진다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_158:0 "[tv_wonder_ceremony|E]:물고기 입이 강을 가르다"
 TV_WONDER_CEREMONY_S4_DESC_158:0 "마침내 돌과 대나무 우리가 물살로 내려가고, 민강은 강제로 내수로와 외수로로 갈라진다. 한때 측량사들이 가리켰던 곳에 이제 제방이 서 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_158:0 "갈라지면 강물이 나옵니다. 연합하면 파괴됩니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_158:0 "나는 아직 물살에 돌을 던지지 않을 것이다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_158:0 "@tv_ceremony_lake!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_158:0 "#Y 진행 중#! — #high 날아다니는 모래 위어가 솟아올랐습니다.#!\n#F A 낮은 배수로가 제방 옆에 건설되어 홍수 물을 흘리고 토사가 들판을 묻기 전에 외부 수로로 다시 유입됩니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_158:0 "#G 완료#! — #high 플라잉 샌드 웨어가 솟아올랐습니다.#!\n#F A 낮은 배수로가 제방 옆에 건설되어 들판이 묻히기 전에 홍수 물과 미사를 외부 수로로 다시 유출시킵니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_158:0 "[tv_wonder_ceremony|E]：날아다니는 모래 위어가 솟아오릅니다"
 TV_WONDER_CEREMONY_S5_DESC_158:0 "홍수물과 토사를 외부 수로로 다시 흘리기 위해 제방 옆에 낮은 배수로를 건설한 후 들판을 묻습니다. 작업자들은 여름의 홍수 시간을 측정하여 높이를 테스트합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다립니다.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_158:0 "작업자들은 낮은 둑을 들어 홍수를 무해하게 퍼뜨립니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_158:0 "급하게 만든 보루는 곧 무너지는 보루이다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_158:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_158:0 "#Y 진행 중#! — #high 위레이산이 절단되었습니다.#!\n#F 노동자들이 위레이산의 바위를 가열하고 깨뜨려 병목 수로를 열었고, 청두 평야 쪽으로 일정량의 물만 유입되었습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_158:0 "#G 완료#! — #high 위레이산이 절단되었습니다.#!\n#F 노동자들은 위레이산의 바위를 가열하고 깨뜨려 병목 수로를 열어 청두 평야 쪽으로 일정량의 물만 유입시킵니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_158:0 "[tv_wonder_ceremony|E]:율레이산이 잘려나가다"
 TV_WONDER_CEREMONY_S6_DESC_158:0 "노동자들은 Yulei Mountain의 암석을 가열하고 깨뜨려 병목 수로를 열며 청두 평야를 향해 물이 일정량만 유입됩니다. 불과 냉수는 어떤 끌도 할 수 없는 일을 해냅니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_158:0 "우리는 산이 통과할 때까지 산에 불과 물을 두었습니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_158:0 "일꾼들은 조금 더 산 앞에 연장을 내려놓았다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_158:0 "@tv_ceremony_control!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_158:0 "#Y 진행 중#! — #high 깊이 표시가 설정되었습니다.#!\n#F 돌 어류 표시는 매년 겨울 준설선에게 얼마나 깊은 토사를 제거해야 하는지 알려주기 위해 강바닥에 가라앉습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_158:0 "#G 완료#! — #high 깊이 표시가 설정되었습니다.#!\n#F 돌 어류 표시는 매년 겨울 준설업자에게 얼마나 깊은 토사를 제거해야 하는지 알려주기 위해 강바닥에 가라앉습니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_158:0 "[tv_wonder_ceremony|E]: 깊이 마커가 설정되었습니다."
 TV_WONDER_CEREMONY_S7_DESC_158:0 "돌 물고기 표시는 매년 겨울 준설선에게 얼마나 깊은 토사를 제거해야 하는지 알려주기 위해 강바닥에 가라앉습니다. 운율은 글을 읽을 줄 아는지 여부에 관계없이 모든 감독이 규칙을 기억할 수 있도록 구성됩니다.\n\n#weak 식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_158:0 "석공들은 물고기 표시를 가라앉히고 감독들에게 운율을 가르칩니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_158:0 "나는 내 강의 기억에 맞는 운율을 믿을 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_158:0 "@tv_ceremony_prosperity!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_158:0 "#Y 진행 중#! — #high 풍요의 땅이 봉인되었습니다#!\n#F 이제 엔지니어의 의도대로 민강의 물이 오르락 내리락하며, 청두 평야는 가뭄이나 홍수를 모르는 들판으로 피어납니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_158:0 "#G 완료#! — #high 풍요의 땅이 봉인되었습니다#!\n#F 이제 엔지니어의 의도대로 민강의 물이 오르락내리락하고, 청두 평원은 가뭄이나 홍수를 모르는 들판으로 피어납니다.#!"
 TV_WONDER_CEREMONY_S8_TITLE_158:0 "[tv_wonder_ceremony|E]: 풍요의 땅이 봉인되었습니다"
 TV_WONDER_CEREMONY_S8_DESC_158:0 "이제 민강의 물은 엔지니어가 의도한 대로 정확히 오르락내리락하고, 청두 평야는 가뭄이나 홍수를 전혀 모르는 들판으로 피어납니다. 하류의 모든 공장과 작업장은 이를 위해 더욱 안정적으로 운영됩니다.\n\n#weak 행사를 완료하는 데 필요한 가격을 지불하세요. 결과적으로 불가사의의 최종 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_158:0 "평야는 마침내 일정한 물을 마시고 모든 방앗간은 홍수나 가뭄으로부터 자유로워집니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_158:0 "서두르는 풍요는 낭비되는 풍요이다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_159:0 "@tv_ceremony_ruler!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_159:0 "#Y 진행 중#! — #high 황제의 어머니에 대한 서약#!\n#F 영락제는 마황후를 기리기 위한 서약을 이행하기 위해 보은사에 큰 탑을 세우라는 명령을 내렸습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_159:0 "#G 완료#! — #high 황제의 어머니에 대한 서약#!\n#F 영락제는 마황후를 기리기 위한 서약을 이행하기 위해 보은사에 큰 탑을 세우라는 명령을 내렸습니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_159:0 "[tv_wonder_ceremony|E]：황제의 어머니에 대한 맹세"
 TV_WONDER_CEREMONY_S1_DESC_159:0 "영락제는 마황후를 기리기 위한 서약을 이행하기 위해 보은사에 큰 탑을 세우라는 명령을 내렸습니다. 궁정 점성가들은 첫 번째 제물에 대해 상서로운 날을 정했습니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_159:0 "황제는 서원을 봉인하고 탑 건설을 시작하라고 명령합니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_159:0 "궁정 점성가들은 더욱 상서로운 날을 기다리라고 조언합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_159:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_159:0 "#Y 진행 중#! — #high 재단이 봉헌되었습니다#!\n#F 승려들은 친화이 강 남쪽의 선택된 부지 위에서 밤새도록 노래를 부르고 향 연기가 새로 변한 땅 위에 피어납니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_159:0 "#G 완료#! — #high 재단이 봉헌되었습니다#!\n#F 승려들은 친화이 강 남쪽의 선택된 부지 위에서 밤새도록 노래를 부르고, 향 연기가 새로 변한 땅 위에 피어납니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_159:0 "[tv_wonder_ceremony|E]：재단이 봉헌되었습니다"
 TV_WONDER_CEREMONY_S2_DESC_159:0 "승려들은 친화이 강 남쪽의 선택된 부지 위에서 밤새도록 노래를 부르고, 향 연기는 갓 갈아놓은 땅 위에 자리잡습니다. 유물은 미래 타워의 심장 아래에 봉인되어 있다고 합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_159:0 "마침내 신성한 땅이여!"
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_159:0 "수도원장은 유물이 봉인되기 전에 하룻밤 더 노래를 부르도록 요청합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_159:0 "@tv_ceremony_painting!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_159:0 "#Y 진행 중#! — #high 유색 유약을 위한 가마가 설정되었습니다#!\n#F 모든 벽돌을 덮을 흰색, 노란색, 녹색, 갈색의 유약을 완벽하게 만들기 위해 황실 가마의 도예가가 소환됩니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_159:0 "#G 완료#! — #high 유색 유약을 위한 가마가 설정되었습니다#!\n#F 황실 가마의 도예가가 소환되어 모든 벽돌을 덮을 흰색, 노란색, 녹색, 갈색의 유약을 완성합니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_159:0 "[tv_wonder_ceremony|E]:가마는 유색 유약으로 설정됩니다."
 TV_WONDER_CEREMONY_S3_DESC_159:0 "모든 벽돌을 덮을 흰색, 노란색, 녹색, 갈색의 유약을 완성하기 위해 황실 가마의 도공들이 소환됩니다. 테스트 타일은 색상이 법원을 만족할 때까지 발사되고 분해됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 또는 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_159:0 "도예가들은 완벽한 유약을 찾기 위해 또 다른 배치를 발사합니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_159:0 "아직 만족스럽지 않습니다. 색상을 다시 테스트해 보세요."
 TV_WONDER_CEREMONY_CARD_ICON_S4_159:0 "@tv_ceremony_holy_site!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_159:0 "#Y 진행 중#! — #high 1층 상승#!\n#F 팔각형 기단이 돌로 쌓이면서 비계가 사원 경내 위로 올라갑니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_159:0 "#G 완료#! — #high 1층 상승#!\n#F 팔각형 기단이 돌로 쌓이면서 비계가 사원 경내 위로 올라갑니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_159:0 "[tv_wonder_ceremony|E]: 첫 번째 계층 상승"
 TV_WONDER_CEREMONY_S4_DESC_159:0 "팔각형 기단이 돌 하나하나 놓이기 때문에 비계가 사원 경내 위로 올라갑니다. 한때 유약을 바른 샘플과 축복을 외치는 것뿐이었던 것이 이제 탑의 실제 첫 번째 이야기로 자리 잡았습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_159:0 "메이슨은 팔각형 기초의 마지막 돌을 제자리에 놓았습니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_159:0 "감독은 다른 돌을 놓기 전에 비계를 보강하라고 명령합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_159:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_159:0 "#Y 진행 중#! — #high 천국을 향해 오르는 9개 층#!\n#F 계층마다 유약 벽돌이 장착되어 있으며, 각 층은 이전 층과 다른 색조로 빛을 받습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_159:0 "#G Completed#! — #high Nine Tiers Climb Toward Heaven#!\n#F Tier after tier is fitted with its glazed bricks, each one catching the light a shade differently from the last.#!"
 TV_WONDER_CEREMONY_S5_TITLE_159:0 "[tv_wonder_ceremony|E]：천국을 향한 9단 오르기"
 TV_WONDER_CEREMONY_S5_DESC_159:0 "층마다 유약을 바른 벽돌이 설치되어 있으며, 각 벽돌은 이전 벽돌과 다르게 빛을 받습니다. 가장 높은 비계에 있는 작업자들은 레벨이 완료될 때마다 아래 도시가 줄어든다고 말합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_159:0 "더 높이!"
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_159:0 "마스터 빌더는 이 단계의 박격포가 굳도록 등반을 중단합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_159:0 "@tv_ceremony_art_work!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_159:0 "#Y 진행 중#! — #high L등과 종이 걸려있습니다#!\n#F 청동 종은 각 층의 처마 아래에 고정되어 강바람에 울리고 매일 저녁 등불이 켜집니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_159:0 "#G 완료#! — #high 등과 종이 걸려있습니다#!\n#F 청동 종은 각 층의 처마 아래에 고정되어 강바람에 울리고 매일 저녁 등불이 켜집니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_159:0 "[tv_wonder_ceremony|E]:등과 종이 걸려있습니다"
 TV_WONDER_CEREMONY_S6_DESC_159:0 "각 층의 처마 아래에는 청동 종이 고정되어 강바람이 울리고, 등불은 매일 저녁 켜집니다. 유리 패널에는 수호신과 연꽃의 부조가 세팅되어 있습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_159:0 "장인들은 처마 아래 마지막 청동 종을 고치고 등불을 켭니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_159:0 "아직은 아닙니다. 조각품에 더 많은 관리가 필요합니다!"
 TV_WONDER_CEREMONY_CARD_ICON_S7_159:0 "@tv_ceremony_laborers!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_159:0 "#Y 진행 중#! — #high 밤에도 불타는 가마#!\n#F A 어울리는 유약이 부족하면 어두워진 후에도 오랫동안 가마에서 불이 붙고, 지친 도공들은 용광로 옆에서 교대로 잠을 잔다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_159:0 "#G 완료#! — #high 밤에도 불타오르는 가마#!\n#F A 어울리는 유약이 부족하면 어두워진 후에도 오랫동안 가마에 불이 붙고, 지친 도공들은 용광로 옆에서 교대로 잠을 잔다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_159:0 "[tv_wonder_ceremony|E]: 밤에도 불타오르는 가마"
 TV_WONDER_CEREMONY_S7_DESC_159:0 "어울리는 유약이 부족하여 어두워진 후에도 오랫동안 가마에서 불을 피워야 하며, 지친 도공들은 가마 옆에서 교대로 잠을 잔다. 승려들은 작업을 중단할 필요가 없도록 음식을 마당으로 가져옵니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_159:0 "우리는 가마를 돌보는 사람들에게 어떤 대가를 치르더라도 가마를 계속 불태우라고 명령합니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_159:0 "감독자는 불이 다시 켜지기 전에 지친 도공들을 쉬도록 보냅니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_159:0 "@tv_ceremony_building_open!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_159:0 "#Y 진행 중#! — #high 도자탑이 봉헌되었습니다#!\n#F 스님들은 완성된 탑 주위를 돌며 처음으로 140개의 등불이 켜졌고, 황혼 무렵 친화이 강변을 금빛으로 물들였습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_159:0 "#G 완성#! — #high 도자탑이 봉헌되었습니다#!\n#F 승려들은 완성된 탑을 돌며 처음으로 140개의 등불이 켜졌고, 황혼 무렵 친화이 강변을 금빛으로 물들였습니다.#!"
 TV_WONDER_CEREMONY_S8_TITLE_159:0 "[tv_wonder_ceremony|E]：도자탑이 봉헌되다"
 TV_WONDER_CEREMONY_S8_DESC_159:0 "승려들은 완성된 탑 주위를 돌며 행렬을 이루고 140개의 등불이 처음으로 켜져 황혼이 질 무렵 친화이 강변을 금빛으로 물들입니다. 오늘 밤부터 사원의 명성은 순례자들을 끌어 모으고 왕국의 충성심을 조용히 재편합니다.\n\n#weak 의식을 완료하는 데 필요한 가격을 지불하세요. 결과적으로 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_159:0 "마침내 탑이 빛나게 해주세요!"
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_159:0 "승려들은 모든 등불이 제대로 걸릴 때까지 행렬을 연기합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_160:0 "@tv_ceremony_government!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_160:0 "#Y 진행 중#! — #high 황실 가마에 대한 칙령#!\n#F 법원은 징더전을 공식 도자기의 중심지로 선포하고, 그 제품은 모든 일반 도자기와 구별되도록 표시합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_160:0 "#G 완료#! — #high 황실 가마에 대한 칙령#!\n#F 법원은 징더전을 공식 도자기의 중심지로 선포하고, 그 제품은 모든 일반 도자기와 구별되도록 표시합니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_160:0 "[tv_wonder_ceremony|E]: 황실 가마에 대한 칙령"
 TV_WONDER_CEREMONY_S1_DESC_160:0 "법원은 징더전을 공식 도자기의 본거지로 선포하고, 그 제품은 모든 일반 도자기와 구별되어야 합니다. Fuliang의 도예가들은 황실 위원이 헌장을 큰 소리로 읽는 것을 듣기 위해 모였습니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_160:0 "그래서 선언합니다!"
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_160:0 "우리는 Fuliang의 가마에 왕관의 이름을 올릴 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_160:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_160:0 "#Y 진행 중#! — #high 점토 은행이 선택되었습니다#!\n#F 조사관들이 푸량 근처 강둑을 거닐며 각 구덩이에서 뽑아낸 고령토의 백색도를 테스트합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_160:0 "#G 완료#! — #high 점토 은행이 선택되었습니다#!\n#F 측량사들은 푸량 근처 강둑을 걸으며 각 구덩이에서 뽑아낸 고령토의 백색도를 테스트합니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_160:0 "[tv_wonder_ceremony|E]：점토 은행이 선택되었습니다"
 TV_WONDER_CEREMONY_S2_DESC_160:0 "측량사들은 Fuliang 근처의 강둑을 거닐며 각 구덩이에서 채취한 고령토의 백색도를 테스트합니다. 최고급 점토 침대는 표시되어 있으며 왕관만을 위해 예약되어 있습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_160:0 "측량사는 왕관에만 가장 하얀 점토층을 표시합니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_160:0 "아직은 아닙니다. 은행은 아직 테스트되지 않은 상태입니다!"
 TV_WONDER_CEREMONY_CARD_ICON_S3_160:0 "@tv_ceremony_art_work!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_160:0 "#Y 진행 중#! — #high 코발트와 도예의 대가 도착#!\n#F 푸른 코발트 색소는 먼 광산에서 운반되고, 그들의 기술을 빌려주기 위해 장시 전역에서 유명한 도예가들이 소환됩니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_160:0 "#G 완료#! — #high 코발트와 도예의 대가 도착#!\n#F 푸른 코발트 색소는 먼 광산에서 운반되고, 그들의 기술을 빌려주기 위해 장시 전역에서 유명한 도공들이 소환됩니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_160:0 "[tv_wonder_ceremony|E]：코발트와 도공의 대가 도착"
 TV_WONDER_CEREMONY_S3_DESC_160:0 "푸른 코발트 색소는 먼 광산에서 운반되고, 그들의 기술을 빌려주기 위해 장시성 전역에서 유명한 도예가들이 소환됩니다. 점토야드는 바퀴를 기다리는 준비된 반죽으로 가득 차 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_160:0 "나는 최고의 도공들을 불러 코발트를 가져오겠습니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_160:0 "아직 코발트와 장인이 없는 점토 야드가 기다리고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_160:0 "@tv_ceremony_production_method!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_160:0 "#Y 진행 중#! — #high 첫 번째 용 가마가 파헤쳐졌습니다.#!\n#F 노동자들이 첫 번째 용 가마의 긴 경사진 방을 푸량 위의 언덕으로 절단했습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_160:0 "#G 완료#! — #high 첫 번째 용 가마가 파헤쳐졌습니다.#!\n#F 노동자들이 첫 번째 용 가마의 긴 경사진 방을 푸량 위의 언덕으로 절단했습니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_160:0 "[tv_wonder_ceremony|E]: 최초의 용가마를 파다"
 TV_WONDER_CEREMONY_S4_DESC_160:0 "인부들은 첫 번째 용 가마의 길고 경사진 방을 Fuliang 위의 언덕으로 절단했습니다. 지금까지 점토 구덩이와 장인들이 모여 있던 곳이 처음으로 작동하는 용광로가 되었습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_160:0 "불이 꺼진 용광로는 언덕에 있는 구멍일 뿐입니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_160:0 "우리는 이 언덕에 불을 붙일 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_160:0 "@tv_ceremony_painting!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_160:0 "#Y 진행 중#! — #high 청백의 형태#!\n#F 화가들은 굽지 않은 그릇 위에 무릎을 꿇고 연습된 속도로 용, 파도, 매화의 코발트 붓놀림을 그립니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_160:0 "#G 완료#! — #high 파란색과 흰색의 형태#!\n#F 화가들은 굽지 않은 그릇 위에 무릎을 꿇고 연습된 속도로 용, 파도, 매화의 코발트 붓놀림을 그립니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_160:0 "[tv_wonder_ceremony|E]: 파란색과 흰색의 형태"
 TV_WONDER_CEREMONY_S5_DESC_160:0 "화가들은 굽지 않은 그릇 위에 무릎을 꿇고 연습한 속도로 용, 파도, 매화의 코발트 붓터치를 그립니다. 각 제품은 불에 가까워지기 전에 수십 명의 손을 거칩니다.\n\n#weak 세레모니를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_160:0 "화가들은 용을 눕히고 기다리고 있는 점토 위에 손을 흔든다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_160:0 "서둘러 붓은 불결한 선을 남깁니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_160:0 "@tv_ceremony_control!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_160:0 "#Y 진행 중#! — #high 황실 마크가 새겨져 있습니다.#!\n#F 검사관은 냉각 선반을 돌아다니며 아주 희미한 결함이 있는 용기를 박살내며, 결함이 없는 사람만이 바닥에 군림 마크를 남깁니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_160:0 "#G 완료#! — #high 황실 마크가 새겨져 있습니다.#!\n#F 검사관은 냉각 선반을 돌아다니며 가장 희미한 결함이 있는 용기를 박살내며, 결함이 없는 사람만이 바닥에 군림 마크를 남깁니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_160:0 "[tv_wonder_ceremony|E]: 임페리얼 마크가 각인되어 있습니다."
 TV_WONDER_CEREMONY_S6_DESC_160:0 "검사관은 냉각 선반을 돌아다니며 가장 희미한 결함이 있는 용기를 부수고, 결함이 없는 용기만이 바닥에 통치 표시를 남깁니다. 작업장 문 밖에 파편이 높이 쌓여 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_160:0 "나는 결함이 있는 함선 하나에도 우리 통치의 표식을 새기도록 두지 않을 것입니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_160:0 "검사관들은 망설이고 망치는 여전히 옆구리에 놓여 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_160:0 "@tv_ceremony_laborers!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_160:0 "#Y 진행 중#! — #high 가마는 절대 차가워지지 않습니다.#!\n#F 가마가 감당할 수 있는 것보다 법원의 수요가 빠르게 증가하고 시즌 내내 밤낮으로 불이 계속 타오르고 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_160:0 "#G 완료#! — #high 가마는 절대 차가워지지 않습니다.#!\n#F 가마가 감당할 수 있는 것보다 법원의 수요가 빠르게 증가하고 시즌 내내 밤낮으로 불이 계속 타오르고 있습니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_160:0 "[tv_wonder_ceremony|E]：가마는 절대 차가워지지 않습니다"
 TV_WONDER_CEREMONY_S7_DESC_160:0 "법원의 수요는 가마가 감당할 수 있는 것보다 더 빠르게 증가하며, 계절 내내 밤낮으로 불이 계속 타오르고 있습니다. 끊임없는 노동과 그 위험을 공유하기 위해 가마 노동자 길드가 형성됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_160:0 "차가운 가마는 어떤 명령에도 응답하지 않습니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_160:0 "우리는 아직 가마 노동자들에게 쉬지 않고 일하라고 감히 요구할 수 없습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_160:0 "@tv_ceremony_trade!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_160:0 "#Y 진행 중#! — #high 징더전의 도자기가 세계에 닿다#!\n#F 용 가마는 온전한 힘을 발휘하고 있으며, 청백 도자기는 이제 캐러밴에 실려 장시성 언덕 너머로 배송됩니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_160:0 "#G 완성#! — #high 징더전의 제품이 세계에 닿다#!\n#F 용 가마는 힘을 다해 서 있고, 청화백 도자기는 이제 캐러밴에 실려 장시성 언덕 너머로 배송됩니다.#!"
 TV_WONDER_CEREMONY_S8_TITLE_160:0 "[tv_wonder_ceremony|E]：경덕진의 상품이 세계에 닿다"
 TV_WONDER_CEREMONY_S8_DESC_160:0 "용 가마는 온전한 힘을 발휘하고 있으며, 청화 도자기는 이제 대상과 선박에 의해 장시성 언덕 너머 멀리까지 운반됩니다. 영역의 모든 작업장은 Fuliang의 규율에서 무언가를 배우고 그 거래는 여러 세대에 걸쳐 왕관을 풍요롭게 합니다.\n\n#weak 의식을 완료하는 데 필요한 가격을 지불하세요. 결과적으로 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_160:0 "캐러밴과 선박은 Fuliang의 도자기를 먼 해안까지 운반합니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_160:0 "너무 빨리 퍼지는 명성은 그 자체의 품질을 능가합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_161:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_161:0 "#Y 진행 중#! — #high A 절벽에서의 승려의 서약#!\n#F 스님 르준(Le Zun) 승려는 둔황 근처 절벽 위에 수천 개의 불상이 있다는 환상을 주장하고 바위에 성소를 새길 것을 맹세합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_161:0 "#G 완료#! — #high A 절벽에서의 승려의 서약#!\n#F 승려 르준(Le Zun)은 둔황 근처 절벽 위에 수천 개의 불상이 있다는 환영을 주장하고 바위에 성소를 새길 것을 맹세합니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_161:0 "[tv_wonder_ceremony|E]：절벽에서의 승려의 맹세"
 TV_WONDER_CEREMONY_S1_DESC_161:0 "승려 러준(Le Zun)은 둔황 근처 절벽 위에 천 개의 불상이 있다고 주장하며 바위에 성소를 새길 것을 맹세합니다. 실크로드를 지나가는 상인들은 그 일을 위해 은화를 서약합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_161:0 "스님은 절벽 앞에 무릎을 꿇고 그의 비전을 향해 첫 번째 은전을 맹세합니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_161:0 "너무 빨리 한 서원은 기름 없이 켜진 등불과 같습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_161:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_161:0 "#Y 진행 중#! — #high 절벽면이 선택되었습니다#!\n#F 측량사는 Daquan 강 위의 사암 절벽을 걸어가며 바위가 동굴 사원을 지탱할 수 있을 만큼 견고한 곳을 표시합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_161:0 "#G 완료#! — #high 절벽면이 선택되었습니다#!\n#F 측량사는 다취안 강 위의 사암 절벽을 걸어가며 동굴 사원을 지탱할 수 있을 만큼 바위가 튼튼한 곳을 표시합니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_161:0 "[tv_wonder_ceremony|E]：절벽면이 선택되었습니다"
 TV_WONDER_CEREMONY_S2_DESC_161:0 "측량사들은 다취안(Daquan) 개울 위의 사암 절벽을 거닐며 동굴 사원을 지탱할 수 있을 만큼 바위가 견고한 곳을 표시합니다. 아래의 오아시스는 여러 세대의 건축업자들을 지탱하기에 적합한 것으로 판단됩니다.\n\n#weak 행사를 다음 단계로 진행하는 데 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_161:0 "나는 이 사암이 뻗어 있음을 확인합니다. 오아시스가 우리가 만든 것의 무게를 지탱하게 하십시오."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_161:0 "측량사들은 아직 돌에 표시를 하지 않으려고 절벽에서 물러났습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_161:0 "@tv_ceremony_art_work!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_161:0 "#Y 진행 중#! — #high 안료와 목재가 모인다#!\n#F 캐러밴은 먼 산에서 청금석과 황토 색소를 가져오고, 현지 목수는 절벽에 비계용 목재를 잘라냅니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_161:0 "#G 완료#! — #high 안료와 목재가 모였습니다#!\n#F 캐러밴은 먼 산에서 청금석과 황토 색소를 가져오고, 현지 목수는 절벽에 비계용 목재를 잘라냅니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_161:0 "[tv_wonder_ceremony|E]：안료와 목재가 모여있습니다"
 TV_WONDER_CEREMONY_S3_DESC_161:0 "캐러밴은 먼 산에서 청금석과 황토 색소를 가져오고, 현지 목수는 절벽에 기대어 비계용 목재를 자릅니다. 조각가들은 아직 형태를 갖추지 않은 이미지를 만들기 위해 점토와 짚을 섞습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_161:0 "캐러밴은 절벽 기슭에 청금석과 황토를 내립니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_161:0 "나는 캐러밴을 저지합니다. 안료는 다음 시즌을 기다릴 수 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_161:0 "@tv_ceremony_holy_site!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_161:0 "#Y 진행 중#! — #high 첫 번째 방이 조각되었습니다#!\n#F 끌이 마침내 사암에 물려 들어가고 둔황 위 절벽에 첫 번째 소박한 방이 열립니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_161:0 "#G 완료#! — #high 첫 번째 방이 조각되었습니다#!\n#F 끌이 마침내 사암에 물려 들어가고 둔황 위 절벽에 첫 번째 소박한 방이 열립니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_161:0 "[tv_wonder_ceremony|E]: 첫 번째 방이 새겨져 있습니다"
 TV_WONDER_CEREMONY_S4_DESC_161:0 "마침내 끌이 사암을 깨물고 둔황 위의 절벽에 첫 번째 겸손한 방이 열립니다. 비전과 은의 서약으로 시작된 것이 이제 살아있는 바위에 새겨진 구멍이 되었습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_161:0 "첫 번째 방이 부서질 때까지 바위에 끌이 울립니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_161:0 "끌은 절벽에 기대어 있고 첫 번째 절단은 아직 이루어지지 않았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_161:0 "@tv_ceremony_artistic_skill_icon!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_161:0 "#Y 진행 중#! — #high A 거대 불상이 형태를 취하다#!\n#F 조각가들은 점토로 가득 찬 목재 프레임으로 우뚝 솟은 불상을 만들고 동굴 내부에 묶인 대나무 플랫폼에서 위쪽으로 작업합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_161:0 "#G Completed#! — #high A 거대 불상이 형태를 취하다#!\n#F 조각가들은 동굴 내부에 묶인 대나무 플랫폼에서 위쪽으로 작업하면서 점토로 가득 찬 목재 프레임으로 우뚝 솟은 불상을 만듭니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_161:0 "[tv_wonder_ceremony|E]: 거대 불상이 형태를 취하다"
 TV_WONDER_CEREMONY_S5_DESC_161:0 "조각가들은 점토를 채운 목재 프레임으로 우뚝 솟은 불상을 만들고 동굴 내부에 묶인 대나무 플랫폼에서 위쪽으로 작업합니다. 아래 순례자들은 최종 높이를 추측하기 위해 목을 쭉 뻗습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_161:0 "나는 조각가들에게 부처님의 형상을 대나무 비계 위에 높이 올리라고 명합니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_161:0 "조각가들이 아래로 내려오면서 대불의 형상은 반쯤 솟아올랐다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_161:0 "@tv_ceremony_painting!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_161:0 "#Y 진행 중#! — #high 실크로드 장면이 벽을 덮습니다.#!\n#F 화가들은 오아시스 너머 무역로에서 가져온 상인, 승려, 천상의 음악가의 장면으로 방 벽을 채웁니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_161:0 "#G 완료#! — #high 실크로드 장면이 벽을 덮습니다.#!\n#F 화가들은 오아시스 너머 무역로에서 가져온 상인, 승려, 천상의 음악가의 장면으로 방 벽을 채웁니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_161:0 "[tv_wonder_ceremony|E]：실크로드 풍경이 벽을 뒤덮습니다"
 TV_WONDER_CEREMONY_S6_DESC_161:0 "화가들은 오아시스 너머 무역로에서 가져온 상인, 승려, 천상의 음악가들의 장면으로 방 벽을 채웁니다. 외부 캐러밴이 하룻밤 동안 캠프를 마친 후 오랜 시간이 지나서 신선한 색소가 등불 아래에서 건조됩니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_161:0 "화가들은 등불을 들고 대상과 천상의 음악가들로 벽을 가득 채웁니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_161:0 "나는 잠시 동안 벽을 그대로 방치합니다. 내 마음 속에서는 아직 색소가 마르지 않았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_161:0 "@tv_ceremony_lock!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_161:0 "#Y 진행 중#! — #high 도서관 동굴은 봉쇄되었습니다#!\n#F 승려와 상인 세대는 절벽을 따라 새로운 동굴을 추가하고 숨겨진 방은 봉인되기 전에 경전, 계약서, 편지로 가득 차 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_161:0 "#G 완료#! — #high 도서관 동굴은 봉쇄되었습니다#!\n#F 승려와 상인 세대는 절벽을 따라 새로운 동굴을 추가하고 숨겨진 방은 봉인되기 전에 경전, 계약서, 편지로 가득 차 있습니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_161:0 "[tv_wonder_ceremony|E]：도서관 동굴은 봉쇄되었습니다"
 TV_WONDER_CEREMONY_S7_DESC_161:0 "여러 세대의 승려와 상인들이 절벽을 따라 새로운 동굴을 추가하고, 숨겨진 방은 봉쇄되기 전에 경전, 계약서, 편지로 가득 차 있습니다. 이제 어느 틈새 시장이 자리잡고 있는지 정확히 기억하는 사람은 없습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_161:0 "승려들은 숨겨진 방을 봉인하고 그 경전과 문자는 기억에 남도록 설계되었습니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_161:0 "숨겨진 방은 아직 봉인되지 않은 상태로 한동안 열려 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_161:0 "@tv_ceremony_trade!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_161:0 "#Y 진행 중#! — #high 모가오가 신성한 웨이포인트가 되다#!\n#F 절벽을 따라 있는 동굴은 함께 봉헌되고, 동굴에 그려진 부처가 아래를 지나가는 모든 캐러밴을 지켜보고 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_161:0 "#G 완료#! — #high 모가오가 신성한 웨이포인트가 되다#!\n#F 절벽을 따라 있는 동굴은 함께 봉헌되었으며, 동굴에 그려진 부처가 아래를 지나가는 모든 캐러밴을 지켜보고 있습니다.#!"
 TV_WONDER_CEREMONY_S8_TITLE_161:0 "[tv_wonder_ceremony|E]: 막고오가 신성한 웨이포인트가 되다"
 TV_WONDER_CEREMONY_S8_DESC_161:0 "절벽을 따라 있는 동굴은 함께 봉헌되었으며, 그 아래를 지나가는 모든 캐러밴을 지켜보는 불상이 그려져 있습니다. 실크로드의 성역인 막가오의 명성은 이제 무역로를 따라 먼 지역의 문화를 전달합니다.\n\n#weak 의식을 완료하려면 필요한 가격을 지불하세요. 결과적으로 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_161:0 "드디어 실크로드의 성역!"
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_161:0 "대상들은 절벽 아래를 지나가고, 막고오의 봉헌은 다음 시즌을 기다립니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_162:0 "@tv_ceremony_law!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_162:0 "#Y 진행 중#! — #high 광둥 체제가 선포됩니다#!\n#F 황제의 칙령에 따라 모든 대외 무역은 광저우 해안가의 한 지역으로 제한되어 허가받은 홍콩 상인 길드에 의해 관리됩니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_162:0 "#G 완료#! — #high 광둥 체제가 선포됩니다#!\n#F 황제의 칙령에 따라 모든 대외 무역은 광저우 해안가의 한 지역으로 제한되어 허가받은 홍콩 상인 길드에 의해 관리됩니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_162:0 "[tv_wonder_ceremony|E]：캔톤 시스템이 선포됩니다"
 TV_WONDER_CEREMONY_S1_DESC_162:0 "제국의 칙령은 모든 대외 무역을 광저우 해안가의 한 지역으로 제한하여 허가받은 홍 상인 길드가 관리하도록 했습니다. 잉크가 마르기 전에 소문이 주강에 퍼집니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_162:0 "그래서 법령이 봉인되었습니다!"
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_162:0 "장관들은 서명되지 않은 칙령을 따로 보관했습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_162:0 "@tv_ceremony_location!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_162:0 "#Y 진행 중#! — #high 해안이 표시되어 있습니다.#!\n#F 공무원들은 성벽 밖의 진흙탕 둑을 거닐며 해안을 각 무역 국가의 구역으로 나눕니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_162:0 "#G 완료#! — #high 해변이 표시되어 있습니다.#!\n#F 공무원들은 성벽 밖의 진흙탕 둑을 따라 걸으며 해안을 각 교역 국가의 구역으로 나눕니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_162:0 "[tv_wonder_ceremony|E]: 해안가가 표시되어 있습니다"
 TV_WONDER_CEREMONY_S2_DESC_162:0 "관리들은 성벽 밖의 진흙둑을 따라 걸으며 해안을 각 무역 국가의 구획으로 나눕니다. 어부들은 계류장을 하류로 옮기는 대가를 받습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 비용을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_162:0 "측량사는 진흙탕을 따라 말뚝을 몰고 다닙니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_162:0 "아직은 아닙니다. 어부들이 계류지를 유지하도록 하십시오!"
 TV_WONDER_CEREMONY_CARD_ICON_S3_162:0 "@tv_ceremony_wealth!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_162:0 "#Y 진행 중#! — #high 목재와 홍 상인이 모인다#!\n#F 바지선은 삼각주에서 목재, 벽돌, 돌을 가져오고, 새로 허가받은 홍 상인은 자본을 모아 첫 번째 창고를 마련합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_162:0 "#G Completed#! — #high 목재와 홍 상인이 모여#!\n#F 바지선이 삼각주에서 목재, 벽돌, 석재를 가져오고, 새로 허가받은 홍 상인은 자본을 모아 첫 번째 창고를 마련합니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_162:0 "[tv_wonder_ceremony|E]：목재와 홍 상인들이 모인다"
 TV_WONDER_CEREMONY_S3_DESC_162:0 "바지선은 삼각주에서 목재, 벽돌, 석재를 가져오고, 새로 허가받은 홍콩 상인은 자본을 모아 최초의 창고를 세웁니다. 평가자는 외국어를 구사할 수 있도록 모집됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_162:0 "우리는 자본을 모으고 매판자들을 소환합니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_162:0 "홍콩 상인들은 동전을 좀 더 오래 보관합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_162:0 "@tv_ceremony_market!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_162:0 "#Y 진행 중#! — #high 첫 번째 공장 기초가 놓였습니다.#!\n#F 첫 번째 공장 건물의 무게를 지탱하기 위해 말뚝이 강둑 진흙에 박혀 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_162:0 "#G 완료#! — #high 첫 번째 공장 기초가 놓였습니다.#!\n#F 첫 번째 공장 건물의 무게를 지탱하기 위해 말뚝이 강둑 진흙에 박혀 있습니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_162:0 "[tv_wonder_ceremony|E]: 최초의 공장 기초가 놓였습니다"
 TV_WONDER_CEREMONY_S4_DESC_162:0 "첫 번째 공장 건물의 무게를 지탱하기 위해 말뚝이 강둑 진흙에 박혀 있습니다. 지금까지 조사된 부지와 모아진 자본은 마침내 물 위로 솟아오르는 목재와 벽돌이 됩니다.\n\n#weak 행사를 다음 단계로 진행하는 데 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_162:0 "드디어 더미가 박혀있습니다!"
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_162:0 "승무원들은 더미를 은행에 쌓아 두었습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_162:0 "@tv_ceremony_diplomacy!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_162:0 "#Y 진행 중#! — #high 외국 깃발이 와이탄을 따라 뜬다#!\n#F 각 교역 국가는 해안가를 따라 자국의 깃발과 외관을 게양하고, 영국, 네덜란드, 기타 홍콩은 각각 스타일이 다릅니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_162:0 "#G 완료#! — #high 외국 깃발이 와이탄을 따라 뜬다#!\n#F 각 무역 국가는 해안가를 따라 자국의 깃발과 정면을 게양하고, 영국, 네덜란드 및 기타 홍콩은 각각 스타일이 다릅니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_162:0 "[tv_wonder_ceremony|E]：외탄을 따라 떠오르는 외국 국기"
 TV_WONDER_CEREMONY_S5_DESC_162:0 "각 무역 국가는 해안가를 따라 고유의 깃발과 외관을 게양하고 영국, 네덜란드 및 기타 홍은 각각 독특한 스타일을 가지고 있습니다. 강변은 제국의 어느 곳에서도 볼 수 없는 모습으로 변하기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_162:0 "외국홍들이 직원들에게 깃발을 휘날리고 있다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_162:0 "잠깐만요 - 깃발을 계속 펼쳐 놓으세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S6_162:0 "@tv_ceremony_trade!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_162:0 "#Y 진행 중#! — #high 창고에 차와 비단이 가득하다#!\n#F 새 창고 내부에는 차 상자, 비단 한 묶음, 도자기 상자가 바닥에서 천장까지 쌓여 있어 다음 출국 함대를 기다리고 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_162:0 "#G 완료#! — #high 차와 실크로 가득 찬 창고#!\n#F 새 창고 내부에는 차 상자, 실크 한 묶음, 도자기 상자가 바닥에서 천장까지 쌓여 있으며 다음 아웃바운드 함대를 기다리고 있습니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_162:0 "[tv_wonder_ceremony|E]：차와 비단으로 가득한 창고"
 TV_WONDER_CEREMONY_S6_DESC_162:0 "새 창고 내부에는 차 상자, 실크 한 묶음, 도자기 상자가 바닥에서 천장까지 쌓여 있으며 다음 출항 함대를 기다리고 있습니다. 홍콩 상인들은 엄격한 할당량에 맞춰 모든 상자를 계산합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_162:0 "우리는 창고를 채우고 모든 상자를 집계합니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_162:0 "점원은 장부와 상자를 집계하지 않은 채로 둡니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_162:0 "@tv_ceremony_port!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_162:0 "#Y 진행 중#! — #high The Wharves Never Sleep#!\n#F 배들이 정박지로 붐비고 한 시즌 동안 화재가 발생하여 두 척의 홍(Hong)을 급하게 수리해야 하는 동안 언어학자와 회계사는 밤늦게 상인들 사이를 왕복합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_162:0 "#G 완료#! — #high The Wharves Never Sleep#!\n#F 배들이 정박지로 붐비고 한 시즌에 화재가 발생하여 두 척의 홍어를 급히 수리해야 하는 동안 언어학자와 회계사는 밤늦게 상인들 사이를 왕복합니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_162:0 "[tv_wonder_ceremony|E]: 부두는 잠들지 않는다"
 TV_WONDER_CEREMONY_S7_DESC_162:0 "배들이 정박지로 붐비는 동안 언어학자와 매판업자들은 밤늦게 상인들 사이를 오가고, 한 시즌에 화재가 발생하면 홍 중 두 척을 서둘러 수리해야 합니다. 부두는 이전보다 더 분주하게 재건되고 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 비용을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_162:0 "재조차도 새로운 목재를 위한 비옥한 토양을 만듭니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_162:0 "우리는 이렇게 빨리 다시는 부두를 위험에 빠뜨리는 위험을 감수할 수 없습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_162:0 "@tv_ceremony_prosperity!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_162:0 "#Y 진행 중#! — #high 13개 공장 건설 완료#!\n#F 주강을 따라 공장 건물이 줄지어 늘어서 있고, 모든 바다로 향하는 상품을 싣고 있는 부두 위에 깃발이 펄럭입니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_162:0 "#G 완료#! — #high 13개 공장 스탠드 완성#!\n#F 주강을 따라 공장 건물이 줄지어 늘어서 있고, 모든 바다로 향하는 상품을 싣고 있는 부두 위에 깃발이 펄럭입니다.#!"
 TV_WONDER_CEREMONY_S8_TITLE_162:0 "[tv_wonder_ceremony|E]：13개 공장 준공"
 TV_WONDER_CEREMONY_S8_DESC_162:0 "이제 공장 건물들이 주강을 따라 줄지어 늘어서 있고, 모든 바다로 향하는 물품을 싣고 있는 부두 위에 깃발이 펄럭이고 있습니다. 캔톤의 무역과 외국 선장과의 신중한 외교는 이제 전체 영역을 꾸준히 풍요롭게 하고 영예를 줍니다.\n\n#weak 의식을 완료하는 데 필요한 대가를 지불하십시오. 결과적으로 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_162:0 "13개의 공장이 강을 따라 완공되었습니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_162:0 "아직은 아닙니다. 마지막 광선을 기다리세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S1_163:0 "@tv_ceremony_military_panel!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_163:0 "#Y 진행 중#! — #high 술탄은 해협 봉쇄를 명령합니다.#!\n#F 술탄은 감히 바다로 수도에 접근하는 모든 함대에 대비해 갈리폴리에 요새를 구축하라고 명령합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_163:0 "#G 완료#! — #high 술탄은 해협 봉쇄를 명령합니다.#!\n#F 술탄은 감히 바다로 수도에 접근하는 모든 함대에 대비해 갈리폴리에 요새를 구축하도록 명령합니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_163:0 "[tv_wonder_ceremony|E]: 술탄이 해협 봉쇄를 명령하다"
 TV_WONDER_CEREMONY_S1_DESC_163:0 "술탄은 감히 바다를 통해 수도에 접근하는 모든 함대에 맞서 갈리폴리의 좁은 수로를 요새화하도록 명령합니다. 엔지니어와 포수 모두 다다넬스 해안으로 소환됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_163:0 "술탄은 법령을 봉인하고 소환장을 해안으로 보냅니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_163:0 "서둘러 서명한 법령은 후회되는 법령이 되는 경우가 많습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_163:0 "@tv_ceremony_maritime_presence!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_163:0 "#Y 진행 중#! — #high 두 해안 모두 측량됩니다#!\n#F 측량사는 좁은 물을 계속해서 건너며 해류가 가장 느리게 흐르는 곳과 지나가는 선체에서 포가 가장 잘 견딜 수 있는 곳을 표시합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_163:0 "#G 완료#! — #high 두 해안 모두 조사되었습니다#!\n#F 측량사는 좁은 바다를 계속해서 건너며 해류가 가장 느리게 흐르는 곳과 지나가는 선체에서 포가 가장 잘 견딜 수 있는 곳을 표시합니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_163:0 "[tv_wonder_ceremony|E]：두 해안 모두 조사됨"
 TV_WONDER_CEREMONY_S2_DESC_163:0 "측량사들은 좁은 물을 계속해서 건너 해류가 가장 느리게 흐르는 곳과 지나가는 선체에서 대포가 가장 잘 견딜 수 있는 곳을 표시합니다. 현지 어부들은 해협의 분위기를 파악한 대가로 돈을 받습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_163:0 "나는 양쪽 해안의 해류를 읽기 위해 측량사를 파견합니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_163:0 "측량사는 제지됩니다. 조류는 또 다른 계절을 기다릴 수 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_163:0 "@tv_ceremony_cannons!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_163:0 "#Y 진행 중#! — #high 돌과 청동이 무너졌습니다.#!\n#F 채석된 돌은 양쪽 제방에 밀어넣고 청동은 내륙 주조소에서 대포 통에 주조합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_163:0 "#G 완료#! — #high 돌과 청동이 무너졌습니다#!\n#F 채석된 돌은 양쪽 제방에 밀어넣고 청동은 내륙 주조소에서 대포통에 주조됩니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_163:0 "[tv_wonder_ceremony|E]：돌과 청동이 무너졌습니다"
 TV_WONDER_CEREMONY_S3_DESC_163:0 "채석된 돌은 양쪽 강둑에 바지선으로 채워지고 청동은 내륙 주조소에서 대포통으로 주조됩니다. 오스만 포수들이 총기 훈련을 통해 다가오는 수비대를 훈련하기 위해 도착했습니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_163:0 "규율을 통해 단련된 철은 그것을 휘두르는 손을 결코 실망시키지 않습니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_163:0 "나는 파운드리를 좀 더 보류합니다. 청동은 그 틀을 기다릴 수 있다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_163:0 "@tv_ceremony_defensive_military_stance!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_163:0 "#Y 진행 중#! — #high 타워 기초 상승#!\n#F 메이슨은 해협 양쪽 해안에 타워를 위한 첫 번째 석조 코스를 깔았습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_163:0 "#G 완료#! — #high The Tower Foundations Rise#!\n#F Masons는 해협의 양쪽 해안에 타워를 위한 첫 번째 돌 코스를 놓았습니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_163:0 "[tv_wonder_ceremony|E]: 타워 파운데이션 라이즈"
 TV_WONDER_CEREMONY_S4_DESC_163:0 "석공들은 해협의 양쪽 기슭에 탑을 쌓기 위한 첫 번째 돌층을 깔았습니다. 지금까지 조사와 화물이 물가에서 직접 솟아오른 벽처럼 서 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_163:0 "석공들은 물가를 따라 돌의 첫 번째 코스를 설정했습니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_163:0 "서둘러 놓은 기초는 구부러져 자리잡는다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_163:0 "@tv_ceremony_army_artillery!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_163:0 "#Y 진행 중#! — #high 배터리가 장착되었습니다.#!\n#F 중포는 성벽을 따라 윈치되어 있으며 총구는 좁은 수로를 건너 반대편 해안을 향해 훈련되어 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_163:0 "#G 완료#! — #high 배터리가 장착되었습니다.#!\n#F 중포는 성벽을 따라 제자리에 윈치되어 있으며 총구는 좁은 수로를 건너 반대편 해안을 향해 훈련되어 있습니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_163:0 "[tv_wonder_ceremony|E]: 배터리가 장착되어 있습니다."
 TV_WONDER_CEREMONY_S5_DESC_163:0 "무거운 대포는 성벽을 따라 제자리에 고정되어 있으며 총구는 좁은 수로를 건너 반대편 해안을 향해 훈련되어 있습니다. 안전을 위해 화약 탄창이 탑 아래 깊숙이 파져 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_163:0 "나는 성벽에 윈치된 대형 대포를 명령합니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_163:0 "윈치가 여전히 떨어집니다. 총은 아래 상자에 남아 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_163:0 "@tv_ceremony_soldiers!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_163:0 "#Y 진행 중#! — #high 주둔군이 훈련을 받고 있습니다.#!\n#F 포수와 군인 모두 훈련이 낭비 없이 진행될 때까지 대포의 장전 및 발사 연습을 합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_163:0 "#G 완료#! — #high 주둔군이 훈련을 받았습니다.#!\n#F 포수와 군인 모두 훈련이 낭비 없이 진행될 때까지 대포의 장전 및 발사 연습을 합니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_163:0 "[tv_wonder_ceremony|E]: 주둔군이 훈련을 받았습니다."
 TV_WONDER_CEREMONY_S6_DESC_163:0 "포수와 군인 모두가 헛된 동작 없이 훈련이 진행될 때까지 대형 총의 장전과 발사를 연습합니다. 전투 갤리선이 근처에 정박하여 실제 목표에 대해 포대의 범위를 테스트합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_163:0 "포수와 병사들은 총 장전이 오류 없이 실행될 때까지 훈련합니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_163:0 "북소리가 다시 울릴 때까지 수비대에게 한 달 더 휴식을 허락하겠습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_163:0 "@tv_ceremony_navy_strength!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_163:0 "#Y 진행 중#! — #high A 함대가 총을 테스트합니다.#!\n#F 적군 함대가 해협을 조사한 후 연기와 철의 장막 아래로 밀려나며 요새가 완성되기도 전에 그 가치를 입증합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_163:0 "#G 완료#! — #high A 함대가 총을 테스트합니다#!\n#F 적군 편대가 해협을 조사한 후 연기와 철의 장막 아래로 밀려나며 요새가 완성되기 전에 그 가치를 입증합니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_163:0 "[tv_wonder_ceremony|E]: 함대가 총을 테스트합니다"
 TV_WONDER_CEREMONY_S7_DESC_163:0 "적 함대는 해협을 조사한 후 연기와 철의 장막 아래로 쫓겨나며 요새가 완성되기도 전에 그 가치를 입증합니다. 대포의 함성이 며칠 안에 수도에 도달합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_163:0 "포대는 연기와 철로 적 편대에 응답합니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_163:0 "성급한 불발보다는 조용한 총이 더 좋습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_163:0 "@tv_ceremony_control!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_163:0 "#Y 진행 중#! — #high 해협은 봉쇄되었습니다.#!\n#F 양쪽 해안의 포대는 이제 완전하게 유지되었으며, 이들의 총은 협소한 지역을 감히 통과하는 모든 함선을 지휘합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_163:0 "#G 완료#! — #high 해협은 봉쇄되었습니다.#!\n#F 양쪽 해안의 포대는 이제 완전하게 상태를 유지하고 있으며, 이들의 총은 협소한 지역을 감히 통과하는 모든 함선을 지휘합니다.#!"
 TV_WONDER_CEREMONY_S8_TITLE_163:0 "[tv_wonder_ceremony|E]：해협은 봉쇄되었습니다"
 TV_WONDER_CEREMONY_S8_DESC_163:0 "이제 양쪽 해안의 포대는 완전하게 유지되었으며, 포대는 좁은 해협을 감히 통과하는 모든 함선을 지휘합니다. 그 어떤 함대도 비용을 고려하지 않고 다다넬스 해협을 다시 건너지 못하며 이를 위해 해군의 규율은 더욱 강화되었습니다.\n\n#weak 행사를 완료하려면 필요한 대가를 지불하세요. 결과적으로 불가사의의 최종 건물이 세워질 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_163:0 "나는 해협이 봉쇄되고 요새가 완성되었음을 선언합니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_163:0 "최종 선언문은 그대로 유지됩니다. 해협은 한 시즌을 더 기다립니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_164:0 "@tv_ceremony_ruler!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_164:0 "#Y 진행 중#! — #high A 성 캉틴 이후의 왕의 서약#!\n#F 필립 2세는 성 캉탱에서의 승리에 대한 감사의 표시로 성 로렌스에게 수도원, 궁전, 왕릉을 동시에 겸할 것을 맹세합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_164:0 "#G Completed#! — #high A Saint Quentin 이후 왕의 서약#!\n#F Philip 2세는 Saint Quentin에서의 승리에 대한 감사의 표시로 Saint Lawrence에게 수도원, 궁전 및 왕릉을 동시에 사용하도록 맹세합니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_164:0 "[tv_wonder_ceremony|E]：성 쿠엔틴 이후의 왕의 맹세"
 TV_WONDER_CEREMONY_S1_DESC_164:0 "필리프 2세는 생캉탱에서의 승리에 대한 감사의 표시로 성 로렌스에게 수도원이자 궁전이자 왕릉이 될 수도원을 건립할 것을 맹세합니다. 같은 주에 법원 서기가 헌장 초안 작성을 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 비용을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_164:0 "나는 Saint Quentin의 승리에 대한 감사의 마음으로 이 수도원을 Saint Lawrence에게 맹세합니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_164:0 "법원 서기들은 깃펜을 따로 보관해 두었습니다. 서약은 한동안 무언의 상태로 남아 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_164:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_164:0 "#Y 진행 중#! — #high 시에라 유적지가 선택되었습니다#!\n#F 왕실 측량사는 왕의 취향에 맞춰 엄격한 돌 경사면의 무게를 측정하면서 시에라 데 과다라마(Sierra de Guadarrama)의 산기슭을 올라갑니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_164:0 "#G 완료#! — #high 시에라 지역이 선택되었습니다#!\n#F 왕실 측량사는 왕의 취향에 맞춰 엄격한 돌 경사면의 무게를 측정하면서 시에라 데 과다라마(Sierra de Guadarrama)의 산기슭을 올라갑니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_164:0 "[tv_wonder_ceremony|E]：시에라 사이트가 선택되었습니다"
 TV_WONDER_CEREMONY_S2_DESC_164:0 "왕실 측량사들은 시에라 데 과다라마(Sierra de Guadarrama) 산기슭에 올라 왕의 소박한 취향과 엄격한 돌 경사면의 무게를 비교합니다. 엘 에스코리알(El Escorial)이라는 작은 마을에서 그 이름이 유래되었습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_164:0 "측량사는 선택한 경사면에 말뚝을 심습니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_164:0 "우리는 이 돌밭이 영광을 받을 자격이 있는지 아직 확신하지 못합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_164:0 "@tv_ceremony_building_needs!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_164:0 "#Y 진행 중#! — #high 건축가와 화강암이 의뢰되었습니다#!\n#F 후안 바티스타 데 톨레도가 계획 초안을 작성하기 위해 소환되었으며, 왕이 요구하는 회색 화강암을 공급하기 위해 근처 채석장이 열립니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_164:0 "#G 완료#! — #high 건축가와 화강암이 의뢰됨#!\n#F 후안 바티스타 데 톨레도가 계획 초안을 작성하기 위해 소환되었으며, 왕이 요구하는 회색 화강암을 공급하기 위해 근처 채석장이 열립니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_164:0 "[tv_wonder_ceremony|E]: 건축가와 화강암이 의뢰됨"
 TV_WONDER_CEREMONY_S3_DESC_164:0 "Juan Bautista de Toledo는 계획 초안을 작성하기 위해 소환되었으며 왕이 요구하는 회색 화강암을 공급하기 위해 근처 채석장을 열었습니다. 석공과 승려 모두 그들 모두보다 오래 지속될 프로젝트를 위해 모집됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_164:0 "Juan Bautista de Toledo는 자신의 계획을 펼치고 채석장은 작업에 착수합니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_164:0 "채석공들은 한가롭게 기다리고 있다. 계획은 롤링되고 서명되지 않은 상태로 유지됩니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_164:0 "@tv_ceremony_building_default!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_164:0 "#Y 진행 중#! — #high 기초석이 놓였습니다#!\n#F 왕이 직접 첫 번째 화강암 블록을 놓았고 선택한 경사면을 따라 회색 돌 코스가 솟아오르기 시작했습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_164:0 "#G 완료#! — #high 기초석이 놓였습니다#!\n#F 왕이 직접 첫 번째 화강암 블록을 놓았고 선택한 경사면을 따라 회색 돌 코스가 솟아오르기 시작했습니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_164:0 "[tv_wonder_ceremony|E]：기초석이 놓이다"
 TV_WONDER_CEREMONY_S4_DESC_164:0 "왕이 직접 첫 번째 화강암 블록을 놓았고 선택한 경사면을 따라 회색 돌 코스가 솟아오르기 시작했습니다. 지금까지의 계획과 채석된 바위가 마침내 수도원의 진정한 기반이 됩니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_164:0 "드디어 첫 번째 돌이 세팅되었습니다!"
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_164:0 "석공들은 도구에 기대어 있고, 경사면은 한동안 그대로 남아 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_164:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_164:0 "#Y 진행 중#! — #high 성당의 돔 모양이 변하다#!\n#F 대성당은 안뜰 중심부에 우뚝 솟아 있으며, 돔 등반 코스는 주변 회랑 위로 올라갑니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_164:0 "#G 완료#! — #high 바실리카 돔의 모양#!\n#F 대성당은 안뜰 중심부에 우뚝 솟아 있으며, 돔 등반 코스는 주변 회랑 위로 올라갑니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_164:0 "[tv_wonder_ceremony|E]: 대성당 돔의 형태가 바뀌다"
 TV_WONDER_CEREMONY_S5_DESC_164:0 "거대한 대성당은 안뜰의 중심에 우뚝 솟아 있으며, 돔은 주변 회랑 위로 코스를 따라 올라갑니다. 노동자들은 새벽부터 황혼까지 계곡 전체가 끌 소리로 울린다고 말합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_164:0 "코스별로 돔은 회랑 위로 올라갑니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_164:0 "아직은 아닙니다. 끌을 쉬게 하세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S6_164:0 "@tv_ceremony_literacy!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_164:0 "#Y 진행 중#! — #high 왕립 도서관이 채워집니다.#!\n#F 권역 너머에서 책이 들어오면서 새 도서관 홀의 선반이 올라가고, 승려들의 방은 근처의 조용한 복도에 늘어서 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_164:0 "#G 완료#! — #high 왕립 도서관이 채워집니다.#!\n#F 책이 왕국 전역과 그 너머에서 유입됨에 따라 새 도서관 홀의 선반이 올라가고, 승려들의 방은 근처의 조용한 복도에 늘어서 있습니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_164:0 "[tv_wonder_ceremony|E]：왕립 도서관이 가득 찼습니다."
 TV_WONDER_CEREMONY_S6_DESC_164:0 "왕국 전역과 그 너머에서 책이 반입됨에 따라 새 도서관 홀의 선반이 올라가고, 근처의 조용한 복도에는 승려들의 감방이 늘어서 있습니다. 왕은 자리에 적합한 책을 선택하면서 직접 서가를 걷는다고 합니다.\n\n#weak 의례를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_164:0 "포터들은 여러 권의 상자를 새 홀로 운반합니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_164:0 "책이 도착하기 전에 가득 찬 금고를 기다리고 있는 선반은 맨손으로 서 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_164:0 "@tv_ceremony_death!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_164:0 "#Y 진행 중#! — #high 아래에 판테온이 준비되어 있습니다.#!\n#F 대성당 아래 깊은 곳에 석공들이 왕의 조상과 후손들이 언젠가 안식할 왕실 판테온을 조각했습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_164:0 "#G 완료#! — #high 아래 판테온이 준비되었습니다.#!\n#F 대성당 아래 깊은 곳에 석공들이 왕의 조상과 후손들이 언젠가 안식할 왕실 판테온을 조각했습니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_164:0 "[tv_wonder_ceremony|E]：판테온은 아래에서 준비됩니다"
 TV_WONDER_CEREMONY_S7_DESC_164:0 "대성당 아래 깊은 곳에 석공들이 언젠가 왕의 조상과 후손들이 안식할 왕실 만신전을 조각합니다. 마치 건물 전체가 허영심 자체를 견디기 위해 지어진 것처럼 위의 모든 곳에서 긴축이 시행됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_164:0 "그러니 판테온을 조각하게 해주세요!"
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_164:0 "석공들은 끌을 내려놓았다. 아래의 금고는 다듬지 않은 돌로 남아 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_164:0 "@tv_ceremony_legitimacy!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_164:0 "#Y 진행 중#! — #high 엘 에스코리알이 봉헌되었습니다#!\n#F 수도원-궁전은 마침내 완성되었으며, 종소리가 처음으로 안뜰을 통해 울리자 시에라 하늘을 배경으로 엄숙한 화강암 벽이 솟아올랐습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_164:0 "#G 완료#! — #high 엘 에스코리알이 봉헌되었습니다#!\n#F 수도원-궁전은 마침내 완성되었으며, 종소리가 처음으로 안뜰을 통해 울리자 시에라 하늘을 배경으로 엄숙한 화강암 벽이 솟아올랐습니다.#!"
 TV_WONDER_CEREMONY_S8_TITLE_164:0 "[tv_wonder_ceremony|E]：엘 에스코리알이 봉헌되다"
 TV_WONDER_CEREMONY_S8_DESC_164:0 "마침내 수도원 겸 궁전이 완성되었고, 종소리가 처음으로 안뜰을 통해 울려 퍼지면서 시에라 하늘을 배경으로 엄숙한 화강암 벽이 솟아올랐습니다. 왕은 조용히 통치하기 위해 이곳으로 후퇴하고, 그의 왕좌는 돌 자체에서 더욱 확고한 정당성을 끌어냅니다.\n\n#weak 의식을 완료하는 데 필요한 대가를 지불하세요. 결과적으로 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_164:0 "수도원 궁전이 마침내 봉헌되자 종소리가 안뜰을 통해 울립니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_164:0 "아직은 아닙니다. 종소리를 기다리세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S1_165:0 "@tv_ceremony_law!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_165:0 "#Y 진행 중#! — #high 왕관은 톨레도에게 헌장을 부여합니다#!\n#F A 왕실 헌장은 톨레도 대장장이를 왕관의 공식 갑옷 제작자로 지정하며, 그들의 강철은 모든 일반 칼날과 구별됩니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_165:0 "#G 완료#! — #high 왕관은 톨레도에 헌장을 부여합니다#!\n#F A 왕실 헌장은 톨레도 대장장이를 왕관의 공식 갑옷 제작자로 지정하며, 그들의 강철은 모든 일반 칼날과 구별됩니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_165:0 "[tv_wonder_ceremony|E]：왕관이 톨레도에 헌장을 부여하다"
 TV_WONDER_CEREMONY_S1_DESC_165:0 "왕실 헌장은 톨레도의 대장장이를 왕관의 공식 갑옷 제작자로 지정하며, 그들의 강철은 모든 일반 칼날과 구별되도록 표시됩니다. 검 대장장이들이 도시의 알칼데 앞에 모여 보조금이 낭독되는 것을 듣습니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_165:0 "알칼데는 왕실 헌장을 펼치고 톨레도의 새로운 임무를 큰 소리로 읽습니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_165:0 "아직은 아닙니다!"
 TV_WONDER_CEREMONY_CARD_ICON_S2_165:0 "@tv_ceremony_river!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_165:0 "#Y 진행 중#! — #high 타구스 협곡을 따라 있는 작업장#!\n#F 빠른 물이 단조 풀무와 연삭 바퀴를 돌릴 수 있는 타구스 협곡을 따라 사이트가 표시되어 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_165:0 "#G 완료#! — #high 타구스 협곡을 따라 있는 작업장#!\n#F 빠른 물이 단조 풀무와 연삭 바퀴를 돌릴 수 있는 타구스 협곡을 따라 사이트가 표시되어 있습니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_165:0 "[tv_wonder_ceremony|E]：타구스 협곡의 작업장"
 TV_WONDER_CEREMONY_S2_DESC_165:0 "빠른 물이 단조 풀무와 연삭 휠을 돌릴 수 있는 사이트가 타구스 협곡을 따라 표시되어 있습니다. 오래된 대장장이 구역은 왕관의 새로운 작업장을 위한 공간으로 확장되었습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 비용을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_165:0 "우리는 왕관의 새로운 작업장을 위해 이 타구스 강둑을 표시합니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_165:0 "측량사는 지금은 강둑 표시를 설정하지 않은 상태로 둡니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_165:0 "@tv_ceremony_building_needs!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_165:0 "#Y 진행 중#! — #high 광석과 마스터 스미스 도착#!\n#F 철광석은 산 광산에서 운반되며, 유명한 대장장이들은 왕실의 후원을 약속받으며 왕국 전역에서 톨레도로 끌려옵니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_165:0 "#G 완료#! — #high 광석과 마스터 스미스 도착#!\n#F 철광석은 산 광산에서 운반되며, 유명한 대장장이들은 왕실 후원을 약속받으며 왕국 전역에서 톨레도로 끌려옵니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_165:0 "[tv_wonder_ceremony|E]：광석과 마스터 스미스 도착"
 TV_WONDER_CEREMONY_S3_DESC_165:0 "철광석은 산악 광산에서 운반되고, 유명한 대장장이들은 왕실의 후원을 약속받으며 왕국 전역에서 톨레도로 끌려옵니다. 새로운 대장간 홀에는 물레방아가 장착되어 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_165:0 "좋은 강철은 대장간에서 주인을 찾습니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_165:0 "아직 대장장이를 소환할 준비가 되지 않았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_165:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_165:0 "#Y 진행 중#! — #high 포지 홀이 세워졌습니다.#!\n#F 첫 번째 포지 홀과 모든 블레이드가 테스트되는 인접한 교정장 주변에 돌담이 솟아 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_165:0 "#G 완료#! — #high 포지 홀이 세워졌습니다.#!\n#F 첫 번째 포지 홀과 모든 블레이드가 테스트되는 인접한 교정장 주변에 돌담이 솟아 있습니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_165:0 "[tv_wonder_ceremony|E]: 대장간 홀이 세워졌습니다"
 TV_WONDER_CEREMONY_S4_DESC_165:0 "첫 번째 대장간 홀과 모든 칼날이 테스트되는 인접한 교정장 주변에 돌담이 솟아 있습니다. 지금까지 전세와 수집된 광석이었던 것이 이제 실제 모루를 치는 망치가 됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_165:0 "메이슨은 대기 교정장 주변의 대장간 벽을 높입니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_165:0 "그렇게 빠르지는 않아요!"
 TV_WONDER_CEREMONY_CARD_ICON_S5_165:0 "@tv_ceremony_army_tradition!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_165:0 "#Y 진행 중#! — #high 담금질의 비밀이 완성되었습니다#!\n#F 스미스는 칼날 강철을 담금질하고 담금질하는 정확한 방법을 지키고 있으며 이 기술은 마스터에게서 선택된 견습생에게만 전달됩니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_165:0 "#G 완료#! — #high 담금질의 비밀이 완성되었습니다#!\n#F 스미스는 칼날 강철을 템퍼링 및 담금질하는 정확한 방법을 지키고 이 기술은 마스터에게서 선택된 견습생에게만 전달됩니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_165:0 "[tv_wonder_ceremony|E]:완화되는 냉각의 비밀"
 TV_WONDER_CEREMONY_S5_DESC_165:0 "Smiths는 칼날 강철을 담금질하고 담금질하는 정확한 방법을 지키고 마스터로부터 선택된 견습생에게만 기술을 전달합니다. 톨레도의 블레이드는 모든 경쟁 작업장을 능가하는 명성을 얻기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_165:0 "우리는 힘들게 얻은 이 비밀을 가장 가치 있는 견습생에게만 맡깁니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_165:0 "주인들은 그들의 비밀을 좀 더 오랫동안 지켜냅니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_165:0 "@tv_ceremony_control!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_165:0 "#Y 진행 중#! — #high 모든 블레이드는 프루프를 향합니다.#!\n#F 검사관은 완성된 각 블레이드를 교정 마당의 블록에 구부리고, 갈라지거나 똑바로 튀어나오지 못하는 블레이드는 부서지고 다시 녹습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_165:0 "#G 완성#! — #high 모든 블레이드가 프루프를 향함#!\n#F 검사관은 완성된 각 블레이드를 교정 마당의 블록에 구부리며 균열이 있거나 똑바로 튀어나오지 못하는 블레이드는 부서지고 다시 녹습니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_165:0 "[tv_wonder_ceremony|E]: 모든 블레이드는 증명에 직면합니다"
 TV_WONDER_CEREMONY_S6_DESC_165:0 "검사관은 완성된 각 칼날을 교정 마당에 있는 블록에 대고 구부립니다. 갈라지거나 똑바로 튀어나오지 못하는 칼날은 부서지고 다시 녹입니다. 통과한 블레이드만 무기고 선반에 걸려 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_165:0 "테스트되지 않은 블레이드는 신뢰할 수 없는 블레이드입니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_165:0 "나는 칼날에 대한 시험을 조금 더 길게 할 것입니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_165:0 "@tv_ceremony_demand!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_165:0 "#Y 진행 중#! — #high 멀리 떨어진 캠페인에서 주문이 도착합니다.#!\n#F 톨레도에서 멀리 떨어진 군대의 긴급 요청으로 인해 작업장은 평소 속도를 넘어서고 대장장이들은 할당량을 충족하기 위해 밤새도록 일합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_165:0 "#G 완료#! — #high 멀리 떨어진 캠페인에서 주문이 도착합니다.#!\n#F 톨레도에서 멀리 떨어진 군대의 긴급 요청으로 인해 작업장은 평소 속도를 넘어서고 대장장이들은 할당량을 충족하기 위해 밤새워 일합니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_165:0 "[tv_wonder_ceremony|E]：먼 캠페인에서 주문이 도착했습니다."
 TV_WONDER_CEREMONY_S7_DESC_165:0 "톨레도에서 멀리 떨어진 군대의 긴급 요청으로 인해 작업장은 평소보다 더 지치게 되었고, 대장장이들은 할당량을 채우기 위해 밤새도록 일합니다. 견습생들은 대장간에서 일찌감치 본격적인 임무를 수행하게 됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_165:0 "Smiths는 군대의 긴급 명령을 이행하기 위해 밤새도록 일합니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_165:0 "서두르면 좋은 칼날이 없습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_165:0 "@tv_ceremony_army_strength!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_165:0 "#Y 진행 중#! — #high 톨레도 강철이 왕국을 무장하다#!\n#F 무기고는 이제 본격적으로 생산되고 있으며, 그 칼날과 갑옷은 궁정에서 모닥불까지 왕국 전역에서 유명합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_165:0 "#G 완료#! — #high Toledo Steel이 왕국을 무장합니다#!\n#F 무기고는 이제 본격적으로 생산되고 있으며, 무기고의 칼날과 갑옷은 법정에서 캠프파이어까지 왕국 전역에서 유명합니다.#!"
 TV_WONDER_CEREMONY_S8_TITLE_165:0 "[tv_wonder_ceremony|E]: 톨레도 강철이 영역을 무장합니다"
 TV_WONDER_CEREMONY_S8_DESC_165:0 "이제 무기고는 본격적으로 생산되고 있으며, 그 칼날과 갑옷은 궁정에서 모닥불까지 왕국 전역에서 유명해졌습니다. 톨레도 강철을 운반하는 모든 연대는 더욱 강력한 우위와 그 뒤에 있는 더 깊은 예비군을 바탕으로 전투를 벌입니다.\n\n#weak 행사를 완료하는 데 필요한 대가를 지불하세요. 결과적으로 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_165:0 "우리는 톨레도의 강철이 왕국 전체를 무장할 준비가 되었음을 선언합니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_165:0 "무기고의 선반은 준비되어 왕관의 명령을 기다리고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_166:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_166:0 "#Y 진행 중#! — #high 사도로 가는 길이 선포됨#!\n#F 주교와 왕관이 함께 콤포스텔라에 있는 성 야고보 성지로 가는 순례의 길을 선포합니다. 이 길은 걷고자 하는 모든 영혼에게 열려 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_166:0 "#G 완료#! — #high 사도로 가는 길은 선포됩니다#!\n#F 주교와 왕관은 함께 콤포스텔라에 있는 성 야고보 성지로 가는 순례의 길을 선포하며, 걷고자 하는 모든 영혼에게 열려 있습니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_166:0 "[tv_wonder_ceremony|E]：사도에게 이르는 길을 선포하다"
 TV_WONDER_CEREMONY_S1_DESC_166:0 "주교와 왕관은 함께 콤포스텔라에 있는 성 야고보 성지로 가는 순례의 길을 선포합니다. 이 길은 걷고자 하는 모든 영혼에게 열려 있습니다. 선언문의 소문은 순례자들보다 더 빨리 퍼집니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_166:0 "우리는 사도에게 이 길을 기꺼이 걷고자 하는 모든 영혼에게 열려 있음을 선포합니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_166:0 "법원은 보류하고 선언문은 더 상서로운 날을 기다립니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_166:0 "@tv_ceremony_holy_site!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_166:0 "#Y 진행 중#! — #high Waypoints가 축복받았습니다#!\n#F 사제들은 갈리시아의 푸른 언덕을 지나 미래의 길을 걷고, 언젠가 순례자들을 앞으로 안내할 축복의 교차로, 여울목, 휴게소를 걷습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_166:0 "#G 완료#! — #high Waypoints는 축복받았습니다#!\n#F 사제들은 갈리시아의 푸른 언덕을 지나 미래의 길을 걷고, 언젠가 순례자들을 앞으로 안내할 축복의 교차로, 여울목, 휴게소를 걷습니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_166:0 "[tv_wonder_ceremony|E]：웨이포인트가 축복받았습니다"
 TV_WONDER_CEREMONY_S2_DESC_166:0 "사제들은 갈리시아의 푸른 언덕, 축복의 교차로, 여울목, 언젠가 순례자들을 앞으로 안내할 휴식처를 통해 미래의 길을 걷습니다. 길을 따라 있는 마을들은 가리비 껍질로 길을 표시하기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_166:0 "성직자들은 언덕을 걷고 길을 따라가는 모든 교차로를 축복합니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_166:0 "우리는 아직 제사장들을 길로 보낼 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_166:0 "@tv_ceremony_paved_road!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_166:0 "#Y 진행 중#! — #high 교량 및 호스피스 계획됨#!\n#F 수도원 명령과 지역 길드는 부풀어 오른 강과 호스피스 위에 지친 사람들을 보호하기 위해 다리를 놓을 돌과 목재를 약속합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_166:0 "#G 완료#! — #high 교량 및 호스피스 계획됨#!\n#F 수도원 명령과 지역 길드는 부풀어 오른 강과 호스피스 위에 지친 사람들을 보호하기 위해 다리를 놓을 돌과 목재를 약속합니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_166:0 "[tv_wonder_ceremony|E]：교량 및 호스피스 건설 예정"
 TV_WONDER_CEREMONY_S3_DESC_166:0 "수도원과 지역 길드는 불어난 강 위에 다리를 놓을 돌과 목재와 지친 사람들을 보호할 요양소를 약속합니다. 비가 그치면 바로 작업을 시작하기로 메이슨 계약이 체결되었습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_166:0 "명령은 돌과 목재를 담보로 삼고 석공은 계약을 맺습니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_166:0 "길드는 서약을 보류하고 석공은 한 시즌 더 유휴 상태로 기다립니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_166:0 "@tv_ceremony_river!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_166:0 "#Y 진행 중#! — #high 강을 가로지르는 최초의 다리#!\n#F 돌 아치가 마침내 갈리시아의 강 위에 솟아오르고 길을 따라 최초의 길가 신사가 세워졌습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_166:0 "#G 완료#! — #high 강을 가로지르는 최초의 다리#!\n#F 돌 아치가 마침내 갈리시아의 강 위로 솟아오르고 길을 따라 최초의 길가 신사가 세워졌습니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_166:0 "[tv_wonder_ceremony|E]：강을 가로지르는 최초의 다리"
 TV_WONDER_CEREMONY_S4_DESC_166:0 "마침내 갈리시아의 강 위로 돌 아치가 솟아오르고, 길가에 최초의 신전이 세워졌습니다. 지금까지의 축복과 서약이 이제는 순례자들이 실제로 끝에서 끝까지 걸을 수 있는 길이 되었습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_166:0 "마침내 강을 건넜다!"
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_166:0 "석공들이 도구를 낮추고 강은 한동안 건너지 않은 채로 남아 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_166:0 "@tv_ceremony_food!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_166:0 "#Y 진행 중#! — #high 호스텔은 매일매일 상승합니다#!\n#F 호스피스와 호스텔은 하루의 정직한 걷기에 맞는 간격으로 지어지며, 각 호스텔에는 빵과 물, 아픈 발을 쉴 수 있는 장소가 갖춰져 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_166:0 "#G 완료#! — #high 호스텔은 매일매일 상승합니다#!\n#F 호스피스와 호스텔은 하루의 정직한 산책에 맞는 간격으로 지어지며, 각 호스텔에는 빵과 물, 아픈 발을 쉴 수 있는 장소가 갖춰져 있습니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_166:0 "[tv_wonder_ceremony|E]：호스텔은 하루가 끝날 때마다 일어납니다."
 TV_WONDER_CEREMONY_S5_DESC_166:0 "호스피스와 호스텔은 하루의 정직한 산책에 맞는 간격으로 지어지며, 각각 빵과 물, 아픈 발을 쉴 수 있는 장소가 갖춰져 있습니다. 각 정류장에 있는 승려들은 낡은 부츠만으로도 돌아오는 순례자들을 알아보는 법을 배웁니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_166:0 "매일 산책이 끝나면 호스텔이 생기고, 각 호스텔에는 빵과 물이 준비됩니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_166:0 "우리는 아직 매장을 오픈할 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_166:0 "@tv_ceremony_building_levels!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_166:0 "#Y 진행 중#! — #high 성당의 탑이 솟아오른다#!\n#F 여행이 끝나면 길에서 지친 여행객을 맞이하기 위해 콤포스텔라 대성당의 탑이 도시 위로 솟아오릅니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_166:0 "#G 완료#! — #high 성당의 탑이 솟아오른다#!\n#F 여행이 끝나면 길에서 지친 여행객을 맞이하기 위해 콤포스텔라 대성당의 탑이 도시 위로 솟아오릅니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_166:0 "[tv_wonder_ceremony|E]:성당의 탑이 솟아오른다"
 TV_WONDER_CEREMONY_S6_DESC_166:0 "여행이 끝나면 콤포스텔라 대성당의 탑이 도시 위로 올라가 길에서 지친 여행객을 맞이합니다. 쌍둥이 첨탑의 광경만으로도 걷는 길이만큼 가치가 있다는 소문이 퍼졌습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_166:0 "쌍둥이 타워는 문 바로 앞에 보이는 콤포스텔라 위로 올라갑니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_166:0 "석공들은 잠시 멈추고 탑은 하늘을 향해 반쯤 솟아오른 채로 남아 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_166:0 "@tv_ceremony_population!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_166:0 "#Y 진행 중#! — #high 순례자들의 홍수#!\n#F 신사의 기적에 대한 이야기는 대륙 전역에 퍼져 있고 가리비 껍질은 갈리시아에서 가장 먼 왕국까지 인정받는 배지가 됩니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_166:0 "#G 완료#! — #high 순례자들이 길을 휩쓸다#!\n#F 신사의 기적에 대한 이야기는 대륙 전역에 퍼져 있고, 가리비 껍질은 갈리시아에서 가장 먼 왕국까지 인정받는 휘장이 됩니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_166:0 "[tv_wonder_ceremony|E]：순례자들이 도로에 범람함"
 TV_WONDER_CEREMONY_S7_DESC_166:0 "신전의 기적에 관한 이야기는 대륙 전역으로 퍼져나가고, 가리비 껍데기는 갈리시아에서부터 먼 왕국까지 인정받는 휘장이 됩니다. 한때 반쯤 비어 있던 호스텔은 이제 침대가 부족하여 해질녘에 순례자들을 외면합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_166:0 "그들은 수천 명씩 옵니다!"
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_166:0 "길은 조금 더 조용해졌고, 이야기는 더 이상 퍼지지 않았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_166:0 "@tv_ceremony_prosperity!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_166:0 "#Y 진행 중#! — #high 까미노가 완성되었습니다#!\n#F 도로, 다리, 호스텔은 이제 첫 번째 웨이포인트부터 대성당 계단까지 완성되었으며 순례자들은 누구도 감히 예측할 수 없을 정도로 많이 도착하고 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_166:0 "#G 완료#! — #high 까미노 완성#!\n#F 도로, 다리, 호스텔은 이제 첫 번째 웨이포인트부터 대성당 계단까지 완성되었으며 순례자들은 누구도 감히 예측할 수 없을 정도로 많이 도착하고 있습니다.#!"
 TV_WONDER_CEREMONY_S8_TITLE_166:0 "[tv_wonder_ceremony|E]：카미노가 완성되었습니다"
 TV_WONDER_CEREMONY_S8_DESC_166:0 "도로, 다리, 호스텔은 이제 첫 번째 중간지점부터 대성당 계단까지 완성되었으며, 순례자들은 누구도 감히 예측할 수 없을 정도로 많은 수의 도착을 하고 있습니다. 그들의 헌신과 동전은 이제 도로가 닿는 모든 마을을 통해 꾸준히 흐르며 왕국의 신앙을 더욱 긴밀하게 결속시킵니다.\n\n#weak 행사를 완료하는 데 필요한 대가를 지불하세요. 결과적으로 불가사의의 마지막 건물이 세워질 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_166:0 "도로, 다리, 호스텔이 완성되고 마침내 모든 마을에 헌신이 흐릅니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_166:0 "아직은 아닙니다!"
 TV_WONDER_CEREMONY_CARD_ICON_S1_167:0 "@tv_ceremony_ruler!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_167:0 "#Y 진행 중#! — #high 헨리 왕자가 자신의 학교를 설립했습니다.#!\n#F 헨리 왕자는 바람이 휘몰아치는 사그레스 곶에 항해 학교를 선포하고 조종사, 지도 제작자, 천문학자를 자신의 대의로 모았습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_167:0 "#G 완료#! — #high 헨리 왕자가 자신의 학교를 설립했습니다#!\n#F 헨리 왕자는 바람이 휘몰아치는 사그레스 곶에 항해 학교를 선포하고 조종사, 지도 제작자, 천문학자들을 모아 그의 대의를 위해 모였습니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_167:0 "[tv_wonder_ceremony|E]: 헨리 왕자가 학교를 설립했습니다"
 TV_WONDER_CEREMONY_S1_DESC_167:0 "헨리 왕자는 바람이 휘몰아치는 사그레스 곶에 항해 학교를 선포하고 조종사, 지도 제작자, 천문학자들을 모아 자신의 목적을 위해 모였습니다. 법원은 왕자가 알려진 세계의 가장자리를 계획하고 있다고 속삭였습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_167:0 "왕자는 의회가 모이기 전에 설립된 항해 학교를 선포합니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_167:0 "아직은 아닙니다. 법원이 잠시만 더 속삭이도록 해주세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S2_167:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_167:0 "#Y 진행 중#! — #high 절벽 부지는 안전합니다.#!\n#F 건축가들은 대서양 바람이 모든 로프와 셔터를 테스트하는 것을 거의 멈추지 않는 라고스 근처 바다 절벽 꼭대기에 학교 운동장을 표시합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_167:0 "#G 완료#! — #high 절벽 부지는 안전합니다#!\n#F 건축가들은 대서양 바람이 모든 로프와 셔터를 테스트하는 것을 거의 멈추지 않는 라고스 근처 바다 절벽 꼭대기에 학교 운동장을 표시합니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_167:0 "[tv_wonder_ceremony|E]：절벽 사이트가 확보되었습니다"
 TV_WONDER_CEREMONY_S2_DESC_167:0 "건축가들은 대서양 바람이 모든 로프와 셔터 테스트를 거의 멈추지 않는 라고스 근처의 바다 절벽 꼭대기에 학교 운동장을 표시합니다. 해안의 어부들에게 해류와 폭풍에 대한 지식을 문의합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_167:0 "우리는 라고스 위의 바람이 휘몰아치는 이 절벽을 학교의 기초라고 주장합니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_167:0 "측량사는 철수하고 절벽은 표시되었지만 소유권이 주장되지 않은 채로 남겨졌습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_167:0 "@tv_ceremony_mapmode!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_167:0 "#Y 진행 중#! — #high 차트 및 장비가 수집됩니다#!\n#F 아스트롤라베, 포르톨란 차트, 별에 관한 논문은 모든 항구에서 수집되며, 일부는 구매되고 일부는 조용히 복사됩니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_167:0 "#G 완료#! — #high 차트 및 도구가 수집됩니다#!\n#F 아스트롤라베, 포르톨란 차트, 별에 관한 논문이 모든 항구에서 수집되며, 일부는 구매되고 일부는 조용히 복사됩니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_167:0 "[tv_wonder_ceremony|E]：차트와 도구가 수집됩니다"
 TV_WONDER_CEREMONY_S3_DESC_167:0 "아스트롤라베, 포르톨란 차트, 별에 관한 논문은 각 항구에서 수집되며, 일부는 구매되고 일부는 조용히 복사됩니다. 학자와 조종사 모두 왕자의 후원으로 사그레스로 이끌립니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_167:0 "마침내 차트가 Sagres에 수렴되었습니다!"
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_167:0 "이 컬렉션을 완성하기 전에 차트를 몇 개 더 수집하겠습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_167:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_167:0 "#Y 진행 중#! — #high 지도실이 건설되었습니다.#!\n#F 스톤메이슨은 끊임없는 대서양 바람에 맞서 최초의 지도실과 전망대 벽을 세웠습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_167:0 "#G 완료#! — #high 지도실이 건설되었습니다.#!\n#F Stonemasons는 끊임없는 대서양 바람에 맞서 최초의 지도실과 전망대 벽을 세웠습니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_167:0 "[tv_wonder_ceremony|E]: 지도실이 건설되었습니다"
 TV_WONDER_CEREMONY_S4_DESC_167:0 "석공들은 끊임없는 대서양 바람에 맞서 최초의 지도실과 전망대 벽을 세웠습니다. 지금까지 차트를 수집하고 학자를 초대했던 것이 마침내 절벽 위에 서 있는 실제 학교가 되었습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_167:0 "메이슨들은 끊임없는 대서양 바람에 맞서 지도실의 벽을 높였습니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_167:0 "아직은 아닙니다. 먼저 기초를 다져보세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S5_167:0 "@tv_ceremony_ship!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_167:0 "#Y 진행 중#! — #high 캐러벨이 개선되었습니다.#!\n#F 라고스의 선박 제작자들은 조종사가 각각의 새로운 항해에서 가져온 보고서를 바탕으로 선체와 돛 설계를 테스트하여 캐러벨을 대양에 적합한 선박으로 만들었습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_167:0 "#G 완료#! — #high 캐러벨이 개선되었습니다#!\n#F 라고스의 조선공은 조종사가 각각의 새로운 항해에서 가져온 보고서에 대해 선체와 돛 설계를 테스트하여 캐러벨을 개방형 선박에 적합한 형태로 만들었습니다. 바다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_167:0 "[tv_wonder_ceremony|E]: 캐러벨이 세련되었습니다"
 TV_WONDER_CEREMONY_S5_DESC_167:0 "라고스의 조선공들은 조종사가 각각의 새로운 항해에서 가져온 보고서에 기초하여 선체와 돛 설계를 테스트하여 범선을 대양에 적합한 선박으로 만듭니다. 실패한 모든 장비는 다음 시도에서 지킬 만한 가치가 있는 것을 가르쳐줍니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_167:0 "우리는 조선공들에게 캐러벨을 다시 한 번 다듬도록 의뢰했습니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_167:0 "조선공들은 도구를 한쪽으로 치워두었고, 선체는 아직 미완성이었습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_167:0 "@tv_ceremony_time!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_167:0 "#Y 진행 중#! — #high 조종사 별 배우기#!\n#F 천문학자들은 지도실에 모인 조종사들에게 추측 항법과 항성 항법을 가르치고, 선박이 신선한 해안선으로 돌아올 때마다 시즌마다 새로운 차트가 그려집니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_167:0 "#G 완료#! — #high 조종사 별 배우기#!\n#F 천문학자는 지도실에 모인 조종사에게 추측 항법과 항성 항법을 가르치고 선박이 신선한 해안선으로 돌아올 때마다 시즌마다 새로운 차트가 그려집니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_167:0 "[tv_wonder_ceremony|E]: 조종사가 별을 배우다"
 TV_WONDER_CEREMONY_S6_DESC_167:0 "천문학자들은 지도실에 모인 조종사들에게 추측 항법과 항성 항법을 가르치고, 선박이 신선한 해안선을 가지고 돌아올 때마다 시즌마다 새로운 차트가 그려집니다. 도서관은 수정된 지도로 가득 차 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_167:0 "별이 있으면 가장 보잘것없는 배라도 항구를 찾을 수 있습니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_167:0 "나는 조종사들이 별을 준비시켰다고 말하기 전에 잠시 동안 별을 연구하게 할 것입니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_167:0 "@tv_ceremony_navy_light_ship!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_167:0 "#Y 진행 중#! — #high 첫 번째 원정대가 항해를 시작했습니다.#!\n#F 캐러벨은 마침내 라고스에서 이전에 차트에 기록된 모든 해안을 지나 출발했고, 조종사는 사그레스에 아직 표시되지 않은 해안에 대한 보고를 가지고 돌아왔습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_167:0 "#G 완료#! — #high 첫 번째 탐험 세트 항해#!\n#F Caravels는 마침내 라고스에서 이전에 차트에 표시된 모든 해안을 지나 출발했으며 조종사는 Sagres에 아직 표시되지 않은 해안에 대한 보고를 가지고 돌아왔습니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_167:0 "[tv_wonder_ceremony|E]: 첫 번째 원정대가 항해를 시작합니다."
 TV_WONDER_CEREMONY_S7_DESC_167:0 "Caravels는 마침내 라고스에서 이전에 차트에 표시된 모든 해안을 지나서 출발하고 조종사는 Sagres의 지도에서 아직 표시되지 않은 해안에 대한 보고를 가지고 돌아옵니다. 돌아오는 각 배는 영웅처럼 부두에서 만납니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_167:0 "캐러벨이 출발하여 해안으로 향했지만 아직 해도가 표시되지 않습니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_167:0 "지도에 없는 무덤보다 알려진 해안이 더 좋습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_167:0 "@tv_ceremony_navy_tradition!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_167:0 "#Y 진행 중#! — #high Sagres가 세계의 해도실이 되다#!\n#F 이 학교는 이제 이 영역의 해양 지식, 조종사, 해도 및 선박이 꾸준히 지평선을 향해 나아가는 영역의 중심지로 우뚝 서 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_167:0 "#G 완료#! — #high Sagres가 세계 해도 방이 되다#!\n#F 이 학교는 이제 해양 지식, 조종사, 해도 및 선박이 꾸준히 지평선을 향해 나아가는 영역의 해양 지식 중심지로 우뚝 서 있습니다.#!"
 TV_WONDER_CEREMONY_S8_TITLE_167:0 "[tv_wonder_ceremony|E]：Sagres가 세계 차트 룸이 되다"
 TV_WONDER_CEREMONY_S8_DESC_167:0 "학교는 이제 이 영역의 해양 지식의 중심지로 우뚝 서 있으며, 조종사, 해도, 선박이 꾸준히 지평선을 향해 나아가고 있습니다. 이 해안에서 항해하는 모든 함대는 이제 세대를 거쳐 Sagres의 규율과 범위를 전달합니다.\n\n#weak 행사를 완료하는 데 필요한 가격을 지불하세요. 결과적으로 불가사의의 최종 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_167:0 "우리는 Sagres를 세계의 해도실이자 여러 세대에 걸쳐 지속되는 규율로 선언합니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_167:0 "학교의 종은 한동안 조용해지며, 그 유산은 아직 선포되지 않았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_168:0 "@tv_ceremony_government!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_168:0 "#Y 진행 중#! — #high 공이 무기고 건설을 명령하다#!\n#F 밀라노 공작은 외국의 대포와 강철 제조소에 의존하는 데 지친 공국 군대를 무장하기 위한 새로운 무기고를 선포했습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_168:0 "#G 완료#! — #high 공은 무기고를 명령합니다#!\n#F 밀라노 공작은 대포와 강철을 외국 주조 공장에 의존하는 데 지친 공국 군대를 무장하기 위한 새로운 무기고를 선포합니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_168:0 "[tv_wonder_ceremony|E]: 공작이 무기고 건설을 명령하다"
 TV_WONDER_CEREMONY_S1_DESC_168:0 "밀라노 공작은 대포와 강철을 외국 주조 공장에 의존하는 데 지친 공국 군대를 무장하기 위한 새로운 무기고를 선포합니다. 첫 번째 돌이 절단되기도 전에 선택한 땅 위에 공작 깃발이 걸려 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_168:0 "우리는 이를 선언합니다: 밀란은 자체 무기를 만들 것입니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_168:0 "선택된 땅은 기다리고 있지만 공작의 깃발은 그대로 펼쳐져 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_168:0 "@tv_ceremony_city!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_168:0 "#Y 진행 중#! — #high A 성벽 내의 현장#!\n#F 공무원들은 공국의 다른 무역을 방해하지 않고 주조소에서 물과 연료를 끌어올 수 있는 성벽 근처에 땅을 표시했습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_168:0 "#G 완료#! — #high A 성벽 내의 현장#!\n#F 공무원들은 공국의 다른 무역을 방해하지 않고 주조소에서 물과 연료를 끌어올 수 있는 성벽 근처에 땅을 표시했습니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_168:0 "[tv_wonder_ceremony|E]：벽 안의 사이트"
 TV_WONDER_CEREMONY_S2_DESC_168:0 "관리들은 공국의 다른 무역을 방해하지 않고 주조소에서 물과 연료를 끌어올 수 있는 성벽 근처에 땅을 표시했습니다. 다가오는 무기고를 위한 공간을 마련하기 위해 인근 작업장에 보상이 제공됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_168:0 "관리들은 땅을 표시하고 이웃의 빚을 정산합니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_168:0 "우리는 이웃의 무역을 근절할 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_168:0 "@tv_ceremony_building_needs!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_168:0 "#Y 진행 중#! — #high 광석, 청동 및 장인#!\n#F 철과 청동은 롬바르드 광산과 주조소에서 운반되며, 유명한 갑옷 제작자와 총기 제조자들은 공작의 후원으로 밀라노로 끌려갑니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_168:0 "#G 완료#! — #high 광석, 청동 및 장인#!\n#F 철과 청동은 롬바르드 광산과 그 너머의 주조소에서 운반되며, 유명한 갑옷 제작자와 총기 제조자들은 공작의 후원으로 밀라노로 끌려갑니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_168:0 "[tv_wonder_ceremony|E]：광석, 청동, 장인"
 TV_WONDER_CEREMONY_S3_DESC_168:0 "철과 청동은 롬바르드 광산과 그 너머의 주조 공장에서 운반되며, 유명한 갑옷 제작자와 총포 제조자들은 공작의 후원으로 밀라노로 끌려갑니다. 작업장 마당은 벽 하나가 세워지기 전에 원자재로 가득 차 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_168:0 "광석과 청동더미가 높이 쌓인 장인들이 공작의 부름에 응답합니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_168:0 "광석을 먼저 모으지 않고는 철을 만들 수 없습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_168:0 "@tv_ceremony_build_icon!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_168:0 "#Y 진행 중#! — #high 주조 홀 상승#!\n#F 돌담은 첫 번째 주조 홀과 인접한 드릴 안뜰 주변을 둘러싸고 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_168:0 "#G 완료#! — #high The Foundry Halls Rise#!\n#F 돌담은 첫 번째 주조 홀과 인접한 드릴 안뜰 주변을 둘러싸고 있습니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_168:0 "[tv_wonder_ceremony|E]: 파운드리 홀 상승"
 TV_WONDER_CEREMONY_S4_DESC_168:0 "첫 번째 주조 홀과 인접한 드릴 안뜰 주변에는 돌담이 솟아 있습니다. 지금까지 광석을 운반하고 장인을 모았으나 마침내 실제 모루를 향해 울리는 망치가 됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_168:0 "우리는 이 벽을 높입니다. 마침내 망치가 울리게 하라."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_168:0 "모아진 광석은 가만히 기다리고 있다. 아직 벽은 땅에서 올라가지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_168:0 "@tv_ceremony_cannons!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_168:0 "#Y 진행 중#! — #high 주조소에서 첫 번째 총을 주조했습니다.#!\n#F 녹은 청동이 처음으로 점토 주형에 부어지고 무기고의 초기 대포 통이 마당을 가로질러 줄지어 냉각됩니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_168:0 "#G 완료#! — #high 주조소에서 첫 번째 총을 주조했습니다.#!\n#F 녹은 청동이 처음으로 점토 주형에 부어지고 무기고의 초기 대포 배럴이 마당을 가로질러 줄지어 냉각됩니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_168:0 "[tv_wonder_ceremony|E]: 주조 공장이 첫 총을 던지다"
 TV_WONDER_CEREMONY_S5_DESC_168:0 "녹은 청동이 처음으로 점토 주형에 부어지고, 무기고의 초기 대포통이 마당을 가로질러 줄지어 냉각됩니다. 그에 맞춰 판금 갑옷 생산 규모가 인접한 홀에서 확장됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_168:0 "녹은 청동이 주형을 채우고 밀라노 최초의 대포통이 마당에서 시원해집니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_168:0 "우리는 그 시간이 오기 전에는 감히 그 청동을 부어서는 안 됩니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_168:0 "@tv_ceremony_control!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_168:0 "#Y 진행 중#! — #high 길드 표준 설정#!\n#F 장인 길드는 무기고 내에서 조직되어 생산되는 모든 칼날, 흉갑, 총신에 공통 표준을 적용합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_168:0 "#G 완료#! — #high Guilds 표준 설정#!\n#F 장인 길드는 무기고 내에서 조직되어 생산되는 모든 칼날, 흉갑, 총신에 공통 표준을 적용합니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_168:0 "[tv_wonder_ceremony|E]: 길드가 표준을 설정합니다"
 TV_WONDER_CEREMONY_S6_DESC_168:0 "무기고 내에서 장인 길드가 조직되어 생산되는 모든 검, 흉갑, 총신에 공통 표준을 적용합니다. 새로운 갑옷의 핏과 무게를 테스트하는 군인들이 매일 훈련장에서 울려 퍼집니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_168:0 "길드가 모여 이곳에서 제작된 모든 칼날과 총신에 대해 하나의 표준을 설정합니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_168:0 "길드 마스터들은 아직 기준이 정해지지 않은 채 대책에 대해 고민하고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_168:0 "@tv_ceremony_demand!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_168:0 "#Y 진행 중#! — #high 긴급 주문으로 작업장에 부담이 가해짐#!\n#F 밀라노에서 멀리 떨어진 캠페인에서 주조소와 작업장이 평소보다 빠른 속도로 진행되도록 긴급 요청을 보내고 견습생들은 공장과 함께 야간 근무를 하게 됩니다. 마스터.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_168:0 "#G 완료#! — #high 긴급 주문으로 마당에 부담이 가해짐#!\n#F 밀라노에서 멀리 떨어진 캠페인에서 주조소와 작업장이 평소보다 빠른 속도로 진행되도록 긴급 요청을 보냈고 견습생들은 공장과 함께 야간 교대 근무를 하게 되었습니다. 마스터.#!"
 TV_WONDER_CEREMONY_S7_TITLE_168:0 "[tv_wonder_ceremony|E]：긴급 주문으로 인해 마당에 부담이 가중됨"
 TV_WONDER_CEREMONY_S7_DESC_168:0 "밀라노에서 멀리 떨어진 캠페인에서는 파운드리와 작업장을 평소 속도보다 빠르게 밀어붙이는 긴급 요청을 보내고 견습생은 마스터와 함께 야간 근무를 하게 됩니다. 무기고는 짧은 시간 내에 전쟁에 대응할 수 있음을 증명합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_168:0 "우리는 전선의 부름에 응답합니다. 야간 근무를 시작하자."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_168:0 "청구서 두루마리는 열리지 않은 채로 쌓여 있습니다. 야간 근무 벨은 조용합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_168:0 "@tv_ceremony_army_strength!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_168:0 "#Y 진행 중#! — #high 밀라노 무기고 완성#!\n#F 무기고는 이제 최대 용량으로 가동되고 있으며, 대포, 갑옷, 그리고 이탈리아의 모든 코트에서 유명한 훈련된 장인들이 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_168:0 "#G 완료#! — #high 밀라노 무기고 완공#!\n#F 무기고는 이제 최대 용량으로 가동되고 있으며 대포, 갑옷, 훈련된 장인들은 이탈리아의 모든 코트에서 유명합니다.#!"
 TV_WONDER_CEREMONY_S8_TITLE_168:0 "[tv_wonder_ceremony|E]：밀라노 아스날이 완성되었습니다"
 TV_WONDER_CEREMONY_S8_DESC_168:0 "이제 무기고는 최대 용량으로 운영되고 있으며 대포, 갑옷, 훈련된 장인은 이탈리아의 모든 궁정에서 유명합니다. 이러한 작업장으로 무장한 모든 연대는 현장에서 더욱 안정적인 전선과 더욱 강력한 우위를 확보하기 위해 싸웁니다.\n\n#weak 행사를 완료하는 데 필요한 대가를 지불하세요. 결과적으로 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_168:0 "무기고는 최대 용량에 도달했으며 그 명성은 이탈리아의 모든 법원으로 퍼졌습니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_168:0 "우리는 아직 이 무기고를 완성했다고 부를 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_169:0 "@tv_ceremony_law!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_169:0 "#Y 진행 중#! — #high 코뮌이 헌장을 부여하다#!\n#F 볼로냐 영사는 법학자들에게 도시 성벽 내에서 자유롭게 가르치고 논쟁할 수 있는 권리를 부여하는 헌장에 도장을 찍었습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_169:0 "#G 완료#! — #high 코뮌은 헌장을 부여합니다#!\n#F 볼로냐 영사는 법학자들에게 도시 성벽 내에서 자유롭게 가르치고 논쟁할 수 있는 권리를 부여하는 헌장에 도장을 찍었습니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_169:0 "[tv_wonder_ceremony|E]：코뮌이 헌장을 부여하다"
 TV_WONDER_CEREMONY_S1_DESC_169:0 "볼로냐의 영사는 법학자들에게 도시 성벽 내에서 자유롭게 가르치고 논쟁할 수 있는 권리를 부여하는 헌장에 인장을 찍었습니다. 여행하는 학자들 사이에 새로운 스투디움이 형성되고 있다는 소문이 빠르게 퍼졌습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_169:0 "영사는 밀랍에 도장을 찍고, 헌장은 법으로 제정됩니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_169:0 "아직은 아닙니다. 먼저 잉크를 말리세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S2_169:0 "@tv_ceremony_characters!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_169:0 "#Y 진행 중#! — #high 학자들의 국가 집결#!\n#F 알프스 너머에서 도착한 학생들은 상호 보호와 목소리를 위해 국가를 조직하고 자신의 계급 중에서 총장을 선출합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_169:0 "#G 완료#! — #high 학자들의 국가 집결#!\n#F 알프스 너머에서 도착한 학생들은 상호 보호와 목소리를 위해 국가를 조직하고 자신의 계급 중에서 총장을 선출합니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_169:0 "[tv_wonder_ceremony|E]：학자들의 나라가 모이다"
 TV_WONDER_CEREMONY_S2_DESC_169:0 "알프스 너머에서 도착한 학생들은 상호 보호와 발언권을 위해 국가를 조직하고 자신의 계급 중에서 총장을 선출합니다. 오래된 로마 성벽을 따라 있는 집주인들은 방을 팔지 않고 임대하도록 설득됩니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_169:0 "국가들은 총장을 선출하고 함께 뭉칠 것을 맹세합니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_169:0 "집주인은 여전히 머뭇거리며 그렇게 빨리 임대할 생각이 없습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_169:0 "@tv_ceremony_diplomacy!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_169:0 "#Y 진행 중#! — #high 바르바로사의 보호가 요구됩니다#!\n#F 사절은 집에서 멀리 떨어져 있는 학자들의 안전한 통행을 보장하는 영장을 황제에게 청원합니다. 촌사람.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_169:0 "#G 완료#! — #high 바르바로사의 보호가 필요합니다#!\n#F 사절은 집에서 멀리 떨어져 있는 학자들의 안전한 통행을 보장하는 영장을 황제에게 청원합니다. 촌사람.#!"
 TV_WONDER_CEREMONY_S3_TITLE_169:0 "[tv_wonder_ceremony|E]：바르바로사의 보호를 요청합니다"
 TV_WONDER_CEREMONY_S3_DESC_169:0 "사절들은 집에서 멀리 떨어진 학자들의 안전한 통행을 보장하는 영장을 황제에게 청원하여 어떤 영주도 동포가 빚진 빚 때문에 학생을 붙잡을 수 없도록 합니다. 일단 부여된 특권은 여행하는 모든 사무원에 의해 복사되어 휴대됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_169:0 "황제의 인장이 마침내 확보되었습니다!"
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_169:0 "사절단은 청원서가 아직 발송되지 않은 채 법정에 머물고 있다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_169:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_169:0 "#Y 진행 중#! — #high 첫 번째 강의실이 솟아오릅니다.#!\n#F Masons는 아케이드 구역 근처의 적절한 스콜라, 목재 벤치 및 높은 강의대에서 착공하여 빌린 방에서 혼자 가르치기 위해 지어진 강당으로의 전환을 표시합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_169:0 "#G 완료#! — #high 첫 번째 강의실이 솟아오릅니다.#!\n#F Masons는 아케이드 구역 근처의 적절한 스콜라, 목재 벤치 및 높은 강의대에서 착공하여 빌린 방에서 혼자 가르치기 위해 지어진 홀로 전환했습니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_169:0 "[tv_wonder_ceremony|E]：제1강의실이 솟아오른다"
 TV_WONDER_CEREMONY_S4_DESC_169:0 "메이슨은 아케이드 구역 근처의 적절한 스콜라, 목재 벤치 및 빌린 방에서 혼자 가르치기 위해 지어진 홀로의 전환을 표시하는 높은 강연대를 착공했습니다. 글로스터들은 만족스러운 표정으로 기초를 지켜봅니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_169:0 "메이슨은 땅을 부수고 스콜라의 첫 번째 돌을 놓습니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_169:0 "아직은 아닙니다. 먼저 땅이 안정되게 하십시오!"
 TV_WONDER_CEREMONY_CARD_ICON_S5_169:0 "@tv_ceremony_paved_road!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_169:0 "#Y 진행 중#! — #high 주랑이 앞으로 뻗어 있습니다.#!\n#F 아케이드 현관은 거리별로 확장되어 숙박과 강의 사이에 원고 상자를 들고 다니는 학생들이 볼로냐의 비로부터 보호받을 수 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_169:0 "#G 완료#! — #high 앞으로 뻗어나가는 현관#!\n#F 아케이드 현관은 거리별로 확장되어 숙박과 강의 사이에 원고 케이스를 들고 다니는 학생들이 볼로냐의 비로부터 보호받을 수 있습니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_169:0 "[tv_wonder_ceremony|E]: 현관이 앞으로 뻗어 있습니다."
 TV_WONDER_CEREMONY_S5_DESC_169:0 "아케이드식 현관은 거리별로 확장되어 학생들이 숙소와 강의 사이에 원고 케이스를 들고 다닐 때 볼로냐의 비로부터 보호합니다. 길을 따라 상인들은 잉크, 양피지, 중고 법률 문서를 판매하기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_169:0 "우리는 스콜라의 문까지 현관을 확장하도록 명령했습니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_169:0 "석공들은 잠시 멈추고 주랑이 아직 반쯤 지어진 상태로 남아 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_169:0 "@tv_ceremony_writer!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_169:0 "#Y 진행 중#! — #high 광택 기록 보관소가 건설되었습니다.#!\n#F A 석조 기록 보관소는 로마법에 대한 축적된 주석을 보관하기 위해 세워졌으며, 의사의 명령에 따라 선반은 화재와 습기로부터 보호됩니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_169:0 "#G 완료#! — #high 광택 기록 보관소가 건설되었습니다.#!\n#F A 석조 기록 보관소는 누적된 로마법의 광택 기록을 보관하기 위해 세워졌으며, 의사의 명령에 따라 선반은 화재와 습기로부터 보호됩니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_169:0 "[tv_wonder_ceremony|E]：글로스 아카이브가 구축되었습니다"
 TV_WONDER_CEREMONY_S6_DESC_169:0 "로마법에 대한 축적된 주석을 보관하기 위해 석조 기록 보관소가 솟아 있으며, 의사의 명령에 따라 그 선반은 화재와 습기로부터 보호됩니다. 카피리스트는 새로운 원고에 대한 수요를 충족하기 위해 등불 옆에서 일합니다.\n\n#weak 행사를 다음 단계로 진행하는 데 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_169:0 "마침내 글로스에 집이 생겼습니다!"
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_169:0 "복사가는 펜을 내려놓고 아카이브는 아직 완성되지 않은 상태로 남아 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_169:0 "@tv_ceremony_parliament!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_169:0 "#Y 진행 중#! — #high 논쟁 탑이 왕관을 썼습니다.#!\n#F 스콜라가 내려다보이는 시민 타워에는 의사들이 공개 토론을 주재하는 발코니가 설치되어 있어 마을 사람들이 논쟁의 소리를 듣기 위해 모여듭니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_169:0 "#G 완료#! — #high 논쟁 탑이 왕관을 썼습니다#!\n#F 스콜라가 내려다보이는 시민 타워에는 의사들이 공개 토론을 주재하는 발코니가 장착되어 있어 많은 마을 사람들이 논쟁의 종소리를 듣기 위해 모여듭니다. 아웃.#!"
 TV_WONDER_CEREMONY_S7_TITLE_169:0 "[tv_wonder_ceremony|E]: 논쟁의 탑이 세워졌습니다"
 TV_WONDER_CEREMONY_S7_DESC_169:0 "스콜라가 내려다보이는 시민 타워에는 의사들이 공개 토론을 주재하는 발코니가 설치되어 있어 시민들이 논쟁의 종소리를 듣기 위해 군중을 끌어 모읍니다. 유명한 법학자가 그러한 높이에서 판결을 좌우했다고 합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_169:0 "메이슨은 의사들이 주재할 수 있는 발코니를 갖춘 타워를 장식합니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_169:0 "아직은 아닙니다. 군중이 조금 더 기다리도록 하십시오!"
 TV_WONDER_CEREMONY_CARD_ICON_S8_169:0 "@tv_ceremony_advance!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_169:0 "#Y 진행 중#! — #high 스투디움 제네랄레 선포#!\n#F 의사, 총장, 행정관들이 모여 볼로냐의 스튜디움을 비교할 수 없는 학교로 선포하고 졸업생들이 어디를 가든지 학위를 인정받을 수 있다고 선언합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_169:0 "#G 완료#! — #high 스투디움 제네랄레 선포#!\n#F 의사, 총장, 시민 치안판사가 모여 볼로냐의 스튜디움을 비교할 수 없는 학교로 선포하고 졸업생들이 여행하는 곳마다 학위를 인정합니다.#!"
 TV_WONDER_CEREMONY_S8_TITLE_169:0 "[tv_wonder_ceremony|E]：스투디움 제네랄레 선포"
 TV_WONDER_CEREMONY_S8_DESC_169:0 "의사, 총장, 행정관이 모여서 볼로냐의 스투디움을 비교할 수 없는 학교로 선포하고 졸업생이 어디를 가든지 학위를 인정합니다. 훈련된 정신과 꾸준한 관리에 대한 대학의 약속은 이 영역의 지속적인 자산이 됩니다.\n\n#weak 행사를 완료하는 데 필요한 대가를 지불하십시오. 그 결과 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_169:0 "우리는 이 연구실을 전 세계 앞에서 비교할 수 없는 학교로 선언합니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_169:0 "치안 판사는 더 상서로운 날을 기다리며 선언문을 연기합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_170:0 "@tv_ceremony_crown_estate!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_170:0 "#Y 진행 중#! - #high 산이 왕관을 차지하기 위해 소유권을 주장#!\n#F A 법령에 따라 공식적으로 카라라 위의 백맥이 있는 경사면이 왕관 헌장 아래에 위치하여 옛 로마 작업을 지연시켰던 개인 소유권 주장이 종식되었습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_170:0 "#G 완료#! — #high The Mountain은 Crown을 위해 소유권을 주장합니다#!\n#F A 법령에 따라 Carrara 위의 흰 정맥 경사면이 공식적으로 왕관 헌장 아래에 위치하여 옛 로마 작업을 지연시켰던 개인 청구의 패치워크가 끝났습니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_170:0 "[tv_wonder_ceremony|E]: 산이 왕위를 차지하다"
 TV_WONDER_CEREMONY_S1_DESC_170:0 "법령에 따라 카라라 위의 흰 줄무늬 경사면이 왕관 헌장 아래 공식적으로 지정되어 옛 로마 작업을 지연시켰던 개인 청구의 패치워크가 종료되었습니다. 현지 카바토리가 소환되어 어떤 얼굴이 여전히 가장 좋은 돌을 보유하고 있는지 조언합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_170:0 "우리는 왕관의 이름으로 이 산의 소유권을 주장하고, 오래된 소유권을 무시합니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_170:0 "오래된 청구인들은 한동안 패치워크 권리를 고수하고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_170:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_170:0 "#Y 진행 중#! — #high 측량사들이 채석장의 얼굴을 표시합니다#!\n#F 측량사는 산을 올라 가장 깨끗한 돌 표면을 가로지르는 분필 선을 그으며, 채석공 길드는 한 블록이 완성되기 전에 임금과 안전에 관해 협의합니다. 컷.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_170:0 "#G 완료#! — #high 측량사는 채석장의 얼굴을 표시합니다.#!\n#F 측량사는 산을 올라 가장 깨끗한 돌 표면을 가로지르는 분필 선을 그으며, 채석공 길드는 단일 블록이 완성되기 전에 임금과 안전에 대해 협의합니다. 컷.#!"
 TV_WONDER_CEREMONY_S2_TITLE_170:0 "[tv_wonder_ceremony|E]: 측량사들이 채석장의 얼굴을 표시합니다"
 TV_WONDER_CEREMONY_S2_DESC_170:0 "측량사들은 가장 깨끗한 돌 표면에 분필 선을 긋기 위해 산을 오르고, 채석공 길드는 한 블록을 자르기 전에 임금과 안전에 관해 협의합니다. 여전히 주의를 기울일 가치가 있는 교훈을 찾기 위해 고대 로마 절단을 검사합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_170:0 "두 번 측정하고 한 번 자르십시오. 심지어 산도 이 오래된 규칙을 따릅니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_170:0 "우리는 아직 절단할 돌을 표시할 준비가 되지 않았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_170:0 "@tv_ceremony_laborers!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_170:0 "#Y 진행 중#! — #high 썰매 선로가 절단되었습니다.#!\n#F 소와 노동자 팀이 대리석 블록이 부서지지 않고 아래로 내려갈 수 있을 만큼 가파른 경사로 산비탈을 따라 리자투라 선로를 깎습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_170:0 "#G 완료#! — #high 썰매 선로가 절단되었습니다.#!\n#F 황소와 노동자 팀이 산비탈을 따라 리자투라 선로를 깎습니다. 산산조각이 난다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_170:0 "[tv_wonder_ceremony|E]: 썰매 트랙이 절단되었습니다."
 TV_WONDER_CEREMONY_S3_DESC_170:0 "황소와 일꾼들로 구성된 팀이 산허리를 따라 리차투라 선로를 깎습니다. 이 선로의 경사는 대리석 블록이 부서지지 않고 아래로 내려갈 수 있을 만큼 충분히 가파르습니다. 밧줄 제작자와 휠공이 산기슭에 작업장을 세웠습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_170:0 "인부들은 산허리 깊은 곳에 썰매길을 깎습니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_170:0 "서둘러 선로를 자르면 돌이 미끄러지지 않고 부서집니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_170:0 "@tv_ceremony_rgo!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_170:0 "#Y 진행 중#! — #high 첫 번째 블록이 바위에서 풀려났습니다#!\n#F 쐐기와 쇠막대가 백악질된 선을 물고 거대한 흰색 블록이 산 표면에서 신음하며 신음하며 떨어져 나갑니다. 이제 진정한 카라라 채석장이 진행 중입니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_170:0 "#G 완료#! — #high 첫 번째 블록이 바위에서 풀려났습니다#!\n#F 쐐기와 쇠막대가 백악으로 칠한 선을 물고 거대한 흰색 블록이 산 표면에서 신음소리를 내며 빠져나오며, 이제 진정한 카라라 채석장이 진행 중입니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_170:0 "[tv_wonder_ceremony|E]: 첫 번째 블록이 바위에서 풀려났습니다."
 TV_WONDER_CEREMONY_S4_DESC_170:0 "쐐기와 쇠막대가 분필로 칠해진 선을 물고 거대한 흰색 블록이 산 표면에서 신음하며 떨어져 나가고 있으며, 이제 카라라의 진정한 채석장이 진행되고 있습니다. 황소 썰매가 짐을 짊어지자 환호성이 계곡 전체에 울려퍼집니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_170:0 "우리는 웨지를 집으로 몰고 Carrara의 첫 번째 돌을 풀어줍니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_170:0 "분필로 칠해진 선은 쐐기나 막대에 닿지 않은 채 기다리고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_170:0 "@tv_ceremony_supply!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_170:0 "#Y 진행 중#! — #high 채석장 하구에서 크레인이 솟아오른다#!\n#F 고대부터 어떤 공학적 업적과도 맞먹는다고 일컬어지는 나무 크레인이 채석장 하구에서 올라가서 썰매로 옮기기에는 너무 무거운 블록을 들어 올린다 혼자.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_170:0 "#G 완료#! — #high 채석장 하구에서 솟아오르는 크레인#!\n#F 고대부터 어떤 공학적 업적과도 맞먹는다고 일컬어지는 나무 크레인은 채석장 하구에서 썰매로 옮기기에는 너무 무거운 블록을 들어올립니다. 혼자.#!"
 TV_WONDER_CEREMONY_S5_TITLE_170:0 "[tv_wonder_ceremony|E]：채석장 입구에서 크레인이 솟아오릅니다."
 TV_WONDER_CEREMONY_S5_DESC_170:0 "고대부터 어떤 공학적 업적과도 맞먹는다고 일컬어지는 나무 크레인은 썰매만으로는 너무 무거운 블록을 들어올리기 위해 채석장 입구에서 세워집니다. 밧줄과 도르래의 리드미컬한 삐걱거리는 소리가 산의 끊임없는 노래가 됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_170:0 "고대에는 돌로 키웠던 것을 이제는 밧줄과 목재로 키웁니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_170:0 "우리는 썰매가 잠시 동안 혼자 일하도록 놔둘 것입니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_170:0 "@tv_ceremony_art_work!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_170:0 "#Y 진행 중#! — #high 조각가 블록 중에서 선택#!\n#F 마스터 조각가는 먼 작업장에서 갓 자른 블록 사이를 걸어다니며 망치로 각 블록을 두드려 숨겨진 결함이 없는 돌의 고리를 들어봅니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_170:0 "#G 완료#! — #high 조각가 블록 중에서 선택#!\n#F 마스터 조각가는 먼 작업장에서 갓 자른 블록 사이를 걸어다니며 망치로 각 블록을 두드려 숨겨진 결함이 없는 돌의 고리를 들어봅니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_170:0 "[tv_wonder_ceremony|E]:조각가가 블록 중에서 선택합니다."
 TV_WONDER_CEREMONY_S6_DESC_170:0 "마스터 조각가들은 먼 작업장에서 갓 자른 블록 사이를 거닐며 망치로 각 블록을 두드려 숨겨진 결함이 없는 돌의 고리를 들어봅니다. 최고의 제품은 나머지 제품보다 먼저 따로 보관되어 배송용으로 표시됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_170:0 "조각가들은 각 블록을 두드리며 흠 없는 돌의 고리에 귀를 기울입니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_170:0 "소리가 나지 않는 블록은 빛나는 부분 아래에 균열을 숨길 수 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_170:0 "@tv_ceremony_port!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_170:0 "#Y 진행 중#! — #high The Harbour Workshops Open#!\n#F 바다 항해를 위한 블록을 준비하기 위해 해안에 하역장과 거친 절단 작업장이 열려 선박이 화물을 실기 전에 초과 중량을 줄입니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_170:0 "#G 완료#! — #high The Harbour Workshops Open#!\n#F 바다 항해를 위한 블록을 준비하기 위해 해안에 하역장과 거친 절단 작업장이 열려 배가 화물을 실기 전에 초과 중량을 줄입니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_170:0 "[tv_wonder_ceremony|E]：항만 워크숍 오픈"
 TV_WONDER_CEREMONY_S7_DESC_170:0 "바다 항해를 위한 블록을 준비하고 선박이 화물을 실기 전에 초과 중량을 줄이기 위해 해안에 하역장과 거친 절단 작업장이 열립니다. 감독관들은 산을 떠나는 모든 블록을 주의 깊게 기록합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_170:0 "우리는 항구 야드를 열고 카라라의 돌을 바다로 보냅니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_170:0 "블록은 해안에 쌓여 배를 기다리지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_170:0 "@tv_ceremony_prosperity!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_170:0 "#Y 진행 중#! — #high 채석장은 완전한 작업 순서에 도달했습니다.#!\n#F 왕관은 카라라가 모델 기업으로 일하고 있으며 트랙, 크레인 및 작업장이 현재 꾸준하고 자립적인 속도로 운영되고 있음을 공식적으로 선언합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_170:0 "#G 완료#! — #high 채석장이 완전한 작업 주문에 도달했습니다.#!\n#F 왕관은 카라라가 모델 기업으로 일하고 있으며 트랙, 크레인 및 작업장이 현재 꾸준하고 자립적인 속도로 운영되고 있음을 공식적으로 선언합니다.#!"
 TV_WONDER_CEREMONY_S8_TITLE_170:0 "[tv_wonder_ceremony|E]: 채석장이 완전한 작업 순서에 도달했습니다."
 TV_WONDER_CEREMONY_S8_DESC_170:0 "왕관은 Carrara가 모델 기업으로 일하고 있으며 트랙, 크레인 및 작업장이 현재 꾸준하고 자립적인 속도로 운영되고 있음을 공식적으로 선언합니다. 왕국 전체의 건축업자들은 이곳에서 제공되는 풍부한 좋은 석재와 숙련된 노동력 덕분에 자신들의 프로젝트가 조용히 서두르고 있음을 깨닫습니다.\n\n#weak 행사를 완료하는 데 필요한 가격을 지불하세요. 그 결과 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_170:0 "왕관은 Carrara가 모든 영역의 모델로 작동함을 선언합니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_170:0 "우리는 아직 이 사업을 완전하다고 부를 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_171:0 "@tv_ceremony_law!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_171:0 "#Y 진행 중#! — #high 왕실 헌장이 봉인되었습니다.#!\n#F A 왕실 헌장은 인장이 찍혀 있어 상인 모험가들에게 희망봉 동쪽 무역에 대한 독점권을 부여합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_171:0 "#G 완료#! — #high 왕립 헌장은 봉인되었습니다#!\n#F A 왕실 헌장은 인장이 찍혀 있어 상인 모험가들에게 희망봉 동쪽 무역에 대한 독점권을 부여합니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_171:0 "[tv_wonder_ceremony|E]: 왕실 헌장이 봉인되었습니다"
 TV_WONDER_CEREMONY_S1_DESC_171:0 "왕실 헌장에는 큰 인장이 찍혀 있으며, 이는 상인 모험가들에게 희망봉 동쪽에서 교역할 수 있는 독점권을 부여하는 것입니다. 구독자들은 잉크가 마르기도 전에 자본금을 약속하기 위해 홀에 모여듭니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_171:0 "구독자는 왁스가 식기 전에 자본을 약속하기 위해 앞으로 나아갑니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_171:0 "우리는 아직 그렇게 광대한 헌장을 인봉하지 않을 것입니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_171:0 "@tv_ceremony_government!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_171:0 "#Y 진행 중#! — #high 위원회 재판소가 소집됩니다.#!\n#F A 위원회 재판소는 주요 가입자 중에서 선출되어 벤처 업무, 첫 번째 사업 순서인 선박 설비 및 해외 요인에 대한 지침 초안 작성을 관리합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_171:0 "#G 완료#! — #high 위원회 재판소가 소집됩니다.#!\n#F A 위원회 재판소는 벤처 업무, 첫 번째 사업 순서인 선박 설비 및 해외 요인에 대한 지침 초안 작성을 관리하기 위해 주요 가입자 중에서 선출됩니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_171:0 "[tv_wonder_ceremony|E]：위원회 재판소 소집"
 TV_WONDER_CEREMONY_S2_DESC_171:0 "위원회 법원은 벤처 사업, 사업의 첫 번째 순서, 선박 설비 및 해외 요인에 대한 지침 초안 작성을 관리하기 위해 주요 가입자 중에서 선출됩니다. 장부를 바로잡기 위해 직원 12명을 고용합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_171:0 "위원회는 선박을 장착하고 사무원을 장부에 정리하도록 명령합니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_171:0 "위원회는 아직 배를 투입할 의사가 없어 지시 사항에 대해 머뭇거립니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_171:0 "@tv_ceremony_diplomacy!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_171:0 "#Y 진행 중#! — #high 사절은 먼 해안으로 항해합니다.#!\n#F 첫 번째 요소와 사절은 수라트와 말라바르 해안을 따라 무역 허가를 받기 위해 현지 통치자에게 소개서를 가지고 출발합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_171:0 "#G 완료#! — #high 먼 해안으로 항해하는 사절#!\n#F 첫 번째 요인과 사절은 수라트와 말라바르 해안을 따라 무역 허가를 받기 위해 현지 통치자에게 소개서를 가지고 출발합니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_171:0 "[tv_wonder_ceremony|E]: 먼 해안으로 항해하는 사절"
 TV_WONDER_CEREMONY_S3_DESC_171:0 "첫 번째 요인과 사절은 지역 통치자에게 소개장을 가지고 출발하여 수라트와 말라바르 해안을 따라 무역 허가를 구합니다. 그들의 지시는 회사의 재산이 금만큼이나 본래의 선의에 달려 있기 때문에 공격하지 말 것을 경고합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_171:0 "나는 이 편지들을 수라트에게 직접 가져갈 것이며 도중에 어떤 공격도 가하지 않을 것입니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_171:0 "사절들은 해안의 통치자들을 자극할까 봐 조심하면서 출발을 연기합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_171:0 "@tv_ceremony_defensive_military_stance!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_171:0 "#Y 진행 중#! — #high 봄베이에서 요새화 된 건물이 솟아오른다#!\n#F 석공과 목수들이 봄베이의 요새화된 건물 착공을 시작했습니다. 그 벽은 회계사와 항구 너머를 모두 보호하기 위한 성벽으로 작업이 본격적으로 시작되었습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_171:0 "#G 완료#! — #high 봄베이에 요새화된 건물이 솟아오른다#!\n#F 석공과 목수들이 봄베이에 있는 요새화된 건물을 착공했습니다. 그 벽은 회계사와 항구 너머를 모두 보호하기 위한 벽으로, 작업은 실제로 2009년에 시작되었습니다. 진심입니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_171:0 "[tv_wonder_ceremony|E]: 봄베이에서 강화된 복합단이 솟아오른다"
 TV_WONDER_CEREMONY_S4_DESC_171:0 "석공과 목수들이 봄베이에 있는 요새화된 건물의 착공을 시작했습니다. 그 성벽은 계수관과 그 너머의 항구를 모두 보호하기 위한 것이었습니다. 작업은 진정으로 본격적으로 시작되었습니다. 중대 병사들은 첫 번째 석재 코스가 놓이는 것을 지켜보고 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_171:0 "석공들이 봄베이에서 착공하고 최초의 석조 코스가 경비를 받고 있습니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_171:0 "나는 아직 봄베이의 성벽에 돌과 군인을 투입할 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_171:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_171:0 "#Y 진행 중#! — #high 템즈 강과 항구를 따라 늘어선 창고#!\n#F 요새화된 창고는 런던의 템스 강과 봄베이 해안가를 따라 솟아 있으며, 두꺼운 벽은 향신료 더미, 천 볼트, 은 상자를 담기 위해 만들어졌습니다. 비슷합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_171:0 "#G 완료#! — #high 템스 강과 항구를 따라 늘어선 창고#!\n#F 런던의 템스 강과 봄베이 해안가를 따라 솟아오른 요새화된 창고, 향신료 더미, 천 볼트, 은 상자를 담기 위해 두꺼운 벽이 세워졌습니다. 비슷합니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_171:0 "[tv_wonder_ceremony|E]：템스 강과 항구에 늘어선 창고"
 TV_WONDER_CEREMONY_S5_DESC_171:0 "런던의 템스 강과 봄베이 해안가를 따라 요새화된 창고가 솟아 있으며, 두꺼운 벽은 양념 꾸러미, 천 두루마리, 은 상자를 모두 보관하기 위해 지어졌습니다. 도착하는 모든 호송대의 하역 속도를 높이기 위해 크레인과 도르래가 설치됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_171:0 "창고가 양쪽 해안을 따라 올라가면서 크레인과 도르래가 제자리로 들어 올려집니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_171:0 "창고는 반쯤 지어져 있고, 자금 부족으로 크레인이 작동하지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_171:0 "@tv_ceremony_navy_strength!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_171:0 "#Y 진행 중#! — #high 무장 호송대가 바다로 출격합니다.#!\n#F 회사 선박에는 총을 장착하고 호위 호송대가 항해하여 해로를 따라 해적과 라이벌 무역상을 막아냅니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_171:0 "#G 완료#! — #high 무장 호송대 바다로 출발#!\n#F 회사 선박에는 총을 장착하고 호위 호송대를 구성하여 해상로를 따라 해적과 경쟁 상인을 물리칩니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_171:0 "[tv_wonder_ceremony|E]:무장 호송대가 바다로 이동"
 TV_WONDER_CEREMONY_S6_DESC_171:0 "회사 선박에는 총이 장착되어 있으며 호위 호송대가 항해하여 해로를 따라 해적과 경쟁 상인을 막아냅니다. 회사 배너는 소유권만큼 보호의 표시인 모든 마스트에서 스냅됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_171:0 "총이 떨어지고 깃발이 높이 솟아오릅니다!"
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_171:0 "호송대는 아직 해적을 향해 총을 장착하지 않은 채 정박하여 기다리고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_171:0 "@tv_ceremony_writer!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_171:0 "#Y 진행 중#! — #high 원장 하우스의 모습#!\n#F 영구 원장 하우스와 기록 보관소가 런던과 해외에 설립되었으며 현지 상인 및 공무원과의 원활한 거래를 위해 현지 에이전트를 모집했습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_171:0 "#G 완료#! — #high 원장 하우스의 모습#!\n#F 영구 원장 하우스와 기록 보관소가 런던과 해외에 설립되었으며 현지 상인 및 공무원과의 원활한 거래를 위해 현지 에이전트를 모집했습니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_171:0 "[tv_wonder_ceremony|E]：원장 하우스의 모습"
 TV_WONDER_CEREMONY_S7_DESC_171:0 "영구 원장 하우스와 기록 보관소가 런던과 해외 모두에 설립되었으며 현지 상인 및 공무원과의 원활한 거래를 위해 현지 대리인을 모집했습니다. 이제 모든 향신료 더미와 모든 루피의 수익이 세 배로 기록됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_171:0 "사무원은 첫 번째 장부를 세 번 작성하고 현지 에이전트가 해당 직책을 맡습니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_171:0 "아직은 아닙니다. 먼저 계산해야 할 루피가 하나 더 있습니다!"
 TV_WONDER_CEREMONY_CARD_ICON_S8_171:0 "@tv_ceremony_trade!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_171:0 "#Y 진행중#! — #high 본사 취임#!\n#F 이사, 인사, 사절이 모이기 전에 왕실 헌장을 낭독하면서 회사 본부가 공식적으로 취임했습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_171:0 "#G 완료#! — #high 본사 취임#!\n#F 이사, 인사, 사절이 모이기 전에 왕실 헌장을 낭독하면서 회사 본부가 공식적으로 취임했습니다.#!"
 TV_WONDER_CEREMONY_S8_TITLE_171:0 "[tv_wonder_ceremony|E]：본사 출범"
 TV_WONDER_CEREMONY_S8_DESC_171:0 "회사의 본사는 이사, 직원 및 사절이 모인 가운데 왕실 헌장을 낭독하면서 공식적으로 취임했습니다. 이제 이 계산실에서 왕관의 해외 상업이 이전에는 누릴 수 없었던 안정적으로 흐르고 있습니다.\n\n#weak 의식을 완료하는 데 필요한 가격을 지불하세요. 결과적으로 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_171:0 "모인 이사들 앞에서 헌장을 낭독하고 본부가 취임합니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_171:0 "이사들은 낭독을 연기했고, 본부는 한동안 침묵을 지켰다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_172:0 "@tv_ceremony_law!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_172:0 "#Y 진행 중#! — #high 황제의 상사가 발행됩니다.#!\n#F 황제는 방문하는 모든 사절에게 자신의 통치의 위엄을 선포하기에 적합한 이전에 볼 수 없었던 왕좌를 만들 것을 명령합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_172:0 "#G 완료#! — #high 황제의 상사가 발행됩니다.#!\n#F 황제는 방문하는 모든 사절에게 자신의 통치의 위엄을 선포하기에 적합한 왕좌를 이전에 볼 수 없었던 방식으로 제작하라고 명령합니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_172:0 "[tv_wonder_ceremony|E]：황제의 퍼맨 발행"
 TV_WONDER_CEREMONY_S1_DESC_172:0 "황제는 방문하는 모든 사절에게 자신의 통치의 위대함을 선포하기에 적합한 왕좌를 이전에 볼 수 없었던 방식으로 만들라고 명령합니다. 왕실의 포고자들은 하루 안에 델리의 바자회를 통해 퍼먼을 운반합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_172:0 "우리는 이 회사를 봉인하여 델리 구석구석으로 보냅니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_172:0 "서기관들은 인을 보류하고 더 은혜로운 때를 기다립니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_172:0 "@tv_ceremony_wealth!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_172:0 "#Y 진행 중#! — #high 재무부의 보석 목록이 작성되었습니다#!\n#F 황실 금세공인과 보석상이 보물창고로 소환되어 왕좌에 사용할 루비, 에메랄드, 진주가 배치되고 목록이 작성됩니다. 디자인.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_172:0 "#G 완료#! — #high 재무부의 보석 목록이 작성되었습니다#!\n#F 황실 금세공인과 보석 세공인이 보물창고로 소환되어 왕좌를 위한 루비, 에메랄드, 진주가 배치되고 목록화됩니다. 디자인.#!"
 TV_WONDER_CEREMONY_S2_TITLE_172:0 "[tv_wonder_ceremony|E]：재무부의 보석 목록이 작성되었습니다"
 TV_WONDER_CEREMONY_S2_DESC_172:0 "황실의 금세공인과 보석상이 재무부에 소환되어 왕좌의 디자인에 맞는 루비, 에메랄드, 진주를 배치하고 목록을 작성합니다. 궁정 점성가들과 상의하여 작업이 시작될 상서로운 시간을 선택합니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 시간이 적절하지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_172:0 "마침내 공개된 엄청난 부!"
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_172:0 "우리는 기다릴 것이다. 점성가들이 먼저 더 나은 시간을 지정하게 하세요."
 TV_WONDER_CEREMONY_CARD_ICON_S3_172:0 "@tv_ceremony_artistic_skill_icon!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_172:0 "#Y 진행 중#! — #high 공작의 디자인이 승인됨#!\n#F 장인 베바달 칸(Bebadal Khan)은 황금 공작새에 달린 캐노피 스케치를 선보이고 꼬리는 에나멜로 화려하게 펼쳐져 있으며 황제는 단 한 번의 승인으로 이를 승인합니다. nod.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_172:0 "#G 완료#! — #high 공작의 디자인이 승인됨#!\n#F 장인 베바달 칸(Bebadal Khan)은 황금 공작새에 달린 캐노피 스케치를 제시하고, 꼬리는 에나멜로 화려하게 펼쳐져 있으며, 황제는 단 한 번의 승인으로 그의 승인을 받았습니다. nod.#!"
 TV_WONDER_CEREMONY_S3_TITLE_172:0 "[tv_wonder_ceremony|E]：공작의 디자인이 승인되었습니다"
 TV_WONDER_CEREMONY_S3_DESC_172:0 "장인 베바달 칸(Bebadal Khan)은 황금색 공작새에 달린 캐노피의 스케치를 제시하고 꼬리는 에나멜로 화려하게 펼쳐져 있으며 황제는 고개를 끄덕이며 승인합니다. 수도 전역의 작업장이 금괴를 하나씩 모으기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_172:0 "황제는 고개를 끄덕이고 수도 전역의 작업장에서 금을 모으기 시작합니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_172:0 "아직은 아닙니다. 스케치를 다듬어 보세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S4_172:0 "@tv_ceremony_gold!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_172:0 "#Y 진행 중#! — #high 황금 틀이 주조되었습니다.#!\n#F 금세공인들이 녹은 금을 왕좌의 틀 틀에 붓고, 몇 달 간의 설계와 수집 끝에 마침내 진정한 건설 노동이 진행되었습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_172:0 "#G 완료#! — #high 황금 틀이 주조되었습니다.#!\n#F 금세공인들이 녹은 금을 왕좌의 틀 틀에 붓고, 몇 달 간의 설계와 수집 끝에 마침내 진정한 건설 노동이 진행되었습니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_172:0 "[tv_wonder_ceremony|E]: 골든 프레임이 캐스팅되었습니다."
 TV_WONDER_CEREMONY_S4_DESC_172:0 "금세공인들은 녹은 금을 왕좌 틀의 주형에 붓고, 몇 달 간의 설계와 수집 끝에 마침내 진정한 건축 작업이 진행됩니다. 불꽃과 불빛이 밤새 작업장을 가득 채웠습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_172:0 "우리는 용광로에 불을 붙이라고 명령합니다. 바로 오늘 밤에 금을 부어주세요."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_172:0 "용광로는 차갑게 서 있고 불은 또 다른 밤을 대비해 쌓아 두었습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_172:0 "@tv_ceremony_art_work!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_172:0 "#Y 진행 중#! — #high 루비와 에메랄드가 설정되었습니다.#!\n#F 보석상은 모든 각도에서 관객석의 빛을 받을 수 있도록 루비, 에메랄드, 다이아몬드를 패턴으로 프레임에 세팅합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_172:0 "#G 완료#! — #high 루비와 에메랄드가 설정되었습니다.#!\n#F 보석상은 모든 각도에서 관객석의 빛을 받을 수 있도록 루비, 에메랄드, 다이아몬드를 패턴으로 프레임에 세팅합니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_172:0 "[tv_wonder_ceremony|E]：루비와 에메랄드 세트"
 TV_WONDER_CEREMONY_S5_DESC_172:0 "보석 세공인들은 모든 각도에서 청중석의 빛을 받을 수 있도록 루비, 에메랄드, 다이아몬드를 패턴으로 프레임에 세팅합니다. 돌 하나를 잘못 배치하면 장인의 지위가 사라질 수 있다는 속삭임이 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_172:0 "급히 박힌 보석은 곧 떨어질 보석이다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_172:0 "우리는 기다릴 것이다; 서둘러서 이보다 더 훌륭한 작업을 취소했습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_172:0 "@tv_ceremony_painting!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_172:0 "#Y 진행 중#! — #high 법랑 꼬리를 펼치는 공작#!\n#F 금빛 공작 인형이 마침내 완성되었습니다. 꼬리에는 파란색과 녹색 에나멜이 새겨져 있어 너무 생생해서 신하들은 거의 움직이는 것 같다고 합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_172:0 "#G 완료#! — #high 에나멜을 입힌 꼬리를 펼치는 공작#!\n#F 황금 공작의 형상이 마침내 완성되었습니다. 꼬리에는 파란색과 녹색의 에나멜이 새겨져 너무 생생해서 궁중들이 거의 공작새처럼 보인다고 합니다. move.#!"
 TV_WONDER_CEREMONY_S6_TITLE_172:0 "[tv_wonder_ceremony|E]:공작이 에나멜 꼬리를 펼칩니다."
 TV_WONDER_CEREMONY_S6_DESC_172:0 "황금빛 공작새 형상이 마침내 완성되었으며 꼬리는 파란색과 녹색의 에나멜로 상감되어 너무 생생해서 신하들은 거의 움직이는 것처럼 보인다고 말했습니다. 그 위에는 캐노피가 설치되어 앉은 황제에게 그늘을 제공할 준비가 되어 있습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_172:0 "에나멜 칠공은 최종 파란색과 녹색을 깔고 공작새는 거의 숨을 쉬는 것처럼 보입니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_172:0 "잠깐만요 - 녹색은 아직 사실이 아닙니다!"
 TV_WONDER_CEREMONY_CARD_ICON_S7_172:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_172:0 "#Y 진행 중#! — #high 왕위는 Diwan-i-Khas에 조립됩니다.#!\n#F 모든 금박 패널과 보석 박힌 세공품은 Diwan-i-Khas로 운반되어 법원의 감시 아래 함께 장착됩니다. 건축가.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_172:0 "#G 완료#! — #high 왕위는 Diwan-i-Khas에 조립됩니다#!\n#F 모든 금박 패널과 보석 상감은 Diwan-i-Khas로 운반되어 법원의 감시 아래 함께 장착됩니다. 건축가.#!"
 TV_WONDER_CEREMONY_S7_TITLE_172:0 "[tv_wonder_ceremony|E]: 왕좌는 Diwan-i-Khas에 조립됩니다."
 TV_WONDER_CEREMONY_S7_DESC_172:0 "모든 금박 패널과 보석 상감은 Diwan-i-Khas로 옮겨져 궁정 건축가의 세심한 감독하에 함께 맞춰집니다. 마지막 조각이 제자리로 들어가면서 모든 문에 경비원이 배치됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_172:0 "우리는 건축가에게 계속 진행하라고 요청했습니다. 오늘 밤 모든 패널을 Diwan-i-Khas에 설정하세요."
