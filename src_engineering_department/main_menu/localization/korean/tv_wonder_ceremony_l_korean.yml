 TV_WONDER_CEREMONY_S8_DESC_230:0 "서기관, 경비원, 번역가, 석공, 법학자, 왕실 전령사, 여행하는 학자들이 Behistun Inscription에 모여 비문을 봉헌합니다. 무대는 현장 노동, 공개 증언, 고대 왕실 문서를 권위, 문화적 기억, 질서로 바꾸는 의식적 증거를 기록합니다.\n\n#weak 의식을 완료하는 데 필요한 대가를 지불하세요. 결과적으로 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
