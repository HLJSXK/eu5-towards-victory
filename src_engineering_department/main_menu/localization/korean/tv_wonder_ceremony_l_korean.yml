 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_236:0 "#Y 진행 중#! — #high 신호 섬을 선택하세요#!\n#F 섬 감시원, 탑 석공, 연료 보관인, 항구 전령, 순찰 선장, 함대 장교가 Zhoushan Beacon Network에 모여 신호 섬을 선택합니다.#!"
