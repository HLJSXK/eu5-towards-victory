 TV_WONDER_CEREMONY_S8_TITLE_195:0 "[tv_wonder_ceremony|E]：마르세유의 옛 항구가 지중해를 장악하다"
 TV_WONDER_CEREMONY_S8_DESC_195:0 "봉화와 대포 경례가 항구의 완성을 알리고 마르세유의 구 항구는 지중해의 무역 함대와 전투 함대를 모두 지휘할 준비가 되어 있습니다.\n\n#weak 행사를 완료하는 데 필요한 가격을 지불하세요. 결과적으로 불가사의의 최종 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_195:0 "드디어 항구가 완성되었습니다!"
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_195:0 "마지막 행사가 연기되면서 경례가 기다리고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_196:0 "@tv_ceremony_law!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_196:0 "#Y 진행 중#! — #high 영사관에서 실크 헌장 승인#!\n#F Lyon의 영사관은 론강과 손강을 따라 이탈리아의 직조기와 경쟁하기를 희망하면서 전용 실크 구역에 대한 헌장을 승인합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_196:0 "#G 완료#! — #high 영사관은 실크 헌장을 부여합니다#!\n#F Lyon의 영사관은 론강과 손강을 따라 있는 이탈리아의 직조기와 경쟁하기를 희망하면서 전용 실크 구역에 대한 헌장을 승인합니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_196:0 "[tv_wonder_ceremony|E]：영사관이 실크 헌장을 승인하다"
 TV_WONDER_CEREMONY_S1_DESC_196:0 "리옹 영사관은 론강과 손강을 따라 이탈리아의 직조기와 경쟁할 수 있기를 희망하면서 전용 실크 구역에 대한 전세를 승인했습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_196:0 "마침내 이탈리아와 경쟁하기 위한 헌장!"
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_196:0 "우리는 아직 이 헌장을 봉인할 준비가 되지 않았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_196:0 "@tv_ceremony_migration_attraction!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_196:0 "#Y 진행 중#! — #high 이탈리아 출신의 직조 장인#!\n#F 이탈리아 및 그 외 지역의 대리인 궁정 직공이 리옹의 좁은 거리에 정착할 모든 사람에게 워크숍과 세금 혜택을 제공합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_196:0 "#G 완료#! — #high 이탈리아에서 파견된 장인 직공#!\n#F 이탈리아 및 그 외 지역 출신의 법정 장인 직공들이 리옹의 좁은 거리에 정착할 모든 사람들에게 워크숍과 세금 혜택을 제공합니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_196:0 "[tv_wonder_ceremony|E]：직공의 명인이 이탈리아에서 구애받다"
 TV_WONDER_CEREMONY_S2_DESC_196:0 "에이전트는 이탈리아 및 그 외 지역의 장인 직공을 법정에 세우고 리옹의 좁은 거리에 정착할 모든 사람에게 워크숍과 세금 혜택을 제공합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_196:0 "요원들은 알프스를 넘어 이탈리아의 직조 장인을 구합니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_196:0 "아직은 아닙니다. 이탈리아 마스터들이 기다리도록 하세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S3_196:0 "@tv_ceremony_production_method!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_196:0 "#Y 진행 중#! — #high 룸 및 염료 통 주문됨#!\n#F 룸, 염료 통 및 패턴 북이 대량으로 주문되는 동안 길드 홀에서는 새로운 거래에 적용되는 규칙 초안 작성을 시작합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_196:0 "#G 완료#! — #high 룸 및 염료 통 주문됨#!\n#F 룸, 염료 통 및 패턴 북이 대량으로 주문되는 동안 길드 홀에서는 새로운 거래를 관리할 규칙 초안 작성을 시작합니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_196:0 "[tv_wonder_ceremony|E]：직기 및 염료 통을 주문합니다"
 TV_WONDER_CEREMONY_S3_DESC_196:0 "직기, 염료 통, 패턴 북이 대량으로 주문되는 동안 길드 홀에서는 새로운 거래를 관리할 규칙 초안을 작성하기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
