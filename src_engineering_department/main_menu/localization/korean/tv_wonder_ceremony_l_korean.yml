 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_173:0 "#Y 진행 중#! — #high A 갠지스강 이전에 맹세했습니다#!\n#F A 통치자는 새벽에 물가에 서서 어떤 단일 통치보다도 오래 지속될 신성한 카시의 무너진 계단을 돌로 재건하겠다고 맹세합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_173:0 "#G Completed#! — #high A 갠지스강 이전에 맹세했습니다#!\n#F A 통치자는 새벽에 물가에 서서 어떤 단일 통치보다 오래 지속될 신성한 카시의 무너진 계단을 돌로 재건하겠다고 맹세합니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_173:0 "[tv_wonder_ceremony|E]: 갠지스강 앞에서 맹세하다"
 TV_WONDER_CEREMONY_S1_DESC_173:0 "한 통치자가 새벽에 물가에 서서 어떤 단일 통치보다도 오래 지속될 신성한 카시의 무너져가는 계단을 돌로 재건하겠다고 맹세합니다. 근처에서 이미 목욕을 하고 있는 순례자들은 다가올 일에 대한 좋은 징조로 서약을 합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_173:0 "통치자는 큰 소리로 서원을 말하고, 강 앞의 돌에 그 말을 결박한다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_173:0 "아직은 아니다. 나는 강 앞에서 내 말을 좀 더 신중하게 선택할 것이다."
