 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_199:0 "#G 완료#! — #high 성문이 최종 모습을 갖추다#!\n#F 모든 입구를 통제할 무거운 성문이 최종 모습을 갖추게 되며, 바비칸은 외부 문을 뚫는 모든 힘을 가두도록 설계되었습니다.#!"
