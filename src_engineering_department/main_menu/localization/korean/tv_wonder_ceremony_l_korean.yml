 TV_WONDER_CEREMONY_CARD_ICON_S3_138:0 "@tv_ceremony_law!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_138:0 "#Y 진행 중#! — #high 물 권리가 나누어집니다.#!\n#F 마을 원로들과 샤의 관리들이 모여 물시계를 돌려 카나트의 미래 흐름을 나누며 하류의 모든 들판이 공정한 몫의 시간을 받게 됩니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_138:0 "#G 완료#! — #high 물 권리가 나누어집니다.#!\n#F 마을 원로들과 샤의 관리들이 모여 물시계를 돌려 카나트의 미래 흐름을 나누며 하류의 모든 들판이 공정한 몫의 시간을 받게 됩니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_138:0 "[tv_wonder_ceremony|E]：물 권리가 나누어진다"
 TV_WONDER_CEREMONY_S3_DESC_138:0 "마을 장로들과 샤의 관리들은 물시계를 돌려 카나트의 미래 흐름을 나누기 위해 모여서 하류의 모든 들판이 공평한 몫의 시간을 받을 수 있도록 합니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_138:0 "장로들은 물시계를 돌려 각 밭의 적절한 시간을 정합니다."
