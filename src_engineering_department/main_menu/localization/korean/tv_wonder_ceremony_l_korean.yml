 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_211:0 "#Y 진행 중#! — #high 황실 대출 계약이 체결되었습니다.#!\n#F 황제와 왕자는 계산실 뒷방에서 대출 계약을 체결하고 집에 준비된 금을 기준으로 미래 수익을 담보합니다.#!"
