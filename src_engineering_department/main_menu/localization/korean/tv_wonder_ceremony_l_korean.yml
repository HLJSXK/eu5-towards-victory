 TV_WONDER_CEREMONY_S5_TITLE_173:0 "[tv_wonder_ceremony|E]：계층이 은행을 오르다"
 TV_WONDER_CEREMONY_S5_DESC_173:0 "계단이 둑을 따라 올라가고, 새벽에 순례자들의 행렬이 나란히 물가로 내려갈 수 있을 만큼 넓습니다. 새로 완성된 층계참을 따라 램프와 화환 상인들이 자리를 잡기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_173:0 "상인들이 착륙장에서 자신의 자리를 차지함에 따라 메이슨은 층층이 쌓입니다."
