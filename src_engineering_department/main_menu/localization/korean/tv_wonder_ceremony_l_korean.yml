 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_211:0 "#Y 진행 중#! — #high 택배 네트워크 확산#!\n#F 승객과 대리인은 먼 무역 도시에 있는 특파원 사무실로 파견되어 동전 마차보다 더 빠르게 돈을 이동할 수 있는 신용 네트워크를 엮습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_211:0 "#G 완료#! — #high 택배 네트워크 확산#!\n#F 승객과 대리인은 먼 무역 도시에 있는 특파원 사무실로 파견되어 동전 마차보다 더 빠르게 돈을 이동할 수 있는 신용 네트워크를 엮습니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_211:0 "[tv_wonder_ceremony|E]：택배 네트워크 확산"
 TV_WONDER_CEREMONY_S6_DESC_211:0 "라이더와 에이전트는 먼 무역 도시에 있는 특파원 사무실로 파견되어 동전 마차보다 더 빠르게 돈을 이동할 수 있는 신용 네트워크를 엮습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리세요.#!"
