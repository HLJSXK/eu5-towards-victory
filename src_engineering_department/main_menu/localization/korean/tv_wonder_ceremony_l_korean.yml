 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_136:0 "#G 완료#! — #high 강둑에 솟아오르는 창고#!\n#F 메이슨은 강 옆에 있는 거대하고 요새화된 창고 착공을 시작했습니다. 두꺼운 벽은 홍수와 도둑 모두를 견딜 수 있었습니다. 부두.#!"
