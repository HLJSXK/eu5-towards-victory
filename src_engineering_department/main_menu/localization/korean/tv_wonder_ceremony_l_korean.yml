 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_138:0 "우리는 지금은 수갱 라인을 유지하고 있으며 평원을 더 이상 표시할 생각이 없습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_138:0 "@tv_ceremony_river!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_138:0 "#Y 진행 중#! — #high 터널이 숨겨진 강을 만나다#!\n#F 평야 깊은 곳에서 굴착자들은 묻혀 있는 물의 차가운 돌진 속으로 뚫고 들어가고, 마침내 산의 숨겨진 강이 발견되었다는 소문이 이스파한 전역에 퍼집니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_138:0 "#G 완료#! — #high 터널이 숨겨진 강을 만나다#!\n#F 평야 깊은 곳에서 굴착자들은 묻혀 있는 물의 차가운 돌진 속으로 뚫고 들어가 마침내 산의 숨겨진 강을 발견했다는 소문이 이스파한 전역에 퍼집니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_138:0 "[tv_wonder_ceremony|E]: 터널은 숨겨진 강을 만난다"
 TV_WONDER_CEREMONY_S6_DESC_138:0 "평야 깊은 곳에서 채굴자들이 차갑게 솟아오르는 매몰된 물 속으로 돌파하고 마침내 산의 숨겨진 강을 발견했다는 소식이 이스파한 전역에 퍼집니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_138:0 "굴착기가 돌파하고 숨겨진 강이 그들을 만나러 돌진합니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_138:0 "아직은 아닙니다. 강이 기다리도록 하세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S7_138:0 "@tv_ceremony_construction!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_138:0 "#Y 진행 중#! — #high A 붕괴가 극복됨#!\n#F A 수갱이 터널 중간 지점 근처의 연약한 땅에서 붕괴되어 도구와 굴착기가 거의 묻어나지만 무칸니스는 목재로 통로를 지탱하고 줄을 누릅니다. 앞으로.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_138:0 "#G Completed#! — #high A 붕괴가 극복됨#!\n#F A 수갱이 터널 중간 지점 근처의 연약한 땅에서 붕괴되어 도구와 거의 굴착기가 묻어나지만 무칸니스는 목재로 통로를 지탱하고 선을 누릅니다. 앞으로.#!"
 TV_WONDER_CEREMONY_S7_TITLE_138:0 "[tv_wonder_ceremony|E]：붕괴를 극복하다"
 TV_WONDER_CEREMONY_S7_DESC_138:0 "터널 중간 지점 근처의 연약한 땅에 수갱이 무너져 도구와 거의 굴착기가 묻혀 있지만 무칸니스는 목재로 통로를 지탱하고 계속해서 줄을 밀고 있습니다.\n\n#weak 식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
