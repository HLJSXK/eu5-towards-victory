 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_142:0 "#G 완료#! — #high 왕이 템스 강에 요새를 명령하다#!\n#F A 왕실 영장은 템스 강 옆에 세워진 새로운 요새를 명령하며, 동시에 요새이자 재무부이며, 왕관의 권력이 런던에 있다는 성명을 담고 있습니다. 강.#!"
