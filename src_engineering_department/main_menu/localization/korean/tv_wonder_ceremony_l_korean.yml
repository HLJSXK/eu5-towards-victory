 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_199:0 "#Y 진행 중#! — #high 이중 성벽으로 둘러싸인 카르카손#!\n#F 완성된 이중 성벽 위에 배너가 세워져 있고, 카르카손은 아직 어떤 군대도 무력으로 점령하지 못한 요새로 우뚝 서 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_199:0 "#G Completed#! — #high 이중 성벽으로 둘러싸인 카르카손#!\n#F 완성된 이중 성벽 위에 배너가 세워져 있고 카르카손은 아직 어떤 군대도 무력으로 점령하지 못한 요새로 우뚝 서 있습니다.#!"
