 TV_WONDER_CEREMONY_S1_OPTION_PAY_142:0 "영장은 봉인되었고, 왕관의 요새는 템스강에 세워졌습니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_142:0 "서둘러 세운 벽은 무너지기 위해 쌓은 벽이다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_142:0 "@tv_ceremony_port!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_142:0 "#Y 진행 중#! — #high 강 문 부지가 정리되었습니다.#!\n#F 왕관의 정박지를 잃은 런던 사람들의 불평 때문에 요새의 수문으로 가는 길을 만들기 위해 강둑을 따라 있는 오래된 부두와 오두막이 정리되었습니다. 야망.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_142:0 "#G 완료#! — #high 강 문 부지가 정리되었습니다.#!\n#F 왕관의 정박지를 잃은 런던 사람들의 불평 때문에 요새의 수문으로 가는 길을 만들기 위해 강둑을 따라 있는 오래된 부두와 오두막이 정리되었습니다. 야망.#!"
 TV_WONDER_CEREMONY_S2_TITLE_142:0 "[tv_wonder_ceremony|E]：리버 게이트 부지가 제거되었습니다"
 TV_WONDER_CEREMONY_S2_DESC_142:0 "강둑을 따라 있는 오래된 부두와 오두막은 왕위의 야망 때문에 정박지를 잃은 런던 시민들의 불평으로 인해 요새의 수문으로 가는 길을 마련하기 위해 치워졌습니다. \n\n#weak 식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_142:0 "뱃사공들이 뭐라고 하든 우리는 이 부두를 청소할 것입니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_142:0 "부두는 조금 더 길게 서 있고, 뱃사공들은 정박지를 유지합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_142:0 "@tv_ceremony_laborers!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_142:0 "#Y 진행 중#! — #high 왕립 석공이 맹세합니다#!\n#F 왕국 전역에서 소환된 석공의 대가는 공사의 순경에게 충성을 맹세하며 그들의 기술과 충성심을 단일 통치보다 오래 지속되는 요새에 묶습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_142:0 "#G 완료#! — #high 왕실 석공들이 맹세합니다#!\n#F 왕국 전역에서 소환된 석공 마스터들은 공사의 순경에게 충성을 맹세하고 그들의 기술과 충성심을 어떤 단일보다 오래 지속될 요새에 묶습니다. 통치.#!"
 TV_WONDER_CEREMONY_S3_TITLE_142:0 "[tv_wonder_ceremony|E]:왕립 석공들이 맹세합니다"
 TV_WONDER_CEREMONY_S3_DESC_142:0 "왕국 전역에서 소환된 석공의 명인은 공사를 맡은 치안관에게 충성을 맹세하고 그들의 기술과 충성심을 단일 통치보다 오래 지속될 요새에 결속시킵니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우에는 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_142:0 "석공들은 무릎을 꿇고 경찰관에게 봉사할 것을 맹세합니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_142:0 "나는 아직 이 석공들의 맹세를 받아들일 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_142:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_142:0 "#Y 진행 중#! — #high 화이트 킵의 기초가 놓였습니다.#!\n#F Diggers는 거대한 중앙 성을 위한 첫 번째 기초 참호를 팠고, 요새가 더 이상 왕실 영장이 아니고 솟아오르는 벽이 되면서 캉 스톤이 바지선으로 도착하기 시작합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_142:0 "#G 완료#! — #high 화이트 킵의 기초가 놓였습니다.#!\n#F Diggers는 거대한 중앙 성을 위한 첫 번째 기초 참호를 팠고, 요새가 더 이상 왕의 영장이 되지 않고 상승하면서 캉 스톤이 바지선으로 도착하기 시작합니다. 벽.#!"
 TV_WONDER_CEREMONY_S4_TITLE_142:0 "[tv_wonder_ceremony|E]：화이트 킵의 기초가 놓였습니다"
 TV_WONDER_CEREMONY_S4_DESC_142:0 "파는 사람들이 거대한 중앙 성채를 위한 첫 번째 기초 참호를 자르고, 요새가 더 이상 왕의 영장이 아니고 솟아오르는 벽이 되면서 캉 돌이 바지선으로 도착하기 시작합니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 대가를 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_142:0 "바지선이 첫 번째 캉 돌을 내릴 때 굴착기들이 땅을 부수고 있습니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_142:0 "참호는 표시되지 않은 채로 남아 있고 바지선은 강 상류에서 기다리고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_142:0 "@tv_ceremony_crown_estate!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_142:0 "#Y 진행 중#! — #high 백색 성은 강 위로 솟아 있습니다.#!\n#F 층별로 이루어진 거대한 성채는 템스 강 위로 창백하게 솟아 있으며, 두꺼운 벽과 좁은 창문은 이미 적과 포로를 모두 수용할 수 있는 요새임을 표시하고 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_142:0 "#G 완료#! — #high 강 위로 솟아오른 흰색 성채#!\n#F 층별로 이루어진 거대한 성채는 템스강 위로 창백하게 솟아 있으며, 두꺼운 벽과 좁은 창문은 이미 적과 포로를 모두 수용할 수 있는 요새임을 표시하고 있습니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_142:0 "[tv_wonder_ceremony|E]：강 위로 솟아오른 백성"
 TV_WONDER_CEREMONY_S5_DESC_142:0 "층별로 이루어진 거대한 성채는 템스강 위로 창백하게 솟아 있으며, 두꺼운 벽과 좁은 창문은 이미 적과 포로 모두를 수용할 수 있는 요새임을 표시하고 있습니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_142:0 "우리는 강 위로 창백한 성채가 한 층씩 솟아오르는 것을 지켜봅니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_142:0 "성채는 다음 층을 기다리며 절반 높이에서 잠시 멈춰 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_142:0 "@tv_ceremony_soldiers!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_142:0 "#Y 진행 중#! — #high 커튼월이 구역을 둘러쌉니다.#!\n#F 커튼월과 타워의 고리가 성채 주변을 닫고 해자가 잘려 강에서 범람하여 요새를 수 세기 동안 유지할 다층 방어로 봉쇄합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_142:0 "#G 완료#! — #high 경관을 둘러싸는 커튼월#!\n#F 커튼월과 타워의 고리가 성채 주변을 닫고, 해자가 잘려 강에서 범람하여 요새를 다층 방어로 봉쇄합니다. 세기.#!"
 TV_WONDER_CEREMONY_S6_TITLE_142:0 "[tv_wonder_ceremony|E]：커튼월이 선거구를 에워쌉니다."
 TV_WONDER_CEREMONY_S6_DESC_142:0 "외벽과 탑으로 이루어진 고리가 성채 주위로 닫히고, 해자가 절단되어 강에서 범람하여 요새를 수세기 동안 유지할 다층 방어로 봉쇄합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_142:0 "해자가 강물로 채워지면서 천수각 주변의 커튼월이 닫힙니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_142:0 "나는 해자와 벽이 미완성된 채 구역을 좀 더 열어 두겠습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_142:0 "@tv_ceremony_construction!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_142:0 "#Y 진행 중#! — #high A 벽이 무너지고 더 강력하게 재건축됨#!\n#F A 새로 쌓은 벽이 우기 어느 날 템즈 강 진흙 속으로 빠져들자 경찰관은 이전보다 더 깊고 무거운 구동 말뚝 위에 재건하라고 명령했습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_142:0 "#G 완료#! — #high A 벽이 무너지고 더 강력하게 재건축됨#!\n#F A 새로 쌓은 벽이 우기 어느 날 템즈 강 진흙 속으로 빠져들었고, 경찰관은 이전보다 더 깊고 무거운 구동 말뚝 위에 재건하라고 명령했습니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_142:0 "[tv_wonder_ceremony|E]：벽이 무너지고 더 튼튼하게 재건되었습니다"
 TV_WONDER_CEREMONY_S7_DESC_142:0 "우기에 새로 세워진 벽이 템스강 진흙 속으로 들어가고 경찰관은 이전보다 더 깊고 무거운 더미 위에 재건하라는 명령을 내렸습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_142:0 "석공들은 더 깊은 말뚝을 박고 무너진 벽을 이전보다 더 강하게 들어 올립니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_142:0 "무너진 돌은 진흙 속에 묻혀 있고 재건축은 다음 시즌에 맡겨졌습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_142:0 "@tv_ceremony_military_panel!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_142:0 "#Y 진행 중#! — #high 요새가 수비되어 왕위에 올랐습니다.#!\n#F 수비대가 자리를 잡고 왕관의 예복이 성벽 안으로 옮겨지며 요새는 왕관 권력의 영구 거처로 봉헌됨에 따라 완성된 성채 위에 배너가 세워집니다. 런던과 왕국 전체에 걸쳐.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_142:0 "#G 완료#! — #high 요새가 수비되어 왕관을 쓰다#!\n#F 수비대가 자리를 잡고 왕관의 예복이 성벽 안으로 이동하며 요새는 왕관의 영구 자리로 봉헌됨에 따라 완성된 성채 위에 배너가 세워집니다. 런던과 왕국에 대한 권력.#!"
 TV_WONDER_CEREMONY_S8_TITLE_142:0 "[tv_wonder_ceremony|E]: 요새가 주둔하고 왕관을 쓰다"
 TV_WONDER_CEREMONY_S8_DESC_142:0 "수비대가 자리를 잡고 왕관의 예복이 성벽 안으로 옮겨지면서 완성된 성채 위에 깃발이 올라가고, 요새는 런던과 왕국에 대한 왕관 권력의 영구 거점으로 봉헌됩니다.\n\n#weak 의식을 완료하는 데 필요한 가격을 지불하세요. 결과적으로 불가사의의 최종 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_142:0 "마침내 요새가 왕관을 썼습니다!"
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_142:0 "깃발은 접혀 있고 수비대는 문 너머에 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_143:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_143:0 "#Y 진행 중#! — #high 주교가 새 대성당을 선포하다#!\n#F 파리의 주교는 시테 섬에 있는 오래된 대성당이 돌과 유리로 왕국에서 세워진 어떤 교회보다 더 위대한 교회로 대체될 것이라고 선언합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_143:0 "#G 완료#! — #high 주교가 새 대성당을 선포하다#!\n#F 파리의 주교는 시테 섬(Ile de la Cite)에 있는 오래된 대성당이 돌이든 유리든 왕국에서 세워진 어떤 교회보다 더 위대한 교회로 대체될 것이라고 선언합니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_143:0 "[tv_wonder_ceremony|E]：주교가 새 대성당을 선포하다"
 TV_WONDER_CEREMONY_S1_DESC_143:0 "파리의 주교는 Ile de la Cite에 있는 오래된 대성당이 돌과 유리를 모두 포함하여 왕국에서 세워진 그 어떤 교회보다 더 위대한 교회로 대체될 것이라고 선언합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_143:0 "선포되게 하소서!"
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_143:0 "감독은 자신의 선포를 잠시 동안 보류합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_143:0 "@tv_ceremony_building_default!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_143:0 "#Y 진행 중#! — #high 오래된 교회가 제거되었습니다#!\n#F 메이슨들은 섬에 있는 오래된 메로빙거 교회의 마지막 벽을 철거하고 학자들은 아직 세워지지 않은 대성당으로 번역하기 위해 유물 목록을 작성합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_143:0 "#G 완료#! — #high 오래된 교회가 제거되었습니다#!\n#F 메이슨들은 섬에 있는 오래된 메로빙거 교회의 마지막 벽을 철거하고 학자들은 아직 세워지지 않은 대성당으로 번역하기 위해 유물 목록을 작성합니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_143:0 "[tv_wonder_ceremony|E]：오래된 교회가 제거되었습니다"
 TV_WONDER_CEREMONY_S2_DESC_143:0 "석공은 섬에 있는 오래된 메로빙거 교회의 마지막 벽을 해체하고 학자들은 아직 세워지지 않은 대성당으로 번역하기 위해 유물 목록을 작성합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_143:0 "메이슨은 오래된 교회의 마지막 벽을 허물었습니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_143:0 "아직은 아닙니다. 오래된 벽을 그대로 두십시오!"
 TV_WONDER_CEREMONY_CARD_ICON_S3_143:0 "@tv_ceremony_holy_site!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_143:0 "#Y 진행 중#! — #high 기초석이 축복받았습니다#!\n#F 주교는 성직자, 학자, 왕실 관리들의 군중 앞에서 첫 번째 기초석을 축복하고 완성된 대성당이 헌납될 성모님께 기원합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_143:0 "#G 완료#! — #high 기초석이 축복받았습니다#!\n#F 주교는 성직자, 학자, 왕실 관리들의 군중 앞에서 첫 번째 기초석을 축복하고 완성된 대성당이 헌납될 성모님께 기원합니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_143:0 "[tv_wonder_ceremony|E]：기초석이 축복받았습니다"
 TV_WONDER_CEREMONY_S3_DESC_143:0 "주교는 성직자, 학자, 왕족 관리들 앞에서 첫 번째 초석을 축복하고 완성된 대성당을 봉헌할 성모님께 기원합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우에는 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_143:0 "우리는 성모님의 이름으로 이 돌을 놓았습니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_143:0 "감독은 돌의 축복을 연기합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_143:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_143:0 "#Y 진행 중#! — #high 합창단의 첫 번째 교각이 설정되었습니다#!\n#F Masons는 새로 파낸 기초에 합창단의 첫 번째 돌 교각을 설치했으며 수년간의 계획 끝에 대성당은 마침내 Ile de la 위로 솟아오른 눈에 띄는 작업이 되었습니다. Cite.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_143:0 "#G 완료#! — #high 합창단의 첫 번째 교각이 설정되었습니다#!\n#F Masons는 새로 파낸 기초에 합창단의 첫 번째 돌 교각을 설치했으며, 수년간의 계획 끝에 대성당은 마침내 Ile de la 위로 솟아오른 가시적인 작품이 되었습니다. Cite.#!"
 TV_WONDER_CEREMONY_S4_TITLE_143:0 "[tv_wonder_ceremony|E]：합창단의 첫 번째 교각이 설치되었습니다"
 TV_WONDER_CEREMONY_S4_DESC_143:0 "메이슨은 새로 파낸 기초에 합창단의 첫 번째 석조 기둥을 세웠고, 수년간의 계획 끝에 마침내 대성당은 시테 섬 위로 솟아오른 눈에 띄는 작품이 되었습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_143:0 "드디어 일어섰다!"
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_143:0 "우리는 아직 교각을 세울 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_143:0 "@tv_ceremony_advance!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_143:0 "#Y 진행 중#! — #high 플라잉 버트레스가 자세를 취합니다.#!\n#F 메이슨은 본당의 측면을 따라 대담한 플라잉 버트레스를 들어올립니다. 이는 파리가 알고 있는 어떤 교회보다 벽을 더 높고 얇게 올릴 수 있는 새로운 솔루션입니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_143:0 "#G 완료#! — #high 플라잉 버트레스가 자세를 취합니다.#!\n#F 메이슨은 본당의 측면을 따라 대담한 플라잉 버트레스를 올립니다. 이는 파리가 알고 있는 어떤 교회보다 벽을 더 높고 얇게 만들 수 있는 새로운 솔루션입니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_143:0 "[tv_wonder_ceremony|E]: 플라잉 버트리스가 자세를 취합니다"
 TV_WONDER_CEREMONY_S5_DESC_143:0 "석공들은 회중석의 측면을 따라 대담한 공중 부벽을 세웁니다. 이 새로운 솔루션은 파리가 알고 있는 어떤 교회보다 벽을 더 높고 얇게 만들 수 있습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_143:0 "메이슨들은 감히 비행 부벽을 제자리에 설치했습니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_143:0 "너무 대담하고 너무 이르다!"
 TV_WONDER_CEREMONY_CARD_ICON_S6_143:0 "@tv_ceremony_painting!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_143:0 "#Y 진행 중#! — #high 장미 창문이 유리로 설정되어 있습니다#!\n#F Glazier는 짙은 파란색과 진홍색 유리로 된 커다란 장미 창문에 딱 맞아 학자들이 이미 설교라고 부르는 다채로운 빛으로 본당을 가득 채웁니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_143:0 "#G 완료#! — #high 장미 창문이 유리로 설정되어 있습니다#!\n#F Glazier는 짙은 파란색과 진홍색 유리로 된 커다란 장미 창문에 딱 맞아 학자들이 이미 설교라고 부르는 다채로운 빛으로 본당을 가득 채웁니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_143:0 "[tv_wonder_ceremony|E]：장미창이 유리에 세팅되어 있습니다"
 TV_WONDER_CEREMONY_S6_DESC_143:0 "글레이저는 짙은 파란색과 진홍색 유리로 된 커다란 장미 창문을 달았고, 학자들이 이미 그 자체로 설교라고 부르는 다채로운 빛으로 본당을 가득 채웠습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_143:0 "우리는 빛 자체가 유리에서 전파되도록 할 것입니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_143:0 "글레이저들은 지금은 유리창을 옆으로 치워두었습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_143:0 "@tv_ceremony_warning_icon!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_143:0 "#Y 진행 중#! — #high 화재가 목재 지붕을 위협하다#!\n#F A 목수의 화로가 어느 겨울 밤 비계에 불을 붙였고, 세느강에서 양동이를 들고 필사적으로 일꾼들과 성직자들이 반쯤 완성된 지붕을 구해냈습니다. 파멸.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_143:0 "#G Completed#! — #high 불이 목재 지붕을 위협하다#!\n#F A 목수의 화로가 어느 겨울밤 비계에 불을 붙였고, 세느강에서 양동이를 들고 필사적으로 일꾼들과 성직자들이 반쯤 완성된 지붕을 구해냈습니다. 파멸.#!"
 TV_WONDER_CEREMONY_S7_TITLE_143:0 "[tv_wonder_ceremony|E]: 화재가 목재 지붕을 위협합니다."
 TV_WONDER_CEREMONY_S7_DESC_143:0 "어느 겨울밤, 목수의 화로가 비계에 불을 붙이고, 세느강에서 양동이를 들고 필사적으로 일꾼들과 성직자들이 반쯤 완성된 지붕을 파멸에서 구할 수 있습니다.\n\n#weak 예식을 다음 단계로 진행하는 데 필요한 대가를 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_143:0 "재로 뒤덮인 지붕보다는 그을린 손이 더 낫습니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_143:0 "이번 겨울에는 감히 지붕을 위험에 빠뜨릴 수 없습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_143:0 "@tv_ceremony_building_open!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_143:0 "#Y 진행 중#! — #high 노트르담이 봉헌됨#!\n#F 완성된 대성당이 왕, 성직자, 도시의 길드 앞에서 봉헌되고 노트르담은 영구 성당으로 서면서 종소리가 시테 섬을 가로질러 울립니다. 예술과 영역에 대한 헌신의 원천.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_143:0 "#G 완료#! — #high 노트르담이 봉헌되었습니다#!\n#F 완성된 대성당이 왕, 성직자 및 도시의 길드 앞에서 봉헌되고 노트르담이 영구 기념물로 서자 시테 섬을 가로질러 종소리가 울립니다. 예술과 영역에 대한 헌신의 원천.#!"
 TV_WONDER_CEREMONY_S8_TITLE_143:0 "[tv_wonder_ceremony|E]:노트르담이 봉헌되다"
 TV_WONDER_CEREMONY_S8_DESC_143:0 "완성된 대성당이 왕, 성직자, 도시의 길드 앞에서 봉헌되면서 시테 섬 전체에 종소리가 울리고, 노트르담은 이 왕국에 대한 예술과 헌신의 영구적인 원천으로 우뚝 서 있습니다.\n\n#weak 예식을 완료하는 데 필요한 가격을 지불하세요. 경이로운 최종 건물은 결과.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_143:0 "마침내 노트르담이 축성되자 종소리가 울립니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_143:0 "아직은 아닙니다. 종소리를 기다리도록 하세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S1_144:0 "@tv_ceremony_ruler!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_144:0 "#Y 진행 중#! — #high 차르가 승리의 대성당을 맹세하다#!\n#F 차르는 붉은 광장 앞에서 카잔에 대한 승리에 대한 감사의 마음으로 대성당이 세워질 것이라고 맹세하며, 그 예배당은 축일에 승리를 거둔 성인들에게 헌정됩니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_144:0 "#G 완료#! — #high 차르가 승리의 대성당을 맹세하다#!\n#F 차르는 붉은 광장 앞에서 카잔에 대한 승리에 대한 감사의 마음으로 대성당이 세워질 것이라고 맹세하며, 그 예배당은 승리를 거둔 축일에 성도들에게 헌정됩니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_144:0 "[tv_wonder_ceremony|E]: 차르가 승리의 대성당을 맹세하다"
 TV_WONDER_CEREMONY_S1_DESC_144:0 "차르는 붉은 광장 앞에서 카잔에 대한 승리에 대한 감사의 마음으로 성당을 세울 것이라고 맹세합니다. 그 예배당은 승리를 거둔 축일에 성도들에게 헌정됩니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_144:0 "차르는 붉은 광장 앞에서 왕관을 승리의 대성당에 묶는 서약을 합니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_144:0 "급히 한 서원은 두 번 갚은 빚이 된다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_144:0 "@tv_ceremony_artistic_skill_icon!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_144:0 "#Y 진행 중#! — #high 건축가들이 크렘린궁으로 소환됨#!\n#F 마스터 건축업자들은 차르 앞에 부름을 받아 Muscovy의 어떤 교회와도 다른 디자인을 선보였으며, 이전에는 러시아인에게서 볼 수 없었던 색상으로 장식된 예배당 클러스터를 약속합니다. 돔.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_144:0 "#G 완료#! — #high 건축가들이 크렘린궁으로 소환됨#!\n#F 마스터 건축업자들은 차르 앞에 부름을 받아 Muscovy의 어떤 교회와도 다른 디자인을 선보였으며, 이전에는 러시아인에게서 볼 수 없었던 색상으로 장식된 예배당 클러스터를 약속합니다. 돔.#!"
 TV_WONDER_CEREMONY_S2_TITLE_144:0 "[tv_wonder_ceremony|E]：건축가들은 크렘린궁으로 소환된다"
 TV_WONDER_CEREMONY_S2_DESC_144:0 "모스크바의 다른 교회와는 다른 디자인을 제시하기 위해 마스터 건축업자가 차르 앞에 부름을 받아 이전에 러시아 돔에서 볼 수 없었던 색상으로 장식된 예배당 클러스터를 약속합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_144:0 "우리는 마스터 빌더에게 Muscovy가 본 적이 없는 예배당을 세우도록 요청했습니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_144:0 "크렘린의 문은 소환된 건축가들에게 한동안 닫혀 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_144:0 "@tv_ceremony_location!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_144:0 "#Y 진행 중#! — #high 붉은 광장 부지가 정리되었습니다.#!\n#F 붉은 광장 가장자리에 있던 오래된 삼위일체 교회와 시장 노점이 정리되고, 신부들은 새 대성당의 많은 예배당이 서 있을 맨땅을 축복합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_144:0 "#G 완료#! — #high 붉은 광장 부지가 정리되었습니다.#!\n#F 붉은 광장 가장자리에 있던 오래된 삼위일체 교회와 시장 노점이 정리되고, 신부들은 새 대성당의 많은 예배당이 서 있을 맨땅을 축복합니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_144:0 "[tv_wonder_ceremony|E]：붉은 광장의 사이트가 삭제되었습니다"
 TV_WONDER_CEREMONY_S3_DESC_144:0 "붉은 광장 가장자리에 있는 오래된 삼위일체 교회와 시장 노점이 치워지고, 신부들은 새 대성당의 많은 예배당이 서 있을 맨땅을 축복합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_144:0 "노동자들은 오래된 교회와 가판대를 치우고, 성직자들은 그곳에 일어날 일에 대해 맨땅을 축복합니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_144:0 "나는 아직 시장 가판대와 철거된 오래된 교회에 입찰할 수 없습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_144:0 "@tv_ceremony_holy_site!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_144:0 "#Y 진행 중#! — #high 중앙 예배당의 기초가 파헤쳐지고 있습니다#!\n#F 파는 사람들이 중보기도의 높은 중앙 예배당을 위한 기초 참호를 자르고 몇 달 간의 서약 끝에 대성당은 마침내 붉은 광장의 원시 흙의 상처가 되었습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_144:0 "#G 완료#! — #high 중앙 예배당의 기초가 파헤쳐졌습니다#!\n#F 파는 사람들이 중보기도의 높은 중앙 예배당을 위한 기초 참호를 팠고 몇 달 간의 서약 끝에 대성당은 마침내 붉은 광장에서 원시 흙의 상처가 되었습니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_144:0 "[tv_wonder_ceremony|E]：중앙 예배당의 기초가 파여있습니다"
 TV_WONDER_CEREMONY_S4_DESC_144:0 "발굴자들은 중보기도의 높은 중앙 예배당을 위한 기초 참호를 자르고 몇 달 간의 서약 끝에 대성당은 마침내 붉은 광장의 원시 흙의 상처가 되었습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하십시오. 아니면 아직 때가 되지 않은 경우에는 기다리십시오.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_144:0 "굴착기들은 붉은 광장에 깊은 참호를 파서 중앙 예배당의 기초를 놓을 땅을 열었습니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_144:0 "붉은 광장의 땅은 사람의 손길 없이 그대로 놓여 있고 참호는 아직 개방되지 않았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_144:0 "@tv_ceremony_building_levels!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_144:0 "#Y 진행 중#! — #high 중앙을 중심으로 8개의 예배당이 솟아있습니다.#!\n#F 8개의 작은 예배당이 높은 중앙 탑 주위에 벽돌 하나하나 솟아 있는데, 각각 모양과 크기가 다르며 카잔으로 가는 길에서 승리한 각 전투의 성인들을 기립니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_144:0 "#G 완료#! — #high 중앙 주위에 8개의 예배당이 솟아있습니다.#!\n#F 8개의 작은 예배당이 높은 중앙 탑 주위에 벽돌 하나하나 솟아 있는데, 각각 모양과 크기가 다르며 카잔으로 가는 길에서 승리한 각 전투의 성인들을 기립니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_144:0 "[tv_wonder_ceremony|E]：중앙을 중심으로 8개의 예배당이 우뚝 솟아 있습니다."
 TV_WONDER_CEREMONY_S5_DESC_144:0 "8개의 작은 예배당이 높은 중앙 탑 주위에 벽돌 하나하나 솟아 있는데, 각각 모양과 크기가 다르며 카잔으로 가는 길에서 승리한 각 전투의 성인들을 기립니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_144:0 "우리는 탑 주변에 8개의 예배당을 세웁니다. 축일에 우리에게 승리를 안겨준 모든 성인을 기념하기 위한 것입니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_144:0 "8개의 예배당은 아직 건축되지 않은 채 남아 있고, 카잔 전투의 성자들은 명예 없이 기다리고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_144:0 "@tv_ceremony_painting!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_144:0 "#Y 진행 중#! — #high 양파 돔은 다양한 색상으로 장식되어 있습니다#!\n#F 장인들이 각 예배당에 구근 모양의 돔을 장식하고 금색, 녹색 및 나선형 색상의 패턴으로 칠하고 금박을 입혀 대성당을 모스크바의 다른 어떤 것과도 비교할 수 없게 만듭니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_144:0 "#G 완료#! — #high 양파 돔은 다양한 색상으로 장식되어 있습니다#!\n#F 장인들은 각 예배당에 구근 모양의 돔을 장식하고 금색, 녹색 및 나선형 색상의 패턴으로 칠하고 금박을 입혀 대성당을 다른 어떤 것과도 비교할 수 없게 만듭니다. 모스크바.#!"
 TV_WONDER_CEREMONY_S6_TITLE_144:0 "[tv_wonder_ceremony|E]:양파 돔은 색상으로 장식되어 있습니다."
 TV_WONDER_CEREMONY_S6_DESC_144:0 "장인들이 각 예배당에 구근 모양의 돔을 씌우고 금색, 녹색, 나선형 색상의 패턴으로 칠하고 도금하여 모스크바의 다른 성당과 비교할 수 없는 이 성당을 만들어줍니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우에는 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_144:0 "장인들은 각 돔에 금을 입히고 페인트를 칠하여 모스크바가 결코 알지 못했던 색상으로 예배당을 장식합니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_144:0 "나는 아직 돔이 칠해진 것을 보지 못할 것입니다. 금색과 녹색을 기다리게 하세요."
 TV_WONDER_CEREMONY_CARD_ICON_S7_144:0 "@tv_ceremony_frozen!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_144:0 "#Y 진행 중#! — #high A 서리 후 재건된 돔#!\n#F A 새로 타일을 붙인 돔 중 하나가 완성되기 전에 심한 서리로 인해 균열이 생기고, 장인들은 다음 봄까지 성당 봉헌식 전에 그것을 다시 만들기 위해 노력합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_144:0 "#G Completed#! — #high A Frost 후 재건된 돔#!\n#F A 굳은 서리로 인해 새로 타일을 붙인 돔 중 하나가 완성되기 전에 갈라지고, 장인들은 다음 봄까지 대성당 봉헌식 전에 그것을 다시 만들기 위해 노력합니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_144:0 "[tv_wonder_ceremony|E]: 서리가 내린 후 재건된 돔"
 TV_WONDER_CEREMONY_S7_DESC_144:0 "새로 타일을 붙인 돔 중 하나가 완성되기 전에 심한 서리로 인해 금이 가고, 장인들은 대성당 봉헌식 전에 돔을 다시 만들기 위해 이듬해 봄까지 노력합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_144:0 "장인들은 봄철 해빙 기간 동안 노동을 하며 서리로 인해 갈라진 돔을 다시 만듭니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_144:0 "금이 간 돔은 서리로 인해 갈라진 채로 남아 있으며, 수리는 다음 시즌으로 연기됩니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_144:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_144:0 "#Y 진행 중#! — #high 중보 대성당이 봉헌되었습니다#!\n#F 성직자들이 차르의 면전에서 완성된 대성당을 봉헌하는 동안 종소리가 붉은 광장을 가로질러 울리고, 그 틀림없는 돔은 왕관의 영구 표시로 영원히 서 있습니다. 성화된 권위.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_144:0 "#G 완료#! — #high 중보 대성당이 봉헌되었습니다#!\n#F 성직자들이 차르의 면전에서 완성된 대성당을 봉헌하는 동안 종소리가 붉은 광장을 가로질러 울리고, 틀림없이 돔은 왕관의 영구 표시로 영원히 서 있습니다. 성화된 권위.#!"
 TV_WONDER_CEREMONY_S8_TITLE_144:0 "[tv_wonder_ceremony|E]：중보성당이 축성되었습니다"
 TV_WONDER_CEREMONY_S8_DESC_144:0 "성직자들이 차르 앞에서 완성된 대성당을 봉헌하는 동안 종소리가 붉은 광장 전체에 울려 퍼지고, 틀림없는 돔은 왕관의 신성한 권위를 영구적으로 상징하는 표시로 영원히 서 있습니다.\n\n#weak 식을 완료하는 데 필요한 가격을 지불하세요. 결과적으로 불가사의의 최종 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_144:0 "마침내 봉헌되었습니다!"
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_144:0 "붉은 광장의 종소리는 한동안 조용하고, 대성당은 봉헌식을 기다리고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_145:0 "@tv_ceremony_clergy!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_145:0 "#Y 진행 중#! — #high 수도원장의 축복으로 Lavra가 발견됨#!\n#F 수도원장의 의회는 성 세르기우스의 은둔지가 거대한 요새화된 라브라로 세워질 것이라고 선언합니다. 그 벽은 수도사와 원고 모두를 보호하기 위한 것입니다. 그 너머의 혼란.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_145:0 "#G 완료#! — #high 대수도원장의 축복으로 Lavra가 발견됨#!\n#F 대수도원장의 의회는 성 세르기우스의 암자를 거대한 요새화된 라브라로 건설할 것이라고 선언합니다. 그 벽은 수도사와 원고 모두를 보호하기 위한 것입니다. 그 너머의 혼란.#!"
 TV_WONDER_CEREMONY_S1_TITLE_145:0 "[tv_wonder_ceremony|E]：원장의 축복으로 라브라가 발견됨"
 TV_WONDER_CEREMONY_S1_DESC_145:0 "수도원장의 평의회는 성 세르지오의 암자를 거대한 요새화된 용암으로 건설할 것이라고 선언합니다. 그 성벽은 그 너머의 혼란으로부터 승려와 원고 모두를 보호하기 위한 것입니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 대가를 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_145:0 "대수도원장의 말씀대로 시작됩니다!"
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_145:0 "의회는 한동안 축복을 보류합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_145:0 "@tv_ceremony_laborers!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_145:0 "#Y 진행 중#! — #high 숲에서 목재와 돌을 모으다#!\n#F 나무꾼과 채석공은 주변 숲에서 목재와 돌을 가져오고, 이미 암자에 도착한 순례자들은 축복의 대가로 노동을 빌려줍니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_145:0 "#G 완료#! — #high 숲에서 수집된 목재와 돌#!\n#F 나무꾼과 채석공은 주변 숲에서 목재와 돌을 가져오고, 이미 암자에 도착한 순례자들은 축복의 대가로 노동을 빌려줍니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_145:0 "[tv_wonder_ceremony|E]: 목재와 돌은 숲에서 채취됩니다"
 TV_WONDER_CEREMONY_S2_DESC_145:0 "나무꾼과 채석공은 주변 숲에서 목재와 돌을 가져오고, 이미 암자에 도착한 순례자들은 축복의 대가로 노동력을 빌려줍니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_145:0 "나무꾼들은 첫 번째 목재를 암자를 향해 운반합니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_145:0 "아직은 아닙니다. 숲이 기다리도록 하세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S3_145:0 "@tv_ceremony_agenda!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_145:0 "#Y 진행 중#! — #high 승려들이 회랑 계획을 그립니다.#!\n#F 고위 승려들은 회랑, 기록실, 식당에 대한 계획을 세웁니다. 휴식.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_145:0 "#G 완료#! — #high 승려들이 회랑 계획을 그립니다.#!\n#F 고위 승려들은 수도원의 가장 신성한 유물이 방어되지 않은 중심부에 벽으로 둘러싸여 있는지 조심하면서 회랑, 기록실, 식당에 대한 계획을 세웁니다. 휴식.#!"
 TV_WONDER_CEREMONY_S3_TITLE_145:0 "[tv_wonder_ceremony|E]：수도사들이 회랑 설계도를 그리다"
 TV_WONDER_CEREMONY_S3_DESC_145:0 "선임 승려들은 수도원의 가장 성스러운 유물이 나머지 부분에 의해 벽으로 둘러싸인 무방비 상태로 수도원 중심부에 놓이도록 주의하면서 회랑, 문서실 및 식당에 대한 계획을 세웁니다. \n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하거나 아직 때가 되지 않은 경우 기다립니다.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_145:0 "우리는 유물을 우리 계획의 중심에 두었습니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_145:0 "승려들은 반쯤 그려진 계획을 제쳐두었습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_145:0 "@tv_ceremony_defensive_military_stance!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_145:0 "#Y 진행 중#! — #high 요새 벽이 무너졌습니다#!\n#F 메이슨들은 수도원 외벽의 첫 번째 코스를 놓기 시작하고 성 세르지오의 암자는 나무 셀 클러스터에서 진정한 신앙의 요새로 변모하기 시작합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_145:0 "#G 완료#! — #high 요새 벽이 무너졌습니다#!\n#F 메이슨은 수도원 외벽의 첫 번째 코스를 놓기 시작하고 성 세르지오의 암자는 나무 셀 클러스터에서 진정한 신앙의 요새로 변모하기 시작합니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_145:0 "[tv_wonder_ceremony|E]: 성벽이 착공되었습니다"
 TV_WONDER_CEREMONY_S4_DESC_145:0 "메이슨은 수도원 외벽의 첫 번째 코스를 놓기 시작하고 성 세르지오의 암자는 나무 셀 클러스터에서 진정한 신앙의 요새로 변모하기 시작합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_145:0 "돌 위에 돌을 쌓으면 벽이 솟아오른다!"
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_145:0 "석공들은 지금은 도구를 내려놓았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_145:0 "@tv_ceremony_writer!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_145:0 "#Y 진행 중#! — #high 문서실의 선반은 원고로 가득 차 있습니다#!\n#F 승려들은 새 문서실에서 원고를 복사하고 조명하며, 라브라의 도서관이 곧 다른 어떤 것과도 경쟁할 것이라는 소문이 퍼집니다. Muscovy.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_145:0 "#G 완료#! — #high 문서로 가득 찬 서가 선반#!\n#F 승려들은 새 문서에서 원고를 계속해서 복사하고 조명하며, 라브라의 도서관이 곧 다른 어떤 것과도 경쟁할 것이라는 소문이 퍼집니다. Muscovy.#!"
 TV_WONDER_CEREMONY_S5_TITLE_145:0 "[tv_wonder_ceremony|E]：문서실의 선반은 원고로 가득 차 있습니다"
 TV_WONDER_CEREMONY_S5_DESC_145:0 "승려들은 새 문서실에서 여러 원고를 복사하고 조명하며, 라브라의 도서관이 곧 Muscovy의 다른 도서관과 경쟁하게 될 것이라는 소문이 퍼집니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_145:0 "승려들은 조명이 켜진 페이지 위에 다시 몸을 구부립니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_145:0 "잉크를 조금 더 건조시키세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S6_145:0 "@tv_ceremony_building_levels!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_145:0 "#Y 진행 중#! — #high 회랑 위로 솟아오른 종탑#!\n#F A 높은 종탑은 완성된 회랑 위로 올라가고, 청동 종은 현장에서 주조되어 매달리기 전에 축복을 받기 때문에 첫 번째 소리는 이미 신성할 것입니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_145:0 "#G 완료#! — #high 회랑 위로 솟아오른 종탑#!\n#F A 높은 종탑은 완성된 회랑 위로 올라가고, 청동 종은 현장에서 주조되어 매달리기 전에 축복을 받기 때문에 첫 번째 소리는 이미 신성할 것입니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_145:0 "[tv_wonder_ceremony|E]：회랑 위로 솟아오른 종탑"
 TV_WONDER_CEREMONY_S6_DESC_145:0 "높은 종탑이 완성된 회랑 위로 올라가고, 청동 종은 현장에서 주조되어 매달리기 전에 축복을 받기 때문에 첫 번째 소리는 이미 신성한 것입니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_145:0 "우리는 이 종들이 울리기 전에 축복합니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_145:0 "창립자들은 청동 종을 주조하지 않은 상태로 둡니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_145:0 "@tv_ceremony_warning_icon!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_145:0 "#Y 진행 중#! — #high 포위 공격을 견디는 성벽#!\n#F A 적대 세력이 어느 혹독한 겨울에 젊은 요새 성벽을 시험하고, 오직 수도원의 새로 완성된 방어 시설과 그곳에 주둔한 승려들만이 포위 공격을 통해 라브라를 지키고 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_145:0 "#G 완료#! — #high 포위 공격을 견디는 성벽#!\n#F A 적대 세력이 어느 혹독한 겨울에 어린 요새 성벽을 시험하고, 오직 수도원의 새로 완성된 방어 시설과 그곳에 주둔한 승려들만이 라브라를 지켜내고 있습니다. 공성전.#!"
 TV_WONDER_CEREMONY_S7_TITLE_145:0 "[tv_wonder_ceremony|E]: 성벽은 포위 공격을 견뎌냅니다."
 TV_WONDER_CEREMONY_S7_DESC_145:0 "어느 혹독한 겨울에 적군이 젊은 요새 성벽을 시험하고, 새로 완성된 수도원의 방어 시설과 주둔 중인 승려들만이 포위 공격 속에서 라브라를 지키고 있습니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_145:0 "벽을 지켜라, 라브라는 견디느니라!"
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_145:0 "아직은 우리의 방어력을 감히 시험할 수 없습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_145:0 "@tv_ceremony_holy_site!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_145:0 "#Y 진행 중#! — #high 삼위일체 라브라 서 완성됨#!\n#F 라브라가 완성되고 기록실과 벽이 모두 봉헌되자 종소리가 요새화된 회랑을 가로질러 울립니다. 그리고 성 세르지오의 기초는 배움과 학문의 영구적인 원천이 됩니다. 왕국을 위한 헌신.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_145:0 "#G 완료#! — #high 삼위일체 라브라 서 완성#!\n#F 라브라가 완성되고 기록실과 벽이 모두 봉헌되자 종소리가 요새화된 회랑을 가로질러 울립니다. 성 세르지오의 기초는 배움과 학문의 영구적인 원천이 됩니다. 왕국을 위한 헌신.#!"
 TV_WONDER_CEREMONY_S8_TITLE_145:0 "[tv_wonder_ceremony|E]: 삼위일체 라브라가 완성되었습니다"
 TV_WONDER_CEREMONY_S8_DESC_145:0 "라브라가 완성되고, 문서실과 벽이 모두 봉헌되고, 성 세르지오의 기초가 왕국에 대한 배움과 헌신의 영구적인 원천이 되면서 요새화된 회랑에 종소리가 울립니다.\n\n#weak 의식을 완료하는 데 필요한 가격을 지불하세요. 그 결과 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_145:0 "라브라가 완성되면 종소리가 울립니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_145:0 "아직은 아닙니다. 봉헌을 기다리십시오!"
 TV_WONDER_CEREMONY_CARD_ICON_S1_146:0 "@tv_ceremony_diplomacy!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_146:0 "#Y 진행 중#! — #high 법원이 네바에 궁전 건축을 의뢰#!\n#F 법원이 네바 제방에 새 궁전을 건축 의뢰했는데, 이는 외국 대사들이 외관만으로 왕국의 권력을 판단할 만큼 웅장합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_146:0 "#G 완료#! — #high 법원이 네바(Neva)에 궁전 건설을 의뢰합니다#!\n#F 법원이 네바(Neva) 제방에 새 궁전을 의뢰합니다. 이 궁전은 외국 대사들이 그 외관만으로 왕국의 권력을 판단할 만큼 충분히 웅장합니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_146:0 "[tv_wonder_ceremony|E]: 법원이 네바 강에 궁전을 건설하도록 의뢰하다"
 TV_WONDER_CEREMONY_S1_DESC_146:0 "법원은 네바 강 제방에 새로운 궁전 건설을 의뢰합니다. 이 궁전은 외국 대사들이 그 외관만으로 왕국의 권력을 판단할 만큼 충분히 웅장합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_146:0 "법원은 Neva의 가장 큰 위원회에 명성을 걸고 법령에 서명합니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_146:0 "서둘러 지은 궁전은 완성되기도 전에 무너진다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_146:0 "@tv_ceremony_location!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_146:0 "#Y 진행 중#! — #high 궁전을 위해 제방이 정리되었습니다#!\n#F 제방을 따라 있던 오래된 목조 주택이 철거되었으며 측량사들은 네바강의 차가운 물을 배경으로 궁전의 광대한 발자국을 표시했습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_146:0 "#G 완료#! — #high 궁전을 위해 제방이 제거되었습니다#!\n#F 제방을 따라 있던 오래된 목조 주택이 제거되었으며 측량사들은 네바강의 차가운 물을 배경으로 궁전의 광대한 발자국을 표시했습니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_146:0 "[tv_wonder_ceremony|E]：궁전을 위해 제방이 정리되었습니다"
 TV_WONDER_CEREMONY_S2_DESC_146:0 "제방을 따라 있는 오래된 목조 주택이 제거되고 측량사들은 네바 강의 차가운 물을 배경으로 궁전의 광대한 발자국을 표시합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_146:0 "우리는 오래된 목재를 정리하고 제방에 필요한 금액을 지불할 것입니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_146:0 "측량사들은 잠시 멈춰 오래된 집들을 조금 더 세워두었습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_146:0 "@tv_ceremony_artistic_skill_icon!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_146:0 "#Y 진행 중#! — #high 궁정 건축가가 외관을 선보입니다#!\n#F 궁정 건축가는 유럽의 어떤 궁전과도 견줄 만한 녹색과 흰색의 외관을 선보이고, 황후는 왕국에서 가장 웅장한 리셉션을 주최할 홀을 직접 표시합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_146:0 "#G 완료#! — #high 궁정 건축가가 외관을 선보입니다#!\n#F 궁정 건축가는 유럽의 어떤 궁전과도 견줄 만한 녹색과 흰색의 외관을 선보이고, 황후는 왕국에서 가장 웅장한 리셉션을 주최할 홀을 직접 표시합니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_146:0 "[tv_wonder_ceremony|E]: 법원 건축가가 외관을 선보입니다."
 TV_WONDER_CEREMONY_S3_DESC_146:0 "궁정 건축가는 유럽의 어떤 궁전과도 견줄 수 있는 녹색과 흰색의 외관을 제시하고, 황후는 어느 홀에서 왕국의 가장 웅장한 리셉션이 열릴지 직접 표시합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_146:0 "법원은 세상에 보여주는 얼굴로 판단됩니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_146:0 "우리는 아직 외국의 눈으로 우리의 모습을 평가할 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_146:0 "@tv_ceremony_river!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_146:0 "#Y 진행 중#! — #high 토대가 습지에 박혀있습니다#!\n#F 노동자들은 네바의 습지대 깊숙이 첫 번째 더미를 쌓았고, 몇 달 간의 도면과 법령 끝에 궁전은 마침내 진짜 목재와 돌이 되었습니다. 진흙.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_146:0 "#G 완료#! — #high 토대가 습지에 박혀있습니다#!\n#F 노동자들이 네바의 습지대 깊숙이 첫 번째 더미를 쌓았고, 몇 달 간의 도면과 법령 끝에 궁전은 마침내 진짜 목재와 돌이 되었습니다. 진흙.#!"
 TV_WONDER_CEREMONY_S4_TITLE_146:0 "[tv_wonder_ceremony|E]: 재단이 습지 속으로 밀려나다"
 TV_WONDER_CEREMONY_S4_DESC_146:0 "인부들이 네바의 습지 둑에 첫 번째 말뚝을 박고 몇 달 간의 그림과 법령을 거친 후 마침내 궁전은 진흙에서 솟아오르는 실제 목재와 돌이 되었습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_146:0 "노동자들은 더미를 집으로 가져가고, 법령은 마침내 목재와 돌이 됩니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_146:0 "시대 이전에는 어떤 기초도 굳건히 서 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_146:0 "@tv_ceremony_building_levels!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_146:0 "#Y 진행 중#! — #high 그랜드 홀의 모양이 바뀌다#!\n#F 그랜드 리셉션 홀의 벽이 비계 아래로 솟아오른 뒤, 그 비율은 이미 방문하는 건축가들로부터 서쪽의 가장 훌륭한 궁정까지 비교되고 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_146:0 "#G 완성#! — #high 그랜드 홀의 형태#!\n#F 대형 리셉션 홀의 벽이 비계 아래로 솟아올라 있으며, 그 비율은 이미 방문하는 건축가들로부터 서쪽의 가장 훌륭한 법원까지 비교되고 있습니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_146:0 "[tv_wonder_ceremony|E]:그랜드 홀의 모습"
 TV_WONDER_CEREMONY_S5_DESC_146:0 "대형 리셉션 홀의 벽은 비계 아래 높이 솟아 있으며, 그 비율은 이미 방문하는 건축가들로부터 서쪽의 가장 훌륭한 안뜰에 이르기까지 비교 대상이 되고 있습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_146:0 "우리는 서쪽의 어떤 궁정도 우리 자신보다 빛날 때까지 이 홀을 세웁니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_146:0 "다음 벽이 올라가기 전까지 비계는 한동안 유휴 상태로 서 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_146:0 "@tv_ceremony_gold!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_146:0 "#Y 진행 중#! — #high 금박을 입힌 인테리어가 자리 잡았습니다.#!\n#F 장인들은 금박 몰딩, 거울 패널, 수입 대리석을 완성된 홀에 장착하여 궁전의 내부를 야심찬 외관과 일치하도록 비용을 아끼지 않습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_146:0 "#G 완성#! — #high 금박을 입힌 인테리어가 제자리에 놓였습니다.#!\n#F 장인들은 금박 몰딩, 거울 패널, 수입 대리석을 완성된 홀에 장착하여 궁전의 내부를 야심 찬 외관과 일치하도록 비용을 아끼지 않습니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_146:0 "[tv_wonder_ceremony|E]:금박 인테리어가 제자리에 자리잡고 있습니다."
 TV_WONDER_CEREMONY_S6_DESC_146:0 "장인들은 금도금 몰딩, 거울 패널, 수입 대리석을 완성된 홀에 설치하고 궁전 내부를 야심 찬 외관과 일치시키기 위해 비용을 아끼지 않습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우에는 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_146:0 "장인들은 비용을 아끼지 않고 눈에 보이는 모든 몰딩과 패널에 금을 입힙니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_146:0 "우리는 거울과 대리석을 위해 금고를 열 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_146:0 "@tv_ceremony_warning_icon!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_146:0 "#Y 진행 중#! — #high A 겨울 홍수로 토대를 위협하다#!\n#F 네바는 어느 혹독한 겨울에 제방 위로 부풀어 오르고 새로운 토대를 찰싹 때리며 엔지니어들은 궁전이 건설되기 전에 얼어붙은 물을 뚫고 제방을 강화합니다. 완료되었습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_146:0 "#G 완료#! — #high A 겨울 홍수로 토대를 위협하다#!\n#F 네바는 어느 혹독한 겨울에 제방 위로 부풀어 오르고 새로운 토대를 찰싹 때리며 엔지니어들은 궁전이 건설되기 전에 얼어붙은 물을 뚫고 제방을 강화합니다. 완료되었습니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_146:0 "[tv_wonder_ceremony|E]: 겨울 홍수가 재단을 위협합니다"
 TV_WONDER_CEREMONY_S7_DESC_146:0 "어느 혹독한 겨울, 네바 강은 제방 위로 부풀어올라 새로운 토대를 덮고 엔지니어들은 궁전이 완공되기 전에 얼어붙는 물 속에서 제방을 보강하기 위해 노력합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_146:0 "엔지니어들은 홍수에 대비해 제방을 지키기 위해 얼어붙은 네바 강으로 걸어 들어갔습니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_146:0 "가장 강력한 강조차도 겨울의 인내심에 굴복합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_146:0 "@tv_ceremony_building_open!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_146:0 "#Y 진행 중#! — #high 겨울 궁전이 문을 열다#!\n#F 마차는 법원, 외국 사절, 도시의 귀족 군중이 첫 번째 대접을 위해 완성된 궁전으로 들어와 제방을 따라 늘어서 있으며, 겨울 궁전은 왕국 황실의 영구 자리로 서 있습니다. 프레스티지.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_146:0 "#G 완료#! — #high 겨울 궁전이 문을 열다#!\n#F 마차는 법원, 외국 사절, 도시의 귀족 군중이 첫 번째 대접을 위해 완성된 궁전으로 들어와 제방을 따라 늘어서 있으며, 겨울 궁전은 왕국의 영구 자리로 서 있습니다. 제국의 명성.#!"
 TV_WONDER_CEREMONY_S8_TITLE_146:0 "[tv_wonder_ceremony|E]：겨울궁전이 문을 열다"
 TV_WONDER_CEREMONY_S8_DESC_146:0 "첫 번째 대접을 위해 마차가 제방에 줄지어 궁정, 외국 사절, 도시의 귀족들이 완성된 궁전으로 모여 첫 번째 대접을 받고, 겨울 궁전은 왕국 제국의 위신을 상징하는 영구 자리로 우뚝 서 있습니다.\n\n#weak 식을 완료하는 데 필요한 가격을 지불하세요. 결과적으로 불가사의의 최종 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_146:0 "우리는 이 문을 열고 세계가 우리 제국의 영원한 영광을 목격하도록 합시다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_146:0 "마차는 문이 마침내 열릴 때까지 조금 더 기다립니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_147:0 "@tv_ceremony_government!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_147:0 "#Y 진행 중#! — #high A 남부 수도에 대한 위임장#!\n#F 왕좌는 북악산 기슭에 새로운 왕실이 세워질 것이라고 선언하며, 그 문과 안뜰은 왕조의 위임에 걸맞는 단일 개선축을 따라 배치됩니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_147:0 "#G 완료#! — #high A 남부 수도에 대한 위임장#!\n#F 왕좌는 북악산 기슭에 새로운 왕실이 세워질 것이라고 선언하며, 그 문과 안뜰은 왕조의 위임에 걸맞는 단일 개선축을 따라 배치됩니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_147:0 "[tv_wonder_ceremony|E]：남부 수도에 대한 위임장"
 TV_WONDER_CEREMONY_S1_DESC_147:0 "왕좌는 북각산 기슭에 새로운 왕실이 세워질 것이라고 선언하며, 그 문과 안뜰은 왕조의 명령에 걸맞는 단일 승리 축을 따라 배치됩니다. 법원 관리들은 올해가 가기 전에 궁전의 첫 번째 계획 초안을 작성하라는 명령을 받았습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 비용을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_147:0 "우리는 북악산 기슭에 새로운 왕위가 세워지리라 선포합니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_147:0 "법원 관리들은 초안을 제쳐두었지만 명령은 아직 선포되지 않았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_147:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_147:0 "#Y 진행 중#! — #high 지오맨서 능선을 걷다#!\n#F 궁정 풍수사가 풍수 원리에 따라 산과 강의 흐름을 따라 그 자리에 축복을 내리며 미래의 궁전 위의 경사면을 걷는다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_147:0 "#G 완료#! — #high 풍수사 능선을 걷다#!\n#F 궁정 풍수사는 풍수 원리에 따라 산과 강의 흐름을 따라 그 자리를 축복하기 위해 미래의 궁전 위의 경사면을 걷는다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_147:0 "[tv_wonder_ceremony|E]：지오맨서들이 능선을 걷다"
 TV_WONDER_CEREMONY_S2_DESC_147:0 "궁정 풍수사는 풍수 원리에 따라 산과 강의 흐름을 따라 그 자리를 축복하기 위해 미래의 궁전 위의 경사면을 걷습니다. 표지판이 호의적인 것으로 읽혀질 때만 왕의 의회는 목재와 석재에 대한 자금을 풀어줍니다.\n\n#weak 의례를 다음 단계로 진행하는 데 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_147:0 "풍수사는 그 장소가 축복받았다고 선언하고 의회의 금고는 목재와 석재를 위해 열려있습니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_147:0 "징조가 더 확실하게 판독될 때까지 기다리겠습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_147:0 "@tv_ceremony_river!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_147:0 "#Y 진행중#! — #high 한강에 뗏목을 싣는다#!\n#F 북부 지방에서 벌목된 소나무를 뗏목에 묶어 한강으로 띄우고, 주변 시골에서 코비 인부들을 소집한다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_147:0 "#G 완료#! — #high 한강에 뗏목을 싣는다#!\n#F 북부 지방에서 벌목된 소나무를 뗏목에 묶어 한강으로 띄우고, 주변 시골에서 코비 인부들을 소집한다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_147:0 "[tv_wonder_ceremony|E]：한강을 따라 흐르는 목재 뗏목"
 TV_WONDER_CEREMONY_S3_DESC_147:0 "북부 지역에서 벌목된 소나무는 뗏목에 묶여 한강으로 흘러가고, 주변 시골에서는 코비 인부들이 소집됩니다. 궁전의 기초석을 공급하기 위해 수도 근처의 화강암 채석장이 문을 열었습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_147:0 "지방에서 노동자들이 모여들자 소나무 뗏목이 한강을 따라 미끄러져 내려갑니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_147:0 "뗏목은 정박되어 있고 소집 호출은 한동안 응답이 없는 상태로 기다립니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_147:0 "@tv_ceremony_city_capital!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_147:0 "#Y 진행중#! — #high 기초석이 놓였습니다#!\n#F 북악산 앞에서 공사진행자들이 착공하여 광화문과 그 너머 홀의 첫 번째 초석을 놓았습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_147:0 "#G 완료#! — #high 기초석이 놓였다#!\n#F 작업자들이 북악산 앞에서 착공하여 광화문과 그 너머 홀의 첫 번째 초석을 놓았습니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_147:0 "[tv_wonder_ceremony|E]：기초석이 놓이다"
 TV_WONDER_CEREMONY_S4_DESC_147:0 "인부들이 북악산 앞에서 착공하여 광화문과 그 너머 홀의 첫 번째 초석을 놓는다. 종이에 적힌 계획은 목재 비계와 돌 위에 끌로 만든 고리로 대체됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_147:0 "마침내 땅이 무너졌습니다!"
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_147:0 "측량사들은 북악산 앞에 머물며 그곳의 대지는 아직 굽어지지 않은 채로 남아 있다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_147:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_147:0 "#Y 진행중#! — #high 광화문이 형태를 갖추다#!\n#F 남쪽 대문은 층층이 쌓여 있고, 화강암 기반은 유약을 바른 정자 지붕을 지탱하고 있다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_147:0 "#G 완성#! — #high 광화문이 형태를 취하다#!\n#F 남쪽 대문은 층층이 쌓여 있고, 화강암 기반은 유약을 바른 누각 지붕을 지탱하고 있다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_147:0 "[tv_wonder_ceremony|E]：광화문이 모습을 갖추다"
 TV_WONDER_CEREMONY_S5_DESC_147:0 "남쪽의 거대한 대문은 한 층 더 솟아 있으며, 화강암 기반은 유약 타일로 된 파빌리온 지붕을 지탱하고 있습니다. 석공들은 화재와 불행으로부터 문지방을 지킬 해태를 조각합니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우에는 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_147:0 "석공들이 문턱에 해태를 깎으면서 광화문은 층층이 높아집니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_147:0 "아직은 아닙니다!"
 TV_WONDER_CEREMONY_CARD_ICON_S6_147:0 "@tv_ceremony_painting!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_147:0 "#Y 진행중#! — #high 알현실의 채색된 들보#!\n#F 근정전 내부에서는 목수들이 알현실의 이중 지붕을 지탱할 대들보를 올리고, 화가들은 곳곳에 파란색, 빨간색, 금색의 단청 무늬를 시작합니다. 처마.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_147:0 "#G 완료#! — #high 왕궁의 채색된 들보#!\n#F 근정전 내부에서는 목수들이 왕좌의 이중 지붕을 지탱할 대들보를 세우고, 화가들은 곳곳에 파란색, 빨간색, 금색의 단청 무늬를 시작합니다. 처마.#!"
 TV_WONDER_CEREMONY_S6_TITLE_147:0 "[tv_wonder_ceremony|E]:왕좌 홀의 칠해진 들보"
 TV_WONDER_CEREMONY_S6_DESC_147:0 "근정전 내부에서는 목수들이 알현실의 이중 지붕을 지탱할 거대한 들보를 들어올리고, 화가들은 처마마다 파란색, 빨간색, 금색의 단청 문양을 그리기 시작합니다. 왕의 알현 안뜰은 넓은 판석으로 포장되어 있습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_147:0 "화가들은 왕좌 홀의 들보를 가로질러 단청을 추적하고 석공들은 판석으로 안뜰을 닫습니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_147:0 "들보는 아직 색이 칠해지지 않은 상태로 좀 더 오래 노출되어 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_147:0 "@tv_ceremony_lock!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_147:0 "#Y 진행중#! — #high 수호 뜰이 완성되었습니다#!\n#F 동의 수호신들이 행렬의 길을 따라 자리를 잡고, 왕족이 거주할 가장 안쪽 뜰은 자신들의 담과 대문으로 둘러싸여 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_147:0 "#G 완료#! — #high 수호 뜰이 완성되었습니다#!\n#F 청동 수호수가 행렬의 길을 따라 자리를 잡고, 왕실이 거주할 가장 안쪽 안뜰은 자체 벽과 대문으로 둘러싸여 있습니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_147:0 "[tv_wonder_ceremony|E]：후견 법원이 완료되었습니다"
 TV_WONDER_CEREMONY_S7_DESC_147:0 "행렬의 길을 따라 청동 수호수가 자리를 잡고, 왕족이 거주할 가장 안쪽 안뜰은 자체 벽과 문으로 둘러싸여 있습니다. 관계자들은 다음 기간에 열릴 법원 행사 명령을 연습하고 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_147:0 "마침내 지켜졌다!"
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_147:0 "청동 짐승들은 캐스팅되지 않은 채 기다리고 있고, 안뜰은 한동안 열려 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_147:0 "@tv_ceremony_ruler!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_147:0 "#Y 진행중#! — #high 왕이 왕위에 오르다#!\n#F 왕이 광화문과 그 너머 궁궐을 건너 처음으로 근정전에서 즉위하고, 집결하기 전에 문과 전각의 축이 완성되었음을 선언한다 court.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_147:0 "#G 완료#! — #high 왕이 왕위에 오르다#!\n#F 왕이 광화문과 그 너머 궁궐을 건너 처음으로 근정전에서 즉위하고, 집결되기 전에 문과 전각의 축이 완성되었음을 선언한다 court.#!"
 TV_WONDER_CEREMONY_S8_TITLE_147:0 "[tv_wonder_ceremony|E]:왕이 왕좌에 오르다"
 TV_WONDER_CEREMONY_S8_DESC_147:0 "왕은 광화문과 그 너머 궁궐을 건너 처음으로 근정전에서 즉위하고, 집합된 궁정 앞에서 문과 전각의 축이 완성되었음을 선언한다. 오늘부터 궁전의 질서정연한 기하학은 모든 주정부 사무실에 규율을 부여하고 내각의 일상 업무는 새로운 효율성으로 운영됩니다.\n\n#weak 행사를 완료하는 데 필요한 가격을 지불하세요. 그 결과 경이로운 최종 건물이 세워질 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_147:0 "왕은 광화문을 건너 집결된 궁정 앞 근정전 안에 자리를 잡습니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_147:0 "오늘은 아니야!"
 TV_WONDER_CEREMONY_CARD_ICON_S1_148:0 "@tv_ceremony_government!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_148:0 "#Y 진행중#! — #high 칸이 성봉을 선포하다#!\n#F 법원은 장백산을 만주족의 조상 발상지로 선언하고 하늘과 건국의 정신을 기리기 위해 테라스에 제단을 세우도록 명령했습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_148:0 "#G 완료#! — #high 칸이 성봉을 선포하다#!\n#F 법원은 장백산을 만주족의 조상 발상지로 선언하고 하늘과 건국의 정신을 기리기 위해 테라스에 제단을 세우도록 명령했습니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_148:0 "[tv_wonder_ceremony|E]：칸이 신성한 봉우리를 선포하다"
 TV_WONDER_CEREMONY_S1_DESC_148:0 "법원은 장백산을 만주족의 조상 발상지로 선언하고 하늘과 건국정신을 기리기 위해 그 테라스에 제단을 세우도록 명령합니다. 의식을 준비하기 위해 샤먼과 황실 사절이 즉시 북쪽으로 파견됩니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_148:0 "칸의 칙령이 봉인되었고 무당들은 즉시 신성한 봉우리를 향해 출발했습니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_148:0 "아직은 아닙니다. 징조를 먼저 읽어보세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S2_148:0 "@tv_ceremony_lake!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_148:0 "#Y 진행 중#! — #high 주술사는 천상의 호수를 읽습니다.#!\n#F 주술사는 분화구 호수 옆에서 밤새 캠프를 하며 구름과 반사를 관찰하여 산이 다가올 제물을 받아들인다는 신호를 찾습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_148:0 "#G 완료#! — #high Shamans 천상의 호수를 읽어보세요#!\n#F Shamans는 밤 동안 분화구 호수 옆에 캠프를 치며 구름과 반사를 관찰하여 산이 다가올 제물을 받아들인다는 신호를 찾습니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_148:0 "[tv_wonder_ceremony|E]：무당은 천상의 호수를 읽는다"
 TV_WONDER_CEREMONY_S2_DESC_148:0 "무당들은 밤 동안 분화구 호수 옆에서 야영을 하며, 산이 다가올 제물을 받아들인다는 표시를 찾기 위해 구름과 반사를 관찰합니다. 좋은 징조를 읽은 후에야 사절은 제단이 세워질 테라스에 표시를 합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_148:0 "우리는 호수 자체가 신호를 보낼 때까지 주술사들에게 오랫동안 경계심을 유지하라고 명령했습니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_148:0 "사절들은 불확실한 징조에 테라스를 표시하기를 꺼려 철수했습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_148:0 "@tv_ceremony_building_needs!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_148:0 "#Y 진행 중#! — #high 숲에서 모은 제물#!\n#F 사냥꾼과 삼림 관리인이 제단 건설에 대한 공물로 검은 담비 가죽, 인삼 뿌리, 소나무 재목을 경사면에서 가져오고, 기치 부대는 숲을 통과하는 행렬 경로를 정리합니다. 아래.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_148:0 "#G 완료#! — #high 숲에서 모은 제물#!\n#F 사냥꾼과 삼림 관리인이 제단 건설에 대한 공물로 검은 담비 가죽, 인삼 뿌리, 소나무 목재를 경사면에서 가져오고, 기치 부대는 숲을 통과하는 행렬 경로를 정리합니다. 아래.#!"
 TV_WONDER_CEREMONY_S3_TITLE_148:0 "[tv_wonder_ceremony|E]：숲에서 모은 공물"
 TV_WONDER_CEREMONY_S3_DESC_148:0 "사냥꾼과 삼림 관리인들이 제단 건립에 대한 공물로 검은 담비 가죽, 인삼 뿌리, 소나무 재목을 경사면에서 가져오고, 기치 부대는 아래 숲을 통과하는 행렬 경로를 정리합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_148:0 "숲은 그 영혼을 존중하는 이들에게 아낌없이 베풀어줍니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_148:0 "우리는 아직 산의 경사면을 맨발로 벗겨내지는 않을 것입니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_148:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_148:0 "#Y 진행 중#! — #high 테라스용 돌 절단#!\n#F 석공들은 제단의 계단식 테라스에 화산암을 다듬기 시작하며, 마침내 신사의 최초의 진정한 석조물이 형태를 갖추면서 얇은 산 공기를 통해 작업합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_148:0 "#G 완료#! — #high 테라스용 돌 절단#!\n#F 석공들은 제단의 계단식 테라스에 화산암을 다듬기 시작하며, 마침내 신사의 최초의 진정한 석조물이 형태를 갖추면서 얇은 산 공기를 통해 작업합니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_148:0 "[tv_wonder_ceremony|E]：테라스를 위해 돌을 깎다"
 TV_WONDER_CEREMONY_S4_DESC_148:0 "석공들은 제단의 계단식 테라스에 화산암을 다듬기 시작하고, 희박한 산 공기를 통해 작업하면서 마침내 신사의 최초의 진정한 석조물이 형태를 갖추게 됩니다. 축성 진행 중인 것을 표시하기 위해 황실 사절의 깃발이 현장에 꽂혀 있습니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_148:0 "석공들이 화산암에 끌을 꽂고 첫 번째 테라스의 모양이 갖춰지기 시작합니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_148:0 "아직은 아닙니다. 산이 한 시즌 더 쉬게 해주세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S5_148:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_148:0 "#Y 진행 중#! — #high 하단 테라스가 솟아오른다#!\n#F 제단의 하단 테라스는 어두운 화산석으로 완성되었으며, 위 작업이 계속되는 동안에도 무당들은 그 위에서 첫 공양 의식을 거행하기 시작합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_148:0 "#G 완료#! — #high 하단 테라스 상승#!\n#F 제단의 하단 테라스는 어두운 화산석으로 완성되었으며, 위의 작업이 계속되는 동안에도 무당들은 그 위에서 첫 번째 공양 의식을 수행하기 시작합니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_148:0 "[tv_wonder_ceremony|E]:낮은 테라스 상승"
 TV_WONDER_CEREMONY_S5_DESC_148:0 "제단의 아래쪽 테라스는 어두운 화산석으로 완성되었으며, 위에서 작업이 계속되는 동안 무당은 그 위에서 첫 번째 제물을 바치기 시작합니다. 아이신 지오로(Aisin Gioro) 색상이 적힌 배너가 현장 위의 차가운 바람에 찰칵 소리를 냅니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_148:0 "우리는 이 새로 쌓은 돌 위에서 첫 번째 의식을 노래하도록 하겠습니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_148:0 "법원은 의식을 보류하고 새로운 테라스를 잠시 동안 침묵하게 만듭니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_148:0 "@tv_ceremony_paved_road!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_148:0 "#Y 진행 중#! — #high 호수를 향해 새겨진 계단#!\n#F 사절이 축성식을 위해 하늘 호수 자체에서 물을 길러 내려갈 수 있도록 분화구 내부 경사면에 다듬은 돌 계단이 깎여 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_148:0 "#G 완료#! — #high 호수를 향해 새겨진 계단#!\n#F 사절이 축성식을 위해 하늘 호수 자체에서 물을 길러 내려갈 수 있도록 분화구 내부 경사면에 다듬은 돌 계단이 깎여 있습니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_148:0 "[tv_wonder_ceremony|E]:호수를 향해 새겨진 계단"
 TV_WONDER_CEREMONY_S6_DESC_148:0 "사절들이 봉헌식을 위해 천상의 호수에서 물을 길러 내려갈 수 있도록 분화구의 내부 경사면에는 다듬은 돌 계단이 새겨져 있습니다. 순례자들은 진행 중인 의식을 보기 위해 산기슭에 모이기 시작합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_148:0 "가장 높은 물에도 인내심을 갖고 발걸음을 옮겨 도달합니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_148:0 "우리는 아직 사절을 호수 가장자리로 보낼 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_148:0 "@tv_ceremony_holy_site!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_148:0 "#Y 진행 중#! — #high 상단 제단이 왕관을 씌우고 있습니다#!\n#F 최상층 테라스가 완성되어 창건 조상의 이름을 새긴 돌 표식으로 장식되었으며, 무당들은 산의 제사에 수반될 전체 제물 주기를 연습합니다. 봉헌.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_148:0 "#G 완료#! — #high 상단 제단에 왕관이 씌워졌습니다#!\n#F 가장 높은 테라스가 완성되어 창건 조상의 이름을 새긴 돌 표식으로 장식되었으며, 무당들은 산의 제사에 수반될 전체 제물 주기를 연습합니다. 봉헌.#!"
 TV_WONDER_CEREMONY_S7_TITLE_148:0 "[tv_wonder_ceremony|E]：상단 제단에 왕관이 씌워졌습니다"
 TV_WONDER_CEREMONY_S7_DESC_148:0 "최상층 테라스는 건국 조상의 이름이 새겨진 돌 표식으로 마감 처리되어 있으며, 무당들은 산의 봉헌에 수반되는 전체 제물 주기를 연습합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_148:0 "마지막 표식은 정상에 세워져 있으며, 하늘 앞에 선조들의 이름이 적혀 있습니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_148:0 "서둘러 세운 왕관은 제대로 자리잡지 못합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_148:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_148:0 "#Y 진행중#! — #high 하늘이 산의 공양을 받다#!\n#F 기치와 사신이 모이기 전에 무당들은 정상 제단에서 대공양을 마치고, 조정에서는 장백산을 왕조의 영원한 성지로 선포합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_148:0 "#G 완료#! — #high 하늘이 산의 공양을 받다#!\n#F 기치와 사절이 모이기 전에 무당들은 정상 제단에서 대공양을 마치고, 조정에서는 장백산을 왕조의 영원한 성지로 선포합니다.#!"
 TV_WONDER_CEREMONY_S8_TITLE_148:0 "[tv_wonder_ceremony|E]：하늘이 산의 제물을 받아들이다"
 TV_WONDER_CEREMONY_S8_DESC_148:0 "깃발과 사절이 모이기 전에 무당들은 정상 제단에서 큰 공양을 마치고, 조정에서는 장백산을 왕조의 영원한 성지로 선포합니다. 그곳에서 행해진 의식은 이제 궁정의 지출을 안정시키고 궁전과 재무부에 축복이 내려지도록 합니다.\n\n#weak 의식을 완료하는 데 필요한 대가를 지불하세요. 결과적으로 불가사의의 마지막 건물이 세워질 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_148:0 "우리는 하늘의 축복을 받아들이고, 이 봉우리가 모든 통치를 위해 신성하다고 선언합니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_148:0 "법원은 마지막 의식을 연기하고 산의 축복을 더 이상 요구하지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_149:0 "@tv_ceremony_military_panel!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_149:0 "#Y 진행 중#! — #high 합류를 강화하라는 명령#!\n#F 최고 사령부는 사바와 다뉴브 강 위의 오래된 성채를 현대적인 별 요새로 재건하도록 명령합니다. 그 요새는 탐내는 모든 제국에 맞서 국경을 넘나들기 위한 것입니다. it.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_149:0 "#G 완료#! — #high 합류를 요새화하라는 명령#!\n#F 최고 사령부는 사바 강과 다뉴브 강 위의 오래된 성채를 현대적인 별 요새로 재건하도록 명령합니다. 그 요새는 탐내는 모든 제국에 맞서 국경을 넘나들기 위한 것입니다. it.#!"
 TV_WONDER_CEREMONY_S1_TITLE_149:0 "[tv_wonder_ceremony|E]：합류 강화 명령"
 TV_WONDER_CEREMONY_S1_DESC_149:0 "최고 사령부는 사바 강과 다뉴브 강 위의 오래된 성채를 현대적인 별 요새로 재건하도록 명령합니다. 그 요새는 이를 탐내는 모든 제국에 대항하여 이 국경을 가로지르는 것을 막기 위한 것입니다. 암석을 조사하기 위해 전 세계에서 엔지니어들이 소환됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_149:0 "우리는 오래된 성채를 파괴하고 별 요새로 재건하도록 명령합니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_149:0 "최고 사령부는 명령을 보류하고 오래된 성채는 좀 더 오래 서 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_149:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_149:0 "#Y 진행 중#! — #high 엔지니어들이 강 절벽을 조사합니다.#!\n#F 군 공병들은 두 강이 만나는 절벽의 지도를 작성하고 교차하는 불길로 모든 접근을 보호할 각진 요새를 표시합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_149:0 "#G 완료#! — #high 엔지니어들이 강 절벽을 조사합니다.#!\n#F 군 공병들은 두 강이 만나는 절벽의 지도를 작성하고 교차하는 불길로 모든 접근을 보호할 각진 요새를 표시합니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_149:0 "[tv_wonder_ceremony|E]：엔지니어들이 강 절벽을 조사합니다"
 TV_WONDER_CEREMONY_S2_DESC_149:0 "군사 기술자들은 두 강이 만나는 절벽의 지도를 작성하고 교차하는 사격장으로 모든 접근을 덮을 각진 요새를 표시합니다. 수비대 장교들은 어떤 오래된 벽을 유지할 수 있고 어떤 벽을 철거해야 하는지에 대해 논쟁을 벌입니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_149:0 "엔지니어들은 절벽을 따라 요새를 측설합니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_149:0 "우리는 오래된 성벽의 운명이 결정될 때까지 측량사들을 저지하고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_149:0 "@tv_ceremony_cannons!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_149:0 "#Y 진행 중#! — #high 돌과 대포가 강 상류로 이동#!\n#F 바지선은 석회암 블록과 철 대포를 요새 상륙까지 상류로 운반하고 징발된 농민과 수비대 병력은 첫 번째 발굴 작업을 시작합니다. 도랑.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_149:0 "#G 완료#! — #high 돌과 대포가 강 상류로 이동#!\n#F 바지선은 석회암 블록과 철 대포를 요새 상륙까지 상류로 운반하고, 징집된 농민과 수비대 병력은 첫 번째 발굴 작업을 시작합니다. 도랑.#!"
 TV_WONDER_CEREMONY_S3_TITLE_149:0 "[tv_wonder_ceremony|E]: 강 상류로 가져온 돌과 대포"
 TV_WONDER_CEREMONY_S3_DESC_149:0 "바지선은 석회암 블록과 철 대포를 요새 상륙까지 상류로 운반하고 징발된 농민과 수비대 병력은 첫 번째 도랑을 파기 시작합니다. 라이벌 세력의 요원들이 이미 물 건너편에서 지켜보고 있는 것으로 나타났습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_149:0 "바지선은 석회암과 철 대포를 실은 채 강 상류로 올라갑니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_149:0 "서둘러 세운 벽이 가장 먼저 무너집니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_149:0 "@tv_ceremony_defensive_military_stance!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_149:0 "#Y 진행 중#! — #high 첫 번째 요새 착공#!\n#F 메이슨이 사바(Sava) 위의 요새 최초의 진정한 요새를 착공하고 종이에 있는 측량 선이 마침내 참호, 기초, 솟아오르는 돌이 됩니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_149:0 "#G 완료#! — #high 첫 번째 요새 착공#!\n#F 메이슨은 사바(Sava) 위의 요새 최초의 진정한 요새를 착공하고 종이에 있는 측량선은 마침내 참호, 기초, 솟아오르는 돌이 됩니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_149:0 "[tv_wonder_ceremony|E]: 첫 번째 요새 착공"
 TV_WONDER_CEREMONY_S4_DESC_149:0 "메이슨은 사바강 위의 요새 최초의 진정한 보루를 착공하고, 종이에 적힌 측량선은 마침내 참호, 기초, 솟아오르는 돌이 됩니다. 수비대 드럼은 매일 새벽 계획에서 작업으로의 변화를 표시합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_149:0 "우리는 Sava 위의 첫 번째 요새를 착공했습니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_149:0 "석공들은 도구를 내려놓았고 Sava 위의 땅은 방해받지 않고 기다립니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_149:0 "@tv_ceremony_river!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_149:0 "#Y 진행 중#! — #high 강 수문이 세워졌습니다#!\n#F 다뉴브 강과 사바 강을 마주하는 성벽에 거대한 수문이 설치되어 수비대가 곶 양쪽에서 하천 교통을 지휘할 수 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_149:0 "#G 완료#! — #high 강 수문이 세워졌습니다#!\n#F 다뉴브 강과 사바 강을 마주하는 성벽에 거대한 문이 설치되어 수비대가 곶 양쪽에서 하천 교통을 지휘할 수 있습니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_149:0 "[tv_wonder_ceremony|E]：강의 문이 솟아오른다"
 TV_WONDER_CEREMONY_S5_DESC_149:0 "다뉴브 강과 사바 강을 마주하는 성벽에는 거대한 문이 설치되어 있어 수비대가 곶 양쪽에서 강의 교통을 지휘할 수 있습니다. 대포는 완성된 첫 번째 포대에 들어 올려집니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_149:0 "수비대는 다뉴브강과 사바강 양쪽에 거대한 강문을 세웠습니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_149:0 "우리는 강문을 건설하지 않은 상태로 두고 건널목을 잠시 동안 열어 둡니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_149:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_149:0 "#Y 진행 중#! — #high 보루가 어퍼 타운에 오르다#!\n#F 어퍼 타운의 각진 보루는 코스별로 오르며, 경사진 돌 표면은 공성 사격을 흡수하기보다는 반사하도록 설계되었습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_149:0 "#G 완료#! — #high 보루 상부 마을 오르기#!\n#F 상부 마을의 각진 보루는 코스별로 오르며, 경사진 돌 표면은 공성 사격을 흡수하기보다는 반사하도록 설계되었습니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_149:0 "[tv_wonder_ceremony|E]：어퍼 타운을 오르는 요새"
 TV_WONDER_CEREMONY_S6_DESC_149:0 "상부 마을의 각진 보루는 코스별로 솟아 있으며, 경사진 돌면은 공성 공격을 흡수하기보다는 빗나가도록 설계되었습니다. 공병은 향후 채굴 시도에 대비해 벽 아래에 덮인 갤러리를 파냅니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_149:0 "위쪽 마을의 요새는 코스를 따라 올라가고, 그 경사면은 적의 총을 향하고 있습니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_149:0 "석공들이 잠시 멈추고 위쪽 마을의 요새가 최종 높이에 미치지 못하여 멈춥니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_149:0 "@tv_ceremony_ship!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_149:0 "#Y 진행 중#! — #high 낮은 마을의 물 방어 시설#!\n#F 낮은 마을의 강을 향한 작업은 사바를 가로지르는 샐리 항구와 체인 붐으로 완료되어 적대적인 선박에 대한 합류점을 봉쇄합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_149:0 "#G 완료#! — #high 낮은 마을의 물 방어 시설#!\n#F 낮은 마을의 강을 향한 작업은 사바를 가로지르는 샐리 항구와 체인 붐으로 완료되어 적대적인 선박에 대한 합류점을 봉쇄합니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_149:0 "[tv_wonder_ceremony|E]：낮은 마을의 물 방어"
 TV_WONDER_CEREMONY_S7_DESC_149:0 "낮은 마을의 강을 향한 작업은 샐리 포트와 사바를 가로지르는 체인 붐으로 완료되어 적대적인 선박에 대한 합류점을 봉쇄합니다. 서로 다른 세 군대의 수비대가 현재 미완성 작업을 순회하고 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_149:0 "우리는 사바 강을 가로질러 체인 붐을 뻗고 적대적인 선체와의 합류점을 봉쇄합니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_149:0 "사슬 붐은 해안에 감겨져 있고 강은 감히 선체에 열려 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_149:0 "@tv_ceremony_control!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_149:0 "#Y 진행 중#! — #high 프론티어 요새 완성#!\n#F 수비대가 처음으로 완성된 성벽 전체를 행진할 때 대포가 두 강을 가로지르는 메아리에 경의를 표하고 최고 사령부는 베오그라드의 방어가 단일 세력의 손이 닿지 않는 곳을 선언합니다. 야망.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_149:0 "#G Completed#! — #high The Frontier Fortress Stands Complete#!\n#F 수비대가 처음으로 완성된 성벽 전체를 행진할 때 대포가 두 강을 가로지르는 메아리에 경의를 표하고 최고 사령부는 베오그라드의 방어가 단일 세력의 손이 닿지 않는 곳을 선언합니다. 야망.#!"
 TV_WONDER_CEREMONY_S8_TITLE_149:0 "[tv_wonder_ceremony|E]：프론티어 요새 완성"
 TV_WONDER_CEREMONY_S8_DESC_149:0 "수비대가 처음으로 완성된 성벽 전체를 순회하면서 대포 경례 소리가 두 강에 울려 퍼지고, 최고 사령부는 베오그라드의 방어가 어떤 단일 세력의 야심에도 미치지 못한다고 선언합니다. 이제 요새의 명성만으로도 라이벌 법원은 주인을 도발하기 전에 두 번 생각하게 됩니다.\n\n#weak 의식을 완료하는 데 필요한 대가를 지불하세요. 결과적으로 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_149:0 "수비대가 완성된 성벽을 행진하는 동안 대포 경례가 두 강을 가로질러 굴러갑니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_149:0 "우리는 경례를 보류하고 요새의 완성을 한 시즌 더 기다리게 합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_150:0 "@tv_ceremony_clergy!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_150:0 "#Y 진행 중#! — #high A 사암 기둥에 대한 요청#!\n#F 테살리아 대도시는 군대나 세금 징수원이 쉽게 접근할 수 없을 정도로 멀리 떨어진 평야 위 우뚝 솟은 바위 기둥 위에 새로운 수도원이 세워질 것이라고 선언합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_150:0 "#G 완료#! — #high A 사암 기둥에 대한 요청#!\n#F 테살리아 대도시는 군대나 세금 징수원이 쉽게 접근할 수 없을 정도로 멀리 떨어진 평원 위 우뚝 솟은 바위 기둥 위에 새로운 수도원이 세워질 것이라고 선언합니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_150:0 "[tv_wonder_ceremony|E]：사암 기둥에 대한 부름"
 TV_WONDER_CEREMONY_S1_DESC_150:0 "테살리아 대주교는 군대나 세금 징수원이 쉽게 접근할 수 없는 아주 먼 곳에 새로운 수도원이 평원 위 우뚝 솟은 바위 기둥 위에 세워질 것이라고 선언합니다. 승려들은 부름에 응답하기 위해 아토스와 그 너머에서 긴 걷기를 시작합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_150:0 "법원은 대도시의 요청에 응답하고 해당 작업에 대한 헌신을 맹세합니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_150:0 "아직은 아닙니다!"
 TV_WONDER_CEREMONY_CARD_ICON_S2_150:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_150:0 "#Y 진행 중#! — #high 승려들이 벌거벗은 바위를 확장합니다#!\n#F 첫 번째 승려들은 갈라진 틈에 꽂은 말뚝과 위에서 내려 매듭진 밧줄을 사용하여 깎아지른 듯한 기둥을 올라 어느 정상이 예배당을 지탱하기에 적합한지 표시합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_150:0 "#G 완료#! — #high 승려들이 벌거벗은 바위를 확장하다#!\n#F 첫 번째 승려들은 갈라진 틈에 꽂은 못과 위에서 내려 매듭진 밧줄을 사용하여 깎아지른 듯한 기둥을 올라 어느 정상이 예배당을 지탱하기에 적합한지 표시합니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_150:0 "[tv_wonder_ceremony|E]: 몽크가 벌거벗은 바위를 확장하다"
 TV_WONDER_CEREMONY_S2_DESC_150:0 "첫 번째 승려들은 갈라진 틈에 박은 말뚝과 위에서 내려온 매듭진 밧줄을 사용하여 깎아지른듯한 기둥에 올라 어느 정상이 예배당을 지을 수 있는지 표시합니다. 지역 주민을 고용하여 가장 빠른 물품을 운반합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_150:0 "마을 사람들은 첫 번째 짐을 등에 지고 맨바위 위로 올라갑니다."
