 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_194:0 "#G 완료#! — #high 배럴 무역을 위해 크레인이 세워졌습니다.#!\n#F 목재 크레인이 부두를 따라 올라가서 기존 항구에서는 허용되지 않았던 속도로 배럴과 베일을 선상으로 운반합니다.#!"
