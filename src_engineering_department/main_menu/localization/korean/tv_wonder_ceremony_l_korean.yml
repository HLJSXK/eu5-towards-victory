 TV_WONDER_CEREMONY_CARD_ICON_S8_198:0 "@tv_ceremony_power!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_198:0 "#Y 진행 중#! — #high 바스티유가 파리를 감시하고 있다#!\n#F 완성된 성벽에 총이 장착되고 바스티유가 완성되면서 파리에 대한 왕의 끊임없는 권위를 상징하는 왕실 깃발이 게양됩니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_198:0 "#G 완성#! — #high 바스티유가 파리를 감시하고 있다#!\n#F 완성된 성벽에 총이 장착되고 바스티유가 완성되면서 왕실 깃발이 올라가는데, 이는 파리에 대한 왕관의 끊임없는 권위를 상징합니다.#!"
 TV_WONDER_CEREMONY_S8_TITLE_198:0 "[tv_wonder_ceremony|E]: 바스티유가 파리를 감시하고 있습니다."
 TV_WONDER_CEREMONY_S8_DESC_198:0 "완성된 성벽에 총이 장착되고 왕실 깃발이 올라가고 바스티유가 완성되면서 파리에 대한 왕권의 끊임없는 권위를 상징합니다.\n\n#weak 식을 완료하는 데 필요한 가격을 지불하세요. 결과적으로 불가사의의 최종 건물이 세워질 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_198:0 "포수들은 대포를 장착하고 완성된 바스티유 감옥 위로 왕실 깃발이 올라갑니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_198:0 "아직은 아닙니다. 배너를 기다리세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S1_199:0 "@tv_ceremony_defensive_military_stance!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_199:0 "#Y 진행 중#! — #high 자작은 이중 성벽을 요구합니다#!\n#F 카르카손 자작은 도시의 오래된 서고트 성벽을 두 배로 늘려 수세기에 걸친 포위 공격에 대신 두 개의 돌 고리로 대응할 것을 요구합니다. one.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_199:0 "#G 완료#! — #high 자작은 이중 성벽을 요구합니다#!\n#F 카르카손 자작은 도시의 오래된 서고트 성벽을 두 배로 늘리고 수세기에 걸친 포위 공격에 대신 두 개의 돌 고리로 대응할 것을 요구합니다. one.#!"
 TV_WONDER_CEREMONY_S1_TITLE_199:0 "[tv_wonder_ceremony|E]: 자작이 이중벽을 요구하다"
 TV_WONDER_CEREMONY_S1_DESC_199:0 "카르카손 자작은 도시의 오래된 서고트 성벽을 두 배로 늘려 수세기에 걸친 포위 공격에 하나가 아닌 두 개의 돌 고리로 대응할 것을 요구합니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_199:0 "자작은 법령에 서명하여 오래된 성벽을 돌로 두 배로 만들 것을 명령합니다."
