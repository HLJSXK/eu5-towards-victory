 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_196:0 "#Y 진행 중#! — #high 상인들이 패턴북 박람회를 채웁니다.#!\n#F 전역의 상인들이 군중 박람회에서 리옹의 패턴북을 거래하고, 트라불은 작업장 간에 운반되는 베일로 바빠집니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_196:0 "#G 완료#! — #high 상인들이 패턴북 박람회를 채웁니다.#!\n#F 전역의 상인들이 군중 박람회에서 리옹의 패턴북을 거래하고, 트라불은 작업장 간에 운반되는 베일로 바빠집니다.#!"
