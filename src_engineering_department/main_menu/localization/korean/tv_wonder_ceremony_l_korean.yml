 TV_WONDER_CEREMONY_S3_DESC_136:0 "길드 상인과 왕실 요인들은 카사 관리들 앞에서 모든 주괴와 진주를 보고하고 재산과 사기를 모두 왕관의 주의깊은 장부에 보고할 것을 맹세합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
