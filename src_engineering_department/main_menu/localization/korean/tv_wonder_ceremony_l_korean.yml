 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_200:0 "#G Completed#! — #high Engineers는 건선거 유역을 도표화합니다.#!\n#F 해군 엔지니어는 해안을 따라 건선거 및 로프워크를 위한 유역을 도표화하고 용골에서 장비까지 선박에 장비를 장착할 수 있는 무기고를 계획합니다.#!"
