 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_139:0 "#Y 진행 중#! — #high 보물선의 갈비뼈가 솟아오릅니다.#!\n#F 전면로를 따라 거대한 갈비뼈가 올라간 후의 갈비뼈와 수도에서 온 방문객들은 선체 하나가 아래 강을 붐비는 상인 쓰레기를 왜소하게 만들 수 있다는 사실에 놀랐습니다.#!"
