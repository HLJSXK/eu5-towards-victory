 TV_WONDER_CEREMONY_CARD_ICON_S1_138:0 "@tv_ceremony_development!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_138:0 "#Y 진행 중#! — #high 샤는 고원에 물을 주문합니다#!\n#F 샤의 궁정은 새로운 카나트에게 의뢰하여 건조한 고원 아래에 숨겨져 있는 산의 물을 이스파한 방향으로 끌어오는데, 먼지만 있을 가능성이 있는 들판입니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_138:0 "#G 완료#! — #high 샤가 고원에 물을 주문하다#!\n#F 샤의 궁정은 새로운 카나트에게 의뢰하여 건조한 고원 아래 숨겨진 산수를 이스파한 방향으로 끌어오도록 했으며, 먼지만 있을 가능성이 있는 들판이었습니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_138:0 "[tv_wonder_ceremony|E]: 샤가 고원에 물을 주문하다"
 TV_WONDER_CEREMONY_S1_DESC_138:0 "샤의 궁정은 이스파한을 향해 건조한 고원 아래 숨겨진 산의 물을 끌어오기 위해 새로운 카나트를 의뢰합니다. 이스파한은 먼지만 있는 들판을 약속합니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_138:0 "우리는 이 먼지가 마침내 물을 알게 되리라고 선언합니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_138:0 "법원은 망설이고 고원은 법령이 나올 때까지 또 다른 시즌을 기다립니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_138:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_138:0 "#Y 진행 중#! — #high 무카니스는 땅을 읽어라#!\n#F 마스터 무카니스는 새벽에 고원을 걷고, 수갱 하나를 파기 전에 땅의 경사와 땅의 경사를 판단하고 그림자와 흙만으로 묻힌 물의 속삭임을 판단합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_138:0 "#G 완료#! — #high 무칸니스는 땅을 읽어라#!\n#F 마스터 무칸니스는 새벽에 고원을 걷고, 수갱 하나를 파기 전에 땅의 경사와 땅의 경사를 판단하고 그림자와 흙만으로 묻힌 물의 속삭임을 판단합니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_138:0 "[tv_wonder_ceremony|E]: 무칸니스(Muqannis)가 땅을 읽다"
 TV_WONDER_CEREMONY_S2_DESC_138:0 "무칸니스 마스터는 새벽에 고원을 걷고, 수갱 하나를 파기 전에 그림자와 흙만으로 땅의 경사와 묻힌 물의 속삭임을 판단합니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우에는 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_138:0 "물이 우리에게 말을 걸어요!"
