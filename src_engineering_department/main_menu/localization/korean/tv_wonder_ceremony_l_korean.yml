 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_186:0 "#G 완료#! — #high 성벽에 장착된 대포#!\n#F 포획되거나 물물교환된 대포는 강 접근로가 내려다보이는 흙 성벽으로 운반됩니다. 호스트.#!"
 TV_WONDER_CEREMONY_S7_TITLE_186:0 "[tv_wonder_ceremony|E]: 성벽에 장착된 대포"
 TV_WONDER_CEREMONY_S7_DESC_186:0 "노획하거나 물물교환한 대포는 강 접근로가 내려다보이는 흙벽으로 운반되며, 호스트에 합류하기 전에 여섯 개의 깃발 아래 복무한 포수들이 유인합니다. 모퉁이에 감시탑이 솟아 있고 초소가 대초원에서 타타르 먼지를 스캔하고 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_186:0 "포수들은 대포를 성벽 위로 끌어당기고 시계를 차지합니다."
