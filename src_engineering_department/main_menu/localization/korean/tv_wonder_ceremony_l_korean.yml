 TV_WONDER_CEREMONY_S4_DESC_136:0 "석공들은 강 옆에 있는 거대하고 요새화된 창고를 착공합니다. 그 두꺼운 벽은 홍수와 도둑을 견딜 수 있도록 만들어졌으며, 첫 번째 목재 더미가 새로운 부두로 옮겨졌습니다.\n\n#weak 행사를 다음 단계로 진행하기 위해 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
