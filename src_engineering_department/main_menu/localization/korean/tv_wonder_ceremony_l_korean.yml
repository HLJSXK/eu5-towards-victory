 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_196:0 "우리는 이러한 작업장의 벽을 높일 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_196:0 "@tv_ceremony_painter!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_196:0 "#Y 진행 중#! — #high Dyers는 강변 블록을 요구합니다.#!\n#F Dyers는 강변 블록을 자신의 통으로 요구하고, 실크 볼트가 처음으로 지역을 떠나기 시작하면서 그들의 유색 유출수가 물을 얼룩지게 합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_196:0 "#G 완료#! — #high Dyers는 강변 블록을 요구합니다.#!\n#F Dyers는 통을 위해 강변 블록을 요구하고, 실크 볼트가 처음으로 지역을 떠나기 시작하면서 그들의 유색 유출수가 물을 얼룩지게 합니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_196:0 "[tv_wonder_ceremony|E]：강변 블록을 차지한 염색업체"
 TV_WONDER_CEREMONY_S5_DESC_196:0 "염색하는 사람들은 통을 위해 강변 블록을 요구하고, 처음으로 실크 한 가닥이 지역을 떠나기 시작하면서 유색 유출수가 물을 얼룩지게 합니다.\n\n#weak 식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_196:0 "Dyers는 마침내 강둑을 따라 소유권을 주장했습니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_196:0 "강둑이 아닙니다. 아직은 아닙니다!"
 TV_WONDER_CEREMONY_CARD_ICON_S6_196:0 "@tv_ceremony_organization!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_196:0 "#Y 진행중#! — #high 길드 홀 완성#!\n#F 실크 길드의 홀은 회의실과 패턴 아카이브로 완성되어 지역에 품질과 가격에 대한 공식 권위를 부여했습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_196:0 "#G 완료#! — #high 길드 홀이 완성되었습니다.#!\n#F 실크 길드의 홀은 회의실과 패턴 아카이브로 완성되어 지역에 품질과 가격에 대한 공식 권위를 부여했습니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_196:0 "[tv_wonder_ceremony|E]：길드 홀이 완성되었습니다"
 TV_WONDER_CEREMONY_S6_DESC_196:0 "실크 길드의 홀은 회의실과 패턴 아카이브로 완성되어 지역에 품질과 가격에 대한 공식 권위를 부여합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
