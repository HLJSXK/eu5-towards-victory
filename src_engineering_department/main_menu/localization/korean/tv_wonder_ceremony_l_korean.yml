 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_196:0 "길드 홀에서는 명령 장부를 따로 보관해 두었습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_196:0 "@tv_ceremony_building_default!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_196:0 "#Y 진행 중#! — #high 첫 번째 작업장 창문이 열렸습니다.#!\n#F 목수들이 베틀을 밝히는 큰 창문을 자르고, 두 강 사이의 횡선을 따라 첫 번째 작업장 건물이 세워집니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_196:0 "#G 완료#! — #high 첫 번째 작업장 창문이 열렸습니다.#!\n#F 목수들은 베틀을 밝히는 높은 창문을 자르고, 첫 번째 작업장 건물은 두 강 사이의 트라불을 따라 솟아오릅니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_196:0 "[tv_wonder_ceremony|E]：첫 번째 워크샵 창이 열립니다"
 TV_WONDER_CEREMONY_S4_DESC_196:0 "목수들은 직기를 밝히는 높은 창문을 자르고 두 강 사이의 횡선을 따라 첫 번째 작업장 건물이 세워집니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
