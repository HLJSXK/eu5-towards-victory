 TV_WONDER_CEREMONY_CARD_ICON_S3_150:0 "@tv_ceremony_supply!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_150:0 "#Y 진행 중#! — #high 로프 호이스트가 높이 묶여 있습니다.#!\n#F 그물 바구니와 자아틀이 절벽 가장자리에 설치되어 있어 돌, 목재, 승려 모두 한 번의 흔들림으로 수백 피트 위로 끌어올릴 수 있습니다. 운반.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_150:0 "#G 완료#! — #high 로프 호이스트가 높게 묶여 있습니다.#!\n#F 네트 바구니와 자아틀이 절벽 가장자리에 설치되어 있어 돌, 목재, 승려 모두 한 번의 흔들림으로 수백 피트 위로 끌어올릴 수 있습니다. 운반.#!"
 TV_WONDER_CEREMONY_S3_TITLE_150:0 "[tv_wonder_ceremony|E]: 로프 호이스트가 높이 매달려 있습니다."
 TV_WONDER_CEREMONY_S3_DESC_150:0 "그물 바구니와 자아틀이 절벽 가장자리에 설치되어 있어 돌, 목재, 승려 모두 한 번에 수백 피트 위로 끌어올릴 수 있습니다. 첫 번째 상승 전에 각 호이스트에 대해 축복이 전달됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 또는 아직 적절한 순간이 아닌 경우 기다리세요.#!"
