 TV_WONDER_CEREMONY_CARD_ICON_S6_198:0 "@tv_ceremony_lake!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_198:0 "#Y 진행 중#! — #high 해자가 절단되어 침수됨#!\n#F A 깊은 해자가 벽 주위를 절단하고 도시의 도랑에서 범람하여 도개교를 제외한 모든 접근에서 요새를 봉쇄했습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_198:0 "#G 완료#! — #high 해자가 절단되어 침수됨#!\n#F A 깊은 해자가 벽 주위를 절단하고 도시의 도랑에서 범람하여 도개교를 제외한 모든 접근에서 요새를 봉쇄합니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_198:0 "[tv_wonder_ceremony|E]: 해자가 절단되어 침수되었습니다."
 TV_WONDER_CEREMONY_S6_DESC_198:0 "벽 주변에 깊은 해자가 만들어지고 도시의 도랑이 범람하여 도개교를 제외한 모든 접근이 요새를 봉쇄했습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_198:0 "나는 도랑을 열어 도개교만이 통행할 수 있도록 명령합니다."
