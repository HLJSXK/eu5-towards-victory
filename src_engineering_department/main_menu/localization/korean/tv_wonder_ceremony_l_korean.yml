 TV_WONDER_CEREMONY_CARD_ICON_S7_173:0 "@tv_ceremony_death!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_173:0 "#Y 진행 중#! — #high 화장터가 별도로 설정되었습니다.#!\n#F 별도의 가트 구역이 장례 의식을 위해 별도로 지정되어 봉헌되었으며, 가족들이 시체를 신성한 강에 풀어주기 위해 먼 지방에서 올 때 연기가 꾸준히 피어오르고 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_173:0 "#G 완료#! — #high 화장터가 별도로 설정되었습니다.#!\n#F 별도의 가트 구역이 장례 의식을 위해 별도로 지정되어 봉헌되었으며, 가족들이 시체를 신성한 강에 풀어주기 위해 먼 지방에서 올 때 연기가 꾸준히 피어오르고 있습니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_173:0 "[tv_wonder_ceremony|E]: 화장터가 분리되어 있습니다"
 TV_WONDER_CEREMONY_S7_DESC_173:0 "별도의 가트 구간이 따로 마련되어 장례식을 위해 봉헌되며, 가족들이 먼 지방에서 죽은 이들을 신성한 강에 풀어주기 위해 올 때 연기가 꾸준히 피어오르고 있습니다. 참석자들은 밤낮으로 쉬지 않고 불을 지킵니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 비용을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_173:0 "참석자들은 땅을 봉헌하고 첫 번째 장례식 불을 붙입니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_173:0 "나는 아직 죽은 자들을 위해 땅을 성별할 수 없습니다. 기다려 주십시오."
 TV_WONDER_CEREMONY_CARD_ICON_S8_173:0 "@tv_ceremony_religious_influence!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_173:0 "#Y 진행 중#! — #high 새벽에 가트가 봉헌됩니다#!\n#F 첫 번째 날이 밝아오자 수천 명의 사제와 순례자들이 완성된 가트를 봉헌하기 위해 모이고, 등불이 물 위를 반짝이며 표류합니다. 행렬.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_173:0 "#G 완료#! — #high 새벽에 가트가 봉헌됩니다#!\n#F 첫 번째 날이 밝아오면 완성된 가트를 봉헌하기 위해 수천 명의 사제와 순례자들이 모이고, 등불은 물 위를 반짝이며 표류합니다. 행렬.#!"
 TV_WONDER_CEREMONY_S8_TITLE_173:0 "[tv_wonder_ceremony|E]: 가츠는 새벽에 봉헌됩니다"
 TV_WONDER_CEREMONY_S8_DESC_173:0 "첫 번째 날이 밝으면, 완성된 가트를 봉헌하기 위해 수천 명의 사제와 순례자들이 모여들고, 등불은 반짝이는 행렬처럼 물 위를 떠다닙니다. 이제 영속적인 돌 형태가 된 강의 신성함은 왕국 전체의 충실한 사람들을 안정시킵니다.\n\n#weak 의식을 완료하는 데 필요한 대가를 지불하세요. 그 결과 경이로운 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_173:0 "새벽이 되면 성직자들은 등불을 멀리 놓고 완성된 가트를 봉헌합니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_173:0 "사제들은 등불을 뒤로 젖히고 더욱 상서로운 새벽이 오기를 기다립니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_174:0 "@tv_ceremony_religious_influence!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_174:0 "#Y 진행 중#! — #high 촐라 왕의 시바에 대한 맹세#!\n#F Raja Raja Chola는 그의 법정 앞에 서서 그의 조상이 지은 어떤 것보다 더 위대한 Shiva를 위한 사원을 세울 것을 맹세합니다. 그 탑은 리그 밖에서도 볼 수 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_174:0 "#G 완료#! — #high 시바에 대한 촐라 왕의 맹세#!\n#F 라자 라자 촐라(Raja Raja Chola)는 궁정 앞에 서서 그의 조상이 지은 어떤 사원보다 더 위대한 시바를 위한 사원을 세울 것을 맹세합니다. 그 탑은 멀리서도 볼 수 있습니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_174:0 "[tv_wonder_ceremony|E]: 촐라 왕의 시바에 대한 맹세"
 TV_WONDER_CEREMONY_S1_DESC_174:0 "Raja Raja Chola는 그의 법정 앞에 서서 그의 조상이 지은 어떤 것보다 더 큰 Shiva 사원을 세우겠다고 맹세하며 그 탑은 리그에서 볼 수 있습니다. 장관들은 즉시 자금을 조달할 토지 보조금 초안 작성을 시작합니다.\n\n#weak 행사를 다음 단계로 진행하는 데 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_174:0 "Raja Raja Chola는 모인 법정에서 서약을 합니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_174:0 "왕은 한동안 암묵적으로 맹세를 유지합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_174:0 "@tv_ceremony_holy_site!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_174:0 "#Y 진행 중#! — #high 탄자부르 부지가 선택됨#!\n#F 로열 엔지니어들은 탄자부르 평야를 거닐며 위대한 비마나가 세워질 땅을 테스트하고, 서기관은 토지 기부와 모든 기증을 기록하기 시작합니다. 금.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_174:0 "#G 완료#! — #high 탄자부르 부지가 선택됨#!\n#F 로열 엔지니어들은 탄자부르 평야를 거닐며 위대한 비마나가 세워질 땅을 테스트하는 동안 서기관은 토지와 모든 기부금을 기록하기 시작합니다. 금.#!"
 TV_WONDER_CEREMONY_S2_TITLE_174:0 "[tv_wonder_ceremony|E]：탄자부르(Thanjavur) 부지가 선택되었습니다"
 TV_WONDER_CEREMONY_S2_DESC_174:0 "왕실 기술자들은 탄자부르(Thanjavur)의 평야를 거닐며 거대한 비마나가 세워질 땅을 시험하고, 서기관들은 토지와 금의 모든 기증을 기록하기 시작합니다. 사제들은 선택한 땅을 불과 재로 축복합니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_174:0 "땅이 선택되었습니다!"
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_174:0 "엔지니어들은 아직 땅을 선택하지 않은 채 남아있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_174:0 "@tv_ceremony_laborers!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_174:0 "#Y 진행 중#! — #high Kunjaramallan이 건축가로 임명됨#!\n#F 왕실 건축가 Kunjaramallan Rajaraja Perunthachan이 작업의 주인으로 임명되고 화강암이 채석장에서 뗏목을 타고 도착하기 시작합니다. Kaveri.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_174:0 "#G 완료#! — #high Kunjaramallan이 건축가로 임명됨#!\n#F 왕실 건축가 Kunjaramallan Rajaraja Perunthachan이 작업의 주인으로 임명되고 화강암이 채석장에서 뗏목을 타고 도착하기 시작합니다. Kaveri.#!"
 TV_WONDER_CEREMONY_S3_TITLE_174:0 "[tv_wonder_ceremony|E]：쿤자라말란이 건축가로 임명됨"
 TV_WONDER_CEREMONY_S3_DESC_174:0 "왕실 건축가 Kunjaramallan Rajaraja Perunthachan이 작품의 주인으로 지명되고 화강암은 Kaveri를 따라 채석장에서 뗏목으로 도착하기 시작합니다. 인부와 조각가는 왕국 전역의 마을에서 모집됩니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_174:0 "Kunjaramallan은 마스터 빌더의 인장을 받아들입니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_174:0 "아직은 아닙니다. 채석장을 기다려주세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S4_174:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_174:0 "#Y 진행 중#! — #high 비마나의 기초가 놓였습니다#!\n#F 위대한 비마나의 초석이 땅에 놓였고, 수년간의 계획과 수집 끝에 마침내 탑의 진정한 건설이 시작되었습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_174:0 "#G 완료#! — #high 비마나의 기초가 놓였습니다#!\n#F 위대한 비마나의 초석이 땅에 놓였고, 수년간의 계획과 수집 끝에 마침내 탑의 진정한 건설이 시작되었습니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_174:0 "[tv_wonder_ceremony|E]：비마나의 기초가 놓였습니다"
 TV_WONDER_CEREMONY_S4_DESC_174:0 "거대한 비마나를 위한 초석이 땅에 박혀 있으며, 수년간의 계획과 수집 끝에 마침내 탑의 진정한 건설이 시작됩니다. 각각의 거대한 블록이 땅에 내려앉을 때 작업자들은 시바에게 찬송을 부릅니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_174:0 "우리는 첫 번째 돌을 놓고 이 탑의 진정한 시작을 세웠습니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_174:0 "기초석은 아직 마당에서 기다리고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_174:0 "@tv_ceremony_building_levels!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_174:0 "#Y 진행 중#! — #high 코스별 타워 오르기 코스#!\n#F 화강암 타워는 전체 높이를 향해 코스별로 올라가며, 크레인 없이도 블록을 더 높이 끌어올 수 있도록 흙을 쌓은 경사로가 나란히 세워져 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_174:0 "#G 완료#! — #high 코스별 타워 오르기 코스#!\n#F 화강암 타워는 전체 높이를 향해 코스별로 올라가며, 크레인 없이도 블록을 더 높이 끌어올 수 있도록 흙을 쌓은 경사로가 나란히 세워져 있습니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_174:0 "[tv_wonder_ceremony|E]：타워 클라이밍 코스별 코스"
 TV_WONDER_CEREMONY_S5_DESC_174:0 "화강암 탑은 전체 높이를 향해 한 단계씩 솟아오릅니다. 그 옆에는 흙으로 쌓은 경사로가 건설되어 크레인 없이도 블록을 더 높이 끌어올릴 수 있습니다. 경사로 자체가 평야를 가로질러 수 마일에 걸쳐 뻗어 있다고 말하는 사람들도 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_174:0 "더 높이!"
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_174:0 "경사로가 더 올라가기 전에 우리는 석공들에게 휴식을 취하라고 말했습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_174:0 "@tv_ceremony_art_work!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_174:0 "#Y 진행 중#! — #high 난디 파빌리온이 완성되었습니다#!\n#F A 파빌리온은 성소를 향한 거대한 황소 난디를 수용하기 위해 완성되었으며, 그 청동 램프는 해안에서 특별히 가져온 장인이 주조하고 걸어 놓았습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_174:0 "#G 완료#! — #high 난디 파빌리온이 완성되었습니다#!\n#F A 파빌리온은 성소를 향한 거대한 황소 난디(Nandi)를 수용하기 위해 완성되었으며, 그 청동 램프는 해안에서 특별히 가져온 장인이 주조하고 걸어 놓았습니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_174:0 "[tv_wonder_ceremony|E]：난디관 완성"
 TV_WONDER_CEREMONY_S6_DESC_174:0 "성소를 향한 거대한 황소 Nandi를 수용하기 위해 파빌리온이 완성되었으며, 해안에서 특별히 가져온 장인이 청동 램프를 주조하고 매달았습니다. 사원 뜰은 솟아오른 탑을 보고 싶어하는 순례자들로 가득 차기 시작합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_174:0 "장인들이 난디의 안뜰 위에 마지막 청동 램프를 걸어 놓습니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_174:0 "아직은 아닙니다. 청동을 좀 더 식혀주세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S7_174:0 "@tv_ceremony_culture!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_174:0 "#Y 진행 중#! — #high 무용수와 사제들이 의식을 연습하고 있습니다.#!\n#F 사원 무용수들과 사제들이 거의 완성된 탑 그늘에서 정교한 봉헌 의식을 연습하고 있으며, 왕의 기부금에 대한 비문이 사용 가능한 모든 곳에 새겨져 있습니다. 벽.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_174:0 "#G 완료#! — #high 무용수와 사제들이 의식을 연습하고 있습니다.#!\n#F 사원 무용수와 사제들이 거의 완성된 탑 그늘에서 정교한 봉헌 의식을 연습하고 있으며, 왕의 기부금에 대한 비문이 사용 가능한 모든 곳에 새겨져 있습니다. 벽.#!"
 TV_WONDER_CEREMONY_S7_TITLE_174:0 "[tv_wonder_ceremony|E]：의례를 연습하는 무용수와 신부"
 TV_WONDER_CEREMONY_S7_DESC_174:0 "사원 무용수들과 성직자들은 거의 완성된 탑 그늘에서 정교한 봉헌 의식을 연습하고 있으며, 모든 벽에는 왕의 기부금에 대한 비문이 새겨져 있습니다. 도시 전체가 기대감으로 들끓습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_174:0 "우리는 신성한 의식을 연습하기 위해 무용수들과 사제들을 소집합니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_174:0 "도시는 기다리고 있지만 의식은 아직 연습되지 않았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_174:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_174:0 "#Y 진행 중#! — #high Kumhabhishekam이 수행됩니다.#!\n#F 사제들이 kumbhabhishekam을 수행하며, 모인 법정, 무용수 및 수천 명의 사람들이 모이기 전에 사원 정상 위에 신성한 물을 붓습니다. 순례자.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_174:0 "#G 완료#! — #high Kumhabhishekam이 수행됩니다.#!\n#F 사제들이 kumbhabhishekam을 수행하며, 모인 법정, 무용수 및 수천 명의 사람들이 모이기 전에 사원 정상 위에 신성한 물을 붓습니다. 순례자.#!"
 TV_WONDER_CEREMONY_S8_TITLE_174:0 "[tv_wonder_ceremony|E]: Kumbhabhishekam이 수행됩니다."
 TV_WONDER_CEREMONY_S8_DESC_174:0 "사제들은 모인 법정, 무용수, 수천 명의 순례자들 앞에서 사원 꼭대기에 성스러운 물을 붓는 쿰바히세캄(kumbhabhishekam)을 수행합니다. 브리하디쉬바라 사원의 완공은 다음 세대를 위한 시바의 축복을 촐라 왕관에 묶는 것입니다.\n\n#weak 행사를 완료하는 데 필요한 가격을 지불하세요. 결과적으로 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_174:0 "강이 바다에 영양을 공급하듯이 헌신은 왕좌에 영양을 공급합니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_174:0 "우리는 사제들에게 새벽을 더 기다려 달라고 요청했습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_175:0 "@tv_ceremony_ruler!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_175:0 "#Y 진행 중#! — #high 왕이 돌 마차를 맹세하다#!\n#F 나라심하데바는 궁정 앞에서 수르야에게 자신의 천상의 마차 모양의 사원을 건설하겠다고 맹세하며, 일곱 마리의 말이 끄고 조각된 스물네 마리의 말이 굴러간다. 바퀴.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_175:0 "#G 완료#! — #high 왕이 돌 마차를 맹세하다#!\n#F 나라심하데바는 궁정 앞에서 수리야에게 일곱 마리의 말이 끄고 조각된 스물네 마리의 마차를 굴리는 자신의 천상의 마차 모양의 사원을 건설하겠다고 맹세합니다. 바퀴.#!"
 TV_WONDER_CEREMONY_S1_TITLE_175:0 "[tv_wonder_ceremony|E]:왕이 돌수레를 맹세하다"
 TV_WONDER_CEREMONY_S1_DESC_175:0 "나라심하데바는 일곱 마리의 말이 끄고 조각된 24개의 바퀴로 굴러가는 자신의 천상의 마차 모양의 사원을 수리야(Surya)에 건설하겠다고 궁정 앞에서 맹세합니다. 서약의 소문은 일주일 안에 오디샤 해안을 따라 퍼집니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_175:0 "왕이 한 번 한 말은 되돌릴 수 없는 수레와 같습니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_175:0 "재판정 앞에서 이 서약을 잠시 동안 조용히 유지하겠습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_175:0 "@tv_ceremony_holy_site!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_175:0 "#Y 진행 중#! — #high 해안 부지가 봉헌되었습니다.#!\n#F 사제들은 아침 해가 가장 먼저 떠오르는 푸리 근처의 해안 땅을 봉헌하고, 왕실 건축가들은 모래 위에 마차의 비율을 스케치하기 시작합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_175:0 "#G 완료#! — #high 해안 부지가 봉헌되었습니다#!\n#F 사제들은 아침 해가 가장 먼저 떠오르는 푸리 근처의 해안 땅을 봉헌하고, 왕실 건축가들은 모래 위에 마차의 비율을 스케치하기 시작합니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_175:0 "[tv_wonder_ceremony|E]：해안 부지가 봉헌되었습니다"
 TV_WONDER_CEREMONY_S2_DESC_175:0 "성직자들은 아침 해가 가장 먼저 떠오르는 푸리 근처의 해안 지역을 봉헌하고, 왕실 건축가들은 모래 위에 마차의 비율을 스케치하기 시작합니다. 전설에 따르면 12,000명의 장인이 현장으로 소환됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_175:0 "성직자들은 파도 속으로 걸어들어가 새벽빛이 비치는 땅을 신성한 곳으로 표시합니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_175:0 "바다조차도 해안을 만나기 위해 서두르지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_175:0 "@tv_ceremony_building_needs!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_175:0 "#Y 진행 중#! — #high 철과 돌이 모인다#!\n#F 내륙의 채석장과 대장간에서 돌과 철로 만든 마차가 도착하고, 철은 해안의 맹렬한 바람에 맞서 탑의 핵심을 묶을 운명입니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_175:0 "#G 완료#! — #high 철과 돌이 모이다#!\n#F 내륙 채석장과 대장간에서 돌과 철 빔으로 만든 마차가 도착하며, 철은 해안의 맹렬한 바람에 맞서 탑의 핵심을 묶을 운명입니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_175:0 "[tv_wonder_ceremony|E]:철과 돌이 모여있다"
 TV_WONDER_CEREMONY_S3_DESC_175:0 "내륙의 채석장과 대장간에서 돌과 철제 빔을 실은 마차가 도착합니다. 철은 해안의 맹렬한 바람에 맞서 탑의 핵심을 묶어줄 운명이었습니다. 전차 바퀴의 복잡한 조각을 계획하기 위해 마스터 조각가들이 도착합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_175:0 "나는 재무부를 엽니 다. 돌과 쇠가 지체 없이 푸리로 흘러가게 하소서."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_175:0 "채석공의 마차는 잠긴 문 뒤에 한가롭게 서 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_175:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_175:0 "#Y 진행중#! — #high 마차의 플랫폼이 놓였습니다.#!\n#F 마차의 기지를 상징하는 거대한 플랫폼이 해안 땅에 놓이게 되었고, 집합의 계절이 지나 마침내 성전의 진정한 건축이 시작되었습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_175:0 "#G 완료#! — #high 마차의 플랫폼이 놓였습니다.#!\n#F 마차의 기지를 상징하는 거대한 플랫폼이 해안 땅에 깔려, 집결의 계절이 지나 마침내 성전의 진정한 건축이 진행됩니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_175:0 "[tv_wonder_ceremony|E]: 전차의 플랫폼이 놓였습니다"
 TV_WONDER_CEREMONY_S4_DESC_175:0 "전차의 기초를 상징하는 거대한 단이 해안 땅에 놓이고, 집합의 계절이 지나고 마침내 성전의 진정한 건축이 진행됩니다. 첫 번째 거대한 돌이 자리를 잡으면 근처에 파도가 부딪칩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_175:0 "파도가 넘어질 때, 메이슨들은 최초의 거대한 돌을 해안 땅에 내려 놓습니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_175:0 "나는 석공들에게 기다리라고 명령했다. 조수는 아직 첫 번째 돌에 적합하지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_175:0 "@tv_ceremony_time!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_175:0 "#Y 진행 중#! — #high 24개의 바퀴가 새겨져 있다#!\n#F 조각가들이 사원의 24개의 바퀴를 한 번에 하나씩 조각하고, 각 테두리에는 바퀴살과 숫자가 너무 정교하게 장식되어 있어 시간을 알려준다고 합니다. 일.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_175:0 "#G 완료#! — #high 24개의 바퀴가 조각되었습니다#!\n#F 조각가들이 사원의 24개의 바퀴를 한 번에 하나씩 조각하고, 각 테두리에는 바퀴살과 숫자가 너무 정교하게 장식되어 있어 시간을 알려준다고 합니다. 일.#!"
 TV_WONDER_CEREMONY_S5_TITLE_175:0 "[tv_wonder_ceremony|E]：24개의 바퀴가 새겨져 있다"
 TV_WONDER_CEREMONY_S5_DESC_175:0 "조각가들은 사원의 24개 바퀴를 한 번에 하나씩 조각하며, 각 바퀴는 바퀴살과 모양으로 장식되어 있어 하루의 시간을 알려준다고 합니다. 군중은 단순히 원석에서 각 바퀴가 나오는 것을 보기 위해 현장에 모입니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_175:0 "구경꾼들이 바퀴가 알려주는 시간을 세는 동안 조각가들은 원석에서 또 다른 바퀴를 꺼냅니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_175:0 "서둘러 새긴 바퀴는 결코 진실이 되지 않는다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_175:0 "@tv_ceremony_art_work!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_175:0 "#Y 진행중#! — #high 7마리의 말이 힘차게 행진한다#!\n#F 수르야의 마차를 끌기 위한 일곱 마리의 말이 사원의 동쪽 면을 따라 새겨져 있으며, 마치 새벽을 향해 질주하는 것처럼 보폭이 얼어붙어 있다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_175:0 "#G 완료#! — #high 7마리의 말이 질주한다#!\n#F 수르야의 마차를 끌기 위한 일곱 마리의 말이 사원의 동쪽 면을 따라 새겨져 있으며, 마치 새벽을 향해 질주하는 것처럼 보폭이 얼어붙어 있다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_175:0 "[tv_wonder_ceremony|E]：7마리의 말이 힘차게 나아갑니다"
 TV_WONDER_CEREMONY_S6_DESC_175:0 "수리야의 마차를 끌기 위한 일곱 마리의 말이 사원의 동쪽 면을 따라 새겨져 있으며, 마치 새벽을 향해 질주하는 것처럼 걸음 중간에 얼어붙어 있습니다. 무용수들의 프리즈와 천체 형상이 나머지 모든 주춧대를 가득 채웁니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_175:0 "나는 일곱 번째 말에게 동쪽 벽을 향해 보폭을 내도록 명령합니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_175:0 "동쪽 얼굴은 한동안 맨손으로 서 있고, 그 말들은 여전히 돌 속에서 자고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_175:0 "@tv_ceremony_building_levels!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_175:0 "#Y 진행 중#! — #high 데울탑이 왕관에 가까워졌습니다#!\n#F 사찰의 우뚝 솟은 들탑이 거의 완성 단계에 이르렀고, 상층 코스는 이미 먼 바다에서 해안 야자수 위로 솟아오르는 모습을 볼 수 있어 여행객들의 숨이 막힐 정도입니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_175:0 "#G 완료#! — #high 데울탑이 왕관에 가까워졌습니다#!\n#F 사찰의 우뚝 솟은 들탑이 거의 완성되었으며, 상층 코스는 먼 바다에서 이미 해안 야자수 위로 솟아오른 탑을 볼 수 있어 여행객들의 숨이 막힐 정도입니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_175:0 "[tv_wonder_ceremony|E]: 들 타워가 왕관에 가까워졌습니다."
 TV_WONDER_CEREMONY_S7_DESC_175:0 "사원의 우뚝 솟은 들탑이 거의 완성 단계에 이르렀고, 상층부는 이미 바다 저 멀리 해안 야자나무 위로 솟아오른 탑을 볼 수 있는 여행자들의 숨을 헐떡거리게 합니다. 무용수들은 축성식을 위한 최종 리허설을 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 비용을 지불하세요. 아니면 아직 시간이 적절하지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_175:0 "선원들이 바다 멀리서 탑의 왕관을 발견할 때 메이슨은 탑의 최종 경로를 설정합니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_175:0 "나는 마지막 코스를 보류합니다. 탑이 비계 아래에서 좀 더 기다리게 해주세요."
 TV_WONDER_CEREMONY_CARD_ICON_S8_175:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_175:0 "#Y 진행 중#! — #high 수리아의 전차가 봉헌되었습니다#!\n#F 새벽의 첫 번째 빛이 조각된 바퀴를 비추자 사제들이 완성된 전차 사원을 봉헌하고, 무용수들은 집합된 법정 앞에서 공연을 하고 순례자들은 건너편에서 왔습니다. 지역.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_175:0 "#G 완료#! — #high 수리아의 전차가 봉헌되었습니다#!\n#F 새벽의 첫 번째 빛이 조각된 바퀴를 비추자 사제들이 완성된 전차 사원을 봉헌하고, 무용수들은 집합된 법정 앞에서 공연하고 순례자들은 건너편에서 왔습니다. 지역.#!"
 TV_WONDER_CEREMONY_S8_TITLE_175:0 "[tv_wonder_ceremony|E]: 수리야의 전차가 봉헌되었습니다"
 TV_WONDER_CEREMONY_S8_DESC_175:0 "새벽의 첫 번째 빛이 조각된 바퀴에 닿을 때 사제들은 완성된 전차 사원을 봉헌하고, 무용수들은 모인 법정 앞에서 공연을 하고 지역 전역에서 순례자들이 모였습니다. 이제 해안의 돌에 고정된 태양신의 축복이 왕국 전체에 꾸준히 빛납니다.\n\n#weak 의식을 완료하는 데 필요한 대가를 지불하세요. 결과적으로 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_175:0 "첫 번째 새벽 빛이 조각된 바퀴에 왕관을 씌울 때 사제들은 마차 사원을 봉헌합니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_175:0 "모인 순례자들은 봉헌식이 또 다른 새벽에 보류되는 동안 해변에서 기다리고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_176:0 "@tv_ceremony_ruler!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_176:0 "#Y 진행 중#! — #high Akbar, 성자의 축복을 기리다#!\n#F Akbar는 수피교 성자 Salim Chishti의 은둔지 근처에 새로운 수도가 세워질 것이라고 선언합니다. 상속인.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_176:0 "#G Completed#! — #high Akbar는 성자의 축복을 기립니다#!\n#F Akbar는 수피 성자 Salim Chishti의 은둔지 근처에 새로운 수도가 세워질 것이라고 선언합니다. 상속인.#!"
 TV_WONDER_CEREMONY_S1_TITLE_176:0 "[tv_wonder_ceremony|E]：Akbar는 성자의 축복을 기립니다"
 TV_WONDER_CEREMONY_S1_DESC_176:0 "악바르는 수피교 성자 살림 치슈티(Salim Chishti)의 은신처 근처에 새로운 수도가 세워질 것이라고 선언하며, 오랫동안 기다려온 상속자의 탄생을 그의 축복으로 여깁니다. 한 달 안에 제국 전역에서 귀족과 건축가가 소환됩니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_176:0 "악바르는 성자의 암자 앞에 무릎을 꿇고 이 땅에 몸을 바칩니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_176:0 "법원은 징조가 판독되기 전에 개시를 시작하지 않고 주저합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_176:0 "@tv_ceremony_building_needs!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_176:0 "#Y 진행 중#! — #high 붉은 사암 채석장 열기#!\n#F 아그라 근처 채석장은 해질녘 신도시에 독특한 빛을 선사할 붉은 사암을 공급하기 위해 문을 열었으며, 측량사는 성자의 소유지 주변에 안뜰을 조성했습니다. 암자.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_176:0 "#G 완료#! — #high 붉은 사암 채석장 오픈#!\n#F 아그라 근처의 채석장은 해질녘에 새로운 도시에 독특한 빛을 줄 붉은 사암을 공급하기 위해 열렸고, 측량사는 성자의 소유지 주변에 안뜰을 조성했습니다. 암자.#!"
 TV_WONDER_CEREMONY_S2_TITLE_176:0 "[tv_wonder_ceremony|E]：붉은 사암 채석장 오픈"
 TV_WONDER_CEREMONY_S2_DESC_176:0 "아그라 근처의 채석장은 일몰 시 새로운 도시에 독특한 빛을 발할 붉은 사암을 공급하기 위해 개방되었으며, 측량사는 성자의 암자 주변에 안뜰을 조성했습니다. 황제가 직접 초기 계획을 점검한다고 합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_176:0 "돌이 깨어난다!"
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_176:0 "측량사들은 도구를 옆으로 치워두고 추가 소식을 기다리고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_176:0 "@tv_ceremony_artists!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_176:0 "#Y 진행 중#! — #high 마스터 빌더 집결#!\n#F 페르시아, 중앙아시아, 인도 출신의 건축가, 서예가, 석공들이 현장에 모여, 각각 혼합 스타일의 도시가 될 도시에 뚜렷한 손길을 뻗고 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_176:0 "#G 완료#! — #high 마스터 빌더가 모였습니다#!\n#F 페르시아, 중앙아시아, 인도 출신의 건축가, 서예가, 석공들이 현장에 모여서 각각 혼합 도시가 될 도시에 뚜렷한 기여를 하고 있습니다. 스타일.#!"
 TV_WONDER_CEREMONY_S3_TITLE_176:0 "[tv_wonder_ceremony|E]：마스터 빌더가 조립되었습니다"
 TV_WONDER_CEREMONY_S3_DESC_176:0 "페르시아, 중앙아시아, 인도 출신의 건축가, 서예가, 석공 석공들이 이 장소에 모여서 각각 혼합된 스타일의 도시가 될 도시에 뚜렷한 기여를 하고 있습니다. 밤새 능선을 따라 노동자 캠프가 솟아오릅니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_176:0 "세 나라의 건축 전문가들이 능선에 텐트를 칩니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_176:0 "아직은 아닙니다. 더 많은 인력이 필요합니다!"
 TV_WONDER_CEREMONY_CARD_ICON_S4_176:0 "@tv_ceremony_city_capital!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_176:0 "#Y 진행 중#! — #high 궁전 기초가 놓였습니다#!\n#F 궁전 단지의 기초가 능선을 가로질러 놓여졌으며, 몇 달 간의 계획과 돌 수집 끝에 파테푸르 시크리의 실제 건물이 마침내 진행되었습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_176:0 "#G 완료#! — #high 궁전 기초가 놓였습니다#!\n#F 궁전 단지의 기초가 능선을 가로질러 놓였고, 몇 달 간의 계획과 돌 수집 끝에 파테푸르 시크리의 진정한 건물이 마침내 진행되었습니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_176:0 "[tv_wonder_ceremony|E]:궁궐의 기초가 놓였습니다"
 TV_WONDER_CEREMONY_S4_DESC_176:0 "능선을 가로질러 궁전 단지의 기초가 놓였고, 몇 달 간의 계획과 석재 수집 끝에 파테푸르 시크리의 진정한 건물이 마침내 진행되었습니다. 메이슨들은 노동 속도를 높이기 위해 시원한 사막의 밤을 통해 릴레이로 일합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_176:0 "메이슨들은 시원한 사막의 밤을 견디며 능선을 가로질러 착공합니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_176:0 "석공들은 도구를 내려놓고 기초는 그대로 두었습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_176:0 "@tv_ceremony_build_icon!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_176:0 "#Y 진행 중#! — #high Diwan-i-Khas 기둥이 솟아오른다#!\n#F Diwan-i-Khas의 중심에 조각된 기둥 하나가 솟아올라 있으며, 그 화려한 주두는 황제가 방사형 4개의 기둥 중앙에 앉을 플랫폼을 지탱할 예정입니다. 교량.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_176:0 "#G 완료#! — #high Diwan-i-Khas 기둥이 솟아오른다#!\n#F Diwan-i-Khas의 중심에 조각된 기둥 하나가 솟아올라 있으며, 그 화려한 주두는 황제가 방사하는 4개의 기둥 중앙에 앉을 플랫폼을 지탱할 예정입니다. 교량.#!"
 TV_WONDER_CEREMONY_S5_TITLE_176:0 "[tv_wonder_ceremony|E]: Diwan-i-Khas 기둥이 솟아오릅니다."
 TV_WONDER_CEREMONY_S5_DESC_176:0 "Diwan-i-Khas의 중심에 단 하나의 조각된 기둥이 솟아 있고, 그 화려한 기둥은 네 개의 방사형 다리 중앙에 황제가 앉을 플랫폼을 지탱할 운명입니다. 장인들은 브래킷의 정확한 조각을 두고 몇 주 동안 토론합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_176:0 "기둥을 세워라!"
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_176:0 "장인들은 스케치에 머물며 조각은 해결되지 않은 채 남아 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_176:0 "@tv_ceremony_prestige!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_176:0 "#Y 진행 중#! — #high 승리를 기념하는 불란드 다르와자(Buland Darwaza)#!\n#F 우뚝 솟은 불란드 다르와자(Buland Darwaza) 관문은 최근 데칸(Deccan)에서 있었던 캠페인을 기념하기 위해 지어졌습니다. 그 비문은 그 아래를 지나가는 모든 사람에게 세상은 지을 집이 아니라 건너야 할 다리라는 사실을 일깨워줍니다 upon.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_176:0 "#G 완료#! — #high Buland Darwaza의 승리 기념#!\n#F 우뚝 솟은 Buland Darwaza 관문은 최근 데칸에서 벌어진 캠페인을 기념하기 위해 지어졌습니다. 그 비문은 그 아래를 지나가는 모든 사람에게 세상은 지을 집이 아니라 건너야 할 다리라는 사실을 일깨워줍니다 upon.#!"
 TV_WONDER_CEREMONY_S6_TITLE_176:0 "[tv_wonder_ceremony|E]:Buland Darwaza가 승리를 기념합니다"
 TV_WONDER_CEREMONY_S6_DESC_176:0 "우뚝 솟은 불란드 다르와자(Buland Darwaza) 관문은 최근 데칸(Deccan)에서 벌어진 캠페인을 기념하기 위해 지어졌습니다. 그 비문은 그 아래를 지나가는 모든 사람에게 세상은 지을 집이 아니라 건너야 할 다리라는 사실을 상기시켜 줍니다. 그 규모는 제국의 다른 모든 문보다 작습니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_176:0 "노동자들은 데칸의 승리를 선포하기 위해 우뚝 솟은 관문을 세웁니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_176:0 "아직은 아닙니다. 영광은 기다릴 수 있습니다!"
 TV_WONDER_CEREMONY_CARD_ICON_S7_176:0 "@tv_ceremony_religious_unity!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_176:0 "#Y 진행 중#! — #high 학자들이 이바다트 카나에 모이다#!\n#F 이바다트 카나가 완성되었으며 이슬람, 힌두교, 기독교, 조로아스터교의 학자들이 황제 앞에서 신앙 문제에 대해 토론하도록 초대됩니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_176:0 "#G 완료#! — #high 학자들이 이바다트 카나에 모이다#!\n#F 이바다트 카나가 완성되었으며 이슬람, 힌두교, 기독교, 조로아스터교의 학자들이 황제 앞에서 신앙 문제에 대해 토론하도록 초대되었습니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_176:0 "[tv_wonder_ceremony|E]: 이바다트 카나에 모인 학자들"
 TV_WONDER_CEREMONY_S7_DESC_176:0 "이바다트 카나가 완성되고 이슬람교, 힌두교, 기독교, 조로아스터교의 학자들이 황제 앞에서 신앙 문제에 대해 토론하도록 초대됩니다. 밤늦게까지 진행된 그들의 주장은 모든 신조 아래 공유된 진실에 대한 Akbar의 커져가는 확신을 형성합니다.\n\n#weak 행사를 다음 단계로 진행하는 데 필요한 대가를 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_176:0 "우리는 이 지붕 아래에서 모든 신앙이 말하는 것을 듣게 될 것입니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_176:0 "홀은 조용했고 토론은 다른 시즌으로 연기되었습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_176:0 "@tv_ceremony_building_open!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_176:0 "#Y 진행 중#! — #high 제국 도시 출범#!\n#F Akbar는 공식적으로 Fatehpur Sikri를 자신의 수도, 신하, 사절 및 학자로 취임하여 Buland Darwaza를 통해 기억될 전시를 진행했습니다. 세대.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_176:0 "#G 완료#! — #high 제국 도시 개관#!\n#F Akbar는 공식적으로 Fatehpur Sikri를 자신의 수도, 신하, 사절 및 학자로 취임하여 Buland Darwaza를 통해 기억될 전시를 진행했습니다. 세대.#!"
 TV_WONDER_CEREMONY_S8_TITLE_176:0 "[tv_wonder_ceremony|E]: 임페리얼 시티(Imperial City)가 출범했습니다."
 TV_WONDER_CEREMONY_S8_DESC_176:0 "Akbar는 여러 세대에 걸쳐 기억될 전시에서 Buland Darwaza를 통과하는 그의 수도, 궁중, 사절 및 학자로 Fatehpur Sikri를 공식적으로 취임했습니다. 도시의 신앙과 조언의 조화는 제국 전역의 통치를 위한 지속적인 모델이 됩니다.\n\n#weak 의식을 완료하는 데 필요한 대가를 지불하세요. 결과적으로 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_176:0 "마침내 — 제국의 도시를 보라!"
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_176:0 "행렬은 취임식을 연기하고 문에서 기다리고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_177:0 "@tv_ceremony_trade!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_177:0 "#Y 진행 중#! — #high 자모린이 모든 사람에게 항구를 개방하다#!\n#F 자모린은 캘리컷의 항구가 아무런 대가나 특혜 없이 모든 출신과 신앙을 가진 상인들을 환영할 것이라고 선언합니다. 이 정책은 이미 카이로와 캔톤.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_177:0 "#G 완료#! — #high 자모린이 모든 사람에게 항구를 개방하다#!\n#F 자모린은 캘리컷의 항구가 모든 출신과 신앙을 가진 상인들을 대가나 호의 없이 환영할 것이라고 선언합니다. 이 정책은 이미 카이로와 캔톤.#!"
 TV_WONDER_CEREMONY_S1_TITLE_177:0 "[tv_wonder_ceremony|E]：자모린호는 모두에게 항구를 개방합니다"
 TV_WONDER_CEREMONY_S1_DESC_177:0 "자모린은 캘리컷의 항구가 통행료나 특혜 없이 모든 출신과 신앙을 가진 상인들을 환영할 것이라고 선언합니다. 이 정책은 이미 카이로와 캔톤까지 속삭였습니다. 말라바르 해안의 상인들은 화물을 항구로 방향을 바꾸기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_177:0 "바다는 항해를 멈추지 않는 항구에 보답합니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_177:0 "우리는 아직 모든 문을 그렇게 넓게 열 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_177:0 "@tv_ceremony_law!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_177:0 "#Y 진행 중#! — #high 항구 헌장 초안 작성#!\n#F 법원 관리들은 이미 해안에 붐비는 아랍, 중국, 말라바르 상인들의 혼합 공동체를 위해 공정 항구 요금 및 분쟁 절차를 설정하는 헌장 초안을 작성했습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_177:0 "#G 완료#! — #high 항구 헌장 초안 작성#!\n#F 법원 관리들은 이미 해안에 붐비는 아랍, 중국, 말라바르 상인들의 혼합 공동체를 위해 공정한 항구 요금과 분쟁 절차를 설정하는 헌장 초안을 작성했습니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_177:0 "[tv_wonder_ceremony|E]：항만 헌장 초안 작성"
 TV_WONDER_CEREMONY_S2_DESC_177:0 "법원 관리들은 이미 해안에 붐비는 아랍, 중국, 말라바르 상인들의 혼합 공동체를 위해 공정한 항만비와 분쟁 절차를 설정하는 헌장 초안을 작성했습니다. 몬순 해류에 익숙한 조종사는 공식적으로 왕관에 의해 유지됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 비용을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_177:0 "법원 서기관은 양피지에 공정 항구법을 적용했습니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_177:0 "아직은 인내심을 가지세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S3_177:0 "@tv_ceremony_building_needs!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_177:0 "#Y 진행 중#! — #high 목재와 석재 수집#!\n#F 새 창고를 준비하기 위해 목재 크레인과 절단된 석재가 해안을 따라 수집되고, 자모린의 관리들은 각 국가의 물품을 어디에 보관해야 하는지를 방문하는 선장들과 협상합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_177:0 "#G 완료#! — #high 목재와 석재 수집#!\n#F 새 창고를 준비하기 위해 목재 크레인과 절단된 석재가 해안을 따라 수집되고, 자모린의 관리들은 방문하는 선장들과 각 국가의 물품을 어디에 보관해야 할지 협상합니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_177:0 "[tv_wonder_ceremony|E]:목재와 돌이 모여있다"
 TV_WONDER_CEREMONY_S3_DESC_177:0 "새 창고를 준비하기 위해 목재 크레인과 절단된 돌을 해안을 따라 모으고, 자모린의 관리들은 방문하는 선장들과 각 국가의 물품을 어디에 보관해야 할지 협상합니다. 몬순 시장은 일주일이 지날수록 더욱 혼잡해집니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_177:0 "우리는 목재와 돌을 해안으로 소환합니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_177:0 "감독관들은 더 많은 것을 모으기 전에 추가 명령을 기다리고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_177:0 "@tv_ceremony_river!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_177:0 "#Y 진행 중#! — #high 첫 번째 부두 말뚝이 구동됩니다.#!\n#F 노동자들이 항구 바닥에 첫 번째 말뚝을 박고 있습니다. 캘리컷 항구의 진정한 건물은 협상과 집결 기간을 거쳐 이제 마침내 진행되고 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_177:0 "#G 완료#! — #high 첫 번째 부두 말뚝이 구동됩니다.#!\n#F 노동자들이 항구 바닥에 첫 번째 말뚝을 박고 있습니다. 이는 캘리컷 항구의 진정한 건물이 협상과 집결 기간을 거쳐 마침내 진행되고 있는 것입니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_177:0 "[tv_wonder_ceremony|E]: 첫 번째 도크 파일링이 구동됩니다."
 TV_WONDER_CEREMONY_S4_DESC_177:0 "노동자들이 항구 바닥에 첫 번째 말뚝을 박고 있습니다. 캘리컷 항구의 진정한 건물은 협상과 집결의 시즌을 거쳐 마침내 진행되고 있습니다. 아랍 다우 선장들은 선박이 정박할 위치를 이미 계획하면서 깊은 관심을 갖고 지켜보고 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_177:0 "모든 큰 부두는 한때 하나의 말뚝이었습니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_177:0 "우리는 아직 첫 번째 파일링을 수행할 준비가 되지 않았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_177:0 "@tv_ceremony_port!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_177:0 "#Y 진행 중#! — #high 제티가 다우선에 닿다#!\n#F 새 부두가 정박된 다우선과 정크선을 만나기 위해 확장되고, 크레인은 예전의 밧줄과 바구니 방식보다 더 빠르게 후추와 생강 더미를 해변으로 휘두릅니다. 허용됩니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_177:0 "#G 완료#! — #high 제티가 다우선에 도달합니다#!\n#F 새 부두가 정박된 다우선과 정크선을 만나기 위해 확장되고, 크레인은 예전의 밧줄과 바구니 방법보다 더 빠르게 후추와 생강 더미를 해변으로 휘두릅니다. 허용됩니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_177:0 "[tv_wonder_ceremony|E]: 부두가 다우강에 다가갑니다."
 TV_WONDER_CEREMONY_S5_DESC_177:0 "새로운 부두는 정박된 다우선과 정크선을 만나기 위해 확장되었으며, 크레인은 지금까지 허용된 기존 밧줄과 바구니 방법보다 더 빠르게 고추와 생강 더미를 해변으로 휘두르고 있습니다. 창고 감독관들은 점점 늘어나는 입고되는 상품의 양을 맞추느라 애쓰고 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_177:0 "크레인은 기다리고 있는 다우선을 만나기 위해 새로운 부두를 흔들고 있습니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_177:0 "서둘러 세워진 부두는 곧 조수를 공급합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_177:0 "@tv_ceremony_market!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_177:0 "#Y 진행 중#! — #high 향신료 창고 완성#!\n#F 후추, 카다몬, 계피를 위한 대규모 창고가 해안가를 따라 완성되었으며, 계량실에는 아랍어, 중국어, 말라얄람어에 능통한 직원이 근무하고 있습니다. 비슷합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_177:0 "#G 완료#! — #high 향신료 창고 완성#!\n#F 후추, 카다몬, 계피를 위한 대형 창고가 해안가를 따라 완성되었으며, 계량소에는 아랍어, 중국어, 말라얄람어에 능통한 직원이 근무하고 있습니다. 비슷합니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_177:0 "[tv_wonder_ceremony|E]：향료창고 완성"
 TV_WONDER_CEREMONY_S6_DESC_177:0 "후추, 카다몬, 계피를 보관하는 대규모 창고가 해안가를 따라 완성되었으며, 계량소에는 아랍어, 중국어, 말라얄람어를 유창하게 구사하는 직원이 근무하고 있습니다. 항구 지역에는 향신료 냄새가 영원히 풍깁니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_177:0 "우리는 향신료 창고를 최종 빔까지 올립니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_177:0 "점원은 창고가 아직 화물을 수용하기에 적합하지 않다고 보고합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_177:0 "@tv_ceremony_tax_efficiency!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_177:0 "#Y 진행 중#! — #high 시장 거리에 늘어선 세관#!\n#F 세관은 혼잡한 시장 거리를 따라 세워져 있으며, 각 직원은 상인의 깃발이나 신앙에 관계없이 상품을 공정하게 평가하기 위해 직원을 배치합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_177:0 "#G 완료#! — #high 시장 거리를 따라 늘어선 세관#!\n#F 세관은 혼잡한 시장 거리를 따라 세워져 있으며, 각 직원은 상인의 깃발이나 신앙에 관계없이 상품을 공정하게 평가하기 위해 직원을 배치합니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_177:0 "[tv_wonder_ceremony|E]：시장 거리에 늘어선 세관"
 TV_WONDER_CEREMONY_S7_DESC_177:0 "세관은 혼잡한 시장 거리를 따라 세워져 있으며, 각 직원은 상인의 깃발이나 신앙에 관계없이 공정하게 상품을 평가합니다. 자모린의 관리들은 공평한 거래로 인도양 무역 전체에 알려졌습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_177:0 "공정한 규모는 저렴한 통행료보다 더 많은 선박을 끌어옵니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_177:0 "우리는 세관 신고를 한 시즌 더 연기할 것입니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_177:0 "@tv_ceremony_prosperity!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_177:0 "#Y 진행 중#! — #high 항구가 세계에 개방됨을 선언#!\n#F 자모린은 캘리컷의 항구가 완전하고 세계에 개방되어 있음을 공식적으로 선언했으며, 부두, 창고 및 세관은 현재 매 몬순 기간 동안 최대 용량으로 운영되고 있습니다. 시즌.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_177:0 "#G 완료#! — #high 항구가 세계에 개방됨을 선언#!\n#F 자모린은 캘리컷의 항구가 완성되어 세계에 개방되었음을 공식적으로 선언했으며, 부두, 창고 및 세관은 현재 매 몬순 기간 동안 최대 용량으로 운영되고 있습니다. 시즌.#!"
 TV_WONDER_CEREMONY_S8_TITLE_177:0 "[tv_wonder_ceremony|E]：항이 세계에 개방됨이 선언되었습니다"
 TV_WONDER_CEREMONY_S8_DESC_177:0 "Zamorin은 Calicut의 항구가 완전하고 전 세계에 개방되어 있음을 공식적으로 선언했으며, 부두, 창고 및 세관은 현재 매 몬순 시즌 동안 최대 용량으로 운영되고 있습니다. 카이로에서 캔톤까지의 선박은 항구 등불을 향해 항로를 설정합니다.\n\n#weak 행사를 완료하는 데 필요한 가격을 지불하세요. 결과적으로 불가사의의 마지막 건물이 떠오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_177:0 "Zamorin은 Calicut의 항구가 모든 바다에 개방되어 있음을 선언합니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_177:0 "너무 빨리 선언된 항구는 항해에 앞서 폭풍을 불러일으킵니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_178:0 "@tv_ceremony_law!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_178:0 "#Y 진행 중#! — #high The Crown Charters the Salt Works#!\n#F A 왕실 헌장은 비엘리치카 공장을 왕실 기업으로 확립하고, 그 소금은 엄격한 왕실 감독 하에 채굴, 무게 측정 및 판매됩니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_178:0 "#G 완료#! — #high The Crown Charters the Salt Works#!\n#F A 왕실 헌장은 비엘리치카 공장을 왕실 기업으로 확립하고, 그 소금은 엄격한 왕실 감독 하에 채굴, 무게 측정 및 판매됩니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_178:0 "[tv_wonder_ceremony|E]：The Crown Charters the Salt Works"
 TV_WONDER_CEREMONY_S1_DESC_178:0 "왕실 헌장은 비엘리치카 공장을 왕실 기업으로 지정하고, 그 소금은 엄격한 왕실 감독 하에 채굴되고, 무게가 측정되고, 판매됩니다. 이미 소금물 샘에 대해 잘 알고 있는 지역 주민들이 굴착기로 처음 모집됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_178:0 "왕실 서기관은 헌장을 봉인하고 첫 번째 굴착자를 소금물 샘으로 소환합니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_178:0 "서둘러 서명한 헌장은 봉인하는 것보다 더 많은 소금을 흘립니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_178:0 "@tv_ceremony_government!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_178:0 "#Y 진행 중#! — #high Royal 검사관이 샤프트를 내려갑니다#!\n#F Royal 검사관은 기존 작업으로 내려가 새로운 갤러리가 이동할 위치를 평가하도록 임명되었으며, 랜턴 조명은 이미 수정으로 줄무늬가 있는 벽에 깜박입니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_178:0 "#G 완료#! — #high Royal 검사관이 샤프트를 내려갑니다#!\n#F Royal 검사관은 기존 작업장으로 내려가 새로운 갤러리가 있어야 할 위치를 평가하도록 임명되었으며, 랜턴 조명은 이미 수정으로 줄무늬가 있는 벽에 깜박입니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_178:0 "[tv_wonder_ceremony|E]: 왕실 검사관이 샤프트를 내려갑니다."
 TV_WONDER_CEREMONY_S2_DESC_178:0 "왕실 검사관은 기존 작업장으로 내려가 새로운 회랑이 어디에 설치되어야 하는지를 평가하도록 임명되었습니다. 이미 크리스탈로 줄무늬가 있는 벽에 랜턴 불빛이 깜박입니다. 이들의 보고서는 왕실 재무부로 직접 전송됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 비용을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_178:0 "우리는 검사관을 샤프트 아래로 보내 새 갤러리가 운영될 위치를 판단합니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_178:0 "조사관들은 아직 등불은 켜지지 않은 채 표면에 서성거렸다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_178:0 "@tv_ceremony_laborers!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_178:0 "#Y 진행 중#! — #high 목재 지지대와 길드 롤 준비됨#!\n#F 목재 지지대는 인근 숲의 수레에 따라 주문되며, 광부 길드가 정식으로 조직되어 임금을 책정하고 심해의 안전을 강화합니다. 갤러리.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_178:0 "#G 완료#! — #high 목재 지지대와 길드 롤 준비됨#!\n#F 목재 지지대는 인근 숲의 수레에 따라 주문되며, 광부 길드가 공식적으로 조직되어 임금을 책정하고 심해의 안전을 강화합니다. 갤러리.#!"
 TV_WONDER_CEREMONY_S3_TITLE_178:0 "[tv_wonder_ceremony|E]：목재 지지대와 길드 롤이 준비되었습니다"
 TV_WONDER_CEREMONY_S3_DESC_178:0 "목재 지지대는 인근 숲의 마차에 따라 주문되며 광부 길드가 공식적으로 조직되어 임금을 책정하고 깊은 갤러리의 안전을 강화합니다. 호이스트는 첫 번째 하강 전에 표면에서 테스트됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_178:0 "광부 길드가 롤을 설정하고 호이스트를 테스트하는 동안 목재를 실은 마차가 도착합니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_178:0 "우리는 마차를 막습니다. 길드 명부는 아직 서명할 준비가 되지 않았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_178:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_178:0 "#Y 진행 중#! — #high 첫 번째 수갱이 가라앉았습니다#!\n#F 첫 번째 실제 수갱이 염분을 함유한 암석 깊숙히 가라앉았고, 몇 시즌의 용선 및 준비 기간을 거쳐 마침내 비엘리치카의 실제 채굴이 진행되었습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_178:0 "#G 완료#! — #high 첫 번째 수갱이 가라앉았습니다#!\n#F 첫 번째 진정한 수갱은 염분을 함유한 암석 깊숙이 파묻혔고, 몇 시즌의 용선 및 준비 기간을 거쳐 마침내 비엘리치카의 실제 채굴이 진행되었습니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_178:0 "[tv_wonder_ceremony|E]: 첫 번째 샤프트가 함몰됨"
 TV_WONDER_CEREMONY_S4_DESC_178:0 "첫 번째 실제 수갱은 염분을 함유한 암석 깊숙이 파묻혀 있으며, 몇 년간의 임대 및 준비 기간을 거쳐 마침내 비엘리치카의 실제 채굴이 진행됩니다. 첫 번째 생소금 수레가 표면으로 끌려올 때 횃불이 긴 그림자를 드리웁니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_178:0 "첫 번째 수갱이 소금을 함유한 암석을 뚫고 들어가고, 가장 먼저 나온 수레가 횃불 속으로 끌려갑니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_178:0 "굴착자들은 암벽에서 멈춰 서고, 수갱은 다음 시즌을 위해 가라앉지 않은 채로 남겨져 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_178:0 "@tv_ceremony_rgo!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_178:0 "#Y 진행 중#! — #high 언덕 아래에 펼쳐진 갤러리#!\n#F 새로운 갤러리는 폴란드 언덕 아래 사방으로 뻗어나갔고, 소금물 우물은 광산 생산량을 두 배로 늘렸습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_178:0 "#G 완료#! — #high 언덕 아래에 펼쳐진 갤러리#!\n#F 새로운 갤러리는 폴란드 언덕 아래 모든 방향으로 뻗어나가고, 소금물 우물은 광산 생산량을 두 배로 늘리기 위해 고체 소금 퇴적물을 따라 두드립니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_178:0 "[tv_wonder_ceremony|E]：언덕 아래에 펼쳐진 갤러리"
 TV_WONDER_CEREMONY_S5_DESC_178:0 "새로운 회랑은 폴란드 언덕 아래 모든 방향으로 뻗어나가고, 소금 침전물 옆에 있는 소금물 우물을 이용하여 광산 생산량을 두 배로 늘립니다. 광부들은 소금 자체에 기록이 새겨진 날짜와 이름을 방 벽에 표시하기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_178:0 "우리는 언덕 아래에 새로운 갤러리를 열고 광부들이 소금에 자신의 이름을 새기도록 합니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_178:0 "언덕 갤러리는 그대로 남아 있으며 염수 우물은 여전히 뚜껑이 덮여 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_178:0 "@tv_ceremony_supply!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_178:0 "#Y 진행 중#! — #high 말 구동 호이스트가 설치되었습니다.#!\n#F 말 구동 호이스트가 메인 샤프트에 설치되어 지금까지 관리했던 기존 수동 회전 윈치보다 훨씬 더 무거운 소금 부하를 표면으로 운반합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_178:0 "#G 완료#! — #high 말 구동 호이스트가 설치되었습니다.#!\n#F 말 구동 호이스트가 메인 샤프트에 설치되어 지금까지 관리했던 기존 수동 회전 윈치보다 훨씬 더 무거운 염분을 표면으로 운반합니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_178:0 "[tv_wonder_ceremony|E]:말 구동 호이스트가 설치되었습니다."
 TV_WONDER_CEREMONY_S6_DESC_178:0 "말이 끄는 호이스트가 메인 샤프트에 설치되어 지금까지 관리했던 오래된 손 회전 윈치보다 훨씬 더 무거운 소금 부하를 표면으로 운반합니다. 카트는 새벽부터 황혼까지 표면에 줄을 서서 소금을 시장 마을로 나릅니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_178:0 "말은 거대한 호이스트에 묶여 있으며, 수레는 새벽부터 황혼까지 시장 마을을 향해 줄을 서기 시작합니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_178:0 "우리는 낡은 윈치를 손으로 돌리는 데 좀 더 오래 둡니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_178:0 "@tv_ceremony_holy_site!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_178:0 "#Y 진행 중#! — #high 광부들이 소금에 예배당을 조각합니다#!\n#F 독실한 광부들이 소금 방에 작은 예배당을 직접 조각하고, 제단, 벽, 심지어 샹들리에까지도 광산 자체 수정으로 만들어졌습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_178:0 "#G 완료#! — #high 광부들이 소금에 예배당을 조각합니다#!\n#F 독실한 광부들이 소금 방에 작은 예배당을 직접 조각하고, 제단, 벽, 심지어는 광산 자체의 수정으로 만든 샹들리에까지 만듭니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_178:0 "[tv_wonder_ceremony|E]: 광부들이 소금에 예배당을 조각하다"
 TV_WONDER_CEREMONY_S7_DESC_178:0 "독실한 광부들은 소금 방, 제단, 벽, 심지어는 광산 자체의 수정으로 만든 샹들리에까지 작은 예배당을 직접 조각합니다. 지하 신사에 대한 소문은 호기심 많은 방문객들을 작업자들과 함께 통로 아래로 끌어들입니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_178:0 "독실한 손이 살아있는 소금으로 제단과 샹들리에를 조각하고, 성소의 소문이 통로 너머로 퍼집니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_178:0 "선택된 방은 맨손으로 서 있고, 소금 벽은 아직 독실한 손으로 깎지 않은 상태입니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_178:0 "@tv_ceremony_wealth!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_178:0 "#Y 진행 중#! — #high 작업에 대한 완전한 라이센스가 부여되었습니다.#!\n#F 크라운은 비엘리치카 작업을 정식으로 라이센스하여 완전 작동 가능하며 샤프트, 갤러리 및 호이스트가 현재 폴란드 국경 너머 시장에 공급하는 꾸준한 생산량으로 운영되고 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_178:0 "#G 완료#! — #high 작업에 대한 정식 라이센스가 부여되었습니다.#!\n#F 왕관은 비엘리치카 작업을 정식으로 라이센스하여 완전 작동 가능하며 샤프트, 갤러리 및 호이스트가 현재 폴란드 국경 너머 시장에 공급하는 꾸준한 생산량으로 운영되고 있습니다.#!"
 TV_WONDER_CEREMONY_S8_TITLE_178:0 "[tv_wonder_ceremony|E]：저작물은 정식 라이센스를 받았습니다"
 TV_WONDER_CEREMONY_S8_DESC_178:0 "왕관은 공식적으로 비엘리치카 작업장을 정식으로 허가했으며, 현재 그 샤프트, 갤러리 및 호이스트는 폴란드 국경 너머 시장에 공급하는 꾸준한 생산량으로 운영되고 있습니다. 광산의 소금과 조용한 지하 예배당은 둘 다 지속적인 왕실 자부심의 원천이 됩니다.\n\n#weak 의식을 완료하는 데 필요한 가격을 지불하세요. 결과적으로 불가사의의 마지막 건물이 세워질 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_178:0 "드디어 정식 라이센스를 취득했습니다!"
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_178:0 "왕관의 인장이 기다리고 있고, 면허증은 서명되지 않은 채로 책상 위에 놓여 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_179:0 "@tv_ceremony_ruler!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_179:0 "#Y 진행 중#! — #high 왕은 왕위에 걸맞는 자리를 명하다#!\n#F 왕은 크라쿠프 위의 언덕 꼭대기를 폴란드 왕위에 걸맞은 거주지로 재건할 것을 명한다. 그 오래된 벽은 너무 풍화되어 왕국의 분위기를 제대로 반영하지 못한다. 서 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_179:0 "#G 완료#! — #high 왕은 왕위에 걸맞는 자리를 명하다#!\n#F 왕은 크라쿠프 위의 언덕 꼭대기를 폴란드 왕위에 걸맞은 거주지로 재건할 것을 명합니다. 오래된 벽은 너무 풍화되어 왕국의 분위기를 제대로 반영하지 못합니다. 서 있습니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_179:0 "[tv_wonder_ceremony|E]: 왕이 왕관에 걸맞는 자리를 선포하다"
 TV_WONDER_CEREMONY_S1_DESC_179:0 "왕은 크라쿠프 위의 언덕 꼭대기를 폴란드 왕위에 걸맞는 거주지로 재건하도록 명령했습니다. 그 오래된 벽은 너무 풍화되어 왕국의 위상을 제대로 반영하지 못했습니다. 전령들은 시즌 동안 왕국의 모든 곳으로 선언문을 전달합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_179:0 "그러니 법령을 선포하십시오!"
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_179:0 "왕은 잠시 동안 법령을 보류합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_179:0 "@tv_ceremony_location!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_179:0 "#Y 진행 중#! — #high 언덕 꼭대기가 정리되었습니다.#!\n#F 바벨 언덕 꼭대기의 오래된 유적이 정리되고, 비스툴라 강이 내려다보이는 땅을 조사하기 위해 왕국 전역에서 마스터 빌더들이 소환됩니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_179:0 "#G 완료#! — #high 언덕 꼭대기가 정리되었습니다#!\n#F 바벨 언덕 꼭대기의 오래된 폐허가 제거되고, 비스툴라 강이 내려다보이는 땅을 조사하기 위해 왕국 전역에서 마스터 빌더들이 소환됩니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_179:0 "[tv_wonder_ceremony|E]：언덕이 깨끗해졌습니다"
 TV_WONDER_CEREMONY_S2_DESC_179:0 "바벨(Wawel) 언덕 꼭대기의 오래된 폐허는 치워지고, 비스툴라(Vistula) 강이 내려다보이는 땅을 조사하기 위해 왕국 전역에서 전문 건축업자들이 소환됩니다. 새로운 돌 하나가 놓이기 전에 주교가 현장을 축복합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_179:0 "언덕 꼭대기가 치워지고 주교가 땅을 축복합니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_179:0 "잠깐만요. 폐허를 좀 더 오래 세워두세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S3_179:0 "@tv_ceremony_building_needs!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_179:0 "#Y 진행 중#! — #high 돌과 목재가 모입니다.#!\n#F 채석된 돌과 목재로 만든 마차가 바벨을 향해 언덕길을 오르고, 방어벽은 도금되어 미래의 성과 그 옆에 있는 대성당을 모두 둘러쌉니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_179:0 "#G 완료#! — #high 돌과 목재가 모였습니다#!\n#F 채석된 돌과 목재로 만든 마차가 바벨을 향해 언덕길을 오르고, 방어벽은 도금되어 미래의 성과 그 옆에 있는 대성당을 모두 둘러쌉니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_179:0 "[tv_wonder_ceremony|E]：돌과 목재가 모여있습니다"
 TV_WONDER_CEREMONY_S3_DESC_179:0 "채석된 돌과 목재로 만든 마차는 바벨(Wawel)을 향해 언덕길을 오르고, 방어벽은 미래의 성과 그 옆에 있는 대성당을 모두 둘러싸도록 도금되어 있습니다. 석공 길드에서는 왕실 프로젝트에 최고의 장인을 투입할 것을 약속합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_179:0 "우리는 길드를 소환하고 Wawel을 위해 돌과 목재를 수집합니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_179:0 "길드들은 기다리고 있는데, 그들의 마차는 아직 비어 있다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_179:0 "@tv_ceremony_city_capital!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_179:0 "#Y 진행 중#! — #high 왕실 기초가 놓였습니다#!\n#F 새로운 왕실 거주지를 위한 기초가 언덕 위에 놓였고, 정리와 집결의 시즌을 거쳐 마침내 바벨 성의 진정한 건물이 진행되었습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_179:0 "#G 완료#! — #high 왕실 기초가 놓였습니다#!\n#F 새로운 왕실 거주지를 위한 기초가 언덕 위에 놓였고, 정리와 집결의 계절을 거쳐 마침내 바벨 성의 진정한 건물이 진행되었습니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_179:0 "[tv_wonder_ceremony|E]:왕립 기초가 놓였습니다"
 TV_WONDER_CEREMONY_S4_DESC_179:0 "새로운 왕실 거주지를 위한 기초가 언덕 꼭대기에 놓였고, 정리와 집결의 시즌을 거쳐 마침내 바벨 성의 진정한 건물이 진행되었습니다. 메이슨들은 겨울이 오기 전에 첫 번째 벽이 올라가는 것을 보기 위해 가을비를 뚫고 일합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_179:0 "드디어 기초가 솟아오르네요!"
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_179:0 "우리는 땅을 짓기 전에 땅이 더 건조해질 때까지 기다릴 것입니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_179:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_179:0 "#Y 진행 중#! — #high 성 타워가 비스툴라 강 위로 솟아있습니다.#!\n#F 성곽의 탑과 큰 홀이 비스툴라 강 위로 꾸준히 솟아 있으며, 뱃사공과 여행자가 성문에 도달하기 훨씬 전에 눈에 띕니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_179:0 "#G 완료#! — #high 성 타워가 비스툴라 강 위로 솟아있습니다.#!\n#F 성곽의 탑과 큰 홀이 비스툴라 강 위로 꾸준히 솟아 있으며, 뱃사공과 여행자가 성문에 도달하기 훨씬 전에 눈에 띕니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_179:0 "[tv_wonder_ceremony|E]: 비스툴라 강 위로 솟아오른 성탑"
 TV_WONDER_CEREMONY_S5_DESC_179:0 "성의 탑과 큰 홀은 비스툴라 강 위로 꾸준히 솟아 있으며, 뱃사공과 여행자가 성문에 도달하기 훨씬 전부터 눈에 띕니다. 궁정 장인들이 왕실 좌석에 어울리는 태피스트리와 조각된 들보로 홀을 장식하기 시작합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_179:0 "타워는 날이 갈수록 강 위로 더 높이 올라갑니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_179:0 "인내심을 갖고 탑이 기다리도록 하세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S6_179:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_179:0 "#Y 진행 중#! — #high 성당 탑이 강화되었습니다#!\n#F 성 옆에 있는 대성당 탑이 새로운 왕실 작품과 함께 강화되고 세워져 두 구조가 언덕의 하나의 통합된 왕관으로 솟아오르도록 보장합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_179:0 "#G 완료#! — #high 성당 탑이 강화되었습니다#!\n#F 성 옆에 있는 대성당 탑이 새로운 왕실 작품과 함께 강화되고 세워져 두 구조가 언덕의 하나의 통합된 왕관으로 솟아오르도록 보장합니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_179:0 "[tv_wonder_ceremony|E]:대성당 탑이 강화되었습니다"
 TV_WONDER_CEREMONY_S6_DESC_179:0 "성 옆에 있는 대성당 탑은 새로운 왕실 작품과 함께 강화되고 세워져 두 구조물이 언덕의 하나의 통합된 왕관으로 솟아오르도록 보장합니다. 종은 성 뜰과 아래 도시를 가로질러 울리도록 다시 주조됩니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_179:0 "우리는 대성당의 탑을 강화하고 종을 다시 주조합니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_179:0 "오래된 종소리는 한동안 조용합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_179:0 "@tv_ceremony_army_strength!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_179:0 "#Y 진행 중#! — #high 궁정실과 무기고가 완료되었습니다#!\n#F 법정실, 무기고, 소집 경비병 숙소가 성벽 안에 완성되었으며, 성의 준비를 위해 모든 홀에 왕국의 깃발이 걸려 있습니다. 취임식.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_179:0 "#G 완료#! — #high 궁정실과 무기고가 완성되었습니다#!\n#F 법정실, 무기고, 소집 경비병 숙소가 성벽 안에 완성되었으며, 성의 준비를 위해 모든 홀에 왕국의 깃발이 걸려 있습니다. 취임식.#!"
 TV_WONDER_CEREMONY_S7_TITLE_179:0 "[tv_wonder_ceremony|E]：법원과 무기고가 완성되었습니다"
 TV_WONDER_CEREMONY_S7_DESC_179:0 "성벽 안에는 법정 방, 무기고, 소집 경비병 숙소가 완성되어 있으며 성의 취임식을 준비하기 위해 모든 홀에 왕국의 깃발이 걸려 있습니다. 이 행사를 기념하기 위한 행렬이 이미 계획되고 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 비용을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_179:0 "왕좌는 그것을 지키는 경비병만큼 굳건하게 서 있습니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_179:0 "재무부가 허용하면 홀을 무장시키겠습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_179:0 "@tv_ceremony_crown_estate!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_179:0 "#Y 진행 중#! — #high 바벨이 왕의 자리로 봉헌됨#!\n#F 주교는 귀족, 경비병, 성직자의 행렬이 아래 도시에서 언덕을 오르기 전에 바벨 성을 왕의 자리로 봉헌합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_179:0 "#G 완료#! — #high 바벨이 왕의 자리로 봉헌됨#!\n#F 주교는 귀족, 경비병, 성직자의 행렬이 아래 도시에서 언덕을 오르기 전에 바벨 성을 왕의 자리로 봉헌합니다.#!"
 TV_WONDER_CEREMONY_S8_TITLE_179:0 "[tv_wonder_ceremony|E]：바벨이 왕좌로 봉헌되다"
 TV_WONDER_CEREMONY_S8_DESC_179:0 "주교는 아래 도시에서 언덕을 따라 올라가는 귀족, 경비병, 성직자의 행렬이 시작되기 전에 바벨 성을 왕궁으로 봉헌합니다. 그날부터 언덕 꼭대기는 왕권의 중심지로서 다음 세대에 걸쳐 확고히 자리 잡게 됩니다.\n\n#weak 의식을 완료하는 데 필요한 대가를 지불하세요. 그 결과 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_179:0 "감독은 모인 법정 앞에서 Wawel을 봉헌합니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_179:0 "기다리세요 – 행렬이 아직 준비되지 않았습니다!"
 TV_WONDER_CEREMONY_CARD_ICON_S1_180:0 "@tv_ceremony_government!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_180:0 "#Y 진행 중#! — #high 신도시에 대한 총리령#!\n#F 총리 얀 자모이스키(Jan Zamoyski)는 한때 자신의 가족이 자리했던 이상적인 도시, 즉 우연이 아닌 이성에 기반한 정착지를 위한 자신의 설계를 선언합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_180:0 "#G 완료#! — #high 신도시에 대한 총리령#!\n#F 대총리 Jan Zamoyski는 한때 자신의 가족이 자리했던 이상적인 도시, 즉 우연이 아닌 이성에 기반한 정착지를 위한 자신의 설계를 선언합니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_180:0 "[tv_wonder_ceremony|E]：신도시 총리령"
 TV_WONDER_CEREMONY_S1_DESC_180:0 "얀 자모이스키(Jan Zamoyski) 대총리는 한때 자신의 가족이 거주했던 이상적인 도시, 즉 우연이 아닌 이유를 바탕으로 건설된 정착지를 위한 자신의 디자인을 선언합니다. 측량사와 이탈리아 건축가가 Zamość에 소환되어 양피지에 비전의 첫 줄을 작성합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_180:0 "총리는 법령에 서명하고 측량사는 Zamość로 출발했습니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_180:0 "우연히 세워진 것은 우연히 무너질 것입니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_180:0 "@tv_ceremony_mapmode!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_180:0 "#Y 진행 중#! — #high Bernardo Morando가 그리드를 그립니다.#!\n#F 건축가 Bernardo Morando가 Łabuńka 하천과 Topornica 하천 사이의 낮은 언덕을 조사하여 거리, 시장 광장 및 미래 요새의 오각형 윤곽선을 표시합니다. 코드와 스테이크 포함.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_180:0 "#G Completed#! — #high Bernardo Morando가 그리드를 그립니다.#!\n#F 건축가 Bernardo Morando는 Łabuńka와 Topornica 하천 사이의 낮은 언덕을 조사하여 거리, 시장 광장 및 미래의 오각형 윤곽을 표시합니다. 끈과 말뚝이 있는 요새.#!"
 TV_WONDER_CEREMONY_S2_TITLE_180:0 "[tv_wonder_ceremony|E]：베르나르도 모란도가 그리드를 그립니다."
 TV_WONDER_CEREMONY_S2_DESC_180:0 "건축가 베르나르도 모란도(Bernardo Morando)는 Łabuńka 하천과 토포르니카 하천 사이의 낮은 언덕을 조사하여 거리, 시장 광장, 미래 보루의 오각형 윤곽을 끈과 말뚝으로 표시합니다. 지역 귀족들은 측량사 캠프를 위해 토지와 목재를 양도하라는 압박을 받습니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_180:0 "나는 측량사들이 요구하는 토지와 목재를 모란도에게 부여합니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_180:0 "지역 귀족들은 아직 자신들의 땅을 포기할 생각이 없어 망설이고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_180:0 "@tv_ceremony_burghers!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_180:0 "#Y 진행 중#! — #high 석공과 상인이 맹세하다#!\n#F 이탈리아와 폴란드에서 모두 모인 길드 석공이 자모이스키의 관리인 앞에서 편차 없이 계획을 세울 것을 맹세하고 상인 가족은 세금 혜택을 받아 합의하도록 유도합니다. 아직 텅 빈 거리.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_180:0 "#G Completed#! — #high 석공과 상인이 맹세하다#!\n#F 이탈리아와 폴란드에서 똑같이 데려온 길드 석공이 Zamoyski의 청지기 앞에서 편차 없이 계획을 세울 것을 맹세하고 상인 가족은 세금 혜택을 받아 아직 텅 빈 거리를 수습해 주세요.#!"
 TV_WONDER_CEREMONY_S3_TITLE_180:0 "[tv_wonder_ceremony|E]：메이슨과 상인들이 선서를 합니다"
 TV_WONDER_CEREMONY_S3_DESC_180:0 "이탈리아와 폴란드에서 모인 길드 석공들은 자모이스키의 관리인 앞에서 편차 없이 계획대로 건설하겠다고 맹세하고, 상인 가족들은 여전히 텅 빈 거리를 해결하기 위해 세금 특권을 부여받도록 유혹받습니다. 첫 번째 기초 도랑은 검은 흙을 파고 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_180:0 "길드 석공들이 맹세를 하고 첫 번째 참호가 절단되었습니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_180:0 "나는 아직 이 상인들에게 특권을 부여할 준비가 되지 않았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_180:0 "@tv_ceremony_market!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_180:0 "#Y 진행 중#! — #high 대시장 광장이 솟아오른다#!\n#F 대시장 광장의 아케이드 정면이 돌 하나하나가 열린 광장 주위로 오르기 시작하며, 이상적인 도시의 진정한 건설이 단순히 그려지는 것이 아니라 마침내 진행되고 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_180:0 "#G 완료#! — #high 대시장 광장이 솟아오른다#!\n#F 대시장 광장의 아케이드 정면이 돌 하나하나가 열린 광장 주위로 오르기 시작하며, 이상적인 도시의 진정한 건설이 단순히 그려지는 것이 아니라 마침내 진행되고 있습니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_180:0 "[tv_wonder_ceremony|E]：대시장 광장이 솟아오른다"
 TV_WONDER_CEREMONY_S4_DESC_180:0 "돌 하나하나, 그레이트 마켓 스퀘어(Great Market Square)의 아케이드 외관이 열린 광장 주위로 오르기 시작합니다. 이상적인 도시의 진정한 건설은 단순히 그려지는 것이 아니라 마침내 진행되고 있습니다. 카르파티아 사암 마차와 이탈리아 장인의 도구가 미완성된 문을 통해 매일 덜거덕거립니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_180:0 "마차가 문을 통과하는 동안 석공들은 아케이드를 돌 하나하나 들어 올립니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_180:0 "한 시즌에 사각형이 세워진 적이 없습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_180:0 "@tv_ceremony_advance!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_180:0 "#Y 진행 중#! — #high 자모시치 아카데미를 위한 재단#!\n#F 시장 외에도 학자와 예수회에서 훈련받은 스승들이 크라쿠프와 경쟁할 학교로 구상된 자모시치 아카데미의 초석을 놓았습니다. 파도바.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_180:0 "#G 완료#! — #high 자모시치 아카데미를 위한 재단#!\n#F 시장 외에도 학자와 예수회에서 훈련받은 스승들이 크라쿠프와 경쟁할 학교로 구상된 자모시치 아카데미의 초석을 놓았습니다. 파도바.#!"
 TV_WONDER_CEREMONY_S5_TITLE_180:0 "[tv_wonder_ceremony|E]：자모시치 아카데미의 기초"
 TV_WONDER_CEREMONY_S5_DESC_180:0 "시장 너머에는 학자들과 예수회에서 훈련받은 스승들이 크라쿠프와 파도바에 맞설 학교로 구상된 자모시치 아카데미의 초석을 놓았습니다. 강의실에 지붕이 없어도 영연방 전역에서 학생들이 도착하기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_180:0 "Zamość가 크라쿠프와 파도바와 경쟁할 수 있도록 초석을 직접 놓았습니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_180:0 "학자들은 강의가 연기된 채 지붕 없는 강당 밖에서 기다리고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_180:0 "@tv_ceremony_defensive_military_stance!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_180:0 "#Y 진행 중#! — #high 경계를 폐쇄하는 요새#!\n#F 엔지니어들이 도시 가장자리 주변에 있는 현대 이탈리아 스타일의 7개의 각진 요새를 추적합니다. 흙 성벽은 타타르족의 습격과 코사크의 침입을 견딜 수 있도록 벽돌로 마감되어 있습니다. 비슷합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_180:0 "#G 완료#! — #high 경계를 폐쇄하는 요새#!\n#F 엔지니어들이 도시 가장자리 주변에서 현대 이탈리아 스타일의 7개의 각진 요새를 추적합니다. 흙 성벽은 타타르족의 습격과 코사크의 침입을 견딜 수 있도록 벽돌로 마감되어 있습니다. 비슷합니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_180:0 "[tv_wonder_ceremony|E]: 요새가 경계를 폐쇄합니다"
 TV_WONDER_CEREMONY_S6_DESC_180:0 "엔지니어들은 도시 가장자리 주변에 현대 이탈리아 스타일로 7개의 각진 요새를 추적합니다. 흙 성벽은 타타르족의 습격과 코사크의 침입을 모두 견딜 수 있도록 벽돌로 마감되어 있습니다. 도시는 시장 도시라기보다는 무역을 하는 요새처럼 보이기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_180:0 "엔지니어들은 일곱 개의 요새를 추적하고 벽돌로 된 성벽을 마주합니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_180:0 "나는 아직 침입자들이 결코 시험하지 않을 성벽에 재무부를 위험에 빠뜨리지 않을 것입니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_180:0 "@tv_ceremony_culture!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_180:0 "#Y 진행 중#! — #high 아르메니아와 그리스 상인들이 집을 장식하고 있습니다.#!\n#F 아르메니아, 그리스, 이탈리아 상인 가족은 Zamoyski의 무역 특권에 이끌려 광장을 따라 다양한 색상과 코트로 아케이드식 타운하우스를 칠하고 치장벽토로 칠합니다. 무기.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_180:0 "#G 완료#! — #high 아르메니아와 그리스 상인들이 집을 장식하고 있습니다.#!\n#F 자모이스키의 무역 특권에 이끌린 아르메니아, 그리스, 이탈리아 상인 가족은 광장을 따라 다채로운 색상과 색상으로 아케이드식 타운하우스를 칠하고 치장벽토로 칠했습니다. 문장.#!"
 TV_WONDER_CEREMONY_S7_TITLE_180:0 "[tv_wonder_ceremony|E]：아르메니아와 그리스 상인들이 집을 장식합니다"
 TV_WONDER_CEREMONY_S7_DESC_180:0 "Zamoyski의 무역 특권에 이끌린 아르메니아, 그리스, 이탈리아 상인 가족은 광장을 따라 다양한 색상과 문장으로 아케이드식 타운하우스를 칠하고 회반죽을 칠합니다. Rynek Wielki는 수세기 동안 유지할 국제적인 모습을 취하고 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_180:0 "아르메니아와 그리스 상인들은 밝은 문장으로 연립 주택을 회반죽으로 칠했습니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_180:0 "상인 가족들은 그들의 정면을 잠시 동안 그대로 방치합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_180:0 "@tv_ceremony_development!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_180:0 "#Y 진행 중#! — #high Zamość 북쪽의 파도바로 서 있습니다.#!\n#F 자모이스키가 자신의 이상적인 도시, 아카데미, 아케이드 및 요새가 마침내 완성되는 것을 봉헌하는 동안 완성된 광장에 종소리가 울립니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_180:0 "#G Completed#! — #high Zamość 북쪽의 파도바로 서 있습니다.#!\n#F 자모이스키가 자신의 이상적인 도시, 아카데미, 아케이드 및 요새를 완성하는 동안 완성된 광장에 종소리가 울립니다. 마지막.#!"
 TV_WONDER_CEREMONY_S8_TITLE_180:0 "[tv_wonder_ceremony|E]：자모시치(Zamość)는 북쪽의 파도바로 우뚝 선다"
 TV_WONDER_CEREMONY_S8_DESC_180:0 "Zamoyski가 이상적인 도시, 아카데미, 아케이드 및 요새가 마침내 완성되는 것을 봉헌하면서 완성된 광장에 종소리가 울립니다. 오늘부터 모델 도시의 잘 정돈된 거리와 분주한 작업장은 왕국 전역의 모든 건축업자의 손길을 빠르게 합니다.\n\n#weak 행사를 완료하는 데 필요한 가격을 지불하세요. 그 결과 경이로운 최종 건물이 세워질 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_180:0 "마침내 Zamość가 완성되었습니다!"
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_180:0 "종소리는 조용해졌고, 봉헌식은 조금 더 길어졌습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_181:0 "@tv_ceremony_trade!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_181:0 "#Y 진행 중#! — #high 의회는 대 부두를 허가합니다#!\n#F 그단스크 시의회는 곡물 수익으로 넘쳐나서 암스테르담, 뤼벡 및 항구와의 무역 증가에 맞춰 Motława 부두 확장을 허가합니다. 너머.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_181:0 "#G 완료#! — #high 의회는 대 부두를 허가합니다#!\n#F 그단스크 시의회는 곡물 수익에 넘쳐 암스테르담, 뤼베크 및 항구와의 무역 증가에 맞춰 모트라바 부두 확장을 허가했습니다. 너머.#!"
 TV_WONDER_CEREMONY_S1_TITLE_181:0 "[tv_wonder_ceremony|E]：의회는 그레이트 키(Great Quays)를 허가했습니다"
 TV_WONDER_CEREMONY_S1_DESC_181:0 "곡물 수익으로 넘쳐나는 그단스크 시의회는 암스테르담, 뤼베크 및 그 외 지역과의 무역 증가에 맞춰 Motława 부두 확장을 허가했습니다. 새로운 부두와 창고에 대한 소문이 일주일 안에 한자동맹 계산소에 퍼집니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_181:0 "드디어 헌장이 봉인되었습니다!"
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_181:0 "의회는 다음 시즌을 위한 헌장을 마련합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_181:0 "@tv_ceremony_river!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_181:0 "#Y 진행 중#! — #high 모트와바 제방 조사#!\n#F 항구 마스터와 네덜란드에서 훈련받은 엔지니어들이 모트라바 강의 습지 둑을 걸어다니며 경쟁하는 곡물 창고 소유주에 맞서 소유권을 주장하고 강이 더 깊어져야 할 곳을 표시합니다. 선체.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_181:0 "#G 완료#! — #high 모트와바 은행 조사#!\n#F 항구 마스터와 네덜란드에서 훈련받은 엔지니어들이 모트와바의 습지 둑을 걸어다니며 경쟁하는 곡물 창고 소유자에 맞서 소유권을 주장하고 강이 더 깊어져야 할 곳을 표시합니다. 선체.#!"
 TV_WONDER_CEREMONY_S2_TITLE_181:0 "[tv_wonder_ceremony|E]：모트와바 은행 조사"
 TV_WONDER_CEREMONY_S2_DESC_181:0 "항만 마스터와 네덜란드에서 훈련받은 엔지니어들은 모트와바 강의 습지 둑을 거닐며 경쟁하는 곡물 창고 소유주를 상대로 소유권을 주장하고 더 무거운 선체를 만들기 위해 강이 깊어져야 하는 곳을 표시합니다. 오래된 낚시용 부두를 매각하거나 철거하여 땅을 청소합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_181:0 "측량사는 진흙탕 둑을 따라 자신의 주장을 주장합니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_181:0 "아직은 아닙니다. 은행이 기다리도록 하세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S3_181:0 "@tv_ceremony_laborers!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_181:0 "#Y 진행 중#! — #high 비스툴라 강을 따라 내려가는 목재 뗏목#!\n#F 마조비아 숲에서 비스툴라 강을 따라 떠내려온 폴란드 참나무와 소나무 뗏목이 벽 아래에 묶여 조선공과 선원들을 기다리고 있습니다. 파일 드라이버.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_181:0 "#G 완료#! — #high 비스툴라 강을 따라 내려가는 목재 뗏목#!\n#F 마조비아 숲에서 비스툴라 강을 따라 떠내려온 폴란드 참나무와 소나무 뗏목이 벽 아래에 묶여 조선공과 선원들을 기다리고 있습니다. 파일 드라이버.#!"
 TV_WONDER_CEREMONY_S3_TITLE_181:0 "[tv_wonder_ceremony|E]: 비스툴라 강을 따라 내려가는 목재 뗏목"
 TV_WONDER_CEREMONY_S3_DESC_181:0 "마조비아 숲에서 비스툴라 강을 따라 떠내려온 폴란드 참나무와 소나무로 만든 뗏목이 성벽 아래에 묶여 조선공과 파일 박는 사람을 기다리고 있습니다. 첫 번째 동전이 손에 들어오자 길드 목수들이 시장 앞에서 계약을 맹세합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_181:0 "목수는 첫 번째 동전이 지불될 때 계약서에 서명합니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_181:0 "목재 뗏목이 벽 아래에서 셀 수 없이 기다리고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_181:0 "@tv_ceremony_port!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_181:0 "#Y 진행 중#! — #high 강바닥에 쌓인 말뚝#!\n#F 거대한 참나무 더미가 모틀와바의 미사 깊숙이 박혀 있으며, 새벽부터 황혼까지 파일 박는 사람이 두드리면서 위대한 항구의 진정한 작업이 마침내 진행되고 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_181:0 "#G 완료#! — #high 강바닥에 박힌 말뚝#!\n#F 거대한 참나무 더미가 모틀와바의 미사 깊숙이 박혀 있으며, 새벽부터 밤까지 파일 박는 사람이 두드리면서 위대한 항구의 진정한 작업이 마침내 진행되고 있습니다. 황혼.#!"
 TV_WONDER_CEREMONY_S4_TITLE_181:0 "[tv_wonder_ceremony|E]: 강바닥에 쌓인 더미"
 TV_WONDER_CEREMONY_S4_DESC_181:0 "거대한 참나무 더미가 모트와바(Motława)의 미사 깊숙이 박혀 있으며, 새벽부터 황혼까지 파일 박는 사람이 두드리면서 거대한 항구의 진정한 작업이 마침내 진행되고 있습니다. 첫 번째 새 부두의 뼈대가 물가를 따라 모양을 갖추기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_181:0 "드디어 본격적인 작업이 시작됩니다!"
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_181:0 "파일 드라이버는 지금은 조용합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_181:0 "@tv_ceremony_food!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_181:0 "#Y 진행 중#! — #high 오워비앙카의 곡물창고 상승#!\n#F 오워비앙카 섬에서는 벽돌 곡물창고가 층층이 성장하고 있으며, 두꺼운 벽은 곡물이 네덜란드의 본거지로 채워지기 전에 긴 발트해 겨울 동안 건조함을 유지하도록 설계되었습니다. fluyts.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_181:0 "#G 완료#! — #high 오워비앙카의 곡물창고 상승#!\n#F 오워비앙카 섬에서는 벽돌 곡물창고가 층층이 성장하고 있으며, 두꺼운 벽은 곡물이 네덜란드의 본거지로 채워지기 전에 긴 발트해 겨울 동안 건조함을 유지하도록 설계되었습니다. fluyts.#!"
 TV_WONDER_CEREMONY_S5_TITLE_181:0 "[tv_wonder_ceremony|E]：Ołowianka Rise의 곡물창고"
 TV_WONDER_CEREMONY_S5_DESC_181:0 "올워비앙카(Ołowianka) 섬에는 벽돌 곡물창고가 층층이 쌓여 있으며, 두꺼운 벽은 곡물이 네덜란드 플루트의 창고를 채우기 전에 긴 발트해 겨울 동안 건조한 상태를 유지하도록 설계되었습니다. 폴란드 호밀 자루가 이미 물가에 쌓여 저장을 기다리고 있습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_181:0 "벽돌 곡물창고는 Ołowianka에서 이야기를 이어가고 있습니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_181:0 "호밀은 조금 더 기다리자!"
 TV_WONDER_CEREMONY_CARD_ICON_S6_181:0 "@tv_ceremony_supply!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_181:0 "#Y 진행 중#! — #high 대형 크레인이 제 위치에 올려져 있습니다#!\n#F 목수들이 대하버 크레인의 쌍둥이 나무 탑을 들어올립니다. 거대한 트레드휠은 인간이 감당하기에는 너무 무거운 선박의 화물칸에서 돛대, 대포, 화물을 들어올리기 위해 만들어졌습니다. 무기.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_181:0 "#G 완료#! — #high 대형 크레인이 제자리로 들어 올려졌습니다#!\n#F 목수들이 대하버 크레인의 쌍둥이 나무 탑을 들어올립니다. 거대한 트레드휠은 사람이 감당하기에는 너무 무거운 선박의 화물칸에서 돛대, 대포, 화물을 들어올리기 위해 만들어졌습니다. 무기.#!"
 TV_WONDER_CEREMONY_S6_TITLE_181:0 "[tv_wonder_ceremony|E]: 대두루미가 제자리에 올려져 있습니다"
 TV_WONDER_CEREMONY_S6_DESC_181:0 "목수들은 인간의 손이 닿기에는 너무 무거운 배의 화물칸에서 돛대, 대포, 화물을 들어올리기 위해 만들어진 거대한 트레드휠인 대항만 기중기의 쌍둥이 나무 탑을 들어 올립니다. 군중은 부두에 모여 첫 번째 테스트 리프트가 하늘을 향해 신음하는 것을 지켜봅니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_181:0 "우리는 모인 군중 앞에서 큰 학을 들어 올립니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_181:0 "목수들은 연장을 내린다. 크레인은 반쯤 완성된 상태를 기다립니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_181:0 "@tv_ceremony_market!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_181:0 "#Y 진행 중#! — #high Amber와 목재가 창고를 채우고 있습니다.#!\n#F 부두를 따라 있는 상인 주택은 발트해 호박, 곡물 자루, 멀리 영국까지 조선소로 향하는 쌓인 목재로 가득 차 있습니다. 크레인의 그림자.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_181:0 "#G 완료#! — #high Amber와 목재가 창고를 채우다#!\n#F 부두를 따라 있는 상인 주택은 발트해 호박, 곡물 자루, 멀리 영국까지 조선소로 향하는 쌓인 목재로 가득 차 있으며, 한자동맹 요인들은 가격을 놓고 흥정을 벌입니다. 크레인 그림자 아래.#!"
 TV_WONDER_CEREMONY_S7_TITLE_181:0 "[tv_wonder_ceremony|E]：호박과 목재로 창고를 채우다"
 TV_WONDER_CEREMONY_S7_DESC_181:0 "부두를 따라 있는 상인 가옥에는 발트 해의 호박, 곡물 자루, 멀리 영국까지 조선소로 향하는 쌓인 목재가 가득 차 있으며, 한자동맹 요인들은 크레인의 그림자 아래에서 가격을 놓고 흥정을 벌입니다. 항구의 새로운 지역은 동시에 12개 언어로 웅웅거립니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 비용을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_181:0 "드디어 창고가 넘쳤어요!"
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_181:0 "우리는 호박을 좀 더 오래 참습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_181:0 "@tv_ceremony_wealth!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_181:0 "#Y 진행 중#! — #high 단치히의 항구가 세계로 개방됩니다.#!\n#F 의회는 대형 크레인, 곡물창고, 석조 부두를 지나 짐을 실은 선박의 행렬과 함께 재건된 항구의 개방을 선언합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_181:0 "#G 완료#! — #high 단치히의 항구가 세계로 개방됩니다#!\n#F 의회는 대형 크레인, 곡물 저장고 및 석재 부두를 지나 짐을 실은 선박의 행렬과 함께 재건된 항구 개방을 선언합니다.#!"
 TV_WONDER_CEREMONY_S8_TITLE_181:0 "[tv_wonder_ceremony|E]：단치히 항구가 세계에 개방되다"
 TV_WONDER_CEREMONY_S8_DESC_181:0 "의회는 대형 크레인, 곡물창고, 석조 부두를 지나 짐을 실은 선박의 행렬과 함께 재건된 항구의 개방을 선언합니다. 오늘부터 매년 발트해 전역에서 항구와 곡물창고의 현상금 교역과 동전이 금고를 가득 채웁니다.\n\n#weak 행사를 완료하는 데 필요한 가격을 지불하세요. 결과적으로 불가사의의 마지막 건물이 세워질 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_181:0 "의회는 대항구가 세계에 개방되어 있음을 선언합니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_181:0 "아직은 아닙니다. 배들이 항구에서 기다리도록 하세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S1_182:0 "@tv_ceremony_ruler!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_182:0 "#Y 진행 중#! — #high 요새 수도원을 요구하는 그랜드 마스터#!\n#F 튜턴 기사단의 그랜드 마스터는 지휘관을 말보르크로 소환하여 노가트에 있는 기사단의 본거지를 어떤 군대도 점령할 수 없는 요새와 수도원으로 재건할 것이라고 선언합니다. 어떤 규칙도 손상될 수 없습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_182:0 "#G 완료#! — #high 요새 수녀원을 요구하는 그랜드 마스터#!\n#F 튜턴 기사단의 그랜드 마스터는 지휘관을 말보르크로 소환하여 Nogat에 있는 기사단의 본거지를 어떤 군대도 점령할 수 없는 요새로 재건할 것이라고 선언합니다. 수녀원의 어떤 규칙도 손상될 수 없습니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_182:0 "[tv_wonder_ceremony|E]: 그랜드 마스터가 요새 수녀원을 요청하다"
 TV_WONDER_CEREMONY_S1_DESC_182:0 "튜턴 기사단의 그랜드 마스터는 자신의 지휘관을 말보르크로 소환하여 노가트 강에 있는 기사단의 본거지를 어떤 군대도 점령할 수 없는 요새로 재건하고 어떤 통치도 타락시킬 수 없는 수도원으로 재건할 것이라고 선언합니다. 흰 망토를 입은 기사들이 각 군에서 달려와 포고령을 지켜봅니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_182:0 "그랜드 마스터는 말보르크의 돌에 기사단의 명예를 걸었습니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_182:0 "급히 쌓은 요새는 무너지기 위해 쌓은 요새이다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_182:0 "@tv_ceremony_building_needs!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_182:0 "#Y 진행 중#! — #high Nogat를 따라 있는 가마#!\n#F 벽돌 제작자들은 Nogat 강둑을 따라 늘어선 가마를 설치하여 교단의 상징적인 벽이 될 짙은 붉은 점토를 굽고, 바지선은 기초를 위한 화강암 현장석을 노가트에서 가져옵니다. 프로이센 시골.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_182:0 "#G Completed#! — #high Nogat를 따라 있는 가마#!\n#F 벽돌 제작자들은 Nogat 강둑을 따라 줄지어 늘어선 가마를 설치하여 교단의 상징적인 벽이 될 짙은 붉은 점토를 굽고, 바지선은 기초를 위한 화강암 현장석을 노가트에서 가져옵니다. 프로이센 시골.#!"
 TV_WONDER_CEREMONY_S2_TITLE_182:0 "[tv_wonder_ceremony|E]：노갓을 따라 있는 가마"
 TV_WONDER_CEREMONY_S2_DESC_182:0 "벽돌공들은 노가트(Nogat) 강둑을 따라 늘어선 가마를 설치하여 기사단의 상징적인 벽이 될 진한 붉은 점토를 굽고, 바지선은 기초를 놓을 화강암 현장석을 프로이센 시골에서 가져옵니다. 지휘관은 명령의 권한 하에 있는 주변 마을에서 노예 노동을 징발합니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_182:0 "우리는 Nogat가 감당할 수 있는 모든 가마불을 피웁니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_182:0 "지휘관들은 아직 가마를 짓고 싶지 않아 주저하고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_182:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_182:0 "#Y 진행 중#! — #high 챕터가 기초를 축복합니다#!\n#F 교단의 사제 형제들은 엄숙한 챕터 미사에서 표시된 기초를 축복하며 성모 마리아를 다가오는 요새의 수호자로 부르짖습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_182:0 "#G 완료#! — #high 챕터가 기초를 축복합니다#!\n#F 교단의 사제 형제들은 엄숙한 챕터 미사에서 표시된 기초를 축복하며 성모 마리아를 다가오는 요새의 수호자로 부르짖습니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_182:0 "[tv_wonder_ceremony|E]: 챕터가 재단을 축복합니다"
 TV_WONDER_CEREMONY_S3_DESC_182:0 "수도회의 사제 겸 수사들은 장엄한 총회 미사에서 표시된 기초를 축복하고, 다가오는 요새의 수호자이신 동정 마리아를 부르짖습니다. 높은 성 지하실의 첫 번째 돌은 기사와 하사들의 집합 앞에 놓입니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_182:0 "먼저 기도로 세우지 않으면 성벽이 세워지지 않습니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_182:0 "나는 우리가 첫 번째 돌을 놓기 전에 더 상서로운 미사를 기다릴 것입니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_182:0 "@tv_ceremony_defensive_military_stance!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_182:0 "#Y 진행중#! — #high 높은 성벽 오르기#!\n#F 붉은 벽돌로 쌓은 벽돌, 높은 성의 우뚝 솟은 커튼월이 노갓 위로 솟아오르기 시작하는데, 이제까지의 측량과 축복을 대체한 진정한 건축의 노동.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_182:0 "#G 완료#! — #high 높은 성벽 오르기#!\n#F 붉은 벽돌로 쌓은 벽돌, 높은 성의 우뚝 솟은 커튼월이 노가트 위로 솟아오르기 시작하는데, 이제까지의 측량과 축복을 대체한 진정한 건축의 노동.#!"
 TV_WONDER_CEREMONY_S4_TITLE_182:0 "[tv_wonder_ceremony|E]：높은 성벽이 오르다"
 TV_WONDER_CEREMONY_S4_DESC_182:0 "붉은 벽돌 하나하나, 높은 성의 우뚝 솟은 외벽이 노갓 위로 솟아오르기 시작합니다. 이는 마침내 이전의 측량과 축복을 대체하는 진정한 건축 노동입니다. 석공들이 더위가 내리기 전 시원한 사막의 아침을 헤쳐나가는 동안 포플러 기둥의 비계가 벽을 따라 늘어서 있습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_182:0 "석공들은 정오의 더위가 오기 전에 붉은 벽돌 위에 붉은 벽돌을 쌓으며 계속 전진합니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_182:0 "모르타르가 마르기 전에 벽이 너무 빨리 균열됩니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_182:0 "@tv_ceremony_holy_site!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_182:0 "#Y In progress#! — #high Vaulting the Chapel of St. Mary#!\n#F Master masons raise the ribbed vaults of the castle chapel dedicated to St.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_182:0 "#G Completed#! — #high Vaulting the Chapel of St. Mary#!\n#F Master masons raise the ribbed vaults of the castle chapel dedicated to St.#!"
 TV_WONDER_CEREMONY_S5_TITLE_182:0 "[tv_wonder_ceremony|E]:성모 마리아 예배당의 아치형 천장"
 TV_WONDER_CEREMONY_S5_DESC_182:0 "석공들은 성모 마리아에게 헌정된 성 예배당의 늑골이 있는 둥근 천장을 들어올리고, 천장을 향해 올라가는 벽돌 기둥은 가장 자랑스러운 기사라도 겸손하게 만들었습니다. 그 아래에는 형제들의 공동 생활을 위한 수녀원의 식당과 기숙사가 형성되어 있습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_182:0 "우리는 가장 자랑스러운 기사조차 겸손하게 만들 만큼 높은 천장을 자랑합니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_182:0 "형제들은 금고의 갈비뼈를 돌로 고정하기 전에 시간을 더 달라고 요청합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_182:0 "@tv_ceremony_supply!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_182:0 "#Y 진행 중#! — #high 장기 포위 공격에 맞서는 곡물창고#!\n#F 중간 베일리 안에 거대한 벽돌 곡물창고와 창고가 솟아 있으며, 언젠가 폴란드나 리투아니아인들이 노가트에 가져올 포위 공격에 대비해 비축되어 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_182:0 "#G 완료#! — #high 장기 포위 공격에 맞서는 곡물창고#!\n#F 중간 베일리 안에 거대한 벽돌 곡물창고와 창고가 솟아 있으며, 언젠가 폴란드나 리투아니아인들이 노가트에 가져올 포위 공격에 대비해 비축되어 있습니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_182:0 "[tv_wonder_ceremony|E]：장기 포위 공격에 맞서는 곡물창고"
 TV_WONDER_CEREMONY_S6_DESC_182:0 "중앙 베일리에는 거대한 벽돌 창고와 저장실이 솟아 있으며, 언젠가 폴란드나 리투아니아인들이 노가트에 가져올 포위 공격에 대비해 비축되어 있습니다. 엔지니어들은 해자, 도개교, 살인 구멍을 추가하여 헌신을 억제력으로 바꿉니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_182:0 "기술자들은 해자를 깊이 파고 앞으로 어떤 포위 공격이 닥쳐올지 대비하여 곡물 창고를 비축합니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_182:0 "나는 굴착기를 저지합니다. 해자가 더 평온한 해를 기다리도록 놔두십시오."
 TV_WONDER_CEREMONY_CARD_ICON_S7_182:0 "@tv_ceremony_prestige!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_182:0 "#Y 진행 중#! — #high 단장의 궁전이 화려해졌습니다#!\n#F A 그랜드 마스터를 위한 새로운 궁전 건물이 솟아오르고, 그랜드 식당은 가느다란 야자나무 기둥 위에 아치형으로 되어 있어 전체 장을 동시에 앉힐 수 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_182:0 "#G 완료#! — #high 단장의 궁전이 화려해졌습니다#!\n#F A 그랜드 마스터를 위해 새로운 궁전 건물이 솟아오르고, 그랜드 식당은 가느다란 야자나무 기둥 위에 아치형으로 되어 있어 전체 장을 동시에 앉힐 수 있습니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_182:0 "[tv_wonder_ceremony|E]: 거장의 궁전이 화려하게 빛납니다"
 TV_WONDER_CEREMONY_S7_DESC_182:0 "그랜드 마스터를 위한 새로운 궁전 동이 솟아오릅니다. 그 그랜드 식당은 가느다란 야자나무 기둥 위에 아치형으로 되어 있어 전체 챕터를 동시에 수용할 수 있습니다. 화가와 유리공들이 교단의 늘어나는 부에 어울리는 문장 유리와 프레스코화로 홀을 가득 채웁니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_182:0 "화가와 유리공은 기사단의 동전을 자유롭게 사용하여 유리와 프레스코화로 궁전을 장식합니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_182:0 "화려함을 위해 소비한 금으로는 수비대를 먹일 수 없습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_182:0 "@tv_ceremony_army_tradition!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_182:0 "#Y 진행 중#! — #high 말보르크는 정복할 수 없는 위치에 서 있다#!\n#F 대주님은 완성된 요새 수녀원을 성 예배당에서 미사로 봉헌한다#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_182:0 "#G 완성#! — #high 말보르크는 정복할 수 없는 위치에 서 있다#!\n#F 대주님은 완성된 요새 수녀원을 성 예배당에서 미사로 봉헌한다#!"
 TV_WONDER_CEREMONY_S8_TITLE_182:0 "[tv_wonder_ceremony|E]: 말보르크는 무적이다"
 TV_WONDER_CEREMONY_S8_DESC_182:0 "그랜드 마스터는 완성된 요새 수녀원을 성모 마리아 예배당에 미사로 봉헌하는데, 그 붉은 벽은 현재 기독교계에서 가장 큰 벽돌 요새가 되었습니다. 오늘부터 기사단의 기사들은 말보르크의 완성된 성벽이 여러 세대에 걸쳐 영감을 줄 규율과 인내력으로 소집됩니다.\n\n#weak 의식을 완료하는 데 필요한 대가를 지불하세요. 결과적으로 불가사의의 마지막 건물이 세워질 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_182:0 "나는 말보르크의 이름이 영원히 지속되도록 전체 장 앞에서 이 벽을 봉헌합니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_182:0 "장은 요새가 완성되었음을 선언하기를 꺼려 봉헌 미사를 연기합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_183:0 "@tv_ceremony_organization!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_183:0 "#Y 진행 중#! — #high 카할이 더 큰 구역을 요구하다#!\n#F 공동체의 통치 위원회인 카할은 브레스트의 회당 구역을 학자와 상인 모두에게 합당한 자리로 확장하기로 결심합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_183:0 "#G 완료#! — #high 카할은 더 큰 구역을 요구합니다#!\n#F 공동체의 통치 위원회인 카할은 브레스트의 회당 구역을 학자와 상인 모두에게 합당한 자리로 확장하기로 결심합니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_183:0 "[tv_wonder_ceremony|E]: Kahal은 더 큰 분기를 요구합니다"
 TV_WONDER_CEREMONY_S1_DESC_183:0 "지역 사회의 통치 위원회인 카할은 브레스트의 회당 구역을 학자와 상인 모두에게 합당한 자리로 확장하기로 결정했습니다. 장로와 랍비들은 길드와 연구실에 지역 사회의 길고 비좁은 길이 마침내 넓어질 것이라는 소식을 전합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하고, 아직 때가 되지 않았다면 기다리십시오.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_183:0 "우리는 결심합니다. 이 비좁은 차선은 마침내 넓어질 것입니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_183:0 "장로들은 좀 더 조용한 시기를 위해 청원서를 제쳐두었습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_183:0 "@tv_ceremony_diplomacy!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_183:0 "#Y 진행 중#! — #high 주(Voivode)에 토지 청원 중#!\n#F 공동체 장로들은 구시가지의 경계 돌 너머로 확장할 수 있는 권리에 대해 지역 주(voivode)에 청원하고 관례적인 비용을 지불합니다. 커먼웰스.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_183:0 "#G 완료#! — #high 주(Voivode)에 토지 청원 중#!\n#F 공동체 장로들은 구시가지의 경계 돌 너머로 확장할 수 있는 권리에 대해 지역 주(voivode)에 청원하고 관례적인 비용을 지불합니다. 커먼웰스.#!"
 TV_WONDER_CEREMONY_S2_TITLE_183:0 "[tv_wonder_ceremony|E]：주정부에 토지 청원"
 TV_WONDER_CEREMONY_S2_DESC_183:0 "지역 사회 장로들은 지역 주지사에게 청원하고 구시가지의 경계석 너머로 확장할 권리에 대한 관례적인 비용을 지불합니다. 이는 영연방의 모든 특권 문에서 반복되는 섬세한 협상입니다. 측량사는 시장과 강둑 사이에 새로운 길을 표시합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_183:0 "장로들은 총독의 수수료를 지불하고 청원서를 봉인합니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_183:0 "우리는 감히 주지사를 서둘러 압박할 수 없습니다. 청원을 기다리십시오."
 TV_WONDER_CEREMONY_CARD_ICON_S3_183:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_183:0 "#Y 진행 중#! — #high 목재와 토라 두루마리 도착#!\n#F 마차는 새 연구실을 위해 노련한 목재와 발트 벽돌을 가져오고, 랍비 행렬은 첫 번째 삽이 돌기 전에 땅을 축복하기 위해 신선한 토라 두루마리를 거리로 운반합니다. it.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_183:0 "#G Completed#! — #high 목재와 토라 두루마리 도착#!\n#F 마차는 새로운 연구실을 위해 노련한 목재와 발트 벽돌을 가져오고, 랍비 행렬은 첫 번째 삽이 돌기 전에 땅을 축복하기 위해 신선한 토라 두루마리를 거리로 운반합니다. it.#!"
 TV_WONDER_CEREMONY_S3_TITLE_183:0 "[tv_wonder_ceremony|E]: 목재와 토라 두루마리 도착"
 TV_WONDER_CEREMONY_S3_DESC_183:0 "마차는 새로운 연구실을 위한 노련한 목재와 발트 벽돌을 가져오고, 랍비들의 행렬은 첫 번째 삽이 돌기 전에 땅을 축복하기 위해 신선한 토라 두루마리를 거리로 운반합니다. 크라쿠프와 루블린의 장인들이 목공 계약 입찰을 위해 도착했습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_183:0 "랍비가 변한 땅을 축복하는 동안 마차는 목재를 내립니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_183:0 "마차는 쿼터의 금고가 허용할 때까지 뒤로 돌아갑니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_183:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_183:0 "#Y 진행 중#! — #high 새 연구실의 기초#!\n#F 첫 번째 목재 골조가 시장 길을 따라 올라가고, 목수와 석공이 Kahal의 감시 아래 나란히 작업하면서 해당 분기의 진정한 건설이 진행 중입니다. 청지기.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_183:0 "#G 완료#! — #high 새 연구실의 기초#!\n#F 첫 번째 목재 프레임이 시장 길을 따라 올라가고, 목수와 석공이 Kahal의 감시 아래 나란히 작업하면서 해당 분기의 진정한 건설이 진행 중입니다. 청지기.#!"
 TV_WONDER_CEREMONY_S4_TITLE_183:0 "[tv_wonder_ceremony|E]: 새로운 학습 하우스의 기초"
 TV_WONDER_CEREMONY_S4_DESC_183:0 "시장 길을 따라 첫 번째 목재 골조가 솟아오르고, 목수와 석공이 Kahal의 감시하는 관리인 밑에서 나란히 일하면서 구역의 진정한 건설이 진행 중입니다. 청원과 행렬이 이제는 망치와 들보가 되었습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_183:0 "마침내 망치와 빔!"
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_183:0 "목수들은 집으로 보내지고 목재는 쌓이지 않은 채로 남아 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_183:0 "@tv_ceremony_art_work!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_183:0 "#Y 진행 중#! — #high 대 회당의 방주 조각#!\n#F 목각 전문가들은 해당 구역의 대 회당에서 정교하게 조각된 토라 방주와 비마 플랫폼을 형성하며, 시장이 문을 닫은 후에도 오랫동안 촛불을 켜고 작업합니다. 밤.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_183:0 "#G 완료#! — #high 대회당의 방주 조각#!\n#F 마스터 목각가들은 해당 구역의 대회당에서 정교하게 조각된 토라 방주와 비마 플랫폼을 형성하며, 시장이 문을 닫은 후에도 오랫동안 촛불 아래서 작업합니다. 밤.#!"
 TV_WONDER_CEREMONY_S5_TITLE_183:0 "[tv_wonder_ceremony|E]：대회당의 방주 조각"
 TV_WONDER_CEREMONY_S5_DESC_183:0 "목각 기술의 대가들은 지역의 대회당(Great Synagogue)에서 정교하게 조각된 토라 방주와 비마 플랫폼을 만들고 있으며, 시장이 밤에 문을 닫은 후에도 오랜 시간 동안 촛불을 켜고 작업합니다. 화가들은 아치형 천장을 따라 황도대 별자리와 히브리어 구절 벽화의 첫 스케치를 시작합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_183:0 "조각가들은 촛불 곁에서 성스러운 방주에 끌을 꽂았습니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_183:0 "아직은 아닙니다. 나무는 여전히 기다리고 있습니다!"
 TV_WONDER_CEREMONY_CARD_ICON_S6_183:0 "@tv_ceremony_writer!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_183:0 "#Y 진행 중#! — #high 공부방은 목소리로 가득 차 있습니다.#!\n#F Yeshiva 학생과 상인 견습생은 모두 완성된 공부방과 덮힌 시장 길로 모여들고, 탈무드 토론 소리와 아래 곡물 및 옷감 판매자의 부름이 섞여 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_183:0 "#G 완료#! — #high 목소리로 가득 찬 연구실#!\n#F Yeshiva 학생과 상인 견습생이 완성된 연구실과 덮힌 시장 길로 모여들고, 탈무드 토론 소리와 아래 곡물 및 옷감 판매자의 외침이 섞여 있습니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_183:0 "[tv_wonder_ceremony|E]：목소리로 가득한 스터디 하우스"
 TV_WONDER_CEREMONY_S6_DESC_183:0 "Yeshiva 학생들과 상인 견습생들이 완성된 연구실과 덮힌 시장 거리로 모여들고 있으며, 탈무드 토론 소리와 아래의 곡물 및 옷감 판매자들의 부름이 섞여 있습니다. 분기는 건설 현장이라기보다는 마을 내의 살아있는 마을처럼 보이기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_183:0 "학생과 견습생 모두 완성된 홀을 토론과 거래로 가득 채웁니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_183:0 "연구실은 완공되었지만 한동안 비어 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_183:0 "@tv_ceremony_parliament!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_183:0 "#Y 진행 중#! — #high 카할 의회 홀 세우기#!\n#F A 대회의실은 구역 중심부에 우뚝 솟아 있으며, 그 긴 의회 테이블은 장로들이 앉아 세금, 분쟁, 전체 지역사회를 위한 자선에 대해 토론하는 자리로 사용됩니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_183:0 "#G 완료#! — #high 카할 의회 홀 세우기#!\n#F A 대회의장은 구역 중심부에 우뚝 솟아 있으며, 그 긴 의회 테이블은 장로들이 앉아 세금, 분쟁, 전체 지역사회를 위한 자선에 대해 토론하는 자리를 마련했습니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_183:0 "[tv_wonder_ceremony|E]：카할의 회관을 세우다"
 TV_WONDER_CEREMONY_S7_DESC_183:0 "구역의 중심에는 장로들이 앉아 전체 지역 사회를 위한 세금, 분쟁 및 자선에 대해 토론하는 긴 의회 테이블이 있는 웅장한 집회소가 있습니다. 멀리 단치히(Danzig)와 르부프(Lwów)의 상인들은 홀의 완공을 기념하기 위해 유리와 은으로 만든 선물을 보냅니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_183:0 "선물을 받아들이십시오!"
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_183:0 "상인들이 선물한 유리와 은이 창고에 수거되지 않은 채 기다리고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_183:0 "@tv_ceremony_religious_influence!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_183:0 "#Y 진행 중#! — #high 분기가 노래로 봉헌됩니다#!\n#F 랍비들과 장로들이 함께 기도와 노래로 완성된 분기를 봉헌하고, 마침내 붐비는 회중 앞에 대회당의 방주가 드러났습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_183:0 "#G 완료#! — #high 분기는 노래로 봉헌됩니다#!\n#F 랍비들과 장로들은 함께 기도와 노래로 완성된 분기를 봉헌하고, 마침내 붐비는 회중 앞에 대회당의 방주가 드러났습니다.#!"
 TV_WONDER_CEREMONY_S8_TITLE_183:0 "[tv_wonder_ceremony|E]: 분기는 노래로 봉헌됩니다"
 TV_WONDER_CEREMONY_S8_DESC_183:0 "랍비들과 장로들은 함께 기도와 노래로 완성된 구역을 봉헌하고, 마침내 붐비는 회중 앞에서 대회당의 방주가 드러났습니다. 오늘부터 지역 사회의 장학금과 거래가 더욱 자유롭게 흐르고, 연구실과 시장은 이제 전체 영역의 자랑이 됩니다.\n\n#weak 행사를 완료하려면 필요한 가격을 지불하세요. 결과적으로 불가사의의 마지막 건물이 세워질 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_183:0 "랍비들과 장로들이 노래하는 회중 앞에서 법궤를 공개합니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_183:0 "아직은 아닙니다. 노래를 좀 더 기다려 보세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S1_184:0 "@tv_ceremony_law!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_184:0 "#Y 진행 중#! — #high 스테판 왕이 아카데미에 헌장을 부여하다#!\n#F 스테판 바토리 왕은 빌니우스의 예수회 대학을 아카데미 및 대학교 수준으로 승격시키는 헌장에 서명했습니다. 이는 대공국 최초의 기관입니다. 리투아니아.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_184:0 "#G 완료#! — #high 스테판 국왕, 아카데미에 헌장 부여#!\n#F 스테판 바토리 국왕은 빌니우스의 예수회 대학을 아카데미 및 대학교 수준으로 승격시키는 헌장에 서명했습니다. 이는 대공국 최초의 기관입니다. 리투아니아.#!"
 TV_WONDER_CEREMONY_S1_TITLE_184:0 "[tv_wonder_ceremony|E]：스티븐 왕이 아카데미에 헌장을 부여하다"
 TV_WONDER_CEREMONY_S1_DESC_184:0 "스테판 바토리(Stephen Báthory) 왕은 빌니우스의 예수회 대학을 리투아니아 대공국 최초의 대학 및 아카데미 수준으로 높이는 헌장에 서명했습니다. 예수회 신부들과 도시 장로들은 모인 학자들을 기쁘게 하기 위해 거리를 행진하며 왕실 인장을 선보입니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우에는 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_184:0 "예수회 신부들이 봉인된 헌장을 빌니우스 거리를 행진합니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_184:0 "봉인을 잡아라!"
 TV_WONDER_CEREMONY_CARD_ICON_S2_184:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_184:0 "#Y In progress#! — #high Clearing Ground by St. John's Church#!\n#F Jesuit fathers secure the old college grounds beside St.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_184:0 "#G Completed#! — #high Clearing Ground by St. John's Church#!\n#F Jesuit fathers secure the old college grounds beside St.#!"
 TV_WONDER_CEREMONY_S2_TITLE_184:0 "[tv_wonder_ceremony|E]：성 요한 교회의 개간지"
 TV_WONDER_CEREMONY_S2_DESC_184:0 "예수회 교부들은 성 요한 교회 옆의 오래된 대학 부지를 확보하고 강의실과 적절한 안뜰을 위한 공간을 만들기 위해 인근 시민 주택을 사들였습니다. 석회석과 목재 수레가 빌니우스 주변의 시골에서 도착하기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_184:0 "우리는 아카데미가 올 수 있도록 이 땅을 돌 하나하나 정리할 것입니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_184:0 "시민은 집을 좀 더 오래 유지합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_184:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_184:0 "#Y 진행 중#! — #high 총장이 첫 번째 아케이드를 축복하다#!\n#F 새로 임명된 총장은 귀족과 시민 모두가 참석한 라틴 미사에서 부지를 축복하고, 석공들은 대학의 시그니처 아케이드를 위해 돌 기둥을 자르기 시작합니다. 안뜰.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_184:0 "#G 완료#! — #high 총장이 최초의 아케이드를 축복합니다#!\n#F 새로 임명된 총장은 귀족과 시민 모두가 참석한 라틴 미사에서 부지를 축복하고 석공들은 대학의 시그니처 아케이드를 위해 돌 교각을 자르기 시작합니다. 안뜰.#!"
 TV_WONDER_CEREMONY_S3_TITLE_184:0 "[tv_wonder_ceremony|E]：총장이 첫 번째 아케이드를 축복하다"
 TV_WONDER_CEREMONY_S3_DESC_184:0 "새로 임명된 총장은 귀족과 시민 모두가 참석한 라틴 미사에서 부지를 축복하고, 석공들은 대학의 대표적인 아케이드 안뜰을 위한 돌 기둥을 자르기 시작합니다. 첫 번째 인쇄기는 적절한 홀을 기다리기 위해 임시 창고에서 포장을 풀고 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_184:0 "Ora et Labora: 돌 앞에서의 기도."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_184:0 "우리는 아직 이 아케이드를 축복할 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_184:0 "@tv_ceremony_building_levels!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_184:0 "#Y 진행 중#! — #high 아케이드 안뜰이 형태를 갖추다#!\n#F 돌 교각과 아치형 통로가 서로 연결된 12개의 안뜰 중 첫 번째 주변에서 솟아오르기 시작하며, 이제 본격적으로 아카데미의 실제 건물이 진행되고 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_184:0 "#G 완료#! — #high 아케이드 안뜰이 형태를 갖추다#!\n#F 돌 교각과 아치형 통로는 서로 연결된 12개의 안뜰 중 첫 번째 주변에서 솟아오르기 시작합니다. 이는 현재 진행 중인 아카데미의 실제 건물입니다. 진심입니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_184:0 "[tv_wonder_ceremony|E]:아케이드 안뜰이 형태를 갖추다"
 TV_WONDER_CEREMONY_S4_DESC_184:0 "돌 교각과 아치형 통로는 서로 연결된 12개의 안뜰 중 첫 번째 안뜰 주변에서 솟아오르기 시작하며, 현재 본격적으로 진행 중인 아카데미의 진정한 건물입니다. 학생들은 이미 근처 예배당에서 열리는 수업 사이에 미완성 회랑으로 가득 찼습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 비용을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_184:0 "메이슨은 첫 번째 회랑 주변에 부두를 하나씩 세웁니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_184:0 "모르타르를 세팅하자!"
 TV_WONDER_CEREMONY_CARD_ICON_S5_184:0 "@tv_ceremony_writer!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_184:0 "#Y 진행 중#! — #high 대도서관을 위한 선반 등장#!\n#F 목수들이 대학 도서관을 위해 높은 참나무 선반을 만들고, 크라쿠프와 로마의 교수들은 그것을 채우기 위해 첫 번째 책 상자를 기증했습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_184:0 "#G 완료#! — #high 대도서관을 위한 선반 등장#!\n#F 목수들은 대학 도서관을 위해 높은 참나무 선반을 만들고, 크라쿠프와 로마의 교수들은 그것을 채우기 위해 첫 번째 책 상자를 기증했습니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_184:0 "[tv_wonder_ceremony|E]: 대도서관을 위한 선반 상승"
 TV_WONDER_CEREMONY_S5_DESC_184:0 "목수들은 대학 도서관을 위한 높은 참나무 선반을 만들고, 크라쿠프와 로마의 교수들은 그것을 채울 첫 번째 책 상자를 기증했습니다. 위의 강의실은 철학과 신학에 대한 최초의 공식적인 논쟁으로 울려퍼집니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_184:0 "우리는 크라쿠프와 로마의 지혜로 이 선반을 채웁니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_184:0 "기증된 도서 상자는 아직 열리지 않은 상태로 남아 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_184:0 "@tv_ceremony_holy_site!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_184:0 "#Y 진행 중#! — #high 아카데미 교회 건립#!\n#F 메이슨과 이탈리아 장인들이 예수회 아카데미 교회의 쌍둥이 타워를 세웁니다. 그 외관은 빌니우스에 들어오는 모든 여행자에게 대학의 입지를 알리기 위한 것입니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_184:0 "#G 완료#! — #high 아카데미 교회 건립#!\n#F 메이슨과 이탈리아 장인들이 예수회 아카데미 교회의 쌍둥이 탑을 세웠습니다. 그 외관은 빌니우스에 들어오는 모든 여행자에게 대학의 입지를 알리기 위한 것입니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_184:0 "[tv_wonder_ceremony|E]：학원교회를 세우다"
 TV_WONDER_CEREMONY_S6_DESC_184:0 "석공과 이탈리아 장인들이 예수회 아카데미 교회의 쌍둥이 탑을 세웠습니다. 그 외관은 빌니우스에 들어오는 모든 여행자에게 대학의 위상을 알리기 위한 것이었습니다. 비계가 아직 본당에 붙어 있는 동안에도 화가들은 천장 프레스코화 스케치를 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_184:0 "믿음은 금과 비교할 수 없는 탑을 세웁니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_184:0 "우리는 아직 이 탑을 장식할 준비가 되지 않았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_184:0 "@tv_ceremony_advance!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_184:0 "#Y 진행 중#! — #high 출판부가 첫 페이지를 열었습니다.#!\n#F 이제 자체 홀에 있는 대학의 인쇄기가 라틴어 문법과 리투아니아 교리문답의 첫 페이지를 열었고, 도시의 서점을 통해 새로운 책을 내보냈습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_184:0 "#G 완료#! — #high 출판부가 첫 페이지를 열었습니다.#!\n#F 현재 자체 홀에 있는 대학의 인쇄기는 라틴어 문법과 리투아니아 교리문답의 첫 페이지를 설정하고 도시의 서점을 통해 새로운 책을 내보냅니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_184:0 "[tv_wonder_ceremony|E]: 언론이 첫 페이지를 설정합니다"
 TV_WONDER_CEREMONY_S7_DESC_184:0 "현재 자체 홀에 보관된 대학의 인쇄기는 라틴어 문법과 리투아니아 교리문답의 첫 페이지를 인쇄하고 도시의 서점을 통해 새로운 책을 내보냅니다. 폴란드, 루테니아 및 그 외 지역에서 온 학생들이 강의 사이에 아케이드에 모여 동시에 6개의 언어로 토론합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_184:0 "언론은 활기를 띠며 첫 번째 라틴어 페이지를 설정합니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_184:0 "서둘러 놓은 잉크는 결코 지속되지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_184:0 "@tv_ceremony_literacy!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_184:0 "#Y 진행 중#! — #high 빌니우스는 학자들의 도시가 되다#!\n#F 총장은 대공국 전역의 귀족들이 참석한 행사에서 완성된 아카데미 교회와 도서관을 봉헌하고 빌뉴스를 진정한 배움의 중심지로 선언합니다. 마지막.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_184:0 "#G 완료#! — #high 빌니우스는 학자들의 도시가 되다#!\n#F 총장은 대공국 전역의 귀족들이 참석한 행사에서 완성된 아카데미 교회와 도서관을 봉헌하고 빌뉴스를 진정한 배움의 중심지로 선언합니다. 마지막.#!"
 TV_WONDER_CEREMONY_S8_TITLE_184:0 "[tv_wonder_ceremony|E]：빌니우스가 학자의 도시가 되다"
 TV_WONDER_CEREMONY_S8_DESC_184:0 "총장은 대공국 전역의 귀족들이 참석한 행사에서 완성된 아카데미 교회와 도서관을 봉헌하고 마침내 빌니우스를 진정한 배움의 중심지로 선언합니다. 오늘부터 대학의 출판사, 강의실, 모인 학자들은 여러 세대에 걸쳐 왕국의 지식 추구를 가속화합니다.\n\n#weak 행사를 완료하려면 필요한 가격을 지불하세요. 결과적으로 불가사의의 마지막 건물이 세워질 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_184:0 "우리는 마침내 빌뉴스를 학자들의 도시로 선포합니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_184:0 "봉헌식은 잠시 더 연기됩니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_185:0 "@tv_ceremony_clergy!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_185:0 "#Y 진행 중#! — #high 대주교는 신성한 피난처를 선포합니다#!\n#F 키예프 대주교는 드니프르 강 위 언덕에 처음으로 감방을 파낸 은둔자 안토니오를 기리며 수도원의 동굴과 부지가 위대한 건축물로 재건될 것이라고 선언합니다. 모든 공국의 순례자들에게 합당한 라브라.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_185:0 "#G 완료#! — #high 대주교는 신성한 피난처를 선포합니다#!\n#F 키예프 대주교는 드네프르 강 위 언덕에 처음으로 감방을 파낸 은둔자 안토니오를 기리며 수도원의 동굴과 부지가 위대한 건축물로 재건될 것이라고 선언합니다. 모든 공국의 순례자들에게 합당한 라브라.#!"
 TV_WONDER_CEREMONY_S1_TITLE_185:0 "[tv_wonder_ceremony|E]：대도시가 신성한 피난처를 선포하다"
 TV_WONDER_CEREMONY_S1_DESC_185:0 "키예프 대주교는 드니프르 강 위 언덕에 처음으로 감방을 파낸 은둔자 안토니오를 기리며 수도원의 동굴과 부지가 모든 공국의 순례자들에게 합당한 위대한 라브라로 재건될 것이라고 선언합니다. 러시아 전역의 승려들은 성부들의 동굴이 곧 새로운 건축의 빛을 보게 될 것이라는 소식을 전합니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_185:0 "우리는 이 동굴을 러시아의 모든 순례자에게 합당한 라브라로 선포합니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_185:0 "메트로폴리탄은 현재 그의 선언을 보류하고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_185:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_185:0 "#Y 진행 중#! — #high 드니페르 위의 동굴 조사#!\n#F 승려와 건축의 대가들은 횃불을 들고 가깝고 먼 동굴로 내려가 돌을 쌓기 전에 이전 은둔자들의 좁은 통로와 매장 틈새를 매핑합니다. 지상.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_185:0 "#G 완료#! — #high 드니페르 위의 동굴 조사#!\n#F 승려와 건축의 대가들은 횃불을 들고 가까운 동굴과 먼 동굴로 내려가 돌을 쌓기 전에 이전 은둔자들의 좁은 통로와 매장 틈새를 매핑합니다. 지상.#!"
 TV_WONDER_CEREMONY_S2_TITLE_185:0 "[tv_wonder_ceremony|E]：드네프르강 위의 동굴 조사"
 TV_WONDER_CEREMONY_S2_DESC_185:0 "승려와 건축가는 횃불을 들고 가까운 동굴과 먼 동굴로 내려가 돌을 땅 위에 놓기 전에 초기 은둔자의 좁은 통로와 매장 틈새를 지도화합니다. 바지선은 하류 채석장에서 드니프르 강 위로 석회암 블록을 가져옵니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_185:0 "석공의 명인은 동굴을 조사하고 석회암을 찾기 위해 바지선을 강 상류로 보냅니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_185:0 "우리는 아직 석회암 바지선을 위한 금을 아끼지 못했습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_185:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_185:0 "#Y 진행 중#! — #high 행렬에 운반되는 유물#!\n#F 존경하는 아버지의 유물은 동굴에서 건물 부지까지 엄숙한 행렬로 운반되며, 왕자와 보야르가 무릎을 꿇는 동안 승려 합창단이 노래를 부릅니다. 경로.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_185:0 "#G 완료#! — #high 행렬에 운반된 유물#!\n#F 존경받는 아버지의 유물은 동굴에서 건물 부지까지 엄숙한 행렬로 운반되며, 왕자와 보야르가 무릎을 꿇는 동안 승려 합창단이 노래를 부릅니다. 경로.#!"
 TV_WONDER_CEREMONY_S3_TITLE_185:0 "[tv_wonder_ceremony|E]：행렬에 운반된 유물"
 TV_WONDER_CEREMONY_S3_DESC_185:0 "존경하는 아버지의 유물은 동굴에서 건물 부지까지 엄숙한 행렬로 운반되며, 왕자와 보야르가 길을 따라 무릎을 꿇는 동안 승려 합창단이 노래를 부릅니다. 위대한 교회를 위한 첫 번째 기초석은 그들의 축복 아래 놓여 있습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_185:0 "승려들은 첫 번째 기초석을 축복하기 위해 유물을 들고 행렬합니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_185:0 "서두르는 축복은 전혀 축복이 아닙니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_185:0 "@tv_ceremony_holy_site!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_185:0 "#Y 진행 중#! — #high 도미션 대성당의 벽이 오르다#!\n#F 비잔틴에서 훈련받은 석공들이 동굴 위에 위대한 Dormition 대성당의 돌담을 올리기 시작합니다. 이는 마침내 행렬과 축복을 대체하는 건축의 진정한 노동입니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_185:0 "#G 완료#! — #high The Dormition Cathedral's Walls Ascend#!\n#F 비잔틴에서 훈련받은 석공들이 동굴 위에 위대한 Dormition Cathedral의 돌담을 올리기 시작합니다. 축복.#!"
 TV_WONDER_CEREMONY_S4_TITLE_185:0 "[tv_wonder_ceremony|E]: Dormition 대성당의 벽이 올라갑니다."
 TV_WONDER_CEREMONY_S4_DESC_185:0 "비잔틴의 훈련을 받은 석공들이 동굴 위에 있는 거대한 Dormition Cathedral의 돌담을 올리기 시작합니다. 이는 마침내 행렬과 축복을 대체하는 건축의 진정한 노동입니다. 인부들이 강둑에서 돌을 옮기는 동안 자작나무와 소나무 비계가 솟아오른 본당을 따라 올라갑니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_185:0 "우리는 이 신성한 벽을 세우기 위해 왕국의 돌을 투입합니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_185:0 "석공들은 도구를 내려놓았고 비계는 비어 있었습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_185:0 "@tv_ceremony_gold!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_185:0 "#Y 진행 중#! — #high 첫 번째 황금 돔 금박#!\n#F 장인들이 얇은 금박판을 대성당의 중앙 돔에 두드려서 만들고 있습니다. 이는 아래 드네프르 강을 지나가는 모든 보트에 수도원이 보이도록 하기 위한 값비싼 노동입니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_185:0 "#G 완료#! — #high 첫 번째 황금 돔 금박#!\n#F 장인들이 대성당의 중앙 돔에 얇은 금박판을 두드려서 드니프르 강을 지나가는 모든 보트에 수도원이 보이도록 하는 데 드는 비용이 많이 듭니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_185:0 "[tv_wonder_ceremony|E]: 최초의 황금 돔에 금박을 입히다"
 TV_WONDER_CEREMONY_S5_DESC_185:0 "장인들은 얇은 금박 시트를 대성당의 중앙 돔에 두드려서 두드려서 드니프르 강을 지나가는 모든 보트에 수도원이 보이도록 하는 데 비용이 많이 듭니다. 순례자들은 이미 돔이 첫 번째 햇빛을 받는 것을 보기 위해 문에 모여 있습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_185:0 "순례자들이 아래로 모이는 동안 장인들은 돔에 금박을 두드립니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_185:0 "우리는 아직 돔의 금 도금에 돈을 쓸 준비가 되지 않았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_185:0 "@tv_ceremony_writer!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_185:0 "#Y 진행 중#! — #high 서사들이 성서를 채우다#!\n#F 동굴 위의 새로운 석조 감방에서 승려들은 양피지와 잉크 위로 몸을 구부리고 연대기, 복음서, 라브라의 명성을 전할 성인들의 삶을 복사합니다. Rus.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_185:0 "#G 완료#! — #high 서사들이 성서를 채우다#!\n#F 동굴 위의 새로운 석조 감방에서 승려들은 양피지와 잉크 위에 몸을 굽혀 라브라의 명성을 널리 전할 성인들의 연대기, 복음서, 삶을 복사합니다. Rus.#!"
 TV_WONDER_CEREMONY_S6_TITLE_185:0 "[tv_wonder_ceremony|E]：서기관이 기록실을 채우다"
 TV_WONDER_CEREMONY_S6_DESC_185:0 "동굴 위의 새로운 석조 셀에서 승려들은 양피지와 잉크 위에 몸을 굽히고 연대기, 복음서, 라브라의 명성을 러시아 전역에 전할 성인들의 삶을 복사합니다. 깃펜이 긁히는 소리는 아래 석공의 끌처럼 끊임없이 울립니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_185:0 "승려들은 피지 위에 몸을 굽혀 라브라의 명성을 멀리까지 전할 연대기를 복사합니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_185:0 "문서실의 감방은 비어 있고, 깃펜도 손대지 않았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_185:0 "@tv_ceremony_population!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_185:0 "#Y 진행 중#! — #high 신자들에게 개방된 순례자 홀#!\n#F 동굴의 부패하지 않은 유물을 숭배하기 위해 모든 공국에서 내려오는 순례자들의 증가하는 물결을 수용하기 위해 새로운 식당과 손님 홀이 생겨났습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_185:0 "#G 완료#! — #high 신자들에게 개방된 순례자 홀#!\n#F 동굴의 부패하지 않은 유물을 숭배하기 위해 모든 공국에서 내려오는 순례자들의 증가하는 물결을 수용하기 위해 새로운 식당과 손님 홀이 생겨났습니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_185:0 "[tv_wonder_ceremony|E]：신자들에게 열린 순례자 홀"
 TV_WONDER_CEREMONY_S7_DESC_185:0 "동굴의 부패하지 않은 유물을 숭배하기 위해 각 공국에서 내려오는 순례자들의 증가하는 물결을 수용하기 위해 새로운 식당과 손님 홀이 생겨났습니다. 상인들은 집으로 가는 길에 양초, 성상, 빵을 파는 노점상을 문 밖에 설치합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_185:0 "우리는 언덕을 오르는 모든 순례자들에게 우리 홀을 열어줍니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_185:0 "성문은 여전히 닫혀 있고 순례자들은 추위 속에서 밖에 야영을 하고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_185:0 "@tv_ceremony_religious_influence!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_185:0 "#Y 진행 중#! — #high 드네프르 강 위에서 빛나는 라브라#!\n#F 대주교는 멀리 아래 강둑에서 들려오는 예배식에서 완성된 Dormition Cathedral과 그 빛나는 돔을 봉헌하고, 동굴 수도원을 누구에게도 뒤지지 않는 라브라라고 선언합니다. Rus.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_185:0 "#G 완료#! — #high 드니페르 강 위에서 빛나는 라브라#!\n#F 대주교는 멀리 아래 강둑에서 들려오는 예배식에서 완성된 Dormition Cathedral과 그 빛나는 돔을 봉헌하고, 동굴 수도원을 누구에게도 뒤지지 않는 라브라라고 선언합니다. Rus.#!"
 TV_WONDER_CEREMONY_S8_TITLE_185:0 "[tv_wonder_ceremony|E]: Lavra는 드니프르 강 위에서 빛난다"
 TV_WONDER_CEREMONY_S8_DESC_185:0 "메트로폴리탄은 멀리 아래 강둑에서 들려오는 전례에서 완성된 Dormition 대성당과 그 빛나는 돔을 봉헌하며, 동굴 수도원을 러시아 전체에서 누구에게도 뒤지지 않는 라브라라고 선언합니다. 오늘부터 그 문서와 유물은 학자와 신자 모두를 끌어모아 왕국 전체에 걸쳐 배움과 헌신을 촉진합니다.\n\n#weak 의식을 완료하려면 필요한 가격을 지불하세요. 결과적으로 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_185:0 "메트로폴리탄은 빛나는 돔을 봉헌하고 라브라의 종소리는 드니프르 강 위로 울려 퍼집니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_185:0 "우리는 아직 이 라브라가 완성되었다고 선언할 준비가 되지 않았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_186:0 "@tv_ceremony_parliament!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_186:0 "#Y 진행 중#! — #high 라다, 새로운 시크를 요구하다#!\n#F 강둑에 공개 집회에 모인 코사크 라다(Cossack Rada)는 급류 너머에 어떤 군주의 방해도 받지 않는 새로운 시크 요새화 캠프를 세우자고 환호 투표를 했습니다. writ.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_186:0 "#G 완료#! — #high 라다가 새로운 시크를 요구하다#!\n#F 강둑에 열린 공개 집회에 모인 코사크 라다(Cossack rada)는 급류 너머에 어떤 영주도 없는 새로운 시크 요새화 캠프를 세우자고 환호 투표를 했습니다. writ.#!"
 TV_WONDER_CEREMONY_S1_TITLE_186:0 "[tv_wonder_ceremony|E]: 라다가 새로운 시크를 요구하다"
 TV_WONDER_CEREMONY_S1_DESC_186:0 "강둑에 공개 집회에 모인 코사크 라다(Cossack rada)는 영주의 영장 없이 급류 너머에 새로운 시크 요새화 캠프를 건설하기로 환호 투표를 했습니다. 쿠린 족장은 대초원을 가로질러 기수를 보내 자유인을 목재와 방어벽으로 소환합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_186:0 "atamans는 라다의 부름에 귀를 기울이고 기수를 대초원으로 보냅니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_186:0 "인내심 - 라다가 더 오래 말하게 하세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S2_186:0 "@tv_ceremony_river!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_186:0 "#Y 진행 중#! — #high 급류 너머의 섬 선택#!\n#F 키쉬 오타만과 장로 코사크는 드네프르 급류 너머의 섬과 강 굽이를 정찰하고, 각각의 물로 접근하는 방식, 갈대와 버드나무로 덮힌 곳, 그리고 모든 곳으로부터의 거리를 판단합니다. 칸이나 왕의 손이 닿는 곳.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_186:0 "#G 완료#! — #high 급류 너머의 섬 선택#!\n#F 키쉬 오타만과 장로 코사크는 드니프르 급류 너머의 섬과 굽이치는 강을 정찰하고, 각각의 물로 접근하는 방식, 갈대와 버드나무로 덮힌 곳, 그리고 강으로부터의 거리를 판단합니다. 칸이나 왕의 손이 닿는 곳.#!"
 TV_WONDER_CEREMONY_S2_TITLE_186:0 "[tv_wonder_ceremony|E]：급류 너머의 섬을 선택하다"
 TV_WONDER_CEREMONY_S2_DESC_186:0 "키시 오타만과 장로 코사크는 드네프르 급류 너머의 섬과 굽이치는 강을 정찰하며 각각의 섬이 물로 접근하는지, 갈대와 버드나무로 덮여 있는지, 칸이나 왕이 닿을 수 없는 거리를 판단합니다. 참나무 통나무 뗏목이 강 상류에 묶여 선택한 땅으로 떠내려갑니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_186:0 "오타만인들은 선택된 섬을 표시하고 목재 뗏목을 표류시킵니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_186:0 "오타만인들은 하나의 섬에 정착하기를 꺼려 강둑에 머물고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_186:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_186:0 "#Y 진행 중#! — #high 사제가 방어벽 땅을 축복합니다#!\n#F 주최자와 함께 여행하는 정교회 신부가 첫 말뚝이 박히기 전에 정리된 땅과 시크의 깃발을 축복하는 반면, 자유인은 약 1시간 후에 코사크 맹세를 맹세합니다 모닥불.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_186:0 "#G 완료#! — #high 사제가 방어벽 땅을 축복합니다#!\n#F 주최자와 함께 여행하는 정교회 신부가 첫 번째 말뚝이 박히기 전에 정리된 땅과 시크의 깃발을 축복하는 반면, 자유인은 약 1시간 후에 코사크 맹세를 맹세합니다 모닥불.#!"
 TV_WONDER_CEREMONY_S3_TITLE_186:0 "[tv_wonder_ceremony|E]：신관이 팰리세이드 그라운드를 축복하다"
 TV_WONDER_CEREMONY_S3_DESC_186:0 "호스트와 함께 여행하는 정교회 신부는 첫 말뚝을 박기 전에 개간된 땅과 시크의 깃발을 축복하고, 자유인들은 모닥불 주위에서 코사크 맹세를 합니다. 못과 도끼머리 모양을 만들기 위해 처음으로 단조에 불을 붙였습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_186:0 "아멘 — 위험을 무릅쓰십시오!"
