 TV_WONDER_CEREMONY_CARD_ICON_S5_194:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_194:0 "#Y 진행 중#! — #high 물을 따라 솟아오른 창고#!\n#F 새로운 부두 뒤에는 석조 창고가 줄지어 솟아 있으며, 항해하는 함대를 기다리는 와인 통을 담을 수 있을 만큼 깊게 건축되었습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_194:0 "#G 완료#! — #high 물을 따라 솟아오른 창고#!\n#F 새로운 부두 뒤에는 석조 창고가 줄지어 솟아 있으며, 항해하는 함대를 기다리는 와인 통을 담을 수 있을 만큼 깊게 건축되었습니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_194:0 "[tv_wonder_ceremony|E]: 물을 따라 솟아오르는 창고"
 TV_WONDER_CEREMONY_S5_DESC_194:0 "새로운 부두 뒤에는 석조 창고가 줄지어 솟아 있으며, 바다로 항해하는 함대를 기다리는 와인 통을 보관할 수 있을 만큼 깊이 지어졌습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_194:0 "메이슨은 한 시즌 분량의 통을 보관할 수 있을 만큼 깊은 창고를 계속해서 건설합니다."
