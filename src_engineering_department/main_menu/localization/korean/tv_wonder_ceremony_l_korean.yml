 TV_WONDER_CEREMONY_CARD_ICON_S4_211:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_211:0 "#Y 진행 중#! — #high 계산소 착공#!\n#F 메이슨들은 르네상스 계수소의 첫 번째 돌을 놓았고, 헌장의 약속은 마침내 상인 거리에 솟아오르는 벽과 금고가 되었습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_211:0 "#G 완료#! — #high 계산소 착공#!\n#F 메이슨들은 르네상스 계수소의 첫 번째 돌을 놓았고, 헌장의 약속은 마침내 상인 거리에 솟아오르는 벽과 금고가 되었습니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_211:0 "[tv_wonder_ceremony|E]：카운팅 하우스 착공"
 TV_WONDER_CEREMONY_S4_DESC_211:0 "메이슨은 르네상스 계산실의 첫 번째 돌을 놓았고 헌장의 약속은 마침내 벽이 되고 상인 거리에 솟아오르는 금고가 되었습니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
