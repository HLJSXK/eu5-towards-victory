 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_205:0 "#G 완료#! — #high 다양한 신앙의 상인들이 모인다#!\n#F 캐러밴 노선의 힌두교, 시크교, 조로아스터교 상인들이 신사에 동전과 장인을 맹세하고, 각자 불타는 땅에서 자신의 표시를 본다 헌신.#!"
 TV_WONDER_CEREMONY_S2_TITLE_205:0 "[tv_wonder_ceremony|E]：다양한 신앙의 상인들이 모인다"
