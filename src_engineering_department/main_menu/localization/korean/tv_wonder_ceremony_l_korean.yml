 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_212:0 "#G 완료#! — #high 대주교가 성지를 선포하다#!\n#F 쾰른 대주교는 도시에 신성한 세 왕의 유물을 보관할 수 있을 만큼 웅장한 대성당이 라인강 옆에 세워질 것이라고 선언합니다. 보물.#!"
 TV_WONDER_CEREMONY_S1_TITLE_212:0 "[tv_wonder_ceremony|E]：대주교가 성지를 선포하다"
 TV_WONDER_CEREMONY_S1_DESC_212:0 "쾰른 대주교는 도시에 신성한 보물로 가져온 세 왕의 유물을 보관할 수 있을 만큼 웅장한 대성당을 라인강 옆에 세울 것이라고 선언했습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_212:0 "대주교는 장 앞에서 선언문을 봉인합니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_212:0 "대포는 대주교에게 더 유리한 날을 기다리라고 권고합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_212:0 "@tv_ceremony_building_default!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_212:0 "#Y 진행 중#! — #high 오래된 교회가 제거되었습니다#!\n#F 노동자들은 한때 부지에 서 있던 노후된 교회를 철거하고 돌과 목재를 회수하는 동안 석공들은 이를 대체할 광대한 고딕 양식의 계획을 조사합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_212:0 "#G 완료#! — #high 오래된 교회가 제거되었습니다#!\n#F 노동자들은 한때 부지에 서 있던 노후된 교회를 철거하고 돌과 목재를 최대한 회수하는 동안 석공들은 이를 대체할 광대한 고딕 양식의 계획을 조사합니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_212:0 "[tv_wonder_ceremony|E]：오래된 교회가 제거되었습니다"
 TV_WONDER_CEREMONY_S2_DESC_212:0 "인부들은 한때 현장에 서 있던 노후된 교회를 해체하고 석재와 목재를 회수하고 석공들은 이를 대체할 광대한 고딕 양식의 설계도를 조사합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하거나 아직 때가 되지 않은 경우에는 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_212:0 "오래된 벽을 무너뜨려라!"
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_212:0 "석공들은 오래된 교회를 조금 더 오래 서 있게 남겨둔다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_212:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_212:0 "#Y 진행 중#! — #high 기초석이 축복받았습니다#!\n#F 성직자는 상인과 순례자들의 군중 앞에서 첫 번째 기초석을 축복하고, 대주교는 다가오는 성가대를 왕의 유물을 위한 적합한 집으로 명명합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_212:0 "#G 완료#! — #high 기초석이 축복받았습니다#!\n#F 성직자는 상인과 순례자들의 군중 앞에서 첫 번째 기초석을 축복하고, 대주교는 다가오는 성가대를 왕의 유물을 위한 적합한 집으로 명명합니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_212:0 "[tv_wonder_ceremony|E]：기초석이 축복받았습니다"
 TV_WONDER_CEREMONY_S3_DESC_212:0 "성직자는 상인과 순례자 군중 앞에서 첫 번째 초석을 축복하고 대주교는 왕의 유물을 보관할 적합한 집으로 다가오는 성가대를 지명합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_212:0 "성직자는 모인 군중 앞에서 축복받은 돌을 침대 위에 놓았습니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_212:0 "아직은 아닙니다. 군중이 먼저 모이도록 하세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S4_212:0 "@tv_ceremony_art_work!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_212:0 "#Y 진행 중#! — #high 합창단의 첫 번째 돌이 놓였습니다#!\n#F 메이슨은 라인강을 따라 우뚝 솟은 고딕 합창단의 첫 번째 코스를 설정했고, 대주교의 선언문은 마침내 대성당 위에 비계처럼 솟아올랐습니다. square.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_212:0 "#G 완료#! — #high 합창단의 첫 돌이 놓였습니다#!\n#F 메이슨은 라인강을 따라 우뚝 솟은 고딕 합창단의 첫 번째 코스를 설정했고, 대주교의 선언문은 마침내 대성당 위에 비계처럼 솟아올랐습니다. square.#!"
 TV_WONDER_CEREMONY_S4_TITLE_212:0 "[tv_wonder_ceremony|E]：합창단의 첫 돌이 놓였습니다"
 TV_WONDER_CEREMONY_S4_DESC_212:0 "메이슨은 라인강을 따라 우뚝 솟은 고딕 합창단의 첫 번째 코스를 세웠고, 대주교의 선언문은 마침내 대성당 광장 위에 비계처럼 솟아올랐습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_212:0 "석공들은 새로운 비계 아래 합창단의 첫 번째 코스를 올립니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_212:0 "감독은 비계가 제대로 작동할 때까지 석공들을 붙잡아 둡니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_212:0 "@tv_ceremony_religious_influence!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_212:0 "#Y 진행 중#! — #high 합창단은 지붕이 있고 봉헌되었습니다#!\n#F 우뚝 솟은 합창단은 건물의 다른 부분보다 훨씬 앞서 완성되어 축성되었으며, 그 공중 지지대는 이미 라인강에서 본 가장 높은 석조물입니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_212:0 "#G 완료#! — #high 합창단은 지붕이 있고 봉헌되었습니다#!\n#F 우뚝 솟은 합창단은 건물의 다른 부분보다 훨씬 앞서 완성되어 봉헌되었으며, 그 공중 지지대는 이미 라인 강에서 가장 높은 석조물입니다. 본.#!"
 TV_WONDER_CEREMONY_S5_TITLE_212:0 "[tv_wonder_ceremony|E]: 합창단은 지붕이 있고 봉헌되었습니다"
 TV_WONDER_CEREMONY_S5_DESC_212:0 "우뚝 솟은 합창단은 건물의 나머지 부분보다 훨씬 앞서 완성되고 축성되었으며, 그 공중 지지대는 이미 라인강에서 본 것 중 가장 높은 석조물입니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_212:0 "보라, 그것이 거룩하게 서 있느니라!"
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_212:0 "주교는 부벽이 건전하다는 것이 입증될 때까지 의식을 연기합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_212:0 "@tv_ceremony_gold!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_212:0 "#Y 진행 중#! — #high 세 왕의 사당이 설치되었습니다.#!\n#F 금세공인들이 세 왕의 유물을 보관할 거대한 금박 유물함을 완성하고, 높은 제단 뒤에 설치하여 곳곳에서 순례자들을 끌어들입니다. 기독교.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_212:0 "#G 완료#! — #high 세 왕의 사당이 설치되었습니다.#!\n#F 금세공인들이 세 왕의 유물을 보관할 거대한 금박 유물함을 완성하고, 높은 제단 뒤에 설치하여 곳곳에서 순례자들을 끌어들입니다. 기독교.#!"
 TV_WONDER_CEREMONY_S6_TITLE_212:0 "[tv_wonder_ceremony|E]：삼왕의 사당이 설치됨"
 TV_WONDER_CEREMONY_S6_DESC_212:0 "금세공인들이 세 왕의 유물을 담을 거대한 금박 유물함을 완성하고, 이 성물은 기독교 세계 전역에서 순례자들을 끌어들이기 위해 높은 제단 뒤에 설치되어 있습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_212:0 "금세공인들은 높은 제단 뒤에 금박을 입힌 성소를 세웠습니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_212:0 "잠깐만요. 금의 무게는 아직 측정되지 않았습니다!"
 TV_WONDER_CEREMONY_CARD_ICON_S7_212:0 "@tv_ceremony_building_levels!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_212:0 "#Y 진행 중#! — #high 쌍둥이 타워가 긴 오르막을 시작합니다#!\n#F 성당의 왕관을 장식하기 위한 서쪽 타워에서 작업이 시작됩니다. 하지만 현장의 모든 석공은 이미 첨탑이 완공되기 전에 몇 세대보다 오래 지속될 것이라고 의심하고 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_212:0 "#G 완료#! — #high 쌍둥이 타워가 긴 오르막을 시작합니다#!\n#F 성당의 왕관을 장식하기 위한 서쪽 타워에서 작업이 시작되지만 현장의 모든 석공은 이미 첨탑이 완공되기 전에 몇 세대보다 오래 지속될 것이라고 의심하고 있습니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_212:0 "[tv_wonder_ceremony|E]：쌍둥이 타워가 긴 오르막을 시작하다"
 TV_WONDER_CEREMONY_S7_DESC_212:0 "대성당의 왕관을 장식하기 위한 서쪽 탑에서 작업이 시작되지만 현장의 모든 석공은 이미 첨탑이 완공되기 전에 몇 세대보다 오래 지속될 것이라고 의심하고 있습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_212:0 "우리는 이 첫 번째 돌을 놓았습니다. 하지만 첨탑이 완성되는 모습은 우리 손자만이 볼 수 있습니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_212:0 "석공들은 아직 한 시즌 동안의 탑 계획을 미뤄두었습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_212:0 "@tv_ceremony_devotion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_212:0 "#Y 진행 중#! — #high 봉헌된 쾰른 대성당의 스탠드#!\n#F 성당은 라인강 위에 봉헌되어 있으며 성가대와 성소는 순례자와 상인 모두를 끌어 모으고 있으며 이날부터 불타오르는 신앙과 자부심이 전체에서 느껴집니다. 영역.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_212:0 "#G 완료#! — #high 봉헌된 쾰른 대성당 스탠드#!\n#F 성당은 라인강 위에 봉헌되어 있으며 성가대와 성소는 순례자와 상인 모두를 불러모으고 있으며 오늘부터 그것이 불러일으키는 신앙과 자부심이 전체에서 느껴집니다. 영역.#!"
 TV_WONDER_CEREMONY_S8_TITLE_212:0 "[tv_wonder_ceremony|E]: 쾰른 대성당이 봉헌되었습니다."
 TV_WONDER_CEREMONY_S8_DESC_212:0 "대성당은 라인강 위에 세워져 있고 성가대와 성소는 순례자와 상인 모두를 끌어 모으고 있으며, 오늘부터 대성당이 불타오르는 신앙과 자부심이 왕국 전체에서 느껴집니다.\n\n#weak 예식을 완료하는 데 필요한 가격을 지불하십시오. 결과적으로 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_212:0 "마침내 그것은 봉헌되었습니다!"
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_212:0 "법원은 최종 예식을 좀 더 연기했다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_213:0 "@tv_ceremony_law!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_213:0 "#Y 진행 중#! — #high Kontor 헌장 선포됨#!\n#F 함부르크 의회는 길드 장로들을 소환하고 새로운 Kontor 헌장을 낭독합니다. 이 집은 발트해와 북해 무역이 무게를 측정하고, 봉인되고, 하나로 기록될 집입니다. 지붕.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_213:0 "#G 완료#! — #high Kontor 헌장 선포됨#!\n#F 함부르크 의회는 길드 장로들을 소집하고 새로운 Kontor 헌장을 낭독합니다. 이 집은 발트해와 북해 무역이 하나의 단위로 측정되고 봉인되고 기록될 것입니다. 지붕.#!"
 TV_WONDER_CEREMONY_S1_TITLE_213:0 "[tv_wonder_ceremony|E]：Kontor 헌장 선포"
 TV_WONDER_CEREMONY_S1_DESC_213:0 "함부르크 의회는 길드 장로들을 소집하고 발트해와 북해 무역을 측정하고 봉인하고 한 지붕 아래 기록할 집인 새로운 Kontor에 대한 헌장을 낭독합니다. 돌 하나가 놓여지기 전에 동전이 주인을 바꾸고, 시민들은 아직 열리지 않은 장부에 건배합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_213:0 "동전으로 봉인된 헌장은 밀랍으로 봉인된 헌장보다 더 단단하게 묶입니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_213:0 "우리는 아직 함부르크의 장로들에게 우리의 금고를 열어주지 않을 것입니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_213:0 "@tv_ceremony_river!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_213:0 "#Y 진행 중#! — #high 엘베 부두 측량#!\n#F 측량사는 엘베 강이 톱니바퀴를 실을 수 있을 만큼 깊게 흐르는 진흙 부두를 빠르게 이동합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_213:0 "#G 완료#! — #high 엘베 부두 측량#!\n#F 측량사는 엘베 강이 톱니바퀴를 실을 수 있을 만큼 깊이 흐르는 진흙 부두를 빠르게 이동합니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_213:0 "[tv_wonder_ceremony|E]：엘베 부두 조사"
 TV_WONDER_CEREMONY_S2_DESC_213:0 "측량사들은 엘베 강이 톱니바퀴를 태울 수 있을 만큼 깊게 흐르는 진흙 부두를 따라 이동합니다. 항만 관리인들은 계류권을 놓고 논쟁을 벌이고 사무원들은 리그 배너로 경계선을 걸었습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_213:0 "측량사는 진흙탕 엘베 강둑을 따라 자신들의 권리를 주장합니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_213:0 "그들이 논쟁하게 놔두세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S3_213:0 "@tv_ceremony_building_needs!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_213:0 "#Y 진행 중#! — #high 발트해 목재 및 루베크 벽돌#!\n#F 바지선은 발트해 숲의 참나무와 루베크의 가마에서 구운 벽돌을 가져와 기름칠된 방수포 아래 은행을 따라 쌓아 놓습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_213:0 "#G Completed#! — #high 발트해 목재 및 루베크 벽돌#!\n#F 바지선은 발트해 숲에서 참나무를, 루베크에서 가마에서 구운 벽돌을 가져와 기름칠한 방수포 아래 은행을 따라 쌓아 놓습니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_213:0 "[tv_wonder_ceremony|E]：발트해 목재 및 루베크 벽돌"
 TV_WONDER_CEREMONY_S3_DESC_213:0 "바지선은 발트해 숲에서 가져온 참나무와 뤼베크에서 가마에서 구운 벽돌을 가져와 기름칠한 방수포 아래 강둑을 따라 쌓아 놓습니다. 길드 마스터는 상점을 축복하고 벽이 오르기 전에 상품이 스쳐지나가지 않을 것이라고 맹세합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_213:0 "우리는 벽이 세워지기 전에 이 목재와 벽돌을 치우지 않을 것이라고 맹세합니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_213:0 "선장은 아직 맹세하지 않은 채 바지선을 기다리고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_213:0 "@tv_ceremony_port!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_213:0 "#Y 진행 중#! — #high 첫 번째 말뚝이 박혀 있습니다.#!\n#F 벽돌과 화물의 무게를 모두 지탱하기 위해 첫 번째 말뚝이 부드러운 강둑에 박혀 있을 때 망치 소리가 울립니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_213:0 "#G 완료#! — #high 첫 번째 말뚝이 박혀있습니다.#!\n#F 첫 번째 말뚝이 벽돌과 화물의 무게를 모두 지탱하기 위해 연약한 강둑에 박혀 있을 때 망치 소리가 울립니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_213:0 "[tv_wonder_ceremony|E]：첫 번째 말뚝 박기"
 TV_WONDER_CEREMONY_S4_DESC_213:0 "벽돌과 화물의 무게를 모두 지탱하기 위해 부드러운 강둑에 첫 번째 말뚝이 박혀 있을 때 망치 소리가 울립니다. 헌장과 목재 더미였던 것이 이제 엘베의 진흙 속에서 솟아오르는 건물이 됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_213:0 "심지어 가장 웅장한 홀도 하나의 말뚝으로 시작됩니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_213:0 "우리는 아직 망치소리를 들을 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_213:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_213:0 "#Y 진행 중#! — #high 지하창고 양식 작성#!\n#F 벽돌 금고는 머리 위를 한 줄씩 닫아 왁스로 밀봉한 양모, 모피, 소금에 절인 생선 더미가 겨울 횡단을 기다리는 건조 창고를 형성합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_213:0 "#G 완료#! — #high 보관 창고 양식#!\n#F 벽돌 금고는 머리 위를 한 줄씩 닫아 왁스로 밀봉한 양모, 모피, 소금에 절인 생선 더미가 겨울을 건너는 동안 기다리는 건조한 창고를 형성합니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_213:0 "[tv_wonder_ceremony|E]: 아치형 창고가 형태를 취함"
 TV_WONDER_CEREMONY_S5_DESC_213:0 "벽돌 금고는 머리 위에서 한 줄씩 닫혀 있어 왁스로 밀봉한 양모, 모피, 소금에 절인 생선 더미가 겨울 횡단을 기다리는 건조한 창고를 형성합니다. 한자동맹 세 도시의 석공들은 자신들의 아치를 조용한 자부심과 비교합니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_213:0 "석공들은 머리 위의 금고를 한 줄씩 닫고 그들의 작업을 자랑스럽게 슬쩍 훔쳐봅니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_213:0 "너무 빨리 닫힌 금고는 자존심이 아닌 습기를 가두게 됩니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_213:0 "@tv_ceremony_trade_capacity!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_213:0 "#Y 진행 중#! — #high 계산실 및 봉인된 원장#!\n#F 창고 바닥 위의 계수실에는 높은 책상, 철제 상자, 모든 베일이 리그 인증을 받은 것으로 표시하는 납 봉인이 설치되어 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_213:0 "#G 완료#! — #high 계산실 및 봉인된 원장#!\n#F 창고 바닥 위의 계수실에는 높은 책상, 철제 상자, 모든 베일을 리그 인증을 받은 것으로 표시하는 납 봉인이 설치되어 있습니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_213:0 "[tv_wonder_ceremony|E]：객실 계산 및 봉인된 원장"
 TV_WONDER_CEREMONY_S6_DESC_213:0 "창고 바닥 위에 있는 계산실에는 높은 책상, 철로 묶인 상자, 모든 베일이 리그 인증을 받은 것으로 표시되는 납 봉인이 설치되어 있습니다. 석고가 완전히 마르기 전에 점원이 들어갑니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_213:0 "우리는 이 장부를 봉인하고 사무원을 높은 책상에 앉힙니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_213:0 "상자는 비어 있고 석고는 한동안 건조되도록 방치됩니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_213:0 "@tv_ceremony_build_icon!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_213:0 "#Y 진행 중#! — #high 크레인이 부두를 따라 상승합니다.#!\n#F 목재 크레인은 부두를 따라 수직으로 윈치되어 있으며, 긴 팔을 사용하여 한 번의 동작으로 화물을 선박에서 창고까지 운반할 준비가 되어 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_213:0 "#G 완료#! — #high 크레인이 부두를 따라 상승합니다.#!\n#F 목재 크레인은 부두를 따라 수직으로 윈치되어 있으며, 긴 팔을 사용하여 한 번의 동작으로 화물을 선박에서 창고까지 운반할 준비가 되어 있습니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_213:0 "[tv_wonder_ceremony|E]: 부두를 따라 떠오르는 크레인"
 TV_WONDER_CEREMONY_S7_DESC_213:0 "목재 크레인은 부두를 따라 수직으로 윈치되어 있으며, 긴 팔을 사용하여 한 번의 동작으로 화물을 선박에서 창고까지 운반할 준비가 되어 있습니다. 베르겐에서 노브고로드까지의 선장들은 뤼베크 및 브뤼헤와 마찬가지로 함부르크의 이름을 짓기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_213:0 "항구는 벽이 아니라 결코 쉬지 않는 크레인으로 판단됩니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_213:0 "우리는 아직 Lubeck과 Bruges 옆에 크레인을 세울 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_213:0 "@tv_ceremony_trade!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_213:0 "#Y 진행 중#! — #high Kontor가 문을 엽니다#!\n#F Kontor의 문이 리그 배너 아래 열리고 계수실에 직원이 배치되고 크레인이 회전합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_213:0 "#G 완료#! — #high Kontor의 문이 열립니다#!\n#F Kontor의 문이 리그 배너 아래 열리고 계수실에 직원이 배치되고 크레인이 회전합니다.#!"
 TV_WONDER_CEREMONY_S8_TITLE_213:0 "[tv_wonder_ceremony|E]: Kontor가 문을 열었습니다"
 TV_WONDER_CEREMONY_S8_DESC_213:0 "Kontor의 문은 리그 배너 아래에서 활짝 열리고, 계수실에 직원이 배치되고, 크레인이 회전합니다. 발트해와 북해를 건너는 상인들은 이제 습관적으로 함부르크를 통해 무역을 하고 있으며, 왕관의 금고는 매 시즌마다 차이를 느낍니다.\n\n#weak 의식을 완료하는 데 필요한 가격을 지불하십시오. 결과적으로 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_213:0 "문은 활짝 흔들리고, 마침내 리그의 깃발이 항구 바람을 맞이합니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_213:0 "서둘러 열린 문은 상인처럼 도둑을 반갑게 맞이합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_214:0 "@tv_ceremony_parliament!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_214:0 "#Y 진행 중#! — #high 루베크에서 의회가 소집됩니다#!\n#F Lubeck의 의회는 선언문을 목격하기 위해 모든 리그 도시의 사절을 소환합니다. 새로운 시청이 Marienkirche 옆에 세워질 것입니다. 이는 Hanse를 수용할 수 있을 만큼 웅장합니다. 그 자체.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_214:0 "#G 완료#! — #high 루베크에서 의회가 소집됩니다#!\n#F Lubeck의 의회는 선언문을 목격하기 위해 모든 리그 도시의 사절을 소환합니다. 새로운 시청이 Marienkirche 옆에 세워질 것입니다. 이는 Hanse를 수용할 수 있을 만큼 웅장합니다. 그 자체.#!"
 TV_WONDER_CEREMONY_S1_TITLE_214:0 "[tv_wonder_ceremony|E]：협의회가 뤼베크에서 소집되었습니다"
 TV_WONDER_CEREMONY_S1_DESC_214:0 "뤼베크 의회는 선언문을 목격하기 위해 모든 리그 도시의 사절을 소집합니다. 마리엔 교회 옆에 한제를 수용할 수 있을 만큼 웅장한 새로운 시청사가 세워질 것입니다. 도장이 찍히고 잉크가 마르기 전에 소식을 전하는 외교관이 남쪽으로 파견됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_214:0 "의회는 인장을 찍고 외교관을 남쪽으로 보냅니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_214:0 "왁스가 식기 전에 성급하게 봉인이 끊어집니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_214:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_214:0 "#Y 진행 중#! — #high 시장 광장 청소 중#!\n#F 토대를 위한 공간을 확보하기 위해 시장 광장 한구석에서 가판대와 차양을 치웁니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_214:0 "#G 완료#! — #high 시장 광장 청소#!\n#F 토대를 위한 공간을 확보하기 위해 시장 광장 한구석에서 가판대와 차양을 치웠습니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_214:0 "[tv_wonder_ceremony|E]：시장 광장 정리"
 TV_WONDER_CEREMONY_S2_DESC_214:0 "기초를 놓을 공간을 만들기 위해 시장 광장 한구석에서 가판대와 차양을 치웠습니다. 시민들은 거래일 손실에 대해 투덜대지만 의회는 누구의 헌장을 새 회의장 벽에 걸 것인지 상기시켜 줍니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_214:0 "우리는 가판대를 치우라고 명령합니다. 홀은 그들의 인내심에 보답할 것입니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_214:0 "의회는 시장 광장을 좀 더 오래 유지하도록 허용했습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_214:0 "@tv_ceremony_law!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_214:0 "#Y 진행 중#! — #high 길드 헌장 수집#!\n#F 마스터 석공과 시 공증인이 새 홀의 금고에 보관될 헌장, 인장 및 무역 특권을 수집합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_214:0 "#G 완료#! — #high 길드 헌장 수집#!\n#F 마스터 석공과 시 공증인이 새 홀의 금고에 보관될 헌장, 인장 및 무역 특권을 수집합니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_214:0 "[tv_wonder_ceremony|E]：길드 헌장 수집"
 TV_WONDER_CEREMONY_S3_DESC_214:0 "석공과 시 공증인은 새 홀의 금고에 보관될 헌장, 인장 및 무역 특권을 수집합니다. 초석이 세워지기 전에 도시의 교장이 기초석 위에 축복문을 낭독합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_214:0 "헌장은 마침내 금고 안에 봉인되었습니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_214:0 "우리는 아직 헌장을 금고에 맡길 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_214:0 "@tv_ceremony_government!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_214:0 "#Y 진행 중#! — #high 고딕 외관이 시작됩니다.#!\n#F 석공이 고딕 외관의 뾰족한 아치를 배치하는 동안 깨끗한 광장에서 벽돌 코스가 올라갑니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_214:0 "#G 완료#! — #high 고딕 외관이 시작됩니다#!\n#F 석공이 고딕 외관의 뾰족한 아치를 배치하는 동안 정리된 광장에서 벽돌 코스가 올라갑니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_214:0 "[tv_wonder_ceremony|E]: 고딕 양식의 외관이 시작됩니다"
 TV_WONDER_CEREMONY_S4_DESC_214:0 "벽돌 코스는 석공이 고딕 양식의 정면에 뾰족한 아치를 배치하는 동안 정리된 광장에서 올라갑니다. 계획과 헌장은 비계, 모르타르, 매일 흙손의 덜거덕거리는 소리로 대체됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_214:0 "메이슨은 뾰족한 아치를 코스별로 올립니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_214:0 "비계는 기다리고 모르타르는 섞이지 않은 상태로 유지됩니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_214:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_214:0 "#Y 진행 중#! — #high 의회 회의소에 액자가 설치되었습니다.#!\n#F 목수들은 벤치를 따라 모든 회원 도시의 대표자들이 앉을 수 있을 만큼 넓은 의회 회의실의 목재 골조를 높입니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_214:0 "#G 완료#! — #high 의회실 프레임이 설치되었습니다.#!\n#F 목수들은 벤치를 따라 모든 회원 도시의 대표자들이 앉을 수 있을 만큼 넓은 의회실의 목재 골조를 높입니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_214:0 "[tv_wonder_ceremony|E]:회의실 액자"
 TV_WONDER_CEREMONY_S5_DESC_214:0 "목수들은 의회 회의실의 목재 골조를 들어올려 벤치를 따라 모든 회원 도시의 대표자들이 앉을 수 있을 만큼 넓습니다. 석공은 통행료와 관세에 대한 분쟁이 언젠가 해결될 상인 벤치를 조각합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_214:0 "우리는 모든 리그 도시의 대표자들이 앉을 수 있도록 프레임을 충분히 넓게 배치했습니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_214:0 "목수들은 연장을 내려놓고 틀은 반쯤 세워져 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_214:0 "@tv_ceremony_art_work!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_214:0 "#Y 진행 중#! — #high 포탑과 유리 타일#!\n#F 가느다란 벽돌 포탑이 지붕선 위로 솟아 있고, 지붕은 유리 타일로 덮여 있어 시장 광장 위로 빛을 받습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_214:0 "#G 완료#! — #high 포탑 및 유리 타일#!\n#F 가느다란 벽돌 포탑이 지붕선 위로 솟아 있고, 유리 타일로 덮여 있어 시장 광장 위로 빛을 받습니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_214:0 "[tv_wonder_ceremony|E]：포탑 및 유약 타일"
 TV_WONDER_CEREMONY_S6_DESC_214:0 "가느다란 벽돌 포탑이 지붕선 위로 솟아 있고, 그 위에는 유리 타일로 덮여 있어 시장 광장 위로 빛이 들어옵니다. 행인들은 멈춰 서서 타일 세공인의 작업을 지켜보며 이 지붕을 발트해 최고의 지붕이라고 부릅니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_214:0 "타일 세공인들은 발트해의 빛을 받는 유리 타일로 포탑을 장식합니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_214:0 "포탑을 조금 더 방치해 둡니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_214:0 "@tv_ceremony_diplomacy!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_214:0 "#Y 진행 중#! — #high 사절들이 대기실을 채우다#!\n#F 마지막 회반죽이 마르기도 전에, 연맹 도시의 사절과 인사들이 새 홀에 먼저 청원서를 제출하기 위해 대기실을 채우기 시작합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_214:0 "#G 완료#! — #high 사절들이 대기실을 채우다#!\n#F 마지막 회반죽이 마르기도 전에, 연맹 도시의 사절과 인사들이 대기실을 채우기 시작하며, 새 건물에 먼저 청원서를 제출하기를 열망합니다. 홀.#!"
 TV_WONDER_CEREMONY_S7_TITLE_214:0 "[tv_wonder_ceremony|E]: 사절들이 대기실을 가득 채웠습니다"
 TV_WONDER_CEREMONY_S7_DESC_214:0 "최종 회반죽이 마르기도 전에 리그 도시의 사절과 요인들이 대기실을 채우기 시작하며 새 홀에 먼저 청원서를 제출하기를 열망합니다. 의회는 수요를 충족하기 위해 추가 벤치를 주문했습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_214:0 "의회는 붐비는 사절들을 위해 추가 벤치를 주문했습니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_214:0 "대기실은 대기 중인 사절을 위해 한동안 폐쇄되어 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_214:0 "@tv_ceremony_legitimacy!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_214:0 "#Y 진행 중#! — #high 시청사가 봉헌되었습니다#!\n#F 시청사가 공식적으로 봉헌되고 의회 회의실이 자리를 잡고 헌장 금고가 봉인되면서 마리엔 교회에서 종소리가 울립니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_214:0 "#G 완료#! — #high 시청사가 봉헌되었습니다#!\n#F 시청사가 공식적으로 봉헌되고 의회 회의실이 자리를 잡았으며 헌장 금고가 봉인되자 마리엔 교회에서 종소리가 울립니다.#!"
 TV_WONDER_CEREMONY_S8_TITLE_214:0 "[tv_wonder_ceremony|E]: 시청이 봉헌되었습니다"
 TV_WONDER_CEREMONY_S8_DESC_214:0 "시청이 공식적으로 축성되고 의회 회의실이 자리를 잡고 헌장 금고가 봉인되면 마리엔 교회에서 종소리가 울립니다. 오늘부터 모든 리그 협상에서 뤼베크의 목소리가 더 널리 전달되고, 왕의 사절들은 한자 전역에서 새로운 존경심으로 받아들여집니다.\n\n#weak 의식을 완료하는 데 필요한 대가를 지불하세요. 결과적으로 불가사의의 최종 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_214:0 "드디어 종소리가 울린다!"
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_214:0 "종소리는 탑에서 잠시 동안 침묵을 유지합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_215:0 "@tv_ceremony_ruler!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_215:0 "#Y 진행 중#! — #high 선거인이 갤러리를 설립하도록 명령#!\n#F 색슨 법원은 엘베 강 옆에 점점 늘어나는 유권자들의 그림, 도자기, 호기심을 보관할 새로운 갤러리를 선포했습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_215:0 "#G 완료#! — #high 선거인이 갤러리를 법령으로 지정#!\n#F 색슨 법원은 엘베강 옆에 점점 늘어나는 유권자들의 그림, 도자기, 호기심을 보관할 새로운 갤러리를 선포했습니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_215:0 "[tv_wonder_ceremony|E]：선거인이 갤러리를 법령으로 정하다"
 TV_WONDER_CEREMONY_S1_DESC_215:0 "색슨 궁정은 엘베강 옆에 점점 늘어나는 그림, 도자기, 호기심을 불러일으키는 유권자들의 보물을 보관할 새로운 갤러리를 선포했습니다. 벽이 하나도 생기기 전에 첫 번째 홀을 스케치하기 위해 궁정 화가들이 소환됩니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_215:0 "드레스덴 갤러리 – 그렇게 결정되었습니다!"
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_215:0 "선거인은 현재로서는 서명되지 않은 채 법령을 제쳐두었습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_215:0 "@tv_ceremony_writer!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_215:0 "#Y 진행 중#! — #high 궁정의 보물 목록 작성#!\n#F 큐레이터는 이탈리아와 네덜란드에서 가져온 상자를 풀고 캔버스와 도자기 캐비닛을 손으로 목록화합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_215:0 "#G 완료#! — #high 궁정의 보물 목록 작성#!\n#F 큐레이터는 이탈리아와 네덜란드에서 가져온 상자를 풀고 캔버스와 도자기 캐비닛을 손으로 목록화합니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_215:0 "[tv_wonder_ceremony|E]：궁정의 보물 목록 작성"
 TV_WONDER_CEREMONY_S2_DESC_215:0 "큐레이터는 이탈리아와 네덜란드에서 가져온 상자를 풀고 캔버스와 도자기 캐비닛을 손으로 목록화합니다. 궁정 후원자들은 어떤 주인이 그 자리에 자부심을 가질 자격이 있는지에 대해 온화하게 다투고 있습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_215:0 "큐레이터는 상자를 열고 계산을 시작합니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_215:0 "상자를 조금 더 기다리십시오!"
 TV_WONDER_CEREMONY_CARD_ICON_S3_215:0 "@tv_ceremony_mapmode!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_215:0 "#Y 진행 중#! — #high 궁전 선택하기#!\n#F 건축가들은 궁전 경내를 거닐며 북쪽을 향한 빛이 들어오는 날개에 자리를 잡아 눈부심 없이 붓놀림을 보는 데 이상적입니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_215:0 "#G 완료#! — #high 궁전 날개 선택#!\n#F 건축가들은 궁전 경내를 거닐며 북쪽을 향한 빛이 들어오는 날개에 자리를 잡아 눈부심 없이 붓놀림을 보는 데 이상적입니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_215:0 "[tv_wonder_ceremony|E]：Palace Wing 선택"
 TV_WONDER_CEREMONY_S3_DESC_215:0 "건축가는 궁전 부지를 거닐며 빛이 눈부심 없이 붓놀림을 보는 데 이상적인 북쪽을 향한 빛이 있는 날개에 자리를 잡습니다. 선거인의 인장이 저녁 식사 계획을 승인합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_215:0 "오늘 밤 북쪽 날개에 대한 계획을 확정합니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_215:0 "건축가들은 더 명확한 말을 기다리며 계획을 철회합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_215:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_215:0 "#Y 진행 중#! — #high 바로크 양식의 홀이 솟아오르기 시작했습니다.#!\n#F 스톤메이슨이 갤러리 건물의 착공을 시작하고 한때 스케치가 홀로 서 있던 곳에 최초의 바로크 양식 기둥이 솟아오릅니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_215:0 "#G 완료#! — #high 바로크 양식의 홀이 솟아오르기 시작합니다#!\n#F Stonemasons가 갤러리 윙의 착공을 시작하고 한때 스케치가 홀로 서 있던 곳에 최초의 바로크 양식 기둥이 솟아오릅니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_215:0 "[tv_wonder_ceremony|E]：바로크 양식의 홀이 솟아오르기 시작합니다"
 TV_WONDER_CEREMONY_S4_DESC_215:0 "석공들이 갤러리 건물의 착공을 시작하고 한때 스케치가 홀로 서 있던 자리에 최초의 바로크 양식 기둥이 솟아오릅니다. 비계가 그 주위로 올라가는 동안 그림 상자가 창고에서 기다리고 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_215:0 "기둥을 세우십시오!"
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_215:0 "상자가 창고에서 좀 더 기다리도록 하겠습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_215:0 "@tv_ceremony_gold!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_215:0 "#Y 진행 중#! — #high 치장 벽토 세공 및 금박 처마 장식#!\n#F 이탈리아 치장벽토 장인은 처마 장식에 금을 입히고 그림이 걸려 있는 천장 장미를 성형하여 홀을 수용할 컬렉션에 맞게 화려하게 장식합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_215:0 "#G 완료#! — #high 치장 벽토 세공 및 금박 처마 장식#!\n#F 이탈리아 치장벽토 공방에서는 처마 장식에 금을 입히고 그림이 걸릴 곳 위에 천장 장미를 주조하여 홀에 컬렉션에 어울리는 화려함을 선사합니다. house.#!"
 TV_WONDER_CEREMONY_S5_TITLE_215:0 "[tv_wonder_ceremony|E]：치장벽토와 금박 처마 장식"
 TV_WONDER_CEREMONY_S5_DESC_215:0 "이탈리아의 치장 벽토 제작자들은 그림이 걸려 있는 처마 장식과 천장 장미 모양에 금을 입혀 홀을 그들이 소장할 컬렉션과 어울리는 화려함을 선사합니다. 법원 소문에서는 이미 이 방을 작센 최고의 방이라고 부릅니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 비용을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_215:0 "치장벽토 건축업자들은 금박을 위의 처마 장식에 놓았습니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_215:0 "금박을 조금만 더 아껴주세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S6_215:0 "@tv_ceremony_art_work!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_215:0 "#Y 진행 중#! — #high 도자기 캐비닛이 장착되었습니다.#!\n#F 캐비닛 제작자는 선거인의 도자기를 보관하기 위해 내부 방을 따라 앞면이 유리로 된 케이스를 설치하고 큐레이터가 지켜보는 가운데 색상과 유약별로 배열합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_215:0 "#G 완료#! — #high 도자기 캐비닛이 장착되었습니다.#!\n#F 캐비닛 제작자는 선거인의 도자기를 보관하기 위해 내부 방을 따라 앞면이 유리로 된 케이스를 설치하고 큐레이터의 감시 아래 색상과 유약으로 배열합니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_215:0 "[tv_wonder_ceremony|E]: 도자기 캐비닛이 장착되었습니다."
 TV_WONDER_CEREMONY_S6_DESC_215:0 "캐비닛 제작자는 큐레이터의 감시 아래 색상과 유약별로 배열된 선거인의 도자기를 보관하기 위해 내부 방을 따라 전면 유리 케이스를 설치했습니다. 외국 법원에서도 컬렉션 보기를 요청하기 시작했다는 소문이 퍼지기 시작했습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_215:0 "우리는 마침내 유리 뒤에 도자기를 놓을 것입니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_215:0 "캐비닛 제작자는 도구를 내려 놓았습니다. 케이스는 한동안 비어 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_215:0 "@tv_ceremony_painter!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_215:0 "#Y 진행 중#! — #high 큰 캔버스 걸기#!\n#F 가장 큰 캔버스가 밧줄과 도르래 아래 갤러리 벽에 올려져 있으며, 궁정 화가들은 머리카락의 폭에 따라 각 프레임을 조정합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_215:0 "#G 완료#! — #high 큰 캔버스 걸기#!\n#F 가장 큰 캔버스는 밧줄과 도르래 아래 갤러리 벽에 올려져 있으며, 궁정 화가들은 머리카락의 폭에 따라 각 프레임을 조정합니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_215:0 "[tv_wonder_ceremony|E]：큰 캔버스 걸기"
 TV_WONDER_CEREMONY_S7_DESC_215:0 "가장 큰 캔버스는 로프와 도르래 아래 갤러리 벽에 올려져 있으며, 궁정 화가들은 머리카락의 폭에 따라 각 프레임을 조정합니다. 방문객들은 최종 광택을 위해 문이 다시 봉쇄되기 전에 조용히 살짝 엿볼 수 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_215:0 "진실되게 매달린 그림은 화가보다 오래 산다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_215:0 "우리는 아직 이 문을 봉인할 준비가 되지 않았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_215:0 "@tv_ceremony_prestige!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_215:0 "#Y 진행 중#! — #high 갤러리가 법정에 문을 엽니다.#!\n#F 갤러리는 마침내 법원과 방문 고위 인사 모두를 위해 준비한 그림, 도자기, 조각품, 그림, 도자기, 조각품을 선거인의 손으로 직접 열었습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_215:0 "#G 완료#! — #high 갤러리가 법정으로 열립니다#!\n#F 갤러리는 마침내 법정과 방문 고위 인사 모두를 위해 준비한 그림, 도자기, 조각품, 그림, 도자기 및 조각품을 선거인의 손으로 직접 열었습니다.#!"
 TV_WONDER_CEREMONY_S8_TITLE_215:0 "[tv_wonder_ceremony|E]：갤러리가 법원으로 향합니다"
 TV_WONDER_CEREMONY_S8_DESC_215:0 "갤러리는 선거인의 손으로 문을 열고, 궁정과 방문 고위 인사 모두를 위해 마침내 배열된 그림, 도자기, 조각품을 전시합니다. 이제 왕국 전역의 예술가들이 남부의 대궁정과 마찬가지로 드레스덴에 대해 이야기하고 있으며, 컬렉션에 감탄하는 모든 외국인 방문객과 함께 왕관의 명성도 커지고 있습니다.\n\n#weak 예식을 완료하는 데 필요한 가격을 지불하세요. 그 결과 경이로운 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_215:0 "선제후는 모인 법정으로 향하는 회랑 문을 활짝 열었습니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_215:0 "문을 잠시 더 닫아 두세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S1_216:0 "@tv_ceremony_government!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_216:0 "#Y In progress#! — #high The Duke Decrees a Royal Brewhouse#!\n#F The Bavarian duke proclaims a royal brewery to answer Munich's thirst and fill the ducal treasury besides.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_216:0 "#G 완료#! — #high 공은 왕실 양조장을 선포했습니다#!\n#F 바이에른 공작은 뮌헨의 갈증을 해결하고 공작의 재무부를 채우기 위해 왕실 양조장을 선포했습니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_216:0 "[tv_wonder_ceremony|E]: 공작이 왕실 양조장을 건설하도록 칙령을 내림"
 TV_WONDER_CEREMONY_S1_DESC_216:0 "바이에른 공작은 뮌헨의 갈증을 해결하고 공작의 재무부를 채우기 위해 왕실 양조장을 선포했습니다. 술장수와 양조업자들은 주전자 하나가 걸리기 전에 안뜰에서 술잔을 들어 올립니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_216:0 "공작은 헌장에 서명하고 뮌헨의 새 양조장을 위해 금고를 비웁니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_216:0 "급하게 끓인 맥주는 두드리기도 전에 신맛이 납니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_216:0 "@tv_ceremony_food!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_216:0 "#Y 진행 중#! — #high 맥아 상점 보안#!\n#F Ducal 관계자는 주변 농장에서 보리와 홉을 징발하여 다가오는 양조 시즌에 대비해 마른 로프트에 보관했습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_216:0 "#G 완료#! — #high 맥아 상점 보안#!\n#F Ducal 관계자는 주변 농장에서 보리와 홉을 징발하여 다가오는 양조 시즌에 대비해 마른 로프트에 보관했습니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_216:0 "[tv_wonder_ceremony|E]：맥아 매장 확보"
 TV_WONDER_CEREMONY_S2_DESC_216:0 "공작 관리들은 주변 농장에서 보리와 홉을 징발하여 다가오는 양조 시즌에 대비해 마른 다락방에 보관했습니다. 길드 양조업자는 봉인되기 전에 모든 자루를 검사합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_216:0 "우리는 농장에 필요한 보리와 홉을 요청합니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_216:0 "관리들은 로프트를 한 시즌 더 비워 둡니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_216:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_216:0 "#Y 진행 중#! — #high 구리 주전자 축복#!\n#F 구리 대장장이가 최초의 훌륭한 양조 주전자를 전달하고, 불이 켜지기 전에 궁정 목사가 주전자를 축복합니다. 이는 공국을 섬기는 모든 선박의 관례입니다. 테이블.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_216:0 "#G 완료#! — #high 구리 주전자 축복#!\n#F 구리 대장장이가 최초의 훌륭한 양조 주전자를 전달하고, 불이 켜지기 전에 궁정 목사가 주전자를 축복합니다. 이는 공국을 섬기는 모든 선박의 관례입니다. 테이블.#!"
 TV_WONDER_CEREMONY_S3_TITLE_216:0 "[tv_wonder_ceremony|E]：구리 주전자를 축복하다"
 TV_WONDER_CEREMONY_S3_DESC_216:0 "구리 세공인은 최초의 훌륭한 양조 주전자를 전달하고, 공국의 식탁에 봉사하기 위한 모든 그릇의 관례대로, 불이 켜지기 전에 궁정 목사가 주전자를 축복합니다. Coopers는 도시 구석구석까지 맥주를 운반할 통을 만들기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_216:0 "목사님은 주전자 위에 성수를 뿌리고 첫 번째 불을 피웁니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_216:0 "나는 축복받지 않은 채 이 불을 피우지 않을 것이다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_216:0 "@tv_ceremony_employees!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_216:0 "#Y 진행 중#! — #high 양조장 벽 상승#!\n#F 메이슨은 바이에른 겨울 동안 주전자 불의 열기를 견딜 수 있을 만큼 두꺼운 양조장 벽의 첫 번째 코스를 안뜰 주변에 깔았습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_216:0 "#G 완료#! — #high 양조장 벽 상승#!\n#F 메이슨은 바이에른 겨울 동안 주전자 불의 열기를 견딜 수 있을 만큼 두꺼운 양조장 벽의 첫 번째 코스를 안뜰 주변에 깔았습니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_216:0 "[tv_wonder_ceremony|E]: 양조장의 벽이 솟아오르다"
 TV_WONDER_CEREMONY_S4_DESC_216:0 "메이슨은 안뜰 주변에 양조장 벽의 첫 번째 층을 놓았습니다. 이 벽은 바이에른 겨울 동안 주전자 불의 열기를 견딜 수 있을 만큼 두껍습니다. 법령과 맥아 부대로 시작된 것이 이제 작업실의 형태를 취하고 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_216:0 "석공들은 안뜰 주위에 코스별로 두꺼운 벽을 쌓았습니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_216:0 "서둘러 쌓은 벽은 추위도 수치심도 막아내지 못합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_216:0 "@tv_ceremony_production_method!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_216:0 "#Y 진행 중#! — #high 주전자가 걸려있습니다.#!\n#F 큰 구리 주전자가 난로 위에 올려져 있고, 첫 번째 테스트 맥주가 홀을 맥아와 홉 냄새로 가득 채웁니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_216:0 "#G 완료#! — #high 주전자가 걸려있습니다.#!\n#F 큰 구리 주전자가 난로 위에 올려져 있고, 첫 번째 테스트 맥주가 홀을 맥아와 홉 냄새로 가득 채웁니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_216:0 "[tv_wonder_ceremony|E]：주전자가 걸려있습니다"
 TV_WONDER_CEREMONY_S5_DESC_216:0 "거대한 구리 주전자가 난로 위에 올려져 있고, 첫 번째 테스트 맥주가 홀을 맥아와 홉 냄새로 가득 채웁니다. 길드 직원과 공작 관리 모두 모여 첫 번째 신중한 샘플을 맛봅니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_216:0 "우리는 주전자를 난로 위에 올리고 첫 번째 양조주를 직접 맛봅니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_216:0 "난로는 차갑게 서 있고, 주전자는 여전히 땅바닥에 놓여 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_216:0 "@tv_ceremony_supply!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_216:0 "#Y 진행 중#! — #high 아래 깊은 곳까지 잘려진 셀러#!\n#F 노동자들은 양조장 아래 깊은 곳에서 시원한 지하 저장실을 잘라서 여름철 더위의 영향을 받지 않고 맥주를 마실 수 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_216:0 "#G Completed#! — #high 아래 깊은 곳까지 잘린 셀러#!\n#F 노동자들은 양조장 아래 깊은 곳에서 시원한 셀러를 잘라서 여름 동안 더위의 영향을 받지 않고 맥주를 마실 수 있습니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_216:0 "[tv_wonder_ceremony|E]: 아래 깊은 곳까지 자른 지하실"
 TV_WONDER_CEREMONY_S6_DESC_216:0 "인부들은 양조장 아래 깊은 곳에 시원한 저장고를 파서 여름 동안 더위의 영향을 받지 않고 맥주를 마실 것입니다. 관리들은 각 통에 공작 인장이 찍혀 어둠 속으로 굴러가게 합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_216:0 "일꾼들은 지하실을 깊이 파고 각 통에 공작 마크를 새겨 봉인합니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_216:0 "차라리 맥주가 지상에서 좀 더 기다리기를 바랍니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_216:0 "@tv_ceremony_satisfaction_happy!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_216:0 "#Y 진행 중#! — #high 맥주 홀 안뜰이 열립니다.#!\n#F 양조장이 첫 공개 시식을 위해 도시에 마당을 열자 긴 테이블과 차양이 안뜰을 가득 채웁니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_216:0 "#G 완료#! — #high 맥주 홀 안뜰 열기#!\n#F 양조장이 첫 공개 시식을 위해 도시에 마당을 열자 긴 테이블과 차양이 안뜰을 가득 채웁니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_216:0 "[tv_wonder_ceremony|E]：맥주홀 안뜰 개장"
 TV_WONDER_CEREMONY_S7_DESC_216:0 "양조장이 최초의 공개 시식을 위해 도시에 마당을 열자 긴 테이블과 차양이 안뜰을 가득 채웁니다. 마지막 테이블이 치워지기 전에 통 마차가 바이에른 전역의 선술집을 향해 문을 통과합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_216:0 "대문이 열리고 안뜰은 테이블, 차양, 목마른 군중으로 가득 차 있습니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_216:0 "문은 조금 더 오랫동안 닫혀 있고 통은 지하실에서 기다립니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_216:0 "@tv_ceremony_building_open!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_216:0 "#Y 진행 중#! — #high 왕실 양조장이 공개됨을 선포#!\n#F 왕실 양조장이 영원히 개방됨을 선포하자 공작은 첫 번째 공식 술통을 두드리며, 주전자, 저장고 및 술통은 이제 뮌헨의 영구 고정 장치가 되었습니다. 경제.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_216:0 "#G 완료#! — #high 왕실 양조장이 공개됨을 선포#!\n#F 왕실 양조장이 영원히 개방됨을 선포하자 공작이 직접 첫 번째 공식 술통을 두드리며, 주전자, 저장고 및 술통은 이제 뮌헨의 영구 고정물이 되었습니다. 경제.#!"
 TV_WONDER_CEREMONY_S8_TITLE_216:0 "[tv_wonder_ceremony|E]：왕실 양조장 개장 선언"
 TV_WONDER_CEREMONY_S8_DESC_216:0 "왕실 양조장이 영원히 개방되었고, 양조장의 주전자, 저장고, 술통이 이제 뮌헨 경제의 영구적인 고정물이 되자 공작은 첫 번째 공식 술통을 직접 두드렸습니다. 바이에른의 자체 양조장이 이를 뒷받침하고 있기 때문에 왕국 전체의 생산이 좀 더 안정적으로 이루어지고 있습니다.\n\n#weak 행사를 완료하는 데 필요한 가격을 지불하세요. 결과적으로 불가사의의 최종 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_216:0 "우리는 첫 번째 공식 통을 두드리고 이 양조장이 영원히 열려 있음을 선언합니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_216:0 "공작은 첫 번째 술통을 손대지 않은 채 그대로 두었고, 아무 말도 하지 않았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_217:0 "@tv_ceremony_law!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_217:0 "#Y 진행 중#! — #high 선거인이 헌장을 승인합니다#!\n#F 팔라틴 선거인은 파리와 볼로냐를 모델로 한 네카르 위 언덕에 새로운 대학에 대한 창립 헌장을 승인합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_217:0 "#G 완료#! — #high 선거인이 헌장을 승인합니다#!\n#F 팔라타인 선거인은 파리와 볼로냐를 모델로 한 네카르 위 언덕에 새로운 대학에 대한 창립 헌장을 승인합니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_217:0 "[tv_wonder_ceremony|E]：선거인이 헌장을 부여합니다"
 TV_WONDER_CEREMONY_S1_DESC_217:0 "팔라티노 선거인은 파리와 볼로냐를 모두 모델로 한 넥카르(Neckar) 언덕 위의 새로운 대학에 대한 창립 헌장을 부여합니다. 첫 번째 강의실이 지붕을 덮기 전에 제국 전역의 학자들이 초대됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_217:0 "드디어 헌장!"
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_217:0 "선거인은 자신의 인감을 잠시 동안 보류합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_217:0 "@tv_ceremony_characters!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_217:0 "#Y 진행 중#! — #high 첫 번째 스승을 소환#!\n#F 사절은 신학, 법률, 예술의 스승을 소환하기 위해 말을 타고 나가며 성 언덕 근처에 봉급과 숙소를 제공합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_217:0 "#G 완료#! — #high 첫 번째 스승 소환#!\n#F 사절들은 신학, 법률, 예술의 스승들을 소환하기 위해 말을 타고 나가 캐슬 힐 근처에서 봉급과 숙소를 제공합니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_217:0 "[tv_wonder_ceremony|E]: 최초의 마스터 소환"
 TV_WONDER_CEREMONY_S2_DESC_217:0 "사절들은 신학, 법률, 예술의 대가들을 소환하기 위해 말을 타고 나가서 성 언덕 근처에 봉급과 숙소를 제공합니다. 앉을 책상이 생기기 훨씬 전에 첫 도착 토론 커리큘럼이 진행됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_217:0 "사절들은 봉급이 가득 든 지갑을 들고 나갑니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_217:0 "나중에 아마도!"
 TV_WONDER_CEREMONY_CARD_ICON_S3_217:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_217:0 "#Y 진행 중#! — #high 강의장 축성#!\n#F A 교황 교서와 주교의 축복은 대학 강당을 위해 선택된 부지를 봉헌하여 더 넓은 기독교 학습 공동체에 공식적으로 결속시킵니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_217:0 "#G 완료#! — #high 강의장 축성#!\n#F A 교황 교서와 주교의 축복은 대학 강당을 위해 선택된 부지를 봉헌하여 더 넓은 기독교 학습 공동체에 공식적으로 결속시킵니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_217:0 "[tv_wonder_ceremony|E]：강의장 봉헌"
 TV_WONDER_CEREMONY_S3_DESC_217:0 "교황의 교서와 주교의 축복은 대학 강당을 위해 선택된 부지를 신성화하고 공식적으로 더 넓은 기독교 학습 공동체에 연결합니다. 메이슨은 언젠가 학생들이 강의 사이에 모일 아케이드를 표시합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_217:0 "주교와 교황의 교서가 함께 땅을 봉헌합니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_217:0 "주교는 봉헌식을 연기합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_217:0 "@tv_ceremony_build_icon!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_217:0 "#Y 진행 중#! — #high 강의실이 솟아오르기 시작합니다#!\n#F 석공들이 성 언덕 아래에서 착공하고, 한때 헌장과 축복이 홀로 서 있던 대학 최초의 진정한 벽이 솟아오릅니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_217:0 "#G 완료#! — #high 강당이 솟아오르기 시작합니다#!\n#F Stonemasons가 성 언덕 아래에서 착공하고 한때 헌장과 축복이 홀로 서 있던 대학 최초의 진정한 벽이 솟아오릅니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_217:0 "[tv_wonder_ceremony|E]：강의실이 솟아오르기 시작합니다"
 TV_WONDER_CEREMONY_S4_DESC_217:0 "석공들이 성 언덕 아래에서 착공을 시작하고, 한때 헌장과 축복이 홀로 서 있던 곳에 대학 최초의 진정한 성벽이 솟아올랐습니다. 학자들은 기초석 주위로 비계가 올라가는 것을 정중한 거리에서 지켜봅니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_217:0 "벽을 높이자!"
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_217:0 "석공들은 지금은 도구를 내려놓았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_217:0 "@tv_ceremony_literacy!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_217:0 "#Y 진행 중#! — #high 도서관 금고는 봉인되었습니다.#!\n#F 돌 금고는 도서관 방 바로 위에 있으며 습기와 화재로부터 원고를 보호할 수 있을 만큼 두껍게 만들어졌습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_217:0 "#G 완료#! — #high 도서관 금고는 봉인되었습니다.#!\n#F 돌 금고는 도서관 방 바로 위에 있으며 습기와 화재로부터 원고를 보호할 수 있을 만큼 두껍게 만들어졌습니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_217:0 "[tv_wonder_ceremony|E]：도서관 금고는 봉인되었습니다"
 TV_WONDER_CEREMONY_S5_DESC_217:0 "도서관 방 가까이에 있는 석조 금고는 원고를 습기와 화재로부터 보호할 수 있을 만큼 두껍게 만들어졌습니다. 첫 번째 체인 책은 선반이 완성되기도 전에 마인츠와 바젤에서 도착합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_217:0 "메이슨은 책이 젖어 도착하기 전에 금고를 봉인합니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_217:0 "아직은 선반이 준비되지 않았습니다!"
 TV_WONDER_CEREMONY_CARD_ICON_S6_217:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_217:0 "#Y 진행 중#! — #high 아케이드 및 토론 홀#!\n#F 아케이드는 학생들이 강의 사이를 오갈 수 있는 안뜰 주변에 세워져 있으며, 하이델베르그의 이름을 알릴 공개 토론을 위한 대형 홀이 마련되어 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_217:0 "#G 완료#! — #high 아케이드 및 토론 홀#!\n#F 아케이드는 학생들이 강의 사이를 오갈 수 있는 안뜰 주변에 세워져 있으며 하이델베르그의 이름을 알릴 공개 토론을 위한 대형 홀이 마련되어 있습니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_217:0 "[tv_wonder_ceremony|E]：아케이드 및 토론장"
 TV_WONDER_CEREMONY_S6_DESC_217:0 "안뜰 주변에는 학생들이 강의를 들을 수 있는 아케이드가 세워져 있고, 하이델베르그의 이름을 알릴 공개 토론을 위한 대형 홀이 마련되어 있습니다. 점점 늘어나는 학생들에 맞춰 현지 시민들이 방을 임대하기 시작했습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_217:0 "우리는 아직 오지 않은 학자들을 위해 이 아케이드를 세웁니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_217:0 "시민들은 방을 빌리기 위해 좀 더 기다려야 한다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_217:0 "@tv_ceremony_organization!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_217:0 "#Y 진행 중#! — #high 교수진이 자리를 잡습니다.#!\n#F 신학, 법학, 의학 및 예술 학부는 각각 한 연구실을 다음 연구실과 구별하는 지정된 날개, 예복 및 인장을 받습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_217:0 "#G 완료#! — #high 교수진이 자리를 잡습니다.#!\n#F 신학, 법학, 의학 및 예술 학부는 각각 한 연구실을 다음 연구실과 구별하는 지정된 날개, 예복 및 인장을 받습니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_217:0 "[tv_wonder_ceremony|E]：교수진이 자리에 앉다"
 TV_WONDER_CEREMONY_S7_DESC_217:0 "신학, 법학, 의학 및 예술 학부는 각각 한 연구실을 다음 연구실과 구별하는 지정된 날개, 예복 및 인장을 갖습니다. 아래 네카어 계곡은 학생들과 서점들로 북적입니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_217:0 "자리에 앉으세요, 교수진 여러분!"
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_217:0 "우리는 아직 교수진을 배치할 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_217:0 "@tv_ceremony_advance!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_217:0 "#Y 진행 중#! — #high 대학이 공식적으로 개교했습니다#!\n#F 선거인이 대학의 공식 취임식을 주재하며, 제국 전역의 학자들이 자리에 앉을 때 아케이드 아래에서 헌장을 큰 소리로 낭독합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_217:0 "#G 완료#! — #high 대학이 공식적으로 개교했습니다#!\n#F 선거인이 대학의 공식 취임식을 주재하며, 제국 전역의 학자들이 자리에 앉을 때 아케이드 아래에서 헌장을 큰 소리로 낭독합니다.#!"
 TV_WONDER_CEREMONY_S8_TITLE_217:0 "[tv_wonder_ceremony|E]：대학이 공식적으로 개교했습니다"
 TV_WONDER_CEREMONY_S8_DESC_217:0 "선거인은 대학의 공식 취임식을 주재하며, 제국 전역의 학자들이 자리에 앉는 동안 아케이드 아래에서 헌장을 큰 소리로 낭독합니다. 하이델베르그의 이름은 이제 모든 졸업생과 함께 전해지고 있으며 영역 전반에 걸쳐 학습이 조금 더 빠르게 진행됩니다.\n\n#weak 행사를 완료하는 데 필요한 가격을 지불하세요. 결과적으로 불가사의의 최종 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_217:0 "마침내 헌장이 큰 소리로 낭독되는 동안 선거인이 주재합니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_217:0 "아직은 아닙니다. 홀이 먼저 채워지도록 하세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S1_218:0 "@tv_ceremony_ruler!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_218:0 "#Y 진행 중#! — #high 술탄이 복원을 선언하다#!\n#F 술탄은 페스의 고대 메디나와 마드라사, 모스크, 성문을 왕조의 상징으로 새롭게 복원할 것을 선언했다. 정당성.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_218:0 "#G 완료#! — #high 술탄이 복원을 선언하다#!\n#F 술탄은 페스의 고대 메디나와 마드라사, 모스크, 성문을 왕조의 상징으로 새롭게 복원할 것을 선언합니다. 정당성.#!"
 TV_WONDER_CEREMONY_S1_TITLE_218:0 "[tv_wonder_ceremony|E]：술탄이 복원을 선포하다"
 TV_WONDER_CEREMONY_S1_DESC_218:0 "술탄은 페스의 고대 메디나, 마드라사, 모스크, 성문을 왕조의 정당성의 표시로 새롭게 복원할 것을 선언합니다. 타일 하나가 교체되기 전에 구호자들이 좁은 골목을 통해 소식을 전합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_218:0 "구불구불한 길마다 술탄의 칙령을 외치는 사람들이 퍼뜨렸습니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_218:0 "아직은 아닙니다!"
 TV_WONDER_CEREMONY_CARD_ICON_S2_218:0 "@tv_ceremony_mapmode!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_218:0 "#Y 진행 중#! — #high 고대 차선 측량#!\n#F 측량사와 카디스는 메디나의 빽빽한 차선을 거닐며 어떤 벽이 기울어져 있는지, 어떤 문이 썩었는지, 어떤 분수가 말라버렸는지 목록을 작성합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_218:0 "#G 완료#! — #high 고대 차선 측량#!\n#F 측량사와 카디스는 메디나의 빽빽한 차선을 거닐며 어느 벽이 기울어져 있는지, 어느 문이 썩었는지, 어느 분수가 말라버렸는지 목록을 작성합니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_218:0 "[tv_wonder_ceremony|E]：고대 차선 조사"
 TV_WONDER_CEREMONY_S2_DESC_218:0 "측량사와 카디는 메디나의 빽빽한 골목길을 거닐며 어느 벽이 기울어져 있는지, 어느 문이 썩었는지, 어느 분수가 말라버렸는지 목록을 작성합니다. 돌 하나를 건드리기 전에 공예 길드 장로들과 상의합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_218:0 "우리는 카디들에게 모든 길을 걸으며 폐허가 된 것을 표시하라고 명령했습니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_218:0 "측량사들은 문 앞에 서 있고 장부는 여전히 닫혀 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_218:0 "@tv_ceremony_employees!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_218:0 "#Y 진행 중#! — #high 염색공과 석공의 모임#!\n#F 염색공, 타일공, 석공이 마그레브 전역에서 모이고, 작업이 시작되기 전에 지역 학자들의 축복을 받은 길드입니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_218:0 "#G Completed#! — #high 염색공과 석공의 모임#!\n#F 염색공, 타일공, 석공이 마그레브 전역에서 모이고, 작업이 시작되기 전에 지역 학자들의 축복을 받은 길드입니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_218:0 "[tv_wonder_ceremony|E]：염색공과 석공의 모임"
 TV_WONDER_CEREMONY_S3_DESC_218:0 "염색공, 타일 절단공, 석공이 마그레브 전역에서 모여들고, 작업이 시작되기 전에 그들의 길드가 지역 학자들의 축복을 받습니다. 위대한 마드라사로 이어지는 길을 따라 큰 통과 비계가 비축되어 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_218:0 "혼자서는 할 수 없는 일을 많은 손이 들어 올립니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_218:0 "아직 길드를 소환할 준비가 되지 않았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_218:0 "@tv_ceremony_building_default!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_218:0 "#Y 진행중#! — #high 복원이 진정으로 시작됩니다#!\n#F 첫 번째 무너진 벽에 비계가 올라가고, 장인들은 단순한 계획이 아닌 진정한 복원 작업을 시작합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_218:0 "#G 완료#! — #high 복원이 진정으로 시작됩니다#!\n#F 첫 번째 무너진 벽에 비계가 솟아오르고, 장인들은 단순한 계획이 아닌 진정한 복원 작업을 시작합니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_218:0 "[tv_wonder_ceremony|E]：복원이 정말로 시작됩니다"
 TV_WONDER_CEREMONY_S4_DESC_218:0 "첫 번째 무너진 벽에 비계가 올라가고, 장인들은 단순한 계획이 아닌 진정한 복원 작업을 시작합니다. 한 세대 동안 조용했던 길을 먼지와 끌 고리로 채웁니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_218:0 "비계가 무너져가는 첫 번째 벽을 오르자 끌이 울립니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_218:0 "성급한 기초는 곧 깨집니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_218:0 "@tv_ceremony_art_work!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_218:0 "#Y 진행 중#! — #high 마드라사 안뜰이 리뉴얼되었습니다#!\n#F Zellige 타일 절단기는 마드라사 안뜰 전체에 새로운 기하학적 모자이크를 맞춰 수백 년 된 패턴을 돌 하나하나 일치시킵니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_218:0 "#G 완료#! — #high 마드라사 안뜰이 리뉴얼되었습니다#!\n#F Zellige 타일 절단기는 마드라사 안뜰 전체에 새로운 기하학적 모자이크를 맞춰 수백 년 된 패턴을 돌 하나하나 일치시킵니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_218:0 "[tv_wonder_ceremony|E]：마드라사 안뜰이 새롭게 단장되었습니다"
 TV_WONDER_CEREMONY_S5_DESC_218:0 "Zellige 타일 절단기는 마드라사 안뜰 전체에 새로운 기하학적 모자이크를 맞춰 수백 년 된 패턴을 돌 하나하나 일치시킵니다. 학자들은 아직 완전히 내려지지 않은 비계 아래에서 강의로 돌아갑니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 비용을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_218:0 "우리는 젤리지가 고대 패턴에 따라 형태를 취하고 패턴을 이루는 것을 지켜봅니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_218:0 "타일을 자르는 사람들은 끌을 내려놓았고, 안뜰은 반쯤 무늬가 남아 있었습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_218:0 "@tv_ceremony_defensive_military_stance!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_218:0 "#Y 진행 중#! — #high 문과 성벽이 재설정되었습니다#!\n#F 메이슨은 경첩의 거대한 문을 재설정하고 고대 도시를 둘러싸고 있는 성벽을 강화하며, 완성될 때마다 퍼레이드를 하는 공예 길드 행렬이 그들의 작업을 지켜봅니다. 섹션.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_218:0 "#G 완료#! — #high 문과 성벽이 재설정되었습니다#!\n#F 메이슨은 경첩의 거대한 문을 재설정하고 고대 도시를 둘러싸고 있는 성벽을 강화하며, 각 완성을 축하하기 위해 퍼레이드하는 공예 길드 행렬이 그들의 작업을 지켜봅니다. 섹션.#!"
 TV_WONDER_CEREMONY_S6_TITLE_218:0 "[tv_wonder_ceremony|E]: 성문과 성벽이 재설정되었습니다"
 TV_WONDER_CEREMONY_S6_DESC_218:0 "석공들은 경첩의 거대한 문을 다시 설치하고 고대 도시를 둘러싸고 있는 성벽을 강화하며, 완성된 각 부분을 축하하기 위해 행진하는 공예 길드 행렬이 그들의 작업을 지켜봅니다. 상인들은 새롭게 복원된 아치 아래에 가판대를 다시 엽니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_218:0 "석공들은 새로 설치된 경첩에 거대한 대문을 집으로 돌려 놓습니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_218:0 "우리는 오래된 문을 좀 더 오래 매달아 둡니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_218:0 "@tv_ceremony_river!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_218:0 "#Y 진행 중#! — #high 분수가 다시 깨끗해졌습니다.#!\n#F 엔지니어들이 도시의 지하 수로를 정리하고 다시 정리했으며, 메디나의 분수는 한 세대 만에 처음으로 깨끗해졌습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_218:0 "#G 완료#! — #high 분수가 다시 깨끗해졌습니다.#!\n#F 엔지니어들이 도시의 지하 수로를 정리하고 다시 정리했으며, 메디나의 분수는 한 세대 만에 처음으로 깨끗해졌습니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_218:0 "[tv_wonder_ceremony|E]：분수가 다시 맑아진다"
 TV_WONDER_CEREMONY_S7_DESC_218:0 "엔지니어들은 도시의 지하 수로를 청소하고 다시 정리했으며, 메디나의 분수는 한 세대 만에 처음으로 깨끗해졌습니다. 염색업자들은 다시 한 번 풀 컬러로 고대 거래를 했던 무두질 공장을 따라 통으로 돌아갑니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_218:0 "엔지니어들은 분수가 깨끗해질 때까지 묻혀 있는 수로를 다시 정렬합니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_218:0 "흐린 물도 시간이 지나면 그 길을 찾습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_218:0 "@tv_ceremony_prestige!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_218:0 "#Y 진행 중#! — #high 페즈가 화려하게 재봉헌되었습니다#!\n#F 술탄은 공식 행렬을 통해 복원된 골목길을 걷고, 왕조의 지속적인 권리에 대한 살아있는 증거로 재봉헌된 페즈의 마드라사, 성문, 분수를 방문합니다. rule.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_218:0 "#G 완료#! — #high 페즈가 화려하게 다시 봉헌되었습니다#!\n#F 술탄은 공식적인 행렬을 통해 복원된 골목길을 걷고, 왕조의 지속적인 권리에 대한 살아있는 증거로 재봉헌된 페즈의 마드라사, 성문 및 분수를 방문합니다. rule.#!"
 TV_WONDER_CEREMONY_S8_TITLE_218:0 "[tv_wonder_ceremony|E]:페즈가 화려하게 다시 봉헌되었습니다"
 TV_WONDER_CEREMONY_S8_DESC_218:0 "술탄은 공식 행렬을 통해 복원된 골목길을 걷고, 왕조의 지속적인 통치권을 보여주는 살아있는 증거로 다시 봉헌된 페스의 마드라사, 성문, 분수를 방문합니다. 새로워진 도시에 대한 소문이 캐러밴 도로를 따라 퍼지고, 그 이야기를 반복하는 모든 상인과 함께 왕관의 위상도 커집니다.\n\n#weak 의식을 완료하는 데 필요한 가격을 지불하세요. 결과적으로 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_218:0 "우리는 복원된 길을 걷고 페즈가 우리의 통치권을 선포하도록 합니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_218:0 "술탄의 행렬이 기다리고 있는데, 페스의 성문은 아직 열리지 않았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_219:0 "@tv_ceremony_holy_site!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_219:0 "#Y 진행 중#! — #high 카이루안을 성화하라는 부름#!\n#F 통치는 카이로우안의 대모스크 구역을 확장하고 성화하겠다는 위대한 사업을 선포하며, 이 도시의 위치를 신앙의 등대로서 기립니다. 이프리키야.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_219:0 "#G 완료#! — #high 카이로우안을 성화하라는 부름#!\n#F 통치는 카이로우안의 대모스크 구역을 확장하고 성화하겠다는 위대한 사업을 선포하며, 이 도시의 위치를 신앙의 등대로서 기립니다. 이프리키야.#!"
 TV_WONDER_CEREMONY_S1_TITLE_219:0 "[tv_wonder_ceremony|E]：카이로우안을 성화하라는 부르심"
 TV_WONDER_CEREMONY_S1_DESC_219:0 "통치자는 이프리키야에 대한 신앙의 등대로서 도시의 위치를 기리며 카이로우안의 대모스크 구역을 확장하고 신성화하겠다는 위대한 사업을 선포합니다. 첫 번째 벽이 닿기 전에 이맘들이 감사의 기도를 인도합니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_219:0 "나는 Kairouan의 신자들 앞에서 이 신성한 사업을 선포합니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_219:0 "통치자는 선포를 보류하고 첫 번째 돌은 그대로 유지됩니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_219:0 "@tv_ceremony_law!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_219:0 "#Y 진행 중#! — #high 뜰의 학자들과의 협의#!\n#F 모스크의 교육 뜰의 법학자와 학자들은 확장된 구역이 취해야 할 적절한 형식에 대해 협의하여, 추가가 옛 건축물의 신성함을 훼손하지 않도록 보장합니다. 벽.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_219:0 "#G 완료#! — #high 뜰의 학자들과의 협의#!\n#F 모스크의 교육 뜰의 법학자와 학자들은 확장된 구역이 취해야 할 적절한 형식에 대해 협의하여 추가 사항이 기존의 신성함을 훼손하지 않도록 보장합니다. 벽.#!"
 TV_WONDER_CEREMONY_S2_TITLE_219:0 "[tv_wonder_ceremony|E]：뜰의 학자들과 상의하다"
 TV_WONDER_CEREMONY_S2_DESC_219:0 "모스크의 교육 뜰에 있는 법학자와 학자들은 확장된 구역이 취해야 할 적절한 형태에 대해 협의하여 기존 벽의 신성함을 훼손하는 추가가 없도록 보장합니다. 순례자들은 이미 계획이 펼쳐지는 것을 보기 위해 문에 모여 있습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_219:0 "법학자들이 판결을 내리면 관할 구역의 새로운 형태가 정해집니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_219:0 "우리는 아직 법원의 판결을 들을 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_219:0 "@tv_ceremony_building_needs!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_219:0 "#Y 진행 중#! — #high 사막 가장자리에서 돌 모으기#!\n#F 캐러밴은 기도실 근처에 쌓이기 전에 도시의 이맘의 축복을 받아 사막 가장자리에서 돌과 목재를 운반합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_219:0 "#G 완료#! — #high 사막 가장자리에서 돌 수집#!\n#F 캐러밴은 기도실 근처에 쌓이기 전에 도시의 이맘의 축복을 받아 사막 가장자리에서 돌과 목재를 운반합니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_219:0 "[tv_wonder_ceremony|E]：사막 가장자리에서 돌 모으기"
 TV_WONDER_CEREMONY_S3_DESC_219:0 "캐러밴은 사막 가장자리에서 도시의 이맘의 축복을 받은 돌과 목재를 기도실 근처에 쌓기 전에 운반합니다. 순례자들이 올 것을 예상하여 물통을 청소하고 다시 채웁니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 비용을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_219:0 "캐러밴은 기도실 옆에 축복받은 돌을 내립니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_219:0 "대상들은 사막 가장자리에 머물고 있는데, 그들의 돌은 아직 축복받지 못한 상태입니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_219:0 "@tv_ceremony_clergy!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_219:0 "#Y 진행 중#! — #high 성스러운 벽에서 작업이 시작됩니다#!\n#F 메이슨은 확장된 구역 벽의 진정한 건설을 시작하고 사막의 빛은 오래된 벽 옆에 새로운 돌을 붙입니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_219:0 "#G 완료#! — #high 성스러운 벽에서 작업이 시작됩니다#!\n#F 메이슨은 확장된 구역 벽의 진정한 건설을 시작하고 사막의 빛은 오래된 벽 옆에 새로운 돌을 붙입니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_219:0 "[tv_wonder_ceremony|E]: 신성한 벽에서 작업이 시작됩니다"
 TV_WONDER_CEREMONY_S4_DESC_219:0 "메이슨은 확장된 구역 벽의 실제 건설을 시작하고 사막의 빛이 오래된 돌 옆에 새로운 돌을 붙입니다. 기도와 계획이었던 것이 이제 이프리키얀 태양의 아케이드와 기도실로 솟아오릅니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_219:0 "신성한 벽을 높이세요!"
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_219:0 "석공들은 도구를 내려놓았고, 오래된 벽은 한동안 홀로 서 있었습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_219:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_219:0 "#Y 진행 중#! — #high 기도실 확장#!\n#F 말굽형 아치의 줄은 기도실을 경내 깊숙이 확장하며, 회수된 기둥과 새로운 기둥은 어깨를 맞대고 서 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_219:0 "#G 완료#! — #high 기도실 확장#!\n#F 말굽형 아치의 줄은 기도실을 경내 깊숙이 확장하며, 회수된 기둥과 새로운 기둥은 어깨를 나란히 서 있습니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_219:0 "[tv_wonder_ceremony|E]: 기도실 확장"
 TV_WONDER_CEREMONY_S5_DESC_219:0 "말굽형 아치가 줄지어 늘어서 기도실을 경내 깊숙이 확장하고, 회수된 기둥과 새 기둥이 어깨를 맞대고 서 있습니다. 장인들은 하루의 열기를 뚫고 일하며 기도하라는 부름에만 휴식을 취합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_219:0 "장인들은 사막의 태양 아래서 아치를 연이어 올립니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_219:0 "아직은 아니다, 이 더위에!"
 TV_WONDER_CEREMONY_CARD_ICON_S6_219:0 "@tv_ceremony_building_levels!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_219:0 "#Y 진행 중#! — #high 미나렛이 더 높이 솟아올랐다#!\n#F 위대한 첨탑이 또 다른 이야기를 불러일으켰고, 그 부름은 이제 카이로우안 옥상을 더욱 멀리까지 전달합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_219:0 "#G 완료#! — #high 미나렛이 더 높이 솟아올랐다#!\n#F 위대한 첨탑이 또 다른 이야기를 불러일으켰고, 그 부름은 이제 카이로우안 옥상을 더욱 멀리까지 전달합니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_219:0 "[tv_wonder_ceremony|E]：미나렛이 더 높아졌습니다"
 TV_WONDER_CEREMONY_S6_DESC_219:0 "거대한 미나렛은 또 다른 이야기를 불러일으켰고, 이제 그 부름은 카이로우안의 지붕 너머로 더 멀리까지 전달됩니다. 멀리 헤자즈(Hejaz)까지 온 순례자들은 이 도시가 메카와 메디나에 이어 세 번째로 신성한 도시라고 말하기 시작합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_219:0 "미나렛은 새로운 이야기를 얻었고 그 부름은 이전보다 더 멀리까지 도달했습니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_219:0 "미나렛은 예전의 높이를 유지하며 지붕 전체에서 그 이름은 변함이 없습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_219:0 "@tv_ceremony_art_work!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_219:0 "#Y 진행 중#! — #high 마당은 대리석으로 포장되어 있습니다#!\n#F 대리석 석판은 앞으로 몇 세기 동안 이곳을 건너게 될 순례자들을 기억하기 위해 넓은 안뜰 전체에 깔려 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_219:0 "#G 완료#! — #high 마당은 대리석으로 포장되어 있습니다#!\n#F 대리석 석판은 앞으로 몇 세기 동안 그곳을 건너게 될 순례자들을 기념하여 매끄럽게 마모된 넓은 안뜰을 가로질러 놓여 있습니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_219:0 "[tv_wonder_ceremony|E]：마당은 대리석으로 포장되어 있습니다"
 TV_WONDER_CEREMONY_S7_DESC_219:0 "대리석 석판은 앞으로 수세기 동안 그곳을 건너게 될 순례자들을 기념하기 위해 매끈하게 마모된 넓은 안뜰을 가로질러 놓여 있습니다. 학자들은 마지막 돌이 세팅된 후에도 새로운 아케이드 그늘에서 교육 동아리를 재개합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_219:0 "대리석을 깔아라!"
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_219:0 "벌거벗은 안뜰 돌만 남아 있고, 가르치는 동아리들은 오래된 먼지 속에서 기다리고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_219:0 "@tv_ceremony_religious_influence!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_219:0 "#Y 진행 중#! — #high 카이로안의 신성이 새롭게 됨#!\n#F 확대된 구역은 순례자와 학자들이 안뜰을 가득 채우면서 공식적으로 봉헌되었으며, 첨탑의 부름은 소식을 전합니다. 이프리키야.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_219:0 "#G 완료#! — #high 카이루안의 신성이 새롭게 됨#!\n#F 확대된 구역은 순례자와 학자들이 안뜰을 가득 채우면서 공식적으로 봉헌되었으며, 첨탑의 부름은 소식을 전합니다. 이프리키야.#!"
 TV_WONDER_CEREMONY_S8_TITLE_219:0 "[tv_wonder_ceremony|E]：카이루안의 신성이 되살아난다"
 TV_WONDER_CEREMONY_S8_DESC_219:0 "확장된 구역은 순례자와 학자들이 안뜰을 가득 채울 때 공식적으로 봉헌되며, 미나렛의 부름은 이프리키야 전역에 소식을 전합니다. 신성한 도시로서의 카이로우안의 입지는 그 이후에도 왕국 전역의 신자들에게 지속적인 위안이 됩니다.\n\n#weak 의식을 완료하는 데 필요한 대가를 지불하세요. 그 결과 불가사의의 마지막 건물이 세워질 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_219:0 "경내는 신성화되고 카이루안의 신성함이 이프리키야 전역에서 다시 빛납니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_219:0 "아직은 아닙니다. 충실한 분들은 조금만 더 기다리십시오!"
 TV_WONDER_CEREMONY_CARD_ICON_S1_220:0 "@tv_ceremony_casus_belli!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_220:0 "#Y 진행 중#! — #high 해적 헌장 맹세#!\n#F 파샤는 알제를 해적 선장들의 안식처로 선포하고 왕관의 보호 아래 습격하고 몸값을 지불할 수 있는 헌장을 부여합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_220:0 "#G 완료#! — #high 해적 헌장 맹세#!\n#F 파샤는 알제를 해적 선장들의 안식처로 선포하고 왕관의 보호 아래 습격하고 몸값을 지불할 수 있는 헌장을 부여합니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_220:0 "[tv_wonder_ceremony|E]: 해적 헌장 맹세"
 TV_WONDER_CEREMONY_S1_DESC_220:0 "파샤는 알제리를 해적 선장들의 안식처로 선포하고 왕실의 보호 아래 습격하고 몸값을 지불할 수 있는 헌장을 부여합니다. 선장은 항구 두더지가 1인치 넓어지기 전에 그려진 커틀라스에 대해 맹세합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_220:0 "해적 선장들은 그려진 커틀라스에 대해 맹세를 합니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_220:0 "오늘은 아니야!"
 TV_WONDER_CEREMONY_CARD_ICON_S2_220:0 "@tv_ceremony_seazone!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_220:0 "#Y 진행 중#! — #high 항구 접근 방식 차트 작성#!\n#F 조종사는 항구 입구를 지키고 있는 암초와 떼를 지도화하여 해적 선장만이 알고 있는 안전한 수로를 표시합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_220:0 "#G 완료#! — #high 항구 접근 방식 차트 작성#!\n#F 조종사는 항구 입구를 지키고 있는 암초와 떼를 지도화하여 해적 선장만이 알고 있는 안전한 수로를 표시합니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_220:0 "[tv_wonder_ceremony|E]：항구 접근 방식 차트 작성"
 TV_WONDER_CEREMONY_S2_DESC_220:0 "조종사는 항구 입구를 지키고 있는 암초와 떼를 지도화하여 해적의 선장만이 암기할 수 있는 안전한 수로를 표시합니다. 몸값 사무실에는 포로와 상품의 다가오는 거래를 위한 공간을 마련하기 위해 점원이 정리되어 있습니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_220:0 "우리는 해적 한 척이 출항하기 전에 이 암초의 지도를 작성합니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_220:0 "조종사는 한동안 채널을 미지의 상태로 둡니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_220:0 "@tv_ceremony_building_needs!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_220:0 "#Y 진행 중#! — #high 대포와 돛 수집#!\n#F 주조소는 새 포대를 위해 대포를 던지고 조선공들은 앞으로 나올 갤리선을 위해 돛을 꿰매고 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_220:0 "#G 완료#! — #high 대포와 돛 수집#!\n#F Foundries는 새 배터리를 위해 대포를 던지고 조선공은 앞으로 나올 갤리선을 위해 돛을 꿰매고 있습니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_220:0 "[tv_wonder_ceremony|E]: 대포와 라틴 돛 수집"
 TV_WONDER_CEREMONY_S3_DESC_220:0 "주조 공장에서는 새 포대를 위해 대포를 주조하고 조선공은 앞으로 나올 갤리선을 위해 늦은 돛을 꿰맬 것입니다. 선장은 방파제의 첫 번째 돌이 놓이기 전에 두더지 가장자리에서 선원들을 축복합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_220:0 "대포가 없는 배는 표류하는 배에 불과하다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_220:0 "우리는 아직 총을 던질 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_220:0 "@tv_ceremony_defensive_military_stance!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_220:0 "#Y 진행 중#! — #high 해벽이 솟아오르기 시작합니다#!\n#F 메이슨들은 항구 두더지와 대포 포대의 진짜 돌을 놓기 시작했고, 몇 달 전의 계획과 맹세가 마침내 바바리 서핑에 맞서 물리적인 형태를 갖추게 되었습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_220:0 "#G 완료#! — #high 해벽이 솟아오르기 시작합니다#!\n#F 메이슨들은 항구 두더지와 대포 포대의 진정한 돌을 놓기 시작했고, 몇 달 전의 계획과 맹세는 마침내 바바리 서핑에 맞서 물리적인 형태를 갖추게 되었습니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_220:0 "[tv_wonder_ceremony|E]：해벽이 솟아오르기 시작하다"
 TV_WONDER_CEREMONY_S4_DESC_220:0 "프리메이슨은 항구 두더지와 대포 포대의 진짜 돌을 놓기 시작했고, 몇 달 전의 계획과 맹세는 마침내 바바리 파도에 맞서 물리적인 형태를 갖추게 되었습니다. Corsair 선장은 정박된 갤리선에서 첫 번째 코스 세트를 지켜봅니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_220:0 "메이슨은 최초의 진정한 석재 코스를 마련했습니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_220:0 "아직 돌 하나도 없습니다!"
 TV_WONDER_CEREMONY_CARD_ICON_S5_220:0 "@tv_ceremony_cannons!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_220:0 "#Y 진행 중#! — #high 대포 배터리가 장착되어 있습니다.#!\n#F 무거운 대포는 두더지를 따라 제자리에 윈치되어 있으며, 총신은 집으로 가져온 모든 상품을 보호하기 위해 항구 입구에 훈련되어 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_220:0 "#G 완료#! — #high 대포 배터리가 장착되었습니다.#!\n#F 무거운 대포는 두더지를 따라 제자리에 윈치되어 있으며, 총신은 집으로 가져오는 모든 상품을 보호하기 위해 항구 입구에 훈련되어 있습니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_220:0 "[tv_wonder_ceremony|E]: 캐논 배터리가 장착되어 있습니다."
 TV_WONDER_CEREMONY_S5_DESC_220:0 "무거운 대포는 두더지를 따라 제자리에 윈치되어 있으며, 그 총열은 집으로 가져오는 모든 상품을 보호하기 위해 항구 입구에 훈련되어 있습니다. 포수들은 관중들의 환호 속에 떠다니는 표적을 상대로 사거리를 테스트합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_220:0 "우리는 항구 입구에서 이 총을 훈련합니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_220:0 "포수들은 지금은 포대를 조용하게 둡니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_220:0 "@tv_ceremony_wealth!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_220:0 "#Y 진행 중#! - #high 상품으로 가득 찬 창고#!\n#F 부두 뒤에 새로운 창고가 세워져 판매나 몸값을 기다리고 있는 제노바 실크부터 스페인 은까지 포획된 화물을 보관합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_220:0 "#G 완료#! — #high 상품으로 가득한 창고#!\n#F 제노바 실크부터 스페인 은까지 포획한 화물을 보관하기 위해 부두 뒤에 새로운 창고가 세워져 판매나 몸값을 기다리고 있습니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_220:0 "[tv_wonder_ceremony|E]：상품으로 가득한 창고"
 TV_WONDER_CEREMONY_S6_DESC_220:0 "제노바 실크에서 스페인 은에 이르기까지 포획된 화물을 보관하기 위해 부두 뒤에 새로운 창고가 생겨나 판매나 몸값을 기다리고 있습니다. 지붕 목재가 머리 위에서 아직 설치되고 있는 동안에도 선장은 몸값 사무실의 지분을 놓고 흥정합니다.\n\n#weak 식을 다음 단계로 진행하는 데 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_220:0 "가득 찬 창고는 가득 찬 지갑을 만듭니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_220:0 "우리는 전리품을 나눌 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_220:0 "@tv_ceremony_navy_galley!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_220:0 "#Y 진행 중#! — #high 갤리선이 바다를 향해 나아갑니다#!\n#F 해적 갤리선의 첫 번째 편대가 완성된 두더지를 지나 바다로 미끄러져 들어가며, 그들의 기다란 돛은 최초의 진정한 항해를 위해 바람을 잡습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_220:0 "#G 완료#! — #high 갤리선이 바다를 향해 나아갑니다#!\n#F 해적 갤리선의 첫 번째 편대가 완성된 두더지를 지나 바다로 미끄러져 들어가며, 그들의 잠긴 돛이 바람을 받아 최초의 진정한 항해를 시작합니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_220:0 "[tv_wonder_ceremony|E]: 갤리선이 바다로 진출하다"
 TV_WONDER_CEREMONY_S7_DESC_220:0 "해적 갤리선의 첫 번째 편대는 완성된 두더지를 지나 넓은 바다로 미끄러져 들어가며, 그들의 늦은 돛은 바람을 받아 최초의 진정한 항해를 합니다. 군중이 방파제에 모여 지평선 너머로 사라지는 모습을 지켜봅니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_220:0 "첫 번째 갤리선은 두더지를 지나 바다로 미끄러져 들어갑니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_220:0 "정박된 갤리선은 약탈을 얻지 못합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_220:0 "@tv_ceremony_navy_strength!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_220:0 "#Y 진행 중#! — #high 알제, 해적의 요새로 우뚝 서다#!\n#F 파샤는 항구가 완성되었고 대포, 창고, 몸값 사무소가 바르바리 해안을 따라 사적 소유의 영구 요새로 서 있다고 선언했습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_220:0 "#G 완료#! — #high 알제, 해적의 요새로 우뚝 서다#!\n#F 파샤는 항구가 완성되었고 대포, 창고, 몸값 사무소가 바르바리 해안을 따라 사적 소유의 영구 요새로 세워졌다고 선언했습니다.#!"
 TV_WONDER_CEREMONY_S8_TITLE_220:0 "[tv_wonder_ceremony|E]: 알제리, 해적의 요새로 우뚝 서다"
 TV_WONDER_CEREMONY_S8_DESC_220:0 "파샤는 항구가 완성되었고 대포, 창고, 몸값 사무실이 바르바리 해안을 따라 영구적인 사유화 요새로 서 있다고 선언합니다. 해적 선장은 이제 당연하게도 왕관의 깃발 아래 항해하며, 모든 상품이 집으로 안전하게 가져갈 때마다 보물이 부풀어 오른다.\n\n#weak 행사를 완료하는 데 필요한 가격을 지불하세요. 결과적으로 불가사의의 최종 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_220:0 "우리는 이 해적 요새가 완성되었음을 선언합니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_220:0 "파샤는 그의 최종 선언을 잠시 동안 보류합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_221:0 "@tv_ceremony_wealth!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_221:0 "#Y 진행 중#! — #high 학자들의 Waqf가 선언됨#!\n#F 팀북투의 주요 상인과 이맘들이 산코레 모스크 옆에 대학을 세우기 위해 waqf 기부를 선언했습니다. 이 대학의 수입은 대상 무역에서 나옵니다. 그 자체.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_221:0 "#G 완료#! — #high 학자들의 Waqf가 선언됨#!\n#F 팀북투의 주요 상인들과 이맘들이 산코레 모스크 옆에 대학을 세우기 위해 waqf 기부를 선언했습니다. 이 대학의 수입은 대상 무역에서 나옵니다. 그 자체.#!"
 TV_WONDER_CEREMONY_S1_TITLE_221:0 "[tv_wonder_ceremony|E]：학자들의 Waqf가 선언되었습니다"
 TV_WONDER_CEREMONY_S1_DESC_221:0 "팀북투의 주요 상인들과 이맘들은 산코레 모스크 옆에 대학을 세우기 위해 waqf 기부를 선언했습니다. 대학의 수입은 캐러밴 무역 자체에서 나옵니다. 원고 판매상은 축하를 위해 가판대를 닫습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_221:0 "우리는 이 waqf를 지식 추구에 바칩니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_221:0 "상인은 코인을 보관하고 waqf는 서명되지 않은 상태로 유지됩니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_221:0 "@tv_ceremony_characters!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_221:0 "#Y 진행 중#! — #high 사하라 전역의 학자 소환#!\n#F 메신저들은 캐러밴을 타고 북쪽으로 이동하여 페즈와 마라케시에서 온 학자들을 초대하고, 남쪽으로 강을 따라 이미 사헬 궁정에서 유명한 교사들을 모읍니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_221:0 "#G Completed#! — #high 사하라 전역의 학자 소환#!\n#F 메신저(Messengers)는 캐러밴을 타고 북쪽으로 이동하여 페즈(Fez)와 마라케시(Marrakesh)의 학자들을 초대하고, 남쪽으로 강을 따라 이미 유명한 사헬리안 교사들을 모읍니다. 법원.#!"
 TV_WONDER_CEREMONY_S2_TITLE_221:0 "[tv_wonder_ceremony|E]：사하라 전역의 학자를 소환하다"
 TV_WONDER_CEREMONY_S2_DESC_221:0 "사자들은 캐러밴과 함께 북쪽으로 이동하여 페즈와 마라케시 출신의 학자들을 초대하고, 남쪽으로는 강을 따라 이미 사헬 궁정에서 유명한 교사들을 모읍니다. 안뜰 벽이 완성되기 전에 책을 실은 낙타 기차가 도착하기 시작합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_221:0 "사자들은 모든 유명한 스승을 초대하면서 낙타를 북쪽으로 몰아갑니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_221:0 "학자들을 소환하려면 대상 시즌이 끝날 때까지 기다려야 합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_221:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_221:0 "#Y 진행 중#! — #high 흙 뜰에 축복을 내리다#!\n#F 맘들은 새로운 마드라사를 위해 선택된 진흙 벽돌 안뜰을 축복하고, 건축가들은 사막의 열기를 막아줄 벽을 위해 짚과 점토를 섞습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_221:0 "#G 완료#! — #high 흙 뜰에 축복을 내리다#!\n#F 맘들은 새로운 마드라사를 위해 선택된 진흙 벽돌 안뜰을 축복하고, 건축가들은 사막의 열기를 막아줄 벽을 위해 짚과 점토를 섞습니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_221:0 "[tv_wonder_ceremony|E]: 토석 법원을 축복하다"
 TV_WONDER_CEREMONY_S3_DESC_221:0 "이맘들은 새로운 마드라사를 위해 선택된 진흙 벽돌 안뜰을 축복하고, 건축가들은 사막의 열기를 막아줄 벽을 위해 짚과 점토를 섞습니다. 인근 도서 시장에서 주목하고 기대에 부응하여 추가 원고를 비축하기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_221:0 "이맘들은 안뜰을 거닐며 아직 올라가지 않은 모든 벽을 축복합니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_221:0 "축복받지 못한 점토는 건조되어 먼지만 남습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_221:0 "@tv_ceremony_laborers!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_221:0 "#Y 진행 중#! — #high 흙벽돌 벽이 솟아오르기 시작합니다#!\n#F 건축가들이 교육 법원의 진정한 진흙벽돌 벽을 쌓기 시작합니다. 한때 축복과 계획이 홀로 서 있던 산코레의 토탑이 형태를 갖추기 시작합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_221:0 "#G 완료#! — #high 흙벽돌 벽이 솟아오르기 시작합니다#!\n#F 건축업자들이 교육 법원의 진정한 진흙벽돌 벽을 쌓기 시작했습니다. 한때 축복과 계획이 홀로 서 있던 산코레의 토탑이 형태를 갖추기 시작했습니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_221:0 "[tv_wonder_ceremony|E]：흙벽돌 벽이 오르기 시작하다"
 TV_WONDER_CEREMONY_S4_DESC_221:0 "건축업자들은 교육 법원의 진정한 진흙 벽돌 벽을 쌓기 시작하고, 한때 축복과 계획이 홀로 서 있던 산코레의 토탑이 형태를 갖추기 시작합니다. 리드미컬하게 점토를 나무 형태에 치는 소리가 분기를 가득 채웁니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_221:0 "우리는 이 흙벽을 한 번에 한 줄기씩 스스로 쌓습니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_221:0 "건축자들이 흙손을 내려놓았고, 오늘은 성벽이 더 이상 올라가지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_221:0 "@tv_ceremony_building_needs!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_221:0 "#Y 진행 중#! — #high 토론 빔이 설정되었습니다.#!\n#F 목재 토론 빔 열이 건조 벽에 박혀 있어 구조를 강화하고 매년 재도장을 위한 영구 비계 역할을 합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_221:0 "#G 완료#! — #high 토론 빔이 설정되었습니다.#!\n#F 목재 토론 빔 열이 건조 벽에 박혀 있어 구조를 강화하고 향후 연간 재도장을 위한 영구 비계 역할을 합니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_221:0 "[tv_wonder_ceremony|E]:토론빔이 설정되었습니다"
 TV_WONDER_CEREMONY_S5_DESC_221:0 "목재 토론빔 열이 건조 벽에 박혀 구조를 강화하고 향후 연간 재도장을 위한 영구 발판 역할을 합니다. 학생들은 마지막 진흙이 마르기도 전에 아케이드 아래에 모입니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_221:0 "목수는 토론 빔을 건조 중인 점토 속으로 깊이 밀어 넣습니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_221:0 "우리는 들보가 설치되기 전에 벽이 한 계절 더 오래 치료되도록 할 것입니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_221:0 "@tv_ceremony_literacy!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_221:0 "#Y 진행 중#! — #high 도서관은 원고로 가득 차 있습니다#!\n#F 분기 전반의 개인 도서관은 법, 천문학, 신학에 관한 사본으로 가득 차 있으며, 손으로 복사하고 아래 시장에서 소금과 금과 함께 거래됩니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_221:0 "#G 완료#! — #high 도서관에는 원고가 가득하다#!\n#F 분기 전역의 개인 도서관에는 법, 천문학, 신학에 관한 원고가 넘쳐납니다. 손으로 복사하고 아래 시장에서 소금과 금과 함께 거래됩니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_221:0 "[tv_wonder_ceremony|E]：도서관은 원고로 가득 차 있습니다"
 TV_WONDER_CEREMONY_S6_DESC_221:0 "분기 전체의 사립 도서관에는 법, 천문학, 신학에 관한 원고가 넘쳐나고, 손으로 복사하여 아래 시장에서 소금과 금과 함께 거래됩니다. 학자들은 사헬의 위대한 컬렉션 중 하나가 될 목록을 작성하기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 비용을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_221:0 "서기관은 원고를 계속해서 복사하고, 도서관은 배움으로 무거워집니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_221:0 "빈 선반이 기다리고 있으며 이번 시즌에는 새로운 원고가 도착하지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_221:0 "@tv_ceremony_advance!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_221:0 "#Y 진행 중#! — #high 교습 동아리가 늘어납니다.#!\n#F 교사가 법학, 문법, 꾸란 과학 분야의 학생들을 상대하면서 교육 동아리가 안뜰 전체에 걸쳐 늘어납니다. 각 원에는 자체 카펫과 독서대가 표시되어 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_221:0 "#G 완료#! — #high 교습 동아리가 늘어납니다.#!\n#F 교사가 법, 문법, 꾸란 과학 분야의 학생들을 상대하면서 교육 동아리가 안뜰 전체에 걸쳐 늘어납니다. 각 원에는 자체 카펫과 독서대가 표시되어 있습니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_221:0 "[tv_wonder_ceremony|E]: 교육 서클이 증가합니다."
 TV_WONDER_CEREMONY_S7_DESC_221:0 "법학, 문법, 꾸란 과학 분야의 스승들이 학생들을 맡으면서 교육 동아리가 안뜰 전체에 걸쳐 늘어납니다. 각 원은 자체 카펫과 독서대가 표시되어 있습니다. 캐러밴은 이제 토론을 듣기 위해 팀북투를 우회합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_221:0 "우리는 이곳에서 가르칠 모든 스승에게 우리 안뜰을 열어줍니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_221:0 "카펫은 계속 굴러져 있으며 이번 달에는 새로운 교육 동아리가 형성되지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_221:0 "@tv_ceremony_prestige!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_221:0 "#Y 진행 중#! — #high 산코레(Sankore)가 위대한 학교들 사이에서 개교했습니다#!\n#F 학자, 학생, 캐러밴 상인 모두가 안뜰을 가득 채우면서 대학이 공식적으로 출범했으며, 원고와 교육 동아리가 이제 변두리에서 지속적인 학습의 등대가 되었습니다. 사하라.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_221:0 "#G 완료#! — #high 산코레(Sankore)가 위대한 학교들 사이에서 개교했습니다#!\n#F 학자, 학생, 캐러밴 무역상 모두가 안뜰을 가득 채우면서 대학이 공식적으로 개교했습니다. 원고와 교육 동아리는 이제 학문의 변두리에서 지속적인 배움의 등불이 됩니다. 사하라.#!"
 TV_WONDER_CEREMONY_S8_TITLE_221:0 "[tv_wonder_ceremony|E]：상코레(Sankore)가 최고의 학교로 개교했습니다"
 TV_WONDER_CEREMONY_S8_DESC_221:0 "학자, 학생, 캐러밴 상인 모두가 안뜰을 채우면서 대학이 공식적으로 개교되었으며, 현재 사하라 사막 가장자리에서 지속적인 배움의 등불이 되고 있는 원고와 교육 동아리가 있습니다. 팀북투의 장학금에 대한 소문이 모든 캐러밴과 함께 전달되어 책이 귀중하게 여겨지는 곳이면 어디든 왕국의 위상을 높일 수 있습니다.\n\n#weak 행사를 완료하는 데 필요한 가격을 지불하세요. 결과적으로 불가사의의 마지막 건물이 세워질 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_221:0 "Sankore가 위대한 학교로 선포됨에 따라 학자와 캐러밴 상인 모두가 모였습니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_221:0 "우리는 아직 산코레의 영광을 세계에 알릴 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_222:0 "@tv_ceremony_ruler!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_222:0 "#Y 진행 중#! — #high 추장이 지구의 모스크를 선포하다#!\n#F Djenne의 통치자가 바니 강둑에 세워질 위대한 모스크를 선포합니다. 이 모스크는 사헬의 흙 전통에 따라 지어졌으며 이전의 모든 진흙 벽돌 건물보다 더 빛날 축복을 받았습니다. it.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_222:0 "#G 완료#! — #high 추장은 지구의 모스크를 선포합니다#!\n#F Djenne의 통치자는 Bani 강둑에 세워질 위대한 모스크를 선포합니다. 이 모스크는 Sahel의 흙 전통에 따라 지어졌으며 이전의 모든 진흙 벽돌 건물보다 더 빛날 축복을 받았습니다. it.#!"
 TV_WONDER_CEREMONY_S1_TITLE_222:0 "[tv_wonder_ceremony|E]: 추장이 지구의 모스크를 선포하다"
 TV_WONDER_CEREMONY_S1_DESC_222:0 "젠네의 통치자는 사헬의 흙 전통에 따라 건설되었으며 그 이전의 모든 진흙 벽돌 건물보다 더 빛날 축복을 받은 바니 강둑에 위대한 모스크가 세워질 것이라고 선포합니다. Griots는 첫 번째 벽돌이 성형되기 전에 시장 광장을 통해 소식을 전합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_222:0 "추장은 모스크를 선포하고 그리오들은 젠네를 통해 그의 말을 전한다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_222:0 "아직은 아닙니다. 선언문을 기다리도록 하세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S2_222:0 "@tv_ceremony_building_needs!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_222:0 "#Y 진행 중#! — #high 신성한 진흙 혼합#!\n#F 장인들은 Djenne의 건축업자 가문을 거쳐 전수된 조리법에 따라 강둑의 진흙과 왕겨 및 시어 버터를 섞습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_222:0 "#G 완료#! — #high 신성한 진흙 혼합#!\n#F 장인들은 Djenne의 건축업자 가문을 거쳐 전수된 조리법에 따라 강둑의 진흙과 왕겨 및 시어 버터를 섞습니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_222:0 "[tv_wonder_ceremony|E]: 신성한 진흙을 섞다"
 TV_WONDER_CEREMONY_S2_DESC_222:0 "장인들은 Djenne의 건축업자 가문을 통해 여러 세대에 걸쳐 전해 내려오는 제조법에 따라 강둑의 진흙과 왕겨, 시어 버터를 섞습니다. 장로들은 성형이 시작되기 전에 혼합물이 경화될 구덩이를 축복합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_222:0 "장인들은 구덩이를 축복하고 왕겨와 시어 버터로 강 진흙을 반죽합니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_222:0 "건축업자들은 잠시 더 치료하기 위해 신성한 진흙을 떠납니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_222:0 "@tv_ceremony_vegetation!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_222:0 "#Y 진행 중#! — #high 토론 목재 모으기#!\n#F 야자수 목재를 절단하고 토론 빔으로 성형한 후 매년 열리는 재플라이스터 축제를 위한 구조물이자 비계로 벽에서 튀어나옵니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_222:0 "#G 완료#! — #high 토론 목재 모으기#!\n#F 야자수 목재를 절단하고 토론 빔으로 성형한 후 매년 열리는 축제의 구조 및 발판으로 벽에서 튀어나옵니다. 재도장.#!"
 TV_WONDER_CEREMONY_S3_TITLE_222:0 "[tv_wonder_ceremony|E]：토론 목재 모으기"
 TV_WONDER_CEREMONY_S3_DESC_222:0 "야자나무 목재를 절단하여 토론빔으로 성형한 후 매년 열리는 재도장 축제를 위한 구조 및 발판으로 벽에서 튀어나올 예정입니다. 시장 상인과 학자 모두 모스크 건설에 노동일을 약속합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_222:0 "그러면 손바닥에 – 토론용 목재!"
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_222:0 "나무꾼들은 도끼를 내려놓고 더 나은 계절을 기다립니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_222:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_222:0 "#Y 진행 중#! — #high 흙벽이 솟아오르기 시작하다#!\n#F 건축업자들이 모스크의 진정한 진흙 벽돌 벽을 쌓기 시작하고 한때 축복과 목재만 서 있던 시장 광장 위에 지지대와 탑의 형태가 갖춰졌습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_222:0 "#G 완료#! — #high 흙벽이 솟아오르기 시작하다#!\n#F 건축업자들은 한때 축복과 목재만 서 있던 시장 광장 위에 모스크의 진정한 진흙 벽돌 벽을 쌓기 시작했고, 지지대와 탑은 모양을 갖추었습니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_222:0 "[tv_wonder_ceremony|E]：흙벽이 오르기 시작하다"
 TV_WONDER_CEREMONY_S4_DESC_222:0 "건축업자들은 모스크의 진짜 진흙 벽돌 벽을 쌓기 시작하고, 한때 축복과 목재만 서 있던 시장 광장 위에 부벽과 탑의 모양을 갖추기 시작합니다. 아이들은 진흙 운반자들과 나란히 달리며 젖은 벽에 자신의 손도장을 찍고 싶어합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_222:0 "아이들이 젖은 땅에 손자국을 찍는 동안 건축업자들은 진흙 벽돌 벽을 쌓습니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_222:0 "아직은 아닙니다. 벽을 건설하지 말고 그대로 두세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S5_222:0 "@tv_ceremony_building_levels!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_222:0 "#Y 진행 중#! — #high 탑이 높이에 도달했습니다.#!\n#F 세 개의 거대한 탑이 지붕 위로 솟아 있고 원뿔형 첨탑 꼭대기에는 번영과 순결을 뜻하는 옛 풍습에 따라 타조 알이 얹혀 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_222:0 "#G 완료#! — #high 탑이 높이에 도달했습니다.#!\n#F 세 개의 거대한 탑이 지붕 위로 솟아 있고 원뿔형 첨탑 꼭대기에는 번영과 순결을 뜻하는 옛 풍습에 따라 타조 알이 얹혀 있습니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_222:0 "[tv_wonder_ceremony|E]: 타워가 높이에 도달했습니다."
 TV_WONDER_CEREMONY_S5_DESC_222:0 "세 개의 거대한 탑이 지붕 위로 솟아 있고, 원뿔형 첨탑 꼭대기에는 번영과 순결을 뜻하는 옛 관습에 따라 타조 알이 올려져 있습니다. 비계는 신선한 진흙 바구니를 등에 걸쳐 놓고 토론 빔의 높이를 조정합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하고, 아직 때가 되지 않은 경우에는 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_222:0 "우리는 번영과 순결을 위해 타조 알로 탑에 왕관을 씌웁니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_222:0 "비계는 바구니를 낮추고 탑은 한동안 미완성 상태로 둡니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_222:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_222:0 "#Y 진행 중#! — #high 기도실은 봉쇄되었습니다#!\n#F 대기도실의 야자나무와 진흙 지붕은 봉쇄되었으며 내부 기둥 숲은 마침내 사헬의 태양으로부터 그늘을 얻었습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_222:0 "#G 완료#! — #high 기도실은 봉쇄되었습니다#!\n#F 대기도실의 지붕은 야자나무와 진흙으로 마감되었으며, 내부 기둥 숲은 마침내 사헬의 태양으로부터 그늘을 받았습니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_222:0 "[tv_wonder_ceremony|E]：기도원은 봉쇄되었습니다"
 TV_WONDER_CEREMONY_S6_DESC_222:0 "야자나무와 진흙으로 된 거대한 기도실의 지붕은 봉인되어 있고, 내부 기둥으로 이루어진 숲은 마침내 사헬의 태양으로부터 그늘을 드리웠습니다. 아래 상인들은 광장 건너편에 있는 모스크의 그림자에 맞춰 장터 시간을 맞추기 시작합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_222:0 "드디어 지붕이 봉쇄되었습니다!"
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_222:0 "우리는 기둥을 태양에 조금 더 열어 둡니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_222:0 "@tv_ceremony_laborers!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_222:0 "#Y 진행 중#! — #high 첫 번째 재도장 축제#!\n#F 도시 전체가 첫 번째 재도장 축제로 떠오릅니다. 남자와 소년은 즐거운 단 하루 동안 토론 빔을 타고 벽을 가로질러 신선한 진흙을 매끄럽게 만듭니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_222:0 "#G 완료#! — #high 첫 번째 재도장 축제#!\n#F 도시 전체가 첫 번째 재도장 축제로 밝혀졌고, 남자와 소년은 즐거운 단 하루 동안 토론 빔을 확장하여 벽을 가로질러 신선한 진흙을 매끄럽게 만듭니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_222:0 "[tv_wonder_ceremony|E]：제1회 재도장 페스티벌"
 TV_WONDER_CEREMONY_S7_DESC_222:0 "도시 전체가 첫 번째 재도장 축제에 참여합니다. 남자와 소년은 단 하루의 즐거운 노동 시간에 토론 빔을 확장하여 벽을 가로지르는 신선한 진흙을 매끄럽게 만듭니다. 모스크가 매끄러운 최종 코트를 입는 동안 음악가와 시장 여성들이 노동자들에게 음식을 제공합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_222:0 "도시 전체가 토론빔 위로 올라가 벽을 가로지르는 신선한 진흙을 매끄럽게 만듭니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_222:0 "이번 시즌은 아닙니다. 축제가 기다려지도록 하세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S8_222:0 "@tv_ceremony_religious_influence!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_222:0 "#Y 진행 중#! — #high 대모스크 스탠드 봉헌됨#!\n#F 젠네의 대모스크는 신자들이 흙으로 된 안뜰을 채우고 탑이 다음 세대를 위해 시장 광장을 그림자로 드리우면서 공식적으로 봉헌되었습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_222:0 "#G 완료#! — #high 봉헌된 대모스크 스탠드#!\n#F 젠네의 대모스크는 신자들이 흙으로 만든 안뜰을 채우고 탑이 다음 세대를 위해 시장 광장을 그림자로 드리우면서 공식적으로 봉헌되었습니다.#!"
 TV_WONDER_CEREMONY_S8_TITLE_222:0 "[tv_wonder_ceremony|E]: 대모스크가 봉헌되었습니다"
 TV_WONDER_CEREMONY_S8_DESC_222:0 "젠네의 대모스크는 신자들이 흙으로 만든 안뜰을 채우면서 공식적으로 봉헌되었으며, 그 탑은 다음 세대를 위해 시장 광장에 그림자를 드리우고 있습니다. 도시의 헌신은 사헬 전역에 알려지고 왕국 전체의 충실한 사람들은 그 모범에서 지속적인 힘을 얻습니다.\n\n#weak 의식을 완료하는 데 필요한 대가를 지불하십시오. 그 결과 경이로운 마지막 건물이 세워질 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_222:0 "우리는 신자들 앞에서 이 모스크를 봉헌하여 그 헌신이 사헬 전역에 울려 퍼지도록 합니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_222:0 "충실한 자들은 밖에 머물며 봉헌은 또 다른 날을 기다립니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_223:0 "@tv_ceremony_ruler!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_223:0 "#Y 진행 중#! — #high 오바는 만리장성을 선포합니다#!\n#F 오바는 수도를 둘러쌀 거대한 토공사와 성벽, 해자를 모든 이웃 왕국에 대한 베냉의 힘의 증거로 삼을 것을 선언합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_223:0 "#G 완료#! — #high 오바는 만리장성을 선포합니다#!\n#F 오바는 수도를 둘러쌀 거대한 토공사를 선포하고 성벽과 해자는 모든 이웃 왕국에 대한 베냉의 힘을 증명합니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_223:0 "[tv_wonder_ceremony|E]:오바(Oba)가 만리장성을 선포하다"
 TV_WONDER_CEREMONY_S1_DESC_223:0 "오바는 수도를 둘러싸는 거대한 토공사와 모든 이웃 왕국에 대한 베냉의 힘을 증명할 성벽과 해자를 선포합니다. 첫 번째 삽이 착공되기 전에 청동 주조자와 추장 모두가 노동을 맹세합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_223:0 "나는 이 법령을 선포하고 모든 추장에게 맹세를 하게 합니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_223:0 "Oba는 현재 이 법령을 보류하고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_223:0 "@tv_ceremony_mapmode!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_223:0 "#Y 진행 중#! — #high 궁전 도로 표시#!\n#F 측량사는 궁전에서 방사형으로 뻗어 있는 큰 도로를 표시하고 토공사가 숲 가장자리와 붉은 흙을 모두 따라 따라야 하는 선을 추적합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_223:0 "#G 완료#! — #high 궁전 도로 표시#!\n#F 측량사는 궁전에서 방사형으로 뻗어 있는 큰 도로를 표시하고 토공사가 숲 가장자리와 붉은 흙을 모두 따라 따라야 하는 선을 추적합니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_223:0 "[tv_wonder_ceremony|E]：궁궐길 표시"
 TV_WONDER_CEREMONY_S2_DESC_223:0 "측량사들은 궁전에서 방사형으로 뻗어나가는 큰 길을 표시하고 토공사가 숲 가장자리와 붉은 흙을 모두 따라 따라야 하는 선을 추적합니다. 외곽 지역의 추장들이 소환되어 가족의 노동력을 서약합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_223:0 "측정되는 길은 유지되는 길이다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_223:0 "측량사의 지분을 한 시즌 더 쉬게하겠습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_223:0 "@tv_ceremony_laborers!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_223:0 "#Y 진행 중#! — #high 모든 병동에서 노동력 모으기#!\n#F 수도의 모든 구에서 각 가구는 바구니와 괭이를 들고 노동자를 보냅니다. 이 바구니와 괭이는 누가 어떤 계절의 일을 빚졌는지에 대한 궁전의 신중한 계산에 따라 조직됩니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_223:0 "#G 완료#! — #high 모든 병동에서 노동력 모으기#!\n#F 수도의 모든 와드에 걸쳐 각 가구는 바구니와 괭이를 들고 노동자를 보냅니다. 이 바구니와 괭이는 누가 어떤 계절의 일을 빚졌는지에 대한 궁전의 신중한 계산에 따라 조직됩니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_223:0 "[tv_wonder_ceremony|E]：각 구에서 노동력을 모으다"
 TV_WONDER_CEREMONY_S3_DESC_223:0 "수도의 모든 구에 있는 가구는 바구니와 괭이를 들고 노동자를 보내며, 이는 누가 어떤 계절에 일해야 하는지에 대한 궁전의 신중한 계산에 따라 조직됩니다. 굴착이 시작되기 전에 경로가 방해받지 않도록 표시된 선을 따라 경비원이 배치되어 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_223:0 "모든 와드는 일꾼, 바구니, 괭이를 직접 보냅니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_223:0 "지연된 노동은 아직 빚진 노동입니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_223:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_223:0 "#Y 진행 중#! — #high 성벽의 진정한 시작#!\n#F 파기꾼들이 본격적으로 붉은 땅을 부수고, 한때 측량사 표시가 홀로 있던 곳에 성벽의 첫 번째 진정한 능선이 솟아오릅니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_223:0 "#G 완료#! — #high 성벽의 진정한 시작#!\n#F Diggers는 본격적으로 붉은 땅을 부수고, 한때 측량사 표시가 홀로 있던 곳에 성벽의 첫 번째 진정한 능선이 솟아오릅니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_223:0 "[tv_wonder_ceremony|E]：성벽의 진정한 시작"
 TV_WONDER_CEREMONY_S4_DESC_223:0 "파는 사람들이 본격적으로 붉은 땅을 부수고, 한때 측량사의 표시가 홀로 있던 곳에 성벽의 첫 번째 진정한 능선이 솟아오릅니다. 법령과 노동 명부였던 것이 이제는 숲 바닥에서 꾸준히 오르는 벽이 됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_223:0 "나는 첫 번째 능선이 솟아오르는 것을 보고 본격적으로 작업이 시작되었다고 말합니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_223:0 "채굴자들은 멈춰 있고, 붉은 땅은 방해받지 않고 기다립니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_223:0 "@tv_ceremony_lake!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_223:0 "#Y 진행 중#! — #high 해자는 깊게 파여 있습니다.#!\n#F 두 개의 성벽을 동시에 쌓는 옛 에도 방식으로, 솟아오른 성벽을 따라 깊은 해자를 깎아 굴착된 흙을 바로 위의 벽에 쌓았습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_223:0 "#G 완성#! — #high 해자는 깊게 파여 있습니다.#!\n#F 두 개의 성벽을 동시에 쌓는 옛 에도 방식으로, 솟아오른 성벽을 따라 깊은 해자를 깎고, 발굴된 흙을 바로 위의 벽에 쌓았습니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_223:0 "[tv_wonder_ceremony|E]：해자가 깊게 파여있습니다"
 TV_WONDER_CEREMONY_S5_DESC_223:0 "솟아오른 성벽을 따라 깊은 해자를 깎고, 두 가지를 동시에 건설하는 옛 에도 방식으로 발굴된 흙을 위의 벽에 직접 쌓았습니다. 시즌이 끝나기 전에 비가 참호를 가득 채워 첫 번째 토공사를 테스트합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_223:0 "굴착자들은 해자를 깊게 파고 위의 벽에 붉은 흙을 쌓았습니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_223:0 "도랑을 더 깊게 자르기 전에 비를 통해 테스트해 보겠습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_223:0 "@tv_ceremony_lock!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_223:0 "#Y 진행 중#! — #high 목재에 대문이 세워졌습니다.#!\n#F 궁전 도로가 토공사와 교차하는 지점에 거대한 목재 대문이 걸려 있으며, 여행자가 통과하기 전에 각 대문은 보호되고 축복을 받습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_223:0 "#G 완료#! — #high 목재에 대문이 세워져 있습니다#!\n#F 궁전 도로가 토공사와 교차하는 지점에 거대한 목재 문이 걸려 있으며, 여행자가 통과하기 전에 각 문은 보호되고 축복을 받습니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_223:0 "[tv_wonder_ceremony|E]: 대문은 목재로 설정되었습니다."
 TV_WONDER_CEREMONY_S6_DESC_223:0 "궁전 도로가 토공사를 가로지르는 지점에는 거대한 목재 문이 걸려 있으며, 여행자가 통과하기 전에 각 문을 보호하고 축복합니다. 궁전 자체 기록을 기념하기 위해 청동 명판이 의뢰됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_223:0 "장인들은 그날을 기념하기 위해 목재 대문을 걸고 청동 명판을 주조합니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_223:0 "축복받지 못한 문은 여행자보다 더 많은 것을 들여보냅니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_223:0 "@tv_ceremony_defensive_military_stance!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_223:0 "#Y 진행 중#! — #high 수도를 둘러싸는 성벽#!\n#F 토공사는 수도 주변의 마지막 간격을 막아 더 넓은 세상의 어떤 벽과도 맞먹는다고 알려진 성벽과 해자의 깨지지 않는 고리를 형성합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_223:0 "#G 완료#! — #high 수도를 둘러싸는 성벽#!\n#F 토공사는 수도 주변의 마지막 간격을 막아 더 넓은 세계의 어떤 벽과도 견줄 수 있는 성벽과 해자의 깨지지 않는 고리를 형성합니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_223:0 "[tv_wonder_ceremony|E]：성벽이 수도를 둘러싸고 있다"
 TV_WONDER_CEREMONY_S7_DESC_223:0 "토공사는 수도 주변의 마지막 간격을 메워 더 넓은 세계의 어떤 벽과도 맞먹는 성벽과 해자의 끊임없는 고리를 형성합니다. 노동자들이 마지막 몇 마일을 완료하는 동안에도 경비원은 완료된 구간을 따라 정기적인 순찰을 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 비용을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_223:0 "나는 마지막 간격을 좁히고 링이 깨지지 않았음을 선언합니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_223:0 "마지막 마일이 기다리고 있지만 링의 틈은 열려 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_223:0 "@tv_ceremony_army_strength!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_223:0 "#Y 진행 중#! — #high 오바가 완성된 성벽을 봉헌하다#!\n#F 오바는 거대한 행렬로 완성된 성벽 전체를 순회하며 청동 바퀴와 추장 모두 베냉의 힘이 여러 세대에 걸쳐 확보되었음을 선포합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_223:0 "#G 완료#! — #high 오바가 완성된 성벽을 봉헌하다#!\n#F 오바는 거대한 행렬로 완성된 성벽 전체를 순회하며 청동 바퀴와 추장 모두 베냉의 권력이 확보되었음을 선언합니다. 세대.#!"
 TV_WONDER_CEREMONY_S8_TITLE_223:0 "[tv_wonder_ceremony|E]：오바가 완성된 벽을 봉헌하다"
 TV_WONDER_CEREMONY_S8_DESC_223:0 "오바는 거대한 행렬을 이루며 완성된 성벽 전체를 순회하며, 청동 바퀴와 추장 모두 수 세대에 걸쳐 확보된 베냉의 권력을 선포합니다. 수도의 방어는 이제 왕국의 힘을 보여주는 지속적인 징표로 서 있으며, 왕국 전역의 모든 수비대에서 느낄 수 있습니다.\n\n#weak 의식을 완료하려면 필요한 대가를 지불하세요. 결과적으로 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_223:0 "Oba는 전체 순회를 타고 모든 수비대가 성벽의 새로운 힘을 느낍니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_223:0 "나는 성벽이 진정으로 선포될 준비가 될 때까지 행렬을 연기하겠습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_224:0 "@tv_ceremony_nobles!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_224:0 "#Y 진행 중#! — #high 정원 사유지 등록#!\n#F 정원 관리인, 석공, 화가, 시인, 귀족 후원자들이 정원 사유지를 등록하기 위해 쑤저우 고전 정원에 모였습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_224:0 "#G 완료#! — #high 정원 사유지 등록#!\n#F 정원 관리인, 석공, 화가, 시인, 귀족 후원자들이 정원 사유지를 등록하기 위해 쑤저우 고전 정원에 모였습니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_224:0 "[tv_wonder_ceremony|E]：정원 부지 등록"
 TV_WONDER_CEREMONY_S1_DESC_224:0 "정원 관리인, 석공, 화가, 시인, 귀족 후원자들이 쑤저우 고전 정원에 모여 정원 사유지를 등록합니다. 무대는 현장 노동, 대중 증언, 새로운 예술가와 문화적 전통을 향상시키는 의식적 증거를 기록합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_224:0 "정원 사유지 등록 단계를 진행하세요."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_224:0 "현장에서 의식을 거행할 수 있을 때까지 이 단계를 연기하십시오."
 TV_WONDER_CEREMONY_CARD_ICON_S2_224:0 "@tv_ceremony_lake!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_224:0 "#Y 진행 중#! — #high 수로 그리기#!\n#F 정원 관리인, 석공, 화가, 시인, 귀족 후원자들이 쑤저우 고전 정원에 모여 수로를 그립니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_224:0 "#G 완료#! — #high 수로 그리기#!\n#F 정원 관리인, 석공, 화가, 시인, 귀족 후원자들이 쑤저우 고전 정원에 모여 수로를 그립니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_224:0 "[tv_wonder_ceremony|E]：물 코스 그리기"
