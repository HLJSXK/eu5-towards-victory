 TV_WONDER_CEREMONY_CARD_ICON_S7_198:0 "@tv_ceremony_lock!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_198:0 "#Y 진행 중#! — #high 무기와 세포가 내부에 장착됨#!\n#F 무기고, 탄창, 보안 세포가 탑 내에 장착되고 요새는 방어와 왕권의 도구 역할을 하기 시작합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_198:0 "#G 완료#! — #high 무기와 세포가 내부에 장착됨#!\n#F 무기고, 탄창, 보안 세포가 탑 내에 장착되고 요새는 방어와 왕권의 도구 역할을 하기 시작합니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_198:0 "[tv_wonder_ceremony|E]: 무기고와 셀이 내부에 장착되어 있습니다."
 TV_WONDER_CEREMONY_S7_DESC_198:0 "무기고, 탄창, 보안 셀이 탑 내에 설치되고 요새는 왕권의 방어이자 도구 역할을 하기 시작합니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_198:0 "하나의 벽은 왕국을 보호할 수 있고, 하나의 벽은 왕국의 비밀을 보호할 수 있습니다."
