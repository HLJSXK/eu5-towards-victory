 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_211:0 "#Y 진행 중#! — #high 금고가 봉인되었습니다.#!\n#F 철결 금고는 계산원의 기초에 설치되어 밤낮으로 보호되며 왕자와 도시 모두가 의지할 동전 상자를 보관할 준비가 되어 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_211:0 "#G 완료#! — #high 금고가 봉인되었습니다.#!\n#F 철결 금고는 계산원의 기초에 설치되어 밤낮으로 보호되며 왕자와 도시 모두가 의지할 동전 상자를 보관할 준비가 되어 있습니다.#!"
