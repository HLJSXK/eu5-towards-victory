 TV_WONDER_CEREMONY_CARD_ICON_S1_107:0 "@tv_ceremony_province!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_107:0 "#Y 진행 중#! — #high Pachacuti가 봉우리 사이의 능선을 주장하다#!\n#F 사파 잉카 파차쿠티는 왕실 영지가 마추픽추와 와이나픽추 사이의 안장을 차지할 것이라고 선언합니다. 자손.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_107:0 "#G 완료#! — #high Pachacuti가 봉우리 사이의 능선을 주장하다#!\n#F 사파 잉카 파차쿠티는 왕실의 영지가 마추픽추와 와이나픽추 사이의 안장을 차지하게 될 것이라고 선언합니다. 자손.#!"
 TV_WONDER_CEREMONY_S1_TITLE_107:0 "[tv_wonder_ceremony|E]: 파차쿠티가 봉우리 사이의 능선을 주장하다"
 TV_WONDER_CEREMONY_S1_DESC_107:0 "Sapa Inca Pachacuti는 마추픽추와 와이나픽추 사이의 안장을 태양의 후손에게 걸맞은 휴양지로 왕실 영지가 차지할 것이라고 선언합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_107:0 "파차쿠티가 말했어요!"
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_107:0 "법원은 아직 능선을 착공할 생각이 없어 지체하고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_107:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_107:0 "#Y 진행 중#! — #high 사제들은 산의 정령을 읽습니다#!\n#F 사제는 산등성이에 올라 주변 봉우리의 정령인 아푸스에게 문의하고 태양의 신 인티 사원이 동지 일출을 맞이해야 하는 위치를 표시합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_107:0 "#G 완료#! — #high 사제들은 산의 정령을 읽습니다#!\n#F 사제는 산등성이에 올라 주변 봉우리의 정령인 아푸스에게 문의하고 태양의 인티 신전이 동지를 향해야 하는 위치를 표시합니다 sunrise.#!"
 TV_WONDER_CEREMONY_S2_TITLE_107:0 "[tv_wonder_ceremony|E]：사제가 산신령을 읽는다"
 TV_WONDER_CEREMONY_S2_DESC_107:0 "성직자들은 능선에 올라 주변 봉우리의 정령인 아푸스(Apus)에게 문의하고 태양의 신 인티(Inti) 사원이 동지 일출을 맞이해야 하는 위치를 표시합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다립니다.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_107:0 "사제들은 산의 정령들에게 질문하기 위해 올라갑니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_107:0 "아직은 아닙니다. Apus가 응답하지 않았습니다!"
 TV_WONDER_CEREMONY_CARD_ICON_S3_107:0 "@tv_ceremony_building_needs!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_107:0 "#Y 진행 중#! — #high 화강암은 능선 자체에서 채취됩니다#!\n#F 노동자들은 산 자체의 화강암 노두에 직접 채석장을 열고 측량사는 가파른 안데스 산맥을 막아줄 테라스를 배치합니다. 경사.#!"
