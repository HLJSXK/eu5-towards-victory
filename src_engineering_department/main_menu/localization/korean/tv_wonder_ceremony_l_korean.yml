 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_204:0 "#G 완료#! — #high 트빌리시 위에서 벽의 모양이 잡히다#!\n#F 커튼월의 첫 번째 코스가 능선을 따라 올라가고, 한때 밧줄과 분필 자국이 걸려 있던 것이 트빌리시 지붕 위에 서 있는 돌이 됩니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_204:0 "[tv_wonder_ceremony|E]: 트빌리시 위의 벽 모양"
 TV_WONDER_CEREMONY_S4_DESC_204:0 "커튼월의 첫 번째 코스는 능선을 따라 올라가고 한때 밧줄과 분필 자국으로 걸려 있던 것이 트빌리시의 지붕 위에 서 있는 돌이 됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_204:0 "우리는 우리 스스로 첫 번째 길을 마련하여 도시가 단순한 약속이 아닌 돌이 솟아오르는 것을 볼 수 있도록 합니다."
