 TV_WONDER_CEREMONY_S8_DESC_228:0 "천문학자, 악기 캐스터, 서기관, 사서, 후원자, 달력 관리들이 마라게 천문대에 모여 천문대를 봉헌합니다. 무대는 현장 노동, 공개 증언, 관찰을 연구 진행과 학문적 명성으로 바꾸는 의식적 증거를 기록합니다.\n\n#weak 행사를 완료하는 데 필요한 대가를 지불하세요. 결과적으로 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
