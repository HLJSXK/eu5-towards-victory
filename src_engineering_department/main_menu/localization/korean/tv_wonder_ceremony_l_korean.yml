 TV_WONDER_CEREMONY_S3_DESC_204:0 "주변 언덕에서 징집된 노동자와 채석공들이 깎은 돌을 지그재그로 옮기고, 장교들은 언젠가 이 벽을 지킬 첫 번째 회사를 소집합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하거나 아직 때가 되지 않은 경우 기다리세요.#!"
