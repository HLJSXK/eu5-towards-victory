 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_204:0 "#Y 진행 중#! — #high 나리칼라가 무적의 자리에 서다#!\n#F 요새는 능선을 완성했고, 수비대는 뚫고 포위 공격으로 성벽을 입증했으며, 오늘부터 왕국의 모든 수비대는 위에서 배운 내용을 조금 더 안정적으로 유지합니다. 트빌리시.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_204:0 "#G 완료#! — #high 나리칼라가 무적의 자리에 서다#!\n#F 요새는 능선을 완성했고, 수비대는 뚫고 포위 공격으로 성벽을 입증했습니다. 오늘부터 왕국의 모든 수비대는 위에서 배운 내용을 조금 더 안정적으로 유지합니다. 트빌리시.#!"
 TV_WONDER_CEREMONY_S8_TITLE_204:0 "[tv_wonder_ceremony|E]:Narikala는 무적이다"
 TV_WONDER_CEREMONY_S8_DESC_204:0 "요새는 능선을 완성하고 수비대가 뚫려 있으며 성벽은 포위 공격으로 입증되었으며, 오늘부터 왕국의 모든 수비대는 트빌리시에서 배운 내용을 바탕으로 좀 더 확고한 자세를 유지하고 있습니다.\n\n#weak 의식을 완료하는 데 필요한 대가를 지불하세요. 결과적으로 불가사의의 최종 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_204:0 "수비대는 훈련을 받고 부서지지 않았으며 Narikala는 완전하다고 선언되었습니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_204:0 "벽은 이미 부서지지 않고 서 있지만 아직 완성되었다고 말할 수는 없습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_205:0 "@tv_ceremony_holy_site!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_205:0 "#Y 진행 중#! — #high 영원한 불꽃이 요구됩니다#!\n#F 압셰론 길을 따라 여행하는 사람들은 땅 자체에서 스며드는 결코 꺼지지 않는 불에 대해 이야기하고, 법원은 불꽃을 존경하는 모든 사람을 위해 그 주위에 성소가 세워질 것이라고 선언합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_205:0 "#G 완료#! — #high 영원한 불꽃이 요구됩니다#!\n#F 압셰론 길을 따라 여행하는 사람들은 땅 자체에서 새어나오는 결코 꺼지지 않는 불에 대해 이야기하고, 법원은 존경하는 모든 사람을 위해 그 주위에 성소가 세워질 것이라고 선언합니다. 불꽃.#!"
 TV_WONDER_CEREMONY_S1_TITLE_205:0 "[tv_wonder_ceremony|E]:영원한 불꽃을 요구하다"
 TV_WONDER_CEREMONY_S1_DESC_205:0 "압셰론 길을 따라 여행하는 사람들은 땅 자체에서 스며드는 결코 꺼지지 않는 불에 대해 이야기하고, 법원은 불길을 기리는 모든 사람을 위해 그 주변에 성소를 세울 것이라고 선언합니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 대가를 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_205:0 "법원은 불타는 땅을 신성하다고 선언하고 그 헌신을 불꽃에 묶습니다."
