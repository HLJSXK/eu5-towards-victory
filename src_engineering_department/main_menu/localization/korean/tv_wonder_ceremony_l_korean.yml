 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_173:0 "#G 완료#! — #high 물을 만나기 위한 첫 번째 단계#!\n#F Masons는 첫 번째 돌계단을 흘수선에 직접 놓았습니다. 계획이 모래 위에 표시된 선만 있던 곳에서 이제 진정한 건물 작업이 시작되었습니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_173:0 "[tv_wonder_ceremony|E]：물을 만나는 첫 번째 단계"
 TV_WONDER_CEREMONY_S4_DESC_173:0 "메이슨은 첫 번째 돌계단을 흘수선에 직접 놓았습니다. 모래 위에 표시된 선만 계획했던 곳에서 이제 진정한 건축 작업이 시작되었습니다. 순례자들은 아침 목욕을 멈추고 각 블록이 제자리에 고정되는 것을 지켜봅니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
