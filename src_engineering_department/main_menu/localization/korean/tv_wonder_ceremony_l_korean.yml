 TV_WONDER_CEREMONY_CARD_ICON_S1_103:0 "@tv_ceremony_holy_site!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_103:0 "#Y 진행 중#! — #high A 돔이 바위 위에 선포되다#!\n#F Caliph Abd al-Malik은 황금 돔이 하람 꼭대기의 기초석 위에 세워질 것이라고 선포하고, 외치는 사람들은 해가 지기 전에 예루살렘 시장을 통해 소식을 전합니다. 세트.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_103:0 "#G Completed#! — #high A 돔이 바위 위에 선포되다#!\n#F Caliph Abd al-Malik은 황금 돔이 하람 꼭대기의 기초석 위에 세워질 것이라고 선포하고, 외치는 사람들은 해가 지기 전에 예루살렘 시장을 통해 소식을 전합니다. 세트.#!"
 TV_WONDER_CEREMONY_S1_TITLE_103:0 "[tv_wonder_ceremony|E]: 바위 위에 돔이 세워졌습니다"
 TV_WONDER_CEREMONY_S1_DESC_103:0 "칼리프 아브드 알 말리크(Caliph Abd al-Malik)는 하람 꼭대기의 기초석 위에 황금 돔이 세워질 것을 명령하고, 해가 지기 전에 외치는 사람들이 예루살렘 시장에 소식을 전합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_103:0 "칼리프의 법령은 가장 빠른 말보다 빠릅니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_103:0 "우리는 아직 이 법령을 큰 소리로 말할 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_103:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_103:0 "#Y 진행 중#! — #high 플랫폼이 정리되고 축복을 받았습니다#!\n#F 이맘과 지역 성직자들이 함께 주변을 산책하며 돔이 장식할 돌을 축복하는 동안 노동자들이 고대 플랫폼을 쓸어 버리고 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_103:0 "#G 완료#! — #high 플랫폼이 정리되고 축복받았습니다.#!\n#F 이맘과 지역 성직자들이 함께 주변을 걷고 돔이 장식할 돌을 축복하는 동안 노동자들이 고대 플랫폼을 쓸어 버리고 있습니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_103:0 "[tv_wonder_ceremony|E]：플랫폼이 청산되고 축복받았습니다"
 TV_WONDER_CEREMONY_S2_DESC_103:0 "이맘과 지역 성직자들이 함께 주변을 산책하며 돔이 장식할 돌을 축복하는 동안 노동자들은 고대 플랫폼의 잔해를 청소합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_103:0 "이맘들은 발 밑에 있는 돌을 축복하며 깨끗한 단상을 걸어갑니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_103:0 "신성한 땅이라도 그 축복을 기다려야 합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_103:0 "@tv_ceremony_wealth!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_103:0 "#Y 진행 중#! — #high 대리석과 금이 모였습니다#!\n#F 지방 전역의 폐허가 된 비잔틴 회당에서 기둥과 대리석 석판이 벗겨지고, 캐러밴은 금박과 삼나무 기둥을 예루살렘으로 가져옵니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_103:0 "#G 완료#! — #high 대리석과 금이 모였습니다#!\n#F 주 전역의 폐허가 된 비잔틴 회당에서 기둥과 대리석 석판이 벗겨지고, 캐러밴은 금박과 삼나무 기둥을 예루살렘으로 옮깁니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_103:0 "[tv_wonder_ceremony|E]：대리석과 금이 모여있다"
 TV_WONDER_CEREMONY_S3_DESC_103:0 "지방 전역의 폐허가 된 비잔틴 홀에서 기둥과 대리석 석판이 벗겨지고, 캐러밴은 금박과 삼나무 기둥을 예루살렘으로 가져오는 길로 옮깁니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_103:0 "우리는 무너진 홀에서 대리석을 운반하고 먼 길에서 금을 가져오라고 명령했습니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_103:0 "캐러밴들은 아직도 문 앞에 서 있고, 화물도 아직 소환되지 않았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_103:0 "@tv_ceremony_art_work!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_103:0 "#Y 진행 중#! — #high 바위 주위로 솟아오른 팔각형#!\n#F 메이슨은 성스러운 돌 바로 주위에 팔각형 아케이드의 첫 번째 고리를 놓았고, 처음으로 앞으로 나올 돔의 모양이 아래 거리에서 보입니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_103:0 "#G 완료#! — #high 바위 주위로 솟아오른 팔각형#!\n#F 메이슨은 신성한 돌 바로 주위에 팔각형 아케이드의 첫 번째 고리를 놓았고, 처음으로 앞으로 나올 돔의 모양이 아래 거리에서 보입니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_103:0 "[tv_wonder_ceremony|E]: 옥타곤이 바위 주위에 솟아오릅니다."
 TV_WONDER_CEREMONY_S4_DESC_103:0 "메이슨은 성스러운 돌 바로 주위에 팔각형 아케이드의 첫 번째 고리를 놓았고 처음으로 앞으로 나올 돔의 모양을 아래 거리에서 볼 수 있습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_103:0 "메이슨은 신성한 바위 주위에 팔각형의 첫 번째 기초석을 놓습니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_103:0 "우리는 아직 이 첫 번째 돌 고리를 올릴 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_103:0 "@tv_ceremony_construction!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_103:0 "#Y 진행 중#! — #high 이중 보행형의 모양#!\n#F 대리석 기둥의 내부 및 외부 아케이드가 바위 주변에 닫혀 있으며, 그 아치는 언젠가 위의 거대한 나무 돔을 지탱할 무게를 지탱하고 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_103:0 "#G 완료#! — #high 이중 보행형의 모양#!\n#F 대리석 기둥의 내부 및 외부 아케이드가 바위 주변에 닫혀 있으며, 그 아치는 언젠가 위의 거대한 나무 돔을 지탱할 무게를 지탱하고 있습니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_103:0 "[tv_wonder_ceremony|E]: 이중 보행형의 모습"
 TV_WONDER_CEREMONY_S5_DESC_103:0 "대리석 기둥으로 이루어진 내부 및 외부 아케이드는 바위 주위에 닫혀 있으며, 그 아치는 언젠가 위의 거대한 목조 돔을 지탱하게 될 무게를 지탱하고 있습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_103:0 "한 쌍의 아케이드는 Rock 주위에 닫혀 있으며 아치는 이미 다가올 무게를 지탱하고 있습니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_103:0 "기초가 확실해지기 전에는 아치가 닫히지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_103:0 "@tv_ceremony_writer!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_103:0 "#Y 진행 중#! — #high 모자이크와 구절이 벽을 덮고 있습니다.#!\n#F 장인들이 드럼을 따라 덩굴과 왕관의 유리 모자이크를 설정하고, 서예가들은 내부를 돌게 될 긴 꾸란 구절의 띠를 시작합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_103:0 "#G 완료#! — #high 모자이크와 구절이 벽을 덮습니다#!\n#F 공예가들이 드럼을 따라 덩굴과 왕관의 유리 모자이크를 설정하고, 서예가들은 내부를 돌게 될 긴 꾸란 구절의 띠를 시작합니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_103:0 "[tv_wonder_ceremony|E]：모자이크와 구절이 벽을 뒤덮습니다"
 TV_WONDER_CEREMONY_S6_DESC_103:0 "장인들은 드럼을 따라 덩굴과 왕관의 유리 모자이크를 설치하고, 서예가들은 내부를 돌게 될 긴 꾸란 구절의 밴드를 시작합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우에는 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_103:0 "우리는 모자이크와 이 벽을 둘러쌀 구절을 의뢰합니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_103:0 "서예가들은 붓을 내려놓았지만 시는 아직 끝나지 않았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_103:0 "@tv_ceremony_gold!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_103:0 "#Y 진행 중#! — #high 돔에 금박이 입혀졌습니다#!\n#F 한여름에 나무 돔 위에 금판이 두드려지고, 비계가 내려오기 전에 순례자들이 이미 문에 모여 빛을 받는 것을 지켜봅니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_103:0 "#G 완료#! — #high 돔은 금박을 입혔습니다#!\n#F 한여름에 나무 돔 위에 금판이 두드려지고, 비계가 내려오기 전에 순례자들이 이미 문에 모여 빛을 받는 것을 지켜봅니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_103:0 "[tv_wonder_ceremony|E]: 돔은 도금되어 있습니다"
 TV_WONDER_CEREMONY_S7_DESC_103:0 "한여름에 나무 돔 위에 금판이 두드려지고, 비계가 내려오기 전에 순례자들이 이미 문에 모여 빛을 받는 것을 지켜봅니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_103:0 "여름 더위를 견디며 장인들은 돔의 나무 프레임에 금판을 하나씩 망치로 두드립니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_103:0 "그런 더위 속에서 우리는 아직 금도금업자들을 비계 위로 보내지 않을 것입니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_103:0 "@tv_ceremony_religious_unity!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_103:0 "#Y 진행 중#! — #high 돔이 봉헌되다#!\n#F 비계가 사라지고 금 돔이 예루살렘의 태양을 받아 모인 군중 앞에서 플랫폼이 봉헌되고 바위의 빛이 이날부터 온 왕국에 닿는다고 합니다 on.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_103:0 "#G 완료#! — #high 돔이 봉헌되다#!\n#F 비계가 사라지고 금 돔이 예루살렘의 태양을 받아 모인 군중 앞에서 플랫폼이 봉헌되고 바위의 빛이 이날부터 온 왕국에 닿는다고 합니다 on.#!"
 TV_WONDER_CEREMONY_S8_TITLE_103:0 "[tv_wonder_ceremony|E]:돔이 신성해졌습니다"
 TV_WONDER_CEREMONY_S8_DESC_103:0 "비계가 사라지고 예루살렘의 태양을 받는 황금 돔이 있는 가운데, 모인 군중 앞에서 플랫폼이 봉헌되고 바위의 빛이 오늘부터 왕국 전체에 닿을 것이라고 합니다.\n\n#weak 예식을 완료하려면 필요한 가격을 지불하세요. 결과적으로 경이로운 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_103:0 "모인 군중 앞에서 단이 성별되고 반석의 빛이 온 나라를 비추리라 선포됩니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_103:0 "군중은 아직 봉헌 의식이 열리지 않은 상태에서 성문에서 흩어졌습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_104:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_104:0 "#Y 진행 중#! — #high 왕이 돌산을 명령하다#!\n#F 수르야바르만 2세는 그의 궁정을 소집하여 비슈누를 위한 사원 산을 발표했는데, 그 5개의 탑은 크메르 땅에 아직 건설된 어떤 사당보다 더 높이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_104:0 "#G 완료#! — #high 왕은 돌산을 명령한다#!\n#F 수르야바르만 2세는 그의 궁정을 소집하여 비슈누를 위한 사원 산을 발표했으며, 그 5개의 탑은 크메르 땅에 아직 건설된 어떤 사당보다 더 높이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_104:0 "[tv_wonder_ceremony|E]:왕이 돌산을 명령하다"
 TV_WONDER_CEREMONY_S1_DESC_104:0 "수리야바르만 2세는 자신의 궁정을 소집하여 비슈누를 위한 사원 산을 발표했습니다. 이 탑의 5개 탑은 크메르 땅에 아직 건설된 그 어떤 사당보다 더 높이 솟아오를 것입니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_104:0 "수리야바르만은 돌산에 왕위를 걸었습니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_104:0 "왕은 머뭇거리고, 산은 궁중에서 소문으로만 남게 된다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_104:0 "@tv_ceremony_time!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_104:0 "#Y 진행 중#! — #high 점성술사들이 서쪽 문을 고치다#!\n#F 궁정 점성가들은 사원이 동쪽이 아닌 서쪽을 향하고 있다고 주장하는데, 이는 별에서 읽은 특이한 선택이며, 브라만 사제들은 해자의 미래 선을 따라 걸어가 축복을 빕니다. 지상.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_104:0 "#G 완료#! — #high 점성술사들이 서쪽 문을 고치다#!\n#F 궁정 점성가들은 사원이 동쪽이 아닌 서쪽을 향하고 있다고 주장하는데, 이는 별에서 읽은 특이한 선택이며, 브라만 사제들은 해자의 미래 선을 따라 걸어가 축복을 받습니다. 지상.#!"
 TV_WONDER_CEREMONY_S2_TITLE_104:0 "[tv_wonder_ceremony|E]：점성술사들이 서쪽 문을 고치다"
 TV_WONDER_CEREMONY_S2_DESC_104:0 "궁정 점성가들은 사원이 동쪽이 아닌 서쪽을 향하고 있다고 주장하는데, 이는 별에서 읽은 특이한 선택이며, 브라만 사제들은 땅을 축복하기 위해 해자의 미래 선을 따라 걷는다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 대가를 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_104:0 "별들이 말했어요!"
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_104:0 "점성가들은 기각되었고 서쪽 문은 표시되지 않은 채로 남아 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_104:0 "@tv_ceremony_laborers!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_104:0 "#Y 진행 중#! — #high 사암이 쿨렌 언덕을 내려갑니다#!\n#F 사암 블록이 쿨렌 언덕에서 절단되어 뗏목을 타고 운하를 따라 떠다니는 동안 코끼리는 사원까지 마지막 구간에서 가장 큰 돌을 운반합니다. 사이트.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_104:0 "#G 완료#! — #high 사암이 쿨렌 언덕을 내려갑니다#!\n#F 사암 블록이 쿨렌 언덕에서 절단되어 뗏목을 타고 운하를 따라 떠다니는 동안 코끼리는 사원까지 마지막 구간에서 가장 큰 돌을 운반합니다. 사이트.#!"
 TV_WONDER_CEREMONY_S3_TITLE_104:0 "[tv_wonder_ceremony|E]：사암이 쿨렌 언덕을 내려옵니다"
 TV_WONDER_CEREMONY_S3_DESC_104:0 "쿨렌(Kulen) 언덕에서 사암 블록을 잘라서 뗏목을 타고 운하를 따라 떠내려가는 동안 코끼리는 가장 큰 돌을 사원 부지까지 마지막 구간으로 운반합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_104:0 "코끼리와 뗏목은 사암을 쿨렌에서 사원 부지까지 운반합니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_104:0 "언덕이 기다리게 하라!"
 TV_WONDER_CEREMONY_CARD_ICON_S4_104:0 "@tv_ceremony_lake!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_104:0 "#Y 진행 중#! — #high 해자가 끊어지고 플랫폼이 솟아오릅니다.#!\n#F 노동자들은 성전을 둘러쌀 큰 해자를 자르기 시작하고, 첫 번째 기초 플랫폼은 중앙의 배수된 흙에서 세워집니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_104:0 "#G 완료#! — #high 해자가 끊어지고 플랫폼이 솟아오릅니다.#!\n#F 노동자들은 성전을 둘러쌀 큰 해자를 자르기 시작하고, 첫 번째 기초 플랫폼은 중앙의 배수된 흙에서 세워집니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_104:0 "[tv_wonder_ceremony|E]：해자가 끊어지고 플랫폼이 솟아오릅니다."
 TV_WONDER_CEREMONY_S4_DESC_104:0 "인부들은 사원을 둘러쌀 거대한 해자를 자르기 시작하고, 첫 번째 기초 플랫폼은 중앙의 배수된 흙에서 세워집니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_104:0 "동전은 굴착기로 흘러가고, 첫 번째 플랫폼은 배수된 땅에서 솟아오릅니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_104:0 "재무부는 동전을 보관하고 해자의 땅은 한동안 방해받지 않고 그대로 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_104:0 "@tv_ceremony_holy_site!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_104:0 "#Y 진행 중#! — #high 다섯 개의 탑이 메루를 향해 올라갑니다#!\n#F 계층별로 중앙 탑이 올라가며 메루산 정상을 연상시키며, 긴 행렬의 둑길은 해자를 가로질러 돌 하나하나 포장되어 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_104:0 "#G 완료#! — #high 5개의 탑이 메루를 향해 올라갑니다#!\n#F 중앙 탑이 층별로 올라가며 메루산 정상을 연상시키며, 긴 행렬의 둑길은 해자를 가로질러 돌로 포장되어 있습니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_104:0 "[tv_wonder_ceremony|E]：5개의 탑이 메루를 향해 올라간다"
 TV_WONDER_CEREMONY_S5_DESC_104:0 "중앙 탑은 메루산 정상을 반영하며 층층이 올라가고, 긴 행렬의 둑길은 해자를 가로질러 돌 하나하나가 포장되어 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_104:0 "메루를 향해!"
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_104:0 "석공들은 도구를 내려놓았고, 탑은 최종 높이 아래에서 멈춰 섰습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_104:0 "@tv_ceremony_art_work!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_104:0 "#Y 진행 중#! — #high 갤러리는 바다의 휘젓기를 전한다#!\n#F 조각가들은 우유 바다를 휘젓는 신과 악마, 옆 돌에서 춤추는 압사라의 줄을 따라 긴 갤러리 벽을 조각합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_104:0 "#G 완료#! — #high 갤러리는 바다의 휘젓기를 전합니다#!\n#F 조각가들은 신과 악마가 우유 바다를 휘젓고 있는 모습을 긴 갤러리 벽에 조각하고, 옆 돌에서 춤추는 압사라들이 한 줄로 늘어서 있습니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_104:0 "[tv_wonder_ceremony|E]：화랑이 바다의 요동을 말하다"
 TV_WONDER_CEREMONY_S6_DESC_104:0 "조각가들은 우유 바다를 휘젓고 있는 신과 악마가 있는 긴 갤러리 벽을 조각하고, 그 옆에는 돌 위에서 춤추는 압사라가 한 줄로 늘어서 있습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_104:0 "조각가들은 끌을 돌로 만들어 갤러리 벽에서 신들과 압사라들을 유혹합니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_104:0 "돌을 그대로 두십시오!"
 TV_WONDER_CEREMONY_CARD_ICON_S7_104:0 "@tv_ceremony_river!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_104:0 "#Y 진행 중#! — #high 몬순 홍수로 둑길 테스트#!\n#F 폭우가 내리는 계절에 미완성 해자가 범람하여 둑길의 기초가 위협을 받지만, 노동자 갱단이 비오는 달에도 일을 합니다. 라인.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_104:0 "#G 완료#! — #high 몬순 홍수로 둑길 테스트#!\n#F 폭우가 내리는 계절에 미완성 해자가 범람하여 둑길의 기초가 위협을 받지만, 노동자 갱단이 비오는 달에도 일을 합니다. 라인.#!"
 TV_WONDER_CEREMONY_S7_TITLE_104:0 "[tv_wonder_ceremony|E]：몬순 홍수로 둑길 테스트"
 TV_WONDER_CEREMONY_S7_DESC_104:0 "폭우가 쏟아져 미완성 해자가 범람하고 둑길의 기초가 위협을 받지만, 노동자 무리가 비오는 달에도 줄을 지키기 위해 애쓰고 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우에는 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_104:0 "우리는 우리가 건설한 것을 몬순이 빼앗도록 두지 않을 것입니다. 모든 손을 둑길로 보내십시오."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_104:0 "일꾼들은 홍수에서 물러나고 둑길은 비에 맡겨진다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_104:0 "@tv_ceremony_religious_influence!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_104:0 "#Y 진행 중#! — #high 사원은 비슈누에게 헌정되었습니다#!\n#F 사제들은 완성된 둑길을 건너 중앙 성역으로 향하는 대봉헌 행렬을 이끌고, 왕국은 비슈누의 은총 아래 영원히 있을 것임을 선포합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_104:0 "#G 완료#! — #high 사원은 비슈누에게 헌정되었습니다#!\n#F 사제들은 완성된 둑길을 건너 중앙 성역으로 향하는 대봉헌 행렬을 이끌고, 왕국은 비슈누의 은총 아래 영원히 있을 것임을 선포합니다.#!"
 TV_WONDER_CEREMONY_S8_TITLE_104:0 "[tv_wonder_ceremony|E]: 사원은 비슈누에게 바쳐졌습니다"
 TV_WONDER_CEREMONY_S8_DESC_104:0 "성직자들은 완성된 둑길을 가로질러 중앙 성소까지 이어지는 거대한 봉헌 행렬을 이끌고, 왕국은 비슈누의 은총 아래 영원히 서 있을 것임을 선포합니다.\n\n#weak 의식을 완료하는 데 필요한 가격을 지불하세요. 결과적으로 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_104:0 "비슈누에게 영광을!"
