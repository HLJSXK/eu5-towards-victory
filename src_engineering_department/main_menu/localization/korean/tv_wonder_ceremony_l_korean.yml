 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_186:0 "#Y 진행 중#! — #high 강둑에서 모습을 드러내는 차이카#!\n#F 조선공과 대장장이가 나란히 작업하여 단일 참나무 줄기에서 차이카 보트의 속을 비우고 대장간에서는 군도, 머스켓 총신, 편자를 망치로 두드려서 제작합니다. 일시정지.#!"
