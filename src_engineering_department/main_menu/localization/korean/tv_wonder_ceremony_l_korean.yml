 TV_WONDER_CEREMONY_CARD_ICON_S8_139:0 "@tv_ceremony_maritime_presence!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_139:0 "#Y 진행 중#! — #high 보물선단이 항해를 시작합니다#!\n#F 대선이 양쯔강을 바다를 향해 출발하고 롱장의 야드가 영구 대장간으로 신성화되면서 배너, 북, 향연이 난징 해안가를 가득 채웁니다. 왕조의 해군력 범위.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_139:0 "#G 완료#! — #high 보물함대가 항해를 시작합니다#!\n#F 대형 선박이 양쯔강을 바다를 향해 출발하고 롱장의 야드가 영구 항구로 봉헌되면서 배너, 북, 향연이 난징 해안가를 가득 채웁니다. 왕조 해군력의 대장간입니다.#!"
 TV_WONDER_CEREMONY_S8_TITLE_139:0 "[tv_wonder_ceremony|E]:보물함대가 항해를 시작합니다"
 TV_WONDER_CEREMONY_S8_DESC_139:0 "거대한 배가 양쯔강을 따라 넓은 바다를 향해 출항할 때 깃발, 북, 향 연기가 난징 해안을 가득 채웁니다. 그리고 Longjiang의 야드는 왕조 해군의 도달 범위를 위한 영구 대장간으로 축성되었습니다.\n\n#weak 의식을 완료하는 데 필요한 가격을 지불하세요. 결과적으로 불가사의의 마지막 건물이 떠오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_139:0 "보물 함대가 넓은 바다를 향해 출항하는 동안 배너와 북이 해안가를 가득 채웁니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_139:0 "함대는 깃발을 휘날리며 정박해 있으며 항해는 아직 알려지지 않았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_140:0 "@tv_ceremony_law!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_140:0 "#Y 진행 중#! — #high 성스러운 도시의 칙령이 봉인되었습니다.#!\n#F A 엄숙한 헌장이 봉인되어 예루살렘의 신성한 구역이 침범할 수 없음을 선언하고 고대 성벽 안에 있는 모든 문, 구역 및 성소에 대한 보호를 약속합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_140:0 "#G 완료#! — #high 거룩한 도시의 칙령이 봉인되었습니다#!\n#F A 엄숙한 헌장이 봉인되어 예루살렘의 신성한 구역이 침범할 수 없음을 선언하고 고대 성벽 안에 있는 모든 문, 구역 및 성소에 대한 보호를 약속합니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_140:0 "[tv_wonder_ceremony|E]：거룩한 도시의 칙령이 봉인되었습니다"
 TV_WONDER_CEREMONY_S1_DESC_140:0 "예루살렘의 신성한 구역은 침범할 수 없음을 선언하는 엄숙한 헌장이 봉인되어 고대 성벽 내의 모든 문, 구역 및 성소에 대한 보호를 약속합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_140:0 "서기관이 밀랍에 왕실 인장을 찍으면 헌장이 법이 됩니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_140:0 "서기관은 펜을 내려놓고 왁스를 잠시 동안 개봉한 상태로 둡니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_140:0 "@tv_ceremony_government!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_140:0 "#Y 진행 중#! — #high 각 분기의 수호자 이름이 지정됩니다.#!\n#F 도시 분기의 장로들이 새 주지사 앞에 소환되며, 각자는 자신의 거리, 신사 및 행렬의 유지와 평화를 맡습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_140:0 "#G 완료#! — #high 각 분기의 수호자 이름이 지정됨#!\n#F 도시 분기의 장로들이 새 주지사 앞에 소환되며, 각자는 자신의 거리, 신사 및 교회의 유지와 평화를 맡습니다. 행렬.#!"
 TV_WONDER_CEREMONY_S2_TITLE_140:0 "[tv_wonder_ceremony|E]：각 분기의 수호자가 지정됩니다"
 TV_WONDER_CEREMONY_S2_DESC_140:0 "도시 구역의 장로들은 새 주지사 앞에 소환되며, 각자 자신의 거리, 신사, 행렬의 유지와 평화를 맡습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_140:0 "드디어 선택한 장로들!"
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_140:0 "주지사들은 명명을 연기하고 장로들을 밖에서 기다리게 합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_140:0 "@tv_ceremony_harmony!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_140:0 "#Y 진행 중#! — #high 성문이 다시 봉헌되었습니다#!\n#F 사제, 이맘, 랍비 모두가 고대 성문을 축복하도록 초대되었습니다. 이는 도시의 많은 신앙을 하나의 공통체로 묶기 위한 연약하지만 의도적인 몸짓입니다. 평화.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_140:0 "#G 완료#! — #high 성문이 다시 봉헌되었습니다#!\n#F 사제, 이맘, 랍비 모두가 차례로 고대 성문을 축복하도록 초대되었습니다. 이는 도시의 많은 신앙을 하나의 공통체로 묶기 위한 연약하지만 의도적인 몸짓입니다. 평화.#!"
 TV_WONDER_CEREMONY_S3_TITLE_140:0 "[tv_wonder_ceremony|E]: 성문이 다시 봉헌되었습니다"
 TV_WONDER_CEREMONY_S3_DESC_140:0 "성직자, 이맘, 랍비 모두가 차례로 고대 문을 축복하도록 초대됩니다. 이는 도시의 많은 신앙을 하나의 공통된 평화로 묶기 위한 연약하지만 의도적인 행위입니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_140:0 "오래된 돌이 새롭게 봉헌되면서 사제, 이맘, 랍비는 각 문을 차례로 축복합니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_140:0 "아직은 아닙니다!"
 TV_WONDER_CEREMONY_CARD_ICON_S4_140:0 "@tv_ceremony_holy_site!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_140:0 "#Y 진행 중#! — #high 신성한 구역 위로 비계가 솟아오릅니다#!\n#F 메이슨들은 신성한 구역의 낡은 돌을 따라 비계를 세웠고 오랫동안 지체되었던 예루살렘 성벽의 수리는 마침내 왕족이 아닌 가시적인 작업이 되었습니다. 약속.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_140:0 "#G 완료#! — #high 신성한 구역 위로 비계가 솟아오릅니다#!\n#F 메이슨들은 신성한 구역의 낡은 돌을 따라 비계를 세웠고 오랫동안 지체되었던 예루살렘 성벽의 수리는 마침내 왕실이 아닌 눈에 보이는 작업이 되었습니다. 약속.#!"
 TV_WONDER_CEREMONY_S4_TITLE_140:0 "[tv_wonder_ceremony|E]: 신성한 구역 위로 비계가 솟아오릅니다."
 TV_WONDER_CEREMONY_S4_DESC_140:0 "석공들은 신성한 구역의 낡은 돌을 따라 비계를 세우고, 오랫동안 미뤄왔던 예루살렘의 가장 신성한 성벽의 수리가 마침내 왕의 약속이 아닌 눈에 보이는 작업이 되었습니다.\n\n#weak 예식을 다음 단계로 진행하기 위해 필요한 대가를 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_140:0 "메이슨이 비계를 올리자 오랫동안 약속했던 수리 작업이 마침내 눈에 띄게 모습을 드러냈습니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_140:0 "석공들은 목재를 내려놓고 비계가 잠시 동안 기다리도록 했습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_140:0 "@tv_ceremony_paved_road!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_140:0 "#Y 진행 중#! — #high 행렬 길이 새로 포장되었습니다#!\n#F 수세기에 걸쳐 순례자들이 매끄럽게 닳은 오래된 포장 돌이 들어 올려 도시 성소 사이의 행렬 경로를 따라 재설정됩니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_140:0 "#G 완료#! — #high 행렬 길이 새로 포장되었습니다#!\n#F 수세기에 걸쳐 순례자들이 매끄럽게 닳은 오래된 포장 돌이 들어 올려 도시의 성소 사이의 행렬 경로를 따라 재설정됩니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_140:0 "[tv_wonder_ceremony|E]：행렬 방식이 새롭게 포장되었습니다"
 TV_WONDER_CEREMONY_S5_DESC_140:0 "수세기에 걸쳐 순례자들이 매끄럽게 착용한 오래된 포장 돌은 도시의 성역 사이의 행렬 경로를 따라 들어 올려 재설정됩니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_140:0 "발밑에 새로운 돌이 생겼습니다!"
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_140:0 "파비오는 낡은 돌을 제자리에 두고 지금은 되돌아갑니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_140:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_140:0 "#Y 진행 중#! — #high 성벽은 Stone에 의해 복원되었습니다.#!\n#F 엔지니어들은 약화된 성벽을 재건하고 오래된 돌의 색상과 절단에 주의를 기울여 도시의 고대 모습을 대체하기보다는 수리가 명예롭게 되도록 합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_140:0 "#G 완료#! — #high 성벽은 Stone에 의해 복원되었습니다.#!\n#F 엔지니어들은 약화된 성벽을 재건하고 오래된 돌의 색상과 절단에 주의를 기울여 도시의 고대 모습을 대체하기보다는 수리가 명예롭게 되도록 합니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_140:0 "[tv_wonder_ceremony|E]: 벽은 돌 하나하나 복원됩니다."
 TV_WONDER_CEREMONY_S6_DESC_140:0 "엔지니어들은 약해진 성벽을 재건하고 오래된 돌의 색상과 절단에 주의를 기울여 도시의 고대 모습을 대체하기보다는 수리가 명예롭게 되도록 합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_140:0 "엔지니어들은 각각의 새로운 돌을 오래된 돌과 일치하도록 설정하고, 약해진 벽은 다시 온전하게 솟아납니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_140:0 "아직 이 돌은 아닙니다!"
 TV_WONDER_CEREMONY_CARD_ICON_S7_140:0 "@tv_ceremony_diplomacy!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_140:0 "#Y 진행 중#! — #high A 분기 간 분쟁이 해결되었습니다#!\n#F 공유 신사의 접근권을 둘러싼 다툼으로 인해 주지사가 매 분기를 만족하는 순환 일정을 중개할 때까지 수개월에 걸쳐 신중한 작업이 진행될 위험이 있습니다. 클레임.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_140:0 "#G 완료#! — #high A 분기 간 분쟁이 해결되었습니다#!\n#F 공유 신사의 접근권을 둘러싼 다툼으로 인해 주지사가 매 분기마다 만족하는 순환 일정을 중개할 때까지 몇 달 간의 신중한 작업이 풀리지 않을 위험이 있습니다. 클레임.#!"
 TV_WONDER_CEREMONY_S7_TITLE_140:0 "[tv_wonder_ceremony|E]：분기 간 분쟁이 해결되었습니다"
 TV_WONDER_CEREMONY_S7_DESC_140:0 "공유 신사의 접근권에 대한 다툼으로 인해 주지사가 매 분기의 요구 사항을 충족하는 순환 일정을 중개할 때까지 몇 달 간의 신중한 작업이 흐트러질 위험이 있습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_140:0 "우리는 순환을 스스로 중개하고 매 분기의 요구가 차례로 존중되도록 합니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_140:0 "주지사는 분쟁을 제쳐두고 숙소를 좀 더 오랫동안 다툼에 맡겼습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_140:0 "@tv_ceremony_religious_unity!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_140:0 "#Y 진행 중#! — #high 거룩한 도시가 새롭게 서다#!\n#F 복원이 완료됨에 따라 종소리, 기도의 부름, 나팔 소리가 옛 성벽을 가로질러 함께 울리고, 왕국의 엄숙한 보호를 받는 도시로서의 예루살렘의 입지는 지속적인 표시가 됩니다 그 규칙의.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_140:0 "#G 완료#! — #high 거룩한 도시가 새롭게 서다#!\n#F 복원이 완료됨에 따라 종소리, 기도의 부름, 나팔 소리가 옛 성벽을 가로질러 함께 울려 퍼지고, 왕국의 엄숙한 보호를 받는 도시로서의 예루살렘의 입지는 지속됩니다. 그 규칙의 표시.#!"
 TV_WONDER_CEREMONY_S8_TITLE_140:0 "[tv_wonder_ceremony|E]:거룩한 도시가 새롭게 서다"
 TV_WONDER_CEREMONY_S8_DESC_140:0 "복원이 완료됨이 선언됨에 따라 종소리, 기도 요청 및 나팔 소리가 오래된 성벽을 가로질러 함께 울리고, 예루살렘이 왕국의 엄숙한 보호를 받는 도시라는 사실은 그 통치의 지속적인 표시가 됩니다.\n\n#weak 예식을 완료하는 데 필요한 대가를 지불하십시오. 그 결과 경이의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_140:0 "거룩한 성이 새롭게 섰도다!"
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_140:0 "전령들은 최종 선언을 보류하고 오래된 성벽이 조금 더 조용히 기다리도록 합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_141:0 "@tv_ceremony_parliament!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_141:0 "#Y 진행 중#! — #high 장로들은 대권에 대한 칙령을 내렸습니다.#!\n#F 모인 추장들과 성직자들은 솔즈베리 평원에 새로운 원의 돌이 솟아올라 그곳에 모이는 모든 부족의 태양이 지는 것을 기념하기로 칙령을 내렸습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_141:0 "#G 완료#! — #high 장로들이 대권을 포고령을 내림#!\n#F 모인 족장들과 성직자들은 모인 모든 부족의 해가 지는 것을 표시하기 위해 솔즈베리 평원에 새로운 원의 돌이 솟아오를 것을 포고합니다. 저기.#!"
 TV_WONDER_CEREMONY_S1_TITLE_141:0 "[tv_wonder_ceremony|E]: 장로들이 대권을 선포하다"
 TV_WONDER_CEREMONY_S1_DESC_141:0 "모인 족장들과 성직자들은 그곳에 모인 모든 부족의 해가 지는 것을 표시하기 위해 솔즈베리 평원에 새로운 원의 입석이 세워질 것이라고 칙령을 내렸습니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우에는 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_141:0 "어른들이 한 말은 시간이 지나면 돌이 된다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_141:0 "나는 징조가 이 서클을 선호할 때까지 기다릴 것입니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_141:0 "@tv_ceremony_building_needs!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_141:0 "#Y 진행 중#! — #high 사르센 돌이 선택되었습니다#!\n#F 스카우트는 원에 맞는 가장 큰 사르센 바위를 표시하기 위해 다운 범위를 정하고, 부딪혔을 때 제공되는 링과 낮은 태양을 잡는 방식에 대해 각각 테스트합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_141:0 "#G 완료#! — #high 사르센 돌이 선택되었습니다#!\n#F 스카우트는 원에 맞는 가장 큰 사르센 바위를 표시하기 위해 다운 범위를 정하고, 부딪혔을 때 제공되는 링과 낮은 태양을 잡는 방식에 대해 각각 테스트합니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_141:0 "[tv_wonder_ceremony|E]:사르센석이 선택되었습니다"
 TV_WONDER_CEREMONY_S2_DESC_141:0 "스카우트들은 원에 맞는 가장 큰 사르센 바위를 표시하기 위해 아래로 순회하며, 부딪힐 때 나오는 반지와 낮은 태양을 받는 방식에 대해 각각 테스트합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 적절한 순간이 아닌 경우 기다립니다.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_141:0 "정찰병들은 각 바위를 공격하고 그 고리에 고개를 끄덕입니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_141:0 "이건 아니야!"
 TV_WONDER_CEREMONY_CARD_ICON_S3_141:0 "@tv_ceremony_ship!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_141:0 "#Y 진행 중#! — #high 청석이 여행을 시작하다#!\n#F 원이 평야 자체 너머에서 돌을 요구하기 때문에 더 작은 청석을 며칠 동안 끌고 떠다녀야 한다는 소문이 먼 친척에게 전송됩니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_141:0 "#G 완료#! — #high 블루스톤의 여정이 시작됩니다#!\n#F 원이 평야 자체 너머에서 돌을 요구하기 때문에 더 작은 블루스톤을 며칠 동안 끌고 떠다녀야 한다는 소문이 먼 친척에게 전송됩니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_141:0 "[tv_wonder_ceremony|E]：블루스톤의 여정이 시작됩니다"
 TV_WONDER_CEREMONY_S3_DESC_141:0 "원이 평원 너머 멀리 있는 돌을 요구하기 때문에 더 작은 청석을 끌고 여러 날 동안 떠다녀야 한다는 소문이 먼 친척에게 전달됩니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_141:0 "멀리 있는 우리 동족에게 전합니다. 푸른 돌을 집으로 가져오십시오."
