 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_204:0 "#G 완료#! — #high Siege의 시험#!\n#F 적군이 미완성 성벽을 테스트하고, 파손이 이루어지고 수리되더라도 수비대는 어느 부분이 성벽이고 어느 부분을 더 강하게 재건해야 하는지 알게 됩니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_204:0 "[tv_wonder_ceremony|E]: 공성전의 시험"
 TV_WONDER_CEREMONY_S6_DESC_204:0 "적군은 미완성된 성벽을 시험하고, 파손이 이루어지고 수리되더라도 수비대는 어느 부분이 더 강력하게 재건되어야 하는지를 알게 됩니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_204:0 "수비대는 벽을 더욱 튼튼하게 건설해야 하는 모든 틈과 표시를 봉쇄합니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_204:0 "수비수들은 라인을 있는 그대로 유지하고 약한 부분은 표시하지 않는 것을 선택합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_204:0 "@tv_ceremony_warning_icon!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_204:0 "#Y 진행 중#! — #high 봉화의 불이 켜졌습니다.#!\n#F 성벽과 그 너머 전초기지를 따라 일련의 감시 사격이 설정되어 있어 트빌리시를 향한 모든 접근은 적군이 쿠라에 도달하기 훨씬 전에 신호를 보낼 수 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_204:0 "#G 완료#! — #high 봉화의 불이 켜졌습니다.#!\n#F 성벽과 그 너머 전초기지를 따라 일련의 감시 사격이 설정되어 있어 트빌리시를 향한 모든 접근은 적군이 쿠라에 도달하기 훨씬 전에 신호를 보낼 수 있습니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_204:0 "[tv_wonder_ceremony|E]: 신호등이 켜졌습니다"
 TV_WONDER_CEREMONY_S7_DESC_204:0 "성벽과 그 너머의 전초기지를 따라 일련의 감시 사격이 설치되어 트빌리시를 향한 모든 접근은 적군이 쿠라에 도달하기 훨씬 전에 신호를 보낼 수 있습니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_204:0 "우리는 스스로 신호등을 켜서 어떤 적도 눈에 띄지 않게 쿠라에 도달하지 못하도록 합니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_204:0 "전초기지들은 여전히 어둡고, 그들의 모닥불은 지금은 꺼져 있습니다."
