 TV_WONDER_CEREMONY_CARD_ICON_S8_186:0 "@tv_ceremony_army_strength!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_186:0 "#Y 진행 중#! — #high 시크(Sich)가 급류 너머에서 자유롭게 서다#!\n#F 키시 오타만이 전체 라다 전에 완성된 시크 위에 호스트의 배너를 들어올려 무료 캠프가 완전하고 왕관이 없을 것이라고 선언합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_186:0 "#G 완료#! — #high 시크는 급류 너머에서 자유롭게 서 있다#!\n#F 키시 오타만은 전체 라다 전에 완성된 시크 위에 호스트의 배너를 들어올려 무료 캠프가 완전하고 왕관이 필요하지 않다고 선언합니다.#!"
 TV_WONDER_CEREMONY_S8_TITLE_186:0 "[tv_wonder_ceremony|E]: 시크(Sich)는 급류 너머에서 자유롭게 서 있습니다."
 TV_WONDER_CEREMONY_S8_DESC_186:0 "키시 오타만(kish otaman)은 전체 라다(rada)가 시작되기 전에 완성된 시크(Sich) 위에 호스트의 깃발을 들어올려 자유 캠프가 완전하고 왕관에 책임이 없다고 선언합니다. 오늘부터 쿠린에서 확립된 규율과 소집된 인력은 헤트마네이트가 현장으로 보내는 모든 호스트를 강화합니다.\n\n#weak 의식을 완료하는 데 필요한 대가를 지불하세요. 결과적으로 불가사의의 최종 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_186:0 "나는 완성된 시크 위에 우리의 깃발을 들어올립니다. 자유롭고 어떤 왕관에도 책임을 지지 않습니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_186:0 "키시 오타만(kish otaman)은 깃발을 지키고, 시크(Sich)는 급류 너머에서 예고 없이 기다립니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_187:0 "@tv_ceremony_government!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_187:0 "#Y 진행 중#! — #high 통치자는 배움의 광장을 선포하다#!\n#F 사마르칸트의 통치자는 오래된 캐러밴 교차로 앞의 모래 광장이 도시의 명성에 걸맞는 레기스탄이 될 것이라고 선언합니다. 헤라트에서 델리까지.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_187:0 "#G 완료#! — #high 통치자는 배움의 광장을 선포하다#!\n#F 사마르칸트의 통치자는 오래된 캐러밴 교차로 앞의 모래 광장이 도시의 명성에 걸맞는 레기스탄이 될 것이라고 법령을 내렸습니다. 헤라트에서 델리까지.#!"
 TV_WONDER_CEREMONY_S1_TITLE_187:0 "[tv_wonder_ceremony|E]: 통치자가 배움의 광장을 정하다"
 TV_WONDER_CEREMONY_S1_DESC_187:0 "사마르칸트의 통치자는 오래된 캐러밴 교차로 앞의 모래 광장이 도시의 명성에 걸맞은 레기스탄이 될 것이며, 마드라사로 둘러싸여 헤라트에서 델리까지 어떤 궁정보다 더 빛날 것이라고 법령을 내렸습니다. 천문학자, 타일 마스터, 고관이 소환되어 화려한 행사를 계획합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_187:0 "우리는 이 교차로가 배움의 정원으로 다시 태어나도록 명합니다."
