 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_199:0 "#Y 진행 중#! — #high 파수꾼들이 성벽 사이에 자리를 잡습니다.#!\n#F 마지막 돌이 치장되기도 전에 무장한 파수꾼들이 두 고리 사이의 목록에 자리를 잡고 새로운 요새의 시야를 테스트합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_199:0 "#G 완료#! — #high 파수꾼이 벽 사이에 자리를 잡습니다.#!\n#F 마지막 돌이 치장되기도 전에 무장한 파수꾼이 두 고리 사이의 목록에 자리를 잡고 새로운 요새의 시야를 테스트합니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_199:0 "[tv_wonder_ceremony|E]: 감시자들이 벽 사이에 초소를 세우다"
 TV_WONDER_CEREMONY_S7_DESC_199:0 "무장한 감시자들은 마지막 돌이 치장되기도 전에 두 고리 사이의 목록에 자리를 잡고 새로운 요새의 시야를 테스트합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
