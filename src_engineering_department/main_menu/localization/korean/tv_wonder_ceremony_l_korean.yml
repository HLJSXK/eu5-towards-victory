 TV_WONDER_CEREMONY_CARD_ICON_S1_105:0 "@tv_ceremony_ruler!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_105:0 "#Y 진행 중#! — #high 5대 다섯째 이름은 마르포 리#!\n#F 5대 달라이 라마는 궁궐 수도원이 라사 위의 붉은 언덕인 마르포 리를 왕위에 올려 왕좌와 수도원을 한 지붕 아래 통합할 것이라고 선언합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_105:0 "#G 완료#! — #high 5대 다섯째 이름은 마르포 리#!\n#F 5대 달라이 라마는 궁전 수도원이 라사 위의 붉은 언덕인 마르포 리를 왕위에 올려 왕좌와 수도원을 하나로 통합할 것이라고 선언합니다. 지붕.#!"
 TV_WONDER_CEREMONY_S1_TITLE_105:0 "[tv_wonder_ceremony|E]: 5대 인물이 마르포리를 명명하다"
 TV_WONDER_CEREMONY_S1_DESC_105:0 "5대 달라이 라마는 궁궐 겸 수도원이 라사 위의 붉은 언덕인 마르포리(Marpo Ri)를 왕관으로 삼고 왕좌와 수도원을 한 지붕 아래 통합할 것이라고 선언합니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_105:0 "법을 보호하는 왕좌는 결코 무너지지 않습니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_105:0 "나는 아직 이 언덕을 신성하다고 말할 엄두가 나지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_105:0 "@tv_ceremony_holy_site!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_105:0 "#Y 진행 중#! — #high 오래된 유적지에서 의식이 거행됩니다#!\n#F 승려들은 송첸감포 고대 요새의 무너진 성벽 사이에서 의식을 거행합니다. 그 돌은 천 년 동안 이 언덕을 덮고 앞으로 무엇이 일어날지에 대한 축복을 구합니다. it.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_105:0 "#G 완료#! — #high Rites는 오래된 유적에서 거행됩니다#!\n#F 승려들은 송첸감포의 고대 요새의 무너진 성벽 사이에서 의식을 거행합니다. 그 돌은 천년 동안 이 언덕을 덮고 앞으로 무엇이 일어날지 축복을 구합니다. it.#!"
 TV_WONDER_CEREMONY_S2_TITLE_105:0 "[tv_wonder_ceremony|E]: 오래된 유적에서 의식이 거행됩니다"
 TV_WONDER_CEREMONY_S2_DESC_105:0 "승려들은 천년 동안 이 언덕을 덮고 있는 돌이 있는 송첸감포 고대 요새의 허물어진 성벽에서 의식을 거행하며, 그 위에 솟아오를 것에 대한 축복을 구합니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우에는 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_105:0 "승려들은 폐허가 된 돌들 사이에서 의식을 마친다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_105:0 "아직은 아닙니다. 폐허를 좀 더 쉬게 해주세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S3_105:0 "@tv_ceremony_supply!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_105:0 "#Y 진행 중#! — #high 목재와 흙 경사면 오르기#!\n#F 쌓인 흙과 돌은 계곡 바닥에서 지그재그 길로 끌어 올려지고, 낮은 숲에서 자른 목재는 노새 열차를 타고 정상까지 운반됩니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_105:0 "#G 완료#! — #high 목재와 흙 경사면 오르기#!\n#F 쌓인 흙과 돌은 계곡 바닥에서 지그재그 경로로 운반되고, 낮은 숲에서 자른 목재는 노새 열차를 통해 정상까지 운반됩니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_105:0 "[tv_wonder_ceremony|E]：목재와 흙이 비탈을 오르다"
 TV_WONDER_CEREMONY_S3_DESC_105:0 "다진 흙과 돌은 계곡 바닥에서 지그재그 길로 끌어 올려지고 낮은 숲에서 자른 목재는 노새 열차에 의해 정상까지 운반됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_105:0 "우리는 노새 열차를 타고 산길을 올라갑니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_105:0 "노새 열차는 아래 계곡에서 유휴 상태로 남아 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_105:0 "@tv_ceremony_city_capital!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_105:0 "#Y 진행 중#! — #high 백궁 기초가 놓였습니다#!\n#F 인력이 백궁의 첫 번째 테라스 착공을 시작하고 언덕은 헐벗은 요새 폐허에서 솟아오르는 궁전 벽으로 천천히 변화하기 시작합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_105:0 "#G 완료#! — #high 백궁 기초가 놓였습니다#!\n#F 노동자들이 백궁의 첫 번째 테라스 착공을 시작하고 언덕은 헐벗은 요새 폐허에서 솟아오르는 궁전 벽으로 천천히 변화하기 시작합니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_105:0 "[tv_wonder_ceremony|E]：백궁 기초가 놓였습니다"
 TV_WONDER_CEREMONY_S4_DESC_105:0 "인부들이 백궁의 첫 번째 테라스 공사를 착공하고 언덕은 헐벗은 요새 폐허에서 솟아오르는 궁전 벽으로 천천히 변모하기 시작합니다.\n\n#weak 식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_105:0 "산도 첫 번째 돌이 만들어낸 모양을 갖고 있습니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_105:0 "나는 이 기반을 깨뜨릴 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_105:0 "@tv_ceremony_building_levels!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_105:0 "#Y 진행 중#! — #high 테라스 위의 테라스, 백궁이 오르다#!\n#F 백궁은 언덕 위로 층층이 솟아오르고, 백색 도료 벽은 정상 자체가 그 아래로 사라질 때까지 바위의 윤곽을 따라갑니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_105:0 "#G 완료#! — #high Terrace Upon Terrace, the White Palace Climbs#!\n#F 백궁은 언덕 위로 층층이 솟아오르고, 백색 도료 벽은 정상 자체가 그 아래로 사라질 때까지 바위의 윤곽을 따라갑니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_105:0 "[tv_wonder_ceremony|E]：테라스 위 테라스, 백궁이 오르다"
 TV_WONDER_CEREMONY_S5_DESC_105:0 "백궁은 언덕 위로 층층이 솟아 있으며, 정상 자체가 그 아래로 사라질 때까지 바위의 윤곽을 따라 흰색 칠한 벽이 있습니다.\n\n#weak 식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_105:0 "메이슨은 해가 지기 전에 또 다른 백색 도료 층을 올립니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_105:0 "서둘러 세운 궁전은 그 기초를 잊어버립니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_105:0 "@tv_ceremony_death!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_105:0 "#Y 진행 중#! — #high 붉은 궁전이 은밀한 애도 속에 솟아오르다#!\n#F 대5세가 궁전이 완공되기 전에 죽자, 그의 섭정 데시 상예 갸초(Desi Sangye Gyatso)는 죽음을 숨기고 압박하며 마치 달라이 라마가 아직 있는 것처럼 진홍빛 붉은 궁전을 일으킵니다. 기꺼이 그렇게 했습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_105:0 "#G 완료#! — #high 붉은 궁전이 은밀한 애도 속에 솟아오른다#!\n#F 5대 황제가 그의 궁전이 완공되기 전에 죽자, 그의 섭정인 데시 상예 갸초(Desi Sangye Gyatso)는 죽음을 숨기고 계속해서 달라이 라마 자신이 아직 있는 것처럼 진홍빛 붉은 궁전을 일으킵니다. 기꺼이 그렇게 했습니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_105:0 "[tv_wonder_ceremony|E]：홍궁이 은밀한 애도 속에 솟아오른다"
 TV_WONDER_CEREMONY_S6_DESC_105:0 "5대 5세가 궁전이 완공되기 전에 죽자 그의 섭정 데시 상예 가초(Desi Sangye Gyatso)는 죽음을 숨기고 압박을 가하며 마치 달라이 라마 자신이 여전히 원하는 것처럼 진홍색 붉은 궁전을 들어올립니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 대가를 지불하거나 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_105:0 "붉은 궁전이 완성될 때까지 나는 이 비밀을 지키겠습니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_105:0 "섭정은 이 속임수의 무게를 견디는 것을 주저합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_105:0 "@tv_ceremony_art_work!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_105:0 "#Y 진행 중#! — #high 황금 사리탑과 벽화가 홀을 가득 채웁니다#!\n#F 홍궁 예배당 내에 금박을 입힌 성물 사리탑이 설치되어 있으며 화가들은 과거 화신과 수호자의 벽화로 복도를 덮습니다. 신들.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_105:0 "#G 완료#! — #high 황금 사리탑과 벽화가 홀을 가득 채웁니다#!\n#F 홍궁 예배당 내에 금박을 입힌 성물 사리탑이 설치되어 있으며 화가들은 과거 화신과 보호자의 벽화로 복도를 덮습니다. 신들.#!"
 TV_WONDER_CEREMONY_S7_TITLE_105:0 "[tv_wonder_ceremony|E]:홀을 가득 채운 황금 사리탑과 벽화"
 TV_WONDER_CEREMONY_S7_DESC_105:0 "붉은 궁전의 예배당 안에 금박을 입힌 성물 사리탑이 설치되어 있으며 화가들은 과거의 화신과 수호신의 벽화로 복도를 덮고 있습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_105:0 "홀에 주어진 금은 충실한 자에게 빛으로 돌아옵니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_105:0 "나는 아직 이 벽화를 위해 금을 아끼지 못했습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_105:0 "@tv_ceremony_religious_influence!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_105:0 "#Y 진행 중#! — #high 완성된 궁전 위에 현수막이 솟아오른다#!\n#F 궁전-수도원이 전체적으로 봉헌되면서 승려들이 구불구불한 계단을 따라 배너를 들고 진행하며 순례자와 경건한 신자들 모두에 대한 축복은 언덕이 있는 한 지속된다고 선언됩니다 그 자체.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_105:0 "#G Completed#! — #high 완성된 궁전 위로 배너가 솟아오른다#!\n#F 궁전-수도원이 완전히 봉헌됨에 따라 구불구불한 계단을 따라 승려들이 배너를 들고 진행하며, 순례자와 경건한 신자들 모두에 대한 축복은 언덕이 있는 한 지속된다고 선언됩니다. 그 자체.#!"
 TV_WONDER_CEREMONY_S8_TITLE_105:0 "[tv_wonder_ceremony|E]：완성된 궁전 위로 현수막이 펄럭인다"
 TV_WONDER_CEREMONY_S8_DESC_105:0 "궁전-수도원 전체가 봉헌됨에 따라 승려들은 구불구불한 계단을 따라 배너를 들고 행진하며 순례자와 경건한 신자들 모두에 대한 축복은 언덕 자체가 지속되는 한 지속된다고 선언됩니다.\n\n#weak 의식을 완료하는 데 필요한 가격을 지불하십시오. 결과적으로 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_105:0 "봉헌이 완료되면 승려들은 깃발을 듭니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_105:0 "너무 빨리 말한 축복은 듣기도 전에 사라져 버립니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_106:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_106:0 "#Y 진행 중#! — #high 술탄의 이름은 라 사비카 언덕#!\n#F 나스리드 술탄은 붉은 벽으로 둘러싸인 궁전 도시가 그라나다 위의 라 사비카 언덕에 세워질 것이라고 발표했습니다. 비슷합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_106:0 "#G 완료#! — #high 술탄의 이름은 라 사비카 언덕#!\n#F 나스리드 술탄은 붉은 벽으로 둘러싸인 궁전 도시가 그라나다 위의 라 사비카 언덕에 세워질 것이라고 발표했습니다. 비슷합니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_106:0 "[tv_wonder_ceremony|E]：술탄이 라 사비카 언덕을 명명하다"
 TV_WONDER_CEREMONY_S1_DESC_106:0 "나스리드 술탄은 붉은 벽으로 둘러싸인 궁전 도시가 그라나다 위의 라 사비카 언덕에 세워질 것이라고 발표합니다. 이곳은 왕과 사절 모두를 수용하기에 적합한 자리입니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_106:0 "술탄은 La Sabika 언덕의 법령에 인장을 찍었습니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_106:0 "급히 세운 왕좌는 돌이 아닌 모래 위에 얹혀 있다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_106:0 "@tv_ceremony_writer!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_106:0 "#Y 진행 중#! — #high 시인과 서기관이 법정에 소환됩니다#!\n#F 궁중 시인과 서예가가 소환되어 돌 하나를 놓기 전에 벽에 쓸 시를 계획하고 측량사는 성벽을 따라 성곽을 표시합니다. 능선.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_106:0 "#G 완료#! — #high 시인과 서기관이 법정에 소환됩니다#!\n#F 궁중 시인과 서예가가 소환되어 돌 하나를 놓기 전에 성벽에 대한 시를 계획하고 측량사는 성곽을 따라 성곽을 표시합니다. 능선.#!"
 TV_WONDER_CEREMONY_S2_TITLE_106:0 "[tv_wonder_ceremony|E]：시인과 서기관이 법정에 소환됩니다"
 TV_WONDER_CEREMONY_S2_DESC_106:0 "돌 하나를 놓기 전에 궁중 시인과 서예가가 소환되어 성벽에 시를 짓고 측량사는 능선을 따라 성곽 경계를 표시합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_106:0 "우리는 첫 번째 돌이 놓이기 전에 이 벽에 목소리를 내기 위해 시인들을 소환합니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_106:0 "시인들은 펜을 내려놓고 나중의 부름을 기다립니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_106:0 "@tv_ceremony_vegetation!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_106:0 "#Y 진행 중#! — #high 적토와 삼나무 도착#!\n#F 현지 황토를 벽돌로 구워 요새의 이름을 지었고, 삼나무 들보와 석회 회반죽은 주변 언덕에서 모았습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_106:0 "#G 완료#! — #high 적토와 삼나무 도착#!\n#F 현지 황토를 벽돌로 구워 요새의 이름을 지었고, 삼나무 들보와 석회 회반죽은 주변 언덕에서 모았습니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_106:0 "[tv_wonder_ceremony|E]：황토와 삼나무 도착"
 TV_WONDER_CEREMONY_S3_DESC_106:0 "현지 붉은 점토를 구워 요새에 이름을 붙일 벽돌을 만들고 주변 언덕에서 삼나무 들보와 석회 회반죽을 수집합니다.\n\n#weak 필요한 가격을 지불하여 의식을 다음 단계로 진행하거나 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_106:0 "삼나무 들보가 언덕에서 끌어내려지는 동안 가마는 붉은 점토를 굽습니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_106:0 "가마에 불이 붙기 전에 이 점토 계절을 좀 더 오래 두겠습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_106:0 "@tv_ceremony_defensive_military_stance!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_106:0 "#Y 진행 중#! — #high 알카사바 성벽이 첫 번째 경로를 밟습니다.#!\n#F 메이슨은 능선을 따라 알카사바 방어벽의 첫 번째 코스를 놓았고, 알람브라에 이름을 붙일 붉은 실루엣이 벽을 배경으로 떠오르기 시작합니다. 하늘.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_106:0 "#G 완료#! — #high 알카사바 성벽이 첫 번째 경로를 밟습니다.#!\n#F 메이슨은 능선을 따라 알카사바 방어벽의 첫 번째 코스를 놓았고, 알람브라에 이름을 부여할 붉은 실루엣이 벽을 배경으로 떠오르기 시작합니다. 하늘.#!"
 TV_WONDER_CEREMONY_S4_TITLE_106:0 "[tv_wonder_ceremony|E]:알카사바 성벽이 첫 번째 경로를 밟습니다."
 TV_WONDER_CEREMONY_S4_DESC_106:0 "석공들은 능선을 따라 알카사바 방어벽의 첫 번째 코스를 놓았고 알람브라에 이름을 부여할 붉은 실루엣이 하늘을 배경으로 솟아오르기 시작했습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_106:0 "메이슨은 능선을 따라 알카사바의 첫 번째 붉은 돌을 세웠습니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_106:0 "석공들은 도구를 낮추고 능선을 잠시 동안 그대로 둡니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_106:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_106:0 "#Y 진행 중#! — #high 코마레스 궁전이 안뜰을 열었습니다.#!\n#F 성벽 너머에 코마레스 궁전은 긴 반사 연못 주위에 모양을 이루고 있으며 홀은 청중과 조용한 변호사를 위해 배열되어 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_106:0 "#G 완료#! — #high 코마레스 궁전이 안뜰을 열었습니다.#!\n#F 성벽 너머에 코마레스 궁전은 긴 반사 연못 주위에 모양을 이루고 있으며 홀은 청중과 조용한 변호사를 위해 배열되어 있습니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_106:0 "[tv_wonder_ceremony|E]:코마레스 궁전이 안뜰을 열다"
 TV_WONDER_CEREMONY_S5_DESC_106:0 "요새 벽 너머에 코마레스 궁전은 길게 반사되는 연못 주위에 모양을 이루고 있으며, 홀은 청중과 조용한 조언자 모두를 위해 배열되어 있습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_106:0 "수영장이 궁전을 반영하게 해주세요!"
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_106:0 "안뜰의 수영장은 비어 있고 홀은 아직 건축되지 않은 상태입니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_106:0 "@tv_ceremony_art_work!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_106:0 "#Y 진행 중#! — #high Muqarnas와 치장 벽토가 사자 뜰을 채우다#!\n#F 장인들이 벌집 모양의 무카르나 금고를 조각하고 새로운 사자 재판소 주변에 치장 벽토 세공으로 벽을 엮습니다. 중앙 분수.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_106:0 "#G 완료#! — #high Muqarnas와 회반죽으로 사자 뜰을 채우다#!\n#F 장인들이 벌집 모양의 무카르나 금고를 조각하고 새로운 사자 뜰 주변에 회반죽 선세세공으로 벽을 엮습니다. 12마리의 대리석 짐승이 이를 지키고 있습니다. 중앙 분수.#!"
 TV_WONDER_CEREMONY_S6_TITLE_106:0 "[tv_wonder_ceremony|E]：무카르나스와 스투코가 라이온스 뜰을 채우다"
 TV_WONDER_CEREMONY_S6_DESC_106:0 "장인들은 벌집 모양의 무카르나 금고를 조각하고 중앙 분수를 보호하기 위해 설정된 12개의 대리석 짐승인 새로운 사자 뜰 주위에 치장 벽토 선조로 벽을 엮습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_106:0 "장인들은 라이온스 뜰 위 치장벽토로 벌집 모양의 금고를 동축으로 만듭니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_106:0 "조각가들이 작업을 시작하기 전에 우리는 사자들이 조금 더 침묵하도록 놔둘 것입니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_106:0 "@tv_ceremony_diplomacy!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_106:0 "#Y 진행 중#! — #high 아치 아래에서 사절을 받다#!\n#F 궁전의 조각된 아치 아래에서 처음으로 외국 사절을 맞이하고, 선물을 교환하면서 술탄을 찬양하는 구절을 큰 소리로 낭독합니다. 안뜰.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_106:0 "#G 완료#! — #high 사절을 아치 아래에서 받다#!\n#F 궁전의 조각된 아치 아래에서 처음으로 외국 사절을 맞이하고, 선물을 교환하면서 술탄을 찬양하는 구절을 큰 소리로 낭독합니다. 안뜰.#!"
 TV_WONDER_CEREMONY_S7_TITLE_106:0 "[tv_wonder_ceremony|E]: 아치 아래에서 사절을 받음"
 TV_WONDER_CEREMONY_S7_DESC_106:0 "궁전의 조각된 아치 아래에서 처음으로 외국 사절을 맞이하고, 안뜰에서 선물을 교환하면서 술탄을 찬양하는 구절을 큰 소리로 낭독합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_106:0 "술탄의 이름을 찬양하는 구절이 있는 조각된 아치 아래로 사절단이 인도됩니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_106:0 "사절단은 궁정이 잠시 준비하는 동안 문 밖에서 기다리고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_106:0 "@tv_ceremony_government_power!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_106:0 "#Y 진행 중#! — #high 궁성 도시가 봉헌되었습니다.#!\n#F 분수가 흐르고 마지막 회반죽 패널이 설치되면서, 궁전 도시는 공식적으로 법원 앞에 봉헌되었으며 성벽은 조약의 자리와 깨지지 않는 왕권을 선언했습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_106:0 "#G 완료#! — #high 궁성 도시가 봉헌되었습니다#!\n#F 분수가 흐르고 마지막 치장 벽토 패널이 설치되면서 궁전 도시는 공식적으로 법원 앞에 봉헌되었으며, 그 성벽은 조약의 자리와 깨지지 않는 왕권을 선언했습니다.#!"
 TV_WONDER_CEREMONY_S8_TITLE_106:0 "[tv_wonder_ceremony|E]：궁성 봉헌"
 TV_WONDER_CEREMONY_S8_DESC_106:0 "분수가 흐르고 마지막 회반죽 패널이 설치되어 있는 이 궁전 도시는 공식적으로 법원 앞에 봉헌되었으며, 성벽은 조약의 중심지이자 왕권이 깨지지 않음을 선언했습니다.\n\n#weak 의식을 완료하는 데 필요한 가격을 지불하세요. 결과적으로 불가사의의 최종 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_106:0 "마침내 궁전 도시가 완전히 세워졌습니다!"
