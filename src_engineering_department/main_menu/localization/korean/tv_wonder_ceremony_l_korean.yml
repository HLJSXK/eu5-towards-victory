 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_200:0 "#Y 진행 중#! — #high 군함의 개머리판이 형성됩니다.#!\n#F 첫 번째 선체는 해군 장교의 감시 아래 개머리판에서 형태를 갖추며, 갈비뼈는 해안을 따라 구부러진 참나무 숲처럼 솟아오릅니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_200:0 "#G 완료#! — #high 전함의 개머리판 모양 #!\n#F 첫 번째 선체는 해군 장교의 감시 아래 개머리판에 형태를 갖추었고, 갈비뼈는 해안을 따라 구부러진 참나무 숲처럼 솟아올랐습니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_200:0 "[tv_wonder_ceremony|E]: 군함이 주가를 형성합니다"
 TV_WONDER_CEREMONY_S6_DESC_200:0 "첫 번째 선체는 해군 장교의 감시 아래 개머리판에 모양을 갖추며 해안을 따라 구부러진 참나무 숲처럼 갈비뼈가 솟아오릅니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_200:0 "장교의 감시 아래에 있는 개머리판 위로 선체가 솟아오릅니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_200:0 "주식은 비어 있고 갈비뼈는 자르지 않았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_200:0 "@tv_ceremony_build_icon!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_200:0 "#Y 진행 중#! — #high 잡지 및 크레인 무기고 완료#!\n#F 파우더 탄창, 크레인 및 리깅 로프트가 무기고의 작업을 완료하고 항구는 첫 번째 완성된 준비를 시작합니다. 선체.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_200:0 "#G Completed#! — #high 잡지 및 크레인 무기고 완료#!\n#F 파우더 탄창, 크레인 및 리깅 로프트가 무기고 작업을 완료하고 항구는 첫 번째 완성된 장비를 준비하기 시작합니다. 선체.#!"
 TV_WONDER_CEREMONY_S7_TITLE_200:0 "[tv_wonder_ceremony|E]: 탄창과 크레인으로 무기고를 완성하세요"
 TV_WONDER_CEREMONY_S7_DESC_200:0 "화약고, 크레인, 삭구 로프트가 무기고의 작업을 완료하고 항구에서 처음으로 완성된 선체를 준비하기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_200:0 "무기고가 마침내 완전해졌습니다!"
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_200:0 "탄창은 아직 제작되지 않은 상태로 남아 있고 크레인은 유휴 상태입니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_200:0 "@tv_ceremony_cannons!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_200:0 "#Y 진행 중#! — #high Brest 대서양 함대에 무장#!\n#F 무기고가 완성되었다고 선언되자 대포가 길 건너편에서 경례를 하고 브레스트는 대서양 함대를 무장하고 운용할 준비가 되어 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_200:0 "#G Completed#! — #high Brest 대서양 함대에 무장#!\n#F 무기고가 완성되었다고 선언되자 대포가 길 건너편에서 반향을 일으키며 경례하고 브레스트는 대서양 함대를 무장하고 운용할 준비가 되어 있습니다.#!"
 TV_WONDER_CEREMONY_S8_TITLE_200:0 "[tv_wonder_ceremony|E]: 브레스트가 대서양 함대를 무장시키다"
 TV_WONDER_CEREMONY_S8_DESC_200:0 "무기고가 완성되었다고 선언되자 대포 경례 소리가 길가에 울려퍼지고, 브레스트는 대서양의 함대를 무장하고 병력을 배치할 준비가 되어 있습니다.\n\n#weak 행사를 완료하는 데 필요한 가격을 지불하세요. 결과적으로 불가사의의 마지막 건물이 떠오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_200:0 "대포 경례는 무기고가 완성되었음을 선언합니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_200:0 "아직은 아닙니다. 경례를 계속하세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S1_201:0 "@tv_ceremony_policy!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_201:0 "#Y 진행 중#! — #high 치안 판사는 구시가지를 보존하겠다고 맹세합니다#!\n#F 알자스 치안 판사는 콜마르의 목재 골조 숙소가 불에 타거나 방치되지 않도록 살아있는 기념물로 보존하겠다고 맹세합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_201:0 "#G 완료#! — #high 구시가지를 보존하겠다는 치안 판사#!\n#F 알자스 치안 판사는 콜마르의 골조 구역을 불에 타거나 불에 타지 않게 하고 살아있는 기념물로 보존하겠다고 맹세합니다. 방치.#!"
 TV_WONDER_CEREMONY_S1_TITLE_201:0 "[tv_wonder_ceremony|E]: 구시가지를 보존하겠다는 치안 판사의 맹세"
 TV_WONDER_CEREMONY_S1_DESC_201:0 "알자스 치안 판사는 콜마르의 목조 골조 구역이 불에 타거나 방치되지 않도록 살아있는 기념물로 보존하겠다고 맹세합니다.\n\n#weak 식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_201:0 "치안 판사는 보존 서약에 인장을 찍었습니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_201:0 "광선을 아끼십시오. 아직은 아닙니다!"
 TV_WONDER_CEREMONY_CARD_ICON_S2_201:0 "@tv_ceremony_writer!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_201:0 "#Y 진행 중#! — #high 모든 외관에 대해 길드 기록이 참조됩니다.#!\n#F 빔이 닿기 전에 모든 운하 측 외관의 실제 형태를 확립하기 위해 길드 기록과 오래된 증서가 참조됩니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_201:0 "#G 완료#! — #high 길드 기록은 모든 외관에 대해 참조됩니다.#!\n#F 빔이 닿기 전에 모든 운하 측 외관의 실제 형태를 확립하기 위해 길드 기록과 오래된 증서가 참조됩니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_201:0 "[tv_wonder_ceremony|E]: 길드 기록은 모든 외관에 대해 참조됩니다."
 TV_WONDER_CEREMONY_S2_DESC_201:0 "광선이 닿기 전에 길드 기록과 오래된 증서를 참고하여 모든 운하 측 정면의 실제 형태를 확립합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_201:0 "우리는 광선 하나라도 닿기 전에 모든 길드 행위를 숙고할 것입니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_201:0 "서기는 다른 날을 위해 오래된 증서를 따로 보관했습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_201:0 "@tv_ceremony_building_needs!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_201:0 "#Y 진행 중#! — #high 목재와 석고가 기존 작업에 적합#!\n#F Carpenters 시즌에서는 목재와 혼합 석고를 기존 방식에 맞춰 마을의 골조 뼈를 교체하기보다는 복원할 준비가 되었습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_201:0 "#G 완료#! — #high 목재와 석고가 기존 작업에 적합#!\n#F Carpenters 시즌에서는 목재와 혼합 석고가 기존 공식에 맞춰져 마을의 골조 뼈를 교체하기보다는 복원할 준비가 되었습니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_201:0 "[tv_wonder_ceremony|E]：목재와 석고가 오래된 작품과 일치합니다"
 TV_WONDER_CEREMONY_S3_DESC_201:0 "목수들은 목재를 일치시키고 석고를 기존 공식에 혼합하여 마을의 골조 뼈를 교체하기보다는 복원할 준비가 되어 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_201:0 "새 벽을 세우는 것보다 오래된 기둥을 고치는 것이 낫습니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_201:0 "우리는 아직 새 석고를 오래된 뼈에 맡길 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_201:0 "@tv_ceremony_building_default!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_201:0 "#Y 진행 중#! — #high 운하 주택을 따라 세워진 비계#!\n#F 첫 번째 운하 옆 주택을 따라 비계가 올라가고 콜마르에서 가장 오래된 들보와 박공 건물에 대한 세심한 복원 작업이 실제로 시작됩니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_201:0 "#G 완료#! — #high 운하 주택을 따라 세워진 비계#!\n#F 첫 번째 운하 쪽 주택을 따라 비계가 올라가고 콜마르에서 가장 오래된 들보와 박공에서 세심한 복원 작업이 실제로 시작됩니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_201:0 "[tv_wonder_ceremony|E]：운하 주택을 따라 비계가 솟아오릅니다."
 TV_WONDER_CEREMONY_S4_DESC_201:0 "운하 옆 첫 번째 주택을 따라 비계가 올라가고 콜마르의 가장 오래된 들보와 박공에서 세심한 복원 작업이 시작됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_201:0 "실제 작업이 시작되면서 비계가 운하 주택 위로 올라갑니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_201:0 "이 집은 아닙니다. 아직은 아닙니다!"
 TV_WONDER_CEREMONY_CARD_ICON_S5_201:0 "@tv_ceremony_market!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_201:0 "#Y 진행 중#! — #high 길드 간판을 청소하고 다시 걸었습니다.#!\n#F 빛 바랜 길드 간판을 청소하여 시장 광장 위에 다시 걸고, 와인 상인의 저장고를 복원된 외관 아래에 받쳐 놓았습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_201:0 "#G 완료#! — #high 길드 간판을 청소하고 다시 걸었습니다.#!\n#F 빛 바랜 길드 간판을 청소하여 시장 광장 위에 다시 걸고, 와인 상인의 저장고를 복원된 외관 아래에 받쳐 놓았습니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_201:0 "[tv_wonder_ceremony|E]：길드 간판을 청소하고 다시 걸었습니다."
 TV_WONDER_CEREMONY_S5_DESC_201:0 "빛바랜 길드 간판을 청소하여 시장 광장 위에 다시 걸고, 와인 상인의 저장고를 복원된 건물 정면 아래에 세워두었습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_201:0 "우리는 시장 광장 위에 길드 간판을 새로 걸어 놓습니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_201:0 "오래된 간판은 한동안 먼지로 덮여 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_201:0 "@tv_ceremony_lock!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_201:0 "#Y 진행 중#! — #high 요새 성문이 감시를 회복하다#!\n#F 오래된 요새 성문이 다시 뾰족해지고 목재 문이 다시 걸려 마을의 중세 전성기 시절의 실루엣을 되찾았습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_201:0 "#G 완료#! — #high 요새 성문이 감시를 되찾다#!\n#F 오래된 요새 성문이 다시 뾰족해지고 목재 문이 다시 걸려 마을의 중세 전성기 시절의 실루엣을 되찾았습니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_201:0 "[tv_wonder_ceremony|E]: 강화된 관문이 다시 감시를 받습니다."
 TV_WONDER_CEREMONY_S6_DESC_201:0 "오래된 요새화된 문은 다시 뾰족해지고 목재 문은 다시 걸려 마을의 중세 전성기 시절의 실루엣을 되찾았습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_201:0 "지켜보지 않는 문은 방어되지 않는 마을이다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_201:0 "우리는 아직 오래된 문을 감히 시험해 볼 수 없습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_201:0 "@tv_ceremony_painter!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_201:0 "#Y 진행 중#! — #high 페인터가 건물 외관의 색상을 복원합니다.#!\n#F 페인터가 목재 골조 건물의 밝은 황토색과 파란색을 복원하고 마지막 비계가 무너지기 전에 운하 구역이 방문객을 끌어 모읍니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_201:0 "#G Completed#! — #high Painters가 외관의 색상을 복원합니다.#!\n#F Painters는 목재 골조 외관의 밝은 황토색과 파란색을 복원하고, 운하 구역은 마지막 비계가 무너지기 전에 방문객을 끌어들입니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_201:0 "[tv_wonder_ceremony|E]：화가들이 외관의 색상을 복원합니다."
 TV_WONDER_CEREMONY_S7_DESC_201:0 "화가들은 목재 골조 건물의 밝은 황토색과 파란색을 복원하고 운하 구역은 마지막 비계가 내려지기 전에 방문객의 발길을 끌고 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_201:0 "화가들은 오래된 건물 정면 전체에 신선한 황토색과 파란색을 칠합니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_201:0 "인내심보다 색상이 더 빨리 퇴색됩니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_201:0 "@tv_ceremony_cultural_tradition!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_201:0 "#Y 진행 중#! — #high 살아있는 유산으로 우뚝 선 콜마르의 구시가지#!\n#F 마지막 박공에서 비계가 치워지고 콜마르의 구시가지는 왕의 보살핌을 잘 반영하는 살아있는 유산으로 보존되어 있다 lands.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_201:0 "#G 완료#! — #high 콜마르의 구시가지는 살아있는 유산으로 우뚝 서 있습니다#!\n#F 비계는 마지막 박공에서 제거되었으며 콜마르의 구시가지는 왕의 보살핌을 잘 반영하는 살아있는 유산으로 보존되어 있습니다. lands.#!"
 TV_WONDER_CEREMONY_S8_TITLE_201:0 "[tv_wonder_ceremony|E]：콜마르의 구시가지는 살아있는 유산으로 서 있습니다"
 TV_WONDER_CEREMONY_S8_DESC_201:0 "마지막 박공에서 비계가 제거되고 콜마르의 구시가지는 왕족의 땅 관리를 잘 반영하는 살아있는 유산으로 보존됩니다.\n\n#weak 식을 완료하는 데 필요한 가격을 지불하세요. 결과적으로 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_201:0 "우리는 우리를 뒤따르는 모든 사람들을 위해 보존된 콜마르의 구시가지를 선언합니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_201:0 "비계는 마지막 박공 위에 조금 더 길게 남아 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_202:0 "@tv_ceremony_government!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_202:0 "#Y 진행 중#! — #high 칼리프의 지혜에 대한 칙령#!\n#F 칼리프가 그리스, 시리아, 페르시아, 아랍 학문이 모이는 곳에 집을 짓도록 명령했다는 소문이 바그다드 시장에 퍼지고 있으며, 모든 곳의 학자들이 소개.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_202:0 "#G 완료#! — #high 지혜를 위한 칼리프의 칙령#!\n#F 칼리프가 그리스, 시리아, 페르시아, 아랍어 학문이 모이는 곳에 집을 짓도록 명령했다는 소문이 바그다드 시장에 퍼지고 학자들은 어디에서나 편지 초안 작성을 시작합니다. 소개.#!"
 TV_WONDER_CEREMONY_S1_TITLE_202:0 "[tv_wonder_ceremony|E]：지혜에 대한 칼리프의 칙령"
 TV_WONDER_CEREMONY_S1_DESC_202:0 "바그다드 시장에는 칼리프가 그리스, 시리아, 페르시아, 아랍 학문이 만날 장소를 건립하라고 명령했다는 소문이 돌고 있으며, 곳곳의 학자들이 소개서 초안 작성을 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_202:0 "우리는 법령에 서명하고 학식 있는 세계를 바그다드로 소환합니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_202:0 "칼리프의 서기관들은 지금은 그 법령을 제쳐두었습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_202:0 "@tv_ceremony_characters!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_202:0 "#Y 진행 중#! — #high 학자 소환에 응답#!\n#F 곤데샤푸르, 하란 및 그 너머의 번역가, 천문학자, 의사들이 봉급과 왕실의 약속에 이끌려 원형 도시에 도착합니다. 후원.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_202:0 "#G 완료#! — #high 학자 소환에 응답#!\n#F Gondeshapur, Harran 및 그 너머의 번역가, 천문학자 및 의사가 봉급과 왕실의 약속에 이끌려 원형 도시에 도착합니다. 후원.#!"
 TV_WONDER_CEREMONY_S2_TITLE_202:0 "[tv_wonder_ceremony|E]: 소환장에 답하는 학자들"
 TV_WONDER_CEREMONY_S2_DESC_202:0 "곤데샤푸르(Gondeshapur), 하란(Harran) 및 그 외 지역에서 온 번역가, 천문학자, 의사들이 봉급과 왕실 후원의 약속에 이끌려 원형 도시에 도착합니다.\n\n#weak 예식을 다음 단계로 진행하는 데 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_202:0 "봉급이 지급되고, 첫 번째 학자들이 둥근 도시의 문을 통과합니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_202:0 "우리는 아직 이 학자들에게 보물을 공개할 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_202:0 "@tv_ceremony_literacy!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_202:0 "#Y 진행 중#! — #high 원고 보관소#!\n#F 캐러밴과 대사관은 구매, 복사 또는 공물로 청구된 그리스 및 페르시아 코덱스 상자를 가져오며 첫 번째 선반은 이를 받을 준비가 되어 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_202:0 "#G 완료#! — #high 원고 보관소#!\n#F 캐러밴과 대사관은 구매, 복사 또는 공물로 청구된 그리스 및 페르시아 코덱스 상자를 가져오며 첫 번째 선반은 이를 받을 준비가 되어 있습니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_202:0 "[tv_wonder_ceremony|E]: 원고의 보고"
 TV_WONDER_CEREMONY_S3_DESC_202:0 "캐러밴과 대사관은 구매, 복사 또는 공물로 청구된 그리스 및 페르시아 코덱스가 담긴 상자를 가져오며, 첫 번째 선반은 이를 받을 준비가 되어 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_202:0 "캐러밴은 코덱스 상자를 차례로 대기 선반에 내립니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_202:0 "캐러밴은 뒤로 돌아가고 선반은 한동안 비어 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_202:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_202:0 "#Y 진행 중#! — #high 티그리스의 기초#!\n#F 메이슨은 강둑에 번역 홀의 첫 번째 코스를 놓았고, 서기관과 고관의 흩어져 있는 계획은 마침내 벽과 안뜰의 형태를 취했습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_202:0 "#G 완료#! — #high 티그리스의 재단#!\n#F 메이슨은 강둑에 번역 홀의 첫 번째 코스를 놓았고 서기관과 고관의 흩어져 있는 계획은 마침내 벽과 안뜰의 형태를 취했습니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_202:0 "[tv_wonder_ceremony|E]：티그리스 재단"
 TV_WONDER_CEREMONY_S4_DESC_202:0 "메이슨은 강둑에 번역 홀의 첫 번째 코스를 놓았고 서기관과 고관의 흩어져 있던 계획은 마침내 벽과 안뜰의 형태를 취했습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_202:0 "드디어 기초가 솟아오르다!"
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_202:0 "석공들이 도구를 내려놓고 현장은 조용해졌습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_202:0 "@tv_ceremony_languages!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_202:0 "#Y 진행 중#! — #high 번역가 워크숍#!\n#F 긴 테이블은 유클리드, 프톨레마이오스, 갈레노스를 아랍어로 번역하는 잉크 얼룩진 학자들로 가득 차 있으며, 그 말이 사실이 될 때까지 몇 주 동안 한 단어에 대해 논쟁을 벌입니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_202:0 "#G 완료#! — #high 번역가 워크숍#!\n#F 긴 테이블은 유클리드, 프톨레마이오스, 갈레노스를 아랍어로 렌더링하는 잉크 얼룩진 학자들로 가득 차 있으며, 그 의미가 사실이 될 때까지 몇 주 동안 한 단어에 대해 논쟁을 벌입니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_202:0 "[tv_wonder_ceremony|E]：번역가들의 워크숍"
 TV_WONDER_CEREMONY_S5_DESC_202:0 "긴 테이블은 유클리드, 프톨레마이오스, 갈레노스를 아랍어로 번역하는 잉크로 얼룩진 학자들로 가득 차 있으며, 그 의미가 사실이 될 때까지 몇 주 동안 한 단어에 대해 논쟁을 벌이고 있습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_202:0 "번역자들은 가장 진실한 아랍어 단어를 찾기 위해 다시 한 번 유클리드에 대해 구부립니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_202:0 "우리는 번역자들이 좀 더 오랫동안 논쟁하도록 놔두는 편이 낫습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_202:0 "@tv_ceremony_advance!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_202:0 "#Y 진행 중#! — #high 스카이의 장비#!\n#F 천문학자들은 안뜰에 아스트롤라보와 사분면을 올려 언젠가 바그다드 너머 멀리 선박과 달력을 안내할 별표를 작성합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_202:0 "#G 완료#! — #high 스카이#!\n#F 의 악기는 안뜰에 아스트롤라베와 사분면을 올려 언젠가 바그다드를 훨씬 넘어선 배와 달력을 안내할 별표를 작성합니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_202:0 "[tv_wonder_ceremony|E]:하늘의 도구"
 TV_WONDER_CEREMONY_S6_DESC_202:0 "천문학자들은 안뜰에 아스트롤라베와 사분면을 세우고 언젠가 바그다드 너머의 선박과 달력을 안내할 별표를 작성합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_202:0 "천문학자들은 아스트롤라베를 하늘로 들어올리고 별을 그리기 시작합니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_202:0 "악기는 상자에 넣어져 있고 안뜰 하늘은 측정할 수 없습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_202:0 "@tv_ceremony_writer!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_202:0 "#Y 진행 중#! — #high 카피스트들의 긴 밤#!\n#F 필사자들의 줄이 촛불 위에 몸을 구부리고 완성된 번역을 늘려 지방 도서관과 순회 판사들이 지혜의 집의 일부를 집으로 가져갈 수 있도록 합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_202:0 "#G 완성#! — #high 카피스트들의 긴 밤#!\n#F 필사자들의 줄이 촛불 위에 몸을 구부리고 완성된 모든 번역을 배가시켜 지방 도서관과 순회 판사들이 지혜의 집의 일부를 집으로 가져갈 수 있도록 합니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_202:0 "[tv_wonder_ceremony|E]：카피스트들의 긴 밤"
 TV_WONDER_CEREMONY_S7_DESC_202:0 "필사자들의 줄이 촛불 위에 몸을 굽혀 완성된 모든 번역을 늘려 지방 도서관과 순회 심사위원들이 지혜의 집의 일부를 집으로 가져갈 수 있도록 합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_202:0 "밤새도록 촛불을 켜십시오!"
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_202:0 "복사가들은 페이지가 끝나기도 전에 촛불을 끕니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_202:0 "@tv_ceremony_building_open!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_202:0 "#Y 진행 중#! — #high 지혜의 집이 문을 열다#!\n#F 홀은 티그리스 강을 따라 완전하게 서 있고, 선반은 가득 차고 안뜰은 토론으로 분주합니다. 오늘부터 왕국의 학자와 필사자는 바그다드의 그늘 아래에서 일합니다. 세계의 도서관.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_202:0 "#G 완료#! — #high 지혜의 집이 문을 열다#!\n#F 홀은 티그리스 강을 따라 완벽하게 서 있고, 선반은 가득 차고 안뜰은 토론으로 분주합니다. 오늘부터 왕국의 학자와 필사자는 바그다드의 그늘 아래서 일하고 있습니다. 세계의 나만의 도서관.#!"
 TV_WONDER_CEREMONY_S8_TITLE_202:0 "[tv_wonder_ceremony|E]：지혜의 집이 문을 열다"
 TV_WONDER_CEREMONY_S8_DESC_202:0 "홀은 티그리스 강을 따라 완전하게 서 있고, 선반은 가득 차고 안뜰은 논쟁으로 분주합니다. 오늘부터 이 왕국의 학자와 필사자는 바그다드의 세계 도서관의 그늘 아래에서 일합니다.\n\n#weak 행사를 완료하는 데 필요한 가격을 지불하십시오. 그 결과 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_202:0 "문이 열리고 마침내 지혜의 집이 왕국의 학자들을 맞이합니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_202:0 "아직은 아닙니다!"
 TV_WONDER_CEREMONY_CARD_ICON_S1_203:0 "@tv_ceremony_holy_site!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_203:0 "#Y 진행 중#! — #high 독생자의 비전#!\n#F 계몽자 그레고리는 그리스도가 바가르샤파트에서 금망치로 땅을 치는 환상을 보고하고 왕은 빛이 떨어진 곳에 교회가 일어날 것이라고 선포합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_203:0 "#G 완료#! — #high 독생자의 비전#!\n#F 계몽자 그레고리는 그리스도가 바가르샤파트에서 금망치로 땅을 치는 환상을 보고하고, 왕은 빛이 떨어진 곳에 교회가 일어날 것이라고 선포합니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_203:0 "[tv_wonder_ceremony|E]：독생자의 비전"
 TV_WONDER_CEREMONY_S1_DESC_203:0 "조명자 그레고리(Gregory the Illuminator)는 바가르샤파트(Vagharshapat)에서 황금 망치로 땅을 치는 그리스도의 환상을 보고하고, 왕은 빛이 떨어지는 곳에 교회가 일어날 것이라고 선포합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 적절한 순간이 아닐 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_203:0 "왕은 그레고리의 비전에 귀를 기울이고 교회가 일어날 것이라고 선포합니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_203:0 "비전은 아직 법령이 아닙니다!"
 TV_WONDER_CEREMONY_CARD_ICON_S2_203:0 "@tv_ceremony_ruler!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_203:0 "#Y 진행 중#! — #high Tiridates 땅을 부여#!\n#F King Tiridates III, 새로 개조되어 Vagharshapat의 왕실 땅을 따로 마련하고 현장을 준비하기 위해 아르메니아 전역에서 석공을 소환합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_203:0 "#G 완료#! — #high Tiridates는 땅을 부여합니다#!\n#F King Tiridates III는 새로 개조되어 Vagharshapat의 왕실 땅을 따로 마련하고 현장을 준비하기 위해 아르메니아 전역의 석공을 소환합니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_203:0 "[tv_wonder_ceremony|E]: 티리다테스가 땅을 부여하다"
 TV_WONDER_CEREMONY_S2_DESC_203:0 "새롭게 개종한 티리다테스 3세 왕은 바가르샤파트에 왕궁을 마련하고 아르메니아 전역의 석공들을 불러 현장을 준비합니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_203:0 "우리는 이 근거를 신에게 맡기고 석공들을 불러서 시작합니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_203:0 "법원은 망설이고 왕실 땅은 한동안 표시되지 않은 채로 남아 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_203:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_203:0 "#Y 진행 중#! — #high 돌의 축복#!\n#F 사제들은 고지대 숲에서 잘라낸 기초석과 첫 번째 목재를 축복하고, 순례자들은 이미 거룩한 작품이 완성되는 것을 보기 위해 모이기 시작했습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_203:0 "#G 완료#! — #high 돌의 축복#!\n#F 신부들이 기초석과 고지대 숲에서 잘라낸 첫 번째 목재를 축복하고, 순례자들은 이미 거룩한 작품이 완성되는 것을 보기 위해 모이기 시작했습니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_203:0 "[tv_wonder_ceremony|E]：돌의 축복"
 TV_WONDER_CEREMONY_S3_DESC_203:0 "성직자들은 고지대 숲에서 잘라낸 기초석과 첫 번째 목재를 축복하고, 순례자들은 이미 신성한 작품이 완성되는 모습을 보기 위해 모이기 시작했습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우에는 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_203:0 "이 땅에 축복이 있기를!"
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_203:0 "나는 더 상서로운 날에 이 돌들이 축복받는 것을 보게 될 것입니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_203:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_203:0 "#Y 진행 중#! — #high 첫 번째 성벽 상승#!\n#F 석공들이 바가르샤파트에 있는 십자형 교회의 첫 번째 진로를 세웠고, 기도와 왕실 법령이었던 것이 마침내 발 밑에 회반죽과 돌이 되었습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_203:0 "#G 완료#! — #high 첫 번째 성벽 상승#!\n#F 석공들이 바가르샤파트에 있는 십자형 교회의 첫 번째 진로를 정했고, 기도와 왕실 법령이었던 것이 마침내 발 밑에서 모르타르와 돌이 되었습니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_203:0 "[tv_wonder_ceremony|E]: 첫 번째 벽 상승"
 TV_WONDER_CEREMONY_S4_DESC_203:0 "석공들은 바가르샤파트(Vagharshapat)에 십자형 교회의 첫 번째 진로를 세웠고, 기도와 왕실의 칙령이었던 것이 마침내 회반죽과 돌로 변했습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_203:0 "석공은 십자형 교회의 첫 번째 과정을 마련했습니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_203:0 "아직은 아닙니다. 박격포를 기다리게 하세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S5_203:0 "@tv_ceremony_art_work!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_203:0 "#Y 진행 중#! — #high 카치카르 조각#!\n#F 아르메니아 조각가들은 안뜰 벽을 위해 복잡한 십자형 돌을 깎았습니다. 각각의 카츠카르는 현무암에 얼어붙은 기도문이었고 각각은 이전 석공보다 조금 느렸습니다. it.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_203:0 "#G 완료#! — #high 카치카르 조각#!\n#F 아르메니아 조각가들은 안뜰 벽을 위해 복잡한 십자형 돌을 깎았습니다. 각각의 카츠카르는 현무암에 얼어붙은 기도문이었고 각각은 이전 석공보다 조금 느렸습니다. it.#!"
 TV_WONDER_CEREMONY_S5_TITLE_203:0 "[tv_wonder_ceremony|E]: 카치카르의 조각"
 TV_WONDER_CEREMONY_S5_DESC_203:0 "아르메니아 조각가들은 안뜰 벽을 위해 복잡한 십자형 돌을 깎았습니다. 각각의 카츠카르는 현무암에 얼어붙은 기도이며 각각은 이전 석공보다 약간 느립니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우에는 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_203:0 "나는 조각가들에게 돌 하나하나씩 계속해서 기도하라고 명령합니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_203:0 "조각가들은 끌을 내려놓고 카츠카르들이 기다리도록 하는 데 만족했습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_203:0 "@tv_ceremony_building_levels!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_203:0 "#Y 진행 중#! — #high 종탑이 올라갑니다#!\n#F A 타워는 본당 위로 솟아 아라라트 평야를 가로질러 종을 운반하며, 수도원의 외벽은 점점 늘어나는 승려 공동체를 둘러싸고 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_203:0 "#G 완료#! — #high 종탑이 올라갑니다#!\n#F A 타워는 본당 위로 솟아 아라라트 평야를 가로질러 종을 운반하며 수도원의 외벽은 점점 늘어나는 승려 공동체를 둘러싸고 있습니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_203:0 "[tv_wonder_ceremony|E]: 종탑이 솟아오른다"
 TV_WONDER_CEREMONY_S6_DESC_203:0 "아라라트 평야를 가로질러 종을 운반하기 위해 신도석 위로 탑이 솟아 있고, 수도원의 외벽은 점점 늘어나는 승려 공동체를 둘러싸고 있습니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_203:0 "하나의 종소리가 수천 명의 영혼을 기도로 불러올 수 있습니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_203:0 "우리가 종을 올리기 전에 벽이 더 견고해질 때까지 기다릴 것입니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_203:0 "@tv_ceremony_clergy!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_203:0 "#Y 진행 중#! — #high 천주교가 자리를 잡다#!\n#F 고지 교회는 에치미아진을 천주교의 본거지로 명명하고 먼 지방의 성직자들은 아르메니아의 어머니 교회를 보기 위해 순례길을 여행합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_203:0 "#G 완료#! — #high 천주교가 자리를 잡다#!\n#F 고지대 교회는 에치미아진을 천주교의 본거지로 삼고 먼 지방의 성직자들은 아르메니아의 어머니 교회를 보기 위해 순례길을 여행합니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_203:0 "[tv_wonder_ceremony|E]：가톨릭교가 자리를 잡다"
 TV_WONDER_CEREMONY_S7_DESC_203:0 "고지대 교회는 에치미아진을 카톨릭교의 중심지로 명명하고 먼 지역의 성직자들은 아르메니아의 모교회를 보기 위해 순례길을 여행합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우에는 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_203:0 "고지대 교회는 Etchmiadzin을 Catholicos의 자리로 명명합니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_203:0 "아직 모교회가 아닙니다!"
 TV_WONDER_CEREMONY_CARD_ICON_S8_203:0 "@tv_ceremony_religious_influence!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_203:0 "#Y 진행 중#! — #high 에치미아진이 봉헌되었습니다#!\n#F 아라라트의 그늘 아래 대성당은 아르메니아 교회의 영적 중심지로 봉헌되었으며, 이날부터 이곳의 성직자와 신자들은 왕국 전체가 힘을 발휘할 수 있게 되었습니다. 느낌.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_203:0 "#G 완료#! — #high 에치미아진이 봉헌되었습니다#!\n#F 아라라트의 그늘 아래 대성당은 아르메니아 교회의 영적 중심지로 봉헌되었으며, 이날부터 그 성직자와 신자들은 왕국 전체가 할 수 있는 힘을 얻습니다. 느낌.#!"
 TV_WONDER_CEREMONY_S8_TITLE_203:0 "[tv_wonder_ceremony|E]:에치미아진이 신성화되었습니다"
 TV_WONDER_CEREMONY_S8_DESC_203:0 "아라라트의 그늘 아래 대성당은 아르메니아 교회의 영적 중심지로 봉헌되며, 이날부터 그 성직자와 신자들은 왕국 전체가 느낄 수 있는 힘을 얻습니다.\n\n#weak 예식을 완료하는 데 필요한 대가를 지불하세요. 그 결과 경이로운 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_203:0 "나는 Etchmiadzin을 우리 민족의 영적 심장으로 봉헌합니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_203:0 "법원은 지연되고 Etchmiadzin은 봉헌을 위해 조금 더 기다립니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_204:0 "@tv_ceremony_government!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_204:0 "#Y 진행 중#! — #high 능선을 장식하라는 명령#!\n#F 법원은 쿠라 위의 능선이 무너지지 않는 요새를 지탱할 것이라고 선언하고 앞으로의 작업에 대한 소문은 트빌리시의 시장과 수도원 모두에 퍼집니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_204:0 "#G 완료#! — #high 능선을 장식하라는 명령#!\n#F 법원은 쿠라 위의 능선이 무너지지 않는 요새를 지탱할 것이라고 선언하고 앞으로 있을 작업에 대한 소문은 트빌리시의 시장과 수도원 모두에 퍼집니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_204:0 "[tv_wonder_ceremony|E]: 능선을 장식하라는 명령"
 TV_WONDER_CEREMONY_S1_DESC_204:0 "법원은 쿠라 위의 능선이 무너지지 않는 요새를 지탱할 것이라고 선언하고 앞으로 진행될 작업에 대한 소식은 트빌리시의 시장과 수도원 모두에 퍼집니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_204:0 "우리는 이것을 선포합니다: 쿠라 위의 능선은 깨지지 않는 돌로 된 왕관을 쓸 것입니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_204:0 "법원은 인장을 보류하고 능선은 조용히 기다립니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_204:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_204:0 "#Y 진행 중#! — #high 슈리스 치케 측량#!\n#F 엔지니어와 노련한 수비대 참전용사들이 능선을 올라 성벽과 탑을 표시하고 옛 말로 위치를 정하기 위한 선을 추적합니다. 무적.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_204:0 "#G Completed#! — #high 슈리스 치케 측량#!\n#F 엔지니어와 노련한 수비대 참전용사들이 능선을 올라 벽과 탑을 표시하고 옛 말로 위치를 정하기 위한 선을 추적합니다. 무적.#!"
 TV_WONDER_CEREMONY_S2_TITLE_204:0 "[tv_wonder_ceremony|E]：슈리스 치케 측량"
 TV_WONDER_CEREMONY_S2_DESC_204:0 "엔지니어들과 노련한 수비대 베테랑들이 산등성이에 올라 벽과 탑을 표시하고 옛날 말로 무적의 위치를 만들기 위한 선을 그었습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다립니다.#!"
