 TV_WONDER_CEREMONY_CARD_ICON_S3_139:0 "@tv_ceremony_employees!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_139:0 "#Y 진행 중#! — #high 조선 마스터가 소환됩니다#!\n#F Zheng 그의 해군 장교는 해안 지방의 조선 마스터와 인터뷰를 진행하며 대사관과 선박을 운반할 수 있을 만큼 큰 선체를 형성할 수 있음이 입증된 사람만 선택합니다. 말.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_139:0 "#G 완료#! — #high 조선 마스터가 소환됩니다#!\n#F Zheng 그는 자신의 해군 장교가 해안 지방의 조선 마스터와 인터뷰를 하고 대사관과 화물을 운반할 수 있을 만큼 큰 선체를 형성할 수 있음이 입증된 사람만 선택합니다. 말.#!"
 TV_WONDER_CEREMONY_S3_TITLE_139:0 "[tv_wonder_ceremony|E]: 조선의 대가를 소환하다"
 TV_WONDER_CEREMONY_S3_DESC_139:0 "Zheng He의 해군 장교는 해안 지방의 조선공을 인터뷰하고 대사관과 말을 운반할 수 있을 만큼 큰 선체를 만들 수 있음이 입증된 사람들만 선택합니다.\n\n#weak 행사를 다음 단계로 진행하는 데 필요한 대가를 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_139:0 "우리는 선체가 대사관을 운반하기에 적합한 것으로 입증된 조선공들만 소환합니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_139:0 "장교들은 검증되지 않은 기술을 갖춘 조선공에게 안주하지 않고 주저합니다."
