 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_139:0 "#Y 진행 중#! — #high 첫 번째 미끄러짐 통로가 절단되었습니다.#!\n#F 노동자들은 Longjiang의 강둑으로 첫 번째 큰 미끄러짐 통로를 절단했으며, 용골 층은 곧 보물선의 프레임이 올라갈 첫 번째 목재를 설정했습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_139:0 "#G 완료#! — #high 첫 번째 미끄러짐 경로가 절단되었습니다.#!\n#F 노동자들은 Longjiang의 강둑으로 첫 번째 큰 미끄러짐 경로를 절단했으며 용골 층은 곧 보물선의 프레임이 올라갈 첫 번째 목재를 설정했습니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_139:0 "[tv_wonder_ceremony|E]: 첫 번째 슬립웨이가 절단되었습니다."
 TV_WONDER_CEREMONY_S4_DESC_139:0 "인부들은 Longjiang의 강둑에 첫 번째 대형 통로를 절단하고 용골 층은 곧 보물선의 프레임이 올라갈 첫 번째 목재를 설정합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_139:0 "인부들은 용골층이 목재를 놓을 때 강둑으로 들어가는 첫 번째 통로를 절단했습니다."
