 TV_WONDER_CEREMONY_CARD_ICON_S8_211:0 "@tv_ceremony_building_open!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_211:0 "#Y 진행 중#! — #high 은행장 정식 개장#!\n#F 회계소는 아우크스부르크 무역 거리에 완벽하게 서 있고, 금고는 가득 차고 배달원은 왕국 상업의 모든 곳으로 달려가고 있으며, 오늘부터 왕관의 금고가 조금씩 움직입니다. 좀 더 원활하게.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_211:0 "#G 완료#! — #high 은행장 정식 개장#!\n#F 회계소는 아우크스부르크 무역 거리에 완벽하게 서 있고 금고는 가득 차 있으며 택배사들은 왕국 상업의 모든 곳으로 달려갑니다. 조금 더 원활하게 진행하세요.#!"
 TV_WONDER_CEREMONY_S8_TITLE_211:0 "[tv_wonder_ceremony|E]：뱅킹 하우스 전체 오픈"
 TV_WONDER_CEREMONY_S8_DESC_211:0 "계수관은 아우크스부르크 무역 거리에 완전하게 세워져 있고, 금고는 가득 차고 그 배달원들은 왕국 상업의 모든 구석구석을 돌고 있습니다. 오늘부터 왕관의 금고는 이를 위해 좀 더 원활하게 움직입니다.\n\n#weak 의식을 완료하는 데 필요한 가격을 지불하십시오. 결과적으로 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
