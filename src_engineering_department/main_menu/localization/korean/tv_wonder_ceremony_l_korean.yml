 TV_WONDER_CEREMONY_CARD_ICON_S4_138:0 "@tv_ceremony_food_suitability!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_138:0 "#Y 진행 중#! — #high 첫 번째 수갱이 가라앉았습니다#!\n#F 굴착기가 첫 번째 수직 수갱에서 땅을 파고, 실제 수로가 지하에서 느린 경로를 시작하면서 바구니마다 굴착된 땅이 표면으로 올라갑니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_138:0 "#G 완료#! — #high 첫 번째 수갱이 가라앉았습니다#!\n#F Diggers는 첫 번째 수직 수갱에서 땅을 파고, 실제 수로가 지하에서 느린 경로를 시작하면서 바구니마다 굴착된 땅이 표면으로 올라갑니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_138:0 "[tv_wonder_ceremony|E]: 첫 번째 샤프트가 함몰됨"
 TV_WONDER_CEREMONY_S4_DESC_138:0 "굴착기가 첫 번째 수직 샤프트에서 땅을 파고, 실제 수로가 지하에서 느린 길을 시작하면서 바구니 하나하나 굴착된 흙이 표면으로 올라옵니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_138:0 "우리는 첫 번째 수갱을 가라앉히고 수로의 경로를 설정했습니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_138:0 "채굴자들은 삽을 내려놓고 첫 번째 수갱은 땅에 아무 표시도 없이 그대로 남아 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_138:0 "@tv_ceremony_laborers!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_138:0 "#Y 진행 중#! — #high 평원을 가로지르는 수갱의 행렬#!\n#F A 수직 수갱의 사슬은 고원의 표면을 눈에 띄게 행진하며, 각각은 아래 터널을 위한 숨구멍이 되며, 정확한 간격으로 파는 것은 무칸니스만이 할 수 있는 것입니다. 판사.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_138:0 "#G 완료#! — #high 평원을 가로지르는 수갱의 행렬#!\n#F A 수직 수갱의 사슬은 고원 표면을 눈에 띄게 행진하며, 각각은 아래 터널을 위한 숨구멍이 되며, 오직 무칸니스만이 파는 정확한 간격으로 파고 있습니다. 판사.#!"
 TV_WONDER_CEREMONY_S5_TITLE_138:0 "[tv_wonder_ceremony|E]：평원을 가로지르는 수갱의 행렬"
 TV_WONDER_CEREMONY_S5_DESC_138:0 "일련의 수직 샤프트가 고원 표면을 가로질러 눈에 띄게 행진하며, 각각은 아래 터널을 위한 숨구멍이며, 오직 무칸니스만이 판단할 수 있는 정확한 간격으로 파고 있습니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우에는 기다리세요.#!"
