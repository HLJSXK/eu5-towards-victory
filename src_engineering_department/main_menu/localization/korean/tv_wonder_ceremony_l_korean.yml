 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_108:0 "#Y 진행 중#! — #high 대석 기초가 놓였습니다#!\n#F 석공은 성채가 세워질 자리 아래에 거대한 경사진 이시가키 기반을 맞췄으며, 처음으로 인부들이 천수각 주변의 벽이 아닌 천수각 자체에 대해 이야기합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_108:0 "#G 완료#! — #high 대석 기초가 놓였습니다#!\n#F 석공은 성채가 세워질 자리 아래에 거대한 경사진 이시가키 기반을 맞췄으며, 처음으로 인부들이 천수각 주변의 벽이 아닌 천수각 자체에 대해 이야기합니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_108:0 "[tv_wonder_ceremony|E]：대석기초가 놓였다"
 TV_WONDER_CEREMONY_S4_DESC_108:0 "석공들은 천수가 세워질 자리 아래에 거대한 경사진 이시가키 기반을 설치했으며, 처음으로 인부들은 천수각 주변의 벽보다는 천수각 자체에 대해 이야기합니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_108:0 "석공들은 천수각이 서게 될 자리 아래에 경사진 이시가키 돌을 돌 하나하나 맞춰 놓았습니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_108:0 "석공들은 도구를 내려놓고 이시가키의 경사면은 아직 미완성 상태로 남겨두었습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_108:0 "@tv_ceremony_soldiers!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_108:0 "#Y 진행 중#! — #high Five Stories Rise Tier by Tier#!\n#F 목수들은 성채의 목재 골조 층을 층별로 높이는데, 각 층은 천수각의 실루엣이 날아가는 왜가리를 닮기 시작할 때까지 아래 층보다 약간 뒤로 설정됩니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_108:0 "#G Completed#! — #high Five Stories Rise Tier by Tier#!\n#F 목수들은 성채의 목재 골조 층을 층별로 높입니다. 각 층은 천수각의 실루엣이 날아가는 왜가리를 닮기 시작할 때까지 아래 층보다 약간 뒤로 설정됩니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_108:0 "[tv_wonder_ceremony|E]：5개의 스토리가 계층별로 상승"
 TV_WONDER_CEREMONY_S5_DESC_108:0 "목수들은 성채의 목재 프레임 층을 층별로 올리며, 각 층은 천수각의 실루엣이 날아다니는 왜가리와 닮기 시작할 때까지 아래 층에서 약간 뒤로 설정됩니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우에는 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_108:0 "성채의 실루엣이 날아다니는 왜가리를 닮기 시작할 때까지 우리는 각 이야기를 차례로 올립니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_108:0 "목수들은 연장을 내려놓고 다음 시즌을 위해 틀을 반쯤 올려두었습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_108:0 "@tv_ceremony_art_work!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_108:0 "#Y 진행 중#! — #high 벽을 덮는 흰색 회반죽#!\n#F 성채의 벽과 박공 위에 흰색 회반죽을 흙손으로 덧대어 전체 단지가 언덕 위에 정착한 왜가리처럼 빛나며 성을 오래도록 유지합니다. 이름.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_108:0 "#G 완료#! — #high 벽을 덮는 흰색 회반죽#!\n#F 성채의 벽과 박공 위에 흰색 회반죽을 흙손으로 덧대어 전체 단지가 언덕 위에 자리잡은 왜가리처럼 빛나고 성을 오래도록 유지합니다. 이름.#!"
 TV_WONDER_CEREMONY_S6_TITLE_108:0 "[tv_wonder_ceremony|E]: 흰색 석고가 벽을 덮습니다."
 TV_WONDER_CEREMONY_S6_DESC_108:0 "흰색 회반죽을 성채의 벽과 박공 위에 흙손으로 덧대어 전체 단지가 언덕에 정착한 왜가리처럼 빛나면서 성에 지속적인 이름이 붙게 되었습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우에는 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_108:0 "미장공들은 성채가 언덕에 앉은 왜가리처럼 빛날 때까지 벽을 가로질러 흰색 층을 흙손으로 겹겹이 쌓았습니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_108:0 "나는 잠시 동안 벽을 그대로 방치합니다. 왜가리의 하얀 깃털은 더 맑은 하늘을 기다릴 수 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_108:0 "@tv_ceremony_military_panel!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_108:0 "#Y 진행 중#! — #high 리테이너가 관문의 미로 안에서 드릴링합니다.#!\n#F 사무라이 리테이너는 모든 공격자를 혼란스럽게 할 구불구불한 문과 막다른 통로 내에서 드릴하고, 검사관은 완성된 벽을 걸어 모든 관절을 검사합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_108:0 "#G 완료#! — #high 리테이너가 관문의 미로 안에서 드릴링합니다#!\n#F 사무라이 리테이너는 모든 공격자를 혼란스럽게 할 구불구불한 문과 막다른 통로 내에서 드릴을 하고, 검사관은 완성된 벽을 걸어 모든 관절을 검사합니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_108:0 "[tv_wonder_ceremony|E]: 미로의 관문 내부를 훈련하는 리테이너"
 TV_WONDER_CEREMONY_S7_DESC_108:0 "사무라이 신하들은 공격자를 혼란스럽게 할 구불구불한 미로의 문과 막다른 통로 내에서 훈련을 하고, 검사관은 완성된 벽을 따라 모든 연결 부위를 확인합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우에는 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_108:0 "유지보수 담당자는 구불구불한 문 미로를 뚫고 검사관은 완성된 모든 벽에 결함이 있는지 추적합니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_108:0 "가신들은 하루 동안 자리를 비우고 미로 같은 관문을 조금 더 오랫동안 시험하지 않은 채 남겨두었습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_108:0 "@tv_ceremony_government!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_108:0 "#Y 진행 중#! — #high 수비대가 완성된 성채에 들어갑니다.#!\n#F A 사무라이의 공식적인 행렬이 의식적인 순서로 완성된 성에 들어가고, 백로 성은 도메인 병사들 위에 영구적인 방패 역할을 한다고 선언됩니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_108:0 "#G Completed#! — #high 수비대가 완성된 성채에 들어갑니다#!\n#F A 사무라이의 공식 행렬이 의식적인 순서로 완성된 성에 들어가고 백로 성은 도메인의 영구 방어막으로 서 있다고 선언됩니다. 군인.#!"
 TV_WONDER_CEREMONY_S8_TITLE_108:0 "[tv_wonder_ceremony|E]: 수비대가 완성된 성채에 들어갑니다."
 TV_WONDER_CEREMONY_S8_DESC_108:0 "공식적인 사무라이 행렬이 의식 순서에 따라 완성된 성에 들어가고 백로 천수각은 도메인 병사들 위에 영구적인 방패로 서 있다고 선언됩니다.\n\n#weak 의식을 완료하려면 필요한 가격을 지불하세요. 결과적으로 불가사의의 최종 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_108:0 "드디어 백로가 경비를 서네요!"
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_108:0 "수비대가 문을 지키고 있는데 행렬은 아직 입장을 요청받지 않았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_109:0 "@tv_ceremony_death!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_109:0 "#Y 진행 중#! — #high 샤 자한, 흰 대리석 무덤 건설을 맹세#!\n#F 뭄타즈 마할의 죽음을 슬퍼하며 샤 자한은 법원 앞에서 야무나 강둑에 이전에 건설된 것과는 다른 흰 대리석 무덤을 세우겠다고 맹세합니다 it.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_109:0 "#G 완료#! — #high 샤 자한, 흰 대리석 무덤을 맹세하다#!\n#F 뭄타즈 마할의 죽음을 슬퍼하며 샤 자한은 법원 앞에서 이전에 지어진 어떤 것과도 달리 야무나 강둑에 흰 대리석 영묘를 세우겠다고 맹세합니다 it.#!"
 TV_WONDER_CEREMONY_S1_TITLE_109:0 "[tv_wonder_ceremony|E]：샤 자한, 흰 대리석 무덤을 맹세하다"
 TV_WONDER_CEREMONY_S1_DESC_109:0 "뭄타즈 마할의 죽음을 애도하며 샤 자한은 법정 앞에서 야무나 강둑에 이전에 지어진 어떤 것과도 다른 흰색 대리석 영묘를 세우겠다고 맹세합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_109:0 "그러니 맹세하자!"
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_109:0 "샤 자한은 슬픔을 더 오래 참으며 서약은 암묵적으로 합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_109:0 "@tv_ceremony_location!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_109:0 "#Y 진행 중#! — #high 강 부지와 거래된 토지#!\n#F 강둑을 따라 있는 토지는 영묘 부지를 위해 지역 귀족과 교환되었으며, 건축가 Ustad Ahmad Lahauri가 땅을 조사하는 동안 기초는 축복을 받았습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_109:0 "#G 완료#! — #high 강 부지와 거래된 토지#!\n#F 강둑을 따라 있는 토지는 영묘 부지를 위해 현지 귀족과 교환되었으며 건축가 Ustad Ahmad Lahauri가 땅을 조사하는 동안 기초는 축복을 받았습니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_109:0 "[tv_wonder_ceremony|E]：강 부지를 위해 토지가 거래됨"
 TV_WONDER_CEREMONY_S2_DESC_109:0 "강둑을 따라 있는 땅은 영묘 부지를 위해 지역 귀족들과 교환되고, 건축가 우스타드 아마드 라하우리(Ustad Ahmad Lahauri)가 땅을 조사하는 동안 기초는 축복을 받습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_109:0 "Lahauri가 땅을 축복하자 귀족들은 강변 부지를 양도했습니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_109:0 "아직은 아닙니다. 측량사가 마무리하도록 하세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S3_109:0 "@tv_ceremony_supply!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_109:0 "#Y 진행 중#! — #high 마크라나에서 대리석 캐러밴 도착#!\n#F 캐러밴은 수백 마일 떨어진 마크라나 채석장에서 흰색 대리석을 운반하는 반면, 아시아 전역의 요원은 상감에 사용할 벽옥, 옥, 청금석을 수집합니다. 와서.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_109:0 "#G Completed#! — #high 마크라나에서 대리석 캐러밴 도착#!\n#F 캐러밴은 수백 마일 떨어진 마크라나 채석장에서 흰색 대리석을 운반하고, 아시아 전역의 요원은 상감에 사용할 벽옥, 옥, 청금석을 수집합니다. 와서.#!"
 TV_WONDER_CEREMONY_S3_TITLE_109:0 "[tv_wonder_ceremony|E]:마크라나에서 대리석 캐러밴 도착"
 TV_WONDER_CEREMONY_S3_DESC_109:0 "캐러밴은 수백 마일 떨어진 마크라나 채석장에서 흰색 대리석을 운반하고, 아시아 전역의 대리인은 상감세공을 위해 벽옥, 옥, 청금석을 수집합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_109:0 "우리는 그녀의 무덤에 걸맞은 돌을 찾기 위해 거리를 두지 않을 것입니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_109:0 "캐러밴은 채석장 문 앞에 잠시 동안 머물게 됩니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_109:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_109:0 "#Y 진행 중#! — #high 강둑 플랫폼이 가라앉았습니다#!\n#F 엔지니어들이 영묘의 무게를 지탱하기 위해 잔해와 모르타르로 가득 찬 깊은 우물을 강둑에 파고, 거대한 주각이 물 위에서 형태를 갖추기 시작합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_109:0 "#G 완료#! — #high 강둑 플랫폼이 가라앉았습니다#!\n#F 엔지니어들이 영묘의 무게를 지탱하기 위해 잔해와 모르타르로 가득 찬 깊은 우물을 강둑에 파고, 거대한 주각이 그 위로 형태를 갖추기 시작합니다. 물.#!"
 TV_WONDER_CEREMONY_S4_TITLE_109:0 "[tv_wonder_ceremony|E]:강둑 플랫폼이 침몰되었습니다"
 TV_WONDER_CEREMONY_S4_DESC_109:0 "엔지니어들은 영묘의 무게를 지탱하기 위해 잔해와 회반죽으로 가득 찬 깊은 우물을 강둑에 가라앉히고, 거대한 주춧돌이 물 위에서 형태를 갖추기 시작합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우에는 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_109:0 "더 깊은 곳에서 기초를 굳건히 유지하세요!"
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_109:0 "엔지니어들은 지금은 우물을 반쯤 파 놓은 상태로 둡니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_109:0 "@tv_ceremony_religious_influence!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_109:0 "#Y 진행 중#! — #high 그레이트 돔과 첨탑의 솟아오름#!\n#F 중앙 돔은 주각 위로 올라가고 4개의 가느다란 첨탑이 모퉁이에 솟아 있으며, 각 첨탑은 부분적으로 바깥쪽으로 기울어지도록 제작되어 떨어지면 기둥에서 떨어지게 됩니다. 무덤.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_109:0 "#G 완료#! — #high 그레이트 돔과 첨탑의 솟아오름#!\n#F 중앙 돔은 주각 위로 올라가고 4개의 가느다란 첨탑이 모퉁이에 솟아 있으며, 각 첨탑은 부분적으로 바깥쪽으로 기울어지도록 제작되어 떨어지면 기둥에서 떨어져 나갑니다. 무덤.#!"
 TV_WONDER_CEREMONY_S5_TITLE_109:0 "[tv_wonder_ceremony|E]:대돔과 첨탑이 솟아오른다"
 TV_WONDER_CEREMONY_S5_DESC_109:0 "4개의 가느다란 첨탑이 모퉁이에 솟아오를 때 중앙 돔이 주춧대 위로 올라갑니다. 각 첨탑은 부분적으로 바깥쪽으로 기울어지도록 만들어져 있어, 떨어질 경우 무덤에서 떨어져 나갈 수 있습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_109:0 "석공은 돔을 더 높이 올려 첨탑이 손상되지 않도록 기울입니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_109:0 "아직은 아닙니다. 돔은 기다려야 합니다!"
 TV_WONDER_CEREMONY_CARD_ICON_S6_109:0 "@tv_ceremony_art_work!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_109:0 "#Y 진행 중#! — #high 대리석 위에 핀 피에트라 두라#!\n#F 장인들은 피에트라 두라 기법으로 흰색 대리석에 홍옥수와 청금석의 꽃덩굴을 상감세공하고, 서예가 아마나트 칸(Amanat Khan)은 대리석의 긴 띠를 조각합니다. 모든 아치형 통로에 꾸란 꾸란 구절이 새겨져 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_109:0 "#G Completed#! — #high Pietra Dura, 대리석 건너편에 꽃이 핀다#!\n#F 장인들은 피에트라 듀라 기법으로 흰색 대리석에 홍옥수와 청금석의 꽃덩굴을 상감세공하고, 서예가 Amanat Khan은 대리석의 긴 띠를 조각합니다. 모든 아치형 통로에 꾸란 꾸란 구절이 새겨져 있습니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_109:0 "[tv_wonder_ceremony|E]:대리석 위에 핀 피에트라 두라"
 TV_WONDER_CEREMONY_S6_DESC_109:0 "장인들은 피에트라 두라 기법으로 흰색 대리석에 홍옥수와 청금석의 꽃덩굴을 상감시키고, 서예가 아마나트 칸(Amanat Khan)은 모든 아치형 통로를 장식하는 긴 꾸란 구절 띠를 조각합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우에는 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_109:0 "우리는 그녀의 이름이 새겨진 꽃에 보석을 아끼지 않습니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_109:0 "아마나트 칸(Amanat Khan)은 끌을 내려놓았고, 시는 끝나지 않았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_109:0 "@tv_ceremony_river!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_109:0 "#Y 진행 중#! — #high 차르바 정원이 조성되었습니다.#!\n#F 공식적인 차르바그 정원은 무덤 앞에 4등분 대칭으로 배치되어 있으며, 긴 반사 연못은 잔잔한 물 속에서 영묘의 이미지를 두 배로 높이기 위해 절단되었습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_109:0 "#G 완료#! — #high 차르바그 정원이 펼쳐져 있습니다#!\n#F 공식적인 차르바그 정원은 무덤 앞에 4등분 대칭으로 배치되어 있으며, 긴 반사 연못은 정지 화면에서 영묘의 이미지를 두 배로 늘리기 위해 절단되었습니다. 물.#!"
 TV_WONDER_CEREMONY_S7_TITLE_109:0 "[tv_wonder_ceremony|E]：차르바그 정원이 펼쳐져 있습니다"
 TV_WONDER_CEREMONY_S7_DESC_109:0 "정식 차르바그 정원은 무덤 앞에 4등분 대칭으로 배치되어 있으며, 긴 반사 웅덩이는 잔잔한 물 속에서 영묘의 이미지를 두 배로 높이기 위해 절단되었습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_109:0 "물이 그녀를 영원히 비추게 해주세요!"
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_109:0 "우리는 정원이 한 시즌 더 기다리는 것을 보게 될 것입니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_109:0 "@tv_ceremony_holy_site!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_109:0 "#Y 진행 중#! — #high 영묘는 봉인되지 않고 헌정되었습니다#!\n#F 완성된 무덤은 공식적으로 봉인이 해제되어 법원 앞에 봉헌되었으며, 뭄타즈 마할의 유해는 돔 아래에 안장되었으며, 왕국의 명성은 대리석에 묶여 있음이 선언되었습니다. 퇴색하지 않습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_109:0 "#G 완성#! — #high 영묘는 봉인되지 않고 봉헌되었습니다#!\n#F 완성된 무덤은 공식적으로 봉인이 해제되어 법원 앞에 봉헌되었으며, 뭄타즈 마할의 유해는 돔 아래에 안장되었으며 왕국의 명성은 대리석으로 선언되었습니다. 퇴색하지 않습니다.#!"
 TV_WONDER_CEREMONY_S8_TITLE_109:0 "[tv_wonder_ceremony|E]：영묘는 봉인되지 않고 봉헌되었습니다"
 TV_WONDER_CEREMONY_S8_DESC_109:0 "완성된 무덤은 공식적으로 봉인이 풀려 법정 앞에 봉헌되고, 뭄타즈 마할의 유해는 돔 아래에 안치되며, 왕국의 위엄은 바래지 않는 대리석에 묶여 있음이 선언됩니다.\n\n#weak 의식을 완료하는 데 필요한 가격을 지불하세요. 그 결과 불가사의의 최종 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_109:0 "무덤의 봉인이 풀리고 Mumtaz가 잠들자 법정이 모였습니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_109:0 "아직은 아닙니다. 봉인을 그대로 유지하세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S1_110:0 "@tv_ceremony_city_capital!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_110:0 "#Y 진행 중#! — #high 영락제가 새로운 축을 선포하다#!\n#F 영락제는 수도를 북쪽으로 베이징으로 옮기고 붉은 벽과 금빛 지붕으로 이루어진 광대한 궁전 축이 도시의 중심부에 세워지도록 명령합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_110:0 "#G 완료#! — #high 영락제가 새로운 축을 선포하다#!\n#F 영락제는 수도를 북쪽으로 베이징으로 옮기고 붉은 벽과 황금 지붕으로 이루어진 광대한 궁전 축을 도시 중심부에 세우도록 명했습니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_110:0 "[tv_wonder_ceremony|E]: 영락제가 새로운 축을 선포하다"
 TV_WONDER_CEREMONY_S1_DESC_110:0 "영락제는 수도를 북쪽으로 베이징으로 이동할 것을 명하고 붉은 벽과 황금 지붕으로 이루어진 광대한 궁전 축이 도시 중심부에 세워지도록 명령합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_110:0 "영락제가 칙령을 봉인하고 새로운 축이 일어나기 시작합니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_110:0 "나무가 쓰러지기 전에 도끼를 갈아야 합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_110:0 "@tv_ceremony_time!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_110:0 "#Y 진행 중#! — #high 지오맨서(Geomancers)는 극별에 맞춰 궁전을 정렬합니다.#!\n#F 궁정의 흙점술사는 극별 아래 남북으로 궁전의 중심 축을 정렬하고, 관리들은 옛 왕조의 건축 허가를 요청하기 위해 조상 의식을 거행합니다. 새로.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_110:0 "#G 완료#! — #high 지오맨서(Geomancers)는 궁궐을 북극성에 맞춰 정렬합니다#!\n#F 궁정의 풍수사는 북극성 아래 남북으로 궁전의 중심 축을 정렬하고 관리들은 옛 왕조의 휴가를 요청하기 위해 조상 의식을 거행합니다. 새로 빌드하세요.#!"
 TV_WONDER_CEREMONY_S2_TITLE_110:0 "[tv_wonder_ceremony|E]: 지리점술사가 궁전을 북극성에 맞춰 정렬합니다."
 TV_WONDER_CEREMONY_S2_DESC_110:0 "궁정 풍수사가 극별 아래에서 궁전의 중심축을 남북으로 정렬하고, 관리들은 옛 왕조에게 새로 건축할 수 있도록 허가를 요청하기 위해 조상 제사를 거행합니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우에는 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_110:0 "우리는 북극성 아래에 우리의 궁전을 정렬하고 조상들에게 새로 건축할 수 있도록 허락을 간청합니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_110:0 "풍수사는 별이 확실해지기 전에는 축을 고정할 생각이 없어 주저합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_110:0 "@tv_ceremony_ship!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_110:0 "#Y 진행 중#! — #high 쓰촨에서 내려오는 목재 뗏목#!\n#F 쓰촨성과 윈난성의 숲에서 자른 거대한 통나무는 수년 동안 뗏목을 타고 강 아래로 떠내려가고, 황금 벽돌은 쑤저우의 가마에서 구워지고 돌은 Fangshan.#!에서 채석되었습니다."
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_110:0 "#G Completed#! — #high 사천에서 내려오는 목재 뗏목#!\n#F 사천과 윈난의 숲에서 자른 거대한 통나무는 수년 동안 뗏목을 타고 강 아래로 떠내려가고, 황금 벽돌은 쑤저우의 가마에서 구워지며 돌은 Fangshan.#!에서 채석되었습니다."
 TV_WONDER_CEREMONY_S3_TITLE_110:0 "[tv_wonder_ceremony|E]：쓰촨성에서 내려오는 목재 뗏목"
 TV_WONDER_CEREMONY_S3_DESC_110:0 "쓰촨성과 윈난성의 숲에서 자른 거대한 통나무는 수년 동안 뗏목을 타고 강에 떠내려오고, 황금 벽돌은 쑤저우의 가마에서 구워지고 돌은 팡샨에서 채석됩니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우에는 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_110:0 "시간이 지나면서 많은 시냇물이 하나의 궁전을 세우게 됩니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_110:0 "우리는 아직 수도에서 몇 년이 떨어져 있는 뗏목과 가마에 돈을 쓸 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_110:0 "@tv_ceremony_crown_estate!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_110:0 "#Y 진행 중#! — #high 자오선 기초가 놓였습니다#!\n#F 노동자들이 자오선의 광대한 플랫폼과 기초를 놓았고, 처음으로 다가오는 궁전 단지의 형태가 공터를 통해 추적될 수 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_110:0 "#G 완료#! — #high 자오선 기초가 놓였습니다#!\n#F 노동자들이 자오선의 광대한 플랫폼과 기초를 놓았고, 처음으로 다가오는 궁전 단지의 모양이 공터를 통해 추적될 수 있습니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_110:0 "[tv_wonder_ceremony|E]：메리디안 게이트 기초가 놓였습니다"
 TV_WONDER_CEREMONY_S4_DESC_110:0 "인부들이 자오선 문(Meridian Gate)의 광대한 플랫폼과 토대를 놓았고, 처음으로 앞으로 다가올 궁전 단지의 형태를 깨끗한 땅 전체에서 추적할 수 있습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_110:0 "노동자들이 큰 단을 깔고, 깨끗한 땅 위에 궁전의 윤곽이 드러납니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_110:0 "3피트의 얼음은 하루에 얼지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_110:0 "@tv_ceremony_government_power!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_110:0 "#Y 진행 중#! — #high 최고의 하모니의 전당이 프레임을 차지합니다#!\n#F 목수들은 3중 대리석 테라스에서 최고 하모니의 전당의 목재 프레임을 들어올립니다. 궁전의 중앙 홀은 주변의 모든 안뜰 위로 올라가고 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_110:0 "#G 완료#! — #high 프레임을 차지하는 최고 하모니의 전당#!\n#F 목수들은 삼중 대리석 테라스에서 최고 하모니 전당의 목재 프레임을 들어올립니다. 궁전의 중앙 홀은 주변의 모든 안뜰 위로 솟아 있습니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_110:0 "[tv_wonder_ceremony|E]: 최고 조화의 전당이 프레임을 차지합니다"
 TV_WONDER_CEREMONY_S5_DESC_110:0 "목수들은 삼중 대리석 테라스에서 최고 하모니 전당의 목재 프레임을 들어올립니다. 궁전의 중앙 홀은 주변의 모든 안뜰 위로 솟아오릅니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_110:0 "우리는 궁전의 모든 안뜰 위에 홀의 목재 프레임을 올립니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_110:0 "목수들은 도구를 낮추고 틀은 반쯤 세워져 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_110:0 "@tv_ceremony_art_work!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_110:0 "#Y 진행 중#! — #high 황금 기와와 용 경사로 설정#!\n#F 황금 기와가 홀 전체에 깔려 있고, 석공들은 황제의 가마가 지나갈 수 있는 거대한 용 경사로를 조각했습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_110:0 "#G 완료#! — #high 황금 기와와 용 경사로 설정#!\n#F 황금 기와가 홀 전체에 깔려 있고, 석공들은 황제의 가마가 지나갈 수 있는 거대한 용 경사로를 조각했습니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_110:0 "[tv_wonder_ceremony|E]：황금 타일과 용 경사로 설정"
 TV_WONDER_CEREMONY_S6_DESC_110:0 "유약을 바른 황금색 기와가 홀 전체에 깔려 있고, 석공들이 황제의 가마가 지나갈 수 있는 거대한 용 경사로를 조각했습니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우에는 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_110:0 "석공들이 황실의 용 경사로를 조각하고 황금색 타일이 위의 홀을 장식합니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_110:0 "아직 금 타일과 조각된 용석을 의뢰할 준비가 되지 않았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_110:0 "@tv_ceremony_warning_icon!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_110:0 "#Y 진행 중#! — #high 화재 속에서 법원이 이전하고 해결됨#!\n#F 공무원과 그 가족은 새 수도가 열리면서 북쪽으로 먼 이동을 하고, 번개가 미완성 홀의 일부에 불을 붙이면 법원은 회전을 고려하지 않고 재건합니다. 뒤로.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_110:0 "#G 완료#! — #high 화재 속에서 법원이 이전하고 해결#!\n#F 공무원과 그 가족은 새 수도가 열리면서 북쪽으로 장거리 이동하고, 번개가 미완성 홀의 일부를 불태우면 법원은 회전을 고려하지 않고 재건합니다. 뒤로.#!"
 TV_WONDER_CEREMONY_S7_TITLE_110:0 "[tv_wonder_ceremony|E]：화재 속에서 법원이 이전되어 해결됨"
 TV_WONDER_CEREMONY_S7_DESC_110:0 "새로운 수도가 열리자 관리들과 그 가족들은 북쪽으로 먼 이동을 하고 미완성 홀의 일부에 번개가 쳐서 다시는 되돌릴 생각도 하지 않고 법원을 재건합니다.\n\n#weak 예식을 다음 단계로 진행하는 데 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_110:0 "법원은 연기와 재를 뚫고 북쪽으로 진군하여 번개가 주장한 것을 재건했습니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_110:0 "아직 타고 있는 불씨 위에는 재건할 수 없습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_110:0 "@tv_ceremony_ruler!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_110:0 "#Y 진행 중#! — #high 황제가 대화의 전당에 오르다#!\n#F 영락제가 완성된 대화의 전당에서 공식적으로 왕위에 오르고, 궁궐의 권위가 전주를 통해 외부로 발산됨이 선언됩니다. 영역.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_110:0 "#G 완료#! — #high 황제가 대화의 전당에 오르다#!\n#F 영락제가 완성된 대화의 전당에서 공식적으로 왕위에 오르고, 궁궐의 권위가 전주를 통해 외부로 발산됨이 선언됩니다. 영역.#!"
 TV_WONDER_CEREMONY_S8_TITLE_110:0 "[tv_wonder_ceremony|E]: 황제가 최고 조화의 전당에 오르다"
 TV_WONDER_CEREMONY_S8_DESC_110:0 "영락제(Yongle Emperor)는 완성된 최고 조화의 전당(Hall of Supreme Harmony)에서 공식적으로 왕좌에 오르고, 궁전의 권위는 왕국의 모든 지방을 통해 외부로 발산될 것이라고 선언됩니다.\n\n#weak 의식을 완료하는 데 필요한 대가를 지불하세요. 결과적으로 불가사의의 최종 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_110:0 "우리는 최고 조화의 전당(Hall of Supreme Harmony)의 왕좌에 오르고, 우리의 권위는 모든 지역으로 퍼질 것입니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_110:0 "황제는 아직 승천을 주장하지 않은 채 왕좌 앞에 머물고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_111:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_111:0 "#Y 진행 중#! — #high 메흐메드 2세가 옛 아크로폴리스 지점에 대해 소유권을 주장하다#!\n#F 콘스탄티노플을 정복한 후, 술탄 메흐메드 2세는 보스포러스 해협과 황금 해협이 내려다보이는 옛 아크로폴리스 지점에 새로운 궁전이 세워질 것이라고 선언했습니다. 혼.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_111:0 "#G Completed#! — #high 메흐메드 2세가 옛 아크로폴리스 지점에 대한 소유권을 주장하다#!\n#F 콘스탄티노플을 정복한 후 술탄 메흐메드 2세는 보스포러스 해협과 황금 해협이 내려다보이는 옛 아크로폴리스 지점에 새로운 궁전이 세워질 것이라고 선언했습니다. 혼.#!"
 TV_WONDER_CEREMONY_S1_TITLE_111:0 "[tv_wonder_ceremony|E]:메메드 2세가 옛 아크로폴리스 지점을 주장함"
 TV_WONDER_CEREMONY_S1_DESC_111:0 "콘스탄티노플을 정복한 후 술탄 메흐메드 2세는 보스포러스 해협과 골든 혼이 내려다보이는 옛 아크로폴리스 지점에 새 궁전을 세울 것이라고 선언합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_111:0 "우리는 이 높이가 우리 제국의 본거지라고 주장합니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_111:0 "술탄은 남아 있고 아크로폴리스는 한동안 소유권이 주장되지 않은 채로 서 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_111:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_111:0 "#Y 진행 중#! — #high Imams 정복된 땅에 축복을 내리다#!\n#F Imams는 아직 포위된 땅 위에서 축복을 낭송하며 깨끗해진 언덕 꼭대기를 걷고 있으며, 측량사는 언젠가 궁전과 분리될 중첩된 안뜰을 배치합니다. 세계.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_111:0 "#G Completed#! — #high Imams 정복된 땅을 축복하세요#!\n#F Imams는 여전히 포위 공격으로 얼룩진 땅 위에서 축복을 낭송하며 깨끗해진 언덕 꼭대기를 걷고 있으며, 측량사는 언젠가 궁전과 분리될 중첩된 안뜰을 배치합니다. 세계.#!"
 TV_WONDER_CEREMONY_S2_TITLE_111:0 "[tv_wonder_ceremony|E]: 이맘들은 정복된 땅을 축복합니다"
 TV_WONDER_CEREMONY_S2_DESC_111:0 "이맘들은 여전히 포위된 땅 위에서 축복을 낭송하며 개간된 언덕을 걷고 있으며, 측량사들은 언젠가 궁전을 세계와 분리할 중첩된 안뜰을 배치하고 있습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우에는 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_111:0 "이맘은 축복을 완료하고 측량사의 말뚝은 첫 번째 안뜰을 표시합니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_111:0 "우리는 아직 이 땅을 봉헌할 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_111:0 "@tv_ceremony_building_needs!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_111:0 "#Y 진행 중#! — #high 몰락한 도시에서 대리석이 수집됩니다#!\n#F 대리석과 돌은 무너진 도시 전역의 폐허가 된 비잔틴 건물에서 회수되고, 선박은 제국 전역에서 목재와 추가 돌을 가져옵니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_111:0 "#G 완료#! — #high 몰락한 도시에서 대리석이 수집됩니다#!\n#F 대리석과 돌은 무너진 도시 전역의 폐허가 된 비잔틴 건물에서 회수되고, 선박은 제국 전역에서 목재와 추가 돌을 가져옵니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_111:0 "[tv_wonder_ceremony|E]: 무너진 도시에서 대리석을 채취하다"
 TV_WONDER_CEREMONY_S3_DESC_111:0 "무너진 도시 전역의 폐허가 된 비잔틴 건물에서 대리석과 석재를 회수하고, 배는 제국 전역에서 목재와 추가 석재를 가져옵니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_111:0 "보급선이 하역되는 동안 인부들은 인양된 대리석을 해변으로 운반합니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_111:0 "석공들이 기다리고 있고, 배들은 화물을 건드리지 않은 채 정박해 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_111:0 "@tv_ceremony_defensive_military_stance!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_111:0 "#Y 진행 중#! — #high 외벽과 황실 문 상승#!\n#F 메이슨은 외벽과 황문의 첫 번째 코스를 마련하고, 궁전은 이를 정의할 안뜰 내의 안뜰 형태를 취하기 시작합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_111:0 "#G 완료#! — #high 외벽과 황실 문 상승#!\n#F 메이슨은 외벽과 황문의 첫 번째 코스를 놓았고, 궁전은 그것을 정의할 안뜰 내의 안뜰 형태를 취하기 시작했습니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_111:0 "[tv_wonder_ceremony|E]：외벽과 임페리얼 게이트 라이즈"
 TV_WONDER_CEREMONY_S4_DESC_111:0 "메이슨은 외벽과 임페리얼 게이트(Imperial Gate)의 첫 번째 코스를 마련하고 궁전은 이를 정의하는 안뜰 내의 안뜰 형태를 취하기 시작합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_111:0 "마침내 문이 서 있습니다!"
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_111:0 "석공들은 도구를 내려놓았고 외벽은 반쯤 솟아올랐다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_111:0 "@tv_ceremony_government!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_111:0 "#Y 진행 중#! — #high 주방과 의회 홀의 모습#!\n#F 제국의 일상 업무를 수행할 건물로 가득 찬 두 번째 안뜰인 디반의 의회 홀 옆에 거대한 궁전 부엌이 솟아 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_111:0 "#G 완료#! — #high 주방과 의회 홀의 모습#!\n#F 넓은 궁전 주방이 디반의 의회 홀 옆에 솟아 있고 두 번째 안뜰은 제국의 일상 업무를 운영할 건물로 가득 차 있습니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_111:0 "[tv_wonder_ceremony|E]：주방과 회의실이 모습을 갖추다"
 TV_WONDER_CEREMONY_S5_DESC_111:0 "거대한 궁전 부엌은 제국의 일상 업무를 운영할 건물로 가득 찬 디반의 의회 홀 옆에 우뚝 솟아 있습니다.\n\n#weak 식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_111:0 "디반의 의원들은 제국의 사업을 시작하기 위해 자리에 앉습니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_111:0 "아직은 아닙니다. 의회가 기다리도록 하십시오!"
 TV_WONDER_CEREMONY_CARD_ICON_S6_111:0 "@tv_ceremony_art_work!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_111:0 "#Y 진행 중#! — #high 골든 혼(Golden Horn)이 내려다보이는 타일 키오스크#!\n#F 골든 혼(Golden Horn)이 내려다보이는 궁전 가장자리를 따라 타일로 장식된 파빌리온과 키오스크가 세워져 있으며, 칠해진 처마가 아래 물에서 빛을 받고 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_111:0 "#G 완료#! — #high 골든 혼(Golden Horn)이 내려다보이는 타일 키오스크#!\n#F 골든 혼(Golden Horn)이 내려다보이는 궁전 가장자리를 따라 타일로 장식된 파빌리온과 키오스크가 세워져 있으며, 칠해진 처마가 아래 물에서 빛을 받고 있습니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_111:0 "[tv_wonder_ceremony|E]: 골든 혼(Golden Horn)이 내려다보이는 타일 키오스크"
 TV_WONDER_CEREMONY_S6_DESC_111:0 "골든 혼(Golden Horn)이 내려다보이는 궁전 가장자리를 따라 타일로 마감된 파빌리온과 키오스크가 세워져 있으며, 칠해진 처마가 아래 물에서 빛을 받고 있습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_111:0 "키오스크가 혼에서 빛을 받으면 화가는 처마 사이에 마지막 타일을 놓습니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_111:0 "타일공들은 잠시 멈추고 키오스크는 물 위에 그대로 남아 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_111:0 "@tv_ceremony_lock!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_111:0 "#Y 진행 중#! — #high 재고 금고가 봉인되고 채워졌습니다.#!\n#F 재고의 아치형 방에는 철로 묶인 문이 설치되어 있으며 정복 이후 수집한 전리품과 공물로 가득 차 있습니다. 외교관은 두 번째에 처음으로 받아들여집니다. 안뜰.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_111:0 "#G 완료#! — #high 재고 금고가 봉인되고 채워졌습니다.#!\n#F 재고의 아치형 방에는 철로 묶인 문이 설치되어 있으며 정복 이후 수집한 전리품과 공물로 가득 차 있습니다. 외교관은 두 번째에 처음으로 받아들여집니다. 안뜰.#!"
 TV_WONDER_CEREMONY_S7_TITLE_111:0 "[tv_wonder_ceremony|E]：국고 금고가 봉인되고 채워졌습니다"
 TV_WONDER_CEREMONY_S7_DESC_111:0 "재무부의 아치형 방에는 철제 문이 설치되어 있으며 정복 이후 수집한 전리품과 공물로 가득 차 있습니다. 외교관들은 두 번째 안뜰에서 처음으로 영접을 받습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_111:0 "드디어 봉인!"
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_111:0 "재무관은 지체하고 철로 묶인 문은 잠금 해제된 상태로 유지됩니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_111:0 "@tv_ceremony_ruler!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_111:0 "#Y 진행 중#! — #high 술탄의 공식 거주지#!\n#F 메흐메드 2세가 공식적으로 완성된 궁전 내에 거주하게 되었으며, 톱카피는 이제 제국의 권위와 외국 법원과의 거래가 이루어지는 자리로 선언되었습니다. 관리됩니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_111:0 "#G 완료#! — #high 술탄이 정식으로 거주하게 됨#!\n#F 메흐메드 2세가 공식적으로 완성된 궁전 내에 거주하게 되었으며, 톱카피는 이제 제국의 권위와 외국 법원과의 거래가 이루어지는 자리로 선언되었습니다. 관리됩니다.#!"
 TV_WONDER_CEREMONY_S8_TITLE_111:0 "[tv_wonder_ceremony|E]：술탄이 정식 거주를 시작합니다"
 TV_WONDER_CEREMONY_S8_DESC_111:0 "메흐메드 2세는 공식적으로 완성된 궁전에 거주하게 되며, 톱카피는 이제 제국의 권위와 외국 법원과의 거래가 관리되는 자리로 선언됩니다.\n\n#weak 의식을 완료하는 데 필요한 가격을 지불하세요. 결과적으로 불가사의의 최종 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_111:0 "메흐메드 2세가 문턱을 넘었고, 톱카프가 제국의 중심지로 선포되었습니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_111:0 "아직은 아닙니다. 왕좌가 기다리고 있습니다!"
 TV_WONDER_CEREMONY_CARD_ICON_S1_112:0 "@tv_ceremony_religious_influence!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_112:0 "#Y 진행 중#! — #high 율리우스 2세가 새로운 대성당을 선포하다#!\n#F 교황 율리우스 2세가 성채 위에 무너져가는 오래된 대성당을 선포하다#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_112:0 "#G Completed#! — #high Julius II Proclaims a New Basilica#!\n#F Pope Julius II proclaims that the crumbling old basilica over St.#!"
 TV_WONDER_CEREMONY_S1_TITLE_112:0 "[tv_wonder_ceremony|E]:율리우스 2세가 새로운 대성당을 선포하다"
 TV_WONDER_CEREMONY_S1_DESC_112:0 "교황 율리우스 2세는 성 베드로 무덤 위의 무너져가는 오래된 대성당을 철거하고 고대 이후 건설된 그 어떤 교회보다 더 위대한 교회로 대체할 것이라고 선언했습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_112:0 "교황 율리우스 2세는 오래된 대성당의 철거를 명령하는 황소에 인장을 찍습니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_112:0 "오래된 돌을 조금 더 오래 세워두세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S2_112:0 "@tv_ceremony_holy_site!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_112:0 "#Y 진행 중#! — #high 초석이 무덤 위에 축복을 받다#!\n#F 오래된 콘스탄티누스 대성당의 마지막 벽이 치워지면서 교황이 직접 사도의 무덤 바로 위에 놓인 초석을 축복합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_112:0 "#G 완료#! — #high 초석이 무덤 위에 축복을 받다#!\n#F 오래된 콘스탄티누스 대성당의 마지막 벽이 치워지면서 교황이 직접 사도의 무덤 바로 위에 놓인 초석을 축복합니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_112:0 "[tv_wonder_ceremony|E]：초석이 무덤 위에 축복을 받다"
 TV_WONDER_CEREMONY_S2_DESC_112:0 "옛 콘스탄티누스 대성당의 마지막 벽이 제거되면서 교황은 사도의 무덤 바로 위에 놓인 초석을 직접 축복합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_112:0 "우리는 사도의 안식처 위에 있는 이 초석을 축복합니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_112:0 "오래된 벽은 축복받지 못한 돌 주위에 좀 더 오래 남아 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_112:0 "@tv_ceremony_building_needs!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_112:0 "#Y 진행 중#! — #high Travertine이 Tivoli에서 도착#!\n#F Tivoli의 채석장에서 석회화 블록이 운반되고, 다가오는 교회를 위해 이탈리아 전역에서 청동과 대리석이 의뢰됩니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_112:0 "#G 완료#! — #high Travertine이 Tivoli에서 도착#!\n#F Tivoli의 채석장에서 석회화 블록을 운반하고, 다가오는 교회를 위해 이탈리아 전역에서 청동과 대리석을 의뢰합니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_112:0 "[tv_wonder_ceremony|E]: 석회화는 티볼리에서 도착합니다"
 TV_WONDER_CEREMONY_S3_DESC_112:0 "석회화 블록은 티볼리의 채석장에서 운반되고, 다가오는 교회를 위해 이탈리아 전역에서 청동과 대리석이 주문됩니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_112:0 "가장 큰 사원도 돌 하나에서 시작됩니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_112:0 "우리는 아직 이 채석장의 비용을 감당할 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_112:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_112:0 "#Y 진행 중#! — #high 교차로를 위한 브라만테의 교각 상승#!\n#F 건축가 도나토 브라만테(Donato Bramante)의 4개의 큰 교각이 교차로를 지지하기 위해 솟아올랐으며, 처음으로 이 부지를 지나가는 로마인들은 교회가 차지하는 실제 규모를 목격했습니다. form.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_112:0 "#G Completed#! — #high Bramante의 교차점 상승#!\n#F 건축가 Donato Bramante의 4개의 거대한 교각이 교차점을 지원하며 처음으로 이 부지를 지나가는 로마인들은 교회가 차지하는 실제 규모를 확인합니다. form.#!"
 TV_WONDER_CEREMONY_S4_TITLE_112:0 "[tv_wonder_ceremony|E]: 브라만테의 교각이 횡단을 위해 솟아오릅니다."
 TV_WONDER_CEREMONY_S4_DESC_112:0 "건축가 도나토 브라만테(Donato Bramante)의 네 개의 큰 교각이 건널목을 지지하기 위해 솟아 있으며, 그 자리를 지나가는 로마인들은 처음으로 교회의 실제 규모가 형성되는 모습을 봅니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_112:0 "브라만테의 석공들은 교차점에 거대한 교각을 들어 올려 놓았습니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_112:0 "아직은 인내심을 가지세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S5_112:0 "@tv_ceremony_construction!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_112:0 "#Y 진행 중#! — #high 미켈란젤로의 돔 갈비뼈 모양이 변하다#!\n#F 브라만테가 죽은 지 수십 년 후, 미켈란젤로는 그 디자인을 이어받아 거대한 돔의 갈비뼈 프레임을 교차점 위로 들어 올려 자신의 나이에 도전하여 그것을 보았습니다. 시작되었습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_112:0 "#G 완료#! — #high 미켈란젤로의 돔 갈비뼈 모양이 변하다#!\n#F 브라만테가 죽은 지 수십 년 후, 미켈란젤로는 그 디자인을 이어받아 거대한 돔의 갈비뼈 프레임을 교차점 위로 들어 올려 자신의 나이에 도전하여 그것을 보았습니다. 시작되었습니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_112:0 "[tv_wonder_ceremony|E]：미켈란젤로의 돔 갈비뼈 모양이 바뀌다"
 TV_WONDER_CEREMONY_S5_DESC_112:0 "브라만테가 죽은 지 수십 년 후, 미켈란젤로는 디자인을 맡아 건널목 위의 거대한 돔의 골조 프레임을 들어올려 자신의 나이에 맞서 이 공사가 시작되는 모습을 지켜보았습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_112:0 "나이가 들더라도 나는 이 갈비뼈를 하늘을 향해 들어 올린다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_112:0 "돔의 갈비뼈는 빈 교차점 위에 건설되지 않은 상태로 남아 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_112:0 "@tv_ceremony_time!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_112:0 "#Y 진행 중#! — #high 성공적인 건축가들이 작업을 전진시킵니다#!\n#F Architect는 수십 년에 걸쳐 건축가를 따릅니다. Raphael, Sangallo, 그리고 다시 Michelangelo는 각각 미완성 교회를 물려받아 이를 향해 더 나아가고 있습니다. 완료.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_112:0 "#G Completed#! — #high 성공적인 건축가들이 작업을 전진시킵니다#!\n#F Architect는 수십 년에 걸쳐 건축가를 따릅니다. Raphael, Sangallo, 그리고 다시 Michelangelo는 각각 미완성 교회를 물려받아 이를 향해 더 나아가고 있습니다. 완료.#!"
 TV_WONDER_CEREMONY_S6_TITLE_112:0 "[tv_wonder_ceremony|E]：성공적인 건축가가 작업을 추진합니다"
 TV_WONDER_CEREMONY_S6_DESC_112:0 "건축가는 수십 년에 걸쳐 라파엘로, 상갈로, 다시 미켈란젤로를 따라가며 각각 미완성된 교회를 물려받아 완성을 향해 더욱 노력합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_112:0 "한 건축가가 시작하면 다른 건축가가 하늘로 가져갈 것입니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_112:0 "우리는 아직 이 교회를 다른 사람의 손에 맡길 수 없습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_112:0 "@tv_ceremony_population!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_112:0 "#Y 진행 중#! — #high 외관이 솟아오를 때 순례자들이 모인다#!\n#F 마침내 본당과 정면이 광장 위로 올라가고, 미완성된 전면 앞에 순례자들이 이미 모이고 있는데, 그 안에 경이로운 모습이 형성되고 있다는 소문이 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_112:0 "#G 완료#! — #high 외관이 솟아오를 때 순례자들이 모인다#!\n#F 마침내 본당과 정면이 광장 위로 올라가고, 미완성된 전면 앞에 순례자들이 이미 모이고 있는데, 그 안에 경이로운 모습이 형성되고 있다는 소문이 있습니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_112:0 "[tv_wonder_ceremony|E]：외관이 높아지면서 순례자들이 모인다"
 TV_WONDER_CEREMONY_S7_DESC_112:0 "마침내 본당과 정면이 광장 위로 올라가고 순례자들은 그 안에서 경이로운 모습이 형성되고 있다는 소문에 이끌려 이미 미완성된 정면 앞에 모여들고 있습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_112:0 "마침내 본당과 정면이 붐비는 광장 위로 올라갑니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_112:0 "믿음은 돌과 같아서 천천히 쌓입니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_112:0 "@tv_ceremony_religious_unity!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_112:0 "#Y 진행 중#! — #high 대성당이 사도 위에 봉헌되다#!\n#F 교황은 추기경과 순례자들이 광장에 붐비기 전에 완성된 대성당을 축성하고, 성 위의 교회도 #!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_112:0 "#G 완료#! — #high 사도 위에 바실리카가 봉헌되다#!\n#F 교황은 추기경과 순례자들이 광장에 붐비기 전에 완성된 바실리카를 봉헌하고, 성 위의 교회도 #!"
 TV_WONDER_CEREMONY_S8_TITLE_112:0 "[tv_wonder_ceremony|E]：대성당은 사도 위에 봉헌됩니다"
 TV_WONDER_CEREMONY_S8_DESC_112:0 "교황은 추기경과 순례자들이 광장에 모여들기 전에 완성된 대성당을 축성하고, 성 베드로의 무덤 위에 있는 교회는 이날부터 전 세계에 신자들의 헌신을 전할 것을 선언합니다.\n\n#weak 예식을 완료하는 데 필요한 가격을 지불하세요. 그 결과 경이로운 최종 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_112:0 "나는 이 대성당을 봉헌하고, 이를 통해 왕국 전체의 헌신을 봉헌합니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_112:0 "봉헌되지 않은 대성당은 기다리는 군중 앞에서 침묵을 지키고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_113:0 "@tv_ceremony_religious_influence!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_113:0 "#Y 진행 중#! — #high 랄리벨라 왕이 새 예루살렘을 구상하다#!\n#F 게브레 메스켈 랄리벨라 왕은 로하가 새 예루살렘이 될 것이며, 그 교회는 돌 위에 돌을 쌓는 것이 아니라 살아 있는 붉은 바위를 깎아 통째로 깎을 것이라고 선언합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_113:0 "#G 완료#! — #high 랄리벨라 왕이 새 예루살렘을 구상하다#!\n#F 게브레 메스켈 랄리벨라 왕은 로하가 새 예루살렘이 될 것이라고 선언하며, 그 교회는 돌 위에 짓는 것이 아니라 살아 있는 붉은 바위를 깎아 전체를 조각할 것입니다. 돌.#!"
 TV_WONDER_CEREMONY_S1_TITLE_113:0 "[tv_wonder_ceremony|E]：랄리벨라 왕이 새 예루살렘을 구상하다"
 TV_WONDER_CEREMONY_S1_DESC_113:0 "게브레 메스켈 랄리벨라 국왕은 로하가 새 예루살렘이 될 것이며 그 교회는 돌 위에 돌을 쌓는 것이 아니라 살아 있는 붉은 바위를 깎아 통째로 깎을 것이라고 선언합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_113:0 "우리는 로하가 살아있는 바위를 통째로 깎아 만든 우리의 새 예루살렘이 될 것을 맹세합니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_113:0 "법정은 조용해졌고, 새 예루살렘의 비전은 더욱 확실한 날을 기다리고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_113:0 "@tv_ceremony_holy_site!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_113:0 "#Y 진행 중#! — #high 붉은 응회암 노두가 선택됨#!\n#F 사제들은 왕의 비전이 요구하는 장소를 찾기 위해 붉은 화산 응회암의 고지대 노두를 걷고 있으며, 천사들은 첫 번째 교회가 있어야 할 곳을 표시하기 위해 밤에 내려온다고 합니다. 스탠드.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_113:0 "#G 완료#! — #high 붉은 응회암 노두가 선택됨#!\n#F 사제들은 왕의 비전이 요구하는 장소를 찾기 위해 붉은 화산 응회암의 고지대 노두를 걷고 있으며, 천사들은 첫 번째 교회가 있어야 할 곳을 표시하기 위해 밤에 내려온다고 합니다. 스탠드.#!"
 TV_WONDER_CEREMONY_S2_TITLE_113:0 "[tv_wonder_ceremony|E]：붉은 응회암 노두가 선택됨"
 TV_WONDER_CEREMONY_S2_DESC_113:0 "성직자들은 왕의 비전이 요구하는 장소를 찾기 위해 붉은 화산 응회암의 고지대 노두를 걷고 있으며, 밤이 되면 천사들이 첫 번째 교회가 서 있어야 할 곳을 표시하기 위해 내려온다고 합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우에는 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_113:0 "성직자들은 붉은 응회암 고원을 가로질러 펼쳐져 천사들이 밤에 표시한 길을 따라갑니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_113:0 "우리는 아직 천사의 표가 실제로 나타났는지 확신할 수 없습니다. 제사장들이 좀 더 조사하게 하라."
 TV_WONDER_CEREMONY_CARD_ICON_S3_113:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_113:0 "#Y 진행 중#! — #high 살아있는 돌 주변에 참호를 팠습니다.#!\n#F 목재나 대리석을 모으는 대신, 작업자들은 선택한 바위 주위에 깊은 도랑을 파고 교회의 재료가 될 바로 그 산을 분리했습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_113:0 "#G 완료#! — #high 살아있는 돌 주변에 참호를 팠습니다#!\n#F 목재나 대리석을 모으는 대신, 작업자들은 선택한 바위 주위에 깊은 도랑을 파고 교회의 재료가 될 바로 그 산을 격리했습니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_113:0 "[tv_wonder_ceremony|E]：살아있는 돌 주변에 참호를 팠습니다."
 TV_WONDER_CEREMONY_S3_DESC_113:0 "목재나 대리석을 모으는 대신, 작업자들은 선택된 바위 주위에 깊은 도랑을 파고 교회의 재료가 될 바로 그 산을 분리합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우에는 기다리십시오.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_113:0 "노동자들은 고지대 땅에 곡괭이를 몰고 가서 산의 심장을 자유롭게 할 참호를 파냅니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_113:0 "산도 한 계절에 깎인 것이 아니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_113:0 "@tv_ceremony_art_work!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_113:0 "#Y 진행 중#! — #high 조각은 위에서 시작됩니다.#!\n#F 끌은 고립된 돌을 위에서 아래로 물고, 처음으로 교회 지붕의 윤곽이 주변 땅과 수평으로 조각된 것으로 나타납니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_113:0 "#G 완료#! — #high 위에서 조각이 시작됩니다#!\n#F 끌이 고립된 돌을 위에서 아래로 물고 처음으로 교회 지붕의 윤곽이 주변 땅과 수평으로 조각된 것으로 나타납니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_113:0 "[tv_wonder_ceremony|E]: 조각은 위에서부터 시작됩니다"
 TV_WONDER_CEREMONY_S4_DESC_113:0 "끌은 고립된 돌을 위에서 아래로 물고 처음으로 교회 지붕의 윤곽이 주변 땅과 수평으로 새겨져 나타납니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_113:0 "우리는 돌 위에 끌을 내려 지붕선이 하늘 앞에 보이도록 합니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_113:0 "석공들은 끌을 내려놓고 지붕선은 사람의 손길이 닿지 않은 돌 아래에 놓여 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_113:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_113:0 "#Y 진행 중#! — #high 참호에서 솟아오르는 교회#!\n#F 노동자들이 외부에서 블록을 깎는 만큼 내부에서도 블록을 비우고, 천천히 십자가 모양의 교회가 움푹 들어간 안뜰에 자유롭게 서 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_113:0 "#G 완료#! — #high 참호에서 솟아오르는 교회#!\n#F 노동자들이 블록을 외부에서 깎듯이 내부에서도 블록을 비우고, 천천히 십자가 모양의 교회가 움푹 들어간 안뜰에 자유롭게 서 있습니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_113:0 "[tv_wonder_ceremony|E]: 참호에서 솟아오르는 교회"
 TV_WONDER_CEREMONY_S5_DESC_113:0 "인부들이 블록을 외부에서 조각하는 만큼 내부에서 블록을 비우고, 천천히 움푹 들어간 안뜰에 십자가 모양의 교회가 자유롭게 서 있습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_113:0 "석공들은 내부에서 돌을 비우고 십자가 모양의 교회가 그 자체의 움푹 들어간 마당에 자유롭게 솟아오릅니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_113:0 "우리는 교회가 자유롭게 서 있는 것을 볼 준비가 되어 있지 않습니다. 돌을 조금 더 닫아 두십시오."
 TV_WONDER_CEREMONY_CARD_ICON_S6_113:0 "@tv_ceremony_paved_road!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_113:0 "#Y 진행 중#! — #high 창문과 터널이 뚫려 있습니다.#!\n#F 십자가 모양의 창문이 교회의 돌담을 뚫고 뚫려 있으며, 좁은 터널이 잘려 지하에 있는 교회와 옆에 새겨진 교회를 연결하고 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_113:0 "#G 완료#! — #high 창문과 터널이 조각되어 있습니다.#!\n#F 십자 모양의 창문이 교회의 돌담을 관통하고 있으며, 좁은 터널이 절단되어 지하에서 옆에 새겨진 교회와 연결됩니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_113:0 "[tv_wonder_ceremony|E]：창문과 터널이 새겨져 있다"
 TV_WONDER_CEREMONY_S6_DESC_113:0 "십자형 창문이 교회의 돌담을 관통하고 좁은 터널이 지하에서 옆에 새겨진 교회와 연결됩니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_113:0 "인부들은 바위를 통해 십자가 모양의 창문을 뚫고 교회와 교회를 연결하는 터널을 절단합니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_113:0 "우리는 벽을 아래의 어둠에게 개방하기 전에 벽이 한동안 견고하게 서 있기를 바랍니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_113:0 "@tv_ceremony_population!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_113:0 "#Y 진행 중#! — #high 작업이 완료되기 전에 순례자들이 도착하다#!\n#F 경이로운 소문이 끌이 끝날 수 있는 것보다 빠르게 퍼지고, 석공들이 여전히 위의 횃불을 들고 작업하는 동안에도 순례자들은 참호에 도착하여 기도하기 시작합니다. 그들.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_113:0 "#G Completed#! — #high 작업이 완료되기 전에 순례자들이 도착하다#!\n#F 경이로운 소문이 끌이 끝날 수 있는 것보다 빠르게 퍼지고, 석공들이 여전히 위의 횃불을 들고 일하는 동안에도 순례자들은 참호에 도착하여 기도하기 시작합니다. 그들.#!"
 TV_WONDER_CEREMONY_S7_TITLE_113:0 "[tv_wonder_ceremony|E]：작업이 완료되기 전에 순례자들이 도착함"
 TV_WONDER_CEREMONY_S7_DESC_113:0 "끌이 끝날 수 있는 것보다 경이로운 소문이 빠르게 퍼지고, 석공들이 여전히 그 위의 횃불을 들고 작업하는 동안에도 순례자들은 참호에 기도하기 위해 도착하기 시작합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 적절한 순간이 아닐 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_113:0 "그들은 이미 기도하러 왔습니다!"
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_113:0 "석공들은 미완성 돌이 그들의 기도를 받도록 내버려두지 않고 순례자들에게 뒤로 손을 흔들었습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_113:0 "@tv_ceremony_religious_unity!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_113:0 "#Y 진행 중#! — #high 교회는 하나로 봉헌됩니다#!\n#F 사제들은 완성된 참호와 터널을 통과하여 손 십자가 행렬을 이끌고 모든 교회를 하나의 거룩한 단지로 봉헌하며 로하의 축복은 그 은총이 전체에 확장되도록 선언됩니다 왕국.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_113:0 "#G 완료#! — #high 교회는 하나로 봉헌됩니다#!\n#F 사제들은 완성된 참호와 터널을 통과하여 손 십자가 행렬을 이끌고 모든 교회를 하나의 거룩한 단지로 봉헌하며 로하의 축복은 그 은총이 전체에 확장되도록 선언됩니다 왕국.#!"
 TV_WONDER_CEREMONY_S8_TITLE_113:0 "[tv_wonder_ceremony|E]：교회들은 하나로 봉헌되었습니다"
 TV_WONDER_CEREMONY_S8_DESC_113:0 "성직자들은 완성된 참호와 터널을 통해 손 십자가 행렬을 이끌고 모든 교회를 하나의 신성한 단지로 봉헌하며, 로하의 축복이 왕국 전체에 은총을 확장할 것을 선언합니다.\n\n#weak 의식을 완료하는 데 필요한 대가를 지불하세요. 결과적으로 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_113:0 "성직자들은 완성된 터널을 통해 손 십자가를 들고 모든 교회를 하나의 거룩한 단지로 봉헌합니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_113:0 "우리는 아직 로하의 은혜를 온 왕국 앞에 선포할 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_114:0 "@tv_ceremony_government!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_114:0 "#Y 진행 중#! — #high 총독이 대야적을 선포하다#!\n#F 시뇨리아는 베네치아 아르세날레가 기억 너머로 확장될 것이며, 성문은 숲을 삼키고 유역은 단 한 번에 전쟁 함대를 발사할 것이라고 선언합니다. 조수.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_114:0 "#G 완료#! — #high 총독이 대야적을 선포하다#!\n#F 시뇨리아는 베네치아 아르세날레가 기억 너머로 확장될 것이며, 성문은 숲을 삼키고 유역은 단번에 전쟁 함대를 발사할 것이라고 선언합니다. 조수.#!"
 TV_WONDER_CEREMONY_S1_TITLE_114:0 "[tv_wonder_ceremony|E]: 총독이 대마당을 선포하다"
 TV_WONDER_CEREMONY_S1_DESC_114:0 "시뇨리아는 베네치아 아르세날레가 기억 너머로 확장될 것이며, 그 문은 숲을 삼키고 그 분지는 일제히 전쟁 함대를 발사할 것이라고 선언합니다. 아스날로티가 맹세를 하도록 부름을 받으면 리알토 전역에 종소리가 울립니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_114:0 "Signoria는 법령을 봉인하고 arsenalotti는 종소리가 울리면서 맹세를 맹세합니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_114:0 "종을 잡아!"
 TV_WONDER_CEREMONY_CARD_ICON_S2_114:0 "@tv_ceremony_ship!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_114:0 "#Y 진행 중#! — #high Timber Fleets Down the Adige#!\n#F 오크와 낙엽송이 카도르(Cadore)와 몬텔로(Montello) 숲에서 공화국의 표식 아래 뗏목에 묶여 하류로 떠다닙니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_114:0 "#G Completed#! — #high 목재 함대가 Adige#!\n#F 오크와 낙엽송이 공화국의 표식 아래 뗏목에 묶여 Cadore와 Montello 숲에서 하류로 떠다닙니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_114:0 "[tv_wonder_ceremony|E]:아디제 강을 따라 내려가는 목재 함대"
 TV_WONDER_CEREMONY_S2_DESC_114:0 "참나무와 낙엽송은 공화국의 상징 아래 뗏목에 묶여 Cadore와 Montello의 숲에서 하류로 떠다닙니다. 감독관은 Provveditori all'Arsenale의 원장을 기준으로 각 통나무를 계산합니다.\n\n#weak 의식을 다음 단계로 진행하는 데 필요한 대가를 지불하거나 아직 때가 되지 않은 경우 기다립니다.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_114:0 "감독관은 통나무를 세고 공화국의 금고를 목재 뗏목에 넣습니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_114:0 "감독자들은 장부를 내려놓고 뗏목이 강에 머물도록 했습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_114:0 "@tv_ceremony_religious_influence!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_114:0 "#Y 진행 중#! — #high 로프워크는 축복을 받았습니다#!\n#F 산 피에트로 디 카스텔로의 사제들은 거대한 로프워크인 새로운 타나의 길이를 걷고, 100명의 대마 코일 위에 성수를 뿌립니다. 갤리선.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_114:0 "#G 완료#! — #high 로프워크는 축복받았습니다#!\n#F 산 피에트로 디 카스텔로의 사제들은 새로운 타나, 즉 거대한 로프워크의 길이를 걷고, 백 명을 위한 대마 코일 위에 성수를 뿌립니다. 갤리선.#!"
 TV_WONDER_CEREMONY_S3_TITLE_114:0 "[tv_wonder_ceremony|E]：로프워크는 축복받았습니다"
 TV_WONDER_CEREMONY_S3_DESC_114:0 "산 피에트로 디 카스텔로(San Pietro di Castello)의 사제들은 백 척의 갤리선으로 향하는 대마 코일 위에 성수를 뿌리며 새로운 타나(대형 로프워크) 길이를 따라 걷습니다. 로프 제작자들은 유물 앞에서 길드의 오랜 맹세를 맹세합니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_114:0 "타나에게 축복이 있기를!"
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_114:0 "밧줄 제작자들은 맹세를 저버리고 성수는 뿌리지 않은 채 기다리고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_114:0 "@tv_ceremony_navy_strength!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_114:0 "#Y 진행 중#! — #high 첫 번째 건조 도크가 절단되었습니다.#!\n#F Stonemasons가 Arsenale Nuovo에서 첫 번째 거대한 건조 도크를 석호 진흙에 파고 말뚝을 박았습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_114:0 "#G 완료#! — #high 첫 번째 드라이 도크가 절단되었습니다.#!\n#F 스톤메이슨이 Arsenale Nuovo에서 첫 번째 거대한 드라이 도크를 석호 진흙에 파고 말뚝을 박았습니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_114:0 "[tv_wonder_ceremony|E]: 첫 번째 드라이 도크가 절단되었습니다."
 TV_WONDER_CEREMONY_S4_DESC_114:0 "석공들은 Arsenale Nuovo에서 착공하여 첫 번째 거대한 건조 부두를 석호 진흙으로 자르고 말뚝을 쌓았습니다. 젖은 땅은 목재 더미와 벽돌 벽으로 바뀌고, 공화국의 부유력의 진정한 작업이 시작됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_114:0 "석공들이 첫 번째 더미를 쌓고 공화국의 금이 석호 진흙 속으로 가라앉습니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_114:0 "스페이드를 잡아라!"
 TV_WONDER_CEREMONY_CARD_ICON_S5_114:0 "@tv_ceremony_port!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_114:0 "#Y 진행 중#! — #high 유역 곱하기#!\n#F 유역이 동부 지역을 따라 추가된 후 유역은 덮개가 있는 창고로 둘러싸여 있어 선체가 태양과 폭풍으로부터 보호받을 수 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_114:0 "#G 완료#! — #high The Basins Multiply#!\n#F 유역이 동쪽 구역을 따라 추가된 후 유역은 덮개가 있는 창고로 둘러싸여 있어 선체가 태양과 폭풍으로부터 보호받을 수 있습니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_114:0 "[tv_wonder_ceremony|E]: 분지의 증식"
 TV_WONDER_CEREMONY_S5_DESC_114:0 "동쪽 구역을 따라 분지 뒤에 분지가 추가되었으며, 각 분지는 덮개가 있는 창고로 둘러싸여 있어 선체가 태양과 폭풍으로부터 보호받을 수 있습니다. 감독관들은 이제 용골 발사에 몇 년이 아니라 몇 주가 걸린다고 자랑합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_114:0 "나는 선체가 태양이나 폭풍을 기다릴 필요가 없도록 창고를 높이라고 명령합니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_114:0 "감독관들은 연장을 내려놓고 대야는 반쯤 고리 모양으로 세워져 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_114:0 "@tv_ceremony_cannons!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_114:0 "#Y 진행 중#! — #high The Foundries Roar#!\n#F 청동 주조소는 건설 중인 갤리선에 대포를 던지기 위해 대야 옆에 세워져 있으며 용광로는 밤낮으로 불이 켜져 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_114:0 "#G 완료#! — #high The Foundries Roar#!\n#F 청동 주조소는 건설 중인 갤리선에 대포를 던지기 위해 대야 옆에 세워져 있으며, 용광로에는 밤낮으로 불이 켜져 있습니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_114:0 "[tv_wonder_ceremony|E]: 파운드리의 포효"
 TV_WONDER_CEREMONY_S6_DESC_114:0 "건설 중인 갤리선에 대포를 주조하기 위해 대야 옆에 청동 주물장이 세워져 있으며, 용광로에는 밤낮으로 불이 켜져 있습니다. 아르세날레는 조선소라기보다는 작고 자급자족하는 불과 철의 도시로 보이기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_114:0 "용광로가 포효하자!"
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_114:0 "나는 그들의 시간이 되기 전에 용광로에 불을 붙이지 않을 것이다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_114:0 "@tv_ceremony_efficiency!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_114:0 "#Y 진행중#! — #high 선체 조립 라인#!\n#F 선체가 발사되자마자 거의 빠르게 조립될 수 있도록 조립식 리브, 판자, 리깅이 방대한 매거진에 비축되어 있어 외국 사람들을 놀라게 하는 방법입니다. 특사.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_114:0 "#G 완성#! — #high 선체 조립 라인#!\n#F 선체가 발사되자마자 거의 빠르게 조립될 수 있도록 조립식 리브, 판자, 리깅이 방대한 매거진에 비축되어 있어 외국 사람들을 놀라게 하는 방법입니다. 특사.#!"
 TV_WONDER_CEREMONY_S7_TITLE_114:0 "[tv_wonder_ceremony|E]: 선체 조립 라인"
 TV_WONDER_CEREMONY_S7_DESC_114:0 "선체를 발사하자마자 조립할 수 있도록 조립식 갈비뼈, 판자 및 삭구가 방대한 탄창에 비축되어 있는데, 이는 외국 사절들을 놀라게 하는 방법입니다. Arsenale이 일출과 다음 일출 사이에 조리실을 준비할 수 있다는 소문이 퍼졌습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 적절한 순간이 아닌 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_114:0 "탄창이 열리고, 조수가 운반할 수 있는 만큼 빠르게 선체가 떠오릅니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_114:0 "하룻밤 사이에 아닙니다!"
 TV_WONDER_CEREMONY_CARD_ICON_S8_114:0 "@tv_ceremony_maritime_presence!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_114:0 "#Y 진행 중#! — #high 부센타우로스가 스포살리지오호를 항해하다#!\n#F 승천일에 금박을 입힌 부센타우로스는 아르세날레 성문에서 리도까지 활공하고, 총독은 베니스와 결혼하기 위해 바다에 반지를 던집니다. 그녀가 명령하는 물.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_114:0 "#G 완료#! — #high 부센타우로스가 Sposalizio를 항해합니다#!\n#F 승천일에 금박을 입힌 부센타우로스는 아르세날레 성문에서 리도까지 활공하고 총독은 베니스와 결혼하기 위해 바다에 반지를 던집니다. 그녀가 명령하는 물.#!"
 TV_WONDER_CEREMONY_S8_TITLE_114:0 "[tv_wonder_ceremony|E]: Bucentaur가 Sposalizio를 항해합니다."
 TV_WONDER_CEREMONY_S8_DESC_114:0 "승천일에는 금박을 입힌 부켄타우로스가 아르세날레의 문에서 리도까지 활공하고, 총독은 자신의 반지를 바다에 던져 베네치아를 그녀가 지휘하는 물과 결혼시킵니다. 이제 공화국의 야드는 아드리아해에서 본 경쟁 함대를 능가할 준비가 되어 있습니다.\n\n#weak 행사를 완료하는 데 필요한 가격을 지불하세요. 결과적으로 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_114:0 "나는 이 반지를 바다에 던지고 베네치아가 지배하는 바다와 결혼합니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_114:0 "Bucentaur는 여전히 정박되어 있으며 바다는 1년 더 미혼 상태가 됩니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_115:0 "@tv_ceremony_trade_advantage!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_115:0 "#Y 진행 중#! — #high 술탄이 Entrepot을 선포하다#!\n#F 말라카의 술탄은 각 상인 국가의 샤반다르인 항구 수장을 소환하고 모든 함대가 몬순을 수용할 수 있도록 항구를 확장해야 한다고 선언합니다. 가져옵니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_115:0 "#G 완료#! — #high 술탄은 Entrepot을 선포합니다#!\n#F 말라카의 술탄은 각 상인 국가의 샤반다르인 항구 수장을 소환하고 모든 함대가 몬순을 수용할 수 있도록 항구를 확장해야 한다고 선언합니다. 가져옵니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_115:0 "[tv_wonder_ceremony|E]：술탄이 중계를 선포하다"
 TV_WONDER_CEREMONY_S1_DESC_115:0 "말라카의 술탄은 각 상인 국가의 샤반다르인 항구 수장들을 소집하고 몬순이 가져오는 모든 함대를 수용할 수 있도록 항구를 확장할 것이라고 선언합니다. 포고령이 4개 언어로 낭독될 때 해안가를 따라 징이 울립니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_115:0 "우리는 그것을 선언합니다: 몬순이 가져오는 모든 함대는 이곳에 항구를 찾을 것입니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_115:0 "술탄은 법령을 보류했고 징은 지금은 조용해졌습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_115:0 "@tv_ceremony_diplomacy!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_115:0 "#Y 진행 중#! — #high 샤반다르 회의#!\n#F 구자라트족, 중국족, 자바족, 아랍인 구역의 대표자들이 궁전 기둥 아래에 모여 준설 수로 작업을 분담하고 새로운 부설 작업을 하고 있습니다. 부두.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_115:0 "#G 완료#! — #high 샤반다르 회의#!\n#F 구자라트, 중국, 자바, 아랍 구역의 대표자들이 궁전 기둥 아래에 모여 준설 수로 작업을 나누고 새 부설 작업을 분담합니다. 부두.#!"
 TV_WONDER_CEREMONY_S2_TITLE_115:0 "[tv_wonder_ceremony|E]: 샤반다르 회의"
 TV_WONDER_CEREMONY_S2_DESC_115:0 "구자라트족, 중국족, 자바족, 아랍인 구역의 대표자들이 궁전 기둥 아래에 모여 수로 준설 작업과 새로운 부두 건설 작업을 분담합니다. 각 공동체는 관습에 따라 목재, 동전 또는 장인을 서약합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_115:0 "많은 손이 하나의 항구를 세운다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_115:0 "우리는 아직 이 노동을 여러 분기로 나눌 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_115:0 "@tv_ceremony_climate!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_115:0 "#Y 진행 중#! — #high 몬순을 위해 부지가 정리되었습니다#!\n#F 맹그로브 뿌리가 갯벌에서 뽑히고 오래된 조종사가 조수를 판독하여 새 창고가 파도로부터 보호되어야 하는 위치를 표시합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_115:0 "#G 완료#! — #high 몬순을 위해 부지가 정리되었습니다.#!\n#F 맹그로브 뿌리가 갯벌에서 뽑히고 오래된 조종사가 조수를 판독하여 새 창고가 파도로부터 보호되어야 하는 위치를 표시합니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_115:0 "[tv_wonder_ceremony|E]：몬순 기간 동안 사이트가 정리됩니다."
 TV_WONDER_CEREMONY_S3_DESC_115:0 "맹그로브 뿌리는 갯벌에서 뽑히고 오래된 조종사는 조수를 판독하여 새 창고가 파도로부터 보호되어야 하는 위치를 표시합니다. 불교, 이슬람교, 정령 숭배 의식은 모두 개간된 땅에서 각자의 구역에서 거행됩니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_115:0 "조종사와 성직자들은 장마철이 오기 전에 갯벌을 청소합니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_115:0 "조급한 손으로는 조수가 서두르지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_115:0 "@tv_ceremony_port!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_115:0 "#Y 진행 중#! — #high 말뚝이 박혀있습니다.#!\n#F 견목 더미가 해협의 부드러운 바닥에 박혀 있고 거대한 창고 행의 첫 번째 석조 기초가 조수선 위로 올라갑니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_115:0 "#G 완료#! — #high 말뚝이 박혀있습니다.#!\n#F 견목 말뚝이 해협의 부드러운 바닥에 박혀 있고 거대한 창고 행의 첫 번째 석조 기초가 조수선 위로 올라갑니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_115:0 "[tv_wonder_ceremony|E]: 더미가 구동됩니다"
 TV_WONDER_CEREMONY_S4_DESC_115:0 "단단한 나무 더미가 해협의 부드러운 바닥에 박혀 있고 거대한 창고 행의 첫 번째 석조 기초가 조수선 위로 솟아 있습니다. 의회와 관습이었던 것이 이제 해안을 따라 목재, 돌, 땀이 됩니다.\n\n#weak 행사를 다음 단계로 진행하는 데 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_115:0 "우리는 더미를 깊이 쌓고 한때 조언이 있었던 곳에 돌이 대답하도록 합니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_115:0 "해협의 바닥은 사람의 손길이 닿지 않은 채로 놓여 있고, 더미는 마당에서 기다리고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_115:0 "@tv_ceremony_market!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_115:0 "#Y 진행 중#! — #high 신들이 줄지어 솟아오른다#!\n#F 창고 뒤의 창고는 강 하구를 따라 형성되며, 각 창고에는 정향과 육두구, 코로만델 천, 중국 도자기, 구자라트어 등 그 창고를 채운 국가의 인장이 새겨져 있습니다. 인디고.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_115:0 "#G 완료#! — #high 신들이 줄지어 솟아오른다#!\n#F 창고 이후의 창고는 강 하구를 따라 형성되며, 각 창고에는 정향과 육두구, 코로만델 천, 중국 도자기, 구자라트어 등 그 창고를 채웠던 국가의 인장이 새겨져 있습니다. 인디고.#!"
 TV_WONDER_CEREMONY_S5_TITLE_115:0 "[tv_wonder_ceremony|E]: Godowns가 줄지어 솟아오릅니다."
 TV_WONDER_CEREMONY_S5_DESC_115:0 "창고들이 강 하구를 따라 형성되어 있으며, 각 창고에는 정향과 육두구, 코로만델 천, 중국 도자기, 구자라트 인디고 등 그 나라의 상징이 새겨져 있습니다. 줄이 길어지면서 포터들은 6개 언어로 노래를 부릅니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_115:0 "줄줄이 고다운이 솟아오르고 각 인장은 부두의 몫을 차지합니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_115:0 "우리는 아직 이 선반을 다른 나라의 상품으로 채울 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_115:0 "@tv_ceremony_ship!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_115:0 "#Y 진행 중#! — #high 심해 수로 절단됨#!\n#F 다이버와 준설선이 해협의 접근 범위를 넓혀 가장 큰 중국 정크선과 인도 다우선도 접지 없이 정박할 수 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_115:0 "#G 완료#! — #high 심해 수로 절단됨#!\n#F 다이버와 준설선이 해협의 접근 범위를 넓혀 가장 큰 중국 정크선과 인도 다우선도 접지 없이 정박할 수 있습니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_115:0 "[tv_wonder_ceremony|E]: 딥 채널이 절단됨"
 TV_WONDER_CEREMONY_S6_DESC_115:0 "잠수부와 준설선은 해협의 접근 경로를 넓혀 가장 큰 중국 정크선과 인도 다우선도 좌초 없이 정박할 수 있습니다. 항구 주인은 이제 조수가 배를 떠나게 하지 않는다고 자랑합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_115:0 "다이버와 준설선이 수로를 깊게 파기 때문에 조수가 감히 정크를 쫓아낼 수 없습니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_115:0 "얕은 물은 남아 있고, 항구 주인의 자랑은 헛된 것이 아닙니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_115:0 "@tv_ceremony_tax_base!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_115:0 "#Y 진행 중#! — #high 계량 하우스가 건설되었습니다.#!\n#F A 모든 화물의 무게가 측정되고, 세금이 부과되고, 술탄의 인장 아래 기록되는 거대한 규모의 하우스가 탄생합니다. 그 원장은 말레이어, 타밀어, 중국어 문자로 나란히 보관됩니다. 측면.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_115:0 "#G 완료#! — #high 계량 하우스가 건설되었습니다.#!\n#F 모든 화물의 무게가 측정되고, 세금이 부과되고, 술탄의 인장으로 기록되는 거대한 규모의 집이 세워졌습니다. 원장은 말레이어, 타밀어, 중국어 문자로 나란히 보관됩니다. 측면.#!"
 TV_WONDER_CEREMONY_S7_TITLE_115:0 "[tv_wonder_ceremony|E]：계량 하우스 건설"
 TV_WONDER_CEREMONY_S7_DESC_115:0 "모든 화물의 무게를 측정하고, 세금을 부과하고, 술탄의 인장을 받아 기록하는 거대한 규모의 집이 세워지고, 그 장부는 말레이어, 타밀어, 중국어 문자로 나란히 보관됩니다. 12개 해안의 상인들은 말라카의 계약서가 왕의 약속만큼 중요하다는 사실을 알게 됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_115:0 "이제 우리는 저울을 올리고 우리 봉인은 모든 화물의 무게를 공정하게 측정할 것입니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_115:0 "저울의 기초는 맨손으로 놓여 있고 장부는 여전히 비어 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_115:0 "@tv_ceremony_trade!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_115:0 "#Y 진행 중#! — #high 해협의 언약이 봉인되었습니다#!\n#F 술탄과 모인 샤반다르들은 비단 덮개 아래에서 상인 언약을 맹세하여 말라카에서 무역하는 모든 국가를 관습법에 구속합니다. 바다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_115:0 "#G 완료#! — #high 해협의 계약이 봉인되었습니다#!\n#F 술탄과 모인 샤반다르들은 비단 덮개 아래에서 상인 계약을 맹세하여 말라카에서 무역하는 모든 국가를 관습법에 구속합니다. 바다.#!"
 TV_WONDER_CEREMONY_S8_TITLE_115:0 "[tv_wonder_ceremony|E]：해협의 계약이 봉인되었습니다"
 TV_WONDER_CEREMONY_S8_DESC_115:0 "술탄과 모인 샤반다르들은 비단 덮개 아래에서 상인 계약을 맹세하고 말라카에서 무역하는 모든 국가를 바다의 관습법에 구속합니다. 중항은 완성되었으며, 매 몬순의 배들은 이제 이곳을 두 바다 사이의 가장 부유한 항구라고 부릅니다.\n\n#weak 의식을 완료하는 데 필요한 가격을 지불하세요. 결과적으로 불가사의의 최종 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_115:0 "비단 캐노피 아래 술탄과 샤반다르가 해협의 계약을 봉인합니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_115:0 "우리는 아직 모든 깃발을 하나의 바다 법칙에 묶을 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_116:0 "@tv_ceremony_city_capital!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_116:0 "#Y 진행 중#! — #high 샤 자한이 새 수도를 명명하다#!\n#F 공작 왕좌의 대기실에서 황제는 샤자하나바드가 야무나 강둑에 솟아오르고 그 위에 왕위에 걸맞는 붉은 사암 성채가 세워질 것이라고 명령합니다. 무굴 라인.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_116:0 "#G 완료#! — #high 샤 자한이 새로운 수도를 명명하다#!\n#F 공작 왕좌의 대기실에서 황제는 샤자하나바드가 야무나 강둑에 솟아오르고 그에 걸맞은 붉은 사암 성채로 왕관을 씌울 것이라고 명령합니다. 무굴 라인.#!"
 TV_WONDER_CEREMONY_S1_TITLE_116:0 "[tv_wonder_ceremony|E]：샤 자한이 새 수도로 명명"
 TV_WONDER_CEREMONY_S1_DESC_116:0 "공작 왕좌의 대기실에서 황제는 샤자하나바드가 무굴 혈통에 걸맞는 붉은 사암 성채로 장식된 야무나 강둑에 솟아오를 것이라고 명령합니다. 재단의 가장 상서로운 시간을 정하기 위해 점성가들이 소환됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_116:0 "점성가들이 시간을 정하고 샤자하나바드의 칙령이 내려집니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_116:0 "우리는 아직 이 도시에 이름을 붙일 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_116:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_116:0 "#Y 진행 중#! — #high 라자스탄의 채석장 Answer#!\n#F 붉은 사암 블록의 수송대는 돌푸르 근처 채석장에서 장거리 이동을 시작하며, 각 돌은 도달하기 전에 석공 길드 기호로 표시됩니다. 야무나.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_116:0 "#G 완료#! — #high The Quarries of Rajasthan Answer#!\n#F 붉은 사암 블록의 수송대는 Dholpur 근처 채석장에서 장거리 이동을 시작하며, 각 돌은 도달하기 전에 석공 길드 기호로 표시됩니다. 야무나.#!"
 TV_WONDER_CEREMONY_S2_TITLE_116:0 "[tv_wonder_ceremony|E]：라자스탄 응답의 채석장"
 TV_WONDER_CEREMONY_S2_DESC_116:0 "붉은 사암 블록의 호송대는 Dholpur 근처 채석장에서 장거리 운송을 시작하며, 각 돌에는 Yamuna에 도달하기 전에 석공 길드 표시가 표시되어 있습니다. Ustad Ahmad Lahori의 측량사들이 강둑을 따라 요새의 미래 성벽을 측정하고 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_116:0 "붉은 사암 수송대가 채석장에서 출발하여 야무나 강둑으로 향했습니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_116:0 "채석공은 기다리고 호송대는 한동안 묶여 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_116:0 "@tv_ceremony_river!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_116:0 "#Y 진행 중#! — #high 강은 의식으로 묶여 있다#!\n#F 궁정 사제와 수피교 장로 모두 성벽이 세워질 강변 땅을 축복하고, 황제는 보석으로 장식된 의식용 흙손을 직접 놓는다 박격포.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_116:0 "#G 완료#! — #high 강은 의식으로 묶여 있습니다#!\n#F 궁정 성직자와 수피교 장로 모두 성벽이 세워질 강변 땅을 축복하고 황제는 보석으로 장식된 의식용 흙손을 직접 놓습니다. 박격포.#!"
 TV_WONDER_CEREMONY_S3_TITLE_116:0 "[tv_wonder_ceremony|E]: 강은 의식으로 묶여 있다"
 TV_WONDER_CEREMONY_S3_DESC_116:0 "궁정 사제들과 수피교 장로들 모두 성벽이 세워질 강변 땅을 축복하고, 황제는 보석으로 장식된 의식용 모르타르 흙손을 직접 깔아 놓습니다. 대규모 토공사를 시작하기 위해 주 전역에서 수천 명의 인부들이 모였습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 비용을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_116:0 "의식을 봉인하자!"
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_116:0 "사제들은 기다리지만 강변 땅은 축복받지 못한 채 남아있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_116:0 "@tv_ceremony_crown_estate!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_116:0 "#Y 진행 중#! — #high 지구에서 솟아오르는 성벽#!\n#F 첫 번째 진정한 붉은 사암 코스가 강변을 따라 제자리에 고정되고 라호리 게이트의 윤곽이 지평선을 깨기 시작합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_116:0 "#G 완료#! — #high 지구에서 솟아오르는 성벽#!\n#F 첫 번째 진정한 붉은 사암 코스가 강변을 따라 제자리에 고정되고 라호리 게이트의 윤곽이 지평선을 깨기 시작합니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_116:0 "[tv_wonder_ceremony|E]: 지구에서 솟아오르는 성벽"
 TV_WONDER_CEREMONY_S4_DESC_116:0 "최초의 붉은 사암 코스가 강변을 따라 제자리에 고정되고 라호리 게이트의 윤곽이 지평선을 깨기 시작합니다. 설문 조사이자 축복이었던 것이 이제 돌 위에 쌓인 돌이 되어 달이 지날수록 더욱 높아집니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_116:0 "붉은 사암 코스가 강변을 따라 자리잡고 있습니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_116:0 "벽을 기다리게 하라!"
 TV_WONDER_CEREMONY_CARD_ICON_S5_116:0 "@tv_ceremony_soldiers!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_116:0 "#Y 진행 중#! — #high 라호리 문이 왕관을 썼습니다#!\n#F 차트리스와 메론은 구시가지를 향한 대문을 장식하고 있으며, 요새는 공성 총을 견딜 수 있을 만큼 두껍게 지어졌습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_116:0 "#G 완료#! — #high 라호리 문이 왕관을 썼습니다.#!\n#F 차트리스와 메론은 구시가지를 향한 대문을 장식하고 있으며, 요새는 공성포를 견딜 수 있을 만큼 두껍게 지어졌습니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_116:0 "[tv_wonder_ceremony|E]:라호리 문이 왕관을 쓰다"
 TV_WONDER_CEREMONY_S5_DESC_116:0 "차트리스(Chhatris)와 메론(Merlons)은 구시가지를 향한 대문의 꼭대기에 자리잡고 있으며, 그 요새는 공성포를 견딜 수 있을 만큼 두껍게 지어졌습니다. 페르시아와 중앙아시아의 장인들이 도착하여 궁전 홀을 표시할 피에트라 경막 상감을 시작합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_116:0 "우리는 어떤 공성포도 결코 무너뜨릴 수 없는 차트리스로 이 관문을 장식합니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_116:0 "석공들은 도구를 내려놓았고, 성문의 왕관은 미완성 상태로 서 있었습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_116:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_116:0 "#Y 진행 중#! — #high 관객의 홀 형태#!\n#F Diwan-i-Am은 대리석 기둥 위에 솟아 있고, 그 너머에는 Diwan-i-Khas가 언젠가는 지구상에 낙원이 있다면 그것은 낙원이라는 비문을 새길 모양을 갖추기 시작합니다. this.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_116:0 "#G 완료#! — #high 관객의 홀 형태#!\n#F Diwan-i-Am은 대리석 기둥 위에 솟아 있고, 그 너머에는 Diwan-i-Khas가 언젠가 지구상에 낙원이 있다면 그것은 낙원이라는 비문을 새길 모양을 갖추기 시작합니다. this.#!"
 TV_WONDER_CEREMONY_S6_TITLE_116:0 "[tv_wonder_ceremony|E]: 관객석이 형태를 갖추다"
 TV_WONDER_CEREMONY_S6_DESC_116:0 "Diwan-i-Am은 대리석 기둥 위에 솟아 있고, 그 너머 Diwan-i-Khas는 언젠가 지구상에 낙원이 있다면 바로 이것이라는 비문을 담을 모양을 갖기 시작합니다. 정원은 홀 사이에 페르시아 차르바그 패턴으로 배치되어 있습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_116:0 "천국이 형성되게 해주세요!"
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_116:0 "대리석 기둥은 반쯤 솟아 있고 홀은 다음 계절의 작품을 기다리고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_116:0 "@tv_ceremony_gold!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_116:0 "#Y 진행 중#! — #high 공작 왕좌가 설치됨#!\n#F 황실 경호원의 보호 아래 보석으로 장식된 공작 왕좌가 디완-이-카스로 옮겨져 연단 위에 놓이고, 금과 보석이 대리석을 통해 빛을 발합니다. 스크린.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_116:0 "#G 완료#! — #high 공작 왕좌가 설치됨#!\n#F 황실 경호원의 보호 아래 보석으로 장식된 공작 왕좌가 디완-이-카스로 옮겨져 연단 위에 놓이고, 금과 보석이 대리석을 통해 빛을 발합니다. 스크린.#!"
 TV_WONDER_CEREMONY_S7_TITLE_116:0 "[tv_wonder_ceremony|E]:공작의 왕좌가 설치되었습니다"
 TV_WONDER_CEREMONY_S7_DESC_116:0 "제국 경호원의 보호 아래 보석으로 장식된 공작 왕좌가 디완-이-카스(Diwan-i-Khas)로 옮겨져 연단 위에 놓이고, 대리석 칸막이를 통해 금과 보석이 빛을 발합니다. 마침내 완성된 벽 안에 왕좌가 자리잡는 모습을 보기 위해 법원이 모였습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_116:0 "황실 경호원의 보호를 받으며 공작 왕좌가 모여 있는 법정 앞에 자리를 잡았습니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_116:0 "아직은 아닙니다. 재무부에서 기다리세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S8_116:0 "@tv_ceremony_government!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_116:0 "#Y 진행 중#! — #high 제국의 붉은 성채 스탠드#!\n#F 샤 자한(Shah Jahan)은 완성된 요새 내에서 처음으로 법정에 서고, 샤자하나바드 전역에서 외침꾼들은 제국의 심장이 이제 이 붉은색 뒤에서 뛰고 있다고 선포합니다. 벽.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_116:0 "#G 완료#! — #high 제국의 붉은 성채 스탠드#!\n#F 샤 자한(Shah Jahan)은 완성된 요새 내에서 처음으로 법정에 서고, 샤자하나바드 전역에서 외침꾼들은 제국의 심장이 이제 이 붉은색 뒤에서 뛰고 있다고 선포합니다. 벽.#!"
 TV_WONDER_CEREMONY_S8_TITLE_116:0 "[tv_wonder_ceremony|E]:제국의 붉은 성채 스탠드"
 TV_WONDER_CEREMONY_S8_DESC_116:0 "샤 자한은 완성된 요새 내에서 처음으로 법정에 서며 샤자하나바드 전역에서 외치는 사람들이 이제 이 붉은 성벽 뒤에서 제국의 심장이 뛰고 있다고 선포합니다. 수비대와 정부 모두 왕조보다 오래 지속될 수도에서 새로운 힘을 끌어냅니다.\n\n#weak 의식을 완료하는 데 필요한 대가를 지불하세요. 결과적으로 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_116:0 "우리는 이 붉은 성벽 안에 궁궐을 두고 이 성채를 제국의 고동치는 심장이라고 명명합니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_116:0 "외치는 자들은 입을 다물고 있으며 성채는 최초의 진정한 법정을 기다리고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_117:0 "@tv_ceremony_vegetation!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_117:0 "#Y 진행 중#! — #high 태양왕이 자신의 습지를 선택하다#!\n#F L루이 14세는 베르사유에 있는 그의 아버지의 소박한 사냥 숙소가 정부의 중심지가 되어 기독교계의 모든 궁정을 압도할 것이라고 선언합니다. 그 습지는 물이 빠지고 그 정원은 그 너머까지 뻗어 있습니다. 시력.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_117:0 "#G 완료#! — #high 태양왕이 습지를 선택하다#!\n#F L루이 14세는 베르사유에 있는 그의 아버지의 소박한 사냥 숙소가 정부의 중심지가 되어 기독교계의 모든 궁정을 압도할 것이라고 선언합니다. 그 습지는 물이 빠지고 정원은 그 너머까지 뻗어 있습니다. 시력.#!"
 TV_WONDER_CEREMONY_S1_TITLE_117:0 "[tv_wonder_ceremony|E]：태양왕이 습지를 선택하다"
 TV_WONDER_CEREMONY_S1_DESC_117:0 "루이 14세는 베르사유에 있는 그의 아버지의 소박한 사냥터가 정부의 중심지가 되어 기독교계의 모든 궁정을 압도할 것이며, 그 습지는 배수되고 정원은 시야 너머로 펼쳐질 것이라고 선언합니다. Colbert는 아직 재무부가 상상하지 못한 자금을 찾기 위해 소환되었습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_117:0 "우리는 콜베르에게 아직 상상도 못했던 금고에서 금을 뽑아내라고 요구합니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_117:0 "왕은 재고하고 Colbert의 금 검색은 중단됩니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_117:0 "@tv_ceremony_artistic_skill_icon!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_117:0 "#Y 진행 중#! — #high Le 노트르가 땅을 조사합니다.#!\n#F 앙드레 르 노트르가 밧줄과 나침반을 이용해 습지 공원을 산책하며 언젠가 궁전 중앙 창문에서 1마일 곧장 뻗어나갈 시야를 확보합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_117:0 "#G 완료#! — #high Le 노트르가 땅을 조사합니다#!\n#F 앙드레 르 노트르가 밧줄과 나침반을 이용해 습지 공원을 산책하며 언젠가 궁전 중앙 창문에서 1마일 곧장 뻗어나갈 시야를 확보합니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_117:0 "[tv_wonder_ceremony|E]: 르 노트르가 부지를 조사하다"
 TV_WONDER_CEREMONY_S2_DESC_117:0 "앙드레 르 노트르(Andre Le Notre)는 밧줄과 나침반을 가지고 습지 공원을 산책하며 언젠가 궁전 중앙 창문에서 1마일 곧장 뻗어나갈 광경을 그립니다. 수천 명의 인부들이 아직 지어지지 않은 분수에 물을 공급하기 위해 물길을 바꾸기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우에는 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_117:0 "선이 없는 정원은 왕이 없는 왕국이다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_117:0 "우리는 아직 정원의 방향을 정할 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_117:0 "@tv_ceremony_river!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_117:0 "#Y 진행 중#! — #high 법령에 의해 습지의 배수가 이루어짐#!\n#F 기술자들은 베르사유 계곡의 고인 물을 댐으로 만들고, 왕의 주치의들은 오랫동안 노동자들을 괴롭히는 열병에 대해 경고합니다. 노동.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_117:0 "#G 완료#! — #high 법령에 의해 늪이 배수됩니다#!\n#F 기술자는 베르사유 계곡의 정체된 물을 댐으로 연결하고, 왕의 주치의는 오랫동안 노동자들을 괴롭히는 열병에 대해 경고합니다. 노동.#!"
 TV_WONDER_CEREMONY_S3_TITLE_117:0 "[tv_wonder_ceremony|E]: 법령에 따라 습지의 배수가 이루어졌습니다."
 TV_WONDER_CEREMONY_S3_DESC_117:0 "기술자들은 베르사유 계곡의 고인 물을 댐으로 만들고 수로를 연결하며, 왕의 의사들은 오랜 노동으로 인해 노동자들을 괴롭히는 열병에 대해 경고합니다. 루이스는 아랑곳하지 않고 진흙탕 현장을 직접 방문하여 진행 상황을 표시합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_117:0 "엔지니어들은 의사의 경고에도 불구하고 댐을 앞으로 밀고 나갑니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_117:0 "열이 확인되지 않는 것보다 마른 습지가 지연되는 것이 더 낫습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_117:0 "@tv_ceremony_prestige!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_117:0 "#Y 진행중#! — #high 대리석 마당이 깔려있다#!\n#F 쿠르드마르브르의 첫 번째 돌은 배수된 땅 위에 세워졌고, 한때 옛 사냥터가 있던 곳에 중앙 군단의 윤곽이 솟아오른다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_117:0 "#G 완성#! — #high 대리석 마당이 놓여 있다#!\n#F 쿠르 드 마브르의 첫 번째 돌은 물이 빠진 땅 위에 세워졌고, 한때 옛 사냥터가 있던 곳에 중앙 군단의 윤곽이 솟아오른다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_117:0 "[tv_wonder_ceremony|E]：대리석 코트가 놓여있다"
 TV_WONDER_CEREMONY_S4_DESC_117:0 "Cour de Marbre의 첫 번째 돌은 물이 빠진 땅 위에 놓이고, 한때 오래된 사냥터가 있던 자리에 중앙 군단의 윤곽이 솟아오릅니다. 계획은 마침내 석공, 비계 및 돌의 진정한 노동력에 무너졌습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_117:0 "우리는 우리 손으로 Cour de Marbre의 첫 번째 돌을 놓았습니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_117:0 "석공들은 가만히 서 있고 대리석 뜰은 첫 번째 돌을 기다리고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_117:0 "@tv_ceremony_diplomacy!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_117:0 "#Y 진행 중#! — #high 대사들의 계단 오르기#!\n#F 웅장한 Escalier des Ambassadeurs는 다색 대리석으로 솟아 있으며, 외국 사절들이 왕의 영광에 도달하기 전에 그려진 우화를 지나 올라가야 하도록 설계되었습니다. 존재.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_117:0 "#G 완료#! — #high 대사의 계단 오르기#!\n#F 웅장한 Escalier des Ambassadeurs는 다색 대리석으로 솟아 있으며, 외국 사절이 왕의 영광에 도달하기 전에 그려진 우화를 지나 올라가야 하도록 설계되었습니다. 존재.#!"
 TV_WONDER_CEREMONY_S5_TITLE_117:0 "[tv_wonder_ceremony|E]：대사들의 계단 오르기"
 TV_WONDER_CEREMONY_S5_DESC_117:0 "웅장한 Escalier des Ambassadeurs는 다색 대리석으로 솟아 있으며, 외국 사절이 왕의 존재에 도달하기 전에 왕의 영광에 대한 그림으로 그려진 우화를 지나 올라가도록 설계되었습니다. Le Brun의 작업장은 통치를 찬양하는 캔버스로 궁전을 가득 채웁니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_117:0 "왕의 영광은 아래에서 가장 잘 보입니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_117:0 "우리는 아직 사절들이 우리의 영광을 바라볼 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_117:0 "@tv_ceremony_art_work!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_117:0 "#Y 진행 중#! — #high 거울의 방이 모양을 잡다#!\n#F Mansart의 거대한 갤러리는 지붕이 있고 베니스의 질투심 많은 길드를 지나 물물교환된 수백 개의 거울로 덮여 있으며, 각 유리창에는 높이 17개 이상의 정원이 반사되어 있습니다. windows.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_117:0 "#G 완료#! — #high 형태를 취하는 거울의 방#!\n#F Mansart의 멋진 갤러리는 지붕이 있고 베니스의 질투심 많은 길드를 지나 물물교환된 수백 개의 거울로 덮여 있으며, 각 유리창에는 높이 17개 이상의 정원이 반사되어 있습니다. windows.#!"
 TV_WONDER_CEREMONY_S6_TITLE_117:0 "[tv_wonder_ceremony|E]: 거울의 방이 모습을 갖추다"
 TV_WONDER_CEREMONY_S6_DESC_117:0 "Mansart의 거대한 갤러리는 지붕이 있고 베니스의 질투심 많은 길드를 거쳐 밀수되고 물물교환되는 수백 개의 거울로 윤이 나고 있으며, 각 유리창은 17개의 우뚝 솟은 창문 너머로 정원을 반사합니다. 금도금공과 조각가들은 홀을 시야에서 가리는 비계 아래에서 수년 동안 작업합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_117:0 "길더와 조각가들은 비계 뒤에서 밀수입된 거울로 작업합니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_117:0 "베니스의 질투심 많은 길드조차도 걸작을 서두르지 못합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_117:0 "@tv_ceremony_lake!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_117:0 "#Y 진행 중#! — #high 대운하가 가득 차다#!\n#F 멀리 유레 강에서 물을 끌어와 1마일 길이의 대운하를 채우고, 어느 날 왕은 그곳에서 모의 해전과 곤돌라 행렬을 선보일 예정입니다. 베니스.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_117:0 "#G 완료#! — #high 대운하가 가득 차다#!\n#F 멀리 유레 강에서 물을 끌어와 1마일 길이의 대운하를 채우고, 어느 날 왕은 그곳에서 모의 해전과 곤돌라 행렬을 선보일 예정입니다. 베니스.#!"
 TV_WONDER_CEREMONY_S7_TITLE_117:0 "[tv_wonder_ceremony|E]: 대운하가 채워졌습니다"
 TV_WONDER_CEREMONY_S7_DESC_117:0 "멀리 유레 강에서 물을 끌어와 1마일 길이의 대운하를 채우고, 어느 날 왕은 그곳에서 모의 해전과 베니스가 선물한 곤돌라 행렬을 선보일 예정입니다. 한때 벌거벗은 습지였던 정원은 이제 이탈리아 최고의 정원과 맞먹습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_117:0 "우리는 대운하를 채우도록 유레강의 물을 명령합니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_117:0 "운하바닥은 바짝 말라 있고, 왕의 곤돌라는 해변에서 기다리고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_117:0 "@tv_ceremony_government!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_117:0 "#Y 진행 중#! — #high 법원이 베르사유로 이동#!\n#F 루이 14세는 공식적으로 자신의 정부와 귀족을 루브르 박물관에서 베르사유로 이전하고, 모인 법원은 수천 개의 촛불 아래 완성된 거울의 방을 통해 절차를 진행합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_117:0 "#G 완료#! — #high 법원이 베르사유로 이동#!\n#F L루이 14세는 공식적으로 자신의 정부와 귀족을 루브르 박물관에서 베르사유로 이전하고, 모인 법원은 수천 개의 촛불 아래 완성된 거울의 방을 통해 절차를 진행합니다.#!"
 TV_WONDER_CEREMONY_S8_TITLE_117:0 "[tv_wonder_ceremony|E]: 법원이 베르사유로 이동함"
 TV_WONDER_CEREMONY_S8_DESC_117:0 "루이 14세는 자신의 정부와 귀족을 루브르 박물관에서 베르사유로 공식적으로 이전하고, 모인 법원은 수천 개의 촛불 아래 완성된 거울의 방을 통과합니다. 오늘부터 궁전 자체는 통치의 도구가 되어 귀족들을 태양왕의 시선에 묶어줍니다.\n\n#weak 의식을 완료하려면 필요한 대가를 지불하세요. 결과적으로 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_117:0 "정부가 베르사유로 이동하는 동안 법원은 촛불이 켜진 거울의 방을 통과합니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_117:0 "우리는 아직 루브르 박물관에서 법원을 소환할 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_118:0 "@tv_ceremony_city_capital!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_118:0 "#Y 진행 중#! — #high 틀라토아니가 돌의 길을 선포하다#!\n#F 휴이 틀라토아니가 칼픽스크와 치남파 평의회를 소환하여 테노치티틀란의 섬이 홍수가 일어날 수 없는 둑길로 본토와 연결되어야 한다고 선언합니다. 서버.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_118:0 "#G 완료#! — #high 틀라토아니가 돌의 길을 선포하다#!\n#F 휴이 틀라토아니가 칼픽스크와 치남파 평의회를 소집하여 테노치티틀란의 섬이 홍수가 일어날 수 없는 둑길로 본토와 연결되어야 한다고 선언합니다. 서버.#!"
 TV_WONDER_CEREMONY_S1_TITLE_118:0 "[tv_wonder_ceremony|E]: Tlatoani가 돌의 길을 선포하다"
 TV_WONDER_CEREMONY_S1_DESC_118:0 "Huey Tlatoani는 칼픽스크와 치남파 평의회를 소집하여 테노치티틀란의 섬이 홍수로 인해 절단될 수 없는 둑길에 의해 본토와 연결될 것이라고 선언합니다. 성직자들은 첫 번째 끈이 당겨지기 전에 텍스코코 호수 위에서 징조를 읽습니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우에는 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_118:0 "Tlatoani는 그의 권위를 위임하고 제사장은 물 위에 첫 번째 줄을 던졌습니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_118:0 "내가 약속을 이행하기 전에 사제들이 징조를 다시 한 번 읽어보게 하십시오."
 TV_WONDER_CEREMONY_CARD_ICON_S2_118:0 "@tv_ceremony_vegetation!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_118:0 "#Y 진행 중#! — #high 치남파족이 갈대를 수확합니다.#!\n#F 수중 정원의 농부들은 옥수수와 갈대밭에서 부름을 받아 둑길의 기초를 고정할 엮은 말뚝과 돗자리를 공급합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_118:0 "#G 완료#! — #high 치남파족이 갈대를 수확하다#!\n#F 수중 정원의 농부들은 옥수수와 갈대밭에서 부름을 받아 둑길을 고정할 짠 말뚝과 매트를 공급합니다. 기초.#!"
 TV_WONDER_CEREMONY_S2_TITLE_118:0 "[tv_wonder_ceremony|E]: 치남파들이 갈대를 수확합니다"
 TV_WONDER_CEREMONY_S2_DESC_118:0 "수상 정원의 농부들은 옥수수와 갈대밭에서 둑길의 기초를 고정할 엮은 말뚝과 매트를 공급하기 위해 부름을 받았습니다. 카누 함대는 호숫가 채석장에서 선택한 교차점을 향해 현무암과 화산석을 운반합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_118:0 "농부들은 옥수수를 옆으로 치워두고, 카누 함대는 건널목을 향해 돌을 운반합니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_118:0 "치남파 평의회에서는 수확물을 먼저 모아 달라고 요청합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_118:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_118:0 "#Y 진행 중#! — #high 물은 측량되고 축복받습니다#!\n#F Tlaloc의 사제들은 칼픽스크 측량사와 함께 얕은 곳을 걸어 다니며 호수의 계절적 풍조를 견딜 수 있을 만큼 깊이 말뚝을 박아야 하는 위치를 표시합니다. 팽창.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_118:0 "#G 완료#! — #high 물은 측량되고 축복받습니다#!\n#F Tlaloc의 사제들은 칼픽스크 측량사와 함께 얕은 곳을 걸어 다니며 호수의 계절적 풍수를 견딜 수 있을 만큼 깊이 말뚝을 박아야 하는 위치를 표시합니다. 팽창.#!"
 TV_WONDER_CEREMONY_S3_TITLE_118:0 "[tv_wonder_ceremony|E]：물은 측량되고 축복됩니다"
 TV_WONDER_CEREMONY_S3_DESC_118:0 "Tlaloc의 사제들은 Calpixque 측량사와 함께 얕은 곳을 걸으며 호수의 계절적 파도를 견딜 수 있을 만큼 깊이 말뚝을 박아야 하는 위치를 표시합니다. 코팔과 케찰 깃털을 선택한 각 지점에서 물에 던집니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_118:0 "우리는 Tlaloc이 이 말뚝을 축복할 수 있도록 코팔과 케찰 깃털을 물 위에 던졌습니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_118:0 "측량사들은 제물을 던지기 전에 물이 좀 더 잔잔해지도록 요청합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_118:0 "@tv_ceremony_lake!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_118:0 "#Y 진행 중#! — #high 첫 번째 말뚝이 박혀 있습니다.#!\n#F 수천 명의 노동자들이 목재 더미를 호수 바닥에 가라앉히고 돌과 점토로 채우고, 최초의 진정한 둑길이 섬 가장자리에서 바깥쪽으로 기어나오기 시작합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_118:0 "#G 완료#! — #high 첫 번째 말뚝이 박혀있습니다.#!\n#F 수천 명의 노동자들이 목재 더미를 호수 바닥에 가라앉히고 돌과 점토로 포장하며, 최초의 진정한 둑길이 섬 가장자리에서 바깥쪽으로 기어나오기 시작합니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_118:0 "[tv_wonder_ceremony|E]：첫 번째 말뚝 박기"
 TV_WONDER_CEREMONY_S4_DESC_118:0 "수천 명의 노동자들이 목재 더미를 호수 바닥에 가라앉히고 돌과 점토로 포장하면, 최초의 진정한 둑길이 섬 가장자리에서 바깥쪽으로 기어나오기 시작합니다. 의식과 설문조사였던 것이 이제 도시의 모든 옥상에서 노동력을 볼 수 있게 되었습니다.\n\n#weak 행사를 다음 단계로 진행하는 데 필요한 대가를 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_118:0 "수천 명의 인부들이 목재 더미를 가라앉히고 둑길이 바깥쪽으로 기어가기 시작합니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_118:0 "나는 더미를 치기 전에 일꾼들에게 한 시즌의 휴식을 주고 싶습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_118:0 "@tv_ceremony_paved_road!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_118:0 "#Y 진행 중#! — #high 이즈타팔라파 코즈웨이의 길이가 길어짐#!\n#F 이즈타팔라파로 향하는 남쪽 둑길은 리그 단위로 뻗어 있으며, 멕시카에는 말이 없지만 8명의 기병이 나란히 나란히 설 수 있을 만큼 넓으며 탈착식 나무 다리를 통해 카누가 지나갈 수 있습니다. 아래.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_118:0 "#G 완료#! — #high 이즈타팔라파 둑길의 길이가 길어짐#!\n#F 이즈타팔라파로 향하는 남쪽 둑길은 리그별로 뻗어 있으며, 멕시카에는 말이 없지만 8명의 기병이 나란히 나란히 설 수 있을 만큼 넓습니다. 제거 가능한 나무 다리를 통해 카누가 지나갈 수 있습니다. 아래.#!"
 TV_WONDER_CEREMONY_S5_TITLE_118:0 "[tv_wonder_ceremony|E]：이즈타팔라파(Iztapalapa) 둑길이 길어집니다"
 TV_WONDER_CEREMONY_S5_DESC_118:0 "이즈타팔라파(Iztapalapa)로 향하는 남쪽 둑길은 리그 단위로 뻗어 있으며, 멕시카족은 말을 알지 못하지만 8명의 기병이 나란히 있을 수 있을 만큼 넓으며, 제거 가능한 나무 다리가 있어 카누가 아래로 지나갈 수 있습니다. 상인들은 마지막 돌이 놓이기 전에 미완성 도로를 이용하기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_118:0 "남쪽 둑길은 또 다른 리그로 뻗어 있고, 상인들은 돌이 놓이기 전에 계속 전진합니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_118:0 "석공들은 도로가 더 길어지기 전에 제거 가능한 다리를 장착할 것을 요청했습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_118:0 "@tv_ceremony_river!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_118:0 "#Y 진행 중#! — #high 대수로가 이어집니다.#!\n#F A 두 번째 돌 줄은 차풀테펙으로 가는 둑길을 따라 솟아 있으며, 두 수로를 통해 호수를 가로질러 신선한 샘물을 운반하므로 하나는 청소되고 다른 하나는 흐를 수 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_118:0 "#G 완료#! — #high 대수로가 이어집니다#!\n#F A 두 번째 돌 줄은 차풀테펙으로 가는 둑길을 따라 솟아 있으며, 두 수로를 통해 호수를 가로질러 신선한 샘물을 운반하므로 하나는 청소되고 다른 하나는 흐를 수 있습니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_118:0 "[tv_wonder_ceremony|E]: 대수로가 따라온다"
 TV_WONDER_CEREMONY_S6_DESC_118:0 "두 번째 돌줄은 차풀테펙으로 향하는 둑길을 따라 솟아 있으며, 두 개의 수로를 통해 호수를 가로질러 신선한 샘물을 운반하므로 하나는 청소되고 다른 하나는 흐를 수 있습니다. 가장 건조한 달에도 도시의 우물은 더 이상 기수로 흐르지 않습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_118:0 "드디어 생수!"
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_118:0 "엔지니어들은 물을 길어오기 전에 이중 수로를 테스트해 달라고 요청했습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_118:0 "@tv_ceremony_soldiers!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_118:0 "#Y 진행 중#! — #high 도개교 설정#!\n#F 목재 도개교는 모든 둑길을 따라 간격을 두고 설치되므로 전쟁 시 도시의 방어군이 도로를 끊고 바다 위의 군대를 좌초시킬 수 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_118:0 "#G 완료#! — #high 도개교 설정#!\n#F 목재 도개교는 모든 둑길을 따라 간격을 두고 설치되어 전쟁 시 도시의 방어군이 도로를 끊고 바다 위의 군대를 좌초시킬 수 있습니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_118:0 "[tv_wonder_ceremony|E]: 도개교가 설정되었습니다"
 TV_WONDER_CEREMONY_S7_DESC_118:0 "모든 둑길을 따라 간격을 두고 나무 도개교가 설치되어 있어 전쟁 시 도시의 방어군이 도로를 끊고 바다 위에 있는 군대를 좌초시킬 수 있습니다. 엔지니어와 전사는 Tlatoani의 도로에 적합한 것으로 판단되기 전에 각 경간을 검사합니다.\n\n#weak 행사를 다음 단계로 진행하는 데 필요한 대가를 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_118:0 "엔지니어와 전사는 함께 각 경간이 Tlatoani의 도로에 적합한지 판단합니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_118:0 "아직 가치가 없습니다!"
 TV_WONDER_CEREMONY_CARD_ICON_S8_118:0 "@tv_ceremony_city!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_118:0 "#Y 진행 중#! — #high 테노치티틀란은 해안에 묶여 있습니다#!\n#F 테페야크 둑길의 마지막 돌이 놓여졌고 이제 카누와 행진 기둥이 모두 섬의 수도와 섬의 네 모퉁이 사이를 자유롭게 횡단합니다. 밸리.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_118:0 "#G 완료#! — #high 테노치티틀란은 해안에 묶여 있습니다#!\n#F 테페야크 둑길의 마지막 돌이 놓였고 이제 카누와 행진 기둥이 모두 섬의 수도와 섬의 네 모퉁이 사이를 자유롭게 횡단합니다. 밸리.#!"
 TV_WONDER_CEREMONY_S8_TITLE_118:0 "[tv_wonder_ceremony|E]: 테노치티틀란은 해안에 묶여 있다"
 TV_WONDER_CEREMONY_S8_DESC_118:0 "테페야크 둑길의 마지막 돌이 놓여졌고 이제 카누와 행군 기둥이 모두 섬 수도와 계곡 네 모퉁이 사이를 자유롭게 횡단합니다. 틀라토아니는 도시가 본토와 영원히 결속되어 있으며 호수 자체가 한때 그랬던 것처럼 도시의 시장과 군대가 흐르고 있다고 선언합니다.\n\n#weak 의식을 완료하려면 필요한 가격을 지불하세요. 결과적으로 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_118:0 "마지막 돌이 놓이고 Tlatoani는 도시가 본토와 영원히 연결되어 있음을 선언합니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_118:0 "Calpixque는 마지막 교차점에서 한 번 더 건기를 기다리도록 요청합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_119:0 "@tv_ceremony_government_reform!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_119:0 "#Y 진행 중#! — #high 부르고마스터가 계획을 승인#!\n#F 암스테르담 시의회는 3개 운하 계획을 비준하여 Herengracht, Keizersgracht 및 Prinsengracht가 동심원 호로 옛 중심지를 순환하도록 결정했습니다. 물.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_119:0 "#G 완료#! — #high 부르고마스터가 계획을 승인#!\n#F 암스테르담 시의회는 세 운하 계획을 비준하여 Herengracht, Keizersgracht 및 Prinsengracht가 동심원 호로 구 중심지를 둘러싸도록 결정했습니다. 물.#!"
 TV_WONDER_CEREMONY_S1_TITLE_119:0 "[tv_wonder_ceremony|E]：Burgomasters가 계획을 승인함"
 TV_WONDER_CEREMONY_S1_DESC_119:0 "암스테르담 시의회는 세 개의 운하 계획을 비준하여 Herengracht, Keizersgracht 및 Prinsengracht가 동심원의 호 모양으로 옛 중심지를 둘러싸도록 결정했습니다. 측량사에게는 삽 하나가 착공되기 전에 1년 동안 곡선을 걸어야 합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_119:0 "우리는 지금 여기서 3대 운하 계획을 비준합니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_119:0 "의회는 계획이 한동안 더 먼지를 모으도록 허용합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_119:0 "@tv_ceremony_lake!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_119:0 "#Y 진행 중#! — #high 간척지 조사#!\n#F 랜드 요원과 수력 엔지니어들은 싱겔 너머의 부드러운 간척지를 걸어가며 각 운하의 제방이 지나야 하는 위치를 고정하기 위해 이탄에 표시 기둥을 박습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_119:0 "#G 완료#! — #high 간척지 조사#!\n#F 랜드 요원과 수력 엔지니어는 싱겔 너머 부드러운 간척지를 걸어가며 이탄에 표시 기둥을 박아 각 운하의 둑이 지나야 하는 위치를 고정합니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_119:0 "[tv_wonder_ceremony|E]：간척지 조사"
 TV_WONDER_CEREMONY_S2_DESC_119:0 "토지 대리인과 수력 엔지니어들은 Singel 너머의 부드러운 간척지를 걸어 다니며 각 운하의 제방이 연결되어야 하는 위치를 고정하기 위해 이탄에 표시 기둥을 박습니다. 투자자들은 진흙이 다 빠져나가기 전에 미래의 해안가를 따라 부지를 구독하도록 초대됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_119:0 "라인을 세워라!"
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_119:0 "측량사는 장대를 진흙 속에 방치해 둡니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_119:0 "@tv_ceremony_laborers!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_119:0 "#Y 진행 중#! — #high 이탄이 배수되고 쌓입니다.#!\n#F 풍차와 말이 끄는 펌프는 저지대에서 물을 끌어올리고 바지선은 수천 개의 목재 더미를 가져옵니다. 이곳의 어떤 집도 숲을 진흙 속에 몰아넣지 않고는 설 수 없기 때문입니다. 아래.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_119:0 "#G 완료#! — #high 물이 빠지고 쌓인 이탄#!\n#F 풍차와 말이 끄는 펌프는 저지대에서 물을 끌어올리고 바지선은 수천 개의 목재 더미를 가져옵니다. 이곳의 어떤 집도 숲을 진흙 속에 몰아넣지 않고는 서 있을 수 없기 때문입니다. 아래.#!"
 TV_WONDER_CEREMONY_S3_TITLE_119:0 "[tv_wonder_ceremony|E]: 이탄이 배수되고 쌓입니다"
 TV_WONDER_CEREMONY_S3_DESC_119:0 "풍차와 말이 끄는 펌프는 저지대에서 물을 끌어올리고 바지선은 수천 개의 노르웨이 목재 더미를 가져옵니다. 이곳의 어떤 집도 아래 진흙 속에 숲이 박혀 있지 않으면 서 있을 수 없기 때문입니다. 길드 마스터는 머리 위로 맥주를 부어 첫 번째 더미를 축복합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 또는 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_119:0 "길드 마스터는 첫 번째 더미 위에 맥주를 붓습니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_119:0 "아직은 아닙니다. 먼저 이탄을 말리세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S4_119:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_119:0 "#Y 진행 중#! — #high 첫 번째 제방이 절단되었습니다.#!\n#F 파는 사람들이 Herengracht의 표시된 선을 따라 이탄을 부수고 불과 몇 달 전에 마른 간척지가 서 있던 곳에서 운하 물이 처음으로 채워지기 시작합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_119:0 "#G 완료#! — #high 첫 번째 제방이 절단되었습니다.#!\n#F 굴착기가 헤렌그라흐트의 표시된 선을 따라 이탄을 부수고 불과 몇 달 전만 해도 마른 간척지가 서 있던 곳에서 운하 물이 처음으로 채워지기 시작합니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_119:0 "[tv_wonder_ceremony|E]: 첫 번째 은행이 절단되었습니다."
 TV_WONDER_CEREMONY_S4_DESC_119:0 "채굴자들은 헤렌흐라흐트(Herengracht)의 표시된 선을 따라 이탄을 부수고, 불과 몇 달 전만 해도 마른 간척지가 서 있던 자리에 운하 물이 처음으로 채워지기 시작합니다. 양피지 위에 세운 계획은 마침내 수평선을 따라 진흙, 물, 벽돌이 늘어서게 됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_119:0 "우리는 이탄을 부수고 Herengracht의 물을 유입시킵니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_119:0 "채굴자들은 삽을 내려놓고 더 명확한 신호를 기다립니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_119:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_119:0 "#Y 진행 중#! — #high The Merchant Houses Rise#!\n#F 좁은 벽돌 외관이 새로운 부두를 따라 올라가고, 각 부두에는 바지선에서 다락방까지 물건을 곧바로 들어올릴 수 있는 호이스팅 빔이 장착되어 있으며, 암스테르담의 부유층은 이웃보다 앞서기 위해 경쟁합니다. 스텝 게이블.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_119:0 "#G 완료#! — #high The Merchant Houses Rise#!\n#F 좁은 벽돌 외관이 새로운 부두를 따라 올라가고, 각각의 부두에는 바지선에서 다락방까지 물건을 곧바로 들어올릴 수 있는 호이스팅 빔이 장착되어 있으며, 암스테르담의 부유층은 이웃보다 앞서기 위해 경쟁합니다. 스텝 게이블.#!"
 TV_WONDER_CEREMONY_S5_TITLE_119:0 "[tv_wonder_ceremony|E]：상가 상승"
 TV_WONDER_CEREMONY_S5_DESC_119:0 "좁은 벽돌 정면이 새로운 부두를 따라 올라가고, 각각의 부두에는 게양용 빔이 장착되어 바지선에서 다락방까지 물품을 곧바로 들어올릴 수 있으며, 암스테르담의 부유층은 이웃의 계단식 부두보다 더 건설하기 위해 경쟁합니다. 운하 고리는 토목 공사라기보다는 도시처럼 보이기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_119:0 "단지 계획만 세운 넓은 집보다는 좁은 집이 지어지는 것이 더 좋습니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_119:0 "우리는 아직 박공을 나머지 사람들과 함께 키울 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_119:0 "@tv_ceremony_river!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_119:0 "#Y 진행 중#! — #high Keizersgracht가 절단되었습니다.#!\n#F 두 번째 고리인 Keizersgracht는 섭정 계급의 가장 웅장한 집을 운반하기 위해 더 넓게 파고 있으며, 나무는 예인로를 가리기 위해 일렬로 심어져 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_119:0 "#G 완료#! — #high Keizersgracht가 절단됨#!\n#F 두 번째 고리인 Keizersgracht는 섭정 계급의 가장 웅장한 집을 지을 수 있도록 더 넓게 파고 있으며 나무는 그늘을 만들기 위해 일렬로 심어져 있습니다. 견인 경로.#!"
 TV_WONDER_CEREMONY_S6_TITLE_119:0 "[tv_wonder_ceremony|E]: Keizersgracht가 절단되었습니다."
 TV_WONDER_CEREMONY_S6_DESC_119:0 "두 번째 고리인 Keizersgracht는 섭정 계급의 가장 웅장한 집을 지을 수 있도록 더 넓게 파고 있으며, 그 나무는 예인로를 가리기 위해 균일한 줄로 심어져 있습니다. 바지선은 한때 Singel만이 마을을 경계로 삼았던 두 개의 고리를 통해 물품과 목재를 운반합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_119:0 "섭정들은 새로운 Keizersgracht 견인로를 따라 나무를 심습니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_119:0 "이 반지는 안돼, 아직은 안돼!"
 TV_WONDER_CEREMONY_CARD_ICON_S7_119:0 "@tv_ceremony_market!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_119:0 "#Y 진행 중#! — #high 프린센그라흐트가 링을 닫습니다#!\n#F 외부 프린센그라흐트는 간척지의 마지막 구간을 마침내 절단했으며 창고는 전시보다는 곡물, 향신료 및 목재를 보관하기 위해 평범하고 튼튼하게 지어졌습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_119:0 "#G 완료#! — #high 프린센그라흐트가 링을 닫습니다#!\n#F 외부 프린센그라흐트는 간척지의 마지막 구간을 마침내 절단했으며 창고는 곡물, 향신료 및 목재를 보관하기 위해 평범하고 튼튼하게 지어졌습니다. 디스플레이.#!"
 TV_WONDER_CEREMONY_S7_TITLE_119:0 "[tv_wonder_ceremony|E]: Prinsengracht가 링을 닫습니다."
 TV_WONDER_CEREMONY_S7_DESC_119:0 "외부 Prinsengracht는 마침내 간척지의 마지막 구간을 절단했으며 창고는 전시보다는 곡물, 향신료 및 목재를 보관하기 위해 평범하고 튼튼하게 지어졌습니다. 나침반 고리처럼 동심원으로 배치된 세 개의 운하는 마침내 확장된 도시 전체를 둘러쌉니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_119:0 "우리는 간척지의 마지막 부분을 통해 Prinsengracht를 자릅니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_119:0 "간척지의 마지막 구간은 말뚝 뒤에 사람의 손길이 닿지 않은 채로 서 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_119:0 "@tv_ceremony_trade!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_119:0 "#Y 진행 중#! — #high 환상 무역이 시작됩니다#!\n#F 부르고마스터는 완성된 순환 운하의 개통식을 주재하고 공화국 전역의 상인 바지선은 행렬을 이루어 새로운 수로를 통과합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_119:0 "#G 완료#! — #high 환상 무역이 시작됩니다#!\n#F 부르고마스터는 완성된 순환 운하의 개통식을 주재하고 공화국 전역의 상인 바지선은 행렬을 이루어 새로운 수로를 통과합니다.#!"
 TV_WONDER_CEREMONY_S8_TITLE_119:0 "[tv_wonder_ceremony|E]: 반지 거래 개시"
 TV_WONDER_CEREMONY_S8_DESC_119:0 "부르고마스터들은 완성된 순환 운하의 개통식을 주재하고, 공화국 전역의 상인 바지선들이 행렬을 이루어 새로운 수로를 통과합니다. 암스테르담은 변화했고, 물과 맞닿은 기하학은 이제 황금시대 전체의 무역 엔진이 되었습니다.\n\n#weak 행사를 완료하는 데 필요한 가격을 지불하세요. 그 결과 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_119:0 "물이 도시를 울리는 곳에서는 무역이 이어집니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_119:0 "우리는 아직 공화국 전체에 운하를 열 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_120:0 "@tv_ceremony_religious_influence!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_120:0 "#Y 진행 중#! — #high 성소에 대한 칼리프의 명령#!\n#F 카바를 순회하는 점점 늘어나는 순례자들을 보호하기 위해 성원 알 하람을 확장해야 한다는 소문이 법원에서 나오고, 돌과 서예의 장인들이 소환됩니다. 충실한 땅 건너편에서 왔습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_120:0 "#G 완료#! — #high 성소에 대한 칼리프의 명령#!\n#F 카바를 순회하는 점점 늘어나는 순례자들을 보호하기 위해 성원 알 하람을 확장해야 한다는 소문이 법원에서 나오고, 돌과 서예의 장인들은 충실한 땅 전역에서 소환되었습니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_120:0 "[tv_wonder_ceremony|E]：성소에 대한 칼리프의 명령"
 TV_WONDER_CEREMONY_S1_DESC_120:0 "점점 늘어나는 카바 주변의 순례자들을 보호하기 위해 마스지드 알 하람이 확장될 것이라는 소식이 궁정에서 나오고, 석공과 서예 장인들이 신실한 땅 전역에서 소환됩니다. 하람의 학자들이 모여 성소의 새로운 경계를 정했습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_120:0 "하나님의 종들이 번성할수록 하나님의 집도 성장해야 합니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_120:0 "재무부와 학자들이 모두 준비될 때까지 기다리자."
 TV_WONDER_CEREMONY_CARD_ICON_S2_120:0 "@tv_ceremony_building_needs!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_120:0 "#Y 진행 중#! — #high 돌은 신중하게 선택됨#!\n#F 측량사는 성소 주변의 땅에 표시를 하고, 건축가는 흠 없는 돌을 선택합니다. 합당하지 않은 것은 하나님의 집 근처에 설 수 없기 때문입니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_120:0 "#G 완료#! — #high 돌은 신중하게 선택됩니다#!\n#F 측량사는 성소 주변의 땅에 표시를 하고, 건축가는 흠 없는 돌을 선택합니다. 합당하지 않은 것은 하나님의 집 근처에 설 수 없기 때문입니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_120:0 "[tv_wonder_ceremony|E]：돌은 신중하게 선택됩니다"
 TV_WONDER_CEREMONY_S2_DESC_120:0 "측량사는 성소 주변의 땅에 표시를 하고 건축의 명인은 흠 없는 돌을 선택합니다. 왜냐하면 합당하지 않은 것은 하나님의 집 근처에 설 수 없기 때문입니다. 캐러밴은 먼 지방에서 목재와 대리석을 가져오고 각 짐은 신성한 구역에 가까워지기 전에 검사합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_120:0 "건축자들은 조금이라도 흠이 있는 돌은 모두 거부합니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_120:0 "서둘러는 나중에 갈라지는 돌을 선택합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_120:0 "@tv_ceremony_population!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_120:0 "#Y 진행 중#! — #high 순례자의 길이 깨끗해졌습니다#!\n#F 오래된 아케이드가 서서히 해체되고 카바 주변의 타와프 흐름은 성역의 수호자들이 연구합니다. 그들은 성스러운 것을 방해하지 않고 새로운 아케이드가 세워져야 하는 위치를 표시합니다 회로.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_120:0 "#G 완료#! — #high 순례자들의 길이 깨끗해졌습니다#!\n#F 오래된 아케이드가 부드럽게 해체되고 카바 주변의 타와프 흐름은 성역의 수호자들이 연구합니다. 그들은 성스러운 것을 방해하지 않고 새로운 아케이드가 세워져야 하는 위치를 표시합니다 회로.#!"
 TV_WONDER_CEREMONY_S3_TITLE_120:0 "[tv_wonder_ceremony|E]：순례자들의 길은 깨끗해졌습니다"
 TV_WONDER_CEREMONY_S3_DESC_120:0 "오래된 아케이드는 조심스럽게 해체되고 카바 주변의 타와프 흐름은 신성한 회로를 방해하지 않고 새로운 아케이드가 세워져야 하는 위치를 표시하는 성역의 수호자에 의해 연구됩니다. 새로운 기둥 하나가 세워지기 전에 이맘들이 정리된 땅 위에서 기도를 인도합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_120:0 "우리는 신성한 회로가 결코 깨지지 않도록 이 땅을 청소합니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_120:0 "수호자들은 이렇게 빨리 신성한 땅을 어지럽힐 생각을 하지 않고 남아있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_120:0 "@tv_ceremony_holy_site!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_120:0 "#Y 진행중#! — #high 새로운 아케이드가 뿌리를 내리다#!\n#F 확장된 아케이드의 첫 번째 기초는 신성한 땅에 놓이고, 돌에 끌리는 소리가 계획 회의의 중얼거림을 대신합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_120:0 "#G 완성#! — #high 새로운 아케이드가 뿌리를 내리다#!\n#F 확장된 아케이드의 첫 번째 기초는 신성한 땅에 놓이고, 계획 회의의 중얼거림 대신 돌에 끌을 놓는 소리가 들립니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_120:0 "[tv_wonder_ceremony|E]：새로운 아케이드가 뿌리를 내리다"
 TV_WONDER_CEREMONY_S4_DESC_120:0 "확장된 회랑의 첫 번째 기초는 신성한 땅에 놓였고, 계획 회의의 중얼거림 대신 돌을 끌로 깎는 소리가 들렸습니다. 이제 조사와 기도였던 것이 하나님의 집 주변에서 코스별로 올라갑니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하십시오. 아니면 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_120:0 "첫 번째 기초는 신성한 땅 속으로 깊이 가라앉습니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_120:0 "우리는 첫 번째 돌을 놓기 전에 한 번 더 계획을 연구하는 것이 좋습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_120:0 "@tv_ceremony_construction!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_120:0 "#Y 진행 중#! — #high 대리석 기둥이 곱해짐#!\n#F 대리석 기둥의 줄이 새로운 석조 아치 아래 솟아오릅니다. 각 주두는 멀리 아나톨리아와 페르시아에서 가져온 대가가 조각하여 안뜰을 따라 있는 두 개의 아케이드가 동일하게 반복되지 않도록 합니다. 장식.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_120:0 "#G 완료#! — #high 대리석 기둥 곱하기#!\n#F 대리석 기둥 줄이 새로운 석조 아치 아래 솟아 있으며, 각 주두는 멀리 아나톨리아와 페르시아에서 가져온 대가가 조각하여 안뜰을 따라 있는 두 개의 아케이드가 동일하게 반복되지 않도록 합니다. 장식.#!"
 TV_WONDER_CEREMONY_S5_TITLE_120:0 "[tv_wonder_ceremony|E]：대리석 기둥이 늘어납니다"
 TV_WONDER_CEREMONY_S5_DESC_120:0 "새로운 석조 아치 아래 줄지어 늘어선 대리석 기둥이 솟아 있고 각 주두는 멀리 아나톨리아와 페르시아에서 가져온 대가들이 조각하여 안뜰을 따라 있는 두 개의 아케이드가 동일한 장식을 반복하지 않도록 합니다. 순례자의 흐름이 늘어남에도 성소의 그늘은 깊어집니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_120:0 "먼 나라의 대가들이 각각의 수도를 고유한 작품으로 조각합니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_120:0 "서둘러 세워진 기둥은 비뚤어진 그림자를 드리운다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_120:0 "@tv_ceremony_art_work!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_120:0 "#Y 진행 중#! — #high 키스와가 다시 짜여져 있다#!\n#F 마스터 직공들이 새로운 키스와를 완성합니다. 이 키스와는 금실로 꾸란 구절을 수놓은 거대한 검은 덮개이며, 주변 작업이 완료되면 카바 위에 세워질 준비가 되어 있습니다. 완료.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_120:0 "#G 완성#! — #high 키스와가 다시 짜여졌다#!\n#F 마스터 직공들이 새로운 키즈와를 완성합니다. 이 키즈와는 금실로 수놓은 꾸란 구절과 함께 거대한 검은 덮개이며, 주변 작업이 완료되면 카바 위에 올려질 준비가 되어 있습니다. 완료.#!"
 TV_WONDER_CEREMONY_S6_TITLE_120:0 "[tv_wonder_ceremony|E]:키스와가 다시 짜여졌다"
 TV_WONDER_CEREMONY_S6_DESC_120:0 "직조 전문가들은 꾸란의 구절을 금실로 수 놓은 거대한 검은 덮개인 새로운 키스와를 완성하며, 주변 작업이 완료되면 카바 위에 세워질 준비가 되어 있습니다. 성소의 수호자들이 지켜보는 가운데 성스러운 덮개 작업을 복원하는 장인들.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_120:0 "우리는 하나님의 집을 새롭게 입힐 금실을 의뢰합니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_120:0 "직공들이 바늘을 내려놓았는데, 시의 절반만 금으로 완성되었습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_120:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_120:0 "#Y 진행 중#! — #high 첨탑이 더 높아졌습니다#!\n#F 새로운 첨탑이 확장된 안뜰 위로 솟아오르고, 무에진의 부름은 이제 다르 강 곳곳에서 온 순례자들로 가득 찬 도시 위로 더 멀리 전달됩니다. 알-이슬람.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_120:0 "#G 완료#! — #high 첨탑이 더 높아졌습니다#!\n#F 새로운 첨탑이 확장된 안마당 위로 솟아오르고 무에진의 부름은 이제 다르 강 곳곳에서 온 순례자들로 가득 찬 도시 위로 더 멀리 전달됩니다. 알-이슬람.#!"
 TV_WONDER_CEREMONY_S7_TITLE_120:0 "[tv_wonder_ceremony|E]: 첨탑이 더 높아졌습니다."
 TV_WONDER_CEREMONY_S7_DESC_120:0 "새로운 첨탑이 확장된 안마당 위로 솟아오르고, 그들의 무에진의 부름은 이제 다르 알 이슬람의 모든 곳에서 온 순례자들로 가득 찬 도시 위로 더 멀리까지 전달됩니다. 성소의 수호자들은 한때 주변 거리에서 기도해야 했던 군중을 이제 안뜰에 수용할 수 있다고 보고합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_120:0 "새로운 첨탑이 하늘을 향해 솟아오르며 부풀어 오른 도시 위로 신호를 전달합니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_120:0 "우리는 첨탑이 아래 안뜰을 가리지 않도록 기다리는 것이 좋습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_120:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_120:0 "#Y 진행 중#! — #high 성역이 재헌납됨#!\n#F 확장된 마스지드 알 하람이 카바 주변에서 공식적으로 재헌납됨에 따라 학자들과 고위 인사들이 모였습니다. 안뜰.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_120:0 "#G 완료#! — #high 성역이 재헌납됨#!\n#F 확장된 성원 알-하람이 카바 주변에서 공식적으로 재헌납됨에 따라 학자들과 고위 인사들이 모였습니다. 안뜰.#!"
 TV_WONDER_CEREMONY_S8_TITLE_120:0 "[tv_wonder_ceremony|E]：성소가 재헌납되었습니다"
 TV_WONDER_CEREMONY_S8_DESC_120:0 "확장된 마스지드 알 하람이 공식적으로 카바 주변에 재헌납되면서 학자들과 고위 인사들이 모였습니다. 카바는 안뜰 건너편에서 기도가 들리는 가운데 새로운 키스와가 세워졌습니다. 집으로 돌아오는 순례자들은 이제 하느님의 성소가 이전에는 불가능했던 수의 세계 신자들을 맞이하고 있다는 소식을 전합니다.\n\n#weak 식을 완료하려면 필요한 대가를 지불하세요. 그 결과 경이로운 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_120:0 "학자들과 고위 인사들은 새로운 키스와가 카바 위로 솟아오를 때 성역을 다시 헌납합니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_120:0 "고위 인사들은 그렇게 엄숙한 의식을 서두르려고 하지 않고 재헌납을 보류합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_121:0 "@tv_ceremony_government!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_121:0 "#Y 진행 중#! — #high 황제가 9개 국경을 봉쇄하라고 명령하다#!\n#F 명 조정은 요동에서 간쑤까지의 국경을 벽돌과 봉화의 단일 시스템으로 묶고 9개의 국경 수비대가 하나의 제국 아래 통합되도록 명령했습니다. 위임장.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_121:0 "#G 완료#! — #high 황제가 9개 국경을 봉쇄하라고 명령하다#!\n#F 명 조정은 요동에서 간쑤까지의 국경을 벽돌과 봉화의 단일 시스템으로 묶어야 한다고 명령하고, 9개 국경 수비대는 하나의 제국 아래 통합됩니다 위임장.#!"
 TV_WONDER_CEREMONY_S1_TITLE_121:0 "[tv_wonder_ceremony|E]：황제가 9개 국경을 봉쇄하라고 명령하다"
 TV_WONDER_CEREMONY_S1_DESC_121:0 "명 조정은 요동에서 간쑤까지의 국경을 벽돌과 봉화로 이루어진 단일 시스템으로 묶고 9개 국경 수비대가 하나의 제국 명령 아래 통합되도록 포고했습니다. 각 수비대의 장군들은 새로운 작업의 인장을 받기 위해 베이징으로 소환됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_121:0 "소환된 장군들은 황제의 인장을 받기 위해 무릎을 꿇는다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_121:0 "장군들은 수비대에 남아 있으며 소환장은 아직 발송되지 않았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_121:0 "@tv_ceremony_production_method!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_121:0 "#Y 진행 중#! — #high 변경의 가마에 불이 켜졌습니다.#!\n#F 벽돌 가마가 산기슭에 세워져 이전 왕조의 무너진 흙벽을 대체할 융합된 회색 벽돌을 굽습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_121:0 "#G 완료#! — #high 개척지의 가마에 불이 켜졌습니다.#!\n#F 벽돌 가마가 산 기슭에 세워져 이전의 무너진 흙벽을 대체할 융합된 회색 벽돌을 굽습니다. 왕조.#!"
 TV_WONDER_CEREMONY_S2_TITLE_121:0 "[tv_wonder_ceremony|E]: 개척지의 가마에 불이 켜졌다"
 TV_WONDER_CEREMONY_S2_DESC_121:0 "벽돌 가마는 산기슭에 세워져 이전 왕조의 무너진 흙벽을 대체할 융합된 회색 벽돌을 발사합니다. 노새 호송대는 국경 사령관이 선택한 패스를 향해 석회와 벽돌을 쌓은 지그재그 길을 운반합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_121:0 "가마가 생명을 불어넣는다!"
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_121:0 "가마 주인은 불을 진압하고 더 확실한 노새 열차를 기다리고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_121:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_121:0 "#Y 진행 중#! — #high 주둔군이 고개를 조사합니다.#!\n#F 국경 사령부 장교들이 군 공병들과 함께 능선을 걷고 있으며, 이는 망루가 산 너머 서로 신호 사격이 가능한 범위 내에 서 있어야 하는 위치를 표시합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_121:0 "#G 완료#! — #high 주둔군이 고개를 조사합니다#!\n#F 국경 사령부 장교들이 군 공병들과 함께 능선을 걷고 있으며, 이는 감시탑이 산 너머 서로 신호 사격이 가능한 범위 내에 서 있어야 하는 위치를 표시합니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_121:0 "[tv_wonder_ceremony|E]: 주둔군이 통행로를 조사합니다"
 TV_WONDER_CEREMONY_S3_DESC_121:0 "국경 사령부의 장교들은 군 공병들과 함께 산등성이를 따라 걸으며 감시탑이 산 너머 서로 신호가 닿는 곳에 있어야 하는 위치를 표시합니다. 석재 기초 청소를 시작하기 위해 지역 노동자들이 코비 아래로 징집됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_121:0 "측량관이 능선을 측설한 곳에서 인부들이 공사를 하고 있습니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_121:0 "아직은 아닙니다. 능선이 한 시즌 더 쉬게 해주세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S4_121:0 "@tv_ceremony_defensive_military_stance!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_121:0 "#Y 진행 중#! — #high 첫 번째 벽돌 코스가 건설됨#!\n#F Masons는 Juyongguan 고개 근처의 오래된 굳힌 흙 코어를 향한 첫 번째 융합 벽돌을 설정하고 벽은 흙 성벽에서 왕조의 우뚝 솟은 벽돌 요새로 진정한 변화를 시작합니다. 구상.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_121:0 "#G 완료#! — #high 첫 번째 벽돌 코스가 놓였습니다.#!\n#F Masons는 Juyongguan 고개 근처의 오래된 굳힌 흙 코어를 향한 첫 번째 융합 벽돌을 설정하고 벽은 흙 성벽에서 왕조의 우뚝 솟은 벽돌 요새로 진정한 변화를 시작합니다. 구상.#!"
 TV_WONDER_CEREMONY_S4_TITLE_121:0 "[tv_wonder_ceremony|E]：첫 번째 벽돌 코스가 놓였습니다"
 TV_WONDER_CEREMONY_S4_DESC_121:0 "메이슨은 Juyongguan 고개 근처의 오래된 다진 흙 코어 위에 처음으로 융합된 벽돌을 놓았고, 벽은 흙 성벽에서 왕조가 구상하는 우뚝 솟은 벽돌 요새로 진정한 변형을 시작합니다. 경찰관들은 다음 코스가 시작되기 전에 각 코스를 점검합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 비용을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_121:0 "메이슨은 거용관의 오래된 성벽 위에 첫 번째 벽돌 공사를 했고, 경찰관들은 고개를 끄덕였습니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_121:0 "석공들은 도구를 내려놓았는데, 거용관 앞에는 아직 첫 번째 코스가 아직 공개되지 않았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_121:0 "@tv_ceremony_military_panel!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_121:0 "#Y 진행 중#! — #high 파수대가 능선을 오르다#!\n#F 2층 봉화탑이 일정한 간격으로 능선을 따라 솟아 있으며, 각 봉화탑에는 늑대똥 연기 신호기가 설치되어 있고 통과하는 모습을 지켜볼 병사들을 위한 수비대 구역이 있습니다. 겨울.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_121:0 "#G 완료#! — #high The Watchtowers Climb the Ridges#!\n#F 2층 봉화탑이 일정 간격으로 능선을 따라 솟아 있으며, 각각에는 늑대똥 연기 신호기와 통과를 지켜볼 병사들을 위한 수비대 숙소가 갖춰져 있습니다. 겨울.#!"
 TV_WONDER_CEREMONY_S5_TITLE_121:0 "[tv_wonder_ceremony|E]：파수대가 능선을 오르다"
 TV_WONDER_CEREMONY_S5_DESC_121:0 "2층 봉화탑은 일정 간격으로 능선을 따라 솟아 있으며, 각 봉화탑에는 늑대똥 연기 신호기와 겨울 동안 길을 지켜볼 병사들을 위한 수비대 숙소가 갖춰져 있습니다. 처음으로 벽이 산 꼭대기를 따라 눈에 띄게 구불구불해지기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_121:0 "더 높은 곳 - 모든 능선에 탑이 솟아오르도록 하세요!"
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_121:0 "타워 승무원은 캠프를 중단하고 겨울 동안 능선을 감시하지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_121:0 "@tv_ceremony_warning_icon!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_121:0 "#Y 진행 중#! — #high 9개의 주둔군이 신호 장치를 연결합니다#!\n#F 신호 발사는 Jiayuguan의 경고가 하룻밤 안에 베이징의 외부 방어선에 도달할 때까지 통과하여 테스트됩니다. 화재.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_121:0 "#G 완료#! — #high 9개의 주둔군이 비콘을 연결합니다#!\n#F 신호 발사는 Jiayuguan의 경고가 하룻밤 안에 베이징의 외부 방어선에 도달할 때까지 통과하여 테스트됩니다. 화재.#!"
 TV_WONDER_CEREMONY_S6_TITLE_121:0 "[tv_wonder_ceremony|E]: 9개 주둔군이 비컨을 연결합니다"
 TV_WONDER_CEREMONY_S6_DESC_121:0 "신호 사격은 Jiayuguan의 경고등이 하룻밤 내에 베이징의 외부 방어선에 도달할 때까지 통과하여 테스트되어 9개의 국경 사령부를 하나의 시야와 사격 체계로 묶습니다. 군인과 기병은 완성된 구간을 따라 훈련하여 개척지의 새로운 리듬을 배웁니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_121:0 "라이더들은 밤이 되기 전에 Jiayuguan에서 베이징까지 비컨의 경고를 전달합니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_121:0 "너무 이르다. 이 불의 사슬은 아직 신뢰할 수 없다!"
 TV_WONDER_CEREMONY_CARD_ICON_S7_121:0 "@tv_ceremony_soldiers!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_121:0 "#Y 진행 중#! — #high 관문은 관문으로 강화됩니다#!\n#F 거용관(Juyongguan), 가욕관(Jiayuguan), 산하이관(Shanhaiguan)에 거대한 관문 단지가 솟아 있으며, 각각에는 바비칸, 도개교, 군대를 수용할 수 있을 만큼 강력한 수비대 탑이 갖춰져 있습니다. 베이.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_121:0 "#G 완료#! — #high 관문은 관문으로 강화됩니다#!\n#F 거용관, 가욕관, 산하이관에는 거대한 관문 단지가 솟아 있으며, 각각에는 바비칸, 도개교, 군대를 수용할 수 있을 만큼 강력한 수비대 탑이 갖춰져 있습니다. 베이.#!"
 TV_WONDER_CEREMONY_S7_TITLE_121:0 "[tv_wonder_ceremony|E]: 패스는 게이트로 강화됩니다"
 TV_WONDER_CEREMONY_S7_DESC_121:0 "거용관(거용관), 가욕관(가욕관), 산하이관(산하이관)에는 거대한 성문 단지가 솟아 있으며, 각각에는 바비칸, 도개교, 군대를 막을 수 있을 만큼 강력한 수비대 탑이 갖추어져 있습니다. 이제 벽은 산과 사막을 가로질러 깨지지 않고 이어지며, 한때 흩어져 있던 요새가 하나의 연속적인 작업으로 이어집니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_121:0 "우리는 어떤 군대도 우리의 허락 없이 지나갈 수 없도록 이 문을 높입니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_121:0 "문탑은 반만 지어졌고 도개교는 아직 걸려 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_121:0 "@tv_ceremony_government_power!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_121:0 "#Y 진행 중#! — #high 9개 국경이 하나가 되다#!\n#F 황제는 바다에서 사막까지의 성벽이 완성되었고, 산하이관에서 가욕관까지 단결의 증거로 하룻밤 사이에 봉화가 켜졌다는 소식을 받았습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_121:0 "#G 완료#! — #high 9개 국경이 하나가 되다#!\n#F 황제는 바다에서 사막까지의 성벽이 완성되었고, 산해관에서 가욕관까지 단 하룻밤 만에 봉화가 켜졌다는 소식을 듣습니다. 유니티.#!"
 TV_WONDER_CEREMONY_S8_TITLE_121:0 "[tv_wonder_ceremony|E]：9개의 국경이 하나로 서 있다"
 TV_WONDER_CEREMONY_S8_DESC_121:0 "황제는 바다에서 사막까지의 성벽이 완벽하게 세워져 있고, 산하이관(Shanhaiguan)에서 가욕관(Jiayuguan)까지 단결한 증거로 하룻밤 사이에 봉화가 켜졌다는 소식을 듣습니다. 이제 왕조의 군인들은 역사 자체가 무너뜨릴 수 없는 것으로 기억할 국경을 확보하고 있습니다.\n\n#weak 의식을 완료하는 데 필요한 대가를 지불하세요. 결과적으로 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_121:0 "마침내 9개의 국경이 하나로 뭉쳤습니다!"
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_121:0 "우리는 아직 국경 전체를 선언할 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_122:0 "@tv_ceremony_economy_panel!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_122:0 "#Y 진행 중#! — #high Compere가 공인되었습니다#!\n#F 제노바 공화국은 Casa di San Giorgio를 단일 은행으로 인가하여 국가 부채를 관리하고 공화국 이름으로 세금을 징수할 수 있는 권한을 부여했습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_122:0 "#G 완료#! — #high Compere가 공인됨#!\n#F 제노바 공화국은 Casa di San Giorgio를 단일 은행으로 인가하여 국가의 부채를 관리하고 공화국에서 세금을 징수할 수 있는 권한을 부여했습니다. 이름.#!"
 TV_WONDER_CEREMONY_S1_TITLE_122:0 "[tv_wonder_ceremony|E]：컴페어가 공인되었습니다"
 TV_WONDER_CEREMONY_S1_DESC_122:0 "제노바 공화국은 카사 디 산 조르지오(Casa di San Giorgio)를 단일 은행으로 인가하여 국가의 부채를 관리하고 공화국의 이름으로 세금을 징수할 수 있는 권한을 부여했습니다. 상인 행정관들이 로지아에 모여 새로운 기관의 첫 번째 보호자를 선출합니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_122:0 "인장 하나로 묶인 작은 빚 백 개가 금고가 됩니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_122:0 "우리는 아직 우리의 경쟁자를 하나로 묶을 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_122:0 "@tv_ceremony_writer!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_122:0 "#Y 진행 중#! — #high 원장이 통합되었습니다#!\n#F 서기들은 겨울 동안 12개의 흩어져 있는 부채 등록부를 하나의 장부로 병합하며, 각 열은 공화국 자체 세금 명부와 비교하여 두 번 확인됩니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_122:0 "#G 완료#! — #high 원장이 통합되었습니다#!\n#F 서기들은 겨울 내내 일하며 흩어져 있는 십여 개의 부채 기록부를 하나의 장부로 병합하고, 각 열은 공화국 자체 세금과 비교하여 두 번 확인합니다. 롤.#!"
 TV_WONDER_CEREMONY_S2_TITLE_122:0 "[tv_wonder_ceremony|E]：원장이 통합되었습니다"
 TV_WONDER_CEREMONY_S2_DESC_122:0 "사무원들은 겨울 동안 흩어진 12개의 부채 등록부를 한 세트의 장부로 합치고, 각 열은 공화국의 세금 명부와 두 번씩 확인했습니다. 오래된 채권자들이 새 인장 아래 청구서를 다시 작성하기 위해 산 조르지오 궁전 문 앞에 줄을 섰습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_122:0 "직원은 마지막 원장을 닫고 그 열은 최종 동전과 균형을 이룹니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_122:0 "그렇게 빠르지는 않아요!"
 TV_WONDER_CEREMONY_CARD_ICON_S3_122:0 "@tv_ceremony_government!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_122:0 "#Y 진행 중#! — #high 치안 판사가 선서합니다#!\n#F 선출된 보호자와 고대인 협의회는 공증인 앞에서 국가의 수입을 개인 재산과 똑같이 엄격하게 관리할 것을 맹세합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_122:0 "#G 완료#! — #high 치안판사가 맹세합니다#!\n#F 선출된 보호자와 고대인의 의회는 공증인 앞에서 국가의 수입을 자신의 재산과 똑같이 엄격하게 관리할 것을 맹세합니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_122:0 "[tv_wonder_ceremony|E]：치안판사가 선서를 한다"
 TV_WONDER_CEREMONY_S3_DESC_122:0 "선출된 수호자들과 고대인들의 의회는 공증인 앞에서 국가의 수입을 자신의 개인 재산과 마찬가지로 엄격하게 관리할 것을 맹세합니다. 새 은행의 동전 보유고를 잠그고 봉인할 금고에 경비원이 배치되어 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_122:0 "우리는 이 금고를 우리의 것으로 지킬 것을 공증인 앞에서 맹세합니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_122:0 "치안 판사는 금고가 봉쇄되기 전에 맹세하기를 꺼려 주저합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_122:0 "@tv_ceremony_gold_balance!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_122:0 "#Y 진행 중#! — #high 은행 홀이 세워졌습니다.#!\n#F 메이슨들은 제노바 신용의 영속성을 돌로 선언하기 위해 설계된 기둥과 격자 천장이 있는 산 조르지오 궁전 자체의 거대한 아치형 홀 착공을 시작했습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_122:0 "#G 완료#! — #high 은행 홀이 세워졌습니다.#!\n#F 메이슨들은 제노바 신용의 영속성을 돌로 선언하기 위해 설계된 기둥과 격자 천장이 있는 산 조르지오 궁전 자체의 거대한 아치형 홀 착공을 시작했습니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_122:0 "[tv_wonder_ceremony|E]：은행 홀이 세워졌습니다"
 TV_WONDER_CEREMONY_S4_DESC_122:0 "프리메이슨은 Palazzo San Giorgio 자체의 거대한 아치형 홀에서 착공했으며, 그 기둥과 격자형 천장은 석재에 대한 제노바 신용의 영속성을 선언하기 위해 설계되었습니다. 헌장과 맹세였던 것이 이제 벽돌, 대리석, 철로 묶인 문이 됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_122:0 "스톤은 양피지가 잊어버린 것을 기억합니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_122:0 "우리는 아직 이 벽을 위한 대리석을 아끼지 못하고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_122:0 "@tv_ceremony_lock!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_122:0 "#Y 진행 중#! — #high 금고는 철로 봉인되었습니다.#!\n#F 경호실은 궁전의 토대 깊숙이 파여져 있으며, 철로 묶인 동전 상자는 공화국의 문장이 그려진 아치형 천장 아래에 설치되어 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_122:0 "#G 완료#! — #high 금고는 철로 봉인되었습니다.#!\n#F 보호된 금고는 궁전의 토대 깊숙이 파여져 있으며, 철로 묶인 동전 상자는 공화국의 문장이 그려진 아치형 천장 아래에 설치되어 있습니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_122:0 "[tv_wonder_ceremony|E]: 금고는 철로 봉인되어 있습니다"
 TV_WONDER_CEREMONY_S5_DESC_122:0 "경비병이 있는 금고는 궁전의 기초 깊숙이 파여져 있으며, 철로 묶인 동전 상자는 공화국의 문장이 그려진 아치형 천장 아래에 설치되어 있습니다. 공증인은 모든 예금을 3중으로 기록하기 시작합니다. 하나는 예금자용, 하나는 은행용, 다른 하나는 공화국 자체 보관소용입니다.\n\n#weak 식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_122:0 "Smiths는 금고 문을 가로 질러 마지막 철제 볼트를 집으로 몰아 넣습니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_122:0 "급하게 단련된 철은 때가 되기 전에 녹슬었습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_122:0 "@tv_ceremony_trade!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_122:0 "#Y 진행 중#! — #high 식민지 원장이 도착하다#!\n#F 배들은 제노바 식민지의 계좌를 키오스에서 크리미아로 가져오고, 그들의 수입은 은행의 성장하는 신용망에 접혀지며, Casa di San Giorgio는 부채 사무소보다 덜 닮아가기 시작합니다. 상태 내의 상태.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_122:0 "#G 완료#! — #high 식민지 원장 도착#!\n#F Ships는 제노바 식민지의 계좌를 키오스에서 크리미아로 가져오고, 이들의 수입은 은행의 성장하는 신용망에 접혀지며, Casa di San Giorgio는 부채 사무소와 덜 유사해지기 시작합니다. 주 안의 주보다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_122:0 "[tv_wonder_ceremony|E]：식민지 원장이 도착하다"
 TV_WONDER_CEREMONY_S6_DESC_122:0 "선박은 키오스에서 크리미아까지 제노바 식민지의 계좌를 가져오고, 이들의 수입은 은행의 늘어나는 신용망에 접혀지며, 카사 디 산 조르지오는 주 내의 주라기보다는 채무 사무소와 닮아가기 시작합니다. 외국 상인들은 이제 유명해진 인장에 대해 대출을 요청합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_122:0 "우리는 모든 식민지 계좌가 공화국의 단일 신용장에 기록되는 것을 환영합니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_122:0 "치안 판사는 식민지 장부를 지금은 읽지 않은 채로 따로 보관해 두었습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_122:0 "@tv_ceremony_wealth!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_122:0 "#Y 진행 중#! — #high 공공 부채가 재구축되었습니다#!\n#F 은행은 공화국의 공공 부채 전체를 구매, 판매 및 상속할 수 있는 주식으로 재구성합니다. 이 장치는 외국 왕자들이 연구에 사절을 보낼 정도로 효과적인 장치입니다. it.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_122:0 "#G 완료#! — #high 공공 부채가 재구축되었습니다#!\n#F 은행은 공화국의 공공 부채 전체를 구매, 판매 및 상속할 수 있는 주식으로 재구성합니다. 이 장치는 외국 왕자들이 연구를 위해 사절을 보낼 만큼 효과적인 장치입니다. it.#!"
 TV_WONDER_CEREMONY_S7_TITLE_122:0 "[tv_wonder_ceremony|E]：공공 부채가 상환되었습니다"
 TV_WONDER_CEREMONY_S7_DESC_122:0 "은행은 공화국의 공공 부채 전체를 사고팔고 상속할 수 있는 주식으로 재구성하는데, 이는 외국 왕자들이 이를 연구하기 위해 사절을 보낼 정도로 효과적인 장치입니다. 홀을 통과하는 동전과 신용의 양이 모든 초기 예상을 뛰어넘어 늘어나자 금고에서 경비원이 두 배로 늘어납니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_122:0 "은행 직원은 공화국의 부채를 구매, 판매 및 상속 주식으로 나눕니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_122:0 "우리는 우리의 부채가 주식으로 거래되는 것을 볼 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_122:0 "@tv_ceremony_creditworthiness!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_122:0 "#Y 진행 중#! — #high 산 조르지오의 집이 문을 열다#!\n#F 공화국의 행정관이 산 조르지오의 집의 공식 개관을 주재하고 개편된 국가의 첫 번째 공개 계좌에 은행 인장이 찍힌다 부채.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_122:0 "#G 완료#! — #high 산 조르지오의 집이 문을 열다#!\n#F 공화국의 행정관이 산 조르지오의 집의 공식 개관을 주재하며 개편된 국가의 첫 번째 공개 계좌에 은행 인장이 찍힌다 부채.#!"
 TV_WONDER_CEREMONY_S8_TITLE_122:0 "[tv_wonder_ceremony|E]：산 조르지오의 집(Casa di San Giorgio)이 문을 열다"
 TV_WONDER_CEREMONY_S8_DESC_122:0 "공화국의 치안 판사가 Casa di San Giorgio의 공식 개장을 주재하고 은행의 인장이 재편성된 국가 부채의 첫 번째 공개 계정에 부착됩니다. 이제 제노아의 명예는 외국 법원이 수세기 동안 연구하고 부러워할 기관에 달려 있습니다.\n\n#weak 행사를 완료하는 데 필요한 가격을 지불하세요. 결과적으로 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_122:0 "치안 판사는 기다리고 있는 도시로 향하는 카사 디 산 조르지오(Casa di San Giorgio)의 문을 활짝 엽니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_122:0 "Casa di San Giorgio의 문은 한동안 닫혀 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_123:0 "@tv_ceremony_rite_power!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_123:0 "#Y 진행 중#! — #high 장로들이 큰 마운드를 요구하다#!\n#F 카호키아의 추장들과 제사장 장로들이 큰 광장에 모여 중앙 마운드를 더욱 높이 올려야 한다고 선언하고, 그 정상은 미국에 대한 도시의 떠오르는 권력에 걸 맞는 성전을 세울 것이라고 선언합니다. 하단.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_123:0 "#G 완료#! — #high 큰 마운드를 요구하는 장로들#!\n#F 카호키아의 추장들과 제사장 장로들은 큰 광장에 모여 중앙 마운드를 더욱 높이 올릴 것이라고 선언합니다. 하단.#!"
 TV_WONDER_CEREMONY_S1_TITLE_123:0 "[tv_wonder_ceremony|E]：장로들이 큰 마운드를 요구하다"
 TV_WONDER_CEREMONY_S1_DESC_123:0 "카호키아의 추장들과 제사장 겸 장로들은 큰 광장에 모여 중앙 둔덕을 더욱 높이 높이고 그 정상에 미국 바닥에 대한 도시의 떠오르는 힘에 걸맞은 성전을 세울 것이라고 선언했습니다. 참가자들은 다가오는 시즌을 위한 노동력을 소집하기 위해 외곽 농장으로 파견됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_123:0 "주자들은 모든 농장에서 노동력을 소집하기 위해 출발합니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_123:0 "장로들은 선포식을 하고 주자들은 광장에 머물러 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_123:0 "@tv_ceremony_laborers!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_123:0 "#Y 진행 중#! — #high 바구니 운반자들이 모이다#!\n#F 수천명의 사람들이 부름에 응답하고, 각자는 땅바닥 들판에서 흙이 자라는 바닥까지 짠 흙 바구니를 나르는데, 이는 근육만큼이나 헌신적인 노동이다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_123:0 "#G 완료#! — #high 바구니 운반자들이 모이다#!\n#F 수천명의 사람들이 부름에 응답하고, 각자는 흙을 엮은 바구니를 저지대 들판에서 둔덕의 성장 기반까지 운반하는데, 이는 근육만큼 헌신적인 노동입니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_123:0 "[tv_wonder_ceremony|E]：바구니 운반자들이 모이다"
 TV_WONDER_CEREMONY_S2_DESC_123:0 "수천 명이 부름에 응답하고, 각자는 땅바닥의 들판에서 흙이 자라는 바닥까지 엮은 흙 바구니를 나르는데, 이는 근육만큼이나 헌신적인 노동입니다. 새로운 건축 시즌이 시작되어야 하는 지점을 표시하기 위해 우드헨지 포스트에 문의합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_123:0 "바구니가 마침내 행진합니다!"
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_123:0 "운반자들은 바구니를 내려놓고 좀 더 유리한 새벽을 기다립니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_123:0 "@tv_ceremony_area!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_123:0 "#Y 진행 중#! — #high 플라자 평탄화됨#!\n#F 사제 기획자의 지시에 따라 노동자들은 중앙 마운드 주변의 거대한 광장을 평평하게 만들고 그 가장자리를 우드헨지를 관장하는 태양 시야와 동일하게 정렬합니다. 서클.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_123:0 "#G 완료#! — #high 광장 수평화됨#!\n#F 사제 기획자의 지시에 따라 노동자들은 중앙 마운드 주변의 거대한 광장을 평평하게 만들고 그 가장자리를 우드헨지를 관리하는 동일한 태양 시야에 맞춰 정렬합니다. 서클.#!"
 TV_WONDER_CEREMONY_S3_TITLE_123:0 "[tv_wonder_ceremony|E]: 광장이 수평을 이루고 있습니다."
 TV_WONDER_CEREMONY_S3_DESC_123:0 "성직자 기획자의 지시에 따라 일꾼들은 중앙 마운드 주변의 거대한 광장을 수평으로 맞추고 그 가장자리를 우드헨지 서클을 지배하는 동일한 태양 시야에 맞춰 정렬합니다. 마운드 건설이 재개되기 전에 옥수수와 조개 구슬로 만든 공물이 광장 모퉁이에 묻혀 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_123:0 "인부들은 광장의 땅을 고르고 모퉁이에 제물을 묻습니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_123:0 "우리는 아직 이 땅에 우리의 제물을 묻을 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_123:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_123:0 "#Y 진행 중#! — #high 정상 플랫폼이 세워졌습니다.#!\n#F 이제 몽크스 마운드 자체의 눈에 띄는 새로운 테라스에 바구니 가득 흙이 솟아오르고, 플랫폼이 최종 높이에 도달하면 정상 사원의 프레임이 서게 될 위치에 목재 기둥이 표시됩니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_123:0 "#G 완료#! — #high 정상 플랫폼이 세워졌습니다.#!\n#F 이제 몽크스 마운드 자체의 눈에 띄는 새로운 테라스에 바구니 가득 흙이 솟아오르고 플랫폼이 최종 높이에 도달하면 정상 사원의 프레임이 서게 될 위치에 목재 기둥이 표시됩니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_123:0 "[tv_wonder_ceremony|E]：정상 플랫폼이 세워졌습니다"
 TV_WONDER_CEREMONY_S4_DESC_123:0 "이제 바구니에 담긴 흙이 몽크스 마운드 자체의 눈에 띄는 새로운 테라스에 솟아오르고, 플랫폼이 최종 높이에 도달하면 정상 사원의 프레임이 서게 될 위치를 목재 기둥이 표시합니다. 모임과 의식이었던 것이 이제 눈에 띄게 하늘을 향해 쌓인 흙이 됩니다. 층층이 쌓이게 됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_123:0 "몽크스 마운드(Monks Mound) 꼭대기에는 새로운 땅 테라스가 층층이 쌓여 있습니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_123:0 "바구니 운반자들은 잠시 멈추고 마운드의 새로운 층은 반쯤 형성된 상태로 기다립니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_123:0 "@tv_ceremony_soldiers!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_123:0 "#Y 진행 중#! — #high 경내를 둘러싸는 방어벽#!\n#F 기둥이 깊숙이 박혀 있고 나무껍질은 여전히 향기로운 거대한 목재 방어벽이 도시 중심부의 의식 구역을 둘러싸기 시작하여 넓은 공간과 분리된 신성한 땅을 표시합니다. 농장 너머.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_123:0 "#G 완료#! — #high 경사를 둘러싸는 방어벽#!\n#F 기둥이 깊숙이 박혀 있고 나무껍질은 여전히 향기로운 거대한 목재 방어벽이 도시 중심부의 의식 구역을 둘러싸기 시작하여 넓은 공간과 분리된 신성한 땅을 표시합니다. 농장 너머.#!"
 TV_WONDER_CEREMONY_S5_TITLE_123:0 "[tv_wonder_ceremony|E]：경내를 일주하는 팰리세이드"
 TV_WONDER_CEREMONY_S5_DESC_123:0 "기둥이 깊숙이 박혀 있고 나무껍질은 여전히 향기로운 거대한 목재 방어벽이 도시 중심부의 의식 구역을 둘러싸기 시작하여 그 너머에 펼쳐진 농장과 떨어져 있는 신성한 땅을 표시합니다. 감시자들은 회로가 닫힐 때 성벽의 진행 상황을 보고합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_123:0 "회로가 마침내 닫힙니다!"
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_123:0 "감시자들은 카운트를 중단하고 방어벽의 회로는 닫히지 않은 상태로 유지됩니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_123:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_123:0 "#Y 진행 중#! — #high 정상 사원이 액자에 넣어졌습니다.#!\n#F 삼나무 기둥이 완성된 플랫폼 꼭대기에 올라가 몽크스 마운드의 꼭대기가 될 사원의 뼈대를 형성하며, 그 높이는 이제 평평한 바닥을 가로질러 몇 마일 떨어진 곳에서 볼 수 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_123:0 "#G 완료#! — #high 정상 사원이 액자에 들어있습니다.#!\n#F 삼나무 기둥이 완성된 플랫폼 꼭대기에 올라가 몽크 마운드의 꼭대기가 될 사원의 뼈대를 형성합니다. 이제 그 높이가 평평한 바닥을 가로질러 수 마일까지 보입니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_123:0 "[tv_wonder_ceremony|E]: 정상 사원의 액자"
 TV_WONDER_CEREMONY_S6_DESC_123:0 "완성된 플랫폼 위에 삼나무 기둥이 솟아올라 몽크스 마운드(Monks Mound)의 꼭대기가 될 사원의 뼈대를 형성합니다. 그 높이는 이제 평평한 바닥을 가로질러 몇 마일 떨어진 곳까지 보입니다. 장인들이 사원의 지붕 들보를 조각하고 아래의 성직자들은 하지까지 남은 날짜를 표시합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_123:0 "장인들이 삼나무 틀을 들어올리고 사원의 지붕 들보를 조각하기 시작합니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_123:0 "삼나무를 기다리게 해주세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S7_123:0 "@tv_ceremony_building_levels!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_123:0 "#Y 진행 중#! — #high 작은 마운드가 합류했습니다#!\n#F 도시 전역의 위성 마운드가 중앙 플랫폼의 시선에 맞춰 높이지고 모양이 바뀌어 외곽 광장을 신성한 곳에서만 볼 수 있는 단일 의식 기하학으로 묶습니다. 구역 자체.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_123:0 "#G 완료#! — #high 작은 둔덕이 합쳐졌습니다#!\n#F 도시 전역의 위성 둔덕이 중앙 플랫폼의 시선에 맞춰 솟아올라 모양이 바뀌어 외곽 광장을 신성한 곳에서만 볼 수 있는 단일 의식 기하학으로 묶습니다. 구역 자체.#!"
 TV_WONDER_CEREMONY_S7_TITLE_123:0 "[tv_wonder_ceremony|E]：작은 둔덕이 합쳐졌습니다"
 TV_WONDER_CEREMONY_S7_DESC_123:0 "도시 전역의 위성 둔덕은 중앙 플랫폼의 시선에 맞춰 높이 올려지고 모양이 바뀌어 외곽 광장을 신성한 구역에서만 볼 수 있는 하나의 의식용 기하학으로 묶습니다. 정상에서 보이는 도시의 실물 크기는 도시를 건설한 사람들조차 놀라게 합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_123:0 "우리는 이 도시의 모든 언덕을 하나의 신성한 디자인으로 묶습니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_123:0 "위성 둔덕은 정렬되지 않은 상태로 서 있고 기하학적 구조도 미완성입니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_123:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_123:0 "#Y 진행 중#! — #high 도시를 봉헌하는 우드헨지 의식#!\n#F 지정된 동지 새벽에 장로들은 우드헨지 원 안에 모이고, 표시된 두 기둥 사이에서 해가 정확하게 뜨고, 완성된 몽크스 마운드는 우드헨지의 영원한 심장으로 선언됩니다. Cahokia.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_123:0 "#G 완료#! — #high 도시를 봉헌하는 우드헨지 의식#!\n#F 지정된 동지 새벽에 장로들은 우드헨지 원 안에 모이고, 태양은 표시된 두 기둥 사이에서 정확하게 떠오르며, 완성된 몽크스 마운드는 우드헨지의 영원한 심장으로 선언됩니다. Cahokia.#!"
 TV_WONDER_CEREMONY_S8_TITLE_123:0 "[tv_wonder_ceremony|E]: 우드헨지 의식이 도시를 봉헌하다"
 TV_WONDER_CEREMONY_S8_DESC_123:0 "지정된 동지 새벽에, 두 개의 표시된 기둥 사이에서 태양이 정확하게 떠오르면 장로들은 우드헨지 원 안에 모이고, 완성된 몽크스 마운드는 카호키아의 영원한 심장으로 선언됩니다. 이제 도시의 언덕과 광장은 미시시피 전역의 순례자들을 끌어들이는 하나의 신성한 질서에 묶여 서 있습니다.\n\n#weak 행사를 완료하려면 필요한 가격을 지불하세요. 그 결과 경이로운 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_123:0 "마침내 카호키아의 마음이 봉헌되었습니다!"
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_123:0 "장로들은 의식을 보류하고 우드헨지 서클은 새벽에 침묵을 지킵니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_124:0 "@tv_ceremony_city!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_124:0 "#Y 진행 중#! — #high 맘보가 돌 도시의 성장을 선언하다#!\n#F 집권 맘보가 마른 돌을 쌓는 장인들을 소환하여 짐바브웨의 성벽이 더 높고 넓어질 것이라고 선언하여 금 거래자들을 해안에서 고원 고원의 가축 추장까지 묶을 것이라고 선언합니다. 하나의 왕실 인클로저 아래.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_124:0 "#G 완료#! — #high 맘보가 스톤 시티의 성장을 선포하다#!\n#F 집권 맘보가 마른 돌을 쌓는 장인들을 소환하여 짐바브웨의 성벽이 더 높고 넓어질 것이라고 선언하여 금 거래자들을 해안에서 고지의 가축 추장까지 묶을 것이라고 선언합니다. 하나의 왕실 인클로저 아래 고원.#!"
 TV_WONDER_CEREMONY_S1_TITLE_124:0 "[tv_wonder_ceremony|E]：The Mambo, Stone City의 성장을 선포하다"
 TV_WONDER_CEREMONY_S1_DESC_124:0 "지배자인 맘보(Mambo)는 건석 건축의 대가들을 소환하여 대짐바브웨의 성벽이 더욱 높고 넓어질 것이며 금 거래자들을 해안에서 고원 고원의 가축 추장들까지 하나의 왕실 울타리 아래로 묶을 것이라고 선언합니다. 메신저는 이제 노동에 대한 찬사를 보내야 한다는 소식을 외곽의 추장들에게 전합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_124:0 "그러니 벽을 더욱 높이 올리십시오!"
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_124:0 "아직 마스터 빌더를 소환할 준비가 되지 않았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_124:0 "@tv_ceremony_supply!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_124:0 "#Y 진행 중#! — #high 언덕의 채석장이 열렸습니다#!\n#F 화강암은 계곡 위의 언덕에서 자연적으로 벗겨지고 석공 팀은 천연 결을 따라 큰 판을 쪼개기 시작합니다. 박격포.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_124:0 "#G 완료#! — #high 언덕의 채석장이 열렸습니다#!\n#F 화강암은 계곡 위의 언덕에서 자연적으로 벗겨지고 석공 팀은 천연 결을 따라 큰 판을 쪼개기 시작합니다. 박격포.#!"
 TV_WONDER_CEREMONY_S2_TITLE_124:0 "[tv_wonder_ceremony|E]：언덕의 채석장이 열렸습니다"
 TV_WONDER_CEREMONY_S2_DESC_124:0 "화강암은 계곡 위의 언덕에서 자연적으로 벗겨지고, 석공 팀은 천연 결을 따라 큰 판을 나누기 시작합니다. 이는 모르타르를 사용하지 않고 여러 세대에 걸쳐 전수된 공예입니다. 소 운전사들은 늘어나는 노동자 수용소에 식량을 공급하기 위해 헌정 무리를 데려옵니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_124:0 "석공들은 결을 따라 커다란 화강암 판을 쪼개었습니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_124:0 "아직은 아닙니다. 언덕이 한 시즌 더 오래 쉬게 해주세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S3_124:0 "@tv_ceremony_time!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_124:0 "#Y 진행 중#! — #high 점성가들이 새로운 노선을 선택하다#!\n#F 영매자들과 맘보의 상담사들이 언덕 꼭대기와 계곡을 함께 걸으면서 뼈를 주조하여 원추형 탑에서 지켜보는 조상들을 기리기 위해 새로운 곡선 벽이 어디로 달려야 할지 결정합니다. 그림자.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_124:0 "#G 완료#! — #high 점성가들이 새로운 노선을 선택하다#!\n#F 영매사와 맘보의 카운셀러들은 언덕 꼭대기와 계곡을 함께 걸으며 뼈대를 주조하여 원뿔형 탑에서 지켜보는 조상들을 기리기 위해 새로운 곡선 벽이 어디로 달려야 할지 결정합니다. 그림자.#!"
 TV_WONDER_CEREMONY_S3_TITLE_124:0 "[tv_wonder_ceremony|E]: 점쟁이들이 새로운 라인을 선택하다"
 TV_WONDER_CEREMONY_S3_DESC_124:0 "영매들과 맘보의 상담사들은 언덕 꼭대기와 계곡을 함께 걸으며 뼈를 주조하여 원뿔형 탑의 그림자에서 지켜보는 조상들을 기리기 위해 새로운 곡선 벽이 어디로 연결되어야 하는지 결정합니다. 오래된 기초 위에 첫 번째 화강암 블록이 세워지기 전에 소를 도살하여 제물로 바칩니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_124:0 "우리는 주조된 뼈에 주의를 기울이고 새 벽이 놓일 위치를 표시합니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_124:0 "점쟁이들은 뼈를 잠시 동안 보류합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_124:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_124:0 "#Y 진행 중#! — #high 대성곽의 성벽이 새롭게 솟아오른다#!\n#F 석공들은 대성위의 표시된 곡선을 따라 모르타르 없이 화강암 블록을 맞추기 시작합니다. 각 코스는 무게와 기술만으로 도시의 가장 인상적인 시작 부분에 자리잡습니다. 벽.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_124:0 "#G 완료#! — #high The Great Enclosure의 벽이 새롭게 솟아오릅니다#!\n#F 석공들은 Great Enclosure의 표시된 곡선을 따라 모르타르 없이 화강암 블록을 맞추기 시작합니다. 각 코스는 무게와 기술만으로 도시의 가장 인상적인 시작 부분에 자리잡습니다. 벽.#!"
 TV_WONDER_CEREMONY_S4_TITLE_124:0 "[tv_wonder_ceremony|E]: 만리장성의 벽이 다시 솟아오른다"
 TV_WONDER_CEREMONY_S4_DESC_124:0 "석공들은 Great Enclosure의 표시된 곡선을 따라 모르타르 없이 화강암 블록을 맞추기 시작합니다. 각 코스는 무게와 기술에 의해 도시의 가장 인상적인 성벽의 시작 부분에 홀로 자리잡습니다. 점술과 헌정이었던 것이 이제 숙련된 손에 의해 코스별로 돌이 오르는 코스가 됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_124:0 "진실하게 설정된 돌은 그것을 굳게 유지하기 위해 모르타르가 필요하지 않습니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_124:0 "우리는 아직 이 벽이 더 높아지는 것을 볼 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_124:0 "@tv_ceremony_building_levels!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_124:0 "#Y 진행 중#! — #high 원뿔형 탑이 자랍니다#!\n#F 대성막 내의 단단한 원뿔형 탑이 층별로 솟아오릅니다. 그 목적은 맘보 신권에게만 알려져 있으며 왕실의 부의 창고나 왕실의 뿔을 반영한다고 합니다. 소.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_124:0 "#G 완료#! — #high 원뿔형 탑이 자랍니다#!\n#F 대성막 내의 견고한 원뿔형 탑이 층별로 솟아오릅니다. 그 목적은 맘보 신권에게만 알려져 있으며 왕실의 부의 곡물창고 또는 왕실의 뿔을 반영한다고 합니다. 소.#!"
 TV_WONDER_CEREMONY_S5_TITLE_124:0 "[tv_wonder_ceremony|E]: 원추형 타워가 성장합니다."
 TV_WONDER_CEREMONY_S5_DESC_124:0 "Great Enclosure 내의 견고한 원뿔형 탑은 층별로 솟아 있으며, 그 목적은 맘보 신권에게만 알려져 있으며, 왕실의 부를 저장하는 창고나 왕실 가축의 뿔을 반영한다고 합니다. 해안에서 상인들이 도착하여 내륙에서 본 것보다 더 높은 벽을 감상합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_124:0 "신권은 원추형 탑을 하늘을 향해 한 층 더 높였습니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_124:0 "신권이 감추고 있는 것은 오직 시간만이 드러날 것입니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_124:0 "@tv_ceremony_lock!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_124:0 "#Y 진행 중#! — #high 성벽 사이의 통로가 잘려있습니다.#!\n#F 대성곽의 내벽과 외벽 사이에 좁은 돌 통로가 잘려져 있으며, 그 곡선은 들어갈 권리가 부여되지 않은 사람이 의도적으로 내부를 숨기는 것입니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_124:0 "#G 완료#! — #high 성벽 사이에 통로가 잘려있습니다#!\n#F 대성벽의 내벽과 외벽 사이에 좁은 돌 통로가 잘려져 있으며, 그 곡선은 들어갈 권리가 부여되지 않은 사람이 고의적으로 내부를 숨길 수 있습니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_124:0 "[tv_wonder_ceremony|E]: 벽 사이에 통로가 절단되어 있습니다."
 TV_WONDER_CEREMONY_S6_DESC_124:0 "거대한 울타리의 내부 벽과 외부 벽 사이에는 좁은 돌 통로가 절단되어 있으며, 그 곡선은 들어갈 권리가 부여되지 않은 사람이 내부를 고의적으로 숨깁니다. 금, 유리 구슬, 중국 도자기가 현재 맘보가 지배하는 무역로에서 조공을 받기 시작했습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_124:0 "우리는 숨겨진 통로를 잘라내어 우리의 부가 외부인에게 보이지 않도록 명령합니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_124:0 "석공들은 한동안 벽을 깨지지 않은 채로 남겨둔다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_124:0 "@tv_ceremony_paved_road!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_124:0 "#Y 진행 중#! — #high 언덕 단지는 계곡과 연결되어 있습니다#!\n#F 계단과 계단식 벽은 화강암 언덕을 깎아서 고대 언덕 단지를 아래의 계곡 인클로저에 연결하여 영적 권위의 옛 자리를 왕족과 상업의 새로운 중심지에 묶습니다. power.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_124:0 "#G 완료#! — #high 언덕 단지는 계곡과 연결됩니다#!\n#F 계단과 계단식 벽은 화강암 언덕을 깎아 고대 언덕 단지를 아래 계곡 인클로저에 연결하여 영적 권위의 옛 자리를 왕족과 상업의 새로운 중심지에 묶습니다. power.#!"
 TV_WONDER_CEREMONY_S7_TITLE_124:0 "[tv_wonder_ceremony|E]: 언덕 단지는 계곡과 연결되어 있습니다"
 TV_WONDER_CEREMONY_S7_DESC_124:0 "계단과 계단식 벽은 화강암 산비탈을 깎아 고대의 언덕 단지와 아래의 계곡 울타리를 연결하고, 영적 권위의 옛 자리를 왕족과 상업 권력의 새로운 중심지에 연결합니다. 이제 도시 전체가 언덕과 계곡을 가로질러 펼쳐져 있으며, 고원에서는 타의 추종을 불허합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_124:0 "언덕과 계곡이 하나로 합쳐져서 거리가 멀어도 두렵지 않습니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_124:0 "우리는 아직 신성한 언덕을 아래 계곡에 묶을 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_124:0 "@tv_ceremony_trade!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_124:0 "#Y 진행 중#! — #high 대 짐바브웨 스탠드 완료#!\n#F 맘보(Mambo)는 완성된 대 인클로저(Great Enclosure) 내에서 가축 공물과 금 제물의 대규모 모임을 주재하며, 그 벽은 현재 사하라 남쪽에서 가장 높은 건석 구조물입니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_124:0 "#G 완료#! — #high 그레이트 짐바브웨 스탠드 완성#!\n#F 맘보(Mambo)는 완성된 Great Enclosure 내에서 가축 공물과 금 제물의 대규모 모임을 주재하며, 그 벽은 현재 사하라 남쪽에서 가장 높은 건석 구조물입니다.#!"
 TV_WONDER_CEREMONY_S8_TITLE_124:0 "[tv_wonder_ceremony|E]: 그레이트 짐바브웨 완결"
 TV_WONDER_CEREMONY_S8_DESC_124:0 "Mambo는 완성된 Great Enclosure 내에서 대규모 소 공물과 금 제물을 주관하며, 그 벽은 현재 사하라 남쪽에서 가장 높은 건석 구조물입니다. 상인과 추장 모두 이 도시가 고원 전역에 걸쳐 금과 가축의 부의 확실한 중심지이며, 그 성벽은 맘보의 권위를 영구적으로 봉인하고 있다고 선언합니다.\n\n#weak 의식을 완료하려면 필요한 대가를 지불하세요. 결과적으로 불가사의의 마지막 건물이 세워질 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_124:0 "맘보(Mambo)가 주재하여 완성된 벽을 장식하는 최종 헌정 행사를 진행합니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_124:0 "서둘러 세운 벽은 때가 되기 전에 무너진다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_125:0 "@tv_ceremony_city_capital!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_125:0 "#Y 진행 중#! — #high 샤가 새로운 수도를 정하다#!\n#F 샤 압바스는 그의 궁정을 이스파한 쪽으로 돌리고 페르시아의 야망 전체를 담을 수 있을 만큼 넓은 광장을 요구합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_125:0 "#G 완료#! — #high 샤가 새로운 수도를 정하다#!\n#F 샤 압바스는 그의 궁정을 이스파한 쪽으로 돌리고 페르시아의 야망 전체를 담을 수 있을 만큼 넓은 광장을 요구합니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_125:0 "[tv_wonder_ceremony|E]：샤가 새로운 수도를 정하다"
 TV_WONDER_CEREMONY_S1_DESC_125:0 "샤 압바스는 자신의 궁정을 이스파한 쪽으로 돌리고 페르시아의 야망 전체를 담을 수 있을 만큼 넓은 광장을 요구합니다. 측량사들은 자얀데 강둑을 따라 달리고, 외치는 사람들은 모든 지방의 시장에서 법령을 낭독합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우에는 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_125:0 "샤는 자신의 궁정을 이스파한 쪽으로 돌리고 그곳을 새로운 수도로 명명했습니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_125:0 "현명한 샤는 별들이 허락할 때만 왕좌를 움직입니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_125:0 "@tv_ceremony_river!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_125:0 "#Y 진행 중#! — #high 물이 광장으로 향했습니다#!\n#F 엔지니어들이 자얀데 강에서 새로운 수로를 잘라 아직 건설되지 않은 정원과 분수에 물을 공급하고, 공무원들은 광장으로 가는 길을 양보해야 하는 상인 구역을 매입합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_125:0 "#G 완료#! — #high 물이 광장으로 향했습니다#!\n#F 엔지니어들이 자얀데 강에서 새로운 수로를 잘라 아직 건설되지 않은 정원과 분수에 물을 공급하고, 공무원들은 플라자.#!"
 TV_WONDER_CEREMONY_S2_TITLE_125:0 "[tv_wonder_ceremony|E]：물이 사각형을 향하여 향함"
 TV_WONDER_CEREMONY_S2_DESC_125:0 "엔지니어들은 아직 건설되지 않은 정원과 분수에 물을 공급하기 위해 자얀데 강의 새로운 수로를 절단하고, 공무원들은 광장으로 가는 길을 양보해야 하는 상인 구역을 매입합니다. 석공과 타일 장인의 캐러밴이 쉬라즈와 카샨에서 도착하기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_125:0 "우리는 강의 물을 광장 쪽으로 돌리고, 솟아오르는 것을 위해 땅을 정리합니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_125:0 "상인들은 노점상에 머물고 있고, 강의 새로운 수로는 아직 열리지 않은 상태입니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_125:0 "@tv_ceremony_vegetation!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_125:0 "#Y 진행 중#! — #high 차하르바그는 축복을 받았습니다#!\n#F 성직자들은 계획된 거리를 걸으며 차하르바그가 궁전에서 강으로 이어지는 땅을 축복합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_125:0 "#G 완료#! — #high 차하르바그는 축복을 받았습니다#!\n#F 성직자들은 계획된 거리의 길이를 걸으며 차하르바그가 궁전에서 강까지 이어지는 땅을 축복합니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_125:0 "[tv_wonder_ceremony|E]:차하르바그는 축복을 받았습니다"
 TV_WONDER_CEREMONY_S3_DESC_125:0 "성직자들은 계획된 거리의 길이를 걸으며 차하르바그가 궁전에서 강으로 이어지는 땅을 축복합니다. 건축가 우스타드 알리 아크바르 이스파하니(Ustad Ali Akbar Isfahani)가 모인 코트에 광장의 4개 면에 대한 자신의 계획을 제시합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_125:0 "성직자들은 차하르바그가 운영될 땅을 축복하고 건축가는 자신의 계획을 공개합니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_125:0 "우리는 아직 충분히 조사하지 않은 땅을 축복할 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_125:0 "@tv_ceremony_building_needs!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_125:0 "#Y 진행 중#! — #high 최초의 기초가 절단되었습니다.#!\n#F 노동자들이 마침내 착공하여 샤 모스크 앞마당과 알리 카푸의 높은 단의 기초를 무너뜨렸습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_125:0 "#G 완료#! — #high 최초의 기초가 절단되었습니다.#!\n#F 노동자들이 마침내 착공하여 샤 모스크 앞마당과 알리 카푸의 높은 단의 기초를 무너뜨렸습니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_125:0 "[tv_wonder_ceremony|E]：최초의 기초가 절단되었습니다"
 TV_WONDER_CEREMONY_S4_DESC_125:0 "노동자들이 마침내 착공하여 샤 모스크 앞마당과 알리 카푸의 높은 단의 기초를 무너뜨렸습니다. 양피지와 기도였던 것이 이제 참호와 돌이 됩니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_125:0 "노동자들은 마침내 착공하여 첫 번째 기초를 땅에 박았습니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_125:0 "참호에는 표시가 없고 광장 아래 땅도 그대로 남아 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_125:0 "@tv_ceremony_building_levels!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_125:0 "#Y 진행 중#! — #high 알리 카푸(Ali Qapu)가 광장 위로 올라갑니다#!\n#F 알리 카푸(Ali Qapu)의 목재 발코니와 가느다란 기둥이 한 층씩 올라가고, 위쪽 음악실이 언젠가 샤가 폴로 경기를 관람할 장소로 자리잡았습니다. 아래.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_125:0 "#G 완료#! — #high 알리 카푸(Ali Qapu)가 광장 위로 올라갑니다#!\n#F 알리 카푸(Ali Qapu)의 목재 발코니와 가느다란 기둥이 한 층씩 솟아오르고, 그 위층 음악실은 언젠가 샤가 폴로 경기를 관람할 장소로 자리잡았습니다. 아래.#!"
 TV_WONDER_CEREMONY_S5_TITLE_125:0 "[tv_wonder_ceremony|E]：알리 카푸가 광장 위로 올라갑니다"
 TV_WONDER_CEREMONY_S5_DESC_125:0 "알리 카푸(Ali Qapu)의 목재 발코니와 가느다란 기둥은 층별로 올라가며, 상부 음악실은 언젠가 샤(Shah)가 아래에서 폴로 경기를 관람하게 될 곳으로 형성됩니다. 화가들은 리셉션 홀에서 첫 번째 벽화 작업을 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_125:0 "우리는 알리 카푸 계층을 계층별로 높이고 화가를 첫 번째 벽화로 설정합니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_125:0 "목재 발코니는 반쯤 솟아 있고 화가의 붓은 마른 상태로 남아 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_125:0 "@tv_ceremony_art_work!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_125:0 "#Y 진행 중#! — #high 모스크의 돔에 색이 바뀜#!\n#F 타일 마스터가 파란색과 금색의 하프 랑이 타일을 계단식으로 쌓아 샤 모스크의 돔과 정문을 덮고 있으며, 가마는 밤에도 타오르며 가마의 속도를 따라갑니다. 위의 비계.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_125:0 "#G 완료#! — #high 모스크의 돔에 색이 바뀜#!\n#F 타일 마스터가 파란색과 금색의 하프 랑이 타일을 계단식으로 쌓아 샤 모스크의 돔과 정문을 덮고 있으며, 가마는 밤에도 타오르며 가마의 속도를 따라갑니다. 위의 비계.#!"
 TV_WONDER_CEREMONY_S6_TITLE_125:0 "[tv_wonder_ceremony|E]：모스크의 돔이 그 색을 띠고 있습니다"
 TV_WONDER_CEREMONY_S6_DESC_125:0 "타일 장인들이 파란색과 금색의 손잡이 타일로 샤 모스크의 돔과 정문을 덮고 있으며, 가마의 불은 위의 비계와 보조를 맞춰 밤새도록 타오르고 있습니다. 서예가들이 위대한 iwan을 따라 시를 새기기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_125:0 "타일 장인은 파란색과 금색으로 돔을 덮고 서예가는 위대한 이완을 새깁니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_125:0 "돔이 색을 띠기 전에 가마를 식힐 때까지 잠시 기다리세요."
 TV_WONDER_CEREMONY_CARD_ICON_S7_125:0 "@tv_ceremony_market!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_125:0 "#Y 진행 중#! — #high 광장을 감싸는 바자#!\n#F 광장 가장자리에 2층짜리 아치형 아케이드가 있고, 윗층에서는 아직 젖은 회반죽 냄새가 나는 노점상에서 상인들이 이미 흥정을 하고 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_125:0 "#G 완료#! — #high 광장을 감싸는 바자#!\n#F 광장 가장자리 주변에 아치형 아케이드 2층이 있고, 상층부에서는 여전히 젖은 석고 냄새가 나는 노점상에서 상인들이 이미 흥정을 하고 있습니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_125:0 "[tv_wonder_ceremony|E]: 광장을 감싸는 바자회"
 TV_WONDER_CEREMONY_S7_DESC_125:0 "광장 가장자리 주변에 2층짜리 아치형 아케이드가 있고, 상점 주인들은 이미 위층에서 젖은 회반죽 냄새가 나는 노점상에서 이미 흥정을 하고 있습니다. 코트가 여전히 열린 땅에서 플레이하는 폴로 경기를 위해 돌 골대가 북쪽과 남쪽 끝에 설치되어 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_125:0 "아치형 아케이드가 광장 주변을 둘러싸고 있으며, 상점 주인들은 첫 상품을 진열합니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_125:0 "아케이드는 가장자리에 열려 있고 골대는 빈 땅에 세워져 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_125:0 "@tv_ceremony_diplomacy!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_125:0 "#Y 진행 중#! — #high 세계의 절반이 문을 열다#!\n#F 지정된 날, 샤는 경례를 위해 높이 치켜든 드럼과 폴로 망치 가운데 완성된 광장의 길이를 달리고, 구호자들은 이스파한의 절반인 네스프-에 자한을 선포합니다. 세계.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_125:0 "#G 완료#! — #high 세계의 절반이 문을 열다#!\n#F 지정된 날, 샤는 경례를 위해 높이 치켜든 드럼과 폴로 망치 가운데 완성된 광장의 길이를 달리고, 구호자들은 이스파한의 절반인 네스프-에 자한을 선포합니다. 세계.#!"
 TV_WONDER_CEREMONY_S8_TITLE_125:0 "[tv_wonder_ceremony|E]: 세계의 절반이 문을 열다"
 TV_WONDER_CEREMONY_S8_DESC_125:0 "지정된 날, 샤는 경의를 표하는 드럼과 폴로 망치가 울려 퍼지는 가운데 완성된 광장의 길이를 달리고, 구호자들은 이스파한을 세계의 절반인 네스프 자한이라고 선언합니다. 광장의 분수, 바자회, 모스크는 이제 사파비 수도의 지속적인 심장부로 서 있습니다.\n\n#weak 행사를 완료하는 데 필요한 가격을 지불하세요. 결과적으로 경이로운 마지막 건물이 세워질 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_125:0 "드디어 세계의 절반이 된 네스프에자한!"
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_125:0 "북소리가 조용해지고 샤의 행렬은 다음 날을 기다립니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_126:0 "@tv_ceremony_government_reform!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_126:0 "#Y 진행 중#! — #high 황제가 수로를 명하다#!\n#F 황제의 칙령에서는 남북을 연결하는 운하를 확장하고 복원하여 강남의 쌀이 바다의 위험 없이 수도에 도달할 수 있도록 요구합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_126:0 "#G 완료#! — #high 황제가 수로를 명하다#!\n#F 황제의 칙령에서는 남북을 연결하는 운하를 확장하고 복원하여 강남의 쌀이 바다의 위험 없이 수도에 도달할 수 있도록 해야 합니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_126:0 "[tv_wonder_ceremony|E]: 황제가 수로를 칙령하다"
 TV_WONDER_CEREMONY_S1_DESC_126:0 "제국의 칙령은 남북을 연결하는 운하를 확장하고 복원하여 강남의 쌀이 바다의 위험 없이 수도에 도달할 수 있도록 요구합니다. 운하 위원이 지명되고 시작을 위한 인장과 금고가 제공됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_126:0 "그래서 그것은 법령입니다!"
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_126:0 "위원은 봉인을 좀 더 오래 유지합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_126:0 "@tv_ceremony_population!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_126:0 "#Y 진행 중#! — #high 지방에서 손을 보냅니다.#!\n#F 코비 인력 명단이 12개 현에서 도착하고 측량사는 진흙으로 덮인 구간을 다시 고쳐야 함을 표시하는 오래된 예인로를 걷습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_126:0 "#G 완료#! — #high 지방에서 손을 보냅니다.#!\n#F 코비 인력 명단이 12개 현에서 도착하고 측량사는 진흙으로 덮인 구간을 다시 고쳐야 하는 표시가 있는 오래된 견인로를 걷습니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_126:0 "[tv_wonder_ceremony|E]：지방에서 손을 보내다"
 TV_WONDER_CEREMONY_S2_DESC_126:0 "코비 인력 명부는 12개 현에서 도착하고, 측량사는 미사로 덮인 구간을 보수해야 한다는 표시가 있는 오래된 견인로를 따라 걷습니다. 관리들은 길을 따라 있는 모든 강 마을에서 목재, 밧줄, 초안 황소를 징발합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_126:0 "현에서는 코비 명단을 예인로에 소집합니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_126:0 "아직은 아닙니다. 수확이 먼저 이루어지게 하십시오!"
 TV_WONDER_CEREMONY_CARD_ICON_S3_126:0 "@tv_ceremony_rite_power!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_126:0 "#Y 진행 중#! — #high 강의 신들이 작업을 축복해 달라는 요청을 받다#!\n#F 사제들은 새 수문이 세워질 강 사당에 제물을 바치고 엔지니어들은 바지선을 들어올릴 수문에 대한 계획을 마무리합니다. 레벨.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_126:0 "#G 완료#! — #high 강의 신들이 작업을 축복해 달라는 요청을 받다#!\n#F 사제들은 새 수문이 세워질 강의 사당에 제물을 바치고 엔지니어들은 바지선을 들어올릴 수문에 대한 계획을 마무리합니다. 레벨.#!"
 TV_WONDER_CEREMONY_S3_TITLE_126:0 "[tv_wonder_ceremony|E]：강의 신들에게 작품을 축복해 달라는 부탁을 받다"
 TV_WONDER_CEREMONY_S3_DESC_126:0 "성직자들은 새로운 수문이 세워질 강의 사당에 공물을 바치고, 기술자들은 바지선을 층간으로 들어올릴 수문에 대한 계획을 마무리합니다. 첫 번째 곡물 창고는 곡물을 운반해야 하는 교차점에 위치합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_126:0 "우리는 강의 영혼들 앞에 이 제물을 바칩니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_126:0 "사제들은 신사의 제단을 조금 더 방치해 둡니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_126:0 "@tv_ceremony_river!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_126:0 "#Y 진행 중#! — #high Spades가 오래된 강바닥을 무너뜨립니다.#!\n#F Huai 남쪽의 선택된 수문 위치에서 인부들이 마침내 미사 수로를 뚫고 수백 리의 수로를 재구성하는 준설 작업이 본격적으로 시작됩니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_126:0 "#G 완료#! — #high Spades가 오래된 강바닥을 부수다#!\n#F 회강 남쪽의 선택된 수문 위치에서 인부들은 마침내 미사 수로를 뚫고 수백 리의 수로를 재구성할 준설 작업이 시작됩니다. 진심입니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_126:0 "[tv_wonder_ceremony|E]:스페이드가 오래된 강바닥을 깨뜨립니다."
 TV_WONDER_CEREMONY_S4_DESC_126:0 "회강 남쪽의 선택된 수문 지점에서 인부들이 마침내 토사 수로를 뚫고 수백 리의 수로를 재구성하는 준설 작업이 본격적으로 시작됩니다. 한 세대 만에 처음으로 진흙과 오래된 목재를 침대에서 끌어냅니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_126:0 "마침내 오래된 침대가 무너졌습니다!"
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_126:0 "노동자들은 잠시 동안 은행에 삽을 내려놓았다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_126:0 "@tv_ceremony_lock!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_126:0 "#Y 진행 중#! — #high 물길을 따라 솟아오른 자물쇠#!\n#F 돌로 마감된 자물쇠실이 차례로 형태를 갖추었고, 각 문은 물을 채우고 바지선이 올라가는 모습을 지켜보면서 테스트를 거쳤습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_126:0 "#G 완료#! — #high 물길을 따라 솟아오르는 자물쇠#!\n#F 돌로 마감된 수문실이 차례로 모양을 갖추며, 각 문은 물을 채우고 바지선이 올라가는 것을 지켜보는 테스트를 거칩니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_126:0 "[tv_wonder_ceremony|E]: 물길을 따라 자물쇠가 솟아오릅니다."
 TV_WONDER_CEREMONY_S5_DESC_126:0 "돌로 된 자물쇠실은 차례로 형태를 갖추었고, 각 문은 물을 채우고 바지선이 떠오르는 것을 지켜보면서 테스트를 거쳤습니다. 엔지니어들은 첫 번째 수문이 작동하기 시작하면서 늦은 밤 게이트 타이밍을 두고 논쟁을 벌였습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_126:0 "메이슨은 마지막 잠금실을 봉인하고 떠오르는 물의 문을 엽니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_126:0 "아직은 아닙니다. 게이트 타이밍이 아직 불안정합니다!"
 TV_WONDER_CEREMONY_CARD_ICON_S6_126:0 "@tv_ceremony_food!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_126:0 "#Y 진행 중#! — #high 곡창과 예인로 모양이 바뀌다#!\n#F 긴 예인로는 물이 가장 빠른 곳에서 돌로 포장되어 있으며, 계층형 곡물 창고가 환승 지점에 솟아 있으며, 타일 지붕에는 이미 시즌의 첫 번째 공물이 쌓여 있습니다. 쌀.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_126:0 "#G 완료#! — #high 곡창과 예인로가 모양을 갖추다#!\n#F 긴 예인로는 물이 가장 빠른 곳에서 돌로 포장되어 있고, 계층형 곡물 창고가 환승 지점에 솟아 있으며, 타일 지붕에는 이미 시즌의 첫 번째 공물이 쌓여 있습니다. 쌀.#!"
 TV_WONDER_CEREMONY_S6_TITLE_126:0 "[tv_wonder_ceremony|E]：곡창과 예인로의 모습"
 TV_WONDER_CEREMONY_S6_DESC_126:0 "긴 예인로는 물이 가장 빠른 곳에서 돌로 포장되어 있고, 환승 지점에는 계단식 곡물 창고가 솟아 있으며, 기와 지붕에는 이미 계절의 첫 공물 쌀이 쌓여 있습니다. 초안 승무원과 보트 추적자들은 새로운 경로의 리듬에 적응합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_126:0 "우리는 이 곡물창고를 이번 시즌의 첫 헌물로 채웁니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_126:0 "곡물창고 지붕은 한동안 미완성 상태로 남아 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_126:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_126:0 "#Y 진행 중#! — #high Bridges는 생수를 가로지릅니다.#!\n#F 강남 수향 마을의 운하 위에 아치형 다리가 솟아 있고, 완성된 작업을 테스트하기 위해 곡물 바지선의 시험 호송대가 전체 길이의 수문을 통과합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_126:0 "#G 완성#! — #high Bridges는 생수를 가로지릅니다.#!\n#F 강남(Jiangnan) 수향 마을의 운하 위로 아치형 다리가 솟아 있고, 곡물 바지선의 시험 호송대가 완성된 수문을 테스트하기 위해 전체 길이의 수문을 통과합니다. 작동합니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_126:0 "[tv_wonder_ceremony|E]：생수를 잇는 다리"
 TV_WONDER_CEREMONY_S7_DESC_126:0 "강남(Jiangnan) 수역의 운하 위에 아치형 다리가 세워져 있고, 완성된 작업을 테스트하기 위해 곡물 바지선의 시험 호송대가 전체 길이의 수문을 통과하여 보내집니다. 운하가 완성되었다고 선언되기도 전에 강둑을 따라 있는 상인들은 새로운 부두 건설을 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_126:0 "다리가 높아지는 곳에 시장이 따라옵니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_126:0 "아직 판매자가 은행에 청구할 수 있도록 할 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_126:0 "@tv_ceremony_ship!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_126:0 "#Y 진행 중#! — #high 첫 번째 공물 호송대가 북쪽으로 항해합니다.#!\n#F 관리들이 남쪽 수문에 모여 복원된 운하의 첫 번째 완전한 공물 곡물 호송을 시작합니다. 바지선이 문을 하나씩 통과할 때 드럼 소리가 납니다. Capital.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_126:0 "#G 완료#! — #high 첫 번째 공물 호송대가 북쪽으로 항해합니다.#!\n#F 관리들이 남쪽 수문에 모여 복원된 운하의 첫 번째 완전한 공물 곡물 호송대를 출발합니다. Capital.#!"
 TV_WONDER_CEREMONY_S8_TITLE_126:0 "[tv_wonder_ceremony|E]: 첫 번째 추모 호송대가 북쪽으로 항해합니다."
 TV_WONDER_CEREMONY_S8_DESC_126:0 "관리들은 복원된 운하의 첫 번째 전체 조공 곡물 호송을 시작하기 위해 남쪽 수문에 모였습니다. 바지선이 수도를 향해 문을 통과할 때 드럼 소리가 들립니다. 대운하는 이제 제국의 쌀 바구니를 왕좌에 묶고, 그 물은 왕국 전체에 걸쳐 곡물과 상품을 운반합니다.\n\n#weak 의식을 완료하려면 필요한 가격을 지불하세요. 결과적으로 불가사의의 마지막 건물이 세워질 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_126:0 "첫 번째 호송대는 수도를 향해 문을 열고 통과했습니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_126:0 "아직은 아닙니다. 드럼이 한 시즌 더 기다리도록 하세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S1_127:0 "@tv_ceremony_paved_road!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_127:0 "#Y 진행 중#! — #high 사파 잉카가 도로를 명령하다 United#!\n#F 사파 잉카는 정복한 모든 지방이 4개 구역에 걸맞은 단일 도로로 묶여 있도록 명령하고 키푸카마요크는 그 사이의 거리를 기록하기 위해 먼저 보내집니다. 계곡.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_127:0 "#G 완료#! — #high 사파 잉카는 도로를 명령합니다 United#!\n#F 사파 잉카는 정복한 모든 지방을 4개 구역에 걸맞는 단일 도로로 묶도록 명령하고, 키푸카마요크는 그 사이의 거리를 기록하기 위해 먼저 보내집니다. 계곡.#!"
 TV_WONDER_CEREMONY_S1_TITLE_127:0 "[tv_wonder_ceremony|E]：사파 잉카가 도로 연합을 명령하다"
 TV_WONDER_CEREMONY_S1_DESC_127:0 "사파 잉카는 정복한 모든 지방을 4개 구역에 걸맞는 단일 도로로 묶어야 한다고 명령하고, 계곡 사이의 거리를 기록하기 위해 키푸카마요크를 먼저 파견합니다. 주자들은 쿠스코에서 산길을 향해 법령을 들고 다닙니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_127:0 "Sapa Inca는 법령을 봉인하고 주자는 패스를 향해 경주합니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_127:0 "가장 긴 도로라도 측정된 단 한 걸음으로 시작됩니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_127:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_127:0 "#Y 진행 중#! — #high 산 고개를 위해 절단된 돌#!\n#F 미타 노동 부과금 하에 있는 작업 직원들이 가장 가파른 고개를 따라 돌을 포장하는 동안 인티의 사제들은 각 아파체타의 길을 축복합니다 케른.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_127:0 "#G 완료#! — #high 산길을 위해 절단된 돌#!\n#F 미타 노동 부과금 하에 있는 작업 직원들이 가장 가파른 고개를 따라 돌을 포장하는 동안 인티의 사제들은 각 아파체타의 길을 축복합니다 케른.#!"
 TV_WONDER_CEREMONY_S2_TITLE_127:0 "[tv_wonder_ceremony|E]：산길을 위해 잘린 돌"
 TV_WONDER_CEREMONY_S2_DESC_127:0 "미타(mit'a) 노동 부과금을 받는 작업원들은 가장 가파른 고개를 따라 채석장을 포장하고, 인티(Inti)의 사제들은 각 아파체타 돌무더기의 길을 축복합니다. 라마 열차가 협곡 위의 첫 번째 로프 다리를 위한 목재 운반을 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_127:0 "우리는 미타를 부과하고 채석장을 작동시킵니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_127:0 "채석공들은 도구를 내려놓고 다음 시즌을 기다립니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_127:0 "@tv_ceremony_supply!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_127:0 "#Y 진행 중#! — #high 탐보가 표시되었습니다.#!\n#F 측량사는 각 계곡 사이의 하루 행진을 시작하고 주자들, 군인 및 관리들을 보호할 탐보 중간 기지의 지면을 표시합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_127:0 "#G 완료#! — #high 탐보가 표시되었습니다.#!\n#F 측량사는 각 계곡 사이의 하루 행진을 시작하고 주자, 군인 및 공무원을 보호할 탐보 중간 정거장의 지면을 표시합니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_127:0 "[tv_wonder_ceremony|E]:탐보스가 눈에 띄었습니다"
 TV_WONDER_CEREMONY_S3_DESC_127:0 "측량사들은 각 계곡 사이를 하루 동안 행진하며 주자들, 군인, 관리들을 보호할 탐보 중간 기지의 지면을 표시합니다. 옥수수와 옷감의 첫 번째 창고는 도로의 쿠스코 종착역에 비축되어 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_127:0 "잘 갖춰진 탐보는 긴 길을 짧은 길로 바꿔줍니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_127:0 "우리는 아직 창고를 열 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_127:0 "@tv_ceremony_gravel_road!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_127:0 "#Y 진행 중#! — #high 안데스 산맥을 가로지르는 포장 작업이 시작됩니다.#!\n#F 첫 번째 산길을 따라 마침내 맞춰진 돌 테라스가 솟아오르고, 그 옆에 배수로가 잘려 도로를 씻어낼 수 있는 비를 씻어냅니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_127:0 "#G 완료#! — #high 안데스 산맥을 가로질러 포장이 시작됩니다#!\n#F 첫 번째 산길을 따라 마침내 돌로 만든 테라스가 솟아오르고 그 옆에 배수로가 잘려 길을 씻어낼 수 있는 비를 씻어냅니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_127:0 "[tv_wonder_ceremony|E]：안데스 산맥을 가로질러 포장이 시작됩니다"
 TV_WONDER_CEREMONY_S4_DESC_127:0 "마침내 첫 번째 산길을 따라 돌로 만든 테라스가 솟아오르고, 그 옆에 배수로가 만들어져 도로를 씻어낼 수 있는 비를 씻어냅니다. 측량 말뚝과 돌무더기였던 것이 이제 발 밑으로 돌이 가득 찼습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_127:0 "석공은 마지막 돌을 수평으로 맞추고 그 옆의 배수로를 자릅니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_127:0 "서둘러 놓은 돌은 첫 비에 씻겨 나갑니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_127:0 "@tv_ceremony_construction!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_127:0 "#Y 진행 중#! — #high 협곡을 가로지르는 밧줄 다리#!\n#F Ichu-풀 케이블은 사람의 허리만큼 굵게 짜여져 가장 깊은 협곡을 가로질러 끌려가 양쪽 둑의 돌 교각에 고정됩니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_127:0 "#G 완료#! — #high 협곡을 가로지르는 밧줄 다리#!\n#F Ichu-풀 케이블은 사람의 허리만큼 두꺼운 케이블로 짜여져 가장 깊은 협곡을 가로질러 끌려가 양쪽 둑의 돌 교각에 고정됩니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_127:0 "[tv_wonder_ceremony|E]：협곡을 가로지르는 밧줄 다리"
 TV_WONDER_CEREMONY_S5_DESC_127:0 "사람의 허리만큼 두꺼운 이추풀 케이블을 짜서 가장 깊은 협곡을 가로질러 끌어당겨 양쪽 둑의 돌 교각에 고정시킵니다. Chasqui 계주 주자들은 교차점 테스트를 시작하고 태양과 시간에 맞춰 계주를 하며 질주합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_127:0 "우리는 협곡을 가로질러 묶인 이추풀 케이블을 주문합니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_127:0 "직조공들은 케이블을 감고 협곡을 스팬 없이 남겨둡니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_127:0 "@tv_ceremony_building_levels!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_127:0 "#Y 진행 중#! — #high 픽추로 올라가는 길#!\n#F 이 경로는 픽추 방향의 계단식 측면을 따라 이어지며, 지그재그는 화강암으로 잘려져 있고 계단은 첫 번째 라마 캐러밴의 통과로 다듬어졌습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_127:0 "#G 완료#! — #high 픽추로 올라가는 길#!\n#F 이 경로는 픽추 방향의 계단식 측면을 따라 이어지며, 지그재그는 화강암으로 잘려져 있고 계단은 첫 번째 라마 캐러밴의 통과로 다듬어졌습니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_127:0 "[tv_wonder_ceremony|E]：픽추로 오르는 길"
 TV_WONDER_CEREMONY_S6_DESC_127:0 "이 경로는 픽추를 향한 계단식 측면으로 이어지며, 지그재그는 화강암으로 잘려져 있고 계단은 첫 번째 라마 캐러밴이 통과하면서 광택이 납니다. 엔지니어들은 산 자체에서 채석한 옹벽으로 가장 가파른 계단을 보강합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_127:0 "엔지니어들은 픽추로 가는 길을 운반하기 위해 채석된 화강암으로 옹벽을 높였습니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_127:0 "우리는 아직 미완성 계단에서 캐러밴을 위험에 빠뜨리지 않을 것입니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_127:0 "@tv_ceremony_time!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_127:0 "#Y 진행 중#! — #high 런너들이 제국의 길이를 중계합니다#!\n#F Chasqui 스테이션은 완성된 구간을 따라 완전한 인력을 배치하고 시스템의 도달 범위를 증명하기 위해 몇 주가 아닌 며칠 만에 키토에서 쿠스코까지 메시지가 전달됩니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_127:0 "#G 완료#! — #high Runners는 제국의 길이를 중계합니다#!\n#F Chasqui 스테이션은 완성된 구간을 따라 완전한 인력을 배치하고 시스템의 도달 범위를 증명하기 위해 몇 주가 아닌 며칠 만에 키토에서 쿠스코까지 메시지가 전달됩니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_127:0 "[tv_wonder_ceremony|E]: 제국의 길이를 전달하는 주자들"
 TV_WONDER_CEREMONY_S7_DESC_127:0 "Chasqui 스테이션은 완성된 구간을 따라 완전히 인력이 배치되며 시스템의 도달 범위를 입증하기 위해 몇 주가 아닌 며칠 만에 키토에서 쿠스코까지 메시지가 전달됩니다. 군인들은 국경 통과 지점을 수비하기 위해 길을 따라 중대 전체를 행진하기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_127:0 "Chasqui 주자들은 모든 중계소를 관리하고 군인들은 국경 통과를 위해 행진합니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_127:0 "너무 빨리 보낸 메시지는 진실이 아닌 소문으로 도착한다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_127:0 "@tv_ceremony_government!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_127:0 "#Y 진행 중#! — #high 카팍 난이 전체로 선언되었습니다.#!\n#F 쿠스코의 중앙 광장에서 사파 잉카는 기록적인 시간에 영역을 횡단한 주자를 받아들이고 도로는 분기부터 분기까지 완료되었다고 선언됩니다. Quarter.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_127:0 "#G 완료#! — #high 카팍 난이 전체로 선언되었습니다.#!\n#F 쿠스코의 중앙 광장에서 사파 잉카는 기록적인 시간에 영역을 횡단한 주자를 받아들이고 도로는 분기부터 분기까지 완료되었다고 선언됩니다. Quarter.#!"
 TV_WONDER_CEREMONY_S8_TITLE_127:0 "[tv_wonder_ceremony|E]:카팍난(Qhapaq Nan)이 전체로 선언됨"
 TV_WONDER_CEREMONY_S8_DESC_127:0 "쿠스코의 중앙 광장에서 사파 잉카(Sapa Inca)는 기록적인 시간에 영토를 횡단한 주자들을 맞이하며, 도로는 매 분기마다 완전하다고 선언됩니다. 카팍 난은 이제 그 어떤 경쟁 세력도 따라올 수 없는 속도로 제국의 군대, 공물, 메시지를 운반합니다.\n\n#weak 의식을 완료하려면 필요한 가격을 지불하세요. 결과적으로 불가사의의 최종 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_127:0 "우리는 쿠스코 광장에서 주자들을 맞이하고 카팍난 전체를 선언합니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_127:0 "Sapa Inca는 선언을 보류하고 도로는 한 시즌을 더 기다립니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_128:0 "@tv_ceremony_parliament!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_128:0 "#Y 진행 중#! — #high 상원은 워터스(Waters)를 의뢰합니다#!\n#F 상원은 로마의 점점 더 목마르는 분수에 답하기 위해 새로운 수로 건설 자금을 투표하고, 큐레이터 아쿠아럼(Curator Aquarum)이 아직 완성되지 않은 샘, 수로 및 아치를 감독하도록 임명됩니다. 내장.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_128:0 "#G 완료#! — #high 상원은 워터스(Waters)를 위임합니다#!\n#F 상원은 로마의 점점 더 목마른 분수에 답하기 위해 새로운 수로 건설 자금을 투표하고 큐레이터 아쿠아럼(Curator Aquarum)이 아직 개발되지 않은 샘, 수로 및 아치를 감독하도록 임명됩니다. 내장.#!"
 TV_WONDER_CEREMONY_S1_TITLE_128:0 "[tv_wonder_ceremony|E]：상원이 수역을 위임하다"
 TV_WONDER_CEREMONY_S1_DESC_128:0 "상원은 로마의 점점 더 목마른 분수에 답하기 위해 새로운 수로를 위한 자금을 투표하고 큐레이터 수족관이 아직 건설되지 않은 샘, 수로 및 아치를 감독하도록 임명됩니다. 측량사들은 물 자체가 따르는 경사도를 추적하기 위해 언덕을 따라 출발했습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_128:0 "상원이 연설했습니다!"
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_128:0 "상원은 해역에 대한 투표를 연기했습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_128:0 "@tv_ceremony_food_suitability!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_128:0 "#Y 진행 중#! — #high 로마의 샘이 요구됩니다#!\n#F 측량사는 수로의 수원이 될 만큼 맑고 추운 샘을 측설하고 계획된 코스를 따라 토지를 마일 단위로 구입하거나 요청합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_128:0 "#G 완료#! — #high 로마의 샘이 요구됩니다#!\n#F 측량사는 수로의 수원이 될 만큼 맑고 차가운 샘을 측설하고 계획된 코스를 따라 토지를 마일 단위로 구입하거나 요청합니다.#!"
 TV_WONDER_CEREMONY_S2_TITLE_128:0 "[tv_wonder_ceremony|E]：샘은 로마를 위해 요구됩니다"
 TV_WONDER_CEREMONY_S2_DESC_128:0 "측량사들은 수로의 원천이 될 만큼 맑고 추운 샘을 측설하고 계획된 경로를 따라 토지를 마일 단위로 구입하거나 징발합니다. 채석공들이 거대한 아치를 마주할 석회화를 자르기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_128:0 "측량사는 스프링에 대한 소유권을 주장합니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_128:0 "우리는 아직 이 샘을 차지할 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_128:0 "@tv_ceremony_religious_influence!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_128:0 "#Y 진행 중#! — #high 사제들이 채널의 길을 축복합니다#!\n#F 교황들은 신성한 물이 흐르는 땅을 축복하기 위해 표시된 경로를 걷고 있으며, 첫 번째 스페커스 채널은 샘물 머리 근처의 시험 구간에 놓여 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_128:0 "#G 완료#! — #high Priests 채널의 길을 축복#!\n#F Pontiffs는 신성한 물이 흐르는 땅을 축복하기 위해 표시된 경로를 걷고, 첫 번째 Specus 채널은 샘물 근처의 시험 구역에 놓입니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_128:0 "[tv_wonder_ceremony|E]:사제가 채널의 길을 축복합니다"
 TV_WONDER_CEREMONY_S3_DESC_128:0 "교황들은 신성한 물이 흐르게 될 땅을 축복하기 위해 표시된 길을 걷고 있으며, 샘물 근처의 시험 구간에 첫 번째 수로가 놓여 있습니다. 물의 무게를 지탱할 오푸스 케멘티시움(opus caementicium)에 숙련된 건축업자와 계약이 체결됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_128:0 "교황들은 채널의 표시된 길을 축복합니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_128:0 "축복의례는 좀 더 경사스러운 날을 위해 남겨둔다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_128:0 "@tv_ceremony_building_default!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_128:0 "#Y 진행 중#! — #high 아치들이 오르기 시작합니다#!\n#F 수로가 땅과 수평을 이룰 수 있는 저지대를 넘어, 노동자들은 마침내 최초의 진정한 교각을 세우고 로마의 시골에는 석조 아치가 길게 늘어서기 시작합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_128:0 "#G 완료#! — #high 아치들이 오르기 시작합니다#!\n#F 수로가 땅과 수평을 이룰 수 있는 저지대를 넘어, 노동자들은 마침내 최초의 진정한 교각을 세우고 로마의 시골에는 석조 아치가 길게 늘어서기 시작합니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_128:0 "[tv_wonder_ceremony|E]:아치들이 오르기 시작합니다"
 TV_WONDER_CEREMONY_S4_DESC_128:0 "수로가 땅과 수평을 이룰 수 있는 저지대 너머에 노동자들은 마침내 최초의 진정한 교각을 세우고 로마의 시골 지역에는 길게 늘어선 석조 아치가 자라기 시작합니다. 측량된 선은 이제 도시를 향해 뻗어 있는 석조 구조물이 됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_128:0 "마침내 돌이 하늘에 닿았습니다!"
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_128:0 "교각은 한동안 뜨지 않은 채로 서 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_128:0 "@tv_ceremony_supply!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_128:0 "#Y 진행 중#! — #high 긴 아케이드가 캄파냐를 가로지릅니다.#!\n#F Arch는 아치가 캄파냐를 가로질러 행진한 후 그 위에 타고 있는 Specus가 봉인되어 완성된 각 경간에서 흐르는 물로 테스트되었습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_128:0 "#G 완료#! — #high 긴 아케이드가 캄파냐를 가로지릅니다.#!\n#F Arch는 아치가 캄파냐를 가로질러 행진한 후 그 위에 타고 있는 거울이 봉인되어 완성된 각 경간에서 흐르는 물로 테스트되었습니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_128:0 "[tv_wonder_ceremony|E]：긴 아케이드가 캄파냐를 가로지른다"
 TV_WONDER_CEREMONY_S5_DESC_128:0 "아치가 계속해서 캄파냐를 가로질러 행진하고, 그 위에 타고 있는 거울은 봉인되어 완성된 각 경간에서 흐르는 물로 테스트되었습니다. 엔지니어들은 겨울 비가 미완성 교각을 위협하기 전에 간격을 메우기 위해 경쟁하고 있습니다.\n\n#weak 행사를 다음 단계로 진행하는 데 필요한 비용을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_128:0 "아케이드는 Campagna를 가로질러 앞으로 나아갑니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_128:0 "겨울비를 먼저 지나가게 해주세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S6_128:0 "@tv_ceremony_river!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_128:0 "#Y 진행 중#! — #high 물이 성벽으로 유입됩니다#!\n#F 수로는 마침내 로마의 성벽에 도달하고 납 파이프가 분수, 목욕탕 및 부유층의 가구로 흘러가는 거대한 분배 성으로 내려갑니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_128:0 "#G 완료#! — #high 물이 성벽으로 유입됩니다#!\n#F 수로는 마침내 로마의 성벽에 도달하고 납 파이프가 분수, 목욕탕 및 부유층의 가구로 흘러가는 거대한 분배 성으로 내려갑니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_128:0 "[tv_wonder_ceremony|E]: 물이 성벽으로 들어갑니다"
 TV_WONDER_CEREMONY_S6_DESC_128:0 "수로는 마침내 로마의 성벽에 도달하여 거대한 분포 성으로 내려가는데, 그곳에서 납 파이프가 분수, 목욕탕, 부유층의 가구로 흘러갑니다. 경로를 따라 있는 풀러와 목욕 관리인은 첫 번째 연결을 위해 로비를 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 또는 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_128:0 "채널은 도시의 대기 성으로 내려갑니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_128:0 "카스텔룸의 파이프는 한동안 주인이 없는 상태로 남아 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_128:0 "@tv_ceremony_city!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_128:0 "#Y 진행 중#! — #high 우물이 있던 곳에 솟아오르는 분수#!\n#F 한때 우물과 진흙 투성이의 테베레강에 의존했던 혼잡한 구역에 공공 분수가 설치되고, 새로운 물이 공급되는 첫 번째 욕조가 문을 엽니다. 공개.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_128:0 "#G 완료#! — #high 한때 우물이 있었던 곳에 분수가 솟아오릅니다.#!\n#F 한때 우물과 진흙 투성이의 테베레 강에 의존했던 혼잡한 지역에 공공 분수가 설치되고, 새로운 물이 공급되는 첫 번째 욕조가 문을 엽니다. 공개.#!"
 TV_WONDER_CEREMONY_S7_TITLE_128:0 "[tv_wonder_ceremony|E]: 한때 우물이 있던 곳에 분수가 솟아 오른다"
 TV_WONDER_CEREMONY_S7_DESC_128:0 "한때 우물과 진흙 투성이의 테베레 강에 의존했던 혼잡한 구역에 공공 분수가 설치되고, 새로운 물이 공급되는 첫 번째 목욕탕이 대중에게 문을 엽니다. 치안판사는 분수, 욕조, 개인 별장 사이에서 흐름을 어떻게 공유해야 하는지에 대해 논쟁합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_128:0 "더 이상 Tiber에서 운반하지 마세요!"
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_128:0 "치안 판사는 논쟁을 벌이고 분수는 기다립니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_128:0 "@tv_ceremony_population!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_128:0 "#Y 진행 중#! — #high 로마의 갈증은 영원히 해결됩니다#!\n#F 완성된 수로를 봉헌하기 위해 주 성곽에 절차를 집행하고 물은 단일 의식을 통해 도시 전역의 분수를 통해 흐르도록 방출됩니다. 러쉬.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_128:0 "#G 완료#! — #high 로마의 갈증은 영원히 해결됩니다#!\n#F 완성된 수로를 봉헌하기 위해 주 성곽에 절차를 집행하고 물은 단일 의식을 통해 도시 전역의 분수를 통해 흐르도록 방출됩니다. 러쉬.#!"
 TV_WONDER_CEREMONY_S8_TITLE_128:0 "[tv_wonder_ceremony|E]：로마의 갈증은 영원히 해결됩니다"
 TV_WONDER_CEREMONY_S8_DESC_128:0 "치안 판사는 완성된 수로를 봉헌하기 위해 주요 성으로 향하고, 물은 단 한 번의 의식을 통해 도시 전역의 분수를 통해 흐르도록 방출됩니다. 이제 로마의 목욕탕, 가정집, 공공 광장은 그것을 지은 사람들보다 오래 지속될 공급원에서 물을 마시고 있습니다.\n\n#weak 의식을 완료하는 데 필요한 가격을 지불하십시오. 결과적으로 불가사의의 최종 건물이 세워질 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_128:0 "치안 판사는 한 번의 의식을 통해 물을 풀어줍니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_128:0 "아직은 아닙니다. 그 순간을 완벽하게 만드세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S1_129:0 "@tv_ceremony_trade_capacity!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_129:0 "#Y 진행 중#! — #high 왕이 홍해로 가는 길을 명하다#!\n#F 왕은 나일강 동쪽 지류와 쓴 호수를 거쳐 홍해로 이어지는 수로를 끊도록 명령한다. 아라비아.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_129:0 "#G 완료#! — #high 왕이 홍해로 가는 길을 명하다#!\n#F 왕은 나일강 동쪽 지류와 쓴 호수를 거쳐 홍해로 이어지는 수로를 끊도록 명령한다. 아라비아.#!"
 TV_WONDER_CEREMONY_S1_TITLE_129:0 "[tv_wonder_ceremony|E]: 왕이 홍해로 가는 길을 명하다"
 TV_WONDER_CEREMONY_S1_DESC_129:0 "왕은 나일강 동쪽 지류와 쓴 호수를 거쳐 홍해로 이어지는 수로를 끊어 배가 아라비아 사막을 돌지 않아도 되도록 명령합니다. 서기관과 감독자가 파견되어 경로의 가장 건조한 구간을 조사합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_129:0 "왕의 서기관들은 길의 가장 건조한 부분을 조사하기 시작했습니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_129:0 "사막이 조금만 더 기다리게 해주세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S2_129:0 "@tv_ceremony_laborers!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_129:0 "#Y 진행 중#! — #high L부대가 사막으로 부름을 받다#!\n#F 인력 부과금은 삼각주 놈들에서 징수되어 물 가죽과 굴착 도구를 가지고 사막으로 행진하는 반면, 곡물 창고는 건조한 땅을 통해 굴착자들에게 먹이를 주기 위해 경로를 따라 비축되어 있습니다. 시즌.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_129:0 "#G 완료#! — #high L부대가 사막으로 소집됨#!\n#F 인력 징수금은 삼각주 놈들에서 징수되어 물 가죽과 굴착 도구를 가지고 사막으로 행진하는 반면, 곡물 창고는 건조한 땅을 통해 채굴자들에게 먹이를 주기 위해 경로를 따라 비축되어 있습니다. 시즌.#!"
 TV_WONDER_CEREMONY_S2_TITLE_129:0 "[tv_wonder_ceremony|E]: 사막에 부과금이 부과됩니다"
 TV_WONDER_CEREMONY_S2_DESC_129:0 "노동 부과금은 삼각주에서 징수되어 물 가죽과 굴착 도구를 가지고 사막으로 행진하는 한편 건기 동안 굴착자들에게 먹이를 주기 위해 경로를 따라 곡물 창고가 비축되어 있습니다. 페르시아와 이집트의 감독자들이 함께 운하의 너비와 깊이를 계획합니다.\n\n#weak 행사를 다음 단계로 진행하는 데 필요한 비용을 지불하거나 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_129:0 "우리는 모래 속으로 행진하기 위해 델타 부과금을 소집합니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_129:0 "감독자들은 부담금이 아직 징수되지 않았기 때문에 주저합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_129:0 "@tv_ceremony_rite_power!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_129:0 "#Y 진행 중#! — #high 강과 바다의 신들이 영예를 얻습니다.#!\n#F 사제들은 나일 강 입구와 홍해 출구 모두에 사당을 세우고 강과 바다가 합류하는 통로를 마련하기 위해 기도합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_129:0 "#G 완료#! — #high 강과 바다의 신들이 영예를 얻습니다#!\n#F 사제들은 나일 강 입구와 홍해 출구 모두에 사당을 세우고, 강과 바다가 합쳐지는 통로를 위해 강과 바다의 은혜를 기원합니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_129:0 "[tv_wonder_ceremony|E]：강과 바다의 신을 모시다"
 TV_WONDER_CEREMONY_S3_DESC_129:0 "제사장들은 나일강 입구와 홍해 출구 양쪽에 성소를 세우고, 강과 바다가 합류할 수로를 마련해 주기를 기원합니다. 첫 번째 비석은 기업에 왕의 이름을 기록하기 위해 새겨져 있습니다.\n\n#weak 의식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_129:0 "그 근원에서 축복받은 물은 영원히 흐릅니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_129:0 "우리는 아직 강의 신들 앞에 설 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_129:0 "@tv_ceremony_river!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_129:0 "#Y 진행 중#! — #high 스페이드가 사막 바닥을 공격합니다#!\n#F Bitter Lakes 근처의 선택된 절단지에서 부과금이 마침내 쌓인 모래와 점토를 깨뜨리고 사막의 태양 아래서 수로의 진정한 발굴이 본격적으로 시작됩니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_129:0 "#G 완료#! — #high Spades가 사막 바닥을 공격합니다#!\n#F Bitter Lakes 근처의 선택된 절단지에서 부과금이 마침내 쌓인 모래와 점토를 부수고 사막의 태양 아래서 수로의 진정한 발굴이 본격적으로 시작됩니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_129:0 "[tv_wonder_ceremony|E]: 스페이드가 사막 바닥을 공격합니다."
 TV_WONDER_CEREMONY_S4_DESC_129:0 "Bitter Lakes 근처의 선택된 절단지에서 부과금이 마침내 쌓인 모래와 점토를 깨뜨리고, 사막의 태양 아래서 수로의 진정한 발굴이 본격적으로 시작됩니다. 참호가 깊어지기 시작하면 전리품 바구니가 수천 개에 걸쳐 운반됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_129:0 "부과금은 마침내 뭉친 모래 속으로 삽을 박습니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_129:0 "아직은 이 모래 속으로 들어가지 마세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S5_129:0 "@tv_ceremony_lake!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_129:0 "#Y 진행 중#! — #high Bitter Lakes가 합류했습니다#!\n#F 수로가 마침내 Bitter Lakes로 연결되었고, 작업자들이 프로젝트의 두 끝이 실제로 만날 것이라는 첫 번째 신호를 환호하면서 기수는 새로운 호수로 퍼졌습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_129:0 "#G 완료#! — #high The Bitter Lakes가 합류했습니다#!\n#F 수로가 마침내 Bitter Lakes로 연결되었고, 작업자들이 프로젝트의 두 끝이 실제로 만날 것이라는 첫 번째 신호를 환호하면서 기수는 새로운 호수로 퍼졌습니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_129:0 "[tv_wonder_ceremony|E]：쓴 호수가 합류하다"
 TV_WONDER_CEREMONY_S5_DESC_129:0 "수로는 마침내 Bitter Lakes로 흘러가고, 작업자들은 프로젝트의 두 끝이 실제로 만날 것이라는 첫 번째 신호를 환호하면서 기수는 새로운 컷으로 퍼집니다. 엔지니어들은 물살로 인해 통로가 막히지 않도록 경사를 조정합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 비용을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_129:0 "우리는 쓴 물이 우리의 새로운 수로로 퍼지도록 놔둡니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_129:0 "엔지니어들은 전류로 인해 통로가 닫힐 것을 조심하면서 주저하고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_129:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_129:0 "#Y 진행 중#! — #high 운하는 바다를 향해 도달합니다#!\n#F Diggers는 홍해를 향해 마지막 구간을 밀어붙이며 불과 식초로 돌을 깨기 위해 전체 경로에서 가장 단단한 암석 선반을 절단합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_129:0 "#G 완료#! — #high 운하는 바다를 향해 도달합니다#!\n#F Diggers는 홍해를 향해 마지막 구간을 밀어붙이며 불과 식초로 돌을 깨기 위해 전체 경로에서 가장 단단한 암석 선반을 절단합니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_129:0 "[tv_wonder_ceremony|E]：운하는 바다를 향해 닿는다"
 TV_WONDER_CEREMONY_S6_DESC_129:0 "굴착자들은 홍해를 향해 마지막 구간을 밀고 돌을 깨기 위해 불과 식초를 사용하여 전체 경로에서 가장 단단한 암석 선반을 절단합니다. 홍해 무역로의 선박들은 운하의 첫 번째 실제 테스트를 준비하라는 명령을 받았습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_129:0 "불과 식초는 가장 단단한 돌도 분해합니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_129:0 "우리는 가장 단단한 암석을 시험할 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_129:0 "@tv_ceremony_ship!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_129:0 "#Y 진행 중#! — #high A 시험 호송대가 얕은 물을 테스트하다#!\n#F A 얕은 흘수 보트의 조심스러운 호송대가 미완성 수로의 길이만큼 보내지고, 선원들은 아직 남아 있는 모래톱을 지나갈 때 소리를 지른다. 삭제되었습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_129:0 "#G Completed#! — #high A 시험 호송대가 얕은 물을 테스트하다#!\n#F A 얕은 흘수 보트의 조심스러운 호송대가 미완성 수로의 길이만큼 보내지고, 선원들은 아직 남아 있는 모래톱을 지나갈 때 소리를 지른다. 삭제되었습니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_129:0 "[tv_wonder_ceremony|E]: 시험 호송대가 얕은 물을 테스트합니다."
 TV_WONDER_CEREMONY_S7_DESC_129:0 "흘수가 얕은 보트로 구성된 조심스러운 호송대가 미완성 수로를 따라 이동하고, 선원들은 아직 청소 중인 모래톱을 지나며 소리를 지르고 있습니다. 나일강과 홍해의 상인들이 다가올 횡단을 위해 화물 등록을 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_129:0 "호송대의 선원들은 모래톱을 통과하면서 소리를 지른다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_129:0 "너무 일찍 출발한 보트가 좌초되었습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_129:0 "@tv_ceremony_trade!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_129:0 "#Y 진행 중#! — #high 마지막에 두 바다가 합류합니다#!\n#F 왕의 신하들이 나일강에서 직행하는 첫 호송대를 받기 위해 홍해 입구에 서 있었습니다. 배가 바다로 들어갈 때 향을 피우고 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_129:0 "#G 완료#! — #high 마지막에 두 바다가 합류합니다#!\n#F 왕의 신하들이 나일강에서 직행하는 첫 번째 호송대를 받기 위해 홍해 어귀에 서 있었습니다. 배가 바다로 들어갈 때 향을 피우고 있습니다.#!"
 TV_WONDER_CEREMONY_S8_TITLE_129:0 "[tv_wonder_ceremony|E]:드디어 두 바다가 합쳐졌습니다"
 TV_WONDER_CEREMONY_S8_DESC_129:0 "왕의 신하들은 나일강에서 곧바로 항해하는 첫 번째 호송대를 받기 위해 홍해 어귀에 서서 배가 넓은 바다로 들어갈 때 향을 피웠다. 운하는 이제 이집트의 곡물과 상품을 홍해와 그 너머의 무역과 연결하며, 이 통로는 여러 세대에 걸쳐 왕국의 부를 전달할 수 있는 통로입니다.\n\n#weak 의식을 완료하려면 필요한 가격을 지불하세요. 결과적으로 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_129:0 "우리는 합류한 바다 위로 향이 피어오를 때 첫 번째 호송대를 받습니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_129:0 "관리들은 해안에 머물고 있으며 호송대는 아직 출동하지 않았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_130:0 "@tv_ceremony_defensive_military_stance!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_130:0 "#Y 진행 중#! — #high 대공이 새로운 크렘린을 요구하다#!\n#F 모스크바의 대공은 오래된 나무와 석회암 성벽이 차르돔의 수도에 적합하지 않다고 선언하고 프스코프와 이탈리아의 대가들을 모두 소환하여 벽돌로 요새 궁전을 세웁니다. 그리고 돌.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_130:0 "#G 완료#! — #high 대공이 새로운 크렘린을 요구하다#!\n#F 모스크바의 대공은 오래된 목조 및 석회암 성벽이 차르돔의 수도에 적합하지 않다고 선언하고 프스코프와 이탈리아의 대군들을 모두 소환하여 프스코프와 이탈리아에 요새 궁전을 세웁니다. 벽돌과 돌.#!"
 TV_WONDER_CEREMONY_S1_TITLE_130:0 "[tv_wonder_ceremony|E]：대공이 새로운 크렘린을 요구하다"
 TV_WONDER_CEREMONY_S1_DESC_130:0 "모스크바의 대공은 오래된 나무와 석회암 성벽이 차르 왕국의 수도에 적합하지 않다고 선언하고 프스코프와 이탈리아의 대가들을 불러 벽돌과 돌로 요새 궁전을 지었습니다. 엔지니어인 아리스토텔레 피오라반티(Aristotele Fioravanti)를 데려오기 위해 사절이 볼로냐로 파견됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_130:0 "우리는 썩어가는 목재와 부서지는 석회를 지배하지 않을 것입니다. 우리 사절을 즉시 볼로냐로 보내십시오."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_130:0 "대왕은 아직 사절을 집에서 멀리 보내기를 꺼려 소환을 보류합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_130:0 "@tv_ceremony_building_needs!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_130:0 "#Y 진행 중#! — #high 오래된 벽이 제거되었습니다#!\n#F 낡은 크렘린의 부서진 흰색 석회암 벽이 구역별로 허물어지고 모스크바 강을 따라 가마가 세워져 교체할 붉은 벽돌을 굽습니다. 그들.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_130:0 "#G 완료#! — #high 오래된 벽이 제거되었습니다#!\n#F 낡은 크렘린의 무너져가는 하얀 석회암 벽이 구역별로 허물어지고, 대체할 붉은 벽돌을 굽기 위해 모스크바 강을 따라 가마가 세워졌습니다. 그들.#!"
 TV_WONDER_CEREMONY_S2_TITLE_130:0 "[tv_wonder_ceremony|E]:오래된 벽이 제거되었습니다"
 TV_WONDER_CEREMONY_S2_DESC_130:0 "오래된 크렘린의 무너져가는 하얀 석회암 벽은 한 부분씩 허물어지고, 그것을 대체할 붉은 벽돌을 굽기 위해 모스크바 강을 따라 가마가 세워집니다. 보야르들은 도시에 모인 수천 명의 석공들에게 식량을 제공하기 위해 목재와 곡물을 기부합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_130:0 "모스크바를 따라 가마에 불이 붙자 보야르들은 곡물창고를 비웁니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_130:0 "우리는 아직 오래된 벽을 벗겨낼 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_130:0 "@tv_ceremony_holy_site!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_130:0 "#Y 진행 중#! — #high 대주교는 땅을 축복합니다#!\n#F 대주교는 아이콘과 향로로 표시된 기초 주위를 처리하여 대성당과 궁전 홀이 새 성벽 안에 함께 세워질 장소를 축복합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_130:0 "#G 완료#! — #high 메트로폴리탄은 땅을 축복합니다#!\n#F 메트로폴리탄은 아이콘과 향로로 표시된 기초 주위를 처리하여 대성당과 궁전 홀이 새로운 성벽 안에 함께 세워질 장소를 축복합니다.#!"
 TV_WONDER_CEREMONY_S3_TITLE_130:0 "[tv_wonder_ceremony|E]: 메트로폴리탄이 땅을 축복합니다"
 TV_WONDER_CEREMONY_S3_DESC_130:0 "메트로폴리탄은 아이콘과 향로로 표시된 기초 주변을 처리하여 대성당과 궁전 홀이 새로운 성벽 안에 함께 세워질 장소를 축복합니다. 이탈리아와 러시아의 마스터 빌더가 타워, 게이트 및 코트의 계획을 마무리합니다.\n\n#weak 행사를 다음 단계로 진행하는 데 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_130:0 "대주교는 표시된 땅 위로 향로를 휘두르고 그곳을 거룩하다고 선언합니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_130:0 "건축자들은 기초를 표시하지 않은 채 남겨두고 축복을 위한 더 상서로운 날을 기다립니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_130:0 "@tv_ceremony_crown_estate!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_130:0 "#Y 진행 중#! — #high 벽돌이 석조 기초 위에 솟아오르다#!\n#F 첫 번째 진정한 붉은 벽돌 코스는 강둑을 따라 깊은 돌 기초 위에 놓였으며, Fioravanti의 이탈리아 접착 방식과 모르타르는 오래된 벽이 할 수 있는 어떤 것보다 더 강한 것으로 입증되었습니다. 제안.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_130:0 "#G 완료#! — #high 석재 기초 위에 벽돌이 솟아오르다#!\n#F 첫 번째 진정한 붉은 벽돌 코스는 강둑을 따라 깊은 돌 기초 위에 놓였으며, Fioravanti의 이탈리아 결합 방법과 모르타르는 오래된 벽이 할 수 있는 어떤 것보다 더 강력하다는 것이 입증되었습니다. 제안.#!"
 TV_WONDER_CEREMONY_S4_TITLE_130:0 "[tv_wonder_ceremony|E]: 석재 기초 위에 벽돌이 솟아오릅니다."
 TV_WONDER_CEREMONY_S4_DESC_130:0 "붉은 벽돌의 최초의 진정한 코스는 강둑을 따라 깊은 돌 기초 위에 놓였으며 Fioravanti의 이탈리아 결합 방법과 모르타르는 오래된 벽이 제공할 수 있는 어떤 것보다 더 강력하다는 것을 입증했습니다. 마침내 크렘린이 실제 모습을 갖추기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_130:0 "마침내 돌과 벽돌이 탄생했습니다!"
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_130:0 "석공들은 흙손을 내려놓았고, 열린 하늘 아래 기초가 기다리고 있었습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_130:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_130:0 "#Y 진행 중#! — #high 성숙 대성당의 모양이 잡히다#!\n#F 오르는 성벽 안에는 크고 흰색의 성모 대성당이 코스별로 올라가고 있으며, 러시아와 이탈리아 석공이 나란히 작업하는 비계로 둘러싸인 5개의 돔이 있습니다. 금고.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_130:0 "#G 완료#! — #high 성모 대성당의 형태#!\n#F 오르는 성벽 안에는 크고 흰색의 성모 대성당이 코스별로 올라가고 있으며, 비계로 둘러싸인 5개의 돔은 러시아와 이탈리아 석공이 나란히 작업합니다. 금고.#!"
 TV_WONDER_CEREMONY_S5_TITLE_130:0 "[tv_wonder_ceremony|E]: Dormition 대성당의 모습"
 TV_WONDER_CEREMONY_S5_DESC_130:0 "솟아오른 성벽 안에는 거대한 흰색 대성당이 코스별로 올라가고 있으며, 러시아와 이탈리아 석공이 금고에서 나란히 작업하는 동안 비계로 둘러싸인 5개의 돔이 있습니다. 완료를 기다리기 위해 근처 주조소에서 종을 주조하고 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_130:0 "5개의 돔은 주조소 종을 주조함에 따라 비계 내에서 더 높이 올라갑니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_130:0 "종을 붓기 전에 비계를 잠시 더 세워두겠습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_130:0 "@tv_ceremony_soldiers!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_130:0 "#Y 진행 중#! — #high 탑과 성벽이 성벽을 장식합니다#!\n#F 총모형 탑이 모든 모퉁이와 문에 솟아 있고, 제비꼬리 흉벽은 이탈리아 요새 디자인에서 차용했으며, 스파스카야 성문에는 최초로 철로 묶인 문이 장착되어 있습니다. 문.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_130:0 "#G 완료#! — #high 탑과 흉벽이 성벽을 장식합니다#!\n#F 모퉁이와 문마다 총안 모양의 탑이 솟아 있고, 제비꼬리 흉벽은 이탈리아 요새 디자인에서 차용했으며, Spasskaya 문에는 최초의 철제 경계 장치가 장착되어 있습니다. 문.#!"
 TV_WONDER_CEREMONY_S6_TITLE_130:0 "[tv_wonder_ceremony|E]: 성벽을 장식하는 탑과 흉벽"
 TV_WONDER_CEREMONY_S6_DESC_130:0 "모퉁이와 문마다 총안 모양의 탑이 솟아 있고, 제비꼬리 흉벽은 이탈리아 요새 디자인에서 차용되었으며, 스파스카야 문에는 최초의 철제 문이 장착되어 있습니다. 모스크바의 혹독한 겨울을 견디지 못한 미완성 성벽에는 눈이 쌓였습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_130:0 "모든 탑에는 제비꼬리 흉벽이 장식되어 있어 스파스카야 성문에는 철문이 걸려 있습니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_130:0 "성벽은 눈 아래 맨손으로 서 있고 흉벽은 아직 건설되지 않았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_130:0 "@tv_ceremony_art_work!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_130:0 "#Y 진행 중#! — #high 패싯 궁전이 설치되었습니다.#!\n#F 성벽 내부에는 국가 리셉션을 위해 솟아오른 패싯 궁전이 있으며, 이전 모스크바에서 본 것과는 다른 다이아몬드 패턴의 석조 외관이 있으며, 마지막 성당 종은 처음으로 매달리고 울립니다. 시간.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_130:0 "#G 완료#! — #high 패싯 궁전이 설치되었습니다.#!\n#F 성벽 내부에는 국가 리셉션을 위해 솟아오른 패싯 궁전이 있으며, 이전 모스크바에서 본 것과는 다른 다이아몬드 패턴의 석조 외관이 있으며, 마지막 성당 종은 처음으로 매달려 울립니다. 시간.#!"
 TV_WONDER_CEREMONY_S7_TITLE_130:0 "[tv_wonder_ceremony|E]：패싯의 궁전이 완성되었습니다"
 TV_WONDER_CEREMONY_S7_DESC_130:0 "성벽 내부에는 국가 리셉션을 위해 솟아 있는 패싯 궁전(Palace of Facets)이 있으며, 이전 모스크바에서 볼 수 없었던 다이아몬드 패턴의 석조 외관이 있으며, 마지막 대성당 종은 처음으로 걸려 있고 울립니다. 전체 앙상블이 거의 완성되자 장인들이 돔에 금을 입힙니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_130:0 "마침내 종소리를 울리자!"
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_130:0 "도금공은 금박을 옆으로 치워두고 돔은 한동안 무뎌졌습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_130:0 "@tv_ceremony_ruler!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_130:0 "#Y 진행 중#! — #high 차르가 새로운 성벽 안에 즉위하다#!\n#F 차르는 Dormition Cathedral을 통과하여 5개의 금박 돔 아래에 왕관을 씌우고 있으며 완성된 크렘린의 붉은 벽과 탑은 그의 눈에 보이는 자리로 서 있습니다. 권위.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_130:0 "#G 완료#! — #high 차르가 새로운 성벽 안에서 왕관을 쓰다#!\n#F 차르는 Dormition Cathedral을 통과하여 5개의 금박 돔 아래에 왕관을 씌우고 있으며, 완성된 크렘린의 붉은 벽과 탑은 그의 눈에 보이는 자리로 서 있습니다. 권위.#!"
 TV_WONDER_CEREMONY_S8_TITLE_130:0 "[tv_wonder_ceremony|E]: 차르가 새로운 성벽 안에서 즉위하다"
 TV_WONDER_CEREMONY_S8_DESC_130:0 "차르는 다섯 개의 금박을 입힌 돔 아래 왕관을 씌우기 위해 Dormition Cathedral을 통과하며, 완성된 크렘린의 붉은 성벽과 탑은 눈에 보이는 그의 권위의 자리로 서 있습니다. 모스크바의 요새 궁전은 이제 성벽을 바라보는 모든 사람을 위해 차르국의 정당성을 입증합니다.\n\n#weak 의식을 완료하는 데 필요한 가격을 지불하세요. 결과적으로 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_130:0 "차르는 왕관을 받기 위해 다섯 개의 금박을 입힌 돔 아래 무릎을 꿇고 있습니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_130:0 "아직은 아닙니다!"
 TV_WONDER_CEREMONY_CARD_ICON_S1_131:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_131:0 "#Y 진행 중#! — #high 사제들이 신의 장소를 명명하다#!\n#F 도시의 성직자들은 쌍둥이 봉우리 아래 계곡을 한때 신들이 세상을 재창조하기 위해 모였던 장소라고 선언하고, 불이 처음으로 불이 붙은 곳을 표시할 신성한 길과 피라미드를 요구합니다 불타버렸습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_131:0 "#G 완료#! — #high 사제들이 신의 장소를 명명하다#!\n#F 도시의 성직자들은 쌍둥이 봉우리 아래 계곡을 한때 신들이 세상을 재창조하기 위해 모였던 장소라고 선언하고, 불이 처음으로 불이 붙은 곳을 표시할 신성한 길과 피라미드를 요구합니다. 불타버렸습니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_131:0 "[tv_wonder_ceremony|E]：사제들은 신들의 장소에 이름을 붙였습니다"
 TV_WONDER_CEREMONY_S1_DESC_131:0 "도시의 사제들은 쌍둥이 봉우리 아래 계곡을 한때 신들이 모여 세상을 재창조했던 장소라고 선언하고, 그 불이 처음 타오르는 곳을 표시할 신성한 길과 피라미드를 요구합니다. 건축업자와 공물을 보내기 위해 고지대에 있는 동맹 혈통에 소식이 전달됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_131:0 "제사장들은 이 계곡을 신들의 거처라고 선언합니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_131:0 "아직은 아닙니다. 신들이 기다리게 해주세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S2_131:0 "@tv_ceremony_paved_road!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_131:0 "#Y 진행 중#! — #high 망자의 길이 추적됩니다#!\n#F 측량사는 계곡 바닥을 가로질러 긴 직선을 긋고 달력에서 신성한 날의 해가 뜨는 방향에 맞춰 정렬하고 거대한 플랫폼이 그 측면에 위치할 위치를 표시합니다. 길이.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_131:0 "#G 완료#! — #high 죽은 자의 거리가 추적됩니다#!\n#F 측량사는 달력이 신성한 날의 해가 뜨는 방향에 맞춰 계곡 바닥을 가로질러 긴 직선을 긋고 거대한 플랫폼이 그 측면에 위치할 위치를 표시합니다. 길이.#!"
 TV_WONDER_CEREMONY_S2_TITLE_131:0 "[tv_wonder_ceremony|E]：죽은 자의 거리를 추적하다"
 TV_WONDER_CEREMONY_S2_DESC_131:0 "측량사들은 계곡 바닥을 가로질러 긴 직선을 긋고 달력에서 신성한 날의 해가 뜨는 지점에 맞춰 정렬하고 큰 플랫폼이 그 길이 측면에 위치할 위치를 표시합니다. 피라미드를 마주하게 될 화산석에서 채석이 시작됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_131:0 "우리는 태양의 경로를 따라 진실한 길을 추적합니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_131:0 "측량사의 말뚝은 움직이지 않고 서 있고, 채석장은 한동안 조용합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_131:0 "@tv_ceremony_holy_site!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_131:0 "#Y 진행 중#! — #high 제물은 땅 아래 묻혀있습니다#!\n#F 사제는 표시된 기초 아래에 녹석, 흑요석 칼날, 희생된 생물의 뼈를 묻어 돌이 한 줄기도 쌓이기 전에 땅을 신성하게 합니다. 누워.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_131:0 "#G 완료#! — #high 제물은 땅 아래 묻혀있습니다#!\n#F 사제는 표시된 기초 아래에 녹석, 흑요석 칼날, 희생된 생물의 뼈를 묻어 돌이 한 줄도 쌓이기 전에 땅을 신성하게 합니다. 누워.#!"
 TV_WONDER_CEREMONY_S3_TITLE_131:0 "[tv_wonder_ceremony|E]: 제물은 땅 밑에 묻혀있습니다"
 TV_WONDER_CEREMONY_S3_DESC_131:0 "사제들은 표시된 기초 아래에 녹석, 흑요석 칼날, 희생된 생물의 뼈 등을 숨겨 돌을 한 층 쌓기 전에 대지를 신성하게 만듭니다. 도시 구역의 혈통 대표들은 노동 갱단을 작업에 투입할 것을 약속합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_131:0 "그래서 땅이 봉헌되었습니다!"
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_131:0 "우리는 아직 땅에 제물을 바칠 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_131:0 "@tv_ceremony_building_default!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_131:0 "#Y 진행 중#! — #high Stone이 태양을 향해 오르기 시작합니다#!\n#F 노동자들은 마침내 태양의 피라미드의 최초의 진정한 층을 고지대 아래에 절단된 돌로 포장하고 직면한 매장된 제물, 어도비 벽돌 및 잔해 코어 위로 들어 올립니다. light.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_131:0 "#G 완료#! — #high Stone이 태양을 향해 오르기 시작합니다#!\n#F 노동자들은 마침내 태양의 피라미드의 최초의 진정한 층을 고지대 아래에 절단된 돌로 포장하고 직면한 매장된 제물, 어도비 벽돌 및 잔해 코어 위로 들어 올립니다. light.#!"
 TV_WONDER_CEREMONY_S4_TITLE_131:0 "[tv_wonder_ceremony|E]：돌이 태양을 향해 오르기 시작하다"
 TV_WONDER_CEREMONY_S4_DESC_131:0 "노동자들은 마침내 태양의 피라미드의 최초의 진정한 층을 땅에 묻힌 공물, 고지대 조명 아래 절단된 돌로 포장하고 직면한 어도비 벽돌과 잔해 코어 위로 들어 올립니다. 표시된 땅이 이제 손으로 지은 산으로 솟아오릅니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_131:0 "노동자들은 태양을 향해 돌의 첫 번째 층을 들어 올립니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_131:0 "아직은 아닙니다. 산은 기다려야 합니다!"
 TV_WONDER_CEREMONY_CARD_ICON_S5_131:0 "@tv_ceremony_building_levels!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_131:0 "#Y 진행 중#! — #high 달의 피라미드가 일치하도록 떠오른다#!\n#F 거리의 북쪽 끝에 있는 달의 피라미드는 그 뒤에 있는 신성한 봉우리를 구성하기 위해 층별로 성장하며, 건축가는 전체 실루엣이 실제처럼 보이도록 각 단계의 높이를 조정합니다. 아래 거리에서.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_131:0 "#G 완료#! — #high 달의 피라미드가 일치하도록 솟아오른다#!\n#F 거리의 북쪽 끝에 있는 달의 피라미드는 그 뒤에 있는 신성한 봉우리를 구성하기 위해 층별로 성장하며, 건축가는 각 단계의 높이를 조정하여 전체 실루엣이 읽히도록 합니다. 아래 길에서 보면 사실입니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_131:0 "[tv_wonder_ceremony|E]: 달의 피라미드가 그에 맞춰 떠오릅니다."
 TV_WONDER_CEREMONY_S5_DESC_131:0 "거리의 북쪽 끝에 있는 달의 피라미드는 그 뒤에 있는 신성한 봉우리를 구성하기 위해 층별로 성장하며, 건축가는 각 단계의 높이를 조정하여 전체 실루엣이 아래 거리에서 그대로 읽히도록 합니다. 화가들은 플랫폼 벽을 따라 첫 번째 벽화를 그리기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_131:0 "우리는 태양의 피라미드에 답하기 위해 달의 피라미드를 계층별로 올립니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_131:0 "건축업자들은 달의 층을 미완성으로 남겨두고 벽화도 칠하지 않은 채 남겨둡니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_131:0 "@tv_ceremony_city!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_131:0 "#Y 진행 중#! — #high 페인팅된 복합물이 도시의 블록을 채웁니다.#!\n#F 다가구 아파트 단지가 거리의 측면을 따라 질서정연하게 블록으로 솟아 있고, 안뜰 벽은 도시의 상징인 빨간색으로 칠해져 있고 깃털 달린 뱀으로 덮여 있습니다. 재규어.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_131:0 "#G 완료#! — #high 페인팅된 화합물이 도시의 블록을 채웁니다.#!\n#F 다세대 아파트 단지가 거리의 측면을 따라 질서정연하게 블록으로 솟아 있고, 안뜰 벽은 도시의 상징인 빨간색으로 칠해져 있고 깃털 달린 뱀으로 덮여 있습니다. 재규어.#!"
 TV_WONDER_CEREMONY_S6_TITLE_131:0 "[tv_wonder_ceremony|E]：페인팅된 화합물이 도시의 블록을 채웁니다."
 TV_WONDER_CEREMONY_S6_DESC_131:0 "다가구 아파트 단지는 거리 측면을 따라 질서정연하게 블록으로 솟아 있으며, 안뜰 벽은 도시의 상징인 빨간색으로 칠해져 있고 깃털 달린 뱀과 재규어로 덮여 있습니다. 공예 구역에서는 고지대 전역에서 거래할 흑요석 도구와 얇은 주황색 도자기를 생산하기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_131:0 "도시는 하루아침에 세워지는 것이 아니라 칠한 벽을 하나씩 쌓아가는 것입니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_131:0 "우리는 이 블록을 칠해진 주택으로 채울 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_131:0 "@tv_ceremony_art_work!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_131:0 "#Y 진행 중#! — #high 깃털 달린 뱀 사원이 장식되었습니다#!\n#F 조각가들은 길 남쪽을 따라 솟아오른 사원 정면에 조각된 뱀과 폭풍 신의 머리를 한 줄로 세웠습니다. 쉘.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_131:0 "#G 완료#! — #high 깃털 달린 뱀 사원이 장식되었습니다#!\n#F 조각가들은 길의 남쪽을 따라 솟아오른 사원 정면에 조각된 뱀과 폭풍신의 머리를 한 줄로 세웠으며, 그들의 돌 눈에는 한때 흑요석과 쉘.#!"
 TV_WONDER_CEREMONY_S7_TITLE_131:0 "[tv_wonder_ceremony|E]:깃털 달린 뱀 사원이 장식되어 있습니다"
 TV_WONDER_CEREMONY_S7_DESC_131:0 "조각가들은 길의 남쪽을 따라 솟아오른 사원 정면에 조각된 뱀과 폭풍신의 머리를 줄줄이 세웠으며, 그들의 돌 눈에는 한때 흑요석과 조개껍질이 새겨져 있었습니다. 사원 완공을 앞두고 이미 완성된 거리를 행렬이 걷고 있습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_131:0 "조각가들은 사원의 솟아오른 면에 뱀 신의 머리를 세웠습니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_131:0 "신들은 계절이 오기 전에 조각을 서두르지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_131:0 "@tv_ceremony_religious_influence!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_131:0 "#Y 진행 중#! — #high 신성한 산 꼭대기에 불이 켜졌다#!\n#F 사제들이 태양의 피라미드 정상에 올라 완성된 길 전체 위에서 새로운 불을 피우고, 연기가 솟아올라 산 꼭대기를 지켜보고 있다 밸리.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_131:0 "#G Completed#! — #high Fire Is Lit Atop the Sacred Mountain#!\n#F Priests climb to the summit of the Pyramid of the Sun to kindle the New Fire above the whole finished avenue, smoke rising to answer the peaks that watch over the valley.#!"
 TV_WONDER_CEREMONY_S8_TITLE_131:0 "[tv_wonder_ceremony|E]:신산 정상에 불이 붙다"
 TV_WONDER_CEREMONY_S8_DESC_131:0 "성직자들은 태양의 피라미드 정상에 올라 완성된 길 전체 위에 새로운 불을 피우고, 계곡을 내려다보는 봉우리에 연기가 피어오르게 됩니다. 이제 테오티우아칸은 여러 세대에 걸쳐 고지대 전체에 영향력과 의식이 퍼져 나갈 신성한 도시로 완전해졌습니다.\n\n#weak 의식을 완료하려면 필요한 가격을 지불하세요. 결과적으로 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_131:0 "우리는 정상에 올라 그 무엇보다도 새로운 불을 지피고 있습니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_131:0 "성직자들은 정상 아래에 서 있고, 새 불은 아직 켜지지 않았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_132:0 "@tv_ceremony_food_productivity!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_132:0 "#Y 진행 중#! — #high 왕이 바라이(Baray)를 포고함#!\n#F 크메르 왕은 우기를 억제하고 건조한 식량을 공급할 수 있을 만큼 넓은 저수지를 명령하여 앙코르의 논이 다시는 가뭄이나 홍수를 두려워할 필요가 없도록 했습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_132:0 "#G 완료#! — #high 왕은 대바라이(Baray)를 명령합니다#!\n#F 크메르 왕은 우기를 억제하고 건조한 식량을 공급할 만큼 넓은 저수지를 명령하여 앙코르의 논이 다시는 가뭄이나 홍수를 두려워할 필요가 없도록 합니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_132:0 "[tv_wonder_ceremony|E]: 왕이 대바라이를 명하다"
 TV_WONDER_CEREMONY_S1_DESC_132:0 "크메르 왕은 우기를 억제하고 건조한 식량을 공급할 수 있을 만큼 넓은 저수지를 명령하여 앙코르의 논이 다시는 가뭄이나 홍수를 두려워하지 않도록 했습니다. 왕실 측량사들은 언젠가 작은 내해를 에워싸게 될 제방을 추적하기 시작했습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_132:0 "우리는 그것을 선언합니다: 위대한 바라이가 추적되고 제기될 것입니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_132:0 "왕실 측량사는 단일 스테이크가 설정되기 전에 소환됩니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_132:0 "@tv_ceremony_laborers!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_132:0 "#Y 진행 중#! — #high 마을 제방으로 부름#!\n#F 코비의 노동력은 왕국 전역의 마을에서 끌려와 바레이의 성벽을 위한 흙을 끌기 시작하고, 성직자들은 저수지에 신사가 세워질 기본 지점을 표시합니다. 코너.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_132:0 "#G 완료#! — #high 마을 제방으로 부름#!\n#F 코비의 노동력은 왕국 전역의 마을에서 끌려와 바레이의 성벽을 위한 흙을 끌기 시작하고, 성직자는 저수지에 신사가 세워질 기본 지점을 표시합니다. 코너.#!"
 TV_WONDER_CEREMONY_S2_TITLE_132:0 "[tv_wonder_ceremony|E]：마을을 제방으로 불러들입니다"
 TV_WONDER_CEREMONY_S2_DESC_132:0 "왕국 전역의 마을에서 코비 노동력을 모아 바레이의 성벽을 쌓기 위해 흙을 운반하기 시작하고, 성직자들은 저수지 모퉁이에 신사가 세워질 주요 지점을 표시합니다. 쌀을 파는 건조한 달 동안 인부들에게 식량을 제공하기 위해 쌀 저장고가 따로 마련되어 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_132:0 "코비 갱단이 바레이의 성벽을 높이기 위해 마을에서 쏟아져 나옵니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_132:0 "우리는 마을을 좀 더 오래 유지합니다. 제방은 기다릴 수 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_132:0 "@tv_ceremony_river!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_132:0 "#Y 진행 중#! — #high 운하는 들판까지 이어집니다#!\n#F 엔지니어들은 언젠가 바라이의 물을 도시 너머의 논으로 운반할 공급 운하 네트워크를 표시하고, 브라만 사제들은 저수지가 물을 반영할 중심 축을 축복합니다. 천국.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_132:0 "#G 완료#! — #high 운하는 들판까지 이어집니다#!\n#F 엔지니어들은 언젠가 바레이의 물을 도시 너머의 논으로 운반할 공급 운하 네트워크를 표시하고, 브라만 사제들은 저수지가 물을 반영할 중심 축을 축복합니다. 천국.#!"
 TV_WONDER_CEREMONY_S3_TITLE_132:0 "[tv_wonder_ceremony|E]：운하는 들판을 따라 이어집니다"
 TV_WONDER_CEREMONY_S3_DESC_132:0 "엔지니어들은 언젠가 바라이의 물을 도시 너머의 논으로 운반할 수로망을 표시하고, 브라만 사제들은 저수지가 하늘을 비추게 될 중심 축을 축복합니다. 첫 번째 수문 디자인은 작은 점토 모형으로 테스트됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_132:0 "엔지니어들은 운하 선을 측설하고 작은 점토 모델로 수문 설계를 테스트합니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_132:0 "운하를 한 번 자르기 전에 점토 모델을 두 번 테스트하십시오."
 TV_WONDER_CEREMONY_CARD_ICON_S4_132:0 "@tv_ceremony_food_suitability!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_132:0 "#Y 진행 중#! — #high 저수지 바닥을 위해 지구가 절단되었습니다.#!\n#F 노동자들은 마침내 평원 자체를 파고 저수지의 유역을 파고 다른 사람들은 그 주변에 솟아오른 긴 흙 제방을 포장하고 밟습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_132:0 "#G 완료#! — #high 저수지 바닥을 위해 지구가 절단되었습니다.#!\n#F 노동자들은 마침내 평원 자체를 파고 저수지의 유역을 파고 다른 사람들은 그 주변에 솟아오른 긴 흙 제방을 포장하고 밟았습니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_132:0 "[tv_wonder_ceremony|E]：저수지 바닥을 만들기 위해 땅이 잘려졌습니다."
 TV_WONDER_CEREMONY_S4_DESC_132:0 "노동자들은 마침내 평원 자체를 파고 저수지의 유역을 파고, 다른 사람들은 그 주변에 솟아오른 긴 흙 제방을 포장하고 밟았습니다. 말뚝에 박힌 땅은 이제 붉은 흙으로 이루어진 넓은 분지가 됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_132:0 "우리는 땅을 자르라고 명령합니다. 우리 엔지니어들의 손으로 대야의 형태를 만들어 보세요."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_132:0 "측설된 땅은 그대로 유지됩니다. 아직 삽이 없어 평원을 깰 수 없습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_132:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_132:0 "#Y 진행 중#! — #high 비를 막기 위해 솟아오른 제방#!\n#F 건기마다 거대한 흙벽이 더 높이 올라가고, 물을 조절하기 위해 돌 표면의 수문이 길이에 맞게 설정됩니다. 앙코르의 엔지니어들은 몬순.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_132:0 "#G 완료#! — #high 비를 막기 위해 솟아오른 제방#!\n#F 건기마다 거대한 흙벽이 더 높이 올라가고, 물을 조절하기 위해 돌 표면의 수문이 길이에 맞게 설정됩니다. 앙코르의 엔지니어들은 몬순.#!"
 TV_WONDER_CEREMONY_S5_TITLE_132:0 "[tv_wonder_ceremony|E]: 비를 막기 위해 솟아오른 제방"
 TV_WONDER_CEREMONY_S5_DESC_132:0 "건기마다 거대한 흙벽이 더 높이 올라가고, 돌로 된 수문이 길이에 맞게 설정되어 앙코르의 기술자들은 몬순과 함께 올 것이라고 알고 있는 물을 조절합니다. 언젠가 저수지 개통을 주관하게 될 성직자들이 모퉁이에 신사 탑이 세워졌습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_132:0 "석공들은 제방 모퉁이에 우뚝 솟은 신사 탑을 바라보며 바위의 수문을 마주합니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_132:0 "우리는 벽을 한 시즌 더 현재 높이에 두었습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_132:0 "@tv_ceremony_lake!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_132:0 "#Y 진행 중#! — #high 처음으로 물이 유입되다#!\n#F 수로가 잘려 처음으로 부풀어 오른 우기 강이 저수지로 범람하도록 하고, 엔지니어들은 제방이 상승세를 막는 것을 걱정스럽게 지켜보고 있습니다. 물.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_132:0 "#G 완료#! — #high 처음으로 물이 유입되다#!\n#F 부풀어 오른 우기 강이 처음으로 저수지로 범람하도록 수로가 절단되고 엔지니어들은 제방이 상승세를 막는 것을 걱정스럽게 지켜보고 있습니다. 물.#!"
 TV_WONDER_CEREMONY_S6_TITLE_132:0 "[tv_wonder_ceremony|E]：물이 처음으로 유입되었습니다"
 TV_WONDER_CEREMONY_S6_DESC_132:0 "부풀어 오른 우기 강이 처음으로 저수지로 범람할 수 있도록 수로를 절단하고 엔지니어들은 제방이 상승하는 물을 막아내는 것을 걱정스럽게 지켜보고 있습니다. 어부와 농부 모두 제방에 모여 내해가 가득 차기 시작하는 모습을 지켜봅니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_132:0 "수로가 끊어지고 부풀어 오른 강물이 몰려와 대기 중인 분지를 채웁니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_132:0 "수문은 닫혀 있습니다. 강은 좀 더 오래 예전의 흐름을 이어가도록 남겨졌습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_132:0 "@tv_ceremony_food!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_132:0 "#Y 진행 중#! — #high 운하는 물을 논으로 나릅니다.#!\n#F 완성된 공급 수로가 연이어 열리면서 바레이에 저장된 물을 평야를 가로질러 이전에 수요에 따라 물을 공급한 적이 없는 들판으로 운반합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_132:0 "#G 완료#! — #high 운하는 물을 논으로 나릅니다.#!\n#F 완성된 공급 수로는 연이어 열리며, 바레이에 저장된 물을 평야를 가로질러 이전에 수요에 따라 물을 공급한 적이 없는 들판으로 운반합니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_132:0 "[tv_wonder_ceremony|E]:운하는 물을 논으로 운반합니다"
 TV_WONDER_CEREMONY_S7_DESC_132:0 "완성된 공급 수로가 연이어 열리면서 바레이에 저장된 물을 평야를 가로질러 이전에는 수요에 따라 물을 공급한 적이 없는 들판으로 운반합니다. 새로운 운하를 따라 농부들은 다가오는 건기에 두 번째 쌀 수확을 계획하기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_132:0 "우리는 쭉 뻗은 운하를 열어 들판이 마침내 마실 수 있도록 합니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_132:0 "완성된 운하가 막혀 있습니다. 들판은 또 다른 계절에 물을 기다립니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_132:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_132:0 "#Y 진행 중#! — #high 승리의 물 방류#!\n#F 크메르 성직자와 기술자들이 중앙 수문에 모여 집합된 뜰 앞에서 물 방류 의식을 거행하고, 저수지의 문이 열려 저장된 물이 앙코르 들판으로 흘러나갑니다. 지평선에 있는 사원 전체가 보입니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_132:0 "#G 완료#! — #high 승려들이 승리하여 물을 방류하다#!\n#F 크메르의 성직자들과 기술자들이 중앙 수문에 모여 집결된 뜰 앞에서 물 방류 의식을 거행하고, 저수지의 문이 열려 저장된 물이 앙코르 전역으로 흘러나갑니다. 지평선에 있는 사원 전체가 보이는 들판.#!"
 TV_WONDER_CEREMONY_S8_TITLE_132:0 "[tv_wonder_ceremony|E]: 승려들이 승리하여 물을 방출하다"
 TV_WONDER_CEREMONY_S8_DESC_132:0 "크메르 성직자와 기술자들이 집결된 법정 앞에서 물 방출 의식을 수행하기 위해 주 수문에 모였습니다. 저수지의 문이 열리면서 지평선에 있는 사원이 한눈에 보이는 앙코르 들판을 가로질러 저장된 물이 흘러나갔습니다. 이제 수력 시스템이 완성되어 바레이와 운하가 가뭄과 홍수 속에서도 왕국의 쌀을 공급합니다.\n\n#weak 행사를 완료하는 데 필요한 가격을 지불하세요. 결과적으로 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_132:0 "성직자들은 주요 수문을 열었고, 앙코르에 저장된 물은 승리의 의미로 법정 앞으로 솟아올랐습니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_132:0 "법원이 이미 모여 지켜보고 있지만 우리는 행사를 하루 더 연기합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_133:0 "@tv_ceremony_law!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_133:0 "#Y 진행 중#! — #high 수자원 위원회는 새로운 간척지를 요구합니다#!\n#F 지역 수자원 위원회는 습지와 얕은 호수를 둘러쌀 권리를 주정부에 청원합니다. 현재는 갈대와 장어만 번성할 수 있는 건조한 농지를 약속합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_133:0 "#G 완료#! — #high 수자원위원회는 새로운 간척지를 요구합니다#!\n#F 지역 수자원위원회는 습지와 얕은 호수를 둘러쌀 권리를 주정부에 청원합니다. 현재는 갈대와 장어만 번성하는 건조한 농지를 약속합니다.#!"
 TV_WONDER_CEREMONY_S1_TITLE_133:0 "[tv_wonder_ceremony|E]：수자원국이 새로운 간척지를 요구하다"
 TV_WONDER_CEREMONY_S1_DESC_133:0 "지역 수자원위원회는 이제 갈대와 장어만 번성할 수 있는 건조한 농지를 약속하는 습지와 얕은 호수를 에워쌀 권리를 주정부에 청원합니다. 엔지니어들은 바다와 강을 막아줄 제방의 고리를 조사하라는 임무를 받았습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 비용을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_133:0 "물위원회는 청원서를 제출하고 측량사를 습지로 보냅니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_133:0 "아직은 아닙니다. 갈대를 한 시즌 더 오래 보관하세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S2_133:0 "@tv_ceremony_laborers!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_133:0 "#Y 진행 중#! — #high 이탄 절단기가 제방 건설업자에게 양보#!\n#F 늪지에서 일했던 이탄 절단기와 장어 어부가 매각되거나 새 프로젝트에 고용되고, 바지선은 링 제방이 있는 장소로 점토와 갈대 묶음을 운반하기 시작합니다. 상승.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_133:0 "#G 완료#! — #high 이탄 절단기가 제방 건설업자에게 양보#!\n#F 늪지에서 일했던 이탄 절단기와 장어 어부가 매각되거나 새 프로젝트에 고용되고, 바지선은 점토와 갈대 묶음을 링 제방이 있는 장소로 운반하기 시작합니다. 상승.#!"
 TV_WONDER_CEREMONY_S2_TITLE_133:0 "[tv_wonder_ceremony|E]: 이탄 절단기가 제방 건설업자에게 양보합니다"
 TV_WONDER_CEREMONY_S2_DESC_133:0 "습지에서 일했던 이탄 절단기와 장어 어부들은 매각되거나 새로운 프로젝트에 고용되며, 바지선은 점토와 갈대 묶음을 고리형 제방이 솟아오르는 장소로 운반하기 시작합니다. 풍차 제작자는 해안 위아래 마을에서 계약을 맺습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_133:0 "보드는 이탄 절단기를 구입하고 바지선을 제방 선을 향해 굴러 보냅니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_133:0 "이탄 절단기는 습지에 더 오래 머무르고 바지선은 정박되어 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_133:0 "@tv_ceremony_government_reform!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_133:0 "#Y 진행 중#! — #high 수자원위원회가 규칙을 정함#!\n#F 제방 리브와 그의 heemraden은 각 토지 소유자가 작업에 대해 지불해야 하는 평가액을 정하고 측량사는 계획된 제방 전체를 따라 첫 번째 표시 말뚝을 박습니다. 회로.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_133:0 "#G 완료#! — #high 물 위원회가 규칙을 정함#!\n#F 제방 리브와 그의 heemraden은 각 토지 소유자가 작업에 대해 지불해야 하는 평가액을 정하고 측량사는 계획된 제방 전체를 따라 첫 번째 표시 말뚝을 박습니다. 회로.#!"
 TV_WONDER_CEREMONY_S3_TITLE_133:0 "[tv_wonder_ceremony|E]：물위원회가 규칙을 정합니다"
 TV_WONDER_CEREMONY_S3_DESC_133:0 "제방 주인과 그의 heemraden은 각 토지 소유자가 작업에 대해 지불해야 하는 평가액을 정하고 측량사는 계획된 제방의 전체 회로를 따라 첫 번째 표시 말뚝을 박습니다. 공사가 본격적으로 시작되기 전에 배수 공장 모형이 근처 도랑에서 테스트되고 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_133:0 "그럼 평가는 끝났습니다!"
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_133:0 "heemraden은 원장을 한쪽으로 치워두고 지금은 평가서에 서명하지 않은 채로 두었습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_133:0 "@tv_ceremony_lake!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_133:0 "#Y 진행 중#! — #high Spades 첫 번째 제방 벽 절단#!\n#F 노동자들은 마침내 링 제방의 첫 번째 스트레칭을 위해 잔디와 더미 점토를 자르고 다음 층이 그 위에 놓이기 전에 각 층을 다졌습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_133:0 "#G 완료#! — #high Spades 첫 번째 제방 벽 절단#!\n#F 노동자들은 마침내 링 제방의 첫 번째 스트레칭을 위해 잔디와 더미 점토를 자르고 다음 층이 그 위에 놓이기 전에 각 층을 다졌습니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_133:0 "[tv_wonder_ceremony|E]: 스페이드가 첫 번째 제방 벽을 잘라냅니다."
 TV_WONDER_CEREMONY_S4_DESC_133:0 "노동자들은 마침내 링 제방의 첫 번째 확장을 위해 잔디를 자르고 점토를 쌓고, 다음 층이 그 위에 놓이기 전에 각 층을 다져줍니다. 진흙 속의 말뚝이었던 것이 이제 바다 자체를 막는 솟아오르는 벽이 됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_133:0 "노동자들은 삽을 잔디밭에 밀어 넣고 제방 벽의 실제 길이를 처음으로 올립니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_133:0 "아직은 아닙니다. 먼저 뭉친 점토를 가라앉히세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S5_133:0 "@tv_ceremony_production_method!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_133:0 "#Y 진행 중#! — #high 최초의 공장이 항해를 시작합니다#!\n#F A 배수 풍차가 제방의 안쪽 가장자리를 따라 세워져 있으며, 그 거대한 돛은 해안 바람을 받아 밀폐된 습지에서 외부 운하로 물을 끌어올리기 시작합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_133:0 "#G 완료#! — #high 첫 번째 방앗간이 항해를 시작합니다#!\n#F A 배수 풍차가 제방의 안쪽 가장자리를 따라 세워져 있으며, 그 거대한 돛은 해안 바람을 받아 밀폐된 습지에서 외부 운하로 물을 끌어올리기 시작합니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_133:0 "[tv_wonder_ceremony|E]: 최초의 공장이 항해를 시작했습니다."
 TV_WONDER_CEREMONY_S5_DESC_133:0 "배수 풍차가 제방의 안쪽 가장자리를 따라 늘어서 있고, 그 거대한 돛이 해안 바람을 받아 밀폐된 습지에서 외부 운하로 물을 끌어올리기 시작합니다. 농부들은 살아있는 기억 중 처음으로 링 내부의 수위가 떨어지는 것을 지켜봅니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_133:0 "우리는 방앗간을 올리고 해안 바람에 맞춰 돛을 돌립니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_133:0 "물방앗간 장인들은 일단 돛을 펼쳐 놓아두었고, 습지에는 좀 더 오랫동안 물이 남아 있었습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_133:0 "@tv_ceremony_lock!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_133:0 "#Y 진행 중#! — #high 제방이 마지막 간격을 메운다#!\n#F 인공들은 봄철 조수에 맞서 원형 제방의 마지막 입구를 막고 내부의 물이 강과 바다 너머에서 완전히 분리될 때까지 말뚝을 박고 점토를 버립니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_133:0 "#G 완료#! — #high 제방이 마지막 간격을 메움#!\n#F 인공들은 조수에 맞서 순환형 제방의 마지막 입구를 막고 내부의 물이 강과 바다 너머의 물과 완전히 분리될 때까지 말뚝을 박고 점토를 버립니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_133:0 "[tv_wonder_ceremony|E]：제방이 마지막 격차를 좁힙니다"
 TV_WONDER_CEREMONY_S6_DESC_133:0 "노동자들은 원형 제방의 마지막 입구를 닫기 위해 조수에 맞서 싸우며 내부의 물이 강과 바다 너머에서 완전히 분리될 때까지 말뚝을 박고 점토를 버립니다. 워터 보드는 인클로저가 완료되었음을 선언하고 실제 배수가 시작됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_133:0 "이제, 봄철이 바뀌기 전!"
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_133:0 "선원들은 틈새에서 물러나 조수가 조금 더 자유롭게 지나갈 수 있도록 남겨 둡니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_133:0 "@tv_ceremony_food!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_133:0 "#Y 진행 중#! — #high 물이 빠진 호수 바닥에서 솟아오르는 들판#!\n#F 호 바닥은 구역별로 건조되어 풍부한 검은 흙으로 변하며, 첫 번째 부지가 조사되어 한 시즌 전에만 개방 수역이었던 작업장을 열망하는 농부들에게 허락됩니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_133:0 "#G 완료#! — #high 물이 빠진 호수 바닥에서 들판이 솟아오릅니다.#!\n#F 호 바닥은 구역별로 건조되어 풍부한 검은 흙으로 변하고, 첫 번째 부지를 조사하여 이전 시즌에만 개방 수역이었던 작업장을 열망하는 농부들에게 맡깁니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_133:0 "[tv_wonder_ceremony|E]: 물이 빠진 호수 바닥에서 들판이 나옵니다."
 TV_WONDER_CEREMONY_S7_DESC_133:0 "호수 바닥은 구역별로 풍부한 검은 토양으로 건조되며, 첫 번째 부지를 조사한 후 불과 몇 시즌 전에는 개방된 물이었던 땅을 일하기를 열망하는 농부들에게 맡깁니다. 매립된 간척지에 새로운 농가와 배수로가 펼쳐져 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_133:0 "측량사들은 말라가는 호수 바닥을 표시하고 열정적인 농부들에게 첫 번째 부지를 제공합니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_133:0 "아직은 아닙니다. 검은 흙을 조금 더 말려주세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S8_133:0 "@tv_ceremony_harmony!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_133:0 "#Y 진행 중#! — #high 수자원 위원회는 간척지가 승리했다고 선언합니다.#!\n#F 제방 리브와 그의 heemraden은 완성된 링 제방을 따라 폐쇄식을 기념하는 과정을 거치고, 매립된 들판이 녹색과 건조하게 뒤로 뻗어나가자 풍차가 꾸준한 리듬으로 회전합니다. 그들.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_133:0 "#G 완료#! — #high 수자원 위원회는 간척지가 승리했다고 선언합니다.#!\n#F 제방 리브와 그의 heemraden은 완성된 링 제방을 따라 폐쇄식을 기념하는 과정을 거치고, 매립된 들판이 녹색으로 건조하게 뻗어나가면서 풍차가 꾸준한 리듬으로 회전합니다. 그들.#!"
 TV_WONDER_CEREMONY_S8_TITLE_133:0 "[tv_wonder_ceremony|E]：수자원위원회는 간척지가 승리했다고 선언합니다"
 TV_WONDER_CEREMONY_S8_DESC_133:0 "제방과 그의 헴라덴은 폐쇄식을 기념하기 위해 완성된 링 제방을 따라 진행하며, 매립된 들판이 그 뒤로 녹색과 건조하게 뻗어나가면서 풍차가 꾸준한 리듬으로 회전합니다. 간척지는 이제 영구적인 농지로 자리 잡았으며, 제방과 방앗간은 국가가 어렵게 얻은 땅을 바다로부터 영원히 방어하고 있습니다.\n\n#weak 의식을 완료하려면 필요한 가격을 지불하세요. 그 결과 불가사의의 최종 건물이 세워질 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_133:0 "우리는 간척지의 승리를 선언하고 제방을 따라 수역 폐쇄 행렬을 엽니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_133:0 "워터 보드는 행렬을 지연시켜 폐쇄를 아직 선언하지 않았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_134:0 "@tv_ceremony_food_productivity!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_134:0 "#Y 진행 중#! — #high 잉카는 비탈길 길들이기를 명령했다#!\n#F 사파 잉카는 왕궁 성채 아래의 가파른 측면을 궁정과 사제들에게 먹이를 줄 수 있는 테라스 모양으로 만들 것을 명령하고, 제국 최고의 농업 기술자들을 불러 산의 지형을 조사할 것을 요구합니다. 얼굴.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_134:0 "#G 완료#! — #high 잉카는 비탈길을 길들이라고 명령한다#!\n#F 사파 잉카는 왕궁 성채 아래의 가파른 측면을 궁정과 사제들에게 먹이를 줄 수 있는 테라스 모양으로 만들 것을 명령하고, 제국 최고의 농업 기술자들을 불러 조사할 것을 요구한다. 산의 얼굴.#!"
 TV_WONDER_CEREMONY_S1_TITLE_134:0 "[tv_wonder_ceremony|E]：잉카는 비탈길 길들이기를 명령한다"
 TV_WONDER_CEREMONY_S1_DESC_134:0 "사파 잉카(Sapa Inca)는 왕실 성채 아래의 가파른 측면을 궁정과 성직자들이 먹을 수 있는 테라스 모양으로 만들 것을 명령하고, 제국 최고의 농업 기술자들을 불러 산의 표면을 조사하도록 요청했습니다. 돌 하나가 옮겨지기 전에 파차마마에게 제물을 바칩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_134:0 "나는 첫 번째 라마를 파차마마에게 바치고 시작된 테라스를 지휘합니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_134:0 "Sapa Inca는 명령을 보류하고 슬로프를 한동안 그대로 둡니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_134:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_134:0 "#Y 진행 중#! — #high 산 자체에서 채석된 돌#!\n#F 채석공은 성채 근처 노두에서 딱 맞는 돌을 잘라서 일반 농사를 짓기에는 너무 가파른 경사면에서 엄청난 양의 흙을 지탱할 옹벽을 만들었습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_134:0 "#G 완료#! — #high 산 자체에서 채석된 돌#!\n#F 채석공은 성채 근처의 노두에서 딱 맞는 돌을 잘라서 보통 사람이 들어올 수 없을 정도로 가파른 경사면에서 엄청난 양의 흙을 지탱할 옹벽을 만들었습니다. 농업.#!"
 TV_WONDER_CEREMONY_S2_TITLE_134:0 "[tv_wonder_ceremony|E]:산 자체에서 채석된 돌"
 TV_WONDER_CEREMONY_S2_DESC_134:0 "채석인들은 성채 근처의 노두에서 딱 맞는 돌을 잘라서 일반 농사를 짓기에는 너무 가파른 경사면에서 엄청난 양의 흙을 지탱할 옹벽을 만들었습니다. 라마 열차는 아래 계곡 바닥에서 흙과 자갈을 운반하기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_134:0 "가장 높은 산봉우리라도 인내심 있는 손에는 돌이 나옵니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_134:0 "나는 기다릴 것이다; 산이 더 많은 돌을 포기하기 전에 채석공들을 쉬게 해주세요."
 TV_WONDER_CEREMONY_CARD_ICON_S3_134:0 "@tv_ceremony_advance!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_134:0 "#Y 진행 중#! — #high 엔지니어들이 배수 장치를 배치하다#!\n#F 엔지니어들은 각 테라스가 산비에 씻겨 나가지 않고 배수될 수 있도록 자갈, 모래, 표토의 숨겨진 층을 추적하고, 성직자들은 가장 높은 테라스를 첫 식목을 위한 신성한 땅으로 표시합니다. rite.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_134:0 "#G 완료#! — #high 엔지니어들이 배수 장치를 배치하다#!\n#F 엔지니어들은 각 테라스가 산비에 씻겨 나가지 않고 배수될 수 있도록 자갈, 모래, 표토의 숨겨진 층을 추적하고, 성직자들은 가장 높은 테라스를 첫 식재를 위한 신성한 땅으로 표시합니다. rite.#!"
 TV_WONDER_CEREMONY_S3_TITLE_134:0 "[tv_wonder_ceremony|E]: 엔지니어가 배수 장치를 배치했습니다."
 TV_WONDER_CEREMONY_S3_DESC_134:0 "엔지니어들은 각 테라스가 산속의 비에 씻겨 나가지 않고 배수될 수 있도록 숨겨진 자갈, 모래, 표토층을 추적하고, 성직자들은 가장 높은 테라스를 첫 식목 의식을 위한 신성한 땅으로 표시합니다. 위의 성채는 여전히 말뚝과 끈으로 제한된 작업을 감시합니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_134:0 "엔지니어들은 마킹 스테이크를 깊게 박고 경사면을 따라 배수 라인을 추적합니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_134:0 "급하게 그린 선은 첫 비에 씻겨 나간다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_134:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_134:0 "#Y 진행 중#! — #high 첫 번째 옹벽 설치#!\n#F 인부들은 마침내 가장 낮은 경사면을 따라 첫 번째로 맞춘 돌을 들어올려 산비탈이 진정한 테라스로 올라가기 시작하면서 각 코스 뒤에 자갈과 흙을 채웠습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_134:0 "#G 완료#! — #high 첫 번째 옹벽이 설치되었습니다.#!\n#F 산비탈이 진정한 테라스에서 위로 올라가기 시작하면서 노동자들은 마침내 가장 낮은 경사면을 따라 첫 번째로 맞춘 돌을 들어 올려 각 코스 뒤에 자갈과 흙을 채웠습니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_134:0 "[tv_wonder_ceremony|E]：첫 번째 옹벽 설치"
 TV_WONDER_CEREMONY_S4_DESC_134:0 "인부들은 마침내 가장 낮은 경사면을 따라 첫 번째로 맞춰진 돌을 들어 올려 산비탈이 진정한 테라스에서 위로 올라가기 시작하면서 각 코스 뒤에 자갈과 흙을 포장합니다. 걸었던 줄은 이제 땅을 막는 돌이 됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_134:0 "나는 일꾼들을 비탈길로 풀어준다. 첫 번째 돌이 일어나서 붙들게 하십시오."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_134:0 "노동자들은 아래에서 기다리고 있고, 말뚝에 걸린 줄은 조금 더 오래 비어 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_134:0 "@tv_ceremony_food!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_134:0 "#Y 진행 중#! — #high 성채를 향해 올라가는 테라스#!\n#F 코스는 테라스 벽이 위의 왕실 건물을 향해 경사면을 따라 올라가고, 인부들은 라마 열차가 지나기에는 너무 좁은 길을 따라 돌과 흙을 손으로 지나가고 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_134:0 "#G 완료#! — #high 성채를 향해 올라가는 테라스#!\n#F 코스는 테라스 벽이 위의 왕실 건물을 향해 경사면을 따라 올라가고, 인부들은 라마 열차가 지나기에는 너무 좁은 길을 따라 돌과 흙을 손으로 지나가고 있습니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_134:0 "[tv_wonder_ceremony|E]: 테라스가 성채를 향해 올라갑니다."
 TV_WONDER_CEREMONY_S5_DESC_134:0 "테라스 벽의 코스는 위의 왕실 건물을 향해 경사면을 따라 올라가고, 인부들은 라마 열차가 지나갈 수 없을 정도로 좁은 길을 따라 돌과 흙을 손으로 지나가고 있습니다. 배수로는 최상층에서 쏟아지는 물통으로 테스트됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_134:0 "손에서 손으로 전달된 돌은 어떤 팔로도 던질 수 없는 높이로 올라갑니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_134:0 "나는 더 높은 단계로 올라가기 전에 일꾼들을 더 낮은 단계에 잠시 머물게 합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_134:0 "@tv_ceremony_river!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_134:0 "#Y 진행 중#! — #high 운하가 경사면 아래로 물을 운반합니다#!\n#F 돌로 늘어선 수로가 완성된 테라스를 따라 절단되어 산의 더 높은 곳에서 샘물을 아래로 끌어내려 단일 테라스가 아래 테라스로 범람하지 않고 차례로 각 층에 물을 공급합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_134:0 "#G 완료#! — #high 운하가 경사면 아래로 물을 운반합니다#!\n#F 돌로 늘어선 수로가 완성된 테라스를 따라 절단되어 산의 더 높은 곳에서 샘물을 아래로 끌어내려 단일 테라스가 아래 테라스로 범람하지 않고 차례로 각 층에 물을 공급합니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_134:0 "[tv_wonder_ceremony|E]:운하는 물을 경사면 아래로 운반합니다."
 TV_WONDER_CEREMONY_S6_DESC_134:0 "완성된 테라스를 따라 돌로 늘어선 수로가 절단되어 산의 더 높은 곳에서 샘물을 내려오고, 단 하나의 테라스가 아래 테라스에 범람하지 않고 차례로 각 층에 물을 공급합니다. 농부들은 곧 완성될 테라스를 위한 종자 옥수수와 감자를 준비하기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않았다면 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_134:0 "석공들이 수로를 자르고, 샘물이 층에서 층으로 조심스럽게 내려오기 시작합니다."
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_134:0 "내리막길로 급류된 물은 먹이가 될 밭에 범람합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_134:0 "@tv_ceremony_holy_site!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_134:0 "#Y 진행 중#! — #high 하늘과 가까운 가장 높은 테라스#!\n#F 성채의 사원에 가장 가까운 최상층 테라스는 석공이 관리할 수 있는 가장 잘 맞는 석조물로 마지막으로 마감되었으며, 태양에 직접 바치는 작물을 위해 남겨두었습니다. 신.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_134:0 "#G 완료#! — #high 하늘과 가까운 가장 높은 테라스#!\n#F 성채의 사원에 가장 가까운 최상층 테라스는 석공이 관리할 수 있는 가장 잘 맞는 석조물로 마지막으로 마감되었으며, 태양에 직접 바치는 작물을 위해 남겨두었습니다. 신.#!"
 TV_WONDER_CEREMONY_S7_TITLE_134:0 "[tv_wonder_ceremony|E]：하늘에 가까운 가장 높은 테라스"
 TV_WONDER_CEREMONY_S7_DESC_134:0 "성채의 사원에서 가장 가까운 최상층 테라스는 태양신에게 직접 바치는 농작물을 위해 남겨둔 석공이 관리할 수 있는 가장 잘 맞는 석조물로 마지막으로 마감되었습니다. 성직자는 식목 의식이 시작되기 전에 마지막으로 모든 배수로를 검사합니다.\n\n#weak 식을 다음 단계로 진행하려면 필요한 비용을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_134:0 "나는 석공들에게 나의 가장 좋은 돌을 주고 태양에 가장 가까운 테라스에 왕관을 씌울 수 있도록 축복합니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_134:0 "석공들은 도구를 내려놓았고 가장 높은 테라스는 사원 아래 미완성 상태로 기다리고 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S8_134:0 "@tv_ceremony_religious_influence!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_134:0 "#Y 진행 중#! — #high 첫 파종 의례가 거행됩니다#!\n#F 신부와 농부들이 가장 높은 테라스에 모여 산의 새로운 땅에 압착된 첫 번째 옥수수 알갱이를 축복합니다. 왕의 성채는 맨 바위만 있던 비탈을 내려다보고 있습니다. 이전.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_134:0 "#G 완료#! — #high 첫 번째 파종 의례가 거행됩니다#!\n#F 사제들과 농부들이 가장 높은 테라스에 모여 산의 새로운 땅에 압착된 첫 번째 옥수수 알맹이를 축복합니다. 왕의 성채는 맨 바위만 있던 경사면을 내려다보고 있습니다. 이전.#!"
 TV_WONDER_CEREMONY_S8_TITLE_134:0 "[tv_wonder_ceremony|E]：첫 번째 파종식이 거행됩니다"
 TV_WONDER_CEREMONY_S8_DESC_134:0 "성직자와 농부들은 가장 높은 테라스에 모여 산의 새로운 토양에 압착된 최초의 옥수수 알갱이를 축복합니다. 왕의 성채는 불과 몇 시즌 전만 해도 맨돌이었던 경사면을 내려다보고 있습니다. 이제 테라스는 산 정착지에 영구적으로 식량을 공급하여 가장 가파른 안데스 경사면을 제국에서 가장 믿을 수 있는 농지로 변모시킵니다.\n\n#weak 의식을 완료하는 데 필요한 가격을 지불하세요. 결과적으로 불가사의의 최종 건물이 세워질 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_134:0 "성채가 조용히 지켜보는 동안 사제들은 첫 번째로 축복받은 낟알을 새 땅에 밀어넣습니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_134:0 "나는 사제들에게 기다리라고 요청합니다. 산의 첫 수확은 또 다른 계절의 축복을 받을 수 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_135:0 "@tv_ceremony_maritime_presence!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_135:0 "#Y 진행 중#! — #high 왕관이 야드 확장 명령을 내림#!\n#F 해군은 해협을 지배할 함대에 걸맞은 포츠머스 조선소를 왕에게 청원했고, 왕립 측량사는 새로운 건선 부두, 로프워크 및 기타 시설을 위한 부지를 표시하기 위해 파견되었습니다. 항구를 따라 창고.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_135:0 "#G 완료#! — #high 왕관이 야드 확장 명령을 내림#!\n#F 해군은 해협을 지배할 함대에 걸맞은 포츠머스 조선소를 왕에게 청원했고, 왕립 측량사는 새로운 건선 부두, 로프워크 및 기타 시설을 위한 부지를 표시하기 위해 파견되었습니다. 항구를 따라 창고.#!"
 TV_WONDER_CEREMONY_S1_TITLE_135:0 "[tv_wonder_ceremony|E]：왕관이 마당을 확대하라고 명령하다"
 TV_WONDER_CEREMONY_S1_DESC_135:0 "해군성은 해협을 지배할 함대에 걸맞는 포츠머스의 조선소를 국왕에게 청원하고, 항구를 따라 새로운 건선 부두, 로프워크 및 창고를 위한 부지를 표시하기 위해 왕실 측량관이 파견됩니다. 조선공과 장비 작업자가 해안 위아래로 야드에서 도착하기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_135:0 "왕관은 왕실의 약속을 승인하고 측량사는 새 마당을 위한 땅을 측설합니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_135:0 "우리는 잠시 동안 우리의 말을 보류합니다. 포츠머스의 마당은 기다려야 한다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_135:0 "@tv_ceremony_building_needs!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_135:0 "#Y 진행 중#! — #high 목재와 대마가 항구로 부름#!\n#F 왕국의 숲에서 온 참나무 목재와 내륙 로프워크에서 가져온 대마 호송대가 부두 하나를 파기 전에 야드를 비축하기 위해 항구에 도착하고 석공들은 건선 부두에 돌을 채석하기 시작합니다. 벽.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_135:0 "#G 완료#! — #high 목재와 대마가 항구로 부름#!\n#F 왕국의 숲에서 온 참나무 목재와 내륙 로프워크에서 가져온 대마 호송대가 부두 하나를 파기 전에 야드를 비축하기 위해 항구에 도착하고, 석공들은 마른 땅을 위해 돌을 채석하기 시작합니다. 도크 벽.#!"
 TV_WONDER_CEREMONY_S2_TITLE_135:0 "[tv_wonder_ceremony|E]：목재와 대마를 항구로 불러오다"
 TV_WONDER_CEREMONY_S2_DESC_135:0 "왕실 숲에서 온 참나무 목재와 내륙 로프워크에서 가져온 대마가 부두 하나를 파기 전에 마당을 비축하기 위해 항구에 도착하고, 석공들은 마른 부두 벽에 돌을 채석하기 시작합니다. 해군 사무원은 모든 판자와 코일을 추적하기 위해 첫 번째 원장을 설정했습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_135:0 "장부가 영업을 시작하자 목재와 대마를 실은 호송대가 항구로 들어옵니다."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_135:0 "호송대는 저지되었습니다. 목재 야드는 한동안 비어 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S3_135:0 "@tv_ceremony_law!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_135:0 "#Y 진행 중#! — #high 킹스 야드(King's Yard)가 표시됨#!\n#F 공식적으로 킹스 야드(King's Yard) 부지를 공식적으로 봉헌하기 위해 항구를 따라 진행되며, 드라이 도크, 식료품 점포 및 길이를 뻗을 거대한 로프워크에 대한 계획이 확정되었습니다. 군함의 케이블.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_135:0 "#G 완료#! — #high 왕의 뜰이 표시되어 있습니다#!\n#F 공무원들이 공식적으로 왕의 뜰 땅을 봉헌하기 위해 항구를 따라 진행하고 있으며 건선 부두, 식료품점, 그리고 바다를 뻗을 거대한 로프워크에 대한 계획이 확정되었습니다. 군함 케이블의 길이.#!"
 TV_WONDER_CEREMONY_S3_TITLE_135:0 "[tv_wonder_ceremony|E]：왕의 마당이 표시되어 있습니다"
 TV_WONDER_CEREMONY_S3_DESC_135:0 "관리들은 King's Yard의 땅을 공식적으로 봉헌하기 위해 항구를 따라 이동하며 건선거, 식료품 저장고, 군함 케이블 길이만큼 뻗어 있는 거대한 로프워크에 대한 계획이 확정됩니다. 작업의 각 단계를 감독하기 위해 조선공과 계약이 체결되었습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_135:0 "나는 이 땅을 봉헌하고 조선공의 계약에 도장을 찍습니다."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_135:0 "관리들은 봉헌식을 연기하고 왕의 뜰을 표시하지 않은 채 남겨 둡니다."
 TV_WONDER_CEREMONY_CARD_ICON_S4_135:0 "@tv_ceremony_navy_strength!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_135:0 "#Y 진행 중#! — #high 첫 번째 건선거가 절단되었습니다.#!\n#F 인부들이 마침내 최초의 건선거 착공을 시작하여 항구의 진흙과 점토를 기반암 쪽으로 파내서 문으로 조수를 막을 수 있게 했습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_135:0 "#G 완료#! — #high 첫 번째 건선거가 절단되었습니다.#!\n#F 인부들이 마침내 첫 번째 건선거 착공에 성공하여 항구의 진흙과 점토를 기반암 쪽으로 파내서 성문이 조수를 막을 수 있게 했습니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_135:0 "[tv_wonder_ceremony|E]: 첫 번째 드라이 도크가 절단되었습니다."
 TV_WONDER_CEREMONY_S4_DESC_135:0 "인부들은 마침내 첫 번째 진정한 건선착장에서 착공하여 항구의 진흙과 점토를 기반암 쪽으로 파내서 성문이 조수를 막을 수 있도록 했습니다. 조사된 줄과 쌓인 목재는 이제 군함의 선체를 받칠 수 있을 만큼 깊은 발굴이 됩니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_135:0 "인부들은 마침내 땅을 파고 기반암을 향해 진흙과 점토를 파내었습니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_135:0 "우리는 아직 인부들에게 땅을 파게 할 준비가 되어 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S5_135:0 "@tv_ceremony_production_method!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_135:0 "#Y 진행 중#! — #high 길이가 늘어난 로프워크#!\n#F 대형 로프워크는 라인에서 가장 긴 케이블의 배 길이를 쭉 뻗은 하나의 긴 창고로 솟아오릅니다. 스피너는 새벽부터 황혼까지 꼬는 기계에 대마를 공급합니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_135:0 "#G 완료#! — #high 길이가 늘어난 로프워크#!\n#F 위대한 로프워크는 라인에서 가장 긴 케이블의 배 길이를 뻗은 하나의 긴 헛간으로 솟아 있으며, 방적공은 새벽부터 황혼까지 꼬는 기계에 대마를 공급합니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_135:0 "[tv_wonder_ceremony|E]：로프워크의 길이가 늘어납니다"
 TV_WONDER_CEREMONY_S5_DESC_135:0 "거대한 로프워크는 라인에서 가장 긴 케이블의 배 길이만큼 뻗어 있는 하나의 긴 창고로 솟아 있으며, 방적공은 새벽부터 황혼까지 꼬는 기계에 대마를 공급합니다. 근처의 대포 주조소에서는 아직 건조되지 않은 선박에 필요한 첫 번째 총을 주조하기 시작합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_135:0 "스피너가 꼬는 기계에 대마를 공급할 때 로프워크가 해안을 따라 올라갑니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_135:0 "로프워크의 프레임은 미완성 상태로 서 있고, 기계는 한동안 조용합니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_135:0 "@tv_ceremony_port!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_135:0 "#Y 진행 중#! — #high 항구를 따라 늘어나는 건조 도크#!\n#F A 두 번째 및 세 번째 건조 도크는 해안가를 따라 절단 및 문이 설치되어 있으며, 돌담이 마주하고 조수를 방지하기 위해 펌프가 설치되어 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_135:0 "#G Completed#! — #high 항구를 따라 늘어나는 건조 도크#!\n#F A 두 번째 및 세 번째 건조 도크는 해안가를 따라 절단 및 문이 설치되어 있으며, 돌담이 마주보고 펌프가 설치되어 조수를 막고 있습니다.#!"
 TV_WONDER_CEREMONY_S6_TITLE_135:0 "[tv_wonder_ceremony|E]：항구를 따라 늘어나는 드라이 도크"
 TV_WONDER_CEREMONY_S6_DESC_135:0 "두 번째와 세 번째 드라이 도크는 해안가를 따라 절단 및 문으로 막혀 있으며, 돌담이 마주보고 펌프가 설치되어 조수를 막고 있습니다. 함대가 급히 출항해야 하는 날을 대비해 음식을 만드는 마당의 창고는 소금 쇠고기, 비스킷, 맥주로 가득 차 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_135:0 "더 많은 부두, 더 많은 매장 - 앞으로!"
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_135:0 "창고는 반쯤 채워져 있고 새 부두는 문이 열려 있지 않습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S7_135:0 "@tv_ceremony_cannons!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_135:0 "#Y 진행 중#! — #high 함대를 위한 야드 소집#!\n#F 완성된 조선소는 첫 번째 군함의 선미를 갖추었고, 대포 저장소에서 총을 들어올리고 장비가 새로운 로프워크의 블록을 통과하는 동안 함대를 완전히 소집했습니다. 야드의 준비 상태를 테스트하기 위해 항구에 모입니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_135:0 "#G 완료#! — #high 함대를 위한 야드 소집#!\n#F 완성된 조선소는 첫 번째 전함 줄기를 선미에 맞추고 대포 저장소에서 총을 들어올리고 삭구가 새로운 로프워크의 블록을 통과하는 동안 함대를 완전히 소집합니다. 야드의 준비 상태를 테스트하기 위해 항구에 모입니다.#!"
 TV_WONDER_CEREMONY_S7_TITLE_135:0 "[tv_wonder_ceremony|E]: 함대를 위한 야드 소집"
 TV_WONDER_CEREMONY_S7_DESC_135:0 "완성된 조선소는 첫 번째 전함의 선미를 맞추고, 대포 창고에서 끌어올린 총과 새로운 로프워크의 블록을 통과하는 장비를 갖추고 있으며, 함대 전체가 항구에 모여 야드의 준비 상태를 테스트합니다. 장교들은 해협을 감히 위협하는 어떤 침략 함대에 맞서 함대를 무장시킬 수 있다고 선언합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_135:0 "야드는 총을 싣고 함대를 소집하여 준비 상태를 증명합니다."
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_135:0 "아직은 아닙니다. 함대를 기다리게 하세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S8_135:0 "@tv_ceremony_ship!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_135:0 "#Y 진행 중#! — #high 함대는 완성된 야적장에서 항해합니다#!\n#F 해군은 전체 편대가 건선창과 창고를 지나 검토 중에 항해하고 항구 요새에서 경례를 하고 군중이 성벽을 따라 모이는 동안 조선소가 완성되었다고 선언합니다. 시청하세요.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_135:0 "#G 완료#! — #high 완성된 야적장에서 함대 항해#!\n#F 해군은 전체 편대가 건조 도크와 창고를 지나 검토 중에 항해하고 항구 요새에서 총포가 경례하고 해안을 따라 모이는 가운데 조선소가 완성되었다고 선언합니다. 지켜볼 벽.#!"
 TV_WONDER_CEREMONY_S8_TITLE_135:0 "[tv_wonder_ceremony|E]: 완성된 야드에서 함대 항해"
 TV_WONDER_CEREMONY_S8_DESC_135:0 "해군성은 전체 편대가 건선창과 창고를 지나 항해하고, 항구 요새에서 총포가 경례하고, 군중이 벽을 따라 모여 지켜보는 가운데 조선소가 완성되었음을 선언합니다. 포츠머스의 야드는 이제 왕이 바다를 장악하는 한 국가의 해군력, 무장 및 보급 함대의 영구 대장간으로 서 있습니다.\n\n#weak 행사를 완료하는 데 필요한 가격을 지불하세요. 결과적으로 불가사의의 마지막 건물이 솟아오를 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_135:0 "함대가 경례를 위해 출항하는 동안 해군성은 마당이 완성되었음을 선언합니다."
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_135:0 "해군성은 선언을 보류했고 함대는 한동안 정박해 있습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S1_136:0 "@tv_ceremony_trade!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_136:0 "#Y 진행 중#! — #high 왕이 실버 루트를 선포하다#!\n#F A 왕실 칙령은 카레라 데 인디아스를 공식화하고 세비야를 미국 보물의 유일한 관문으로 지정하고 카사 드 콘트라타시온의 사무원을 소환하여 준비를 하게 했습니다. 원장.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_136:0 "#G 완료#! — #high 왕관이 은빛 길을 선포하다#!\n#F A 왕실 칙령은 카레라 데 인디아스를 공식화하고 세비야를 미국 보물의 유일한 관문으로 지정하고 카사 드 콘트라타시온의 사무원을 소환하여 준비를 하게 했습니다. 원장.#!"
 TV_WONDER_CEREMONY_S1_TITLE_136:0 "[tv_wonder_ceremony|E]:왕관이 실버 루트를 선포하다"
 TV_WONDER_CEREMONY_S1_DESC_136:0 "왕실 법령은 세비야를 미국 보물의 유일한 관문으로 지정하고 장부를 준비하기 위해 Casa de Contratacion의 사무원을 소환하여 Carrera de Indias를 공식화했습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리십시오.#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_136:0 "우리는 세비야를 인도로 향하는 왕관의 유일한 관문으로 선언합니다."
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_136:0 "법원은 망설이고 법령은 서명되지 않았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S2_136:0 "@tv_ceremony_river!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_136:0 "#Y 진행 중#! — #high 과달키비르 지도 작성#!\n#F 조종사와 강 주인은 과달키비르의 얕은 물을 울려 갤리온선이 들어갈 만큼 깊은 수로를 표시하고 더 적게 삼킨 모래톱에 대해 경고합니다. 선박.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_136:0 "#G Completed#! — #high 과달키비르 지도 작성#!\n#F 조종사와 강의 주인은 과달키비르의 얕은 물을 울려 갤리온선이 들어갈 수 있을 만큼 깊은 수로를 표시하고 더 적게 삼킨 모래톱에 대해 경고합니다. 선박.#!"
 TV_WONDER_CEREMONY_S2_TITLE_136:0 "[tv_wonder_ceremony|E]：과달키비르 차트 작성"
 TV_WONDER_CEREMONY_S2_DESC_136:0 "조종사와 강의 주인은 과달키비르의 얕은 물을 울려서 짐을 실은 갤리온선이 지나갈 수 있을 만큼 깊은 수로를 표시하고 작은 배를 삼킨 모래톱에 대해 경고합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하거나 아직 때가 되지 않은 경우 기다리세요.#!"
