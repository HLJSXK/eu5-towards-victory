 TV_WONDER_CEREMONY_CARD_ICON_S4_150:0 "@tv_ceremony_holy_site!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_150:0 "#Y 진행 중#! — #high 첫 번째 예배당의 벽이 솟아오릅니다.#!\n#F 가장 큰 기둥의 평평해진 정상에 석공들은 수도원 예배당의 첫 번째 진정한 벽을 놓았고, 아래로 길이 없기 때문에 모르타르를 바위 자체에 섞었습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_150:0 "#G 완료#! — #high 첫 번째 예배당의 벽 상승#!\n#F 가장 큰 기둥의 평평해진 정상에 석공들은 수도원 예배당의 첫 번째 진정한 벽을 놓았고, 아래로 도로가 없기 때문에 모르타르를 바위 자체에 섞었습니다.#!"
 TV_WONDER_CEREMONY_S4_TITLE_150:0 "[tv_wonder_ceremony|E]：첫 번째 예배당의 벽이 솟아오른다"
 TV_WONDER_CEREMONY_S4_DESC_150:0 "가장 큰 기둥의 평평한 정상에 석공들은 수도원 예배당의 첫 번째 진정한 벽을 놓았습니다. 아래에는 길이 없기 때문에 모르타르를 바위 자체에 섞었습니다. 밧줄과 야망으로 시작된 것이 이제 하늘을 배경으로 한 돌처럼 서 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_150:0 "석공들은 정상에 모르타르를 섞고 예배당의 첫 번째 벽을 세웁니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_150:0 "이번 시즌은 아닙니다!"
 TV_WONDER_CEREMONY_CARD_ICON_S5_150:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_150:0 "#Y 진행 중#! — #high 절벽면을 자른 세포#!\n#F 작은 수도원 세포가 기둥 표면의 빈 공간에 직접 새겨져 있으며, 바위에 붙어 있는 좁은 회랑으로 연결되어 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_150:0 "#G 완료#! — #high 절벽면을 잘라낸 세포#!\n#F 작은 수도원 세포는 기둥 표면의 빈 공간에 직접 새겨져 있으며, 바위에 붙어 있는 좁은 회랑으로 연결되어 있습니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_150:0 "[tv_wonder_ceremony|E]：절벽면으로 절단된 세포"
 TV_WONDER_CEREMONY_S5_DESC_150:0 "작은 수도원 세포는 기둥 표면의 빈 공간에 직접 새겨져 있으며 바위에 붙어 있는 좁은 회랑으로 연결되어 있습니다. 아이콘 화가들이 모든 내부 벽을 덮을 프레스코화를 시작하기 위해 올라갑니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_150:0 "우리는 이 벽을 성스러운 빛으로 덮을 성상 화가들을 소환합니다."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_150:0 "맨손의 감방은 기다리고 있는데, 그 벽은 아직 도색되지 않았습니다."
 TV_WONDER_CEREMONY_CARD_ICON_S6_150:0 "@tv_ceremony_food!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_150:0 "#Y 진행 중#! — #high 식당과 물탱크#!\n#F A 식당 홀과 바위를 깎은 물탱크가 완성되어 지역사회가 아래 계곡에서 단절된 긴 겨울을 견딜 수 있게 되었으며, 조각된 계단이 가장 오래되고 가장 위험한 밧줄을 대체하기 시작합니다. 등정.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_150:0 "#G 완료#! — #high 식당과 물탱크#!\n#F A 식당 홀과 바위를 깎은 물탱크가 완성되어 지역사회가 아래 계곡에서 단절된 긴 겨울을 견딜 수 있게 되었으며, 조각된 계단이 가장 오래되고 가장 위험한 밧줄을 대체하기 시작했습니다. 등정.#!"
 TV_WONDER_CEREMONY_S6_TITLE_150:0 "[tv_wonder_ceremony|E]：식당과 수조"
 TV_WONDER_CEREMONY_S6_DESC_150:0 "지역사회가 아래 계곡에서 단절된 긴 겨울을 견딜 수 있도록 식당 홀과 바위를 깎은 수조가 완성되었으며, 조각된 계단이 가장 오래되고 가장 위험한 로프 오르막을 대체하기 시작했습니다.\n\n#weak 예식을 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
