 TV_WONDER_CEREMONY_S8_DESC_196:0 "실크 쿼터가 완성되었다고 선언되면서 두 강을 가로질러 종소리가 울리고, 리옹의 베틀이 전 세계의 의류 코트와 시장을 시작합니다.\n\n#weak 식을 완료하는 데 필요한 가격을 지불하세요. 그 결과 경이로운 마지막 건물이 세워질 것입니다.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_196:0 "실크 쿼터가 완성됨을 선언하면서 종소리가 두 강을 가로질러 울립니다."
