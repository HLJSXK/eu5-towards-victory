 TV_WONDER_CEREMONY_CARD_ICON_S4_186:0 "@tv_ceremony_defensive_military_stance!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_186:0 "#Y 진행 중#! — #high 방벽 벽에 첫 번째 목재가 사용되었습니다.#!\n#F 날카롭게 다듬은 참나무 말뚝이 선택한 섬 주변의 진정한 방어벽 벽으로 솟아오릅니다. 라다의 투표와 성직자의 투표 이후 시크의 실제 건설이 현재 진행 중입니다. 축복.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_186:0 "#G 완료#! — #high 방벽 벽에 첫 번째 목재가 사용되었습니다.#!\n#F 날카롭게 다듬은 참나무 말뚝이 선택한 섬 주변의 진정한 방어벽 벽으로 솟아오릅니다. 이제 라다의 투표와 성직자의 투표 이후 시크의 실제 건설이 진행 중입니다. 축복.#!"
 TV_WONDER_CEREMONY_S4_TITLE_186:0 "[tv_wonder_ceremony|E]: 팰리세이드 벽에 최초의 목재 사용"
 TV_WONDER_CEREMONY_S4_DESC_186:0 "날카롭게 깎은 참나무 말뚝이 선택한 섬 주변의 진정한 방어벽 벽으로 솟아오릅니다. 시크의 실제 건설은 라다의 투표와 사제의 축복 이후 현재 진행 중입니다. 코사크는 진흙과 갈대 사이로 목재를 운반하여 뒤에 있는 마차 캠프의 방어를 강화합니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 대가를 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_186:0 "코사크는 진흙을 통해 목재를 운반하고 첫 번째 방어벽 벽을 세웁니다."
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_186:0 "잠시 기다려 주세요. 아직 목재 시즌을 잠시 기다려 보세요!"
 TV_WONDER_CEREMONY_CARD_ICON_S5_186:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_186:0 "#Y 진행 중#! — #high 쿠린족이 광장을 중심으로 솟아오르다#!\n#F 긴 나무 쿠린 막사가 개방형 라다 광장 주변의 고리 모양으로 솟아 있으며, 각 막사는 자체 아타만과 깃발 아래 무료 코사크 중대를 수용하고 있습니다.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_186:0 "#G 완료#! — #high 쿠린족이 광장을 중심으로 솟아오르다#!\n#F 오픈 라다 광장 주변의 고리 모양으로 긴 목조 쿠린 막사가 솟아 있으며, 각 막사는 자체 아타만과 깃발 아래 무료 코사크 중대를 수용하고 있습니다.#!"
 TV_WONDER_CEREMONY_S5_TITLE_186:0 "[tv_wonder_ceremony|E]: 쿠린이 광장을 돌아다니다"
 TV_WONDER_CEREMONY_S5_DESC_186:0 "긴 목조 쿠린 병영이 탁 트인 라다 광장 주변에 원형으로 솟아 있으며, 각 막사는 자체 아타만과 깃발 아래 무료 코사크 부대를 수용하고 있습니다. 중앙에 있는 땅은 열려 있고, 이미 전체 호스트가 모여 뜻을 외칠 장소로 표시되어 있습니다.\n\n#weak 행사를 다음 단계로 진행하려면 필요한 가격을 지불하세요. 아니면 아직 때가 되지 않은 경우 기다리세요.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_186:0 "우리는 쿠린을 키우고 호스트가 모일 수 있도록 광장을 열어 둡니다."
