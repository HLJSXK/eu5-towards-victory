 tv_engineering_department.7189.t:0 "건설: [tv_great_engineer|E]가 너무 빨리 말함"
 tv_engineering_department.7189.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]는 작품이 자랑을 뒷받침하기 전에 너무 자신있게 말합니다. 작업은 계속되지만 [prestige|E]는 감독으로 인해 어려움을 겪습니다.\n\n#R 이 이벤트는 현재 [tv_great_engineer|E]의 유효 군사 능력이 50 이하이기 때문에 발생했습니다.#!"
