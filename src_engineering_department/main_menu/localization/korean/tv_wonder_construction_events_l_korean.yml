 tv_engineering_department.7000.t:0 "건축: 거리가 현장에 박수를 보낸다"
 tv_engineering_department.7000.d:0 "울타리에서 몇 가지 눈에 띄는 성공은 호기심을 자부심으로 바꿉니다. 길드 장로들이 이름을 빌려주고, 이웃들은 그 작품을 왕실의 허영심으로 취급하는 것을 중단하며, 프로젝트는 [tv_wonder_domestic_support|E]에 대한 더 확실한 소유권을 얻습니다."
 tv_engineering_department.7000.a:0 "길드 장로들의 새로운 선의가 사업을 추진하도록 합시다."
 tv_engineering_department.7001.t:0 "건설: 지구상의 더 넓은 선"
 tv_engineering_department.7001.d:0 "새로운 측정을 통해 더 넓은 공간을 지탱할 수 있는 지면이 드러났습니다. 양피지에서 야망처럼 보였던 것이 이제 견딜 수 있는 기반을 갖게 되었고, [tv_wonder_scale_competence|E]는 앞으로 도약합니다."
 tv_engineering_department.7001.a:0 "방금 조사한 내용이 더 넓은 근거를 가지고 있다고 주장합니다."
 tv_engineering_department.7002.t:0 "건설: 이름과 명령이 자리를 잡습니다"
 tv_engineering_department.7002.d:0 "마당은 새로운 명단 아래에서 깨어납니다. 승무원은 어디에 서 있어야 하는지 알고, 직원은 어떤 집계가 중요한지 알고 있으며, [tv_wonder_organization_competence|E]는 혼란이 숨을 곳이 적기 때문에 상승합니다."
 tv_engineering_department.7002.a:0 "혼란이 다시 찾아오기 전에 새로운 명단을 확정합니다."
 tv_engineering_department.7003.t:0 "건설: 도로와 수레가 리듬을 찾습니다"
 tv_engineering_department.7003.d:0 "더 나은 경로는 도로, 물, 창고 및 비계를 연결합니다. 이를 사용한 첫 번째 호송대가 당황스러울 정도로 정시에 도착하고 [tv_wonder_logistics_competence|E]가 급증합니다."
 tv_engineering_department.7003.a:0 "카트를 제 시간에 맞춰 운행하세요!"
 tv_engineering_department.7004.t:0 "건축: 돌이 표시를 지나서 솟아오른다"
 tv_engineering_department.7004.d:0 "활성 부분은 표시등이 꺼지기 전에 해당 표시를 넘어 상승합니다. 어떤 기적도 그것을 설명하지 못합니다. 리프트, 조인트 및 손이 적절한 시간에 만나서 [tv_wonder_construction|E] 진행을 앞당깁니다."
 tv_engineering_department.7004.a:0 "리프트가 표시를 지나서 작동하도록 합니다."
 tv_engineering_department.7005.t:0 "건설 : 스트리트 토크 턴"
 tv_engineering_department.7005.d:0 "사이트 주변의 소음이 부드러워집니다. 환호는 아니지만 수레가 지나가고 논쟁이 더 빨리 끝나도록 허락하는 것입니다. [tv_wonder_domestic_support|E]는 유용한 마진만큼 상승합니다."
 tv_engineering_department.7005.a:0 "카트를 통과시키고 논쟁은 사라집니다."
 tv_engineering_department.7006.t:0 "건설: 조치가 시정되었습니다"
 tv_engineering_department.7006.d:0 "비좁았던 각도가 다시 그려지고, 서비스 통로가 넓어지며, 기념비의 본선이 다시 숨을 쉰다. [tv_wonder_scale_competence|E]의 개선은 작지만 현실적입니다."
 tv_engineering_department.7006.a:0 "경로를 넓히고 디자인에 숨을 불어넣습니다."
 tv_engineering_department.7007.t:0 "건설: 마당은 리듬을 배운다"
 tv_engineering_department.7007.d:0 "누락된 핸드오버 세트가 복구되었습니다. 작업이 의식에 비해 너무 건조하지만 도구를 계속 움직이게 하고 [tv_wonder_organization_competence|E]를 개선합니다."
 tv_engineering_department.7007.a:0 "우리는 핸드오버를 패치하고 도구를 계속 움직입니다."
 tv_engineering_department.7008.t:0 "건설:Ruts는 더 나은 길을 찾습니다"
 tv_engineering_department.7008.d:0 "공급 라인의 잘못된 방향 하나가 수정되었습니다. 빈 상태로 대기하는 카트가 줄어들고, 손상된 상태로 도착하는 로드가 줄어들고, [tv_wonder_logistics_competence|E]가 향상됩니다."
 tv_engineering_department.7008.a:0 "더 많은 하중이 부서지기 전에 잘못된 회전을 곧게 만듭니다."
 tv_engineering_department.7009.t:0 "공사: 해머즈 드로우 준공 임박"
 tv_engineering_department.7009.d:0 "완고한 관절이 마침내 맞고 다음 승무원은 한 달도 더 기다리지 않고 시작할 수 있습니다. [tv_wonder_construction|E]의 진전은 가장 만족스러운 방식, 즉 시각적으로 진행됩니다."
 tv_engineering_department.7009.a:0 "드디어, 딱 맞았다!"
 tv_engineering_department.7010.t:0 "건설 : 문앞의 빵돈"
 tv_engineering_department.7010.d:0 "군중이 문 앞에 모여서 그 기적이 가난한 자들을 위한 빵을 먹는다고 중얼거린다. 재무부가 거리 전체가 보이는 곳에 [gold|E]를 열고 지금 지불하면 투덜거림이 조용해지고 [tv_wonder_domestic_support|E]가 상승할 것입니다. 그러나 동전은 돌아오지 않습니다."
 tv_engineering_department.7010.a:0 "군중이 모두 보는 앞에서 지불하십시오."
 tv_engineering_department.7010.b:0 "장부는 공개 유인물 없이도 충분히 얇습니다."
 tv_engineering_department.7011.t:0 "건축: 설교자가 왕권에 의문을 제기하다"
 tv_engineering_department.7011.d:0 "한 지역 설교자는 그의 신도들에게 이 경이로움은 왕관이 요구하는 어떤 권리가 아니라 자부심에 기초한다고 말했습니다. 왕실 [legitimacy|E]를 서면 법령 뒤에 두는 것은 설교가 더 퍼지기 전에 문제를 해결하고 [tv_wonder_domestic_support|E]를 안정시킬 것입니다."
 tv_engineering_department.7011.a:0 "법령을 봉인하고 왕의 말로 문제를 종결시키십시오."
 tv_engineering_department.7011.b:0 "한 설교자의 불평에 대한 왕의 법령은 강함이 아니라 약함처럼 보입니다."
 tv_engineering_department.7012.t:0 "건설: 채석장 도로가 공통 필드를 분할합니다."
 tv_engineering_department.7012.d:0 "새로운 채석장 도로는 두 마을의 공동 밭을 직선으로 통과합니다. 재정착을 강제하기 위해 [stability|E]를 지출하면 길을 비우고 놀라운 일이 끝나기를 원하는 사람들 사이에서 [tv_wonder_domestic_support|E]를 들어 올릴 수 있습니다. 그 대가로 그 마을에서 얻은 평화를 희생해야 합니다."
 tv_engineering_department.7012.a:0 "정착을 명령하고 도로를 통과시키십시오."
 tv_engineering_department.7012.b:0 "두 마을의 들판은 더 짧은 수레 경로만큼 가치가 없습니다."
 tv_engineering_department.7013.t:0 "건설: 외국 사절이 허영 프로젝트를 조롱하다"
 tv_engineering_department.7013.d:0 "라이벌 법원의 사절들은 이 경이로움을 그 뒤에 있는 재무부에 비해 너무 큰 허영심 프로젝트라고 부릅니다. 호화로운 리셉션에 [prestige|E]를 지출하면 그들이 집으로 가져가는 이야기를 바꾸고 [tv_wonder_domestic_support|E]를 높일 수 있습니다. 그러나 한 번 손님을 칭찬하는 데 소비한 왕관의 지위는 쉽게 채워지지 않습니다."
 tv_engineering_department.7013.a:0 "리셉션에 돈을 쓰고 사절들이 집으로 가져갈 것을 바꾸십시오."
 tv_engineering_department.7013.b:0 "외국 가십은 왕관의 지위를 낭비할 가치가 없습니다."
 tv_engineering_department.7014.t:0 "건설:귀족의 사냥터가 재목장이 되다"
 tv_engineering_department.7014.d:0 "불가사의의 석공들은 목재를 준비하기 위해 귀족의 사냥을 원합니다. 그는 그것을 허락할 것이지만, 호의를 위해서만 왕관은 귀족들 사이에서 [estate_satisfaction|E]에 대해 계산되어야 합니다. 지금은 사용되었지만 목재가 움직이기 시작하면 여전히 [tv_wonder_domestic_support|E]를 들어올릴 것입니다."
 tv_engineering_department.7014.a:0 "호의를 베풀고 목재 땅을 차지하십시오."
 tv_engineering_department.7014.b:0 "한 귀족의 선의는 그에게 빚을 질 가치가 없습니다."
 tv_engineering_department.7015.t:0 "건축: 교구 종은 청동을 요구받습니다"
 tv_engineering_department.7015.d:0 "불가사의의 창립자들은 부속품으로 다시 주조하기 위해 교구 종을 요청하고 싶어합니다. 신부는 빈 종탑을 외면하겠지만 성직자들 사이에서는 [estate_satisfaction|E]의 비용이 듭니다. [tv_wonder_domestic_support|E]는 아직 완성되지 않은 비계보다 더 나은 가격입니다."
 tv_engineering_department.7015.a:0 "제대로 물어보고 종을 주조소에 맡겨라."
 tv_engineering_department.7015.b:0 "빈 종탑은 설비의 가치보다 더 많은 화제를 불러일으킬 것입니다."
 tv_engineering_department.7016.t:0 "건설: 보급 카트가 시장 광장을 질식시키다"
 tv_engineering_department.7016.d:0 "원더의 보급품 카트는 배송일에도 시장 광장을 계속 막고 있습니다. 길드 마스터는 카트 주위에 자신의 노점 경로를 변경하지만 시민 사이에서 [estate_satisfaction|E]를 끌어내립니다. 이 비용은 광장이 카트와의 싸움을 멈춘 후에도 일부 [tv_wonder_domestic_support|E]를 다시 구매할 수 있습니다."
 tv_engineering_department.7016.a:0 "길드에 직접 물어보고 카트를 통과시키세요."
 tv_engineering_department.7016.b:0 "카터에게 벌금을 부과하는 것은 길드에 부탁하는 것보다 간단합니다."
 tv_engineering_department.7017.t:0 "건설: 수확이 끝난 후 코르비(Corvee) 개최"
 tv_engineering_department.7017.d:0 "감독자는 추수 기간이 지나서 코르비 갱단이 서리가 내리기 전에 기초를 완성하기를 원합니다. 마을 장로들은 동의하겠지만 농민들 사이에서는 [estate_satisfaction|E]의 비용이 듭니다. 지금 지출하더라도 여전히 겨울 동안 반쯤 파낸 기초보다 [tv_wonder_domestic_support|E]가 더 높을 것입니다."
 tv_engineering_department.7017.a:0 "분명하게 말하고 수확이 지나도록 갱단을 붙잡으십시오."
 tv_engineering_department.7017.b:0 "수확은 기초 위에서 기다릴 수 없습니다."
 tv_engineering_department.7018.t:0 "건설: 연립 주택이 방해가 됩니다."
 tv_engineering_department.7018.d:0 "석공들은 부지가 너무 좁아서 옆에 있는 다세대 주택을 철거하지 않고서는 다음 코스를 올릴 수 없다고 말합니다. 완전히 주문하면 건물이 무너지면서 현장에서 [development|E]가 중단되지만 작업과 [tv_wonder_domestic_support|E]가 다시 진행될 수 있습니다."
 tv_engineering_department.7018.a:0 "행을 파괴하고 사이트를 넓히라고 명령하십시오."
 tv_engineering_department.7018.b:0 "비좁은 부지는 쫓겨난 세입자가 사는 거리보다 살기가 더 쉽습니다."
 tv_engineering_department.7019.t:0 "건설 : 현장에 대한 일반 무역 굴곡"
 tv_engineering_department.7019.d:0 "지역 수레업자와 석공들은 현장 공급을 유지하기 위해 일상적인 거래를 중단했습니다. 이것을 계속 놔두면 일반 비즈니스가 줄어들면서 현장에서 [prosperity|E]가 피를 흘릴 것입니다. 그러나 안정적인 배송은 여전히 [tv_wonder_domestic_support|E]로 볼 가치가 있습니다."
 tv_engineering_department.7019.a:0 "지역 무역이 계속해서 사업을 추진하도록 하십시오."
 tv_engineering_department.7019.b:0 "마을에는 현장에서 더 빠른 배송이 필요한 것보다 일반적인 거래가 더 필요합니다."
 tv_engineering_department.7020.t:0 "건설: 수도의 다리는 석공을 기다립니다"
 tv_engineering_department.7020.d:0 "수도의 자체 교량 수리는 석공들이 경이로운 곳으로 끌려갔기 때문에 중단되었습니다. 다리가 미완성 상태이므로 수도에서 이를 유지하려면 [development|E] 비용이 들지만 불가사의의 진행 상황과 [tv_wonder_domestic_support|E]는 계속 움직일 것입니다."
 tv_engineering_department.7020.a:0 "석공들이 궁금해하고 다리가 기다리게 하세요."
 tv_engineering_department.7020.b:0 "수도 자체의 다리는 불가사의의 일정을 기다릴 수 없습니다."
 tv_engineering_department.7021.t:0 "건설: 에이전트가 수도의 목재를 구매합니다."
 tv_engineering_department.7021.d:0 "불가사의의 대리인들은 일반 시장에서 비교할 수 없는 가격으로 주요 목재와 석재를 구매하고 있습니다. 구매를 계속하면 현장 주변의 거래가 줄어들면서 자본에서 [prosperity|E]가 소진되지만 작업 공급은 유지되고 [tv_wonder_domestic_support|E]도 함께 유지됩니다."
 tv_engineering_department.7021.a:0 "구매를 계속하고 사이트에 피드를 제공하십시오."
 tv_engineering_department.7021.b:0 "하나의 프로젝트 때문에 수도 자체 시장이 고갈되어서는 안 됩니다."
 tv_engineering_department.7022.t:0 "건설: 야간 근무를 두 배로 늘리는 제안"
 tv_engineering_department.7022.d:0 "감독자는 마지막 서리로 인해 손실된 일수를 보충하기 위해 야간 근무 시간을 두 배로 늘리기를 원합니다. 이를 주문하면 추가 시간이 소요되므로 현장에서 작업하는 [population|E]가 지치게 되지만, 작업을 추진하고 [tv_wonder_domestic_support|E]를 들어 올릴 수 있습니다."
 tv_engineering_department.7022.a:0 "교대근무를 두 배로 늘리고 업무를 추진하세요."
 tv_engineering_department.7022.b:0 "지친 노동자는 휴식을 취한 노동자보다 더 느리게 건설합니다."
 tv_engineering_department.7023.t:0 "건설: 재무부서의 더 넓은 기반"
 tv_engineering_department.7023.d:0 "수석 석공은 가을 비가 오기 전에 추가 코스가 들어가면 땅이 차지할 것이라고 주장하면서 재무 책상에 더 넓은 기반 계획을 세웁니다. 재무 담당자는 추가된 돌과 손에 대한 금을 지금 공개할 수 있으며, 그렇지 않으면 계획은 내년 조사를 기다립니다."
 tv_engineering_department.7023.a:0 "금을 풀어내고 비가 내리기 전에 석공들이 더 넓은 기반을 마련하게 하십시오."
 tv_engineering_department.7023.b:0 "동전을 뒤로 잡아두세요. 비는 내년 봄에도 계속될 것입니다."
 tv_engineering_department.7024.t:0 "건설: 측량 말뚝이 울타리에 멈췄습니다."
 tv_engineering_department.7024.d:0 "측량사의 말뚝이 이웃의 울타리 선에 닿지 않아 멈추게 되고, 이웃은 말뚝이 통과하는 것을 거부합니다. 오늘은 왕실 영장으로 경계를 정하겠지만, 분쟁이 있는 울타리에 왕관의 이름을 언급하는 것은 눈에 띄지 않을 것입니다."
 tv_engineering_department.7024.a:0 "영장을 보내고 더 넓은 경계 뒤에 왕관의 이름을 넣으십시오."
 tv_engineering_department.7024.b:0 "울타리를 세우십시오. 왕관의 이름은 헤지 분쟁에 사용되지 않습니다."
 tv_engineering_department.7025.t:0 "건설: 공통의 경계를 넘는 더 넓은 계획"
 tv_engineering_department.7025.d:0 "더 넓은 계획은 작은 마을의 방목지를 곧바로 통과합니다. 이제 경계석을 마을 전체로 옮기면 측량 문제는 해결되지만, 가구들은 누가 옮겼는지 잊지 않을 것이다."
 tv_engineering_department.7025.a:0 "돌을 이동하고 측량이 더 큰 공간에 정착되도록 합니다."
 tv_engineering_department.7025.b:0 "공통적인 것을 있는 그대로 두십시오. 분노한 마을은 더 넓은 기반을 가질 가치가 없습니다."
 tv_engineering_department.7026.t:0 "건축: 외국 석공의 인감 가격"
 tv_engineering_department.7026.d:0 "외국의 석공 석공이 더 넓은 디자인을 인증하겠다고 제안했지만, 이는 본국에 있는 자신의 길드 기록에 법원의 이름이 그의 후원자로 명시되어 있는 경우에만 가능합니다. 보증을 통해 여기에서 크기 문제가 해결될 것입니다. 요청은 공개되며 지출하지 않을 수 없습니다."
 tv_engineering_department.7026.a:0 "승인을 부여하고 더 넓은 발자국에 대한 주인의 말씀을 받아들이십시오."
 tv_engineering_department.7026.b:0 "법원의 이름을 보류합니다. 외국 길드의 장부는 그것을 쓸 곳이 아닙니다."
 tv_engineering_department.7027.t:0 "건설: 남작의 사냥을 가로지르는 기반 계획"
 tv_engineering_department.7027.d:0 "더 넓은 기반 계획은 지역 남작이 오랫동안 사냥을 위해 사용해 온 땅을 가로지릅니다. 측량사가 작업을 마치는 동안 그에게 입을 다물라고 요청하면 더 큰 규모의 소리가 들릴 것입니다. 그러나 여기에서 보낸 고귀한 인내심은 그가 기대하는 인내심입니다."
 tv_engineering_department.7027.a:0 "남작의 인내심을 구하고 측량사들이 그의 사냥터를 끝마칠 수 있도록 하십시오."
 tv_engineering_department.7027.b:0 "남작의 땅 주변을 돌아보세요. 그의 호의는 측량 라인에 지출할 가치가 없습니다."
 tv_engineering_department.7028.t:0 "건축: 계획은 성스러운 땅의 한 구석을 원한다"
 tv_engineering_department.7028.d:0 "더 넓은 계획에는 본당이 살아 있는 기억 이전부터 유지해온 봉헌된 땅의 한 구석이 필요합니다. 성직자들은 적절하게 요청하면 측량을 허용할 것이지만 성직자들에게 발판 줄을 위해 신성한 땅을 양보하도록 요청하는 것은 빌려준 호의가 아니라 돈을 쓴 호의입니다."
 tv_engineering_department.7028.a:0 "성직자들에게 모퉁이를 양보하고 더 넓은 조사를 확인하도록 요청하십시오."
 tv_engineering_department.7028.b:0 "설문조사를 이전 경계 내부에 유지합니다. 성별된 땅은 시험하는 곳이 아니다."
 tv_engineering_department.7029.t:0 "건설: 양모 상인의 길을 찾고 있습니다"
 tv_engineering_department.7029.d:0 "더 넓은 면적은 양모 상인들이 장날에 사용하는 길을 삼킬 것입니다. 길드 의원들은 요청하면 우회를 허락하겠지만, 건물 부지에 거리를 빌려주는 시민은 조사보다 더 오랫동안 불편함을 기억합니다."
 tv_engineering_department.7029.a:0 "시의원에게 우회로를 요청하고 차선 위의 더 넓은 발자국을 확인하십시오."
 tv_engineering_department.7029.b:0 "상인의 길을 그대로 두십시오. 시장의 영업권은 비계 라인에 소비되지 않습니다."
 tv_engineering_department.7030.t:0 "건설: 마을에 땅을 파라는 요청을 받다"
 tv_engineering_department.7030.d:0 "감독은 근처 마을이 자신의 밭을 가꾸는 대신 땅을 파기 위해 손을 내밀면 일주일 안에 더 넓은 기반이 건전하다는 것을 증명할 수 있다고 말했습니다. 마을은 원수에게 응답하겠지만, 파종기에 부과되는 부과금은 가을이 되어도 잊혀지지 않습니다."
 tv_engineering_department.7030.a:0 "이번 주가 끝나기 전에 마을 부담금을 요청하고 더 넓은 기반을 파십시오."
 tv_engineering_department.7030.b:0 "마을이 들판을 그대로 유지하도록 하십시오. 대신 감독은 고용인을 기다릴 수 있습니다."
 tv_engineering_department.7031.t:0 "건설: 일련의 작업장이 발자국에 서 있습니다."
 tv_engineering_department.7031.d:0 "더 넓은 공간을 확보하는 유일한 방법은 부지 가장자리에 이미 서 있는 일련의 작업장을 끌어내는 것입니다. 그들의 돌과 발판은 새로운 계획에 곧바로 들어갈 것이지만, 이미 건설된 부지를 허무는 것은 취소할 수 없는 일입니다."
 tv_engineering_department.7031.a:0 "줄을 아래로 당기고 돌을 더 넓은 공간으로 접습니다."
 tv_engineering_department.7031.b:0 "작업장을 그대로 두십시오. 사이트는 다른 방향으로 성장할 수 있습니다."
 tv_engineering_department.7032.t:0 "건설: 목재 상인에게 구매자 선택 요청"
 tv_engineering_department.7032.d:0 "현장의 목재 상인들은 왕의 계약을 위해 일상적인 거래를 제쳐두기만 한다면 오늘날 더 넓은 기반을 마련할 수 있는 재고와 마차를 보유하고 있습니다. 사이트의 시장은 작업에 응답하겠지만, 한 구매자를 향한 무역 경로는 저절로 회복되지 않습니다."
 tv_engineering_department.7032.a:0 "지역 무역을 작업에 구부리고 더 넓은 공간을 위해 채우기를 운반하십시오."
 tv_engineering_department.7032.b:0 "상인들은 일상적인 거래에 맡기십시오. 채우기는 다른 방법으로 제공될 수 있습니다."
 tv_engineering_department.7033.t:0 "건설: 수도의 도로 수리인을 다른 곳에서 찾고 있습니다"
 tv_engineering_department.7033.d:0 "이번 달에 확인 조사를 실시할 수 있는 유일한 직원은 수도 자체의 도로 수선공과 건물 관리인입니다. 수도 자체 수리를 통해 그것들을 떼어내면 더 넓은 공간 문제가 해결될 것이지만, 수도의 거리는 그들이 남긴 격차를 보여줄 것입니다."
 tv_engineering_department.7033.a:0 "수도의 직원을 재배치하고 더 넓은 공간을 확인하게 하세요."
 tv_engineering_department.7033.b:0 "수도의 수리는 그대로 두십시오. 설문조사는 다른 곳에서 유휴 인력을 기다릴 수 있습니다."
 tv_engineering_department.7034.t:0 "건설: 길드홀에서 이번 시즌의 물건을 제공합니다"
 tv_engineering_department.7034.d:0 "수도의 길드홀에서는 겨울 박람회가 장부를 마감하기 전에 동전을 추첨하는 조건으로 이번 시즌의 무역 거래에 대한 확인 조사를 맡겠다고 제안합니다. 수도의 시장은 더 넓은 범위의 소리를 증명할 것이지만, 한 가지 경이로움으로 바뀌는 시즌의 소요는 길드홀이 답변을 원하는 시즌입니다."
 tv_engineering_department.7034.a:0 "박람회가 끝나기 전에 수도의 무역 활동을 활용하고 더 넓은 입지를 확인하세요."
 tv_engineering_department.7034.b:0 "길드회관의 책은 그대로 두십시오. 대신 설문조사는 재무부를 기다릴 수 있습니다."
 tv_engineering_department.7035.t:0 "공사：승무원들에게 휴식일을 요청합니다"
 tv_engineering_department.7035.d:0 "감독은 이미 현장에 있는 직원들이 교대근무 대신 쉬는 날 동안 근무한다면 이번 달에 더 넓은 기반이 입증될 수 있다고 말했습니다. 조사를 통해 더 큰 설계가 확정될 것이지만, 일상적인 속도를 넘어서는 노동자들이 모두 오랫동안 노동자로 남아 있는 것은 아닙니다."
 tv_engineering_department.7035.a:0 "이번 달에는 직원들을 쉬는 날까지 이끌고 더 넓은 기반을 마련하세요."
 tv_engineering_department.7035.b:0 "선원들은 쉬는 날을 지키도록 하라. 설문조사 진행 속도가 느려질 수 있습니다."
 tv_engineering_department.7036.t:0 "건설：교대반 직원을 모집합니다"
 tv_engineering_department.7036.d:0 "현장 감독은 교대근무판을 다시 그려서 직원들이 실제로 읽을 수 있는 곳에 게시해 줄 적절한 작업 담당자를 원합니다. 재무부는 그 사람과 그의 잉크를 가격으로 제공할 수 있으며 [tv_wonder_organization_competence|E]는 새 보드를 따를 것입니다."
 tv_engineering_department.7036.a:0 "우리는 오늘 점원을 고용하고 새 게시판을 게시합니다."
 tv_engineering_department.7036.b:0 "오래된 보드는 이렇게 오래 지속되었습니다. 조금 더 오래 지속될 수 있습니다."
 tv_engineering_department.7037.t:0 "건설: 두 감독이 서로의 명령을 거부하다"
 tv_engineering_department.7037.d:0 "현장에 있던 두 명의 길드 직원이 서로의 감독의 명령을 받기를 거부했고, 논쟁으로 인해 이번 주에 두 번 아침 교대 근무가 지연되었습니다. 왕관의 [legitimacy|E]가 담긴 영장만이 그들 사이에 우선권을 정할 것이며, 논쟁이 끝나면 [tv_wonder_organization_competence|E]가 뒤따를 것입니다."
 tv_engineering_department.7037.a:0 "영장은 초안을 작성하고 봉인합니다. 승무원은 이에 응답하거나 아무에게도 대답하지 않습니다."
 tv_engineering_department.7037.b:0 "왕관의 말은 메이슨이 더 크게 저주하는 것을 결정하는 데 소비되지 않습니다."
 tv_engineering_department.7038.t:0 "건설: 올드 로타는 수확을 잊었다"
 tv_engineering_department.7038.d:0 "징집된 마을 노동은 수확을 고려하지 않은 오래된 일정에 따라 작성되었으며, 선원의 절반은 자신의 밭이 필요할 때 떠나갔습니다. 현지 반대를 무시하고 로타를 강제로 통과시키면 해당 국가의 [stability|E]가 감소하지만 승무원은 마침내 정해진 시간을 유지하고 [tv_wonder_organization_competence|E]가 뒤따를 것입니다."
 tv_engineering_department.7038.a:0 "우리는 로타를 밀어냅니다. 수확은 한 번만 경이로움을 기다릴 수 있습니다."
 tv_engineering_department.7038.b:0 "이제 문제를 강제하면 한 가지 부족만 더 심각한 것으로 교환됩니다."
 tv_engineering_department.7039.t:0 "건설: 프리메이슨은 새로운 감독자에게 응답하지 않을 것입니다"
 tv_engineering_department.7039.d:0 "수석 석공들은 교대 근무를 재편성하기 위해 파견된 젊은 감독자에게 대답하지 않을 것이며, 마당 전체가 들을 수 있는 가운데 그렇게 말합니다. 법원의 [prestige|E]가 뒷받침하는 이름만이 그들을 일치시킬 수 있을 만큼 충분한 영향력을 갖고 있으며 [tv_wonder_organization_competence|E]는 그들의 규정을 따를 것입니다."
 tv_engineering_department.7039.a:0 "우리는 감독자에게 법원의 이름을 빌려줍니다. 석공들은 다른 것이 없다면 그것에 대답합니다."
 tv_engineering_department.7039.b:0 "젊은 감독의 권위는 궁에서 빌려오는 것이 아니라 마당에서 얻어야 한다."
 tv_engineering_department.7040.t:0 "건축: 이웃 영주가 청지기를 바치다"
 tv_engineering_department.7040.d:0 "이웃 영주는 20년 동안 한 저택의 교대 근무를 맡아온 새로운 승무원 명단을 작성하기 위해 자신의 집안 관리인을 빌려주겠다고 제안합니다. 호의를 베풀려면 귀족들 사이에서 [estate_satisfaction|E]가 필요하지만 청지기 명단에서는 [tv_wonder_organization_competence|E]를 가져옵니다."
 tv_engineering_department.7040.a:0 "우리는 청지기를 받아들이고 그에게 마땅한 빚을 주님께 빚지고 있습니다."
 tv_engineering_department.7040.b:0 "그 특정 영주에 대한 빚은 깔끔한 명단보다 더 가치가 있습니다."
 tv_engineering_department.7041.t:0 "건설: 대성당 종소리에 대한 교대 뿔의 응답"
 tv_engineering_department.7041.d:0 "현장의 교대 경적은 항상 대성당의 종을 따라가며, 종은 불가사의에 맞춰 움직이지 않습니다. 교대 변경을 표시하기 위해 추가 시간을 울리도록 챕터에 요청하는 것은 성직자들 사이에서 [estate_satisfaction|E]의 비용이 들지만, 승무원들은 마침내 제 시간에 자신의 게시물을 넘겨 [tv_wonder_organization_competence|E]를 가져올 것입니다."
 tv_engineering_department.7041.a:0 "우리는 어떤 불평을 하든 비용이 들더라도 추가 벨을 달라고 장에 요청합니다."
 tv_engineering_department.7041.b:0 "종은 감독의 교대 근무 시간이 아니라 하나님의 시간을 표시합니다."
 tv_engineering_department.7042.t:0 "건설: 시장을 통한 자재 카트 대기열"
 tv_engineering_department.7042.d:0 "자재 수레는 이제 하루에 두 번 시장 광장을 통과하며 길드 노점상은 소음과 진흙으로 인해 최고의 시간을 잃습니다. 고정된 일정에 따라 카트 광장을 정리하는 데는 시민 사이에서 [estate_satisfaction|E]의 비용이 들지만, 카트는 마침내 승무원이 계획할 수 있는 일정에 따라 도착하여 [tv_wonder_organization_competence|E]를 가져옵니다."
 tv_engineering_department.7042.a:0 "우리는 일정을 수정하고 광장, 노점 또는 노점 없음을 정리합니다."
 tv_engineering_department.7042.b:0 "시장은 경이로움을 선사하기 전에 마을에 식량을 공급합니다."
 tv_engineering_department.7043.t:0 "건설: 마을에 두 번째 순환이 요청됩니다"
 tv_engineering_department.7043.d:0 "주변 마을에서는 현재 승무원이 기둥을 두 배로 늘려 쓰러지기 전에 두 번째 교대를 보내도록 요청받습니다. 파종과 수확 사이에 자신의 밭에서 그것들을 꺼내는 것은 농민들 사이에서 [estate_satisfaction|E]의 비용이 들지만, 전체 2차 순환은 사이트가 마침내 적절한 교대를 실행하게 하여 [tv_wonder_organization_competence|E]를 가져올 것입니다."
 tv_engineering_department.7043.a:0 "두 번째 회전을 호출하고 필드가 차례를 기다리도록 합니다."
 tv_engineering_department.7043.b:0 "가을의 빈 들판은 불규칙한 교대 일정보다 국가에 더 많은 비용을 초래합니다."
 tv_engineering_department.7044.t:0 "공사: 집결지가 너무 좁아 지나갈 수 없음"
 tv_engineering_department.7044.d:0 "집결장은 작업을 중단하지 않고 직원들이 서로 지나갈 수 없을 정도로 비좁고, 엉키는 데는 매일 아침 한 시간이 소요됩니다. 적절한 마당을 위해 인접한 블록을 치우면 현장의 [development|E]가 먹히지만 승무원은 마침내 충돌하지 않고 이동하여 [tv_wonder_organization_competence|E]를 가져옵니다."
 tv_engineering_department.7044.a:0 "우리는 블록을 허물고 승무원이 이동할 수 있는 공간을 제공합니다."
 tv_engineering_department.7044.b:0 "블록은 그대로 유지됩니다. 비좁은 마당은 철거된 마당보다 저렴합니다."
 tv_engineering_department.7045.t:0 "건설 : 지역 카터가 조용히 리디렉션됩니다."
 tv_engineering_department.7045.d:0 "현장 자체 심부름을 하던 현지 운송업자와 짐꾼들은 대신 경이로운 자재를 운반하는 일로 조용히 방향을 바꾸었고, 그 결과 작업장 주변의 일반적인 거래가 줄어들었습니다. 배열을 공식화하고 그 손을 불가사의의 일정에 묶는 데 현장에서 [prosperity|E] 비용이 들지만 [tv_wonder_organization_competence|E]는 더 이상 사라진 카트를 기다리지 않는 승무원을 따라갈 것입니다."
 tv_engineering_department.7045.a:0 "우리는 합의를 공식화합니다. 카터들은 이제 경이의 일정에 답합니다."
 tv_engineering_department.7045.b:0 "일반적인 거래는 사이트의 사람들에게 먹이를 줍니다. 경이로움은 카트의 차례를 기다릴 수 있습니다."
 tv_engineering_department.7046.t:0 "건설: 수도는 감독을 빌려준다"
 tv_engineering_department.7046.d:0 "수도 자체의 건축 작업에서는 불가사의의 교대 근무자 명단을 다시 작성하는 데 도움을 주기 위해 감독관을 빌려 주었고, 대출로 인해 수도의 자체 프로젝트에는 인력이 부족해졌습니다. 영구적으로 대출을 하려면 수도에서 [development|E]가 필요하지만 원더 사이트에는 실제로 명단을 운영하는 방법을 아는 감독이 남아서 [tv_wonder_organization_competence|E]를 가져올 것입니다."
 tv_engineering_department.7046.a:0 "우리는 대출을 영구적으로 만듭니다. 수도의 프로젝트는 그 없이도 운영될 것입니다."
 tv_engineering_department.7046.b:0 "수도 자체의 작업에는 경이로움이 다른 감독을 필요로 하는 것보다 더 많은 감독이 필요합니다."
 tv_engineering_department.7047.t:0 "건설：항구의 질서가 개편된다"
 tv_engineering_department.7047.d:0 "수도의 상인들은 경이로운 재료가 항구를 먼저 통과하도록 배송 날짜를 조용히 재조정했으며, 이제 수도의 일반 무역은 경이로운 수레 뒤에서 기다립니다. 항구의 새로운 주문을 확인하는 데는 수도에서 [prosperity|E] 비용이 들지만, 현장은 마침내 승무원이 교대 근무를 할 수 있는 일정에 따라 자재를 받게 되어 [tv_wonder_organization_competence|E]를 가져옵니다."
 tv_engineering_department.7047.a:0 "우리는 항구에서 새로운 주문을 확인합니다. 판매자는 시간에 맞춰 조정할 것입니다."
 tv_engineering_department.7047.b:0 "수도 자체의 거래가 다른 도시의 건설 현장 뒤에서 기다려서는 안 됩니다."
 tv_engineering_department.7048.t:0 "건설: 재교육을 통해 승무원이 두 배로 증가하도록 요청"
 tv_engineering_department.7048.d:0 "이 사이트에는 새 인력 재교육에 필요한 인력 2명이 부족하므로 이미 근무 중인 인력은 새 일정이 확정될 때까지 직책을 두 배로 늘려야 합니다. 몇 주 동안 현장에서 열심히 일하는 [population|E]를 운전하면 막대한 비용이 들지만 재교육은 마침내 계속되어 [tv_wonder_organization_competence|E]를 가져오게 됩니다."
 tv_engineering_department.7048.a:0 "지금은 게시물을 두 배로 늘렸습니다. 새로운 명단은 그만한 가치가 있습니다."
 tv_engineering_department.7048.b:0 "지친 승무원은 아무것도 배우지 못합니다. 재교육은 휴식을 취할 때까지 기다릴 수 있습니다."
 tv_engineering_department.7049.t:0 "건설: 단일 포드가 모든 카트를 백업합니다."
 tv_engineering_department.7049.d:0 "하나의 좁은 포드가 현장으로 향하는 모든 카트를 백업하고 있습니다. 병참 장교는 지금 [gold|E]를 원합니다. 판자 작업과 유급 교량 작업자를 위해 대기열이 도로 자체보다 길어지기 전에 [tv_wonder_logistics_competence|E]가 다시 이동할 수 있도록 하기 위한 것입니다."
 tv_engineering_department.7049.a:0 "교량 작성자에게 비용을 지불하고 여울목을 정리하세요."
 tv_engineering_department.7049.b:0 "재무부는 웅덩이를 건너는 것보다 그 동전을 더 잘 활용합니다."
 tv_engineering_department.7050.t:0 "건설: 토지 소유자는 호송 통행을 거부합니다."
 tv_engineering_department.7050.d:0 "새로운 길을 따라 있는 토지 소유자들은 왕실 영장 없이는 수레가 들판을 횡단하는 것을 거부합니다. 여기에 왕관의 [legitimacy|E]를 사용하면 문이 열리고 [tv_wonder_logistics_competence|E]가 전진할 수 있지만, 이 길에서만, 그리고 오늘만 가능합니다."
 tv_engineering_department.7050.a:0 "영장을 발행하고 카트에 대한 필드를 엽니다."
 tv_engineering_department.7050.b:0 "왕관의 말은 모든 완고한 토지 소유자에게 소비되지 않습니다."
 tv_engineering_department.7051.t:0 "건설: 마을 녹지를 통과하는 카트 트랙"
 tv_engineering_department.7051.d:0 "오래된 수레 선로는 마을 녹지를 직선으로 달리고 있으며, 도로 주인은 세 채의 집과 우물을 옮겨서 선로를 넓히기를 원합니다. 주문을 하면 [tv_wonder_logistics_competence|E]가 향상되지만, 불만이 있는 사람들은 왕관의 [stability|E]를 잃게 됩니다."
 tv_engineering_department.7051.a:0 "명령을 내리면 집도 저주받을 것입니다."
 tv_engineering_department.7051.b:0 "마을을 녹색으로 유지하세요. 도로가 그 주위로 구부러질 수 있습니다."
 tv_engineering_department.7052.t:0 "건설: 유일한 예비 말은 다른 길드에 속합니다"
 tv_engineering_department.7052.d:0 "다음 지방의 마차 길드는 고용할 수 있는 유일한 예비 말을 소유하고 있습니다. 그 주인은 그것들을 빌려주고 [tv_wonder_logistics_competence|E]가 따라잡도록 할 것입니다. 이는 무제한이 아닌 법원의 [prestige|E]로부터 지출된 호의로서만 가능합니다."
 tv_engineering_department.7052.a:0 "부탁을 드리고 그 말들을 길에 내놓으십시오."
 tv_engineering_department.7052.b:0 "요청할 가치가 있는 부채에 대해 법원의 좋은 이름을 저장하십시오."
 tv_engineering_department.7053.t:0 "건설: 석재를 위해 귀족의 마차 팀을 수배합니다"
 tv_engineering_department.7053.d:0 "로드 마스터는 마차가 부족하여 손님 대신 지역 귀족의 마차 팀이 돌을 운반하기를 원합니다. [tv_wonder_logistics_competence|E]는 입지를 확보하겠지만 귀족들 사이에서는 [estate_satisfaction|E]의 비용이 들고 불편함을 토로할 것입니다."
 tv_engineering_department.7053.a:0 "마차를 요청하여 돌을 운반하는 데 놓으십시오."
 tv_engineering_department.7053.b:0 "귀족들에게 마차를 남겨주세요. 다른 곳에서 마차를 찾아보세요."
 tv_engineering_department.7054.t:0 "건축：수도원의 창고를 모집합니다"
 tv_engineering_department.7054.d:0 "가장 가까운 수도원에는 길을 따라 유일하게 건조한 창고가 있으며 도로 주인은 곡물과 도구를 위해 창고를 비우기를 원합니다. 그것을 지우는 것은 [tv_wonder_logistics_competence|E]에 도움이 될 것이지만, 누구의 마차가 그것을 채웠는지 잊지 않을 성직자들 사이에서는 [estate_satisfaction|E]가 비용이 들 것입니다."
 tv_engineering_department.7054.a:0 "창고를 비우고 물품을 쌓아두세요."
 tv_engineering_department.7054.b:0 "수도원의 상점을 그대로 두십시오."
 tv_engineering_department.7055.t:0 "건설: 호송대에는 시장 광장이 필요합니다"
 tv_engineering_department.7055.d:0 "호송대는 마차를 돌리기 위해 마을의 시장 광장이 필요하지만 그 광장은 또한 시장의 날이기도 합니다. 노점을 닫으면 정오까지 카트가 통과하여 [tv_wonder_logistics_competence|E]를 도울 수 있으며, 노점을 닫은 시민 사이에서 [estate_satisfaction|E]를 희생해야 합니다."
 tv_engineering_department.7055.a:0 "시장을 닫고 마차가 지나가도록 하세요."
 tv_engineering_department.7055.b:0 "시장은 계속 열려 있습니다. 마차는 하루 정도 기다릴 수 있습니다."
 tv_engineering_department.7056.t:0 "건설: 진흙이 길을 삼키다"
 tv_engineering_department.7056.d:0 "길의 일부가 진흙으로 변했고, 어떤 황소 팀도 혼자서는 그 길을 통과할 수 없습니다. 마을 소유의 소를 로프에 다시 올려놓으면 소를 정리하고 [tv_wonder_logistics_competence|E]에 도움이 될 것이지만, 봄철 파종을 위해 소가 필요한 농민들에게는 [estate_satisfaction|E]가 비용이 들 것입니다."
 tv_engineering_department.7056.a:0 "마을 소유의 소와 등을 밧줄에 올려 놓습니다."
 tv_engineering_department.7056.b:0 "농민들이 봄 파종을 위해 소를 키우도록 하십시오."
 tv_engineering_department.7057.t:0 "건설: 집결장에는 마차를 수용할 수 없습니다."
 tv_engineering_department.7057.d:0 "현장의 집결지는 현재 매일 도착하는 마차에 비해 너무 비좁습니다. 가장자리에 반쯤 지어진 창고를 정리하면 [tv_wonder_logistics_competence|E]가 작동할 수 있는 공간이 열리게 되고, 해당 창고에 이미 가라앉은 현장의 [development|E]를 희생해야 합니다."
 tv_engineering_department.7057.a:0 "창고를 정리하고 마당을 넓혀보세요."
 tv_engineering_department.7057.b:0 "창고를 지키라. 마차는 밖에 줄을 설 수 있습니다."
 tv_engineering_department.7058.t:0 "건설: 여관주인은 호송대를 먼저 섬기라는 지시를 받습니다"
 tv_engineering_department.7058.d:0 "현장 근처의 여관주인과 짐꾼들은 먼저 불가사의의 호송대를 위해 여분의 재고를 확보하고 남은 것만 다른 사람들에게 팔라는 지시를 받았습니다. [tv_wonder_logistics_competence|E] 공급을 유지하지만 현지 거래가 줄어들면서 현장에서 [prosperity|E]를 희생해야 합니다."
 tv_engineering_department.7058.a:0 "호송대를 위한 재고를 먼저 확보하세요."
 tv_engineering_department.7058.b:0 "언제나 그랬듯이 마을이 거래되도록 하세요."
 tv_engineering_department.7059.t:0 "건설: 수도의 포장 작업 인력을 도로에서 수배합니다"
 tv_engineering_department.7059.d:0 "수도의 포장 인력은 시장 거리를 중계하는 도중에 도로 주인이 현장으로 가는 길의 바퀴자국을 확고히 해달라고 요청할 때 도로를 중계합니다. 이들을 재할당하면 거리가 반 자갈로 되어 있는 수도의 [tv_wonder_logistics_competence|E]를 희생하면서 [development|E]를 앞으로 밀어낼 것입니다."
 tv_engineering_department.7059.a:0 "승무원을 거리에서 끌어내어 경로로 보내세요."
 tv_engineering_department.7059.b:0 "시장 거리를 먼저 마무리하세요. 경로는 기다릴 수 있습니다."
 tv_engineering_department.7060.t:0 "건설: 수도의 곡물창고를 경로로 찾고 있습니다"
 tv_engineering_department.7060.d:0 "수도의 관문에 가장 가까운 곡물 창고는 경로에 필요한 마차를 비축하는 가장 빠른 방법이며, 도로 관리인은 이를 열기를 원합니다. 예비금을 매각하면 [tv_wonder_logistics_competence|E]가 한 시즌 동안 자체 시장이 얇아지면서 수도의 [prosperity|E]를 희생하는 데 도움이 될 것입니다."
 tv_engineering_department.7060.a:0 "곡물창고를 열고 마차를 비축하세요."
 tv_engineering_department.7060.b:0 "비수기에 대비하여 곡물창고를 폐쇄해 두십시오."
 tv_engineering_department.7061.t:0 "건설: 노동자들에게 잔고를 내려달라고 요청하다"
 tv_engineering_department.7061.d:0 "현장의 작업자들은 백업된 마차를 자유롭게 내릴 수 있는 유일한 인력이며, 감독은 그들이 정규 작업을 마치고 로프에서 추가 교대 근무를 하기를 원합니다. [tv_wonder_logistics_competence|E]를 따라 이동하지만 추가 시간으로 인해 지친 현장에서 작업하는 [population|E]를 끌어옵니다."
 tv_engineering_department.7061.a:0 "근로자를 추가 교대로 투입하고 적체 작업을 정리하세요."
 tv_engineering_department.7061.b:0 "일꾼들이 정규 업무를 계속하도록 하십시오."
 tv_engineering_department.7062.t:0 "건설: 동전이 부족하여 크레인이 가만히 서 있다"
 tv_engineering_department.7062.d:0 "리프팅 크레인은 유급 직원이 부족하여 3일마다 유휴 상태로 서 있지만, 재무 담당자는 금고에 동전이 계산되지 않은 상태로 보관되어 있다고 맹세합니다. 지금 그것을 놓으면 서리가 내리기 전에 밧줄을 다시 손에 넣을 수 있을 것입니다."
 tv_engineering_department.7062.a:0 "금고를 열고 [gold|E]를 이중 교대로 사용하여 [tv_wonder_construction|E] 진행 상황을 구매하세요."
 tv_engineering_department.7062.b:0 "금고를 봉인된 상태로 두십시오. 승무원은 정규 급여일에 기다립니다."
 tv_engineering_department.7063.t:0 "건설: 메이슨은 왕관의 인장을 요구합니다"
 tv_engineering_department.7063.d:0 "석공들은 주지사의 인장이 아닌 왕관의 인장이 찍힌 영장 없이는 논쟁의 여지가 있는 경계석을 건너는 것을 거부합니다. 명령에 주권자의 이름을 올리면 오늘 문제가 해결될 것입니다. 하지만 채석공에게 사용된 모든 영장은 법원과 의회에 제출할 영장이 하나 적습니다."
 tv_engineering_department.7063.a:0 "주권자의 이름으로 영장을 봉인하고 [legitimacy|E]를 사용하여 경계석을 넘어 [tv_wonder_construction|E] 진행 상황을 구매합니다."
 tv_engineering_department.7063.b:0 "왕의 인장을 보류하고 총독이 직접 경계선을 주장하게 하십시오."
 tv_engineering_department.7064.t:0 "건설: 두 개의 작은 마을이 운반로를 막고 있습니다."
 tv_engineering_department.7064.d:0 "두 개의 작은 마을이 계획된 운송 도로에 걸쳐 자리 잡고 있으며, 그 수장들은 두 번이나 분명히 거절했습니다. 그들을 옆으로 치우면 이번 주 안에 길을 비울 수 있을 것입니다. 지난 흉년 이후 왕관이 그들과 함께 유지해 온 침묵의 대가를 치르게 될 것입니다."
 tv_engineering_department.7064.a:0 "[stability|E]를 사용하여 운재로를 따라 [tv_wonder_construction|E] 진행 상황을 해결하고 마을에 양보하라고 명령합니다."
 tv_engineering_department.7064.b:0 "작은 마을 주변의 운송 도로 경로를 변경하고 우두머리를 그대로 두십시오."
 tv_engineering_department.7065.t:0 "건설: 길드 마스터가 대기열을 뛰어넘기 위해 가격을 지정합니다."
 tv_engineering_department.7065.d:0 "석공 길드 마스터는 법원이 마지막 국빈 방문 이후 빚진 혜택을 요청하는 경우에만 불가사의의 석공을 위해 줄을 뛰어 넘을 것입니다. 지금 요청하면 해당 주문이 장부 앞으로 이동하게 되지만 큰 소리로 말한 호의는 지출된 호의입니다."
 tv_engineering_department.7065.a:0 "부탁을 요청하고 [prestige|E]를 사용하여 주문을 진행하고 [tv_wonder_construction|E] 진행 상황을 구매하세요."
 tv_engineering_department.7065.b:0 "순서대로 진행하고 나중을 위해 은혜를 아껴두십시오."
 tv_engineering_department.7066.t:0 "건축: 영주가 가족에게 세금을 부과하다"
 tv_engineering_department.7066.d:0 "지역 영주는 그의 부하들이 마지막 소집 후 시즌 휴가를 약속받았다는 것을 아무도 언급하지 않는 한 다음 달 동안 돌을 운반하기 위해 자신의 가족 부담금을 제안합니다. 그의 청지기는 이미 명단 초안을 작성하고 있습니다."
 tv_engineering_department.7066.a:0 "영주의 부과금을 받고 귀족의 [estate_satisfaction|E]를 사용하여 [tv_wonder_construction|E] 진행 상황을 구매하세요."
 tv_engineering_department.7066.b:0 "부과금을 거부하고 주의 부하들이 약속한 시즌을 지키도록 하십시오."
 tv_engineering_department.7067.t:0 "건축: 수도원의 구빈원 기금으로 목재를 충당할 수 있음"
 tv_engineering_department.7067.d:0 "수도원의 구호원 기금은 이번 분기에 두둑해졌고, 이전에는 왕관이 단지 힌트를 주는 대신 솔직하게 요구한다면 비계 목재를 덮을 수 있다고 암시했습니다. 솔직하게 묻는 것은 장에서 기억할 부분이다."
 tv_engineering_department.7067.a:0 "사전에 직접 물어보고 성직자 [estate_satisfaction|E]를 비계 목재에 사용하여 [tv_wonder_construction|E] 진행 상황을 구매하세요."
 tv_engineering_department.7067.b:0 "구호원 자금을 혼자 두고 다른 곳에서 목재를 찾으십시오."
 tv_engineering_department.7068.t:0 "건설:장날과 뒤엉키는 마차열차"
 tv_engineering_department.7068.d:0 "경이로운 장소로 향하는 마차 열차는 같은 세 모퉁이에서 장날 교통과 계속 얽혀 있습니다. 배송일에 거래를 위해 해당 거리를 폐쇄하면 경로가 즉시 풀릴 수 있지만 노점상은 해당 시간의 관습을 완전히 잃게 됩니다."
 tv_engineering_department.7068.a:0 "배송일에는 거리를 폐쇄하고 버거의 [estate_satisfaction|E]를 사용하여 [tv_wonder_construction|E] 진행 상황을 구매하세요."
 tv_engineering_department.7068.b:0 "시장 거리를 열어두고 마차가 차례를 기다리게 하세요."
 tv_engineering_department.7069.t:0 "공사：도랑작업원들에게 토공작업을 요청하다"
 tv_engineering_department.7069.d:0 "집행관은 주변 마을이 토공사를 위해 일손을 아끼지 않을 수 있지만, 자신의 밭이 범람하는 것을 막기 위해 이미 가을 도랑에 빚진 것과 같은 일손만이 가능하다고 말했습니다. 이제 초안을 작성한다는 것은 도랑이 기다림을 의미합니다."
 tv_engineering_department.7069.a:0 "[estate_satisfaction|E] 진행 상황에 농민의 [tv_wonder_construction|E]를 사용하여 토공사를 위한 마을 손을 초안합니다."
 tv_engineering_department.7069.b:0 "마을을 도랑에 맡기고 다른 곳에서 노동력을 찾으십시오."
 tv_engineering_department.7070.t:0 "건축: 비계가 올라가야 할 곳에 묵은 곡물 저장고가 서 있다"
 tv_engineering_department.7070.d:0 "서쪽 비계가 가야 할 자리에 서 있는 오래된 곡식 창고는 그대로 두기에 충분하지만, 그 돌과 발자국은 석공의 부족함과 측량사의 불만을 한꺼번에 해결해 줄 것이다. 아래로 당기는 것이 가장 빠른 방법입니다."
 tv_engineering_department.7070.a:0 "곡물 상점을 내려 현장에서 [development|E]를 사용하여 [tv_wonder_construction|E] 진행 상황을 구매하세요."
 tv_engineering_department.7070.b:0 "곡물 창고를 그대로 두고 다른 곳에서 비계실을 찾으세요."
 tv_engineering_department.7071.t:0 "건설: 선술집 주인이 조용히 경이로움을 향해 돌아섰습니다."
 tv_engineering_department.7071.d:0 "현장의 선술집 주인과 짐꾼들은 조용히 그들의 관습을 경이로운 배달 쪽으로 돌리기 시작했습니다. 왜냐하면 선원들은 준비된 동전으로 돈을 지불하고 일반 거래에서는 지불하지 않기 때문입니다. 그러한 합의를 공식화하면 그 보관인들이 자신의 관습을 기반으로 한 거래 비용으로 배송 속도가 빨라질 것입니다."
 tv_engineering_department.7071.a:0 "[prosperity|E] 진행 상황을 구매하기 위해 사이트에서 [tv_wonder_construction|E]를 사용하여 전환을 공식화합니다."
 tv_engineering_department.7071.b:0 "지역 무역이 정상적으로 진행되도록 하고 배송은 그대로 두십시오."
 tv_engineering_department.7072.t:0 "건설: 하나의 다리 또는 하나의 불가사의"
 tv_engineering_department.7072.d:0 "수도 자체의 교량 수리는 석공 부족으로 중단되었으며, 그 위에 있는 모든 석공은 놀랍게도 절단을 하지 않는 석공입니다. 승무원을 재배치하면 경이로움이 즉시 앞으로 나아갈 것이며 다리는 단순히 차례를 기다릴 것입니다."
 tv_engineering_department.7072.a:0 "[development|E] 진행에 대한 수도의 [tv_wonder_construction|E]를 사용하여 교량 승무원을 불가사의로 재배치합니다."
 tv_engineering_department.7072.b:0 "함교 승무원을 그대로 두고 함교가 먼저 완료되도록 하십시오."
 tv_engineering_department.7073.t:0 "건설: 곡물 요소는 가격으로 잉여를 제공합니다."
 tv_engineering_department.7073.d:0 "수도의 곡물 요소는 왕관이 왕의 호의의 증거로 중앙 광장에 판매를 게시하도록 허용한다면 잉여분을 경이로운 상점에 공정한 가격으로 직접 판매하겠다고 제안했습니다. 그것은 경기가 어려운 한 달 동안 직원들을 먹일 것이고 시장을 한 구매자에게로 눈에 띄게 구부릴 것입니다."
 tv_engineering_department.7073.a:0 "요인이 판매를 게시하고 [prosperity|E] 진행 상황을 구매하기 위해 자본에 [tv_wonder_construction|E]를 지출하도록 합니다."
 tv_engineering_department.7073.b:0 "공개 판매를 거부하고 일반적인 경로를 통해 선원들의 곡물을 구입하십시오."
 tv_engineering_department.7074.t:0 "건축: 감독자가 밤새도록 일하자고 제안하다"
 tv_engineering_department.7074.d:0 "감독자는 횃불과 유언장이 이미 거기에 있기 때문에 채용 담당자로부터 새로운 손을 기다리는 대신 야간 근무를 통해 현장의 자체 승무원을 운영할 것을 제안합니다. 새벽이 되면 밀린 일을 정리할 수 있었지만, 같은 사람들이 새벽에 쉬지 않고 다시 돌아오곤 했습니다."
 tv_engineering_department.7074.a:0 "[population|E] 진행 상황을 구매하기 위해 현장에서 노동 [tv_wonder_construction|E]를 지출하여 야간 근무를 주문하십시오."
 tv_engineering_department.7074.b:0 "승무원을 침대로 보내고 채용 담당자로부터 새로운 손을 기다리십시오."
 tv_engineering_department.7075.t:0 "건축：비계 웨이버스의 의견"
 tv_engineering_department.7075.d:0 "현장에서의 공개 시위는 충성스러운 관중이 되거나 불쾌한 비평가가 될 수 있는 군중을 끌어들입니다. 비계는 [tv_wonder_domestic_support|E]가 도움을 받았는지 피해를 입었는지에 대한 소문이 나올 때까지 기다립니다."
 tv_engineering_department.7075.a:0 "데모 자체를 말해보자."
 tv_engineering_department.7076.t:0 "건설: 계획이 페이지를 초과합니다."
 tv_engineering_department.7076.d:0 "과감한 조정으로 계획이 기존 한계를 넘어섰습니다. 기념비를 웅장하게 만든 결정이 될 수도 있고, 미래의 서기가 빨간색으로 밑줄을 긋는 메모가 될 수도 있습니다."
 tv_engineering_department.7076.a:0 "디자인을 이전 한계를 넘어섰습니다."
 tv_engineering_department.7077.t:0 "공사：차양 아래 주문 변경"
 tv_engineering_department.7077.d:0 "차양 아래에 새로운 명령 체계가 부과됩니다. 그것은 마당을 규율할 수도 있고 단순히 모든 감독에게 새로운 논쟁 방법을 가르칠 수도 있습니다."
 tv_engineering_department.7077.a:0 "우리는 마당을 통해 새로운 명령 체계를 추진합니다."
 tv_engineering_department.7078.t:0 "건설: 진흙을 통과하는 경로"
 tv_engineering_department.7078.d:0 "위험한 경로는 공급 라인을 단축할 것을 약속합니다. 날씨가 좋으면 선견지명으로 칭찬받을 것입니다. 실패하면 모두가 누가 차례를 명령했는지 기억할 것입니다."
 tv_engineering_department.7078.a:0 "더 짧은 길을 택하세요!"
 tv_engineering_department.7079.t:0 "건설: 공중에 떠 있는 새로운 방법"
 tv_engineering_department.7079.d:0 "활성 부분에서는 더 빠른 방법이 시도됩니다. 한 달을 절약할 수도 있고 다음 승무원이 아름다운 실수를 고치도록 강요할 수도 있습니다."
 tv_engineering_department.7079.a:0 "활성 섹션에서 더 빠른 방법을 시도합니다."
 tv_engineering_department.7080.t:0 "건설: 약속을 어긴 노동자들이 도구를 사용하지 않음"
 tv_engineering_department.7080.d:0 "오늘 아침 노동자들은 연장을 내려놓고 왕관의 은이 마르는 게 신기하다고 중얼거렸습니다. 감독은 보너스 임금을 약속하며 그들을 진정시켰습니다. 이제 재무부가 군중 앞에서 그 약속을 지키거나 깨뜨려야 할 것입니다."
 tv_engineering_department.7080.a:0 "약속된 보너스를 어기고 노동자들의 불평이 현장에 퍼지게 하라."
 tv_engineering_department.7080.b:0 "약속된 보너스를 존중하고 그것이 재무부에서 나오도록 하십시오."
 tv_engineering_department.7081.t:0 "건설: 영장의 인장에 의문을 제기하는 팜플렛"
 tv_engineering_department.7081.d:0 "여행하는 서기는 광장에서 그 경이로움을 승인하는 왕관의 영장이 결코 합법적으로 봉인되지 않았다고 주장하는 팜플렛을 큰 소리로 읽었습니다. 프로젝트에 대한 의심이 해결되지 않거나 영장 자체가 조용히 수정되더라도 뭔가를 제공해야 합니다."
 tv_engineering_department.7081.a:0 "팜플렛에 답을 남기지 말고 그 경이로움에 대한 의심이 계속 퍼지도록 하십시오."
 tv_engineering_department.7081.b:0 "도전에 답하기 위해 영장의 문구를 조용히 수정하고, 왕관의 명령에 대한 흠집을 받아들입니다."
 tv_engineering_department.7082.t:0 "건설: 부과금으로 인해 이틀 후에 난투가 발생함"
 tv_engineering_department.7082.d:0 "이 경이로움을 위해 돌을 운반하는 사람들을 징집하여 현장에서 이틀 동안 차를 타고 징집병 장교와 마을 사람들 사이에 난투를 촉발시켰다는 소식이 전해졌습니다. 조용히 하려면 해당 지역이나 현장 게이트에서 비용이 많이 듭니다."
 tv_engineering_department.7082.a:0 "현장 관문이 불평을 흡수하고 지역의 불안이 불타오르도록 내버려 두십시오."
 tv_engineering_department.7082.b:0 "불안이 더 확산되기 전에 군대를 보내 지역을 조용히 정착시키십시오."
 tv_engineering_department.7083.t:0 "건설: 사신의 지베가 항구에서 궁전으로 여행하다"
 tv_engineering_department.7083.d:0 "그 경이로움이 쟁기질하는 것보다 느리게 기어간다는 연회를 외국 사절이 비웃었고, 이제는 항구에서 궁궐까지 모든 선술집에서 그 비웃음이 반복되고 있다. 누군가는 그것을 삼켜야 합니다. 왕관이 해외에 있다는 것이나 건설되고 있는 것에 대한 마을 사람들의 자부심 중 하나입니다."
 tv_engineering_department.7083.a:0 "사절의 비웃음을 무시하고 그 경이로움에 대한 마을 사람들의 자부심이 찌르도록 하십시오."
 tv_engineering_department.7083.b:0 "호화로운 카운터 디스플레이로 사절에게 응답하고 왕관의 지위를 사용하여 그를 침묵시키십시오."
 tv_engineering_department.7084.t:0 "건설: 알드릭 경의 청지기가 문에서 연기를 뿜습니다."
 tv_engineering_department.7084.d:0 "새로운 채석장 도로는 지난주에 알드릭 경의 사냥터를 관통하여 뚫렸고, 그의 관리인은 그 이후로 현장 문에서 화를 내고 있습니다. 영주의 가족이 진정되거나, 대치 상황을 지켜보는 평민들이 스스로 결론을 내리거나 둘 중 하나입니다."
 tv_engineering_department.7084.a:0 "대치 상황이 해결되지 않은 채로 계속되고 프로젝트에 대한 군중의 의견이 신랄해지게 놔두십시오."
 tv_engineering_department.7084.b:0 "문제를 해결하기 위해 성주 집안에 공식적인 사과와 보상을 제공하십시오."
 tv_engineering_department.7085.t:0 "건설: 기초 참호가 오래된 무덤을 발견하다"
 tv_engineering_department.7085.d:0 "기초 도랑을 준비하던 발굴자들은 아무도 기록하지 않은 오래된 무덤 돌을 발견했고, 본당 신부는 죽은 사람들이 적절하게 다시 매장될 때까지 추가 작업을 축복하기를 거부하고 있습니다. 보상 의식이 전액 지불되거나 사제의 반대에 대한 발굴 작업이 계속됩니다."
 tv_engineering_department.7085.a:0 "사제를 제압하고 계속해서 땅을 파십시오. 대신에 혼란스러운 무덤에 대한 소식이 군중을 불안하게 만들도록 하십시오."
 tv_engineering_department.7085.b:0 "신부와 본당을 만족시키기 위해 완전한 보상 의식을 지불하십시오."
 tv_engineering_department.7086.t:0 "건축: 비계 기둥이 상인의 행을 막습니다."
 tv_engineering_department.7086.d:0 "번화가를 가로질러 설치된 비계 기둥은 6일 동안 상인들이 늘어선 수레의 통행을 막았고, 노점상들은 잃어버린 거래에 대해 누군가 대답해 줄 것을 요구하고 있습니다. 그들의 손실이 보상되거나, 거리가 폐쇄되고 군중이 그 소식을 듣게 됩니다."
 tv_engineering_department.7086.a:0 "상인들은 보상받지 못하고 폐쇄된 거리가 군중의 불평을 불러일으키도록 놔두십시오."
 tv_engineering_department.7086.b:0 "거래가 차단된 상인들의 행을 손으로 보상합니다."
 tv_engineering_department.7087.t:0 "건축: 익어가는 들판은 자르지 않은 채로 서 있다"
 tv_engineering_department.7087.d:0 "수확 부담금 관리인은 경이로움을 위한 목재를 운반하기 위해 익어가는 밭에서 마을 사람들의 손을 끌어냈고, 이제 곡물은 자르지 않은 채로 서 있고 노동자들은 현장에서 허리가 아프다. 마을 사람들이 수확을 위해 손을 돌려받거나, 군중이 경이로움으로 밭이 어떻게 비워졌는지 듣게 됩니다."
 tv_engineering_department.7087.a:0 "징수된 손을 현장에 유지하고 곡물이 서 있다는 소식이 군중에게 전달되도록 하십시오."
 tv_engineering_department.7087.b:0 "마을 손을 즉시 수확에 돌려보내십시오."
 tv_engineering_department.7088.t:0 "건설: 옛 무두질 공장이 반쯤 헐렸습니다"
 tv_engineering_department.7088.d:0 "석공의 계획은 경이로운 기초를 위한 공간을 마련하기 위해 오래된 제혁소 구역을 정리하고, 누구도 그것을 대체할 것이 무엇인지 묻기 전에 절반을 무너뜨릴 것을 요구합니다. 지구가 계획대로 파괴되거나 계획이 축소되고 사람들은 왜 그렇게 많은 공간이 필요한지 묻기 시작합니다."
 tv_engineering_department.7088.a:0 "여유 공간을 축소하고 사람들이 애초에 경이로움에 왜 그렇게 많은 기반이 필요한지 질문하게 하세요."
 tv_engineering_department.7088.b:0 "계획대로 제혁소 구역의 철거를 완료하고 나중에 대체할 것이 무엇인지 걱정하십시오."
 tv_engineering_department.7089.t:0 "건설：시장의 터전은 돌아오지 않았다"
 tv_engineering_department.7089.d:0 "원더의 집결지는 3개월 연속 주간 시장을 삼켰고, 이를 채우던 가판대는 더 이상 돌아오지 않았습니다. 시장이 잊혀지기 전에 반환되거나, 마당이 이를 유지하고 해당 지역의 거래가 계속 얇아집니다."
 tv_engineering_department.7089.a:0 "집결장을 그대로 유지하고 현장 자체 시장 거래가 냉각되도록 하십시오."
 tv_engineering_department.7089.b:0 "주간 노점상들이 돌아오는 길을 잊어버리기 전에 시장으로 돌아가세요."
 tv_engineering_department.7090.t:0 "건축: 구호소는 오래된 다리의 손길이 닿지 않은 채 자리잡고 있습니다."
 tv_engineering_department.7090.d:0 "시 측량관은 경이로운 석조물을 위해 수도의 모든 프리메이슨을 징발했고, 그 결과 오래된 다리 옆에 반쯤 지어진 구호소가 두 달 동안 손길이 닿지 않은 채 남아 있었습니다. 구호원은 그 놀라운 일이 끝날 때까지 기다리거나, 석공들이 수도로 철수되고 현장에서는 이유를 설명하는 속도가 느려집니다."
 tv_engineering_department.7090.a:0 "모든 석공이 궁금해하도록 하고 수도의 절반만 건설된 프로젝트를 기다리게 하십시오."
 tv_engineering_department.7090.b:0 "석공을 불러 구호원을 마무리하고 현장의 군중이 지연에 대해 궁금해하도록 하십시오."
 tv_engineering_department.7091.t:0 "건설: 돌마차가 수도의 가장 아름다운 거리를 질식시킵니다"
 tv_engineering_department.7091.d:0 "경이로움을 위해 장식된 돌로 만든 마차들이 수도의 가장 좋은 쇼핑 거리를 따라 일주일 동안 주차되어 있었고, 그곳의 상점 주인들은 도로가 막혀 관습이 건조해졌다고 말했습니다. 마차는 곧 다른 경로를 찾거나, 그대로 머물면서 수도의 무역이 계속 냉각됩니다."
 tv_engineering_department.7091.a:0 "마차를 그대로 두고 사이트 자체의 진행 상황에 책임을 지게 하십시오."
 tv_engineering_department.7091.b:0 "마차의 경로를 즉시 변경하여 수도의 쇼핑 거리를 다시 호흡하게 하세요."
 tv_engineering_department.7092.t:0 "건설: 비계 붕괴로 인해 12개가 파손되었습니다."
 tv_engineering_department.7092.d:0 "사흘 전 현장의 비계가 무너져 열 명의 인부들이 뼈가 부러졌고, 나머지 인부들은 이제 위험을 무릅쓰고 임금을 받을 가치가 없다고 투덜대고 있습니다. 감독자들이 속도를 강요하여 일꾼들이 밤에 도망치기 시작하거나, 속도가 느려지고 위험에 대한 소문이 마을 전체에 퍼집니다."
 tv_engineering_department.7092.a:0 "위험이 마을에서 흔한 이야기가 되도록 하고 모든 노동자를 현장에 머물게 하십시오."
 tv_engineering_department.7092.b:0 "상관없이 속도를 높이고 겁에 질린 직원들이 밤에 도망갈 것이라는 점을 인정하십시오."
 tv_engineering_department.7093.t:0 "구조: 금고는 원장 주장보다 가볍습니다"
 tv_engineering_department.7093.d:0 "사이트 지불 관리자는 금고를 열고 그것이 원장에서 주장하는 것보다 가볍다는 것을 알게 됩니다. 누군가 이미 계산되지 않은 코인을 소비했으며, 부족분은 [tv_wonder_scale_competence|E] 또는 [gold|E]에서 보상될 것입니다."
 tv_engineering_department.7093.a:0 "가슴이 감당할 수 있는 정도에 맞게 디자인을 축소하십시오."
 tv_engineering_department.7093.b:0 "재무부의 부족분을 충당하고 규모에 맞게 건물을 계속 건설하십시오."
 tv_engineering_department.7094.t:0 "건설: 어떤 헌장도 이를 허용하지 않는 라이벌의 속삭임"
 tv_engineering_department.7094.d:0 "경쟁 청구인은 어떤 헌장에서도 이 크기의 기념물을 허용하지 않는다고 속삭이기 시작했습니다. 점원은 문제가 조용히 해결될 수 있지만 [tv_wonder_scale_competence|E] 또는 [legitimacy|E]에 비용을 지불하지 않고는 해결될 수 없다고 말합니다."
 tv_engineering_department.7094.a:0 "헌장에서 가장 큰 청구를 조용히 철회하십시오."
 tv_engineering_department.7094.b:0 "왕관이 헌장 전체를 재확인하고 속삭임에 직접 응답하도록 하세요."
 tv_engineering_department.7095.t:0 "건설: 세 개의 교구가 기초 위에 길을 막고 있습니다."
 tv_engineering_department.7095.d:0 "세 개 교구의 남성들이 확장된 기초 위에 도구를 내려놓고 카트로 길을 막았습니다. 집행관은 이를 해산할 수 있지만 계획의 [tv_wonder_scale_competence|E] 또는 지구의 [stability|E] 등 어딘가에 근거를 제공해야만 가능합니다."
 tv_engineering_department.7095.a:0 "기초를 다시 원래 라인으로 좁히고 남자들을 만족스럽게 집으로 보냅니다."
 tv_engineering_department.7095.b:0 "무장한 병력을 보내 도로를 청소하고 더 넓은 기반을 확보하세요."
 tv_engineering_department.7096.t:0 "건설: 헤럴드가 무급 여행을 거부하다"
 tv_engineering_department.7096.d:0 "해외에 기념물을 선포하기로 되어 있던 전령관들은 두 달 동안 급여를 받지 못했으며 현재는 여행을 거부하고 있습니다. 디자인의 [tv_wonder_scale_competence|E]를 다듬거나 침묵을 사기 위해 크라운의 [prestige|E]를 소비하는 것을 의미하든 누군가는 즉시 만족해야 합니다."
 tv_engineering_department.7096.a:0 "더 작고 저렴한 기념물을 발표하고 대신 전령관들이 그 단어를 전달하도록 하십시오."
 tv_engineering_department.7096.b:0 "왕관의 이름과 명성을 전령들에게 지불하십시오."
 tv_engineering_department.7097.t:0 "건축: 남작의 청지기는 목재를 두 배로 계산합니다"
 tv_engineering_department.7097.d:0 "남작의 청지기는 영주의 숲에서 징발한 목재의 양을 세어 합의한 양의 두 배를 찾았습니다. 영주는 앞으로 더 작은 삭감, 즉 계획의 [tv_wonder_scale_competence|E]를 축소하거나 귀족들 사이에서 [estate_satisfaction|E]에 대한 공식적인 사과와 추가 양보를 받아들일 것입니다."
 tv_engineering_department.7097.a:0 "향후 목재 할당량을 줄이고 이에 맞춰 설계 규모를 축소합니다."
 tv_engineering_department.7097.b:0 "남작의 집에 공식적인 사과와 추가 보조금을 보내십시오."
 tv_engineering_department.7098.t:0 "건축: 더 넓은 본당이 오래된 묘지를 삼킬 것입니다"
 tv_engineering_department.7098.d:0 "한 주교는 더 넓어진 본당 디자인이 지부의 오래된 묘지를 삼킬 것이라는 사실을 알게 되었습니다. 그는 계획이 축소되거나 성직자들 사이에서 [estate_satisfaction|E]에 대한 지부의 불만이 완전히 답변되지 않는 한 작업을 다시 축복하지 않을 것입니다."
 tv_engineering_department.7098.a:0 "묘지를 확보하기 위해 본당을 다시 그립니다."
 tv_engineering_department.7098.b:0 "해당 지부에 불만 사항에 답변할 수 있는 새로운 권한을 부여하십시오."
 tv_engineering_department.7099.t:0 "건설: 창고를 통과하는 확장된 도로"
 tv_engineering_department.7099.d:0 "양모 상인들은 현장까지 확장된 도로가 창고 열을 직선으로 가로지르고 있으며 이제 상품이 교차로에서 썩어가고 있다고 보고합니다. 도로가 다시 좁아져 전체 접근 방식의 [tv_wonder_scale_competence|E]를 다듬거나 크라운이 버거 사이에서 [estate_satisfaction|E]를 완전히 보상합니다."
 tv_engineering_department.7099.a:0 "진입로를 좁히고 창고를 확보하세요."
 tv_engineering_department.7099.b:0 "상인들에게 손실을 지불하고 더 넓은 길을 유지하십시오."
 tv_engineering_department.7100.t:0 "건설: 이번 달에 한 마을에서 세 사람이 묻혔습니다."
 tv_engineering_department.7100.d:0 "채석장 근처 마을에서 이번 달에 세 명의 남자를 매장했으며, 어둠 속에서도 확대된 명령을 위해 일했다는 소식이 전해졌습니다. 원수는 왕관이 [estate_satisfaction|E]를 줄이는 대신 곡물과 은을 가진 농민들 사이에서 [tv_wonder_scale_competence|E]에 대해 대답하지 않는 한 코비를 줄여야 한다고 말합니다."
 tv_engineering_department.7100.a:0 "마을이 견딜 수 있는 수준으로 코르비 명령을 줄이십시오."
 tv_engineering_department.7100.b:0 "곡물과 은을 마을에 보내고 명령대로 코르비를 지키십시오."
 tv_engineering_department.7101.t:0 "건설:작업장을 위해 줄지어 늘어선 집들"
 tv_engineering_department.7101.d:0 "감독은 작업장을 넓히기 위해 현장에 줄지어 서 있는 집을 허물었고, 마을 사람들은 그 자리에 무엇을 지을 것인지 묻고 있습니다. 대답은 디자인을 축소하여 [tv_wonder_scale_competence|E]가 필요하지 않은 근거를 아끼지 않거나 더 많은 것을 정리하고 사이트의 [development|E]를 더 많이 잃는 것을 의미합니다."
 tv_engineering_department.7101.a:0 "더 이상의 개간 작업을 중단하고 이미 확보한 땅에 맞게 계획을 다시 그립니다."
 tv_engineering_department.7101.b:0 "계속해서 청소를 명령하고 현장이 손실을 흡수하도록 하십시오."
 tv_engineering_department.7102.t:0 "건설: 한때 현장을 울렸던 시장은 사라졌습니다"
 tv_engineering_department.7102.d:0 "한때 공사장을 울렸던 시장은 비계와 소음으로 쫓겨나고, 노점상들은 돌아오지 않았다. 감독자는 [tv_wonder_scale_competence|E] 일부를 포기하면서 작업을 더 가까이 끌어당길지, 아니면 시장이 추방된 상태에서 현장의 [prosperity|E]가 계속 흘러나오도록 할지 결정해야 합니다."
 tv_engineering_department.7102.a:0 "비계를 끌어당기고 시장이 돌아오도록 하십시오."
 tv_engineering_department.7102.b:0 "작업을 널리 퍼뜨리고 사이트의 거래를 시들게 하십시오."
 tv_engineering_department.7103.t:0 "건설: 교량 석공들이 경이로움을 발견했습니다."
 tv_engineering_department.7103.d:0 "이 경이로움을 위해 징집된 석공들은 수도의 자체 교량 수리 작업에서 곧바로 철수되었으며, 현재는 겨울이 되기 전에 작업이 반쯤 완료된 상태입니다. 누군가는 주어야 합니다. 불가사의의 [tv_wonder_scale_competence|E]가 축소되어 석공들이 집에 갈 수 있도록 하거나 수도의 [development|E]가 수리되지 않은 채 시즌을 기다리도록 남겨집니다."
 tv_engineering_department.7103.a:0 "석공들을 수도로 돌려보내고 경이로움을 축소하세요."
 tv_engineering_department.7103.b:0 "석공들이 놀라지 않게 하고 수도의 수리를 기다리게 하십시오."
 tv_engineering_department.7104.t:0 "건설: 수도의 길드홀은 조용해졌습니다"
 tv_engineering_department.7104.d:0 "수도의 길드홀은 조용해졌고, 장인과 마차꾼들은 돌과 손에 대한 경이로운 사람들의 식욕을 충족시키기 위해 끌려갔습니다. 의회는 [tv_wonder_scale_competence|E]를 제외하고 디자인이 최종적으로 크기에 맞게 절단될 것인지, 아니면 수도의 [prosperity|E]가 더 이상 자체 거리에 건설되지 않는 기념물에 계속 자금을 지원해야 하는지 여부를 명백히 묻습니다."
 tv_engineering_department.7104.a:0 "디자인을 축소하고 길드원을 수도로 돌려 보내십시오."
 tv_engineering_department.7104.b:0 "길드원을 현장에 머물게 하고 수도의 무역이 계속해서 그 대가를 지불하게 하십시오."
 tv_engineering_department.7105.t:0 "건설: 외과의사가 더 많이 떨어질 것이라고 경고함"
 tv_engineering_department.7105.d:0 "어젯밤 확장된 층의 비계가 무너졌고 외과 의사는 더 큰 계획에 대한 속도가 느려지지 않으면 더 많은 것이 무너질 것이라고 말했습니다. 감독자는 [tv_wonder_scale_competence|E]를 아끼면서 승무원이 생존할 수 있는 속도로 설계를 줄이거나 더 넓은 작업을 계속 추진하고 현장에서 작업하는 [population|E]가 계속 얇아질 것이라는 점을 받아들일 수 있습니다."
 tv_engineering_department.7105.a:0 "속도를 늦추고 승무원이 견딜 수 있는 수준으로 계획을 축소하십시오."
 tv_engineering_department.7105.b:0 "더 넓은 범위의 작업을 추진하고 근로자에게 부과되는 비용을 감수하십시오."
 tv_engineering_department.7106.t:0 "건설: 두 명의 직원이 동일한 부족분을 두 번 계산합니다."
 tv_engineering_department.7106.d:0 "지불 담당자의 금고가 어젯밤 계산에서 두 명의 다른 직원에 의해 두 번이나 부족했습니다. 누락된 동전이 재무부에 상각되거나 전체 교대 근무 명단이 찢어지고 모든 승무원이 무에서 재배치됩니다. [tv_wonder_organization_competence|E] 또는 [gold|E]는 사무원의 산술 비용을 지불합니다."
 tv_engineering_department.7106.a:0 "교대 근무 명단을 정리하고 모든 승무원을 처음부터 다시 배정하세요."
 tv_engineering_department.7106.b:0 "누락된 동전을 재무부에 기록하고 명단을 계산된 대로 두십시오."
 tv_engineering_department.7107.t:0 "건설: 위조된 보조금이 승무원들에게 큰 소리로 읽혀집니다."
 tv_engineering_department.7107.d:0 "어떤 감독도 알아보지 못하는 외치는 사람이 선원들이 모두 듣는 가운데 라이벌 영주에게 현장의 목재 권리를 위조하여 부여한 내용을 낭독합니다. 일꾼들이 모이기 전에 그 사람을 쫓아내고 그 주장을 반박하여 모든 감독관을 그 자리에서 끌어내립니다. 위조에 대한 답변을 하지 않고 방치하면 승무원들이 계속 일할 수 있지만, 그 주장은 이미 선술집에서 사실로 반복되고 있습니다. [tv_wonder_organization_competence|E] 또는 [legitimacy|E]는 위조자의 거짓말을 담고 있습니다."
 tv_engineering_department.7107.a:0 "모든 감독을 자신의 자리에서 끌어내서 울부짖는 사람을 추적하고 기록을 바로잡으세요."
 tv_engineering_department.7107.b:0 "위조된 주장에 대한 답변이 없이 그대로 두고 직원들이 계속해서 일하도록 하십시오."
 tv_engineering_department.7108.t:0 "건설: 거리로 쏟아지는 밀치는 성냥"
 tv_engineering_department.7108.d:0 "망가진 곡물이 담긴 반 봉지 이상의 성냥이 식당 라인에서 밀쳐지고 시계가 부서지기 전에 문 밖으로 거리로 쏟아졌습니다. 두 갱단이 다시는 만나지 않도록 승무원을 시차를 두고 재배치하고 먹이를 줄 수도 있고, 시계가 열린 광장에서 체포하여 문제를 완전히 해결할 수도 있습니다. [tv_wonder_organization_competence|E] 또는 [stability|E]는 버릇없는 곡물에 대한 답변입니다."
 tv_engineering_department.7108.a:0 "두 갱단이 다시는 길을 건너지 않도록 모든 교대 근무를 재편성하세요."
 tv_engineering_department.7108.b:0 "시계가 열린 광장에서 정지하도록 하십시오."
 tv_engineering_department.7109.t:0 "건설: 사절이 무인 게이트에 도착하다"
 tv_engineering_department.7109.d:0 "외국 사절이 하루 일찍 도착했는데 명예의 문은 무인이고 가슴에는 깃발이 여전히 접혀 있는 것을 발견했습니다. 임무 명단을 그 자리에서 찢어서 제대로 된 환영 인사를 할 수도 있고, 사절이 현장을 그대로 걸어가서 본 대로 집에 보고할 수도 있습니다. [tv_wonder_organization_competence|E] 또는 [prestige|E]는 조기 도착에 대한 비용을 지불합니다."
 tv_engineering_department.7109.a:0 "적절한 환영을 받기 위해 그 자리에서 임무 명단을 찢어보세요."
 tv_engineering_department.7109.b:0 "사절을 있는 그대로 현장을 안내해 보세요."
 tv_engineering_department.7110.t:0 "건축：미카엘마스 이후 빌린 황소의 기한이 지났습니다"
 tv_engineering_department.7110.d:0 "이웃 영주의 영지에서 빌린 황소 팀은 미카엘 성탄절에 돌아올 예정이었으며 마감일이 지나도 여전히 돌을 운반하고 있습니다. 팀은 일정에 따라 집으로 보내지고 운반 승무원은 손으로 짐을 끌도록 재구성되거나 영주의 청지기에게 기다리라고 지시하는 동안 소를 2주 더 보관할 수 있습니다. 귀족 중 [tv_wonder_organization_competence|E] 또는 [estate_satisfaction|E]가 기한이 지난 황소를 운반합니다."
 tv_engineering_department.7110.a:0 "일정에 따라 황소를 집으로 보내고 승무원을 재편성하여 손으로 운반하십시오."
 tv_engineering_department.7110.b:0 "소를 보름 더 두고 주인의 청지기에게 기다리라고 말하라."
 tv_engineering_department.7111.t:0 "건설: 망치들이 유물 행렬을 압도한다"
 tv_engineering_department.7111.d:0 "석공들은 이번 주에 유물 행렬을 계속 망치질했고, 세 거리 떨어진 현장에서는 구호 소리가 들리지 않았습니다. 교대 달력은 이제부터 모든 잔치와 행렬일에 다시 그려질 수 있으며, 행렬 경로는 간단히 이동될 수 있으며 성직자는 작업이 중단되지 않을 것이라고 말했습니다. 성직자 중 [tv_wonder_organization_competence|E] 또는 [estate_satisfaction|E]가 소음에 대한 답변입니다."
 tv_engineering_department.7111.a:0 "매 축제일과 행렬일에 교대 달력을 다시 그립니다."
 tv_engineering_department.7111.b:0 "행렬 경로를 이동하고 성직자들에게 작업이 중단되지 않을 것이라고 말하십시오."
 tv_engineering_department.7112.t:0 "건설: 현장 왜건이 곡물 시장의 길을 막습니다."
 tv_engineering_department.7112.d:0 "현장 마차들이 6일 동안 곡물 시장의 하역로를 막고 있었고, 상인 길드에서는 직접 항의하기 위해 점원을 보내는 것을 중단했습니다. 배송 일정을 분리하고 차선을 깨끗하게 유지하는 더 긴 경로를 중심으로 재구성하거나 길드가 자체 사업 경로를 변경하는 동안 마차를 그대로 둘 수 있습니다. 버거 중 [tv_wonder_organization_competence|E] 또는 [estate_satisfaction|E]는 차단된 차선에 대한 비용을 지불합니다."
 tv_engineering_department.7112.a:0 "배송 일정을 분할하고 더 긴 경로를 중심으로 재구성하세요."
 tv_engineering_department.7112.b:0 "마차를 그대로 두고 길드가 스스로 경로를 바꾸도록 하세요."
 tv_engineering_department.7113.t:0 "건축: 파종기, 손도 없이 온다"
 tv_engineering_department.7113.d:0 "나무를 심기 위해 마을로 돌아가야 하는 코르비 갱단은 여전히 돌을 자르고 있으며, 그들 없이는 올해의 밭이 파종되지 않는다는 소식이 전해졌습니다. 갱단은 일정에 따라 풀려나고 남은 사람부터 현장의 노동 교대가 재건되거나 마을이 손을 사용하지 않고 살아가는 동안 코르비가 기간이 지나도록 열릴 수 있습니다. 농민 중 [tv_wonder_organization_competence|E] 또는 [estate_satisfaction|E]는 심지 않은 밭에 대한 비용을 지불합니다."
 tv_engineering_department.7113.a:0 "일정에 따라 코르비 갱단을 석방하고 왼쪽에서 현장 교대근무를 재건하십시오."
 tv_engineering_department.7113.b:0 "기간이 지나도록 코르비를 유지하고 마을이 알아서 하도록 하십시오."
 tv_engineering_department.7114.t:0 "건축: 무너진 벽이 현장 자체 포장을 주시합니다."
 tv_engineering_department.7114.d:0 "옹벽은 하룻밤 사이에 무너졌고 손에 가장 가까운 돌은 현장 자체 접근 도로를 따라 이미 깔린 포장이었습니다. 포장은 그대로 두고 모든 자유로운 손은 다른 작업을 수행하여 대신 신선한 돌을 채석할 수 있습니다. 또는 아침이 되기 전에 도로를 다시 찢어서 벽을 패치할 수도 있습니다. 현장의 [tv_wonder_organization_competence|E] 또는 [development|E]가 무너진 벽에 대한 비용을 지불합니다."
 tv_engineering_department.7114.a:0 "대신 다른 작업에서 손을 떼지 말고 신선한 돌을 채석하세요."
 tv_engineering_department.7114.b:0 "아침까지 벽을 패치하기 위해 접근 도로를 다시 찢어냅니다."
 tv_engineering_department.7115.t:0 "건설:빵 장수들은 임금을 체불하고 떠난다"
 tv_engineering_department.7115.d:0 "캠프 시장의 빵 장수들은 지난주 급여가 3일 늦게 지급되고 절반은 동전으로 나눠진 후 짐을 싸고 떠났습니다. 판매자를 다시 유인하기 위해 임금을 더 엄격하고 빈번한 일정으로 재인출할 수 있으며, 이를 위해 현재 급여 로타를 찢을 수도 있고, 캠프가 시장 없이 진행되고 노동자가 스스로 식사를 할 수도 있습니다. 현장의 [tv_wonder_organization_competence|E] 또는 [prosperity|E]가 체불 임금을 지불합니다."
 tv_engineering_department.7115.a:0 "급여 로타를 분리하고 더 엄격한 일정에 따라 다시 그려 판매자를 다시 유인하십시오."
 tv_engineering_department.7115.b:0 "수용소에 시장이 없게 하고 일꾼들이 식사를 하도록 놔두십시오."
 tv_engineering_department.7116.t:0 "건설: 다리의 비계가 하룻밤 사이에 사라집니다"
 tv_engineering_department.7116.d:0 "수도 자체 교량 수리를 위해 준비된 비계는 밤새 현장 마차에 조용히 실렸고 교량 승무원은 도착하여 목재가 사라진 것을 발견했습니다. 현장의 자체 공급 운영을 연장하고 대신 더 멀리 있는 목재 공급원을 중심으로 교대 근무를 재건하거나, 수도의 다리가 빔이 먼저 경이로움을 완료할 때까지 기다릴 수 있습니다. 수도의 [tv_wonder_organization_competence|E] 또는 [development|E]는 누락된 비계에 대한 비용을 지불합니다."
 tv_engineering_department.7116.a:0 "현장의 공급 기간을 연장하고 더 멀리 있는 목재 공급원을 중심으로 교대를 재구축합니다."
 tv_engineering_department.7116.b:0 "수도의 다리가 그 광선이 먼저 경이로움을 완성할 때까지 기다리게 하십시오."
 tv_engineering_department.7117.t:0 "건설: 정오에도 길드 홀이 비어 있음"
 tv_engineering_department.7117.d:0 "수도의 유리공과 소목공의 절반이 3주 동안 현장에 있었고, 집에 있는 길드 홀은 이제 정오에도 대부분 비어 있습니다. 마스터는 집으로 돌아가서 남은 견습생을 중심으로 현장 직원을 재구축할 수 있습니다. 또는 마스터는 수도의 작업장이 잠시 동안 유휴 상태로 있는 동안 가만히 있을 수 있습니다. 수도에 있는 [tv_wonder_organization_competence|E] 또는 [prosperity|E]가 빈 길드홀 비용을 지불합니다."
 tv_engineering_department.7117.a:0 "마스터의 집을 회전하고 나머지 견습생으로 현장 승무원을 재건하십시오."
 tv_engineering_department.7117.b:0 "마스터를 현장에 유지하고 수도의 작업장을 유휴 상태로 두십시오."
 tv_engineering_department.7118.t:0 "건설: 손이 짧은 플랫폼이 밧줄을 잃다"
 tv_engineering_department.7118.d:0 "오늘 아침 인력이 부족한 승무원이 시간을 맞추기 위해 플랫폼에 두 배로 올라갔을 때 호이스트 로프가 끊어졌고 세 사람이 함께 내려갔습니다. 예비 갱단은 일정에 관계없이 내일 자체 작업을 수행하고 플랫폼에 던져질 수 있으며, 부상자가 이송된 후 동일한 승무원이 부족한 인력으로 다시 보내질 수 있습니다. [tv_wonder_organization_competence|E] 또는 현장에서 일하는 [population|E]가 절단된 로프 비용을 지불합니다."
 tv_engineering_department.7118.a:0 "예비 갱단을 각자의 임무에서 끌어내 플랫폼에 던져 버리세요. 일정은 망할 것입니다."
 tv_engineering_department.7118.b:0 "부상자들이 이송되면 인력이 부족한 동일한 승무원을 다시 보내십시오."
 tv_engineering_department.7119.t:0 "건설: 버클이 달린 다리가 진흙 속에 호송대를 좌초시켰습니다"
 tv_engineering_department.7119.d:0 "보급로 위의 다리는 돌 수레의 무게로 인해 휘어졌고, 호송대의 절반은 이제 그 아래 진흙 속에 좌초되어 있습니다. 건널목에 있는 뱃사공들은 가격을 받고 마차를 뗏목으로 운반할 것이며 누군가는 어떤 식으로든 비용을 지불할 것이라고 말합니다."
 tv_engineering_department.7119.a:0 "[tv_wonder_logistics_competence|E] 비용이 얼마나 들든 마차를 앉은 자리에 두고 나머지는 부서진 다리 주위로 경로를 지정합니다."
 tv_engineering_department.7119.b:0 "오늘 마차를 건너기 위해 재무부에서 페리맨의 가격을 지불하고 [gold|E]를 소모하세요."
 tv_engineering_department.7120.t:0 "건설: 톨게이트 봉인이 더 이상 유지되지 않습니다."
 tv_engineering_department.7120.d:0 "호송대의 순찰병들은 이웃의 톨게이트로 되돌아갔고, 그들의 헌장에는 지역 영주가 더 이상 존중하지 않는 인장이 찍혀 있었습니다. 누군가는 왕관의 이름으로 문을 강제로 열지 아니면 마차를 문 밖에 앉힐지 결정해야 합니다."
 tv_engineering_department.7120.a:0 "호송대를 뒤로 돌려 분쟁 중인 톨게이트 주변의 더 긴 경로를 찾으면 [tv_wonder_logistics_competence|E]가 미끄러지게 됩니다."
 tv_engineering_department.7120.b:0 "아직 해결되지 않은 싸움에 [legitimacy|E]를 사용하여 지금 문을 강제로 열려면 왕관의 권한을 호출하세요."
 tv_engineering_department.7121.t:0 "건설: 마을 주민들이 세 번째 요청으로 도로를 막았습니다."
 tv_engineering_department.7121.d:0 "마을 주민들은 자신들의 수레로 길을 막고 이번 시즌 3차 징발이 취소될 때까지 이동을 거부했다. 호송대는 물러서거나 병사들을 데리고 길을 비우지 않고는 지나갈 수 없습니다."
 tv_engineering_department.7121.a:0 "뒤로 물러나 봉쇄 주변으로 호송대의 경로를 변경하고 [tv_wonder_logistics_competence|E]에서 이로 인해 발생하는 정체를 받아들입니다."
 tv_engineering_department.7121.b:0 "군인을 보내 강제로 도로를 청소하고 [stability|E]에서 비용을 계산하세요."
 tv_engineering_department.7122.t:0 "건설: 감독은 증인 앞에서 말을 거부당함"
 tv_engineering_department.7122.d:0 "호송대의 감독은 경쟁 법원에서 새로운 말 초안을 거부하고 증인 앞에서 보내졌습니다. 이제 말을 얻는 것은 법원이 준수하도록 부끄럽게 만드는 호의를 요청하는 것을 의미합니다. 그것을 얻지 못한다는 것은 마차가 나머지 길을 기어간다는 것을 의미합니다."
 tv_engineering_department.7122.a:0 "이미 지친 말을 가지고 감독을 보내고, [tv_wonder_logistics_competence|E]에서 지연이 알려지도록 하십시오."
 tv_engineering_department.7122.b:0 "상대 법원이 [prestige|E]를 지출하여 신선한 말을 넘겨주도록 공개적으로 호의를 요청하십시오."
 tv_engineering_department.7123.t:0 "건설:카터스가 귀족 가문의 말을 지휘하다"
 tv_engineering_department.7123.d:0 "호송대의 마차꾼들은 불가사의의 팀이 부족할 때 귀족 가문의 마차 말을 징발했고, 가족은 해가 지기 전에 마차를 돌려달라고 요구하고 있습니다. 말을 돌려주면 마차가 멈춥니다. 그것들을 유지하는 것은 가족의 인내심을 지연시킵니다."
 tv_engineering_department.7123.a:0 "오늘 밤 말을 귀족의 집으로 돌려보내고 [tv_wonder_logistics_competence|E]의 대가를 치르고 마차는 말 없이 기다리게 하십시오."
 tv_engineering_department.7123.b:0 "귀족들 사이에서 [estate_satisfaction|E]에 무슨 일이 일어나든, 빌린 말들이 호송대를 좀 더 오랫동안 운행하게 하세요."
 tv_engineering_department.7124.t:0 "건설: 명절에 굴러가는 마차"
 tv_engineering_department.7124.d:0 "가장 짧은 보급 도로는 수도원 땅을 가로지르며, 축제일에는 누군가가 떠나라고 요청하기도 전에 마차가 굴러갔습니다. 승려들은 문을 닫았으며 호송대가 되돌아오거나 응답을 받기를 원합니다."
 tv_engineering_department.7124.a:0 "마차를 뒤로 돌려 수도원 부지 주변의 다른 길을 찾으면 우회 비용이 [tv_wonder_logistics_competence|E]가 됩니다."
 tv_engineering_department.7124.b:0 "계획대로 호송대를 게이트로 밀어넣고 성직자들 사이에서 [estate_satisfaction|E]와 함께 공격을 가하도록 하세요."
 tv_engineering_department.7125.t:0 "건설: 호송대는 시장 광장에서 폭풍을 기다립니다"
 tv_engineering_department.7125.d:0 "호송대는 폭풍을 기다리기 위해 밤새 마을 시장 광장 건너편에 마차를 주차했으며 그 이후로 노점상들은 문을 열 수 없었습니다. 상인들은 폭풍우가 있든 없든 오늘 광장을 비울 것을 요구하고 있습니다."
 tv_engineering_department.7125.a:0 "지금 마차를 날씨 속으로 이동하여 폭풍으로 인해 [tv_wonder_logistics_competence|E] 속도가 느려지도록 하세요."
 tv_engineering_department.7125.b:0 "광장에 마차를 좀 더 오래 붙잡고 상인들 사이에 있는 [estate_satisfaction|E]에 분노를 표출하세요."
 tv_engineering_department.7126.t:0 "건설: 같은 마을이 세 번째로 소를 잃었다"
 tv_engineering_department.7126.d:0 "같은 마을에서는 이번 달에만 세 번이나 호송을 위해 소와 수레를 징발했고, 밭은 갈지 않게 되었습니다. 동물들이 쟁기로 돌아가거나 마차가 스스로 끌어당깁니다."
 tv_engineering_department.7126.a:0 "[tv_wonder_logistics_competence|E]를 희생하여 황소를 다시 들판으로 보내고 호송대가 황소 없이 절뚝거리게 하십시오."
 tv_engineering_department.7126.b:0 "네 번째로 황소를 징발하고 농민들 사이에서 [estate_satisfaction|E]에 마을의 피로가 표시되도록 합니다."
 tv_engineering_department.7127.t:0 "건설: 산사태로 현장까지의 도로가 매몰됨"
 tv_engineering_department.7127.d:0 "산사태로 인해 현장의 마지막 도로가 묻혔으며, 유일한 빠른 해결 방법은 새로 놓인 집결지를 허물어 채우고 판자를 깔는 것입니다. 현장이 자체 기반 작업을 포기하거나 호송대가 슬라이드 밖에서 기다리게 됩니다."
 tv_engineering_department.7127.a:0 "집결장을 그대로 두고 [tv_wonder_logistics_competence|E]를 희생하여 호송대를 슬라이드 외부에 앉히십시오."
 tv_engineering_department.7127.b:0 "현장에서 [development|E]를 사용하여 도로를 청소하기 위해 새로 깔린 야드를 메우고 판자를 찢습니다."
 tv_engineering_department.7128.t:0 "건설: 작업자 가판대를 지나 도로를 확장해야 합니다."
 tv_engineering_department.7128.d:0 "마차는 현장의 작업자 매점을 지나 확장된 도로가 필요하며, 상인들은 거래할 다른 곳이 없습니다. 마차가 내려와 호송대가 지나갈 수 있도록 하거나 마차가 기어가며 지나갑니다."
 tv_engineering_department.7128.a:0 "[tv_wonder_logistics_competence|E]의 비용으로 마차가 기어가면서 지나갈 수 있도록 하고 노점은 그대로 두십시오."
 tv_engineering_department.7128.b:0 "현장에서 [prosperity|E]를 소비하여 호송을 위한 도로를 넓히기 위해 판매점 매점을 정리합니다."
 tv_engineering_department.7129.t:0 "건설：호송대를 밀기 위해 수도의 거리가 찢어진다"
 tv_engineering_department.7129.d:0 "수도의 마차업자와 조약돌 승무원은 정지된 호송대를 도시로 마지막 마일까지 밀어내기 위해 평소의 작업을 중단했습니다. 마차가 기다리든 말든 수도의 거리는 반쯤 찢기고 반쯤 비어 있습니다."
 tv_engineering_department.7129.a:0 "[tv_wonder_logistics_competence|E]를 희생하여 수도의 승무원을 각자의 작업으로 돌려보내고 호송대가 관문에서 정지하도록 하십시오."
 tv_engineering_department.7129.b:0 "수도의 승무원을 거리에서 끌어내어 마차 운반을 완료하고 수도에서 [development|E]를 소비합니다."
 tv_engineering_department.7130.t:0 "건설: 정체된 화물이 수도 시장 광장을 점거하다"
 tv_engineering_department.7130.d:0 "호송대는 불가사의의 정체된 화물을 보관하기 위해 수도의 중앙 시장 광장을 지휘했으며, 일반적으로 그곳에서 거래하는 캐러밴은 일주일 동안 돌아섰습니다. 화물이 이동하고 시장이 다시 열리거나 광장이 한동안 창고로 유지됩니다."
 tv_engineering_department.7130.a:0 "그러나 대략적으로 화물을 한 번에 옮기고 [tv_wonder_logistics_competence|E]에 부담을 가하십시오."
 tv_engineering_department.7130.b:0 "화물을 광장에 두고 캐러밴을 차단하고 수도에서 [prosperity|E]를 소비합니다."
 tv_engineering_department.7131.t:0 "건설: 소 대신 노동자들이 밧줄에 매여진다"
 tv_engineering_department.7131.d:0 "짐을 끄는 동물은 다 쓰고 새 동물은 없자 현장 감독들은 좌초된 수레를 손으로 끌기 위해 인부들을 밧줄에 묶기 시작했습니다. 남자들이 지칠 대로 지쳐 계속 끌거나, 수레가 그들이 갇힌 자리에 머물거나 둘 중 하나입니다."
 tv_engineering_department.7131.a:0 "[tv_wonder_logistics_competence|E]를 희생하여 사람들을 더 일하게 하기보다는 카트를 제자리에 그대로 두십시오."
 tv_engineering_department.7131.b:0 "카트가 움직일 때까지 작업자를 로프에 매달고 현장에서 작업 [population|E]를 소비합니다."
 tv_engineering_department.7132.t:0 "건설 : 석공이 일을 멈추고 무급"
 tv_engineering_department.7132.d:0 "석공 길드는 두 달 동안 급여를 받지 못한 채 작업을 중단했습니다. 그들의 감독은 장부와 주먹을 쥔 채 문 앞에 서 있고 누군가는 마당이나 금고를 열어야합니다."
 tv_engineering_department.7132.a:0 "절단기를 걷고 [tv_wonder_construction|E] 진행을 기다리게 하십시오."
 tv_engineering_department.7132.b:0 "[gold|E]로 연체금을 지불하고 끌을 계속 움직이세요."
 tv_engineering_department.7133.t:0 "건설: 사기꾼이 사라진 영장을 인용하다"
 tv_engineering_department.7133.d:0 "해당 지역의 석공들이 관례적인 영장 없이 징수되었다는 소문이 의회에 전해졌고, 사기꾼은 이미 이를 왕관이 변덕스럽게 통치한다는 증거로 인용하고 있습니다. 누군가는 지름길, 즉 작업 자체나 작업을 지시한 명령에 대해 대답해야 합니다."
 tv_engineering_department.7133.a:0 "추가 부담금을 상기하고 [tv_wonder_construction|E] 진행 상황을 뒤처지게 하십시오."
 tv_engineering_department.7133.b:0 "영장을 지키고 왕관 [legitimacy|E]를 지불하십시오."
 tv_engineering_department.7134.t:0 "건설:마을 주민들이 수레길을 몸으로 막는다"
 tv_engineering_department.7134.d:0 "채석장 도로에 울타리가 쳐져 있는 마을 주민들이 몸으로 수레길을 막았습니다. 오늘 밤 수레가 돌아오거나, 아니면 군인들이 도로를 청소하고 시골 사람들이 그것을 기억합니다."
 tv_engineering_department.7134.a:0 "카트를 다시 돌리고 [tv_wonder_construction|E] 진행을 기다리세요."
 tv_engineering_department.7134.b:0 "경비병을 보내 트랙을 정리하고 [stability|E] 비용을 지출하세요."
 tv_engineering_department.7135.t:0 "공사: 반쯤 무너진 비계를 둘러보는 대사"
 tv_engineering_department.7135.d:0 "외국 대사가 일찍 현장을 둘러보았고 녹색 모르타르 위에 반쯤 무너진 비계를 발견했습니다. 그의 보고서 집은 이미 초안 작성 중입니다. 감독자는 제대로 다시 하기 위해 작업을 중단할 수도 있고, 대사가 본 것을 기록하게 할 수도 있습니다."
 tv_engineering_department.7135.a:0 "결함이 있는 섹션을 분해하고 [tv_wonder_construction|E] 진행이 다시 시작되도록 합니다."
 tv_engineering_department.7135.b:0 "비계를 세워두고 편지에 왕관 [prestige|E]가 들어가도록 하세요."
 tv_engineering_department.7136.t:0 "건설: 영주가 채석장으로 표시된 사냥터를 발견함"
 tv_engineering_department.7136.d:0 "지역 영주는 불가사의의 채석장으로 표시된 자신의 사냥터를 발견하고 분노하여 법정으로 달려가 측량사를 철수하지 않으면 가족의 명예를 회복할 것을 요구했습니다. 아래 누군가가 근거를 제시해야 합니다."
 tv_engineering_department.7136.a:0 "측량사를 상기시켜 [tv_wonder_construction|E] 진행 상황을 뒤처지게 하십시오."
 tv_engineering_department.7136.b:0 "채석장 라인을 잡고 귀족들 사이에서 [estate_satisfaction|E]의 비용을 지불하게 하세요."
 tv_engineering_department.7137.t:0 "건설: 재단이 오래된 묘지를 발견하다"
 tv_engineering_department.7137.d:0 "기초를 준비하던 발굴자들은 아무도 기록하지 않은 오래된 본당 묘지를 발견했고, 신부들은 그것이 적절하게 재매장될 때까지 추가 작업을 축복하기를 거부하고 있습니다. 누군가는 삽과 성례전 중 하나를 선택해야 합니다."
 tv_engineering_department.7137.a:0 "환급 의식이 끝날 때까지 굴착기를 멈추고 [tv_wonder_construction|E] 진행을 기다리세요."
 tv_engineering_department.7137.b:0 "발굴을 계속하도록 명령하고 성직자들 사이에서 비용이 [estate_satisfaction|E]가 되도록 하십시오."
 tv_engineering_department.7138.t:0 "건축: 벽돌 수레가 상인 광장을 삼키다"
 tv_engineering_department.7138.d:0 "상인 광장은 일주일 동안 석재 수레에 반쯤 잠겨 있었고, 길드 마스터들은 이번 한 주가 더 지나면 가을 박람회를 망칠 것이라고 말했습니다. 오늘 밤 카트가 새로운 경로를 찾거나 박람회가 건설 현장으로 열립니다."
 tv_engineering_department.7138.a:0 "카트 경로를 변경하고 [tv_wonder_construction|E] 진행 속도를 느리게 하십시오."
 tv_engineering_department.7138.b:0 "카트를 광장에 유지하고 버거들 사이에서 비용이 [estate_satisfaction|E]가 되도록 하세요."
 tv_engineering_department.7139.t:0 "건설: Corvee Crews는 마지막 건조한 주를 그리워합니다."
 tv_engineering_department.7139.d:0 "이번 달 추진을 위해 세 마을에서 끌려온 선원들은 수확을 위한 마지막 건조한 주를 놓쳤고, 우두머리들은 자신들의 밭이나 경이로움이 먼저인지 묻고 있습니다. 둘 중 하나는 주어야 합니다."
 tv_engineering_department.7139.a:0 "승무원을 다시 현장으로 보내고 [tv_wonder_construction|E]가 느리게 진행되도록 하세요."
 tv_engineering_department.7139.b:0 "승무원을 현장에 유지하고 농민들 사이에서 비용이 [estate_satisfaction|E]가 되도록 하십시오."
 tv_engineering_department.7140.t:0 "건설: 무너진 벽이 현장 자체 작업장을 묻음"
 tv_engineering_department.7140.d:0 "옹벽이 하룻밤 사이에 무너져 현장 주변에 자란 반쯤 완성된 작업장과 상점을 묻었습니다. 적절하게 재건축하려면 경이로움에서 인건비를 끌어내거나 주변에 무엇이 있는지 등 어느 쪽이든 사이트에 비용이 발생합니다."
 tv_engineering_department.7140.a:0 "작업장을 강화하기 위해 승무원을 끌어들이고 [tv_wonder_construction|E] 진행을 지연시키십시오."
 tv_engineering_department.7140.b:0 "작업장을 잔해로 남겨두고 현장에서 비용이 [development|E]가 되도록 하십시오."
 tv_engineering_department.7141.t:0 "건설: 행상인들이 새로운 야적장을 위해 쫓겨났습니다"
 tv_engineering_department.7141.d:0 "작업반에게 식량을 제공하기 위해 생겨난 행상인과 소규모 작업장은 이번 주에 새로운 비축장을 위한 땅을 정리하기 위해 쫓겨났고, 현장의 작은 경제도 그들과 함께 조용해졌습니다. 비축물 또는 현장 자체 거래 - 둘 중 하나가 땅을 유지합니다."
 tv_engineering_department.7141.a:0 "행상인에게 땅을 돌려주고 [tv_wonder_construction|E] 진행 상황을 비축물에서 기다리게 하십시오."
 tv_engineering_department.7141.b:0 "비축장을 유지하고 현장에서 비용이 [prosperity|E]가 되도록 하세요."
 tv_engineering_department.7142.t:0 "건설: 수도의 모든 석공을 모집합니다."
 tv_engineering_department.7142.d:0 "수도 자체의 교량 수리는 도시의 모든 석공과 수레가 불가사의의 최근 추진을 위해 요청되었기 때문에 중단되었습니다. 치안 판사는 기간이 실패하기 전에 승무원을 돌려받기를 원합니다. 사이트에서는 한 달 더 연장을 원합니다."
 tv_engineering_department.7142.a:0 "석공들을 수도로 돌려보내고 [tv_wonder_construction|E] 진행 속도를 느리게 하십시오."
 tv_engineering_department.7142.b:0 "석공을 현장에 유지하고 수도에서 [development|E]의 비용이 들도록 하십시오."
 tv_engineering_department.7143.t:0 "건설: 돌수레로 수도의 두 거리 폐쇄"
 tv_engineering_department.7143.d:0 "수도의 시장 지구를 굴러다니는 수레 한 대의 돌로 인해 일주일 동안 두 개의 거리가 폐쇄되었으며 그곳의 상점 주인들은 무역이 이미 다른 곳으로 이동하고 있다고 말합니다. 호송대가 더 긴 경로를 찾거나 지역이 출혈 관습을 유지합니다."
 tv_engineering_department.7143.a:0 "호송대의 경로를 변경하고 [tv_wonder_construction|E] 진행 상황을 뒤처지게 하십시오."
 tv_engineering_department.7143.b:0 "호송대를 짧은 경로로 유지하고 수도에서 비용이 [prosperity|E]가 되도록 하십시오."
 tv_engineering_department.7144.t:0 "건설：노동자 수용소에 열병이 퍼진다"
 tv_engineering_department.7144.d:0 "노동자 캠프에 열이 퍼졌고, 의사들은 환자가 휴식을 취해야 한다고 말했습니다. 그렇지 않으면 열병이 전체 승무원에게 퍼질 것입니다. 누군가는 그것을 통해 작업을 수행하고 작업을 잃거나, 작업을 중단하고 작업자를 잃는 것 중에서 선택해야 합니다."
 tv_engineering_department.7144.a:0 "승무원을 세워서 회복하고 [tv_wonder_construction|E]의 진행 상황이 미끄러지도록 하십시오."
 tv_engineering_department.7144.b:0 "아픈 사람들을 치료하고 현장에서 [population|E]의 노동 비용을 지불하게 하십시오."
 tv_engineering_department.7145.t:0 "건설: 재무부의 새로운 격차"
 tv_engineering_department.7145.d:0 "Wonder는 원장이 예상했던 것보다 더 빨리 코인을 뽑습니다. 재무부는 은 부족을 설명할 수 있지만 설명으로는 은을 주조할 수 없습니다."
 tv_engineering_department.7145.a:0 "간격을 메우기 위해 원장을 늘립니다."
 tv_engineering_department.7146.t:0 "건설: 왕실 인장의 먼지"
 tv_engineering_department.7146.d:0 "왕실의 지지는 너무 많은 타협으로 확대됩니다. 봉인은 여전히 유지되지만 더 얇아 보입니다."
 tv_engineering_department.7146.a:0 "왕실 인장이 좀 더 얇아지게 착용할 수 있습니다."
 tv_engineering_department.7147.t:0 "건설: 조용한 마을이 혼란에 빠졌습니다."
 tv_engineering_department.7147.d:0 "건설 리듬은 평범한 삶을 압박합니다. 시장은 늦게 열리고, 마을은 투덜대고, 질서는 약간의 기반을 제공합니다."
 tv_engineering_department.7147.a:0 "우리는 마을이 불평하도록 내버려두고 계속해서 노력합니다."
 tv_engineering_department.7148.t:0 "건설: 법원이 색을 잃다"
 tv_engineering_department.7148.d:0 "법원은 작품에 색을 입히고 그 대가로 먼지를 받습니다. 대중 앞에서의 작은 농담과 반쯤 완성된 자랑으로 인해 명성은 사라집니다."
 tv_engineering_department.7148.a:0 "몇 가지 법정 농담으로 약간의 빛을 교환합니다."
 tv_engineering_department.7149.t:0 "건축: 고귀한 테이블에서의 냉담한 말"
 tv_engineering_department.7149.d:0 "귀족 가문은 다시 한 번 굴복합니다. 양보는 형식적이고 냉정하며, 이는 거절보다 더 나쁜 경우가 많습니다."
 tv_engineering_department.7149.a:0 "귀족들의 차갑고 공식적인 양보를 받아들인다."
 tv_engineering_department.7150.t:0 "건축: 제단 앞에서 얼굴을 찡그린다"
 tv_engineering_department.7150.d:0 "작업장을 위해 신성한 달력이 다시 구부러졌습니다. 성직자는 순종하지만 순종에는 장점이 있습니다."
 tv_engineering_department.7150.a:0 "우리는 성직자의 복종, 우위 및 모든 것을 받아들입니다."
 tv_engineering_department.7151.t:0 "건설: 시장에서 더 얇은 원장"
 tv_engineering_department.7151.d:0 "시장 사업은 프로젝트를 중심으로 진행됩니다. 시민은 웅장함에서 이익을 얻을 수 있지만, 그곳으로 향하는 모든 길이 막혀 있을 때는 그렇지 않습니다."
 tv_engineering_department.7151.a:0 "도로를 청소하고 계속 건설하세요!"
 tv_engineering_department.7152.t:0 "건설: 마을의 더 무거운 등받이"
 tv_engineering_department.7152.d:0 "농촌 어깨에는 또 다른 부담이 있습니다. 프로젝트가 진행되고 마을의 인내심은 점점 약해집니다."
 tv_engineering_department.7152.a:0 "농촌 어깨에 추가 부담을 쌓습니다."
 tv_engineering_department.7153.t:0 "건설: 부지는 거리를 포기한다"
 tv_engineering_department.7153.d:0 "이 사이트는 일반적인 직물을 더 많이 포기합니다. 미래의 경이로움은 공간을 확보하고 현재의 거리는 쓸모를 잃습니다."
 tv_engineering_department.7153.a:0 "내일의 경이로움을 위해 이 거리에 서명을 하세요."
 tv_engineering_department.7154.t:0 "건설: 사이트가 점점 더 조용해집니다."
 tv_engineering_department.7154.d:0 "일반적인 교류가 기념물 쪽으로 끌려감에 따라 부지는 상업적으로 점점 더 조용해집니다. 번영은 쇠퇴하기 전에 몇 번만 방향을 바꿀 수 있습니다."
 tv_engineering_department.7154.a:0 "우리는 다시 한 번 기념물 쪽으로 해당 지역의 거래를 유도합니다."
 tv_engineering_department.7155.t:0 "건설: 자본 프로젝트가 길을 만든다"
 tv_engineering_department.7155.d:0 "자본 프로젝트는 다시 경이로움을 선사합니다. 왕도는 여전히 웅장하지만 그 틀의 일부는 차용되고 있습니다."
 tv_engineering_department.7155.a:0 "수도 자체의 틀을 경이로움에 빌려줍니다."
 tv_engineering_department.7156.t:0 "건설: 수도의 조용한 거리"
 tv_engineering_department.7156.d:0 "프로젝트가 신용과 상품을 끌어들이면서 수도 시장은 약간의 밝기를 잃습니다. 법원은 이를 애국적이라고 부를 수도 있다. 상인들은 이를 느린 거래라고 부릅니다."
 tv_engineering_department.7156.a:0 "모든 기념물은 어딘가에서 그 빛을 빌려옵니다."
 tv_engineering_department.7157.t:0 "건설: 부상 목록에 이름이 추가됨"
 tv_engineering_department.7157.d:0 "부상 목록에 이름이 추가됩니다. 작업은 계속되지만 새로운 표시가 나올 때마다 인부들이 돌을 보는 방식이 달라집니다."
 tv_engineering_department.7157.a:0 "이름을 기록하고 계속하세요!"
 tv_engineering_department.7158.t:0 "건축: 재무부 문에서의 침묵"
 tv_engineering_department.7158.d:0 "현장의 강력한 요구로 인해 재무부는 눈에 띄게 공허해졌습니다. 기념비는 계속되고, 왕국은 무엇이든 감상하기 전에 대가를 지불합니다."
 tv_engineering_department.7158.a:0 "금고를 비우고 상관없이 돌을 올려 놓습니다."
 tv_engineering_department.7159.t:0 "공사：현장 전 균열 의무화"
 tv_engineering_department.7159.d:0 "작업장의 요구로 인해 왕관은 품위 없는 자세를 취하게 됩니다. 이제 장엄함의 약속은 손상된 권위에 기대어 있습니다."
 tv_engineering_department.7159.a:0 "벽이 올라갈 수 있도록 크라운을 구부리도록 합니다."
 tv_engineering_department.7160.t:0 "건설: 추가 부담금으로 파편 주문"
 tv_engineering_department.7160.d:0 "더 가혹한 혼란이 울타리 너머로 쏟아집니다. 관리들은 원인을 밝힐 수는 있지만 이름을 붙여서 나라가 안정감을 느끼게 할 수는 없습니다."
 tv_engineering_department.7160.a:0 "불안이 울타리 너머로 흘러가도록 놔두세요."
 tv_engineering_department.7161.t:0 "건설: 공개적으로 명예가 흔들린다"
 tv_engineering_department.7161.d:0 "사이트에서의 대중적 당혹감은 공식적인 수정보다 더 빠르게 퍼집니다. 명예는 아직 서 있지 않은 돌에 대한 대가를 지불합니다."
 tv_engineering_department.7161.a:0 "그들이 이야기하게 해주세요!"
 tv_engineering_department.7162.t:0 "건설 : 고귀한 인내가 깎여 나옵니다."
 tv_engineering_department.7162.d:0 "이 프로젝트는 예의가 더 이상 소리를 덮을 수 없을 때까지 고귀한 인내심을 가졌습니다. 기념비는 상속 재산을 먹을 때 가난한 손님입니다."
 tv_engineering_department.7162.a:0 "벽돌이 전진하는 동안 귀족들이 투덜대도록 하세요."
 tv_engineering_department.7163.t:0 "건설 : 조끼에는 인내심이 부족합니다"
 tv_engineering_department.7163.d:0 "건축 요구가 제단 근처에서 너무 짓밟히고 있습니다. 성직자들은 경건이 열린 공간으로 취급된다는 점을 잊지 않습니다."
 tv_engineering_department.7163.a:0 "우리는 성직자의 차가운 침묵을 돌의 대가로 받아들입니다."
 tv_engineering_department.7164.t:0 "건설: 분노가 거리에 닿다"
 tv_engineering_department.7164.d:0 "작업장이 공간, 시간, 신용을 삼키면서 분노가 상점에까지 도달합니다. 도시는 기념물을 보기 전에 먼저 그것을 듣습니다."
 tv_engineering_department.7164.a:0 "비계가 올라가는 동안 상점 정면이 투덜대도록 하세요."
 tv_engineering_department.7165.t:0 "건설: 농촌의 분노는 가만히 있지 않을 것이다"
 tv_engineering_department.7165.d:0 "이번 부과금 이후에도 농촌의 분노는 잠잠해지지 않을 것입니다. 불가사의의 그림자는 완성된 모습을 결코 볼 수 없는 농장에 도달합니다."
 tv_engineering_department.7165.a:0 "들판이 견디게 하라!"
 tv_engineering_department.7166.t:0 "건설: 사이트가 무너졌습니다."
 tv_engineering_department.7166.d:0 "작업은 사이트를 되돌릴 수 있을 만큼 단단하게 공간을 비워줍니다. 기념비는 아직 세워지지 않았지만 주변 장소는 이미 지불되었습니다."
 tv_engineering_department.7166.a:0 "기념비가 앞으로 나아갈 수 있도록 부지를 다시 설정합니다."
 tv_engineering_department.7167.t:0 "건설: 현장의 번영이 질식되었습니다"
 tv_engineering_department.7167.d:0 "작업장은 한동안 현지 시장을 질식시켰습니다. 수레는 여전히 도착하지만 돌 주변의 마을을 운행하는 수레는 더 적습니다."
 tv_engineering_department.7167.a:0 "작업이 진행되는 동안 현지 시장을 축소할 수 있습니다."
 tv_engineering_department.7168.t:0 "건설: 자본은 돌로 지불한다"
 tv_engineering_department.7168.d:0 "자본은 석재, 노동 및 지연된 수리로 비용을 지불합니다. 멀리 있는 기념물은 더욱 현실적이 되고 근처의 계획은 공허해집니다."
 tv_engineering_department.7168.a:0 "우리는 수도의 자체 수리가 먼 경이로움을 기다리도록 했습니다."
 tv_engineering_department.7169.t:0 "건설: 왕도의 무역이 압박을 받음"
 tv_engineering_department.7169.d:0 "왕도의 무역은 공사로 인해 압박을 받고 있습니다. 멀리 있는 웅장함은 자금을 조달해야 하는 거리를 무디게 만듭니다."
 tv_engineering_department.7169.a:0 "다른 곳의 웅장함을 자금으로 조달하기 위해 왕도의 거리를 무디게 만듭니다."
 tv_engineering_department.7170.t:0 "건설: 땀이 피로 변하다"
 tv_engineering_department.7170.d:0 "땀은 해당 부위에서 혈액으로 변합니다. 기념비는 취소되지 않았으며 이는 수업에서 가장 잔인한 부분일 수 있습니다."
 tv_engineering_department.7170.a:0 "사이트가 피를 흘렸음에도 불구하고 우리는 계속해서 노력하고 있습니다."
 tv_engineering_department.7171.t:0 "건설: [tv_great_engineer|E]가 거리에서 승리합니다."
 tv_engineering_department.7171.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]는 기술 투어를 공개적인 승리로 바꿉니다. 그 결과 [tv_wonder_domestic_support|E]에서 대폭적인 개선이 이루어졌습니다.\n\n#G 이 이벤트는 현재 [tv_great_engineer|E]가 80 이상의 유효 군사 능력을 가지고 있기 때문에 발생했습니다.#!"
 tv_engineering_department.7171.a:0 "정기 점검을 대중의 승리로 바꿉니다."
 tv_engineering_department.7172.t:0 "건설: [tv_great_engineer|E] 그랜드 라인을 다시 그립니다."
 tv_engineering_department.7172.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]는 더 큰 계획을 신뢰할 수 있게 만드는 자신감을 가지고 주축을 다시 그립니다. 그 결과 [tv_wonder_scale_competence|E]에서 대폭적인 개선이 이루어졌습니다.\n\n#G 이 이벤트는 현재 [tv_great_engineer|E]가 80 이상의 유효 군사 능력을 가지고 있기 때문에 발생했습니다.#!"
 tv_engineering_department.7172.a:0 "장축을 무모한 것이 아니라 불가피하게 보이게 만듭니다."
 tv_engineering_department.7173.t:0 "건설：[tv_great_engineer|E] 일정 재구축"
 tv_engineering_department.7173.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]는 일정을 매우 깔끔하게 재구축하여 경쟁 감독관도 이를 준수합니다. 그 결과 [tv_wonder_organization_competence|E]에서 대폭적인 개선이 이루어졌습니다.\n\n#G 이 이벤트는 현재 [tv_great_engineer|E]가 80 이상의 유효 군사 능력을 가지고 있기 때문에 발생했습니다.#!"
 tv_engineering_department.7173.a:0 "우리는 새로운 일정에 뒤쳐져 있습니다."
 tv_engineering_department.7174.t:0 "건설：[tv_great_engineer|E]가 길을 열다"
 tv_engineering_department.7174.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]는 오래된 지연을 거의 어리석게 보이게 만드는 공급 경로를 엽니다. 그 결과 [tv_wonder_logistics_competence|E]에서 대폭적인 개선이 이루어졌습니다.\n\n#G 이 이벤트는 현재 [tv_great_engineer|E]가 80 이상의 유효 군사 능력을 가지고 있기 때문에 발생했습니다.#!"
 tv_engineering_department.7174.a:0 "드디어 길이 열렸습니다!"
 tv_engineering_department.7175.t:0 "건설: [tv_great_engineer|E]가 주요 작업을 주도합니다."
 tv_engineering_department.7175.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]는 적은 손을 멈추게 했던 문제를 통해 주요 작업을 구동합니다. 그 결과 [tv_wonder_construction|E] 진행이 크게 개선되었습니다.\n\n#G 이 이벤트는 현재 [tv_great_engineer|E]가 80 이상의 유효 군사 능력을 가지고 있기 때문에 발생했습니다.#!"
 tv_engineering_department.7175.a:0 "정지된 작업을 깨끗하게 진행합니다."
 tv_engineering_department.7176.t:0 "건설 : [tv_great_engineer|E] 소문을 진정"
 tv_engineering_department.7176.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]는 꾸준한 대중의 신뢰를 얻기 위해 충분히 명확한 설명으로 소문에 답합니다. 프로젝트는 [tv_wonder_domestic_support|E]에서 꾸준한 개선을 얻었습니다.\n\n#G 이 이벤트는 현재 [tv_great_engineer|E]가 50 이상의 유효 군사 능력을 가지고 있기 때문에 발생했습니다.#!"
 tv_engineering_department.7176.a:0 "솔직한 말로 소문을 잠재우세요."
 tv_engineering_department.7177.t:0 "건설: [tv_great_engineer|E] 측정을 설정합니다"
 tv_engineering_department.7177.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]는 소심한 설계에서 프로젝트를 보호할 수 있을 만큼 현장에서 충분한 마진을 찾습니다. 프로젝트는 [tv_wonder_scale_competence|E]에서 꾸준한 개선을 얻었습니다.\n\n#G 이 이벤트는 현재 [tv_great_engineer|E]가 50 이상의 유효 군사 능력을 가지고 있기 때문에 발생했습니다.#!"
 tv_engineering_department.7177.a:0 "우리는 과감하게 계획할 수 있는 여지를 충분히 줍니다."
 tv_engineering_department.7178.t:0 "구성: [tv_great_engineer|E]는 롤을 곧게 만듭니다."
 tv_engineering_department.7178.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]는 직원, 도구 및 시계의 완고한 혼란을 바로잡습니다. 프로젝트는 [tv_wonder_organization_competence|E]에서 꾸준한 개선을 얻었습니다.\n\n#G 이 이벤트는 현재 [tv_great_engineer|E]가 50 이상의 유효 군사 능력을 가지고 있기 때문에 발생했습니다.#!"
 tv_engineering_department.7178.a:0 "승무원, 도구 및 시계를 순서대로 설정합니다."
 tv_engineering_department.7179.t:0 "건설: [tv_great_engineer|E] 호송대 제거"
 tv_engineering_department.7179.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]는 호송 일정 중 최악의 매듭을 제거합니다. 프로젝트는 [tv_wonder_logistics_competence|E]에서 꾸준한 개선을 얻었습니다.\n\n#G 이 이벤트는 현재 [tv_great_engineer|E]가 50 이상의 유효 군사 능력을 가지고 있기 때문에 발생했습니다.#!"
 tv_engineering_department.7179.a:0 "보급선의 최악의 매듭을 제거합니다."
 tv_engineering_department.7180.t:0 "구성: [tv_great_engineer|E]는 중요한 관절에 적합합니다."
 tv_engineering_department.7180.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]는 중요한 부분에 적합하며 다음 단계를 더 빨리 시작할 수 있게 해줍니다. 프로젝트는 [tv_wonder_construction|E] 진행에서 꾸준한 개선을 얻었습니다.\n\n#G 이 이벤트는 현재 [tv_great_engineer|E]가 50 이상의 유효 군사 능력을 가지고 있기 때문에 발생했습니다.#!"
 tv_engineering_department.7180.a:0 "전속력으로 전진하세요!"
 tv_engineering_department.7181.t:0 "건설: [tv_great_engineer|E] 군중을 구하다"
 tv_engineering_department.7181.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]는 미완성 작품을 군중 앞에 놓고 그 광경을 신뢰합니다. 이 결정으로 인해 [tv_wonder_domestic_support|E]가 해제되거나 사이트 비용이 많이 발생할 수 있습니다.\n\n#Y 이 이벤트는 현재 [tv_great_engineer|E]가 20에서 80 사이의 효과적인 군사 능력을 가지고 있기 때문에 발생했습니다.#!"
 tv_engineering_department.7181.a:0 "군중이 미완성 돌에 대해 판단을 내리도록 하세요."
 tv_engineering_department.7182.t:0 "건설: [tv_great_engineer|E] 계획 확대"
 tv_engineering_department.7182.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]는 모든 의심이 해결되기 전에 계획 확대를 명령합니다. 이 결정으로 인해 [tv_wonder_scale_competence|E]가 해제되거나 사이트 비용이 많이 발생할 수 있습니다.\n\n#Y 이 이벤트는 현재 [tv_great_engineer|E]가 20에서 80 사이의 효과적인 군사 능력을 가지고 있기 때문에 발생했습니다.#!"
 tv_engineering_department.7182.a:0 "의혹이 해결되기 전에 청사진을 확대하라고 명령한다."
 tv_engineering_department.7183.t:0 "건설: [tv_great_engineer|E]는 교대를 다시 작성합니다"
 tv_engineering_department.7183.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]는 하루 오후에 교대조를 다시 작성하고 마당에서 이를 따라잡도록 합니다. 이 결정으로 인해 [tv_wonder_organization_competence|E]가 해제되거나 사이트 비용이 많이 발생할 수 있습니다.\n\n#Y 이 이벤트는 현재 [tv_great_engineer|E]가 20에서 80 사이의 효과적인 군사 능력을 가지고 있기 때문에 발생했습니다.#!"
 tv_engineering_department.7183.a:0 "우리는 교대조를 다시 작성하고 마당이 이를 따라갈 수 있도록 감히 노력합니다."
 tv_engineering_department.7184.t:0 "건설: [tv_great_engineer|E]는 위험한 길을 택합니다"
 tv_engineering_department.7184.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]는 어려운 길로 카트를 보내고 습관보다 계산을 신뢰합니다. 이 결정으로 인해 [tv_wonder_logistics_competence|E]가 해제되거나 사이트 비용이 많이 발생할 수 있습니다.\n\n#Y 이 이벤트는 현재 [tv_great_engineer|E]가 20에서 80 사이의 효과적인 군사 능력을 가지고 있기 때문에 발생했습니다.#!"
 tv_engineering_department.7184.a:0 "습관보다 계산을 믿으며 수레를 더 어려운 길로 보냅니다."
 tv_engineering_department.7185.t:0 "구성: [tv_great_engineer|E]는 더 빠른 방법을 테스트합니다."
 tv_engineering_department.7185.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]는 실패가 매우 공개되는 경우 더 빠른 방법을 테스트합니다. 이 결정으로 인해 [tv_wonder_construction|E] 진행 상황이 향상되거나 사이트 비용이 많이 발생할 수 있습니다.\n\n#Y 이 이벤트는 현재 [tv_great_engineer|E]가 20에서 80 사이의 효과적인 군사 능력을 가지고 있기 때문에 발생했습니다.#!"
 tv_engineering_department.7185.a:0 "더 빠른 방법을 시도해 보세요 - 공개적으로 증명해 보세요!"
 tv_engineering_department.7186.t:0 "건설: [tv_great_engineer|E]가 동전을 잘못 계산함"
 tv_engineering_department.7186.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]는 수정 비용을 잘못 판단하고 우아함을 감추기 위해 재무부를 떠납니다. 작업은 계속되지만 [gold|E]는 감독으로 인해 어려움을 겪습니다.\n\n#R 이 이벤트는 현재 [tv_great_engineer|E]의 유효 군사 능력이 50 이하이기 때문에 발생했습니다.#!"
 tv_engineering_department.7186.a:0 "계정에 대한 질문이 있기 전에 조용히 부족분을 해결합니다."
 tv_engineering_department.7187.t:0 "건설：[tv_great_engineer|E]는 법원을 잊어버렸다"
 tv_engineering_department.7187.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]는 왕권도 물질이라는 사실을 망각하고 함부로 소비합니다. 작업은 계속되지만 [legitimacy|E]는 감독으로 인해 어려움을 겪습니다.\n\n#R 이 이벤트는 현재 [tv_great_engineer|E]의 유효 군사 능력이 50 이하이기 때문에 발생했습니다.#!"
 tv_engineering_department.7187.a:0 "우리는 왕관의 이름을 부주의하게 사용하는 것을 단속합니다."
 tv_engineering_department.7188.t:0 "건설：[tv_great_engineer|E]가 마을을 잘못 읽다"
 tv_engineering_department.7188.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]는 깔끔한 엔지니어링 답변이 얼마나 많은 방해를 일으킬 수 있는지를 과소평가합니다. 작업은 계속되지만 [stability|E]는 감독으로 인해 어려움을 겪습니다.\n\n#R 이 이벤트는 현재 [tv_great_engineer|E]의 유효 군사 능력이 50 이하이기 때문에 발생했습니다.#!"
