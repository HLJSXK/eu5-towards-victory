 tv_engineering_department.7190.t:0 "건설: [tv_great_engineer|E]는 귀족을 경멸합니다"
 tv_engineering_department.7190.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]는 고귀한 인내심을 마치 또 다른 공급 비축물처럼 취급합니다. 작업은 계속되지만 귀족 중 [estate_satisfaction|E]는 감독으로 인해 어려움을 겪습니다.\n\n#R 이 이벤트는 현재 [tv_great_engineer|E]의 유효 군사 능력이 50 이하이기 때문에 발생했습니다.#!"
 tv_engineering_department.7190.a:0 "고귀한 인내심은 쌓아두는 것이 아니라는 점을 엔지니어에게 상기시킵니다."
 tv_engineering_department.7191.t:0 "건설：[tv_great_engineer|E]가 달력을 방해합니다"
 tv_engineering_department.7191.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]는 마치 배달 테이블인 것처럼 종교 달력을 통해 이동합니다. 작업은 계속되지만 성직자 중 [estate_satisfaction|E]는 감독으로 인해 어려움을 겪고 있습니다.\n\n#R 이 이벤트는 현재 [tv_great_engineer|E]의 유효 군사 능력이 50 이하이기 때문에 발생했습니다.#!"
 tv_engineering_department.7191.a:0 "결국 제단이 자신의 달력을 유지하게 해주세요."
 tv_engineering_department.7192.t:0 "건설: [tv_great_engineer|E]가 시장을 차단합니다."
 tv_engineering_department.7192.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]는 사이트를 위한 깔끔한 라인을 추구하면서 일반 거래를 차단합니다. 작업은 계속되지만 시민 중 [estate_satisfaction|E]는 감독으로 인해 어려움을 겪고 있습니다.\n\n#R 이 이벤트는 현재 [tv_great_engineer|E]의 유효 군사 능력이 50 이하이기 때문에 발생했습니다.#!"
 tv_engineering_department.7192.a:0 "우리는 사이트가 폐쇄했던 시장 경로를 다시 엽니다."
 tv_engineering_department.7193.t:0 "건설：[tv_great_engineer|E]는 마을을 과소평가합니다"
 tv_engineering_department.7193.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]는 지친 마을을 사용되지 않은 보호 구역으로 착각합니다. 작업은 계속되지만 농민 중 [estate_satisfaction|E]는 감독으로 인해 어려움을 겪고 있습니다.\n\n#R 이 이벤트는 현재 [tv_great_engineer|E]의 유효 군사 능력이 50 이하이기 때문에 발생했습니다.#!"
 tv_engineering_department.7193.a:0 "지친 마을을 다시 끌려다니지 말고 쉬게 해주세요."
 tv_engineering_department.7194.t:0 "건설: [tv_great_engineer|E]는 잘못된 거리를 잘라냅니다."
 tv_engineering_department.7194.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]는 잘못된 로컬 배열을 잘라내고 그 격차를 유용하다고 말합니다. 작업은 계속되지만 현장의 [development|E]는 감독으로 인해 어려움을 겪고 있습니다.\n\n#R 이 이벤트는 현재 [tv_great_engineer|E]의 유효 군사 능력이 50 이하이기 때문에 발생했습니다.#!"
 tv_engineering_department.7194.a:0 "실수로 잘린 편곡에 패치를 붙입니다."
 tv_engineering_department.7195.t:0 "건설: [tv_great_engineer|E]는 사이트의 생계를 군중화합니다."
 tv_engineering_department.7195.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]는 작업을 위한 공간을 정리하면서 지역 생계를 몰아냅니다. 작업은 계속되지만 현장의 [prosperity|E]는 감독으로 인해 어려움을 겪고 있습니다.\n\n#R 이 이벤트는 현재 [tv_great_engineer|E]의 유효 군사 능력이 50 이하이기 때문에 발생했습니다.#!"
 tv_engineering_department.7195.a:0 "우리는 붐비는 공터로 인해 생계를 위한 공간을 다시 마련합니다."
 tv_engineering_department.7196.t:0 "건설：[tv_great_engineer|E]가 자본을 남용하다"
 tv_engineering_department.7196.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]는 마치 왕도 자체에 계획이 없는 것처럼 자본 자원을 오용합니다. 작업은 계속되지만 수도의 [development|E]는 감독으로 인해 어려움을 겪고 있습니다.\n\n#R 이 이벤트는 현재 [tv_great_engineer|E]의 유효 군사 능력이 50 이하이기 때문에 발생했습니다.#!"
 tv_engineering_department.7196.a:0 "오용된 자원을 수도 자체 계획에 반환합니다."
 tv_engineering_department.7197.t:0 "건설：[tv_great_engineer|E] 왕도를 교란하다"
 tv_engineering_department.7197.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]는 왕실 도시의 무역을 방해하는 동시에 지역 엔지니어링 문제를 해결합니다. 작업은 계속되지만 수도의 [prosperity|E]는 감독으로 인해 어려움을 겪고 있습니다.\n\n#R 이 이벤트는 현재 [tv_great_engineer|E]의 유효 군사 능력이 50 이하이기 때문에 발생했습니다.#!"
 tv_engineering_department.7197.a:0 "우리는 혼란이 퍼지기 전에 왕도의 무역을 진정시켰습니다."
 tv_engineering_department.7198.t:0 "건설：[tv_great_engineer|E]가 노동 제한을 잘못 판단함"
 tv_engineering_department.7198.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]는 노동계의 한계를 잘못 판단하고 있습니다. 작업은 계속되지만 현장에서 일하는 [population|E]는 감독으로 인해 어려움을 겪습니다.\n\n#R 이 이벤트는 현재 [tv_great_engineer|E]의 유효 군사 능력이 50 이하이기 때문에 발생했습니다.#!"
 tv_engineering_department.7198.a:0 "더 많은 것을 포기하기 전에 긴장을 완화하십시오!"
 tv_engineering_department.7199.t:0 "건설: [tv_great_engineer|E]가 원장을 깨뜨립니다."
 tv_engineering_department.7199.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]는 피할 수 있는 실수로 인해 계정이 뚫리고 자존심이 변명할 수 있는 것보다 더 많은 코인을 비울 수 있습니다. 이 오류는 경이로움을 끝내기에 충분하지 않으며, 이는 가장 추악한 부분일 수 있습니다.\n\n#R 이 이벤트는 현재 [tv_great_engineer|E]가 20 이하의 유효 군사 능력을 가지고 있기 때문에 발생했습니다.#!"
 tv_engineering_department.7199.a:0 "손실을 기록하고 조용히 원장을 닫습니다."
 tv_engineering_department.7200.t:0 "건설：[tv_great_engineer|E] 상처를 입은 왕관"
 tv_engineering_department.7200.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]는 예방 가능한 부위 손상을 크라운의 눈에 보이는 상처로 바꿉니다. 이 오류는 경이로움을 끝내기에 충분하지 않으며, 이는 가장 추악한 부분일 수 있습니다.\n\n#R 이 이벤트는 현재 [tv_great_engineer|E]가 20 이하의 유효 군사 능력을 가지고 있기 때문에 발생했습니다.#!"
 tv_engineering_department.7200.a:0 "우리는 왕관의 새로운 상처를 입고 계속 나아갑니다."
 tv_engineering_department.7201.t:0 "건설：[tv_great_engineer|E]가 나라를 불안하게 하다"
 tv_engineering_department.7201.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]는 현장 문제를 해결하려다 나라를 혼란에 빠뜨린다. 이 오류는 경이로움을 끝내기에 충분하지 않으며, 이는 가장 추악한 부분일 수 있습니다.\n\n#R 이 이벤트는 현재 [tv_great_engineer|E]가 20 이하의 유효 군사 능력을 가지고 있기 때문에 발생했습니다.#!"
 tv_engineering_department.7201.a:0 "장애가 저절로 소진되도록 내버려둡니다."
 tv_engineering_department.7202.t:0 "건설: [tv_great_engineer|E]는 광경을 만든다"
 tv_engineering_department.7202.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]는 사이트를 구경거리로 만들고 정중한 명예를 끌어들입니다. 이 오류는 경이로움을 끝내기에 충분하지 않으며, 이는 가장 추악한 부분일 수 있습니다.\n\n#R 이 이벤트는 현재 [tv_great_engineer|E]가 20 이하의 유효 군사 능력을 가지고 있기 때문에 발생했습니다.#!"
 tv_engineering_department.7202.a:0 "법원이 그 광경을 보게 해주세요!"
 tv_engineering_department.7203.t:0 "건설: [tv_great_engineer|E] 주택을 화나게 하다"
 tv_engineering_department.7203.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]는 자신의 권한을 통해 사이트 문제를 해결하여 집을 화나게 합니다. 이 오류는 경이로움을 끝내기에 충분하지 않으며, 이는 가장 추악한 부분일 수 있습니다.\n\n#R 이 이벤트는 현재 [tv_great_engineer|E]가 20 이하의 유효 군사 능력을 가지고 있기 때문에 발생했습니다.#!"
 tv_engineering_department.7203.a:0 "작업을 계속 진행하기 위해 주택의 호의를 소비합니다."
 tv_engineering_department.7204.t:0 "건설: [tv_great_engineer|E]는 성직자를 모욕합니다"
 tv_engineering_department.7204.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]는 신성한 인내가 세속적인 돌에 대한 대가를 치르게 함으로써 성직자의 기분을 상하게 합니다. 이 오류는 경이로움을 끝내기에 충분하지 않으며, 이는 가장 추악한 부분일 수 있습니다.\n\n#R 이 이벤트는 현재 [tv_great_engineer|E]가 20 이하의 유효 군사 능력을 가지고 있기 때문에 발생했습니다.#!"
 tv_engineering_department.7204.a:0 "우리는 세속적인 돌에 대한 비용을 신성한 인내심으로 충당합니다."
 tv_engineering_department.7205.t:0 "건설: [tv_great_engineer|E]는 버거를 자극합니다"
 tv_engineering_department.7205.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]는 상업을 느슨한 발판으로 취급하여 시민을 자극합니다. 이 오류는 경이로움을 끝내기에 충분하지 않으며, 이는 가장 추악한 부분일 수 있습니다.\n\n#R 이 이벤트는 현재 [tv_great_engineer|E]가 20 이하의 유효 군사 능력을 가지고 있기 때문에 발생했습니다.#!"
 tv_engineering_department.7205.a:0 "상인들이 스스로 비계를 수리하도록 남겨둡니다."
 tv_engineering_department.7206.t:0 "건설: [tv_great_engineer|E]가 마을을 부수다"
 tv_engineering_department.7206.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]는 피했어야 할 요구로 마을의 인내심을 깨뜨립니다. 이 오류는 경이로움을 끝내기에 충분하지 않으며, 이는 가장 추악한 부분일 수 있습니다.\n\n#R 이 이벤트는 현재 [tv_great_engineer|E]가 20 이하의 유효 군사 능력을 가지고 있기 때문에 발생했습니다.#!"
 tv_engineering_department.7206.a:0 "우리는 그들을 구제할 수 있었던 요구에 대해 마을의 용서를 구합니다."
 tv_engineering_department.7207.t:0 "건설：[tv_great_engineer|E]가 현장을 손상시켰습니다"
 tv_engineering_department.7207.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]는 국지적 파괴로 기술적인 문제를 해결해 사이트에 피해를 입힌다. 이 오류는 경이로움을 끝내기에 충분하지 않으며, 이는 가장 추악한 부분일 수 있습니다.\n\n#R 이 이벤트는 현재 [tv_great_engineer|E]가 20 이하의 유효 군사 능력을 가지고 있기 때문에 발생했습니다.#!"
 tv_engineering_department.7207.a:0 "수리 자체로 인해 발생한 상처를 패치합니다."
 tv_engineering_department.7208.t:0 "건설: [tv_great_engineer|E], 사이트 시장을 차단하다"
 tv_engineering_department.7208.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]는 예방 가능한 결정을 통해 사이트 시장을 차단합니다. 이 오류는 경이로움을 끝내기에 충분하지 않으며, 이는 가장 추악한 부분일 수 있습니다.\n\n#R 이 이벤트는 현재 [tv_great_engineer|E]가 20 이하의 유효 군사 능력을 가지고 있기 때문에 발생했습니다.#!"
 tv_engineering_department.7208.a:0 "그러니 그렇게 하십시오. 노점상들이 조용해지도록 하십시오!"
 tv_engineering_department.7209.t:0 "건설：[tv_great_engineer|E]는 수도의 계획을 무너뜨립니다"
 tv_engineering_department.7209.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]는 현장의 실수를 덮으려는 수도의 계획을 공허하게 만듭니다. 이 오류는 경이로움을 끝내기에 충분하지 않으며, 이는 가장 추악한 부분일 수 있습니다.\n\n#R 이 이벤트는 현재 [tv_great_engineer|E]가 20 이하의 유효 군사 능력을 가지고 있기 때문에 발생했습니다.#!"
 tv_engineering_department.7209.a:0 "사이트의 실수를 패치하려는 수도 자체의 계획에 배짱이 있습니다."
 tv_engineering_department.7210.t:0 "건설：[tv_great_engineer|E]는 수도의 번영을 어둡게 합니다"
 tv_engineering_department.7210.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]는 시장에 결코 도달하지 말아야 할 실패를 통해 자본 번영을 약화시킵니다. 이 오류는 경이로움을 끝내기에 충분하지 않으며, 이는 가장 추악한 부분일 수 있습니다.\n\n#R 이 이벤트는 현재 [tv_great_engineer|E]가 20 이하의 유효 군사 능력을 가지고 있기 때문에 발생했습니다.#!"
 tv_engineering_department.7210.a:0 "우리는 결코 볼 수 없는 실패로 인해 수도의 빛이 어두워지는 것을 지켜봅니다."
 tv_engineering_department.7211.t:0 "건설：[tv_great_engineer|E]로 인한 사상자 발생"
 tv_engineering_department.7211.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]는 예방 가능한 고장이 승무원을 통과하게 하여 사상자를 발생시킵니다. 이 오류는 경이로움을 끝내기에 충분하지 않으며, 이는 가장 추악한 부분일 수 있습니다.\n\n#R 이 이벤트는 현재 [tv_great_engineer|E]가 20 이하의 유효 군사 능력을 가지고 있기 때문에 발생했습니다.#!"
 tv_engineering_department.7211.a:0 "선원들이 절대로 잃지 말아야 할 사망자 수를 계산합니다."
