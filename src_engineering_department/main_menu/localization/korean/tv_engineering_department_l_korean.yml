 tv_wonder_admiralty_office: "해군성 사무실"
 tv_wonder_admiralty_office_desc: "해군성 예식에 필요한 특별 해군성 사무실입니다."
 tv_wonder_fortress_arsenal_quarter: "요새 무기고 구역"
 tv_wonder_fortress_arsenal_quarter_desc: "무기고 구역 의식에 필요한 특수 무기고 구역입니다."
 tv_wonder_master_armourers_hall: "갑옷 장인의 홀"
 tv_wonder_master_armourers_hall_desc: "갑옷 장인의 의식에 요구되는 특별한 갑옷 제작자 홀."
 tv_wonder_legal_deposit_office: "법정예금사무소"
 tv_wonder_legal_deposit_office_desc: "납세의식에서 요구하는 특별입금사무소입니다."
 tv_engineering_department.551.t: "[tv_wonder_ceremony|E]: 학자들이 모이다"
 tv_engineering_department.551.d: "University City는 연구에 목소리를 낮춥니다. 석사, 학생, 필사자 및 공무원이 강의 목록과 논쟁의 여지가 있는 독서 주위에 모여 완성된 거리를 1년 동안의 소집으로 바꿉니다. [tv_wonder_ceremony|e]는 서두르지 않을 것입니다. 이는 현재 법원보다 오래 지속될 수 있는 강의 계획서를 위해 행정 속도를 교환하도록 영역에 요청합니다."
 tv_engineering_department.551.a: "학자들이 그 해를 차지하게 하라."
 tv_engineering_department.552.t: "[tv_wonder_ceremony|E]：대학회관 시작"
 tv_engineering_department.552.d: "대학 홀에 대한 계획은 대학 도시 옆에 봉인되어 있습니다. 새 홀은 스승들에게 형식적으로 다투는 장소를 제공하고, 학생들에게 유용한 방법에 대한 확신을 덜 갖게 하는 장소를 제공할 것이며, 왕관은 완전히 길들여지지 않고도 배움을 인식할 수 있는 구조를 제공할 것입니다. [tv_wonder_ceremony|e]는 이제 연구의 영속성을 주장할 수 있는 문, 벤치, 법령 및 지붕 아래에서 기다립니다."
 tv_engineering_department.552.a: "논쟁을 위한 집을 짓습니다."
 tv_engineering_department.561.t: "[tv_wonder_ceremony|E]: 돔이 가려져 있다"
 tv_engineering_department.561.d: "큰 돔은 봉헌을 위해 가려져 있습니다. 성직자는 기준점을 표시하고, 가수는 엄숙한 경의 순서를 연습하며, 법원은 신성함이 조심스럽게 움직일 수 있도록 합법성이 더 천천히 움직여야 하는 1년을 인정합니다. [tv_wonder_ceremony|e]는 사원이 하늘을 열 준비가 될 때까지 덮인 하늘 아래에서 기다려달라고 영역에 요청합니다."
 tv_engineering_department.561.a: "돔을 거룩하게 하라."
 tv_engineering_department.571.t: "[tv_wonder_ceremony|E]：순례자의 계단이 열립니다"
 tv_engineering_department.571.d: "탑신전의 계단은 1년 동안 오르고, 쉬고, 노래하고, 발이 아픈 순례자들에게 주어진다. 노동력이 행렬 쪽으로 기울자 작업장에서는 불만을 토로하지만, [tv_wonder_ceremony|e]는 노력을 통해 키를 가르치기 위한 것입니다. 각 단계는 탑을 물체에서 경로로 바꾸고, 각 경로는 헌신을 가시화합니다."
 tv_engineering_department.571.a: "올라가게 해주세요."
 tv_engineering_department.572.t: "[tv_wonder_ceremony|E]：사원학교 시작"
 tv_engineering_department.572.d: "교사, 서기, 건축업자는 탑 아래에 사원 학교의 기초를 표시합니다. [tv_wonder_ceremony|e]는 이제 교리가 습관, 읽고 쓰는 능력, 의식을 통해 규율되는 논증이 될 수 있는 교실을 기다립니다. 탑은 시선을 위쪽으로 끌 수 있습니다. 학교에서는 목소리가 보일 때 무엇을 말해야 하는지 가르칠 것입니다."
 tv_engineering_department.572.a: "학교를 건설하세요."
 tv_engineering_department.581.t: "[tv_wonder_ceremony|E]：강 박람회가 시작됩니다"
 tv_engineering_department.581.d: "부스, 바지선, 요금표, 축제 배너가 넓어진 강을 따라 모여있습니다. 강이 동맥으로 돌아가기 전에 구경거리가 되도록 요구됨에 따라 무역은 둔화됩니다. [tv_wonder_ceremony|e]는 상인, 뱃사공, 관료가 함께 물의 새로운 질서를 수행하도록 1년을 보낼 것입니다."
 tv_engineering_department.581.a: "강이 새로운 군중을 배우게 하십시오."
 tv_engineering_department.582.t: "[tv_wonder_ceremony|E]：운하청이 시작됩니다"
 tv_engineering_department.582.d: "측량사는 운하 당국의 영구 사무실을 표시합니다. 건물은 강 공사와 경쟁할 만큼 크지 않을 것입니다. 이것이 바로 중요한 이유입니다. 수문, 분쟁, 통행료, 수리 및 건기 불만 사항에는 책임이 숨길 수 없는 장소가 필요합니다. [tv_wonder_ceremony|e]는 이제 행정부가 벽을 획득할 때까지 기다립니다."
 tv_engineering_department.582.a: "강에게 책상을 주세요."
 tv_engineering_department.591.t: "[tv_wonder_ceremony|E]：해군성 사무실 시작"
 tv_engineering_department.591.d: "조선소는 해군성 사무실을 위한 부지를 마련해 놓았습니다. 발사대와 크레인은 선박을 건조할 수 있지만 함대에는 목재를 정책으로 만들기 위해 인내심을 갖고 명령, 차트, 검사 및 공무원이 필요합니다. [tv_wonder_ceremony|e]는 이제 조선소가 해군 정신을 갖기를 기다립니다."
 tv_engineering_department.591.a: "사무실을 건설하세요."
 tv_engineering_department.601.t: "[tv_wonder_ceremony|E]: 시험 중인 요새"
 tv_engineering_department.601.d: "별 요새 도시는 시련의 해를 시작합니다. 엔지니어는 각도를 테스트하고 포수는 사격장을 테스트하며 작업자는 수학을 위해 설계된 벽이 여전히 근육으로 비용을 지불해야 함을 발견합니다. [tv_wonder_ceremony|e]가 요새에 돌로 이론에 답하도록 가르치면서 생산이 느려집니다."
 tv_engineering_department.601.a: "모든 각도를 테스트해 보세요."
 tv_engineering_department.602.t: "[tv_wonder_ceremony|E]：아스널 쿼터가 시작됩니다"
 tv_engineering_department.602.d: "기초는 요새 도시 내부의 무기고 구역으로 표시되어 있습니다. 이는 수리점, 화약점, 소집장을 하나의 규율 있는 구역으로 묶을 것입니다. [tv_wonder_ceremony|e]는 이제 첫 번째 경보가 사라진 후 방어를 반복 가능하게 만드는 요새 부분을 기다립니다."
 tv_engineering_department.602.a: "무기고 구역을 건설하세요."
 tv_engineering_department.611.t: "[tv_wonder_ceremony|E]: 신호 발사가 켜집니다"
 tv_engineering_department.611.d: "벽을 따라 있는 기둥을 지켜보며 신호 연습의 1년을 시작하세요. 연기, 불꽃, 라이더 및 지역 시장은 모두 새로운 리듬에 맞춰 움직이고 모든 경로가 경고를 먼저 알아차리는 동안 무역은 어려움을 겪습니다. [tv_wonder_ceremony|e]는 일상적인 여행조차도 관찰되는 것처럼 느낄 정도로 경계심을 공개합니다."
 tv_engineering_department.611.a: "시계를 밝게 유지하세요."
 tv_engineering_department.621.t: "[tv_wonder_ceremony|E]：갑옷장인의 전당 시작"
 tv_engineering_department.621.d: "무기고는 갑옷 장인의 전당을 위한 기초를 표시합니다. 가장 큰 무기 상점은 철과 장부에만 의존할 수 없습니다. 전투에 앞서 실패를 판단할 수 있는 숙련된 손이 필요합니다. [tv_wonder_ceremony|e]는 이제 항공기가 영구 코트를 획득할 때까지 기다립니다."
 tv_engineering_department.621.a: "마스터를 위해 제작하세요."
 tv_engineering_department.631.t: "[tv_wonder_ceremony|E]：국가 카탈로그 시작"
 tv_engineering_department.631.d: "국가 도서관이 카탈로그를 시작합니다. 학자들은 문을 닫고, 재고를 정리하고, 국가의 입법 기관의 속도를 늦추는 동시에 기억을 다시 찾는 방법을 가르칩니다. [tv_wonder_ceremony|e]는 퍼레이드가 아니라 인덱스입니다. 완료되면 조용하고 정확하며 강력합니다."
 tv_engineering_department.631.a: "카탈로그를 성장시키세요."
 tv_engineering_department.632.t: "[tv_wonder_ceremony|E]：법정예금사무소 개시"
 tv_engineering_department.632.d: "건축업자는 도서관 옆에 납본 사무소를 표시합니다. 여기에서 책, 법령, 사본 및 주장은 호의가 아닌 의무로 수집됩니다. [tv_wonder_ceremony|e]는 이제 사고에 따라 영역에 기록된 메모리가 중지되는 방을 기다립니다."
 tv_engineering_department.632.a: "기억의 사무실을 건설하세요."

