 TV_ENGINEERING_CONSTRUCTION_HELP_TEXT_2: "$BULLET$ [tv_wonder_construction|e]의 레벨은 가장 뒤에 있는 부분에 따라 달라집니다. 전체 레벨은 지연된 부분이 새 유닛을 완료한 후에만 올라갑니다."
 TV_ENGINEERING_CONSTRUCTION_HELP_TEXT_3: "$BULLET$ [tv_wonder_construction|e]가 하나 이상의 레벨을 완료하면 완료라고 선언할 수 있습니다."
 TV_ENGINEERING_CONSTRUCTION_HELP_TEXT_4: "$BULLET$ 따라서 소규모 프로젝트를 먼저 완료하고 나중에 이미 획득한 완료 보상을 잃지 않고 더 큰 규모의 [tv_wonder_expansion|e]를 추구할 수 있습니다."
 TV_ENGINEERING_CONSTRUCTION_HELP_TEXT_5: "$BULLET$ 건설 유닛을 완료하면 [tv_wonder_domestic_support|e]가 부여됩니다. 해당 유닛이 Great Project의 전체 레벨도 높이면 또 다른 [tv_wonder_domestic_support|e] 보너스를 부여합니다."
 TV_ENGINEERING_CONSTRUCTION_HELP_TT: "#T Construction#!\n[tv_wonder_construction|e]는 4개의 [tv_wonder_construction_part|e]인 기초, 주요 구조, 기능 및 크라우닝을 한 번에 발전시킵니다. 위의 버튼을 사용하여 현재 제작 중인 부품을 전환하세요. \n[tv_wonder_construction|e]의 레벨은 가장 뒤에 있는 부품에 따라 달라집니다. 총 레벨은 뒤처진 부분이 새 유닛을 완료한 후에만 상승합니다. \n[tv_wonder_construction|e]가 하나 이상의 레벨을 완료한 후에 완료를 선언할 수 있습니다.\n따라서 먼저 소규모 프로젝트를 완료하고 이미 획득한 완료 보상을 잃지 않고 나중에 더 큰 규모로 확장할 수 있습니다.\n모든 건설 유닛을 완료하면 [tv_wonder_domestic_support|e]가 부여됩니다. 해당 유닛이 Great Project의 전체 레벨도 높이면 또 다른 [tv_wonder_domestic_support|e] 보너스를 부여합니다."
 TV_ENGINEERING_CEREMONY_CARD_TITLE: "[tv_wonder_ceremony|E]"
 TV_ENGINEERING_CEREMONY_LOCKED_TEXT: "[tv_wonder_construction|E]를 시작하려면 먼저 [tv_wonder_ceremony|e]를 완료해야 합니다."
 TV_ENGINEERING_CEREMONY_GENERIC_SECTION_TITLE: "@construction! 일반 불가사의"
 TV_ENGINEERING_CEREMONY_HELP_GENERIC_TEXT_1: "건설 후 하나의 [tv_wonder_ceremony|e] 스타일을 선택하고 불가사의의 최종 효과를 정의하기 위한 요구 사항을 충족합니다."
 TV_ENGINEERING_CEREMONY_UNIQUE_SECTION_TITLE: "@construction! 독특한 불가사의"
 TV_ENGINEERING_CEREMONY_HELP_UNIQUE_TEXT_1: "대부분의 [tv_wonder_unique|e]는 구성이 완료되면 자동으로 [tv_wonder_ceremony|e]를 시작하며 수동으로 선택할 스타일이 없습니다."
 TV_ENGINEERING_CEREMONY_HELP_UNIQUE_TEXT_2: "[tv_wonder_ceremony|e]는 8단계를 거쳐 몇 달에 한 번씩 자동으로 한 단계씩 진행됩니다. 각 단계마다 고유한 비용과 맛이 있습니다."
