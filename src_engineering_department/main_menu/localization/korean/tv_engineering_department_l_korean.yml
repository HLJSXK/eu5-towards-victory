 tv_wonder_collegiate_hall_desc: "대학헌장식에서 요구하는 특별한 대학강당입니다."
 tv_wonder_temple_school: "템플 스쿨"
 tv_wonder_temple_school_desc: "템플스쿨 의식에 요구되는 특별한 템플스쿨입니다."
 tv_wonder_canal_office: "운하 사무소"
