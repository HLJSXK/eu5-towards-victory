 tv_engineering_department.10.t: "[tv_great_engineer|E]:훌륭한 엔지니어가 사망했습니다"
 tv_engineering_department.10.d: "[tv_great_engineer|E]가 세상을 떠났습니다. 뉴스는 닫힌 도면 케이스를 통해 [tv_engineering_department|e]를 통해 이동하고 테이블 조사를 중단했으며 조수는 갑자기 마지막 분필 표시를 지우려고 하지 않았습니다. 모든 미완성 계획은 이제 어제보다 더 취약해 보입니다. 경이로운 메커니즘은 원장을 유지할 수 있지만 [tv_wonder_construction|e]는 야망을 순서대로 바꾸려면 살아있는 정신이 필요합니다. 후임자가 임명될 때까지 이 영역에는 돌과 노동력과 희망이 있지만 그들을 동의하게 할 마스터 빌더는 없습니다.\n\n#weak 위대한 엔지니어의 자리는 이제 공석입니다. 불가사의한 건설이 계속 진행되도록 가능한 한 빨리 엔지니어링 부서에 후임자를 임명하십시오.#!"
 tv_engineering_department.10.a: "계획이 무산되기 전에 후임자를 찾으세요."
 tv_engineering_department.20.t: "[tv_wonder_construction|E]：프로젝트 붕괴"
 tv_engineering_department.20.d: "[tv_wonder_domestic_support|e]의 예비량이 소진되었습니다. 한때 프로젝트를 칭찬했던 귀족들은 이제 다른 곳의 긴급한 사업을 기억하고, 부동산 대변인은 그들의 반대를 재발견하며, 공급업체는 다른 카트가 이동하기 전에 지불을 요구합니다. 방어할 수 없는 위대한 프로젝트로 인해 [tv_engineering_department|e]는 잠긴 경이로움을 버리고 치욕을 감수해야 합니다. 땅은 남아 있고, 초기 흔적도 남아 있으며, 돌도 일부 남아 있을 수 있지만 그 아래 정치적인 다리는 무너졌습니다. 침묵, 두려움, 지불되지 않은 약속 위에는 어떤 기념비도 세워질 수 없습니다.\n\n#weak 경이로움은 강제로 포기되었습니다. 엔지니어링 부서에서 현장과 계획을 재평가하고 언제든지 다시 시작할 수 있습니다.#!"
 tv_engineering_department.20.a: "부끄러움을 깨끗하게 기록하게 하소서."
 tv_engineering_department.30.t: "[tv_wonder_construction|E]: 디자인이 형태를 취합니다"
 tv_engineering_department.30.d: "[tv_great_engineer|E]는 거친 고도, 비용이 많이 드는 의심, 지형의 숨겨진 강점, 그리고 눈에 띄는 후회로 지워진 몇 가지 우아한 불가능성 등 첫 페이지를 가득 채웠습니다. 이 개념은 더 이상 워크숍의 분위기가 아닙니다. 법원이 비교하고 이의를 제기하고 최종적으로 선택할 수 있는 제안이 될 준비가 되어 있습니다.\n\n#weak 설계 개념이 준비되었습니다. 엔지니어링 부서로 가서 [tv_great_engineer|E]의 제안을 검토하고 이를 수락하거나 재검토하도록 요구한 다음 충분한 국내 지원을 구축하기 위해 경이로움에 대한 토론을 진행하십시오.#!"
 tv_engineering_department.30.a: "디자인을 보여주세요."
 tv_engineering_department.100.t: "[tv_wonder_debate|E]：귀족 집회"
 tv_engineering_department.100.d: "몇몇 귀족 가문은 이 불가사의가 왕국의 기억만큼 그들 자신의 기억도 확대할 것이라고 결정했습니다. 그들의 전령들은 조상의 지위, 불멸의 이름, 그리고 미래 세대가 사적인 영광과 공적인 목적을 혼동할 수 있는 유쾌한 가능성에 대해 이야기합니다. [tv_engineering_department|e]는 이를 수정하지 않습니다. 지원은 지원이며 [tv_wonder_domestic_support|e]는 종종 보석을 착용하고 도착합니다. 이제 그들의 목소리가 법정 전체에 유용한 볼륨으로 울려 퍼집니다."
 tv_engineering_department.100.a: "보여주세요."
 tv_engineering_department.101.t: "[tv_wonder_debate|E]：고귀한 백래시"
 tv_engineering_department.101.d: "그 불가사의는 충분한 명예를 돌려받지 못한 채 고귀한 특권을 소모할 것이라는 소문이 퍼졌습니다. 몇몇 집에서는 기념물의 미래의 화려함보다는 좌석, 면제, 노동자 및 의식의 우선권을 계산하기 시작했습니다. [tv_engineering_department|e]는 돌을 측정할 수 있지만 부상 순위는 조사하기가 더 어렵습니다. 귀족들 사이의 지지는 약해지고, 주저할 때마다 전체 프로젝트가 더 무거워지게 됩니다. 자존심은 대리석보다 가벼울 수 있지만 들어올리기는 훨씬 어렵습니다."
 tv_engineering_department.101.a: "그들의 자존심은 비싸다."
 tv_engineering_department.102.t: "[tv_wonder_debate|E]：버거는 기회를 본다"
 tv_engineering_department.102.d: "길드 마스터와 금융가는 계약, 도로, 창고 및 미래의 군중에 대해 이야기하기 시작합니다. 그들은 그 경이로움 속에서 웅장함뿐만 아니라 청구서, 운송권, 임대 방, 그리고 여전히 수수료를 징수하는 손주들을 봅니다. [tv_engineering_department|e]는 주의 깊게 귀를 기울입니다. 왜냐하면 상거래에는 야망을 현실적으로 만드는 재능이 있기 때문입니다. 그들의 열정은 논쟁에 새로운 추진력을 제공합니다. 번영은 잉크 묻은 손가락과 뛰어난 산술로 도래했습니다."
 tv_engineering_department.102.a: "번영에는 설득력 있는 목소리가 있습니다."
 tv_engineering_department.103.t: "[tv_wonder_debate|E]：상인은 비용을 계산합니다"
 tv_engineering_department.103.d: "일부 시민은 이제 그 경이로움이 노동력, 신용, 운송을 묶을 것이라고 경고합니다. 그들은 영광을 노골적으로 비난하지 않습니다. 그들은 단지 그 아래에 얼마나 많은 마차, 임금, 창고가 갇혀 있어야 하는지 묻습니다. 그러한 주의는 패닉보다 무시하기가 더 어렵습니다. 왜냐하면 모든 문장은 그럴듯한 숫자 열과 함께 도착하기 때문입니다. [tv_engineering_department|e]는 대중의 신뢰를 점점 시원하게 느낍니다. 원장은 큰 소리로 읽을 때 연설만큼 예리하게 감길 수 있습니다."
 tv_engineering_department.103.a: "원장은 연설만큼 날카롭게 상처를 입을 수 있습니다."
 tv_engineering_department.104.t: "[tv_wonder_debate|E]：성직축복"
 tv_engineering_department.104.d: "저명한 성직자들은 이 경이로움을 질서와 헌신의 눈에 보이는 표시로 삼았습니다. 설교에서는 측량된 돌을 순종하는 영혼에, 안정된 기초를 신실한 교리에, 공공 활동을 의로운 백성의 훈련에 비유합니다. [tv_engineering_department|e]는 엔지니어가 개인적으로 은유보다 수직선을 선호하는 경우에도 이 언어의 이점을 활용합니다. 토론은 엄숙하고 확신을 주는 어조로 진행됩니다. [tv_wonder_domestic_support|E]는 하늘이 비계를 승인하는 것처럼 보일 때 더 쉽게 일어납니다."
 tv_engineering_department.104.a: "유용한 축복입니다."
 tv_engineering_department.105.t: "[tv_wonder_debate|E]：과잉에 반대하는 설교"
 tv_engineering_department.105.d: "설교자들은 이 프로젝트가 돌로 된 허영심이라고 비난합니다. 그들은 배고픈 마을에 대리석이 필요한지, 통치자의 영혼이 높이에 따라 구원받을 수 있는지, 석공이 측량했기 때문에 자존심이 거룩해지는지 묻습니다. 이 요금은 이미 비용에 대해 불안해하는 청취자들을 찾습니다. [tv_engineering_department|e]는 많은 반대 의견에 답할 수 있지만 설교는 반론에도 살아남도록 만들어졌습니다. 믿음은 기초를 축복할 수도 있고 거부할 수도 있습니다."
 tv_engineering_department.105.a: "믿음은 대리석을 거부할 수도 있습니다."
 tv_engineering_department.200.t: "[tv_wonder_construction|E]：건설 유닛 완성"
 tv_engineering_department.200.d: "경이로움의 또 다른 부분이 눈에 보이는 한계점을 넘었습니다. 비계가 내려지고, 감독자들이 완성된 장치를 표시하고, 작업자들은 다음 작업도 마찬가지로 무겁다는 것을 아는 사람들의 조심스러운 자부심을 가지고 뒤로 물러납니다. 대중은 마침내 불가능이 돌, 들보, 수로, 둥근 천장이 되는 것을 보게 된다. 비평가들조차도 그림자를 드리우는 것을 조롱하는 것이 더 어렵다고 생각합니다. [tv_wonder_construction|E]는 진전뿐만 아니라 증거도 얻었습니다.\n\n#weak 이 건설 유닛은 완료되었습니다. 엔지니어링 부서는 불가사의의 다음 유닛을 향해 계속해서 나아갈 것입니다.#!"
 tv_engineering_department.200.a: "작업을 계속 진행하세요."
 tv_engineering_department.201.t: "[tv_wonder_construction|E]: 프로젝트 상승"
 tv_engineering_department.201.d: "[SCOPE.sLocation('tv_wonder_event_location').GetName]에서는 완성된 4개의 모듈이 해당 목적을 달성했습니다. 이제 그들의 임시 작업은 해체될 수 있으며, 마침내 보존된 경이로움 그 자체의 중심부에서 건설이 시작될 수 있습니다. 기초, 본체, 기능 및 왕관은 더 이상 경쟁하는 조각이 아닙니다. 그들은 하나의 기념물로 접힐 준비가 되어 있습니다.\n\n#weak 4개의 모듈이 불가사의의 핵심으로 병합되었습니다. 불가사의가 완성 수준에 도달하면 최종 건물이 자동으로 건설을 시작하므로 엔지니어링 부서 패널을 보십시오.#!"
 tv_engineering_department.201.a: "모듈을 분해하고 코어를 들어 올리세요."
 tv_engineering_department.202.t: "[tv_wonder_construction|E]:작업대 완성"
 tv_engineering_department.202.d: "[tv_engineering_department|E]는 건설 단계가 완료되었음을 선언했습니다. 작업장은 해체되고 작업 인력은 철수되며 마지막 계약자 원장은 회계사만이 누릴 수 있는 만족감으로 마무리됩니다. 이제 기념비는 서 있지만 돌만으로는 아직 운명이 아닙니다. 끝나지 않은 질문은 어떻게 만들 것인가에서 어떻게 봉헌할 것인가로 바뀌었다. 왕국은 몸을 만들었습니다. 이제 [tv_wonder_ceremony|e]는 대중의 영혼을 불러일으켜야 합니다.\n\n#weak 건설 단계가 완료되었습니다. 엔지니어링 부서를 방문하여 봉헌식 스타일을 선택하고 경이로운 행사를 시작하세요.#!"
 tv_engineering_department.202.a: "행사를 준비합니다."
 tv_engineering_department.202.a.tt: "작업 현장의 $tv_wonder_labor_camp$가 철거됩니다."
 tv_engineering_department.203.t: "[tv_wonder_construction|E]：논쟁은 해결되었습니다"
 tv_engineering_department.203.d: "법원은 원더 논쟁의 종료를 발표했습니다. 반대는 사라지지 않았지만 계산되고, 답변되고, 매수되거나 공식 계획에 포함되었습니다. 이제 프로젝트는 연설을 뒤로하고 지면, 도로, 경사, 거리 등 측정된 세계로 들어갑니다. [tv_great_engineer|e]는 조사할 사이트를 요청합니다. 이 시점부터 [tv_wonder_domestic_support|e]는 천천히 배수되므로 다음 순서는 실용적이어야 합니다. 기념비가 실제로 서 있을 수 있는 위치를 선택하십시오.\n\n#weak 토론이 끝났습니다. 엔지니어링 부서에서 경이로운 건설 현장을 선택하여 측량 및 건설을 시작하십시오.#!"
 tv_engineering_department.203.a: "설문조사를 시작하세요."
 tv_engineering_department.300.t: "[tv_wonder_survey|E]：설문조사 완료"
 tv_engineering_department.300.d_high: "[tv_wonder_survey|E]는 뛰어난 판독값으로 돌아왔습니다. 선택한 땅은 야망을 품을 수 있고, 보급품이 도달할 수 있으며, 첫 번째 영구 캠프가 건설되기 전에 작업 인력은 지형을 통과하는 경로를 확인합니다. [tv_great_engineer|e]는 숫자가 의심스럽기 때문이 아니라 좋은 소식이 검증될 가치가 있기 때문에 테이블을 두 번 읽습니다. 규모, 물류, 조직은 이제 같은 방향을 가리키고 있습니다. 이 사이트는 유용한 방식으로 어려워지기를 거의 열망하는 것 같습니다."
 tv_engineering_department.300.d_mid: "[tv_wonder_survey|E]는 사용 가능한 판독값을 반환합니다. 이 사이트는 작업을 수월하게 해주지는 않지만 정직하게도 그런 일을 약속한 적은 없습니다. 땅에는 한계가 있고 길에는 분위기가 있으며 노동 계획에는 로맨스보다는 규율이 필요합니다. 그럼에도 불구하고 [tv_engineering_department|e]는 이제 명명된 약점을 중심으로 계획을 세울 수 있습니다. 측정된 장애물은 이미 절반 정도 길들여졌습니다."
 tv_engineering_department.300.d_low: "[tv_wonder_survey|E]는 문제가 있는 판독값을 반환합니다. 해당 부지는 여전히 선언할 수 있지만 지도는 불안해 보이고 측량사는 전문적인 주의를 기울여 단어를 선택합니다. 지상, 경로 또는 노동 조직은 처음 예상했던 것보다 우리의 야망에 더 저항할 수 있습니다. [tv_engineering_department|e]는 다른 위치가 더 나은 결과를 제공할 수 있다고 경고합니다. 여기에서 진행하는 것은 눈을 뜨고 내리는 결정이 될 것이며, 이는 실명보다 낫고 자신감보다 더 많은 비용이 듭니다."
 tv_engineering_department.300.a: "결과를 검토합니다."
 tv_engineering_department.310.t: "[tv_wonder_survey|E]：숨겨진 기초"
 tv_engineering_department.310.d: "측량사는 제안된 작업 아래에 있는 안정된 땅과 오래된 돌을 찾아냅니다. 처음에는 단지 단단해 보였던 것이 이제 거의 준비된 것처럼 보입니다. 마치 잊혀진 손이 지구를 유용한 순서대로 떠난 것처럼 보입니다. [tv_wonder_survey|e] 팀은 부하, 깊이, 그리고 스스로 해결된 문제를 찾는 흔치 않은 즐거움에 대해 즐겁게 논쟁합니다. 불가사의의 가능한 규모는 처음 생각했던 것보다 더 관대해 보입니다. [tv_great_engineer|e]도 다른 측정을 요청하기 전에 미소를 지을 수 있습니다."
 tv_engineering_department.310.a: "훌륭해요."
 tv_engineering_department.311.t: "[tv_wonder_survey|E]: 위험한 대지"
 tv_engineering_department.311.d: "첫 번째 지도가 확실성을 약속했던 곳이 바뀌었습니다. 말뚝은 기울어지고 분필 선은 더 이상 서로 일치하지 않으며 조사원은 더 짧은 문장으로 말하기 시작합니다. 추가 지원으로 인해 불가사의의 실제 규모가 좁아질 것입니다. 이는 야망이 약화되었기 때문이 아니라 지구가 자체 조건으로 응답했기 때문입니다. [tv_engineering_department|e]는 계속 진행할 수 있습니다. 단순히 근거가 수동적인 척하는 것을 멈춰야 합니다."
 tv_engineering_department.311.a: "계획을 조정하세요."
 tv_engineering_department.312.t: "[tv_wonder_survey|E]：공급 라인 지우기"
 tv_engineering_department.312.d: "[tv_wonder_survey|E]는 예상보다 마찰이 적은 석재, 목재 및 도구를 운반할 수 있는 경로를 찾습니다. 방치된 도로는 사용 가능한 강 굽이로 연결되고, 집결지는 기억보다 더 넓으며, 현지 운송업자는 왕실 지도가 배우려고 애쓰지 않는 지름길을 이미 알고 있습니다. [tv_wonder_materials|E]는 땅이 몇 가지 조용한 호의를 베풀었기 때문에 더욱 깨끗하게 움직일 것입니다. 일단 물류는 고발로 도착하지 않습니다. 마진이 좋은 지도로 도착합니다."
 tv_engineering_department.312.a: "주의 깊게 표시하십시오."
 tv_engineering_department.313.t: "[tv_wonder_survey|E]：깨진 접근 방식"
 tv_engineering_department.313.d: "도로, 수로, 대기 장소는 처음 보고된 것보다 더 나쁜 것으로 드러났습니다. 도로가 있어야 할 곳에서 바퀴가 가라앉고, 보트가 물을 운반해야 할 곳에서 시간을 놓치고, 실제 마차가 진입하는 순간 집결지가 축소됩니다. 물류는 길들이기가 더 어려워질 것이며, [tv_wonder_materials|e]는 낙관론을 용서하지 않을 것입니다. [tv_engineering_department|e]는 이제 위대한 작품의 오래된 진실에 직면해 있습니다. 기념물은 돌이 닿기 오래 전에 시작됩니다. 때로는 진흙으로 시작되기도 합니다."
 tv_engineering_department.313.a: "보상해드리겠습니다."
 tv_engineering_department.314.t: "[tv_wonder_survey|E]：현장에서 주문"
 tv_engineering_department.314.d: "측정팀은 깔끔한 리듬으로 자리를 잡습니다. 깃발이 세워지고, 메모가 복사되고, 감독자들이 서로 모순되는 것을 멈추고, 대략적인 관찰은 미래의 노동자들이 실제로 따를 수 있는 시스템이 됩니다. 이것은 극적인 발견은 아니지만 하나보다 더 유용할 수 있습니다. [tv_wonder_construction|E]는 많은 사람들이 같은 일을 같은 순서로 하는 지루한 기적에 달려 있습니다. 오늘날, 그 기적이 가능해 보입니다."
 tv_engineering_department.314.a: "좋은 습관."
 tv_engineering_department.315.t: "[tv_wonder_survey|E]：설문조사 혼란"
 tv_engineering_department.315.d: "모순되는 지도와 라이벌 감독자들로 인해 작업 속도가 느려집니다. 한 승무원은 능선을 두고 다른 승무원은 도로를 두고 맹세하며, 세 번째 승무원은 모두가 즉시 불신할 정도로 정밀한 테이블을 제작했습니다. [tv_engineering_department|e]는 혼란이 일단 기록되면 거의 공식적으로 보이기 때문에 향후 조직 계획에 대한 자신감을 잃습니다. 불가사의는 나쁜 명령보다 나쁜 땅에서도 더 쉽게 살아남을 수 있습니다. 노동이 시작되기 전에 누군가 지도가 동의하도록 가르쳐야 합니다."
 tv_engineering_department.315.a: "그것을 풀어라."
 tv_engineering_department.320.t: "[tv_wonder_survey|E]:특수 장비 요청"
 tv_engineering_department.320.d: "측량사는 값비싼 도구와 전문 장인을 요청합니다. 그들은 일반적인 시력으로는 너무 미세한 각도, 추측하기에는 너무 민감한 토양 테스트, [tv_great_engineer|e]의 규모 평가가 고귀한 낙관주의에 덜 의존하게 만드는 측정에 대해 말합니다. 법원은 비용을 심리합니다. 엔지니어들은 정밀함을 듣습니다. 자금을 지원하면 설문조사가 개선되지만 향후 모든 요청자에게 정확성에는 대가가 따른다는 점을 가르쳐 줄 것입니다. 거절하면 낡은 도구는 제자리에 남게 되고 모르는 사람은 정중하게 미소를 지을 것입니다."
 tv_engineering_department.320.a: "정확성에 대한 비용을 지불하십시오."
 tv_engineering_department.320.b: "우리가 가진 것을 이용하세요."
 tv_engineering_department.321.t: "[tv_wonder_survey|E]: 전문 지식의 명성"
 tv_engineering_department.321.d: "[tv_great_engineer|E]는 논쟁의 여지가 있는 물류 방법을 공개적으로 뒷받침해 줄 것을 법원에 요청합니다. 이 제안은 [tv_wonder_materials|e]의 더 빠른 이동, 더 적은 유휴 작업자, 그리고 보수적인 감독자들이 목을 가다듬기 시작하게 만드는 바로 그 종류의 참신함을 약속합니다. 왕국의 명성을 빌려주는 것은 공급 계획을 더욱 설득력 있게 만들 수 있습니다. 실패하면 당황스러움도 공개된다. 훌륭한 프로젝트에서는 첫 번째 군중이 규칙을 이해하기 전에 주정부에 도박을 요청하는 경우가 많습니다."
 tv_engineering_department.321.a: "거기에 우리의 이름을 걸어보세요."
 tv_engineering_department.321.b: "공개 승인이 없습니다."
 tv_engineering_department.322.t: "[tv_wonder_survey|E]：길드 조정"
 tv_engineering_department.322.d: "도시 공급업체는 조사 기록을 표준화하는 데 도움을 줄 수 있지만 방해에 대한 양보를 기대합니다. 그들의 점원은 무게, 집계, 경로 및 하나의 목록을 다른 목록과 일치시키는 조용한 폭정을 이해합니다. [tv_engineering_department|e]는 특히 [tv_wonder_materials|e]가 본격적으로 움직이기 전에 해당 역량을 사용할 수 있습니다. 그러나 모든 양보는 기념물의 기억 속에 상업을 좀 더 깊이 새겨 넣습니다. 우리는 주문을 구매할 수 있지만 주문은 누가 판매했는지 기억합니다."
 tv_engineering_department.322.a: "길드에 기대세요."
 tv_engineering_department.322.b: "새로운 의무를 피하십시오."
 tv_engineering_department.401.t: "[tv_wonder_ceremony|E]：명상이 시작됩니다"
 tv_engineering_department.401.d: "완성된 경이로움은 침묵 속에 가려져 있습니다. 성직자, 기술자, 왕실 관찰자들은 1년간의 금욕 생활을 통해 기념물에 최종 의미를 부여할 수 있도록 일반적인 구경거리에서 물러났습니다. [tv_wonder_ceremony|e]는 소음이 아니라 고의적인 거부로 시작됩니다. [tv_engineering_department|e]조차도 인내심을 배워야 합니다. 어떤 계산도 자제력을 가르치기 위한 의식을 서두를 수 없기 때문입니다. 방문객들은 처음에는 조용함을 불안하게 여깁니다. 그러다가 그들은 이유를 이해하기도 전에 목소리를 낮추기 시작합니다."
 tv_engineering_department.401.a: "올해를 바꾸십시오."
 tv_engineering_department.410.t: "[tv_wonder_ceremony|E]：사절 요청"
 tv_engineering_department.410.d: "이웃 법원에서는 대축의 취임식을 지켜보기 위해 사절을 보내달라고 요청했습니다. 초대는 의례적인 것이지만, 의례는 국가가 기억되는 연습을 하는 곳이다. 참석자들은 새로운 기념물을 먼저 보고, 적절한 순간에 박수를 치고, 설명 없이도 메시지를 이해한 사람들 중에 우리의 이름을 올릴 것입니다. 거절하면 여정이 유지되고 이야기에서 그 자리를 잃게 됩니다. 일부 돌은 집에 지어졌습니다. 다른 사람들은 해외에서 증인을 기대합니다."
 tv_engineering_department.410.a: "사절을 보내십시오."
 tv_engineering_department.410.b: "초대를 거절하세요."
 tv_engineering_department.411.t: "[tv_wonder_ceremony|E]: 사절이 도착하다"
 tv_engineering_department.411.d: "초대 법원이 수락했습니다. 또 다른 외국 사절은 연습된 위엄, 여행하는 수행원, 위대함과 약점을 모두 알아보도록 훈련된 눈을 가지고 의식 행렬에 합류합니다. [tv_wonder_ceremony|e]는 각 외부 증인이 있을 때마다 더욱 설득력이 커집니다. 왜냐하면 다른 악센트로 반복될 때 영광이 더 커지기 때문입니다. 행렬 마스터는 입장 순서를 조정합니다. 서기관은 귀빈 목록을 조정합니다. 원더의 의식 진행은 한 번에 한 명씩 법정을 지켜보며 진행됩니다."
 tv_engineering_department.411.a: "명예롭게 받아들이십시오."
 tv_engineering_department.412.t: "[tv_wonder_ceremony|E]：초대 거절됨"
 tv_engineering_department.412.d: "초청된 법원은 사절 파견을 거부했습니다. 그들의 대답은 모욕을 당하지 않을 만큼 정중하고, 기억에 남을 만큼 차갑다. [tv_wonder_ceremony|e]는 다른 곳에서 청중을 찾아야 합니다. 왜냐하면 외국의 경외심을 추구하는 기념물은 빈 외교적 장소를 감당할 수 없기 때문입니다. 신하들은 이미 새로운 이름, 더 보기 좋은 경로, 요청처럼 들리지 않는 편지를 제안하고 있습니다. Glory는 거절을 싫어하지만 방향을 바꿀 수 있습니다."
 tv_engineering_department.412.a: "다른 이웃을 초대하세요."
 tv_engineering_department.421.t: "[tv_wonder_ceremony|E]：승리 퍼레이드가 시작됩니다"
 tv_engineering_department.421.d: "배너는 축을 따라 세워져 있지만 퍼레이드에는 아직 증거가 부족합니다. 북치는 사람은 연습을 할 수 있고, 말은 의례적인 발굽으로 돌을 갈 수 있고, 장교는 아름다운 자신감을 가질 수 있지만 그 어느 것도 승리가 아닙니다. [tv_wonder_ceremony|e]는 전쟁 자체가 인증해야 하는 승리를 요구합니다. 그때까지 군사 도시는 완전히 얻지 못한 명예를 위해 옷을 입습니다. 전쟁에서의 승리만이 기념물에 요구되는 기억을 선사할 것입니다."
 tv_engineering_department.421.a: "그러면 승리가 와야 합니다."
 tv_engineering_department.431.t: "[tv_wonder_ceremony|E]：시민 축제가 시작됩니다"
 tv_engineering_department.431.d: "도시는 1년 동안의 행사, 게임, 행렬 및 대중 교육을 위해 정해진 광장을 엽니다. 워크숍은 느리지만 사람들은 시민 규율을 걷고, 지켜보고, 익숙해질 때까지 불평함으로써 시민 규율의 형태를 배웁니다. [tv_wonder_ceremony|e]는 도시 공간을 탁 트인 하늘 아래 반복되는 교훈으로 바꿔줍니다. 아이들은 슬로건을 이해하기 전에 경로를 외웁니다. 시민의 수도는 순종을 축제로 만들어 순종을 가르치고 있습니다."
 tv_engineering_department.431.a: "시민들이 모여주세요."
 tv_engineering_department.461.t: "[tv_wonder_ceremony|E]：자유 무역 축제가 시작됩니다"
 tv_engineering_department.461.d: "상인, 사절, 중개인은 공개 교환을 약속하며 항구를 가득 채웁니다. 관대함은 항상 계좌가 폐쇄되기 전에 가장 고상해 보이기 때문에 한동안 수익이 줄어들게 됩니다. [tv_wonder_ceremony|e]는 부두, 창고, 혼잡한 테이블을 외국의 신뢰를 위한 무대로 바꿔줍니다. 공개적으로 서명된 모든 계약은 항구가 멀리 떨어져 있는 법원이 이해할 수 있는 언어로 말하도록 가르칩니다. 1년 동안은 이익이 줄어들기 때문에 명성은 지나갈 수 있습니다."
 tv_engineering_department.461.a: "부두를 열어보세요."
 tv_engineering_department.471.t: "[tv_wonder_ceremony|E]：조상 축제가 시작됩니다"
 tv_engineering_department.471.d: "묘지는 향, 족보, 신중한 애도의 해로 들어갑니다. 이름은 자신이 소유했던 몸보다 무거워질 때까지 낭독되고 작업장은 생산보다 기억이 우선시되는 동안 작업장이 느려집니다. [tv_wonder_ceremony|e]는 조상을 아키텍처로 취급하는 영역을 가르칩니다. 각 제물은 산 자가 명령받은 죽은 자의 지배를 받는다는 주장에 또 다른 돌을 세웁니다. 애도는 조직되면 권위가 됩니다."
 tv_engineering_department.471.a: "조상들이 모이게 하소서."
 tv_engineering_department.481.t: "[tv_wonder_ceremony|E]：내비게이터 길드 시작"
 tv_engineering_department.481.d: "조종사, 지도 제작자, 밧줄 마스터, 항만 직원이 등대 아래 길드홀을 측설합니다. 그들은 해도, 매듭, 우선권에 대한 다툼, 악천후에서도 해안선을 읽을 수 있는 사람들의 독특한 자신감을 가지고 도착합니다. 비컨은 기관이 세워질 때까지 완성되지 않습니다. 빛만이 배들에게 경고를 줍니다. 길드는 국가에 경고를 이해하는 방법을 가르칩니다. [tv_wonder_ceremony|e]는 이제 소금을 뿌리며 관료주의를 기다립니다."
 tv_engineering_department.481.a: "길드를 구축하세요."
 tv_engineering_department.491.t: "[tv_wonder_ceremony|E]：물 축제가 시작됩니다"
 tv_engineering_department.491.d: "수로에는 화환이 장식되고 수문이 축복되며 작업장은 1년간의 물 의식을 위해 조용해집니다. 물은 순종적으로 보이도록 만들어졌습니다. 홍수를 지켜본 사람이라면 누구나 이것이 대담한 신학적 주장임을 알고 있습니다. 생산이 중단되어 단지가 [tv_wonder_ceremony|e]를 통해 신성한 질서를 요구할 수 있습니다. 엔지니어는 사제가 검사하고 싶은 것을 축복하는 것을 지켜보고, 사제는 엔지니어가 성화하고 싶은 것을 측정하는 것을 지켜봅니다. 그 사이에는 물이 계속해서 움직인다."
 tv_engineering_department.491.a: "물의 방향을 바꾸십시오."
 tv_engineering_department.501.t: "[tv_wonder_ceremony|E]：심층 배수 시작"
 tv_engineering_department.501.d: "엔지니어들은 광산 도시 아래로 배수 작업을 진행합니다. 펌프, 버팀대, 채널이 깊이를 정복하는 동안 샤프트는 1년 동안 거의 조용할 것입니다. 광부들은 물만큼이나 조용함을 싫어하지만 더 깊은 부를 얻으려면 둘 다 견뎌야 합니다. 여기 [tv_wonder_ceremony|e]는 부드럽지 않습니다. 그것은 어둠과 습기, 그리고 인내심을 가지고 거래하는 것입니다. 마침내 작품이 숨을 쉴 때, 도시는 자신이 얼마나 두려움 아래까지 도달할 수 있는지 알게 될 것입니다."
 tv_engineering_department.501.a: "어둠을 비우세요."
 tv_engineering_department.511.t: "[tv_wonder_ceremony|E]: 스타 카탈로그 시작"
 tv_engineering_department.511.d: "전망대는 램프, 테이블, 절제된 불면증 주위로 닫혀 있습니다. 천문학자들은 산란된 빛이 아니라 미래의 학자들이 테스트할 수 있는 공공 질서의 항목으로 별 하나하나를 표시합니다. 법원이 하늘과 도구에 관심을 기울이는 동안 입법이 느려집니다. [tv_wonder_ceremony|e]는 오늘 광경으로 끝나지 않을 것입니다. 그것은 하늘이 유용하게 될 만큼 충분한 인내심을 가지고 복사될 때 끝날 것입니다."
 tv_engineering_department.511.a: "하늘을 셀 수 있게 해주세요."
 tv_engineering_department.521.t: "[tv_wonder_ceremony|E]：이클립스 선언이 시작됩니다"
 tv_engineering_department.521.d: "천문대는 일식이 올 것이며 두려움이 먼저 이름을 짓기 전에 법원이 이름을 정할 준비가 되어 있을 것이라는 예측을 발표했습니다. 이제 사제, 학자, 선원, 회의론자들은 모두 서로 다른 희망을 품고 위를 바라보고 있습니다. 통과하는 매달 청구서를 테스트합니다. 하늘이 테이블에 복종한다면 [tv_wonder_ceremony|e]는 왕국이 항복하지 않고도 천국을 읽을 수 있다는 증거가 될 것입니다."
 tv_engineering_department.521.a: "하늘을 조심하세요."
 tv_engineering_department.522.t: "[tv_wonder_ceremony|E]: 이클립스의 도착"
 tv_engineering_department.522.d: "빛은 천문대가 말한 곳에서 정확하게 변합니다. 군중은 침묵하지만 그 침묵은 당황한 것이 아니다. 외치는 사람들은 배운 테이블이 예언한 것을 이미 그들에게 말했습니다. [tv_wonder_ceremony|e]는 태양, 그림자, 호흡 사이의 공간에서 대중의 확실성이 됩니다. 빛이 돌아올 때, 법원은 단지 지혜만을 주장하지 않습니다. 그것은 타이밍, 용기, 그리고 경이로움 그 자체의 명령을 보여주었습니다."
 tv_engineering_department.522.a: "영역이 예측을 기억하게 하세요."
 tv_engineering_department.531.t: "[tv_wonder_ceremony|E]：공물 받음"
 tv_engineering_department.531.d: "또 다른 주제 기여는 국가 궁전에 들어갑니다. 부(富)뿐만 아니라 홀을 통과하는 모든 사절에게 계급에 대한 논쟁이 눈에 띄게 표시됩니다. 공물 갤러리는 건축물이 있을 때 영광과 마찬가지로 종속도 믿기 쉬워지기 때문에 각각의 헌금을 통해 더욱 설득력이 커집니다. 이 의식은 한 번에 하나의 측정된 순종 행위를 진행합니다."
 tv_engineering_department.531.a: "추모를 기록합니다."
 tv_engineering_department.541.t: "[tv_wonder_ceremony|E]：대사관 구역 시작"
 tv_engineering_department.541.d: "재단은 국가 궁전 옆에 있는 대사관 구역으로 표시되어 있습니다. 외국 가옥에는 문, 안뜰, 하인의 통로, 외교를 가끔씩 방문하는 것이 아니라 매일의 존재로 만드는 모든 작고 실용적인 위엄이 있게 될 것입니다. [tv_wonder_ceremony|e]는 이제 다른 법원이 거주할 수 있도록 건설된 구역을 기다립니다. 궁전은 관심을 끌 수 있습니다. 대사관 구역은 머무르는 것에 대한 관심을 가르칩니다."
 tv_engineering_department.541.a: "외국인의 눈을 위한 장소를 만드세요."
 tv_engineering_department.500.t: "[tv_wonder_ceremony|E]：프로젝트 개시"
 tv_engineering_department.500.d: "[tv_engineering_department|E]는 [tv_wonder_ceremony|e]를 완성했으며 이제 이 기념비는 왕국의 야망을 상징하는 영구적인 상징으로 서 있습니다. 비계는 사라지고 장부는 봉인되었으며 대중은 엔지니어가 완료할 수 없는 작업, 즉 경이로움의 의미를 결정하는 작업을 시작했습니다. 어떤 사람들은 그것을 영광이라고 부르고, 어떤 사람들은 과잉이라고 부르고, 어떤 사람들은 시대가 변했다는 증거라고 부를 것입니다. 그들 모두는 그것을 봐야 할 것입니다. 그것은 이미 승리의 형태입니다."
 tv_engineering_department.500.a: "나이가 그것을 기억하게하십시오."
 tv_engineering_department.600.t: "[tv_wonder_construction|E]:세계의 불가사의가 완성되었습니다"
 tv_engineering_department.600.d: "[SCOPE.sCountry('tv_wonder_builder_country').GetName]에서 뉴스가 도착했습니다. [SCOPE.sLocation('tv_wonder_completed_site').GetName]에서 세계의 불가사의가 완성되었습니다. 보고서마다 비용, 아름다움, 목적, 지혜가 다르지만 한 가지 점에서는 일치합니다. 작업이 너무 커서 로컬에 남아 있을 수 없습니다. 그것은 통치자들의 일반적인 대화에 들어갔습니다."
 tv_engineering_department.600.a: "세상이 들었습니다."

