 tv_engineering_department_standalone.1.t: "[tv_wonder_construction|E]：엔지니어링 부서"
 tv_engineering_department_standalone.1.d: "귀하의 국가에는 이제 수행할 수 있는 모든 위대한 프로젝트를 뒷받침하는 기관인 엔지니어링 부서가 있습니다. \n\n시작하려면 위대한 엔지니어를 임명하세요. 먼저 실행 가능한 프로젝트를 위해 #high Conception#!를 개발한 다음 법원에서 국내 #high Debate#!에 무게를 둡니다. #high Survey#!는 선택한 부지를 확인한 다음 #high Construction#! 자체가 시작되어 4개 부분을 통해 프로젝트를 최종 수준으로 높입니다. 완료는 지속적인 보상을 제공하는 #high Ceremony#!로 표시됩니다.\n\n언제든지 엔지니어링 부서 패널을 열어 진행 상황을 확인하거나 훌륭한 엔지니어를 임명하세요."
 tv_engineering_department_standalone.1.a: "이해했습니다."
 tv_engineering_department_standalone.1.a.tt: "#G 엔지니어링부#!를 설립합니다."
