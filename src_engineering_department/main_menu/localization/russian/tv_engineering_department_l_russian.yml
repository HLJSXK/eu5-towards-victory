 TV_ENGINEERING_CEREMONY_HELP_GENERIC_TEXT_1: "После строительства выберите один стиль [tv_wonder_ceremony|e] и удовлетворите его требования, чтобы определить окончательный эффект чуда."
 TV_ENGINEERING_CEREMONY_UNIQUE_SECTION_TITLE: "@construction! Уникальные чудеса"
 TV_ENGINEERING_CEREMONY_HELP_UNIQUE_TEXT_1: "Большинство [tv_wonder_unique|e] начинают свой [tv_wonder_ceremony|e] автоматически после завершения строительства, без необходимости выбора стиля вручную."
 TV_ENGINEERING_CEREMONY_HELP_UNIQUE_TEXT_2: "[tv_wonder_ceremony|e] проходит через 8 этапов, автоматически переходя на один этап каждые несколько месяцев; каждый этап имеет свою стоимость и вкус."
