 TV_ENGINEERING_CONSTRUCTION_PROGRESS_TT: "Каждое устройство [tv_wonder_construction_part|e] использует прогресс [tv_wonder_construction|e] из [tv_engineering_department|e]. Требования к модулю настраиваются через меню модов сообщества; Малые, средние и большие требования по умолчанию — 100 000, 200 000 и 300 000 прогресса."
 TV_ENGINEERING_CONSTRUCTION_NO_ACTIVE_SITE_TEXT: "Нет активного рабочего места."
 TV_ENGINEERING_CONSTRUCTION_REMAINING_TEXT: "Ожидается, что при нынешней скорости этому чудо-блоку потребуется [Country.MakeScope.GetVariable('tv_wonder_remaining_years').GetValue|0] лет и [Country.MakeScope.GetVariable('tv_wonder_remaining_months_mod').GetValue|0] месяцев."
 TV_ENGINEERING_CONSTRUCTION_PERCENT_TEXT: "[Country.MakeScope.GetVariable('tv_wonder_construction_progress_pct').GetValue|0]%/100%"
