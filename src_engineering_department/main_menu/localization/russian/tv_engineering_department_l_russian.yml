 TV_ENGINEERING_SOLUTION_BURGHERS_11: "Решение: потерять одного случайного исполнителя."
 TV_ENGINEERING_DEMAND_BURGHERS_12: "Бюргеры требуют продать или уничтожить произведение искусства, чтобы поддержать доверие."
 TV_ENGINEERING_SOLUTION_BURGHERS_12: "Решение: потерять одно случайное произведение искусства."
 TV_ENGINEERING_DEMAND_CLERGY: "Духовенство требует религиозной легитимности."
 TV_ENGINEERING_SOLUTION_CLERGY: "Решение: спонсировать богословское одобрение проекта."
 TV_ENGINEERING_DEMAND_CLERGY_1: "Прежде чем благословить начинание, духовенство требует формальной привилегии."
 TV_ENGINEERING_SOLUTION_CLERGY_1: "Решение: предоставить Духовенству случайную привилегию доступного поместья."
 TV_ENGINEERING_DEMAND_CLERGY_2: "Духовенство требует налоговых льгот для учреждений, которые освятят эту работу."
 TV_ENGINEERING_SOLUTION_CLERGY_2: "Решение: снизить максимальную налоговую нагрузку для духовенства на 5 лет."
 TV_ENGINEERING_DEMAND_CLERGY_3: "Духовенство требует меньше налоговых обязательств, пока их дома поддерживают обряды."
 TV_ENGINEERING_SOLUTION_CLERGY_3: "Решение: сократить поборные обязательства духовенства на 5 лет."
 TV_ENGINEERING_DEMAND_CLERGY_4: "Духовенство требует приближения политики к их доктрине."
 TV_ENGINEERING_SOLUTION_CLERGY_4: "Решение: принять случайную доступную политику, которую предпочитает духовенство, теряя стабильность."
 TV_ENGINEERING_DEMAND_CLERGY_5: "Духовенство требует престижного акта благочестия, прежде чем благословить работу."
 TV_ENGINEERING_SOLUTION_CLERGY_5: "Решение: потерять престиж #N 10#!."
 TV_ENGINEERING_DEMAND_CLERGY_6: "Духовенство требует обрядов и освобождений, нарушающих общественный порядок."
 TV_ENGINEERING_SOLUTION_CLERGY_6: "Решение: потерять #N 7#! стабильность."
 TV_ENGINEERING_DEMAND_CLERGY_7: "Духовенство требует публичной уступки священному достоинству правителя."
 TV_ENGINEERING_SOLUTION_CLERGY_7: "Решение: потерять #N 5#! легитимность."
 TV_ENGINEERING_DEMAND_CLERGY_8: "Духовенство требует, чтобы светские имения смирились перед благословением."
 TV_ENGINEERING_SOLUTION_CLERGY_8: "Решение: Дворяне и горожане теряют #N 5%#! удовлетворение."
 TV_ENGINEERING_DEMAND_CLERGY_9: "Духовенство требует пожертвований, которые будут способствовать инфляции."
 TV_ENGINEERING_SOLUTION_CLERGY_9: "Решение: получить #N 2,5% #! инфляции."
 TV_ENGINEERING_DEMAND_CLERGY_10: "Духовенство требует отстранения неподходящего члена кабинета министров."
 TV_ENGINEERING_SOLUTION_CLERGY_10: "Решение: удалить одного случайного члена кабинета министров."
 TV_ENGINEERING_DEMAND_CLERGY_11: "Духовенство требует отстранения художника, обвиненного в тщеславии."
 TV_ENGINEERING_SOLUTION_CLERGY_11: "Решение: потерять одного случайного исполнителя."
 TV_ENGINEERING_DEMAND_CLERGY_12: "Духовенство требует отдать произведение искусства за священное дело."
 TV_ENGINEERING_SOLUTION_CLERGY_12: "Решение: потерять одно случайное произведение искусства."
