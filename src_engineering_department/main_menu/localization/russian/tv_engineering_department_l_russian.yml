 TV_WONDER_FINAL_LEVEL_REWARD_TT: "Поскольку мы завершили уровень [ROOT.GetVariable('tv_wonder_level').GetValue|0] Great Project, мы получаем:"
 TV_WONDER_FINAL_SUPPORT_REWARD_TT: "Поскольку у нас осталась внутренняя поддержка [ROOT.GetVariable('tv_wonder_final_support_reward_source').GetValue|0], мы получаем:"
 tv_engineering_department.10.t: "[tv_great_engineer|E]: Великий инженер умер"
 tv_engineering_department.10.d: "Наш [tv_great_engineer|E] скончался. Новости перемещаются по [tv_engineering_department|e] через закрытые ящики для рисования, прекращение просмотра столов и помощники, внезапно отказывающиеся стирать последние пометки мелом. Каждый незавершенный план сегодня выглядит более хрупким, чем вчера. Чудо-механизм может сохранить свои бухгалтерские книги, но [tv_wonder_construction|e] нужен живой разум, чтобы превратить амбиции в последовательность. Пока не назначен преемник, в королевстве есть камень, труд и надежда, но нет мастера-строителя, который мог бы заставить их согласиться.\n\n#weak Позиция Великого Инженера теперь вакантна — назначьте преемника в Инженерном департаменте как можно скорее, чтобы строительство чуда продолжалось.#!"
 tv_engineering_department.10.a: "Найдите преемника, прежде чем планы остынут."
 tv_engineering_department.20.t: "[tv_wonder_construction|E]:Проект терпит крах"
 tv_engineering_department.20.d: "Запас [tv_wonder_domestic_support|e] исчерпан. Придворные, которые когда-то хвалили проект, теперь вспоминают неотложные дела в других местах, представители недвижимости вновь обнаруживают свои возражения, а поставщики требуют оплаты до того, как уедет еще одна тележка. Поскольку великий проект неоправдан, [tv_engineering_department|e] должен покинуть запертое чудо и снести позор. Земля осталась, первые следы остались и, возможно, остались некоторые камни, но политический мост под ними рухнул. Ни один памятник не может стоять на молчании, страхе и неоплаченных обещаниях.\n\n#weak Чудо было насильственно заброшено — вы можете переоценить место и планы в Инженерном отделе и начать заново в любое время.#!"
 tv_engineering_department.20.a: "Пусть стыд будет записан чисто."
 tv_engineering_department.30.t: "[tv_wonder_construction|E]:Дизайн обретает форму"
 tv_engineering_department.30.d: "[tv_great_engineer|E] заполнил первые страницы: грубые возвышения, стоимостные сомнения, скрытые преимущества местности и несколько элегантных невозможностей, вычеркнутых с видимым сожалением. Концепция больше не является настроением в мастерской. Он готов стать предложением, которое суд сможет сравнить, оспорить и, наконец, выбрать. \n\n#weak Концепция проекта готова — обратитесь в инженерный отдел, чтобы рассмотреть предложение [tv_great_engineer|E], приняв его или потребовав переосмыслить его, а затем продолжить обсуждение чуда, чтобы заручиться достаточной внутренней поддержкой.#!"
 tv_engineering_department.30.a: "Покажите нам дизайны."
 tv_engineering_department.100.t: "[tv_wonder_debate|E]: Митинг благородных домов"
 tv_engineering_department.100.d: "Несколько благородных домов решили, что это чудо прославит их собственную память так же, как и память всего королевства. Их глашатаи говорят о местах предков, бессмертных именах и приятной возможности того, что будущие поколения могут спутать частную славу с общественными целями. [tv_engineering_department|e] не исправляет их. Поддержка есть поддержка, а [tv_wonder_domestic_support|e] часто приходит в украшениях. Их голоса теперь звучат в суде с полезной громкостью."
 tv_engineering_department.100.a: "Пусть их увидят."
 tv_engineering_department.101.t: "[tv_wonder_debate|E]:Благородный люфт"
 tv_engineering_department.101.d: "Распространились слухи, что это чудо поглотит благородные привилегии, не вернув достаточной чести. Некоторые дома начали рассчитывать не на будущее великолепие памятника, а на места, льготы, работников и церемониальное старшинство, которое им может стоить. [tv_engineering_department|e] может измерять камни, но раненых сложнее обследовать. Поддержка среди аристократии ослабевает, и каждое колебание усложняет весь проект. Гордость может быть легче мрамора, но поднять ее гораздо труднее."
 tv_engineering_department.101.a: "Их гордость дорого обходится."
 tv_engineering_department.102.t: "[tv_wonder_debate|E]：Бюргеры видят возможности"
 tv_engineering_department.102.d: "Мастера гильдий и финансисты начинают говорить о контрактах, дорогах, складах и будущих толпах. Они видят в чуде не только великолепие, но и счета, права на транспорт, арендованные комнаты и внуков, все еще собирающих плату. [tv_engineering_department|e] внимательно слушает, потому что коммерция имеет талант придавать амбициям практичность. Их энтузиазм придает дебатам новый импульс. Процветание пришло с испачканными чернилами пальцами и отличной арифметикой."
 tv_engineering_department.102.a: "У процветания убедительный голос."
 tv_engineering_department.103.t: "[tv_wonder_debate|E]: Торговцы подсчитывают стоимость"
 tv_engineering_department.103.d: "Некоторые горожане теперь предупреждают, что чудо свяжет труд, кредит и транспорт. Они не осуждают славу прямо; они просто спрашивают, сколько повозок, заработной платы и складов должно оказаться под ним. Такую осторожность труднее игнорировать, чем панику, поскольку каждое предложение сопровождается правдоподобным столбцом цифр. [tv_engineering_department|e] чувствует, что общественное доверие постепенно падает. Леджеры могут ранить так же остро, как и речи, если их читать вслух."
 tv_engineering_department.103.a: "Бухгалтерские книги могут ранить так же остро, как и речи."
 tv_engineering_department.104.t: "[tv_wonder_debate|E]: Благословение священника"
 tv_engineering_department.104.d: "Выдающиеся священнослужители считают это чудо видимым знаком порядка и преданности. В проповедях отмеренный камень сравнивается с послушными душами, прочные основания — с верным учением, а общественный труд — с дисциплиной праведных людей. [tv_engineering_department|e] извлекает выгоду из этого языка даже тогда, когда инженеры в частном порядке предпочитают отвесы метафорам. Дебаты приобретают торжественный, обнадеживающий тон. [tv_wonder_domestic_support|E] поднимается легче, когда кажется, что небеса одобряют строительные леса."
 tv_engineering_department.104.a: "Полезное благословение."
 tv_engineering_department.105.t: "[tv_wonder_debate|E]：Проповеди против излишеств"
 tv_engineering_department.105.d: "Проповедники осуждают проект как тщеславие, облаченное в камень. Они спрашивают, нужен ли мрамор голодной деревне, может ли высота спасти душу правителя и становится ли гордость святой только потому, что ее измерил каменщик. Это обвинение находит слушателей среди тех, кто уже обеспокоен ценой. [tv_engineering_department|e] может ответить на многие возражения, но проповеди созданы для того, чтобы выдерживать контраргументы. Вера может благословить основания, а может и отвергнуть их."
 tv_engineering_department.105.a: "Вера также может отказаться от мрамора."
 tv_engineering_department.200.t: "[tv_wonder_construction|E]: Строительный блок завершен."
 tv_engineering_department.200.d: "Еще одна часть чуда пересекла видимый порог. Спускаются строительные леса, надсмотрщики отмечают законченный объект, а рабочие отступают с осторожной гордостью людей, знающих, что следующая задача будет такой же тяжелой. Публика наконец-то может увидеть, что невозможное становится камнем, балкой, каналом или сводом. Даже критикам труднее высмеивать то, что отбрасывает тень. [tv_wonder_construction|E] добился не только прогресса, но и доказательств.\n\n#weak Этот строительный блок завершен — Инженерный отдел продолжит работу над следующим блоком чуда.#!"
 tv_engineering_department.200.a: "Продолжайте работу."
 tv_engineering_department.201.t: "[tv_wonder_construction|E]:Проект набирает обороты"
 tv_engineering_department.201.d: "В [SCOPE.sLocation('tv_wonder_event_location').GetName] четыре готовых модуля выполнили свою задачу. Их временные сооружения теперь можно разобрать и наконец начать строительство на сохранившемся ядре самого чуда. Основание, тело, функция и венец больше не являются конкурирующими фрагментами; их можно сложить в единый памятник.\n\n#weak Четыре модуля объединились в ядро чуда — следите за панелью инженерного отдела: строительство последнего здания начнется автоматически, как только чудо достигнет уровня завершения.#!"
 tv_engineering_department.201.a: "Разберите модули и поднимите ядро."
 tv_engineering_department.202.t: "[tv_wonder_construction|E]:Рабочие стенды завершены"
 tv_engineering_department.202.d: "[tv_engineering_department|E] объявил этап строительства завершенным. Рабочие площадки демонтируются, рабочие бригады уходят, а последние бухгалтерские книги подрядчиков закрываются с удовлетворением, которое по-настоящему нравится только бухгалтерам. Памятник сейчас стоит, но один только камень – это еще не судьба. Незаконченный вопрос изменился с того, как его построить, на то, как его освятить. Царство создало тело; [tv_wonder_ceremony|e] теперь должен придать ему публичную душу. \n\n#weak Этап строительства завершен — посетите инженерный отдел, чтобы выбрать стиль церемонии посвящения и начать церемонию чуда.#!"
 tv_engineering_department.202.a: "Подготовьте церемонию."
 tv_engineering_department.202.a.tt: "$tv_wonder_labor_camp$ на строительной площадке будет снесен."
 tv_engineering_department.203.t: "[tv_wonder_construction|E]：Дисбаты исчерпаны"
 tv_engineering_department.203.d: "Суд объявил об окончании дебатов о чудесах. Оппозиция не исчезла, но ее подсчитали, ответили, подкупили или включили в официальный план. Теперь проект оставляет речи позади и входит в размеренный мир земли, дорог, уклонов и расстояний. [tv_great_engineer|e] запрашивает место для опроса. С этого момента [tv_wonder_domestic_support|e] будет медленно осушаться, поэтому следующий приказ должен быть практичным: выберите, где на самом деле может стоять памятник. \n\n#weak Дебаты закончились — выберите строительную площадку для чуда в Инженерном департаменте, чтобы начать изыскания и строительство.#!"
 tv_engineering_department.203.a: "Начните опрос."
 tv_engineering_department.300.t: "[tv_wonder_survey|E]: Опрос завершен"
 tv_engineering_department.300.d_high: "[tv_wonder_survey|E] возвращается с отличными показаниями. Выбранное место может быть амбициозным, туда могут доставляться припасы, а рабочие бригады видят путь через местность до того, как будет возведен первый постоянный лагерь. [tv_great_engineer|e] дважды читает таблицы не потому, что цифры сомнительны, а потому, что хорошие новости заслуживают проверки. Масштаб, логистика и организация теперь указывают в одном направлении. Кажется, что сайт почти стремится стать трудным в полезных отношениях."
 tv_engineering_department.300.d_mid: "[tv_wonder_survey|E] возвращается с пригодными для использования показаниями. Сайт не облегчит работу, но ни одно чудо не обещало этого. У земли есть пределы, у дорог есть настроение, а трудовой план потребует скорее дисциплины, чем романтики. Тем не менее, [tv_engineering_department|e] теперь может планировать действия, обходя указанные им недостатки. Размеренное препятствие уже наполовину приручено."
 tv_engineering_department.300.d_low: "[tv_wonder_survey|E] возвращается с тревожными показаниями. Об этом месте еще можно объявить, но карты выглядят нервными, а геодезисты подбирают слова с профессиональной тщательностью. Земля, маршруты или организация труда могут противостоять нашим амбициям больше, чем ожидалось. [tv_engineering_department|e] предупреждает, что другое место может послужить чуду лучше. Продолжить здесь было бы решением, принятым с открытыми глазами, что лучше слепоты и дороже уверенности."
 tv_engineering_department.300.a: "Просмотрите результат."
 tv_engineering_department.310.t: "[tv_wonder_survey|E]: Скрытые фундаменты"
 tv_engineering_department.310.d: "Геодезисты обнаруживают устойчивую почву и старый камень под предполагаемыми работами. То, что сначала казалось просто твердым, теперь кажется почти подготовленным, как будто чья-то забытая рука оставила землю в полезном порядке. Команды [tv_wonder_survey|e] радостно спорят о нагрузке, глубине и редком удовольствии найти проблему, которая разрешилась сама собой. Возможный масштаб чуда выглядит более масштабным, чем предполагалось вначале. Даже [tv_great_engineer|e] позволяет улыбнуться, прежде чем попросить провести еще одно измерение."
 tv_engineering_department.310.a: "Отлично."
 tv_engineering_department.311.t: "[tv_wonder_survey|E]: Коварная земля"
 tv_engineering_department.311.d: "Ситуация меняется там, где первые карты обещали определенность. Ставки тощие, меловые линии больше не согласуются друг с другом, а геодезические бригады начинают говорить более короткими предложениями. Дополнительная поддержка сузит практический масштаб чуда не потому, что амбиции ослабли, а потому, что земля ответила собственными условиями. [tv_engineering_department|e] все еще может продолжить работу. Он должен просто перестать притворяться, будто земля пассивна."
 tv_engineering_department.311.a: "Скорректируйте планы."
 tv_engineering_department.312.t: "[tv_wonder_survey|E]: Очистить линии снабжения"
 tv_engineering_department.312.d: "[tv_wonder_survey|E] находит маршруты, по которым можно перевозить камни, древесину и инструменты с меньшим трением, чем ожидалось. Заброшенная дорога соединяется с пригодным для использования излучиной реки, плацдарм оказывается шире, чем можно вспомнить, а местные перевозчики уже знают кратчайшие пути, которые ни одна королевская карта не удосужилась изучить. [tv_wonder_materials|E] будет двигаться более аккуратно, потому что земля оказала ему несколько тихих услуг. Логистика на этот раз не является обвинением. Он поставляется в виде карты с хорошими полями."
 tv_engineering_department.312.a: "Тщательно отметьте их."
 tv_engineering_department.313.t: "[tv_wonder_survey|E]：Неверные подходы"
 tv_engineering_department.313.d: "Дороги, водные пути и плацдармы оказались хуже, чем утверждалось в первых отчетах. Колеса тонут там, где должна держаться дорога, лодки теряют время там, где должна нести воду, а плацдармы сжимаются в тот момент, когда на них въезжают настоящие повозки. Логистику будет сложнее приручить, и [tv_wonder_materials|e] не простит оптимизма. [tv_engineering_department|e] теперь сталкивается со старой истиной великих произведений: памятник начинается задолго до того, как до него доходит камень. Иногда все начинается с грязи."
 tv_engineering_department.313.a: "Мы компенсируем."
 tv_engineering_department.314.t: "[tv_wonder_survey|E]：Порядок на местах"
 tv_engineering_department.314.d: "Измерительные бригады вошли в чистый ритм. Устанавливаются флажки, копируются записи, контролеры перестают противоречить друг другу, а грубые наблюдения становятся системой, которой действительно могут подчиняться будущие работники. Это не драматическое открытие, но оно может быть более полезным, чем одно. [tv_wonder_construction|E] зависит от скучного чуда, когда множество людей делают одно и то же в одном и том же порядке. Сегодня это чудо кажется возможным."
 tv_engineering_department.314.a: "Хорошая привычка."
 tv_engineering_department.315.t: "[tv_wonder_survey|E]: Путаница в опросе"
 tv_engineering_department.315.d: "Противоречивые карты и конкурирующие надзиратели замедляют работу. Одна бригада верит в гребень, другая в дорогу, а третья составила настолько точную таблицу, что все сразу ей не доверяют. [tv_engineering_department|e] теряет уверенность в своем будущем плане организации, потому что путаница, однажды записанная, выглядит почти официальной. Чуду легче пережить плохую почву, чем плохое командование. Прежде чем начнутся роды, кто-то должен научить карты согласовываться."
 tv_engineering_department.315.a: "Распутайте это."
 tv_engineering_department.320.t: "[tv_wonder_survey|E]: Требуются специальные инструменты"
 tv_engineering_department.320.d: "Геодезистам требуются дорогостоящие инструменты и специалисты-ремесленники. Они говорят об углах, слишком тонких для обычного зрения, анализах почвы, слишком тонких для догадок, и об измерениях, которые сделают оценку масштаба [tv_great_engineer|e] менее зависимой от благородного оптимизма. Суд заслушивает расходы; инженеры слышат точность. Их финансирование должно улучшить качество опроса, но оно также научит каждого будущего запрашивающего, что точность имеет свою цену. Отказ оставляет старые инструменты на месте, а неизвестных вежливо улыбается."
 tv_engineering_department.320.a: "Платите за точность."
 tv_engineering_department.320.b: "Обойдемся тем, что имеем."
 tv_engineering_department.321.t: "[tv_wonder_survey|E]: Престиж экспертизы"
 tv_engineering_department.321.d: "[tv_great_engineer|E] просит суд публично поддержать спорный метод логистики. Предложение обещает более быстрое перемещение [tv_wonder_materials|e], меньшее количество простаивающих рабочих и именно такое новшество, которое заставляет консервативных надзирателей начать откашляться. Повышение престижа королевства может сделать план снабжения более убедительным. Если это не удастся, позор также будет публичным. Великие проекты часто требуют от государства сыграть еще до того, как первая толпа поймет правила."
 tv_engineering_department.321.a: "Ставьте на это наше имя."
 tv_engineering_department.321.b: "Никакого общественного одобрения."
 tv_engineering_department.322.t: "[tv_wonder_survey|E]: Координация гильдии"
 tv_engineering_department.322.d: "Городские поставщики могут помочь стандартизировать записи опросов, но они ожидают уступок в случае сбоев. Их клерки понимают веса, подсчеты, маршруты и тихую тиранию сопоставления одного списка с другим. [tv_engineering_department|e] мог бы использовать эту компетенцию, особенно до того, как [tv_wonder_materials|e] начнет действовать всерьез. Однако каждая уступка еще глубже врезает коммерцию в память памятника. Мы можем купить заказ, но порядок запомнит, кто его продал."
 tv_engineering_department.322.a: "Опирайтесь на гильдии."
 tv_engineering_department.322.b: "Избегайте новых обязательств."
 tv_engineering_department.401.t: "[tv_wonder_ceremony|E]：Медитация начинается"
 tv_engineering_department.401.d: "Совершенное чудо покрыто тишиной. Священники, инженеры и королевские наблюдатели отстраняются от обычных зрелищ, чтобы год строгой экономии мог придать памятнику окончательное значение. [tv_wonder_ceremony|e] начинается не с шума, а с сознательного отказа от него. Даже [tv_engineering_department|e] должен научиться терпению, поскольку никакой расчет не может ускорить ритуал, призванный научить сдержанности. Посетителей поначалу пугает тишина. Затем они начинают понижать голос, прежде чем понимают, почему."
 tv_engineering_department.401.a: "Пусть год повернется."
 tv_engineering_department.410.t: "[tv_wonder_ceremony|E]: Требуются посланники"
 tv_engineering_department.410.d: "Соседний двор просит нас прислать эмиссара, чтобы он стал свидетелем открытия его великой оси. Приглашение носит церемониальный характер, но именно церемонии государства практикуют, чтобы их помнили. Посещаемость поместит наше имя в число тех, кто первым увидел новый памятник, аплодировал в нужный момент и понял послание без необходимости его объяснения. Отказ спас бы путешествие и лишил бы места в их истории. Некоторые камни строятся дома; другие ожидают свидетелей из-за границы."
 tv_engineering_department.410.a: "Отправьте эмиссара."
 tv_engineering_department.410.b: "Отклоните приглашение."
 tv_engineering_department.411.t: "[tv_wonder_ceremony|E]：Прибывает эмиссар"
 tv_engineering_department.411.d: "Приглашенный суд принял. Еще один иностранный эмиссар присоединяется к ритуальной процессии с отрепетированным достоинством, путешествующей свитой и глазами, привыкшими замечать как величие, так и слабость. [tv_wonder_ceremony|e] становится более убедительным с каждым внешним свидетелем, потому что слава звучит громче, когда она повторяется с другим акцентом. Мастера процессии корректируют порядок входа; писцы корректируют список почетных гостей. Церемониальное продвижение чуда продвигается вперед, по одному наблюдая за двором."
 tv_engineering_department.411.a: "Примите их с честью."
 tv_engineering_department.412.t: "[tv_wonder_ceremony|E]: Приглашение отклонено"
 tv_engineering_department.412.d: "Приглашенный суд отказался отправить эмиссара. Их ответ достаточно вежлив, чтобы избежать оскорблений, и достаточно холоден, чтобы его запомнили. [tv_wonder_ceremony|e] должен найти свою аудиторию в другом месте, поскольку памятник, который ищет иностранного благоговения, не может позволить себе пустое дипломатическое место. Придворные уже предлагают новые имена, более лестные маршруты и письма, менее похожие на просьбы. Слава не любит отказов, но ее можно перенаправить."
 tv_engineering_department.412.a: "Пригласите еще одного соседа."
 tv_engineering_department.421.t: "[tv_wonder_ceremony|E]：Триумфальный парад начинается"
 tv_engineering_department.421.d: "Вдоль оси подняты знамена, но параду все еще не хватает доказательств. Барабанщики могут репетировать, лошади могут полировать камни церемониальными копытами, а офицеры могут держаться в прекрасной уверенности, но все это не является победой. [tv_wonder_ceremony|e] требует триумфа, который должна подтвердить сама война. До тех пор Военный город одет так, как будто он не до конца заслужил честь. Только победа в войне подарит памятнику ту память, о которой он просит."
 tv_engineering_department.421.a: "Тогда победа должна прийти."
 tv_engineering_department.431.t: "[tv_wonder_ceremony|E]：Гражданский фестиваль начинается"
 tv_engineering_department.431.d: "Город открывает свои упорядоченные площади для года церемоний, игр, шествий и публичных поучений. Семинары проходят медленно, но люди усваивают форму гражданской дисциплины, гуляя по ней, наблюдая за ней и жалуясь на нее, пока она не почувствует себя знакомой. [tv_wonder_ceremony|e] превращает городское пространство в урок, повторяемый под открытым небом. Дети запоминают маршруты еще до того, как поймут лозунги. Гражданская столица учит послушанию, делая его праздничным."
 tv_engineering_department.431.a: "Пусть граждане собираются."
 tv_engineering_department.461.t: "[tv_wonder_ceremony|E]:Начинается Фестиваль свободной торговли"
 tv_engineering_department.461.d: "Купцы, посланники и брокеры наполняют гавань обещаниями открытого обмена. Доходы на какое-то время сокращаются, потому что щедрость всегда выглядит благороднее до закрытия счетов. [tv_wonder_ceremony|e] превращает причалы, склады и переполненные столы в сцену для доверия иностранцев. Каждый контракт, подписанный публично, учит порт говорить на языке, который понимают отдаленные суды. В течение года прибыль снижается, поэтому репутация может исчезнуть."
 tv_engineering_department.461.a: "Откройте причалы."
 tv_engineering_department.471.t: "[tv_wonder_ceremony|E]:Начинается Фестиваль предков"
 tv_engineering_department.471.d: "Некрополь вступает в год благовоний, генеалогий и размеренного траура. Имена повторяются до тех пор, пока они не кажутся тяжелее тел, которым они когда-то принадлежали, а мастерские замедляются, пока память берет верх над производством. [tv_wonder_ceremony|e] учит царство относиться к происхождению как к архитектуре. Каждое подношение ставит еще один камень в доводы в пользу того, что живыми управляют упорядоченные мертвые. Траур, если он организован, становится авторитетом."
 tv_engineering_department.471.a: "Пусть предки соберутся."
 tv_engineering_department.481.t: "[tv_wonder_ceremony|E]：Начинается Гильдия Навигаторов"
 tv_engineering_department.481.d: "Пилоты, картографы, мастера по веревке и портовые служащие расположились в здании гильдии под маяком. Они прибывают с морскими картами, узлами, спорами о приоритете и особой уверенностью людей, умеющих читать береговую линию в плохую погоду. Маяк не будет завершен, пока не будет стоять их учреждение. Один только свет предупреждает корабли; гильдия учит страну понимать предупреждение. [tv_wonder_ceremony|e] теперь ждет бюрократию с солью в волосах."
 tv_engineering_department.481.a: "Постройте гильдию."
 tv_engineering_department.491.t: "[tv_wonder_ceremony|E]:Начинается водный фестиваль"
 tv_engineering_department.491.d: "Каналы украшены гирляндами, шлюзы благословлены, а мастерские затихли на год водных обрядов. Вода создана для того, чтобы выглядеть послушной, и каждый, кто когда-либо видел потоп, знает, что это смелое богословское утверждение. Производство изгибается, чтобы комплекс мог требовать священного порядка через [tv_wonder_ceremony|e]. Инженеры наблюдают, как священники благословляют то, что они предпочитают осматривать, а священники наблюдают, как инженеры измеряют то, что они предпочитают освятить. Между ними вода продолжает двигаться."
 tv_engineering_department.491.a: "Пусть воды повернутся."
 tv_engineering_department.501.t: "[tv_wonder_ceremony|E]：Начинается глубокий дренаж"
 tv_engineering_department.501.d: "Инженеры ведут дренажные сооружения вниз, в шахтерский город. Шахты будут почти бесшумны в течение года, пока насосы, распорки и каналы покоряют глубины. Шахтеры не любят тишину почти так же, как воду, но нужно пережить и то, и другое, прежде чем можно будет претендовать на более глубокое богатство. [tv_wonder_ceremony|e] здесь не мягкий; это сделка с темнотой, сыростью и терпением. Когда работы наконец-то вздохнут, город поймет, насколько далеко от страха он может зайти."
 tv_engineering_department.501.a: "Осушите тьму."
 tv_engineering_department.511.t: "[tv_wonder_ceremony|E]：Звездный каталог начинается"
 tv_engineering_department.511.d: "Обсерватория замыкается вокруг ламп, столов и дисциплинированной бессонницы. Астрономы отмечают одну звезду за другой не как рассеянные огни, а как элементы общественного порядка, которые смогут проверить будущие ученые. Законодательство замедляется, в то время как суд уделяет внимание небу и инструментам. [tv_wonder_ceremony|e] сегодня не закончится зрелищем; оно закончится, когда небеса будут скопированы с достаточным терпением, чтобы стать полезными."
 tv_engineering_department.511.a: "Пусть посчитают небо."
 tv_engineering_department.521.t: "[tv_wonder_ceremony|E]：Начинается Провозглашение Затмения"
 tv_engineering_department.521.d: "Обсерватория выдала свой прогноз: наступит затмение, и суд будет готов назвать его прежде, чем страх сможет назвать его первым. Священники, ученые, моряки и скептики теперь смотрят вверх с разными надеждами. Каждый прошедший месяц проверяет утверждение. Если небо подчиняется таблицам, [tv_wonder_ceremony|e] станет доказательством того, что царство может читать небо, не подчиняясь ему."
 tv_engineering_department.521.a: "Наблюдайте за небесами."
 tv_engineering_department.522.t: "[tv_wonder_ceremony|E]：Приближается затмение"
 tv_engineering_department.522.d: "Свет меняется именно там, где сказала обсерватория. Толпы замолкают, но тишина не паника; глашатаи уже рассказали им, что предсказывали учёные таблицы. [tv_wonder_ceremony|e] становится публичной уверенностью в пространстве между солнцем, тенью и дыханием. Когда свет возвращается, суд не просто требует мудрости. Он продемонстрировал своевременность, смелость и умение творить чудеса."
 tv_engineering_department.522.a: "Пусть королевство запомнит предсказание."
 tv_engineering_department.531.t: "[tv_wonder_ceremony|E]: Дань получена"
 tv_engineering_department.531.d: "Еще один предметный вклад попадает во Дворец Наций. Оно выставлено с изысканной тщательностью: не просто богатство, но и спор о ранге, видимый каждому посланнику, проходящему через зал. Галерея дани становится все более убедительной с каждым предложением, потому что в подчинение, как и в славу, становится легче поверить, когда у нее есть архитектура. Церемония продвигает один размеренный акт послушания за раз."
 tv_engineering_department.531.a: "Запишите дань."
 tv_engineering_department.541.t: "[tv_wonder_ceremony|E]：Посольский квартал начинается."
 tv_engineering_department.541.d: "Намечены фундаменты посольского квартала рядом с Дворцом Наций. Иностранные дома обретут двери, дворы, коридоры для слуг и все мелкие практические достоинства, которые сделают дипломатию ежедневным присутствием, а не случайным визитом. [tv_wonder_ceremony|e] теперь ждет в районе, построенном для проживания других судов. Дворец может привлечь внимание; посольский квартал учит внимание оставаться."
 tv_engineering_department.541.a: "Стройте места для посторонних глаз."
 tv_engineering_department.500.t: "[tv_wonder_ceremony|E]:Проект открыт"
 tv_engineering_department.500.d: "[tv_engineering_department|E] завершил работу над [tv_wonder_ceremony|e], и теперь памятник является постоянным знаком амбиций королевства. Лесов больше нет, бухгалтерские книги запечатаны, и общественность начала работу, которую не сможет завершить ни один инженер: решить, что означает это чудо. Кто-то назовет это славой, кто-то излишеством, кто-то доказательством того, что эпоха изменилась. Всем им придется это посмотреть. Это уже форма победы."
 tv_engineering_department.500.a: "Пусть век помнит об этом."
 tv_engineering_department.600.t: "[tv_wonder_construction|E]: Чудо света завершено"
 tv_engineering_department.600.d: "С [SCOPE.sCountry('tv_wonder_builder_country').GetName] приходят новости: на [SCOPE.sLocation('tv_wonder_completed_site').GetName] свершилось чудо света. Отчеты расходятся по стоимости, красоте, цели и мудрости, но в одном они сходятся. Работа слишком велика, чтобы оставаться локальной. Это вошло в общий разговор правителей."
 tv_engineering_department.600.a: "Мир услышал."

