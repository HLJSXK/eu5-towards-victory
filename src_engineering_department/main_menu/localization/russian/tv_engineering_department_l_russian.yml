 TV_ENGINEERING_DEBATE_HELP_TEXT_1: "Сословия дворян, горожан и духовенства выдвигают каждое свое требование; удовлетворение требования или ответ на него отказом/взяткой продвигает [tv_wonder_domestic_support|e]."
 TV_ENGINEERING_DEBATE_HELP_TEXT_2: "Как только [tv_wonder_domestic_support|e] достигнет #Y 100#!, вы можете объявить дебаты завершенными и перейти к [tv_wonder_survey|e]."
 TV_ENGINEERING_DEBATE_HELP_TEXT_3: "Поддержка может продолжать накапливаться до #Y 200#! даже после окончания дебатов и остается в резерве для следующих этапов."
 TV_ENGINEERING_DEBATE_HELP_TEXT_4: "Как только дебаты завершаются, резервная поддержка со временем снижается."
