 TV_ENGINEERING_CONSTRUCTION_UNIT_ACTIVE_TT: "Этот строительный объект в настоящее время строится."
 TV_ENGINEERING_CONSTRUCTION_UNIT_PENDING_TT: "Этот строительный блок еще не завершен."
 TV_ENGINEERING_CONSTRUCTION_INFO_TEXT: "Уровень Великого Проекта соответствует наименьшему количеству завершенных юнитов среди четырех [tv_wonder_construction_part|e]. Завершение юнита дает [tv_wonder_domestic_support|e]; повышение общего уровня дает еще один бонус поддержки."
 TV_ENGINEERING_FINISH_CONSTRUCTION_BUTTON: "@trigger_yes! Объявляем великий проект завершенным"
 TV_ENGINEERING_CONSTRUCTION_HELP_TEXT_1: "$BULLET$ [tv_wonder_construction|e] развивает одновременно четыре [tv_wonder_construction_part|e]: \"Фундамент\", \"Основная структура\", \"Функция\" и \"Венчание\". Используйте кнопки выше, чтобы переключить строящуюся в данный момент деталь."
 TV_ENGINEERING_CONSTRUCTION_HELP_TEXT_2: "$BULLET$ Уровень [tv_wonder_construction|e] зависит от того, какая часть отстает дальше всего; общий уровень повышается только после того, как отстающая часть завершает новую единицу."
 TV_ENGINEERING_CONSTRUCTION_HELP_TEXT_3: "$BULLET$ Вы можете объявить [tv_wonder_construction|e] завершенным, как только он завершит хотя бы один уровень."
 TV_ENGINEERING_CONSTRUCTION_HELP_TEXT_4: "$BULLET$ Таким образом, вы можете сначала завершить проект меньшего масштаба, а позже реализовать [tv_wonder_expansion|e] более крупного масштаба, не теряя уже заработанных наград за завершение."
 TV_ENGINEERING_CONSTRUCTION_HELP_TEXT_5: "$BULLET$ Завершение любой строительной единицы дает [tv_wonder_domestic_support|e]; если этот отряд также повышает общий уровень Великого Проекта, он дает еще один бонус [tv_wonder_domestic_support|e]."
 TV_ENGINEERING_CONSTRUCTION_HELP_TT: "#T Construction#!\n[tv_wonder_construction|e] развивает одновременно четыре [tv_wonder_construction_part|e]: фундамент, основную структуру, функцию и венец. Используйте кнопки выше, чтобы переключить строящуюся в данный момент часть. \nУровень [tv_wonder_construction|e] зависит от того, какая часть находится дальше всего; общий уровень повышается только после того, как отстающая часть завершит новый блок. \n Вы можете объявить [tv_wonder_construction|e] завершенным, как только он завершит хотя бы один уровень. \n Таким образом, вы можете сначала завершить проект меньшего масштаба, а затем расширить его до более крупного масштаба, не теряя уже заработанных наград за завершение. \n Завершение любого строительного блока дает [tv_wonder_domestic_support|e]; если этот отряд также повышает общий уровень Великого Проекта, он дает еще один бонус [tv_wonder_domestic_support|e]."
 TV_ENGINEERING_CEREMONY_CARD_TITLE: "[tv_wonder_ceremony|E]"
 TV_ENGINEERING_CEREMONY_LOCKED_TEXT: "Прежде чем приступить к [tv_wonder_construction|E], вам необходимо завершить [tv_wonder_ceremony|e]."
