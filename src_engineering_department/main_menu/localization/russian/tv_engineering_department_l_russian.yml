 TV_ENGINEERING_ORG_LOG_HELP_ORGANIZATION_TEXT_1: "Скорость [tv_wonder_construction|e] зависит от количества эффективных [ShowBuildingTypeName('tv_wonder_labor_camp')]."
 TV_ENGINEERING_ORG_LOG_HELP_ORGANIZATION_TEXT_2: "Каждый работающий [ShowBuildingTypeName('tv_wonder_labor_camp')] обеспечивает #P 1000#! ежемесячный прогресс [tv_wonder_construction|e]."
 TV_ENGINEERING_ORG_LOG_HELP_ORGANIZATION_TEXT_3: "Ежемесячный ход строительства дополнительно изменяется с помощью [tv_wonder_logistics_competence|e] локации."
 TV_ENGINEERING_ORG_LOG_HELP_ORGANIZATION_TEXT_4: "Ежемесячное обслуживание каждого работающего [ShowBuildingTypeName('tv_wonder_labor_camp')] обходится примерно в #N 25#!@gold!."
 TV_ENGINEERING_ORG_LOG_HELP_ORGANIZATION_TEXT_5: "Ограничение [ShowBuildingTypeName('tv_wonder_labor_camp')] зависит от [tv_wonder_organization_competence|e] местоположения."
 TV_ENGINEERING_ORG_LOG_HELP_LOGISTICS_TEXT_1: "[ShowBuildingTypeName('tv_wonder_material_dispatch_point')] превращает базовые материалы в [ShowGoodsName('tv_wonder_materials')]."
 TV_ENGINEERING_ORG_LOG_HELP_LOGISTICS_TEXT_2: "Нехватка [ShowGoodsName('tv_wonder_materials')] требует обслуживания [ShowBuildingTypeName('tv_wonder_labor_camp')]; серьезный дефицит снижает пропускную способность."
 TV_ENGINEERING_ORG_LOG_HELP_LOGISTICS_TEXT_3: "Страны ИИ могут построить [ShowBuildingTypeName('tv_wonder_material_dispatch_point')], поэтому импорт возможен."
