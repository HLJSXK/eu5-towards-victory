 TV_ENGINEERING_SURVEY_HELP_TEXT_1: "Выберите одно из своих мест, чтобы начать [tv_wonder_survey|e] для заблокированного [tv_wonder_construction|e]."
 TV_ENGINEERING_SURVEY_HELP_TEXT_2: "Прогресс опроса увеличивается ежемесячно в зависимости от военного навыка [tv_great_engineer|e]."
 TV_ENGINEERING_SURVEY_HELP_TEXT_3: "Завершение опроса показывает, что это местоположение [tv_wonder_scale_competence|e], [tv_wonder_logistics_competence|e] и [tv_wonder_organization_competence|e]."
 TV_ENGINEERING_SURVEY_HELP_TEXT_4: "Подтверждение сайта фиксирует эти значения компетенции и открывает доступ к организации, логистике и строительству."
 TV_ENGINEERING_SURVEY_HELP_TEXT_5: "Некоторые [tv_wonder_unique|e], которые уже существуют в начале игры, не нуждаются в [tv_wonder_survey|e]."
 TV_ENGINEERING_SURVEY_LOCKED_TEXT: "Прежде чем приступить к [tv_wonder_survey|e], вам необходимо завершить \"Концепцию и дебаты\"."
