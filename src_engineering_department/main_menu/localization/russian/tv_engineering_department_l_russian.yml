 tv_wonder_collegiate_hall: "Университетский зал"
 tv_wonder_collegiate_hall_desc: "Специальный коллегиальный зал, необходимый для церемонии принятия Университетского устава."
 tv_wonder_temple_school: "Храмовая школа"
 tv_wonder_temple_school_desc: "Специальная храмовая школа, необходимая для церемонии Храмовой школы."
 tv_wonder_canal_office: "Канал Офис"
 tv_wonder_canal_office_desc: "Специальный офис на канале, необходимый для церемонии Управления канала."
 tv_wonder_admiralty_office: "Адмиралтейство"
 tv_wonder_admiralty_office_desc: "Специальный адмиралтейский кабинет, необходимый для церемонии на Адмиралтейском дворе."
 tv_wonder_fortress_arsenal_quarter: "Крепостной Арсенальный квартал"
 tv_wonder_fortress_arsenal_quarter_desc: "Особый район арсенала, необходимый для церемонии \"Арсенальный квартал\"."
 tv_wonder_master_armourers_hall: "Зал мастеров-оружейников"
 tv_wonder_master_armourers_hall_desc: "Специальный зал оружейников, необходимый для церемонии мастеров-оружейников."
 tv_wonder_legal_deposit_office: "Депозитная контора"
 tv_wonder_legal_deposit_office_desc: "Для церемонии депонирования обязательных экземпляров требуется специальное хранилище обязательных экземпляров."
 tv_engineering_department.551.t: "[tv_wonder_ceremony|E]: Ученые собираются"
 tv_engineering_department.551.d: "Университетский город понижает свой голос в учебе. Магистры, студенты, переписчики и чиновники собираются вокруг лекционных списков и спорных чтений, превращая завершенные улицы в годовой ассамблею. [tv_wonder_ceremony|e] не будет торопиться. Он требует от королевства заменить административную скорость на программу, которая сможет пережить нынешний суд."
 tv_engineering_department.551.a: "Пусть ученые проведут свой год."
 tv_engineering_department.552.t: "[tv_wonder_ceremony|E]：Коллегиальный зал начинается."
 tv_engineering_department.552.d: "Планы Университетского зала запечатаны рядом с Университетским городом. Новый зал даст учителям место для формальных ссор, студентам место, где они смогут стать менее уверенными в полезных вещах, а венец - структуру, посредством которой обучение можно будет распознать, не будучи полностью прирученным. [tv_wonder_ceremony|e] теперь ждет у дверей, скамеек, статуй и крыши, под которыми обучение может претендовать на постоянство."
 tv_engineering_department.552.a: "Постройте дом для споров."
 tv_engineering_department.561.t: "[tv_wonder_ceremony|E]: Купол скрыт пеленой"
 tv_engineering_department.561.d: "Большой купол закрыт для освящения. Священники отмечают пороги, певцы репетируют размеренный порядок почитания, а суд принимает год, в течение которого легитимность должна продвигаться медленнее, чтобы святость могла продвигаться осторожно. [tv_wonder_ceremony|e] просит царство подождать под накрытым небом, пока храм не будет готов открыть свои небеса."
 tv_engineering_department.561.a: "Пусть купол освятится."
 tv_engineering_department.571.t: "[tv_wonder_ceremony|E]: Лестница паломника открывается"
 tv_engineering_department.571.d: "Лестница башенного храма отдается паломникам на год восхождений, пауз, пения и больных ног. Мастерские жалуются, что труд склоняется к шествиям, но [tv_wonder_ceremony|e] предназначен для обучения высоте посредством усилий. Каждый шаг превращает башню из объекта в маршрут, и каждый маршрут делает преданность видимой."
 tv_engineering_department.571.a: "Пусть лезут."
 tv_engineering_department.572.t: "[tv_wonder_ceremony|E]：Начинается Храмовая школа"
 tv_engineering_department.572.d: "Учителя, служащие и строители отмечают фундамент храмовой школы под башней. [tv_wonder_ceremony|e] теперь ждет в классах, где доктрина может стать привычкой, а грамотность и аргументация дисциплинируются ритуалом. Башня может привлечь взгляд вверх; школа научит голоса, что говорить, когда они смотрят."
 tv_engineering_department.572.a: "Постройте школу."
 tv_engineering_department.581.t: "[tv_wonder_ceremony|E]：Речная ярмарка начинается"
 tv_engineering_department.581.d: "Вдоль расширившейся реки собираются киоски, баржи, столы сбора пошлин и праздничные баннеры. Торговля замедляется, поскольку река призвана стать зрелищем, прежде чем она снова станет артерией. [tv_wonder_ceremony|e] проведет год, заставляя торговцев, лодочников и чиновников вместе выполнять новый заказ воды."
 tv_engineering_department.581.a: "Пусть река познает свою новую толпу."
 tv_engineering_department.582.t: "[tv_wonder_ceremony|E]: Начало работы на канале"
 tv_engineering_department.582.d: "Геодезисты отмечают постоянный офис управления канала. Здание не будет достаточно величественным, чтобы конкурировать с речными сооружениями, и именно поэтому оно так важно: шлюзы, споры, дорожные сборы, ремонт и жалобы на засушливый сезон нуждаются в месте, где не может скрыться ответственность. [tv_wonder_ceremony|e] теперь ожидает, пока администрация установит стены."
 tv_engineering_department.582.a: "Дайте реке письменный стол."
 tv_engineering_department.591.t: "[tv_wonder_ceremony|E]: Начало работы Адмиралтейства."
 tv_engineering_department.591.d: "На верфи отведено место под здание адмиралтейства. Суда можно построить с помощью стартовых площадок и кранов, но флотам также нужны приказы, схемы, проверки и должностные лица, обладающие терпением, чтобы древесина стала политикой. [tv_wonder_ceremony|e] теперь ждет верфи, чтобы обрести военно-морской ум."
 tv_engineering_department.591.a: "Постройте офис."
 tv_engineering_department.601.t: "[tv_wonder_ceremony|E]：Бастионы под судом"
 tv_engineering_department.601.d: "В Звездном Городе-Крепости начинается год испытаний. Инженеры проверяют углы, артиллеристы проверяют поля огня, а рабочие обнаруживают, что за стену, спроектированную для математики, все еще приходится платить мускулами. Производство замедляется, поскольку [tv_wonder_ceremony|e] учит крепость отвечать на теорию камнем."
 tv_engineering_department.601.a: "Проверьте каждый угол."
 tv_engineering_department.602.t: "[tv_wonder_ceremony|E]:Начался квартал \"Арсенала\""
 tv_engineering_department.602.d: "Намечены фундаменты арсенального квартала внутри города-крепости. Он объединит ремонтные мастерские, пороховые склады и сборочные пункты в один дисциплинированный район. [tv_wonder_ceremony|e] теперь ожидает в той части крепости, которая обеспечивает возможность повторения защиты после того, как затихнет первая тревога."
 tv_engineering_department.602.a: "Постройте квартал арсенала."
 tv_engineering_department.611.t: "[tv_wonder_ceremony|E]: Сигнальные огни горят"
 tv_engineering_department.611.d: "Сторожевые посты вдоль стены начинают год практики сигналов. Дым, пламя, пассажиры и местные рынки — все подчиняется новому ритму, а торговля страдает, в то время как каждый маршрут учится первым замечать предупреждения. [tv_wonder_ceremony|e] делает бдительность настолько публичной, что даже в обычных поездках создается впечатление, что за ней следят."
 tv_engineering_department.611.a: "Держите часы яркими."
 tv_engineering_department.621.t: "[tv_wonder_ceremony|E]: Начало Зала мастеров-оружейников"
 tv_engineering_department.621.d: "Оружейная палата представляет собой фундамент для зала мастеров-оружейников. Самые большие запасы оружия не могут зависеть только от железа и бухгалтерских книг; им нужны умелые руки, способные оценить неудачи до того, как начнется битва. [tv_wonder_ceremony|e] теперь ожидает корабля, чтобы получить постоянный корт."
 tv_engineering_department.621.a: "Сборка для мастеров."
 tv_engineering_department.631.t: "[tv_wonder_ceremony|E]:Начинается национальный каталог"
 tv_engineering_department.631.d: "Национальная библиотека начинает свой каталог. Ученые закрывают двери, разворачивают инвентарные списки и замедляют работу законотворческой машины страны, одновременно обучая памяти снова находить себя. [tv_wonder_ceremony|e] — это не парад, а показатель: тихий, требовательный и мощный после завершения."
 tv_engineering_department.631.a: "Пусть каталог растет."
 tv_engineering_department.632.t: "[tv_wonder_ceremony|E]：Открытие обязательного экземпляра"
 tv_engineering_department.632.d: "Строители размечают депозитарную контору рядом с библиотекой. Отсюда книги, указы, копии и доводы будут собираться не как милости, а как обязательства. [tv_wonder_ceremony|e] теперь ожидает комнаты, в которой запись памяти области остановится в зависимости от аварии."
 tv_engineering_department.632.a: "Постройте офис памяти."

