 TV_ENCYCLOPEDIA_TAB_TITLE: "Инженерный отдел"
 TV_ENCYCLOPEDIA_FILTER_ALL: "Все"
 TV_ENCYCLOPEDIA_FILTER_ALL_TOOLTIP: "Показать каждую запись инженерного отдела."
 TV_ENCYCLOPEDIA_FILTER_MECHANICS: "Механика"
 TV_ENCYCLOPEDIA_FILTER_MECHANICS_TOOLTIP: "Показывать только записи механиков Великого проекта."
 TV_ENCYCLOPEDIA_FILTER_GENERIC: "Общие чудеса"
 TV_ENCYCLOPEDIA_FILTER_GENERIC_TOOLTIP: "Показывать только общие записи Wonder."
 TV_ENCYCLOPEDIA_FILTER_UNIQUE: "Уникальные чудеса"
 TV_ENCYCLOPEDIA_FILTER_UNIQUE_TOOLTIP: "Показывать только уникальные записи Wonder."
