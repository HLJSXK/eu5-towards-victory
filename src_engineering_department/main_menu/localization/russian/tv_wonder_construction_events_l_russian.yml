 tv_engineering_department.7000.t:0 "Строительство: Улицы аплодируют этому объекту"
 tv_engineering_department.7000.d:0 "Несколько видимых успехов на заборе превращают любопытство в гордость. Старейшины гильдий дают имена, соседи перестают относиться к работам как к королевскому тщеславию, и проект получает более серьезные претензии на [tv_wonder_domestic_support|E]."
 tv_engineering_department.7000.a:0 "Пусть новая добрая воля старейшин гильдии продвинет работу вперед."
 tv_engineering_department.7001.t:0 "Строительство: Более широкая линия на Земле"
 tv_engineering_department.7001.d:0 "Новые измерения открывают возможности, которые могут иметь более широкое воздействие. То, что на пергаменте выглядело как амбиции, теперь имеет сносную основу, и [tv_wonder_scale_competence|E] прыгает вперед."
 tv_engineering_department.7001.a:0 "Он претендует на более широкую основу, которую только что доказало исследование."
 tv_engineering_department.7002.t:0 "Конструкция: имена и порядки встают на свои места"
 tv_engineering_department.7002.d:0 "Двор просыпается под новые составы. Бригады знают, где стоять, служащие знают, какие подсчеты имеют значение, а [tv_wonder_organization_competence|E] растет, потому что в замешательстве становится меньше мест, где можно спрятаться."
 tv_engineering_department.7002.a:0 "Мы заблокируем новые составы, прежде чем путаница вернется."
 tv_engineering_department.7003.t:0 "Строительство: Дороги и тележки обретают свой ритм"
 tv_engineering_department.7003.d:0 "Лучший маршрут соединяет дорогу, воду, склад и леса. Первый конвой, использовавший его, прибывает почти до неловкости вовремя, и [tv_wonder_logistics_competence|E] резко возрастает."
 tv_engineering_department.7003.a:0 "Следите за тем, чтобы эти тележки катились вовремя!"
 tv_engineering_department.7004.t:0 "Строительство: Камень поднимается выше отметки"
 tv_engineering_department.7004.d:0 "Активная часть поднимается выше своей отметки до того, как свет погаснет. Ни одно чудо не объясняет этого; подъемы, суставы и руки просто встречаются в нужный час, продвигая прогресс [tv_wonder_construction|E] вперед."
 tv_engineering_department.7004.a:0 "Позволяет лифтам проехать мимо отметки."
 tv_engineering_department.7005.t:0 "Строительство: повороты уличных разговоров"
 tv_engineering_department.7005.d:0 "Шум вокруг площадки становится тише. Это не одобрение, но достаточно разрешения, чтобы телеги могли проехать и споры поскорее закончились; [tv_wonder_domestic_support|E] увеличивается с полезным запасом."
 tv_engineering_department.7005.a:0 "Пропускает тележки, и споры утихают."
 tv_engineering_department.7006.t:0 "Конструкция: мера исправлена"
 tv_engineering_department.7006.d:0 "Перекроен тесный угол, расширен служебный путь, и основная линия памятника снова дышит. Улучшение [tv_wonder_scale_competence|E] небольшое, но реальное."
 tv_engineering_department.7006.a:0 "Расширяет путь и позволяет дизайну дышать."
 tv_engineering_department.7007.t:0 "Строительство: Двор обретает свой ритм"
 tv_engineering_department.7007.d:0 "Набор отсутствующих передач восстановлен. Работа слишком сухая для церемоний, но она позволяет инструментам двигаться и улучшает [tv_wonder_organization_competence|E]."
 tv_engineering_department.7007.a:0 "Мы исправляем передачу и продолжаем работу инструментов."
 tv_engineering_department.7008.t:0 "Строительство: Колеи находят лучшую дорогу"
 tv_engineering_department.7008.d:0 "Исправлен один неудачный поворот в питающей линии. Меньше тележек ждут пустых, меньше грузов поступает сломанными, а [tv_wonder_logistics_competence|E] становится лучше."
 tv_engineering_department.7008.a:0 "Исправляет плохой поворот до того, как треснут новые грузы."
 tv_engineering_department.7009.t:0 "Строительство: \"Молоты\" приближаются к завершению"
 tv_engineering_department.7009.d:0 "Упрямый сустав наконец-то подходит, и следующая бригада может приступить к работе без еще одного месяца ожидания. Прогресс [tv_wonder_construction|E] продвигается вперед самым приятным образом: заметно."
 tv_engineering_department.7009.a:0 "Наконец-то оно подходит!"
 tv_engineering_department.7010.t:0 "Строительство: Хлебные деньги у ворот"
 tv_engineering_department.7010.d:0 "У ворот собирается толпа, бормочущая, что чудо ест хлеб, предназначенный для бедных. Если казначейство откроет свой [gold|E] на виду у улицы и выплатит выплату сейчас, ворчание утихнет, и [tv_wonder_domestic_support|E] поднимется - но монета не вернется."
 tv_engineering_department.7010.a:0 "Выплатите его на виду у толпы."
 tv_engineering_department.7010.b:0 "Бухгалтерские книги достаточно тонкие и без публичной раздачи."
 tv_engineering_department.7011.t:0 "Строительство: Проповедник ставит под сомнение право Короны"
 tv_engineering_department.7011.d:0 "Местный проповедник говорит своей пастве, что чудо основано на гордости, а не на каком-либо праве короны требовать его. Принятие королевского [legitimacy|E] письменного указа уладило бы вопрос и стабилизировало бы [tv_wonder_domestic_support|E] до того, как проповедь распространится дальше."
 tv_engineering_department.7011.a:0 "Запечатайте указ и позвольте слову короны решить дело."
 tv_engineering_department.7011.b:0 "Царский указ по поводу ропота одного проповедника выглядит слабостью, а не силой."
 tv_engineering_department.7012.t:0 "Строительство: Карьерная дорога разделяет общее поле."
 tv_engineering_department.7012.d:0 "Новая карьерная дорога проходит прямо через общие поля двух деревень. Расходы [stability|E] на принудительное переселение расчистят дорогу и поднимут [tv_wonder_domestic_support|E] среди тех, кто хочет завершения чуда - ценой мира, приобретенного с этими деревнями."
 tv_engineering_department.7012.a:0 "Прикажите переселение и дайте дорогу пройти."
 tv_engineering_department.7012.b:0 "Поля двух деревень не стоят более короткого маршрута телеги."
 tv_engineering_department.7013.t:0 "Строительство: Иностранные посланники высмеивают проект тщеславия"
 tv_engineering_department.7013.d:0 "Посланники конкурирующего двора называют это чудо тщеславным проектом, слишком большим для стоящей за ним казны. Потратив [prestige|E] на роскошный прием, можно изменить историю, которую они приносят домой, и поднять [tv_wonder_domestic_support|E] - но репутацию короны, когда-то потраченную на льстивость гостям, не так-то легко восстановить."
 tv_engineering_department.7013.a:0 "Потратьтесь на прием и поменяйте то, что посланцы несут домой."
 tv_engineering_department.7013.b:0 "Иностранные сплетни не стоят того, чтобы тратить на них репутацию короны."
 tv_engineering_department.7014.t:0 "Строительство: Дворянский охотничий двор превращается в лесной склад"
 tv_engineering_department.7014.d:0 "Каменщикам чуда нужен участок охотничьего бега дворянина для хранения древесины. Он предоставит его, но только за услугу, которую корона должна засчитать против [estate_satisfaction|E] среди знати - потраченная сейчас, она все равно поднимет [tv_wonder_domestic_support|E], как только древесина начнет двигаться."
 tv_engineering_department.7014.a:0 "Окажи услугу и возьми лесной участок."
 tv_engineering_department.7014.b:0 "Доброжелательность одного дворянина не стоит долга перед ним."
 tv_engineering_department.7015.t:0 "Строительство: У приходского колокола просят бронзу"
 tv_engineering_department.7015.d:0 "Основатели чуда хотят реквизировать приходской колокол для переделки на фурнитуру. Священник отвернется от пустой колокольни, но среди духовенства она стоит [estate_satisfaction|E] — цена, по которой [tv_wonder_domestic_support|E] все равно будет лучше, чем недостроенный эшафот."
 tv_engineering_department.7015.a:0 "Попросите как следует, и пусть колокол отправится в литейный цех."
 tv_engineering_department.7015.b:0 "Пустая колокольня вызовет больше разговоров, чем ее убранство."
 tv_engineering_department.7016.t:0 "Строительство: Тележки с припасами заполняют Рыночную площадь."
 tv_engineering_department.7016.d:0 "Тележки с припасами чуда продолжают блокировать рыночную площадь в дни доставки. Мастера гильдий перенаправят свои ларьки вокруг тележек, но это приведет к снижению количества [estate_satisfaction|E] среди бюргеров - стоимость, которая все равно выкупит некоторое количество [tv_wonder_domestic_support|E], как только площадь перестанет сражаться с телегами."
 tv_engineering_department.7016.a:0 "Спросите напрямую у гильдий и пропустите тележки."
 tv_engineering_department.7016.b:0 "Штрафовать возчиков проще, чем просить гильдии об одолжении."
 tv_engineering_department.7017.t:0 "Строительство: Барщина проводится после сбора урожая"
 tv_engineering_department.7017.d:0 "Надзиратель хочет, чтобы барщины, удерживаемые после сбора урожая, успели закончить фундамент до наступления морозов. Деревенские старейшины согласятся, но среди крестьян это будет стоить [estate_satisfaction|E] - израсходованное сейчас, [tv_wonder_domestic_support|E] все равно останется выше, чем фундамент, наполовину вырытый зимой."
 tv_engineering_department.7017.a:0 "Скажите это прямо и задержите банды после сбора урожая."
 tv_engineering_department.7017.b:0 "Урожай не может ждать на фундаменте."
 tv_engineering_department.7018.t:0 "Строительство: на пути стоит ряд многоквартирных домов"
 tv_engineering_department.7018.d:0 "Каменщики говорят, что участок слишком тесен, чтобы возвести следующий ряд, не сравняв с землей ряд жилых домов рядом с ним. Прямой заказ приведет к задержке [development|E] на объекте, поскольку здания разваливаются, но позволит работе - и [tv_wonder_domestic_support|E] вместе с ней - снова продвинуться вперед."
 tv_engineering_department.7018.a:0 "Прикажите снести ряд и расширить участок."
 tv_engineering_department.7018.b:0 "В тесноте жить легче, чем на улице выселенных жильцов."
 tv_engineering_department.7019.t:0 "Строительство: обычные торговые повороты на объекте"
 tv_engineering_department.7019.d:0 "Местные возчики и каменотесы были отстранены от своей обычной работы, чтобы обеспечить снабжение объекта. Если позволить этому продолжаться, [prosperity|E] будет истощаться на объекте, поскольку обычный бизнес сокращается, но более стабильные поставки по-прежнему будут рассматриваться как [tv_wonder_domestic_support|E], который стоит иметь."
 tv_engineering_department.7019.a:0 "Пусть местная торговля продолжает склоняться к работам."
 tv_engineering_department.7019.b:0 "Городу нужна обычная торговля больше, чем сайту нужны более быстрые поставки."
 tv_engineering_department.7020.t:0 "Строительство: Столичный мост ждет своих каменщиков"
 tv_engineering_department.7020.d:0 "Ремонт столичного моста застопорился из-за того, что к чуду были привлечены каменщики. Их содержание там обойдется [development|E] в столице, поскольку мост остается недостроенным, но это будет способствовать развитию чуда – и [tv_wonder_domestic_support|E] – в движении."
 tv_engineering_department.7020.a:0 "Оставьте каменщиков на чуде, а мост подождет."
 tv_engineering_department.7020.b:0 "Собственный столичный мост не может ждать в соответствии с графиком чуда."
 tv_engineering_department.7021.t:0 "Строительство: Агенты скупают древесину столицы"
 tv_engineering_department.7021.d:0 "Агенты чуда скупают древесину и камень по ценам, с которыми обычный рынок не может сравниться. Продолжение закупок приведет к истощению капитала [prosperity|E], поскольку торговля вокруг объекта уменьшится, но поставки работ и [tv_wonder_domestic_support|E] останутся с ними."
 tv_engineering_department.7021.a:0 "Пусть покупки продолжаются и кормят сайт."
 tv_engineering_department.7021.b:0 "Собственные рынки столицы не должны быть обескровлены ради одного проекта."
 tv_engineering_department.7022.t:0 "Строительство: предлагается удвоить ночную смену"
 tv_engineering_department.7022.d:0 "Надзиратель хочет, чтобы ночная смена увеличилась вдвое, чтобы компенсировать дни, потерянные из-за последних морозов. Его заказ утомил бы работающего [population|E] на объекте, поскольку дополнительные часы берут свое, но это продвинуло бы работу вперед и подняло бы [tv_wonder_domestic_support|E] вместе с ней."
 tv_engineering_department.7022.a:0 "Удвойте количество смен и продвигайте работу вперед."
 tv_engineering_department.7022.b:0 "Утомленные рабочие строят медленнее, чем отдохнувшие."
 tv_engineering_department.7023.t:0 "Конструкция: более широкая опора на столе казначея"
 tv_engineering_department.7023.d:0 "Главный каменщик кладет на стол казначея более широкий план фундамента, утверждая, что земля возьмет его, если до осенних дождей пройдут дополнительные ряды. Казначей может выдать золото за добавленный камень и руки сейчас, или план ждет обследования в следующем году."
 tv_engineering_department.7023.a:0 "Выпустите золото и позвольте каменщикам заложить более широкую опору до дождя."
 tv_engineering_department.7023.b:0 "Держите монету; Следующей весной дожди все еще будут."
 tv_engineering_department.7024.t:0 "Строительство: Изыскательские ставки останавливаются у забора."
 tv_engineering_department.7024.d:0 "Колья геодезиста останавливаются у линии забора соседа, и сосед отказывается их пропускать. Сегодня граница будет урегулирована королевским указом, но упоминание имени короны в отношении спорной живой изгороди не останется незамеченным."
 tv_engineering_department.7024.a:0 "Отправьте приказ и поместите имя короны за более широкой границей."
 tv_engineering_department.7024.b:0 "Пусть забор стоит; имя короны не тратится на споры о хеджировании."
 tv_engineering_department.7025.t:0 "Строительство: более широкий план пересекает общее"
 tv_engineering_department.7025.d:0 "Более широкий план проходит прямо через пастбища деревни. Перенос пограничных камней через деревню теперь решил бы вопрос обследования, но домохозяйства не забудут, кто их передвинул."
 tv_engineering_department.7025.a:0 "Переместите камни и позвольте исследованию сосредоточиться на большем отпечатке."
 tv_engineering_department.7025.b:0 "Оставьте общее как есть; обиженная деревня не стоит более широкой базы."
 tv_engineering_department.7026.t:0 "Строительство: цена иностранного каменщика за свою печать"
 tv_engineering_department.7026.d:0 "Иностранный мастер-каменщик предлагает сертифицировать более широкий дизайн, но только в том случае, если имя двора указано в качестве его покровителя в записях его собственной гильдии на родине. Одобрение решило бы здесь вопрос о размере; просьба является публичной и не может быть неизрасходованной."
 tv_engineering_department.7026.a:0 "Дайте одобрение и поверьте слову мастера в более широком плане."
 tv_engineering_department.7026.b:0 "Не упоминайте имя суда; бухгалтерская книга чужой гильдии – не то место, где их можно потратить."
 tv_engineering_department.7027.t:0 "Строительство: План фундамента пересекает охоту барона."
 tv_engineering_department.7027.d:0 "Более широкий план опоры пересекает территорию, которую местный барон долгое время использовал для своей охоты. Попросить его придержать язык, пока геодезисты завершат работы, было бы более масштабным решением, но благородное терпение, потраченное здесь, — это терпение, которое он ожидает получить обратно."
 tv_engineering_department.7027.a:0 "Попросите у барона терпения и позвольте геодезистам закончить его охотничьи угодья."
 tv_engineering_department.7027.b:0 "Маршрут по земле барона; его доброжелательность не стоит того, чтобы тратить его на обследование."
 tv_engineering_department.7028.t:0 "Строительство: План хочет иметь уголок Святой Земли"
 tv_engineering_department.7028.d:0 "Более широкий план предусматривает создание уголка освященной земли, который приход занимал с незапамятных времен. Священники позволили бы провести осмотр, если бы их правильно попросили, но просить духовенство уступить священную землю для строительства эшафотов — это услуга, потраченная, а не одолженная."
 tv_engineering_department.7028.a:0 "Попросите священников уступить угол и подтвердить более широкий обзор."
 tv_engineering_department.7028.b:0 "Держите съемку в пределах старой границы; освященная земля – не место для испытаний."
 tv_engineering_department.7029.t:0 "Строительство: Требуется переулок торговцев шерстью"
 tv_engineering_department.7029.d:0 "Более широкий след поглотит переулок, которым торговцы шерстью пользуются в рыночные дни. Если бы их попросили, старейшины гильдии согласились бы на объезд, но горожане, отдающие свои улицы под стройку, помнят неудобства дольше, чем опросы."
 tv_engineering_department.7029.a:0 "Спросите у олдерменов об объезде и подтвердите, что полоса движения по переулку более широкая."
 tv_engineering_department.7029.b:0 "Оставьте торговый переулок в покое; добрая репутация рынка не тратится на строительство лесов."
 tv_engineering_department.7030.t:0 "Строительство: деревню просят раскопать"
 tv_engineering_department.7030.d:0 "Бригадир говорит, что более широкая опора может оказаться надежной в течение недели, если соседняя деревня возьмется за раскопки вместо того, чтобы ухаживать за собственными полями. Деревня будет подчиняться старшине, но о сборе, назначенном во время посевной сезона, осень не забывает."
 tv_engineering_department.7030.a:0 "Позвоните деревенскому сборщику и выкопайте более широкую опору до конца недели."
 tv_engineering_department.7030.b:0 "Пусть деревня остается на своих полях; Вместо этого бригадир может дождаться наемных рабочих."
 tv_engineering_department.7031.t:0 "Строительство: на участке стоит ряд мастерских."
 tv_engineering_department.7031.d:0 "Единственный способ выровнять более широкую площадь — это снести ряд мастерских, уже стоящих на краю участка. Их камень и фундамент войдут прямо в новый план, но снос того, что уже построено, не является чем-то необратимым."
 tv_engineering_department.7031.a:0 "Опустите ряд и сложите его камень в более широкий след."
 tv_engineering_department.7031.b:0 "Оставьте мастерские стоять; сайт может развиваться в другом направлении."
 tv_engineering_department.7032.t:0 "Строительство: Торговцев лесом просят выбрать покупателя"
 tv_engineering_department.7032.d:0 "У торговцев древесиной на этом участке есть запасы и вагоны, которые нужно перевезти для более широкой опоры сегодня, если вместо этого их обычная торговля будет отложена для контракта с короной. Рынки этого места отреагировали бы на эти работы, но торговый путь, ориентированный на одного покупателя, не может вернуться обратно сам по себе."
 tv_engineering_department.7032.a:0 "Направьте местную торговлю на работу и доставьте насыпь для более широкой зоны покрытия."
 tv_engineering_department.7032.b:0 "Оставьте купцов заниматься своей обычной торговлей; заливку можно получить другим способом."
 tv_engineering_department.7033.t:0 "Строительство: Столичные дорожники разыскиваются в других местах"
 tv_engineering_department.7033.d:0 "Столичные дорожники и строители коридоров — единственные бригады, которые могут провести подтверждающее обследование в этом месяце. Снятие их с ремонта столицы решило бы более широкий вопрос о следах, но на улицах столицы будет виден пробел, который они оставили."
 tv_engineering_department.7033.a:0 "Переназначьте столичные бригады и позвольте им подтвердить более широкий охват."
 tv_engineering_department.7033.b:0 "Оставьте капитальный ремонт в покое; опрос может подождать бездействующих рук в другом месте."
 tv_engineering_department.7034.t:0 "Строительство: Ратуши предлагают доходы этого сезона"
 tv_engineering_department.7034.d:0 "Столичные ратуши предлагают гарантировать подтверждающий обзор торговых поступлений этого сезона при условии, что монета будет вытянута до того, как зимние ярмарки закроют свои бухгалтерские книги. Рынки столицы окажутся более широкими, но доходы за сезон направлены на одно чудо - это сезон, за который ратуши захотят ответить."
 tv_engineering_department.7034.a:0 "Используйте доходы от торговли столицы и подтвердите более широкое присутствие до закрытия ярмарок."
 tv_engineering_department.7034.b:0 "Оставьте в покое книги ратуши; Вместо этого исследование может подождать казначейства."
 tv_engineering_department.7035.t:0 "Строительство: бригадам требуются дни отдыха"
 tv_engineering_department.7035.d:0 "Бригадир говорит, что в этом месяце можно будет доказать более широкую основу, если бригады, уже находящиеся на объекте, будут работать в дни отдыха, а не отдыхать между сменами. Опрос позволил бы определить более широкую схему, но рабочие, выходящие за рамки обычного темпа, не все остаются работниками надолго."
 tv_engineering_department.7035.a:0 "Проведите экипажи в дни отдыха и урегулируйте более широкую основу в этом месяце."
 tv_engineering_department.7035.b:0 "Пусть экипажи сохранят дни отдыха; исследование может подождать более медленного темпа."
 tv_engineering_department.7036.t:0 "Строительство: в сменную комиссию требуется клерк."
 tv_engineering_department.7036.d:0 "Бригадиру на объекте нужен квалифицированный рабочий, который перерисовал таблички смен и разместил их там, где бригады смогут их прочитать. Казначейство может предоставить этого человека и его чернила за определенную плату, а [tv_wonder_organization_competence|E] будет следовать за новыми досками."
 tv_engineering_department.7036.a:0 "Сегодня мы нанимаем клерка и размещаем новые доски."
 tv_engineering_department.7036.b:0 "Старые доски прослужили так долго; они могут прослужить немного дольше."
 tv_engineering_department.7037.t:0 "Строительство: два мастера отказываются выполнять приказы друг друга"
 tv_engineering_department.7037.d:0 "Две бригады гильдии на объекте отказываются выполнять приказы мастеров друг друга, и из-за спора дважды на этой неделе утренняя смена останавливалась. Только приказ, содержащий [legitimacy|E] короны, установит приоритет между ними, и [tv_wonder_organization_competence|E] последует после окончания спора."
 tv_engineering_department.7037.a:0 "Приказ составлен и скреплен печатью; экипажи отвечают на него или не отвечают никому."
 tv_engineering_department.7037.b:0 "Слово короны не тратится на то, чтобы решить, кто из каменщиков ругается громче."
 tv_engineering_department.7038.t:0 "Строительство: Старая Рота забыла урожай"
 tv_engineering_department.7038.d:0 "Призывная деревенская рабочая сила была составлена по старому графику, в котором никогда не учитывался урожай, и половина бригад уходила, когда они требовались на полях. Навязывание ротации, несмотря на возражения местных жителей, приведет к сокращению [stability|E] страны, но экипажи, в конце концов, будут соблюдать фиксированные часы, и за ними последует [tv_wonder_organization_competence|E]."
 tv_engineering_department.7038.a:0 "Мы продвигаем ротацию; хоть раз урожай может подождать чуда."
 tv_engineering_department.7038.b:0 "Форсирование проблемы сейчас лишь заменяет один дефицит на еще больший."
 tv_engineering_department.7039.t:0 "Строительство: Масоны не будут подчиняться новому надзирателю"
 tv_engineering_department.7039.d:0 "Мастера-каменщики не подчиняются молодому надсмотрщику, посланному навести порядок в их сменах, и говорят об этом в пределах слышимости всего двора. Только имя, подкрепленное судебным [prestige|E], имеет достаточный вес, чтобы заставить их подчиниться, и [tv_wonder_organization_competence|E] будет следить за их соблюдением."
 tv_engineering_department.7039.a:0 "Мы сообщаем надзирателю имя суда; каменщики ответят на это, если не на что иное."
 tv_engineering_department.7039.b:0 "Авторитет молодого надсмотрщика должен быть заработан на дворе, а не взят в долг во дворце."
 tv_engineering_department.7040.t:0 "Строительство: Соседний лорд предлагает своего управляющего"
 tv_engineering_department.7040.d:0 "Соседний лорд предлагает нанять своего домашнего управляющего для составления новых списков экипажа, человека, который двадцать лет руководил сменой в одном поместье. Оказание должной услуги обходится дворянам [estate_satisfaction|E], но списки управляющих принесут [tv_wonder_organization_competence|E]."
 tv_engineering_department.7040.a:0 "Мы принимаем управляющего и в долгу перед лордом."
 tv_engineering_department.7040.b:0 "Долг перед этим конкретным лордом стоит больше, чем аккуратные списки."
 tv_engineering_department.7041.t:0 "Конструкция: Shift Horns в ответ на соборные колокола"
 tv_engineering_department.7041.d:0 "Звуковые рожки на этом месте всегда следовали за соборными колоколами, и колокола не будут перемещаться, чтобы устроить чудо. Просьба к капитулу позвонить на дополнительный час, чтобы отметить смену, стоит [estate_satisfaction|E] среди духовенства, но бригады, наконец, сдают свои посты вовремя, принося [tv_wonder_organization_competence|E]."
 tv_engineering_department.7041.a:0 "Мы просим у капитула дополнительный звонок, чего бы нам это ни стоило ворчания."
 tv_engineering_department.7041.b:0 "Колокола отмечают божьи часы, а не смену бригадира."
 tv_engineering_department.7042.t:0 "Строительство: Очередь тележек с материалами на рынке"
 tv_engineering_department.7042.d:0 "Тележки с материалами теперь стоят в очереди на рыночной площади дважды в день, и владельцы ларьков гильдий теряют свои лучшие часы из-за шума и грязи. Расчистка площади для тележек по фиксированному графику обходится горожанам [estate_satisfaction|E], но тележки в конечном итоге прибудут по графику, который бригады могут планировать, принося с собой [tv_wonder_organization_competence|E]."
 tv_engineering_department.7042.a:0 "Фиксируем график и очищаем площадь, есть ли лавки или нет."
 tv_engineering_department.7042.b:0 "Рынок кормит город, прежде чем он кормит чудо."
 tv_engineering_department.7043.t:0 "Строительство: деревням предлагается вторая ротация"
 tv_engineering_department.7043.d:0 "Окрестным деревням предлагается отправить вторую ротацию рабочих, прежде чем нынешние бригады развалятся из-за дублирования постов. Вытаскивание их с собственных участков между посадкой и сбором урожая обходится крестьянам в [estate_satisfaction|E], но полная вторая ротация позволит участку, наконец, работать должным образом, что принесет [tv_wonder_organization_competence|E]."
 tv_engineering_department.7043.a:0 "Вызываем вторую ротацию и оставляем поля ждать своей очереди."
 tv_engineering_department.7043.b:0 "Пустые поля осенью обходятся стране дороже, чем неровный график смен."
 tv_engineering_department.7044.t:0 "Строительство: плацдарм слишком узок, чтобы его можно было пройти."
 tv_engineering_department.7044.d:0 "На плацдарме слишком тесно, чтобы бригады могли пройти друг мимо друга, не прекращая работу, а путаница обходится в час каждое утро. Расчистка прилегающего блока для подходящего двора съедает [development|E] на площадке, но бригады, наконец, двинулись без столкновений, в результате чего появился [tv_wonder_organization_competence|E]."
 tv_engineering_department.7044.a:0 "Мы сносим блок и даем экипажу возможность двигаться."
 tv_engineering_department.7044.b:0 "Блок остается; тесный двор дешевле снесенного."
 tv_engineering_department.7045.t:0 "Строительство: местные возчики незаметно перенаправляются"
 tv_engineering_department.7045.d:0 "Местных возчиков и носильщиков, которые раньше выполняли собственные поручения на объекте, вместо этого незаметно перенаправили на перевозку чудесных материалов, и в результате обычная торговля вокруг завода сократилась. Оформление договоренности, связывание этих рук с графиком чуда, обходится на месте [prosperity|E], но [tv_wonder_organization_competence|E] будет следовать от бригад, которые больше не ждут пропавших тележек."
 tv_engineering_department.7045.a:0 "Оформляем договоренность; возчики теперь подчиняются графику чуда."
 tv_engineering_department.7045.b:0 "Обычная торговля обеспечивает питание жителей этого места; чудо может дождаться своей очереди для тележек."
 tv_engineering_department.7046.t:0 "Строительство: Столица предоставляет своих мастеров"
 tv_engineering_department.7046.d:0 "Собственные строительные предприятия столицы предоставили своих мастеров, чтобы они помогли переформулировать графики смен чуда, и из-за этого кредита собственные проекты столицы оказались в нехватке рабочих рук. Чтобы сделать кредит постоянным, в столице придется заплатить [development|E], но на чудо-сайте останется бригадир, который на самом деле знает, как вести состав, и принесет [tv_wonder_organization_competence|E]."
 tv_engineering_department.7046.a:0 "Делаем кредит постоянным; столичные проекты обойдутся без него."
 tv_engineering_department.7046.b:0 "Столичные предприятия нуждаются в возвращении своего мастера больше, чем чудо нуждается в другом."
 tv_engineering_department.7047.t:0 "Строительство: порядок в гавани изменен"
 tv_engineering_department.7047.d:0 "Столичные торговцы незаметно изменили дни доставки, так что чудо-материалы сначала очищают гавань, а обычная столичная торговля теперь ждет за повозками чуда. Подтверждение нового порядка гавани стоит [prosperity|E] в столице, но сайт, наконец, получит материалы по графику, бригады могут строить смены, доставляя [tv_wonder_organization_competence|E]."
 tv_engineering_department.7047.a:0 "Подтверждаем новый заказ в порту; торговцы со временем приспособятся."
 tv_engineering_department.7047.b:0 "Собственная торговля столицы не должна ждать за стройкой другого города."
 tv_engineering_department.7048.t:0 "Строительство: переобучение требует от экипажей удвоить усилия"
 tv_engineering_department.7048.d:0 "На объекте не хватает двух полных бригад для переобучения новых составов, поэтому уже имеющихся рабочих просят удвоить свои должности, пока не вступит в силу новый график. Неделями тяжелое вождение [population|E] на объекте обходится им очень дорого, но переобучение в конце концов прижилось, и в результате появился [tv_wonder_organization_competence|E]."
 tv_engineering_department.7048.a:0 "На данный момент мы удваиваем количество постов; новые составы стоят усилий."
 tv_engineering_department.7048.b:0 "Измученные экипажи ничему не учатся; переподготовка может подождать отдохнувших рук."
 tv_engineering_department.7049.t:0 "Конструкция: Каждую тележку поддерживает один Ford"
 tv_engineering_department.7049.d:0 "Единственный узкий брод преграждает путь каждой повозке, направляющейся на объект. Интенданту нужен [gold|E] сейчас, для обшивки и оплачиваемой бригады строителей мостов, чтобы [tv_wonder_logistics_competence|E] мог снова двигаться, прежде чем очередь вырастет длиннее, чем сама дорога."
 tv_engineering_department.7049.a:0 "Заплатите мостостроителям и очистите брод."
 tv_engineering_department.7049.b:0 "У казначейства есть лучшее применение этой монете, чем переправа через лужу."
 tv_engineering_department.7050.t:0 "Строительство: землевладельцы отказываются пропускать колонну"
 tv_engineering_department.7050.d:0 "Землевладельцы, проживающие вдоль нового маршрута, отказываются пропускать повозки через свои поля без королевского указа. Проведение [legitimacy|E] короны здесь откроет врата и позволит [tv_wonder_logistics_competence|E] продвинуться вперед, но только по этому пути и только сегодня."
 tv_engineering_department.7050.a:0 "Выдайте приказ и откройте поля для тележек."
 tv_engineering_department.7050.b:0 "Слово короны не распространяется на каждого упрямого землевладельца."
 tv_engineering_department.7051.t:0 "Строительство: дорога для тележек проходит через зеленую часть деревни."
 tv_engineering_department.7051.d:0 "Старая проселочная дорога проходит прямо через деревенскую лужайку, и дорожные мастера хотят ее расширить, перенеся три дома и колодец. Приказ будет продвигать [tv_wonder_logistics_competence|E], но он будет стоить [stability|E] короны, а те, кто останется, будут ворчать."
 tv_engineering_department.7051.a:0 "Отдайте приказ, дома и будь проклят."
 tv_engineering_department.7051.b:0 "Пусть деревня сохранит свою зелень; дорога может огибать его."
 tv_engineering_department.7052.t:0 "Строительство: единственные запасные лошади принадлежат другой гильдии."
 tv_engineering_department.7052.d:0 "Гильдия повозок в соседней провинции владеет единственными запасными тягловыми лошадьми, которые можно взять напрокат. Его хозяева одолжат им и позволят [tv_wonder_logistics_competence|E] догнать его только в качестве услуги, потраченной на придворный [prestige|E], который не безграничен."
 tv_engineering_department.7052.a:0 "Попросите об одолжении и пустите этих лошадей в путь."
 tv_engineering_department.7052.b:0 "Сохраните доброе имя суда для долга, который стоит взыскать."
 tv_engineering_department.7053.t:0 "Строительство: за камень разыскиваются экипажи дворян"
 tv_engineering_department.7053.d:0 "Дорожным мастерам не хватает повозок, и они хотят, чтобы вместо гостей таскали камни собственные каретные бригады местной знати. [tv_wonder_logistics_competence|E] получит распространение, но это будет стоить [estate_satisfaction|E] среди дворян, которые будут ворчать из-за неудобств."
 tv_engineering_department.7053.a:0 "Реквизировать повозки и отправить их на таскание камня."
 tv_engineering_department.7053.b:0 "Оставьте дворянам их экипажи; найдите вагоны в другом месте."
 tv_engineering_department.7054.t:0 "Строительство: Требуется монастырский склад"
 tv_engineering_department.7054.d:0 "У ближайшего монастыря есть единственный сухой склад на всем пути, и дорожные мастера хотят освободить его для зерна и инструментов. Очистка его поможет [tv_wonder_logistics_competence|E] продвигаться вперед, но это будет стоить [estate_satisfaction|E] духовенству, которое не забудет, чьи повозки его заполнили."
 tv_engineering_department.7054.a:0 "Опустошите склад и заложите его припасами."
 tv_engineering_department.7054.b:0 "Оставьте монастырские запасы нетронутыми."
 tv_engineering_department.7055.t:0 "Строительство: Конвою нужна Рыночная площадь"
 tv_engineering_department.7055.d:0 "Конвою нужна рыночная площадь города, чтобы развернуть свои повозки, но эта площадь также является рыночным днем. Закрытие ларьков позволит продвинуть тележки к полудню и помочь [tv_wonder_logistics_competence|E] за счет [estate_satisfaction|E] среди бюргеров, чьи ларьки остались закрытыми."
 tv_engineering_department.7055.a:0 "Закройте рынок и пропустите вагоны."
 tv_engineering_department.7055.b:0 "Рынок остается открытым; вагоны могут подождать сутки."
 tv_engineering_department.7056.t:0 "Строительство: грязный участок дороги поглощает"
 tv_engineering_department.7056.d:0 "Участок дороги превратился в грязь, и ни одна упряжка быков не сможет преодолеть ее в одиночку. Если привязать к веревкам собственных волов и спины деревни, это очистит ее и поможет [tv_wonder_logistics_competence|E], но это будет стоить [estate_satisfaction|E] крестьянам, которым эти волы нужны для весеннего посева."
 tv_engineering_department.7056.a:0 "Привяжите к веревкам быков и спины жителей деревни."
 tv_engineering_department.7056.b:0 "Пусть крестьяне оставят своих волов для весеннего посева."
 tv_engineering_department.7057.t:0 "Строительство: Стационарная площадка не может вместить вагоны."
 tv_engineering_department.7057.d:0 "Складская площадка на объекте слишком тесна для фургонов, прибывающих сейчас ежедневно. Очистка недостроенных складов на его краю освободит место для работы [tv_wonder_logistics_competence|E] за счет [development|E] на месте, уже погруженном в эти склады."
 tv_engineering_department.7057.a:0 "Очистите склады и расширите двор."
 tv_engineering_department.7057.b:0 "Держите склады; вагоны могут стоять в очереди снаружи."
 tv_engineering_department.7058.t:0 "Строительство: трактирщикам приказывают в первую очередь обслуживать конвои"
 tv_engineering_department.7058.d:0 "Владельцам таверны и возчикам, находящимся рядом с этим местом, было приказано сначала оставить запасные запасы для конвоев чуда, продавая всем остальным только то, что осталось. Это позволит поддерживать питание [tv_wonder_logistics_competence|E], но за счет [prosperity|E] на месте, поскольку местная торговля истощается."
 tv_engineering_department.7058.a:0 "В первую очередь держите запасы для конвоев."
 tv_engineering_department.7058.b:0 "Пусть город торгует, как всегда."
 tv_engineering_department.7059.t:0 "Строительство: На дорогу требуются столичные бригады асфальтоукладчиков"
 tv_engineering_department.7059.d:0 "Столичные бригады по укладке тротуарной плитки уже наполовину закончили работу по укладке рыночной улицы, но вместо этого их попросили дорожные мастера, чтобы они укрепили колеи на пути к строительной площадке. Их переназначение подтолкнет [tv_wonder_logistics_competence|E] вперед за счет [development|E] в столице, улица которой остается наполовину мощеной."
 tv_engineering_department.7059.a:0 "Оттяните экипажи с улицы и отправьте их на маршрут."
 tv_engineering_department.7059.b:0 "Сначала закончите рыночную улицу; маршрут может подождать."
 tv_engineering_department.7060.t:0 "Строительство: для маршрута нужны столичные зернохранилища."
 tv_engineering_department.7060.d:0 "Ближайшие к воротам столицы зернохранилища — самый быстрый способ заполнить повозки для маршрута, и дорожные мастера хотят, чтобы их открыли. Продажа резерва поможет [tv_wonder_logistics_competence|E] продвинуться вперед за счет [prosperity|E] в столице, поскольку ее собственные рынки в течение сезона истощаются."
 tv_engineering_department.7060.a:0 "Откройте зернохранилища и наполните вагоны."
 tv_engineering_department.7060.b:0 "Держите зернохранилища закрытыми на случай скудного сезона."
 tv_engineering_department.7061.t:0 "Строительство: рабочих просят разгрузить накопившуюся задолженность"
 tv_engineering_department.7061.d:0 "Единственные руки, свободные для разгрузки припаркованных вагонов, — это у рабочих на объекте, и бригадир хочет, чтобы они отвлеклись от своих обычных задач и перешли на дополнительные смены на канатах. Это могло бы продвинуть [tv_wonder_logistics_competence|E] вперед, но для этого потребуется работающий на объекте [population|E], измученный дополнительными часами."
 tv_engineering_department.7061.a:0 "Переведите рабочих на дополнительные смены и очистите отставание."
 tv_engineering_department.7061.b:0 "Пусть работники занимаются своими обычными делами."
 tv_engineering_department.7062.t:0 "Строительство: краны простаивают из-за нехватки монет"
 tv_engineering_department.7062.d:0 "Подъемные краны простаивают каждые три дня из-за нехватки оплачиваемых бригад, хотя служащий казначейства клянется, что монета лежит непересчитанной в хранилище. Если его отпустить сейчас, веревки снова будут в руках до того, как наступят морозы."
 tv_engineering_department.7062.a:0 "Откройте хранилище и потратьте [gold|E] в две смены, покупая прогресс [tv_wonder_construction|E]."
 tv_engineering_department.7062.b:0 "Оставьте хранилище запечатанным; бригады ждут обычного дня зарплаты."
 tv_engineering_department.7063.t:0 "Строительство: Масоны требуют собственной печати Короны"
 tv_engineering_department.7063.d:0 "Каменщики отказываются пересекать спорные пограничные камни без ордера, скрепленного печатью короны, а не губернатора. Внесение имени государя в приказ сегодня решило бы вопрос, хотя каждый такой приказ, потраченный на карьеристов, на один меньше для суда и совета."
 tv_engineering_department.7063.a:0 "Запечатайте приказ от имени государя, потратив [legitimacy|E] на покупку [tv_wonder_construction|E] прогресса за пограничными камнями."
 tv_engineering_department.7063.b:0 "Уберите королевскую печать и позвольте губернатору самому утверждать границу."
 tv_engineering_department.7064.t:0 "Строительство: две деревни перекрывают дорогу"
 tv_engineering_department.7064.d:0 "Две деревни расположены по обе стороны запланированной транспортной дороги, и их старосты дважды прямо сказали \"нет\". Если приказать им отойти, дорога будет расчищена в течение недели, но ценой спокойствия, которое корона сохраняла с ними после последнего неурожая."
 tv_engineering_department.7064.a:0 "Прикажите деревням уступить дорогу, потратив [stability|E] на очистку [tv_wonder_construction|E] от продвижения по транспортной дороге."
 tv_engineering_department.7064.b:0 "Перенаправьте дорогу вокруг деревень и оставьте старост в покое."
 tv_engineering_department.7065.t:0 "Строительство: Мастер гильдии называет свою цену, чтобы обойти очередь."
 tv_engineering_department.7065.d:0 "Мастер гильдии камнерезов перейдет в очередь к каменщикам чуда только в том случае, если суд потребует выполнения долга, причитающегося со времени последнего государственного визита. Если вы спросите сейчас, заказ переместится в начало книги, но услуга, произнесенная вслух, считается потраченной."
 tv_engineering_department.7065.a:0 "Сделайте запрос и потратьте [prestige|E], чтобы продвинуть ордер вперед, покупая прогресс [tv_wonder_construction|E]."
 tv_engineering_department.7065.b:0 "Пусть заказ останется в силе, а услугу оставьте на потом."
 tv_engineering_department.7066.t:0 "Строительство: Лорд предлагает свои домашние сборы"
 tv_engineering_department.7066.d:0 "Местный лорд предлагает свои домашние сборы для перевозки камня в течение ближайшего месяца, при условии, что никто не упомянет, что его людям был обещан отпуск после последнего сбора. Его стюард уже составляет состав."
 tv_engineering_department.7066.a:0 "Возьмите сборы лорда, потратив [estate_satisfaction|E] дворян на покупку прогресса [tv_wonder_construction|E]."
 tv_engineering_department.7066.b:0 "Откажитесь от рекрутов и позвольте людям лорда отложить обещанный сезон."
 tv_engineering_department.7067.t:0 "Строительство: Фонд богадельни аббатства может покрыть расходы на древесину"
 tv_engineering_department.7067.d:0 "Фонд богадельни аббатства в этом квартале перенасыщен, и настоятель намекнул, что он мог бы покрыть расходы на строительство лесов, если бы корона прямо попросила об этом, а не просто намекнула в ответ. Глава запомнит тот момент, когда будет задан прямой вопрос."
 tv_engineering_department.7067.a:0 "Спросите настоятеля напрямую и потратьте духовенство [estate_satisfaction|E] на древесину строительных лесов, покупая прогресс [tv_wonder_construction|E]."
 tv_engineering_department.7067.b:0 "Пусть богадельня сама финансирует и найдет древесину в другом месте."
 tv_engineering_department.7068.t:0 "Строительство: Вагонные поезда запутываются в базарный день"
 tv_engineering_department.7068.d:0 "Поезда, направлявшиеся к месту чуда, продолжают запутываться в рыночном движении на тех же трех углах. Закрытие этих улиц для торговли в дни доставки сразу распутает маршрут, хотя владельцы ларьков сразу потеряют эти часы таможни."
 tv_engineering_department.7068.a:0 "Закрывайте улицы в дни доставки, тратя горожане [estate_satisfaction|E] на покупку прогресса [tv_wonder_construction|E]."
 tv_engineering_department.7068.b:0 "Оставьте рыночные улицы открытыми и позвольте повозкам ждать своей очереди."
 tv_engineering_department.7069.t:0 "Строительство: к земляным работам приглашаются бригады по земляным работам"
 tv_engineering_department.7069.d:0 "Судебный пристав говорит, что окрестные деревни могут освободить руки для земляных работ, но только те же самые руки уже причитаются за осеннюю канаву, которая предохраняет их собственные поля от затопления. Их составление сейчас означает, что отказ от них ждет."
 tv_engineering_department.7069.a:0 "Направьте деревенских рабочих на земляные работы, потратив [estate_satisfaction|E] крестьян на прогресс [tv_wonder_construction|E]."
 tv_engineering_department.7069.b:0 "Оставьте деревни в запустении и найдите работу в другом месте."
 tv_engineering_department.7070.t:0 "Строительство: старый зерновой склад стоит там, где должны быть подняты леса."
 tv_engineering_department.7070.d:0 "Старый склад зерна, стоящий там, где должны быть построены западные леса, достаточно прочный, чтобы его можно было сохранить, но его камень и его след могли бы одним махом ответить и на нехватку каменщика, и на жалобу геодезиста. Снять его – это быстрый путь."
 tv_engineering_department.7070.a:0 "Снесите зернохранилище, потратив на нем [development|E], чтобы купить прогресс [tv_wonder_construction|E]."
 tv_engineering_department.7070.b:0 "Оставьте зернохранилище стоять и найдите комнату с эшафотами в другом месте."
 tv_engineering_department.7071.t:0 "Строительство: Хозяева таверны тихо поворачиваются навстречу чуду"
 tv_engineering_department.7071.d:0 "Владельцы таверн и возчики этого места начали потихоньку переключать свои обычаи на чудесные поставки, поскольку команды платят наличными, а обычная торговля - нет. Официальное оформление этой договоренности ускорило бы поставки за счет торговли, на которой владельцы строили свой обычай."
 tv_engineering_department.7071.a:0 "Оформите перенаправление, потратив на месте [prosperity|E] и купив прогресс [tv_wonder_construction|E]."
 tv_engineering_department.7071.b:0 "Пусть местная торговля идет своим чередом, а поставки оставьте такими, какие они есть."
 tv_engineering_department.7072.t:0 "Строительство: Один мост или одно чудо"
 tv_engineering_department.7072.d:0 "Ремонт моста в столице застопорился из-за нехватки каменщиков, и каждый каменщик на нем - каменщик, который не режет на удивление. Переназначение экипажа сразу же продвинет чудо вперед, и мост просто будет ждать своей очереди."
 tv_engineering_department.7072.a:0 "Переназначьте команду мостика на чудо, потратив [development|E] в столице на прогресс [tv_wonder_construction|E]."
 tv_engineering_department.7072.b:0 "Оставьте команду мостика там, где они есть, и позвольте мосту закончиться первым."
 tv_engineering_department.7073.t:0 "Строительство: Факторы зерна предлагают свои излишки за определенную цену"
 tv_engineering_department.7073.d:0 "Столичные производители зерна предложили продать излишки прямо в магазины чуда по справедливой цене, при условии, что корона позволит им вывесить продажу на главной площади в качестве доказательства королевской благосклонности. Это прокормит бригады в трудный месяц и заметно сместит рынок в сторону одного покупателя."
 tv_engineering_department.7073.a:0 "Пусть факторы объявят о продаже, потратив [prosperity|E] в капитал, чтобы купить прогресс [tv_wonder_construction|E]."
 tv_engineering_department.7073.b:0 "Откажитесь от публичной продажи и покупайте зерно для экипажей обычными способами."
 tv_engineering_department.7074.t:0 "Строительство: Надзиратель предлагает работать всю ночь"
 tv_engineering_department.7074.d:0 "Надзиратель предлагает руководить собственными бригадами объекта в ночную смену вместо того, чтобы ждать свежих рук от рекрутера, поскольку и факелы, и воля уже есть. К рассвету отставание будет устранено, хотя те же самые люди вернутся с первыми лучами солнца без отдыха."
 tv_engineering_department.7074.a:0 "Закажите ночную смену, потратив на объекте трудящиеся [population|E], чтобы купить прогресс [tv_wonder_construction|E]."
 tv_engineering_department.7074.b:0 "Отправьте экипажи по койкам и ждите свежих рук от рекрутера."
 tv_engineering_department.7075.t:0 "Строительство: Мнение на лесах колеблется"
 tv_engineering_department.7075.d:0 "Публичная демонстрация на этом месте собирает толпу, которая может стать преданными зрителями или обиженными критиками. Эшафоды ждут, пока слухи решат, был ли [tv_wonder_domestic_support|E] полезен или причинен вред."
 tv_engineering_department.7075.a:0 "Пусть демонстрация говорит сама за себя."
 tv_engineering_department.7076.t:0 "Строительство: План перерастает страницу"
 tv_engineering_department.7076.d:0 "Смелая корректировка выводит план за пределы прежних ограничений. Это может стать решением, сделавшим памятник величественным, или запиской, которую будущие клерки подчеркнут красным."
 tv_engineering_department.7076.a:0 "Выводит дизайн за пределы старых ограничений."
 tv_engineering_department.7077.t:0 "Строительство: заказы меняются под навесом"
 tv_engineering_department.7077.d:0 "Под навесами навязывается новая субординация. Это может дисциплинировать верфь или просто научить каждого бригадира новому способу аргументации."
 tv_engineering_department.7077.a:0 "Проталкиваем новую субординацию через двор."
 tv_engineering_department.7078.t:0 "Строительство: Маршрут проходит через грязь"
 tv_engineering_department.7078.d:0 "Рискованный маршрут обещает сократить линию снабжения. Если погода сохранится, это будет расценено как предвидение; если не получится, все вспомнят, кто приказал сделать ход."
 tv_engineering_department.7078.a:0 "Выбирайте более короткую дорогу!"
 tv_engineering_department.7079.t:0 "Строительство: новый метод висит в воздухе"
 tv_engineering_department.7079.d:0 "На активной части опробован более быстрый метод. Это может спасти месяц или заставить следующую команду исправить красивую ошибку."
 tv_engineering_department.7079.a:0 "Пробует более быстрый метод на активном разделе."
 tv_engineering_department.7080.t:0 "Строительство: рабочие опускают свои инструменты из-за невыполненного обещания"
 tv_engineering_department.7080.d:0 "Сегодня утром рабочие бросили свои инструменты, бормоча, что чудо высыхает из серебра короны. Бригадир успокоил их обещанием премиальной заработной платы, обещанием, которое казначейство теперь должно либо выполнить, либо нарушить на глазах у толпы."
 tv_engineering_department.7080.a:0 "Нарушьте обещанную премию и позвольте ропоту рабочих распространиться по сайту."
 tv_engineering_department.7080.b:0 "Уважайте обещанную премию и позвольте ей выйти из казны."
 tv_engineering_department.7081.t:0 "Строительство: брошюра ставит под сомнение печать приказа"
 tv_engineering_department.7081.d:0 "Путешествующий клерк прочитал на площади вслух брошюру, в которой утверждалось, что приказ короны, разрешающий чудо, никогда не был законно запечатан. Независимо от того, останутся ли сомнения по поводу проекта без ответа или в сам приказ будут незаметно внесены поправки, что-то должно измениться."
 tv_engineering_department.7081.a:0 "Оставьте брошюру без ответа и позвольте сомнениям относительно чуда продолжать распространяться."
 tv_engineering_department.7081.b:0 "Спокойно измените формулировку приказа, чтобы ответить на вызов, и примите вмятину в мандате короны."
 tv_engineering_department.7082.t:0 "Строительство: Налог вызывает драку через два дня"
 tv_engineering_department.7082.d:0 "Поступило известие, что набор камневозов для чуда спровоцировал драку между призывниками и жителями деревни в двух днях езды от места строительства. Успокоить его будет стоить чего-то, либо в этом районе, либо у ворот площадки."
 tv_engineering_department.7082.a:0 "Пусть ворота объекта поглотят ропот и позволят беспорядкам в округе угаснуть."
 tv_engineering_department.7082.b:0 "Отправьте войска, чтобы тихо заселить район, прежде чем беспорядки распространятся дальше."
 tv_engineering_department.7083.t:0 "Строительство: Джибе посланника путешествует из порта во дворец"
 tv_engineering_department.7083.d:0 "Иностранный посланник на банкете смеялся, что чудо ползет медленнее, чем плуг, и эта насмешка повторяется теперь во всех тавернах от порта до дворца. Кто-то должен это проглотить: либо авторитет короны за рубежом, либо гордость горожан тем, что строится."
 tv_engineering_department.7083.a:0 "Не обращайте внимания на насмешки посланника и позвольте гордости горожан за чудо нанести удар."
 tv_engineering_department.7083.b:0 "Ответьте посланнику щедрой контрдемонстрацией и потратьте время короны, чтобы заставить его замолчать."
 tv_engineering_department.7084.t:0 "Строительство: Дымение стюарда лорда Олдрика у ворот"
 tv_engineering_department.7084.d:0 "На прошлой неделе новая карьерная дорога была проложена прямо через охотничий заповедник лорда Олдрика, и с тех пор его управляющий злится у ворот. Либо дом лорда будет умиротворен, либо простолюдины, наблюдающие за противостоянием, сделают свои собственные выводы."
 tv_engineering_department.7084.a:0 "Пусть противостояние затянется и не разрешится, а мнение толпы о проекте испортится."
 tv_engineering_department.7084.b:0 "Предоставьте семье лорда официальные извинения и компенсацию, чтобы урегулировать этот вопрос."
 tv_engineering_department.7085.t:0 "Строительство: в траншее фундамента обнаружены старые могилы"
 tv_engineering_department.7085.d:0 "Землекопы, готовившие траншею для фундамента, обнаружили старые могильные камни, которые никто не зарегистрировал, а приходской священник отказывается благословлять дальнейшие работы до тех пор, пока мертвые не будут должным образом перезахоронены. Либо обряды перезахоронения оплачиваются полностью, либо раскопки продолжаются, несмотря на возражения священника."
 tv_engineering_department.7085.a:0 "Откажитесь от решения священника и продолжайте копать, позволяя слухам о потревоженных могилах тревожить толпу."
 tv_engineering_department.7085.b:0 "Заплатите за полный обряд перезахоронения, чтобы удовлетворить священника и приход."
 tv_engineering_department.7086.t:0 "Строительство: Столбы строительных лесов блокируют торговый ряд."
 tv_engineering_department.7086.d:0 "Столбы строительных лесов, проложенные поперек главной улицы, уже шесть дней подряд блокируют движение тележек к торговому ряду, а владельцы ларьков требуют, чтобы кто-нибудь ответил за потерянную торговлю. Либо их потери компенсируются, либо улица остается закрытой, и толпа узнает об этом."
 tv_engineering_department.7086.a:0 "Оставьте торговцев без компенсации и позвольте закрытой улице разжечь ропот толпы."
 tv_engineering_department.7086.b:0 "Компенсируйте торговому ряду за заблокированную торговлю из-под контроля."
 tv_engineering_department.7087.t:0 "Строительство: Созревающие поля стоят неразрезанными"
 tv_engineering_department.7087.d:0 "Сборщики урожая отрывали деревенских рабочих от созревающих полей, чтобы вытащить древесину для чуда, и теперь зерно стоит не срезанным, а у рабочих болят спины на этом участке. То деревни вернут руки за урожай, то толпа услышит, как чудо опустошило поля."
 tv_engineering_department.7087.a:0 "Держите собранные руки на месте и позвольте слухам о стоящем зерне дойти до толпы."
 tv_engineering_department.7087.b:0 "Немедленно отпустите деревенские руки обратно к сбору урожая."
 tv_engineering_department.7088.t:0 "Строительство: Старый квартал кожевенных заводов наполовину снесен"
 tv_engineering_department.7088.d:0 "План каменщиков предусматривает расчистку старого квартала кожевенного завода, чтобы освободить место для фундамента чуда, и половина его разрушилась, прежде чем кто-либо подумал спросить, что его заменит. Либо район сносят, как планировалось, либо план сокращают, и люди начинают спрашивать, почему чуду понадобилось так много места."
 tv_engineering_department.7088.a:0 "Уменьшите высоту и позвольте людям задаться вопросом, почему этому чуду вообще понадобилось так много земли."
 tv_engineering_department.7088.b:0 "Завершите снос квартала кожевенного завода, как и планировалось, и побеспокойтесь о том, что заменит его позже."
 tv_engineering_department.7089.t:0 "Строительство: Рыночная площадка не вернулась"
 tv_engineering_department.7089.d:0 "Плацдарм чуда поглощает еженедельную рыночную площадь третий месяц подряд, а прилавки, заполнявшие ее раньше, просто перестали возвращаться. Либо рыночную землю возвращают, прежде чем она будет забыта, либо двор сохраняет ее, а торговля на этом месте продолжает сокращаться."
 tv_engineering_department.7089.a:0 "Оставьте плацдарм там, где он есть, и позвольте собственной рыночной торговле на этом месте продолжать остывать."
 tv_engineering_department.7089.b:0 "Верните рыночную площадь, прежде чем еженедельные прилавки забудут дорогу назад."
 tv_engineering_department.7090.t:0 "Строительство: Богадельня стоит нетронутой старым мостом."
 tv_engineering_department.7090.d:0 "Городской геодезист реквизировал всех свободных каменщиков столицы для каменной кладки чуда, и в результате недостроенная богадельня у старого моста простояла нетронутой в течение двух месяцев. Либо богадельня ждет, пока чудо свершится, либо каменщиков возвращают в столицу, и строительная площадка медлит, чтобы объяснить, почему."
 tv_engineering_department.7090.a:0 "Пусть каждый каменщик думает о чуде, и пусть недостроенные проекты столицы подождут."
 tv_engineering_department.7090.b:0 "Вспомните каменщиков, чтобы они закончили строительство богадельни, и пусть горожане удивляются задержке."
 tv_engineering_department.7091.t:0 "Строительство: каменные фургоны заполонили лучшую улицу столицы"
 tv_engineering_department.7091.d:0 "Вагоны с тесаным камнем, направлявшиеся к чуду, уже неделю стоят на лучшей торговой улице столицы, и владельцы магазинов говорят, что поток посетителей иссяк, а дорога перекрыта. Либо повозки скоро найдут другой маршрут, либо они останутся, а торговля в столице продолжит остывать."
 tv_engineering_department.7091.a:0 "Оставьте вагоны там, где они есть, и пусть вместо этого вину возьмет на себя прогресс сайта."
 tv_engineering_department.7091.b:0 "Немедленно перенаправьте вагоны и дайте торговой улице столицы снова дышать."
 tv_engineering_department.7092.t:0 "Строительство: обрушение лесов оставило дюжину сломанных зданий"
 tv_engineering_department.7092.d:0 "В результате обрушения строительных лесов три дня назад дюжина рабочих получила переломы костей, а остальная часть бригады теперь ворчит, что никакая зарплата не стоит такого риска. Либо надсмотрщики ускоряют темп, и рабочие начинают ускользать по ночам, либо темп замедляется, и весть об опасности разносится по городу."
 tv_engineering_department.7092.a:0 "Пусть опасность станет обычным разговором в городе и держите всех рабочих на стройке."
 tv_engineering_department.7092.b:0 "Несмотря ни на что, ускоряйте темп и примите тот факт, что напуганные рабочие ускользнут ночью."
 tv_engineering_department.7093.t:0 "Конструкция: Сейф легче, чем заявлено в бухгалтерской книге"
 tv_engineering_department.7093.d:0 "Распорядитель сайта открывает сейф и обнаруживает, что он легче, чем указано в книге. Кто-то уже потратил монеты, которые так и не были подсчитаны, и недостача будет восполнена либо в [tv_wonder_scale_competence|E], либо в [gold|E]."
 tv_engineering_department.7093.a:0 "Уменьшите дизайн, чтобы он соответствовал тому, что сундук все еще может себе позволить."
 tv_engineering_department.7093.b:0 "Покройте дефицит казны и продолжайте масштабное строительство."
 tv_engineering_department.7094.t:0 "Строительство: соперник шепчет, что это не разрешено уставом"
 tv_engineering_department.7094.d:0 "Конкурирующий претендент начал шептаться, что ни одна хартия не допускает установки памятника такого размера. Клерки говорят, что вопрос можно решить спокойно, но не без затрат для [tv_wonder_scale_competence|E] или [legitimacy|E]."
 tv_engineering_department.7094.a:0 "По-тихому изъять из устава самые крупные претензии."
 tv_engineering_department.7094.b:0 "Пусть корона полностью подтвердит хартию и прямо ответит на слухи."
 tv_engineering_department.7095.t:0 "Строительство: три прихода перекрывают дорогу над фундаментом"
 tv_engineering_department.7095.d:0 "Мужчины из трех приходов бросили инструменты на расширенный фундамент, перегородив дорогу телегами. Пристав может их разогнать, но только уступив где-нибудь землю - либо [tv_wonder_scale_competence|E] плана, либо [stability|E] района."
 tv_engineering_department.7095.a:0 "Сузьте фундамент до первоначальной линии и отправьте людей домой довольными."
 tv_engineering_department.7095.b:0 "Отправьте вооруженных людей, чтобы расчистить дорогу и сохранить фундамент."
 tv_engineering_department.7096.t:0 "Строительство: Вестники отказываются путешествовать без оплаты"
 tv_engineering_department.7096.d:0 "Глашатаи, которые должны были провозгласить памятник за границей, два месяца не получали зарплату и теперь отказываются от поездки. Кто-то должен быть удовлетворен сразу, будь то сокращение [tv_wonder_scale_competence|E] дизайна или трата коронного [prestige|E], чтобы купить тишину."
 tv_engineering_department.7096.a:0 "Объявите о меньшем и более дешевом памятнике, и пусть вместо этого это слово несут глашатаи."
 tv_engineering_department.7096.b:0 "Платите глашатаям от имени и репутации короны."
 tv_engineering_department.7097.t:0 "Строительство: управляющий барона считает вдвое больше древесины"
 tv_engineering_department.7097.d:0 "Управляющий барона подсчитал древесину, реквизированную в лесах его господина, и нашел вдвое больше, чем было оговорено. Лорд согласится либо на меньшую долю в дальнейшем, сокращая [tv_wonder_scale_competence|E] плана, либо на официальные извинения и дальнейшие уступки [estate_satisfaction|E] среди дворян."
 tv_engineering_department.7097.a:0 "Сократите будущие квоты на древесину и уменьшите дизайн, чтобы он соответствовал."
 tv_engineering_department.7097.b:0 "Отправьте официальные извинения и дополнительные гранты в дом барона."
 tv_engineering_department.7098.t:0 "Строительство: более широкий неф поглотит старое кладбище"
 tv_engineering_department.7098.d:0 "Епископ узнал, что более широкий дизайн нефа поглотит старое кладбище капитула. Он не благословит работы снова, пока план не будет сокращен или если на жалобы духовенства по поводу [estate_satisfaction|E] не будет дан полный ответ."
 tv_engineering_department.7098.a:0 "Перерисуйте неф, чтобы сохранить место захоронения."
 tv_engineering_department.7098.b:0 "Предоставьте главе новые привилегии, чтобы ответить на их жалобы."
 tv_engineering_department.7099.t:0 "Строительство: Расширенная дорога пересекает склады"
 tv_engineering_department.7099.d:0 "Торговцы шерстью сообщают, что расширенная дорога к месту происшествия прошла прямо через ряд их складов, и товары теперь гниют на перекрестке. Либо дорога снова сужается, урезая [tv_wonder_scale_competence|E] всего подхода, либо корона сразу компенсирует [estate_satisfaction|E] среди бюргеров."
 tv_engineering_department.7099.a:0 "Сузьте подъездную дорогу и пощадите склады."
 tv_engineering_department.7099.b:0 "Возместите торговцам их убытки и держите более широкую дорогу."
 tv_engineering_department.7100.t:0 "Строительство: В этом месяце в деревне похоронены трое мужчин"
 tv_engineering_department.7100.d:0 "Ходят слухи, что в этом месяце в деревне недалеко от карьера похоронены трое мужчин, работавших до темноты по расширенному заказу. Староста говорит, что барщину следует сократить, если только корона не предпочтет ответить за [estate_satisfaction|E] среди крестьян с зерном и серебром вместо сокращения [tv_wonder_scale_competence|E]."
 tv_engineering_department.7100.a:0 "Сократите барщину до уровня, который может вынести деревня."
 tv_engineering_department.7100.b:0 "Отправьте зерно и серебро в деревню и держите барщину, как приказано."
 tv_engineering_department.7101.t:0 "Строительство: ряд домов сносится на рабочую площадку"
 tv_engineering_department.7101.d:0 "Бригадир снес на участке ряд стоящих домов, чтобы расширить рабочую площадку, а горожане спрашивают, что построят на их месте. Ответом будет либо масштабирование конструкции, не оставляя [tv_wonder_scale_competence|E] никакой земли, которая ему не нужна, либо это будет означать дальнейшую очистку и потерю большей части [development|E] сайта."
 tv_engineering_department.7101.a:0 "Остановите дальнейшую расчистку и перерисуйте план, чтобы он соответствовал уже занятой территории."
 tv_engineering_department.7101.b:0 "Прикажите продолжить очистку и позвольте объекту покрыть убытки."
 tv_engineering_department.7102.t:0 "Строительство: Рынок, который когда-то окружал этот участок, исчез"
 tv_engineering_department.7102.d:0 "Рынок, который когда-то окружал строительную площадку, был изгнан строительными лесами и шумом, а прилавки больше не вернулись. Надзиратель должен решить, стоит ли приближать работы, отказываясь от некоторого количества [tv_wonder_scale_competence|E], или позволить [prosperity|E] сайта продолжать истекать кровью, пока рынок остается изгнанным."
 tv_engineering_department.7102.a:0 "Поднимите строительные леса и позвольте рынку вернуться."
 tv_engineering_department.7102.b:0 "Держите работы широко распространенными, и пусть торговля на сайте зачахнет."
 tv_engineering_department.7103.t:0 "Строительство: Каменщики моста были привлечены к чуду"
 tv_engineering_department.7103.d:0 "Каменщиков, призванных для этого чуда, отозвали прямо с ремонта столичного моста, который сейчас незавершен до зимы. Кто-то должен дать: либо [tv_wonder_scale_competence|E] чуда сжимается, чтобы каменщики могли вернуться домой, либо [development|E] столицы остается переждать сезон без ремонта."
 tv_engineering_department.7103.a:0 "Отпустите каменщиков обратно в столицу и уменьшите масштаб чуда."
 tv_engineering_department.7103.b:0 "Оставьте каменщиков в чуде и пусть капитальный ремонт подождет."
 tv_engineering_department.7104.t:0 "Строительство: Ратуши столицы затихли"
 tv_engineering_department.7104.d:0 "Ратуши столицы затихли, их мастера и возчики разошлись, чтобы удовлетворить аппетит чуда к камню и рукам. Совет прямо спрашивает, будет ли проект наконец сокращен до нужного размера, сохранив [tv_wonder_scale_competence|E], или столичный [prosperity|E] должен продолжить финансирование памятника, который он больше не видит построенным на своих улицах."
 tv_engineering_department.7104.a:0 "Уменьшите масштаб конструкции и отпустите членов гильдии обратно в столицу."
 tv_engineering_department.7104.b:0 "Оставьте членов гильдии на этом месте, и пусть столичная торговля и дальше будет платить за это."
 tv_engineering_department.7105.t:0 "Строительство: хирург предупреждает, что еще больше упадет"
 tv_engineering_department.7105.d:0 "Вчера вечером на расширенном ярусе обрушился эшафот, и хирург говорит, что упадут еще больше, если темп реализации более масштабного плана не замедлится. Надзиратель может либо сократить темпы проектирования до уровня, при котором бригады смогут выжить, пощадив [tv_wonder_scale_competence|E], либо продолжить более широкую работу и признать, что трудящиеся на объекте [population|E] будут продолжать сокращаться."
 tv_engineering_department.7105.a:0 "Замедлите темп и сократите план до уровня, который смогут выдержать экипажи."
 tv_engineering_department.7105.b:0 "Продолжайте масштабную работу и примите потери, которые ложатся на плечи рабочих."
 tv_engineering_department.7106.t:0 "Строительство: два клерка дважды подсчитывают одну и ту же недостачу"
 tv_engineering_department.7106.d:0 "Во время вчерашнего подсчета денег в сейфе казначея дважды обнаружились дефекты из-за двух разных клерков. Либо недостающую монету списывают в казну, либо рвут весь сменный состав и переназначают каждую бригаду из ничего. [tv_wonder_organization_competence|E] или [gold|E] оплатят арифметику клерков."
 tv_engineering_department.7106.a:0 "Разорвите штат смен и переназначьте каждую бригаду с нуля."
 tv_engineering_department.7106.b:0 "Недостающую монету спишите в казну и оставьте реестр посчитанным."
 tv_engineering_department.7107.t:0 "Строительство: бригадам зачитывается вслух поддельный грант"
 tv_engineering_department.7107.d:0 "Кричащий, которого не узнает ни один бригадир, на глазах у бригад зачитал поддельное предоставление прав на лесоматериалы конкурирующему лорду. Преследование этого человека и опровержение заявления до того, как собравшиеся рабочие снимут каждого мастера со своего поста на весь день. Оставление подделки без ответа не дает бригадам работать, но в тавернах претензию уже повторяют как факт. [tv_wonder_organization_competence|E] или [legitimacy|E] будут нести ложь фальсификатора."
 tv_engineering_department.7107.a:0 "Освободите каждого бригадира от его поста, чтобы выследить крикуна и внести ясность."
 tv_engineering_department.7107.b:0 "Пусть поддельное заявление останется без ответа, а экипажи продолжат работать."
 tv_engineering_department.7108.t:0 "Строительство: спичка вылилась на улицу"
 tv_engineering_department.7108.d:0 "Спичка, брошенная в столовую, с половиной мешка испорченного зерна вылетела из ворот на улицу прежде, чем часы развалили ее на части. Экипажи можно перетасовать и накормить в разное время, чтобы две банды никогда больше не встретились, или стража может произвести аресты на открытой площади, чтобы окончательно уладить дело. [tv_wonder_organization_competence|E] или [stability|E] отвечает за испорченное зерно."
 tv_engineering_department.7108.a:0 "Перетасуйте каждую смену, чтобы пути двух банд больше никогда не пересекались."
 tv_engineering_department.7108.b:0 "Пусть часы остановятся на открытой площади."
 tv_engineering_department.7109.t:0 "Строительство: Посланник прибывает к беспилотным воротам"
 tv_engineering_department.7109.d:0 "Иностранный посланник прибыл на целый день раньше и обнаружил, что у ворот почета никого нет, а знамена все еще сложены в груди. Список дежурств можно разорвать на месте, чтобы собрать надлежащий прием, или посланника можно пройти по объекту точно так, как он есть, и доложить домой так, как он его увидел. [tv_wonder_organization_competence|E] или [prestige|E] оплачивает раннее прибытие."
 tv_engineering_department.7109.a:0 "Разорвите дежурный состав на месте, чтобы организовать должный прием."
 tv_engineering_department.7109.b:0 "Проведите посланника по сайту в том виде, в каком он есть."
 tv_engineering_department.7110.t:0 "Строительство: одолженные волы просрочены с Михайловского праздника"
 tv_engineering_department.7110.d:0 "Упряжки быков, одолженные в поместье соседнего лорда, должны были вернуться к Михайлову празднику и все еще тащат камень после установленного срока. Упряжки можно отправить домой в соответствии с графиком, а бригады буксировщиков перегруппировать так, чтобы они тащили груз вручную, или можно оставить волов еще на две недели, пока управляющему лорда прикажут подождать. [tv_wonder_organization_competence|E] или [estate_satisfaction|E] среди дворян возят просроченных волов."
 tv_engineering_department.7110.a:0 "Отправьте волов домой по графику и переорганизуйте бригады для буксировки вручную."
 tv_engineering_department.7110.b:0 "Оставьте волов еще на две недели и скажите управителю господина подождать."
 tv_engineering_department.7111.t:0 "Строительство: Молоты заглушили процессию реликвий"
 tv_engineering_department.7111.d:0 "На этой неделе каменщики продолжали пробиваться сквозь процессию реликвий, и пение не было слышно на расстоянии трех улиц. Календарь смен теперь может быть перерисован для каждого праздника и дня крестного хода, или же маршрут крестного хода можно просто переместить, и духовенству будет сказано, что работа из-за этого не будет останавливаться. [tv_wonder_organization_competence|E] или [estate_satisfaction|E] среди духовенства отвечают на шум."
 tv_engineering_department.7111.a:0 "Перерисуйте календарь смен вокруг каждого праздника и дня шествия."
 tv_engineering_department.7111.b:0 "Перенесите маршрут крестного хода и скажите священнослужителям, что работы не остановятся."
 tv_engineering_department.7112.t:0 "Строительство: Вагоны перекрывают дорогу зерновому рынку."
 tv_engineering_department.7112.d:0 "Ряд фургонов блокирует погрузочную полосу зернового рынка уже шесть дней подряд, а торговая гильдия перестала присылать своего клерка жаловаться лично. График доставки может быть разорван на части и перестроен в соответствии с более длинным маршрутом, который будет сохранять полосу свободной, или фургоны могут оставаться на месте, пока гильдии придется изменить маршрут своих собственных дел. [tv_wonder_organization_competence|E] или [estate_satisfaction|E] среди бюргеров расплачивается за перекрытую полосу."
 tv_engineering_department.7112.a:0 "Разорвите график доставки и перестройте его на более длинный маршрут."
 tv_engineering_department.7112.b:0 "Оставьте повозки там, где они стоят, и позвольте гильдии изменить маршрут."
 tv_engineering_department.7113.t:0 "Строительство: Сезон посадки наступает без рук"
 tv_engineering_department.7113.d:0 "Барщины, которые должны вернуться в свои деревни для посадки, все еще режут камень, и пришло известие, что в этом году поля останутся незасеянными без них. Банды можно освободить по графику и восстановить рабочие смены на объекте из тех, кто остался, или можно задержать барщину после окончания срока, пока деревни обходятся без рабочих рук. [tv_wonder_organization_competence|E] или [estate_satisfaction|E] у крестьян платит за незасеянные поля."
 tv_engineering_department.7113.a:0 "Освободите барщинные бригады по графику и восстановите смены участка из оставшихся."
 tv_engineering_department.7113.b:0 "Отложите барщину досрочно, и пусть деревни обходятся."
 tv_engineering_department.7114.t:0 "Строительство: обрушившаяся стена смотрит на собственное тротуарное покрытие."
 tv_engineering_department.7114.d:0 "Подпорная стена рухнула в одночасье, и ближайшим имеющимся под рукой обработанным камнем оказался тротуар, уже уложенный вдоль подъездной дороги к участку. Мощение можно оставить там, где оно лежит, и каждая свободная рука вместо этого будет выполнять другие задачи по добыче свежего камня, или можно просто снова разобрать дорогу, чтобы залатать стену до утра. [tv_wonder_organization_competence|E] или [development|E] на объекте платят за обрушившуюся стену."
 tv_engineering_department.7114.a:0 "Освободите все руки от других задач и вместо этого добудьте свежий камень."
 tv_engineering_department.7114.b:0 "Снова разберите подъездную дорогу, чтобы к утру залатать стену."
 tv_engineering_department.7115.t:0 "Строительство: Продавцы хлеба задерживают задолженность по зарплате"
 tv_engineering_department.7115.d:0 "Продавцы хлеба на лагерном рынке собрались и ушли после того, как зарплату за прошлую неделю выдали с опозданием на три дня и половину зарплаты обрезанными монетами. Заработную плату можно перевести на более строгий и более частый график, чтобы переманить продавцов обратно, разорвав для этого текущий график заработной платы, или же лагерь может просто остаться без рынка, и рабочие смогут сами обеспечивать себя едой. [tv_wonder_organization_competence|E] или [prosperity|E] на объекте оплачивает задолженность по заработной плате."
 tv_engineering_department.7115.a:0 "Разорвите график заработной платы и перепишите его на более строгий график, чтобы переманить продавцов обратно."
 tv_engineering_department.7115.b:0 "Оставьте лагерь без рынка и предоставьте работникам самим добывать еду."
 tv_engineering_department.7116.t:0 "Строительство: строительные леса моста исчезают в одночасье"
 tv_engineering_department.7116.d:0 "Строительные леса, готовые к ремонту моста в столице, ночью были незаметно погружены в строительные вагоны, а прибывшая бригада моста обнаружила, что их лес пропал. Собственные линии снабжения объекта можно удлинить, а его смены вместо этого перестроить вокруг более дальнего источника древесины, или же столичный мост может просто подождать, пока его балки сначала завершат чудо. [tv_wonder_organization_competence|E] или [development|E] в столице платят за недостающие строительные леса."
 tv_engineering_department.7116.a:0 "Удлините маршруты снабжения объекта и перестройте его смены вокруг более дальнего источника древесины."
 tv_engineering_department.7116.b:0 "Пусть столичный мост подождет, пока его балки первыми завершат чудо."
 tv_engineering_department.7117.t:0 "Строительство: В полдень зал гильдии пустует."
 tv_engineering_department.7117.d:0 "Половина столичных стекольщиков и столяров находится на этом объекте уже три недели подряд, а зал гильдии дома в полдень почти пуст. Мастера могут быть отправлены домой, а бригады на местах перестроены вокруг оставшихся учеников, или мастера могут просто остаться на месте, пока собственные столичные мастерские еще какое-то время простаивают. [tv_wonder_organization_competence|E] или [prosperity|E] в столице платят за пустой зал гильдии."
 tv_engineering_department.7117.a:0 "Возвращайте мастеров домой и восстанавливайте бригады на местах из оставшихся учеников."
 tv_engineering_department.7117.b:0 "Оставьте мастеров на месте, а столичные мастерские пусть простаивают."
 tv_engineering_department.7118.t:0 "Конструкция: платформа с короткими руками теряет веревку"
 tv_engineering_department.7118.d:0 "Сегодня утром подъемный трос разорвался, когда немногочисленная команда сгрудилась на платформе, чтобы успеть на час, и вместе с ним затонули трое мужчин. Резервные бригады могут быть отозваны от своих собственных задач и брошены на платформу завтра, независимо от того, как это повлияет на график, или же та же команда может быть отправлена обратно в нехватке, как только раненые будут унесены. [tv_wonder_organization_competence|E] или работающий [population|E] на объекте платит за разорванную веревку."
 tv_engineering_department.7118.a:0 "Отвлеките резервные банды от их собственных задач и бросьте их на платформу, к черту график."
 tv_engineering_department.7118.b:0 "Отправьте ту же неполную команду обратно, как только унесут раненых."
 tv_engineering_department.7119.t:0 "Строительство: из-за прогнутого моста колонна застряла в грязи"
 tv_engineering_department.7119.d:0 "Мост через дорогу снабжения прогнулся под тяжестью каменных тележек, и половина колонны теперь застряла в грязи под ним. Паромщики на переправе говорят, что переправят вагоны за определенную плату, и кто-то так или иначе заплатит ее."
 tv_engineering_department.7119.a:0 "Оставьте вагоны там, где они стоят, а остальные направьте вокруг разрушенного моста, чего бы это ни стоило [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7119.b:0 "Заплатите цену перевозчикам из казны, чтобы переправить фургоны сегодня, истощив [gold|E]."
 tv_engineering_department.7120.t:0 "Строительство: Печать платных ворот больше не соблюдается"
 tv_engineering_department.7120.d:0 "Всадники конвоя были остановлены у соседнего контрольно-пропускного пункта, на их уставе стояла печать, которую местный лорд больше не чтит. Кто-то должен решить, открыть ли ворота во имя короны или оставить повозки снаружи."
 tv_engineering_department.7120.a:0 "Поверните конвой назад и найдите более длинный маршрут вокруг спорного пункта взимания платы, позволяя [tv_wonder_logistics_competence|E] ускользнуть."
 tv_engineering_department.7120.b:0 "Призовите власть короны, чтобы открыть врата прямо сейчас, потратив [legitimacy|E] на еще не урегулированный спор."
 tv_engineering_department.7121.t:0 "Строительство: жители деревни перекрыли дорогу из-за третьей заявки"
 tv_engineering_department.7121.d:0 "Жители деревни заблокировали дорогу своими повозками, отказываясь двигаться до тех пор, пока не будет отменена третья в этом сезоне реквизиция. Конвой не может пройти, не отступив или не приведя солдат, чтобы расчистить путь."
 tv_engineering_department.7121.a:0 "Отступите, перенаправьте конвой вокруг блокады и примите остановку, которую это оставляет в [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7121.b:0 "Отправьте солдат силой расчистить дорогу и посчитайте стоимость в [stability|E]."
 tv_engineering_department.7122.t:0 "Строительство: Бригадиру отказываются от лошадей в присутствии свидетелей"
 tv_engineering_department.7122.d:0 "На конкурирующем дворе бригадиру конвоя отказали в свежих тяжеловозах и отослали на глазах у свидетелей. Получить лошадей сейчас означает потребовать от суда услуг, которые позорят суд; если их не получить, это означает, что вагоны проползут остаток пути."
 tv_engineering_department.7122.a:0 "Отправьте бригадира с усталыми лошадьми, которые у него уже есть, и пусть задержка скажется на [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7122.b:0 "Публично обратитесь за помощью, чтобы пристыдить конкурирующий двор и заставить его передать свежих лошадей, потратив на это [prestige|E]."
 tv_engineering_department.7123.t:0 "Строительство: Возчики захватывают лошадей благородного дома."
 tv_engineering_department.7123.d:0 "Извозчики конвоя конфисковали каретные лошади благородного дома, когда упряжки чуда потерпели неудачу, и домочадцы требуют вернуть их до наступления темноты. Возвращение лошадей останавливает повозки; их хранение лишает домочадцев терпения."
 tv_engineering_department.7123.a:0 "Верните лошадей в благородный дом сегодня вечером и оставьте повозки ждать без них, заплатив [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7123.b:0 "Оставьте взятых напрокат лошадей работать в конвое еще некоторое время, что бы это ни сделало с [estate_satisfaction|E] среди дворян."
 tv_engineering_department.7124.t:0 "Строительство: Вагоны проехали в праздничный день"
 tv_engineering_department.7124.d:0 "Самая короткая дорога пролегает через территорию монастыря, и в праздничный день повозки проезжали по ней, прежде чем кто-либо догадался попросить разрешения. Монахи закрыли ворота и хотят, чтобы конвой либо повернули назад, либо за него ответили."
 tv_engineering_department.7124.a:0 "Поверните повозки назад и найдите другой путь вокруг территории монастыря, пусть объезд будет стоить [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7124.b:0 "Протолкните конвой через ворота, как и планировалось, и оставьте преступника [estate_satisfaction|E] среди духовенства."
 tv_engineering_department.7125.t:0 "Строительство: Конвой пережидает бурю на Рыночной площади."
 tv_engineering_department.7125.d:0 "Колонна припарковала свои фургоны на рыночной площади города на ночь, чтобы переждать бурю, и с тех пор владельцы ларьков не смогли открыться. Торговцы требуют, чтобы площадь была очищена сегодня, несмотря на бурю или ее отсутствие."
 tv_engineering_department.7125.a:0 "Выведите фургоны на улицу прямо сейчас и позвольте шторму замедлить [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7125.b:0 "Задержите фургоны на площади еще немного и позвольте гневу торговцев обрушиться на [estate_satisfaction|E] среди бюргеров."
 tv_engineering_department.7126.t:0 "Строительство: одна и та же деревня теряет быков в третий раз"
 tv_engineering_department.7126.d:0 "В этом месяце в одной и той же деревне трижды реквизировали волов и повозки для конвоя, а поля остаются невспаханными. Либо животные возвращаются к плугу, либо повозки тянутся сами."
 tv_engineering_department.7126.a:0 "Отправьте волов обратно в поля и позвольте конвою идти без них, ценой [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7126.b:0 "Реквизируйте волов в четвертый раз, и пусть усталость деревни проявится в [estate_satisfaction|E] среди крестьян."
 tv_engineering_department.7127.t:0 "Строительство: оползень перекрыл дорогу к месту строительства"
 tv_engineering_department.7127.d:0 "Оползень похоронил на этом участке последний участок дороги, и единственным быстрым решением является снести недавно проложенные плацдармы для заполнения и обшивки. Либо объект откажется от своих наработок, либо колонна будет ждать за пределами горки."
 tv_engineering_department.7127.a:0 "Оставьте плацдармы нетронутыми и позвольте конвою оставаться за пределами горки, ценой [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7127.b:0 "Разберите недавно уложенные дворы, чтобы насыпать и обшить дорогу, потратив на этом месте [development|E]."
 tv_engineering_department.7128.t:0 "Строительство: необходимо расширить дорогу за пределы рабочих ларьков"
 tv_engineering_department.7128.d:0 "Вагонам нужно расширить дорогу мимо собственных ларьков рабочих, а торговцам там больше негде торговать. Либо ларьки опускаются, чтобы пропустить колонну, либо фургоны проползают мимо."
 tv_engineering_department.7128.a:0 "Пусть фургоны проползут мимо и оставят ларьки стоять, ценой [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7128.b:0 "Очистите ларьки торговцев, чтобы расширить дорогу для конвоя, потратив на месте [prosperity|E]."
 tv_engineering_department.7129.t:0 "Строительство: Улицы столицы рвут, чтобы вытеснить колонну"
 tv_engineering_department.7129.d:0 "Столичные возчики и бригады булыжников были отстранены от своей обычной работы, чтобы протолкнуть застрявшую колонну на последней миле до города. Улицы столицы полуразрыты и полупусты для него, ждут ли фургоны или нет."
 tv_engineering_department.7129.a:0 "Отправьте столичные бригады обратно на работу и позвольте конвою остановиться у ворот за цену [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7129.b:0 "Не позволяйте столичным бригадам убираться с улиц, чтобы закончить затаскивание фургонов, потратив [development|E] в столице."
 tv_engineering_department.7130.t:0 "Строительство: Застой груза занял Рыночную площадь столицы"
 tv_engineering_department.7130.d:0 "Конвой реквизировал центральную рыночную площадь столицы, чтобы хранить застрявший груз чуда, и караваны, которые обычно там торгуют, были заблокированы на неделю. Либо груз уйдет, и рынок вновь откроется, либо площадь еще какое-то время останется складом."
 tv_engineering_department.7130.a:0 "Немедленно вывезите груз, хотя и грубо, и примите нагрузку на [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7130.b:0 "Оставьте груз на площади и держите караваны закрытыми, потратив [prosperity|E] в столице."
 tv_engineering_department.7131.t:0 "Строительство: рабочих привязывают к веревкам вместо волов"
 tv_engineering_department.7131.d:0 "Поскольку тягловый скот иссяк, а свежих не оказалось, бригадиры начали привязывать рабочих к веревкам, чтобы вручную тащить застрявшие тележки. Либо люди продолжают тащить груз, преодолев усталость, либо тележки остаются там, где застряли."
 tv_engineering_department.7131.a:0 "Оставьте тележки на месте, вместо того чтобы работать с людьми дальше, за это придется заплатить [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7131.b:0 "Заставляйте рабочих тянуть веревки, пока тележки не начнут двигаться, тратя трудящиеся [population|E] на стройплощадке."
 tv_engineering_department.7132.t:0 "Строительство: камнерезы прекращают работу, им не платят зарплату"
 tv_engineering_department.7132.d:0 "Гильдия камнерезов прекратила работу, не получая зарплату уже два месяца подряд. Их бригадир стоит у ворот с гроссбухом и сжатым кулаком, и кто-то должен открыть или двор, или казну."
 tv_engineering_department.7132.a:0 "Пусть катера идут, а прогресс [tv_wonder_construction|E] подождет."
 tv_engineering_department.7132.b:0 "Погасите задолженность в [gold|E] и продолжайте работу."
 tv_engineering_department.7133.t:0 "Строительство: Претендент ссылается на недостающий ордер"
 tv_engineering_department.7133.d:0 "До совета дошел слух, что каменщиков на стройке наняли без обычного предписания, и претендент уже ссылается на это как на доказательство того, что корона правит по прихоти. Кто-то должен ответить за сокращение пути – либо сама работа, либо мандат, предписавший ее."
 tv_engineering_department.7133.a:0 "Вспомните сбор и позвольте прогрессу [tv_wonder_construction|E] отстать."
 tv_engineering_department.7133.b:0 "Поддержите приказ, и пусть это будет стоить короны [legitimacy|E]."
 tv_engineering_department.7134.t:0 "Строительство: жители деревни блокируют путь тележки своими телами"
 tv_engineering_department.7134.d:0 "Жители деревни, чьи общины были огорожены от дороги карьера, заблокировали проезжую часть своими телами. Либо подводы сегодня вечером вернутся назад, либо солдаты расчистят дорогу, и деревня об этом запомнит."
 tv_engineering_department.7134.a:0 "Разверните тележки назад и дайте прогрессу [tv_wonder_construction|E] подождать."
 tv_engineering_department.7134.b:0 "Отправьте охранника расчистить путь и потратьте [stability|E], которого он стоит."
 tv_engineering_department.7135.t:0 "Строительство: Посол осматривает полуразрушенные леса"
 tv_engineering_department.7135.d:0 "Иностранный посол рано утром посетил это место и обнаружил, что эшафот наполовину рухнул на зеленый раствор; его отчет домой уже готовится. Надзиратель может остановить работу, чтобы переделать ее должным образом, или позволить послу написать то, что он увидел."
 tv_engineering_department.7135.a:0 "Удалите неисправный раздел и позвольте прогрессу [tv_wonder_construction|E] вернуться вспять."
 tv_engineering_department.7135.b:0 "Оставьте эшафот стоять, и пусть письмо будет стоить короны [prestige|E]."
 tv_engineering_department.7136.t:0 "Строительство: Лорд обнаруживает свой охотничий заповедник, отмеченный для карьера"
 tv_engineering_department.7136.d:0 "Местный лорд обнаружил, что в его охотничьем заповеднике указана добыча чуда, и в ярости поехал в суд, требуя, чтобы геодезисты ушли или ответили за честь его семьи. Кто-то внизу должен уступить место."
 tv_engineering_department.7136.a:0 "Отзовите геодезистов, и пусть прогресс [tv_wonder_construction|E] отстанет."
 tv_engineering_department.7136.b:0 "Удерживайте линию карьера, и пусть это будет стоить [estate_satisfaction|E] дворянам."
 tv_engineering_department.7137.t:0 "Строительство: Фонд обнаружил старое кладбище"
 tv_engineering_department.7137.d:0 "Землекопы, готовившие фундамент, обнаружили старое приходское кладбище, которое никто не зарегистрировал, и священники отказываются благословлять дальнейшие работы, пока оно не будет должным образом перезахоронено. Кто-то должен выбирать между лопатами и таинствами."
 tv_engineering_department.7137.a:0 "Остановите землекопов, пока не завершится обряд перезахоронения, и дайте прогрессу [tv_wonder_construction|E] подождать."
 tv_engineering_department.7137.b:0 "Прикажите продолжить раскопки, и пусть это будет стоить [estate_satisfaction|E] среди духовенства."
 tv_engineering_department.7138.t:0 "Строительство: Каменные тележки поглотили Торговую площадь."
 tv_engineering_department.7138.d:0 "Торговая площадь вот уже неделю наполовину завалена каменными телегами, и мастера гильдий говорят, что еще одна неделя испортит осеннюю ярмарку. Либо повозки сегодня вечером найдут новый маршрут, либо ярмарка откроется на строительной площадке."
 tv_engineering_department.7138.a:0 "Измените маршрут тележек и позвольте [tv_wonder_construction|E] продвигаться медленно."
 tv_engineering_department.7138.b:0 "Оставьте тележки на площади и пусть среди бюргеров это будет стоить [estate_satisfaction|E]."
 tv_engineering_department.7139.t:0 "Строительство: Корвейные бригады пропускают последнюю засушливую неделю"
 tv_engineering_department.7139.d:0 "Барщинные бригады, привлеченные из трех деревень для участия в походе в этом месяце, пропустили последнюю засушливую неделю сбора урожая, и старосты задаются вопросом, что на первом месте — их поля или чудо. Один из двоих должен отдать."
 tv_engineering_department.7139.a:0 "Отправьте бригады обратно на поля и позвольте [tv_wonder_construction|E] продвигаться медленно."
 tv_engineering_department.7139.b:0 "Оставьте бригады на объекте и пусть среди крестьян это будет стоить [estate_satisfaction|E]."
 tv_engineering_department.7140.t:0 "Строительство: обрушившаяся стена похоронила собственные мастерские объекта."
 tv_engineering_department.7140.d:0 "Подпорная стена в одночасье рухнула и похоронила недостроенные мастерские и магазины, выросшие вокруг этого места. Их правильное восстановление в любом случае будет стоить сайту чего-то – будь то труд, затраченный на чудо, или то, что стоит вокруг него."
 tv_engineering_department.7140.a:0 "Отвлеките бригады от чуда, чтобы укрепить мастерские, и позвольте прогрессу [tv_wonder_construction|E] отступить."
 tv_engineering_department.7140.b:0 "Оставьте мастерские развалинами и пусть они стоят на месте [development|E]."
 tv_engineering_department.7141.t:0 "Строительство: разносчиков гонят на новый склад"
 tv_engineering_department.7141.d:0 "Коробейники и небольшие мастерские, которые возникли, чтобы кормить рабочие бригады, на этой неделе были изгнаны, чтобы расчистить место для нового склада, и вместе с ними небольшая экономика этого объекта затихла. Склад или собственная торговля участка — одно из двух держит позиции."
 tv_engineering_department.7141.a:0 "Верните землю торговцам и позвольте прогрессу [tv_wonder_construction|E] ждать на складе."
 tv_engineering_department.7141.b:0 "Сохраните склад и пусть он стоит [prosperity|E] на площадке."
 tv_engineering_department.7142.t:0 "Строительство: Все каменщики в столице реквизированы"
 tv_engineering_department.7142.d:0 "Ремонт столичного моста застопорился, потому что все каменщики и повозки в городе были реквизированы для последнего рывка чуда. Магистраты хотят вернуть свои команды до того, как пролет выйдет из строя; сайт хочет, чтобы они продлились еще на месяц."
 tv_engineering_department.7142.a:0 "Отпустите каменщиков обратно в столицу и позвольте [tv_wonder_construction|E] продвигаться медленно."
 tv_engineering_department.7142.b:0 "Оставьте каменщиков на объекте и пусть в столице стоит [development|E]."
 tv_engineering_department.7143.t:0 "Строительство: Каменные телеги закроют две улицы в столице"
 tv_engineering_department.7143.d:0 "Телеги с тесаным камнем, катящиеся по рыночному району столицы, закрыли две улицы на неделю, и владельцы магазинов говорят, что торговля уже перемещается в другие места. Либо конвои найдут более длинный маршрут, либо район продолжит терять традиции."
 tv_engineering_department.7143.a:0 "Измените маршрут конвоев на долгий путь и позвольте прогрессу [tv_wonder_construction|E] отстать."
 tv_engineering_department.7143.b:0 "Держите конвои на коротком маршруте и пусть в столице это будет стоить [prosperity|E]."
 tv_engineering_department.7144.t:0 "Строительство: По рабочему городку распространяется лихорадка"
 tv_engineering_department.7144.d:0 "По рабочему лагерю прошла лихорадка, и врачи говорят, что больным необходимо отдохнуть, иначе болезнь распространится на всю бригаду. Кто-то должен выбрать между тем, чтобы пройти через это и потерять работу, или остановить их и потерять рабочих."
 tv_engineering_department.7144.a:0 "Остановите экипажи, чтобы они могли прийти в себя, и позвольте прогрессу [tv_wonder_construction|E] замедлиться."
 tv_engineering_department.7144.b:0 "Проведите через это больных, и пусть это будет стоить трудящемуся [population|E] на месте."
 tv_engineering_department.7145.t:0 "Строительство: новый пробел в казначействе"
 tv_engineering_department.7145.d:0 "Чудо вытягивает монеты быстрее, чем ожидали бухгалтерские книги. Казначейство может объяснить дефицит, но объяснение не чеканит серебро."
 tv_engineering_department.7145.a:0 "Растягивает бухгалтерские книги, чтобы закрыть пробел."
 tv_engineering_department.7146.t:0 "Строительство: Пыль на Королевской печати"
 tv_engineering_department.7146.d:0 "Королевская поддержка распространяется на слишком много компромиссов. Уплотнение все еще держится, но выглядит тоньше."
 tv_engineering_department.7146.a:0 "Королевская печать становится тоньше."
 tv_engineering_department.7147.t:0 "Строительство: тихие города нарушены"
 tv_engineering_department.7147.d:0 "Ритм строительства давит на обыденную жизнь. Рынки открываются поздно, деревни ворчат, а порядок подрывает почву."
 tv_engineering_department.7147.a:0 "Мы позволяем деревням ворчать и продолжать двигаться вперед, несмотря ни на что."
 tv_engineering_department.7148.t:0 "Строительство: Суд теряет цвет"
 tv_engineering_department.7148.d:0 "Суд придает произведениям цвет и получает взамен пыль. Престиж тускнеет от мелких публичных шуток и незаконченных хвастовств."
 tv_engineering_department.7148.a:0 "Немного блеска меняет на несколько придворных шуток."
 tv_engineering_department.7149.t:0 "Строительство: Холодные слова за благородными столами"
 tv_engineering_department.7149.d:0 "Благородные семьи снова уступают место. Уступка носит формальный и холодный характер, что зачастую хуже отказа."
 tv_engineering_department.7149.a:0 "Принимает холодную формальную уступку дворян."
 tv_engineering_department.7150.t:0 "Строительство: Хмурится перед алтарем"
 tv_engineering_department.7150.d:0 "Священный календарь снова склоняется к рабочему месту. Духовенство подчиняется, но у послушания есть границы."
 tv_engineering_department.7150.a:0 "Мы принимаем послушание духовенства, края и все такое."
 tv_engineering_department.7151.t:0 "Строительство: более тонкие книги на рынке"
 tv_engineering_department.7151.d:0 "Рыночный бизнес зациклен на проекте. Горожане могут извлечь выгоду из величия, но не тогда, когда все пути к нему перекрыты."
 tv_engineering_department.7151.a:0 "Расчищайте дороги и продолжайте строить!"
 tv_engineering_department.7152.t:0 "Строительство: более тяжелые спины в деревнях"
 tv_engineering_department.7152.d:0 "Сельские плечи берут на себя очередную нагрузку. Проект продвигается вперед, и деревенское терпение становится все тоньше."
 tv_engineering_department.7152.a:0 "Перекладывает дополнительную нагрузку на плечи сельских жителей."
 tv_engineering_department.7153.t:0 "Строительство: участок отказывается от улиц"
 tv_engineering_department.7153.d:0 "Сайт отказывается от своей обычной ткани. Будущее чудо обретает пространство, в то время как нынешние улицы теряют смысл."
 tv_engineering_department.7153.a:0 "Указатели на этих улицах для завтрашнего чуда."
 tv_engineering_department.7154.t:0 "Строительство: на участке становится тише"
 tv_engineering_department.7154.d:0 "Это место становится коммерчески тише, поскольку обычная биржа приближается к памятнику. Процветание можно перенаправить лишь определенное количество раз, прежде чем оно уменьшится."
 tv_engineering_department.7154.a:0 "Мы снова направляем торговлю на этом месте к памятнику."
 tv_engineering_department.7155.t:0 "Строительство: Капитальные проекты уступают дорогу"
 tv_engineering_department.7155.d:0 "Капитальные проекты снова уступают место чуду. Королевский город остается величественным, но часть его облика заимствована."
 tv_engineering_department.7155.a:0 "Придает чуду облик столицы."
 tv_engineering_department.7156.t:0 "Строительство: тише улицы столицы"
 tv_engineering_department.7156.d:0 "Рынки столицы немного теряют яркость, поскольку проект привлекает кредиты и товары. Суд может назвать это патриотическим; торговцы называют это более медленной торговлей."
 tv_engineering_department.7156.a:0 "Каждый памятник откуда-то заимствует свою яркость."
 tv_engineering_department.7157.t:0 "Строительство: Имена добавлены в список травм"
 tv_engineering_department.7157.d:0 "Имена добавляются в список травм. Работа продолжается, но каждая новая отметка меняет взгляд рабочих на камень."
 tv_engineering_department.7157.a:0 "Запомните имена и продолжайте!"
 tv_engineering_department.7158.t:0 "Строительство: Тишина у дверей сокровищницы"
 tv_engineering_department.7158.d:0 "Жесткий спрос со стороны сайта оставляет казну явно опустошенной. Памятник продолжает существовать, и королевство платит прежде, чем сможет чем-либо восхищаться."
 tv_engineering_department.7158.a:0 "Опустошает сокровищницу и позволяет камню подняться в любом случае."
 tv_engineering_department.7159.t:0 "Строительство: мандатные трещины перед стройкой"
 tv_engineering_department.7159.d:0 "Требования рабочего места заставляют корону принимать недостойную позу. Обещание величия теперь опирается на подорванную власть."
 tv_engineering_department.7159.a:0 "Даем кроне прогнуться, чтобы стены могли подняться."
 tv_engineering_department.7160.t:0 "Строительство: Орден Осколков в сборе"
 tv_engineering_department.7160.d:0 "Более резкие разрушения прорываются за забор. Чиновники могут назвать причину, но они не могут заставить страну почувствовать себя уравновешенной, назвав ее."
 tv_engineering_department.7160.a:0 "Пусть беспорядки выходят за пределы забора."
 tv_engineering_department.7161.t:0 "Строительство: Честь колеблется на публике"
 tv_engineering_department.7161.d:0 "Публичное замешательство на сайте распространяется быстрее, чем любые официальные исправления. Честь платит за камень, который еще не стоит."
 tv_engineering_department.7161.a:0 "Пусть говорят!"
 tv_engineering_department.7162.t:0 "Конструкция: благородное терпение пронизано"
 tv_engineering_department.7162.d:0 "Проект разрезает благородное терпение до тех пор, пока вежливость больше не может скрыть звук. Памятник – бедный гость, когда пожирает наследство."
 tv_engineering_department.7162.a:0 "Пусть дворяне ворчат, пока кладка продвигается."
 tv_engineering_department.7163.t:0 "Строительство: Терпение иссякает в ризнице"
 tv_engineering_department.7163.d:0 "Требование строительства топчет слишком близко к алтарю. Духовенство не забывает, когда к благочестию относятся как к открытому пространству."
 tv_engineering_department.7163.a:0 "Мы принимаем холодное молчание духовенства как цену камня."
 tv_engineering_department.7164.t:0 "Строительство: Гнев достигает улиц"
 tv_engineering_department.7164.d:0 "Гнев достигает витрин, поскольку рабочее место поглощает пространство, время и кредиты. Город слышит памятник прежде, чем видит его."
 tv_engineering_department.7164.a:0 "Пусть витрины магазинов ворчат, пока леса поднимаются."
 tv_engineering_department.7165.t:0 "Строительство: Сельский гнев не утихнет"
 tv_engineering_department.7165.d:0 "Сельский гнев не утихнет после этого сбора. Тень чуда достигает ферм, которые, возможно, никогда не увидят его законченного облика."
 tv_engineering_department.7165.a:0 "Пусть поля выдержат это!"
 tv_engineering_department.7166.t:0 "Строительство: Сайт отступает"
 tv_engineering_department.7166.d:0 "Работы опустошают это место настолько сильно, что его можно вернуть обратно. Памятник еще не встал, но место вокруг него уже оплачено."
 tv_engineering_department.7166.a:0 "Возвращает место назад, чтобы памятник мог двигаться вперед."
 tv_engineering_department.7167.t:0 "Строительство: Процветание этого места задушено"
 tv_engineering_department.7167.d:0 "Строительная площадка на какое-то время душит местный рынок. Повозки все еще прибывают, но их уже меньше обслуживают город вокруг камня."
 tv_engineering_department.7167.a:0 "Пусть местный рынок истончится, пока работы продолжаются."
 tv_engineering_department.7168.t:0 "Строительство: Капитал окупается камнем"
 tv_engineering_department.7168.d:0 "Капитал окупается камнем, трудом и отложенным ремонтом. Далекий памятник становится более реальным, тогда как ближайшие планы становятся пустыми."
 tv_engineering_department.7168.a:0 "Мы позволяем капитальному ремонту ждать далекого чуда."
 tv_engineering_department.7169.t:0 "Строительство: торговля Королевского города находится на низком уровне"
 tv_engineering_department.7169.d:0 "Торговля королевского города снижается из-за заводов. Великолепие вдали притупляет улицы, которые должны его финансировать."
 tv_engineering_department.7169.a:0 "Притупляет улицы королевского города, чтобы финансировать величие в других местах."
 tv_engineering_department.7170.t:0 "Конструкция: пот переходит в кровь"
 tv_engineering_department.7170.d:0 "Пот переходит в кровь в этом месте. Памятник не отменяется, и это, возможно, самая жестокая часть урока."
 tv_engineering_department.7170.a:0 "Мы продолжаем, хотя сайт заплатил кровью."
 tv_engineering_department.7171.t:0 "Конструкция: [tv_great_engineer|E] побеждает на улице"
 tv_engineering_department.7171.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] превращает технический тур в публичный триумф. Результатом является значительное улучшение [tv_wonder_domestic_support|E].\n\n#G Это событие произошло потому, что текущий [tv_great_engineer|E] имеет эффективную военную способность выше 80.#!"
 tv_engineering_department.7171.a:0 "Превращает обычную проверку в публичный триумф."
 tv_engineering_department.7172.t:0 "Конструкция: [tv_great_engineer|E] перерисовывает Гранд Лайн"
 tv_engineering_department.7172.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] перерисовывает главную ось с уверенностью, которая делает более масштабный план достоверным. Результатом является значительное улучшение [tv_wonder_scale_competence|E].\n\n#G Это событие произошло потому, что текущий [tv_great_engineer|E] имеет эффективную военную способность выше 80.#!"
 tv_engineering_department.7172.a:0 "Благодаря этому великая ось выглядит неизбежной, а не безрассудной."
 tv_engineering_department.7173.t:0 "Строительство: [tv_great_engineer|E] перестраивает график"
 tv_engineering_department.7173.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] настолько четко перестраивает график, что ему подчиняются даже конкурирующие бригадиры. Результатом является значительное улучшение [tv_wonder_organization_competence|E].\n\n#G Это событие произошло потому, что текущий [tv_great_engineer|E] имеет эффективную военную способность выше 80.#!"
 tv_engineering_department.7173.a:0 "Мы отстаём от нового графика."
 tv_engineering_department.7174.t:0 "Конструкция: [tv_great_engineer|E] открывает дорогу"
 tv_engineering_department.7174.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] открывает маршрут снабжения, на фоне которого старые задержки выглядят почти глупо. Результатом является значительное улучшение [tv_wonder_logistics_competence|E].\n\n#G Это событие произошло потому, что текущий [tv_great_engineer|E] имеет эффективную военную способность выше 80.#!"
 tv_engineering_department.7174.a:0 "Наконец-то дорога открыта!"
 tv_engineering_department.7175.t:0 "Строительство: [tv_great_engineer|E] управляет основными работами"
 tv_engineering_department.7175.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] помогает основным работам решить проблему, которая застопорила меньшие руки. Результатом является значительное улучшение прогресса [tv_wonder_construction|E]. \n\n#G Это событие произошло потому, что текущий [tv_great_engineer|E] имеет эффективную военную способность выше 80.#!"
 tv_engineering_department.7175.a:0 "Проводит застопорившиеся работы начисто."
 tv_engineering_department.7176.t:0 "Конструкция: [tv_great_engineer|E] успокаивает слухи"
 tv_engineering_department.7176.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] отвечает на слухи достаточно простыми объяснениями, чтобы укрепить общественное доверие. Проект получает более устойчивое улучшение [tv_wonder_domestic_support|E].\n\n#G Это событие произошло потому, что текущий [tv_great_engineer|E] имеет эффективную военную способность выше 50.#!"
 tv_engineering_department.7176.a:0 "Успокаивает слухи простыми разговорами."
 tv_engineering_department.7177.t:0 "Конструкция: [tv_great_engineer|E] устанавливает меру"
 tv_engineering_department.7177.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] находит на сайте достаточно места, чтобы избавить проект от робкого дизайна. Проект получает более устойчивое улучшение [tv_wonder_scale_competence|E].\n\n#G Это событие произошло потому, что текущий [tv_great_engineer|E] имеет эффективную военную способность выше 50.#!"
 tv_engineering_department.7177.a:0 "Мы даем плану достаточно места, чтобы он был смелым."
 tv_engineering_department.7178.t:0 "Конструкция: [tv_great_engineer|E] выпрямляет валки"
 tv_engineering_department.7178.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] расправляет упрямый беспорядок из бригад, инструментов и часов. Проект получает более устойчивое улучшение [tv_wonder_organization_competence|E].\n\n#G Это событие произошло потому, что текущий [tv_great_engineer|E] имеет эффективную военную способность выше 50.#!"
 tv_engineering_department.7178.a:0 "Приводит в порядок экипажи, инструменты и вахту."
 tv_engineering_department.7179.t:0 "Конструкция: [tv_great_engineer|E] очищает конвой"
 tv_engineering_department.7179.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] расчищает худший узел в расписании конвоев. Проект получает более устойчивое улучшение [tv_wonder_logistics_competence|E].\n\n#G Это событие произошло потому, что текущий [tv_great_engineer|E] имеет эффективную военную способность выше 50.#!"
 tv_engineering_department.7179.a:0 "Расчищает худший узел в линии подачи."
 tv_engineering_department.7180.t:0 "Конструкция: [tv_great_engineer|E] подходит для критического соединения."
 tv_engineering_department.7180.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] соответствует критической части и позволяет быстрее начать следующий этап. Проект получает более устойчивое улучшение прогресса [tv_wonder_construction|E].\n\n#G Это событие произошло потому, что текущий [tv_great_engineer|E] имеет эффективную военную способность выше 50.#!"
 tv_engineering_department.7180.a:0 "Полный вперед!"
 tv_engineering_department.7181.t:0 "Конструкция: [tv_great_engineer|E] привлекает внимание толпы"
 tv_engineering_department.7181.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] выставляет перед толпой незаконченные работы и доверяет зрелищу. Это решение может отменить [tv_wonder_domestic_support|E] или дорого обойтись сайту.\n\n#Y Это событие произошло потому, что текущий [tv_great_engineer|E] имеет эффективную военную способность от 20 до 80.#!"
 tv_engineering_department.7181.a:0 "Пусть толпа выносит суждение о незавершенных камнях."
 tv_engineering_department.7182.t:0 "Конструкция: [tv_great_engineer|E] увеличивает план"
 tv_engineering_department.7182.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] приказывает расширить план до того, как все сомнения будут оплачены. Это решение может отменить [tv_wonder_scale_competence|E] или дорого обойтись сайту.\n\n#Y Это событие произошло потому, что текущий [tv_great_engineer|E] имеет эффективную военную способность от 20 до 80.#!"
 tv_engineering_department.7182.a:0 "Приказывает увеличить чертеж, прежде чем сомнения развеются."
 tv_engineering_department.7183.t:0 "Конструкция: [tv_great_engineer|E] перезаписывает смену"
 tv_engineering_department.7183.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] переписывает смены за один день и заставляет двор не отставать. Это решение может отменить [tv_wonder_organization_competence|E] или дорого обойтись сайту.\n\n#Y Это событие произошло потому, что текущий [tv_great_engineer|E] имеет эффективную военную способность от 20 до 80.#!"
 tv_engineering_department.7183.a:0 "Переписываем смены и дерзаем двор не отставать."
 tv_engineering_department.7184.t:0 "Конструкция: [tv_great_engineer|E] отправляется на рискованный путь"
 tv_engineering_department.7184.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] отправляет тележки трудной дорогой и доверяет расчету привычке. Это решение может отменить [tv_wonder_logistics_competence|E] или дорого обойтись сайту.\n\n#Y Это событие произошло потому, что текущий [tv_great_engineer|E] имеет эффективную военную способность от 20 до 80.#!"
 tv_engineering_department.7184.a:0 "Отправляет тележки по более трудной дороге, доверяя расчету привычке."
 tv_engineering_department.7185.t:0 "Конструкция: [tv_great_engineer|E] тестирует более быстрый метод"
 tv_engineering_department.7185.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] тестирует более быстрый метод, при котором сбой будет общеизвестным. Это решение может привести к замедлению прогресса [tv_wonder_construction|E] или дорого стоить сайту. \n\n#Y Это событие произошло потому, что текущий [tv_great_engineer|E] имеет эффективную военную способность от 20 до 80.#!"
 tv_engineering_department.7185.a:0 "Попробуйте более быстрый метод – пусть он проявит себя на публике!"
 tv_engineering_department.7186.t:0 "Конструкция: [tv_great_engineer|E] неправильно считает монету"
 tv_engineering_department.7186.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] неправильно оценивает стоимость исправления и оставляет казну, чтобы скрыть элегантность. Работы продолжаются, но из-за недосмотра страдает [gold|E].\n\n#R Это событие произошло потому, что текущий [tv_great_engineer|E] имеет эффективную военную способность ниже 50.#!"
 tv_engineering_department.7186.a:0 "Тихо погашает недостачу до того, как счет будет подвергнут сомнению."
 tv_engineering_department.7187.t:0 "Конструкция: [tv_great_engineer|E] забывает суд"
 tv_engineering_department.7187.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] забывает, что королевская власть – это тоже материал, и тратит его небрежно. Работы продолжаются, но из-за недосмотра страдает [legitimacy|E].\n\n#R Это событие произошло потому, что текущий [tv_great_engineer|E] имеет эффективную военную способность ниже 50.#!"
 tv_engineering_department.7187.a:0 "Мы обуздаем небрежное использование имени короны."
 tv_engineering_department.7188.t:0 "Строительство: [tv_great_engineer|E] неправильно понимает деревни"
 tv_engineering_department.7188.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] недооценивает, сколько проблем может вызвать аккуратный инженерный ответ. Работы продолжаются, но из-за недосмотра страдает [stability|E].\n\n#R Это событие произошло потому, что текущий [tv_great_engineer|E] имеет эффективную военную способность ниже 50.#!"
 tv_engineering_department.7188.a:0 "Сглаживает помехи, оставленные аккуратным решением."
 tv_engineering_department.7189.t:0 "Конструкция: [tv_great_engineer|E] говорит слишком рано"
 tv_engineering_department.7189.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] говорит слишком уверенно, прежде чем работа сможет поддержать хвастовство. Работы продолжаются, но из-за недосмотра страдает [prestige|E].\n\n#R Это событие произошло потому, что текущий [tv_great_engineer|E] имеет эффективную военную способность ниже 50.#!"
 tv_engineering_department.7189.a:0 "Иди хвастовство назад!"
 tv_engineering_department.7190.t:0 "Конструкция: [tv_great_engineer|E] пренебрегает дворянами"
 tv_engineering_department.7190.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] относится к благородному терпению как к еще одному запасу припасов. Работы продолжаются, но [estate_satisfaction|E] среди знати страдает из-за недосмотра.\n\n#R Это событие произошло потому, что текущий [tv_great_engineer|E] имеет эффективную военную способность ниже 50.#!"
 tv_engineering_department.7190.a:0 "Напоминает инженеру, что благородное терпение – это не запас, из которого можно извлечь пользу."
 tv_engineering_department.7191.t:0 "Конструкция: [tv_great_engineer|E] нарушает календарь"
 tv_engineering_department.7191.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] перемещается по религиозному календарю, как если бы это был стол для родов. Работы продолжаются, но [estate_satisfaction|E] среди духовенства страдает из-за недосмотра.\n\n#R Это событие произошло потому, что текущий [tv_great_engineer|E] имеет эффективную военную способность ниже 50.#!"
 tv_engineering_department.7191.a:0 "В конце концов, пусть у алтарей будет собственный календарь."
 tv_engineering_department.7192.t:0 "Конструкция: [tv_great_engineer|E] блокирует рынок"
 tv_engineering_department.7192.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] блокирует обычную торговлю, пытаясь найти более чистую линию для сайта. Работы продолжаются, но [estate_satisfaction|E] среди бюргеров страдает из-за недосмотра.\n\n#R Это событие произошло потому, что текущий [tv_great_engineer|E] имеет эффективную военную способность ниже 50.#!"
 tv_engineering_department.7192.a:0 "Мы вновь открываем рыночную полосу, которую закрыли."
 tv_engineering_department.7193.t:0 "Строительство: [tv_great_engineer|E] недооценивает деревни"
 tv_engineering_department.7193.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] принимает истощенные деревни за неиспользованный резерв. Работы продолжаются, но [estate_satisfaction|E] среди крестьян страдает из-за недосмотра.\n\n#R Это событие произошло потому, что текущий [tv_great_engineer|E] имеет эффективную военную способность ниже 50.#!"
 tv_engineering_department.7193.a:0 "Позволяет измученным деревням отдохнуть, а не снова втягиваться в них."
 tv_engineering_department.7194.t:0 "Конструкция: [tv_great_engineer|E] режет не те улицы"
 tv_engineering_department.7194.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] устраняет неправильные местные механизмы и называет этот пробел полезным. Работы продолжаются, но [development|E] на объекте страдает из-за недосмотра.\n\n#R Это событие произошло потому, что текущий [tv_great_engineer|E] имеет эффективную военную способность ниже 50.#!"
 tv_engineering_department.7194.a:0 "Патчи над аранжировками, которые были вырезаны по ошибке."
 tv_engineering_department.7195.t:0 "Строительство: [tv_great_engineer|E] переполняет источники средств к существованию на объекте"
 tv_engineering_department.7195.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] вытесняет местные средства к существованию, освобождая место для работ. Работы продолжаются, но [prosperity|E] на объекте страдает из-за недосмотра.\n\n#R Это событие произошло потому, что текущий [tv_great_engineer|E] имеет эффективную военную способность ниже 50.#!"
 tv_engineering_department.7195.a:0 "Мы снова освобождаем место для средств к существованию, которые вытеснила поляна."
 tv_engineering_department.7196.t:0 "Строительство: [tv_great_engineer|E] злоупотребляет капиталом"
 tv_engineering_department.7196.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] злоупотребляет капитальными ресурсами, как будто у королевского города нет собственных планов. Работы продолжаются, но [development|E] в столице страдает из-за недосмотра.\n\n#R Это событие произошло потому, что текущий [tv_great_engineer|E] имеет эффективную военную способность ниже 50.#!"
 tv_engineering_department.7196.a:0 "Возвращает неправильно использованные ресурсы в собственные планы столицы."
 tv_engineering_department.7197.t:0 "Строительство: [tv_great_engineer|E] тревожит королевский город"
 tv_engineering_department.7197.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] нарушает торговлю королевского города, решая местную инженерную проблему. Работы продолжаются, но [prosperity|E] в столице страдает из-за недосмотра.\n\n#R Это событие произошло потому, что текущий [tv_great_engineer|E] имеет эффективную военную способность ниже 50.#!"
 tv_engineering_department.7197.a:0 "Мы успокаиваем торговлю королевского города до того, как беспорядки распространятся."
 tv_engineering_department.7198.t:0 "Строительство: [tv_great_engineer|E] неправильно оценивает трудозатраты"
 tv_engineering_department.7198.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] неверно оценивает пределы рабочих тел. Работы продолжаются, но работа [population|E] на объекте страдает из-за недосмотра.\n\n#R Это событие произошло потому, что текущий [tv_great_engineer|E] имеет эффективную военную способность ниже 50.#!"
 tv_engineering_department.7198.a:0 "Ослабьте напряжение, прежде чем оно выйдет из строя!"
 tv_engineering_department.7199.t:0 "Конструкция: [tv_great_engineer|E] ломает бухгалтерскую книгу"
 tv_engineering_department.7199.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] позволяет ошибке, которой можно было избежать, прорваться через счета и опустошить больше монет, чем может оправдать гордость. Ошибки недостаточно, чтобы положить конец чуду, и это, возможно, самая уродливая его часть. \n\n#R Это событие произошло потому, что текущий [tv_great_engineer|E] имеет эффективную военную способность ниже 20.#!"
 tv_engineering_department.7199.a:0 "Записывает убытки и тихо закрывает бухгалтерскую книгу."
 tv_engineering_department.7200.t:0 "Конструкция: [tv_great_engineer|E] ранит корону"
 tv_engineering_department.7200.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] превращает предотвратимый сбой на месте в видимую рану на коронке. Ошибки недостаточно, чтобы положить конец чуду, и это, возможно, самая уродливая его часть. \n\n#R Это событие произошло потому, что текущий [tv_great_engineer|E] имеет эффективную военную способность ниже 20.#!"
 tv_engineering_department.7200.a:0 "Мы носим новый шрам короны и продолжаем путь."
 tv_engineering_department.7201.t:0 "Строительство: [tv_great_engineer|E] тревожит страну"
 tv_engineering_department.7201.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] ввергает страну в хаос, пытаясь решить проблему на сайте. Ошибки недостаточно, чтобы положить конец чуду, и это, возможно, самая уродливая его часть. \n\n#R Это событие произошло потому, что текущий [tv_great_engineer|E] имеет эффективную военную способность ниже 20.#!"
 tv_engineering_department.7201.a:0 "Оставляет беспорядок сгореть."
 tv_engineering_department.7202.t:0 "Конструкция: [tv_great_engineer|E] представляет собой зрелище"
 tv_engineering_department.7202.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] превращает сайт в зрелище и привносит в него придворную честь. Ошибки недостаточно, чтобы положить конец чуду, и это, возможно, самая уродливая его часть. \n\n#R Это событие произошло потому, что текущий [tv_great_engineer|E] имеет эффективную военную способность ниже 20.#!"
 tv_engineering_department.7202.a:0 "Пусть суд увидит свое зрелище!"
 tv_engineering_department.7203.t:0 "Конструкция: [tv_great_engineer|E] злит дома"
 tv_engineering_department.7203.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] злит дома, решая проблему сайта с помощью своих привилегий. Ошибки недостаточно, чтобы положить конец чуду, и это, возможно, самая уродливая его часть. \n\n#R Это событие произошло потому, что текущий [tv_great_engineer|E] имеет эффективную военную способность ниже 20.#!"
 tv_engineering_department.7203.a:0 "Тратит добрую волю домов, чтобы работа продолжалась."
 tv_engineering_department.7204.t:0 "Конструкция: [tv_great_engineer|E] оскорбляет духовенство"
 tv_engineering_department.7204.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] оскорбляет духовенство, заставляя священное терпение платить за светский камень. Ошибки недостаточно, чтобы положить конец чуду, и это, возможно, самая уродливая его часть. \n\n#R Это событие произошло потому, что текущий [tv_great_engineer|E] имеет эффективную военную способность ниже 20.#!"
 tv_engineering_department.7204.a:0 "Мы позволяем священному терпению оплатить счет за вековой камень."
 tv_engineering_department.7205.t:0 "Конструкция: [tv_great_engineer|E] провоцирует бюргеров"
 tv_engineering_department.7205.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] провоцирует бюргеров, рассматривая торговлю как свободные строительные леса. Ошибки недостаточно, чтобы положить конец чуду, и это, возможно, самая уродливая его часть. \n\n#R Это событие произошло потому, что текущий [tv_great_engineer|E] имеет эффективную военную способность ниже 20.#!"
 tv_engineering_department.7205.a:0 "Оставляет торговцев чинить свои леса самостоятельно."
 tv_engineering_department.7206.t:0 "Конструкция: [tv_great_engineer|E] разрушает деревни"
 tv_engineering_department.7206.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] нарушает терпение деревни требованием, которого следовало избегать. Ошибки недостаточно, чтобы положить конец чуду, и это, возможно, самая уродливая его часть. \n\n#R Это событие произошло потому, что текущий [tv_great_engineer|E] имеет эффективную военную способность ниже 20.#!"
 tv_engineering_department.7206.a:0 "Мы просим у деревень прощения за требование, которое мы могли бы избавить от них."
 tv_engineering_department.7207.t:0 "Строительство: [tv_great_engineer|E] повреждает объект"
 tv_engineering_department.7207.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] повреждает сайт, решая техническую проблему с локальным разрушением. Ошибки недостаточно, чтобы положить конец чуду, и это, возможно, самая уродливая его часть. \n\n#R Это событие произошло потому, что текущий [tv_great_engineer|E] имеет эффективную военную способность ниже 20.#!"
 tv_engineering_department.7207.a:0 "Залачивает рану, вызванную самим ремонтом."
 tv_engineering_department.7208.t:0 "Строительство: [tv_great_engineer|E] уничтожает рынки сайта"
 tv_engineering_department.7208.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] уничтожает рынки сайта посредством предотвратимого решения. Ошибки недостаточно, чтобы положить конец чуду, и это, возможно, самая уродливая его часть. \n\n#R Это событие произошло потому, что текущий [tv_great_engineer|E] имеет эффективную военную способность ниже 20.#!"
 tv_engineering_department.7208.a:0 "Да будет так — пусть замолчат ларьки!"
 tv_engineering_department.7209.t:0 "Строительство: [tv_great_engineer|E] разрушает планы столицы"
 tv_engineering_department.7209.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] разоблачает планы столицы скрыть ошибку на объекте. Ошибки недостаточно, чтобы положить конец чуду, и это, возможно, самая уродливая его часть. \n\n#R Это событие произошло потому, что текущий [tv_great_engineer|E] имеет эффективную военную способность ниже 20.#!"
 tv_engineering_department.7209.a:0 "Разрушает собственные планы столицы исправить ошибку сайта."
 tv_engineering_department.7210.t:0 "Строительство: [tv_great_engineer|E] снижает процветание столицы"
 tv_engineering_department.7210.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] омрачает процветание капитала из-за неудачи, которая никогда не должна была дойти до рынка. Ошибки недостаточно, чтобы положить конец чуду, и это, возможно, самая уродливая его часть. \n\n#R Это событие произошло потому, что текущий [tv_great_engineer|E] имеет эффективную военную способность ниже 20.#!"
 tv_engineering_department.7210.a:0 "Мы наблюдаем, как сияние столицы тускнеет из-за провала, которого она никогда не должна была увидеть."
 tv_engineering_department.7211.t:0 "Конструкция: [tv_great_engineer|E] стала причиной жертв"
 tv_engineering_department.7211.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] приводит к жертвам, позволяя предотвратимому сбою пройти через экипажи. Ошибки недостаточно, чтобы положить конец чуду, и это, возможно, самая уродливая его часть. \n\n#R Это событие произошло потому, что текущий [tv_great_engineer|E] имеет эффективную военную способность ниже 20.#!"
 tv_engineering_department.7211.a:0 "Считает погибших, которых экипажи никогда не должны были терять."
