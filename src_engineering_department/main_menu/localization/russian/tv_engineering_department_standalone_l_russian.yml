 tv_engineering_department_standalone.1.d: "В вашей стране теперь есть Инженерный департамент — учреждение, стоящее за каждым великим проектом, который она может предпринять. \n\nДля начала назначьте Великого инженера. Сначала они разрабатывают #high Концепцию#! для осуществимого проекта, который затем ваш суд рассматривает во внутренних #high Debate#!. #high Survey#! подтверждает выбранное место, затем начинается само #high Строительство#!, поднимая проект через четыре части до финального уровня. Завершение отмечено #high Церемонией#!, которая дает постоянную награду. \n\nОткройте панель инженерного отдела в любое время, чтобы проверить прогресс или назначить Великого инженера."
