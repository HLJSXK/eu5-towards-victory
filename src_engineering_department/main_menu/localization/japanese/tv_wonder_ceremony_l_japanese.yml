 TV_WONDER_CEREMONY_S5_DESC_155:0 "身廊を取り囲むようにそびえ立つ桟橋の列がそびえ立ち、それぞれの冠には聖人やヴィスコンティの紋章を描いた彫刻が施された柱頭が付けられています。ロンバードの建物がこれまで到達したことのない高さまで、ブロックごとに足踏みリフト ブロックによってクレーンが作動しました。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合はお待ちください。#!"
