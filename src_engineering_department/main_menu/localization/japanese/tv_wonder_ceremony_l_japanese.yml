 TV_WONDER_CEREMONY_S5_DESC_178:0 "新しいギャラリーはポーランドの丘の下であらゆる方向に広がり、塩水井戸は鉱山の産出量を 2 倍にするために固体の塩の鉱床に沿って掘削されています。鉱山労働者は、日付と名前を部屋の壁にマークし始めます。これは、塩そのものに刻まれた記録です。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
