 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_131:0 "#Y 進行中#! — #high 死者の大通りが追跡される#!\n#F 測量士らは谷底を横切る長い直線を引き、暦が神聖と呼ぶ日の日の出に合わせて、その両側に大きな台座が並ぶ場所をマークした。長さ.#!"
