 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_220:0 "#Y 進行中#! — #high アルジェはコルセアの本拠地として立つ#!\n#F パシャは港が完成し、大砲、倉庫、身代金事務所がバーバリー海岸沿いに私掠船の恒久的な要塞として立っていると宣言。#!"
