 TV_WONDER_CEREMONY_S1_DESC_153:0 "ドゥオモ歌劇場は、サンタ マリア デル フィオーレの頂に、古代以来建設されたどのドームよりも大きなドームを設けると宣言していますが、そのようなドームが自重で崩壊することなくどのように立つことができるのかは、まだ誰にもわかりません。街中のギルドがこの挑戦に向けて資金を約束します。\n\n#weak 儀式を次の段階に進めるために必要な代金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
