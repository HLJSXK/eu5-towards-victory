 TV_WONDER_CEREMONY_S4_DESC_155:0 "石工たちが大聖堂の聖歌隊の着工し、ミラノの大聖堂はついにロンバルディア州の土地に係争中の図面から桟橋と控え壁に建てられた。公爵と大司教は両方とも、最初の大柱の建立に出席します。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、その瞬間がまだ適切でない場合は待ちます。#!"
