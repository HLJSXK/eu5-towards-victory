 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_153:0 "#Y 進行中#! — #high フィレンツェ、同等のドームを建設することを誓う#!\n#F オペラ デル ドゥオーモは、サンタ マリア デル フィオーレの戴冠に古代以来建設されたどのドームよりも大きなドームを設けると宣言していますが、そのようなスパンが同等のドームなしでどのように耐えられるのかはまだ分かっていません。自重で崩壊します。#!"
