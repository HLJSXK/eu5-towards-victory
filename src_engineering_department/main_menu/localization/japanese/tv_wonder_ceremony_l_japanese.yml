 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_155:0 "#Y 進行中#! — #high 合唱団の基礎が着工#!\n#F メイソンが大聖堂の聖歌隊の着工、そしてミラノの大聖堂はついに、争点となっている図面からロンバルディア州の桟橋と控え壁に立ち上がりました。土壌.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_155:0 "#G 完了#! — #high 聖歌隊の基礎が着工#!\n#F メイソンが大聖堂の聖歌隊の着工、そしてミラノの大聖堂はついに、争点となっている図面からロンバルディア州の桟橋と控え壁にそびえ立つ土壌.#!"
