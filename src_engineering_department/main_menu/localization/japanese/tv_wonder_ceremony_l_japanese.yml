 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_143:0 "#Y 進行中#! — #high ノートルダムが聖別される#!\n#F 完成した大聖堂が国王、聖職者、市のギルドとノートルダムの前で聖別されると、鐘がシテ島に響き渡ります。芸術と領域への献身の恒久的な源泉として立っています。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_143:0 "#G 完成#! — #high ノートルダムが奉献される#!\n#F 完成した大聖堂が国王、聖職者、市のギルドとノートルダムの前で奉献されると、鐘がシテ島に響き渡ります。芸術と領域への献身の恒久的な源泉として立っています。#!"
