 TV_WONDER_CEREMONY_S4_TITLE_135:0 "[tv_wonder_ceremony|E]：最初の乾ドックが切断されました"
 TV_WONDER_CEREMONY_S4_DESC_135:0 "労働者たちはついに最初の本格的な乾ドックに起工し、港の泥と粘土を岩盤に向かって切り開き、門が潮流をせき止めることができるようにした。測量線と積み上げられた木材は、軍艦の船体を支えるのに十分な深さの掘削となっています。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
