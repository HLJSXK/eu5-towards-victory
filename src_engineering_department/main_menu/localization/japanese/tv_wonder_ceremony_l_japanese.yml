 TV_WONDER_CEREMONY_S6_TITLE_135:0 "[tv_wonder_ceremony|E]：港に沿って増える乾ドック"
 TV_WONDER_CEREMONY_S6_DESC_135:0 "2 番目と 3 番目の乾ドックは水辺に沿って切り取られ、ゲートが設けられ、石の壁に面し、潮の影響を避けるためにポンプが設置されています。決戦ヤードの倉庫には、急遽艦隊が出航しなければならない日に備えて、ソルト ビーフ、ビスケット、ビールが詰め込まれています。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。あるいは、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_135:0 "より多くの埠頭、より多くの店舗を――さらに前進しましょう！"
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_135:0 "倉庫は半分埋まったままで、新しいドックはゲートを開けずに待機しています。"
 TV_WONDER_CEREMONY_CARD_ICON_S7_135:0 "@tv_ceremony_cannons!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_135:0 "#Y 進行中#! — #high 艦隊の造船所集合#!\n#F 完成した造船所には、最初の軍艦の船首が船尾まで収まり、大砲庫から吊り上げられた大砲と新しいロープウォークからのブロックを艤装が走り抜けます。艦隊は造船所の準備ができているかどうかをテストするために港に集まります。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_135:0 "#G 完了#! — #high 艦隊の造船所集合#!\n#F 完成した造船所には最初の軍艦の船首が船尾まで収まり、大砲庫から吊り上げられた大砲と新しいロープウォークからのブロックを艤装が走り抜け、その間に船員全員が集合する艦隊は造船所の準備ができているかどうかをテストするために港に集まります。#!"
 TV_WONDER_CEREMONY_S7_TITLE_135:0 "[tv_wonder_ceremony|E]：艦隊のヤード集合"
 TV_WONDER_CEREMONY_S7_DESC_135:0 "完成した造船所では、最初の軍艦が船尾まで船首から船尾まで取り付けられ、大砲庫から吊り上げられた大砲や艤装が新しいロープウォークのブロックを駆け抜け、一方、艦隊の全員が港に集まり、造船所の準備ができているかどうかをテストします。士官は、海峡を果敢に侵攻してくる艦隊に対して艦隊を武装させることができるヤードであると宣言します。\n\n#weak 儀式を次の段階に進めるために必要な代金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_135:0 "造船所は大砲を船上に掲げ、艦隊を招集して準備が整っていることを証明します。"
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_135:0 "まだです -- 艦隊を待ってください!"
