 TV_WONDER_CEREMONY_CARD_ICON_S8_170:0 "@tv_ceremony_prosperity!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_170:0 "#Y 進行中#! — #high 採石場が完全に稼働可能な状態に達しました#!\n#F 国王はカララ工場をモデル企業として正式に宣言し、その線路、クレーン、作業場は現在、安定した自立したペースで稼働しています。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_170:0 "#G 完了#! — #high 採石場が完全に稼働できる状態に達しました#!\n#F 国王はカララ工場をモデル企業として正式に宣言し、その線路、クレーン、作業場は現在安定した自立したペースで稼働しています。#!"
 TV_WONDER_CEREMONY_S8_TITLE_170:0 "[tv_wonder_ceremony|E]：採石場が完全に稼働状態に達しました"
 TV_WONDER_CEREMONY_S8_DESC_170:0 "国王はカララ工場をモデル企業として正式に宣言し、その線路、クレーン、作業場は現在安定した自立したペースで稼働している。王国中の建設者は、豊富な良質の石と熟練した労働力によって、自分たちのプロジェクトが静かに促進されていることに気づきます。\n\n#weak 儀式を完了するために必要な代金を支払います。その結果、驚異の最終的な建物が完成します。#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_170:0 "王冠は、カラーラがあらゆる領域のモデルであることを宣言します。"
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_170:0 "私たちはまだこの事業が完了したと言える段階ではありません。"
