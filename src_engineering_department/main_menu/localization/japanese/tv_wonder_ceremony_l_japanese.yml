 TV_WONDER_CEREMONY_S8_TITLE_169:0 "[tv_wonder_ceremony|E]：ストゥディウム・ジェネラルの宣言"
 TV_WONDER_CEREMONY_S8_DESC_169:0 "医師、牧師、治安判事らが集まり、ボローニャのスタディウムが比類のない学校であり、卒業生がどこへ行ってもその学位が認められると宣言する。訓練された精神と着実な運営という大学の約束は、この領域の永続的な資産となります。\n\n#weak 式典を完了するために必要な代金を支払います。その結果、驚異の最終的な建物が建ち上がります。#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_169:0 "私たちはこのスタジオを、全世界の前で比類のない学校であると宣言します。"
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_169:0 "判事らは宣言を遅らせ、より吉祥の日を待った。"
 TV_WONDER_CEREMONY_CARD_ICON_S1_170:0 "@tv_ceremony_crown_estate!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_170:0 "#Y 進行中#! — #high この山は王冠の所有権を主張されています#!\n#F A 法令により、カララ上の白い縞模様の斜面が正式に王冠憲章の下に置かれ、古いローマの活動を遅らせていた私的所有権の寄せ集めに終止符が打たれました。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_170:0 "#G 完了#! — #high この山は王冠の所有権を主張されています#!\n#F A 法令により、カラーラの上の白い縞模様の斜面が正式に王冠憲章の下に置かれ、古いローマの活動を遅らせていた私的所有権の寄せ集めに終止符が打たれました。#!"
 TV_WONDER_CEREMONY_S1_TITLE_170:0 "[tv_wonder_ceremony|E]：その山は王冠を主張されています"
 TV_WONDER_CEREMONY_S1_DESC_170:0 "法令により、カラーラの上の白い葉脈の斜面が正式に国王憲章の下に置かれ、古いローマの活動を遅らせていた私的所有権のつぎはぎに終止符が打たれた。地元のカバトリが呼び出され、どの顔がまだ最高級の石を保持しているかについてアドバイスします。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_170:0 "私たちはこの山を王冠の名において主張し、古い主張を放棄します。"
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_170:0 "古い権利主張者たちは、もう少し自分たちのつぎはぎの権利にしがみついている。"
 TV_WONDER_CEREMONY_CARD_ICON_S2_170:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_170:0 "#Y 進行中#! — #high 測量士が採石場の面にマークを付ける#!\n#F 測量士は山に登り、最もきれいな石の表面にチョークで線を描きます。一方、採石業者のギルドは、単一のブロックを作成する前に賃金と安全性について協議します。カット.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_170:0 "#G 完了#! — #high 測量士が採石場の面にマークを付ける#!\n#F 測量士は山に登り、石の最もきれいな面にチョークで線を描きます。一方、単一のブロックが完成する前に、採石業者ギルドに賃金と安全性について相談します。カット.#!"
 TV_WONDER_CEREMONY_S2_TITLE_170:0 "[tv_wonder_ceremony|E]：測量士が採石場の表面に印を付ける"
 TV_WONDER_CEREMONY_S2_DESC_170:0 "測量士たちは山に登り、最もきれいな石の表面にチョークで線を描きますが、1 つのブロックを切り出す前に採石業者ギルドに賃金と安全性について相談します。古いローマ時代の挿し木は、まだ留意する価値のある教訓がないか検査されます。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_170:0 "2 度測定し、1 度カットする - 山ですらこの古いルールに従っています。"
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_170:0 "まだ、石に切断用のマークを付ける準備ができていません。"
 TV_WONDER_CEREMONY_CARD_ICON_S3_170:0 "@tv_ceremony_laborers!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_170:0 "#Y 進行中#! — #high そり道が切断されます#!\n#F 牛と労働者のチームが山腹にリッツァトゥーラの道を彫ります。大理石のブロックをゆっくりと下に降ろすのに十分な勾配です。粉砕.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_170:0 "#G 完了#! — #high そり道が切断されました#!\n#F 牛と労働者のチームが山腹に沿ってリッツァトゥーラの道を彫ります。大理石のブロックをゆっくりと下に降ろすのに十分な勾配です。粉砕.#!"
 TV_WONDER_CEREMONY_S3_TITLE_170:0 "[tv_wonder_ceremony|E]：スレッジトラックが切断されました"
 TV_WONDER_CEREMONY_S3_DESC_170:0 "牛と労働者のチームが山腹に沿ってリッツァトゥーラの道を彫ります。この道は、大理石のブロックが砕けずに下に降ろせる程度の急勾配になっています。ロープ職人や車輪大工が山のふもとに工房を構えています。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_170:0 "労働者たちは山腹の奥深くまでそり道を彫ります。"
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_170:0 "急いでトラックを切った場合、石は滑ることなく砕け散ります。"
 TV_WONDER_CEREMONY_CARD_ICON_S4_170:0 "@tv_ceremony_rgo!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_170:0 "#Y 進行中#! — #high 最初のブロックが岩から解放される#!\n#F くさびと鉄の棒がチョークで書かれた線に食い込み、ついには巨大な白いブロックがうめき声を上げて山肌から外れます。これがカララの真の採石場です。進行中。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_170:0 "#G 完了#! — #high 最初のブロックが岩から解放される#!\n#F くさびと鉄の棒がチョークで書かれた線に食い込み、ついには巨大な白いブロックがうめき声を上げて山肌から崩れ落ちます。ここがカララの真の採石場です。進行中。#!"
 TV_WONDER_CEREMONY_S4_TITLE_170:0 "[tv_wonder_ceremony|E]：最初のブロックが岩から解放される"
 TV_WONDER_CEREMONY_S4_DESC_170:0 "くさびと鉄の棒がチョークで書かれた線に食い込み、やがて巨大な白いブロックがうめき声を上げて山肌から崩れ落ち、カララの真の採石が今進行中である。牛ぞりが重荷を引き受けると、歓声が谷に響き渡ります。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_170:0 "私たちはくさびを家に打ち込み、カララの最初の石を解放します。"
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_170:0 "チョークで書かれたラインは、ウェッジやバーに触れることなく待機します。"
 TV_WONDER_CEREMONY_CARD_ICON_S5_170:0 "@tv_ceremony_supply!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_170:0 "#Y 進行中#! — #high C採石場口に上がるクレーン#!\n#F 古代以来のあらゆる工学的偉業に匹敵すると言われる木製クレーンもあり、そりでは重すぎるブロックを持ち上げるために採石場口で上げられています。一人で。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_170:0 "#G 完了#! — #high C採石場口に上がるクレーン#!\n#F 古代以来のあらゆる工学的偉業に匹敵すると言われる木製クレーンもあり、そりでは重すぎるブロックを持ち上げるために採石場口で上げられています。一人で。#!"
 TV_WONDER_CEREMONY_S5_TITLE_170:0 "[tv_wonder_ceremony|E]：採石場口でクレーンが上昇"
 TV_WONDER_CEREMONY_S5_DESC_170:0 "古代以来のあらゆる工学的偉業に匹敵するともいわれる木製クレーンが採石場口で上げられ、そりだけでは重すぎるブロックを持ち上げます。ロープと滑車のリズミカルなきしむ音は、山の絶え間ない歌になります。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、その瞬間がまだ適切でない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_170:0 "古代は石で育てられましたが、現在ではロープと木材で育てられています。"
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_170:0 "もう少し、そりを一人で働かせましょう。"
 TV_WONDER_CEREMONY_CARD_ICON_S6_170:0 "@tv_ceremony_art_work!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_170:0 "#Y 進行中#! — #high S彫刻家がブロックの中から選ぶ#!\n#F 熟練の彫刻家が遠くの工房からやって来て、切り出したばかりのブロックの間を歩き、それぞれをハンマーで叩いて隠れた欠陥のない石の輪を聴きます。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_170:0 "#G 完成#! — #high S彫刻家がブロックの中から選ぶ#!\n#F 熟練の彫刻家が遠くの工房からやって来て、切り出したばかりのブロックの間を歩き、それぞれをハンマーで叩き、隠れた欠陥のない石の輪を聞きます。#!"
 TV_WONDER_CEREMONY_S6_TITLE_170:0 "[tv_wonder_ceremony|E]：彫刻家がブロックから選ぶ"
 TV_WONDER_CEREMONY_S6_DESC_170:0 "熟練の彫刻家たちが遠くの工房からやって来て、切り出されたばかりのブロックの間を歩き、それぞれをハンマーで叩き、隠れた欠陥のない石の輪を聴きます。最高の作品は取っておかれ、残りの前に出荷用にマークされます。\n\n#weak セレモニーを次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合はお待ちください。#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_170:0 "彫刻家たちは、完璧な石の響きを聞きながら、各ブロックをたたきます。"
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_170:0 "健全にされていないブロックは、その輝きの下に亀裂を隠している可能性があります。"
 TV_WONDER_CEREMONY_CARD_ICON_S7_170:0 "@tv_ceremony_port!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_170:0 "#Y 進行中#! — #high 港の作業場がオープン#!\n#F 船積みヤードと荒削り作業場が海岸でオープンし、航海のブロックを準備し、船が貨物を積み込む前に余分な重量をそぎ落とします。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_170:0 "#G 完了#! — #high 港の作業場がオープン#!\n#F 船積みヤードと荒削り作業場が海岸にオープンし、航海に向けてブロックを準備し、船が貨物を積み込む前に余分な重量をそぎ落とします。#!"
 TV_WONDER_CEREMONY_S7_TITLE_170:0 "[tv_wonder_ceremony|E]：ハーバーワークショップオープン"
 TV_WONDER_CEREMONY_S7_DESC_170:0 "船積みヤードと粗加工作業場が海岸に開設され、航海に備えてブロックを準備し、船が貨物を積み込む前に余分な重量をそぎ落とします。職長は、山を出るすべてのブロックを注意深く集計しています。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングではない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_170:0 "港のヤードを開放し、カラーラの石を海に送ります。"
