 TV_WONDER_CEREMONY_S5_TITLE_135:0 "[tv_wonder_ceremony|E]：ロープウォークが伸びる"
 TV_WONDER_CEREMONY_S5_DESC_135:0 "この大ロープウォークは、戦列艦の最長のケーブルの長さを伸ばす 1 つの長い小屋としてそびえ立ち、紡績工が夜明けから夕暮れまで麻を撚り機に送り込みます。近くの大砲鋳造所が、まだ起工前の船に向けた最初の大砲の鋳造を開始します。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
