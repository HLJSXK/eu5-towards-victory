 TV_WONDER_CEREMONY_S3_DESC_221:0 "イマームたちは新しいマドラサに選ばれた日干しレンガの中庭を祝福し、建築の達人はわらと粘土を混ぜて砂漠の熱を防ぐ壁を作りました。近くの書籍市場はこれに注目し、見越して余分な原稿を仕入れ始めます。\n\n#weak 式典を次の段階に進めるために必要な代金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_221:0 "イマームたちは中庭を歩き、まだ立ち上がっていない壁すべてに祝福を与えます。"
