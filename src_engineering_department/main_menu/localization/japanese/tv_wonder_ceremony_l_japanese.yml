 TV_WONDER_CEREMONY_S6_DESC_153:0 "ドームは頂上に向かって狭くなり、石工たちは眼輪の周りにレンガの最後の輪を作り、いつかヴェロッキオのランタンで冠を飾ることになる。かつてこの設計を嘲笑していたギルドの長老たちは、今では見習いたちを連れて、頭上で奇跡を間近で見物します。\n\n#weak 式典を次の段階に進めるために必要な代金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
