 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_135:0 "#Y 進行中#! — #high 国王は造船所の拡張を命令#!\n#F 海軍本部は海峡を統治するための艦隊にふさわしいポーツマスの造船所を国王に請願し、新しい乾ドックの土地をマークするために王室測量士が派遣される。ロープウォークや港沿いの倉庫。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_135:0 "#G 完了#! — #high 国王は造船所の拡張を命令#!\n#F 海軍本部は海峡を統治するための艦隊にふさわしいポーツマスの造船所を国王に請願し、新しい乾ドックの土地をマークするために王室測量士が派遣される。ロープウォークや港沿いの倉庫。#!"
 TV_WONDER_CEREMONY_S1_TITLE_135:0 "[tv_wonder_ceremony|E]：国王が庭の拡張を命令"
 TV_WONDER_CEREMONY_S1_DESC_135:0 "海軍本部は海峡を統治するための艦隊にふさわしいポーツマスの造船所を国王に請願し、港沿いに新しい乾ドック、ロープウォーク、倉庫を建設するための土地をマークするために王室の測量士が派遣される。船大工や索具工が海岸の上下の造船所から到着し始めます。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_135:0 "国王は王室の言葉を認め、測量士は新しい庭の土地を杭打ちします。"
