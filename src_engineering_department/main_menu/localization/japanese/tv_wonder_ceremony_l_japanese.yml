 TV_WONDER_CEREMONY_S8_DESC_189:0 "カディは完成した塔の狭い階段を登り、ギャラリーから最初の祈りの呼びかけをします。その焼成レンガのシャフトは現在、バグダッドとサマルカンドの間で最も高い建造物です。この日から、ブハラにミナレットが存在することで、その呼びかけがオアシスにこだまするのを聞くすべての人々の献身が深まります。\n\n#weak 式典を完了するために必要な料金を支払います。その結果、驚異の最終的な建物が立ち上がります。#!"
