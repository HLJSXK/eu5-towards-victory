 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_182:0 "#G 完了#! — #high グランド マスターの宮殿がその壮麗さを手に入れる#!\n#F グランド マスター自身のために新しい宮殿の棟が建ち、その大食堂は細いヤシの木の柱にアーチ型になっていて、一度に章全体を座らせることができます。#!"
