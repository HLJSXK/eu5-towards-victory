 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_166:0 "#G 完了#! — #high 毎日の終わりにホステルが増えていく#!\n#F ホスピスとホステルは、一日の正直な散歩に合わせた間隔で建てられ、それぞれにパン、水、痛んだ足を休める場所が備えられています。#!"
