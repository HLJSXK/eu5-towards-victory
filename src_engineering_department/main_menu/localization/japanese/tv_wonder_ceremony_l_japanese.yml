 TV_WONDER_CEREMONY_S7_DESC_220:0 "海賊ガレー船の最初の戦隊は、完成したモグラをすり抜けて外海に入り、遅れた帆が風を受けて、初めての本格的な巡航が始まりました。群衆が護岸に集まり、地平線の彼方に消えていくのを見守ります。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
