 TV_WONDER_CEREMONY_S8_DESC_220:0 "パシャは港が完成し、その大砲、倉庫、身代金事務局がバーバリー海岸沿いに私掠船の恒久的な要塞として立っていると宣言した。コルセアの船長は今や当然のこととして王冠の旗のもとに航海し、賞品が無事持ち帰られるたびに財務省は膨らみます。\n\n#weak 式典を完了するために必要な代金を支払います。その結果、驚異の最後の建物が建ち上がります。#!"
