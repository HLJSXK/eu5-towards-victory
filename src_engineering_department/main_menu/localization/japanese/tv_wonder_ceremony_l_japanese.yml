 TV_WONDER_CEREMONY_S1_DESC_108:0 "大名池田輝政は、姫山の古い天守閣を取り壊し、その場所に播磨平野全体を見渡すのにふさわしい、より壮大な白壁の要塞を建設するよう命じました。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
