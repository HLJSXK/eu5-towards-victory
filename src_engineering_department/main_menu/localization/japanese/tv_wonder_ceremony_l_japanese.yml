 TV_WONDER_CEREMONY_S1_DESC_222:0 "ジェンネの統治者は、サヘルの土の伝統に基づいて建てられ、その前にあるあらゆる日干しレンガの建物を上回る祝福を受けた、バニ川の岸にそびえる大モスクを宣言しました。最初のレンガが成形される前に、グリオたちは市場広場でニュースを伝えます。\n\n#weak 儀式を次の段階に進めるために必要な代金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
