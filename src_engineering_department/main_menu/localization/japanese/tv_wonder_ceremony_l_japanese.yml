 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_214:0 "#Y 進行中#! — #high 市庁舎が聖別される#!\n#F 市庁舎が正式に聖別され、議会室が着席し、憲章金庫が封鎖されると、マリーエン教会から鐘が鳴り響きます。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_214:0 "#G 完了#! — #high 市庁舎が奉献される#!\n#F 市庁舎が正式に奉献され、議会室が着席し、憲章金庫が封鎖されると、マリーエン教会から鐘が鳴り響きます。#!"
 TV_WONDER_CEREMONY_S8_TITLE_214:0 "[tv_wonder_ceremony|E]：市庁舎は聖別されました"
 TV_WONDER_CEREMONY_S8_DESC_214:0 "市庁舎が正式に奉献され、議場が着席し、憲章金庫が封鎖されると、マリーエン教会から鐘が鳴り響きます。この日から、リューベックの声はあらゆるリーグ交渉でさらに伝わり、国王の使者はハンス川を越えて新たな敬意を持って迎えられるようになりました。\n\n#weak 式典を完了するために必要な代金を支払います。その結果、驚異の最終的な建物が建ち上がります。#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_214:0 "ついに鐘が鳴る！"
