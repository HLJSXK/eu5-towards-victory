 TV_WONDER_CEREMONY_S5_TITLE_131:0 "[tv_wonder_ceremony|E]：月のピラミッドがそれに合わせて昇る"
 TV_WONDER_CEREMONY_S5_DESC_131:0 "大通りの北端にある月のピラミッドは、背後にある神聖な峰を囲むように階層ごとに成長しており、その建設者は下の通りから全体のシルエットが正確に見えるように各段の高さを調整しています。画家たちは、プラットフォームの壁に沿って最初の壁画を描き始めます。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_131:0 "私たちは太陽のピラミッドに応えるために、月のピラミッドを階層ごとに上げていきます。"
