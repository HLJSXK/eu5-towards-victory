 TV_WONDER_CEREMONY_S7_DESC_205:0 "商人は、カスピ海風を渡る巡礼者や商人が炎の見える範囲で休んでから次の段階に進むことができるように、神社の横にあるゲストハウスと厩舎に資金を提供しています。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
