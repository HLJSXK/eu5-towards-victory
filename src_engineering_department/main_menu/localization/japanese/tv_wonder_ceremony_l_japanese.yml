 TV_WONDER_CEREMONY_S8_DESC_186:0 "キシュのオタマンは、完全なラダの前に完成したシチの上にホストの旗を掲げ、自由キャンプが完全で無冠の責任があることを宣言します。この日から、クリンで鍛えられた規律と、クリンが集めた人材が、ヘトマ国が野原に送り込むすべての宿主を強化します。\n\n#weak 儀式を完了するために必要な代金を支払います。その結果、驚異の最終的な建物が完成します。#!"
