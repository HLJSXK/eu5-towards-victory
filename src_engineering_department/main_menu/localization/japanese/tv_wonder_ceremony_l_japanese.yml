 TV_WONDER_CEREMONY_S2_DESC_130:0 "古いクレムリンの崩れかけた白い石灰岩の壁は部分ごとに取り壊され、壁に代わる赤レンガを焼くための窯がモスクワ川沿いに建設されます。大貴族たちは、市内に集まる何千人もの石工たちを養うために木材や穀物を寄付します。\n\n#weak 式典を次の段階に進めるために必要な代金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_130:0 "モスクワ川沿いで窯に火が点けられると、ボヤールたちは穀倉を空にする。"
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_130:0 "私たちはまだ古い壁を剥がす準備ができていません。"
 TV_WONDER_CEREMONY_CARD_ICON_S3_130:0 "@tv_ceremony_holy_site!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_130:0 "#Y 進行中#! — #high メトロポリタンは地面を祝福します#!\n#F メトロポリタンはアイコンと香炉でマークされた基礎の周りを処理し、新しい壁の中に大聖堂と宮殿のホールが一緒にそびえる場所を祝福します。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_130:0 "#G 完了#! — #high メトロポリタンは地面を祝福します#!\n#F メトロポリタンは、アイコンと香炉でマークされた基礎の周りを処理し、新しい壁の中に大聖堂と宮殿のホールが一緒にそびえる場所を祝福します。#!"
 TV_WONDER_CEREMONY_S3_TITLE_130:0 "[tv_wonder_ceremony|E]：大地を祝福するメトロポリタン"
 TV_WONDER_CEREMONY_S3_DESC_130:0 "メトロポリタンは、マークされた基礎の周りをイコンと香炉で処理し、新しい城壁の中に大聖堂と宮殿のホールが一緒に建つ予定の場所を祝福します。イタリアとロシアの棟梁が塔、門、中庭の計画を最終決定します。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_130:0 "メトロポリタンはマークされた地面の上で香炉を振り、それを神聖であると宣言します。"
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_130:0 "建設者たちは基礎を何も付けずに放置し、より幸運な祝福の日が来るのを待っています。"
 TV_WONDER_CEREMONY_CARD_ICON_S4_130:0 "@tv_ceremony_crown_estate!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_130:0 "#Y 進行中#! — #high 石の基礎の上にレンガがそびえ立つ#!\n#F 赤レンガの最初の本格的なコースは、川岸に沿った深い石の基礎の上に置かれ、フィオラヴァンティのイタリアの接着方法とモルタルは、古い壁よりも強力であることが証明されましたoffer.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_130:0 "#G 完成#! — #high 石の基礎の上にレンガがそびえ立つ#!\n#F 赤レンガの最初の本格的なコースは、川岸に沿った深い石の基礎の上に置かれ、フィオラヴァンティのイタリアの接着方法とモルタルは、古い壁よりも強力であることが証明されましたoffer.#!"
 TV_WONDER_CEREMONY_S4_TITLE_130:0 "[tv_wonder_ceremony|E]：Brick Rises Upon Stone Foundations"
 TV_WONDER_CEREMONY_S4_DESC_130:0 "赤レンガの最初の本格的なコースは、川岸に沿った深い石の基礎の上に置かれ、フィオラヴァンティのイタリアの接着方法とモルタルは、古い壁が提供できるものよりも強力であることが証明されました。クレムリンが、ついに物理的な形をとり始めます。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングではない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_130:0 "Stone and brick, at last!"
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_130:0 "石工たちはこてを置き、基礎は青空の下に放置された。"
 TV_WONDER_CEREMONY_CARD_ICON_S5_130:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_130:0 "#Y 進行中#! — #high 生神女就寝大聖堂が形を成す#!\n#F そびえ立つ壁の中を、大きく白い生神女就寝大聖堂がコースごとに登り、ロシアとイタリアの石工が並んでその上で作業する中、その 5 つのドームが足場で組み立てられています。ボールト.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_130:0 "#G 完成#! — #high 生神女就寝大聖堂が形を成す#!\n#F そびえ立つ壁の中を、大きく白い生神女就寝大聖堂がコースごとに登っていき、ロシアとイタリアの石工が並んでその上で作業する中、その 5 つのドームが足場で組み立てられています。ボールト.#!"
 TV_WONDER_CEREMONY_S5_TITLE_130:0 "[tv_wonder_ceremony|E]：生神女就寝大聖堂が形を成す"
 TV_WONDER_CEREMONY_S5_DESC_130:0 "そびえ立つ壁の中を、ロシアとイタリアの石工が並んでアーチ型天井で作業する中、5 つのドームが足場で組み立てられながら、大きく白い生神女就寝大聖堂がコースごとに登っていきます。近くの鋳物工場で鐘が鋳造され、完成を待ちます。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_130:0 "鋳造用の鐘が鋳造されるにつれて、5 つのドームが足場内をより高く登っていきます。"
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_130:0 "鐘が注がれる前に、足場をもう少し立たせておきます。"
 TV_WONDER_CEREMONY_CARD_ICON_S6_130:0 "@tv_ceremony_soldiers!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_130:0 "#Y In progress#! — #high Towers and Battlements Crown the Walls#!\n#F Crenellated towers rise at every corner and gate, their swallow-tail battlements borrowed from Italian fortress design, while the Spasskaya gate is fitted with its first iron-boundドア.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_130:0 "#G Completed#! — #high Towers and Battlements Crown the Walls#!\n#F Crenellated towers rise at every corner and gate, their swallow-tail battlements borrowed from Italian fortress design, while the Spasskaya gate is fitted with its first iron-boundドア.#!"
 TV_WONDER_CEREMONY_S6_TITLE_130:0 "[tv_wonder_ceremony|E]：壁を覆う塔と胸壁"
 TV_WONDER_CEREMONY_S6_DESC_130:0 "Crenellated towers rise at every corner and gate, their swallow-tail battlements borrowed from Italian fortress design, while the Spasskaya gate is fitted with its first iron-bound doors. Snow gathers on the unfinished ramparts through a hard Moscow winter.\n\n#weak Pay the required price to advance the ceremony to its next stage — or wait if the moment is not yet right.#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_130:0 "スパスカヤの門には鉄の扉が掛けられ、どの塔にもツバメの胸壁が取り付けられています。"
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_130:0 "城壁は雪の下に裸で立っており、胸壁はまだ建てられていません。"
 TV_WONDER_CEREMONY_CARD_ICON_S7_130:0 "@tv_ceremony_art_work!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_130:0 "#Y In progress#! — #high The Palace of Facets Is Fitted Out#!\n#F Inside the walls the Palace of Facets rises for state receptions, its diamond-patterned stone facade unlike anything seen in Moscow before, while the last cathedral bells are hung and rung初めて。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_130:0 "#G 完成#! — #high ファセット宮殿が完成#!\n#F 城壁の内側には、公式レセプションのためにファセット宮殿がそびえ立ち、そのダイヤモンド模様の石造りのファサードは、これまでのモスクワで見られたものとは異なり、大聖堂の最後の鐘が吊り下げられ、鳴らされています。初めて。#!"
 TV_WONDER_CEREMONY_S7_TITLE_130:0 "[tv_wonder_ceremony|E]：ファセットの宮殿が完成しました"
 TV_WONDER_CEREMONY_S7_DESC_130:0 "Inside the walls the Palace of Facets rises for state receptions, its diamond-patterned stone facade unlike anything seen in Moscow before, while the last cathedral bells are hung and rung for the first time.アンサンブル全体が完成に近づくにつれて、職人たちがドームに金メッキを施します。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合はお待ちください。#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_130:0 "ついに鐘を鳴らしましょう！"
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_130:0 "金箔は金箔を脇に置き、ドームはしばらく鈍いままにしておきました。"
 TV_WONDER_CEREMONY_CARD_ICON_S8_130:0 "@tv_ceremony_ruler!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_130:0 "#Y In progress#! — #high The Tsar Is Crowned Within New Walls#!\n#F The Tsar processes through the Dormition Cathedral to be crowned beneath its five gilded domes, the finished Kremlin's red walls and towers standing as the visible seat #!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_130:0 "#G Completed#! — #high The Tsar Is Crowned Within New Walls#!\n#F The Tsar processes through the Dormition Cathedral to be crowned beneath its five gilded domes, the finished Kremlin's red walls and towers standing as the visible seat #!"
 TV_WONDER_CEREMONY_S8_TITLE_130:0 "[tv_wonder_ceremony|E]：皇帝は新たな壁の中で戴冠する"
 TV_WONDER_CEREMONY_S8_DESC_130:0 "ツァーリは生神女就寝大聖堂を通過し、その 5 つの金色のドームの下で戴冠式を行います。完成したクレムリンの赤い壁と塔は目に見える彼の権威の座として立っています。 Moscow's fortress-palace now anchors the Tsardom's legitimacy for all who look upon its walls.\n\n#weak Pay the required price to complete the ceremony — the wonder's final building will rise as a result.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_130:0 "皇帝は5つの金色のドームの下にひざまずいて王冠を受け取ります。"
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_130:0 "まだですよ！"
 TV_WONDER_CEREMONY_CARD_ICON_S1_131:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_131:0 "#Y 進行中#! — #high 司祭たちは神々の場所に名前を付ける#!\n#F 市の司祭たちはツイン・ピークの下の谷をかつて神々が世界を作り直すために集まった場所であると宣言し、最初に火がついた場所を示す神聖な大道とピラミッドの建設を求めた焼けました。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_131:0 "#G 完了#! — #high 司祭たちは神々の場所に名前を付ける#!\n#F 市の司祭たちはツイン・ピークの下の谷をかつて神々が世界を作り直すために集まった場所であると宣言し、最初に火が点いた場所を示す神聖な大通りとピラミッドの建設を求めた焼けました。#!"
 TV_WONDER_CEREMONY_S1_TITLE_131:0 "[tv_wonder_ceremony|E]：神官が神々の場所に名前を付ける"
 TV_WONDER_CEREMONY_S1_DESC_131:0 "市の司祭らは、ツイン・ピークの下にあるこの谷を、かつて神々が世界を作り直すために集まった場所であると宣言し、その火が最初に燃えた場所を示す神聖な大通りとピラミッドの建設を求めている。建設者と貢ぎ物を送るために、高地中の同盟系統に知らせが送られます。\n\n#weak 儀式を次の段階に進めるために必要な代金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_131:0 "祭司たちはこの谷を神々の住処であると宣言します。"
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_131:0 "まだです — 神々に待ってもらいましょう!"
