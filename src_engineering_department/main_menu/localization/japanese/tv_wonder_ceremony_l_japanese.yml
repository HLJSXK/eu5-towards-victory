 TV_WONDER_CEREMONY_S4_DESC_165:0 "最初の鍛冶ホールとそれに隣接する校正場の周囲には石の壁がそびえ立ち、そこですべての刃がテストされます。これまではチャーターで集められた鉱石が、本物の金床を打つハンマーになります。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_165:0 "石工たちは、待機中の校正ヤードの周囲にある鍛冶場の壁を立ち上げます。"
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_165:0 "そんなに速くないよ！"
 TV_WONDER_CEREMONY_CARD_ICON_S5_165:0 "@tv_ceremony_army_tradition!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_165:0 "#Y 進行中#! — #high 焼き入れの秘密は完成しました#!\n#F S鍛冶職人は刃物鋼の焼き戻しと焼き入れの正確な方法を守り、その技術をマスターから選ばれた弟子にのみ伝えます。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_165:0 "#G 完了#! — #high 焼き入れの秘密は完璧です#!\n#F S鍛冶職人は刃物鋼の焼き戻しと焼き入れの正確な方法を守り、その技術をマスターから選ばれた弟子にのみ伝えます。#!"
 TV_WONDER_CEREMONY_S5_TITLE_165:0 "[tv_wonder_ceremony|E]：クエンチの秘密が完成"
 TV_WONDER_CEREMONY_S5_DESC_165:0 "鍛冶屋は刃物鋼の焼き戻しと焼き入れの正確な方法を守り、その技術をマスターから選ばれた弟子にのみ伝えます。トレドのブレードは、あらゆるライバル工房をしのぐ評判を獲得し始めています。\n\n#weak 式典を次の段階に進めるために必要な代金を支払います。または、まだ適切なタイミングではない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_165:0 "私たちは、苦労して勝ち取ったこの秘密を、最もふさわしい見習いにのみ託します。"
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_165:0 "マスターたちはもう少しの間、秘密を守ります。"
 TV_WONDER_CEREMONY_CARD_ICON_S6_165:0 "@tv_ceremony_control!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_165:0 "#Y 進行中#! — #high すべてのブレードが校正に直面します#!\n#F 検査員は、完成した各ブレードを校正ヤードのブロックに押し付けて曲げます。ひび割れたり真っすぐに伸びなかったブレードは、壊れて再び溶けます。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_165:0 "#G 完了#! — #high すべての刃が校正に直面します#!\n#F 検査員は、完成した各刃を校正場でブロックに当てて曲げます。ひび割れたり真っすぐに伸びなかった刃は、壊れて再び溶けます。#!"
 TV_WONDER_CEREMONY_S6_TITLE_165:0 "[tv_wonder_ceremony|E]：あらゆる刃が証明に直面する"
 TV_WONDER_CEREMONY_S6_DESC_165:0 "検査員は完成したブレードを校正場でブロックに押し付けて曲げます。ひびが入ったり真っ直ぐに伸びなかったものは壊れて再び溶けてしまいます。合格した刃だけが武器庫の棚に掛けられます。\n\n#weak 儀式を次の段階に進めるために必要な代金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_165:0 "テストされていないブレードは信頼されていないブレードです。"
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_165:0 "ブレードの試用期間をもう少し長くしたいと思います。"
 TV_WONDER_CEREMONY_CARD_ICON_S7_165:0 "@tv_ceremony_demand!"
