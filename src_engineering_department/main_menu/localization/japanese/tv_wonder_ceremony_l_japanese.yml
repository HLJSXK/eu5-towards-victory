 TV_WONDER_CEREMONY_S4_DESC_166:0 "石のアーチがついにガリシアの川にそびえ立ち、途中に最初の道端の神社が設置されます。これまで祝福と誓約だったものが、巡礼者が実際に端から端まで歩ける道になります。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_166:0 "ついに川を渡りました！"
