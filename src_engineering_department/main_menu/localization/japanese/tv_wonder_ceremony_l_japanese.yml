 TV_WONDER_CEREMONY_S1_DESC_215:0 "ザクセン州の法廷は、エルベ川のほとりに、選帝侯たちが増え続ける絵画、磁器、珍品を保管するための新しいギャラリーを建設することを宣言した。宮廷画家は、壁が 1 枚も存在しないうちに最初のホールをスケッチするために呼び出されます。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
