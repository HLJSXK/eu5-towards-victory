 TV_WONDER_CEREMONY_CARD_ICON_S4_143:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_143:0 "#Y 進行中#! — #high 合唱団の最初の橋脚が設置されました#!\n#F 石工たちは、新しく掘った基礎に合唱団の最初の石の橋脚を設置しました。長年の計画を経て、大聖堂はついにイル・ド・ラの上にそびえる目に見える工事となりました。引用.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_143:0 "#G 完成#! — #high 聖歌隊の最初の橋脚が設置されました#!\n#F 石工たちは、新しく掘った基礎に聖歌隊の最初の石の橋脚を設置しました。長年の計画を経て、大聖堂はついにイル・ド・ラの上にそびえる目に見える工事となりました。引用.#!"
