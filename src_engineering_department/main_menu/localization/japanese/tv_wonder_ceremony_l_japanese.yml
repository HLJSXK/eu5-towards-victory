 TV_WONDER_CEREMONY_S5_TITLE_185:0 "[tv_wonder_ceremony|E]：初のゴールデンドームの金メッキ"
 TV_WONDER_CEREMONY_S5_DESC_185:0 "職人たちは、大聖堂の中央のドームに金箔の薄いシートを打ち付けます。これは、ドニエプル川を下るすべての船から修道院が見えるようにするための、費用のかかる作業です。ドームが最初の日の光を受けるのを見ようと、巡礼者がすでに門に集まっています。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。あるいは、まだその瞬間が適切でない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_185:0 "巡礼者がドームの下に集まる中、職人たちがドームに金箔を打ち付けています。"
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_185:0 "私たちはまだドームの金メッキにお金をかける準備ができていません。"
 TV_WONDER_CEREMONY_CARD_ICON_S6_185:0 "@tv_ceremony_writer!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_185:0 "#Y 進行中#! — #high Scribes Scriptorium を埋め尽くす#!\n#F 洞窟の上にある新しい石室では、修道士たちが羊皮紙とインクの上でかがんで、ラブラの名声を伝えることになる年代記、福音書、聖人たちの生涯を写し取っています。 Rus.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_185:0 "#G 完了#! — #high S筆記者がスクリプトリウムを埋め尽くします#!\n#F 洞窟の上にある新しい石室では、修道士たちが羊皮紙とインクの上でかがんで、ラブラの名声を伝えることになる年代記、福音書、聖人たちの生涯を写し取っています。 Rus.#!"
 TV_WONDER_CEREMONY_S6_TITLE_185:0 "[tv_wonder_ceremony|E]：書記がスクリプトリウムを埋める"
 TV_WONDER_CEREMONY_S6_DESC_185:0 "洞窟の上にある新しい石造りの独房では、修道士たちが羊皮紙とインクの上に身をかがめて、大修道院の名声をルーシ全土に伝えることになる年代記、福音書、聖人たちの生涯を模写しています。羽ペンの引っ掻き音は、下の石工のノミと同じくらい一定の音になります。\n\n#weak 式典を次の段階に進めるために必要な代金を支払います。または、その瞬間がまだ適切でない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_185:0 "修道士たちは羊皮紙の上にかがみ込み、ラブラの名声を遠くまで伝えることになる年代記を書き写しています。"
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_185:0 "スクリプトリウムの独房は空のままで、羽根ペンは手つかずのままです。"
