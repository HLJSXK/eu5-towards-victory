 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_185:0 "#Y 進行中#! — #high 大修道院はドニエプル川の上に輝いています#!\n#F メトロポリタンは、遥か下の川岸から聞こえてくる典礼の中で、完成した生神女就寝大聖堂とその輝くドームを聖別し、洞窟修道院を宣言します。すべてのロシアで誰にも負けないラブラ。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_185:0 "#G 完成#! — #high 大修道院はドニエプル川の上に輝いています#!\n#F メトロポリタンは、はるか下の川岸から聞こえてくる典礼の中で、完成した生神女就寝大聖堂とその輝くドームを聖別し、洞窟修道院を宣言します。すべてのロシアで誰にも負けないラブラ。#!"
 TV_WONDER_CEREMONY_S8_TITLE_185:0 "[tv_wonder_ceremony|E]：ドニエプル川の上に輝く大修道院"
 TV_WONDER_CEREMONY_S8_DESC_185:0 "メトロポリタンは完成した生神女就寝大聖堂とその輝くドームを遥か下の川岸から聞こえる典礼で奉献し、この洞窟修道院がルーシ全土で比類のない修道院であると宣言した。この日から、その経典と遺物は学者も信者も同様に引き寄せ、領域全体の学習と献身が加速します。\n\n#weak 儀式を完了するために必要な料金を支払います。その結果、驚異の最終的な建物が完成します。#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_185:0 "メトロポリタン大聖堂が光り輝くドームを聖別し、ラブラの鐘がドニエプル川に響き渡ります。"
