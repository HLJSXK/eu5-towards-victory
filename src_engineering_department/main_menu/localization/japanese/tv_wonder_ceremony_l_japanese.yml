 TV_WONDER_CEREMONY_CARD_ICON_S5_132:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_132:0 "#Y 進行中#! — #high 雨を抑えるために堤防がそびえ立つ#!\n#F 大きな土壁は乾季が進むごとに高く登り、石造りの水門がその長さに設置され、水を制御するためにアンコール遺跡の技術者たちは知っている。モンスーン.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_132:0 "#G 完了#! — #high 雨を抑えるために堤防がそびえ立つ#!\n#F 大きな土壁は乾季が進むごとに高く登り、石造りの水門がその長さに設置され、水を制御するためにアンコール遺跡の技術者たちは知っている。モンスーン.#!"
 TV_WONDER_CEREMONY_S5_TITLE_132:0 "[tv_wonder_ceremony|E]：雨を防ぐために堤防がそびえ立つ"
 TV_WONDER_CEREMONY_S5_DESC_132:0 "大きな土壁は乾期が進むごとに高くなり、モンスーンとともにやってくるとアンコールの技術者が知っている水を制御するためにその長さに石造りの水門が設置されている。神社の塔は隅に建てられており、いつか祭司が貯水池の開通を司ることになります。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、その瞬間がまだ適切でない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_132:0 "堤防の角には神社の塔がそびえ立つ中、石工たちは岩の水門に面している。"
