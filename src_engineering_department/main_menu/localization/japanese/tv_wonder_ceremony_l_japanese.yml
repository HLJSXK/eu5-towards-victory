 TV_WONDER_CEREMONY_S8_DESC_174:0 "司祭たちは集まった宮廷、ダンサー、数千人の巡礼者の前でクンバビシェカムを行い、寺院の頂上に聖別された水を注ぎます。ブリハディーシュヴァラ寺院の完成により、シヴァ神の祝福が今後何世代にもわたってチョーラ王冠に結び付けられます。\n\n#weak 儀式を完了するために必要な料金を支払います。その結果、驚異の最終的な建物が完成します。#!"
