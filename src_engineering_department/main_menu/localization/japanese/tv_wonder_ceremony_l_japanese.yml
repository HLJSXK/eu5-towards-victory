 TV_WONDER_CEREMONY_S6_DESC_166:0 "旅の終わりには、コンポステーラ大聖堂の塔が街の上にそびえ立ち、旅に疲れた旅行者を歓迎します。この 2 つの尖塔を眺めるだけでも、この距離を歩く価値があるという噂が広まりました。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングではない場合は待ちます。#!"
