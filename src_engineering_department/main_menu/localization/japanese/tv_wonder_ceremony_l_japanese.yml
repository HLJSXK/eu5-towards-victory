 TV_WONDER_CEREMONY_S7_DESC_189:0 "新しいマドラサがそびえ立つミナレットの影にそびえ立ち、その学生たちはすでに未完成の中庭に集まり、塔のランタンが毎日最初で最後の光を捉えるのを見守っています。キャラバン商人はモスクの門で立ち止まり、草原を 1 日かけて車で走っても塔が見えることに驚きます。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
