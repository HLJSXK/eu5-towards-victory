 TV_WONDER_CEREMONY_S3_TITLE_155:0 "[tv_wonder_ceremony|E]：ナヴィッリ号の大理石のはしけ"
 TV_WONDER_CEREMONY_S3_DESC_155:0 "カンドリア大理石を積んだはしけがナヴィッリ運河を街に向かって滑走します。各ブロックには通行料金を無料にするためにファッブリカのマークが刻印されています。建築現場の周囲には彫刻家の工房が立ち並び、デザインに必要な数千の彫像を彫刻します。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
