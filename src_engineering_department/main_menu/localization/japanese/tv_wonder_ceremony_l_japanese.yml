 TV_WONDER_CEREMONY_S2_DESC_114:0 "カドーレとモンテッロの森から、共和国のマークの下でいかだに繋がれたオークとカラマツが川を下っていきます。監督官は、アルセナーレプロヴェディトリの台帳に照らして各丸太を数えます。\n\n#weak 式典を次の段階に進めるために必要な代金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
