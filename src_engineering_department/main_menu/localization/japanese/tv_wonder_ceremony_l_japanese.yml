 TV_WONDER_CEREMONY_S8_DESC_182:0 "総長は完成した要塞修道院を聖マリア礼拝堂でミサで聖別し、その赤い壁は現在キリスト教世界最大のレンガ造りの要塞となっている。この日から、騎士団の騎士たちは規律と忍耐力を持って集結し、マルボルクの完成した城壁が何世代にもわたってインスピレーションを与えることになるでしょう。\n\n#weak 儀式を完了するために必要な料金を支払います。その結果、驚異の最終的な建物が完成します。#!"
