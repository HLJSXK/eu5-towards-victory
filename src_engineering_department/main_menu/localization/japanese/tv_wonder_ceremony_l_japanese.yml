 TV_WONDER_CEREMONY_S2_TITLE_168:0 "[tv_wonder_ceremony|E]：壁の中のサイト"
 TV_WONDER_CEREMONY_S2_DESC_168:0 "当局は、公国の他の取引を妨げずに鋳物工場が水と燃料を汲み上げることができる城壁近くの土地をマークしている。隣接するワークショップは、今後の武器庫のためのスペースを確保するために補償されます。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、そのタイミングがまだ適切でない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_168:0 "役人は地面に印を付け、隣人の賦課金を清算します。"
