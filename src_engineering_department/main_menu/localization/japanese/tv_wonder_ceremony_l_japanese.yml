 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_186:0 "#Y 進行中#! — #high 司祭が柵の敷地を祝福#!\n#F 最初の杭が打たれる前に、主催者とともに旅する正教会の司祭が整地された土地とシックの旗を祝福し、一方自由民は柵の周りでコサックの誓いを立てる。焚き火.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_186:0 "#G 完了#! — #high 司祭が柵の敷地を祝福#!\n#F 最初の杭が打たれる前に、主催者とともに旅行する正統派の司祭が整地された土地とシックの旗を祝福し、自由民は柵の周りでコサックの誓いを立てる。焚き火.#!"
 TV_WONDER_CEREMONY_S3_TITLE_186:0 "[tv_wonder_ceremony|E]：司祭が柵の地を祝福する"
 TV_WONDER_CEREMONY_S3_DESC_186:0 "最初の杭が打たれる前に、主催者とともに旅する正教会の司祭が開墾された土地とシックの旗を祝福し、自由民たちはたき火の周りでコサックの誓いを立てる。釘や斧の頭を形作るために、初めて鍛冶場に火が点かれます。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
