 TV_WONDER_CEREMONY_S4_DESC_108:0 "石工たちは、天守閣が建つ場所の下にある大きく傾斜した石垣の土台をはめ込み、初めて労働者たちが周囲の壁ではなく天守閣そのものについて話しました。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。あるいは、まだ適切なタイミングでない場合は待ちます。#!"
