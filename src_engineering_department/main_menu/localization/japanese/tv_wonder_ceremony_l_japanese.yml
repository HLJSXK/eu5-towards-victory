 TV_WONDER_CEREMONY_S6_TITLE_155:0 "[tv_wonder_ceremony|E]：空飛ぶバットレスが金庫室にまたがる"
 TV_WONDER_CEREMONY_S6_DESC_155:0 "フライングバットレスはクリアストーリーから外側に向かって弧を描き、頭上の野心的な石造りの丸天井を支えています。この解決策は、イタリアとアルプス横断の巨匠の間で数十年にわたる議論を経て最終的に解決されました。建物のゴシック様式の尖塔がミラノの街並みの上に突き刺さり始めます。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
