 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_155:0 "#Y 進行中#! — #high ミラノ、白大理石の大聖堂建設を誓う#!\n#F 大司教とヴィスコンティ公は共同して、ミラノに、ロンバルディア州のどの大聖堂とも異なるゴシック様式の大聖堂を建てると宣言する。カンドリアの採石場.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_155:0 "#G 完了#! — #high ミラノ、白大理石の大聖堂建設を誓う#!\n#F 大司教とヴィスコンティ公爵は共同して、ミラノがロンバルディア州のどの大聖堂とも異なるゴシック様式の大聖堂を建てると宣言する。カンドリアの採石場.#!"
 TV_WONDER_CEREMONY_S1_TITLE_155:0 "[tv_wonder_ceremony|E]：ミラノ、白い大理石の大聖堂を誓う"
 TV_WONDER_CEREMONY_S1_DESC_155:0 "大司教とヴィスコンティ公は共に、カンドリアの採石場で採掘された輝く白い大理石で全面を覆った、ロンバルディア州のどの大聖堂とも異なるゴシック様式の大聖堂をミラノに建てると宣言した。ファッブリカ デル ドゥオーモは、必要な限り労働を監督するために設立されました。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_155:0 "私たちは今、そう誓います。どんなに時間がかかっても、ミラノには白い大理石の大聖堂が建てられるでしょう。"
