 TV_WONDER_CEREMONY_S8_DESC_162:0 "現在、珠江沿いには工場住宅が立ち並び、あらゆる海へ向かう商品を積んだ埠頭の上には旗がはためいています。カントンの貿易と外国人船長との慎重な外交により、領土全体が着実に豊かになり、名誉が与えられています。\n\n#weak 儀式を完了するために必要な代金を支払います。その結果、驚異の最終的な建物が建ち上がります。#!"
