 TV_WONDER_CEREMONY_S1_TITLE_114:0 "[tv_wonder_ceremony|E]：総督が大庭を布告"
 TV_WONDER_CEREMONY_S1_DESC_114:0 "シニョリーアは、ヴェネツィア工廠を記憶を超えて拡張し、その門を飲み込みの森へ、その盆地を一気に艦隊を発進させることを宣言している。アルゼナロッティが宣誓を呼び出されると、リアルト川に鐘が鳴り響きます。\n\n#weak セレモニーを次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_114:0 "シニョリーアは法令に封印し、鐘が鳴り響く中アルセナロッティは宣誓を誓う。"
