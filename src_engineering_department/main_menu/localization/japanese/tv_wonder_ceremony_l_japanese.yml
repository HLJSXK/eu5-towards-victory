 TV_WONDER_CEREMONY_S2_DESC_221:0 "使者たちはキャラバンを率いて北へ向かい、フェズやマラケシュから学者を招き、川に沿って南へ向かい、サヘルの宮廷ですでに名声を得ている教師たちを集めた。中庭の壁が完成する前に、本を積んだラクダの列車が到着し始めます。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_221:0 "使者たちはあらゆる著名な主人への招待状を乗せてラクダを北へ駆り立てます。"
