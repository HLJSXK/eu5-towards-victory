 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_169:0 "#Y 進行中#! — #high 最初の講堂が建つ#!\n#F メイソンたちは、アーケードのある地区の近くに適切なスコラの着工し、木材のベンチと一段高い演台が、借り部屋から単独で教えるために建てられたホールへの移行を示しています。#!"
