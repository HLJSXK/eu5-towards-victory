 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_212:0 "#G 完成#! — #high ケルン大聖堂は聖別されます#!\n#F ライン川の上に聖別された大聖堂の建立、その聖歌隊と聖堂には巡礼者と商人が同様に集まり、今日以来、それが燃え上がる信仰と誇りは世界中で感じられています。レルム全体。#!"
