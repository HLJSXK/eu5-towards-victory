 TV_WONDER_CEREMONY_S2_DESC_183:0 "コミュニティの長老たちは地元の県に請願し、旧市街の境界石を越えて拡張する権利を得るために慣習的な料金を支払う。この微妙な交渉は連邦内のあらゆる特権の門で繰り返される。測量士は市場と川岸の間に新しい車線をマークします。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
