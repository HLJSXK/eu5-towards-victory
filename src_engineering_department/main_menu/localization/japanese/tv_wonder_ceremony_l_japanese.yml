 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_155:0 "#Y 進行中#! — #high ドイツの巨匠が設計について相談#!\n#F ミラノの巨匠がプロポーションと構造に関する論争を解決するためにアルプスの向こうから建築家を呼び寄せる。ロンバルディア州ではそのような規模で空飛ぶバットレスを建てた人はいないからである。前.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_155:0 "#G 完成#! — #high ドイツの巨匠が設計について相談#!\n#F ミラノの巨匠がプロポーションと構造をめぐる論争を解決するためにアルプスの向こうから建築家を呼び寄せる。ロンバルディア州ではこれほどの規模で空飛ぶバットレスを建てた人はいないからだ。前.#!"
 TV_WONDER_CEREMONY_S2_TITLE_155:0 "[tv_wonder_ceremony|E]：ドイツのマスターがデザインについて相談"
 TV_WONDER_CEREMONY_S2_DESC_155:0 "ミラノの巨匠たちは、プロポーションと構造をめぐる論争を解決するためにアルプスの向こうから建築家を呼び寄せる。なぜなら、ロンバルディア州でこれほどの規模でフライングバットレスを建てた人は誰もいなかったからである。カンドリアの採石場では、大理石をナヴィッリ運河に流すための免税通行が認められています。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合はお待ちください。#!"
