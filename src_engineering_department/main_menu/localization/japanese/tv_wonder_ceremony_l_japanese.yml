 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_173:0 "#Y 進行中#! — #high 寺院とランプの塔が建てられます#!\n#F 夜のランプの儀式のための小さな寺院と塔が階段に沿って建てられ、夕暮れごとにすぐに鐘の音が水面に響き渡ります。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_173:0 "#G 完了#! — #high 寺院とランプの塔が建てられます#!\n#F 夜のランプの儀式のための小さな寺院と塔が階段に沿って建てられ、夕暮れごとにすぐに鐘の音が水面に響き渡ります。#!"
 TV_WONDER_CEREMONY_S6_TITLE_173:0 "[tv_wonder_ceremony|E]：寺院とランプ塔が建てられる"
 TV_WONDER_CEREMONY_S6_DESC_173:0 "夜の灯火儀式のための小さな寺院や塔が階段に沿って建てられ、夕暮れごとにすぐにその鐘が水面に響き渡ります。司祭は、川に最も近い神社に永住します。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_173:0 "ついに鐘を鳴らしましょう！"
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_173:0 "石工たちは今のところランプ塔を建てないままにしておきます。"
 TV_WONDER_CEREMONY_CARD_ICON_S7_173:0 "@tv_ceremony_death!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_173:0 "#Y 進行中#! — #high 火葬場は離れて設置されます#!\n#F ガート山脈の別の区間が葬儀のために確保され聖別され、死者を神聖な場所に釈放するために遠くの州から家族がやって来る中、その煙は着実に上がっています。川.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_173:0 "#G 完了#! — #high 火葬場は離れて設置されます#!\n#F ガート山脈の別の区間が葬儀のために確保され聖別され、家族が死者を神聖な場所に釈放するために遠くの州からやって来る中、その煙は着実に上がっています。川.#!"
 TV_WONDER_CEREMONY_S7_TITLE_173:0 "[tv_wonder_ceremony|E]：火葬場は離れています"
 TV_WONDER_CEREMONY_S7_DESC_173:0 "ガートの別の区域は葬儀のために取り分けられ、聖別され、遠くの州から家族が死者を神聖な川に流すためにやって来ると、その煙は着実に立ち上っています。出席者は昼も夜も休むことなく火の番をします。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、その瞬間がまだ適切でない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_173:0 "参列者たちは地面を聖別し、最初の葬儀の火を焚きます。"
