 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_120:0 "#G 完了#! — #high 巡礼者の道が整いました#!\n#F 古いアーケードは丁寧に解体され、カーバ神殿の周囲のタワフの流れが聖域の管理人によって調査され、新しいアーケードが立ち上がるべき場所に決して邪魔をしないように印が付けられています。神聖な回路。#!"
 TV_WONDER_CEREMONY_S3_TITLE_120:0 "[tv_wonder_ceremony|E]：巡礼者の道は開かれた"
 TV_WONDER_CEREMONY_S3_DESC_120:0 "古いアーケードは慎重に解体され、カーバ神殿の周りのタワフの流れが聖域の管理人によって研究され、神聖な回路を決して妨げることなく新しいアーケードが立ち上がるべき場所に印が付けられます。新しい列が 1 つ設置される前に、イマームが整地された地面の上で祈りを先導します。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
