 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_223:0 "#G 完了#! — #high 堀は深く掘られています#!\n#F 高い城壁に沿って深い堀が掘られ、掘削した土は上の城壁に直接積み上げられます。江戸時代の古い工法で両方を一度に構築します。#!"
 TV_WONDER_CEREMONY_S5_TITLE_223:0 "[tv_wonder_ceremony|E]：堀が深い"
 TV_WONDER_CEREMONY_S5_DESC_223:0 "そそり立つ城壁に沿って深い堀が掘られ、掘削した土は上の城壁に直接積み上げられ、両方を一度に築くという江戸時代の古い工法が用いられています。シーズンが終わる前に雨が溝を満たし、最初の土工事が試されます。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_223:0 "掘削労働者は堀を深く切り、上の壁に赤土を積み上げます。"
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_223:0 "溝をさらに深く掘る前に、雨で溝をテストしてみます。"
 TV_WONDER_CEREMONY_CARD_ICON_S6_223:0 "@tv_ceremony_lock!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_223:0 "#Y 進行中#! — #high 門は木の中に設置されています#!\n#F 宮殿の道路が土塁と交差する地点には大きな木の門が掛けられ、旅行者が通過する前にそれぞれの門が守られ祝福されています。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_223:0 "#G 完了#! — #high 門は木でできています#!\n#F 宮殿の道路が土塁と交差する地点には大きな木の門が掛けられ、旅行者が通過する前にそれぞれの門が守られ祝福されています。#!"
 TV_WONDER_CEREMONY_S6_TITLE_223:0 "[tv_wonder_ceremony|E]：門は木材に設置されています"
 TV_WONDER_CEREMONY_S6_DESC_223:0 "宮殿の道路が土塁と交差する地点には大きな木の門が吊り下げられており、それぞれの門が守られ、旅行者が通過する前に祝福されています。ブロンズの盾は、宮殿自身の記録として式典を記すために依頼されました。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、その瞬間がまだ適切でない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_223:0 "職人が木の門を吊り下げ、青銅の銘板を鋳造してその日を記念します。"
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_223:0 "祝福されていない門は、旅行者以外の人々も入れます。"
 TV_WONDER_CEREMONY_CARD_ICON_S7_223:0 "@tv_ceremony_defensive_military_stance!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_223:0 "#Y 進行中#! — #high 城壁が首都を囲みます#!\n#F 土塁は首都の周りの最後の隙間を埋め、広い世界のどの壁にも匹敵すると言われる城壁と堀の切れ目のない環を形成します。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_223:0 "#G 完了#! — #high 城壁が首都を囲みます#!\n#F 土塁は首都の周囲の最後の隙間を埋め、広い世界のどの壁にも匹敵すると言われる城壁と堀の途切れることのない環を形成します。#!"
 TV_WONDER_CEREMONY_S7_TITLE_223:0 "[tv_wonder_ceremony|E]：王都を囲む城壁"
 TV_WONDER_CEREMONY_S7_DESC_223:0 "土塁は首都の周りの最後の隙間を埋め、広い世界のどの壁にも匹敵すると言われる城壁と堀の途切れることのない環を形成します。労働者が最後の数マイルを終えても、警備員は完成した区間に沿って定期的な巡回を開始します。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_223:0 "私は最後のギャップを埋め、リングが壊れていないことを宣言します。"
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_223:0 "最後の数マイルが待ち構えており、リングの差は開いたままだ。"
