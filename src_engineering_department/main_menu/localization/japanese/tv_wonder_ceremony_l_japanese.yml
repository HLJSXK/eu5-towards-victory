 TV_WONDER_CEREMONY_S3_TITLE_184:0 "[tv_wonder_ceremony|E]：総長が最初のアーケードを祝福"
 TV_WONDER_CEREMONY_S3_DESC_184:0 "新しく任命された学長は、貴族も市民も同様に出席するラテン語のミサでこの場所を祝福し、石工たちは大学の特徴であるアーケード付きの中庭のための石の橋脚の切断を始める。最初の印刷機は、適切なホールを待つために仮小屋で開梱されます。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、そのタイミングがまだ適切でない場合は待ちます。#!"
