 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_165:0 "#G 完了#! — #high トレド・スティール・アームズ・ザ・レルム#!\n#F 武器庫は現在フル稼働しており、その刃と鎧は王国中の法廷からキャンプファイヤーまで有名です。#!"
 TV_WONDER_CEREMONY_S8_TITLE_165:0 "[tv_wonder_ceremony|E]：トレド・スティール・アームズ・ザ・レルム"
 TV_WONDER_CEREMONY_S8_DESC_165:0 "現在、武器庫はフル生産されており、その刃と鎧は宮廷からキャンプファイヤーまで王国全体で有名です。トレド鋼を運ぶすべての連隊は、より強力なエッジとその背後にあるより深い兵員の予備力で戦います。\n\n#weak 式典を完了するために必要な代金を支払います。その結果、驚異の最終的な建物が建ち上がります。#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_165:0 "私たちはトレドの鋼鉄が全領域を武装する準備ができていることを宣言します。"
