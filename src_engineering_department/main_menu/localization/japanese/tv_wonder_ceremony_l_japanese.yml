 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_171:0 "#G 完了#! — #high 使節は遠方の海岸に向けて出航#!\n#F 最初の要素と使者は、地元の支配者への紹介状を持って出発し、スーラトとマラバル海岸沿いでの交易の許可を求めます。#!"
 TV_WONDER_CEREMONY_S3_TITLE_171:0 "[tv_wonder_ceremony|E]：使節は遠方の海岸へ出航する"
 TV_WONDER_CEREMONY_S3_DESC_171:0 "最初の要素と使者は、スーラトとマラバル海岸沿いでの貿易の許可を求めて、地元の支配者への紹介状を持って出発します。彼らの指示は、攻撃的な態度をとらないよう警告しています。会社の財産は、金と同じくらい生来の善意にかかっています。\n\n#weak 式典を次の段階に進めるために必要な代金を支払います。あるいは、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_171:0 "私はこれらの手紙をスーラトまで自分で運びますが、途中で気分を害することはありません。"
