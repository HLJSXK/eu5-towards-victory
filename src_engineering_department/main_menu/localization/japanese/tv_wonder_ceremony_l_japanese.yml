 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_214:0 "#Y 進行中#! — #high 使者が控え室を埋め尽くす#!\n#F 最後の漆喰が乾く前から、リーグタウンからの特使や関係者が控え室を埋め始め、新しいリーグで最初に請願書を提出したいと熱望している。ホール.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_214:0 "#G 完了#! — #high 使者が控え室を埋め尽くす#!\n#F 最後の漆喰が乾く前から、リーグタウンからの特使や関係者が控え室を埋め始め、新しいリーグで最初に請願書を提出したいと熱望している。ホール.#!"
 TV_WONDER_CEREMONY_S7_TITLE_214:0 "[tv_wonder_ceremony|E]：控えの間に使節が詰めかける"
 TV_WONDER_CEREMONY_S7_DESC_214:0 "最後の漆喰が乾く前から、リーグタウンからの特使や関係者が控室を埋め始め、新しいホールに最初に請願書を提出しようと躍起になっている。議会は需要に応えるために追加のベンチを発注しました。\n\n#weak 式典を次の段階に進めるために必要な代金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_214:0 "評議会は、混雑する使節のために追加のベンチを彫るよう注文しました。"
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_214:0 "控えの間は、使者を待つためにしばらくの間、シャッターを閉めたままになります。"
