 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_171:0 "#Y 進行中#! — #high 王室憲章は封印されています#!\n#F 王室憲章には大印が押され、冒険商人の一団に喜望峰以東で貿易する独占的権利が与えられました。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_171:0 "#G 完了#! — #high 王室憲章は封印されています#!\n#F 王室憲章には大印が押され、冒険商人の一団に喜望峰以東で貿易する独占的権利が与えられました。#!"
 TV_WONDER_CEREMONY_S1_TITLE_171:0 "[tv_wonder_ceremony|E]：王室憲章は封印されています"
 TV_WONDER_CEREMONY_S1_DESC_171:0 "王室憲章には大印が押されており、冒険商人の一団に喜望峰以東で交易する独占的権利を与えている。購読者は、インクが乾く前に資本を誓約するためにホールに群がります。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_171:0 "加入者は、ワックスが冷める前に資本を約束するために前に進みます。"
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_171:0 "私たちはまだこれほど広大な憲章に印を押すつもりはありません。"
