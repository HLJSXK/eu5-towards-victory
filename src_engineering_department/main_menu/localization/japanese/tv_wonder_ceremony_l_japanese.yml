 TV_WONDER_CEREMONY_CARD_ICON_S1_186:0 "@tv_ceremony_parliament!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_186:0 "#Y 進行中#! — #high 議会は新たなシックを要求#!\n#F 川岸の公開集会に集まったコサック議会は、諸侯の影響を受けずに急流を越えたところに新たな要塞キャンプを建設することを拍手で投票する。 writ.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_186:0 "#G 完了#! — #high 議会は新たなシックを要求#!\n#F 川岸の公開集会に集まったコサック議会は、諸侯の影響を受けず、急流の向こうに新たな要塞キャンプを建設することを拍手で投票する。 writ.#!"
 TV_WONDER_CEREMONY_S1_TITLE_186:0 "[tv_wonder_ceremony|E]：Rada は新しいシックを求めています"
 TV_WONDER_CEREMONY_S1_DESC_186:0 "川岸の公開集会に集まったコサック幹部は、領主の令状に関係なく、急流の向こうに新たな要塞キャンプを建設することを拍手で投票する。クリン アタマンは草原を越えてライダーを送り込み、森と柵に自由の民を呼び寄せます。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_186:0 "アタマンたちはラーダの呼びかけに耳を傾け、乗り手を草原に送り込みます。"
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_186:0 "忍耐 — ラーダにもっと長く話させてください!"
 TV_WONDER_CEREMONY_CARD_ICON_S2_186:0 "@tv_ceremony_river!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_186:0 "#Y 進行中#! — #high 急流の向こうの島を選ぶ#!\n#F キッシュのオタマンと長老コサックは、ドニエプル川の急流の向こうの島々や川の曲がり角を偵察し、水による接近、アシとヤナギの茂み、そしてその流れを判断します。カーンや王の手が届く距離。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_186:0 "#G 完了#! — #high 急流の向こうの島を選ぶ#!\n#F キッシュのオタマンと長老のコサックは、ドニエプル川の急流の向こうの島々や川の曲がり角を偵察し、水による接近、葦と柳の茂み、そしてその流れを判断します。カーンや王の手が届く距離。#!"
 TV_WONDER_CEREMONY_S2_TITLE_186:0 "[tv_wonder_ceremony|E]：急流の向こうの島を選ぶ"
 TV_WONDER_CEREMONY_S2_DESC_186:0 "キシュのオタマンや長老のコサックは、ドニエプル川の急流を越えた先の島や川の曲がり角を偵察し、水による接近、葦と柳の茂み、カーンや王の手の届く距離からの距離などを判断します。樫の丸太のいかだを上流で結びつけ、選んだ地面に浮かべます。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_186:0 "オタマンたちは選んだ島に印を付け、材木いかだを流します。"
