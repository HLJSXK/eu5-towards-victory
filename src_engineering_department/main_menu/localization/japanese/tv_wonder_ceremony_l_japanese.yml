 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_213:0 "#Y 進行中#! — #high コントールが門を開く#!\n#F リーグの旗の下でコントールの門が開き、計数室にはスタッフが配置され、クレーンが回転します。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_213:0 "#G 完了#! — #high コントールが門を開く#!\n#F リーグの旗の下でコントールの門が開き、計数室にはスタッフが配置され、クレーンが回転します。#!"
 TV_WONDER_CEREMONY_S8_TITLE_213:0 "[tv_wonder_ceremony|E]：Kontor が門を開く"
 TV_WONDER_CEREMONY_S8_DESC_213:0 "リーグの旗の下でコントールの門が開き、集計室にはスタッフが配置され、クレーンが回転します。バルト海と北海の商人は今では習慣としてハンブルクを経由して取引を行っており、王冠の金庫は季節ごとに違いを感じます。\n\n#weak 儀式を完了するために必要な代金を支払います。その結果、驚異の最終的な建物が建ち上がります。#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_213:0 "門は大きく揺れ、ついにリーグの旗が港の風を捉えます。"
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_213:0 "急いで開かれた門は、商人同様に泥棒をも歓迎します。"
 TV_WONDER_CEREMONY_CARD_ICON_S1_214:0 "@tv_ceremony_parliament!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_214:0 "#Y 進行中#! — #high リューベックで評議会が招集#!\n#F リューベックの評議会は宣言に立ち会うために各リーグの町から使者を呼び寄せる: 新しい市庁舎はマリエン教会の横に建ち、ハンザ教会を主催するのに十分な大きさとなる。それ自体。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_214:0 "#G 完了#! — #high リューベックで評議会が招集#!\n#F リューベックの評議会は宣言に立ち会うために各リーグの町から使者を召喚する: 新しい市庁舎はマリエン教会の横に建てられ、ハンザ教会を主催するのに十分な大きさになるそれ自体。#!"
 TV_WONDER_CEREMONY_S1_TITLE_214:0 "[tv_wonder_ceremony|E]：リューベックで評議会が招集される"
 TV_WONDER_CEREMONY_S1_DESC_214:0 "リューベック市議会は、この宣言に立ち会うために各リーグの町から使者を招集する。新しい市庁舎はマリエン教会の横に建てられ、ハンセ教会を主催するのに十分な大きさである。シールが貼られ、インクが乾く前に外交官がその知らせを持って南に派遣されます。\n\n#weak 式典を次の段階に進めるために必要な代金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_214:0 "評議会は印を押し、外交官を南へ派遣する。"
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_214:0 "ワックスが冷える前に、性急にシールが破れてしまいます。"
 TV_WONDER_CEREMONY_CARD_ICON_S2_214:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_214:0 "#Y 進行中#! — #high マーケット広場を片付けます#!\n#F マーケット広場の隅から屋台と日よけを片付けて、基礎のためのスペースを作ります。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_214:0 "#G 完了#! — #high マーケット広場を片付ける#!\n#F マーケット広場の隅から屋台と日よけを片付けて、基礎のためのスペースを作ります。#!"
 TV_WONDER_CEREMONY_S2_TITLE_214:0 "[tv_wonder_ceremony|E]：マーケット広場のクリアリング"
 TV_WONDER_CEREMONY_S2_DESC_214:0 "マーケット広場の一角から屋台や日よけが撤去され、基礎を置くスペースが確保されます。住民たちは、新しい議場の壁に誰の憲章が貼られるかを評議会が彼らに思い出させるまで、失われた取引日について不平を言います。\n\n#weak 式典を次の段階に進めるために必要な代金を支払います。あるいは、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_214:0 "私たちは屋台の撤去を命じます。ホールは彼らの忍耐に報いるでしょう。"
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_214:0 "市議会は市場広場をしばらく放置する。"
 TV_WONDER_CEREMONY_CARD_ICON_S3_214:0 "@tv_ceremony_law!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_214:0 "#Y 進行中#! — #high ギルド憲章の収集#!\n#F マスターメイソンと市の公証人が憲章、印章、貿易特権を収集し、これらは新しいホールの保管庫に保管されます。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_214:0 "#G 完了#! — #high ギルド憲章を集める#!\n#F マスターメイソンと市の公証人が憲章、印章、貿易特権を集め、これらは新しいホールの保管庫に保管されます。#!"
 TV_WONDER_CEREMONY_S3_TITLE_214:0 "[tv_wonder_ceremony|E]：ギルド憲章の収集"
 TV_WONDER_CEREMONY_S3_DESC_214:0 "マスターメイソンと市の公証人が憲章、印章、貿易特権を集め、これらは新しいホールの金庫室に保管されます。定礎石が設置される前に、市の知事によって定礎石の上で祝福の文が読み上げられます。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_214:0 "憲章は最終的に金庫内に封印されます。"
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_214:0 "私たちはまだ憲章を保管庫に預ける準備ができていません。"
