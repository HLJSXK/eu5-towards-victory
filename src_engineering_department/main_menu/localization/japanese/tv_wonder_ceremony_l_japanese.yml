 TV_WONDER_CEREMONY_S3_DESC_135:0 "当局者らはキングス・ヤードの敷地を正式に聖別するために港に沿って手続きを進め、乾ドック、競売店舗、軍艦のケーブルを伸ばす大規模なロープウォークの計画が最終決定される。工事の各段階を監督する船大工との契約が締結されます。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
