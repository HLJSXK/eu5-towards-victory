 TV_WONDER_CEREMONY_S4_DESC_173:0 "石工たちは最初の石段を水線に直接設置し、計画では砂に線を刻むだけだったところから、建築の本当の仕事が始まった。巡礼者は朝の入浴を一時停止し、各ブロックが所定の位置に落ち着くのを眺めます。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_173:0 "石工たちは最初のブロックを水辺の所定の位置に降ろします。"
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_173:0 "水線マークはもう少し待ってから石を切り出します。"
 TV_WONDER_CEREMONY_CARD_ICON_S5_173:0 "@tv_ceremony_population!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_173:0 "#Y 進行中#! — #high 階段が堤防を登る#!\n#F 何段にも階段が堤防を上がっていき、夜明けに巡礼者の行列が水面に沿って下っていくのに十分な幅があります。#!"
