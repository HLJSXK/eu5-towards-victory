 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_167:0 "#Y 進行中#! — #high サグレスが世界の海図室になる#!\n#F 学校は現在、王国の海事知識の中心地として立っており、そのパイロット、海図、船は着実に地平線を外側に押し広げています。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_167:0 "#G 完了#! — #high サグレスが世界の海図室になる#!\n#F この学校は現在、王国の海事知識の中心地として立っており、そのパイロット、海図、船は着実に地平線を外側に押し広げています。#!"
 TV_WONDER_CEREMONY_S8_TITLE_167:0 "[tv_wonder_ceremony|E]：サグレスが世界のチャートルームになる"
 TV_WONDER_CEREMONY_S8_DESC_167:0 "この学校は現在、王国の海事知識の中心地として立っており、そのパイロット、海図、船は着実に地平線の外へ向かって進んでいます。この海岸から出航するすべての艦隊は現在、サグレスの規律と航続距離を何世代にもわたって受け継いでいます。\n\n#weak 式典を完了するために必要な代金を支払います。その結果、驚異の最終的な建物が完成します。#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_167:0 "私たちはサグレスを世界の海図室であり、その規律が何世代にもわたって存続することを宣言します。"
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_167:0 "学校の鐘はしばらく静かになり、その遺産はまだ宣言されていません。"
