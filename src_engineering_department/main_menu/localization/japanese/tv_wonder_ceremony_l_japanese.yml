 TV_WONDER_CEREMONY_S3_DESC_123:0 "司祭兼計画立案者の指示の下、作業員が中央の塚の周りの大広場を平らにし、その端をウッドヘンジの円を支配する同じ太陽の視線に合わせます。塚の建設が再開される前に、トウモロコシや貝殻のビーズの供物が広場の隅に埋められます。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
