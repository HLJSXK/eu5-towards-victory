 TV_WONDER_CEREMONY_S1_DESC_209:0 "フランク王は、アーヘンの暖かい泉にある宮廷の横に、彼の信仰と帝国の両方を称えるのにふさわしい宮殿の礼拝堂を建てると宣言しました。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合はお待ちください。#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_209:0 "カール大帝はこの宣言に封印し、礼拝堂は暖かい泉のそばにあると名付けられました。"
