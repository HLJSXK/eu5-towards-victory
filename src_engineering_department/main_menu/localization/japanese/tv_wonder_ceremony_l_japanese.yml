 TV_WONDER_CEREMONY_S6_DESC_215:0 "家具職人は、学芸員の監視の下、色と釉薬ごとに並べられた選挙人の磁器を保管するために、内側の部屋に沿ってガラス張りのケースを取り付けます。外国の裁判所でもコレクションの閲覧を求め始めているという噂が広まりました。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。あるいは、まだ適切な時期ではない場合は待ちます。#!"
