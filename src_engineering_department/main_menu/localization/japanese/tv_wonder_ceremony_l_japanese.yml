 TV_WONDER_CEREMONY_S3_DESC_143:0 "司教は、聖職者、学者、王室職員の群衆の前で最初の礎石を祝福し、完成した大聖堂が捧げられる聖母を呼び起こします。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_143:0 "私たちは聖母の名においてこの石を置きます。"
