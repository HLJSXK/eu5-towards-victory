 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_153:0 "#G 完成#! — #high 大理石のファサードがその色を帯びる#!\n#F 大聖堂のファサードは、白、緑、ピンクの大理石の最終的なパターンで面しており、現在、大聖堂の四方から見えるドームのレンガ造りの冠と一致しています。市.#!"
