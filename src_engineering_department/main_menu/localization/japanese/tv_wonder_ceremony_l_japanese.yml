 TV_WONDER_CEREMONY_S3_OPTION_PAY_208:0 "大工は最高級の樫の木に印を付け、事務員は前例の帳簿に封をします。"
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_208:0 "まだです。シールはかろうじて乾いています。"
 TV_WONDER_CEREMONY_CARD_ICON_S4_208:0 "@tv_ceremony_organization!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_208:0 "#Y 進行中#! — #high 議場のフレームが上昇します#!\n#F 木材の額縁職人がレーマーの横にあるホールの最初の梁を上げます。羊皮紙に描かれていたものが、最終的にオークと石の骨組みとして広場の上に立っています。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_208:0 "#G 完了#! — #high 議場の枠が上昇します#!\n#F 木材の額縁職人がレーマーの横にあるホールの最初の梁を上げます。羊皮紙に描かれていたものが、最終的にオークと石の骨組みとして広場の上に立っています。#!"
 TV_WONDER_CEREMONY_S4_TITLE_208:0 "[tv_wonder_ceremony|E]：チャンバーのフレームが上がる"
 TV_WONDER_CEREMONY_S4_DESC_208:0 "木材の額縁職人がローマーの横にあるホールの最初の梁を上げます。羊皮紙に描かれていたものが、最終的にオークと石の骨組みとして広場の上に立っています。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_208:0 "私たちの羊皮紙の計画がついに樫の木と石になっていくのを眺めています。"
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_208:0 "梁は持ち上げられずに地面に置かれたまま、フレーム制作者は立ち止まります。"
 TV_WONDER_CEREMONY_CARD_ICON_S5_208:0 "@tv_ceremony_alliance!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_208:0 "#Y 進行中#! — #high 選挙人の旗が掲げられています#!\n#F 帝国の旗と各選挙人の紋章が議場の壁に沿って掲げられ、開催されるすべての選挙を支配する優先順位を木と布で固定していますここ。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_208:0 "#G 完了#! — #high 選挙人の旗が掲げられています#!\n#F 帝国の旗と各選挙民の紋章が議場の壁に沿って掲げられ、開催されるすべての選挙を支配する優先順位を木と布で固定していますここ。#!"
 TV_WONDER_CEREMONY_S5_TITLE_208:0 "[tv_wonder_ceremony|E]：選挙人の横断幕が掲げられています"
 TV_WONDER_CEREMONY_S5_DESC_208:0 "皇室の旗と各選挙人の紋章が議場の壁に沿って吊り下げられ、ここで行われるすべての選挙を決定する優先順位を木と布で固定しています。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_208:0 "バナーが掲げられると、順序も固定されます。"
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_208:0 "この順序を木と布で修正する準備はまだできていません。"
 TV_WONDER_CEREMONY_CARD_ICON_S6_208:0 "@tv_ceremony_parliament!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_208:0 "#Y 進行中#! — #high 評議会のベンチが設置されました#!\n#F 参加者は、選挙王子が厳密な順序で座る彫刻されたベンチを仕上げます。議論するのに十分な距離であり、選挙人が自分の立場から侮辱を主張できないほど形式的に十分です。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_208:0 "#G 完了#! — #high 評議会のベンチが設置されました#!\n#F 参加者は、選挙王子が厳格な順序で座る彫刻されたベンチを仕上げます。議論するのに十分な距離であり、選挙人が自分の立場から侮辱を主張できないほど形式的に十分です。#!"
 TV_WONDER_CEREMONY_S6_TITLE_208:0 "[tv_wonder_ceremony|E]：評議会のベンチが設置されました"
 TV_WONDER_CEREMONY_S6_DESC_208:0 "ジョイナーは、選挙王子たちが厳格な順序で座る彫刻されたベンチを完成させます。議論できるほど近く、選挙人が自分の席から侮辱を主張できないほど形式的です。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_208:0 "建具職人は、最後に彫られたベンチを注文された場所に正確に設置します。"
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_208:0 "今は気をつけてください。ベンチをひとつ間違えると、王子が怒ってしまいます。"
 TV_WONDER_CEREMONY_CARD_ICON_S7_208:0 "@tv_ceremony_political_power!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_208:0 "#Y 進行中#! — #high 最初の係争中の選挙#!\n#F R最初の投票中、ライバル候補者とその代理人が未完成の議場に群がり、議場は投票によって帝国が作られ、打破される場所としての評判を獲得します。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_208:0 "#G 完了#! — #high 最初の係争中の選挙#!\n#F R最初の投票の間、ライバルの候補者とその代理人が未完成の議場に群がり、議場は投票によって帝国が作られ、打破される場所としての評判を獲得します。#!"
 TV_WONDER_CEREMONY_S7_TITLE_208:0 "[tv_wonder_ceremony|E]：最初の争点選挙"
 TV_WONDER_CEREMONY_S7_DESC_208:0 "最初の投票中、ライバル候補者とその代理人が未完成の議場に群がり、この議場は投票によって帝国が作られ、打破される場所としての評判を獲得します。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。あるいは、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_208:0 "帝国も含めて、私は投票用紙がどこにでも投下されるようにします。"
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_208:0 "ライバル工作員の喧騒に対して、議場のドアは施錠されたままだ。"
 TV_WONDER_CEREMONY_CARD_ICON_S8_208:0 "@tv_ceremony_legitimacy!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_208:0 "#Y 進行中#! — #high 選挙ホールの宣誓は完了しました#!\n#F 議場はレーマーの横で完成し、そのベンチと横断幕は恒久的な順序で整えられました。そしてこの日から、王国が正当な統治に対して行うすべての主張はフランクフルトの選挙人の重みを帯びます。その後ろにあります。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_208:0 "#G 完了#! — #high 選挙ホールの宣誓は完了#!\n#F 議場はレーマー家の傍らに完成し、そのベンチと横断幕は恒久的な順序で並べられ、この日から王国が正当な統治に対して行うすべての主張はフランクフルトの選挙人の重みを帯びるその後ろにあります。#!"
 TV_WONDER_CEREMONY_S8_TITLE_208:0 "[tv_wonder_ceremony|E]：選挙ホールは完成しました"
 TV_WONDER_CEREMONY_S8_DESC_208:0 "レーマー宮殿の横に議場スタンドが完成し、そのベンチと横断幕が恒久的な順序で並べられました。この日から、王国が正当な統治を主張するすべての主張には、フランクフルトの選挙人の重みが伴います。\n\n#weak 式典を完了するために必要な代金を支払います。その結果、驚異の最後の建物が建ち上がります。#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_208:0 "王位は法によって築かれた議場の上に最も確実に立っています。"
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_208:0 "私は最後の誓いを保留しますが、王国の正当性をこの広間に縛り付けるつもりはまだありません。"
