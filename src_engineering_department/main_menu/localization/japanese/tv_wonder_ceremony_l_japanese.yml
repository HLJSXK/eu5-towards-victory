 TV_WONDER_CEREMONY_S7_DESC_162:0 "停泊地に船が混雑する中、言語学者やコンプラドールは夜遅くまで商人の間を往復し、ある季節に火災が発生し、ホン2隻の急いで修理を余儀なくされる。埠頭は以前よりも混雑して再建されています。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
