 TV_WONDER_CEREMONY_S7_OPTION_PAY_154:0 "石工たちは、傾いたシャフトの低い側を短くカットした鐘楼を冠にしています。"
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_154:0 "まだです — ベルを待ってください!"
