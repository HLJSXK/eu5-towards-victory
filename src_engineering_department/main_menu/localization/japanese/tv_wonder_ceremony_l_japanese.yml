 TV_WONDER_CEREMONY_S4_DESC_153:0 "ブルネレスキの独創的なホイストと自立式足場が大聖堂のドラムの上にそびえ立ち、ドームのヘリンボーンのレンガ造りが、それまで図面と議論だけが存在していた場所をついに登り始めます。労働者は時間を節約するために、広場のはるか上空に吊り下げられたプラットフォームで昼食をとります。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
