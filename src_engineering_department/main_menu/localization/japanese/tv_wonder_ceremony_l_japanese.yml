 TV_WONDER_CEREMONY_S2_DESC_219:0 "モスクの教育中庭の法学者や学者は、古い壁の神聖さを損なうような追加がないよう、拡張された敷地が取るべき適切な形式について協議されています。巡礼者はすでにゲートに集まり、計画の展開を見守っています。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
