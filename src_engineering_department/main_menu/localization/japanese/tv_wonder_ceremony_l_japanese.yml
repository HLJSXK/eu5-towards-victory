 TV_WONDER_CEREMONY_S7_DESC_221:0 "マスターが法律、文法、コーラン科学を学ぶ生徒を受け入れるにつれて、中庭全体に指導サークルが増え、各サークルは独自のカーペットと読書スタンドでマークされています。キャラバンは現在、討論を聞くためだけにトンブクトゥを迂回しています。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
