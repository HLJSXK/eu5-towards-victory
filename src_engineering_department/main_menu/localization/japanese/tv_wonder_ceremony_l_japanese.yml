 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_132:0 "#G 完了#! — #high 水路は水田に水を運びます#!\n#F 完成した給水用水路が次々と開通し、バライ川に蓄えられた水を平野を横切って、これまで需要に応じて水やりがなかった田んぼに運びます。#!"
 TV_WONDER_CEREMONY_S7_TITLE_132:0 "[tv_wonder_ceremony|E]：用水路は水田に水を運びます"
 TV_WONDER_CEREMONY_S7_DESC_132:0 "完成した給水用水路は次々と開通され、バライに蓄えられた水を平原を越えて、これまで需要に応じて水やりがなかった畑に運び出す。新しい運河沿いの農家は、来る乾季に向けて 2 回目の米収穫の計画を立て始めます。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_132:0 "私たちは運河を次々と開き、ついには野原に水を飲むことができるようになります。"
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_132:0 "完成した運河には蓋が付いています。畑は次の季節に水を待ちます。"
 TV_WONDER_CEREMONY_CARD_ICON_S8_132:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_132:0 "#Y 進行中#! — #high 司祭たちが勝利の水を放流#!\n#F クメール人の司祭と技術者が主要な水門に集まり、集まった法廷の前で放水の儀式が行われ、貯水池の門が開き、貯水池に蓄えられた水が流れ出ます。地平線上の寺院の全景を望むアンコールの野原。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_132:0 "#G 完了#! — #high 司祭たちが勝利の水を放流#!\n#F クメール人の司祭と技術者が主要な水門に集まり、集まった法廷の前で放水の儀式が行われ、貯水池の門が開き、貯水池に蓄えられた水が流れ出ます。地平線上の寺院の全景を望むアンコールの野原。#!"
 TV_WONDER_CEREMONY_S8_TITLE_132:0 "[tv_wonder_ceremony|E]：司祭たちが勝利の水を放つ"
 TV_WONDER_CEREMONY_S8_DESC_132:0 "クメール人の僧侶と技術者が主要な水門に集まり、集まった法廷の前で放水の儀式が執り行われ、貯水池の門が開き、地平線上の寺院が一望できるアンコールの野原に貯水された水が流れ出た。油圧システムは現在完成しており、バライと運河は干ばつでも洪水でも王国の米を供給しています。\n\n#weak 式典を完了するために必要な代金を支払います。その結果、驚異の最終的な建物が建ち上がります。#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_132:0 "司祭たちが主水門をあけると、アンコールに蓄えられていた水が法廷の前に勝利を収めて押し寄せる。"
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_132:0 "法廷はすでに集まって見守っていますが、私たちは式典をもう一日延期します。"
