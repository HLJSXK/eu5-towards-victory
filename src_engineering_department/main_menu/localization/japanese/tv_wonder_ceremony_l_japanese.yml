 TV_WONDER_CEREMONY_S8_DESC_221:0 "大学は正式に発足し、学者、学生、キャラバン商人などが中庭を埋め尽くし、原稿や教育サークルは今ではサハラ砂漠の端での永続的な学習の灯台となっています。トンブクトゥの奨学金の噂はすべてのキャラバンに伝わり、本が珍重される場所では王国の地位を高めます。\n\n#weak 式典を完了するために必要な代金を支払います。その結果、驚異の最終的な建物が建てられます。#!"
