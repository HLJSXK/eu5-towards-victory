 TV_WONDER_CEREMONY_CARD_ICON_S6_132:0 "@tv_ceremony_lake!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_132:0 "#Y 進行中#! — #high 初めて水が流入#!\n#F 水路が開通し、雨季の増水した川が初めて貯水池に流入し、堤防が上昇を阻止するのを心配そうに見守る技術者ら水.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_132:0 "#G 完了#! — #high 初めて水が入る#!\n#F 水路が開通し、雨季の増水した川が初めて貯水池に流入する。エンジニアたちは堤防が上昇を阻止するのを心配そうに見守る水.#!"
 TV_WONDER_CEREMONY_S6_TITLE_132:0 "[tv_wonder_ceremony|E]：初めて水を入れます"
 TV_WONDER_CEREMONY_S6_DESC_132:0 "雨季に増水した川が初めて貯水池に流入するために水路が切り開かれ、エンジニアたちは堤防が水の上昇を防ぐのを心配そうに見守っている。漁師も農民も同様に内海が満ち始めるのを見るために岸辺に集まります。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_132:0 "水路が切り開かれ、増水した川が流れ込んで待機池を埋め尽くします。"
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_132:0 "水門は閉まったままです。川はもうしばらく古い道を流れ続けることになる。"
