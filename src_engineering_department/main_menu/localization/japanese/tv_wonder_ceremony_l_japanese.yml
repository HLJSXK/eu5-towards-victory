 TV_WONDER_CEREMONY_S8_DESC_143:0 "完成した大聖堂が国王、聖職者、街のギルドの前で奉献されると、鐘の音がシテ島に響き渡り、ノートルダム大聖堂は芸術と王国への献身の永遠の源泉として立っています。\n\n#weak 式典を完了するために必要な料金を支払います。この驚異の最後の建物は、結果.#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_143:0 "ノートルダム大聖堂がついに奉献されると、鐘が鳴り響きます。"
