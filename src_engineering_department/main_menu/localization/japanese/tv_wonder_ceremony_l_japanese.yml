 TV_WONDER_CEREMONY_S4_TITLE_168:0 "[tv_wonder_ceremony|E]：ファウンドリ・ホール・ライズ"
 TV_WONDER_CEREMONY_S4_DESC_168:0 "最初の鋳物工場とそれに隣接する練兵場の中庭の周りを石の壁が登っています。これまで鉱石を運び、職人を集めていたものが、ついに本物の金床を打ち鳴らすハンマーとなります。\n\n#weak 儀式を次の段階に進めるために必要な代金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_168:0 "私たちはこれらの壁を高くします。ついにハンマーを鳴らしてみましょう。"
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_168:0 "集められた鉱石はじっと待っています。壁はまだ地面から登っていません。"
 TV_WONDER_CEREMONY_CARD_ICON_S5_168:0 "@tv_ceremony_cannons!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_168:0 "#Y 進行中#! — #high 鋳物工場が最初の大砲を鋳造する#!\n#F 溶けた青銅が初めて粘土の型に流し込まれ、工廠の最初期の大砲の砲身が庭に並んで冷えます。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_168:0 "#G 完了#! — #high 鋳物工場が最初の銃を鋳造しました#!\n#F 溶けた青銅が初めて粘土の型に流し込まれ、工廠の最初期の大砲の砲身が庭に並んで冷えます。#!"
 TV_WONDER_CEREMONY_S5_TITLE_168:0 "[tv_wonder_ceremony|E]：鋳造工場が最初の銃を鋳造"
 TV_WONDER_CEREMONY_S5_DESC_168:0 "溶けた青銅が初めて粘土の型に流し込まれ、工廠の初期の大砲の砲身が庭に並んで冷える。それに合わせて、隣接するホールでもプレート アーマーの生産がスケールアップします。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_168:0 "溶けた青銅が型に充填され、ミラノ初の大砲の砲身が庭で冷えます。"
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_168:0 "私たちはその時が来る前に青銅を注ぐ勇気はありません。"
 TV_WONDER_CEREMONY_CARD_ICON_S6_168:0 "@tv_ceremony_control!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_168:0 "#Y 進行中#! — #high ギルドが規格を設定します#!\n#F 職人ギルドは武器庫内で組織され、製造されるすべての刀身、胸当て、銃身に対して共通の規格を強制します。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_168:0 "#G 完了#! — #high ギルドが基準を設定する#!\n#F 職人ギルドは武器庫内で組織され、生産されるすべての刀身、胸当て、銃身に対して共通の基準を強制します。#!"
 TV_WONDER_CEREMONY_S6_TITLE_168:0 "[tv_wonder_ceremony|E]：ギルドが基準を定める"
 TV_WONDER_CEREMONY_S6_DESC_168:0 "工廠内に職人ギルドが組織され、製造されるすべての刀身、胸当て、銃身に対して共通の基準が適用されます。中庭では毎日、兵士たちが新しい鎧のフィット感と重量をテストする訓練音が鳴り響きます。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_168:0 "ギルドが集まり、ここで鍛造されるすべてのブレードとバレルに対して 1 つの基準を設定します。"
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_168:0 "ギルドマスターたちは、その基準がまだ設定されていないため、自分たちの対策をくすぶっている。"
 TV_WONDER_CEREMONY_CARD_ICON_S7_168:0 "@tv_ceremony_demand!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_168:0 "#Y 進行中#! — #high 緊急命令でヤードに負担がかかる#!\n#F Cミラノから遠く離れたキャンペーンから緊急の要請が出され、鋳物工場や作業場は通常のペースを超えており、実習生は工場の傍らで夜勤に追われている。マスター.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_168:0 "#G 完了#! — #high 緊急命令でヤードに負担がかかる#!\n#F Cミラノから遠く離れたキャンペーンから緊急の要請が出され、鋳物工場や作業場は通常のペースを超えており、見習いたちは工場と並んで夜勤に追われている。マスター.#!"
 TV_WONDER_CEREMONY_S7_TITLE_168:0 "[tv_wonder_ceremony|E]：緊急の命令でヤードが圧迫される"
 TV_WONDER_CEREMONY_S7_DESC_168:0 "ミラノから遠く離れた遠征では緊急の徴発が出され、鋳物工場や工房は通常のペースを超えており、見習いたちは親方と一緒に夜勤を強いられている。この兵器庫は、短期間で戦争に対処できることを証明しています。\n\n#weak 式典を次の段階に進めるために必要な代金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_168:0 "私たちは前線の呼びかけに応えます。夜勤を始めましょう。"
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_168:0 "徴用巻物は未開封のまま山積みになっている。夜勤のベルは静かなままです。"
 TV_WONDER_CEREMONY_CARD_ICON_S8_168:0 "@tv_ceremony_army_strength!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_168:0 "#Y 進行中#! — #high ミラノの兵器庫が完成しました#!\n#F 兵器庫は現在フル稼働しており、その大砲、鎧、そして規律正しい職人はイタリアのあらゆる宮廷で有名です。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_168:0 "#G 完了#! — #high ミラノのアーセナルスタンドが完成#!\n#F 兵器庫は現在フル稼働しており、その大砲、甲冑、そしてイタリアのあらゆる宮廷で名高い規律ある職人がいます。#!"
 TV_WONDER_CEREMONY_S8_TITLE_168:0 "[tv_wonder_ceremony|E]：ミラノアーセナルスタンド完成"
 TV_WONDER_CEREMONY_S8_DESC_168:0 "現在、兵器庫はフル稼働で稼働しており、その大砲、甲冑、そして規律正しい職人はイタリアのあらゆる宮廷で名を馳せています。これらのワークショップで武装したすべての連隊は、より安定した戦線と、戦場で困難に勝ち得た優位性を持って戦います。\n\n#weak 式典を完了するために必要な代金を支払います。その結果、驚異の最終的な建物が完成します。#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_168:0 "武器庫は満杯に達し、その名声はイタリアのあらゆる宮廷に広まりました。"
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_168:0 "この兵器庫が完成したと言える段階ではまだありません。"
