 TV_WONDER_CEREMONY_S2_TITLE_169:0 "[tv_wonder_ceremony|E]：各国の学者が集結"
 TV_WONDER_CEREMONY_S2_DESC_169:0 "アルプスの向こうから到着した学生たちは、相互の保護と発言を目的として国家を組織し、各自の階級の中から学長を選出します。古いローマの城壁沿いの家主は、部屋を売るのではなく借りるよう説得されます。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
