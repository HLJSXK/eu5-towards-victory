 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_166:0 "#G 完了#! — #high 巡礼者が道路にあふれます#!\n#F 神社での奇跡の物語は大陸中に広がり、ホタテ貝の貝殻はガリシアから最果ての王国まで認められるバッジになります。#!"
 TV_WONDER_CEREMONY_S7_TITLE_166:0 "[tv_wonder_ceremony|E]：巡礼者が道路に溢れている"
 TV_WONDER_CEREMONY_S7_DESC_166:0 "この神社で起きた奇跡の物語は大陸中に広がり、ホタテ貝の貝殻はガリシアから最果ての王国まで認められるバッジとなります。かつては半分空室だったホステルは、今ではベッド不足を理由に夕暮れ時に巡礼者を追い返しています。\n\n#weak 式典を次の段階に進めるために必要な料金を支払うか、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_166:0 "彼らは何千人もやって来ます！"
