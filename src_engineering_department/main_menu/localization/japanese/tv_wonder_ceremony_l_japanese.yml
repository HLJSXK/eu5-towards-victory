 TV_WONDER_CEREMONY_S1_DESC_190:0 "豊かなフェルガナ渓谷の支配者であるコーカンドのカーンは、シルクロードに沿って増大する彼のカーン国の富にふさわしい使節と貢物を受け入れるために新しい宮殿を建設するよう命じました。ブハラとカシュガルの建築家が呼び出され、ペイントされたホールと庭園の最初の計画を作成します。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
