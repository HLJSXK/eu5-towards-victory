 TV_WONDER_CEREMONY_S7_DESC_153:0 "大聖堂のファサードは、白、緑、ピンクの大理石の最終的なパターンで面しており、現在市内のどこからでも見えるドームのレンガの冠と一致しています。足場が部分的に下り、フィレンツェが全体を見るのに 2 世代待った建物が明らかになります。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
