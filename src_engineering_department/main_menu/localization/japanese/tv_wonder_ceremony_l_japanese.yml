 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_166:0 "#G 完了#! — #high カミーノは完成しました#!\n#F 道路、橋、ホステルが最初のウェイポイントから大聖堂の階段まで完成し、誰も予測できなかった数の巡礼者が到着します。#!"
 TV_WONDER_CEREMONY_S8_TITLE_166:0 "[tv_wonder_ceremony|E]：巡礼路が完成しました"
 TV_WONDER_CEREMONY_S8_DESC_166:0 "道路、橋、ホステルは現在、最初のウェイポイントから大聖堂の階段まで完成しており、誰も予想できなかった数の巡礼者が到着します。彼らの献身とコインは同様に、道路が接するすべての町に着実に流れ込み、王国の信仰をより緊密に結び付けています。\n\n#weak 儀式を完了するために必要な代金を支払います。その結果、驚異の最終的な建物が建ち上がります。#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_166:0 "道路、橋、そしてホステルが完成し、ついにすべての町に信仰が流れます。"
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_166:0 "まだですよ！"
 TV_WONDER_CEREMONY_CARD_ICON_S1_167:0 "@tv_ceremony_ruler!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_167:0 "#Y 進行中#! — #high ヘンリー王子が学校を設立#!\n#F ヘンリー王子は、サグレスの風吹きさらしの岬に航海学校を設立することを宣言し、パイロット、地図製作者、天文学者を彼の学校に集めます。原因.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_167:0 "#G 完了#! — #high ヘンリー王子が学校を設立#!\n#F ヘンリー王子は、サグレスの風が吹きすさぶ岬に航海学校を設立することを宣言し、パイロット、地図製作者、天文学者を彼の学校に集めます。原因.#!"
 TV_WONDER_CEREMONY_S1_TITLE_167:0 "[tv_wonder_ceremony|E]：ヘンリー王子が学校を設立"
 TV_WONDER_CEREMONY_S1_DESC_167:0 "ヘンリー王子は、サグレスの風が吹きすさぶ岬に航海術の学校を設立することを宣言し、彼の目的のためにパイロット、地図製作者、天文学者を集めました。法廷では、王子は既知の世界の端を描くつもりだとささやかれています。\n\n#weak 式典を次の段階に進めるために必要な代金を支払います。あるいは、まだその時が適切でない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_167:0 "王子は集まった法廷で航海学校の設立を宣言する。"
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_167:0 "まだです -- 法廷でもう少しささやきましょう!"
 TV_WONDER_CEREMONY_CARD_ICON_S2_167:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_167:0 "#Y 進行中#! — #high 崖沿いの敷地は確保されています#!\n#F 建設業者はラゴス近くの海食崖の上に学校の敷地をマークしています。そこでは大西洋の風がほとんど止まず、すべてのロープやシャッターのテストが行われます。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_167:0 "#G 完了#! — #high 崖沿いの敷地は確保されています#!\n#F 建設業者はラゴス近くの海食崖の上に学校の敷地をマークしています。そこでは大西洋の風がほとんど止まず、すべてのロープやシャッターのテストが行われます。#!"
 TV_WONDER_CEREMONY_S2_TITLE_167:0 "[tv_wonder_ceremony|E]：クリフサイドサイトは確保されています"
 TV_WONDER_CEREMONY_S2_DESC_167:0 "建設業者はラゴス近郊の海食崖の上に学校の敷地をマークしているが、そこでは大西洋の風がすべてのロープやシャッターのテストを止めることはほとんどない。海岸の漁師は、潮流や嵐についての知識を求められます。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_167:0 "私たちは、ラゴスの上空にあるこの風にさらされた崖を学校の基礎であると主張します。"
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_167:0 "測量士たちは撤退し、崖にはマークが付けられたものの引き取られないままになった。"
 TV_WONDER_CEREMONY_CARD_ICON_S3_167:0 "@tv_ceremony_mapmode!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_167:0 "#Y 進行中#! — #high チャートと金融商品が集められています#!\n#F アストロラーベ、ポルトランチャート、星に関する論文は、それらを手放すすべてのポートから収集され、一部は購入され、一部は静かにコピーされます。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_167:0 "#G 完了#! — #high チャートと金融商品が集められています#!\n#F アストロラーベ、ポルトランチャート、星に関する論文は、それらを手放すすべてのポートから収集され、一部は購入され、一部は静かにコピーされます。#!"
 TV_WONDER_CEREMONY_S3_TITLE_167:0 "[tv_wonder_ceremony|E]：チャートと商品が集まっています"
 TV_WONDER_CEREMONY_S3_DESC_167:0 "アストロラーベ、ポートランチャート、星に関する論文は、手放すすべての港から収集され、一部は購入され、一部は静かにコピーされます。学者もパイロットも同様に王子の後援によってサグレスに引き寄せられます。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_167:0 "ついに海図はサグレスに集結！"
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_167:0 "このコレクションが完成したと言う前に、もう少しチャートを集めたいと思います。"
 TV_WONDER_CEREMONY_CARD_ICON_S4_167:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_167:0 "#Y 進行中#! — #high マップ ルームが建設されました#!\n#F 石工たちは、絶え間なく続く大西洋の風に対抗して最初のマップ ルームと展望台の壁を建てます。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_167:0 "#G 完了#! — #high マップ ルームが建設されました#!\n#F 石工たちは、絶え間なく続く大西洋の風に対抗して最初のマップ ルームと展望台の壁を建てます。#!"
 TV_WONDER_CEREMONY_S4_TITLE_167:0 "[tv_wonder_ceremony|E]：マップルームが構築されました"
 TV_WONDER_CEREMONY_S4_DESC_167:0 "石工たちは、絶え間なく続く大西洋の風に耐えながら、最初の地図作成室と展望台の壁を築き上げます。これまで海図を集め、学者を招いていたものが、ついに崖の上に建つ本物の学校となります。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合はお待ちください。#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_167:0 "石工たちは、絶え間なく続く大西洋の風に対抗して地図作成室の壁を立ち上げます。"
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_167:0 "まだです -- まずは基礎を固めましょう!"
 TV_WONDER_CEREMONY_CARD_ICON_S5_167:0 "@tv_ceremony_ship!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_167:0 "#Y 進行中#! — #high カラベルは洗練されています#!\n#F ラゴスの船大工は、新しい航海ごとにパイロットが持ち帰る報告書に基づいて船体と帆の設計をテストし、カラベルをオープンに適した船に形作りますオーシャン.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_167:0 "#G 完了#! — #high カラベルは洗練されています#!\n#F ラゴスの船大工は、新しい航海ごとにパイロットが持ち帰る報告書に基づいて船体と帆の設計をテストし、カラベルをオープンに適した船に形作りましたオーシャン.#!"
 TV_WONDER_CEREMONY_S5_TITLE_167:0 "[tv_wonder_ceremony|E]：カラベルは洗練されています"
 TV_WONDER_CEREMONY_S5_DESC_167:0 "ラゴスの船大工は、新しい航海のたびにパイロットが持ち帰る報告書に基づいて船体と帆の設計をテストし、キャラベル船を外洋に適した船に成形します。失敗したリグはすべて、次の試みに残す価値のあるものを教えてくれます。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングではない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_167:0 "私たちは船大工にキャラベルの再精製を依頼します。"
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_167:0 "船大工たちは船体がまだ未完成のまま、道具を脇に置いた。"
 TV_WONDER_CEREMONY_CARD_ICON_S6_167:0 "@tv_ceremony_time!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_167:0 "#Y 進行中#! — #high パイロットが星を学ぶ#!\n#F 天文学者が地図室に集まったパイロットに推測航法と星の航法を教え、船が新鮮な海岸線を伴って戻ってくると、季節ごとに新しい海図が描かれます。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_167:0 "#G 完了#! — #high パイロットが星を学ぶ#!\n#F 天文学者は地図室に集まったパイロットに推測航法と星の航法を教え、船が新鮮な海岸線を伴って戻ってくると、季節ごとに新しい海図が描かれます。#!"
