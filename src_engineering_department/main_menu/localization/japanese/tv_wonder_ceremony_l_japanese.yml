 TV_WONDER_CEREMONY_S1_DESC_221:0 "トンブクトゥの有力な商人とイマームは、キャラバン貿易そのものから収入を得て、サンコレ・モスクのそばに大学を設立するワクフ寄付を宣言した。原稿販売業者は、この日は祝賀のため屋台を閉めます。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
