 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_166:0 "#G 完了#! — #high 使徒への道が宣言される#!\n#F 司教と王冠は共に、コンポステラの聖ヤコブ神殿への巡礼道を宣言し、それを歩もうとするすべての魂に開かれています。#!"
 TV_WONDER_CEREMONY_S1_TITLE_166:0 "[tv_wonder_ceremony|E]：使徒への道は宣告される"
 TV_WONDER_CEREMONY_S1_DESC_166:0 "司教と王冠は共に、コンポステーラの聖ヤコブの神殿への巡礼道を宣言し、それを歩もうとするすべての魂に開かれています。この宣言の言葉は、巡礼者自身よりも早く伝わります。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、そのタイミングがまだ適切でない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_166:0 "私たちは、この使徒への道が、歩もうとするすべての魂に開かれていることを宣言します。"
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_166:0 "法廷は保留し、宣言はより縁起の良い日を待つことになる。"
