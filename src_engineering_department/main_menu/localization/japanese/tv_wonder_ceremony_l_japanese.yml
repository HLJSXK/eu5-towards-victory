 TV_WONDER_CEREMONY_S5_TITLE_173:0 "[tv_wonder_ceremony|E]：ティアがバンクを登る"
 TV_WONDER_CEREMONY_S5_DESC_173:0 "堤防には何層もの階段がそびえ立っており、夜明けに巡礼者の行列が水面に並んで降りることができるほどの幅があります。新しく完成した踊り場に沿ってランプや花輪の出店が始まります。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_173:0 "ベンダーが踊り場での場所を主張する間、石工は何層にもわたって積み重なります。"
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_173:0 "石工たちは階段の上昇を一時停止し、堤防を半分登った状態のままにします。"
