 TV_WONDER_CEREMONY_S5_DESC_221:0 "木材のトロンビームの列が乾燥壁に打ち込まれ、構造を強化するとともに、毎年行われる漆喰塗り替えのための恒久的な足場として機能します。学生たちは、最後の泥が乾く前からアーケードの下に集まります。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
