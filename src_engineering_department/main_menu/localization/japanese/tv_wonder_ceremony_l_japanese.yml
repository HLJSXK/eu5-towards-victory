 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_166:0 "#G 完了#! — #high ウェイポイントは祝福されています#!\n#F 司祭たちはガリシアの緑の丘、祝福の交差点、浅瀬、そしていつか巡礼者を先へ導く休憩所を通る未来の道を歩きます。#!"
 TV_WONDER_CEREMONY_S2_TITLE_166:0 "[tv_wonder_ceremony|E]：ウェイポイントは祝福されています"
 TV_WONDER_CEREMONY_S2_DESC_166:0 "司祭たちは、ガリシアの緑の丘を通って、いつか巡礼者を先へ導く祝福の交差点、浅瀬、休憩所を通る未来のルートを歩きます。道沿いの村々がホタテ貝の貝殻で道を示し始めます。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
