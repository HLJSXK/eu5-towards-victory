 TV_WONDER_CEREMONY_S7_TITLE_165:0 "[tv_wonder_ceremony|E]：遠方のキャンペーンから注文が届きました"
 TV_WONDER_CEREMONY_S7_DESC_165:0 "トレドから遠く離れた軍隊からの緊急徴用により、工房は通常のペースを超えて負担がかかり、鍛冶職人はノルマを達成するために夜通し働きます。見習いたちは、早くから鍛冶場でのフル勤務に追われます。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
