 TV_WONDER_CEREMONY_S4_DESC_187:0 "レンガごとに、第一マドラサのイーワーン門が広場の上にそびえ立ち、測量と祝福を経て、ついに驚異の本当の仕事が始まります。ポプラ材の足場が門の両脇にあるミナレットの塔にしがみついて、少しずつ上に向かって進んでいきます。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
