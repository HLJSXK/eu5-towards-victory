 TV_WONDER_CEREMONY_S6_DESC_143:0 "ガラス張りの大バラ窓には深い青と深紅のガラスがはめ込まれており、学者たちがすでにそれ自体が説教と呼んでいる色とりどりの光が身廊にあふれています。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
