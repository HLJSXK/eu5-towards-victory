 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_214:0 "#Y 進行中#! — #high ゴシック様式のファサードが始まります#!\n#F 石工がゴシック様式のファサードの尖ったアーチをレイアウトする中、レンガのコースが整地された広場から登っていきます。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_214:0 "#G 完成#! — #high ゴシック様式のファサードが始まります#!\n#F 石工がゴシック様式のファサードの尖ったアーチをレイアウトする中、レンガのコースが整地された広場から登っていきます。#!"
 TV_WONDER_CEREMONY_S4_TITLE_214:0 "[tv_wonder_ceremony|E]：ゴシック様式のファサードが始まります"
 TV_WONDER_CEREMONY_S4_DESC_214:0 "石工がゴシック様式のファサードの尖ったアーチをレイアウトする中、レンガのコースが整地された広場から登っていきます。計画と憲章は、足場、モルタル、そして毎日のこての音に取って代わられます。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_214:0 "石工たちはコースごとに尖ったアーチを上げます。"
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_214:0 "足場は待機し、モルタルは混合されないままになります。"
