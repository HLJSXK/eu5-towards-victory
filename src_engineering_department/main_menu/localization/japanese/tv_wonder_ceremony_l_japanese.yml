 TV_WONDER_CEREMONY_S8_TITLE_135:0 "[tv_wonder_ceremony|E]：完成したヤードから艦隊が出航"
 TV_WONDER_CEREMONY_S8_DESC_135:0 "海軍本部は造船所の完成を宣言し、全戦隊が乾ドックと倉庫を通過して観閲し、港の要塞から祝砲があり、壁に沿って群衆が見守る中、造船所の完成を宣言した。ポーツマスの造船所は現在、国王が海を保持している限り、国の海軍力の恒久的な鍛冶場として機能し、艦隊の武装と供給を行っています。\n\n#weak 式典を完了するために必要な料金を支払います。その結果、驚異の最終的な建物が建ち上がります。#!"
