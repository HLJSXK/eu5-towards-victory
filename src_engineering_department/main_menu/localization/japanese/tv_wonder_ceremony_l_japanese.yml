 TV_WONDER_CEREMONY_CARD_ICON_S3_143:0 "@tv_ceremony_holy_site!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_143:0 "#Y 進行中#! — #high 礎石は祝福されました#!\n#F 司教は、聖職者、学者、王室役人の群衆の前で最初の礎石を祝福し、完成した大聖堂が奉献される聖母を呼び起こします。#!"
