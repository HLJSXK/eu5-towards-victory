 TV_WONDER_CEREMONY_S8_TITLE_113:0 "[tv_wonder_ceremony|E]：教会は一つとして聖別される"
 TV_WONDER_CEREMONY_S8_DESC_113:0 "完成した溝やトンネルを司祭たちが手で十字架の行列を先導し、すべての教会を 1 つの神聖な複合施設として聖別し、ロハの祝福が王国全体に恵みを広げると宣言されます。\n\n#weak 儀式を完了するために必要な料金を支払います。その結果、驚異の最終的な建物が立ち上がります。#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_113:0 "司祭たちは十字架を手に持って完成したトンネルを通過し、すべての教会を 1 つの神聖な複合体として聖別します。"
