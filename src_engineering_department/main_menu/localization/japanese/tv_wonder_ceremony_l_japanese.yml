 TV_WONDER_CEREMONY_CARD_ICON_S6_131:0 "@tv_ceremony_city!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_131:0 "#Y 進行中#! — #high 街区を埋め尽くすペイントされた集合住宅#!\n#F 集合住宅が大通りの側面に沿って整然とブロック状にそびえ立ち、中庭の壁は街の象徴である赤で塗られ、羽の生えた蛇で覆われているそしてジャガー。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_131:0 "#G 完了#! — #high 街区を埋め尽くすペイントされた集合住宅#!\n#F 集合住宅が大通りの側面に沿って整然とブロック状にそびえ立ち、中庭の壁は街の特徴である赤で塗装され、羽の生えた蛇で覆われています。そしてジャガー。#!"
 TV_WONDER_CEREMONY_S6_TITLE_131:0 "[tv_wonder_ceremony|E]：ペイントされたコンパウンドが街区を埋める"
 TV_WONDER_CEREMONY_S6_DESC_131:0 "集合住宅が大通りの側面に沿って整然とブロック状に建ち並び、中庭の壁は街の象徴である赤で塗られ、羽の生えた蛇やジャガーで覆われています。工芸地区では、高地全域で取引するために黒曜石の道具や薄オレンジ色の陶器の生産が始まります。\n\n#weak 式典を次の段階に進めるために必要な代金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_131:0 "都市は一日にして成らず、塗られた壁によって築かれます。"
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_131:0 "私たちはこれらのブロックを塗装された家で埋める準備ができていません。"
 TV_WONDER_CEREMONY_CARD_ICON_S7_131:0 "@tv_ceremony_art_work!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_131:0 "#Y 進行中#! — #high 羽根のある蛇の神殿が飾られています#!\n#F S彫刻家たちは、大通りの南側に沿ってそびえる神殿の正面に、彫刻された蛇と嵐の神の頭の列を次々と設置し、その石の目にはかつて象嵌が施されていました。黒曜石と貝殻.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_131:0 "#G 完成#! — #high 羽根のある蛇の神殿が飾られています#!\n#F S彫刻家たちは、大通りの南側に沿ってそびえる神殿の正面に、彫刻された蛇と嵐の神の頭の列を次々と設置し、その石の目にはかつて象嵌が施されていました。黒曜石と貝殻.#!"
 TV_WONDER_CEREMONY_S7_TITLE_131:0 "[tv_wonder_ceremony|E]：羽の生えた蛇の神殿が飾られている"
 TV_WONDER_CEREMONY_S7_DESC_131:0 "彫刻家たちは、大通りの南側に沿ってそびえ立つ寺院のファサードに蛇と嵐の神の頭の彫刻を何列も並べ、その石の目にはかつて黒曜石と貝殻がはめ込まれていました。寺院の完成を前に、すでに完成した大通りを行列が歩いています。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_131:0 "彫刻家たちは寺院のそびえ立つ面に蛇神の頭をはめ込みました。"
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_131:0 "神々はその季節の前に彫刻を急ぐことはありません。"
 TV_WONDER_CEREMONY_CARD_ICON_S8_131:0 "@tv_ceremony_religious_influence!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_131:0 "#Y 進行中#! — #high 聖なる山の頂上に火が灯る#!\n#F 司祭たちは太陽のピラミッドの頂上に登り、完成した大通り全体の上に新たな火を燃やし、煙が立ち上り、神聖な山を見守る峰々に応えます。 valley.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_131:0 "#G 完了#! — #high 聖なる山の頂上に火が灯る#!\n#F 司祭たちは太陽のピラミッドの頂上に登り、完成した大通り全体の上に新たな火を燃やし、煙が立ち上り、神聖な山を見守る峰々に応えます。 valley.#!"
 TV_WONDER_CEREMONY_S8_TITLE_131:0 "[tv_wonder_ceremony|E]：聖なる山の頂上に火が灯る"
 TV_WONDER_CEREMONY_S8_DESC_131:0 "司祭たちは太陽のピラミッドの頂上に登り、完成した大通り全体の上に新しい火を焚き、谷を見守る峰々に煙が立ち上ります。テオティワカンは現在、神聖な都市として完成しており、その影響力と儀式は何世代にもわたって高原全体に広がります。\n\n#weak 儀式を完了するために必要な料金を支払います。その結果、驚異の最終的な建物が建ち上がります。#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_131:0 "私たちは頂上に登り、その上に新しい火を燃やします。"
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_131:0 "司祭たちは頂上の下に留まり、新しい火はまだ点火されていません。"
 TV_WONDER_CEREMONY_CARD_ICON_S1_132:0 "@tv_ceremony_food_productivity!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_132:0 "#Y 進行中#! — #high 国王、大バライを布告#!\n#F クメール王は、アンコールの田んぼが再び干ばつや干ばつを恐れなくて済むように、雨季を抑えて乾物を養うのに十分な広さの貯水池を命じた。洪水.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_132:0 "#G 完了#! — #high 国王、大バライを布告#!\n#F クメール王は、アンコールの田んぼが再び干ばつや干ばつを恐れなくて済むように、雨季を抑えて乾燥地帯に栄養を与えるのに十分な広さの貯水池を注文しました。洪水.#!"
 TV_WONDER_CEREMONY_S1_TITLE_132:0 "[tv_wonder_ceremony|E]：国王、グレートバライを布告"
 TV_WONDER_CEREMONY_S1_DESC_132:0 "クメール王は、アンコールの水田が再び干ばつや洪水の心配をしなくて済むように、雨季を食い止めて乾季に栄養を与えるのに十分な広さの貯水池の建設を命じた。王室の測量士たちは、いつか小さな内海を囲むことになる堤防の追跡に着手しました。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_132:0 "我々はそれを宣言する：偉大なバライは追跡され、引き上げられるであろう。"
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_132:0 "単一の賭け金が設定される前に、王室の測量官が呼び戻されます。"
 TV_WONDER_CEREMONY_CARD_ICON_S2_132:0 "@tv_ceremony_laborers!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_132:0 "#Y 進行中#! — #high 堤防に村々が招集される#!\n#F バライの壁のための土を運び始めるために王国中の村々から徴兵労働者が集められ、一方、司祭たちは貯水池に神社が立つ要点をマークするコーナー.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_132:0 "#G 完了#! — #high 村々が堤防に召集される#!\n#F バライの壁のための土を運び始めるために王国中の村々から徴兵労働者が集められる一方、司祭たちは貯水池に神社が立つ要点をマークするコーナー.#!"
 TV_WONDER_CEREMONY_S2_TITLE_132:0 "[tv_wonder_ceremony|E]：村は堤防に呼び出される"
 TV_WONDER_CEREMONY_S2_DESC_132:0 "王国中の村々からコルヴィーの労働力が集められ、バライの壁のための土を運び始める一方、司祭たちは貯水池の角に神社が立つ要点に印を付ける。米の貯蔵庫は、乾期の掘削の間、労働者に食料を供給するために確保されています。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_132:0 "コルヴィーのギャングがバライの壁を築くために村々から流れてきます。"
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_132:0 "村々にはもう少しだけ時間を割いてもらいたい。堤防は待ってくれる。"
 TV_WONDER_CEREMONY_CARD_ICON_S3_132:0 "@tv_ceremony_river!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_132:0 "#Y 進行中#! — #high 運河は田畑までたどられます#!\n#F 技術者たちは、いつかバライ川の水を市の向こうの水田まで運ぶことになる給水用水路のネットワークに印を付け、バラモン教の司祭たちはその中心軸を祝福します。貯水池は天を映します。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_132:0 "#G 完了#! — #high 運河は田畑までたどられます#!\n#F 技術者たちは、いつかバライの水を市の向こうの水田まで運ぶことになる給水用水路のネットワークに印を付け、バラモン教の司祭たちはその中心軸を祝福します。貯水池は天を映します。#!"
 TV_WONDER_CEREMONY_S3_TITLE_132:0 "[tv_wonder_ceremony|E]：運河は畑まで続く"
 TV_WONDER_CEREMONY_S3_DESC_132:0 "技術者たちは、いつかバライ川の水を市の向こうの水田まで運ぶ給水用水路の網に印を付け、バラモンの司祭たちは貯水池が天を映す中心軸を祝福する。最初の水門の設計は小さな粘土モデルでテストされます。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングではない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_132:0 "エンジニアは運河のラインに杭を打ち、小さな粘土モデルで水門の設計をテストします。"
