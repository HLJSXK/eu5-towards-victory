 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_143:0 "#G 完了#! — #high バラ窓はガラスにはめ込まれています#!\n#F ガラス職人は、深い青と深紅のガラスの窓ガラスを大きなバラ窓に取り付け、学者たちがすでにそれ自体を説教と呼んでいる色とりどりの光で身廊を満たしています。#!"
