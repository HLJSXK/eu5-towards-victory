 TV_WONDER_CEREMONY_S1_DESC_185:0 "キエフの府主教は、ドニエプル川を見下ろす丘の中腹に初めて独房を掘った隠者アントニウスの記憶を讃え、修道院の洞窟と敷地をあらゆる公国からの巡礼者にふさわしい大修道院として再建すると宣言した。ロシア全土の修道士たちは、聖なる父の洞窟にまもなく新しい建設の光が当たるだろうと知らせを送ります。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。あるいは、まだその時が適切でない場合は待ちます。#!"
