 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_131:0 "#G 完了#! — #high 石が太陽に向かって登り始める#!\n#F 労働者たちはついに太陽のピラミッドの最初の真の層を埋葬物の上に上げ、日干しレンガと瓦礫の核が詰め込まれ、高地の下で切石で表面が覆われている。ライト.#!"
 TV_WONDER_CEREMONY_S4_TITLE_131:0 "[tv_wonder_ceremony|E]：太陽に向かって石が登り始める"
 TV_WONDER_CEREMONY_S4_DESC_131:0 "労働者たちはついに、高原の光の下で、日干しレンガと瓦礫の核が詰め込まれ、切石で表面を整えられた太陽のピラミッドの最初の真の層を、埋葬された供物の上に引き上げる。地面としてマークされていた場所が、今では手で建てられた山としてそびえ立っています。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
