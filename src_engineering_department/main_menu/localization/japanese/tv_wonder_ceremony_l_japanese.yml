 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_154:0 "#G 完了#! — #high 斜塔が最初の鐘を鳴らします#!\n#F オペラ座がほぼ 2 世紀にわたる工事、傾きもすべて完了したことを宣言し、完成した鐘楼から初めて鐘が鳴り響きます。#!"
 TV_WONDER_CEREMONY_S8_TITLE_154:0 "[tv_wonder_ceremony|E]：斜塔が最初の鐘を鳴らす"
 TV_WONDER_CEREMONY_S8_DESC_154:0 "完成した鐘楼から初めて鐘が鳴り響き、オペラ座は約 2 世紀にわたる工事がすべて完了したことを宣言します。この日以来、ピサの塔は学者と驚異の探求者を同様に引き寄せ、そのありえない姿勢がこの街の芸術と学問に新たな名声をもたらしています。\n\n#weak 式典を完了するために必要な料金を支払います。その結果、驚異の最終的な建物が上昇します。#!"
