 TV_WONDER_CEREMONY_S1_DESC_123:0 "カホキアの酋長と司祭長老たちは大広場に集まり、中央の塚をさらに高く上げ、その頂上にアメリカ海底に対する都市の台頭する力にふさわしい神殿を置くことを宣言する。ランナーは、次の季節に向けて労働力を集めるために辺境の農場に送られます。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
