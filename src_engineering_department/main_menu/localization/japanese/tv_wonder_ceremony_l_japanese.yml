 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_214:0 "#G 完了#! — #high 議会の議場に枠ができました#!\n#F 大工たちは、すべての加盟都市からの代表者がベンチに沿って座れるほどの広さの議会議場の木材枠を上げています。#!"
 TV_WONDER_CEREMONY_S5_TITLE_214:0 "[tv_wonder_ceremony|E]：評議会の議場は枠に囲まれています"
 TV_WONDER_CEREMONY_S5_DESC_214:0 "大工たちは、すべての加盟都市からの代表者がベンチに沿って座ることができる十分な幅の議会室の木材フレームを持ち上げます。石工は、通行料と関税をめぐる紛争がいつか解決されるであろう商人のベンチを彫っています。\n\n#weak 儀式を次の段階に進めるために必要な代金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_214:0 "各リーグの町の代表者が座れるよう、フレームの幅を十分に広くとりました。"
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_214:0 "大工たちは道具を置き、枠は半分持ち上がった状態で立っています。"
 TV_WONDER_CEREMONY_CARD_ICON_S6_214:0 "@tv_ceremony_art_work!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_214:0 "#Y 進行中#! — #high 小塔と釉薬タイル#!\n#F S細いレンガの小塔が屋根線の上にそびえ立ち、その上に釉薬タイルがかぶせられ、マーケット広場の光を捉えています。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_214:0 "#G 完成#! — #high T塔と艶出しタイル#!\n#F S細いレンガ造りの塔が屋根線の上にそびえ立ち、その上には市場広場の光を捉える艶出しタイルが取り付けられています。#!"
 TV_WONDER_CEREMONY_S6_TITLE_214:0 "[tv_wonder_ceremony|E]：タレットと施釉タイル"
 TV_WONDER_CEREMONY_S6_DESC_214:0 "細いレンガ造りの塔が屋根の上にそびえ立ち、その上にガラス張りのタイルが置かれており、マーケット広場の光を捉えています。通行人は、バルト海で最も素晴らしい屋根と称されるタイル張り職人の作業を立ち止まって眺めています。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_214:0 "タイルセッターは、バルト海の光を捉えるガラス張りのタイルを小塔に飾ります。"
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_214:0 "砲塔はもう少し裸のままにしておきます。"
