 TV_WONDER_CEREMONY_S5_DESC_120:0 "新しい石造りのアーチの下には大理石の柱の列がそびえ立っており、それぞれの柱頭は遠くアナトリアやペルシャから連れてこられた巨匠によって彫られているため、中庭に沿った 2 つのアーケードが同じ装飾を繰り返すことはありません。巡礼者の流れが増える一方で、聖域の影は深まります。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
