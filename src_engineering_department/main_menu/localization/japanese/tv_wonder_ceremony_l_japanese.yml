 TV_WONDER_CEREMONY_S8_DESC_205:0 "火の神殿はアブシェロン半島に完成し、その炎は一度も人間の手で点火される必要がありませんでした。そしてこの日から、王国の威信は、そこに集まる巡礼者のために少しだけ明るく燃え上がります。\n\n#weak 儀式を完了するために必要な料金を支払います。その結果、驚異の最後の建物が立ち上がります。#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_205:0 "私たちはアテシュガーを聖別し、その不滅の炎が今、私たちの王国の栄光を伝えています。"
