 TV_WONDER_CEREMONY_S2_DESC_113:0 "司祭たちは王のビジョンが要求する場所を求めて赤い火山凝灰岩の高地露頭を歩きます。天使が夜に降りてきて、最初の教会が立つべき場所を示すと言われています。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、その瞬間がまだ適切でない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_113:0 "司祭たちは赤い凝灰岩の高地に扇状に広がり、夜に天使たちがつけた道をたどります。"
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_113:0 "天使の印が本当に見られたのかどうかはまだわかりません。司祭たちにもう少し探してもらいましょう。"
 TV_WONDER_CEREMONY_CARD_ICON_S3_113:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_113:0 "#Y 進行中#! — #high T生きた石の周りに溝が掘られています#!\n#F 木材や大理石を集める代わりに、労働者は選んだ岩のブロックの周りに深い溝を切り、教会の材料となるまさにその山を隔離します。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_113:0 "#G 完了#! — #high T生きた石の周りに溝が掘られます#!\n#F 木材や大理石を集める代わりに、労働者は選ばれた岩のブロックの周りに深い溝を切り、教会の材料となるまさにその山を隔離します。#!"
 TV_WONDER_CEREMONY_S3_TITLE_113:0 "[tv_wonder_ceremony|E]：生きている石の周りに溝が掘られています"
 TV_WONDER_CEREMONY_S3_DESC_113:0 "木材や大理石を集める代わりに、労働者は選択した岩のブロックの周囲に深い溝を切り、教会の材料となるまさにその山を隔離します。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_113:0 "労働者は高地の土壌につるはしを打ち込み、山の中心部を解放する溝を切ります。"
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_113:0 "山ですら、一季節に削られたものではない。"
 TV_WONDER_CEREMONY_CARD_ICON_S4_113:0 "@tv_ceremony_art_work!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_113:0 "#Y 進行中#! — #high 彫刻は上から始まります#!\n#F ノミが孤立した石に上から下に食い込み、初めて教会の屋根の輪郭が周囲の地面と同じ高さで彫られているように見えます。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_113:0 "#G 完了#! — #high 彫刻は上から始まります#!\n#F ノミが孤立した石に上から下に食い込み、初めて教会の屋根の輪郭が周囲の地面と同じ高さで彫られているように見えます。#!"
 TV_WONDER_CEREMONY_S4_TITLE_113:0 "[tv_wonder_ceremony|E]：彫刻は上から始まります"
 TV_WONDER_CEREMONY_S4_DESC_113:0 "ノミが孤立した石に上から下に食い込み、初めて教会の屋根の輪郭が周囲の地面と同じ高さで彫られているように見えます。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_113:0 "屋根のラインが空の前に現れるように、私たちはノミを石の上に下ろします。"
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_113:0 "石工たちがノミを置くと、屋根のラインが手つかずの石の下に待ち構えています。"
 TV_WONDER_CEREMONY_CARD_ICON_S5_113:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_113:0 "#Y 進行中#! — #high 教会が溝から現れます#!\n#F 労働者はブロックを外側から彫るのと同じくらい内側からもくりぬき、ゆっくりと十字型の教会が、凹んだ中庭に自由に立って現れます。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_113:0 "#G 完成#! — #high 教会が塹壕から現れる#!\n#F 労働者はブロックを外から彫るのと同じくらい内側からくりぬき、ゆっくりと十字型の教会が自らの窪んだ中庭に自由に立って現れます。#!"
