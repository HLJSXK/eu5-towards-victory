 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_131:0 "#G 完了#! — #high 供物は地面の下に埋められます#!\n#F 司祭たちは、緑色の石、黒曜石の刃、犠牲となった生き物の骨の宝庫をマークされた基礎の下に埋め、石が一筋になる前に地球を聖別します。 #!"
 TV_WONDER_CEREMONY_S3_TITLE_131:0 "[tv_wonder_ceremony|E]：供物は地中に埋まっている"
 TV_WONDER_CEREMONY_S3_DESC_131:0 "司祭たちは、緑色の石、黒曜石の刃、そして犠牲となった生き物の骨の隠し場所を、マークを付けた基礎の下に埋め、石が一列置かれる前に地球を聖別します。リネージュは市の宿舎から労働者ギャングに誓約して作業に向かいます。\n\n#weak 式典を次の段階に進めるために必要な代金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
