 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_223:0 "#Y 進行中#! — #high 宮殿の道路に印を付ける#!\n#F 測量士は宮殿から放射状に伸びる大きな道路に印を付け、森林の端と赤土を同様に土塁がたどる必要がある線をたどります。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_223:0 "#G 完了#! — #high 宮殿の道路に印を付ける#!\n#F 測量士は宮殿から放射状に伸びる大きな道路に印を付け、森林の端と赤土を同様に土塁がたどる必要がある線をたどります。#!"
 TV_WONDER_CEREMONY_S2_TITLE_223:0 "[tv_wonder_ceremony|E]：宮殿道路の標識"
 TV_WONDER_CEREMONY_S2_DESC_223:0 "測量士は宮殿から放射状に伸びる大きな道路に印を付け、森林の端と赤土の間を同様に土塁がたどる必要がある線をたどります。郊外の区の首長は、世帯からの労働を誓約するために呼び出されます。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_223:0 "測定される道路は維持される道路です。"
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_223:0 "測量士たちの賭けはもう一シーズン休ませることにする。"
 TV_WONDER_CEREMONY_CARD_ICON_S3_223:0 "@tv_ceremony_laborers!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_223:0 "#Y 進行中#! — #high 各区から労働力を集める#!\n#F 首都の各区の世帯は、誰がどの季節の仕事を負うのか宮殿の慎重な計算の下に組織され、籠と鍬を持った労働者を派遣します。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_223:0 "#G 完了#! — #high 各区から労働力を集める#!\n#F 首都の各区の各世帯が、誰がどの季節の仕事を負うのか宮殿の慎重な計算の下に組織され、籠と鍬を持った労働者を派遣します。#!"
 TV_WONDER_CEREMONY_S3_TITLE_223:0 "[tv_wonder_ceremony|E]：各病棟から労働力を集める"
 TV_WONDER_CEREMONY_S3_DESC_223:0 "首都の各区の世帯は、誰がどの季節の仕事を負うかを宮殿が慎重に計算した上で、籠と鍬を持った労働者を派遣する。掘削が開始される前にルートが妨げられないように、マークされたラインに沿って警備員が配置されます。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_223:0 "どの区も労働者、籠、鍬を手に送り込んでいる。"
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_223:0 "遅れた労働はまだ労働の義務がある。"
 TV_WONDER_CEREMONY_CARD_ICON_S4_223:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_223:0 "#Y 進行中#! — #high 城壁が本当に始まります#!\n#F 採掘者が赤い大地を本格的に壊し、かつて測量士の跡が残されていた場所に城壁の最初の本当の尾根が立ち上がります。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_223:0 "#G 完了#! — #high 城壁が本当に始まります#!\n#F 採掘者が赤い大地を本格的に壊し、かつて測量士の跡が残されていた場所に城壁の最初の本当の尾根が立ち上がります。#!"
 TV_WONDER_CEREMONY_S4_TITLE_223:0 "[tv_wonder_ceremony|E]：城壁がいよいよ始まる"
 TV_WONDER_CEREMONY_S4_DESC_223:0 "採掘労働者が赤い大地を本格的に切り開き、かつては測量士の痕跡が残されていた場所に、城壁の最初の本当の尾根が立ち上がる。布告と労働者名簿だったものが、今や林床から着実に登る壁となります。\n\n#weak 儀式を次の段階に進めるために必要な代金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_223:0 "最初の尾根が隆起するのを見て、作業が本格的に始まったと宣言します。"
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_223:0 "採掘労働者たちは立ち止まり、赤い大地は静かに待ちます。"
