 TV_WONDER_CEREMONY_S6_DESC_107:0 "石工たちは、単一の花崗岩の露頭から、太陽のつなぎ目であるインティワタナを彫り出します。その角度は、今後の収穫ごとに夏至を示すように設定されています。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、その瞬間がまだ適切でない場合は待ちます。#!"
