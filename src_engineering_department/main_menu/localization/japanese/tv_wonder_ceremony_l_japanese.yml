 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_185:0 "#G 完了#! — #high 信者に開かれた巡礼者ホール#!\n#F 新しい食堂とゲストホールが建ち、不朽の遺物を崇拝するためにあらゆる公国から降りてくる巡礼者の波を収容する。洞窟.#!"
 TV_WONDER_CEREMONY_S7_TITLE_185:0 "[tv_wonder_ceremony|E]：信者に開かれた巡礼堂"
 TV_WONDER_CEREMONY_S7_DESC_185:0 "洞窟の不朽の遺跡を崇拝するために各公国から降りてくる巡礼者の波を収容するために、新しい食堂やゲストホールが建ち並びます。商人が門の外に屋台を出し、キャンドル、聖像、帰りのパンなどを販売します。\n\n#weak 式典を次の段階に進めるために必要な代金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_185:0 "私たちは丘を登るすべての巡礼者にホールを開放します。"
