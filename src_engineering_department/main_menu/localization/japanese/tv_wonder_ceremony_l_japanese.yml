 TV_WONDER_CEREMONY_S4_DESC_107:0 "石工は、モルタルを使わずに最初の乾いた石の擁壁を斜面に取り付けます。各ブロックは隣り合うブロックに固定されるように形作られ、テラスが山腹に登り始めます。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
