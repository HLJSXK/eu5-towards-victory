 TV_WONDER_CEREMONY_S8_TITLE_155:0 "[tv_wonder_ceremony|E]：ドゥオーモが扉を開く"
 TV_WONDER_CEREMONY_S8_DESC_155:0 "公爵、大司教、そして石工や大理石のブロックを貸し出したすべてのギルドの前で大聖堂が奉献されると、ミラノ中に鐘が鳴り響き、尖塔の森がロンバルディアの誇りを宣言しました。この日以来、ドゥオーモの寛容で街を見守る存在がその影の中であらゆる種類の信仰を安定させ、その栄光が公爵法廷に新たな輝きを与えています。\n\n#weak 式典を完了するために必要な料金を支払います。その結果、この驚異の最後の建物が立ち上がります。#!"
