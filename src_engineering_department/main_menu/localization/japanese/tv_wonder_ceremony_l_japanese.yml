 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_134:0 "#G 完了#! — #high 最初の擁壁が設置されます#!\n#F 山腹が真の段丘になって上向きに進み始めると、労働者は最終的に最初に取り付けられた石を一番下の斜面に沿って所定の位置に持ち上げ、各コースの背後で砂利と土を詰めます。#!"
 TV_WONDER_CEREMONY_S4_TITLE_134:0 "[tv_wonder_ceremony|E]：最初の擁壁が設置されました"
 TV_WONDER_CEREMONY_S4_DESC_134:0 "山腹が真の段丘になって上向きに進み始めると、労働者は最終的に最初に取り付けられた石を一番下の斜面に沿って所定の位置に持ち上げ、各コースの背後で砂利と土を詰めます。杭打ちされたラインは、今や地球を阻む石となります。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_134:0 "私は労働者を斜面に解放します。最初の石を持ち上げて保持しましょう。"
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_134:0 "労働者たちは下で待機しており、杭打ちされたラインはもう少しの間空のままになっています。"
 TV_WONDER_CEREMONY_CARD_ICON_S5_134:0 "@tv_ceremony_food!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_134:0 "#Y 進行中#! — #high テラスは城塞に向かって登っていきます#!\n#F Cテラスの壁が続いた後、上にある王室の建物に向かって坂を上っていき、作業員がラマの列車には狭すぎる道に沿って石と土を手渡ししながら進みます。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_134:0 "#G 完了#! — #high テラスは城塞に向かって登っていきます#!\n#F Cテラスの壁が続いた後、上にある王室の建物に向かって坂を上っていき、作業員がラマの列車には狭すぎる道に沿って石と土を手渡ししながら進みます。#!"
 TV_WONDER_CEREMONY_S5_TITLE_134:0 "[tv_wonder_ceremony|E]：テラスは城塞に向かって登っていきます"
 TV_WONDER_CEREMONY_S5_DESC_134:0 "テラスの壁のコースが次々と上にある王室の建物に向かって斜面を登っていき、労働者がラマの列車には狭すぎる道に沿って石と土を手と手で渡していく。最上段からバケツに水を注いで排水路をテストします。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_134:0 "手から手へ渡された石は、どんな腕でも投げることができるよりも高く登ります。"
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_134:0 "より高い層に登る前に、私は労働者を下の層でしばらく拘束します。"
 TV_WONDER_CEREMONY_CARD_ICON_S6_134:0 "@tv_ceremony_river!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_134:0 "#Y 進行中#! — #high 運河が斜面を下って水を運びます#!\n#F 完成したテラスに沿って石で裏打ちされた水路が掘削され、山の高いところから湧き水を運び、下のテラスに水が浸水することなく各レベルに順番に水を供給します。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_134:0 "#G 完成#! — #high 運河が斜面を下って水を運びます#!\n#F 完成したテラスに沿って石で囲まれた水路が掘削され、山の高いところから湧き水を運び、下のテラスを浸水させることなく各レベルに順番に水を供給します。#!"
 TV_WONDER_CEREMONY_S6_TITLE_134:0 "[tv_wonder_ceremony|E]：運河は斜面を下って水を運びます"
 TV_WONDER_CEREMONY_S6_DESC_134:0 "完成したテラスに沿って石で裏打ちされた水路が掘られ、山の高いところから湧き水を下に運び、1 つのテラスが下のテラスに浸水することなく、各レベルに順番に水を供給します。農家は、完成に近づく棚田用の種トウモロコシとジャガイモの準備を始めます。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_134:0 "石切り職人が水路を切り開くと、湧き水が慎重に層から層へと下降し始めます。"
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_134:0 "下り坂に勢いよく流れ落ちる水は、養うべき田畑を氾濫させます。"
 TV_WONDER_CEREMONY_CARD_ICON_S7_134:0 "@tv_ceremony_holy_site!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_134:0 "#Y 進行中#! — #high 空に近い最も高いテラス#!\n#F 城塞の寺院に最も近い最上部のテラスは、石工が管理できる最高級の石造物で最後に仕上げられ、太陽に直接提供される作物のために確保されています。神.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_134:0 "#G 完成#! — #high 空に近い最も高いテラス#!\n#F 城塞の寺院に最も近い最上部のテラスは、石工が管理できる最高級の石造物で最後に仕上げられ、太陽に直接提供される作物のために確保されています。神.#!"
 TV_WONDER_CEREMONY_S7_TITLE_134:0 "[tv_wonder_ceremony|E]：空に近い最高のテラス"
 TV_WONDER_CEREMONY_S7_DESC_134:0 "城塞の寺院に最も近い最上部のテラスは、石工が管理できる最高級の石造物で最後に仕上げられ、太陽神に直接捧げられる作物のために確保されています。植樹の儀式が始まる前に、司祭がすべての排水路を最後に検査します。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_134:0 "私は石工たちに私の最高級の石と太陽に最も近いテラスの冠を飾る祝福を与えます。"
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_134:0 "石工たちが道具を置くと、寺院の下に最も高いテラスが未完成のまま待っています。"
