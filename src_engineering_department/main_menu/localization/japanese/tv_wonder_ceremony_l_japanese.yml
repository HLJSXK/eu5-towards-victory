 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_168:0 "#G 完了#! — #high 公爵は兵器庫の設置を布告#!\n#F ミラノ公は、大砲と鉄鋼を外国の鋳物工場に依存することにうんざりし、公国の軍隊を武装させるための新しい兵器庫の設置を宣言しました。#!"
 TV_WONDER_CEREMONY_S1_TITLE_168:0 "[tv_wonder_ceremony|E]：公爵は兵器庫を布告する"
 TV_WONDER_CEREMONY_S1_DESC_168:0 "ミラノ公は、大砲と鉄鋼を外国の鋳物工場に依存することにうんざりし、公国の軍隊を武装させるための新たな兵器庫の設置を宣言した。最初の石が切り取られる前に、選択した地面に公爵の旗が掲げられます。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングではない場合は待ちます。#!"
