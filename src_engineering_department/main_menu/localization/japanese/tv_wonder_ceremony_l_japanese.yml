 TV_WONDER_CEREMONY_S1_DESC_151:0 "国王は、リスボンへの進入を守り、発見から戻ってくるすべての艦隊を迎えるために、ベレンのテージョ礁に要塞塔を建てるよう命じた。王室の石工が他の作品から引き出され、すぐにデザインを開始します。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
