 TV_WONDER_CEREMONY_S4_TITLE_120:0 "[tv_wonder_ceremony|E]：新たなアーケードが根付く"
 TV_WONDER_CEREMONY_S4_DESC_120:0 "拡張されたアーケードの最初の基礎が神聖な地に築かれ、石を削るノミの音が計画審議会のざわめきに取って代わります。調査と祈りだったものが、今や神の家の周囲で徐々に高まっています。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
