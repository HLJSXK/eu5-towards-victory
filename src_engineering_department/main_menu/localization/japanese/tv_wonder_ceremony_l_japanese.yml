 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_174:0 "#G 完了#! — #high クンジャラマランが建築家に任命#!\n#F 王室建築家クンジャラマラン・ラジャラジャ・ペルンタチャンが工事のマスターに任命され、花崗岩が川沿いの採石場からいかだで到着し始めるKaveri.#!"
