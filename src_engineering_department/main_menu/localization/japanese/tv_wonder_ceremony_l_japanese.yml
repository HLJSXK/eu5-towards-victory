 TV_WONDER_CEREMONY_S2_TITLE_131:0 "[tv_wonder_ceremony|E]：死者の道を辿る"
 TV_WONDER_CEREMONY_S2_DESC_131:0 "測量士たちは、暦が神聖と呼ぶ日の日の出に合わせて谷底を横切る長い直線を引き、その長さの両側に大きな台座が位置する位置に印を付けます。ピラミッドに面する火山石から採石が始まります。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
