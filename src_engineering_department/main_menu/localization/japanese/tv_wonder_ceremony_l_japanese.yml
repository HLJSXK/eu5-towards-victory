 TV_WONDER_CEREMONY_S5_TITLE_157:0 "[tv_wonder_ceremony|E]：祈りの殿堂が巡回"
 TV_WONDER_CEREMONY_S5_DESC_157:0 "大工たちは豊穣の祈りのホールの円形の木枠を持ち上げます。その三層の屋根は、鉄の釘を 1 本も使わずに設計されており、組み合わされた木製のブラケットの複雑な格子によって支えられています。帝国の検査官は毎週足場に登って建具の精度をチェックします。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_157:0 "釘が一本もない！"
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_157:0 "検査官は建具の精度をテストするためにさらに1週間を要求します。"
 TV_WONDER_CEREMONY_CARD_ICON_S6_157:0 "@tv_ceremony_advance!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_157:0 "#Y 進行中#! — #high 28 本の柱がそびえ立っています#!\n#F ホールの内側の柱は規定の数だけ隆起しており、季節に応じて 4 本、月に合わせて 12 本、昼と夜の時間に合わせてさらに 12 本の大きな柱があり、すべてが立ち上がりの下で結ばれています。青いタイル張りのドーム。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_157:0 "#G 完成#! — #high 二十八本の柱がそびえ立っています#!\n#F ホールの内側の柱は規定の数だけ隆起しており、季節に合わせて 4 本、月に合わせて 12 本、そして昼と夜の時間に合わせてさらに 12 本の大きな柱があり、すべてその柱の下で結ばれています。青いタイル張りのドーム。#!"
 TV_WONDER_CEREMONY_S6_TITLE_157:0 "[tv_wonder_ceremony|E]：二十八柱が昇る"
 TV_WONDER_CEREMONY_S6_DESC_157:0 "ホールの内側の柱は規定の数だけ立てられ、季節を表す 4 本、月を表す 12 本、昼と夜の時間を表す 12 本の大きな柱がすべて、そびえ立つ青いタイル張りのドームの下で結ばれています。画家はビームごとにドラゴンとフェニックスのモチーフを描き始めます。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_157:0 "28 本の柱が神聖な数でそびえ立ち、画家たちが上の梁に筆を置きます。"
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_157:0 "待ってください、ドラゴンはまだ描かれていません。"
 TV_WONDER_CEREMONY_CARD_ICON_S7_157:0 "@tv_ceremony_paved_road!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_157:0 "#Y 進行中#! — #high 儀式用の道が舗装されました#!\n#F 祭壇、広間、宮殿の門を結ぶ高く上げられた石の通路は最後のスラブで舗装され、その全長に沿ったヒノキの木立は皇帝の影を覆うのに十分な高さに成長しています行列.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_157:0 "#G 完了#! — #high 儀式の道は舗装されています#!\n#F 祭壇、広間、宮殿の門を結ぶ高く上げられた石の通路は最後のスラブで舗装され、その全長に沿ったヒノキの木立は皇帝の木陰を覆うほど高く成長しています行列.#!"
 TV_WONDER_CEREMONY_S7_TITLE_157:0 "[tv_wonder_ceremony|E]：儀式の道が舗装されました"
 TV_WONDER_CEREMONY_S7_DESC_157:0 "祭壇、広間、宮殿の門を結ぶ高く上げられた石の通路は、最後のスラブで舗装されており、その全長に沿ってヒノキの木立が高く成長し、皇帝の行列の日陰を作ることができます。関係者は、ほぼ完成したドームの見える範囲で犠牲の全手順をリハーサルします。\n\n#weak 式典を次の段階に進めるために必要な代金を支払います。または、その瞬間がまだ適切でない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_157:0 "私たちは行列が歩む道の最後の石を置きます。"
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_157:0 "関係者は、最後の石がセットされる前にもう一度リハーサルを要求します。"
 TV_WONDER_CEREMONY_CARD_ICON_S8_157:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_157:0 "#Y 進行中#! — #high 天国は皇帝の犠牲を受け取ります#!\n#F 冬至に皇帝は完成した祈りの間の下で最初の犠牲を捧げるために完成した円形の祭壇に登り、法廷は神殿が永遠に天国と神の出会いの場であると宣言します。玉座.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_157:0 "#G 完了#! — #high 天国は皇帝の犠牲を受け取ります#!\n#F 冬至に皇帝は完成した祈りの間の下で最初の犠牲を捧げるために完成した円形の祭壇に登り、法廷は神殿が永遠に天国と神の出会いの場であると宣言します。玉座.#!"
 TV_WONDER_CEREMONY_S8_TITLE_157:0 "[tv_wonder_ceremony|E]：天は皇帝の犠牲を受け取る"
 TV_WONDER_CEREMONY_S8_DESC_157:0 "皇帝は冬至に完成した円形の祭壇に登り、完成した祈りの間の下で最初の犠牲を捧げ、宮廷は神殿が永遠に天国と玉座が交わる場所であると宣言した。この日から、ここで行われる儀式は国民の前で王朝の使命を確認するものであり、天の恵みが王国の隅々にそっと降り注ぐと言われています。\n\n#weak 儀式を完了するために必要な代金を支払います。その結果、驚異の最終的な建物が建ち上がります。#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_157:0 "ついに天が生贄を受け取る！"
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_157:0 "私たちはまだ天の前に立つ準備ができていません。"
 TV_WONDER_CEREMONY_CARD_ICON_S1_158:0 "@tv_ceremony_government!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_158:0 "#Y 進行中#! — #high 閩江を鎮める布告#!\n#F 総督は成都の終わりのない洪水と干ばつは終わると宣言しました。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_158:0 "#G 完了#! — #high 閩江を平定する勅令#!\n#F 総督は、成都の終わりのない洪水と干ばつは終わると宣言しました。#!"
 TV_WONDER_CEREMONY_S1_TITLE_158:0 "[tv_wonder_ceremony|E]：閩江を平定する勅令"
 TV_WONDER_CEREMONY_S1_DESC_158:0 "知事は、成都で絶え間なく続く洪水と干ばつは終わると宣言した。測量士は水がどこに分割され、どこに導かれているかを調査するために上流に送られます。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_158:0 "王国を手なずけるように、川を手なずけましょう。"
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_158:0 "この勅令まで、私はもう少しの間、印を押し続けるつもりです。"
 TV_WONDER_CEREMONY_CARD_ICON_S2_158:0 "@tv_ceremony_mapmode!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_158:0 "#Y 進行中#! — #high 川底の測量が行われています#!\n#F エンジニアたちは関口近くの浅瀬を歩き、山の周りで川が分かれる場所をマークしています。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_158:0 "#G 完了#! — #high 川底の測量が行われています#!\n#F エンジニアたちは関口近くの浅瀬を歩き、山の周りで川が分かれる場所をマークしています。#!"
 TV_WONDER_CEREMONY_S2_TITLE_158:0 "[tv_wonder_ceremony|E]：河床調査中"
 TV_WONDER_CEREMONY_S2_DESC_158:0 "Engineers wade the shallows near Guankou, marking where the river splits around the mountains.年老いた村人たちは祖父の洪水を思い出し、最悪の状況を指摘します。\n\n#weak 式典を次の段階に進めるために必要な代金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_158:0 "The engineers wade the shallows to mark the river's hidden seams."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_158:0 "もう少し待ってみましょう！"
 TV_WONDER_CEREMONY_CARD_ICON_S3_158:0 "@tv_ceremony_laborers!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_158:0 "#Y 進行中#! — #high 竹籠と柳の杭#!\n#F 閩江沿いの村々では、巨大な竹籠を編んで、荷車に積んで柳の杭を切っています。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_158:0 "#G 完了#! — #high 竹籠と柳の杭#!\n#F 閩江沿いの村々では、巨大な竹籠を編んで、荷車に積んで柳の杭を切ります。#!"
 TV_WONDER_CEREMONY_S3_TITLE_158:0 "[tv_wonder_ceremony|E]：竹籠と柳の杭"
 TV_WONDER_CEREMONY_S3_DESC_158:0 "Villages along the Min River weave giant bamboo cages and cut willow stakes by the cartload.近隣の郡から労働力が徴収され、李冰の手法は職人の信条のように暗誦されています。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。あるいは、まだ適切な時期ではない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_158:0 "We summon every hand along the river to weave and haul."
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_158:0 "郡は今のところ労働者を差し止めている。"
 TV_WONDER_CEREMONY_CARD_ICON_S4_158:0 "@tv_ceremony_river!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_158:0 "#Y 進行中#! — #high 魚の口が川を分ける#!\n#F 石と竹のカゴがついに流れに降ろされ、閩江が内水路と外水路に分けられます。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_158:0 "#G 完了#! — #high 魚の口が川を分ける#!\n#F 石と竹のカゴがついに流れに降ろされ、閩江が内水路と外水路に分けられます。#!"
 TV_WONDER_CEREMONY_S4_TITLE_158:0 "[tv_wonder_ceremony|E]：魚の口が川を分ける"
 TV_WONDER_CEREMONY_S4_DESC_158:0 "Stone and bamboo cages are lowered into the current at last, and the Min River is forced apart into inner and outer channels.かつて測量士が指差しただけの場所に、今は堤防が立っています。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_158:0 "分断され、川は譲ります。団結すれば破壊する。"
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_158:0 "私はまだ流れに石を投げるつもりはありません。"
 TV_WONDER_CEREMONY_CARD_ICON_S5_158:0 "@tv_ceremony_lake!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_158:0 "#Y 進行中#! — #high 飛砂堰が嵩上げされています#!\n#F 田んぼが埋もれる前に洪水とシルトを外側の水路に戻すため、堤防の横に低い放水路が建設されています。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_158:0 "#G 完了#! — #high 飛砂堰が嵩上げされます#!\n#F 田んぼが埋もれる前に洪水とシルトを外側の水路に戻すため、堤防の横に低い放水路が建設されています。#!"
 TV_WONDER_CEREMONY_S5_TITLE_158:0 "[tv_wonder_ceremony|E]：飛砂堰が嵩上げされる"
 TV_WONDER_CEREMONY_S5_DESC_158:0 "A low spillway is built beside the levee to spill floodwater and silt back into the outer channel before it can bury the fields.労働者は夏の洪水のタイミングを計り、その高さをテストします。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、その瞬間がまだ適切でない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_158:0 "Workers raise the low weir to spill the flood harmlessly away."
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_158:0 "急いで作った堰はすぐに壊れてしまう。"
 TV_WONDER_CEREMONY_CARD_ICON_S6_158:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_158:0 "#Y 進行中#! — #high 玉嶺山が切り開かれます#!\n#F 労働者が玉嶺山の岩を熱して割ってボトルネック水路を開通し、成都平原に向かう水の一定の割合だけを受け入れます。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_158:0 "#G 完了#! — #high 玉嶺山が切り開かれます#!\n#F 労働者が玉嶺山の岩を熱して割ってボトルネック水路を開通し、成都平原に向かう水の一定の割合だけを受け入れます。#!"
 TV_WONDER_CEREMONY_S6_TITLE_158:0 "[tv_wonder_ceremony|E]：玉霊山が切り裂かれる"
 TV_WONDER_CEREMONY_S6_DESC_158:0 "労働者は玉嶺山の岩を熱して割ってボトルネック水路を開通し、成都平原に向かう水の一定の割合だけを受け入れます。火と冷水は、彫刻刀では不可能な仕事をします。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングではない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_158:0 "私たちは、山が通り抜けるまで、山に火と水を放ちます。"
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_158:0 "労働者たちは山の手前でもう少し道具を置きました。"
 TV_WONDER_CEREMONY_CARD_ICON_S7_158:0 "@tv_ceremony_control!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_158:0 "#Y 進行中#! — #high 深さマーカーが設定されています#!\n#F 毎年冬に沈泥を取り除く必要がある深さを浚渫船に知らせるために、石の魚マーカーが川底に埋め込まれています。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_158:0 "#G 完了#! — #high 深さマーカーが設定されています#!\n#F 毎年冬に沈泥を除去する必要がある深さを浚渫船に知らせるために、石の魚マーカーが川底に埋め込まれています。#!"
 TV_WONDER_CEREMONY_S7_TITLE_158:0 "[tv_wonder_ceremony|E]：深度マーカーが設定されました"
 TV_WONDER_CEREMONY_S7_DESC_158:0 "毎年冬に、どれくらいの深さのシルトを取り除く必要があるかを浚渫船に知らせるために、石の魚標が川底に埋められています。韻は、読み書きができるかどうかに関係なく、すべての職長がルールを覚えられるように作られています。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_158:0 "石工たちは魚標を沈め、職長たちに韻を教えます。"
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_158:0 "私は川の記憶の韻を信じる準備ができていません。"
 TV_WONDER_CEREMONY_CARD_ICON_S8_158:0 "@tv_ceremony_prosperity!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_158:0 "#Y 進行中#! — #high 豊穣の地は封印されている#!\n#F 今や閩江の水は技術者が意図したとおりに上がったり下がったりし、成都平原は干ばつも洪水も知らない野原に花を咲かせます。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_158:0 "#G 完了#! — #high 豊穣の地は封印されている#!\n#F 今、閩江の水は技術者が意図したとおりに上がったり下がったりし、成都平原は干ばつも洪水も知らない野原に花を咲かせます。#!"
 TV_WONDER_CEREMONY_S8_TITLE_158:0 "[tv_wonder_ceremony|E]：豊穣の地は封印される"
 TV_WONDER_CEREMONY_S8_DESC_158:0 "閩江の水は現在、技術者の意図どおりに増水し、減水しており、成都平原は干ばつも洪水も知らない野原に花を咲かせています。下流のすべての工場や作業場は、そのためにより安定した経営を行っています。\n\n#weak 儀式を完了するために必要な料金を支払います。その結果、驚異の最終的な建物が建ち上がります。#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_158:0 "平原はついに安定した水を飲み、すべての工場は洪水や干ばつから解放されます。"
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_158:0 "急いでいる豊かさは、無駄にされている豊かさです。"
 TV_WONDER_CEREMONY_CARD_ICON_S1_159:0 "@tv_ceremony_ruler!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_159:0 "#Y 進行中#! — #high 母への皇帝の誓い#!\n#F 永楽帝は馬皇后を追悼する誓いを果たすため、宝恩寺に大塔を建立することを布告しました。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_159:0 "#G 完了#! — #high 母への皇帝の誓い#!\n#F 永楽帝は馬皇后を追悼する誓いを果たすため、宝恩寺に大塔を建立することを布告しました。#!"
 TV_WONDER_CEREMONY_S1_TITLE_159:0 "[tv_wonder_ceremony|E]：天皇の母への誓い"
 TV_WONDER_CEREMONY_S1_DESC_159:0 "永楽帝は馬皇后を追悼する誓いを果たし、宝恩寺に大塔を建立することを布告した。宮廷占星術師は、最初の捧げものに縁起の良い日を設定します。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_159:0 "皇帝は誓いを立て、塔の建設の開始を命じます。"
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_159:0 "宮廷占星術師たちは、より縁起の良い日を待つよう助言します。"
 TV_WONDER_CEREMONY_CARD_ICON_S2_159:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_159:0 "#Y 進行中#! — #high 財団は聖別されました#!\n#F 秦淮川の南にある選ばれた土地で僧侶が夜通しお経を唱え、新しく生まれ変わった土の上に香の煙が立ち込めます。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_159:0 "#G 完了#! — #high 財団は聖別されました#!\n#F 秦淮川の南側に選ばれた土地で僧侶が夜通しお経を唱え、新しく生まれ変わった土の上に香の煙が立ち込めます。#!"
 TV_WONDER_CEREMONY_S2_TITLE_159:0 "[tv_wonder_ceremony|E]：財団は聖別されました"
 TV_WONDER_CEREMONY_S2_DESC_159:0 "僧侶たちは秦淮川の南側の選ばれた土地で一晩中お経を唱え、新しく生まれ変わった土の上に香の煙が立ち込めます。遺物は、未来の塔の心臓部の下に封印されていると言われています。\n\n#weak 儀式を次の段階に進めるために必要な代金を支払います。または、その瞬間がまだ適切でない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_159:0 "聖地、ついに！"
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_159:0 "修道院長は、遺物が封印される前にもう一晩詠唱するよう求めます。"
 TV_WONDER_CEREMONY_CARD_ICON_S3_159:0 "@tv_ceremony_painting!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_159:0 "#Y 進行中#! — #high 窯は色釉用に設定されます#!\n#F 帝国窯から陶工が呼び出され、すべてのレンガを覆う白、黄、緑、茶色の釉薬を完成させます。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_159:0 "#G 完了#! — #high 窯は色釉用に設定されます#!\n#F 帝国窯から陶工が呼び出され、すべてのレンガを覆う白、黄、緑、茶色の釉薬を完成させます。#!"
 TV_WONDER_CEREMONY_S3_TITLE_159:0 "[tv_wonder_ceremony|E]：色釉の窯がセットされています"
 TV_WONDER_CEREMONY_S3_DESC_159:0 "皇室の窯から陶工たちが招集され、すべてのレンガを覆う白、黄、緑、茶色の釉薬を完成させます。テスト タイルは、色がコートに満足するまで焼成され、バラバラに砕かれます。\n\n#weak セレモニーを次の段階に進めるために必要な料金を支払います。または、その瞬間がまだ適切でない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_159:0 "陶芸家たちは完璧な釉薬を追い求めて、もう一度焼成します。"
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_159:0 "私たちはまだ満足していません。もう一度色をテストさせてください。"
 TV_WONDER_CEREMONY_CARD_ICON_S4_159:0 "@tv_ceremony_holy_site!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_159:0 "#Y 進行中#! — #high 第 1 層が上昇します#!\n#F 八角形の基礎が石ごとに積み上げられ、足場が神殿の敷地の上に登っていきます。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_159:0 "#G 完了#! — #high 第 1 層が上昇します#!\n#F 八角形の基礎が石ごとに積み上げられていくにつれて、足場が神殿の敷地の上に登っていきます。#!"
 TV_WONDER_CEREMONY_S4_TITLE_159:0 "[tv_wonder_ceremony|E]：第1階層が上昇"
 TV_WONDER_CEREMONY_S4_DESC_159:0 "八角形の土台が石ごとに積み上げられ、境内の上に足場が登っていきます。かつては釉薬のサンプルと唱えられた祝福だけであったものが、今では塔の真の最初のストーリーとして立っています。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、その瞬間がまだ適切でない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_159:0 "石工たちは、八角形の基礎の最後の石を所定の位置に設置しました。"
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_159:0 "職長は、別の石を置く前に足場を固定するように命令します。"
 TV_WONDER_CEREMONY_CARD_ICON_S5_159:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_159:0 "#Y 進行中#! — #high 9 段が天国に向かって登る#!\n#F 次の段にガラス張りのレンガが取り付けられ、それぞれが最後のものとは異なる色合いで光を捉えます。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_159:0 "#G 完成#! — #high 9 段が天国に向かって登る#!\n#F 次の段にガラス張りのレンガが取り付けられ、それぞれが最後のものとは異なる色合いで光を捉えます。#!"
 TV_WONDER_CEREMONY_S5_TITLE_159:0 "[tv_wonder_ceremony|E]：九段は天に向かって登る"
 TV_WONDER_CEREMONY_S5_DESC_159:0 "層ごとに釉薬をかけたレンガが取り付けられており、それぞれが最後のレンガとは異なる色合いで光を捉えます。最も高い足場に立つ労働者らは、レベルが上がるごとに下の都市が縮小していくと言っています。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。あるいは、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_159:0 "さらに高く！"
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_159:0 "棟梁はこの層の迫撃砲を硬化させるために登りを止めます。"
 TV_WONDER_CEREMONY_CARD_ICON_S6_159:0 "@tv_ceremony_art_work!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_159:0 "#Y 進行中#! — #high 提灯と鐘が吊るされています#!\n#F 川風で鳴るように各段の軒下に銅鐸が固定されており、毎晩灯籠が吊るされて点火されます。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_159:0 "#G 完了#! — #high 提灯と鐘が吊るされています#!\n#F 川風で鳴るように各段の軒下に銅鐸が固定されており、毎晩灯籠が吊るされて点火されます。#!"
 TV_WONDER_CEREMONY_S6_TITLE_159:0 "[tv_wonder_ceremony|E]：提灯と鐘が吊るされています"
 TV_WONDER_CEREMONY_S6_DESC_159:0 "各段の軒下には銅鐸が川風に吹かれて鳴り響き、毎晩提灯が吊るされて灯がともります。守護者や蓮の花の仏教レリーフがガラス張りのパネルにはめ込まれています。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、その瞬間がまだ適切でない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_159:0 "職人が最後の銅鐘を軒下に固定し、提灯に火を灯します。"
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_159:0 "まだです — 彫刻にはもっと注意が必要です!"
 TV_WONDER_CEREMONY_CARD_ICON_S7_159:0 "@tv_ceremony_laborers!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_159:0 "#Y 進行中#! — #high 窯は夜通し燃えます#!\n#F 適合する釉薬が不足しているため、暗くなってからずっと窯が焚かれ、疲れきった陶工たちは炉の横で交替で寝ています。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_159:0 "#G 完成#! — #high 窯は夜通し燃えます#!\n#F 適合する釉薬が不足するため、暗くなってからずっと窯が焚かれ、疲れ果てた陶工たちは炉の横で交替で眠っています。#!"
 TV_WONDER_CEREMONY_S7_TITLE_159:0 "[tv_wonder_ceremony|E]：夜通し窯が燃え上がる"
 TV_WONDER_CEREMONY_S7_DESC_159:0 "適合する釉薬が不足するため、窯は暗くなってからずっと火を焚かなければならず、疲れ果てた陶工たちは炉の横で交替で眠っています。僧侶が庭に食べ物を運んでくれるので、作業を止める必要はありません。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_159:0 "私たちは、窯を管理する人たちにどんな犠牲を払っても、窯を燃やし続けるよう命じます。"
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_159:0 "監督は、火が再び点火される前に、疲れきった陶芸家たちを休ませます。"
 TV_WONDER_CEREMONY_CARD_ICON_S8_159:0 "@tv_ceremony_building_open!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_159:0 "#Y 進行中#! — #high 磁器の塔が奉献される#!\n#F 完成した塔の周りを僧侶らが行列で一周し、140個の灯籠が初めて点火され、秦淮川沿いが金色に染まる夕暮れ.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_159:0 "#G 完成#! — #high 磁器の塔が奉献される#!\n#F 完成した塔の周りを僧侶たちが行列で一周し、140個の灯籠が初めて点火され、秦淮川沿いが金色に染まる夕暮れ.#!"
 TV_WONDER_CEREMONY_S8_TITLE_159:0 "[tv_wonder_ceremony|E]：磁器の塔は聖別されました"
 TV_WONDER_CEREMONY_S8_DESC_159:0 "完成した塔の周りを僧侶たちが行列で一周し、初めて140個の灯籠に火が灯され、夕暮れ時の秦淮川沿いが金色に染まります。この夜から、寺院の名声が巡礼者を引き寄せ、王国の忠誠心を静かに再構築します。\n\n#weak 儀式を完了するために必要な料金を支払います — その結果、驚異の最終的な建物が上昇します。#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_159:0 "ついにタワーを輝かせましょう！"
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_159:0 "僧侶たちは、すべての提灯が適切に吊るされるまで行列を遅らせます。"
 TV_WONDER_CEREMONY_CARD_ICON_S1_160:0 "@tv_ceremony_government!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_160:0 "#Y 進行中#! — #high 御用窯に対する勅令#!\n#F 法廷は景徳鎮を官製磁器の本拠地とし、その製品は一般的な磁器とは別にマークされることを宣言。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_160:0 "#G 完了#! — #high 御用窯に対する勅令#!\n#F 法廷は景徳鎮を官製磁器の本拠地とし、その製品は一般的な磁器とは別にマークされることを宣言。#!"
 TV_WONDER_CEREMONY_S1_TITLE_160:0 "[tv_wonder_ceremony|E]：御用窯勅令"
 TV_WONDER_CEREMONY_S1_DESC_160:0 "法廷は景徳鎮が官製磁器の本拠地であり、その製品はすべての一般的な磁器とは区別されると宣言した。富良の陶工たちは、帝国長官が憲章を読み上げるのを聞くために集まります。\n\n#weak 式典を次の段階に進めるために必要な代金を支払います。または、そのタイミングがまだ適切でない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_160:0 "ということで宣言です！"
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_160:0 "富良の窯に王冠の名を冠する準備はまだできていません。"
 TV_WONDER_CEREMONY_CARD_ICON_S2_160:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_160:0 "#Y 進行中#! — #high 粘土の堤防が選ばれました#!\n#F 調査員は富梁近くの川岸を歩き、各坑から引き出されたカオリンの白さをテストします。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_160:0 "#G 完了#! — #high 粘土の堤防が選ばれました#!\n#F 調査員は富梁近くの川岸を歩き、各坑から引き出されたカオリンの白さをテストします。#!"
 TV_WONDER_CEREMONY_S2_TITLE_160:0 "[tv_wonder_ceremony|E]：粘土の銀行が選択されました"
 TV_WONDER_CEREMONY_S2_DESC_160:0 "調査員は富良近くの川岸を歩き、各坑から引き出されたカオリンの白さを検査します。最高級の粘土層にはマークが付けられ、王冠のみのために予約されています。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_160:0 "測量士は王冠だけを対象として最も白い粘土層にマークを付けます。"
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_160:0 "まだです — 銀行はまだテストされていません!"
 TV_WONDER_CEREMONY_CARD_ICON_S3_160:0 "@tv_ceremony_art_work!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_160:0 "#Y 進行中#! — #high Cコバルトと陶芸の達人が到着#!\n#F 青いコバルト顔料が遠くの鉱山から運ばれ、有名な陶芸家が技術を貸すために江西省全土から呼び出されます。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_160:0 "#G 完了#! — #high Cコバルトと陶芸の達人が到着#!\n#F 青いコバルト顔料が遠くの鉱山から運ばれ、有名な陶芸家が技術を貸すために江西省全土から呼び出されます。#!"
 TV_WONDER_CEREMONY_S3_TITLE_160:0 "[tv_wonder_ceremony|E]：コバルトとマスターポッターが到着"
 TV_WONDER_CEREMONY_S3_DESC_160:0 "ブルーコバルト顔料は遠くの鉱山から運び込まれ、江西省全土から著名な陶芸家が呼ばれ、その技術を発揮します。粘土ヤードは準備されたペーストで満たされ、ホイールが回転するのを待ちます。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_160:0 "最高の陶芸家を呼んでコバルトを運び込ませます。"
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_160:0 "粘土ヤードはまだコバルトと職人がいない状態で待っています。"
 TV_WONDER_CEREMONY_CARD_ICON_S4_160:0 "@tv_ceremony_production_method!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_160:0 "#Y 進行中#! — #high 最初の龍窯が掘られています#!\n#F 労働者たちは、富良の上の丘の中腹に最初の龍窯の長い傾斜した部屋を切り開きました。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_160:0 "#G 完了#! — #high 最初の龍窯が掘られました#!\n#F 労働者たちは、富良の上の丘の中腹に最初の龍窯の長い傾斜した部屋を切り開きました。#!"
 TV_WONDER_CEREMONY_S4_TITLE_160:0 "[tv_wonder_ceremony|E]：初めての竜窯が掘られる"
 TV_WONDER_CEREMONY_S4_DESC_160:0 "労働者たちは、富良の上の丘の中腹に最初の龍窯の長く傾斜した部屋を切り開いた。今まで粘土の穴と集められた職人だったものが、初めて作業用の炉になります。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_160:0 "点火されていない炉は丘の穴にすぎません。"
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_160:0 "私たちはこの丘の中腹に火を放つ準備ができていません。"
 TV_WONDER_CEREMONY_CARD_ICON_S5_160:0 "@tv_ceremony_painting!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_160:0 "#Y 進行中#! — #high 青と白がその形になる#!\n#F 画家たちは、火をつけていない船の上にひざまずき、慣れたスピードで龍、波、梅の花などのコバルトの筆跡を描きます。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_160:0 "#G 完成#! — #high 青と白がその形になる#!\n#F 絵描きたちは、火をつけていない船の上にひざまずき、慣れたスピードで龍、波、梅の花などのコバルトの筆致を描きます。#!"
 TV_WONDER_CEREMONY_S5_TITLE_160:0 "[tv_wonder_ceremony|E]：青と白が形になる"
 TV_WONDER_CEREMONY_S5_DESC_160:0 "絵描きたちは、焼かれていない船の上にひざまずいて、龍、波、梅の花などをコバルト色の筆致で、慣れたスピードで描きます。それぞれの作品は、火に近づくまでに十数人の人の手を経ます。\n\n#weak セレモニーを次の段階に進めるために必要な代金を支払います。または、その瞬間がまだ適切でない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_160:0 "画家たちはドラゴンを横たえ、待っている粘土の上で手を振ります。"
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_160:0 "急いで筆を動かすと汚い線が残ってしまいます。"
 TV_WONDER_CEREMONY_CARD_ICON_S6_160:0 "@tv_ceremony_control!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_160:0 "#Y 進行中#! — #high 帝国のマークが刻印されています#!\n#F 検査員は冷却ラックを歩きながら、わずかな欠陥のある船舶を粉砕します。そして、完璧な船だけが船底に統治のマークを刻んでいます。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_160:0 "#G 完了#! — #high 帝国のマークが刻印されています#!\n#F 検査員は冷却ラックを歩きながら、わずかな欠陥のある船舶を粉砕します。そして、完璧な船だけが船底に統治のマークを持ちます。#!"
 TV_WONDER_CEREMONY_S6_TITLE_160:0 "[tv_wonder_ceremony|E]：帝国マークが刻印されています"
 TV_WONDER_CEREMONY_S6_DESC_160:0 "検査員は冷却ラックを歩き回り、わずかな欠陥のある船舶もすべて粉砕します。そして、欠陥のない船舶だけが船底に統治の痕跡を残します。ワークショップの門の外には破片が山積みになっています。\n\n#weak 儀式を次の段階に進めるために必要な代金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_160:0 "私は欠陥のある船に私たちの統治の痕跡を残させません。"
