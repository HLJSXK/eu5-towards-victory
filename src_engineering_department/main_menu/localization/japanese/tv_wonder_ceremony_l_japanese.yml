 TV_WONDER_CEREMONY_S2_DESC_143:0 "石工たちは島にある古いメロヴィング朝教会の最後の壁を解体し、学者たちはその遺物を目録にまとめて、まだ建設されていない大聖堂に移築します。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
