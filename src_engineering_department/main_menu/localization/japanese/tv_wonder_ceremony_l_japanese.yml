 TV_WONDER_CEREMONY_S3_TITLE_169:0 "[tv_wonder_ceremony|E]：バルバロッサの保護を求めています"
 TV_WONDER_CEREMONY_S3_DESC_169:0 "使者たちは、領主が同胞の借金のために学生を捕らえることのないよう、遠く離れた学者たちの安全な通行を保証する令状を皇帝に請願する。一度付与される特権は、すべての巡回事務員によってコピーされ、保持されます。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_169:0 "皇帝の印章、ついに確保！"
