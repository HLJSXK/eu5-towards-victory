 TV_WONDER_CEREMONY_CARD_ICON_S1_103:0 "@tv_ceremony_holy_site!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_103:0 "#Y 進行中#! — #high A 岩の上にドームが布告される#!\n#F Cカリフ・アブド・アル・マリクは、ハラムの頂上にある礎石の上に黄金のドームがそびえ立ち、叫び声が日の出前にエルサレムの市場でその言葉を伝えることを布告した。セット.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_103:0 "#G 完了#! — #high A 岩の上にドームが布告される#!\n#F Cカリフ・アブド・アル・マリクは、ハラムの頂上にある礎石の上に黄金のドームがそびえ立つことを布告し、日の出前に叫び声がエルサレムの市場で噂を伝えるセット.#!"
 TV_WONDER_CEREMONY_S1_TITLE_103:0 "[tv_wonder_ceremony|E]：岩の上にドームが宣言される"
 TV_WONDER_CEREMONY_S1_DESC_103:0 "カリフ アブド アル マリクは、ハラムの頂上にある礎石の上に黄金のドームがそびえ立つと布告し、日が沈む前に叫び声がエルサレムの市場でその知らせを伝えます。\n\n#weak 儀式を次の段階に進めるために必要な代金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_103:0 "カリフの法令は最も速い馬を追い越します。"
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_103:0 "私たちはまだこの法令を声高に宣言する準備ができていません。"
 TV_WONDER_CEREMONY_CARD_ICON_S2_103:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_103:0 "#Y 進行中#! — #high プラットフォームは浄化され祝福されています#!\n#F イマームと地元の聖職者が一緒にその周囲を歩きながら、ドームが冠する石を祝福している間、作業員が古代のプラットフォームを瓦礫から掃除しています。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_103:0 "#G 完了#! — #high プラットフォームは浄化され祝福されています#!\n#F イマームと地元の聖職者が一緒にその周囲を歩きながら、ドームが冠する石を祝福している間、作業員が古代のプラットフォームを瓦礫から掃除しています。#!"
 TV_WONDER_CEREMONY_S2_TITLE_103:0 "[tv_wonder_ceremony|E]：プラットフォームはクリアされ、祝福されています"
 TV_WONDER_CEREMONY_S2_DESC_103:0 "労働者が古代の壇から瓦礫を掃き掃除する一方、イマームと地元の聖職者が一緒に周囲を歩き、ドームの冠となる石に祝福を与えます。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_103:0 "イマームたちは、足元の石を祝福しながら、片付けられた壇を歩きます。"
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_103:0 "聖地もその祝福を待たなければなりません。"
 TV_WONDER_CEREMONY_CARD_ICON_S3_103:0 "@tv_ceremony_wealth!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_103:0 "#Y 進行中#! — #high 大理石と金が集まる#!\n#F 州中の荒廃したビザンチン様式の広間から柱や大理石の板が剥ぎ取られ、キャラバンが金箔や杉の梁を道路に運んでいきます。エルサレム.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_103:0 "#G 完了#! — #high 大理石と金が集まる#!\n#F 州中の荒廃したビザンチン様式の広間から柱や大理石の板が剥がされ、キャラバンが金箔や杉の梁を道路まで運んでいきます。エルサレム.#!"
 TV_WONDER_CEREMONY_S3_TITLE_103:0 "[tv_wonder_ceremony|E]：大理石と金が集まりました"
 TV_WONDER_CEREMONY_S3_DESC_103:0 "州中の荒廃したビザンチン様式の広間から柱や大理石の板が剥ぎ取られ、一方、キャラバンが金箔や杉の梁をエルサレムへの道を運びます。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_103:0 "私たちは崩れ落ちた広間から運んできた大理石と、遠くの道から運んできた金を注文しました。"
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_103:0 "キャラバンはまだ荷物が呼び出されず、まだゲートに留まっている。"
 TV_WONDER_CEREMONY_CARD_ICON_S4_103:0 "@tv_ceremony_art_work!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_103:0 "#Y 進行中#! — #high 岩の周りに八角形がそびえ立っています#!\n#F 石工たちは、聖なる石の周りに八角形のアーケードの最初のリングを直接置きました。そして、将来のドームの形が初めて下の通りから見えるようになりました。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_103:0 "#G 完成#! — #high 岩の周りに八角形がそびえ立っています#!\n#F 石工たちは、聖なる石の周りに八角形のアーケードの最初のリングを直接置きました。そして、将来のドームの形が初めて下の通りから見えるようになりました。#!"
 TV_WONDER_CEREMONY_S4_TITLE_103:0 "[tv_wonder_ceremony|E]：岩の周りにそびえる八角形"
 TV_WONDER_CEREMONY_S4_DESC_103:0 "石工たちは、八角形のアーケードの最初のリングを神聖な石の周りに直接置き、ドームの形が下の通りから初めて見えるようになりました。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_103:0 "石工は聖なる岩の周りに八角形の最初の礎石を置きました。"
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_103:0 "私たちはまだ、この最初の石の輪を掲げる準備ができていません。"
 TV_WONDER_CEREMONY_CARD_ICON_S5_103:0 "@tv_ceremony_construction!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_103:0 "#Y 進行中#! — #high 二重歩行室が形を成します#!\n#F 大理石の柱の内側と外側のアーケードが岩の周囲に接近しており、そのアーチはいつか頭上にある大きな木製のドームを支えることになる重量を支えています。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_103:0 "#G 完成#! — #high 二重歩行室が形を成します#!\n#F 大理石の柱の内側と外側のアーケードが岩の周囲に接近しており、そのアーチはいつか頭上にある大きな木製のドームを支えることになる重量を支えています。#!"
 TV_WONDER_CEREMONY_S5_TITLE_103:0 "[tv_wonder_ceremony|E]：二重外来が具体化"
 TV_WONDER_CEREMONY_S5_DESC_103:0 "大理石の柱でできた内側と外側のアーケードが岩の周囲に迫っており、そのアーチにはいつか頭上にある大きな木製ドームを支えることになる重量がかかっています。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_103:0 "対になったアーケードは岩の周囲に迫っており、そのアーチはすでにこれから来る重量に耐えています。"
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_103:0 "基礎が確実になる前にアーチが閉じられることはありません。"
 TV_WONDER_CEREMONY_CARD_ICON_S6_103:0 "@tv_ceremony_writer!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_103:0 "#Y 進行中#! — #high モザイクと詩が壁を覆う#!\n#F 職人がドラムに沿ってつるや王冠のガラスモザイクを設置し、書道家がドラムを一周するコーランの詩の長い帯を書き始める。インテリア.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_103:0 "#G 完成#! — #high モザイクと詩が壁を覆う#!\n#F 職人がドラムに沿ってつるや王冠のガラスモザイクを設置し、書道家がドラムを囲むコーランの詩の長い帯を書き始める。インテリア.#!"
 TV_WONDER_CEREMONY_S6_TITLE_103:0 "[tv_wonder_ceremony|E]：モザイクと詩が壁を覆う"
 TV_WONDER_CEREMONY_S6_DESC_103:0 "職人がつるや王冠のガラス モザイクをドラムに沿って設置し、書道家が内部を一周するコーランの詩の長い帯を書き始めます。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_103:0 "私たちはモザイクと、これらの壁を囲む詩の制作を依頼しました。"
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_103:0 "書道家たちはその詩がまだ完成していないまま筆を置いた。"
 TV_WONDER_CEREMONY_CARD_ICON_S7_103:0 "@tv_ceremony_gold!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_103:0 "#Y 進行中#! — #high ドームには金メッキが施されています#!\n#F 夏の盛りには木製のドームに金のシートが打ち付けられ、足場が下りる前に、その光が当たるのを見ようと巡礼者がすでに門に集まっています。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_103:0 "#G 完了#! — #high ドームは金メッキです#!\n#F 夏の盛りには木製のドームに金のシートが打ち付けられ、足場が下りる前に、その光が当たるのを見ようと巡礼者がすでに門に集まっています。#!"
 TV_WONDER_CEREMONY_S7_TITLE_103:0 "[tv_wonder_ceremony|E]：ドームは金メッキです"
 TV_WONDER_CEREMONY_S7_DESC_103:0 "夏の盛りに木製のドームの上に金のシートが打ち付けられ、足場が下りる前にその光が当たるのを見ようと巡礼者がすでに門に集まっています。\n\n#weak 必要な料金を払って式典を次の段階に進めます。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_103:0 "職人たちは夏の暑さに耐えながら、ドームの木枠に金のシートを次々と打ち付けていきます。"
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_103:0 "このような暑さの中では、まだ梁を足場に上げることはできません。"
 TV_WONDER_CEREMONY_CARD_ICON_S8_103:0 "@tv_ceremony_religious_unity!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_103:0 "#Y 進行中#! — #high ドームは聖別されました#!\n#F 足場がなくなり、金色のドームがエルサレムの太陽を受けて、壇は集まった群衆の前で聖別され、この日から岩の光が王国全体に届くと言われていますon.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_103:0 "#G 完了#! — #high ドームは聖別されました#!\n#F 足場がなくなり、金色のドームがエルサレムの太陽を受けて、壇は集まった群衆の前で聖別され、この日から岩の光が王国全体に届くと言われていますon.#!"
 TV_WONDER_CEREMONY_S8_TITLE_103:0 "[tv_wonder_ceremony|E]：ドームは聖別されました"
 TV_WONDER_CEREMONY_S8_DESC_103:0 "足場がなくなり、金色のドームがエルサレムの太陽を受け、壇は集まった群衆の前で聖別され、この日から岩の光が領域全体に届くと言われています。\n\n#weak 儀式を完了するために必要な料金を支払います。その結果、驚異の最終的な建物が立ち上がります。#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_103:0 "集まった群衆の前で壇は聖別され、岩の光が領域全体を照らすことが宣言されます。"
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_103:0 "群衆は門から散り散りになるが、聖別の儀式はまだ召されていない。"
 TV_WONDER_CEREMONY_CARD_ICON_S1_104:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_104:0 "#Y 進行中#! — #high 王は石の山を命じます#!\n#F スーリヤヴァルマン 2 世は法廷を召集し、ヴィシュヌ神の神殿の山、その 5 つの塔がクメールの地にこれまで建てられたどの神殿よりも高くそびえると発表しました。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_104:0 "#G 完了#! — #high 王は石の山を命じます#!\n#F スーリヤヴァルマン 2 世は法廷を召集し、ヴィシュヌ神の神殿の山、その 5 つの塔がクメールの地にこれまで建てられたどの神殿よりも高くそびえると発表しました。#!"
 TV_WONDER_CEREMONY_S1_TITLE_104:0 "[tv_wonder_ceremony|E]：王は石の山を命じる"
 TV_WONDER_CEREMONY_S1_DESC_104:0 "スーリヤヴァルマン 2 世は法廷を召集し、ヴィシュヌ神を祀る神殿の山、その 5 つの塔がクメールの地にこれまでに建てられたどの神殿よりも高くそびえることを発表しました。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_104:0 "スーリヤヴァルマンは王家の威信を石の山に賭けます。"
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_104:0 "王は躊躇し、その山は宮廷での噂にとどまる。"
 TV_WONDER_CEREMONY_CARD_ICON_S2_104:0 "@tv_ceremony_time!"
