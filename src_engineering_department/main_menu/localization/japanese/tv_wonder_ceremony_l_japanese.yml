 TV_WONDER_CEREMONY_CARD_ICON_S4_205:0 "@tv_ceremony_build_icon!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_205:0 "#Y 進行中#! — #high 中庭の壁がそびえ立ちます#!\n#F 石工たちが燃えている地面の周囲に五角形の囲いの最初の石を設置しました。砂の上に目印に過ぎなかった神殿は、風に散らされることのない建物になりました。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_205:0 "#G 完成#! — #high 中庭の壁がそびえ立ちます#!\n#F 石工たちが燃え盛る地面の周りに五角形の囲いの最初の石を設置しました。砂の上に目印にすぎなかった神殿は、風が散らない建物になりました。#!"
