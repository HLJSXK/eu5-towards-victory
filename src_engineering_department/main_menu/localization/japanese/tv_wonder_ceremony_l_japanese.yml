 TV_WONDER_CEREMONY_S6_DESC_167:0 "天文学者は地図作成室に集まったパイロットたちに推測航法と恒星航法を教え、船が新鮮な海岸線を伴って戻ってくると季節ごとに新しい海図が描かれます。ライブラリは修正された地図で厚くなります。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_167:0 "どんなに質素な船でも、星空を見れば港が見つかります。"
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_167:0 "私はパイロットたちにもう少し星を研究させてから、準備ができたと言うつもりです。"
 TV_WONDER_CEREMONY_CARD_ICON_S7_167:0 "@tv_ceremony_navy_light_ship!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_167:0 "#Y 進行中#! — #high 最初の遠征出航#!\n#F Cカラヴェルはついにラゴスから以前に地図に描かれたすべての海岸を越えて出航し、パイロットはサグレスの地図がまだ示されていなかった海岸の報告を持って戻ってきました。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_167:0 "#G 完了#! — #high 最初の遠征出航#!\n#F Cカラヴェルはついにラゴスから以前に地図に描かれたすべての海岸を越えて出航し、パイロットはサグレスの地図がまだ示されていなかった海岸の報告を持って戻ってきました。#!"
 TV_WONDER_CEREMONY_S7_TITLE_167:0 "[tv_wonder_ceremony|E]：第一次遠征出航"
 TV_WONDER_CEREMONY_S7_DESC_167:0 "キャラベル船は最終的に、以前に地図に記載されていたすべての海岸を通過してラゴスから出航し、パイロットはサグレスの地図にまだ示されていない海岸の報告を持って戻ってきました。戻ってくる船は、英雄のように埠頭に迎えられます。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
