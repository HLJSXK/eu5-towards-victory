 TV_WONDER_CEREMONY_S5_DESC_166:0 "ホスピスやホステルは、一日の正直な散歩に合わせた間隔で建てられ、それぞれにパン、水、痛んだ足を休める場所が備えられています。各停留所の僧侶は、履き古されたブーツだけで戻ってくる巡礼者を見分けることを学びます。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_166:0 "毎日の散歩の終わりにはホステルが建ち、各ホステルにはパンと水が備蓄されています。"
