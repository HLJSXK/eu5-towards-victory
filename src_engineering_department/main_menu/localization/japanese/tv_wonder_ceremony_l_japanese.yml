 TV_WONDER_CEREMONY_S4_DESC_205:0 "石工が燃え盛る地面の周囲に五角形の囲いの最初の石を設置すると、砂の上に目印にすぎなかった神社が、風にも飛び散ることのない建物になります。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
