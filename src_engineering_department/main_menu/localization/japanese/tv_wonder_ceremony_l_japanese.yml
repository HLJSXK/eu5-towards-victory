 TV_WONDER_CEREMONY_S1_DESC_169:0 "ボローニャの領事たちは、法学者に市の城壁内で自由に教え、論争する権利を与える憲章に印を押した。新しいスタディウムが設立されるという噂は、旅する学者の間ですぐに広がります。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_169:0 "領事たちは蝋に印鑑を押し込み、憲章が制定される。"
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_169:0 "まだです。まずインクを乾燥させてください。"
