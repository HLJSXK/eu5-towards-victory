 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_222:0 "#G 完了#! — #high 神聖な泥の混合#!\n#F 職人たちは、ジェンヌの建築業者の家族に代々受け継がれてきたレシピに従い、川岸の泥と籾殻、シアバターを混ぜます。#!"
 TV_WONDER_CEREMONY_S2_TITLE_222:0 "[tv_wonder_ceremony|E]：聖なる泥を混ぜる"
 TV_WONDER_CEREMONY_S2_DESC_222:0 "職人たちは、ジェンネの建設業者の家族に何世代にもわたって受け継がれてきたレシピに従って、川岸の泥をもみ殻やシアバターと混ぜ合わせます。長老たちは、成形が始まる前に混合物が硬化するピットを祝福します。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_222:0 "職人たちは穴を祝福し、川の泥に籾殻とシアバターを練り込みます。"
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_222:0 "建設者は神聖な泥を硬化させるためにしばらく放置します。"
 TV_WONDER_CEREMONY_CARD_ICON_S3_222:0 "@tv_ceremony_vegetation!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_222:0 "#Y 進行中#! — #high トロン木材の収集#!\n#F ヤシの木材は切断され、トロンビームの形に成形され、構造物として、また年に一度のフェスティバルの足場として壁から突き出る予定です。再漆喰.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_222:0 "#G 完了#! — #high トロン木材の収集#!\n#F ヤシの木材は切断され、トロンビームの形に成形され、構造物として、また年に一度のフェスティバルの足場として壁から突き出る予定です。再漆喰.#!"
 TV_WONDER_CEREMONY_S3_TITLE_222:0 "[tv_wonder_ceremony|E]：トロン材の採取"
 TV_WONDER_CEREMONY_S3_DESC_222:0 "ヤシの木は切断され、トロンビームの形に成形され、構造物として、また年に一度の漆喰塗り替え祭りの足場として壁から突き出すことになります。市場のトレーダーも学者も同様に、モスクの建設に労働日を約束しています。\n\n#weak 式典を次の段階に進めるために必要な代金を支払います。あるいは、まだ適切な時期ではない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_222:0 "それなら、ヤシの木に――トロンのための木材を！"
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_222:0 "木こりたちは斧を置き、より良い季節が来るのを待ちます。"
 TV_WONDER_CEREMONY_CARD_ICON_S4_222:0 "@tv_ceremony_topography!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_222:0 "#Y 進行中#! — #high 土壁が立ち上がり始める#!\n#F 建設業者はモスクの真の日干しレンガの壁を敷き始め、かつては祝福と木材だけがあった市場広場の上に控え壁と塔が形を整えていく立っていた。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_222:0 "#G 完成#! — #high 土壁が立ち上がり始める#!\n#F 建設業者はモスクの真の日干しレンガの壁を敷き始め、かつては祝福と木材しかなかった市場広場の上に控え壁と塔が形を整えていく立っていた。#!"
 TV_WONDER_CEREMONY_S4_TITLE_222:0 "[tv_wonder_ceremony|E]：土壁が立ち上がり始める"
 TV_WONDER_CEREMONY_S4_DESC_222:0 "建築業者はモスクの真の日干しレンガの壁の敷き始め、かつて祝福と木材だけが立っていた市場広場の上に控え壁と塔が形を整えていきます。子供たちは泥運びの横を走り、濡れた壁に自分の手形を押そうと熱心です。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_222:0 "子どもたちが濡れた地面に手形を押し込む中、建設業者が日レンガの壁を立ち上げます。"
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_222:0 "まだです — 壁は建てないままにしておいてください!"
 TV_WONDER_CEREMONY_CARD_ICON_S5_222:0 "@tv_ceremony_building_levels!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_222:0 "#Y 進行中#! — #high 塔はその高さに達します#!\n#F 3 つの大きな塔が屋根の上にそびえ立ち、その円錐形の尖塔の上には繁栄と純潔を求める古い習慣に従ってダチョウの卵が飾られています。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_222:0 "#G 完成#! — #high 塔はその高さに達します#!\n#F 3つの大きな塔は屋根の上にそびえ立ち、その円錐形の尖塔の上には繁栄と純潔を求める古い習慣に従ってダチョウの卵が飾られています。#!"
 TV_WONDER_CEREMONY_S5_TITLE_222:0 "[tv_wonder_ceremony|E]：塔はその高さに達する"
 TV_WONDER_CEREMONY_S5_DESC_222:0 "3 つの大きな塔が屋根の上にそびえ立ち、その円錐形の尖塔の上には繁栄と純粋さの古い習慣に従ってダチョウの卵が飾られています。足場を組む人たちは、新鮮な泥の入ったかごを背中に担いでトロンビームをよじ登ります。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_222:0 "繁栄と純粋さのために、私たちは塔にダチョウの卵を飾ります。"
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_222:0 "足場職人たちはバスケットを降ろし、塔を未完成のまましばらく放置します。"
 TV_WONDER_CEREMONY_CARD_ICON_S6_222:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_222:0 "#Y 進行中#! — #high 祈祷殿は封鎖されました#!\n#F ヤシ材と泥でできた大祈祷殿の屋根は封鎖され、内部の柱の森はついにサヘルの太陽から遮られました。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_222:0 "#G 完了#! — #high 祈祷殿は封鎖されました#!\n#F ヤシの材と泥でできた大祈祷殿の屋根は封鎖され、内部の柱の森はついにサヘルの太陽から遮られました。#!"
 TV_WONDER_CEREMONY_S6_TITLE_222:0 "[tv_wonder_ceremony|E]：祈祷殿は封印されています"
 TV_WONDER_CEREMONY_S6_DESC_222:0 "大礼拝堂のヤシの材と泥でできた屋根は密閉され、内部の柱の森は最終的にサヘルの太陽から日陰になった。以下の商人は、広場の向こう側にあるモスクの影に合わせて市場の日のタイミングを計り始めます。\n\n#weak 式典を次の段階に進めるために必要な価格を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_222:0 "ついに屋根が封鎖されました！"
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_222:0 "柱をもう少し太陽にさらしたままにします。"
 TV_WONDER_CEREMONY_CARD_ICON_S7_222:0 "@tv_ceremony_laborers!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_222:0 "#Y 進行中#! — #high 第一回漆喰塗り替え祭り#!\n#F 街全体が第一回漆喰塗り替え祭りに沸き、男性と少年たちがトロンビームをよじ登り、壁一面の新鮮な泥を滑らかにする楽しい一日の労働です。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_222:0 "#G 完了#! — #high 第一回漆喰塗り替え祭り#!\n#F 街全体が第一回漆喰塗り替え祭りに沸き、男性と少年たちがトロンビームによじ登って壁全体の新鮮な泥を滑らかにする楽しい一日の労働です。#!"
 TV_WONDER_CEREMONY_S7_TITLE_222:0 "[tv_wonder_ceremony|E]：第一回塗り替え祭り"
 TV_WONDER_CEREMONY_S7_DESC_222:0 "最初の漆喰塗り替え祭りに市中が集まり、男性や少年たちがトロンビームをよじ登って壁全体の新鮮な泥を滑らかにする楽しい一日の労働です。モスクが継ぎ目のない最後のコートを着始めると、ミュージシャンや市場の女性たちが労働者に食事を与えます。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_222:0 "街全体がトロンビームに登り、壁を越えて新鮮な泥を滑らかにします。"
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_222:0 "今の季節ではありません。フェスティバルは待ってください。"
 TV_WONDER_CEREMONY_CARD_ICON_S8_222:0 "@tv_ceremony_religious_influence!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_222:0 "#Y 進行中#! — #high 大モスクが聖別されます#!\n#F ジェンネの大モスクは、信者がその土の中庭を埋め尽くし、その塔が何世代にもわたって市場広場に影を落としながら正式に聖別されます。来てください。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_222:0 "#G 完成#! — #high 大モスクが聖別されます#!\n#F ジェンネの大モスクは、その土の中庭を信者が埋め尽くし、その塔が何世代にもわたって市場広場に影を落としながら正式に聖別されます。来てください。#!"
 TV_WONDER_CEREMONY_S8_TITLE_222:0 "[tv_wonder_ceremony|E]：聖別された大モスクが立つ"
 TV_WONDER_CEREMONY_S8_DESC_222:0 "ジェンネの大モスクは、信者がその土の中庭を埋め尽くし、その塔が今後何世代にもわたって市場広場に影を落とす中、正式に聖別されます。この都市の献身はサヘル全域で知られるようになり、王国中の信者はその模範から永続的な力を引き出します。\n\n#weak 儀式を完了するために必要な代金を支払います。その結果、驚異の最終的な建物が建ち上がります。#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_222:0 "私たちはこのモスクを信者たちの前で聖別し、その信心がサヘル全域に響きわたるようにします。"
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_222:0 "信者たちは外に残り、奉献は別の日を待ちます。"
 TV_WONDER_CEREMONY_CARD_ICON_S1_223:0 "@tv_ceremony_ruler!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_223:0 "#Y 進行中#! — #high オバは万里の長城を布告する#!\n#F オバは近隣諸国に対するベナンの力の証拠として首都、城壁、堀を取り囲む大規模な土塁を宣言するキングダム.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_223:0 "#G 完了#! — #high オバは万里の長城を布告する#!\n#F オバは近隣諸国に対するベナンの力の証拠として首都、城壁、堀を取り囲む大規模な土塁を宣言するキングダム.#!"
 TV_WONDER_CEREMONY_S1_TITLE_223:0 "[tv_wonder_ceremony|E]：大庭が万里の長城を布告"
 TV_WONDER_CEREMONY_S1_DESC_223:0 "オバ族は、隣接するすべての王国に対するベナンの力の証拠として首都、城壁、堀を取り囲む大規模な土塁を宣言した。最初の鋤が着工する前に、青銅の鋳物師も酋長も同様に労働の誓いを立てます。\n\n#weak 式典を次の段階に進めるために必要な代金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_223:0 "私はこの法令を宣言し、すべての首長をその宣誓に拘束します。"
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_223:0 "大場は今のところ命令を保留している。"
