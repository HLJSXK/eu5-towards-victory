 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_137:0 "#G 完了#! — #high 砂漠の駅の測量#!\n#F 測量士とベドウィンのガイドが巡礼路の乾燥した中間地点を走り、毎年キャラバンが行かなければならない井戸、日陰、放牧地に印を付けます。残り.#!"
 TV_WONDER_CEREMONY_S2_TITLE_137:0 "[tv_wonder_ceremony|E]：砂漠基地の調査"
 TV_WONDER_CEREMONY_S2_DESC_137:0 "測量士とベドウィンのガイドが巡礼路の乾燥した中継地点を進み、毎年キャラバンが休む必要がある井戸、日陰、放牧地に印を付けます。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_137:0 "ガイドはラクダを駆り立てて、次の不毛なマイルを目指して進みます。"
