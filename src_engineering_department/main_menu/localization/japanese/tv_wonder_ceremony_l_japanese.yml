 TV_WONDER_CEREMONY_S8_DESC_212:0 "大聖堂はライン川の上に聖別されて建っており、その聖歌隊と聖堂は巡礼者や商人を同様に惹きつけており、この日以来、大聖堂が燃え上がる信仰と誇りが領域全体に感じられます。\n\n#weak 儀式を完了するために必要な料金を支払います。その結果、驚異の最終的な建物が立ち上がります。#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_212:0 "ついに、それは聖別されて立っています！"
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_212:0 "法廷は最後の儀式をもう少し延期する。"
 TV_WONDER_CEREMONY_CARD_ICON_S1_213:0 "@tv_ceremony_law!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_213:0 "#Y 進行中#! — #high コントール憲章が宣言される#!\n#F ハンブルク市議会はギルドの長老たちを召喚し、バルト海と北海の貿易が計量され、封印され、記録される新しいコントールの憲章を読み上げる。屋根.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_213:0 "#G 完了#! — #high コントール憲章が宣言される#!\n#F ハンブルク市議会はギルドの長老たちを召喚し、バルト海と北海の貿易が計量され、封印され、記録される新しいコントールの憲章を読み上げる。屋根.#!"
 TV_WONDER_CEREMONY_S1_TITLE_213:0 "[tv_wonder_ceremony|E]：Kontor憲章が宣言されました"
 TV_WONDER_CEREMONY_S1_DESC_213:0 "ハンブルク市議会はギルドの長老たちを召喚し、バルト海と北海の貿易が一つ屋根の下で計量され、封印され、記録される新しいコントールの憲章を読み上げる。 1 つの石が置かれる前にコインの所有者が変わり、住民はまだ開かれていない台帳で乾杯します。\n\n#weak 儀式を次の段階に進めるために必要な代金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_213:0 "コインに封印された憲章は、蝋で封印された憲章よりもしっかりと結びつきます。"
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_213:0 "私たちはハンブルクの長老たちに私たちの宝物庫をまだ公開しません。"
