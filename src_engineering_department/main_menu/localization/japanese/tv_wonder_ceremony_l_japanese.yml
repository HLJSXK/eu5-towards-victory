 TV_WONDER_CEREMONY_CARD_ICON_S7_143:0 "@tv_ceremony_warning_icon!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_143:0 "#Y 進行中#! — #high 火災が木造屋根を脅かす#!\n#F ある冬の夜、大工の火鉢が足場に火をつけ、セーヌ川からバケツを持った労働者と聖職者たちの必死の連鎖だけが、中途半端な屋根を救い出しました。破滅.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_143:0 "#G 完了#! — #high 火災が木造屋根を脅かす#!\n#F ある冬の夜、大工の火鉢が足場に火をつけ、セーヌ川からバケツを持った労働者と聖職者たちの必死の連鎖だけが、中途半端な屋根を救い出しました。破滅.#!"
 TV_WONDER_CEREMONY_S7_TITLE_143:0 "[tv_wonder_ceremony|E]：木造屋根は火災の脅威にさらされています"
 TV_WONDER_CEREMONY_S7_DESC_143:0 "ある冬の夜、大工の火鉢が足場に火をつけます。セーヌ川からバケツを持った労働者と聖職者の決死の連鎖だけが、中途半端な屋根を廃墟から救い出します。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
