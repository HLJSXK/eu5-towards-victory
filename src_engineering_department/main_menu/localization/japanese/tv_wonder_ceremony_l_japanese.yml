 TV_WONDER_CEREMONY_S2_DESC_187:0 "裁判所の技師たちは、中国、インド、ペルシャからのキャラバンルートが長い間合流してきた空き地を歩き回り、夕日を背景に最初の偉大なマドラサの足跡をマークします。近くには、この街がすでに有名になっている青とターコイズ色の釉薬タイルを焼くための窯が建てられています。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
