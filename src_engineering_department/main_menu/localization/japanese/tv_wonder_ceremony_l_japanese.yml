 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_166:0 "#G 完了#! — #high 川に最初の橋が架かりました#!\n#F ついにガリシアの川に石造りのアーチがそびえ立ち、途中に最初の道端の神社が設置されました。#!"
