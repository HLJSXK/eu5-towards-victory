 TV_WONDER_CEREMONY_S6_TITLE_186:0 "[tv_wonder_ceremony|E]：川岸でチャイカが形づくる"
 TV_WONDER_CEREMONY_S6_DESC_186:0 "船大工と鍛冶屋が協力して働き、一本のオークの幹からチャイカボートをくり抜き、その間、鍛冶屋はサーベル、マスケット銃の銃身、蹄鉄を休むことなく打ち出します。シックはキャンプというよりも、ドニエプル川に浮かぶ兵器庫のように見え始めます。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
