 TV_WONDER_CEREMONY_S8_DESC_173:0 "最初に明るくなると、数千人の司祭と巡礼者が完成したガートの聖別のために集まり、ランプがきらめく行列を組んで水面に漂います。永続的な石の形を与えられた川の神聖さが、王国を越えて信者を安定させます。\n\n#weak 儀式を完了するために必要な料金を支払います。その結果、驚異の最終的な建物が建ち上がります。#!"
