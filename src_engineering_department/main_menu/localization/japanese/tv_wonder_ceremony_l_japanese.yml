 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_213:0 "#Y 進行中#! — #high エルベ波止場を調査中#!\n#F エルベ川が歯車を積んでも十分な深さで流れている泥だらけの波止場を調査員たちが早足で進みます。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_213:0 "#G 完了#! — #high エルベ波止場を調査中#!\n#F エルベ川が歯車を積んでも十分な深さで流れている泥だらけの波止場を、調査員たちが早足で進みます。#!"
 TV_WONDER_CEREMONY_S2_TITLE_213:0 "[tv_wonder_ceremony|E]：エルベ波止場の測量"
 TV_WONDER_CEREMONY_S2_DESC_213:0 "測量員たちは、エルベ川が歯車を積んでも十分な深さを流れている泥だらけの埠頭をゆっくりと進んでいく。港の管理者たちは係留権をめぐって口論し、事務員たちはリーグの旗を掲げて境界線を張り巡らせます。\n\n#weak 式典を次の段階に進めるために必要な代金を支払います。あるいは、まだ適切な時期ではない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_213:0 "測量士たちは泥だらけのエルベ川沿いに自分たちの権利を主張します。"
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_213:0 "議論を続けさせてください！"
 TV_WONDER_CEREMONY_CARD_ICON_S3_213:0 "@tv_ceremony_building_needs!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_213:0 "#Y 進行中#! — #high バルト産木材とリューベックレンガ#!\n#F バージはバルト海の森林からオーク材とリューベックから窯で焼いたレンガを運び、油を塗った防水シートの下で岸に沿って積み上げます。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_213:0 "#G 完了#! — #high バルト産木材とリューベックレンガ#!\n#F バージはバルト海の森林からオーク材とリューベックから窯で焼いたレンガを運び、油を塗った防水シートの下で岸に沿って積み上げます。#!"
 TV_WONDER_CEREMONY_S3_TITLE_213:0 "[tv_wonder_ceremony|E]：バルト材とリューベックレンガ"
 TV_WONDER_CEREMONY_S3_DESC_213:0 "バージはバルト海の森林からオーク材を運び、リューベックから窯で焼いたレンガを油を塗った防水シートの下で岸に沿って積み上げます。ギルドマスターは店を祝福し、壁が立ち上がる前に商品がすくい取られることはないと誓います。\n\n#weak 儀式を次の段階に進めるために必要な代金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_213:0 "私たちは、壁が立ち上がる前にこれらの木材やレンガを削り取らないことを誓います。"
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_213:0 "船長たちは宣誓を交わさないまま、はしけを待ったままにしておきます。"
 TV_WONDER_CEREMONY_CARD_ICON_S4_213:0 "@tv_ceremony_port!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_213:0 "#Y 進行中#! — #high 最初の杭が打ち込まれます#!\n#F ハンマーの音が鳴り響き、レンガと積荷の重量に耐えるために最初の杭が柔らかい川岸に打ち込まれます。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_213:0 "#G 完了#! — #high 最初の杭が打ち込まれます#!\n#F ハンマーの音が鳴り響き、レンガと積荷の重量に耐えるために最初の杭が柔らかい川岸に打ち込まれます。#!"
 TV_WONDER_CEREMONY_S4_TITLE_213:0 "[tv_wonder_ceremony|E]：最初の杭が打ち込まれます"
 TV_WONDER_CEREMONY_S4_DESC_213:0 "ハンマーの音が鳴り響き、レンガと積荷の重量に耐えるために最初の杭が柔らかい川岸に打ち込まれます。憲章と木材の積み重ねだったものが、今ではエルベ川の泥の中からそびえ立つ建物となります。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合はお待ちください。#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_213:0 "最も壮大なホールでさえ、実際に打ち込まれた一本の杭から始まります。"
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_213:0 "私たちはまだハンマーの音が聞こえる準備ができていません。"
 TV_WONDER_CEREMONY_CARD_ICON_S5_213:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_213:0 "#Y 進行中#! — #high 金庫室が形を整える#!\n#F レンガ造りの金庫が列ごとに頭上を閉じ、ワックスで密封された羊毛、毛皮、塩漬けの魚の俵が冬を越す乾燥倉庫を形成します交差点.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_213:0 "#G 完了#! — #high 金庫室が形を成す#!\n#F レンガ造りの金庫が列ごとに頭上を閉じ、ワックスで密封された羊毛、毛皮、塩漬けの魚の俵が冬を越す乾燥倉庫を形成します交差点.#!"
 TV_WONDER_CEREMONY_S5_TITLE_213:0 "[tv_wonder_ceremony|E]：アーチ型倉庫が形になる"
 TV_WONDER_CEREMONY_S5_DESC_213:0 "レンガ造りの金庫が頭上の列ごとに閉じられ、乾燥した倉庫を形成し、ワックスで密封された羊毛、毛皮、塩漬けの魚の俵が冬の渡渉を待ちます。ハンザ同盟の 3 つの町の石工が、静かな誇りを持って自分たちのアーチを比較します。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_213:0 "石工たちは頭上の金庫室を一列ずつ閉め、自分たちの仕事を誇らしげに盗み見る。"
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_213:0 "金庫室を閉めるのが早すぎると、プライドではなく湿気が閉じ込められます。"
