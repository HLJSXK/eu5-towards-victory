 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_213:0 "#Y 進行中#! — #high 計数室と封印された台帳#!\n#F 倉庫の床の上の計数室には、ハイデスク、鉄製の箱、そしてすべてのベールにマークを付ける鉛のシールが設置されています。リーグ認定。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_213:0 "#G 完了#! — #high 計数室と封印された台帳#!\n#F 倉庫の床の上の計数室には、ハイデスク、鉄で縛られたチェスト、およびすべてのベールにマークを付ける鉛のシールが設置されています。リーグ認定。#!"
 TV_WONDER_CEREMONY_S6_TITLE_213:0 "[tv_wonder_ceremony|E]：計数室と封印台帳"
 TV_WONDER_CEREMONY_S6_DESC_213:0 "倉庫の床の上には、計数室があり、ハイデスク、鉄製の箱、そしてすべてのベールにリーグ認定であることを示す鉛のシールが設置されています。石膏が完全に乾く前に事務員が入ってきます。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_213:0 "私たちはこれらの台帳に封をし、事務員をハイデスクに座らせます。"
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_213:0 "チェストは空のままで、石膏はもう少し乾燥するまで放置されます。"
 TV_WONDER_CEREMONY_CARD_ICON_S7_213:0 "@tv_ceremony_build_icon!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_213:0 "#Y 進行中#! — #high Cクレーンが岸壁に沿って上昇します#!\n#F 木材クレーンが岸壁に沿って直立してウィンチされ、長いアームが 1 回の動作で貨物を船から倉庫まで揺り動かす準備ができています。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_213:0 "#G 完了#! — #high Cクレーンが岸壁に沿って上昇します#!\n#F 木材クレーンは岸壁に沿って直立してウィンチされ、その長いアームは 1 回の動作で貨物を船から倉庫まで揺り動かす準備ができています。#!"
 TV_WONDER_CEREMONY_S7_TITLE_213:0 "[tv_wonder_ceremony|E]：岸壁に沿ってクレーンが上昇"
 TV_WONDER_CEREMONY_S7_DESC_213:0 "木材クレーンは岸壁に沿って直立してウィンチされ、長いアームを使って貨物を船から倉庫まで 1 回の動作で揺り動かす準備ができています。ベルゲンからノヴゴロドまでの船長たちは、リューベックやブルージュと同じようにハンブルクに名前を付け始めました。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_213:0 "港は壁ではなく、決して休まないクレーンによって判断されます。"
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_213:0 "私たちはまだリューベックとブルージュの隣にクレーンを掲げる準備ができていません。"
