 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_172:0 "金色のパネルはホールの外に積み上げられたままで、ドアはまだ警備されていません。"
 TV_WONDER_CEREMONY_CARD_ICON_S8_172:0 "@tv_ceremony_government_power!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_172:0 "#Y 進行中#! — #high 皇帝が着席#!\n#F 貴族、使節、聖職者の集まった宮廷の前で皇帝が完成した玉座に初めて登り、その宝石で飾られた輝きは、目撃者全員に彼の統治の威厳を確認するものでした。それ.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_172:0 "#G 完了#! — #high 皇帝が着席#!\n#F 貴族、使者、聖職者の集まった宮廷の前で皇帝が完成した玉座に初めて登り、その宝石で飾られた輝きは、目撃者全員に彼の統治の威厳を確認するものでした。それ.#!"
 TV_WONDER_CEREMONY_S8_TITLE_172:0 "[tv_wonder_ceremony|E]：天皇陛下が着席"
 TV_WONDER_CEREMONY_S8_DESC_172:0 "皇帝は、集まった貴族、使節、司祭たちの前で完成した玉座に初めて登り、その宝石で飾られた輝きは、それを目撃するすべての人に皇帝の統治の威厳を確認させます。反映された玉座の栄光は、王国上に永久に定着します。\n\n#weak 儀式を完了するために必要な代金を支払います。その結果、驚異の最終的な建物が立ち上がります。#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_172:0 "ふさわしい王があえて座るまで、玉座は空っぽです。"
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_172:0 "私たちはまだ法廷に着席する準備ができていません。"
 TV_WONDER_CEREMONY_CARD_ICON_S1_173:0 "@tv_ceremony_ruler!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_173:0 "#Y 進行中#! — #high A ガンジス川の前で誓いが立てられます#!\n#F A 統治者は夜明けに水辺に立ち、崩れかけた神聖なカシの階段を、一度の統治を超えて石で再建すると誓います。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_173:0 "#G 完了#! — #high A ガンジス川の前で誓いが立てられます#!\n#F A 統治者は夜明けの水辺に立ち、崩れかけた神聖なカシの階段を石で再建し、一度の統治を超えて存続すると誓います。#!"
 TV_WONDER_CEREMONY_S1_TITLE_173:0 "[tv_wonder_ceremony|E]：ガンジス川の前で誓いを立てる"
 TV_WONDER_CEREMONY_S1_DESC_173:0 "支配者は夜明けの水辺に立ち、崩れかけた神聖なカシの階段を石で再建し、一度の統治を超えて存続させることを誓う。すでに近くで沐浴している巡礼者たちは、この誓いをこれからの仕事への良い前兆と受け止めています。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_173:0 "支配者は大声で誓いを語り、その言葉を川の前の石に縛り付けます。"
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_173:0 "まだです。川の前ではもっと慎重に言葉を選びたいと思います。"
 TV_WONDER_CEREMONY_CARD_ICON_S2_173:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_173:0 "#Y 進行中#! — #high 司祭は川岸を祝福します#!\n#F 司祭は祝福を唱えながら選択した岸辺を歩き、各段の階段が水に降りるべき場所を示します。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_173:0 "#G 完了#! — #high 司祭は川岸を祝福します#!\n#F 司祭は祝福を唱えながら選択した岸辺を歩き、各段の階段が水に降りるべき場所を示します。#!"
 TV_WONDER_CEREMONY_S2_TITLE_173:0 "[tv_wonder_ceremony|E]：司祭は川岸を祝福する"
 TV_WONDER_CEREMONY_S2_DESC_173:0 "司祭たちは祝福の言葉を唱えながら、選ばれた堤防の長さを歩き、各段の階段が水面に降りるべき場所に印を付けます。地元の石工は、上流のどの採石場が川の神聖さにふさわしい石を供給できるかについて相談します。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_173:0 "司祭たちは祝福を終え、上流の採石場に知らせを送ります。"
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_173:0 "聖なる川もゆっくりと川岸を刻みます。"
 TV_WONDER_CEREMONY_CARD_ICON_S3_173:0 "@tv_ceremony_river!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_173:0 "#Y 進行中#! — #high 石をいかだで川を下ります#!\n#F 切り出した石を積んだいかだは、採石場とガーツ山脈の間の流れをすべて知っている船頭の先導で、カシに向かって川下を流れます。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_173:0 "#G 完了#! — #high 石はいかだで川を下ります#!\n#F 切り出した石を積んだいかだは、採石場とガーツ山脈の間の流れをすべて知っている船頭の導きで、カシに向かって川下を流れます。#!"
 TV_WONDER_CEREMONY_S3_TITLE_173:0 "[tv_wonder_ceremony|E]：石が川にいかだで流される"
 TV_WONDER_CEREMONY_S3_DESC_173:0 "切り出した石を積んだいかだは、採石場とガートの間の流れをすべて知っている船頭の先導で、カシに向かって川下に流れていきます。労働者は銀行に集まり、次のいかだの到着前に各いかだを降ろします。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_173:0 "私は命令を出します。流れが変わる前にいかだをキャストしてください。"
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_173:0 "船頭たちは採石場の船着場でいかだをしばらく保持します。"
 TV_WONDER_CEREMONY_CARD_ICON_S4_173:0 "@tv_ceremony_paved_road!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_173:0 "#Y 進行中#! — #high 最初の一歩は水に出会う#!\n#F 石工たちは最初の石段を水線に直接設置しました。計画では砂に線を刻んだだけだったところから、建築の本当の仕事が始まりました。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_173:0 "#G 完成#! — #high 最初の一歩は水に出会う#!\n#F 石工たちは最初の石段を水線に直接設置しました。計画では砂に線を刻むだけだったところから、建築の本当の仕事が始まりました。#!"
