 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_134:0 "#Y 進行中#! — #high 最初の種まきの儀式が執り行われます#!\n#F 司祭と農民が山の新しい土壌に押し込まれた最初のトウモロコシの粒を祝福するために最も高いテラスに集まります。上にある王城は、季節限定の裸岩だった斜面を見下ろしています。前.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_134:0 "#G 完了#! — #high 最初の種まきの儀式が執り行われます#!\n#F 司祭と農民が山の新しい土壌に押し込まれた最初のトウモロコシの粒を祝福するために最も高いテラスに集まります。上にある王城は、季節限定の裸岩だった斜面を見下ろしています。前.#!"
 TV_WONDER_CEREMONY_S8_TITLE_134:0 "[tv_wonder_ceremony|E]：初種まきの儀式が行われる"
 TV_WONDER_CEREMONY_S8_DESC_134:0 "司祭と農民は山の新しい土壌に押し込まれた最初のトウモロコシの粒を祝福するために最も高いテラスに集まり、頭上にある王城の城塞は、ほんの数シーズン前まで岩が露出していた斜面を見下ろしています。テラスは現在、山の集落に永続的に栄養を与え、アンデスの最も急な斜面を帝国で最も信頼できる農地の一部に変えています。\n\n#weak 儀式を完了するために必要な代金を支払います。その結果、驚異の最終的な建物が建ち上がります。#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_134:0 "城塞が静かに見守る中、司祭たちは祝福された最初の穀粒を新しい土に押し込みます。"
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_134:0 "司祭たちには待ってもらいます。山の最初の収穫は別の季節に祝福されるかもしれません。"
