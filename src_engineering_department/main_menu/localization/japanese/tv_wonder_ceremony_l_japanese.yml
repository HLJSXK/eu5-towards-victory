 TV_WONDER_CEREMONY_S8_DESC_175:0 "夜明けの最初の光がその彫刻された車輪に当たる中、司祭たちは完成した戦車神殿を奉献し、集まった法廷と地域中から集まった巡礼者の前でダンサーがパフォーマンスを披露する。太陽神の祝福は、海岸の石に固定され、王国全体を着実に照らしています。\n\n#weak 儀式を完了するために必要な代金を支払います — その結果、驚異の最終的な建物が建ち上がります。#!"
