 TV_WONDER_CEREMONY_S4_DESC_123:0 "現在、バスケットに積んだ土がモンクス マウンド自体の目に見える新しいテラスに上昇しており、プラットフォームが最終的な高さに達したときに頂上寺院のフレームが立つ位置に木の柱がマークされています。集められ儀式が行われていたものが、目に見えて空に向かって何層にも積み上げられた土となります。\n\n#weak 儀式を次の段階に進めるために必要な代金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
