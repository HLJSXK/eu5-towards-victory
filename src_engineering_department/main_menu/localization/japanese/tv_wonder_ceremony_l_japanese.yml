 TV_WONDER_CEREMONY_S3_DESC_114:0 "サン ピエトロ ディ カステッロの司祭たちは、ガレー船 100 隻に送られる予定の麻のコイルに聖水を振りかけながら、新しいタナという大ロープウォークを歩きます。マスターロープメーカーは遺物の前でギルドの古代の誓いを立てます。\n\n#weak 儀式を次の段階に進めるために必要な代金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
