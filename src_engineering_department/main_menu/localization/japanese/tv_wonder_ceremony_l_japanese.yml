 TV_WONDER_CEREMONY_S6_DESC_187:0 "マドラサの中庭を取り囲むように 2 階建てのアーチ型天井のフジュラ独房の列があり、それぞれの独房には、天文学、神学、法律を長年学んできた学生とその著書が収容されることになっていました。まだ完成していないホールに石膏の粉が漂う中、最初の学者たちが到着します。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
