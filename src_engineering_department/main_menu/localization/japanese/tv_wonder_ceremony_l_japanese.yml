 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_166:0 "#Y 進行中#! — #high 橋とホスピスが計画されています#!\n#F 修道会と地元のギルドは、増水した川に橋を架けるための石や木材、そして疲れた人々を守るためのホスピスを約束しています。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_166:0 "#G 完了#! — #high 橋とホスピスが計画されています#!\n#F 修道会と地元のギルドは、増水した川に架かる橋と疲れた人々を守るホスピスの石と木材を提供することを約束しています。#!"
 TV_WONDER_CEREMONY_S3_TITLE_166:0 "[tv_wonder_ceremony|E]：ブリッジとホスピスが計画されています"
 TV_WONDER_CEREMONY_S3_DESC_166:0 "修道院と地元のギルドは、増水した川に架かる橋や、疲れた人々を守るホスピスに石や木材を提供することを約束している。石工は、雨が止み次第作業を開始する契約を結んでいます。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_166:0 "命令は石と木材を質入れし、石工たちは契約を結んだ。"
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_166:0 "ギルドは誓約を保留し、石工たちはさらに1シーズン何もせずに待機します。"
