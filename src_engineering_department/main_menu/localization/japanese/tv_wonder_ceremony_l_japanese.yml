 TV_WONDER_CEREMONY_S1_TITLE_187:0 "[tv_wonder_ceremony|E]：統治者は学びの広場を宣言する"
 TV_WONDER_CEREMONY_S1_DESC_187:0 "サマルカンドの統治者は、古い隊商の交差点の前にある砂浜を、ヘラートからデリーまでのどの宮廷にも勝るマドラサで囲まれた、街の名声にふさわしいレギスタンとなることを布告した。その素晴らしさを計画するために、天文学者、タイルマスター、宰相が呼び出されます。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
