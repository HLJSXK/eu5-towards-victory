 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_174:0 "#G 完了#! — #high シヴァ神へのチョーラ王の誓い#!\n#F ラジャ・ラージャ・チョーラは宮廷の前に立ち、祖先が建てたどの神殿よりも偉大なシヴァ神殿を建て、その塔は何マイルも離れたところからも見えるようにすると誓います。#!"
 TV_WONDER_CEREMONY_S1_TITLE_174:0 "[tv_wonder_ceremony|E]：チョーラ王のシヴァへの誓い"
 TV_WONDER_CEREMONY_S1_DESC_174:0 "ラージャ・ラジャ・チョーラは宮廷の前に立ち、祖先が建てたどの寺院よりも偉大なシヴァ神殿を建て、その塔は何マイルも離れたところからも見えるようにすると誓う。閣僚は直ちに、その資金となる土地補助金の草案を作成し始めます。\n\n#weak 式典を次の段階に進めるために必要な代金を支払います。あるいは、まだ適切な時期ではない場合は待ちます。#!"
