 TV_WONDER_CEREMONY_S2_DESC_107:0 "司祭たちは尾根に登り、アプスや周囲の山々の精霊に相談し、太陽のインティを祀る神殿が夏至の日の出に直面する場所に印を付けます。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、その瞬間がまだ適切でない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_107:0 "僧侶たちは山の霊たちに質問するために登っていきます。"
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_107:0 "まだです — アプスは答えていません!"
