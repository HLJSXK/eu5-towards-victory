 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_135:0 "#G 完了#! — #high 木材と麻が港に呼び寄せられます#!\n#F 王立森林からのオーク材と内陸のロープウォークからの麻の輸送船団が港に到着し、ドックが掘られる前にヤードに積み込みます。一方、石工は作業を始めます。乾ドックの壁用の石の採石。#!"
 TV_WONDER_CEREMONY_S2_TITLE_135:0 "[tv_wonder_ceremony|E]：木材と麻が港に呼び出されます"
 TV_WONDER_CEREMONY_S2_DESC_135:0 "王立森林からのオーク材と内陸のロープウォークからの麻の輸送船団が港に到着し、ドックが 1 つ掘られる前にヤードに積み込みます。石工たちは乾ドックの壁用の石の切り出しを始めます。海軍事務官は、すべての板とコイルを追跡するための最初の台帳を設定しました。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_135:0 "帳簿が営業を開始すると、木材と麻の輸送船団が港に到着します。"
