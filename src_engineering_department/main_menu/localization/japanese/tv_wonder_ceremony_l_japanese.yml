 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_223:0 "#Y 進行中#! — #high オバは完成した城壁を聖別する#!\n#F オバは大行列で完成した城壁を一周し、青銅鋳物師や酋長も同様にベナンの権力が確保されたことを宣言する世代.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_223:0 "#G 完了#! — #high オバは完成した城壁を聖別する#!\n#F オバは大行列で完成した城壁を一周し、青銅鋳物師や酋長も同様にベナンの権力が確保されたことを宣言した。世代.#!"
 TV_WONDER_CEREMONY_S8_TITLE_223:0 "[tv_wonder_ceremony|E]：大庭は完成した壁を聖別する"
 TV_WONDER_CEREMONY_S8_DESC_223:0 "オバは完成した城壁を大行列で一周し、青銅の鋳物師や酋長たちは同様に、何世代にもわたって確保されてきたベナンの権力を宣言します。首都の防御は今、王国の強さの永続的な証として立っており、それは王国中のすべての守備隊に感じられました。\n\n#weak 儀式を完了するために必要な代金を支払います — 結果として、驚異の最終的な建物が完成します。#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_223:0 "オバは一周を走り、すべての守備隊が壁の新たな強さを感じます。"
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_223:0 "壁が本当に宣言される準備が整うまで、行列を遅らせます。"
