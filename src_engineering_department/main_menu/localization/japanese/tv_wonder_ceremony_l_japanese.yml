 TV_WONDER_CEREMONY_CARD_ICON_S4_132:0 "@tv_ceremony_food_suitability!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_132:0 "#Y 進行中#! — #high 貯水池の底地のために土が切り開かれている#!\n#F 労働者たちはついに平原自体に切り込み、貯水池の盆地を掘り、一方で他の人たちは周囲にそびえ立つ長い土の堤防を詰めて踏み固めた。それ.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_132:0 "#G 完了#! — #high 貯水池の底地のために土が切り取られる#!\n#F 労働者たちはついに平原そのものに切り込み、貯水池の盆地を掘り、一方で他の人たちは周囲にそびえる長い土の堤防を詰めて踏み固めた。それ.#!"
 TV_WONDER_CEREMONY_S4_TITLE_132:0 "[tv_wonder_ceremony|E]：貯水池の底のために地球が切り取られています"
 TV_WONDER_CEREMONY_S4_DESC_132:0 "労働者たちは最終的に平原そのものに切り込み、貯水池の盆地を掘り、一方で他の労働者たちはその周囲にそそり立つ長い土の堤防を詰めて踏み固めた。杭打ちされた地面は、今では生々しい赤い土の広がる盆地となります。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_132:0 "私たちは土を切るよう命じます。エンジニアの手の下で洗面器の形を整えてください。"
