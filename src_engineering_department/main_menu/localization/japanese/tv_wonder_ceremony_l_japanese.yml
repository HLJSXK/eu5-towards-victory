 TV_WONDER_CEREMONY_CARD_ICON_S3_221:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_221:0 "#Y 進行中#! — #high 土の中庭を祝福#!\n#F イマムたちは新しいマドラサに選ばれた日干しレンガの中庭を祝福し、棟梁はわらと粘土を混ぜて砂漠の熱を防ぐ壁を作りました。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_221:0 "#G 完了#! — #high 土の中庭を祝福#!\n#F イマムたちは新しいマドラサに選ばれた日干しレンガの中庭を祝福し、棟梁は砂漠の熱を防ぐ壁として藁と粘土を混ぜ合わせました。#!"
