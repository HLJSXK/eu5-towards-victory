 TV_WONDER_CEREMONY_S7_DESC_175:0 "寺院のそびえ立つドゥル塔は完成に近づき、その上部コースはすでに遠く離れた海上から海岸沿いのヤシの木の上にそびえ立つ塔を見ることができ、旅行者たちの息を呑んでいます。ダンサーたちは奉献の最終リハーサルを開始します。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、その瞬間がまだ適切でない場合は待ちます。#!"
