 TV_WONDER_CEREMONY_S3_DESC_187:0 "学識あるイマームや天文学者らは、地域の地震に備えて入り口を固定するために労働者が深く掘り始める中、聖句を唱えながらそびえ立つ入り口の入り口の基礎を祝福した。通過するキャラバンは、新しい広場に向かってタイル、木材、またはコインの通行料を要求されます。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
