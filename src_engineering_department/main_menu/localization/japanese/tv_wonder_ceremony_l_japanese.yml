 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_171:0 "#Y 進行中#! — #high 委員会の裁判所が招集#!\n#F 委員会の裁判所は、ベンチャーの事務、船舶の取り付け、および海外要因に関する指示の草案作成などの最初の業務を管理するために、主要加入者の中から選出されます。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_171:0 "#G 完了#! — #high 委員会の裁判所が招集されます#!\n#F 委員会の裁判所は、ベンチャーの事務、船舶の取り付け、および海外要因に関する指示の草案作成などの最初の業務を管理するために、主要加入者の中から選出されます。#!"
 TV_WONDER_CEREMONY_S2_TITLE_171:0 "[tv_wonder_ceremony|E]：委員会法廷が招集される"
 TV_WONDER_CEREMONY_S2_DESC_171:0 "主要な加入者の中から委員会が選出され、事業の業務、船舶の艤装や海外要因に関する指示書の作成などの最初の業務を管理します。帳簿を正確に保つために、事務員が十数名雇われています。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングではない場合は待ちます。#!"
