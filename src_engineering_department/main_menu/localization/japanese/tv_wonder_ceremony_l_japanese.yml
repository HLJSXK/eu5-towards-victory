 TV_WONDER_CEREMONY_S8_DESC_153:0 "教皇は集まったシニョーリアとギルドの前でサンタ・マリア・デル・フィオーレを聖別し、ブルネレスキのドームはローマの古代以来キリスト教世界で取り上げられた最大の作品であると宣言された。この日以来、大聖堂の栄光はフィレンツェの芸術と学問を加速させ、その名を聞くすべての法廷で誇りを持ってその名が語られます。\n\n#weak 式典を完了するために必要な料金を支払います。その結果、驚異の最終的な建物が建ち上がります。#!"
