 TV_WONDER_CEREMONY_S2_DESC_184:0 "イエズス会の父親たちは、聖ヨハネ教会の横にある古い大学の敷地を確保し、近隣のブルガーハウスを買い取って講義室と適切な中庭のためのスペースを確保しました。ビリニュス周辺の田園地帯から石灰石と木材を積んだ荷車が到着し始めます。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
