 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_183:0 "#G 完了#! — #high 土地所有権を県に請願する#!\n#F 地域の長老たちは地元の県に請願し、旧市街の境界石を越えて拡張する権利に対する慣習的な手数料を支払う。この微妙な交渉は、特権の門のたびに繰り返される。 Commonwealth.#!"
