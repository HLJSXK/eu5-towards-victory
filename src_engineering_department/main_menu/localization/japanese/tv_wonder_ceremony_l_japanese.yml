 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_209:0 "#Y 進行中#! — #high シャルルマーニュが礼拝堂を宣言#!\n#F フランク王は、アーヘンの暖かい泉にある宮廷の横に、彼の信仰と帝国の両方を称えるのにふさわしいパラティーノ礼拝堂を建てると宣言しました。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_209:0 "#G 完了#! — #high シャルルマーニュが礼拝堂を宣言#!\n#F フランク王は、アーヘンの暖かい泉にある宮廷の横に、彼の信仰と帝国の両方を称えるのにふさわしいパラティーノ礼拝堂を建てると宣言しました。#!"
