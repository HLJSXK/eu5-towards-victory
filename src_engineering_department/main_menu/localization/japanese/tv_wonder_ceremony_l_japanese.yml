 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_215:0 "#Y 進行中#! — #high 選帝侯がギャラリーの設置を決定#!\n#F ザクセン州の法廷は、エルベ川のそばに選帝侯の増え続ける絵画、磁器、珍品を保管するための新しいギャラリーを設置することを宣言しました。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_215:0 "#G 完了#! — #high 選帝侯がギャラリーの設置を布告#!\n#F ザクセン州の法廷は、エルベ川のそばに選帝侯の増え続ける絵画、磁器、珍品を保管するための新しいギャラリーを設置することを宣言しました。#!"
