 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_215:0 "#G 完了#! — #high ギャラリーが法廷に開かれます#!\n#F ギャラリーは選挙人自身の手で扉を開き、絵画、磁器、彫刻がついに法廷と訪問高官のために手配されました。#!"
 TV_WONDER_CEREMONY_S8_TITLE_215:0 "[tv_wonder_ceremony|E]：ギャラリーが法廷に開かれます"
 TV_WONDER_CEREMONY_S8_DESC_215:0 "ギャラリーは選挙人自身の手で扉を開き、絵画、磁器、彫刻がついに宮廷や訪問した高官のために同様に整えられました。今や王国中の芸術家たちがドレスデンを南部の大宮廷と同じように語り、外国からの訪問者がコレクションに驚嘆するたびに王室の威信が高まっています。\n\n#weak 式典を完了するために必要な料金を支払います。その結果、驚異の最終的な建物が完成します。#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_215:0 "選帝侯は集まった法廷に向かってギャラリーのドアを勢いよく開ける。"
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_215:0 "もう少しドアを閉めたままにしておきます！"
 TV_WONDER_CEREMONY_CARD_ICON_S1_216:0 "@tv_ceremony_government!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_216:0 "#Y 進行中#! — #high 公爵は王立醸造所の設置を宣言#!\n#F バイエルン公爵はミュンヘンの渇きに応え、さらに公国の財務を満たすために王立醸造所の設置を宣言しました。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_216:0 "#G 完了#! — #high 公爵は王立醸造所の設置を宣言#!\n#F バイエルン公爵はミュンヘンの渇きに応え、さらに公爵の国庫を満たすために王立醸造所の設置を宣言しました。#!"
 TV_WONDER_CEREMONY_S1_TITLE_216:0 "[tv_wonder_ceremony|E]：公爵、王立醸造所の設置を布告"
 TV_WONDER_CEREMONY_S1_DESC_216:0 "バイエルン公は、ミュンヘンの喉の渇きに応え、公庫をさらに満たすために王室の醸造所を設立することを宣言しました。樽職人と醸造責任者が中庭でジョッキを上げてから、1 つのやかんが吊り下げられます。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_216:0 "公爵は憲章に署名し、ミュンヘンの新しい醸造所のために金庫を空にします。"
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_216:0 "急いで淹れたビールは、抽出する前に酸っぱくなります。"
 TV_WONDER_CEREMONY_CARD_ICON_S2_216:0 "@tv_ceremony_food!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_216:0 "#Y 進行中#! — #high モルト倉庫の安全を確保#!\n#F 公爵当局は、周囲の農場から大麦とホップを徴発し、来たる醸造シーズンに備えて乾燥したロフトに保管しています。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_216:0 "#G 完了#! — #high モルト倉庫の安全確保#!\n#F 公爵当局は、周囲の農場から大麦とホップを徴発し、来たる醸造シーズンに備えて乾燥したロフトに保管しています。#!"
 TV_WONDER_CEREMONY_S2_TITLE_216:0 "[tv_wonder_ceremony|E]：モルト店舗の確保"
 TV_WONDER_CEREMONY_S2_DESC_216:0 "公爵の役人は周囲の農場から大麦とホップを徴発し、来たる醸造シーズンに備えて乾燥した屋根裏部屋に保管します。ギルドの醸造責任者は、封印される前にすべての袋を検査します。\n\n#weak 儀式を次の段階に進めるために必要な代金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_216:0 "私たちは、農場が余らせなければならない大麦とホップを徴発します。"
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_216:0 "当局はロフトをさらに1シーズン空のままにしておく。"
 TV_WONDER_CEREMONY_CARD_ICON_S3_216:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_216:0 "#Y 進行中#! — #high 銅製のやかんを祝福する#!\n#F C銅細工師が最初の偉大な醸造用やかんを届け、公国の船に奉仕する船の慣習であるように、火をつける前に宮廷牧師が彼らを祝福します。テーブル.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_216:0 "#G 完了#! — #high 銅製のやかんを祝福する#!\n#F C銅細工師が最初の偉大な醸造用やかんを届け、公国の船に奉仕する船の慣習であるように、火をつける前に宮廷牧師が彼らを祝福します。テーブル.#!"
 TV_WONDER_CEREMONY_S3_TITLE_216:0 "[tv_wonder_ceremony|E]：銅の釜に祝福を"
 TV_WONDER_CEREMONY_S3_DESC_216:0 "銅細工師が最初の偉大な醸造釜を届け、公国の食卓に供される容器の慣習であるように、火が点ける前に宮廷牧師が釜を祝福します。樽製造者は、ビールを街の隅々まで運ぶための樽の成形を開始します。\n\n#weak 式典を次の段階に進めるために必要な代金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_216:0 "牧師はやかんに聖水を振りかけ、最初の火をつけます。"
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_216:0 "私は祝福されずにこれらの火を灯すつもりはありません。"
 TV_WONDER_CEREMONY_CARD_ICON_S4_216:0 "@tv_ceremony_employees!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_216:0 "#Y 進行中#! — #high 醸造所の壁がそびえ立つ#!\n#F 石工たちは、バイエルンの冬を通してやかんの火の熱を保つのに十分な厚さの醸造所の壁の最初のコースを中庭の周りに敷きました。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_216:0 "#G 完成#! — #high 醸造所の壁がそびえ立つ#!\n#F 石工たちは、バイエルンの冬の間、やかんの火の熱を保つのに十分な厚さの醸造所の壁の最初のコースを中庭の周囲に敷きました。#!"
 TV_WONDER_CEREMONY_S4_TITLE_216:0 "[tv_wonder_ceremony|E]：醸造所の壁がそびえ立つ"
 TV_WONDER_CEREMONY_S4_DESC_216:0 "石工たちは、中庭の周りに醸造所の壁の最初のコースを敷きました。その厚さは、バイエルンの冬を通して釜の火の熱を保つのに十分な厚さでした。法令やモルト袋として始まったものは、今では実用的なホールの形になりました。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_216:0 "石工たちは中庭の周りにコースごとに厚い壁を築き上げます。"
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_216:0 "急いで建てた壁は冷気も恥辱も遮断する。"
 TV_WONDER_CEREMONY_CARD_ICON_S5_216:0 "@tv_ceremony_production_method!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_216:0 "#Y 進行中#! — #high やかんが吊るされています#!\n#F 銅製の大きなやかんが囲炉裏に引き上げられ、最初のテスト醸造がホールに麦芽とホップの香りで満たされます。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_216:0 "#G 完了#! — #high やかんが吊るされています#!\n#F 銅製の大きなやかんが囲炉裏に引き上げられ、最初のテスト醸造がホールに麦芽とホップの香りで満たされます。#!"
 TV_WONDER_CEREMONY_S5_TITLE_216:0 "[tv_wonder_ceremony|E]：やかんが吊り下げられています"
 TV_WONDER_CEREMONY_S5_DESC_216:0 "大きな銅製のやかんが囲炉裏の上に持ち上げられ、最初のテストビールがホールに麦芽とホップの香りで満たされます。ギルド職員も公爵職員も同様に、最初の慎重なサンプルを味わうために集まります。\n\n#weak 儀式を次の段階に進めるために必要な代金を支払います。または、まだ適切なタイミングではない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_216:0 "釜を囲炉裏に上げ、一番煎りを自分たちで味わいます。"
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_216:0 "囲炉裏は冷たく立っており、やかんはまだ地面に置かれています。"
 TV_WONDER_CEREMONY_CARD_ICON_S6_216:0 "@tv_ceremony_supply!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_216:0 "#Y 進行中#! — #high Cセラーは地下深くまで掘られています#!\n#F 労働者は醸造所の地下深くに涼しいセラーを掘削しており、そこでは夏の間、熱に影響されずにビールがラガー化されます。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_216:0 "#G 完了#! — #high Cセラーは地下深くまで掘られています#!\n#F L労働者は醸造所の地下深くに涼しいセラーを掘削しており、そこでは夏の間、熱に影響されずにビールがラガー化されます。#!"
 TV_WONDER_CEREMONY_S6_TITLE_216:0 "[tv_wonder_ceremony|E]：地下深くまで切り取られたセラー"
 TV_WONDER_CEREMONY_S6_DESC_216:0 "労働者は醸造所の地下深くに涼しいセラーを切り開き、そこでビールは夏の間、熱に影響されずにラガーリングされます。当局は、樽が暗闇に転がされるときに、各樽に公爵の印を押します。\n\n#weak 式典を次の段階に進めるために必要な代金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_216:0 "労働者はセラーを深く切り込み、各樽に公爵マークをシールします。"
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_216:0 "ビールはもう少し地上で待ってほしい。"
 TV_WONDER_CEREMONY_CARD_ICON_S7_216:0 "@tv_ceremony_satisfaction_happy!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_216:0 "#Y 進行中#! — #high ビアホールの中庭がオープン#!\n#F ビール醸造所が初の一般テイスティングのために庭を街に開放すると、長いテーブルと日よけが中庭を埋め尽くします。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_216:0 "#G 完了#! — #high ビアホールの中庭がオープン#!\n#F ビール醸造所が初の公開試飲のために庭を街に開放すると、長いテーブルと日よけが中庭を埋め尽くします。#!"
 TV_WONDER_CEREMONY_S7_TITLE_216:0 "[tv_wonder_ceremony|E]：ビアホールの中庭がオープン"
 TV_WONDER_CEREMONY_S7_DESC_216:0 "この醸造所が初の一般公開テイスティングのために庭を街に開放する中、中庭には長いテーブルと日よけが設置されています。最後のテーブルが空になる前に、樽を積んだワゴンが門を通ってバイエルン中の居酒屋に向かって走り出します。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_216:0 "門が開き、中庭はテーブルや日よけ、そして喉の渇いた群衆で埋め尽くされます。"
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_216:0 "門はもう少し閉ざされたままで、樽は地下室で待機します。"
 TV_WONDER_CEREMONY_CARD_ICON_S8_216:0 "@tv_ceremony_building_open!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_216:0 "#Y 進行中#! — #high 王立醸造所がオープンを宣言#!\n#F 王立醸造所の永久オープンが宣言され、公爵自らが最初の公式樽をタップし、そのやかん、セラー、樽は現在ミュンヘンの常設となっている経済.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_216:0 "#G 完了#! — #high 王立醸造所がオープンを宣言#!\n#F 王立醸造所の永久オープンが宣言され、公爵自らが最初の公式樽をタップし、その釜、セラー、樽は現在ミュンヘンの常設となっている経済.#!"
 TV_WONDER_CEREMONY_S8_TITLE_216:0 "[tv_wonder_ceremony|E]：王立醸造所のオープンが宣言される"
 TV_WONDER_CEREMONY_S8_DESC_216:0 "王立醸造所の永久オープンが宣言される中、公爵自らが最初の公式樽をタップし、その釜、地下室、樽製造機は今やミュンヘン経済の恒久的な設備となっている。バイエルン州独自の醸造所が背後にあることを知って、王国全体の生産が少し安定しました。\n\n#weak 式典を完了するために必要な代金を支払います。その結果、驚異の最終的な建物が建ち上がります。#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_216:0 "私たちは最初の公式樽をタップし、この醸造所が永久にオープンすることを宣言します。"
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_216:0 "公爵は最初の樽を未開封のまま放置し、その宣言は口に出さなかった。"
 TV_WONDER_CEREMONY_CARD_ICON_S1_217:0 "@tv_ceremony_law!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_217:0 "#Y 進行中#! — #high 選帝侯が憲章を認可#!\n#F プファルツ選帝侯が、パリとボローニャを同様にモデルにしたネッカー川の上の丘に新しい大学の設立憲章を認可しました。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_217:0 "#G 完了#! — #high 選帝侯が憲章を認可#!\n#F プファルツ選帝侯が、パリとボローニャを同様にモデルにしたネッカー川の上の丘に新しい大学の設立憲章を認可しました。#!"
 TV_WONDER_CEREMONY_S1_TITLE_217:0 "[tv_wonder_ceremony|E]：選挙人が憲章を付与"
 TV_WONDER_CEREMONY_S1_DESC_217:0 "パラティーノ選帝侯は、パリとボローニャを同様にモデルにして、ネッカー川の上の丘に新しい大学の設立憲章を認可しました。最初の講堂に屋根ができる前に、帝国全土から学者が招待されます。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_217:0 "ついにチャーター！"
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_217:0 "選挙人はもう少しの間、印章を保留する。"
 TV_WONDER_CEREMONY_CARD_ICON_S2_217:0 "@tv_ceremony_characters!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_217:0 "#Y 進行中#! — #high 最初のマスターの召喚#!\n#F 使者は神学、法律、芸術のマスターを召喚するために馬に乗り、城の丘の近くに給料と宿泊施設を提供します。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_217:0 "#G Completed#! — #high Summoning the First Masters#!\n#F Envoys ride out to summon masters of theology, law, and the arts, offering stipends and lodging near the castle hill.#!"
 TV_WONDER_CEREMONY_S2_TITLE_217:0 "[tv_wonder_ceremony|E]：Summoning the First Masters"
 TV_WONDER_CEREMONY_S2_DESC_217:0 "使者は神学、法律、芸術の達人を呼び出すために馬に乗って出向き、城の丘の近くに奨学金と宿泊施設を提供します。 The first arrivals debate curriculum long before there are desks to sit at.\n\n#weak Pay the required price to advance the ceremony to its next stage — or wait if the moment is not yet right.#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_217:0 "Envoys ride forth with purses full of stipends."
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_217:0 "後は、もしかしたら！"
 TV_WONDER_CEREMONY_CARD_ICON_S3_217:0 "@tv_ceremony_religion!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_217:0 "#Y In progress#! — #high Consecrating the Lecture Grounds#!\n#F A papal bull and a bishop's blessing consecrate the plot chosen for the university's halls, formally binding it to the wider community of Christian learning.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_217:0 "#G Completed#! — #high Consecrating the Lecture Grounds#!\n#F A papal bull and a bishop's blessing consecrate the plot chosen for the university's halls, formally binding it to the wider community of Christian learning.#!"
 TV_WONDER_CEREMONY_S3_TITLE_217:0 "[tv_wonder_ceremony|E]：Consecrating the Lecture Grounds"
 TV_WONDER_CEREMONY_S3_DESC_217:0 "A papal bull and a bishop's blessing consecrate the plot chosen for the university's halls, formally binding it to the wider community of Christian learning. Masons mark out the arcades where students will one day gather between lectures.\n\n#weak Pay the required price to advance the ceremony to its next stage — or wait if the moment is not yet right.#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_217:0 "司教と教皇雄牛は一緒に地面を聖別します。"
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_217:0 "The bishop postpones the consecration rite."
 TV_WONDER_CEREMONY_CARD_ICON_S4_217:0 "@tv_ceremony_build_icon!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_217:0 "#Y In progress#! — #high The Lecture Halls Begin to Rise#!\n#F Stonemasons break ground below the castle hill, and the university's first true walls rise where charters and blessings once stood alone.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_217:0 "#G Completed#! — #high The Lecture Halls Begin to Rise#!\n#F Stonemasons break ground below the castle hill, and the university's first true walls rise where charters and blessings once stood alone.#!"
 TV_WONDER_CEREMONY_S4_TITLE_217:0 "[tv_wonder_ceremony|E]：The Lecture Halls Begin to Rise"
 TV_WONDER_CEREMONY_S4_DESC_217:0 "石工が城の丘の下で起工し、かつて憲章と祝福が孤立していた場所に大学の最初の真の壁が立ち上がる。 Scholars watch from a respectful distance as scaffolding climbs around the foundation stones.\n\n#weak Pay the required price to advance the ceremony to its next stage — or wait if the moment is not yet right.#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_217:0 "壁を立ち上げましょう！"
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_217:0 "石工たちはとりあえず道具を置いた。"
 TV_WONDER_CEREMONY_CARD_ICON_S5_217:0 "@tv_ceremony_literacy!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_217:0 "#Y In progress#! — #high The Library Vaults Are Sealed#!\n#F Stone vaults close over the library chamber, built thick enough to guard manuscripts against damp and fire alike.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_217:0 "#G Completed#! — #high The Library Vaults Are Sealed#!\n#F Stone vaults close over the library chamber, built thick enough to guard manuscripts against damp and fire alike.#!"
 TV_WONDER_CEREMONY_S5_TITLE_217:0 "[tv_wonder_ceremony|E]：The Library Vaults Are Sealed"
 TV_WONDER_CEREMONY_S5_DESC_217:0 "石造りの金庫室は図書室を覆い、湿気や火から原稿を守るのに十分な厚みを持って建てられています。 The first chained books arrive from Mainz and Basel before the shelving is even finished.\n\n#weak Pay the required price to advance the ceremony to its next stage — or wait if the moment is not yet right.#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_217:0 "石工たちは本が湿って届く前に金庫に封をします。"
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_217:0 "Not yet, the shelves aren't ready!"
 TV_WONDER_CEREMONY_CARD_ICON_S6_217:0 "@tv_ceremony_building!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_217:0 "#Y In progress#! — #high Arcades and Disputation Halls#!\n#F Arcades are raised around the courtyard where students will pace between lectures, and a great hall is fitted for the public disputations that will make Heidelberg's name.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_217:0 "#G Completed#! — #high Arcades and Disputation Halls#!\n#F Arcades are raised around the courtyard where students will pace between lectures, and a great hall is fitted for the public disputations that will make Heidelberg's name.#!"
 TV_WONDER_CEREMONY_S6_TITLE_217:0 "[tv_wonder_ceremony|E]：Arcades and Disputation Halls"
 TV_WONDER_CEREMONY_S6_DESC_217:0 "中庭の周囲にはアーケードが設けられており、学生たちは講義の合間にそこで歩き回ることができ、大ホールはハイデルベルクの名を世に知らしめることになる公の議論のために備え付けられています。地元の住民は増加する学生に部屋を借り始めます。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_217:0 "私たちはこれから来る学者のためにこれらのアーケードを設立します。"
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_217:0 "住民たちは部屋を借りるためにもう少し待ちます。"
 TV_WONDER_CEREMONY_CARD_ICON_S7_217:0 "@tv_ceremony_organization!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_217:0 "#Y 進行中#! — #high 学部が席に着きます#!\n#F 神学、法、医学、芸術の各学部は、それぞれ指定された翼、ローブ、印章を身に着け、研究室を区別しています。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_217:0 "#G 完了#! — #high 学部が席に着きます#!\n#F 神学、法、医学、芸術の各学部は、それぞれ指定された翼、ローブ、印章を身に着け、研究室を区別しています。#!"
 TV_WONDER_CEREMONY_S7_TITLE_217:0 "[tv_wonder_ceremony|E]：教員が着席します"
 TV_WONDER_CEREMONY_S7_DESC_217:0 "神学、法学、医学、芸術の各学部は、それぞれ指定された翼、ローブ、印章を身に着けており、ある研究室と他の研究室を区別しています。眼下のネッカー渓谷は学生や書店員の往来でざわめきます。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切な時期ではない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_217:0 "教員の皆さん、着席してください！"
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_217:0 "まだ学部を配置する準備ができていません。"
 TV_WONDER_CEREMONY_CARD_ICON_S8_217:0 "@tv_ceremony_advance!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_217:0 "#Y 進行中#! — #high 大学が正式に発足#!\n#F 選挙人が大学の正式な発足を主宰し、帝国全土から集まった学者が席に着くと、アーケードの下で憲章が読み上げられます。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_217:0 "#G 完了#! — #high 大学が正式に発足#!\n#F 選挙人が大学の正式な発足を主宰し、帝国全土から集まった学者が席に着くと、アーケードの下で憲章が読み上げられます。#!"
 TV_WONDER_CEREMONY_S8_TITLE_217:0 "[tv_wonder_ceremony|E]：大学が正式に発足"
 TV_WONDER_CEREMONY_S8_DESC_217:0 "選挙人は大学の正式な発足式を主宰し、帝国全土から集まった学者が席に着くと、アーケードの下で憲章が読み上げられる。ハイデルベルクの名前はすべての卒業生とともに伝わり、領域全体の学習が少し早く進みます。\n\n#weak 式典を完了するために必要な料金を支払います。その結果、驚異の最終的な建物が建ち上がります。#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_217:0 "選挙人が議長を務め、最後に憲章が読み上げられます。"
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_217:0 "まだです、まずはホールを埋めましょう！"
 TV_WONDER_CEREMONY_CARD_ICON_S1_218:0 "@tv_ceremony_ruler!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_218:0 "#Y 進行中#! — #high スルタンは修復を宣言#!\n#F スルタンはフェズの古代メディナの大規模な修復、そのマドラサ、モスク、門を王朝の象徴としてリニューアルすることを宣言正当性.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_218:0 "#G 完了#! — #high スルタンは修復を宣言#!\n#F スルタンはフェズの古代メディナの大規模な修復、そのマドラサ、モスク、門を王朝の象徴としてリニューアルすることを宣言正当性.#!"
 TV_WONDER_CEREMONY_S1_TITLE_218:0 "[tv_wonder_ceremony|E]：スルタンが復興を宣言"
 TV_WONDER_CEREMONY_S1_DESC_218:0 "スルタンは、王朝の正統性の証として、フェズの古代メディナ、マドラサ、モスク、門の大規模な修復を宣言した。 1 枚のタイルが交換される前に、叫び声が狭い路地で言葉を伝えます。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_218:0 "叫び声が曲がりくねったあらゆる小道にスルタンの布告を広めた。"
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_218:0 "まだですよ！"
 TV_WONDER_CEREMONY_CARD_ICON_S2_218:0 "@tv_ceremony_mapmode!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S2_218:0 "#Y 進行中#! — #high 古代の小道の調査#!\n#F 調査員とカディはメディナの密集した小道を歩き、どの壁が傾いているか、どの門が腐っているか、どの噴水が枯れているかをカタログ化します。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S2_218:0 "#G 完了#! — #high 古代の小道の調査#!\n#F 調査員とカディはメディナの密集した小道を歩き、どの壁が傾いているのか、どの門が腐っているのか、どの噴水が枯れているのかをカタログ化します。#!"
 TV_WONDER_CEREMONY_S2_TITLE_218:0 "[tv_wonder_ceremony|E]：古代の路地の調査"
 TV_WONDER_CEREMONY_S2_DESC_218:0 "測量士とカディはメディナの密集した小道を歩き回り、どの壁が傾いているのか、どの門が腐っているのか、どの噴水が枯れているのかを目録に記録します。単一の石に触れる前に、クラフト ギルドの長老たちに相談します。\n\n#weak 儀式を次の段階に進めるために必要な代金を支払います。または、まだ適切なタイミングではない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S2_OPTION_PAY_218:0 "私たちはカディたちにあらゆる車線を歩き、廃墟となったものをマークするよう命じました。"
 TV_WONDER_CEREMONY_S2_OPTION_DECLINE_218:0 "測量士たちは帳簿がまだ閉まったまま、門のところで留まっている。"
 TV_WONDER_CEREMONY_CARD_ICON_S3_218:0 "@tv_ceremony_employees!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S3_218:0 "#Y 進行中#! — #high 染物職人と石工を集める#!\n#F 染物職人、タイルカッター、石工がマグレブ各地から集まり、作業が始まる前に彼らのギルドが地元の学者から祝福を受けます。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S3_218:0 "#G 完了#! — #high 染物職人と石工が集まる#!\n#F 染物職人、タイルカッター、石工がマグレブ全域から集められ、作業が始まる前に彼らのギルドは地元の学者から祝福を受けます。#!"
 TV_WONDER_CEREMONY_S3_TITLE_218:0 "[tv_wonder_ceremony|E]：染物屋と石工の集まり"
 TV_WONDER_CEREMONY_S3_DESC_218:0 "染物職人、タイルカッター、石工がマグレブ全域から集まり、作業が始まる前に彼らのギルドが地元の学者から祝福を受けます。大マドラサに続く小道に沿って、バットや足場が積み込まれています。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S3_OPTION_PAY_218:0 "一人ではできないことを多くの手が上げます。"
 TV_WONDER_CEREMONY_S3_OPTION_DECLINE_218:0 "まだギルドを召喚する準備ができていません。"
 TV_WONDER_CEREMONY_CARD_ICON_S4_218:0 "@tv_ceremony_building_default!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S4_218:0 "#Y 進行中#! — #high 修復が本当に始まります#!\n#F S崩れた最初の壁に足場が立ち上がり、職人たちは単なる計画ではなく、本当の修復作業を開始します。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S4_218:0 "#G 完了#! — #high 修復が本当に始まります#!\n#F S崩れた最初の壁に足場が立ち上がり、職人たちは単なる計画ではなく本当の修復作業を開始します。#!"
 TV_WONDER_CEREMONY_S4_TITLE_218:0 "[tv_wonder_ceremony|E]：復興が本格的に始まる"
 TV_WONDER_CEREMONY_S4_DESC_218:0 "最初の崩れた壁に足場が立ち上がり、職人たちは単なる計画ではなく、真の修復作業を開始します。一世代にわたって静かだった小道が、埃とノミの輪で埋め尽くされます。\n\n#weak 式典を次の段階に進めるために必要な代金を支払います。あるいは、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_218:0 "足場が最初の崩れた壁を登るときにノミの音が鳴り響きます。"
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_218:0 "性急な基礎はすぐにひび割れます。"
 TV_WONDER_CEREMONY_CARD_ICON_S5_218:0 "@tv_ceremony_art_work!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_218:0 "#Y 進行中#! — #high マドラサの中庭がリニューアル#!\n#F ゼリージュのタイルカッターが、何世紀も前のパターンを石ごとに合わせて、マドラサの中庭全体に新鮮な幾何学模様のモザイクをはめ込みます。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_218:0 "#G 完了#! — #high マドラサの中庭が新しくなりました#!\n#F ゼリッジのタイルカッターが、マドラサの中庭全体に新鮮な幾何学模様のモザイクをはめ込み、何世紀にもわたるパターンを石ごとに一致させます。#!"
 TV_WONDER_CEREMONY_S5_TITLE_218:0 "[tv_wonder_ceremony|E]：マドラサの中庭がリニューアル"
 TV_WONDER_CEREMONY_S5_DESC_218:0 "ゼリージュ タイル カッターは、マドラサの中庭全体に新鮮な幾何学的なモザイクを貼り付け、何世紀にもわたるパターンを石ごとに一致させます。学者たちは、まだ完全に下りきっていない足場の下で講義に戻ります。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_218:0 "私たちはゼリージュが古代のパターンに従って形を作るのを観察します。"
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_218:0 "タイルカッターがノミを置き、中庭には模様が半分残った。"
 TV_WONDER_CEREMONY_CARD_ICON_S6_218:0 "@tv_ceremony_defensive_military_stance!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_218:0 "#Y 進行中#! — #high 門と城壁がリセットされる#!\n#F 石工たちは、蝶番の大きな門をリセットし、古代都市を囲む城壁を強化します。その作業は、それぞれの完成を祝ってパレードする工芸ギルドの行列によって見守られますセクション.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_218:0 "#G 完了#! — #high 門と城壁がリセットされる#!\n#F 石工たちは、蝶番の大きな門をリセットし、古代都市を囲む城壁を強化します。その作業は、それぞれの完成を祝ってパレードする工芸ギルドの行列によって見守られますセクション.#!"
 TV_WONDER_CEREMONY_S6_TITLE_218:0 "[tv_wonder_ceremony|E]：門と城壁がリセットされる"
 TV_WONDER_CEREMONY_S6_DESC_218:0 "石工たちは、大門の蝶番を取り付け直し、古代都市を囲む城壁を補強し、その作業は、完成した各セクションを祝ってパレードする手工芸品ギルドの行列によって見守られました。商人は修復されたばかりのアーチの下で屋台を再開します。\n\n#weak 儀式を次の段階に進めるために必要な代金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_218:0 "石工たちは、新たに取り付けられた蝶番を使って大きな門を家に戻します。"
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_218:0 "古い門はもうしばらくそのままにしておきます。"
 TV_WONDER_CEREMONY_CARD_ICON_S7_218:0 "@tv_ceremony_river!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_218:0 "#Y 進行中#! — #high 噴水が再びきれいになりました#!\n#F 技術者が都市の地下水路を掃除して再配線し、メディナの噴水が一世代で初めてきれいになりました。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_218:0 "#G 完了#! — #high 噴水が再びきれいになりました#!\n#F エンジニアが都市の地下水路を掃除して再配線し、メディナの噴水が一世代で初めてきれいになりました。#!"
 TV_WONDER_CEREMONY_S7_TITLE_218:0 "[tv_wonder_ceremony|E]：噴水が再び晴れる"
 TV_WONDER_CEREMONY_S7_DESC_218:0 "技術者たちは街の地下水路を撤去して再敷設し、メディナの噴水は一世代で初めて水がきれいになりました。染物職人が皮なめし工場沿いの桶に戻り、古代の取引がフルカラーで再び行われます。\n\n#weak 儀式を次の段階に進めるために必要な代金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_218:0 "エンジニアは噴水がなくなるまで、埋設された水路を再配線します。"
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_218:0 "たとえ濁った水であっても、時間の経過とともに解消されます。"
 TV_WONDER_CEREMONY_CARD_ICON_S8_218:0 "@tv_ceremony_prestige!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_218:0 "#Y 進行中#! — #high フェズは華麗に再聖別される#!\n#F スルタンは正式な行列で復元された小道を歩き、フェズのマドラサ、門、噴水は、その生きた証拠として再聖別されました。王朝の永続的な統治権。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S8_218:0 "#G 完了#! — #high フェズは華麗に再奉献される#!\n#F スルタンは正式な行列で復元された小道を歩き、フェズのマドラサ、門、噴水は、その生きた証拠として再奉献されます。王朝の永続的な統治権。#!"
 TV_WONDER_CEREMONY_S8_TITLE_218:0 "[tv_wonder_ceremony|E]：フェズは素晴らしさの中で再聖別される"
 TV_WONDER_CEREMONY_S8_DESC_218:0 "スルタンは修復された小道を正式な行列で歩き、フェズのマドラサ、門、噴水は王朝の永続する統治権の生きた証拠として再奉献された。新しくなった都市の噂がキャラバンの道を駆け巡り、商人が物語を繰り返すたびに王冠の地位が高まります。\n\n#weak 儀式を完了するために必要な代金を支払います。その結果、驚異の最終的な建物が完成します。#!"
 TV_WONDER_CEREMONY_S8_OPTION_PAY_218:0 "私たちは復元された小道を歩き、フェズに私たちの統治権を宣言させます。"
 TV_WONDER_CEREMONY_S8_OPTION_DECLINE_218:0 "スルタンの行列が待っていますが、フェズの門はまだ開いていません。"
 TV_WONDER_CEREMONY_CARD_ICON_S1_219:0 "@tv_ceremony_holy_site!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S1_219:0 "#Y 進行中#! — #high ケルアンを聖化する呼びかけ#!\n#F 統治者はケルアンの大モスク境内を拡大し神聖化するという偉大な事業を宣言し、ケルアンの信仰の灯台としての街の場所を称える。イフリキヤ.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S1_219:0 "#G 完了#! — #high ケルアンを聖化する呼びかけ#!\n#F 統治者はケルアンの大モスク境内を拡大し神聖化するという偉大な事業を宣言し、ケルアンの信仰の灯台としての街の場所を称える。イフリキヤ.#!"
 TV_WONDER_CEREMONY_S1_TITLE_219:0 "[tv_wonder_ceremony|E]：ケルアンを聖化する呼びかけ"
 TV_WONDER_CEREMONY_S1_DESC_219:0 "統治者は、イフリーキヤへの信仰の灯台としてのこの街の場所を称え、ケルアンの大モスク境内を拡大し神聖化するという大事業を宣言した。最初の壁に触れる前に、イマームが感謝の祈りを先導します。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、その瞬間がまだ適切でない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S1_OPTION_PAY_219:0 "私はこの神聖な業をケルアンの信者の前で宣言します。"
 TV_WONDER_CEREMONY_S1_OPTION_DECLINE_219:0 "統治者は布告を保留し、最初の石は手つかずのままです。"
