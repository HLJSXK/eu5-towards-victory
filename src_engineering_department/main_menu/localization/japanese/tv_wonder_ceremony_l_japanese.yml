 TV_WONDER_CEREMONY_S5_DESC_113:0 "労働者はブロックを外側から彫るのと同じように内側からくりぬき、ゆっくりと、凹んだ中庭に十字架の形をした教会が独立して現れます。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_113:0 "石工が石を内側からくり抜き、凹んだ中庭に十字型の教会が立ち上がります。"
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_113:0 "私たちは教会が自由に立つのを見る準備ができていません。石をもう少し閉じたままにしておきます。"
 TV_WONDER_CEREMONY_CARD_ICON_S6_113:0 "@tv_ceremony_paved_road!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S6_113:0 "#Y 進行中#! — #high 窓とトンネルが彫られています#!\n#F 十字形の窓が教会の石壁を貫通し、狭いトンネルが掘られ、地下とその横に彫られた教会を結んでいます。#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S6_113:0 "#G 完了#! — #high 窓とトンネルが彫られています#!\n#F 十字形の窓が教会の石壁を貫通し、狭いトンネルが掘られ、地下とその横に彫られた教会を結んでいます。#!"
