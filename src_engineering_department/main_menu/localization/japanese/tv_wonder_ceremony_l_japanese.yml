 TV_WONDER_CEREMONY_S6_DESC_113:0 "十字型の窓が教会の石の壁に突き刺さり、狭いトンネルが地下にあり、その横に彫られた教会を結んでいます。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S6_OPTION_PAY_113:0 "作業員たちは岩に十字の窓を突き刺し、教会と教会を結ぶトンネルを切り開いた。"
 TV_WONDER_CEREMONY_S6_OPTION_DECLINE_113:0 "下の暗闇に向かって壁を開く前に、壁をもう少ししっかりと立てておきたいと思います。"
 TV_WONDER_CEREMONY_CARD_ICON_S7_113:0 "@tv_ceremony_population!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S7_113:0 "#Y 進行中#! — #high 巡礼者が作業が完了する前に到着#!\n#F 驚異の噂はノミが終わるより早く広がり、石工が上空のたいまつの明かりでまだ仕事をしている間も、巡礼者が塹壕で祈りを捧げるために到着し始めます。 #!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S7_113:0 "#G 完了#! — #high 巡礼者は作業が完了する前に到着#!\n#F 驚異の噂は彫刻刀が完成するよりも速く広がり、石工が上空のたいまつの明かりでまだ働いている間でも、巡礼者は塹壕で祈りを捧げるために到着し始めます#!"
 TV_WONDER_CEREMONY_S7_TITLE_113:0 "[tv_wonder_ceremony|E]：作業が終わる前に巡礼者が到着"
 TV_WONDER_CEREMONY_S7_DESC_113:0 "不思議の噂はノミが終わるより早く広まり、石工たちがまだたいまつの明かりで石工たちが働いている間でも、巡礼者が塹壕に祈りを捧げに集まり始めます。\n\n#weak 儀式を次の段階に進めるために必要な料金を支払います。あるいは、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S7_OPTION_PAY_113:0 "彼らはすでに祈りに来ています！"
 TV_WONDER_CEREMONY_S7_OPTION_DECLINE_113:0 "石工たちは巡礼者たちを振り返し、未完成の石に彼らの祈りを受け入れさせることを望まなかった。"
 TV_WONDER_CEREMONY_CARD_ICON_S8_113:0 "@tv_ceremony_religious_unity!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S8_113:0 "#Y 進行中#! — #high 教会は一つとして聖別される#!\n#F 司祭たちは完成した溝とトンネルを通る手十字架の行列を先導し、すべての教会を一つの聖なる複合体として聖別し、ロハの祝福が全体にその恵みを広げると宣言されるキングダム.#!"
