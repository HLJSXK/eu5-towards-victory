 TV_WONDER_CEREMONY_S1_DESC_144:0 "ツァーリは赤の広場で、カザンに対する勝利の感謝として大聖堂、その勝利の祝日を祝った聖人たちに捧げられた礼拝堂を建立することを誓います。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。あるいは、まだ適切なタイミングでない場合は待ちます。#!"
