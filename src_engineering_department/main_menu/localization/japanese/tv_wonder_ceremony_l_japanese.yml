 TV_WONDER_CEREMONY_S4_DESC_143:0 "石工たちは、掘ったばかりの基礎に聖歌隊席の最初の石の橋脚を設置し、何年にもわたる計画を経て、ついに大聖堂がシテ島の上にそびえ立つ作品として目に見える形になりました。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切な時期でない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S4_OPTION_PAY_143:0 "ついに上がります！"
 TV_WONDER_CEREMONY_S4_OPTION_DECLINE_143:0 "まだ橋脚を上げる準備ができていません。"
 TV_WONDER_CEREMONY_CARD_ICON_S5_143:0 "@tv_ceremony_advance!"
 TV_WONDER_CEREMONY_CARD_ACTIVE_S5_143:0 "#Y 進行中#! — #high フライングバットレスが構える#!\n#F 石工たちは、身廊の側面に沿って大胆なフライングバットレスを上げます。パリのどの教会よりも壁を高く、薄く登ることができる新しい解決策です。既知の.#!"
 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_143:0 "#G 完成#! — #high フライングバットレスが構える#!\n#F 石工たちは、身廊の側面に沿って大胆なフライングバットレスを掲げます。これは、パリのどの教会よりも壁を高く、薄く登らせる新しい解決策です。既知の.#!"
 TV_WONDER_CEREMONY_S5_TITLE_143:0 "[tv_wonder_ceremony|E]：フライングバットレスが構える"
 TV_WONDER_CEREMONY_S5_DESC_143:0 "石工たちは、身廊の側面に沿って大胆なフライングバットレスを持ち上げます。これは、パリがこれまでに知っているどの教会よりも壁を高く、薄く登ることを可能にする新しい解決策です。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
 TV_WONDER_CEREMONY_S5_OPTION_PAY_143:0 "石工たちはフライングバットレスを思い切って所定の位置に設置した。"
 TV_WONDER_CEREMONY_S5_OPTION_DECLINE_143:0 "大胆すぎる、早すぎる！"
