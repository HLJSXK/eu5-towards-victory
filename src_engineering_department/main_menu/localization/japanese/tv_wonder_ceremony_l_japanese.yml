 TV_WONDER_CEREMONY_CARD_COMPLETED_S5_153:0 "#G 完成#! — #high ダブルシェルクライム#!\n#F ドームの内殻と外殻は、コースごとに一緒に上昇し、ブルネレスキが企業秘密として守っている隠された石の鎖と木のネクタイで結ばれています。#!"
 TV_WONDER_CEREMONY_S5_TITLE_153:0 "[tv_wonder_ceremony|E]：ダブルシェルが登る"
 TV_WONDER_CEREMONY_S5_DESC_153:0 "ドームの内殻と外殻はコースごとに一緒に立ち上がり、ブルネレスキが企業秘密として守っている隠された石の鎖と木製の紐で結ばれています。フィレンツェの人々は毎晩下の広場に集まり、レンガの輪がどれだけ高く登ったかを測定します。\n\n#weak 式典を次の段階に進めるために必要な料金を支払います。または、まだ適切なタイミングでない場合は待ちます。#!"
