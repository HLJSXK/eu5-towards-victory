 TV_ENGINEERING_CONSTRUCTION_HELP_TEXT_1: "$BULLET$ [tv_wonder_construction|e] は、基礎、主要構造、機能、クラウニングの 4 つの [tv_wonder_construction_part|e] を同時に進めます。上のボタンを使用して、現在作成中のパーツを切り替えます。"
 TV_ENGINEERING_CONSTRUCTION_HELP_TEXT_2: "$BULLET$ [tv_wonder_construction|e] のレベルは、最も後ろにある部分によって異なります。全体のレベルは、遅れている部分が新しいユニットを完了したときにのみ上昇します。"
