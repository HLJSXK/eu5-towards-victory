 tv_engineering_department.10.t: "[tv_great_engineer|E]：偉大なエンジニアが死んだ"
 tv_engineering_department.10.d: "[tv_great_engineer|E] がお亡くなりになりました。ニュースは、閉じられた図面ケース、測量テーブルの停止、そしてアシスタントが突然最後のチョークマークを消そうとしなくなるという形で [tv_engineering_department|e] 内を移動します。未完成の計画はすべて、昨日よりも脆弱に見えます。驚異のメカニズムは帳簿を維持できますが、[tv_wonder_construction|e] には野心を順序に変える生きた心が必要です。後継者が任命されるまで、この王国には石、労力、そして希望がありますが、彼らを同意させるマスタービルダーはいません。\n\n#weak 偉大なエンジニアのポジションは現在空席です — 驚異の建設を進め続けるために、できるだけ早くエンジニアリング部門の後継者を任命してください。#!"
 tv_engineering_department.10.a: "計画が暗転する前に後継者を見つけてください。"
 tv_engineering_department.20.t: "[tv_wonder_construction|E]：プロジェクトの崩壊"
 tv_engineering_department.20.d: "[tv_wonder_domestic_support|e] の予備がなくなりました。かつてこのプロジェクトを賞賛した廷臣たちは今では別の場所で緊急の用事を覚えており、不動産の広報担当者は反対を再認識し、供給業者は別のカートが動く前に支払いを求めている。偉大なプロジェクトが擁護できない以上、[tv_engineering_department|e] はロックされた驚異を放棄し、不名誉を負わなければなりません。地面は残っており、初期の痕跡は残っており、おそらくいくつかの石も残っていますが、その下の政治的な橋は崩壊しました。沈黙、恐怖、そして無報酬の約束の上にどんな記念碑も立つことはできません。\n\n#weak この驚異は強制的に放棄されました。エンジニアリング部門で敷地と計画を再評価し、いつでもやり直すことができます。#!"
 tv_engineering_department.20.a: "恥を綺麗に記録しましょう。"
 tv_engineering_department.30.t: "[tv_wonder_construction|E]：デザインが形になる"
 tv_engineering_department.30.d: "[tv_great_engineer|E] は最初のページを埋め尽くしました。大まかな標高、高価な疑問、地形の隠れた強み、そして目に見える残念さで取り消されたいくつかのエレガントな不可能性です。コンセプトはもはや工房の雰囲気ではありません。これは、法廷が比較し、争点を設け、最終的に選択できる提案となる準備が整っています。\n\n#weak 設計コンセプトは準備ができています。エンジニアリング部門に行って [tv_great_engineer|E] の提案を検討し、それを受け入れるか再考するよう要求してから、国内で十分な支持を得るためにこの不思議さに関する議論を進めてください。#!"
 tv_engineering_department.30.a: "デザインを見せてください。"
 tv_engineering_department.100.t: "[tv_wonder_debate|E]：貴族の邸宅集会"
 tv_engineering_department.100.d: "いくつかの貴族の家は、この驚異が王国の記憶と同じくらい自分たちの記憶をさらに拡大するだろうと決定しました。彼らの使者たちは、祖先の座、不滅の名前、そして将来の世代が私的な栄光と公的な目的を混同するかもしれないという楽しい可能性について語ります。 [tv_engineering_department|e] はそれらを修正しません。サポートはサポートであり、[tv_wonder_domestic_support|e] はジュエリーを身に着けて到着することがよくあります。彼らの声は今、コート中に適切な音量で響き渡ります。"
 tv_engineering_department.100.a: "見てもらいましょう。"
 tv_engineering_department.101.t: "[tv_wonder_debate|E]：ノーブルバックラッシ"
 tv_engineering_department.101.d: "この驚異は十分な名誉を返還することなく高貴な特権を消費するだろうという噂が広まった。いくつかの家は、記念碑の将来の素晴らしさではなく、それが犠牲になるかもしれない座席、免除、労働者、儀式の優先順位を考慮し始めています。 [tv_engineering_department|e] は石を測定できますが、負傷者のランクを調査するのは困難です。貴族の間の支持は揺らぎ、あらゆるためらいがプロジェクト全体を重く感じさせます。プライドは大理石より軽いかもしれませんが、持ち上げるのははるかに困難です。"
 tv_engineering_department.101.a: "彼らの誇りは高価です。"
 tv_engineering_department.102.t: "[tv_wonder_debate|E]：強盗はチャンスを見出す"
 tv_engineering_department.102.d: "ギルドマスターや財政家たちは、契約、道路、倉庫、そして将来の群衆について話し始めます。彼らはその驚異の中に、その素晴らしさだけでなく、請求書、交通の権利、部屋を借りていること、そして孫たちが依然として料金を徴収していることを見ます。 [tv_engineering_department|e] は注意深く耳を傾けます。商取引には、野心を現実的なものに見せる才能があるからです。彼らの熱意は議論に新たな勢いを与えます。インクに染まった指と優れた算術によって繁栄が到来しました。"
 tv_engineering_department.102.a: "繁栄には説得力があります。"
 tv_engineering_department.103.t: "[tv_wonder_debate|E]：販売者がコストを計算する"
 tv_engineering_department.103.d: "一部の住民は現在、この驚異が労働力、信用、交通機関を拘束するだろうと警告している。彼らは栄光をあからさまに非難しません。彼らは単に、その下に何台の荷車、賃金、倉庫を閉じ込めなければならないかを尋ねるだけです。すべての文がもっともらしい数字の列とともに届くため、このような警戒はパニックよりも無視するのが難しいです。 [tv_engineering_department|e] は、徐々に世間の信頼をクールに感じます。帳簿は、声に出して読み上げると、スピーチと同じくらい鋭く傷つく可能性があります。"
 tv_engineering_department.103.a: "台帳はスピーチと同じくらい傷つきやすいものです。"
 tv_engineering_department.104.t: "[tv_wonder_debate|E]：聖職者の祝福"
 tv_engineering_department.104.d: "著名な聖職者は、この不思議を秩序と献身の目に見えるしるしとして組み立てています。説教では、測られた石を従順な魂に、安定した土台を忠実な教義に、公共労働を義なる民の規律にたとえます。 [tv_engineering_department|e] は、エンジニアが比喩よりもプライベートに鉛直線を好む場合でも、この言語の恩恵を受けます。議論は厳粛で安心感のあるトーンを獲得します。天が足場を承認しているように見えるとき、[tv_wonder_domestic_support|E] はより簡単に上昇します。"
 tv_engineering_department.104.a: "役立つ祝福です。"
 tv_engineering_department.105.t: "[tv_wonder_debate|E]：行き過ぎに対する説教"
 tv_engineering_department.105.d: "説教者たちはこの計画を石をかぶった虚栄心だと非難している。彼らは、飢えた村に大理石が必要なのか、統治者の魂は身長によって救われるのか、石工が測ったというだけの理由で誇りは神聖なものとなるのか、と問うている。この告発により、すでに費用に不安を感じている人たちの中にもリスナーが集まりました。 [tv_engineering_department|e] は多くの反論に答えることができますが、説教は反論に耐えられるように作られています。信仰は基盤を祝福することもできますが、それを拒否することもできます。"
 tv_engineering_department.105.a: "信仰によって大理石を拒否することもできます。"
 tv_engineering_department.200.t: "[tv_wonder_construction|E]：建設ユニットが完了しました"
 tv_engineering_department.200.d: "驚異の別の部分が目に見える閾値を超えました。足場が下り、監督が完成したユニットに印を付けると、作業員は次の仕事も同様に重いものであることを知っている人々の用心深い誇りを持って後ずさりする。不可能が石、梁、水路、または金庫になりつつあることを、国民はついに見ることができるようになりました。批評家でさえ、影を落とすものを嘲笑するのは難しいと感じています。 [tv_wonder_construction|E] は進歩だけでなく証拠も得ました。\n\n#weak この建設ユニットは完了しました — エンジニアリング部門は驚異の次のユニットに向けて続行します。#!"
 tv_engineering_department.200.a: "仕事を進め続けてください。"
 tv_engineering_department.201.t: "[tv_wonder_construction|E]：プロジェクトの立ち上がり"
 tv_engineering_department.201.d: "[SCOPE.sLocation('tv_wonder_event_location').GetName] では、完成した 4 つのモジュールがその目的を果たしました。彼らの仮設工事は現在解体可能であり、保存された驚異そのものの核心部分の建設がついに開始できるようになる。基礎、ボディ、機能、クラウンはもはや競合する断片ではありません。それらは 1 つの記念碑に折りたたむ準備ができています。\n\n#weak 4 つのモジュールは驚異のコアに統合されました。驚異が完成レベルに達すると、最終的な建物は自動的に建設を開始するため、エンジニアリング部門のパネルに注目してください。#!"
 tv_engineering_department.201.a: "モジュールを分解してコアを持ち上げます。"
 tv_engineering_department.202.t: "[tv_wonder_construction|E]：ワークスタンド完成"
 tv_engineering_department.202.d: "[tv_engineering_department|E] は建設段階の完了を宣言しました。作業現場は解体され、作業スタッフは撤退し、最後の請負業者帳簿は会計士だけが本当に味わえる満足感をもって締めくくられます。現在、記念碑は立っていますが、石だけではまだ運命を成していません。未完成の問題は、それをどのように構築するかということから、それをどのように神聖化するかに変わりました。領域は体を作りました。 [tv_wonder_ceremony|e] は、これに公共の魂を与える必要があります。\n\n#weak 建設段階は完了しました — エンジニアリング部門を訪問して、落成式のスタイルを選択し、驚異の儀式を開始してください。#!"
 tv_engineering_department.202.a: "儀式の準備をします。"
 tv_engineering_department.202.a.tt: "現場の$tv_wonder_labor_camp$は取り壊されます。"
 tv_engineering_department.203.t: "[tv_wonder_construction|E]：議論は決着しました"
 tv_engineering_department.203.d: "法廷は不思議な論争の終了を発表した。反対派は消え去ったわけではないが、数えられ、答えられ、買収され、あるいは公式計画に組み込まれた。このプロジェクトはスピーチを離れて、地面、道路、勾配、距離の測定の世界に入ります。 [tv_great_engineer|e] は、調査するサイトを要求します。この時点から、[tv_wonder_domestic_support|e] はゆっくりと消耗するため、次の順序は実用的になるはずです。記念碑が実際に立つことができる場所を選択してください。\n\n#weak 議論は終了しました — エンジニアリング部門で驚異の建設現場を選択し、測量と建設を開始してください。#!"
 tv_engineering_department.203.a: "調査を開始します。"
 tv_engineering_department.300.t: "[tv_wonder_survey|E]：調査完了"
 tv_engineering_department.300.d_high: "[tv_wonder_survey|E] は優れた読み取り値を返します。選ばれた土地には野心が宿り、物資がそこに届き、作業員は最初の常設キャンプが立ち上がる前に地形を通る道を見出すことができます。 [tv_great_engineer|e] はテーブルを 2 回読み取ります。これは、数値が疑わしいからではなく、良いニュースが検証に値するためです。規模、物流、組織は現在、同じ方向を向いています。このサイトは、便利な方法で難しくなることをほぼ熱望しているようです。"
 tv_engineering_department.300.d_mid: "[tv_wonder_survey|E] は使用可能な読み取り値を返します。サイトによって作業が楽になるわけではありませんが、それが約束されたとは正直言って不思議ではありません。地面には限界があり、道路には雰囲気があり、労働計画にはロマンスよりも規律が必要です。それでも、[tv_engineering_department|e] は、指定した弱点を回避する計画を立てることができるようになりました。測定された障害物はすでに半分飼い慣らされています。"
 tv_engineering_department.300.d_low: "[tv_wonder_survey|E] は問題のある読み取り値を返します。この場所を宣言することはまだ可能ですが、地図は緊張しているように見え、測量士は専門的な注意を払って言葉を選んでいます。土地、ルート、または労働組織が、当初の予想以上に私たちの野心に抵抗する可能性があります。 [tv_engineering_department|e] は、別の場所の方が不思議な効果をより良く発揮できる可能性があると警告しています。ここで続行することは、目を開いて下される決定であり、それは盲目よりは優れており、自信よりも高価です。"
 tv_engineering_department.300.a: "結果を確認します。"
 tv_engineering_department.310.t: "[tv_wonder_survey|E]：隠された基礎"
 tv_engineering_department.310.d: "測量士は、提案された工事の下で安定した地盤と古い石を発見します。最初は単なる固体に見えたものは、まるで忘れられた手が地球上から有用な秩序を残したかのように、ほぼ準備が整っているように見えます。 [tv_wonder_survey|e] チームは、負荷、深さ、そして自動的に解決された問題を見つけるというまれな喜びについて楽しく議論します。この驚異の可能性のある規模は、当初の想定よりもさらに大規模なものに見える。 [tv_great_engineer|e] でも、別の測定を求める前に微笑むことができます。"
 tv_engineering_department.310.a: "すばらしい。"
 tv_engineering_department.311.t: "[tv_wonder_survey|E]：危険な地面"
 tv_engineering_department.311.d: "最初の地図が確実性を約束していた場所で地盤が変化する。杭は傾き、チョークの線は互いに一致しなくなり、調査員は短い文で話し始めます。追加の支援は、この驚異の実際的な規模を狭めるだろう。それは野心が弱まったからではなく、地球が独自の条件で答えたからである。 [tv_engineering_department|e] は引き続き続行できます。地面が受動的であるかのように振る舞うことを単にやめなければなりません。"
 tv_engineering_department.311.a: "計画を調整します。"
 tv_engineering_department.312.t: "[tv_wonder_survey|E]：供給ラインのクリア"
 tv_engineering_department.312.d: "[tv_wonder_survey|E] は、予想よりも少ない摩擦で石、木材、工具を運ぶことができるルートを見つけます。無視された道路は使用可能な川の曲がり角に加わり、中継地は記憶よりも広いことが判明し、地元の航空会社は王室の地図がわざわざ学ばなかった近道をすでに知っています。この土地はいくつかの静かな恵みを提供しているため、[tv_wonder_materials|E] はよりきれいに動くでしょう。物流は、今回の場合、非難としては届きません。余白の多いマップとして表示されます。"
 tv_engineering_department.312.a: "注意深くマークを付けてください。"
 tv_engineering_department.313.t: "[tv_wonder_survey|E]：壊れたアプローチ"
 tv_engineering_department.313.d: "道路、水路、中継地は最初の報告で主張されていたよりも悪いことが判明した。車輪は道路が保持すべき場所で沈み、ボートは水が運ぶべき場所で時間を失い、本物の貨車が入った瞬間にステージングフィールドが縮小します。物流を管理するのはさらに難しくなり、[tv_wonder_materials|e] は楽観視を許さないでしょう。 [tv_engineering_department|e] は今、偉大な作品の古い真実に直面しています。記念碑は石が到達するずっと前から始まります。時には泥から始まることもあります。"
 tv_engineering_department.313.a: "補償させていただきます。"
 tv_engineering_department.314.t: "[tv_wonder_survey|E]：現場での注文"
 tv_engineering_department.314.d: "測定スタッフはきれいなリズムに落ち着きます。フラグが設定され、メモがコピーされ、監督者は互いに矛盾するのをやめ、大まかな観察は将来の労働者が実際に従うことができるシステムになります。これは劇的な発見ではありませんが、より役に立つかもしれません。 [tv_wonder_construction|E] は、多くの人々が同じことを同じ順序で行うという退屈な奇跡に依存しています。今日、その奇跡が可能になりそうです。"
 tv_engineering_department.314.a: "良い習慣です。"
 tv_engineering_department.315.t: "[tv_wonder_survey|E]：調査の混乱"
 tv_engineering_department.315.d: "矛盾した地図とライバルの監督が作業を遅らせます。ある乗組員は尾根で誓い、別の乗組員は道路で誓い、そして3番目の乗組員は誰もが即座にそれを信用しないほど正確な表を作成しました。 [tv_engineering_department|e] は、混乱を一度書き出すとほぼ公式に見えるため、将来の組織計画に自信を失います。ワンダーは、悪い指揮よりも簡単に悪い馬場を生き残ることができます。陣痛が始まる前に、誰かが地図に同意するように教えなければなりません。"
 tv_engineering_department.315.a: "もつれを解きます。"
 tv_engineering_department.320.t: "[tv_wonder_survey|E]：特殊な機器が必要です"
 tv_engineering_department.320.d: "測量士は高価な機器と専門の職人を要求します。彼らは、通常の視覚には細かすぎる角度、当てずっぽうには繊細すぎる土壌検査、そして [tv_great_engineer|e] のスケール評価が高貴な楽観主義にあまり依存しないようにする測定について語っています。裁判所は費用を審理します。エンジニアは精度を聞きます。彼らに資金を提供することで調査は改善されるはずですが、将来の依頼者全員に、正確さには代償があることを教えることにもなります。拒否すると古い道具がそのまま残され、未知の人たちは礼儀正しく微笑みます。"
 tv_engineering_department.320.a: "精度にはお金を払いましょう。"
 tv_engineering_department.320.b: "私たちが持っているもので間に合わせてください。"
 tv_engineering_department.321.t: "[tv_wonder_survey|E]：専門知識の威信"
 tv_engineering_department.321.d: "[tv_great_engineer|E] は裁判所に対し、物議を醸している物流方法を公的に支持するよう求めています。この提案は、[tv_wonder_materials|e] のより迅速な移動、怠惰な労働者の減少、そしてまさに保守的な監督者が咳払いを始めるような種類の目新しさを約束しています。王国の威信を借りれば、供給計画がより説得力のあるものになるかもしれない。失敗すれば恥も世間に知れ渡ることになる。素晴らしいプロジェクトでは、最初の群衆がルールを理解する前に、州にギャンブルを行うよう求めることがよくあります。"
 tv_engineering_department.321.a: "私たちの名前を賭けてください。"
 tv_engineering_department.321.b: "公的承認はありません。"
 tv_engineering_department.322.t: "[tv_wonder_survey|E]：ギルド調整"
 tv_engineering_department.322.d: "都市部のサプライヤーは調査記録の標準化に協力できるが、混乱に対する譲歩を期待している。彼らの店員は、重量、集計、ルート、そしてあるリストを別のリストと照合する静かな横暴を理解しています。 [tv_engineering_department|e] は、特に [tv_wonder_materials|e] が本格的に動き始める前に、その能力を活用することができます。しかし、あらゆる譲歩は、商業を記念碑の記憶にもう少し深く刻み込みます。私たちは注文を買うかもしれませんが、注文は誰が売ったのかを覚えています。"
 tv_engineering_department.322.a: "ギルドに頼ってください。"
 tv_engineering_department.322.b: "新たな義務を避けてください。"
 tv_engineering_department.401.t: "[tv_wonder_ceremony|E]：瞑想が始まります"
 tv_engineering_department.401.d: "完成した驚異は静寂に包まれている。司祭、技術者、王室の監視員たちは、1年間の緊縮財政がこの記念碑に最終的な意味を与えるために、通常の光景から身を引いている。 [tv_wonder_ceremony|e] はノイズではなく、ノイズの意図的な拒否から始まります。 [tv_engineering_department|e] でさえ忍耐を学ばなければなりません。自制心を教えるための儀式を急ぐことはいかなる計算もできないからです。訪問者は最初はその静かさに不安を感じます。そして彼らは理由を理解する前に声を下げ始めます。"
 tv_engineering_department.401.a: "年が変わりますように。"
 tv_engineering_department.410.t: "[tv_wonder_ceremony|E]：エンボイが要求されました"
 tv_engineering_department.410.d: "近隣の裁判所は、大枢軸の落成式に立ち会うために使者を派遣するよう求めています。招待は儀式的なものだが、儀式は国家が記憶に残ることを実践する場である。出席者は、新しい記念碑を最初に見て、適切なタイミングで拍手を送り、説明を必要とせずにメッセージを理解した人々の中に私たちの名前を入れるでしょう。断れば旅は救われ、彼らの物語の中での地位を失うことになる。いくつかの石は自宅で建てられます。海外からの証人を期待する人もいる。"
 tv_engineering_department.410.a: "使者を送りなさい。"
 tv_engineering_department.410.b: "招待を断ります。"
 tv_engineering_department.411.t: "[tv_wonder_ceremony|E]：使者が到着"
 tv_engineering_department.411.d: "招待された裁判所は受諾した。別の外国の使者は、リハーサルされた威厳、旅の従者、そして壮大さと弱さの両方に気づくように訓練された目を持って儀式の行列に参加します。 [tv_wonder_ceremony|e] は、外部から証言するたびに説得力を増します。なぜなら、栄光は別のアクセントで繰り返されるとより大きく聞こえるからです。行列のマスターは入場順序を調整します。書記たちは主賓のリストを調整する。ワンダーの儀式は、一度に一人ずつ法廷を見守りながら進行します。"
 tv_engineering_department.411.a: "敬意を持って受け取りましょう。"
 tv_engineering_department.412.t: "[tv_wonder_ceremony|E]：招待が拒否されました"
 tv_engineering_department.412.d: "招待された法廷は使者の派遣を拒否した。彼らの答えは侮辱を避けるほど丁寧であり、記憶に残るほど冷淡なものでした。 [tv_wonder_ceremony|e] は他の場所で視聴者を見つける必要があります。外国の畏怖を求める記念碑に空っぽの外交場所を置くわけにはいきません。廷臣らはすでに、新しい名前、より見栄えのするルート、要求らしくない手紙などを提案している。グローリーは拒否を嫌いますが、拒否することは可能です。"
 tv_engineering_department.412.a: "別の隣人を招待してください。"
 tv_engineering_department.421.t: "[tv_wonder_ceremony|E]：凱旋パレードの始まり"
 tv_engineering_department.421.d: "軸に沿って横断幕が掲げられているが、パレードにはまだその証拠が欠けている。ドラマーはリハーサルをすることができ、馬は儀式的なひづめで石を磨くことができ、役人は美しく自信を持って自分自身を整えることができますが、それらはいずれも勝利ではありません。 [tv_wonder_ceremony|e] は、戦争そのものが証明しなければならない勝利を要求します。それまでは、軍都はまだ獲得しきれていない名誉のために服を着ることになる。戦争での勝利だけが記念碑に求められる記憶を与えるのです。"
 tv_engineering_department.421.a: "そうすれば勝利は必ず訪れるはずだ。"
 tv_engineering_department.431.t: "[tv_wonder_ceremony|E]：市民祭りが始まります"
 tv_engineering_department.431.d: "市は、秩序ある広場を 1 年間、式典、試合、行列、公共指導に開放します。ワークショップの進行は遅いですが、人々はそれを歩き、観察し、それに慣れるまで文句を言いながら、市民の規律の形を学びます。 [tv_wonder_ceremony|e] は都市空間を、青空の下で繰り返されるレッスンに変えます。子どもたちはスローガンを理解する前にルートを覚えてしまいます。シビック・キャピタルはお祭り気分を盛り上げることで服従を教えています。"
 tv_engineering_department.431.a: "国民が集まろう。"
 tv_engineering_department.461.t: "[tv_wonder_ceremony|E]：自由貿易フェスティバルが始まります"
 tv_engineering_department.461.d: "商人、使者、ブローカーが港を埋め尽くし、開かれた交換の約束をします。口座が閉鎖される前は寛大さが常に最も高貴に見えるため、収入は一時的に厳しくなります。 [tv_wonder_ceremony|e] は、岸壁、倉庫、混雑したテーブルを外国の信頼のための舞台に変えます。公の場で署名されるすべての契約は、港湾が遠い裁判所が理解できる言語を話すことを教えます。 1年間は利益が下がるので評判は落ちます。"
 tv_engineering_department.461.a: "岸壁を開けてください。"
 tv_engineering_department.471.t: "[tv_wonder_ceremony|E]：先祖祭が始まります"
 tv_engineering_department.471.d: "ネクロポリスは、香と家系図、そして厳重な追悼の年を迎える。名前は、かつて属していた体よりも重く感じるまで唱えられ、ワークショップは生産性よりも記憶が優先されるため遅くなります。 [tv_wonder_ceremony|e] は、レルムに祖先をアーキテクチャとして扱うよう教えます。それぞれの捧げ物は、生者が秩序ある死者によって支配されているという議論に新たな一石を投じる。追悼は組織化されると権威となります。"
 tv_engineering_department.471.a: "ご先祖様が集まりますように。"
 tv_engineering_department.481.t: "[tv_wonder_ceremony|E]：ナビゲーターギルドが始まります"
 tv_engineering_department.481.d: "水先案内人、地図作成者、ロープマスター、港湾職員が灯台の下にギルドホールを張り込んでいます。彼らは、海図、結び目、優先順位をめぐる口論、そして悪天候でも海岸線を読むことができる人々の独特の自信を持って到着します。ビーコンは、彼らの機関が立ち上がるまで完成しません。ライトだけでも船に警告します。ギルドは警告を理解する方法を国に教えます。 [tv_wonder_ceremony|e] は現在、官僚制度を塩漬けにして待っています。"
 tv_engineering_department.481.a: "ギルドを構築します。"
 tv_engineering_department.491.t: "[tv_wonder_ceremony|E]：水祭りが始まります"
 tv_engineering_department.491.d: "水路には花輪が飾られ、水門は祝福され、作業場は 1 年間の水の儀式のために静寂に包まれます。水は従順に見えるように作られていますが、これは大胆な神学的主張であることは、洪水を見たことがある人なら誰でも知っています。生産は、複合体が [tv_wonder_ceremony|e] を通じて神聖な秩序を主張できるように変更されます。エンジニアは司祭が検査したいものを祝福するのを眺め、司祭はエンジニアがむしろ神聖化したいものを測定するのを眺めます。それらの間で、水は動き続けます。"
 tv_engineering_department.491.a: "水の流れを変えましょう。"
 tv_engineering_department.501.t: "[tv_wonder_ceremony|E]：深部排水開始"
 tv_engineering_department.501.d: "技術者たちは排水工事を鉱山都市へと下っていきます。ポンプ、ブレース、水路が深さを征服するまで、シャフトは 1 年間ほぼ沈黙します。鉱山労働者は水と同じくらい静かを嫌いますが、より深い富を得るにはどちらも耐えなければなりません。ここでの [tv_wonder_ceremony|e] は穏やかではありません。それは暗闇、湿気、そして忍耐との取引です。作品がついに息吹を吹き込むとき、都市は恐怖のどこまで到達できるかを知ることになるだろう。"
 tv_engineering_department.501.a: "暗闇を排出します。"
 tv_engineering_department.511.t: "[tv_wonder_ceremony|E]：星のカタログが始まります"
 tv_engineering_department.511.d: "天文台はランプ、テーブル、そして規律ある不眠の周りに閉じこもっています。天文学者は、散乱光としてではなく、将来の学者がテストできる公序良俗の項目として、星を次々とマークします。裁判所が空と手段に注意を向けている間、立法は遅れています。 [tv_wonder_ceremony|e] は今日の光景で終わるわけではありません。それは、天が十分な忍耐をもってコピーされて役に立つようになるときに終わるでしょう。"
 tv_engineering_department.511.a: "彼らに空を数えさせてください。"
 tv_engineering_department.521.t: "[tv_wonder_ceremony|E]：日食宣言の始まり"
 tv_engineering_department.521.d: "天文台は、日食が来るだろう、そして恐怖が最初に日食を命名する前に裁判所が日食に命名する準備ができているだろうという予測を発表した。司祭、学者、船員、そして懐疑論者たちは皆、今、さまざまな希望を抱いて上を向いています。経過する月ごとに請求がテストされます。天が表に従うなら、[tv_wonder_ceremony|e] は、その領域が降伏することなく天を読み取ることができるという証拠になります。"
 tv_engineering_department.521.a: "天を見てください。"
 tv_engineering_department.522.t: "[tv_wonder_ceremony|E]：日食の到来"
 tv_engineering_department.522.d: "天文台が言ったとおりに光が変わります。群衆は沈黙しますが、その沈黙はパニックではありません。叫び声を上げている人たちは、学習した表が何を予言したかをすでに伝えています。 [tv_wonder_ceremony|e] は、太陽と影と息の間の空間で公然の確信を持ちます。光が戻ったとき、裁判所は単に知恵を主張するだけではありません。それは、タイミング、勇気、そして驚異そのものの指揮力を実証しました。"
 tv_engineering_department.522.a: "レルムに予測を記憶させます。"
 tv_engineering_department.531.t: "[tv_wonder_ceremony|E]：トリビュートを受け取りました"
 tv_engineering_department.531.d: "別の主題の寄稿がパレス・オブ・ナシオンに入ります。それは洗練された注意を払って展示されており、単に富だけでなく、ホールを通過するすべての使節の目に見える地位に関する議論も展示されています。トリビュートギャラリーは、建築物があると栄光と同様に従属が信じやすくなるため、提供するたびに説得力が増します。儀式では、一度に 1 つの測定された従順行為が進められます。"
 tv_engineering_department.531.a: "トリビュートを録音します。"
 tv_engineering_department.541.t: "[tv_wonder_ceremony|E]：大使館クォーターの始まり"
 tv_engineering_department.541.d: "国際宮殿の横にある大使館地区には財団のマークが付けられています。外国の家には、ドア、中庭、使用人用の通路、そして外交を時折の訪問ではなく毎日の存在にする、あらゆる小さな実用的な威厳が与えられるでしょう。 [tv_wonder_ceremony|e] は現在、他の裁判所が居住するために構築された地区を待機しています。宮殿は注目を集めることができます。大使館地区は、留まることに注意を払うことを教えてくれます。"
 tv_engineering_department.541.a: "外国人の目のための場所を作りましょう。"
 tv_engineering_department.500.t: "[tv_wonder_ceremony|E]：プロジェクトが開始されました"
 tv_engineering_department.500.d: "[tv_engineering_department|E] は [tv_wonder_ceremony|e] を完成させ、この記念碑は現在、王国の野心の永遠のしるしとして立っています。足場はなくなり、帳簿は封印され、一般の人々は、この驚異が何を意味するのかを判断するという、技術者には完了できない作業を開始した。それを栄光と呼ぶ人もいるだろうし、過剰と呼ぶ人もいるだろうし、時代が変わった証拠と呼ぶ人もいるだろう。彼ら全員がそれを見なければなりません。それはすでに勝利の形です。"
 tv_engineering_department.500.a: "年齢にそれを思い出させてください。"
 tv_engineering_department.600.t: "[tv_wonder_construction|E]：世界の不思議が完成しました"
 tv_engineering_department.600.d: "[SCOPE.sCountry('tv_wonder_builder_country').GetName] からニュースが届きました。世界の驚異が [SCOPE.sLocation('tv_wonder_completed_site').GetName] で完成しました。費用、美しさ、目的、知恵については報告が異なりますが、ある点では一致しています。作業が大きすぎるため、ローカルに留まることはできません。それは支配者たちの共通の会話に入っている。"
 tv_engineering_department.600.a: "世界は聞いた。"

