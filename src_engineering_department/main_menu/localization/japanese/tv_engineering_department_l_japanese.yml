 tv_engineering_department.551.t: "[tv_wonder_ceremony|E]：学者が集結"
 tv_engineering_department.551.d: "大学都市は研究に対して声を低くします。マスター、学生、写本家、役人が講義リストや議論の余地のある朗読の周りに集まり、完成した街頭が一年にわたる集会に変わります。 [tv_wonder_ceremony|e] は急ぐ必要はありません。それは、行政のスピードと引き換えに、現在の法廷を超えて存続できるシラバスを王国に求めています。"
 tv_engineering_department.551.a: "学者たちに一年をかけてもらいましょう。"
 tv_engineering_department.552.t: "[tv_wonder_ceremony|E]：大学ホールの始まり"
 tv_engineering_department.552.d: "大学ホールの計画は、大学都市の隣に封印されています。新しいホールは、マスターたちに形式的に喧嘩する場所を与え、生徒たちに有益な方法で確信を失う場所を与え、クラウンは完全に飼い慣らされることなく学習を認識できる構造を提供します。 [tv_wonder_ceremony|e] は現在、研究が永続性を主張できるドア、ベンチ、法令、屋根の上で待機しています。"
 tv_engineering_department.552.a: "議論のための家を建てる。"
 tv_engineering_department.561.t: "[tv_wonder_ceremony|E]：ドームはベールに包まれている"
 tv_engineering_department.561.d: "大きなドームは奉献のためにベールに覆われています。司祭は敷居をマークし、歌手は慎重な敬意の順序をリハーサルし、法廷は神聖さが慎重に進むために正統性がよりゆっくりと進むべき年であることを認めた。 [tv_wonder_ceremony|e] は、寺院が天を開く準備が整うまで、覆われた空の下で待つようにレルムに要求します。"
 tv_engineering_department.561.a: "ドームを神聖なものにしましょう。"
 tv_engineering_department.571.t: "[tv_wonder_ceremony|E]：巡礼者の階段が開きます"
 tv_engineering_department.571.d: "塔寺院の階段は、巡礼者に 1 年間登ったり、立ち止まったり、唱えたり、足を痛めたりするために与えられます。労働者が行列に向かって身をかがめると、作業場からは不満の声が上がるが、[tv_wonder_ceremony|e] は努力を通じて身長を教えることを目的としている。それぞれのステップが塔を物体からルートに変え、それぞれのルートが献身を目に見えるものにします。"
 tv_engineering_department.571.a: "彼らに登ってもらいましょう。"
 tv_engineering_department.572.t: "[tv_wonder_ceremony|E]：寺子屋が始まります"
 tv_engineering_department.572.d: "教師、事務員、建設業者が塔の下にある寺子屋の基礎に印を付けています。 [tv_wonder_ceremony|e] は現在、教義が習慣となり、読み書きができ、儀式によって規律された議論ができる教室を待っています。塔は目を上に向けることができます。学校では、声が見たときに何を言うかを教えます。"
 tv_engineering_department.572.a: "学校を建てましょう。"
 tv_engineering_department.581.t: "[tv_wonder_ceremony|E]：リバーフェアが始まります"
 tv_engineering_department.581.d: "広くなった川に沿って、ブース、はしけ、料金表、お祭りののぼりが集まります。川が動脈に戻る前に見世物になることが求められているため、貿易は鈍化している。 [tv_wonder_ceremony|e] は 1 年をかけて、商人、船頭、役人が一緒に新しい水の秩序を実行できるようにします。"
 tv_engineering_department.581.a: "川に新しい群衆を学習させましょう。"
 tv_engineering_department.582.t: "[tv_wonder_ceremony|E]：運河事務所始まります"
 tv_engineering_department.582.d: "測量士は運河管理局の常設事務所をマークします。この建物は河川工事に匹敵するほど壮大なものではないが、それこそが重要な理由である。水門、紛争、通行料金、修理、乾期の苦情には、責任を隠すことができない場所が必要である。 [tv_wonder_ceremony|e] は現在、管理者が壁を取得するのを待っています。"
 tv_engineering_department.582.a: "川に机を与えてください。"
 tv_engineering_department.591.t: "[tv_wonder_ceremony|E]：海軍本部が始まります"
 tv_engineering_department.591.d: "造船所は海軍本部の敷地を確保している。進水路やクレーンは船舶を建造するかもしれませんが、艦隊には命令、海図、検査、そして木材を政策にするための忍耐力のある役人も必要です。 [tv_wonder_ceremony|e] は現在、造船所が海軍の精神を獲得するのを待っています。"
 tv_engineering_department.591.a: "オフィスを建てます。"
 tv_engineering_department.601.t: "[tv_wonder_ceremony|E]：試練中の要塞"
 tv_engineering_department.601.d: "星城塞都市の試練の一年が始まる。エンジニアは角度をテストし、砲手は火のフィールドをテストし、作業員は数学のために設計された壁が依然として筋肉によって支払われなければならないことを発見します。 [tv_wonder_ceremony|e] が理論に石で答えるように要塞に教えているため、生産が遅くなります。"
 tv_engineering_department.601.a: "あらゆる角度をテストしてください。"
 tv_engineering_department.602.t: "[tv_wonder_ceremony|E]：アーセナルクォーターの始まり"
 tv_engineering_department.602.d: "要塞都市内の兵器庫地区の基礎がマークされています。これにより、修理工場、火薬庫、徴兵場が 1 つの規律ある地区にまとめられることになります。 [tv_wonder_ceremony|e] は、最初の警報が消えた後、防御を再現できるようにする要塞の側で待機します。"
 tv_engineering_department.602.a: "兵器庫地区を建設します。"
 tv_engineering_department.611.t: "[tv_wonder_ceremony|E]：狼煙が灯る"
 tv_engineering_department.611.d: "壁沿いの監視ポストから 1 年間の合図練習が始まります。煙、炎、乗客、そして地元の市場はすべて新しいリズムに合わせて変化し、どのルートも最初に警告に気づくことを学ぶ一方で、貿易は打撃を受けています。 [tv_wonder_ceremony|e] は、日常的な旅行でも監視されているように感じるほど、警戒を周知します。"
 tv_engineering_department.611.a: "時計を明るくしておいてください。"
 tv_engineering_department.621.t: "[tv_wonder_ceremony|E]：マスターアーマーズホール始まります"
 tv_engineering_department.621.d: "武器庫は、熟練した甲冑師の殿堂の基礎を示しています。偉大な武器店も鉄と帳簿だけに依存することはできません。戦闘前に失敗を判断できる熟練した手が必要だ。 [tv_wonder_ceremony|e] は現在、クラフトが常設コートを取得するのを待っています。"
 tv_engineering_department.621.a: "マスター向けに構築します。"
 tv_engineering_department.631.t: "[tv_wonder_ceremony|E]：全国カタログが始まります"
 tv_engineering_department.631.d: "国立図書館が目録を開始します。学者たちは扉を閉め、在庫を調べ、国の立法機構を遅らせながら、再び自分自身を見つけるための記憶を教えている。 [tv_wonder_ceremony|e] はパレードではなく、インデックスです。完成すると、静かで厳格、そして強力になります。"
 tv_engineering_department.631.a: "カタログを成長させましょう。"
 tv_engineering_department.632.t: "[tv_wonder_ceremony|E]：納本庁が始まります"
 tv_engineering_department.632.d: "建築業者は図書館の横にある法定保管所に印を付けています。ここからは、書籍、法令、コピー、議論が好意としてではなく義務として集められることになります。 [tv_wonder_ceremony|e] は、レルムに書き込まれたメモリが事故によって停止する部屋を待ちます。"
 tv_engineering_department.632.a: "思い出のオフィスを建てましょう。"

