 TV_ENGINEERING_CONSTRUCTION_HELP_TT: "#T Construction#!\n[tv_wonder_construction|e] は、基礎、主要構造、機能、クラウニングの 4 つの [tv_wonder_construction_part|e] を同時に進めます。上のボタンを使用して、現在構築中のパーツを切り替えます。\n[tv_wonder_construction|e] のレベルは、最も後ろにあるパーツによって異なります。合計レベルは、遅れている部分が新しいユニットを完了した場合にのみ上昇します。\n少なくとも 1 つのレベルが完了すると、[tv_wonder_construction|e] の完了を宣言できます。\nしたがって、最初に小規模なプロジェクトを完了し、すでに獲得した完了報酬を失うことなく、後でより大規模なプロジェクトに拡張できます。\n建設ユニットを完了すると、[tv_wonder_domestic_support|e] が付与されます。そのユニットがグレート プロジェクトの合計レベルも上昇させると、さらに [tv_wonder_domestic_support|e] ボーナスが付与されます。"
