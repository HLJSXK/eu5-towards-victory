 TV_ENCYCLOPEDIA_TAB_TITLE: "技術部"
 TV_ENCYCLOPEDIA_FILTER_ALL: "すべて"
 TV_ENCYCLOPEDIA_FILTER_ALL_TOOLTIP: "すべてのエンジニアリング部門のエントリを表示します。"
 TV_ENCYCLOPEDIA_FILTER_MECHANICS: "力学"
 TV_ENCYCLOPEDIA_FILTER_MECHANICS_TOOLTIP: "Great Project のメカニック エントリのみを表示します。"
 TV_ENCYCLOPEDIA_FILTER_GENERIC: "一般的な驚異"
 TV_ENCYCLOPEDIA_FILTER_GENERIC_TOOLTIP: "一般的な Wonder エントリのみを表示します。"
 TV_ENCYCLOPEDIA_FILTER_UNIQUE: "ユニークな驚異"
 TV_ENCYCLOPEDIA_FILTER_UNIQUE_TOOLTIP: "ユニークな Wonder エントリのみを表示します。"
