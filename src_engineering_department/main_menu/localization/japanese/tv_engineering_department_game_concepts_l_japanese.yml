 # ── Engineering Department / Wonder Construction ──────────────────────────
 game_concept_tv_engineering_department: "技術部"
 game_concept_tv_engineering_department_desc: "キャンペーンの初期化中に各国ごとに自動的に設立される、固有ではない国際組織。 [tv_great_engineer|e] オフィスを保持し、[tv_wonder_construction|e]: [tv_wonder_concept|e]、サイト [tv_wonder_survey|e]、組織、ロジスティクス、および最終的な [tv_wonder_ceremony|e] のすべての段階を管理します。"
 game_concept_tv_engineering_department_europedia_desc: "キャンペーンの開始時、またはエンジニアリング部門が既存のセーブに初めて追加されたときに、すべての国に対して自動的に確立されます。これは、国が試みるすべての [tv_wonder_construction|e] を支援する常設機関です。その単一の役員である [tv_great_engineer|e] が個人的にパイプラインを推進します。彼らの管理スキルは [tv_wonder_concept|e] に進歩し、軍事スキルは [tv_wonder_survey|e] に進歩します。そして、彼らの在職期間によって誰が最終的な [tv_wonder_ceremony|e] に記憶されるかが決まります。すでに進行中のプロジェクトは、偉大なエンジニアを失ったり交替したりしてもリセットされませんが、オフィスが空いていると、後任者が任命されるまで構想と調査の進行が停滞します。"

 game_concept_tv_great_engineer: "偉大なエンジニア"
 game_concept_tv_great_engineer_desc: "[tv_engineering_department|e]を率いる指定キャラクター。 [tv_great_engineer|e] は国変数として保存され、[tv_engineering_department|e] パネルから任命、置換、または削除できます。"

 game_concept_tv_wonder_concept: "構想"
 game_concept_tv_wonder_concept_desc: "新しい [tv_wonder_construction|e] を開く提案段階。毎月、[tv_great_engineer|e] の管理スキルにより、受胎の進捗が進みます。それが完了すると、[tv_great_engineer|e] は、国が推進できる実行可能な [tv_wonder_small|e]、[tv_wonder_medium|e]、または [tv_wonder_large|e] プロジェクトを提案します。"
 game_concept_tv_wonder_concept_europedia_desc: "構想は、[tv_great_engineer|e] が任命された瞬間に始まります。隠された進捗メーターは 0 から始まり、役員の管理スキルによって毎月少しずつ上昇していきます。弱い行政官が構想を完了するまでに何年もかかることがあるが、何人かの有能な行政官が次々に交代する国では、現在誰がその職に就いているかに関係なく、蓄積された進歩が前進する。完了後、エンジニアは国に自由に選択させることはできません。彼らは、国が現在サポートできるものに基づいて形成され、国が追求する実現可能な [tv_wonder_small|e]、[tv_wonder_medium|e]、または [tv_wonder_large|e] 事業を 1 つ提案します。"

 game_concept_tv_wonder_survey: "アンケート"
 game_concept_tv_wonder_survey_desc: "[tv_wonder_construction|e] のサイト評価段階。調査の進捗状況は [tv_great_engineer|e] の軍事スキルから毎月増加し、[tv_wonder_scale_competence|e]、[tv_wonder_logistics_competence|e]、および [tv_wonder_organization_competence|e] を明らかにし、読み取りが完了すると国が建設現場を確認できるようになります。"
 game_concept_tv_wonder_survey_europedia_desc: "議論が解決されると、調査員は、選択したサイトの 3 つの隠れた品質 ([tv_wonder_scale_competence|e]、[tv_wonder_organization_competence|e]、および [tv_wonder_logistics_competence|e]) を評価します。それぞれが、サイト自体の自然な適合性と [tv_great_engineer|e] の管理スキルを組み合わせたものです。エンジニアの軍事スキルによる調査の進捗が蓄積されると、3 つの測定値はすべて一緒に上昇しますが、建設が開始されると、それらはいずれも再び改善することはできません。そのため、限界のある場所と、より良い場所を長く待つことを比較検討している国は、実際のトレードオフを行っていることになります。"

 game_concept_tv_wonder_debate: "ディベート"
 game_concept_tv_wonder_debate_desc: "[tv_wonder_construction|e]の国内討論ステージ。不動産の需要を満たし、討論イベントを行うと [tv_wonder_domestic_support|e] が構築されます。 100に達すると、国は議論の終了を宣言し、[tv_wonder_survey|e]に進むことができます。"
 game_concept_tv_wonder_debate_europedia_desc: "着工する前に、提案されたプロジェクトは国内の議論を乗り越えなければなりません。貴族、市民、聖職者はそれぞれ要求を提起し、その満足により [tv_wonder_domestic_support|e] が付与され、討論イベントではそれ以上の付与が行われます。サポートは 0 ～ 200 のスケールで実行されますが、討論を終了して [tv_wonder_survey|e] に進むために必要なのは最初の 100 ポイントのみです。支持は永久に蓄積し続けるわけではない。議論が終わると毎月少しずつ減衰していくため、すでに議論を終了できる国が議論を開いたままにしても得るものはほとんどなく、式典を迎える前に支持をゼロまで減衰させるプロジェクトは完全に崩壊する危険がある。"

 game_concept_tv_wonder_materials: "建築資材"
 game_concept_tv_wonder_materials_desc: "A produced market good used to maintain $tv_wonder_labor_camp$ during an active [tv_wonder_construction|e]. Each $tv_wonder_material_dispatch_point$ converts basic construction goods into [tv_wonder_materials|e], so supply and price are handled through the normal market."
 game_concept_tv_wonder_materials_europedia_desc: "ワンダー マテリアルは事前に備蓄されているわけではありません。各 $tv_wonder_material_dispatch_point$ は、既に市場に流通している通常の建設資材から需要に応じてワンダー マテリアルを精製し、現場で実際に稼働している $tv_wonder_labor_camp$ 建物は建設中にそれらを消費します。チェーンの両端が通常の市場にあるため、大規模プロジェクトは同じ基本財をめぐって国の他の経済圏と競合し、不足は強制停止ではなく建設の遅れとして現れます。"

 game_concept_tv_wonder_ceremony: "セレモニー"
 game_concept_tv_wonder_ceremony_desc: "完了した [tv_wonder_construction|e] プロジェクトの最後の奉納。選択された式典ブランチは、記念碑の最終的な建物、永続的な国修飾子、および残りの [tv_wonder_domestic_support|e] からの威信、安定性、および正当性の最後のバーストを決定します。"
 game_concept_tv_wonder_ceremony_europedia_desc: "素晴らしいプロジェクトがどのように終了するかは、それがどのような驚異であるかによって決まります。 [tv_wonder_generic|e] プロジェクトの発足により、国は 3 つの式典スタイルから選択することができます。永続的な祝福で終わる 1 年間の負担、地元の不動産の力を高める補助的な別館の建物、または芸術、金、名声で支払われる 1 回限りの装飾です。ほとんどの [tv_wonder_unique|e] 不思議は、建設が完了すると共有される 8 段階のセレモニーを自動的に経て進み、四半期ごとにおよそ 1 つの新しい段階に到達し、永続的な国修飾子で最高潮に達します。ファロス灯台やアヤソフィアなど、歴史的に特徴的ないくつかの場所は、共有の枠組みを完全に迂回して、独自の専用の手書きの儀式を行っています。"

 game_concept_tv_wonder_construction: "素晴らしいプロジェクト"
 game_concept_tv_wonder_construction_desc: "[tv_engineering_department|e] を通じて管理される Great Project メカニズム。 [tv_great_engineer|e] の [tv_wonder_concept|e] が実行可能な [tv_wonder_small|e]、[tv_wonder_medium|e]、または [tv_wonder_large|e] プロジェクトを生み出し、国が国内の議論を解決したら、[tv_wonder_survey|e] を完了し、労働力を組織し、[tv_wonder_materials|e] を集め、4 つの [tv_wonder_construction_part|e] を進めてプロジェクトを最終段階まで引き上げます。レベル。"
 game_concept_tv_wonder_construction_europedia_desc: "偉大なプロジェクトとは、アイデアから記念碑まで驚異を運ぶ全国的な糸です。 [tv_great_engineer|e] は、まず [tv_wonder_concept|e] を完了して、実行可能な [tv_wonder_small|e]、[tv_wonder_medium|e]、または [tv_wonder_large|e] の取り組みを提案します。その後、国は国内 [tv_wonder_debate|e] を解決します。 [tv_wonder_survey|e] は、選択したサイトがそれに耐えられることを確認します。その後、初めて適切な建設が開始され、4 つの [tv_wonder_construction_part|e] が [tv_wonder_materials|e] 上で立ち上がり、プロジェクト全体が最終レベルに達し、[tv_wonder_ceremony|e] で終了するまで労働力が組織化されます。完成した [tv_wonder_generic|e] プロジェクトは、初期の段階を繰り返すことなく、後で [tv_wonder_expansion|e] を通じてさらに進めることができます。"

 game_concept_tv_wonder_expansion: "拡張"
 game_concept_tv_wonder_expansion_desc: "すでに開始されている [tv_wonder_construction|e] を同じサイトでさらに大規模に継続します。拡張では、その驚異の初期の開設時に選択された [tv_wonder_ceremony|e] スタイルが再利用され、すでに獲得した完了報酬は失われず、サイトの保存された [tv_wonder_survey|e] 能力を引き続き活用します。"

 game_concept_tv_wonder_construction_part: "建設部品"
 game_concept_tv_wonder_construction_part_desc: "[tv_wonder_construction|e] は、基礎、主要構造、機能、クラウニングという 4 つの並行トラックのうちの 1 つを同時に進めます。プロジェクトのレベルは、4 つの部分のうち最も遅れている部分によって設定されるため、単一の軌道を急いで進むのではなく、均等に進捗を分散する必要があります。"
 game_concept_tv_wonder_construction_part_europedia_desc: "すべての偉大なプロジェクトは、実際には並行して建つ 4 つの建物 (基礎、主要構造、機能、頂部) であり、それぞれが独自の労力と材料を使用して独立して進歩しました。プロジェクト全体のレベルは 4 つの平均ではありません。最も後ろに下がった部分で上限が設定されます。 1 つの展示用トラックにすべてのリソースを注ぎ込み、他のトラックを無視しても、記念碑全体が最も弱い部分のレベルで失速するだけであるため、4 つのトラックすべてでバランスよく進行することは、いずれか 1 つを先に完成させる競争に勝ります。"

 game_concept_tv_wonder_small: "小規模プロジェクト"
 game_concept_tv_wonder_small_desc: "[tv_wonder_construction|e]サイズクラス。小規模なプロジェクトは複数回ビルドされる場合があります。基本国の効果は価値の移動に限定されますが、ローカル効果と儀式効果には制限がありません。\n小規模プロジェクトの各レベルの費用は通常、約 #Y 10,000@gold!#! です。"

 game_concept_tv_wonder_medium: "中規模プロジェクト"
 game_concept_tv_wonder_medium_desc: "小規模プロジェクトと大規模プロジェクトの間の [tv_wonder_construction|e] サイズ クラス。国は、同じタイプの 2 番目の中規模プロジェクトを開始することはできませんが、その基本国効果、ローカル効果、および儀式効果には制限がありません。\n中規模プロジェクトの各レベルのコストは通常、約 #Y 20,000@gold!#! です。"

 game_concept_tv_wonder_large: "大規模プロジェクト"
 game_concept_tv_wonder_large_desc: "[tv_wonder_construction|e]サイズクラス。国は、同じタイプの 2 番目の大規模プロジェクトを開始することはできませんが、その基本国効果、ローカル効果、および儀式効果には制限がありません。\n大規模プロジェクトの各レベルのコストは通常、約 #Y 30,000@gold!#! です。"

 game_concept_tv_wonder_generic: "ジェネリックワンダー"
 game_concept_tv_wonder_generic_desc: "[tv_wonder_construction|e] によって提案され、マップ上に固定された [tv_great_engineer|e] とは対照的に、[tv_wonder_small|e]、[tv_wonder_medium|e]、または [tv_wonder_large|e] スケールで自由に配置される [tv_wonder_unique|e]。これにより、[tv_wonder_ceremony|e] スタイルを選択できるようになります。"
 game_concept_tv_wonder_generic_europedia_desc: "一般的な不思議は、固定された場所に結び付けられるものではありません。[tv_wonder_survey|e] が適切な用地を確認したら、[tv_wonder_small|e] が提案した [tv_wonder_medium|e]、[tv_wonder_large|e]、または [tv_great_engineer|e] クラスのいずれかに建設する場所を国自体が選択します。小規模な汎用プロジェクトは、新しいサイトで複数回再構築することもでき、国がそのアーキタイプの儀式報酬に繰り返しアクセスできるようになります。これは、ゲーム全体で 1 か所に 1 回だけ存在する [tv_wonder_unique|e] とは異なります。"

 game_concept_tv_wonder_unique: "ユニークな不思議"
 game_concept_tv_wonder_unique_desc: "自由に配置された [tv_wonder_construction|e] とは対照的に、歴史的な [tv_wonder_generic|e] は特定のマップの位置に固定されました。ほとんどのユニークな驚異は、構築が完了すると、8 段階の [tv_wonder_ceremony|e] を自動的に進めます。代わりに、独自の専用の手動儀式を行っている人もいます。"
 game_concept_tv_wonder_unique_europedia_desc: "ユニークな驚異はキャンペーンの開始時から現実世界の 1 つの場所に関連付けられており、その場所を実際に管理している国だけがそれを構築できます。[tv_wonder_generic|e] のような自由な場所の選択はありません。その歴史的な固定性と引き換えに、MOD の 136 のユニークな驚異のうち 134 は、終了すると均一な自動 8 段階 [tv_wonder_ceremony|e] を共有し、永続的な報酬を獲得するためにそれ以上のプレイヤーの入力は必要ありません。ファロス灯台とアヤソフィアは唯一の例外で、代わりに独自のオーダーメイドの多段階の儀式を行っています。"

 game_concept_tv_wonder_domestic_support: "国内サポート"
 game_concept_tv_wonder_domestic_support_desc: "[tv_wonder_construction|e] リソースは、主要な偉大なプロジェクトを維持するエリートおよび一般大衆の意欲を表します。 100 に達すると最初の議論が終了します。サポートは最大 200 まで保存でき、討論が終了すると減衰します。"

 game_concept_tv_wonder_scale_competence: "スケールコンピテンス"
 game_concept_tv_wonder_scale_competence_desc: "[tv_wonder_survey|e] は、選択したサイトが、デザインを無理にぎこちない形にすることなく、プロジェクトの意図したサイズ、軸、基礎、公共のアプローチをどれだけうまく実現できるかを示します。 Great Project の最大レベルを 20%、40%、60%、80%、100% に設定し、レベル 6 には 100% が必要です。"

 game_concept_tv_wonder_organization_competence: "組織の能力"
 game_concept_tv_wonder_organization_competence_desc: "[tv_wonder_survey|e] は、多くの競合する注文ではなく 1 つの計画に応えるために、労働者名簿、職長、作業場、建設段階をどのように適切に行うことができるかを示します。グレート プロジェクト ワークサイトの最大レベルを 0 から 20 まで直線的に設定します。"

 game_concept_tv_wonder_logistics_competence: "物流能力"
 game_concept_tv_wonder_logistics_competence_desc: "道路、荷車、港、橋、および引き渡し地点の [tv_wonder_survey|e] 読み取り値。これにより、石工が必要なときに [tv_wonder_materials|e] が現場に到達するかどうかが決まります。"

