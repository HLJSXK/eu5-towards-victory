 tv_wonder_ownership.800.t:0 "[tv_wonder_construction|E]：ワールドワンダーセキュア"
 tv_wonder_ownership.800.d:0 "新しく取得した [SCOPE.sLocation('tv_wonder_ownership_site').GetName] のプロヴィンスには、完成した [tv_wonder_construction|E] が含まれています。その基本効果は現在、私たちのルールに答えており、当社のエンジニアは、保存された規模でさらなる作業が可能であれば、拡張サイトの可能性があると記録しました。\n\n#weak この驚異は今や私たちのものです — エンジニアリング部門でその効果をレビューし、さらに拡張できるかどうか検討してください。#!"
 tv_wonder_ownership.800.a:0 "それを仕事にしましょう。"
 tv_wonder_ownership.900.t:0 "[tv_wonder_construction|E]：失われた世界の不思議"
 tv_wonder_ownership.900.d:0 "[SCOPE.sLocation('tv_wonder_ownership_site').GetName] が失われると、そこで完成した [tv_wonder_construction|E] はレルムをサポートしなくなります。その驚異にのみ関連付けられた恒久的な国家儀式の特典は台帳から取り消されました。\n\n#weak 州が失われると、その驚異の固定特典は失われます。後で再取得される場合は、エンジニアリング部門でのステータスを確認してください。#!"
 tv_wonder_ownership.900.a:0 "損失を記録します。"
