 tv_engineering_department_standalone.1.t: "[tv_wonder_construction|E]：技術部"
 tv_engineering_department_standalone.1.d: "あなたの国には現在、エンジニアリング部門があり、その国が取り組むすべての偉大なプロジェクトの背後にある機関です。\n\nまず優秀なエンジニアを任命してください。彼らはまず、実現可能なプロジェクトの #high Conception#! を作成し、その後裁判所が国内 #high Debate#! で検討します。 #high Survey#! によって選択されたサイトが確認され、#high Construction#! 自体が開始され、プロジェクトは 4 つの部分を通じて最終レベルまで引き上げられます。完了は、永続的な報酬を与える #high Ceremony#! によってマークされます。\n\nいつでもエンジニアリング部門パネルを開いて、進捗状況を確認したり、優秀なエンジニアを任命したりできます。"
 tv_engineering_department_standalone.1.a: "分かりました。"
 tv_engineering_department_standalone.1.a.tt: "#G エンジニアリング部門#!を設立。"
