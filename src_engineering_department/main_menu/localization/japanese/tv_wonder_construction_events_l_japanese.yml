 tv_engineering_department.7000.t:0 "建設：街が現場に拍手を送る"
 tv_engineering_department.7000.d:0 "フェンス際で目に見えるいくつかの成功は、好奇心を誇りに変えます。ギルドの長老たちは名前を貸し、近隣住民は作品を王室の虚栄心として扱うのをやめ、プロジェクトは [tv_wonder_domestic_support|E] でより鋭い主張を獲得します。"
 tv_engineering_department.7000.a:0 "ギルドの長老たちの新たな善意で仕事を進めましょう。"
 tv_engineering_department.7001.t:0 "建設：地球上のより広い線"
 tv_engineering_department.7001.d:0 "新しい測定により、より広い面積に耐えることができる地盤が明らかになりました。羊皮紙の上では野心のように見えたものは今では耐えられる基盤を持ち、[tv_wonder_scale_competence|E] は前に飛び上がります。"
 tv_engineering_department.7001.a:0 "調査が証明したばかりのより広範な根拠を主張します。"
 tv_engineering_department.7002.t:0 "構造：名前と順序が適切に配置される"
 tv_engineering_department.7002.d:0 "ヤードは新しい名簿の下で目覚めます。乗務員はどこに立つべきかを知っており、事務員はどの集計が重要かを知っており、混乱により隠れる場所が少なくなったために [tv_wonder_organization_competence|E] が上昇しました。"
 tv_engineering_department.7002.a:0 "混乱が元に戻る前に、新しい名簿をロックインします。"
 tv_engineering_department.7003.t:0 "建設：道路とカートのリズム"
 tv_engineering_department.7003.d:0 "より良いルートは、道路、水道、倉庫、足場を結びます。これを使用する最初の輸送隊がほぼ時間どおりに到着し、[tv_wonder_logistics_competence|E] が急上昇しました。"
 tv_engineering_department.7003.a:0 "カートを時間どおりに動かし続けてください。"
 tv_engineering_department.7004.t:0 "建設：石はマークを超えて上昇します"
 tv_engineering_department.7004.d:0 "アクティブな部分は、光が消える前にマークを超えて上昇します。それを説明できる奇跡は一つもない。リフト、ジョイント、ハンドが適切なタイミングで結合するだけで、[tv_wonder_construction|E] の進歩が促進されます。"
 tv_engineering_department.7004.a:0 "マークを越えてリフトを進めます。"
 tv_engineering_department.7005.t:0 "施工：街頭トークターンズ"
 tv_engineering_department.7005.d:0 "現場周囲の騒音が和らぎます。それは賞賛ではありませんが、カートが通過し、議論が早く終わるのに十分な許可です。 [tv_wonder_domestic_support|E] は有効マージンだけ上昇します。"
 tv_engineering_department.7005.a:0 "カートを通過させて、議論は静まります。"
 tv_engineering_department.7006.t:0 "施工：寸法修正"
 tv_engineering_department.7006.d:0 "窮屈な角度が引き直され、側道が拡張され、記念碑の主線が再び息づきます。 [tv_wonder_scale_competence|E] に対する改善は小さいですが、実際のものです。"
 tv_engineering_department.7006.a:0 "パスを広げてデザインに呼吸を与えます。"
 tv_engineering_department.7007.t:0 "建設：庭はリズムを学ぶ"
 tv_engineering_department.7007.d:0 "失われた一連のハンドオーバーが修復されます。作業は儀式としては無味乾燥すぎますが、工具の動きを維持し、[tv_wonder_organization_competence|E] を向上させます。"
 tv_engineering_department.7007.a:0 "私たちは引き継ぎにパッチを当て、ツールを動かし続けます。"
 tv_engineering_department.7008.t:0 "建設：わだち、より良い道を見つける"
 tv_engineering_department.7008.d:0 "供給ラインの 1 つの悪い曲がりが修正されました。空で待機するカートが減り、割れた状態で到着する荷物が減り、[tv_wonder_logistics_competence|E] が向上します。"
 tv_engineering_department.7008.a:0 "さらに荷重が割れる前に悪い曲がりを矯正します。"
 tv_engineering_department.7009.t:0 "施工：ハンマーで完成間近"
 tv_engineering_department.7009.d:0 "頑固な関節がようやくフィットし、さらに 1 か月も待たずに次のスタッフが作業を開始できるようになります。 [tv_wonder_construction|E] の進歩は、最も満足のいく形で、つまり目に見える形で前進します。"
 tv_engineering_department.7009.a:0 "ついに、それが収まりました！"
 tv_engineering_department.7010.t:0 "建設：ゲートのパンマネー"
 tv_engineering_department.7010.d:0 "群衆が門に集まり、この不思議な人が貧しい人々のためのパンを食べるとつぶやいている。もし財務省が通りが見える場所で [gold|E] を開き、今すぐ支払いをすれば、愚痴は静まり [tv_wonder_domestic_support|E] は上昇するでしょうが、コインは戻ってきません。"
 tv_engineering_department.7010.a:0 "群衆の目の前で支払いを行います。"
 tv_engineering_department.7010.b:0 "台帳は公に配布しなくても十分に薄い。"
 tv_engineering_department.7011.t:0 "構成：国王の権利に疑問を抱く説教者"
 tv_engineering_department.7011.d:0 "地元の説教者は、この驚異は誇りに基づいて築かれており、国王がそれを要求する権利に基づいているわけではないと信者に告げる。王室の [legitimacy|E] を書面による布告にすれば、説教がさらに広がる前に問題は解決し、[tv_wonder_domestic_support|E] が安定するでしょう。"
 tv_engineering_department.7011.a:0 "法令を封印し、国王の言葉で問題を終わらせましょう。"
 tv_engineering_department.7011.b:0 "一人の説教者の不平不満に対する国王の布告は、強さではなく弱さのように見える。"
 tv_engineering_department.7012.t:0 "建設：共通のフィールドを分割する採石場道路"
 tv_engineering_department.7012.d:0 "新しい採石場道路は 2 つの村の共有畑をまっすぐに貫いています。 [stability|E] を費やして再定住を強制的に通過させると、道路がきれいになり、奇跡の完了を望む人々の間で [tv_wonder_domestic_support|E] が上昇します。その代償として、これらの村で得た平和が犠牲になります。"
 tv_engineering_department.7012.a:0 "再定住を命令し、道路を通させてください。"
 tv_engineering_department.7012.b:0 "2 つの村の畑には、カートのルートを短くする価値はありません。"
 tv_engineering_department.7013.t:0 "構築：外国使節は虚栄プロジェクトを嘲笑する"
 tv_engineering_department.7013.d:0 "敵対する法廷からの使者らは、この驚異を、その背後にある財務省にとって大きすぎる虚飾のプロジェクトであると呼んでいる。豪華なレセプションに [prestige|E] を費やせば、持ち帰るストーリーが変わり、[tv_wonder_domestic_support|E] が上がる可能性があります。しかし、ゲストへのお世辞に一度費やされた王冠の地位は、簡単には補充されません。"
 tv_engineering_department.7013.a:0 "レセプションに費やして、使者が持ち帰るものを変更します。"
 tv_engineering_department.7013.b:0 "外国のゴシップは王室の地位を費やす価値がない。"
 tv_engineering_department.7014.t:0 "建設：貴族の狩猟場が材木置き場に"
 tv_engineering_department.7014.d:0 "不思議な石工は、木材を準備するために貴族の狩猟の範囲を望んでいます。彼はそれを認めるでしょう、しかし、王冠は貴族の間で[estate_satisfaction|E]にカウントされる必要があるのは好意のためだけです - 今費やしても、材木が動き始めればまだ[tv_wonder_domestic_support|E]を持ち上げることができます。"
 tv_engineering_department.7014.a:0 "恩恵を与えて、木材の土地を手に入れてください。"
 tv_engineering_department.7014.b:0 "ある貴族の善意は彼に借金を負う価値はありません。"
 tv_engineering_department.7015.t:0 "建設：教区の鐘は青銅製を求められる"
 tv_engineering_department.7015.d:0 "この不思議の創設者たちは、付属品に再鋳造するために教区の鐘を徴発したいと考えています。司祭は空の鐘楼から目をそらしますが、聖職者の間では [estate_satisfaction|E] の費用がかかります - まだ未完成の足場よりも [tv_wonder_domestic_support|E] のほうが良い金額です。"
 tv_engineering_department.7015.a:0 "きちんと尋ねて、鐘を鋳物工場に渡してください。"
 tv_engineering_department.7015.b:0 "空の鐘楼は、建具の価値よりも多くの話題を呼びます。"
 tv_engineering_department.7016.t:0 "建設：マーケット広場を占拠するサプライカート"
 tv_engineering_department.7016.d:0 "配達日になると、不思議な物資カートが市場広場を妨害し続けます。ギルドマスターは荷車の周りに自分たちの屋台のルートを変更しますが、それは住民の間で [estate_satisfaction|E] を使い果たします。広場が荷車との戦いをやめても、そのコストは依然としていくらかの [tv_wonder_domestic_support|E] を買い戻すことになります。"
 tv_engineering_department.7016.a:0 "ギルドに直接聞いてカートを通してもらいましょう。"
 tv_engineering_department.7016.b:0 "カーターに罰金を科すのは、ギルドに好意を求めるよりも簡単です。"
 tv_engineering_department.7017.t:0 "建設：コルヴィーは収穫を過ぎても開催される"
 tv_engineering_department.7017.d:0 "監督官は、収穫を過ぎても捕らえられた徴兵団に、霜が降りる前に基礎を完成させるよう望んでいる。村の長老たちは同意するだろうが、農民の間では[estate_satisfaction|E]費用がかかる――今使っても、冬の間中途半端に掘ったままの基礎よりも[tv_wonder_domestic_support|E]が高くなるだろう。"
 tv_engineering_department.7017.a:0 "はっきりと言って、収穫を過ぎるまでギャングを引き留めてください。"
 tv_engineering_department.7017.b:0 "基礎の上で収穫を待つことはできません。"
 tv_engineering_department.7018.t:0 "建設中：長屋が立ちはだかる"
 tv_engineering_department.7018.d:0 "石工らは、敷地が狭すぎて、隣の長屋の列を取り壊さずに次のコースを高くするには無理だと主張している。完全に発注すると、建物が解体されるにつれて現場で [development|E] が減ることになりますが、作業とそれに伴う [tv_wonder_domestic_support|E] は再び前進することになります。"
 tv_engineering_department.7018.a:0 "列を取り壊し、敷地を広げるよう命じます。"
 tv_engineering_department.7018.b:0 "立ち退かされたテナントが並ぶ通りよりも、狭い敷地の方が住みやすい。"
 tv_engineering_department.7019.t:0 "建設：一般貿易が敷地内に曲がる"
 tv_engineering_department.7019.d:0 "地元の荷車職人や石切職人は、敷地への供給を維持するために通常の仕事から撤退した。これを続ければ、通常のビジネスが間薄になるにつれて現場で [prosperity|E] が失われることになりますが、それでも安定した納品は [tv_wonder_domestic_support|E] を持つ価値があるとみなされるでしょう。"
 tv_engineering_department.7019.a:0 "地元貿易が工事に向けて曲げ続けてもらいましょう。"
 tv_engineering_department.7019.b:0 "町は、現場がより迅速な配送を必要とするよりも、通常の取引を必要としています。"
 tv_engineering_department.7020.t:0 "建設：首都の橋は石工を待つ"
 tv_engineering_department.7020.d:0 "首都自身の橋の修理は、石工たちがこの驚異に引っ張られたために行き詰まっている。橋が未完成のままそこに留めておくと首都で [development|E] の費用がかかることになるが、この驚異の進歩、そして [tv_wonder_domestic_support|E] を動かし続けることができるだろう。"
 tv_engineering_department.7020.a:0 "石工を不思議な場所に留めて、橋が完成するのを待ちましょう。"
 tv_engineering_department.7020.b:0 "首都自身の橋は、驚異のスケジュールを待つことができません。"
 tv_engineering_department.7021.t:0 "建設：首都の木材をエージェントが買い占める"
 tv_engineering_department.7021.d:0 "驚異の代理人たちは、通常の市場では太刀打ちできない価格で資本の木材や石材を買い占めている。購入を継続すると、サイト周辺での貿易が減少するにつれて首都の [prosperity|E] が枯渇することになりますが、作品の供給と [tv_wonder_domestic_support|E] の供給は維持されます。"
 tv_engineering_department.7021.a:0 "Let the buying continue and feed the site."
 tv_engineering_department.7021.b:0 "首都自身の市場が一つのプロジェクトのために枯渇してはならない。"
 tv_engineering_department.7022.t:0 "Construction：A Doubled Night Shift Is Proposed"
 tv_engineering_department.7022.d:0 "監督は、最後の霜で失われた日数を補うために、夜勤を2倍にすることを望んでいます。これを発注すると、余分な時間が犠牲となり、現場で苦労している [population|E] は消耗しますが、作業は前進し、[tv_wonder_domestic_support|E] も上昇します。"
 tv_engineering_department.7022.a:0 "シフトを2倍にして仕事を推進します。"
 tv_engineering_department.7022.b:0 "疲れ果てた労働者は、休んでいる労働者よりも建設が遅くなります。"
 tv_engineering_department.7023.t:0 "構造：会計机の上のより広い足場"
 tv_engineering_department.7023.d:0 "石工長は、秋の雨が降る前に追加のコースが建設されれば地面がそれを受け入れるだろうと主張して、財務担当の机の上にさらに広い足場計画を置いています。会計担当者は、追加された石と手の金を今すぐ解放することができますが、計画は来年の調査を待つこともできます。"
 tv_engineering_department.7023.a:0 "金を解放し、雨が降る前に石工に広い足場を敷かせます。"
 tv_engineering_department.7023.b:0 "コインを押し戻します。 the rains will still be there next spring."
 tv_engineering_department.7024.t:0 "施工例：測量杭がフェンスに止まっている場合"
 tv_engineering_department.7024.d:0 "測量士の杭が隣家のフェンスの境界線で短く止まり、隣人が杭の通行を拒否した。今日、王室令状によって境界線が確定することになるが、係争中の生け垣の上で王室の名前を引用することは注目されないわけではない。"
 tv_engineering_department.7024.a:0 "令状を送り、広い境界線の後ろに王冠の名前を入れてください。"
 tv_engineering_department.7024.b:0 "フェンスを立てておきましょう。王室の名前はヘッジ紛争に費やされることはない。"
 tv_engineering_department.7025.t:0 "建設：より広い計画が共通点を越える"
 tv_engineering_department.7025.d:0 "より広い計画は、集落の放牧地をまっすぐに通っています。今すぐ村内に境界石を移動させれば調査の問題は解決するだろうが、世帯は誰が境界石を移動させたかを忘れないだろう。"
 tv_engineering_department.7025.a:0 "石を移動し、より大きな設置面積に調査を落ち着かせます。"
 tv_engineering_department.7025.b:0 "共通のものは現状のままにしておきます。 a resentful village is not worth a wider base."
 tv_engineering_department.7026.t:0 "構成：外国人メイソンの印鑑の代償"
 tv_engineering_department.7026.d:0 "外国人のマスターメイソンが、より広いデザインの認証を申し出るが、それは裁判所の名前が本国にある自分のギルドの記録に後援者として名乗りを上げた場合に限られる。この承認により、サイジングの問題はここで解決されるでしょう。 the asking is public and cannot be unspent."
 tv_engineering_department.7026.a:0 "承認を与え、より広い範囲でのマスターの言葉を受け入れてください。"
 tv_engineering_department.7026.b:0 "裁判所の名前は伏せます。外国のギルドの帳簿はそれを使う場所ではありません。"
 tv_engineering_department.7027.t:0 "建設：男爵の狩りを横切る足場計画"
 tv_engineering_department.7027.d:0 "より広い足場計画は、地元の男爵が長い間狩猟に使用してきた地面を横切ります。測量士が終わるまで舌を押さえるように彼に頼めば、よりスケールの大きな音が証明されるだろうが、ここで費やされる崇高な忍耐は、彼が戻ってくることを期待する忍耐である。"
 tv_engineering_department.7027.a:0 "男爵の忍耐力を求めて、測量士に狩猟場を渡り終えてもらいましょう。"
 tv_engineering_department.7027.b:0 "男爵の敷地を巡るルート。彼の善意は調査のために費やす価値はありません。"
 tv_engineering_department.7028.t:0 "建設：聖地の片隅を望む計画"
 tv_engineering_department.7028.d:0 "より広範な計画では、記憶が残る前から教区が保持してきた聖別された土地の一角が必要となる。司祭たちは、適切に要求すれば、その全域の測量を許可するだろうが、聖職者に足場のラインのために神聖な土地を明け渡すよう求めるのは、援助ではなく、費やした好意である。"
 tv_engineering_department.7028.a:0 "司祭たちに隅を譲ってもらい、広範囲にわたる調査を確認してもらいます。"
 tv_engineering_department.7028.b:0 "調査は古い境界線の内側に留めてください。聖別された地は試練を与える場所ではありません。"
 tv_engineering_department.7029.t:0 "建設：羊毛商人の小道を募集中"
 tv_engineering_department.7029.d:0 "設置面積が広ければ、羊毛商人が市の日に使う小道を飲み込んでしまうだろう。ギルドの市会議員は頼まれれば迂回を許可するだろうが、自分たちの道路を建設現場に貸している住民たちは、調査よりも長くその不便さを覚えている。"
 tv_engineering_department.7029.a:0 "市会議員に迂回路を尋ね、車線の向こう側に広い踏み跡があることを確認してください。"
 tv_engineering_department.7029.b:0 "商人のレーンは放っておいてください。市場の好意は足場のラインに費やされることはありません。"
 tv_engineering_department.7030.t:0 "建設：村に掘ってもらいます"
 tv_engineering_department.7030.d:0 "職長は、近くの村が自分たちの畑の手入れをせずに掘削に手を出せば、広い足場が健全であることが1週間以内に証明できるだろうと語った。村はクサガメの要望に応じるだろうが、植栽の時期に課せられる徴収金は秋まで忘れられない。"
 tv_engineering_department.7030.a:0 "村の徴収金に電話して、週が終わる前に広い足場を掘ってください。"
 tv_engineering_department.7030.b:0 "村は畑を離れないようにしてください。職長は代わりに雇われる人を待つことができます。"
 tv_engineering_department.7031.t:0 "建設：敷地内に建つ作業場が並ぶ"
 tv_engineering_department.7031.d:0 "より広い敷地面積を確保する唯一の方法は、敷地の端にすでに建っている作業場列を撤去することです。彼らの石と足場は新しい計画にそのまま組み込まれることになるが、その場所にすでに建設されたものを取り壊すことは元に戻せないことである。"
 tv_engineering_department.7031.a:0 "列を引き下げて、その石を広い面積に折り畳みます。"
 tv_engineering_department.7031.b:0 "作業場はそのままにしておきます。サイトは別の方向に成長する可能性があります。"
 tv_engineering_department.7032.t:0 "建設：木材商人は買い手を選ぶよう求められる"
 tv_engineering_department.7032.d:0 "現場の材木商人は、通常の取引を国王の契約のために取っておく場合、今日、より広い足場を埋めるための在庫と荷車を持っています。サイトの市場は作品に応じるだろうが、一人の買い手に向かって曲がった貿易ルートは自然には元に戻らない。"
 tv_engineering_department.7032.a:0 "地元の取引を工場まで曲げて、より広い敷地のために埋め立て地を運びます。"
 tv_engineering_department.7032.b:0 "商人には通常の商売を任せてください。フィルは別の方法で調達できます。"
 tv_engineering_department.7033.t:0 "建設：首都の道路補修業者が他所で募集中"
 tv_engineering_department.7033.d:0 "今月、確認調査を実施できる自由な作業員は、首都自身の道路補修業者とホールライトだけだ。首都自身の修理からそれらを撤去すれば、より広い敷地面積の問題は解決するだろうが、首都の道路は彼らが残したギャップを示すことになるだろう。"
 tv_engineering_department.7033.a:0 "首都の乗組員を再配置し、より広い敷地を確認させます。"
 tv_engineering_department.7033.b:0 "首都の修復は放っておいてください。調査は他の場所でアイドル状態のハンドを待つことができます。"
 tv_engineering_department.7034.t:0 "建設：ギルドホールは今シーズンのテイクを提供します"
 tv_engineering_department.7034.d:0 "首都のギルドホールは、冬のフェアが終了する前にコインが引き出されることを条件に、今シーズンの取引額から確認調査を引き受けると申し出ています。首都の市場はより広いフットプリントを証明するだろうが、シーズンの結果が一つの驚異に向けられているということは、ギルドホールが答えを求めているシーズンである。"
 tv_engineering_department.7034.a:0 "見本市が閉まる前に、首都の貿易取引を活用し、より広いフットプリントを確認してください。"
 tv_engineering_department.7034.b:0 "ギルドホールの帳簿は放っておいてください。代わりに調査は財務省を待つことができます。"
 tv_engineering_department.7035.t:0 "工事中：乗組員には休息日をお願いします"
 tv_engineering_department.7035.d:0 "職長は、すでに現場にいる作業員が勤務の合間に休むのではなく、休みの日まで働いていれば、今月は足場が広いことが証明できるだろうと語った。この調査により、より大きな計画が解決されることになるが、通常のペースを超えて追い出された労働者全員が長く労働者として働き続けるわけではない。"
 tv_engineering_department.7035.a:0 "今月は乗組員を休息日に運転し、より広い足場を確立しましょう。"
 tv_engineering_department.7035.b:0 "乗組員には休息日を守らせてください。調査はペースが遅くなるまで待つことができます。"
 tv_engineering_department.7036.t:0 "建設：シフトボードの事務員を募集します"
 tv_engineering_department.7036.d:0 "現場監督は、適切な作業員にシフトボードを書き直して、作業員が実際に読める場所に掲示してもらいたいと考えています。財務省はその男性とそのインクを対価で提供することができ、[tv_wonder_organization_competence|E] は新しいボードに従うことになります。"
 tv_engineering_department.7036.a:0 "今日は事務員を雇って新しいボードを掲示します。"
 tv_engineering_department.7036.b:0 "古いボードはこれほど長持ちします。もう少し長持ちする可能性があります。"
 tv_engineering_department.7037.t:0 "工事中：二人の職長がお互いの命令を拒否"
 tv_engineering_department.7037.d:0 "現場の2人のギルド乗組員は互いの職長からの命令を拒否しており、この口論により今週2回朝勤が滞っている。国王の [legitimacy|E] を記載した令状のみが両者の間の優先権を決定し、議論が終了すると [tv_wonder_organization_competence|E] が続きます。"
 tv_engineering_department.7037.a:0 "令状は起草され、封印されます。乗組員はそれに答えるか、誰も答えない。"
 tv_engineering_department.7037.b:0 "王室の言葉は、どちらの石工がより激しく罵倒するかを決めることに費やされるわけではない。"
 tv_engineering_department.7038.t:0 "建設：収穫を忘れた旧ロタ"
 tv_engineering_department.7038.d:0 "徴兵された村の労働力は、収穫量をまったく考慮しない古いスケジュールに基づいて作成されており、畑で労働力が必要になると、乗組員の半数が立ち去ります。地元の反対を押し切って勤務表を強行すれば、国の[stability|E]が減ることになるが、最終的には乗務員が決められた時間を守り、[tv_wonder_organization_competence|E]もそれに続くことになる。"
 tv_engineering_department.7038.a:0 "私たちはロータを推進します。収穫は一度だけ不思議を待つことができます。"
 tv_engineering_department.7038.b:0 "今、この問題を強制しても、不足がさらに悪化するだけです。"
 tv_engineering_department.7039.t:0 "建設：石工は新しい監督に応じない"
 tv_engineering_department.7039.d:0 "親方石工たちは、シフトを再編成するために派遣された若い監督に返答せず、庭全体から聞こえるところでそう言う。裁判所の [prestige|E] によって裏付けられた名前だけが、彼らを同調させるのに十分な重みを持ち、[tv_wonder_organization_competence|E] は彼らの遵守に従うことになります。"
 tv_engineering_department.7039.a:0 "私たちは監督者に裁判所の名前を貸します。石工たちは少なくともそれに答える。"
 tv_engineering_department.7039.b:0 "若い監督の権威は宮殿から借りてくるものではなく、庭で獲得されるべきである。"
 tv_engineering_department.7040.t:0 "建設：隣人の領主が家令を差し出す"
 tv_engineering_department.7040.d:0 "隣の領主は、新しい乗組員名簿を作成するために自分の家令を貸し出すことを申し出ました。この男は、20年間にわたってある荘園の当番を務めてきた男です。恩恵を与えるには貴族の間で [estate_satisfaction|E] の費用がかかりますが、家令の名簿は [tv_wonder_organization_competence|E] をもたらします。"
 tv_engineering_department.7040.a:0 "私たちは家令を受け入れ、領主に対して当然の義務を負っています。"
 tv_engineering_department.7040.b:0 "その特定の領主に対する恩義は、きちんとした名簿よりも価値があります。"
 tv_engineering_department.7041.t:0 "構造：大聖堂の鐘へのシフトホーンの答え"
 tv_engineering_department.7041.d:0 "この場所のシフトホーンは常に大聖堂の鐘に従っており、鐘は不思議に合わせて動かされることはありません。シフト変更を知らせるために支部に追加で 1 時間鳴らしてもらうと、聖職者の間で [estate_satisfaction|E] の費用がかかりますが、最終的には職員が時間通りにポストを引き継ぎ、[tv_wonder_organization_competence|E] をもたらします。"
 tv_engineering_department.7041.a:0 "私たちは、どんなに不平を言っても、追加のベルを支部に求めます。"
 tv_engineering_department.7041.b:0 "鐘は神の時間を告げるものであり、職長の交代を知らせるものではありません。"
 tv_engineering_department.7042.t:0 "建設：市場に並ぶ資材カート"
 tv_engineering_department.7042.d:0 "現在、資材カートが 1 日に 2 回マーケット広場に並び、ギルドの出店者は騒音と泥のせいで最高の時間を失っています。固定スケジュールでカートのために広場を片付けるには、住民の間で [estate_satisfaction|E] の費用がかかりますが、最終的には乗組員が計画できるスケジュールでカートが到着し、[tv_wonder_organization_competence|E] がかかります。"
 tv_engineering_department.7042.a:0 "私たちはスケジュールを決めて、広場を片付けたり、露店を片付けたり、露店を出さなかったりします。"
 tv_engineering_department.7042.b:0 "市場は驚異を養う前に町を養います。"
 tv_engineering_department.7043.t:0 "建設：村に第二回ローテーションを要請"
 tv_engineering_department.7043.d:0 "周囲の村々は、現在の乗組員がポストを倍増して崩壊する前に、2回目のローテーションを送るよう求められる。田植えから収穫までの間に自分の畑からそれらを引き抜くには、農民の間で [estate_satisfaction|E] の費用がかかりますが、丸 2 回のローテーションにより、最終的に現場は適切なシフトを実行できるようになり、[tv_wonder_organization_competence|E] がもたらされます。"
 tv_engineering_department.7043.a:0 "私たちは 2 番目のローテーションを呼び出し、フィールドに順番を待ってもらいます。"
 tv_engineering_department.7043.b:0 "秋に空き地になることは、不規則なシフトスケジュールよりも国にとって大きなコストをもたらします。"
 tv_engineering_department.7044.t:0 "工事中：中継ヤードが狭すぎて通れません"
 tv_engineering_department.7044.d:0 "中継ヤードは作業員が作業を止めずにすれ違うには狭すぎ、もつれ合いには毎朝1時間の費用がかかる。適切なヤードを確保するために隣接するブロックを撤去すると、現場では [development|E] が消費されますが、作業員は最終的に衝突することなく移動し、[tv_wonder_organization_competence|E] をもたらします。"
 tv_engineering_department.7044.a:0 "私たちはブロックを取り壊し、乗組員に移動できるスペースを与えます。"
 tv_engineering_department.7044.b:0 "ブロックは残ります。狭い庭は取り壊された庭よりも安いです。"
 tv_engineering_department.7045.t:0 "建設：地元のカーターは静かにリダイレクトされます"
 tv_engineering_department.7045.d:0 "以前は現場の用事をこなしていた地元のカーターやポーターは、代わりに不思議な資材を運ぶ仕事にひそかに方向転換され、その結果、工場周辺の通常の取引は希薄になった。協定を正式に締結し、その手を驚異のスケジュールに拘束するには、現場で [prosperity|E] の費用がかかりますが、行方不明のカートを待つ必要がなくなった乗組員からは [tv_wonder_organization_competence|E] が発生します。"
 tv_engineering_department.7045.a:0 "私たちは取り決めを正式にします。カーターズは今、驚異のスケジュールに答えます。"
 tv_engineering_department.7045.b:0 "通常の取引により、サイトの人々は食料を確保されています。驚異はカートの順番を待つことができます。"
 tv_engineering_department.7046.t:0 "建設：首都が職長を貸し出す"
 tv_engineering_department.7046.d:0 "首都自身の建設工事では、この驚異のシフト名簿の書き直しを手伝うために職長を貸し出しており、その融資により首都自身のプロジェクトは不足している。融資を永久に行うには首都で [development|E] の費用がかかりますが、ワンダー サイトには名簿の管理方法を実際に知っている職長が常駐し、[tv_wonder_organization_competence|E] をもたらします。"
 tv_engineering_department.7046.a:0 "私たちはローンを永久にします。首都のプロジェクトは彼なしでもなんとかなるだろう。"
 tv_engineering_department.7046.b:0 "首都自身の作品は、驚異が別の監督を必要とする以上に、監督の復帰を必要としている。"
 tv_engineering_department.7047.t:0 "建設：港の秩序が入れ替わる"
 tv_engineering_department.7047.d:0 "首都の商人たちは、不思議な材料が最初に港から運び出されるように配達日を静かに再調整されており、首都の通常の取引は現在、不思議な荷車の後ろで待機しています。港の新しい注文を確認するには首都で [prosperity|E] の費用がかかりますが、最終的に現場は作業員がシフトを組むことができるスケジュールで資材を受け取り、[tv_wonder_organization_competence|E] をもたらします。"
 tv_engineering_department.7047.a:0 "私たちは港で新しい注文を確認します。販売者は時間内に調整します。"
 tv_engineering_department.7047.b:0 "首都自身の事業は、他の都市の建設現場の後ろで待機すべきではありません。"
 tv_engineering_department.7048.t:0 "建設：再訓練により乗組員は倍増するよう求められる"
 tv_engineering_department.7048.d:0 "この現場では、新しい名簿に必要な再訓練を行うための完全な作業員が 2 人不足しているため、すでに配置されている作業員には、新しいスケジュールが定着するまでそのポストを 2 倍にするよう求められています。重労働の [population|E] を何週間も現場でこれほどハードに運転するのは多大な費用がかかりますが、最終的には再トレーニングが定着し、[tv_wonder_organization_competence|E] が得られます。"
 tv_engineering_department.7048.a:0 "今のところ投稿を 2 倍にします。新しい名簿には苦労する価値がある。"
 tv_engineering_department.7048.b:0 "疲れきった乗組員は何も学びません。再トレーニングはハンドが休むまで待つことができます。"
 tv_engineering_department.7049.t:0 "構造：1台のフォードがすべてのカートをバックアップ"
 tv_engineering_department.7049.d:0 "1 台の狭い浅瀬が、敷地に向かうすべての荷車を後退させています。補給官は今 [gold|E] を望んでいます。板張りと有償の橋梁大工の乗組員のためにです。そうすれば、列が道路自体よりも長くなる前に [tv_wonder_logistics_competence|E] が再び移動できるようになります。"
 tv_engineering_department.7049.a:0 "橋大工にお金を払って浅瀬を空けてください。"
 tv_engineering_department.7049.b:0 "財務省には、そのコインを水たまりを渡るよりも有効な用途がある。"
 tv_engineering_department.7050.t:0 "建設：地主が護送船団通行を拒否"
 tv_engineering_department.7050.d:0 "新しいルート沿いの地主は、王室の令状なしに荷車が畑を横切ることを拒否している。ここで王冠の [legitimacy|E] を費やすとゲートが開き、[tv_wonder_logistics_competence|E] が前進できるようになりますが、この道だけ、そして今日だけです。"
 tv_engineering_department.7050.a:0 "令状を発行し、カートのフィールドを開きます。"
 tv_engineering_department.7050.b:0 "国王の言葉は、すべての頑固な地主に費やされるわけではありません。"
 tv_engineering_department.7051.t:0 "建設：村の緑を貫く荷車道"
 tv_engineering_department.7051.d:0 "古い荷馬車道は村の緑の中を真っ直ぐに走っており、道路管理者たちは家 3 軒と井戸 1 つを移動してその道を広げることを望んでいます。この命令は [tv_wonder_logistics_competence|E] を進めることになりますが、不平不満を残したまま王冠の [stability|E] を犠牲にすることになります。"
 tv_engineering_department.7051.a:0 "命令を出しなさい、家に帰りなさい、そして地獄に落ちてください。"
 tv_engineering_department.7051.b:0 "村の緑を守りましょう。道路はその周りで曲がることができます。"
 tv_engineering_department.7052.t:0 "建設：予備馬だけが別のギルドに所属"
 tv_engineering_department.7052.d:0 "隣の州の馬車ギルドは、レンタル用の予備の荷馬を唯一所有しています。その主人はそれらを貸して、[tv_wonder_logistics_competence|E] に追いつくようにしますが、これは無制限ではない法廷の [prestige|E] から費やされる好意としてのみです。"
 tv_engineering_department.7052.a:0 "お願いをして馬を道路に送り出しましょう。"
 tv_engineering_department.7052.b:0 "訴える価値のある借金については裁判所の名誉を守りましょう。"
 tv_engineering_department.7053.t:0 "建設：石を求めて貴族の馬車チームを募集中"
 tv_engineering_department.7053.d:0 "道路管理者たちは荷馬車が不足しており、地元貴族の馬車チームを客の代わりに石を運ぶ仕事に就かせたいと考えている。 [tv_wonder_logistics_competence|E] は地位を高めるでしょうが、貴族の間では [estate_satisfaction|E] の費用がかかることになり、貴族たちはその不便さに不満を漏らすでしょう。"
 tv_engineering_department.7053.a:0 "馬車を徴発して石を運ぶ場所に置きます。"
 tv_engineering_department.7053.b:0 "貴族には馬車を残してください。他の場所でワゴンを見つけてください。"
 tv_engineering_department.7054.t:0 "建設：修道院の倉庫を募集しています"
 tv_engineering_department.7054.d:0 "最寄りの修道院にはルート沿いに唯一の乾燥倉庫があり、道路管理者らは穀物や道具を保管するためにそこを空にすることを望んでいる。それをクリアすれば [tv_wonder_logistics_competence|E] は助かるでしょうが、誰の馬車がそれを埋めたのか忘れない聖職者の間では [estate_satisfaction|E] の費用がかかることになります。"
 tv_engineering_department.7054.a:0 "倉庫を空にして物資を積み上げます。"
 tv_engineering_department.7054.b:0 "修道院の店舗はそのままにしておきます。"
 tv_engineering_department.7055.t:0 "建設：コンボイにはマーケット広場が必要です"
 tv_engineering_department.7055.d:0 "船団が荷馬車を方向転換するには町のマーケット広場が必要ですが、その広場はマーケットの日でもあります。屋台を閉めれば、正午までに荷車が移動して[tv_wonder_logistics_competence|E]を助けることになるが、屋台を閉めたままの住民のうち[estate_satisfaction|E]が犠牲となる。"
 tv_engineering_department.7055.a:0 "市場を閉めて荷馬車を通してください。"
 tv_engineering_department.7055.b:0 "市場は開いたままです。ワゴンは一日待つことができます。"
 tv_engineering_department.7056.t:0 "建設：泥濘が道路を飲み込む"
 tv_engineering_department.7056.d:0 "道路の一部がぬかるみになってしまい、牛チームだけではそこを通り抜けることはできません。村の牛と背中をロープに掛ければ問題は解決し[tv_wonder_logistics_competence|E]は助かりますが、春の田植えに牛が必要な農民に[estate_satisfaction|E]費用がかかることになります。"
 tv_engineering_department.7056.a:0 "村の牛と背中をロープにつないでください。"
 tv_engineering_department.7056.b:0 "農民たちに春の田植えに備えて牛を飼わせてください。"
 tv_engineering_department.7057.t:0 "構造：ステージヤードにワゴンが置けない"
 tv_engineering_department.7057.d:0 "現場の中継ヤードは、毎日到着するワゴンにとっては狭すぎる。端にある建設途中の倉庫を片付けると、[tv_wonder_logistics_competence|E] が動作するためのスペースが空きますが、すでにそれらの倉庫に埋め込まれているサイトの [development|E] が犠牲になります。"
 tv_engineering_department.7057.a:0 "倉庫を片付けて庭を広げます。"
 tv_engineering_department.7057.b:0 "倉庫を保管してください。ワゴンは外に並ぶことができます。"
 tv_engineering_department.7058.t:0 "構造：宿屋の主人は最初に護送船団に仕えるように言われる"
 tv_engineering_department.7058.d:0 "現場近くの宿屋の主人と車夫は、まず不思議な船団のために予備の在庫を確保し、残った分だけを他の人に売るように言われている。これにより、[tv_wonder_logistics_competence|E] への供給が維持されますが、ローカル取引が減少するため、サイトの [prosperity|E] が犠牲になります。"
 tv_engineering_department.7058.a:0 "まず護送船団のために在庫を確保してください。"
 tv_engineering_department.7058.b:0 "町はいつものように貿易しましょう。"
 tv_engineering_department.7059.t:0 "建設：首都の道路舗装作業員を募集中"
 tv_engineering_department.7059.d:0 "首都の舗装作業員が市場通りの中継の途中で、道路管理者から代わりに現場までのルートのわだちを固めるよう依頼された。それらを再割り当てすると、[tv_wonder_logistics_competence|E] が前進することになりますが、その代償として、道路が半分石畳のままである首都の [development|E] が犠牲になります。"
 tv_engineering_department.7059.a:0 "乗組員を道路から引き離し、ルートに送り込みます。"
 tv_engineering_department.7059.b:0 "まずは市場通りを終えてください。ルートは待つことができます。"
 tv_engineering_department.7060.t:0 "建設：首都の穀倉地帯がルートに求められています"
 tv_engineering_department.7060.d:0 "首都の門に最も近い穀物倉庫は、そのルートに必要な貨車をストックする最も早い方法であり、道路管理者たちは穀物倉庫を開くことを望んでいます。準備金を売却することは、[tv_wonder_logistics_competence|E] の成長を助けるだろうが、首都圏の市場が一時的に低迷する中、[prosperity|E] は犠牲になる。"
 tv_engineering_department.7060.a:0 "穀倉を開けて荷車を積み込みます。"
 tv_engineering_department.7060.b:0 "痩せる季節には穀倉を閉めておきます。"
 tv_engineering_department.7061.t:0 "建設：作業員に残務荷物の積み降ろしを依頼"
 tv_engineering_department.7061.d:0 "現場の労働者だけが、バックアップされたワゴンから手を自由に降ろすことができ、職長は彼らに通常の仕事をやめて、ロープでの追加シフトに就いてほしいと考えている。 [tv_wonder_logistics_competence|E] を移動させることになりますが、現場では余分な時間で消耗した [population|E] を使用します。"
 tv_engineering_department.7061.a:0 "労働者を追加のシフトに配置し、未処理の仕事を解消します。"
 tv_engineering_department.7061.b:0 "労働者には通常の仕事を続けてもらいましょう。"
 tv_engineering_department.7062.t:0 "建設：コイン不足でクレーンが停止"
 tv_engineering_department.7062.d:0 "有給の作業員が不足しているため、昇降クレーンは 3 日おきに稼働していないが、財務省職員は、コインは倉庫に数えられずに眠っていると断言している。今それを放せば、霜が降りる前にロープを手に戻すことになるだろう。"
 tv_engineering_department.7062.a:0 "ストロングルームを開き、[gold|E] をダブルシフトに費やして、[tv_wonder_construction|E] の進捗を購入します。"
 tv_engineering_department.7062.b:0 "倉庫を密閉したままにしておきます。乗務員は通常の給料日に待機します。"
 tv_engineering_department.7063.t:0 "構成：石工は王冠の独自の印章を要求"
 tv_engineering_department.7063.d:0 "石工たちは、知事のではなく国王自身の印が押された令状がなければ、係争中の境界石を通過することを拒否している。命令に主権者の名前を載せれば今日問題は解決するだろうが、採石業者に費やされる令状は裁判所と議会に1件減る。"
 tv_engineering_department.7063.a:0 "統治者の名前で令状を封印し、[legitimacy|E] を費やして境界石を越える [tv_wonder_construction|E] の進行状況を購入します。"
 tv_engineering_department.7063.b:0 "王家の印章を保留し、知事自身に境界線を主張させます。"
 tv_engineering_department.7064.t:0 "建設：2つの集落が輸送道路を遮断"
 tv_engineering_department.7064.d:0 "2つの集落が計画された輸送道路にまたがって位置しており、その村長は二度もはっきりとノーを突きつけている。それらをわきに置けと命令すれば、一週間以内に道は開けられるだろうが、その代償として、前回の不作以来王冠が彼らとともに保ってきた静寂が犠牲となる。"
 tv_engineering_department.7064.a:0 "集落に道を譲るよう命令し、[stability|E] を費やして運搬道路に沿った [tv_wonder_construction|E] の進行状況をクリアします。"
 tv_engineering_department.7064.b:0 "運搬道路のルートを村落の周りに変更し、首長はそのままにします。"
 tv_engineering_department.7065.t:0 "構築：ギルドマスターは行列を飛び越えるために自分の値段を決める"
 tv_engineering_department.7065.d:0 "石切り職人のギルドマスターは、法廷が前回の国賓訪問以来の恩義を訴えた場合に限り、不思議な石工の列に並ぶことはない。今尋ねると、注文は台帳の先頭に移動しますが、声に出して名前を付けた好意は費やされた好意です。"
 tv_engineering_department.7065.a:0 "好意を呼び掛け、[prestige|E] を費やして注文を進め、[tv_wonder_construction|E] の進捗を購入します。"
 tv_engineering_department.7065.b:0 "順番をそのままにし、好意は後で取っておきます。"
 tv_engineering_department.7066.t:0 "構造：領主が家に賦課金を差し出す"
 tv_engineering_department.7066.d:0 "地元の領主は、最後の招集の後に部下がシーズンオフを約束されていたことを誰も言及しないことを条件に、来月中の石を運ぶために自分の家に徴収金を支払うと申し出た。彼のスチュワードはすでに名簿の草案を作成している。"
 tv_engineering_department.7066.a:0 "領主の徴収金を受け取り、貴族の [estate_satisfaction|E] を費やして [tv_wonder_construction|E] の進歩を購入します。"
 tv_engineering_department.7066.b:0 "徴税を拒否し、領主の部下に約束の季節を守らせてください。"
 tv_engineering_department.7067.t:0 "建設：修道院の救貧院基金が木材をカバーできる可能性がある"
 tv_engineering_department.7067.d:0 "修道院の救貧院基金は今四半期に多額の資金を積んでいるが、前回の報告書では、国王がただほのめかすのではなく率直に要請してくれれば、足場用の木材を賄える可能性があるとほのめかしていた。率直に尋ねることは、この章で覚えておく部分です。"
 tv_engineering_department.7067.a:0 "前者に率直に尋ね、聖職者に足場用木材に [estate_satisfaction|E] を費やし、[tv_wonder_construction|E] の進行状況を購入します。"
 tv_engineering_department.7067.b:0 "救貧院に資金を提供してもらい、他の場所で木材を見つけてください。"
 tv_engineering_department.7068.t:0 "建設：市の日にワゴン列車が絡む"
 tv_engineering_department.7068.d:0 "不思議な場所に向かうワゴン列車は、同じ 3 つの角で市場の日の交通に絡まり続けます。配達日に取引するためにこれらの通りを閉鎖すれば、ルートはすぐに混乱することになるが、露天商はその習慣の時間を完全に失うことになる。"
 tv_engineering_department.7068.a:0 "配達日には道路を閉鎖し、強盗の [estate_satisfaction|E] を使って [tv_wonder_construction|E] の進行状況を購入します。"
 tv_engineering_department.7068.b:0 "市場の通りを開いたままにし、ワゴンを順番に待ってください。"
 tv_engineering_department.7069.t:0 "工事：土塁工事は掘削作業員に依頼"
 tv_engineering_department.7069.d:0 "執行吏は、周囲の村々は土塁工事に人手を割くことができるが、自分たちの田畑の浸水を防ぐための秋の溝掘りにすでに同じ人手を借りているだけだと述べている。今ドラフトするということは、廃棄が待っていることを意味します。"
 tv_engineering_department.7069.a:0 "農民の [estate_satisfaction|E] を [tv_wonder_construction|E] の進歩に費やして、土塁のために村の手を動かします。"
 tv_engineering_department.7069.b:0 "村を放棄して、他の場所で労働力を見つけてください。"
 tv_engineering_department.7070.t:0 "建設：足場を上げなければならない場所に古い穀物店が立っています"
 tv_engineering_department.7070.d:0 "西側の足場を設置する必要がある場所に建っている古い穀物倉庫は、保存するのに十分健全であるが、その石とその足跡があれば、石工の不足と測量士の苦情の両方に一度に答えることができるだろう。それを引き下げるのが早道です。"
 tv_engineering_department.7070.a:0 "穀物店をプルダウンし、サイトで [development|E] を費やして [tv_wonder_construction|E] の進行状況を購入します。"
 tv_engineering_department.7070.b:0 "穀物倉庫を立ったままにして、別の場所に足場室を探します。"
 tv_engineering_department.7071.t:0 "建築：酒場の店主は静かに不思議の方向へ向かう"
 tv_engineering_department.7071.d:0 "乗組員は既製のコインで支払うが、通常の取引ではそうではないため、このサイトの居酒屋の主人やカーターは、密かに習慣を不思議な配達に転用し始めています。その取り決めを正式にすれば、飼育員たちがその習慣を築いてきた貿易を犠牲にして、配達は速くなるだろう。"
 tv_engineering_department.7071.a:0 "流用を正式化し、サイトで [prosperity|E] を費やして [tv_wonder_construction|E] の進行状況を購入します。"
 tv_engineering_department.7071.b:0 "地元の取引は通常どおりに行い、配達は現状のままにしておきます。"
 tv_engineering_department.7072.t:0 "建設：One Bridge or One Wonder"
 tv_engineering_department.7072.d:0 "首都独自の橋の修理は石工不足で行き詰まっており、橋に携わる石工は皆、驚異に向いていない石工だ。乗組員を再配置すれば、橋はただちに順番を待つことになるでしょう。"
 tv_engineering_department.7072.a:0 "橋の乗組員を驚異に再割り当てし、[development|E] の進行に首都で [tv_wonder_construction|E] を費やします。"
 tv_engineering_department.7072.b:0 "橋梁の乗組員はその場に残して、先に橋を完成させてください。"
 tv_engineering_department.7073.t:0 "構築：穀物要素はその余剰分を代償として提供する"
 tv_engineering_department.7073.d:0 "首都の穀物産業は、王冠が王室の好意の証拠として中央広場での販売を許可することを条件に、余剰分を公正な価格で不思議の店に直接販売することを申し出ました。それは、閑散期の間、乗組員たちに食料を供給し、明らかに市場を一人の買い手に向けて傾けることになるだろう。"
 tv_engineering_department.7073.a:0 "ファクターが販売をポストし、資本に [prosperity|E] を費やして [tv_wonder_construction|E] の進行状況を購入します。"
 tv_engineering_department.7073.b:0 "一般販売を断り、通常のルートを通じて乗組員の穀物を購入します。"
 tv_engineering_department.7074.t:0 "工事：監督が徹夜作業を提案"
 tv_engineering_department.7074.d:0 "監督官は、たいまつも意志もすでにそこにあるため、採用担当者からの新たな人材を待つのではなく、夜勤を通して現場のスタッフを運営することを提案します。夜明けまでに残務は解消されるだろうが、同じ隊員たちが最初の明るい時間に休憩なしで戻ってくることになる。"
 tv_engineering_department.7074.a:0 "夜勤を命じ、現場で苦労して [population|E] を費やして [tv_wonder_construction|E] の進行状況を購入します。"
 tv_engineering_department.7074.b:0 "乗組員をベッドに送り、採用担当者からの新しい人材を待ちます。"
 tv_engineering_department.7075.t:0 "施工：足場が揺れる時の意見"
 tv_engineering_department.7075.d:0 "現場での公開デモには群衆が集まり、忠実な観客や気分を害した批評家になる可能性があります。 [tv_wonder_domestic_support|E] が助けられたか危害を加えられたかが噂によって決定されるまで、足場は待機します。"
 tv_engineering_department.7075.a:0 "デモンストレーションそのものを見てみましょう。"
 tv_engineering_department.7076.t:0 "構成：ページを超えた計画"
 tv_engineering_department.7076.d:0 "大胆な調整により、計画は古い限界を超えます。それが記念碑を立派にした決定になるかもしれないし、将来の事務員が赤で下線を引くかもしれない。"
 tv_engineering_department.7076.a:0 "設計を古い限界を超えて押し広げます。"
 tv_engineering_department.7077.t:0 "施工：日よけの下でオーダーチェンジ"
 tv_engineering_department.7077.d:0 "新たな指揮系統が日よけの下に課せられる。それは庭を規律するかもしれないし、単にすべての職長に新しい議論の方法を教えるだけかもしれない。"
 tv_engineering_department.7077.a:0 "私たちは新しい指揮系統をヤード内に押し広げます。"
 tv_engineering_department.7078.t:0 "建設：ぬかるみの中を曲がるルート"
 tv_engineering_department.7078.d:0 "危険なルートは供給ラインを短縮することを約束します。もし天気が続けば、それは先見の明として賞賛されるだろう。それが失敗した場合、誰が順番を指示したかを誰もが思い出すことになります。"
 tv_engineering_department.7078.a:0 "短い道を通ってください！"
 tv_engineering_department.7079.t:0 "施工：宙に浮く新工法"
 tv_engineering_department.7079.d:0 "より高速な方法がアクティブ パーツで試行されます。それは月を節約することも、次の乗組員に見事な間違いを修正させることもできるかもしれません。"
 tv_engineering_department.7079.a:0 "アクティブなセクションでより高速な方法を試します。"
 tv_engineering_department.7080.t:0 "建設：約束を破られた労働者が工具を使い果たす"
 tv_engineering_department.7080.d:0 "今朝、労働者たちは工具を下ろし、王冠の銀が乾いているのが不思議だとつぶやいた。職長はボーナス賃金の約束で彼らを落ち着かせたが、この約束は財務省が群衆の前で守るか破るかのどちらかでなければならない。"
 tv_engineering_department.7080.a:0 "約束したボーナスを破り、労働者の不満が現場に広がる。"
 tv_engineering_department.7080.b:0 "約束されたボーナスを尊重し、国庫から出してもらいましょう。"
 tv_engineering_department.7081.t:0 "構造：令状の印章に疑問を呈するパンフレット"
 tv_engineering_department.7081.d:0 "巡回事務員が広場で、この不思議を認可する王室の令状が合法的に封印されたことはないと主張するパンフレットを大声で読み上げた。プロジェクトに対する疑惑が解決されないままであるか、それとも令状自体が静かに修正されるかにかかわらず、何かが与えられるに違いありません。"
 tv_engineering_department.7081.a:0 "パンフレットには何も答えずに放置し、この不思議に対する疑惑は広がり続けるままにしておきます。"
 tv_engineering_department.7081.b:0 "この挑戦に答えるために令状の文言を静かに修正し、国王の使命へのへこみを受け入れてください。"
 tv_engineering_department.7082.t:0 "建設：徴収金をきっかけに2日後に乱闘が勃発"
 tv_engineering_department.7082.d:0 "この不思議に対する石材運搬業者への徴税が、現場から車で2日離れたところにある徴兵隊員と村民の間で乱闘を引き起こしたという知らせが届いた。それを静かにするには、その地区または敷地のゲートで何らかの費用がかかります。"
 tv_engineering_department.7082.a:0 "敷地の門が不平不満を吸収し、地区の不安を放置して燃え尽きるようにしましょう。"
 tv_engineering_department.7082.b:0 "不安がさらに広がる前に、その地区を静かに解決するために軍隊を派遣してください。"
 tv_engineering_department.7083.t:0 "作図：港から宮殿まで行く使節の治部"
 tv_engineering_department.7083.d:0 "外国の使者は宴会で、不思議な事はすき牛よりもゆっくりと這うものだと笑い、今では港から宮殿に至るまであらゆる酒場でジャイブが繰り返されている。国王の海外での地位か、建設されているものに対する町民の誇りか、誰かがそれを飲み込まなければなりません。"
 tv_engineering_department.7083.a:0 "特使の軽口は無視し、この不思議に対する町民の誇りを傷つけてください。"
 tv_engineering_department.7083.b:0 "豪華な対抗策で使者に答え、国王の地位を費やして使者を黙らせましょう。"
 tv_engineering_department.7084.t:0 "建設：アルドリック卿の執事の門の煙"
 tv_engineering_department.7084.d:0 "先週、新しい採石場の道路がアルドリック卿の狩猟保護区を真っ直ぐに切り通され、それ以来、彼の管理人は現場の門の前で煙を吐き続けている。領主の家がなだめられるか、対立を見守る庶民が独自の結論を出すかのどちらかだ。"
 tv_engineering_department.7084.a:0 "対立を未解決のまま長引かせ、プロジェクトに対する群衆の意見を悪化させてください。"
 tv_engineering_department.7084.b:0 "領主の家に正式な謝罪と賠償を与えて問題を解決してください。"
 tv_engineering_department.7085.t:0 "建設：基礎溝が古い墓を掘り起こす"
 tv_engineering_department.7085.d:0 "基礎溝の準備をしていた掘削労働者らは誰も記録していない古い埋葬石を発見したが、教区司祭は死者が適切に再埋葬されるまでさらなる作業を祝福することを拒否している。再埋葬の儀式の費用が全額支払われるか、司祭の反対を押し切って発掘が続行されるかのどちらかである。"
 tv_engineering_department.7085.a:0 "司祭を押し切って掘り続け、墓が荒らされたという噂が代わりに群衆を動揺させます。"
 tv_engineering_department.7085.b:0 "司祭と教区を満足させるための完全な再埋葬の費用を支払います。"
 tv_engineering_department.7086.t:0 "工事：足場柱が商人の列を遮る"
 tv_engineering_department.7086.d:0 "大通りに設置された足場ポールが6日間連続で商店街への荷車の通行を妨げており、商店主らは失われた取引を誰かが解決するよう求めている。彼らの損失が償われるか、あるいは通りが閉鎖されたままになり、群衆がそのことを聞くかのどちらかです。"
 tv_engineering_department.7086.a:0 "商人たちに補償を与えずに放置し、通りを閉鎖することで群衆の不満を煽りましょう。"
 tv_engineering_department.7086.b:0 "貿易が妨害されたことによる商人の争いを手で補償します。"
 tv_engineering_department.7087.t:0 "構造：実る畑は切り取られずに立つ"
 tv_engineering_department.7087.d:0 "収穫徴収金の管理人たちは、驚くべきもののために木材を運ぶために熟した畑から村の手を引きずり下ろしました。そして、現場で労働者が腰を痛めている間、穀物は今、伐採されずに放置されています。村が収穫のために手を取り戻すか、群衆が不思議な出来事がどのように畑を空にしたかを聞くかのどちらかです。"
 tv_engineering_department.7087.a:0 "徴収された手を現場に留めて、立っている穀物の情報を群衆に届けてください。"
 tv_engineering_department.7087.b:0 "村の手をすぐに解放して収穫に戻します。"
 tv_engineering_department.7088.t:0 "建設：旧皮なめし地区は半分取り壊されている"
 tv_engineering_department.7088.d:0 "石工らの計画では、この驚異の基礎を置くスペースを作るために古い皮なめし工場地区を更地にすることが求められているが、その半分は、何が代わりになるのか誰も考える前に崩れ落ちてしまった。この地区が計画通りに取り壊されるか、計画が縮小され、人々はなぜこの驚異にこれほど広いスペースが必要だったのか疑問を抱き始めるかのどちらかだ。"
 tv_engineering_department.7088.a:0 "許可を縮小し、そもそもなぜこの驚異にこれほど多くの土地が必要だったのか人々に疑問を持たせましょう。"
 tv_engineering_department.7088.b:0 "予定通り皮なめし地区の取り壊しを終えて、後で何が代わりになるか心配してください。"
 tv_engineering_department.7089.t:0 "建設：市場の地盤は戻っていない"
 tv_engineering_department.7089.d:0 "この驚異の中継地は3か月連続で毎週の市場を飲み込み、かつてそこを埋めていた露店はまったく戻ってこなくなった。忘れ去られる前に市場の敷地が返還されるか、ヤードがそれを維持し、その場所の取引は減り続けるかのどちらかです。"
 tv_engineering_department.7089.a:0 "中継ヤードはそのままにして、サイト自体の市場取引を冷却状態に保ちます。"
 tv_engineering_department.7089.b:0 "毎週の屋台が帰り道を忘れる前に、市場に戻りましょう。"
 tv_engineering_department.7090.t:0 "建築：古い橋の傍に建つ救貧院"
 tv_engineering_department.7090.d:0 "市の測量官はこの驚異の石造物のために首都のすべての自由石工を徴発し、その結果、古い橋のそばに建てかけられた救貧院は 2 か月間手付かずのまま放置された。救貧院はこの奇跡が完了するまで待つか、石工が首都に引き戻されて現場が理由の説明を遅らせるかのどちらかだ。"
 tv_engineering_department.7090.a:0 "すべての石工を驚異に留めておき、首都の建設途中のプロジェクトを待ってください。"
 tv_engineering_department.7090.b:0 "救貧院を完成させるために石工を呼び戻し、その遅れに現場の群衆を驚かせましょう。"
 tv_engineering_department.7091.t:0 "建設：首都の最も美しい通りを石の荷車が窒息させる"
 tv_engineering_department.7091.d:0 "この驚異に向かうドレスアップした石を積んだワゴンが首都の最高級ショッピング街沿いに一週間駐車されており、そこの商店主らは道路が封鎖されて習慣がなくなったと話している。馬車はすぐに別のルートを見つけるか、それともそのまま留まって首都自身の貿易が冷え込み続けるかのどちらかです。"
 tv_engineering_department.7091.a:0 "ワゴンはそのままにしておき、代わりにサイト自身の進歩に責任を負わせてください。"
 tv_engineering_department.7091.b:0 "すぐにワゴンのルートを変更し、首都のショッピングストリートに再び息を吹き込みましょう。"
 tv_engineering_department.7092.t:0 "建設：足場崩壊で十数棟が壊れる"
 tv_engineering_department.7092.d:0 "3日前に現場で足場が崩壊し、十数人の作業員が骨折を負い、残りの作業員は現在、危険を冒すほどの賃金はないと不満を漏らしている。監視員がペースを強制して労働者たちが夜にこっそり逃げ出すか、ペースが緩んで危険の知らせが町中に広まるかのどちらかだ。"
 tv_engineering_department.7092.a:0 "危険性が町でよく言われるようにし、すべての労働者を現場に留めてください。"
 tv_engineering_department.7092.b:0 "関係なくペースを強制し、恐怖を感じた労働者が夜にこっそり逃げ出すことを受け入れてください。"
 tv_engineering_department.7093.t:0 "構造：金庫は台帳よりも軽い"
 tv_engineering_department.7093.d:0 "現場の支払責任者が金庫を開けると、台帳に記載されているよりも軽いことに気づきました。誰かがすでにカウントされていないコインを使用しており、不足分は [tv_wonder_scale_competence|E] または [gold|E] で補われます。"
 tv_engineering_department.7093.a:0 "胸部にまだ余裕がある範囲に合わせてデザインを縮小します。"
 tv_engineering_department.7093.b:0 "不足分を国庫から補い、大規模な建設を続けます。"
 tv_engineering_department.7094.t:0 "建設：憲章が許さないライバルのささやき"
 tv_engineering_department.7094.d:0 "競合する主張者は、この規模の記念碑を建てることを許可する憲章はないとささやき始めた。事務員らは、この問題は静かに解決できるが、[tv_wonder_scale_competence|E] または [legitimacy|E] に代償を払わなければならないと述べています。"
 tv_engineering_department.7094.a:0 "憲章からの最大の請求を静かに撤回しなさい。"
 tv_engineering_department.7094.b:0 "国王に憲章を全文再確認させ、ささやきに直接答えてもらいましょう。"
 tv_engineering_department.7095.t:0 "建設：3つの教区が基礎の上で道路を遮断"
 tv_engineering_department.7095.d:0 "3つの教区の男性らが広げられた基礎の上に工具を倒し、荷車で道路をふさいだ。執行官はそれらを解散させることができますが、それは計画の [tv_wonder_scale_competence|E] または地区の [stability|E] のいずれかで譲歩することによってのみ可能です。"
 tv_engineering_department.7095.a:0 "基礎を元のラインに戻し、男性を満足させて帰宅させます。"
 tv_engineering_department.7095.b:0 "道路を整地し、より広い基礎を維持するために武装した兵士を送り込みます。"
 tv_engineering_department.7096.t:0 "構成：ヘラルドは無給旅行を拒否する"
 tv_engineering_department.7096.d:0 "海外でこの記念碑を宣伝する予定だった伝令たちは、2か月間無給のままであり、現在は渡航を拒否している。デザインの [tv_wonder_scale_competence|E] をトリミングすることを意味するか、クラウンの [prestige|E] をつぎ込んで沈黙を買うことを意味するかにかかわらず、誰かがすぐに満足する必要があります。"
 tv_engineering_department.7096.a:0 "より小さくて安価な記念碑を発表し、代わりに使者にその言葉を伝えさせます。"
 tv_engineering_department.7096.b:0 "王冠自身の名前と評判から伝令に支払います。"
 tv_engineering_department.7097.t:0 "建設：男爵の執事は木材を2倍にします"
 tv_engineering_department.7097.d:0 "男爵の家令が領主の森から徴発された木材を数えたところ、合意されたものの2倍であることがわかりました。領主は、計画の[tv_wonder_scale_competence|E]を縮小することで今後の減額を受け入れるか、あるいは正式な謝罪と貴族たちの[estate_satisfaction|E]へのさらなる譲歩を受け入れることになるだろう。"
 tv_engineering_department.7097.a:0 "将来の木材割り当てを削減し、それに合わせて設計を縮小します。"
 tv_engineering_department.7097.b:0 "正式な謝罪とさらなる助成金を男爵家に送ります。"
 tv_engineering_department.7098.t:0 "建設：身廊が広がると旧墓地が飲み込まれてしまう"
 tv_engineering_department.7098.d:0 "司教は、より広い身廊のデザインが支部の古い墓地を飲み込んでしまうことを知りました。計画が縮小されるか、支部の聖職者の[estate_satisfaction|E]に対する不満が完全に答えられない限り、彼は再びその業を祝福することはありません。"
 tv_engineering_department.7098.a:0 "埋葬地を避けるために身廊を描き直します。"
 tv_engineering_department.7098.b:0 "支部に苦情に答えるための新しい権限を与えます。"
 tv_engineering_department.7099.t:0 "工事中：倉庫を突き抜ける拡幅道路"
 tv_engineering_department.7099.d:0 "羊毛商人らの報告によると、現場への拡幅された道路が倉庫の列を真っ直ぐに突き抜けており、商品は交差点で腐ったままになっているという。道路が狭くなってアプローチ全体の [tv_wonder_scale_competence|E] がトリミングされるか、王冠が強盗の間の [estate_satisfaction|E] を完全に補います。"
 tv_engineering_department.7099.a:0 "進入路を狭くし、倉庫を省きます。"
 tv_engineering_department.7099.b:0 "商人に損失を支払って、より広い道路を維持してください。"
 tv_engineering_department.7100.t:0 "建設中：今月、ある村で3人の男性が埋葬された"
 tv_engineering_department.7100.d:0 "採石場の近くの村で今月、暗くなるまで拡張工事に取り組んでいた男性3名が埋葬されたという知らせが入った。リーブは、国王が[estate_satisfaction|E]を縮小する代わりに、穀物と銀を持った農民の間で[tv_wonder_scale_competence|E]に応答することを望まない限り、徴用工を削減する必要があると述べています。"
 tv_engineering_department.7100.a:0 "村が負担できる量まで徴税命令を削減してください。"
 tv_engineering_department.7100.b:0 "穀物と銀を村に送り、注文どおりにコルヴィーを保管してください。"
 tv_engineering_department.7101.t:0 "建設中：家並みが崩れて作業場となる"
 tv_engineering_department.7101.d:0 "職長は作業場を広げるために現場に並んでいた家屋を取り壊しており、町民たちはその場所に何が建てられるのか尋ねている。答えは、設計を縮小して、必要のない [tv_wonder_scale_competence|E] グランドを省くか、さらにクリアしてサイトの [development|E] をさらに失うことを意味します。"
 tv_engineering_department.7101.a:0 "これ以上の更地化を中止し、すでに占領されている土地に合わせて計画を再作成します。"
 tv_engineering_department.7101.b:0 "清算の継続を命令し、サイトに損失を吸収させます。"
 tv_engineering_department.7102.t:0 "建設：かつて現場を囲んでいた市場は消滅"
 tv_engineering_department.7102.d:0 "かつて建設現場を囲んでいた市場は足場と騒音で立ち退き、屋台は戻っていない。監督者は、[tv_wonder_scale_competence|E] の一部を放棄して工事を近づけるか、それとも市場が追放されたままサイトの [prosperity|E] が流出し続けるかを決定する必要があります。"
 tv_engineering_department.7102.a:0 "足場を引き込んで市場を復帰させます。"
 tv_engineering_department.7102.b:0 "作品を広範囲に広げたままにして、サイトの取引を萎縮させてください。"
 tv_engineering_department.7103.t:0 "建設：橋の石工たちは驚異に魅了されました"
 tv_engineering_department.7103.d:0 "この驚異のために徴兵された石工たちは、首都自身の橋の修理からすぐに引き抜かれ、今では冬を前に半分完成したままになっている。誰かが答えなければなりません。石工たちが家に帰れるように驚異の [tv_wonder_scale_competence|E] が縮小するか、首都の [development|E] が修理されずにシーズンを終えるまで放置されるかのどちらかです。"
 tv_engineering_department.7103.a:0 "石工を首都に解放し、驚異を縮小します。"
 tv_engineering_department.7103.b:0 "石工を不思議な場所に留めて、首都の修復を待ちましょう。"
 tv_engineering_department.7104.t:0 "建設中：首都のギルドホールは静まり返りました"
 tv_engineering_department.7104.d:0 "首都のギルドホールは静まり返り、職人や御用達は石と手への驚異の食欲を養うために引き上げられた。市議会は、最終的に[tv_wonder_scale_competence|E]を残してデザインを適切なサイズにカットするのか、それとも首都の[prosperity|E]が市街に建てられなくなった記念碑に資金を提供し続けなければならないのかを明確に尋ねている。"
 tv_engineering_department.7104.a:0 "設計を縮小し、ギルドマンを首都に解放します。"
 tv_engineering_department.7104.b:0 "ギルドマンを現場に留めておき、資本の取引でその費用を支払い続けてください。"
 tv_engineering_department.7105.t:0 "構成：外科医はさらに多くのものが落下すると警告"
 tv_engineering_department.7105.d:0 "昨夜、拡張された層で足場が崩壊し、外科医は、より大規模な計画に対するペースが減速しなければ、さらに多くの足場が崩壊すると述べた。監督者は、[tv_wonder_scale_competence|E] を節約して作業員が生き残れるペースに設計を戻すか、より広範囲の作業を継続して現場での労働力 [population|E] が減り続けることを受け入れるかのどちらかです。"
 tv_engineering_department.7105.a:0 "ペースを落とし、乗組員が耐えられる範囲まで計画を縮小します。"
 tv_engineering_department.7105.b:0 "より広範な作業を推進し続け、労働者の犠牲を受け入れてください。"
 tv_engineering_department.7106.t:0 "建設：2人の事務員が同じ不足分を2回数えます"
 tv_engineering_department.7106.d:0 "昨晩の計算では、2人の異なる事務員による会計責任者の金庫が2回不足した。紛失したコインは財務省に償却されるか、シフト名簿全体が破棄され、すべての乗組員がゼロから再割り当てされるかのどちらかです。 [tv_wonder_organization_competence|E] または [gold|E] が事務員の計算費用を支払います。"
 tv_engineering_department.7106.a:0 "シフト名簿を破棄し、すべての乗組員を最初から再割り当てします。"
 tv_engineering_department.7106.b:0 "不足したコインを財務省に帳消しし、名簿を数えたままにしておきます。"
 tv_engineering_department.7107.t:0 "建設：偽造された助成金が乗組員に読み上げられる"
 tv_engineering_department.7107.d:0 "職長も知らない叫び声が、乗組員たちの意見を十分に聞きながら、敵対領主に対するこの場所の木材使用権の偽造許可書を読み上げた。集まった労働者がその日の職長全員を降ろす前に、男を追いかけ、主張に反論した。捏造を放置しておくと乗組員は仕事を続けられるが、その主張はすでに事実として酒場で繰り返されている。 [tv_wonder_organization_competence|E] または [legitimacy|E] には偽造者の嘘が含まれます。"
 tv_engineering_department.7107.a:0 "すべての職長を持ち場から引きずり出して、叫び声を上げた犯人を追い詰め、記録を正しましょう。"
 tv_engineering_department.7107.b:0 "捏造された主張は答えられないまま放置し、乗組員を仕事に従事させ続けてください。"
 tv_engineering_department.7108.t:0 "工事中：街路にマッチがこぼれた"
 tv_engineering_department.7108.d:0 "公衆衛生ラインでマッチを押し込んだところ、袋半分以上の腐った穀物が門から外にこぼれ、時計が門を壊す前に通りに流れ出た。 2つのギャングが二度と会わないように、時間差で乗組員を交代させ、食事を与えることもできるし、監視員が広場で逮捕して問題を永久に解決することもできる。 [tv_wonder_organization_competence|E] または [stability|E] は、腐敗した穀物に対する応答です。"
 tv_engineering_department.7108.a:0 "2 つのギャングが二度とすれ違わないように、混乱するシフトをすべて再調整します。"
 tv_engineering_department.7108.b:0 "広場で監視員を逮捕させましょう。"
 tv_engineering_department.7109.t:0 "構築：使者は無人の門に到着"
 tv_engineering_department.7109.d:0 "外国の使節が丸一日早く到着したが、儀仗門は無人で、旗は胸に折りたたまれたままであることを発見した。勤務名簿をその場で破り、適切な歓迎文をかき集めることもできるし、特使を現状のまま現場を歩き回って、見たとおりに家に報告することもできる。 [tv_wonder_organization_competence|E] または [prestige|E] は早期到着の料金を支払います。"
 tv_engineering_department.7109.a:0 "その場で当番名簿を破り、適切な歓迎の言葉をかき集めます。"
 tv_engineering_department.7109.b:0 "特使に現場を現状通りに案内してもらいます。"
 tv_engineering_department.7110.t:0 "建設：借りた牛がミカエルマス以来延滞中"
 tv_engineering_department.7110.d:0 "隣の領主の屋敷から借りた牛のチームはミカエルマスに戻る予定だったが、期限を過ぎても石を運び続けている。チームを予定通りに帰国させ、手で荷を引くために運搬要員を再編成することもできるし、領主の家令に待つように言われる間、牛をさらに2週間保管することもできる。貴族の間では [tv_wonder_organization_competence|E] または [estate_satisfaction|E] が期限を過ぎた牛を運びます。"
 tv_engineering_department.7110.a:0 "牛を予定どおり家に送り、手で運ぶために乗組員を再編成します。"
 tv_engineering_department.7110.b:0 "牛をもう二週間保管して、領主の家令に待つように伝えてください。"
 tv_engineering_department.7111.t:0 "構築：ハンマーが遺物の行列をかき消す"
 tv_engineering_department.7111.d:0 "石工らは今週も聖遺物行列を真っ直ぐに叩き続けたが、通り３本離れた場所では聖歌は聞こえなかった。今後は、祝日や行列の日ごとにシフトカレンダーを書き直すこともできるし、行列のルートを移動するだけで、聖職者にそのために仕事はやめないと告げることもできる。聖職者の間で [tv_wonder_organization_competence|E] または [estate_satisfaction|E] がノイズに対して応答します。"
 tv_engineering_department.7111.a:0 "お祭りや行列の日ごとにシフトカレンダーを書き直します。"
 tv_engineering_department.7111.b:0 "行列のルートを変更し、聖職者に作業をやめないことを伝えてください。"
 tv_engineering_department.7112.t:0 "建設：穀物市場のレーンをサイトワゴンが塞いでいる"
 tv_engineering_department.7112.d:0 "サイトワゴンの列が6日間連続して穀物市場の積み込みレーンを塞いでおり、商人ギルドは直接苦情を申し立てるために店員を派遣することをやめた。配達スケジュールをバラバラにして、車線に空きを保つような長いルートを中心に再構築することも、ギルドが独自の業務のルートを変更するために放置される間、荷馬車はそのままにしておくこともできます。ブロックされた車線の料金は、侵入者の間で [tv_wonder_organization_competence|E] または [estate_satisfaction|E] が支払います。"
 tv_engineering_department.7112.a:0 "配送スケジュールを解体し、より長いルートを中心に再構築します。"
 tv_engineering_department.7112.b:0 "馬車はその場に放置し、ギルドのルートを変更してください。"
 tv_engineering_department.7113.t:0 "施工：勝手に田植えの季節がやってくる"
 tv_engineering_department.7113.d:0 "田植えのために村に戻る予定の徴兵団はまだ石を切っており、彼らがいないと今年の畑は種まきされないという知らせが入った。ギャングを予定通りに釈放し、残った者から現場の労働シフトを再構築することもできるし、村が無人でやりくりしている間、徴兵を期限を超えて保留することもできる。農民の間で [tv_wonder_organization_competence|E] または [estate_satisfaction|E] が作られていない畑の代金を支払います。"
 tv_engineering_department.7113.a:0 "予定通り強奪者ギャングを解放し、残されたギャングからサイトのシフトを再構築します。"
 tv_engineering_department.7113.b:0 "徴税を期限を過ぎても保留し、村々に任せましょう。"
 tv_engineering_department.7114.t:0 "建設工事：敷地の舗装が目の前に崩れた壁"
 tv_engineering_department.7114.d:0 "擁壁は一夜にして崩壊し、手元に最も近い化粧石は、敷地独自の進入道路に沿ってすでに敷設されていた舗装でした。舗装はそのままにしておいて、空いた手を他の作業から外して代わりに新しい石を切り出すこともできますし、朝になる前に道路を再び引き裂いて壁を補修することもできます。現場の [tv_wonder_organization_competence|E] または [development|E] が、崩壊した壁の費用を支払います。"
 tv_engineering_department.7114.a:0 "他の作業から空いた手をすべて解放して、代わりに新しい石を切り出します。"
 tv_engineering_department.7114.b:0 "朝までに再び進入路を引き裂いて壁を補修します。"
 tv_engineering_department.7115.t:0 "建設：パン売りは遅れた賃金を手放す"
 tv_engineering_department.7115.d:0 "キャンプ市場のパン売り手たちは、先週の給料が３日遅れで半分が切り抜き硬貨で渡された後、荷物をまとめて立ち去った。賃金をより厳しく、より頻繁なスケジュールに組み替えて売り手を呼び戻し、そのために現在の賃金表を解体することもできるし、キャンプが単に市場を廃止して労働者が自分たちの食事を賄えるようにすることもできる。現場の [tv_wonder_organization_competence|E] または [prosperity|E] が遅延賃金を支払います。"
 tv_engineering_department.7115.a:0 "販売者を呼び戻すために、給与名簿を破棄し、より厳格なスケジュールで再描画します。"
 tv_engineering_department.7115.b:0 "キャンプを市場なしで放置し、労働者に食事を賄わせましょう。"
 tv_engineering_department.7116.t:0 "建設：一夜にして消える橋の足場"
 tv_engineering_department.7116.d:0 "首都自身の橋の修理の準備が整った足場は、一晩のうちに現場のワゴンに静かに積み込まれ、橋の作業員が到着すると、木材がなくなっていることに気づきました。この場所自体の供給を延長し、代わりにより遠くの木材供給源を中心にシフトを再構築することもできますし、首都の橋はその梁が最初に驚異を完成させるまで単に待つこともできます。首都の [tv_wonder_organization_competence|E] または [development|E] は、不足している足場の代金を支払います。"
 tv_engineering_department.7116.a:0 "サイトの供給期間を延長し、より遠くの木材供給源を中心にシフトを再構築します。"
 tv_engineering_department.7116.b:0 "首都の橋は、その梁が先に驚異を完成させるまで待ってもらいましょう。"
 tv_engineering_department.7117.t:0 "建設：正午にはギルドホールは誰もいない"
 tv_engineering_department.7117.d:0 "首都のガラス職人や建具職人の半数が3週間連続で現場に来ており、故郷のギルドホールは現在、正午にはほとんど空いている。親方たちをローテーションで帰郷させ、残った見習いを中心に現場作業員を再構築することもできるし、親方たちはただその場に留まり、首都自身の工房がしばらくアイドル状態にあることもできる。首都の [tv_wonder_organization_competence|E] または [prosperity|E] は、空のギルドホールの料金を支払います。"
 tv_engineering_department.7117.a:0 "マスターをホームにローテーションさせ、残った見習いから現場スタッフを再構築します。"
 tv_engineering_department.7117.b:0 "マスターたちを現場に留めておき、首都の工房は放置しておきます。"
 tv_engineering_department.7118.t:0 "建設：ロープを失ったショートハンドプラットフォーム"
 tv_engineering_department.7118.d:0 "今朝、小柄な乗務員が時間を計るためにプラットホームに二人で乗ったとき、ホイストロープが切れ、３人の男がロープを持って下山した。スケジュールにどう影響するかに関わらず、予備隊員がそれぞれの任務を外されて明日プラットホームに放り込まれることもあれば、負傷者が運び出された後に同じ隊員が急遽呼び戻されることもある。切断されたロープの料金は、[tv_wonder_organization_competence|E] または現場での作業員 [population|E] が支払います。"
 tv_engineering_department.7118.a:0 "予備軍団を自分たちの仕事から引きずり下ろし、ホームに放り投げるのだ、スケジュールなんてとんでもない。"
 tv_engineering_department.7118.b:0 "負傷者が運び去られたら、同じ短兵隊員を元に送り返します。"
 tv_engineering_department.7119.t:0 "建設：座屈橋が泥で船団を取り囲む"
 tv_engineering_department.7119.d:0 "補給道路に架かる橋は石車の重みで折れ、輸送船団の半分は橋の下の泥の中に取り残されている。交差点の渡し守たちは、代金を支払えば貨車をラフティングして渡し、誰かが何らかの方法で代金を支払うつもりだと言っている。"
 tv_engineering_department.7119.a:0 "[tv_wonder_logistics_competence|E] の費用が何であれ、貨車は座ったままにし、残りの貨車は壊れた橋の周りを回ります。"
 tv_engineering_department.7119.b:0 "[gold|E] を使い果たし、今日荷車を渡せるよう渡し守に国庫から代金を支払います。"
 tv_engineering_department.7120.t:0 "建設：料金所のシールが廃止されました"
 tv_engineering_department.7120.d:0 "車列のアウトライダーたちは隣の料金所で引き返され、彼らの憲章には地元の領主がもはや尊重していない印章が押されていた。誰かが国王の名において門をこじ開けるか、馬車を門の外に放置するかを決めなければなりません。"
 tv_engineering_department.7120.a:0 "車列を引き返し、係争中の料金所を迂回する長いルートを見つけ、[tv_wonder_logistics_competence|E] をスリップさせます。"
 tv_engineering_department.7120.b:0 "[legitimacy|E] をまだ解決していない口論に費やして、今すぐ王室の権限を発動してゲートを強制的に開きます。"
 tv_engineering_department.7121.t:0 "建設：村民が3度目の徴用で道路を封鎖"
 tv_engineering_department.7121.d:0 "村民らは手押し車で道路を封鎖し、今季３度目の徴発が中止されるまで移動を拒否した。船団は後退するか兵士を連れて道を空けなければ通過できない。"
 tv_engineering_department.7121.a:0 "後退し、封鎖を迂回して船団のルートを変更し、[tv_wonder_logistics_competence|E] に残る停止状態を受け入れます。"
 tv_engineering_department.7121.b:0 "兵士を派遣して強制的に道路を空けさせ、そのコストを [stability|E] で計算します。"
 tv_engineering_department.7122.t:0 "構成：現場監督は証人の前で馬を拒否される"
 tv_engineering_department.7122.d:0 "護送船団の職長は、ライバル裁判所で新たな徴用馬の供給を拒否され、証人の前で追い返された。今すぐ馬を手に入れるということは、法廷に恥をかかせて従わせるような賛成を呼び掛けることを意味する。それらを入手できないということは、ワゴンが残りの道を這うということです。"
 tv_engineering_department.7122.a:0 "すでに疲れた馬を連れて職長を送り、[tv_wonder_logistics_competence|E] で遅れを知らせてください。"
 tv_engineering_department.7122.b:0 "[prestige|E] を費やして、ライバル裁判所に新しい馬を引き渡すよう公に支持を呼びかけます。"
 tv_engineering_department.7123.t:0 "製作：カーター家 貴族の馬を指揮する"
 tv_engineering_department.7123.d:0 "驚異のチームが足りなくなったとき、護送隊の荷馬車が貴族の家の所有する馬車の馬を強奪したため、貴族は夜になる前に馬車を取り戻すよう要求している。馬を返すと荷馬車が停まってしまいます。それらを維持すると、家族の忍耐力が失われます。"
 tv_engineering_department.7123.a:0 "今夜馬を貴族の家に返し、[tv_wonder_logistics_competence|E] の費用で馬車なしで馬車を待たせてください。"
 tv_engineering_department.7123.b:0 "貴族の間で[estate_satisfaction|E]にどんな影響が出るにせよ、借りた馬をしばらく護送隊として働かせ続けてください。"
 tv_engineering_department.7124.t:0 "建築：お祭りの日に行き交う馬車"
 tv_engineering_department.7124.d:0 "最短の補給道路が修道院の敷地を横切り、祝祭の日に誰もが退去を求める前に荷馬車が走り抜けた。修道士たちは門を閉めており、車列を引き返すか、応答してもらうよう求めている。"
 tv_engineering_department.7124.a:0 "馬車を引き返し、修道院の敷地内を迂回する別の道を見つけます。迂回費用は [tv_wonder_logistics_competence|E] になります。"
 tv_engineering_department.7124.b:0 "計画通りに護送船団を門に押し込み、聖職者の中に[estate_satisfaction|E]を置いて攻撃を放置します。"
 tv_engineering_department.7125.t:0 "建設：マーケット広場で嵐を待つ船団"
 tv_engineering_department.7125.d:0 "船団は嵐が来るのを待つため、町のマーケット広場の向こう側にワゴンを一晩駐車し、それ以来屋台は営業できなくなった。トレーダーらは、嵐があろうがなかろうが、今日は広場を撤去するよう要求している。"
 tv_engineering_department.7125.a:0 "今すぐ天候の良い場所に荷車を移動させて、嵐が [tv_wonder_logistics_competence|E] を遅らせるのに任せてください。"
 tv_engineering_department.7125.b:0 "しばらく広場に馬車を停めさせて、商人の怒りを強盗たちの[estate_satisfaction|E]にぶつけてください。"
 tv_engineering_department.7126.t:0 "建設：同じ村で三度目に牛を失う"
 tv_engineering_department.7126.d:0 "同じ村では今月、護送船団のために牛や荷車が３回接収されており、畑は耕されないままだ。動物たちが鋤に戻るか、荷車が自分たちで引っ張っていくかのどちらかです。"
 tv_engineering_department.7126.a:0 "[tv_wonder_logistics_competence|E] の犠牲を払って、牛を田畑に送り返し、牛なしで輸送隊を引きずりながら進めてもらいます。"
 tv_engineering_department.7126.b:0 "4 度目に牛を徴発し、村の疲弊を農民たちの間で [estate_satisfaction|E] で示しました。"
 tv_engineering_department.7127.t:0 "工事中：土砂崩れで敷地までの道路が埋まる"
 tv_engineering_department.7127.d:0 "地滑りにより、敷地内にある道路の最後の区間が埋没しており、唯一の応急処置は、新たに敷設された準備ヤードを引き裂いて埋め立てと板張りをすることだ。サイトが独自の基礎工事を放棄するか、護送隊が滑り台の外で待機するかのどちらかです。"
 tv_engineering_department.7127.a:0 "[tv_wonder_logistics_competence|E] の費用をかけて、中継ヤードをそのままにして、コンボイをスライドの外に座らせます。"
 tv_engineering_department.7127.b:0 "新しく敷設した庭を引き裂いて埋め立てと板張りをして道路をきれいにし、現場で [development|E] を費やします。"
 tv_engineering_department.7128.t:0 "工事中：作業員の小屋の先の道路を拡幅する必要がある"
 tv_engineering_department.7128.d:0 "荷馬車は現場の労働者小屋を越えて道路を広げる必要があり、そこの業者には他に取引する場所がありません。船団を通すために屋台が下りてくるか、貨車が勢いよく通り過ぎていくかのどちらかだ。"
 tv_engineering_department.7128.a:0 "[tv_wonder_logistics_competence|E] の費用をかけて、ワゴンを一気に通り過ぎさせ、屋台を立たせたままにしておきます。"
 tv_engineering_department.7128.b:0 "現場で [prosperity|E] を費やして、車列のための道路を広げるためにベンダーの屋台を片付けます。"
 tv_engineering_department.7129.t:0 "建設：護送船団を押し進めるために首都の通りが引き裂かれる"
 tv_engineering_department.7129.d:0 "首都自身の荷車運転手と石畳の乗組員は、行き詰まった車列を市内の最後のマイルまで押し進めるために、通常の仕事から外された。首都の通りは、荷馬車が待っているかどうかに関係なく、半分は引き裂かれ、半分は空いています。"
 tv_engineering_department.7129.a:0 "[tv_wonder_logistics_competence|E] の犠牲を払って、首都の乗組員を自分の職場に送り返し、輸送船団を門で立ち往生させます。"
 tv_engineering_department.7129.b:0 "首都で [development|E] を費やして、首都の乗組員を路上から引き離してワゴンの搬入を完了させてください。"
 tv_engineering_department.7130.t:0 "建設：滞留した貨物が首都のマーケット広場を占拠"
 tv_engineering_department.7130.d:0 "船団はこの驚異の行き詰まった貨物を保管するために首都の中央市場広場を強奪し、通常そこで取引するキャラバンは1週間立ち入りを拒否された。貨物が移動して市場が再開されるか、広場がしばらく倉庫のままになるかのどちらかです。"
 tv_engineering_department.7130.a:0 "大まかにでも荷物をすぐに移動し、[tv_wonder_logistics_competence|E] にかかる負担を軽減します。"
 tv_engineering_department.7130.b:0 "貨物を広場に残してキャラバンを締め出し、首都で [prosperity|E] を費やします。"
 tv_engineering_department.7131.t:0 "建設：牛の代わりに労働者がロープにつながれる"
 tv_engineering_department.7131.d:0 "役動物が使い果たされ、新しい動物が手に入らないため、現場の監督らは立ち往生した荷車を手で引っ張るために労働者をロープに繋ぎ始めた。男たちが疲れ果てても引きずり続けるか、荷車が立ち往生した場所に留まるかのどちらかです。"
 tv_engineering_department.7131.a:0 "[tv_wonder_logistics_competence|E] の費用をかけて、人員をこれ以上働かせるのではなく、荷車をその場に放置しておいてください。"
 tv_engineering_department.7131.b:0 "カートが移動するまで作業員をロープに引っ張り続け、現場で労働者 [population|E] を費やします。"
 tv_engineering_department.7132.t:0 "建設：石材職人が仕事を止め、無給に"
 tv_engineering_department.7132.d:0 "石切り職人ギルドは仕事を停止し、2か月連続で無給となった。彼らの職長は帳簿を持って拳を握り締めて門に立っているので、誰かが庭か金庫のどちらかを開けなければなりません。"
 tv_engineering_department.7132.a:0 "カッターを歩かせて、[tv_wonder_construction|E] の進行を待ちます。"
 tv_engineering_department.7132.b:0 "[gold|E] で滞納金を支払い、ノミを動かし続けてください。"
 tv_engineering_department.7133.t:0 "構成：偽装者が紛失した令状を引用する"
 tv_engineering_department.7133.d:0 "この場所の石工たちが慣習的な令状なしに徴収されたという情報が議会に届き、詐欺師はすでにそれを国王が気まぐれに支配している証拠として引用している。誰かが近道のために答えなければなりません - 仕事そのもの、またはそれを命じた使命のいずれかです。"
 tv_engineering_department.7133.a:0 "賦課金を思い出して、[tv_wonder_construction|E] の進捗を遅らせてください。"
 tv_engineering_department.7133.b:0 "令状を守り、王冠 [legitimacy|E] を犠牲にしてください。"
 tv_engineering_department.7134.t:0 "工事：荷車の軌道を体でふさぐ村人たち"
 tv_engineering_department.7134.d:0 "採石場の道路を柵で囲われた共有地に住む村民が、自らの体で荷馬車の軌道を塞いだ。今夜荷車が引き返すか、兵士たちが道路を空けて田舎がそれを思い出すかのどちらかです。"
 tv_engineering_department.7134.a:0 "カートを戻して、[tv_wonder_construction|E] の進行を待ちます。"
 tv_engineering_department.7134.b:0 "ガードを派遣してトラックをクリアし、コストとなる [stability|E] を費やします。"
 tv_engineering_department.7135.t:0 "建設：半壊した足場を大使が視察"
 tv_engineering_department.7135.d:0 "外国大使が早めに現場を視察し、緑色のモルタルの上に半分崩れた足場を発見した。彼の故郷への報告書はすでに起草されている。監督は作業を中断して正しくやり直すこともできるし、大使に見たものを書かせることもできる。"
 tv_engineering_department.7135.a:0 "障害のあるセクションを破棄し、[tv_wonder_construction|E] の進行状況をフォールバックさせます。"
 tv_engineering_department.7135.b:0 "足場を立てたままにし、手紙に王冠 [prestige|E] を付けます。"
 tv_engineering_department.7136.t:0 "建設：ある領主が採石場に向けてマークされた狩猟保護区を発見する"
 tv_engineering_department.7136.d:0 "地元の領主は、自分の狩猟用保護区にこの驚異の採石場とマークが付けられているのを発見し、激怒して法廷に馬で乗り込み、測量士の撤退か家族の名誉を問うかのどちらかを要求した。下の誰かが譲歩しなければなりません。"
 tv_engineering_department.7136.a:0 "測量士を呼び戻し、[tv_wonder_construction|E] の進捗を遅らせてください。"
 tv_engineering_department.7136.b:0 "採石場のラインを保持し、貴族の間でコスト [estate_satisfaction|E] を与えます。"
 tv_engineering_department.7137.t:0 "建設：古い骨場を財団が再生する"
 tv_engineering_department.7137.d:0 "基礎を準備している掘削労働者は、誰も記録していなかった古い教区の骨場を発見したが、司祭たちは適切に再埋葬されるまでさらなる作業を祝福することを拒否している。誰かがシャベルと秘跡のどちらかを選択しなければなりません。"
 tv_engineering_department.7137.a:0 "再埋葬の儀式が終了するまでディガーを停止し、[tv_wonder_construction|E] の進行を待ちます。"
 tv_engineering_department.7137.b:0 "掘削の続行を命令し、聖職者に費用 [estate_satisfaction|E] を与えてください。"
 tv_engineering_department.7138.t:0 "建設：石積みの荷車が商人の広場を飲み込む"
 tv_engineering_department.7138.d:0 "商人の広場は一週間にわたって石積みの荷車によって半分飲み込まれており、ギルドマスターたちはこれがさらに一週間続くと秋のフェアが台無しになるだろうと述べている。今夜カートが新しいルートを見つけるか、見本市が建設ヤードに向けて開かれるかのどちらかです。"
 tv_engineering_department.7138.a:0 "カートのルートを変更し、[tv_wonder_construction|E] の進行を遅くします。"
 tv_engineering_department.7138.b:0 "カートを広場に置いて、住民の間で [estate_satisfaction|E] の費用がかかるようにします。"
 tv_engineering_department.7139.t:0 "建設：Corvee Crews は最後の乾燥した週を逃しました"
 tv_engineering_department.7139.d:0 "今月の遠征のために3つの村から引き抜かれた徴兵隊員は収穫のための最後の乾季を逃しており、村長たちは自分たちの畑が先か不思議が先か疑問を抱いている。二人のうちどちらかが与えなければなりません。"
 tv_engineering_department.7139.a:0 "乗組員を現場に送り返し、[tv_wonder_construction|E] の進行を遅らせます。"
 tv_engineering_department.7139.b:0 "乗組員を現場に留めておき、農民の間で費用が [estate_satisfaction|E] になるようにします。"
 tv_engineering_department.7140.t:0 "建設：崩壊した壁が敷地内の作業場を埋めた"
 tv_engineering_department.7140.d:0 "擁壁は一夜にして崩壊し、敷地の周囲にできていた中途半端な作業場や店舗を埋めてしまった。それらを適切に再構築するには、驚異から引き出された労働力、またはその周囲にあるものなど、いずれにしてもサイトに何らかの費用がかかります。"
 tv_engineering_department.7140.a:0 "作業員を驚異から引き上げてワークショップを強化し、[tv_wonder_construction|E] の進行を後退させます。"
 tv_engineering_department.7140.b:0 "ワークショップは瓦礫として放置し、現場での費用は [development|E] とします。"
 tv_engineering_department.7141.t:0 "建設：行商人が新しい備蓄ヤードに追い出される"
 tv_engineering_department.7141.d:0 "作業員を養うために立ち上がった行商人や小さな作業場は今週、新しい備蓄ヤードの整地のため追い出されたため、この場所の小さな経済活動は彼らとともに静まり返った。備蓄またはサイト独自の取引 - 2 つのうち 1 つが地面を維持します。"
 tv_engineering_department.7141.a:0 "行商人に土地を返し、[tv_wonder_construction|E] の進行状況を備蓄で待機させます。"
 tv_engineering_department.7141.b:0 "備蓄ヤードを維持し、現場でのコストを [prosperity|E] にします。"
 tv_engineering_department.7142.t:0 "建設：首都の石工は全員徴発される"
 tv_engineering_department.7142.d:0 "首都自身の橋の修理は、市内のすべての石工と荷車がこの驚異の最新の推進のために徴用されたため、行き詰まっています。治安判事は、スパンが失敗する前に乗組員を帰還させたいと考えています。サイト側はあと1か月延長することを望んでいる。"
 tv_engineering_department.7142.a:0 "石工を首都に解放し、[tv_wonder_construction|E] の進行を遅らせます。"
 tv_engineering_department.7142.b:0 "石工を現場に留めておき、首都での費用は [development|E] とします。"
 tv_engineering_department.7143.t:0 "建設：首都の2つの通りを石造りの荷車が閉鎖"
 tv_engineering_department.7143.d:0 "首都の市場地区を荷車に積んだ石材が転がり、2つの通りが1週間閉鎖され、そこの商店主らは、取引はすでに他の場所に移っていると語った。輸送船団がより長いルートを見つけるか、地区が慣習を無視し続けるかのどちらかです。"
 tv_engineering_department.7143.a:0 "輸送船団のルートを変更して長距離を移動し、[tv_wonder_construction|E] の進行を遅れさせてください。"
 tv_engineering_department.7143.b:0 "輸送船団を短いルートに保ち、首都でのコストを [prosperity|E] にします。"
 tv_engineering_department.7144.t:0 "建設中：労働者キャンプに熱が広がる"
 tv_engineering_department.7144.d:0 "労働者キャンプでは発熱があり、医師らは病人は休まなければならず、さもなければ乗組員全体に熱が広がるだろうと述べている。誰かが彼らを働かせて仕事を失うか、彼らを放置して労働者を失うかのどちらかを選択しなければなりません。"
 tv_engineering_department.7144.a:0 "乗組員を立たせて回復させ、[tv_wonder_construction|E] の進行を遅らせます。"
 tv_engineering_department.7144.b:0 "病人にそれを乗り越えさせ、現場での労働コストを[population|E]にさせましょう。"
 tv_engineering_department.7145.t:0 "建設：財務省の新たなギャップ"
 tv_engineering_department.7145.d:0 "その驚異は、台帳が予想したよりも早くコインを引き出します。財務省は不足について説明することはできるが、説明しても銀は鋳造されない。"
 tv_engineering_department.7145.a:0 "ギャップを埋めるために台帳を引き伸ばします。"
 tv_engineering_department.7146.t:0 "構造：王璽のほこり"
 tv_engineering_department.7146.d:0 "王室の支持にはあまりにも多くの妥協が含まれています。シールはまだ付いていますが、薄くなったように見えます。"
 tv_engineering_department.7146.a:0 "ロイヤルシールを少し薄く着用させます。"
 tv_engineering_department.7147.t:0 "建設：静かな街が乱される"
 tv_engineering_department.7147.d:0 "建設のリズムが日常生活を圧迫する。市場は遅くまで開き、村は不平を言い、秩序は少しずつ前進します。"
 tv_engineering_department.7147.a:0 "私たちは村々が不平を言いながらも構わず突き進んでいきます。"
 tv_engineering_department.7148.t:0 "建設：色を失った法廷"
 tv_engineering_department.7148.d:0 "法廷は作品に彩りを与え、その見返りとして塵を受け取る。公の場での小さなジョークや中途半端な自慢話では、威信は薄れてしまいます。"
 tv_engineering_department.7148.a:0 "少しの輝きと引き換えに、法廷でのジョークをいくつか。"
 tv_engineering_department.7149.t:0 "構成：高貴なテーブルでの冷たい言葉"
 tv_engineering_department.7149.d:0 "貴族の家庭が再び道を譲る。譲歩は形式的かつ冷淡であり、多くの場合、拒否よりも悪いものになります。"
 tv_engineering_department.7149.a:0 "貴族たちの冷たく形式的な譲歩を受け入れる。"
 tv_engineering_department.7150.t:0 "施工：祭壇の前で顔をしかめる"
 tv_engineering_department.7150.d:0 "現場のために神聖な暦が再び曲がる。聖職者は従うが、その従順にも限界がある。"
 tv_engineering_department.7150.a:0 "私たちは聖職者の服従もエッジもすべてを受け入れます。"
 tv_engineering_department.7151.t:0 "構築：市場における台帳の薄型化"
 tv_engineering_department.7151.d:0 "マーケットビジネスはこのプロジェクトを中心に展開されています。強盗たちは壮大さから利益を得ることができますが、そこに至るすべての道が封鎖されている場合はそうではありません。"
 tv_engineering_department.7151.a:0 "道路をきれいにして、建設を続けましょう！"
 tv_engineering_department.7152.t:0 "建設：村の重い腰"
 tv_engineering_department.7152.d:0 "田舎の肩にはさらなる負担がかかる。プロジェクトは進み、村の忍耐力は薄れていく。"
 tv_engineering_department.7152.a:0 "田舎の肩に余分な負担がかかる。"
 tv_engineering_department.7153.t:0 "建設：敷地は街路を放棄"
 tv_engineering_department.7153.d:0 "このサイトは、通常のファブリックをさらに放棄します。現在の街路が用途を失う一方で、未来の驚異がスペースを獲得します。"
 tv_engineering_department.7153.a:0 "明日の驚異のために、これらの通りを遠ざけてくださいという標識があります。"
 tv_engineering_department.7154.t:0 "建設：現場が静かになる"
 tv_engineering_department.7154.d:0 "通常の取引が記念碑に引き寄せられるにつれて、この場所は商業的に静かになります。繁栄が衰退するまでに何度も方向転換できるのは限られています。"
 tv_engineering_department.7154.a:0 "私たちはこの場所の取引を再び記念碑に向けて舵を切ります。"
 tv_engineering_department.7155.t:0 "建設：資本プロジェクトが道を開く"
 tv_engineering_department.7155.d:0 "資本プロジェクトが再び驚異に道を譲る。王都は依然として壮大ですが、その枠組みの一部は借用されています。"
 tv_engineering_department.7155.a:0 "首都独自の枠を驚異に貸し出す。"
 tv_engineering_department.7156.t:0 "建設：首都の静かな街並み"
 tv_engineering_department.7156.d:0 "プロジェクトが信用と物資を呼び込むにつれて、首都市場は少し明るさを失います。法廷はそれを愛国的と呼ぶかもしれない。商人はこれを「遅い取引」と呼んでいます。"
 tv_engineering_department.7156.a:0 "どのモニュメントもその輝きをどこかから借りてきています。"
 tv_engineering_department.7157.t:0 "構造：負傷者名簿に名前を追加"
 tv_engineering_department.7157.d:0 "怪我人名簿に名前が追加されます。作業は続きますが、新しいマークが現れるたびに、労働者の石に対する見方が変わります。"
 tv_engineering_department.7157.a:0 "名前をメモして、続けてください。"
 tv_engineering_department.7158.t:0 "建設：財務省の扉に沈黙"
 tv_engineering_department.7158.d:0 "現場からの厳しい要求により、財務省は目に見えて空洞化している。記念碑は続きますが、王国は何かを賞賛する前に代償を支払います。"
 tv_engineering_department.7158.a:0 "宝庫を空にして石を上げさせます。"
 tv_engineering_department.7159.t:0 "工事：敷地前のマンデートクラック"
 tv_engineering_department.7159.d:0 "現場の要求によりクラウンは不名誉な姿勢を強いられる。壮大さの約束は今、傷ついた権威にかかっています。"
 tv_engineering_department.7159.a:0 "壁が立ち上がるようにクラウンを曲げます。"
 tv_engineering_department.7160.t:0 "構築：レヴィのオーダースプリンター"
 tv_engineering_department.7160.d:0 "より激しい混乱がフェンスを越えて溢れ出す。当局は原因を特定することはできるが、それを理由に国が落ち着いたと感じることはできない。"
 tv_engineering_department.7160.a:0 "暴動がフェンスを越えて進行するようにしましょう。"
 tv_engineering_department.7161.t:0 "構造：人前では名誉が揺らぐ"
 tv_engineering_department.7161.d:0 "現場での公の当惑は、いかなる公式の訂正よりも早く伝わります。名誉は、まだ立っていない石に代わるものです。"
 tv_engineering_department.7161.a:0 "彼らに話させてください！"
 tv_engineering_department.7162.t:0 "構造：高貴な忍耐が刻まれている"
 tv_engineering_department.7162.d:0 "このプロジェクトは、礼儀がもはや音をカバーできなくなるまで、崇高な忍耐を要します。記念碑が相続財産を食べるとき、それは貧しい客です。"
 tv_engineering_department.7162.a:0 "石積みが進歩する間、貴族たちは不平を言います。"
 tv_engineering_department.7163.t:0 "構築：ヴェストリーでの忍耐力の限界"
 tv_engineering_department.7163.d:0 "建設需要が祭壇の近くを踏みにじる。聖職者たちは、敬虔さがオープンスペースとして扱われることを忘れません。"
 tv_engineering_department.7163.a:0 "私たちは聖職者の冷たい沈黙を石の代価として受け入れます。"
 tv_engineering_department.7164.t:0 "建設：街頭に届く怒り"
 tv_engineering_department.7164.d:0 "現場が空間、時間、信用を飲み込み、怒りが店頭に届く。都市は記念碑を見る前にその声を聞きます。"
 tv_engineering_department.7164.a:0 "足場が上がる間、店先が不平を言います。"
 tv_engineering_department.7165.t:0 "構造：田舎の怒りは静かにならない"
 tv_engineering_department.7165.d:0 "今回の賦課金後も地方の怒りは収まらないだろう。驚異の影は、その完成した顔を決して見ることができないかもしれない農場に到達します。"
 tv_engineering_department.7165.a:0 "畑に耐えてもらいましょう！"
 tv_engineering_department.7166.t:0 "建設：サイトがフォールバックする"
 tv_engineering_department.7166.d:0 "工事は現場を後退させるほど激しく空洞化させている。記念碑はまだ建っていませんが、その周りの場所はすでに建てられています。"
 tv_engineering_department.7166.a:0 "記念碑が前進できるようにサイトを後退させます。"
 tv_engineering_department.7167.t:0 "建設：敷地の繁栄が覆われる"
 tv_engineering_department.7167.d:0 "現場は一時的に地元市場を窒息させた。荷車は今も到着しますが、石の周りの町に奉仕する荷車は少なくなります。"
 tv_engineering_department.7167.a:0 "工事が続く間、地元の市場は間引かれます。"
 tv_engineering_department.7168.t:0 "建設：資本は石で支払われます"
 tv_engineering_department.7168.d:0 "資本は石材、労働力、修理の遅れなどで支払います。遠くにある記念碑がより現実的になる一方で、近くの計画は空虚なものになります。"
 tv_engineering_department.7168.a:0 "私たちは首都独自の修復を、遠い奇跡を待つことにしました。"
 tv_engineering_department.7169.t:0 "建設：王都の貿易が圧迫されている"
 tv_engineering_department.7169.d:0 "王都の貿易は工事によって圧迫されている。遠くにある壮大さは、それに資金を提供しなければならない街路を鈍らせます。"
 tv_engineering_department.7169.a:0 "他の場所に壮大な資金を提供するために、王都の通りを鈍くします。"
 tv_engineering_department.7170.t:0 "構造：汗が血に染まる"
 tv_engineering_department.7170.d:0 "汗はその部位で血液に変化します。記念碑は中止されませんが、これは教訓の中で最も残酷な部分かもしれません。"
 tv_engineering_department.7170.a:0 "このサイトは血の代償を払っていますが、私たちは前進します。"
 tv_engineering_department.7171.t:0 "構造：[tv_great_engineer|E]がストリートを勝ち取る"
 tv_engineering_department.7171.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] は、テクニカル ツアーを公開の勝利に変えます。その結果、[tv_wonder_domestic_support|E] が大幅に改善されました。\n\n#G このイベントは、現在の [tv_great_engineer|E] が 80 を超える実効軍事能力を持っているために発生しました。#!"
 tv_engineering_department.7171.a:0 "定期検査を国民の勝利に変えます。"
 tv_engineering_department.7172.t:0 "構築：[tv_great_engineer|E] 偉大なる航路（グランドライン）を引き直す"
 tv_engineering_department.7172.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] は、より大きな計画を信頼できるものにする自信を持って主軸を再描画します。その結果、[tv_wonder_scale_competence|E] が大幅に改善されました。\n\n#G このイベントは、現在の [tv_great_engineer|E] が 80 を超える実効軍事能力を持っているために発生しました。#!"
 tv_engineering_department.7172.a:0 "大軸を無謀ではなく必然的に見せます。"
 tv_engineering_department.7173.t:0 "構築：[tv_great_engineer|E] スケジュールを再構築します"
 tv_engineering_department.7173.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] はスケジュールを非常にきれいに再構築するため、ライバルの職長もそれに従うほどです。その結果、[tv_wonder_organization_competence|E] が大幅に改善されました。\n\n#G このイベントは、現在の [tv_great_engineer|E] が 80 を超える実効軍事能力を持っているために発生しました。#!"
 tv_engineering_department.7173.a:0 "私たちは新しいスケジュールより遅れています。"
 tv_engineering_department.7174.t:0 "施工：[tv_great_engineer|E]が道を拓く"
 tv_engineering_department.7174.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] は、これまでの遅れがほとんど愚かに見えるような供給ルートを開きます。その結果、[tv_wonder_logistics_competence|E] が大幅に改善されました。\n\n#G このイベントは、現在の [tv_great_engineer|E] が 80 を超える実効軍事能力を持っているために発生しました。#!"
 tv_engineering_department.7174.a:0 "ついに道が開けました！"
 tv_engineering_department.7175.t:0 "施工：[tv_great_engineer|E]が主要工事を牽引"
 tv_engineering_department.7175.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] は、レッサー ハンドが停止していた問題を解決して主要な作業を推進します。その結果、[tv_wonder_construction|E] の進捗が大幅に改善されました。\n\n#G このイベントは、現在の [tv_great_engineer|E] が 80 を超える実効軍事能力を持っているために発生しました。#!"
 tv_engineering_department.7175.a:0 "滞った作業を完全に解決します。"
 tv_engineering_department.7176.t:0 "構造：[tv_great_engineer|E] 噂を鎮める"
 tv_engineering_department.7176.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] は、国民の信頼を安定させるのに十分なわかりやすい説明で噂に答えます。プロジェクトは [tv_wonder_domestic_support|E] で着実な改善を獲得しました。\n\n#G このイベントは、現在の [tv_great_engineer|E] が 50 を超える実効軍事能力を持っているために発生しました。#!"
 tv_engineering_department.7176.a:0 "分かりやすいトークで噂を鎮めます。"
 tv_engineering_department.7177.t:0 "構造：[tv_great_engineer|E] が測定値を設定します"
 tv_engineering_department.7177.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] は、プロジェクトが気弱な設計に陥るのを防ぐのに十分な余裕をサイト内に確保します。プロジェクトは [tv_wonder_scale_competence|E] で着実な改善を獲得しました。\n\n#G このイベントは、現在の [tv_great_engineer|E] が 50 を超える実効軍事能力を持っているために発生しました。#!"
 tv_engineering_department.7177.a:0 "大胆になれるよう計画に十分な余地を与えます。"
 tv_engineering_department.7178.t:0 "構造：[tv_great_engineer|E] ロールをまっすぐにします"
 tv_engineering_department.7178.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] は、乗組員、ツール、時計の頑固な混乱を正します。プロジェクトは [tv_wonder_organization_competence|E] で着実な改善を獲得しました。\n\n#G このイベントは、現在の [tv_great_engineer|E] が 50 を超える実効軍事能力を持っているために発生しました。#!"
 tv_engineering_department.7178.a:0 "乗組員、道具、時計を元の順序に戻します。"
 tv_engineering_department.7179.t:0 "構築：[tv_great_engineer|E]がコンボイをクリア"
 tv_engineering_department.7179.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] は輸送船団スケジュールの最悪の結び目をクリアします。プロジェクトは [tv_wonder_logistics_competence|E] で着実な改善を獲得しました。\n\n#G このイベントは、現在の [tv_great_engineer|E] が 50 を超える実効軍事能力を持っているために発生しました。#!"
 tv_engineering_department.7179.a:0 "供給ラインの最悪の結び目を解消します。"
 tv_engineering_department.7180.t:0 "構造：[tv_great_engineer|E] 重要なジョイントに適合"
 tv_engineering_department.7180.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] は重要な部分に適合し、次のステージをより早く開始できるようにします。プロジェクトは、[tv_wonder_construction|E] の進捗が着実に改善されています。\n\n#G このイベントは、現在の [tv_great_engineer|E] の有効軍事能力が 50 を超えているために発生しました。#!"
 tv_engineering_department.7180.a:0 "全速力で前進！"
 tv_engineering_department.7181.t:0 "構造：[tv_great_engineer|E] 群衆を魅了します"
 tv_engineering_department.7181.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] は未完成の作品を群衆の前に置き、その光景を信頼します。この決定は、[tv_wonder_domestic_support|E] を解除するか、サイトに多大な損害を与える可能性があります。\n\n#Y このイベントは、現在の [tv_great_engineer|E] の有効軍事能力が 20 ～ 80 であるために発生しました。#!"
 tv_engineering_department.7181.a:0 "未完成の石について群衆に判断を下させましょう。"
 tv_engineering_department.7182.t:0 "施工：[tv_great_engineer|E] プラン拡大"
 tv_engineering_department.7182.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] は、すべての疑念が払拭される前に計画の拡大を命令します。この決定は、[tv_wonder_scale_competence|E] を解除するか、サイトに多大な損害を与える可能性があります。\n\n#Y このイベントは、現在の [tv_great_engineer|E] の有効軍事能力が 20 ～ 80 であるために発生しました。#!"
 tv_engineering_department.7182.a:0 "疑問が解決する前に設計図を拡大するよう命令する。"
 tv_engineering_department.7183.t:0 "構造：[tv_great_engineer|E] シフトを書き換える"
 tv_engineering_department.7183.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] は、午後 1 日でシフトを書き換え、ヤードがそれに追いつくように努めます。この決定は、[tv_wonder_organization_competence|E] を解除するか、サイトに多大な損害を与える可能性があります。\n\n#Y このイベントは、現在の [tv_great_engineer|E] の有効軍事能力が 20 ～ 80 であるために発生しました。#!"
 tv_engineering_department.7183.a:0 "私たちはシフトを書き直し、ヤードがそれに追いつくようにあえてします。"
 tv_engineering_department.7184.t:0 "構築：[tv_great_engineer|E] 危険な道を歩む"
 tv_engineering_department.7184.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] は、困難な道でカートを送り、習慣よりも計算を信頼します。この決定は、[tv_wonder_logistics_competence|E] を解除するか、サイトに多大な損害を与える可能性があります。\n\n#Y このイベントは、現在の [tv_great_engineer|E] の有効軍事能力が 20 ～ 80 であるために発生しました。#!"
 tv_engineering_department.7184.a:0 "習慣よりも計算を信じて、より困難な道にカートを送り込みます。"
 tv_engineering_department.7185.t:0 "構築：[tv_great_engineer|E] より高速な方法をテスト"
 tv_engineering_department.7185.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] は、失敗が非常に公になる場合に、より迅速な方法をテストします。この決定は、[tv_wonder_construction|E] の進捗を妨げるか、サイトに多大な損害を与える可能性があります。\n\n#Y このイベントは、現在の [tv_great_engineer|E] が 20 ～ 80 の有効軍事能力を持っているために発生しました。#!"
 tv_engineering_department.7185.a:0 "もっと速い方法を試してください - それが公の場で証明されてみましょう!"
 tv_engineering_department.7186.t:0 "構造：[tv_great_engineer|E] コインの数え間違い"
 tv_engineering_department.7186.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] は修理の費用を誤って判断し、エレガンスをカバーするために国庫を残しました。工事は続いていますが、[gold|E] は見落としのせいで苦しんでいます。\n\n#R このイベントは、現在の [tv_great_engineer|E] の実効軍事能力が 50 未満であるために発生しました。#!"
 tv_engineering_department.7186.a:0 "アカウントに疑問を持たれる前に不足額を静かに解決します。"
 tv_engineering_department.7187.t:0 "構築：[tv_great_engineer|E] 法廷を忘れる"
 tv_engineering_department.7187.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] は王権も素材であることを忘れ、無造作に使ってしまいます。工事は続いていますが、[legitimacy|E] は見落としのせいで苦しんでいます。\n\n#R このイベントは、現在の [tv_great_engineer|E] の実効軍事能力が 50 未満であるために発生しました。#!"
 tv_engineering_department.7187.a:0 "私たちは王冠の名前の不用意な使用を抑制します。"
 tv_engineering_department.7188.t:0 "構築：[tv_great_engineer|E] 村を読み間違える"
 tv_engineering_department.7188.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] は、工学的な適切な答えがどれほどの混乱を引き起こす可能性があるかを過小評価しています。工事は続いていますが、[stability|E] は見落としのせいで苦しんでいます。\n\n#R このイベントは、現在の [tv_great_engineer|E] の実効軍事能力が 50 未満であるために発生しました。#!"
 tv_engineering_department.7188.a:0 "きちんとした解決策が残した混乱を滑らかにします。"
 tv_engineering_department.7189.t:0 "構築：[tv_great_engineer|E] は早すぎます"
 tv_engineering_department.7189.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] は、作品がその自慢を裏付ける前に自信満々に話しすぎます。工事は続いていますが、[prestige|E] は見落としのせいで苦しんでいます。\n\n#R このイベントは、現在の [tv_great_engineer|E] の実効軍事能力が 50 未満であるために発生しました。#!"
 tv_engineering_department.7189.a:0 "自慢を返してください！"
 tv_engineering_department.7190.t:0 "構築：[tv_great_engineer|E] 貴族を軽蔑する"
 tv_engineering_department.7190.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] は、高貴な忍耐をあたかも別の供給備蓄であるかのように扱います。工事は続いているが、貴族の中の[estate_satisfaction|E]が見落としで苦しんでいる。\n\n#R 現在の[tv_great_engineer|E]の実効軍事力が50未満であるためにこの出来事が発生した。#!"
 tv_engineering_department.7190.a:0 "エンジニアに、崇高な忍耐力は蓄えておくものではないことを思い出させます。"
 tv_engineering_department.7191.t:0 "構築：[tv_great_engineer|E] カレンダーを乱す"
 tv_engineering_department.7191.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] は、宗教カレンダーを出産表のように移動します。作業は続けられていますが、聖職者の中の [estate_satisfaction|E] が監督のせいで苦しんでいます。\n\n#R この出来事は、現在の [tv_great_engineer|E] の実効軍事能力が 50 未満であるために発生しました。#!"
 tv_engineering_department.7191.a:0 "結局のところ、祭壇は独自のカレンダーを保持しましょう。"
 tv_engineering_department.7192.t:0 "構造：[tv_great_engineer|E]が市場をブロック"
 tv_engineering_department.7192.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] は、サイトのよりクリーンなラインを追求しながら、通常の取引をブロックします。工事は続けられていますが、住民の [estate_satisfaction|E] は監視のせいで苦しんでいます。\n\n#R この出来事は、現在の [tv_great_engineer|E] の実効軍事能力が 50 未満であるために発生しました。#!"
 tv_engineering_department.7192.a:0 "サイトが閉鎖していたマーケットレーンを再開します。"
 tv_engineering_department.7193.t:0 "建設：[tv_great_engineer|E] 村を過小評価している"
 tv_engineering_department.7193.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] は、疲弊した村を未使用の保護区と間違えます。工事は続けられていますが、農民の中の[estate_satisfaction|E]が監視のせいで苦しんでいます。\n\n#R この出来事は、現在の[tv_great_engineer|E]の実効軍事能力が50未満であるために発生しました。#!"
 tv_engineering_department.7193.a:0 "疲れきった村を再び引っ張られるのではなく休ませます。"
 tv_engineering_department.7194.t:0 "構造：[tv_great_engineer|E] は間違った道を切り開きます"
 tv_engineering_department.7194.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] は、間違った現地の取り決めを打ち破り、そのギャップが有用であると主張します。作業は続けられていますが、現場の [development|E] は見落としにより被害を受けています。\n\n#R このイベントは、現在の [tv_great_engineer|E] の実効軍事能力が 50 未満であるために発生しました。#!"
 tv_engineering_department.7194.a:0 "誤ってカットスルーされたアレンジメントをパッチします。"
 tv_engineering_department.7195.t:0 "建設：[tv_great_engineer|E] 現場の生計を支える"
 tv_engineering_department.7195.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] は、工事のためのスペースを空けながら、地元の生計を圧迫します。作業は続けられていますが、現場の [prosperity|E] は見落としにより被害を受けています。\n\n#R このイベントは、現在の [tv_great_engineer|E] の実効軍事能力が 50 未満であるために発生しました。#!"
 tv_engineering_department.7195.a:0 "私たちは、空き地で人があふれた生活のためのスペースを再び確保します。"
 tv_engineering_department.7196.t:0 "建設：[tv_great_engineer|E] 資本を悪用"
 tv_engineering_department.7196.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] は、あたかも王都に独自の計画がないかのように資本リソースを悪用しています。工事は続いていますが、首都の [development|E] は監視のせいで苦しんでいます。\n\n#R このイベントは、現在の [tv_great_engineer|E] の実効軍事能力が 50 未満であるために発生しました。#!"
 tv_engineering_department.7196.a:0 "悪用された資源を首都独自の計画に戻す。"
 tv_engineering_department.7197.t:0 "構築：[tv_great_engineer|E] 王都を乱す"
 tv_engineering_department.7197.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] は、地元のエンジニアリング問題を解決する一方で、王都の貿易を妨害します。工事は続いていますが、首都の [prosperity|E] は監視のせいで苦しんでいます。\n\n#R このイベントは、現在の [tv_great_engineer|E] の実効軍事能力が 50 未満であるために発生しました。#!"
 tv_engineering_department.7197.a:0 "混乱が広がる前に王都の貿易を鎮めます。"
 tv_engineering_department.7198.t:0 "構築：[tv_great_engineer|E] 労働限界の判断を誤る"
 tv_engineering_department.7198.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] は、労働体の限界を誤って判断します。作業は続いていますが、現場での [population|E] の労働は監督のせいで苦しんでいます。\n\n#R この出来事は、現在の [tv_great_engineer|E] の実効軍事能力が 50 未満であるために発生しました。#!"
 tv_engineering_department.7198.a:0 "さらなるダメージを与える前に緊張を和らげてください。"
 tv_engineering_department.7199.t:0 "構築：[tv_great_engineer|E] 台帳を壊す"
 tv_engineering_department.7199.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] は避けられるミスによりアカウントを突破され、プライドが許す以上に多くのコインを空にしてしまいます。エラーだけではこの不思議を終わらせるには十分ではなく、それが最も醜い部分かもしれません。\n\n#R このイベントは、現在の [tv_great_engineer|E] の実効軍事能力が 20 未満であるために発生しました。#!"
 tv_engineering_department.7199.a:0 "損失をチョークで記録し、帳簿を静かに閉じます。"
 tv_engineering_department.7200.t:0 "構造：[tv_great_engineer|E] クラウンを巻く"
 tv_engineering_department.7200.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] は、予防可能な部位の障害を歯冠の目に見える傷に変えます。エラーだけではこの不思議を終わらせるには十分ではなく、それが最も醜い部分かもしれません。\n\n#R このイベントは、現在の [tv_great_engineer|E] の実効軍事能力が 20 未満であるために発生しました。#!"
 tv_engineering_department.7200.a:0 "私たちは王冠の新しい傷をかぶって生き続けます。"
 tv_engineering_department.7201.t:0 "構築：[tv_great_engineer|E] 国を不安にさせる"
 tv_engineering_department.7201.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] は、サイトの問題を解決しようとしている間に国を混乱に陥らせます。エラーだけではこの不思議を終わらせるには十分ではなく、それが最も醜い部分かもしれません。\n\n#R このイベントは、現在の [tv_great_engineer|E] の実効軍事能力が 20 未満であるために発生しました。#!"
 tv_engineering_department.7201.a:0 "障害が燃え尽きるまで放置します。"
 tv_engineering_department.7202.t:0 "構造：[tv_great_engineer|E] はスペクタクルを作ります"
 tv_engineering_department.7202.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] はサイトをスペクタクルにし、宮廷の名誉をそこに引き込みます。エラーだけではこの不思議を終わらせるには十分ではなく、それが最も醜い部分かもしれません。\n\n#R このイベントは、現在の [tv_great_engineer|E] の実効軍事能力が 20 未満であるために発生しました。#!"
 tv_engineering_department.7202.a:0 "法廷に華を添えましょう！"
 tv_engineering_department.7203.t:0 "施工：[tv_great_engineer|E] 怒りの家"
 tv_engineering_department.7203.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] は、特権を利用してサイトの問題を解決し、ハウスを怒らせます。エラーだけではこの不思議を終わらせるには十分ではなく、それが最も醜い部分かもしれません。\n\n#R このイベントは、現在の [tv_great_engineer|E] の実効軍事能力が 20 未満であるために発生しました。#!"
 tv_engineering_department.7203.a:0 "家の善意を使って仕事を進めます。"
 tv_engineering_department.7204.t:0 "構築：[tv_great_engineer|E] は聖職者を侮辱します"
 tv_engineering_department.7204.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] は、神聖な忍耐を世俗的な石の代償として支払うことで聖職者を怒らせます。エラーだけではこの不思議を終わらせるには十分ではなく、それが最も醜い部分かもしれません。\n\n#R このイベントは、現在の [tv_great_engineer|E] の実効軍事能力が 20 未満であるために発生しました。#!"
 tv_engineering_department.7204.a:0 "私たちは神聖な忍耐に世俗的な石の代価を支払わせます。"
 tv_engineering_department.7205.t:0 "構築：[tv_great_engineer|E] 野盗を挑発する"
 tv_engineering_department.7205.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] は商業を緩い足場として扱い、住民を挑発します。エラーだけではこの不思議を終わらせるには十分ではなく、それが最も醜い部分かもしれません。\n\n#R このイベントは、現在の [tv_great_engineer|E] の実効軍事能力が 20 未満であるために発生しました。#!"
 tv_engineering_department.7205.a:0 "足場の修繕は商人に任せます。"
 tv_engineering_department.7206.t:0 "構築：[tv_great_engineer|E] 村を壊す"
 tv_engineering_department.7206.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] は、避けられるべき要求で村の忍耐を打ち破りました。エラーだけではこの不思議を終わらせるには十分ではなく、それが最も醜い部分かもしれません。\n\n#R このイベントは、現在の [tv_great_engineer|E] の実効軍事能力が 20 未満であるために発生しました。#!"
 tv_engineering_department.7206.a:0 "私たちは村々に、私たちが彼らを免れたはずの要求に対して許しを求めます。"
 tv_engineering_department.7207.t:0 "施工：[tv_great_engineer|E] 現場を傷つけます"
 tv_engineering_department.7207.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] は、局所的な破壊による技術的問題を解決することでサイトに損害を与えます。エラーだけではこの不思議を終わらせるには十分ではなく、それが最も醜い部分かもしれません。\n\n#R このイベントは、現在の [tv_great_engineer|E] の実効軍事能力が 20 未満であるために発生しました。#!"
 tv_engineering_department.7207.a:0 "修復自体が引き起こした傷を補修します。"
 tv_engineering_department.7208.t:0 "構築：[tv_great_engineer|E] がサイトの市場を奪う"
 tv_engineering_department.7208.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] は、回避可能な決定によりサイトの市場を消滅させます。エラーだけではこの不思議を終わらせるには十分ではなく、それが最も醜い部分かもしれません。\n\n#R このイベントは、現在の [tv_great_engineer|E] の実効軍事能力が 20 未満であるために発生しました。#!"
 tv_engineering_department.7208.a:0 "それはそれで、屋台は黙ってしまいましょう！"
 tv_engineering_department.7209.t:0 "建設：[tv_great_engineer|E] 王都の計画を空虚にする"
 tv_engineering_department.7209.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] は、現場でのミスをカバーする首都の計画を空虚にする。エラーだけではこの不思議を終わらせるには十分ではなく、それが最も醜い部分かもしれません。\n\n#R このイベントは、現在の [tv_great_engineer|E] の実効軍事能力が 20 未満であるために発生しました。#!"
 tv_engineering_department.7209.a:0 "ガッツは、サイトの間違いを修正する首都独自の計画を立てています。"
 tv_engineering_department.7210.t:0 "構築：[tv_great_engineer|E] 王都の繁栄を暗くする"
 tv_engineering_department.7210.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] は、市場に決して出るべきではなかった失敗によって資本の繁栄を暗くします。エラーだけではこの不思議を終わらせるには十分ではなく、それが最も醜い部分かもしれません。\n\n#R このイベントは、現在の [tv_great_engineer|E] の実効軍事能力が 20 未満であるために発生しました。#!"
 tv_engineering_department.7210.a:0 "私たちは首都の輝きが、決して見るべきではなかった失敗によって薄れていくのを眺めています。"
 tv_engineering_department.7211.t:0 "構造：[tv_great_engineer|E] による死傷者発生"
 tv_engineering_department.7211.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] は、回避可能な障害を乗組員に通過させて死傷者を引き起こします。エラーだけではこの不思議を終わらせるには十分ではなく、それが最も醜い部分かもしれません。\n\n#R このイベントは、現在の [tv_great_engineer|E] の実効軍事能力が 20 未満であるために発生しました。#!"
 tv_engineering_department.7211.a:0 "乗組員が決して失うべきではなかった死者を数えます。"
