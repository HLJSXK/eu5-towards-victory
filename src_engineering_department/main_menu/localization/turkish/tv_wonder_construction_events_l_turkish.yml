 tv_engineering_department.7000.t:0 "İnşaat: Sokaklar Siteyi Alkışlıyor"
 tv_engineering_department.7000.d:0 "Sınırdaki birkaç gözle görülür başarı, merakı gurura dönüştürüyor. Lonca büyükleri isim verir, komşular çalışmalara kraliyet gösterişi gibi davranmayı bırakır ve proje, [tv_wonder_domestic_support|E] üzerinde daha keskin bir iddia kazanır."
 tv_engineering_department.7000.a:0 "Lonca büyüklerinin yeni iyi niyetinin işi ileriye taşımasına izin verin."
 tv_engineering_department.7001.t:0 "İnşaat: Yeryüzünde Daha Geniş Bir Çizgi"
 tv_engineering_department.7001.d:0 "Yeni ölçümler daha geniş bir ayak izi taşıyabilecek zemini ortaya koyuyor. Parşömen üzerinde hırs gibi görünen şey artık katlanılabilir bir temele sahip ve [tv_wonder_scale_competence|E] ileriye atlıyor."
 tv_engineering_department.7001.a:0 "Anketin kanıtladığı daha geniş bir zemine sahip olduğu iddiasını ortaya koyuyor."
 tv_engineering_department.7002.t:0 "İnşaat: İsimler ve Siparişler Yerine Geliyor"
 tv_engineering_department.7002.d:0 "Tersane yeni kadrolarla uyanıyor. Mürettebat nerede duracağını biliyor, katipler hangi sayının önemli olduğunu biliyor ve kafa karışıklığının saklanacak daha az yeri olduğu için [tv_wonder_organization_competence|E] yükseliyor."
 tv_engineering_department.7002.a:0 "Karışıklık geri dönmeden yeni kadroları kilitliyoruz."
 tv_engineering_department.7003.t:0 "İnşaat: Yollar ve Arabalar Ritimlerini Buluyor"
 tv_engineering_department.7003.d:0 "Daha iyi bir rota yol, su, kat ve iskeleyi birbirine bağlar. Onu kullanan ilk konvoy neredeyse utanç verici bir şekilde zamanında varıyor ve [tv_wonder_logistics_competence|E] dalgalanıyor."
 tv_engineering_department.7003.a:0 "Bu arabaların zamanında ilerlemesini sağlayın!"
 tv_engineering_department.7004.t:0 "İnşaat: Taş Hedefi Aşıyor"
 tv_engineering_department.7004.d:0 "Işık sönmeden önce aktif kısım işaretini geçer. Hiçbir mucize bunu açıklayamaz; Asansörler, eklemler ve eller doğru saatte buluşarak [tv_wonder_construction|E]'in ilerlemesini ileriye taşır."
 tv_engineering_department.7004.a:0 "Asansörlerin işaretin ötesine geçmesine izin verin."
 tv_engineering_department.7005.t:0 "İnşaat: Sokak Konuşması Dönüşüyor"
 tv_engineering_department.7005.d:0 "Sitenin etrafındaki gürültü yumuşar. Bu bir alkış değil, ama arabaların geçmesine ve tartışmaların daha çabuk bitmesine izin verilmesi yeterli; [tv_wonder_domestic_support|E] faydalı bir marjla yükseldi."
 tv_engineering_department.7005.a:0 "Arabaların geçmesine izin verin ve tartışmalar sona ersin."
 tv_engineering_department.7006.t:0 "İnşaat:Ölçü Düzeltildi"
 tv_engineering_department.7006.d:0 "Dar bir açı yeniden çiziliyor, servis yolu genişletiliyor ve anıtın ana hattı yeniden nefes alıyor. [tv_wonder_scale_competence|E]'teki gelişme küçük ama gerçektir."
 tv_engineering_department.7006.a:0 "Yolu genişletir ve tasarımın nefes almasını sağlar."
 tv_engineering_department.7007.t:0 "İnşaat: Bahçe Ritmini Öğreniyor"
 tv_engineering_department.7007.d:0 "Bir dizi eksik devir teslimi onarıldı. İş tören için fazla kuru ama araçların hareket etmesini sağlıyor ve [tv_wonder_organization_competence|E]'i geliştiriyor."
 tv_engineering_department.7007.a:0 "Devir teslimini yamalıyoruz ve aletlerin hareket etmesini sağlıyoruz."
 tv_engineering_department.7008.t:0 "İnşaat: Ruts Daha İyi Bir Yol Buluyor"
 tv_engineering_department.7008.d:0 "Besleme hattındaki kötü bir dönüş düzeltildi. Daha az sayıda araba boş bekler, daha az sayıda yük kırık olarak ulaşır ve [tv_wonder_logistics_competence|E] iyileşir."
 tv_engineering_department.7008.a:0 "Daha fazla yük çatlamadan önce kötü dönüşü düzeltir."
 tv_engineering_department.7009.t:0 "İnşaat: Çekiçler Tamamlanmaya Yakın"
 tv_engineering_department.7009.d:0 "İnatçı bir eklem nihayet yerine oturuyor ve bir sonraki ekip bir ay daha beklemeden başlayabilir. [tv_wonder_construction|E]'in ilerlemesi en tatmin edici şekilde ilerliyor: gözle görülür şekilde."
 tv_engineering_department.7009.a:0 "Sonunda yakıştı!"
 tv_engineering_department.7010.t:0 "İnşaat: Kapıda Ekmek Parası"
 tv_engineering_department.7010.d:0 "Kapıda bir kalabalık toplanıyor ve mucizenin yoksullara yönelik ekmek yediğini mırıldanıyor. Hazine [gold|E]'i caddenin tam görünümünde açar ve şimdi ödeme yaparsa, homurdanma sessizleşir ve [tv_wonder_domestic_support|E] yükselir - ancak madeni para geri gelmez."
 tv_engineering_department.7010.a:0 "Kalabalığın gözü önünde ödeyin."
 tv_engineering_department.7010.b:0 "Defterler halka açık bir bildiri olmadan da yeterince ince."
 tv_engineering_department.7011.t:0 "İnşaat: Bir Vaiz Kraliyetin Haklarını Sorguluyor"
 tv_engineering_department.7011.d:0 "Yerel bir vaiz, sürüsüne bu harikanın gurur üzerine inşa edildiğini, tacın talep etme hakkına sahip olmadığını söylüyor. Kraliyet [legitimacy|E]'i yazılı bir kararnamenin arkasına koymak, vaaz daha fazla yayılmadan önce meseleyi çözecek ve [tv_wonder_domestic_support|E]'i sabit tutacaktır."
 tv_engineering_department.7011.a:0 "Kararnameyi mühürle ve tacın sözüyle konuyu kapatalım."
 tv_engineering_department.7011.b:0 "Bir vaizin homurdanmasına ilişkin kraliyet fermanı güce değil zayıflığa benziyor."
 tv_engineering_department.7012.t:0 "İnşaat: Taş Ocağı Yolu Ortak Bir Alanı Bölüyor"
 tv_engineering_department.7012.d:0 "Yeni taş ocağı yolu iki köyün ortak tarlalarının içinden geçiyor. Yeniden yerleşimi zorlamak için [stability|E] harcamak, yolu temizleyecek ve bu köylerle elde edilen barış pahasına, bu harikanın bitmesini isteyenler arasında [tv_wonder_domestic_support|E]'i yükseltecektir."
 tv_engineering_department.7012.a:0 "Yeniden yerleşim emrini verin ve yolun geçmesine izin verin."
 tv_engineering_department.7012.b:0 "İki köyün tarlaları daha kısa bir araba yoluna değmez."
 tv_engineering_department.7013.t:0 "İnşaat: Yabancı Elçiler Gösteriş Projesiyle Alay Ediyor"
 tv_engineering_department.7013.d:0 "Rakip bir mahkemenin elçileri, bu mucizenin arkasındaki hazine için fazla büyük gösterişli bir proje olduğunu söylüyor. Cömert bir resepsiyon için [prestige|E] harcamak, eve taşıdıkları hikayeyi değiştirebilir ve [tv_wonder_domestic_support|E]'i yükseltebilir; ancak tacın bir zamanlar konukları pohpohlamak için harcanan itibarı kolayca yeniden doldurulamaz."
 tv_engineering_department.7013.a:0 "Resepsiyona harcayın ve elçilerin eve taşıdıklarını değiştirin."
 tv_engineering_department.7013.b:0 "Yabancı dedikodular tacın itibarını harcamaya değmez."
 tv_engineering_department.7014.t:0 "İnşaat: Bir Soylunun Av Koşusu Kereste Deposuna Dönüşüyor"
 tv_engineering_department.7014.d:0 "Mucizenin duvar ustaları, kerestelerini sahneye koymak için bir soylunun avlanma parkurunun bir bölümünü istiyor. Bunu verecektir, ancak yalnızca bir iyilik için tacın soylular arasında [estate_satisfaction|E]'e karşı sayılması gerekir - şimdi harcanırsa, kereste hareket etmeye başladığında yine de [tv_wonder_domestic_support|E]'i kaldıracaktır."
 tv_engineering_department.7014.a:0 "İyiliğinizi yapın ve kereste alanını alın."
 tv_engineering_department.7014.b:0 "Bir soylunun iyi niyeti ona borçlu olmaya değmez."
 tv_engineering_department.7015.t:0 "İnşaat: Cemaat Çanından Bronzu İsteniyor"
 tv_engineering_department.7015.d:0 "Harikanın kurucuları kilise çanının yeniden donanıma dönüştürülmesi için talepte bulunmak istiyor. Rahip gözlerini boş bir çan kulesinden çevirecektir, ancak bu, din adamları arasında [estate_satisfaction|E]'e mal olur - yine de [tv_wonder_domestic_support|E]'i tamamlanmamış bir iskeleden daha iyi durumda bırakacak bir fiyat."
 tv_engineering_department.7015.a:0 "Düzgünce sor ve zilin dökümhaneye gitmesine izin ver."
 tv_engineering_department.7015.b:0 "Boş bir çan kulesi, donanımın değerinden daha fazla konuşma çekecektir."
 tv_engineering_department.7016.t:0 "İnşaat: Tedarik Arabaları Pazar Meydanını Boğuyor"
 tv_engineering_department.7016.d:0 "Harikanın malzeme arabaları teslimat günlerinde pazar meydanını tıkamaya devam ediyor. Lonca ustaları kendi tezgahlarını arabaların etrafında yeniden yönlendirecekler, ancak bu kasabalılar arasında [estate_satisfaction|E]'i azaltıyor - meydan arabalarla savaşmayı bıraktığında yine de [tv_wonder_domestic_support|E]'in bir kısmını geri satın alabilecek bir maliyet."
 tv_engineering_department.7016.a:0 "Loncalara doğrudan sorun ve arabaların geçmesine izin verin."
 tv_engineering_department.7016.b:0 "Arabacıları cezalandırmak, loncalardan iyilik istemekten daha kolaydır."
 tv_engineering_department.7017.t:0 "İnşaat: Corvee Hasat Sonrası Düzenleniyor"
 tv_engineering_department.7017.d:0 "Gözetmen, hasattan sonra tutulan angarya çetelerinin dondan önce temelleri bitirmesini istiyor. Köyün yaşlıları da aynı fikirde olacak, ancak köylüler arasında bu maliyet [estate_satisfaction|E]'e mal oluyor - şimdi harcansa bile kış boyunca yarı kazılmış bir temelden [tv_wonder_domestic_support|E]'i daha yüksek bırakır."
 tv_engineering_department.7017.a:0 "Bunu açıkça söyleyin ve çetelerin hasadın geçmesini sağlayın."
 tv_engineering_department.7017.b:0 "Hasat temeller üzerinde bekleyemez."
 tv_engineering_department.7018.t:0 "İnşaat: Bir Apartman Sırası Yolda Duruyor"
 tv_engineering_department.7018.d:0 "Duvarcılar, alanın, yanındaki apartman sırasını yerle bir etmeden bir sonraki rotayı yükseltmek için fazla sıkışık olduğunu söylüyor. Bunu doğrudan sipariş etmek, binalar parçalanırken [development|E]'in sahada azalmasına neden olacak, ancak işin ve onunla birlikte [tv_wonder_domestic_support|E]'in yeniden ilerlemesine olanak tanıyacak."
 tv_engineering_department.7018.a:0 "Sıranın yerle bir edilmesini emredin ve alanı genişletin."
 tv_engineering_department.7018.b:0 "Sıkışık bir sitede yaşamak, tahliye edilen kiracılarla dolu bir sokakta yaşamaktan daha kolaydır."
 tv_engineering_department.7019.t:0 "İnşaat: Siteye Olağan Ticaret Kıvrımları"
 tv_engineering_department.7019.d:0 "Yerel arabacılar ve taş kesiciler, tesisin ihtiyacını karşılayabilmek için olağan işlerinden çekildiler. Sıradan işler azaldıkça bunun devam etmesine izin vermek [prosperity|E]'in sahada kan kaybetmesine yol açacaktır - ancak daha istikrarlı teslimatlar yine de [tv_wonder_domestic_support|E]'in sahip olmaya değer olduğu görülecektir."
 tv_engineering_department.7019.a:0 "Yerel ticaret işlere yönelmeye devam etsin."
 tv_engineering_department.7019.b:0 "Kasabanın normal ticarete, tesisin daha hızlı teslimata ihtiyaç duymasından daha fazla ihtiyacı var."
 tv_engineering_department.7020.t:0 "İnşaat: Başkentin Köprüsü Masonlarını Bekliyor"
 tv_engineering_department.7020.d:0 "Başkentin kendi köprü onarımları, ustalarının bu harikanın üzerine çekilmesi nedeniyle durdu. Köprü henüz tamamlanmamış olduğundan onları orada tutmak başkentte [development|E]'e mal olacak, ancak bu harikanın ilerleyişini ve [tv_wonder_domestic_support|E]'i ilerletmeye devam edecek."
 tv_engineering_department.7020.a:0 "Duvar ustalarını harikanın üzerinde tutun ve köprünün beklemesine izin verin."
 tv_engineering_department.7020.b:0 "Başkentin kendi köprüsü bu harikanın programını bekleyemez."
 tv_engineering_department.7021.t:0 "İnşaat: Ajanlar Başkentin Kerestesini Satın Alıyor"
 tv_engineering_department.7021.d:0 "Harikanın temsilcileri, sıradan piyasanın karşılayamayacağı fiyatlarla büyük kereste ve taş satın alıyor. Satın almanın devam etmesine izin vermek, bölgedeki ticaret azaldıkça [prosperity|E]'in başkentini boşaltacaktır, ancak işlerin tedarik edilmesini ve [tv_wonder_domestic_support|E]'in onlarla birlikte kalmasını sağlayacaktır."
 tv_engineering_department.7021.a:0 "Satın alma devam etsin ve siteyi beslesin."
 tv_engineering_department.7021.b:0 "Tek bir proje için sermayenin kendi pazarının suyu tüketilmemelidir."
 tv_engineering_department.7022.t:0 "İnşaat: İki Kat Gece Vardiyası Öneriliyor"
 tv_engineering_department.7022.d:0 "Gözetmen, son dondan dolayı kaybedilen günleri telafi etmek için gece vardiyasının iki katına çıkarılmasını istiyor. Sipariş vermek, ekstra çalışma saatleri nedeniyle sahada çalışan [population|E]'i yıpratacaktır, ancak işi ileriye doğru itecek ve [tv_wonder_domestic_support|E]'i de beraberinde kaldıracaktır."
 tv_engineering_department.7022.a:0 "Vardiyaları ikiye katlayın ve işi ileriye taşıyın."
 tv_engineering_department.7022.b:0 "Yıpranmış işçiler, dinlenmiş olanlara göre daha yavaş çalışırlar."
 tv_engineering_department.7023.t:0 "İnşaat: Sayman Masasında Daha Geniş Bir Ayak"
 tv_engineering_department.7023.d:0 "Duvarcı ustası, sonbahar yağmurlarından önce ilave kurslar yapılırsa zeminin bunu alacağını iddia ederek, saymanın masasına daha geniş bir temel planı koyuyor. Sayman eklenen taş ve eller için altını şimdi serbest bırakabilir ya da plan gelecek yılın araştırmasını bekler."
 tv_engineering_department.7023.a:0 "Altını serbest bırakın ve yağmurlardan önce duvarcıların daha geniş bir temel oluşturmasına izin verin."
 tv_engineering_department.7023.b:0 "Parayı geri tutun; yağmurlar önümüzdeki baharda da devam edecek."
 tv_engineering_department.7024.t:0 "İnşaat: Anket Riskleri Bir Çitte Duruyor"
 tv_engineering_department.7024.d:0 "Haritacının kazıkları komşunun çit hattında yetersiz kalıyor ve komşu onların geçmesine izin vermiyor. Bugün bir kraliyet emriyle sınır belirlenebilir, ancak tartışmalı bir çit üzerinde tacın adını anmak gözden kaçmayacaktır."
 tv_engineering_department.7024.a:0 "Yazıyı gönderin ve tacın adını daha geniş sınırın arkasına koyun."
 tv_engineering_department.7024.b:0 "Çitin ayakta kalmasına izin verin; tacın adı bir hedge anlaşmazlığına harcanmıyor."
 tv_engineering_department.7025.t:0 "İnşaat: Daha Geniş Plan Ortak Alanı Aşar"
 tv_engineering_department.7025.d:0 "Daha geniş plan, bir mezranın ortak otlatma alanının içinden geçiyor. Sınır taşlarını köyün içinden geçirmek artık anket sorusunu çözecektir, ancak hane halkı onları kimin taşıdığını unutmayacaktır."
 tv_engineering_department.7025.a:0 "Taşları hareket ettirin ve araştırmanın daha büyük ayak izine yerleşmesine izin verin."
 tv_engineering_department.7025.b:0 "Ortak olanı olduğu gibi bırakın; kırgın bir köy daha geniş bir tabana değmez."
 tv_engineering_department.7026.t:0 "İnşaat: Yabancı Bir Masonun Mührünün Bedeli"
 tv_engineering_department.7026.d:0 "Yabancı bir usta duvarcı, daha geniş tasarımı onaylamayı teklif ediyor, ancak bunun için yalnızca sarayın adının kendi memleketindeki lonca kayıtlarında patronu olarak belirtilmesi gerekiyor. Onay, buradaki boyutlandırma sorununu çözecektir; istek kamuya açıktır ve harcanamaz."
 tv_engineering_department.7026.a:0 "Onayı verin ve daha geniş ayak izi konusunda ustanın sözünü dinleyin."
 tv_engineering_department.7026.b:0 "Mahkemenin adını saklı tutun; yabancı bir loncanın defteri onu harcayacak yer değil."
 tv_engineering_department.7027.t:0 "İnşaat: Temel Planı Baron'un Avını Aşıyor"
 tv_engineering_department.7027.d:0 "Daha geniş temel planı, yerel bir baronun uzun süredir avı için kullandığı zemini geçiyor. Haritacılar bitirirken ondan dilini tutmasını istemek daha büyük ölçekli bir ses olduğunu kanıtlayacaktır, ancak burada harcanan asil sabır, geri dönmesini bekleyeceği sabırdır."
 tv_engineering_department.7027.a:0 "Baronun sabrını isteyin ve bırakın kadastrocular avlanma sahasını geçmeyi bitirsinler."
 tv_engineering_department.7027.b:0 "Baronun arazisinin etrafında rota çizin; onun iyi niyeti anket hattında harcamaya değmez."
 tv_engineering_department.7028.t:0 "İnşaat: Plan Kutsal Topraklardan Bir Köşe İstiyor"
 tv_engineering_department.7028.d:0 "Daha geniş plan, cemaatin yaşayan anılardan bu yana elinde tuttuğu kutsanmış bir alanın bir köşesini gerektiriyor. Rahipler, eğer doğru şekilde sorulursa, bu bölgede bir araştırma yapılmasına izin verirler, ancak din adamlarından iskele hattı için kutsal bir yer vermelerini istemek, ödünç verilen değil, harcanan bir iyiliktir."
 tv_engineering_department.7028.a:0 "Rahiplerden köşeyi bırakmalarını ve daha geniş bir araştırmayı onaylamalarını isteyin."
 tv_engineering_department.7028.b:0 "Anketi eski sınırların içinde tutun; kutsanmış toprak test edilecek yer değildir."
 tv_engineering_department.7029.t:0 "İnşaat: Yün Tüccarları Yolu Aranıyor"
 tv_engineering_department.7029.d:0 "Daha geniş ayak izi, yün tüccarlarının pazar günlerinde kullandığı yolu yutacaktır. Lonca belediye meclisi üyeleri istendiğinde dolambaçlı yoldan izin verirdi, ancak sokaklarını bir inşaat sahasına ödünç veren kasabalılar bu rahatsızlığı ankete göre daha uzun süre hatırlıyorlar."
 tv_engineering_department.7029.a:0 "Belediye meclis üyelerinden dolambaçlı yolu isteyin ve şerit üzerindeki daha geniş ayak izini onaylayın."
 tv_engineering_department.7029.b:0 "Tüccarların yolunu rahat bırakın; piyasanın şerefiyesi iskele hattına harcanmıyor."
 tv_engineering_department.7030.t:0 "İnşaat: Köyden Kazılması İsteniyor"
 tv_engineering_department.7030.d:0 "Ustabaşı, yakındaki köyün kendi tarlalarıyla ilgilenmek yerine kazmaya el atması halinde daha geniş temellerin bir hafta içinde sağlam hale getirilebileceğini söylüyor. Köy muhtara hesap verecekti ama ekim mevsiminde toplanan vergi sonbahara kadar unutulmadı."
 tv_engineering_department.7030.a:0 "Köy vergisini arayın ve hafta bitmeden daha geniş bir temel kazın."
 tv_engineering_department.7030.b:0 "Bırakın köy tarlalarında kalsın; ustabaşı bunun yerine işe alınacak kişileri bekleyebilir."
 tv_engineering_department.7031.t:0 "İnşaat: Ayak İzinde Bir Sıra Atölye Duruyor"
 tv_engineering_department.7031.d:0 "Daha geniş alana sahip olmanın tek yolu, halihazırda alanın kenarında duran bir dizi atölyeyi yıkmaktır. Taşları ve temelleri doğrudan yeni plana girecek, ancak alanda zaten inşa edilmiş olanı yıkmak geri alınacak bir şey değil."
 tv_engineering_department.7031.a:0 "Sırayı aşağı çekin ve taşını daha geniş alana katlayın."
 tv_engineering_department.7031.b:0 "Atölyeleri ayakta bırakın; site başka bir yönde büyüyebilir."
 tv_engineering_department.7032.t:0 "İnşaat: Kereste Tüccarlarından Bir Alıcı Seçmeleri İsteniyor"
 tv_engineering_department.7032.d:0 "Sahadaki kereste tüccarlarının, eğer sıradan ticaretleri Kraliyet'in sözleşmesi için bir kenara bırakılırsa, bugün daha geniş bir zemine malzeme taşıyacak stokları ve vagonları var. Sitedeki pazarlar çalışmalara cevap verecek, ancak tek bir alıcıya yönelen ticaret yolu kendi kendine geri dönmeyecek."
 tv_engineering_department.7032.a:0 "Yerel ticareti işlere yönlendirin ve daha geniş bir alan için dolguyu taşıyın."
 tv_engineering_department.7032.b:0 "Tüccarları kendi olağan ticaretleriyle baş başa bırakın; dolgu başka bir şekilde elde edilebilir."
 tv_engineering_department.7033.t:0 "İnşaat: Başkentin Yol Tamircileri Başka Bir Yerde Aranıyor"
 tv_engineering_department.7033.d:0 "Başkentin kendi yol tamircileri ve inşaat ustaları, bu ay onay araştırmasını yürütmekte özgür olan tek ekip. Bunları başkentin kendi onarımlarından çıkarmak, daha geniş ayak izi sorununu çözecektir, ancak başkentin sokakları bıraktıkları boşluğu gösterecektir."
 tv_engineering_department.7033.a:0 "Başkentin mürettebatını yeniden görevlendirin ve daha geniş bir alanı onaylamalarına izin verin."
 tv_engineering_department.7033.b:0 "Başkentin onarımını bir kenara bırakın; anket başka yerlerde boşta kalanları bekleyebilir."
 tv_engineering_department.7034.t:0 "İnşaat: Guildhall'lar Bu Sezonun Kazançlarını Sunuyor"
 tv_engineering_department.7034.d:0 "Başkentin lonca salonları, paranın kış fuarları hesaplarını kapatmadan önce çekilmesi şartıyla, bu sezonun ticaret alımlarından onay anketini üstlenmeyi teklif ediyor. Başkentin piyasaları daha geniş bir ayak izi olduğunu kanıtlayacaktı, ancak bir sezondaki kazançlar lonca salonlarının cevaplanmasını isteyeceği bir sezona dönüştü."
 tv_engineering_department.7034.a:0 "Fuarlar kapanmadan önce başkentin ticari kazançlarından yararlanın ve daha geniş bir alanı onaylayın."
 tv_engineering_department.7034.b:0 "Lonca salonlarının kitaplarını rahat bırakın; Anket bunun yerine hazineyi bekleyebilir."
 tv_engineering_department.7035.t:0 "İnşaat: Mürettebattan Dinlenme Günleri İsteniyor"
 tv_engineering_department.7035.d:0 "Ustabaşı, halihazırda şantiyede bulunan ekiplerin vardiyalar arasında dinlenmek yerine dinlenme günlerini geçirmeleri halinde bu ay daha geniş bir zemine sahip olunabileceğini söylüyor. Anket, daha büyük bir tasarıyı çözecektir, ancak olağan hızlarının dışına çıkan işçilerin hepsi uzun süre işçi olarak kalamaz."
 tv_engineering_department.7035.a:0 "Mürettebatı dinlenme günlerine yönlendirin ve bu ay daha geniş bir temele oturtun."
 tv_engineering_department.7035.b:0 "Mürettebat dinlenme günlerine devam etsin; anketin daha yavaş ilerlemesini bekleyebilir."
 tv_engineering_department.7036.t:0 "İnşaat: Vardiya Panolarına Memur Aranıyor"
 tv_engineering_department.7036.d:0 "Şantiye ustabaşı, vardiya panolarını yeniden çizecek ve bunları mürettebatın gerçekten okuyabileceği bir yere asacak uygun bir çalışma memuru istiyor. Hazine bir ücret karşılığında adama ve mürekkebini sağlayabilir ve [tv_wonder_organization_competence|E] yeni yönetim kurullarını takip edecektir."
 tv_engineering_department.7036.a:0 "Katibi işe alıyoruz ve yeni panoları bugün asıyoruz."
 tv_engineering_department.7036.b:0 "Eski tahtalar bu kadar uzun süre dayandı; biraz daha uzun süre dayanabilirler."
 tv_engineering_department.7037.t:0 "İnşaat: İki Ustabaşı Birbirlerinin Emirlerini Reddediyor"
 tv_engineering_department.7037.d:0 "Sahadaki iki lonca ekibi birbirlerinin ustabaşılarından emir almayı reddediyor ve tartışma bu hafta iki kez sabah vardiyasının durmasına neden oldu. Yalnızca tacın [legitimacy|E]'ini taşıyan bir yazı aralarındaki önceliği belirleyecek ve tartışma sona erdiğinde [tv_wonder_organization_competence|E] onu takip edecek."
 tv_engineering_department.7037.a:0 "Yazının taslağı hazırlandı ve mühürlendi; mürettebat buna cevap verir veya kimseye cevap vermez."
 tv_engineering_department.7037.b:0 "Tacın sözü hangi masonun daha yüksek sesle küfrettiğini belirlemekle bitmiyor."
 tv_engineering_department.7038.t:0 "İnşaat: Eski Rota Hasatı Unuttu"
 tv_engineering_department.7038.d:0 "Zorunlu köy işçiliği, hasadı hiçbir zaman hesaba katmayan eski bir programa göre düzenleniyordu ve mürettebatın yarısı, tarlalarının ihtiyacı olduğunda çekip gidiyor. Yerel itirazlar nedeniyle rotayı zorlamak ülkenin [stability|E]'ini azaltacaktı, ancak ekipler sonunda sabit saatlere uyacaktı ve [tv_wonder_organization_competence|E] de onu takip edecekti."
 tv_engineering_department.7038.a:0 "Rotayı zorluyoruz; hasat bir kez olsun mucizeyi bekleyebilir."
 tv_engineering_department.7038.b:0 "Sorunu zorlamak artık yalnızca bir eksikliği daha kötü bir eksiklikle değiştiriyor."
 tv_engineering_department.7039.t:0 "İnşaat: Masonlar Yeni Denetçiye Cevap Vermeyecek"
 tv_engineering_department.7039.d:0 "Usta duvarcılar, vardiyalarını yeniden düzenlemek için gönderilen genç gözetmene cevap vermeyecekler ve bunu tüm avlunun duyabileceği mesafede söylüyorlar. Yalnızca mahkemenin [prestige|E]'i tarafından desteklenen bir isim, onları hizaya getirmeye yetecek kadar ağırlığa sahiptir ve [tv_wonder_organization_competence|E] onların uyumluluğunu izleyecektir."
 tv_engineering_department.7039.a:0 "Nezaretçiye mahkemenin adını veriyoruz; Masonlar başka bir şey olmasa bile buna cevap verirler."
 tv_engineering_department.7039.b:0 "Genç bir gözetmenin yetkisi saraydan ödünç alınmamalı, avluda kazanılmalıdır."
 tv_engineering_department.7040.t:0 "İnşaat: Komşu Bir Lord, Vekilharçını Sunuyor"
 tv_engineering_department.7040.d:0 "Komşu lord, yirmi yıl boyunca bir malikanenin vardiyalarını yürüten bir adam olan yeni mürettebat kadrolarını hazırlamak için kendi ev hizmetçisini ödünç vermeyi teklif eder. İyiliğin hakkını vermek soylular arasında [estate_satisfaction|E]'e mal olur, ancak kâhyanın kadrosu [tv_wonder_organization_competence|E]'i getirir."
 tv_engineering_department.7040.a:0 "Kahyayı kabul ediyoruz ve lorda hakkını borçluyuz."
 tv_engineering_department.7040.b:0 "O lorda olan borç, düzenli listelerden daha değerlidir."
 tv_engineering_department.7041.t:0 "İnşaat: Vardiya Kornaları Katedral Çanlarına Cevap"
 tv_engineering_department.7041.d:0 "Sitenin vardiya kornaları her zaman katedral çanlarını takip etmiştir ve çanlar bir mucizeye uyacak şekilde hareket ettirilmeyecektir. Vardiya değişikliklerini işaretlemek için bölümün fazladan bir saat çalmasını istemek din adamları arasında [estate_satisfaction|E]'e mal oluyor, ancak ekipler nihayet görevlerini zamanında teslim edecek ve [tv_wonder_organization_competence|E]'i getireceklerdi."
 tv_engineering_department.7041.a:0 "Homurdanmanın bize maliyeti ne olursa olsun, bölümden ekstra zil istiyoruz."
 tv_engineering_department.7041.b:0 "Çanlar bir ustabaşının vardiya değişimini değil, Tanrı'nın saatlerini gösterir."
 tv_engineering_department.7042.t:0 "İnşaat: Piyasada Malzeme Arabaları Kuyruğu"
 tv_engineering_department.7042.d:0 "Malzeme arabaları artık günde iki kez pazar meydanında sıraya giriyor ve lonca tezgahtarları en iyi saatlerini gürültü ve çamur yüzünden kaybediyor. Sabit bir programa göre meydanı arabalar için temizlemek kasabalılar arasında [estate_satisfaction|E]'e mal oluyor, ancak arabalar sonunda mürettebatın planlayabileceği bir programa varacak ve [tv_wonder_organization_competence|E]'i getirecek."
 tv_engineering_department.7042.a:0 "Programı sabitliyoruz ve meydanı temizliyoruz, tezgahlar olsun ya da olmasın."
 tv_engineering_department.7042.b:0 "Piyasa mucizeyi beslemeden önce kasabayı besler."
 tv_engineering_department.7043.t:0 "İnşaat: Köylerden İkinci Bir Rotasyon İsteniyor"
 tv_engineering_department.7043.d:0 "Mevcut ekipler iki katına çıkmadan önce çevredeki köylerden ikinci bir el rotasyonu göndermeleri isteniyor. Ekim ve hasat arasında onları kendi arazilerinden çıkarmak köylüler arasında [estate_satisfaction|E]'e mal olur, ancak tam bir ikinci rotasyon, tesisin sonunda uygun vardiyaları çalıştırmasına olanak tanıyarak [tv_wonder_organization_competence|E]'i getirir."
 tv_engineering_department.7043.a:0 "İkinci rotasyonu çağırıyoruz ve sahaların sırasını beklemesine izin veriyoruz."
 tv_engineering_department.7043.b:0 "Sonbaharda boş tarlalar ülkeye düzensiz vardiya programından daha pahalıya mal oluyor."
 tv_engineering_department.7044.t:0 "İnşaat: Sahne Alanı Geçilemeyecek Kadar Dar"
 tv_engineering_department.7044.d:0 "Sahne alanı, ekiplerin çalışmayı durdurmadan birbirlerini geçemeyecek kadar sıkışık ve bu karışıklık her sabah bir saate mal oluyor. Bitişikteki bloğun uygun bir avlu için temizlenmesi, bölgedeki [development|E]'i tüketiyor, ancak ekipler sonunda çarpışmadan hareket ederek [tv_wonder_organization_competence|E]'i getiriyor."
 tv_engineering_department.7044.a:0 "Bloğu yıkıp mürettebata hareket alanı sağlıyoruz."
 tv_engineering_department.7044.b:0 "Blok kalır; sıkışık bir avlu yıkılmış olandan daha ucuzdur."
 tv_engineering_department.7045.t:0 "İnşaat: Yerel Arabacılar Sessizce Yönlendiriliyor"
 tv_engineering_department.7045.d:0 "Bir zamanlar sitenin kendi işlerini yapan yerel arabacılar ve hamallar, bunun yerine sessizce harika malzemeleri taşımaya yönlendirildi ve sonuç olarak işlerin etrafındaki olağan ticaret azaldı. Düzenlemeyi resmileştirmek, bu elleri mucizenin programına bağlamak, sahada [prosperity|E]'e mal olur, ancak [tv_wonder_organization_competence|E], artık eksik arabaları beklemeyen mürettebattan gelecektir."
 tv_engineering_department.7045.a:0 "Düzenlemeyi resmileştiriyoruz; arabacılar artık mucizenin programına cevap veriyor."
 tv_engineering_department.7045.b:0 "Sıradan ticaret sitedeki insanların karnını doyuruyor; mucize araba için sırasını bekleyebilir."
 tv_engineering_department.7046.t:0 "İnşaat: Başkent Ustabaşını Ödünç Veriyor"
 tv_engineering_department.7046.d:0 "Başkentin kendi inşaat işleri, harikanın vardiya kadrolarının yeniden belirlenmesine yardımcı olmak için ustabaşılarını ödünç verdi ve kredi, başkentin kendi projelerinin ellerinin kısa kalmasına neden oldu. Krediyi kalıcı hale getirmek başkentte [development|E]'e mal olur, ancak bu harika site, kadroyu nasıl çalıştıracağını gerçekten bilen bir ustabaşı bulunduracak ve [tv_wonder_organization_competence|E]'i getirecektir."
 tv_engineering_department.7046.a:0 "Krediyi kalıcı hale getiriyoruz; başkentin projeleri onsuz idare edecek."
 tv_engineering_department.7046.b:0 "Başkentin kendi ustabaşına ihtiyacı, harikanın başka bir ustabaşına ihtiyacı olduğundan daha fazla."
 tv_engineering_department.7047.t:0 "İnşaat: Limanın Düzeni Yeniden Düzenlendi"
 tv_engineering_department.7047.d:0 "Başkentteki tüccarların teslimat günleri sessizce yeniden düzenlendi, böylece harika malzemeler ilk önce limanı temizledi ve başkentin olağan ticareti artık harikaların arabalarının arkasında bekliyor. Limanın yeni siparişini onaylamanın başkentteki maliyeti [prosperity|E]'tir, ancak saha nihayet malzemeleri mürettebatın vardiya oluşturabileceği bir programa göre alacak ve [tv_wonder_organization_competence|E]'i getirecek."
 tv_engineering_department.7047.a:0 "Limandaki yeni düzeni onaylıyoruz; tüccarlar zamanla uyum sağlayacaklardır."
 tv_engineering_department.7047.b:0 "Başkentin kendi ticareti başka bir şehrin şantiyesinin arkasında beklememeli."
 tv_engineering_department.7048.t:0 "İnşaat: Yeniden Eğitim Mürettebattan İki Katına Çıkmalarını İstiyor"
 tv_engineering_department.7048.d:0 "Tesis, yeni kadroların yeniden eğitilmesi için iki tam mürettebattan yoksun olduğundan, mevcut işçilerden, yeni program yürürlüğe girene kadar görevlerini ikiye katlamaları isteniyor. Çalışan [population|E]'i sahada haftalarca bu kadar zorlu bir şekilde sürmek onlara pahalıya mal oluyor, ancak yeniden eğitim sonunda kalıcı olacak ve [tv_wonder_organization_competence|E]'i getirecek."
 tv_engineering_department.7048.a:0 "Şimdilik gönderileri ikiye katlıyoruz; yeni kadrolar zorlanmaya değer."
 tv_engineering_department.7048.b:0 "Yıpranmış ekipler hiçbir şey öğrenmiyor; yeniden eğitim ellerin dinlenmesini bekleyebilir."
 tv_engineering_department.7049.t:0 "İnşaat: Tek Bir Ford Her Arabayı Yedekliyor"
 tv_engineering_department.7049.d:0 "Sahaya giden her arabayı tek bir dar geçit destekliyor. Malzeme sorumlusu şimdi [gold|E]'i kalaslama ve ücretli köprü inşaatçıları ekibi için istiyor, böylece [tv_wonder_logistics_competence|E] kuyruk yolun kendisinden daha uzun hale gelmeden önce tekrar hareket edebilir."
 tv_engineering_department.7049.a:0 "Köprü ustalarına ödeme yapın ve geçidi temizleyin."
 tv_engineering_department.7049.b:0 "Hazinenin bu parayı su birikintisinden geçmekten daha iyi kullanım alanları var."
 tv_engineering_department.7050.t:0 "İnşaat: Arazi Sahipleri Konvoy Geçişini Reddediyor"
 tv_engineering_department.7050.d:0 "Yeni rotadaki toprak sahipleri, kraliyet emri olmadan arabaların tarlalarından geçmesine izin vermiyor. Tacın [legitimacy|E]'ini burada harcamak, kapıları açacak ve [tv_wonder_logistics_competence|E]'in ilerlemesine olanak tanıyacaktır, ancak yalnızca bu yolda ve yalnızca bugün."
 tv_engineering_department.7050.a:0 "Yazıyı yayınlayın ve alanları arabalara açın."
 tv_engineering_department.7050.b:0 "Tacın sözü her inatçı toprak sahibine harcanmaz."
 tv_engineering_department.7051.t:0 "İnşaat: Araba Yolu Köyün Yeşilini Kesiyor"
 tv_engineering_department.7051.d:0 "Eski at arabası yolu doğrudan köyün yeşil alanından geçiyor ve yol ustaları üç ev ve bir kuyunun taşınmasıyla bu yolun genişletilmesini istiyor. Sipariş [tv_wonder_logistics_competence|E]'i ilerletecek, ancak homurdananlarla birlikte tacın [stability|E]'ine mal olacak."
 tv_engineering_department.7051.a:0 "Emri verin, evler ve lanet olsun."
 tv_engineering_department.7051.b:0 "Köyün yeşili kalsın; yol onun etrafında kıvrılabilir."
 tv_engineering_department.7052.t:0 "İnşaat: Tek Yedek Atlar Başka Bir Loncaya Aittir"
 tv_engineering_department.7052.d:0 "Bir sonraki eyaletteki vagon loncası, kiralanacak tek yedek yük atına sahiptir. Efendileri onları ödünç verecek ve [tv_wonder_logistics_competence|E]'in yetişmesine izin verecek, ancak bu, yalnızca mahkemenin sınırsız olmayan [prestige|E]'inden harcanan bir iyilik olarak."
 tv_engineering_department.7052.a:0 "Bir iyilik iste ve o atları yola koy."
 tv_engineering_department.7052.b:0 "Mahkemenin itibarını, çağırmaya değer bir borca saklayın."
 tv_engineering_department.7053.t:0 "İnşaat: Soyluların Taşıyıcı Ekipleri Taş İçin Aranıyor"
 tv_engineering_department.7053.d:0 "Yol ustalarının vagonları kalmadı ve taş taşıma işinin konuklar yerine yerel soyluların kendi taşıma ekiplerine verilmesini istiyor. [tv_wonder_logistics_competence|E] zemin kazanacaktır, ancak bu rahatsızlıktan dolayı homurdanacak olan soylular arasında [estate_satisfaction|E]'e mal olacaktır."
 tv_engineering_department.7053.a:0 "Arabalara el koyun ve onları taş taşımaya koyun."
 tv_engineering_department.7053.b:0 "Soylulara arabalarını bırakın; Vagonları başka yerde bul."
 tv_engineering_department.7054.t:0 "İnşaat: Manastırın Deposu Aranıyor"
 tv_engineering_department.7054.d:0 "Yol üzerindeki tek kuru depo en yakın manastırda bulunuyor ve yol yöneticileri bu deponun tahıl ve aletler için boşaltılmasını istiyor. Bunu temizlemek [tv_wonder_logistics_competence|E]'in taşınmasına yardımcı olacaktır, ancak kimin vagonlarının onu doldurduğunu unutmayan din adamları arasında [estate_satisfaction|E]'e mal olacaktır."
 tv_engineering_department.7054.a:0 "Depoyu boşaltın ve malzemeleri istifleyin."
 tv_engineering_department.7054.b:0 "Manastırın mağazalarına dokunmadan bırakın."
 tv_engineering_department.7055.t:0 "İnşaat: Konvoyun Pazar Meydanına İhtiyacı Var"
 tv_engineering_department.7055.d:0 "Konvoyun vagonlarını çevirmek için kasabanın pazar meydanına ihtiyacı var ama o meydan aynı zamanda pazar yeridir. Tezgahların kapatılması, arabaların öğle vakti hareket etmesine ve tezgahları kapalı kalan kasabalılar arasında [tv_wonder_logistics_competence|E] pahasına [estate_satisfaction|E]'e yardımcı olacaktır."
 tv_engineering_department.7055.a:0 "Pazarı kapatın ve vagonların geçmesine izin verin."
 tv_engineering_department.7055.b:0 "Piyasa açık kalır; vagonlar bir gün bekleyebilir."
 tv_engineering_department.7056.t:0 "İnşaat: Çamurlu Bir Yol Yolu Yutuyor"
 tv_engineering_department.7056.d:0 "Yolun bir kısmı çamura döndü ve hiçbir öküz takımı bu yolu tek başına aşamaz. Köyün kendi öküzlerini ve sırtlarını iplere bağlamak onu temizleyecek ve [tv_wonder_logistics_competence|E]'e yardımcı olacaktır, ancak bahar ekimi için bu öküzlere ihtiyaç duyan köylüler arasında [estate_satisfaction|E]'e mal olacaktır."
 tv_engineering_department.7056.a:0 "Köyün kendi öküzlerini ve sırtlarını iplere bağlayın."
 tv_engineering_department.7056.b:0 "Bırakın köylüler bahar ekimi için öküzlerini saklasınlar."
 tv_engineering_department.7057.t:0 "İnşaat: Sahne Alanı Vagonları Tutamaz"
 tv_engineering_department.7057.d:0 "Sahadaki depolama sahası artık her gün gelen vagonlar için fazla sıkışık. Kenarındaki yarı inşa edilmiş depoların temizlenmesi, [tv_wonder_logistics_competence|E]'in çalışması için alan açacak, bu da zaten bu depoların içine gömülmüş olan sahadaki [development|E]'in maliyetine mal olacaktır."
 tv_engineering_department.7057.a:0 "Depoları temizleyin ve bahçeyi genişletin."
 tv_engineering_department.7057.b:0 "Depoları koruyun; vagonlar dışarıda sıraya girebilir."
 tv_engineering_department.7058.t:0 "İnşaat: Hancılara Önce Konvoylara Hizmet Vermeleri Söylendi"
 tv_engineering_department.7058.d:0 "Alanın yakınındaki hancılara ve arabacılara, öncelikle harikanın konvoyları için yedek stoklarını tutmaları ve yalnızca diğer herkese kalanları satmaları söylendi. Bu, [tv_wonder_logistics_competence|E]'in beslenmesini sağlayacaktır, ancak yerel ticaret azaldıkça sahadaki [prosperity|E] maliyetine mal olacaktır."
 tv_engineering_department.7058.a:0 "Önce konvoyların stoğunu tutun."
 tv_engineering_department.7058.b:0 "Bırakın kasaba her zaman olduğu gibi ticaret yapsın."
 tv_engineering_department.7059.t:0 "İnşaat: Başkentin Asfaltlama Ekipleri Yolda Aranıyor"
 tv_engineering_department.7059.d:0 "Başkentin asfaltlama ekipleri bir pazar caddesini yeniden döşeme işinin yarısına gelmişken, yol ustaları sahaya giden yol üzerindeki tekerlek izlerini sağlamlaştırmak için onlardan bunu istedi. Bunların yeniden atanması [tv_wonder_logistics_competence|E]'i, caddesi yarı parke taşlı kalan başkentte [development|E] pahasına ileriye itecektir."
 tv_engineering_department.7059.a:0 "Ekipleri caddeden çekin ve rotaya gönderin."
 tv_engineering_department.7059.b:0 "Önce pazar caddesini bitirin; rota bekleyebilir."
 tv_engineering_department.7060.t:0 "İnşaat: Başkentin Tahıl Ambarları Güzergah İçin Aranıyor"
 tv_engineering_department.7060.d:0 "Başkentin kapısına en yakın tahıl ambarları, güzergah için vagonları stoklamanın en hızlı yoludur ve yol yöneticileri bunların açılmasını istiyor. Rezervin satılması, [tv_wonder_logistics_competence|E]'in sermayedeki [prosperity|E] pahasına, kendi piyasalarının bir sezon boyunca zayıf olması nedeniyle ilerlemesine yardımcı olacaktır."
 tv_engineering_department.7060.a:0 "Tahıl ambarlarını açın ve vagonları stoklayın."
 tv_engineering_department.7060.b:0 "Yağışsız bir sezona karşı tahıl ambarlarını kapalı tutun."
 tv_engineering_department.7061.t:0 "İnşaat: İşçilerden Birikmiş İş Listesini Boşaltmaları İsteniyor"
 tv_engineering_department.7061.d:0 "Yedeklenmiş vagonları boşaltmak için sadece tesisin kendi işçileri serbesttir ve ustabaşı onların normal görevlerini bırakıp halatlarda ekstra vardiyalara alınmasını istiyor. Bu, [tv_wonder_logistics_competence|E]'i hareket ettirir, ancak sahada fazladan saatlerin yıprattığı emekçi [population|E]'ten yararlanır."
 tv_engineering_department.7061.a:0 "İşçileri ekstra vardiyalara çekin ve birikmiş işleri temizleyin."
 tv_engineering_department.7061.b:0 "Bırakın işçiler normal görevlerine devam etsinler."
 tv_engineering_department.7062.t:0 "İnşaat: Vinçler Para İstenmediği İçin Boşta Duruyor"
 tv_engineering_department.7062.d:0 "Maliye memuru madeni paranın kasa odasında sayılmadan durduğuna yemin etmesine rağmen, kaldırma vinçleri ücretli personel eksikliği nedeniyle her üç günde bir boşta duruyor. Onu şimdi serbest bırakmak, don gelmeden önce iplerin yeniden ele alınmasını sağlayacaktır."
 tv_engineering_department.7062.a:0 "Kasa odasını açın ve [gold|E]'i çift vardiyada harcayarak [tv_wonder_construction|E] ilerlemesini satın alın."
 tv_engineering_department.7062.b:0 "Kasa odasını mühürlü bırakın; mürettebat olağan maaş gününü bekliyor."
 tv_engineering_department.7063.t:0 "İnşaat: Masonlar Kraliyetin Kendi Mührünü İstiyor"
 tv_engineering_department.7063.d:0 "Duvar ustaları, bir valinin değil, tacın kendi mührünü taşıyan bir yazı olmadan tartışmalı sınır taşlarını geçmeyi reddediyorlar. Hükümdarın adının emirlere konulması bugün meseleyi çözecektir, ancak taş ocakçılarına harcanan bu tür emirlerin her biri mahkeme ve konsey için bir eksiktir."
 tv_engineering_department.7063.a:0 "Sınır taşlarını aşan [legitimacy|E] ilerlemesini satın almak için [tv_wonder_construction|E] harcayarak hükümdarın adına fermanı mühürleyin."
 tv_engineering_department.7063.b:0 "Kraliyet mührünü saklayın ve valinin sınırı kendisi tartışmasına izin verin."
 tv_engineering_department.7064.t:0 "İnşaat: İki Mezra Servis Yolunu Kapatıyor"
 tv_engineering_department.7064.d:0 "Planlanan servis yolunun üzerinde iki mezra bulunuyor ve muhtarları iki kez açıkça hayır dedi. Onları kenara çekmek, tacın son kötü hasattan bu yana sürdürdüğü sessizliğin pahasına, bir hafta içinde yolu temizlemek anlamına gelir."
 tv_engineering_department.7064.a:0 "Servis yolu boyunca [stability|E] ilerlemesini temizlemek için [tv_wonder_construction|E] harcayarak mezralara yol vermelerini emredin."
 tv_engineering_department.7064.b:0 "Servis yolunu mezraların çevresine yeniden yönlendirin ve muhtarları rahat bırakın."
 tv_engineering_department.7065.t:0 "İnşaat: Lonca Ustası Kuyruğa Atlamak İçin Fiyatını Açıkladı"
 tv_engineering_department.7065.d:0 "Taş kesme ustaları loncasının ustası, ancak mahkemenin son devlet ziyaretinden bu yana borçlu olunan bir iyiliği talep etmesi halinde, harikanın duvar ustaları için sıraya girmeyecek. Şimdi sormak, siparişi defterin ön sıralarına taşır, ancak yüksek sesle söylenen bir iyilik, harcanan bir iyiliktir."
 tv_engineering_department.7065.a:0 "İyiliğinizi yapın ve siparişi ilerletmek için [prestige|E] harcayın ve [tv_wonder_construction|E] ilerlemesini satın alın."
 tv_engineering_department.7065.b:0 "Sıranın kendisinde kalmasına izin verin ve bu iyiliği sonraya saklayın."
 tv_engineering_department.7066.t:0 "İnşaat: Bir Lord Ev Ücretlerini Teklif Ediyor"
 tv_engineering_department.7066.d:0 "Yerel bir lord, adamlarına son toplamadan sonra sezon boyunca izin sözü verildiğinden kimsenin bahsetmemesi koşuluyla, önümüzdeki ay boyunca taş taşımak için kendi hane halkından vergi almayı teklif ediyor. Onun kahyası zaten kadroyu hazırlıyor."
 tv_engineering_department.7066.a:0 "[estate_satisfaction|E] ilerlemesini satın almak için soyluların [tv_wonder_construction|E]'ini harcayarak lordun vergilerini alın."
 tv_engineering_department.7066.b:0 "Vergileri reddedin ve lordun adamlarının söz verdikleri sezonu ertelemelerine izin verin."
 tv_engineering_department.7067.t:0 "İnşaat: Manastırın İmaret Fonu Keresteyi Karşılayabilir"
 tv_engineering_department.7067.d:0 "Manastırın imaret fonu bu çeyrekte dolu durumda ve başrahip, eğer taç sadece ipucu vermek yerine doğrudan sorarsa, iskele kerestesini karşılayabileceğini ima etti. Doğrudan sormak, bölümün hatırlayacağı kısımdır."
 tv_engineering_department.7067.a:0 "Öncesine doğrudan sorun ve din adamlarına [estate_satisfaction|E]'i iskele kerestesi için harcayın ve [tv_wonder_construction|E] ilerlemesini satın alın."
 tv_engineering_department.7067.b:0 "İmarethane fonunu bırakın ve keresteyi başka yerde bulun."
 tv_engineering_department.7068.t:0 "İnşaat: Vagon Trenleri Pazar Günüyle Karışıyor"
 tv_engineering_department.7068.d:0 "Harikanın bulunduğu yere giden vagon trenleri, aynı üç köşede pazar günü trafiğine karışmaya devam ediyor. Teslimat günlerinde bu caddeleri ticarete kapatmak rotayı bir anda çözecektir, ancak tezgah sahipleri bu gümrük saatlerini tamamen kaybedeceklerdir."
 tv_engineering_department.7068.a:0 "Teslimat günlerinde sokakları kapatın, kasabalıların [estate_satisfaction|E]'ini [tv_wonder_construction|E] ilerlemesini satın almak için harcayın."
 tv_engineering_department.7068.b:0 "Pazar sokaklarını açık bırakın, vagonlar sırasını beklesin."
 tv_engineering_department.7069.t:0 "İnşaat: Hendek Açma Ekiplerinden Hafriyat İşleri İsteniyor"
 tv_engineering_department.7069.d:0 "İcra memuru, çevredeki köylerin hafriyat işleri için ellerinden geleni yapabileceklerini, ancak aynı ellerin zaten kendi tarlalarını su basmasını önleyen sonbahar hendekleri nedeniyle borçlu olduklarını söylüyor. Bunları şimdi hazırlamak, hendeklerin beklenmesi anlamına geliyor."
 tv_engineering_department.7069.a:0 "Köylülerin [estate_satisfaction|E]'ini [tv_wonder_construction|E] ilerlemesi için harcayarak, hafriyat işleri için köy görevlilerini hazırlayın."
 tv_engineering_department.7069.b:0 "Köyleri kendi hendeklerine bırakın ve başka yerlerde iş bulun."
 tv_engineering_department.7070.t:0 "İnşaat: Eski Tahıl Deposu İskelenin Yükselmesi Gereken Yerde Duruyor"
 tv_engineering_department.7070.d:0 "Batı iskelesinin gitmesi gereken yerde duran eski tahıl ambarı ayakta kalmaya yetecek kadar sağlam, ancak taşı ve ayak izi hem duvarcının sıkıntısına hem de kadastrocunun şikayetine tek seferde cevap verebilir. Aşağı çekmek en hızlı yoldur."
 tv_engineering_department.7070.a:0 "Tahıl deposunu aşağı çekin ve [development|E] ilerlemesini satın almak için sahada [tv_wonder_construction|E] harcayın."
 tv_engineering_department.7070.b:0 "Tahıl ambarını ayakta bırakın ve iskele odasını başka bir yerde bulun."
 tv_engineering_department.7071.t:0 "İnşaat: Meyhane Bekçileri Sessizce Mucizeye Doğru Dönüyor"
 tv_engineering_department.7071.d:0 "Mürettebat hazır parayla ödeme yaptığı ve olağan ticarette ödeme yapılmadığı için, bölgenin kendi taverna sahipleri ve arabacıları geleneklerini sessizce harika teslimatlara kaydırmaya başladılar. Bu düzenlemenin resmileştirilmesi, bakıcıların geleneklerine göre oluşturduğu ticaret pahasına teslimatları hızlandıracaktır."
 tv_engineering_department.7071.a:0 "[prosperity|E] ilerlemesini satın almak için sahada [tv_wonder_construction|E] harcayarak yönlendirmeyi resmileştirin."
 tv_engineering_department.7071.b:0 "Bırakın yerel ticaret normal akışında kalsın, teslimatlar olduğu gibi kalsın."
 tv_engineering_department.7072.t:0 "İnşaat: Bir Köprü veya Bir Harika"
 tv_engineering_department.7072.d:0 "Başkentin kendi köprüsünün onarımı, taş ustalarının olmaması nedeniyle durmuş durumda ve buradaki her duvarcı, mucizeyi kesmeyen bir duvarcı. Mürettebatın yeniden atanması harikayı bir anda ileriye taşıyacak ve köprü sadece sırasını bekleyecekti."
 tv_engineering_department.7072.a:0 "Köprü mürettebatını mucizeye yeniden atayın ve [development|E]'i başkentte [tv_wonder_construction|E] ilerlemesi için harcayın."
 tv_engineering_department.7072.b:0 "Köprü mürettebatını oldukları yerde bırakın ve köprünün önce bitmesine izin verin."
 tv_engineering_department.7073.t:0 "İnşaat: Tahıl Faktörleri Bir Fiyat Karşılığında Fazlasını Sunuyor"
 tv_engineering_department.7073.d:0 "Başkentin tahıl fabrikaları, kraliyetin, kraliyetin iyiliğinin kanıtı olarak bu satışı ana meydana asmasına izin vermesi koşuluyla, fazlalıklarını doğrudan harikanın mağazalarına adil bir fiyatla satmayı teklif etti. Bu, mürettebatı zayıf ay boyunca besleyecek ve piyasayı gözle görülür şekilde tek bir alıcıya yöneltecektir."
 tv_engineering_department.7073.a:0 "Faktörlerin satışı yayınlamasına izin verin, [prosperity|E] ilerlemesini satın almak için sermayede [tv_wonder_construction|E] harcayın."
 tv_engineering_department.7073.b:0 "Halka açık satışı reddedin ve mürettebatın tahılını olağan kanallardan satın alın."
 tv_engineering_department.7074.t:0 "İnşaat: Gözetmen Gece Boyunca Çalışmayı Teklif Ediyor"
 tv_engineering_department.7074.d:0 "Gözetmen, meşaleler ve vasiyet zaten orada olduğundan, işe alım görevlisinden yeni personel beklemek yerine, tesisin kendi ekiplerini gece vardiyasında çalıştırmayı öneriyor. Aynı adamlar ilk ışıkta geri dönecek ve arada dinlenmeyecek olsa da, şafak vakti birikmiş iş yükünü temizleyecekti."
 tv_engineering_department.7074.a:0 "Gece vardiyasını sipariş edin ve [population|E] emeğini sahada harcayarak [tv_wonder_construction|E] ilerlemesini satın alın."
 tv_engineering_department.7074.b:0 "Mürettebatı yataklarına gönderin ve işe alım sorumlusundan yeni personel gelmesini bekleyin."
 tv_engineering_department.7075.t:0 "İnşaat: İskele Dalgalayıcılarının Görüşü"
 tv_engineering_department.7075.d:0 "Alandaki halka açık bir gösteri, sadık seyirciler veya kırgın eleştirmenler haline gelebilecek bir kalabalığın ilgisini çeker. Söylenti [tv_wonder_domestic_support|E]'e yardım mı edildiği yoksa zarar mı verildiğine karar verirken iskeleler bekliyor."
 tv_engineering_department.7075.a:0 "Bırakın gösteri kendi adına konuşsun."
 tv_engineering_department.7076.t:0 "İnşaat: Plan Sayfayı Aşar"
 tv_engineering_department.7076.d:0 "Cesur bir ayarlama, planı eski sınırlarının ötesine taşıyor. Anıtı büyük yapan karar ya da gelecekteki katiplerin kırmızıyla altını çizdiği not olabilir."
 tv_engineering_department.7076.a:0 "Tasarımı eski sınırlarının ötesine taşıyor."
 tv_engineering_department.7077.t:0 "İnşaat: Tente Altında Sipariş Değişikliği"
 tv_engineering_department.7077.d:0 "Tentelerin altına yeni bir emir-komuta zinciri getiriliyor. Tersaneyi disipline edebilir veya yalnızca her ustabaşına yeni bir tartışma yöntemi öğretebilir."
 tv_engineering_department.7077.a:0 "Yeni komuta zincirini avluya doğru itiyoruz."
 tv_engineering_department.7078.t:0 "İnşaat: Rota Çamurdan Dönüyor"
 tv_engineering_department.7078.d:0 "Riskli bir rota tedarik hattını kısaltmayı vaat ediyor. Hava iyi giderse öngörü olarak övülecek; başarısız olursa, herkes dönüşü kimin emrettiğini hatırlayacaktır."
 tv_engineering_department.7078.a:0 "Daha kısa yolu kullanın!"
 tv_engineering_department.7079.t:0 "İnşaat: Yeni Bir Yöntem Havada Asılı"
 tv_engineering_department.7079.d:0 "Aktif kısımda daha hızlı bir yöntem denenir. Ayı kurtarabilir veya bir sonraki ekibi güzel bir hatayı düzeltmeye zorlayabilir."
 tv_engineering_department.7079.a:0 "Aktif bölümde daha hızlı yöntemi dener."
 tv_engineering_department.7080.t:0 "İnşaat: İşçiler Tutulmayan Bir Söz Üzerine Araçlarını Bıraktı"
 tv_engineering_department.7080.d:0 "İşçiler bu sabah aletlerini bıraktılar ve mucizenin tacın gümüşünü kuruttuğunu mırıldandılar. Ustabaşı ikramiye maaşı vaadiyle onları sakinleştirdi; bu, hazinenin artık ya yerine getirmesi ya da kalabalığın önünde bu sözü yerine getirmemesi gereken bir sözdü."
 tv_engineering_department.7080.a:0 "Söz verilen ikramiyeyi bozun ve işçilerin homurdanmasının tüm alana yayılmasına izin verin."
 tv_engineering_department.7080.b:0 "Vaat edilen ikramiyeyi yerine getirin ve hazineden çıkmasına izin verin."
 tv_engineering_department.7081.t:0 "Yapım: Yazının Mührünü Sorgulayan Bir Broşür"
 tv_engineering_department.7081.d:0 "Gezici bir katip, meydanda yüksek sesle, bu mucizeye izin veren kraliyet yazısının hiçbir zaman yasal olarak mühürlenmediğini iddia eden bir broşürü okudu. Projeyle ilgili şüpheler yanıtsız kalsa da, yazının kendisi sessizce değiştirilse de, bir şeyler vermeli."
 tv_engineering_department.7081.a:0 "Broşürü cevapsız bırakın ve mucize hakkındaki şüphelerin yayılmasına izin verin."
 tv_engineering_department.7081.b:0 "Bu meydan okumaya yanıt vermek için yazının metnini sessizce değiştirin ve tacın yetki alanındaki göçü kabul edin."
 tv_engineering_department.7082.t:0 "İnşaat: Bir Levy İki Gün Uzakta Bir Kavgaya Yol Açtı"
 tv_engineering_department.7082.d:0 "Mucize için taş nakliyecilerinin toplanmasının, askere alma memurları ile bölgeden iki günlük yolculuk mesafesindeki köylüler arasında bir kavgaya yol açtığı haberi geldi. Onu susturmak ya o bölgede ya da site kapılarında bir maliyete neden olacaktır."
 tv_engineering_department.7082.a:0 "Site kapıları homurdanmaları emsin ve ilçedeki huzursuzluğun kendi kendine sönmesine izin verin."
 tv_engineering_department.7082.b:0 "Huzursuzluk daha da yayılmadan önce bölgeye sessizce yerleşmek için birlikler gönderin."
 tv_engineering_department.7083.t:0 "İnşaat: Bir Elçinin Kavgası Limandan Saraya Seyahat Ediyor"
 tv_engineering_department.7083.d:0 "Yabancı bir elçi, mucizenin saban öküzünden daha yavaş süründüğü ve bu kavganın artık limandan saraya kadar her meyhanede tekrarlandığı ziyafete güldü. Birisinin bunu yutması gerekiyor, ya tacın yurtdışındaki duruşu ya da kasaba halkının inşa edilenlerden duyduğu gurur."
 tv_engineering_department.7083.a:0 "Elçinin alayını görmezden gelin ve kasaba halkının mucizeden duyduğu gururun acı çekmesine izin verin."
 tv_engineering_department.7083.b:0 "Elçiye cömert bir karşı gösteriyle cevap verin ve onu susturmak için tacın ayakta durmasını sağlayın."
 tv_engineering_department.7084.t:0 "İnşaat: Lord Aldric'in Vekilharcı Kapıda Duman Çıkarıyor"
 tv_engineering_department.7084.d:0 "Yeni taş ocağı yolu geçen hafta Lord Aldric'in av koruma alanının içinden kesildi ve kahyası o zamandan beri sahanın kapısına öfkeyle bakıyor. Ya lordun ailesi sakinleşir ya da bu çekişmeyi izleyen halk kendi sonuçlarını çıkarır."
 tv_engineering_department.7084.a:0 "Anlaşmazlığın çözümsüz kalmasına izin verin ve kalabalığın proje hakkındaki görüşünün olumsuz olmasına izin verin."
 tv_engineering_department.7084.b:0 "Sorunu çözmek için lordun ailesine resmi bir özür ve tazminat verin."
 tv_engineering_department.7085.t:0 "İnşaat: Temel Açması Eski Mezarları Ortaya Çıkarıyor"
 tv_engineering_department.7085.d:0 "Temel hendeğini hazırlayan kazıcılar, kimsenin kaydetmediği eski mezar taşlarını ortaya çıkardı ve kilise rahibi, ölüler düzgün bir şekilde yeniden gömülene kadar daha fazla çalışma yapılmasına izin vermeyi reddediyor. Ya yeniden gömme törenlerinin ücreti tamamen ödenir ya da rahibin itirazı üzerine kazı devam eder."
 tv_engineering_department.7085.a:0 "Rahibi reddedin ve kazmaya devam edin; bunun yerine, bozulan mezarların söylentisinin kalabalığı rahatsız etmesine izin verin."
 tv_engineering_department.7085.b:0 "Rahibi ve cemaati memnun etmek için yeniden gömme törenlerinin masraflarını karşılayın."
 tv_engineering_department.7086.t:0 "İnşaat: İskele Direkleri Tüccar Sırasını Engelliyor"
 tv_engineering_department.7086.d:0 "Ana caddenin karşısına döşenen iskele direkleri, altı gün boyunca tüccarların sırasına giden araba trafiğini engelledi ve tezgah sahipleri, birilerinin kaybedilen ticarete cevap vermesini talep ediyor. Ya kayıpları telafi edilir ya da sokak kapalı kalır ve kalabalık bunu duyar."
 tv_engineering_department.7086.a:0 "Tüccarları tazminatsız bırakın ve kapalı caddenin kalabalığın homurdanmasını körüklemesine izin verin."
 tv_engineering_department.7086.b:0 "Engellenen ticaret için tüccarların sırasını hemen telafi edin."
 tv_engineering_department.7087.t:0 "İnşaat: Olgunlaşma Alanları Kesilmemiş Duruyor"
 tv_engineering_department.7087.d:0 "Hasat vergi ustaları, harikalar için kereste taşımak üzere olgunlaşan tarlalardan köylülerin ellerini çekti ve işçilerin sahada sırtları ağrırken tahıl artık kesilmeden duruyor. Ya köyler hasat için ellerini geri alır ya da kalabalık, mucizenin tarlaları nasıl boşalttığını duyar."
 tv_engineering_department.7087.a:0 "Elleri sahada tutun ve ayakta duran tahılın kalabalığa ulaşmasını sağlayın."
 tv_engineering_department.7087.b:0 "Köyün ellerini bir an önce hasada bırakın."
 tv_engineering_department.7088.t:0 "İnşaat: Eski Tabakhane Mahallesi Yarısı Yıkıldı"
 tv_engineering_department.7088.d:0 "Duvar ustalarının planı, eski tabakhane mahallesinin, harikanın temellerine yer açmak için temizlenmesini gerektiriyor ve bunun yarısı, kimse onun yerine ne geleceğini sormayı düşünmeden önce yıkıldı. Ya bölge planlandığı gibi yerle bir edilir ya da plan küçültülür ve insanlar bu mucizenin neden bu kadar çok alana ihtiyaç duyduğunu sormaya başlar."
 tv_engineering_department.7088.a:0 "Açıklığı azaltın ve insanların bu mucizenin neden bu kadar çok zemine ihtiyaç duyduğunu sorgulamasına izin verin."
 tv_engineering_department.7088.b:0 "Tabakhane mahallesini planlandığı gibi yerle bir etmeyi bitirin ve daha sonra onun yerine ne geçeceği konusunda endişelenin."
 tv_engineering_department.7089.t:0 "İnşaat: Pazar Alanı Geri Gelmedi"
 tv_engineering_department.7089.d:0 "Harikanın sahneleme alanı üst üste üçüncü aydır haftalık pazar alanını yuttu ve eskiden orayı dolduran tezgahlar artık geri gelmiyor. Ya pazar yeri unutulmadan iade edilir, ya da avlu elinde tutar ve sitenin ticareti giderek zayıflamaya devam eder."
 tv_engineering_department.7089.a:0 "Düzenleme alanını olduğu yerde tutun ve alanın kendi pazar ticaretinin soğumaya devam etmesine izin verin."
 tv_engineering_department.7089.b:0 "Haftalık tezgahlar geri dönüş yolunu unutmadan önce pazar alanına dönün."
 tv_engineering_department.7090.t:0 "İnşaat: İmarethane Eski Köprünün Yanında El değmeden Oturuyor"
 tv_engineering_department.7090.d:0 "Şehir araştırmacısı, mucizenin taş işçiliği için başkentteki tüm özgür duvar ustalarına el koydu ve bunun sonucunda eski köprünün yanındaki yarısı inşa edilmiş imarethane iki ay boyunca dokunulmadan kaldı. Ya imarethane mucizenin gerçekleşmesini bekler ya da duvar ustaları başkente geri çekilir ve site bunun nedenini açıklamakta yavaşlar."
 tv_engineering_department.7090.a:0 "Tüm duvar ustalarını harikanın üzerinde tutun ve bırakın başkentin yarı inşa edilmiş projeleri beklesin."
 tv_engineering_department.7090.b:0 "İmarethaneyi bitirmek için duvar ustalarını geri çağırın ve sitenin kendi kalabalığının gecikmeyi merak etmesine izin verin."
 tv_engineering_department.7091.t:0 "İnşaat: Taş Vagonlar Başkentin En Güzel Caddesini Tıkadı"
 tv_engineering_department.7091.d:0 "Bir haftadır başkentin en güzel alışveriş caddesi boyunca bu mucize için yontulmuş taştan vagonlar park ediliyor ve oradaki esnaf, yolun kapanmasıyla geleneklerin kuruduğunu söylüyor. Ya vagonlar yakında başka bir rota bulur ya da kalırlar ve başkentin kendi ticareti soğumaya devam eder."
 tv_engineering_department.7091.a:0 "Vagonları oldukları yerde bırakın ve bunun yerine sitenin kendi ilerlemesinin suçu üstlenmesine izin verin."
 tv_engineering_department.7091.b:0 "Vagonların yönünü hemen değiştirin ve başkentin alışveriş caddesinin yeniden nefes almasına izin verin."
 tv_engineering_department.7092.t:0 "İnşaat: Bir İskele Çöküşü Bir Düzine Kırık Bıraktı"
 tv_engineering_department.7092.d:0 "Üç gün önce şantiyedeki iskelenin çökmesi, bir düzine işçinin kemiklerinin kırılmasına neden oldu ve mürettebatın geri kalanı artık hiçbir ücretin riske değmeyeceğinden yakınıyor. Ya gözetmenler tempoyu zorlar ve işçiler geceleyin kaçmaya başlar ya da tempo yavaşlar ve tehlike haberi kasabaya yayılır."
 tv_engineering_department.7092.a:0 "Tehlikenin kasabada ortak konuşma haline gelmesine izin verin ve tüm işçileri şantiyede tutun."
 tv_engineering_department.7092.b:0 "Ne olursa olsun hızınızı zorlayın ve korkmuş işçilerin gecenin karanlığında kaçacağını kabul edin."
 tv_engineering_department.7093.t:0 "İnşaat: Kasa, Defter İddialarından Daha Hafiftir"
 tv_engineering_department.7093.d:0 "Sitenin ödeme sorumlusu kasayı açar ve kasanın defterde iddia edilenden daha hafif olduğunu görür. Birisi zaten hiç sayılmayan parayı harcadı ve bu eksiklik ya [tv_wonder_scale_competence|E]'te ya da [gold|E]'te kapatılacak."
 tv_engineering_department.7093.a:0 "Tasarımı, göğsün hala karşılayabileceğiyle eşleşecek şekilde küçültün."
 tv_engineering_department.7093.b:0 "Hazinedeki açığı kapatın ve inşaatı uygun ölçekte sürdürün."
 tv_engineering_department.7094.t:0 "İnşaat: Rakip Bir Tüzüğün Buna İzin Vermediğini Fısıldıyor"
 tv_engineering_department.7094.d:0 "Rakip bir davacı, hiçbir tüzüğün bu büyüklükte bir anıta izin vermediğini fısıldamaya başladı. Katipler meselenin sessizce çözülebileceğini ancak [tv_wonder_scale_competence|E] veya [legitimacy|E]'e maliyet olmadan çözülemeyeceğini söylüyor."
 tv_engineering_department.7094.a:0 "Sözleşmeden en büyük iddiaları sessizce geri çekin."
 tv_engineering_department.7094.b:0 "Taç'ın sözleşmeyi tam olarak yeniden onaylamasını ve fısıltılara doğrudan cevap vermesini sağlayın."
 tv_engineering_department.7095.t:0 "İnşaat: Üç Mahalle Temel Üzerindeki Yolu Kapatıyor"
 tv_engineering_department.7095.d:0 "Üç mahalleden adamlar genişleyen temellerin üzerine aletler düşürerek yolu arabalarla kapattılar. İcra memuru onları dağıtabilir, ancak yalnızca bir yere - ya planın [tv_wonder_scale_competence|E]'ini ya da bölgenin [stability|E]'ini - vererek dağıtabilir."
 tv_engineering_department.7095.a:0 "Temelleri orijinal çizgiye kadar daraltın ve adamları memnun bir şekilde evlerine gönderin."
 tv_engineering_department.7095.b:0 "Yolu açmak ve daha geniş temelleri korumak için silahlı adamlar gönderin."
 tv_engineering_department.7096.t:0 "İnşaat: Müjdeciler Ücretsiz Seyahat Etmeyi Reddediyor"
 tv_engineering_department.7096.d:0 "Anıtı yurt dışında ilan edecek olan müjdeciler iki aydır maaşlarını alamadılar ve şimdi seyahat etmeyi reddediyorlar. Birisinin bir an önce tatmin olması gerekiyor; bu ister tasarımın [tv_wonder_scale_competence|E]'ini kırpmak, ister sessizliğini satın almak için tacın [prestige|E]'ini harcamak anlamına geliyor."
 tv_engineering_department.7096.a:0 "Daha küçük, daha ucuz bir anıtın duyurusunu yapın ve müjdecilerin onun yerine bu sözü taşımasına izin verin."
 tv_engineering_department.7096.b:0 "Habercilere tacın kendi isminden ve itibarından ödeme yapın."
 tv_engineering_department.7097.t:0 "İnşaat: Baron'un Komiseri Keresteyi İki Katına Çıkardı"
 tv_engineering_department.7097.d:0 "Bir baronun kahyası, lordunun ormanlarından talep edilen keresteyi saydı ve kararlaştırılanın iki katını buldu. Lord, ya planın [tv_wonder_scale_competence|E]'ini küçülterek daha küçük bir kesintiyi ya da resmi bir özür dileyerek soylular arasında [estate_satisfaction|E]'e daha fazla taviz verilmesini kabul edecek."
 tv_engineering_department.7097.a:0 "Gelecekteki kereste kotalarını azaltın ve tasarımı buna uyacak şekilde küçültün."
 tv_engineering_department.7097.b:0 "Baronun evine resmi bir özür gönderin ve daha fazla bağış yapın."
 tv_engineering_department.7098.t:0 "İnşaat: Daha Geniş Nef Eski Mezarlığı Yutacak"
 tv_engineering_department.7098.d:0 "Bir piskopos, daha geniş nef tasarımının bölümün eski mezar alanını yutacağını öğrendi. Plan kesilmedikçe veya bölümün din adamları arasında [estate_satisfaction|E]'e yönelik şikayetleri tamamen yanıtlanmadıkça çalışmaları bir daha kutsamayacak."
 tv_engineering_department.7098.a:0 "Mezar alanını korumak için nefi yeniden çizin."
 tv_engineering_department.7098.b:0 "Şikayetlerini yanıtlamak için bölüme yeni ayrıcalıklar verin."
 tv_engineering_department.7099.t:0 "İnşaat: Genişletilmiş Yol Depoların İçinden Geçiyor"
 tv_engineering_department.7099.d:0 "Yün tüccarları, sahaya giden genişletilmiş yolun doğrudan depo sıralarının arasından geçtiğini ve malların artık kavşakta çürüyerek durduğunu bildirdi. Ya yol, tüm yaklaşımın [tv_wonder_scale_competence|E]'ini keserek tekrar daralır ya da taç, kasabalılar arasında [estate_satisfaction|E]'i tamamen telafi eder."
 tv_engineering_department.7099.a:0 "Yaklaşma yolunu daraltın ve depoları koruyun."
 tv_engineering_department.7099.b:0 "Tüccarlara zararlarını ödeyin ve daha geniş yolu koruyun."
 tv_engineering_department.7100.t:0 "İnşaat: Bir Köy Bu Ay Üç Adamı Gömdü"
 tv_engineering_department.7100.d:0 "Bu ay taş ocağının yakınındaki bir köyde üç adamın gömüldüğü ve genişletilmiş düzende hava kararıncaya kadar çalıştığı söyleniyor. Muhtar, kraliyetin [estate_satisfaction|E]'i küçültmek yerine köylüler arasında [tv_wonder_scale_competence|E]'in hesabını tahıl ve gümüşle ödemeyi tercih etmemesi halinde angaryanın kesilmesi gerektiğini söylüyor."
 tv_engineering_department.7100.a:0 "Angarya düzenini köyün dayanabileceği seviyeye indirin."
 tv_engineering_department.7100.b:0 "Köye tahıl ve gümüş gönderin ve angaryayı emredildiği gibi saklayın."
 tv_engineering_department.7101.t:0 "İnşaat: Çalışma Alanı İçin Bir Sıra Ev İniyor"
 tv_engineering_department.7101.d:0 "Ustabaşı, çalışma alanını genişletmek için şantiyedeki bir dizi ayakta duran evi yıktı ve kasaba halkı onların yerine ne inşa edileceğini soruyor. Cevap, ya [tv_wonder_scale_competence|E]'in ihtiyaç duymadığı zemini koruyarak tasarımı geriye ölçeklendirecek ya da daha da fazla temizleme ve sitenin [development|E]'inden daha fazlasını kaybetme anlamına gelecektir."
 tv_engineering_department.7101.a:0 "Daha fazla temizlemeyi durdurun ve halihazırda alınmış olan zemine uyacak şekilde planı yeniden çizin."
 tv_engineering_department.7101.b:0 "Temizleme işleminin devam etmesini emredin ve tesisin zararı karşılamasına izin verin."
 tv_engineering_department.7102.t:0 "İnşaat: Bir Zamanlar Siteyi Çevreleyen Pazar Gitti"
 tv_engineering_department.7102.d:0 "Bir zamanlar inşaat sahasını çevreleyen pazar, iskeleler ve gürültü nedeniyle dağıldı ve tezgahlar bir daha geri gelmedi. Denetçi, [tv_wonder_scale_competence|E]'in bir kısmından vazgeçerek işleri daha yakına mı çekeceğine, yoksa piyasa sürgünde kalırken sitenin [prosperity|E]'inin kanamaya devam etmesine izin mi vereceğine karar vermelidir."
 tv_engineering_department.7102.a:0 "İskeleyi içeri çekin ve piyasanın geri dönmesine izin verin."
 tv_engineering_department.7102.b:0 "Çalışmaları geniş tutun ve sitenin ticaretinin solmasına izin verin."
 tv_engineering_department.7103.t:0 "İnşaat: Köprü Masonları Harikalara Çekildi"
 tv_engineering_department.7103.d:0 "Bu mucize için seçilen duvar ustaları, başkentin kendi köprü onarımlarından çekildi; bu onarımlar artık kış gelmeden yarı bitmiş durumda. Birisinin şunu vermesi gerekiyor: ya harikanın [tv_wonder_scale_competence|E]'i duvarcıların evlerine gidebilmesi için küçülüyor ya da başkentin [development|E]'i onarılmadan sezonu beklemek zorunda kalıyor."
 tv_engineering_department.7103.a:0 "Duvarcıları başkente geri gönderin ve harikanın boyutunu küçültün."
 tv_engineering_department.7103.b:0 "Duvar ustalarını mucizede tutun ve başkentin onarımını bekleyin."
 tv_engineering_department.7104.t:0 "İnşaat: Başkentin Lonca Salonları Sessizleşti"
 tv_engineering_department.7104.d:0 "Başkentin kendi lonca salonları sessizliğe büründü, zanaatkarları ve arabacıları bu harikanın taşa ve ellere olan iştahını beslemek için uzaklaştılar. Konsey, tasarımın sonunda [tv_wonder_scale_competence|E]'i koruyacak şekilde küçültülüp küçültülmeyeceğini veya başkentin [prosperity|E]'inin artık kendi sokaklarında inşa edilmediğini gören bir anıtı finanse etmeye devam etmesi gerekip gerekmediğini açıkça soruyor."
 tv_engineering_department.7104.a:0 "Tasarımın ölçeğini küçültün ve lonca üyelerini başkente geri bırakın."
 tv_engineering_department.7104.b:0 "Lonca üyelerini bölgede tutun ve bırakın başkentin ticareti bunun bedelini ödemeye devam etsin."
 tv_engineering_department.7105.t:0 "İnşaat: Cerrah Daha Fazlasının Düşeceği Uyardı"
 tv_engineering_department.7105.d:0 "Dün gece genişleyen katmanda bir iskele çöktü ve cerrah, daha büyük plana karşı tempo yavaşlamazsa daha fazlasının düşeceğini söyledi. Denetçi ya [tv_wonder_scale_competence|E]'i koruyarak tasarımı mürettebatın hayatta kalabileceği bir hıza indirebilir ya da daha geniş bir işi yürütmeye devam edebilir ve sahada çalışan [population|E]'in azalmaya devam edeceğini kabul edebilir."
 tv_engineering_department.7105.a:0 "Hızınızı yavaşlatın ve planı mürettebatın dayanabileceği seviyeye kadar daraltın."
 tv_engineering_department.7105.b:0 "Daha geniş kapsamlı çalışmayı ilerletmeye devam edin ve işçilerin üzerindeki yükü kabul edin."
 tv_engineering_department.7106.t:0 "İnşaat: İki Katip Aynı Eksikliği İki Kez Sayıyor"
 tv_engineering_department.7106.d:0 "Dün geceki sayımda, maaş amirinin kasası iki farklı memur tarafından iki kez yetersiz çıktı. Ya eksik para hazineye silinecek ya da tüm vardiya kadrosu dağıtılacak ve tüm mürettebat sıfırdan yeniden atanacak. [tv_wonder_organization_competence|E] veya [gold|E], katiplerin aritmetiğini ödeyecek."
 tv_engineering_department.7106.a:0 "Vardiya listesini yırtın ve tüm mürettebatı sıfırdan yeniden atayın."
 tv_engineering_department.7106.b:0 "Eksik parayı hazineye yazın ve listeyi sayıldığı gibi bırakın."
 tv_engineering_department.7107.t:0 "İnşaat: Sahte Hibe Mürettebatlara Yüksek Sesle Okunuyor"
 tv_engineering_department.7107.d:0 "Ustabaşının tanımadığı bir tellal, mürettebatın duyacağı şekilde, bölgenin kereste haklarının rakip bir lorda sahte bir şekilde verildiğini okuyor. Adamı takip etmek ve toplanan işçiler önünde iddiayı çürütmek, tüm ustabaşıların o gün için görevinden alınmasına neden olur. Sahteciliğin cevapsız bırakılması ekiplerin çalışmasını sağlıyor ancak iddia zaten meyhanelerde gerçekmiş gibi tekrarlanıyor. [tv_wonder_organization_competence|E] veya [legitimacy|E] sahtekarın yalanını taşıyacak."
 tv_engineering_department.7107.a:0 "Çırağı yakalayıp durumu düzeltmek için tüm ustabaşıları görevinden alın."
 tv_engineering_department.7107.b:0 "Sahte iddianın cevapsız kalmasına izin verin ve mürettebatı işlerine devam ettirin."
 tv_engineering_department.7108.t:0 "İnşaat: İttiren bir kibrit sokağa döküldü"
 tv_engineering_department.7108.d:0 "Yemekhanede itilen bir kibrit ve yarım torbadan fazla bozuk tahıl, nöbetçi onu parçalamadan önce kapıdan sokağa döküldü. Mürettebat, iki çetenin bir daha karşılaşmaması için farklı saatlerde yeniden düzenlenebilir ve beslenebilirler ya da nöbet, meseleyi tamamen çözmek için açık meydanda tutuklamalar yapabilir. [tv_wonder_organization_competence|E] veya [stability|E], bozuk tahılın cevabını verir."
 tv_engineering_department.7108.a:0 "Her karışıklık vardiyasını yeniden düzenleyin, böylece iki çetenin yolları bir daha asla kesişmez."
 tv_engineering_department.7108.b:0 "Nöbetçilerin tutuklamalarını açık meydanda yapmasına izin verin."
 tv_engineering_department.7109.t:0 "İnşaat: Elçi İnsansız Bir Kapıya Geliyor"
 tv_engineering_department.7109.d:0 "Yabancı bir elçi tam bir gün erken geldi ve şeref kapısında kimsenin bulunmadığını ve sancakların hâlâ göğüslerinde katlanmış olduğunu gördü. Uygun bir karşılama sağlamak için görev listesi anında parçalanabilir veya elçi, siteyi tam olarak olduğu gibi gezdirebilir ve gördüğü gibi eve bildirebilir. [tv_wonder_organization_competence|E] veya [prestige|E] erken varış ücretini öder."
 tv_engineering_department.7109.a:0 "Uygun bir karşılamayı bir araya getirmek için görev listesini anında yırtın."
 tv_engineering_department.7109.b:0 "Elçiyi sitede tam olarak olduğu gibi gezdirin."
 tv_engineering_department.7110.t:0 "İnşaat: Ödünç Alınan Öküzlerin Michaelmas'tan Bu Yana Vadesi Gecikti"
 tv_engineering_department.7110.d:0 "Komşu bir lordun malikanesinden ödünç alınan öküz takımlarının Mikael Bayramı'nda geri dönmesi gerekiyordu ve son teslim tarihi geçtikten sonra hâlâ taş taşımaya devam ediyorlar. Ekipler programa göre evlerine gönderilebilir ve taşıma ekipleri yükleri elle taşıyacak şekilde yeniden organize edilebilir veya lordun kahyasına beklemesi söylenene kadar öküzler iki hafta daha tutulabilir. Soylular arasındaki [tv_wonder_organization_competence|E] veya [estate_satisfaction|E], vadesi geçmiş öküzleri taşır."
 tv_engineering_department.7110.a:0 "Öküzleri zamanında eve gönderin ve mürettebatı elle taşıyacak şekilde yeniden düzenleyin."
 tv_engineering_department.7110.b:0 "Öküzleri iki hafta daha saklayın ve lordun kahyasına beklemesini söyleyin."
 tv_engineering_department.7111.t:0 "İnşaat: Çekiçler Kalıntı Alayı'nı Boğuyor"
 tv_engineering_department.7111.d:0 "Duvar ustaları bu hafta kutsal emanet alayının içinden geçmeye devam etti ve ilahiler üç sokak ötedeki alandan duyulmuyordu. Vardiya takvimi bundan sonra her bayram ve geçit töreni gününe göre yeniden çizilebilir veya geçit töreninin rotası basitçe kaydırılabilir ve din adamları işin bunun için durmayacağını söyleyebilir. Din adamları arasında [tv_wonder_organization_competence|E] veya [estate_satisfaction|E] gürültüye cevap veriyor."
 tv_engineering_department.7111.a:0 "Vardiya takvimini her bayram ve geçit töreni gününe göre yeniden çizin."
 tv_engineering_department.7111.b:0 "Geçit töreninin rotasını değiştirin ve din adamlarına işin durmayacağını söyleyin."
 tv_engineering_department.7112.t:0 "İnşaat: Saha Vagonları Tahıl Pazarının Yolunu Kapatıyor"
 tv_engineering_department.7112.d:0 "Bir dizi şantiye vagonu altı gün boyunca tahıl pazarının yükleme yolunu kapatmış durumda ve tüccarlar loncası şahsen şikayette bulunmak için katip göndermeyi bıraktı. Teslimat programı parçalanıp şeridi açık tutacak daha uzun bir rota etrafında yeniden oluşturulabilir veya lonca kendi işini yeniden yönlendirmeye bırakılırken vagonlar yerinde kalabilir. Kasabalılar arasında [tv_wonder_organization_competence|E] veya [estate_satisfaction|E], kapatılan şeridin parasını ödüyor."
 tv_engineering_department.7112.a:0 "Teslimat programını parçalara ayırın ve daha uzun bir rotaya göre yeniden oluşturun."
 tv_engineering_department.7112.b:0 "Vagonları oldukları yerde bırakın ve loncanın yönünü değiştirmesine izin verin."
 tv_engineering_department.7113.t:0 "İnşaat: Ekim Sezonu Eller Olmadan Geliyor"
 tv_engineering_department.7113.d:0 "Ekim için köylerine dönmeleri gereken angarya çeteleri hâlâ taş kesiyor ve bu yılki tarlaların onlar olmadan ekilmeyeceği haberi geldi. Çeteler zamanında serbest bırakılabilir ve şantiyedeki işçi vardiyaları kalanlardan yeniden inşa edilebilir veya köyler yardım almadan idare ederken angarya süresi dolduğunda tutulabilir. Köylüler arasındaki [tv_wonder_organization_competence|E] veya [estate_satisfaction|E] ekilmemiş tarlaların parasını ödüyor."
 tv_engineering_department.7113.a:0 "Angarya çetelerini zamanında serbest bırakın ve kalanlardan saha vardiyalarını yeniden inşa edin."
 tv_engineering_department.7113.b:0 "Corvee'nin ömrünün geçmesini sağlayın ve bırakın köyler idare etsin."
 tv_engineering_department.7114.t:0 "İnşaat: Çöken Bir Duvar Sitenin Kendi Kaldırımını Gözetliyor"
 tv_engineering_department.7114.d:0 "Bir istinat duvarı bir gecede çöktü ve en yakın işlenmiş taş, sahanın kendi yaklaşım yolu boyunca döşenen kaldırım taşıydı. Kaldırım döşemesi olduğu yerde bırakılabilir ve serbest kalan herkes bunun yerine yeni taş çıkarmak için başka görevler üstlenebilir veya sabahtan önce duvarı yamamak için yol yeniden parçalanabilir. Sahadaki [tv_wonder_organization_competence|E] veya [development|E], çöken duvarın masrafını karşılıyor."
 tv_engineering_department.7114.a:0 "Bunun yerine taze taş çıkarmak için serbest kalan tüm elinizi diğer görevlerden çekin."
 tv_engineering_department.7114.b:0 "Duvarı sabaha yamamak için yaklaşım yolunu tekrar yırtın."
 tv_engineering_department.7115.t:0 "İnşaat: Ekmek Satıcıları Geciken Maaşlarını Bırakıyor"
 tv_engineering_department.7115.d:0 "Kamp pazarındaki ekmek satıcıları geçen haftanın maaşı üç gün geç ve yarısı kırpılmış parayla dağıtıldıktan sonra toparlanıp oradan ayrıldılar. Ücretler, satıcıları geri çekmek için daha katı ve daha sık bir programa yeniden çekilebilir, bunu yapmak için mevcut maaş rotası parçalanabilir veya kamp kendi pazarı olmadan devam edebilir ve işçiler kendi yemeklerini karşılayabilir. Sahadaki [tv_wonder_organization_competence|E] veya [prosperity|E] geç ücretleri öder."
 tv_engineering_department.7115.a:0 "Satıcıları geri çekmek için maaş rotasını parçalayın ve daha sıkı bir programa göre yeniden çizin."
 tv_engineering_department.7115.b:0 "Kampın pazarı olmadan kalmasına izin verin ve işçilerin yemek ihtiyacını karşılayın."
 tv_engineering_department.7116.t:0 "İnşaat: Köprünün İskelesi Bir Gecede Kayboluyor"
 tv_engineering_department.7116.d:0 "Başkentin kendi köprüsünün onarımı için hazır bekleyen iskele, gece boyunca sessizce şantiye vagonlarına yüklendi ve köprü ekibi geldiğinde kerestelerin tükendiğini gördü. Tesisin kendi tedarik çalışmaları uzatılabilir ve vardiyaları bunun yerine daha uzak bir kereste kaynağı etrafında yeniden inşa edilebilir veya başkentin köprüsü, kirişleri harikayı ilk önce tamamlayana kadar bekleyebilir. Başkentteki [tv_wonder_organization_competence|E] veya [development|E] eksik iskelenin masraflarını karşılıyor."
 tv_engineering_department.7116.a:0 "Tesisin tedarik sürelerini uzatın ve vardiyaları daha uzak bir kereste kaynağı etrafında yeniden inşa edin."
 tv_engineering_department.7116.b:0 "Kirişleri harikayı ilk bitirene kadar başkentin köprüsü beklesin."
 tv_engineering_department.7117.t:0 "İnşaat: Lonca Salonu Öğle vakti Boş Duruyor"
 tv_engineering_department.7117.d:0 "Başkentteki camcı ve marangozların yarısı üst üste üç haftadır buradaydı ve memleketteki lonca salonu artık öğle saatlerinde çoğunlukla boş duruyor. Ustalar evlerine gönderilebilir ve şantiye ekipleri, kalan çırakların etrafında yeniden kurulabilir ya da ustalar, başkentin kendi atölyeleri bir süre daha boşta beklerken orada kalabilirler. Başkentteki [tv_wonder_organization_competence|E] veya [prosperity|E], boş lonca salonunun parasını öder."
 tv_engineering_department.7117.a:0 "Ustaları eve gönderin ve kalan çıraklardan şantiye ekiplerini yeniden oluşturun."
 tv_engineering_department.7117.b:0 "Ustaları şantiyede tutun ve başkentin atölyelerinin atıl kalmasına izin verin."
 tv_engineering_department.7118.t:0 "İnşaat: Kısa Elli Bir Platform Halatını Kaybediyor"
 tv_engineering_department.7118.d:0 "Bu sabah, az elli bir mürettebat saati tamamlamak için platformda ikiye katlandığında ve üç adam da onunla birlikte aşağı indiğinde, bir kaldırma halatı koptu. Yedek ekipler, programa ne olursa olsun, yarın kendi görevlerinden alınıp platforma atılabilir veya yaralılar nakledildikten sonra aynı ekip kısa personelle geri gönderilebilir. [tv_wonder_organization_competence|E] veya sahada çalışan [population|E], kopan halatın parasını öder."
 tv_engineering_department.7118.a:0 "Yedek çeteleri kendi görevlerinden çekip platforma atın, programın laneti olsun."
 tv_engineering_department.7118.b:0 "Yaralılar götürüldükten sonra aynı az personelli mürettebatı geri gönderin."
 tv_engineering_department.7119.t:0 "İnşaat: Tokalı Bir Köprü Konvoyu Çamurda Bırakıyor"
 tv_engineering_department.7119.d:0 "İkmal yolu üzerindeki köprü, taş arabaların ağırlığı altında bükülüyor ve konvoyun yarısı şimdi onun altındaki çamurun içinde mahsur kalmış durumda. Geçitteki kayıkçılar, vagonları bir bedel karşılığında sallayacaklarını ve birinin bunu öyle ya da böyle ödeyeceğini söylüyorlar."
 tv_engineering_department.7119.a:0 "[tv_wonder_logistics_competence|E]'e ne kadara mal olursa olsun, vagonları oldukları yerde bırakın ve geri kalanını kırık köprünün etrafından geçirin."
 tv_engineering_department.7119.b:0 "Vagonları bugün karşıya geçirmek için feribotçulara hazineden para ödeyin ve [gold|E]'i boşaltın."
 tv_engineering_department.7120.t:0 "İnşaat: Tollgate Mührü Artık Onurlandırılmıyor"
 tv_engineering_department.7120.d:0 "Konvoyun öncüleri bir komşunun gişesinden geri çevrildi; sözleşmeleri yerel lordun artık onurlandırmadığı bir mühür taşıyordu. Birisinin, kraliyet adına kapıyı zorla mı açacağına, yoksa vagonların dışarıda kalmasına mı izin vereceğine karar vermesi gerekiyor."
 tv_engineering_department.7120.a:0 "Konvoyu geri çevirin ve tartışmalı geçiş ücretinin etrafından daha uzun bir rota bulun ve [tv_wonder_logistics_competence|E]'in kaymasına izin verin."
 tv_engineering_department.7120.b:0 "Henüz çözülmemiş bir tartışma için [legitimacy|E] harcayarak kapıyı açmaya zorlamak için taç yetkisini hemen kullanın."
 tv_engineering_department.7121.t:0 "İnşaat: Köylüler Üçüncü Bir Talep Üzerine Yolu Kapattı"
 tv_engineering_department.7121.d:0 "Köylüler, bu sezon üçüncü talep iptal edilene kadar yolu kendi arabalarıyla kapatarak taşınmayı reddetti. Konvoy geri çekilmeden veya yolu açmak için asker getirmeden geçemez."
 tv_engineering_department.7121.a:0 "Geri çekilin, konvoyu ablukanın etrafından yeniden yönlendirin ve bunun [tv_wonder_logistics_competence|E]'te bıraktığı duraklamayı kabul edin."
 tv_engineering_department.7121.b:0 "Yolu zorla temizlemeye asker gönderin ve maliyeti [stability|E] olarak hesaplayın."
 tv_engineering_department.7122.t:0 "İnşaat: Ustabaşı Tanıkların Önünde Atları Reddetti"
 tv_engineering_department.7122.d:0 "Konvoyun ustabaşı, rakip mahkemede yeni taslak atlara izin verilmedi ve tanıkların önünde gönderildi. Atları almak artık mahkemeyi utandıracak iyilikler istemek anlamına geliyor; onları alamamak, vagonların yolun geri kalanını sürünerek geçmesi anlamına gelir."
 tv_engineering_department.7122.a:0 "Ustabaşını halihazırda sahip olduğu yorgun atlarla gönderin ve gecikmeyi [tv_wonder_logistics_competence|E]'e bildirin."
 tv_engineering_department.7122.b:0 "[prestige|E] harcama yaparak yeni atları teslim etmeleri için rakip sahayı utandırmak için herkesin önünde iyilik çağrısında bulunun."
 tv_engineering_department.7123.t:0 "İnşaat: Carters, Asil Hanedan'ın Atlarına Komuta Ediyor"
 tv_engineering_department.7123.d:0 "Harikanın ekipleri yetersiz kalınca, konvoyun arabacıları soylu bir hanenin kendi at arabalarına el koydular ve ev halkı onların akşam karanlığından önce geri getirilmesini istiyor. Atların geri getirilmesi vagonların durmasına neden olur; onları tutmak evin sabrını taşar."
 tv_engineering_department.7123.a:0 "Atları bu gece soyluların evine geri götürün ve [tv_wonder_logistics_competence|E] karşılığında vagonların onlarsız beklemesine izin verin."
 tv_engineering_department.7123.b:0 "Soylular arasındaki [estate_satisfaction|E]'e ne yaparsa yapsın, ödünç alınan atların konvoyda bir süre daha çalışmasını sağlayın."
 tv_engineering_department.7124.t:0 "İnşaat: Vagonlar Bir Bayram Gününde Geçti"
 tv_engineering_department.7124.d:0 "En kısa tedarik yolu manastır arazisinden geçiyordu ve arabalar bir ziyafet gününde, kimse izin istemeyi düşünmeden önce oradan geçiyordu. Rahipler kapıyı kapattılar ve konvoyun ya geri dönmesini ya da cevap verilmesini istiyorlar."
 tv_engineering_department.7124.a:0 "Vagonları geri çevirin ve manastır arazisi etrafında başka bir yol bulun, dolambaçlı yoldan [tv_wonder_logistics_competence|E] maliyete izin verin."
 tv_engineering_department.7124.b:0 "Konvoyu planlandığı gibi kapıdan geçirin ve [estate_satisfaction|E] ile din adamlarının arasında hücuma izin verin."
 tv_engineering_department.7125.t:0 "İnşaat: Konvoy Pazar Meydanı'nda Fırtınayı Bekliyor"
 tv_engineering_department.7125.d:0 "Konvoy, fırtınayı beklemek için vagonlarını gece boyunca kasabanın pazar meydanına park etti ve tezgah sahipleri o zamandan beri kapıyı açamadı. Tüccarlar fırtına olsun veya olmasın, meydanın bugün temizlenmesini talep ediyor."
 tv_engineering_department.7125.a:0 "Vagonları şimdi açık havaya çıkarın ve fırtınanın [tv_wonder_logistics_competence|E]'i yavaşlatmasına izin verin."
 tv_engineering_department.7125.b:0 "Vagonları bir süre daha meydanda tutun ve kasabalıların arasındaki tüccarların öfkesinin [estate_satisfaction|E]'e düşmesine izin verin."
 tv_engineering_department.7126.t:0 "İnşaat: Aynı Köy Öküzlerini Üçüncü Kez Kaybetti"
 tv_engineering_department.7126.d:0 "Aynı köy, konvoy için bu ay üç kez öküzlerine ve arabalarına el koydu ve tarlalar sürülmüyor. Ya hayvanlar sabana geri döner ya da vagonlar kendi kendine çekilir."
 tv_engineering_department.7126.a:0 "Öküzleri tarlalara geri gönderin ve [tv_wonder_logistics_competence|E] pahasına konvoyun onlarsız topallamasına izin verin."
 tv_engineering_department.7126.b:0 "Öküzlere dördüncü kez el koyun ve köyün yorgunluğunun köylüler arasında [estate_satisfaction|E]'te gösterilmesini sağlayın."
 tv_engineering_department.7127.t:0 "İnşaat: Heyelan Sahaya Giden Yolu Gömdü"
 tv_engineering_department.7127.d:0 "Bir heyelan, yolun son kısmını da sahaya gömdü ve tek hızlı çözüm, yeni döşenen sahaları dolgu ve kalaslama için yıkmak. Ya saha kendi zemininden vazgeçer ya da konvoy kaydırağın dışında bekler."
 tv_engineering_department.7127.a:0 "Sahne alanlarını sağlam bırakın ve [tv_wonder_logistics_competence|E] pahasına konvoyun kaydırağın dışında beklemesine izin verin."
 tv_engineering_department.7127.b:0 "Yolu temizlemek için yeni döşenen bahçeleri doldurun ve kalaslayın, alanda [development|E] harcayın."
 tv_engineering_department.7128.t:0 "İnşaat: Yolun İşçi Tezgahlarının Ötesine Kadar Genişletilmesi Gerekiyor"
 tv_engineering_department.7128.d:0 "Vagonların, tesisin kendi işçi tezgahlarının yanından geçen yolun genişletilmesi gerekiyor ve oradaki satıcıların ticaret yapacak başka yerleri yok. Ya konvoyun geçmesine izin vermek için tezgahlar aşağı iner ya da vagonlar sürünerek geçer."
 tv_engineering_department.7128.a:0 "[tv_wonder_logistics_competence|E] pahasına vagonların sürünerek geçmesine ve tezgahları ayakta bırakmasına izin verin."
 tv_engineering_department.7128.b:0 "Konvoyun yolunu genişletmek için satıcı tezgahlarını temizleyin ve alanda [prosperity|E] harcayın."
 tv_engineering_department.7129.t:0 "İnşaat: Başkentin Sokakları Konvoyu İtmek İçin Yırtıldı"
 tv_engineering_department.7129.d:0 "Başkentin kendi arabacıları ve arnavut kaldırımlı ekipleri, durmuş konvoyu şehre doğru son mil kadar itmek için olağan işlerinden çekildiler. Vagonlar beklese de beklemese de başkentin sokakları yarı yıpranmış, yarı boş."
 tv_engineering_department.7129.a:0 "Başkentin mürettebatını kendi işlerine geri gönderin ve [tv_wonder_logistics_competence|E] pahasına konvoyun kapılarda oyalanmasına izin verin."
 tv_engineering_department.7129.b:0 "Başkentte [development|E] harcayarak vagonları taşımayı bitirmek için başkentin mürettebatını sokaklardan çekin."
 tv_engineering_department.7130.t:0 "İnşaat: Durmuş Kargo Başkentin Pazar Meydanını İşgal Ediyor"
 tv_engineering_department.7130.d:0 "Konvoy, harikanın durmuş kargosunu depolamak için başkentin merkezi pazar meydanına el koydu ve genellikle orada ticaret yapan kervanlar bir haftadır geri çevrildi. Ya kargo taşınır ve piyasa yeniden açılır ya da meydan bir süre daha depo olarak kalır."
 tv_engineering_department.7130.a:0 "Kargoyu hemen dışarı çıkarın, ne kadar kaba olursa olsun ve [tv_wonder_logistics_competence|E]'in yükünü üstlenin."
 tv_engineering_department.7130.b:0 "Kargoyu meydanda bırakın ve karavanları dışarıda tutun, [prosperity|E]'i başkentte harcayın."
 tv_engineering_department.7131.t:0 "İnşaat: Öküz yerine işçiler iplere bağlanıyor"
 tv_engineering_department.7131.d:0 "Yük hayvanlarının tükenmesi ve taze hayvan kalmaması nedeniyle tesisin ustabaşı, mahsur kalan arabaları elle sürüklemek için işçileri iplere bağlamaya başladı. Ya adamlar yorgunluktan kurtulmaya devam edecek ya da arabalar sıkıştıkları yerde kalacak."
 tv_engineering_department.7131.a:0 "[tv_wonder_logistics_competence|E] pahasına adamları daha fazla çalıştırmak yerine arabaları oldukları yerde bırakın."
 tv_engineering_department.7131.b:0 "İşçilerin, arabalar hareket edene kadar halatları taşımasını sağlayın ve [population|E] emeğini sahada harcayın."
 tv_engineering_department.7132.t:0 "İnşaat: Taş Kesiciler İşi Durduruyor, Ücretsiz"
 tv_engineering_department.7132.d:0 "Taş kesiciler loncası, iki aydır ücret ödenmeden çalışmayı durdurdu. Ustabaşı, elinde bir hesap defteri ve kapalı bir yumrukla kapıda duruyor ve birisinin ya bahçeyi ya da hazineyi açması gerekiyor."
 tv_engineering_department.7132.a:0 "Kesicilerin yürümesine ve [tv_wonder_construction|E] ilerlemesinin beklemesine izin verin."
 tv_engineering_department.7132.b:0 "Borçlarınızı [gold|E] ile ödeyin ve keskileri hareket ettirin."
 tv_engineering_department.7133.t:0 "İnşaat: Bir Taklitçi Eksik Yazıyı Anlatıyor"
 tv_engineering_department.7133.d:0 "Konseye, sitenin duvar ustalarının alışılagelmiş bir emir olmadan toplandığı haberi ulaştı ve bir sahtekar, bunu tacın keyfine göre hükmettiğinin kanıtı olarak gösteriyor. Birisinin kısayol için cevap vermesi gerekiyor - ya işin kendisi ya da onu emreden yetki."
 tv_engineering_department.7133.a:0 "Vergiyi geri alın ve [tv_wonder_construction|E] ilerlemesinin geride kalmasına izin verin."
 tv_engineering_department.7133.b:0 "Yazının arkasında durun ve [legitimacy|E] tacına mal olmasına izin verin."
 tv_engineering_department.7134.t:0 "İnşaat: Köylüler Araba Yolunu Bedenleriyle Engelliyor"
 tv_engineering_department.7134.d:0 "Taş ocağı yolu için ortak alanları çitle çevrilen köylüler, araba yolunu kendi bedenleriyle kapattı. Ya arabalar bu gece geri dönecek ya da askerler yolu açacak ve kırsal kesim bunu hatırlayacaktır."
 tv_engineering_department.7134.a:0 "Arabaları geri çevirin ve [tv_wonder_construction|E] ilerlemesinin beklemesine izin verin."
 tv_engineering_department.7134.b:0 "Yolu temizlemesi ve [stability|E] maliyetini harcaması için korumayı gönderin."
 tv_engineering_department.7135.t:0 "İnşaat: Bir Büyükelçi Yarı Çöken İskeleyi Geziyor"
 tv_engineering_department.7135.d:0 "Yabancı bir büyükelçi erkenden bölgeyi gezdi ve yeşil harç üzerine yarı çökmüş bir iskele buldu; evindeki raporu zaten hazırlanıyor. Gözetmen, işi düzgün bir şekilde yeniden yapmak için çalışmayı durdurabilir veya büyükelçinin gördüklerini yazmasına izin verebilir."
 tv_engineering_department.7135.a:0 "Arızalı bölümü yırtın ve [tv_wonder_construction|E] ilerlemesinin gerilemesine izin verin."
 tv_engineering_department.7135.b:0 "İskeleyi ayakta bırakın ve mektubun [prestige|E] tacına mal olmasına izin verin."
 tv_engineering_department.7136.t:0 "İnşaat: Bir Lord, Taş Ocağı İçin İşaretlenmiş Av Koruma Alanını Keşfediyor"
 tv_engineering_department.7136.d:0 "Yerel bir lord, harikanın avı için işaretlenmiş av koruma alanını keşfetti ve öfkeyle saraya giderek ya kadastrocuların geri çekilmesini ya da ailesinin onurunun yerine getirilmesini talep etti. Aşağıdan birinin teslim olması gerekiyor."
 tv_engineering_department.7136.a:0 "Araştırmacıları geri çağırın ve [tv_wonder_construction|E]'in ilerlemesinin geride kalmasına izin verin."
 tv_engineering_department.7136.b:0 "Taş ocağı hattını tutun ve soylular arasında [estate_satisfaction|E]'e mal olmasına izin verin."
 tv_engineering_department.7137.t:0 "İnşaat: Vakıf Eski Bir Mezarlığı Ortaya Çıkarıyor"
 tv_engineering_department.7137.d:0 "Temeli hazırlayan kazıcılar, kimsenin kaydetmediği eski bir kilise mezarlığını ortaya çıkardı ve rahipler, düzgün bir şekilde yeniden gömülene kadar daha fazla çalışmayı kutsamayı reddediyorlar. Birisinin küreklerle ayinler arasında seçim yapması gerekiyor."
 tv_engineering_department.7137.a:0 "Yeniden gömme töreni bitene kadar kazıcıları durdurun ve [tv_wonder_construction|E]'in ilerlemesini bekleyin."
 tv_engineering_department.7137.b:0 "Kazmaya devam edilmesini emredin ve bunun din adamları arasında [estate_satisfaction|E]'e mal olmasına izin verin."
 tv_engineering_department.7138.t:0 "İnşaat: Duvar Arabaları Tüccarlar Meydanını Yutuyor"
 tv_engineering_department.7138.d:0 "Tüccar meydanı bir haftadır taş arabaları tarafından yarı yarıya yutuldu ve lonca ustaları bunun bir hafta daha sonbahar panayırını mahvedeceğini söylüyor. Ya arabalar bu gece yeni bir rota bulur ya da fuar bir inşaat alanına açılır."
 tv_engineering_department.7138.a:0 "Arabaları yeniden yönlendirin ve [tv_wonder_construction|E]'in yavaş ilerlemesine izin verin."
 tv_engineering_department.7138.b:0 "Arabaları meydanda tutun ve kasabalılar arasında [estate_satisfaction|E]'e mal olsun."
 tv_engineering_department.7139.t:0 "İnşaat: Corvee Ekipleri Son Kurak Haftayı Kaçırdı"
 tv_engineering_department.7139.d:0 "Bu ayki çalışma için üç köyden çekilen korve ekipleri hasat için son kurak haftayı kaçırdılar ve muhtarlar tarlalarının mı yoksa mucizenin mi önce geldiğini soruyor. İkisinden birinin vermesi gerekiyor."
 tv_engineering_department.7139.a:0 "Mürettebatları sahalara geri gönderin ve [tv_wonder_construction|E]'in yavaş ilerlemesine izin verin."
 tv_engineering_department.7139.b:0 "Mürettebatı sahada tutun ve köylülere maliyeti [estate_satisfaction|E] olsun."
 tv_engineering_department.7140.t:0 "İnşaat: Çöken Bir Duvar Sitenin Kendi Atölyelerini Gömüyor"
 tv_engineering_department.7140.d:0 "Bir istinat duvarı bir gecede çöktü ve alanın çevresinde büyüyen yarı bitmiş atölyeleri ve mağazaları gömdü. Bunları düzgün bir şekilde yeniden inşa etmek, siteye her iki durumda da bir maliyete mal olacaktır; harikadan elde edilen emek veya onun etrafında duran şey."
 tv_engineering_department.7140.a:0 "Atölyeleri desteklemek için ekipleri harikadan çekin ve [tv_wonder_construction|E]'in ilerlemesinin gerilemesine izin verin."
 tv_engineering_department.7140.b:0 "Atölyeleri moloz olarak bırakın ve sahada [development|E] maliyetine bırakın."
 tv_engineering_department.7141.t:0 "İnşaat: Seyyar satıcılar yeni bir stok sahası için uzaklaştırılıyor"
 tv_engineering_department.7141.d:0 "Çalışan ekipleri beslemek için ortaya çıkan seyyar satıcılar ve küçük atölyeler, bu hafta yeni bir stok sahası için zemin açmak üzere uzaklaştırıldı ve tesisin küçük ekonomisi de onlarla birlikte sessizliğe büründü. Stok veya sitenin kendi ticareti – ikisinden biri zemini korur."
 tv_engineering_department.7141.a:0 "Zemini seyyar satıcılara geri verin ve [tv_wonder_construction|E]'in ilerlemesinin stokta beklemesine izin verin."
 tv_engineering_department.7141.b:0 "Stok sahasını koruyun ve sahada [prosperity|E] maliyetine bırakın."
 tv_engineering_department.7142.t:0 "İnşaat: Başkentteki Her Masona İhtiyaç Var"
 tv_engineering_department.7142.d:0 "Başkentin kendi köprü onarımları durdu çünkü şehirdeki tüm duvar ustaları ve arabaları bu mucizenin son hamlesi için görevlendirildi. Yargıçlar, süre dolmadan mürettebatının geri dönmesini istiyor; site onlardan bir ay daha uzun süre istiyor."
 tv_engineering_department.7142.a:0 "Duvarcıları başkente geri bırakın ve [tv_wonder_construction|E]'in yavaş ilerlemesine izin verin."
 tv_engineering_department.7142.b:0 "Duvarcıları bölgede tutun ve sermayenin [development|E]'e mal olmasına izin verin."
 tv_engineering_department.7143.t:0 "İnşaat: Taş Arabalar Başkentteki İki Sokağı Kapatıyor"
 tv_engineering_department.7143.d:0 "Başkentin pazar bölgesinde yuvarlanan taş arabaları dolusu iki cadde bir hafta boyunca kapatıldı ve oradaki esnaf, ticaretin şimdiden başka yerlere kaydığını söylüyor. Ya konvoylar daha uzun bir rota bulur ya da bölgede gelenek kanamaya devam eder."
 tv_engineering_department.7143.a:0 "Konvoyları uzun yoldan yeniden yönlendirin ve [tv_wonder_construction|E] ilerlemesinin geride kalmasına izin verin."
 tv_engineering_department.7143.b:0 "Konvoyları kısa rotada tutun ve başkentte [prosperity|E]'e mal olsun."
 tv_engineering_department.7144.t:0 "İnşaat: İşçi Kampında Ateş Yayılıyor"
 tv_engineering_department.7144.d:0 "İşçi kampında ateş yükseldi ve doktorlar hastaların dinlenmesi gerektiğini, aksi takdirde hastalığın tüm mürettebata yayılacağını söylüyor. Birisinin bunları aşmak ve işi kaybetmek ya da onları geride bırakıp işçileri kaybetmek arasında seçim yapması gerekiyor."
 tv_engineering_department.7144.a:0 "Kurtarmak için mürettebatı yerde tutun ve [tv_wonder_construction|E]'in ilerlemesinin kaymasına izin verin."
 tv_engineering_department.7144.b:0 "Hastaları bunun üzerinden geçirin ve sahadaki [population|E] işçiliğine mal olmasına izin verin."
 tv_engineering_department.7145.t:0 "İnşaat: Hazine'de Yeni Bir Boşluk"
 tv_engineering_department.7145.d:0 "Harika, parayı defterlerin beklediğinden daha hızlı çekiyor. Hazine kıtlığı açıklayabilir ama açıklama gümüş para etmez."
 tv_engineering_department.7145.a:0 "Boşluğu kapatmak için defterleri uzatır."
 tv_engineering_department.7146.t:0 "İnşaat: Kraliyet Mühründeki Toz"
 tv_engineering_department.7146.d:0 "Kraliyetin onayı çok fazla taviz verilmesine dayanıyor. Mühür hâlâ duruyor ama daha ince görünüyor."
 tv_engineering_department.7146.a:0 "Kraliyet mührünün biraz daha incelmesine izin verin."
 tv_engineering_department.7147.t:0 "İnşaat: Sessiz Kasabalar Rahatsız Ediliyor"
 tv_engineering_department.7147.d:0 "İnşaat ritmi sıradan hayata baskı yapıyor. Pazarlar geç açılıyor, köyler homurdanıyor ve düzen biraz olsun sağlanıyor."
 tv_engineering_department.7147.a:0 "Köylülerin homurdanmasına izin verdik ve ne olursa olsun yola devam ettik."
 tv_engineering_department.7148.t:0 "İnşaat: Mahkeme Rengini Kaybediyor"
 tv_engineering_department.7148.d:0 "Mahkeme eserlere renk katıyor ve karşılığında toz alıyor. Prestij, halka açık küçük şakalarda ve yarım kalmış övünmelerde kaybolur."
 tv_engineering_department.7148.a:0 "Biraz parıltıyı birkaç saray şakasıyla takas ediyorum."
 tv_engineering_department.7149.t:0 "İnşaat: Soylu Sofralarda Soğuk Sözler"
 tv_engineering_department.7149.d:0 "Soylu aileler bir kez daha boyun eğiyor. Taviz resmi ve soğuktur ve bu genellikle reddetmekten daha kötüdür."
 tv_engineering_department.7149.a:0 "Soyluların soğuk ve resmi tavizini kabul ediyor."
 tv_engineering_department.7150.t:0 "İnşaat: Sunağın Önünde Kaşlarını çatıyor"
 tv_engineering_department.7150.d:0 "Kutsal takvim şantiye için yeniden eğiliyor. Din adamları itaat eder ama itaatin de sınırları vardır."
 tv_engineering_department.7150.a:0 "Din adamlarının itaatini, sınırlarını ve hepsini kabul ediyoruz."
 tv_engineering_department.7151.t:0 "İnşaat: Piyasadaki Daha İnce Defterler"
 tv_engineering_department.7151.d:0 "Pazar işleri proje etrafında dönüyor. Kasabalılar ihtişamdan faydalanabilir, ancak ona giden tüm yollar kapalıyken değil."
 tv_engineering_department.7151.a:0 "Yolları temizleyin ve inşaatlara devam edin!"
 tv_engineering_department.7152.t:0 "İnşaat: Köylerde Daha Ağır Sırtlar"
 tv_engineering_department.7152.d:0 "Kırsal omuzlar başka bir yük alıyor. Proje ilerler ve köyün sabrı zayıflar."
 tv_engineering_department.7152.a:0 "Fazladan yükü kırsal kesimin omuzlarına yığıyor."
 tv_engineering_department.7153.t:0 "İnşaat: Site Sokaklarından Vazgeçiyor"
 tv_engineering_department.7153.d:0 "Site sıradan dokusundan daha fazla vazgeçiyor. Geleceğin harikası alan kazanırken, mevcut sokaklar kullanım alanını kaybediyor."
 tv_engineering_department.7153.a:0 "Yarının harikası için bu sokakları işaretler."
 tv_engineering_department.7154.t:0 "İnşaat: Site Daha Sessiz Büyüyor"
 tv_engineering_department.7154.d:0 "Sıradan takas anıta doğru çekildikçe site ticari olarak daha sessiz hale geliyor. Refah, zayıflamadan önce yalnızca belirli sayıda yeniden yönlendirilebilir."
 tv_engineering_department.7154.a:0 "Alanın ticaretini bir kez daha anıta yönlendiriyoruz."
 tv_engineering_department.7155.t:0 "İnşaat: Sermaye Projeleri Yol Açıyor"
 tv_engineering_department.7155.d:0 "Sermaye projeleri yine harikalara yer açıyor. Kraliyet şehri hâlâ büyük ama çerçevesinin bir kısmı ödünç alınıyor."
 tv_engineering_department.7155.a:0 "Başkentin kendi çerçevesini bu harikaya ödünç veriyor."
 tv_engineering_department.7156.t:0 "İnşaat: Başkentte Daha Sessiz Sokaklar"
 tv_engineering_department.7156.d:0 "Proje kredi ve mal çekerken sermaye piyasaları biraz parlaklığını kaybediyor. Mahkeme bunu vatansever olarak nitelendirebilir; tüccarlar buna daha yavaş ticaret diyor."
 tv_engineering_department.7156.a:0 "Her anıt parlaklığını bir yerden alır."
 tv_engineering_department.7157.t:0 "Yapım: Yaralanma Listesine İsimler Eklendi"
 tv_engineering_department.7157.d:0 "İsimler sakatlık listelerine eklendi. Çalışmalar devam ediyor ama her yeni iz, işçilerin taşa bakış açısını değiştiriyor."
 tv_engineering_department.7157.a:0 "İsimleri not edin ve devam edin!"
 tv_engineering_department.7158.t:0 "İnşaat: Hazine Kapısında Sessizlik"
 tv_engineering_department.7158.d:0 "Sahadan gelen sert talep, hazinenin gözle görülür şekilde boş kalmasına neden oluyor. Anıt devam ediyor ve krallık, herhangi bir şeye hayranlık duyamadan bedelini ödüyor."
 tv_engineering_department.7158.a:0 "Hazineyi boşaltır ve taşın ne olursa olsun yukarı çıkmasına izin verir."
 tv_engineering_department.7159.t:0 "İnşaat: Saha Öncesi Manda Çatlakları"
 tv_engineering_department.7159.d:0 "Çalışma sahasının talepleri tacı onursuz bir duruşa zorluyor. Görkem vaadi artık zarar görmüş otoriteye dayanıyor."
 tv_engineering_department.7159.a:0 "Duvarların yükselebilmesi için tacın bükülmesine izin verdik."
 tv_engineering_department.7160.t:0 "İnşaat: Levy'deki Parçalanmaları Sipariş Edin"
 tv_engineering_department.7160.d:0 "Çitin ötesine daha sert bir aksama yayılıyor. Yetkililer sebebin adını koyabilirler ama isim vererek ülkenin sakinleşmesini sağlayamazlar."
 tv_engineering_department.7160.a:0 "Huzursuzluğun çitlerin ötesine geçmesine izin verin."
 tv_engineering_department.7161.t:0 "İnşaat: Kamuoyunda Onur Bocalıyor"
 tv_engineering_department.7161.d:0 "Sitedeki kamuya açık bir utanç, herhangi bir resmi düzeltmeden daha hızlı yayılır. Henüz ayakta olmayan taşın bedelini şeref öder."
 tv_engineering_department.7161.a:0 "Bırak konuşsunlar!"
 tv_engineering_department.7162.t:0 "İnşaat: Asil Sabır Kesilmiş"
 tv_engineering_department.7162.d:0 "Proje, nezaket artık sesi kapatamayacak hale gelene kadar asil sabrı kesiyor. Bir anıt, mirası yediğinde zavallı bir misafirdir."
 tv_engineering_department.7162.a:0 "Duvarcılık ilerlerken soyluların homurdanmasına izin verin."
 tv_engineering_department.7163.t:0 "İnşaat: Vestry'de sabır tükeniyor"
 tv_engineering_department.7163.d:0 "Bir inşaat talebi sunağın çok yakınında eziliyor. Dindarlık açık alan olarak ele alındığında din adamları unutmazlar."
 tv_engineering_department.7163.a:0 "Din adamlarının soğuk sessizliğini taşın bedeli olarak kabul ediyoruz."
 tv_engineering_department.7164.t:0 "İnşaat: Öfke Sokaklara Ulaşıyor"
 tv_engineering_department.7164.d:0 "Çalışma alanı alanı, zamanı ve krediyi yutarken öfke mağazaların vitrinlerine ulaşıyor. Şehir anıtı görmeden önce duyuyor."
 tv_engineering_department.7164.a:0 "İskeleler tırmanırken vitrinlerin homurdanmasına izin verin."
 tv_engineering_department.7165.t:0 "İnşaat: Kırsal Öfke Sessiz Kalmayacak"
 tv_engineering_department.7165.d:0 "Bu vergiden sonra kırsalın öfkesi sessiz kalmayacak. Harikanın gölgesi, bitmiş yüzünü asla göremeyecek olan çiftliklere ulaşıyor."
 tv_engineering_department.7165.a:0 "Bırakın tarlalar buna dayansın!"
 tv_engineering_department.7166.t:0 "İnşaat: Site Geri Düşüyor"
 tv_engineering_department.7166.d:0 "Çalışmalar, alanı eski durumuna getirecek kadar oyuyor. Anıt henüz yükselmedi, ancak etrafındaki yer çoktan karşılığını verdi."
 tv_engineering_department.7166.a:0 "Anıtın ilerleyebilmesi için alanı geriye ayarlar."
 tv_engineering_department.7167.t:0 "İnşaat: Sitenin Refahı Boğuldu"
 tv_engineering_department.7167.d:0 "Şantiye yerel pazarı bir süreliğine boğuyor. Arabalar hâlâ geliyor ama çok azı taşın çevresindeki kasabaya hizmet veriyor."
 tv_engineering_department.7167.a:0 "Çalışmalar devam ederken iç pazarın seyrelmesine izin verin."
 tv_engineering_department.7168.t:0 "İnşaat: Sermaye Taşla Öder"
 tv_engineering_department.7168.d:0 "Sermaye, taş, işçilik ve gecikmiş onarımlarla ödeme yapıyor. Uzaktaki bir anıt daha gerçek hale gelirken yakındaki planların içi boşalır."
 tv_engineering_department.7168.a:0 "Başkentin kendi onarımlarının uzaktaki harikayı beklemesine izin verdik."
 tv_engineering_department.7169.t:0 "İnşaat: Kraliyet Şehrinin Ticareti Düşük"
 tv_engineering_department.7169.d:0 "Çalışmalar nedeniyle kraliyet şehrinin ticareti azalıyor. İhtişam, onu finanse etmesi gereken sokakları uzakta köreltiyor."
 tv_engineering_department.7169.a:0 "Başka yerlerdeki ihtişamı finanse etmek için kraliyet şehrinin sokaklarını köreltiyor."
 tv_engineering_department.7170.t:0 "İnşaat: Ter Kana Geçiyor"
 tv_engineering_department.7170.d:0 "Ter, bölgede kana karışır. Anıtın iptal edilmemesi dersin en acımasız kısmı olabilir."
 tv_engineering_department.7170.a:0 "Site kanla ödemiş olsa da biz devam ediyoruz."
 tv_engineering_department.7171.t:0 "İnşaat: [tv_great_engineer|E] Sokağı Kazandı"
 tv_engineering_department.7171.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] teknik bir turu halka açık bir zafere dönüştürüyor. Sonuç, [tv_wonder_domestic_support|E]'te büyük bir gelişmedir.\n\n#G Bu olay, mevcut [tv_great_engineer|E]'in 80.#!'in üzerinde etkili askeri yeteneğe sahip olması nedeniyle meydana geldi."
 tv_engineering_department.7171.a:0 "Rutin bir denetimi kamusal bir zafere dönüştürür."
 tv_engineering_department.7172.t:0 "İnşaat: [tv_great_engineer|E] Grand Line'ı Yeniden Çiziyor"
 tv_engineering_department.7172.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName], daha büyük planı inandırıcı kılan bir güvenle ana ekseni yeniden çizer. Sonuç, [tv_wonder_scale_competence|E]'te büyük bir gelişmedir.\n\n#G Bu olay, mevcut [tv_great_engineer|E]'in 80.#!'in üzerinde etkili askeri yeteneğe sahip olması nedeniyle meydana geldi."
 tv_engineering_department.7172.a:0 "Büyük eksenin dikkatsiz değil kaçınılmaz görünmesini sağlar."
 tv_engineering_department.7173.t:0 "İnşaat:[tv_great_engineer|E] Programı Yeniden Oluşturuyor"
 tv_engineering_department.7173.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] programı o kadar temiz bir şekilde yeniden oluşturuyor ki rakip ustabaşılar bile buna uyuyor. Sonuç, [tv_wonder_organization_competence|E]'te büyük bir gelişmedir.\n\n#G Bu olay, mevcut [tv_great_engineer|E]'in 80.#!'in üzerinde etkili askeri yeteneğe sahip olması nedeniyle meydana geldi."
 tv_engineering_department.7173.a:0 "Yeni programın gerisinde kalıyoruz."
 tv_engineering_department.7174.t:0 "İnşaat: [tv_great_engineer|E] Yolu Açıyor"
 tv_engineering_department.7174.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName], eski gecikmelerin neredeyse aptalca görünmesine neden olan bir tedarik yolu açıyor. Sonuç, [tv_wonder_logistics_competence|E]'te büyük bir gelişmedir.\n\n#G Bu olay, mevcut [tv_great_engineer|E]'in 80.#!'in üzerinde etkili askeri yeteneğe sahip olması nedeniyle meydana geldi."
 tv_engineering_department.7174.a:0 "Yol nihayet açıldı!"
 tv_engineering_department.7175.t:0 "İnşaat: [tv_great_engineer|E] Ana İşleri Yürütüyor"
 tv_engineering_department.7175.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName], daha az kişinin çalışmasını engelleyen bir sorun üzerinden ana işleri yürütür. Sonuç, [tv_wonder_construction|E] ilerlemesinde büyük bir gelişmedir.\n\n#G Bu olay, mevcut [tv_great_engineer|E]'in 80'in üzerinde etkili askeri yeteneğe sahip olması nedeniyle meydana geldi.#!"
 tv_engineering_department.7175.a:0 "Durmuş işleri temiz bir şekilde yürütür."
 tv_engineering_department.7176.t:0 "İnşaat: [tv_great_engineer|E] Söylentileri Yatıştırıyor"
 tv_engineering_department.7176.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName], kamuoyunun güvenini sağlamak için söylentilere yeterince basit bir açıklama yaparak yanıt veriyor. Proje, [tv_wonder_domestic_support|E].\n\n#G 'te daha istikrarlı bir gelişme elde ediyor. Bu olay, mevcut [tv_great_engineer|E]'in 50.#!'in üzerinde etkili askeri yeteneğe sahip olması nedeniyle meydana geldi."
 tv_engineering_department.7176.a:0 "Söylentileri sade konuşarak susturur."
 tv_engineering_department.7177.t:0 "İnşaat:[tv_great_engineer|E] Ölçüyü Belirler"
 tv_engineering_department.7177.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName], projeyi çekingen bir tasarımdan kurtarmak için sahada yeterli marjı buluyor. Proje, [tv_wonder_scale_competence|E].\n\n#G 'te daha istikrarlı bir gelişme elde ediyor. Bu olay, mevcut [tv_great_engineer|E]'in 50.#!'in üzerinde etkili askeri yeteneğe sahip olması nedeniyle meydana geldi."
 tv_engineering_department.7177.a:0 "Plana cesur olmaya yetecek kadar yer veriyoruz."
 tv_engineering_department.7178.t:0 "İnşaat: [tv_great_engineer|E] Ruloları Düzleştiriyor"
 tv_engineering_department.7178.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] inatçı bir ekip, alet ve saat karmaşasını düzeltir. Proje, [tv_wonder_organization_competence|E].\n\n#G 'te daha istikrarlı bir gelişme elde ediyor. Bu olay, mevcut [tv_great_engineer|E]'in 50.#!'in üzerinde etkili askeri yeteneğe sahip olması nedeniyle meydana geldi."
 tv_engineering_department.7178.a:0 "Mürettebatları, araçları ve saatleri yeniden düzene sokar."
 tv_engineering_department.7179.t:0 "İnşaat:[tv_great_engineer|E] Konvoyu Temizler"
 tv_engineering_department.7179.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName], konvoy programındaki en kötü düğümü temizliyor. Proje, [tv_wonder_logistics_competence|E].\n\n#G 'te daha istikrarlı bir gelişme elde ediyor. Bu olay, mevcut [tv_great_engineer|E]'in 50.#!'in üzerinde etkili askeri yeteneğe sahip olması nedeniyle meydana geldi."
 tv_engineering_department.7179.a:0 "Besleme hattındaki en kötü düğümü temizler."
 tv_engineering_department.7180.t:0 "İnşaat: [tv_great_engineer|E] Kritik Bağlantıya Uyar"
 tv_engineering_department.7180.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] kritik parçaya uyar ve bir sonraki aşamanın daha erken başlamasını sağlar. Proje, [tv_wonder_construction|E] ilerlemesinde istikrarlı bir gelişme elde ediyor.\n\n#G Bu olay, mevcut [tv_great_engineer|E]'in 50'nin üzerinde etkili askeri yeteneğe sahip olması nedeniyle meydana geldi.#!"
 tv_engineering_department.7180.a:0 "Tam hız ileri!"
 tv_engineering_department.7181.t:0 "İnşaat:[tv_great_engineer|E] Kalabalığa İlgi Gösteriyor"
 tv_engineering_department.7181.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName], bitmemiş işleri kalabalığın önüne koyar ve gösteriye güvenir. Karar, [tv_wonder_domestic_support|E]'i kaldırabilir veya siteye pahalıya mal olabilir.\n\n#Y Bu olay, mevcut [tv_great_engineer|E]'in 20 ile 80 arasında etkili askeri yeteneğe sahip olması nedeniyle meydana geldi.#!"
 tv_engineering_department.7181.a:0 "Kalabalığın tamamlanmamış taşlar hakkında karar vermesine izin verin."
 tv_engineering_department.7182.t:0 "İnşaat: [tv_great_engineer|E] Planı Genişletiyor"
 tv_engineering_department.7182.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName], tüm şüpheler giderilmeden önce planın genişletilmesini emreder. Karar, [tv_wonder_scale_competence|E]'i kaldırabilir veya siteye pahalıya mal olabilir.\n\n#Y Bu olay, mevcut [tv_great_engineer|E]'in 20 ile 80 arasında etkili askeri yeteneğe sahip olması nedeniyle meydana geldi.#!"
 tv_engineering_department.7182.a:0 "Şüpheler giderilmeden önce planın büyütülmesini emreder."
 tv_engineering_department.7183.t:0 "İnşaat:[tv_great_engineer|E] Değişimi Yeniden Yazıyor"
 tv_engineering_department.7183.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] vardiyaları tek bir öğleden sonra yeniden yazıyor ve tersaneyi buna ayak uydurmaya cesaretlendiriyor. Karar, [tv_wonder_organization_competence|E]'i kaldırabilir veya siteye pahalıya mal olabilir.\n\n#Y Bu olay, mevcut [tv_great_engineer|E]'in 20 ile 80 arasında etkili askeri yeteneğe sahip olması nedeniyle meydana geldi.#!"
 tv_engineering_department.7183.a:0 "Vardiyaları yeniden yazıyoruz ve bahçeyi buna ayak uydurmaya cesaretlendiriyoruz."
 tv_engineering_department.7184.t:0 "İnşaat:[tv_great_engineer|E] Riskli Yola Gidiyor"
 tv_engineering_department.7184.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName], arabaları zor bir yoldan gönderir ve alışkanlık yerine hesaplamaya güvenir. Karar, [tv_wonder_logistics_competence|E]'i kaldırabilir veya siteye pahalıya mal olabilir.\n\n#Y Bu olay, mevcut [tv_great_engineer|E]'in 20 ile 80 arasında etkili askeri yeteneğe sahip olması nedeniyle meydana geldi.#!"
 tv_engineering_department.7184.a:0 "Alışkanlık yerine hesaplamaya güvenerek arabaları daha zorlu yollara gönderir."
 tv_engineering_department.7185.t:0 "İnşaat:[tv_great_engineer|E] Daha Hızlı Bir Yöntemi Test Ediyor"
 tv_engineering_department.7185.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName], arızanın çok genel olarak görülebileceği daha hızlı bir yöntemi test eder. Karar, [tv_wonder_construction|E]'in ilerlemesini durdurabilir veya siteye pahalıya mal olabilir.\n\n#Y Bu olay, mevcut [tv_great_engineer|E]'in 20 ile 80 arasında etkili askeri yeteneğe sahip olması nedeniyle meydana geldi.#!"
 tv_engineering_department.7185.a:0 "Daha hızlı olan yöntemi deneyin; bırakın kendini herkesin önünde kanıtlasın!"
 tv_engineering_department.7186.t:0 "İnşaat: [tv_great_engineer|E] Parayı Yanlış Sayar"
 tv_engineering_department.7186.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] bir düzeltmenin maliyetini yanlış değerlendiriyor ve zarafeti karşılamayı hazineye bırakıyor. Çalışmalar devam ediyor, ancak [gold|E] gözden kaçırılıyor.\n\n#R Bu olay, mevcut [tv_great_engineer|E]'in etkili askeri yeteneğinin 50'nin altında olması nedeniyle meydana geldi.#!"
 tv_engineering_department.7186.a:0 "Hesap sorgulanmadan önce açığı sessizce kapatır."
 tv_engineering_department.7187.t:0 "İnşaat: [tv_great_engineer|E] Mahkemeyi Unutuyor"
 tv_engineering_department.7187.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName], kraliyet otoritesinin de bir malzeme olduğunu unutuyor ve onu dikkatsizce harcıyor. Çalışmalar devam ediyor, ancak [legitimacy|E] gözden kaçırılıyor.\n\n#R Bu olay, mevcut [tv_great_engineer|E]'in etkili askeri yeteneğinin 50'nin altında olması nedeniyle meydana geldi.#!"
 tv_engineering_department.7187.a:0 "Tacın adının dikkatsizce kullanılmasını dizginliyoruz."
 tv_engineering_department.7188.t:0 "İnşaat: [tv_great_engineer|E] Köyleri Yanlış Okudu"
 tv_engineering_department.7188.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName], düzgün bir mühendislik cevabının ne kadar rahatsızlığa neden olabileceğini hafife alıyor. Çalışmalar devam ediyor, ancak [stability|E] gözden kaçırılıyor.\n\n#R Bu olay, mevcut [tv_great_engineer|E]'in etkili askeri yeteneğinin 50'nin altında olması nedeniyle meydana geldi.#!"
 tv_engineering_department.7188.a:0 "Düzenli çözümün geride bıraktığı rahatsızlığı giderir."
 tv_engineering_department.7189.t:0 "İnşaat: [tv_great_engineer|E] Çok Yakında Konuşuyor"
 tv_engineering_department.7189.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName], yaptığı işin övünmeyi desteklemesinden önce kendinden çok emin konuşuyor. Çalışmalar devam ediyor, ancak [prestige|E] gözden kaçırılıyor.\n\n#R Bu olay, mevcut [tv_great_engineer|E]'in etkili askeri yeteneğinin 50'nin altında olması nedeniyle meydana geldi.#!"
 tv_engineering_department.7189.a:0 "Övünmeyi geri çekin!"
 tv_engineering_department.7190.t:0 "İnşaat: [tv_great_engineer|E] Soyluları Hafifletir"
 tv_engineering_department.7190.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] asil sabra sanki başka bir tedarik stokuymuş gibi davranır. Çalışmalar devam ediyor, ancak soylular arasındaki [estate_satisfaction|E] gözetimden dolayı acı çekiyor.\n\n#R Bu olay, mevcut [tv_great_engineer|E]'in etkili askeri yeteneğinin 50'nin altında olması nedeniyle meydana geldi.#!"
 tv_engineering_department.7190.a:0 "Asil sabrın, yararlanılacak bir stok olmadığını mühendise hatırlatır."
 tv_engineering_department.7191.t:0 "İnşaat: [tv_great_engineer|E] Takvimi Bozuyor"
 tv_engineering_department.7191.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] sanki bir teslimat masasıymış gibi dini takvimde hareket ediyor. Çalışmalar devam ediyor, ancak din adamları arasındaki [estate_satisfaction|E] gözetimden dolayı acı çekiyor.\n\n#R Bu olay, mevcut [tv_great_engineer|E]'in 50'nin altında etkili askeri yeteneğe sahip olması nedeniyle meydana geldi.#!"
 tv_engineering_department.7191.a:0 "Sonuçta sunakların kendi takvimlerini tutmasına izin verin."
 tv_engineering_department.7192.t:0 "İnşaat: [tv_great_engineer|E] Piyasayı Engeller"
 tv_engineering_department.7192.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName], site için daha temiz bir yol ararken sıradan ticareti engelliyor. Çalışmalar devam ediyor, ancak kasabalılar arasındaki [estate_satisfaction|E] gözetimden dolayı acı çekiyor.\n\n#R Bu olay, mevcut [tv_great_engineer|E]'in 50'nin altında etkili askeri yeteneğe sahip olması nedeniyle meydana geldi.#!"
 tv_engineering_department.7192.a:0 "Sitenin kapattığı pazar şeridini yeniden açıyoruz."
 tv_engineering_department.7193.t:0 "İnşaat:[tv_great_engineer|E] Köyleri Hafife Alıyor"
 tv_engineering_department.7193.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName], kullanılmayan rezerv nedeniyle köyleri tüketen hatalar yapıyor. Çalışmalar devam ediyor, ancak köylüler arasındaki [estate_satisfaction|E] gözetimden dolayı acı çekiyor.\n\n#R Bu olay, mevcut [tv_great_engineer|E]'in etkili askeri yeteneğinin 50'nin altında olması nedeniyle meydana geldi.#!"
 tv_engineering_department.7193.a:0 "Tükenmiş köylerin yeniden sürüklenmek yerine dinlenmesine izin verin."
 tv_engineering_department.7194.t:0 "İnşaat:[tv_great_engineer|E] Yanlış Sokakları Keser"
 tv_engineering_department.7194.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] yanlış yerel düzenlemeleri ortadan kaldırıyor ve aradaki boşluğun faydalı olduğunu söylüyor. Çalışmalar devam ediyor ancak [development|E] sahadaki gözetimden dolayı zarar görüyor.\n\n#R Bu olay, mevcut [tv_great_engineer|E]'in etkili askeri kabiliyetinin 50'nin altında olması nedeniyle meydana geldi.#!"
 tv_engineering_department.7194.a:0 "Yanlışlıkla kesilen düzenlemelerin üzerindeki yamalar."
 tv_engineering_department.7195.t:0 "İnşaat: [tv_great_engineer|E] Sitenin Geçim Kaynaklarını Kalabalıklaştırıyor"
 tv_engineering_department.7195.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName], çalışmalar için yer açarken yerel geçim kaynaklarını da ortadan kaldırıyor. Çalışmalar devam ediyor ancak [prosperity|E] sahadaki gözetimden dolayı zarar görüyor.\n\n#R Bu olay, mevcut [tv_great_engineer|E]'in etkili askeri kabiliyetinin 50'nin altında olması nedeniyle meydana geldi.#!"
 tv_engineering_department.7195.a:0 "Açıklığın doldurduğu geçim kaynakları için yeniden yer açıyoruz."
 tv_engineering_department.7196.t:0 "İnşaat:[tv_great_engineer|E] Sermayeyi Kötüye Kullanıyor"
 tv_engineering_department.7196.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName], sanki kraliyet şehrinin kendine ait bir planı yokmuş gibi sermaye kaynaklarını kötüye kullanıyor. Çalışmalar devam ediyor ancak başkentteki [development|E] gözetimden dolayı sıkıntı çekiyor.\n\n#R Bu olay, mevcut [tv_great_engineer|E]'in etkin askeri kabiliyetinin 50'nin altında olması nedeniyle meydana geldi.#!"
 tv_engineering_department.7196.a:0 "Kötüye kullanılan kaynakları başkentin kendi planlarına döndürür."
 tv_engineering_department.7197.t:0 "İnşaat: [tv_great_engineer|E] Kraliyet Şehri'ni Rahatsız Ediyor"
 tv_engineering_department.7197.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName], yerel bir mühendislik problemini çözerken kraliyet şehrinin ticaretini bozar. Çalışmalar devam ediyor ancak başkentteki [prosperity|E] gözetimden dolayı sıkıntı çekiyor.\n\n#R Bu olay, mevcut [tv_great_engineer|E]'in etkin askeri kabiliyetinin 50'nin altında olması nedeniyle meydana geldi.#!"
 tv_engineering_department.7197.a:0 "Kesinti yayılmadan önce kraliyet şehrinin ticaretini sakinleştiririz."
 tv_engineering_department.7198.t:0 "İnşaat: [tv_great_engineer|E] İşçilik Sınırını Yanlış Değerlendiriyor"
 tv_engineering_department.7198.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName], çalışan bedenlerin sınırını yanlış değerlendiriyor. Çalışmalar devam ediyor ancak sahada çalışan [population|E], gözetimden dolayı zarar görüyor.\n\n#R Bu olay, mevcut [tv_great_engineer|E]'in 50'nin altında etkili askeri yeteneğe sahip olması nedeniyle meydana geldi.#!"
 tv_engineering_department.7198.a:0 "Daha fazla vermeden önce gerginliği azaltın!"
 tv_engineering_department.7199.t:0 "İnşaat: [tv_great_engineer|E] Defterleri Kırıyor"
 tv_engineering_department.7199.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName], önlenebilir bir hatanın hesaplara sızmasına ve gururun mazur görebileceğinden daha fazla parayı boşaltmasına olanak tanır. Hata, belki de işin en çirkin kısmı olan merakı sona erdirmeye yetmiyor.\n\n#R Bu olay, mevcut [tv_great_engineer|E]'in etkili askeri yeteneğinin 20'nin altında olması nedeniyle meydana geldi.#!"
 tv_engineering_department.7199.a:0 "Kaybı telafi eder ve defteri sessizce kapatır."
 tv_engineering_department.7200.t:0 "İnşaat:[tv_great_engineer|E] Tacı Yaralar"
 tv_engineering_department.7200.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] önlenebilir bir saha arızasını taçta gözle görülür bir yaraya dönüştürür. Hata, belki de işin en çirkin kısmı olan merakı sona erdirmeye yetmiyor.\n\n#R Bu olay, mevcut [tv_great_engineer|E]'in etkili askeri yeteneğinin 20'nin altında olması nedeniyle meydana geldi.#!"
 tv_engineering_department.7200.a:0 "Tacın yeni yara izini giyip yolumuza devam edeceğiz."
 tv_engineering_department.7201.t:0 "İnşaat: [tv_great_engineer|E] Ülkeyi Rahatsız Ediyor"
 tv_engineering_department.7201.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] bir site sorununu çözmeye çalışırken ülkeyi kargaşaya sürüklüyor. Hata, belki de işin en çirkin kısmı olan merakı sona erdirmeye yetmiyor.\n\n#R Bu olay, mevcut [tv_great_engineer|E]'in etkili askeri yeteneğinin 20'nin altında olması nedeniyle meydana geldi.#!"
 tv_engineering_department.7201.a:0 "Bozukluğun kendi kendine sönmesine izin verir."
 tv_engineering_department.7202.t:0 "İnşaat: [tv_great_engineer|E] Gösterişli Bir Gösteri Yapıyor"
 tv_engineering_department.7202.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName], siteyi bir gösteri haline getiriyor ve sarayın onurunu buna katıyor. Hata, belki de işin en çirkin kısmı olan merakı sona erdirmeye yetmiyor.\n\n#R Bu olay, mevcut [tv_great_engineer|E]'in etkili askeri yeteneğinin 20'nin altında olması nedeniyle meydana geldi.#!"
 tv_engineering_department.7202.a:0 "Bırakın mahkeme kendi gösterisini yapsın!"
 tv_engineering_department.7203.t:0 "İnşaat: [tv_great_engineer|E] Evleri Öfkelendiriyor"
 tv_engineering_department.7203.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName], ayrıcalıkları aracılığıyla bir site sorununu çözerek haneleri kızdırıyor. Hata, belki de işin en çirkin kısmı olan merakı sona erdirmeye yetmiyor.\n\n#R Bu olay, mevcut [tv_great_engineer|E]'in etkili askeri yeteneğinin 20'nin altında olması nedeniyle meydana geldi.#!"
 tv_engineering_department.7203.a:0 "İşlerin yürümesi için evlerin iyi niyetini harcıyor."
 tv_engineering_department.7204.t:0 "İnşaat: [tv_great_engineer|E] Din adamlarını rahatsız ediyor"
 tv_engineering_department.7204.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName], dünyevi taşa kutsal sabrın bedelini ödeterek din adamlarını rahatsız ediyor. Hata, belki de işin en çirkin kısmı olan merakı sona erdirmeye yetmiyor.\n\n#R Bu olay, mevcut [tv_great_engineer|E]'in etkili askeri yeteneğinin 20'nin altında olması nedeniyle meydana geldi.#!"
 tv_engineering_department.7204.a:0 "Laik taşın faturasını kutsal sabrın ödemesine izin verdik."
 tv_engineering_department.7205.t:0 "İnşaat: [tv_great_engineer|E] Burgher'ları Kışkırtıyor"
 tv_engineering_department.7205.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName], ticareti gevşek bir iskele olarak ele alarak kentlileri kışkırtıyor. Hata, belki de işin en çirkin kısmı olan merakı sona erdirmeye yetmiyor.\n\n#R Bu olay, mevcut [tv_great_engineer|E]'in etkili askeri yeteneğinin 20'nin altında olması nedeniyle meydana geldi.#!"
 tv_engineering_department.7205.a:0 "Tüccarlara kendi iskelelerini onarma işini bırakıyor."
 tv_engineering_department.7206.t:0 "İnşaat: [tv_great_engineer|E] Köyleri Yıkıyor"
 tv_engineering_department.7206.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] kaçınılması gereken bir taleple köyün sabrını kırıyor. Hata, belki de işin en çirkin kısmı olan merakı sona erdirmeye yetmiyor.\n\n#R Bu olay, mevcut [tv_great_engineer|E]'in etkili askeri yeteneğinin 20'nin altında olması nedeniyle meydana geldi.#!"
 tv_engineering_department.7206.a:0 "Kendilerine ayırabileceğimiz bir talep için köylerden af diliyoruz."
 tv_engineering_department.7207.t:0 "İnşaat: [tv_great_engineer|E] Siteye Zarar Veriyor"
 tv_engineering_department.7207.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName], yerel yıkımla teknik bir sorunu çözerek siteye zarar veriyor. Hata, belki de işin en çirkin kısmı olan merakı sona erdirmeye yetmiyor.\n\n#R Bu olay, mevcut [tv_great_engineer|E]'in etkili askeri yeteneğinin 20'nin altında olması nedeniyle meydana geldi.#!"
 tv_engineering_department.7207.a:0 "Onarımların neden olduğu yarayı onarır."
 tv_engineering_department.7208.t:0 "İnşaat: [tv_great_engineer|E] Sitenin Pazarlarını Söndürüyor"
 tv_engineering_department.7208.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName], önlenebilir bir kararla sitenin pazarlarını yok ediyor. Hata, belki de işin en çirkin kısmı olan merakı sona erdirmeye yetmiyor.\n\n#R Bu olay, mevcut [tv_great_engineer|E]'in etkili askeri yeteneğinin 20'nin altında olması nedeniyle meydana geldi.#!"
 tv_engineering_department.7208.a:0 "Öyle olsun, tezgahlar sussun!"
 tv_engineering_department.7209.t:0 "İnşaat: [tv_great_engineer|E] Başkentin Planlarını Boşaltıyor"
 tv_engineering_department.7209.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName], başkentin sahadaki bir hatayı örtbas etme planlarını boşa çıkarıyor. Hata, belki de işin en çirkin kısmı olan merakı sona erdirmeye yetmiyor.\n\n#R Bu olay, mevcut [tv_great_engineer|E]'in etkili askeri yeteneğinin 20'nin altında olması nedeniyle meydana geldi.#!"
 tv_engineering_department.7209.a:0 "Başkentin sitenin hatasını düzeltme planlarına cesaret edemiyor."
 tv_engineering_department.7210.t:0 "İnşaat:[tv_great_engineer|E] Başkentin Refahını Azaltır"
 tv_engineering_department.7210.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName], piyasaya asla ulaşmaması gereken bir başarısızlık yoluyla sermaye refahını azaltıyor. Hata, belki de işin en çirkin kısmı olan merakı sona erdirmeye yetmiyor.\n\n#R Bu olay, mevcut [tv_great_engineer|E]'in etkili askeri yeteneğinin 20'nin altında olması nedeniyle meydana geldi.#!"
 tv_engineering_department.7210.a:0 "Başkentin hiç görmemesi gereken bir başarısızlık karşısında sönen parıltısını izliyoruz."
 tv_engineering_department.7211.t:0 "İnşaat: [tv_great_engineer|E] Kayıplara Neden Olur"
 tv_engineering_department.7211.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName], önlenebilir bir arızanın mürettebattan geçmesine izin vererek can kaybına neden olur. Hata, belki de işin en çirkin kısmı olan merakı sona erdirmeye yetmiyor.\n\n#R Bu olay, mevcut [tv_great_engineer|E]'in etkili askeri yeteneğinin 20'nin altında olması nedeniyle meydana geldi.#!"
 tv_engineering_department.7211.a:0 "Mürettebatın asla kaybetmemesi gereken ölüleri sayıyor."
