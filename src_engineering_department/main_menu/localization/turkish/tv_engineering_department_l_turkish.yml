 tv_engineering_department.10.t: "[tv_great_engineer|E]: Büyük Mühendis Öldü"
 tv_engineering_department.10.d: "[tv_great_engineer|E]'imiz vefat etti. Haberler [tv_engineering_department|e]'te kapalı çizim kasaları, durdurulan araştırma masaları ve asistanların birdenbire son tebeşir izlerini silmek istememesi yoluyla aktarılıyor. Tamamlanmamış her plan artık dünden daha kırılgan görünüyor. Harika mekanizma defterlerini tutabilir, ancak [tv_wonder_construction|e]'in hırsı sıraya dönüştürmek için yaşayan bir zihne ihtiyacı vardır. Bir halef atanıncaya kadar diyarın taşı, emeği ve umudu vardır, ancak onları kabul ettirecek usta inşaatçı yoktur.\n\n#weak Büyük Mühendisin pozisyonu artık boş; bu harikanın inşasını devam ettirmek için Mühendislik Departmanından mümkün olan en kısa sürede bir halef atayın.#!"
 tv_engineering_department.10.a: "Planlar soğumadan önce bir halef bulun."
 tv_engineering_department.20.t: "[tv_wonder_construction|E]: Proje Çöküyor"
 tv_engineering_department.20.d: "[tv_wonder_domestic_support|e]'in rezervi tükendi. Bir zamanlar projeyi öven saray mensupları artık başka yerlerdeki acil işleri hatırlıyor, emlak sözcüleri itirazlarını yeniden keşfediyor ve tedarikçiler başka bir araba hareket etmeden ödeme istiyor. Büyük projenin savunulamaz olması nedeniyle, [tv_engineering_department|e] kilitli harikayı terk etmeli ve bu utanca katlanmalı. Zemin kaldı, ilk işaretler kaldı ve belki bazı taşlar kaldı ama bunların altındaki siyasi köprü çöktü. Hiçbir anıt sessizliğe, korkuya ve ödenmemiş sözlere dayanamaz.\n\n#weak Harika zorla terk edildi; alanı ve planları Mühendislik Departmanında yeniden değerlendirebilir ve istediğiniz zaman yeniden başlayabilirsiniz.#!"
 tv_engineering_department.20.a: "Utanç temiz bir şekilde kaydedilsin."
 tv_engineering_department.30.t: "[tv_wonder_construction|E]: Bir Tasarım Şekilleniyor"
 tv_engineering_department.30.d: "[tv_great_engineer|E] ilk sayfaları doldurdu: zorlu yükseklikler, maliyetli şüpheler, arazinin gizli güçlü yönleri ve gözle görülür bir pişmanlıkla üstü çizilen birkaç zarif imkansızlık. Konsept artık atölyedeki bir ruh hali değil. Mahkemenin karşılaştırabileceği, itiraz edebileceği ve sonunda seçebileceği bir teklif olmaya hazır.\n\n#weak Tasarım konsepti hazır — [tv_great_engineer|E]'in teklifini incelemek, kabul etmek veya yeniden düşünmelerini talep etmek için Mühendislik Departmanına gidin, ardından yeterli yerel destek oluşturmak için mucize üzerindeki tartışmayı ilerletin.#!"
 tv_engineering_department.30.a: "Bize tasarımları göster."
 tv_engineering_department.100.t: "[tv_wonder_debate|E]: Asil Evler Rallisi"
 tv_engineering_department.100.d: "Birçok soylu aile, bu harikanın diyarınki kadar kendi anılarını da büyüteceğine karar verdi. Habercileri atalardan kalma koltuklardan, ölümsüz isimlerden ve gelecek nesillerin özel şöhreti kamusal amaçlarla karıştırabileceği hoş ihtimalinden söz ediyor. [tv_engineering_department|e] bunları düzeltmez. Destek destektir ve [tv_wonder_domestic_support|e] genellikle takı takarak gelir. Artık sesleri mahkemede faydalı bir ses tonuyla yankılanıyor."
 tv_engineering_department.100.a: "Görünsünler."
 tv_engineering_department.101.t: "[tv_wonder_debate|E]: Asil Boşluk"
 tv_engineering_department.101.d: "Bu mucizenin yeterli onuru geri getirmeden asil ayrıcalığı tüketeceğine dair söylentiler yayıldı. Birkaç ev, anıtın gelecekteki ihtişamını değil, koltukları, muafiyetleri, emekçileri ve bunun onlara mal olabileceği törensel üstünlüğü hesaba katmaya başladı. [tv_engineering_department|e] taşı ölçebilir ancak yaralı rütbeyi araştırmak daha zordur. Aristokrasi arasındaki destek azalıyor ve her tereddüt, tüm projenin daha da ağırlaşmasına neden oluyor. Gurur mermerden daha hafif olabilir ama onu kaldırmak çok daha zordur."
 tv_engineering_department.101.a: "Onların gururu pahalıdır."
 tv_engineering_department.102.t: "[tv_wonder_debate|E]: Burghers Fırsatı Görüyor"
 tv_engineering_department.102.d: "Lonca ustaları ve finansörler sözleşmelerden, yollardan, depolardan ve gelecekteki kalabalıklardan bahsetmeye başlıyor. Bu harikada sadece ihtişamı değil, faturaları, ulaşım haklarını, kiralık odaları ve hala ücret toplayan torunlarını da görüyorlar. [tv_engineering_department|e] dikkatle dinliyor çünkü ticaret, hırsı pratik kılma konusunda bir yeteneğe sahip. Onların coşkusu tartışmaya yeni bir ivme kazandırıyor. Refah, mürekkep lekeli parmaklar ve mükemmel aritmetik ile geldi."
 tv_engineering_department.102.a: "Refahın ikna edici bir sesi vardır."
 tv_engineering_department.103.t: "[tv_wonder_debate|E]: Tüccarlar Maliyeti Hesaplıyor"
 tv_engineering_department.103.d: "Bazı vatandaşlar artık bu mucizenin emeği, krediyi ve ulaşımı kısıtlayacağı konusunda uyarıyor. Zaferi doğrudan kınamazlar; sadece bunun altında kaç vagonun, maaşın ve deponun sıkışıp kalması gerektiğini soruyorlar. Böyle bir uyarıyı göz ardı etmek paniğe kapılmaktan daha zordur çünkü her cümle makul bir sayı sütunuyla gelir. [tv_engineering_department|e] halkın güveninin derece derece azaldığını hissediyor. Defterler yüksek sesle okunduğunda konuşmalar kadar keskin bir şekilde yaralanabilir."
 tv_engineering_department.103.a: "Defterler konuşmalar kadar keskin bir şekilde yaralanabilir."
 tv_engineering_department.104.t: "[tv_wonder_debate|E]:Dini Nimet"
 tv_engineering_department.104.d: "Tanınmış din adamları bu harikayı düzen ve bağlılığın görünür bir işareti olarak çerçeveliyorlar. Vaazlar ölçülü taşı itaatkar ruhlarla, sağlam temelleri sadık doktrinle ve kamu emeğini dürüst bir halkın disipliniyle karşılaştırır. [tv_engineering_department|e], mühendisler özel olarak çekül hatlarını metaforlara tercih ettiğinde bile bu dilden yararlanır. Tartışma ciddi ve güven verici bir ton kazanıyor. Cennet iskeleleri onaylıyor gibi göründüğünde [tv_wonder_domestic_support|E] daha kolay yükselir."
 tv_engineering_department.104.a: "Yararlı bir nimet."
 tv_engineering_department.105.t: "[tv_wonder_debate|E]: Aşırılığa Karşı Vaazlar"
 tv_engineering_department.105.d: "Vaizler projeyi taşa bürünmüş gösteriş olarak kınıyor. Aç bir köyün mermere ihtiyacı olup olmadığını, hükümdarın ruhunun yükseklikle kurtarılıp kurtarılamayacağını ve gururun sırf bir duvarcının ölçtüğü için kutsal olup olmadığını soruyorlar. Suçlama, maliyetten zaten rahatsız olanlar arasında dinleyici buluyor. [tv_engineering_department|e] birçok itiraza yanıt verebilir, ancak vaazlar karşıt görüşlerden kurtulmak için tasarlanmıştır. İman, temelleri kutsadığı gibi onları reddedebilir de."
 tv_engineering_department.105.a: "İnanç aynı zamanda mermeri de reddedebilir."
 tv_engineering_department.200.t: "[tv_wonder_construction|E]: Tamamlanan Bir İnşaat Birimi"
 tv_engineering_department.200.d: "Harikanın başka bir bölümü görünür bir eşiği aştı. İskeleler indiriliyor, gözetmenler tamamlanan üniteyi işaretliyor ve işçiler, bir sonraki görevin de aynı derecede ağır olacağını bilen insanların ihtiyatlı gururuyla geri çekiliyorlar. Artık imkansızın taşa, kirişe, kanala ya da tonoz haline geldiğini halk görebiliyor. Eleştirmenler bile gölge düşüren bir şeyle dalga geçmeyi daha zor buluyor. [tv_wonder_construction|E] yalnızca ilerleme sağlamakla kalmadı, aynı zamanda kanıt da kazandı.\n\n#weak Bu inşaat ünitesi tamamlandı — Mühendislik Departmanı harikanın bir sonraki ünitesine doğru devam edecek.#!"
 tv_engineering_department.200.a: "İşin devam etmesini sağlayın."
 tv_engineering_department.201.t: "[tv_wonder_construction|E]: Proje Yükseliyor"
 tv_engineering_department.201.d: "[SCOPE.sLocation('tv_wonder_event_location').GetName]'te tamamlanan dört modül amacına hizmet etmiştir. Geçici yapıları artık sökülebilir ve mucizenin korunmuş çekirdeğinde inşaat nihayet başlayabilir. Temel, gövde, işlev ve taçlandırma artık birbiriyle yarışan parçalar değil; tek bir anıt halinde katlanmaya hazırlar.\n\n#weak Dört modül harikanın merkezinde birleşti; Mühendislik Departmanı panelini izleyin, çünkü harika tamamlanma seviyesine ulaştığında son bina otomatik olarak inşaata başlayacaktır.#!"
 tv_engineering_department.201.a: "Modülleri sökün ve çekirdeği kaldırın."
 tv_engineering_department.202.t: "[tv_wonder_construction|E]: Çalışma Tamamlandı"
 tv_engineering_department.202.d: "[tv_engineering_department|E] inşaat aşamasının tamamlandığını bildirdi. Şantiyeler sökülüyor, çalışma ekipleri geri çekiliyor ve son müteahhit defterleri yalnızca muhasebecilerin gerçekten keyif aldığı bir memnuniyetle kapanıyor. Anıt şu anda ayakta ama taş tek başına kader değil. Tamamlanmamış soru, onun nasıl inşa edileceğinden, nasıl kutlanacağına kadar değişti. Diyar bir vücut yarattı; [tv_wonder_ceremony|e] artık ona kamusal bir ruh vermelidir.\n\n#weak İnşaat aşaması tamamlandı; bir ithaf töreni stili seçmek ve mucizenin törenine başlamak için Mühendislik Departmanını ziyaret edin.#!"
 tv_engineering_department.202.a: "Töreni hazırlayın."
 tv_engineering_department.202.a.tt: "Şantiyedeki $tv_wonder_labor_camp$ yıkılacak."
 tv_engineering_department.203.t: "[tv_wonder_construction|E]: Tartışma Sonuçlandı"
 tv_engineering_department.203.d: "Mahkeme merak konusu tartışmanın sona erdiğini duyurdu. Muhalefet yok olmadı ama sayıldı, yanıtlandı, satın alındı veya resmi plana dahil edildi. Proje artık konuşmaları geride bırakıyor ve zemin, yollar, eğimler ve mesafelerin ölçülen dünyasına giriyor. [tv_great_engineer|e] araştırılacak bir site ister. Bu noktadan itibaren, [tv_wonder_domestic_support|e] yavaş yavaş boşalacaktır, dolayısıyla bir sonraki sıra pratik olmalıdır: anıtın gerçekte nerede durabileceğini seçin.\n\n#weak Tartışma sona erdi; araştırma ve inşaata başlamak üzere Mühendislik Departmanındaki harika için bir inşaat alanı seçin.#!"
 tv_engineering_department.203.a: "Ankete başlayın."
 tv_engineering_department.300.t: "[tv_wonder_survey|E]: Anket Tamamlandı"
 tv_engineering_department.300.d_high: "[tv_wonder_survey|E] mükemmel okumalarla geri dönüyor. Seçilen zemin hırs taşıyabilir, erzak ona ulaşabilir ve çalışma ekipleri, ilk kalıcı kamp kurulmadan önce arazide bir yol görebilir. [tv_great_engineer|e], rakamların şüpheli olması nedeniyle değil, iyi haberlerin doğrulanmayı hak etmesi nedeniyle tabloları iki kez okur. Ölçek, lojistik ve organizasyon artık aynı yöne işaret ediyor. Site yararlı yollarla zorlaşmaya neredeyse istekli görünüyor."
 tv_engineering_department.300.d_mid: "[tv_wonder_survey|E] kullanılabilir okumalarla geri dönüyor. Site işi zahmetsiz hale getirmeyecek, ancak hiçbir dürüst mucize bunu vaat etmedi. Zeminin sınırları var, yolların ruh halleri var ve çalışma planının romantizmden ziyade disipline ihtiyacı olacak. Yine de [tv_engineering_department|e] artık adlandırdığı zayıf yönleri planlayabiliyor. Ölçülü bir engel zaten yarı evcilleştirilmiştir."
 tv_engineering_department.300.d_low: "[tv_wonder_survey|E] rahatsız edici okumalarla geri dönüyor. Yer hâlâ bildirilebilir, ancak haritalar gergin görünüyor ve araştırmacılar sözcüklerini profesyonel bir özenle seçiyor. Zemin, güzergahlar veya iş organizasyonu bu tutkumuza ilk başta beklediğimizden daha fazla direnebilir. [tv_engineering_department|e], farklı bir konumun bu harikaya daha iyi hizmet edebileceği konusunda uyarıyor. Burada ilerlemek, körlükten daha iyi ve özgüvenden daha pahalı olan, açık gözlerle verilen bir karar olacaktır."
 tv_engineering_department.300.a: "Sonucu inceleyin."
 tv_engineering_department.310.t: "[tv_wonder_survey|E]: Gizli Temeller"
 tv_engineering_department.310.d: "Haritacılar önerilen çalışmaların altında sağlam zemini ve eski taşları ortaya çıkarıyor. Başlangıçta sadece katı görünen şey, sanki unutulmuş bir el dünyayı kullanışlı bir düzen içinde terk etmiş gibi, şimdi neredeyse hazır görünüyor. [tv_wonder_survey|e] ekipleri yük, derinlik ve kendi kendine çözülen bir sorun bulmanın nadir zevki konusunda mutlu bir şekilde tartışıyorlar. Bu harikanın olası ölçeği ilk tahmin edilenden daha cömert görünüyor. [tv_great_engineer|e] bile başka bir ölçüm istemeden önce bir gülümsemeye izin veriyor."
 tv_engineering_department.310.a: "Mükemmel."
 tv_engineering_department.311.t: "[tv_wonder_survey|E]: Tehlikeli Zemin"
 tv_engineering_department.311.d: "İlk haritaların kesinlik vaat ettiği yerde zemin değişiyor. Riskler zayıf, tebeşir çizgileri artık birbiriyle uyuşmuyor ve araştırma ekipleri daha kısa cümlelerle konuşmaya başlıyor. Ek destekler bu harikanın uygulama ölçeğini daraltacak; bunun nedeni hırsın zayıflaması değil, dünyanın kendi koşullarıyla yanıt vermesi. [tv_engineering_department|e] hala devam edebilir. Zemin pasifmiş gibi davranmayı bırakması gerekiyor."
 tv_engineering_department.311.a: "Planları ayarlayın."
 tv_engineering_department.312.t: "[tv_wonder_survey|E]:Tedarik Hatlarını Temizle"
 tv_engineering_department.312.d: "[tv_wonder_survey|E], beklenenden daha az sürtünmeyle taş, kereste ve aletleri taşıyabilecek rotalar bulur. İhmal edilmiş bir yol, kullanışlı bir nehir kıvrımına katılıyor, bir hazırlık alanı hafızadan daha geniş olduğunu kanıtlıyor ve yerel taşıyıcılar, hiçbir kraliyet haritasının öğrenmeye zahmet etmediği kısayolları zaten biliyor. [tv_wonder_materials|E] daha temiz hareket edecek çünkü arazi birçok sessiz iyilik sunuyor. Lojistik bir kere olsun suçlama olarak gelmiyor. İyi kenar boşluklarına sahip bir harita olarak geliyor."
 tv_engineering_department.312.a: "Bunları dikkatlice işaretleyin."
 tv_engineering_department.313.t: "[tv_wonder_survey|E]:Kırık Yaklaşımlar"
 tv_engineering_department.313.d: "Yollar, su yolları ve konaklama alanları ilk raporlarda iddia edilenden daha kötü durumda. Yolun tutması gereken yerde tekerlekler batıyor, tekneler suyun taşıması gereken yerde zaman kaybediyor ve gerçek vagonlar içeri girdiği anda sahne alanları küçülüyor. Lojistiği evcilleştirmek daha zor olacak ve [tv_wonder_materials|e] iyimserliği affetmeyecek. [tv_engineering_department|e] artık büyük eserlerin eski gerçeğiyle yüzleşiyor: Bir anıt, taş ona ulaşmadan çok önce başlıyor. Bazen çamurla başlar."
 tv_engineering_department.313.a: "Tazminat vereceğiz."
 tv_engineering_department.314.t: "[tv_wonder_survey|E]: Sahadaki Düzen"
 tv_engineering_department.314.d: "Ölçüm ekipleri temiz bir ritim tutturuyor. Bayraklar yerleştirilir, notlar kopyalanır, gözetmenler birbirleriyle çelişmeyi bırakır ve kaba gözlemler, gelecekteki işgücünün gerçekten itaat edebileceği bir sistem haline gelir. Bu dramatik bir keşif değil ama birden fazla yararlı olabilir. [tv_wonder_construction|E], birçok insanın aynı şeyi aynı sırayla yapmasının sıkıcı mucizesine bağlıdır. Bugün bu mucize mümkün görünüyor."
 tv_engineering_department.314.a: "İyi bir alışkanlık."
 tv_engineering_department.315.t: "[tv_wonder_survey|E]: Anket Karışıklığı"
 tv_engineering_department.315.d: "Çelişkili haritalar ve rakip gözetmenler işi yavaşlatıyor. Mürettebattan biri tepeye, diğeri yola yemin ediyor ve üçüncüsü o kadar hassas bir masa üretti ki, herkes ona hemen güvenmiyor. [tv_engineering_department|e] gelecekteki organizasyon planına olan güvenini kaybediyor çünkü kafa karışıklığı bir kez yazıldığında neredeyse resmi görünüyor. Harika, kötü topraklarda kötü komutadan daha kolay hayatta kalabilir. Doğum başlamadan önce birisinin haritalara anlaşmayı öğretmesi gerekir."
 tv_engineering_department.315.a: "Çöz onu."
 tv_engineering_department.320.t: "[tv_wonder_survey|E]: Özel Aletler Talep Edildi"
 tv_engineering_department.320.d: "Haritacılar pahalı aletler ve uzman zanaatkarlar talep ediyor. Sıradan görüş için çok ince açılardan, tahmin için fazla hassas toprak testlerinden ve [tv_great_engineer|e]'in ölçek değerlendirmesini asil iyimserliğe daha az bağımlı hale getirecek ölçümlerden bahsediyorlar. Mahkeme masrafları dinler; mühendisler hassas bir şekilde duyarlar. Onlara fon sağlanması anketin iyileştirilmesini sağlayacaktır, ancak bu aynı zamanda gelecekteki her talep sahibine doğruluğun bir bedeli olduğunu da öğretecektir. Reddetmek, eski araçları yerinde bırakır ve bilinmeyenleri kibarca gülümsetir."
 tv_engineering_department.320.a: "Hassasiyet için ödeme yapın."
 tv_engineering_department.320.b: "Elimizdekilerle yetinelim."
 tv_engineering_department.321.t: "[tv_wonder_survey|E]: Uzmanlığın Prestiji"
 tv_engineering_department.321.d: "[tv_great_engineer|E], mahkemeden tartışmalı bir lojistik yöntemini kamuya açık bir şekilde desteklemesini istiyor. Teklif, [tv_wonder_materials|e]'in daha hızlı hareket etmesini, daha az boşta çalışan işçiyi ve tam olarak muhafazakar gözetmenlerin boğazlarını temizlemeye başlamasını sağlayacak türden bir yenilik vaat ediyor. Diyarın prestijini ödünç vermek, tedarik planını daha ikna edici hale getirebilir. Başarısız olursa, utanç da halka açık olacaktır. Büyük projeler genellikle ilk kalabalığın kuralları anlamasından önce devletin kumar oynamasını ister."
 tv_engineering_department.321.a: "Adımızı üzerine kazıyın."
 tv_engineering_department.321.b: "Kamu onayı yok."
 tv_engineering_department.322.t: "[tv_wonder_survey|E]: Lonca Koordinasyonu"
 tv_engineering_department.322.d: "Kentsel tedarikçiler anket kayıtlarının standartlaştırılmasına yardımcı olabilir, ancak kesinti nedeniyle tavizler bekliyorlar. Katipleri ağırlıkları, hesaplamaları, rotaları ve bir listeyi diğerine eşleştirmenin sessiz zorbalığını anlıyor. [tv_engineering_department|e], özellikle [tv_wonder_materials|e] ciddi bir şekilde hareket etmeye başlamadan önce bu yetkinliği kullanabilir. Ancak her imtiyaz, ticareti anıtın hafızasına biraz daha derin bir şekilde kazımaktadır. Siparişi satın alabiliriz ama sipariş onu kimin sattığını hatırlayacaktır."
 tv_engineering_department.322.a: "Loncalara yaslanın."
 tv_engineering_department.322.b: "Yeni yükümlülüklerden kaçının."
 tv_engineering_department.401.t: "[tv_wonder_ceremony|E]: Meditasyon Başlıyor"
 tv_engineering_department.401.d: "Tamamlanan mucize sessizlikle örtülüyor. Rahipler, mühendisler ve kraliyet gözlemcileri, bir yıllık kemer sıkma politikalarının anıta nihai anlamını verebilmesi için sıradan gösterilerden çekiliyorlar. [tv_wonder_ceremony|e] gürültüyle değil, gürültünün kasıtlı olarak reddedilmesiyle başlar. [tv_engineering_department|e]'in bile sabrı öğrenmesi gerekiyor çünkü hiçbir hesaplama, kısıtlamayı öğretme amaçlı bir ritüeli aceleye getiremez. Ziyaretçiler ilk başta sessizliği sinir bozucu buluyor. Daha sonra nedenini anlayamadan seslerini kısmaya başlarlar."
 tv_engineering_department.401.a: "Yıl dönsün."
 tv_engineering_department.410.t: "[tv_wonder_ceremony|E]: Elçiler İstendi"
 tv_engineering_department.410.d: "Komşu bir mahkeme, büyük ekseninin açılışına tanıklık etmek için bir elçi göndermemizi istiyor. Davet törenseldir ancak törenler devletlerin anılma pratiği yaptığı yerdir. Katılım, yeni anıtı ilk gören, doğru zamanda alkışlayan ve mesajı açıklamaya ihtiyaç duymadan anlayanlar arasında ismimizi anacak. Reddetmek, yolculuğu kurtaracak ve hikayelerindeki yeri kaybedecektir. Bazı taşlar evde inşa edilir; diğerleri yurtdışından tanık bekliyor."
 tv_engineering_department.410.a: "Temsilciyi gönderin."
 tv_engineering_department.410.b: "Daveti reddedin."
 tv_engineering_department.411.t: "[tv_wonder_ceremony|E]: Bir Temsilci Geliyor"
 tv_engineering_department.411.d: "Davet edilen mahkeme kabul etti. Başka bir yabancı elçi, prova edilmiş bir vakarla, seyahat eden bir maiyetle ve hem ihtişamı hem de zayıflığı fark etmek için eğitilmiş gözlerle ritüel alayına katılıyor. [tv_wonder_ceremony|e], dışarıdan gelen her tanıkla birlikte daha ikna edici hale geliyor çünkü zafer, başka bir aksanla tekrarlandığında daha yüksek ses çıkarıyor. Alay ustaları giriş sırasını ayarlar; yazıcılar onur konuğu listesini ayarlar. Harikanın törensel ilerleyişi her seferinde sahayı gözetleyerek ilerliyor."
 tv_engineering_department.411.a: "Onları onurla karşılayın."
 tv_engineering_department.412.t: "[tv_wonder_ceremony|E]: Davet Reddedildi"
 tv_engineering_department.412.d: "Davet edilen mahkeme elçi göndermeyi reddetti. Cevapları hakaretten kaçınacak kadar kibar, hatırlanacak kadar soğuk. [tv_wonder_ceremony|e]'in izleyicisini başka bir yerde bulması gerekiyor, çünkü yabancıların hayranlığını arayan bir anıtın boş bir diplomatik yeri karşılaması mümkün değil. Saray mensupları şimdiden yeni isimler, daha gurur verici yollar ve ricaya daha az benzeyen mektuplar öneriyor. Glory reddetmeyi sevmez ama yönlendirilebilir."
 tv_engineering_department.412.a: "Başka bir komşuyu davet edin."
 tv_engineering_department.421.t: "[tv_wonder_ceremony|E]: Zafer Geçit Töreni Başlıyor"
 tv_engineering_department.421.d: "Pankartlar eksen boyunca kaldırılıyor, ancak geçit töreninin hala kanıtı yok. Davulcular prova yapabilir, atlar törensel toynaklarıyla taşları parlatabilir ve subaylar kendilerine güzel bir özgüven kazandırabilir, ancak bunların hiçbiri zafer değildir. [tv_wonder_ceremony|e], bizzat savaşın tasdik etmesi gereken bir zafer talep ediyor. O zamana kadar Askeri Şehir, tam olarak hak etmediği bir onura bürünecek. Yalnızca savaşta kazanılan zafer, anıta istediği anıyı verecektir."
 tv_engineering_department.421.a: "O zaman zafer gelmeli."
 tv_engineering_department.431.t: "[tv_wonder_ceremony|E]: Şehir Festivali Başlıyor"
 tv_engineering_department.431.d: "Şehir, düzenli meydanlarını bir yıl boyunca törenlere, oyunlara, yürüyüşlere ve halka açık eğitime açıyor. Atölyeler yavaşlar ama insanlar vatandaşlık disiplininin şeklini yürüyerek, izleyerek ve tanıdık gelene kadar şikayet ederek öğrenirler. [tv_wonder_ceremony|e] kentsel alanı açık havada tekrarlanan bir derse dönüştürüyor. Çocuklar sloganları anlamadan önce rotaları ezberliyorlar. Sivil Sermaye bunu şenlikli hale getirerek itaati öğretiyor."
 tv_engineering_department.431.a: "Vatandaşlar toplansın."
 tv_engineering_department.461.t: "[tv_wonder_ceremony|E]: Serbest Ticaret Festivali Başlıyor"
 tv_engineering_department.461.d: "Tüccarlar, elçiler ve komisyoncular limanı açık takas vaatleriyle dolduruyor. Gelirler bir süreliğine daralır çünkü cömertlik her zaman hesaplar kapanmadan önce en asil görünür. [tv_wonder_ceremony|e] rıhtımları, depoları ve kalabalık masaları yabancı güveni için bir sahneye dönüştürüyor. Kamuoyunda imzalanan her sözleşme, limana uzak mahkemelerin anlayacağı bir dil konuşmayı öğretir. Bir yıl boyunca kâr, itibarın geçebilmesi için eğilir."
 tv_engineering_department.461.a: "Rıhtımları açın."
 tv_engineering_department.471.t: "[tv_wonder_ceremony|E]: Ata Festivali Başlıyor"
 tv_engineering_department.471.d: "Nekropol, tütsülerin, şecerelerin ve ölçülü yasların olduğu bir yıla giriyor. İsimler, bir zamanlar ait oldukları bedenlerden daha ağır hissedilene kadar tekrarlanıyor ve atölyeler yavaşlarken, hafıza üretimden önce geliyor. [tv_wonder_ceremony|e], bölgeye soyları mimari olarak ele almayı öğretir. Her sunu, yaşayanların emredilen ölüler tarafından yönetildiği argümanına yeni bir taş koyar. Yas organize edildiğinde otorite haline gelir."
 tv_engineering_department.471.a: "Atalar toplansın."
 tv_engineering_department.481.t: "[tv_wonder_ceremony|E]: Gezgin Loncası Başlıyor"
 tv_engineering_department.481.d: "Pilotlar, haritacılar, halat ustaları ve liman memurları, deniz fenerinin altındaki lonca salonlarını gözetliyorlar. Deniz haritaları, düğümler, öncelik kavgaları ve kötü havalarda kıyı şeritlerini okuyabilen insanlara özgü özgüvenle geliyorlar. İşaret, kurumları ayağa kalkana kadar tamamlanmayacaktır. Yalnızca bir ışık gemileri uyarır; lonca bir ülkeye uyarıyı nasıl anlayacağını öğretir. [tv_wonder_ceremony|e] artık saçında tuz olan bürokrasiyi bekliyor."
 tv_engineering_department.481.a: "Loncayı kur."
 tv_engineering_department.491.t: "[tv_wonder_ceremony|E]: Su Festivali Başlıyor"
 tv_engineering_department.491.d: "Kanallar çelenklerle süslendi, savaklar kutsandı ve atölyeler bir yıl boyunca su ayinleri için sessizleştirildi. Suyun itaatkar görünmesi için yaratıldığı, bir tufanı izleyen herkesin bildiği gibi cesur bir teolojik iddiadır. Üretim, kompleksin [tv_wonder_ceremony|e] aracılığıyla kutsal düzen talep edebilmesi için eğiliyor. Mühendisler, rahiplerin incelemeyi tercih ettikleri şeyleri kutsamalarını, rahipler ise mühendislerin kutsallaştırmayı tercih ettikleri şeyleri ölçmelerini izliyor. Aralarında su hareket etmeye devam ediyor."
 tv_engineering_department.491.a: "Sular dönsün."
 tv_engineering_department.501.t: "[tv_wonder_ceremony|E]: Derin Drenaj Başlıyor"
 tv_engineering_department.501.d: "Mühendisler drenaj çalışmalarını maden şehrine doğru sürüyor. Pompalar, destekler ve kanallar derinlikleri fethederken şaftlar bir yıl boyunca neredeyse sessiz kalacak. Madenciler sessizlikten en az su kadar hoşlanmazlar ama daha derin bir zenginliğe sahip olabilmek için her ikisine de katlanmak gerekir. Buradaki [tv_wonder_ceremony|e] nazik değil; karanlıkla, nemle ve sabırla yapılan bir pazarlıktır bu. Eserler nihayet nefes aldığında şehir korkunun ne kadar altına inebileceğini bilecek."
 tv_engineering_department.501.a: "Karanlığı boşaltın."
 tv_engineering_department.511.t: "[tv_wonder_ceremony|E]: Yıldız Kataloğu Başlıyor"
 tv_engineering_department.511.d: "Gözlemevi kendisini lambaların, masaların ve disiplinli uykusuzluğun çevresine kapatıyor. Gökbilimciler, dağınık ışıklar olarak değil, geleceğin bilim adamlarının test edebileceği bir kamu düzeninin girişleri olarak birbiri ardına yıldızları işaretlerler. Mahkeme gökyüzüne ve enstrümanlara odaklanırken mevzuat yavaşlıyor. [tv_wonder_ceremony|e] bugün gösteriyle bitmeyecek; gökler yeterli sabırla kopyalanıp kullanışlı hale getirildiğinde sona erecektir."
 tv_engineering_department.511.a: "Gökyüzünü saysınlar."
 tv_engineering_department.521.t: "[tv_wonder_ceremony|E]: Tutulma Bildirisi Başlıyor"
 tv_engineering_department.521.d: "Gözlemevi öngörüsünü yayınladı: Bir tutulma gelecek ve korku onu isimlendirmeden önce mahkeme ona isim vermeye hazır olacak. Rahipler, akademisyenler, denizciler ve şüpheciler artık farklı umutlarla yukarıya bakıyorlar. Geçen her ay iddiayı test eder. Eğer gökyüzü tablolara itaat ederse, [tv_wonder_ceremony|e] âlemin cenneti ona teslim olmadan okuyabildiğinin kanıtı olacak."
 tv_engineering_department.521.a: "Gökleri izle."
 tv_engineering_department.522.t: "[tv_wonder_ceremony|E]: Tutulma Geliyor"
 tv_engineering_department.522.d: "Işık tam olarak gözlemevinin söylediği yerde değişiyor. Kalabalık susar ama sessizlik panik değildir; çığırtkanlar onlara bilgili tabloların önceden bildirdiği şeyleri zaten anlatmışlardır. [tv_wonder_ceremony|e] güneş, gölge ve nefes arasındaki alanda kamusal kesinlik haline gelir. Işık geri geldiğinde mahkeme yalnızca bilgelik iddiasında bulunmaz. Zamanlamanın, cesaretin ve merakın hakimiyetinin kendisini gösterdi."
 tv_engineering_department.522.a: "Alem bu tahmini hatırlasın."
 tv_engineering_department.531.t: "[tv_wonder_ceremony|E]: Saygı duruşunda bulunuldu"
 tv_engineering_department.531.d: "Bir başka konu katkısı da Milletler Sarayı'na giriyor. Gösterişli bir özenle sergileniyor: Sadece zenginlik değil, aynı zamanda salondan geçen her elçinin görebileceği rütbeyle ilgili bir tartışma. Haraç galerisi her sunumla daha ikna edici hale geliyor çünkü mimari olduğunda, zafer gibi itaate de inanmak daha kolay hale geliyor. Tören, her seferinde ölçülü bir itaat eylemini ilerletir."
 tv_engineering_department.531.a: "Anma törenini kaydedin."
 tv_engineering_department.541.t: "[tv_wonder_ceremony|E]: Elçilik Mahallesi Başlıyor"
 tv_engineering_department.541.d: "Milletler Sarayı'nın yanındaki elçilik mahallesinin temelleri işaretlendi. Yabancı evler kapılara, avlulara, hizmetçi geçişlerine ve diplomasiyi ara sıra yapılan bir ziyaretten ziyade günlük bir varlık haline getiren tüm küçük pratik saygınlıklara sahip olacak. [tv_wonder_ceremony|e] artık diğer mahkemelerin yaşaması için inşa edilmiş bir bölgede bekliyor. Bir saray dikkati çekebilir; elçilik mahallesi kalmaya dikkat etmeyi öğretir."
 tv_engineering_department.541.a: "Yabancı gözler için yerler inşa edin."
 tv_engineering_department.500.t: "[tv_wonder_ceremony|E]: Proje Açılışı Yapıldı"
 tv_engineering_department.500.d: "[tv_engineering_department|E], [tv_wonder_ceremony|e]'i tamamladı ve anıt artık diyarın hırsının kalıcı bir işareti olarak duruyor. İskeleler gitti, defterler mühürlendi ve halk hiçbir mühendisin bitiremeyeceği işe başladı: mucizenin ne anlama geldiğine karar vermek. Bazıları buna şan, bazıları aşırılık, bazıları ise çağın değiştiğinin kanıtı diyecek. Hepsinin buna bakması gerekecek. Bu zaten bir tür zaferdir."
 tv_engineering_department.500.a: "Bırakın çağ bunu hatırlasın."
 tv_engineering_department.600.t: "[tv_wonder_construction|E]: Bir Dünya Harikası Tamamlandı"
 tv_engineering_department.600.d: "[SCOPE.sCountry('tv_wonder_builder_country').GetName]'ten haber geldi: [SCOPE.sLocation('tv_wonder_completed_site').GetName]'te bir dünya harikası tamamlandı. Rivayetler masrafı, güzelliği, amacı ve bilgeliği açısından farklılık gösterir, ancak bir noktada hemfikirdirler. İş yerel kalamayacak kadar büyük. Yöneticilerin ortak sohbetine girmiştir."
 tv_engineering_department.600.a: "Dünya duydu."

