 TV_ENGINEERING_CONSTRUCTION_INFO_TEXT: "Büyük Projenin seviyesi, dört [tv_wonder_construction_part|e] arasında tamamlanan en düşük birim sayısına eşittir. Bir ünitenin tamamlanması [tv_wonder_domestic_support|e]'i sağlar; toplam seviyeyi yükseltmek başka bir destek bonusu verir."
 TV_ENGINEERING_FINISH_CONSTRUCTION_BUTTON: "@trigger_yes! Büyük Projenin Tamamlandığını Bildirin"
 TV_ENGINEERING_CONSTRUCTION_HELP_TEXT_1: "$BULLET$ [tv_wonder_construction|e] aynı anda dört [tv_wonder_construction_part|e]'i geliştirir: Temel, Ana Yapı, İşlev ve Tepelendirme. Şu anda yapım aşamasında olan parçayı değiştirmek için yukarıdaki düğmeleri kullanın."
 TV_ENGINEERING_CONSTRUCTION_HELP_TEXT_2: "$BULLET$ [tv_wonder_construction|e]'in seviyesi hangi parçanın en geride olduğuna bağlıdır; toplam seviye ancak geride kalan kısım yeni bir üniteyi tamamladığında yükselir."
 TV_ENGINEERING_CONSTRUCTION_HELP_TEXT_3: "$BULLET$ En az bir seviyeyi tamamladıktan sonra [tv_wonder_construction|e]'in tamamlandığını bildirebilirsiniz."
 TV_ENGINEERING_CONSTRUCTION_HELP_TEXT_4: "$BULLET$ Bu nedenle, halihazırda kazanılmış olan tamamlama ödüllerini kaybetmeden önce daha küçük ölçekli bir projeyi tamamlayabilir ve daha sonra [tv_wonder_expansion|e]'i daha büyük bir ölçeğe taşıyabilirsiniz."
 TV_ENGINEERING_CONSTRUCTION_HELP_TEXT_5: "$BULLET$ Herhangi bir inşaat biriminin tamamlanması [tv_wonder_domestic_support|e] sağlar; eğer bu birim Büyük Projenin toplam seviyesini de yükseltirse, başka bir [tv_wonder_domestic_support|e] bonusu verir."
 TV_ENGINEERING_CONSTRUCTION_HELP_TT: "#T İnşaat#!\n[tv_wonder_construction|e] aynı anda dört [tv_wonder_construction_part|e]'i ilerletir: Temel, Ana Yapı, İşlev ve Tepeleme. Şu anda yapım aşamasında olan parçayı değiştirmek için yukarıdaki düğmeleri kullanın.\n[tv_wonder_construction|e]'in seviyesi hangi parçanın en geride olduğuna bağlıdır; toplam seviye yalnızca geride kalan kısım yeni bir üniteyi tamamladığında yükselir.\nEn az bir seviyeyi tamamladıktan sonra [tv_wonder_construction|e]'in tamamlandığını ilan edebilirsiniz.\nBu nedenle, önceden kazanılmış tamamlama ödüllerini kaybetmeden önce daha küçük ölçekli bir projeyi tamamlayabilir ve daha sonra daha büyük bir ölçeğe genişletebilirsiniz.\nHerhangi bir inşaat ünitesini tamamlamak, [tv_wonder_domestic_support|e] sağlar; eğer bu birim aynı zamanda Büyük Projenin toplam seviyesini de yükseltirse, başka bir [tv_wonder_domestic_support|e] bonusu verir."
