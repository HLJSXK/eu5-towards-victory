 tv_engineering_department.551.t: "[tv_wonder_ceremony|E]: Alimler Toplanıyor"
 tv_engineering_department.551.d: "Üniversite Şehri çalışmaya yönelik sesini kısıyor. Ustalar, öğrenciler, yazıcılar ve yetkililer ders listeleri ve tartışmalı okumalar etrafında toplanarak tamamlanan sokakları bir yıl sürecek bir toplantıya dönüştürüyor. [tv_wonder_ceremony|e] aceleye getirilmeyecek. Bölgeden, mevcut mahkemeden daha uzun süre dayanabilecek bir müfredat için idari hızdan vazgeçmesini istiyor."
 tv_engineering_department.551.a: "Alimler yıllarını geçirsinler."
 tv_engineering_department.552.t: "[tv_wonder_ceremony|E]: Üniversite Salonu Başlıyor"
 tv_engineering_department.552.d: "Üniversite Salonunun planları Üniversite Şehri'nin yanında mühürlenmiştir. Yeni salon, ustalara resmi olarak tartışabilecekleri bir alan, öğrencilere faydalı yollarla daha az emin olabilecekleri bir alan ve taç da öğrenmenin tamamen evcilleştirilmeden tanınabileceği bir yapı sağlayacak. [tv_wonder_ceremony|e] artık kapılar, sıralar, tüzükler ve altında çalışmanın kalıcı olduğunu iddia edebileceği bir çatı üzerinde bekliyor."
 tv_engineering_department.552.a: "Tartışmak için bir ev inşa edin."
 tv_engineering_department.561.t: "[tv_wonder_ceremony|E]: Kubbe Örtülü"
 tv_engineering_department.561.d: "Büyük kubbe kutsama amacıyla örtülmüştür. Rahipler eşikleri işaretliyor, şarkıcılar ölçülü saygı düzenini prova ediyor ve mahkeme, kutsallığın dikkatli bir şekilde ilerleyebilmesi için meşruluğun daha yavaş ilerlemesi gereken bir yılı kabul ediyor. [tv_wonder_ceremony|e], tapınak göklerini açmaya hazır olana kadar diyardan kapalı bir gökyüzünün altında beklemesini ister."
 tv_engineering_department.561.a: "Kubbe kutsal kılınsın."
 tv_engineering_department.571.t: "[tv_wonder_ceremony|E]: Seyyah Merdiveni Açılıyor"
 tv_engineering_department.571.d: "Kule tapınağının merdiveni, bir yıl boyunca hacılara tırmanma, duraklama, ilahiler ve ağrıyan ayaklar için verilmiştir. Atölyeler, emeğin törenlere yönelmesinden şikayetçi, ancak [tv_wonder_ceremony|e]'in amacı çaba yoluyla yüksekliği öğretmektir. Her adım, kuleyi bir nesne olmaktan çıkarıp bir rotaya dönüştürüyor ve her rota, bağlılığı görünür kılıyor."
 tv_engineering_department.571.a: "Bırakın tırmansınlar."
 tv_engineering_department.572.t: "[tv_wonder_ceremony|E]: Tapınak Okulu Başlıyor"
 tv_engineering_department.572.d: "Öğretmenler, katipler ve inşaatçılar kulenin altındaki tapınak okulunun temellerini atıyor. [tv_wonder_ceremony|e] artık öğretinin alışkanlığa, okuryazarlığa ve ritüelle disipline edilen tartışmaya dönüşebileceği sınıflarda bekliyor. Bir kule gözleri yukarıya çekebilir; bir okul seslere baktıklarında ne söylemeleri gerektiğini öğretecek."
 tv_engineering_department.572.a: "Okulu inşa et."
 tv_engineering_department.581.t: "[tv_wonder_ceremony|E]: Nehir Fuarı Başlıyor"
 tv_engineering_department.581.d: "Genişleyen nehir boyunca kabinler, mavnalar, gişeler ve festival pankartları toplanıyor. Nehrin arter haline gelmeden önce gösteriye dönüşmesi istendiğinde ticaret yavaşlıyor. [tv_wonder_ceremony|e], tüccarların, kayıkçıların ve yetkililerin yeni su düzenini birlikte gerçekleştirmelerini sağlamak için bir yıl harcayacak."
 tv_engineering_department.581.a: "Bırakın nehir yeni kalabalığını öğrensin."
 tv_engineering_department.582.t: "[tv_wonder_ceremony|E]: Kanal Ofisi Başlıyor"
 tv_engineering_department.582.d: "Haritacılar kanal idaresi için kalıcı bir ofis belirler. Bina nehir çalışmalarına rakip olacak kadar büyük olmayacak, tam da bu yüzden önemli: Savaklar, anlaşmazlıklar, geçiş ücretleri, onarımlar ve kuru sezon şikayetleri, sorumluluğun saklanamayacağı bir yere ihtiyaç duyuyor. [tv_wonder_ceremony|e] artık yönetimin duvar edinmesini bekliyor."
 tv_engineering_department.582.a: "Nehire bir masa ver."
 tv_engineering_department.591.t: "[tv_wonder_ceremony|E]: Amirallik Ofisi Başlıyor"
 tv_engineering_department.591.d: "Tersane, amirallik ofisi için yer ayırıyor. Fırlatma yolları ve vinçler gemi inşa edebilir, ancak filolar aynı zamanda emirlere, çizelgelere, denetimlere ve keresteyi politika haline getirecek sabıra sahip yetkililere de ihtiyaç duyar. [tv_wonder_ceremony|e] şimdi tersanenin donanmanın aklını kazanmasını bekliyor."
 tv_engineering_department.591.a: "Ofisi inşa et."
 tv_engineering_department.601.t: "[tv_wonder_ceremony|E]: Burçlar Deneme Altında"
 tv_engineering_department.601.d: "Star Fortress City denemelerle dolu bir yıla başlıyor. Mühendisler açıları test ediyor, topçular ateş alanlarını test ediyor ve işçiler matematik için tasarlanmış bir duvarın maliyetinin hâlâ kas gücüyle ödenmesi gerektiğini keşfediyor. [tv_wonder_ceremony|e] kaleye teoriye taşla cevap vermeyi öğretirken üretim yavaşlıyor."
 tv_engineering_department.601.a: "Her açıyı test edin."
 tv_engineering_department.602.t: "[tv_wonder_ceremony|E]: Arsenal Çeyrek Başlıyor"
 tv_engineering_department.602.d: "Kale şehrinin içindeki bir cephanelik mahallesinin temelleri işaretlenmiştir. Tamirhaneleri, barut depolarını ve toplamahaneleri tek bir disiplinli bölgeye bağlayacak. [tv_wonder_ceremony|e] artık kalenin ilk alarm ortadan kalktıktan sonra savunmayı tekrarlanabilir kılan kısmında bekliyor."
 tv_engineering_department.602.a: "Cephanelik bölgesini inşa edin."
 tv_engineering_department.611.t: "[tv_wonder_ceremony|E]: Sinyal Ateşleri Yakılıyor"
 tv_engineering_department.611.d: "Duvardaki gözetleme direkleri bir yıllık sinyal uygulamasına başlıyor. Duman, alevler, yolcular ve yerel pazarlar yeni ritim etrafında şekilleniyor ve her rota önce uyarıları fark etmeyi öğrenirken ticaret de zarar görüyor. [tv_wonder_ceremony|e], rutin seyahatlerin bile gözlemlendiğini hissettirecek kadar dikkati kamuoyuna duyuruyor."
 tv_engineering_department.611.a: "Saatinizi parlak tutun."
 tv_engineering_department.621.t: "[tv_wonder_ceremony|E]: Usta Zırhçılar Salonu Başlıyor"
 tv_engineering_department.621.d: "Cephanelik, usta zırhçılardan oluşan bir salonun temellerini işaret ediyor. En büyük silah depoları yalnızca demire ve defterlere bağlı olamaz; Başarısızlıkları savaştan önce değerlendirebilecek yetenekli ellere ihtiyaçları var. [tv_wonder_ceremony|e] artık geminin kalıcı bir saha kazanmasını bekliyor."
 tv_engineering_department.621.a: "Ustalar için inşa edin."
 tv_engineering_department.631.t: "[tv_wonder_ceremony|E]: Ulusal Katalog Başlıyor"
 tv_engineering_department.631.d: "Ulus Kütüphanesi kataloğuna başlıyor. Akademisyenler hafızanın kendini yeniden bulmasını öğretirken kapıları kapatıyor, envanterleri açıyor ve ülkenin yasa yapma mekanizmasını yavaşlatıyor. [tv_wonder_ceremony|e] bir geçit töreni değil bir göstergedir: sessiz, titiz ve tamamlandığında güçlü."
 tv_engineering_department.631.a: "Kataloğun büyümesine izin verin."
 tv_engineering_department.632.t: "[tv_wonder_ceremony|E]: Yasal Mevduat Ofisi Başlıyor"
 tv_engineering_department.632.d: "İnşaatçılar kütüphanenin yanındaki yasal emanet ofisini işaretliyor. Buradan kitaplar, fermanlar, nüshalar, deliller lütuf olarak değil, yükümlülük olarak toplanacaktır. [tv_wonder_ceremony|e] artık kazaya bağlı olarak diyarın yazılı hafızasının duracağı odayı bekliyor."
 tv_engineering_department.632.a: "Hafıza ofisini inşa edin."

