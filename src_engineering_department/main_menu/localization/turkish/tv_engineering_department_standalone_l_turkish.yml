 tv_engineering_department_standalone.1.t: "[tv_wonder_construction|E]: Mühendislik Departmanı"
 tv_engineering_department_standalone.1.d: "Ülkenizde artık üstlenebileceği her Büyük Projenin arkasındaki kurum olan bir Mühendislik Departmanı var.\n\nBaşlamak için bir Büyük Mühendis atayın. İlk önce uygulanabilir bir proje için bir #high Conception#! geliştirirler ve daha sonra mahkemeniz bunu yerel #high Tartışma#!'te değerlendirir. Bir #high Anket#!, seçilen sahayı doğrular, ardından #high İnşaat#!'in kendisi başlar ve proje dört bölümden geçerek son seviyesine yükseltilir. Tamamlama, kalıcı bir ödül veren bir #high Tören#! ile işaretlenir.\n\nİlerlemeyi kontrol etmek veya bir Büyük Mühendis atamak için istediğiniz zaman Mühendislik Departmanı panelini açın."
