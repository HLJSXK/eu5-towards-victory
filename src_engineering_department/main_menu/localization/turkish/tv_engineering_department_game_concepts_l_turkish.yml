 # ── Engineering Department / Wonder Construction ──────────────────────────
 game_concept_tv_engineering_department: "Mühendislik Bölümü"
 game_concept_tv_engineering_department_desc: "Kampanyanın başlatılması sırasında her ülke için otomatik olarak oluşturulan, benzersiz olmayan bir uluslararası organizasyon. [tv_great_engineer|e] ofisini tutar ve [tv_wonder_construction|e]: [tv_wonder_concept|e], [tv_wonder_survey|e] sitesi, organizasyon, lojistik ve son [tv_wonder_ceremony|e]'in her aşamasını yönetir."
 game_concept_tv_engineering_department_europedia_desc: "Kampanya başlangıcında veya Mühendislik Departmanı mevcut bir kayıtlara ilk kez eklendiğinde her ülke için otomatik olarak kurulan bu kurum, bir ülkenin denediği her [tv_wonder_construction|e]'in arkasında duran daimi kurumdur. Tek subayı [tv_great_engineer|e], boru hattını kişisel olarak yönlendiriyor: İdari becerileri [tv_wonder_concept|e]'i ilerletiyor, Askeri becerileri [tv_wonder_survey|e]'i ilerletiyor ve görev süreleri son [tv_wonder_ceremony|e]'te kimin hatırlanacağını belirliyor. Halihazırda devam eden bir proje, Büyük Mühendisin kaybedilmesi veya değiştirilmesiyle sıfırlanmaz, ancak boş bir ofis, bir halef atanana kadar Konsept ve Araştırma ilerlemesini durdurur."

 game_concept_tv_great_engineer: "Büyük Mühendis"
 game_concept_tv_great_engineer_desc: "[tv_engineering_department|e]'e liderlik eden atanan karakter. [tv_great_engineer|e] bir ülke değişkeni olarak saklanır ve [tv_engineering_department|e] panelinden atanabilir, değiştirilebilir veya görevden alınabilir."

 game_concept_tv_wonder_concept: "gebelik"
 game_concept_tv_wonder_concept_desc: "Yeni bir [tv_wonder_construction|e] açan teklif aşaması. [tv_great_engineer|e]'in İdari becerisi her ay Gebe Kalma sürecini ilerletir; Tamamlandığında [tv_great_engineer|e], ülkenin takip etmesi için uygun bir [tv_wonder_small|e], [tv_wonder_medium|e] veya [tv_wonder_large|e] projesini ortaya koyar."
 game_concept_tv_wonder_concept_europedia_desc: "Konsept, bir [tv_great_engineer|e] atandığı anda başlar: gizli bir ilerleme ölçer 0'dan başlar ve memurun İdari becerisine göre her ay biraz yükselir. Zayıf bir yöneticinin Konsept'i tamamlaması yıllar alabilirken, birkaç yetenekli yöneticiyi arka arkaya dolaşan bir ülke, şu anda ofisi kimin elinde tuttuğuna bakılmaksızın, biriken ilerlemeyi ileriye taşır. Tamamlandığında Mühendis ülkenin özgürce seçim yapmasına izin vermez - ülkenin takip etmesi için ülkenin şu anda destekleyebileceği şeye göre şekillendirilen uygulanabilir bir [tv_wonder_small|e], [tv_wonder_medium|e] veya [tv_wonder_large|e] girişimi önerir."

 game_concept_tv_wonder_survey: "Anket"
 game_concept_tv_wonder_survey_desc: "[tv_wonder_construction|e]'in saha değerlendirme aşaması. Anket ilerlemesi, [tv_great_engineer|e]'in Askeri becerisine göre aylık olarak artıyor, [tv_wonder_scale_competence|e], [tv_wonder_logistics_competence|e] ve [tv_wonder_organization_competence|e]'i ortaya çıkarıyor ve okumalar tamamlandıktan sonra ülkenin bir inşaat sahasını onaylamasına olanak tanıyor."
 game_concept_tv_wonder_survey_europedia_desc: "Tartışma çözümlendiğinde, araştırmacılar seçilen sitenin üç gizli özelliğini değerlendirir: [tv_wonder_scale_competence|e], [tv_wonder_organization_competence|e] ve [tv_wonder_logistics_competence|e]; her biri sitenin kendi doğal uygunluğunu [tv_great_engineer|e]'in İdari becerisiyle harmanlar. Araştırmanın ilerlemesi Mühendisin Askeri becerisinden biriktikçe üç okumanın tümü birlikte yükselir ve inşaat başladıktan sonra hiçbiri yeniden iyileştirilemez, bu nedenle daha iyi bir yer için daha uzun bir beklemeye karşı marjinal bir alanı tartan bir ülke gerçek bir ödünleşim yapıyor demektir."

 game_concept_tv_wonder_debate: "Tartışma"
 game_concept_tv_wonder_debate_desc: "[tv_wonder_construction|e]'in ülke içi tartışma aşaması. Mülk taleplerinin karşılanması ve tartışma etkinlikleri [tv_wonder_domestic_support|e]'i geliştirir; 100'e ulaştığında ülke tartışmanın sonuçlandığını ilan edebilir ve [tv_wonder_survey|e]'e geçebilir."
 game_concept_tv_wonder_debate_europedia_desc: "Herhangi bir temel atılmadan önce önerilen projenin ülke içindeki tartışmalardan sağ çıkması gerekiyor. Asiller, Burgherler ve Din Adamlarının her biri, memnuniyetleri [tv_wonder_domestic_support|e] kazandıran talepleri gündeme getiriyor ve tartışma etkinlikleri daha fazlasını sağlıyor. Destek 0-200 ölçeğinde çalışır ancak tartışmayı kapatmak ve [tv_wonder_survey|e]'e geçmek için yalnızca ilk 100 puana ihtiyaç vardır. Destek sonsuza kadar birikmez: Tartışma sona erdiğinde her ay biraz azalır, dolayısıyla tartışmayı zaten kapatabilen bir ülke, tartışmayı açık bırakarak çok az kazanır ve desteğin, törenini kazanmadan önce sıfıra kadar azalmasına izin veren bir proje, tamamen çökme tehlikesiyle karşı karşıya kalır."

 game_concept_tv_wonder_materials: "Yapı Malzemeleri"
 game_concept_tv_wonder_materials_desc: "A produced market good used to maintain $tv_wonder_labor_camp$ during an active [tv_wonder_construction|e]. Each $tv_wonder_material_dispatch_point$ converts basic construction goods into [tv_wonder_materials|e], so supply and price are handled through the normal market."
 game_concept_tv_wonder_materials_europedia_desc: "Harika Malzemeler önceden stoklanmaz; her $tv_wonder_material_dispatch_point$ bunları talep üzerine piyasada dolaşan sıradan inşaat malzemelerinden arındırır ve sahada fiilen çalışan $tv_wonder_labor_camp$ binası bunları inşa ederken tüketir. Zincirin her iki ucu da normal pazarda yer aldığından, Büyük Proje aynı temel mallar için ülke ekonomisinin geri kalanıyla rekabet eder ve kıtlık, sert bir duruştan ziyade daha yavaş inşaat olarak ortaya çıkar."

 game_concept_tv_wonder_ceremony: "Tören"
 game_concept_tv_wonder_ceremony_desc: "Tamamlanmış bir [tv_wonder_construction|e] projesinin son teslimi. Seçilen tören dalı, anıtın son binasını, kalıcı ülke değiştiricisini ve kalan [tv_wonder_domestic_support|e]'ten elde edilen son prestij, istikrar ve meşruiyet patlamasını belirler."
 game_concept_tv_wonder_ceremony_europedia_desc: "Büyük bir Projenin nasıl kapatılacağı, onun ne tür bir harika olduğuna bağlıdır. Bir [tv_wonder_generic|e] projesinin açılışı, ülkenin üç tören stili arasında seçim yapmasına olanak tanıyor: kalıcı bir kutsamayla sonuçlanan bir yıl süren bir yük, yerel mülk gücünü artıran yardımcı bir ek bina veya bedeli sanat, altın ve prestijle ödenen tek seferlik bir dekorasyon. Çoğu [tv_wonder_unique|e] harikası bunun yerine, inşaat tamamlandığında ortak sekiz aşamalı bir törenle otomatik olarak ilerler, her çeyrekte kabaca bir yeni aşamaya ulaşır ve kalıcı bir ülke değişikliğiyle sonuçlanır. Aralarında Pharos Deniz Feneri ve Ayasofya'nın da bulunduğu bir avuç tarihsel açıdan farklı yer, bu ortak çerçeveyi tamamen atlayarak kendi özel, elle yazılmış ritüellerine yöneliyor."

 game_concept_tv_wonder_construction: "Büyük Proje"
 game_concept_tv_wonder_construction_desc: "[tv_engineering_department|e] aracılığıyla yönetilen Harika bir Proje mekanizması. [tv_great_engineer|e]'in [tv_wonder_concept|e]'i uygun bir [tv_wonder_small|e], [tv_wonder_medium|e] veya [tv_wonder_large|e] projesi sağladığında ve ülke ülke içindeki tartışmayı çözdüğünde, [tv_wonder_survey|e]'i tamamlar, işçileri organize eder, [tv_wonder_materials|e]'i toplar ve dört [tv_wonder_construction_part|e]'i ilerletir Projeyi nihai seviyeye çıkarmak."
 game_concept_tv_wonder_construction_europedia_desc: "Büyük Proje, bir harikayı fikirden anıta taşıyan ülke çapındaki ipliktir. Bir [tv_great_engineer|e], uygulanabilir bir [tv_wonder_concept|e], [tv_wonder_small|e] veya [tv_wonder_medium|e] girişimini önermek için ilk olarak [tv_wonder_large|e]'i tamamlar; ülke daha sonra yurt içi [tv_wonder_debate|e] sorununu çözer; [tv_wonder_survey|e], seçilen sitenin buna dayanabileceğini doğrular; ve ancak o zaman inşaat tam anlamıyla başlar, dört [tv_wonder_construction_part|e] [tv_wonder_materials|e] üzerinde birlikte yükselir ve tüm proje nihai seviyesine ulaşıncaya ve bir [tv_wonder_ceremony|e] ile kapatılıncaya kadar emek organize edilir. Tamamlanmış bir [tv_wonder_generic|e] projesi daha sonra önceki aşamalardan herhangi birini tekrarlamadan [tv_wonder_expansion|e] aracılığıyla daha ileri düzeyde taşınabilir."

 game_concept_tv_wonder_expansion: "Genişleme"
 game_concept_tv_wonder_expansion_desc: "Aynı tesiste halihazırda açılışı yapılmış olan [tv_wonder_construction|e]'in daha büyük bir ölçekte devam ettirilmesi. Genişletme, bu harikanın daha önceki açılışında seçilen [tv_wonder_ceremony|e] stilini yeniden kullanıyor, halihazırda kazanılmış olan tamamlama ödüllerinden herhangi birini kaybetmiyor ve sitenin korunmuş [tv_wonder_survey|e] yeterliliğinden yararlanmaya devam ediyor."

 game_concept_tv_wonder_construction_part: "İnşaat Bölümü"
 game_concept_tv_wonder_construction_part_desc: "[tv_wonder_construction|e]'in aynı anda ilerlediği dört paralel yoldan biri (Temel, Ana Yapı, İşlev ve Taçlandırma). Projenin seviyesi, dört bölümden hangisinin en geride kaldığına göre belirlenir, bu nedenle ilerlemenin tek bir yolda ilerlemek yerine eşit şekilde yayılması gerekir."
 game_concept_tv_wonder_construction_part_europedia_desc: "Her Büyük Proje aslında paralel olarak yükselen dört binadan oluşur: Temel, Ana Yapı, İşlev ve Kaplama. Her biri bağımsız olarak kendi işçiliği ve malzemesiyle gelişmiştir. Projenin genel seviyesi dördünün ortalaması değil; en geride kalan kısımla sınırlıdır. Her kaynağı gösterişli bir yola aktarırken diğerlerini ihmal etmek, tüm anıtı yalnızca en zayıf noktasında oyalar; dolayısıyla dört tanesinde dengeli ilerleme, herhangi birini birinci bitirme yarışından daha üstündür."

 game_concept_tv_wonder_small: "Küçük Proje"
 game_concept_tv_wonder_small_desc: "Bir [tv_wonder_construction|e] boyut sınıfı. Küçük projeler birden fazla yapılabilir. Temel ülke etkisi değer hareketi ile sınırlıdır, yerel etkiler ve tören efektleri ise sınırsızdır.\nKüçük bir projenin her seviyesi genellikle #Y 10.000@gold!#! civarında maliyete sahiptir."

 game_concept_tv_wonder_medium: "Orta Proje"
 game_concept_tv_wonder_medium_desc: "Küçük ve büyük projeler arasında bir [tv_wonder_construction|e] boyut sınıfı. Bir ülke aynı türde ikinci bir orta ölçekli proje başlatamayabilir ancak temel ülke etkileri, yerel etkileri ve tören efektleri sınırsızdır.\nOrta ölçekli bir projenin her seviyesinin maliyeti genellikle #Y 20.000@gold!#! civarındadır."

 game_concept_tv_wonder_large: "Büyük Proje"
 game_concept_tv_wonder_large_desc: "Bir [tv_wonder_construction|e] boyut sınıfı. Bir ülke aynı türde ikinci bir büyük projeye başlamayabilir ancak temel ülke etkileri, yerel etkileri ve tören etkileri sınırsızdır.\nBüyük bir projenin her seviyesinin maliyeti genellikle #Y 30.000@gold!#! civarındadır."

 game_concept_tv_wonder_generic: "Genel Harika"
 game_concept_tv_wonder_generic_desc: "Haritada sabitlenmiş bir [tv_wonder_construction|e]'in aksine, [tv_great_engineer|e] tarafından önerilen ve [tv_wonder_small|e], [tv_wonder_medium|e] veya [tv_wonder_large|e] ölçeğinde serbestçe konumlandırılmış bir [tv_wonder_unique|e]. Açılışı bir [tv_wonder_ceremony|e] stili seçmenizi sağlar."
 game_concept_tv_wonder_generic_europedia_desc: "Genel bir mucize herhangi bir sabit konuma bağlı değildir: [tv_wonder_survey|e] uygun bir siteyi onayladıktan sonra, [tv_wonder_small|e]'in önerdiği [tv_wonder_medium|e], [tv_wonder_large|e] veya [tv_great_engineer|e] sınıflarından hangisinde inşa edileceğini ülkenin kendisi seçer. Hatta küçük genel projeler yeni bir alanda birden fazla kez yeniden oluşturulabilir ve bu da bir ülkenin söz konusu arketipin tören ödüllerine tekrarlanabilir erişimini sağlar; tüm oyun boyunca tek bir yerde tam olarak bir kez var olan [tv_wonder_unique|e]'in aksine."

 game_concept_tv_wonder_unique: "Eşsiz Harika"
 game_concept_tv_wonder_unique_desc: "Serbestçe konumlandırılmış bir [tv_wonder_construction|e]'in aksine, belirli bir harita konumuna sabitlenmiş tarihi bir [tv_wonder_generic|e]. Eşsiz harikaların çoğu, inşaat tamamlandıktan sonra 8 aşamalı [tv_wonder_ceremony|e] boyunca otomatik olarak ilerler; birkaçının bunun yerine kendi özel manuel törenleri vardır."
 game_concept_tv_wonder_unique_europedia_desc: "Benzersiz bir harika, kampanyanın başlangıcından itibaren tek bir gerçek dünya konumuna bağlıdır ve yalnızca bu konumu gerçekten kontrol eden ülke onu inşa edebilir; [tv_wonder_generic|e]'te olduğu gibi ücretsiz yerleşim seçeneği yoktur. Bu tarihsel sabitliğin karşılığında, modun 136 benzersiz harikasından 134'ü, bittiğinde kalıcı ödüllere ulaşmak için başka oyuncu girdisine ihtiyaç duymadan, tek tip, otomatik sekiz aşamalı [tv_wonder_ceremony|e]'i paylaşıyor. Pharos Deniz Feneri ve Ayasofya tek istisnadır; her biri kendi özel, çok adımlı ritüelini yerine getirir."

 game_concept_tv_wonder_domestic_support: "Yurtiçi Destek"
 game_concept_tv_wonder_domestic_support_desc: "Büyük bir Büyük Projeyi sürdürmek için seçkinlerin ve halkın istekliliğini temsil eden bir [tv_wonder_construction|e] kaynağı. İlk tartışmayı bitirmek için 100'e ulaşın; destek 200'e kadar saklanabilir ve tartışma bittikten sonra azalır."

 game_concept_tv_wonder_scale_competence: "Ölçek Yetkinliği"
 game_concept_tv_wonder_scale_competence_desc: "Seçilen alanın, tasarımı garip bir şekle sokmadan projenin amaçlanan boyutunu, eksenlerini, temellerini ve kamusal yaklaşımını ne kadar iyi taşıyabileceğini gösteren bir [tv_wonder_survey|e] okuması. Maksimum Büyük Proje seviyesini %20, %40, %60, %80 ve %100 olarak belirler; seviye 6 ise %100 gerektirir."

 game_concept_tv_wonder_organization_competence: "Organizasyon Yetkinliği"
 game_concept_tv_wonder_organization_competence_desc: "İşçi kadrolarının, ustabaşıların, atölyelerin ve inşaat aşamalarının birbiriyle yarışan birçok sipariş yerine tek bir planı yanıtlamak için ne kadar temiz bir şekilde yapılabileceğine dair bir [tv_wonder_survey|e] okuması. Maksimum Büyük Proje Çalışma Sahası seviyesini 0'dan 20'ye kadar doğrusal olarak ayarlar."

 game_concept_tv_wonder_logistics_competence: "Lojistik Yetkinliği"
 game_concept_tv_wonder_logistics_competence_desc: "Duvarcıların ihtiyaç duyduğu anda [tv_wonder_survey|e]'in sahaya ulaşıp ulaşmayacağını belirleyen, yollar, arabalar, limanlar, köprüler ve devir noktaları için bir [tv_wonder_materials|e] okuması."

