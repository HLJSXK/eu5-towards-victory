l_english:
 tv_engineering_department_standalone.1.t: "[tv_wonder_construction|E]：The Engineering Department"
 tv_engineering_department_standalone.1.d: "Your country now has an Engineering Department, the institution behind every Great Project it may undertake.\n\nAppoint a Great Engineer to begin. They first develop a #high Conception#! for a feasible project, which your court then weighs in domestic #high Debate#!. A #high Survey#! confirms the chosen site, then #high Construction#! itself begins, raising the project through four parts to its final level. Completion is marked by a #high Ceremony#! that grants a lasting reward.\n\nOpen the Engineering Department panel at any time to check progress or appoint a Great Engineer."
 tv_engineering_department_standalone.1.a: "Understood."
 tv_engineering_department_standalone.1.a.tt: "Establishes #G Engineering Department#!."
