 tv_engineering_department.7000.t:0 "[tv_wonder_construction|E]：The Streets Applaud the Site"
 tv_engineering_department.7000.d:0 "A few visible successes at the fence turn curiosity into pride. Guild elders lend names, neighbors stop treating the works as a royal vanity, and the project gains a sharper claim on [tv_wonder_domestic_support|E]."
 tv_engineering_department.7000.a:0 "Lets the guild elders' new goodwill carry the work forward."
 tv_engineering_department.7001.t:0 "[tv_wonder_construction|E]：A Wider Line on the Earth"
 tv_engineering_department.7001.d:0 "New measurements reveal ground that can bear a broader footprint. What had looked like ambition on parchment now has a tolerable foundation, and [tv_wonder_scale_competence|E] jumps forward."
 tv_engineering_department.7001.a:0 "Lays claim to the broader ground the survey just proved."
 tv_engineering_department.7002.t:0 "[tv_wonder_construction|E]：Names and Orders Fall Into Place"
 tv_engineering_department.7002.d:0 "The yard wakes under new rosters. Crews know where to stand, clerks know which tally matters, and [tv_wonder_organization_competence|E] rises because confusion has fewer places to hide."
 tv_engineering_department.7002.a:0 "We lock the new rosters in before confusion finds its way back."
 tv_engineering_department.7003.t:0 "[tv_wonder_construction|E]：Roads and Carts Find Their Rhythm"
 tv_engineering_department.7003.d:0 "A better route links road, water, storeyard, and scaffold. The first convoy to use it arrives almost embarrassingly on time, and [tv_wonder_logistics_competence|E] surges."
 tv_engineering_department.7003.a:0 "Keep those carts rolling on time!"
 tv_engineering_department.7004.t:0 "[tv_wonder_construction|E]：Stone Rises Past the Mark"
 tv_engineering_department.7004.d:0 "The active part rises past its mark before the light fails. No single miracle explains it; the lifts, joints, and hands simply meet at the right hour, pushing [tv_wonder_construction|E] progress ahead."
 tv_engineering_department.7004.a:0 "Lets the lifts press on past the mark."
 tv_engineering_department.7005.t:0 "[tv_wonder_construction|E]：Street Talk Turns"
 tv_engineering_department.7005.d:0 "The noise around the site softens. It is not acclaim, but it is permission enough for carts to pass and arguments to end sooner; [tv_wonder_domestic_support|E] rises by a useful margin."
 tv_engineering_department.7005.a:0 "Lets the carts through and the arguments die down."
 tv_engineering_department.7006.t:0 "[tv_wonder_construction|E]：The Measure Is Corrected"
 tv_engineering_department.7006.d:0 "A cramped angle is redrawn, a service path widened, and the main line of the monument breathes again. The improvement to [tv_wonder_scale_competence|E] is small but real."
 tv_engineering_department.7006.a:0 "Widens the path and lets the design breathe."
 tv_engineering_department.7007.t:0 "[tv_wonder_construction|E]：The Yard Learns Its Rhythm"
 tv_engineering_department.7007.d:0 "A set of missing handovers is repaired. The work is too dry for ceremony, but it keeps tools moving and improves [tv_wonder_organization_competence|E]."
 tv_engineering_department.7007.a:0 "We patch the handover and keep the tools moving."
 tv_engineering_department.7008.t:0 "[tv_wonder_construction|E]：Ruts Find a Better Road"
 tv_engineering_department.7008.d:0 "One bad turn in the supply line is corrected. Fewer carts wait empty, fewer loads arrive cracked, and [tv_wonder_logistics_competence|E] improves."
 tv_engineering_department.7008.a:0 "Straightens the bad turn before more loads crack."
 tv_engineering_department.7009.t:0 "[tv_wonder_construction|E]：Hammers Draw Completion Near"
 tv_engineering_department.7009.d:0 "A stubborn joint finally fits, and the next crew can begin without another month of waiting. [tv_wonder_construction|E] progress moves forward in the most satisfying way: visibly."
 tv_engineering_department.7009.a:0 "At last, it fits!"
 tv_engineering_department.7010.t:0 "[tv_wonder_construction|E]：Treasury Doors Open for Public Backing"
 tv_engineering_department.7010.d:0 "A crowd gathers at the gate, muttering that the wonder eats bread meant for the poor. If the treasury opens its [gold|E] in full view of the street and pays out now, the grumbling would quiet and [tv_wonder_domestic_support|E] would rise - but the coin does not come back."
 tv_engineering_department.7010.a:0 "Pay it out in full view of the crowd."
 tv_engineering_department.7010.b:0 "The ledgers are thin enough without a public handout."
 tv_engineering_department.7011.t:0 "[tv_wonder_construction|E]：Royal Authority Is Pledged for Public Backing"
 tv_engineering_department.7011.d:0 "A local preacher tells his flock the wonder is built on pride, not on any right the crown holds to demand it. Putting the royal [legitimacy|E] behind a written decree would settle the matter and steady [tv_wonder_domestic_support|E], before the sermon spreads further."
 tv_engineering_department.7011.a:0 "Seal the decree and let the crown's word close the matter."
 tv_engineering_department.7011.b:0 "A royal decree over one preacher's grumbling looks like weakness, not strength."
 tv_engineering_department.7012.t:0 "[tv_wonder_construction|E]：Villages Give Way for Public Backing"
 tv_engineering_department.7012.d:0 "The new quarry road runs straight through two villages' common fields. Spending [stability|E] to force the resettlement through would clear the road and lift [tv_wonder_domestic_support|E] among those who want the wonder finished - at the cost of the peace bought with those villages."
 tv_engineering_department.7012.a:0 "Order the resettlement and let the road go through."
 tv_engineering_department.7012.b:0 "Two villages' fields are not worth a shorter cart route."
 tv_engineering_department.7013.t:0 "[tv_wonder_construction|E]：Reputation Is Spent for Public Backing"
 tv_engineering_department.7013.d:0 "Envoys from a rival court call the wonder a vanity project too large for the treasury behind it. Spending [prestige|E] on a lavish reception could change the story they carry home and raise [tv_wonder_domestic_support|E] - but the crown's standing, once spent on flattering guests, is not easily refilled."
 tv_engineering_department.7013.a:0 "Spend on the reception and change what the envoys carry home."
 tv_engineering_department.7013.b:0 "Foreign gossip is not worth spending the crown's standing on."
 tv_engineering_department.7014.t:0 "[tv_wonder_construction|E]：Noble Patience Is Borrowed for Public Backing"
 tv_engineering_department.7014.d:0 "The wonder's masons want a stretch of a noble's hunting run for staging their timber. He will grant it, but only for a favor the crown must count against [estate_satisfaction|E] among the nobles - spent now, it would still lift [tv_wonder_domestic_support|E] once the timber starts moving."
 tv_engineering_department.7014.a:0 "Grant the favor and take the timber ground."
 tv_engineering_department.7014.b:0 "One noble's goodwill is not worth owing him a debt."
 tv_engineering_department.7015.t:0 "[tv_wonder_construction|E]：The Altars Are Asked to Yield for Public Backing"
 tv_engineering_department.7015.d:0 "The wonder's founders want to requisition the parish bell for recasting into fittings. The priest will look away from an empty bell tower, but it costs [estate_satisfaction|E] among the clergy - a price that would still leave [tv_wonder_domestic_support|E] better off than an unfinished scaffold."
 tv_engineering_department.7015.a:0 "Ask properly, and let the bell go to the foundry."
 tv_engineering_department.7015.b:0 "An empty bell tower will draw more talk than the fittings are worth."
 tv_engineering_department.7016.t:0 "[tv_wonder_construction|E]：The Market Lends Its Streets for Public Backing"
 tv_engineering_department.7016.d:0 "The wonder's supply carts keep blocking the market square on delivery days. The guild masters will reroute their own stalls around the carts, but it draws down [estate_satisfaction|E] among the burghers - a cost that would still buy back some [tv_wonder_domestic_support|E] once the square stops fighting the carts."
 tv_engineering_department.7016.a:0 "Ask the guilds directly and let the carts through."
 tv_engineering_department.7016.b:0 "Fining the carters is simpler than asking the guilds for favors."
 tv_engineering_department.7017.t:0 "[tv_wonder_construction|E]：Village Shoulders Are Borrowed for Public Backing"
 tv_engineering_department.7017.d:0 "The overseer wants the corvee gangs held past the harvest to finish the foundations before the frost. The village elders will agree, but it costs [estate_satisfaction|E] among the peasants - spent now, it would still leave [tv_wonder_domestic_support|E] higher than a foundation left half-dug through winter."
 tv_engineering_department.7017.a:0 "Say it plainly and hold the gangs past the harvest."
 tv_engineering_department.7017.b:0 "The harvest cannot wait on the foundations."
 tv_engineering_department.7018.t:0 "[tv_wonder_construction|E]：The Site Gives Stone and Space for Public Backing"
 tv_engineering_department.7018.d:0 "The masons say the site is too cramped to raise the next course without razing the tenement row beside it. Ordering it outright would draw down [development|E] at the site as the buildings come apart, but would let the work - and [tv_wonder_domestic_support|E] with it - move forward again."
 tv_engineering_department.7018.a:0 "Order the row razed and widen the site."
 tv_engineering_department.7018.b:0 "A cramped site is easier to live with than a street of evicted tenants."
 tv_engineering_department.7019.t:0 "[tv_wonder_construction|E]：Local Trade Is Bent Toward the Works for Public Backing"
 tv_engineering_department.7019.d:0 "Local carters and stonecutters have been pulled off their usual trade to keep the site supplied. Letting this continue would bleed [prosperity|E] at the site as ordinary business thins out - but the steadier deliveries would still be seen as [tv_wonder_domestic_support|E] worth having."
 tv_engineering_department.7019.a:0 "Let the local trade keep bending toward the works."
 tv_engineering_department.7019.b:0 "The town needs its ordinary trade more than the site needs faster deliveries."
 tv_engineering_department.7020.t:0 "[tv_wonder_construction|E]：Capital Works Are Reassigned for Public Backing"
 tv_engineering_department.7020.d:0 "The capital's own bridge repairs have stalled because their masons were pulled onto the wonder. Keeping them there would cost [development|E] in the capital as the bridge sits unfinished, but it would keep the wonder's progress - and [tv_wonder_domestic_support|E] - moving."
 tv_engineering_department.7020.a:0 "Keep the masons on the wonder and let the bridge wait."
 tv_engineering_department.7020.b:0 "The capital's own bridge cannot wait on the wonder's schedule."
 tv_engineering_department.7021.t:0 "[tv_wonder_construction|E]：The Capital's Markets Are Turned for Public Backing"
 tv_engineering_department.7021.d:0 "The wonder's agents are buying up capital timber and stone at prices the ordinary market cannot match. Letting the buying continue would drain [prosperity|E] in the capital as trade thins around the site, but it would keep the works supplied and [tv_wonder_domestic_support|E] with them."
 tv_engineering_department.7021.a:0 "Let the buying continue and feed the site."
 tv_engineering_department.7021.b:0 "The capital's own markets should not be bled dry for one project."
 tv_engineering_department.7022.t:0 "[tv_wonder_construction|E]：Labor Is Driven Harder for Public Backing"
 tv_engineering_department.7022.d:0 "The overseer wants the night shift doubled to make up lost days from the last frost. Ordering it would wear down the laboring [population|E] at the site as the extra hours take their toll, but it would push the work forward and lift [tv_wonder_domestic_support|E] with it."
 tv_engineering_department.7022.a:0 "Double the shifts and drive the work forward."
 tv_engineering_department.7022.b:0 "Worn-out laborers build slower than rested ones."
 tv_engineering_department.7023.t:0 "[tv_wonder_construction|E]：Treasury Doors Open for A Broader Design"
 tv_engineering_department.7023.d:0 "The chief mason lays a wider footing plan on the treasurer's desk, claiming the ground will take it if extra courses go in before the autumn rains. The treasurer can release the gold for the added stone and hands now, or the plan waits for next year's survey."
 tv_engineering_department.7023.a:0 "Release the gold and let the masons lay the wider footing before the rains."
 tv_engineering_department.7023.b:0 "Hold the coin back; the rains will still be there next spring."
 tv_engineering_department.7024.t:0 "[tv_wonder_construction|E]：Royal Authority Is Pledged for A Broader Design"
 tv_engineering_department.7024.d:0 "The surveyor's stakes stop short at a neighbor's fence line, and the neighbor refuses to let them pass. A royal writ would settle the boundary today, but invoking the crown's name over a disputed hedge will not go unnoticed."
 tv_engineering_department.7024.a:0 "Send the writ and put the crown's name behind the wider boundary."
 tv_engineering_department.7024.b:0 "Let the fence stand; the crown's name is not spent on a hedge dispute."
 tv_engineering_department.7025.t:0 "[tv_wonder_construction|E]：Villages Give Way for A Broader Design"
 tv_engineering_department.7025.d:0 "The wider plan runs straight through a hamlet's grazing common. Moving the boundary stones through the village now would settle the survey question, but the households will not forget who moved them."
 tv_engineering_department.7025.a:0 "Move the stones and let the survey settle on the larger footprint."
 tv_engineering_department.7025.b:0 "Leave the common as it stands; a resentful village is not worth a wider base."
 tv_engineering_department.7026.t:0 "[tv_wonder_construction|E]：Reputation Is Spent for A Broader Design"
 tv_engineering_department.7026.d:0 "A foreign master mason offers to certify the wider design, but only if the court's name is put forward as his patron in his own guild's records back home. The endorsement would settle the sizing question here; the asking is public and cannot be unspent."
 tv_engineering_department.7026.a:0 "Grant the endorsement and take the master's word on the wider footprint."
 tv_engineering_department.7026.b:0 "Withhold the court's name; a foreign guild's ledger is not the place to spend it."
 tv_engineering_department.7027.t:0 "[tv_wonder_construction|E]：Noble Patience Is Borrowed for A Broader Design"
 tv_engineering_department.7027.d:0 "The wider footing plan crosses ground a local baron has long used for his hunt. Asking him to hold his tongue while the surveyors finish would prove the larger scale sound, but noble patience spent here is patience he will expect returned."
 tv_engineering_department.7027.a:0 "Ask the baron's patience and let the surveyors finish across his hunting ground."
 tv_engineering_department.7027.b:0 "Route around the baron's ground; his goodwill is not worth spending on a survey line."
 tv_engineering_department.7028.t:0 "[tv_wonder_construction|E]：The Altars Are Asked to Yield for A Broader Design"
 tv_engineering_department.7028.d:0 "The wider plan calls for a corner of consecrated ground the parish has held since before living memory. The priests would allow a survey across it if asked properly, but asking clergy to yield hallowed ground for a scaffold line is a favor spent, not lent."
 tv_engineering_department.7028.a:0 "Ask the priests to yield the corner and confirm the wider survey."
 tv_engineering_department.7028.b:0 "Keep the survey inside the old boundary; consecrated ground is not the place to test."
 tv_engineering_department.7029.t:0 "[tv_wonder_construction|E]：The Market Lends Its Streets for A Broader Design"
 tv_engineering_department.7029.d:0 "The wider footprint would swallow the lane the wool merchants use on market days. The guild aldermen would grant a detour if asked, but burghers who lend their streets to a building site remember the inconvenience longer than the survey does."
 tv_engineering_department.7029.a:0 "Ask the aldermen for the detour and confirm the wider footprint over the lane."
 tv_engineering_department.7029.b:0 "Leave the merchants' lane alone; the market's goodwill is not spent on a scaffold line."
 tv_engineering_department.7030.t:0 "[tv_wonder_construction|E]：Village Shoulders Are Borrowed for A Broader Design"
 tv_engineering_department.7030.d:0 "The foreman says the wider footing can be proved sound within the week, if the nearby village turns out its hands for the digging instead of tending their own fields. The village would answer to the reeve, but a levy called at planting season is not forgotten by autumn."
 tv_engineering_department.7030.a:0 "Call the village levy and dig the wider footing before the week is out."
 tv_engineering_department.7030.b:0 "Let the village keep to its fields; the foreman can wait for hired hands instead."
 tv_engineering_department.7031.t:0 "[tv_wonder_construction|E]：The Site Gives Stone and Space for A Broader Design"
 tv_engineering_department.7031.d:0 "The only way to square the wider footprint is to pull down a row of workshops already standing at the edge of the site. Their stone and their footing would go straight into the new plan, but tearing down what the site has already built is not a thing undone."
 tv_engineering_department.7031.a:0 "Pull down the row and fold its stone into the wider footprint."
 tv_engineering_department.7031.b:0 "Leave the workshops standing; the site can grow some other direction."
 tv_engineering_department.7032.t:0 "[tv_wonder_construction|E]：Local Trade Is Bent Toward the Works for A Broader Design"
 tv_engineering_department.7032.d:0 "The timber merchants at the site have the stock and the wagons to haul fill for the wider footing today, if their ordinary trade is set aside for the crown's contract instead. The site's markets would answer to the works, but a trade route bent toward one buyer does not snap back on its own."
 tv_engineering_department.7032.a:0 "Bend the local trade to the works and haul the fill for the wider footprint."
 tv_engineering_department.7032.b:0 "Leave the merchants to their ordinary trade; the fill can be sourced another way."
 tv_engineering_department.7033.t:0 "[tv_wonder_construction|E]：Capital Works Are Reassigned for A Broader Design"
 tv_engineering_department.7033.d:0 "The capital's own road menders and hall-wrights are the only crews free to run the confirming survey this month. Pulling them off the capital's own repairs would settle the wider footprint question, but the capital's streets will show the gap they left."
 tv_engineering_department.7033.a:0 "Reassign the capital's crews and let them confirm the wider footprint."
 tv_engineering_department.7033.b:0 "Leave the capital's repairs alone; the survey can wait for idle hands elsewhere."
 tv_engineering_department.7034.t:0 "[tv_wonder_construction|E]：The Capital's Markets Are Turned for A Broader Design"
 tv_engineering_department.7034.d:0 "The capital's guildhalls offer to underwrite the confirming survey out of this season's trade takings, provided the coin is drawn before the winter fairs close their books. The capital's markets would prove the wider footprint sound, but a season's takings turned toward one wonder is a season the guildhalls will want answered for."
 tv_engineering_department.7034.a:0 "Draw on the capital's trade takings and confirm the wider footprint before the fairs close."
 tv_engineering_department.7034.b:0 "Leave the guildhalls' books alone; the survey can wait for the treasury instead."
 tv_engineering_department.7035.t:0 "[tv_wonder_construction|E]：Labor Is Driven Harder for A Broader Design"
 tv_engineering_department.7035.d:0 "The foreman says the wider footing can be proved this month if the crews already on site work through their rest days instead of resting between shifts. The survey would settle the larger design, but laborers driven past their ordinary pace do not all stay laborers for long."
 tv_engineering_department.7035.a:0 "Drive the crews through their rest days and settle the wider footing this month."
 tv_engineering_department.7035.b:0 "Let the crews keep their rest days; the survey can wait for a slower pace."
 tv_engineering_department.7036.t:0 "[tv_wonder_construction|E]：Treasury Doors Open for Sharper Orders"
 tv_engineering_department.7036.d:0 "The site foreman wants a proper clerk of works to redraw the shift boards and post them where crews can actually read them. The treasury can furnish the man and his ink for a price, and [tv_wonder_organization_competence|E] would follow the new boards."
 tv_engineering_department.7036.a:0 "We hire the clerk and post the new boards today."
 tv_engineering_department.7036.b:0 "The old boards have lasted this long; they can last a little longer."
 tv_engineering_department.7037.t:0 "[tv_wonder_construction|E]：Royal Authority Is Pledged for Sharper Orders"
 tv_engineering_department.7037.d:0 "Two guild crews at the site refuse to take orders from each other's foremen, and the argument has stalled the morning shift twice this week. Only a writ carrying the crown's [legitimacy|E] would settle precedence between them, and [tv_wonder_organization_competence|E] would follow once the argument ends."
 tv_engineering_department.7037.a:0 "The writ is drafted and sealed; the crews answer to it or answer to no one."
 tv_engineering_department.7037.b:0 "The crown's word is not spent settling which mason curses louder."
 tv_engineering_department.7038.t:0 "[tv_wonder_construction|E]：Villages Give Way for Sharper Orders"
 tv_engineering_department.7038.d:0 "Conscripted village labor was drawn up on an old schedule that never accounted for the harvest, and half the crews walk off when their fields need them. Forcing the rota through over local objections would draw down the country's [stability|E], but the crews would finally keep to fixed hours, and [tv_wonder_organization_competence|E] would follow."
 tv_engineering_department.7038.a:0 "We push the rota through; the harvest can wait on the wonder for once."
 tv_engineering_department.7038.b:0 "Forcing the issue now only trades one shortage for a worse one."
 tv_engineering_department.7039.t:0 "[tv_wonder_construction|E]：Reputation Is Spent for Sharper Orders"
 tv_engineering_department.7039.d:0 "The master masons will not answer to the young overseer sent to reorganize their shifts, and they say so within earshot of the whole yard. Only a name backed by the court's [prestige|E] carries enough weight to make them fall in line, and [tv_wonder_organization_competence|E] would follow their compliance."
 tv_engineering_department.7039.a:0 "We lend the overseer the court's name; the masons answer to that if nothing else."
 tv_engineering_department.7039.b:0 "A young overseer's authority should be earned on the yard, not borrowed from the palace."
 tv_engineering_department.7040.t:0 "[tv_wonder_construction|E]：Noble Patience Is Borrowed for Sharper Orders"
 tv_engineering_department.7040.d:0 "The neighboring lord offers to lend his own household steward to draw up new crew rosters, a man who has run one manor's shifts for twenty years. Granting the favor its due costs [estate_satisfaction|E] among the nobles, but the steward's rosters would bring [tv_wonder_organization_competence|E]."
 tv_engineering_department.7040.a:0 "We accept the steward and owe the lord his due."
 tv_engineering_department.7040.b:0 "A debt to that particular lord is worth more than tidy rosters."
 tv_engineering_department.7041.t:0 "[tv_wonder_construction|E]：The Altars Are Asked to Yield for Sharper Orders"
 tv_engineering_department.7041.d:0 "The site's shift horns have always followed the cathedral bells, and the bells will not be moved to suit a wonder. Asking the chapter to ring an extra hour to mark shift changes costs [estate_satisfaction|E] among the clergy, but the crews would finally hand over their posts on time, bringing [tv_wonder_organization_competence|E]."
 tv_engineering_department.7041.a:0 "We ask the chapter for the extra bell, whatever grumbling it costs us."
 tv_engineering_department.7041.b:0 "The bells mark God's hours, not a foreman's shift change."
 tv_engineering_department.7042.t:0 "[tv_wonder_construction|E]：The Market Lends Its Streets for Sharper Orders"
 tv_engineering_department.7042.d:0 "Material carts now queue through the market square twice a day, and the guild stallholders lose their best hours to the noise and the mud. Clearing the square for the carts on a fixed schedule costs [estate_satisfaction|E] among the burghers, but the carts would finally arrive on a schedule crews can plan around, bringing [tv_wonder_organization_competence|E]."
 tv_engineering_department.7042.a:0 "We fix the schedule and clear the square, stalls or no stalls."
 tv_engineering_department.7042.b:0 "The market feeds the town before it feeds the wonder."
 tv_engineering_department.7043.t:0 "[tv_wonder_construction|E]：Village Shoulders Are Borrowed for Sharper Orders"
 tv_engineering_department.7043.d:0 "The surrounding villages are asked to send a second rotation of hands before the current crews collapse from doubling up posts. Pulling them off their own plots between planting and harvest costs [estate_satisfaction|E] among the peasants, but a full second rotation would let the site finally run proper shifts, bringing [tv_wonder_organization_competence|E]."
 tv_engineering_department.7043.a:0 "We call up the second rotation and let the fields wait their turn."
 tv_engineering_department.7043.b:0 "Empty fields in autumn cost the country more than a ragged shift schedule."
 tv_engineering_department.7044.t:0 "[tv_wonder_construction|E]：The Site Gives Stone and Space for Sharper Orders"
 tv_engineering_department.7044.d:0 "The staging yard is too cramped for crews to pass each other without stopping work, and the tangle costs an hour every morning. Clearing an adjoining block for a proper yard eats into [development|E] at the site, but crews would finally move without colliding, bringing [tv_wonder_organization_competence|E]."
 tv_engineering_department.7044.a:0 "We tear down the block and give the crews room to move."
 tv_engineering_department.7044.b:0 "The block stays; a cramped yard is cheaper than a demolished one."
 tv_engineering_department.7045.t:0 "[tv_wonder_construction|E]：Local Trade Is Bent Toward the Works for Sharper Orders"
 tv_engineering_department.7045.d:0 "Local carters and porters who used to work the site's own errands have been quietly redirected to hauling wonder materials instead, and the ordinary trade around the works has thinned as a result. Formalizing the arrangement, binding those hands to the wonder's schedule, costs [prosperity|E] at the site, but [tv_wonder_organization_competence|E] would follow from crews who no longer wait on missing carts."
 tv_engineering_department.7045.a:0 "We formalize the arrangement; the carters answer to the wonder's schedule now."
 tv_engineering_department.7045.b:0 "The ordinary trade keeps the site's people fed; the wonder can wait its turn for carts."
 tv_engineering_department.7046.t:0 "[tv_wonder_construction|E]：Capital Works Are Reassigned for Sharper Orders"
 tv_engineering_department.7046.d:0 "The capital's own building works have lent out their foremen to help redraw the wonder's shift rosters, and the loan has left the capital's own projects short-handed. Making the loan permanent costs [development|E] in the capital, but the wonder site would keep a foreman who actually knows how to run a roster, bringing [tv_wonder_organization_competence|E]."
 tv_engineering_department.7046.a:0 "We make the loan permanent; the capital's projects will manage without him."
 tv_engineering_department.7046.b:0 "The capital's own works need their foreman back more than the wonder needs another one."
 tv_engineering_department.7047.t:0 "[tv_wonder_construction|E]：The Capital's Markets Are Turned for Sharper Orders"
 tv_engineering_department.7047.d:0 "Merchants in the capital have had their delivery days quietly reshuffled so that wonder materials clear the harbor first, and the ordinary trade of the capital now waits behind the wonder's carts. Confirming the new order of the harbor costs [prosperity|E] in the capital, but the site would finally receive materials on a schedule crews can build shifts around, bringing [tv_wonder_organization_competence|E]."
 tv_engineering_department.7047.a:0 "We confirm the new order at the harbor; the merchants will adjust in time."
 tv_engineering_department.7047.b:0 "The capital's own trade should not wait behind another city's construction site."
 tv_engineering_department.7048.t:0 "[tv_wonder_construction|E]：Labor Is Driven Harder for Sharper Orders"
 tv_engineering_department.7048.d:0 "The site is short two full crews for the retraining new rosters would require, so the laborers already on hand are asked to double their posts until the new schedule takes hold. Driving the laboring [population|E] at the site this hard for weeks costs them dearly, but the retraining would finally stick, bringing [tv_wonder_organization_competence|E]."
 tv_engineering_department.7048.a:0 "We double the posts for now; the new rosters are worth the strain."
 tv_engineering_department.7048.b:0 "Worn-out crews learn nothing; the retraining can wait for rested hands."
 tv_engineering_department.7049.t:0 "[tv_wonder_construction|E]：Treasury Doors Open for A Clearer Road"
 tv_engineering_department.7049.d:0 "A single narrow ford is backing up every cart bound for the site. The quartermaster wants [gold|E] now, for planking and a paid crew of bridge-wrights, so the [tv_wonder_logistics_competence|E] can move again before the queue grows longer than the road itself."
 tv_engineering_department.7049.a:0 "Pay the bridge-wrights and clear the ford."
 tv_engineering_department.7049.b:0 "The treasury has better uses for that coin than a puddle crossing."
 tv_engineering_department.7050.t:0 "[tv_wonder_construction|E]：Royal Authority Is Pledged for A Clearer Road"
 tv_engineering_department.7050.d:0 "The landholders along the new route refuse to let carts cross their fields without a royal writ. Spending the crown's [legitimacy|E] here would open the gates and let the [tv_wonder_logistics_competence|E] advance, but only on this road, and only today."
 tv_engineering_department.7050.a:0 "Issue the writ and open the fields to the carts."
 tv_engineering_department.7050.b:0 "The crown's word is not spent on every stubborn landholder."
 tv_engineering_department.7051.t:0 "[tv_wonder_construction|E]：Villages Give Way for A Clearer Road"
 tv_engineering_department.7051.d:0 "The old cart track runs straight through a village green, and the road-masters want it widened by moving three houses and a well. The order would advance the [tv_wonder_logistics_competence|E], but it will cost the crown's [stability|E] with those left grumbling."
 tv_engineering_department.7051.a:0 "Give the order, houses and well be damned."
 tv_engineering_department.7051.b:0 "Let the village keep its green; the road can bend around it."
 tv_engineering_department.7052.t:0 "[tv_wonder_construction|E]：Reputation Is Spent for A Clearer Road"
 tv_engineering_department.7052.d:0 "The wagon-guild in the next province owns the only spare draft horses for hire. Its masters will lend them, and let the [tv_wonder_logistics_competence|E] catch up, only as a favor spent from the court's [prestige|E], which is not unlimited."
 tv_engineering_department.7052.a:0 "Call in the favor and put those horses on the road."
 tv_engineering_department.7052.b:0 "Save the court's good name for a debt worth calling in."
 tv_engineering_department.7053.t:0 "[tv_wonder_construction|E]：Noble Patience Is Borrowed for A Clearer Road"
 tv_engineering_department.7053.d:0 "The road-masters have run short of wagons and want the local nobles' own carriage teams put to hauling stone instead of guests. The [tv_wonder_logistics_competence|E] would gain ground, but it would cost [estate_satisfaction|E] among the nobles, who will grumble at the inconvenience."
 tv_engineering_department.7053.a:0 "Requisition the carriages and put them to hauling stone."
 tv_engineering_department.7053.b:0 "Leave the nobles their carriages; find the wagons elsewhere."
 tv_engineering_department.7054.t:0 "[tv_wonder_construction|E]：The Altars Are Asked to Yield for A Clearer Road"
 tv_engineering_department.7054.d:0 "The nearest monastery has the only dry storehouse along the route, and the road-masters want it emptied for grain and tools. Clearing it would help the [tv_wonder_logistics_competence|E] along, but it would cost [estate_satisfaction|E] among the clergy, who will not forget whose wagons filled it."
 tv_engineering_department.7054.a:0 "Empty the storehouse and stack it with supplies."
 tv_engineering_department.7054.b:0 "Leave the monastery's stores untouched."
 tv_engineering_department.7055.t:0 "[tv_wonder_construction|E]：The Market Lends Its Streets for A Clearer Road"
 tv_engineering_department.7055.d:0 "The convoy needs the town's market square to turn its wagons, but that square is also market day. Closing the stalls would move the carts through by noon and help the [tv_wonder_logistics_competence|E], at the cost of [estate_satisfaction|E] among the burghers whose stalls stayed shut."
 tv_engineering_department.7055.a:0 "Close the market and let the wagons through."
 tv_engineering_department.7055.b:0 "The market stays open; the wagons can wait a day."
 tv_engineering_department.7056.t:0 "[tv_wonder_construction|E]：Village Shoulders Are Borrowed for A Clearer Road"
 tv_engineering_department.7056.d:0 "A stretch of the road has turned to mud, and no ox team can pull through it alone. Putting the village's own oxen and backs to the ropes would clear it and help the [tv_wonder_logistics_competence|E], but it would cost [estate_satisfaction|E] among the peasants, who need those oxen for the spring planting."
 tv_engineering_department.7056.a:0 "Put the village's own oxen and backs to the ropes."
 tv_engineering_department.7056.b:0 "Let the peasants keep their oxen for the spring planting."
 tv_engineering_department.7057.t:0 "[tv_wonder_construction|E]：The Site Gives Stone and Space for A Clearer Road"
 tv_engineering_department.7057.d:0 "The staging yard at the site is too cramped for the wagons now arriving daily. Clearing the half-built storehouses at its edge would open space for the [tv_wonder_logistics_competence|E] to work, at the cost of [development|E] at the site already sunk into those storehouses."
 tv_engineering_department.7057.a:0 "Clear the storehouses and widen the yard."
 tv_engineering_department.7057.b:0 "Keep the storehouses; the wagons can queue outside."
 tv_engineering_department.7058.t:0 "[tv_wonder_construction|E]：Local Trade Is Bent Toward the Works for A Clearer Road"
 tv_engineering_department.7058.d:0 "The innkeepers and carters near the site have been told to hold their spare stock for the wonder's convoys first, selling only what is left to everyone else. It would keep the [tv_wonder_logistics_competence|E] fed, but at the cost of [prosperity|E] at the site as local trade thins."
 tv_engineering_department.7058.a:0 "Hold the stock for the convoys first."
 tv_engineering_department.7058.b:0 "Let the town trade as it always has."
 tv_engineering_department.7059.t:0 "[tv_wonder_construction|E]：Capital Works Are Reassigned for A Clearer Road"
 tv_engineering_department.7059.d:0 "The capital's paving crews are halfway through relaying a market street when the road-masters ask for them instead, to firm up the ruts on the route to the site. Reassigning them would push the [tv_wonder_logistics_competence|E] forward, at the cost of [development|E] in the capital, whose street stays half-cobbled."
 tv_engineering_department.7059.a:0 "Pull the crews off the street and send them to the route."
 tv_engineering_department.7059.b:0 "Finish the market street first; the route can wait."
 tv_engineering_department.7060.t:0 "[tv_wonder_construction|E]：The Capital's Markets Are Turned for A Clearer Road"
 tv_engineering_department.7060.d:0 "The granaries nearest the capital's gate are the fastest way to stock the wagons for the route, and the road-masters want them opened. Selling down the reserve would help the [tv_wonder_logistics_competence|E] along, at the cost of [prosperity|E] in the capital as its own markets thin for a season."
 tv_engineering_department.7060.a:0 "Open the granaries and stock the wagons."
 tv_engineering_department.7060.b:0 "Keep the granaries closed against a leaner season."
 tv_engineering_department.7061.t:0 "[tv_wonder_construction|E]：Labor Is Driven Harder for A Clearer Road"
 tv_engineering_department.7061.d:0 "The site's own laborers are the only hands free to unload the backed-up wagons, and the foreman wants them pulled off their regular tasks and onto extra shifts at the ropes. It would move the [tv_wonder_logistics_competence|E] along, but it draws on the laboring [population|E] at the site, worn down by the extra hours."
 tv_engineering_department.7061.a:0 "Pull the laborers onto extra shifts and clear the backlog."
 tv_engineering_department.7061.b:0 "Let the laborers keep to their regular tasks."
 tv_engineering_department.7062.t:0 "[tv_wonder_construction|E]：Treasury Doors Open for A Sudden Advance"
 tv_engineering_department.7062.d:0 "The lifting cranes stand idle every third day for want of paid crews, though the exchequer clerk swears the coin is sitting uncounted in the strongroom. Releasing it now would put ropes back in hand before the frost sets in."
 tv_engineering_department.7062.a:0 "Open the strongroom and spend the [gold|E] on double shifts, buying [tv_wonder_construction|E] progress."
 tv_engineering_department.7062.b:0 "Leave the strongroom sealed; the crews wait on the ordinary pay day."
 tv_engineering_department.7063.t:0 "[tv_wonder_construction|E]：Royal Authority Is Pledged for A Sudden Advance"
 tv_engineering_department.7063.d:0 "The masons refuse to cross the disputed boundary stones without a writ bearing the crown's own seal, not a governor's. Putting the sovereign's name on the order would settle the matter today, though every such writ spent on quarrymen is one fewer for court and council."
 tv_engineering_department.7063.a:0 "Seal the writ in the sovereign's name, spending [legitimacy|E] to buy [tv_wonder_construction|E] progress past the boundary stones."
 tv_engineering_department.7063.b:0 "Withhold the royal seal and let the governor argue the boundary himself."
 tv_engineering_department.7064.t:0 "[tv_wonder_construction|E]：Villages Give Way for A Sudden Advance"
 tv_engineering_department.7064.d:0 "Two hamlets sit astride the planned haul road, and their headmen have said no plainly, twice. Ordering them aside would clear the road within the week, at the cost of the quiet the crown has kept with them since the last bad harvest."
 tv_engineering_department.7064.a:0 "Order the hamlets to give way, spending [stability|E] to clear [tv_wonder_construction|E] progress along the haul road."
 tv_engineering_department.7064.b:0 "Reroute the haul road around the hamlets and leave the headmen be."
 tv_engineering_department.7065.t:0 "[tv_wonder_construction|E]：Reputation Is Spent for A Sudden Advance"
 tv_engineering_department.7065.d:0 "The guild master of stonecutters will jump the queue for the wonder's masons only if the court calls in a favor owed since the last state visit. Asking now would move the order to the front of the ledger, but a favor named aloud is a favor spent."
 tv_engineering_department.7065.a:0 "Call in the favor and spend [prestige|E] to move the order forward, buying [tv_wonder_construction|E] progress."
 tv_engineering_department.7065.b:0 "Let the order stand in its turn and save the favor for later."
 tv_engineering_department.7066.t:0 "[tv_wonder_construction|E]：Noble Patience Is Borrowed for A Sudden Advance"
 tv_engineering_department.7066.d:0 "A local lord offers his own household levies to haul stone through the coming month, provided no one mentions that his men were promised the season off after the last muster. His steward is already drafting the roster."
 tv_engineering_department.7066.a:0 "Take the lord's levies, spending nobles' [estate_satisfaction|E] to buy [tv_wonder_construction|E] progress."
 tv_engineering_department.7066.b:0 "Refuse the levies and let the lord's men keep their promised season off."
 tv_engineering_department.7067.t:0 "[tv_wonder_construction|E]：The Altars Are Asked to Yield for A Sudden Advance"
 tv_engineering_department.7067.d:0 "The abbey's almshouse fund sits fat this quarter, and the prior has hinted it could cover scaffolding timber if the crown would only ask outright instead of merely hinting back. Asking outright is the part the chapter will remember."
 tv_engineering_department.7067.a:0 "Ask the prior outright and spend clergy [estate_satisfaction|E] on scaffolding timber, buying [tv_wonder_construction|E] progress."
 tv_engineering_department.7067.b:0 "Let the almshouse fund alone and find the timber elsewhere."
 tv_engineering_department.7068.t:0 "[tv_wonder_construction|E]：The Market Lends Its Streets for A Sudden Advance"
 tv_engineering_department.7068.d:0 "The wagon trains meant for the wonder's site keep tangling with market-day traffic at the same three corners. Closing those streets to trade on delivery days would untangle the route at once, though the stallholders will lose those hours of custom outright."
 tv_engineering_department.7068.a:0 "Close the streets on delivery days, spending burghers' [estate_satisfaction|E] to buy [tv_wonder_construction|E] progress."
 tv_engineering_department.7068.b:0 "Leave the market streets open and let the wagons wait their turn."
 tv_engineering_department.7069.t:0 "[tv_wonder_construction|E]：Village Shoulders Are Borrowed for A Sudden Advance"
 tv_engineering_department.7069.d:0 "The bailiff says the surrounding villages can spare hands for the earthworks, but only the same hands already owed to the autumn ditching that keeps their own fields from flooding. Drafting them now means the ditching waits."
 tv_engineering_department.7069.a:0 "Draft the village hands for the earthworks, spending peasants' [estate_satisfaction|E] on [tv_wonder_construction|E] progress."
 tv_engineering_department.7069.b:0 "Leave the villages to their ditching and find labor elsewhere."
 tv_engineering_department.7070.t:0 "[tv_wonder_construction|E]：The Site Gives Stone and Space for A Sudden Advance"
 tv_engineering_department.7070.d:0 "The old grain store standing where the west scaffold needs to go is sound enough to keep, but its stone and its footprint would answer both the mason's shortage and the surveyor's complaint in one stroke. Pulling it down is the fast way through."
 tv_engineering_department.7070.a:0 "Pull down the grain store, spending [development|E] at the site to buy [tv_wonder_construction|E] progress."
 tv_engineering_department.7070.b:0 "Leave the grain store standing and find the scaffold room elsewhere."
 tv_engineering_department.7071.t:0 "[tv_wonder_construction|E]：Local Trade Is Bent Toward the Works for A Sudden Advance"
 tv_engineering_department.7071.d:0 "The site's own tavern-keepers and carters have started quietly diverting their custom toward wonder deliveries, since the crews pay in ready coin and the ordinary trade does not. Formalizing that arrangement would speed the deliveries, at the cost of the trade those keepers built their custom on."
 tv_engineering_department.7071.a:0 "Formalize the diversion, spending [prosperity|E] at the site to buy [tv_wonder_construction|E] progress."
 tv_engineering_department.7071.b:0 "Let the local trade run its ordinary course and leave the deliveries as they are."
 tv_engineering_department.7072.t:0 "[tv_wonder_construction|E]：Capital Works Are Reassigned for A Sudden Advance"
 tv_engineering_department.7072.d:0 "The capital's own bridge repair has stalled for lack of stonemasons, and every mason on it is a mason not cutting for the wonder. Reassigning the crew would move the wonder forward at once, and the bridge would simply wait its turn."
 tv_engineering_department.7072.a:0 "Reassign the bridge crew to the wonder, spending [development|E] in the capital on [tv_wonder_construction|E] progress."
 tv_engineering_department.7072.b:0 "Leave the bridge crew where they are and let the bridge finish first."
 tv_engineering_department.7073.t:0 "[tv_wonder_construction|E]：The Capital's Markets Are Turned for A Sudden Advance"
 tv_engineering_department.7073.d:0 "The capital's grain factors have offered to sell their surplus straight to the wonder's stores at a fair price, provided the crown lets them post the sale in the main square as proof of royal favor. It would feed the crews through the lean month, and it would visibly bend the market toward one buyer."
 tv_engineering_department.7073.a:0 "Let the factors post the sale, spending [prosperity|E] in the capital to buy [tv_wonder_construction|E] progress."
 tv_engineering_department.7073.b:0 "Decline the public sale and buy the crews' grain through the usual channels."
 tv_engineering_department.7074.t:0 "[tv_wonder_construction|E]：Labor Is Driven Harder for A Sudden Advance"
 tv_engineering_department.7074.d:0 "The overseer proposes running the site's own crews through the night shift instead of waiting on fresh hands from the recruiter, since the torches and the will are both already there. It would clear the backlog by dawn, though the same men would be back at first light with no rest between."
 tv_engineering_department.7074.a:0 "Order the night shift, spending the laboring [population|E] at the site to buy [tv_wonder_construction|E] progress."
 tv_engineering_department.7074.b:0 "Send the crews to their beds and wait for fresh hands from the recruiter."
 tv_engineering_department.7075.t:0 "[tv_wonder_construction|E]：Opinion at the Scaffold Wavers"
 tv_engineering_department.7075.d:0 "A public demonstration at the site draws a crowd that may become loyal spectators or offended critics. The scaffolds wait while rumor decides whether [tv_wonder_domestic_support|E] has been helped or harmed."
 tv_engineering_department.7075.a:0 "Lets the demonstration speak for itself."
 tv_engineering_department.7076.t:0 "[tv_wonder_construction|E]：The Plan Outgrows the Page"
 tv_engineering_department.7076.d:0 "A bold adjustment pulls the plan beyond its old limits. It may become the decision that made the monument grand, or the note future clerks underline in red."
 tv_engineering_department.7076.a:0 "Pushes the design past its old limits."
 tv_engineering_department.7077.t:0 "[tv_wonder_construction|E]：Orders Change Under the Awning"
 tv_engineering_department.7077.d:0 "A new chain of command is imposed under the awnings. It may discipline the yard or merely teach every foreman a new way to argue."
 tv_engineering_department.7077.a:0 "We push the new chain of command through the yard."
 tv_engineering_department.7078.t:0 "[tv_wonder_construction|E]：The Route Turns Through Mud"
 tv_engineering_department.7078.d:0 "A risky route promises to shorten the supply line. If the weather holds it will be praised as foresight; if it fails, everyone will remember who ordered the turn."
 tv_engineering_department.7078.a:0 "Take the shorter road!"
 tv_engineering_department.7079.t:0 "[tv_wonder_construction|E]：A New Method Hangs in the Air"
 tv_engineering_department.7079.d:0 "A faster method is tried on the active part. It may save the month or force the next crew to repair a beautiful mistake."
 tv_engineering_department.7079.a:0 "Tries the faster method on the active section."
 tv_engineering_department.7080.t:0 "[tv_wonder_construction|E]：Public Doubt or Silver Runs Thin"
 tv_engineering_department.7080.d:0 "Workers downed their tools this morning, muttering that the wonder is bleeding the crown's silver dry. The foreman calmed them with a promise of bonus wages, a promise the treasury must now either honor or break in front of the crowd."
 tv_engineering_department.7080.a:0 "Break the promised bonus and let the workers' grumbling spread through the site."
 tv_engineering_department.7080.b:0 "Honor the promised bonus and let it come out of the treasury."
 tv_engineering_department.7081.t:0 "[tv_wonder_construction|E]：Public Doubt or Mandate Wears Thin"
 tv_engineering_department.7081.d:0 "A traveling clerk read aloud in the square a pamphlet claiming the crown's writ authorizing the wonder was never lawfully sealed. Whether the doubt over the project stays unanswered or the writ itself gets quietly amended, something must give."
 tv_engineering_department.7081.a:0 "Leave the pamphlet unanswered and let doubts about the wonder keep spreading."
 tv_engineering_department.7081.b:0 "Quietly amend the writ's wording to answer the challenge, and accept the dent to the crown's mandate."
 tv_engineering_department.7082.t:0 "[tv_wonder_construction|E]：Public Doubt or Order Loosens"
 tv_engineering_department.7082.d:0 "Word arrived that levies of stone-haulers for the wonder sparked a scuffle between conscription officers and villagers two days' ride from the site. Quieting it will cost something, either in that district or at the site gates."
 tv_engineering_department.7082.a:0 "Let the site gates absorb the grumbling and leave the district's unrest to burn itself out."
 tv_engineering_department.7082.b:0 "Send troops to settle the district quietly before the unrest spreads further."
 tv_engineering_department.7083.t:0 "[tv_wonder_construction|E]：Public Doubt or Prestige Gathers Dust"
 tv_engineering_department.7083.d:0 "A foreign envoy laughed at the banquet that the wonder crawls slower than a plow-ox, and the jibe is now repeated in every tavern from the port to the palace. Someone must swallow it, either the crown's standing abroad or the townsfolk's pride in what is being built."
 tv_engineering_department.7083.a:0 "Ignore the envoy's jibe and let the townsfolk's pride in the wonder take the sting."
 tv_engineering_department.7083.b:0 "Answer the envoy with a lavish counter-display and spend the crown's standing to silence him."
 tv_engineering_department.7084.t:0 "[tv_wonder_construction|E]：Public Doubt or Noble Murmurs"
 tv_engineering_department.7084.d:0 "The new quarry road was cut straight through Lord Aldric's hunting preserve last week, and his steward has been fuming at the site gate ever since. Either the lord's household is placated, or the commons watching the standoff draw their own conclusions."
 tv_engineering_department.7084.a:0 "Let the standoff drag on unresolved and let the crowd's opinion of the project sour."
 tv_engineering_department.7084.b:0 "Grant the lord's household a formal apology and compensation to settle the matter."
 tv_engineering_department.7085.t:0 "[tv_wonder_construction|E]：Public Doubt or Clerical Unease"
 tv_engineering_department.7085.d:0 "Diggers preparing the foundation trench turned up old burial stones nobody had recorded, and the parish priest is refusing to bless further work until the dead are properly reburied. Either the reburial rites are paid for in full, or the digging continues over the priest's objections."
 tv_engineering_department.7085.a:0 "Overrule the priest and keep digging, letting word of the disturbed graves unsettle the crowd instead."
 tv_engineering_department.7085.b:0 "Pay for full reburial rites to satisfy the priest and the parish."
 tv_engineering_department.7086.t:0 "[tv_wonder_construction|E]：Public Doubt or Merchant Complaints"
 tv_engineering_department.7086.d:0 "Scaffolding poles laid across the high street have blocked cart traffic to the merchants' row for six days running, and the stallholders are demanding someone answer for the lost trade. Either their losses get made good, or the street stays shut and the crowd hears about it."
 tv_engineering_department.7086.a:0 "Leave the merchants uncompensated and let the closed street fuel the crowd's grumbling."
 tv_engineering_department.7086.b:0 "Compensate the merchants' row for the blocked trade out of hand."
 tv_engineering_department.7087.t:0 "[tv_wonder_construction|E]：Public Doubt or Tired Villages"
 tv_engineering_department.7087.d:0 "The harvest levy-masters pulled village hands off the ripening fields to haul timber for the wonder, and the grain now stands uncut while the workers' backs ache at the site. Either the villages get their hands back for the harvest, or the crowd hears how the wonder emptied the fields."
 tv_engineering_department.7087.a:0 "Keep the levied hands at the site and let word of the standing grain reach the crowd."
 tv_engineering_department.7087.b:0 "Release the village hands back to the harvest at once."
 tv_engineering_department.7088.t:0 "[tv_wonder_construction|E]：Public Doubt or The Site Is Hollowed"
 tv_engineering_department.7088.d:0 "The masons' plan calls for the old tannery quarter to be cleared to make room for the wonder's foundations, and half of it came down before anyone thought to ask what would replace it. Either the district is razed as planned, or the plan is scaled back and people start asking why the wonder needed so much room."
 tv_engineering_department.7088.a:0 "Scale back the clearance and let people question why the wonder needed so much ground in the first place."
 tv_engineering_department.7088.b:0 "Finish razing the tannery quarter as planned and worry about what replaces it later."
 tv_engineering_department.7089.t:0 "[tv_wonder_construction|E]：Public Doubt or The Site Cools"
 tv_engineering_department.7089.d:0 "The wonder's staging yard has swallowed the weekly market ground for the third month running, and the stalls that used to fill it have simply stopped coming back. Either the market ground is returned before it is forgotten, or the yard keeps it and the site's trade keeps thinning."
 tv_engineering_department.7089.a:0 "Keep the staging yard where it is and let the site's own market trade go on cooling."
 tv_engineering_department.7089.b:0 "Return the market ground before the weekly stalls forget the way back."
 tv_engineering_department.7090.t:0 "[tv_wonder_construction|E]：Public Doubt or The Capital Gives Up Its Frame"
 tv_engineering_department.7090.d:0 "The city surveyor requisitioned every free mason in the capital for the wonder's stonework, and the half-built almshouse by the old bridge has sat untouched for two months as a result. Either the almshouse waits until the wonder is done, or masons are pulled back to the capital and the site slows to explain why."
 tv_engineering_department.7090.a:0 "Keep every mason on the wonder and let the capital's half-built projects wait."
 tv_engineering_department.7090.b:0 "Recall masons to finish the almshouse and let the site's own crowd wonder at the delay."
 tv_engineering_department.7091.t:0 "[tv_wonder_construction|E]：Public Doubt or The Capital Cools"
 tv_engineering_department.7091.d:0 "Wagons of dressed stone bound for the wonder have been parked along the capital's finest shopping street for a week, and the shopkeepers there say custom has dried up with the road blocked. Either the wagons find another route soon, or they stay and the capital's own trade keeps cooling."
 tv_engineering_department.7091.a:0 "Leave the wagons where they are and let the site's own progress take the blame instead."
 tv_engineering_department.7091.b:0 "Reroute the wagons at once and let the capital's shopping street breathe again."
 tv_engineering_department.7092.t:0 "[tv_wonder_construction|E]：Public Doubt or Laborers Fall"
 tv_engineering_department.7092.d:0 "A scaffold collapse at the site three days ago left a dozen laborers with broken bones, and the rest of the crew is now grumbling that no wage is worth the risk. Either the overseers force the pace and workers start slipping away in the night, or the pace slackens and word of the danger spreads through the town."
 tv_engineering_department.7092.a:0 "Let the danger become common talk in town and keep every laborer at the site."
 tv_engineering_department.7092.b:0 "Force the pace regardless, and accept that frightened workers will slip away in the night."
 tv_engineering_department.7093.t:0 "[tv_wonder_construction|E]：A Narrower Monument or Silver Runs Thin"
 tv_engineering_department.7093.d:0 "The site paymaster opens the strongbox and finds it lighter than the ledger claims. Someone has already spent coin that was never counted, and the shortfall will be made good either in [tv_wonder_scale_competence|E] or in [gold|E]."
 tv_engineering_department.7093.a:0 "Shrink the design to match what the chest can still afford."
 tv_engineering_department.7093.b:0 "Cover the shortfall from the treasury and keep building at scale."
 tv_engineering_department.7094.t:0 "[tv_wonder_construction|E]：A Narrower Monument or Mandate Wears Thin"
 tv_engineering_department.7094.d:0 "A rival claimant has begun whispering that no charter permits a monument this size. The clerks say the matter can be settled quietly, but not without cost to [tv_wonder_scale_competence|E] or to [legitimacy|E]."
 tv_engineering_department.7094.a:0 "Quietly withdraw the largest claims from the charter."
 tv_engineering_department.7094.b:0 "Have the crown reaffirm the charter in full and answer the whispers directly."
 tv_engineering_department.7095.t:0 "[tv_wonder_construction|E]：A Narrower Monument or Order Loosens"
 tv_engineering_department.7095.d:0 "Men from three parishes have downed tools over the widened foundations, blocking the road with carts. The bailiff can disperse them, but only by giving ground somewhere - either the [tv_wonder_scale_competence|E] of the plan or the [stability|E] of the district."
 tv_engineering_department.7095.a:0 "Narrow the foundations back to the original line and send the men home satisfied."
 tv_engineering_department.7095.b:0 "Send in armed men to clear the road and keep the wider foundations."
 tv_engineering_department.7096.t:0 "[tv_wonder_construction|E]：A Narrower Monument or Prestige Gathers Dust"
 tv_engineering_department.7096.d:0 "The heralds who were to proclaim the monument abroad have gone unpaid for two months and now refuse to travel. Someone must be satisfied at once, whether that means trimming the [tv_wonder_scale_competence|E] of the design or spending down the crown's [prestige|E] to buy their silence."
 tv_engineering_department.7096.a:0 "Announce a smaller, cheaper monument and let the heralds carry that word instead."
 tv_engineering_department.7096.b:0 "Pay the heralds from the crown's own name and reputation."
 tv_engineering_department.7097.t:0 "[tv_wonder_construction|E]：A Narrower Monument or Noble Murmurs"
 tv_engineering_department.7097.d:0 "A baron's steward has counted the timber requisitioned from his lord's forests and finds twice what was agreed. The lord will accept either a smaller cut going forward, shrinking the [tv_wonder_scale_competence|E] of the plan, or a formal apology and further concessions to [estate_satisfaction|E] among the nobles."
 tv_engineering_department.7097.a:0 "Cut future timber quotas and scale the design down to match."
 tv_engineering_department.7097.b:0 "Send a formal apology and further grants to the baron's house."
 tv_engineering_department.7098.t:0 "[tv_wonder_construction|E]：A Narrower Monument or Clerical Unease"
 tv_engineering_department.7098.d:0 "A bishop has learned that the wider nave design will swallow the chapter's old burial ground. He will not bless the works again unless the plan is cut back, or unless the chapter's grievances toward [estate_satisfaction|E] among the clergy are answered in full."
 tv_engineering_department.7098.a:0 "Redraw the nave to spare the burial ground."
 tv_engineering_department.7098.b:0 "Grant the chapter new privileges to answer their grievance."
 tv_engineering_department.7099.t:0 "[tv_wonder_construction|E]：A Narrower Monument or Merchant Complaints"
 tv_engineering_department.7099.d:0 "The wool merchants report that the widened road to the site has cut straight through their warehouse row, and goods now sit rotting at the crossroads. Either the road narrows back down, trimming the [tv_wonder_scale_competence|E] of the whole approach, or the crown compensates [estate_satisfaction|E] among the burghers outright."
 tv_engineering_department.7099.a:0 "Narrow the approach road and spare the warehouses."
 tv_engineering_department.7099.b:0 "Pay the merchants their losses and keep the wider road."
 tv_engineering_department.7100.t:0 "[tv_wonder_construction|E]：A Narrower Monument or Tired Villages"
 tv_engineering_department.7100.d:0 "Word comes that a village near the quarry has buried three men this month, worked past dark on the enlarged order. The reeve says the corvee must be cut back, unless the crown would rather answer for [estate_satisfaction|E] among the peasants with grain and silver instead of shrinking [tv_wonder_scale_competence|E]."
 tv_engineering_department.7100.a:0 "Cut the corvee order back to what the village can bear."
 tv_engineering_department.7100.b:0 "Send grain and silver to the village and keep the corvee as ordered."
 tv_engineering_department.7101.t:0 "[tv_wonder_construction|E]：A Narrower Monument or The Site Is Hollowed"
 tv_engineering_department.7101.d:0 "The foreman has torn out a row of standing houses at the site to widen the working ground, and the townsfolk are asking what will be built in their place. The answer will either scale the design back, sparing [tv_wonder_scale_competence|E] no ground it does not need, or it will mean clearing further still and losing more of the site's [development|E]."
 tv_engineering_department.7101.a:0 "Halt further clearing and redraw the plan to fit the ground already taken."
 tv_engineering_department.7101.b:0 "Order the clearing to continue and let the site absorb the loss."
 tv_engineering_department.7102.t:0 "[tv_wonder_construction|E]：A Narrower Monument or The Site Cools"
 tv_engineering_department.7102.d:0 "The market that once ringed the building site has been driven off by scaffolding and noise, and the stalls have not come back. The overseer must decide whether to pull the works in closer, giving up some [tv_wonder_scale_competence|E], or let the site's [prosperity|E] keep bleeding out while the market stays banished."
 tv_engineering_department.7102.a:0 "Pull the scaffolding in and let the market return."
 tv_engineering_department.7102.b:0 "Keep the works spread wide and let the site's trade wither."
 tv_engineering_department.7103.t:0 "[tv_wonder_construction|E]：A Narrower Monument or The Capital Gives Up Its Frame"
 tv_engineering_department.7103.d:0 "The masons drafted for the wonder were pulled straight off the capital's own bridge repairs, which now sit half-finished before winter. Someone must give: either the wonder's [tv_wonder_scale_competence|E] shrinks so the masons can go home, or the capital's [development|E] is left to wait out the season unrepaired."
 tv_engineering_department.7103.a:0 "Release the masons back to the capital and scale the wonder down."
 tv_engineering_department.7103.b:0 "Keep the masons at the wonder and let the capital's repairs wait."
 tv_engineering_department.7104.t:0 "[tv_wonder_construction|E]：A Narrower Monument or The Capital Cools"
 tv_engineering_department.7104.d:0 "The capital's own guildhalls have gone quiet, their craftsmen and carters drawn away to feed the wonder's appetite for stone and hands. The council asks plainly whether the design will finally be cut to size, sparing [tv_wonder_scale_competence|E], or whether the capital's [prosperity|E] must go on funding a monument it no longer sees built in its own streets."
 tv_engineering_department.7104.a:0 "Scale the design down and release the guildsmen back to the capital."
 tv_engineering_department.7104.b:0 "Keep the guildsmen at the site and let the capital's trade keep paying for it."
 tv_engineering_department.7105.t:0 "[tv_wonder_construction|E]：A Narrower Monument or Laborers Fall"
 tv_engineering_department.7105.d:0 "A scaffold collapsed on the widened tier last night, and the surgeon says more will fall if the pace against the larger plan does not slow. The overseer can either cut the design back to a pace the crews can survive, sparing [tv_wonder_scale_competence|E], or keep driving the wider work and accept that the laboring [population|E] at the site will keep thinning."
 tv_engineering_department.7105.a:0 "Slow the pace and shrink the plan to what the crews can bear."
 tv_engineering_department.7105.b:0 "Keep the wider work driving forward and accept the toll on the workers."
 tv_engineering_department.7106.t:0 "[tv_wonder_construction|E]：Muddled Rosters or Silver Runs Thin"
 tv_engineering_department.7106.d:0 "The paymaster's strongbox came up short at last night's count, twice, by two different clerks. Either the missing coin is written off against the treasury, or the whole shift roster is torn up and every crew reassigned from nothing. [tv_wonder_organization_competence|E] or [gold|E] will pay for the clerks' arithmetic."
 tv_engineering_department.7106.a:0 "Tear up the shift roster and reassign every crew from scratch."
 tv_engineering_department.7106.b:0 "Write off the missing coin against the treasury and leave the roster as counted."
 tv_engineering_department.7107.t:0 "[tv_wonder_construction|E]：Muddled Rosters or Mandate Wears Thin"
 tv_engineering_department.7107.d:0 "A crier no foreman recognizes read out a forged grant of the site's timber rights to a rival lord, in full hearing of the crews. Chasing the man down and refuting the claim before the assembled workers pulls every foreman off his post for the day. Leaving the forgery unanswered keeps the crews at work, but the claim is already repeated in taverns as fact. [tv_wonder_organization_competence|E] or [legitimacy|E] will carry the forger's lie."
 tv_engineering_department.7107.a:0 "Pull every foreman from his post to hunt down the crier and set the record straight."
 tv_engineering_department.7107.b:0 "Let the forged claim stand unanswered and keep the crews at their work."
 tv_engineering_department.7108.t:0 "[tv_wonder_construction|E]：Muddled Rosters or Order Loosens"
 tv_engineering_department.7108.d:0 "A shoving match at the mess line, over half a bag of spoiled grain, spilled out the gate and into the street before the watch broke it apart. The crews can be reshuffled and fed at staggered hours so the two gangs never meet again, or the watch can make its arrests in the open square to settle the matter for good. [tv_wonder_organization_competence|E] or [stability|E] answers for the spoiled grain."
 tv_engineering_department.7108.a:0 "Reshuffle every mess shift so the two gangs never cross paths again."
 tv_engineering_department.7108.b:0 "Let the watch make its arrests in the open square."
 tv_engineering_department.7109.t:0 "[tv_wonder_construction|E]：Muddled Rosters or Prestige Gathers Dust"
 tv_engineering_department.7109.d:0 "A foreign envoy arrived a full day early and found the honor gate unmanned and the banners still folded in their chest. The duty roster can be torn up on the spot to scrape together a proper welcome, or the envoy can be walked through the site exactly as it stands and report it home as he saw it. [tv_wonder_organization_competence|E] or [prestige|E] pays for the early arrival."
 tv_engineering_department.7109.a:0 "Tear up the duty roster on the spot to scrape together a proper welcome."
 tv_engineering_department.7109.b:0 "Walk the envoy through the site exactly as it stands."
 tv_engineering_department.7110.t:0 "[tv_wonder_construction|E]：Muddled Rosters or Noble Murmurs"
 tv_engineering_department.7110.d:0 "The ox-teams borrowed from a neighboring lord's estate were due back at Michaelmas and are still hauling stone past the deadline. The teams can be sent home on schedule and the hauling crews reorganized to drag the loads by hand, or the oxen can be kept another fortnight while the lord's steward is told to wait. [tv_wonder_organization_competence|E] or the [estate_satisfaction|E] among the nobles carries the overdue oxen."
 tv_engineering_department.7110.a:0 "Send the oxen home on schedule and reorganize the crews to haul by hand."
 tv_engineering_department.7110.b:0 "Keep the oxen another fortnight and tell the lord's steward to wait."
 tv_engineering_department.7111.t:0 "[tv_wonder_construction|E]：Muddled Rosters or Clerical Unease"
 tv_engineering_department.7111.d:0 "The masons kept hammering straight through the relic procession this week, and the chanting could not be heard over the site three streets away. The shift calendar can be redrawn around every feast and procession day from now on, or the procession route can simply be moved and the clergy told the work will not stop for it. [tv_wonder_organization_competence|E] or the [estate_satisfaction|E] among the clergy answers for the noise."
 tv_engineering_department.7111.a:0 "Redraw the shift calendar around every feast and procession day."
 tv_engineering_department.7111.b:0 "Move the procession route and tell the clergy the work will not stop."
 tv_engineering_department.7112.t:0 "[tv_wonder_construction|E]：Muddled Rosters or Merchant Complaints"
 tv_engineering_department.7112.d:0 "A row of site wagons has sat blocking the grain market's loading lane for six days running, and the merchants' guild has stopped sending its clerk to complain in person. The delivery schedule can be torn apart and rebuilt around a longer route that keeps the lane clear, or the wagons can stay put while the guild is left to reroute its own business. [tv_wonder_organization_competence|E] or the [estate_satisfaction|E] among the burghers pays for the blocked lane."
 tv_engineering_department.7112.a:0 "Tear apart the delivery schedule and rebuild it around a longer route."
 tv_engineering_department.7112.b:0 "Leave the wagons where they stand and let the guild reroute itself."
 tv_engineering_department.7113.t:0 "[tv_wonder_construction|E]：Muddled Rosters or Tired Villages"
 tv_engineering_department.7113.d:0 "The corvee gangs due back in their villages for planting are still cutting stone, and word has come that this year's fields go unsown without them. The gangs can be released on schedule and the site's labor shifts rebuilt from whoever is left, or the corvee can be held past its term while the villages make do without hands. [tv_wonder_organization_competence|E] or the [estate_satisfaction|E] among the peasants pays for the unplanted fields."
 tv_engineering_department.7113.a:0 "Release the corvee gangs on schedule and rebuild the site shifts from those left."
 tv_engineering_department.7113.b:0 "Hold the corvee past its term and let the villages make do."
 tv_engineering_department.7114.t:0 "[tv_wonder_construction|E]：Muddled Rosters or The Site Is Hollowed"
 tv_engineering_department.7114.d:0 "A retaining wall gave way overnight, and the nearest dressed stone to hand was the paving already laid along the site's own approach road. The paving can be left where it lies and every free hand pulled off other tasks to quarry fresh stone instead, or the road can simply be torn up again to patch the wall before morning. [tv_wonder_organization_competence|E] or [development|E] at the site pays for the collapsed wall."
 tv_engineering_department.7114.a:0 "Pull every free hand off other tasks to quarry fresh stone instead."
 tv_engineering_department.7114.b:0 "Tear up the approach road again to patch the wall by morning."
 tv_engineering_department.7115.t:0 "[tv_wonder_construction|E]：Muddled Rosters or The Site Cools"
 tv_engineering_department.7115.d:0 "The camp market's bread-sellers packed up and left after last week's pay was handed out three days late and half in clipped coin. Wages can be redrawn onto a stricter, more frequent schedule to lure the sellers back, tearing apart the current pay rota to do it, or the camp can simply go without its market and the laborers can fend for their own meals. [tv_wonder_organization_competence|E] or [prosperity|E] at the site pays for the late wages."
 tv_engineering_department.7115.a:0 "Tear apart the pay rota and redraw it on a stricter schedule to lure the sellers back."
 tv_engineering_department.7115.b:0 "Let the camp go without its market and leave the laborers to fend for meals."
 tv_engineering_department.7116.t:0 "[tv_wonder_construction|E]：Muddled Rosters or The Capital Gives Up Its Frame"
 tv_engineering_department.7116.d:0 "The scaffolding standing ready for the capital's own bridge repair was quietly loaded onto site wagons overnight, and the bridge crew arrived to find their timber gone. The site's own supply runs can be lengthened and its shifts rebuilt around a farther timber source instead, or the capital's bridge can simply wait while its beams finish the wonder first. [tv_wonder_organization_competence|E] or [development|E] in the capital pays for the missing scaffolding."
 tv_engineering_department.7116.a:0 "Lengthen the site's supply runs and rebuild its shifts around a farther timber source."
 tv_engineering_department.7116.b:0 "Let the capital's bridge wait while its beams finish the wonder first."
 tv_engineering_department.7117.t:0 "[tv_wonder_construction|E]：Muddled Rosters or The Capital Cools"
 tv_engineering_department.7117.d:0 "Half the capital's glaziers and joiners have been at the site three weeks running, and the guild hall back home now stands mostly empty at midday. The masters can be rotated home and the site crews rebuilt around whichever apprentices are left, or the masters can simply stay put while the capital's own workshops sit idle a while longer. [tv_wonder_organization_competence|E] or [prosperity|E] in the capital pays for the empty guild hall."
 tv_engineering_department.7117.a:0 "Rotate the masters home and rebuild the site crews from the remaining apprentices."
 tv_engineering_department.7117.b:0 "Keep the masters at the site and let the capital's workshops sit idle."
 tv_engineering_department.7118.t:0 "[tv_wonder_construction|E]：Muddled Rosters or Laborers Fall"
 tv_engineering_department.7118.d:0 "A hoist rope parted this morning when a short-handed crew doubled up on the platform to make the hour, and three men went down with it. The reserve gangs can be pulled off their own tasks and thrown onto the platform tomorrow regardless of what it does to the schedule, or the same crew can be sent back up shorthanded once the injured are carried off. [tv_wonder_organization_competence|E] or the laboring [population|E] at the site pays for the parted rope."
 tv_engineering_department.7118.a:0 "Pull the reserve gangs off their own tasks and throw them onto the platform, schedule be damned."
 tv_engineering_department.7118.b:0 "Send the same shorthanded crew back up once the injured are carried off."
 tv_engineering_department.7119.t:0 "[tv_wonder_construction|E]：Delayed Convoys or Silver Runs Thin"
 tv_engineering_department.7119.d:0 "A bridge over the supply road buckled under the weight of the stone-carts, and half the convoy now sits stranded in the mud below it. The ferrymen at the crossing say they'll raft the wagons over for a price, and somebody is going to pay it one way or another."
 tv_engineering_department.7119.a:0 "Leave the wagons where they sit and route the rest around the broken bridge, whatever it costs the [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7119.b:0 "Pay the ferrymen's price out of the treasury to get the wagons across today, draining [gold|E]."
 tv_engineering_department.7120.t:0 "[tv_wonder_construction|E]：Delayed Convoys or Mandate Wears Thin"
 tv_engineering_department.7120.d:0 "The convoy's outriders were turned back at a neighbor's tollgate, their charter bearing a seal the local lord no longer honors. Someone must decide whether to force the gate open in the crown's name or let the wagons sit outside it."
 tv_engineering_department.7120.a:0 "Turn the convoy back and find a longer route around the disputed tollgate, letting [tv_wonder_logistics_competence|E] slip."
 tv_engineering_department.7120.b:0 "Invoke the crown's authority to force the gate open now, spending [legitimacy|E] on a quarrel not yet settled."
 tv_engineering_department.7121.t:0 "[tv_wonder_construction|E]：Delayed Convoys or Order Loosens"
 tv_engineering_department.7121.d:0 "Villagers have blocked the road with their own carts, refusing to move until the third requisition this season is called off. The convoy cannot pass without either backing down or bringing soldiers to clear the way."
 tv_engineering_department.7121.a:0 "Back down, reroute the convoy around the blockade, and accept the standstill this leaves in [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7121.b:0 "Send soldiers to clear the road by force, and count the cost in [stability|E]."
 tv_engineering_department.7122.t:0 "[tv_wonder_construction|E]：Delayed Convoys or Prestige Gathers Dust"
 tv_engineering_department.7122.d:0 "The convoy's foreman was refused fresh draft horses at a rival court and sent away in front of witnesses. Getting the horses now means calling in favors that shame the court into compliance; not getting them means the wagons crawl the rest of the way."
 tv_engineering_department.7122.a:0 "Send the foreman on with the tired horses he already has, and let the delay tell on [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7122.b:0 "Call in favors publicly to shame the rival court into handing over fresh horses, spending [prestige|E] on it."
 tv_engineering_department.7123.t:0 "[tv_wonder_construction|E]：Delayed Convoys or Noble Murmurs"
 tv_engineering_department.7123.d:0 "The convoy's carters commandeered a noble house's own carriage horses when the wonder's teams came up short, and the household is demanding them back before nightfall. Returning the horses stalls the wagons; keeping them stalls the household's patience."
 tv_engineering_department.7123.a:0 "Return the horses to the noble house tonight and let the wagons wait without them, at the cost of [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7123.b:0 "Keep the borrowed horses working the convoy a while longer, whatever it does to [estate_satisfaction|E] among the nobles."
 tv_engineering_department.7124.t:0 "[tv_wonder_construction|E]：Delayed Convoys or Clerical Unease"
 tv_engineering_department.7124.d:0 "The shortest supply road cuts across monastery land, and the wagons rolled through on a feast day before anyone thought to ask leave. The monks have shut the gate and want the convoy either turned back or answered for."
 tv_engineering_department.7124.a:0 "Turn the wagons back and find another way around the monastery grounds, letting the detour cost [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7124.b:0 "Push the convoy through the gate as planned and let the offense sit with [estate_satisfaction|E] among the clergy."
 tv_engineering_department.7125.t:0 "[tv_wonder_construction|E]：Delayed Convoys or Merchant Complaints"
 tv_engineering_department.7125.d:0 "The convoy parked its wagons across the town's market square overnight to wait out a storm, and the stallholders have not been able to open since. Traders are demanding the square be cleared today, storm or no storm."
 tv_engineering_department.7125.a:0 "Move the wagons out into the weather now and let the storm slow [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7125.b:0 "Hold the wagons in the square a while longer and let the traders' anger fall on [estate_satisfaction|E] among the burghers."
 tv_engineering_department.7126.t:0 "[tv_wonder_construction|E]：Delayed Convoys or Tired Villages"
 tv_engineering_department.7126.d:0 "The same village has had its oxen and carts requisitioned for the convoy three times this month, and the fields are going unplowed. Either the animals go back to the plow or the wagons pull themselves."
 tv_engineering_department.7126.a:0 "Send the oxen back to the fields and let the convoy limp along without them, at the cost of [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7126.b:0 "Requisition the oxen a fourth time and let the village's exhaustion show in [estate_satisfaction|E] among the peasants."
 tv_engineering_department.7127.t:0 "[tv_wonder_construction|E]：Delayed Convoys or The Site Is Hollowed"
 tv_engineering_department.7127.d:0 "A landslide has buried the last stretch of road into the site, and the only quick fix is to tear up the newly laid staging yards for fill and planking. Either the site gives up its own groundwork or the convoy waits outside the slide."
 tv_engineering_department.7127.a:0 "Leave the staging yards intact and let the convoy sit outside the slide, at the cost of [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7127.b:0 "Tear up the newly laid yards for fill and planking to clear the road, spending [development|E] at the site."
 tv_engineering_department.7128.t:0 "[tv_wonder_construction|E]：Delayed Convoys or The Site Cools"
 tv_engineering_department.7128.d:0 "The wagons need the road widened past the site's own worker stalls, and the vendors there have nowhere else to trade. Either the stalls come down to let the convoy through or the wagons squeeze past at a crawl."
 tv_engineering_department.7128.a:0 "Let the wagons squeeze past at a crawl and leave the stalls standing, at the cost of [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7128.b:0 "Clear the vendor stalls to widen the road for the convoy, spending [prosperity|E] at the site."
 tv_engineering_department.7129.t:0 "[tv_wonder_construction|E]：Delayed Convoys or The Capital Gives Up Its Frame"
 tv_engineering_department.7129.d:0 "The capital's own carters and cobblestone crews were pulled off their usual work to push the stalled convoy the last mile into the city. The capital's streets are half-torn and half-idle for it, whether the wagons wait or not."
 tv_engineering_department.7129.a:0 "Send the capital's crews back to their own work and let the convoy stall at the gates, at the cost of [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7129.b:0 "Keep the capital's crews pulled off their streets to finish hauling the wagons in, spending [development|E] in the capital."
 tv_engineering_department.7130.t:0 "[tv_wonder_construction|E]：Delayed Convoys or The Capital Cools"
 tv_engineering_department.7130.d:0 "The convoy commandeered the capital's central market square to store the wonder's stalled cargo, and the caravans that usually trade there have been turned away for a week. Either the cargo moves on and the market reopens, or the square stays a warehouse a while longer."
 tv_engineering_department.7130.a:0 "Move the cargo out at once, however roughly, and take the strain on [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7130.b:0 "Leave the cargo in the square and keep the caravans shut out, spending [prosperity|E] in the capital."
 tv_engineering_department.7131.t:0 "[tv_wonder_construction|E]：Delayed Convoys or Laborers Fall"
 tv_engineering_department.7131.d:0 "With the draft animals spent and no fresh ones to be had, the site's foremen have started putting laborers to the ropes to drag the stranded carts by hand. Either the men keep hauling past exhaustion or the carts stay where they stuck."
 tv_engineering_department.7131.a:0 "Leave the carts stuck where they are rather than work the men further, at the cost of [tv_wonder_logistics_competence|E]."
 tv_engineering_department.7131.b:0 "Keep the laborers hauling on the ropes until the carts move, spending the laboring [population|E] at the site."
 tv_engineering_department.7132.t:0 "[tv_wonder_construction|E]：Lost Progress or Silver Runs Thin"
 tv_engineering_department.7132.d:0 "The stone-cutters' guild has stopped work, unpaid for two months running. Their foreman stands at the gate with a ledger and a closed fist, and someone must open either the yard or the treasury."
 tv_engineering_department.7132.a:0 "Let the cutters walk and let [tv_wonder_construction|E] progress wait."
 tv_engineering_department.7132.b:0 "Pay the arrears in [gold|E] and keep the chisels moving."
 tv_engineering_department.7133.t:0 "[tv_wonder_construction|E]：Lost Progress or Mandate Wears Thin"
 tv_engineering_department.7133.d:0 "Word has reached the council that the site's masons were levied without the customary writ, and a pretender is already citing it as proof the crown rules by whim. Someone must answer for the shortcut - either the work itself, or the mandate that ordered it."
 tv_engineering_department.7133.a:0 "Recall the levy and let [tv_wonder_construction|E] progress fall behind."
 tv_engineering_department.7133.b:0 "Stand by the writ and let it cost the crown [legitimacy|E]."
 tv_engineering_department.7134.t:0 "[tv_wonder_construction|E]：Lost Progress or Order Loosens"
 tv_engineering_department.7134.d:0 "Villagers whose commons were fenced off for the quarry road have blocked the cart track with their own bodies. Either the carts turn back tonight, or soldiers clear the road and the countryside remembers it."
 tv_engineering_department.7134.a:0 "Turn the carts back and let [tv_wonder_construction|E] progress wait."
 tv_engineering_department.7134.b:0 "Send the guard to clear the track and spend the [stability|E] it costs."
 tv_engineering_department.7135.t:0 "[tv_wonder_construction|E]：Lost Progress or Prestige Gathers Dust"
 tv_engineering_department.7135.d:0 "A foreign ambassador toured the site early and found a scaffold half-collapsed over green mortar; his report home is already being drafted. The overseer can halt work to redo it properly, or let the ambassador write what he saw."
 tv_engineering_department.7135.a:0 "Tear down the faulty section and let [tv_wonder_construction|E] progress fall back."
 tv_engineering_department.7135.b:0 "Leave the scaffold standing and let the letter cost the crown [prestige|E]."
 tv_engineering_department.7136.t:0 "[tv_wonder_construction|E]：Lost Progress or Noble Murmurs"
 tv_engineering_department.7136.d:0 "A local lord discovered his hunting preserve marked for the wonder's quarry and rode to court in fury, demanding either the surveyors withdraw or his family's honor be answered for. Someone below must give ground."
 tv_engineering_department.7136.a:0 "Recall the surveyors and let [tv_wonder_construction|E] progress fall behind."
 tv_engineering_department.7136.b:0 "Hold the quarry line and let it cost [estate_satisfaction|E] among the nobles."
 tv_engineering_department.7137.t:0 "[tv_wonder_construction|E]：Lost Progress or Clerical Unease"
 tv_engineering_department.7137.d:0 "Diggers preparing the foundation turned up an old parish boneyard nobody had recorded, and the priests are refusing to bless further work until it is properly reburied. Someone must choose between the shovels and the sacraments."
 tv_engineering_department.7137.a:0 "Halt the diggers until the reburial rite is finished, and let [tv_wonder_construction|E] progress wait."
 tv_engineering_department.7137.b:0 "Order the digging to continue and let it cost [estate_satisfaction|E] among the clergy."
 tv_engineering_department.7138.t:0 "[tv_wonder_construction|E]：Lost Progress or Merchant Complaints"
 tv_engineering_department.7138.d:0 "The merchants' square has been half-swallowed by masonry carts for a week, and the guild masters say another week of this will ruin the autumn fair. Either the carts find a new route tonight, or the fair opens onto a construction yard."
 tv_engineering_department.7138.a:0 "Reroute the carts and let [tv_wonder_construction|E] progress slow."
 tv_engineering_department.7138.b:0 "Keep the carts on the square and let it cost [estate_satisfaction|E] among the burghers."
 tv_engineering_department.7139.t:0 "[tv_wonder_construction|E]：Lost Progress or Tired Villages"
 tv_engineering_department.7139.d:0 "The corvee crews pulled from three villages for this month's push have missed the last dry week for harvest, and the headmen are asking whether their fields or the wonder come first. One of the two must give."
 tv_engineering_department.7139.a:0 "Send the crews back to the fields and let [tv_wonder_construction|E] progress slow."
 tv_engineering_department.7139.b:0 "Keep the crews at the site and let it cost [estate_satisfaction|E] among the peasants."
 tv_engineering_department.7140.t:0 "[tv_wonder_construction|E]：Lost Progress or The Site Is Hollowed"
 tv_engineering_department.7140.d:0 "A retaining wall gave way overnight and buried the half-finished workshops and stores that had grown up around the site. Rebuilding them properly will cost the site something either way - labor pulled from the wonder, or what stands around it."
 tv_engineering_department.7140.a:0 "Pull crews off the wonder to shore up the workshops, and let [tv_wonder_construction|E] progress fall back."
 tv_engineering_department.7140.b:0 "Leave the workshops as rubble and let it cost [development|E] at the site."
 tv_engineering_department.7141.t:0 "[tv_wonder_construction|E]：Lost Progress or The Site Cools"
 tv_engineering_department.7141.d:0 "The peddlers and small workshops that had sprung up to feed the work crews were driven off this week to clear ground for a new stockpile yard, and the site's little economy has gone quiet with them. The stockpile or the site's own trade - one of the two keeps the ground."
 tv_engineering_department.7141.a:0 "Give the ground back to the peddlers and let [tv_wonder_construction|E] progress wait on the stockpile."
 tv_engineering_department.7141.b:0 "Keep the stockpile yard and let it cost [prosperity|E] at the site."
 tv_engineering_department.7142.t:0 "[tv_wonder_construction|E]：Lost Progress or The Capital Gives Up Its Frame"
 tv_engineering_department.7142.d:0 "The capital's own bridge repairs have stalled because every mason and cart in the city was requisitioned for the wonder's latest push. The magistrates want their crews back before the span fails; the site wants them a month longer."
 tv_engineering_department.7142.a:0 "Release the masons back to the capital and let [tv_wonder_construction|E] progress slow."
 tv_engineering_department.7142.b:0 "Keep the masons at the site and let it cost [development|E] in the capital."
 tv_engineering_department.7143.t:0 "[tv_wonder_construction|E]：Lost Progress or The Capital Cools"
 tv_engineering_department.7143.d:0 "Cartloads of dressed stone rolling through the capital's market district have closed two streets for a week, and the shopkeepers there say trade is already moving elsewhere. Either the convoys find a longer route, or the district keeps bleeding custom."
 tv_engineering_department.7143.a:0 "Reroute the convoys the long way and let [tv_wonder_construction|E] progress fall behind."
 tv_engineering_department.7143.b:0 "Keep the convoys on the short route and let it cost [prosperity|E] in the capital."
 tv_engineering_department.7144.t:0 "[tv_wonder_construction|E]：Lost Progress or Laborers Fall"
 tv_engineering_department.7144.d:0 "A fever has gone through the workers' camp, and the physicians say the sick must rest or it will spread to the whole crew. Someone must choose between working them through it and losing the work, or standing them down and losing the workers."
 tv_engineering_department.7144.a:0 "Stand the crews down to recover and let [tv_wonder_construction|E] progress slip."
 tv_engineering_department.7144.b:0 "Work the sick through it and let it cost the laboring [population|E] at the site."
 tv_engineering_department.7145.t:0 "[tv_wonder_construction|E]：A New Gap in the Treasury"
 tv_engineering_department.7145.d:0 "The wonder draws coin faster than the ledgers expected. The treasury can explain the shortage, but explanation does not mint silver."
 tv_engineering_department.7145.a:0 "Stretches the ledgers to cover the gap."
 tv_engineering_department.7146.t:0 "[tv_wonder_construction|E]：Dust on the Royal Seal"
 tv_engineering_department.7146.d:0 "Royal endorsement is stretched over too many compromises. The seal still holds, but it looks thinner."
 tv_engineering_department.7146.a:0 "Lets the royal seal wear a touch thinner."
 tv_engineering_department.7147.t:0 "[tv_wonder_construction|E]：Quiet Towns Are Disturbed"
 tv_engineering_department.7147.d:0 "The construction rhythm presses against ordinary life. Markets open late, villages grumble, and order gives a little ground."
 tv_engineering_department.7147.a:0 "We let the villages grumble and press on regardless."
 tv_engineering_department.7148.t:0 "[tv_wonder_construction|E]：The Court Loses Color"
 tv_engineering_department.7148.d:0 "The court lends color to the works and receives dust in return. Prestige fades in small public jokes and half-finished boasts."
 tv_engineering_department.7148.a:0 "Trades a little shine for a few court jokes."
 tv_engineering_department.7149.t:0 "[tv_wonder_construction|E]：Cold Words at Noble Tables"
 tv_engineering_department.7149.d:0 "Noble households give way once more. The concession is formal and cold, which is often worse than refusal."
 tv_engineering_department.7149.a:0 "Accepts the nobles' cold, formal concession."
 tv_engineering_department.7150.t:0 "[tv_wonder_construction|E]：Frowns Before the Altar"
 tv_engineering_department.7150.d:0 "The sacred calendar bends again for the worksite. The clergy obey, but the obedience has edges."
 tv_engineering_department.7150.a:0 "We accept the clergy's obedience, edges and all."
 tv_engineering_department.7151.t:0 "[tv_wonder_construction|E]：Thinner Ledgers in the Market"
 tv_engineering_department.7151.d:0 "Market business is bent around the project. The burghers can profit from grandeur, but not when every road to it is blocked."
 tv_engineering_department.7151.a:0 "Clear the roads and keep building!"
 tv_engineering_department.7152.t:0 "[tv_wonder_construction|E]：Heavier Backs in the Villages"
 tv_engineering_department.7152.d:0 "Rural shoulders take another load. The project advances, and village patience becomes a thinner thing."
 tv_engineering_department.7152.a:0 "Piles the extra load onto rural shoulders."
 tv_engineering_department.7153.t:0 "[tv_wonder_construction|E]：The Site Gives Up Its Streets"
 tv_engineering_department.7153.d:0 "The site gives up more of its ordinary fabric. A future wonder gains space, while present streets lose use."
 tv_engineering_department.7153.a:0 "Signs away these streets for tomorrow's wonder."
 tv_engineering_department.7154.t:0 "[tv_wonder_construction|E]：The Site Grows Quieter"
 tv_engineering_department.7154.d:0 "The site grows commercially quieter as ordinary exchange is pulled toward the monument. Prosperity can be redirected only so many times before it thins."
 tv_engineering_department.7154.a:0 "We steer the site's trade toward the monument once more."
 tv_engineering_department.7155.t:0 "[tv_wonder_construction|E]：Capital Projects Make Way"
 tv_engineering_department.7155.d:0 "Capital projects make way for the wonder again. The royal city remains grand, but some of its frame is being borrowed."
 tv_engineering_department.7155.a:0 "Lends the capital's own frame to the wonder."
 tv_engineering_department.7156.t:0 "[tv_wonder_construction|E]：Quieter Streets in the Capital"
 tv_engineering_department.7156.d:0 "The capital's markets lose a little brightness as the project draws in credit and goods. The court may call it patriotic; merchants call it slower trade."
 tv_engineering_department.7156.a:0 "Every monument borrows its brightness from somewhere."
 tv_engineering_department.7157.t:0 "[tv_wonder_construction|E]：Names Added to the Injury Roll"
 tv_engineering_department.7157.d:0 "Names are added to the injury rolls. The work continues, but each new mark changes how the laborers look at the stone."
 tv_engineering_department.7157.a:0 "Note the names, and carry on!"
 tv_engineering_department.7158.t:0 "[tv_wonder_construction|E]：Silence at the Treasury Door"
 tv_engineering_department.7158.d:0 "A hard demand from the site leaves the treasury visibly hollow. The monument continues, and the realm pays before it can admire anything."
 tv_engineering_department.7158.a:0 "Empties the treasury and lets the stone go up regardless."
 tv_engineering_department.7159.t:0 "[tv_wonder_construction|E]：Mandate Cracks Before the Site"
 tv_engineering_department.7159.d:0 "The worksite's demands force the crown into an undignified posture. The promise of grandeur now leans on damaged authority."
 tv_engineering_department.7159.a:0 "We let the crown bend so the walls can rise."
 tv_engineering_department.7160.t:0 "[tv_wonder_construction|E]：Order Splinters in the Levy"
 tv_engineering_department.7160.d:0 "A harsher disruption spills past the fence. Officials can name the cause, but they cannot make the country feel settled by naming it."
 tv_engineering_department.7160.a:0 "Lets the unrest run its course beyond the fence."
 tv_engineering_department.7161.t:0 "[tv_wonder_construction|E]：Honor Falters in Public"
 tv_engineering_department.7161.d:0 "A public embarrassment at the site travels faster than any official correction. Honor pays for stone that is not yet standing."
 tv_engineering_department.7161.a:0 "Let them talk!"
 tv_engineering_department.7162.t:0 "[tv_wonder_construction|E]：Noble Patience Is Chiseled Through"
 tv_engineering_department.7162.d:0 "The project cuts into noble patience until courtesy can no longer cover the sound. A monument is a poor guest when it eats inheritance."
 tv_engineering_department.7162.a:0 "Lets the nobles grumble while the masonry advances."
 tv_engineering_department.7163.t:0 "[tv_wonder_construction|E]：Patience Runs Out in the Vestry"
 tv_engineering_department.7163.d:0 "A construction demand tramples too near the altar. The clergy do not forget when piety is treated as open space."
 tv_engineering_department.7163.a:0 "We accept the clergy's cold silence as the price of stone."
 tv_engineering_department.7164.t:0 "[tv_wonder_construction|E]：Anger Reaches the Streets"
 tv_engineering_department.7164.d:0 "Anger reaches the shopfronts as the worksite swallows space, time, and credit. The city hears the monument before it sees it."
 tv_engineering_department.7164.a:0 "Lets the shopfronts grumble while the scaffolding climbs."
 tv_engineering_department.7165.t:0 "[tv_wonder_construction|E]：Rural Anger Will Not Stay Quiet"
 tv_engineering_department.7165.d:0 "Rural anger will not stay quiet after this levy. The wonder's shadow reaches farms that may never see its finished face."
 tv_engineering_department.7165.a:0 "Let the fields bear it!"
 tv_engineering_department.7166.t:0 "[tv_wonder_construction|E]：The Site Falls Back"
 tv_engineering_department.7166.d:0 "The works hollow the site hard enough to set it back. The monument has not yet risen, but the place around it has already paid."
 tv_engineering_department.7166.a:0 "Sets the site back so the monument can move forward."
 tv_engineering_department.7167.t:0 "[tv_wonder_construction|E]：The Site's Prosperity Is Smothered"
 tv_engineering_department.7167.d:0 "The worksite smothers the local market for a time. Carts still arrive, but fewer of them are serving the town around the stone."
 tv_engineering_department.7167.a:0 "Lets the local market thin out while the works carry on."
 tv_engineering_department.7168.t:0 "[tv_wonder_construction|E]：The Capital Pays in Stone"
 tv_engineering_department.7168.d:0 "The capital pays in stone, labor, and delayed repairs. A distant monument becomes more real while nearby plans grow hollow."
 tv_engineering_department.7168.a:0 "We let the capital's own repairs wait for the distant wonder."
 tv_engineering_department.7169.t:0 "[tv_wonder_construction|E]：The Royal City's Trade Is Pressed Low"
 tv_engineering_department.7169.d:0 "The royal city's trade is pressed low by the works. Grandeur far away dulls the streets that must finance it."
 tv_engineering_department.7169.a:0 "Dulls the royal city's streets to fund grandeur elsewhere."
 tv_engineering_department.7170.t:0 "[tv_wonder_construction|E]：Sweat Crosses Into Blood"
 tv_engineering_department.7170.d:0 "Sweat crosses into blood at the site. The monument is not cancelled, which may be the cruelest part of the lesson."
 tv_engineering_department.7170.a:0 "We press on, though the site has paid in blood."
 tv_engineering_department.7171.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Wins the Street"
 tv_engineering_department.7171.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] turns a technical tour into a public triumph. The result is a major improvement in [tv_wonder_domestic_support|E].\n\n#G This event occurred because the current [tv_great_engineer|E] has effective military ability above 80.#!"
 tv_engineering_department.7171.a:0 "Turns a routine inspection into a public triumph."
 tv_engineering_department.7172.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Redraws the Grand Line"
 tv_engineering_department.7172.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] redraws the main axis with a confidence that makes the larger plan credible. The result is a major improvement in [tv_wonder_scale_competence|E].\n\n#G This event occurred because the current [tv_great_engineer|E] has effective military ability above 80.#!"
 tv_engineering_department.7172.a:0 "Makes the grand axis look inevitable, not reckless."
 tv_engineering_department.7173.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Rebuilds the Schedule"
 tv_engineering_department.7173.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] rebuilds the schedule so cleanly that even rival foremen obey it. The result is a major improvement in [tv_wonder_organization_competence|E].\n\n#G This event occurred because the current [tv_great_engineer|E] has effective military ability above 80.#!"
 tv_engineering_department.7173.a:0 "We fall in line behind the new schedule."
 tv_engineering_department.7174.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Opens the Road"
 tv_engineering_department.7174.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] opens a supply route that makes the old delays look almost foolish. The result is a major improvement in [tv_wonder_logistics_competence|E].\n\n#G This event occurred because the current [tv_great_engineer|E] has effective military ability above 80.#!"
 tv_engineering_department.7174.a:0 "The road is open at last!"
 tv_engineering_department.7175.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Drives the Main Works"
 tv_engineering_department.7175.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] drives the main works through a problem that had stalled lesser hands. The result is a major improvement in [tv_wonder_construction|E] progress.\n\n#G This event occurred because the current [tv_great_engineer|E] has effective military ability above 80.#!"
 tv_engineering_department.7175.a:0 "Drives the stalled works clean through."
 tv_engineering_department.7176.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Calms the Rumor"
 tv_engineering_department.7176.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] answers rumors with enough plain explanation to steady public confidence. The project gains a steadier improvement in [tv_wonder_domestic_support|E].\n\n#G This event occurred because the current [tv_great_engineer|E] has effective military ability above 50.#!"
 tv_engineering_department.7176.a:0 "Quiets the rumors with plain talk."
 tv_engineering_department.7177.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Sets the Measure"
 tv_engineering_department.7177.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] finds enough margin in the site to spare the project from a timid design. The project gains a steadier improvement in [tv_wonder_scale_competence|E].\n\n#G This event occurred because the current [tv_great_engineer|E] has effective military ability above 50.#!"
 tv_engineering_department.7177.a:0 "We give the plan room enough to be bold."
 tv_engineering_department.7178.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Straightens the Rolls"
 tv_engineering_department.7178.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] straightens a stubborn mess of crews, tools, and watches. The project gains a steadier improvement in [tv_wonder_organization_competence|E].\n\n#G This event occurred because the current [tv_great_engineer|E] has effective military ability above 50.#!"
 tv_engineering_department.7178.a:0 "Sets the crews, tools, and watches back in order."
 tv_engineering_department.7179.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Clears the Convoy"
 tv_engineering_department.7179.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] clears the worst knot in the convoy schedule. The project gains a steadier improvement in [tv_wonder_logistics_competence|E].\n\n#G This event occurred because the current [tv_great_engineer|E] has effective military ability above 50.#!"
 tv_engineering_department.7179.a:0 "Clears the worst knot in the supply line."
 tv_engineering_department.7180.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Fits the Critical Joint"
 tv_engineering_department.7180.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] fits the critical piece and lets the next stage begin sooner. The project gains a steadier improvement in [tv_wonder_construction|E] progress.\n\n#G This event occurred because the current [tv_great_engineer|E] has effective military ability above 50.#!"
 tv_engineering_department.7180.a:0 "Full speed ahead!"
 tv_engineering_department.7181.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Courts the Crowd"
 tv_engineering_department.7181.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] places the unfinished works before the crowd and trusts the spectacle. The decision may lift [tv_wonder_domestic_support|E] or cost the site dearly.\n\n#Y This event occurred because the current [tv_great_engineer|E] has effective military ability between 20 and 80.#!"
 tv_engineering_department.7181.a:0 "Lets the crowd pass judgment on the unfinished stones."
 tv_engineering_department.7182.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Enlarges the Plan"
 tv_engineering_department.7182.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] orders the plan enlarged before all doubts have been paid for. The decision may lift [tv_wonder_scale_competence|E] or cost the site dearly.\n\n#Y This event occurred because the current [tv_great_engineer|E] has effective military ability between 20 and 80.#!"
 tv_engineering_department.7182.a:0 "Orders the blueprint enlarged before the doubts are settled."
 tv_engineering_department.7183.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Rewrites the Shift"
 tv_engineering_department.7183.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] rewrites the shifts in a single afternoon and dares the yard to keep up. The decision may lift [tv_wonder_organization_competence|E] or cost the site dearly.\n\n#Y This event occurred because the current [tv_great_engineer|E] has effective military ability between 20 and 80.#!"
 tv_engineering_department.7183.a:0 "We rewrite the shifts and dare the yard to keep up."
 tv_engineering_department.7184.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Takes the Risky Road"
 tv_engineering_department.7184.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] sends the carts by a difficult road and trusts calculation over habit. The decision may lift [tv_wonder_logistics_competence|E] or cost the site dearly.\n\n#Y This event occurred because the current [tv_great_engineer|E] has effective military ability between 20 and 80.#!"
 tv_engineering_department.7184.a:0 "Sends the carts down the harder road, trusting calculation over habit."
 tv_engineering_department.7185.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Tests a Faster Method"
 tv_engineering_department.7185.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] tests a quicker method where failure would be very public. The decision may lift [tv_wonder_construction|E] progress or cost the site dearly.\n\n#Y This event occurred because the current [tv_great_engineer|E] has effective military ability between 20 and 80.#!"
 tv_engineering_department.7185.a:0 "Try the faster method - let it prove itself in public!"
 tv_engineering_department.7186.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Miscounts the Coin"
 tv_engineering_department.7186.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] misjudges the cost of a fix and leaves the treasury to cover the elegance. The works continue, but [gold|E] suffers for the oversight.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 50.#!"
 tv_engineering_department.7186.a:0 "Quietly settles the shortfall before the account is questioned."
 tv_engineering_department.7187.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Forgets the Court"
 tv_engineering_department.7187.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] forgets that royal authority is a material too, and spends it carelessly. The works continue, but [legitimacy|E] suffers for the oversight.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 50.#!"
 tv_engineering_department.7187.a:0 "We rein in the careless use of the crown's name."
 tv_engineering_department.7188.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Misreads the Villages"
 tv_engineering_department.7188.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] underestimates how much disturbance a neat engineering answer can cause. The works continue, but [stability|E] suffers for the oversight.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 50.#!"
 tv_engineering_department.7188.a:0 "Smooths over the disturbance the tidy solution left behind."
 tv_engineering_department.7189.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Speaks Too Soon"
 tv_engineering_department.7189.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] speaks too confidently before the work can support the boast. The works continue, but [prestige|E] suffers for the oversight.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 50.#!"
 tv_engineering_department.7189.a:0 "Walk the boast back!"
 tv_engineering_department.7190.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Slights the Nobles"
 tv_engineering_department.7190.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] treats noble patience as if it were another supply stockpile. The works continue, but [estate_satisfaction|E] among the nobles suffers for the oversight.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 50.#!"
 tv_engineering_department.7190.a:0 "Reminds the engineer that noble patience is not a stockpile to draw from."
 tv_engineering_department.7191.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Disturbs the Calendar"
 tv_engineering_department.7191.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] moves through the religious calendar as if it were a delivery table. The works continue, but [estate_satisfaction|E] among the clergy suffers for the oversight.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 50.#!"
 tv_engineering_department.7191.a:0 "Lets the altars keep their own calendar after all."
 tv_engineering_department.7192.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Blocks the Market"
 tv_engineering_department.7192.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] blocks ordinary trade while chasing a cleaner line for the site. The works continue, but [estate_satisfaction|E] among the burghers suffers for the oversight.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 50.#!"
 tv_engineering_department.7192.a:0 "We reopen the market lane the site had closed off."
 tv_engineering_department.7193.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Underestimates the Villages"
 tv_engineering_department.7193.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] mistakes exhausted villages for an unused reserve. The works continue, but [estate_satisfaction|E] among the peasants suffers for the oversight.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 50.#!"
 tv_engineering_department.7193.a:0 "Lets the exhausted villages rest instead of being drawn on again."
 tv_engineering_department.7194.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Cuts the Wrong Streets"
 tv_engineering_department.7194.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] cuts through the wrong local arrangements and calls the gap useful. The works continue, but [development|E] at the site suffers for the oversight.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 50.#!"
 tv_engineering_department.7194.a:0 "Patches over the arrangements that were cut through by mistake."
 tv_engineering_department.7195.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Crowds the Site's Livelihoods"
 tv_engineering_department.7195.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] crowds out local livelihoods while clearing space for the works. The works continue, but [prosperity|E] at the site suffers for the oversight.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 50.#!"
 tv_engineering_department.7195.a:0 "We make room again for the livelihoods the clearing crowded out."
 tv_engineering_department.7196.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Misuses the Capital"
 tv_engineering_department.7196.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] misuses capital resources as though the royal city had no plans of its own. The works continue, but [development|E] in the capital suffers for the oversight.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 50.#!"
 tv_engineering_department.7196.a:0 "Returns the misused resources to the capital's own plans."
 tv_engineering_department.7197.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Disturbs the Royal City"
 tv_engineering_department.7197.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] disturbs the royal city's trade while solving a local engineering problem. The works continue, but [prosperity|E] in the capital suffers for the oversight.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 50.#!"
 tv_engineering_department.7197.a:0 "We calm the royal city's trade before the disruption spreads."
 tv_engineering_department.7198.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Misjudges the Labor Limit"
 tv_engineering_department.7198.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] misjudges the limit of laboring bodies. The works continue, but laboring [population|E] at the site suffers for the oversight.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 50.#!"
 tv_engineering_department.7198.a:0 "Ease the strain before more give out!"
 tv_engineering_department.7199.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Breaks the Ledger"
 tv_engineering_department.7199.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] lets an avoidable mistake break through the accounts and empty more coin than pride can excuse. The error is not enough to end the wonder, which may be the ugliest part of it.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 20.#!"
 tv_engineering_department.7199.a:0 "Chalks up the loss and quietly shuts the ledger."
 tv_engineering_department.7200.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Wounds the Crown"
 tv_engineering_department.7200.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] turns a preventable site failure into a visible wound to the crown. The error is not enough to end the wonder, which may be the ugliest part of it.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 20.#!"
 tv_engineering_department.7200.a:0 "We wear the crown's new scar and carry on."
 tv_engineering_department.7201.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Unsettles the Country"
 tv_engineering_department.7201.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] pushes the country into disorder while trying to solve a site problem. The error is not enough to end the wonder, which may be the ugliest part of it.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 20.#!"
 tv_engineering_department.7201.a:0 "Leaves the disorder to burn itself out."
 tv_engineering_department.7202.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Makes a Spectacle"
 tv_engineering_department.7202.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] makes the site a spectacle and drags courtly honor into it. The error is not enough to end the wonder, which may be the ugliest part of it.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 20.#!"
 tv_engineering_department.7202.a:0 "Let the court have its spectacle!"
 tv_engineering_department.7203.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Angers the Houses"
 tv_engineering_department.7203.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] angers the houses by solving a site problem through their privileges. The error is not enough to end the wonder, which may be the ugliest part of it.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 20.#!"
 tv_engineering_department.7203.a:0 "Spends the houses' goodwill to keep the work moving."
 tv_engineering_department.7204.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Offends the Clergy"
 tv_engineering_department.7204.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] offends the clergy by making sacred patience pay for secular stone. The error is not enough to end the wonder, which may be the ugliest part of it.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 20.#!"
 tv_engineering_department.7204.a:0 "We let sacred patience foot the bill for secular stone."
 tv_engineering_department.7205.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Provokes the Burghers"
 tv_engineering_department.7205.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] provokes the burghers by treating commerce as loose scaffolding. The error is not enough to end the wonder, which may be the ugliest part of it.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 20.#!"
 tv_engineering_department.7205.a:0 "Leaves the merchants to mend their own scaffolding."
 tv_engineering_department.7206.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Breaks the Villages"
 tv_engineering_department.7206.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] breaks village patience with a demand that should have been avoided. The error is not enough to end the wonder, which may be the ugliest part of it.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 20.#!"
 tv_engineering_department.7206.a:0 "We ask the villages' pardon for a demand we could have spared them."
 tv_engineering_department.7207.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Injures the Site"
 tv_engineering_department.7207.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] injures the site by solving a technical problem with local destruction. The error is not enough to end the wonder, which may be the ugliest part of it.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 20.#!"
 tv_engineering_department.7207.a:0 "Patches the wound the repairs themselves caused."
 tv_engineering_department.7208.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Snuffs Out the Site's Markets"
 tv_engineering_department.7208.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] snuffs out the site's markets through a preventable decision. The error is not enough to end the wonder, which may be the ugliest part of it.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 20.#!"
 tv_engineering_department.7208.a:0 "So be it—let the stalls fall silent!"
 tv_engineering_department.7209.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Hollows the Capital's Plans"
 tv_engineering_department.7209.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] hollows the capital's plans to cover a mistake at the site. The error is not enough to end the wonder, which may be the ugliest part of it.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 20.#!"
 tv_engineering_department.7209.a:0 "Guts the capital's own plans to patch the site's mistake."
 tv_engineering_department.7210.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Dims the Capital's Prosperity"
 tv_engineering_department.7210.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] dims capital prosperity through a failure that should never have reached the market. The error is not enough to end the wonder, which may be the ugliest part of it.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 20.#!"
 tv_engineering_department.7210.a:0 "We watch the capital's shine dim over a failure it never should have seen."
 tv_engineering_department.7211.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Causes Casualties"
 tv_engineering_department.7211.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] causes casualties by letting a preventable failure pass through the crews. The error is not enough to end the wonder, which may be the ugliest part of it.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 20.#!"
 tv_engineering_department.7211.a:0 "Counts the dead the crews should never have lost."
