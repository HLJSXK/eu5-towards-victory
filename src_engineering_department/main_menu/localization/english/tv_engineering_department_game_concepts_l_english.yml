 # ── Generic trigger tooltips ───────────────────────────────────────────────
 TV_HAS_VARIABLE_NOT_SET_TT: "Required state is not active."
 TV_CHARACTER_NOT_ALREADY_TV_IO_CHIEF_TT: "This character is not already serving as a TV IO chief."
 TV_HAS_ENGINEERING_DEPARTMENT_MEMBER_TT: "This country is a member of the [tv_engineering_department|E]."
 TV_HAS_GREAT_ENGINEER_CHAR_TT: "A [tv_great_engineer|E] has been appointed."
 TV_IO_HEADER_APPOINT_CHIEF_PROMPT: "Appoint a Chief"

 # ── Engineering Department / Wonder Construction ──────────────────────────
 game_concept_tv_engineering_department: "Engineering Department"
 game_concept_tv_engineering_department_desc: "A non-unique international organization established automatically for every country during campaign initialization. It holds the [tv_great_engineer|e] office and manages every stage of a [tv_wonder_construction|e]: [tv_wonder_concept|e], site [tv_wonder_survey|e], organization, logistics, and final [tv_wonder_ceremony|e]."
 game_concept_tv_engineering_department_europedia_desc: "Established automatically for every country at campaign start, or the first time the Engineering Department is added to an existing save, this is the standing institution behind every [tv_wonder_construction|e] a country attempts. Its single officer, the [tv_great_engineer|e], personally drives the pipeline: their Administrative skill advances [tv_wonder_concept|e], their Military skill advances [tv_wonder_survey|e], and their tenure determines who is remembered at the final [tv_wonder_ceremony|e]. A project already underway is not reset by losing or replacing the Great Engineer, but a vacant office stalls Conception and Survey progress until a successor is appointed."

 game_concept_tv_great_engineer: "Great Engineer"
 game_concept_tv_great_engineer_desc: "The appointed character who leads the [tv_engineering_department|e]. The [tv_great_engineer|e] is stored as a country variable and can be appointed, replaced, or dismissed from the [tv_engineering_department|e] panel."

 game_concept_tv_wonder_concept: "Conception"
 game_concept_tv_wonder_concept_desc: "The proposal stage that opens a new [tv_wonder_construction|e]. Each month the [tv_great_engineer|e]'s Administrative skill advances Conception progress; once it completes, the [tv_great_engineer|e] puts forward a feasible [tv_wonder_small|e], [tv_wonder_medium|e], or [tv_wonder_large|e] project for the country to pursue."
 game_concept_tv_wonder_concept_europedia_desc: "Conception begins the moment a [tv_great_engineer|e] is appointed: a hidden progress meter starts at 0 and rises a little every month, driven by the officer's Administrative skill. A weak administrator can take years to complete Conception, while a country that cycles through several capable administrators in succession carries the accumulated progress forward regardless of who currently holds the office. On completion the Engineer does not let the country pick freely — they propose one feasible [tv_wonder_small|e], [tv_wonder_medium|e], or [tv_wonder_large|e] undertaking, shaped by what the country can currently support, for the country to pursue."

 game_concept_tv_wonder_survey: "Survey"
 game_concept_tv_wonder_survey_desc: "The site-assessment stage of [tv_wonder_construction|e]. Survey progress rises monthly from the [tv_great_engineer|e]'s Military skill, reveals [tv_wonder_scale_competence|e], [tv_wonder_logistics_competence|e], and [tv_wonder_organization_competence|e], and lets the country confirm a construction site once the readings are complete."
 game_concept_tv_wonder_survey_europedia_desc: "Once debate is resolved, surveyors assess three hidden qualities of the chosen site — [tv_wonder_scale_competence|e], [tv_wonder_organization_competence|e], and [tv_wonder_logistics_competence|e] — each blending the site's own natural suitability with the [tv_great_engineer|e]'s Administrative skill. All three readings rise together as survey progress accumulates from the Engineer's Military skill, and none of them can be improved again once construction has begun, so a country weighing a marginal site against a longer wait for a better one is making a real trade-off."

 game_concept_tv_wonder_debate: "Debate"
 game_concept_tv_wonder_debate_desc: "The domestic-debate stage of [tv_wonder_construction|e]. Satisfying estate demands and debate events builds [tv_wonder_domestic_support|e]; once it reaches 100, the country can declare the debate concluded and move on to [tv_wonder_survey|e]."
 game_concept_tv_wonder_debate_europedia_desc: "Before any ground is broken, the proposed project must survive a domestic debate. The Nobility, Burghers, and Clergy each raise demands whose satisfaction grants [tv_wonder_domestic_support|e], and debate events grant more besides. Support runs on a 0–200 scale, but only the first 100 points are needed to close the debate and move on to [tv_wonder_survey|e]. Support does not keep accumulating forever: once the debate ends it decays a little every month, so a country that can already close the debate gains little by leaving it open, and a project that lets support decay all the way to zero before it earns its ceremony risks collapsing outright."

 game_concept_tv_wonder_materials: "Building Materials"
 game_concept_tv_wonder_materials_desc: "A produced market good used to maintain $tv_wonder_labor_camp$ during an active [tv_wonder_construction|e]. Each $tv_wonder_material_dispatch_point$ converts basic construction goods into [tv_wonder_materials|e], so supply and price are handled through the normal market."
 game_concept_tv_wonder_materials_europedia_desc: "Wonder Materials are not stockpiled in advance — each $tv_wonder_material_dispatch_point$ refines them on demand from ordinary construction goods already moving through the market, and the $tv_wonder_labor_camp$ building actually working the site consumes them as it builds. Because both ends of the chain sit on the normal market, a Great Project competes with the rest of the country's economy for the same base goods, and a shortage shows up as slower construction rather than a hard stop."

 game_concept_tv_wonder_ceremony: "Ceremony"
 game_concept_tv_wonder_ceremony_desc: "The final dedication of a completed [tv_wonder_construction|e] project. The chosen ceremony branch determines the monument's final building, permanent country modifier, and last burst of prestige, stability, and legitimacy from remaining [tv_wonder_domestic_support|e]."
 game_concept_tv_wonder_ceremony_europedia_desc: "How a Great Project is closed out depends on what kind of wonder it is. A [tv_wonder_generic|e] project's inauguration lets the country choose between three ceremony styles — a year-long burden ending in a permanent blessing, an auxiliary annex building that boosts local estate power, or a one-time decoration paid for with art, gold, and prestige. Most [tv_wonder_unique|e] wonders instead advance automatically through a shared eight-stage ceremony once construction completes, reaching roughly one new stage per quarter and culminating in a permanent country modifier. A handful of historically distinctive sites — among them the Pharos Lighthouse and the Hagia Sophia — bypass that shared framework entirely for their own dedicated, hand-authored ritual instead."

 game_concept_tv_wonder_construction: "Great Project"
 game_concept_tv_wonder_construction_desc: "A Great Project mechanism managed through the [tv_engineering_department|e]. Once the [tv_great_engineer|e]'s [tv_wonder_concept|e] yields a feasible [tv_wonder_small|e], [tv_wonder_medium|e], or [tv_wonder_large|e] project and the country resolves domestic debate, it completes a [tv_wonder_survey|e], organizes labor, gathers [tv_wonder_materials|e], and advances four [tv_wonder_construction_part|e]s to raise the project to its final level."
 game_concept_tv_wonder_construction_europedia_desc: "A Great Project is the country-wide thread that carries a wonder from idea to monument. A [tv_great_engineer|e] first completes [tv_wonder_concept|e] to propose a feasible [tv_wonder_small|e], [tv_wonder_medium|e], or [tv_wonder_large|e] undertaking; the country then resolves domestic [tv_wonder_debate|e]; a [tv_wonder_survey|e] confirms the chosen site can bear it; and only then does construction proper begin, with four [tv_wonder_construction_part|e]s rising together on [tv_wonder_materials|e] and organized labor until the whole project reaches its final level and is closed out with a [tv_wonder_ceremony|e]. A finished [tv_wonder_generic|e] project can later be carried further through [tv_wonder_expansion|e] without repeating any of the earlier stages."

 game_concept_tv_wonder_expansion: "Expansion"
 game_concept_tv_wonder_expansion_desc: "Continuing an already-inaugurated [tv_wonder_construction|e] at the same site to a larger scale. An expansion reuses the [tv_wonder_ceremony|e] style chosen at that wonder's earlier inauguration, does not forfeit any completion rewards already earned, and continues to draw on the site's preserved [tv_wonder_survey|e] competence."

 game_concept_tv_wonder_construction_part: "Construction Part"
 game_concept_tv_wonder_construction_part_desc: "One of the four parallel tracks — Foundation, Main Structure, Function, and Crowning — that a [tv_wonder_construction|e] advances at once. The project's level is set by whichever of the four parts lags furthest behind, so progress must be spread evenly rather than rushed down a single track."
 game_concept_tv_wonder_construction_part_europedia_desc: "Every Great Project is really four buildings rising in parallel — Foundation, Main Structure, Function, and Crowning — each advanced independently with its own labor and materials. The project's overall level is not an average of the four; it is capped at whichever part has fallen furthest behind. Pouring every resource into one showpiece track while neglecting the others only stalls the whole monument at the level of its weakest part, so balanced progress across all four beats a race to finish any single one first."

 game_concept_tv_wonder_small: "Small Project"
 game_concept_tv_wonder_small_desc: "A [tv_wonder_construction|e] size class. Small projects may be built more than once. Their base country effect is limited to value movement, while local effects and ceremony effects are unrestricted.\nEach level of a small project typically costs about #Y 10,000@gold!#!."

 game_concept_tv_wonder_medium: "Medium Project"
 game_concept_tv_wonder_medium_desc: "A [tv_wonder_construction|e] size class between small and large projects. A country may not start a second medium project of the same type, but its base country effects, local effects, and ceremony effects are unrestricted.\nEach level of a medium project typically costs about #Y 20,000@gold!#!."

 game_concept_tv_wonder_large: "Large Project"
 game_concept_tv_wonder_large_desc: "A [tv_wonder_construction|e] size class. A country may not start a second large project of the same type, but its base country effects, local effects, and ceremony effects are unrestricted.\nEach level of a large project typically costs about #Y 30,000@gold!#!."

 game_concept_tv_wonder_generic: "Generic Wonder"
 game_concept_tv_wonder_generic_desc: "A [tv_wonder_construction|e] proposed by the [tv_great_engineer|e] and freely sited at [tv_wonder_small|e], [tv_wonder_medium|e], or [tv_wonder_large|e] scale, as opposed to a [tv_wonder_unique|e] fixed on the map. Its inauguration lets you choose a [tv_wonder_ceremony|e] style."
 game_concept_tv_wonder_generic_europedia_desc: "A generic wonder is not tied to any fixed location: the country itself chooses where to build once [tv_wonder_survey|e] confirms a suitable site, at whichever of the [tv_wonder_small|e], [tv_wonder_medium|e], or [tv_wonder_large|e] classes the [tv_great_engineer|e] proposed. Small generic projects can even be rebuilt more than once at a new site, giving a country repeatable access to that archetype's ceremony rewards — unlike a [tv_wonder_unique|e], which exists exactly once, at one place, for the entire game."

 game_concept_tv_wonder_unique: "Unique Wonder"
 game_concept_tv_wonder_unique_desc: "A historical [tv_wonder_construction|e] fixed at a specific map location, as opposed to a freely-sited [tv_wonder_generic|e]. Most unique wonders automatically advance through an 8-stage [tv_wonder_ceremony|e] once construction completes; a few have their own dedicated manual ceremony instead."
 game_concept_tv_wonder_unique_europedia_desc: "A unique wonder is bound to a single real-world location from the start of the campaign, and only the country that actually controls that location can ever build it — there is no free-siting choice as with a [tv_wonder_generic|e]. In exchange for that historical fixity, 121 of the mod's 123 unique wonders share a uniform, automatic eight-stage [tv_wonder_ceremony|e] once finished, needing no further player input to reach their permanent reward. The Pharos Lighthouse and the Hagia Sophia are the sole exceptions, each running its own bespoke, multi-step ritual instead."

 game_concept_tv_wonder_domestic_support: "Domestic Support"
 game_concept_tv_wonder_domestic_support_desc: "A [tv_wonder_construction|e] resource representing elite and public willingness to sustain a major Great Project. Reach 100 to end the initial debate; support can be stored up to 200 and decays after the debate ends."

 game_concept_tv_wonder_scale_competence: "Scale Competence"
 game_concept_tv_wonder_scale_competence_desc: "A [tv_wonder_survey|e] reading for how well the chosen site can carry the project's intended size, axes, foundations, and public approach without forcing the design into an awkward shape. It sets the maximum Great Project level at 20%, 40%, 60%, 80%, and 100%, with level 6 requiring 100%."

 game_concept_tv_wonder_organization_competence: "Organization Competence"
 game_concept_tv_wonder_organization_competence_desc: "A [tv_wonder_survey|e] reading for how cleanly labor rosters, foremen, workshops, and construction stages can be made to answer one plan instead of many competing orders. It linearly sets the maximum Great Project Worksite level from 0 to 20."

 game_concept_tv_wonder_logistics_competence: "Logistics Competence"
 game_concept_tv_wonder_logistics_competence_desc: "A [tv_wonder_survey|e] reading for roads, carts, ports, bridges, and handover points that determine whether [tv_wonder_materials|e] reach the site when the masons need them."

