l_english:
 tv_ed_name: "Engineering Department"
 tv_ed__wonder_control_name: "Construction Flow Tuning"
 tv_ed__wonder_control_desc: "Adjusts the Great Project construction flow."
 tv_ed__wonder_control__access_name: "Direct Construction"
 tv_ed__wonder_control__access_desc: "Controls whether Engineering Department wonder buildings can be constructed directly."
 tv_ed__wonder_control__phases_name: "Lifecycle Control"
 tv_ed__wonder_control__phases_desc: "Controls which Great Wonder lifecycle phases are shortened or disabled."
 tv_ed__wonder_control__limits_name: "Construction Limits"
 tv_ed__wonder_control__limits_desc: "Overrides suitability-based size and worksite limits."
 tv_ed__wonder_control__construction_name: "Construction Tuning"
 tv_ed__wonder_control__construction_desc: "Controls construction progress requirements and random construction events."
 tv_ed__direct_build_name: "Direct Construction"
 tv_ed__direct_build_desc: "Allows final Great Wonder buildings to be constructed directly from the normal building list at the configured ducat price."
 tv_ed__direct_build_small_price_name: "Small Direct-Build Price"
 tv_ed__direct_build_small_price_desc: "Ducat price for each directly constructed Small Wonder level, in thousands."
 tv_ed__direct_build_small_price_format: "[CMMV('tv_ed__direct_build_small_price')]k"
 tv_ed__direct_build_medium_price_name: "Medium Direct-Build Price"
 tv_ed__direct_build_medium_price_desc: "Ducat price for each directly constructed Medium Wonder level, in thousands."
 tv_ed__direct_build_medium_price_format: "[CMMV('tv_ed__direct_build_medium_price')]k"
 tv_ed__direct_build_large_price_name: "Large Direct-Build Price"
 tv_ed__direct_build_large_price_desc: "Ducat price for each directly constructed Large Wonder level, in thousands."
 tv_ed__direct_build_large_price_format: "[CMMV('tv_ed__direct_build_large_price')]k"
 tv_ed__skip_concept_name: "Skip Conception"
 tv_ed__skip_concept_desc: "Conception phases complete automatically on the next day."
 tv_ed__skip_debate_name: "Skip Debate"
 tv_ed__skip_debate_desc: "Debate phases immediately receive 200 domestic support and proceed to surveying."
 tv_ed__skip_survey_name: "Skip Survey"
 tv_ed__skip_survey_desc: "Fresh projects complete surveying immediately with Scale 100, Logistics 85, and Organization 85."
 tv_ed__unlimited_scale_name: "Unlimited Wonder Scale"
 tv_ed__unlimited_scale_desc: "Great Projects can always be built to level 6."
 tv_ed__unlimited_organization_name: "Unlimited Worksite Organization"
 tv_ed__unlimited_organization_desc: "Worksites can always be built to level 100."
 tv_ed__disable_survey_events_name: "Disable Survey Events"
 tv_ed__disable_survey_events_desc: "Prevents random survey-phase events from appearing."
 tv_ed__skip_construction_name: "Skip Construction"
 tv_ed__skip_construction_desc: "When construction begins, immediately raises the wonder components to level 6. #R Warning: this severely disrupts game balance.#!"
 tv_ed__small_module_requirement_name: "Small Wonder Module Requirement"
 tv_ed__small_module_requirement_desc: "Construction progress required for each Small Wonder module, in thousands."
 tv_ed__small_module_requirement_format: "[CMMV('tv_ed__small_module_requirement')]k"
 tv_ed__medium_module_requirement_name: "Medium Wonder Module Requirement"
 tv_ed__medium_module_requirement_desc: "Construction progress required for each Medium Wonder module, in thousands."
 tv_ed__medium_module_requirement_format: "[CMMV('tv_ed__medium_module_requirement')]k"
 tv_ed__large_module_requirement_name: "Large Wonder Module Requirement"
 tv_ed__large_module_requirement_desc: "Construction progress required for each Large Wonder module, in thousands."
 tv_ed__large_module_requirement_format: "[CMMV('tv_ed__large_module_requirement')]k"
 tv_ed__disable_construction_events_name: "Disable Construction Events"
 tv_ed__disable_construction_events_desc: "Prevents random construction-phase events from appearing."
 tv_ed__skip_ceremony_name: "Skip Ceremony Delays and Costs"
 tv_ed__skip_ceremony_desc: "Generic ceremonies retain their selection but complete immediately and without costs. Unique-wonder ceremonies complete automatically upon entering the ceremony phase."
