l_english:
 tv_engineering_department_name: "Engineering Department"
 tv_engineering_department__wonder_control_name: "Wonder Control"
 tv_engineering_department__wonder_control_desc: "Host-controlled Engineering Department construction and lifecycle settings."
 tv_engineering_department__wonder_control__access_name: "Building Access"
 tv_engineering_department__wonder_control__access_desc: "Controls how Engineering Department wonder buildings enter the ordinary building interface."
 tv_engineering_department__wonder_control__phases_name: "Lifecycle Control"
 tv_engineering_department__wonder_control__phases_desc: "Controls which Great Wonder lifecycle phases are shortened or disabled. Stage-skip changes apply only when a project subsequently enters that phase."
 tv_engineering_department__wonder_control__limits_name: "Construction Limits"
 tv_engineering_department__wonder_control__limits_desc: "Overrides suitability-based size and worksite limits."
 tv_engineering_department__wonder_control__construction_name: "Construction Tuning"
 tv_engineering_department__wonder_control__construction_desc: "Controls construction progress requirements and random construction events."
 tv_engineering_department__direct_build_name: "Direct Wonder Construction"
 tv_engineering_department__direct_build_desc: "Allows final Great Wonder buildings to be constructed directly from the normal building list using their configured gold prices and a long construction time. Local effects apply immediately after completion; national effects refresh on the next monthly pulse."
 tv_engineering_department__direct_build_small_price_name: "Small Direct-Build Price"
 tv_engineering_department__direct_build_small_price_desc: "Gold price for each directly constructed Small Wonder level, in thousands."
 tv_engineering_department__direct_build_small_price_format: "[CMMV('tv_engineering_department__direct_build_small_price')]k"
 tv_engineering_department__direct_build_medium_price_name: "Medium Direct-Build Price"
 tv_engineering_department__direct_build_medium_price_desc: "Gold price for each directly constructed Medium Wonder level, in thousands."
 tv_engineering_department__direct_build_medium_price_format: "[CMMV('tv_engineering_department__direct_build_medium_price')]k"
 tv_engineering_department__direct_build_large_price_name: "Large Direct-Build Price"
 tv_engineering_department__direct_build_large_price_desc: "Gold price for each directly constructed Large Wonder level, in thousands."
 tv_engineering_department__direct_build_large_price_format: "[CMMV('tv_engineering_department__direct_build_large_price')]k"
 tv_engineering_department__skip_concept_name: "Skip Conception"
 tv_engineering_department__skip_concept_desc: "New conception phases complete through a hidden event after a one-day delay."
 tv_engineering_department__skip_debate_name: "Skip Debate"
 tv_engineering_department__skip_debate_desc: "New debate phases immediately receive 200 domestic support and proceed to surveying."
 tv_engineering_department__skip_survey_name: "Skip Survey"
 tv_engineering_department__skip_survey_desc: "Fresh projects complete surveying immediately with Scale 100, Logistics 85, and Organization 85. Resume and expansion projects retain their saved survey."
 tv_engineering_department__unlimited_scale_name: "Unlimited Wonder Scale"
 tv_engineering_department__unlimited_scale_desc: "Ignores scale suitability when determining whether a Great Wonder can reach level 6."
 tv_engineering_department__unlimited_organization_name: "Unlimited Worksite Organization"
 tv_engineering_department__unlimited_organization_desc: "Allows Great Wonder labor camps to reach 100 levels regardless of organization suitability."
 tv_engineering_department__disable_survey_events_name: "Disable Survey Events"
 tv_engineering_department__disable_survey_events_desc: "Prevents random survey-phase events from appearing."
 tv_engineering_department__skip_construction_name: "Skip Construction"
 tv_engineering_department__skip_construction_desc: "Immediately raises all four wonder components and the corresponding final helper building to level 6, then proceeds to the ceremony. #R Warning: this severely disrupts game balance.#!"
 tv_engineering_department__small_module_requirement_name: "Small Wonder Module Requirement"
 tv_engineering_department__small_module_requirement_desc: "Construction progress required for each Small Wonder module, in thousands."
 tv_engineering_department__small_module_requirement_format: "[CMMV('tv_engineering_department__small_module_requirement')]k"
 tv_engineering_department__medium_module_requirement_name: "Medium Wonder Module Requirement"
 tv_engineering_department__medium_module_requirement_desc: "Construction progress required for each Medium Wonder module, in thousands."
 tv_engineering_department__medium_module_requirement_format: "[CMMV('tv_engineering_department__medium_module_requirement')]k"
 tv_engineering_department__large_module_requirement_name: "Large Wonder Module Requirement"
 tv_engineering_department__large_module_requirement_desc: "Construction progress required for each Large Wonder module, in thousands."
 tv_engineering_department__large_module_requirement_format: "[CMMV('tv_engineering_department__large_module_requirement')]k"
 tv_engineering_department__disable_construction_events_name: "Disable Construction Events"
 tv_engineering_department__disable_construction_events_desc: "Prevents random construction-phase events from appearing."
 tv_engineering_department__skip_ceremony_name: "Skip Ceremony Delays and Costs"
 tv_engineering_department__skip_ceremony_desc: "Generic ceremonies retain their selection but complete immediately and without costs. Unique-wonder ceremonies complete automatically upon entering the ceremony phase."
