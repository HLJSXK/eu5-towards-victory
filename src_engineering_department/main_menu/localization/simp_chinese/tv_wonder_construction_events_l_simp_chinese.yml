 tv_engineering_department.7077.t:0 "[tv_wonder_construction|E]：排班命令一改再改"
 tv_engineering_department.7077.d:0 "新的号令链在棚下强行推开。它可能让工地守纪律，也可能只是教会每个工头新的争吵方式。"
 tv_engineering_department.7077.a:0 "我们把这道新号令推行到工地。"
 tv_engineering_department.7078.t:0 "[tv_wonder_construction|E]：补给线被迫改道"
 tv_engineering_department.7078.d:0 "一条险路有望缩短运线。天气若配合，它就是远见；天气若翻脸，所有人都会记得是谁下的令。"
 tv_engineering_department.7078.a:0 "走这条近路！"
 tv_engineering_department.7079.t:0 "[tv_wonder_construction|E]：新工法还站不住脚"
 tv_engineering_department.7079.d:0 "更快的方法被用在当前部件上。它可能救下这个月，也可能让下一班工匠修补一个漂亮错误。"
 tv_engineering_department.7079.a:0 "在当前部件上试行这套新工法。"
 tv_engineering_department.7080.t:0 "[tv_wonder_construction|E]：民心要稳，国库就得出血"
 tv_engineering_department.7080.d:0 "这个月的损失躲不掉，只能决定由谁来承担：要么让[tv_wonder_domestic_support|E]受损，要么把代价转到[gold|E]身上。不管怎么选，总要有一方付出代价。"
 tv_engineering_department.7080.a:0 "我们咽下这口气，继续往前走。"
 tv_engineering_department.7080.b:0 "这次，就让别处承担吧。"
 tv_engineering_department.7081.t:0 "[tv_wonder_construction|E]：民心要稳，王命就得受折"
 tv_engineering_department.7081.d:0 "工地上出了一次意外，损失必须有人承担。可以让[tv_wonder_domestic_support|E]直接受损，也可以把这份压力转移出去，改由[legitimacy|E]来承受。"
 tv_engineering_department.7081.a:0 "不管代价多少，我们守住这里。"
 tv_engineering_department.7081.b:0 "我们护住这里，代价挪去别处。"
 tv_engineering_department.7082.t:0 "[tv_wonder_construction|E]：民心要稳，地方就得受扰"
 tv_engineering_department.7082.d:0 "工程遇到了麻烦，总得有个地方吃亏。要么让[tv_wonder_domestic_support|E]先受影响，要么把这份负担转给[stability|E]。"
 tv_engineering_department.7082.a:0 "这次，我们自己扛。"
 tv_engineering_department.7082.b:0 "我们把这一击引向别处。"
 tv_engineering_department.7083.t:0 "[tv_wonder_construction|E]：民心要稳，声望就得拿去消耗"
 tv_engineering_department.7083.d:0 "现在有两个选择，只能挑一个：让[tv_wonder_domestic_support|E]承受这次损失，或者把损失转移出去，让[prestige|E]来承受。"
 tv_engineering_department.7083.a:0 "扛下来！"
 tv_engineering_department.7083.b:0 "转个方向！"
 tv_engineering_department.7084.t:0 "[tv_wonder_construction|E]：民心要稳，贵族就得忍着"
 tv_engineering_department.7084.d:0 "这次的麻烦总要落在什么地方。挡在这里，损失的就是[tv_wonder_domestic_support|E]；放到别处去，受影响的就变成贵族[estate_satisfaction|E]。"
 tv_engineering_department.7084.a:0 "宁受明伤，不留暗患。"
 tv_engineering_department.7084.b:0 "留住屋顶，任雨水改道别檐。"
 tv_engineering_department.7085.t:0 "[tv_wonder_construction|E]：民心要稳，教士就得让步"
 tv_engineering_department.7085.d:0 "这个月的代价必须有人承担。可以让[tv_wonder_domestic_support|E]直接背这笔账，也可以把账转出去，让教士[estate_satisfaction|E]来还。"
 tv_engineering_department.7085.a:0 "由它先扛下这一下。"
 tv_engineering_department.7085.b:0 "把负担推到别处。"
 tv_engineering_department.7086.t:0 "[tv_wonder_construction|E]：民心要稳，商街就得吃亏"
 tv_engineering_department.7086.d:0 "损失已经无法避免，唯一能决定的是它落在哪里。可以让它冲击[tv_wonder_domestic_support|E]，也可以把它引开，让市民[estate_satisfaction|E]承受。"
 tv_engineering_department.7086.a:0 "把压力扛在这里，稳住阵脚。"
 tv_engineering_department.7086.b:0 "把重量转移出去。"
 tv_engineering_department.7087.t:0 "[tv_wonder_construction|E]：民心要稳，村社就得多扛"
 tv_engineering_department.7087.d:0 "工程出了问题，代价必须有人承担。让[tv_wonder_domestic_support|E]直接受损是一种办法，把压力转给平民[estate_satisfaction|E]也是一种办法。"
 tv_engineering_department.7087.a:0 "接下这份重量，眼都不眨。"
 tv_engineering_department.7087.b:0 "护住这一头，让压力落到旁处。"
