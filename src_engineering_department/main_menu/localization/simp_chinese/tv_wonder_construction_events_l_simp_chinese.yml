 tv_engineering_department.7203.t:0 "建设：[tv_great_engineer|E]把贵族彻底惹恼了"
 tv_engineering_department.7203.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]动用了贵族的特权来填补工地上的失误，惹恼了各大家族。这个错误还不至于让奇观停工，这大概才是最让人难堪的地方。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于20。#!"
