 tv_engineering_department.7145.t:0 "[tv_wonder_construction|E]：奇观又在国库上挖了个口子"
 tv_engineering_department.7145.d:0 "奇观建设花钱的速度比预计的要快。国库能说清楚钱花在哪儿，但说明并不能把亏空补上。"
 tv_engineering_department.7145.a:0 "先把账上的窟窿填上。"
 tv_engineering_department.7146.t:0 "[tv_wonder_construction|E]：王命被工地磨薄了"
 tv_engineering_department.7146.d:0 "王室的名义被工地反复借用，用来说服反对的人。印玺还作数，只是分量轻了一些。"
 tv_engineering_department.7146.a:0 "再借用一次王室的名义。"
 tv_engineering_department.7147.t:0 "[tv_wonder_construction|E]：施工惊动了地方安宁"
 tv_engineering_department.7147.d:0 "施工的节奏打乱了平常的生活。市场开门晚了，村镇里有些抱怨，秩序稍微松动了一些。"
 tv_engineering_department.7147.a:0 "不理会村镇的抱怨，工程照旧推进。"
 tv_engineering_department.7148.t:0 "[tv_wonder_construction|E]：宫廷的体面又薄了一层"
 tv_engineering_department.7148.d:0 "宫廷为工程说了不少好话，换来的却是几句闲话。这些没兑现的场面话，多少磨损了一点声望。"
 tv_engineering_department.7148.a:0 "拿一点体面，换几句宫廷里的闲话。"
 tv_engineering_department.7149.t:0 "[tv_wonder_construction|E]：贵族席间开始说冷话"
 tv_engineering_department.7149.d:0 "贵族家族又一次为工程让步。这次的让步很客气，也很冷淡，反而比直接拒绝更让人不舒服。"
 tv_engineering_department.7149.a:0 "接受贵族这次冷淡的让步。"
 tv_engineering_department.7150.t:0 "[tv_wonder_construction|E]：祭坛前有人皱起了眉头"
 tv_engineering_department.7150.d:0 "宗教活动的日程又一次为工地调整。教士照做了，但看得出来并不情愿。"
 tv_engineering_department.7150.a:0 "接受教士这次不太情愿的服从。"
 tv_engineering_department.7151.t:0 "[tv_wonder_construction|E]：商街的账本又薄了一页"
 tv_engineering_department.7151.d:0 "市场上的生意为了绕开工地，多走了不少弯路。商人能从工程里得到好处，但路都被堵住时就谈不上了。"
 tv_engineering_department.7151.a:0 "清开道路，工程照旧！"
 tv_engineering_department.7152.t:0 "[tv_wonder_construction|E]：村社肩上又压了一担"
 tv_engineering_department.7152.d:0 "乡下又添了一份差事。工程是往前走了，但村社这边的耐心也在变薄。"
 tv_engineering_department.7152.a:0 "让乡下再多担一份差事。"
 tv_engineering_department.7153.t:0 "[tv_wonder_construction|E]：工址街区又被拆开一块"
 tv_engineering_department.7153.d:0 "工址又拆掉了一部分原有的街巷。将来的奇观多了一块地方，眼前的街区却少了一块。"
 tv_engineering_department.7153.a:0 "拆掉这片街巷，换将来的奇观。"
 tv_engineering_department.7154.t:0 "[tv_wonder_construction|E]：工址周围的买卖冷了下去"
 tv_engineering_department.7154.d:0 "工地把周边的生意拉了过去，当地的市场因此冷清了一些。这样的调用不能一直做下去。"
 tv_engineering_department.7154.a:0 "再一次把这片生意引到工程这边。"
 tv_engineering_department.7155.t:0 "[tv_wonder_construction|E]：首都修缮又给奇观让了路"
 tv_engineering_department.7155.d:0 "首都的一些工程项目再次为奇观让路。王城依然气派，只是有些原本该修的地方被搁下了。"
 tv_engineering_department.7155.a:0 "把首都的这部分工程，再让给奇观一次。"
 tv_engineering_department.7156.t:0 "[tv_wonder_construction|E]：王城街市也被拖冷了"
 tv_engineering_department.7156.d:0 "工程从首都抽走了信用和物资，市场因此少了一些活力。宫廷说这是为国出力，商人只当是生意变差了。"
 tv_engineering_department.7156.a:0 "这份光彩，本就是从别处借来的。"
 tv_engineering_department.7157.t:0 "[tv_wonder_construction|E]：伤员名册上又添了人"
 tv_engineering_department.7157.d:0 "伤亡名册上又添了名字。工程照常进行，但劳工们看这堆石头的眼神变了。"
 tv_engineering_department.7157.a:0 "记下伤名，继续开工！"
 tv_engineering_department.7158.t:0 "[tv_wonder_construction|E]：国库先替奇观吞下了代价"
 tv_engineering_department.7158.d:0 "工地这次开口要的数目不小，国库明显被掏空了一块。奇观还没建成，钱已经先花出去了。"
 tv_engineering_department.7158.a:0 "先把国库掏空一些，工程照常往上砌。"
 tv_engineering_department.7159.t:0 "[tv_wonder_construction|E]：王权的体面被工地扯开了"
 tv_engineering_department.7159.d:0 "工地这次的要求逼得王室不得不让步。原本用来撑场面的权威，如今被压低了一些。"
 tv_engineering_department.7159.a:0 "宁可让王室这次让步，也要把墙砌起来。"
 tv_engineering_department.7160.t:0 "[tv_wonder_construction|E]：征发把地方搅得更乱了"
 tv_engineering_department.7160.d:0 "这次的扰动传得比往常远，越过了围栏。官员能解释清楚原因，但解释并不能让地方安定下来。"
 tv_engineering_department.7160.a:0 "不去管它，让围栏外的骚动自己平息。"
 tv_engineering_department.7161.t:0 "[tv_wonder_construction|E]：工地让宫廷声望当众受损"
 tv_engineering_department.7161.d:0 "工地上的一次失礼，传得比官方的澄清还快。工程还没立起来，宫廷的脸面已经先受了损。"
 tv_engineering_department.7161.a:0 "由他们说去！"
 tv_engineering_department.7162.t:0 "[tv_wonder_construction|E]：贵族的耐心被工地磨没了"
 tv_engineering_department.7162.d:0 "工程这次动用了不少贵族的产业，客气话已经遮不住不满的声音了。"
 tv_engineering_department.7162.a:0 "任凭贵族抱怨，泥瓦照旧往上砌。"
 tv_engineering_department.7163.t:0 "[tv_wonder_construction|E]：教士的耐心也快用尽了"
 tv_engineering_department.7163.d:0 "这次的施工需求，占用了太靠近祭坛的时间和地方。教士不会轻易忘记这件事。"
 tv_engineering_department.7163.a:0 "教士的这份不满，就当作是石料的代价收下了。"
 tv_engineering_department.7164.t:0 "[tv_wonder_construction|E]：市民的怒气已经摆上街面"
 tv_engineering_department.7164.d:0 "愤怒的情绪已经传到了店铺门口。工地占用了空间、时间和信用，市民先感受到麻烦，后来才看到工程本身。"
 tv_engineering_department.7164.a:0 "任由店铺发牢骚，脚手架照样往上搭。"
 tv_engineering_department.7165.t:0 "[tv_wonder_construction|E]：乡间的怨气已经压不住了"
 tv_engineering_department.7165.d:0 "这次的征调让乡下人不再沉默。工程带来的影响，落到了一些可能永远看不到成果的人身上。"
 tv_engineering_department.7165.a:0 "让田地扛着去吧！"
 tv_engineering_department.7166.t:0 "[tv_wonder_construction|E]：工址先为奇观倒退了一步"
 tv_engineering_department.7166.d:0 "工地这次挖空了不少地方，让工址明显退步了一截。奇观还没建起来，周边地方已经先付出了代价。"
 tv_engineering_department.7166.a:0 "工址退一步，只为让奇观往前迈一步。"
 tv_engineering_department.7167.t:0 "[tv_wonder_construction|E]：工址的繁荣先被压暗了"
 tv_engineering_department.7167.d:0 "本地的市场被工地压得冷清了一阵子。车队还在来往，只是很少再为周边的城镇服务。"
 tv_engineering_department.7167.a:0 "由着本地市场淡下去，工程照旧不停。"
 tv_engineering_department.7168.t:0 "[tv_wonder_construction|E]：首都先替奇观付了账"
 tv_engineering_department.7168.d:0 "首都这次拿出了石料、人力，还有一些本该完成的修缮。远方的奇观变得更真实了，首都自己的计划却空了下来。"
 tv_engineering_department.7168.a:0 "让首都自己的修缮先等一等，给远方的奇观让路。"
 tv_engineering_department.7169.t:0 "[tv_wonder_construction|E]：王城买卖也被奇观拖慢了"
 tv_engineering_department.7169.d:0 "首都的贸易被工程压低了不少。远方的奇观越来越有分量，供养它的首都街道却暗淡了下来。"
 tv_engineering_department.7169.a:0 "压低首都的生意，去供养别处的这座奇观。"
 tv_engineering_department.7170.t:0 "[tv_wonder_construction|E]：工地把劳工逼出了伤亡"
 tv_engineering_department.7170.d:0 "工地上出了人命。工程没有因此停下，这大概是最让人难受的一点。"
 tv_engineering_department.7170.a:0 "工地已经出了人命，我们仍然往前走。"
 tv_engineering_department.7171.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]当众说服了围观者"
 tv_engineering_department.7171.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]把一次普通的巡视办成了一场公开的胜利，[tv_wonder_domestic_support|E]因此大幅提高。\n\n#G 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力高于80。#!"
 tv_engineering_department.7171.a:0 "把一次普通的巡视，办成了满城称赞的事。"
 tv_engineering_department.7172.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]重画了主轴线"
 tv_engineering_department.7172.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]重新画了主轴线，让更大的方案一下子变得可行，[tv_wonder_scale_competence|E]因此大幅提高。\n\n#G 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力高于80。#!"
 tv_engineering_department.7172.a:0 "让这条主轴显得站得住脚，而不是孤注一掷。"
 tv_engineering_department.7173.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]把工序全都重排了"
 tv_engineering_department.7173.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]把排班重新安排了一遍，连最挑剔的工头都没话可说，[tv_wonder_organization_competence|E]因此大幅提高。\n\n#G 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力高于80。#!"
 tv_engineering_department.7173.a:0 "干脆照这套新排班来。"
 tv_engineering_department.7174.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]重新打通了运路"
 tv_engineering_department.7174.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]打通了一条补给线，让过去的拖延显得没有必要，[tv_wonder_logistics_competence|E]因此大幅提高。\n\n#G 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力高于80。#!"
 tv_engineering_department.7174.a:0 "路终于通了！"
 tv_engineering_department.7175.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]亲手推过了主工段"
 tv_engineering_department.7175.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]亲自带着主体工程越过了一处一直卡住的难题，[tv_wonder_construction|E]进度因此大幅提高。\n\n#G 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力高于80。#!"
 tv_engineering_department.7175.a:0 "把卡住的工段硬生生推了过去。"
 tv_engineering_department.7176.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]把议论压了下去"
 tv_engineering_department.7176.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]用清楚的解释压下了流言，[tv_wonder_domestic_support|E]因此稳步提高。\n\n#G 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力高于50。#!"
 tv_engineering_department.7176.a:0 "拿实话把流言压了下去。"
 tv_engineering_department.7177.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]校准了场地尺度"
 tv_engineering_department.7177.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]在场地里找出了多余的空间，[tv_wonder_scale_competence|E]因此稳步提高。\n\n#G 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力高于50。#!"
 tv_engineering_department.7177.a:0 "给这个方案，留出了足够的余地。"
 tv_engineering_department.7178.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]理顺了工棚名册"
 tv_engineering_department.7178.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]理顺了工队、工具和夜班之间的混乱，[tv_wonder_organization_competence|E]因此稳步提高。\n\n#G 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力高于50。#!"
 tv_engineering_department.7178.a:0 "把工队、工具和更次都理顺了。"
 tv_engineering_department.7179.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]疏通了补给车队"
 tv_engineering_department.7179.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]解开了车队日程上最难缠的一个结，[tv_wonder_logistics_competence|E]因此稳步提高。\n\n#G 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力高于50。#!"
 tv_engineering_department.7179.a:0 "解开了补给线上最糟的死结。"
 tv_engineering_department.7180.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]补上了关键部件"
 tv_engineering_department.7180.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]把一个关键部件装上了，[tv_wonder_construction|E]进度因此稳步提高。\n\n#G 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力高于50。#!"
 tv_engineering_department.7180.a:0 "即刻推进，毫不耽搁！"
 tv_engineering_department.7181.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]决定拿工地去赌人心"
 tv_engineering_department.7181.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]把还没完工的部分提前展示给了公众。这个决定可能提高[tv_wonder_domestic_support|E]，也可能让工地付出代价。\n\n#Y 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力处于20到80之间。#!"
 tv_engineering_department.7181.a:0 "任由人群评判这堆未完工的石头。"
 tv_engineering_department.7182.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]执意放大了蓝图"
 tv_engineering_department.7182.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]在疑虑还没消除之前，就下令扩大了图纸。这个决定可能提高[tv_wonder_scale_competence|E]，也可能让工地付出代价。\n\n#Y 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力处于20到80之间。#!"
 tv_engineering_department.7182.a:0 "趁疑虑未消，先把蓝图放大。"
 tv_engineering_department.7183.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]当场改了排班"
 tv_engineering_department.7183.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]在一个下午之内改写了班次安排。这个决定可能提高[tv_wonder_organization_competence|E]，也可能让工地付出代价。\n\n#Y 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力处于20到80之间。#!"
 tv_engineering_department.7183.a:0 "我们改写班次，看工地能否跟得上。"
 tv_engineering_department.7184.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]让车队改走险路"
 tv_engineering_department.7184.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]让车队改走一条更难走的路。这个决定可能提高[tv_wonder_logistics_competence|E]，也可能让工地付出代价。\n\n#Y 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力处于20到80之间。#!"
 tv_engineering_department.7184.a:0 "让车队改走这条难路，赌的是算得准，不是图省事。"
 tv_engineering_department.7185.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]强行试了新工法"
 tv_engineering_department.7185.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]在最显眼的部件上试用了一种更快的工法。这个决定可能提高[tv_wonder_construction|E]进度，也可能让工地付出代价。\n\n#Y 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力处于20到80之间。#!"
 tv_engineering_department.7185.a:0 "试试这更快的工法，就让它当众见分晓！"
 tv_engineering_department.7186.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]把修补费用算漏了"
 tv_engineering_department.7186.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]低估了一项维修的花费。工程还能继续，但[gold|E]要为这次疏忽受损。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7186.a:0 "先把这笔亏空补上，免得账目被人追问。"
 tv_engineering_department.7187.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]把王命用得太随手了"
 tv_engineering_department.7187.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]把王室的名义用得太随意了。工程还能继续，但[legitimacy|E]要为这次疏忽受损。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7187.a:0 "这次滥用王室名义的做法，得收一收。"
 tv_engineering_department.7188.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]低估了施工扰动"
 tv_engineering_department.7188.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]低估了一项工程方案会引起多大的动静。工程还能继续，但[stability|E]要为这次疏忽受损。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7188.a:0 "把这套整齐方案惹出的骚动抚平。"
 tv_engineering_department.7189.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]把话说得太满了"
 tv_engineering_department.7189.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]在工程还没做出成绩之前，就把话说满了。工程还能继续，但[prestige|E]要为这次疏忽受损。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7189.a:0 "把话收回来！"
 tv_engineering_department.7190.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]把贵族耐性当成了存货"
 tv_engineering_department.7190.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]把贵族的耐心当成了可以随时支取的储备。工程还能继续，但贵族[estate_satisfaction|E]要为这次疏忽受损。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7190.a:0 "提醒工程师，贵族的耐性可不是随取随用的库存。"
 tv_engineering_department.7191.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]把祭坛也卷进了工期"
 tv_engineering_department.7191.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]把宗教日程当成了普通的运输安排来对待。工程还能继续，但教士[estate_satisfaction|E]要为这次疏忽受损。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7191.a:0 "把祭坛的日历还给祭坛自己。"
 tv_engineering_department.7192.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]拿商路给工地让了道"
 tv_engineering_department.7192.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]为了让工程线路更顺畅，挡住了平常的买卖。工程还能继续，但市民[estate_satisfaction|E]要为这次疏忽受损。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7192.a:0 "我们把工地挡住的商路重新开出来。"
 tv_engineering_department.7193.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]把村社余力看多了"
 tv_engineering_department.7193.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]把已经疲惫的村社当成了还没动用的人手。工程还能继续，但平民[estate_satisfaction|E]要为这次疏忽受损。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7193.a:0 "让已经疲惫的村社喘一口气，别再被当储备使唤。"
 tv_engineering_department.7194.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]把工址拆过了头"
 tv_engineering_department.7194.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]拆错了当地的一处安排，还把这个缺口当成可用的空间。工程还能继续，但工址[development|E]要为这次疏忽受损。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7194.a:0 "把这处切错的地方重新补上。"
 tv_engineering_department.7195.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]挤掉了工址生计"
 tv_engineering_department.7195.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]为了腾出场地，挤走了当地的一些生计。工程还能继续，但工址[prosperity|E]要为这次疏忽受损。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7195.a:0 "我们把被工地挤走的生计再腾出些地方。"
 tv_engineering_department.7196.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]误动了首都余裕"
 tv_engineering_department.7196.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]挪用了首都的一些资源，像是忘了首都本身也有安排。工程还能继续，但首都[development|E]要为这次疏忽受损。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7196.a:0 "把这些被挪用的资源还给首都自己的安排。"
 tv_engineering_department.7197.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]拖慢了王城买卖"
 tv_engineering_department.7197.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]为了解决本地的工程问题，扰乱了首都的生意。工程还能继续，但首都[prosperity|E]要为这次疏忽受损。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7197.a:0 "我们先把王城的生意稳下来，别让乱子扩散。"
 tv_engineering_department.7198.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]看错了劳工的极限"
 tv_engineering_department.7198.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]看错了劳工体力的极限。工程还能继续，但工址劳工[population|E]要为这次疏忽受损。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7198.a:0 "先松一松，别再累垮更多人！"
 tv_engineering_department.7199.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]把账册彻底拖垮了"
 tv_engineering_department.7199.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]让一个本可以避免的失误捅穿了账目，花掉了一大笔说不清楚的钱。这个错误还不至于让奇观停工，这大概才是最让人难堪的地方。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于20。#!"
 tv_engineering_department.7199.a:0 "咬牙认下这笔亏空，悄悄合上账册。"
 tv_engineering_department.7200.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]把王命也拖下了水"
 tv_engineering_department.7200.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]把一次本可以避免的现场失误，变成了王室脸上一道看得见的伤痕。这个错误还不至于让奇观停工，这大概才是最让人难堪的地方。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于20。#!"
 tv_engineering_department.7200.a:0 "这道新添的伤痕，我们记下，继续往前走。"
 tv_engineering_department.7201.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]把地方搅成了一团"
 tv_engineering_department.7201.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]为了解决工地上的问题，把地方推入了不必要的动荡。这个错误还不至于让奇观停工，这大概才是最让人难堪的地方。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于20。#!"
 tv_engineering_department.7201.a:0 "由着这场动乱自行平息。"
 tv_engineering_department.7202.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]把宫廷体面也赔进去了"
 tv_engineering_department.7202.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]把工地闹成了一场公开的笑话，连带丢了宫廷的脸面。这个错误还不至于让奇观停工，这大概才是最让人难堪的地方。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于20。#!"
 tv_engineering_department.7202.a:0 "就让宫廷看这出热闹去吧！"
 tv_engineering_department.7203.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]把贵族彻底惹恼了"
 tv_engineering_department.7203.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]动用了贵族的特权来填补工地上的失误，惹恼了各大家族。这个错误还不至于让奇观停工，这大概才是最让人难堪的地方。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于20。#!"
 tv_engineering_department.7203.a:0 "拿贵族的情面换工程继续推进。"
 tv_engineering_department.7204.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]把教士也得罪透了"
 tv_engineering_department.7204.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]让宗教上的耐心为世俗的石料买了单，冒犯了教士。这个错误还不至于让奇观停工，这大概才是最让人难堪的地方。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于20。#!"
 tv_engineering_department.7204.a:0 "让教士的这份耐心，替这些石料买了单。"
 tv_engineering_department.7205.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]把市民逼出了火气"
 tv_engineering_department.7205.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]把市面上的生意当成了可以随意挪用的东西，惹恼了市民。这个错误还不至于让奇观停工，这大概才是最让人难堪的地方。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于20。#!"
 tv_engineering_department.7205.a:0 "由商人自己去修补那些脚手架。"
 tv_engineering_department.7206.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]把村社压到了极限"
 tv_engineering_department.7206.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]提出了一个本可以避免的要求，耗尽了村社的耐心。这个错误还不至于让奇观停工，这大概才是最让人难堪的地方。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于20。#!"
 tv_engineering_department.7206.a:0 "这份本可以省去的要求，我们向村社赔个不是。"
 tv_engineering_department.7207.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]先把工址折腾坏了"
 tv_engineering_department.7207.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]为了解决技术问题，损毁了当地的一些设施。这个错误还不至于让奇观停工，这大概才是最让人难堪的地方。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于20。#!"
 tv_engineering_department.7207.a:0 "草草包扎了那道由抢修引出的创伤。"
 tv_engineering_department.7208.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]把工址买卖压熄了"
 tv_engineering_department.7208.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]一次本可以避免的决定，让工址周边的市场彻底冷清了下来。这个错误还不至于让奇观停工，这大概才是最让人难堪的地方。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于20。#!"
 tv_engineering_department.7208.a:0 "罢了——就让摊位安静下来吧！"
 tv_engineering_department.7209.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]掏空了首都安排"
 tv_engineering_department.7209.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]为了掩盖工地上的失误，掏空了首都原本的规划。这个错误还不至于让奇观停工，这大概才是最让人难堪的地方。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于20。#!"
 tv_engineering_department.7209.a:0 "掏空首都的规划，来填补工地的这个窟窿。"
 tv_engineering_department.7210.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]把王城生意也压冷了"
 tv_engineering_department.7210.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]让一次本不该传到市面上的失败，压暗了首都的繁荣。这个错误还不至于让奇观停工，这大概才是最让人难堪的地方。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于20。#!"
 tv_engineering_department.7210.a:0 "这场本不该传到市面上的失败，还是让首都的生意暗淡了下去。"
 tv_engineering_department.7211.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]把失误变成了伤亡"
 tv_engineering_department.7211.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]让一次本可以避免的失误穿过了工队，造成了人员伤亡。这个错误还不至于让奇观停工，这大概才是最让人难堪的地方。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于20。#!"
 tv_engineering_department.7211.a:0 "清点了那些工队本不该失去的性命。"
