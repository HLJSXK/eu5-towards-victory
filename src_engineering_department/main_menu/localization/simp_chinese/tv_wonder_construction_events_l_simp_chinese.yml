 tv_engineering_department.7039.d:0 "工程部门这个月做了个决定：先在[prestige|E]上退一步，才能让[tv_wonder_organization_competence|E]往前挪一步。这笔账划得来，只是退让的这部分，往后是要有人惦记的。"
 tv_engineering_department.7039.a:0 "就这么办！"
 tv_engineering_department.7039.b:0 "我们按兵不动，留住这份底子。"
