 tv_engineering_department.7195.t:0 "建设：[tv_great_engineer|E]挤掉了工址生计"
 tv_engineering_department.7195.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]为了腾出场地，挤走了当地的一些生计。工程还能继续，但工址[prosperity|E]要为这次疏忽受损。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7195.a:0 "我们把被工地挤走的生计再腾出些地方。"
 tv_engineering_department.7196.t:0 "建设：[tv_great_engineer|E]误动了首都余裕"
 tv_engineering_department.7196.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]挪用了首都的一些资源，像是忘了首都本身也有安排。工程还能继续，但首都[development|E]要为这次疏忽受损。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7196.a:0 "把这些被挪用的资源还给首都自己的安排。"
 tv_engineering_department.7197.t:0 "建设：[tv_great_engineer|E]拖慢了王城买卖"
 tv_engineering_department.7197.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]为了解决本地的工程问题，扰乱了首都的生意。工程还能继续，但首都[prosperity|E]要为这次疏忽受损。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7197.a:0 "我们先把王城的生意稳下来，别让乱子扩散。"
 tv_engineering_department.7198.t:0 "建设：[tv_great_engineer|E]看错了劳工的极限"
 tv_engineering_department.7198.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]看错了劳工体力的极限。工程还能继续，但工址劳工[population|E]要为这次疏忽受损。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7198.a:0 "先松一松，别再累垮更多人！"
 tv_engineering_department.7199.t:0 "建设：[tv_great_engineer|E]把账册彻底拖垮了"
 tv_engineering_department.7199.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]让一个本可以避免的失误捅穿了账目，花掉了一大笔说不清楚的钱。这个错误还不至于让奇观停工，这大概才是最让人难堪的地方。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于20。#!"
 tv_engineering_department.7199.a:0 "咬牙认下这笔亏空，悄悄合上账册。"
 tv_engineering_department.7200.t:0 "建设：[tv_great_engineer|E]把王命也拖下了水"
 tv_engineering_department.7200.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]把一次本可以避免的现场失误，变成了王室脸上一道看得见的伤痕。这个错误还不至于让奇观停工，这大概才是最让人难堪的地方。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于20。#!"
 tv_engineering_department.7200.a:0 "这道新添的伤痕，我们记下，继续往前走。"
 tv_engineering_department.7201.t:0 "建设：[tv_great_engineer|E]把地方搅成了一团"
 tv_engineering_department.7201.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]为了解决工地上的问题，把地方推入了不必要的动荡。这个错误还不至于让奇观停工，这大概才是最让人难堪的地方。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于20。#!"
 tv_engineering_department.7201.a:0 "由着这场动乱自行平息。"
 tv_engineering_department.7202.t:0 "建设：[tv_great_engineer|E]把宫廷体面也赔进去了"
 tv_engineering_department.7202.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]把工地闹成了一场公开的笑话，连带丢了宫廷的脸面。这个错误还不至于让奇观停工，这大概才是最让人难堪的地方。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于20。#!"
