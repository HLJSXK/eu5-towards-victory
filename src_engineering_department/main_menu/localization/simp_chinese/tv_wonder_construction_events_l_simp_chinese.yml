 tv_engineering_department.7000.t:0 "建设：围栏外开始叫好"
 tv_engineering_department.7000.d:0 "围栏外的议论好转了不少，行会愿意出面具名支持，乡绅也不再多问，路人渐渐开始把这项工程说成一件体面事。[tv_wonder_domestic_support|E]也就跟着大幅提高了。"
 tv_engineering_department.7000.a:0 "就顺着行会这份支持，把工程继续办下去。"
 tv_engineering_department.7001.t:0 "建设：测线证明还能扩建"
 tv_engineering_department.7001.d:0 "新的测量结果显示，地基其实能承受更大的建筑规模，图纸上原本显得偏大的方案，如今总算有了着落，[tv_wonder_scale_competence|E]也因此大幅提高。"
 tv_engineering_department.7001.a:0 "照这次测量的结果，把地基铺得更宽一些。"
 tv_engineering_department.7002.t:0 "建设：名册与工序终于对上"
 tv_engineering_department.7002.d:0 "新的名册贴到了工棚里，各工种该在哪里上工、什么时候换班，都写得清清楚楚。混乱的地方少了不少，[tv_wonder_organization_competence|E]也因此大幅提高。"
 tv_engineering_department.7002.a:0 "把新名册定下来，免得又乱回去。"
 tv_engineering_department.7003.t:0 "建设：补给线终于跑顺了"
 tv_engineering_department.7003.d:0 "一条更顺的路线，把道路、水路、堆场和脚手架都连了起来，第一支走这条路的车队准时到达，没有耽误一点工夫，[tv_wonder_logistics_competence|E]也因此大幅提高。"
 tv_engineering_department.7003.a:0 "车队就照这个点，继续跑下去！"
 tv_engineering_department.7004.t:0 "建设：主工段提前越过标线"
 tv_engineering_department.7004.d:0 "当前部件在天黑之前，就越过了原本定下的标线，起吊、拼接和人手这次都配合得很顺，[tv_wonder_construction|E]的进度也因此大幅往前推进了一截。"
 tv_engineering_department.7004.a:0 "让施工照这个势头，继续往前赶。"
 tv_engineering_department.7005.t:0 "建设：工地外的议论缓下来了"
 tv_engineering_department.7005.d:0 "工地外的闲话少了一些，石料车经过的时候，也没人再挡道拦路了。这算不上什么大事，但[tv_wonder_domestic_support|E]确实往前挪动了一些。"
 tv_engineering_department.7005.a:0 "先把路让开，争论也就慢慢平息了。"
 tv_engineering_department.7006.t:0 "建设：图纸上的误差被纠正"
 tv_engineering_department.7006.d:0 "一处狭窄的转角被重新改过，主轴线也跟着宽了一些。这改动不算大，但[tv_wonder_scale_competence|E]确实提高了一点。"
 tv_engineering_department.7006.a:0 "把这条路拓宽，图纸也就宽松一些。"
 tv_engineering_department.7007.t:0 "建设：工棚里的交接终于理顺"
 tv_engineering_department.7007.d:0 "几处一直被漏掉的交接工作，这次都补上了，工具怎么放、夜班怎么排、守卫怎么值，也都一一说清楚了。[tv_wonder_organization_competence|E]因此有所改善。"
 tv_engineering_department.7007.a:0 "把交接的漏洞补上，工具就不会再停摆。"
 tv_engineering_department.7008.t:0 "建设：补给线的坏转角被改掉"
 tv_engineering_department.7008.d:0 "补给线上一处不好走的转弯被改直了，空着回去的车少了，路上摔坏的货也少了，[tv_wonder_logistics_competence|E]因此有所改善。"
 tv_engineering_department.7008.a:0 "早点把这处转角改掉，免得更多货摔坏。"
 tv_engineering_department.7009.t:0 "建设：关键接口终于合上"
 tv_engineering_department.7009.d:0 "一处拖了很久的接口，这次终于装上了，下一批工匠不用再多等一个月才能动手。[tv_wonder_construction|E]的进度也因此稳步往前推进。"
 tv_engineering_department.7009.a:0 "终于装上了！"
 tv_engineering_department.7010.t:0 "建设：国库拨款稳住民心"
 tv_engineering_department.7010.d:0 "城门口聚了一群人，抱怨奇观工程把本该救济穷人的粮食都占去了。国库要是肯当街拿出[gold|E]放赈，这些抱怨应该能平息下去，[tv_wonder_domestic_support|E]也会跟着回升。不过这笔钱一旦花出去，就没有再收回来的道理了。"
 tv_engineering_department.7010.a:0 "当街放款,堵住众口。"
 tv_engineering_department.7010.b:0 "账本本就吃紧,不能再当众撒钱。"
 tv_engineering_department.7011.t:0 "建设：王命压下反对声"
 tv_engineering_department.7011.d:0 "一名乡间教士向信众宣讲，说这奇观是出于君王的傲慢，并非王权本该拥有的权利。国王要是肯动用[legitimacy|E]，颁下一道正式诏书，流言应该就能压下去，[tv_wonder_domestic_support|E]也能稳住。只是这件事得赶在流言传得更远之前办妥才行。"
 tv_engineering_department.7011.a:0 "盖上诏书,让王命压下流言。"
 tv_engineering_department.7011.b:0 "为一个教士的抱怨动用王命,反倒显得心虚。"
 tv_engineering_department.7012.t:0 "建设：地方让路，民议转缓"
 tv_engineering_department.7012.d:0 "新修的采石道正好要穿过两个村庄的公地。要是动用[stability|E]强行把村子迁走，路是能通了，那些盼着工程早日完工的人也会认可这份[tv_wonder_domestic_support|E]。只是这么一来，原本和这两个村子相安无事的日子，也就到头了。"
 tv_engineering_department.7012.a:0 "下令迁村,让道路照原计划修下去。"
 tv_engineering_department.7012.b:0 "为了少绕点路,不值得动两个村子的地。"
 tv_engineering_department.7013.t:0 "建设：宫廷声望为工地背书"
 tv_engineering_department.7013.d:0 "邻国的使节私下里议论，说这奇观是国库根本撑不起的虚荣工程。要是肯动用[prestige|E]，设下一场盛宴款待他们，或许能让他们带回去的说法有所不同，[tv_wonder_domestic_support|E]也能提升一些。只是王室的脸面这种东西，一旦用在款待客人上，不是轻易就能补回来的。"
 tv_engineering_department.7013.a:0 "破费设宴,换使节带回不同的说法。"
 tv_engineering_department.7013.b:0 "外邦闲话,不值得搭上王室的脸面。"
 tv_engineering_department.7014.t:0 "建设：贵族默许工程继续"
 tv_engineering_department.7014.d:0 "工地的石匠想借用一位贵族的猎场，用来堆放木材。他倒是肯让出这块地，但要王室欠他一份人情，这份人情要记在贵族[estate_satisfaction|E]的账上。等这份人情花出去，木材运送顺畅起来之后，[tv_wonder_domestic_support|E]也能跟着回升。"
 tv_engineering_department.7014.a:0 "应下人情,拿下那块地。"
 tv_engineering_department.7014.b:0 "为了一块地欠贵族的情,不划算。"
 tv_engineering_department.7015.t:0 "建设：教士暂时收起异议"
 tv_engineering_department.7015.d:0 "工地的铸造匠想把教区的钟征用过来，重铸成配件。堂区的教士倒是可以对空荡荡的钟楼睁一只眼闭一只眼，但这要耗掉教士这边的[estate_satisfaction|E]。这笔代价花下去，总比让脚手架烂在半空要划算，[tv_wonder_domestic_support|E]也能因此回升。"
 tv_engineering_department.7015.a:0 "正式知会教士,把钟送去熔铸。"
 tv_engineering_department.7015.b:0 "空钟楼引来的闲话,比那点配件更麻烦。"
 tv_engineering_department.7016.t:0 "建设：商人把便利让给工地"
 tv_engineering_department.7016.d:0 "工地的供料车队，一到送货的日子就把集市广场堵得死死的。行会的会长倒是愿意让摊位给车队让出路来，但这要耗掉市民这边的[estate_satisfaction|E]。等广场不再和车队互相堵着路了，这笔代价也还能换回一些[tv_wonder_domestic_support|E]。"
 tv_engineering_department.7016.a:0 "亲自与行会商量,让车队通行。"
 tv_engineering_department.7016.b:0 "罚车夫的款,比求行会通融省事。"
 tv_engineering_department.7017.t:0 "建设：村社再挤出一口余力"
 tv_engineering_department.7017.d:0 "工头想把徭役的队伍留到收获季过后，好赶在上冻之前把地基做完。村里的长老倒是愿意配合，但这要耗掉平民这边的[estate_satisfaction|E]。花掉这笔代价，总比让地基在冬天里烂尾要好，[tv_wonder_domestic_support|E]也能因此保住。"
 tv_engineering_department.7017.a:0 "明说清楚,把徭役队留到收获之后。"
 tv_engineering_department.7017.b:0 "地基能等,收获等不得。"
 tv_engineering_department.7018.t:0 "建设：拆开街区安抚了议论"
 tv_engineering_department.7018.d:0 "石匠说工地太窄，不把旁边那排民房拆掉，下一层根本砌不起来。要是下令把房子拆了，拆房的时候会耗掉工地的[development|E]，不过工程能因此重新推进下去，[tv_wonder_domestic_support|E]也会跟着回升。"
 tv_engineering_department.7018.a:0 "下令拆房,腾出工地。"
 tv_engineering_department.7018.b:0 "工地窄一点,总好过一整条街的人被赶走。"
 tv_engineering_department.7019.t:0 "建设：工地吸走了本地买卖"
 tv_engineering_department.7019.d:0 "本地的车夫和石匠一直被抽调去供应工地，自己原本的营生也就顾不上了。要是任由这种情况继续下去，工地这边的[prosperity|E]会慢慢被耗掉，本地的买卖也会跟着冷清下来。不过物料的供应能因此更稳当一些，这也会被看作是值得肯定的[tv_wonder_domestic_support|E]。"
 tv_engineering_department.7019.a:0 "让本地买卖继续为工地让路。"
 tv_engineering_department.7019.b:0 "本镇日常买卖,比工地送货快慢更要紧。"
 tv_engineering_department.7020.t:0 "建设：首都工程为奇观让路"
 tv_engineering_department.7020.d:0 "首都自家的桥梁维修，因为石匠都被抽调去了奇观工地，一直搁置着没能完工。要是继续把这些人留在工地上，首都这边的[development|E]会跟着耗掉，桥梁也会一直搁在那里修不好。不过工程的进度和[tv_wonder_domestic_support|E]，倒是能因此维持住。"
 tv_engineering_department.7020.a:0 "让石匠留在工地,桥先放一放。"
 tv_engineering_department.7020.b:0 "首都自家的桥,等不了奇观的工期。"
 tv_engineering_department.7021.t:0 "建设：王城商路转向工地"
 tv_engineering_department.7021.d:0 "工程的采买人手，用本地市场根本出不起的价钱，四处抢购首都的木材和石料。要是任由这种采买继续下去，首都这边的[prosperity|E]会被慢慢耗掉，工地周边的商贸也会跟着萎缩下去。不过工地能因此持续得到供给，[tv_wonder_domestic_support|E]也能维持住。"
 tv_engineering_department.7021.a:0 "任由采买继续,供给工地。"
 tv_engineering_department.7021.b:0 "不能为了一个工程,榨干首都自己的市面。"
 tv_engineering_department.7022.t:0 "建设：劳工多熬了一个月"
 tv_engineering_department.7022.d:0 "工头想把夜班的人手翻上一倍，好把上次上冻耽误的工期补回来。要是下令加班，工地劳工这边的[population|E]会被消耗掉，额外的工时也会一点点拖垮他们。不过工程能因此加快进度，[tv_wonder_domestic_support|E]也会跟着提升。"
 tv_engineering_department.7022.a:0 "加倍夜班,把工期赶上来。"
 tv_engineering_department.7022.b:0 "累垮的劳工,干活比歇够的更慢。"
 tv_engineering_department.7023.t:0 "建设：追加拨款扩出基址"
 tv_engineering_department.7023.d:0 "石匠把加宽的地基图纸摆到财务官桌上，说秋雨还没到，趁这段时间加派人手，地基就能撑得住。财务官现在放行金币雇工加做，方案便能定下来；不然的话，就只能等明年重新勘测了。"
 tv_engineering_department.7023.a:0 "拨出金币,让石匠趁秋雨前铺好加宽的地基。"
 tv_engineering_department.7023.b:0 "先扣住这笔钱,雨季照样等到明年再说。"
 tv_engineering_department.7024.t:0 "建设：王命压出了更大的蓝图"
 tv_engineering_department.7024.d:0 "测量员的界桩，在邻地的篱笆前停了下来，邻家不肯放行。一道王命今天就能把这场界限之争压下去，但把王命用在一处篱笆纠纷上，这件事不会没人注意到。"
 tv_engineering_department.7024.a:0 "发下王命,把王室的名号压在这块争议地界上。"
 tv_engineering_department.7024.b:0 "让篱笆留着,王命不必花在一场篱笆纠纷上。"
 tv_engineering_department.7025.t:0 "建设：地方退让，工地得以扩展"
 tv_engineering_department.7025.d:0 "加宽的方案，正好要穿过一处村社的公共牧场。现在把界石移进村里，勘测的问题就能定下来，但村民不会忘记，是谁把界石挪走的。"
 tv_engineering_department.7025.a:0 "移动界石,把勘测定在更大的地基上。"
 tv_engineering_department.7025.b:0 "牧场照旧,不值得为了一条勘测线得罪一个村子。"
 tv_engineering_department.7026.t:0 "建设：宫廷声望托住了扩建"
 tv_engineering_department.7026.d:0 "一位外国名匠愿意为加宽的方案背书，条件是把宫廷的名字，列进他本国行会的记录里，当作靠山。这份背书今天就能把尺寸的问题定下来，但这份请求已经公开出去了，没法再收回来。"
 tv_engineering_department.7026.a:0 "应允背书,采信名匠对加宽方案的判断。"
 tv_engineering_department.7026.b:0 "不把宫廷的名字押上,一本外国行会的名册不值得。"
 tv_engineering_department.7027.t:0 "建设：贵族默许更大的规模"
 tv_engineering_department.7027.d:0 "加宽的地基方案，正好压过本地男爵一直用来狩猎的地界。请他这段时间闭口不提，就能证明更大的规模站得住，但今天向他借来的耐心，日后他是要讨回去的。"
 tv_engineering_department.7027.a:0 "请男爵通融,让测量员在他的猎场上把勘测做完。"
 tv_engineering_department.7027.b:0 "绕开男爵的猎场,他的好感不值得为一条勘测线花掉。"
 tv_engineering_department.7028.t:0 "建设：教士为扩建让出余地"
 tv_engineering_department.7028.d:0 "加宽方案要占用教区世代守着的一角圣地。神父们若被好好求告，是会准许在那里勘测的，但请教士让出圣地给脚手架用，这份人情是花掉了，不是借来的。"
 tv_engineering_department.7028.a:0 "请神父们让出那一角,把加宽的勘测定下来。"
 tv_engineering_department.7028.b:0 "勘测仍留在旧界内,圣地不是用来试探的地方。"
 tv_engineering_department.7029.t:0 "建设：商路让出更多空间"
 tv_engineering_department.7029.d:0 "加宽的地基会把呢绒商赶集时走的那条巷子占掉。行会长老若被求告，是会准许绕道的，但市民把自家街巷借给工地用，这份不便，他们记得比勘测还要久。"
 tv_engineering_department.7029.a:0 "请行会长老准许绕道,把加宽的地基定在那条巷子上。"
 tv_engineering_department.7029.b:0 "别动商人的巷子,集市的好感不该花在一条勘测线上。"
 tv_engineering_department.7030.t:0 "建设：村社再出力，工地得以扩展"
 tv_engineering_department.7030.d:0 "工头说，只要附近村子这周把人手派来挖土，而不是留着照管自家田地，加宽的地基这周就能验实。村子会听从管家的调派，但农忙时节征来的劳役，到了秋天不会被忘记。"
 tv_engineering_department.7030.a:0 "征调村子的劳役,趁这周把加宽的地基挖实。"
 tv_engineering_department.7030.b:0 "让村子留在自家田里,雇工的事可以再等等。"
 tv_engineering_department.7031.t:0 "建设：拆开的街区腾出尺度"
 tv_engineering_department.7031.d:0 "要把加宽的地基对齐，唯一的办法，是拆掉工地边上已经立起来的一排作坊。它们的石料和地基，正好能填进新方案里，但已经建起来的东西，一旦拆掉，就是拆掉了。"
 tv_engineering_department.7031.a:0 "拆掉那排作坊,把石料并入加宽的地基。"
 tv_engineering_department.7031.b:0 "作坊留着,工地往别处扩就是。"
 tv_engineering_department.7032.t:0 "建设：本地买卖供出了扩建空间"
 tv_engineering_department.7032.d:0 "工地上的木料商，今天就有存货和大车，能运土来填实加宽的地基，只要他们把自家生意先放一放，专供王室这一单。工地的买卖会因此转向工程这边，但一条被拉向一个买家的商路，不会自己转回来。"
 tv_engineering_department.7032.a:0 "把本地买卖转向工程,运土填实加宽的地基。"
 tv_engineering_department.7032.b:0 "让商人照常做他们的生意,填土的事另想办法。"
 tv_engineering_department.7033.t:0 "建设：首都修缮让位给扩建"
 tv_engineering_department.7033.d:0 "首都自家的补路工和营造匠，是这个月唯一腾得出手来做复核勘测的人手。把他们从首都自己的营缮上抽走，加宽的问题就能定下来，但首都的街面，会露出他们留下的空档。"
 tv_engineering_department.7033.a:0 "抽调首都的工匠,让他们把加宽的勘测确认下来。"
 tv_engineering_department.7033.b:0 "首都的营缮不动,勘测的事等别处腾出人手。"
 tv_engineering_department.7034.t:0 "建设：王城商气托起更大规模"
 tv_engineering_department.7034.d:0 "首都的行会愿意用这一季的进项，垫付复核勘测的花销，只是要在冬市结账之前把钱支出来。首都的市面能证明加宽的方案站得住，但一季的进项转去供一座奇观，行会日后是要问个明白的。"
 tv_engineering_department.7034.a:0 "支用首都这季的进项,趁冬市结账前把加宽的方案确认下来。"
 tv_engineering_department.7034.b:0 "行会的账本不动,勘测的事等国库出钱。"
 tv_engineering_department.7035.t:0 "建设：劳工把尺度硬撑了出来"
 tv_engineering_department.7035.d:0 "工头说，只要工地上现有的工匠这个月不歇工，加宽的地基这个月就能验实。勘测能就此把更大的方案定下来，但被逼着超出常例做工的劳工，不是人人都还留得住的。"
 tv_engineering_department.7035.a:0 "让工匠们不歇工,这个月就把加宽的地基定下来。"
 tv_engineering_department.7035.b:0 "让工匠照常歇工,勘测的事可以慢慢来。"
 tv_engineering_department.7036.t:0 "建设：追加拨款整顿工序"
 tv_engineering_department.7036.d:0 "工头想请一位专司文书的监工，重新画出排班表并张贴到工人都能看清的地方。国库要是肯出钱雇下这个人和笔墨，新的排班表贴出来之后，[tv_wonder_organization_competence|E]也会随之而来。"
 tv_engineering_department.7036.a:0 "我们雇下这位文书,今天就把新排班表贴出去。"
 tv_engineering_department.7036.b:0 "旧排班表撑到现在也没出大乱子,再撑一阵无妨。"
 tv_engineering_department.7037.t:0 "建设：王命压住了工地杂音"
 tv_engineering_department.7037.d:0 "工地上有两支行会队伍，谁都不肯听对方工头的号令，这场争执这周已经两次拖住了早班的开工。要平息这场争执，只有一纸盖着王命[legitimacy|E]的文书才压得住场面，先后次序一定下来，[tv_wonder_organization_competence|E]便会随之而来。"
 tv_engineering_department.7037.a:0 "文书已拟好加印,两队人马要么服从,要么就都别干了。"
 tv_engineering_department.7037.b:0 "王命不该用来评断哪个石匠嗓门更大。"
 tv_engineering_department.7038.t:0 "建设：地方让路，排班得以重整"
 tv_engineering_department.7038.d:0 "征调来的村社劳工，排班表还是按老日程排的，从来没算过农忙的事，一到收割的时候，半数工人就扔下活计回乡去了。硬把新排班表压下去推行，会耗掉国家的[stability|E]，不过工人从此能守着固定的时辰上工，[tv_wonder_organization_competence|E]也会随之而来。"
 tv_engineering_department.7038.a:0 "我们把新排班表压下去执行,这一次让收成给奇观让路。"
 tv_engineering_department.7038.b:0 "现在硬来,只会把一个缺口换成更大的缺口。"
 tv_engineering_department.7039.t:0 "建设：宫廷声望替工地立规矩"
 tv_engineering_department.7039.d:0 "老石匠们不肯听从被派来重整排班的年轻监工，还当着满场工人的面把话说出来。要压住这场面，得靠一个借着宫廷[prestige|E]撑腰的名号才行，等他们服软下来，[tv_wonder_organization_competence|E]便会随之而来。"
 tv_engineering_department.7039.a:0 "我们把宫廷的名号借给这位监工,老石匠们至少会服这个。"
 tv_engineering_department.7039.b:0 "监工的威信该在工地上挣来,不该向宫里去借。"
 tv_engineering_department.7040.t:0 "建设：贵族默许新的调度"
 tv_engineering_department.7040.d:0 "邻近的贵族愿意把自己府里的管家借出来，帮着重排工队，这位管家打理庄园的排班已经有二十年了。领下这份人情，得付出贵族[estate_satisfaction|E]的代价，不过管家排定的班表一用起来，[tv_wonder_organization_competence|E]也会随之而来。"
 tv_engineering_department.7040.a:0 "我们接受这位管家,欠贵族的这份人情记下便是。"
 tv_engineering_department.7040.b:0 "欠这位贵族的人情,比一份齐整的排班表贵重得多。"
 tv_engineering_department.7041.t:0 "建设：教士让步，工地重排工序"
 tv_engineering_department.7041.d:0 "工地换班一向跟着大教堂的钟声走，钟声却不会为了一座奇观改动。请教士团为换班多敲一次钟，会耗去教士[estate_satisfaction|E]，不过工人交接岗位从此能准时了，[tv_wonder_organization_competence|E]也会随之而来。"
 tv_engineering_department.7041.a:0 "我们向教士团请求多敲这一次钟,不管他们如何抱怨。"
 tv_engineering_department.7041.b:0 "钟声报的是天主的时辰,不是监工换班的信号。"
 tv_engineering_department.7042.t:0 "建设：商人让出调度空间"
 tv_engineering_department.7042.d:0 "运料的大车如今每天要两次穿过市集广场，行会的摊主们最好的时辰都被喧闹和泥泞占去了。按固定时段为大车清场，会耗去市民[estate_satisfaction|E]，不过大车终于能按时抵达，工队也能据此排班，[tv_wonder_organization_competence|E]也会随之而来。"
 tv_engineering_department.7042.a:0 "我们定下时段清场,不管摊位摆不摆得下。"
 tv_engineering_department.7042.b:0 "市集先养活这座城,再谈奇观。"
 tv_engineering_department.7043.t:0 "建设：村社出力，工地重新归整"
 tv_engineering_department.7043.d:0 "眼下工队人手已经硬撑着两班的活计，只能再请周边村社送来一批轮换的人手。在播种和收获之间把他们从自家地里拉走，会耗去平民[estate_satisfaction|E]，不过有了完整的第二班轮换，工地终于能排出正经的班次，[tv_wonder_organization_competence|E]也会随之而来。"
 tv_engineering_department.7043.a:0 "我们征调第二班轮换人手,地里的活计只能先放一放。"
 tv_engineering_department.7043.b:0 "秋天荒了的田地,比一份凌乱的班表更伤国本。"
 tv_engineering_department.7044.t:0 "建设：拆开街区重排工队"
 tv_engineering_department.7044.d:0 "堆料场太过狭窄，工队彼此都得停下手里的活才能挪出路来，这样的拥堵每天早上都要白白耗掉一个时辰。拆掉相邻的街区，腾出一片正经的场地，会耗去工地的[development|E]，不过工队从此不用再互相绊脚，[tv_wonder_organization_competence|E]也会随之而来。"
 tv_engineering_department.7044.a:0 "我们拆掉这片街区,给工队腾出走动的空间。"
 tv_engineering_department.7044.b:0 "街区留着,拥挤的场地总比拆掉的场地划算。"
 tv_engineering_department.7045.t:0 "建设：本地生计为工序让位"
 tv_engineering_department.7045.d:0 "原本为工地跑腿的本地车夫和脚夫，已经被悄悄改派去运送奇观所需的材料了，工地周边寻常的生意也因此清淡下来。把这个安排正式定下来，把这些人手固定纳入奇观的日程，会耗去工地的[prosperity|E]，不过工队不用再等迟到的大车，[tv_wonder_organization_competence|E]也会随之而来。"
 tv_engineering_department.7045.a:0 "我们把这安排定下来,车夫们如今听奇观的日程调度。"
 tv_engineering_department.7045.b:0 "寻常生意才养得活工地周边的人,运料的大车不妨再等等。"
 tv_engineering_department.7046.t:0 "建设：首都为工地腾出调度余地"
 tv_engineering_department.7046.d:0 "首都自己的营造工程把工头借出来，帮忙重排奇观工地的班表，这一借，首都自己的工程反倒人手吃紧起来。把这次借调定成长期的安排，会耗去首都的[development|E]，不过工地能从此留下一位真正懂得排班的工头，[tv_wonder_organization_competence|E]也会随之而来。"
 tv_engineering_department.7046.a:0 "我们把借调定为长期安排,首都的工程少了他也得撑下去。"
 tv_engineering_department.7046.b:0 "首都自己的工程更需要这位工头,奇观不缺这一个。"
 tv_engineering_department.7047.t:0 "建设：王城商路服从新安排"
 tv_engineering_department.7047.d:0 "首都商人的到货日期已经被悄悄调整过了，让奇观所需的材料优先清关下船，首都寻常的贸易如今得排在运料车队后面等着。确认下这套新的港口次序，会耗去首都的[prosperity|E]，不过工地终于能按固定的日程收到材料，工队也能据此排班，[tv_wonder_organization_competence|E]也会随之而来。"
 tv_engineering_department.7047.a:0 "我们确认这套港口新次序,商人们迟早会适应。"
 tv_engineering_department.7047.b:0 "首都自己的贸易,不该给另一座城的工地让路。"
 tv_engineering_department.7048.t:0 "建设：劳工硬撑住新排班"
 tv_engineering_department.7048.d:0 "工地为了推行新排班所需的重新训练，还缺两整队人手，只能让现有的劳工先兼两岗，撑过这段时间。把工地的劳工[population|E]这样逼上好几周，代价不小，不过新排班终于能真正落地了，[tv_wonder_organization_competence|E]也会随之而来。"
 tv_engineering_department.7048.a:0 "我们先让工人兼岗撑过这阵子,新排班值得这份辛苦。"
 tv_engineering_department.7048.b:0 "累垮的工人学不会新规矩,重新训练该等人歇过来再说。"
 tv_engineering_department.7049.t:0 "建设：追加拨款打通运路"
 tv_engineering_department.7049.d:0 "一处狭窄的渡口挡住了所有开往工地的车队，排队的车越积越多。军需官想立刻拨出[gold|E]，雇木匠铺板搭桥，这样[tv_wonder_logistics_competence|E]就能重新运转起来，不然排队的车恐怕要比路还长了。"
 tv_engineering_department.7049.a:0 "付钱雇木匠,把渡口疏通。"
 tv_engineering_department.7049.b:0 "国库的钱还有更要紧的用处,不该花在一个渡口上。"
 tv_engineering_department.7050.t:0 "建设：王命催开补给线"
 tv_engineering_department.7050.d:0 "沿线的地主不肯让车队穿过自家的田地，除非拿到王室的手令。花一分[legitimacy|E]就能打开这些栅门，让[tv_wonder_logistics_competence|E]往前推进，不过这份手令只对这一条路管用，而且得现在用，过了这个时候就不作数了。"
 tv_engineering_department.7050.a:0 "颁下手令,放车队通过田地。"
 tv_engineering_department.7050.b:0 "王命不是拿来对付每一个顽固地主的。"
 tv_engineering_department.7051.t:0 "建设：地方让路，车队得以前行"
 tv_engineering_department.7051.d:0 "旧车道正好穿过村里的一片空地，筑路官想把路拓宽，为此要拆掉三间房子和一口井。这道命令能让[tv_wonder_logistics_competence|E]往前推进一步，但会耗损国王的[stability|E]，留下的人少不了要满腹怨言。"
 tv_engineering_department.7051.a:0 "下令拆吧,房子和水井都不管了。"
 tv_engineering_department.7051.b:0 "让村子留着那块地,路绕过去就是了。"
 tv_engineering_department.7052.t:0 "建设：宫廷声望替车队清障"
 tv_engineering_department.7052.d:0 "邻省的车行手里有唯一能雇到的备用驮马。行会的掌事只肯看在宫廷[prestige|E]的面子上把马借出来，让[tv_wonder_logistics_competence|E]追上进度，只是这份面子并不是取之不尽的。"
 tv_engineering_department.7052.a:0 "卖这个面子,把驮马拉上路。"
 tv_engineering_department.7052.b:0 "把这份体面留着,以后有更值得的事再用。"
 tv_engineering_department.7053.t:0 "建设：贵族车马投入工地"
 tv_engineering_department.7053.d:0 "筑路官手头的马车不够，想把本地贵族自家的马车队征去拉运石料，而不是像往常那样接送宾客。这样一来[tv_wonder_logistics_competence|E]能往前推进，但会耗损贵族的[estate_satisfaction|E]，他们少不了要为这份不便发几句牢骚。"
 tv_engineering_department.7053.a:0 "征用这些马车,让它们去拉石料。"
 tv_engineering_department.7053.b:0 "别动贵族的马车,另想办法找车。"
 tv_engineering_department.7054.t:0 "建设：教士为运输再让一步"
 tv_engineering_department.7054.d:0 "附近修道院有沿线唯一一间干燥的仓房，筑路官想把它腾出来存放粮食和工具。腾空这间仓房能推动[tv_wonder_logistics_competence|E]，但会耗损教士的[estate_satisfaction|E]，他们不会忘记是谁的车队占用了这里。"
 tv_engineering_department.7054.a:0 "腾空仓房,堆上补给。"
 tv_engineering_department.7054.b:0 "别动修道院的仓房。"
 tv_engineering_department.7055.t:0 "建设：商路改向工地"
 tv_engineering_department.7055.d:0 "车队需要借用镇上的集市广场来调转车马，可那天正好是集日。关掉摊位能让车队在正午前通过，也能推动[tv_wonder_logistics_competence|E]，但会耗损市民的[estate_satisfaction|E]，他们的摊位那天就得关门歇业。"
 tv_engineering_department.7055.a:0 "关闭集市,放车队通过。"
 tv_engineering_department.7055.b:0 "集市照常开,车队多等一天。"
 tv_engineering_department.7056.t:0 "建设：村社车驾被拉上前线"
 tv_engineering_department.7056.d:0 "有一段路陷进了泥里，光靠牛队拉不出来。征用村里的耕牛和劳力一起拉绳，能把车队拉出来，也能推动[tv_wonder_logistics_competence|E]，但会耗损平民的[estate_satisfaction|E]，他们的耕牛这时候还等着赶春耕。"
 tv_engineering_department.7056.a:0 "征用村里的耕牛和劳力,一起拉绳。"
 tv_engineering_department.7056.b:0 "让农民留着耕牛,好赶春耕。"
 tv_engineering_department.7057.t:0 "建设：拆开工址腾出车道"
 tv_engineering_department.7057.d:0 "工地的堆场太窄，容不下每天涌来的车队。拆掉边上那些盖到一半的仓房，能腾出地方让[tv_wonder_logistics_competence|E]运转起来，但会耗损工地的[development|E]，那些仓房里已经投入的东西也就跟着白费了。"
 tv_engineering_department.7057.a:0 "拆掉仓房,把堆场拓宽。"
 tv_engineering_department.7057.b:0 "留着仓房,车队在外面排队就是。"
 tv_engineering_department.7058.t:0 "建设：本地买卖先给车队让路"
 tv_engineering_department.7058.d:0 "工地附近的客栈和车行被告知，得先把余下的存货留给奇观的车队，剩下的才能卖给别人。这样能保证[tv_wonder_logistics_competence|E]不断供，但会耗损工地的[prosperity|E]，本地的生意也会跟着清淡下来。"
 tv_engineering_department.7058.a:0 "先给车队留货。"
 tv_engineering_department.7058.b:0 "让镇子照常做买卖。"
 tv_engineering_department.7059.t:0 "建设：首都让出运力"
 tv_engineering_department.7059.d:0 "首都的铺路工正修到集市街的一半，筑路官却想把他们调去加固通往工地的车辙路。改派他们能推进[tv_wonder_logistics_competence|E]，但会耗损首都的[development|E]，那条街也就只能这么半铺半晾着了。"
 tv_engineering_department.7059.a:0 "把工人从街上调走,派去修车道。"
 tv_engineering_department.7059.b:0 "先把集市街修完,车道的事以后再说。"
 tv_engineering_department.7060.t:0 "建设：王城仓储转向工地"
 tv_engineering_department.7060.d:0 "靠近京城门的粮仓是给车队补给最快的办法，筑路官想把它们打开。卖掉这些储粮能推动[tv_wonder_logistics_competence|E]，但会耗损首都的[prosperity|E]，本地的市场也会因此清淡上一季。"
 tv_engineering_department.7060.a:0 "打开粮仓,给车队补给。"
 tv_engineering_department.7060.b:0 "粮仓先留着,以防日子更难过。"
 tv_engineering_department.7061.t:0 "建设：劳工硬抢出一条运路"
 tv_engineering_department.7061.d:0 "工地上的劳工是唯一能腾出手卸货的人，工头想把他们从原本的活计上调开，加班拉绳卸车。这样能推进[tv_wonder_logistics_competence|E]，但会消耗工地的劳工[population|E]，他们也会被这些额外的班次拖垮。"
 tv_engineering_department.7061.a:0 "把劳工调去加班,把积压的车队清空。"
 tv_engineering_department.7061.b:0 "让劳工照旧干他们本来的活。"
 tv_engineering_department.7062.t:0 "建设：追加拨款推动赶工"
 tv_engineering_department.7062.d:0 "起重架每隔三天就要停工一次，原因是工钱一直批不下来，账房却说库房里其实还放着一笔没动用的闲钱。要是现在把这笔钱放出去，赶在上冻之前，就能让绳索重新抓回工匠手里。"
 tv_engineering_department.7062.a:0 "打开库房,把[gold|E]花在加班上,换回[tv_wonder_construction|E]进度。"
 tv_engineering_department.7062.b:0 "库房照旧封着,工人照常按老规矩领工钱。"
 tv_engineering_department.7063.t:0 "建设：王命压出一轮赶工"
 tv_engineering_department.7063.d:0 "石匠们说得很清楚，除非命令上盖的是王印，而不是总督的印，否则他们不会越过那道有争议的界石。今天就用王的名义下令，事情立刻能解决，但这样的王印每用一次，将来能用在宫廷和议会事务上的，就少了一次。"
 tv_engineering_department.7063.a:0 "以君主的名义盖印发令,花掉[legitimacy|E],换来越过界石的[tv_wonder_construction|E]进度。"
 tv_engineering_department.7063.b:0 "王印按下不用,让总督自己去跟界石那边的人争。"
 tv_engineering_department.7064.t:0 "建设：地方退让，主工段加速"
 tv_engineering_department.7064.d:0 "有两个村子正好挡在运料的路上，村长已经明确回绝过两回了。要是下令让村子让路，一个星期之内路就能打通，但代价是，自上次歉收以来朝廷跟这两个村子好不容易维持住的那点相安无事，也就到头了。"
 tv_engineering_department.7064.a:0 "下令让村子让路,花掉[stability|E],换取沿运料路的[tv_wonder_construction|E]进度。"
 tv_engineering_department.7064.b:0 "把运料路绕开这两个村子,村长的事就不追究了。"
 tv_engineering_department.7065.t:0 "建设：宫廷声望压成一轮赶工"
 tv_engineering_department.7065.d:0 "石匠行会的会长说，除非宫廷肯拿出上次国事访问欠下的那份人情，否则奇观工匠的订单没法插队。现在就开口，订单确实能排到最前面，但这份人情一旦说破了、用出去了，也就没有了。"
 tv_engineering_department.7065.a:0 "讨要这份人情,花掉[prestige|E],把订单排到最前,换来[tv_wonder_construction|E]进度。"
 tv_engineering_department.7065.b:0 "让订单照旧排队,把这份人情留到以后再用。"
 tv_engineering_department.7066.t:0 "建设：贵族人力补上主工段"
 tv_engineering_department.7066.d:0 "有位地方领主愿意把自家的家丁借出来搬运石料，撑过这个月，只是有个条件：不能提起这些人上次点卯之后，本来是说好要放假休息的。他的管家已经在拟名册了。"
 tv_engineering_department.7066.a:0 "借用领主的家丁,花掉贵族的[estate_satisfaction|E],换来[tv_wonder_construction|E]进度。"
 tv_engineering_department.7066.b:0 "婉拒这批家丁,让他们照旧休他们说好的假。"
 tv_engineering_department.7067.t:0 "建设：教士让出一个工期"
 tv_engineering_department.7067.d:0 "修道院的济贫基金这一季相当充裕，院长也私下暗示过，只要朝廷肯把话挑明了说，这笔钱就能拿去买脚手架用的木料，不必再这样含糊地互相试探下去。不过真把话挑明、正式开口求这笔钱，教士团往后是会一直记得的。"
 tv_engineering_department.7067.a:0 "向院长明说,花掉教士的[estate_satisfaction|E]买脚手架木料,换来[tv_wonder_construction|E]进度。"
 tv_engineering_department.7067.b:0 "不去动济贫基金,另想办法找木料。"
 tv_engineering_department.7068.t:0 "建设：商街把余力送上工地"
 tv_engineering_department.7068.d:0 "运往工地的车队，总是在同样那三个路口和赶集的人流撞在一起。要是送货的那几天，把这几条街封起来，不让商贩摆摊做买卖，运输的路线立刻就能理顺。但摊主们那几个时辰能做的生意，也就实实在在地没有了。"
 tv_engineering_department.7068.a:0 "送货日封街,花掉市民的[estate_satisfaction|E],换来[tv_wonder_construction|E]进度。"
 tv_engineering_department.7068.b:0 "集市街道照常开放,车队自己排队等着。"
 tv_engineering_department.7069.t:0 "建设：村社把最后一把力交给工地"
 tv_engineering_department.7069.d:0 "管家说，周边村子还是能挤出人手来挖土方的，只是这些人本来该去挖秋天的排水沟，好让自家的田不被淹。要是现在就把他们抽调过来，挖排水沟的事就只能往后拖了。"
 tv_engineering_department.7069.a:0 "征调村里的人手去挖土方,花掉平民的[estate_satisfaction|E],换来[tv_wonder_construction|E]进度。"
 tv_engineering_department.7069.b:0 "让村子照旧去挖秋沟,另找人手做土方。"
 tv_engineering_department.7070.t:0 "建设：拆开工址抢回进度"
 tv_engineering_department.7070.d:0 "西侧脚手架要用的地方，正好立着一座旧粮仓，仓库本身其实还相当结实。但它的石料，还有它占的那块地方，正好能同时解决石匠缺料、和测绘员抱怨没地方摆开的问题。把它拆掉，是最快的一条路子。"
 tv_engineering_department.7070.a:0 "拆掉旧粮仓,花掉工地的[development|E],换来[tv_wonder_construction|E]进度。"
 tv_engineering_department.7070.b:0 "留着粮仓不拆,另找地方摆脚手架。"
 tv_engineering_department.7071.t:0 "建设：本地买卖替工地挪出工时"
 tv_engineering_department.7071.d:0 "工地附近的酒馆老板和车夫，已经开始悄悄把生意往奇观运输这边偏了，毕竟工地这边是现钱结账，寻常买卖比不上。要是把这种安排正式定下来，送货确实能更快一些，但代价是这些人原本赖以为生的那份买卖，也就渐渐没了。"
 tv_engineering_department.7071.a:0 "把这种偏向正式定下来,花掉工地的[prosperity|E],换来[tv_wonder_construction|E]进度。"
 tv_engineering_department.7071.b:0 "让本地买卖照常运转,送货维持原样。"
 tv_engineering_department.7072.t:0 "建设：首都余裕压进主工段"
 tv_engineering_department.7072.d:0 "首都自己的桥梁修缮，因为石匠不够已经停了下来，可留在桥上的每一个石匠，也就意味着奇观工地上少了一个凿石的人。把这批人调过来，奇观工程马上就能往前推进，桥梁修缮的事，就只能先放一放了。"
 tv_engineering_department.7072.a:0 "把修桥的石匠调去奇观工地,花掉首都的[development|E],换来[tv_wonder_construction|E]进度。"
 tv_engineering_department.7072.b:0 "石匠留在桥上不动,先把桥修完。"
 tv_engineering_department.7073.t:0 "建设：王城商气化成石料与工时"
 tv_engineering_department.7073.d:0 "首都的粮商提出，愿意按公道价把手头的余粮直接卖给奇观工地的仓库，条件是朝廷得准许他们在主广场上张榜，把这笔买卖说成是王恩所赐。这笔粮食能撑着工地上的人手熬过缺粮的这个月，但也等于让整个市场明显偏向了这一家买主。"
 tv_engineering_department.7073.a:0 "准许粮商张榜宣扬,花掉首都的[prosperity|E],换来[tv_wonder_construction|E]进度。"
 tv_engineering_department.7073.b:0 "不许公开张榜,工地的粮食照旧走原来的渠道采买。"
 tv_engineering_department.7074.t:0 "建设：劳工把进度硬推过线"
 tv_engineering_department.7074.d:0 "工头提议，让工地上现有的人手连夜加班，不必再等征募官送新人手过来，反正火把和干劲都已经备好了。这样一来，天亮之前就能把积压的活赶完，只是同一批人天一亮又得接着干活，中间连歇一歇的工夫都没有。"
 tv_engineering_department.7074.a:0 "下令连夜加班,动用工地劳工[population|E],换来[tv_wonder_construction|E]进度。"
 tv_engineering_department.7074.b:0 "让工人们回去歇着,等征募官送新人手来。"
 tv_engineering_department.7075.t:0 "建设：工地外的议论又起了"
 tv_engineering_department.7075.d:0 "工地打算在公众面前做一次展示，这可能拉近工地和民众的距离，也可能招来批评。[tv_wonder_domestic_support|E]到底会因此提高还是下降，现在还说不准。"
 tv_engineering_department.7075.a:0 "让这次展示的结果说明一切。"
 tv_engineering_department.7076.t:0 "建设：场地开始装不下图纸"
 tv_engineering_department.7076.d:0 "有人提出，把设计的规模再扩大一些。这个决定要么让工程变得更加宏伟，要么日后被证明是个失误，现在还说不准。"
 tv_engineering_department.7076.a:0 "把设计规模再放大一些。"
 tv_engineering_department.7077.t:0 "建设：排班命令一改再改"
 tv_engineering_department.7077.d:0 "工地打算换一套新的指挥办法，这可能让工地更有秩序，也可能到头来只是换了个让人吵架的由头。"
 tv_engineering_department.7077.a:0 "把这套新的指挥办法推行下去。"
 tv_engineering_department.7078.t:0 "建设：补给线被迫改道"
 tv_engineering_department.7078.d:0 "有一条路能缩短运输的时间，只是不太好走。天气要是配合，这会是件好事；天气要是不配合，下令走这条路的人，就得担这个责任了。"
 tv_engineering_department.7078.a:0 "走这条近路！"
 tv_engineering_department.7079.t:0 "建设：新工法还站不住脚"
 tv_engineering_department.7079.d:0 "当前部件打算试用一种更快的工法，顺利的话能一下子赶上进度，不顺利的话，就得多花一个月把活儿返工重做。"
 tv_engineering_department.7079.a:0 "在当前部件上试用这套新工法。"
 tv_engineering_department.7080.t:0 "建设：民心要稳，国库就得出血"
 tv_engineering_department.7080.d:0 "今天早上，工匠们放下了手里的工具，抱怨说这座奇观正在把国库的银钱一点点掏空。工头许下了加发工钱的承诺，才把大家的情绪稳住。可这笔钱到头来总要有个着落——要么国库把承诺兑现，要么当着众人的面把话收回去。"
 tv_engineering_department.7080.a:0 "收回加发工钱的许诺,任由工匠的怨言在工地传开。"
 tv_engineering_department.7080.b:0 "兑现加发工钱的许诺,让国库为此出血。"
 tv_engineering_department.7081.t:0 "建设：民心要稳，王命就得受折"
 tv_engineering_department.7081.d:0 "一名游方文书在市集上当众念起一本小册子，说批准兴建这座奇观的王命根本没有依法用印。这个疑问要么就这么留在工地上，没人去理会，要么就得悄悄把王命本身改一改，总得有个交代。"
 tv_engineering_department.7081.a:0 "对那份小册子置之不理,任由对工地的疑虑继续蔓延。"
 tv_engineering_department.7081.b:0 "悄悄修改王命措辞以回应质疑,承受王命受损的代价。"
 tv_engineering_department.7082.t:0 "建设：民心要稳，地方就得受扰"
 tv_engineering_department.7082.d:0 "消息传来，说是为奇观征调运石劳工的事,在两天路程外的一处村落引发了征丁官和村民的冲突。要平息这件事，总得在别的地方付出些代价，要么是那个地区承受，要么是工地这边承受。"
 tv_engineering_department.7082.a:0 "让工地门前承受怨言,任那处的骚乱自行平息。"
 tv_engineering_department.7082.b:0 "派兵悄悄平定那处骚乱,以免继续蔓延。"
 tv_engineering_department.7083.t:0 "建设：民心要稳，声望就得拿去消耗"
 tv_engineering_department.7083.d:0 "宴席上一位外国使者笑话这座奇观修得比耕牛还慢，这句话如今从港口到王宫，家家酒馆都在传。这口气总得有一边咽下去，要么是朝廷在海外的脸面，要么是百姓对这项工程的那份骄傲。"
 tv_engineering_department.7083.a:0 "对使者的嘲讽不予理会,让百姓对奇观的自豪承受这份委屈。"
 tv_engineering_department.7083.b:0 "以盛大排场回敬使者,耗费朝廷的声望换取他闭嘴。"
 tv_engineering_department.7084.t:0 "建设：民心要稳，贵族就得忍着"
 tv_engineering_department.7084.d:0 "新修的采石道上星期径直穿过了阿尔德里克伯爵的猎苑，他的管家自那以后就一直守在工地大门口发脾气。要么把这位贵族一家安抚下来，要么就让围观这场争执的平民自己去评判谁对谁错。"
 tv_engineering_department.7084.a:0 "任由这场对峙悬而未决,让百姓对工程的看法变差。"
 tv_engineering_department.7084.b:0 "向这位贵族一家正式赔礼并给予补偿,以平息此事。"
 tv_engineering_department.7085.t:0 "建设：民心要稳，教士就得让步"
 tv_engineering_department.7085.d:0 "挖地基壕沟的工人挖出了一批没人记录在册的古墓石，本堂神父说，亡者不妥善迁葬，他就不为后续的施工祝圣。要么把迁葬仪式的费用全额付清，要么不顾神父的反对，继续往下挖。"
 tv_engineering_department.7085.a:0 "不理会神父,继续开挖,让扰坟的消息去搅动人心。"
 tv_engineering_department.7085.b:0 "支付完整的迁葬仪式费用,以安抚神父与教区。"
 tv_engineering_department.7086.t:0 "建设：民心要稳，商街就得吃亏"
 tv_engineering_department.7086.d:0 "脚手架的杆子横在大街上，已经整整六天挡住了通往商街的车马，店主们都在问，这损失的生意该由谁来负责。要么把他们的损失补上，要么继续封着这条街，任消息传到百姓耳朵里去。"
 tv_engineering_department.7086.a:0 "不补偿商户的损失,任封街之事助长百姓的怨言。"
 tv_engineering_department.7086.b:0 "当场补偿商街因封路蒙受的损失。"
 tv_engineering_department.7087.t:0 "建设：民心要稳，村社就得多扛"
 tv_engineering_department.7087.d:0 "征夫官从正要收割的田地里，把村里的壮劳力都抽走了，让他们去为奇观搬运木材。如今地里的粮食没人收，工地上的人也一个个累得直不起腰。要么把人手放回去抢收庄稼，要么就让百姓知道，这座奇观是怎么把田地里的人手抽空的。"
 tv_engineering_department.7087.a:0 "留住征来的劳力继续在工地做工,任由田地荒废的消息传开。"
 tv_engineering_department.7087.b:0 "立刻把这些村民放回去抢收庄稼。"
 tv_engineering_department.7088.t:0 "建设：民心要稳，工址就得拆出余地"
 tv_engineering_department.7088.d:0 "石匠的方案要拆掉旧鞣皮匠区,好给奇观的地基腾地方,可还没等人想清楚该拿什么补上,那片地方已经拆掉了一半。要么就按原计划继续拆下去,要么把方案缩减一些,任人质疑这座奇观为什么要占这么大的地方。"
 tv_engineering_department.7088.a:0 "缩减拆除范围,任人质疑这座奇观起初为何要占这么大的地方。"
 tv_engineering_department.7088.b:0 "按计划拆完鞣皮匠区,日后再操心用什么补上。"
 tv_engineering_department.7089.t:0 "建设：民心要稳，工址买卖就得让路"
 tv_engineering_department.7089.d:0 "奇观的堆料场已经连着三个月占用了每周集市的场地,原本在那儿摆摊的商贩渐渐地也就不再回来了。要么趁集市还没被彻底忘记,把场地还回去,要么继续占着堆料场,任工地这边的买卖越来越冷清。"
 tv_engineering_department.7089.a:0 "继续占用堆料场,任工地本身的买卖持续冷清下去。"
 tv_engineering_department.7089.b:0 "在摊贩彻底不记得回来的路之前,把集市场地还回去。"
 tv_engineering_department.7090.t:0 "建设：民心要稳，首都工程就得退后"
 tv_engineering_department.7090.d:0 "城市测量官把首都所有闲着的石匠都征调去做奇观的石作了,老桥边那座盖到一半的济贫院,也因此空了两个月没人碰。要么让济贫院一直等到奇观完工,要么把石匠调回首都去,任工地这边解释进度为什么慢了下来。"
 tv_engineering_department.7090.a:0 "让所有石匠继续留在奇观工地,首都那些盖了一半的工程只能等着。"
 tv_engineering_department.7090.b:0 "召回石匠去完成济贫院,任工地的人自己去猜测延误的缘由。"
 tv_engineering_department.7091.t:0 "建设：民心要稳，王城买卖就得降温"
 tv_engineering_department.7091.d:0 "运往奇观的石料车,已经在首都最繁华的商业街上停了整整一个星期,那儿的店主说,路一堵,生意也跟着枯竭了下去。要么尽快给车队另找一条路,要么就让它们继续停在那儿,任首都自己的买卖持续冷清下去。"
 tv_engineering_department.7091.a:0 "让车队继续停在原地,把责任转到工地自身的进度上。"
 tv_engineering_department.7091.b:0 "立刻为车队改道,让首都的商业街重新透气。"
 tv_engineering_department.7092.t:0 "建设：民心要稳，劳工就得硬撑"
 tv_engineering_department.7092.d:0 "三天前工地上脚手架塌了,伤了十几名劳工,剩下的工匠们都在抱怨,这份工钱不值得拿命去冒这个险。要么监工强行维持进度,劳工们就会连夜逃走;要么把进度放缓下来,危险的消息就会传遍全城。"
 tv_engineering_department.7092.a:0 "任由工地危险的消息传遍全城,留住工地上的每一名劳工。"
 tv_engineering_department.7092.b:0 "不顾一切强行维持进度,任由惊惧的劳工连夜逃走。"
 tv_engineering_department.7093.t:0 "建设：要保住规模，就得继续掏钱"
 tv_engineering_department.7093.d:0 "工地账房打开钱箱，发现里面的存银比账册上记的要少一些。看来有人已经把这笔没有入账的钱花掉了，这个亏空总要补上，要么从[tv_wonder_scale_competence|E]里补，要么从[gold|E]里补。"
 tv_engineering_department.7093.a:0 "缩减方案,量入为出。"
 tv_engineering_department.7093.b:0 "从国库补足亏空,规模照旧。"
 tv_engineering_department.7094.t:0 "建设：要保住规模，就得再压一次王命"
 tv_engineering_department.7094.d:0 "有觊觎王位的人开始到处散布流言，说从来没有王命许可修建这么大规模的建筑。文书说这件事可以私下平息下去，但平息的代价躲不掉，要么是[tv_wonder_scale_competence|E]受损，要么是[legitimacy|E]受损。"
 tv_engineering_department.7094.a:0 "悄悄从王命中撤去最大的条款。"
 tv_engineering_department.7094.b:0 "让王室重申全部王命,正面回应流言。"
 tv_engineering_department.7095.t:0 "建设：要保住规模，就得惊动地方"
 tv_engineering_department.7095.d:0 "三个教区的民夫因为地基被扩宽而放下了工具，还用大车把道路堵住了。执法官能把这些人驱散开来，但要做到这一点，总得让一步才行，要么让[tv_wonder_scale_competence|E]，要么让地方上的[stability|E]。"
 tv_engineering_department.7095.a:0 "把地基收回原来的界线,让民夫满意还乡。"
 tv_engineering_department.7095.b:0 "派兵清道,地基照旧扩宽。"
 tv_engineering_department.7096.t:0 "建设：要保住规模，就得烧掉声望"
 tv_engineering_department.7096.d:0 "本该到各国去宣扬这座建筑的传令官，已经有两个月没领到俸禄了，如今干脆拒绝出行。这件事必须马上了结，要么削减设计的[tv_wonder_scale_competence|E]，要么消耗王室的[prestige|E]，好让他们把嘴闭上。"
 tv_engineering_department.7096.a:0 "宣布建更小更省的方案,让传令官去传这话。"
 tv_engineering_department.7096.b:0 "拿王室的脸面和声望去打点传令官。"
 tv_engineering_department.7097.t:0 "建设：要保住规模，就得再借贵族的人情"
 tv_engineering_department.7097.d:0 "一位男爵的管家清点了从领地森林里征用的木料，发现数量比当初约定的多了一倍。这位领主要么接受今后少征一些，缩减[tv_wonder_scale_competence|E]，要么就等着一份正式的赔礼，再加上进一步的让步，来安抚贵族之间的[estate_satisfaction|E]。"
 tv_engineering_department.7097.a:0 "削减今后木料定额,方案随之收缩。"
 tv_engineering_department.7097.b:0 "送去正式赔礼,再加赐予男爵府邸。"
 tv_engineering_department.7098.t:0 "建设：要保住规模，就得再向教士求让步"
 tv_engineering_department.7098.d:0 "一位主教得知，拓宽后的正殿设计会占用教士会的旧墓地。他说不会再为这项工程祝圣了，除非方案能收窄一些，或者教士会对[estate_satisfaction|E]的不满能得到彻底的安抚。"
 tv_engineering_department.7098.a:0 "重画正殿图纸,绕开旧墓地。"
 tv_engineering_department.7098.b:0 "赐予教士会新的特权以平息不满。"
 tv_engineering_department.7099.t:0 "建设：要保住规模，就得先让商路受损"
 tv_engineering_department.7099.d:0 "羊毛商人来报告说，通往工地的拓宽道路正好从他们的仓库区中间穿了过去，货物现在只能堆在路口慢慢腐坏。要么把这条路收窄回去，削减整条通道的[tv_wonder_scale_competence|E]，要么王室直接拿出补偿，安抚市民的[estate_satisfaction|E]。"
 tv_engineering_department.7099.a:0 "收窄通道,放过仓库区。"
 tv_engineering_department.7099.b:0 "赔偿商人损失,道路照旧拓宽。"
 tv_engineering_department.7100.t:0 "建设：要保住规模，就得再压村社一程"
 tv_engineering_department.7100.d:0 "有消息传来，采石场附近一个村子这个月为了应付扩大后的征用，连夜劳作，已经埋了三个人。里正说徭役必须削减下来，除非王室宁愿拿粮食和银钱去平息平民的[estate_satisfaction|E]，而不是缩减[tv_wonder_scale_competence|E]。"
 tv_engineering_department.7100.a:0 "把徭役削减到村子能承受的程度。"
 tv_engineering_department.7100.b:0 "送去粮食银钱,徭役照旧。"
 tv_engineering_department.7101.t:0 "建设：要保住规模，就得继续拆工址"
 tv_engineering_department.7101.d:0 "工头已经拆掉了工地上一整排民房，好腾出更宽的作业场地，镇民们正在问，原来那块地上到底会建什么。答案要么是把方案收缩回去，不多占一分[tv_wonder_scale_competence|E]用不上的地，要么就是继续拆下去，让工地的[development|E]再受损耗。"
 tv_engineering_department.7101.a:0 "停止继续拆除,按已占之地重画方案。"
 tv_engineering_department.7101.b:0 "下令继续拆除,损耗由工地承担。"
 tv_engineering_department.7102.t:0 "建设：要保住规模，就得拿工址繁荣去垫"
 tv_engineering_department.7102.d:0 "曾经围着工地摆开的市集，已经被脚手架和施工的喧闹声逼走了，摊贩到现在也没有回来。监工必须做个决定，是把工程收拢一些、放弃部分[tv_wonder_scale_competence|E]，还是任由工地的[prosperity|E]继续流失下去，市集也继续被挡在外面。"
 tv_engineering_department.7102.a:0 "收拢脚手架,让市集归来。"
 tv_engineering_department.7102.b:0 "工程照旧铺开,任由工地商贸凋敝。"
 tv_engineering_department.7103.t:0 "建设：要保住规模，就得抽走首都工程"
 tv_engineering_department.7103.d:0 "被征调去修建奇观的石匠，原本是在修首都自己的桥梁，如今那座桥就停在半途，冬天眼看要到了还没修完。总要有一方让步：要么缩减奇观的[tv_wonder_scale_competence|E]，把石匠放回去，要么就让首都的[development|E]在这个冬天继续搁置，等不到修复。"
 tv_engineering_department.7103.a:0 "放石匠回首都,奇观相应缩减规模。"
 tv_engineering_department.7103.b:0 "石匠留在奇观工地,首都修缮继续搁置。"
 tv_engineering_department.7104.t:0 "建设：要保住规模，就得拿王城买卖去换"
 tv_engineering_department.7104.d:0 "首都自己的行会大厅已经冷清下来了，工匠和车夫都被抽调去满足奇观工程对石料和人手的需求。议会直截了当地问：这项方案是不是终于要缩减了，饶过[tv_wonder_scale_competence|E]，还是首都的[prosperity|E]还要继续供养一座如今在自家街上都看不见影子的建筑。"
 tv_engineering_department.7104.a:0 "缩减方案,放行会工匠回首都。"
 tv_engineering_department.7104.b:0 "工匠留在工地,首都商贸继续为此买单。"
 tv_engineering_department.7105.t:0 "建设：要保住规模，就得逼劳工多撑一步"
 tv_engineering_department.7105.d:0 "昨天夜里，加宽那一层的脚手架塌了一次，大夫说如果不放慢与扩大方案相应的赶工速度，往后还会有人摔下来。监工要么把方案收窄到工匠们能撑得住的进度，饶过[tv_wonder_scale_competence|E]，要么继续按加宽后的计划赶工，任由工地劳工的[population|E]一直减少下去。"
 tv_engineering_department.7105.a:0 "放缓速度,把方案收窄到工匠能承受的地步。"
 tv_engineering_department.7105.b:0 "继续按加宽的工程赶工,任由工人付出代价。"
 tv_engineering_department.7106.t:0 "建设：要稳住排班，就得再填一笔钱"
 tv_engineering_department.7106.d:0 "昨夜账房清点了两次金库，两次都对不上账，两个书记算出来的差额还各不相同。要么把这笔亏空记进国库账上，要么把整份排班表撕掉重排，各队人手全部换过。书记们算错的这笔账，终究要由[tv_wonder_organization_competence|E]或[gold|E]来承担。"
 tv_engineering_department.7106.a:0 "撕掉排班表,让各队重新分派。"
 tv_engineering_department.7106.b:0 "把亏空记入国库,排班照旧不动。"
 tv_engineering_department.7107.t:0 "建设：要稳住排班，就得再压一次王命"
 tv_engineering_department.7107.d:0 "一个没人认得的传令人，当着众多工匠的面，宣读了一份敕令，把工地的木料权判给了敌对领主，其实是伪造的。要追查这个人、当众把话说清楚，就得把工头全数从岗位上抽走整整一天；要是放着不管，工匠们倒能照常开工，可这番话已经当真事传到酒馆里去了，越传越像真的。[tv_wonder_organization_competence|E]或[legitimacy|E]，总得有一个来承担这假敕令的后果。"
 tv_engineering_department.7107.a:0 "把工头全数抽去追查传令人、当众澄清。"
 tv_engineering_department.7107.b:0 "放着伪敕令不管,让工匠照常干活。"
 tv_engineering_department.7108.t:0 "建设：要稳住排班，就得多动地方秩序"
 tv_engineering_department.7108.d:0 "只因半袋发霉的谷子，伙房排队时两拨人推搡起来，一路吵到了大门外的街上，最后是巡卫赶来才把人拆开。可以把两队的用餐时间错开，让他们往后再碰不上面；也可以让巡卫当众在广场上把人抓起来，一次了结。[tv_wonder_organization_competence|E]或[stability|E]，总得有一个来担这袋坏谷子的账。"
 tv_engineering_department.7108.a:0 "把各队用餐时间全部错开,免得两拨人再碰面。"
 tv_engineering_department.7108.b:0 "让巡卫在广场当众抓人了事。"
 tv_engineering_department.7109.t:0 "建设：要稳住排班，就得继续耗声望"
 tv_engineering_department.7109.d:0 "一位外国使节提前整整一天到访，到了地方却见荣誉门口没人值守，旗帜还叠在箱子里没打开。可以当场把值班表撕掉，临时凑出一场像样的迎接；也可以就让使节照工地原本的样子走一遭，任他回去如实禀报所见。[tv_wonder_organization_competence|E]或[prestige|E]，总要为这次提前到访付出代价。"
 tv_engineering_department.7109.a:0 "当场撕掉值班表,临时凑一场像样的迎接。"
 tv_engineering_department.7109.b:0 "就让使节照工地原样走一趟。"
 tv_engineering_department.7110.t:0 "建设：要稳住排班，就得让贵族继续忍着"
 tv_engineering_department.7110.d:0 "从邻近领主庄园借来的牛队，本该在米迦勒节前就还回去，如今却还在替工地拉石料，早已经过了归还的日子。可以按期把牛队送还，让运料的人手重新编组，改用人力来拖运；也可以把牛队再扣上半个月，让领主的管家自己去等。[tv_wonder_organization_competence|E]或贵族[estate_satisfaction|E]，总得为这逾期未还的牛队担责。"
 tv_engineering_department.7110.a:0 "按期送还牛队,把运料人手重新编组改用人力。"
 tv_engineering_department.7110.b:0 "把牛队再扣半个月,让领主的管家等着。"
 tv_engineering_department.7111.t:0 "建设：要稳住排班，就得再向祭坛借时间"
 tv_engineering_department.7111.d:0 "本周圣物巡游的时候，石匠们照旧敲打不停，三条街外都听不清诵经的声音。可以往后把班表围着每一个节日和巡游日重新排过，让工地在这些日子里静下来；也可以干脆把巡游路线改掉，告诉教士们工地不会为此停工。[tv_wonder_organization_competence|E]或教士[estate_satisfaction|E]，总得为这敲打声担责。"
 tv_engineering_department.7111.a:0 "往后把班表围着每个节日和巡游日重排。"
 tv_engineering_department.7111.b:0 "改巡游路线,告诉教士工地不会停工。"
 tv_engineering_department.7112.t:0 "建设：要稳住排班，就得让商街再吃一次亏"
 tv_engineering_department.7112.d:0 "一排工地大车堵住粮市的装卸道，已经堵了六天，商会如今连派人来抱怨都懒得再来了。可以把送货的班表全部拆掉，改走一条更远、但不挡道的路线；也可以让大车照旧停在那里，由商会自己想办法绕开。[tv_wonder_organization_competence|E]或市民[estate_satisfaction|E]，总得为这堵路的大车担责。"
 tv_engineering_department.7112.a:0 "拆掉送货班表,改走更远但不挡道的路线。"
 tv_engineering_department.7112.b:0 "让大车照旧停着,由商会自己绕路。"
 tv_engineering_department.7113.t:0 "建设：要稳住排班，就得再压村社人力"
 tv_engineering_department.7113.d:0 "该回村里春耕的徭役队伍，如今还在工地上凿石，消息传来说今年的地怕是种不上了。可以按期放徭役回乡，凭剩下的人手重新编排工地的班次；也可以把徭役再扣上一阵，让村社自己想办法。[tv_wonder_organization_competence|E]或平民[estate_satisfaction|E]，总得为这荒着的地担责。"
 tv_engineering_department.7113.a:0 "按期放徭役回乡,用剩下的人重新编排班次。"
 tv_engineering_department.7113.b:0 "把徭役再扣一阵,让村社自己将就。"
 tv_engineering_department.7114.t:0 "建设：要稳住排班，就得继续拆工址"
 tv_engineering_department.7114.d:0 "一段挡土墙一夜之间塌了，手边现成的凿石只有工地引道上刚铺好的那一批。可以把引道留着不动，抽调所有闲手重新去采石；也可以干脆把引道再扒开，连夜把墙补上。[tv_wonder_organization_competence|E]或工地[development|E]，总得为这塌墙担责。"
 tv_engineering_department.7114.a:0 "抽调所有闲手去重新采石,留着引道不动。"
 tv_engineering_department.7114.b:0 "再把引道扒开,连夜补墙。"
 tv_engineering_department.7115.t:0 "建设：要稳住排班，就得拿工址买卖去垫"
 tv_engineering_department.7115.d:0 "上周的工钱迟发了三天，发下来的钱还有一半是磨过边的劣币，营地市集的卖饼人干脆收摊走了。可以把发饷的表拆掉重排，改成更严格、更勤的周期，把卖饼人请回来；也可以让营地干脆没了市集，工人自己想办法解决吃饭的事。[tv_wonder_organization_competence|E]或工地[prosperity|E]，总得为这迟发的工钱担责。"
 tv_engineering_department.7115.a:0 "拆掉发饷表重排,改成更严更勤的周期。"
 tv_engineering_department.7115.b:0 "让营地没了市集,工人自己想办法吃饭。"
 tv_engineering_department.7116.t:0 "建设：要稳住排班，就得抽走首都工力"
 tv_engineering_department.7116.d:0 "首都自己那座桥梁维修用的脚手架，一夜之间被悄悄搬上了工地的大车，桥梁工人第二天早上来时才发现木料不见了。可以把工地自己的运料路线拉得更远，围着更远的木料产地重排班次；也可以让首都那座桥先等一等，让这批梁木先用来完成奇观。[tv_wonder_organization_competence|E]或首都[development|E]，总得为这失踪的脚手架担责。"
 tv_engineering_department.7116.a:0 "拉长工地运料路线,围着更远的木料产地重排班次。"
 tv_engineering_department.7116.b:0 "让首都那座桥先等着,梁木先紧着奇观用。"
 tv_engineering_department.7117.t:0 "建设：要稳住排班，就得让王城生意降温"
 tv_engineering_department.7117.d:0 "首都一半的玻璃匠和细木匠，已经在工地待了整整三周，家里的行会馆如今就连正午时分也大半空着。可以把这些老师傅轮换回首都，用剩下的学徒重新拼凑工地的队伍；也可以让老师傅们继续留在工地，由着首都的作坊再空上一阵。[tv_wonder_organization_competence|E]或首都[prosperity|E]，总得为这空着的行会馆担责。"
 tv_engineering_department.7117.a:0 "把老师傅轮换回首都,用剩下的学徒重拼工地队伍。"
 tv_engineering_department.7117.b:0 "让老师傅留在工地,任首都作坊空着。"
 tv_engineering_department.7118.t:0 "建设：要稳住排班，就得逼劳工再撑一轮"
 tv_engineering_department.7118.d:0 "今天早上，一支人手不足的队伍为了赶时辰，在吊台上凑单干活，结果吊索断了，三个人跟着摔了下去。可以把预备队从各自的活计上抽走，不管排班会不会因此乱套，明天就让他们顶上吊台；也可以等伤者被抬走以后，让原班人马照旧缺着人手再上。[tv_wonder_organization_competence|E]或工地劳工[population|E]，总得为这根断索担责。"
 tv_engineering_department.7118.a:0 "把预备队从各自活计上抽走,不管排班乱不乱明天顶上吊台。"
 tv_engineering_department.7118.b:0 "等伤者抬走后,让原班人马缺员再上。"
 tv_engineering_department.7119.t:0 "建设：要救车队，就得再花一笔钱"
 tv_engineering_department.7119.d:0 "运送石料的车队把官道上的一座桥压垮了，有一半车队陷在桥下的泥里，动弹不得。渡口的船夫说，愿意用木筏把车拖过河去，只是要先收钱才肯动手。这笔钱迟早得有人出。"
 tv_engineering_department.7119.a:0 "让车队留在原地,绕道走剩下的路,不管这对[tv_wonder_logistics_competence|E]造成什么损耗。"
 tv_engineering_department.7119.b:0 "直接掏钱付给船夫,今天就把车拖过河,花掉[gold|E]。"
 tv_engineering_department.7120.t:0 "建设：要救车队，就得再借一次王命"
 tv_engineering_department.7120.d:0 "车队派在前头开路的人，在邻境的关卡被拦了下来。通行凭证上盖的是旧印，当地领主如今已经不认这个印了。眼下要么打着王命的旗号强行开关放行，要么就让车队留在关外等着。"
 tv_engineering_department.7120.a:0 "让车队折返,绕开这处有争议的关卡另寻远路,任由[tv_wonder_logistics_competence|E]受损。"
 tv_engineering_department.7120.b:0 "直接搬出王命强行开关放行,把这场未了的纠纷记在[legitimacy|E]的账上。"
 tv_engineering_department.7121.t:0 "建设：要救车队，就得惊动更多地方"
 tv_engineering_department.7121.d:0 "村民们用自家的车把道路堵了起来，说这一季已经是第三次征用他们的车了，命令不撤，他们就不肯让路。车队想要过去，要么收回这道命令让步，要么派兵把人和车清开，此外没有别的办法。"
 tv_engineering_department.7121.a:0 "让步,绕开堵路的村民另寻他路,承受这给[tv_wonder_logistics_competence|E]留下的停滞。"
 tv_engineering_department.7121.b:0 "派兵强行清路,把这笔账算在[stability|E]头上。"
 tv_engineering_department.7122.t:0 "建设：要救车队，就得继续透支体面"
 tv_engineering_department.7122.d:0 "车队的领队到邻国宫廷去求换乘用的挽马，当着众人的面被回绝了，脸面丢尽。想要拿到马，就得动用人情，逼得对方不好意思再拒绝；要是拿不到，车队就只能拖着已经疲乏的马，一点一点往前挪。"
 tv_engineering_department.7122.a:0 "让领队带着现有的疲马继续赶路,任凭这份拖延损耗[tv_wonder_logistics_competence|E]。"
 tv_engineering_department.7122.b:0 "当众动用人情逼对方交出好马,为此耗掉一份[prestige|E]。"
 tv_engineering_department.7123.t:0 "建设：要救车队，就得再借贵族车马"
 tv_engineering_department.7123.d:0 "车队的马夫因为工程用马不够，征用了一户贵族人家自用的车马，那家人放话说，天黑之前必须把马还回去。要是还了马，车队就得停下来；要是不还，那家人的耐心也撑不了多久了。"
 tv_engineering_department.7123.a:0 "今晚就把马还给贵族之家,让车队没马可用地等着,由此消耗[tv_wonder_logistics_competence|E]。"
 tv_engineering_department.7123.b:0 "把借来的马继续留在车队里多用几天,不管这对贵族[estate_satisfaction|E]造成什么影响。"
 tv_engineering_department.7124.t:0 "建设：要救车队，就得让祭坛再忍一次"
 tv_engineering_department.7124.d:0 "最近的一条补给路要穿过修道院的地界，车队赶在一个圣日，没有事先请示就闯了过去。僧侣们随后关上了院门，要求车队要么改走别的路，要么给他们一个说法。"
 tv_engineering_department.7124.a:0 "让车队折返,绕开修道院的地界另寻道路,任由这段绕行损耗[tv_wonder_logistics_competence|E]。"
 tv_engineering_department.7124.b:0 "按原计划让车队闯过院门,把这份怨气记在教士[estate_satisfaction|E]账上。"
 tv_engineering_department.7125.t:0 "建设：要救车队，就得先堵住商路"
 tv_engineering_department.7125.d:0 "车队为了躲避暴雨，把车队停在了集市广场上过夜，一停就是一整夜，摊贩们到现在都没法开张做生意。商人们要求今天就把广场腾出来，不管外面天气如何。"
 tv_engineering_department.7125.a:0 "现在就把车赶进风雨里让路,任由暴雨拖慢[tv_wonder_logistics_competence|E]。"
 tv_engineering_department.7125.b:0 "让车队继续占着广场,把商人的怨气记在市民[estate_satisfaction|E]账上。"
 tv_engineering_department.7126.t:0 "建设：要救车队，就得再抽村社的车驾"
 tv_engineering_department.7126.d:0 "同一个村子这个月已经是第三次被征走耕牛和板车了，田地眼看就要耽误了农时，荒废下去。要么把牲畜放回去继续耕田，要么车队自己想办法把车拉过去。"
 tv_engineering_department.7126.a:0 "把耕牛放回田里,让车队没有牲畜可用地勉强前行,由此损耗[tv_wonder_logistics_competence|E]。"
 tv_engineering_department.7126.b:0 "第四次征走耕牛,让村社的疲惫反映在平民[estate_satisfaction|E]上。"
 tv_engineering_department.7127.t:0 "建设：要救车队，就得继续拆开工址"
 tv_engineering_department.7127.d:0 "一场山体滑坡把通向工地的最后一段路埋住了，眼下唯一来得及的办法，是拆掉刚铺好的堆料场，取那里的土和木料来铺路。要么工地拆掉自己刚打好的地基，要么车队就在滑坡外面等着。"
 tv_engineering_department.7127.a:0 "保留堆料场,让车队留在滑坡外等待,由此损耗[tv_wonder_logistics_competence|E]。"
 tv_engineering_department.7127.b:0 "拆掉刚铺好的堆料场取土取木清路,消耗工地[development|E]。"
 tv_engineering_department.7128.t:0 "建设：要救车队，就得拿工址繁荣去换"
 tv_engineering_department.7128.d:0 "车队要通过，就得把这段路面拓宽，可这段路上正挤着工地自己的摊贩，他们也没有别的地方可去摆摊。要么拆掉摊子，让车队过去，要么车队就挤着这些摊子，慢慢地爬过去。"
 tv_engineering_department.7128.a:0 "让车队挤着慢慢爬过去,保留摊子不动,由此损耗[tv_wonder_logistics_competence|E]。"
 tv_engineering_department.7128.b:0 "拆掉摊贩的摊子拓宽道路给车队让路,消耗工地[prosperity|E]。"
 tv_engineering_department.7129.t:0 "建设：要救车队，就得抽走首都运力"
 tv_engineering_department.7129.d:0 "首都自己的车夫和铺石工都被抽调了出去，去把滞留在外的车队推进城里最后一段路。不管车队最后等不等，首都的街道都已经因此拆得七零八落，一半荒废在那里没人管。"
 tv_engineering_department.7129.a:0 "把首都的工匠车夫叫回各自的活计,让车队滞留在城门外,由此损耗[tv_wonder_logistics_competence|E]。"
 tv_engineering_department.7129.b:0 "继续抽调首都的工匠车夫把车队拖进城,消耗首都[development|E]。"
 tv_engineering_department.7130.t:0 "建设：要救车队，就得让王城市场让路"
 tv_engineering_department.7130.d:0 "车队征用了首都的中央集市，用来堆放滞留下来的工程货物，平时在那里交易的商队已经被挡在门外整整一周了。要么把货物挪走，让集市重新开张，要么集市还得再当一阵子仓库用。"
 tv_engineering_department.7130.a:0 "立刻把货物挪走,不管手法多粗糙,把这份负担记在[tv_wonder_logistics_competence|E]上。"
 tv_engineering_department.7130.b:0 "让货物继续留在广场上,商队继续被拒之门外,消耗首都[prosperity|E]。"
 tv_engineering_department.7131.t:0 "建设：要救车队，就得逼人力再撑一次"
 tv_engineering_department.7131.d:0 "挽兽已经用尽，一时又找不到替补的，工地的工头便让劳工套上绳索，用人力去拖拽陷住的车。要么让这些人继续拖下去，直到力竭，要么就让车留在原地，不再动它。"
 tv_engineering_department.7131.a:0 "让车留在原地不再强行拖拽,不再多耗人力,由此损耗[tv_wonder_logistics_competence|E]。"
 tv_engineering_department.7131.b:0 "让劳工继续拉绳拖车直到车动为止,消耗工地劳工[population|E]。"
 tv_engineering_department.7132.t:0 "建设：要抢回进度，就得继续掏钱"
 tv_engineering_department.7132.d:0 "石匠行会已经停工两个月了，一直没拿到工钱。工头拿着账本站在门口，不肯挪地方，要么把工场重新开起来，要么把金库打开付钱，总得选一样。"
 tv_engineering_department.7132.a:0 "由他们停工,[tv_wonder_construction|E]进度先搁着。"
 tv_engineering_department.7132.b:0 "从国库拿出[gold|E]补清欠款,凿子重新响起来。"
 tv_engineering_department.7133.t:0 "建设：要抢回进度，就得再压一次王命"
 tv_engineering_department.7133.d:0 "议会得到消息，工地上的石匠是没有按照惯常的敕令强征来的。觊觎王位的人已经拿这件事做文章，说王室不过是随心所欲。这条捷径总得有人来承担后果，要么是工程本身停下来，要么是当初下令的王命受到质疑。"
 tv_engineering_department.7133.a:0 "撤回强征,[tv_wonder_construction|E]进度随之延后。"
 tv_engineering_department.7133.b:0 "坚持敕令不改,为此耗损[legitimacy|E]。"
 tv_engineering_department.7134.t:0 "建设：要抢回进度，就得惊动地方"
 tv_engineering_department.7134.d:0 "因为修采石道路，村民的公地被圈占了，他们干脆用身体堵住了车道。要么今夜就让车队折返，要么派兵把路清出来，可这样一来，乡里往后会一直记着这笔账。"
 tv_engineering_department.7134.a:0 "让车队折返,[tv_wonder_construction|E]进度先搁着。"
 tv_engineering_department.7134.b:0 "派卫兵清道,为此耗损[stability|E]。"
 tv_engineering_department.7135.t:0 "建设：要抢回进度，就得拿声望去垫"
 tv_engineering_department.7135.d:0 "一位外国使节提前到访工地，正好看见脚手架塌了一半，灰浆也还没干透，回国的奏报已经在起草了。监工这时候可以停工，把工程重新做扎实，也可以放着不管，任由使节把他看到的一切写进奏报里。"
 tv_engineering_department.7135.a:0 "拆掉那处豁口重建,[tv_wonder_construction|E]进度随之倒退。"
 tv_engineering_department.7135.b:0 "让脚手架就这么立着,任那封信耗损[prestige|E]。"
 tv_engineering_department.7136.t:0 "建设：要抢回进度，就得再向贵族借力"
 tv_engineering_department.7136.d:0 "一位本地领主发现自己的猎苑被划进了采石场的范围，气冲冲地赶到宫廷，要么让测量队撤走，要么家族的颜面得有个说法。事情到了这一步，总得有一方让步才行。"
 tv_engineering_department.7136.a:0 "召回测量队,[tv_wonder_construction|E]进度随之落后。"
 tv_engineering_department.7136.b:0 "守住采石线,为此耗损贵族[estate_satisfaction|E]。"
 tv_engineering_department.7137.t:0 "建设：要抢回进度，就得让祭坛再让一步"
 tv_engineering_department.7137.d:0 "工人在打地基的时候，挖出了一处没有留下任何记录的旧教区墓地。教士这下不肯再为后续的工程祝圣了，除非先把这些遗骸妥善迁走安葬。是继续动铁锹，还是先办这场圣事，总得选一样。"
 tv_engineering_department.7137.a:0 "停下铁锹等迁葬礼完成,[tv_wonder_construction|E]进度先搁着,不管要多久。"
 tv_engineering_department.7137.b:0 "不顾教士反对下令继续开挖,为此耗损教士[estate_satisfaction|E]。"
 tv_engineering_department.7138.t:0 "建设：要抢回进度，就得先挤占商路"
 tv_engineering_department.7138.d:0 "商贩广场已经被运石料的车队占去大半，都一个星期了。行会的会首说，要是再这么拖下去，秋市就要泡汤。要么今夜就让车队另找一条路走，要么秋市就只能开在工地当中了。"
 tv_engineering_department.7138.a:0 "撤回车队另寻他路,[tv_wonder_construction|E]进度随之放慢。"
 tv_engineering_department.7138.b:0 "车队照旧占用广场,为此耗损市民[estate_satisfaction|E]。"
 tv_engineering_department.7139.t:0 "建设：要抢回进度，就得再抽村社一把"
 tv_engineering_department.7139.d:0 "这个月从三个村子征去做劳役的人手，正好错过了收割前最后一段晴天。村长们都在问，到底是自家的田地要紧，还是工程要紧。这两头，总得舍一头。"
 tv_engineering_department.7139.a:0 "让劳役返回田里,[tv_wonder_construction|E]进度随之放慢。"
 tv_engineering_department.7139.b:0 "留人在工地,为此耗损平民[estate_satisfaction|E]。"
 tv_engineering_department.7140.t:0 "建设：要抢回进度，就得继续拆工址"
 tv_engineering_department.7140.d:0 "一道挡土墙夜里塌了下来，把工地周围渐渐立起来的那些半成品作坊和仓房都压垮了。要把这些重新修起来，工地总得付出点代价，要么从工程里抽调人手，要么就任由周围的这些东西继续荒废下去。"
 tv_engineering_department.7140.a:0 "从奇观工程抽调人手先修作坊,[tv_wonder_construction|E]进度随之倒退。"
 tv_engineering_department.7140.b:0 "任作坊成废墟,为此耗损工地[development|E]。"
 tv_engineering_department.7141.t:0 "建设：要抢回进度，就得拿工址生计去填"
 tv_engineering_department.7141.d:0 "为了腾出一块新的堆料场，这个星期把靠工程吃饭的小贩和小作坊都赶走了，工地周围那点小买卖也跟着冷清下来。堆料场要留住地方，还是工地自己的这点生意要留住地方，总得让一样。"
 tv_engineering_department.7141.a:0 "把地方还给小贩,[tv_wonder_construction|E]进度因堆料场推迟而放慢。"
 tv_engineering_department.7141.b:0 "留住堆料场,为此耗损工地[prosperity|E]。"
 tv_engineering_department.7142.t:0 "建设：要抢回进度，就得让首都工程后退"
 tv_engineering_department.7142.d:0 "首都自己的桥梁维修已经停了下来，因为城里的石匠和车马全都被抽调去赶工程的进度了。官员们想让这些人手先回去把桥修好，工地这边却还想再留他们一个月。"
 tv_engineering_department.7142.a:0 "放石匠回首都,[tv_wonder_construction|E]进度随之放慢。"
 tv_engineering_department.7142.b:0 "把石匠留在工地,为此耗损首都[development|E]。"
 tv_engineering_department.7143.t:0 "建设：要抢回进度，就得让王城生意让路"
 tv_engineering_department.7143.d:0 "满载石料的车队穿过首都的市集街区，一连封了两条街，都封了一个星期了。那一带的店家说，生意已经在往别的地方流失。要么车队绕远路走，要么市集街区就得继续这样失血下去。"
 tv_engineering_department.7143.a:0 "让车队绕远路走,[tv_wonder_construction|E]进度随之落后。"
 tv_engineering_department.7143.b:0 "车队照旧走近路,为此耗损首都[prosperity|E]。"
 tv_engineering_department.7144.t:0 "建设：要抢回进度，就得逼劳工再咬牙"
 tv_engineering_department.7144.d:0 "工人营地闹了一场热病，医生说病人得好好歇着，不然会传遍整支队伍。要么硬撑着让病人继续做工，工程本身受损；要么让他们停下来养病，损耗的就是劳力本身。这两头，总得选一样。"
 tv_engineering_department.7144.a:0 "让工人停下养病,[tv_wonder_construction|E]进度随之延后。"
 tv_engineering_department.7144.b:0 "让病人硬撑着做工,为此耗损工地劳工[population|E]。"
 tv_engineering_department.7145.t:0 "建设：奇观又在国库上挖了个口子"
 tv_engineering_department.7145.d:0 "奇观建设花钱的速度比预计的要快。国库能说清楚钱花在哪儿，但说明并不能把亏空补上。"
 tv_engineering_department.7145.a:0 "先把账上的窟窿填上。"
 tv_engineering_department.7146.t:0 "建设：王命被工地磨薄了"
 tv_engineering_department.7146.d:0 "王室的名义被工地反复借用，用来说服反对的人。印玺还作数，只是分量轻了一些。"
 tv_engineering_department.7146.a:0 "再借用一次王室的名义。"
 tv_engineering_department.7147.t:0 "建设：施工惊动了地方安宁"
 tv_engineering_department.7147.d:0 "施工的节奏打乱了平常的生活。市场开门晚了，村镇里有些抱怨，秩序稍微松动了一些。"
 tv_engineering_department.7147.a:0 "不理会村镇的抱怨，工程照旧推进。"
 tv_engineering_department.7148.t:0 "建设：宫廷的体面又薄了一层"
 tv_engineering_department.7148.d:0 "宫廷为工程说了不少好话，换来的却是几句闲话。这些没兑现的场面话，多少磨损了一点声望。"
 tv_engineering_department.7148.a:0 "拿一点体面，换几句宫廷里的闲话。"
 tv_engineering_department.7149.t:0 "建设：贵族席间开始说冷话"
 tv_engineering_department.7149.d:0 "贵族家族又一次为工程让步。这次的让步很客气，也很冷淡，反而比直接拒绝更让人不舒服。"
 tv_engineering_department.7149.a:0 "接受贵族这次冷淡的让步。"
 tv_engineering_department.7150.t:0 "建设：祭坛前有人皱起了眉头"
 tv_engineering_department.7150.d:0 "宗教活动的日程又一次为工地调整。教士照做了，但看得出来并不情愿。"
 tv_engineering_department.7150.a:0 "接受教士这次不太情愿的服从。"
 tv_engineering_department.7151.t:0 "建设：商街的账本又薄了一页"
 tv_engineering_department.7151.d:0 "市场上的生意为了绕开工地，多走了不少弯路。商人能从工程里得到好处，但路都被堵住时就谈不上了。"
 tv_engineering_department.7151.a:0 "清开道路，工程照旧！"
 tv_engineering_department.7152.t:0 "建设：村社肩上又压了一担"
 tv_engineering_department.7152.d:0 "乡下又添了一份差事。工程是往前走了，但村社这边的耐心也在变薄。"
 tv_engineering_department.7152.a:0 "让乡下再多担一份差事。"
 tv_engineering_department.7153.t:0 "建设：工址街区又被拆开一块"
 tv_engineering_department.7153.d:0 "工址又拆掉了一部分原有的街巷。将来的奇观多了一块地方，眼前的街区却少了一块。"
 tv_engineering_department.7153.a:0 "拆掉这片街巷，换将来的奇观。"
 tv_engineering_department.7154.t:0 "建设：工址周围的买卖冷了下去"
 tv_engineering_department.7154.d:0 "工地把周边的生意拉了过去，当地的市场因此冷清了一些。这样的调用不能一直做下去。"
 tv_engineering_department.7154.a:0 "再一次把这片生意引到工程这边。"
 tv_engineering_department.7155.t:0 "建设：首都修缮又给奇观让了路"
 tv_engineering_department.7155.d:0 "首都的一些工程项目再次为奇观让路。王城依然气派，只是有些原本该修的地方被搁下了。"
 tv_engineering_department.7155.a:0 "把首都的这部分工程，再让给奇观一次。"
 tv_engineering_department.7156.t:0 "建设：王城街市也被拖冷了"
 tv_engineering_department.7156.d:0 "工程从首都抽走了信用和物资，市场因此少了一些活力。宫廷说这是为国出力，商人只当是生意变差了。"
 tv_engineering_department.7156.a:0 "这份光彩，本就是从别处借来的。"
 tv_engineering_department.7157.t:0 "建设：伤员名册上又添了人"
 tv_engineering_department.7157.d:0 "伤亡名册上又添了名字。工程照常进行，但劳工们看这堆石头的眼神变了。"
 tv_engineering_department.7157.a:0 "记下伤名，继续开工！"
 tv_engineering_department.7158.t:0 "建设：国库先替奇观吞下了代价"
 tv_engineering_department.7158.d:0 "工地这次开口要的数目不小，国库明显被掏空了一块。奇观还没建成，钱已经先花出去了。"
 tv_engineering_department.7158.a:0 "先把国库掏空一些，工程照常往上砌。"
 tv_engineering_department.7159.t:0 "建设：王权的体面被工地扯开了"
 tv_engineering_department.7159.d:0 "工地这次的要求逼得王室不得不让步。原本用来撑场面的权威，如今被压低了一些。"
 tv_engineering_department.7159.a:0 "宁可让王室这次让步，也要把墙砌起来。"
 tv_engineering_department.7160.t:0 "建设：征发把地方搅得更乱了"
 tv_engineering_department.7160.d:0 "这次的扰动传得比往常远，越过了围栏。官员能解释清楚原因，但解释并不能让地方安定下来。"
 tv_engineering_department.7160.a:0 "不去管它，让围栏外的骚动自己平息。"
 tv_engineering_department.7161.t:0 "建设：工地让宫廷声望当众受损"
 tv_engineering_department.7161.d:0 "工地上的一次失礼，传得比官方的澄清还快。工程还没立起来，宫廷的脸面已经先受了损。"
 tv_engineering_department.7161.a:0 "由他们说去！"
 tv_engineering_department.7162.t:0 "建设：贵族的耐心被工地磨没了"
 tv_engineering_department.7162.d:0 "工程这次动用了不少贵族的产业，客气话已经遮不住不满的声音了。"
 tv_engineering_department.7162.a:0 "任凭贵族抱怨，泥瓦照旧往上砌。"
 tv_engineering_department.7163.t:0 "建设：教士的耐心也快用尽了"
 tv_engineering_department.7163.d:0 "这次的施工需求，占用了太靠近祭坛的时间和地方。教士不会轻易忘记这件事。"
 tv_engineering_department.7163.a:0 "教士的这份不满，就当作是石料的代价收下了。"
 tv_engineering_department.7164.t:0 "建设：市民的怒气已经摆上街面"
 tv_engineering_department.7164.d:0 "愤怒的情绪已经传到了店铺门口。工地占用了空间、时间和信用，市民先感受到麻烦，后来才看到工程本身。"
 tv_engineering_department.7164.a:0 "任由店铺发牢骚，脚手架照样往上搭。"
 tv_engineering_department.7165.t:0 "建设：乡间的怨气已经压不住了"
 tv_engineering_department.7165.d:0 "这次的征调让乡下人不再沉默。工程带来的影响，落到了一些可能永远看不到成果的人身上。"
 tv_engineering_department.7165.a:0 "让田地扛着去吧！"
 tv_engineering_department.7166.t:0 "建设：工址先为奇观倒退了一步"
 tv_engineering_department.7166.d:0 "工地这次挖空了不少地方，让工址明显退步了一截。奇观还没建起来，周边地方已经先付出了代价。"
 tv_engineering_department.7166.a:0 "工址退一步，只为让奇观往前迈一步。"
 tv_engineering_department.7167.t:0 "建设：工址的繁荣先被压暗了"
 tv_engineering_department.7167.d:0 "本地的市场被工地压得冷清了一阵子。车队还在来往，只是很少再为周边的城镇服务。"
 tv_engineering_department.7167.a:0 "由着本地市场淡下去，工程照旧不停。"
 tv_engineering_department.7168.t:0 "建设：首都先替奇观付了账"
 tv_engineering_department.7168.d:0 "首都这次拿出了石料、人力，还有一些本该完成的修缮。远方的奇观变得更真实了，首都自己的计划却空了下来。"
 tv_engineering_department.7168.a:0 "让首都自己的修缮先等一等，给远方的奇观让路。"
 tv_engineering_department.7169.t:0 "建设：王城买卖也被奇观拖慢了"
 tv_engineering_department.7169.d:0 "首都的贸易被工程压低了不少。远方的奇观越来越有分量，供养它的首都街道却暗淡了下来。"
 tv_engineering_department.7169.a:0 "压低首都的生意，去供养别处的这座奇观。"
 tv_engineering_department.7170.t:0 "建设：工地把劳工逼出了伤亡"
 tv_engineering_department.7170.d:0 "工地上出了人命。工程没有因此停下，这大概是最让人难受的一点。"
 tv_engineering_department.7170.a:0 "工地已经出了人命，我们仍然往前走。"
 tv_engineering_department.7171.t:0 "建设：[tv_great_engineer|E]当众说服了围观者"
 tv_engineering_department.7171.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]把一次普通的巡视办成了一场公开的胜利，[tv_wonder_domestic_support|E]因此大幅提高。\n\n#G 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力高于80。#!"
 tv_engineering_department.7171.a:0 "把一次普通的巡视，办成了满城称赞的事。"
 tv_engineering_department.7172.t:0 "建设：[tv_great_engineer|E]重画了主轴线"
 tv_engineering_department.7172.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]重新画了主轴线，让更大的方案一下子变得可行，[tv_wonder_scale_competence|E]因此大幅提高。\n\n#G 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力高于80。#!"
 tv_engineering_department.7172.a:0 "让这条主轴显得站得住脚，而不是孤注一掷。"
 tv_engineering_department.7173.t:0 "建设：[tv_great_engineer|E]把工序全都重排了"
 tv_engineering_department.7173.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]把排班重新安排了一遍，连最挑剔的工头都没话可说，[tv_wonder_organization_competence|E]因此大幅提高。\n\n#G 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力高于80。#!"
 tv_engineering_department.7173.a:0 "干脆照这套新排班来。"
 tv_engineering_department.7174.t:0 "建设：[tv_great_engineer|E]重新打通了运路"
 tv_engineering_department.7174.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]打通了一条补给线，让过去的拖延显得没有必要，[tv_wonder_logistics_competence|E]因此大幅提高。\n\n#G 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力高于80。#!"
 tv_engineering_department.7174.a:0 "路终于通了！"
 tv_engineering_department.7175.t:0 "建设：[tv_great_engineer|E]亲手推过了主工段"
 tv_engineering_department.7175.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]亲自带着主体工程越过了一处一直卡住的难题，[tv_wonder_construction|E]进度因此大幅提高。\n\n#G 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力高于80。#!"
 tv_engineering_department.7175.a:0 "把卡住的工段硬生生推了过去。"
 tv_engineering_department.7176.t:0 "建设：[tv_great_engineer|E]把议论压了下去"
 tv_engineering_department.7176.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]用清楚的解释压下了流言，[tv_wonder_domestic_support|E]因此稳步提高。\n\n#G 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力高于50。#!"
 tv_engineering_department.7176.a:0 "拿实话把流言压了下去。"
 tv_engineering_department.7177.t:0 "建设：[tv_great_engineer|E]校准了场地尺度"
 tv_engineering_department.7177.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]在场地里找出了多余的空间，[tv_wonder_scale_competence|E]因此稳步提高。\n\n#G 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力高于50。#!"
 tv_engineering_department.7177.a:0 "给这个方案，留出了足够的余地。"
 tv_engineering_department.7178.t:0 "建设：[tv_great_engineer|E]理顺了工棚名册"
 tv_engineering_department.7178.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]理顺了工队、工具和夜班之间的混乱，[tv_wonder_organization_competence|E]因此稳步提高。\n\n#G 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力高于50。#!"
 tv_engineering_department.7178.a:0 "把工队、工具和更次都理顺了。"
 tv_engineering_department.7179.t:0 "建设：[tv_great_engineer|E]疏通了补给车队"
 tv_engineering_department.7179.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]解开了车队日程上最难缠的一个结，[tv_wonder_logistics_competence|E]因此稳步提高。\n\n#G 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力高于50。#!"
 tv_engineering_department.7179.a:0 "解开了补给线上最糟的死结。"
 tv_engineering_department.7180.t:0 "建设：[tv_great_engineer|E]补上了关键部件"
 tv_engineering_department.7180.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]把一个关键部件装上了，[tv_wonder_construction|E]进度因此稳步提高。\n\n#G 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力高于50。#!"
 tv_engineering_department.7180.a:0 "即刻推进，毫不耽搁！"
 tv_engineering_department.7181.t:0 "建设：[tv_great_engineer|E]决定拿工地去赌人心"
 tv_engineering_department.7181.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]把还没完工的部分提前展示给了公众。这个决定可能提高[tv_wonder_domestic_support|E]，也可能让工地付出代价。\n\n#Y 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力处于20到80之间。#!"
 tv_engineering_department.7181.a:0 "任由人群评判这堆未完工的石头。"
 tv_engineering_department.7182.t:0 "建设：[tv_great_engineer|E]执意放大了蓝图"
 tv_engineering_department.7182.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]在疑虑还没消除之前，就下令扩大了图纸。这个决定可能提高[tv_wonder_scale_competence|E]，也可能让工地付出代价。\n\n#Y 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力处于20到80之间。#!"
 tv_engineering_department.7182.a:0 "趁疑虑未消，先把蓝图放大。"
 tv_engineering_department.7183.t:0 "建设：[tv_great_engineer|E]当场改了排班"
 tv_engineering_department.7183.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]在一个下午之内改写了班次安排。这个决定可能提高[tv_wonder_organization_competence|E]，也可能让工地付出代价。\n\n#Y 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力处于20到80之间。#!"
 tv_engineering_department.7183.a:0 "我们改写班次，看工地能否跟得上。"
 tv_engineering_department.7184.t:0 "建设：[tv_great_engineer|E]让车队改走险路"
 tv_engineering_department.7184.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]让车队改走一条更难走的路。这个决定可能提高[tv_wonder_logistics_competence|E]，也可能让工地付出代价。\n\n#Y 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力处于20到80之间。#!"
 tv_engineering_department.7184.a:0 "让车队改走这条难路，赌的是算得准，不是图省事。"
 tv_engineering_department.7185.t:0 "建设：[tv_great_engineer|E]强行试了新工法"
 tv_engineering_department.7185.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]在最显眼的部件上试用了一种更快的工法。这个决定可能提高[tv_wonder_construction|E]进度，也可能让工地付出代价。\n\n#Y 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力处于20到80之间。#!"
 tv_engineering_department.7185.a:0 "试试这更快的工法，就让它当众见分晓！"
 tv_engineering_department.7186.t:0 "建设：[tv_great_engineer|E]把修补费用算漏了"
 tv_engineering_department.7186.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]低估了一项维修的花费。工程还能继续，但[gold|E]要为这次疏忽受损。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7186.a:0 "先把这笔亏空补上，免得账目被人追问。"
 tv_engineering_department.7187.t:0 "建设：[tv_great_engineer|E]把王命用得太随手了"
 tv_engineering_department.7187.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]把王室的名义用得太随意了。工程还能继续，但[legitimacy|E]要为这次疏忽受损。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7187.a:0 "这次滥用王室名义的做法，得收一收。"
 tv_engineering_department.7188.t:0 "建设：[tv_great_engineer|E]低估了施工扰动"
 tv_engineering_department.7188.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]低估了一项工程方案会引起多大的动静。工程还能继续，但[stability|E]要为这次疏忽受损。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7188.a:0 "把这套整齐方案惹出的骚动抚平。"
 tv_engineering_department.7189.t:0 "建设：[tv_great_engineer|E]把话说得太满了"
 tv_engineering_department.7189.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]在工程还没做出成绩之前，就把话说满了。工程还能继续，但[prestige|E]要为这次疏忽受损。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7189.a:0 "把话收回来！"
 tv_engineering_department.7190.t:0 "建设：[tv_great_engineer|E]把贵族耐性当成了存货"
 tv_engineering_department.7190.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]把贵族的耐心当成了可以随时支取的储备。工程还能继续，但贵族[estate_satisfaction|E]要为这次疏忽受损。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7190.a:0 "提醒工程师，贵族的耐性可不是随取随用的库存。"
 tv_engineering_department.7191.t:0 "建设：[tv_great_engineer|E]把祭坛也卷进了工期"
 tv_engineering_department.7191.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]把宗教日程当成了普通的运输安排来对待。工程还能继续，但教士[estate_satisfaction|E]要为这次疏忽受损。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7191.a:0 "把祭坛的日历还给祭坛自己。"
 tv_engineering_department.7192.t:0 "建设：[tv_great_engineer|E]拿商路给工地让了道"
 tv_engineering_department.7192.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]为了让工程线路更顺畅，挡住了平常的买卖。工程还能继续，但市民[estate_satisfaction|E]要为这次疏忽受损。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7192.a:0 "我们把工地挡住的商路重新开出来。"
 tv_engineering_department.7193.t:0 "建设：[tv_great_engineer|E]把村社余力看多了"
 tv_engineering_department.7193.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]把已经疲惫的村社当成了还没动用的人手。工程还能继续，但平民[estate_satisfaction|E]要为这次疏忽受损。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7193.a:0 "让已经疲惫的村社喘一口气，别再被当储备使唤。"
 tv_engineering_department.7194.t:0 "建设：[tv_great_engineer|E]把工址拆过了头"
 tv_engineering_department.7194.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]拆错了当地的一处安排，还把这个缺口当成可用的空间。工程还能继续，但工址[development|E]要为这次疏忽受损。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
