 tv_engineering_department.7209.t:0 "建设：[tv_great_engineer|E]掏空了首都安排"
 tv_engineering_department.7209.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]为了掩盖工地上的失误，掏空了首都原本的规划。这个错误还不至于让奇观停工，这大概才是最让人难堪的地方。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于20。#!"
