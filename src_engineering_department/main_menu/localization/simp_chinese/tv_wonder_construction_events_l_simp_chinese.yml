 tv_engineering_department.7033.d:0 "这个月的账不太好看：要让[tv_wonder_scale_competence|E]往前挪一挪，就得先在首都[development|E]上吃点亏。工头们说这笔账划算，但首都[development|E]这个月确实吃了亏，谁看了都清楚。"
 tv_engineering_department.7033.a:0 "抓住了这难得的机会。"
 tv_engineering_department.7033.b:0 "由着这个月悄悄过去。"
 tv_engineering_department.7034.t:0 "[tv_wonder_construction|E]：王城商气托起更大规模"
 tv_engineering_department.7034.d:0 "工头们把话说得很直接：这个月先在首都[prosperity|E]上让一步，马上就能换成[tv_wonder_scale_competence|E]上的进展。没人说这是笔多体面的买卖，只说这么做管用。"
 tv_engineering_department.7034.a:0 "落笔签下了这笔交换。"
 tv_engineering_department.7034.b:0 "把这个提议撂在了一边。"
 tv_engineering_department.7035.t:0 "[tv_wonder_construction|E]：劳工把尺度硬撑了出来"
 tv_engineering_department.7035.d:0 "这笔账说白了很简单：这个月要紧一紧工址劳工[population|E]这头，才能让[tv_wonder_scale_competence|E]松动一步。工程部门没打算隐瞒这一点，只是提醒大家，这个月紧出来的这部分不会自己松回来。"
 tv_engineering_department.7035.a:0 "这个价，我们认了。"
 tv_engineering_department.7035.b:0 "先按兵不动。"
 tv_engineering_department.7036.t:0 "[tv_wonder_construction|E]：追加拨款整顿工序"
 tv_engineering_department.7036.d:0 "工程部门这次是拿[gold|E]赌了一把，赌的是能换回[tv_wonder_organization_competence|E]上的进展。这一手算是赌对了，工地这次是真的往前走了。"
 tv_engineering_department.7036.a:0 "这笔交易，我们接下了。"
 tv_engineering_department.7036.b:0 "婉拒了这笔交易。"
 tv_engineering_department.7037.t:0 "[tv_wonder_construction|E]：王命压住了工地杂音"
 tv_engineering_department.7037.d:0 "说白了没什么好粉饰的：这个月要先动[legitimacy|E]，[tv_wonder_organization_competence|E]才能往前挪。工程师们没多说什么，直接照办了，心里清楚这部分损失不会自己补回来。"
 tv_engineering_department.7037.a:0 "我们会让它物有所值。"
 tv_engineering_department.7037.b:0 "这次，我们先观望。"
 tv_engineering_department.7038.t:0 "[tv_wonder_construction|E]：地方让路，排班得以重整"
 tv_engineering_department.7038.d:0 "要把工程往前推一步，总得先花掉点别的东西。这次花的是[stability|E]，换来的是[tv_wonder_organization_competence|E]上看得见的进展，代价不小，但确实管用。"
 tv_engineering_department.7038.a:0 "这笔买卖，我们拿下了。"
 tv_engineering_department.7038.b:0 "我们暂时不接这个茬。"
