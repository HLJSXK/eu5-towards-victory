 tv_engineering_department.7071.d:0 "工头们商量了一下，决定这个月先耗一些工址[prosperity|E]，换[tv_wonder_construction|E]进度往前挪一挪。这样做马上就能见效，只是工址[prosperity|E]这个月确实要吃点亏。"
 tv_engineering_department.7071.a:0 "收下了这笔买卖。"
 tv_engineering_department.7071.b:0 "先按兵不动。"
 tv_engineering_department.7072.t:0 "[tv_wonder_construction|E]：首都余裕压进主工段"
 tv_engineering_department.7072.d:0 "工程部门这次是先斩后奏：先动用了首都[development|E]，才换来[tv_wonder_construction|E]进度上看得见的进展。至于这笔账以后要不要找补，暂时没人细算。"
 tv_engineering_department.7072.a:0 "抓住了这难得的机会。"
 tv_engineering_department.7072.b:0 "婉拒了这笔交易。"
 tv_engineering_department.7073.t:0 "[tv_wonder_construction|E]：王城商气化成石料与工时"
 tv_engineering_department.7073.d:0 "这个月的账不太好看：要让[tv_wonder_construction|E]进度往前挪一挪，就得先在首都[prosperity|E]上吃点亏。工头们说这笔账划算，但首都[prosperity|E]这个月确实吃了亏，谁看了都清楚。"
 tv_engineering_department.7073.a:0 "落笔签下了这笔交换。"
 tv_engineering_department.7073.b:0 "这次，我们先观望。"
 tv_engineering_department.7074.t:0 "[tv_wonder_construction|E]：劳工把进度硬推过线"
 tv_engineering_department.7074.d:0 "工头们把话说得很直接：这个月先在工址劳工[population|E]上让一步，马上就能换成[tv_wonder_construction|E]进度上的进展。没人说这是笔多体面的买卖，只说这么做管用。"
 tv_engineering_department.7074.a:0 "这个价，我们认了。"
 tv_engineering_department.7074.b:0 "我们暂时不接这个茬。"
 tv_engineering_department.7075.t:0 "[tv_wonder_construction|E]：工地外的议论又起了"
 tv_engineering_department.7075.d:0 "工地打算在公众面前做一次展示。这可能拉近工地和民众的距离，也可能招来批评，[tv_wonder_domestic_support|E]会因此提高还是下降，现在还说不准。"
 tv_engineering_department.7075.a:0 "让这次展示的结果说明一切。"
 tv_engineering_department.7076.t:0 "[tv_wonder_construction|E]：场地开始装不下图纸"
 tv_engineering_department.7076.d:0 "有人提出把设计规模再扩大一些。这个决定要么让工程变得更宏伟，要么日后被证明是个失误。"
 tv_engineering_department.7076.a:0 "把设计规模再放大一些。"
 tv_engineering_department.7077.t:0 "[tv_wonder_construction|E]：排班命令一改再改"
 tv_engineering_department.7077.d:0 "工地打算换一套新的指挥办法。这可能让工地更有秩序，也可能只是换了个吵架的由头。"
 tv_engineering_department.7077.a:0 "把这套新的指挥办法推行下去。"
 tv_engineering_department.7078.t:0 "[tv_wonder_construction|E]：补给线被迫改道"
 tv_engineering_department.7078.d:0 "有一条路能缩短运输时间，但不太好走。天气配合的话是件好事，天气不配合，下令的人就要担这个责任。"
 tv_engineering_department.7078.a:0 "走这条近路！"
 tv_engineering_department.7079.t:0 "[tv_wonder_construction|E]：新工法还站不住脚"
 tv_engineering_department.7079.d:0 "当前部件打算试用一种更快的工法。顺利的话能赶上进度，不顺利就要多花一个月返工。"
 tv_engineering_department.7079.a:0 "在当前部件上试用这套新工法。"
 tv_engineering_department.7080.t:0 "[tv_wonder_construction|E]：民心要稳，国库就得出血"
 tv_engineering_department.7080.d:0 "这个月的损失躲不掉，只能决定让谁来承担：是让[tv_wonder_domestic_support|E]受损，还是把代价转到[gold|E]身上。不管选哪边，总得有一方吃亏。"
 tv_engineering_department.7080.a:0 "我们咽下这口气，继续往前走。"
 tv_engineering_department.7080.b:0 "这次，就让别处承担吧。"
 tv_engineering_department.7081.t:0 "[tv_wonder_construction|E]：民心要稳，王命就得受折"
 tv_engineering_department.7081.d:0 "工地上出了点意外，损失总要落在什么地方。可以让[tv_wonder_domestic_support|E]直接受损，也可以把这份压力转出去，让[legitimacy|E]来承担。"
 tv_engineering_department.7081.a:0 "不管代价多少，我们守住这里。"
 tv_engineering_department.7081.b:0 "我们护住这里，代价挪去别处。"
 tv_engineering_department.7082.t:0 "[tv_wonder_construction|E]：民心要稳，地方就得受扰"
 tv_engineering_department.7082.d:0 "工程遇到了麻烦，总得有个地方吃亏。要么让[tv_wonder_domestic_support|E]先受影响，要么把这份负担转给[stability|E]。"
 tv_engineering_department.7082.a:0 "这次，我们自己扛下。"
 tv_engineering_department.7082.b:0 "我们把这一击引向了别处。"
 tv_engineering_department.7083.t:0 "[tv_wonder_construction|E]：民心要稳，声望就得拿去消耗"
 tv_engineering_department.7083.d:0 "现在有两个办法，只能挑一个：让[tv_wonder_domestic_support|E]承受这次损失，或者把损失转移出去，让[prestige|E]来承受。"
 tv_engineering_department.7083.a:0 "扛下来！"
 tv_engineering_department.7083.b:0 "转个方向！"
 tv_engineering_department.7084.t:0 "[tv_wonder_construction|E]：民心要稳，贵族就得忍着"
 tv_engineering_department.7084.d:0 "这次的麻烦总要落在什么地方。挡在这里，损失的就是[tv_wonder_domestic_support|E]；放到别处去，受影响的就变成贵族[estate_satisfaction|E]。"
 tv_engineering_department.7084.a:0 "宁受明伤，不留暗患。"
 tv_engineering_department.7084.b:0 "留住这片屋顶，任雨水改道别檐。"
