 tv_engineering_department.7088.d:0 "这笔账无论怎么算都要吃亏。可以让[tv_wonder_domestic_support|E]来承担这个差额，也可以把差额转出去，交给工址[development|E]。"
 tv_engineering_department.7088.a:0 "把损失留在自己身上扛。"
 tv_engineering_department.7088.b:0 "把这份损失挡开、转向别处。"
