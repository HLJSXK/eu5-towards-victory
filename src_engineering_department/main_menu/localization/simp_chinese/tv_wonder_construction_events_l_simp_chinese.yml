 tv_engineering_department.7204.t:0 "建设：[tv_great_engineer|E]把教士也得罪透了"
 tv_engineering_department.7204.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]让宗教上的耐心为世俗的石料买了单，冒犯了教士。这个错误还不至于让奇观停工，这大概才是最让人难堪的地方。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于20。#!"
 tv_engineering_department.7204.a:0 "让教士的这份耐心，替这些石料买了单。"
 tv_engineering_department.7205.t:0 "建设：[tv_great_engineer|E]把市民逼出了火气"
 tv_engineering_department.7205.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]把市面上的生意当成了可以随意挪用的东西，惹恼了市民。这个错误还不至于让奇观停工，这大概才是最让人难堪的地方。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于20。#!"
