 tv_engineering_department.7144.t:0 "[tv_wonder_construction|E]：要抢回进度，就得逼劳工再咬牙"
 tv_engineering_department.7144.d:0 "工地上出了一次意外，损失必须有人承担。可以让[tv_wonder_construction|E]进度直接受损，也可以把这份压力转移出去，改由工址劳工[population|E]来承受。"
 tv_engineering_department.7144.a:0 "宁受明伤，不留暗患。"
 tv_engineering_department.7144.b:0 "我们护住这里，代价挪去别处。"
 tv_engineering_department.7145.t:0 "[tv_wonder_construction|E]：奇观又在国库上挖了个口子"
 tv_engineering_department.7145.d:0 "奇观吃钱的速度超过账册预期。司库能解释短缺从何而来，却不能把解释铸成银币。"
 tv_engineering_department.7145.a:0 "拉紧账册填上这个窟窿。"
 tv_engineering_department.7146.t:0 "[tv_wonder_construction|E]：王命被工地磨薄了"
 tv_engineering_department.7146.d:0 "王命被拉过太多现实妥协。印玺仍然有效，却显得薄了。"
 tv_engineering_department.7146.a:0 "由着王命再磨薄一分。"
 tv_engineering_department.7147.t:0 "[tv_wonder_construction|E]：施工惊动了地方安宁"
 tv_engineering_department.7147.d:0 "施工节奏压到了寻常生活。市场晚开，村镇低语，秩序稍稍后退。"
 tv_engineering_department.7147.a:0 "我们由着村镇低语，照旧推进工程。"
 tv_engineering_department.7148.t:0 "[tv_wonder_construction|E]：宫廷的体面又薄了一层"
 tv_engineering_department.7148.d:0 "宫廷给工程添色，收回的却是灰尘。几句玩笑和几个未兑现的夸口足以磨薄声望。"
 tv_engineering_department.7148.a:0 "拿几分体面换几句宫廷笑话。"
 tv_engineering_department.7149.t:0 "[tv_wonder_construction|E]：贵族席间开始说冷话"
 tv_engineering_department.7149.d:0 "贵族家门再次为工程让路。让步很正式，也很冷，这往往比拒绝更难处理。"
 tv_engineering_department.7149.a:0 "接受贵族门第这份冷淡而正式的让步。"
 tv_engineering_department.7150.t:0 "[tv_wonder_construction|E]：祭坛前有人皱起了眉头"
 tv_engineering_department.7150.d:0 "神圣日程再次为工地弯折。教士服从了，但服从带着棱角。"
 tv_engineering_department.7150.a:0 "我们接受教士带棱角的服从。"
 tv_engineering_department.7151.t:0 "[tv_wonder_construction|E]：商街的账本又薄了一页"
 tv_engineering_department.7151.d:0 "市场生意被迫绕着工程转。市民可以从宏伟中获利，但不能在每条路都被堵住时获利。"
 tv_engineering_department.7151.a:0 "清开道路，工程照旧！"
 tv_engineering_department.7152.t:0 "[tv_wonder_construction|E]：村社肩上又压了一担"
 tv_engineering_department.7152.d:0 "乡村肩膀又添一担。工程前进了，村社耐性也变薄了。"
 tv_engineering_department.7152.a:0 "让乡村肩膀再多扛一担。"
 tv_engineering_department.7153.t:0 "[tv_wonder_construction|E]：工址街区又被拆开一块"
 tv_engineering_department.7153.d:0 "工址又交出一部分日常肌理。未来奇观得到空间，眼前街巷失去用途。"
 tv_engineering_department.7153.a:0 "签下这片街巷，换未来的奇观。"
 tv_engineering_department.7154.t:0 "[tv_wonder_construction|E]：工址周围的买卖冷了下去"
 tv_engineering_department.7154.d:0 "当地商业因工程牵引而安静。繁荣可以改道，但改道太多次就会变薄。"
 tv_engineering_department.7154.a:0 "我们再次把这片买卖引向工程。"
 tv_engineering_department.7155.t:0 "[tv_wonder_construction|E]：首都修缮又给奇观让了路"
 tv_engineering_department.7155.d:0 "首都工程再次为奇观让路。王城仍然宏伟，只是骨架被借走了一些。"
 tv_engineering_department.7155.a:0 "把王城的骨架再借给奇观一次。"
 tv_engineering_department.7156.t:0 "[tv_wonder_construction|E]：王城街市也被拖冷了"
 tv_engineering_department.7156.d:0 "工程吸走信用和货物，首都市场少了几分亮色。宫廷称之为爱国，商人称之为生意变慢。"
 tv_engineering_department.7156.a:0 "每一座丰碑，都要从别处借些光彩。"
 tv_engineering_department.7157.t:0 "[tv_wonder_construction|E]：伤员名册上又添了人"
 tv_engineering_department.7157.d:0 "伤员名册添了新名字。工程继续，但每个新标记都会改变劳工看石头的眼神。"
 tv_engineering_department.7157.a:0 "记下伤名，继续开工！"
 tv_engineering_department.7158.t:0 "[tv_wonder_construction|E]：国库先替奇观吞下了代价"
 tv_engineering_department.7158.d:0 "工地一次硬邦邦的索取让国库明显塌下去一块。奇观还没供人瞻仰，国家已经先付了账。"
 tv_engineering_department.7158.a:0 "国库先掏空,工程照常往上砌。"
 tv_engineering_department.7159.t:0 "[tv_wonder_construction|E]：王权的体面被工地扯开了"
 tv_engineering_department.7159.d:0 "工地迫使王权摆出并不体面的姿态。宏伟的承诺如今压在受损的权威上。"
 tv_engineering_department.7159.a:0 "我们宁可让王权低头,也要把高墙立起来。"
 tv_engineering_department.7160.t:0 "[tv_wonder_construction|E]：征发把地方搅得更乱了"
 tv_engineering_department.7160.d:0 "更硬的扰动越过围栏。官员能说清原因，却不能靠说明让国家重新安稳。"
 tv_engineering_department.7160.a:0 "由它去闹,围栏外的骚动自行平息。"
 tv_engineering_department.7161.t:0 "[tv_wonder_construction|E]：工地让宫廷声望当众受损"
 tv_engineering_department.7161.d:0 "工地上的尴尬比官方修正跑得更快。荣誉正在为尚未立起的石头付账。"
 tv_engineering_department.7161.a:0 "由他们说去!"
 tv_engineering_department.7162.t:0 "[tv_wonder_construction|E]：贵族的耐心被工地磨没了"
 tv_engineering_department.7162.d:0 "工程凿穿了贵族耐性，礼貌已经遮不住声响。会吞家产的奇观，从来不是好客人。"
 tv_engineering_department.7162.a:0 "任凭贵族抱怨,泥瓦照旧往上砌。"
 tv_engineering_department.7163.t:0 "[tv_wonder_construction|E]：教士的耐心也快用尽了"
 tv_engineering_department.7163.d:0 "施工需求踩得离祭坛太近。虔敬被当成空地时，教士不会忘记。"
 tv_engineering_department.7163.a:0 "我们把教士的冷脸,当作石料的代价收下。"
 tv_engineering_department.7164.t:0 "[tv_wonder_construction|E]：市民的怒气已经摆上街面"
 tv_engineering_department.7164.d:0 "愤怒抵达店门口；工地吞下空间、时间和信用，城市先听见奇观，再看见奇观。"
 tv_engineering_department.7164.a:0 "任由店铺发牢骚,脚手架照样往上搭。"
 tv_engineering_department.7165.t:0 "[tv_wonder_construction|E]：乡间的怨气已经压不住了"
 tv_engineering_department.7165.d:0 "这次征调后，乡间怒气不会安静待在田里。奇观的阴影已经落到也许永远看不见它的人身上。"
 tv_engineering_department.7165.a:0 "让田地扛着去吧!"
 tv_engineering_department.7166.t:0 "[tv_wonder_construction|E]：工址先为奇观倒退了一步"
 tv_engineering_department.7166.d:0 "工程把工址挖空到足以倒退。奇观还没有升起，周围地点已经先付了账。"
 tv_engineering_department.7166.a:0 "工址退一步,只为让奇观往前迈一步。"
 tv_engineering_department.7167.t:0 "[tv_wonder_construction|E]：工址的繁荣先被压暗了"
 tv_engineering_department.7167.d:0 "工地一时闷住了本地市场。车队仍在抵达，只是其中更少服务于石头周围的城镇。"
 tv_engineering_department.7167.a:0 "由着本地市场淡下去,工程照旧不停。"
 tv_engineering_department.7168.t:0 "[tv_wonder_construction|E]：首都先替奇观付了账"
 tv_engineering_department.7168.d:0 "首都用石料、劳力和迟到的修缮付账。远处纪念碑更真实，近处计划更空。"
 tv_engineering_department.7168.a:0 "我们让首都自己的修缮,给远方的奇观让路。"
 tv_engineering_department.7169.t:0 "[tv_wonder_construction|E]：王城买卖也被奇观拖慢了"
 tv_engineering_department.7169.d:0 "王城贸易被工程压低。远处的宏伟，正在削暗负责供养它的街道。"
 tv_engineering_department.7169.a:0 "压暗王城的街市,去供养别处的宏伟。"
 tv_engineering_department.7170.t:0 "[tv_wonder_construction|E]：工地把劳工逼出了伤亡"
 tv_engineering_department.7170.d:0 "汗水在工地越界成血。奇观没有因此停下，这也许正是最残酷的教训。"
 tv_engineering_department.7170.a:0 "我们仍然往前走,尽管工地已经流了血。"
 tv_engineering_department.7171.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]当众说服了围观者"
 tv_engineering_department.7171.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]把一次技术巡视变成公开胜利，使[tv_wonder_domestic_support|E]大幅提高。\n\n#G 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力高于80。#!"
 tv_engineering_department.7171.a:0 "把一次寻常巡视变成了满城喝彩。"
 tv_engineering_department.7172.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]重画了主轴线"
 tv_engineering_department.7172.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]重画主轴，让更宏大的方案忽然可靠，使[tv_wonder_scale_competence|E]大幅提高。\n\n#G 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力高于80。#!"
 tv_engineering_department.7172.a:0 "让这条主轴显得理所当然，而非孤注一掷。"
 tv_engineering_department.7173.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]把工序全都重排了"
 tv_engineering_department.7173.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]重建排班，连最挑剔的工头也只能照办，使[tv_wonder_organization_competence|E]大幅提高。\n\n#G 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力高于80。#!"
 tv_engineering_department.7173.a:0 "我们索性听命于这套新排班。"
 tv_engineering_department.7174.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]重新打通了运路"
 tv_engineering_department.7174.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]打开一条补给线，让旧日拖延显得荒唐，使[tv_wonder_logistics_competence|E]大幅提高。\n\n#G 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力高于80。#!"
 tv_engineering_department.7174.a:0 "路终于通了！"
 tv_engineering_department.7175.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]亲手推过了主工段"
 tv_engineering_department.7175.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]带着主体工程越过困住平庸者的问题，使[tv_wonder_construction|E]进度大幅提高。\n\n#G 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力高于80。#!"
 tv_engineering_department.7175.a:0 "把卡住的工段硬生生推了过去。"
 tv_engineering_department.7176.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]把议论压了下去"
 tv_engineering_department.7176.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]用清楚解释压下谣言，让[tv_wonder_domestic_support|E]获得了稳当的改善。\n\n#G 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力高于50。#!"
 tv_engineering_department.7176.a:0 "拿实话把流言压了下去。"
 tv_engineering_department.7177.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]校准了场地尺度"
 tv_engineering_department.7177.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]从场地里找出余量，让[tv_wonder_scale_competence|E]获得了稳当的改善。\n\n#G 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力高于50。#!"
 tv_engineering_department.7177.a:0 "我们给方案留出了底气。"
 tv_engineering_department.7178.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]理顺了工棚名册"
 tv_engineering_department.7178.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]理顺工队、工具和夜班之间的乱结，让[tv_wonder_organization_competence|E]获得了稳当的改善。\n\n#G 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力高于50。#!"
 tv_engineering_department.7178.a:0 "把工队、工具和更次都理顺了。"
 tv_engineering_department.7179.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]疏通了补给车队"
 tv_engineering_department.7179.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]解开车队日程上最糟的结，让[tv_wonder_logistics_competence|E]获得了稳当的改善。\n\n#G 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力高于50。#!"
 tv_engineering_department.7179.a:0 "解开了补给线上最糟的死结。"
 tv_engineering_department.7180.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]补上了关键部件"
 tv_engineering_department.7180.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]嵌好关键部件，让[tv_wonder_construction|E]进度获得了稳当的改善。\n\n#G 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力高于50。#!"
 tv_engineering_department.7180.a:0 "即刻推进，毫不耽搁！"
 tv_engineering_department.7181.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]决定拿工地去赌人心"
 tv_engineering_department.7181.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]把未完工的石头推到人群面前。这个决定可能抬高[tv_wonder_domestic_support|E]，也可能让工地付出昂贵代价。\n\n#Y 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力处于20到80之间。#!"
 tv_engineering_department.7181.a:0 "任由人群评判这堆未完工的石头。"
 tv_engineering_department.7182.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]执意放大了蓝图"
 tv_engineering_department.7182.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]在疑虑尚未付清前命令图纸放大。这个决定可能抬高[tv_wonder_scale_competence|E]，也可能让工地付出昂贵代价。\n\n#Y 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力处于20到80之间。#!"
 tv_engineering_department.7182.a:0 "趁疑虑未消，先把蓝图放大。"
 tv_engineering_department.7183.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]当场改了排班"
 tv_engineering_department.7183.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]在一个下午改写班次。这个决定可能抬高[tv_wonder_organization_competence|E]，也可能让工地付出昂贵代价。\n\n#Y 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力处于20到80之间。#!"
 tv_engineering_department.7183.a:0 "我们改写班次,看工地能否跟得上。"
 tv_engineering_department.7184.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]让车队改走险路"
 tv_engineering_department.7184.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]让车队走难路。这个决定可能抬高[tv_wonder_logistics_competence|E]，也可能让工地付出昂贵代价。\n\n#Y 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力处于20到80之间。#!"
 tv_engineering_department.7184.a:0 "让车队改走险路,赌的是算计而非习惯。"
 tv_engineering_department.7185.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]强行试了新工法"
 tv_engineering_department.7185.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]在失败会非常显眼的位置试用更快工法。这个决定可能抬高[tv_wonder_construction|E]进度，也可能让工地付出昂贵代价。\n\n#Y 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力处于20到80之间。#!"
 tv_engineering_department.7185.a:0 "试试这更快的工法,就让它当众见分晓!"
 tv_engineering_department.7186.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]把修补费用算漏了"
 tv_engineering_department.7186.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]低估了一项修补的花费，把优雅留给图纸，把窟窿留给国库。工程还能继续，但[gold|E]要为这次疏忽受损。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7186.a:0 "先把这笔亏空补上，免得账目被人追问。"
 tv_engineering_department.7187.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]把王命用得太随手了"
 tv_engineering_department.7187.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]忘记王权也是材料，并且挥霍得太顺手。工程还能继续，但[legitimacy|E]要为这次疏忽受损。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7187.a:0 "我们把这份王命的滥用收一收。"
 tv_engineering_department.7188.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]低估了施工扰动"
 tv_engineering_department.7188.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]低估了一个整齐工程答案会制造多少扰动。工程还能继续，但[stability|E]要为这次疏忽受损。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7188.a:0 "把这套整齐方案惹出的骚动抚平。"
 tv_engineering_department.7189.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]把话说得太满了"
 tv_engineering_department.7189.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]在工程还撑不起豪言前说得太满。工程还能继续，但[prestige|E]要为这次疏忽受损。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7189.a:0 "把话收回来！"
 tv_engineering_department.7190.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]把贵族耐性当成了存货"
 tv_engineering_department.7190.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]把贵族耐性当成另一种库存来使用。工程还能继续，但贵族[estate_satisfaction|E]要为这次疏忽受损。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7190.a:0 "提醒工程师，贵族的耐性可不是随取随用的库存。"
 tv_engineering_department.7191.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]把祭坛也卷进了工期"
 tv_engineering_department.7191.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]把宗教日历当成运输表一样翻动。工程还能继续，但教士[estate_satisfaction|E]要为这次疏忽受损。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7191.a:0 "把祭坛的日历还给祭坛自己。"
 tv_engineering_department.7192.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]拿商路给工地让了道"
 tv_engineering_department.7192.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]为了更干净的工程线条挡住了寻常贸易。工程还能继续，但市民[estate_satisfaction|E]要为这次疏忽受损。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7192.a:0 "我们把工地挡住的商路重新开出来。"
 tv_engineering_department.7193.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]把村社余力看多了"
 tv_engineering_department.7193.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]把疲惫村社误看成未动用储备。工程还能继续，但平民[estate_satisfaction|E]要为这次疏忽受损。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7193.a:0 "让已经疲惫的村社喘一口气，别再被当储备使唤。"
 tv_engineering_department.7194.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]把工址拆过了头"
 tv_engineering_department.7194.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]切错了当地安排，并把缺口称作可用空间。工程还能继续，但工址[development|E]要为这次疏忽受损。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7194.a:0 "把这处切错的地方重新补上。"
 tv_engineering_department.7195.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]挤掉了工址生计"
 tv_engineering_department.7195.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]为了清理工地，挤开了当地生计。工程还能继续，但工址[prosperity|E]要为这次疏忽受损。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7195.a:0 "我们把被工地挤走的生计再腾出些地方。"
 tv_engineering_department.7196.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]误动了首都余裕"
 tv_engineering_department.7196.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]误用首都资源，仿佛王城没有自己的安排。工程还能继续，但首都[development|E]要为这次疏忽受损。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7196.a:0 "把这些被挪用的资源还给首都自己的安排。"
 tv_engineering_department.7197.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]拖慢了王城买卖"
 tv_engineering_department.7197.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]为解决本地工程问题扰乱了王城生意。工程还能继续，但首都[prosperity|E]要为这次疏忽受损。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7197.a:0 "我们先把王城的生意稳下来，别让乱子扩散。"
 tv_engineering_department.7198.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]看错了劳工的极限"
 tv_engineering_department.7198.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]误判了劳工身体的极限。工程还能继续，但工址劳工[population|E]要为这次疏忽受损。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7198.a:0 "先松一松，别再累垮更多人！"
 tv_engineering_department.7199.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]把账册彻底拖垮了"
 tv_engineering_department.7199.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]让本可避免的失误冲破账册，吞下了难以用体面解释的银钱。错误尚不足以终止奇观，这也许正是最难看的地方。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于20。#!"
 tv_engineering_department.7199.a:0 "咬牙认下这笔亏空，悄悄合上账册。"
 tv_engineering_department.7200.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]把王命也拖下了水"
 tv_engineering_department.7200.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]把本可避免的现场失误变成王冠上的可见伤口。错误尚不足以终止奇观，这也许正是最难看的地方。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于20。#!"
 tv_engineering_department.7200.a:0 "我们背着王冠上的这道新伤，继续前行。"
 tv_engineering_department.7201.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]把地方搅成了一团"
