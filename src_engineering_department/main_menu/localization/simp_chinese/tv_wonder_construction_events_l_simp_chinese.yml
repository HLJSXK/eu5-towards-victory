 tv_engineering_department.7000.t:0 "[tv_wonder_construction|E]：围栏外开始叫好"
 tv_engineering_department.7000.d:0 "围栏外的议论忽然变得顺耳。行会愿意署名，乡绅愿意少问几句，路人也开始把这项工程说成共同的体面。[tv_wonder_domestic_support|E]因此大幅抬升。"
 tv_engineering_department.7000.a:0 "借行会长老这份新赞誉，为工程继续撑腰。"
 tv_engineering_department.7001.t:0 "[tv_wonder_construction|E]：测线证明还能扩建"
 tv_engineering_department.7001.d:0 "新的测线证明地基还能承受更宽阔的展开。图纸上的野心终于找到可以落脚的土地，[tv_wonder_scale_competence|E]随之大幅提高。"
 tv_engineering_department.7001.a:0 "趁着这次测线，把地基彻底铺开。"
 tv_engineering_department.7002.t:0 "[tv_wonder_construction|E]：名册与工序终于对上"
 tv_engineering_department.7002.d:0 "新名册挂上工棚后，工种、时辰和责任终于彼此对齐。混乱少了藏身处，[tv_wonder_organization_competence|E]大幅提高。"
 tv_engineering_department.7002.a:0 "赶紧把新名册钉死，免得混乱卷土重来。"
 tv_engineering_department.7003.t:0 "[tv_wonder_construction|E]：补给线终于跑顺了"
 tv_engineering_department.7003.d:0 "新路线把道路、水路、堆场与脚手架接成一口气。第一支车队准时得近乎尴尬，[tv_wonder_logistics_competence|E]猛然提高。"
 tv_engineering_department.7003.a:0 "让车队照这个点头继续跑下去！"
 tv_engineering_department.7004.t:0 "[tv_wonder_construction|E]：主工段提前越过标线"
 tv_engineering_department.7004.d:0 "当前部件在天黑前越过标线。没有单一奇迹，只是吊具、榫口和手臂恰好在同一刻对上，[tv_wonder_construction|E]进度大幅推进。"
 tv_engineering_department.7004.a:0 "让吊具趁势继续越过标线。"
 tv_engineering_department.7005.t:0 "[tv_wonder_construction|E]：工地外的议论缓下来了"
 tv_engineering_department.7005.d:0 "工地外的冷话少了一些，石料车通过时也少了几道阻拦。这不是举国欢呼，却足以让[tv_wonder_domestic_support|E]向前挪动。"
 tv_engineering_department.7005.a:0 "先让车马通行，争论也顺势平息。"
 tv_engineering_department.7006.t:0 "[tv_wonder_construction|E]：图纸上的误差被纠正"
 tv_engineering_department.7006.d:0 "一处逼仄转角被改顺，主轴线也多出呼吸的余地。[tv_wonder_scale_competence|E]的改善并不炫目，却让宏图更可信。"
 tv_engineering_department.7006.a:0 "拓宽路径，让蓝图重新舒展开来。"
 tv_engineering_department.7007.t:0 "[tv_wonder_construction|E]：工棚里的交接终于理顺"
 tv_engineering_department.7007.d:0 "几处总被漏掉的交接被补上，工具、夜班和守卫也有了清楚说法。[tv_wonder_organization_competence|E]因此改善。"
 tv_engineering_department.7007.a:0 "我们补上交接的漏洞，让工具不再停摆。"
 tv_engineering_department.7008.t:0 "[tv_wonder_construction|E]：补给线的坏转角被改掉"
 tv_engineering_department.7008.d:0 "补给线上的坏转角被改掉。空等的车少了，摔裂的货少了，[tv_wonder_logistics_competence|E]也随之改善。"
 tv_engineering_department.7008.a:0 "趁早改掉这处坏转角，免得更多货物摔裂。"
 tv_engineering_department.7009.t:0 "[tv_wonder_construction|E]：关键接口终于合上"
 tv_engineering_department.7009.d:0 "拖延许久的接口终于合上，下一队工匠不用再等一个月。[tv_wonder_construction|E]进度以最令人安心的方式前进：看得见。"
 tv_engineering_department.7009.a:0 "终于对上了！"
 tv_engineering_department.7010.t:0 "[tv_wonder_construction|E]：国库拨款稳住民心"
 tv_engineering_department.7010.d:0 "工程部门想出了一个办法：拿出一部分[gold|E]，直接换成[tv_wonder_domestic_support|E]上的进展。这样做确实有用，只是花出去的东西不会自己回来。"
 tv_engineering_department.7010.a:0 "我们接受这笔交易。"
 tv_engineering_department.7010.b:0 "我们这次先观望。"
 tv_engineering_department.7011.t:0 "[tv_wonder_construction|E]：王命压下反对声"
 tv_engineering_department.7011.d:0 "为了让[tv_wonder_domestic_support|E]更进一步，这个月要动用一些[legitimacy|E]。工头们把账算得很清楚：确实划算，但[legitimacy|E]也会跟着实实在在地变少。"
 tv_engineering_department.7011.a:0 "我们会让它物有所值。"
 tv_engineering_department.7011.b:0 "我们暂时婉拒。"
 tv_engineering_department.7012.t:0 "[tv_wonder_construction|E]：地方让路，民议转缓"
 tv_engineering_department.7012.d:0 "工程部门提议先支出一部分[stability|E]，把这笔钱直接用在[tv_wonder_domestic_support|E]上面。效果马上看得见，只是这笔支出以后迟早也会被人翻出来问。"
 tv_engineering_department.7012.a:0 "我们拿下这笔买卖。"
 tv_engineering_department.7012.b:0 "我们按兵不动，留住底子。"
 tv_engineering_department.7013.t:0 "[tv_wonder_construction|E]：宫廷声望为工地背书"
 tv_engineering_department.7013.d:0 "这个月，工程部门打算用[prestige|E]换取[tv_wonder_domestic_support|E]的进展。这不是什么讨巧的办法，只是一笔算得过来的交易。"
 tv_engineering_department.7013.a:0 "就这么办！"
 tv_engineering_department.7013.b:0 "这个月不行！"
 tv_engineering_department.7014.t:0 "[tv_wonder_construction|E]：贵族默许工程继续"
 tv_engineering_department.7014.d:0 "有人提议牺牲一部分贵族[estate_satisfaction|E]，来换取[tv_wonder_domestic_support|E]上的提升。工程确实因此受益，但被牺牲的那部分不会自己补回来。"
 tv_engineering_department.7014.a:0 "促成交易！"
 tv_engineering_department.7014.b:0 "小心驶得万年船。"
 tv_engineering_department.7015.t:0 "[tv_wonder_construction|E]：教士暂时收起异议"
 tv_engineering_department.7015.d:0 "工程部门算过一笔账：花掉部分教士[estate_satisfaction|E]，就能在[tv_wonder_domestic_support|E]上取得实实在在的进展。这笔交易划算，却也不是白拿的。"
 tv_engineering_department.7015.a:0 "舍不得孩子套不住狼。"
 tv_engineering_department.7015.b:0 "让这个月悄然过去。"
 tv_engineering_department.7016.t:0 "[tv_wonder_construction|E]：商人把便利让给工地"
 tv_engineering_department.7016.d:0 "为了推动[tv_wonder_domestic_support|E]，工程部门这次准备从市民[estate_satisfaction|E]里拿出一部分来补上。省下的力气看得见，付出的代价也一样看得见。"
 tv_engineering_department.7016.a:0 "把这笔支出用在刀刃上。"
 tv_engineering_department.7016.b:0 "把这个提议搁在一边。"
 tv_engineering_department.7017.t:0 "[tv_wonder_construction|E]：村社再挤出一口余力"
 tv_engineering_department.7017.d:0 "这是一笔简单的交换：用平民[estate_satisfaction|E]换[tv_wonder_domestic_support|E]。工程部门没有掩饰这一点，只是提醒众人，这份代价迟早会被人注意到。"
 tv_engineering_department.7017.a:0 "把牺牲换成实打实的进展。"
 tv_engineering_department.7017.b:0 "暂且按兵不动。"
 tv_engineering_department.7018.t:0 "[tv_wonder_construction|E]：拆开街区安抚了议论"
 tv_engineering_department.7018.d:0 "工程部门决定用工址[development|E]换取[tv_wonder_domestic_support|E]上的进展。这个决定谈不上体面，却很实际。"
 tv_engineering_department.7018.a:0 "毫不犹豫地应下这笔交易。"
 tv_engineering_department.7018.b:0 "回绝了这笔交易。"
 tv_engineering_department.7019.t:0 "[tv_wonder_construction|E]：工地吸走了本地买卖"
 tv_engineering_department.7019.d:0 "要让[tv_wonder_domestic_support|E]向前推进，这个月需要动用一些工址[prosperity|E]。工程部门知道这笔账不太好看，但还是决定这么做。"
 tv_engineering_department.7019.a:0 "接受这笔交易。"
 tv_engineering_department.7019.b:0 "我们这次先观望。"
