 tv_engineering_department.7000.t:0 "[tv_wonder_construction|E]：围栏外开始叫好"
 tv_engineering_department.7000.d:0 "围栏外的议论好转了不少。行会愿意具名支持，乡绅也不再多问，路人开始把这项工程说成一件体面事。[tv_wonder_domestic_support|E]因此大幅提高。"
 tv_engineering_department.7000.a:0 "就顺着行会这份支持，把工程继续办下去。"
 tv_engineering_department.7001.t:0 "[tv_wonder_construction|E]：测线证明还能扩建"
 tv_engineering_department.7001.d:0 "新的测量结果显示，地基能承受更大的建筑规模。图纸上原本偏大的方案，现在有了着落，[tv_wonder_scale_competence|E]因此大幅提高。"
 tv_engineering_department.7001.a:0 "照这次测量的结果，把地基铺得更宽一些。"
 tv_engineering_department.7002.t:0 "[tv_wonder_construction|E]：名册与工序终于对上"
 tv_engineering_department.7002.d:0 "新的名册贴到了工棚里，各工种该在哪里、什么时候上工都写清楚了。混乱的地方少了，[tv_wonder_organization_competence|E]因此大幅提高。"
 tv_engineering_department.7002.a:0 "把新名册定下来，免得又乱回去。"
 tv_engineering_department.7003.t:0 "[tv_wonder_construction|E]：补给线终于跑顺了"
 tv_engineering_department.7003.d:0 "一条更顺的路线把道路、水路、堆场和脚手架连了起来。第一支车队准时到达，[tv_wonder_logistics_competence|E]因此大幅提高。"
 tv_engineering_department.7003.a:0 "车队就照这个点，继续跑下去！"
 tv_engineering_department.7004.t:0 "[tv_wonder_construction|E]：主工段提前越过标线"
 tv_engineering_department.7004.d:0 "当前部件在天黑前就越过了预定标线。起吊、拼接和人手都配合得很好，[tv_wonder_construction|E]进度因此大幅推进。"
 tv_engineering_department.7004.a:0 "让施工照这个势头，继续往前赶。"
 tv_engineering_department.7005.t:0 "[tv_wonder_construction|E]：工地外的议论缓下来了"
 tv_engineering_department.7005.d:0 "工地外的闲话少了一些，石料车经过时也不再有人拦路。算不上什么大事，但[tv_wonder_domestic_support|E]确实往前挪动了一些。"
 tv_engineering_department.7005.a:0 "先把路让开，争论也就慢慢平息了。"
 tv_engineering_department.7006.t:0 "[tv_wonder_construction|E]：图纸上的误差被纠正"
 tv_engineering_department.7006.d:0 "一处狭窄的转角被重新改过，主轴线也宽了一些。改动不大，但[tv_wonder_scale_competence|E]确实提高了一点。"
 tv_engineering_department.7006.a:0 "把这条路拓宽，图纸也就宽松一些。"
 tv_engineering_department.7007.t:0 "[tv_wonder_construction|E]：工棚里的交接终于理顺"
 tv_engineering_department.7007.d:0 "几处一直被漏掉的交接工作补上了，工具、夜班和守卫的安排也都说清楚了。[tv_wonder_organization_competence|E]因此有所改善。"
 tv_engineering_department.7007.a:0 "把交接的漏洞补上，工具就不会再停摆。"
 tv_engineering_department.7008.t:0 "[tv_wonder_construction|E]：补给线的坏转角被改掉"
 tv_engineering_department.7008.d:0 "补给线上一处不好走的转弯改直了。空跑的车少了，摔坏的货也少了，[tv_wonder_logistics_competence|E]因此有所改善。"
 tv_engineering_department.7008.a:0 "早点把这处转角改掉，免得更多货摔坏。"
 tv_engineering_department.7009.t:0 "[tv_wonder_construction|E]：关键接口终于合上"
 tv_engineering_department.7009.d:0 "一处拖了很久的接口终于装上了，下一批工匠不用再多等一个月。[tv_wonder_construction|E]进度因此稳步推进。"
 tv_engineering_department.7009.a:0 "终于装上了！"
 tv_engineering_department.7010.t:0 "[tv_wonder_construction|E]：国库拨款稳住民心"
 tv_engineering_department.7010.d:0 "工程部门这个月做了一次临时调度：以[gold|E]为代价，换来[tv_wonder_domestic_support|E]上看得见的进展。这笔账现在划得来，只是这种调度不能一直用。"
 tv_engineering_department.7010.a:0 "这笔交易，我们接下了。"
 tv_engineering_department.7010.b:0 "这次，我们先观望。"
 tv_engineering_department.7011.t:0 "[tv_wonder_construction|E]：王命压下反对声"
 tv_engineering_department.7011.d:0 "工头们商量了一下，决定这个月先耗一些[legitimacy|E]，换[tv_wonder_domestic_support|E]往前挪一挪。这样做马上就能见效，只是[legitimacy|E]这个月确实要吃点亏。"
 tv_engineering_department.7011.a:0 "我们会让它物有所值。"
 tv_engineering_department.7011.b:0 "我们暂时不接这个茬。"
 tv_engineering_department.7012.t:0 "[tv_wonder_construction|E]：地方让路，民议转缓"
 tv_engineering_department.7012.d:0 "工程部门这次是先斩后奏：先动用了[stability|E]，才换来[tv_wonder_domestic_support|E]上看得见的进展。至于这笔账以后要不要找补，暂时没人细算。"
 tv_engineering_department.7012.a:0 "这笔买卖，我们拿下了。"
 tv_engineering_department.7012.b:0 "我们按兵不动，留住这份底子。"
 tv_engineering_department.7013.t:0 "[tv_wonder_construction|E]：宫廷声望为工地背书"
 tv_engineering_department.7013.d:0 "这个月的账不太好看：要让[tv_wonder_domestic_support|E]往前挪一挪，就得先在[prestige|E]上吃点亏。工头们说这笔账划算，但[prestige|E]这个月确实吃了亏，谁看了都清楚。"
 tv_engineering_department.7013.a:0 "就这么办！"
 tv_engineering_department.7013.b:0 "这个月不行！"
 tv_engineering_department.7014.t:0 "[tv_wonder_construction|E]：贵族默许工程继续"
 tv_engineering_department.7014.d:0 "工头们把话说得很直接：这个月先在贵族[estate_satisfaction|E]上让一步，马上就能换成[tv_wonder_domestic_support|E]上的进展。没人说这是笔多体面的买卖，只说这么做管用。"
 tv_engineering_department.7014.a:0 "促成这笔交易！"
 tv_engineering_department.7014.b:0 "小心驶得万年船。"
 tv_engineering_department.7015.t:0 "[tv_wonder_construction|E]：教士暂时收起异议"
 tv_engineering_department.7015.d:0 "这笔账说白了很简单：这个月要紧一紧教士[estate_satisfaction|E]这头，才能让[tv_wonder_domestic_support|E]松动一步。工程部门没打算隐瞒这一点，只是提醒大家，这个月紧出来的这部分不会自己松回来。"
 tv_engineering_department.7015.a:0 "舍不得孩子套不住狼。"
 tv_engineering_department.7015.b:0 "由着这个月悄悄过去。"
 tv_engineering_department.7016.t:0 "[tv_wonder_construction|E]：商人把便利让给工地"
 tv_engineering_department.7016.d:0 "工程部门这次是拿市民[estate_satisfaction|E]赌了一把，赌的是能换回[tv_wonder_domestic_support|E]上的进展。这一手算是赌对了，工地这次是真的往前走了。"
 tv_engineering_department.7016.a:0 "把这笔支出花在了刀刃上。"
 tv_engineering_department.7016.b:0 "把这个提议撂在了一边。"
 tv_engineering_department.7017.t:0 "[tv_wonder_construction|E]：村社再挤出一口余力"
 tv_engineering_department.7017.d:0 "说白了没什么好粉饰的：这个月要先动平民[estate_satisfaction|E]，[tv_wonder_domestic_support|E]才能往前挪。工程师们没多说什么，直接照办了，心里清楚这部分损失不会自己补回来。"
 tv_engineering_department.7017.a:0 "把这份牺牲换成了实打实的进展。"
 tv_engineering_department.7017.b:0 "先按兵不动。"
 tv_engineering_department.7018.t:0 "[tv_wonder_construction|E]：拆开街区安抚了议论"
 tv_engineering_department.7018.d:0 "要把工程往前推一步，总得先花掉点别的东西。这次花的是工址[development|E]，换来的是[tv_wonder_domestic_support|E]上看得见的进展，代价不小，但确实管用。"
