 tv_engineering_department.7117.a:0 "不管代价多少，我们守住这里。"
 tv_engineering_department.7117.b:0 "我们护住这里，代价挪去别处。"
 tv_engineering_department.7118.t:0 "[tv_wonder_construction|E]：要稳住排班，就得逼劳工再撑一轮"
 tv_engineering_department.7118.d:0 "工程遇到了麻烦，总得有个地方吃亏。要么让[tv_wonder_organization_competence|E]先受影响，要么把这份负担转给工址劳工[population|E]。"
 tv_engineering_department.7118.a:0 "这次，我们自己扛。"
 tv_engineering_department.7118.b:0 "我们把这一击引向别处。"
 tv_engineering_department.7119.t:0 "[tv_wonder_construction|E]：要救车队，就得再花一笔钱"
 tv_engineering_department.7119.d:0 "现在有两个选择，只能挑一个：让[tv_wonder_logistics_competence|E]承受这次损失，或者把损失转移出去，让[gold|E]来承受。"
 tv_engineering_department.7119.a:0 "扛下来！"
 tv_engineering_department.7119.b:0 "转个方向！"
 tv_engineering_department.7120.t:0 "[tv_wonder_construction|E]：要救车队，就得再借一次王命"
 tv_engineering_department.7120.d:0 "这次的麻烦总要落在什么地方。挡在这里，损失的就是[tv_wonder_logistics_competence|E]；放到别处去，受影响的就变成[legitimacy|E]。"
 tv_engineering_department.7120.a:0 "宁受明伤，不留暗患。"
 tv_engineering_department.7120.b:0 "留住屋顶，任雨水改道别檐。"
 tv_engineering_department.7121.t:0 "[tv_wonder_construction|E]：要救车队，就得惊动更多地方"
 tv_engineering_department.7121.d:0 "这个月的代价必须有人承担。可以让[tv_wonder_logistics_competence|E]直接背这笔账，也可以把账转出去，让[stability|E]来还。"
 tv_engineering_department.7121.a:0 "由它先扛下这一下。"
 tv_engineering_department.7121.b:0 "把负担推到别处。"
 tv_engineering_department.7122.t:0 "[tv_wonder_construction|E]：要救车队，就得继续透支体面"
 tv_engineering_department.7122.d:0 "损失已经无法避免，唯一能决定的是它落在哪里。可以让它冲击[tv_wonder_logistics_competence|E]，也可以把它引开，让[prestige|E]承受。"
 tv_engineering_department.7122.a:0 "把压力扛在这里，稳住阵脚。"
 tv_engineering_department.7122.b:0 "把重量转移出去。"
 tv_engineering_department.7123.t:0 "[tv_wonder_construction|E]：要救车队，就得再借贵族车马"
 tv_engineering_department.7123.d:0 "工程出了问题，代价必须有人承担。让[tv_wonder_logistics_competence|E]直接受损是一种办法，把压力转给贵族[estate_satisfaction|E]也是一种办法。"
 tv_engineering_department.7123.a:0 "接下这份重量，眼都不眨。"
 tv_engineering_department.7123.b:0 "护住这一头，让压力落到旁处。"
 tv_engineering_department.7124.t:0 "[tv_wonder_construction|E]：要救车队，就得让祭坛再忍一次"
 tv_engineering_department.7124.d:0 "这笔账无论怎么算都要吃亏。可以让[tv_wonder_logistics_competence|E]来承担这个差额，也可以把差额转出去，交给教士[estate_satisfaction|E]。"
 tv_engineering_department.7124.a:0 "把损失留在自己身上扛。"
 tv_engineering_department.7124.b:0 "把这份损失挡开、转向别处。"
 tv_engineering_department.7125.t:0 "[tv_wonder_construction|E]：要救车队，就得先堵住商路"
 tv_engineering_department.7125.d:0 "这个月的损失躲不掉，只能决定由谁来承担：要么让[tv_wonder_logistics_competence|E]受损，要么把代价转到市民[estate_satisfaction|E]身上。不管怎么选，总要有一方付出代价。"
 tv_engineering_department.7125.a:0 "自己吞下这一击，不转嫁出去。"
 tv_engineering_department.7125.b:0 "这次，就让别处承担吧。"
 tv_engineering_department.7126.t:0 "[tv_wonder_construction|E]：要救车队，就得再抽村社的车驾"
 tv_engineering_department.7126.d:0 "工地上出了一次意外，损失必须有人承担。可以让[tv_wonder_logistics_competence|E]直接受损，也可以把这份压力转移出去，改由平民[estate_satisfaction|E]来承受。"
 tv_engineering_department.7126.a:0 "干脆把代价扛下来。"
 tv_engineering_department.7126.b:0 "我们护住这里，代价挪去别处。"
 tv_engineering_department.7127.t:0 "[tv_wonder_construction|E]：要救车队，就得继续拆开工址"
 tv_engineering_department.7127.d:0 "工程遇到了麻烦，总得有个地方吃亏。要么让[tv_wonder_logistics_competence|E]先受影响，要么把这份负担转给工址[development|E]。"
 tv_engineering_department.7127.a:0 "我们就在这里扛下这一下。"
 tv_engineering_department.7127.b:0 "我们把这一击引向别处。"
