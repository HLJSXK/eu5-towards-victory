 tv_engineering_department.7207.t:0 "建设：[tv_great_engineer|E]先把工址折腾坏了"
 tv_engineering_department.7207.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]为了解决技术问题，损毁了当地的一些设施。这个错误还不至于让奇观停工，这大概才是最让人难堪的地方。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于20。#!"
