 tv_engineering_department.551.t: "[tv_wonder_ceremony|E]：学者齐聚"
 tv_engineering_department.551.d: "大学城安静了下来，一头扎进了做学问的日子里。老师、学生、抄写员和官员们围着排定的课程表和吵得不可开交的文本聚在一起，把这片刚建好的街区变成了一场持续一整年的学术盛会。[tv_wonder_ceremony|E]急不得，它要的是国家愿意放慢行政的脚步，换一份能传到下一朝的课业安排。"
 tv_engineering_department.551.a: "让学者们好好用上这一年吧。"
 tv_engineering_department.552.t: "[tv_wonder_ceremony|E]：学院大厅开工"
 tv_engineering_department.552.d: "学院大厅的图纸已经在大学城旁边定了下来，等着动工。这座新厅堂能给老师们一个正经辩论的地方，给学生们一个能变得没那么自信、却也因此有好处的地方，也能给王室一座建筑——让学问得到承认，又不至于被完全管住。[tv_wonder_ceremony|E]现在就等着门、长凳、章程和屋顶都齐了，学问才能说自己真正有了一个固定的家。"
 tv_engineering_department.552.a: "盖一座能吵架的地方吧。"
 tv_engineering_department.561.t: "[tv_wonder_ceremony|E]：穹顶覆幕"
 tv_engineering_department.561.d: "这座大穹顶被蒙上了帷幕，准备接受祝圣。祭司们标出门槛的位置，唱诗班反复练着那套讲究分寸的礼拜仪式，宫廷也接受了这一年里，国家大事得让一让，好让这份神圣能慢慢降临。[tv_wonder_ceremony|E]要的是让整个国家在这片被遮住的天空下耐心等着，直到这座圣殿真正准备好向天空敞开为止。"
 tv_engineering_department.561.a: "让穹顶接受祝圣吧。"
 tv_engineering_department.571.t: "[tv_wonder_ceremony|E]：朝圣阶梯开启"
 tv_engineering_department.571.d: "这座塔庙的台阶交给了朝圣者，迎来了一整年的攀登、驻足、诵唱，还有磨破的脚。作坊里怨声不断，因为不少劳力都被抽去支持这些游行队伍了，但[tv_wonder_ceremony|e]本来就是想用这份辛苦，教大家什么叫高度。每往上走一级台阶，这座塔就从一件东西变成了一条路，每一条路，都让虔诚这件事变得看得见。"
 tv_engineering_department.571.a: "让他们爬上去吧。"
 tv_engineering_department.572.t: "[tv_wonder_ceremony|E]：神庙学校开工"
 tv_engineering_department.572.d: "老师、书记员和工匠们在这座高塔脚下，为神庙学校打下了地基。[tv_wonder_ceremony|e]现在就等着这间教室建好——在那里，教义能慢慢变成习惯，识字和辩论的本事也能被这套仪式规范起来。高塔能让人抬头看，学校才能教会那些抬头看的人，该说些什么。"
 tv_engineering_department.572.a: "把学校建起来吧。"
 tv_engineering_department.581.t: "[tv_wonder_ceremony|E]：河市节开始"
 tv_engineering_department.581.d: "摊子、驳船、收税的关卡和过节用的彩旗，沿着拓宽的河道聚在了一起。贸易因此慢了下来，因为这条河得先当上一年的风景，然后才能重新做回它原本运货的那条动脉。[tv_wonder_ceremony|e]要用整整一年，让商人、船夫和官员们一起演练这套新的水上规矩。"
 tv_engineering_department.581.a: "让这条河熟悉一下这份热闹吧。"
 tv_engineering_department.582.t: "[tv_wonder_ceremony|E]：运河办公室开工"
 tv_engineering_department.582.d: "测绘员为运河管理处划出了一处固定的办公地点。这栋建筑远没有河工本身气派，可这恰恰是它重要的地方：水闸的纠纷、过路费、维修，还有枯水期的种种抱怨，都需要一个没法互相推诿的地方来解决。[tv_wonder_ceremony|e]现在就等着这套管理机构有自己的一间办公室了。"
 tv_engineering_department.582.a: "给这条河配张桌子吧。"
 tv_engineering_department.591.t: "[tv_wonder_ceremony|E]：海军署办公室开工"
 tv_engineering_department.591.d: "船坞为海军署的办公室留出了一块地方。滑道和吊车固然能造出船来，但一支舰队还需要命令、海图、检查，以及有耐心把木料变成政令的官员。[tv_wonder_ceremony|e]现在就等着这座船坞多一个懂海军的头脑了。"
 tv_engineering_department.591.a: "把这间办公室建起来吧。"
 tv_engineering_department.601.t: "[tv_wonder_ceremony|E]：棱堡接受试验"
 tv_engineering_department.601.d: "这座星型要塞城迎来了整整一年的试验。工程师们测试各个角度，炮手们测试射界，工人们也发现，一堵按数学设计出来的城墙，最后还是得靠汗水去把它建成。生产因此慢了下来，[tv_wonder_ceremony|e]正在教这座要塞，怎么用石头去回应那些理论。"
 tv_engineering_department.601.a: "把每个角度都试一遍。"
 tv_engineering_department.602.t: "[tv_wonder_ceremony|E]：军械城区开工"
 tv_engineering_department.602.d: "要塞城里划出了军械城区的地基。这里以后会把修理工坊、火药库和集合场都收拢到一个纪律严明的城区里。[tv_wonder_ceremony|e]现在就等着要塞的这一部分建好——只有这样，警报响过之后，防御才能一次又一次地重新来过。"
 tv_engineering_department.602.a: "把军械城区建起来吧。"
 tv_engineering_department.611.t: "[tv_wonder_ceremony|E]：烽火点燃"
 tv_engineering_department.611.d: "长城沿线的哨所迎来了一整年的烽火演练。烟柱、火光、驿骑，还有周边的集市，都得围着这套新节奏转，贸易也因此受了些影响，因为每条商路都得先学会留意警讯。[tv_wonder_ceremony|e]让这份警惕变得人尽皆知，连寻常赶路的人，都会觉得自己被盯着。"
 tv_engineering_department.611.a: "让烽火一直亮着吧。"
 tv_engineering_department.621.t: "[tv_wonder_ceremony|E]：大师甲匠厅开工"
 tv_engineering_department.621.d: "军械库为大师甲匠厅打下了地基。再大的军械库，也不能光靠铁料和账本撑着，还得有一双双熟练的手，能在真正打起来之前先看出毛病在哪儿。[tv_wonder_ceremony|e]现在就等着这门手艺有个正式的地方安身了。"
 tv_engineering_department.621.a: "为这些匠人盖座房子吧。"
 tv_engineering_department.631.t: "[tv_wonder_ceremony|E]：国家目录开始"
 tv_engineering_department.631.d: "国家图书馆开始编目录了。学者们闭门谢客，一卷一卷地整理清单，国家立法的进度也因此慢了下来，为的就是重新教会这些记忆该怎么找到自己。[tv_wonder_ceremony|e]不是一场热闹的游行，而是一份索引：安安静静，一丝不苟，一旦编完，就有分量。"
 tv_engineering_department.631.a: "让这份目录继续增长吧。"
 tv_engineering_department.632.t: "[tv_wonder_ceremony|E]：法定缴存办公室开工"
 tv_engineering_department.632.d: "工匠们在图书馆旁边，为法定缴存办公室打下了地基。往后，书籍、法令、抄本和辩论文章，就不再是靠人情才能拿到手的东西，而是一份必须履行的义务，被一份一份收进这里。[tv_wonder_ceremony|e]现在就等着这间屋子建好——从此以后，这个国家写下来的记忆，就不用再靠运气了。"
 tv_engineering_department.632.a: "把这间存放记忆的屋子建起来吧。"
