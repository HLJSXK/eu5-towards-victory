 TV_WONDER_FINAL_LEVEL_REWARD_TT: "由于我们建成了一个等级为[ROOT.GetVariable('tv_wonder_level').GetValue|0]的伟大工程，我们获得："
 TV_WONDER_FINAL_SUPPORT_REWARD_TT: "由于我们剩余[ROOT.GetVariable('tv_wonder_final_support_reward_source').GetValue|0]国内支持度，我们获得："
 tv_engineering_department.10.t: "[tv_great_engineer|E]：大工程师逝世"
 tv_engineering_department.10.d: "我们的[tv_great_engineer|E]去世了。工程部里，图纸合上了，测绘桌也停了下来，助手们一时不知道该怎么办，甚至不忍心擦掉他留下的最后几笔标记。奇观机制本身还在正常运转，账目、图纸、材料都还在，但[tv_wonder_construction|e]需要有人拿主意、定方向。在找到继任者之前，这项工程有石料，有人力，也有雄心，却少了一个能把这些东西真正凝聚起来的人。\n\n#weak 大工程师职位现已空缺——请尽快前往工程部任命新的大工程师，以便继续推进奇观建设。#!"
 tv_engineering_department.10.a: "找一个能接手的人吧。"
 tv_engineering_department.20.t: "[tv_wonder_construction|E]：工程崩溃"
 tv_engineering_department.20.d: "[tv_wonder_domestic_support|e]的储备已经耗尽了。原本支持这项工程的廷臣们突然都想起了别的要紧事，各阶层的代表又搬出了原来的反对意见，供应商也不再愿意赊账。工程已经撑不下去，[tv_engineering_department|e]只能放弃这座已经锁定的奇观，承受这份难堪。地基还在，早期的标记还在，可能还剩下一些石料，但支撑这一切的政治基础已经垮了。光靠沉默、恐惧和空头承诺，是造不出任何纪念碑的。\n\n#weak 工程已被强制放弃——你可以随时在工程部重新评估地点和方案，再度开始。#!"
 tv_engineering_department.20.a: "认了这个教训吧。"
 tv_engineering_department.30.t: "[tv_wonder_construction|E]：设计雏形已成"
 tv_engineering_department.30.d: "[tv_great_engineer|E]已经画出了最初的几页草图：粗略的立面、标好价钱的疑虑、地形里藏着的优势，还有几个被划掉、看得出有点舍不得的绝妙点子。这个构想已经不再只是工坊里的一时兴起，而是能拿到宫廷上让大家比较、争论，最后做出选择的正式方案了。\n\n#weak 设计构想已经就绪——请前往工程部审阅[tv_great_engineer|E]的提案，可以接受，也可以要求重新构思，然后继续推进关于这座奇观的辩论，争取足够的国内支持。#!"
 tv_engineering_department.30.a: "把设计拿出来看看。"
 tv_engineering_department.100.t: "[tv_wonder_debate|E]：贵族家族集结支持"
 tv_engineering_department.100.d: "几个贵族家族觉得，这座奇观既能为王国增光，也顺便能给自己长脸。他们的传令官说起祖传的席位、不朽的名声，还有后人可能分不清私人荣耀和公共事业的美好前景——工程部懒得纠正他们。反正支持就是支持，[tv_wonder_domestic_support|e]常常就是穿金戴银地来的。他们的声音现在在宫廷里传得挺响。"
 tv_engineering_department.100.a: "让他们出出风头吧。"
 tv_engineering_department.101.t: "[tv_wonder_debate|E]：贵族反弹"
 tv_engineering_department.101.d: "有传言说，这座奇观会侵占贵族的特权，却给不了他们足够的荣誉作为补偿。一些贵族家族开始盘算的不是纪念碑将来有多壮观，而是自己可能因此失去多少席位、多少豁免、多少劳役上的方便，以及仪式上的排位。工程部能测量石料，却很难测量一个人受了伤的自尊心。贵族当中的支持正在动摇，每一次犹豫都让整件事显得更沉重。骄傲这东西，也许比大理石还轻，抬起来却比大理石还费劲。"
 tv_engineering_department.101.a: "他们的骄傲，代价不便宜。"
 tv_engineering_department.102.t: "[tv_wonder_debate|E]：市民看见机会"
 tv_engineering_department.102.d: "行会首领和金融家们开始谈起合同、道路、仓库，还有将来的人流。他们在这座奇观里看到的不只是壮观，还有账单、运输权、可以出租的房间，以及子孙后代还能接着收租金的好事。工程部听得很认真，因为商人总有本事把野心讲得头头是道。他们的热情给辩论添了一把火，繁荣带着沾了墨水的手指和一手好算术就这么来了。"
 tv_engineering_department.102.a: "繁荣的话，听着确实有道理。"
 tv_engineering_department.103.t: "[tv_wonder_debate|E]：商人计算成本"
 tv_engineering_department.103.d: "一些市民开始担心，这座奇观会占用太多劳力、信贷和运力。他们没有直接反对荣耀本身，只是问了一句：到底要压上多少车队、多少工钱、多少仓库才够。这种谨慎比恐慌更难对付，因为每句话后面都跟着一串看起来挺有道理的数字。工程部能感觉到公众的信心正在一点点冷下去——账本上的数字念出来，有时候比演讲还伤人。"
 tv_engineering_department.103.a: "账本上的数字，有时候比话还伤人。"
 tv_engineering_department.104.t: "[tv_wonder_debate|E]：教士祝福"
 tv_engineering_department.104.d: "一些有名望的教士把这座奇观说成秩序和虔诚的象征。布道里把整齐的石料比作顺服的灵魂，把稳固的地基比作坚定的信仰，把公共劳动比作教民该有的自律。工程部虽然更愿意谈垂线和角度，而不是比喻，但也乐得借这份说辞的光。辩论因此多了一层庄重又让人安心的味道——当上天看起来也在认可这些脚手架的时候，[tv_wonder_domestic_support|e]总是涨得更容易一些。"
 tv_engineering_department.104.a: "这份祝福，用得上。"
 tv_engineering_department.105.t: "[tv_wonder_debate|E]：反对奢靡的布道"
 tv_engineering_department.105.d: "布道者们指责这项工程不过是披着石头外衣的虚荣。他们问：饥饿的村庄需要大理石吗？统治者的灵魂能靠盖得高来拯救吗？骄傲光是被石匠量过尺寸，就能算得上神圣吗？这些质问在本来就心存疑虑的人群里很有市场。工程部能回答很多反对意见，可布道天生就是用来撑过反驳的。信仰能为地基祝福，也一样能拒绝为它祝福。"
 tv_engineering_department.105.a: "信仰，也能拒绝大理石。"
 tv_engineering_department.200.t: "[tv_wonder_construction|E]：一个建设单元完工"
 tv_engineering_department.200.d: "工程又有一部分完工了，跨过了一个看得见的门槛。脚手架拆了下来，监工在完工的部分做上标记，工人们退后几步，带着几分谨慎的自豪——他们知道接下来的活儿一样不轻松。公众终于能亲眼看到，那件原本不可能的事正在变成石头、横梁、渠道或者拱顶。就连批评的人，现在也更难嘲笑一样已经能投下影子的东西了。[tv_wonder_construction|E]得到的不只是进度，还有实实在在的证据。\n\n#weak 该建设单元已经完工，工程部会继续推进奇观的下一个建设单元。#!"
 tv_engineering_department.200.a: "继续干下去。"
 tv_engineering_department.201.t: "[tv_wonder_construction|E]：工程拔地而起"
 tv_engineering_department.201.d: "在[SCOPE.sLocation('tv_wonder_event_location').GetName]，四个已完工的模块已经完成了它们的使命。可以拆掉那些临时构件了，接下来该正式开始建造奇观本体的核心结构。基础、主体、功能和封顶，不再是各干各的几个部分，而是要合并成同一座建筑。\n\n#weak 四个模块已经并入奇观本体——请留意工程部面板，一旦奇观达到完工等级，最终建筑就会自动开始建造。#!"
 tv_engineering_department.201.a: "拆了模块，开始建主体。"
 tv_engineering_department.202.t: "[tv_wonder_construction|E]：工程矗立"
 tv_engineering_department.202.d: "[tv_engineering_department|E]宣布建设阶段已经完成。工地上的东西收拾干净，工人们陆续撤走，最后一批[tv_wonder_materials|e]的账目也合上了，会计们大概是这世上唯一真心为此高兴的人。纪念碑现在立起来了，但光有石头还不算完事。剩下的问题已经不是怎么把它建起来，而是怎么给它办一场像样的落成典礼。国家已经造出了它的身体，[tv_wonder_ceremony|e]还得给它一个能被众人看见的意义。\n\n#weak 建设阶段已经完成——请前往工程部选择落成仪式的风格，开始为奇观举行仪式。#!"
 tv_engineering_department.202.a: "准备仪式吧。"
 tv_engineering_department.202.a.tt: "拆除工地上的$tv_wonder_labor_camp$。"
 tv_engineering_department.203.t: "[tv_wonder_construction|E]：辩论已经落定"
 tv_engineering_department.203.d: "宫廷宣布，关于这座奇观的辩论结束了。反对的声音没有完全消失，但已经被听过、回应过、安抚过，或者干脆被写进了正式方案里。工程接下来要离开唇枪舌剑，进入土地、道路、坡度和距离这些实实在在的事情。[tv_great_engineer|e]在等一个可以开始测绘的地点。从现在起，[tv_wonder_domestic_support|e]会一点点流失，所以接下来该做点实际的事：选一个真正能把纪念碑立起来的地方。\n\n#weak 辩论已经结束——请前往工程部为奇观选择建设地点，正式开始测绘与建设。#!"
 tv_engineering_department.203.a: "开始测绘吧。"
 tv_engineering_department.300.t: "[tv_wonder_survey|E]：测绘完成"
 tv_engineering_department.300.d_high: "[tv_wonder_survey|E]带回来的结果很不错。这块地能撑得住这份野心，补给也能顺利运到，工人们还没等第一座营地搭起来，就已经看出了穿过这片地形的路。[tv_great_engineer|e]把表格又看了一遍，倒不是数字有问题，只是好消息值得再确认一下。规模、物流和组织这三项都指向同一个方向。这块地几乎像是巴不得赶紧变得有用一样。"
 tv_engineering_department.300.d_mid: "[tv_wonder_survey|E]带回来的结果还算可以用。这块地不会让工程一帆风顺，不过老实说，也没有哪座奇观真能一帆风顺。地有地的局限，路有路的脾气，用工计划得靠纪律撑着，谈不上什么浪漫。不过工程部至少已经知道了短板在哪儿，可以照着这些弱点来安排。一个已经被量过的麻烦，其实已经算是解决了一半。"
 tv_engineering_department.300.d_low: "[tv_wonder_survey|E]带回来的结果让人有点担心。这块地依然可以宣布为选址，但地图看着让人不太踏实，测绘员们说话也格外小心。地形、路线，或者用工组织，可能都会比原先想的更麻烦。工程部提醒说，换个地方可能更合适这座奇观。如果坚持在这里干，那就是睁着眼睛做的决定——总比稀里糊涂强，只是代价也更高。"
 tv_engineering_department.300.a: "看看结果吧。"
 tv_engineering_department.310.t: "[tv_wonder_survey|E]：隐秘地基"
 tv_engineering_department.310.d: "测绘员在预定的工地下面发现了结实的地层和古老的石基。原本以为只是普通的坚实地面，现在看着几乎像是有人早就替他们整理好了一样。[tv_wonder_survey|E]的队伍为承重、深度这些问题争论得挺开心——毕竟能碰上一个自己解决自己的难题，实在是难得的好事。这座奇观能达到的规模，看起来比最初想的宽裕不少。就连[tv_great_engineer|e]在要求再测一遍之前，都忍不住笑了一下。"
 tv_engineering_department.310.a: "很好。"
 tv_engineering_department.311.t: "[tv_wonder_survey|E]：险恶地面"
 tv_engineering_department.311.d: "原本地图上说很牢靠的地方，现在开始松动了。木桩歪了，粉线对不上了，测绘队说话也变得越来越简短。要加固支撑，这座奇观能建的规模就得缩水一些——不是因为大家的野心变小了，而是这片土地提了自己的条件。工程部还能继续推进，只是不能再假装地面是完全听话的了。"
 tv_engineering_department.311.a: "调整一下方案吧。"
 tv_engineering_department.312.t: "[tv_wonder_survey|E]：畅通补给线"
 tv_engineering_department.312.d: "[tv_wonder_survey|E]发现了几条能更顺畅地运送石料、木材和工具的路线。一条本来没人在意的路正好接上一处能用的河湾，一片集结场地比记忆中宽敞不少，当地的脚夫甚至早就知道几条官方地图从没标出来的近道。这下[tv_wonder_materials|E]能运得更顺一些，因为这片土地悄悄帮了不少忙。物流这一次难得没有找麻烦，反倒像是一张留了不少余地的地图。"
 tv_engineering_department.312.a: "把这些都好好标记下来。"
 tv_engineering_department.313.t: "[tv_wonder_survey|E]：破碎通路"
 tv_engineering_department.313.d: "道路、水路和集结场的情况都比一开始报告的还要糟。车轮陷进本该结实的路面，船只在本该畅通的水面上耽误了工夫，集结场一到真正的车队进场就显得挤挤挨挨。物流会更难对付，[tv_wonder_materials|e]也不会因为大家乐观就自己变得好运一些。工程部这回撞上了大工程的老规矩：一座纪念碑，往往在石料抵达前很久就已经开始了——有时候，它是从一摊泥开始的。"
 tv_engineering_department.313.a: "我们会想办法补救的。"
 tv_engineering_department.314.t: "[tv_wonder_survey|E]：野外秩序"
 tv_engineering_department.314.d: "测量队慢慢摸出了一套顺手的节奏。旗子插好了，笔记抄清楚了，监工们也不再互相拌嘴，原本零散的观察也变成了一套将来劳工真能照着做的规矩。这不算什么惊天动地的发现，但也许比发现更管用。[tv_wonder_construction|E]靠的就是一大群人按同样的顺序做同样的事这种朴实无华的奇迹。今天看来，这个奇迹是有可能成的。"
 tv_engineering_department.314.a: "这是个好习惯。"
 tv_engineering_department.315.t: "[tv_wonder_survey|E]：测绘混乱"
 tv_engineering_department.315.d: "互相矛盾的地图和爱抬杠的监工拖慢了工作。一队人坚持要走山脊，一队人坚持要走大路，还有一队拿出了一张精确得让所有人都开始起疑的表格。工程部对未来的组织方案信心也跟着动摇了，毕竟混乱一旦写在纸上，看着就跟正式结论似的。比起地不好，奇观其实更怕指挥不好。真正动工之前，得先让这些地图学会互相服气。"
 tv_engineering_department.315.a: "把这事理清楚。"
 tv_engineering_department.320.t: "[tv_wonder_survey|E]：特殊仪器申请"
 tv_engineering_department.320.d: "测绘员要求配上昂贵的仪器和专门的匠人。他们说到肉眼分辨不出的角度、靠猜猜不准的土质，以及能让[tv_great_engineer|e]对规模的判断少受贵族们盲目乐观影响的测量方法。宫廷听到的是开销，工程师们听到的是精确。资助他们应该能让测绘更准，但也会让以后每个提要求的人都学会一个道理：精确是要花钱的。不资助的话，旧工具还能凑合用，那些没弄清楚的未知数也就继续悬在那儿。"
 tv_engineering_department.320.a: "为精确掏这笔钱。"
 tv_engineering_department.320.b: "用现有的东西将就一下吧。"
 tv_engineering_department.321.t: "[tv_wonder_survey|E]：专业声望"
 tv_engineering_department.321.d: "[tv_great_engineer|E]请宫廷公开支持一种有争议的物流办法。这个方案能让[tv_wonder_materials|e]运得更快、闲置的劳工更少，也正好带着那种能让保守的监工们皱眉头的新鲜劲儿。国家出面背书，或许能让这套补给方案更让人信服；可万一失败了，丢的脸也是公开的。大工程常常就是这样，得赶在头一批观众看懂规则之前，先让国家押上一把。"
 tv_engineering_department.321.a: "拿我们的名声担保。"
 tv_engineering_department.321.b: "不公开出面背书。"
 tv_engineering_department.322.t: "[tv_wonder_survey|E]：行会协调"
 tv_engineering_department.322.d: "城里的供应商可以帮忙把测绘的记录统一起来，但他们也希望因为这份麻烦得到点补偿。他们那些管账的人懂重量、懂清单、懂路线，也懂怎么把一份表和另一份表对上号，这种本事平时不太起眼，用起来却很管用。工程部确实用得上这些本事，尤其是在[tv_wonder_materials|e]真正开始大量流动之前。可每让一步，商人们就把自己写进这座纪念碑的历史里更深一点。秩序是能买到的，可秩序会记得是谁卖给它的。"
 tv_engineering_department.322.a: "靠行会帮忙吧。"
 tv_engineering_department.322.b: "不欠这份人情。"
 tv_engineering_department.401.t: "[tv_wonder_ceremony|E]：冥想开始"
 tv_engineering_department.401.d: "这座建好的奇观被笼罩在一片沉默里。祭司、工程师和王室的观察者们暂时退出了寻常的热闹，用一整年清心寡欲的日子，给这座纪念碑赋予最后的意义。[tv_wonder_ceremony|E]不是从喧哗开始的，而是从有意不喧哗开始的。就连工程部也得学着有点耐心——毕竟没有哪种计算能催促一场本来就是要教人克制的仪式。访客们一开始觉得这份安静有点让人不自在，接着，他们还没弄明白为什么，就已经开始不由自主地放轻了说话声。"
 tv_engineering_department.401.a: "让这一年慢慢过去吧。"
 tv_engineering_department.410.t: "[tv_wonder_ceremony|E]：使节邀请"
 tv_engineering_department.410.d: "邻国的宫廷邀请我们派使节去见证他们那座宏伟轴线的落成仪式。这个邀请听着是礼节性的，可仪式恰恰是国家练习被人记住的地方。去了，我们的名字就能排进那些最早见证新建筑、在恰当时候鼓过掌、不用别人解释就听懂了这份意思的国家里；不去，虽然省了这趟路，可也就没了在他们这段历史里的位置。有些石头是建给自己国家看的，有些则是等着别的国家来见证的。"
 tv_engineering_department.410.a: "派使节去吧。"
 tv_engineering_department.410.b: "婉拒这个邀请。"
 tv_engineering_department.411.t: "[tv_wonder_ceremony|E]：一位使节抵达"
 tv_engineering_department.411.d: "受邀的宫廷答应了。又一位外国使节带着排练过的仪态、随行的队伍，还有一双看得出气派也看得出破绽的眼睛，加入了这场仪式队列。[tv_wonder_ceremony|E]每多一位外来的见证者，就更让人信服一分，因为荣耀这东西，换一种口音重复一遍，听着总是更响亮。仪仗官在调整入场的顺序，书记官在调整贵宾名单。奇观的仪式进度，就这样随着一个个前来观礼的宫廷慢慢往前推。"
 tv_engineering_department.411.a: "好好接待他们。"
 tv_engineering_department.412.t: "[tv_wonder_ceremony|E]：邀请遭拒"
 tv_engineering_department.412.d: "受邀的宫廷拒绝派使节来。他们的回复客气得不至于失礼，却也冷淡得让人忘不掉。[tv_wonder_ceremony|E]得去别处找观众了——一座指望着让外国人心生敬畏的建筑，可承受不起外交场合上空出来的位置。廷臣们已经开始琢磨别的人选、更体面的说法，还有措辞不那么像请求的信件了。荣耀不喜欢被拒绝，但它可以换个方向。"
 tv_engineering_department.412.a: "邀请另一个邻国吧。"
 tv_engineering_department.421.t: "[tv_wonder_ceremony|E]：凯旋阅兵开始"
 tv_engineering_department.421.d: "旗帜已经沿着轴线升起来了，可这场阅兵还差一样东西：一场真正的胜利。鼓手可以排练，马蹄可以踏得再讲究一些，军官们也可以站得漂漂亮亮、一脸自信，但这些都还不是胜利本身。[tv_wonder_ceremony|e]需要的是一场必须由战争来盖章认证的凯旋。在那之前，这座军事凯旋之城穿的只是一件还没完全挣来的荣誉外衣。只有真正打赢一仗，才能给这座纪念碑它想要的那份记忆。"
 tv_engineering_department.421.a: "那就打赢这一仗吧。"
 tv_engineering_department.431.t: "[tv_wonder_ceremony|E]：公民庆典开始"
 tv_engineering_department.431.d: "这座城市把它规整的广场，向为期一年的仪式、游戏、游行和公开教化敞开了大门。作坊的活儿慢了下来，但人们在走这些路、看这些场面、抱怨这些安排的过程中，慢慢摸清了公民生活该有的样子，直到这一切变得熟悉起来。[tv_wonder_ceremony|E]把整座城市变成了一堂在露天反复上的课。孩子们还没弄懂那些口号是什么意思，就已经先记住了游行的路线。这座秩序之城，正在用过节的方式教人服从。"
 tv_engineering_department.431.a: "让市民们聚起来吧。"
 tv_engineering_department.461.t: "[tv_wonder_ceremony|E]：自由贸易节开始"
 tv_engineering_department.461.d: "商人、使节和经纪人带着开放贸易的许诺挤满了港口。这段时间国库的收入会紧一些，毕竟慷慨这东西，账目还没算清楚之前总是显得最体面。[tv_wonder_ceremony|E]把码头、仓库和挤满人的谈判桌，变成了向外国人展示信心的舞台。每签下一份公开的合同，都是在教这个港口讲一种远方宫廷听得懂的语言。这一年里，利润先退一步，让名声走在前头。"
 tv_engineering_department.461.a: "把码头开放吧。"
 tv_engineering_department.471.t: "[tv_wonder_ceremony|E]：祖先祭仪开始"
 tv_engineering_department.471.d: "这座陵墓迎来了整整一年的焚香、族谱和有条不紊的哀悼。一个个名字被反复念诵，念到听起来比它们曾经的主人还要沉重，作坊也慢了下来，因为这段时间记忆比生产更要紧。[tv_wonder_ceremony|E]教会了这个国家，该怎样把祖先当成一种建筑来看待。每一次祭奠，都在这个道理里又添了一块砖：活人要受这些安排妥当的死者管着。哀悼这东西，一旦被组织起来，就成了权威。"
 tv_engineering_department.471.a: "让祖先们聚一聚吧。"
 tv_engineering_department.481.t: "[tv_wonder_ceremony|E]：领航员行会动工"
 tv_engineering_department.481.d: "领航员、绘图师、绳索匠和港务的书记员们，在灯塔底下划出了行会堂的地基。他们带来了海图、绳结、几句关于座次的争执，还有那种在坏天气里也能看懂海岸线的人才有的那份自信。这座灯塔得等这个机构立起来才算真正完工——光靠一束光只能提醒船只当心，行会才能教会一个国家怎么去理解这份提醒。[tv_wonder_ceremony|E]现在就等着这个头发里带着咸味的衙门了。"
 tv_engineering_department.481.a: "把行会堂建起来吧。"
 tv_engineering_department.491.t: "[tv_wonder_ceremony|E]：水神大祭开始"
 tv_engineering_department.491.d: "水渠被花环装点起来，水闸接受了祝福，作坊也为了这一年的水神祭祀慢了下来。水被安排得像是很听话的样子——这话说出来其实挺大胆的，毕竟见过洪水的人都知道水从来不听话。为了让这座建筑群通过[tv_wonder_ceremony|e]获得神圣的秩序，生产也得让一让路。工程师看着祭司为他们更想去检查的东西祝福，祭司看着工程师去测量他们更想去圣化的东西。两边夹着，水倒是照旧在流。"
 tv_engineering_department.491.a: "让水继续流吧。"
 tv_engineering_department.501.t: "[tv_wonder_ceremony|E]：深井排水开始"
 tv_engineering_department.501.d: "工程师把排水工程一路推进到矿业城的深处。接下来这一年，坑道里会近乎沉寂，全靠水泵、支架和沟渠慢慢征服地下深处。矿工们讨厌安静，差不多跟讨厌积水一样厉害，可这两样都得先忍下来，才能挖到更深处的财富。这里的[tv_wonder_ceremony|e]算不上温和，更像是跟黑暗、潮湿和耐心签的一份合约。等工程终于喘过气来，这座城市就会知道，自己到底能在旧日的恐惧下面走多远。"
 tv_engineering_department.501.a: "把这片黑暗排干净吧。"
 tv_engineering_department.511.t: "[tv_wonder_ceremony|E]：星表编纂开始"
 tv_engineering_department.511.d: "观象台把自己关进了灯光、表格和一场有纪律的失眠里。天文学家们一颗接一颗地记下星辰，不再把它们当成散乱的光点，而是当成以后的学者能够核实的一份公共记录。宫廷把注意力分给了天空和仪器，立法的事也跟着慢了下来。[tv_wonder_ceremony|e]今天不会以什么盛大的场面收尾，它要等到整片天空被抄录得足够耐心、真正变得有用为止。"
 tv_engineering_department.511.a: "让他们把星星数清楚吧。"
 tv_engineering_department.521.t: "[tv_wonder_ceremony|E]：日食宣告开始"
 tv_engineering_department.521.d: "观象台已经发布了预测：日食就要来了，宫廷打算赶在恐惧开口之前，先说出它的名字。祭司、学者、水手，还有那些不信的人，如今都带着不同的心思仰起了头。接下来的每个月，都是对这份预测的一次检验。要是天象真按表格上说的那样发生，[tv_wonder_ceremony|e]就能证明，这个国家能读懂天象，而不必向它低头。"
 tv_engineering_department.521.a: "看着天空吧。"
 tv_engineering_department.522.t: "[tv_wonder_ceremony|E]：日食降临"
 tv_engineering_department.522.d: "光线正好按观象台说的那样开始变化。人群安静了下来，但这份安静不是害怕——传令官早就把学者们表格上的预言告诉了他们。[tv_wonder_ceremony|e]就这样，在太阳、阴影和一片屏住的呼吸之间，变成了一种人人都信的确定。等光重新亮起来的时候，宫廷证明的已经不只是自己有智慧，还有把握时机的本事、面对未知的胆量，以及驾驭奇观本身的能力。"
 tv_engineering_department.522.a: "让国家记住这次预言吧。"
 tv_engineering_department.531.t: "[tv_wonder_ceremony|E]：贡礼送达"
 tv_engineering_department.531.d: "又一份附属国的贡礼送进了万国宫。它被小心地摆了出来——不只是财富本身，更是摆给每一位路过大厅的使节看的一套关于地位的说法。贡礼展厅里的东西越摆越多，也就越来越有说服力，因为服从这种事，跟荣耀一样，一旦有了具体的建筑做见证，就更容易让人相信。这场仪式，就这样靠着一次次分量十足的顺从，慢慢往前推进。"
 tv_engineering_department.531.a: "把这份贡礼记录下来。"
 tv_engineering_department.541.t: "[tv_wonder_ceremony|E]：常设使馆区动工"
 tv_engineering_department.541.d: "万国宫旁边，使馆区的地基已经划好了。外国的馆舍将来会有自己的门廊、庭院、仆役通道，还有能让外交从偶尔一次的拜访变成日常存在的种种细小体面。[tv_wonder_ceremony|e]现在就等着这片专门给别国宫廷住的街区了。宫殿能让人多看一眼，使馆区却能让这份关注留下来。"
 tv_engineering_department.541.a: "给外国来的人建个住处吧。"
 tv_engineering_department.500.t: "[tv_wonder_ceremony|E]：工程落成"
 tv_engineering_department.500.d: "[tv_engineering_department|E]已经完成了[tv_wonder_ceremony|e]，这座建筑如今成了国家雄心的永久见证。脚手架撤了，账本合上了，公众也开始做起了工程师做不了的那件事：琢磨这座奇观到底意味着什么。有人说这是荣耀，有人说这是铺张，也有人说这证明了时代真的变了。不管怎么说，所有人都得看它一眼。光是这一点，其实就已经算是一种胜利了。"
 tv_engineering_department.500.a: "让这个时代记住它吧。"
 tv_engineering_department.600.t: "[tv_wonder_construction|E]：世界奇观落成"
 tv_engineering_department.600.d: "从[SCOPE.sCountry('tv_wonder_builder_country').GetName]传来消息：一座世界奇观已经在[SCOPE.sLocation('tv_wonder_completed_site').GetName]落成了。各方对它花了多少钱、好不好看、有什么用、值不值得，说法都不一样，但有一点大家都认——这项工程已经太大了，没法只当地方上的事。它已经成了各国统治者们都在谈的话题。"
 tv_engineering_department.600.a: "这事，全世界都听说了。"

