l_simp_chinese:
 tv_engineering_department_name: "工程部"
 tv_engineering_department__wonder_control_name: "奇观操控"
 tv_engineering_department__wonder_control_desc: "由主机统一控制的工程部建设与生命周期设置。"
 tv_engineering_department__wonder_control__access_name: "建筑入口"
 tv_engineering_department__wonder_control__access_desc: "控制工程部奇观建筑是否进入普通建筑界面。"
 tv_engineering_department__wonder_control__phases_name: "生命周期操控"
 tv_engineering_department__wonder_control__phases_desc: "控制伟大奇观生命周期中需要缩短或禁用的阶段。阶段跳过开关仅在项目之后进入对应阶段时生效。"
 tv_engineering_department__wonder_control__limits_name: "建设限制"
 tv_engineering_department__wonder_control__limits_desc: "覆盖由适性决定的规模与工地限制。"
 tv_engineering_department__wonder_control__construction_name: "建设调整"
 tv_engineering_department__wonder_control__construction_desc: "控制建设进度需求及建设随机事件。"
 tv_engineering_department__direct_build_name: "直接建造奇观"
 tv_engineering_department__direct_build_desc: "允许从普通建筑列表按设定的金币价格直接建造最终奇观建筑，并使用较长的建造时间。完工后地方效果立即生效，国家效果在下一次月度脉冲刷新。"
 tv_engineering_department__direct_build_small_price_name: "直接建造小型奇观价格"
 tv_engineering_department__direct_build_small_price_desc: "直接建造每级小型奇观所需的金币，单位为千。"
 tv_engineering_department__direct_build_small_price_format: "[CMMV('tv_engineering_department__direct_build_small_price')]k"
 tv_engineering_department__direct_build_medium_price_name: "直接建造中型奇观价格"
 tv_engineering_department__direct_build_medium_price_desc: "直接建造每级中型奇观所需的金币，单位为千。"
 tv_engineering_department__direct_build_medium_price_format: "[CMMV('tv_engineering_department__direct_build_medium_price')]k"
 tv_engineering_department__direct_build_large_price_name: "直接建造大型奇观价格"
 tv_engineering_department__direct_build_large_price_desc: "直接建造每级大型奇观所需的金币，单位为千。"
 tv_engineering_department__direct_build_large_price_format: "[CMMV('tv_engineering_department__direct_build_large_price')]k"
 tv_engineering_department__skip_concept_name: "跳过构想"
 tv_engineering_department__skip_concept_desc: "之后开始的构想阶段会通过延迟一天的隐藏事件自动完成。"
 tv_engineering_department__skip_debate_name: "跳过辩论"
 tv_engineering_department__skip_debate_desc: "之后开始的辩论阶段会立即获得200国内支持度并进入测绘。"
 tv_engineering_department__skip_survey_name: "跳过测绘"
 tv_engineering_department__skip_survey_desc: "初建项目会以规模100、物流85、组织85立即完成测绘；恢复和扩建项目继续使用已有测绘缓存。"
 tv_engineering_department__unlimited_scale_name: "无规模限制"
 tv_engineering_department__unlimited_scale_desc: "判断伟大奇观能否达到6级时忽略规模适性。"
 tv_engineering_department__unlimited_organization_name: "无组织限制"
 tv_engineering_department__unlimited_organization_desc: "无论组织适性如何，伟大奇观劳动营均可达到100级。"
 tv_engineering_department__disable_survey_events_name: "禁用测绘事件"
 tv_engineering_department__disable_survey_events_desc: "阻止测绘阶段的随机事件出现。"
 tv_engineering_department__skip_construction_name: "跳过建设阶段"
 tv_engineering_department__skip_construction_desc: "立即将四类奇观构件及对应最终辅助建筑提升至6级，随后进入仪式阶段。#R 警告：这将严重破坏游戏平衡。#!"
 tv_engineering_department__small_module_requirement_name: "小型奇观模块需求"
 tv_engineering_department__small_module_requirement_desc: "每个小型奇观模块所需的建设进度，单位为千。"
 tv_engineering_department__small_module_requirement_format: "[CMMV('tv_engineering_department__small_module_requirement')]k"
 tv_engineering_department__medium_module_requirement_name: "中型奇观模块需求"
 tv_engineering_department__medium_module_requirement_desc: "每个中型奇观模块所需的建设进度，单位为千。"
 tv_engineering_department__medium_module_requirement_format: "[CMMV('tv_engineering_department__medium_module_requirement')]k"
 tv_engineering_department__large_module_requirement_name: "大型奇观模块需求"
 tv_engineering_department__large_module_requirement_desc: "每个大型奇观模块所需的建设进度，单位为千。"
 tv_engineering_department__large_module_requirement_format: "[CMMV('tv_engineering_department__large_module_requirement')]k"
 tv_engineering_department__disable_construction_events_name: "禁用建设事件"
 tv_engineering_department__disable_construction_events_desc: "阻止建设阶段的随机事件出现。"
 tv_engineering_department__skip_ceremony_name: "跳过仪式等待与代价"
 tv_engineering_department__skip_ceremony_desc: "通用仪式仍需选择，但会免费且立即完成；独特奇观进入仪式阶段后自动完成仪式。"
