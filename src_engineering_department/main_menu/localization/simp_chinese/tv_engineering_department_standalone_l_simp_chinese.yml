l_simp_chinese:
 tv_engineering_department_standalone.1.t: "[tv_wonder_construction|E]：工程部"
 tv_engineering_department_standalone.1.d: "你的国家现已拥有工程部——负责统筹本国每一项伟大工程的常设机构。\n\n任命一位大工程师即可开始：他们会先为一项可行工程提出#high 构想#!，交由朝廷通过国内#high 辩论#!表态；随后#high 测绘#!确认选址，再正式进入#high 建设#!阶段，推进四个部件直至工程达到最终等级。完工后将举行#high 仪式#!，授予永久性奖励。\n\n你可以随时打开工程部面板查看进度或任命大工程师。"
 tv_engineering_department_standalone.1.a: "了解了"
 tv_engineering_department_standalone.1.a.tt: "建立#G 工程部#!。"
