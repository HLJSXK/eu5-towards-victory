<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Towards Victory 奇观本地化编辑器</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="shell">
        <aside class="sidebar">
            <div class="sidebar-header">
                <p class="eyebrow">Wonder Localization</p>
                <h1>奇观列表</h1>
                <p class="sidebar-copy">本地搜索、切换编辑对象，并保留现有本地化生成链路。</p>
            </div>
            <label class="search-card" for="search-input">
                <span>搜索奇观</span>
                <input id="search-input" type="search" placeholder="ID / key / 名称 / concept">
            </label>
            <p class="count-line" id="wonder-count">加载中...</p>
            <div class="wonder-list" id="wonder-list"></div>
        </aside>

        <main class="workspace">
            <header class="hero panel">
                <div class="hero-copy">
                    <p class="eyebrow">FastAPI + Uvicorn</p>
                    <h2 id="app-title">Towards Victory 奇观本地化编辑器</h2>
                    <p class="hero-description">
                        Web 版编辑器保留原有奇观字段、手工本地化文件与重新生成脚本，方便后续继续做界面升级。
                    </p>
                    <div class="meta-grid" id="wonder-meta"></div>
                </div>
                <div class="hero-actions">
                    <button id="save-button" class="primary-button">保存并重新生成</button>
                    <button id="reload-button" class="secondary-button">重新加载文件</button>
                    <div class="status-stack">
                        <span id="status-badge" class="status-badge">就绪</span>
                        <span id="dirty-badge" class="dirty-badge hidden">未保存更改</span>
                    </div>
                </div>
            </header>

            <section class="panel editor-panel">
                <div class="editor-toolbar">
                    <div class="tab-bar" id="language-tabs"></div>
                </div>
                <div class="language-panels" id="language-panels"></div>
            </section>

            <section class="panel log-panel">
                <div class="panel-header">
                    <div>
                        <p class="eyebrow">Operations</p>
                        <h3>日志</h3>
                    </div>
                    <button id="copy-log-button" class="ghost-button">复制日志</button>
                </div>
                <pre id="log-output" class="log-output"></pre>
            </section>
        </main>
    </div>

    <div id="toast" class="toast hidden" aria-live="polite"></div>
    <script type="module" src="/static/app.js"></script>
</body>
</html>
