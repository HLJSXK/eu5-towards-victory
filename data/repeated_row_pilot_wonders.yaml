# Data source for scripts/gen_repeated_row_pilot_wonders.py
# 3 pilot "Unique Wonder Ritual" wonders using a repeated-row event/effect/trigger pattern,
# analogous in structure to the Alhambra Harness output but generated by a small
# project-owned generator (see docs/guides/Unique_Wonder_Ritual_Harness.md for the
# frozen-Harness governance context this generator deliberately sits outside of).
wonders:
  unique_dome_of_the_rock:
    wonder_key: unique_dome_of_the_rock
    wonder_id: 103
    runtime_prefix: tv_wonder_dome_of_the_rock
    name_slug: dome_of_the_rock
    row_sets:
    - row_set_key: sanctuary_access_groups
      stages:
      - stage: opening
        event_id: 1658
        en_title: Wardens at the Golden Threshold
        en_desc: The commissioner summons the Platform Gate Wardens, the State-Faith Jurists, the Visiting Pilgrim Groups, Jerusalem's Local Notables, and the Supervised Intercommunal Witnesses beneath the gilded dome. No custom or garrison order yet says who may pass the gates, and each party has arrived expecting its own rule to prevail. The covenant governing access to the Rock must be read aloud before it can be obeyed.
        en_options:
        - Convene the custody council.
        zh_title: 金色门槛前的守卫者
        zh_desc: 总督在金顶之下召集了平台门卫、国教法学家、来访的朝圣团、耶路撒冷本地显贵，以及受监督的跨信仰见证人。目前尚无惯例或驻防命令规定谁可以通过城门，每一方都期待自己的规矩能够胜出。这份决定谁可进入圣石的盟约，必须先被宣读，才能被遵行。
        zh_options:
        - 召集守护议事会。
      - stage: update
        event_id: 1659
        en_title: Weighing the Access Compact
        en_desc: 'Between disciplined guard thresholds, a jurist''s public proclamation, and witnessed pilgrim tolerance, the wardens and notables wait for the covenant''s shape to be declared. Each path protects the sanctuary differently: guards close ranks around the Rock, jurists write a rule the whole city can read, and witnesses see that access is neither plunder nor caprice. The choice, once spoken, becomes the platform''s law until it is challenged.'
        en_options:
        - Declare the access compact.
        zh_title: 权衡门禁盟约
        zh_desc: 在纪律严明的守卫门槛、法学家的公开宣告与见证下的朝圣宽容之间，门卫与显贵们等待着盟约的最终形态被宣布。三条路径各自以不同方式守护圣所：守卫在圣石周围收紧防线，法学家写下全城都能读懂的规则，见证人则确认门禁既非掠夺也非随心所欲。这一决定一旦说出，便成为平台的法律，直到它受到挑战。
        zh_options:
        - 宣布门禁盟约。
      - stage: retry
        event_id: 1660
        en_title: The Compact Is Tested
        en_desc: Pilgrim caravans balk at a warden's threshold count, and Jerusalem's Local Notables mutter that the Supervised Witnesses have seen soldiers turn the faithful away for sport. Whether this is guard overreach, a rejected exclusion, or an honest witness's suspicion, the sanctuary compact now stands accused of narrowing sovereignty into occupation. The commissioner must answer with either open reconciliation or a quieter, stricter proclamation.
        en_options:
        - Reopen the gates to reconciliation.
        - Hold the line with a narrower proclamation.
        zh_title: 盟约受到考验
        zh_desc: 朝圣商队对门卫设下的门槛人数心生抵触，耶路撒冷的本地显贵们低声抱怨，说受监督的见证人目睹了士兵为取乐而将信众拒之门外。无论这是守卫越权、一次遭到抵制的排斥，还是见证人如实的怀疑，这份圣所盟约如今都被指控正把主权收窄为占领。总督必须以公开的和解，或是更严厉、更低调的宣告作出回应。
        zh_options:
        - 重开城门，寻求和解。
        - 以更严苛的宣告坚守防线。
      - stage: resolve
        event_id: 1661
        en_title: The Access Covenant Is Sealed
        en_desc: Gate wardens, jurists, pilgrim caravans, local notables, and supervised witnesses stand together as the compact is read a final time upon the platform. What began as five competing claims to the threshold becomes one recognized law of entry, witnessed by those who might otherwise have doubted it. The Dome's sovereignty is proven not by the strength of its guards but by the durability of who now keeps the keys in peace.
        en_options:
        - Seal the access covenant.
        zh_title: 门禁盟约被封印
        zh_desc: 门卫、法学家、朝圣商队、本地显贵与受监督的见证人齐聚一堂，聆听盟约在平台上最后一次被宣读。曾经五方各执一词、争夺门槛的局面，如今化作一部众人公认的门禁律法，连原本心存怀疑者也已见证。圣顶的主权，不是靠守卫之强得到证明，而是靠如今安然持有钥匙者的长久稳固得到证明。
        zh_options:
        - 封印门禁盟约。
    - row_set_key: custody_duties
      stages:
      - stage: opening
        event_id: 1000
        en_title: The Duties of the Platform
        en_desc: 'Beyond the gate lies the daily labor that proves a covenant genuine: watch lists for the Gate Keys, water carriers for the Cisterns, oil and wicks for the Dome Lamps and their inscriptions, scribes for the Endowment Deeds, and escorts for the Guarded Pilgrim Routes. The commissioner gathers the officers responsible for each so that stewardship of the Rock, not mere possession, can be entrusted rather than assumed.'
        en_options:
        - Summon the custody officers.
        zh_title: 平台上的职守
        zh_desc: 城门之内，还有证明盟约真实与否的日常劳作：钥匙与巡视名册需要看管，蓄水池需要挑水人照料，圆顶灯盏与其铭文需要添油续芯，赠地契据需要抄录官打理，受护送的朝圣路线也需要护卫随行。总督召集各项职守的负责官员，好让人们托付而非想当然地假定圣石得到了真正的看护，而非仅仅被占有。
        zh_options:
        - 召集职守官员。
      - stage: update
        event_id: 1001
        en_title: Entrusting the Sanctuary's Labor
        en_desc: The keys and watch lists, the cisterns and their carriers, the lamps and their inscriptions, the endowment deeds and their scribes, and the guarded pilgrim routes each need a keeper before the covenant means anything beyond words. Assigning these duties one by one turns the golden dome's promise of custody into a ledger any notable or jurist can inspect. What the commissioner entrusts today, the Rock will remember.
        en_options:
        - Assign the custody duties.
        zh_title: 托付圣所的劳作
        zh_desc: 钥匙与巡视名册、蓄水池与挑水人、灯盏与铭文、赠地契据与抄录官，以及受护送的朝圣路线，每一项都需要有人看管，盟约才不至于沦为空谈。将这些职责逐一分派下去，便能把金顶许下的守护承诺，变成任何显贵或法学家都能查验的账册。总督今日托付出去的，圣石都会铭记。
        zh_options:
        - 分派职守。
      - stage: retry
        event_id: 1002
        en_title: A Duty Neglected
        en_desc: A cistern runs dry before its carriers can be paid, or an endowment scribe is found altering the deeds that fund the lamps' oil, and suddenly stewardship looks like plunder dressed in piety. Left unanswered, the lapse will make every other custody duty suspect in the eyes of pilgrims and local notables alike. The commissioner can either repair the lapse in the open or quietly reassign it to sterner hands.
        en_options:
        - Repair the lapse openly.
        - Reassign the duty to sterner hands.
        zh_title: 被疏忽的职守
        zh_desc: 一座蓄水池在挑水人领到工钱前便已干涸，或是一名赠地抄录官被发现篡改了资助灯油的契据——瞬间，尽心的看护看起来竟像披着虔诚外衣的掠夺。若置之不理，这一失职将令朝圣者与本地显贵对其余每一项职守都心生怀疑。总督可以选择公开修补这一过失，或是悄悄将其转交给更严厉的人手。
        zh_options:
        - 公开修补过失。
        - 将职守转交更严厉的人手。
      - stage: resolve
        event_id: 1003
        en_title: The Custody Duties Are Entrusted
        en_desc: Keys and watch lists, cisterns and carriers, lamps and inscriptions, endowment deeds and scribes, and the guarded pilgrim routes are each declared entrusted before the assembled custodians. The Dome of the Rock no longer merely stands over Jerusalem; it is kept, watered, lit, funded, and guarded by name and by oath. This is the daily proof that sovereignty here means service, not seizure.
        en_options:
        - Entrust the custody duties.
        zh_title: 职守被托付完成
        zh_desc: 钥匙与巡视名册、蓄水池与挑水人、灯盏与铭文、赠地契据与抄录官，以及受护送的朝圣路线，一一在聚集的众守护者面前被宣布托付完成。圣石圆顶不再只是矗立于耶路撒冷之上，它被人以姓名与誓言看管、供水、点亮、供养与护卫。这正是此地主权即服务、而非攫取的日常明证。
        zh_options:
        - 托付职守。
  unique_bank_of_saint_george:
    wonder_key: unique_bank_of_saint_george
    wonder_id: 122
    runtime_prefix: tv_wonder_bank_of_saint_george
    name_slug: bank_of_saint_george
    row_sets:
    - row_set_key: charter_options
      stages:
      - stage: opening
        event_id: 1854
        en_title: The Ledger Oath of San Giorgio
        en_desc: In the bank hall by the harbor, the doge's officers, Anziani, merchant creditors, notaries, mint masters, customs farmers, and armed guards gather around the great ledger. Genoa's tangled war debts and its restless creditors can no longer be managed as private compere; the Republic means to bind them into one sworn institution. Before any coin is struck or any charter written, the oath itself must be opened.
        en_options:
        - Open the ledger oath.
        zh_title: 圣乔治的账簿誓约
        zh_desc: 在港口旁的银行大厅里，总督官员、长老议员、商人债主、公证人、铸币官、关税包税人与持械卫兵齐聚账簿之前。热那亚纠缠不清的战争债务与躁动的债权人已无法再以私人组合的形式维持，共和国决意将其束缚为一个可宣誓的机构。在铸出任何钱币、写下任何宪章之前，誓约本身必须先行开启。
        zh_options:
        - 开启账簿誓约。
      - stage: update
        event_id: 1855
        en_title: Creditors, Crown, or Common Market
        en_desc: 'Three drafts lie on the table: a Creditor Privilege Charter that gives the compere''s old creditors first claim on the ledger, a Crown Supervision Charter that lets the doge''s officers police every entry, and an Open Merchant Access Charter that lets any trading house buy into the bank on equal terms. Each path promises the same public credit, but each hands trust, and blame, to a different hand. The notaries wait to copy whichever draft the founders choose to swear.'
        en_options:
        - Choose the founding charter.
        zh_title: 债权人、王权，还是自由市场
        zh_desc: 桌上摆着三份草案：一份《债权人特权宪章》让组合旧日债主对账簿享有优先索偿权，一份《王权监督宪章》让总督官员审核每一笔入账，一份《开放商人准入宪章》让任何商行都能以同等条件入股银行。三条路径许诺的都是同一种公共信用，却把信任与责任交到不同人手中。公证人正等着抄录创立者最终宣誓的那份草案。
        zh_options:
        - 选定创立宪章。
      - stage: retry
        event_id: 1856
        en_title: The First Test of Trust
        en_desc: The ink is barely dry before the charter is tested. Creditors under privilege begin dictating terms to the mint; crown officers under supervision alarm the merchant houses they were meant to reassure; or open access draws in pledges the bank cannot yet verify. Whichever branch was sworn, the bank hall now rings with accusations of favoritism, distrust, or looming default.
        en_options:
        - Curb the overreach and renegotiate the charter's terms.
        - Stand by the charter and absorb the political cost.
        zh_title: 信任的第一道考验
        zh_desc: 墨迹未干，宪章已受到考验。享有特权的债主开始向铸币厂发号施令；受监督的王室官员本该安抚商行，却令其惊惧；又或开放准入招来了银行尚无法核实的抵押。无论宣誓的是哪一支路径，银行大厅此刻回荡着偏袒、猜忌与迫近违约的指控。
        zh_options:
        - 遏制越权行为，重新协商宪章条款。
        - 坚持宪章原样，承受相应的政治代价。
      - stage: resolve
        event_id: 1857
        en_title: San Giorgio's Seal
        en_desc: The charter is sealed before the assembled officers, creditors, and merchants, and a freshly assayed coin is set beside the ledger as proof of trust restored. Notaries copy the sworn terms for the archive, customs farmers post the charter at the harbor gate, and the Bank of Saint George stands as public authority rather than private compere. Genoa's public credit now has a name, a seal, and a single voice.
        en_options:
        - Seal the public credit.
        zh_title: 圣乔治的印玺
        zh_desc: 宪章在齐聚的官员、债主与商人面前正式盖印，一枚刚经检验的钱币被置于账簿之旁，以证明信任已然恢复。公证人将宣誓条款誊入档案，关税包税人将宪章张贴于港口城门，圣乔治银行由此成为公共权威，而非私人组合。热那亚的公共信用如今有了名号、印玺与统一的声音。
        zh_options:
        - 盖印公共信用。
    - row_set_key: public_credit_pledges
      stages:
      - stage: opening
        event_id: 1012
        en_title: The Pledge Rolls Are Opened
        en_desc: 'With the charter sworn, the harder work begins: making the ledger credible enough to lend against. Customs farmers, salt tax officials, harbor toll collectors, mint assayers, and the keepers of the state archive are summoned to the bank hall, each bearing the accounts of a revenue stream the Republic might pledge. Old war debts alone cannot carry the bank''s credit; they must be joined by taxes and tolls the merchants can trust.'
        en_options:
        - Open the pledge rolls.
        zh_title: 抵押清册开启
        zh_desc: 宪章既已宣誓，更艰难的工作随之而来：让账簿具备足以借贷的信誉。关税包税人、盐税官员、港口通行税征收人、铸币检验官与国家档案的看管人齐聚银行大厅，各自携来一项共和国可能用以抵押的岁入账目。仅凭旧日战争债务无法支撑银行的信用，还需加入商人们能够信赖的税收与通行费。
        zh_options:
        - 开启抵押清册。
      - stage: update
        event_id: 1013
        en_title: Debts, Duties, and the Archive Vault
        en_desc: 'One by one the rows are weighed: the old war debts that first justified the compere, the customs dues on every galley that clears the mole, the salt tax collected in every market, the port tolls levied at the chain across the harbor mouth, the coin assays that certify each struck ducat, and the archive volumes that record every prior loan. Pledging too many strains the Republic''s own treasury; pledging too few leaves the ledger looking hollow to the men who must trust it.'
        en_options:
        - Assign the pledge rows.
        zh_title: 债务、税捐与档案库
        zh_desc: 各项抵押逐一被权衡：最初促成组合成立的旧日战争债务、每艘商船通过防波堤时缴纳的关税、各处市场征收的盐税、港口锁链处课取的通行税、为每一枚铸造杜卡特验明真伪的铸币检验，以及记录历来每一笔借贷的档案卷宗。抵押过多会拖累共和国自身的财库，抵押过少又会让必须信赖此账簿的人们觉得它空洞无物。
        zh_options:
        - 分配抵押清册各项。
      - stage: retry
        event_id: 1014
        en_title: A Pledge Falls Into Doubt
        en_desc: 'Before the ink can dry on the assignments, one pledge wavers: a shortfall in the salt tax, a rumor of clipped coin among the assays, or a customs farmer who cannot meet his quarter''s due. Left unaddressed, distrust in one row threatens to spread across the whole ledger, and the bank''s default risk climbs with every week the shortfall goes unanswered.'
        en_options:
        - Guarantee the pledge with treasury reserves.
        - Narrow the pledge to the streams already proven sound.
        zh_title: 一项抵押陷入疑虑
        zh_desc: 分配的墨迹未干，一项抵押已然动摇：盐税出现短缺，验币中传出剪削劣币的流言，又或某位关税包税人无法按期缴清本季应付之数。若置之不理，一项抵押的失信便可能蔓延至整本账簿，银行的违约风险也随着每一周悬而未决的短缺不断攀升。
        zh_options:
        - 以国库储备为该项抵押作保。
        - 收缩抵押范围，仅留已证明稳妥的岁入。
      - stage: resolve
        event_id: 1015
        en_title: The Ledger Is Honored
        en_desc: The disputed pledge is settled, the archive volumes are sealed with the bank's mark, and every revenue stream from old war debts to coin assays now stands recorded as honored collateral. Merchants, customs farmers, and the doge's own treasury can point to the ledger and trust what it says. The Bank of Saint George's public credit is no longer a promise; it is a debt the Republic itself will not default upon.
        en_options:
        - Honor the pledge roll.
        zh_title: 账簿获得兑现
        zh_desc: 有争议的抵押终获解决，档案卷宗盖上银行印记封存，从旧日战争债务到铸币检验的每一项岁入如今都被记录为已兑现的担保。商人、关税包税人乃至总督自己的国库，都能指着这本账簿信赖其所载之言。圣乔治银行的公共信用不再只是一句承诺，而是共和国自身绝不违约的债务。
        zh_options:
        - 兑现抵押清册。
  unique_st_peters_basilica:
    wonder_key: unique_st_peters_basilica
    wonder_id: 112
    runtime_prefix: tv_wonder_st_peters_basilica
    name_slug: st_peters_basilica
    row_sets:
    - row_set_key: sacred_official_candidates
      stages:
      - stage: opening
        event_id: 5055
        en_title: A Keeper for Peter's Tomb
        en_desc: 'The dome rises over the apostle''s grave, but a basilica without a named guardian is only a monument. Before the threshold can open, Rome must choose who will answer for the tomb: a cardinal administrator to command with full authority, a diocesan bishop to anchor pastoral care, a relic custodian to guard the confession itself, an alms prefect to account for every offering, or an artist canon to keep the fabric''s glory legible. Each candidate carries their own following, and the dome will remember whichever hand first holds the keys.'
        en_options:
        - Open the search for Peter's keeper.
        zh_title: 彼得墓的守护者
        zh_desc: 穹顶已高耸于使徒墓穴之上，但没有指定守护者的巴西利卡只是一座纪念碑。在门槛开启之前，罗马必须选定谁来为这座墓穴负责：或是拥有全权的枢机管理人，或是扎根牧灵关怀的教区主教，或是亲自守卫忏悔室的圣髑守护人，或是核算每一笔奉献的施舍总监，或是守护建筑荣光可读性的艺术教士。每位候选人都带着自己的追随者，而穹顶将铭记第一个握有钥匙之人。
        zh_options:
        - 开启彼得守护者的甄选。
      - stage: update
        event_id: 5056
        en_title: The Keys Are Offered
        en_desc: Five hands reach for the same office. The cardinal administrator offers unmatched authority but answers first to the curia; the diocesan bishop offers pastoral legitimacy but limited command over relics and alms; the relic custodian offers unimpeachable care of the confession but little standing over clergy; the alms prefect offers transparent ledgers but a thin claim to sacred authority; the artist canon offers a basilica worthy of the dome but treats duty as decoration. Rome must weigh legitimacy, competence, and faction before the keys are pressed into any single palm.
        en_options:
        - Name the sacred official.
        zh_title: 钥匙的呈递
        zh_desc: 五只手同时伸向同一个职位。枢机管理人拥有无可匹敌的权威，却首先要向教廷负责；教区主教拥有牧灵上的正当性，却对圣髑与施舍的掌控有限；圣髑守护人对忏悔室的照看无可指摘，却在教士中缺乏地位；施舍总监的账目清晰透明，却在圣职权威上底气不足；艺术教士能让巴西利卡配得上这座穹顶，却把职责当作装饰。罗马必须在正当性、能力与派系之间权衡，才能将钥匙交到某一人手中。
        zh_options:
        - 任命神圣官员。
      - stage: retry
        event_id: 5057
        en_title: The First Scandal
        en_desc: Whichever hand took the keys, that hand's weakness now shows. Relics go unaccounted, alms vanish into private accounts, pilgrims are turned from the threshold, or a patron's faction is caught treating the confession as a stage for its own ambitions. The dedication cannot proceed while the fault stands unanswered, but correcting it in full may cost the very authority Rome just bestowed.
        en_options:
        - Investigate and discipline the official.
        - Overlook the fault for a narrower dedication.
        zh_title: 第一桩丑闻
        zh_desc: 无论钥匙落入谁手，那只手的弱点如今暴露无遗。圣髑账目不清，施舍流入私囊，朝圣者被拒于门槛之外，或某派系的靠山被发现把忏悔室当作自身野心的舞台。若过错无人问责，落成便无法进行；但若彻查到底，罗马刚刚授予的权威本身也可能因此受损。
        zh_options:
        - 彻查并惩戒该官员。
        - 对过错既往不咎，缩小落成的名义。
      - stage: resolve
        event_id: 5058
        en_title: The Sacred Office Confirmed
        en_desc: The scandal answered or absorbed, the keeper's authority survives its first test. Clergy, custodians, and the faithful now know who speaks for Peter's tomb, and the dedication can proceed on that name alone. Rome seals the office not as a courtesy title but as a working charge over the basilica's every sacred function.
        en_options:
        - Confirm the sacred official's charge.
        zh_title: 圣职的确立
        zh_desc: 丑闻已被回应或消化，守护者的权威经受住了第一次考验。教士、圣髑守护者与信众如今都明白谁在为彼得之墓发言，落成仪式得以凭此名义继续进行。罗马将这一职位确立为对巴西利卡每一项神圣职能的实际管辖，而非一个虚衔。
        zh_options:
        - 确立神圣官员的职责。
    - row_set_key: apostolic_service_duties
      stages:
      - stage: opening
        event_id: 7317
        en_title: The Doors Behind the Keeper
        en_desc: 'An official now holds the keys, but keys alone do not run a basilica. Behind the high altar wait duties no single hand can perform unassisted: the relic inventory over the tomb, the alms ledger that funds the poor and the fabric alike, the pilgrim threshold that must judge who may approach, the choir offices that keep the hours sung, and the chapel patronage that lesser families still hope to claim. Rome must decide how these duties are divided before the basilica can call itself a working house of the apostle.'
        en_options:
        - Open the register of apostolic duties.
        zh_title: 守护者身后的诸门
        zh_desc: 一位官员如今握有钥匙，但仅凭钥匙无法运转一座巴西利卡。在高坛之后，还有许多无法由一人独自承担的职责等待安排：守护墓穴的圣髑清册、供养贫民与建筑本身的施舍账簿、必须判定谁可接近的朝圣门槛、维持时辰颂唱的唱诗职务，以及仍有小家族觊觎的礼拜堂赞助权。罗马必须先决定这些职责如何分配，巴西利卡才能称得上是使徒真正运作的居所。
        zh_options:
        - 开启使徒职责名册。
      - stage: update
        event_id: 7318
        en_title: The Charge Is Divided
        en_desc: Under the sacred official's seal, the duties are entrusted one by one. Clerks are set over the relic inventory, sworn auditors take the alms ledger, gatekeepers are posted at the pilgrim threshold, cantors are assigned to the choir offices, and a chapel's patronage is granted or withheld from the families who petition for it. Each entrustment is a small charter in itself, and each can be honored or betrayed independently of the others.
        en_options:
        - Entrust the apostolic duties.
        zh_title: 职责的分授
        zh_desc: 在神圣官员的印信之下，各项职责被逐一托付。文书被派去管理圣髑清册，宣誓的稽核员接管施舍账簿，守门人被安置在朝圣门槛处，领唱者被分配到唱诗职务，而某座礼拜堂的赞助权则被授予或拒绝那些提出请求的家族。每一次托付本身都是一份小小的宪章，也都可能各自被恪守或背弃。
        zh_options:
        - 托付使徒职责。
      - stage: retry
        event_id: 7319
        en_title: Whispers Beneath the Dome
        en_desc: One of the entrusted duties falters under its own weight. The relic clerks cannot account for a reliquary, the alms ledger shows a suspicious gap, pilgrims complain of being turned away without cause, the choir offices fall into disorder, or a patron family is caught treating its chapel as a private fief. The basilica's claim to disciplined service is only as strong as the weakest duty left unanswered.
        en_options:
        - Discipline the lapse and restore the ledger.
        - Let the lapse stand and narrow the dedication's claim.
        zh_title: 穹顶下的低语
        zh_desc: 被托付的职责之一在自身的重压下开始动摇。圣髑文书说不清一件圣物匣的下落，施舍账簿出现可疑的亏空，朝圣者抱怨被无端拒之门外，唱诗职务陷入混乱，或某个赞助家族被发现把自家礼拜堂当成私产经营。巴西利卡对纪律化服务的宣称，其可信度取决于这最薄弱的一项职责能否得到回应。
        zh_options:
        - 惩戒此过失并恢复账目。
        - 对此过失听之任之，缩小落成的名义。
      - stage: resolve
        event_id: 7320
        en_title: The Apostolic Threshold Sealed
        en_desc: Relics accounted, alms recorded, pilgrims admitted in good order, the choir singing its hours, and every chapel's patronage settled, the basilica's duties close into a single working charter. Peter's tomb is no longer only a dome to be admired but a service the faithful can rely upon. Rome seals the threshold and lets the apostolic see stand open.
        en_options:
        - Seal the apostolic threshold.
        zh_title: 使徒门槛的封印
        zh_desc: 圣髑已清点，施舍已入账，朝圣者依序获准进入，唱诗班按时辰咏唱，每座礼拜堂的赞助权也已尘埃落定，巴西利卡的诸项职责至此汇成一份完整运作的宪章。彼得之墓不再只是供人瞻仰的穹顶，而是信众可以倚赖的一项服务。罗马封印这道门槛，让使徒宗座就此敞开。
        zh_options:
        - 封印使徒门槛。
