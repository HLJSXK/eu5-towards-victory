metadata:
  purpose: "Mechanic archetype registry for Unique Wonder Ritual Harness blueprint validation."
  generated_game_code: false
  safety_boundary: "Archetypes describe Harness-supported mechanism blueprints only; they may not write src or certify loadable EU5 syntax."
  status: "v1_mechanic_blueprints"

archetypes:
  - key: expedition_route_chain
    required_capabilities:
      - event_chain
      - route_gate
      - retry_branch
    allowed_node_kinds:
      - event
      - choice_event
      - retry_event
      - route_gate
      - incident_event
      - final_reward_dispatch
    required_variable_roles:
      - stage_state
      - route_state
    required_ui_components:
      - checklist
      - route_map
    required_listeners: []
    min_nodes: 4
    max_nodes: 24
    requires_retry_path: true
    requires_hidden_executor_handoff: false
    terminal_requires_capability: final_reward_handoff
    verification_tier: harness_v1_mechanic_blueprint
    may_write_src: false
    notes: "Route-driven expedition rituals with visible route state, branch retries, and a terminal reward handoff."

  - key: patronage_actor_assignment
    required_capabilities:
      - event_chain
      - actor_assignment
      - retry_branch
    allowed_node_kinds:
      - event
      - choice_event
      - retry_event
      - assignment_gate
      - final_reward_dispatch
    required_variable_roles:
      - stage_state
      - assigned_actor
    required_ui_components:
      - checklist
      - actor_slots
    required_listeners: []
    min_nodes: 4
    max_nodes: 24
    requires_retry_path: true
    requires_hidden_executor_handoff: false
    terminal_requires_capability: final_reward_handoff
    verification_tier: harness_v1_mechanic_blueprint
    may_write_src: false
    notes: "Patronage or office rituals where assigned characters drive visible ritual stages."

  - key: resource_accumulation_ritual
    required_capabilities:
      - event_chain
      - resource_gate
      - retry_branch
    allowed_node_kinds:
      - event
      - choice_event
      - retry_event
      - resource_gate
      - final_reward_dispatch
    required_variable_roles:
      - stage_state
      - resource_state
    required_ui_components:
      - checklist
      - material_stockpile
    required_listeners: []
    min_nodes: 4
    max_nodes: 24
    requires_retry_path: true
    requires_hidden_executor_handoff: false
    terminal_requires_capability: final_reward_handoff
    verification_tier: harness_v1_mechanic_blueprint
    may_write_src: false
