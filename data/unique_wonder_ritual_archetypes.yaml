      - incident_event
      - final_reward_dispatch
    required_variable_roles:
      - stage_state
      - route_state
    required_ui_components:
      - checklist
      - route_map
    required_listeners: []
    min_nodes: 4
    max_nodes: 24
    requires_retry_path: true
    requires_hidden_executor_handoff: false
    terminal_requires_capability: final_reward_handoff
    verification_tier: harness_v1_mechanic_blueprint
    may_write_src: false
    notes: "Route-driven expedition rituals with visible route state, branch retries, and a terminal reward handoff. Non-exclusive reference tag; additional validated node kinds are allowed."

