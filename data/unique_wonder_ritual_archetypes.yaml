metadata:
  purpose: "Reference archetype registry for Unique Wonder Ritual Harness blueprint validation."
  generated_game_code: false
  safety_boundary: "Archetypes describe optional, non-exclusive Harness projection patterns only; they may not write src, forbid custom ritual shapes, cap design_ir complexity, or certify loadable EU5 syntax."
  status: "v1_reference_archetypes"
  contract_mode: "non_exclusive_positive_requirements"
  custom_archetype_policy: "Specs may use custom_* archetype labels when node_graph.mechanic_signature.custom_archetype_statement explains the bespoke mechanism."
  design_fidelity_policy: "Archetype fit must never be used to flatten high-fidelity phases, tracked entity sets, selectors, risk branches, or UI feedback."

archetypes:
  - key: expedition_route_chain
    required_capabilities:
      - event_chain
      - route_gate
      - retry_branch
    allowed_node_kinds:
      - event
      - choice_event
      - retry_event
      - route_gate
      - incident_event
      - final_reward_dispatch
    required_variable_roles:
      - stage_state
      - route_state
    required_ui_components:
      - checklist
      - route_map
    required_listeners: []
    min_nodes: 4
    max_nodes: 24
    requires_retry_path: true
    requires_hidden_executor_handoff: false
    terminal_requires_capability: final_reward_handoff
    verification_tier: harness_v1_mechanic_blueprint
    may_write_src: false
    notes: "Route-driven expedition rituals with visible route state, branch retries, and a terminal reward handoff. Non-exclusive reference tag; additional validated node kinds are allowed."

  - key: patronage_actor_assignment
