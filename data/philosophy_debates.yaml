settings:
  seat_count: 5
  initial_progress: 50
  monthly_event_chance_weight: 10
  monthly_no_event_weight: 90
  defection_cooldown_months: 60
  crown_contribution_multiplier: 0.1
  base_group_contribution: 0.1
  estate_power_multiplier: 0.2
  variant_power_multiplier: 0.4
  artist_skill_multiplier: 0.2
  foreign_power_multiplier: 0.2
  great_scientist_adm_multiplier: 0.2

event_weights:
  join: 5
  leave: 1
  support_price_join: 1
  oppose_price_stay_out: 1
  quarrel: 1
  scientist_sways_support: 2
  scientist_angers_oppose: 2
  scientist_bargain_support: 1
  great_scientist_requests_seat: 1
  royal_appointment: 2
  neutral_decides: 1
  neutral_price_support: 1
  neutral_price_not_oppose: 1
  scientist_sways_neutral: 2
  scientist_angers_neutral: 2
  scientist_bargain_neutral: 1

prices:
  - key: scaled_gold_1
    effect:
      - "change_gold_effect = { scale = -1 }"
    loc:
      english: "scaled gold x1"
      simp_chinese: "缩放金钱x1"
  - key: scaled_gold_2
    effect:
      - "change_gold_effect = { scale = -2 }"
    loc:
      english: "scaled gold x2"
      simp_chinese: "缩放金钱x2"
  - key: prestige_10
    effect:
      - "add_prestige = -10"
    loc:
      english: "10 Prestige"
      simp_chinese: "10威望"
  - key: legitimacy_5
    effect:
      - "add_legitimacy = -5"
    loc:
      english: "5 Legitimacy"
      simp_chinese: "5正统性"
  - key: stability_7
    effect:
      - "add_stability = -7"
    loc:
      english: "7 Stability"
      simp_chinese: "7稳定度"

