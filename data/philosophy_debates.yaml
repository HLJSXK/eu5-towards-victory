action_triggers:
  meritocracy:
    positive:
      - hook: on_cabinet_assigned
        condition: appoint_high_skill_non_hereditary_cabinet_member
        chance: 25
        delta: 5
      - hook: on_bureaucracy_added
        condition: add_professional_bureaucracy
        chance: 25
        delta: 5
    negative:
      - hook: on_cabinet_removed
        condition: remove_high_skill_official
        chance: 25
        delta: -5
      - hook: on_reform_change
        condition: strengthen_hereditary_or_noble_privilege
        chance: 25
        delta: -5

  renaissance:
    positive:
      - hook: on_work_of_art_created
        condition: create_work_of_art
        chance: 25
        delta: 5
      - hook: building_completed
        condition: complete_art_university_court_or_cultural_building
        chance: 25
        delta: 5
    negative:
      - hook: on_work_of_art_looted
        condition: own_work_of_art_looted
        chance: 25
        delta: -5
      - hook: on_location_occupied
        condition: capital_or_cultural_center_occupied
        chance: 25
        delta: -5
      - hook: on_siege_won
        condition: capital_or_cultural_center_occupied
        chance: 25
        delta: -5

  banking:
