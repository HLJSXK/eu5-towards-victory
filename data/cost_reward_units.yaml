# Foundational cost/reward unit catalog for AI-assisted design across Towards Victory.
#
# This is base-layer data, not owned by or tied to any single mechanic. It was originally
# extracted from the Engineering Department Wonder Construction random-event system (see
# docs/design/Cost_Reward_Unit_Concepts.md), but is maintained independently: the wonder
# system's own data (data/wonder_construction_events.yaml) does not read from this file, and
# this file is not scoped to only what wonder events currently use. Other mechanics designed
# later are expected to look up a "1 unit" magnitude here directly.
#
# Five categories. Three are one-shot units, cutting by scope only (country/local/character) —
# there is no separate "cost" category: a cost is simply the negative of the matching
# country_reward/local_reward/character_reward value. Consumers that need a cost read the reward
# `value` and negate it themselves; this catalog does not store cost and reward as separate rows.
# `character_reward` covers effects applied to a character (e.g. a ruler, Great Engineer, or
# artist), not a country or a location — added because add_adm/add_dip/add_mil and
# add_artist_skill are the single most recurring one-shot effect pattern in the mod (used across
# 7+ event/effect files spanning Academy debate, Arts Exhibition, Research, Engineering
# Department, and Governor's House), more so than any individual country-scope stat.
#
# `country_reward.government_power` intentionally generalizes the wonder system's original
# `legitimacy` entry: EU5's real effect is `add_government_power`, which auto-resolves to
# whichever of legitimacy/republican_tradition/devotion/horde_unity/tribal_cohesion applies to the
# country's government type — using the specific `add_legitimacy` effect would only work for
# monarchies. The value (5) is unchanged from the original wonder-extracted `legitimacy` number.
#
# `country_reward.inflation` has inverted polarity versus every other entry: because lower
# inflation is the desirable direction, applying this catalog's stored positive `value` as a
# REWARD means REDUCING inflation (i.e. calling the real effect with a negative amount), and a
# COST means INCREASING inflation (a positive amount) — the opposite of every other row, where a
# reward adds the stored value and a cost subtracts it. Consumers must handle this row specially.
#
# The other two, country_modifier/local_modifier, are persistent modifier units — real EU5
# modifier keys, not one-shot effects. Numeric values are per-level increments a future multi-level
# mechanic would add per completed level; they can be negative when the real modifier is beneficial
# as a negative number (e.g. a cost-reduction modifier). The country list began as the exhaustive
# extraction of Engineering Department wonder values (country_modifier from
# data/wonder_base_modifiers.yaml, and local_modifier from data/wonder_final_buildings.yaml's
# final_local plus the local_cultural_tradition/local_cultural_influence baseline), then expanded
# with every current vanilla country-supported modifier used in the country-scoped static modifier
# blocks of reference_mods/3599735023. Types defined only by that reference mod and obsolete or
# unsupported fields are intentionally excluded. Imported numeric values use the smallest nonzero
# absolute source value after resolving vanilla script values; mixed-sign entries retain the
# current modifier metadata's beneficial direction. The country list also carries true/false
# boolean unlock units, which are unscaled rather than per-level values.
#
# `monthly_towards_axis` continues to represent every monthly_towards_* value-movement modifier
# as one reusable row rather than duplicating individual axes. It covers the 19 axes used by the
# wonder system and the 34 axes encountered in the imported reference source. Where the same real
# key is used at different magnitudes, one representative value is kept.
#
# Edit through the merged towards_victory_editor_web tool (scripts/towards_victory_editor.py).

