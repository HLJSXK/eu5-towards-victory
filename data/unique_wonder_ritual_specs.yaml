  design_ir:
    compiler_primitives:
    - public_credit_interfaces
    - charter_branch_fiscal_scaling
    - merchant_creditor_privilege_checks
    - per_pledge_ledger_rows_default_risk
    phases:
    - key: ledger_oath_opening
      gameplay_stage: Convene doge's officers, Anziani, creditors, notaries, mint masters, customs farmers, insurers, harbor scribes, and guards in the bank hall.
    - key: charter_branch
      gameplay_stage: Choose creditor privilege, crown supervision, or open merchant access as the public-credit charter.
    - key: credit_incident
      gameplay_stage: Resolve the first trust shock created by the charter, whether creditor overreach, crown distrust, or default risk.
    - key: public_credit_seal
      gameplay_stage: Seal the ledger, pledge tax streams, verify coin trust, and publish the charter at the harbor gate.
    player_proofs:
    - The player proves that debt ledgers, tax streams, minting, and merchant syndicates can become a public institution.
    - The player proves that trust is allocated by charter choice, not by passive fiscal progress.
    - The player proves that public credit can survive its first default or privilege crisis.
    tracked_entity_sets:
    - key: charter_options
      entity_type: charter_branch
      entities:
      - key: creditor_privilege
        display_name: Creditor Privilege Charter
