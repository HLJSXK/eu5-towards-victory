    blocked_by:
    - No source compiler for overland relay route certification is in scope for this round.
    - The new backend is intermediate-only and may_write_src false.
    fallback_if_unavailable: Keep Inca Royal Road at compiler_mapped with high-fidelity design_ir and no source generation.
