  event_ids:
  - id: 1004
    key: alhambra_opening
  - id: 1005
    key: alhambra_war_validation
  - id: 1006
    key: alhambra_treaty_branch
  - id: 1007
    key: alhambra_reward
  node_graph:
    model: design_projection_only_v1
    historical_mechanic: Capitulation palace treaty validated by a real war outcome around Granada.
    summary: The player proves that the Alhambra can turn military possession of Granada into courtly concord by sealing a capitulation treaty under war-pressure rather than by clicking a generic palace ceremony.
    mechanic_signature:
      wonder_specific_hook: The red palace, Gate of Justice, water courts, treaty rolls, translators, protected households, and foreign observers make the Alhambra a test of whether victory can become governed surrender.
      core_interaction_loop: The player opens the treaty court, waits for or checks a real war-validation window, chooses mercy, tribute, or deterrence clauses, and handles whether the palace looks protected or merely occupied.
      player_decision_pattern: Choices decide which settlement terms define the reward and whether defeated elites, royal treasury, envoys, artisans, or garrison officers absorb the cost.
      state_feedback_model: The incident log tracks the war validation and treaty crisis while the checklist tracks whether key clauses have been witnessed and preserved.
      failure_or_tension_model: A threatened palace, dishonored safe-conduct, or harsh settlement forces repair, hostage guarantees, or a humbled dedication with weaker diplomatic reach.
      reward_expression: The reward expresses prestige and diplomatic reputation earned from a visible, enforceable capitulation rather than raw conquest.
      reuse_risk_mitigation: This design belongs to Granada's surrender palace; ordinary palaces do not combine war outcome, protected court artistry, waterworks, symbolic keys, and foreign treaty witnesses.
    cadence_signature:
      cadence_type: war_validated
      cadence_rationale: The Alhambra's ritual power comes from a war or peace window where the palace proves itself when the victor can protect surrender terms before victory hardens into ordinary occupation.
      player_agency_model: The player times validation around a war outcome, keeps Granada controlled, and chooses which capitulation doctrine will be visible to foreign courts.
      non_monthly_triggers_or_reason: Non-monthly validation is the supported war listener or explicit war-outcome check plus the treaty branch event before reward handoff.
      pacing_failure_mode: The pacing fails if any war victory counts; design_ir preserves Granada-specific control, treaty clauses, water court integrity, and foreign witness evidence.
    listeners:
    - pre_winning_war
    - ending_war
    entry_node: alhambra_opening
    terminal_nodes:
    - alhambra_reward
    runtime_variables:
    - tv_wonder_alhambra_stage
    - tv_wonder_alhambra_war_validation
    - tv_wonder_alhambra_treaty_clause_status
    - tv_wonder_alhambra_reward_branch
    nodes:
    - key: alhambra_opening
      kind: event
      event_id: 1004
      player_visible: true
      next_nodes:
      - alhambra_war_validation
      failure_or_retry: false
      historical_anchor: Envoys assemble symbolic keys, translators, safe-conduct passes, and protected household lists in Granada.
    - key: alhambra_war_validation
      kind: listener_gate
      event_id: 1005
      player_visible: true
      next_nodes:
      - alhambra_treaty_branch
      failure_or_retry: false
      historical_anchor: The palace treaty waits for a real victory or peace window while the Alhambra remains controlled.
    - key: alhambra_treaty_branch
      kind: retry_event
      event_id: 1006
      player_visible: true
      next_nodes:
      - alhambra_reward
      failure_or_retry: true
      retry_target: alhambra_war_validation
      historical_anchor: The player chooses mercy, tribute, or deterrence and answers disputes over water, artisans, hostages, and protected elites.
    - key: alhambra_reward
      kind: final_reward_dispatch
      event_id: 1007
      player_visible: true
      next_nodes: []
      failure_or_retry: false
      historical_anchor: The treaty is read in the Hall of Ambassadors and the palace becomes a diplomatic proof of restrained conquest.
  design_ir:
    compiler_primitives:
    - war_outcome_capitulation_gate
    - granada_palace_control_treaty_checks
    - treaty_clause_ui_rows
    - settlement_branch_reward_scaling
    phases:
    - key: treaty_court_opening
      gameplay_stage: Assemble envoys, notaries, translators, symbolic keys, protected households, water overseers, guards, and foreign observers inside the palace.
    - key: war_validation_window
      gameplay_stage: Validate the rite during a real victory or peace window while Granada and the Alhambra remain controlled and unsacked.
    - key: clause_selection
      gameplay_stage: Choose mercy, tribute, or deterrence clauses that decide who is protected, paid, watched, or humiliated.
    - key: concord_or_humbled_dedication
      gameplay_stage: Resolve whether the settlement is witnessed as courtly concord or reduced to a narrower occupation dedication.
    player_proofs:
    - The player proves that war victory can preserve a conquered court instead of consuming it.
    - The player proves that treaty clauses, waterworks, artisans, protected households, and foreign audiences remain credible after surrender.
    - The player proves diplomatic reputation through enforceable restraint, not only through owning Granada.
    tracked_entity_sets:
    - key: treaty_clause_register
      entity_type: treaty_clause
      entities:
      - key: symbolic_keys
        display_name: Symbolic Keys Of Granada
      - key: protected_households
        display_name: Protected Households And Elites
      - key: artisan_rosters
        display_name: Artisans And Palace Workshops
      - key: acequia_water
        display_name: Acequia Water And Courts
      - key: safe_conducts
        display_name: Safe-Conduct Passes
      - key: foreign_copies
        display_name: Foreign Treaty Copies
      state_values:
      - unwritten
      - sworn
      - violated
      - witnessed
      - narrowed
      per_entity_state:
        status_variable_pattern: tv_wonder_alhambra_clause_<clause>_status
        witness_variable_pattern: tv_wonder_alhambra_clause_<clause>_witnessed
      selector: Select the treaty clause currently at risk during the capitulation court.
      ui_binding: checklist:treaty_clause_register should render one row per clause with sworn/violated/witnessed state.
    - key: palace_risk_points
      entity_type: palace_risk
      entities:
      - key: gate_of_justice
        display_name: Gate Of Justice
      - key: hall_of_ambassadors
        display_name: Hall Of Ambassadors
      - key: court_of_lions
        display_name: Court Of The Lions
      - key: water_channels
        display_name: Palace Water Channels
      - key: vega_overlook
        display_name: Walls Overlooking The Vega
      state_values:
      - secure
      - threatened
      - occupied
      - repaired
      per_entity_state:
        status_variable_pattern: tv_wonder_alhambra_risk_<point>_status
      selector: Select the palace risk point whose damage would discredit the treaty.
      ui_binding: incident_log:palace_risk_points should show visible crisis rows for threatened court spaces.
    selectors:
    - key: war_validation_selector
      selection_space: Supported pre_winning_war or ending_war windows where Granada remains controlled by the sponsor.
      projection_state: Preserved as alhambra_war_validation summary because source listener mapping is unresolved.
    - key: treaty_branch_selector
      selection_space: Mercy, tribute, or deterrence settlement doctrine with different clause and reward consequences.
      projection_state: Compressed into alhambra_treaty_branch for design_complete only.
    risk_branches:
    - key: dishonored_safe_conduct
      risk: A treaty branch violates protected households or safe-conduct passes, weakening diplomatic recognition.
      retry_or_failure: Repair the clause, grant hostages, or accept a prestige-only humbled dedication.
    - key: palace_water_disruption
      risk: The acequia or fountains fail, making preservation look false.
      retry_or_failure: Delay for repairs or complete with lower diplomatic reward.
    - key: harsh_occupation
      risk: Victory turns into coercive occupation before witnesses accept the terms.
      retry_or_failure: Return to the war-validation gate or seal a deterrence branch with diplomatic cost.
    player_actions:
    - Time the treaty court around a war victory or peace settlement while keeping Granada controlled.
    - Choose mercy, tribute, or deterrence as the treaty's visible doctrine.
    - Pay for repairs, hostages, translators, artisan protection, or safe-conduct guarantees when a clause is challenged.
    map_scope_evidence:
    - Fixed site is Granada; later mapping must verify owner/control, occupation, siege, local unrest, and final Alhambra building evidence.
    - War validation needs country-war scope evidence plus location-specific Granada control rather than a generic victory flag.
    ui_feedback_model:
      components:
      - incident_log
      - checklist
      repeated_rows: One checklist row per treaty clause and one incident row per palace risk point.
      per_entity_status: Clauses need sworn/violated/witnessed/narrowed state; risk points need secure/threatened/occupied/repaired state.
      current_projection: The design-only node_graph compresses rows into war_validation and treaty_clause_status variables.
    uniqueness_constraints:
    - The loop must remain about Granada's capitulation palace, symbolic keys, water courts, protected elites, and foreign witnesses.
    - A normal war victory is not enough; the palace must remain credible as preserved courtly order.
    - The player should not be rewarded for sacking or flattening the palace's negotiated identity.
    projection_notes: >
      Preserve war-outcome validation, treaty clauses, palace risk points, and branch-specific reward semantics in design_ir. Compress them in node_graph into four planning events and summary variables. Replace per-clause and per-court rows with incident_log/checklist summaries for design_complete only. Drop no war or treaty primitive; unresolved listener, clause, and scaling gaps remain blockers for compiler_mapped or source codegen.
