  design_ir:
    compiler_primitives:
    - sacred_official_character_selector
    - clergy_state_faith_eligibility_checks
    - actor_quality_incident_reward_mapping
    - relic_alms_pilgrim_duty_rows
    phases:
    - key: threshold_preparation
      gameplay_stage: Prepare the basilica doors, high altar, tomb confession, sacristy, treasury, choir stalls, hostels, relic inventories, and alms ledgers.
    - key: sacred_official_assignment
      gameplay_stage: Assign the official whose role will define whether the dedication is clerical, pastoral, administrative, or patronage-driven.
    - key: first_assignment_scandal
      gameplay_stage: Resolve the relic, alms, pilgrim-access, choir, or patronage dispute revealed by that official.
    - key: apostolic_dedication
      gameplay_stage: Open the threshold after duties are accepted and the official's authority has survived the first dispute.
    player_proofs:
    - The player proves that Rome's apostolic basilica is a functioning institution, not just a dome over a tomb.
    - The player proves that clergy, relic custodians, alms officers, pilgrims, and artists can answer to a credible sacred official.
    - The player proves that true-faith tolerance and clergy satisfaction come from disciplined service rather than unchecked clerical privilege.
    tracked_entity_sets:
    - key: sacred_official_candidates
      entity_type: actor_candidate
      entities:
      - key: cardinal_administrator
        display_name: Cardinal Administrator
      - key: diocesan_bishop
        display_name: Diocesan Bishop
      - key: relic_custodian
        display_name: Relic Custodian
      - key: alms_prefect
        display_name: Alms Prefect
      - key: artist_canon
        display_name: Artist Canon
      state_values:
      - available
      - assigned
      - factional
      - discredited
      - vindicated
      per_entity_state:
        status_variable_pattern: tv_wonder_st_peters_basilica_candidate_<candidate>_status
        quality_variable_pattern: tv_wonder_st_peters_basilica_candidate_<candidate>_quality
      selector: Select the sacred official whose role and quality shape the dedication incident.
      ui_binding: actor_slots:sacred_official_candidates should show the selected official, role, quality, and factional risk.
    - key: apostolic_service_duties
      entity_type: service_duty
      entities:
      - key: relic_inventory
        display_name: Relic Inventory
      - key: alms_ledger
        display_name: Alms Ledger
      - key: pilgrim_threshold
        display_name: Pilgrim Threshold
      - key: choir_offices
        display_name: Choir Offices
      - key: chapel_patronage
        display_name: Chapel Patronage
      state_values:
      - unopened
      - entrusted
      - scandalized
      - disciplined
      - dedicated
      per_entity_state:
        status_variable_pattern: tv_wonder_st_peters_basilica_duty_<duty>_status
      selector: Select the service duty challenged by the assigned official's weakness or faction.
      ui_binding: incident_log:apostolic_service_duties should render one incident row per duty with scandal and resolution status.
    selectors:
    - key: sacred_official_selector
      selection_space: Candidate clergy or sacred officials with role, quality, estate alignment, and scandal risk.
      projection_state: Compressed into assigned_official and official_quality variables until character selector support is mapped.
    - key: duty_incident_selector
      selection_space: Relic, alms, pilgrim access, choir, or patronage duty challenged by the selected official.
      projection_state: Preserved in design_ir and summarized by incident_status in the current node_graph.
    risk_branches:
    - key: relic_scandal
      risk: The official mishandles relic inventories or tomb access, making the dedication look corrupt.
      retry_or_failure: Reassign the official, audit relics, or accept a narrower clergy satisfaction reward.
    - key: alms_dispute
      risk: Alms officers and pilgrims accuse the basilica of buying splendor with poor relief.
      retry_or_failure: Redirect one-time reward into alms or take an incident penalty before final dedication.
    - key: factional_official
      risk: A strong candidate belongs to a faction that wants patronage control over chapels or offerings.
      retry_or_failure: Keep the candidate for stronger service but accept estate tension, or retry with a weaker neutral official.
    player_actions:
    - Select the sacred official and accept their quality, role, and factional cost.
    - Resolve the first scandal through reassignment, audit, alms redistribution, or a reduced dedication.
    - Seal clergy obligations only after the actor's authority has survived visible pressure.
    map_scope_evidence:
    - Fixed site is Rome; later mapping must verify ownership/control, final Saint Peter's building presence, pilgrim access, and religious/clergy participation.
    - Candidate actors may be characters, generated officials, or semantic role variables; source scope support must be searched before compiler mapping.
    ui_feedback_model:
      components:
      - actor_slots
      - incident_log
      repeated_rows: Actor slot for the selected official plus incident rows for service duties.
      per_entity_status: Candidate rows need available/assigned/factional/discredited/vindicated state; duties need unopened/entrusted/scandalized/disciplined/dedicated state.
      current_projection: The design-only node_graph compresses candidate rows into assigned_official and official_quality, and duty rows into incident_status.
    uniqueness_constraints:
    - The actor must be a sacred official tied to Peter's tomb, not a generic scholar or engineer.
    - Relics, alms, pilgrim thresholds, choir offices, and chapel patronage are required design surfaces.
    - Clergy satisfaction is earned through disciplined service, not a free estate privilege.
    projection_notes: >
      Preserve sacred official candidates, actor quality, factional risk, branch reward semantics, and apostolic service duty rows in design_ir. The compiler_mapped node_graph preserves the four decisive beats--threshold opening, sacred official assignment, scandal retry, and reward handoff--as a strong Harness state machine. It compresses candidate rows and per-duty incident rows into assigned_official, official_quality, incident_status, duty_status, and reward_branch summary variables only for the current Harness projection. Replace no selector, tracked set, per-duty UI requirement, or branch consequence; unresolved character, clergy, row, and actor-to-incident primitives remain in compiler_gap_ledger and block all source-codegen statuses.
