    design_semantics: Preserve the Inca Royal Road as a Picchu-headed overland relay route with a named endpoint, waypoints, stone road segments, tambos, and rope bridge checkpoints.
    required_game_interfaces:
    - route endpoint and waypoint authoring data
    - overland route_map UI summary
    - intermediate route state variables
    codebase_evidence:
    - capability:overland_relay_route_certification_backend
