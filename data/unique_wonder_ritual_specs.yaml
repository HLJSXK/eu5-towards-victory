    blocked_by: []
    fallback_if_unavailable: Keep the overland route set in design_ir and project it as route_map summary only.
  - primitive: road_segment_tambo_bridge_status_projection
    design_semantics: Preserve per-segment stone road, tambo supply, rope bridge, endpoint, rerouted, and domestic-only status without flattening the relay route into one anonymous counter.
    required_game_interfaces:
    - per-segment route status projection
    - repeated route_map rows
    - summary runtime variables
    codebase_evidence:
    - capability:overland_relay_route_certification_backend
    - capability:repeated_entity_row_checklist_incident_log_backend
    verification_status: backend_ready
    search_questions:
    - Covered by intermediate backend contracts; no loadable repeated-row GUI source is emitted.
    blocked_by: []
    fallback_if_unavailable: Preserve all road, tambo, bridge, and endpoint rows in design_ir and summarize them in the node graph.
  - primitive: runner_relay_message_proof
    design_semantics: Preserve runner-carried relay message state, including sealed quipu, chasqui handoffs, bridge handoff, tambo exchange, endpoint delivery, delay, and domestic-only proof.
    required_game_interfaces:
    - relay message state projection
    - route_map row summary
    - player-facing tooltip summary
    codebase_evidence:
    - capability:overland_relay_route_certification_backend
    verification_status: backend_ready
    search_questions:
    - Covered by intermediate overland relay backend contract; exact runner or quipu source syntax is not generated.
    blocked_by: []
    fallback_if_unavailable: Keep relay message handoffs as design_ir route semantics and summarize them through relay_message_status.
  - primitive: relay_incident_reroute_domestic_fallback
    design_semantics: Preserve bridge failure, missing tambo supply, runner delay, unaffordable repair, awkward endpoint, retry, reroute, and domestic-only fallback branch semantics.
    required_game_interfaces:
    - incident_log summary
    - retry branch
    - route state mutation stubs
    codebase_evidence:
    - capability:retry_branch
    - capability:overland_relay_route_certification_backend
    - capability:repeated_entity_row_checklist_incident_log_backend
    verification_status: backend_ready
    search_questions:
    - Covered by intermediate backend and retry contracts; no loadable incident event source is emitted.
    blocked_by: []
    fallback_if_unavailable: Keep incident, reroute, and fallback semantics in design_ir and retain a retry/domestic-only projection node.
  - primitive: route_map_incident_log_projection
    design_semantics: Preserve route_map and incident_log UI intent for road rows, bridge checkpoints, tambos, runner handoffs, incident rows, reroutes, and domestic-only fallback state.
    required_game_interfaces:
    - route_map UI rows
    - incident_log UI rows
    - per-entity status projection
    codebase_evidence:
    - capability:overland_relay_route_certification_backend
    - capability:repeated_entity_row_checklist_incident_log_backend
    verification_status: backend_ready
    search_questions:
    - Covered by intermediate UI summary contracts; no loadable GUI row source is generated.
    blocked_by: []
    fallback_if_unavailable: Use route_map and incident_log summaries while preserving per-row design_ir.
  - primitive: relay_proof_final_reward_handoff
    design_semantics: Hand full relay proof or explicit domestic-only fallback to the existing Inca finalization reward path.
    required_game_interfaces:
    - final_reward_dispatch projection
    - existing Inca finalization visible effect
    - existing hidden finalization cleanup/broadcast effect
    codebase_evidence:
    - capability:final_reward_handoff
    - data/index/scripted_effects.txt:tv_wonder_unique_inca_royal_road_finalization_visible_effect
    - data/index/scripted_effects.txt:tv_wonder_unique_inca_royal_road_style_1_finalization_hidden_effect
    - src/in_game/events/tv_wonder_finalization_events.txt:Inca inauguration option calls construct_final_building and finalization_visible_effect
    verification_status: backend_ready
    search_questions:
    - Covered by final reward handoff contract and existing finalization evidence; no new reward source is generated.
    blocked_by: []
    fallback_if_unavailable: Leave the reward as the existing finalization path and keep Inca relay proof as design metadata.
  - primitive: source_compiler_overland_relay_route_generation
    design_semantics: A future source compiler would expand overland route endpoints, road segment selectors, tambo supply gates, rope bridge checkpoints, runner message handoffs, repeated route_map rows, incident_log rows, reroute, and domestic-only effects into loadable EU5 source.
    required_game_interfaces:
    - source compiler overland route-set expansion
    - loadable event/effect generation
    - loadable Engineering Department GUI row generation
    codebase_evidence:
    - data/unique_wonder_ritual_capabilities.yaml:overland_relay_route_certification_backend is intermediate-only and may_write_src false.
    - scripts/wonder_unique_rituals/pharos.py manually generates route selectors, route status projection, and route rows for Pharos as evidence of a hand-authored route pattern only.
