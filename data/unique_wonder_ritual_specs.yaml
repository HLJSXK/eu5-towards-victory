  design_ir:
    compiler_primitives:
    - war_outcome_capitulation_gate
    - granada_palace_control_treaty_checks
    - treaty_clause_ui_rows
    - settlement_branch_reward_scaling
    phases:
    - key: treaty_court_opening
      gameplay_stage: Assemble envoys, notaries, translators, symbolic keys, protected households, water overseers, guards, and foreign observers inside the palace.
    - key: war_validation_window
      gameplay_stage: Validate the rite during a real victory or peace window while Granada and the Alhambra remain controlled and unsacked.
    - key: clause_selection
      gameplay_stage: Choose mercy, tribute, or deterrence clauses that decide who is protected, paid, watched, or humiliated.
    - key: concord_or_humbled_dedication
      gameplay_stage: Resolve whether the settlement is witnessed as courtly concord or reduced to a narrower occupation dedication.
    player_proofs:
    - The player proves that war victory can preserve a conquered court instead of consuming it.
    - The player proves that treaty clauses, waterworks, artisans, protected households, and foreign audiences remain credible after surrender.
    - The player proves diplomatic reputation through enforceable restraint, not only through owning Granada.
    tracked_entity_sets:
    - key: treaty_clause_register
      entity_type: treaty_clause
      entities:
      - key: symbolic_keys
        display_name: Symbolic Keys Of Granada
      - key: protected_households
        display_name: Protected Households And Elites
      - key: artisan_rosters
        display_name: Artisans And Palace Workshops
      - key: acequia_water
        display_name: Acequia Water And Courts
      - key: safe_conducts
        display_name: Safe-Conduct Passes
      - key: foreign_copies
        display_name: Foreign Treaty Copies
      state_values:
      - unwritten
      - sworn
      - violated
      - witnessed
      - narrowed
      per_entity_state:
        status_variable_pattern: tv_wonder_alhambra_clause_<clause>_status
        witness_variable_pattern: tv_wonder_alhambra_clause_<clause>_witnessed
      selector: Select the treaty clause currently at risk during the capitulation court.
      ui_binding: checklist:treaty_clause_register should render one row per clause with sworn/violated/witnessed state.
    - key: palace_risk_points
      entity_type: palace_risk
      entities:
      - key: gate_of_justice
        display_name: Gate Of Justice
      - key: hall_of_ambassadors
        display_name: Hall Of Ambassadors
      - key: court_of_lions
        display_name: Court Of The Lions
      - key: water_channels
        display_name: Palace Water Channels
      - key: vega_overlook
        display_name: Walls Overlooking The Vega
      state_values:
      - secure
      - threatened
      - occupied
      - repaired
      per_entity_state:
        status_variable_pattern: tv_wonder_alhambra_risk_<point>_status
      selector: Select the palace risk point whose damage would discredit the treaty.
      ui_binding: incident_log:palace_risk_points should show visible crisis rows for threatened court spaces.
    selectors:
    - key: war_validation_selector
      selection_space: Supported pre_winning_war or ending_war windows where Granada remains controlled by the sponsor.
      projection_state: Preserved as alhambra_war_validation summary because source listener mapping is unresolved.
    - key: treaty_branch_selector
      selection_space: Mercy, tribute, or deterrence settlement doctrine with different clause and reward consequences.
      projection_state: Compressed into alhambra_treaty_branch for design_complete only.
    risk_branches:
    - key: dishonored_safe_conduct
      risk: A treaty branch violates protected households or safe-conduct passes, weakening diplomatic recognition.
      retry_or_failure: Repair the clause, grant hostages, or accept a prestige-only humbled dedication.
    - key: palace_water_disruption
      risk: The acequia or fountains fail, making preservation look false.
      retry_or_failure: Delay for repairs or complete with lower diplomatic reward.
    - key: harsh_occupation
      risk: Victory turns into coercive occupation before witnesses accept the terms.
      retry_or_failure: Return to the war-validation gate or seal a deterrence branch with diplomatic cost.
    player_actions:
    - Time the treaty court around a war victory or peace settlement while keeping Granada controlled.
    - Choose mercy, tribute, or deterrence as the treaty's visible doctrine.
    - Pay for repairs, hostages, translators, artisan protection, or safe-conduct guarantees when a clause is challenged.
    map_scope_evidence:
    - Fixed site is Granada; later mapping must verify owner/control, occupation, siege, local unrest, and final Alhambra building evidence.
    - War validation needs country-war scope evidence plus location-specific Granada control rather than a generic victory flag.
    ui_feedback_model:
      components:
      - incident_log
      - checklist
      repeated_rows: One checklist row per treaty clause and one incident row per palace risk point.
      per_entity_status: Clauses need sworn/violated/witnessed/narrowed state; risk points need secure/threatened/occupied/repaired state.
      current_projection: The current source_codegen_ready node_graph is still an intermediate-only strong Harness DSL projection; it preserves war_validation, treaty_clause_status, palace_risk_status, and reward_branch summary variables while per-clause and per-risk rows remain authoritative in design_ir.
    uniqueness_constraints:
    - The loop must remain about Granada's capitulation palace, symbolic keys, water courts, protected elites, and foreign witnesses.
    - A normal war victory is not enough; the palace must remain credible as preserved courtly order.
    - The player should not be rewarded for sacking or flattening the palace's negotiated identity.
    projection_notes: |
      Preserve war-outcome validation, treaty clauses, palace risk points, and branch-specific reward semantics in design_ir. Project them into a source_codegen_ready strong DSL graph with four planning events, listener/state contracts, checklist and incident summary variables, branch reward state, actions, checks, and UI bindings. The listener, fixed-site integrity/control-pressure, repeated-row, and branch-scaling primitives have intermediate backend evidence, but loadable source writers and real GUI row expansion remain unresolved. Drop no war, treaty, palace-risk, or reward primitive.
  compiler_gap_ledger:
  - primitive: war_outcome_capitulation_gate
    design_semantics: Validate the rite only during a supported war or peace outcome window where Granada remains controlled and the palace is not discredited.
    required_game_interfaces:
    - pre_winning_war listener
    - ending_war listener
    - location ownership/control checks
