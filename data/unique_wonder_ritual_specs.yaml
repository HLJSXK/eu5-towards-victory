    phases:
    - key: declare_four_quarters_relay_message
      gameplay_stage: Officials at Picchu knot a quipu message and name the first relay line that must prove the Four Quarters can be joined by road.
      entry_condition: The Inca Royal Road Network has reached its unique ritual moment.
      exit_condition: The route map records Picchu as road head and exposes the endpoint, segment, bridge, tambo, and runner handoff checks.
    - key: certify_road_segment_tambo_and_bridge
      gameplay_stage: Chasqui runners and road officials certify stone roads, a rope bridge checkpoint, stocked tambos, qollqa supply, and the selected route endpoint.
      entry_condition: The relay message is sealed and at least one route waypoint still lacks road, bridge, supply, or runner proof.
      exit_condition: The active route is certified, blocked by an incident, or narrowed toward a domestic-only relay.
    - key: resolve_relay_incident_or_reroute
      gameplay_stage: A bridge failure, missing tambo supply, runner delay, unaffordable repair, or awkward endpoint route is repaired, rerouted, or accepted as a weaker domestic proof.
      entry_condition: A route incident is recorded before the message can arrive with full prestige.
      exit_condition: The route is retried with repaired support, rerouted to another certified segment, or marked domestic-only.
    - key: handoff_relay_reward
      gameplay_stage: The final runner presents the relay message and officials hand the certified or domestic-only relay proof to the Full Relay Line Dispatch reward path.
      entry_condition: The message has arrived or the fallback is explicit.
      exit_condition: The existing finalization visible and hidden reward effects remain the only source-level reward handoff.
    player_proofs:
    - Prove the Royal Road can move a runner-carried quipu message through Andean terrain rather than merely claim a completed road.
    - Prove named stone road segments, tambos, rope bridge checkpoints, runner handoffs, and an endpoint remain visible route state.
    - Prove bridge failure, missing tambo supply, runner delay, unaffordable repair, and awkward routes can produce reroute or domestic-only fallback decisions.
    - Prove final rewards remain a handoff to the existing Inca finalization path instead of new loadable source generated by the Harness.
