- identity:
    id: 103
    key: unique_dome_of_the_rock
    base_key: sky_dome_grand_temple
    location: jerusalem
    runtime_prefix: tv_wonder_dome_of_the_rock
    status: design_complete
  event_ids:
  - id: 1000
    key: dome_opening
  - id: 1001
    key: dome_compact
  - id: 1002
    key: dome_settlement
  - id: 1003
    key: dome_reward
  node_graph:
    model: design_projection_only_v1
    historical_mechanic: Sanctuary custody covenant over Jerusalem's sacred platform.
    summary: The player proves that the Dome can make sovereignty visible as guarded custody, not conquest, by settling access rules among jurists, guards, pilgrims, local notables, and supervised witnesses.
    mechanic_signature:
      wonder_specific_hook: The golden dome over the Rock makes sovereignty public only when the sponsor can publish access rules that bind guards, jurists, pilgrims, endowment officers, and local communities on the Jerusalem platform.
      core_interaction_loop: The player opens a custody covenant, chooses the compact that governs gates and pilgrim access, resolves a bounded sanctuary dispute, and accepts a final custody settlement rather than waiting through a generic monthly dedication.
      player_decision_pattern: Choices trade visible sovereignty, tolerant access, guard discipline, and diplomatic witnesses; failure pressure comes from pilgrim rejection or military overreach rather than from elapsed time.
      state_feedback_model: The incident log records the compact and dispute outcome while the checklist records whether access groups and custody duties have recognized the covenant.
      failure_or_tension_model: Overbearing guards or rejected witnesses send the rite back to a calmer compact or a reduced proclamation that preserves order but loses diplomatic reach.
      reward_expression: The reward expresses lawful custody through tolerance of the state faith and diplomatic reputation, with a local memory for protected platform access.
      reuse_risk_mitigation: This loop depends on the Rock, Jerusalem gates, intercommunal access, and visible custody; a generic sky-dome temple cannot reuse it without losing the contested sanctuary sovereignty proof.
    cadence_signature:
      cadence_type: event_driven
      cadence_rationale: Event-driven pacing fits because the decisive act is a public covenant and its follow-up dispute, not a progress bar; each event changes who accepts custody of the sanctuary.
      player_agency_model: The player chooses the access compact, decides how to answer opposition, and determines whether sovereignty is shown as guarded tolerance or narrower control.
      non_monthly_triggers_or_reason: Non-monthly validation is the visible compact choice and the settlement event that resolves pilgrim, guard, and witness acceptance before reward handoff.
      pacing_failure_mode: The pacing fails if the covenant becomes flavor over a standard event chain, so the tracked access groups and risk branches remain in design_ir even though the projection compresses them.
    listeners: []
    entry_node: dome_opening
    terminal_nodes:
    - dome_reward
    runtime_variables:
    - tv_wonder_dome_of_the_rock_stage
    - tv_wonder_dome_of_the_rock_compact_status
    - tv_wonder_dome_of_the_rock_opposition_pressure
    - tv_wonder_dome_of_the_rock_reward_branch
    nodes:
    - key: dome_opening
      kind: event
      event_id: 1000
      player_visible: true
      next_nodes:
      - dome_compact
      failure_or_retry: false
      historical_anchor: The commissioner convenes custodians at the Rock before the access covenant is read.
    - key: dome_compact
      kind: choice_event
      event_id: 1001
      player_visible: true
      next_nodes:
      - dome_settlement
      failure_or_retry: false
      historical_anchor: Gate wardens, judges, pilgrims, and witnesses accept different compact terms.
    - key: dome_settlement
      kind: retry_event
      event_id: 1002
      player_visible: true
      next_nodes:
      - dome_reward
      failure_or_retry: true
      retry_target: dome_compact
      historical_anchor: Pilgrims or guards challenge the compact and force reconciliation, suppression, or a narrower settlement.
    - key: dome_reward
      kind: final_reward_dispatch
      event_id: 1003
      player_visible: true
      next_nodes: []
      failure_or_retry: false
      historical_anchor: The custody covenant is sealed on the platform and the Dome becomes a recognized sanctuary of ordered sovereignty.
  design_ir:
    compiler_primitives:
    - sanctuary_access_compact_rows
    - bounded_sanctuary_opposition_scope
    - interfaith_witness_guard_overreach_branch
    - jerusalem_sacred_site_ui_evidence
    phases:
    - key: custody_opening
      gameplay_stage: Convene the ruler's commissioner, religious judge, gate wardens, reciters, local notables, and supervised witnesses on the Jerusalem platform.
    - key: access_compact
      gameplay_stage: Choose whether the covenant privileges disciplined guard custody, broad pilgrim access, or jurist-led public rules.
    - key: contested_settlement
      gameplay_stage: Resolve rejection by pilgrims, overreach by guards, or witness suspicion without turning the sanctuary into a battlefield.
    - key: covenant_seal
      gameplay_stage: Seal the access rules, endowment duties, and threshold discipline as the final public proof.
    player_proofs:
    - The player proves control of Jerusalem as lawful custody rather than ordinary conquest.
    - The player proves that soldiers, jurists, pilgrims, and local communities can obey one platform rule.
    - The player proves diplomatic credibility by allowing witnesses to understand access without surrendering sovereignty.
    tracked_entity_sets:
    - key: sanctuary_access_groups
      entity_type: access_group
      entities:
      - key: gate_wardens
        display_name: Platform Gate Wardens
      - key: religious_jurists
        display_name: State-Faith Jurists
      - key: pilgrim_caravans
        display_name: Visiting Pilgrim Groups
      - key: local_notables
        display_name: Jerusalem Local Notables
      - key: supervised_witnesses
        display_name: Supervised Intercommunal Witnesses
      state_values:
      - unbound
      - accepts_compact
      - contests_access
      - overawed_by_guards
      - recognizes_custody
      per_entity_state:
        status_variable_pattern: tv_wonder_dome_of_the_rock_access_<group>_status
        pressure_variable_pattern: tv_wonder_dome_of_the_rock_access_<group>_pressure
      selector: Select the access group whose acceptance or objection currently defines the covenant crisis.
      ui_binding: incident_log:sanctuary_access_groups should render one row per access group with compact and pressure state.
    - key: custody_duties
      entity_type: sanctuary_duty
      entities:
      - key: gate_keys
        display_name: Gate Keys And Watch Lists
      - key: cisterns
        display_name: Cisterns And Water Carriers
      - key: lamps
        display_name: Dome Lamps And Inscriptions
      - key: endowment_deeds
        display_name: Endowment Deeds And Scribes
      - key: pilgrim_routes
        display_name: Guarded Pilgrim Routes
      state_values:
      - unchecked
      - entrusted
      - disputed
      - sealed
      per_entity_state:
        status_variable_pattern: tv_wonder_dome_of_the_rock_duty_<duty>_status
      selector: Select the duty whose failure would make custody look like plunder rather than stewardship.
      ui_binding: checklist:custody_duties should show each duty as unchecked, entrusted, disputed, or sealed.
    selectors:
    - key: access_compact_selector
      selection_space: guard discipline, jurist proclamation, pilgrim access, and witnessed tolerance compact options.
      projection_state: Compressed into dome_compact in the current design-only node graph.
    - key: contested_group_selector
      selection_space: The access group or custody duty currently causing sanctuary pressure.
      projection_state: Preserved in design_ir only; the node_graph summarizes it as dome_settlement.
    risk_branches:
    - key: guard_overreach
      risk: Guards treat custody as occupation, raising opposition pressure and forcing reconciliation or a narrower proclamation.
      retry_or_failure: Retry the compact with stricter threshold discipline or accept weaker diplomatic recognition.
    - key: pilgrim_rejection
      risk: Pilgrims or local notables reject rules that feel like exclusion.
      retry_or_failure: Reopen access terms or complete with reduced tolerance expression.
    - key: witness_suspicion
      risk: Supervised witnesses report coercion instead of lawful access.
      retry_or_failure: Add jurist oversight or lose part of the diplomatic reward.
    player_actions:
    - Choose the custody compact that defines who holds keys, reads rules, and escorts pilgrims.
    - Spend legitimacy, clergy goodwill, or diplomatic capital to calm a contested access group.
    - Accept a narrower sovereign proclamation when broad witnessed access is too risky.
    map_scope_evidence:
    - Fixed site is Jerusalem, and the design must preserve location ownership/control, platform building presence, and local unrest evidence before implementation.
    - Access groups refer to location-local sanctuary participants and country-level diplomatic witnesses; later mapping must decide which scopes can be real.
    ui_feedback_model:
      components:
      - incident_log
      - checklist
      repeated_rows: One row per sanctuary access group plus one checklist row per custody duty.
      per_entity_status: Each access group needs compact acceptance and pressure status; each custody duty needs entrusted/disputed/sealed status.
      current_projection: The design-only node_graph compresses these rows into compact_status and opposition_pressure variables.
    uniqueness_constraints:
    - The Rock is the sacred object; the ritual is about visible custody of a contested platform, not a generic dome dedication.
    - Jerusalem access rules, guard thresholds, endowment deeds, cisterns, and witnesses are mandatory design surfaces.
    - Conquest cannot speed the rite; sovereignty is proven by restraint and recognized access.
    projection_notes: >
      Preserve the full access-group and custody-duty tracked sets in design_ir. Compress them in the current node_graph into four player-visible planning nodes and two summary variables. Replace per-row UI with incident_log/checklist summaries for the design_complete layer only. Drop no historical primitive from the spec; unresolved rows remain in compiler_gap_ledger and block any source-codegen readiness.
  compiler_gap_ledger:
  - primitive: sanctuary_access_compact_rows
    design_semantics: Render and update per-group compact status for gate wardens, jurists, pilgrim caravans, local notables, and supervised witnesses.
    required_game_interfaces:
