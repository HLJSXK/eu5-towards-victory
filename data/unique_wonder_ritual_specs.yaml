    risk_branches:
    - key: broken_pilgrim_link
      risk: A trench passage, village approach, or church-to-church link fails, proving the sacred geography is not yet usable by ordinary pilgrims.
      player_response: Repair and retry the route certification, or accept a local-only circuit that preserves sanctity while losing wider route recognition.
    - key: missing_offering
      risk: Bread, water, lamps, cross guards, or recognition tokens are missing at a waypoint.
      player_response: Spend resources or substitute a narrower local offering, which can push the route toward the local-only fallback.
    - key: recognition_dispute
      risk: Pilgrims reach the endpoint but outside communities do not yet recognize the carved route as a New Jerusalem proof.
      player_response: Re-run waypoint recognition or complete the reward handoff with reduced external recognition preserved in design_ir.
    player_actions:
    - Open the New Jerusalem route at Lalibela instead of confirming a one-click ceremony.
    - Certify named church waypoints, route endpoint, offering readiness, and recognition proof.
    - Resolve broken pilgrim links or missing offerings through repair/retry or local-only fallback.
    - Hand off the recognized or locally contained pilgrimage proof to the existing finalization reward path.
    map_scope_evidence:
    - Lalibela is the fixed wonder location and the New Jerusalem circuit is local to the rock-hewn church complex.
    - Pharos provides existing manual evidence that named route sets, per-route status variables, active route selection, and route-map GUI rows can be preserved by Harness design_ir without generic flattening.
    - data/index/scripted_triggers.txt lists Pharos per-route controlled, basing, pending, selected, and has-owner triggers as route-ledger evidence; it does not expose a generic pilgrimage route compiler.
    - data/index/scripted_effects.txt lists Lalibela finalization visible/hidden effects and the shared finalization reward effects used for the final handoff.
    ui_feedback_model:
      components:
      - route_map
      - incident_log
      - material_stockpile
      route_map: Five New Jerusalem waypoint rows show pending, supplied, recognized, broken-link, or local-only state.
      incident_log: Route incidents record broken pilgrim links, missing offerings, recognition disputes, retry choices, and the local-only fallback.
      material_stockpile: Offering readiness is summarized as bread, water, lamp, cross-guard, and village-recognition support rather than loadable resource script.
      repeated_rows: The design requires one row per church waypoint and one incident/offering status line when a route problem appears.
      per_entity_status: Each waypoint keeps separate route, offering, recognition, and incident state in design_ir.
      current_projection: The compiler_mapped node_graph compresses church waypoints into route_status, offerings into offering_status, route problems into incident_state, and recognition or local-only proof into recognition_proof while preserving all rows in design_ir.
    uniqueness_constraints:
    - Lalibela's proof is spatial: churches cut downward from rock replace Jerusalem's sacred geography with a walkable highland route.
    - The route endpoint and waypoints are church-to-church passages inside one carved holy city, not maritime lanes, roads, or ordinary pilgrim hospitality.
    - Broken-link and missing-offering incidents matter because a carved city cannot claim wider recognition if pilgrims cannot descend, eat, carry crosses, and leave with proof.
    - The local-only fallback preserves sanctity while explicitly losing wider route recognition, which keeps the mechanism distinct from a generic festival or route counter.
    projection_notes: The current compiler_mapped node_graph is an intermediate-only strong DSL projection. It preserves New Jerusalem route, route endpoint, named waypoint, offering, recognition proof, incident, local-only fallback, route_map row/status, incident_log, and final reward handoff semantics in design_ir, but compresses repeated waypoint rows and offering rows into summary runtime variables until a future source compiler can generate loadable route state, selectors, GUI rows, and event/effect source.
