    historical_mechanic: Rock-hewn New Jerusalem pilgrimage certification through Lalibela's carved churches, offerings, pilgrim route proof, and local-only fallback.
    summary: The player traces a New Jerusalem route through Lalibela's rock-hewn churches, proves pilgrims can move between waypoints, supplies offerings and lodging, handles a broken pilgrim link or missing offering, and hands recognized pilgrimage proof to the existing final reward path.
    mechanic_signature:
      wonder_specific_hook: Lalibela's rite treats the excavated churches as a walkable New Jerusalem carved downward from living rock, so the proof is the route between named sanctuaries rather than a generic sacred-mountain dedication.
      core_interaction_loop: The player opens the carved route, certifies named church waypoints with offerings and recognition proof, resolves broken pilgrim links or missing offerings, and then hands the accepted pilgrimage proof to the existing final reward path.
      player_decision_pattern: Decisions are about whether pilgrims can descend and move safely, whether bread, water, lamps, cross guards, and village recognition are sufficient, and whether to repair a disputed route segment or accept a local-only circuit.
      state_feedback_model: The route_map summarizes New Jerusalem waypoint status, the material stockpile summarizes offering readiness, and the incident_log preserves broken-link, missing-offering, recognition-dispute, retry, and local-only fallback state.
      failure_or_tension_model: A broken trench passage, missing offering, or disputed recognition can send the player back to waypoint certification; accepting the local-only fallback preserves sanctity while narrowing wider pilgrimage recognition.
      reward_expression: The final reward remains the Holy City Pilgrimage Day handoff through existing Lalibela finalization effects, with the Harness recording recognized or local-only route proof as intermediate state only.
      reuse_risk_mitigation: Ordinary pilgrim festivals can reward devotion, but Lalibela must prove a specific church-to-church geography with named rock-hewn waypoints, offerings, endpoint recognition, route incidents, and local-only fallback semantics.
    cadence_signature:
      cadence_type: route_certification
      cadence_rationale: Route certification fits because the decisive validation is the pilgrim circuit through named carved churches, offering checks, incident resolution, and recognition handoff rather than a monthly pulse or single ceremony click.
      player_agency_model: The player opens the route, certifies waypoint offerings and recognition, chooses repair or retry when a pilgrim link breaks, and decides whether the final proof is wide recognition or a local-only holy circuit.
      non_monthly_triggers_or_reason: Non-monthly validation comes from the route gate, offering/resource gate, broken-link incident branch, repair retry decision, local-only fallback choice, and final reward dispatch.
      pacing_failure_mode: The pacing fails if Lalibela becomes one anonymous dedication event, so the node graph keeps route state, offering state, incident state, recognition proof, retry, and final handoff as separate beats.
