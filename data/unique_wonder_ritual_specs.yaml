  node_graph:
    model: state_machine_dsl_v1
    archetypes:
    - overland_relay_route_proof
    historical_mechanic: Qhapaq Nan relay certification through named stone road segments, rope bridges, tambos, chasqui runner handoffs, and a delivered quipu message.
    summary: The player opens a Four Quarters relay proof from Picchu, certifies named stone road segments, rope-bridge checkpoints, and stocked tambos, resolves a bridge, supply, runner-delay, or awkward-route incident, and hands the runner-carried relay message to the existing Inca final reward path.
    mechanic_signature:
      wonder_specific_hook: The Inca Royal Road is not a generic pilgrimage path or coastal route; it proves imperial reach by making runners, tambos, rope bridges, and stone roads carry a quipu message through Andean terrain.
      core_interaction_loop: The player declares the relay message, certifies the active road segment and tambo support, responds to bridge failure, missing supplies, runner delay, or route awkwardness, then completes a rerouted or fully certified runner handoff.
      player_decision_pattern: Decisions choose which endpoint and road segment can carry the first message, whether to spend support on bridges or tambos, and whether to reroute or accept a lower-prestige domestic-only relay when the wider route cannot pass.
      state_feedback_model: The route_map summarizes named road segment, tambo, bridge, endpoint, and runner handoff status while the incident_log preserves bridge failure, missing tambo supply, runner delay, reroute, and domestic-only fallback state.
      failure_or_tension_model: A broken rope bridge, empty tambo, delayed runner, unaffordable repair, or diplomatically awkward endpoint can send the player back to route certification or narrow the proof to a domestic-only relay.
      reward_expression: The final reward remains the Full Relay Line Dispatch handoff through existing Inca finalization effects, with the Harness recording route proof, relay message state, and fallback branch as intermediate state only.
      reuse_risk_mitigation: Lalibela proves sacred church geography and Pharos proves maritime lanes; this rite proves overland state communication through chasqui runners, tambos, rope bridges, road segments, and a runner-carried quipu message.
    cadence_signature:
      cadence_type: route_certification
      cadence_rationale: Route certification fits because the decisive validation is a named relay line carrying a message across stone roads, rope bridges, tambos, and runner waypoints rather than monthly roadwork or a single ceremony click.
      player_agency_model: The player qualifies the endpoint and waypoints, chooses how to answer route incidents, and decides whether the final relay proof remains empire-wide or becomes a domestic-only fallback.
      non_monthly_triggers_or_reason: Non-monthly validation comes from the route gate, active segment/tambo checkpoint, runner-message handoff branch, incident reroute decision, domestic-only fallback choice, and final reward dispatch.
      pacing_failure_mode: The pacing fails if the Royal Road becomes a generic progress counter or Lalibela-style recognition route, so the node graph keeps relay message state, route state, incident state, reroute, and final handoff as separate beats.
