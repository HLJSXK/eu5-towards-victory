    - scripts/wonder_unique_rituals/pharos.py:pharos_route_row renders a GUI row per route, and pharos_stage_2_card loops PHAROS_ROUTE_KEYS into repeated visible rows.
    - Verified existing bespoke row pattern only; no current Harness backend expands design_ir tracked_entity_sets into source incident_log rows.
    verification_status: verified_existing
    harness_backlog_cluster: repeated_entity_row_checklist_incident_log_backend
    search_questions:
    - Which Engineering Department GUI pattern should own repeated incident rows keyed by designed entity sets?
    - Can current variable maps safely key sanctuary participant status without introducing hot-path rebuilds?
    blocked_by:
    - No Harness source compiler primitive owns access-group row expansion.
    fallback_if_unavailable: Keep the access groups in design_ir and project only compact_status plus opposition_pressure summary text.
  - primitive: bounded_sanctuary_opposition_scope
    design_semantics: Create or represent a bounded religious/legal opposition actor without escalating the wonder rite into an unbounded rebellion.
    required_game_interfaces:
    - event-scoped opposition actor or country variable
    - retry branch state
    - clergy or local-notable pressure checks
    codebase_evidence:
    - reference_game_files/game/in_game/common/generic_actions/autocephalous_patriarchates.txt uses holy-site selectors with looking_for_a = holy_site, none_available_msg_key, is_location_holy_site_for, and is_location_holy_site_type.
    - reference_game_files/game/in_game/events/DHE/flavor_SCO.txt and flavor_TUR.txt show clergy/religion pressure via dominant_religion, religion.group, estate_type:clergy_estate, and add_estate_satisfaction.
    - src/in_game/common/static_modifiers/tv_engineering_department_wonder_mechanics_modifiers.txt contains clergy_estate_target_satisfaction ceremony modifiers, proving the project already uses clergy pressure outputs.
