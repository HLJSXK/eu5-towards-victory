    compiler_primitives:
    - arsenal_facility_work_package_rows
    - arsenal_material_stockpile_preparation
    - auxiliary_completion_listener_inspection
    - loadable_auxiliary_completion_source_writer
    - per_facility_repair_retry_rows
    phases:
    - key: secret_council_opening
      gameplay_stage: Convene Senate officers, shipwrights, ropewalk masters, founders, basin guards, Arsenalotti foremen, and civic officiants while keeping shipbuilding secrets inside guarded doors.
    - key: facility_work_package_choice
      gameplay_stage: Choose whether the ropewalk, foundry, or guarded basin will carry the launch proof for the Marriage of the Sea.
    - key: material_stockpile_preparation
      gameplay_stage: Prepare hemp, rope, timber, oakum, pitch, tar, iron, bronze, pumps, caissons, guarded crews, and secrecy watches for the selected work package.
    - key: completion_inspection
      gameplay_stage: Let auxiliary-building completion or annex inspection trigger a defect branch without pretending the Harness can emit the real on_construction_ended hook.
    - key: repair_or_launch
      gameplay_stage: Repair a flawed ropewalk, foundry shortage, or basin leak, or accept a narrower but credible launch proof before final reward handoff.
    player_proofs:
    - The player proves that the Arsenal's industrial process is organized enough to launch a fleet under civic ritual.
    - The player proves that secret state production can still be inspected and trusted by public officers.
    - The player proves that material readiness matters differently for ropewalks, foundries, and guarded basins.
    - The player proves that completion is not safe until the selected annex or work package survives inspection or repair.
    tracked_entity_sets:
    - key: arsenal_work_packages
      entity_type: facility_work_package
      entities:
      - key: ropewalk
        display_name: Ropewalk And Cordage Line
      - key: foundry
        display_name: Foundry And Shot Bay
      - key: guarded_basin
        display_name: Guarded Basin And Lock Gate
      state_values:
      - available
      - selected
      - stockpiled
      - completed
      - defect_found
      - repaired
      - accepted_for_launch
      per_entity_state:
        status_variable_pattern: tv_wonder_venetian_arsenal_work_package_<package>_status
        defect_variable_pattern: tv_wonder_venetian_arsenal_work_package_<package>_defect
      selector: Select the ropewalk, foundry, or guarded basin whose completion and inspection will prove the Arsenal.
      ui_binding: checklist:arsenal_work_packages should show each facility as available, selected, stockpiled, defect_found, repaired, or accepted.
    - key: arsenal_material_stockpiles
      entity_type: material_stockpile
      entities:
      - key: hemp_and_rope
        display_name: Hemp And Finished Rope
      - key: timber_and_oakum
        display_name: Timber And Oakum
      - key: pitch_and_tar
        display_name: Pitch And Tar
      - key: iron_and_bronze
        display_name: Iron And Bronze
      - key: pumps_and_caissons
        display_name: Pumps And Caissons
      - key: guarded_crews
        display_name: Guarded Arsenalotti Crews
      state_values:
      - missing
      - pledged
      - delivered
      - inspected
      - short
      - consumed
      per_entity_state:
        status_variable_pattern: tv_wonder_venetian_arsenal_stockpile_<material>_status
        shortage_variable_pattern: tv_wonder_venetian_arsenal_stockpile_<material>_shortage
      selector: Select the material row whose shortage or readiness matters for the chosen work package.
      ui_binding: material_stockpile:arsenal_material_stockpiles should render one row per material with readiness and shortage state.
    - key: arsenal_inspection_risks
      entity_type: inspection_risk
      entities:
      - key: flawed_ropewalk
        display_name: Flawed Ropewalk
      - key: foundry_shortage
        display_name: Foundry Shortage
      - key: basin_leak
        display_name: Basin Leak
      state_values:
      - dormant
      - triggered
      - repaired
      - accepted_narrowly
      per_entity_state:
        status_variable_pattern: tv_wonder_venetian_arsenal_inspection_<risk>_status
      selector: Select the inspection defect produced by the completed work package.
      ui_binding: checklist:arsenal_inspection_risks should show whether each defect is dormant, triggered, repaired, or accepted narrowly.
    selectors:
    - key: arsenal_work_package_selector
      selection_space: Ropewalk, foundry, or guarded basin work package.
      projection_state: Projected into tv_wonder_venetian_arsenal_work_package while design_ir keeps all three facility rows.
    - key: material_stockpile_selector
      selection_space: Hemp, rope, timber, oakum, pitch, tar, iron, bronze, pumps, caissons, and guarded crews.
      projection_state: Projected into tv_wonder_venetian_arsenal_stockpile_status while design_ir keeps per-material rows.
    - key: inspection_defect_selector
      selection_space: Flawed ropewalk, foundry shortage, or basin leak.
      projection_state: Projected into inspection_result and defect_state variables after the listener gate.
    risk_branches:
    - key: flawed_ropewalk
      risk: Rope laid too quickly fails tension inspection and risks embarrassing the public launch.
      retry_or_failure: Return to material stockpile and repair cordage, or accept a narrower reward branch.
    - key: foundry_shortage
      risk: Cannon bronze, shot, or tools are short when the foundry bay is inspected.
      retry_or_failure: Requisition missing metal and retry, or launch with reduced industrial reach.
    - key: basin_leak
      risk: A guarded basin, caisson, or lock gate leaks before the launch procession can trust it.
      retry_or_failure: Repair pumps and caissons, then wait for inspection again, or accept a cautious launch.
    player_actions:
    - Choose whether the ritual proves ropewalk discipline, foundry supply, or guarded basin readiness.
    - Commit material stockpiles and guarded crews without exposing all state shipbuilding secrets.
    - Respond to completion inspection by repairing, retrying, or accepting a narrower final proof.
    - Hand the accepted proof to the Marriage of the Sea reward instead of claiming construction source generation is complete.
    map_scope_evidence:
    - Fixed site is Venice; later mapping must preserve location ownership/control, completed Venetian Arsenal building, selected annex or work package, and guarded-basin local state.
    - Existing project evidence shows auxiliary-building ritual completion can be marked from on_construction_ended, but this spec only records the intermediate listener semantics.
    - Current on_action bridges cover monthly, ruler-death, pre-winning-war, and ending-war ritual listeners; no construction-completion on_action bridge is generated here.
    ui_feedback_model:
      components:
      - checklist
      - material_stockpile
      repeated_rows: One checklist row per facility work package, one material row per stockpile class, and one inspection risk row for flawed ropewalk, foundry shortage, or basin leak.
      per_entity_status: Facility rows need selected, stockpiled, completed, defect_found, repaired, and accepted states; material rows need delivered, short, inspected, and consumed states.
      current_projection: The compiler_mapped node_graph compresses facility rows into work_package, stockpile rows into stockpile_status, and inspection rows into inspection_result plus defect_state while preserving full rows in design_ir.
    uniqueness_constraints:
    - The proof must involve the Arsenal's production line, not a generic harbor or shipyard ceremony.
    - Ropewalk, foundry, and guarded basin must stay as distinct selectable work packages.
    - State shipbuilding secrecy and civic Marriage of the Sea ritual flavor must both remain visible.
    - Completion must trigger inspection and possible repair before final reward handoff.
    projection_notes: |
      Preserve the ropewalk, foundry, and guarded-basin work-package rows, material stockpile rows, secrecy/civic ritual flavor, auxiliary completion listener semantics, and flawed-ropewalk/foundry-shortage/basin-leak repair branches in design_ir. The compiler_mapped node_graph is an intermediate-only projection: it summarizes facility rows through work_package, preparation through stockpile_status, completion listener state through listener_state, inspection through inspection_result and defect_state, and final handoff through reward_branch. It does not generate on_action entries, building_type on_construction_ended hooks, GUI row expansion, or loadable EU5 source.
