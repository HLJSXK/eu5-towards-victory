  node_graph:
    model: state_machine_dsl_v1
    archetypes:
    - arsenal_ropewalk_launch_inspection
    historical_mechanic: Venetian state shipbuilding inspection over ropewalks, foundries, guarded basins, and public Marriage of the Sea ceremony.
    summary: The player proves the Arsenal by selecting a ropewalk, foundry, or guarded-basin work package, preparing the materials, letting auxiliary-building completion trigger an inspection, repairing a defect if needed, and handing the result to the Marriage of the Sea reward.
    mechanic_signature:
      wonder_specific_hook: The Venetian Arsenal is not a generic shipyard; its docks, ropewalks, foundries, guarded basins, locks, and civic procession turn production-line secrecy into a public proof of naval power.
      core_interaction_loop: The player chooses which industrial facility must carry the launch proof, stocks rope, timber, pitch, iron, bronze, pumps, and guarded crews, waits for the auxiliary completion inspection, and then repairs or accepts the launch result before reward handoff.
      player_decision_pattern: Choices decide whether rope quality, foundry output, or basin watertightness receives priority, whether scarce materials are held for repair, and whether the state exposes enough ritual ceremony to make secret production credible.
      state_feedback_model: The checklist records selected facility and inspection state while the material stockpile shows preparation readiness and the listener state records whether annex completion has triggered the defect branch.
      failure_or_tension_model: A flawed ropewalk, foundry shortage, or basin leak sends the player to a repair or retry choice that can return to material preparation instead of pretending construction completion is automatically safe.
      reward_expression: The final reward remains the Marriage of the Sea handoff, expressing shipbuilding speed and naval morale through a proven launch process rather than a passive dockyard dedication.
      reuse_risk_mitigation: Ordinary ports can build ships, but only the Arsenal makes industrial secrecy, civic ceremony, ropewalk length, foundry reliability, and guarded basin inspection the ritual proof.
    cadence_signature:
      cadence_type: construction_or_auxiliary_building
      cadence_rationale: Construction or auxiliary-building cadence fits because the decisive validation happens when the selected annex or work package is completed and inspected, not on a monthly pulse or a simple opening event.
      player_agency_model: The player chooses the facility work package, commits material stockpiles, and decides whether a completion defect should be repaired, retried, or accepted as a narrower launch proof.
      non_monthly_triggers_or_reason: Non-monthly validation is the auxiliary-building completion listener and the inspection branch that tests ropewalk, foundry, or basin readiness before final reward dispatch.
      pacing_failure_mode: The pacing fails if completion becomes a generic finalization click, so design_ir preserves separate facility rows, stockpile readiness, inspection risks, and repair choices even when the node graph projects them into summary variables.
