    phases:
    - key: custody_opening
      gameplay_stage: Convene the ruler's commissioner, religious judge, gate wardens, reciters, local notables, and supervised witnesses on the Jerusalem platform.
    - key: access_compact
      gameplay_stage: Choose whether the covenant privileges disciplined guard custody, broad pilgrim access, or jurist-led public rules.
    - key: contested_settlement
      gameplay_stage: Resolve rejection by pilgrims, overreach by guards, or witness suspicion without turning the sanctuary into a battlefield.
    - key: covenant_seal
      gameplay_stage: Seal the access rules, endowment duties, and threshold discipline as the final public proof.
    player_proofs:
    - The player proves control of Jerusalem as lawful custody rather than ordinary conquest.
    - The player proves that soldiers, jurists, pilgrims, and local communities can obey one platform rule.
    - The player proves diplomatic credibility by allowing witnesses to understand access without surrendering sovereignty.
    tracked_entity_sets:
    - key: sanctuary_access_groups
      entity_type: access_group
      entities:
      - key: gate_wardens
        display_name: Platform Gate Wardens
      - key: religious_jurists
        display_name: State-Faith Jurists
      - key: pilgrim_caravans
        display_name: Visiting Pilgrim Groups
      - key: local_notables
        display_name: Jerusalem Local Notables
      - key: supervised_witnesses
        display_name: Supervised Intercommunal Witnesses
      state_values:
      - unbound
      - accepts_compact
      - contests_access
      - overawed_by_guards
      - recognizes_custody
      per_entity_state:
        status_variable_pattern: tv_wonder_dome_of_the_rock_access_<group>_status
        pressure_variable_pattern: tv_wonder_dome_of_the_rock_access_<group>_pressure
      selector: Select the access group whose acceptance or objection currently defines the covenant crisis.
      ui_binding: incident_log:sanctuary_access_groups should render one row per access group with compact and pressure state.
    - key: custody_duties
      entity_type: sanctuary_duty
      entities:
      - key: gate_keys
        display_name: Gate Keys And Watch Lists
      - key: cisterns
        display_name: Cisterns And Water Carriers
      - key: lamps
        display_name: Dome Lamps And Inscriptions
      - key: endowment_deeds
        display_name: Endowment Deeds And Scribes
      - key: pilgrim_routes
        display_name: Guarded Pilgrim Routes
      state_values:
      - unchecked
      - entrusted
      - disputed
      - sealed
      per_entity_state:
        status_variable_pattern: tv_wonder_dome_of_the_rock_duty_<duty>_status
      selector: Select the duty whose failure would make custody look like plunder rather than stewardship.
      ui_binding: checklist:custody_duties should show each duty as unchecked, entrusted, disputed, or sealed.
    selectors:
    - key: access_compact_selector
      selection_space: guard discipline, jurist proclamation, pilgrim access, and witnessed tolerance compact options.
      projection_state: Compressed into dome_compact in the current design-only node graph.
    - key: contested_group_selector
      selection_space: The access group or custody duty currently causing sanctuary pressure.
      projection_state: Preserved in design_ir only; the node_graph summarizes it as dome_settlement.
    risk_branches:
    - key: guard_overreach
      risk: Guards treat custody as occupation, raising opposition pressure and forcing reconciliation or a narrower proclamation.
      retry_or_failure: Retry the compact with stricter threshold discipline or accept weaker diplomatic recognition.
    - key: pilgrim_rejection
      risk: Pilgrims or local notables reject rules that feel like exclusion.
      retry_or_failure: Reopen access terms or complete with reduced tolerance expression.
    - key: witness_suspicion
      risk: Supervised witnesses report coercion instead of lawful access.
      retry_or_failure: Add jurist oversight or lose part of the diplomatic reward.
    player_actions:
    - Choose the custody compact that defines who holds keys, reads rules, and escorts pilgrims.
    - Spend legitimacy, clergy goodwill, or diplomatic capital to calm a contested access group.
    - Accept a narrower sovereign proclamation when broad witnessed access is too risky.
    map_scope_evidence:
    - Fixed site is Jerusalem, and the design must preserve location ownership/control, platform building presence, and local unrest evidence before implementation.
    - Access groups refer to location-local sanctuary participants and country-level diplomatic witnesses; later mapping must decide which scopes can be real.
    ui_feedback_model:
      components:
      - incident_log
      - checklist
      repeated_rows: One row per sanctuary access group plus one checklist row per custody duty.
      per_entity_status: Each access group needs compact acceptance and pressure status; each custody duty needs entrusted/disputed/sealed status.
      current_projection: The current source_codegen_ready node_graph is still intermediate-only; it preserves access_group_status, custody_duty_status, compact_status, opposition_pressure, site_evidence_status, and reward_branch summary variables while per-access-group and per-duty rows remain authoritative in design_ir.
    uniqueness_constraints:
    - The Rock is the sacred object; the ritual is about visible custody of a contested platform, not a generic dome dedication.
    - Jerusalem access rules, guard thresholds, endowment deeds, cisterns, and witnesses are mandatory design surfaces.
    - Conquest cannot speed the rite; sovereignty is proven by restraint and recognized access.
    projection_notes: |
      Preserve the full access-group and custody-duty tracked sets in design_ir. Project them into a source_codegen_ready strong DSL graph with four player-visible planning nodes, checklist and incident summary variables, fixed Jerusalem site evidence, bounded opposition semantics, witness/guard branch state, actions, checks, scope contracts, and UI bindings. The repeated-row, bounded religious-community pressure, fixed-site integrity, and branch-scaling primitives have intermediate backend evidence, but loadable source writers and real GUI row expansion remain unresolved. Drop no access group, custody duty, guard-overreach branch, witness branch, Jerusalem sacred-site requirement, or per-row UI intent.
