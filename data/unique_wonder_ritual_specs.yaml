    summary: The player proves that the Bank of Saint George can make public credit credible by choosing a founding charter and surviving the first creditor, crown, or open-market challenge.
    mechanic_signature:
      wonder_specific_hook: San Giorgio is not a generic bank; its founding binds old public obligations, merchant creditors, pledged revenues, coin assays, archive seals, and guarded harbor counters into one trusted machine.
      core_interaction_loop: The player opens the ledger oath, chooses creditor privilege, crown supervision, or open merchant access, resolves the immediate credit incident created by that charter, and then seals the bank as public authority.
      player_decision_pattern: Choices decide who controls trust, who bears political cost, and which pledge rows become credible enough to support minting and tax efficiency.
      state_feedback_model: The checklist tracks charter acceptance and pledge categories while the incident log records creditor overreach, crown distrust, or open-market default pressure.
      failure_or_tension_model: Overprivileged creditors cause social friction, crown-heavy control weakens merchant trust, and open access risks default; each can retry or seal a narrower charter.
      reward_expression: The reward expresses minting income and tax efficiency as public confidence in coin assays, pledged tax streams, and enforceable debt ledgers.
      reuse_risk_mitigation: The loop belongs to Genoa's public-credit institution because state debt, merchant syndicates, port revenue, archive seals, and a fortified bank hall are the monument itself.
    cadence_signature:
      cadence_type: instant_but_branching
      cadence_rationale: Instant branching fits because the core drama is the founding charter bargain, a one-time public oath with distinct fiscal and social costs rather than a timer.
      player_agency_model: The player chooses the charter doctrine, accepts its trust or political cost, and resolves the first incident that tests the chosen credit compact.
      non_monthly_triggers_or_reason: Non-monthly validation is the immediate charter option and the credit incident branch that confirms whether creditors, the crown, or merchants trust the ledger.
      pacing_failure_mode: The pacing fails if ledgers become anonymous monthly points; design_ir preserves pledge rows, charter branches, and default risk even when projected into a short event skeleton.
    listeners: []
    entry_node: bank_opening
    terminal_nodes:
    - bank_reward
    runtime_variables:
    - tv_wonder_bank_of_saint_george_stage
    - tv_wonder_bank_of_saint_george_charter_branch
    - tv_wonder_bank_of_saint_george_pledge_status
    - tv_wonder_bank_of_saint_george_default_risk
    nodes:
    - key: bank_opening
      kind: event
      event_id: 1012
      player_visible: true
      next_nodes:
      - bank_charter_branch
      failure_or_retry: false
      historical_anchor: The doge's officers, merchant creditors, notaries, mint masters, customs farmers, and guards gather around the ledger oath.
    - key: bank_charter_branch
      kind: choice_event
      event_id: 1013
      player_visible: true
      next_nodes:
      - bank_credit_incident
      failure_or_retry: false
      historical_anchor: The player chooses whether creditors, crown officers, or open merchants receive the founding privilege.
    - key: bank_credit_incident
      kind: retry_event
      event_id: 1014
      player_visible: true
      next_nodes:
      - bank_reward
      failure_or_retry: true
      retry_target: bank_charter_branch
      historical_anchor: The chosen charter immediately triggers creditor overreach, crown distrust, or market default pressure.
    - key: bank_reward
      kind: final_reward_dispatch
      event_id: 1015
      player_visible: true
      next_nodes: []
      failure_or_retry: false
      historical_anchor: The public ledger is sealed, a verified coin is presented, and pledged revenues become trusted state capacity.
  design_ir:
    compiler_primitives:
    - public_credit_interfaces
    - charter_branch_fiscal_scaling
    - merchant_creditor_privilege_checks
    - per_pledge_ledger_rows_default_risk
    phases:
    - key: ledger_oath_opening
      gameplay_stage: Convene doge's officers, Anziani, creditors, notaries, mint masters, customs farmers, insurers, harbor scribes, and guards in the bank hall.
    - key: charter_branch
      gameplay_stage: Choose creditor privilege, crown supervision, or open merchant access as the public-credit charter.
    - key: credit_incident
      gameplay_stage: Resolve the first trust shock created by the charter, whether creditor overreach, crown distrust, or default risk.
    - key: public_credit_seal
      gameplay_stage: Seal the ledger, pledge tax streams, verify coin trust, and publish the charter at the harbor gate.
    player_proofs:
    - The player proves that debt ledgers, tax streams, minting, and merchant syndicates can become a public institution.
    - The player proves that trust is allocated by charter choice, not by passive fiscal progress.
    - The player proves that public credit can survive its first default or privilege crisis.
    tracked_entity_sets:
    - key: charter_options
      entity_type: charter_branch
      entities:
      - key: creditor_privilege
        display_name: Creditor Privilege Charter
      - key: crown_supervision
        display_name: Crown Supervision Charter
      - key: open_merchant_access
        display_name: Open Merchant Access Charter
      state_values:
      - available
      - selected
      - contested
      - sealed
      per_entity_state:
        status_variable_pattern: tv_wonder_bank_of_saint_george_charter_<branch>_status
      selector: Select which compact gives the bank authority over debts, taxes, and coin trust.
      ui_binding: checklist:charter_options should show branch availability, selected branch, contest state, and final seal.
    - key: public_credit_pledges
      entity_type: credit_pledge
      entities:
      - key: old_war_debts
        display_name: Old War Debts
      - key: customs_dues
        display_name: Customs Dues
      - key: salt_tax
        display_name: Salt Tax
      - key: port_tolls
        display_name: Port Tolls
      - key: coin_assays
        display_name: Coin Assays
      - key: archive_volumes
        display_name: Archive Volumes
      state_values:
      - unpledged
      - pledged
      - distrusted
      - defaulted
      - honored
      per_entity_state:
        status_variable_pattern: tv_wonder_bank_of_saint_george_pledge_<pledge>_status
        default_risk_variable_pattern: tv_wonder_bank_of_saint_george_pledge_<pledge>_default_risk
      selector: Select the pledge whose trust or default risk is tested by the chosen charter.
      ui_binding: incident_log:public_credit_pledges should render one row per pledge with trust and default-risk state.
    selectors:
    - key: charter_branch_selector
      selection_space: Creditor privilege, crown supervision, or open merchant access charter options.
      projection_state: Preserved as charter_branch variable and compressed into bank_charter_branch node.
    - key: pledge_risk_selector
      selection_space: Debt, customs, salt, port toll, coin assay, and archive pledge rows.
      projection_state: Preserved in design_ir; node_graph summarizes the selected pressure as pledge_status and default_risk.
    risk_branches:
    - key: creditor_overprivilege
      risk: Creditors receive too much control and provoke social or crown resentment.
      retry_or_failure: Reopen charter terms or seal a high-trust branch with political cost.
    - key: crown_heavy_charter
      risk: Crown supervision reassures rulers but makes merchants distrust the ledger.
      retry_or_failure: Add merchant guarantees or accept weaker minting-income expression.
    - key: open_access_default
      risk: Broad market access improves legitimacy but exposes default risk in weak pledge rows.
      retry_or_failure: Narrow the charter, pledge stronger revenue, or complete with a lower tax-efficiency expression.
    player_actions:
    - Choose the founding charter branch that allocates control of credit.
    - Decide which pledge class bears the first trust test and whether to guarantee, narrow, or publish it.
    - Accept a fiscal, estate, or legitimacy cost when the charter creates immediate opposition.
    map_scope_evidence:
    - Fixed site is Genoa; later mapping must preserve ownership/control, final bank building presence, usable harbor, and urban order.
    - Public credit primitives need country finance evidence for debt, loans, taxes, minting, trade income, and merchant or creditor groups.
    ui_feedback_model:
      components:
      - checklist
      - incident_log
      repeated_rows: Charter option checklist rows plus one incident row per public-credit pledge.
      per_entity_status: Charter rows need selected/contested/sealed state; pledge rows need pledged/distrusted/defaulted/honored and default-risk state.
      current_projection: The design-only node_graph compresses these rows into charter_branch, pledge_status, and default_risk variables.
    uniqueness_constraints:
    - The ledger, not the hall alone, is the monument; public debts and pledged revenues must stay visible.
    - The founding choice must branch immediately among creditor, crown, and open-merchant trust models.
    - The reward must stay fiscal, with minting income and tax efficiency from credible public credit rather than a generic trade or monthly bank progress bar.
    projection_notes: >
      Preserve charter options, pledge rows, default risk, and branch fiscal semantics in design_ir. Compress them into four planning nodes and three summary variables for design_complete. Replace per-pledge incident rows and charter checklist rows with summary UI bindings until a row generator exists. Drop the old monthly audit pacing from this pilot; unresolved finance and pledge primitives block compiler_mapped and all source-codegen statuses.
  compiler_gap_ledger:
  - primitive: public_credit_interfaces
    design_semantics: Detect and represent loans, debt burden, tax streams, minting income, trade income, and treasury promises as public-credit material.
    required_game_interfaces:
    - country loan or debt checks
    - tax and customs income checks
    - minting or seigniorage values
    - treasury and solvency state
    codebase_evidence:
    - data/index/static_modifiers.txt lists finance-facing modifiers including minting_income_factor, tax_income_efficiency, trade_income, bank_interest, monthly_loan_capacity_investment, total_loan_capacity_modifier, and take_on_debt_cost_modifier.
    - data/index/scripted_triggers.txt and reference_game_files/game/in_game/common/scripted_triggers/country_triggers.txt expose has_gold_org_country_trigger.
    - reference_game_files/game/in_game/common/scripted_effects/country_gold_effects.txt defines change_gold_effect, pay_gold_org_country_effect, and transfer_gold_to_org_country_effect.
    - reference_game_files/game/in_game/events/government/republics.txt and government/parliaments.txt include num_loans and monthly_income_trade_and_tax checks suitable for later finance interface mapping.
    verification_status: interface_candidate
    harness_backlog_cluster: finance_public_credit_interface
    search_questions:
    - Which EU5 country triggers/effects expose loans, interest, tax income, minting income, and trade income safely?
    - Are fiscal values readable in event tooltips without unsafe pre-evaluation?
    blocked_by:
    - Finance interface mapping has not been searched for this ritual.
    fallback_if_unavailable: Keep fiscal evidence semantic and branch only on a coarse solvency/treasury check in future projections.
  - primitive: charter_branch_fiscal_scaling
    design_semantics: Scale minting-income, tax-efficiency expression, and one-time fiscal/social costs by creditor, crown, or open-merchant charter branch.
    required_game_interfaces:
    - branch state variable
    - final reward handoff
    - tooltip-safe branch preview
    - cost and reward scaling
    codebase_evidence:
    - capability:final_reward_handoff documents final handoff semantics but does not generate branch-specific fiscal rewards.
    - scripts/wonder_unique_rituals/hagia.py:tv_wonder_hagia_complete_step_6_effect proves branch variables can drive different reward/cost effects in bespoke ritual code.
    - src/in_game/common/scripted_effects/tv_wonder_finalization_effects.txt:tv_wonder_execute_finalization_hidden_event_effect proves hidden finalization dispatch can consume saved wonder state after visible options.
    - data/index/static_modifiers.txt provides fiscal modifier targets for later branch scaling, but not a Harness branch-reward backend.
    verification_status: interface_candidate
    harness_backlog_cluster: branch_specific_reward_scaling
    search_questions:
    - Which existing finalization effects can read a branch variable and apply different country modifiers or one-time rewards?
    - Can branch preview text show different fiscal outcomes without invoking hidden mutation in option tooltips?
    blocked_by:
    - Current Harness templates do not support source fiscal scaling by branch.
    fallback_if_unavailable: Use one fixed reward theme and preserve branch scaling in design_ir for a later backend.
  - primitive: merchant_creditor_privilege_checks
    design_semantics: Check merchant, burgher, creditor, or crown privilege pressure so charter choice has social cost.
    required_game_interfaces:
    - estate satisfaction or privilege checks
    - merchant/creditor pressure variables
    - incident branch state
    codebase_evidence:
    - reference_game_files/game/in_game/events/government/republics.txt uses is_merchant_republic, any_market_with_merchants, random_market_with_merchants, estate_satisfaction:burghers_estate, and add_estate_satisfaction for merchant-republic pressure.
    - reference_game_files/game/in_game/events/government/republic_factions.txt branches on estate_type:burghers_estate, estate_power, has_merchant_power, and add_merchant_power.
    - data/index/scripted_effects.txt includes tv_wonder_accept_burghers_demand_effect, tv_wonder_bribe_burghers_demand_effect, tv_wonder_refute_burghers_demand_effect, and tv_wonder_roll_burghers_demand_effect as project-owned estate pressure interfaces.
    verification_status: interface_candidate
    harness_backlog_cluster: finance_public_credit_interface
    search_questions:
    - Which estate or privilege APIs can represent merchant-creditor overprivilege without inventing a new estate?
    - Can crown-heavy and creditor-heavy branches be represented as temporary burdens before final handoff?
    blocked_by:
    - Merchant-creditor social interface is not verified for this source layer.
    fallback_if_unavailable: Represent the pressure as a ritual-local incident variable and keep estate semantics in design_ir.
  - primitive: per_pledge_ledger_rows_default_risk
    design_semantics: Track old debts, customs dues, salt tax, port tolls, coin assays, and archive volumes as separate pledge rows with default risk.
    required_game_interfaces:
    - repeated incident_log rows
    - per-pledge status variables
    - default-risk display
    - pledge selector
    codebase_evidence:
    - scripts/wonder_unique_rituals/pharos.py:append_pharos_set_route_projection_lines writes generated per-entity route status/location/owner variables.
    - scripts/wonder_unique_rituals/pharos.py:pharos_route_row and pharos_stage_2_card render one repeated GUI row per entity key.
    - Existing repeated-row evidence is bespoke route UI; no current Harness backend expands public_credit_pledges into pledge/default-risk incident rows.
    verification_status: verified_existing
    harness_backlog_cluster: repeated_entity_row_checklist_incident_log_backend
    search_questions:
    - Which repeated-row GUI pattern should render pledge status and default risk?
    - Should pledge rows be generated from design_ir tracked_entity_sets or stored as fixed variables?
    blocked_by:
    - No current Harness source generator owns per-pledge row expansion.
    fallback_if_unavailable: Use pledge_status and default_risk summaries while preserving all pledge rows in design_ir.
