  node_graph:
    model: state_machine_dsl_v1
    historical_mechanic: Sacred official assignment for an apostolic threshold dedication over Peter's tomb.
    summary: The player proves that Saint Peter's can operate as a staffed apostolic institution by assigning a sacred official whose authority, competence, and factional baggage shape the dedication dispute.
    graph_shape: actor_assignment_retry_handoff
    archetypes:
    - patronage_actor_assignment
    completion_policy:
      allow_terminal_outgoing: false
    scope_contract:
      root_scope: country
      current_scope: country
      target_scopes:
      - character
      - location
      tooltip_safe: true
      unsafe_pre_eval: false
    mechanic_signature:
      wonder_specific_hook: The basilica's authority depends on a named sacred official who can guard relics, regulate pilgrims, account for alms, discipline clergy, and make Rome's apostolic claim legible under the dome.
      core_interaction_loop: The player opens the threshold dedication, assigns a cardinal, bishop, relic custodian, alms officer, or similar official, resolves the first scandal created by that actor's strengths and weaknesses, and then seals the dedication.
      player_decision_pattern: Choices trade clerical legitimacy, service competence, estate satisfaction, alms transparency, and pilgrim access rather than accumulating monthly progress.
      state_feedback_model: The actor slot shows the assigned official and their quality band while the incident log records relic, alms, or pilgrim-access disputes created by that assignment.
      failure_or_tension_model: A factional or weak official can cause a relic scandal, alms dispute, or access disorder, forcing reassignment or a reduced dedication interpretation.
      reward_expression: The reward expresses true-faith tolerance and clergy satisfaction as a service network disciplined by a credible official.
      reuse_risk_mitigation: This assignment belongs to Saint Peter's because the apostolic tomb, Rome, relic custody, alms, pilgrim thresholds, and clerical obligations converge in one sacred office.
    cadence_signature:
      cadence_type: actor_assignment
      cadence_rationale: Actor assignment fits because the dedication is credible only if a named sacred official can administer clergy, relics, pilgrims, and alms before the public threshold opens.
      player_agency_model: The player chooses the official, accepts their factional or competence cost, and decides whether to retry after the assignment exposes a scandal.
      non_monthly_triggers_or_reason: Non-monthly validation is the actor selection plus the scandal branch tied to the chosen official's role or quality.
      pacing_failure_mode: The pacing fails if the actor is flavor only; design_ir preserves candidate rows, duty rows, and actor-quality consequences even though node_graph summarizes them.
    listeners: []
    entry_node: st_peters_opening
    terminal_nodes:
