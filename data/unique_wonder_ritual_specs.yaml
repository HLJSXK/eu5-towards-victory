    risk_branches:
    - key: bridge_failure
      risk: A woven rope bridge frays, collapses, or cannot carry runners and llama loads safely.
      player_response: Renew the bridge and retry, reroute around the ravine, or accept a domestic-only proof that never crosses the failed checkpoint.
    - key: missing_tambo_supply
      risk: A tambo lacks maize, chuno, sandals, coca, water, bedding, or runner relief.
      player_response: Spend supply to stock the station, reroute to a prepared tambo, or narrow the proof to a local relay.
    - key: runner_delay
      risk: A chasqui handoff is late enough that the route cannot prove fast state communication.
      player_response: Reassign runners and retry the segment, accept a slower domestic certification, or reroute to a safer endpoint.
    - key: awkward_endpoint_route
      risk: The selected endpoint is blocked, unaffordable to protect, or diplomatically awkward for a first proof.
      player_response: Choose a new endpoint, pay for recognition and guards, or complete the relay as lower-prestige domestic certification.
    player_actions:
    - Open the Four Quarters relay message at Picchu instead of confirming a one-click ceremony.
    - Certify named road segments, tambos, rope bridges, runner handoffs, route endpoint, and relay-message proof.
    - Resolve bridge failure, missing tambo supply, runner delay, unaffordable repair, or awkward endpoint route through repair, reroute, retry, or domestic-only fallback.
    - Hand off the completed or domestic-only relay proof to the existing finalization reward path.
    map_scope_evidence:
    - Picchu is the fixed wonder location and the road head for this intermediate relay proof.
    - The design intentionally uses overland route rows rather than Lalibela church waypoints or Pharos maritime route rows.
    - data/index/scripted_effects.txt lists Inca finalization visible, hidden, construction, and broadcast effects used for final reward handoff.
    - No current Harness source compiler expands overland relay route rows, tambo supply, rope bridge checkpoints, runner handoffs, or route incidents into loadable EU5 source.
    ui_feedback_model:
      components:
      - route_map
      - incident_log
      route_map: Six relay rows show Picchu road head, stone stair, rope bridge, high-pass tambo, qollqa supply yard, and endpoint as pending, passable, stocked, delayed, blocked, rerouted, or domestic-only.
      incident_log: Relay incidents record bridge failure, missing tambo supply, runner delay, unaffordable repair, awkward endpoint route, repair, reroute, retry, and domestic-only fallback.
      repeated_rows: The design requires one route_map row per road segment/checkpoint and one incident_log row when bridge, tambo, runner, cost, or endpoint problems appear.
      per_entity_status: Each segment keeps separate road, bridge, tambo, runner, endpoint, and incident state in design_ir.
      current_projection: The compiler_mapped node_graph compresses road segments into route_status, runner handoffs into relay_message_status, route incidents into incident_state, and full or domestic proof into reward_branch while preserving all rows in design_ir.
    uniqueness_constraints:
    - The proof is imperial communication over mountains: stone roads, tambos, rope bridges, and runners must carry a message, not just host a festival.
    - The route endpoint and waypoints are overland relay infrastructure tied to Picchu and the Four Quarters, not church-to-church pilgrimage waypoints or maritime lanes.
    - Bridge failure, missing tambo supply, and runner delay matter because the reward is movement and administrative transmission, not abstract prestige.
    - The domestic-only fallback preserves a working internal relay while explicitly losing the wider prestige of a fully certified Four Quarters route.
    projection_notes: The current compiler_mapped node_graph is an intermediate-only strong DSL projection. It preserves Qhapaq Nan road segments, named tambos, rope bridge checkpoints, relay endpoint, runner-carried quipu message, runner handoffs, bridge failure, missing tambo supply, runner delay, reroute, domestic-only fallback, route_map row/status, incident_log, and final reward handoff semantics in design_ir, but compresses repeated road, bridge, tambo, message, and incident rows into summary runtime variables until a future source compiler can generate loadable overland route state, selectors, GUI rows, event source, and effect source.
