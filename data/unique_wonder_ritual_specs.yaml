    risk_branches:
    - key: creditor_overprivilege
      risk: Creditors receive too much control and provoke social or crown resentment.
      retry_or_failure: Reopen charter terms or seal a high-trust branch with political cost.
    - key: crown_heavy_charter
      risk: Crown supervision reassures rulers but makes merchants distrust the ledger.
      retry_or_failure: Add merchant guarantees or accept weaker minting-income expression.
    - key: open_access_default
      risk: Broad market access improves legitimacy but exposes default risk in weak pledge rows.
      retry_or_failure: Narrow the charter, pledge stronger revenue, or complete with a lower tax-efficiency expression.
