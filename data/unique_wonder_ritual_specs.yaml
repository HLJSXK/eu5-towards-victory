    - key: declare_carved_new_jerusalem
      gameplay_stage: The ruler and clergy declare that Lalibela's trench route is a carved New Jerusalem in the Ethiopian highlands.
      entry_condition: The Rock-Hewn Churches have reached the unique ritual moment at Lalibela.
      exit_condition: The route map names the sacred circuit and prepares waypoint/offering checks.
    - key: certify_pilgrim_waypoints_and_offerings
      gameplay_stage: Pilgrims move through named rock-hewn church waypoints while offerings, water, bread, lamps, and recognition tokens are checked.
      entry_condition: The New Jerusalem circuit is open and route waypoints are visible.
      exit_condition: Waypoints are certified as recognized, supplied, or blocked.
    - key: resolve_broken_link_or_local_only_circuit
      gameplay_stage: A broken pilgrim link, missing offering, unsafe trench, or closed village road is either repaired or narrowed into a local-only circuit.
      entry_condition: A route incident is recorded before full recognition proof exists.
      exit_condition: The route is retried with repaired support or the local-only fallback is accepted.
    - key: handoff_recognized_pilgrimage_reward
      gameplay_stage: Recognized route proof or local-only sanctity is handed to the existing Lalibela finalization reward path.
      entry_condition: Route proof is complete or the fallback is explicit.
      exit_condition: The existing finalization visible and hidden reward effects remain the only source-level reward handoff.
    player_proofs:
    - Prove the churches act as a New Jerusalem route cut into living rock rather than an ordinary pilgrimage event.
    - Prove pilgrims can move between named rock-hewn church waypoints with offerings, water, lodging, lamps, and processional recognition.
    - Prove route incidents are visible and can either be repaired for wider recognition or accepted as a local-only sanctity fallback.
    - Prove final rewards remain a handoff to the existing Lalibela finalization path instead of new loadable source generated by the Harness.
