      - { id: 1001, key: total_locations, type: fixed, metric: total_locations, thresholds: [100, 200, 300, 500, 800, 1200, 1600, 2000, 2500, 3000], icon: location, update: monthly, appearance: next_threshold_above_current, completion: metric_reaches_target, failure: none, custom_tooltip: false, loc: { en: "Realm Without Bounds", zh: "无疆之国" }, requirement: { en: "Own the required number of locations together with all subjects.", zh: "自身与所有附属国合计拥有指定数量的地点。" } }
      - { id: 1002, key: owned_locations, type: fixed, metric: owned_locations, thresholds: [100, 200, 300, 500, 800, 1200, 1600, 2000, 2500, 3000], icon: location, update: location_changed_owner, appearance: next_threshold_above_current, completion: metric_reaches_target, failure: none, custom_tooltip: false, loc: { en: "Direct Dominion", zh: "直辖疆域" }, requirement: { en: "Directly own the required number of locations.", zh: "直接拥有指定数量的地点。" } }
