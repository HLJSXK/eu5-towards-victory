      - { id: 1102, key: unite_culture_group, type: target, icon: culture, update: location_changed_owner, appearance: united_culture_and_not_complete, completion: unite_culture_group, failure: none, custom_tooltip: true, loc: { en: "Unite the Culture Group", zh: "统一文化圈" }, requirement: { en: "Directly control every location dominated by a culture in the primary culture's first culture group.", zh: "直接控制主流文化所属首个文化组内所有文化主导的地点。" } }
