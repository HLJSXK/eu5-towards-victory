random_events:
  - design_id: P01
    pool: printing_press
    issue: printing_press
    weight: 1
    title:
      english: "The First Pamphlet Run"
      simp_chinese: "小册子的第一次印刷"
    desc:
      english: "The first pamphlet run comes off the press still smelling of ink, finished before the censors have finished deciding what a pamphlet legally is. The type is already broken up for the next job; the ruling, one suspects, will arrive around the same time as the second edition."
      simp_chinese: "第一批小册子从印机上下来，还带着油墨味，印完时审查官还没决定一份小册子在律法上究竟算什么。铅字已经拆开去排下一活了；至于那道裁决，多半会和第二版一同到场。"
    options:
      a:
        text:
          english: "The clerks cart the pamphlets to every stall and street corner."
          simp_chinese: "书记员把小册子运到每一个摊位和街角。"
        progress_delta: 10
        rationale:
          english: "Wide distribution makes the new medium a public fact before the old controls can define it, and the debate swings sharply toward accepting the printing press."
          simp_chinese: "广泛散发让新媒介先于旧式管制成为公共事实，辩论也就猛地转向接受印刷机。"
        effect_blocks:
          - type: seat_stance
            group: public_opinion
            stance: support
            cooldown_months: 18
      b:
        text:
          english: "We keep the run among scholars until such ink is safe to read aloud."
          simp_chinese: "我们先把这批印品留在学者圈里，等这样的墨迹能公开诵读再说。"
        progress_delta: -5
        rationale:
          english: "Keeping the copies among scholars holds the argument in order, but it never lets print prove its worth as a mass political instrument."
          simp_chinese: "把副本留在学者圈里能保住论辩的秩序，却也让印刷术始终无从证明自己作为大众政治工具的价值。"
        effect_blocks:
          - type: resource
            resource: stability
            amount: 1
  - design_id: P02
    pool: printing_press
    issue: printing_press
    weight: 1
    title:
      english: "The Printers' Petition"
      simp_chinese: "印刷匠行会的请愿"
    desc:
      english: "The printers come before the Academy asking for a charter, a guild hall, and a name in law, before yet more presses take up residence in cellars and borrowed kitchens."
      simp_chinese: "印刷匠们来到学院面前，请求一纸特许状、一座行会厅，以及律法上的一个名分，免得又有更多印刷机住进地窖和借来的厨房。"
    options:
      a:
        text:
          english: "The charter is sealed and the presses join the roll of honest trades."
          simp_chinese: "特许状加了印，印刷机就此列入正当行业的名册。"
        progress_delta: 10
        rationale:
          english: "Legal recognition turns printing from a tolerated irregular craft into a regulated civic trade, and the town producers gain a stake in acceptance."
          simp_chinese: "法律承认把印刷从被默许的零散手艺变成受规制的城市行业，城里的生产者也就在接受印刷机中分得了利益。"
        effect_blocks:
          - type: estate_satisfaction
            estate: burghers_estate
            value: 0.04
      b:
        text:
          english: "We would sooner license each press one by one, by its own name."
          simp_chinese: "我们宁可对每一台印刷机逐一发照，各记其名。"
        progress_delta: -5
        rationale:
          english: "Licensing press by press preserves the officials' discretion, but it slows the day when printing becomes a confident, settled interest."
          simp_chinese: "逐台发照保住了官员的裁量权，却延缓了印刷业形成自信而稳定利益群体的那一天。"
        effect_blocks:
          - type: seat_stance
            group: court_bureaucrats
            stance: oppose
            cooldown_months: 18
  - design_id: P03
    pool: printing_press
    issue: printing_press
    weight: 1
    title:
      english: "The Index of Dangerous Books"
      simp_chinese: "危险书籍索引"
    desc:
      english: "The clergy propose an index of dangerous books, drawn up with great care and longer than most libraries. The students, hearing the list read aloud, take it for a reading list and copy down every title."
      simp_chinese: "教士提议编制一份危险书籍索引，编得极为用心，长过大多数图书馆。学生们听人把书目念出来，只当是荐读清单，把每一个书名都抄了下来。"
    options:
      a:
        text:
          english: "We will not let the church decide which books are born guilty."
          simp_chinese: "我们不会让教会来裁定，哪些书是生来有罪的。"
        progress_delta: 10
        rationale:
          english: "Refusing a sweeping index denies the clerical authorities the power to brand printed inquiry a danger by default."
          simp_chinese: "拒绝一份包罗万象的索引，就是不让教会权威默认把印刷出来的探究打成危险之物。"
        effect_blocks:
          - type: estate_satisfaction
            estate: clergy_estate
            value: -0.05
      b:
        text:
          english: "The index is approved, and every printed argument waits upon the censor's mark."
          simp_chinese: "索引获批，每一份印出来的论点都要等审查官的批注。"
        progress_delta: -10
        rationale:
          english: "Approving the index places printed argument under religious gatekeeping and sharply strengthens the opposition to any press-driven debate."
          simp_chinese: "批准索引把印刷论辩置于宗教把关之下，也明显加强了对印刷推动辩论的反对。"
        effect_blocks:
          - type: seat_stance
            group: clergy
            stance: oppose
            cooldown_months: 24
  - design_id: P04
    pool: printing_press
    issue: printing_press
    weight: 1
    title:
      english: "Prayer Sheets for a Penny"
      simp_chinese: "一文钱的祈祷单"
    desc:
      english: "Cheap printed prayer sheets reach the villages faster than the official sermons that were meant to precede them. A parish priest complains that his congregation now corrects his readings from folded paper kept warm in a pocket."
      simp_chinese: "廉价印刷的祈祷单比本该先行一步的正式布道更快传到乡下。一位堂区神父抱怨说，他的会众如今拿着揣在口袋里捂热的折页，反过来纠正他的诵读。"
    options:
      a:
        text:
          english: "The presses are turned toward reform, one cheap sheet at a time."
          simp_chinese: "印刷机转而为改革效力，一张廉价印单接着一张。"
        progress_delta: 5
        rationale:
          english: "Turning print to reform accepts that cheap religious text can outrun the old channels, and it builds practical support for the new medium."
          simp_chinese: "让印刷为改革所用，就是承认廉价宗教文本能跑赢旧渠道，也为新媒介积攒起实际的支持。"
        effect_blocks:
          - type: seat_stance
            group: religious_reformers
            stance: support
            cooldown_months: 18
      b:
        text:
          english: "Enough, before every hedgerow preacher keeps a press of his own."
          simp_chinese: "够了，免得每个田间野道的传道人都私藏一台印刷机。"
        progress_delta: -5
        rationale:
          english: "Restricting village printing reassures the clergy that parish authority still governs how ordinary people are taught to pray."
          simp_chinese: "限制乡村印刷让教士安心，相信堂区权威仍旧管着寻常百姓如何被教导祷告。"
        effect_blocks:
          - type: estate_satisfaction
            estate: clergy_estate
            value: 0.03
  - design_id: P05
    pool: printing_press
    issue: printing_press
    weight: 1
    title:
      english: "The Scandal Sheet"
      simp_chinese: "丑闻小报"
    desc:
      english: "A printer sets court gossip beside serious argument on the same sheet, and finds both columns sell equally well. The philosophers are appalled to learn how near their reasoning sits to a duchess's indiscretions, and how much thinner the crowd is on their side of the page."
      simp_chinese: "一名印刷商把宫廷流言和严肃论辩排在同一张纸上，结果发现两栏卖得一样好。哲学家们震惊地发现，他们的推理竟与某位公爵夫人的风流韵事挨得如此之近，而围在他们这一栏前的人又少得多。"
    options:
      a:
        text:
          english: "We will not muzzle the press for printing what the court would rather bury."
          simp_chinese: "我们不会因为印刷机印出了宫廷宁愿掩埋的东西，就去封住它的口。"
        progress_delta: 5
        rationale:
          english: "Defending the press even in its vulgar misuse upholds the principle of open publication, though the Crown pays a cost in legitimacy for tolerating the scandal."
          simp_chinese: "即便印刷被低俗滥用也加以维护，能守住公开出版的原则，只是王权要为容忍这桩丑闻付出正统性的代价。"
        effect_blocks:
          - type: resource
            resource: legitimacy
            amount: -5
      b:
        text:
          english: "The bailiffs close the shop and return its type to the case."
          simp_chinese: "法警查封了店铺，把它的铅字一一放回字盘。"
        progress_delta: -10
        rationale:
          english: "Punishing the printer restores visible order by making the scandal an example, but it also teaches every onlooker that press freedom ends where court embarrassment begins."
          simp_chinese: "惩罚印刷商把丑闻立成了警示，恢复了看得见的秩序，却也让每个旁观者明白：出版自由止步于宫廷的难堪。"
        effect_blocks:
          - type: temporary_country_modifier
            key: tv_academy_debate_scandal_sheet_crackdown
            months: 12
            effects:
              public-order enforcement: 0.03
  - design_id: P06
    pool: printing_press
    issue: printing_press
    weight: 1
    title:
      english: "The Corrected Textbook"
      simp_chinese: "校正过的课本"
    desc:
      english: "A printed textbook carries corrected diagrams into every school in a single season, each copy identical to the last down to the smallest figure. What once took a copyist a winter to spread, and to spoil, now travels in weeks without a single wandering pen to blame."
      simp_chinese: "一本印刷课本在一个学季内把校正过的图表送进每一所学校，每一份都与上一份分毫不差，连最小的图形都一样。从前抄书人要花一整个冬天才能传开、也才能抄坏的东西，如今几周便可送达，再无一支走神的笔可供责怪。"
    options:
      a:
        text:
          english: "At last, a diagram that stays exactly where its author set it."
          simp_chinese: "总算有了一幅图，它老老实实待在作者摆下的位置。"
        progress_delta: 10
        rationale:
          english: "Adopting the textbook lets print prove its strongest scholarly claim: a single correction can travel faster, farther, and more faithfully than any manuscript ever could."
          simp_chinese: "采用这本课本，让印刷得以证明它最有力的学术主张：一次修正能比任何手抄本传得更快、更远，也更忠实。"
        effect_blocks:
          - type: seat_stance
            group: scholarly_community
            stance: support
            cooldown_months: 24
      b:
        text:
          english: "The committee holds the book back for another season of review."
          simp_chinese: "委员会把这本书扣下，再审查一个学季。"
        progress_delta: -5
        rationale:
          english: "Another season of review reassures the cautious teachers and their conservative patrons, but it treats print's power to standardize knowledge as a risk best delayed."
          simp_chinese: "再审查一季能安抚谨慎的教师和他们保守的赞助者，却把印刷术统一知识的能力当成一桩最好拖着的风险。"
        effect_blocks:
          - type: temporary_country_modifier
            key: tv_academy_debate_textbook_review
            months: 12
            effects:
              curricular caution: 0.02
  - design_id: P07
    pool: printing_press
    issue: printing_press
    weight: 1
    title:
      english: "The Paper Shortage"
      simp_chinese: "纸张短缺"
    desc:
      english: "The paper makers send word that debate cannot be printed on enthusiasm alone; the rag pickers are empty-handed and the mills stand quiet. Every stirring speech in the chamber, it turns out, is measured in bales that no one has bought."
      simp_chinese: "造纸匠捎来话说，辩论光凭热情是印不出来的：收破布的两手空空，纸坊也静了下来。原来议厅里每一场激昂的演说，都要用没人买过的一捆捆纸来计量。"
    options:
      a:
        text:
          english: "The treasury opens, and the mills are turning again by week's end."
          simp_chinese: "国库拨了款，纸坊到周末又重新转了起来。"
        progress_delta: 10
        rationale:
          english: "Subsidizing paper turns a material bottleneck into state-backed capacity, letting the debate spread on real sheets instead of hopeful speeches."
          simp_chinese: "补贴纸张把物资瓶颈变成国家撑腰的产能，让辩论靠真实的纸页扩散，而不是停在满怀希望的演说里。"
        effect_blocks:
          - type: resource
            resource: gold
            scale: -2
      b:
        text:
          english: "We will print within our means, or not at all."
          simp_chinese: "我们要么量入为出地印，要么干脆不印。"
        progress_delta: -10
        rationale:
          english: "Limiting the print runs protects the treasury, but it proves the new medium can be checked by supply alone, long before it reshapes opinion."
          simp_chinese: "限制印数保住了国库，却也证明新媒介单凭供应就能被拦下，远在它重塑舆论之前。"
        effect_blocks:
          - type: resource
            resource: gold
            scale: 1
  - design_id: P08
    pool: printing_press
    issue: printing_press
    weight: 1
    title:
      english: "The Anonymous Broadsides"
      simp_chinese: "匿名传单"
    desc:
      english: "Anonymous broadsides take up the issue with such thundering vigor that even its allies begin to edge away from the paste on the walls. Support like this, one supporter mutters, is the kind a man survives rather than enjoys."
      simp_chinese: "匿名传单以雷鸣般的热烈替这项议题呐喊，连它的盟友都开始躲开墙上那层浆糊。一位支持者嘟囔道，这样的支持，是人熬过去的，不是享受的。"
    options:
      a:
        text:
          english: "Let them shout, the walls have carried worse."
          simp_chinese: "由他们喊去，这些墙壁扛过更难听的话。"
        progress_delta: 5
        rationale:
          english: "Tolerating the broadsides accepts unruly public enthusiasm as part of print politics, and lets popular pressure pull the debate toward acceptance."
          simp_chinese: "容忍这些传单，就是把混乱的大众热情当作印刷政治的一部分，也让民间压力把辩论拽向接受。"
        effect_blocks:
          - type: seat_stance
            group: public_opinion
            stance: support
            cooldown_months: 12
      b:
        text:
          english: "The watch is set to trace the paste back to whoever mixed it."
          simp_chinese: "巡役受命顺着浆糊追查，看是谁调的。"
        progress_delta: -5
        rationale:
          english: "Hunting the authors calms the officials and eases the pressure in the streets, but it casts anonymous print as a threat rather than a sign of a widening debate."
          simp_chinese: "搜捕作者能安抚官员、缓解街头的压力，却把匿名印刷品塑造成威胁，而非辩论扩大的迹象。"
        effect_blocks:
          - type: temporary_country_modifier
            key: tv_academy_debate_broadsides_watch
            months: 12
            effects:
              anonymous street agitation: -0.03
  - design_id: P09
    pool: printing_press
    issue: printing_press
    weight: 1
    title:
      english: "A Foreign Press Reprints Us"
      simp_chinese: "外国印刷所转载我方"
    desc:
      english: "A foreign press reprints the Academy's arguments with fresh errors, sharpened insults, and genuinely impressive speed. The scholars can scarcely decide whether to be flattered by the theft or wounded by the spelling."
      simp_chinese: "一家外国印刷所转载了学院的论点，添上新的讹误、更刻薄的讥讽，还有着实惊人的速度。学者们几乎拿不定主意：是该为这场剽窃受宠若惊，还是该为那些错别字痛心。"
    options:
      a:
        text:
          english: "We answer them in the same ink, and on the same day."
          simp_chinese: "我们用同样的墨、在同一天回敬他们。"
        progress_delta: 10
        rationale:
          english: "Answering in print shows the Academy can fight distortion with the very same medium, though defending its authority on foreign soil costs prestige."
          simp_chinese: "以印刷回应表明学院能用同一种媒介反击歪曲，只是在异邦维护自己的权威要折损威望。"
        effect_blocks:
          - type: resource
            resource: prestige
            amount: -5
      b:
        text:
          english: "A dog barking across the border need not be answered."
          simp_chinese: "隔着国界狂吠的狗，不必去理会。"
        progress_delta: -5
        rationale:
          english: "Ignoring the reprint keeps the diplomatic tempers cooler, but it leaves foreign printers to define the Academy's argument with no reply of its own."
          simp_chinese: "不理会这次转载能让外交上的火气平些，却把学院论点的解释权拱手交给外国印刷者，自己一言不发。"
        effect_blocks:
          - type: seat_cooldown
            group: foreign_power
            cooldown_months: 12
  - design_id: P10
    pool: printing_press
    issue: printing_press
    weight: 1
    title:
      english: "The Scribes' Protest"
      simp_chinese: "抄写员的抗议"
    desc:
      english: "The scribes warn that movable type will starve honest hands and dishonest abbreviations in equal measure. Their petition is, as ever, beautifully lettered, and there is something mournful in a craft that pleads for its life in its own finest script."
      simp_chinese: "抄写员警告说，活字印刷会让诚实的双手和不诚实的缩写一同挨饿。他们的请愿书一如既往写得极美，而一门手艺以自己最工整的字迹为性命求告，其中总有几分哀伤。"
    options:
      a:
        text:
          english: "The scribes are set before the presses and taught the trays of type."
          simp_chinese: "抄写员被安排到印刷机前，教着认识一盘盘铅字。"
        progress_delta: 5
        rationale:
          english: "Retraining the scribes makes the labor shock manageable and turns a threatened old profession into a bridge toward practical acceptance of the press."
          simp_chinese: "重新训练抄写员能让这场劳动冲击变得可控，把一个受威胁的旧职业变成通往实际接受印刷机的桥梁。"
        effect_blocks:
          - type: resource
            resource: gold
            scale: -1
      b:
        text:
          english: "No craftsman should be pressed out of his own bread."
          simp_chinese: "不该把哪个匠人挤得连自己的口粮都保不住。"
        progress_delta: -5
        rationale:
          english: "Protecting the manuscript trade reassures the old literate professions, but it deliberately slows the day when reproducible type replaces the copying hand."
          simp_chinese: "保护手抄行业能安抚旧有的文书职业，却有意拖慢可复制的活字取代抄写之手的那一天。"
        effect_blocks:
          - type: seat_stance
            group: court_bureaucrats
            stance: oppose
            cooldown_months: 18
  - design_id: P11
    pool: printing_press
    issue: printing_press
    weight: 1
    title:
      english: "The Proclamation in Print"
      simp_chinese: "印成铅字的公告"
    desc:
      english: "The officials discover that a printed proclamation reaches the people before rumor has time to edit it, word for word as the Crown intended. It is a novel and slightly unsettling experience for a government to be quoted correctly."
      simp_chinese: "官员们发现，一份印刷公告能在谣言来得及改写之前就抵达民众手中，字字皆如王室本意。对一个政府而言，被准确地引用，是一种新奇而略感不安的体验。"
    options:
      a:
        text:
          english: "The Chancery orders every proclamation set in one standard type."
          simp_chinese: "文书院下令，每一份公告都用统一的字体排印。"
        progress_delta: 10
        rationale:
          english: "Standardized printed law proves the press can serve royal administration with speed and consistency, and acceptance gains a strong institutional argument."
          simp_chinese: "标准化的印刷法令证明印刷机能以速度和一致性服务王室行政，接受印刷应用也就有了强有力的制度论据。"
        effect_blocks:
          - type: temporary_country_modifier
            key: tv_academy_debate_printed_law_standardization
            months: 18
            effects:
              administrative reach and consistency: 0.03
      b:
        text:
          english: "We keep our proclamations as the heralds have always cried them."
          simp_chinese: "我们的公告，还是照传令官一贯的喊法来。"
        progress_delta: -5
        rationale:
          english: "Keeping the proclamations traditional preserves the local channels of interpretation and lets the regional elites remain useful gatekeepers of the law."
          simp_chinese: "保留传统的公告方式维系了地方的解释渠道，让地方精英继续充当法令的有用把关人。"
        effect_blocks:
          - type: seat_stance
            group: local_autonomy
            stance: oppose
            cooldown_months: 18
  - design_id: P12
    pool: printing_press
    issue: printing_press
    weight: 1
    title:
      english: "The Success of a Forbidden Book"
      simp_chinese: "禁书的畅销"
    desc:
      english: "A banned book grows popular precisely because it is banned, as books will sometimes do out of sheer spite. The censor who condemned it has, without meaning to, written the most effective advertisement of the season."
      simp_chinese: "一本禁书恰恰因为遭禁而流行起来，书籍有时就是这样，带着几分纯粹的倔强。那位定它罪的审查官，无心之间写下了这一季最有效的广告。"
    options:
      a:
        text:
          english: "The book is legalized and reissued, wrapped in official annotation."
          simp_chinese: "这本书被合法化并重新发行，外面裹着一层官方注解。"
        progress_delta: 10
        rationale:
          english: "Legalizing the book and hedging it with official annotation turns forbidden curiosity into supervised public argument, advancing acceptance while angering the clerical guardians."
          simp_chinese: "把禁书合法化、再用官方注解圈护起来，能把被禁激起的好奇转化为受监督的公共论辩，推进接纳的同时也激怒了宗教守门人。"
        effect_blocks:
          - type: estate_satisfaction
            estate: clergy_estate
            value: -0.05
      b:
        text:
          english: "Off the shelves with every last copy."
          simp_chinese: "架上一本不留，统统查抄。"
        progress_delta: -10
        rationale:
          english: "Wider confiscations restore visible order, but they also concede that printed text is dangerous enough to be fought with force."
          simp_chinese: "扩大查禁恢复了看得见的秩序，却也等于承认印刷文本危险到要动用强力去对付。"
        effect_blocks:
          - type: resource
            resource: stability
            amount: 1
  - design_id: P13
    pool: printing_press
    issue: printing_press
    weight: 1
    title:
      english: "The University's Own Press"
      simp_chinese: "大学自己的印刷所"
    desc:
      english: "A university petitions for a press of its own, weary of begging the city printers to set sober scholarship ahead of ballads and playbills. Its scholars would rather wait on their own ink than on a tradesman's sense of priorities."
      simp_chinese: "一所大学请求拥有一台自己的印刷机，实在厌倦了央求城里的印刷工把严肃学问排在歌谣和戏单之前。它的学者们宁可等自家的墨，也不愿等一个买卖人的轻重缓急。"
    options:
      a:
        text:
          english: "The university is granted a press within its own walls."
          simp_chinese: "大学获准在自己的院墙之内设一台印刷机。"
        progress_delta: 5
        rationale:
          english: "Granting the university a press makes printing a scholarly instrument rather than merely an urban trade, giving the learned a direct stake in acceptance."
          simp_chinese: "准许大学设立印刷所，让印刷成为一件学术工具，而不只是城市行业，使学者们直接从接纳中分得利益。"
        effect_blocks:
          - type: seat_stance
            group: scholarly_community
            stance: support
            cooldown_months: 18
      b:
        text:
          english: "We would have every press in the realm answer to one office."
          simp_chinese: "我们要让国中每一台印刷机，都归一个衙门管辖。"
        progress_delta: -5
        rationale:
          english: "Centralizing the presses satisfies the officials who prefer every press to answer upward, but it denies the universities a plain demonstration of scholarly self-direction."
          simp_chinese: "集中管理印刷事务能满足那些希望每台印刷机都向上负责的官员，却剥夺了大学一次展示学术自理的机会。"
        effect_blocks:
          - type: temporary_country_modifier
            key: tv_academy_debate_central_print_office
            months: 18
            effects:
              licensing consistency: 0.02
  - design_id: P14
    pool: printing_press
    issue: printing_press
    weight: 1
    title:
      english: "The Multiplied Error"
      simp_chinese: "被复制的错误"
    desc:
      english: "One faulty printed table carries the same error, faithfully and identically, through several hundred copies. Print, it is quietly noted, has learned to be wrong with a consistency the old copyists never managed."
      simp_chinese: "一张出错的印刷表格，把同一个错误忠实而分毫不差地传遍数百份副本。有人低声指出，印刷术已经学会了错得如此一致——这是从前的抄书人从未做到的。"
    options:
      a:
        text:
          english: "The presses run again, this time to print the corrections."
          simp_chinese: "印刷机再度开动，这一回印的是勘误。"
        progress_delta: 5
        rationale:
          english: "Correction sheets admit the failure while showing that print can mend itself through the very same swift circulation that spread the mistake."
          simp_chinese: "勘误单在承认失败的同时，也表明印刷术能借着传播错误的同一股迅捷去修补自身。"
        effect_blocks:
          - type: resource
            resource: gold
            scale: -1
      b:
        text:
          english: "A falsehood set in type is still a falsehood, only faster."
          simp_chinese: "谬误排成了铅字，仍旧是谬误，只是快了些。"
        progress_delta: -5
        rationale:
          english: "Treating the error as evidence against the press lets the conservative scholars argue that multiplication magnifies falsehood as readily as truth."
          simp_chinese: "把这次错误当成反对印刷术的证据，让保守学者得以主张：大量复制既能放大真理，也一样能放大谬误。"
        effect_blocks:
          - type: seat_stance
            group: scholarly_community
            stance: oppose
            cooldown_months: 12
  - design_id: P15
    pool: printing_press
    issue: printing_press
    weight: 1
    title:
      english: "The Ballad of the Question"
      simp_chinese: "议题的歌谣"
    desc:
      english: "A printed ballad explains the whole debate badly, memorably, and to a tune no one can shake before nightfall. The philosophers wince at the rhymes; the streets, meanwhile, are humming their argument back at them."
      simp_chinese: "一首印刷歌谣把整场辩论解释得既不准确又难以忘怀，配着一支入夜前谁也甩不掉的调子。哲学家们对那些韵脚直皱眉；而街头，正把他们的论点哼着还给他们。"
    options:
      a:
        text:
          english: "We let the tune carry what our footnotes never could."
          simp_chinese: "我们让这支曲子去承载脚注永远送不到的地方。"
        progress_delta: 5
        rationale:
          english: "Leaning on popular print accepts that a simplified song can carry the debate far beyond the Academy, even when it sands the argument smooth."
          simp_chinese: "借重通俗印刷品，就是承认一首简化的歌谣即便磨平了论证，也能把辩论带到学院之外很远的地方。"
        effect_blocks:
          - type: seat_stance
            group: public_opinion
            stance: support
            cooldown_months: 12
      b:
        text:
          english: "The magistrates order the ballad struck from the presses."
          simp_chinese: "地方官下令把这首歌谣从印机上撤下。"
        progress_delta: -5
        rationale:
          english: "Suppressing the vulgar version reassures the elites that philosophy will not be handed over to catchy refrains and street interpretation."
          simp_chinese: "压下这个粗俗的版本，让精英们放心：哲学不会被朗朗上口的副歌和街头解读接管。"
        effect_blocks:
          - type: estate_satisfaction
            estate: nobles_estate
            value: 0.03
  - design_id: P16
    pool: printing_press
    issue: printing_press
    weight: 1
    title:
      english: "The Noble's Libel Suit"
      simp_chinese: "贵族的诽谤诉讼"
    desc:
      english: "A noble sues a printer for making old privilege look ridiculous in cheap, legible type. The offending pamphlet did not so much argue against his rank as set it plainly on the page, where anyone with a penny could laugh."
      simp_chinese: "一名贵族起诉一名印刷商，因为廉价而清晰的铅字把旧特权印得可笑。那本触犯了他的小册子，与其说是驳斥他的身份，不如说是把它明明白白摆上纸面，任何花得起一文钱的人都能一笑。"
    options:
      a:
        text:
          english: "The court finds for the printer and lets the pamphlet stand."
          simp_chinese: "法庭判印刷商胜诉，那本小册子得以留存。"
        progress_delta: 10
        rationale:
          english: "Protecting the printer turns a noble's embarrassment into a legal precedent for public criticism, sharply advancing acceptance of the printing press."
          simp_chinese: "保护印刷商把一名贵族的难堪变成公开批评的法律先例，明显推动了对印刷机应用的接受。"
        effect_blocks:
          - type: estate_satisfaction
            estate: nobles_estate
            value: -0.05
      b:
        text:
          english: "Costly wit, this. Let him pay for it."
          simp_chinese: "好一份廉价的俏皮话，让他付钱吧。"
        progress_delta: -10
        rationale:
          english: "Fining the printer restores the noble's honor and marks privilege as a line cheap print may not cross, sharply strengthening resistance to the press."
          simp_chinese: "罚款惩戒印刷商恢复了贵族的体面，把特权划成廉价印刷不得逾越的界线，也明显加强了对印刷机的抵制。"
        effect_blocks:
          - type: estate_satisfaction
            estate: nobles_estate
            value: 0.05
  - design_id: P17
    pool: printing_press
    issue: printing_press
    weight: 1
    title:
      english: "The Edition in Many Tongues"
      simp_chinese: "多种语言的版本"
    desc:
      english: "The printers propose editions in several languages at once, which would make the argument far harder to fence in. A thought that already refuses to stay in one book now proposes to escape into every mouth in the realm."
      simp_chinese: "印刷商提议同时用数种语言出版，这将让这项论点远远更难被圈住。一个已经不肯安分待在一本书里的念头，如今又打算逃进国中每一张嘴里。"
    options:
      a:
        text:
          english: "The editions go to press in every tongue the realm speaks."
          simp_chinese: "这些版本以国中通行的每一种语言付印。"
        progress_delta: 10
        rationale:
          english: "Publishing in many tongues lets print carry the issue into communities the official language usually filters out, giving both minorities and the towns a stake in acceptance."
          simp_chinese: "以多种语言出版，让印刷品把议题带进官方语言通常过滤掉的群体，使少数群体和城镇都在接纳中分得利益。"
        effect_blocks:
          - type: seat_stance
            group: minorities
            stance: support
            cooldown_months: 24
          - type: estate_satisfaction
            estate: burghers_estate
            value: 0.03
      b:
        text:
          english: "We will keep the argument to a single official tongue."
          simp_chinese: "我们要把这项论点限定在唯一一种官方语言之内。"
        progress_delta: -5
        rationale:
          english: "A single official tongue keeps interpretation centralized and the administration tidy, but it narrows the press back into an instrument of authority."
          simp_chinese: "单一的官方语言让解释权保持集中、行政更为齐整，却把印刷术重新收窄成权威机关的工具。"
        effect_blocks:
          - type: resource
            resource: legitimacy
            amount: 3
  - design_id: P18
    pool: printing_press
    issue: printing_press
    weight: 1
    title:
      english: "A Press in the Barracks"
      simp_chinese: "营房里的印刷机"
    desc:
      english: "The officers request printed drill manuals and technical sheets, each copy identical so that no company learns the maneuver a different way. What the philosophers debate as principle, the sergeants would like delivered as instructions, correctly numbered."
      simp_chinese: "军官们请求印刷操典手册和技术单页，每一份都一模一样，好让没有哪个连队把同一个动作练成两种样子。哲学家们当作原则来辩论的东西，军士们只希望它以指令的形式送来，编号无误。"
    options:
      a:
        text:
          english: "The regimental presses are set to work turning out manuals and sheets."
          simp_chinese: "团属印刷机开动起来，印制手册和单页。"
        progress_delta: 5
        rationale:
          english: "Military manuals show that print can standardize practice under pressure, winning practical support from the officers without dragging the debate fully into the street."
          simp_chinese: "军事手册表明印刷术能在高压之下统一操作，从军官那里赢得务实的支持，又不至于把辩论完全拖上街头。"
        effect_blocks:
          - type: seat_stance
            group: professional_military
            stance: support
            cooldown_months: 18
      b:
        text:
          english: "We keep the presses to civil business alone."
          simp_chinese: "我们让印刷机只管民政事务。"
        progress_delta: -5
        rationale:
          english: "Keeping the presses civil reassures the conservative officers that barracks discipline will not be rewritten by printed sheets, but it denies the press a genuinely useful technical role."
          simp_chinese: "让印刷机只管民政事务，能让保守的军官相信营房纪律不会被印刷单页改写，却也否认了印刷术一个真正有用的技术角色。"
        effect_blocks:
          - type: temporary_country_modifier
            key: tv_academy_debate_civil_press_boundary
            months: 12
            effects:
              barracks information discipline: 0.02
  - design_id: P19
    pool: printing_press
    issue: printing_press
    weight: 1
    title:
      english: "The Famous Printer"
      simp_chinese: "成名的印刷商"
    desc:
      english: "A printer grows famous enough to irritate the scholars who actually wrote the words he is celebrated for setting. He is invited to dinners, quoted in salons, and praised for sentences he merely spaced evenly."
      simp_chinese: "一名印刷商出了名，名气大到足以惹恼那些真正写下这些文字、而他不过是把它们排好的学者。他被请去赴宴，在沙龙里被人引用，为一些他只是排得匀称的句子受人称道。"
    options:
      a:
        text:
          english: "So be it, fame sells as many pages as truth does."
          simp_chinese: "也罢，名声卖出去的页数，并不比真理少。"
        progress_delta: 5
        rationale:
          english: "Using the printer's fame accepts that the medium now has its own public figures, letting the urban trades turn all that attention into support for acceptance."
          simp_chinese: "借用印刷商的名声，等于承认这种媒介已经有了自己的公众人物，让城市行业把这份关注转化为对接纳的支持。"
        effect_blocks:
          - type: estate_satisfaction
            estate: burghers_estate
            value: 0.04
      b:
        text:
          english: "The Academy sets the authors' names back above the printer's."
          simp_chinese: "学院把作者的名字重新放回印刷商之上。"
        progress_delta: -5
        rationale:
          english: "Recentering the scholars protects learned authorship from commercial showmanship, but it steers the debate away from the very public power the press had gained."
          simp_chinese: "重新把学者放回中心，能保护学术作者免受商业作秀的遮蔽，却也把辩论从印刷术刚刚赢得的公共力量那里引开。"
        effect_blocks:
          - type: seat_cooldown
            group: scholarly_community
            cooldown_months: 18
  - design_id: P20
    pool: printing_press
    issue: printing_press
    weight: 1
    title:
      english: "The Censor's Delay"
      simp_chinese: "审查官的拖延"
    desc:
      english: "The censor deliberates so long that the issue is in danger of dying quietly and politely in a locked drawer. No verdict has been refused; it is simply that the ink of the decision seems reluctant ever to dry."
      simp_chinese: "审查官斟酌得太久，这项议题眼看就要在一只上锁的抽屉里，安静而体面地死去。裁决并未被驳回；只是那道决定的墨迹，似乎永远不情愿干透。"
    options:
      a:
        text:
          english: "Ink dries faster than a censor's caution."
          simp_chinese: "墨迹干得，总比审查官的谨慎快。"
        progress_delta: 10
        rationale:
          english: "Bypassing the censor keeps procedure from smothering the issue and proves that printing can outrun official delay, though legitimacy suffers for taking the irregular road."
          simp_chinese: "绕过审查官能防止程序把议题闷死，也证明印刷术可以跑赢官方的拖延，只是走了非常规的路，正统性要受些损。"
        effect_blocks:
          - type: resource
            resource: legitimacy
            amount: -5
      b:
        text:
          english: "The Academy waits, exactly as the process requires."
          simp_chinese: "学院照着流程的要求，等着。"
        progress_delta: -10
        rationale:
          english: "Respecting the process lets the bureaucrats define delay as prudence, sharply weakening the case that printing deserves faster channels of approval."
          simp_chinese: "尊重既定流程让官僚得以把拖延定义为审慎，明显削弱了印刷术理应享有更快审批渠道的论点。"
        effect_blocks:
          - type: seat_stance
            group: court_bureaucrats
            stance: oppose
            cooldown_months: 24
excluded_events: []
