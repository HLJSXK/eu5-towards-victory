random_events:
  - design_id: SR01
    pool: scientific_revolution
    issue: scientific_revolution
    weight: 1
    title:
      english: "A Table of Observations"
      simp_chinese: "观察记录表"
    desc:
      english: "Column after column of repeated observations is set before the Academy, each entry too plain to dazzle and too consistent to wave away. The ancient authorities still command the room; the figures, however, have quietly stopped bowing to them."
      simp_chinese: "一栏又一栏的重复观察记录被摆到学院面前，每一条都平淡得难以炫目，却又一致得无法挥手带过。古老的权威仍然镇得住全场，可这些数字，已经悄悄不再向他们低头了。"
    options:
      a:
        text:
          english: "The scribes copy the table into the record, line by patient line."
          simp_chinese: "书吏把记录表一行行誊入卷宗，任那些数字自己说话。"
        progress_delta: 10
        rationale:
          english: "Trusting the patient table gives the debate a reproducible footing: the issue no longer leans on one dazzling claim but on evidence any cautious scholar may check for himself, and the record of it earns quiet credit over time."
          simp_chinese: "相信这份耐心的记录表，会给辩论一个可复现的立足点：议题不再依赖某个耀眼的单一主张，而是依靠任何谨慎学者都能亲自核对的证据，这份记录也会随时间悄悄赢得信誉。"
        effect_blocks:
          - type: seat_stance
            group: scholarly_community
            stance: support
            cooldown_months: 18
          - type: temporary_country_modifier
            key: tv_academy_debate_observation_tables
            months: 24
            effects:
              "recorded observation credibility": 0.03
      b:
        text:
          english: "One swallow does not make a summer."
          simp_chinese: "一燕不成夏。"
        progress_delta: -10
        rationale:
          english: "Naming the evidence an anomaly keeps the inherited explanation intact and soothes those who dread seeing tables set above the commentaries, but it teaches the chamber that repetition, however patient, may be dismissed the moment it grows inconvenient."
          simp_chinese: "把证据称作异常，能保住继承下来的解释，也安抚了那些害怕表格凌驾于注疏之上的人；但这会让会场明白：无论多么耐心的重复，只要变得不合心意，都可以被搁在一边。"
        effect_blocks:
          - type: seat_stance
            group: scholarly_community
            stance: oppose
            cooldown_months: 18
          - type: estate_satisfaction
            estate: clergy_estate
            value: 0.05
  - design_id: SR02
    pool: scientific_revolution
    issue: scientific_revolution
    weight: 1
    title:
      english: "The Failed Replication"
      simp_chinese: "复验失败"
    desc:
      english: "A celebrated result is repeated before careful witnesses and simply declines to appear. The silence after the empty trial is mortifying, and it is also the first wholly honest sound the chamber has heard all week."
      simp_chinese: "一项备受称颂的结果在谨慎的见证者面前被重新试验，却干脆不肯现身。空手而归后的沉默令人窘迫，可它也是会场整整一周里听到的第一声全然诚实的声音。"
    options:
      a:
        text:
          english: "The clerks print the empty result beside the famous one."
          simp_chinese: "书记员把这次一无所获的结果，紧挨着那项著名成果一并刊印。"
        progress_delta: 10
        rationale:
          english: "Publishing the failure folds correction into the method instead of leaving it a scandal outside the door. The Academy loses face for a season, yet the debate swings hard toward accepting replication as a rule of truth."
          simp_chinese: "公布失败会把纠错纳入方法本身，而不是把它当成门外的丑闻。学院一时会失些面子，可辩论也会强烈转向接受复验作为求真的规则。"
        effect_blocks:
          - type: resource
            resource: prestige
            amount: -10
          - type: seat_stance
            group: scholarly_community
            stance: support
            cooldown_months: 18
      b:
        text:
          english: "We let the famous result keep its reputation a while longer."
          simp_chinese: "我们让那项著名成果，再多保住一阵名声。"
        progress_delta: -10
        rationale:
          english: "Concealing the empty trial protects reputations and keeps the patrons calm, but it tells every witness that fame outweighs repeated proof the moment the result turns inconvenient, and the Academy's own great mind takes note."
          simp_chinese: "隐瞒这次空手的试验，能保住名声、安抚资助人，却也在告诉每一位见证者：一旦结果变得不便，声望就压过反复的证明——学院自己那位大科学家也把这一切看在眼里。"
        effect_blocks:
          - type: resource
            resource: prestige
            amount: 5
          - type: seat_stance
            group: great_scientist
            stance: oppose
            cooldown_months: 12
  - design_id: SR03
    pool: scientific_revolution
    issue: scientific_revolution
    weight: 1
    title:
      english: "A Proof in Symbols"
      simp_chinese: "数学证明"
    desc:
      english: "A mathematician renders the disputed natural question into symbols so spare that several officials look personally accused by their clarity. What had passed for philosophy now lies on the page as a chain of necessity, link by unforgiving link."
      simp_chinese: "一名数学家把争议中的自然问题化为极其简练的符号，简练得让好几位官员觉得那份清晰是在当面指控自己。原本被当作哲学的东西，如今在纸面上化作一串必然，一环紧扣一环，毫不留情。"
    options:
      a:
        text:
          english: "We follow the symbols wherever the necessity leads."
          simp_chinese: "符号指向哪里，我们就跟到哪里。"
        progress_delta: 10
        rationale:
          english: "Accepting the proof moves the debate from inherited description to demonstrable relation. It sharpens the Great Scientist's command of method and hands scholars a precise language in which acceptance can be spoken without hedging."
          simp_chinese: "接受这项证明，会让辩论从继承下来的描述转向可展示的关系。它会磨砺大科学家对方法的掌控，也给学者们一种精确的语言，让他们谈接受时不必再含糊其辞。"
        effect_blocks:
          - type: scientist_attribute
            adm: 1
            dip: 0
          - type: seat_stance
            group: scholarly_community
            stance: support
            cooldown_months: 18
      b:
        text:
          english: "Chalk is not wisdom."
          simp_chinese: "粉笔画得再满，也不是智慧。"
        progress_delta: -5
        rationale:
          english: "Demanding plain tradition does not defeat the new claim outright, but it slows acceptance by insisting that inherited language remain the only respectable way to speak of nature, a stance the older nobility applauds and one that lets the Crown look reassuringly unchanged."
          simp_chinese: "要求沿用朴素传统，并不能彻底击败新主张，却会坚持旧语言才是谈论自然的唯一体面方式，从而放慢接受的脚步——年长的贵族为此叫好，王权也因显得稳如往昔而受益。"
        effect_blocks:
          - type: seat_stance
            group: nobility
            stance: oppose
            cooldown_months: 12
          - type: resource
            resource: legitimacy
            amount: 5
  - design_id: SR04
    pool: scientific_revolution
    issue: scientific_revolution
    weight: 1
    title:
      english: "The Instrument Maker's Claim"
      simp_chinese: "仪器匠的主张"
    desc:
      english: "An instrument maker arrives with lenses, screws, brass fittings, and the serene certainty of a man who has decided that scholars simply need better hands. Better tools, he insists, do not yield better toys; they yield better truth."
      simp_chinese: "一名仪器匠带着镜片、螺丝和黄铜部件走了进来，还带着一种笃定的从容——他早已认定，学者们不过是需要一双更好的手罢了。他坚称，更好的工具造出的不是更好的玩具，而是更好的真理。"
    options:
      a:
        text:
          english: "The treasurer counts out coin for lenses, screws, and brass."
          simp_chinese: "司库数出银钱，买下镜片、螺丝与黄铜。"
        progress_delta: 10
        rationale:
          english: "Funding the instruments makes the debate materially testable: the Academy concedes that truth may rest on calibrated tools as much as on learned eyes. The outlay is real, but toolmakers and experimental scholars win a seat at the argument."
          simp_chinese: "资助这些仪器，会让辩论获得可以实际检验的条件：学院承认真理不仅系于博学的眼睛，也可能系于校准过的工具。开销确实不小，但工具匠与实验学者由此在争论中占得一席。"
        effect_blocks:
          - type: resource
            resource: gold
            scale: -2
          - type: seat_stance
            group: burghers
            stance: support
            cooldown_months: 18
      b:
        text:
          english: "Trinkets, the lot of it."
          simp_chinese: "净是些玩意儿罢了。"
        progress_delta: -10
        rationale:
          english: "Distrusting tool-made claims shields old scholarly habits from any dependence on artisans and their devices. It reverses acceptance sharply, because the new method now looks like mechanical trickery rather than disciplined inquiry, and the burghers who make such tools feel the slight."
          simp_chinese: "不信任由工具制造出的主张，能让旧有的学术习惯不必依赖工匠和他们的器具。它会明显拉低接受度，因为新方法这下显得像机械把戏，而非严谨的探究；而那些打造这些工具的市民商人，也感到被轻慢了。"
        effect_blocks:
          - type: seat_stance
            group: scholarly_community
            stance: oppose
            cooldown_months: 18
          - type: estate_satisfaction
            estate: burghers_estate
            value: -0.05
  - design_id: SR05
    pool: scientific_revolution
    issue: scientific_revolution
    weight: 1
    title:
      english: "The Academy Experiment Code"
      simp_chinese: "学院实验守则"
    desc:
      english: "Reformers propose a code for witnessing, recording, and repeating experiments: columns, signatures, and enough procedure to make every informal genius sigh into his sleeve. Trust, they argue, ought to leave a paper trail."
      simp_chinese: "改革者提议制定一套见证、记录与重复实验的守则——表格、签名，外加足以让每一位随性天才对着袖口叹气的繁琐程序。他们主张：信任也该留下纸面的痕迹。"
    options:
      a:
        text:
          english: "The clerks rule the columns and pass the pen for signatures."
          simp_chinese: "书记员划好表格的栏目，把笔递过去要人签字。"
        progress_delta: 10
        rationale:
          english: "Adopting the code turns experimental credibility into a shared institution rather than a point of personal honor. The paperwork weighs on everyone, but acceptance grows easier once witnesses can lay one trial's record beside another's."
          simp_chinese: "采纳这套守则，会把实验的可信度变成一种共同的制度，而不再是个人荣誉的问题。文书负担压在每个人身上，但只要见证者能把一次试验的记录与另一次并排比对，接受新方法也就更容易了。"
        effect_blocks:
          - type: seat_stance
            group: court_bureaucrats
            stance: support
            cooldown_months: 18
          - type: temporary_country_modifier
            key: tv_academy_debate_experiment_code
            months: 24
            effects:
              "academy record-keeping burden": -0.02
      b:
        text:
          english: "We would sooner trust a gentleman's word than a clerk's column."
          simp_chinese: "比起书记员的表格，我们更愿意相信一位绅士的一句话。"
        progress_delta: -5
        rationale:
          english: "Keeping gentlemanly trust preserves elite ease and spares honorable witnesses from bowing to clerks. The issue slips back only moderately, since private trust still permits experiments, but it weakens repetition as a form of public proof, an arrangement the nobility is glad to keep."
          simp_chinese: "保持绅士式的信任，能维护精英的从容，也免得体面的见证者向书记员低头。议题只会适度后退，因为私人信任仍允许实验存在，却削弱了复验作为公共证明的分量——贵族乐得维持这样的安排。"
        effect_blocks:
          - type: seat_stance
            group: nobility
            stance: oppose
            cooldown_months: 18
          - type: estate_satisfaction
            estate: nobles_estate
            value: 0.05
  - design_id: SR06
    pool: scientific_revolution
    issue: scientific_revolution
    weight: 1
    title:
      english: "The Clerical Cosmology Objection"
      simp_chinese: "神职宇宙论异议"
    desc:
      english: "The clergy warn that the new model rearranges rather more than the heavens. If the sky can be argued from observation, then sermons, courts, and crowns may each be asked, in time, to explain what else they have inherited without proof."
      simp_chinese: "神职人员警告说，新的天体模型重新排布的，远不止是星辰。若天空可以凭观察来争辩，那么讲坛、法庭与王冠，迟早都可能被追问：它们还有多少东西，只是未经证明便继承了下来。"
    options:
      a:
        text:
          english: "We will not ask the heavens for permission to look."
          simp_chinese: "仰观星空，我们不必先向上天请示。"
        progress_delta: 10
        rationale:
          english: "Defending inquiry raises the scientific method into a matter of principle rather than a narrow astronomical quarrel, driving the debate hard toward acceptance while setting clerical authority firmly at a distance."
          simp_chinese: "捍卫探究，会把科学方法抬升为一个原则问题，而不只是狭隘的天文学争执，从而强力推动辩论走向接受，同时也把神职权威明确地推远了一步。"
        effect_blocks:
          - type: estate_satisfaction
            estate: clergy_estate
            value: -0.1
          - type: seat_stance
            group: scholarly_community
            stance: support
            cooldown_months: 18
      b:
        text:
          english: "The scholars trim the model until it no longer troubles the pulpit."
          simp_chinese: "学者们修剪这套模型，直到它不再惊动讲坛为止。"
        progress_delta: -10
        rationale:
          english: "Softening the model reassures the religious authorities that doctrine will not be overturned by calculation, but it teaches the Academy to retreat the moment observation grows politically dangerous."
          simp_chinese: "缓和这套模型，能让宗教权威相信教义不会被计算推翻，却也教会了学院：一旦观察变得政治上危险，就该退让。"
        effect_blocks:
          - type: estate_satisfaction
            estate: clergy_estate
            value: 0.1
          - type: seat_stance
            group: clergy
            stance: oppose
            cooldown_months: 18
  - design_id: SR07
    pool: scientific_revolution
    issue: scientific_revolution
    weight: 1
    title:
      english: "A Prediction Comes True"
      simp_chinese: "预言成真"
    desc:
      english: "A calculation names the very hour of a natural event, and the event arrives with uncomfortable punctuality. For one long moment, even the skeptics must decide whether coincidence has lately taken up mathematics."
      simp_chinese: "一项计算指名道姓地预告了某场自然现象发生的时刻，而那现象竟准时得令人不安。有那么漫长的一瞬，连怀疑者都不得不掂量：巧合是不是近来也开始钻研数学了。"
    options:
      a:
        text:
          english: "Criers carry the calculation and its keeping through the streets."
          simp_chinese: "报事人把这项计算，连同它的应验，一路喊遍街巷。"
        progress_delta: 10
        rationale:
          english: "Publicizing the prediction hands the new method a victory anyone can see: it did not merely explain the past, it named the world in advance and was proved right before witnesses, and the crowd will now expect such feats again."
          simp_chinese: "宣扬这次预测，会给新方法一场人人可见的胜利：它不只解释了过去，还预先说中了未来，并在众目睽睽之下得到应验——从此民众也会期待它再来一次。"
        effect_blocks:
          - type: resource
            resource: prestige
            amount: 10
          - type: temporary_country_modifier
            key: tv_academy_debate_prediction_expectations
            months: 24
            effects:
              "public expectation after accurate prediction": 0.03
      b:
        text:
          english: "A lucky guess, nothing more."
          simp_chinese: "不过是碰巧猜中，仅此而已。"
        progress_delta: -10
        rationale:
          english: "Calling the success mere coincidence calms the conservative listeners and denies the reformers a triumphal example, but it also teaches the room that predictive evidence can be shrugged away, and the scholars who did the arithmetic will not forget the slight."
          simp_chinese: "把这次成功说成纯属巧合，能安抚保守的听众，也不给改革派留下一个可供炫耀的样本，却也让会场学会：预测性的证据，是可以耸耸肩带过的——而那些做了运算的学者，不会忘记这份轻慢。"
        effect_blocks:
          - type: resource
            resource: stability
            amount: 2.5
          - type: seat_stance
            group: scholarly_community
            stance: oppose
            cooldown_months: 12
  - design_id: SR08
    pool: scientific_revolution
    issue: scientific_revolution
    weight: 1
    title:
      english: "The Laboratory Accident"
      simp_chinese: "实验室事故"
    desc:
      english: "A demonstration bursts apart with force enough to settle, at least, the question of whether experiment has energy. Smoke drifts along the rafters while both sides hurry to claim the wreckage as evidence."
      simp_chinese: "一场演示轰然炸开，那股力道至少解决了一个问题：实验究竟有没有能量。烟雾顺着屋梁飘散，两边却都抢着把这堆残骸说成对自己有利的证据。"
    options:
      a:
        text:
          english: "The workmen fit new guards to the bench and light the next trial."
          simp_chinese: "工匠给实验台装上新的防护，接着点起了下一场试验。"
        progress_delta: 5
        rationale:
          english: "Improving safety treats the accident as a failure of procedure rather than of experiment itself, so momentum survives, at a practical cost and with a little more caution built into every future demonstration."
          simp_chinese: "改进安全，会把事故解释为程序的失败，而非实验本身的失败，因此推进的势头得以保住——代价是实实在在的开销，也让日后每一场演示都多添了几分谨慎。"
        effect_blocks:
          - type: resource
            resource: gold
            scale: -1
          - type: temporary_country_modifier
            key: tv_academy_debate_laboratory_safety_rules
            months: 24
            effects:
              "safer experimental demonstrations": 0.03
      b:
        text:
          english: "We put out the fires and lock the laboratory doors."
          simp_chinese: "我们扑灭火头，把实验室的门锁上。"
        progress_delta: -10
        rationale:
          english: "Suspending experiments restores public order and spares the Academy further embarrassment, but it hands opponents a tidy story to repeat in the galleries: dangerous methods have no business steering the realm."
          simp_chinese: "暂停实验，能恢复公共秩序，也免去学院再出更多的洋相，却给了反对者一个可以在旁听席上反复念叨的现成说法：危险的方法，没资格掌舵这个国家。"
        effect_blocks:
          - type: resource
            resource: stability
            amount: 2.5
          - type: seat_stance
            group: public_opinion
            stance: oppose
            cooldown_months: 12
  - design_id: SR09
    pool: scientific_revolution
    issue: scientific_revolution
    weight: 1
    title:
      english: "The Artisan's Knowledge"
      simp_chinese: "工匠的知识"
    desc:
      english: "An artisan settles in an afternoon a practical problem that scholars have spent weeks dressing in Latin. When his tool chest lands on the table, several elegant commentaries suddenly look very heavy indeed."
      simp_chinese: "一名工匠用一个下午，解决了学者们花数周时间用拉丁文精心包装的实际难题。当他的工具箱往桌上一放，几篇文采斐然的注释，忽然显得沉重得可以。"
    options:
      a:
        text:
          english: "The register admits the artisan's result alongside the learned ones."
          simp_chinese: "名册把这名工匠的成果，与那些博学之人的成果并列在册。"
        progress_delta: 10
        rationale:
          english: "Admitting artisan evidence widens truth-making beyond classical learning and shows the room that tested practice can correct a learned theory, the sort of correction that keeps recurring once it is allowed even once."
          simp_chinese: "接纳工匠的证据，会把求真的范围扩展到古典学问之外，也向会场表明：经受检验的实践，能够修正书本上的理论——而这样的修正，只要被允许过一次，便会一再出现。"
        effect_blocks:
          - type: seat_stance
            group: burghers
            stance: support
            cooldown_months: 18
          - type: temporary_country_modifier
            key: tv_academy_debate_artisan_demonstrations
            months: 24
            effects:
              "practical problem solving in academy debates": 0.03
      b:
        text:
          english: "Rough hands, rougher proof."
          simp_chinese: "手粗，证据也粗。"
        progress_delta: -5
        rationale:
          english: "Keeping the scholarly hierarchy assures the learned elite that social rank still decides whose evidence counts, but it throws away a useful proof for the sole crime of arriving in calloused hands, and the nobility rest easier for it."
          simp_chinese: "维持学术等级，能让博学的精英相信：社会身份依旧决定谁的证据算数，却也仅仅因为证据出自一双长满老茧的手，就把它白白丢弃——贵族倒因此更安心了。"
        effect_blocks:
          - type: seat_stance
            group: scholarly_community
            stance: oppose
            cooldown_months: 12
          - type: estate_satisfaction
            estate: nobles_estate
            value: 0.05
  - design_id: SR10
    pool: scientific_revolution
    issue: scientific_revolution
    weight: 1
    title:
      english: "The Natural History Cabinet"
      simp_chinese: "自然史陈列柜"
    desc:
      english: "Collectors propose a cabinet where shells, bones, seeds, and stones are arranged by observed likeness rather than inherited category. The old labels still slide neatly into the drawers, which is precisely the trouble."
      simp_chinese: "收藏家提议建一座陈列柜，把贝壳、骨骼、种子与石块，按亲眼所见的相似之处来排列，而不是按继承下来的类别摆放。旧标签仍能整整齐齐地滑进抽屉——而这，恰恰就是麻烦所在。"
    options:
      a:
        text:
          english: "We arrange the drawers by what our eyes report, not what the books decreed."
          simp_chinese: "抽屉如何排列，我们听凭眼睛所见，而非书本所定。"
        progress_delta: 5
