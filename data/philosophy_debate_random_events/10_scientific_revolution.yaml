    title:
      english: "The New Method Named"
      simp_chinese: "新方法得名"
    desc:
      english: "Someone gives the method a name, and all at once a loose cluster of habits becomes a movement. Friends repeat the word with relief, opponents with alarm, and the undecided with the uneasy sense that history may be about to need a label."
      simp_chinese: "有人给这套方法取了个名字，一簇松散的习惯，转眼之间就成了一场运动。支持者如释重负地念着这个词，反对者则警惕地念着它，而犹疑者念起它时，隐隐生出一种不安：历史，也许就要用得上一个标签了。"
    options:
      a:
        text:
          english: "The word is spoken into the record, and the movement takes its name."
          simp_chinese: "这个词被写进卷宗，这场运动，就此有了名字。"
        progress_delta: 10
        rationale:
          english: "Embracing the name turns scattered practices into a recognizable program, making acceptance easier to organize and to defend. The same clarity, however, also helps the opponents gather themselves against it."
          simp_chinese: "接受这个名字，会把分散的做法变成一个可以辨认的纲领，使接纳更易于组织，也更易于辩护。可同样的这份清晰，也帮着反对者，把自己重新聚拢起来对抗它。"
