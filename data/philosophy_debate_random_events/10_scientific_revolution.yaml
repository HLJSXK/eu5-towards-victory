    weight: 1
    title:
      english: "The Dissection of Error"
      simp_chinese: "解剖错误"
    desc:
      english: "Scholars propose studying errors as data, a suggestion that quietly threatens a great many careers. All at once, every botched calculation, cracked lens, and spoiled sample looks less like shame and more like evidence that arrived at an inconvenient hour."
      simp_chinese: "学者提议把错误也当作数据来研究，这个提议悄悄威胁到了许多人的仕途。转眼之间，每一次算砸的运算、每一片裂开的镜片、每一份变质的样本，都不再那么像耻辱，倒更像是来得不合时宜的证据。"
