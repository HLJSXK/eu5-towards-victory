          simp_chinese: "避免命名，能让辩论显得不那么咄咄逼人，也不给反对者留下一面可供攻击的旗帜。可它同样会消磨势头，因为支持者很难围着一堆连喊都没法喊出名字的习惯，聚起阵势来。"
