random_events:
  - design_id: C01
    pool: confessionalism
    issue: confessionalism
    weight: 1
    title:
      english: "The Crown's Confession"
      simp_chinese: "君主的信仰告白"
    desc:
      english: "The courtiers finally ask aloud what the antechambers have whispered for a season: should the Crown's faith stand in the open as a rule for the whole realm, or remain a private habit, professed by chapel attendance and the occasional well-judged silence?"
      simp_chinese: "朝臣们终于当众问出前厅里已窃语整整一季的话题：君主的信仰究竟该公开立作全国的准则，还是仍旧只是私人习惯——靠出席礼拜和几次恰到好处的沉默来表白？"
    options:
      a:
        text:
          english: "The Crown declares its confession a rule of state."
          simp_chinese: "君主将自己的信仰告白定为国策。"
        progress_delta: 10
        rationale:
          english: "Declaring the confession openly makes the Crown the acknowledged patron of the confessional settlement, a signal strong enough to move reformers toward acceptance, while noble households that preferred a little ambiguity find the door closed."
          simp_chinese: "公开宣示信纲，君主便成了宗派定制公认的庇护者；这个信号强得足以把改革派推向接受，只是那些偏爱几分模糊余地的贵族家族，从此再无回旋。"
        effect_blocks:
          - type: seat_stance
            group: religious_reformers
            stance: support
            cooldown_months: 24
          - type: estate_satisfaction
            estate: nobles_estate
            value: -0.03
      b:
        text:
          english: "We keep the royal faith to the chapel and let silence do the rest."
          simp_chinese: "我们把王室信仰留在礼拜堂里，余下的交给沉默。"
        progress_delta: -10
        rationale:
          english: "Keeping court faith private spares the royal household from becoming a confessional banner and calms the clergy, but it makes acceptance look premature, even politically needless."
          simp_chinese: "让宫廷信仰留在私下，王室便不必自充宗派旗帜，教士也就安心；可这么一来，接受该议题就显得为时过早，甚至没有政治上的必要。"
        effect_blocks:
          - type: seat_cooldown
            group: clergy
            cooldown_months: 18
          - type: estate_satisfaction
            estate: clergy_estate
            value: 0.03
  - design_id: C02
    pool: confessionalism
    issue: confessionalism
    weight: 1
    title:
      english: "The Parish Registers"
      simp_chinese: "堂区登记簿"
    desc:
      english: "Reformers lay a stack of parish registers before the Academy and make their case plainly: belief, marriage, and birth cannot guide policy until the state can read them all in one steady hand. The clerks, for their part, look delighted."
      simp_chinese: "改革者把一摞堂区登记簿摊在学院面前，把话说得直白：信仰、婚姻与出生，若国家不能以同一手工整字迹尽数读懂，就当不了政策的依据。倒是那几位书记员，看上去颇为欢欣。"
    options:
      a:
        text:
          english: "We order every parish to keep its register in one steady hand."
          simp_chinese: "我们下令各堂区都以工整字迹保存登记簿。"
        progress_delta: 10
        rationale:
          english: "Required registers turn confession into legible administration, so bureaucrats can treat doctrine as a system to be governed, even as parish clergy resent being measured by a state form."
          simp_chinese: "强制登记把信仰告白变成可读的行政资料，官僚便能把教义当作一套可治理的体系来办；只是地方教士，难免反感自己被一张国家表格丈量。"
        effect_blocks:
          - type: seat_stance
            group: court_bureaucrats
            stance: support
            cooldown_months: 18
          - type: estate_satisfaction
            estate: clergy_estate
            value: -0.03
      b:
        text:
          english: "The registers stay in the parish chest, as they always have."
          simp_chinese: "登记簿一如往常，留在堂区的箱柜里。"
        progress_delta: -5
        rationale:
          english: "Leaving records in the parish preserves local discretion and avoids a fight over oversight, but it keeps confession from ever becoming a realm-wide administrative standard."
          simp_chinese: "让记录留在堂区，地方的自主保住了，也不必为监督权翻脸；可信仰告白，也就永远成不了通行全国的行政标准。"
        effect_blocks:
          - type: seat_stance
            group: local_autonomy
            stance: oppose
            cooldown_months: 18
          - type: estate_satisfaction
            estate: clergy_estate
            value: 0.03
  - design_id: C03
    pool: confessionalism
    issue: confessionalism
    weight: 1
    title:
      english: "The Licensed Pulpit"
      simp_chinese: "讲道许可"
    desc:
      english: "Now that doctrine has begun to sound like government, the pulpit no longer feels merely local. Preachers want to know plainly: when every sermon can be mistaken for policy, who is permitted to speak for orthodoxy?"
      simp_chinese: "如今教义开始听起来像政务，讲坛便不再只是地方的事。传道人想要个明白话：当每一篇讲道都可能被当成政策来听，究竟谁才准许代表正统发声？"
    options:
      a:
        text:
          english: "The Crown grants a license to every pulpit that would speak for orthodoxy."
          simp_chinese: "凡欲代表正统发声的讲坛，都须领取王室颁发的许可。"
        progress_delta: 5
        rationale:
          english: "Central licensing gives the confessional settlement one controlled voice and quiets contradictory preaching, advancing acceptance through good order rather than sweeping reform."
          simp_chinese: "中央许可给宗派定制留下一个受控的声音，压住彼此矛盾的布道；它靠的是秩序，而非激烈改革，来推动接受。"
        effect_blocks:
          - type: resource
            resource: stability
            amount: 1
          - type: seat_stance
            group: court_bureaucrats
            stance: support
            cooldown_months: 12
      b:
        text:
          english: "Let the old pulpits be."
          simp_chinese: "由着那些老讲坛去吧。"
        progress_delta: -5
        rationale:
          english: "Preserving local custom reassures the parishes that no familiar voice will be silenced, but it leaves doctrine too uneven to carry acceptance with any force."
          simp_chinese: "保留地方惯例，各堂区便安心：熟悉的声音不会被噤声；可教义也因此参差不齐，难以有力地推动接受。"
        effect_blocks:
          - type: seat_stance
            group: local_autonomy
            stance: oppose
            cooldown_months: 18
          - type: temporary_country_modifier
            key: tv_academy_debate_local_pulpits
            months: 12
            effects:
              "local preaching discretion preserved": 0.02
  - design_id: C04
    pool: confessionalism
    issue: confessionalism
    weight: 1
    title:
      english: "The Noble Chapel"
      simp_chinese: "贵族礼拜堂之争"
    desc:
      english: "A great house keeps up a chapel rite that no longer fits the confession now taking shape. Its defenders call the practice family honor; its opponents call it a loophole with candles."
      simp_chinese: "一个显赫家族仍在自家礼拜堂里维持旧例，而这套做法已同正在成形的国家信纲不合。辩护者称之为家族荣誉，反对者则说，那不过是点着蜡烛的一个漏洞。"
    options:
      a:
        text:
          english: "The bishop's visitors shutter the family chapel until its rites conform."
          simp_chinese: "主教的巡查员查封了这座家族礼拜堂，直到其礼仪归于一统。"
        progress_delta: 10
        rationale:
          english: "Enforcing uniformity proves that not even noble privilege can exempt a household from the confessional settlement, handing acceptance a concrete victory at the price of noble goodwill."
          simp_chinese: "强制统一证明连贵族特权也不能让一家一户豁免于宗派定制之外，给接受派挣得一场看得见的胜利，代价则是贵族的好感。"
        effect_blocks:
          - type: estate_satisfaction
            estate: nobles_estate
            value: -0.05
          - type: seat_stance
            group: religious_reformers
            stance: support
            cooldown_months: 18
      b:
        text:
          english: "We let the old family keep its candles."
          simp_chinese: "我们让这个老家族留着自己的烛火。"
        progress_delta: -10
        rationale:
          english: "Tolerating the chapel buys noble cooperation and keeps household privilege intact, but it teaches everyone watching that the confessional settlement will bend before rank."
          simp_chinese: "容忍这座礼拜堂能换来贵族的配合，也保全了家族特权；可这也让所有旁观者看清：宗派定制，会在门第面前弯腰。"
        effect_blocks:
          - type: estate_satisfaction
            estate: nobles_estate
            value: 0.05
          - type: seat_stance
            group: nobility
            stance: oppose
            cooldown_months: 18
  - design_id: C05
    pool: confessionalism
    issue: confessionalism
    weight: 1
    title:
      english: "The Catechism Draft"
      simp_chinese: "教理问答草案"
    desc:
      english: "Scholars produce a catechism short enough for a child to memorize and sharp enough for grown men to quarrel over. Its margins, crowded with rival hands, already look like a battlefield."
      simp_chinese: "学者们写出一份教理问答，短到孩子也背得下，锋利到成年人也要争执。页边空白挤满了各家笔迹，早已像一片战场。"
    options:
      a:
        text:
          english: "We send it to the printing house before the arguments can catch up."
          simp_chinese: "趁争论还没追上来，我们先把它送进印坊。"
        progress_delta: 10
        rationale:
          english: "Printing the catechism turns confessional doctrine into instruction that can be repeated in every classroom and pulpit, pushing acceptance forward while provoking the clergy who dislike the chosen wording."
          simp_chinese: "印行教理问答，就把宗派教义化作能在每间教室、每座讲坛反复传授的课业，推动接受向前；只是那些不满具体措辞的教士，也被一并激怒。"
        effect_blocks:
          - type: seat_stance
            group: religious_reformers
            stance: support
            cooldown_months: 24
          - type: estate_satisfaction
            estate: clergy_estate
            value: -0.02
          - type: temporary_country_modifier
            key: tv_academy_debate_catechism_lessons
            months: 18
            effects:
              "doctrinal teaching reach": 0.02
      b:
        text:
          english: "The draft goes back to committee for another round of consensus."
          simp_chinese: "草案退回委员会，再走一轮共识。"
        progress_delta: -5
        rationale:
          english: "Delaying for consensus keeps the peace among rival clerical readers, but every extra revision chips away at the claim that the settlement is ready to be accepted."
          simp_chinese: "延后等待共识，能在彼此较劲的教士读者之间维持和平；可每多修一轮，就削去几分\"这项定制已可接受\"的说服力。"
        effect_blocks:
          - type: seat_cooldown
            group: clergy
            cooldown_months: 24
          - type: temporary_country_modifier
            key: tv_academy_debate_consensus_delay
            months: 12
            effects:
              "religious peacekeeping": 0.02
  - design_id: C06
    pool: confessionalism
    issue: confessionalism
    weight: 1
    title:
      english: "The Minority Petition"
      simp_chinese: "少数社群请愿"
    desc:
      english: "Elders of a minority community come to the Academy with a petition folded under careful seals. They do not deny the realm's confession; they ask only what obedience will buy them - protection, or merely a quieter kind of exclusion."
      simp_chinese: "一个少数信仰社群派出长老来到学院，呈上一份封印谨慎的请愿书。他们并不否认王国的信纲，只想问一句：服从换来的，究竟是保护，还是一种更安静的排斥？"
    options:
      a:
        text:
          english: "The jurists write minority protection into the confession itself."
          simp_chinese: "法学家把对少数社群的保护，直接写进信纲本身。"
        progress_delta: 5
        rationale:
          english: "Written protection makes the confessional order look governable rather than merely exclusionary, so cautious minorities can accept the settlement as a rule they might actually live under."
          simp_chinese: "把保护写进条文，宗派秩序便显得可以治理，而不只是排斥异己；谨慎的少数社群，也就能把新秩序看作一套真能安身其中的规矩。"
        effect_blocks:
          - type: seat_stance
            group: minorities
            stance: support
            cooldown_months: 18
          - type: estate_satisfaction
            estate: dhimmi_estate
            value: 0.04
      b:
        text:
          english: "Best make no promises we may have to keep."
          simp_chinese: "别许下日后或许得兑现的承诺。"
        progress_delta: -5
        rationale:
          english: "Refusing guarantees pleases the conservative clergy who fear loopholes, but it leaves the proposed confession looking too brittle to hold a mixed realm together."
          simp_chinese: "拒绝作保，能取悦那些提防漏洞的保守教士；可这也让拟议中的信纲显得太脆，撑不起一个多元王国。"
        effect_blocks:
          - type: seat_stance
            group: clergy
            stance: oppose
            cooldown_months: 12
          - type: estate_satisfaction
            estate: clergy_estate
            value: 0.03
  - design_id: C07
    pool: confessionalism
    issue: confessionalism
    weight: 1
    title:
      english: "The Army's Oath"
      simp_chinese: "军中誓词"
    desc:
      english: "Officers warn that soldiers who pray in a dozen different parishes still stand in the same line of battle. They want one oath, strong enough to bind the camp before local custom can pull it apart."
      simp_chinese: "军官们警告说，士兵纵在十几个不同堂区祈祷，终究站在同一条战线上。他们要一份共同誓词，够牢固，好在地方习俗把军营拆散之前先把它系紧。"
    options:
      a:
        text:
          english: "We bind the whole camp with one oath before local custom can divide it."
          simp_chinese: "趁地方习俗还没把军营分开，我们先用一份誓词把整座营地系紧。"
        progress_delta: 5
        rationale:
          english: "A common oath turns confession into a shared military discipline, giving the new settlement a practical force it never had in pulpits and court language alone."
          simp_chinese: "共同誓词把信纲化作共享的军中纪律，让新秩序不再只停在讲坛与宫廷文辞里，而有了实打实的约束力。"
        effect_blocks:
          - type: seat_stance
            group: professional_military
            stance: support
            cooldown_months: 18
          - type: temporary_country_modifier
            key: tv_academy_debate_common_army_oath
            months: 18
            effects:
              "confessional army cohesion": 0.02
      b:
        text:
          english: "The regiments keep the oaths their fathers swore."
          simp_chinese: "各团仍守着父辈立下的旧誓词。"
        progress_delta: -5
        rationale:
          english: "Keeping the older oaths spares provincial estates and local commanders from being forced into a single formula, but it weakens the claim that confession can drill the realm into one body."
          simp_chinese: "保留旧誓词，省份等级和地方军官便不必被硬塞进同一套公式；可这也削弱了\"信纲能把王国操练成一个整体\"的说法。"
        effect_blocks:
          - type: seat_stance
            group: local_autonomy
            stance: oppose
            cooldown_months: 12
          - type: estate_satisfaction
            estate: nobles_estate
            value: 0.02
  - design_id: C08
    pool: confessionalism
    issue: confessionalism
    weight: 1
    title:
      english: "The Synod Summons"
      simp_chinese: "召集宗教会议"
    desc:
      english: "Someone proposes a formal synod, with witnesses numerous enough that no faction can later pretend the hard words were never spoken. Doctrine would leave the Academy as a public settlement, sealed and dated, rather than as a rumor."
      simp_chinese: "有人提议召开一场正式宗教会议，列席见证者多到任何派别日后都无法佯称尖锐言辞从未出口。教义将以盖印署期的公开决议离开学院，而不是化作传闻流散。"
    options:
      a:
        text:
          english: "The summons goes out, and the synod is called before witnesses enough to bind memory."
          simp_chinese: "召集令发出，宗教会议在多到足以钉住记忆的见证者面前召开。"
        progress_delta: 10
        rationale:
          english: "A witnessed synod gives the confessional settlement institutional weight and makes evasion costly, but convening it spends coin and exposes royal legitimacy to open doctrinal conflict."
          simp_chinese: "有见证的宗教会议赋予宗派定制制度分量，也让回避变得代价高昂；可召开会议既要花钱，又把王权合法性推到公开教义冲突之前。"
        effect_blocks:
          - type: resource
            resource: gold
            scale: -1
          - type: resource
            resource: legitimacy
            amount: -5
          - type: seat_stance
            group: scholarly_community
            stance: support
            cooldown_months: 24
      b:
        text:
          english: "Least said, soonest mended."
          simp_chinese: "言多必失，不如缄默。"
        progress_delta: -10
        rationale:
          english: "Avoiding the synod keeps the peace by denying the dispute a stage, but it also lets opponents argue that the confession cannot survive formal scrutiny."
          simp_chinese: "避开会议，等于不给争端搭台，平静得以保全；但这也让反对者有话说：这信纲，经不起正式的审问。"
        effect_blocks:
          - type: resource
            resource: stability
            amount: 1
          - type: seat_cooldown
            group: clergy
            cooldown_months: 12
  - design_id: C09
    pool: confessionalism
    issue: confessionalism
    weight: 1
    title:
      english: "Foreign Co-Religionists"
      simp_chinese: "外国同信者"
    desc:
      english: "Letters arrive from co-religionists abroad, full of encouragement, unsolicited advice, and signatures too prominent to ignore. Their backing strengthens the argument in the hall - and makes every listener wonder who else, across the border, is listening."
      simp_chinese: "外国同信者寄来书信，满纸是鼓励、不请自来的建议，以及显眼到无法忽视的署名。他们的支持强化了厅内的论点——也让每个听众都忍不住揣度：边境那头，还有谁在旁听？"
    options:
      a:
        text:
          english: "A clerk reads the foreign letters into the record, signatures and all."
          simp_chinese: "一名文吏把外国来信连同署名，一并读入记录。"
        progress_delta: 5
        rationale:
          english: "Reading the letters aloud frames the confession as part of a wider religious community, lending outside credibility even as it invites foreign eyes onto the debate."
          simp_chinese: "当众朗读来信，把本国信纲说成更大信仰共同体的一环，添了几分外部可信度；只是也把外国的目光，一并引到了辩论上。"
        effect_blocks:
          - type: seat_stance
            group: foreign_power
            stance: support
            cooldown_months: 18
          - type: foreign_prestige
            amount: 5
      b:
        text:
          english: "We keep our confession a domestic matter and return the letters unopened."
          simp_chinese: "我们让本国信纲只做国内之事，把来信原封退回。"
        progress_delta: -5
        rationale:
          english: "Rejecting foreign influence reassures the nobles who want confession kept a domestic settlement, but it cuts away useful testimony from allies abroad."
          simp_chinese: "拒绝外国影响，能安抚那些希望信纲只做国内事务的贵族；可这也砍去了海外盟友那份有用的证词。"
        effect_blocks:
          - type: seat_stance
            group: nobility
            stance: oppose
            cooldown_months: 12
          - type: estate_satisfaction
            estate: nobles_estate
            value: 0.03
  - design_id: C10
    pool: confessionalism
    issue: confessionalism
    weight: 1
    title:
      english: "The Feast-Day Reform"
      simp_chinese: "圣日历改革"
    desc:
      english: "Reformers spread a revised holy calendar across the table and discover, feast by feast, that every crossed-out day trails neighbors, guilds, and grandparents behind it. The state may align sacred time, it seems, but never quietly."
      simp_chinese: "改革者把一份修订过的圣日历铺开在桌上，一个节日一个节日地发现：每一个被划去的日子，身后都拖着邻里、行会与祖辈的记忆。看来国家可以校准神圣时间，却绝无法悄无声息地做到。"
    options:
      a:
        text:
          english: "The revised calendar is proclaimed, crossed-out feast days and all."
          simp_chinese: "修订过的历法连同被划去的节日，一并公布。"
        progress_delta: 10
        rationale:
          english: "Reforming the calendar writes confession into the rhythm of ordinary life, which advances acceptance sharply - and provokes every peasant and priest attached to a local holy day."
          simp_chinese: "改革圣日历，把信纲写进寻常日子的节奏里，接受因此大步向前——也惹恼了每一个依恋地方圣日的农民与教士。"
        effect_blocks:
          - type: seat_stance
            group: religious_reformers
            stance: support
            cooldown_months: 24
          - type: estate_satisfaction
            estate: peasants_estate
            value: -0.04
          - type: estate_satisfaction
            estate: clergy_estate
            value: -0.03
      b:
        text:
          english: "Custom is a calendar no decree can rewrite."
          simp_chinese: "习俗自成一部历法，非诏令所能改写。"
        progress_delta: -10
        rationale:
          english: "Keeping the local feasts protects familiar parish rhythms and contents the villages, but it concedes that confessional order cannot yet command so much as the calendar."
          simp_chinese: "保留地方节日，护住了熟悉的堂区节律，也让乡里满意；可这也等于承认，宗派秩序连一部历法都还号令不动。"
        effect_blocks:
          - type: seat_stance
            group: local_autonomy
            stance: oppose
            cooldown_months: 18
          - type: estate_satisfaction
            estate: peasants_estate
            value: 0.04
          - type: estate_satisfaction
            estate: clergy_estate
            value: 0.02
  - design_id: C11
    pool: confessionalism
    issue: confessionalism
    weight: 1
    title:
      english: "The Confessional Primer"
      simp_chinese: "宗派教义课本"
    desc:
      english: "New schoolbooks reach the Academy with doctrine printed beside the spelling lists, the sums, and the civic maxims. Children will learn their letters and the realm's confession from one and the same page."
      simp_chinese: "新课本送抵学院，教义与拼写表、算术题和臣民格言并排印在一处。孩子们将从同一页纸上，既学会字母，也学会王国的信纲。"
    options:
      a:
        text:
          english: "The new primers are approved for every schoolroom in the realm."
          simp_chinese: "新课本获准送进王国的每一间教室。"
        progress_delta: 10
        rationale:
          english: "Approving the schoolbooks turns confession into plain civic literacy, handing the accepting side a broad argument reaching across generations rather than one more narrow clerical order."
          simp_chinese: "批准课本，把信纲变成基本的臣民读写教育，给接受一方递上一个跨越几代人的宽广理由，而非又一道狭窄的教会命令。"
        effect_blocks:
          - type: seat_stance
            group: public_opinion
            stance: support
            cooldown_months: 18
          - type: seat_cooldown
            group: scholarly_community
            cooldown_months: 12
      b:
        text:
          english: "Let each schoolmaster teach his own."
          simp_chinese: "让各家塾师，各教各的吧。"
        progress_delta: -5
        rationale:
          english: "Leaving doctrine to local schools preserves clerical and parish autonomy, but it also keeps confession fragmented enough that the Academy's case for policy loses its edge."
          simp_chinese: "把教义交给各地学校，教士与堂区的自主保住了；可这也让宗派教义继续零散，学院把它抬为国策的论证，也就钝了。"
        effect_blocks:
          - type: estate_satisfaction
            estate: clergy_estate
            value: 0.04
          - type: seat_stance
            group: clergy
            stance: oppose
            cooldown_months: 12
  - design_id: C12
    pool: confessionalism
    issue: confessionalism
    weight: 1
    title:
      english: "The Pilgrim Riot"
      simp_chinese: "朝圣骚乱"
    desc:
      english: "A pilgrimage tips from devotion into street violence where rival sermons, old badges, and new slogans all crowd onto the same road. The Academy must judge whether an inherited custom can be disciplined without being broken."
      simp_chinese: "一场朝圣在相互较劲的布道、旧徽记与新口号挤上同一条道路之后，从虔敬滑向街头暴力。学院必须判断：一项祖传旧俗，能否被约束，而不至于被折断。"
    options:
      a:
        text:
          english: "Marshals set a fixed route and a fixed hour for the pilgrimage."
          simp_chinese: "巡吏为朝圣定下固定的路线与时辰。"
        progress_delta: 5
        rationale:
          english: "Regulation proves the state confession can hold inherited devotion inside public order, but calming a holy crowd costs real stability."
          simp_chinese: "规范朝圣证明国家化的宗派秩序能把旧有虔敬收进公共秩序里；可要安抚一群怀着圣心的人，得付出实打实的稳定代价。"
        effect_blocks:
          - type: resource
            resource: stability
            amount: -1
          - type: seat_stance
            group: religious_reformers
            stance: support
            cooldown_months: 12
      b:
        text:
          english: "We leave the pilgrims to their own ancient discipline."
          simp_chinese: "我们把朝圣者交还给他们自己的古老规矩。"
        progress_delta: -5
        rationale:
          english: "Letting custom rule reassures the clergy and the local guardians of the pilgrimage, but it concedes that inherited devotion still outranks confessional discipline."
          simp_chinese: "让习俗自行维持秩序，能安抚教士和地方的朝圣守护者；却也等于承认，旧有虔敬仍旧压着新宗派纪律一头。"
        effect_blocks:
          - type: estate_satisfaction
            estate: clergy_estate
            value: 0.04
          - type: seat_stance
            group: local_autonomy
            stance: oppose
            cooldown_months: 12
  - design_id: C13
    pool: confessionalism
    issue: confessionalism
    weight: 1
    title:
      english: "The Marriage Court"
      simp_chinese: "婚姻法庭"
    desc:
      english: "Jurists propose marriage courts recognized by the state and ruled by confessional law. What families once carried quietly to a familiar priest may soon arrive instead with seals, clerks, and a shelf of precedent."
      simp_chinese: "法学家提议设立由国家承认、依宗派法律裁断的婚姻法庭。过去人家悄悄交给熟识教士处理的事，或许很快就要带着印章、书记员和一架子判例登门。"
    options:
      a:
        text:
          english: "We give confession a court of its own for every hearth in the realm."
          simp_chinese: "我们为信纲设一座法庭，管到王国每一户人家。"
        progress_delta: 10
        rationale:
          english: "Establishing marriage courts gives confession a daily jurisdiction over households, advancing acceptance strongly while handing bureaucratic interpreters real power over doctrine."
          simp_chinese: "设立婚姻法庭，让宗派信纲拿到管辖寻常家事的日常权柄，强力推动接受；同时也把解释教义的实权，交到了官僚手上。"
        effect_blocks:
          - type: seat_stance
            group: court_bureaucrats
            stance: support
            cooldown_months: 18
          - type: estate_satisfaction
            estate: clergy_estate
            value: -0.04
      b:
        text:
          english: "Marriage stays where it has always been settled, in the clergy's own courts."
          simp_chinese: "婚姻仍在一贯裁断之处了结——教会自己的法庭。"
        progress_delta: -10
        rationale:
          english: "Keeping marriage in the existing clergy courts protects an old jurisdiction and wins clerical approval, but it denies the confessional state a powerful institution reaching right into the household."
          simp_chinese: "把婚姻留在现有教会法庭，护住了一项旧管辖权，也赢得教士的支持；可这也让宗派国家失去一个能直插家庭内部的有力制度。"
        effect_blocks:
          - type: estate_satisfaction
            estate: clergy_estate
            value: 0.06
          - type: temporary_country_modifier
            key: tv_academy_debate_clergy_marriage_jurisdiction
            months: 18
            effects:
              "clerical marriage court authority": 0.03
  - design_id: C14
    pool: confessionalism
    issue: confessionalism
    weight: 1
    title:
      english: "The Icon in Question"
      simp_chinese: "圣像之争"
    desc:
      english: "A church image turns into more than paint and wood the moment preachers, worshippers, and officials all insist it proves their side. The question is no longer whether the image is beautiful, but who may say what devotion means."
      simp_chinese: "一幅教堂图像，在布道者、信众与官员都咬定它能证明己方之后，便不再只是颜料与木板。问题已不在图像是否美丽，而在谁有权断定虔敬的含义。"
    options:
      a:
        text:
          english: "The synod fixes one rule for the image, and calls it settled."
          simp_chinese: "宗教会议为这幅圣像定下唯一规则，就此了结。"
        progress_delta: 5
        rationale:
          english: "A clear rule lets the religious reformers turn a quarrel over symbols into enforceable discipline, modestly advancing acceptance by drawing the line of acceptable devotion."
          simp_chinese: "一条明确规则，让宗教改革派把一场象征之争化作可执行的纪律，划出可接受的虔敬界限，适度推动接受。"
        effect_blocks:
          - type: seat_stance
            group: religious_reformers
            stance: support
            cooldown_months: 12
          - type: estate_satisfaction
            estate: clergy_estate
            value: -0.02
      b:
        text:
          english: "Not every quarrel needs a verdict."
          simp_chinese: "并非每场争执，都需一纸裁决。"
        progress_delta: -5
        rationale:
          english: "Avoiding a ruling keeps the local peace around the image, but it leaves devotion undefined and weakens the case for a disciplined confession."
          simp_chinese: "不下裁决，能保住围着这幅圣像的地方平静；可虔敬始终没个界定，建立有纪律宗派秩序的论证，也就软了。"
        effect_blocks:
          - type: temporary_country_modifier
            key: tv_academy_debate_icon_local_truce
            months: 12
            effects:
              "local devotional calm": 0.02
          - type: seat_stance
            group: local_autonomy
            stance: oppose
            cooldown_months: 12
  - design_id: C15
    pool: confessionalism
    issue: confessionalism
    weight: 1
    title:
      english: "The Border Preachers"
      simp_chinese: "边境传教士"
    desc:
      english: "Preachers slip across the frontier with sermons sharp enough to win converts and complaints in equal measure. Their doctrine strengthens the debate at home, but now every border village carries a diplomatic echo back into the halls."
      simp_chinese: "传教士带着足以同时赢得皈依者与抗议的布道越过边境。他们的教义强化了国内辩论，可如今每一个边境村庄，都会把一段外交回声传回厅堂。"
    options:
      a:
        text:
          english: "The Crown throws its protection over the preachers across the frontier."
          simp_chinese: "君主把庇护伸到边境那头的传教士身上。"
        progress_delta: 10
        rationale:
          english: "Protecting the preachers shows the confession has outward confidence and champions willing to carry it abroad, advancing acceptance sharply while leaving neighboring powers feeling provoked."
          simp_chinese: "保护传教士，显出这宗派秩序有向外的底气，也有肯把它带出国门的倡导者，接受因此大步前行；只是邻国，也就觉得受了挑衅。"
        effect_blocks:
          - type: seat_stance
            group: religious_reformers
            stance: support
            cooldown_months: 18
          - type: foreign_prestige
            amount: -10
      b:
        text:
          english: "Peace, before a sermon starts a war."
          simp_chinese: "消停些，免得一篇布道引出一场战争。"
        progress_delta: -10
        rationale:
          english: "Restraining the preachers calms relations abroad, but it signals that diplomatic caution can silence the very men who would carry the confession beyond the Academy's walls."
          simp_chinese: "约束传教士，能平息对外关系；但这也表明，外交上的谨慎足以噤声那些本该把信纲带出学院高墙的人。"
        effect_blocks:
          - type: foreign_prestige
            amount: 10
          - type: seat_stance
            group: foreign_power
            stance: neutral
            cooldown_months: 18
  - design_id: C16
    pool: confessionalism
    issue: confessionalism
    weight: 1
    title:
      english: "The Confession Tax"
      simp_chinese: "信纲税"
    desc:
      english: "Officials propose a dedicated levy for the confessional schools, arguing that doctrine taught cheaply is doctrine forgotten quickly. The villages, however, hear the word \"school\" and quietly count the word \"tax.\""
      simp_chinese: "官员提议为宗派学校专设一项税，声称教义教得太廉价，便会忘得太迅速。可乡里听见的是\"学校\"，心里默默盘算的，却是\"税\"。"
    options:
      a:
        text:
          english: "The collectors add a school levy to every parish assessment."
          simp_chinese: "税吏在各堂区的税册上，添了一项学校税。"
        progress_delta: 5
        rationale:
          english: "Funding the schools gives the confessional program a real classroom base, so acceptance advances - but the levy makes ordinary households feel doctrine is being taken straight from their purses."
          simp_chinese: "为学校筹资，给宗派纲领垫下实在的课堂根基，接受因此向前——可这项税，也让寻常人家觉得，教义正从自家钱袋里直接被掏走。"
        effect_blocks:
          - type: resource
            resource: gold
            scale: 1
          - type: estate_satisfaction
            estate: peasants_estate
            value: -0.04
          - type: seat_stance
            group: court_bureaucrats
            stance: support
            cooldown_months: 18
      b:
        text:
          english: "No new tax, whatever we choose to call it."
          simp_chinese: "不加新税——不管我们给它起什么名目。"
        progress_delta: -5
        rationale:
          english: "Refusing the tax protects rural patience and keeps confessional schooling from becoming a fiscal grievance, but it leaves the new doctrine without the coin it needs to reach the parish children."
          simp_chinese: "拒绝征税，护住了乡下的耐心，也免得宗派教育变成一桩财政怨气；可新教义，也因此缺了走进堂区孩子中间所需的那笔钱。"
        effect_blocks:
          - type: estate_satisfaction
            estate: peasants_estate
            value: 0.04
          - type: seat_cooldown
            group: religious_reformers
            cooldown_months: 12
  - design_id: C17
    pool: confessionalism
    issue: confessionalism
    weight: 1
    title:
      english: "The Clergy Divided"
      simp_chinese: "教士分裂"
    desc:
      english: "Clergy who once spoke as a single estate now split over the new confession: should it discipline them as servants of a doctrine, or shield them as guardians of an inherited privilege?"
      simp_chinese: "曾以同一等级发声的教士，如今为新宗派争执不下：它究竟该把他们约束为教义的仆从，还是护他们作祖传特权的守护者？"
    options:
      a:
        text:
          english: "The Crown binds the clergy to the doctrine they serve."
          simp_chinese: "君主把教士约束于他们所侍奉的教义之下。"
        progress_delta: 10
        rationale:
          english: "Backing discipline makes the confession more than a clerical possession - a rule that can bind even churchmen - advancing acceptance sharply while angering the clergy attached to corporate privilege."
          simp_chinese: "支持纪律，让信纲不再只是教士阶层的私产，而成为连教士也须遵守的规矩，强力推动接受；却也激怒了那些恋着团体特权的教士。"
        effect_blocks:
          - type: seat_stance
            group: religious_reformers
            stance: support
            cooldown_months: 24
          - type: estate_satisfaction
            estate: clergy_estate
            value: -0.05
          - type: temporary_country_modifier
            key: tv_academy_debate_clerical_discipline
            months: 12
            effects:
              "parish oversight hardens around the new confession": 0.02
      b:
        text:
          english: "We let the clergy keep the privileges of their order."
          simp_chinese: "我们让教士保住本阶层的特权。"
        progress_delta: -10
        rationale:
          english: "Protecting clerical privilege reassures the clergy estate that confession will never become a royal leash, but it announces that institutional comfort matters more here than doctrinal discipline."
          simp_chinese: "保护教士特权，让教士等级安心：信纲绝不会变成王权的缰绳；可这也昭告众人，在这里，制度的安逸比教义的纪律更要紧。"
        effect_blocks:
          - type: seat_stance
            group: clergy
            stance: oppose
            cooldown_months: 24
          - type: estate_satisfaction
            estate: clergy_estate
            value: 0.05
          - type: resource
            resource: legitimacy
            amount: 5
  - design_id: C18
    pool: confessionalism
    issue: confessionalism
    weight: 1
    title:
      english: "The Public Recantation"
      simp_chinese: "公开悔认"
    desc:
      english: "A prominent opponent offers to recant, if only the Academy will spare him the ritual humiliation. Some read mercy as a proof of confidence; others read it as a squandered chance to make resistance tremble."
      simp_chinese: "一位著名反对者表示，只要学院免去那套羞辱仪式，他便愿意悔认。有人把宽恕读作自信的证明，也有人读作一次白白错过、本可让反抗者战栗的机会。"
    options:
      a:
        text:
          english: "We take the recantation and spare the man his humiliation."
          simp_chinese: "我们接受悔认，免了这人受辱。"
        progress_delta: 5
        rationale:
          english: "Accepting the recantation turns an opponent into living proof that persuasion works, moving the debate toward acceptance and steadying public order through visible restraint."
          simp_chinese: "接受悔认，把一名反对者变成\"劝服管用\"的活证据，推着辩论走向接受；看得见的克制，也安定了公共秩序。"
        effect_blocks:
          - type: resource
            resource: stability
            amount: 1
          - type: seat_cooldown
            group: public_opinion
            cooldown_months: 12
      b:
        text:
          english: "The opponent is made to recant on his knees, before the whole hall."
          simp_chinese: "那位反对者被要求当着满堂人，跪地悔认。"
        progress_delta: 10
        rationale:
          english: "Demanding public shame makes the victory unmistakable and cows the wavering, so acceptance leaps forward, but the spectacle hardens everyone who fears confession as coercion."
          simp_chinese: "要求公开受辱，让胜利无从误认，也震慑了摇摆之人，接受于是猛地向前；可这般场面，也让每一个害怕信纲沦为强制的人，更加铁了心。"
        effect_blocks:
          - type: seat_stance
            group: public_opinion
            stance: support
            cooldown_months: 18
          - type: seat_stance
            group: minorities
            stance: oppose
            cooldown_months: 24
          - type: resource
            resource: prestige
            amount: -5
  - design_id: C19
    pool: confessionalism
    issue: confessionalism
    weight: 1
    title:
      english: "The Confessional Census"
      simp_chinese: "宗派户籍清查"
    desc:
      english: "Bureaucrats ask to count every community by its confession, promising that neat columns are calmer than loose rumors. The minority elders notice, without saying so, that a column can become a target quite as easily as a tool."
      simp_chinese: "官僚请求按宗派把每个社群逐一统计入册，保证工整的表格总比零散的传闻冷静。少数社群的长老心里明白（却不说破）：一栏数字，既能当工具，也一样容易变成靶子。"
    options:
      a:
        text:
          english: "The census-takers sort every community into its confessional column."
          simp_chinese: "清查员把每个社群，一一归入各自的宗派栏目。"
        progress_delta: 10
        rationale:
          english: "Counting the communities gives the confessional state the knowledge it needs to govern doctrine locally, advancing acceptance strongly while making minorities dread that to be seen is to be exposed."
          simp_chinese: "把各社群统计入册，让宗派国家握有在地方治理教义所需的知识，强力推动接受；却也让少数群体惧怕：被看见，便是被暴露。"
        effect_blocks:
          - type: seat_stance
            group: court_bureaucrats
            stance: support
            cooldown_months: 24
          - type: estate_satisfaction
            estate: dhimmi_estate
            value: -0.03
          - type: seat_stance
            group: minorities
            stance: oppose
            cooldown_months: 18
      b:
        text:
          english: "What is counted is easily hunted."
          simp_chinese: "入册者，易成猎物。"
        progress_delta: -5
        rationale:
          english: "Refusing the count keeps the local peace and reassures the vulnerable communities, but it leaves the confessional program half-blind everywhere beyond the Academy's chamber."
          simp_chinese: "拒绝清查，保住了地方的太平，也安抚了脆弱的社群；可这也让宗派纲领，在学院议厅之外处处半盲。"
        effect_blocks:
          - type: seat_stance
            group: local_autonomy
            stance: oppose
            cooldown_months: 18
          - type: estate_satisfaction
            estate: dhimmi_estate
            value: 0.03
          - type: resource
            resource: stability
            amount: 1
  - design_id: C20
    pool: confessionalism
    issue: confessionalism
    weight: 1
    title:
      english: "The Crown's Formula"
      simp_chinese: "王室信纲条文"
    desc:
      english: "Advisers draft a royal formula meant to sound ancient by tomorrow morning and inevitable by next week. The words are polished enough to shine - which is not at all the same thing as being settled."
      simp_chinese: "顾问们草拟出一套王室条文，指望它明早听来已如古训，下周听来已成天命。词句打磨得足够发亮——而发亮，与尘埃落定，全然是两回事。"
    options:
      a:
        text:
          english: "The royal formula is proclaimed from every market cross."
          simp_chinese: "王室条文在每一座集市十字碑前昭告天下。"
        progress_delta: 10
        rationale:
          english: "Proclaiming the formula hands the debate a royal sentence to rally around, pushing acceptance quickly, but a formula issued before consensus makes legitimacy carry the weight of every disputed word."
          simp_chinese: "颁布条文，给辩论一句可供拥护的王室定论，迅速推动接受；可在共识形成之前发布，也让正统性去扛下每一个争议词句的分量。"
        effect_blocks:
          - type: seat_stance
            group: court_bureaucrats
            stance: support
            cooldown_months: 18
          - type: resource
            resource: legitimacy
            amount: -5
          - type: temporary_country_modifier
            key: tv_academy_debate_royal_formula
            months: 12
            effects:
              "royal confessional language anchors public argument": 0.02
      b:
        text:
          english: "Back to the drafting table with it."
          simp_chinese: "拿回去，重新拟过。"
        progress_delta: -5
        rationale:
          english: "Returning the formula for revision keeps royal dignity off an unstable text, but it also tells the Academy that the confession still lacks words strong enough to govern with."
          simp_chinese: "退回重修，不把王室尊严押在一份不稳的文本上；可这也告诉学院，这信纲，仍缺一句足以治国的措辞。"
        effect_blocks:
          - type: seat_cooldown
            group: court_bureaucrats
            cooldown_months: 12
          - type: resource
            resource: prestige
            amount: -5
excluded_events: []
