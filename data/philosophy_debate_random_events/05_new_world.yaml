random_events:
  - design_id: NW01
    pool: new_world
    issue: new_world
    weight: 1
    title:
      english: "The Sailor's Chart"
      simp_chinese: "水手的海图"
    desc:
      english: "A sea-stained chart reaches the Academy, its coastlines refusing to lie flat against any known map. The blots look like tavern evidence until the copyists notice that every crooked line still points stubbornly west."
      simp_chinese: "一张浸满盐渍的海图送进学院，海岸线怎么也贴不平任何一张已知地图。那些墨渍起初像酒馆里留下的证物，直到誊抄的人发现，每一条歪斜的线仍固执地指向西方。"
    options:
      a:
        text:
          english: "The pilots pin the chart above the great table and set a course by it."
          simp_chinese: "领航员们把海图钉在大案之上，照着它定下航向。"
        progress_delta: 10
        rationale:
          english: "Trusting the chart lets practical seafaring evidence challenge inherited geography head-on. The debate swings hard toward acceptance, because the maritime merchants can now point to a route a man might actually sail rather than a rumor swapped over ale."
          simp_chinese: "信任这张海图，等于让航海实践的证据正面挑战承袭下来的地理知识。辩论会强烈转向接受，因为海商终于能指着一条真能航行的航路，而不再是就着麦酒交换的传闻。"
        effect_blocks:
          - type: seat_stance
            group: maritime_merchants
            stance: support
            cooldown_months: 24
          - type: temporary_country_modifier
            key: tv_academy_debate_battered_chart
            months: 24
            effects:
              private chart copying and voyage subscriptions: 0.03
      b:
        text:
          english: "We know tavern ink when we see it."
          simp_chinese: "酒馆里的墨迹，我们一眼就认得。"
        progress_delta: -10
        rationale:
          english: "Dismissing the chart guards the old map by attacking the witness instead of the coastline. Conservative listeners take heart, since uncertain sailors' knowledge is kept safely outside the Academy's authority."
          simp_chinese: "斥其为酒馆墨迹，是靠攻击见证者、而非检验海岸线来保住旧地图。保守的听众因此安心，因为不可靠的水手见闻被稳稳挡在学院权威之外。"
        effect_blocks:
          - type: estate_satisfaction
            estate: nobles_estate
            value: 0.02
          - type: seat_stance
            group: court_bureaucrats
            stance: oppose
            cooldown_months: 18
  - design_id: NW02
    pool: new_world
    issue: new_world
    weight: 1
    title:
      english: "Returned Pilot"
      simp_chinese: "归来的领航员"
    desc:
      english: "A pilot returns with salt crusted in his coat, fever still in his bones, and a story that repeats itself too exactly to be waved off as delirium. The Academy must decide whether the realm hears the tale as testimony or buries it as a secret."
      simp_chinese: "一名领航员归来，外套上结着盐霜，骨子里还烧着热病，讲出的故事前后一致得不像胡话，难以随手打发。学院必须决定，是让王国把这段经历当作证词来听，还是当作秘密来埋。"
    options:
      a:
        text:
          english: "A clerk calls the chamber to order and lets the pilot speak before every bench."
          simp_chinese: "一名文吏敲定秩序，让领航员当着每一排座位开口。"
        progress_delta: 10
        rationale:
          english: "A public hearing turns the pilot from a carrier of rumor into a witnessed source. Acceptance climbs sharply as the tale becomes evidence the whole room has heard, though the Crown spends a little prestige should the testimony later prove imperfect."
          simp_chinese: "公开听证会把领航员从传闻的携带者变成有众人作证的来源。这段故事成为满堂共同听见的证据，接受度因此显著上升；只是若日后证词被发现有瑕疵，王权也要折损些许声望。"
        effect_blocks:
          - type: seat_stance
            group: public_opinion
            stance: support
            cooldown_months: 18
          - type: resource
            resource: prestige
            amount: -5
      b:
        text:
          english: "We take his account behind a closed door."
          simp_chinese: "我们把他的说法带到闭门之后再问。"
        progress_delta: -5
        rationale:
          english: "Private questioning keeps the pilot useful to the officials but denies the debate a public witness. Court caution slows acceptance without ever quite calling the story false."
          simp_chinese: "私下盘问让官员继续能用得上领航员，却不给辩论一位公开的见证人。宫廷的谨慎减缓了接受进程，却始终没把这段经历说成假的。"
        effect_blocks:
          - type: seat_cooldown
            group: court_bureaucrats
            cooldown_months: 12
          - type: temporary_country_modifier
            key: tv_academy_debate_private_pilot_interrogation
            months: 12
            effects:
              controlled handling of exploration testimony: 0.02
  - design_id: NW03
    pool: new_world
    issue: new_world
    weight: 1
    title:
      english: "Clergy Ask for Mission Rights"
      simp_chinese: "神职人员索要传教权"
    desc:
      english: "The clerics argue that discovery without conversion is merely wandering with better maps. The Academy's debate is torn between souls, surveys, and the awkward question of who is entitled to name a new shore first."
      simp_chinese: "神职人员主张，没有皈依的发现，不过是带着更好地图的游荡罢了。学院的辩论被撕扯在灵魂、测绘，与一个尴尬的问题之间：谁有资格最先为一片新海岸命名？"
    options:
      a:
        text:
          english: "No coast is truly found until a soul is saved upon it."
          simp_chinese: "海岸上不救得一条灵魂，便算不得真正发现了它。"
        progress_delta: -5
        rationale:
          english: "Mission priority narrows discovery into a clerical errand before the Academy can treat new lands as an empirical problem. The clergy approve, but acceptance slows as survey, trade, and testimony are all made to kneel behind conversion."
          simp_chinese: "传教优先，会在学院把新土地当作经验问题来看待之前，先把发现收窄成一桩神职差事。神职人员对此认可，但测绘、贸易与证词都被迫跪在皈依之后，接受进程因此放缓。"
        effect_blocks:
          - type: estate_satisfaction
            estate: clergy_estate
            value: 0.04
          - type: temporary_country_modifier
            key: tv_academy_debate_mission_priority
            months: 18
            effects:
              missionary access ahead of geographic survey: 0.02
      b:
        text:
          english: "The Academy seats the missionary and the surveyor at one table."
          simp_chinese: "学院让传教士与测绘师同坐一张桌子。"
        progress_delta: 5
        rationale:
          english: "Balancing mission with survey keeps a religious purpose in the room while refusing to let it monopolize the meaning of discovery. The debate gains modest ground, since scholars may still gather evidence, though clergy satisfaction slips."
          simp_chinese: "让传教与测绘并重，既把宗教目的留在场内，又不许它垄断发现的意义。学者依旧能收集证据，辩论因此小幅前进，只是神职人员的满意度会滑落。"
        effect_blocks:
          - type: estate_satisfaction
            estate: clergy_estate
            value: -0.03
          - type: seat_stance
            group: scholarly_community
            stance: support
            cooldown_months: 18
  - design_id: NW04
    pool: new_world
    issue: new_world
    weight: 1
    title:
      english: "Merchants Want Charter"
      simp_chinese: "商人索要特许状"
    desc:
      english: "Merchants offer to fund voyages, provided the Crown lets them name harbors they have not yet laid eyes on. Their confidence is useful, expensive, and already busy pressing a seal onto empty water."
      simp_chinese: "商人提出资助远航，条件是王权允许他们为尚未亲眼见过的港湾命名。他们的信心有用、昂贵，且早已忙着把印章按在一片空白海面上。"
    options:
      a:
        text:
          english: "The seal is pressed, and harbors gain owners before they gain names."
          simp_chinese: "印章按下，港湾还没得到名字，便先有了主人。"
        progress_delta: 10
        rationale:
          english: "A charter turns the New World claim into financed action and gives merchants a stake in proving the Academy right. Acceptance rises strongly as private capital begins treating discovery as a thing worth investing in."
          simp_chinese: "特许状把新世界主张化为有资金支撑的行动，也让商人有理由去证明学院没错。私人资本开始把发现当作值得投资的现实，接受度因此大幅上升。"
        effect_blocks:
          - type: estate_satisfaction
            estate: burghers_estate
            value: 0.04
          - type: seat_stance
            group: maritime_merchants
            stance: support
            cooldown_months: 24
      b:
        text:
          english: "Not so fast -- the shore answers to the Crown."
          simp_chinese: "且慢——那片海岸只听命于王权。"
        progress_delta: -5
        rationale:
          english: "Keeping discovery under Crown lock preserves legitimacy and central control, but it leaves every voyage waiting on cautious official timing. The debate loses momentum as eager backers are held at arm's length."
          simp_chinese: "将发现权锁在王权之下，维护了正统性与中央控制，却也让每一次远航都得等待谨慎的官方节奏。热切的资助者被保持在一臂之外，辩论的势头因此减弱。"
        effect_blocks:
          - type: resource
            resource: legitimacy
            amount: 5
          - type: temporary_country_modifier
            key: tv_academy_debate_crown_discovery_lock
            months: 18
            effects:
              centralized control over overseas claims: 0.02
  - design_id: NW05
    pool: new_world
    issue: new_world
    weight: 1
    title:
      english: "Native Envoy's Account"
      simp_chinese: "原住民使者的叙述"
    desc:
      english: "A translated account from across the sea contradicts half the Academy's assumptions, and sounds not the least bit impressed by any of them. The room discovers that the new world has not been sitting silent, waiting politely to be described."
      simp_chinese: "一份来自海彼岸的译文叙述反驳了学院一半的假设，且听起来对其中任何一条都毫不动容。众人这才发现，新世界并不曾沉默端坐，礼貌地等待别人来描述。"
    options:
      a:
        text:
          english: "We let the account rewrite what we thought we already knew."
          simp_chinese: "我们让这份叙述改写我们自以为早已知道的东西。"
        progress_delta: 10
        rationale:
          english: "Letting the envoy's account reshape the debate treats New World peoples as sources of knowledge rather than scenery. Acceptance rises sharply, for the Academy must revise geography, custom, and authority all at once."
          simp_chinese: "让使者的叙述重塑辩论，是把新世界的人们当作知识来源，而不是背景风景。学院必须同时修正地理、习俗与权威，接受度因此显著上升。"
        effect_blocks:
          - type: seat_stance
            group: minorities
            stance: support
            cooldown_months: 24
          - type: estate_satisfaction
            estate: nobles_estate
            value: -0.03
      b:
        text:
          english: "The clerks file the account among the cabinet's curiosities."
          simp_chinese: "文吏把这份叙述归入陈列柜里的奇珍异闻。"
        progress_delta: -10
        rationale:
          english: "Treating the account as a curiosity guards the old geography by shelving unfamiliar testimony in a cabinet instead of the argument. The debate retreats sharply as living knowledge is turned into ornament."
          simp_chinese: "将这份叙述当作奇闻，是把陌生证词放进陈列柜、而非放进论证，从而保住旧地理。活生生的知识被当成装饰，辩论因此明显退回保守立场。"
        effect_blocks:
          - type: seat_stance
            group: scholarly_community
            stance: oppose
            cooldown_months: 24
          - type: temporary_country_modifier
            key: tv_academy_debate_cabinet_of_curiosities
            months: 24
            effects:
              inherited geography protected from foreign testimony: 0.03
  - design_id: NW06
    pool: new_world
    issue: new_world
    weight: 1
    title:
      english: "Disease Report"
      simp_chinese: "疾病报告"
    desc:
      english: "Physicians warn the Academy that new shores may bring fevers along with coastlines. The supporters of discovery must now prove that prudence can be stowed aboard the same ships as curiosity."
      simp_chinese: "医生们提醒学院，新海岸带来的不只海岸线，还可能有热病。发现的支持者如今必须证明，谨慎与好奇心能装上同一批船。"
    options:
      a:
        text:
          english: "The physicians are funded, and the ships sail with their cautions stowed aboard."
          simp_chinese: "医生们得到资助，船只带着他们的防范条陈一同起航。"
        progress_delta: 5
        rationale:
          english: "Funding precautions accepts the medical warning without letting fear define the whole question. The debate edges toward acceptance, since discovery is framed as a managed, regulated risk rather than reckless appetite."
          simp_chinese: "资助防疫，是承认医生的警告，却不让恐惧决定整个议题。发现被塑造成可管理、可规制的风险，而非鲁莽的欲望，辩论因此小幅转向接受。"
        effect_blocks:
          - type: resource
            resource: gold
            scale: -1
          - type: temporary_country_modifier
            key: tv_academy_debate_quarantine_precautions
            months: 24
            effects:
              port health inspections and voyage precautions: 0.03
      b:
        text:
          english: "Fair coasts have foul fevers."
          simp_chinese: "海岸再美，也藏着恶疾。"
        progress_delta: -5
        rationale:
          english: "Treating illness as the lesson makes caution sound responsible and hands conservative listeners a concrete danger to gather around, slowing acceptance of the New World argument."
          simp_chinese: "把疾病当作主要教训，让谨慎显得负责任，也给保守听众一个可供共同强调的具体危险，从而减缓对新世界论点的接受。"
        effect_blocks:
          - type: estate_satisfaction
            estate: clergy_estate
            value: 0.03
          - type: seat_stance
            group: clergy
            stance: oppose
            cooldown_months: 18
  - design_id: NW07
    pool: new_world
    issue: new_world
    weight: 1
    title:
      english: "Missing Expedition"
      simp_chinese: "失踪的远征队"
    desc:
      english: "An expedition fails to return, and the empty harbor makes its argument with better timing than any lecturer. Opponents call the silence proof; supporters answer that the unknown was never going to surrender politely."
      simp_chinese: "一支远征队迟迟未归，空荡的港口比任何讲师都更懂得挑时机发言。反对者把这份沉默称作证据，支持者则回答：未知从来不会礼貌地投降。"
    options:
      a:
        text:
          english: "We do not strike our colors for one empty harbor."
          simp_chinese: "我们不会为了一座空港就降下旗帜。"
        progress_delta: 10
        rationale:
          english: "Continuing despite a missing expedition is a dramatic wager on the discovery thesis. It drives acceptance hard, though the Crown spends prestige by appearing willing to risk honor and lives before the proof is in hand."
          simp_chinese: "在远征队失踪后仍坚持计划，是对发现论点的一场高调押注。它强力推动接受，但王权也要消耗声望，因为这显得愿意在证据到手之前，就赌上荣誉与生命。"
        effect_blocks:
          - type: resource
            resource: prestige
            amount: -10
          - type: seat_stance
            group: maritime_merchants
            stance: support
            cooldown_months: 24
      b:
        text:
          english: "Enough. No more hulls into the dark."
          simp_chinese: "够了。别再把船送进那片黑暗。"
        progress_delta: -10
        rationale:
          english: "Suspending voyages lets the loss define policy. Families, clergy, and cautious observers feel heard, while the debate retreats sharply from accepting oceanic discovery as a principle of rule."
          simp_chinese: "暂停远航，等于让这场损失来定义政策。家属、神职人员与谨慎的旁观者觉得自己的担忧被听见，而辩论也明显远离把远洋发现当作治国原则。"
        effect_blocks:
          - type: estate_satisfaction
            estate: clergy_estate
            value: 0.04
          - type: seat_stance
            group: public_opinion
            stance: oppose
            cooldown_months: 18
  - design_id: NW08
    pool: new_world
    issue: new_world
    weight: 1
    title:
      english: "Harbor Crowd"
      simp_chinese: "港口人群"
    desc:
      english: "The harbor fills with people craning to watch strange goods come off the boards. Each object turns into a small ambassador, lending the Academy's argument color, weight, and something the crowd can actually point at."
      simp_chinese: "港口挤满了伸长脖子、想看异域货物卸船的人。每一件物品都成了一位小小的使节，给学院的论点添上颜色、重量，以及围观者真能伸手指认的东西。"
    options:
      a:
        text:
          english: "The strange goods are laid out where the harbor crowd can lay hands on them."
          simp_chinese: "异域货物摊开陈列，让港口的人群都能上手触碰。"
        progress_delta: 5
        rationale:
          english: "Public display turns distant discovery into evidence ordinary onlookers can touch. The gain is modest, since curiosity runs broad but shallow, yet public opinion begins to lean toward acceptance."
          simp_chinese: "公开展示把遥远的发现变成普通旁观者也能触摸的证据。这份好奇广而不深，进展因此只是小幅，但公众舆论已开始倾向接受。"
        effect_blocks:
          - type: seat_stance
            group: public_opinion
            stance: support
            cooldown_months: 12
          - type: temporary_country_modifier
            key: tv_academy_debate_harbor_exhibition
            months: 12
            effects:
              public curiosity about overseas goods: 0.02
      b:
        text:
          english: "We keep the cargo under lock until the ledgers agree."
          simp_chinese: "货物先锁起来，等账目对齐再说。"
        progress_delta: -5
        rationale:
          english: "Sealing the cargo heads off disorder and rumor, but it also keeps discovery abstract and in the officials' keeping. The debate loses momentum, for the public is denied its most immediate proof."
          simp_chinese: "封存货物挡下了混乱与谣言，却也让发现停留在抽象层面，握在官员手中。公众被剥夺了最直接的证据，辩论的势头因此减弱。"
        effect_blocks:
          - type: seat_stance
            group: court_bureaucrats
            stance: oppose
            cooldown_months: 12
          - type: temporary_country_modifier
            key: tv_academy_debate_sealed_cargo_order
            months: 12
            effects:
              port order and contraband control: 0.02
  - design_id: NW09
    pool: new_world
    issue: new_world
    weight: 1
    title:
      english: "Mapmaker's Correction"
      simp_chinese: "制图师的修正"
    desc:
      english: "A mapmaker scrapes away a traditional boundary before witnesses and inks a coast where certainty used to sit. The rasp of the knife sounds small, until the room grasps which authority has just lost its ink."
      simp_chinese: "制图师当着众人的面刮去一道传统边界，在曾经写着确定性的地方画上新的海岸。刮刀的声响很轻，直到满室的人明白，刚刚失去墨迹的是哪一种权威。"
    options:
      a:
        text:
          english: "The corrected coast is entered on the master chart, boundary and all."
          simp_chinese: "修正后的海岸连同边界，一并录入母本海图。"
        progress_delta: 10
        rationale:
          english: "Accepting the correction makes the New World debate an institutional act of revision, not merely a traveler's claim. Scholarly authority shifts toward evidence able to redraw inherited knowledge."
          simp_chinese: "接受修正，让新世界辩论成为一桩制度性的修订，而不只是旅行者的一面之词。学术权威转向那些能够改写承袭知识的证据。"
        effect_blocks:
          - type: seat_stance
            group: scholarly_community
            stance: support
            cooldown_months: 24
          - type: temporary_country_modifier
            key: tv_academy_debate_corrected_charts
            months: 24
            effects:
              survey credibility and map revision: 0.03
      b:
        text:
          english: "Back to the old map, if you please."
          simp_chinese: "劳驾，还是把旧地图挂回去吧。"
        progress_delta: -10
        rationale:
          english: "Restoring the old map shields inherited geography from public embarrassment. Conservatives take confidence, since the Academy chooses continuity over the unsettling discipline of correction."
          simp_chinese: "恢复旧地图，为承袭下来的地理知识挡下公开的难堪。学院选择了延续，而不是令人不安的修正纪律，保守派因此更有底气。"
        effect_blocks:
          - type: estate_satisfaction
            estate: nobles_estate
            value: 0.03
          - type: seat_stance
            group: nobility
            stance: oppose
            cooldown_months: 24
  - design_id: NW10
    pool: new_world
    issue: new_world
    weight: 1
    title:
      english: "Naval Officers Demand Funds"
      simp_chinese: "海军军官索要经费"
    desc:
      english: "Naval officers tell the Academy that discovery cannot be sailed on ceremonial timber. If the realm wants the ocean turned into a road, it must pay for ships built to outlast a parade."
      simp_chinese: "海军军官告诉学院，发现新世界靠的不是仪典用的木料。王国若想把海洋变成道路，就得出钱造出经得起检阅之外风浪的船。"
    options:
      a:
        text:
          english: "The dockyards are opened, and timber is cut for ships meant to survive the open sea."
          simp_chinese: "船坞开工，为经得起远海的船只备下木料。"
        progress_delta: 10
        rationale:
          english: "Funding oceanic preparation turns discovery from speculation into state capacity. The debate swings strongly toward acceptance as officers, dockyards, and planners begin treating the New World as reachable policy."
          simp_chinese: "资助远洋准备，把发现从猜想化为国家能力。军官、船坞与规划者开始把新世界当作可以抵达的政策目标，辩论因此大幅转向接受。"
        effect_blocks:
          - type: resource
            resource: gold
            scale: -2
          - type: seat_stance
