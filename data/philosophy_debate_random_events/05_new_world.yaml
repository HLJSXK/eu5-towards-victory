random_events:
  - design_id: NW01
    pool: new_world
    issue: new_world
    weight: 1
    title:
      english: "The Sailor's Chart"
      simp_chinese: "水手的海图"
    desc:
      english: "A battered chart reaches the Academy with coastlines that refuse to fit any known map. Its stains look like tavern evidence until the room notices that every wrong line still points west."
      simp_chinese: "一张破旧的海图被送进学院，上面的海岸线不肯嵌入任何已知地图。它的污痕起初像酒馆里的证据，直到满屋人发现，每一条不合旧图的线仍然指向西方。"
    options:
      a:
        text:
          english: "Trust the chart."
          simp_chinese: "信任这张海图。"
        progress_delta: 10
        rationale:
          english: "Trusting the chart lets practical seafaring evidence challenge inherited geography directly. The debate moves strongly toward acceptance because maritime merchants can now point to a usable route rather than a rumor."
          simp_chinese: "信任这张海图，就是让航海实践的证据直接挑战承袭下来的地理知识。由于海商终于能指向一条可用航路，而不是只重复传闻，辩论会强烈转向接受。"
        effect_blocks:
          - type: seat_stance
            group: maritime_merchants
            stance: support
            cooldown_months: 24
          - type: temporary_country_modifier
            key: tv_academy_debate_battered_chart
            months: 24
            effects:
              private chart copying and voyage subscriptions: 0.03
      b:
        text:
          english: "Dismiss it as tavern ink."
          simp_chinese: "将其斥为酒馆墨迹。"
        progress_delta: -10
        rationale:
          english: "Dismissing the chart protects the old map by attacking the witness rather than the coastline. Conservative listeners gain confidence because uncertain sailor knowledge is kept outside Academy authority."
          simp_chinese: "将海图斥为酒馆墨迹，是通过贬低见证者而不是检验海岸线来保护旧地图。保守听众会更有信心，因为不稳定的水手知识被挡在学院权威之外。"
        effect_blocks:
          - type: estate_satisfaction
            estate: nobles_estate
            value: 0.02
          - type: seat_stance
            group: court_bureaucrats
            stance: oppose
            cooldown_months: 18
  - design_id: NW02
    pool: new_world
    issue: new_world
    weight: 1
    title:
      english: "Returned Pilot"
      simp_chinese: "归来的领航员"
    desc:
      english: "A pilot returns with salt in their clothes, fever in their bones, and a story that repeats itself too clearly to be waved away. The Academy must decide whether the realm hears the tale as evidence or as a secret."
      simp_chinese: "一名领航员归来，衣上带着盐痕，骨子里还留着热病，讲出的故事前后一致到难以随手抹去。学院必须决定，是让王国把这段经历当作证据来听，还是当作秘密来审。"
    options:
      a:
        text:
          english: "Hear them publicly."
          simp_chinese: "公开听取其证词。"
        progress_delta: 10
        rationale:
          english: "A public hearing turns the pilot from a rumor carrier into a witnessed source. Acceptance rises sharply because the story becomes communal evidence, although the Crown spends some prestige if the testimony later proves imperfect."
          simp_chinese: "公开听证会会把领航员从传闻携带者变成有见证的来源。由于这段故事变成了共同听到的证据，接受度会显著上升，尽管若证词日后被证明并不完美，王权也会消耗一些声望。"
        effect_blocks:
          - type: seat_stance
            group: public_opinion
            stance: support
            cooldown_months: 18
          - type: resource
            resource: prestige
            amount: -5
      b:
        text:
          english: "Question them privately."
          simp_chinese: "私下盘问。"
        progress_delta: -5
        rationale:
          english: "Private questioning keeps the pilot useful to officials but denies the debate a public witness. Court caution slows acceptance without fully rejecting the possibility that the story is true."
          simp_chinese: "私下盘问可以让官员继续利用领航员，却不给辩论一个公开见证人。宫廷谨慎会减缓接受进程，但并不彻底否认这段经历可能是真的。"
        effect_blocks:
          - type: seat_cooldown
            group: court_bureaucrats
            cooldown_months: 12
          - type: temporary_country_modifier
            key: tv_academy_debate_private_pilot_interrogation
            months: 12
            effects:
              controlled handling of exploration testimony: 0.02
  - design_id: NW03
    pool: new_world
    issue: new_world
    weight: 1
    title:
      english: "Clergy Ask for Mission Rights"
      simp_chinese: "神职人员索要传教权"
    desc:
      english: "Clerics argue that discovery without conversion is only wandering with better maps. The Academy's debate is pulled between souls, surveys, and the uncomfortable question of who gets to define a new shore first."
      simp_chinese: "神职人员主张，没有皈依的发现不过是带着更好地图的游荡。学院的辩论被拉扯在灵魂、测绘，以及一个令人不安的问题之间：谁有资格最先定义一片新海岸？"
    options:
      a:
        text:
          english: "Grant mission priority."
          simp_chinese: "授予传教优先权。"
        progress_delta: -5
        rationale:
          english: "Mission priority narrows discovery into a clerical mandate before the Academy can treat new lands as an empirical problem. Clergy approve, but acceptance slows because survey, trade, and testimony become subordinate to conversion."
          simp_chinese: "传教优先会在学院把新土地视为经验问题之前，先把发现收窄成神职使命。神职人员会认可这一安排，但测绘、贸易和证词都被置于皈依之下，接受进程因此放缓。"
        effect_blocks:
          - type: estate_satisfaction
            estate: clergy_estate
            value: 0.04
          - type: temporary_country_modifier
            key: tv_academy_debate_mission_priority
            months: 18
            effects:
              missionary access ahead of geographic survey: 0.02
      b:
        text:
          english: "Balance mission with survey."
          simp_chinese: "让传教与测绘并重。"
        progress_delta: 5
        rationale:
          english: "Balancing mission with survey keeps religious purpose present while refusing to let it monopolize the meaning of discovery. The debate gains modestly because scholars can still collect evidence, though clergy satisfaction falls."
          simp_chinese: "让传教与测绘并重，既保留宗教目的，又拒绝让它垄断发现的意义。学者仍能收集证据，所以辩论会小幅转向接受，但神职人员的满意度会下降。"
        effect_blocks:
          - type: estate_satisfaction
            estate: clergy_estate
            value: -0.03
          - type: seat_stance
            group: scholarly_community
            stance: support
            cooldown_months: 18
  - design_id: NW04
    pool: new_world
    issue: new_world
    weight: 1
    title:
      english: "Merchants Want Charter"
      simp_chinese: "商人索要特许状"
    desc:
      english: "Merchants offer to fund voyages if the Crown lets them name harbors they have not yet seen. Their confidence is useful, expensive, and already trying to put a seal on empty water."
      simp_chinese: "商人提出资助远航，条件是王权允许他们给尚未见过的港湾命名。他们的信心有用、昂贵，而且已经迫不及待想把印章盖在空白海面上。"
    options:
      a:
        text:
          english: "Issue a charter."
          simp_chinese: "颁发特许状。"
        progress_delta: 10
        rationale:
          english: "A charter turns the New World claim into financed action and gives merchants a stake in proving the Academy right. Acceptance rises strongly because private capital starts treating discovery as an investable reality."
          simp_chinese: "特许状会把新世界主张转化为有资金支持的行动，也让商人有理由证明学院是对的。私人资本开始把发现视为可投资的现实，因此接受度会大幅上升。"
        effect_blocks:
          - type: estate_satisfaction
            estate: burghers_estate
            value: 0.04
          - type: seat_stance
            group: maritime_merchants
            stance: support
            cooldown_months: 24
      b:
        text:
          english: "Keep discovery under Crown lock."
          simp_chinese: "将发现权锁在王权之下。"
        progress_delta: -5
        rationale:
          english: "Keeping discovery under Crown lock preserves legitimacy and central control, but it leaves voyages dependent on cautious official timing. The debate loses momentum because interested backers are kept at arm's length."
          simp_chinese: "将发现权锁在王权之下可以维护正统性和中央控制，却也让远航继续受谨慎的官方节奏支配。由于有意资助者被保持距离，辩论的势头会减弱。"
        effect_blocks:
          - type: resource
            resource: legitimacy
            amount: 5
          - type: temporary_country_modifier
            key: tv_academy_debate_crown_discovery_lock
            months: 18
            effects:
              centralized control over overseas claims: 0.02
  - design_id: NW05
    pool: new_world
    issue: new_world
    weight: 1
    title:
      english: "Native Envoy's Account"
      simp_chinese: "原住民使者的叙述"
    desc:
      english: "A translated account from across the sea contradicts half the Academy's assumptions without sounding impressed by any of them. The room discovers that the new world has not been waiting silently to be described."
      simp_chinese: "一份来自海彼岸的译文叙述反驳了学院一半的假设，而且听起来并不为其中任何一种假设所折服。众人这才发现，新世界并不是一直沉默地等待别人来描述。"
    options:
      a:
        text:
          english: "Let it reshape the debate."
          simp_chinese: "让它重塑辩论。"
        progress_delta: 10
        rationale:
          english: "Letting the envoy's account reshape the debate treats New World peoples as sources of knowledge rather than scenery. Acceptance rises sharply because the Academy must revise geography, custom, and authority at once."
          simp_chinese: "让使者的叙述重塑辩论，意味着把新世界的人们视为知识来源，而不是风景。学院必须同时修正地理、习俗和权威，接受度因此会显著上升。"
        effect_blocks:
          - type: seat_stance
            group: minorities
            stance: support
            cooldown_months: 24
          - type: estate_satisfaction
            estate: nobles_estate
            value: -0.03
      b:
        text:
          english: "Treat it as curiosity."
          simp_chinese: "将其视为奇闻。"
        progress_delta: -10
        rationale:
          english: "Treating the account as a curiosity preserves old geography by placing unfamiliar testimony in a cabinet instead of the argument. The debate retreats sharply because living knowledge is made decorative."
          simp_chinese: "将这份叙述视为奇闻，会把陌生证词放进陈列柜，而不是放进论证中，从而保护旧地理。由于活生生的知识被装饰化，辩论会明显退回保守立场。"
        effect_blocks:
          - type: seat_stance
            group: scholarly_community
            stance: oppose
            cooldown_months: 24
          - type: temporary_country_modifier
            key: tv_academy_debate_cabinet_of_curiosities
            months: 24
            effects:
              inherited geography protected from foreign testimony: 0.03
  - design_id: NW06
    pool: new_world
    issue: new_world
    weight: 1
    title:
      english: "Disease Report"
      simp_chinese: "疾病报告"
    desc:
      english: "Physicians warn the Academy that new shores may bring fevers as well as coastlines. Supporters of discovery must now prove that prudence can travel on the same ships as curiosity."
      simp_chinese: "医生提醒学院，新海岸带来的不只海岸线，也可能有港口从未见过的热病。发现的支持者必须证明，谨慎和好奇心可以登上同一批船。"
    options:
      a:
        text:
          english: "Fund precautions and proceed."
          simp_chinese: "资助防疫并继续探索。"
        progress_delta: 5
        rationale:
          english: "Funding precautions accepts the medical warning without letting fear define the whole question. The debate moves modestly toward acceptance because discovery is presented as manageable, regulated risk rather than reckless appetite."
          simp_chinese: "资助防疫意味着承认医生的警告，却不让恐惧决定整个议题。由于探索被塑造成可管理、可规制的风险，而不是鲁莽欲望，辩论会小幅转向接受。"
        effect_blocks:
          - type: resource
            resource: gold
            scale: -1
          - type: temporary_country_modifier
            key: tv_academy_debate_quarantine_precautions
            months: 24
            effects:
              port health inspections and voyage precautions: 0.03
      b:
        text:
          english: "Use disease as warning."
          simp_chinese: "把疾病视为警告。"
        progress_delta: -5
        rationale:
          english: "Treating illness as the lesson makes caution sound responsible and gives conservative listeners a concrete danger to rally around, slowing acceptance of the New World argument."
          simp_chinese: "把疾病当作主要教训，会让谨慎显得负责任，也给保守听众一个可以共同强调的具体危险，从而减缓对新世界论点的接受。"
        effect_blocks:
          - type: estate_satisfaction
            estate: clergy_estate
            value: 0.03
          - type: seat_stance
            group: clergy
            stance: oppose
            cooldown_months: 18
  - design_id: NW07
    pool: new_world
    issue: new_world
    weight: 1
    title:
      english: "Missing Expedition"
      simp_chinese: "失踪的远征队"
    desc:
      english: "An expedition fails to return, and the empty harbor argues with better timing than any lecturer. Opponents call the silence evidence; supporters answer that the unknown was never going to surrender politely."
      simp_chinese: "一支远征队迟迟未归，空荡的港口比任何讲师都更会挑时机发言。反对者把沉默称作证据，支持者则回答说，未知从来不会礼貌地投降。"
    options:
      a:
        text:
          english: "Continue the program."
          simp_chinese: "继续航海计划。"
        progress_delta: 10
        rationale:
          english: "Continuing despite a missing expedition is a dramatic commitment to the discovery thesis. It pushes acceptance hard, but the Crown spends prestige by appearing willing to risk honor and lives before the proof is complete."
          simp_chinese: "在远征队失踪后仍继续计划，是对发现论点的强烈承诺。它会大幅推动接受，但王权也会消耗声望，因为这显得愿意在证据未全之前冒着荣誉与生命的风险。"
        effect_blocks:
          - type: resource
            resource: prestige
            amount: -10
          - type: seat_stance
            group: maritime_merchants
            stance: support
            cooldown_months: 24
      b:
        text:
          english: "Suspend voyages."
          simp_chinese: "暂停远航。"
        progress_delta: -10
        rationale:
          english: "Suspending voyages lets the loss define policy. Families, clergy, and cautious observers feel heard, while the debate retreats sharply from accepting oceanic discovery as a governing principle."
          simp_chinese: "暂停远航等于让这次损失来定义政策。家属、神职人员与谨慎的旁观者会觉得自己的担忧被听见，但辩论也会明显远离把远洋发现作为治国原则。"
        effect_blocks:
          - type: estate_satisfaction
            estate: clergy_estate
            value: 0.04
          - type: seat_stance
            group: public_opinion
            stance: oppose
            cooldown_months: 18
  - design_id: NW08
    pool: new_world
    issue: new_world
    weight: 1
    title:
      english: "Harbor Crowd"
      simp_chinese: "港口人群"
    desc:
      english: "The harbor fills with people eager to see strange goods unloaded. Each object becomes a small ambassador, giving the Academy's argument color, weight, and something the crowd can point at."
      simp_chinese: "港口挤满了想看异域货物卸船的人。每一件物品都像一位小小的使节，让学院的论点有了颜色、重量，以及围观者可以指认的形状。"
    options:
      a:
        text:
          english: "Display the goods."
          simp_chinese: "展示这些货物。"
        progress_delta: 5
        rationale:
          english: "Public display turns distant discovery into tangible evidence for ordinary observers. The progress gain is modest because curiosity is broad but shallow, yet public opinion begins leaning toward acceptance."
          simp_chinese: "公开展示会把遥远的发现变成普通旁观者也能触摸和想象的证据。进展只是小幅增加，因为这种好奇广泛却不深，但公众舆论会开始倾向接受。"
        effect_blocks:
          - type: seat_stance
            group: public_opinion
            stance: support
            cooldown_months: 12
          - type: temporary_country_modifier
            key: tv_academy_debate_harbor_exhibition
            months: 12
            effects:
              public curiosity about overseas goods: 0.02
      b:
        text:
          english: "Seal the cargo."
          simp_chinese: "封存货物。"
        progress_delta: -5
        rationale:
          english: "Sealing the cargo prevents disorder and rumor, but it also keeps discovery abstract and controlled by officials. The debate loses momentum because the public is denied its most immediate proof."
          simp_chinese: "封存货物可以防止混乱和谣言，却也让发现继续停留在抽象层面，并由官员独占解释权。由于公众被剥夺了最直接的证据，辩论的势头会减弱。"
        effect_blocks:
          - type: seat_stance
            group: court_bureaucrats
            stance: oppose
            cooldown_months: 12
          - type: temporary_country_modifier
            key: tv_academy_debate_sealed_cargo_order
            months: 12
            effects:
              port order and contraband control: 0.02
  - design_id: NW09
    pool: new_world
    issue: new_world
    weight: 1
    title:
      english: "Mapmaker's Correction"
      simp_chinese: "制图师的修正"
    desc:
      english: "A mapmaker erases a traditional boundary in front of witnesses and inks a coast where certainty used to sit. The scrape of the knife sounds small until everyone realizes what authority has just lost."
      simp_chinese: "制图师当着众人的面擦去旧有边界，在曾经写着确定性的地方画上新的海岸。刮刀的声音很轻，直到众人意识到刚刚失去墨迹的是哪一种权威。"
    options:
      a:
        text:
          english: "Accept the correction."
          simp_chinese: "接受修正。"
        progress_delta: 10
        rationale:
          english: "Accepting the correction makes the New World debate an institutional act of revision, not merely a traveler's claim. Scholarly authority shifts toward evidence that can redraw inherited knowledge."
          simp_chinese: "接受修正会让新世界辩论变成一种制度性的修订，而不只是旅行者的说法。学术权威会转向那些能够改写承袭知识的证据。"
        effect_blocks:
          - type: seat_stance
            group: scholarly_community
            stance: support
            cooldown_months: 24
          - type: temporary_country_modifier
            key: tv_academy_debate_corrected_charts
            months: 24
            effects:
              survey credibility and map revision: 0.03
      b:
        text:
          english: "Restore the old map."
          simp_chinese: "恢复旧地图。"
        progress_delta: -10
        rationale:
          english: "Restoring the old map protects inherited geography from public embarrassment. Conservatives gain confidence because the Academy chooses continuity over the unsettling discipline of correction."
          simp_chinese: "恢复旧地图可以保护承袭下来的地理知识免于公开难堪。保守派会更有信心，因为学院选择了延续，而不是令人不安的修正纪律。"
        effect_blocks:
          - type: estate_satisfaction
            estate: nobles_estate
            value: 0.03
          - type: seat_stance
            group: nobility
            stance: oppose
            cooldown_months: 24
  - design_id: NW10
    pool: new_world
    issue: new_world
    weight: 1
    title:
      english: "Naval Officers Demand Funds"
      simp_chinese: "海军军官索要经费"
    desc:
      english: "Naval officers tell the Academy that discovery cannot be sailed on ceremonial timber. If the realm wants the ocean to become a road, it must pay for ships prepared to survive more than a parade."
      simp_chinese: "海军军官告诉学院，发现新世界不能靠仪典用的木头航行。如果王国想让海洋成为道路，就必须出钱准备那些不只会参加检阅的船。"
    options:
      a:
        text:
          english: "Fund oceanic preparation."
          simp_chinese: "资助远洋准备。"
        progress_delta: 10
        rationale:
          english: "Funding oceanic preparation converts discovery from speculation into state capacity. The debate moves strongly toward acceptance because officers, dockyards, and planners begin treating the New World as reachable policy."
          simp_chinese: "资助远洋准备会把发现从猜想转化为国家能力。由于军官、船坞和规划者开始把新世界视为可以抵达的政策目标，辩论会大幅转向接受。"
        effect_blocks:
          - type: resource
            resource: gold
            scale: -2
          - type: seat_stance
            group: professional_military
            stance: support
            cooldown_months: 24
      b:
        text:
          english: "Keep fleets coastal."
          simp_chinese: "让舰队留在近海。"
        progress_delta: -5
        rationale:
          english: "Keeping fleets coastal preserves money and familiar naval priorities, but it makes discovery look like rhetoric without hulls. Fiscal caution slows acceptance without fully repudiating the idea."
          simp_chinese: "让舰队留在近海可以保存财力，也维持熟悉的海军优先事项，但这会让发现显得像没有船壳支撑的空话。财政谨慎会拖慢接受，却不至于彻底否定这个想法。"
        effect_blocks:
          - type: resource
            resource: gold
            scale: 1
          - type: seat_stance
            group: court_bureaucrats
            stance: oppose
            cooldown_months: 18
  - design_id: NW11
    pool: new_world
    issue: new_world
    weight: 1
    title:
      english: "Rumor of Gold"
      simp_chinese: "黄金传闻"
    desc:
      english: "Reports of gold spread faster than reliable latitude. Supporters argue that greed can be harnessed before it becomes policy by accident, while opponents warn that the Academy is mistaking fever for evidence."
      simp_chinese: "黄金的消息比可靠的纬度传播得更快。支持者认为，可以先利用贪欲来资助航行，免得它自行变成政策；反对者则警告，学院正在把狂热误当作证据。"
    options:
      a:
        text:
          english: "Use greed to fund voyages."
          simp_chinese: "用贪欲资助航行。"
        progress_delta: 5
        rationale:
          english: "Using gold rumors as funding accepts a morally dubious motive while keeping discovery moving. The debate gains modest acceptance because private appetite is redirected into voyages, but the side effects mark the speculative risk around that choice."
          simp_chinese: "利用黄金传闻来筹资，等于承认一种道德上可疑的动机，同时让探索继续前进。辩论会小幅转向接受，因为私人欲望被引导进航行事业；但副作用也标记了随之而来的投机风险。"
        effect_blocks:
          - type: estate_satisfaction
            estate: burghers_estate
            value: 0.03
          - type: temporary_country_modifier
            key: tv_academy_debate_gold_rumor_speculation
            months: 18
            effects:
              speculative expedition pressure: 0.03
      b:
        text:
          english: "Denounce the rumor."
          simp_chinese: "斥责这则传闻。"
        progress_delta: -5
        rationale:
          english: "Denouncing the rumor frames discovery enthusiasm as greed wearing a scholar's coat. Clergy and nobles approve of the restraint, and the debate loses momentum as moral suspicion becomes the safer public language."
          simp_chinese: "斥责传闻会把探索热情描绘成披着学者外衣的贪欲。神职人员和贵族赞成这种克制，而当道德怀疑成为更安全的公共语言时，辩论的推进也会放缓。"
        effect_blocks:
          - type: estate_satisfaction
            estate: clergy_estate
            value: 0.03
          - type: seat_stance
            group: nobility
            stance: oppose
            cooldown_months: 18
  - design_id: NW12
    pool: new_world
    issue: new_world
    weight: 1
    title:
      english: "Foreign Claim"
      simp_chinese: "外国声索"
    desc:
      english: "A rival court claims the new coast first and sends letters polished smooth by confidence. Suddenly the Academy's question is not only whether the coast exists, but whether silence would make it belong to someone else."
      simp_chinese: "一个敌对宫廷宣称自己率先发现了新海岸，并送来措辞自信得发亮的书信。学院的问题突然不再只是那片海岸是否存在，而是沉默是否会让它属于别人。"
    options:
      a:
        text:
          english: "Contest the claim."
          simp_chinese: "争辩这项声索。"
        progress_delta: 10
        rationale:
          english: "Contesting the foreign claim forces the realm to treat discovery as a real geopolitical issue, not a rumor for seminar rooms. Acceptance rises sharply because denying the rival requires asserting that the new coast matters, even at diplomatic cost."
          simp_chinese: "争辩外国声索会迫使王国把发现视为真实的地缘政治问题，而不是讲堂里的传闻。接受度会大幅上升，因为否认对手的主张就必须承认新海岸具有实际意义，即使这会付出外交代价。"
        effect_blocks:
          - type: seat_stance
            group: foreign_power
            stance: oppose
            cooldown_months: 24
          - type: resource
            resource: prestige
            amount: -10
      b:
        text:
          english: "Avoid provocation."
          simp_chinese: "避免挑衅。"
        progress_delta: -10
        rationale:
          english: "Avoiding provocation lets caution define policy. Stability is protected because the court refuses a distant quarrel, but the debate retreats hard from accepting discovery as something worth contesting."
          simp_chinese: "避免挑衅会让谨慎来定义政策。宫廷拒绝卷入遥远争端，因此国内稳定得以保全；但辩论也会明显后退，不再把发现视为值得争夺的事业。"
        effect_blocks:
          - type: temporary_country_modifier
            key: tv_academy_debate_avoided_foreign_claim_crisis
            months: 18
            effects:
              domestic calm from diplomatic restraint: 0.02
          - type: seat_stance
            group: court_bureaucrats
            stance: oppose
            cooldown_months: 24
  - design_id: NW13
    pool: new_world
    issue: new_world
    weight: 1
    title:
      english: "Cosmographer's Error"
      simp_chinese: "宇宙志学者的错误"
    desc:
      english: "The Academy's favored cosmographer admits that a major distance estimate was wrong. The error is small on parchment only because parchment is mercifully flat."
      simp_chinese: "学院偏爱的宇宙志学者承认，一项重要的距离估算错了。这个错误只有在羊皮纸上才显得很小，因为羊皮纸毕竟仁慈地保持平整。"
    options:
      a:
        text:
          english: "Praise correction as science."
          simp_chinese: "将修正誉为科学精神。"
        progress_delta: 10
        rationale:
          english: "Praising the correction turns embarrassment into the method itself. The debate moves strongly toward acceptance because New World evidence becomes proof that knowledge can improve by admitting error, though scholarly prestige is spent to make that lesson credible."
          simp_chinese: "赞扬修正会把尴尬转化为方法本身。辩论会大幅转向接受，因为新世界的证据变成了知识可以通过承认错误而进步的证明；不过，为了让这个教训可信，学术声望会被消耗。"
        effect_blocks:
          - type: resource
            resource: prestige
            amount: -10
          - type: seat_stance
            group: scholarly_community
            stance: support
            cooldown_months: 24
      b:
        text:
          english: "Hide the error."
          simp_chinese: "掩盖这个错误。"
        progress_delta: -10
        rationale:
          english: "Hiding the error preserves the old hierarchy of expertise at the cost of honest revision. Acceptance falls sharply because the Academy chooses authority's appearance over the corrected evidence that would have supported discovery."
          simp_chinese: "掩盖错误会维持旧有专家等级的体面，却牺牲诚实修正的机会。接受度会大幅下降，因为学院选择了权威的外观，而不是能够支持发现论点的修正证据。"
        effect_blocks:
          - type: estate_satisfaction
            estate: nobles_estate
            value: 0.03
          - type: seat_stance
            group: scholarly_community
            stance: oppose
            cooldown_months: 24
  - design_id: NW14
    pool: new_world
    issue: new_world
    weight: 1
    title:
      english: "Sailors' Superstitions"
      simp_chinese: "水手的迷信"
    desc:
      english: "Sailors refuse another voyage until omens are answered, and every official explanation seems to make the signs more stubborn. The Academy must decide whether fear at sea is a problem of pay, persuasion, or providence."
      simp_chinese: "水手们拒绝再次出航，除非那些征兆得到回应，而每一种官方解释似乎都让征兆变得更加顽固。学院必须判断，海上的恐惧究竟是薪酬、劝说，还是天意的问题。"
    options:
      a:
        text:
          english: "Pay and persuade them."
          simp_chinese: "付钱并劝服他们。"
        progress_delta: 5
        rationale:
          english: "Paying and persuading the sailors treats superstition as an obstacle to manage rather than a verdict against discovery. Acceptance rises modestly because the voyage program survives, but the Crown must spend to restore confidence."
          simp_chinese: "付钱并劝服水手，是把迷信当作需要管理的障碍，而不是反对发现的判决。由于远航计划得以继续，接受度会小幅上升；但王权必须花费资金来恢复信心。"
        effect_blocks:
          - type: resource
            resource: gold
            scale: -1
          - type: seat_stance
            group: maritime_merchants
            stance: support
            cooldown_months: 18
      b:
        text:
          english: "Accept their fear as wisdom."
          simp_chinese: "将他们的恐惧视为智慧。"
        progress_delta: -5
        rationale:
          english: "Accepting the sailors' fear gives religious and cautious voices a language that sounds respectful rather than timid. The debate slows because omens become acceptable evidence against further discovery."
          simp_chinese: "接受水手的恐惧，会给宗教人士和谨慎派一种听起来像尊重而不是胆怯的说法。辩论会放缓，因为征兆被承认为反对继续发现的有效证据。"
        effect_blocks:
          - type: estate_satisfaction
            estate: clergy_estate
            value: 0.03
          - type: seat_stance
            group: clergy
            stance: oppose
            cooldown_months: 18
  - design_id: NW15
    pool: new_world
    issue: new_world
    weight: 1
    title:
      english: "Colonial Charter Abuse"
      simp_chinese: "殖民特许权滥用"
    desc:
      english: "A charter holder abuses distant authority before the principle has even won the argument at home. The scandal hands opponents a sharp question: if discovery begins this badly, what exactly is being accepted?"
      simp_chinese: "一名特许权持有人在这项原则尚未于国内辩论中获胜之前，就已经滥用了远方权力。这桩丑闻给了反对者一个尖锐的问题：如果发现事业一开始就如此糟糕，我们到底是在接受什么？"
    options:
      a:
        text:
          english: "Reform charters."
          simp_chinese: "改革特许制度。"
        progress_delta: 5
        rationale:
          english: "Reforming charters admits the abuse but argues that discovery can be governed instead of abandoned. Acceptance rises modestly because regulation saves the principle, while burghers lose some freedom over distant ventures."
          simp_chinese: "改革特许制度承认了滥用，却主张发现事业可以被治理，而不是被抛弃。接受度会小幅上升，因为规制挽救了原则；但市民阶层会失去一部分经营远方事业的自由。"
        effect_blocks:
          - type: estate_satisfaction
            estate: burghers_estate
            value: -0.03
          - type: temporary_country_modifier
            key: tv_academy_debate_reformed_colonial_charters
            months: 24
            effects:
              regulated charter oversight: 0.03
      b:
        text:
          english: "Revoke the experiment."
          simp_chinese: "撤销这场实验。"
        progress_delta: -10
        rationale:
          english: "Revoking the experiment lets the scandal condemn the whole premise of distant charters. Conservatives approve because the realm chooses familiar authority over risky overseas delegation, and the debate moves sharply toward rejection."
          simp_chinese: "撤销这场实验会让丑闻定罪整个远方特许的前提。保守派会赞成，因为王国选择了熟悉的权威，而不是危险的海外授权；辩论也会明显转向拒绝。"
        effect_blocks:
          - type: estate_satisfaction
            estate: nobles_estate
            value: 0.04
          - type: seat_stance
            group: maritime_merchants
            stance: oppose
            cooldown_months: 24
  - design_id: NW16
    pool: new_world
    issue: new_world
    weight: 1
    title:
      english: "Imported Crop"
      simp_chinese: "输入作物"
    desc:
      english: "A strange crop survives in the Academy test garden, stubbornly green where theory expected only rumor. Farmers, merchants, and skeptics gather around the leaves because the unknown has become something that can be watered."
      simp_chinese: "一种陌生作物在学院试验园里活了下来，在理论只期待传闻的地方倔强地泛着绿色。农民、商人和怀疑者都围到叶片旁，因为未知之物终于变成了可以浇水的东西。"
    options:
      a:
        text:
          english: "Promote the crop."
          simp_chinese: "推广这种作物。"
        progress_delta: 5
        rationale:
          english: "Promoting the crop makes discovery practical and domestic rather than purely nautical. The gain is modest because a garden cannot prove a continent, but peasants and merchants begin to see New World contact as useful."
          simp_chinese: "推广这种作物会把发现新世界从单纯的航海问题变成务实的国内收益。进展幅度不大，因为一座试验园不能证明整片大陆，但农民和商人会开始把新世界接触视为有用之事。"
        effect_blocks:
          - type: seat_stance
            group: peasants
            stance: support
            cooldown_months: 12
          - type: estate_satisfaction
            estate: burghers_estate
            value: 0.02
      b:
        text:
          english: "Keep it contained."
          simp_chinese: "将它限制在园中。"
        progress_delta: -5
        rationale:
          english: "Containment treats the crop as a possible contamination or disruption. Cautious estates can accept study under lock and fence, but the debate loses momentum because the useful evidence is kept from ordinary life."
          simp_chinese: "将作物限制起来，是把它视作可能的污染或扰动。谨慎的阶层可以接受在围栏和看管下研究它，但由于有用证据被排除在日常生活之外，辩论的势头会减弱。"
        effect_blocks:
          - type: estate_satisfaction
            estate: nobles_estate
            value: 0.03
          - type: seat_stance
            group: local_autonomy
            stance: oppose
            cooldown_months: 12
  - design_id: NW17
    pool: new_world
    issue: new_world
    weight: 1
    title:
      english: "Treaty of Unknown Shores"
      simp_chinese: "未知海岸条约"
    desc:
      english: "Diplomats ask whether shores still half-imagined by mapmakers can already be divided by ink. The Academy's argument is suddenly not only about what exists, but about who may claim the right to arrive there first."
      simp_chinese: "外交官询问，那些制图师还只能半凭想象描绘的海岸，是否已经可以用墨水分割。学院的争论忽然不只关乎那里是否存在，也关乎谁有权声称自己可以率先抵达。"
    options:
      a:
        text:
          english: "Assert navigational rights."
          simp_chinese: "宣示航行权利。"
        progress_delta: 10
        rationale:
          english: "Asserting navigational rights makes the New World claim a matter of state doctrine before every detail is known. It drives acceptance sharply forward, while foreign powers harden against the realm's confidence."
          simp_chinese: "宣示航行权利，会在细节尚未完全明朗前把新世界主张提升为国家原则。这会强力推动接受方向，但也会让外国势力因本国的自信而转为警惕。"
        effect_blocks:
          - type: seat_stance
            group: foreign_power
            stance: oppose
            cooldown_months: 24
          - type: foreign_prestige
            amount: -5
      b:
        text:
          english: "Refuse distant entanglement."
          simp_chinese: "拒绝远方纠葛。"
        progress_delta: -10
        rationale:
          english: "Refusing entanglement lets caution define policy and avoids converting uncertain maps into diplomatic obligations. The debate retreats strongly because the court chooses safety over the legal imagination of discovery."
          simp_chinese: "拒绝远方纠葛，会让谨慎成为政策原则，并避免把不确定的地图变成外交义务。由于宫廷选择安全而不是发现所需要的法律想象，辩论会明显转向拒绝。"
        effect_blocks:
          - type: seat_stance
            group: court_bureaucrats
            stance: oppose
            cooldown_months: 24
          - type: resource
            resource: legitimacy
            amount: 5
  - design_id: NW18
    pool: new_world
    issue: new_world
    weight: 1
    title:
      english: "Missionary Grammar"
      simp_chinese: "传教士语法书"
    desc:
      english: "A missionary arrives with a grammar of a language no courtier can pronounce without humility. The pages prove that discovery has voices, rules, and meanings of its own, not merely coastlines waiting to be named."
      simp_chinese: "一名传教士带来了一部新语言的语法书，宫廷中无人能不带谦卑地读出那些音节。书页证明，发现新世界面对的是自有声音、规则和意义的人群，而不只是等待命名的海岸线。"
    options:
      a:
        text:
          english: "Circulate the grammar."
          simp_chinese: "传阅这部语法书。"
        progress_delta: 10
        rationale:
          english: "Circulating the grammar lets scholars and clergy both treat the New World as a society that can be studied, translated, and addressed. Acceptance advances strongly because the unknown gains language rather than remaining blank space."
          simp_chinese: "传阅语法书会让学者和神职人员都把新世界视为可以研究、翻译和对话的社会。由于未知之地获得了语言，而不再只是空白空间，接受方向会大幅推进。"
        effect_blocks:
          - type: seat_stance
            group: scholarly_community
            stance: support
            cooldown_months: 24
          - type: seat_stance
            group: clergy
            stance: support
            cooldown_months: 18
      b:
        text:
          english: "Keep it for missions only."
          simp_chinese: "仅供传教使用。"
        progress_delta: -5
        rationale:
          english: "Restricting the grammar to missions preserves clerical control and keeps linguistic knowledge from becoming a general Academy argument. The debate slows because voices from the New World are filtered through a single institution."
          simp_chinese: "将语法书限于传教用途，可以保留神职控制，也阻止语言知识成为学院内部更广泛的论据。由于新世界的声音被单一机构过滤，辩论会放慢脚步。"
        effect_blocks:
          - type: estate_satisfaction
            estate: clergy_estate
            value: 0.04
          - type: seat_stance
            group: clergy
            stance: oppose
            cooldown_months: 12
  - design_id: NW19
    pool: new_world
    issue: new_world
    weight: 1
    title:
      english: "Port Investors Panic"
      simp_chinese: "港口投资者恐慌"
    desc:
      english: "A storm breaks ships prepared for the next voyage, and the port's confidence cracks almost as loudly as the masts. Investors who praised discovery yesterday now study the wreckage like accountants of fear."
      simp_chinese: "一场风暴摧毁了为下一次航行准备的船只，港口的信心几乎和桅杆一起断裂。昨日还称颂发现事业的投资者，如今像恐惧的账房一样盯着残骸盘算。"
    options:
      a:
        text:
          english: "Guarantee the expedition."
          simp_chinese: "为远征提供担保。"
        progress_delta: 10
        rationale:
          english: "Guaranteeing the expedition turns a commercial panic into a public commitment. Acceptance surges because the Crown refuses to let weather decide the debate, but the treasury absorbs the risk that private investors no longer will."
          simp_chinese: "为远征提供担保，会把商业恐慌转化为公开承诺。由于王权拒绝让天气决定辩论走向，接受方向会迅速推进，但国库也必须承担私人投资者不愿再承担的风险。"
        effect_blocks:
          - type: resource
            resource: gold
            scale: -2
          - type: seat_stance
            group: maritime_merchants
            stance: support
            cooldown_months: 24
      b:
        text:
          english: "Let investors retreat."
          simp_chinese: "允许投资者退场。"
        progress_delta: -10
        rationale:
          english: "Letting investors retreat allows the wrecked ships to become a verdict on the whole enterprise. Trade confidence falls, and the debate turns sharply away from acceptance because discovery now looks financially fragile."
          simp_chinese: "允许投资者退场，会让这些破损船只成为对整项事业的判决。贸易信心下降，而发现事业也显得财务基础脆弱，因此辩论会明显转向拒绝。"
        effect_blocks:
          - type: seat_stance
            group: burghers
            stance: oppose
            cooldown_months: 24
          - type: temporary_country_modifier
            key: tv_academy_debate_port_credit_shock
            months: 18
            effects:
              port investment confidence: -0.03
  - design_id: NW20
    pool: new_world
    issue: new_world
    weight: 1
    title:
      english: "School Globe"
      simp_chinese: "学校地球仪"
    desc:
      english: "A new globe is carried into the Academy schoolroom, round enough to make old wall maps look embarrassed. Students turn it by hand, and the room discovers that geography can change under one's fingers."
      simp_chinese: "一具新的地球仪被抬进学院教室，它的圆弧足以让墙上的旧地图显得窘迫。学生们亲手转动它，整个房间发现，地理知识竟能在人们指尖下改变。"
    options:
      a:
        text:
          english: "Make it public teaching."
          simp_chinese: "将它用于公共教学。"
        progress_delta: 5
        rationale:
          english: "Public teaching spreads the New World argument through repeated instruction rather than spectacle or crisis. The progress gain is modest, but public opinion moves toward acceptance as students learn new geography as normal knowledge."
          simp_chinese: "公共教学会通过反复授课传播新世界论点，而不是依靠奇观或危机。进展幅度不大，但当学生把新地理当作正常知识来学习时，公众舆论会转向接受。"
        effect_blocks:
          - type: seat_stance
            group: public_opinion
            stance: support
            cooldown_months: 12
          - type: temporary_country_modifier
            key: tv_academy_debate_globe_lessons
            months: 12
            effects:
              public geography instruction: 0.02
      b:
        text:
          english: "Keep it for experts."
          simp_chinese: "仅供专家使用。"
        progress_delta: -5
        rationale:
          english: "Keeping the globe for experts preserves control over unsettling knowledge, but it also prevents the new map from becoming common sense. The debate slips backward because discovery remains an elite secret rather than public instruction."
          simp_chinese: "将地球仪留给专家，可以保持对令人不安知识的控制，却也阻止新地图成为常识。由于发现仍是精英掌握的秘密，而不是公众教育，辩论会向后退。"
        effect_blocks:
          - type: seat_stance
            group: court_bureaucrats
            stance: oppose
            cooldown_months: 12
          - type: estate_satisfaction
            estate: nobles_estate
            value: 0.02
