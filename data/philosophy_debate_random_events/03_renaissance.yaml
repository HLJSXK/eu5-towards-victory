random_events:
  - design_id: R01
    pool: renaissance
    issue: renaissance
    weight: 1
    title:
      english: "A Torso Unearthed"
      simp_chinese: "出土的残躯"
    desc:
      english: "Laborers turn up an ancient marble torso, its limbs long gone but its argument disturbingly whole. Artists crowd the trench and swear the stone has answered questions the commentaries kept promising to reach next year."
      simp_chinese: "工匠掘出一具古代大理石残躯，四肢早已不存，论证却完整得令人不安。艺术家围在坑边，赌咒说这块石头已经回答了注疏年复一年推说\"下次再谈\"的问题。"
    options:
      a:
        text:
          english: "The torso is set on a plinth in the Academy hall."
          simp_chinese: "残躯被立在学院大厅的基座上。"
        progress_delta: 5
        rationale:
          english: "Setting the torso on public view turns a recovered antiquity into evidence the whole hall can see, winning the artists as firm allies while the clergy grow uneasy that mere carved flesh now carries an argument."
          simp_chinese: "将残躯公开陈列，等于把一件重见天日的古物变成满堂皆可目睹的证据，令艺术家成为坚定盟友，也让神职阶层不安——一具雕出来的躯体竟也能承载论证。"
        effect_blocks:
          - type: seat_stance
            group: artists
            stance: support
            cooldown_months: 18
          - type: estate_satisfaction
            estate: clergy_estate
            value: -0.05
      b:
        text:
          english: "We lock it away among the cabinet's curiosities."
          simp_chinese: "我们把它锁进珍奇柜里。"
        progress_delta: -2.5
        rationale:
          english: "Shutting the torso away among private curiosities keeps decorum and settles conservative nerves, but it robs the debate of the public force a rediscovered classical form would have lent it."
          simp_chinese: "将残躯收进私人珍藏，体面得以保全，保守者的心也安定下来，却让辩论失去一具重见天日的古典形体本可赋予的公共力量。"
        effect_blocks:
          - type: estate_satisfaction
            estate: clergy_estate
            value: 0.05
          - type: seat_stance
            group: clergy
            stance: oppose
            cooldown_months: 12
  - design_id: R02
    pool: renaissance
    issue: renaissance
    weight: 1
    title:
      english: "Anatomy Before the Court"
      simp_chinese: "宫廷前的解剖"
    desc:
      english: "Physicians petition to hold a sanctioned dissection before courtiers and scholars. The old diagrams lie politely on the table, but the physicians warn that no amount of politeness has ever made a drawing true to the body beneath it."
      simp_chinese: "医师请求在廷臣与学者面前举行一场获准的解剖课。旧图谱端正地摊在桌上，但医师提醒众人：再端正的图，也从未因端正而贴合它底下那具真实的身体。"
    options:
      a:
        text:
          english: "The physicians open the body before the assembled court."
          simp_chinese: "医师在满座宫廷面前剖开身体。"
        progress_delta: 5
        rationale:
          english: "Opening the body gives direct observation the last word over inherited diagrams, driving Renaissance empiricism sharply forward while offending the clergy, who read the public display of flesh as a breach of sacred restraint."
          simp_chinese: "剖开身体，等于让直接观察压过沿袭的图谱、拥有最终发言权，强力推动文艺复兴式经验探究，同时冒犯神职阶层——他们视当众展示血肉为越过神圣克制的僭越。"
        effect_blocks:
          - type: seat_stance
            group: scholarly_community
            stance: support
            cooldown_months: 18
          - type: estate_satisfaction
            estate: clergy_estate
            value: -0.1
      b:
        text:
          english: "Not before this court, and not today."
          simp_chinese: "不行，不在这座宫廷，也不在今日。"
        progress_delta: -5
        rationale:
          english: "Forbidding the dissection hands the opponents a clean victory: the court elects reverence and order over demonstration, and the old diagrams are safe on the table once more."
          simp_chinese: "禁止解剖，等于把一场干净利落的胜利交给反对者：宫廷选择敬畏与秩序，而非演示，旧图谱于是重新安然躺回桌上。"
        effect_blocks:
          - type: estate_satisfaction
            estate: clergy_estate
            value: 0.1
          - type: seat_stance
            group: clergy
            stance: oppose
            cooldown_months: 18
  - design_id: R03
    pool: renaissance
    issue: renaissance
    weight: 1
    title:
      english: "Perspective in the Chapel"
      simp_chinese: "礼拜堂中的透视"
    desc:
      english: "A painter unveils a chapel design in which arches, saints, and shadows all obey a single measured vanishing point. Some call it reverence made clearer; others mutter that geometry has come to stand rather too close to the altar."
      simp_chinese: "一位画家展示了一份礼拜堂设计，拱券、圣像与阴影都服从同一个可测量的消失点。有人说这是把虔敬画得更清楚了，也有人低声嘀咕：几何站得离祭坛未免太近。"
    options:
      a:
        text:
          english: "The design is praised and set as the model for the chapel."
          simp_chinese: "该设计受到赞扬，被定为礼拜堂的范本。"
        progress_delta: 2.5
        rationale:
          english: "Praising the method lets artistic technique serve sacred space instead of profaning it, raising the artists' standing and giving the debate a measured nudge toward Renaissance craft."
          simp_chinese: "赞扬这种方法，等于让艺术技法服务神圣空间而非亵渎它，抬高艺术家的地位，也给辩论一份分寸得当的推力，倒向文艺复兴技艺。"
        effect_blocks:
          - type: artist_skill
            amount: 0.03
          - type: seat_stance
            group: artists
            stance: support
            cooldown_months: 12
      b:
        text:
          english: "Let the altar keep its ancient shape."
          simp_chinese: "让祭坛保有它古老的模样。"
        progress_delta: -2.5
        rationale:
          english: "Demanding the older forms reassures religious patrons that no novelty will redraw devotion without leave, but it blunts the claim that measurement might deepen rather than cheapen sacred art."
          simp_chinese: "要求沿用旧形式，会让宗教赞助者放心：任何新意都不得擅自重画虔敬；但这也钝化了那个论点——测量或许能加深、而非贬损神圣艺术。"
        effect_blocks:
          - type: estate_satisfaction
            estate: clergy_estate
            value: 0.05
          - type: seat_cooldown
            group: artists
            cooldown_months: 12
  - design_id: R04
    pool: renaissance
    issue: renaissance
    weight: 1
    title:
      english: "The Patronage Ledger"
      simp_chinese: "赞助账册"
    desc:
      english: "Artists lay a ledger on the table showing which workshops changed the month a patron paid, and which sermons only praised the change once it was already carved, painted, and delivered. Inspiration, the columns suggest, keeps a treasurer."
      simp_chinese: "艺术家把一本账册摊在桌上，列明哪些工坊在赞助到账那月才有变化，哪些布道只是在作品雕成、画就、交付之后才赞美这变化。账目暗示：灵感也雇了个司库。"
    options:
      a:
        text:
          english: "We open the treasury and let the court commission freely."
          simp_chinese: "我们打开国库，任宫廷放手委约。"
        progress_delta: 5
        rationale:
          english: "Opening the treasury concedes that institutions, not muses, can manufacture artistic renewal, driving Renaissance acceptance hard at an immediate cost to the coffers."
          simp_chinese: "打开国库，等于承认制造艺术更新的是制度而非缪斯，强力推动对文艺复兴的接受，却要国库立刻付出代价。"
        effect_blocks:
          - type: resource
            resource: gold
            scale: -2
          - type: seat_stance
            group: artists
            stance: support
            cooldown_months: 18
      b:
        text:
          english: "The court's giving stays ceremonial, a matter of form."
          simp_chinese: "宫廷的施予仍是礼仪，止于形式。"
        progress_delta: -2.5
        rationale:
          english: "Keeping patronage a matter of ceremony spares the treasury and keeps art subordinate to court display, but it leaves renewal hostage to private accident rather than public commitment."
          simp_chinese: "把赞助留作礼仪，省下国库开支，也让艺术继续从属于宫廷排场；但这样一来，更新只能仰仗私人偶然，而非公共承诺。"
        effect_blocks:
          - type: temporary_country_modifier
            key: tv_academy_debate_ceremonial_patronage
            months: 12
            effects:
              court expenditure restraint: 0.02
          - type: seat_stance
            group: court_bureaucrats
            stance: oppose
            cooldown_months: 12
  - design_id: R05
    pool: renaissance
    issue: renaissance
    weight: 1
    title:
      english: "The Humanist Tutor"
      simp_chinese: "人文主义导师"
    desc:
      english: "A humanist tutor argues that a ruler should read history for instruction, not ornament. Several nobles hear the word \"instruction\" and at once begin wondering precisely who is to be instructed into surrendering his old habits."
      simp_chinese: "一位人文主义导师主张，统治者读史应当是为了受教，而非装点门面。几位贵族一听\"受教\"二字，立刻琢磨起来：究竟是谁，要被教着放下自己的旧习惯。"
    options:
      a:
        text:
          english: "The tutor is given a public chair and an audience."
          simp_chinese: "导师获得一个公开讲席和一众听众。"
        progress_delta: 2.5
        rationale:
          english: "Giving the tutor a public chair folds humanist learning into the making of statesmen, nudging the debate onward while unsettling nobles who dislike seeing history turned into a measure of rank and custom."
          simp_chinese: "给导师一个公开讲席，等于把人文主义学问纳入治国者的养成，温和推进辩论，也让不愿见历史被用来衡量门第与习俗的贵族心生不安。"
        effect_blocks:
          - type: estate_satisfaction
            estate: nobles_estate
            value: -0.05
          - type: seat_stance
            group: scholarly_community
            stance: support
            cooldown_months: 12
      b:
        text:
          english: "We keep such lessons behind closed doors."
          simp_chinese: "这样的课程，我们只留在紧闭的门后。"
        progress_delta: -2.5
        rationale:
          english: "Keeping the lessons private preserves court order and noble comfort, but it turns humanist history back into an ornament for the few rather than an argument for public renewal."
          simp_chinese: "把课程留在私下，宫廷秩序与贵族的自在都保住了，却让人文主义历史重新沦为少数人的装饰，而非公共更新的论证。"
        effect_blocks:
          - type: resource
            resource: legitimacy
            amount: 5
          - type: seat_stance
            group: nobility
            stance: oppose
            cooldown_months: 12
  - design_id: R06
    pool: renaissance
    issue: renaissance
    weight: 1
    title:
      english: "Classics in the Market"
      simp_chinese: "市场上的古典诗篇"
    desc:
      english: "Cheap printed copies of the classical poets turn up on the stalls beside account books and salt fish. The Academy discovers, to its discomfort, that the old authors sound rather different when read by people who paid the market price for them."
      simp_chinese: "廉价的古典诗人印本出现在货摊上，与账簿和咸鱼摆在一处。学院颇为不安地发现：当人们按市价买下这些旧作者时，他们读起来竟大不一样。"
    options:
      a:
        text:
          english: "Let them read, salt fish and Cicero alike."
          simp_chinese: "由他们读去，咸鱼与西塞罗一同摆卖。"
        progress_delta: 2.5
        rationale:
          english: "Letting the cheap copies circulate turns Renaissance learning into a common habit rather than a guarded possession of the few, and public opinion warms to the issue accordingly."
          simp_chinese: "任廉价印本流通，会把文艺复兴式学问从少数人守护的藏品变成寻常习惯，民意也随之更倾向接受此议。"
        effect_blocks:
          - type: seat_stance
            group: public_opinion
            stance: support
            cooldown_months: 12
          - type: estate_satisfaction
            estate: burghers_estate
            value: 0.05
      b:
        text:
          english: "The copies are confined to scholars' hands."
          simp_chinese: "抄本被限定在学者手中。"
        progress_delta: -2.5
        rationale:
          english: "Confining the copies to scholars protects elite control over reading, flattering high-born readers, but it makes the Renaissance case look too fragile to survive in common hands."
          simp_chinese: "把印本限于学者，保住了精英对解释权的掌控，也讨好了出身高贵的读者，却让文艺复兴的主张显得脆弱，仿佛经不起落入寻常人手中。"
        effect_blocks:
          - type: seat_stance
            group: nobility
            stance: oppose
            cooldown_months: 12
          - type: estate_satisfaction
            estate: nobles_estate
            value: 0.05
  - design_id: R07
    pool: renaissance
    issue: renaissance
    weight: 1
    title:
      english: "Artist Versus Theologian"
      simp_chinese: "艺术家与神学家"
    desc:
      english: "An artist and a theologian fall to quarreling over whether beauty teaches truth or merely lures the soul away from it. The Academy sits and listens while brushwork and doctrine take turns accusing each other of vanity."
      simp_chinese: "一位艺术家与一位神学家争执起来：美究竟是教人认识真理，还是只把灵魂引开去。学院端坐旁听，看着笔触与教义轮番指责对方虚荣。"
    options:
      a:
        text:
          english: "We hold that beauty can school the mind in truth."
          simp_chinese: "我们主张，美可以教人心智认识真理。"
        progress_delta: 5
        rationale:
          english: "Taking the artist's side wins Renaissance method a great victory: beauty is granted standing as a way to investigate truth, though the clergy lose all faith in the debate's sense of restraint."
          simp_chinese: "站在艺术家一边，会为文艺复兴方法赢得一场大胜：美被承认为探求真理的途径，尽管神职阶层就此对这场辩论的分寸彻底失去信任。"
        effect_blocks:
          - type: artist_skill
            amount: 0.05
          - type: estate_satisfaction
            estate: clergy_estate
            value: -0.1
      b:
        text:
          english: "The Academy grants doctrine the higher seat."
          simp_chinese: "学院把更高的座次给了神学。"
        progress_delta: -5
        rationale:
          english: "Granting doctrine the higher seat sets clerical caution above artistic inquiry, sharply weakening acceptance while rewarding the guardians of doctrine and disheartening the studios."
          simp_chinese: "把更高的座次给神学，等于让教义的谨慎凌驾于艺术探究之上，显著削弱接受趋势，既奖赏教义的守护者，也令各家画室灰心。"
        effect_blocks:
          - type: estate_satisfaction
            estate: clergy_estate
            value: 0.1
          - type: artist_skill
            amount: -0.04
  - design_id: R08
    pool: renaissance
    issue: renaissance
    weight: 1
    title:
      english: "Court Masque of Renewal"
      simp_chinese: "宫廷新生假面剧"
    desc:
      english: "Courtiers propose a grand masque to celebrate rebirth, order, and the Crown's impeccable taste. All agree the doctrine would prove far more persuasive with music, costumes, and a generous sheaf of invoices."
      simp_chinese: "朝臣提议办一场盛大假面剧，颂扬新生、秩序，以及王室无可挑剔的品味。众人一致认为，只要配上音乐、戏服，再加一沓慷慨的账单，学说便会有说服力得多。"
    options:
      a:
        text:
          english: "The Crown pays for music, costumes, and stagecraft."
          simp_chinese: "王室为音乐、戏服与舞台机关买单。"
        progress_delta: 2.5
        rationale:
          english: "Funding the masque dresses Renaissance renewal as a public court ritual, helping acceptance modestly by binding the issue to spectacle and prestige, all at a genuine cost to the treasury."
          simp_chinese: "资助假面剧，等于把文艺复兴式新生装扮成公开的宫廷仪式，借盛典与声望略微推动接受，代价是国库要实打实地出一笔钱。"
        effect_blocks:
          - type: resource
            resource: gold
            scale: -1
          - type: temporary_country_modifier
            key: tv_academy_debate_court_masque
            months: 12
            effects:
              courtly prestige display: 0.02
      b:
        text:
          english: "No, spare the realm a costumed sermon."
          simp_chinese: "不必了，别拿一场盛装布道劳烦王国。"
        progress_delta: -2.5
        rationale:
          english: "Sparing the realm the masque keeps the treasury quiet and stops courtiers from dressing the issue as royal fashion, but it denies the Renaissance side a persuasive stage of its own."
          simp_chinese: "免去这场假面剧，国库得以安静，也不让朝臣把议题装扮成王室风尚；但这也剥夺了文艺复兴一方一座本可动人的舞台。"
        effect_blocks:
          - type: resource
            resource: gold
            scale: 1
          - type: seat_cooldown
            group: artists
            cooldown_months: 12
  - design_id: R09
    pool: renaissance
    issue: renaissance
    weight: 1
    title:
      english: "A Ruin Measured"
      simp_chinese: "丈量古代遗迹"
    desc:
      english: "Surveyors take the measure of the ancient ruins and turn up proportions that quietly embarrass the realm's living builders. The stones say nothing in reply, which only makes their arithmetic the harder to interrupt."
      simp_chinese: "测绘者丈量古代遗迹，量出的比例悄悄令王国在世的建造者难堪。石头对此一言不发，这反倒让它们的算术更难被人打断。"
    options:
      a:
        text:
          english: "The surveyors' figures are printed for every workshop."
          simp_chinese: "测绘者的数字被印发到各家工坊。"
        progress_delta: 2.5
        rationale:
          english: "Printing the figures lets the material evidence of antiquity discipline present practice, strengthening acceptance through craft, proportion, and the cooperation of artists and scholars."
          simp_chinese: "把丈量数字印行，等于让古代的物证反过来规范当下技艺，借工艺、比例，以及艺术家与学者的合作，来巩固接受。"
        effect_blocks:
          - type: seat_stance
            group: artists
            stance: support
            cooldown_months: 12
          - type: temporary_country_modifier
            key: tv_academy_debate_measured_ruins
            months: 18
            effects:
              architectural study momentum: 0.02
      b:
        text:
          english: "Old stones make poor schoolmasters."
          simp_chinese: "旧石头当不了好先生。"
        progress_delta: -2.5
        rationale:
          english: "Dismissing the figures as antiquarian trivia keeps the ruins as harmless curiosities rather than a case for reform, and quiets the artists who would make old stone into a present standard."
          simp_chinese: "把这些数字贬作古董趣闻，会让遗迹停留在无害收藏的地位，而非改革的凭据，也压低了那些想以古代石材立当代标准的艺术家的声音。"
        effect_blocks:
          - type: seat_cooldown
            group: artists
            cooldown_months: 12
          - type: seat_stance
            group: scholarly_community
            stance: neutral
            cooldown_months: 6
  - design_id: R10
    pool: renaissance
    issue: renaissance
    weight: 1
    title:
      english: "Women's Learning Salon"
      simp_chinese: "女性学识沙龙"
    desc:
      english: "A salon of learned women sets essays circulating that make the Academy look rather smaller than it likes to claim. The arguments arrive polished, attached to no chair or title, and inconveniently hard to wave away."
      simp_chinese: "一群博学女性主持的沙龙开始传阅文章，使学院显得远不如它自诩的那般宏大。这些论证送来时字斟句酌，不附任何讲席或头衔，且麻烦地难以挥手赶走。"
    options:
      a:
        text:
          english: "We read the essays into the record without asterisk."
          simp_chinese: "我们把这些文章原样读入记录，不加星注。"
        progress_delta: 5
        rationale:
          english: "Reading the essays into the record strongly advances acceptance, for the Academy admits that Renaissance learning can flourish well beyond its familiar male and official channels, however loudly the conservative estates object."
          simp_chinese: "把这些文章读入记录，会显著推动接受，因为学院承认：文艺复兴式学问能在它熟悉的男性与官方渠道之外蓬勃生长——任凭保守阶层如何高声反对。"
        effect_blocks:
          - type: seat_stance
            group: public_opinion
            stance: support
            cooldown_months: 24
          - type: estate_satisfaction
            estate: nobles_estate
            value: -0.05
          - type: estate_satisfaction
            estate: clergy_estate
            value: -0.05
      b:
        text:
          english: "The salon is waved off as mere drawing-room talk."
          simp_chinese: "沙龙被挥手斥为不过是客厅清谈。"
        progress_delta: -5
        rationale:
          english: "Waving the salon off restores courtly and conservative comfort, but it teaches the whole hall that the learning it will accept must stay socially narrow and stamped with official credentials."
          simp_chinese: "把沙龙挥手赶走，宫廷与保守派的自在都回来了，却也等于教全场明白：它肯接受的学问，必须保持狭窄的社会边界，并盖上官方资格的印章。"
        effect_blocks:
          - type: seat_stance
            group: court_bureaucrats
            stance: oppose
            cooldown_months: 24
          - type: estate_satisfaction
            estate: nobles_estate
            value: 0.1
  - design_id: R11
    pool: renaissance
    issue: renaissance
    weight: 1
    title:
      english: "Translation of a Greek Text"
      simp_chinese: "希腊文本的翻译"
    desc:
      english: "A Greek manuscript arrives carrying just enough ambiguity to start three arguments and found one school."
      simp_chinese: "一部希腊手稿送抵学院，其中的含混恰好足以引发三场争论，并开创一个学派。"
    options:
      a:
        text:
          english: "The Academy hires copyists and philologists to render it whole."
