      simp_chinese: "市民提议设立一项共同基金，接济水手的家属、折本的商队，以及那些尾随着一趟再未归来的旅程而至的沉默灾难。这方案让风险不再那么像命运，而更像一屋子书吏可以合起来计算的东西。"
