    weight: 1
    title:
      english: "A Scholar of Interest"
      simp_chinese: "利息学者"
    desc:
      english: "A mathematician works compound interest across a clean slate, and several listeners look as though the chalk has just named them by name. What had passed for a merchant's habit becomes, line by line, a law of numbers."
      simp_chinese: "一位数学家在干净的石板上一步步推演复利，几名听众的神情，仿佛那支粉笔刚刚点了自己的名。原本被当作商人习性的东西，随着一行行算式，成了数字的法则。"
    options:
      a:
