random_events:
  - design_id: B01
    pool: banking
    issue: banking
    weight: 1
    title:
      english: "Double-Entry Demonstration"
      simp_chinese: "复式记账演示"
    desc:
      english: "A merchant accountant opens a ledger before the Academy and matches every claim to a counterclaim. The arithmetic is dry, merciless, and suddenly more persuasive than rhetoric."
      simp_chinese: "一位商人会计在学院众人面前摊开账簿，把每一项主张都同对应的反项核在一起。这套算术枯燥、冷峻，却忽然比修辞更有说服力。"
    options:
      a:
        text:
          english: "Adopt double-entry standards."
          simp_chinese: "采用复式记账标准。"
        progress_delta: 10
        rationale:
          english: "Double-entry standards make banking reform look like a practical discipline rather than a merchant trick, so supporters can point to a method that reveals fraud and steadies trust."
          simp_chinese: "复式记账标准会让银行改革显得是一门可执行的制度，而不是商人的花招；支持者因此能指向一种既能揭露欺诈、又能稳住信任的方法。"
        effect_blocks:
          - type: estate_satisfaction
            estate: burghers_estate
            value: 0.04
          - type: seat_stance
            group: burghers
            stance: support
            cooldown_months: 18
      b:
        text:
          english: "Keep older accounts."
          simp_chinese: "保留旧式账目。"
        progress_delta: -5
        rationale:
          english: "Keeping older accounts avoids upsetting clerks and offices that know the old forms, but it lets ambiguity remain respectable and slows acceptance of banking discipline."
          simp_chinese: "保留旧式账目可以避免惊扰熟悉旧格式的文书和官署，但也让含混继续披着体面的外衣，拖慢对银行制度纪律的接受。"
        effect_blocks:
          - type: seat_stance
            group: court_bureaucrats
            stance: oppose
            cooldown_months: 12
          - type: temporary_country_modifier
            key: tv_academy_debate_familiar_accounts
            months: 18
            effects:
              old-account routine preserved: 0.02
  - design_id: B02
    pool: banking
    issue: banking
    weight: 1
    title:
      english: "Noble Debt Roll"
      simp_chinese: "贵族债册"
    desc:
      english: "Bankers arrive with a roll of noble debts, sealed twice and whispered over once. It shows that several proud estates stand on credit they publicly despise."
      simp_chinese: "银行家带来一卷贵族债册，蜡封了两层，流言却早已绕过一圈。它表明好几座骄傲的庄园，正靠他们公开鄙夷的信用支撑门面。"
    options:
      a:
        text:
          english: "Use the roll as proof."
          simp_chinese: "将债册作为证据。"
        progress_delta: 10
        rationale:
          english: "Publicly using the roll exposes that old landed power already depends on credit, making banking reform harder to dismiss while angering nobles whose dependence is now visible."
          simp_chinese: "公开使用债册会揭穿旧有土地权力早已依赖信用，使银行改革更难被轻易否定，同时也激怒那些债务依赖被看见的贵族。"
        effect_blocks:
          - type: estate_satisfaction
            estate: nobles_estate
            value: -0.05
          - type: seat_stance
            group: public_opinion
            stance: support
            cooldown_months: 12
      b:
        text:
          english: "Suppress the roll."
          simp_chinese: "压下这卷债册。"
        progress_delta: -10
        rationale:
          english: "Suppression protects noble dignity and keeps the alliance of credit and privilege quiet, but it tells the debate that banking law must yield whenever rank is embarrassed."
          simp_chinese: "压下债册能保护贵族体面，让信用与特权之间的联盟继续保持安静；但这也等于告诉辩论，一旦等级尊严受损，银行法就必须退让。"
        effect_blocks:
          - type: estate_satisfaction
            estate: nobles_estate
            value: 0.04
          - type: seat_stance
            group: nobility
            stance: oppose
            cooldown_months: 18
  - design_id: B03
    pool: banking
    issue: banking
    weight: 1
    title:
      english: "Sermon on Usury"
      simp_chinese: "反高利贷布道"
    desc:
      english: "At dawn a preacher turns interest into a sin that every debtor can understand. By noon the Academy is arguing whether regulation purifies credit or merely gives vice a receipt."
      simp_chinese: "黎明时分，一位布道者把利息说成每个债务人都能听懂的罪。到正午，学院已经在争论：监管能净化信用，还是只给恶习开了一张收据。"
    options:
      a:
        text:
          english: "Defend regulated interest."
          simp_chinese: "为受监管的利息辩护。"
        progress_delta: 5
        rationale:
          english: "Defending regulated interest accepts moral anxiety but argues that law can discipline credit, nudging the debate toward reform while offending clergy who want a clearer condemnation."
          simp_chinese: "为受监管的利息辩护，等于承认道德忧虑却主张法律可以约束信用；这会推动辩论走向改革，也会冒犯希望更直接谴责的神职阶层。"
        effect_blocks:
          - type: estate_satisfaction
            estate: clergy_estate
            value: -0.04
          - type: seat_stance
            group: burghers
            stance: support
            cooldown_months: 12
      b:
        text:
          english: "Condemn the practice."
          simp_chinese: "谴责这种做法。"
        progress_delta: -10
        rationale:
          english: "Condemnation gives the sermon the last word, pleasing religious authorities but casting the banking system as a moral danger rather than an institution that can be governed."
          simp_chinese: "谴责会让布道成为最后结论，取悦宗教权威，却把银行体系塑造成道德危险，而不是一种可以被治理的制度。"
        effect_blocks:
          - type: estate_satisfaction
            estate: clergy_estate
            value: 0.05
          - type: seat_stance
            group: clergy
            stance: oppose
            cooldown_months: 18
  - design_id: B04
    pool: banking
    issue: banking
    weight: 1
    title:
      english: "Public Bank Proposal"
      simp_chinese: "公共银行提案"
    desc:
      english: "City burghers draft a public bank backed by Crown promise. The plan offers stability on paper and then invites everyone to ask what the promise itself is worth."
      simp_chinese: "城市市民起草了一份由王室承诺担保的公共银行方案。纸面上它能带来稳定，却也立刻让所有人追问：这份承诺本身究竟值多少。"
    options:
      a:
        text:
          english: "Charter the bank."
          simp_chinese: "特许成立银行。"
        progress_delta: 10
        rationale:
          english: "Chartering the bank turns the debate from theory into public credit, giving reformers a flagship institution while putting the Crown's credibility visibly at stake."
          simp_chinese: "特许成立银行会把辩论从理论推向公共信用，为改革者提供一个标志性制度，同时也把王室信誉明明白白地押上台面。"
        effect_blocks:
          - type: resource
            resource: legitimacy
            amount: -5
          - type: seat_stance
            group: burghers
            stance: support
            cooldown_months: 18
      b:
        text:
          english: "Delay the charter."
          simp_chinese: "推迟特许状。"
        progress_delta: -5
        rationale:
          english: "Delay reassures conservative officials that the Crown will not guarantee a fragile experiment too quickly, but hesitation makes banking reform look premature."
          simp_chinese: "推迟会让保守官员放心，认为王室不会过快担保一项脆弱的试验；但这种犹豫也会让银行改革显得尚未成熟。"
        effect_blocks:
          - type: estate_satisfaction
            estate: nobles_estate
            value: 0.02
          - type: seat_stance
            group: court_bureaucrats
            stance: oppose
            cooldown_months: 12
  - design_id: B05
    pool: banking
    issue: banking
    weight: 1
    title:
      english: "Debased Coin Panic"
      simp_chinese: "劣币恐慌"
    desc:
      english: "Rumor claims the coin in every purse is thinner than the Crown's promise. Markets begin weighing trust as carefully as silver."
      simp_chinese: "流言声称每只钱袋里的硬币，都比王室承诺更薄。市场于是开始像称量白银一样，仔细称量信任。"
    options:
      a:
        text:
          english: "Reform the coinage."
          simp_chinese: "改革铸币。"
        progress_delta: 10
        rationale:
          english: "Reforming the coinage pays a real fiscal cost to prove that monetary trust can be governed, giving the banking argument a visible foundation in reliable money."
          simp_chinese: "改革铸币需要付出真实的财政代价，以证明货币信任可以被治理；这会让银行制度的论证建立在可靠货币这一可见基础之上。"
        effect_blocks:
          - type: resource
            resource: gold
            scale: -1
          - type: seat_stance
            group: burghers
            stance: support
            cooldown_months: 12
      b:
        text:
          english: "Blame rumor-mongers."
          simp_chinese: "指责散布流言者。"
        progress_delta: -5
        rationale:
          english: "Blaming rumor-mongers preserves immediate order and avoids paying for reform, but it treats monetary distrust as disobedience rather than a banking problem to solve."
          simp_chinese: "指责散布流言者能维持眼前秩序，也能避免改革开支；但这把货币不信任视为不服从，而不是需要解决的银行制度问题。"
        effect_blocks:
          - type: resource
            resource: stability
            amount: 1
          - type: seat_stance
            group: public_opinion
            stance: oppose
            cooldown_months: 12
  - design_id: B06
    pool: banking
    issue: banking
    weight: 1
    title:
      english: "Widow's Deposit"
      simp_chinese: "寡妇的存款"
    desc:
      english: "A widow comes before the Academy with a receipt, a lost dowry, and a voice too steady to dismiss. What had sounded like an argument over banking rules now has a face in the hall."
      simp_chinese: "一名寡妇带着收据、失去的嫁资和不容轻慢的平静声音来到学院。原本抽象的银行规则之争，忽然在大厅里有了人的面孔。"
    options:
      a:
        text:
          english: "Regulate deposits."
          simp_chinese: "监管存款。"
        progress_delta: 5
        rationale:
          english: "Regulating deposits turns the banking debate toward public trust and ordinary depositors, making reform easier to defend even while commercial bankers accept closer oversight."
          simp_chinese: "监管存款会把银行制度之争转向公共信任和普通存户，使改革更容易被辩护，即使商业银行家必须接受更严密的监督。"
        effect_blocks:
          - type: seat_stance
            group: public_opinion
            stance: support
            cooldown_months: 12
          - type: estate_satisfaction
            estate: burghers_estate
            value: -0.02
      b:
        text:
          english: "Treat it as private misfortune."
          simp_chinese: "视为私人不幸。"
        progress_delta: -5
        rationale:
          english: "Calling the loss a private misfortune shields bankers from new limits, but it tells undecided listeners that the proposed system protects institutions before people."
          simp_chinese: "将损失称为私人不幸，可以让银行家免于新的限制，但也会让摇摆的旁听者觉得，拟议中的制度先保护机构，而不是保护人。"
        effect_blocks:
          - type: seat_stance
            group: public_opinion
            stance: oppose
            cooldown_months: 12
          - type: estate_satisfaction
            estate: burghers_estate
            value: 0.02
  - design_id: B07
    pool: banking
    issue: banking
    weight: 1
    title:
      english: "Royal Loan Refusal"
      simp_chinese: "王室贷款遭拒"
    desc:
      english: "An emergency loan is requested in the Crown's name, and the bankers answer with silence, then conditions. The hall learns that unclear banking law can make even royal need wait at the counter."
      simp_chinese: "王室以紧急之名请求贷款，银行家先以沉默回应，随后才提出条件。大厅由此明白，含混的银行法甚至能让王室的急需在柜台前等待。"
    options:
      a:
        text:
          english: "Clarify the law."
          simp_chinese: "澄清法律。"
        progress_delta: 10
        rationale:
          english: "Clarifying the law concedes that credit needs predictable rules rather than pure royal command, strongly advancing banking reform while costing the Crown some aura of unquestioned authority."
          simp_chinese: "澄清法律等于承认信用需要可预期的规则，而不能只靠王命推动；这会大幅推进银行改革，同时削弱王权不容置疑的光环。"
        effect_blocks:
          - type: resource
            resource: legitimacy
            amount: -5
          - type: seat_stance
            group: court_bureaucrats
            stance: support
            cooldown_months: 18
      b:
        text:
          english: "Threaten the bankers."
          simp_chinese: "威胁银行家。"
        progress_delta: -10
        rationale:
          english: "Threatening the bankers preserves the image that royal authority cannot be bargained with, but it turns the debate away from durable credit law and toward coercion."
          simp_chinese: "威胁银行家可以维持王权不可讨价还价的形象，却会把辩论从持久的信用法律转向强制手段。"
        effect_blocks:
          - type: resource
            resource: legitimacy
            amount: 5
          - type: estate_satisfaction
            estate: burghers_estate
            value: -0.04
  - design_id: B08
    pool: banking
    issue: banking
    weight: 1
    title:
      english: "Bills of Exchange"
      simp_chinese: "汇票"
    desc:
      english: "Merchants lay out letters, seals, and signatures showing how wealth can cross borders while guarded carts are still choosing a road. The paper looks fragile until everyone notices how much coin it commands."
      simp_chinese: "商人摊开书信、印章和签名，证明财富可以在护送钱车尚未选路时就已越过边境。纸张看似脆弱，直到众人看见它能调动多少硬币。"
    options:
      a:
        text:
          english: "Endorse bills of exchange."
          simp_chinese: "认可汇票。"
        progress_delta: 5
        rationale:
          english: "Endorsing bills of exchange makes banking reform useful to trade rather than merely tidy in ledgers, giving maritime merchants a practical reason to support the new system."
          simp_chinese: "认可汇票会让银行改革不只是账本整洁，而是真正服务贸易，使海商有切身理由支持新制度。"
        effect_blocks:
          - type: seat_stance
            group: maritime_merchants
            stance: support
            cooldown_months: 18
          - type: temporary_country_modifier
            key: tv_academy_debate_bills_of_exchange
            months: 24
            effects:
              commercial transfer confidence: 0.02
      b:
        text:
          english: "Restrict paper instruments."
          simp_chinese: "限制纸面工具。"
        progress_delta: -5
        rationale:
          english: "Restricting paper instruments reassures estates that prefer visible coin and familiar routes, but it leaves the debate suspicious of financial abstraction."
          simp_chinese: "限制纸面工具会安抚偏好实体硬币和熟悉路线的等级势力，却也会让这场辩论继续怀疑金融抽象化本身。"
        effect_blocks:
          - type: seat_stance
            group: nobility
            stance: oppose
            cooldown_months: 12
          - type: estate_satisfaction
            estate: nobles_estate
            value: 0.02
  - design_id: B09
    pool: banking
    issue: banking
    weight: 1
    title:
      english: "Fraudulent Ledger"
      simp_chinese: "欺诈账簿"
    desc:
      english: "The ledger is elegant, balanced, and false. Its columns possess the calm beauty of order, which makes the theft behind them feel like an insult to arithmetic itself."
      simp_chinese: "这本账簿优雅、平衡，并且虚假。它的栏目带着秩序的冷静美感，也因此让藏在其中的盗窃显得像是对算术本身的侮辱。"
    options:
      a:
        text:
          english: "Use it to demand standards."
          simp_chinese: "借此要求标准。"
        progress_delta: 10
        rationale:
          english: "Using the fraudulent ledger as evidence turns scandal into a demand for enforceable standards, but exposing a beautiful crime costs prestige because the Academy admits how easily order can be forged."
          simp_chinese: "将欺诈账簿作为证据，会把丑闻转化为对可执行标准的要求；但揭开这场漂亮的犯罪也会损耗声望，因为学院承认秩序原来如此容易被伪造。"
        effect_blocks:
          - type: resource
            resource: prestige
            amount: -10
          - type: seat_stance
            group: court_bureaucrats
            stance: support
            cooldown_months: 18
      b:
        text:
          english: "Punish only the clerk."
          simp_chinese: "只惩罚书记员。"
        progress_delta: -10
        rationale:
          english: "Punishing only the clerk contains the scandal and protects elite patrons from scrutiny, but it teaches the debate that banking rules will be enforced only where power is weakest."
          simp_chinese: "只惩罚书记员可以压住丑闻，并保护上层赞助人免受追查；但这会让辩论意识到，银行规则只会在权力最弱处得到执行。"
        effect_blocks:
          - type: estate_satisfaction
            estate: nobles_estate
            value: 0.03
          - type: estate_satisfaction
            estate: burghers_estate
            value: 0.02
  - design_id: B10
    pool: banking
    issue: banking
    weight: 1
    title:
      english: "Clerical Credit Chest"
      simp_chinese: "教会信用箱"
    desc:
      english: "Monasteries and church offices open their records just far enough to reveal a web of loans, pledges, and quiet exemptions. The debate discovers that sacred hands can also count interest."
      simp_chinese: "修道院和教会机构把记录打开到刚好足以露出贷款、抵押和沉默豁免的网络。辩论由此发现，神圣之手同样会计算利息。"
    options:
      a:
        text:
          english: "Bring them under law."
          simp_chinese: "将其纳入法律。"
        progress_delta: 5
        rationale:
          english: "Bringing clerical credit under law extends banking reform beyond merchants and royal offices, proving that no lender can claim sanctity as a permanent exemption."
          simp_chinese: "将教会信用纳入法律，会把银行改革扩展到商人和王室机构之外，证明没有放贷者能永远以神圣名义获得豁免。"
        effect_blocks:
          - type: estate_satisfaction
            estate: clergy_estate
            value: -0.04
          - type: seat_stance
            group: religious_reformers
            stance: support
            cooldown_months: 18
      b:
        text:
          english: "Exempt religious credit."
          simp_chinese: "豁免宗教信用。"
        progress_delta: -5
        rationale:
          english: "Exempting religious credit keeps clergy satisfied and avoids a doctrinal quarrel, but it leaves a large lending network outside the very standards the debate claims to need."
          simp_chinese: "豁免宗教信用可以维持神职阶层满意，并避免教义争执；但这也会让一个庞大的借贷网络留在辩论所主张的标准之外。"
        effect_blocks:
          - type: estate_satisfaction
            estate: clergy_estate
            value: 0.04
          - type: seat_stance
            group: religious_reformers
            stance: oppose
            cooldown_months: 18
  - design_id: B11
    pool: banking
    issue: banking
    weight: 1
    title:
      english: "City Bank Riot"
      simp_chinese: "城市银行骚乱"
    desc:
      english: "Debtors and creditors clash outside a city bank, each side waving contracts like injuries and calling the other side robbery with better handwriting. The Academy cannot pretend that banking reform is only an argument among ledgers."
      simp_chinese: "债务人与债权人在城市银行门前冲突，双方都把契约挥得像伤口，并指责对方只是字迹更工整的抢劫。学院再也不能假装银行改革只是账簿之间的争论。"
    options:
      a:
        text:
          english: "Mediate with new rules."
          simp_chinese: "以新规则调停。"
        progress_delta: 5
        rationale:
          english: "Mediation accepts that credit disputes need public rules rather than private force. It costs stability because the Crown must step into a street crisis before those rules have earned trust."
          simp_chinese: "调停意味着承认信用纠纷需要公共规则，而不是私人暴力。它会消耗稳定，因为王权必须在这些规则取得信任之前介入街头危机。"
        effect_blocks:
          - type: resource
            resource: stability
            amount: -1
          - type: seat_stance
            group: public_opinion
            stance: support
            cooldown_months: 12
      b:
        text:
          english: "Close the bank temporarily."
          simp_chinese: "暂时关闭银行。"
        progress_delta: -10
        rationale:
          english: "Closing the bank restores visible order, but it teaches the room that banking institutions are too dangerous to reform in public and pushes the debate toward rejection."
          simp_chinese: "关闭银行可以恢复表面秩序，但它也让会场相信银行机构过于危险，不能公开改革，从而把辩论推向否定。"
        effect_blocks:
          - type: resource
            resource: stability
            amount: 1
          - type: seat_stance
            group: burghers
            stance: oppose
            cooldown_months: 12
  - design_id: B12
    pool: banking
    issue: banking
    weight: 1
    title:
      english: "Tax Farm Accounts"
      simp_chinese: "包税账目"
    desc:
      english: "Tax farmers object that transparent finance will make their profession less profitable, which is true and therefore very badly received. Their ledgers arrive tied in ribbon, as if ribbon could make rents look like service."
      simp_chinese: "包税人抗议说，透明财政会让他们的行当不再那么有利可图；这话是真的，所以格外刺耳。他们把账簿用缎带捆好送来，仿佛缎带能把租利装扮成服务。"
    options:
      a:
        text:
          english: "Audit the farms."
          simp_chinese: "审计包税账目。"
        progress_delta: 10
        rationale:
          english: "Auditing tax farms turns banking reform into a direct attack on opaque fiscal privilege. It strongly advances acceptance, but nobles and revenue contractors resent losing the profitable shadows around collection."
          simp_chinese: "审计包税把银行改革变成对不透明财政特权的直接挑战。它会大幅推动接受改革，但贵族和承包税收者会怨恨征收过程中的有利阴影被驱散。"
        effect_blocks:
          - type: estate_satisfaction
            estate: nobles_estate
            value: -0.04
          - type: seat_stance
            group: court_bureaucrats
            stance: support
            cooldown_months: 18
      b:
        text:
          english: "Preserve tax custom."
          simp_chinese: "保留税收惯例。"
        progress_delta: -10
        rationale:
          english: "Preserving custom keeps short-term collections comfortable and avoids a fight with entrenched contractors, but it concedes that finance should remain private knowledge guarded by privileged hands."
          simp_chinese: "保留惯例能让短期税收显得安稳，也能避免同根深蒂固的承包人开战，但这等于承认财政仍应是由特权之手守护的私人知识。"
        effect_blocks:
          - type: resource
            resource: gold
            scale: 1
          - type: seat_stance
            group: nobility
            stance: oppose
            cooldown_months: 18
  - design_id: B13
    pool: banking
    issue: banking
    weight: 1
    title:
      english: "Scholar of Interest"
      simp_chinese: "利息学者"
    desc:
      english: "A mathematician demonstrates compound interest on a clean slate, and several listeners look as if the chalk has named them personally. What had seemed like merchant habit becomes a law of numbers."
      simp_chinese: "一位数学家在干净的石板上演示复利，几名听众的神情仿佛粉笔点名点到了自己。原本像商人习惯的东西，忽然变成了数字的法则。"
    options:
      a:
        text:
          english: "Teach the method."
          simp_chinese: "讲授这种方法。"
        progress_delta: 5
        rationale:
          english: "Teaching compound interest makes credit legible as knowledge rather than mystery, so scholars can defend regulated finance with clearer tools. The gain is modest because clarity also alarms debtors."
          simp_chinese: "讲授复利把信用从神秘技艺变成可理解的知识，使学者能用更清晰的工具为受监管的金融辩护。推进幅度有限，因为这种清晰同样会让债务人不安。"
        effect_blocks:
          - type: seat_stance
            group: scholarly_community
            stance: support
            cooldown_months: 12
          - type: scientist_attribute
            adm: 1
            dip: 0
      b:
        text:
          english: "Keep the calculation obscure."
          simp_chinese: "让计算继续晦涩。"
        progress_delta: -5
        rationale:
          english: "Keeping the calculation obscure spares debtors the humiliation of seeing their burden grow by formula, but it also leaves banking reform dependent on private expertise rather than shared rules."
          simp_chinese: "让计算继续晦涩，可以让债务人免于看见自己的负担被公式放大的羞辱，但这也使银行改革继续依赖私人专家，而不是共同规则。"
        effect_blocks:
          - type: estate_satisfaction
            estate: peasants_estate
            value: 0.02
          - type: seat_stance
            group: public_opinion
            stance: oppose
            cooldown_months: 12
  - design_id: B14
    pool: banking
    issue: banking
    weight: 1
    title:
      english: "Merchant Widow Fund"
      simp_chinese: "商人遗孀基金"
    desc:
      english: "Burghers propose a pooled fund for sailors' families, failed caravans, and the quiet disasters that follow a broken journey home. The proposal makes risk look less like fate and more like something that can be counted together."
      simp_chinese: "市民提议设立共同基金，照顾水手家属、失利商队，以及归途断裂后接踵而来的沉默灾难。这个提案让风险不再像命运，而更像某种可以共同计算的东西。"
    options:
      a:
        text:
          english: "Recognize pooled risk."
          simp_chinese: "承认共同分担风险。"
        progress_delta: 10
        rationale:
          english: "Recognizing pooled risk makes banking reform socially useful instead of merely profitable. Burghers gain satisfaction because their financial institutions are treated as civic protection rather than clever speculation."
          simp_chinese: "承认共同分担风险，会让银行改革显得具有社会用途，而不只是牟利手段。市民会更满意，因为他们的金融制度被视为公共保护，而不是精巧投机。"
        effect_blocks:
          - type: estate_satisfaction
            estate: burghers_estate
            value: 0.04
          - type: temporary_country_modifier
            key: tv_academy_debate_pooled_risk_fund
            months: 24
            effects:
              merchant family security: 0.03
      b:
        text:
          english: "Reject novel liability."
          simp_chinese: "拒绝新式责任。"
        progress_delta: -5
        rationale:
          english: "Rejecting novel liability reassures conservative lawyers that responsibility should remain attached to visible persons and old contracts, but it weakens the case for banking as organized trust."
          simp_chinese: "拒绝新式责任会安抚保守法学者，使他们相信责任仍应附着在可见个人和旧契约上，但这会削弱银行作为有组织信任的论证。"
        effect_blocks:
          - type: seat_stance
            group: court_bureaucrats
            stance: oppose
            cooldown_months: 12
          - type: temporary_country_modifier
            key: tv_academy_debate_liability_restraint
            months: 12
            effects:
              legal administration burden: -0.02
  - design_id: B15
    pool: banking
    issue: banking
    weight: 1
    title:
      english: "Foreign Banker Arrives"
      simp_chinese: "外国银行家到来"
    desc:
      english: "A foreign banking house offers expertise, capital, and a contract whose clauses are too neat to be innocent. Supporters see imported knowledge; opponents see the realm's purse learning a foreign accent."
      simp_chinese: "一家外国银行行号带来专门知识、资本，以及一份条款整齐得不可能天真的契约。支持者看见输入的知识，反对者则看见王国的钱袋开始带上外国口音。"
    options:
      a:
        text:
          english: "Invite them under regulation."
          simp_chinese: "在监管下邀请他们。"
        progress_delta: 5
        rationale:
          english: "Inviting the foreign bankers under regulation accepts outside expertise while claiming that law can domesticate it. The reform advances, but foreign influence becomes more visible inside the debate."
          simp_chinese: "在监管下邀请外国银行家，等于接受外来专长，同时宣称法律可以驯化它。改革会向前推进，但外国影响也会在辩论中变得更醒目。"
        effect_blocks:
          - type: seat_stance
            group: foreign_power
            stance: support
            cooldown_months: 18
          - type: foreign_prestige
            amount: 5
      b:
        text:
          english: "Keep banking domestic."
          simp_chinese: "保持银行业本土化。"
        progress_delta: -5
        rationale:
          english: "Keeping banking domestic reassures nobles and protectionists that financial sovereignty remains familiar, but it narrows the debate away from regulated expertise and toward inherited suspicion."
          simp_chinese: "保持银行业本土化会安抚贵族和保护主义者，让他们相信金融主权仍掌握在熟悉之人手中，但这也会让辩论远离受监管的专长，转向继承下来的猜疑。"
        effect_blocks:
          - type: estate_satisfaction
            estate: nobles_estate
            value: 0.03
          - type: seat_stance
            group: nobility
            stance: oppose
            cooldown_months: 18
  - design_id: B16
    pool: banking
    issue: banking
    weight: 1
    title:
      english: "Mint Officer's Confession"
      simp_chinese: "铸币官的供认"
    desc:
      english: "A tired mint officer admits that the old coinage routine survives on tolerated confusion: clipped weights, private exceptions, and ledgers no one quite dares to reconcile."
      simp_chinese: "一名疲惫的铸币官承认，旧有铸币流程靠被默许的混乱维持：被削薄的成色、私下通融的例外，以及无人真正敢对清的账册。"
    options:
      a:
        text:
          english: "Publicize the confession."
          simp_chinese: "公开这份供认。"
        progress_delta: 10
        rationale:
          english: "Publicizing the confession turns monetary confusion from a technical inconvenience into evidence that banking reform is necessary for public trust. The realm's legitimacy suffers because the Crown appears to have tolerated the confusion for years."
          simp_chinese: "公开供认会把货币混乱从技术麻烦变成证据，说明银行改革是公共信任所必需。国家正当性会受损，因为王室看起来已经多年容忍这种混乱。"
        effect_blocks:
          - type: resource
            resource: legitimacy
            amount: -10
          - type: seat_stance
            group: scholarly_community
            stance: support
            cooldown_months: 18
      b:
        text:
          english: "Retire them quietly."
          simp_chinese: "让其悄然退休。"
        progress_delta: -10
        rationale:
          english: "Quiet retirement protects the immediate calm of the mint and lets officials claim the matter was only personal weakness, but it buries the systemic proof reformers needed."
          simp_chinese: "悄然退休可以保护铸币体系的短期平静，也让官员把问题说成个人失职；但它会埋掉改革派最需要的制度性证据。"
        effect_blocks:
          - type: resource
            resource: stability
            amount: 1
          - type: seat_stance
            group: court_bureaucrats
            stance: oppose
            cooldown_months: 18
  - design_id: B17
    pool: banking
    issue: banking
    weight: 1
    title:
      english: "Army Pay Delay"
      simp_chinese: "军饷拖延"
    desc:
      english: "Soldiers wait outside the pay office while treasurers argue over methods, reserves, and signatures. The debate suddenly has boots, hunger, and a very practical sense of time."
      simp_chinese: "士兵们等在发饷处外，司库们却仍在争论方法、准备金和签押。抽象辩论忽然有了靴声、饥饿，以及极其现实的时间感。"
    options:
      a:
        text:
          english: "Use banking reform to pay them."
          simp_chinese: "以银行改革解决军饷。"
        progress_delta: 10
        rationale:
          english: "Paying the army through clarified banking practice proves reform can solve a hard state problem instead of merely pleasing merchants. The military becomes a practical ally, though the treasury must absorb the transition."
          simp_chinese: "通过清晰的银行制度支付军饷，能证明改革不只是讨好商人，而能解决国家最硬的事务。军方会成为务实盟友，但国库必须承担过渡成本。"
        effect_blocks:
          - type: resource
            resource: gold
            scale: -1
          - type: seat_stance
            group: professional_military
            stance: support
            cooldown_months: 18
      b:
        text:
          english: "Borrow informally again."
          simp_chinese: "再次私下借款。"
        progress_delta: -5
        rationale:
          english: "Another informal loan gets coin into soldiers' hands without admitting the old financial channels are broken. The price is renewed dependence on private creditors who profit from keeping reform unfinished."
          simp_chinese: "再借一笔私下款项，可以不承认旧财政渠道已经失灵，就把钱发到士兵手中。代价是国家继续依赖从未完成的改革中获利的私人债主。"
        effect_blocks:
          - type: seat_stance
            group: burghers
            stance: oppose
            cooldown_months: 12
          - type: temporary_country_modifier
            key: tv_academy_debate_informal_army_credit
            months: 18
            effects:
              creditor leverage over army finance: 0.03
  - design_id: B18
    pool: banking
    issue: banking
    weight: 1
    title:
      english: "Contract in Plain Language"
      simp_chinese: "白话契约"
    desc:
      english: "Reformers bring a financial contract written so ordinary readers can understand what binds them. The lawyers look as if someone has opened a window in winter."
      simp_chinese: "改革者呈上一份金融契约，普通读者也能看懂自己受何约束。律师们的神情像是有人在寒冬里突然开了窗。"
    options:
      a:
        text:
          english: "Require plain contracts."
          simp_chinese: "要求契约使用明白文句。"
        progress_delta: 5
        rationale:
          english: "Plain contracts make banking reform visible to people who normally meet finance only as fine print. Public opinion warms because reform now protects comprehension, not just balance sheets."
          simp_chinese: "明白文句让通常只在细小字句里接触金融的人也能看见银行改革。公众舆论会转向支持，因为改革保护的不只是账面，也包括理解权。"
        effect_blocks:
          - type: seat_stance
            group: public_opinion
            stance: support
            cooldown_months: 12
          - type: temporary_country_modifier
            key: tv_academy_debate_plain_contract_forms
            months: 18
            effects:
              popular trust in banking courts: 0.02
      b:
        text:
          english: "Keep elite legal forms."
          simp_chinese: "保留精英法律格式。"
        progress_delta: -5
        rationale:
          english: "Keeping elite forms preserves professional control and reassures bankers that clever wording will not be overturned by sudden popular scrutiny. The debate loses public force because ordinary debtors remain dependent on interpreters."
          simp_chinese: "保留精英格式能维护专业阶层的控制，也让银行家相信精巧措辞不会突然遭到大众审视。但普通债务人仍要依赖解释者，辩论因此失去公共力量。"
        effect_blocks:
          - type: estate_satisfaction
            estate: burghers_estate
            value: 0.02
          - type: seat_stance
            group: court_bureaucrats
            stance: oppose
            cooldown_months: 12
  - design_id: B19
    pool: banking
    issue: banking
    weight: 1
    title:
      english: "Bankruptcy Shame"
      simp_chinese: "破产之耻"
    desc:
      english: "A ruined merchant argues that orderly bankruptcy saves workshops, creditors, and families better than public disgrace ever has. The moralists hear mercy; the bankers hear salvage."
      simp_chinese: "一名破产商人辩称，有秩序的破产比公开羞辱更能保住作坊、债权人和家庭。道德家听见的是宽恕，银行家听见的是残值。"
    options:
      a:
        text:
          english: "Legalize orderly bankruptcy."
          simp_chinese: "使有序破产合法化。"
        progress_delta: 10
        rationale:
          english: "Legal bankruptcy treats failure as a managed financial event rather than a moral collapse, which strengthens the banking argument for predictable rules. Conservative moral authorities object because disgrace loses some disciplinary power."
          simp_chinese: "合法破产把失败视为可管理的金融事件，而不是单纯的道德崩塌，从而强化银行制度需要可预期规则的主张。保守道德权威会反对，因为耻辱失去了一部分惩戒力量。"
        effect_blocks:
          - type: seat_stance
            group: burghers
            stance: support
            cooldown_months: 18
          - type: estate_satisfaction
            estate: clergy_estate
            value: -0.03
          - type: temporary_country_modifier
            key: tv_academy_debate_orderly_bankruptcy
            months: 24
            effects:
              commercial recovery confidence: 0.03
      b:
        text:
          english: "Keep disgrace as punishment."
          simp_chinese: "保留羞辱作为惩罚。"
        progress_delta: -10
        rationale:
          english: "Keeping disgrace as punishment satisfies those who see debt failure as moral failure, but it leaves trade exposed to panic, concealment, and ruin without procedure."
          simp_chinese: "保留羞辱作为惩罚，会安抚那些把债务失败视为道德失败的人；但贸易仍会暴露在恐慌、隐瞒和无程序崩坏之中。"
        effect_blocks:
          - type: estate_satisfaction
            estate: clergy_estate
            value: 0.03
          - type: estate_satisfaction
            estate: nobles_estate
            value: 0.02
          - type: seat_stance
            group: clergy
            stance: oppose
            cooldown_months: 18
  - design_id: B20
    pool: banking
    issue: banking
    weight: 1
    title:
      english: "Crown Account Published"
      simp_chinese: "公布王室账目"
    desc:
      english: "The Academy proposes a simplified royal account: enough figures to prove confidence, not enough to let every court faction sharpen a knife. The room immediately asks where that line is drawn."
      simp_chinese: "学院提议公布一份简化的王室账目：数字要足以证明财政自信，却又不能多到让宫廷派系人人磨刀。会场立刻追问，这条界线究竟画在哪里。"
    options:
      a:
        text:
          english: "Publish it."
          simp_chinese: "公布账目。"
        progress_delta: 10
        rationale:
          english: "Publishing the account makes the Crown model the financial discipline it asks others to accept. The gain for reform is large, but legitimacy is risked because every revealed weakness becomes a political argument."
          simp_chinese: "公布账目意味着王权以自身示范它要求他人接受的财政纪律。改革因此大获推动，但每一个暴露出的弱点都可能变成政治论据，正当性也随之冒险。"
        effect_blocks:
          - type: resource
            resource: legitimacy
            amount: -10
          - type: seat_stance
            group: public_opinion
            stance: support
            cooldown_months: 24
          - type: temporary_country_modifier
            key: tv_academy_debate_royal_account_published
            months: 24
            effects:
              expectation of transparent public finance: 0.03
      b:
        text:
          english: "Keep accounts closed."
          simp_chinese: "继续封存账目。"
        progress_delta: -10
        rationale:
          english: "Closed accounts protect court management and keep bureaucrats from defending every number in public. They also make banking reform look like a discipline imposed on subjects while the Crown exempts itself."
          simp_chinese: "继续封存账目可以保护宫廷运作，也让官僚不必公开为每一个数字辩护。但这会让银行改革显得像是只加诸臣民、王权自身却可豁免的纪律。"
        effect_blocks:
          - type: seat_stance
            group: court_bureaucrats
            stance: oppose
            cooldown_months: 24
          - type: temporary_country_modifier
            key: tv_academy_debate_closed_royal_accounts
            months: 24
            effects:
              administrative secrecy comfort: 0.02
excluded_events: []
