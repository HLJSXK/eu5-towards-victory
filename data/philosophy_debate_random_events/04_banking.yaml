random_events:
  - design_id: B01
    pool: banking
    issue: banking
    weight: 1
    title:
      english: "Double-Entry Before the Bench"
      simp_chinese: "复式记账呈于席前"
    desc:
      english: "A merchant accountant unrolls his ledger before the Academy and pairs each claim with its answering entry, credit against debit, until the columns close upon themselves. The arithmetic is dry and merciless, and for once more persuasive than any speech from the floor."
      simp_chinese: "一位商人会计在学院众人面前摊开账簿，让每一笔主张都对上它的反项，借方对贷方，直到两栏彼此闭合。这套算术枯燥而冷峻，却难得地比席间任何雄辩都更有说服力。"
    options:
      a:
        text:
          english: "The Academy takes double-entry as its standard of proof."
          simp_chinese: "学院将复式记账定为验证的标准。"
        progress_delta: 10
        rationale:
          english: "Adopting double-entry makes banking reform look like a teachable discipline rather than a merchant's sleight of hand, so supporters can point to a method that exposes fraud and steadies trust."
          simp_chinese: "采用复式记账，会让银行改革显得像一门可以传授的制度，而不是商人的手法花招；支持者因此能指向一种既能揭露欺诈、又能稳住信任的方法。"
        effect_blocks:
          - type: estate_satisfaction
            estate: burghers_estate
            value: 0.04
          - type: seat_stance
            group: burghers
            stance: support
            cooldown_months: 18
      b:
        text:
          english: "We keep the accounts our clerks already know by heart."
          simp_chinese: "我们保留文书们早已烂熟于心的旧式账目。"
        progress_delta: -5
        rationale:
          english: "Keeping the older accounts spares the clerks and offices that know the old forms, but it lets ambiguity stay respectable and slows the room's acceptance of banking discipline."
          simp_chinese: "保留旧式账目能让熟悉旧格式的文书和官署省心，却也让含混继续披着体面的外衣，拖慢会场对银行制度纪律的接受。"
        effect_blocks:
          - type: seat_stance
            group: court_bureaucrats
            stance: oppose
            cooldown_months: 12
          - type: temporary_country_modifier
            key: tv_academy_debate_familiar_accounts
            months: 18
            effects:
              old-account routine preserved: 0.02
  - design_id: B02
    pool: banking
    issue: banking
    weight: 1
    title:
      english: "A Roll of Noble Debts"
      simp_chinese: "一卷贵族债册"
    desc:
      english: "Bankers arrive with a roll of noble debts, twice sealed and once already whispered over in the corridors. It shows that several proud houses stand upright only on the credit they denounce in public."
      simp_chinese: "银行家带来一卷贵族债册，蜡封了两层，走廊里却早已被人低声传过一遍。它表明好几座骄傲的世家，全靠他们在公开场合痛斥的信用撑着门面。"
    options:
      a:
        text:
          english: "The bankers' roll is read into the record, seal by seal."
          simp_chinese: "银行家的债册被逐一验封，记入案卷。"
        progress_delta: 10
        rationale:
          english: "Reading the roll aloud shows that old landed power already leans on credit, making banking reform hard to wave away, though it angers the nobles whose dependence is now on open display."
          simp_chinese: "当众宣读债册，会揭穿旧有的土地权力早已倚仗信用，使银行改革难以被轻易挥退；只是那些债务依赖被摆上明面的贵族，难免动怒。"
        effect_blocks:
          - type: estate_satisfaction
            estate: nobles_estate
            value: -0.05
          - type: seat_stance
            group: public_opinion
            stance: support
            cooldown_months: 12
      b:
        text:
          english: "Enough. The roll never leaves this chamber."
          simp_chinese: "够了。这卷债册不许出这间议厅。"
        progress_delta: -10
        rationale:
          english: "Suppressing the roll guards noble dignity and keeps the quiet marriage of credit and privilege out of sight, but it tells the debate that banking law must retreat whenever rank is embarrassed."
          simp_chinese: "压下债册能维护贵族体面，让信用与特权之间的沉默联姻继续藏在暗处；但这也等于告诉辩论，一旦等级尊严受损，银行法就得退让。"
        effect_blocks:
          - type: estate_satisfaction
            estate: nobles_estate
            value: 0.04
          - type: seat_stance
            group: nobility
            stance: oppose
            cooldown_months: 18
  - design_id: B03
    pool: banking
    issue: banking
    weight: 1
    title:
      english: "A Sermon Against Usury"
      simp_chinese: "反高利贷布道"
    desc:
      english: "At dawn a preacher turns interest into a sin plain enough for every debtor to feel in his own purse. By noon the Academy is quarreling over whether regulation purifies credit or merely hands vice a tidy receipt."
      simp_chinese: "黎明时分，一位布道者把利息说成一桩人人都能在自家钱袋里感到的罪。到正午，学院已在争吵：监管究竟是净化了信用，还是只给恶习开了一张工整的收据。"
    options:
      a:
        text:
          english: "We grant interest its due, then bind it with law."
          simp_chinese: "我们承认利息自有其分，再用法律把它约束住。"
        progress_delta: 5
        rationale:
          english: "Defending regulated interest concedes the moral unease yet argues that law can discipline credit, nudging the debate toward reform while offending clergy who wanted a plainer condemnation."
          simp_chinese: "为受监管的利息辩护，等于承认那份道德不安，却主张法律能约束信用；这会把辩论推向改革，也会冒犯那些盼着更直白谴责的神职阶层。"
        effect_blocks:
          - type: estate_satisfaction
            estate: clergy_estate
            value: -0.04
          - type: seat_stance
            group: burghers
            stance: support
            cooldown_months: 12
      b:
        text:
          english: "The Academy lets the preacher's condemnation stand as its verdict."
          simp_chinese: "学院让布道者的谴责作为定论留下。"
        progress_delta: -10
        rationale:
          english: "Condemnation gives the sermon the last word, pleasing religious authorities but casting the banking system as a moral peril rather than an institution that can be governed."
          simp_chinese: "谴责让布道成了最后的结论，取悦了宗教权威，却把银行体系塑造成道德危险，而非一种可被治理的制度。"
        effect_blocks:
          - type: estate_satisfaction
            estate: clergy_estate
            value: 0.05
          - type: seat_stance
            group: clergy
            stance: oppose
            cooldown_months: 18
  - design_id: B04
    pool: banking
    issue: banking
    weight: 1
    title:
      english: "A Public Bank on Paper"
      simp_chinese: "纸面上的公共银行"
    desc:
      english: "City burghers draft a public bank propped on the Crown's promise. On paper it offers stability, and then, politely, invites the whole room to ask what that promise itself is worth."
      simp_chinese: "城市市民起草了一份倚仗王室承诺的公共银行方案。纸面上它许诺稳定，随后又客客气气地请满座众人一同追问：这份承诺本身，究竟值几个钱。"
    options:
      a:
        text:
          english: "The Crown sets its seal to the new public bank."
          simp_chinese: "王室为这家新的公共银行盖上印玺。"
        progress_delta: 10
        rationale:
          english: "Chartering the bank turns the debate from theory into public credit, handing reformers a flagship institution while placing the Crown's credibility visibly on the table."
          simp_chinese: "特许成立银行，会把辩论从理论推向公共信用，为改革者送上一座旗舰式的制度，同时也把王室的信誉明明白白摆上台面。"
        effect_blocks:
          - type: resource
            resource: legitimacy
            amount: -5
          - type: seat_stance
            group: burghers
            stance: support
            cooldown_months: 18
      b:
        text:
          english: "We let the charter wait for a promise worth its wax."
          simp_chinese: "我们让这份特许状再等一等，等来一个配得上这滴火漆的承诺。"
        progress_delta: -5
        rationale:
          english: "Delaying the charter reassures conservative officials that the Crown will not guarantee a fragile experiment in haste, but the hesitation makes banking reform look premature."
          simp_chinese: "推迟特许状能让保守官员放心，相信王室不会仓促担保一项脆弱的试验；但这份犹豫，也会让银行改革显得尚未成熟。"
        effect_blocks:
          - type: estate_satisfaction
            estate: nobles_estate
            value: 0.02
          - type: seat_stance
            group: court_bureaucrats
            stance: oppose
            cooldown_months: 12
  - design_id: B05
    pool: banking
    issue: banking
    weight: 1
    title:
      english: "Debased Coin Panic"
      simp_chinese: "劣币恐慌"
    desc:
      english: "Rumor swears that the coin in every purse is thinner than the Crown's word, and the markets begin to weigh trust as carefully as they weigh silver."
      simp_chinese: "流言赌咒发誓，说每只钱袋里的硬币都比王室的诺言更薄；于是市场开始像称量白银一样，仔细称量起信任来。"
    options:
      a:
        text:
          english: "The mints are opened and the coinage struck true again."
          simp_chinese: "各处铸币所重开，硬币被重新铸得足重。"
        progress_delta: 10
        rationale:
          english: "Reforming the coinage pays a real fiscal price to prove that monetary trust can be governed, giving the banking argument a visible footing in reliable money."
          simp_chinese: "改革铸币要付出实打实的财政代价，以证明货币信任可以被治理；这会让银行制度的论证，立在可靠货币这一看得见的根基上。"
        effect_blocks:
          - type: resource
            resource: gold
            scale: -1
          - type: seat_stance
            group: burghers
            stance: support
            cooldown_months: 12
      b:
        text:
          english: "Silence, before the whispers empty every purse."
          simp_chinese: "都住口，免得这些流言把每只钱袋都掏空。"
        progress_delta: -5
        rationale:
          english: "Blaming the rumor-mongers keeps the peace for now and spares the treasury a reform, but it treats monetary distrust as disobedience rather than a banking problem to be solved."
          simp_chinese: "指责散布流言者能保住眼前的太平，也替国库省下一场改革；但这把货币不信任当成了不服从，而不是一桩需要解决的银行制度难题。"
        effect_blocks:
          - type: resource
            resource: stability
            amount: 1
          - type: seat_stance
            group: public_opinion
            stance: oppose
            cooldown_months: 12
  - design_id: B06
    pool: banking
    issue: banking
    weight: 1
    title:
      english: "The Widow's Deposit"
      simp_chinese: "寡妇的存款"
    desc:
      english: "A widow comes before the Academy with a receipt, a vanished dowry, and a voice too steady to be waved aside. What had been an argument over banking rules now has a face, and it is watching the bench."
      simp_chinese: "一名寡妇带着一张收据、一份不翼而飞的嫁资，以及一副平静得无法被打发的嗓音，来到学院面前。原本一场关于银行规则的争论，如今有了一张面孔——而它正望着席位。"
    options:
      a:
        text:
          english: "We set a rule around every coin a depositor entrusts to us."
          simp_chinese: "我们为存户托付的每一枚硬币，都立下一条规矩。"
        progress_delta: 5
        rationale:
          english: "Regulating deposits turns the banking debate toward public trust and the ordinary saver, making reform easier to defend even as commercial bankers must accept closer oversight."
          simp_chinese: "监管存款会把银行制度之争转向公共信任与普通存户，使改革更容易被辩护，纵然商业银行家必须接受更严的监督。"
        effect_blocks:
          - type: seat_stance
            group: public_opinion
            stance: support
            cooldown_months: 12
          - type: estate_satisfaction
            estate: burghers_estate
            value: -0.02
      b:
        text:
          english: "The hall records the loss as a private misfortune and moves on."
          simp_chinese: "议厅将这笔损失记作私人不幸，随后继续议程。"
        progress_delta: -5
        rationale:
          english: "Calling the loss a private misfortune shields the bankers from new limits, but it tells the undecided that the proposed system guards institutions before it guards people."
          simp_chinese: "把损失称作私人不幸，能让银行家躲开新的约束；但这也告诉摇摆者，拟议中的制度是先护机构、后护人。"
        effect_blocks:
          - type: seat_stance
            group: public_opinion
            stance: oppose
            cooldown_months: 12
          - type: estate_satisfaction
            estate: burghers_estate
            value: 0.02
  - design_id: B07
    pool: banking
    issue: banking
    weight: 1
    title:
      english: "Royal Loan Refused"
      simp_chinese: "王室贷款遭拒"
    desc:
      english: "An emergency loan is asked in the Crown's name; the bankers answer first with silence, then with conditions. The hall learns that unclear banking law can leave even royal need standing at the counter."
      simp_chinese: "王室以紧急之名请求一笔贷款；银行家先报以沉默，再报以条件。大厅由此明白，含混的银行法，竟能让王室的急需也在柜台前干等。"
    options:
      a:
        text:
          english: "The clerks draft the credit law plain enough to bind Crown and lender alike."
          simp_chinese: "书吏们把信用法草拟得明白无误，王室与放贷者一体受约束。"
        progress_delta: 10
        rationale:
          english: "Clarifying the law concedes that credit needs predictable rules rather than pure royal command, strongly advancing banking reform while costing the Crown some of its air of unquestioned authority."
          simp_chinese: "澄清法律，等于承认信用需要可预期的规则，而不能只靠王命推动；这会大力推进银行改革，也会削去王权那层不容置疑的光环。"
        effect_blocks:
          - type: resource
            resource: legitimacy
            amount: -5
          - type: seat_stance
            group: court_bureaucrats
            stance: support
            cooldown_months: 18
      b:
        text:
          english: "Mind whose need you keep waiting at the counter."
          simp_chinese: "掂量掂量，你们让谁的急需在柜台前干等。"
        progress_delta: -10
        rationale:
          english: "Threatening the bankers keeps up the image that royal authority cannot be haggled with, but it turns the debate away from durable credit law and toward plain coercion."
          simp_chinese: "威胁银行家能维持王权不容讨价还价的形象，却会把辩论从持久的信用法律，扭向赤裸裸的强制。"
        effect_blocks:
          - type: resource
            resource: legitimacy
            amount: 5
          - type: estate_satisfaction
            estate: burghers_estate
            value: -0.04
  - design_id: B08
    pool: banking
    issue: banking
    weight: 1
    title:
      english: "Bills of Exchange"
      simp_chinese: "汇票"
    desc:
      english: "Merchants lay out letters, seals, and signatures showing how wealth can cross a border while the guarded carts are still arguing over which road to take. The paper looks fragile, right up until everyone notices how much coin it commands."
      simp_chinese: "商人摊开书信、印章与签名，显示财富如何在护送的钱车还在争论走哪条路时，就已越过了边境。那纸张看着脆弱，直到众人发觉，它能调动多少硬币。"
    options:
      a:
        text:
          english: "The Academy endorses the bill of exchange as lawful tender of trust."
          simp_chinese: "学院认可汇票，作为一纸合法的信用凭证。"
        progress_delta: 5
        rationale:
          english: "Endorsing bills of exchange makes banking reform useful to trade rather than merely tidy in the ledger, giving maritime merchants a practical reason to back the new system."
          simp_chinese: "认可汇票，会让银行改革不只是账本上的整洁，而是真正对贸易有用，使海商有了切身的理由去支持新制度。"
        effect_blocks:
          - type: seat_stance
            group: maritime_merchants
            stance: support
            cooldown_months: 18
          - type: temporary_country_modifier
            key: tv_academy_debate_bills_of_exchange
            months: 24
            effects:
              commercial transfer confidence: 0.02
      b:
        text:
          english: "Coin in the hand outweighs ink on the page."
          simp_chinese: "手中硬币，重过纸上墨迹。"
        progress_delta: -5
        rationale:
          english: "Restricting paper instruments reassures the estates that trust visible coin and familiar routes, but it leaves the debate suspicious of financial abstraction."
          simp_chinese: "限制纸面工具，会安抚那些信赖实体硬币与熟悉路线的等级势力，却也让这场辩论继续怀疑金融的抽象化本身。"
        effect_blocks:
          - type: seat_stance
            group: nobility
            stance: oppose
            cooldown_months: 12
          - type: estate_satisfaction
            estate: nobles_estate
            value: 0.02
  - design_id: B09
    pool: banking
    issue: banking
    weight: 1
    title:
      english: "The Ledger That Lies"
      simp_chinese: "会说谎的账簿"
    desc:
      english: "The ledger is elegant, balanced, and false. Its columns keep the calm beauty of good order, which somehow makes the theft hidden inside them feel like an insult aimed at arithmetic itself."
      simp_chinese: "这本账簿优雅、平衡，且是假的。它的栏目保有良好秩序的那份冷静美感，也不知怎地，让藏在其中的盗窃，显得像是冲着算术本身来的一记侮辱。"
    options:
      a:
        text:
          english: "The forged book is exhibited as the case for enforceable standards."
          simp_chinese: "这本伪造的账簿被公开展示，作为设立强制标准的理由。"
        progress_delta: 10
        rationale:
          english: "Using the fraudulent ledger as evidence turns scandal into a demand for enforceable standards, but exposing so beautiful a crime costs prestige, since the Academy admits how easily good order can be forged."
          simp_chinese: "把欺诈账簿当作证据，会把丑闻转化为对强制标准的要求；但揭开这样一场漂亮的犯罪也要损耗声望，因为学院等于承认，良好秩序竟如此容易被伪造。"
        effect_blocks:
          - type: resource
            resource: prestige
            amount: -10
          - type: seat_stance
            group: court_bureaucrats
            stance: support
            cooldown_months: 18
      b:
        text:
          english: "We hang the clerk and let his betters keep their patrons."
          simp_chinese: "我们绞死那名书记员，至于他背后的贵人，一个不动。"
        progress_delta: -10
        rationale:
          english: "Punishing only the clerk contains the scandal and keeps elite patrons clear of scrutiny, but it teaches the debate that banking rules will bite only where power is weakest."
          simp_chinese: "只惩罚书记员能压住丑闻，也让上层赞助人免于追查；但这会让辩论明白，银行规则只会在权力最弱的地方咬人。"
        effect_blocks:
          - type: estate_satisfaction
            estate: nobles_estate
            value: 0.03
          - type: estate_satisfaction
            estate: burghers_estate
            value: 0.02
  - design_id: B10
    pool: banking
    issue: banking
    weight: 1
    title:
      english: "The Cloister's Credit Chest"
      simp_chinese: "修道院的信用箱"
    desc:
      english: "Monasteries and church offices open their records just far enough to reveal a web of loans, pledges, and quiet exemptions. The debate discovers, with some awkwardness, that sacred hands can also reckon interest."
      simp_chinese: "修道院与教会机构把记录打开到刚好露出一张由贷款、抵押与沉默豁免织成的网。辩论就此发现——还带着几分尴尬——神圣之手同样会算利息。"
    options:
      a:
        text:
          english: "The Academy brings clerical lending under the same law as any other."
          simp_chinese: "学院将教会放贷纳入与旁人一体适用的法律。"
        progress_delta: 5
        rationale:
          english: "Bringing clerical credit under the law extends banking reform past merchants and royal offices, proving that no lender can plead sanctity as a permanent exemption."
          simp_chinese: "将教会信用纳入法律，会把银行改革推到商人与王室机构之外，证明没有哪个放贷者能永远以神圣之名求得豁免。"
        effect_blocks:
          - type: estate_satisfaction
            estate: clergy_estate
            value: -0.04
          - type: seat_stance
            group: religious_reformers
            stance: support
            cooldown_months: 18
      b:
        text:
          english: "Peace with the cloister, for now."
          simp_chinese: "与修道院，暂且相安无事吧。"
        progress_delta: -5
        rationale:
          english: "Exempting religious credit keeps the clergy content and heads off a doctrinal quarrel, but it leaves a vast lending network outside the very standards the debate claims to need."
          simp_chinese: "豁免宗教信用能让神职阶层满意，也避开一场教义争执；但这也让一张庞大的借贷网络，留在了辩论声称自己需要的标准之外。"
        effect_blocks:
          - type: estate_satisfaction
            estate: clergy_estate
            value: 0.04
          - type: seat_stance
            group: religious_reformers
            stance: oppose
            cooldown_months: 18
  - design_id: B11
    pool: banking
    issue: banking
    weight: 1
    title:
      english: "City Bank Riot"
      simp_chinese: "城市银行骚乱"
    desc:
      english: "Debtors and creditors clash outside a city bank, each side brandishing contracts like wounds and calling the other robbery with neater handwriting. The Academy can no longer pretend that banking reform is only a quarrel among ledgers."
      simp_chinese: "债务人与债权人在一家城市银行门前扭打，双方都把契约挥舞得像伤口，并骂对方不过是字迹更工整的抢劫。学院再也没法假装，银行改革只是账簿之间的一场口角。"
    options:
      a:
        text:
          english: "The Crown steps between the two crowds with a set of new rules."
          simp_chinese: "王权带着一套新规则，插身于两拨人群之间。"
        progress_delta: 5
        rationale:
          english: "Mediation accepts that credit disputes need public rules rather than private force; it costs stability, because the Crown must wade into a street crisis before those rules have earned any trust."
          simp_chinese: "调停意味着承认信用纠纷需要公共规则，而非私人暴力；它会消耗稳定，因为王权必须在这些规则尚未取得信任之前，就蹚进街头危机。"
        effect_blocks:
          - type: resource
            resource: stability
            amount: -1
          - type: seat_stance
            group: public_opinion
            stance: support
            cooldown_months: 12
      b:
        text:
          english: "Bar the doors, before debt turns into blood."
          simp_chinese: "把门闩上，免得债务变成血案。"
        progress_delta: -10
        rationale:
          english: "Closing the bank restores a visible order, but it teaches the room that banking institutions are too dangerous to reform in the open, and pushes the debate toward rejection."
          simp_chinese: "关闭银行能恢复看得见的秩序，却也让会场相信，银行机构太过危险，不宜公开改革，从而把辩论推向否定。"
        effect_blocks:
