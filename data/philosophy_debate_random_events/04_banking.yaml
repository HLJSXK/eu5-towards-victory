          english: "Teaching compound interest makes credit legible as knowledge rather than mystery, so scholars can defend regulated finance with sharper tools; the gain is modest, since the same clarity alarms debtors."
          simp_chinese: "讲授复利，把信用从神秘技艺变成可理解的知识，使学者能用更锋利的工具为受监管的金融辩护；推进有限，因为同样的清晰也会让债务人不安。"
