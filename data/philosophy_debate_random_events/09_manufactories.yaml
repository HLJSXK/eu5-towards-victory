random_events:
  - design_id: MF01
    pool: manufactories
    issue: manufactories
    weight: 1
    title:
      english: "Workshop Under One Roof"
      simp_chinese: "同檐工坊"
    desc:
      english: "A merchant lays out the case for gathering spinners, finishers, clerks, and overseers beneath a single roof. The bell above the yard sounds less like a tool than a new argument about how work should be ordered, and who holds the ordering."
      simp_chinese: "一名商人陈述把纺工、整饰工、账房和监工聚到同一屋檐下的理由。院门上方的钟声听起来不像工具，倒像一场新的论证：劳动该如何排布，又该由谁来排。"
    options:
      a:
        text:
          english: "The clerks and looms are brought under one roof."
          simp_chinese: "账房与织机被并到一个屋檐之下。"
        progress_delta: 5
        rationale:
          english: "Bringing labor under one roof turns manufactory theory into a visible institution where work can be sequenced, watched, and compared, which strongly advances acceptance; but the old guild households resent surrendering their command of pace and custom."
          simp_chinese: "把劳动集中到一个屋檐下，会把制造工场理论变成看得见的制度：工序可以排序、监督、比较。这有力推动接纳，只是旧行会家庭怨恨节奏与惯例不再由自己说了算。"
        effect_blocks:
          - type: estate_satisfaction
            estate: burghers_estate
            value: -0.1
          - type: seat_stance
            group: court_bureaucrats
            stance: support
            cooldown_months: 18
      b:
        text:
          english: "We leave each craftsman his own doorway."
          simp_chinese: "我们让每个匠人各守各的门户。"
        progress_delta: -5
        rationale:
          english: "Leaving work dispersed shelters guild habit and household production from the discipline of a centralized bell, and the debate moves sharply toward rejection, since a manufactory is easy to paint as a needless assault on proven custom."
          simp_chinese: "让生产各自分散，能护住行会习惯和家庭工坊，不受集中钟声的纪律约束；辩论因此明显转向拒绝，毕竟制造工场很容易被说成对可靠旧俗的多余侵犯。"
        effect_blocks:
          - type: estate_satisfaction
            estate: burghers_estate
            value: 0.1
          - type: seat_stance
            group: local_autonomy
            stance: oppose
            cooldown_months: 18
  - design_id: MF02
    pool: manufactories
    issue: manufactories
    weight: 1
    title:
      english: "Guild Master's Complaint"
      simp_chinese: "行会师傅的控诉"
    desc:
      english: "Guild masters arrive bearing warped cloth, brittle tools, and finishing so hurried it reads like an accusation. Scale, they warn, multiplies errors as briskly as it multiplies goods."
      simp_chinese: "行会师傅带来变形的布匹、易脆的器具，还有仓促到近乎控诉的收尾活。他们警告：规模既能成倍出货，也能同样麻利地成倍出错。"
    options:
      a:
        text:
          english: "Inspectors are posted at the manufactory gates."
          simp_chinese: "检查员被派驻到制造工场门口。"
        progress_delta: 2.5
        rationale:
          english: "Quality rules answer the guilds' sharpest charge without surrendering the manufactory, so acceptance advances modestly as the model gains credibility; the Crown pays for inspectors, measures, and enforcement."
          simp_chinese: "质量规则回应了行会最尖锐的指控，却没有放弃制造工场，模式更可信，接纳因此适度推进；代价是王权得为检查员、量具与执行付账。"
        effect_blocks:
          - type: resource
            resource: gold
            scale: -1
          - type: seat_stance
            group: court_bureaucrats
            stance: support
            cooldown_months: 12
      b:
        text:
          english: "Only the maker knows the true weave."
          simp_chinese: "布好不好，织的人最清楚。"
        progress_delta: -2.5
        rationale:
          english: "Preserving guild inspection lets the older masters judge scale by their own standards, which reassures urban craft interests but slows acceptance by making manufactories answer to the very institutions they threaten."
          simp_chinese: "保留行会检验，等于让旧师傅继续用自家标准裁断规模生产，能安抚城市手工业，却让制造工场服从它所威胁的旧制度，从而减缓接纳。"
        effect_blocks:
          - type: estate_satisfaction
            estate: burghers_estate
            value: 0.05
          - type: seat_stance
            group: burghers
            stance: oppose
            cooldown_months: 12
  - design_id: MF03
    pool: manufactories
    issue: manufactories
    weight: 1
    title:
      english: "Waterwheel Proposal"
      simp_chinese: "水轮提案"
    desc:
      english: "Engineers sketch a water-driven process that would pull, pound, and turn with an appetite no pair of hands can satisfy. The river stops looking like scenery and begins to look like a laborer waiting to be hired."
      simp_chinese: "工程师勾出一套由水力驱动的工序，能拉、能捣、能转，其胃口远非人手所能填。那条河不再像风景，倒像个等着受雇的工人。"
    options:
      a:
        text:
          english: "We set the river to work at the wheels."
          simp_chinese: "我们让这条河到水轮上做工。"
        progress_delta: 5
        rationale:
          english: "Building the works proves manufactories can command natural force, not merely herd workers together, so the argument surges forward; nearby communities bear the disruption of new channels, water rights, and altered routines."
          simp_chinese: "兴建水力工场证明制造工场不只是把工人赶到一处，还能驱使自然之力，论点因此大幅推进；附近社区则要承受新水渠、水权与日常节奏被打乱的扰动。"
        effect_blocks:
          - type: estate_satisfaction
            estate: peasants_estate
            value: -0.1
          - type: temporary_country_modifier
            key: tv_academy_debate_waterwheel_disruption
            months: 18
            effects:
              "local construction disruption near water sites": -0.03
      b:
        text:
          english: "The engineers are sent home with their drawings rolled up."
          simp_chinese: "工程师被打发回家，图纸卷了起来。"
        progress_delta: -5
        rationale:
          english: "Refusing mechanized pressure keeps rural rhythms from being bent around wheels, races, and mill rights, and it strongly weakens acceptance because the debate turns away from its most tangible proof that production can be transformed."
          simp_chinese: "拒绝机械化压力，让乡村节奏不必围着水轮、引水渠和磨坊权利重排；这会强烈削弱接纳，因为辩论退开了生产可被改造的最直观证据。"
        effect_blocks:
          - type: estate_satisfaction
            estate: peasants_estate
            value: 0.1
          - type: seat_stance
            group: peasants
            stance: oppose
            cooldown_months: 18
  - design_id: MF04
    pool: manufactories
    issue: manufactories
    weight: 1
    title:
      english: "Women at the Looms"
      simp_chinese: "织机旁的女性"
    desc:
      english: "A manufactory hires women in numbers too large to be waved off as household help. What began as a matter of wages becomes an argument about custom, discipline, and who may stand plainly inside the new economy."
      simp_chinese: "一家制造工场雇了许多女性，数目大到再不能被轻描淡写地当作家内帮工。最初只是工资问题，如今变成关于习俗、纪律，以及谁能光明正大地站进新经济的争论。"
    options:
      a:
        text:
          english: "Enough hand-wringing; they have earned their pay."
          simp_chinese: "何必大惊小怪，给她们发工钱便是。"
        progress_delta: 5
        rationale:
          english: "Defending wage work treats the manufactory as a social transformation rather than a mere production trick, so acceptance advances sharply as the Academy endorses new labor arrangements; conservative moral and household authorities object."
          simp_chinese: "捍卫有薪劳动，是把制造工场当成社会转型，而非单纯的生产花招，学院一认可新的劳动安排，接纳便显著上升；保守的道德与家户权威则表示反对。"
        effect_blocks:
          - type: estate_satisfaction
            estate: clergy_estate
            value: -0.05
          - type: seat_stance
            group: public_opinion
            stance: support
            cooldown_months: 18
      b:
        text:
          english: "The registers are closed to the new hands."
          simp_chinese: "用工名册对这些新雇工关上了。"
        progress_delta: -5
        rationale:
          english: "Restricting hiring custom forces manufactories to prove they will not disturb accepted household and moral order, which reassures clergy and guild conservatives but turns the debate decisively away from the new model."
          simp_chinese: "限制雇佣惯例，等于逼制造工场证明自己不会扰乱既有的家户与道德秩序，能安抚教士与行会保守派，却让辩论明确背离新模式。"
        effect_blocks:
          - type: estate_satisfaction
            estate: clergy_estate
            value: 0.05
          - type: seat_stance
            group: clergy
            stance: oppose
            cooldown_months: 18
  - design_id: MF05
    pool: manufactories
    issue: manufactories
    weight: 1
    title:
      english: "Raw Material Bottleneck"
      simp_chinese: "原料瓶颈"
    desc:
      english: "Production stalls because wool, timber, dye, and ore still arrive by village habit rather than manufactory appetite. The benches wait idle while the countryside insists that supply has its seasons, its neighbors, and its old obligations."
      simp_chinese: "生产停了下来，因为羊毛、木材、染料和矿石仍按村庄习惯送来，而不是按制造工场的胃口。工作台闲着等，乡间却坚持：供应自有季节、邻里，还有旧日的义务。"
    options:
      a:
        text:
          english: "The clerks draw up standing contracts for every input."
          simp_chinese: "账房为每一样原料拟定长期契约。"
        progress_delta: 2.5
        rationale:
          english: "Supply contracts make manufactories practical by tying rural inputs to predictable urban production; the gain is moderate because it clears a bottleneck rather than proving the whole system, and merchants welcome the clearer obligations."
          simp_chinese: "供应契约把乡村投入系到可预测的城市生产上，让制造工场更可行；推进适中，因为它清的是瓶颈，而非证明整套制度，商人也乐见更清楚的义务。"
        effect_blocks:
          - type: estate_satisfaction
            estate: burghers_estate
            value: 0.05
          - type: seat_stance
            group: court_bureaucrats
            stance: support
            cooldown_months: 12
      b:
        text:
          english: "We let the harvest set the pace, as it always has."
          simp_chinese: "我们照旧让收成来定节奏。"
        progress_delta: -2.5
        rationale:
          english: "Limiting production to supply custom keeps rural obligation, seasonal movement, and local bargaining intact; acceptance falls because manufactories are made to match the old rhythm instead of reorganizing the material chain around scale."
          simp_chinese: "让产量服从供应旧俗，能保住乡村义务、季节流动与地方议价；接纳随之下降，因为制造工场被迫迁就旧节奏，而非围绕规模重组原料链。"
        effect_blocks:
          - type: estate_satisfaction
            estate: peasants_estate
            value: 0.05
          - type: seat_stance
            group: local_autonomy
            stance: oppose
            cooldown_months: 12
  - design_id: MF06
    pool: manufactories
    issue: manufactories
    weight: 1
    title:
      english: "Fire in the Yard"
      simp_chinese: "院中失火"
    desc:
      english: "A workshop fire leaves scorched beams, ruined stock, and a crowd of witnesses already deciding what the flames have proven. Some read danger in concentration itself; others read it in concentration left unwatched."
      simp_chinese: "一场作坊大火留下焦黑的梁木、毁掉的存货，还有一群早已在给火焰下定论的目击者。有人从集中生产本身读出危险，也有人从无人看管的集中生产里读出危险。"
    options:
      a:
        text:
          english: "The Crown writes firebreaks and inspections into the model."
          simp_chinese: "王权把防火隔离与检查写进了工场章程。"
        progress_delta: 2.5
        rationale:
          english: "Regulation admits that large workshops carry new risks yet treats them as a reason to govern manufactories rather than abandon them; the gold pays for inspections, firebreaks, and safer storage."
          simp_chinese: "监管承认大型作坊带来新风险，却把风险当作治理制造工场的理由，而非放弃它们的理由；金币用于检查、防火隔离与更安全的储料。"
        effect_blocks:
          - type: resource
            resource: gold
            scale: -1
          - type: seat_stance
            group: public_opinion
            stance: support
            cooldown_months: 12
          - type: temporary_country_modifier
            key: tv_academy_debate_manufactory_fire_codes
            months: 18
            effects:
              "inspected workshop safety codes": 0.02
      b:
        text:
          english: "Gather the sparks in one shed and you build a pyre."
          simp_chinese: "火星聚一处，便是柴堆。"
        progress_delta: -5
        rationale:
          english: "Condemning large workshops lets guild critics turn the fire into a verdict against concentration itself, which strongly pushes rejection as a safety failure becomes proof that scale cannot be trusted."
          simp_chinese: "谴责大型作坊，会让行会批评者把这场火烧成对集中生产本身的判决，强烈推动否定，因为一次安全事故被说成规模化不可信的铁证。"
        effect_blocks:
          - type: seat_stance
            group: burghers
            stance: oppose
            cooldown_months: 24
          - type: estate_satisfaction
            estate: burghers_estate
            value: 0.1
  - design_id: MF07
    pool: manufactories
    issue: manufactories
    weight: 1
    title:
      english: "Clock Discipline"
      simp_chinese: "钟表纪律"
    desc:
      english: "Managers hang bells and clocks where masters once trusted to habit. The workers soon learn that time can be made a supervisor, one with no patience and no need to sleep."
      simp_chinese: "管事把钟和铃挂在从前只靠习惯运转的地方。工人很快学到：时间也能被立成一名监工，一个既没耐心、也不用睡觉的监工。"
    options:
      a:
        text:
          english: "The bells are hung, and the day is cut to their measure."
          simp_chinese: "钟铃挂了起来，一天照着它们的刻度被切开。"
        progress_delta: 5
        rationale:
          english: "Accepting clock discipline makes the manufactory a new social order of measured labor rather than a larger room of tools, so progress climbs sharply; the gain is balanced by peasant and worker resentment at being ruled by the bell."
          simp_chinese: "接受钟表纪律，会让制造工场成为以计时劳动为核心的新秩序，而不只是更大的工具房，进度因此陡升；代价是农民与工人不满被铃声支配。"
        effect_blocks:
          - type: estate_satisfaction
            estate: peasants_estate
            value: -0.1
          - type: seat_stance
            group: court_bureaucrats
            stance: support
            cooldown_months: 18
          - type: temporary_country_modifier
            key: tv_academy_debate_clock_discipline
            months: 18
            effects:
              "measured workshop schedules": 0.03
      b:
        text:
          english: "Peace, before the hours become jailers."
          simp_chinese: "消停些吧，别让时辰都成了狱卒。"
        progress_delta: -2.5
        rationale:
          english: "Limiting work rules reassures laboring households that manufactories will not turn every hour into a command; it only mildly weakens acceptance, since the model can continue, only without its most disciplined schedule."
          simp_chinese: "限制作坊规章，安抚劳动家庭，让他们相信制造工场不会把每个时辰都变成命令；这只轻微削弱接纳，因为模式仍能运转，只是少了最严密的时间表。"
        effect_blocks:
          - type: estate_satisfaction
            estate: peasants_estate
            value: 0.05
          - type: seat_stance
            group: peasants
            stance: oppose
            cooldown_months: 12
  - design_id: MF08
    pool: manufactories
    issue: manufactories
    weight: 1
    title:
      english: "Military Contract"
      simp_chinese: "军需合同"
    desc:
      english: "The army offers a contract large enough to make every workshop owner count his benches twice. The condition is plain: the Crown wants parts and cloth that match, not the charming variations of each town."
      simp_chinese: "军队开出一份大到让每个作坊主把工台数上两遍的合同。条件很直白：王权要的是彼此一致的零件与布匹，而不是各镇各有风味的差异。"
    options:
      a:
        text:
          english: "Every workshop is bound to a single specification."
          simp_chinese: "每一家作坊都被绑定到同一份规格上。"
        progress_delta: 5
        rationale:
          english: "Standard production ties manufactories to state capacity, since weapons, uniforms, and supplies grow reliable once workshops can repeat one specification; the professional military supports the reform because predictability wins in the field."
          simp_chinese: "标准化生产把制造工场同国家能力绑在一起：作坊能反复照一份规格来做，武器、制服和补给便可靠；职业军队支持这项改革，因为战场上可预期性能取胜。"
        effect_blocks:
          - type: seat_stance
            group: professional_military
            stance: support
            cooldown_months: 24
          - type: temporary_country_modifier
            key: tv_academy_debate_standard_military_contracts
            months: 24
            effects:
              "standardized military supply": 0.03
      b:
        text:
          english: "We would rather keep each supplier's own hand."
          simp_chinese: "我们宁可留着每家供应商各自的手法。"
        progress_delta: -2.5
        rationale:
          english: "Keeping bespoke supply shelters older contractors and local methods but makes the case for manufactories less urgent, leaving production a network of favors and adaptations instead of a system of repeatable standards."
          simp_chinese: "保留定制供应，护住了旧承包商和地方做法，却让制造工场显得不那么必要，生产仍是一张人情与临场调整的网，而非可重复规格的体系。"
        effect_blocks:
          - type: seat_stance
            group: burghers
            stance: oppose
            cooldown_months: 18
          - type: temporary_country_modifier
            key: tv_academy_debate_bespoke_supply_networks
            months: 12
            effects:
              "familiar supplier networks protected": 0.02
  - design_id: MF09
    pool: manufactories
    issue: manufactories
    weight: 1
    title:
      english: "Noble Estate Workshop"
      simp_chinese: "贵族庄园作坊"
    desc:
      english: "A noble estate opens a great workshop with admirable confidence, then objects the moment burghers ask for the same liberty. The Academy is invited to discover whether scale becomes respectable only when it wears a crest."
      simp_chinese: "一处贵族庄园满怀自信地开起大作坊，却在市民也要同样的自由时立刻反对。学院被请去裁断：难道规模化只有戴上纹章才算体面？"
    options:
      a:
        text:
          english: "One rule for the crest is one rule for the bench."
          simp_chinese: "纹章一条规矩，工台也是这条规矩。"
        progress_delta: 5
        rationale:
          english: "Applying rules equally turns manufactories into a general economic principle rather than a privilege of rank, so noble satisfaction falls because landed status no longer decides who may profit from concentrated production."
          simp_chinese: "平等适用规则，把制造工场变成普遍的经济原则，而非等级特权；贵族满意度因此下降，因为土地身份不再决定谁能从集中生产里获利。"
        effect_blocks:
          - type: estate_satisfaction
            estate: nobles_estate
            value: -0.1
          - type: seat_stance
            group: court_bureaucrats
            stance: support
            cooldown_months: 18
      b:
        text:
          english: "The crest is granted its exemption; the burgher is refused."
          simp_chinese: "纹章获准豁免，市民则被驳回。"
        progress_delta: -5
        rationale:
          english: "Exempting noble workshops preserves rank privilege while hollowing out the reform: if scale is permitted only to estates, manufactories become another noble exception rather than a new productive order."
          simp_chinese: "豁免贵族作坊，保全了等级特权，却把改革掏空：若规模化只准庄园享用，制造工场就成了又一项贵族例外，而非新的生产秩序。"
        effect_blocks:
          - type: seat_stance
            group: nobility
            stance: oppose
            cooldown_months: 24
          - type: estate_satisfaction
            estate: nobles_estate
            value: 0.1
  - design_id: MF10
    pool: manufactories
    issue: manufactories
    weight: 1
    title:
      english: "Child Labor Petition"
      simp_chinese: "童工请愿"
    desc:
      english: "Parish leaders arrive with names, ages, and smaller hands than the debate had cared to imagine. The question is no longer whether manufactories make more, but what kind of labor they may be allowed to consume."
      simp_chinese: "堂区领袖带着姓名、年岁，以及一双双辩论此前不愿细想的小手来到学院。问题不再是制造工场能否生产更多，而是它被允许消耗怎样的劳动。"
    options:
      a:
        text:
          english: "The Academy sets an age to the bench and lets the work go on."
          simp_chinese: "学院给工作台定下年龄，再让活计继续。"
        progress_delta: 2.5
        rationale:
          english: "Labor rules keep the manufactory argument alive while conceding that production cannot be divorced from moral supervision; clergy and peasants partly approve because the reform now carries limits rather than pure expansion."
          simp_chinese: "劳动规则让制造工场的论点继续成立，同时承认生产无法与道德监督分离；教士与农民部分赞同，因为改革如今带着限制，而不只是一味扩张。"
        effect_blocks:
          - type: estate_satisfaction
            estate: clergy_estate
            value: 0.05
          - type: estate_satisfaction
            estate: peasants_estate
            value: 0.05
          - type: temporary_country_modifier
            key: tv_academy_debate_child_labor_rules
            months: 18
            effects:
              "regulated workshop labor": 0.02
      b:
        text:
          english: "No, not with these hands."
          simp_chinese: "不行，不能用这样的手。"
        progress_delta: -5
        rationale:
          english: "Shutting the model down lets conservative critics treat child labor as proof that proto-factory organization is morally rotten at the root, which strongly rejects acceptance while handing the protective estates a clear victory."
          simp_chinese: "关闭这种模式，会让保守批评者把童工当作原始工厂组织从根上道德败坏的证据，强烈推动否定，同时让主张保护的阶层取得明确胜利。"
        effect_blocks:
          - type: seat_stance
            group: clergy
            stance: oppose
            cooldown_months: 24
          - type: seat_stance
            group: peasants
            stance: oppose
            cooldown_months: 18
          - type: estate_satisfaction
            estate: clergy_estate
            value: 0.1
  - design_id: MF11
    pool: manufactories
    issue: manufactories
    weight: 1
    title:
      english: "Standard Parts"
      simp_chinese: "标准部件"
    desc:
      english: "Artisans lay out a neat row of parts that change places without complaint. Half the chamber sees faster repair and steadier supply; the other half hears the quiet funeral bell of individual craft."
      simp_chinese: "工匠们摆出一排整齐的部件，它们能毫无怨言地彼此互换。半个会场看见更快的维修、更稳的供应；另一半却听见个人手艺的静默丧钟。"
    options:
      a:
        text:
          english: "The Academy blesses parts that answer to a gauge, not a name."
          simp_chinese: "学院认可那些只对量规、不对姓名负责的部件。"
        progress_delta: 5
        rationale:
          english: "Standard parts make manufactories look like a new system of reliable production rather than merely larger workshops, so the debate moves strongly toward acceptance; artists and craft advocates resist the loss of distinctive workmanship."
          simp_chinese: "标准部件让制造工场看起来不只是更大的作坊，而是一套可靠生产的新体系，辩论因此明显转向接纳；艺术家与手艺维护者则反感独特工艺被磨平。"
        effect_blocks:
          - type: seat_stance
            group: artists
            stance: oppose
            cooldown_months: 18
      b:
        text:
          english: "We keep the mark of the maker's own hand."
          simp_chinese: "我们留住匠人亲手打下的记号。"
        progress_delta: -2.5
        rationale:
          english: "Preserving craft variation reassures guild-minded burghers that skill and local reputation still count, and acceptance slips because interchangeable production remains an affront to valued workmanship."
          simp_chinese: "保留手工差异，安抚重视行会传统的市民，让他们相信技艺与地方名声仍然要紧；接纳随之滑落，因为互换式生产仍被当作对精工的冒犯。"
        effect_blocks:
          - type: estate_satisfaction
            estate: burghers_estate
            value: 0.1
  - design_id: MF12
    pool: manufactories
    issue: manufactories
    weight: 1
    title:
      english: "Factory Accounts"
      simp_chinese: "工厂账册"
    desc:
      english: "Accountants lay waste, delay, spoilage, and idle hours in columns so tidy they feel like an accusation. What once hid inside dust and habit becomes a public question of management, discipline, and blame."
      simp_chinese: "会计把废料、迟误、损耗和闲置的钟点排成整齐得像控诉的栏目。曾藏在尘土与习惯里的东西，如今成了关于管理、纪律与追责的公共问题。"
    options:
      a:
        text:
          english: "We rule the workshop by its own ledger."
          simp_chinese: "我们用作坊自己的账册来管作坊。"
        progress_delta: 2.5
        rationale:
          english: "Using the accounts makes large-scale production governable and gives bureaucrats a practical reason to back manufactories; the gain is modest because visibility breeds friction as well as reform."
          simp_chinese: "使用账册让大规模生产变得可治理，也给官僚一个支持制造工场的实际理由；进展有限，因为透明在带来改革的同时也制造摩擦。"
        effect_blocks:
          - type: seat_stance
            group: court_bureaucrats
            stance: support
            cooldown_months: 12
      b:
        text:
          english: "The owners keep their columns to themselves."
          simp_chinese: "业主把自己的账目栏留给自己看。"
        progress_delta: -2.5
        rationale:
          english: "Avoiding intrusive accounting shields workshop owners from official scrutiny and keeps production knowledge private, so the debate loses ground as manufactories look less like a disciplined institution and more like enlarged private interest."
          simp_chinese: "避免侵入式核算，护住业主不受官方审视，也把生产知识留在私人手中；辩论因此退步，因为制造工场看起来不再像有纪律的制度，倒更像被放大的私利。"
        effect_blocks:
          - type: estate_satisfaction
            estate: burghers_estate
            value: 0.05
  - design_id: MF13
    pool: manufactories
    issue: manufactories
    weight: 1
    title:
      english: "Rural Displacement"
      simp_chinese: "乡村流离"
    desc:
      english: "Peasant spokesmen complain that manufactory demand draws hands from the fields and daughters from household arrangements. The Academy hears not merely a grievance against production, but the creaking of an entire rural order."
      simp_chinese: "农民代表抱怨，工场的需求把劳力从田里拽走，也把女儿们从家庭安排里带走。学院听见的不只是对生产的抱怨，而是整个乡村秩序的吱呀作响。"
    options:
      a:
        text:
          english: "The Crown spends to cushion the villages as the benches fill."
          simp_chinese: "王权掏钱缓冲村庄，任工台一点点填满。"
        progress_delta: 2.5
        rationale:
          english: "Managing the transition admits that manufactories disrupt rural life without abandoning the new model, so acceptance rises carefully, with public spending used to soften the social shock."
          simp_chinese: "管理这场转变，等于承认制造工场会冲击乡村生活，却不放弃新模式；接纳谨慎上升，同时以公共支出缓和社会震荡。"
        effect_blocks:
          - type: resource
            resource: gold
            scale: -1
          - type: seat_cooldown
            group: peasants
            cooldown_months: 18
      b:
        text:
          english: "Slowly, before the fields empty."
          simp_chinese: "慢些来，别把田都掏空了。"
        progress_delta: -5
        rationale:
          english: "Slowing expansion hands the peasants a clear victory and frames manufactories as something that must wait upon rural custom, so the debate turns sharply against acceptance as the old household economy regains authority."
          simp_chinese: "放慢扩张，给农民一场明确的胜利，也把制造工场塑造成必须迁就乡村习俗的东西；旧家庭经济重掌权威，辩论因此明显转向拒绝。"
        effect_blocks:
          - type: estate_satisfaction
            estate: peasants_estate
            value: 0.1
  - design_id: MF14
    pool: manufactories
    issue: manufactories
    weight: 1
    title:
      english: "Imported Machine"
      simp_chinese: "舶来机器"
    desc:
      english: "A foreign machine is carried into the Academy with unfamiliar bolts and very familiar ambition. Its admirers see a design that can be copied; its enemies see another realm reaching a metal hand into local workshops."
      simp_chinese: "一台外国机器被搬进学院，螺栓陌生，野心却熟悉得很。赞成者看见一套可以仿制的设计，反对者则看见另一个国家把金属之手伸进本地工坊。"
    options:
      a:
        text:
          english: "The Academy takes the machine apart to build its own."
          simp_chinese: "学院把机器拆开，好造出自己的一台。"
        progress_delta: 5
        rationale:
          english: "Copying and adapting the machine turns a foreign example into domestic manufacturing capacity, giving the acceptance argument a dramatic proof of usefulness; the cost is both practical expense and sharper foreign unease."
          simp_chinese: "仿制并改造机器，把外国范例变成本国的制造能力，为接纳派提供极有力的实用证明；代价是实际的开销，以及对外更明显的不安。"
        effect_blocks:
          - type: resource
            resource: gold
            scale: -1
          - type: seat_stance
            group: foreign_power
            stance: oppose
            cooldown_months: 24
      b:
        text:
          english: "Foreign iron carries a foreign hand."
          simp_chinese: "外来的铁，牵着外来的手。"
        progress_delta: -5
        rationale:
          english: "Rejecting the machine guards guild pride and casts foreign methods as contamination rather than opportunity, so rejection gains strong momentum as suspicion of imported technique becomes a defense of local order."
          simp_chinese: "拒绝这台机器，维护了行会的自尊，也把外国方法说成污染而非机会；对舶来技术的怀疑被包装成守护本地秩序，拒绝方向因此强劲推进。"
        effect_blocks:
          - type: seat_stance
            group: burghers
            stance: oppose
            cooldown_months: 24
  - design_id: MF15
    pool: manufactories
    issue: manufactories
    weight: 1
    title:
      english: "Coal Smoke Argument"
      simp_chinese: "煤烟之争"
    desc:
      english: "Townsfolk remind the Academy that productive smoke is smoke all the same. Window ledges, lungs, and laundry lines are entered as witnesses against any theory that treats output as proof enough."
      simp_chinese: "城里人提醒学院：能带来产量的烟，终究还是烟。窗台、肺，还有晾衣绳，一并被传作证人，反驳那种以为产出增加便自证清白的理论。"
    options:
      a:
        text:
          english: "The Crown pays for cleaner flues and lets the fires burn."
          simp_chinese: "王权出钱装更干净的烟道，任炉火照烧。"
        progress_delta: 2.5
        rationale:
          english: "Regulating smoke concedes the harm without abandoning manufactories, so acceptance can advance in a more politically durable form; gold is spent because cleaner production needs oversight and equipment."
          simp_chinese: "管控烟尘，承认了危害却没放弃制造工场，接纳因此能以更耐久的政治形态推进；由于更清洁的生产需要监督与设备，国库要出钱。"
        effect_blocks:
          - type: resource
            resource: gold
            scale: -1
          - type: seat_stance
            group: public_opinion
            stance: support
            cooldown_months: 12
      b:
        text:
          english: "We push the furnaces past the city wall."
          simp_chinese: "我们把炉子赶到城墙外去。"
        progress_delta: -2.5
        rationale:
          english: "Limiting industrial sites calms local complaints and makes the old urban fabric feel protected, so the debate turns slightly against acceptance because production is treated as something that must be fenced off."
          simp_chinese: "限制工业场址，平息了地方的怨言，也让旧城市肌理显得受到保护；辩论因此小幅转向拒绝，因为生产被当成必须圈起来的东西。"
        effect_blocks:
          - type: seat_stance
            group: local_autonomy
            stance: oppose
            cooldown_months: 18
  - design_id: MF16
    pool: manufactories
    issue: manufactories
    weight: 1
    title:
      english: "Piecework Pay"
      simp_chinese: "计件工资"
    desc:
      english: "Owners propose paying by the piece, so every finished length of cloth, polished tool, or packed crate becomes at once a wage and an accusation. The workers hear arithmetic trying to become a foreman."
      simp_chinese: "业主提议按件付薪，于是每一匹织好的布、每一件磨亮的工具、每一箱封好的货，既是工资，也是责备。工人听见算术正想变成监工。"
    options:
      a:
        text:
          english: "The clerks price each finished piece and post the rate."
          simp_chinese: "账房给每件成品定价，把工价贴了出来。"
        progress_delta: 5
        rationale:
          english: "Regulated piecework makes manufactory labor measurable and ties reward straight to output, which strongly advances the case for production by scale; the cost is social, as workers and rural households suspect the new arithmetic will squeeze more labor from the same hands."
          simp_chinese: "受规制的计件工资让制造工场的劳动可衡量，把报酬直接系在产量上，有力推动规模化生产的论点；代价在社会层面：工人和乡村家庭怀疑这套新算术只是要从同一双手里榨出更多活。"
        effect_blocks:
          - type: estate_satisfaction
            estate: peasants_estate
            value: -0.1
          - type: seat_stance
            group: peasants
            stance: oppose
            cooldown_months: 18
      b:
        text:
          english: "Enough; a wage is not a tally."
          simp_chinese: "够了，工钱不是记数。"
        progress_delta: -5
        rationale:
          english: "Banning piecework protects older expectations of fair wages, household rhythm, and guild bargaining, so the debate moves sharply toward rejection as manufactories lose one of their clearest tools for turning labor into counted output."
          simp_chinese: "禁止计件工资，护住了关于公平工资、家庭节奏与行会议价的旧期待；辩论因此明显转向拒绝，因为制造工场失去了把劳动化为可计量产出的最清晰工具之一。"
        effect_blocks:
          - type: estate_satisfaction
            estate: peasants_estate
            value: 0.1
          - type: seat_stance
            group: burghers
            stance: oppose
            cooldown_months: 18
  - design_id: MF17
    pool: manufactories
    issue: manufactories
    weight: 1
    title:
      english: "Workshop School"
      simp_chinese: "工场学校"
    desc:
      english: "Reformers propose training workers inside the manufactory, where the lesson opens at the bench and closes in a counted batch. Guild masters notice at once that apprenticeship is being asked to lend out its own vocabulary."
      simp_chinese: "改革者提议在制造工场内部训练工人，让课程从工作台开讲，以一批可计数的成品收尾。行会师傅立刻察觉：学徒制正被要求把自己的语汇借出去。"
    options:
      a:
        text:
          english: "The manufactory opens a school at its own gate."
          simp_chinese: "制造工场在自家门口办起了学校。"
        progress_delta: 5
        rationale:
          english: "Funding workshop schools lets manufactories reproduce their own skilled labor instead of borrowing legitimacy from guild apprenticeship, which powerfully advances acceptance; it costs money and tells the guilds their gatekeeping role is no longer secure."
          simp_chinese: "资助工场学校，让制造工场自行培养熟练劳力，而不必再向行会学徒制借合法性，有力推动接纳；但要花钱，也等于告诉行会：它们把关的地位不再稳固。"
        effect_blocks:
          - type: resource
            resource: gold
            scale: -1
          - type: estate_satisfaction
            estate: burghers_estate
            value: -0.05
      b:
        text:
          english: "We send the boys back to the guild masters."
          simp_chinese: "我们把学徒送回行会师傅那里。"
        progress_delta: -5
        rationale:
          english: "Keeping guild apprenticeship preserves the old ladder of skill, patronage, and urban standing, so the debate turns decisively against manufactories because training stays tied to the institutions most threatened by factory discipline."
          simp_chinese: "保留行会学徒制，保住了技能、庇护与城市身份的旧阶梯；辩论因此明确转向反对制造工场，因为训练仍被系在最受工场纪律威胁的旧制度上。"
        effect_blocks:
          - type: estate_satisfaction
            estate: burghers_estate
            value: 0.1
          - type: temporary_country_modifier
            key: tv_academy_debate_guild_apprenticeship_preserved
            months: 18
            effects:
              "continuity of urban craft training": 0.03
  - design_id: MF18
    pool: manufactories
    issue: manufactories
    weight: 1
    title:
      english: "Quality Scandal"
      simp_chinese: "质量丑闻"
    desc:
      english: "A large batch fails inspection in full view: seams split, fittings crack, and the enemies of scale look almost grateful for the evidence. The question is whether the failure condemns the system, or only the inspectors."
      simp_chinese: "一大批货物当众没能过检：缝线绽开，配件崩断，反对规模化的人几乎要谢过这份证据。眼下的问题是：这次失败定罪的是整套制度，还是只是检验者。"
    options:
      a:
        text:
          english: "The Academy spends its name to mend the inspection."
          simp_chinese: "学院搭上自己的名声，去修补检验环节。"
        progress_delta: 2.5
        rationale:
          english: "Improving inspection admits the scandal without surrendering the manufactory model, so acceptance rises moderately as reformers show that scale can correct itself; prestige is spent to survive the embarrassment."
          simp_chinese: "改进检验，等于承认丑闻却不放弃制造工场模式，接纳因此适度上升，因为改革者证明规模化能自我纠正；代价是花费威望来熬过这场难堪。"
        effect_blocks:
          - type: resource
            resource: prestige
            amount: -5
          - type: seat_stance
            group: court_bureaucrats
            stance: support
            cooldown_months: 12
      b:
        text:
          english: "We say the fault lies in the very size of it."
          simp_chinese: "我们说，毛病就出在这规模本身。"
        progress_delta: -2.5
        rationale:
          english: "Blaming scale itself turns a bad batch into a moral lesson against concentration, speed, and oversight by strangers; the rejection is moderate because the scandal is real, and conservative readers of the evidence take heart."
          simp_chinese: "指责规模本身，把一批劣货变成反对集中、求快与外人监督的道德教训；拒绝幅度适中，因为丑闻确有其事，保守派也从这份证据里得了底气。"
        effect_blocks:
          - type: estate_satisfaction
            estate: burghers_estate
            value: 0.05
          - type: seat_stance
            group: scholarly_community
            stance: oppose
            cooldown_months: 12
  - design_id: MF19
    pool: manufactories
    issue: manufactories
    weight: 1
    title:
      english: "Merchant Capital Pool"
      simp_chinese: "商人资本池"
    desc:
      english: "Merchants propose pooling capital vast enough to raise a manufactory no single family could command. The money arrives not as a purse but as a committee, with ledgers and patience."
      simp_chinese: "商人提议合资筹集一笔足以立起制造工场的资本，大到任何单一家族都无法独掌。这笔钱来时不像一个钱袋，倒像一群带着账本与耐心的委员。"
    options:
      a:
        text:
          english: "The Crown lets the merchants bind their purses into one."
          simp_chinese: "王权准许商人把各自的钱袋并成一个。"
        progress_delta: 5
        rationale:
          english: "Legalizing pooled capital gives manufactories a financial body large enough to match their physical ambition, so acceptance advances sharply as scale becomes investable and banking-minded burghers see a path from ledger to workshop."
          simp_chinese: "使资本池合法化，给制造工场配上足以匹配其物质野心的金融身体，接纳因此大幅推进：规模化从此可投资，有银行头脑的市民也看见了从账本通向工场的路。"
        effect_blocks:
          - type: estate_satisfaction
            estate: burghers_estate
            value: 0.1
          - type: temporary_country_modifier
            key: tv_academy_debate_merchant_capital_pool
            months: 24
            effects:
              "large manufactory finance": 0.03
      b:
        text:
          english: "We will not let a committee own a trade."
          simp_chinese: "我们不会让一个委员会攥住整个行当。"
        progress_delta: -5
        rationale:
          english: "Forbidding pooled capital shields noble landlords and guild masters from a new kind of collective commercial power, so the debate moves strongly toward rejection as large manufactories stay trapped below the scale their advocates promised."
          simp_chinese: "禁止资本池，护住贵族地主与行会师傅，免受新型集体商业力量的冲击；辩论因此强烈转向拒绝，因为大型制造工场仍被困在倡导者所许诺的规模之下。"
        effect_blocks:
          - type: estate_satisfaction
            estate: nobles_estate
            value: 0.05
          - type: seat_stance
            group: burghers
            stance: oppose
            cooldown_months: 18
  - design_id: MF20
    pool: manufactories
    issue: manufactories
    weight: 1
    title:
      english: "The First Whistle"
      simp_chinese: "第一声汽笛"
    desc:
      english: "A new factory whistle splits the day with admirable efficiency and unbearable certainty. It tells workers when to begin, neighbors when to complain, and reformers that discipline can now be heard three streets away."
      simp_chinese: "一只新的工场汽笛以令人赞叹的效率、也以令人难忍的确定，切开一天。它告诉工人何时开工，告诉邻人何时抱怨，也告诉改革者：纪律隔着三条街也听得见。"
    options:
      a:
        text:
          english: "So be it, let the whistle keep the hour."
          simp_chinese: "也罢，就让汽笛来守着钟点。"
        progress_delta: 2.5
        rationale:
          english: "Defending the whistle accepts that manufactories need a public, audible discipline to coordinate many workers at once, so acceptance rises modestly; the symbol is practical yet grating, pleasing production's backers while angering nearby laboring households."
          simp_chinese: "捍卫汽笛，是承认制造工场需要一种公开、可听见的纪律来同时协调众多工人，接纳因此小幅上升；这个象征实用却刺耳，让生产的支持者满意，也让附近的劳动家庭恼怒。"
        effect_blocks:
          - type: estate_satisfaction
            estate: burghers_estate
            value: 0.05
          - type: estate_satisfaction
            estate: peasants_estate
            value: -0.05
      b:
        text:
          english: "The magistrate orders the whistle stopped."
          simp_chinese: "地方官下令让汽笛停下。"
        progress_delta: -2.5
        rationale:
          english: "Silencing the whistle restores local quiet and makes factory discipline look negotiable, so the debate slips toward rejection because the manufactory must retreat from one of its simplest tools for organizing time."
          simp_chinese: "让汽笛安静，恢复了地方的宁静，也让工场纪律显得可以商量；辩论因此滑向拒绝，因为制造工场不得不放弃组织时间的最简单工具之一。"
        effect_blocks:
          - type: resource
            resource: stability
            amount: 2.5
          - type: seat_stance
            group: local_autonomy
            stance: oppose
            cooldown_months: 12
excluded_events: []
