      simp_chinese: "译词之争"
    desc:
      english: "Two translations of the same key term produce two different futures for the realm. Each side insists the other has mistranslated both the word and the age."
      simp_chinese: "同一个关键词的两种译法，为国家勾勒出两个不同的未来。双方都坚称，对方不仅译错了词，也译错了时代。"
