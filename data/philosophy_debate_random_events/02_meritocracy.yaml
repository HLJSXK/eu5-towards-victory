      simp_chinese: "公开排名榜"
    desc:
      english: "The reformers want the results nailed to the gate where every family may read, in plain figures, exactly what their influence failed to buy."
      simp_chinese: "改革者要把结果钉在大门上，让每个家族都能用清清楚楚的名次，读出他们的影响力究竟没能买下什么。"
    options:
      a:
        text:
