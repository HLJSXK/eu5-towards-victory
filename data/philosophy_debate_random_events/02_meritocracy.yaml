          simp_chinese: "要求首都认证，让地方训练继续服从中央。中央官僚为此赞成，因为才能仍须经过熟悉的机关、印信与宫廷标准的筛检。"
        effect_blocks:
          - type: seat_stance
            group: court_bureaucrats
            stance: oppose
            cooldown_months: 18
          - type: temporary_country_modifier
            key: tv_academy_debate_capital_certification
            months: 18
            effects:
              "central examination control": 0.02
