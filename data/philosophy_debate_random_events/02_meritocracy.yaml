  - design_id: M19
    pool: meritocracy
    issue: meritocracy
    weight: 1
    title:
      english: "A School Outside the Capital"
      simp_chinese: "首都之外的学校"
    desc:
      english: "A provincial school sends word that it can raise capable officials without a single lesson in court polish, and asks only that its graduates be allowed to sit the same examinations."
      simp_chinese: "一所省立学校传来消息，称自己无需一堂宫廷仪态课也能培养出称职的官员，所求不过是让它的学生同场应试。"
    options:
      a:
        text:
          english: "The Crown grants the provincial school a seat at the examinations."
          simp_chinese: "王冠准这所省立学校的学生入场应试。"
        progress_delta: 5
        rationale:
          english: "Recognizing the school concedes that administrative ability can be trained beyond the capital's manners and patronage circuits. Local autonomy gains confidence as provincial institutions are treated as sources of talent."
          simp_chinese: "承认这所学校，等于承认行政才能可在首都的礼法与庇护圈之外培养。地方自治因此更有信心，因为地方机构被视为人才的来源。"
        effect_blocks:
          - type: seat_stance
            group: local_autonomy
            stance: support
            cooldown_months: 18
          - type: temporary_country_modifier
            key: tv_academy_debate_provincial_training
            months: 24
            effects:
              "provincial official recruitment": 0.02
