    issue: meritocracy
    weight: 1
    title:
      english: "Oath of the Examiners"
      simp_chinese: "考官之誓"
    desc:
      english: "Before they will set the results on the gate, the examiners ask the Crown for a sworn shield against the reprisals certain great houses are already promising them in quiet corridors."
      simp_chinese: "在把结果张贴上门之前，考官们请求王冠立誓，为他们挡下某些大族已在僻静走廊里许下的报复。"
    options:
