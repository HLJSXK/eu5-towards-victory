    issue: meritocracy
    weight: 1
    title:
      english: "Hereditary Office in Crisis"
      simp_chinese: "世袭官职危机"
    desc:
      english: "A hereditary official fails, in full view of the hall, at the very task the debate has been insisting ought to be tested."
      simp_chinese: "一名世袭官员当着满厅的面，恰好在辩论一直坚称应受考核的那桩差事上失了手。"
    options:
      a:
        text:
          english: "The reformers enter the day's failure into the record as evidence."
          simp_chinese: "改革者把这一日的失手，作为证据录入记录。"
        progress_delta: 10
        rationale:
          english: "Using the failure as proof hands the meritocratic side a vivid case that inherited office can imperil public work. The argument leaps forward, while noble satisfaction falls as an old privilege becomes evidence against itself."
          simp_chinese: "把这次失手当作证据，为任人唯才一方送上鲜明的一例：世袭官职会危及公共事务。论点因此大步向前，而贵族满意度下滑，因为旧特权成了指证自身的材料。"
        effect_blocks:
          - type: estate_satisfaction
            estate: nobles_estate
            value: -0.05
          - type: seat_stance
            group: public_opinion
            stance: support
            cooldown_months: 18
      b:
        text:
          english: "One slip does not unmake a lineage."
          simp_chinese: "一次失足，废不了一门世家。"
        progress_delta: -10
        rationale:
          english: "Shielding the office averts an immediate crisis of legitimacy and guards the dignity of inherited administration. It also tells the debate that birth may outlast even a public failure of competence."
          simp_chinese: "保护该官职，避开了眼前的正统性危机，也维护了世袭行政的体面。但这也等于告诉辩论：即便能力当众失败，出身仍可幸存。"
