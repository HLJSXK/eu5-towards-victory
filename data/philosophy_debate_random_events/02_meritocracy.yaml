      english: "Clean Ink, Dirty Hands"
      simp_chinese: "清白墨迹，肮脏之手"
    desc:
      english: "The investigators find that the cleanest papers on the examination table were copied out fair by the dirtiest patronage network in the realm."
      simp_chinese: "调查者发现，考桌上卷面最干净的试卷，恰恰出自全国最肮脏的那张庇护网络之手。"
    options:
