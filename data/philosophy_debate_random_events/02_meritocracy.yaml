        rationale:
          english: "Refusing protection keeps the great houses placid by leaving their intimidation unchallenged. Noble approval rises, but every examiner learns that a correct result may still be too dangerous to commit to print."
          simp_chinese: "拒绝保护，让大族因恐吓未受挑战而保持平静。贵族赞许随之上升，但每位考官都会明白：即便结果正确，也可能危险到不敢付梓。"
        effect_blocks:
