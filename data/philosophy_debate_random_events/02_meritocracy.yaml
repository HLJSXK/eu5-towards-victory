random_events:
  - design_id: M01
    pool: meritocracy
    issue: meritocracy
    weight: 1
    title:
      english: "The Nameless Papers"
      simp_chinese: "无名的试卷"
    desc:
      english: "Before a single mark is set down, the examiners would strike every name from the papers, leaving only the argument and the penmanship to speak. Birth complains, bitterly, that the ink has gone blind and can no longer tell a great house from a grocer's son."
      simp_chinese: "试卷上落下第一个评分之前，考官们想先抹去每一个姓名，只留下论证与笔迹替人说话。门第愤愤不平，说墨水竟学会了装瞎——再也分不清名门望族与杂货商的儿子。"
    options:
      a:
        text:
          english: "The clerks strike every name from the papers before the marking begins."
          simp_chinese: "书吏在评分开始前，抹去试卷上的每一个姓名。"
        progress_delta: 10
        rationale:
          english: "Anonymous marking makes the debate's central claim real: an office can be judged by the ability on the page rather than the family in the margin. Nobles lose comfort, for their names no longer do quiet work where the examiner can see them."
          simp_chinese: "匿名评分把这场辩论的核心主张变成实制：官职凭纸面上的本事受评，而非页边的家世。贵族因此不安——他们的姓氏，再不能在考官眼皮底下悄悄使力。"
        effect_blocks:
          - type: estate_satisfaction
            estate: nobles_estate
            value: -0.04
          - type: seat_stance
            group: scholarly_community
            stance: support
            cooldown_months: 18
      b:
        text:
          english: "We leave the names where an examiner can see them."
          simp_chinese: "我们把姓名留在考官看得见的地方。"
        progress_delta: -5
        rationale:
          english: "Leaving the names in plain sight keeps the old social signals inside the examination itself, slowing the meritocratic case while assuring the great families that rank still has an authorized voice on the page."
          simp_chinese: "把姓名留在明处，等于让旧有的社会信号继续留在考试之内，放慢任人唯才的推进，也向大族保证：门第在纸面上仍有被认可的发言权。"
        effect_blocks:
          - type: estate_satisfaction
            estate: nobles_estate
            value: 0.03
          - type: seat_stance
            group: nobility
            stance: oppose
            cooldown_months: 18
  - design_id: M02
    pool: meritocracy
    issue: meritocracy
    weight: 1
    title:
      english: "Genealogies on the Table"
      simp_chinese: "桌上的族谱"
    desc:
      english: "The great houses arrive with genealogies polished like altar plate, each parchment insisting that the capacity to govern descends through a bloodline as surely as a set of silver spoons."
      simp_chinese: "大族带来打磨得像祭坛银器般的族谱，每一张羊皮纸都坚称，治理之能会像一套银匙那样，沿着血脉稳稳传下来。"
    options:
      a:
        text:
          english: "We ask the parchments to answer to evidence, not to etiquette."
          simp_chinese: "我们要这些羊皮纸向证据交代，而不是向礼节交代。"
        progress_delta: 5
        rationale:
          english: "Questioning the genealogies forces ancestry to answer to evidence instead of etiquette. The Crown spends prestige by publicly doubting houses long accustomed to being treated as their own proof."
          simp_chinese: "质疑族谱，就是逼血统向证据交代，而非向礼节交代。王冠公开怀疑那些惯于把自身当作证据的家族，因而要付出威望。"
        effect_blocks:
          - type: resource
            resource: prestige
            amount: -10
          - type: seat_stance
            group: court_bureaucrats
            stance: support
            cooldown_months: 12
      b:
        text:
          english: "The court honors service handed down like an heirloom."
          simp_chinese: "宫廷表彰那份像传家宝一样继承下来的功劳。"
        progress_delta: -10
        rationale:
          english: "Honoring hereditary service hands the noble argument its strongest form: a forefather's office becomes a warrant for the heir's. The debate slides away from open assessment and toward inherited entitlement."
          simp_chinese: "表彰世袭功劳，等于把贵族论点推到最有力处：先人的官职成了后代的凭证。辩论也就此从公开考核，滑回继承而来的权利。"
        effect_blocks:
          - type: estate_satisfaction
            estate: nobles_estate
            value: 0.05
          - type: seat_stance
            group: nobility
            stance: oppose
            cooldown_months: 24
  - design_id: M03
    pool: meritocracy
    issue: meritocracy
    weight: 1
    title:
      english: "The Provincial Prodigy"
      simp_chinese: "外省奇才"
    desc:
      english: "From a province the court could not find on its better maps, a candidate untangles in one evening a problem the favorites have circled warily for weeks."
      simp_chinese: "一名来自宫廷连好地图上都难寻的省份的候选人，一个晚上就理清了宠臣们绕着走了数周的难题。"
    options:
      a:
        text:
          english: "The Academy summons the stranger to court and a seat near the front."
          simp_chinese: "学院召这位外乡人入朝，并给了他靠前的一个座位。"
        progress_delta: 10
        rationale:
          english: "Bringing the provincial candidate to court turns meritocracy from a theory into a visible ladder. Local elites resent the disturbance, for talent can now climb past their patronage entirely."
          simp_chinese: "把这名外省候选人召入宫廷，任人唯才便从理论变成一道看得见的阶梯。地方精英反感这份扰动，因为人才如今能径直越过他们的庇护往上走。"
        effect_blocks:
          - type: seat_stance
            group: local_autonomy
            stance: oppose
            cooldown_months: 18
          - type: temporary_country_modifier
            key: tv_academy_debate_provincial_disruption
            months: 24
            effects:
              "provincial elite resentment": -0.02
      b:
        text:
          english: "Admirable, from a safe distance."
          simp_chinese: "可敬——离得远远地敬着。"
        progress_delta: -5
        rationale:
          english: "Praising the prodigy from a distance lets the court applaud ability without letting it unsettle a single appointment. Order holds, but the debate notes that talent can still be kept politely on the far side of the door."
          simp_chinese: "遥致嘉奖，让宫廷得以赞美才能，却不必让它动摇一桩任命。秩序保住了，但辩论也记下：人才仍可被客客气气地挡在门外那头。"
        effect_blocks:
          - type: seat_stance
            group: court_bureaucrats
            stance: oppose
            cooldown_months: 12
          - type: temporary_country_modifier
            key: tv_academy_debate_court_order_preserved
            months: 18
            effects:
              "court routine confidence": 0.02
  - design_id: M04
    pool: meritocracy
    issue: meritocracy
    weight: 1
    title:
      english: "Purchased Office"
      simp_chinese: "买来的官职"
    desc:
      english: "While the debate still rings in the hall, a lucrative office is promised in a lower corridor to a donor's son, whose chief qualification is a father with a generous ledger."
      simp_chinese: "辩论还在厅中回响，一项肥缺已在楼下的走廊里许给了某位捐献者的儿子——此人最大的资历，是有个账本慷慨的父亲。"
    options:
      a:
        text:
          english: "The clerks lay the bargain open on the record."
          simp_chinese: "书吏把这笔交易摊在记录上，公之于众。"
        progress_delta: 10
        rationale:
          english: "Exposing the sale proves that a bought office is no harmless custom but a direct rival to tested competence. The reform gains force, though the Crown forfeits the coin and noble patrons the goodwill."
          simp_chinese: "揭露这笔交易，证明买来的官职绝非无伤大雅的旧例，而是对考核所得能力的正面对手。改革因此更有力，只是王室失了这笔钱，贵族庇护者也失了好感。"
        effect_blocks:
          - type: resource
            resource: gold
            scale: -1
          - type: estate_satisfaction
            estate: nobles_estate
            value: -0.03
      b:
        text:
          english: "We let the coin quietly find its office."
          simp_chinese: "我们由着这笔钱，悄悄找到它的官职。"
        progress_delta: -10
        rationale:
          english: "Accepting the arrangement makes the debate's very enemy into policy: money and connection buy what merit was meant to earn. The treasury breathes easier, but the case for open assessment is badly wounded."
          simp_chinese: "接受这项安排，等于把辩论的敌人立为政策：金钱与关系买下了本应由才能赢得的东西。国库松了一口气，公开考核的主张却受了重创。"
        effect_blocks:
          - type: resource
            resource: gold
            scale: 1
          - type: seat_stance
            group: nobility
            stance: oppose
            cooldown_months: 18
  - design_id: M05
    pool: meritocracy
    issue: meritocracy
    weight: 1
    title:
      english: "Merit on the Battlefield"
      simp_chinese: "战场上的功绩"
    desc:
      english: "Officers rise to argue that a command earned under fire should weigh more in the ledger of appointments than a name inherited from men long in their tombs."
      simp_chinese: "军官们起身主张，炮火下赢得的指挥权，在任命的账簿上应比一个早已入土的先人传下的姓氏更有分量。"
    options:
      a:
        text:
          english: "The board enters proven command into the record of qualifications."
          simp_chinese: "评审会把经过考验的指挥资历，正式录入资格名册。"
        progress_delta: 5
        rationale:
          english: "Recognizing battlefield merit gives the reform a martial constituency and shows that competence can be proven under pressure, not merely on paper. The professional soldiery gains a reason to stand behind the debate."
          simp_chinese: "承认战场功绩，为改革带来一批军中支持者，并说明能力不只见于纸面，也能在压力下证明。职业军人因此有了支持这场辩论的理由。"
        effect_blocks:
          - type: seat_stance
            group: professional_military
            stance: support
            cooldown_months: 18
          - type: temporary_country_modifier
            key: tv_academy_debate_commission_review
            months: 24
            effects:
              "army reform credibility": 0.02
      b:
        text:
          english: "The sword, like the title, is best kept in the family."
          simp_chinese: "刀剑一如爵位，最好留在家里。"
        progress_delta: -5
        rationale:
          english: "Preserving noble command privilege keeps military rank bound to birth and honor. The old command families are reassured, while competence under fire stays second to inherited standing."
          simp_chinese: "维护贵族指挥特权，让军阶继续系于出身与荣誉。旧有的统帅家族得到安抚，而炮火下的本事，仍屈居于继承而来的地位之后。"
        effect_blocks:
          - type: estate_satisfaction
            estate: nobles_estate
            value: 0.03
          - type: seat_stance
            group: nobility
            stance: oppose
            cooldown_months: 18
  - design_id: M06
    pool: meritocracy
    issue: meritocracy
    weight: 1
    title:
      english: "The Tutor's Nephew"
      simp_chinese: "王室教师的侄子"
    desc:
      english: "The royal tutor petitions for a cabinet seat on behalf of a nephew of rare brilliance, though every witness in the room seems far surer of the kinship than of the brilliance."
      simp_chinese: "王室教师上书，为一位才华罕见的侄子谋一个内阁席位——只是满室的见证者，似乎对那层亲缘远比对那份才华更有把握。"
    options:
      a:
        text:
          english: "The council sends the nephew to the same trial as any stranger."
          simp_chinese: "议事会把这位侄子送去接受与任何外人一样的考核。"
        progress_delta: 5
        rationale:
          english: "Open assessment lifts the appointment away from household access and sets it on measured competence, advancing meritocracy while irritating officials who prefer their recommendations murmured in private."
          simp_chinese: "公开考核把任命从宫廷门路上移开，落到可衡量的能力之上，推动任人唯才，却也惹恼了那些偏爱私下低声举荐的官僚。"
        effect_blocks:
          - type: seat_stance
            group: court_bureaucrats
            stance: oppose
            cooldown_months: 12
      b:
        text:
          english: "We grant the favor and keep the peace of the court."
          simp_chinese: "我们准了这份人情，也保住了宫廷的太平。"
        progress_delta: -5
        rationale:
          english: "Granting the favor keeps the court calm and eases the immediate strain on legitimacy, but it teaches the Academy that kinship can still outrank proof at the door of high office."
          simp_chinese: "准了这份人情，宫廷得以安宁，眼前的正统性压力也松了一松，却也等于告诉学院：在高位的门前，亲缘仍可压过实证。"
        effect_blocks:
          - type: resource
            resource: legitimacy
            amount: 5
  - design_id: M07
    pool: meritocracy
    issue: meritocracy
    weight: 1
    title:
      english: "Clerical Certificates"
      simp_chinese: "教士证明"
    desc:
      english: "The clergy propose that no man hold public office without a certificate of good morals, making virtue the gate at which ability must stop and ask leave to pass."
      simp_chinese: "教士们提议，任何人担任公职前都须先取得一纸品行证明，让德行成为能力必须停下脚步、请求放行的门。"
    options:
      a:
        text:
          english: "First let the work be shown; the sermon can wait."
          simp_chinese: "先看真本事，讲道容后再说。"
        progress_delta: 5
        rationale:
          english: "Putting ability first keeps appointment standards testable and secular enough for the meritocratic argument, but it costs clerical satisfaction by trimming the Church's power of veto."
          simp_chinese: "把能力放在前头，能让任命标准保持可检验，也够世俗，不致让任人唯才的讨论被宗教先行截断；但这会削去教会的否决之权，教士满意度随之下降。"
        effect_blocks:
          - type: estate_satisfaction
            estate: clergy_estate
            value: -0.04
      b:
        text:
          english: "The parish seal is required before the examiner's ink."
          simp_chinese: "教区的印信，须盖在考官落墨之前。"
        progress_delta: -5
        rationale:
          english: "Accepting the moral certificate reassures the clergy, yet it sets a corporate seal of approval ahead of any competence a candidate might actually demonstrate."
          simp_chinese: "接受道德证明能安抚教士，却也把一枚团体认可的印信，摆在候选人真正能力得以展现之前。"
        effect_blocks:
          - type: estate_satisfaction
            estate: clergy_estate
            value: 0.04
  - design_id: M08
    pool: meritocracy
    issue: meritocracy
    weight: 1
    title:
      english: "Guild Tests"
      simp_chinese: "行会测试"
    desc:
      english: "The city guilds offer practical trials for accountants, engineers, and clerks, insisting that a hand steady over real timber and real ledgers can prove what a polished quotation never will."
      simp_chinese: "城市行会愿为会计、工程师和书记员设下实务试炼，坚称一双能稳稳应付真木料与真账簿的手，足以证明漂亮引文永远证明不了的东西。"
    options:
      a:
        text:
          english: "The guild halls open their benches to any candidate the work itself will test."
          simp_chinese: "行会厅堂敞开工作台，任何愿以实活受考的候选人皆可上前。"
        progress_delta: 10
        rationale:
          english: "Practical trials strongly advance meritocracy by making an office depend on demonstrable work, and they reward the burgher institutions able to supply the benches and the judges."
          simp_chinese: "实务试炼以可展示的工作能力决定任用，强力推动任人唯才，也奖励了那些能提供工作台与评判者的市民机构。"
        effect_blocks:
          - type: estate_satisfaction
            estate: burghers_estate
            value: 0.05
          - type: seat_stance
            group: burghers
            stance: support
            cooldown_months: 18
      b:
        text:
          english: "We keep the old letters and the old learning as our measure."
          simp_chinese: "我们仍以旧日的文凭与旧日的学问为尺。"
        progress_delta: -5
        rationale:
          english: "Classical credentials keep the culture of office legible to conservative scholars, but they soften the demand that a candidate prove useful ability with his own hands."
          simp_chinese: "古典资历让任官的一套体统对保守学者仍旧熟悉，却也冲淡了要候选人亲手证明实用能力的那份要求。"
        effect_blocks:
          - type: seat_stance
            group: scholarly_community
            stance: oppose
            cooldown_months: 12
  - design_id: M09
    pool: meritocracy
    issue: meritocracy
    weight: 1
    title:
      english: "A Peasant's Petition"
      simp_chinese: "农民的请愿"
    desc:
      english: "A village schoolmaster sends up a plain question, whether a mind born beneath a thatched roof is any less a mind, and the petition arrives in the marbled chamber with the mud of the road still on its shoes."
      simp_chinese: "一位乡村塾师递上一个朴素的问题——生在茅屋之下的头脑，是否就少了几分头脑——这份请愿走进大理石铺就的议厅时，鞋上还沾着一路的泥。"
    options:
      a:
        text:
          english: "The chamber lets the muddy petition be read from the floor, boots and all."
          simp_chinese: "议厅准这份带泥的请愿当众宣读，连同那双靴子。"
        progress_delta: 10
        rationale:
          english: "Hearing the petition widens meritocracy's social base, proving that origin cannot strike a man from the lists before his ability has even been examined."
          simp_chinese: "接纳请愿，拓宽了任人唯才的社会根基，证明出身不能在一个人的能力受检之前，就先把他从名册上划去。"
        effect_blocks:
          - type: estate_satisfaction
            estate: peasants_estate
            value: 0.05
          - type: seat_stance
            group: peasants
            stance: support
            cooldown_months: 18
      b:
        text:
          english: "Every stream is best judged by its own mill."
          simp_chinese: "溪流如何，自有本乡的水磨来评说。"
        progress_delta: -5
        rationale:
          english: "Returning the petition guards administrative order, but it leaves the local hierarchy to decide whether lowborn talent may so much as be heard."
          simp_chinese: "把请愿交还地方，维护了行政秩序，却也把寒门才智是否有资格被听见，交由地方的等级来裁定。"
        effect_blocks:
          - type: temporary_country_modifier
            key: tv_academy_debate_local_order_preserved
            months: 12
            effects:
              "local administrative calm": 0.03
  - design_id: M10
    pool: meritocracy
    issue: meritocracy
    weight: 1
    title:
      english: "Boycott by Old Families"
      simp_chinese: "旧家族的抵制"
    desc:
      english: "Several great families threaten to withdraw their sons from the Academy should the open rankings proceed, apparently mistaking an empty bench for a winning argument."
      simp_chinese: "几个大族威胁说，若公开排名照旧推行，便让他们的儿子退出学院——仿佛一排空座就等于一条胜过人的论据。"
    options:
      a:
        text:
          english: "We post the rankings and keep the empty benches."
          simp_chinese: "我们照旧张榜，把那几排空座留着。"
        progress_delta: 10
        rationale:
          english: "Allowing the boycott proves that open ranking will not be held hostage to noble attendance, advancing meritocracy sharply at the cost of noble satisfaction."
          simp_chinese: "任其抵制，证明公开排名不会被贵族的出席所要挟，任人唯才大幅推进，代价是贵族满意度的下降。"
        effect_blocks:
          - type: estate_satisfaction
            estate: nobles_estate
            value: -0.06
          - type: seat_stance
            group: nobility
            stance: oppose
            cooldown_months: 18
      b:
        text:
          english: "The Crown suspends the rankings until the great houses return."
          simp_chinese: "王冠暂停排名，直到大族肯回来为止。"
        progress_delta: -10
        rationale:
          english: "Suspending the rankings hands the great families a public victory and steadies their cooperation, but it lets birth grow strong enough to call a halt to evidence."
          simp_chinese: "暂停排名，把一场公开的胜利送给大族，也稳住了他们的配合，却让门第强大到足以叫停证据。"
        effect_blocks:
          - type: estate_satisfaction
            estate: nobles_estate
            value: 0.06
          - type: temporary_country_modifier
            key: tv_academy_debate_rankings_suspended
            months: 12
            effects:
              "elite academy attendance restored": 0.03
  - design_id: M11
    pool: meritocracy
    issue: meritocracy
    weight: 1
    title:
      english: "Examination Fraud"
      simp_chinese: "考试舞弊"
    desc:
      english: "A leaked answer key makes an awkward thing plain: with a heavy enough purse and a steady enough hand, the appearance of merit can be counterfeited outright."
      simp_chinese: "一份泄露的标准答案挑明了一件难堪的事：钱袋够沉、手够稳，所谓才能的模样便能被彻底伪造出来。"
    options:
      a:
        text:
          english: "The Crown clears the whole examining board from their chairs."
          simp_chinese: "王冠把整个考官席位一并清空。"
        progress_delta: 5
        rationale:
          english: "Purging the examiners treats fraud as an institutional threat to measured ability rather than a handful of spoiled papers. The reform gains credibility, though the public upheaval costs stability."
          simp_chinese: "清洗考官队伍，把舞弊当作对能力考核制度的威胁，而非几份坏掉的试卷。改革因此更可信，但公开整顿要消耗社会稳定。"
        effect_blocks:
          - type: resource
            resource: stability
            amount: -1
          - type: seat_stance
            group: scholarly_community
            stance: support
            cooldown_months: 12
      b:
        text:
          english: "We void the worst papers and say nothing of the rest."
          simp_chinese: "我们作废最坏的几份，其余的只字不提。"
        progress_delta: -5
        rationale:
          english: "Voiding only the worst papers contains the scandal and spares the sitting examiners, protecting administrative calm while quietly implying that fraud is tolerable, provided it is hidden well enough."
          simp_chinese: "只作废最坏的几份，把丑闻压在可控之内，也保住了在任的考官，行政秩序得以维持——却也悄悄暗示：只要藏得够好，舞弊便可容忍。"
