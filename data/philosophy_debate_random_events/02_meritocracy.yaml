        text:
          english: "The Crown swears the examiners its protection under seal."
          simp_chinese: "王冠立誓，以印信为考官提供庇护。"
        progress_delta: 10
        rationale:
          english: "Swearing protection makes the examination answer upward to law and Crown rather than sideways to noble reprisal. Meritocracy advances, for examiners may publish unwelcome results without first reckoning the cost in family revenge."
          simp_chinese: "宣誓保护，让考试流程向法律与王冠负责，而非向贵族的报复侧目。任人唯才因此推进，因为考官可以公布不受欢迎的结果，不必先盘算家族复仇的代价。"
        effect_blocks:
          - type: estate_satisfaction
            estate: nobles_estate
            value: -0.05
          - type: seat_stance
            group: court_bureaucrats
            stance: support
            cooldown_months: 24
      b:
        text:
          english: "Better not to wake the great houses."
          simp_chinese: "还是别去惊动那些大族为好。"
