            months: 18
            effects:
              "academy patron confidence": 0.02
  - design_id: M16
    pool: meritocracy
    issue: meritocracy
    weight: 1
    title:
      english: "Veterans' Service Rolls"
      simp_chinese: "老兵服役名册"
    desc:
      english: "Veterans lay their service rolls on the table and ask, plainly, whether long years of disciplined duty count as merit, or merely as a ledger of scars."
      simp_chinese: "老兵们把服役名册摊在桌上，直白地问：多年恪守纪律的效力，究竟算不算功绩，还是只算一本伤疤的账。"
    options:
      a:
        text:
          english: "We enter proven years of service into the reckoning for office."
          simp_chinese: "我们把切实的服役年资，计入任官的权衡。"
        progress_delta: 5
        rationale:
          english: "Counting disciplined service widens merit beyond the examination hall without letting go of evidence. The professional military approves, for long service becomes a legible qualification rather than a sentimental plea."
          simp_chinese: "将严格的服役计入考量，把才能的范围从考场向外拓展，却不放开对证据的要求。职业军人为此赞同，因为长年效力终成一份可读的资格，而不再只是诉诸旧情的恳求。"
        effect_blocks:
          - type: seat_stance
            group: professional_military
            stance: support
            cooldown_months: 18
          - type: temporary_country_modifier
            key: tv_academy_debate_service_rolls
            months: 18
            effects:
              "veteran appointment review": 0.02
      b:
        text:
          english: "The ministries keep the civil rolls and the muster rolls apart."
          simp_chinese: "各部把文职名册与征兵名册分开摆放。"
        progress_delta: -5
        rationale:
          english: "Keeping civil posts separate preserves the bureaucratic claim that offices belong to paperwork, schooling, and court procedure. It slows the meritocratic case by declaring one proven form of service beside the point."
          simp_chinese: "保持文职任命独立，维护了官僚体系的主张：职位当由文书、学业与宫廷程序决定。它宣告一种已被证明的效力无关紧要，从而拖慢任人唯才的推进。"
        effect_blocks:
          - type: seat_stance
            group: court_bureaucrats
            stance: oppose
            cooldown_months: 18
          - type: temporary_country_modifier
            key: tv_academy_debate_civil_posts_separate
            months: 18
            effects:
              "civil appointment regularity": 0.02
  - design_id: M17
    pool: meritocracy
    issue: meritocracy
    weight: 1
    title:
      english: "The Crown's Favorite Fails"
      simp_chinese: "王冠的宠儿失败了"
    desc:
      english: "A candidate dear to the Crown performs wretchedly in a supervised trial, and there are far too many witnesses for the failure to be quietly forgotten."
      simp_chinese: "一名深得王冠喜爱的候选人，在监督试炼中表现糟糕，而见证者实在太多，这场失败无法被悄悄遗忘。"
    options:
      a:
        text:
          english: "Let the mark stand, favorite or no."
          simp_chinese: "分数照算，管他是不是宠儿。"
        progress_delta: 10
        rationale:
          english: "Letting the result stand proves that even royal favor cannot rescue a failed performance. The debate swings sharply toward meritocracy, but the Crown spends legitimacy by allowing its own preference to be overruled in public."
          simp_chinese: "让结果照常生效，证明连王冠的宠信也救不了一场失败的表现。辩论因此大幅倒向任人唯才，但王冠要付出正统性的代价，因为它公开容许自己的偏好被推翻。"
        effect_blocks:
          - type: resource
            resource: legitimacy
            amount: -10
          - type: seat_stance
            group: scholarly_community
            stance: support
            cooldown_months: 18
      b:
        text:
          english: "The Crown orders the favorite a fresh trial and a fresh chance."
          simp_chinese: "王冠为这位宠儿另开一场考核，另给一次机会。"
        progress_delta: -10
        rationale:
          english: "Ordering a second trial tells the court factions that influence can purchase another chance whenever the evidence proves inconvenient. The old patronage logic recovers ground, and the bureaucracy learns exactly which candidates are protected."
          simp_chinese: "命令重新考核，等于告诉宫廷派系：证据一旦碍事，影响力便能换来第二次机会。旧有的庇护逻辑收复失地，官僚体系也看清了哪些候选人受到庇佑。"
        effect_blocks:
          - type: resource
            resource: legitimacy
            amount: 5
          - type: seat_stance
            group: court_bureaucrats
            stance: oppose
