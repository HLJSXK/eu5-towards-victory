            estate: nobles_estate
            value: -0.04
          - type: seat_stance
            group: public_opinion
            stance: support
            cooldown_months: 18
      b:
        text:
          english: "Best settled behind closed doors."
          simp_chinese: "还是关起门来了断为好。"
