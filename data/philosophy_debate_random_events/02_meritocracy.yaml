  - design_id: M15
    pool: meritocracy
    issue: meritocracy
    weight: 1
    title:
      english: "Scholar Demand for Open Chairs"
      simp_chinese: "学者要求公开教席"
    desc:
      english: "The Academy's own scholars demand that its teaching chairs be won in open contest rather than handed down from a patron to whichever protege happened to be standing near him."
      simp_chinese: "学院自己的学者要求，教席应经公开竞争取得，而不是由赞助人随手传给恰好站在身边的哪个门生。"
    options:
      a:
        text:
          english: "The Academy throws its own chairs open to open competition."
          simp_chinese: "学院把自家的教席，摆上公开竞争的擂台。"
        progress_delta: 5
        rationale:
          english: "Opening the chairs turns meritocracy on the Academy itself, proving it will test its own posts before it lectures the realm. Scholars gain support as their careers cease to hang on a patron's goodwill alone."
          simp_chinese: "开放教席，把任人唯才施于学院自身，证明它愿在规劝国家之前先考核自己的职位。学者因此获得支持，因为他们的前途不再只系于赞助人的一念之善。"
        effect_blocks:
          - type: seat_stance
