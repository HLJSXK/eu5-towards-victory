          english: "Burying the investigation shields the patrons from scandal and lets the noble households keep the examination as one more channel of influence. The debate retreats, for merit is permitted to wear borrowed handwriting."
          simp_chinese: "掩埋这场调查，护住了庇护者免于丑闻，也让贵族家族继续把考试当作又一条影响力的渠道。辩论因此倒退，因为所谓才能被允许披上借来的笔迹。"
