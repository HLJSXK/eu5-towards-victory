        progress_delta: 10
        rationale:
          english: "Publicly voiding the papers drags the corruption into the light and declares clean presentation worthless without a clean process. Prestige is spent, for the Academy must confess that its own examination table was compromised."
          simp_chinese: "公开作废这些试卷，把腐败拖到明处，并宣告没有清白的流程，卷面再干净也一文不值。学院必须承认自己的考场已被渗透，因此要付出威望。"
        effect_blocks:
          - type: resource
            resource: prestige
            amount: -10
          - type: seat_stance
            group: scholarly_community
            stance: support
            cooldown_months: 24
      b:
        text:
          english: "Some ledgers are best left unopened."
          simp_chinese: "有些账本，最好永不翻开。"
