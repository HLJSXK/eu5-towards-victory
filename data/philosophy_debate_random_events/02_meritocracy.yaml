      simp_chinese: "省份候选人请求用本乡朴实的行政语言作答，而不必用那套先评人品级、再评人本事的华丽宫廷文体。"
    options:
      a:
        text:
          english: "The board accepts answers written in the plain provincial hand."
          simp_chinese: "评审会接受以朴实省地文字写就的答卷。"
        progress_delta: 5
        rationale:
          english: "Permitting local answers separates competence from courtly polish, letting provincial talent be judged on administration rather than accent. Local communities gain confidence that the door is not reserved for the capital's manners."
          simp_chinese: "允许地方语言作答，把能力与宫廷修饰分开，使省份人才可按行政本领而非口音受评。地方社群因此相信，晋身之门并非只为首都的做派而开。"
        effect_blocks:
          - type: seat_stance
            group: local_autonomy
            stance: support
            cooldown_months: 18
          - type: temporary_country_modifier
            key: tv_academy_debate_local_language_access
            months: 18
            effects:
              "provincial candidate trust": 0.02
      b:
        text:
          english: "We hold every paper to the one court hand."
          simp_chinese: "我们要求每一份答卷都用统一的宫廷文体。"
        progress_delta: -5
        rationale:
          english: "Requiring the court style keeps the standard uniform and comfortable for central officials, but it lets cultivated language sift the candidates before ability is ever allowed to speak plainly."
          simp_chinese: "要求宫廷文体，让标准保持统一，也让中央官员更安心，却让修辞教养在能力得以平白开口之前，就先筛去了人。"
        effect_blocks:
          - type: seat_stance
            group: court_bureaucrats
            stance: oppose
