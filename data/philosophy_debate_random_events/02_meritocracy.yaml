          - type: temporary_country_modifier
            key: tv_academy_debate_open_chair_competition
            months: 24
            effects:
              "academy teaching competition": 0.02
      b:
        text:
          english: "We leave the chairs in the hands that endowed them."
          simp_chinese: "我们把教席留在当初捐立它们的那些手里。"
        progress_delta: -5
        rationale:
          english: "Confirming patron rights reassures those who fund and shield the Academy's posts, but it leaves scholarship tethered to inherited favor rather than open comparison."
          simp_chinese: "确认赞助人权利，安抚了那些资助并庇护学院职位的人，却也让学术继续拴在继承而来的恩惠上，而非公开的比较。"
