random_events:
  - design_id: GT01
    pool: global_trade
    issue: global_trade
    weight: 1
    title:
      english: "Harbor Ledgers"
      simp_chinese: "港口账簿"
    desc:
      english: "Harbor clerks unroll ledgers of salt, silk, spice, freight, and insurance across the Academy table, one column crowding the next. Every figure insists that distant prices already govern the realm, whatever landed honor pretends not to smell."
      simp_chinese: "港口书记员把盐、丝绸、香料、运费与保险的账簿一列挨一列铺满学院长桌。每一个数字都在申辩：远方的价格早已管着这个国家，无论土地上的荣誉如何假装闻不到那股气味。"
    options:
      a:
        text:
          english: "The clerks read every column aloud to the full table."
          simp_chinese: "书记员把每一列数字念给满座听。"
        progress_delta: 10
        rationale:
          english: "Read aloud, the columns stop being tavern rumor and become evidence a burgher can cite. Merchant and maritime voices now argue from the record itself, and the room leans sharply toward the world it can no longer un-hear."
          simp_chinese: "一旦念出声，这些数字就不再是酒馆传闻，而成了市民能引用的证据。市民与海商如今凭记录发言，会场也就明显倒向那个再也装不了聋的世界。"
        effect_blocks:
          - type: estate_satisfaction
            estate: burghers_estate
            value: 0.04
          - type: seat_stance
            group: maritime_merchants
            stance: support
            cooldown_months: 18
      b:
        text:
          english: "We call it merchant arithmetic, and turn the page."
          simp_chinese: "我们斥之为商人的算术，翻过这一页。"
        progress_delta: -10
        rationale:
          english: "Waving off the figures restores land and lineage above the counting-house, which the nobles receive gratefully. Yet it also trains the hall to deny the very arithmetic that proves distant trade has already arrived."
          simp_chinese: "斥退这些数字，土地与门第便重新压过账房，贵族欣然领受。可这也等于教会会场，去否认那套早已证明远方贸易到场的算术。"
        effect_blocks:
          - type: estate_satisfaction
            estate: nobles_estate
            value: 0.04
          - type: seat_stance
            group: nobility
            stance: oppose
            cooldown_months: 18

  - design_id: GT02
    pool: global_trade
    issue: global_trade
    weight: 1
    title:
      english: "Foreign Merchant Quarter"
      simp_chinese: "外商馆区"
    desc:
      english: "Foreign merchants ask for warehouses, lodging, and watchmen of their own beside the harbor. The request sounds merely practical, until the room realizes it would give distant markets a permanent address, a doorplate, and quite possibly better locks than the Crown's."
      simp_chinese: "外国商人请求在港口旁拥有仓库、住所，还有自己的守卫。这要求听着不过是务实之举——直到众人回过神来：它会让远方市场在境内落下固定地址、挂上门牌，说不定连锁都比王室的更结实。"
    options:
      a:
        text:
          english: "The Crown grants the quarter its warehouses and its guards."
          simp_chinese: "王室准许商馆区拥有仓库与守卫。"
        progress_delta: 10
        rationale:
          english: "Granting the quarter concedes that world trade needs standing institutions, contracts under guard, and foreign hands one can trust. It carries the issue far forward, while handing foreign powers a visible door into the debate."
          simp_chinese: "准许商馆区，等于承认全球贸易需要常设机构、有守卫护着的契约，以及可以信赖的外国中介。这会把议题大步推进，同时给外国势力留下一扇通向辩论的显眼大门。"
        effect_blocks:
          - type: seat_stance
            group: foreign_power
            stance: support
            cooldown_months: 24
          - type: foreign_prestige
            amount: 5
      b:
        text:
          english: "Guests at the wharf, never partners in it."
          simp_chinese: "码头上的客人，绝非码头的伙伴。"
        progress_delta: -5
        rationale:
          english: "Refusing special rights guards local guild custom and pens in foreign influence, but it announces that international merchants may trade as guests only, never as partners in a new order."
          simp_chinese: "拒绝特殊权利，护住了本地行会习俗，也圈住了外国影响；但这也宣告：国际商人只能以客人身份经商，永远做不了新秩序里的伙伴。"
        effect_blocks:
          - type: estate_satisfaction
            estate: burghers_estate
            value: 0.03
          - type: seat_stance
            group: local_autonomy
            stance: oppose
            cooldown_months: 12

  - design_id: GT03
    pool: global_trade
    issue: global_trade
    weight: 1
    title:
      english: "Tariff Confusion"
      simp_chinese: "关税混乱"
    desc:
      english: "A customs review turns up duties so tangled that profitable cargo is punished by accident while favored goods drift through by habit. The schedule has become a policy quarrel written entirely in crossed-out numbers."
      simp_chinese: "一场海关审查翻出纠缠不清的税目：有利可图的货物被莫名其妙地惩罚，受偏爱的商品却凭习惯一路放行。整张税表，已经成了一场写满划线数字的政策争吵。"
    options:
      a:
        text:
          english: "We cut the schedule down to rules a merchant can read."
          simp_chinese: "我们把税目删减成商人看得懂的规则。"
        progress_delta: 10
        rationale:
          english: "Cutting the schedule down turns world trade from accidental privilege into a system one can actually read. Merchants can plan against clear rules, which strengthens acceptance, even as the old customs rents quietly dry up."
          simp_chinese: "把税目删减下来，全球贸易便从偶然的特权变成一套读得懂的制度。商人能依着清晰规则筹划，接受倾向随之增强，尽管旧日的海关租利也悄悄枯竭。"
        effect_blocks:
          - type: seat_stance
            group: maritime_merchants
            stance: support
            cooldown_months: 18
          - type: temporary_country_modifier
            key: tv_academy_debate_simplified_tariffs
            months: 24
            effects:
              "old customs rents curtailed": -0.02
      b:
        text:
          english: "A familiar tangle is safer than a strange order."
          simp_chinese: "熟悉的乱麻，好过陌生的秩序。"
        progress_delta: -5
        rationale:
          english: "Keeping the schedule preserves the habits, and the quiet rents, of cautious officials. It slows acceptance by treating confusion as a tolerable toll paid for control."
          simp_chinese: "保留原有税目，护住了谨慎官员的习惯，也护住了那笔安静的租利。它把混乱当作换取掌控的合理过路费，因而拖慢了接受的脚步。"
        effect_blocks:
          - type: resource
            resource: gold
            scale: 1
          - type: seat_stance
            group: court_bureaucrats
            stance: oppose
            cooldown_months: 18

  - design_id: GT04
    pool: global_trade
    issue: global_trade
    weight: 1
    title:
      english: "Spice Cargo"
      simp_chinese: "香料货物"
    desc:
      english: "A spice cargo is broached before the Academy, and the room fills with a scent no inland tax register has ever managed to record. All at once the distant islands feel less like rumor and more like an argument that has turned up wearing cinnamon."
      simp_chinese: "一批香料在学院面前开箱，室内顿时弥漫起内陆税册从未记录在案的气味。遥远的岛屿一下子不再像传闻，倒像一场沾着肉桂香、径直登门的论证。"
    options:
      a:
        text:
          english: "The cargo is opened where every nose in the hall can judge it."
          simp_chinese: "货物就在满堂鼻子都能评判的地方开箱。"
        progress_delta: 5
        rationale:
          english: "Opening the cargo lets ordinary onlookers feel the pull of distant exchange in their own hands. The gain is only moderate, for spectacle stirs curiosity far more readily than it settles policy."
          simp_chinese: "当众开箱，让普通旁听者亲手掂量远方交换的诱惑。推进却只是中等——奇观最擅长撩起好奇，却最不擅长平息政策之争。"
        effect_blocks:
          - type: seat_stance
            group: public_opinion
            stance: support
            cooldown_months: 12
          - type: seat_stance
            group: maritime_merchants
            stance: support
            cooldown_months: 12
      b:
        text:
          english: "We put it to tax before it can testify."
          simp_chinese: "趁它开口作证之前，我们先给它上税。"
        progress_delta: -5
        rationale:
          english: "Taxing it quietly converts the cargo into revenue before it can become public proof of world trade. The treasury is the richer for it, but the debate loses a vivid chance to make the wider economy feel real."
          simp_chinese: "悄悄征税，会在这批货成为全球贸易的公共证据之前，先把它折成财政收入。国库因此更充盈，辩论却错过了一次让世界经济变得可触可感的良机。"
        effect_blocks:
          - type: resource
            resource: gold
            scale: 1
          - type: seat_cooldown
            group: public_opinion
            cooldown_months: 12

  - design_id: GT05
    pool: global_trade
    issue: global_trade
    weight: 1
    title:
      english: "Port Nobles Object"
      simp_chinese: "港口遭贵族反对"
    desc:
      english: "Inland nobles warn that ocean trade is teaching the realm to bow to warehouses instead of fields. Their speeches arrive polished, wounded, and wholly convinced that wealth ought still to smell of turned earth."
      simp_chinese: "内陆贵族警告说，海洋贸易正教这个国家向仓库低头，而非向田地。他们的演说打磨光洁、满含委屈，且笃信不疑：财富到底该带着翻耕过的泥土味。"
    options:
      a:
        text:
          english: "We answer that a full warehouse honors the realm no less than a field."
          simp_chinese: "我们回敬一句：满仓与良田，一样为国增光。"
        progress_delta: 10
        rationale:
          english: "Answering the nobles head-on breaks the old assumption that only land can honorably underwrite policy. World trade gains ground as maritime profit is defended, out loud, as legitimate strength of the realm."
          simp_chinese: "正面回敬贵族，打破了唯有土地才配体面地支撑政策的旧成见。海上利润被公开辩护为国家的正当力量，全球贸易也就随之得势。"
        effect_blocks:
          - type: estate_satisfaction
            estate: nobles_estate
            value: -0.05
          - type: seat_stance
            group: maritime_merchants
            stance: support
            cooldown_months: 18
      b:
        text:
          english: "The chair reassures the landed benches that fields come first."
          simp_chinese: "主席向拥有田产的诸位保证，田地仍居首位。"
        progress_delta: -10
        rationale:
          english: "Reassuring landed privilege shields noble standing by casting harbor wealth as secondary and dependent. The debate turns sharply from acceptance, since the old hierarchy is left to define the new economy."
          simp_chinese: "安抚土地特权，是把港口财富说成次要且依附之物，从而护住贵族地位。旧等级得以界定新经济，辩论便明显偏离了接受。"
        effect_blocks:
          - type: estate_satisfaction
            estate: nobles_estate
            value: 0.05
          - type: seat_stance
            group: nobility
            stance: oppose
            cooldown_months: 24

  - design_id: GT06
    pool: global_trade
    issue: global_trade
    weight: 1
    title:
      english: "Insurance for Ships"
      simp_chinese: "船舶保险"
    desc:
      english: "Merchants lay storm accounts, wreck inventories, and survivors' statements before the Academy. Their argument is blunt as a bosun: a realm that would share distant profit must first learn to share distant loss."
      simp_chinese: "商人把风暴记录、沉船清单和幸存者证词摆到学院面前。他们的论点像水手长一样直白：一个想分享远洋利润的国家，得先学会分担远洋的损失。"
    options:
      a:
        text:
          english: "The Academy enters maritime insurance into the record."
          simp_chinese: "学院将海运保险载入正式记录。"
        progress_delta: 10
        rationale:
          english: "Entering maritime insurance into the record turns world trade from a reckless wager into a disciplined pooling of risk, and makes acceptance easier for anyone who has ever feared sudden ruin."
          simp_chinese: "把海运保险载入记录，会将全球贸易从鲁莽的赌注变成有章可循的共同分险，让每一个惧怕一夜破产的人都更容易点头。"
        effect_blocks:
          - type: seat_stance
            group: burghers
            stance: support
            cooldown_months: 18
          - type: temporary_country_modifier
            key: tv_academy_debate_maritime_insurance_pool
            months: 24
            effects:
              "shared voyage-loss risk": 0.03
      b:
        text:
          english: "Every man drowns on his own account."
          simp_chinese: "各人淹死，各人认命。"
        progress_delta: -5
        rationale:
          english: "Treating shipwreck as private misfortune comforts the moralists who mistrust speculative contracts, but it leaves overseas commerce looking fragile and ruinous to any single house that dares it."
          simp_chinese: "把海难当作私人的不幸，能安抚那些不信投机契约的道德家；却也让远洋贸易显得脆弱不堪，足以拖垮任何一个胆敢涉足的家族。"
        effect_blocks:
          - type: estate_satisfaction
            estate: clergy_estate
            value: 0.02
          - type: seat_stance
            group: clergy
            stance: oppose
            cooldown_months: 12

  - design_id: GT07
    pool: global_trade
    issue: global_trade
    weight: 1
    title:
      english: "Smuggler's Map"
      simp_chinese: "走私者的地图"
    desc:
      english: "A seized map marks coves, warehouses, quiet roads, and trusted signals with more diligence than any customs register ever mustered. The illegal network is a great embarrassment, chiefly because it works."
      simp_chinese: "一张缴获的地图把海湾、仓库、僻静小路和可信暗号标得一丝不苟，比任何海关簿册都上心。这个非法网络叫人难堪，难堪之处正在于——它真的管用。"
    options:
      a:
        text:
          english: "The clerks redraw the legal routes to match the smugglers' craft."
          simp_chinese: "书记员照走私者的门道，重画合法商路。"
        progress_delta: 10
        rationale:
          english: "Redrawing the legal routes admits that trade will find its efficient channels with or without a stamp. The debate shifts toward acceptance, for the state chooses to study the network rather than pretend it away."
          simp_chinese: "照着重画合法商路，等于承认贸易无论有没有官府印章，都会自寻高效的通道。国家选择研究这个网络，而非假装它不存在，辩论也就转向接受。"
        effect_blocks:
          - type: seat_stance
            group: maritime_merchants
            stance: support
            cooldown_months: 24
          - type: seat_stance
            group: court_bureaucrats
            stance: oppose
            cooldown_months: 12
      b:
        text:
          english: "Into the fire with it."
          simp_chinese: "一把火烧了它。"
        progress_delta: -10
        rationale:
          english: "Into the fire it goes, preserving the old customs order and denying the smugglers any victory of ideas. It also burns the evidence that the lawful routes have grown less sensible than the outlaw ones."
          simp_chinese: "一把火烧了它，旧海关秩序得以保全，也不让走私者在道理上占先。可这同样烧掉了一份证据：合法商路，早已不如那些非法商路来得合理。"
        effect_blocks:
          - type: seat_cooldown
            group: maritime_merchants
            cooldown_months: 18
          - type: temporary_country_modifier
            key: tv_academy_debate_old_customs_controls
            months: 18
            effects:
              "customs gatekeeping preserved": 0.02

  - design_id: GT08
    pool: global_trade
    issue: global_trade
    weight: 1
    title:
      english: "Dock Labor Strike"
      simp_chinese: "码头劳工罢工"
    desc:
      english: "Dockworkers still the cranes, ropes, carts, and shouting that make trade look effortless from inside a council chamber. They put one plain question to the Academy: why should widening commerce make every wage feel smaller?"
      simp_chinese: "码头工人叫停了吊机、绳索、货车和喧嚷——正是这些让贸易在议事厅里显得毫不费力。他们向学院抛出一个朴素的问题：为什么商业越是扩张，每一份工钱反倒越显得单薄？"
    options:
      a:
        text:
          english: "The council bargains a set of protections for the docks."
          simp_chinese: "议事会为码头谈定一套劳工保护。"
        progress_delta: 5
        rationale:
          english: "Bargaining protections shows that world trade can be accepted without pretending its labor is invisible. The gain is moderate: compromise steadies support at the cost of some merchant enthusiasm."
          simp_chinese: "谈定保护，表明接受全球贸易不必假装劳工不存在。收益只是中等——妥协稳住了支持，却也磨掉了商人的一部分热情。"
        effect_blocks:
          - type: estate_satisfaction
            estate: peasants_estate
            value: 0.04
          - type: seat_stance
            group: peasants
            stance: support
            cooldown_months: 18
      b:
        text:
          english: "We clear the quays and set the cranes moving again."
          simp_chinese: "我们清空码头，让吊机重新转起来。"
        progress_delta: -5
        rationale:
          english: "Clearing the quays gets the docks moving and pleases the merchants, but it hands opponents a tidy line: world trade, they will say, grows by silencing the very hands that carry it."
          simp_chinese: "清空码头，货运恢复了，商人也高兴；却给了反对者一句现成的说辞：他们会说，全球贸易的扩张，靠的是让搬运它的那双手闭嘴。"
        effect_blocks:
          - type: estate_satisfaction
            estate: burghers_estate
            value: 0.03
          - type: seat_stance
            group: peasants
            stance: oppose
            cooldown_months: 18

  - design_id: GT09
    pool: global_trade
    issue: global_trade
    weight: 1
    title:
      english: "Rival Trade Embassy"
      simp_chinese: "敌手的贸易使团"
    desc:
      english: "A rival court sends merchants bearing gifts, draft contracts, and compliments buffed until they very nearly pass for friendship. Every offer carries the faint, familiar scent of opportunity mixed with leverage."
      simp_chinese: "一个敌对宫廷派来商人，携着礼物、契约草案和一番打磨到几乎能冒充友谊的恭维。每一项提议都飘着那股熟悉的淡淡气味——机会里掺着牵制。"
    options:
      a:
        text:
          english: "The rival envoys are received in the open hall."
          simp_chinese: "敌手的使节在敞开的大厅里被接待。"
        progress_delta: 5
        rationale:
          english: "Receiving the envoys in open hall treats world trade as diplomacy conducted by contract as much as by envoy. The gain is modest, for closer contact opens opportunity even as it lets a rival's influence into the room."
          simp_chinese: "在敞开的大厅接待使节，是把全球贸易当作既凭契约、也凭使节进行的外交。收益有限，因为更近的往来在带来机会的同时，也把敌手的影响放进了会场。"
        effect_blocks:
          - type: seat_stance
            group: foreign_power
            stance: support
            cooldown_months: 18
          - type: temporary_country_modifier
            key: tv_academy_debate_trade_embassy_reception
            months: 18
            effects:
              "rival contract channels opened": 0.02
      b:
        text:
          english: "Courtesy at the gate, and no farther."
          simp_chinese: "礼数止于门口，不许再进。"
        progress_delta: -5
        rationale:
          english: "Courtesy at the gate reassures protectionists that no foreign merchant will write policy by smiling at it. It also narrows the Academy's case for trade into something more guarded, and more suspicious of exchange."
          simp_chinese: "礼数止于门口，能让保护主义者安心：没有哪个外国商人能靠一张笑脸写出政策来。可这也把学院的贸易论证收窄成一套更设防、更疑心交流的说辞。"
        effect_blocks:
          - type: seat_stance
            group: local_autonomy
            stance: oppose
            cooldown_months: 18
          - type: seat_stance
            group: foreign_power
            stance: oppose
            cooldown_months: 12

  - design_id: GT10
    pool: global_trade
    issue: global_trade
    weight: 1
    title:
      english: "Standard Weights"
      simp_chinese: "标准度量衡"
    desc:
      english: "Traders arrive with scales, stones, stamped bars, and accusations enough to fill half the market towns in the realm. Fraud here has grown so local that men now defend it as tradition."
      simp_chinese: "商人带着天平、砝码、打印过的金属条，以及足以填满半数集镇的相互控诉走进学院。此地的欺诈已经地方化到这般地步——人们竟以\"传统\"之名替它辩护。"
    options:
      a:
        text:
          english: "The traders' scales give way to one standard across the realm."
          simp_chinese: "商人的各式天平，让位于全国统一的标准。"
        progress_delta: 10
        rationale:
          english: "One standard across the realm makes distant markets comparable and enforceable, so world trade appears a lawful system rather than a chain of local sleights. Clerks and merchants alike inherit a shared language of measure."
          simp_chinese: "全国一套标准，让远方市场变得可比较、可执行，全球贸易于是显得是一套法度，而非一连串地方把戏。官吏与商人也一同得到了共通的计量语言。"
        effect_blocks:
          - type: seat_stance
            group: court_bureaucrats
            stance: support
            cooldown_months: 18
          - type: estate_satisfaction
            estate: burghers_estate
            value: 0.03
          - type: temporary_country_modifier
            key: tv_academy_debate_standard_weights
            months: 24
            effects:
              "market measurement fraud reduced": 0.03
      b:
        text:
          english: "Every town keeps its own measure."
          simp_chinese: "各镇自守其秤。"
        progress_delta: -10
        rationale:
