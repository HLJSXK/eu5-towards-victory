        progress_delta: -5
        rationale:
          english: "Letting merchants self-insure keeps state spending low and leaves ocean risk in private hands. The debate retreats because the Crown refuses to treat global trade protection as a public responsibility."
          simp_chinese: "让商人自行投保，可以维持较低的国家开支，并把海上风险留在私人手中。辩论因此后退，因为王冠拒绝把全球贸易保护视为公共责任。"
