          simp_chinese: "各镇自守其秤，护住了各地市场的惯例，也让每个城镇把熟悉的欺诈藏在熟悉的名号下。这大大削弱了接受，因为没有共通的度量，全球贸易根本无从铺展。"
        effect_blocks:
