          simp_chinese: "账桌嘛，还是留在自家吧。"
        progress_delta: -5
        rationale:
          english: "Leaving the counting-table in the family shields guild elders and merchant houses from public standards. The debate slips backward, for trade knowledge stays a private inheritance rather than a shared tool of world commerce."
          simp_chinese: "把账桌留在自家，护住了行会长老与商人家族，免受公共标准的约束。辩论因此倒退，因为贸易知识仍是私人的传家物，而非全球商业共享的工具。"
        effect_blocks:
