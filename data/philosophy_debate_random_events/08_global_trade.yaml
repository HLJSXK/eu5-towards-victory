  - design_id: GT13
    pool: global_trade
    issue: global_trade
    weight: 1
    title:
      english: "Export Panic"
      simp_chinese: "出口恐慌"
    desc:
      english: "A poor harvest makes every export look like treason to a hungry town. Merchants insist their contracts keep tomorrow's grain moving; the crowd at the door wants to know why tomorrow's trust should outrank tonight's bread."
      simp_chinese: "一场歉收，让饥饿的城镇把每一船出口都看成叛国。商人坚称他们的契约能让明天的粮食继续流通，门口的人群却想弄明白：凭什么明天的信用，要压过今晚的面包？"
    options:
      a:
        text:
          english: "The grain keeps moving, under a watchful eye."
          simp_chinese: "粮食继续流通，只是多了一双盯着的眼睛。"
        progress_delta: 5
        rationale:
          english: "Letting the grain move under supervision makes acceptance conditional on visible restraint. The advance is slight, for the policy keeps world exchange alive while public order must swallow the anger of hungry towns."
          simp_chinese: "让粮食在监管下继续流通，等于把接受全球贸易系在可见的克制之上。推进有限，因为政策保住了世界交换，却要由公共秩序去咽下饥饿城镇的怒火。"
        effect_blocks:
          - type: resource
            resource: stability
            amount: -1
          - type: seat_stance
            group: maritime_merchants
            stance: support
            cooldown_months: 12
      b:
        text:
          english: "We bar the export gates until the fields recover."
          simp_chinese: "我们关上出口的闸门，等田地缓过气来。"
        progress_delta: -10
        rationale:
          english: "Barring the gates lets tonight's scarcity condemn the whole principle of world trade. Public anger cools, but the debate swings sharply toward rejection, since markets are cast as the danger the moment food runs short."
          simp_chinese: "关上闸门，让今晚的短缺给整个全球贸易原则定了罪。民愤平息了，辩论却猛地转向拒绝——粮食一紧，市场就被说成了祸根本身。"
        effect_blocks:
          - type: estate_satisfaction
            estate: peasants_estate
            value: 0.04
          - type: seat_stance
            group: public_opinion
            stance: oppose
            cooldown_months: 18

  - design_id: GT14
    pool: global_trade
    issue: global_trade
    weight: 1
    title:
      english: "Port Quarantine"
      simp_chinese: "港口检疫"
    desc:
      english: "Quarantine officials slow the trade and offer survival as their defense. Merchants call each delay a lost season; the physicians answer that the busiest harbor in the world is worthless if it lands the next funeral."
      simp_chinese: "检疫官员拖慢贸易，并以\"活命\"作辩护。商人说每一次延误都是失去一整季，医师则回敬：若港口卸下的下一批货是葬礼，全世界最忙的码头也一文不值。"
    options:
      a:
        text:
          english: "Inspectors are trained to keep the harbor open and clean at once."
          simp_chinese: "检疫官受训，让港口既开着又干净。"
        progress_delta: 5
        rationale:
          english: "Training the inspectors argues that world trade can be made safer without shutting the harbor. Acceptance rises modestly as a practical objection falls away, and the treasury pays for the capacity to look closely."
          simp_chinese: "训练检疫官，是在主张全球贸易可以在不关港的前提下更安全。一个实际的反对理由就此消失，接受度小幅上升，而细看货物的能力则要国库付账。"
        effect_blocks:
          - type: resource
            resource: gold
            scale: -1
          - type: temporary_country_modifier
            key: tv_academy_debate_quarantine_reform
            months: 18
            effects:
              "health inspection capacity": 0.03
      b:
        text:
          english: "We turn the foreign hulls away at the mole."
          simp_chinese: "我们把外国船只挡在防波堤外。"
        progress_delta: -5
        rationale:
          english: "Turning the foreign hulls away makes safety visible by pinching the flow of trade. The debate loses ground, for foreign exchange is treated as the illness itself, even as the public applauds a harbor acting decisively."
          simp_chinese: "把外国船挡在堤外，靠掐紧货流来把安全感做给人看。辩论因此失分，因为外国交换被当成病症本身——哪怕民众正为港口的果断鼓掌。"
        effect_blocks:
          - type: seat_stance
            group: public_opinion
            stance: oppose
            cooldown_months: 12
          - type: temporary_country_modifier
            key: tv_academy_debate_visible_port_closure
            months: 12
            effects:
              "visible disease precautions": 0.02

  - design_id: GT15
    pool: global_trade
    issue: global_trade
    weight: 1
    title:
      english: "Naval Escort Debate"
      simp_chinese: "海军护航之辩"
    desc:
      english: "Merchants demand escorts and admirals demand funds, a match no one has ever called cheap. The Academy hears a simple question dressed in expensive clothes: if trade is now global, must the state guard every horizon it profits from?"
      simp_chinese: "商人要护航，将领要拨款，这门亲事从没人说它便宜。学院听见一个穿着华服的简单问题：既然贸易已然全球化，国家是否非得守卫每一条为它带来利润的天际线？"
    options:
      a:
        text:
          english: "The Crown funds escorts for every profitable horizon."
          simp_chinese: "王室为每一条有利可图的天际线出资护航。"
        progress_delta: 10
        rationale:
          english: "Funding the escorts makes world trade a strategic project the Crown stands behind, not a private gamble. Acceptance rises sharply as distant commerce is visibly protected, though the treasury groans and the sea-merchants sink deeper into the debate."
          simp_chinese: "出资护航，把全球贸易变成王室背书的战略事业，而非私人的赌博。远方商业被明明白白地护住，接受度陡升，只是国库呻吟，海商也就此陷得更深。"
        effect_blocks:
          - type: resource
            resource: gold
            scale: -2
          - type: seat_stance
            group: maritime_merchants
            stance: support
            cooldown_months: 24
          - type: temporary_country_modifier
            key: tv_academy_debate_funded_trade_escorts
            months: 24
            effects:
              "protected shipping confidence": 0.04
      b:
        text:
          english: "The sea insures no one."
          simp_chinese: "大海从不为谁保险。"
        progress_delta: -5
        rationale:
          english: "Leaving merchants to insure themselves keeps state coin in the vault and ocean risk in private hands. The debate retreats, for the Crown declines to treat the guarding of world trade as any public duty of its own."
          simp_chinese: "让商人自行投保，把国库的银钱留在库里，也把海上风险留在私人手中。辩论因此后退，因为王室拒绝把守护全球贸易当作自己的一份公共职责。"
        effect_blocks:
          - type: resource
            resource: gold
            scale: 1
          - type: seat_stance
            group: professional_military
            stance: oppose
            cooldown_months: 18

  - design_id: GT16
    pool: global_trade
    issue: global_trade
    weight: 1
    title:
      english: "Guild Monopoly Challenge"
      simp_chinese: "行会垄断挑战"
    desc:
      english: "Overseas traders lay their contracts beside the city guild charters and call the old monopolies beautiful chains. The masters bristle, though the younger merchants can already hear distant markets rattling the locks."
      simp_chinese: "海外贸易商把契约摆在城市行会特许状旁边，称那些旧垄断不过是精美的锁链。行会大师们怒发上冲，可年轻商人早已听见远方市场，正在撼动那些锁扣。"
    options:
      a:
        text:
          english: "We strike the locks off the old monopoly."
          simp_chinese: "我们把旧垄断上的锁一并砸开。"
        progress_delta: 10
        rationale:
          english: "Striking off the locks makes world trade a true reshuffling of market power, not merely more hulls at the quay. It advances acceptance by taking the side of overseas exchange against inherited urban privilege."
          simp_chinese: "砸开这些锁，让全球贸易成为对市场权力的真正重排，而不只是码头上多了几条船。它站在海外交换一边，对抗世代承袭的城市特权，从而推动接受。"
        effect_blocks:
          - type: estate_satisfaction
            estate: burghers_estate
            value: -0.04
          - type: seat_stance
            group: maritime_merchants
            stance: support
            cooldown_months: 24
      b:
        text:
          english: "The masters keep their charters intact."
          simp_chinese: "行会大师们的特许状原封不动。"
        progress_delta: -10
        rationale:
          english: "Leaving the charters intact reassures the old masters that commerce will stay disciplined by local custom. But it teaches the debate a hard lesson: world exchange must bow before corporate right."
          simp_chinese: "特许状原封不动，安抚了旧日大师：商业仍将受本地习惯的约束。可这也给辩论上了狠狠一课——全球交换，必须向团体权利低头。"
        effect_blocks:
          - type: estate_satisfaction
            estate: burghers_estate
            value: 0.03
          - type: seat_stance
            group: maritime_merchants
            stance: oppose
            cooldown_months: 18

  - design_id: GT17
    pool: global_trade
    issue: global_trade
    weight: 1
    title:
      english: "Language of Contracts"
      simp_chinese: "契约语言"
    desc:
      english: "Translators bring three versions of the same trade contract to the Academy, and only one of them would have saved the cargo. The room learns, a little late, that a fortune can drown inside a single ambiguous clause."
      simp_chinese: "译员把同一份贸易契约的三种文本带到学院，其中只有一种，本可以保住那批货。众人这才后知后觉地明白：一笔财富，足以淹死在一个含混的条款里。"
    options:
      a:
        text:
          english: "The Academy fixes one wording for every contract."
          simp_chinese: "学院为每一份契约定下统一的措辞。"
        progress_delta: 5
        rationale:
          english: "Fixing one wording turns world trade into a shared legal and scholarly discipline. Merchants gain clearer instruments, and the scholars prove that a careful clause can guard a cargo as surely as any escort."
          simp_chinese: "定下统一措辞，把全球贸易变成一门共通的法律与学术规范。商人得到更清晰的工具，学者也证明了：一个措辞谨慎的条款，护货之力不亚于一队护航。"
        effect_blocks:
          - type: seat_stance
            group: scholarly_community
            stance: support
            cooldown_months: 12
          - type: seat_stance
            group: maritime_merchants
            stance: support
            cooldown_months: 12
      b:
        text:
          english: "Let each market keep its own tongue."
          simp_chinese: "各市场自说其言。"
        progress_delta: -5
        rationale:
          english: "Letting each market keep its own tongue preserves a familiar authority in every port. But it leaves long-distance exchange at the mercy of mistranslation, and keeps the whole question stubbornly provincial."
          simp_chinese: "各市场自说其言，保住了每座港口熟悉的权威。可这也让远距离交换任由误译摆布，把整个议题死死按在地方的层面上。"
        effect_blocks:
          - type: seat_stance
            group: local_autonomy
            stance: oppose
            cooldown_months: 12
          - type: temporary_country_modifier
            key: tv_academy_debate_local_contract_forms
            months: 18
            effects:
              "local legal custom preserved": 0.02

  - design_id: GT18
    pool: global_trade
    issue: global_trade
    weight: 1
    title:
      english: "Distant Price Shock"
      simp_chinese: "远方价格震荡"
    desc:
      english: "Word arrives that a price has shifted abroad, and local plans collapse before the officials can finish insisting that foreign markets are far away. The Academy hears the distance between ports shrink until it fits inside a single number."
      simp_chinese: "海外价格变动的消息传来，本地的安排竟在官员还没说完\"外国市场远着呢\"之前就已塌了。学院听见港口之间的距离一路收缩，直到能塞进一个数字里。"
    options:
      a:
        text:
          english: "We admit that distant prices now steer us."
          simp_chinese: "我们承认，远方的价格如今在替我们掌舵。"
        progress_delta: 10
        rationale:
          english: "Admitting the exposure concedes the very heart of world trade: distant prices now steer local policy. The debate moves forward as denial gives way to adaptation, however much the adjustment stings."
          simp_chinese: "承认这份风险，等于认下全球贸易的核心：远方的价格如今在替本地政策掌舵。以适应取代否认，辩论向前迈进，哪怕这番调整刺得人生疼。"
        effect_blocks:
          - type: resource
            resource: stability
            amount: -1
          - type: seat_stance
            group: maritime_merchants
            stance: support
            cooldown_months: 18
      b:
        text:
          english: "Blame the speculators, naturally."
          simp_chinese: "怪投机者，自然是怪投机者。"
        progress_delta: -10
        rationale:
          english: "Blaming the speculators hands the anger a convenient target and dresses the shock as misconduct rather than interdependence. It shields the old argument by refusing, once again, to learn anything from a price."
          simp_chinese: "怪罪投机者，给怒气递上一个现成的靶子，把这场震荡装扮成恶行，而非相互依赖。它拒绝再一次从价格里学到东西，从而护住了旧论点。"
        effect_blocks:
          - type: resource
            resource: stability
            amount: 1
          - type: seat_stance
            group: public_opinion
            stance: oppose
            cooldown_months: 18

  - design_id: GT19
    pool: global_trade
    issue: global_trade
    weight: 1
    title:
      english: "Free Port Proposal"
      simp_chinese: "自由港提案"
    desc:
      english: "Reformers sketch a harbor where the Crown taxes movement instead of throttling it at every gate. The customs men call it reckless; the merchants call it the first honest map of how goods have been moving all along."
      simp_chinese: "改革者勾勒出这样一座港口：王室不再在每道关卡扼住货流，而是向流动本身征税。海关官员斥之为鲁莽，商人却说，这才是货物一直以来如何流动的第一张诚实地图。"
    options:
      a:
        text:
          english: "The Crown charters the free port."
          simp_chinese: "王室特许设立自由港。"
        progress_delta: 10
        rationale:
          english: "Chartering the free port makes the Crown an organizer of world movement rather than a toll-keeper at inherited chokepoints. Acceptance advances strongly, and the protectionists who live off the old barriers are furious."
          simp_chinese: "特许自由港，让王室从旧瓶颈处的收费人，变成全球流动的组织者。接受度强力推进，而那些靠旧壁垒过活的保护主义者，则暴跳如雷。"
        effect_blocks:
          - type: seat_stance
            group: maritime_merchants
            stance: support
            cooldown_months: 24
          - type: estate_satisfaction
            estate: burghers_estate
            value: -0.03
      b:
        text:
          english: "We reject the experiment and keep the gates."
          simp_chinese: "我们否掉这场试验，把关卡留着。"
        progress_delta: -10
        rationale:
          english: "Rejecting the experiment keeps the customs houses predictable and protects the officials who know every gate by name. But it frames world trade as a danger to be penned in, rather than a flow to be governed."
          simp_chinese: "否掉这场试验，海关体系照旧可预期，也护住了那些叫得出每道关卡名字的官员。可它把全球贸易描画成需要围堵的危险，而非需要治理的流动。"
        effect_blocks:
          - type: seat_stance
            group: court_bureaucrats
            stance: oppose
            cooldown_months: 18
          - type: temporary_country_modifier
            key: tv_academy_debate_customs_house_routine
            months: 18
            effects:
              "customs routine preserved": 0.02

  - design_id: GT20
    pool: global_trade
    issue: global_trade
    weight: 1
    title:
      english: "Map of Trade Winds"
      simp_chinese: "贸易风向图"
    desc:
      english: "Navigators unroll wind charts across the Academy table, and the old routes suddenly look less like tradition than superstition under sail. Even the captains who scoff cannot stop stealing glances at the lines."
      simp_chinese: "航海者在学院桌上展开风向图，旧航线忽然不再像传统，倒像一门扬着帆的迷信。连出声讥笑的船长，也忍不住一次次偷瞄那些线条。"
    options:
      a:
        text:
          english: "We set our sails by the charts, not by habit."
          simp_chinese: "我们照图行船，不再凭老习惯。"
