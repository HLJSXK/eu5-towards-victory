      simp_chinese: "海军护航之辩"
    desc:
      english: "Merchants demand escorts and admirals demand funds, a partnership no one calls cheap. The Academy hears a simple question in expensive clothing: if trade is now global, must the state guard every horizon it profits from?"
      simp_chinese: "商人要求护航，海军将领要求拨款，这种合作没人会称之为便宜。学院听见了一个穿着昂贵外衣的简单问题：如果贸易已经走向全球，国家是否必须守卫每一条让它获利的天际线？"
