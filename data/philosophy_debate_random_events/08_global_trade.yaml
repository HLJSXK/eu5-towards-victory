      english: "Translators bring three versions of the same trade contract to the Academy, and only one of them would have spared the cargo. The room discovers that profit can drown in a single ambiguous clause."
      simp_chinese: "译员把同一份贸易契约的三种文本带到学院，而其中只有一种本能保住那批货物。众人这才发现，利润也会淹没在一个含混条款之中。"
