  - design_id: GT11
    pool: global_trade
    issue: global_trade
    weight: 1
    title:
      english: "Caravan and Convoy"
      simp_chinese: "商队与护航船队"
    desc:
      english: "Inland caravan masters and sea captains wrangle over which route deserves the Crown's coin. In the Academy chamber, road dust and salt spray are each offered as proof that the realm must learn to treat distance as one connected thing."
      simp_chinese: "内陆商队首领与海上船长争执，究竟哪条路线配得上王室的银钱。在学院辩论厅里，路上的尘土与海上的盐雾都被端出来当证据，证明王国必须学会把遥远的距离当作彼此相连的一体。"
    options:
      a:
        text:
          english: "The Academy joins caravan to convoy as a single system."
          simp_chinese: "学院把商队与船队接成一套体系。"
        progress_delta: 10
        rationale:
          english: "Joining caravan to convoy treats world trade as one integrated system rather than a feud between routes. Acceptance rises sharply, though the treasury must underwrite the coordination and the sea-merchants gain fresh cause to back the debate."
          simp_chinese: "把商队与船队接成一体，是把全球贸易视作一套整合的体系，而不是几条路线之间的争风。接受度因此陡增，只是国库得为这份协调埋单，海商也多了一层支持辩论的理由。"
        effect_blocks:
          - type: resource
            resource: gold
            scale: -1
          - type: seat_stance
            group: maritime_merchants
            stance: support
            cooldown_months: 18
      b:
        text:
          english: "We keep each route to its own privilege."
          simp_chinese: "我们让每条路线各守其特权。"
        progress_delta: -5
        rationale:
          english: "Keeping each route to its own privilege reassures established carriers and local brokers that their old lanes will not be swallowed by a grander plan. Momentum fades, for world trade now looks like optional coordination rather than a new order."
          simp_chinese: "让每条路线各守其特权，能安抚既有承运人与地方掮客：旧通道不会被更大的规划吞掉。势头随之消退，因为全球贸易看上去只是可有可无的协调，而非一种新秩序。"
        effect_blocks:
          - type: seat_stance
            group: local_autonomy
            stance: oppose
            cooldown_months: 18

  - design_id: GT12
    pool: global_trade
    issue: global_trade
    weight: 1
    title:
      english: "Merchant School"
      simp_chinese: "商人学校"
    desc:
      english: "Burghers propose teaching navigation, contracts, and languages as serious public knowledge. The notion unsettles everyone who would rather commerce stayed a family secret with a counting table attached."
      simp_chinese: "市民阶层提议，把航海、契约与语言当作严肃的公共学问来教授。这念头让所有人都不安——那些宁可让商业永远做一门附带账桌的家族秘传的人，尤其如此。"
    options:
      a:
        text:
          english: "The Crown endows a school for navigation and contracts."
          simp_chinese: "王室出资兴办一所航海与契约学校。"
        progress_delta: 10
        rationale:
          english: "Endowing the school turns world trade from an inherited merchant craft into public expertise that can be taught. Navigation, contracts, and languages become state-recognized knowledge, and acceptance rises sharply, with the Crown footing the bill."
          simp_chinese: "出资办学，把全球贸易从世代相传的商人手艺，变成可以传授的公共专长。航海、契约与语言获得国家承认，接受度大幅上升，代价则由王室的钱袋承担。"
        effect_blocks:
