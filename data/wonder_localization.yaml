    tv_wonder_unique_longjiang_shipyard_inaugurated_desc: 船台、木料池、作坊与宝船使江上造船服务于远洋雄心。
    STATIC_MODIFIER_NAME_tv_wonder_unique_longjiang_shipyard_ceremony_modifier: 郑和下西洋启航
    TV_ENGINEERING_CEREMONY_UNIQUE_LONGJIANG_SHIPYARD_INAUGURATED_BUTTON: 郑和下西洋启航
    TV_ENGINEERING_ACTIVE_RITUAL_UNIQUE_LONGJIANG_SHIPYARD_1: 确认明龙江船厂的郑和下西洋启航仪式。启航仪式提升海军航程与造船速度。。
    tv_engineering_department.500.d_unique_longjiang_shipyard: 船台、木料池、作坊与宝船使江上造船服务于远洋雄心。
      大工程师看向南京龙江船厂：明廷在那里准备足以改写地平线的舰队。 如今，郑和下西洋启航为这座奇观完成了固定历史地点上的落成。启航仪式提升海军航程与造船速度。
    game_concept_tv_wonder_unique_jerusalem_holy_city_desc: 城墙、圣所、街区、城门与游行使同一座城市承载多套神圣权威地图。
      这是一项必须在固定历史地点建造的独特[tv_wonder_construction|e]工程，沿用其通用原型的地点规则，并以圣城权力转换仪式作为历史定制落成仪式。
    TV_ENGINEERING_PROPOSAL_UNIQUE_JERUSALEM_HOLY_CITY_TEXT: 大工程师提出耶路撒冷圣城：每一次权力转换都必须先同记忆谈判，再触碰石头。
      简报：[tv_wonder_unique_jerusalem_holy_city|E]是一项固定于其历史地点的独特历史[tv_wonder_large|E]工程。
    TV_ENGINEERING_PROPOSAL_RESUME_UNIQUE_JERUSALEM_HOLY_CITY_TEXT: '[tv_great_engineer|E]建议完成造了一半的[tv_wonder_unique_jerusalem_holy_city|E]，并利用当地已经保留下来的工程部分。'
    TV_ENGINEERING_PROPOSAL_EXPAND_UNIQUE_JERUSALEM_HOLY_CITY_TEXT: '[tv_great_engineer|E]建议扩建[tv_wonder_unique_jerusalem_holy_city|E]，继续利用该地点已经保存的最大等级适性。'
    TV_ENGINEERING_LOCKED_UNIQUE_JERUSALEM_HOLY_CITY_TEXT: '@lock! 已锁定奇观：[tv_wonder_unique_jerusalem_holy_city|E]。'
    TV_ENGINEERING_PROPOSAL_BUTTON_UNIQUE_JERUSALEM_HOLY_CITY: '@city! 耶路撒冷圣城'
    TV_WONDER_LOCK_UNIQUE_JERUSALEM_HOLY_CITY_TT: 将[tv_wonder_unique_jerusalem_holy_city|E]锁定为工程部当前奇观。
