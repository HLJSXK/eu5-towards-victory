    tv_wonder_unique_jerusalem_holy_city_inaugurated: 耶路撒冷圣城
    tv_wonder_unique_jerusalem_holy_city_inaugurated_desc: 城墙、圣所、街区、城门与游行使同一座城市承载多套神圣权威地图。
    STATIC_MODIFIER_NAME_tv_wonder_unique_jerusalem_holy_city_ceremony_modifier: 圣城权力转换仪式
    TV_ENGINEERING_CEREMONY_UNIQUE_JERUSALEM_HOLY_CITY_INAUGURATED_BUTTON: 圣城权力转换仪式
    TV_ENGINEERING_ACTIVE_RITUAL_UNIQUE_JERUSALEM_HOLY_CITY_1: 确认耶路撒冷圣城的圣城权力转换仪式仪式。权力转换提升信仰容忍、外交声誉与威望。。
    tv_engineering_department.500.d_unique_jerusalem_holy_city: 城墙、圣所、街区、城门与游行使同一座城市承载多套神圣权威地图。
      大工程师提出耶路撒冷圣城：每一次权力转换都必须先同记忆谈判，再触碰石头。 如今，圣城权力转换仪式为这座奇观完成了固定历史地点上的落成。权力转换提升信仰容忍、外交声誉与威望。
    game_concept_tv_wonder_sacred_mountain_desc: 由阶梯、露台、圣祠与肃穆殿堂层层攀升的山岳圣所，仿佛把土地托近天穹。朝圣者在香烟与石阶之间上行，王廷的权威也随之披上神圣外衣，使信仰不再像命令，而像一整片地景。
    game_concept_tv_wonder_triumphal_axis_desc: 由笔直大道、宏阔广场、胜利门、阅兵场与宫殿立面串联而成的仪式都市。使节、军队与市民在有序的石材之间穿行，连移动本身都化作剧场，并反复指向谁才居于中心。
    game_concept_tv_wonder_great_port_desc: 由防波堤、码头、仓廒、船坞与市集大厅组成的巨型海港，让海洋按王国的规矩进入陆地。桅杆在塔楼下聚集，财富随潮水而来，远方宫廷也会先从这片水岸记住城市之名。
    game_concept_tv_wonder_giant_necropolis_desc: 由陵墓台地、祭祀道路、享堂与卫护园林组成的宏大王家墓葬景观。它在丘陵与聚落附近最能发挥价值，将王朝记忆转化为石材、仪式与公共秩序。
    game_concept_tv_wonder_great_lighthouse_desc: 矗立于港湾入口的巨型航标，以一束火光联结贸易航线与海军航程。港口容量越高，选址越优；不同仪式则决定灯塔更偏向舰队、商人还是海上守望。
    game_concept_tv_wonder_hydraulic_workshop_desc: 由水渠、水轮、蓄水池、工坊与闸门组成的工程片区。当地既有建筑越完善，它越能把水利控制转化为生产能力、建造效率与市民权威。
    game_concept_tv_wonder_mining_city_desc: 由矿井、矿场、排水工程、市场与铸币设施组成的计划型采掘城市。高发展度与乡村矿区最适合它，而仪式会决定矿井、王权与平民矿工如何分配地下财富。
    game_concept_tv_wonder_giant_observatory_desc: 由观测塔、测星廊、星表厅与仪器庭院组成的巨型观象台。丘陵、高原、山地与识字人口较多的地点最适合它，而仪式会把观天活动导向学术、航海或天象预兆。
    game_concept_tv_wonder_palace_of_nations_desc: 建于首都的外交宫城，将等级秩序、觐见仪式与外国存在转化为永久建筑。发展度高的大都会最适合它，而仪式会决定宫城偏向万国会议、贡礼展示或常设使馆区。
    game_concept_tv_wonder_university_city_desc: 由讲堂、学院、图书馆和学生区组成的学术城市。城市地点和高识字人口最适合它，其仪式可强化研究、公共识字或学院制度下的人口晋升。
    game_concept_tv_wonder_sky_dome_grand_temple_desc: 一座聚集在巨大仪式穹顶下的纪念性圣殿。正信人口和宗教基础设施最适合它，其仪式可强调祝圣、朝圣收入或教士化行政。
    game_concept_tv_wonder_giant_tower_temple_desc: 一座由阶梯、灯火室、圣所和学校组成的高塔神庙。其仪式可将高度转化为威望、朝圣纪律或有组织的皈依。
    game_concept_tv_wonder_river_extension_desc: 由拓宽河道、桥梁、堤岸、集市和办公室构成的水利奇观。它需要河流地点，并能将移动、贸易与运河行政转化为永久国家能力。
    game_concept_tv_wonder_national_shipyard_desc: 一座沿海造船复合体，由船台、吊机、仓库和海军办公室组成。港口容量和发展度最适合它，其仪式可强调造船速度、舰队士气或海军范围。
    game_concept_tv_wonder_star_fortress_city_desc: 一座由棱堡、操场、弹药库和军械区组成的规划要塞城市。城市防御地点最适合它，其仪式可强化驻军、攻城能力或要塞容量。
    game_concept_tv_wonder_great_wall_desc: 一条由城楼、关门、烽火台和集结场组成的边疆长墙。非城市防御地点最适合它，其仪式可强调人力、移动或士气。
    game_concept_tv_wonder_giant_armory_desc: 一座用于武器、铸造厂和大师甲匠的大型军事仓储与生产城区。高发展城镇和城市最适合它，其仪式会塑造士气、生产或训练度。
    game_concept_tv_wonder_library_of_nation_desc: 一座首都图书馆，由目录、抄写屋、阅览室和法定缴存办公室组成。其仪式可通过被保存的知识加速研究、识字或社会晋升。
    tv_engineering_department.500.d_sacred_1: 鲜血封圣了黄金圣域。[tv_wonder_ceremony|E]在比任何圣歌都更沉重的沉默中结束，每一位见证者都明白，这座纪念碑上的黄金不只是装饰权力，也记住了权力的代价。王权如今通过这座神圣工程发出光芒，用以震慑怀疑者，安抚忠诚者。祭司谈论献成，廷臣谈论威严，工程师则安静地谈论完工。[tv_engineering_department|E]建起了一处让服从向上仰望的地方。
    tv_engineering_department.500.d_sacred_2: 一年苦修完成了苦修圣山。它的沉默熬过了急躁、流言，以及宫廷用来保护自己免于思考的千百种小声音。[tv_wonder_ceremony|E]留下的不是奇观喧嚣，而是可见的纪律。学者与祭司都发现，这座纪念碑鼓励探究，却并不放弃敬畏。圣山如今通过拒绝给予来教导，国家则被要求学习。
    tv_engineering_department.500.d_sacred_3: 内阁跪入新的神圣秩序。神权帝国中心已经落成，[tv_wonder_ceremony|e]在全国眼前把行政转化为虔敬。教权如今拥有了一处纪念碑式地址，难以忽略，也更难嘲弄。[tv_engineering_department|E]为教义赋予了墙壁、门扉，以及日常统治机器中的位置。从今天起，政策说话时袖中会带着香烟。
    tv_engineering_department.500.d_axis_1: 外国使节已经走过太阳王式荣耀轴线，在石材排列中见证了我国荣光。他们走在该走的地方，看向该看的方向，并明白道路本身就是论证。[tv_wonder_ceremony|E]把见证者变成了我国奇观的携带者。有人会赞美，有人会嫉妒，有人会假装自己并未动容。他们都会记住这条轴线。
    tv_engineering_department.500.d_axis_2: 胜利给予军事凯旋都市真正凯旋。[tv_wonder_ceremony|E]不再依赖排练、旗帜或承诺，而承载了真实战争的重量。士兵穿过如今既属于交通也属于公众记忆的街道。纪念碑以鼓声、整齐队列和幸存之后的宽慰说话。从今天起，它的石头会听见每一次未来的武功夸耀。
    tv_engineering_department.500.d_axis_3: 理性秩序之都已经完成公民庆典。它的广场训练了脚步、目光与习惯，直到服从可以伪装成公共庆祝。[tv_wonder_ceremony|E]散去，但路线留下，而路线是一种安静的教导。人群离去很久以后，这座城市仍会继续教授市民应站在哪里、如何移动，以及秩序究竟是什么感觉。纪念碑的课程如今嵌进了日常生活。
    tv_engineering_department.500.d_port_1: 黄金贸易港一场接一场地被财富买入传说，直到财富本身仿佛献成了港口。[tv_wonder_ceremony|E]闪耀着出价、抛光金属，以及商人们把计算假装成敬畏的表情。每一枚花出去的钱币，都成了商业既能荣耀国家、又能充实自身的公开誓言。港口如今闻起来有盐、黄金和野心。船只会来贸易，也会来受震撼。
    tv_engineering_department.500.d_port_2: 重型战舰已经在帝国海军港前接受检阅。它们的船身像木材与火炮构成的论证一样移动，宣告大海如今必须注意我们的建筑。[tv_wonder_ceremony|E]教会纪念碑在第一个外国船长询问其意义之前，先说出海军权威。水手欢呼，军官清点，码头孩子学习哪些剪影值得敬畏。大海得到了一道悬挂旗帜的门。
    tv_engineering_department.500.d_port_3: 自由贸易都会已经完成开放交换的节庆。异国语言、合同与特权如今锚定了港口声望，比单靠石材更牢固。[tv_wonder_ceremony|E]把讨价还价变成剧场，又把剧场变成政策。商人离开时钱袋或轻或重，但都知道这座港口的名字。港口如今属于流动，而流动学会了使用我们的印章。
    tv_engineering_department.500.d_necropolis_1: 统治者之死让国家陵墓充满王朝意义。队列沉入墓道，携带哀伤、正统性，以及继承如何在肉身之后存活的谨慎编排。[tv_wonder_ceremony|E]让死者变得有用，却又不显得被利用。生者家族从下方有序的沉默中汲取权威。石材、血统与哀悼进入了同一份契约。
    tv_engineering_department.500.d_necropolis_2: 祖先祭仪以姓名、供品与静烟告终，并固定进圣祠。[tv_wonder_ceremony|E]为记忆给予了日程、路径，以及一处被认可的聚集地。国家建起的不只是墓葬，也是一套关于过去仍在监督现在的论证。孩子们会在这里先学会姓名，再理解政治。这正是它为何重要。
    tv_engineering_department.500.d_necropolis_3: 寂静之地已经被永久划出。道路沉默，移民绕行，陵墓园区成为野心与静默之间的边界。[tv_wonder_ceremony|E]要求国家像尊荣征服一样有意尊荣缺席。如今，再没有市场能轻易吞下这片土地。土地被交给了记忆，而记忆是一位苛刻的主人。
    tv_engineering_department.500.d_lighthouse_1: 长明火在海上方燃起。它饥渴的光芒将索取木材、看护，以及午夜之后仍让承诺可见的无尽纪律。[tv_wonder_ceremony|E]把火转化为公共职责，把水手变成远方见证者。船只已经把信标视作第二颗星辰，一颗由人手而非天空制造的星。海岸获得了一只拒绝闭合的眼睛。
    tv_engineering_department.500.d_lighthouse_2: 领航员行会在塔下开门，将航标、账册与领航知识转化为市民权力。[tv_wonder_ceremony|E]把灯塔绑定给训练有素的声音，而不只是火焰和石头。曾经把知识藏在记忆中的领航员，如今把知识带入了有门、有规则、有期待的机构。信标警示船只，行会教会国家如何读懂警示。二者一同让距离更服从。
    tv_engineering_department.500.d_lighthouse_3: 长夜守望已经占据邻近海域。信号从塔楼传向海面又返回，直到缺席本身也成为国家可巡逻之物。[tv_wonder_ceremony|E]把警戒变成了市民习惯，而非偶尔响起的警报。水手如今望向灯塔，不只是为了安全，也为了被允许相信海岸仍然清醒。夜晚失去了一些私密。
    tv_engineering_department.500.d_hydraulic_1: 水神大祭在渠道恢复劳动的歌声中结束。[tv_wonder_ceremony|E]让水看起来服从，这也许是最大胆的工程宣称。工坊恢复运转，但它们是在新的水流、水闸与祝福的神圣秩序下运转。复合体如今通过流动的水承载市民安宁。每一道水轮和渠道都会记得那些教会它们显得服从的仪式。
    tv_engineering_department.500.d_hydraulic_2: 水利工匠行会得到承认，水利工程听命于训练有素的手。[tv_wonder_ceremony|E]完成了特权、机械与本地控制之间的契约。工匠不靠演说获得地位，而靠证明城市依赖他们有度量的能力获得地位。[tv_engineering_department|E]建成了身体；行会将保持身体能言。水如今拥有了自己的专业阶层。
