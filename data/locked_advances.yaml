# Research Mechanism — Frontier Technology Targets
# Each entry defines one advance node that the Academy of Sciences Research Mechanism
# can unlock as a shortcut (a completed cycle auto-researches it via `research_advance`).
#
# NOTE: As of v0.1.x, these advances are NOT locked at game start. The vanilla
# research path is fully intact; the Research Mechanism is an *extra* unlock route
# (skip the vanilla cost / institution requirement and grant the advance immediately
# upon completing one full A+B+C+D cycle).
#
# Fields:
#   id                  Short key used for variable/effect naming (no _advance suffix)
#   vanilla_advance_id  The vanilla advance key (used in `research_advance = advance_type:X`)
#   age                 Numeric age (1..6); used by the propose-target effect to prefer
#                       earlier-age unresearched advances
#   research_unlock_var Country script variable set to 1 when unlocked (kept for backward
#                       compatibility with the propose-target effect's "skip if already
#                       unlocked via prior cycle" guard)
#
# Enum assignments for tv_research_target (used in subprocess_effects.txt and GUI):
#   gui_value must match the hardcoded enum in subprocess_effects.txt — do NOT reorder.
#   gui_loc_key is derived by the GUI generator as TV_RM_TARGET_<ID_UPPER>.
#
# DO NOT hand-edit generated output files. Run:
#   conda run --no-capture-output -n eu5 python scripts/gen_locked_advances.py
#   conda run --no-capture-output -n eu5 python scripts/in_game/gui/panels/organization/gen_tv_academy_of_sciences_gui.py

locked_advances:
  - id: printing_press
    gui_value: 1
    vanilla_advance_id: printing_press_advance
    age: 3
    research_unlock_var: tv_advance_printing_press_unlocked

  - id: iron_working
    gui_value: 2
    vanilla_advance_id: iron_working
    age: 1
    research_unlock_var: tv_advance_iron_working_unlocked

