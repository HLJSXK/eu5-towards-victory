    gui_value: 3
    vanilla_advance_id: anatomy_advance
    age: 2
    research_unlock_var: tv_advance_anatomy_unlocked

  - id: gunpowder
    gui_value: 4
    vanilla_advance_id: gunpowder_advance
    age: 2
    research_unlock_var: tv_advance_gunpowder_unlocked

  - id: blast_furnace
    gui_value: 5
    vanilla_advance_id: blast_furnace
    age: 3
    research_unlock_var: tv_advance_blast_furnace_unlocked

  - id: scientific_experimentation
