# Research Mechanism — Frontier Technology Targets
# Each entry defines one advance node that the Academy of Sciences Research Mechanism
# can unlock as a shortcut (a completed cycle auto-researches it via `research_advance`).
#
# NOTE: As of v0.1.x, these advances are NOT locked at game start. The vanilla
# research path is fully intact; the Research Mechanism is an *extra* unlock route
# (skip the vanilla cost / institution requirement and grant the advance immediately
# upon completing one full A+B+C+D cycle).
#
# Fields:
#   id                  Short key used for variable/effect naming (no _advance suffix)
#   vanilla_advance_id  The vanilla advance key (used in `research_advance = advance_type:X`)
#   age                 Numeric age (1..6); used by the propose-target effect to prefer
#                       earlier-age unresearched advances
#   research_unlock_var Country script variable set to 1 when unlocked (kept for backward
#                       compatibility with the propose-target effect's "skip if already
#                       unlocked via prior cycle" guard)
#
# Enum assignments for tv_research_target (used in subprocess_effects.txt):
#   1=printing_press  2=iron_working  3=anatomy  4=gunpowder  5=blast_furnace
#   6=scientific_experimentation  7=scientific_revolution  8=manufactories
#   9=industrialization  10=vaccination
#
# DO NOT hand-edit generated output files. Run:
#   conda run --no-capture-output -n eu5 python scripts/gen_locked_advances.py

locked_advances:
  - id: printing_press
    vanilla_advance_id: printing_press_advance
    age: 3
    research_unlock_var: tv_advance_printing_press_unlocked

  - id: iron_working
    vanilla_advance_id: iron_working
    age: 1
    research_unlock_var: tv_advance_iron_working_unlocked

  - id: anatomy
    vanilla_advance_id: anatomy_advance
    age: 2
    research_unlock_var: tv_advance_anatomy_unlocked

  - id: gunpowder
    vanilla_advance_id: gunpowder_advance
    age: 2
    research_unlock_var: tv_advance_gunpowder_unlocked

  - id: blast_furnace
    vanilla_advance_id: blast_furnace
    age: 3
    research_unlock_var: tv_advance_blast_furnace_unlocked

  - id: scientific_experimentation
    vanilla_advance_id: scientific_experimentation
    age: 4
    research_unlock_var: tv_advance_scientific_experimentation_unlocked

  - id: scientific_revolution
    vanilla_advance_id: scientific_revolution_advance
    age: 5
    research_unlock_var: tv_advance_scientific_revolution_unlocked

  - id: manufactories
    vanilla_advance_id: manufactories_advance
    age: 5
    research_unlock_var: tv_advance_manufactories_unlocked

  - id: industrialization
    vanilla_advance_id: industrialization_advance
    age: 6
    research_unlock_var: tv_advance_industrialization_unlocked

  - id: vaccination
    vanilla_advance_id: vaccination_advance
    age: 6
    research_unlock_var: tv_advance_vaccination_unlocked
