# Locked Frontier Technology Advances
# Each entry defines one advance node that is inaccessible by default and must
# be unlocked via a complete Research Mechanism cycle in the Academy of Sciences IO.
#
# Fields:
#   id                  Short key used for variable/trigger/effect naming (no _advance suffix)
#   label_en            English display name
#   label_zh            Chinese display name
#   research_unlock_var Country script variable set to 1 when unlocked
#   trigger_block       Verbatim EU5 trigger body (is-locked check; inserted as-is)
#   loc.en              English lock-reason tooltip shown in advance tree
#   loc.zh              Chinese lock-reason tooltip shown in advance tree
#
# Vanilla advance key mapping (for tv_locked_advances.txt REPLACE/INJECT):
#   iron_working                  → iron_working           (Age 1, has allow:feudalism — REPLACE)
#   printing_press                → printing_press_advance (Age 3, has allow:printing_press — REPLACE)
#   scientific_revolution         → scientific_revolution_advance (Age 5, has allow:scientific_revolution — REPLACE)
#   manufactories                 → manufactories_advance  (Age 5, has allow:manufactories — REPLACE)
#   industrialization             → industrialization_advance (Age 6, has allow:industrialization — REPLACE)
#   anatomy                       → anatomy_advance        (Age 2, no allow — INJECT)
#   gunpowder                     → gunpowder_advance      (Age 2, no allow — INJECT)
#   blast_furnace                 → blast_furnace          (Age 3, no allow — INJECT)
#   scientific_experimentation    → scientific_experimentation (Age 4, no allow — INJECT)
#   vaccination                   → vaccination_advance    (Age 6, no allow — INJECT)
#
# Enum assignments for tv_research_target (used in subprocess_effects.txt):
#   1=printing_press  2=iron_working  3=anatomy  4=gunpowder  5=blast_furnace
#   6=scientific_experimentation  7=scientific_revolution  8=manufactories
#   9=industrialization  10=vaccination
#
# DO NOT hand-edit generated output files. Run:
#   conda run --no-capture-output -n eu5 python scripts/gen_locked_advances.py

locked_advances:
  - id: printing_press
    label_en: "Printing Press"
    label_zh: "印刷术"
    research_unlock_var: tv_advance_printing_press_unlocked
    trigger_block: |
      NOT = { has_variable = tv_advance_printing_press_unlocked }
    loc:
      en: "Requires Academy Research"
      zh: "需要科学院研究解锁"

