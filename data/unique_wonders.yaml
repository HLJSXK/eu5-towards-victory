      desc_zh: 伐木工人从谷地的果园中砍伐高大的白杨与胡桃树，将木料风干晾晒，日后用以制成这座宫殿闻名遐迩的彩绘立柱。商队沿汗国各条商路，运来染料、金箔与雕花大理石贴面。
