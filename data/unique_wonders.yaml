    - title_en: Ore and Master Smiths Arrive
      title_zh: 矿石与名匠齐聚
      desc_en: Iron ore is hauled in from mountain mines, and renowned smiths are drawn to Toledo from across the realm by the promise of royal patronage. Water wheels are fitted to the new forge halls.
      desc_zh: 铁矿石自山中矿场运抵托莱多，各地名匠亦因王室庇护之名而纷纷前来投效。新建锻炉厅内装上了水轮。
