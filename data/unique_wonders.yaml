    stages:
    - title_en: The Water Board Calls for a New Polder
      title_zh: 水务局倡议围垦新圩
      desc_en: The regional water board petitions the States for the right to enclose a stretch of marsh and shallow lake, promising dry farmland where only reeds and eels now thrive. Engineers are commissioned to survey the ring of dikes that will hold the sea and rivers at bay.
      desc_zh: 地方水务局向省议会请愿，要求圈围一片沼泽浅湖，承诺在如今只有芦苇与鳗鱼的地方开辟出干燥的农田。工程师受命勘测将挡住海水与河流的环形堤坝走向。
      cost:
      - type: scaled_gold
        value: -4
    - title_en: Peat Cutters Give Way to Dike Builders
      title_zh: 泥炭工让位于筑堤人
      desc_en: The peat cutters and eel fishers who worked the marsh are bought out or hired onto the new project, and barges begin hauling clay and reed bundles to the sites where the ring dike will rise. Windmill millwrights are contracted from towns up and down the coast.
      desc_zh: 曾在沼泽中割泥炭、捕鳗鱼的人们被收购土地或雇入新工程，驳船开始将粘土与芦苇捆运往环形堤坝的选址。沿海各镇的风车匠人也被聘请前来。
      cost:
      - type: gold
        value: -60
    - title_en: The Water Board Sets Its Rules
      title_zh: 水务局立定章程
      desc_en: The dike-reeve and his heemraden lay down the assessments each landholder must pay toward the work, and surveyors drive the first marker stakes along the planned dike's full circuit. A model of the drainage mill is tested on a nearby ditch before construction begins in earnest.
      desc_zh: 堤务长及其参事们定下每位地主须为工程分摊的费用，测量员沿计划中的堤坝全线打下最初的界桩。排水风车的模型先在附近的沟渠上试验，而后工程才正式展开。
      cost:
      - type: government_power
        value: -12
    - title_en: Spades Cut the First Dike Wall
      title_zh: 铁锹筑起首段堤墙
      desc_en: Laborers finally cut sod and pile clay for the ring dike's first true stretch, tamping each layer before the next is laid atop it. What was stakes in the mud now becomes a rising wall meant to hold back the sea itself.
      desc_zh: 劳工终于切割草皮、堆筑黏土，砌起环形堤坝的第一段真正墙体，每铺一层便夯实一层。曾经只是泥中的木桩，如今化作意图挡住大海本身的隆起长墙。
      cost:
      - type: manpower
        value: -30
    - title_en: The First Mills Turn Their Sails
      title_zh: 首批风车转动风翼
      desc_en: A row of drainage windmills is raised along the dike's inner edge, their great sails catching the coastal wind to begin lifting water from the enclosed marsh into the outer canals. Farmers watch the water level inside the ring drop for the first time in living memory.
      desc_zh: 堤坝内侧竖起一排排排水风车，巨大的风翼捕捉海岸的风力，开始将圈围沼泽中的积水提升排入外部运河。农人们看着环内的水位第一次在他们记忆中开始下降。
      cost:
      - type: scaled_gold
        value: -6
    - title_en: The Dike Closes the Final Gap
      title_zh: 堤坝合拢最后缺口
      desc_en: Workers race against a spring tide to close the last opening in the ring dike, driving pilings and dumping clay until the water inside is fully separated from the rivers and sea beyond. The water board declares the enclosure complete and the true draining begins.
      desc_zh: 工人们与春潮赛跑，抢在最后关头合拢环形堤坝的最后一处缺口，打桩填土，直至内侧水域彻底与外面的江河海洋隔绝。水务局宣布合龙完成，真正的排水由此开始。
      cost:
      - type: manpower
        value: -45
    - title_en: Fields Emerge from the Drained Lake Bed
      title_zh: 干涸湖床长出良田
      desc_en: The lake bed dries into rich black soil section by section, and the first plots are surveyed and let to farmers eager to work ground that was open water only seasons before. New farmhouses and drainage ditches spread across the reclaimed polder.
      desc_zh: 湖床一段段干涸，化作肥沃的黑土，最初的地块被测量分租给农人，他们迫不及待地耕作这片不久前还是一片汪洋的土地。新的农舍与排水沟渠在这片新围垦的圩田上不断延展。
      cost:
      - type: yearly_gold
        value: -8
    - title_en: The Water Board Declares the Polder Won
      title_zh: 水务局宣告圩田告成
      desc_en: The dike-reeve and his heemraden process along the finished ring dike to mark the closure ceremony, windmills turning in steady rhythm as the reclaimed fields stretch out green and dry behind them. The polder now stands as permanent farmland, its dikes and mills defending the nation's hard-won ground against the sea for good.
      desc_zh: 堤务长与参事们沿竣工的环形堤坝巡行，举行合龙庆典，风车有节奏地转动，身后是一片片翠绿干燥、来之不易的新田。这片圩田自此成为永久的农地，其堤坝与风车将永远守护这片得来不易的土地，抵御海水侵袭。
      cost:
      - type: scaled_gold
        value: -10
      - type: government_power
        value: -20
