    stages:
    - title_en: Shah Jahan Names the New Capital
      title_zh: 沙贾汗定都新城
      desc_en: From the Peacock Throne's antechamber, the Emperor decrees that Shahjahanabad shall rise on the Yamuna's bank, crowned by a citadel of red sandstone worthy of the Mughal line. Astrologers are summoned to fix the most auspicious hour for the foundation.
      desc_zh: 皇帝在孔雀宝座的前厅颁布敕令，宣布沙贾汗纳巴德城将在亚穆纳河畔兴建，并由一座配得上莫卧儿血统的红砂岩城堡为其加冕。占星师奉命择定奠基的最吉利时辰。
      cost:
      - type: prestige
        value: -20
    - title_en: The Quarries of Rajasthan Answer
      title_zh: 拉贾斯坦采石场应召
      desc_en: Convoys of red sandstone blocks begin the long haul from the quarries near Dholpur, each stone marked with the mason's guild sign before it ever reaches the Yamuna. Ustad Ahmad Lahori's surveyors walk the riverbank measuring the fort's future walls.
      desc_zh: 一队队红砂岩石料车队从多尔布尔附近的采石场启程，每块石头在抵达亚穆纳河之前都已刻上工匠行会的印记。总建筑师艾哈迈德·拉合里的测量员沿河岸丈量城堡未来的城墙。
      cost:
      - type: scaled_gold
        value: -6
    - title_en: The River Is Bound by Rite
      title_zh: 以礼约束河岸
      desc_en: Court priests and Sufi elders alike bless the riverside ground where the ramparts will stand, and the Emperor himself lays a jeweled trowel of ceremonial mortar. Laborers by the thousand are mustered from across the province to begin the great earthworks.
      desc_zh: 宫廷祭司与苏菲长老共同为城墙将立之地祝祷，皇帝亲手以镶宝石的泥刀涂下象征性的第一抹灰浆。数以千计的劳工从全省征调而来，开始浩大的地基工程。
      cost:
      - type: manpower
        value: -40
    - title_en: The Ramparts Rise from Earth
      title_zh: 城垣自地基而起
      desc_en: The first true courses of red sandstone lock into place along the riverfront, and the outline of the Lahori Gate begins to break the horizon. What was survey and blessing is now stone laid upon stone, rising higher with each passing month.
      desc_zh: 第一层真正的红砂岩沿河岸砌合成形，拉合里门的轮廓已然突破天际线。此前的测量与祝祷，如今化作层层叠起、日渐增高的石墙。
      cost:
      - type: scaled_gold
        value: -8
    - title_en: The Lahori Gate Is Crowned
      title_zh: 拉合里门加冠
      desc_en: Chhatris and merlons crown the great gate facing the old city, its bastions built thick enough to withstand siege guns. Craftsmen from Persia and Central Asia arrive to begin the pietra dura inlay that will mark the palace halls within.
      desc_zh: 面向旧城的宏伟城门顶部装上伞形穹顶与雉堞，壁垒厚实足以抵御攻城炮火。来自波斯与中亚的工匠们抵达，开始为内殿镶嵌硬石镶花工艺。
      cost:
      - type: cultural_influence
        value: -8
    - title_en: The Halls of Audience Take Form
      title_zh: 觐见殿宇渐成
      desc_en: The Diwan-i-Am rises on its marble columns, and beyond it the Diwan-i-Khas begins to take the shape that will one day bear the inscription that if there is a paradise on earth, it is this. Gardens are laid out in the Persian charbagh pattern between the halls.
      desc_zh: 公众觐见殿在大理石廊柱上拔地而起，其后的私人觐见殿也渐显雏形，日后将镌刻那句令后世传颂的铭文——人间若有天堂，便在此地。殿宇之间，波斯风格的四方庭园次第铺展。
      cost:
      - type: prestige
        value: -35
    - title_en: The Peacock Throne Is Installed
      title_zh: 孔雀宝座入殿
      desc_en: Under guard of the imperial bodyguard, the jewel-encrusted Peacock Throne is carried into the Diwan-i-Khas and set upon its dais, its gold and gems catching the light through marble screens. The court gathers to witness the throne take its place at last within the finished walls.
      desc_zh: 在皇家侍卫的护送下，镶满珠宝的孔雀宝座被抬入私人觐见殿，安放于殿中高台之上，透过大理石花窗的光线映照其金饰珠光。满朝文武齐聚，见证此宝座终于在竣工的宫墙之内落座。
      cost:
      - type: honor
        value: -20
    - title_en: The Empire's Red Citadel Stands
      title_zh: 帝国红堡巍然屹立
      desc_en: Shah Jahan holds court for the first time within the completed fort, and criers proclaim across Shahjahanabad that the empire's heart now beats behind these red walls. Garrison and government alike draw new strength from a capital that will outlast the dynasty itself.
      desc_zh: 沙贾汗首次在竣工的城堡内临朝听政，传令官在沙贾汗纳巴德全城宣告，帝国的心脏自此在这红色城墙之后跳动。驻军与朝廷都从这座终将比王朝本身更长久的都城中，汲取新的力量。
      cost:
      - type: prestige
        value: -50
      - type: army_tradition
        value: -3
