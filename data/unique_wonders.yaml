    - title_en: The Road to the Apostle Is Proclaimed
      title_zh: 圣使徒之路诏令颁布
      desc_en: Bishop and crown together proclaim a pilgrim road to the shrine of Saint James at Compostela, open to every soul willing to walk it. Word of the proclamation travels faster than the pilgrims themselves.
      desc_zh: 主教与王室共同宣告，通往孔波斯特拉圣雅各圣祠的朝圣之路正式开辟，凡愿跋涉者皆可前行。诏令的消息，传得比朝圣者本人还要迅速。
      cost:
      - type: devotion
        value: -12
    - title_en: Waypoints Are Blessed
      title_zh: 沿途驿站受祝圣
      desc_en: Priests walk the future route through Galicia's green hills, blessing crossroads, fords, and resting places that will one day guide pilgrims onward. Villages along the path begin marking the way with scallop shells.
      desc_zh: 神父沿加利西亚青翠的丘陵间行走，为日后指引朝圣者的十字路口、渡口与歇脚之地一一祝圣。沿途村落也开始以扇贝壳标记道路。
      cost:
      - type: religious_influence
        value: -8
    - title_en: Bridges and Hospices Are Planned
      title_zh: 桥梁与救济院筹划
      desc_en: Monastic orders and local guilds pledge stone and timber for bridges over swollen rivers and hospices to shelter the weary. Masons are contracted to begin work as soon as the rains ease.
      desc_zh: 修会与本地行会认捐石料与木材，用以在涨水的河流上架桥，并建救济院以庇护疲惫的旅人。石匠们受雇待雨季一过便即动工。
      cost:
      - type: artwork
        value: 1
    - title_en: The First Bridges Span the Rivers
      title_zh: 首座石桥横跨江河
      desc_en: Stone arches finally rise over Galicia's rivers, and the first roadside shrines are set along the way. What was until now blessings and pledges now becomes a road pilgrims can actually walk from end to end.
      desc_zh: 石拱桥终于跨越加利西亚的河流，沿途最初的路旁圣龛也一一立起。此前不过是祝祷与认捐，如今已成为朝圣者真正可以从头走到尾的道路。
      cost:
      - type: scaled_gold
        value: -6
    - title_en: Hostels Rise at Every Day's End
      title_zh: 每日行程尽头立起客栈
      desc_en: Hospices and hostels are built at intervals matching a day's honest walk, each one stocked with bread, water, and a place to rest sore feet. Monks at each stop learn to recognize returning pilgrims by their worn boots alone.
      desc_zh: 按每日脚程的距离，沿途陆续建起救济院与客栈，各备面包、清水与歇脚之处。各站的修士渐渐只凭磨损的靴子，便能认出回头的朝圣者。
      cost:
      - type: artwork
        value: 1
    - title_en: The Cathedral Towers Rise
      title_zh: 大教堂双塔耸立
      desc_en: At journey's end, the towers of Compostela's cathedral climb above the city to welcome the road's weary travelers. Word spreads that the sight of the twin spires alone is worth the length of the walk.
      desc_zh: 在朝圣之路的尽头，孔波斯特拉大教堂的双塔在城市上空拔地而起，迎接沿途疲惫的旅人。人们传言，单是望见这双塔的那一刻，便已值得整段旅程的艰辛。
      cost:
      - type: artwork
        value: 1
    - title_en: Pilgrims Flood the Road
      title_zh: 朝圣者络绎不绝
      desc_en: Tales of miracles at the shrine spread across the continent, and the scallop shell becomes a badge recognized from Galicia to the farthest kingdoms. Hostels that once stood half-empty now turn pilgrims away at dusk for lack of beds.
      desc_zh: 圣祠显灵的传说传遍大陆各地，扇贝徽记从加利西亚一路远播至最遥远的诸国，人人皆识。曾经半空的客栈，如今日暮时分常因床位不足而婉拒来客。
      cost:
      - type: religious_influence
        value: -18
    - title_en: The Camino Is Complete
      title_zh: 朝圣之路终告贯通
      desc_en: Road, bridge, and hostel now stand finished from the first waypoint to the cathedral steps, and pilgrims arrive in numbers no one dared predict. Their devotion and coin alike now flow steadily through every town the road touches, binding the realm's faith closer together.
      desc_zh: 道路、桥梁与客栈自最初的驿站直至大教堂石阶，如今尽数落成，朝圣者纷至沓来，人数远超当初任何人的预料。他们的虔诚与钱财如今源源流经道路所经的每一座城镇，也使全国的信仰更为紧密地凝聚在一起。
      cost:
      - type: religious_influence
        value: -30
