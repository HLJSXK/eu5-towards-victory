    stages:
    - title_en: The Emperor Orders the Nine Borders Sealed
      title_zh: 皇帝敕令九边合修
      desc_en: The Ming court decrees that the frontier from Liaodong to Gansu shall be bound into a single system of brick and beacon, the Nine Border garrisons unified under one imperial mandate. Generals of each garrison are summoned to Beijing to receive the seal of the new works.
      desc_zh: 明廷下诏，自辽东至甘肃的边境将合为一套完整的砖石烽燧体系，九边诸镇统归一道敕令节制。各镇总兵奉召入京，领受这项新工程的印信。
      cost:
      - type: honor
        value: -12
    - title_en: The Kilns of the Frontier Are Lit
      title_zh: 边境窑火点燃
      desc_en: Brick kilns are raised at the foot of the mountains, firing the fused gray brick that will replace the crumbling rammed-earth walls of earlier dynasties. Convoys of mules haul lime and brick up switchback trails toward the passes chosen by the border commanders.
      desc_zh: 山脚下筑起砖窑，烧制将取代前朝夯土残墙的青灰色砖石。骡队沿着盘山小径将石灰与砖块运往边将选定的关隘。
      cost:
      - type: scaled_gold
        value: -6
    - title_en: The Passes Are Surveyed by the Garrisons
      title_zh: 边军踏勘关隘
      desc_en: Officers of the border commands walk the ridgelines with military engineers, marking where watchtowers must stand within signal-fire sight of one another across the mountains. Local laborers are conscripted under the corvee to begin clearing the stone foundations.
      desc_zh: 边镇将官与营造官一同踏勘山脊，标出各处需在山峦间彼此可见烽火信号的墩台位置。当地民夫依徭役征发，开始清理石砌地基。
      cost:
      - type: manpower
        value: -30
    - title_en: The First Brick Course Is Laid
      title_zh: 首层砖石砌成
      desc_en: Masons set the first fused brick facing over the old rammed-earth core near the Juyongguan pass, and the wall begins its true transformation from earthen rampart to the towering brick fortification the dynasty envisions. Officers inspect each course before the next may be laid.
      desc_zh: 石匠们在居庸关附近的旧夯土墙芯外砌上第一层青砖包面，长城自此真正从土垣蜕变为王朝所构想的巍峨砖石雄关。每砌一层，将官都须验收方可继续。
      cost:
      - type: scaled_gold
        value: -9
    - title_en: The Watchtowers Climb the Ridges
      title_zh: 墩台沿山脊耸立
      desc_en: Two-story beacon towers rise along the ridgelines at measured intervals, each stocked with wolf-dung smoke signals and garrison quarters for the soldiers who will watch the passes through winter. The wall begins to snake visibly along the mountain crests for the first time.
      desc_zh: 双层烽火台按固定间距沿山脊建起，每座都储有狼粪烟信与供士兵越冬值守的营房。长城首次沿山脊蜿蜒可见，轮廓愈发分明。
      cost:
      - type: army_tradition
        value: -2
    - title_en: The Nine Garrisons Link Their Beacons
      title_zh: 九镇烽燧连成一线
      desc_en: Signal fires are tested pass by pass until a warning lit at Jiayuguan can reach Beijing's outer defenses within a single night, binding the nine border commands into one chain of sight and fire. Soldiers and horsemen drill along the finished stretches to learn the new rhythm of the frontier.
      desc_zh: 烽火信号逐关逐隘反复演练，直至嘉峪关点燃的警讯能在一夜之内传抵京师外围防线，将九边诸镇连成一条声息相通、烽火相接的防线。士卒与骑手在已竣工的段落操演，熟悉边关新的守备节奏。
      cost:
      - type: army_tradition
        value: -3
    - title_en: The Passes Are Fortified with Gates
      title_zh: 雄关设门，固若金汤
      desc_en: Massive gate complexes rise at Juyongguan, Jiayuguan, and Shanhaiguan, each fitted with barbican, drawbridge, and garrison towers strong enough to hold an army at bay. The wall now runs unbroken across mountain and desert alike, a single continuous work where once stood scattered forts.
      desc_zh: 居庸关、嘉峪关、山海关处相继建起庞大的关城建筑群，配备瓮城、吊桥与足以阻挡大军的营垒箭楼。长城如今横贯山岳与大漠，连绵不绝，昔日星散的堡垒终连成一体。
      cost:
      - type: prestige
        value: -35
    - title_en: The Nine Borders Stand as One
      title_zh: 九边一体，巍然屹立
      desc_en: The Emperor receives word that the wall system from sea to desert stands complete, its beacons lit in a single night from Shanhaiguan to Jiayuguan in proof of the frontier's unity. The dynasty's soldiers now hold a border that history itself will remember as unbreakable.
      desc_zh: 皇帝接获奏报，自海滨至大漠的长城体系已然竣工，山海关至嘉峪关的烽火在同一夜间尽数点燃，昭示边疆归于一统。王朝的将士们如今扼守着一道将被历史铭记为坚不可摧的边防。
      cost:
      - type: prestige
        value: -50
      - type: honor
        value: -20
