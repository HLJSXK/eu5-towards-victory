      title_zh: 汉江放排运材
      desc_en: Pine logged in the northern provinces is lashed into rafts and floated down the Han River, while corvee laborers are mustered from the surrounding countryside. Granite quarries near the capital are opened to supply the palace's foundation stones.
      desc_zh: 北方诸道所伐松木扎排顺汉江而下，四方役夫亦被征调而来。京畿石场随之开凿，专备宫基所用花岗巨石。
      cost:
      - type: manpower
        value: -50
    - title_en: The Foundation Stones Are Laid
      title_zh: 宫基奠石
      desc_en: Work crews break ground before Mount Bugak, setting the first foundation stones for what will become Gwanghwamun and the halls beyond it. The plans on paper give way to timber scaffolding and the ring of chisels on stone.
      desc_zh: 役夫于北岳山前正式动土，为光化门及其后诸殿奠下第一批基石。图纸上的宫城自此化作木架林立、凿石叮当的工地。
      cost:
      - type: scaled_gold
        value: -6
    - title_en: Gwanghwamun Takes Shape
      title_zh: 光化门渐成
      desc_en: The great southern gate rises tier by tier, its granite base supporting a pavilion roof of glazed tile. Stonemasons carve the haetae that will guard its threshold against fire and misfortune.
      desc_zh: 巍峨南门层层筑起，花岗石基之上覆以琉璃瓦顶。石匠又凿刻镇门之獬豸，以御火患、镇邪祟。
      cost:
      - type: government_power
        value: -12
    - title_en: The Throne Hall's Painted Beams
      title_zh: 勤政殿丹青绘梁
      desc_en: Inside Geunjeongjeon, carpenters raise the great beams that will bear the throne hall's double roof, and painters begin the dancheong patterns of blue, red, and gold across every eave. The king's audience courtyard is paved in broad flagstones.
      desc_zh: 勤政殿内，匠人架起承托重檐的巨梁，画工亦开始在檐下绘制青红金彩的丹青纹样。御前朝会所用庭院同时铺就宽阔石板。
      cost:
      - type: artwork
        value: 1
    - title_en: The Guardian Courts Are Finished
      title_zh: 护卫廷院告竣
      desc_en: Bronze guardian beasts take their places along the processional path, and the innermost courtyards where the royal family will live are enclosed behind their own walls and gates. Officials rehearse the order of court ceremony to be held within.
      desc_zh: 铜铸神兽依次列于御道两侧，王室起居所在的内廷也筑起独立宫墙与门户。百官于殿前反复演习日后朝仪次序。
      cost:
      - type: government_power
        value: -20
    - title_en: The King Ascends the Throne Hall
      title_zh: 王登勤政殿
      desc_en: The king crosses Gwanghwamun and the courts beyond it to take the throne in Geunjeongjeon for the first time, and the axis of gates and halls is declared complete before the assembled court. From this day the palace's ordered geometry lends discipline to every office of state, and the cabinet's daily business runs with new efficiency.
      desc_zh: 王驾亲临，穿光化门、历诸重庭院，首度登临勤政殿御座，百官齐集，宣告此中轴宫阙终告落成。自此宫城森然有序的格局融入朝纲运作，议政府日常庶务亦为之一新，效率大增。
      cost:
      - type: government_power
        value: -30
