    - title_en: The Baroque Halls Begin to Rise
      title_zh: 巴洛克展厅破土动工
      desc_en: Stonemasons break ground on the gallery wing, and the first Baroque columns rise where sketches once stood alone. The crates of paintings wait in storage while scaffolding climbs around them.
      desc_zh: 石匠们在画廊侧翼破土动工，最初只存在于图纸上的巴洛克立柱开始拔地而起。装着画作的箱子暂存于库房，脚手架则在四周不断攀升。
