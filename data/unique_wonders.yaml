        value: 1
    - title_en: Hanging the Great Canvases
      title_zh: 悬挂巨幅名作
      desc_en: The largest canvases are hoisted onto the gallery walls under ropes and pulleys, court painters adjusting each frame by a hair's breadth. Visitors are given a first, hushed glimpse before the doors are sealed again for the final polish.
      desc_zh: 最大的几幅画作在绳索与滑轮的协助下被吊挂上画廊墙面，宫廷画师们对每一幅画框都作毫厘之间的调整。访客得以先睹为快、屏息而观，随后大门再度封闭，进行最后的打磨。
      cost:
      - type: artwork
        value: 1
    - title_en: The Gallery Opens to the Court
      title_zh: 画廊向宫廷正式开放
      desc_en: The gallery opens its doors under the elector's own hand, paintings, porcelain, and sculpture arranged at last for court and visiting dignitaries alike. Artists across the realm now speak of Dresden in the same breath as the great courts of the south, and the crown's prestige grows with every foreign visitor who marvels at the collection.
      desc_zh: 画廊在选帝侯的亲自主持下正式开放，画作、瓷器与雕塑终于齐备，供宫廷与来访显贵共赏。国内的艺术家们如今将德累斯顿与南方诸大宫廷相提并论，每一位为藏品所惊叹的外国来客，都让王室的声望更添一分。
