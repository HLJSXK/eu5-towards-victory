      title_zh: 圣地脚手架搭起
      desc_en: Masons erect scaffolding along the worn stone of the sacred precincts, and the long-deferred repair of Jerusalem's holiest walls finally becomes visible work rather than royal promise.
      desc_zh: 石匠沿圣地磨损的石墙搭起脚手架，耶路撒冷最神圣城墙那早已延宕的修缮，终于从王室的承诺化为可见的劳作。
      cost:
      - type: scaled_gold
        value: -7
    - title_en: The Processional Ways Are Paved Anew
      title_zh: 游行大道重新铺石
      desc_en: Old paving stones worn smooth by centuries of pilgrims are lifted and reset along the processional routes between the city's sanctuaries.
      desc_zh: 数百年朝圣者踏磨光滑的旧石板被逐一起出，重新铺设于连接各圣所的游行大道之上。
      cost:
      - type: artwork
        value: 1
    - title_en: The Walls Are Restored Stone by Stone
      title_zh: 城墙逐石修复
      desc_en: Engineers rebuild weakened stretches of the city walls, careful to match the old stone's color and cut so the repair honors rather than replaces the city's ancient face.
      desc_zh: 工匠修复城墙中薄弱的段落，刻意选用与旧石相近的颜色与切割方式，使修缮不失古城原有的面貌，而非取而代之。
      cost:
      - type: scaled_gold
        value: -9
    - title_en: A Dispute Between Quarters Is Settled
      title_zh: 平息街区之争
      desc_en: A quarrel over a shared shrine's access threatens to unravel months of careful work, until the governors broker a rotating schedule that satisfies every quarter's claim.
      desc_zh: 一处共用圣所的通行权之争几乎毁掉数月来的苦心经营，直到总督们协调出一套轮值方案，方才平息各区诉求。
