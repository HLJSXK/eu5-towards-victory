        value: -60
    - title_en: The Design of Peacocks Is Approved
      title_zh: 孔雀造型定案获准
      desc_en: Master craftsman Bebadal Khan presents sketches of a canopy borne on golden peacocks, their tails spread in enameled splendor, and the emperor gives his approval with a single nod. Workshops across the capital begin gathering gold bar by bar.
      desc_zh: 巧匠贝巴达尔·汗呈上设计图样，只见金孔雀托举华盖，尾羽以珐琅彩绘展开，光华夺目，皇帝仅颔首一笑便准了此案。都城内各作坊即刻开始一根根收集金条。
      cost:
      - type: scaled_gold
        value: -6
    - title_en: The Golden Frame Is Cast
      title_zh: 金座骨架浇铸成形
      desc_en: Goldsmiths pour molten gold into the molds for the throne's frame, the true labor of construction finally underway after months of design and gathering. Sparks and firelight fill the workshop through the night.
      desc_zh: 金匠将熔金浇入宝座骨架的模具之中，历经数月的设计与筹备，真正的营造之工终于展开。作坊内彻夜炉火通明，火星四溅。
      cost:
      - type: gold
        value: -90
    - title_en: Rubies and Emeralds Are Set
      title_zh: 红绿宝石镶嵌入座
      desc_en: Jewelers set rubies, emeralds, and diamonds into the frame in patterns meant to catch the light of the audience hall from every angle. A single misplaced stone, it is whispered, could cost a craftsman his position.
      desc_zh: 珠宝匠将红宝石、祖母绿与钻石依图案嵌入座架，务求从谒见殿内任何角度望去皆熠熠生辉。据传若有一颗宝石镶嵌失当，工匠恐将因此丢了差事。
      cost:
      - type: honor
        value: -12
    - title_en: The Peacocks Spread Their Enameled Tails
      title_zh: 孔雀展开珐琅尾羽
      desc_en: The golden peacock figures are completed at last, their tails inlaid with enamel in blues and greens so vivid that courtiers claim they seem almost to move. The canopy is fitted above them, ready to shade the seated emperor.
      desc_zh: 金孔雀终于铸造完成，尾羽以蓝绿珐琅精心点缀，色泽鲜活，朝臣们私下议论仿佛这尾羽真会随风轻颤。华盖随即安放其上，只待遮护端坐其中的帝王。
      cost:
      - type: prestige
        value: -25
    - title_en: The Throne Is Assembled in the Diwan-i-Khas
      title_zh: 宝座于私谒殿组装就位
      desc_en: Every gilded panel and jeweled inlay is carried into the Diwan-i-Khas and fitted together beneath the watchful eye of the court architect. Guards are posted at every door as the final pieces slide into place.
      desc_zh: 每一块镀金饰板与镶宝嵌片皆被抬入私谒殿，在宫廷建筑师的注视下逐一拼装到位。最后几件构件安放妥当之际，殿门四周早已布满守卫。
      cost:
      - type: honor
        value: -18
    - title_en: The Emperor Takes His Seat
      title_zh: 皇帝登座受贺
      desc_en: The emperor ascends the finished throne for the first time before an assembled court of nobles, envoys, and priests, its jeweled splendor confirming the majesty of his rule for all who witness it. The throne's reflected glory settles permanently over the realm.
      desc_zh: 皇帝首次登临这座落成的宝座，接受贵族、使节与祭司的朝贺，其珠光宝气向在场每一位见证者宣告着王朝的威严。此后，这份映照四方的荣光便长久笼罩着整个王国。
      cost:
      - type: prestige
        value: -40
      - type: legitimacy
        value: -20
