      desc_en: The Shah's court commissions a new qanat to draw hidden mountain water beneath the dry plateau toward Isfahan, promising fields where there was only dust.
      desc_zh: 沙阿宫廷下令开凿新坎儿井，将高原干旱地表之下山中的隐水引向伊斯法罕，许诺在尘土之地开出良田。
      cost:
      - type: scaled_gold
        value: -4
    - title_en: The Muqannis Read the Land
      title_zh: 掘井匠人勘察地脉
      desc_en: Master muqannis walk the plateau at dawn, judging the slope of the land and the whisper of buried water by shadow and soil alone, before a single shaft is dug.
      desc_zh: 掘井大师在破晓时分踏勘高原，仅凭地势坡度与泥土的气息判断地下水脉的走向，方才决定第一口竖井的位置。
