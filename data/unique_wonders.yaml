      desc_zh: 一圈城垣与塔楼合围主塔，护城河随之开挖并引河水灌注，将要塞封入其此后数百年不变的层层防御之中。
      cost:
      - type: manpower
        value: -60
    - title_en: A Wall Collapses and Is Rebuilt Stronger
      title_zh: 城墙坍塌重筑更坚
      desc_en: A newly raised stretch of wall gives way into the Thames mud one wet season, and the constable orders it rebuilt on driven piles, deeper and heavier than before.
      desc_zh: 某个多雨的季节，一段新筑城墙陷入泰晤士河的淤泥之中，工程总管下令以更深、更重的木桩重新筑造，务求坚固。
