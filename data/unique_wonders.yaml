    - title_en: Royal Inspectors Descend the Shaft
      title_zh: 王室监察官下井巡查
      desc_en: Royal inspectors are appointed to descend into the existing workings and assess where new galleries should be driven, lantern light flickering against walls already streaked with crystal. Their reports are sent directly to the crown treasury.
      desc_zh: 王室监察官奉命下入现有矿道，评估应向何处开凿新的巷道，灯笼光影在已然布满晶盐纹路的矿壁上摇曳闪烁。他们的勘察报告直呈王室财库。
