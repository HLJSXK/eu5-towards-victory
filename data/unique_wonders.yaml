    - title_en: Consulting the Scholars of the Courtyard
      title_zh: 咨询庭院学者
      desc_en: Jurists and scholars from the mosque's teaching courtyards are consulted on the proper form the expanded precinct must take, ensuring no addition offends the sanctity of the old walls. Pilgrims already gather at the gates to watch the plans unfold.
      desc_zh: 来自清真寺讲学庭院的法学家与学者们，就扩建部分应遵循的适当形制展开磋商，确保任何新增建筑都不致冒犯古老墙垣的神圣。朝圣者们已聚集在门前，观望方案的展开。
      cost:
      - type: religious_influence
        value: -10
    - title_en: Gathering Stone from the Desert Edge
      title_zh: 自沙漠边缘运石
      desc_en: Caravans haul stone and timber in from the desert edge, blessed by the city's imams before being stacked near the prayer hall. Water basins are cleaned and refilled in anticipation of the pilgrims to come.
      desc_zh: 商队从沙漠边缘运来石料与木材，在堆放于礼拜大殿附近之前，先接受城中伊玛目的祝福。蓄水池被清洗并重新蓄满，以迎接即将到来的朝圣者。
      cost:
      - type: scaled_gold
        value: -6
    - title_en: Work Begins on the Sacred Walls
      title_zh: 圣墙正式动工
      desc_en: Masons begin the true construction of the expanded precinct walls, the desert light catching new stone beside the old. What was prayer and planning now rises as arcades and prayer halls in the Ifriqiyan sun.
      desc_zh: 石匠们开始对扩建圣区墙垣的真正施工，沙漠日光洒在新旧石料交界之处。曾经的祈祷与规划，如今在伊夫里基亚的阳光下化作拱廊与礼拜大殿。
      cost:
      - type: scaled_gold
        value: -8
    - title_en: The Prayer Halls Extend
      title_zh: 礼拜大殿向外延伸
      desc_en: Rows of horseshoe arches extend the prayer hall deeper into the precinct, columns salvaged and new alike standing shoulder to shoulder. Craftsmen work through the heat of the day, resting only at the call to prayer.
      desc_zh: 一排排马蹄形拱券将礼拜大殿向圣区深处延伸，旧柱与新柱并肩而立。工匠们顶着白日的酷热劳作，只在唤礼声中稍作歇息。
      cost:
      - type: artwork
        value: 1
    - title_en: The Minaret Is Raised Higher
      title_zh: 宣礼塔加高
      desc_en: The great minaret is raised another story, its call now carrying further across the rooftops of Kairouan. Pilgrims from as far as the Hejaz begin to speak of the city as third in sanctity only to Mecca and Medina.
      desc_zh: 宏伟的宣礼塔又加高一层，唤礼声如今能传遍凯鲁万的更远屋顶。远至希贾兹的朝圣者开始称颂此城，谓其神圣仅次于麦加与麦地那。
      cost:
      - type: devotion
        value: -22
    - title_en: The Courtyards Are Paved in Marble
      title_zh: 庭院铺设大理石
      desc_en: Marble slabs are laid across the great courtyard, worn smooth in memory of the pilgrims who will cross it for centuries to come. Scholars resume their teaching circles in the shade of the new arcades even as the last stones are set.
      desc_zh: 大理石板铺满大殿前的庭院，仿佛提前磨出未来数百年朝圣者踏过的痕迹。最后几块石板尚未铺定，学者们已在新拱廊的阴凉下重开讲学之圈。
      cost:
      - type: artwork
        value: 1
    - title_en: Kairouan's Sanctity Is Renewed
      title_zh: 凯鲁万圣地重焕荣光
      desc_en: The enlarged precinct is formally consecrated as pilgrims and scholars fill its courtyards, the minaret's call carrying the news across Ifriqiya. Kairouan's standing as a holy city endures thereafter as a lasting comfort to the faithful throughout the realm.
      desc_zh: 扩建后的圣区正式举行祝圣仪式，朝圣者与学者挤满庭院，宣礼塔的呼声将喜讯传遍伊夫里基亚。凯鲁万作为圣城的地位自此长存，成为举国信众恒久的慰藉。
      cost:
      - type: religious_influence
        value: -25
      - type: devotion
        value: -30
