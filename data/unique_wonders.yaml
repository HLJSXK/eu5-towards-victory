      desc_en: A royal charter establishes the Wieliczka works as a crown enterprise, its salt to be mined, weighed, and sold under strict royal oversight. Local villagers already familiar with the brine springs are the first recruited as diggers.
      desc_zh: 王室特许状将维利奇卡盐矿定为直属王室的产业，所产之盐须依王室严格监管来开采、称量与出售。早已熟悉当地盐泉的村民，成为最先被征募的挖掘工。
      cost:
