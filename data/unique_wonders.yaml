      title_zh: 第一座穹顶升起
      desc_en: Masons lay the footing of the first covered hall, and the ribbed brick dome that will crown the bazaar begins its slow climb above the market stalls.
      desc_zh: 工匠为第一座有顶大厅打下基础，那座日后将雄踞巴扎之上的肋拱砖穹顶开始缓缓升高。
      cost:
      - type: manpower
        value: -60
    - title_en: The Vaulted Lanes Take Shape
      title_zh: 拱廊巷道渐次成形
