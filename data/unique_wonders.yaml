    - title_en: The Warehouses Rise on the Riverbank
      title_zh: 河岸仓库始建
      desc_en: Masons break ground on the great fortified warehouses beside the river, their thick walls meant to outlast both flood and thief, as the first timber piles are driven for the new quays.
      desc_zh: 石匠在河畔为坚固的仓储城堡破土动工，厚墙意在抵御洪水与盗贼，新码头的第一批木桩也随之打入河床。
      cost:
      - type: manpower
        value: -25
    - title_en: The Armed Escort Is Mustered
      title_zh: 护航舰队集结
      desc_en: Warships of the Armada de la Guardia gather at the river mouth, their captains drilled in convoy discipline against corsairs and rival crowns lurking beyond the bar.
      desc_zh: 护卫舰队的战船在河口集结，船长们反复演练护航队形，以防备潜伏在浅滩之外的海盗与敌国舰船。
      cost:
      - type: navy_tradition
        value: -2
    - title_en: The Ledger Halls Are Vaulted
      title_zh: 账册厅堂封顶
      desc_en: The Casa de Contratacion's vaulted archive rises stone by stone, built to hold decades of manifests, royal fifths, and the disputed claims of a thousand returning sailors.
      desc_zh: 贸易署的拱顶档案厅逐石垒起，用以存放数十年的货单、王室五一税记录，以及无数归航水手的争议索赔。
      cost:
      - type: scaled_gold
        value: -6
    - title_en: A Fleet Lost, A Fleet Rebuilt
      title_zh: 舰队折损，舰队重建
      desc_en: Storms off the Azores claim a laden galleon, and for a season the crown fears ruin; shipwrights and financiers press on regardless, determined that no single wreck will halt the Indies trade.
      desc_zh: 亚速尔群岛外的风暴吞没一艘满载的大帆船，一时举国惶恐；但造船匠与金主仍不为所动，誓言绝不让一次海难阻断印度群岛的贸易。
      cost:
      - type: gold
        value: -100
    - title_en: The Treasure Fleet Comes Home
      title_zh: 珍宝舰队凯旋归航
      desc_en: Bells ring across Sevilla as the loaded galleons round the bend of the Guadalquivir at last, their holds cracked open before cheering crowds, and the Carrera de Indias is declared the enduring engine of the crown's wealth.
      desc_zh: 满载的大帆船终于绕过瓜达尔基维尔河湾，塞维利亚钟声齐鸣，人群欢呼中舱门开启，印度航线自此被宣告为王室财富永恒的引擎。
