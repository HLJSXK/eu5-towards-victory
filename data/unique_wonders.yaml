      title_zh: 阿尔卡萨巴城墙首砌
      desc_en: Masons lay the first course of the Alcazaba's defensive walls along the ridge, and the red silhouette that will give the Alhambra its name begins to rise against the sky.
      desc_zh: 石匠沿山脊砌起阿尔卡萨巴堡垒防御墙的第一层砖石，那道日后令阿尔罕布拉宫得名的赭红轮廓，开始映衬在天际之间。
      cost:
      - type: gold
        value: -50
    - title_en: The Comares Palace Opens Its Courtyards
      title_zh: 科马雷斯宫庭院渐开
      desc_en: Beyond the fortress walls the Comares Palace takes shape around a long reflecting pool, its halls arranged for audiences and quiet counsel alike.
      desc_zh: 在城墙之内，科马雷斯宫沿着一方长长的倒影水池渐次成形，殿堂布局既宜朝会又便密议。
      cost:
      - type: prestige
        value: -25
    - title_en: Muqarnas and Stucco Fill the Court of Lions
      title_zh: 狮庭雕饰蜂窝穹顶
      desc_en: Craftsmen carve honeycombed muqarnas vaults and lace the walls with stucco filigree around the new Court of Lions, its twelve marble beasts set to guard the central fountain.
      desc_zh: 匠人在新建的狮子庭院四周雕出蜂窝状的钟乳拱顶，并以镂空灰泥缠绕四壁，十二尊大理石狮像环卫中央喷泉。
      cost:
      - type: artwork
        value: 1
    - title_en: Envoys Are Received Beneath the Arches
      title_zh: 拱廊之下初迎使节
      desc_en: Foreign envoys are received for the first time beneath the palace's carved arches, and verses praising the sultan are read aloud as gifts are exchanged in the courtyard.
      desc_zh: 外国使节首次在宫殿雕花拱廊之下获得接见，庭院中互赠礼物之际，颂扬苏丹的诗句被高声诵读。
      cost:
      - type: honor
        value: -18
    - title_en: The Palace City Is Dedicated
      title_zh: 宫城落成，权柄永固
      desc_en: With fountains running and the last stucco panel set in place, the palace city is formally dedicated before the court, its walls declared a seat of treaties and unbroken royal authority.
      desc_zh: 喷泉已然流淌，最后一面灰泥雕板也已装竣，宫城在满朝文武见证下正式落成，其宫墙自此被宣告为缔结盟约与王权永固之地。
      cost:
      - type: prestige
        value: -40
      - type: legitimacy
        value: -20
