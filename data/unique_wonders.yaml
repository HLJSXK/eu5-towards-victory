      value: 8
    stages:
    - title_en: The Canton System Is Proclaimed
      title_zh: 一口通商诏令颁布
      desc_en: An imperial edict confines all foreign trade to a single stretch of Guangzhou's waterfront, to be managed by a licensed guild of hong merchants. Word spreads down the Pearl River before the ink has dried.
      desc_zh: 朝廷诏令将一切对外贸易限于广州江岸一隅，交由领有牌照的行商公所统辖。诏文墨迹未干，消息已顺珠江传开。
      cost:
      - type: gold
        value: -50
    - title_en: The Waterfront Is Marked Out
      title_zh: 江岸划地
      desc_en: Officials pace the muddy bank outside the city walls, dividing the shore into plots for each trading nation. Fishermen are paid to relocate their moorings downstream.
      desc_zh: 官员在城墙外的泥岸上踏勘丈量，将江滨划分为各贸易国的地段。渔民则领取补偿，将泊船移至下游。
      cost:
      - type: scaled_gold
        value: -4
    - title_en: Timber and Hong Merchants Assemble
      title_zh: 木石与行商齐聚
      desc_en: Barges bring timber, brick, and stone down from the delta, while the newly chartered hong merchants pool capital to raise the first warehouses. Compradors are recruited for their command of foreign tongues.
      desc_zh: 驳船从三角洲各地运来木材、砖石，新领牌照的行商们则集资兴建首批货栈。买办因通晓外语而被延揽录用。
      cost:
      - type: scaled_gold
        value: -6
    - title_en: The First Factory Foundations Are Laid
      title_zh: 首批商馆奠基
      desc_en: Piles are driven into the riverbank mud to bear the weight of the first factory buildings. What was until now surveyed plots and pooled capital finally becomes timber and brick rising above the water.
      desc_zh: 木桩打入江岸淤泥，以承托首批商馆建筑的重量。此前不过是划定的地段与集来的资金，如今终于化作水面之上渐起的砖木。
      cost:
      - type: scaled_gold
        value: -7
    - title_en: Foreign Flags Rise Along the Bund
      title_zh: 万国旗帜临江而立
      desc_en: Each trading nation raises its own flag and facade along the waterfront, the British, Dutch, and other hongs each distinct in style. The riverfront begins to look like nowhere else in the empire.
      desc_zh: 各贸易国沿江各自升起本国旗帜、修建风格各异的商馆，英、荷诸行样式互不相同。这段江岸渐渐成为帝国境内独一无二的景象。
      cost:
      - type: cultural_influence
        value: -6
    - title_en: Warehouses Fill with Tea and Silk
      title_zh: 茶丝瓷器堆满货栈
      desc_en: Chests of tea, bolts of silk, and crates of porcelain stack floor to ceiling inside the new warehouses, awaiting the next outbound fleet. Hong merchants tally every crate against strict quotas.
      desc_zh: 茶箱、丝绸与瓷器箱笼在新建货栈中层层堆叠至顶，只待下一支出港船队。行商们逐一清点，严守配额之限。
      cost:
      - type: gold
        value: -90
    - title_en: The Wharves Never Sleep
      title_zh: 码头彻夜不息
      desc_en: Linguists and compradors shuttle between merchants late into the night as ships crowd the anchorage, and a fire one season forces hasty repairs to two of the hongs. The wharves rebuild busier than before.
      desc_zh: 通事与买办深夜仍穿梭于商贾之间，泊船挤满江面；一场大火曾迫使两处商馆仓促重修。码头重建之后，反倒比先前更加繁忙。
      cost:
      - type: scaled_gold
        value: -8
    - title_en: The Thirteen Factories Stand Complete
      title_zh: 十三行终告落成
      desc_en: The full row of factory houses now lines the Pearl River, flags snapping above wharves loaded with goods bound for every ocean. Canton's trade and its careful diplomacy with foreign captains now steadily enrich and honor the whole realm.
      desc_zh: 整排商馆已沿珠江排列成行，旗帜在满载货物、面向四海的码头上空猎猎招展。广州的贸易与其对外国船长审慎周旋的外交手腕，从此持续为整个国家带来财富与声望。
      cost:
      - type: gold
        value: -130
