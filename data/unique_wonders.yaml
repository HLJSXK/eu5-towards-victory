      title_zh: 八座礼拜堂环立中心
      desc_en: Eight lesser chapels rise brick by brick around the tall central tower, each shaped and sized differently, honoring the saints of each battle won on the road to Kazan.
      desc_zh: 八座较小的礼拜堂在高耸中塔四周逐砖砌起，各自形制不同，分别纪念通往喀山之路上每场战役所应验的圣人。
