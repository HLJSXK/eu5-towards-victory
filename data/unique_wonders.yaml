    - title_en: Surveying the Desert Stations
      title_zh: 勘定沙漠驿站
      desc_en: Surveyors and Bedouin guides ride ahead through the arid waystations of the pilgrimage route, marking wells, shade, and grazing ground where each year's caravan must rest.
      desc_zh: 测量官与贝都因向导策马先行，穿过朝觐路线上干旱的驿站，标记出每年商队歇脚所需的水井、荫蔽与牧地。
      cost:
