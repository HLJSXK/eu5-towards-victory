    stages:
    - title_en: The Sun King Chooses His Marsh
      title_zh: 太阳王择定沼泽之地
      desc_en: Louis XIV declares that his father's modest hunting lodge at Versailles shall become a seat of government to eclipse every court in Christendom, its marshes drained and its gardens to stretch beyond sight. Colbert is summoned to find the funds no treasury has yet imagined.
      desc_zh: 路易十四宣布，其父在凡尔赛留下的简陋猎庄，将化作一座令基督教世界所有宫廷黯然失色的执政之所，沼泽将被排干，花园将延展至目力不及之处。柯尔贝尔奉命筹措国库前所未及的资金。
      cost:
      - type: prestige
        value: -15
    - title_en: Le Notre Surveys the Grounds
      title_zh: 勒诺特勘测园地
      desc_en: Andre Le Notre paces the marshy park with rope and compass, laying out sightlines that will one day run a mile straight from the palace's central window. Thousands of laborers begin diverting streams to feed the fountains not yet built.
      desc_zh: 安德烈·勒诺特手持绳索与圆规踏勘沼泽园地，规划出日后将从宫殿正窗笔直延伸一英里的视线轴线。数千名劳工开始改道引水，为尚未建成的喷泉预作准备。
      cost:
      - type: scaled_gold
        value: -5
    - title_en: The Marsh Is Drained by Decree
      title_zh: 奉旨排干沼泽
      desc_en: Engineers dam and channel the stagnant waters of the Versailles valley, and the king's own physicians warn of the fevers that plague the workmen through the long labor. Louis presses on regardless, visiting the muddy site himself to mark its progress.
      desc_zh: 工程师们截断并疏导凡尔赛谷地的死水，宫廷御医警告长期劳作中工人染上的热病日益蔓延。路易不为所动，亲自前往泥泞的工地视察进度。
      cost:
      - type: manpower
        value: -35
    - title_en: The Marble Court Is Laid
      title_zh: 大理石庭院奠基
      desc_en: The first stones of the Cour de Marbre are set upon the drained ground, and the outline of the central corps de logis rises where the old hunting lodge once stood. Planning gives way at last to masons, scaffolding, and the true labor of stone.
      desc_zh: 大理石庭院的第一批石块铺设于已排干的地面之上，中央主楼的轮廓在旧日猎庄的遗址上渐渐显现。规划终于让位于石匠、脚手架与真正的营造之工。
      cost:
      - type: scaled_gold
        value: -8
    - title_en: The Ambassadors' Staircase Climbs
      title_zh: 使节阶梯拾级而上
      desc_en: The grand Escalier des Ambassadeurs rises in polychrome marble, designed so that foreign envoys must climb past painted allegories of the king's glory before ever reaching his presence. Le Brun's workshops fill the palace with canvases glorifying the reign.
      desc_zh: 华丽的使节阶梯以多彩大理石建成，其设计使外国使节必须先经过一幅幅颂扬国王荣耀的寓意画作，方能得见天颜。勒布伦的画坊满载画布，将整座宫殿装点得尽显王朝盛世。
      cost:
      - type: honor
        value: -15
    - title_en: The Hall of Mirrors Takes Shape
      title_zh: 镜厅渐露真容
      desc_en: Mansart's great gallery is roofed and glazed with hundreds of mirrors smuggled and bartered past Venice's jealous guilds, each pane reflecting the gardens beyond seventeen towering windows. Gilders and sculptors labor for years beneath scaffolding that hides the hall from view.
      desc_zh: 芒萨尔设计的宏伟长廊已封顶，装上数百面从威尼斯行会的严密封锁中辗转购得的镜子，每一面都映照着十七扇高窗外的园林。镀金匠与雕塑家在遮蔽长廊的脚手架下辛劳经年。
      cost:
      - type: gold
        value: -90
    - title_en: The Grand Canal Is Filled
      title_zh: 大运河终注满水
      desc_en: Water is drawn from as far as the Eure river to fill the mile-long Grand Canal, upon which the king will one day stage mock naval battles and gondola processions gifted by Venice. The gardens, once bare marsh, now rival the finest of Italy.
      desc_zh: 水源远从厄尔河引来，注满长达一英里的大运河，日后国王将在此举行模拟海战与威尼斯所赠贡多拉船队的巡游。曾经的荒芜沼泽，如今园林之美已可与意大利最负盛名者相媲美。
      cost:
      - type: cultural_influence
        value: -12
    - title_en: The Court Removes to Versailles
      title_zh: 朝廷迁驻凡尔赛
      desc_en: Louis XIV formally transfers his government and nobility from the Louvre to Versailles, and the assembled court processes through the finished Hall of Mirrors under a thousand candle flames. From this day the palace itself becomes an instrument of rule, binding the nobility to the Sun King's gaze.
      desc_zh: 路易十四正式将政府与贵族由卢浮宫迁至凡尔赛宫，满朝文武在千盏烛火映照下的镜厅中列队而行。自此，这座宫殿本身便成为统治的工具，将贵族牢牢系于太阳王的注视之下。
      cost:
      - type: prestige
        value: -45
      - type: honor
        value: -20
