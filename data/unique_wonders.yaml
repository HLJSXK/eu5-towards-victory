      title_zh: 第一口竖井凿下
      desc_en: Diggers break ground on the first vertical shaft, and basket by basket the excavated earth rises to the surface as the true channel begins its slow path underground.
      desc_zh: 掘井人在第一口竖井破土，篮筐一趟趟将挖出的泥土运上地面，真正的地下渠道自此开始其缓慢的延伸。
      cost:
      - type: manpower
        value: -20
    - title_en: The Line of Shafts Marches Across the Plain
      title_zh: 竖井行列横贯平原
      desc_en: A chain of vertical shafts marches visibly across the plateau's surface, each one a breathing hole for the tunnel below, dug at exact intervals only the muqannis can judge.
      desc_zh: 一列竖井在高原地表上清晰延伸，每一口都是地下隧道的透气孔，其间距唯有掘井大师才能精准拿捏。
      cost:
      - type: scaled_gold
        value: -6
    - title_en: The Tunnel Meets the Hidden River
      title_zh: 隧道贯通暗河
      desc_en: Deep beneath the plain, diggers break through into the cold rush of buried water, and word spreads across Isfahan that the mountain's hidden river has been found at last.
      desc_zh: 在平原深处，掘井人凿穿岩层，触及地下奔涌的冰冷水流，山中暗河终被寻获的消息随即传遍伊斯法罕。
      cost:
      - type: gold
        value: -70
    - title_en: A Collapse Is Overcome
      title_zh: 塌方之后再度掘进
      desc_en: A shaft collapses in the soft earth near the tunnel's midpoint, burying tools and nearly a digger with it, but the muqannis shore the passage with timber and press the line onward.
      desc_zh: 隧道中段的一口竖井在松软地层中坍塌，工具乃至一名掘井人险些被埋，掘井匠们以木料加固通道，仍执意继续掘进。
      cost:
      - type: manpower
        value: -30
    - title_en: The Water Reaches the Gardens
      title_zh: 渠水终至花园
      desc_en: Water pours at last from the qanat's mouth into the terraced gardens and fields below Isfahan, and the plateau's ancient art of hidden irrigation is declared a permanent gift to the realm's soil.
      desc_zh: 渠水终于自坎儿井出口涌入伊斯法罕城下的梯田与花园，这门古老的地下引水技艺自此被宣告为赐予全国土地的永恒馈赠。
      cost:
      - type: gold
        value: -120
