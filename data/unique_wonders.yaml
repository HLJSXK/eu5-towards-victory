      title_zh: 苏丹敕建朝觐之路
      desc_en: In the name of the Servant of the Two Holy Sanctuaries, the Sultan orders a guarded road built for every pilgrim who walks toward Mecca, binding the empire's honor to their safe passage.
      desc_zh: 以两圣地仆人之名，苏丹下令为每一位前往麦加的朝觐者修建一条设防之路，将帝国的荣誉与朝圣者的平安系于一身。
      cost:
