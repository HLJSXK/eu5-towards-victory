    - title_en: Travertine Arrives From Tivoli
      title_zh: 蒂沃利石料运抵罗马
      desc_en: Blocks of travertine are hauled in from the quarries at Tivoli, while bronze and marble are commissioned from across Italy for the coming church.
      desc_zh: 蒂沃利采石场的大理石块被陆续运抵罗马，青铜与大理石构件也从意大利各地征集而来，为这座教堂预作储备。
      cost:
      - type: scaled_gold
        value: -7
    - title_en: Bramante's Piers Rise for the Crossing
      title_zh: 布拉曼特四柱初立
      desc_en: Architect Donato Bramante's four great piers rise to support the crossing, and for the first time Romans passing the site see the true scale of the church taking form.
      desc_zh: 建筑师多纳托·布拉曼特设计的四根巨型立柱开始为十字交叉部提供支撑，路过此地的罗马人第一次真切看清了这座教堂的宏大规模。
      cost:
      - type: gold
        value: -60
    - title_en: Michelangelo's Dome Ribs Take Shape
      title_zh: 米开朗基罗肋拱初架
      desc_en: Decades after Bramante's death, Michelangelo takes up the design and raises the ribbed frame of the great dome above the crossing, defying his own advancing age to see it started.
      desc_zh: 布拉曼特辞世数十年后，米开朗基罗接手设计，在十字交叉部之上架起穹顶的肋拱骨架，不顾自身年迈，执意要亲眼看它动工。
      cost:
      - type: artwork
        value: 1
    - title_en: Successive Architects Carry the Work Forward
      title_zh: 数代匠师接力续建
      desc_en: Architect follows architect across the decades, Raphael, then Sangallo, then Michelangelo again, each inheriting an unfinished church and pressing it further toward completion.
      desc_zh: 数十年间建筑师前后相继，拉斐尔、小桑加洛，而后再度是米开朗基罗，每一位都接手一座未竟的教堂，将其向完工再推进一程。
      cost:
      - type: artwork
        value: 1
    - title_en: Pilgrims Gather as the Facade Rises
      title_zh: 立面渐起，信众云集
      desc_en: The nave and facade climb at last above the piazza, and pilgrims already gather before the unfinished front, drawn by rumor of the marvel taking shape within.
      desc_zh: 中殿与正立面终于在广场之上耸起，朝圣者已然聚集在这尚未竣工的殿前，只因传闻中殿内正孕育着一桩奇迹。
      cost:
      - type: religious_influence
        value: -20
    - title_en: The Basilica Is Consecrated Over the Apostle
      title_zh: 圣殿祝圣，信仰泽国
      desc_en: The Pope consecrates the finished basilica before cardinals and pilgrims crowded into the piazza, and the church over St. Peter's tomb is declared to carry the faithful's devotion across the whole realm from this day.
      desc_zh: 教皇在挤满广场的枢机与朝圣者见证下为竣工的圣殿举行祝圣大典，这座立于圣彼得墓上的教堂，自此被宣告将信众的虔诚传遍全国。
      cost:
      - type: devotion
        value: -28
      - type: papal_authority
        value: -18
