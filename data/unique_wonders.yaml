    stages:
    - title_en: The Khan Orders the Walls Restored
      title_zh: 可汗下令修复城墙
      desc_en: The Khan of Khiva, surveying crumbling mudbrick and sand-choked gates, orders the ancient walls of the Ichan Kala restored to their old strength and glory. Heralds ride out to the oasis villages calling for masons skilled in the old desert clay.
      desc_zh: 希瓦汗审视着已然坍圮的土坯城墙与被沙尘淤塞的城门，下令将伊坎卡拉这座古城的城墙修复至昔日的坚固与荣光。信使骑马奔赴绿洲各村落，召集擅长古法沙漠黏土工艺的匠人。
      cost:
      - type: scaled_gold
        value: -4
    - title_en: Clearing Sand From the Old Gates
      title_zh: 清理古城门积沙
      desc_en: Laborers clear generations of drifted sand from the base of the Ata-Darvoza and other old gates, exposing foundations laid by rulers long since forgotten. Caravans are pressed to carry straw and clay from the oasis fields to feed the coming brickworks.
      desc_zh: 劳工们清理阿塔达尔瓦扎等古老城门根基处数代积累的流沙，露出早已被遗忘的历代统治者所奠下的地基。商队被征调，从绿洲农田运来稻草与黏土，供应即将开工的制砖场。
      cost:
      - type: scaled_gold
        value: -5
    - title_en: Imams Bless the Restoration
      title_zh: 伊玛目为修复工程祝圣
      desc_en: Imams walk the old walls reciting prayers for the safety of the workers and the endurance of the restored city, while brickmakers mix straw, clay, and desert sand in the old proportions handed down for centuries. The first restored courses rise along the most ruined stretch of wall.
      desc_zh: 伊玛目沿古城墙巡行诵经，祈求工匠平安、城池永固；制砖匠则按照世代相传的古法比例，调和稻草、黏土与沙漠沙土。第一批修复的砌层，沿着城墙损毁最严重的一段拔地而起。
      cost:
      - type: devotion
        value: -10
    - title_en: The Ichan Kala's Walls Take New Clay
      title_zh: 伊坎卡拉城墙覆上新泥
      desc_en: Fresh mudbrick courses rise atop the ancient foundations of the Ichan Kala, the true labor of restoration finally underway after the clearing and the blessing. Scaffolds of poplar poles line the walls as masons work through the cool desert mornings before the heat of day.
      desc_zh: 崭新的土坯砖层在伊坎卡拉古老的地基之上垒起——经过清理与祝圣之后，真正的修复劳作终于展开。白杨木杆搭成的脚手架沿城墙一字排开，石匠们趁沙漠清晨的凉爽时分抓紧劳作，赶在酷热来临之前收工。
      cost:
      - type: gold
        value: -60
    - title_en: The Turquoise Minaret Grows Squat and Wide
      title_zh: 绿松石宣礼塔渐宽渐壮
      desc_en: Builders lay the broad turquoise-tiled base of a great minaret meant to dwarf every tower in Bukhara, though it will forever stand unfinished at its intended height. Tile-setters cover its lower courses in bands of blue and green glaze under the desert sun.
      desc_zh: 工匠们铺设一座宏伟宣礼塔宽阔的绿松石琉璃塔基，其规模原本志在超越布哈拉的任何一座塔楼，尽管它终将永远停留在未达预定高度的模样。镶砖工人在沙漠烈日下，为塔身下段铺上一圈圈蓝绿相间的琉璃。
      cost:
      - type: scaled_gold
        value: -7
    - title_en: Madrasas Rise Along the Caravan Street
      title_zh: 经学院沿商道拔地而起
      desc_en: New madrasas rise along the main street between the inner walls, their carved wooden doors and turquoise portals restored to welcome students and travelers passing through the oasis gate. Caravan merchants haggle in the shade of scaffolding that still clings to the facades.
      desc_zh: 新的经学院沿内城墙之间的主街拔地而起，其雕花木门与绿松石门楼经修复一新，迎候途经绿洲城门的学生与旅人。商队商贩们在仍紧贴立面的脚手架阴影下讨价还价。
      cost:
      - type: gold
        value: -75
    - title_en: The Kunya-Ark Regains Its Splendor
      title_zh: 库尼亚阿尔克重现辉煌
      desc_en: Craftsmen restore the tiled iwans and audience halls of the old Kunya-Ark citadel, gilding the throne room ceiling and repainting the harem's carved wooden columns. The Khan inspects the near-finished quarter, testing every doorway with his own hand.
      desc_zh: 工匠们修复库尼亚阿尔克旧堡的琉璃门廊与觐见大厅，为王座厅的天花板重新贴金，并为后宫雕花木柱重新上色。希瓦汗亲自巡视这片接近完工的宫殿区，亲手试探每一扇门户是否稳固。
      cost:
      - type: scaled_gold
        value: -9
    - title_en: The Walled City Gleams Again
      title_zh: 内城再放光彩
      desc_en: The Khan rides the full circuit of the restored walls as imams recite blessings from every gate, declaring the Ichan Kala renewed for another age of caravans and scholars. From this day the walled city's restored splendor lends fresh weight and standing to the Khan's rule across the khanate.
      desc_zh: 希瓦汗骑马巡行修复一新的城墙全程，各城门处的伊玛目齐声诵读祝祷词，宣告伊坎卡拉这座古城已为新的商队与学者时代焕然重生。自此日起，这座内城焕然一新的辉煌，为汗王在整个汗国内的统治增添了新的分量与威望。
      cost:
      - type: scaled_gold
        value: -11
      - type: gold
        value: -110
