      title_zh: 旧城终告落成
      desc_en: Sana'a stands finished, its tower houses and covered souks thriving beneath the mountain light, and from this day its trade and its reputation carry the realm's name far beyond the passes.
      desc_zh: 萨那城终于建成，塔楼与顶棚市集在山间光影中兴旺不息，自此日起，其贸易与名声都将随商队跨越山口，传扬四方。
