        value: -5
    - title_en: Cobalt and Master Potters Arrive
      title_zh: 青料与名匠齐聚
      desc_en: Blue cobalt pigment is carried in from distant mines, and renowned potters are summoned from across Jiangxi to lend their skill. Clay yards fill with prepared paste waiting for the wheel.
      desc_zh: 青花钴料自远方矿地运抵，江西各处名匠亦奉召前来贡献技艺。泥场中已备好等待上轮的陶泥。
      cost:
      - type: gold
        value: -60
    - title_en: The First Dragon Kiln Is Dug
      title_zh: 龙窑初凿
      desc_en: Laborers cut the long sloped chamber of the first dragon kiln into the hillside above Fuliang. What was until now clay pits and gathered craftsmen becomes, for the first time, a working furnace.
      desc_zh: 民工在浮梁山坡上凿出第一座龙窑的斜长窑室。此前不过是泥矿与召集来的匠人，如今终于化作一座可以点火的窑炉。
      cost:
      - type: scaled_gold
        value: -6
    - title_en: Blue and White Takes Its Form
      title_zh: 青花初显其形
      desc_en: Painters kneel over unfired vessels, laying cobalt brushstrokes of dragons, waves, and plum blossoms with practiced speed. Each piece passes through a dozen hands before it ever nears the fire.
      desc_zh: 画工跪伏于未烧的坯胎前，以熟练笔法勾勒龙纹、波涛与梅枝。每件瓷坯在入窑之前，都要经十余双手传递打磨。
      cost:
      - type: cultural_influence
        value: -6
    - title_en: The Imperial Mark Is Stamped
      title_zh: 印戳御款
      desc_en: Inspectors walk the cooling racks smashing any vessel with the faintest flaw, and only the flawless bear the reign mark on their base. Shards pile high outside the workshop gates.
      desc_zh: 检验官巡视冷却架，凡有丝毫瑕疵者当即敲碎，唯完美无瑕之器方可于底部落款年号。碎片堆积如山，堆在作坊门外。
      cost:
      - type: scaled_gold
        value: -7
    - title_en: The Kilns Never Go Cold
      title_zh: 窑火昼夜不息
      desc_en: Demand from the court grows faster than the kilns can answer, and fires are kept burning day and night through the season. A guild of kiln workers forms to share the ceaseless labor and its risks.
      desc_zh: 朝廷所需日增，窑炉产能渐难跟上，一季之内昼夜不熄火。窑工遂结成行会，共担这无休止的劳作与风险。
      cost:
      - type: gold
        value: -100
    - title_en: Jingdezhen's Wares Reach the World
      title_zh: 景德镇瓷器行销天下
      desc_en: The dragon kilns stand at full strength, their blue-and-white porcelain now carried by caravan and ship far beyond Jiangxi's hills. Every workshop in the realm learns something from Fuliang's discipline, and its trade enriches the crown for generations.
      desc_zh: 龙窑已臻全盛，其青花瓷器由商队与海船运出江西群山，远销四方。国中各地作坊皆从浮梁之法中获益，其贸易亦令朝廷世代受惠。
      cost:
      - type: gold
        value: -150
