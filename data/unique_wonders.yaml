      desc_zh: 巴伐利亚公爵下令兴建一座皇家啤酒坊，既解慕尼黑百姓之渴，又能充盈公国国库。在第一口铜锅悬挂之前，制桶匠与酿酒师们已在庭院里举杯相庆。
