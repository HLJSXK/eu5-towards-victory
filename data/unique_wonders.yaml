    stages:
    - title_en: The King Decrees a Seat Worthy of the Crown
      title_zh: 国王诏令重建王座之城
      desc_en: The king decrees that the hilltop above Krakow be rebuilt as a residence worthy of the Polish crown, its old walls too weathered to properly reflect the realm's standing. Heralds carry the proclamation to every corner of the kingdom within the season.
      desc_zh: 国王诏令，命将克拉科夫城上的山丘重建为一座配得上波兰王冠的居所，昔日的旧墙早已风化残破，不足以彰显国家应有的威仪。传令官在这一季之内便将诏书传遍王国的每一个角落。
      cost:
      - type: legitimacy
        value: -12
    - title_en: The Hilltop Is Cleared
      title_zh: 山丘清整以待兴建
      desc_en: Old ruins atop Wawel hill are cleared away, and master builders are summoned from across the kingdom to survey the ground overlooking the Vistula. The bishop blesses the site before a single new stone is set.
      desc_zh: 瓦维尔山上的旧日废墟被彻底清除，全国各地的能工巧匠应召而来，勘测这片俯瞰维斯瓦河的高地。主教在第一块新石安放之前，先行为这片土地祈福。
      cost:
      - type: devotion
        value: -10
    - title_en: Stone and Timber Are Gathered
      title_zh: 石木之材广为筹集
      desc_en: Wagons of quarried stone and timber climb the hill road toward Wawel, while the defensive walls are platted to enclose both the future castle and the cathedral beside it. Guilds of masons pledge their finest craftsmen to the royal project.
      desc_zh: 满载采石与木料的车队沿山道缓缓驶向瓦维尔，防御城墙的规划也同时展开，欲将未来的城堡与一旁的大教堂一并纳入其中。石匠行会纷纷派出手艺最精湛的工匠，投身这项王室工程。
      cost:
      - type: scaled_gold
        value: -5
    - title_en: The Royal Foundations Are Laid
      title_zh: 王室地基正式奠定
      desc_en: Foundations for the new royal residence are laid across the hilltop, the true building of Wawel Castle finally underway after a season of clearing and gathering. Masons work through autumn rains to see the first walls rise before winter.
      desc_zh: 新王室居所的地基沿山顶铺展开来，历经一季的清整与备料，瓦维尔城堡真正的营造终于展开。石匠们冒着秋雨劳作，只求在寒冬来临前让最初的城墙拔地而起。
      cost:
      - type: gold
        value: -60
    - title_en: The Castle Towers Rise Above the Vistula
      title_zh: 城堡塔楼耸立维斯瓦河畔
      desc_en: The castle's towers and great halls rise steadily above the Vistula, visible to boatmen and travelers long before they reach the city gates. Court craftsmen begin fitting the halls with tapestries and carved beams befitting a royal seat.
      desc_zh: 城堡的塔楼与大殿沿维斯瓦河畔渐次拔高，远在船夫与旅人抵达城门之前便已遥遥可见。宫廷工匠开始为殿堂装点挂毯与雕梁，务求配得上这座王室居所。
      cost:
      - type: honor
        value: -18
    - title_en: The Cathedral Towers Are Reinforced
      title_zh: 大教堂钟塔加固重修
      desc_en: The cathedral towers beside the castle are reinforced and raised alongside the new royal works, ensuring the two structures rise as one unified crown of the hill. Bells are recast to ring across both the castle courts and the city below.
      desc_zh: 城堡一侧的大教堂钟塔与新的王室工程一并加固增高，务求两座建筑浑然一体，共同加冕于山丘之巅。钟铃重新铸造，好让钟声同时回荡于城堡庭院与山下全城。
      cost:
      - type: religious_influence
        value: -14
    - title_en: The Court Chambers and Armory Are Completed
      title_zh: 议政厅与军械库落成
      desc_en: Court chambers, an armory, and quarters for the mustering guard are completed within the walls, banners of the realm hung from every hall in preparation for the castle's inauguration. A procession is already being planned to mark the occasion.
      desc_zh: 城墙之内的议政厅、军械库以及集结卫队的营房相继落成，各殿之内皆悬挂起王国旗帜，以备城堡启用大典。庆典所需的仪仗队列，早已在筹划之中。
      cost:
      - type: government_power
        value: -16
    - title_en: Wawel Is Consecrated as the Royal Seat
      title_zh: 瓦维尔正式奉为王座之地
      desc_en: The bishop consecrates Wawel Castle as the royal seat before a procession of nobles, guards, and clergy winding up the hill from the city below. From that day the hilltop's standing as the heart of the crown's authority is fixed for generations to come.
      desc_zh: 主教于贵族、卫队与神职人员自山下全城蜿蜒而上的盛大队列见证下，正式将瓦维尔城堡奉为王座之地。自那日起，这座山丘作为王权核心的地位，便在此后世代中稳固不移。
      cost:
      - type: legitimacy
        value: -22
      - type: honor
        value: -28
