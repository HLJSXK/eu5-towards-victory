      title_zh: 八角墙垣立起
      desc_en: Builders set the first ring of the octagonal core at Aachen, and Charlemagne's proclamation finally becomes stone rising beside the springs.
      desc_zh: 匠人在亚琛砌下八角核心结构的第一圈石墙，查理曼的宣告终于化作温泉旁拔地而起的石构，工程正式动工。
      cost:
      - type: scaled_gold
        value: -6
    - title_en: The Roman Columns Are Raised
      title_zh: 罗马立柱竖起
      desc_en: Ancient porphyry columns are hoisted into place within the chapel's upper gallery, binding the new empire's chapel to the glory of old Rome.
      desc_zh: 古老的斑岩石柱被吊装至礼拜堂上层回廊之中，将这座新帝国的礼拜堂与昔日罗马的荣光紧紧相连。
      cost:
      - type: artwork
        value: 1
    - title_en: The Golden Shrine Is Wrought
      title_zh: 金匣圣龛铸成
      desc_en: Goldsmiths complete the great reliquary meant to hold the chapel's holiest relics, its gilded panels catching candlelight beneath the dome.
      desc_zh: 金匠完成用以盛放礼拜堂最神圣圣物的巨大圣龛，鎏金嵌板在穹顶之下映着烛光熠熠生辉。
      cost:
      - type: artwork
        value: 1
    - title_en: The Royal Throne Is Set
      title_zh: 御座安放就位
      desc_en: A plain marble throne is placed in the upper gallery, positioned so future kings may be crowned within sight of the altar below.
      desc_zh: 一座朴素的大理石御座安放于上层回廊，其位置使未来的国王加冕之时，恰能望见下方的祭坛。
      cost:
      - type: legitimacy
        value: -20
    - title_en: Aachen Is Consecrated
      title_zh: 亚琛礼拜堂受祝圣
      desc_en: The Palatine Chapel stands consecrated beside Charlemagne's court, its throne and its relics binding crown and altar together, and from this day the realm's rulers draw their authority under its dome.
      desc_zh: 宫廷礼拜堂在查理曼宫廷之侧受祝圣，御座与圣物将王权与祭坛紧紧维系，自此日起，历代统治者的权威都将在这穹顶之下汲取而来。
      cost:
      - type: devotion
        value: -25
      - type: artwork
        value: 1
