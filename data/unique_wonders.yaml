      desc_zh: 石匠开始铺设修道院外墙的第一层砖石，圣谢尔盖的隐修所自此开始从一簇木屋蜕变为真正的信仰要塞。
      cost:
      - type: scaled_gold
        value: -8
    - title_en: The Scriptorium's Shelves Fill with Manuscripts
      title_zh: 缮写室书架渐满
      desc_en: Monks copy and illuminate manuscript after manuscript in the new scriptorium, and word spreads that the lavra's library will soon rival any in Muscovy.
      desc_zh: 僧侣在新建的缮写室中一册接一册地抄录、彩绘手抄本，这座大修道院的藏书即将媲美莫斯科公国任何藏书楼的传闻不胫而走。
