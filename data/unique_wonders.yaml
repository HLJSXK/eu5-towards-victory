      - type: scaled_gold
        value: -6
    - title_en: The Foundry Halls Rise
      title_zh: 铸造厅拔地而起
      desc_en: Stone walls climb around the first foundry hall and its adjoining drill courtyard. What was until now hauled ore and gathered craftsmen finally becomes hammers ringing against real anvils.
      desc_zh: 石墙在首座铸造厅及相邻的操演场周围竖立起来。此前不过是运来的矿石与召集来的匠人，如今终于化作铁锤真正敲击铁砧的回响。
      cost:
      - type: gold
        value: -65
    - title_en: The Foundries Cast Their First Guns
      title_zh: 首批火炮浇铸完成
      desc_en: Molten bronze is poured into clay molds for the first time, and the arsenal's earliest cannon barrels cool in rows across the yard. Plate armor production scales up in the adjoining halls to match.
      desc_zh: 熔化的青铜首次注入陶模，兵工厂最早的一批炮管在院中排列冷却。相邻厅堂内的板甲生产也随之扩大规模，与之配套。
      cost:
      - type: army_tradition
        value: -2
    - title_en: Guilds Set the Standard
      title_zh: 行会订立标准
      desc_en: Craftsmen's guilds organize within the arsenal to enforce a common standard across every blade, breastplate, and gun barrel produced. Drill courtyards ring daily with soldiers testing the new armor's fit and weight.
      desc_zh: 匠人行会在兵工厂内组织起来，为每一柄刀剑、每一副胸甲与每一门炮管订立统一标准。操演场每日回荡着士兵试穿新甲、掂量重量的声响。
      cost:
      - type: scaled_gold
        value: -8
    - title_en: Urgent Orders Strain the Yards
      title_zh: 紧急军令考验工场
      desc_en: Campaigns far from Milan send urgent requisitions that push the foundries and workshops past their usual pace, and apprentices are pressed into night shifts alongside the masters. The arsenal proves it can answer a war on short notice.
      desc_zh: 远方战事传来的紧急军令，令铸造厂与工坊超出寻常产能运转，学徒也被拉去与师傅一同值夜班。兵工厂由此证明，即便仓促之间也能应对战事所需。
      cost:
      - type: gold
        value: -100
    - title_en: The Milan Arsenal Stands Complete
      title_zh: 米兰兵工厂终告建成
      desc_en: The arsenal now runs at full capacity, its cannon, armor, and disciplined craftsmen renowned across every court in Italy. Every regiment armed from these workshops fights with a steadier line and a harder-won edge in the field.
      desc_zh: 兵工厂如今已全力运转，其火炮、铠甲与工匠的严谨技艺，声名传遍意大利各国宫廷。凡由此地武装的每一支部队，阵线更为稳固，战场上的锋芒也更加难以撼动。
      cost:
      - type: scaled_gold
        value: -12
      - type: army_tradition
        value: -4
