    - title_en: The Bluestones Begin Their Journey
      title_zh: 蓝砂岩启程远行
      desc_en: Word is sent to distant kin that the smaller bluestones must be dragged and floated across many days' travel, for the circle demands stone from far beyond the plain itself.
      desc_zh: 消息传向远方的同族，那些较小的蓝砂岩须经拖曳与漂运，跋涉多日方能抵达，因这座圆阵所需的石材远不止取自本地平原。
      cost:
      - type: artwork
        value: 1
    - title_en: The First Pit Is Dug at Dawn
      title_zh: 破晓凿下第一坑
      desc_en: Laborers with antler picks break the chalk earth at first light to dig the first stone-hole, and the plain's long-planned monument at last becomes a physical wound in the ground.
      desc_zh: 劳工手持鹿角镐在破晓时分凿开白垩土地，挖出第一个立石坑，这座筹划已久的建筑，终于化作大地上真实的开凿之痕。
      cost:
      - type: manpower
        value: -28
    - title_en: The Sarsens Are Raised Upright
      title_zh: 萨尔森石竖立而起
      desc_en: Ropes, levers, and dozens of straining backs haul each massive sarsen upright into its waiting pit, packed tight with rubble and timber wedges until it stands unaided.
      desc_zh: 绳索、杠杆与数十名劳工的合力，将每一块巨大的萨尔森石拉入等候的坑中，以碎石与木楔填实夯紧，直至其无需支撑亦能屹立。
      cost:
      - type: manpower
        value: -38
    - title_en: The Lintels Are Lifted Into Place
      title_zh: 门楣吊装就位
      desc_en: Carved lintel stones are levered slowly up timber ramps and locked onto the standing pillars with mortise joints, closing the great circle's silhouette against the sky.
      desc_zh: 凿刻好的门楣石沿木制斜坡缓缓撬升，以榫卯结构锁合于竖立的石柱之上，圆阵的轮廓自此在天际间闭合成形。
      cost:
      - type: devotion
        value: -12
    - title_en: The Bluestone Horseshoe Is Set
      title_zh: 蓝砂岩马蹄形立成
      desc_en: The long-traveled bluestones are finally set within the sarsen ring in their own horseshoe pattern, a labor that outlasted more than one generation of the tribes who began it.
      desc_zh: 历经长途跋涉的蓝砂岩终于在萨尔森石环内立成一道马蹄形，这项劳作已延续超过一代最初发起它的部族。
      cost:
      - type: artwork
        value: 1
    - title_en: The Sun Rises Through the Great Trilithon
      title_zh: 旭日穿透巨门石
      desc_en: At the solstice dawn, the sun climbs precisely through the great trilithon as priests and villagers watch in silence, and the circle is declared a permanent axis binding the land's tribes to the turning heavens.
      desc_zh: 至日破晓，旭日精准穿过巨大的门石，祭司与村民静默凝望，这座圆阵自此被宣告为永恒的轴心，将大地上的诸部族与运转不息的苍穹紧紧相连。
      cost:
      - type: devotion
        value: -22
      - type: tribal_cohesion
        value: -14
