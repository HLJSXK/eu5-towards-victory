    stages:
    - title_en: The Corsair Charter Is Sworn
      title_zh: 海盗特许誓约
      desc_en: The pasha proclaims Algiers a haven for corsair captains, granting charters to raid and ransom under the crown's protection. Captains swear their oaths over drawn cutlasses before the harbor mole has been widened an inch.
      desc_zh: 帕夏宣布阿尔及尔为海盗船长的庇护之所，授予特许状，准许其在王室庇护下劫掠、索赎。在港口防波堤尚未加宽分毫之前，船长们已按剑起誓。
      cost:
      - type: scaled_gold
        value: -4
    - title_en: Charting the Harbor Approaches
      title_zh: 勘测港口航道
      desc_en: Pilots chart the reefs and shoals guarding the harbor mouth, marking safe channels only the corsairs' own captains will know by heart. Ransom offices are cleared of clerks to make room for the coming trade in captives and prizes.
      desc_zh: 领航员勘测守卫港口入口的暗礁与浅滩，标出唯有海盗船长们自己才熟稔于心的安全航道。赎金事务所清空了原有文书，以腾出空间应对即将到来的俘虏与战利品交易。
      cost:
      - type: scaled_gold
        value: -5
    - title_en: Gathering Cannon and Lateen Sails
      title_zh: 筹措火炮与三角帆
      desc_en: Foundries cast cannon for the new batteries while shipwrights stitch lateen sails for the galleys still to come. Captains bless their crews at the mole's edge before the first stone of the sea wall is set.
      desc_zh: 铸炮厂为新炮台浇铸火炮，造船匠为尚未建成的桨帆船缝制三角帆。在防波堤的第一块基石落定之前，船长们已在防波堤边为麾下船员祝祷。
      cost:
      - type: scaled_gold
        value: -6
    - title_en: The Sea Walls Begin to Rise
      title_zh: 海堤正式动工
      desc_en: Masons begin laying the true stone of the harbor mole and its cannon batteries, the plans and oaths of earlier months finally taking physical shape against the Barbary surf. Corsair captains watch from their moored galleys as the first courses set.
      desc_zh: 石匠们开始铺设港口防波堤与炮台的实体石料，早前数月的图纸与誓言，终于在巴巴里海岸的浪潮中化为实体。停泊的海盗桨帆船上，船长们注视着第一层石料的砌定。
      cost:
      - type: scaled_gold
        value: -7
    - title_en: The Cannon Batteries Are Mounted
      title_zh: 炮台火炮就位
      desc_en: Heavy cannon are winched into place along the mole, their barrels trained on the harbor mouth to guard every prize brought home. Gunners test the range against a floating target to the cheers of watching crews.
      desc_zh: 重炮沿防波堤绞运就位，炮口对准港口入口，守护每一艘满载战利品归来的船只。炮手们对着漂浮靶标试射，围观的船员们高声喝彩。
      cost:
      - type: navy_tradition
        value: -2
    - title_en: The Warehouses Fill with Prizes
      title_zh: 仓库堆满战利品
      desc_en: New warehouses rise behind the quay to hold captured cargo, from Genoese silk to Spanish silver, awaiting sale or ransom. Captains haggle over shares in the ransom offices even as the roof timbers are still being fitted overhead.
      desc_zh: 码头后方新建的仓库用以存放缴获的货物，从热那亚丝绸到西班牙白银，等候出售或索赎。屋顶木梁尚未完全安装到位，船长们已在赎金事务所内就分成讨价还价。
      cost:
      - type: scaled_gold
        value: -8
    - title_en: The Galleys Take to Open Water
      title_zh: 桨帆船首次出海
      desc_en: The first squadron of corsair galleys slips past the finished mole and into open water, their lateen sails catching the wind for the first true cruise. Crowds gather on the sea walls to watch them vanish over the horizon.
      desc_zh: 第一支海盗桨帆船分队驶过竣工的防波堤，进入开阔海域，三角帆首次为真正的巡航张满海风。人群聚集在海堤上，目送船队消失在地平线尽头。
      cost:
      - type: navy_tradition
        value: -3
    - title_en: Algiers Stands as a Corsair Stronghold
      title_zh: 阿尔及尔正式成为海盗要塞
      desc_en: The pasha declares the port complete, its cannon, warehouses, and ransom offices standing as a permanent fortress of privateering along the Barbary coast. Corsair captains now sail under the crown's banner as a matter of course, and the treasury swells with every prize brought safely home.
      desc_zh: 帕夏宣布港口竣工，其炮台、仓库与赎金事务所自此成为巴巴里海岸上一座永久的私掠堡垒。海盗船长们如今理所当然地在王室旗帜下扬帆出海，每一艘平安归港的战利品船只，都让国库为之充盈。
      cost:
      - type: sailors
        value: -70
