      desc_en: King Gebre Mesqel Lalibela declares that Roha shall become a New Jerusalem, its churches to be carved whole from the living red rock rather than built stone upon stone.
      desc_zh: 国王格布雷·梅斯克尔·拉利贝拉宣告，罗哈城将化身新耶路撒冷，境内教堂不以石块垒砌，而要自赤色活岩之中整体凿出。
      cost:
      - type: devotion
        value: -12
    - title_en: The Red Tuff Outcrop Is Chosen
      title_zh: 择定赤色凝灰岩台
      desc_en: Priests walk the highland outcrops of red volcanic tuff seeking the site the king's vision demands, and it is said angels descend by night to mark where the first church must stand.
      desc_zh: 祭司踏遍高原上的赤色火山凝灰岩台地，寻访王之异象所指的地点，传说天使夜间降临，标定了第一座教堂应立之处。
      cost:
      - type: religious_influence
        value: -10
    - title_en: Trenches Are Cut Around the Living Stone
      title_zh: 深沟环凿，取石为材
      desc_en: Instead of gathering timber or marble, workers cut deep trenches around a chosen block of rock, isolating the very mountain that will become the church's material.
      desc_zh: 工匠不必筹集木材或大理石，只需绕着选定的岩块深挖沟壑，将那即将化身教堂本体的山岩本身孤立出来。
      cost:
      - type: manpower
        value: -40
    - title_en: The Carving Begins From Above
      title_zh: 由顶向下开凿始
      desc_en: Chisels bite into the isolated stone from the top down, and for the first time the outline of a church roof appears carved level with the surrounding ground.
      desc_zh: 凿子从被孤立的岩块顶部向下开凿，教堂屋顶的轮廓第一次显现出来，其高度竟与周围地面齐平。
      cost:
      - type: gold
        value: -50
    - title_en: The Church Emerges From the Trench
      title_zh: 沟中显形，教堂自立
      desc_en: Workers hollow the block from within as much as they carve it from without, and slowly a cross-shaped church emerges standing free in its own sunken courtyard.
      desc_zh: 工匠既从外部雕琢，也从内部掏空整块岩石，一座十字形教堂渐渐在自己的下沉庭院中独立成形。
      cost:
      - type: artwork
        value: 1
    - title_en: Windows and Tunnels Are Carved Through
      title_zh: 十字窗与地道贯通
      desc_en: Cross-shaped windows are pierced through the church's stone walls, and narrow tunnels are cut linking it underground to the churches carved beside it.
      desc_zh: 十字形窗孔被凿穿教堂石壁，狭窄的地下通道也随之开凿，将其与旁侧同样凿成的教堂彼此连通。
      cost:
      - type: artwork
        value: 1
    - title_en: Pilgrims Arrive Before the Work Is Done
      title_zh: 工未竣，信众已至
      desc_en: Word of the wonder spreads faster than the chisels can finish, and pilgrims begin arriving to pray in the trenches even while masons still work by torchlight above them.
      desc_zh: 奇迹的消息传播得比凿刻的进度还快，朝圣者已开始前来沟中祈祷，尽管石匠仍在他们头顶借着火把之光继续雕凿。
      cost:
      - type: religious_influence
        value: -22
    - title_en: The Churches Are Consecrated as One
      title_zh: 群堂同祝，恩泽全境
      desc_en: Priests lead a procession of hand crosses through the finished trenches and tunnels to consecrate every church as one holy complex, and Roha's blessing is declared to extend its grace across the whole kingdom.
      desc_zh: 祭司持手持十字架列队穿行于竣工的沟渠与地道之间，为所有教堂一并举行祝圣，罗哈的恩泽自此被宣告将遍及全国。
      cost:
      - type: devotion
        value: -28
      - type: artwork
        value: 1
