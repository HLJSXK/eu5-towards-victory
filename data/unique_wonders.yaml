    - title_en: Granite Is Quarried From the Ridge Itself
      title_zh: 就地开采山脊花岗岩
      desc_en: Workers open a quarry directly on the mountain's own granite outcrops, and surveyors lay out the terraces that will hold back the steep Andean slope.
      desc_zh: 工匠直接在山脊自身的花岗岩露头上开凿采石场，测量员随即划出梯田的走线，以固定安第斯陡坡的水土。
      cost:
      - type: scaled_gold
        value: -4
    - title_en: The First Retaining Walls Are Set
      title_zh: 首批石墙嵌入山坡
      desc_en: Stonemasons fit the first dry-stone retaining walls into the slope without mortar, each block shaped to lock against its neighbor, and the terraces begin their climb up the mountainside.
      desc_zh: 石匠不用灰浆，将第一批干砌石墙嵌入陡坡，每块石头都精心打磨以咬合相邻石块，梯田自此沿山势层层攀升。
      cost:
      - type: gold
        value: -45
    - title_en: Plazas and Temples Take Their Places
      title_zh: 广场神殿依次落位
      desc_en: Between the climbing terraces, plazas and temple foundations are set into place, the city's stone streets beginning to trace the shape of the ridge itself.
      desc_zh: 在层层攀升的梯田之间，广场与神殿的地基相继落定，城中石阶石路开始沿着山脊本身的轮廓延展成形。
      cost:
      - type: legitimacy
        value: -15
    - title_en: The Intihuatana Stone Is Carved
      title_zh: 太阳石凿刻定日
      desc_en: Masons carve the Intihuatana, the hitching post of the sun, from a single granite outcrop, its angles set to mark the solstices for every harvest to come.
      desc_zh: 石匠自一整块花岗岩露头中凿出因蒂瓦塔纳太阳石，其棱角经精确计算，以此为每年的至日与农时定准。
      cost:
      - type: religious_influence
        value: -18
    - title_en: Roads and Bridges Bind the Estate to Cusco
      title_zh: 栈道悬桥直通库斯科
      desc_en: Laborers under the mit'a rotation build the stepped road and rope bridges linking the new estate down through the cloud forest all the way to Cusco.
      desc_zh: 依米塔轮役制度征调的民夫，修筑起层层石阶栈道与绳索悬桥，将新落成的庄园穿越云雾森林，一路连通库斯科。
      cost:
      - type: manpower
        value: -70
    - title_en: Inti Raymi Consecrates the Citadel
      title_zh: 太阳祭典圣化山城
      desc_en: Priests hold the Inti Raymi rites at the finished sun temple as the whole citadel is consecrated, and the mountain's blessing is declared to flow down through the whole realm's harvests.
      desc_zh: 祭司在竣工的太阳神殿举行印蒂拉伊米太阳祭，整座山城由此获得圣化，山岳的护佑据传将随之泽及全国的收成。
      cost:
      - type: devotion
        value: -30
