      title_zh: 扎莫林开港纳四方
      desc_en: The Zamorin proclaims that Calicut's harbor shall welcome traders of every origin and faith without toll or favor, a policy already whispered of as far as Cairo and Canton. Merchants along the Malabar coast begin redirecting their cargoes toward the port.
      desc_zh: 扎莫林宣告，卡利卡特港将不分出身信仰、无需苛税偏私，广纳四方商旅，此项政策的美名早已远传开罗与广州。马拉巴尔沿岸的商人纷纷将货物转道驶向此港。
      cost:
      - type: gold
        value: -45
    - title_en: The Port Charter Is Drafted
      title_zh: 港埠章程草拟成文
      desc_en: Court officials draft a charter setting fair harbor dues and dispute procedures for the mixed community of Arab, Chinese, and Malabar merchants already crowding the shore. Pilots familiar with the monsoon currents are formally retained by the crown.
      desc_zh: 宫廷官员草拟港埠章程，为已然挤满岸边的阿拉伯、华人与马拉巴尔商贾群体，订立公平的港税与纠纷处理办法。熟悉季风潮汐的领航员，也正式受王室聘用。
      cost:
      - type: scaled_gold
        value: -4
    - title_en: Timber and Stone Are Gathered
      title_zh: 木石之材广为聚集
      desc_en: Timber cranes and cut stone are gathered along the shore in preparation for new warehouses, while officials of the Zamorin negotiate with visiting captains over where each nation's goods should be stored. The monsoon market grows more crowded by the week.
      desc_zh: 岸边陆续聚集起木制起重架与凿好的石料，为兴建新仓库做好准备，扎莫林的官员则与来访船长商议各国货物应存放何处。季风集市一周比一周更加拥挤。
      cost:
      - type: gold
        value: -60
    - title_en: The First Dock Pilings Are Driven
      title_zh: 首批码头桩木打入
      desc_en: Laborers drive the first pilings into the harbor floor, the true building of Calicut's port now finally underway after seasons of negotiation and gathering. Arab dhow captains watch with keen interest, already planning where their ships will berth.
      desc_zh: 劳工将首批桩木打入港湾泥地，历经数季的协商与备料，卡利卡特港真正的营造终于展开。阿拉伯单桅帆船的船长们饶有兴致地在旁观望，早已盘算好船只将来停泊的位置。
      cost:
      - type: scaled_gold
        value: -6
    - title_en: Jetties Reach Out to the Dhows
      title_zh: 栈桥伸向单桅帆船
      desc_en: New jetties extend out to meet the anchored dhows and junks, cranes swinging bales of pepper and ginger ashore faster than the old rope-and-basket methods ever allowed. Warehouse foremen struggle to keep pace with the growing tally of incoming goods.
      desc_zh: 新建的栈桥向停泊的单桅帆船与帆船群延伸而去，起重臂将胡椒与生姜的货捆吊运上岸，速度远超昔日绳篮搬运的旧法。仓库工头几乎难以跟上日益攀升的到货清单。
      cost:
      - type: gold
        value: -85
    - title_en: The Spice Warehouses Are Completed
      title_zh: 香料仓库告竣
      desc_en: Great warehouses for pepper, cardamom, and cinnamon are completed along the waterfront, their weighing houses staffed by clerks fluent in Arabic, Chinese, and Malayalam alike. The smell of spice hangs permanently over the harbor district.
      desc_zh: 沿港湾一线，专储胡椒、豆蔻与肉桂的巨大仓库相继落成，其中的司秤所内，通晓阿拉伯语、汉语与马拉雅拉姆语的文书各司其职。港区自此终日弥漫着浓郁的香料气息。
      cost:
      - type: scaled_gold
        value: -8
    - title_en: The Customs Houses Line the Market Streets
      title_zh: 税关沿市集街道林立
      desc_en: Customs houses are raised along the crowded market streets, each staffed to assess goods fairly regardless of a merchant's flag or faith. The Zamorin's officials become known throughout the Indian Ocean trade for their evenhanded dealing.
      desc_zh: 税关沿熙攘的集市街道相继立起，无论商贾旗号信仰，皆一视同仁地核估货值。扎莫林的官员因公正无私的行事作风，在整个印度洋贸易圈内声名远播。
      cost:
      - type: gold
        value: -110
    - title_en: The Port Is Declared Open to the World
      title_zh: 港埠宣告通达四海
      desc_en: The Zamorin formally declares Calicut's port complete and open to the world, its docks, warehouses, and customs houses now running at full capacity through every monsoon season. Ships from Cairo to Canton set their courses toward its harbor lights.
      desc_zh: 扎莫林正式宣告卡利卡特港建设完工、通达四海，其码头、仓库与税关如今在每一个季风季节都满负荷运转。自开罗至广州，往来船只无不将航向对准这座港湾的点点灯火。
      cost:
      - type: scaled_gold
        value: -11
      - type: sailors
        value: -60
