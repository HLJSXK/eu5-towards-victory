    - title_en: The Emperor's Vow to His Mother
      title_zh: 永乐帝为母立誓
      desc_en: The Yongle Emperor decrees a great pagoda at Bao'en Temple, fulfilling a vow made in memory of Empress Ma. Court astrologers set an auspicious day for the first offerings.
      desc_zh: 永乐帝下诏于报恩寺兴建高塔，以偿多年前为纪念马皇后所许之愿。钦天监择定吉日，先行祭告。
      cost:
