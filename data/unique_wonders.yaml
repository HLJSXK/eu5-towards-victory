    stages:
    - title_en: The Metropolitan Proclaims a Holy Refuge
      title_zh: 都主教宣告兴建圣地
      desc_en: The Metropolitan of Kyiv, honoring the memory of the hermit Anthony who first dug his cell into the hillside above the Dnieper, proclaims the monastery's caves and grounds shall be rebuilt as a great lavra worthy of pilgrims from every principality. Monks across Rus send word that the caves of the holy fathers will soon see the light of new construction.
      desc_zh: 基辅都主教为纪念最初在第聂伯河畔山坡上凿穴隐修的隐士安东尼，宣告将这处洞穴修道院扩建为一座大型拉夫拉，足以迎接来自罗斯各公国的朝圣者。罗斯各地的修士纷纷传告：圣父们的洞穴即将迎来崭新的营造工程。
      cost:
      - type: devotion
        value: -15
    - title_en: Surveying the Caves Above the Dnieper
      title_zh: 勘测第聂伯河畔的洞穴
      desc_en: Monks and master builders descend into the near and far caves with torches, mapping the narrow passages and burial niches of the earlier hermits before any stone is laid above ground. Barges bring limestone block up the Dnieper from quarries downriver.
      desc_zh: 修士与工匠师傅们手持火把深入近洞与远洞，在地面动工之前，先行勘测早期隐修士留下的狭窄通道与葬穴壁龛。驳船沿第聂伯河而上，将下游采石场的石灰岩运抵此地。
      cost:
      - type: gold
        value: -50
    - title_en: Relics Carried in Procession
      title_zh: 圣髑游行
      desc_en: The relics of the venerable fathers are carried in solemn procession from the caves to the building site, chanted over by a choir of monks as princes and boyars kneel along the route. The first foundation stones for the great church are laid beneath their blessing.
      desc_zh: 圣洁诸位先父的圣髑在庄严的游行队伍中，被从洞穴抬往新建工地，僧侣唱诗班一路吟诵祝祷，公爵与波雅尔贵族沿途跪拜致敬。伟大教堂的最初基石，便在这份祝福之下奠定。
      cost:
      - type: artwork
        value: 1
    - title_en: The Dormition Cathedral's Walls Ascend
      title_zh: 圣母安息大教堂拔地而起
      desc_en: Byzantine-trained masons begin raising the stone walls of the great Dormition Cathedral above the caves, the true labor of building finally replacing procession and blessing. Scaffolds of birch and pine climb alongside the rising nave as workers haul stone up from the riverbank.
      desc_zh: 受拜占庭训练的石匠们开始在洞穴之上砌筑圣母安息大教堂的石墙——真正的营造劳作终于取代了游行与祝圣。桦木与松木搭成的脚手架随着渐渐升高的中殿一同攀升，工匠们从河岸将石料一趟趟运上来。
      cost:
      - type: manpower
        value: -70
    - title_en: Gilding the First Golden Dome
      title_zh: 为第一座金顶镀金
      desc_en: Craftsmen hammer thin sheets of gold leaf onto the cathedral's central dome, a costly labor meant to make the monastery visible to every boat passing on the Dnieper below. Pilgrims already gather at the gates to watch the dome catch its first sunlight.
      desc_zh: 工匠们将薄薄的金箔一片片捶打贴附于大教堂的中央穹顶之上——这项耗费不菲的工艺，旨在让修道院从第聂伯河上往来的每一艘船只都能望见。朝圣者已在大门外聚集，等待观看穹顶初次映照阳光的那一刻。
      cost:
      - type: gold
        value: -100
    - title_en: Scribes Fill the Scriptorium
      title_zh: 缮写室满座抄经僧
      desc_en: In new stone cells above the caves, monks bend over vellum and ink, copying chronicles, gospels, and lives of the saints that will carry the lavra's fame across Rus. The scratch of quills becomes as constant a sound as the masons' chisels below.
      desc_zh: 在洞穴上方新建的石室里，修士们伏案于羊皮纸与墨水之间，抄录编年史、福音书与圣徒传记，这些手稿将把这座拉夫拉的声名传遍整个罗斯。鹅毛笔的沙沙声，如今与楼下石匠的凿击声一样，成为终日不绝的背景音。
      cost:
      - type: artwork
        value: 1
    - title_en: Pilgrim Halls Open to the Faithful
      title_zh: 朝圣客舍向信众开放
      desc_en: New refectories and guest halls rise to house the growing tide of pilgrims descending from every principality to venerate the incorrupt relics of the caves. Merchants set up stalls outside the gates selling candles, icons, and bread for the journey home.
      desc_zh: 新建的食堂与客舍拔地而起，用以接待自各公国络绎而来、前来朝拜洞穴中不朽圣髑的日益增多的朝圣者。修道院大门外，商贩们摆起摊位，售卖蜡烛、圣像与供归途食用的面包。
      cost:
      - type: devotion
        value: -20
    - title_en: The Lavra Shines Above the Dnieper
      title_zh: 拉夫拉光耀第聂伯河
      desc_en: The Metropolitan consecrates the finished Dormition Cathedral and its gleaming dome in a liturgy heard from the riverbank far below, declaring the cave monastery a lavra second to none in all Rus. From this day its scriptoria and relics draw scholars and the faithful alike, quickening both learning and devotion across the realm.
      desc_zh: 都主教在礼拜仪式中为竣工的圣母安息大教堂及其熠熠生辉的穹顶举行祝圣典礼，那诵唱之声远在河岸之下也清晰可闻，宣告这座洞穴修道院已成为全罗斯首屈一指的大拉夫拉。自此日起，其中的缮写室与圣髑吸引着学者与信众纷至沓来，全国的求知与虔信之风由此并进。
      cost:
      - type: religious_influence
        value: -30
