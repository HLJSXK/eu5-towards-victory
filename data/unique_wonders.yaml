      title_zh: 塔霍河谷选定工坊
      desc_en: Sites are marked along the Tagus gorge where the fast water can turn the forge bellows and grinding wheels. The old smiths' quarter is expanded to make room for the crown's new workshops.
      desc_zh: 沿塔霍河谷选定数处场地，急流可驱动锻炉风箱与磨轮。旧日的锻匠坊区随之扩建，为王室新设的工坊腾出空间。
      cost:
