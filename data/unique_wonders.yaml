      title_zh: 城墙经受围城考验
      desc_en: A hostile force tests the young fortress walls one hard winter, and only the monastery's newly finished defenses and its garrisoned monks hold the lavra through the siege.
      desc_zh: 一个严酷的冬天，敌军试探这座尚年轻的要塞城墙，唯有修道院新筑的防御工事与驻守的僧侣，方使大修道院挺过这场围城。
