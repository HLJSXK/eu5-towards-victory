    stages:
    - title_en: Prince Henry Founds His School
      title_zh: 恩里克亲王创立航海学校
      desc_en: Prince Henry proclaims a school of navigation upon the windswept promontory at Sagres, gathering pilots, cartographers, and astronomers to his cause. The court whispers that the prince means to chart the very edge of the known world.
      desc_zh: 恩里克亲王在萨格里什海角这片风声不绝之地宣告设立航海学校，召集领航员、制图师与天文学者共襄其事。宫中私议，亲王志在绘出已知世界的最远边界。
      cost:
      - type: prestige
        value: -12
    - title_en: The Cliffside Site Is Secured
      title_zh: 崖顶校址落定
      desc_en: Builders mark out the school's grounds atop the sea cliffs near Lagos, where the Atlantic wind rarely stops testing every rope and shutter. Fishermen of the coast are consulted for their knowledge of currents and storms.
      desc_zh: 建造者在拉哥斯附近的海崖之上划定校址，此处大西洋的海风几乎从不停歇，日夜考验着每一根缆绳与窗板。沿岸渔民也因熟知洋流与风暴而受邀咨询。
      cost:
      - type: scaled_gold
        value: -4
    - title_en: Charts and Instruments Are Gathered
      title_zh: 星盘图籍陆续汇集
      desc_en: Astrolabes, portolan charts, and treatises on the stars are collected from every port that will part with them, some bought and some quietly copied. Scholars and pilots alike are drawn to Sagres by the prince's patronage.
      desc_zh: 星盘、波特兰海图与星象论著从各港口尽力搜罗而来，或购或抄，无所不用。学者与领航员皆因亲王的庇护而慕名齐聚萨格里什。
      cost:
      - type: research_progress
        value: -10
    - title_en: The Map Rooms Are Built
      title_zh: 地图室拔地而起
      desc_en: Stonemasons raise the first map rooms and observatory walls against the constant Atlantic wind. What was until now gathered charts and invited scholars finally becomes a real school standing on the cliff.
      desc_zh: 石匠顶着大西洋不歇的海风，砌起最初的地图室与观测台墙壁。此前不过是搜集来的图籍与延请来的学者，如今终于化作真正立于崖顶的学府。
      cost:
      - type: scaled_gold
        value: -6
    - title_en: The Caravel Is Refined
      title_zh: 卡拉维尔船型日臻完善
      desc_en: Shipwrights at Lagos test hull and sail designs against the reports pilots bring back from each new voyage, shaping the caravel into a vessel fit for open ocean. Every failed rig teaches the next attempt something worth keeping.
      desc_zh: 拉哥斯的造船匠依据领航员每次归航带回的报告，不断试验船体与风帆的设计，将卡拉维尔帆船打磨为适于远洋的船型。每一次失败的索具，都为下一次尝试留下值得保留的经验。
      cost:
      - type: navy_tradition
        value: -3
    - title_en: Pilots Learn the Stars
      title_zh: 领航员习练星象定位
      desc_en: Astronomers teach dead reckoning and stellar navigation to pilots gathered in the map rooms, and new charts are drawn each season as ships return with fresh coastlines. The library grows thick with corrected maps.
      desc_zh: 天文学者在地图室中向聚集的领航员传授推算航位与星象导航之法，每季船只归来带回新的海岸线，新图便随之绘就。藏书室中修订过的海图日渐增厚。
      cost:
      - type: research_progress
        value: -15
    - title_en: The First Expeditions Set Sail
      title_zh: 首批远征扬帆出海
      desc_en: Caravels finally push out from Lagos past every coast previously charted, and their pilots return with reports of shores no map at Sagres had yet shown. Each returning ship is met at the wharf like a hero.
      desc_zh: 卡拉维尔帆船终于自拉哥斯出发，驶过此前所有已知海岸线，领航员归来后带回萨格里什地图上从未标出的新海岸的消息。每一艘归航的船只，都在码头受到如英雄般的迎接。
      cost:
      - type: navy_tradition
        value: -4
    - title_en: Sagres Becomes the World's Chart Room
      title_zh: 萨格里什成为世界航海之枢
      desc_en: The school now stands as the realm's center of maritime knowledge, its pilots, charts, and ships pushing the horizon steadily outward. Every fleet that sails from these shores now carries Sagres's discipline and range with it, generation after generation.
      desc_zh: 这所学校如今已成为全国海事知识的中枢，其领航员、海图与船只持续将世界的疆界不断向外推展。此后每一支自此启航的舰队，都世代承袭着萨格里什的纪律与航程。
      cost:
      - type: prestige
        value: -35
      - type: navy_tradition
        value: -5
