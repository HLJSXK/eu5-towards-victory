        value: -12
    - title_en: The Porcelain Cabinets Are Fitted
      title_zh: 瓷器陈列柜安装完成
      desc_en: Cabinetmakers fit glass-fronted cases along the inner rooms to hold the electors' porcelain, arranged by color and glaze under the curators' watchful eye. Word spreads that even foreign courts have begun asking to view the collection.
      desc_zh: 橱柜匠在内室安装玻璃展柜，用以陈列选帝侯的瓷器，按色泽釉色分类摆放，策展人在一旁细心监督。消息传开，甚至外国宫廷也开始请求前来参观。
