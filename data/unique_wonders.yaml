    stages:
    - title_en: The Call to Sanctify Kairouan
      title_zh: 凯鲁万圣化之令
      desc_en: The ruler proclaims a great undertaking to enlarge and sanctify Kairouan's Great Mosque precinct, honoring the city's place as a beacon of faith in Ifriqiya. Imams lead prayers of thanksgiving before the first wall is touched.
      desc_zh: 统治者颁布诏令，宣布扩建并圣化凯鲁万大清真寺一带，以彰显该城作为伊夫里基亚信仰灯塔的地位。在动工触碰任何一堵墙壁之前，伊玛目已率众举行感恩祷告。
      cost:
      - type: devotion
