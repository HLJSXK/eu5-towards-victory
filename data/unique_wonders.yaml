    - title_en: Securing the Malt Stores
      title_zh: 筹措麦芽仓储
      desc_en: Ducal officials requisition barley and hops from the surrounding farms, storing them in dry lofts against the coming brewing season. Guild brewmasters inspect every sack before it is sealed away.
      desc_zh: 公国官员从周边农庄征调大麦与啤酒花，储存于干燥的阁楼，以备即将到来的酿造季。行会酿酒师逐袋检验，方才准许封存入库。
      cost:
