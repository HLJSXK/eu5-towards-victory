      title_zh: 水权分配仪式
      desc_en: Village elders and the Shah's officials gather to divide the qanat's future flow by the turning of a water-clock, so that every field downstream receives its fair share of hours.
      desc_zh: 村中长老与沙阿官员齐聚，依水钟的转动划分未来渠水的流量，使下游每一片农田都能分得公平的用水时辰。
