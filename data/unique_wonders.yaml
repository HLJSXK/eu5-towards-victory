    - type: harmony
      value: 10
    stages:
    - title_en: The Elders Call for the Great Mound
      title_zh: 长老号召兴建大冢
      desc_en: The chiefs and priest-elders of Cahokia gather at the great plaza to proclaim that the central mound shall be raised higher still, its summit to hold a temple worthy of the city's rising power over the American Bottom. Runners are sent to outlying farmsteads to summon labor for the coming season.
      desc_zh: 卡霍基亚的酋长与祭司长老们齐聚大广场，宣告中央土冢将再度加高，其顶部将建起一座配得上这座城市在美洲低地日益增长之权势的神庙。信使被派往周边农庄，召集来季的劳力。
      cost:
      - type: tribal_cohesion
        value: -8
    - title_en: The Basket Bearers Assemble
      title_zh: 背筐人齐聚而至
      desc_en: Thousands answer the call, each carrying woven baskets of soil from the bottomland fields to the mound's growing base, a labor as much of devotion as of muscle. The Woodhenge posts are consulted to mark the solstice by which the new season of building must begin.
      desc_zh: 数千人响应号召，各自背负编织筐篓，将低地田野的泥土运至土冢渐增的基座，这既是体力的劳作，也是虔诚的奉献。木质太阳历圈的立柱被用以确认冬至夏至，以此标定新一季营建的起始。
      cost:
      - type: manpower
        value: -30
    - title_en: The Plazas Are Leveled
      title_zh: 广场夷平取直
      desc_en: Laborers under the direction of the priest-planners level the great plazas around the central mound, aligning their edges to the same solar sightlines that govern the Woodhenge circle. Offerings of maize and shell beads are buried at the plaza's corners before the mound-building resumes.
      desc_zh: 祭司规划者指挥劳工将中央土冢周围的大广场夷为平整，并使其边界与木质太阳历圈所依循的日晷方位对齐。在土冢营建重新开始之前，玉米与贝珠祭品被埋入广场四角。
      cost:
      - type: artwork
        value: 1
    - title_en: The Summit Platform Is Raised
      title_zh: 顶台平台筑起
      desc_en: Basket loads of earth now rise in visible new terraces upon Monks Mound itself, and timber posts mark where the summit temple's frame will stand once the platform reaches its final height. What was gathering and ritual now becomes earth piled visibly skyward, tier upon tier.
      desc_zh: 一筐筐泥土如今在孟克斯大冢之上垒起清晰可见的新台阶，木柱标出待平台达到最终高度后，顶部神庙梁架将立之处。此前的集会与仪式，如今化作层层叠起、可见地拔向天空的泥土。
      cost:
      - type: manpower
        value: -35
    - title_en: The Palisade Rises Round the Precinct
      title_zh: 木栅环绕圣域
      desc_en: A great timber palisade, its posts driven deep and bark still fragrant, begins to encircle the ceremonial precinct at the city's heart, marking the sacred ground apart from the sprawling farmsteads beyond. Watchers report the wall's progress from bastion to bastion as it closes the circuit.
      desc_zh: 一道巨大的木栅栏，立柱深植，树皮犹带清香，开始环绕城市中心的祭祀圣域，将神圣之地与外围广袤的农庄分隔开来。守望者们逐座望楼通报木栅合围的进度。
      cost:
      - type: tribal_cohesion
        value: -10
    - title_en: The Summit Temple Is Framed
      title_zh: 顶部神庙立架
      desc_en: Cedar posts rise atop the completed platform to form the frame of the temple that will crown Monks Mound, its height now visible for miles across the flat bottomland. Craftsmen carve the temple's roof beams while priests below mark the days remaining until the summer solstice.
      desc_zh: 雪松木柱在已完工的平台之上竖起，构成即将加冕孟克斯大冢的神庙梁架，其高度如今在平坦的低地上数英里之外皆可望见。工匠们雕琢神庙的屋梁，山下的祭司则计算着距夏至还剩几日。
      cost:
      - type: artwork
        value: 1
    - title_en: The Lesser Mounds Are Joined
      title_zh: 群冢相连成局
      desc_en: Satellite mounds across the city are raised and reshaped to align with the central platform's sightlines, binding the outlying plazas into a single ceremonial geometry visible only from the sacred precinct itself. The city's full scale, seen from the summit, astonishes even its own builders.
      desc_zh: 城中各处的次级土冢被加高重塑，以与中央平台的视线相对齐，将外围广场纳入唯有站在圣域之中方能领略的统一祭祀格局。从顶端俯瞰，这座城市的完整规模，即便建造者本身也为之震撼。
      cost:
      - type: harmony
        value: -15
    - title_en: The Woodhenge Rite Consecrates the City
      title_zh: 木阳历仪式为城祝圣
      desc_en: At the appointed solstice dawn, the elders gather within the Woodhenge circle as the sun rises precisely between two marked posts, and the completed Monks Mound is declared the eternal heart of Cahokia. The city's mounds and plazas now stand bound in a single sacred order that will draw pilgrims from across the Mississippian world.
      desc_zh: 在既定的冬至或夏至破晓时分，长老们聚于木质太阳历圈之中，见旭日恰从两根标记立柱之间升起，业已完工的孟克斯大冢被宣告为卡霍基亚永恒的心脏。城中的土冢与广场自此归于同一神圣秩序，将吸引密西西比世界各地的朝圣者纷至沓来。
      cost:
      - type: artwork
        value: 1
      - type: harmony
        value: -20
