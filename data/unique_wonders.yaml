    stages:
    - title_en: The Senate Commissions the Waters
      title_zh: 元老院敕造引水渠
      desc_en: The Senate votes the funds for a new aqueduct to answer Rome's ever-thirstier fountains, and a Curator Aquarum is appointed to oversee the springs, channels, and arches yet to be built. Surveyors set out along the hills to trace a gradient the water itself will obey.
      desc_zh: 元老院投票拨款，为罗马日益干渴的喷泉修建新的引水渠，并任命一位水务总监，统管尚待兴建的水源、渠道与拱券。测量官沿丘陵勘察，寻找一条能让水流自然顺行的坡度。
      cost:
      - type: government_power
        value: -10
    - title_en: The Springs Are Claimed for Rome
      title_zh: 泉源归属罗马
      desc_en: Surveyors stake out a spring clear and cold enough for the aqueduct's source, and the land along its planned course is bought or requisitioned mile by mile. Quarrymen begin cutting the travertine that will face the great arches.
      desc_zh: 测量官选定一处清澈冰冷、足以作为引水渠源头的泉水，沿线土地按里程逐段购置或征用。采石工开始开凿将用于装饰宏伟拱券的石灰华。
      cost:
      - type: scaled_gold
        value: -6
    - title_en: Priests Bless the Channel's Path
      title_zh: 祭司为渠道祈福
      desc_en: Pontiffs walk the marked route to bless the ground where the sacred water will run, and the first specus channel is laid in trial sections near the spring head. Contracts are sealed with builders skilled in the opus caementicium that will bear the water's weight.
      desc_zh: 祭司沿标记的路线为神圣水流将经之地祈福，泉源附近首段渠道以试验性方式铺设。工程与擅长承重混凝土工艺的建筑商正式签约。
      cost:
      - type: religious_influence
        value: -10
    - title_en: The Arches Begin to Climb
      title_zh: 拱券开始拔起
      desc_en: Beyond the low ground where the channel could run level with the earth, laborers finally raise the first true piers, and Rome's countryside starts to grow its long rows of stone arches. What was surveyed line now becomes standing masonry reaching toward the city.
      desc_zh: 越过可与地面齐平的低地，劳工终于立起最初的桥墩，罗马乡野开始生出一排排绵延的石拱。曾经的测绘直线，如今化作向城中延伸的巍然砌体。
      cost:
      - type: scaled_gold
        value: -8
    - title_en: The Long Arcade Crosses the Campagna
      title_zh: 长拱廊横贯坎帕尼亚
      desc_en: Arch after arch marches across the Campagna, the specus riding atop them sealed and tested with running water at each finished span. Engineers race to close the gaps before the winter rains threaten the unfinished piers.
      desc_zh: 拱券一座接一座横跨坎帕尼亚平原，其上承载的渠道每段完工便注水试验、密封检验。工程师抢在冬雨危及未完工桥墩之前，加紧合拢缺口。
      cost:
      - type: manpower
        value: -35
    - title_en: The Water Enters the City Walls
      title_zh: 水流入城
      desc_en: The channel finally reaches Rome's walls and descends into a great distribution castellum, where lead pipes branch the flow toward fountains, baths, and the households of the wealthy. Fullers and bath-keepers along the route begin lobbying for the first connections.
      desc_zh: 渠道终于抵达罗马城墙，注入一座巨大的配水池，铅制水管由此分流至喷泉、浴场与富户宅邸。沿线的洗衣工与浴场主纷纷开始争取最早接入水源。
      cost:
      - type: scaled_gold
        value: -9
    - title_en: Fountains Rise Where Wells Once Stood
      title_zh: 喷泉取代旧井
      desc_en: Public fountains are set up in the crowded quarters that once relied on wells and the muddy Tiber, and the first baths fed by the new water open their doors to the public. Magistrates argue over how the flow should be shared between fountain, bath, and private villa.
      desc_zh: 曾经只能依赖水井与浑浊台伯河水的拥挤街区，如今立起了公共喷泉，最早由新水源供水的浴场也向民众开放。地方官员就水量应如何在喷泉、浴场与私家别墅之间分配争执不下。
      cost:
      - type: gold
        value: -80
    - title_en: Rome's Thirst Is Answered Forever
      title_zh: 罗马之渴永得解
      desc_en: Magistrates process to the main castellum to dedicate the finished aqueduct, and the water is let loose to run through fountains across the city in a single ceremonial rush. Rome's baths, households, and public squares now drink from a supply that will outlast the men who built it.
      desc_zh: 地方官员齐聚主配水池，为竣工的引水渠举行落成典礼，水流在同一时刻涌入全城的喷泉。罗马的浴场、家宅与广场自此拥有了一条足以传世的水源，其寿命将超越修建它的世人。
      cost:
      - type: gold
        value: -110
      - type: government_power
        value: -20
