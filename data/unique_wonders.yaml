      title_zh: 灰泥雕饰与镀金檐口
      desc_en: Italian stuccoists gild the cornices and mold ceiling roses above where the paintings will hang, giving the halls a splendor to match the collection they will house. Court gossip already calls it the finest room in Saxony.
      desc_zh: 意大利灰泥匠为日后悬挂画作的天花檐口镀金，塑出华丽的顶花，使展厅的富丽足以匹配即将陈列的藏品。宫廷间已流传，这将是萨克森最华美的房间。
