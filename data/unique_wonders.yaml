        value: -1
    - title_en: The Sultan Takes Formal Residence
      title_zh: 苏丹正式移居新宫
      desc_en: Mehmed II formally takes up residence within the finished palace, and Topkapi is declared the seat from which the empire's authority and its dealings with foreign courts will now be governed.
      desc_zh: 穆罕默德二世正式移居竣工的托普卡帕宫，此宫自此被宣告为帝国统御四方并与列国交涉的中枢所在。
      cost:
      - type: prestige
        value: -38
      - type: honor
        value: -22
