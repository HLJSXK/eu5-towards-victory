      desc_en: Messengers ride north with caravans to invite scholars from Fez and Marrakesh, and south along the river to gather teachers already renowned in Sahelian courts. Camel trains begin arriving laden with books before the courtyard walls are finished.
      desc_zh: 信使随商队北上邀请来自非斯与马拉喀什的学者，又沿河南下延请萨赫勒各宫廷已负盛名的教师。在庭院围墙尚未完工之前，满载书籍的骆驼商队已陆续抵达。
