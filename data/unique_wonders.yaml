      desc_en: The Nasrid sultan announces that a red-walled city of palaces shall rise on La Sabika hill above Granada, a seat fit to receive kings and envoys alike.
      desc_zh: 纳斯里王朝苏丹宣告，将在格拉纳达城外的萨比卡山上建起一座红墙宫城，足以接待列国君主与使节。
      cost:
      - type: prestige
