    stages:
    - title_en: The Doge Decrees the Great Yard
      title_zh: 元首颁布造船敕令
      desc_en: The Signoria proclaims that the Arsenale di Venezia shall be expanded beyond memory, its gates to swallow forests and its basins to launch a war fleet in a single tide. Bells ring across the Rialto as the arsenalotti are called to their oaths.
      desc_zh: 执政团宣布威尼斯军械库将扩建至前所未有的规模，其大门将吞噬整片森林，船坞将在一潮之内放下整支舰队。里亚尔托的钟声响起，军械工匠们被召来宣誓效忠。
      cost:
      - type: honor
        value: -12
    - title_en: Timber Fleets Down the Adige
      title_zh: 阿迪杰河上的木材船队
      desc_en: Oak and larch float downriver from the forests of Cadore and Montello, bound in rafts under the mark of the Republic. Overseers count each log against the ledgers of the Provveditori all'Arsenale.
      desc_zh: 橡木与落叶松从卡多雷和蒙特洛的森林顺流而下，扎成木筏，打上共和国的烙印。军械库监理官逐根清点，记入账册。
      cost:
      - type: scaled_gold
        value: -5
    - title_en: The Ropewalk Is Blessed
      title_zh: 绳索工坊受祝圣
      desc_en: Priests of San Pietro di Castello walk the length of the new tana, the great ropewalk, sprinkling holy water over coils of hemp destined for a hundred galleys. Master ropemakers swear their guild's ancient oath before the relics.
      desc_zh: 圣彼得堂的神父沿新建的长绳厂行走，为将供应上百艘桨帆船的麻绳缆绳洒下圣水祝圣。制绳大师们在圣物前重申行会的古老誓词。
      cost:
      - type: devotion
        value: -8
    - title_en: The First Dry Dock Is Cut
      title_zh: 首座干船坞破土动工
      desc_en: Stonemasons break ground on the Arsenale Nuovo, cutting the first of the great dry docks into the lagoon mud and piling. Wet earth gives way to timber piles and brick walls, and the true work of the Republic's floating power begins.
      desc_zh: 石匠们在新军械库开凿第一座巨大的干船坞，湿软的泻湖淤泥让位于木桩与砖墙。共和国海上力量的真正建造，自此开始。
      cost:
      - type: gold
        value: -50
    - title_en: The Basins Multiply
      title_zh: 船坞连环扩建
      desc_en: Basin after basin is added along the eastern quarter, each ringed with covered sheds so hulls may rise sheltered from sun and storm. Foremen boast that keel to launch now takes weeks, not years.
      desc_zh: 东区一座又一座船坞相继建成，四周搭起遮棚，船体得以在遮蔽下免受烈日风暴。工头们夸口道，从铺设龙骨到下水如今只需数周，而非数年。
      cost:
      - type: scaled_gold
        value: -8
    - title_en: The Foundries Roar
      title_zh: 熔炉昼夜不息
      desc_en: Bronze foundries are raised beside the basins to cast cannon for the galleys under construction, their furnaces lit day and night. The Arsenale begins to resemble less a shipyard than a small, self-sufficient city of fire and iron.
      desc_zh: 船坞旁竖起青铜铸炮厂，炉火昼夜不熄，为在建的桨帆船铸造火炮。军械库渐渐不再像单纯的造船厂，倒像一座自给自足、炉火与钢铁交织的小城。
      cost:
      - type: gold
        value: -70
    - title_en: The Assembly Line of Hulls
      title_zh: 船体流水造船法
      desc_en: Prefabricated ribs, planks, and rigging are stockpiled in vast magazines so that hulls may be assembled almost as fast as they are launched, a method that astonishes foreign envoys. Word spreads that the Arsenale can arm a galley between one sunrise and the next.
      desc_zh: 巨大的仓库中预先备好肋材、船板与索具，使船体几乎能与下水同步组装，这套方法令外国使节叹为观止。传言称，军械库可在一昼夜之间为一艘桨帆船装配完毕。
      cost:
      - type: scaled_gold
        value: -10
    - title_en: The Bucentaur Sails the Sposalizio
      title_zh: 金船巡礼，海洋婚礼
      desc_en: On Ascension Day the gilded Bucentaur glides from the Arsenale's gates to the Lido, and the Doge casts his ring into the sea to wed Venice to the waters she commands. The Republic's yards now stand ready to outbuild any rival fleet the Adriatic has seen.
      desc_zh: 耶稣升天节这天，镀金的金船从军械库大门驶向丽都岛，元首将戒指抛入海中，象征威尼斯与她所统治的海洋缔结婚约。共和国的船坞如今已能超越亚得里亚海历来所见的任何敌国舰队。
      cost:
      - type: navy_tradition
        value: -3
      - type: scaled_gold
        value: -12
