    - title_en: An Edict to Tame the Min River
      title_zh: 平定岷江的诏令
      desc_en: The governor proclaims that Chengdu's endless floods and droughts will end. Surveyors are sent upriver to study where the waters might be divided and led.
      desc_zh: 太守昭告成都平原，水患与旱情必将终结。测量人员溯流而上，勘察河道分流引水之处。
      cost:
      - type: government_power
        value: -8
    - title_en: The Riverbed Is Surveyed
      title_zh: 勘测河床
      desc_en: Engineers wade the shallows near Guankou, marking where the river splits around the mountains. Old villagers recall the floods of their grandfathers and point out the worst bends.
      desc_zh: 工匠在灌口浅滩涉水而行，标出岷江绕山分流之处。老农忆起祖辈曾遭的洪灾，指出河道最险的几处弯道。
      cost:
      - type: scaled_gold
        value: -4
    - title_en: Bamboo Cages and Willow Stakes
      title_zh: 竹笼与柳桩
      desc_en: Villages along the Min River weave giant bamboo cages and cut willow stakes by the cartload. Laborers are levied from nearby counties, and Li Bing's methods are recited like a craftsman's creed.
      desc_zh: 岷江沿岸的村落编织巨大竹笼，成车砍运柳木桩。附近州县征调劳力，李冰之法如匠人信条般被反复传诵。
      cost:
      - type: manpower
        value: -30
    - title_en: The Fish Mouth Splits the River
      title_zh: 鱼嘴分江
      desc_en: Stone and bamboo cages are lowered into the current at last, and the Min River is forced apart into inner and outer channels. Where surveyors once only pointed, the levee now stands.
      desc_zh: 石块与竹笼终于沉入激流，岷江被强行分作内外二江。曾经只是图纸上的标记，如今已是江中矗立的堤堰。
      cost:
      - type: scaled_gold
        value: -6
    - title_en: The Flying Sand Weir Is Raised
      title_zh: 飞沙堰筑成
      desc_en: A low spillway is built beside the levee to spill floodwater and silt back into the outer channel before it can bury the fields. Workers time the floods of summer to test its height.
      desc_zh: 堤旁筑起低矮溢洪道，将洪水与泥沙泄回外江，以免淤没良田。工匠借夏汛之势反复试验堰高。
      cost:
      - type: scaled_gold
        value: -5
    - title_en: Mount Yulei Is Cut Through
      title_zh: 凿穿玉垒山
      desc_en: Laborers heat and crack the rock of Yulei Mountain to open the Bottleneck Channel, admitting only a measured share of water toward the Chengdu Plain. Fire and cold water do the work no chisel could.
      desc_zh: 民夫以火烧水激之法，硬生生凿开玉垒山岩，开出宝瓶口，只放适量江水流向成都平原。凿子难成之事，交由烈火与冷水完成。
      cost:
      - type: manpower
        value: -40
    - title_en: The Depth Markers Are Set
      title_zh: 立卧铁为则
      desc_en: Stone fish-markers are sunk into the riverbed to tell dredgers each winter how deep the silt must be cleared. A rhyme is composed so every foreman, literate or not, remembers the rule.
      desc_zh: 石鱼与卧铁沉入江底，告知每年冬季清淤的深浅之度。一首口诀随之编成，使识字与不识字的工头都能牢记规矩。
      cost:
      - type: research_progress
        value: -10
    - title_en: The Land of Abundance Is Sealed
      title_zh: 天府之国由此奠定
      desc_en: The waters of the Min River now rise and fall exactly as the engineers intended, and the Chengdu Plain blooms into fields that never know drought or flood. Every mill and workshop downstream runs the steadier for it.
      desc_zh: 岷江水势从此涨落如工匠所愿，成都平原从此旱涝无忧，沃野千里。下游每一座作坊、每一间工场，都因此运转得更为稳固长久。
      cost:
      - type: yearly_gold
        value: -15
