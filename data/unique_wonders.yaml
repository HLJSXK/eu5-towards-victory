    - title_en: The Red Sandstone Quarries Open
      title_zh: 红砂岩矿场开采
      desc_en: Quarries near Agra are opened to supply the red sandstone that will give the new city its distinctive glow at sunset, while surveyors plat out courtyards around the saint's own hermitage. The emperor himself is said to inspect the early plans.
      desc_zh: 阿格拉附近的矿场开采出赋予新都日落时分独特赤红光泽的砂岩，测量师则在圣者隐修所周围规划出重重庭院。据传皇帝亲自过目了最初的图纸。
      cost:
      - type: scaled_gold
        value: -5
    - title_en: Master Builders Are Assembled
      title_zh: 能工巧匠齐聚一堂
      desc_en: Architects, calligraphers, and master masons from Persia, Central Asia, and India itself gather at the site, each contributing a distinct hand to what will become a city of mixed styles. Camps of laborers spring up along the ridge overnight.
      desc_zh: 来自波斯、中亚以及印度本土的建筑师、书法家与能工巧匠齐聚工地，各展所长，共同缔造出这座风格交融的都城。工地山脊沿线，劳工营帐几乎在一夜之间便林立而起。
      cost:
      - type: cultural_influence
        value: -8
    - title_en: The Palace Foundations Are Laid
      title_zh: 宫城地基正式奠定
      desc_en: Foundations for the palace complex are laid across the ridge, the true building of Fatehpur Sikri finally underway after months of planning and gathering stone. Masons work in relays through the cool desert nights to speed the labor.
      desc_zh: 宫城建筑群的地基沿山脊铺开，历经数月的筹划与备料，法塔赫布尔西格里真正的营造终于展开。石匠们利用沙漠夜晚的凉爽轮班劳作，以加快工程进度。
      cost:
      - type: gold
        value: -65
    - title_en: The Diwan-i-Khas Pillar Rises
      title_zh: 私谒殿石柱高高竖起
      desc_en: The single carved pillar at the heart of the Diwan-i-Khas is raised, its ornate capital destined to support a platform where the emperor will sit at the center of four radiating bridges. Craftsmen debate for weeks over the precise carving of its brackets.
      desc_zh: 私谒殿中心那根雕饰繁复的独柱高高竖立，其华美的柱头日后将支撑一座平台，皇帝将端坐其上，四座悬桥自此向外辐射而出。工匠们为柱头托臂的雕刻细节争论了数周之久。
      cost:
      - type: honor
        value: -15
    - title_en: The Buland Darwaza Commemorates Victory
      title_zh: 胜利之门以志战功
      desc_en: The towering Buland Darwaza gateway is built to commemorate a recent campaign in the Deccan, its inscription reminding all who pass beneath that the world is a bridge to be crossed rather than a home to be built upon. Its scale dwarfs every other gate in the empire.
      desc_zh: 高耸的胜利之门为纪念近来在德干的战功而建，其铭文提醒每一位从门下经过之人，世间不过是一座待人渡越的桥，而非可长居之家。其规模远超帝国境内任何其他城门。
      cost:
      - type: government_power
        value: -12
    - title_en: Scholars Gather in the Ibadat Khana
      title_zh: 学者齐聚礼辩之堂
      desc_en: The Ibadat Khana is completed and scholars of Islam, Hinduism, Christianity, and Zoroastrianism are invited to debate matters of faith before the emperor himself. Their arguments, carried late into the night, shape Akbar's growing conviction in a shared truth beneath all creeds.
      desc_zh: 礼辩之堂落成，伊斯兰教、印度教、基督教与祆教的学者纷纷受邀，于皇帝御前就信仰问题展开辩论。这些常常持续至深夜的争论，逐渐坚定了阿克巴心中一种超越教派、共通真理的信念。
      cost:
      - type: harmony
        value: -14
    - title_en: The Imperial City Is Inaugurated
      title_zh: 帝都正式启用
      desc_en: Akbar formally inaugurates Fatehpur Sikri as his capital, courtiers, envoys, and scholars processing through the Buland Darwaza in a display meant to be remembered for generations. The city's blend of faiths and counsel becomes a lasting model for governance across the empire.
      desc_zh: 阿克巴正式将法塔赫布尔西格里定为帝都，朝臣、使节与学者列队穿过胜利之门，场面盛大，意在让后世世代铭记。这座融汇诸教与谏议之城，从此成为帝国治理长久倚仗的典范。
      cost:
      - type: honor
        value: -25
      - type: legitimacy
        value: -20
