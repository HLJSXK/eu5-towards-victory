      title_zh: 斯特凡国王颁授学院敕令
      desc_en: King Stephen Báthory signs the charter raising the Jesuit college of Vilnius to the rank of academy and university, the first such institution in the Grand Duchy of Lithuania. Jesuit fathers and city elders parade the royal seal through the streets to the delight of gathered scholars.
      desc_zh: 国王斯特凡·巴托里签署敕令，将维尔纽斯的耶稣会学院升格为学院与大学——这是立陶宛大公国境内首座此类学府。耶稣会神父与市府长老们抬着盖有王印的敕令穿街游行，聚集的学者们无不欢欣鼓舞。
      cost:
      - type: honor
        value: -15
    - title_en: Clearing Ground by St. John's Church
      title_zh: 圣约翰教堂旁的场地清理
      desc_en: Jesuit fathers secure the old college grounds beside St. John's Church, buying out neighboring burgher houses to make room for lecture halls and a proper courtyard. Carts of limestone and timber begin arriving from the countryside around Vilnius.
      desc_zh: 耶稣会神父们买下圣约翰教堂旁的旧学院用地，并收购邻近市民住宅，以腾出空间建造讲堂与规整的庭院。满载石灰石与木材的大车，开始从维尔纽斯周边乡村陆续运抵。
      cost:
      - type: gold
        value: -55
    - title_en: The Rector Blesses the First Arcade
      title_zh: 校长为首座拱廊祝圣
      desc_en: The newly appointed rector blesses the site in a Latin mass attended by nobles and burghers alike, while masons begin cutting the stone piers for the university's signature arcaded courtyards. The first printing press is unpacked in a temporary shed to await its proper hall.
      desc_zh: 新任校长在贵族与市民共同参加的拉丁语弥撒中为校址祝圣，石匠们同时开始凿制石柱，用于修建大学标志性的拱廊庭院。第一台印刷机也已在临时棚屋中拆箱安置，静候正式厅堂落成。
      cost:
      - type: religious_influence
        value: -10
    - title_en: The Arcaded Courtyards Take Shape
      title_zh: 拱廊庭院初具规模
      desc_en: Stone piers and vaulted walkways begin rising around the first of what will become a dozen interlinked courtyards, the true building of the academy now underway in earnest. Students already crowd the unfinished cloisters between classes held in nearby chapels.
      desc_zh: 石柱与拱形回廊开始在未来将连成十余座相通庭院中的第一座周围拔地而起——学院真正的营造工程由此正式展开。学生们已挤满尚未完工的回廊，课间往返于附近的礼拜堂上课。
      cost:
      - type: manpower
        value: -70
    - title_en: Shelves Rise for the Great Library
      title_zh: 大图书馆书架落成
      desc_en: Carpenters build tall oak shelving for the university library, while professors from Kraków and Rome donate the first crates of books to fill it. Lecture halls above echo with the first formal disputations in philosophy and theology.
      desc_zh: 木匠们为大学图书馆搭建高大的橡木书架，来自克拉科夫与罗马的教授们捐赠出首批装满书籍的箱子填充其中。楼上的讲堂里，已回荡着哲学与神学的首场正式辩论之声。
      cost:
      - type: artwork
        value: 1
    - title_en: Raising the Academy Church
      title_zh: 兴建学院教堂
      desc_en: Masons and Italian craftsmen raise the twin towers of the Jesuit academy church, its facade meant to announce the university's standing to every traveler entering Vilnius. Painters begin sketching the ceiling frescoes even as scaffolding still clings to the nave.
      desc_zh: 石匠与意大利工匠们竖起耶稣会学院教堂的双塔，其立面旨在向每一位进入维尔纽斯的旅人昭示这所大学的地位。尽管脚手架仍紧贴中殿，画师们已开始为穹顶壁画勾勒草图。
      cost:
      - type: artwork
        value: 1
    - title_en: The Press Sets Its First Pages
      title_zh: 印刷所排印首批书页
      desc_en: The university's printing press, now housed in its own hall, sets its first pages of Latin grammar and Lithuanian catechism, sending fresh volumes out through the city's booksellers. Students from Poland, Ruthenia, and beyond crowd the arcades between lectures, debating in a half-dozen tongues at once.
      desc_zh: 大学印刷所如今终于有了专属厅堂，排印出第一批拉丁语语法与立陶宛语教理问答，新出版的书卷经由城中书商流向各地。来自波兰、罗塞尼亚及更远方的学生们挤满课间的回廊，同时以数种语言激烈辩论。
      cost:
      - type: research_progress
        value: -20
    - title_en: Vilnius Becomes a City of Scholars
      title_zh: 维尔纽斯成为学者之城
      desc_en: The rector consecrates the finished academy church and library in a ceremony attended by nobles from across the Grand Duchy, declaring Vilnius a true seat of learning at last. From this day the university's presses, lecture halls, and gathered scholars quicken the realm's pursuit of knowledge for generations.
      desc_zh: 校长在大公国各地贵族云集的仪式中，为竣工的学院教堂与图书馆举行祝圣典礼，正式宣告维尔纽斯已然成为真正的学术重镇。自此日起，大学的印刷所、讲堂与汇聚于此的学者们，将在此后数代持续推动全国的求知进程。
      cost:
      - type: prestige
        value: -35
