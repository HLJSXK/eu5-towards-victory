      desc_zh: 神学、法学、医学与文艺诸学院各自入驻指定的侧翼，长袍与印记区分出不同的学术领域。山下的内卡河谷，因学生与书商的往来而日渐繁忙。
      cost:
      - type: research_progress
        value: -15
    - title_en: The University Is Formally Inaugurated
      title_zh: 大学正式落成揭幕
      desc_en: The elector presides over the university's formal inauguration, the charter read aloud beneath the arcades as scholars from across the empire take their seats. Heidelberg's name now travels with every graduate, and learning across the realm advances a little faster for it.
      desc_zh: 选帝侯亲临大学落成揭幕典礼，特许状在拱廊下当众宣读，帝国各地的学者们纷纷就座。此后，海德堡之名随每一位学子远播四方，全国的学术进展也因此而更添几分速度。
