      title_zh: 战舰在船台上渐成雏形
      desc_en: The first hulls take shape on the stocks under naval officers' watch, ribs rising like a forest of curved oak along the shore.
      desc_zh: 首批船体在海军军官的注视下于船台上渐成雏形，弯曲的橡木肋材如林般沿岸排开。
