    stages:
    - title_en: The Caliph's Mandate for the Sanctuary
      title_zh: 哈里发颁布圣寺敕令
      desc_en: Word goes out from the court that the Masjid al-Haram shall be enlarged to shelter the ever-growing tide of pilgrims circling the Kaaba, and craftsmen of stone and calligraphy are summoned from across the faithful lands. Scholars of the Haram convene to set the sanctuary's new boundaries.
      desc_zh: 宫廷传令，禁寺将扩建以容纳环绕天房、日渐增多的朝觐人潮，石匠与书法巧匠自各信仰之地应召而来。禁寺的学者们齐聚一堂，商定圣所的新边界。
      cost:
      - type: devotion
        value: -10
    - title_en: The Stone Is Chosen with Care
      title_zh: 慎选圣石
      desc_en: Surveyors mark the ground around the sanctuary while master builders select stone free of blemish, for nothing unworthy may stand near the House of God. Caravans bring timber and marble from distant provinces, each load inspected before it nears the sacred precinct.
      desc_zh: 测量员在圣所四周标定界线，营造大师精挑毫无瑕疵的石料，因为唯有配得上真主之屋的材料方可立于近旁。商队从远方省份运来木材与大理石，每批货物在靠近圣域前都须经严格查验。
      cost:
      - type: artwork
        value: 1
    - title_en: The Pilgrims' Paths Are Cleared
      title_zh: 朝觐通道整理清空
      desc_en: Old arcades are gently dismantled and the flow of tawaf around the Kaaba is studied by the sanctuary's keepers, who mark where new arcades must rise without ever obstructing the sacred circuit. Imams lead prayers over the cleared ground before a single new column is set.
      desc_zh: 旧有的拱廊被小心拆除，圣寺守护者仔细研究环绕天房的转塔流线，标出新拱廊须建之处，务求绝不阻碍这神圣的巡礼环道。在竖起第一根新柱之前，伊玛目们已在清理出的地面上主持祷告。
      cost:
      - type: religious_influence
        value: -12
    - title_en: The New Arcades Take Root
      title_zh: 新拱廊奠基而立
      desc_en: The first foundations of the expanded arcades are laid in the sacred ground, and the sound of chisel on stone replaces the murmur of planning councils. What was survey and prayer now rises, course by course, around the House of God.
      desc_zh: 扩建拱廊的第一批地基在圣地铺设完成，凿石之声取代了议事厅中的低语商讨。此前的测量与祈祷，如今随着一层层石料的垒砌，围绕真主之屋渐渐升起。
      cost:
      - type: scaled_gold
        value: -8
    - title_en: The Marble Columns Multiply
      title_zh: 大理石列柱林立
      desc_en: Rows of marble columns rise beneath new stone arches, each capital carved by masters brought from as far as Anatolia and Persia, so that no two arcades along the courtyard repeat the same ornament. The sanctuary's shade deepens even as the flow of pilgrims grows.
      desc_zh: 一排排大理石列柱在新建的石拱之下矗立，每根柱头都由远至安纳托利亚与波斯的巧匠雕琢，庭院四周的拱廊竟无一处纹饰重复。圣寺的荫凉愈发深厚，朝觐的人潮也愈发汹涌。
      cost:
      - type: artwork
        value: 1
    - title_en: The Kiswa Is Rewoven
      title_zh: 天房幕布重新织就
      desc_en: Master weavers complete a new kiswa, the great black covering embroidered in gold thread with verses of the Quran, prepared to be raised over the Kaaba once the surrounding works are done. Craftsmen restoring the sacred covering work under the eyes of the sanctuary's guardians.
      desc_zh: 织造大师完成一幅新的天房幕布，那覆盖天房的黑色帷幔，以金线绣上古兰经文，准备在周边工程完工之后重新披挂于天房之上。修复圣幕的工匠们在圣寺守卫的注视下劳作。
      cost:
      - type: artwork
        value: 1
    - title_en: The Minarets Are Raised Higher
      title_zh: 宣礼塔再登高
      desc_en: New minarets rise above the expanded courtyard, their muezzins' call now carrying farther over a city swollen with pilgrims from every corner of the Dar al-Islam. The sanctuary's keepers report that the courtyard can now hold multitudes that once had to pray in the surrounding streets.
      desc_zh: 新的宣礼塔在扩建后的庭院上高高耸立，宣礼员的呼唤声如今传得更远，回荡在这座聚满伊斯兰世界各地朝觐者的城市上空。圣寺守护者们报告，如今庭院所能容纳的信众，已远胜从前只能挤在周边街巷礼拜的人数。
      cost:
      - type: religious_influence
        value: -20
    - title_en: The Sanctuary Is Rededicated
      title_zh: 圣寺重新奉献
      desc_en: Scholars and dignitaries gather as the expanded Masjid al-Haram is formally rededicated around the Kaaba, the new kiswa raised amid prayers heard across the courtyard. Pilgrims returning home carry word that the House of God's sanctuary now welcomes the faithful of the world in numbers never before possible.
      desc_zh: 学者与显贵齐聚一堂，扩建后的禁寺在天房周围正式重新奉献，新的天房幕布在响彻庭院的祷告声中升起。归乡的朝觐者传扬开来，真主之屋的圣寺如今能以前所未有的规模，接纳来自世界各地的信众。
      cost:
      - type: artwork
        value: 1
      - type: devotion
        value: -25
