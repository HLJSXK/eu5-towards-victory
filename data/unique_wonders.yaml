    stages:
    - title_en: The Crown Sanctions a Holy Tribunal
      title_zh: 王室钦准圣座法庭
      desc_en: The crown and the archbishop of Toledo jointly proclaim a permanent tribunal to be built within the old monastery walls, empowered to examine the faith of the realm's subjects. Confessors and canon lawyers are summoned to draft its founding charter.
      desc_zh: 王室与托莱多大主教联合昭告，将于旧修道院墙内兴建一座常设法庭，专司审察治下臣民之信仰。告解神父与教会法学者随即奉召起草其创立宪章。
      cost:
      - type: legitimacy
        value: -12
    - title_en: The Cloister Is Set Apart
      title_zh: 回廊自成一隅
      desc_en: The old cloister of Toledo is walled off from the rest of the monastery to house the tribunal in isolation, its gate guarded day and night against both intrusion and escape. Friars trained in canon law are quietly reassigned from other houses.
      desc_zh: 托莱多旧回廊自修道院其余部分隔开筑墙，独立设置法庭，昼夜设卫，既防外人擅入，亦防内中逃逸。谙熟教会法之修士亦悄然自各处调来充任。
      cost:
      - type: government_power
        value: -10
    - title_en: Scribes and Archives Assembled
      title_zh: 文书档案齐备
      desc_en: Scribes are engaged to build the tribunal's growing archive of testimony and precedent, and the first sealed chests of parchment are carried into the cloister under guard. Stonemasons meanwhile begin cutting the barred windows for a chamber of interrogation.
      desc_zh: 文书受聘建立法庭日渐增多的证词与判例档案，首批密封羊皮卷箱亦在护卫下运入回廊。石匠同时开始为审讯之室凿出带栏之窗。
      cost:
      - type: honor
        value: -10
    - title_en: The Council Chamber's Foundation
      title_zh: 议事厅奠基
      desc_en: Masons break the cloister floor to lay the foundation of the great council chamber where the tribunal's judges will sit, and the tribunal at last becomes a physical structure rather than a charter and a promise. Torches are fitted along corridors still open to the sky.
      desc_zh: 石匠破开回廊地面，为法官议事之大厅奠基，法庭自此不再只是一纸宪章与承诺，而成实实在在之建筑。仍露天的走廊两侧亦装上火炬。
      cost:
      - type: scaled_gold
        value: -6
    - title_en: The Guarded Chapel Is Vaulted
      title_zh: 守护礼拜堂封顶
      desc_en: A private chapel is vaulted in stone within the tribunal's walls, where the accused may be brought to confess before judgment is passed. Masons work under close watch, for even the builders are made to swear an oath of silence.
      desc_zh: 法庭墙内一座石砌拱顶礼拜堂竣工，被告可于此在宣判前接受告解。石匠们在严密监视下施工，即便是营建之人，亦须发誓守口如瓶。
      cost:
      - type: devotion
        value: -12
    - title_en: The Archive Vaults Are Sealed
      title_zh: 档案密室封存
      desc_en: Deep vaults beneath the council chamber are sealed with iron-bound doors to hold the tribunal's growing archive of confessions and sentences. Scribes label each chest by diocese, building the record that will outlast every judge who sits above it.
      desc_zh: 议事厅之下深处密室以铁箍大门封存，用以存放法庭日渐庞大的供词与判决档案。文书按教区逐一标注箱柜，所建之档案将比任何一位在其上审判的法官更为长久。
      cost:
      - type: government_power
        value: -20
    - title_en: The Courtyard of Public Reckoning
      title_zh: 公审庭院落成
      desc_en: An outer courtyard is finished where sentences will be read before the assembled town, its stone benches and dais completing the tribunal's public face alongside its hidden chambers. Banners bearing the tribunal's cross are hung above the gate for the first time.
      desc_zh: 外部庭院竣工，日后判决将于此当众宣读，石凳与高台使法庭的公开一面与其隐秘内室相互呼应。绣有法庭十字标志的旗帜亦首次悬挂于门楼之上。
      cost:
      - type: honor
        value: -18
    - title_en: The Tribunal Opens Its Doors
      title_zh: 法庭正式开庭
      desc_en: The archbishop consecrates the finished tribunal and its first judges take their seats before the assembled clergy and crown officials, declaring the faith of the realm now formally guarded. From this day the tribunal's discipline steadies the realm's order and quickens the return of its people to a single creed.
      desc_zh: 大主教为落成的法庭举行祝圣礼，首任法官于聚集的教士与王室官员面前就座，宣告全国信仰自此正式受此庇护。自此法庭之纪律稳固国中秩序，亦加速万民重归一统信仰之进程。
      cost:
      - type: righteousness
        value: -28
      - type: stability
        value: -1
