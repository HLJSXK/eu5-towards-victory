      title_zh: 圣城焕然一新
      desc_en: Bells, calls to prayer, and shofar blasts sound together across the old walls as the restoration is declared complete, and Jerusalem's standing as a city under the realm's solemn protection becomes a lasting mark of its rule.
      desc_zh: 钟声、宣礼与羊角号声在古老城墙间齐鸣，修复工程宣告完成，耶路撒冷作为受本邦庄严庇护之圣城的地位，自此成为其统治永恒的印记。
