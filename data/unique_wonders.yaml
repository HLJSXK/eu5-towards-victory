    stages:
    - title_en: The Mountain Is Claimed for the Crown
      title_zh: 山岩收归王室名下
      desc_en: A decree formally places the white-veined slopes above Carrara under crown charter, ending the patchwork of private claims that had slowed the old Roman workings. Local cavatori are summoned to advise on which faces still hold the finest stone.
      desc_zh: 一纸敕令将卡拉拉山间那片白纹斑斓的坡地正式收归王室特许开采，结束了昔日罗马采石遗地上零散私采的乱局。当地采石老工被召来指点，哪几处山面仍藏着最上乘的石材。
      cost:
      - type: scaled_gold
        value: -3
    - title_en: Surveyors Mark the Quarry Faces
      title_zh: 测量师标定采面
      desc_en: Surveyors climb the mountain to chalk lines across the cleanest faces of stone, while the quarrymen's guild is consulted on wages and safety before a single block is cut. Old Roman cuttings are inspected for lessons still worth heeding.
      desc_zh: 测量师攀上山岩，在最洁净的石面上以粉笔划出线条，动工之前先与采石行会商定工钱与安全事宜。工匠们还特意查看罗马旧采石遗痕，从中汲取尚可借鉴的经验。
      cost:
      - type: gold
        value: -30
    - title_en: The Sledge-Tracks Are Cut
      title_zh: 拽运道劈山而开
      desc_en: Teams of oxen and laborers carve the lizzatura tracks down the mountainside, graded just steep enough for a marble block to be eased downward without shattering. Rope-makers and wheelwrights set up workshops at the mountain's foot.
      desc_zh: 牛队与劳工在山坡上劈出一条条拽运滑道，坡度拿捏得恰到好处，好让沉重的大理石块缓缓滑下而不至碎裂。制绳匠与造车匠也在山脚支起了作坊。
      cost:
      - type: scaled_gold
        value: -5
    - title_en: The First Block Is Freed from the Rock
      title_zh: 第一块石料破岩而出
      desc_en: Wedges and iron bars bite into the chalked lines until a great white block groans loose from the mountain face, the true quarrying of Carrara now underway. Cheers echo across the valley as the ox-sledges take up their burden.
      desc_zh: 楔子与铁杆沿着划定的线条一寸寸凿入，终于一块巨大的白石从山壁上轰然脱落，卡拉拉真正的采石作业就此展开。欢呼声回荡山谷，牛拽的雪橇随即承起了这份重负。
      cost:
      - type: manpower
        value: -40
    - title_en: Cranes Rise at the Quarry Mouths
      title_zh: 起重之架立于矿口
      desc_en: Wooden cranes, some said to rival any engineering feat since antiquity, are raised at the quarry mouths to lift blocks too heavy for sledges alone. The rhythmic creak of ropes and pulleys becomes the mountain's constant song.
      desc_zh: 矿口竖起木制起重架，据说其巧思不逊于古代任何工程杰作，专为吊起雪橇也难以拖动的巨石。绳索与滑轮吱呀作响，从此成了这座山终日不歇的乐声。
      cost:
      - type: scaled_gold
        value: -7
    - title_en: Sculptors Choose Among the Blocks
      title_zh: 雕匠亲临择石
      desc_en: Master sculptors travel from distant workshops to walk among the freshly cut blocks, tapping each with a hammer to listen for the ring of stone without hidden flaws. The finest pieces are set aside and marked for shipment before the rest.
      desc_zh: 远方作坊的雕塑大师亲自前来，在新凿的石块间徘徊，以锤轻敲，细听石声可有暗藏的裂纹。最上乘的石料被单独标记留下，优先安排装运。
      cost:
      - type: cultural_influence
        value: -6
    - title_en: The Harbor Workshops Open
      title_zh: 港口作坊开张
      desc_en: Loading yards and rough-cutting workshops open at the coast to prepare blocks for the sea voyage, shaving away excess weight before the ships take on their cargo. Foremen keep careful tallies of every block that leaves the mountain.
      desc_zh: 海岸边开设起装货场与粗坯作坊，为出海的石料提前削去多余的重量，减轻装船负担。工头们逐一登记每一块离开山中的石材，账目丝毫不敢马虎。
      cost:
      - type: gold
        value: -90
    - title_en: The Quarries Reach Full Working Order
      title_zh: 矿场终臻全盛之势
      desc_en: The crown formally declares the Carrara workings a model enterprise, its tracks, cranes, and workshops now running at a steady, self-sustaining pace. Builders throughout the realm find their projects quietly hastened by the abundance of good stone and skilled labor it provides.
      desc_zh: 王室正式宣告卡拉拉矿场堪为典范，滑道、吊架与作坊如今运转有序、自成体系。举国各地的营造工程，皆因这源源不断的优质石材与熟练工匠而悄然加快了进度。
      cost:
      - type: scaled_gold
        value: -12
