    stages:
    - title_en: Akbar Honors the Saint's Blessing
      title_zh: 阿克巴敬谢圣者祝福
      desc_en: Akbar declares a new capital shall rise near the hermitage of the Sufi saint Salim Chishti, whose blessing he credits for the birth of a long-awaited heir. Nobles and architects are summoned from across the empire within the month.
      desc_zh: 阿克巴宣告将在苏菲圣者萨利姆·奇什提的隐修之地附近建起一座新都，以谢其祈福得以喜获盼望已久的继承人。不出一月，帝国各地的贵族与建筑师便应召而至。
      cost:
      - type: legitimacy
