      desc_en: A royal charter names Toledo's smiths the crown's official armorers, their steel to be marked apart from all common blades. Master swordsmiths gather before the city's alcalde to hear the grant read aloud.
      desc_zh: 王室敕状将托莱多铸剑匠人定为王室御用兵匠，其钢刃须与寻常刀剑区分标记。铸剑名匠齐聚市政官前，聆听敕状宣读。
