  ceremony:
    stage_1_reward:
    - type: cultural_influence
      value: 15
    - type: cultural_tradition
      value: 8
    - type: prestige
      value: 15
    stages:
    - title_en: Florence Vows a Dome Without Equal
      title_zh: 佛罗伦萨立誓建绝世穹顶
      desc_en: The Opera del Duomo declares that Santa Maria del Fiore shall be crowned with a dome greater than any built since antiquity, though no master yet knows how such a span could stand without collapsing under its own weight. Guilds across the city pledge funds toward the challenge.
      desc_zh: 圣母百花大教堂工程局宣誓，将为大教堂加冕一座自古以来无与伦比的穹顶，尽管此际尚无匠师知晓如此跨度何以不因自重而坍塌。全城各行会纷纷认捐，共襄此项壮举。
      cost:
      - type: cultural_influence
        value: -10
    - title_en: A Competition of Ingenious Models
      title_zh: 巧思模型竞选
      desc_en: Architects submit wooden models proposing scaffolds, chains, and herringbone brick patterns to solve the dome's impossible engineering, and the Opera weighs each scheme against the guild masters' doubts. Brunelleschi's unconventional design slowly wins favor.
      desc_zh: 各路建筑师纷纷呈上木制模型，提出脚手架、铁链与人字形砌砖等法以解穹顶之工程难题，工程局则一一权衡各方案与行会大师们的疑虑。布鲁内莱斯基那不落俗套的设计渐得青睐。
      cost:
      - type: research_progress
        value: -12
    - title_en: Brick, Marble, and Sand From the Contado
      title_zh: 郊野运来砖石与沙
      desc_en: Ox carts haul brick, pale marble, and river sand from the Tuscan contado into the city, and quarry contracts are signed to keep the supply flowing for years to come. The campanile beside the unfinished nave already casts its long Tuscan shadow.
      desc_zh: 牛车自托斯卡纳乡野源源运来砖石、淡色大理石与河沙入城，采石契约亦已签订，以保未来数年供应不断。教堂旁乔托钟楼投下悠长的托斯卡纳光影，映照着尚未竣工的中殿。
      cost:
      - type: scaled_gold
        value: -6
    - title_en: Brunelleschi Raises His Scaffold
      title_zh: 布鲁内莱斯基架起脚手架
      desc_en: Brunelleschi's ingenious hoists and self-supporting scaffold rise above the drum of the cathedral, and the dome's herringbone brickwork finally begins to climb where only drawings and arguments stood before. Workers eat lunch on platforms suspended far above the piazza to save time.
      desc_zh: 布鲁内莱斯基巧妙设计的吊装装置与自承式脚手架于教堂鼓座之上耸立而起，穹顶人字形砖砌工程终于开始向上攀升，此前唯有图纸与争论盘旋于此。工匠们为节省时间，甚至在悬于广场高空的平台上用膳。
      cost:
      - type: scaled_gold
        value: -8
    - title_en: The Double Shell Climbs
      title_zh: 双层穹壳渐升
      desc_en: The dome's inner and outer shells rise together course by course, bound by hidden stone chains and wooden ties that Brunelleschi guards as trade secrets. From the piazza below, Florentines gather each evening to measure how much higher the ring of brick has climbed.
      desc_zh: 穹顶内外双层壳体逐层同步升高，以隐藏于其中的石链与木箍相连，其法为布鲁内莱斯基视若不传之秘。佛罗伦萨市民每日傍晚聚于广场之下，估量这圈砖砌究竟又升高了几许。
      cost:
      - type: research_progress
        value: -20
    - title_en: The Oculus Nears the Sky
      title_zh: 天窗渐近云霄
      desc_en: The dome narrows toward its summit, and masons work the final rings of brick around the oculus that will one day crown it with Verrocchio's lantern. Guild elders who once mocked the design now bring their apprentices to watch the miracle close overhead.
      desc_zh: 穹顶渐向顶端收窄，石匠正砌合环绕天窗的最后几圈砖石，日后此处将由委罗基奥所制之灯亭加冕。曾对此设计冷嘲热讽的行会耆老，如今也携弟子前来仰观这将合拢的奇迹。
      cost:
      - type: cultural_tradition
        value: -10
    - title_en: The Marble Facade Takes Its Colors
      title_zh: 大理石立面披彩
      desc_en: The cathedral's facade is faced in its final pattern of white, green, and pink marble, matching the dome's brick crown now visible from every quarter of the city. Scaffolding comes down in sections, revealing the building Florence has waited two generations to see whole.
      desc_zh: 教堂立面最终镶砌上白、绿、粉三色大理石，与如今全城各处皆可望见的砖砌穹顶相映成趣。脚手架分段拆除，露出佛罗伦萨人苦候两代人方得一见的完整教堂真容。
      cost:
      - type: artwork
        value: 1
    - title_en: The Dome Is Consecrated Over the City
      title_zh: 穹顶落成，献礼全城
      desc_en: The Pope himself consecrates Santa Maria del Fiore before the assembled Signoria and guilds, and Brunelleschi's dome is declared the greatest work raised in Christendom since Rome's own antiquity. From this day the cathedral's glory quickens Florence's art and learning, and its name is spoken with pride in every court that hears of it.
      desc_zh: 教皇亲临，为圣母百花大教堂举行祝圣大典，佛罗伦萨执政团与各行会齐聚见证，布鲁内莱斯基之穹顶被誉为自罗马古代以来基督教世界最伟大之杰作。自此大教堂之荣光激励佛罗伦萨的艺术与学问蒸蒸日上，其名亦为闻者各国朝廷所称颂。
      cost:
      - type: artwork
        value: 1
