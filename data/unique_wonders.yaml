    - type: devotion
      value: 20
    stages:
    - title_en: The Grand Prince Calls for a New Kremlin
      title_zh: 大公号召重建克里姆林
      desc_en: The Grand Prince of Moscow declares the old wooden and limestone walls unworthy of a Tsardom's capital, and summons masters from Pskov and Italy alike to raise a fortress-palace in brick and stone. Envoys are sent to Bologna to fetch the engineer Aristotele Fioravanti.
      desc_zh: 莫斯科大公宣布旧日的木石城墙已配不上沙皇国都的地位，召集普斯科夫与意大利的匠师，欲以砖石重建这座要塞宫殿。使者被派往博洛尼亚，延请工程师阿里斯托特列·菲奥拉万蒂。
      cost:
      - type: prestige
        value: -15
    - title_en: The Old Walls Are Cleared Away
      title_zh: 旧墙尽数拆除
      desc_en: The crumbling white limestone walls of the old kremlin are pulled down section by section, and kilns are built along the Moskva River to fire the red brick that will replace them. Boyars donate timber and grain to feed the thousands of masons gathering in the city.
      desc_zh: 破旧的白色石灰岩城墙被逐段拆除，莫斯科河畔筑起窑炉，烧制将取而代之的红砖。波雅尔贵族捐出木材与粮食，供养聚集于城中的数千名工匠。
      cost:
      - type: scaled_gold
        value: -5
    - title_en: The Metropolitan Blesses the Ground
      title_zh: 都主教为地基祈福
      desc_en: The Metropolitan processes around the marked foundations with icon and censer, blessing the site where cathedrals and palace halls will rise together within the new walls. Italian and Russian master builders finalize the plan of towers, gates, and courts.
      desc_zh: 都主教手持圣像与香炉，绕行已标出地基的场地，为新墙之内即将并立的教堂与宫殿祈福。意大利与俄罗斯的总建筑师最终敲定了塔楼、城门与庭院的布局。
      cost:
      - type: devotion
        value: -12
    - title_en: Brick Rises Upon Stone Foundations
      title_zh: 红砖立于石基之上
      desc_en: The first true courses of red brick are laid upon deep stone foundations along the riverbank, Fioravanti's Italian methods of bonding and mortar proving stronger than anything the old walls could offer. The Kremlin begins, at last, to take physical form.
      desc_zh: 河岸边的深石地基之上，首批真正的红砖砌层被铺设起来，菲奥拉万蒂带来的意大利粘合与砂浆工艺，远比旧墙的做法坚固。克里姆林宫自此终于开始有了实体的模样。
      cost:
      - type: scaled_gold
        value: -6
    - title_en: The Dormition Cathedral Takes Shape
      title_zh: 圣母安息主教座堂初现
      desc_en: Within the rising walls, the great white Cathedral of the Dormition climbs course by course, its five domes framed in scaffolding as Russian and Italian masons work side by side on its vaults. Bells are cast in foundries nearby to await its completion.
      desc_zh: 城墙拔地而起之中，白色的圣母安息主教座堂也一层层建起，五座穹顶还裹在脚手架中，俄罗斯与意大利的工匠并肩砌筑其拱顶。附近的铸造厂已开始为教堂铸钟，等候竣工之日。
      cost:
      - type: devotion
        value: -18
    - title_en: Towers and Battlements Crown the Walls
      title_zh: 塔楼垛口冠于城墙
      desc_en: Crenellated towers rise at every corner and gate, their swallow-tail battlements borrowed from Italian fortress design, while the Spasskaya gate is fitted with its first iron-bound doors. Snow gathers on the unfinished ramparts through a hard Moscow winter.
      desc_zh: 每处角楼与城门都筑起雉堞塔楼，其燕尾形垛口借鉴了意大利要塞的设计，斯帕斯克塔门也装上了最初的铁包大门。莫斯科严冬中，积雪覆盖在尚未完工的城垛之上。
      cost:
      - type: army_tradition
        value: -2
    - title_en: The Palace of Facets Is Fitted Out
      title_zh: 多棱宫落成布置
      desc_en: Inside the walls the Palace of Facets rises for state receptions, its diamond-patterned stone facade unlike anything seen in Moscow before, while the last cathedral bells are hung and rung for the first time. Craftsmen gild the domes as the whole ensemble nears completion.
      desc_zh: 城墙之内，用于国事典礼的多棱宫拔地而起，其钻石纹样的石砌立面为莫斯科前所未见，最后几口教堂钟也被悬挂并首次鸣响。工匠为穹顶镀金，整组建筑渐近完工。
      cost:
      - type: honor
        value: -20
    - title_en: The Tsar Is Crowned Within New Walls
      title_zh: 沙皇于新墙内加冕
      desc_en: The Tsar processes through the Dormition Cathedral to be crowned beneath its five gilded domes, the finished Kremlin's red walls and towers standing as the visible seat of his authority. Moscow's fortress-palace now anchors the Tsardom's legitimacy for all who look upon its walls.
      desc_zh: 沙皇在圣母安息主教座堂内举行加冕大典，五座镀金穹顶之下接受王冠，落成的克里姆林宫红墙高塔，从此成为其权威的具象所在。莫斯科的这座要塞宫殿，自此为凡瞻仰城墙者昭示沙皇国的正统。
      cost:
      - type: prestige
        value: -50
