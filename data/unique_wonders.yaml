      desc_en: Woodcutters and quarrymen bring timber and stone from the surrounding forests, while pilgrims already arriving at the hermitage lend their labor in exchange for a blessing.
      desc_zh: 伐木工与采石工从周围林地运来木材与石料，已然前来朝拜的信众也纷纷出力相助，以换取一份祝福。
