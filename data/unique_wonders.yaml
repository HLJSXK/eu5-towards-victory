    stages:
    - title_en: Arslan Khan Commands a Tower to Heaven
      title_zh: 阿尔斯兰汗下令兴建通天高塔
      desc_en: The Karakhanid ruler Arslan Khan commands that a minaret be raised beside the Friday mosque so tall that its call to prayer might be heard across the whole oasis of Bukhara. Master builders and brickmakers from across Transoxiana are summoned to the ruler's court.
      desc_zh: 喀喇汗王朝统治者阿尔斯兰汗下令，在星期五清真寺旁修建一座宣礼塔，其高度须使召唤祷告的声音传遍整个布哈拉绿洲。来自整个河中地区的大工匠与制砖匠纷纷应召，齐聚统治者宫廷。
      cost:
      - type: prestige
        value: -15
    - title_en: Deep Foundations Against the Shifting Sand
      title_zh: 深挖地基以抗流沙
      desc_en: Engineers dig an unusually deep foundation and pack it with reeds bound in bundles, a technique meant to keep the coming tower upright on Bukhara's shifting soil for centuries. Kilns around the city fire thousands of fired bricks in the weeks that follow.
      desc_zh: 工程师们挖掘出异常深邃的地基，并以捆扎成束的芦苇填实其中——这一技艺旨在让即将耸立的高塔在布哈拉松软的地质上历经数百年仍屹立不倒。此后数周，城中各处窑炉日夜不停，烧制出成千上万块砖坯。
      cost:
      - type: gold
        value: -50
    - title_en: The Qadi Blesses the First Course
      title_zh: 卡迪为首层砌筑祝圣
      desc_en: The city's chief qadi blesses the first course of fired brick before an assembly of scholars and craftsmen, reciting verses over the deep foundation pit. Laborers begin the long climb of hauling brick and mortar up a spiraling earthen ramp built alongside the rising shaft.
      desc_zh: 城中首席卡迪在学者与工匠云集的仪式上，为烧制砖的首层砌筑祝圣，在深邃的地基坑上诵念经文。劳工们开始沿着与逐渐升高的塔身并行修建的螺旋形土坡，长年累月地将砖块与灰浆运送而上。
      cost:
      - type: devotion
        value: -12
    - title_en: The Minaret's Shaft Begins to Rise
      title_zh: 塔身开始拔地而起
      desc_en: Course by course, the tapering brick shaft of the minaret climbs above the mosque courtyard, the true building finally underway after the deep digging and the qadi's blessing. The spiral ramp grows longer with every month as the tower creeps toward the heavens.
      desc_zh: 一层又一层，逐渐收窄的宣礼塔砖砌塔身在清真寺庭院之上拔地而起——经过深挖地基与卡迪祝圣之后，真正的营造工程终于展开。随着塔身向天际步步攀升，环绕而建的螺旋坡道也一月比一月更长。
      cost:
      - type: manpower
        value: -70
    - title_en: Fourteen Bands of Pattern Wind Upward
      title_zh: 十四道砖纹螺旋而上
      desc_en: Master brick-layers set fourteen distinct bands of geometric brickwork spiraling up the tower's face, each pattern subtly different so that no two rings of the minaret repeat. Turquoise glazed tiles are set into one high band, the first glimpse of color on the sunbaked brick.
      desc_zh: 大砖匠们沿塔身螺旋而上，砌出十四道各不相同的几何砖纹带，每一道图案都略有变化，使宣礼塔上下没有两圈完全重复。一道高处的塔身嵌入绿松石琉璃砖，是这座晒制砖塔上首次出现的色彩。
      cost:
      - type: artwork
        value: 1
    - title_en: The Gallery Crowns the Shaft
      title_zh: 宣礼平台加冕塔身
      desc_en: Builders complete the muezzin's gallery near the tower's summit, its ring of arches meant to shelter the caller who will climb its narrow inner stair five times a day. Below, the adjoining Kalyan Mosque's own walls rise in step with the minaret beside it.
      desc_zh: 工匠们在塔顶附近建成宣礼员平台，一圈拱廊将庇护那位每日五次攀爬内部狭窄阶梯的召唤者。塔下，与之相邻的卡扬清真寺自身的墙体也与这座宣礼塔同步拔高。
      cost:
      - type: gold
        value: -80
    - title_en: A Madrasa Grows in the Minaret's Shadow
      title_zh: 经学院在塔影下成长
      desc_en: A new madrasa rises in the shadow of the towering minaret, its students already gathering in the unfinished courtyard to watch the tower's lantern catch the first and last light of each day. Caravan merchants pause at the mosque gates, marveling that the tower can be seen from a day's ride across the steppe.
      desc_zh: 一座新经学院在高耸宣礼塔的阴影下拔地而起，学生们已聚集在尚未完工的庭院里，观看塔顶灯笼捕捉每日的第一缕与最后一缕阳光。商队旅人驻足于清真寺门前，惊叹这座高塔竟能在草原上一日路程之外便清晰可见。
      cost:
      - type: artwork
        value: 1
    - title_en: The Kalyan Minaret Calls Across the Oasis
      title_zh: 卡扬宣礼塔声传绿洲
      desc_en: The qadi climbs the finished tower's narrow stair to give the first call to prayer from its gallery, its fired-brick shaft now the tallest structure between Baghdad and Samarkand. From this day the minaret's presence over Bukhara deepens the devotion of all who hear its call echo across the oasis.
      desc_zh: 卡迪攀上竣工高塔的狭窄阶梯，在塔顶平台首次发出召唤祷告之声——这座烧砖塔身，如今已是巴格达与撒马尔罕之间最高的建筑。自此日起，这座耸立在布哈拉上空的宣礼塔，令每一位听见其召唤声回荡绿洲的人，虔信愈发深厚。
      cost:
      - type: devotion
        value: -30
