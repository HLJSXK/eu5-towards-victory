      desc_en: The emperor commands that a throne be fashioned unlike any seen before, one fit to declare the majesty of his reign to every visiting envoy. Royal criers carry the firman through the bazaars of Delhi within the day.
      desc_zh: 皇帝下诏，命工匠打造一座前所未有的宝座，务使每一位来朝使节皆能感受此朝威仪。当日之内，皇令便由传令官传遍德里的集市街巷。
