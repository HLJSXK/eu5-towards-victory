    stages:
    - title_en: The Sapa Inca Orders the Road United
      title_zh: 萨帕印卡下令通衢四方
      desc_en: The Sapa Inca commands that every conquered province be bound by a single road worthy of the Four Quarters, and quipucamayocs are sent ahead to record the distances between valleys. Runners carry the decree from Cusco toward the mountain passes.
      desc_zh: 萨帕印卡下令，将四方之地以一条配得上帝国的大道连通，结绳官奉命先行测算各谷地间的里程。信使自库斯科出发，将诏令传向群山之间的隘口。
      cost:
      - type: government_power
        value: -12
    - title_en: Stone Is Cut for the Mountain Passes
      title_zh: 山隘凿石备道
      desc_en: Work crews under the mit'a labor levy quarry paving stones along the steepest passes, while priests of Inti bless the route at each apacheta cairn. Llama trains begin hauling timber for the first rope bridges over the gorges.
      desc_zh: 米塔徭役下的工队在最陡峭的隘口凿取铺路石料，因蒂神的祭司在每座阿帕切塔石堆前为道路祈福。驮运骆马队开始运送木材，准备架设峡谷上最早的绳索桥。
      cost:
      - type: manpower
        value: -25
    - title_en: The Tambos Are Marked Out
      title_zh: 驿站选址落定
      desc_en: Surveyors pace off a day's march between each valley and mark the ground for the tambo waystations that will shelter runners, soldiers, and officials. The first storehouses of maize and cloth are stocked at the road's Cusco terminus.
      desc_zh: 测量官以一日行程为间隔丈量各谷地，标出将供信使、士兵与官员歇脚的坦博驿站选址。库斯科端点的第一批玉米与织物仓库开始囤积物资。
      cost:
      - type: scaled_gold
        value: -6
    - title_en: Paving Begins Across the Andes
      title_zh: 安第斯山道正式铺筑
      desc_en: Terraces of fitted stone finally rise along the first mountain stretch, drainage channels cut beside them to carry off the rains that could wash the road away. What was survey stakes and cairns now becomes packed stone underfoot.
      desc_zh: 首段山道上，严丝合缝的石砌路面终于铺展开来，一旁凿出排水沟渠，以防雨水冲毁道路。原本的测量木桩与石堆，如今化作脚下坚实的石道。
      cost:
      - type: scaled_gold
        value: -8
    - title_en: Rope Bridges Span the Gorges
      title_zh: 绳索桥飞跨深谷
      desc_en: Ichu-grass cables thick as a man's waist are woven and hauled across the deepest canyons, anchored to stone piers on either bank. Chasqui relay runners begin testing the crossings, sprinting the spans in relays timed against the sun.
      desc_zh: 粗如成人腰围的伊丘草绳被编织而成，横跨最深的峡谷，两岸以石墩固定。查斯基接力信使开始试跑这些桥梁，以日影计时接力飞驰。
      cost:
      - type: manpower
        value: -30
    - title_en: The Road Climbs to Picchu
      title_zh: 大道攀向比丘
      desc_en: The route is carried up the terraced flanks toward Picchu, its switchbacks cut into granite and its steps polished by the passage of the first llama caravans. Engineers reinforce the steepest stairs with retaining walls quarried from the mountain itself.
      desc_zh: 道路沿梯田山坡向比丘攀升，之字形的转折凿入花岗岩，台阶已被最初的骆马商队踏得光滑。工程师用取自山体本身的石料修筑挡土墙，加固最陡的石阶。
      cost:
      - type: scaled_gold
        value: -9
    - title_en: Runners Relay the Length of the Empire
      title_zh: 信使接力贯通全境
      desc_en: Chasqui stations are fully manned along the finished stretches, and a message is relayed from Quito to Cusco in days rather than weeks to prove the system's reach. Soldiers begin marching whole companies along the road to garrison the frontier passes.
      desc_zh: 已完工路段的查斯基驿站全部配齐人手，一则消息从基多传至库斯科仅耗数日而非数周，以此证明这套系统的效能。军队开始沿大道成建制行军，驻守边境隘口。
      cost:
      - type: army_tradition
        value: -3
    - title_en: The Qhapaq Nan Is Declared Whole
      title_zh: 卡帕克南大道宣告贯通
      desc_en: At Cusco's central plaza the Sapa Inca receives runners who have crossed the length of the realm in record time, and the road is declared complete from quarter to quarter. The Qhapaq Nan now carries the empire's armies, tribute, and messages with a speed no rival power can match.
      desc_zh: 库斯科中央广场上，萨帕印卡接见了以破纪录速度贯穿全境而来的信使，大道自此宣告四方全线贯通。卡帕克南大道从此承载帝国的军队、贡品与消息，其速度无任何对手能及。
      cost:
      - type: government_power
        value: -25
      - type: honor
        value: -20
