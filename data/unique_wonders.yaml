  key: unique_great_zimbabwe
  base_key: world_market
  concept: tv_wonder_unique_great_zimbabwe
  location: great_zimbabwe
  image: tv_wonder_unique_great_zimbabwe
  prompt: Great Zimbabwe stone city, massive dry-stone walls and conical tower, royal enclosure, gold trade tribute ceremony, cattle and merchants, southern African highland landscape, historically grounded world wonder key art, cinematic warm light, ultra-detailed, no modern elements.
