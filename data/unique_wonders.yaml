      title_zh: 测量师试探软土
      desc_en: Surveyors probe the marshy subsoil of the piazza, though the sandy clay beneath the meadow will keep its true weakness hidden until stone begins to press upon it. Marble contracts are signed with quarries near Carrara.
      desc_zh: 测量师探察广场之下潮湿的地基，然而草地之下那沙质黏土的真正脆弱，须待石料重压其上方才显露。与卡拉拉附近采石场所签之石料契约亦告落定。
      cost:
      - type: scaled_gold
        value: -5
    - title_en: Marble Blocks Arrive by Cart
      title_zh: 大理石块车运抵达
      desc_en: Ox carts bring block after block of gleaming Carrara marble across the plain to Pisa, and masons begin cutting the arcades and columns that will ring the tower's eight stories. Scholars from the cathedral school debate whether the ground will truly bear such weight.
      desc_zh: 牛车载着一块又一块闪耀的卡拉拉大理石横穿平原运抵比萨，石匠开始凿制将环绕钟楼八层的拱廊与立柱。大教堂学校的学者们则争论此地是否真能承受如此重量。
      cost:
      - type: scaled_gold
        value: -7
    - title_en: The First Ring of Columns Rises
      title_zh: 首环立柱升起
      desc_en: Masons lay the tower's circular foundation and raise the first ring of blind arcades, and Pisa's campanile finally leaves the drawing boards to stand as marble upon the piazza's soft earth. Within a few courses, careful eyes already note a faint list to the north.
      desc_zh: 石匠铺设钟楼环形地基，砌起首层盲拱廊，比萨钟楼终于走出图纸，以大理石之姿立于广场松软的地面之上。仅数层之后，细心之人已察觉塔身微微向北倾斜。
      cost:
      - type: artwork
        value: 1
    - title_en: Work Halts as the Tower Tilts
      title_zh: 塔身倾斜，工程暂停
      desc_en: Construction stops for nearly a century as war and debt distract the republic, and in that long pause the half-built tower settles further into the clay beneath it, its lean becoming impossible to ignore. Pisans joke that the tower is bowing to the baptistery.
      desc_zh: 因战乱与债务分散共和国之力，工程遂搁置近百年，而在这漫长停顿之间，未竣钟楼于黏土之上愈发下沉，其倾斜已无法再被忽视。比萨人戏称此塔是在向洗礼堂躬身行礼。
      cost:
      - type: gold
        value: -60
    - title_en: The Upper Stories Correct the Lean
      title_zh: 上层修正倾角
      desc_en: When building resumes, master Giovanni di Simone angles each new story slightly against the tilt, curving the tower's upper courses in a subtle attempt to bring its top back toward true. The result is a tower bent like a banana rather than straight, but standing all the same.
      desc_zh: 工程重启后，乔瓦尼·迪·西蒙内大师令每一新层皆微微反向倾角，使钟楼上部各层略呈弧形，试图令塔顶重归垂直。结果塔身弯曲如香蕉一般，却仍屹立不倒。
      cost:
      - type: research_progress
        value: -15
    - title_en: The Bell Chamber Crowns the Tower
      title_zh: 钟室加冠塔顶
      desc_en: The belfry is finally added atop the leaning shaft, its arcade deliberately built shorter on the tower's low side to keep the bells themselves hanging level. Scholars and masons alike now come from other cities simply to study how the thing still stands.
      desc_zh: 钟室终于加筑于倾斜塔身之顶，其拱廊在塔身较低一侧特意缩短，以使钟本身仍能保持水平悬挂。各地学者与匠人纷纷慕名而来，只为研究此塔何以至今仍未倾倒。
      cost:
      - type: artwork
        value: 1
    - title_en: The Leaning Tower Rings Its First Peal
      title_zh: 斜塔初鸣钟声
      desc_en: Bells sound for the first time from the finished campanile as the Opera declares nearly two centuries of work complete, tilt and all. From this day Pisa's tower draws scholars and marvel-seekers alike, its improbable stance lending fresh renown to the city's art and learning.
      desc_zh: 落成钟楼首度鸣响钟声，工程局宣告这历时近两世纪、连同其倾斜之态在内的工程终告完成。自此比萨斜塔吸引学者与猎奇之人纷至沓来，其匪夷所思的姿态更为全城的艺术与学问增添了新的声名。
      cost:
      - type: artwork
        value: 1
      - type: cultural_influence
        value: -15
- id: 155
  key: unique_milan_cathedral
