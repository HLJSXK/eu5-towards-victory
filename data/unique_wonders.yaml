  key: unique_amsterdam_canal_ring
  base_key: canal_hub_city
  concept: tv_wonder_unique_amsterdam_canal_ring
  location: amsterdam
  image: tv_wonder_unique_amsterdam_canal_ring
  prompt: Amsterdam Canal Ring in the Dutch Golden Age, planned concentric canals, brick merchant houses, quays, warehouses, barges, groundbreaking ceremony for three canals, historically grounded world wonder key art, cinematic urban water view, ultra-detailed, no modern elements.
  is_unique: true
