      title_zh: 军械庭院渐满
      desc_en: Armories and workshops crowd the inner courtyards, arming a garrison meant to hold the ridge against any army that might march on the free city.
      desc_zh: 兵器库与工坊挤满内庭，武装起一支守军，以抵御任何可能进犯这座自由城市的敌军。
      cost:
      - type: manpower
        value: -40
    - title_en: The Imperial Castle Stands Complete
      title_zh: 皇城堡垒竣工屹立
      desc_en: The castle stands finished above Nuremberg's roofs, its garrison drilled and its walls proven against the elements and the years, and from this day every fortress in the realm holds a little firmer for what was built on this ridge.
      desc_zh: 城堡在纽伦堡的屋顶之上竣工，守军操练有素，城墙也历经风雨与岁月的考验，自此日起，全国各处的要塞都因这道山脊上所建之物而更加坚固。
