    - title_en: A Call to the Sandstone Pillars
      title_zh: 岩柱之上的召唤
      desc_en: The metropolitan of Thessaly proclaims that new monasteries shall crown the towering rock pillars above the plain, places so remote that no army or tax collector may easily reach them. Monks begin the long walk from Athos and beyond to answer the call.
      desc_zh: 塞萨利都主教昭告，将于平原上高耸的砂岩石柱之巅兴建新修道院，取其地势险绝，兵马赋吏皆难轻至。阿索斯及各地僧侣闻讯启程，长途跋涉而来。
      cost:
      - type: devotion
        value: -12
    - title_en: Monks Scale the Bare Rock
      title_zh: 僧侣攀岩而上
      desc_en: The first monks climb the sheer pillars using pegs driven into cracks and knotted ropes lowered from above, marking which summits are fit to hold a chapel. Local villagers are hired to haul the earliest supplies up on their backs.
      desc_zh: 首批僧侣借岩缝木橛与自上垂下的绳结攀上陡壁，勘定何处崖顶堪建礼拜堂。当地村民则受雇以背负之法运送最初所需物料。
      cost:
      - type: scaled_gold
        value: -6
    - title_en: Rope Hoists Are Strung Aloft
      title_zh: 架设悬空绳车
      desc_en: Net baskets and windlasses are rigged at the cliff edges so that stone, timber, and monks alike can be winched up hundreds of feet in a single swaying haul. A blessing is said over each hoist before its first ascent.
      desc_zh: 崖边架起绞盘与网篮，石料、木材乃至僧侣本人皆须借此一次次摇晃升起数百尺之高。每具绳车首次启用前，皆先诵经祝祷。
      cost:
      - type: devotion
        value: -15
    - title_en: The First Chapel's Walls Rise
      title_zh: 首座礼拜堂筑墙
      desc_en: On the flattened summit of the greatest pillar, masons lay the first true walls of a monastery chapel, their mortar mixed on the rock itself for want of any road below. What began as rope and ambition now stands as stone against the sky.
      desc_zh: 在最高石柱削平的顶端，石匠砌起礼拜堂真正的第一道墙，砂浆亦因山下无路可通而就地调制。昔日仅凭绳索与决心之事，如今已化作矗立云端的石墙。
      cost:
      - type: scaled_gold
        value: -8
    - title_en: Cells Cut Into the Cliff Face
      title_zh: 崖壁凿出僧舍
      desc_en: Small monastic cells are carved directly into hollows of the pillar's face, connected by narrow galleries clinging to the rock. Icon painters climb up to begin the frescoes that will cover every interior wall.
      desc_zh: 僧舍径直凿入石柱表面的凹陷之处，以贴壁而行的窄廊相互连通。圣像画师亦攀登而上，开始绘制日后将覆满内壁的湿壁画。
      cost:
      - type: artwork
        value: 1
    - title_en: The Refectory and Cistern
      title_zh: 斋堂与蓄水池
      desc_en: A refectory hall and a rock-cut cistern are completed to let the community endure long winters cut off from the valley below, while carved stairs begin replacing the oldest and most perilous rope ascents.
      desc_zh: 斋堂与凿岩而成的蓄水池相继完工，使僧团得以在与山下隔绝的漫长寒冬中自给自足；石阶亦渐次取代最初最为凶险的绳索攀道。
      cost:
      - type: scaled_gold
        value: -9
    - title_en: The Bell Tower Crowns the Pillar
      title_zh: 钟楼加冠石柱
      desc_en: A modest bell tower is raised at the pillar's summit, its ring meant to carry across the valley to the sister houses on neighboring rocks. Pilgrims below now gather at dawn simply to watch the monasteries catch the first light.
      desc_zh: 一座朴素钟楼于石柱之巅落成，钟声可传及邻近岩柱上的姊妹修道院。山下香客此后亦常于破晓时分驻足，只为观望修道院最先迎上晨光。
      cost:
      - type: religious_influence
        value: -15
    - title_en: The Pillars Are Consecrated to Heaven
      title_zh: 石柱奉献于天
      desc_en: The metropolitan climbs the finished stairs to consecrate the completed monastery before its assembled brotherhood, declaring the meteora, the rocks suspended in air, forever a refuge of the faith. From this height the devotion cultivated among the pillars now steadies the whole realm's resolve.
      desc_zh: 都主教沿竣工石阶登顶，于聚集的修士面前为新成修道院举行祝圣大典，宣告这悬于空中的岩石从此永为信仰之避难所。自此高处所凝聚的虔诚，亦令举国上下信念愈加坚定。
      cost:
      - type: artwork
        value: 1
      - type: devotion
        value: -30
