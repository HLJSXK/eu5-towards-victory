    stages:
    - title_en: The Order to Fortify the Confluence
      title_zh: 两河汇流筑垒令
      desc_en: The high command orders the old citadel above the Sava and Danube rebuilt into a modern star fortress, its bastions meant to hold this frontier crossing against every empire that covets it. Engineers are summoned from across the realm to survey the rock.
      desc_zh: 统帅部下令将萨瓦河与多瑙河交汇处的旧城堡改筑为新式棱堡要塞，务使此渡口重镇能抵御四方觊觎之敌。各地工程官奉召前来勘测岩基。
      cost:
      - type: scaled_gold
        value: -5
    - title_en: Engineers Survey the River Cliffs
      title_zh: 工程官勘测河崖
      desc_en: Military engineers chart the cliffs where the two rivers meet, marking out angled bastions that will cover every approach with crossing fields of fire. Garrison officers argue over which old walls may be kept and which must come down.
      desc_zh: 军中工程官细绘两河交汇之崖势，标定棱角分明的堡垒位置，务使各面皆能交叉火力覆盖。守将们则就旧城墙去留争论不休。
      cost:
      - type: scaled_gold
        value: -7
    - title_en: Stone and Cannon Brought Upriver
      title_zh: 溯流运石运炮
      desc_en: Barges haul limestone block and iron cannon upriver to the fortress landing, while requisitioned peasants and garrison troops are set to digging the first ditches. Rival powers' agents are already noted watching from across the water.
      desc_zh: 驳船溯流运来石灰岩条石与铁炮，征发之农夫与守军亦已开始挖掘壕沟。对岸已有敌国探子暗中窥伺此番动静。
      cost:
      - type: gold
        value: -60
    - title_en: The First Bastion Breaks Ground
      title_zh: 首座棱堡破土
      desc_en: Masons break ground on the fortress's first true bastion above the Sava, and the survey lines on paper finally become trenches, footings, and rising stone. Garrison drums mark the change from planning to labor each dawn.
      desc_zh: 石匠于萨瓦河畔破土兴建第一座真正的棱堡，图纸上的规划线终化作壕沟、地基与渐起的石墙。每日拂晓，守军战鼓皆报工序转换之讯。
      cost:
      - type: scaled_gold
        value: -9
    - title_en: The River Gates Are Raised
      title_zh: 河门筑起
      desc_en: Massive gates are set into the walls facing the Danube and Sava alike, allowing the garrison to command river traffic from both sides of the promontory. Cannon are hoisted into the first completed casemates.
      desc_zh: 面向多瑙河与萨瓦河的两座巨大城门相继筑成，使守军得以自岬角两侧掌控河上往来。首批完工的炮室内亦吊装入炮。
      cost:
      - type: gold
        value: -90
    - title_en: Bastions Climb the Upper Town
      title_zh: 棱堡渐筑上城
      desc_en: The angled bastions of the upper town rise course by course, their sloped stone faces designed to deflect siege shot rather than absorb it. Sappers dig covered galleries beneath the walls against future mining attempts.
      desc_zh: 上城棱堡逐层砌高，其斜面石墙专为偏转炮弹而非硬抗而设。工兵亦于墙下掘出暗道，以防日后敌军地道攻城。
      cost:
      - type: manpower
        value: -70
    - title_en: The Lower Town's Water Defenses
      title_zh: 下城水防告成
      desc_en: The lower town's river-facing works are completed with sally ports and a chain boom across the Sava, sealing the confluence against hostile shipping. Garrisons from three different armies have by now rotated through the still-unfinished works.
      desc_zh: 下城临河工事竣工，增设突击门与横锁萨瓦河的铁链，封锁河口以阻敌船。此际已有三支不同军旅的驻军先后轮换驻守于这未竟的工地。
      cost:
      - type: army_tradition
        value: -3
    - title_en: The Frontier Fortress Stands Complete
      title_zh: 边关要塞终成
      desc_en: Cannon salutes echo across both rivers as the garrison marches the full circuit of the completed walls for the first time, and the high command declares Belgrade's defenses beyond the reach of any single power's ambition. The fortress's reputation alone now makes rival courts think twice before provoking its master.
      desc_zh: 两河之上礼炮齐鸣，守军首度绕行竣工城垣一周，统帅部宣告贝尔格莱德防务已非任何一国野心所能撼动。此后但凭要塞威名，敌国朝廷亦须三思而后敢挑衅其主。
      cost:
      - type: honor
        value: -30
