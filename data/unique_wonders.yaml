  ceremony:
    stage_1_reward:
    - type: devotion
      value: 18
    - type: cultural_influence
      value: 12
    - type: prestige
      value: 12
    stages:
    - title_en: The King Orders a Mountain of Stone
      title_zh: 王命兴建须弥之殿
      desc_en: Suryavarman II summons his court to announce a temple-mountain for Vishnu, its five towers to rise higher than any shrine yet built in the Khmer lands.
      desc_zh: 苏利耶跋摩二世召集群臣，宣告要为毗湿奴神修建一座塔庙山，五座尖塔将高过高棉境内所有既成的神殿。
      cost:
      - type: prestige
        value: -12
    - title_en: The Astrologers Fix the Western Gate
      title_zh: 星象师定西向朝门
      desc_en: Court astrologers insist the temple face west rather than east, an unusual choice they read from the stars, and Brahmin priests walk the moat's future line to bless the ground.
      desc_zh: 宫廷星象师坚持殿门须朝西而非朝东，称此乃星象所示的殊例，婆罗门祭司沿护城河未来的轮廓行走，为地基祝祷。
      cost:
      - type: devotion
        value: -12
    - title_en: Sandstone Descends the Kulen Hills
      title_zh: 荔枝山砂岩顺流而下
      desc_en: Blocks of sandstone are cut at the Kulen hills and floated down canals on rafts, while elephants haul the largest stones the last stretch to the temple site.
      desc_zh: 荔枝山上开凿出一块块砂岩，顺运河以木筏运送，最重的石块则由大象拖曳最后一段路，送抵庙址。
      cost:
      - type: scaled_gold
        value: -5
    - title_en: The Moat Is Cut and the Platform Rises
      title_zh: 护城河开凿，台基初立
      desc_en: Laborers begin cutting the great moat that will encircle the temple, and the first foundation platform is raised from the drained earth at its center.
      desc_zh: 民夫开始挖掘将环绕全庙的护城河，中心的排水地基上，第一层台基随之筑起。
      cost:
      - type: gold
        value: -60
    - title_en: The Five Towers Climb Toward Meru
      title_zh: 五塔层叠向须弥
      desc_en: Tier by tier the central towers climb, echoing the peaks of Mount Meru, while the long processional causeway is paved stone by stone across the moat.
      desc_zh: 中央诸塔一层层攀高，仿若须弥山之诸峰，横跨护城河的长长引道也一块接一块铺石成形。
      cost:
      - type: artwork
        value: 1
    - title_en: The Galleries Tell the Churning of the Sea
      title_zh: 回廊浮雕搅动乳海
      desc_en: Sculptors carve the long gallery walls with gods and demons churning the Sea of Milk, row upon row of apsaras dancing in the stone beside them.
      desc_zh: 雕工在长廊石壁上刻下众神与阿修罗共搅乳海的场景，一列列飞天仙女也在石间翩然起舞。
      cost:
      - type: artwork
        value: 1
    - title_en: Monsoon Floods Test the Causeway
      title_zh: 雨季洪水考验长堤
      desc_en: A season of heavy rains floods the unfinished moat and threatens the causeway's foundations, but gangs of laborers work through the wet months to hold the line.
      desc_zh: 一场连绵的雨季使未竣工的护城河水位暴涨，威胁到引道的地基，成群的民夫在多雨的月份里坚持施工，勉力守住工程。
      cost:
      - type: manpower
        value: -50
    - title_en: The Temple Is Dedicated to Vishnu
      title_zh: 圣殿落成，毗湿奴垂佑
      desc_en: Priests lead a great dedication procession across the finished causeway to the central sanctuary, and the kingdom is proclaimed to stand forever under Vishnu's favor.
      desc_zh: 祭司引领盛大的奉献队伍走过竣工的引道，直抵中央圣所，王国自此被宣告将永受毗湿奴护佑。
      cost:
      - type: devotion
        value: -30
