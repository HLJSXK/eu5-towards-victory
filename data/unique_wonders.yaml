      desc_zh: 石匠将唱诗席的首批石柱立于新挖的地基之中，历经多年筹划，这座教堂终于化作西岱岛上可见的施工。
      cost:
      - type: scaled_gold
        value: -6
    - title_en: The Flying Buttresses Take Their Stance
      title_zh: 飞扶壁初立姿态
      desc_en: Masons raise the daring flying buttresses along the nave's flanks, a new solution that lets the walls climb higher and thinner than any church Paris has known.
      desc_zh: 石匠沿中殿两侧竖起大胆的飞扶壁，这一新颖手法使墙体得以比巴黎任何既有教堂更高、更薄地攀升。
      cost:
      - type: research_progress
        value: -12
    - title_en: The Rose Windows Are Set in Glass
      title_zh: 玫瑰窗嵌入彩玻璃
      desc_en: Glaziers fit the great rose windows with panes of deep blue and crimson glass, flooding the nave with colored light that scholars already call a sermon in itself.
      desc_zh: 玻璃工匠将深蓝与绯红的彩色玻璃嵌入巨大的玫瑰窗，为中殿注入斑斓光影，学者们称此景本身即是一场无言的布道。
      cost:
      - type: artwork
        value: 1
    - title_en: Fire Threatens the Timber Roof
      title_zh: 火患威胁木顶
      desc_en: A carpenter's brazier sets the scaffolding alight one winter night, and only a desperate chain of workers and clergy with buckets from the Seine saves the half-finished roof from ruin.
      desc_zh: 一个冬夜，木匠的炭盆引燃了脚手架，唯有工匠与神职人员从塞纳河紧急传递水桶，方才挽救了尚未完工的屋顶。
      cost:
      - type: gold
        value: -90
    - title_en: Notre-Dame Is Consecrated
      title_zh: 巴黎圣母院正式祝圣
      desc_en: Bells peal across the Ile de la Cite as the finished cathedral is consecrated before the king, the clergy, and the city's guilds, and Notre-Dame stands as a permanent wellspring of art and devotion for the realm.
      desc_zh: 西岱岛上钟声齐鸣，国王、神职人员与城中各行会共同见证这座竣工教堂的祝圣仪式，巴黎圣母院自此成为全国艺术与信仰永恒的源泉。
