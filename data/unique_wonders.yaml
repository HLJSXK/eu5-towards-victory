      title_zh: 白塔渐高，俯瞰河流
      desc_en: Storey by storey the great keep rises pale above the Thames, its thick walls and narrow windows already marking it as a fortress meant to hold both enemies and prisoners alike.
      desc_zh: 巨大的主塔沿泰晤士河畔逐层升高，其厚墙与窄窗已昭示这将是一座既能御敌、亦能囚人的要塞。
