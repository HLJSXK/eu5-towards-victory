      title_zh: 乐僔发愿凿崖
      desc_en: The monk Le Zun claims a vision of a thousand Buddhas above the cliffs near Dunhuang and vows to carve a sanctuary into the rock. Merchants passing on the Silk Road pledge silver toward the work.
      desc_zh: 僧人乐僔自称在敦煌附近的崖壁上见千佛显现，遂发愿凿窟建寺。往来丝路的商旅纷纷解囊，资助此愿。
      cost:
      - type: devotion
        value: -10
    - title_en: The Cliff Face Is Chosen
      title_zh: 相地大泉河畔
      desc_en: Surveyors walk the sandstone bluffs above the Daquan stream, marking where the rock is sound enough to bear a cave temple. The oasis below is judged fit to sustain generations of builders.
      desc_zh: 勘察者沿大泉河畔的砂岩崖壁行走，标出岩质坚实、可开凿佛窟之处。崖下的绿洲也被认定足以供养世代营建之人。
      cost:
      - type: scaled_gold
        value: -4
    - title_en: Pigments and Timber Are Gathered
      title_zh: 备料齐备
      desc_en: Caravans bring lapis and ochre pigments from distant mountains, while local carpenters cut timber for scaffolding against the cliff. Sculptors mix clay and straw for the images yet to be shaped.
      desc_zh: 商队自远山运来青金石与赭石颜料，本地工匠则伐木搭建崖上的脚手架。塑匠调和泥土与麦秸，为即将塑造的佛像做准备。
      cost:
      - type: artwork
        value: 1
    - title_en: The First Chamber Is Carved
      title_zh: 首窟凿开
      desc_en: Chisels finally bite into the sandstone, and a first modest chamber opens into the cliff above Dunhuang. What began as a vision and a pledge of silver is now a hollow carved into living rock.
      desc_zh: 凿子终于凿入砂岩，敦煌崖壁上开出第一间朴素的洞窟。当初的一场梦兆与一笔香资，如今已化作岩壁中真实的洞穴。
      cost:
      - type: scaled_gold
        value: -6
    - title_en: A Colossal Buddha Takes Form
      title_zh: 大佛渐显法相
      desc_en: Sculptors build a towering Buddha image from a timber frame packed with clay, working upward on bamboo platforms lashed inside the cave. Pilgrims below crane their necks to guess its final height.
      desc_zh: 塑匠以木架为骨、层层敷泥，塑起一尊高大佛像，工匠攀于窟内绑扎的竹架之上向上作业。窟下香客仰首而望，猜测佛像最终会有多高。
      cost:
      - type: artwork
        value: 1
    - title_en: Silk Road Scenes Cover the Walls
      title_zh: 壁画绘满丝路众生
      desc_en: Painters fill the chamber walls with scenes of merchants, monks, and heavenly musicians drawn from the trade routes beyond the oasis. Fresh pigment dries by lamplight long after the caravans outside have made camp for the night.
      desc_zh: 画工在窟壁上绘满商旅、僧侣与飞天伎乐，取材于绿洲之外的商路见闻。窟外商队已扎营歇息，窟内的新绘颜料仍借灯光慢慢阴干。
      cost:
      - type: cultural_tradition
        value: -8
    - title_en: The Library Cave Is Sealed
      title_zh: 藏经洞封存
      desc_en: Generations of monks and merchants add new caves along the cliff, and a hidden chamber is filled with sutras, contracts, and letters before being sealed away. No one now recalls exactly which niche holds it.
      desc_zh: 历代僧侣与商贾陆续在崖壁增凿新窟，其中一处密室被堆满经卷、契约与书信后封闭起来。如今已无人能确切说出它藏在哪一处窟龛之中。
      cost:
      - type: artwork
        value: 1
    - title_en: Mogao Becomes a Sacred Waypoint
      title_zh: 莫高窟成丝路圣地
      desc_en: The caves along the cliff are consecrated together, their painted Buddhas watching over every caravan that passes beneath. Mogao's fame as a sanctuary of the Silk Road now carries the realm's culture far along the trade roads.
      desc_zh: 崖壁上诸窟一并落成开光，彩绘佛像俯视着每一支经过窟下的商队。莫高窟作为丝路圣地的声名，从此将国家的文化传扬至遥远的商道尽头。
      cost:
      - type: devotion
        value: -30
      - type: cultural_tradition
        value: -15
