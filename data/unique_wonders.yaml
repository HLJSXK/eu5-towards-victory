      desc_zh: 萨克森宫廷宣布在易北河畔兴建一座新画廊，用以陈列选帝侯日益丰富的绘画、瓷器与珍奇收藏。宫廷画师奉命描绘首个展厅的草图，尽管此时连一面墙都尚未建起。
