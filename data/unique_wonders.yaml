  key: unique_kremlin
  base_key: star_fortress_city
  concept: tv_wonder_unique_kremlin
  location: moscow
  image: tv_wonder_unique_kremlin
  prompt: Moscow Kremlin in the early Tsardom, red brick walls and towers, cathedrals and palace courts inside, tsar coronation procession, snow-bright Russian city, historically grounded world wonder key art, cinematic fortress-palace view, ultra-detailed, no modern elements.
