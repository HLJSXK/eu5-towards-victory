      desc_zh: 设防回廊间钟声回荡，大修道院宣告竣工，其缮写室与城墙一并受到祝圣，圣谢尔盖创立的这座基业自此成为全国学问与信仰永恒的源泉。
      cost:
      - type: devotion
        value: -30
