    - title_en: Blessing the Copper Kettles
      title_zh: 为铜制酿酒锅祝圣
      desc_en: Coppersmiths deliver the first great brewing kettles, and a court chaplain blesses them before the fires are lit, as is custom for any vessel meant to serve the duchy's table. Coopers begin shaping the barrels that will carry the brew to every corner of the city.
      desc_zh: 铜匠交付了首批巨大的酿酒锅，宫廷牧师依照惯例为其祝圣后方可点火——凡是要供公国餐桌之用的器皿皆需如此。制桶匠们开始打制酒桶，日后将把成酒运往城中各处。
      cost:
