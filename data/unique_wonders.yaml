      title_zh: 面对恒河立下宏愿
      desc_en: A ruler stands at the water's edge at dawn and vows to rebuild the crumbling steps of sacred Kashi in stone that will outlast any single reign. Pilgrims already bathing nearby take the vow as a good omen for the coming work.
      desc_zh: 统治者于黎明时分立于恒河水畔，立誓要以坚石重修圣城迦尸那已然残破的石阶，使其超越一朝一代而长存。附近正在沐浴的香客将此誓言视为工程顺遂的吉兆。
      cost:
      - type: artwork
        value: 1
    - title_en: Priests Bless the Riverbank
      title_zh: 祭司为河岸祈福
      desc_en: Priests walk the length of the chosen bank chanting blessings and marking where each tier of steps should descend to the water. Local stonemasons are consulted on which quarries upstream can supply stone worthy of the river's sanctity.
      desc_zh: 祭司沿选定的河岸徐徐而行，口诵祝祷，标示出每一层石阶应延伸入水的位置。本地石匠受邀商议，上游哪处采石场的石料才配得上这条圣河的神圣。
      cost:
      - type: devotion
        value: -10
    - title_en: Stone Is Rafted Down the River
      title_zh: 石料顺流筏运而下
      desc_en: Rafts laden with quarried stone drift downriver toward Kashi, guided by boatmen who know every current between the quarry and the ghats. Laborers gather at the bank to unload each raft before the next arrives.
      desc_zh: 满载石料的木筏顺流而下驶向迦尸，船夫熟知采石场至河坛之间的每一道水流走势。劳工们聚在岸边卸下每一筏石料，赶在下一筏抵达前腾出空地。
      cost:
      - type: scaled_gold
        value: -5
    - title_en: The First Steps Meet the Water
      title_zh: 第一级石阶触及水面
      desc_en: Masons set the first stone steps directly at the waterline, the true work of building now begun where planning had only marked lines in the sand. Pilgrims pause their morning bathing to watch each block settle into place.
      desc_zh: 石匠将第一级石阶稳稳砌于水线之处，真正的营造之功由此展开，先前不过是沙上划线的谋划。晨浴的香客也停下脚步，望着每一块石头稳稳落位。
      cost:
      - type: religious_influence
        value: -12
    - title_en: The Tiers Climb the Bank
      title_zh: 阶层沿岸拾级而上
      desc_en: Tier upon tier of steps rise up the bank, wide enough for processions of pilgrims to descend abreast to the water at dawn. Vendors of lamps and flower garlands begin setting up along the newly finished landings.
      desc_zh: 层层石阶沿河岸向上延展，宽度足以容纳晨间成群结队的香客并肩而下入水。卖灯盏与花环的小贩，也开始在新落成的平台边支起摊子。
      cost:
      - type: artwork
        value: 1
    - title_en: Temples and Lamp-Towers Are Raised
      title_zh: 庙宇灯塔相继矗立
      desc_en: Small temples and towers for the evening lamp ceremonies are built along the steps, their bells soon ringing out over the water each dusk. Priests take up permanent residence in the shrines nearest the river.
      desc_zh: 石阶沿线陆续建起小庙与晚间燃灯所用的灯塔，暮色中钟声不久便回荡在水面之上。祭司随即在离河最近的神龛中长住下来。
      cost:
      - type: harmony
        value: -8
    - title_en: The Cremation Grounds Are Set Apart
      title_zh: 焚场另辟一隅
      desc_en: A separate stretch of the ghats is set aside and consecrated for funeral rites, its smoke rising steadily as families come from distant provinces to release their dead into the sacred river. Attendants tend the fires day and night without pause.
      desc_zh: 河坛另辟一段并加以奉献，专供丧葬仪式之用，各地远来的家族携亡者至此付诸圣河，青烟终日不绝。看火人昼夜守候，从不间断。
      cost:
      - type: devotion
        value: -18
    - title_en: The Ghats Are Consecrated at Dawn
      title_zh: 晨曦中河坛终获奉献
      desc_en: At first light, priests and pilgrims by the thousands gather for the consecration of the completed ghats, lamps set adrift across the water in a shimmering procession. The river's sanctity, now given lasting stone form, steadies the faithful across the realm.
      desc_zh: 晨光初现，成千上万的祭司与香客齐聚河坛，庆贺这座石阶终告落成。河面上漂满点点烛灯，宛如一条流动的光河。这条圣河的神圣，如今已凝成恒久的石阶，令举国信众心境安宁。
      cost:
      - type: artwork
        value: 1
      - type: devotion
        value: -25
