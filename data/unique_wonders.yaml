      title_zh: 铜锅悬挂就位
      desc_en: The great copper kettles are hoisted onto their hearths, and the first test brews fill the hall with the smell of malt and hops. Guild workers and ducal officials alike gather to taste the first cautious sample.
      desc_zh: 巨大的铜锅被吊挂至炉台之上，首批试酿的麦芽与啤酒花香气弥漫整座厂房。行会工匠与公国官员们齐聚一堂，小心翼翼地品尝第一口试酿。
      cost:
      - type: scaled_gold
        value: -8
    - title_en: Cellars Cut Deep Below
      title_zh: 深挖地窖以供陈酿
      desc_en: Laborers cut cool cellars deep beneath the brewhouse, where the beer will lager through the summer months untouched by the heat. Officials mark each cask with the ducal seal as it is rolled into the dark.
      desc_zh: 工人们在酿酒坊之下深挖出凉爽的地窖，供啤酒在夏季陈放发酵、免受暑热侵扰。每一只酒桶滚入幽暗地窖之前，官员都会为其烙上公国印记。
      cost:
      - type: scaled_gold
        value: -6
    - title_en: The Beer Hall Courtyard Opens
      title_zh: 啤酒庭院对外开放
      desc_en: Long tables and awnings fill the courtyard as the brewhouse opens its yard to the city for the first public tasting. Wagons of barrels roll out through the gates toward taverns across Bavaria before the last table is even cleared.
      desc_zh: 长桌与遮篷摆满庭院，酿酒坊首次向全城开放试饮。满载酒桶的马车已驶出坊门、奔赴巴伐利亚各地的酒馆，庭院中最后一张长桌尚未收拾完毕。
      cost:
      - type: gold
        value: -70
    - title_en: The Royal Brewery Is Proclaimed Open
      title_zh: 皇家啤酒坊正式开坊
      desc_en: The duke himself taps the first official cask as the royal brewery is proclaimed open for good, its kettles, cellars, and coopers now a permanent fixture of Munich's economy. Production across the realm hums a little steadier knowing Bavaria's own brewhouse stands behind it.
      desc_zh: 公爵亲自敲开第一桶官酿，正式宣告皇家啤酒坊永久开坊，其铜锅、地窖与制桶作坊自此成为慕尼黑经济的固定支柱。举国上下，只因巴伐利亚有了自己的皇家酒坊撑腰，生产也似乎运转得更加稳健。
