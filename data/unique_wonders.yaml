  prompt: Santa Maria del Fiore in Renaissance Florence, immense red-tiled dome by Brunelleschi, marble cathedral facade, Giotto campanile, guild banners, scaffolds, crowded piazza, historically grounded world wonder key art, cinematic urban panorama, ultra-detailed, no modern elements.
  is_unique: true
