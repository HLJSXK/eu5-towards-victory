    - title_en: The Merchants' Oath
      title_zh: 商人的誓约
      desc_en: Guild merchants and royal factors swear before the Casa's officials to report every ingot and pearl, binding fortune and fraud alike to the crown's careful bookkeeping.
      desc_zh: 行会商人与王室代理人在贸易署官员面前起誓，承诺如实申报每一块银锭与珍珠，将财富与欺诈皆纳入王室的细密簿册。
