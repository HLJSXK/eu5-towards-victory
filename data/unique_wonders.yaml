      title_zh: 可汗下令兴建浩罕宫殿
      desc_en: The Khan of Kokand, ruler of the rich Ferghana valley, commands that a new palace rise to receive envoys and tribute befitting his khanate's growing wealth along the silk roads. Architects from Bukhara and Kashgar are summoned to draw the first plans for painted halls and gardens.
      desc_zh: 浩罕汗国的可汗，这位统治富饶费尔干纳谷地的君主，下令兴建一座新宫殿，以配得上其汗国沿丝路日益增长的财富，用以接待使节与朝贡。来自布哈拉与喀什的建筑师奉召而来，为彩绘厅堂与花园绘制最初的图纸。
