      title_zh: 白鹭天守迎军入驻
      desc_en: A formal procession of samurai enters the finished castle in ceremonial order, and the white heron keep is declared to stand as a permanent shield over the domain's soldiers.
      desc_zh: 武士依礼制列队进入竣工的城郭，白鹭天守自此被宣告为守护领内将士的永固屏障。
