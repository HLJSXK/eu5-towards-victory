    - title_en: The Foundation Is Consecrated
      title_zh: 奠基祭地
      desc_en: Monks chant through the night over the chosen plot south of the Qinhuai River, and incense smoke settles over freshly turned earth. Relics are said to be sealed beneath the future tower's heart.
      desc_zh: 秦淮河畔选定之地上，僧众彻夜诵经，香烟缭绕新翻的泥土。相传舍利已被封入未来塔心之下。
      cost:
