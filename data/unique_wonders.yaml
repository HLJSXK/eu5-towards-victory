      desc_en: The Son of Heaven proclaims that a great circular temple shall rise south of the capital, where the emperor alone may offer sacrifice to Heaven and pray for the harvest on behalf of all under him. Court astronomers are ordered to fix the most auspicious ground.
      desc_zh: 天子降诏，将于都城之南兴建一座圆形巨坛，唯天子一人得以于此祭天，为普天之下祈求丰年。钦天监随即奉命勘定最为吉利之地。
      cost:
      - type: devotion
        value: -12
    - title_en: Astronomers Align the Sacred Axis
      title_zh: 钦天监校准圣轴
      desc_en: Court astronomers align the temple's future axis so that the emperor's path from palace to altar faces due south, and the boundary walls are marked to separate the round heaven from the square earth it will enclose. Cypress saplings are chosen for the groves that will one day shade the approach.
      desc_zh: 钦天监校准圣坛未来之中轴，使天子自宫城至祭坛之御道正朝南方，界墙亦划定以分隔即将围合的天圆地方之制。柏树幼苗亦已择定，日后将荫蔽御道两侧。
      cost:
      - type: celestial_authority
        value: -8
    - title_en: Blue Glazed Tiles Fired for Heaven
      title_zh: 为天特制蓝琉璃瓦
      desc_en: Imperial kilns are set to firing tile of the deepest blue, the color reserved for Heaven alone, while corvee laborers from the surrounding provinces are mustered to clear and level the sacred precinct. Marble is quarried and marked for the altar's three circular tiers.
      desc_zh: 御窑专烧最深之蓝色琉璃瓦，此色唯天独享；周边诸省征调之役夫亦已集结，清理并平整此片圣地。大理石亦经开采标记，专供祭坛三层圆台所用。
      cost:
