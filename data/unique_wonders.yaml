    stages:
    - title_en: The Khan Declares the Sacred Peak
      title_zh: 汗王敕封圣山
      desc_en: The court declares Changbai Mountain the ancestral birthplace of the Manchu people and orders an altar raised upon its terraces to honor Heaven and the founding spirits. Shamans and imperial envoys are dispatched north at once to prepare the rites.
      desc_zh: 朝廷诏告长白山为满洲肇兴之圣地，敕命于山间筑坛以祭天地及肇祖英灵。萨满与钦差随即启程北上，筹备祭典诸事。
      cost:
      - type: devotion
        value: -10
    - title_en: Shamans Read the Heavenly Lake
      title_zh: 萨满卜问天池
      desc_en: Shamans camp beside the crater lake for nights on end, watching cloud and reflection for signs that the mountain accepts the offering to come. Only after favorable omens are read do the envoys mark the terrace where the altar will stand.
      desc_zh: 萨满于天池畔连宿数夜，观云影变幻，以卜山神是否纳其后来之祭。待得吉兆，钦差方于台地上划定祭坛方位。
      cost:
      - type: religious_influence
        value: -10
    - title_en: Offerings Gathered From the Forest
      title_zh: 山林备办祭品
      desc_en: Hunters and foresters bring sable pelts, ginseng root, and pine timber down from the slopes as tribute for the altar's construction, while banner troops clear a processional path through the forest below.
      desc_zh: 猎户与山民自坡地携貂皮、人参、松木而下，作为筑坛之贡；八旗兵丁则于山下林间开辟出祭祀通行之道。
      cost:
      - type: scaled_gold
        value: -6
    - title_en: Stone Is Cut for the Terraces
      title_zh: 凿石筑台始
      desc_en: Stonecutters begin dressing volcanic rock into the tiered terraces of the altar, working through the thin mountain air as the first true stonework of the shrine takes shape at last. The banners of the imperial envoys are planted at the site to mark its consecration underway.
      desc_zh: 石匠于稀薄山风中始凿火山岩，砌成祭坛层层台阶，庙宇真正的营造工程自此展开。钦差旌旗立于坛畔，昭示奉圣之礼正式动工。
      cost:
      - type: scaled_gold
        value: -8
    - title_en: The Lower Terraces Rise
      title_zh: 下层祭台渐起
      desc_en: The altar's lower terraces are completed in dark volcanic stone, and shamans begin performing the first offering rites atop them even as work continues above. Banners bearing the Aisin Gioro colors snap in the cold wind over the site.
      desc_zh: 祭坛下层以黑色火山岩砌成，萨满已开始于台上行初祭之礼，而上层营造仍在继续。爱新觉罗旗色于寒风中猎猎作响，飘扬坛顶。
      cost:
      - type: devotion
        value: -18
    - title_en: Steps Carved Toward the Lake
      title_zh: 凿阶通向天池
      desc_en: A stair of hewn stone is carved up the crater's inner slope so that envoys may descend to draw water from the Heavenly Lake itself for the consecration. Pilgrims begin gathering at the mountain's foot to witness the rite in progress.
      desc_zh: 工匠沿火山内壁凿出石阶，使钦差得以下至天池亲取圣水，用于奉圣大典。山脚下渐有香客聚集，欲一睹祭礼盛况。
      cost:
      - type: religious_influence
        value: -20
    - title_en: The Upper Altar Is Crowned
      title_zh: 上坛加冠
      desc_en: The uppermost terrace is finished and crowned with carved stone markers naming the founding ancestors, while shamans rehearse the full cycle of offerings that will accompany the mountain's consecration.
      desc_zh: 最上层祭台竣工，并立石碑镌刻列祖之名。萨满亦反复演练封山大典所需的完整祭仪程序。
      cost:
      - type: artwork
        value: 1
    - title_en: Heaven Accepts the Mountain's Offering
      title_zh: 天纳圣山之祭
      desc_en: Before assembled banners and envoys, the shamans complete the great offering at the summit altar, and the court declares Changbai Mountain forever sacred to the dynasty. The rites performed there now steady the court's own spending, its blessing settling over palace and treasury alike.
      desc_zh: 八旗与钦差齐聚坛前，萨满完成峰顶大祭，朝廷宣告长白山永为本朝圣地。自此山中祭仪之福泽及于宫廷用度，使内府开支亦趋稳健。
      cost:
      - type: artwork
        value: 1
      - type: devotion
        value: -28
