    stages:
    - title_en: The Commune Grants a Charter
      title_zh: 市政议会颁发特许状
      desc_en: The consuls of Bologna put their seals to a charter granting jurists the right to teach and dispute freely within the city's walls. Word spreads quickly among traveling scholars that a new studium is forming.
      desc_zh: 博洛尼亚执政官在特许状上盖下印玺，准许法学教师在城墙之内自由讲学、公开辩难。消息很快传到四方游学的学者耳中，一座新的学问之城正在成形。
      cost:
      - type: artwork
        value: 1
    - title_en: The Nations of Scholars Assemble
      title_zh: 各国学子结社而立
      desc_en: Students arriving from beyond the Alps organize themselves into nationes for mutual protection and voice, electing rectors from among their own ranks. Landlords along the old Roman walls are persuaded to lease rooms rather than sell them.
      desc_zh: 翻越阿尔卑斯山而来的异乡学子按乡籍结成社团，互为倚靠，并从中推举出各自的代表。旧罗马城墙边的房主被说动，将屋舍出租而非典卖。
      cost:
      - type: cultural_influence
        value: -5
    - title_en: Barbarossa's Protection Is Sought
      title_zh: 恳请皇帝颁诏庇护
      desc_en: Envoys petition the emperor for a writ guaranteeing safe passage to scholars far from home, so that no lord may seize a student for a debt owed by his countrymen. The privilege, once granted, is copied and carried by every traveling clerk.
      desc_zh: 使者奔走求得皇帝手谕，保障远游学子的安全通行，免使任何领主因同乡欠债而扣押无辜学生。诏令一旦颁下，便被抄录无数份，随游学书生四处传布。
      cost:
      - type: artwork
        value: 1
    - title_en: The First Lecture Hall Rises
      title_zh: 第一座讲堂动工
      desc_en: Masons break ground on a proper schola near the arcaded quarter, timber benches and a raised lectern marking the shift from borrowed rooms to a hall built for teaching alone. The glossators watch the foundations laid with evident satisfaction.
      desc_zh: 石匠在拱廊街区附近破土动工，木质长凳与高台讲席取代了从前借用的民居厢房，专为授业而建的讲堂正式立起。注释法学派的学者们看着地基铺开，神情颇为欣慰。
      cost:
      - type: scaled_gold
        value: -5
    - title_en: The Porticoes Stretch Onward
      title_zh: 廊柱一路蔓延
      desc_en: Arcaded porticoes are extended street by street, sheltering students from Bologna's rain as they carry their manuscript cases between lodging and lecture. Merchants along the route begin selling ink, parchment, and secondhand law texts.
      desc_zh: 拱廊沿街一段段延伸开去，为怀抱手稿匣往返于寓所与讲堂之间的学子遮风挡雨。沿途商贩顺势摆起摊子，售卖墨水、羊皮纸与旧法典抄本。
      cost:
      - type: gold
        value: -50
    - title_en: The Archive of Glosses Is Built
      title_zh: 注疏文库落成
      desc_en: A stone archive rises to house the accumulating glosses on Roman law, its shelves guarded against fire and damp by order of the doctors. Copyists labor by lamplight to keep pace with the demand for fresh manuscripts.
      desc_zh: 一座石造文库拔地而起，专为收藏日益积累的罗马法注疏，博士们下令严防火患与潮气侵蚀书架。抄写员在灯下昼夜不辍，仍难追上手稿的求索之众。
      cost:
      - type: research_progress
        value: -15
    - title_en: The Disputation Towers Are Crowned
      title_zh: 论辩之塔加冕而立
      desc_en: Civic towers overlooking the schola are fitted with balconies where doctors preside over public disputations, drawing crowds of townsfolk to hear the arguments ring out. A famous jurist is said to have swayed a verdict from such a height.
      desc_zh: 俯瞰讲堂的市塔加装了阳台，博士们于此主持公开论辩，引来满城百姓驻足倾听雄辩之声回荡不绝。据传曾有名震一时的法学家，正是在此高处扭转了一桩判决。
      cost:
      - type: prestige
        value: -20
    - title_en: The Studium Generale Is Proclaimed
      title_zh: 综合学府正式宣告
      desc_en: Doctors, rectors, and civic magistrates gather to proclaim Bologna's studium a school without equal, its degrees recognized wherever its graduates travel. The university's promise of trained minds and steady administration becomes a lasting asset of the realm.
      desc_zh: 博士、学监与市政官员齐聚一堂，宣告博洛尼亚学府冠绝天下，其学位无论毕业生游历何方皆受尊崇。这座大学培养出的贤才与稳健治理，从此成为国家长久倚仗的根基。
      cost:
      - type: research_progress
        value: -30
