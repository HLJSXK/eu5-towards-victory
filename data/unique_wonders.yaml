    stages:
    - title_en: A King's Vow After Saint Quentin
      title_zh: 圣康坦战后国王的誓愿
      desc_en: Philip II vows a monastery to Saint Lawrence in thanks for victory at Saint Quentin, to serve as monastery, palace, and royal tomb at once. Court clerks begin drafting the charter that same week.
      desc_zh: 腓力二世为感念圣康坦一役之胜，向圣洛伦索许下建造修道院之愿，欲使其兼作修院、王宫与皇室墓穴。宫廷书记当周便着手起草敕状。
      cost:
      - type: legitimacy
        value: -10
    - title_en: The Sierra Site Is Chosen
      title_zh: 塞拉山麓择地
      desc_en: Royal surveyors climb the foothills of the Sierra de Guadarrama, weighing the austere stone slopes against the king's plain tastes. A modest village called El Escorial gives the site its name.
      desc_zh: 王室勘察者攀上瓜达拉马山麓，权衡这片朴素的石坡是否契合国王简朴的心意。一处名为埃斯科里亚尔的小村，就此赋予选址之名。
      cost:
      - type: scaled_gold
        value: -4
    - title_en: Architects and Granite Are Commissioned
      title_zh: 建筑师与花岗岩就绪
      desc_en: Juan Bautista de Toledo is summoned to draft the plans, and quarries nearby are opened to supply the grey granite the king demands. Masons and monks alike are recruited for a project meant to outlast them all.
      desc_zh: 胡安·包蒂斯塔·德·托莱多奉召绘制图纸，附近采石场也随之开凿，供应国王指定的灰色花岗岩。石匠与修士纷纷应召加入，投身这项注定比他们更长久的工程。
      cost:
      - type: scaled_gold
        value: -6
    - title_en: The Foundation Stone Is Laid
      title_zh: 奠基石就位
      desc_en: The king himself lays the first granite block, and courses of grey stone begin to rise across the chosen slope. What was until now plans and quarried rock finally becomes the monastery's true foundation.
      desc_zh: 国王亲手安放第一块花岗石，灰色石料随之在选定的山坡上层层垒起。此前不过是图纸与采出的石料，如今终于化作修道院真正的地基。
      cost:
      - type: legitimacy
        value: -15
    - title_en: The Basilica Dome Takes Shape
      title_zh: 大殿穹顶渐成
      desc_en: The great basilica rises at the courtyard's heart, its dome climbing course by course above the surrounding cloisters. Workers say the whole valley echoes with the ring of chisels from dawn until dusk.
      desc_zh: 宏伟的大殿在庭院中心拔起，其穹顶在四周回廊之上一层层升高。工匠说，整座山谷自晨至暮都回荡着凿石之声。
      cost:
      - type: devotion
        value: -12
    - title_en: The Royal Library Fills
      title_zh: 王家藏书渐丰
      desc_en: Shelves rise in the new library hall as volumes are carried in from across the realm and beyond, while monks' cells line the quiet corridors nearby. The king is said to walk the stacks himself, choosing which books deserve a place.
      desc_zh: 新建藏书厅内书架渐次立起，来自国内外的典籍陆续运抵，静谧的回廊两侧则排满修士的居室。据说国王时常亲自巡视书架，挑选哪些书卷配得上一席之地。
      cost:
      - type: research_progress
        value: -10
    - title_en: The Pantheon Is Prepared Below
      title_zh: 地下墓穴营建
      desc_en: Deep beneath the basilica, masons carve out a royal pantheon where the king's ancestors and descendants will one day rest. Austerity is enforced everywhere above, as if the whole building were built to outlast vanity itself.
      desc_zh: 大殿之下，石匠开凿出王室墓穴，供国王的先祖与后嗣日后长眠于此。地面之上则处处恪守简朴，仿佛整座建筑生来便要超越一切虚荣。
      cost:
      - type: legitimacy
        value: -20
    - title_en: El Escorial Is Consecrated
      title_zh: 埃斯科里亚尔终告落成
      desc_en: The monastery-palace stands complete at last, austere granite walls rising against the Sierra sky as bells ring through its courtyards for the first time. The king retreats here to govern in quiet, and his throne draws a steadier legitimacy from the stone itself.
      desc_zh: 这座修院王宫终于完工，肃穆的花岗岩墙垣映衬着塞拉山天际，钟声首次回荡于庭院之间。国王自此退居于此静治国事，王座也因这石头本身而获得更为稳固的正统性。
      cost:
      - type: legitimacy
        value: -35
