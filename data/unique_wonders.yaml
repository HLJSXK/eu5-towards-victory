  key: unique_malacca_port
  base_key: great_port
  concept: tv_wonder_unique_malacca_port
  location: malacca
  image: tv_wonder_unique_malacca_port
  prompt: The port of Malacca in the fifteenth century, crowded entrepot on the strait, Malay warehouses, Chinese junks, Indian and Arab merchants, monsoon ships, merchant covenant ceremony, historically grounded world wonder key art, cinematic harbor panorama, ultra-detailed, no modern elements.
  is_unique: true
  initial_level: 0
  mechanic_key: great_port
  base_effect_multiplier: 2
  final_buildings:
