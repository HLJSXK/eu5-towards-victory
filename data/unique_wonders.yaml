      value: 6
    stages:
    - title_en: The Crown Commissions a River Sentinel
      title_zh: 王命建河口哨塔
      desc_en: The crown orders a fortified tower raised on the Tagus shoal at Belem to guard the approach to Lisbon and greet every fleet returning from the discoveries. Royal masons are pulled from other works to begin the design at once.
      desc_zh: 王室敕命于贝伦河口沙洲筑一座防御塔楼，扼守通往里斯本之要道，并迎候每支自远航归来的舰队。王室石匠随即被调离他处工程，即刻着手设计。
      cost:
      - type: scaled_gold
        value: -5
    - title_en: Manueline Masons Take the Shoal
      title_zh: 曼努埃尔式匠人登沙洲
      desc_en: Stonemasons well versed in the new Manueline style survey the tidal shoal, planning carved battlements twined with ropes, armillary spheres, and coral motifs drawn from the voyages themselves. Barges begin ferrying limestone from Lisbon's quarries.
      desc_zh: 熟谙新兴曼努埃尔风格的石匠勘察潮汐沙洲，规划以绳索、浑天仪与珊瑚纹样为饰的雉堞，皆取材自航海本身的意象。驳船亦开始自里斯本采石场运来石灰岩。
      cost:
      - type: scaled_gold
        value: -7
    - title_en: Foundations Sunk Against the Tide
      title_zh: 抗潮打桩固基
      desc_en: Piles are driven deep into the riverbed to anchor the tower against the Tagus tide, and caravel captains are asked to delay their departures until the crown's tower can watch them leave. Royal treasurers begin releasing funds in careful installments.
      desc_zh: 工匠将木桩深深打入河床，以固塔基抵御太加斯河潮汐；卡拉维尔帆船船长们亦被请求暂缓启航，待王室塔楼建成后再目送其远行。王室司库亦开始分批拨付款项。
      cost:
      - type: gold
        value: -50
    - title_en: The Tower's First Stones Meet the River
      title_zh: 塔基石始接河水
      desc_en: The first courses of pale Manueline stone rise directly from the river shoal, and what had been surveys and treasury ledgers now becomes a tower physically standing in the Tagus. Fishermen row out daily just to watch the stone climb.
      desc_zh: 淡色曼努埃尔石料的第一层砌石自河中沙洲直接筑起，昔日的勘测图纸与账簿此刻终化作矗立于太加斯河中的实体塔身。渔夫每日划船而出，只为观看石塔渐次增高。
      cost:
      - type: scaled_gold
        value: -9
    - title_en: The Bastion Terrace Takes Form
      title_zh: 棱堡露台成形
      desc_en: A low bastion terrace is completed around the tower's base, its embrasures cut to command the river channel with cannon fire from every angle. Carved rope-molding begins winding up the tower's corners for the first time.
      desc_zh: 塔基周围的低矮棱堡露台竣工，其炮眼皆经开凿，可自各角度以炮火扼守河道。绳索状浮雕纹饰亦首度开始沿塔角盘旋而上。
      cost:
      - type: gold
        value: -80
    - title_en: The Loggia and Its Carved Watch
      title_zh: 凉廊与石雕守望
      desc_en: An open loggia is raised above the bastion, its arcade carved with armillary spheres and the twisted rope motif that will mark the tower as uniquely Portuguese. Stonemasons carve a rhinoceros gargoyle beneath the corner turret, a curiosity brought back by the voyages themselves.
      desc_zh: 棱堡之上筑起开敞凉廊，拱廊之上雕满浑天仪与绞绳纹饰，使此塔从此独具葡萄牙风韵。石匠更于转角塔楼下雕出一尊犀牛石像，正是航海归来所带回的珍奇之物。
      cost:
      - type: artwork
        value: 1
    - title_en: The Turrets Reach Their Full Height
      title_zh: 角楼升至满高
      desc_en: The tower's corner turrets are capped with their small domes, and the main keep rises to its full height overlooking the river mouth. Departing caravels now sail close beneath its unfinished battlements to test the salute they will one day give.
      desc_zh: 塔楼四角小塔顶覆圆顶，主塔亦已升至满高，俯瞰河口。启航的卡拉维尔船此时已贴近尚未竣工的雉堞航行，权作日后致敬礼炮的预演。
      cost:
      - type: navy_tradition
        value: -2
    - title_en: The Tower Greets the Ocean Fleets
      title_zh: 塔楼迎迓远洋舰队
      desc_en: Bells and cannon salute together as the finished tower is consecrated at the river's edge, and the crown declares it the eternal gatekeeper of every fleet bound for or returning from the discoveries. From this day its watch over the Tagus lengthens the reach of every ship that sails beneath it, and swells the wealth flowing home through Lisbon's harbor.
      desc_zh: 钟声与礼炮齐鸣，竣工塔楼于河畔举行祝圣礼，王室宣告此塔将永为一切远航舰队往返之门户守望者。自此其对太加斯河的守护，延伸了每艘自塔下驶过之船的航程，亦令流入里斯本港的财富与日俱增。
      cost:
      - type: sailors
        value: -130
