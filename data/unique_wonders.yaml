      title_zh: 卡哈尔号召扩建会堂区
      desc_en: The Kahal, the community's governing council, resolves to expand Brest's synagogue quarter into a seat worthy of its scholars and its merchants alike. Elders and rabbis send word to guilds and study houses that the community's long-cramped lanes will finally widen.
      desc_zh: 卡哈尔——布列斯特犹太社区的自治议会——决议扩建会堂区，使其配得上这里的学者与商贾。长老与拉比们向各行会与经学院传话：这片长期拥挤的巷弄，终将得以拓展。
      cost:
      - type: harmony
        value: -10
    - title_en: Petitioning the Voivode for Land
      title_zh: 向省督请愿求地
      desc_en: Community elders petition the local voivode and pay the customary fees for the right to expand beyond the old quarter's boundary stones, a delicate negotiation repeated at every gate of privilege in the Commonwealth. Surveyors mark new lanes between the market and the riverbank.
      desc_zh: 社区长老向当地省督请愿，依惯例缴纳费用，以求获准越过旧区界石向外拓展——这是在联邦境内每一道特权之门前都要重复的微妙谈判。测量员在市场与河岸之间标出新的巷道。
      cost:
      - type: gold
        value: -40
    - title_en: Timber and Torah Scrolls Arrive
      title_zh: 木材与经卷同抵
      desc_en: Wagons bring seasoned timber and Baltic brick for the new study houses, while a procession of rabbis carries fresh Torah scrolls through the streets to bless the ground before the first spade turns it. Craftsmen from Kraków and Lublin arrive to bid for the woodwork contracts.
      desc_zh: 满载风干木料与波罗的海砖块的马车抵达新建经学院的工地，一列拉比抬着新誊写的《托拉》经卷穿街而过，在破土动工之前为这片土地祝圣。来自克拉科夫与卢布林的工匠也纷纷赶来竞标木工合同。
      cost:
      - type: artwork
        value: 1
    - title_en: Foundations of the New Study Houses
      title_zh: 新学舍奠基
      desc_en: The first timber frames rise along the market lanes, the quarter's true construction underway as carpenters and masons work side by side under the Kahal's watchful stewards. What was petition and procession now becomes hammer and beam.
      desc_zh: 沿着市场巷道，第一批木构框架拔地而起，卡哈尔管事们的监督下，木匠与石匠并肩劳作——这才是社区真正的营造工程。此前的请愿与游行，如今化作了锤声与梁木。
      cost:
      - type: manpower
        value: -50
    - title_en: Carving the Great Synagogue's Ark
      title_zh: 雕刻大会堂圣柜
      desc_en: Master woodcarvers shape the elaborately carved Torah ark and bimah platform at the quarter's Great Synagogue, working by candlelight long after the market stalls close for the night. Painters begin the first sketches for murals of zodiac signs and Hebrew verse along the vaulted ceiling.
      desc_zh: 大工匠们精雕细琢，为会堂区的大会堂制作装饰繁复的《托拉》圣柜与讲经台，常常在市集收摊后仍借烛光劳作至深夜。画师们也开始为拱顶壁画勾勒初稿，题材涉及黄道十二宫与希伯来经文。
      cost:
      - type: artwork
        value: 1
    - title_en: The Study Houses Fill With Voices
      title_zh: 学舍中回响不绝
      desc_en: Yeshiva students and merchant apprentices alike crowd the finished study houses and covered market lanes, the sound of Talmudic debate mixing with the calls of grain and cloth sellers below. The quarter begins to look less like a construction site and more like a living town within the town.
      desc_zh: 经学院学生与商行学徒一同挤满了已建成的学舍与带顶市场巷道，塔木德辩论的声音与楼下谷物、布匹商贩的叫卖声交织在一起。这片街区渐渐不再像工地，倒像一座镇中之镇，生机勃勃。
      cost:
      - type: cultural_influence
        value: -8
    - title_en: Raising the Kahal's Assembly Hall
      title_zh: 兴建卡哈尔议事大厅
      desc_en: A grand assembly hall rises at the quarter's heart, its long council table meant to seat elders debating taxes, disputes, and charity for the whole community. Merchants from as far as Danzig and Lwów send gifts of glass and silver to mark the hall's near completion.
      desc_zh: 一座宏伟的议事大厅在社区中心拔地而起，那张长长的议事桌，是供长老们商议税赋、纠纷与济贫事务之用。远至但泽与利沃夫的商人们纷纷送来玻璃器皿与银器，以贺大厅即将竣工。
      cost:
      - type: artwork
        value: 1
    - title_en: The Quarter Is Consecrated in Song
      title_zh: 歌声中落成的会堂区
      desc_en: Rabbis and elders together consecrate the finished quarter with prayer and song, the Great Synagogue's ark unveiled at last before a crowded congregation. From this day the community's scholarship and trade flow together more freely, its study houses and market lanes now the pride of the whole realm.
      desc_zh: 拉比与长老们共同以祈祷与歌声为竣工的社区举行落成典礼，大会堂的《托拉》圣柜终于在满座会众面前揭幕。自此日起，这个社区的学问与贸易愈发交融通畅，其学舍与市集巷道也成为全国引以为傲的典范。
      cost:
      - type: cultural_influence
        value: -18
