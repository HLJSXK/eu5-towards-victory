    stages:
    - title_en: The Shah Names a New Capital
      title_zh: 沙王钦定新都
      desc_en: Shah Abbas turns his court toward Isfahan and calls for a square vast enough to hold the whole of Persia's ambition. Surveyors ride out along the Zayandeh River banks, and criers read the decree in the bazaars of every province.
      desc_zh: 阿巴斯沙王将王廷迁往伊斯法罕，下令建一座能容纳全波斯雄心的广场。测量员沿扎因代河两岸勘察，各省市集中传令官高声宣读诏书。
      cost:
      - type: prestige
        value: -15
    - title_en: Waters Turned Toward the Square
      title_zh: 引水汇向广场
      desc_en: Engineers cut new channels from the Zayandeh River to feed the gardens and fountains still unbuilt, while officials buy up the merchant quarters that must give way to the plaza. Caravans of stonecutters and tile-masters begin arriving from Shiraz and Kashan.
      desc_zh: 工程师从扎因代河引出新渠，为尚未建成的花园与喷泉备水，官员则陆续收购须让位于广场的商铺街区。来自设拉子与卡尚的石匠与瓷砖工匠车队陆续抵达。
      cost:
      - type: scaled_gold
        value: -6
    - title_en: The Chaharbagh Is Blessed
      title_zh: 查哈巴格获得祝福
      desc_en: Clerics walk the length of the planned avenue, blessing the ground where the Chaharbagh will run from palace to river. Master builder Ustad Ali Akbar Isfahani presents his plan for the square's four faces to the assembled court.
      desc_zh: 教士沿规划中的查哈巴格大道逐段祈福，为这条将从王宫通往河畔的道路开光。总建筑师乌斯塔德·阿里·阿克巴尔·伊斯法罕尼向朝臣呈上广场四面布局的图样。
      cost:
      - type: honor
        value: -12
    - title_en: The First Foundations Are Cut
      title_zh: 初掘地基
      desc_en: Laborers break ground at last, sinking foundations for the Shah Mosque's forecourt and the Ali Qapu's raised platform. What was parchment and prayer now becomes trench and stone.
      desc_zh: 劳工终于破土动工，为王家清真寺的前庭与阿里卡普宫的高台打下地基。图纸与祈愿，至此化作沟槽与石块。
      cost:
      - type: scaled_gold
        value: -8
    - title_en: Ali Qapu Climbs Above the Plaza
      title_zh: 阿里卡普宫拔地而起
      desc_en: The Ali Qapu's timber balconies and slender columns rise tier by tier, its upper music room taking shape where the Shah will one day watch polo below. Painters begin the first murals in its reception hall.
      desc_zh: 阿里卡普宫的木质回廊与纤细廊柱一层层升起，日后沙王俯瞰马球赛事的乐室已见雏形。画师开始在接见厅绘制最初的壁画。
      cost:
      - type: cultural_influence
        value: -8
    - title_en: The Mosque's Dome Takes Its Colors
      title_zh: 清真寺穹顶染上色彩
      desc_en: Tile-masters cover the Shah Mosque's dome and portal in cascades of blue and gold haft-rangi tilework, the kiln fires burning through the night to keep pace with the scaffolding above. Calligraphers begin inscribing verses along the great iwan.
      desc_zh: 瓷砖匠师以蓝金交织的七彩釉砖覆满王家清真寺的穹顶与大门，窑火彻夜不熄，只为赶上头顶脚手架的进度。书法家开始在大穹门两侧镌刻经文。
      cost:
      - type: cultural_influence
        value: -12
    - title_en: The Bazaar Wraps the Square
      title_zh: 巴扎环抱广场
      desc_en: Two stories of vaulted arcades close around the plaza's edge, shopkeepers already haggling in stalls whose upper floors still smell of wet plaster. Stone goalposts are set at the northern and southern ends for the polo the court still plays across the open ground.
      desc_zh: 两层拱廊沿广场四周合拢，楼上灰泥尚未干透，楼下店主已在讨价还价。广场南北两端立起石制球门柱，朝臣仍在空地上驰骋马球。
      cost:
      - type: honor
        value: -15
    - title_en: Half the World Opens Its Gates
      title_zh: 半个世界敞开城门
      desc_en: On the appointed day the Shah rides the length of the finished square amid drums and polo mallets raised in salute, and criers declare Isfahan nesf-e jahan, half of the world. The square's fountains, bazaars, and mosque now stand as the Safavid capital's enduring heart.
      desc_zh: 吉日当天，沙王策马穿行整座落成的广场，鼓声与高举的马球杖列队相迎，传令官宣告伊斯法罕为半个世界。广场上的喷泉、市集与清真寺，自此成为萨法维王朝首都永恒的心脏。
      cost:
      - type: prestige
        value: -40
      - type: honor
        value: -20
