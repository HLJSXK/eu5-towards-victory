      title_zh: 统治者敕令兴建学术广场
      desc_en: The ruler of Samarkand decrees that the sandy square before the old caravan crossroads shall become a Registan worthy of the city's fame, ringed with madrasas to outshine any court from Herat to Delhi. Astronomers, tile masters, and viziers are summoned to plan its splendor.
      desc_zh: 撒马尔罕的统治者颁布敕令，宣布将古老商队十字路口前的这片沙地，营建为一座配得上本城盛名的雷吉斯坦广场，四周环绕经学院，光华要胜过从赫拉特到德里的任何宫廷。天文学家、镶砖大师与维齐尔们纷纷奉召，共同筹划这一宏伟工程。
      cost:
      - type: prestige
        value: -15
    - title_en: Surveying the Crossroads Square
      title_zh: 勘测十字路口广场
      desc_en: Court engineers pace out the open ground where caravan routes from China, India, and Persia have long converged, marking the footprint of the first great madrasa against the setting sun. Kilns are built nearby to fire the blue and turquoise glazed tiles the city is already famed for.
      desc_zh: 宫廷工程师们踏勘这片长期汇聚来自中国、印度与波斯商路的开阔场地，在夕阳下标出第一座宏伟经学院的地基轮廓。附近搭建起窑炉，用以烧制这座城市早已闻名的蓝色与绿松石色琉璃砖。
      cost:
      - type: gold
        value: -50
    - title_en: Scholars Bless the First Portal
      title_zh: 学者为首座门楼祝圣
      desc_en: Learned imams and astronomers bless the foundation of the towering entrance portal, reciting verses as laborers begin digging deep to anchor it against the region's earthquakes. Caravans passing through are pressed for a toll of tile, timber, or coin toward the new square.
      desc_zh: 学识渊博的伊玛目与天文学家为高耸的正门地基举行祝圣仪式，吟诵经文的同时，劳工们已开始深挖地基，以抵御本地区常见的地震。途经此地的商队则被课以砖瓦、木材或钱币，用作新广场的建设之资。
      cost:
      - type: devotion
        value: -10
    - title_en: The Madrasa's Portal Climbs Skyward
      title_zh: 经学院门楼直冲云霄
      desc_en: Brick by brick, the soaring iwan portal of the first madrasa rises above the square, the real work of the wonder finally underway after the surveying and the blessing. Scaffolds of poplar wood cling to the minaret towers flanking the gate as they inch upward.
      desc_zh: 砖石层叠而砌，第一座经学院高耸的伊万式门楼在广场上拔地而起——历经勘测与祝圣之后，这座奇观真正的营造工程终于展开。白杨木脚手架紧贴门楼两侧逐渐攀升的宣礼塔，一寸寸向上延伸。
      cost:
      - type: manpower
        value: -70
    - title_en: Tile Masters Cover the Portal in Blue
      title_zh: 镶砖大师为门楼铺满蓝色
      desc_en: Master tile-setters cover the great portal in glazed mosaics of turquoise, cobalt, and gold, spelling verses of the Quran across the towering facade in flowing calligraphy. Apprentices grind lapis and cobalt pigments by the barrel to keep pace with the scaffolding above.
      desc_zh: 镶砖大师们用绿松石色、钴蓝色与金色的琉璃马赛克覆盖巨大的门楼，以流畅的书法体在高耸立面上书写古兰经文。学徒们成桶研磨青金石与钴颜料，以跟上脚手架上不断推进的工程进度。
      cost:
      - type: artwork
        value: 1
    - title_en: Student Cells Ring the Courtyard
      title_zh: 学舍环绕内庭而建
      desc_en: Rows of vaulted hujra cells rise two stories around the madrasa's inner courtyard, each meant to house a student and his books through years of study in astronomy, theology, and law. The first scholars arrive even as plaster dust still hangs in the unfinished halls.
      desc_zh: 两层高的拱顶胡吉拉学舍沿经学院内庭院成排而建，每间供一名学生及其藏书在天文学、神学与法学的多年求学中栖身。首批学者已然抵达，尽管未竣工的厅堂里仍弥漫着灰泥的尘埃。
      cost:
      - type: research_progress
        value: -15
    - title_en: A Second Madrasa Faces the First
      title_zh: 第二座经学院遥相呼应
      desc_en: Rulers of a later generation raise a second grand madrasa across the square, its portal deliberately mirroring the first so the two face one another in matched splendor. Tile masters add lions and suns to its facade, a bold departure from the older calligraphy alone.
      desc_zh: 后一代统治者在广场对面建起第二座宏伟的经学院，其门楼刻意与第一座遥相呼应，两两相对、争相辉映。镶砖大师们在立面上增添了狮子与太阳的图案，大胆突破了此前单纯以书法装饰的传统。
      cost:
      - type: artwork
        value: 1
    - title_en: The Registan Gathers the World
      title_zh: 雷吉斯坦广场汇聚天下
      desc_en: Rulers, scholars, and merchants gather in the finished square as imams recite the opening verses beneath domes now sheeted in gold, declaring the Registan complete and open to all who seek learning or trade. From this day the square's fame and splendor lend fresh weight to the ruler's word in every court from Bukhara to Delhi.
      desc_zh: 统治者、学者与商贾齐聚这座落成的广场，伊玛目在如今已覆以金箔的穹顶下诵读开篇经文，宣告雷吉斯坦广场竣工，向一切求知求利之人敞开。自此日起，这座广场的盛名与辉煌，让统治者的言辞在从布哈拉到德里的每一个宫廷都更添分量。
      cost:
      - type: artwork
        value: 1
      - type: prestige
        value: -35
