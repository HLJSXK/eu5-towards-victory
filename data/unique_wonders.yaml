        value: -8
    - title_en: Kilns Are Set for Colored Glaze
      title_zh: 试烧琉璃五色
      desc_en: Potters from the imperial kilns are summoned to perfect the glazes of white, yellow, green, and brown that will sheath every brick. Test tiles are fired and broken apart until the colors satisfy the court.
      desc_zh: 御窑陶工奉召调制白、黄、绿、褐诸色琉璃釉料，用以包覆每一块塔砖。试烧的样砖一再敲开检验，直至色泽令朝廷满意。
      cost:
      - type: artwork
        value: 1
    - title_en: The First Tier Rises
      title_zh: 首层拔地而起
      desc_en: Scaffolding climbs above the temple grounds as the octagonal base is laid stone by stone. What was once only glazed samples and chanted blessings now stands as a real first story of the pagoda.
      desc_zh: 脚手架在寺院之上渐次搭高，八角形塔基一石一石地垒砌而成。曾经只是釉样与祝祷，如今已化作宝塔真正的第一层。
      cost:
      - type: scaled_gold
        value: -6
    - title_en: Nine Tiers Climb Toward Heaven
      title_zh: 九层层层向天
      desc_en: Tier after tier is fitted with its glazed bricks, each one catching the light a shade differently from the last. Workers on the highest scaffolds say the city below shrinks with every level completed.
      desc_zh: 一层又一层的琉璃塔身相继装成，每层映光之色都略有不同。攀在最高脚手架上的工匠说，每完成一层，脚下的城池便似又矮了几分。
      cost:
      - type: artwork
        value: 1
    - title_en: Lanterns and Bells Are Hung
      title_zh: 悬铃挂灯
      desc_en: Bronze bells are fixed beneath the eaves of every tier to ring in the river wind, and lanterns are strung to be lit each evening. Buddhist reliefs of guardians and lotus flowers are set into the glazed panels.
      desc_zh: 每层塔檐下皆悬铜铃，江风吹拂便叮当作响；夜间点燃的灯笼也一一系挂妥当。护法与莲花的佛教浮雕则嵌入琉璃塔壁之中。
      cost:
      - type: cultural_influence
        value: -8
    - title_en: The Kilns Burn Through the Night
      title_zh: 窑火彻夜不熄
      desc_en: A shortage of matched glaze forces the kilns to fire long after dark, and exhausted potters sleep in shifts beside the furnaces. Monks bring food to the yards so the work need never stop.
      desc_zh: 因釉色配比一时短缺，窑炉被迫连夜烧制，疲惫的陶工只得轮班歇息在炉火旁。僧人将饭食送至窑场，使工程不致中断。
      cost:
      - type: artwork
        value: 1
    - title_en: The Porcelain Tower Is Consecrated
      title_zh: 报恩琉璃塔告成
      desc_en: Monks circle the finished pagoda in procession as its hundred and forty lanterns are lit for the first time, turning the Qinhuai riverside to gold at dusk. From this night on, the temple's fame draws pilgrims and quietly reshapes the loyalties of the realm.
      desc_zh: 僧众绕行竣工的宝塔巡礼，一百四十盏灯笼首次齐燃，将秦淮河畔映成一片金色暮色。自此夜起，寺名远播，香客云集，也在无声间重塑着国中人心的向背。
      cost:
      - type: devotion
        value: -30
      - type: cultural_influence
        value: -15
