      desc_en: The Yongle Emperor decrees that the capital shall move north to Beijing, and a vast palace axis of red walls and golden roofs is ordered raised at the city's heart.
      desc_zh: 永乐帝下诏迁都北移至北京，并命于城中心筑起一条红墙金瓦的巨大宫殿中轴线。
      cost:
      - type: government_power
        value: -15
    - title_en: Geomancers Align the Palace to the Pole Star
      title_zh: 堪舆定轴，北极为准
      desc_en: Court geomancers align the palace's central axis due north-south beneath the pole star, and officials perform ancestral rites to ask the old dynasties' leave to build anew.
      desc_zh: 宫廷堪舆师依北极星方位，将宫城中轴精确定为正南正北，大臣们随即行祭祖之礼，恭请前朝先灵允准兴建新都。
      cost:
      - type: devotion
        value: -10
    - title_en: Timber Rafts Descend From Sichuan
      title_zh: 川滇巨木顺江而下
      desc_en: Enormous logs cut in the forests of Sichuan and Yunnan are floated down river on rafts for years, while golden bricks are fired in Suzhou's kilns and stone is quarried at Fangshan.
      desc_zh: 四川、云南林中采伐的巨木被扎成木筏，历时数年顺江漂运而下，苏州窑厂同时烧制金砖，房山则开凿所需石料。
      cost:
      - type: scaled_gold
        value: -8
    - title_en: The Meridian Gate Foundations Are Laid
      title_zh: 午门基址奠定
      desc_en: Laborers lay the vast platform and foundations of the Meridian Gate, and for the first time the shape of the coming palace complex can be traced across the cleared ground.
      desc_zh: 民夫铺筑午门的巨大台基与地基，清理一新的地面上，宫城建筑群的轮廓自此第一次可以辨认。
      cost:
      - type: gold
        value: -55
    - title_en: The Hall of Supreme Harmony Takes Frame
      title_zh: 太和殿木构初立
      desc_en: Carpenters raise the timber frame of the Hall of Supreme Harmony on its triple marble terrace, the palace's central hall climbing above every courtyard around it.
      desc_zh: 木匠在三层汉白玉台基上竖起太和殿的木构架，这座宫城的核心大殿自此凌驾于周围每一进院落之上。
      cost:
      - type: manpower
        value: -60
    - title_en: Golden Tiles and Dragon Ramps Are Set
      title_zh: 金瓦覆顶，御路雕龙
      desc_en: Glazed golden roof tiles are laid across the halls, and stonemasons carve the great dragon ramp meant only for the emperor's palanquin to pass over.
      desc_zh: 殿宇之上铺满琉璃金瓦，石匠同时雕琢那条唯供御辇通行的巨大云龙丹陛。
      cost:
      - type: artwork
        value: 1
    - title_en: The Court Relocates Amid Fire and Resolve
      title_zh: 迁都途中，火中不悔
      desc_en: Officials and their households make the long move north as the new capital opens, and when lightning sets part of the unfinished halls ablaze, the court rebuilds without ever considering turning back.
      desc_zh: 百官携眷北迁，新都渐次开府之际，一场雷火焚毁部分未竣工的殿宇，朝廷仍毫不动摇，即刻着手重建。
      cost:
      - type: legitimacy
        value: -20
    - title_en: The Emperor Ascends the Hall of Supreme Harmony
      title_zh: 太和殿上，帝业永昭
      desc_en: The Yongle Emperor formally ascends the throne within the finished Hall of Supreme Harmony, and the palace's authority is declared to radiate outward through every province of the realm.
      desc_zh: 永乐帝于竣工的太和殿正式登临御座，宫城的威权自此被宣告将泽被全国每一行省。
      cost:
      - type: government_power
        value: -25
      - type: legitimacy
        value: -30
