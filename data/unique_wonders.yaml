      title_zh: 宝库穹室封藏珍宝
      desc_en: The treasury's vaulted chambers are fitted with iron-bound doors and filled with the spoils and tributes gathered since the conquest, while diplomats are first received in the second courtyard.
      desc_zh: 宝库的拱顶密室装上铁箍大门，收纳自征服以来所得的战利与贡品，各国使节也首次在第二进庭院获得接见。
      cost:
