      desc_en: A royal charter is affixed with the great seal, granting a company of merchant adventurers the exclusive right to trade east of the Cape of Good Hope. Subscribers crowd the hall to pledge their capital before the ink has even dried.
      desc_zh: 皇家特许状加盖国玺，授予一班商人冒险家越过好望角以东的独家贸易之权。认股者挤满大厅，墨迹未干便争相认购股份。
      cost:
      - type: scaled_gold
        value: -4
    - title_en: The Court of Committees Convenes
      title_zh: 董事委员会初次议事
      desc_en: A court of committees is elected from among the leading subscribers to manage the venture's affairs, its first order of business the fitting-out of ships and the drafting of instructions for factors overseas. Clerks are hired by the dozen to keep the ledgers straight.
      desc_zh: 从主要认股人中推选出董事委员会，负责统筹此番大计，首要之务便是备办船只、拟定海外代理商的行事章程。文书一雇便是数十人，专司账册核对无误。
      cost:
      - type: gold
        value: -45
    - title_en: Envoys Sail for Distant Coasts
      title_zh: 使者远航异域海岸
      desc_en: The first factors and envoys depart with letters of introduction for local rulers, seeking permission to trade at Surat and along the Malabar coast. Their instructions warn against giving offense, for the company's fortunes rest on native goodwill as much as on gold.
      desc_zh: 首批商务代理与使者携带国书启程，赴苏拉特及马拉巴尔沿岸求见当地统治者，恳请通商之许。行前叮嘱再三，务必谨言慎行，因公司命运既系于黄金，更系于当地君王的善意。
      cost:
      - type: diplomats
        value: -1
    - title_en: The Fortified Compound Rises at Bombay
      title_zh: 孟买堡垒破土动工
      desc_en: Masons and carpenters break ground on a fortified compound at Bombay, its walls meant to guard both the counting house and the harbor beyond, work truly begun in earnest. Company soldiers stand watch as the first stone courses are laid.
      desc_zh: 石匠与木匠在孟买破土动工，兴建一座既护账房又扼守港口的堡垒式据点，真正的营造工程就此展开。公司士兵持械守望，看着最初几层石墙一寸寸砌起。
      cost:
      - type: scaled_gold
        value: -6
    - title_en: Warehouses Line the Thames and the Harbor
      title_zh: 仓廪沿泰晤士河与港湾铺开
      desc_en: Fortified warehouses rise along both the Thames in London and the Bombay waterfront, their thick walls built to hold spice bales, bolts of cloth, and chests of silver alike. Cranes and pulleys are installed to speed the unloading of every arriving convoy.
      desc_zh: 坚固的仓库沿伦敦泰晤士河畔与孟买滨海一线相继建成，厚墙之内既储香料捆包，也藏织物与银箱。吊臂与滑轮相继安装，加快每支归航船队的卸货速度。
      cost:
      - type: gold
        value: -80
    - title_en: Armed Convoys Take to the Sea
      title_zh: 武装船队扬帆护航
      desc_en: Company ships are fitted with guns and sailed in escorted convoys to fend off pirates and rival traders along the sea lanes. Company banners snap from every mast, a mark of protection as much as of ownership.
      desc_zh: 公司船只加装炮位，编成护航船队以抵御海盗与商业对手的侵扰。公司旗帜在每根桅杆上猎猎作响，既示所有权，亦是庇护之证。
      cost:
      - type: navy_tradition
        value: -2
    - title_en: The Ledger Houses Take Shape
      title_zh: 账房制度渐成体系
      desc_en: Permanent ledger houses and archives are established both in London and overseas, native agents recruited to smooth dealings with local merchants and officials. Every bale of spice and every rupee of profit is now recorded in triplicate.
      desc_zh: 伦敦与海外均设立起长久的账房与档案，并延揽当地代理人从中斡旋，方便与本地商贾及官吏往来。此后每捆香料、每一卢比的盈亏，皆需三重记录，分毫不差。
      cost:
      - type: gold
        value: -100
    - title_en: The Headquarters Is Inaugurated
      title_zh: 总部正式落成揭幕
      desc_en: The company's headquarters is formally inaugurated with a reading of the royal charter before assembled directors, factors, and envoys. From this counting house the crown's overseas commerce now flows with a steadiness it never before enjoyed.
      desc_zh: 公司总部正式揭幕，皇家特许状于董事、代理与各方使节面前当众宣读。此后王国的海外贸易便从这座账房源源流出，其稳健之势前所未有。
      cost:
