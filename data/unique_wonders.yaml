      title_zh: 库藏珍宝逐一登记
      desc_en: Imperial goldsmiths and jewelers are summoned to the treasury, where rubies, emeralds, and pearls are laid out and catalogued for the throne's design. Court astrologers are consulted to choose an auspicious hour for the work to begin.
      desc_zh: 宫廷金匠与珠宝师被召入内库，红宝石、祖母绿与珍珠一一陈列造册，以备镶嵌宝座之用。宫廷星象师随即被请来推算动工的吉时良辰。
      cost:
