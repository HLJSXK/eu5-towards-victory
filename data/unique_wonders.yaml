        value: -15
    - title_en: The Coastal Site Is Consecrated
      title_zh: 沿海圣地举行奉献
      desc_en: Priests consecrate a stretch of coastal ground near Puri where the morning sun strikes first, and royal architects begin sketching the chariot's proportions in the sand. Twelve thousand artisans, legend says, are summoned to the site.
      desc_zh: 祭司为普里附近一块朝阳最先照及的沿海之地举行奉献仪式，王室建筑师随即在沙地上勾画出神辇的比例草图。相传有多达一万两千名工匠应召赶赴此地。
      cost:
      - type: religious_influence
        value: -10
    - title_en: Iron and Stone Are Gathered
      title_zh: 铁石备料齐聚
      desc_en: Wagons of stone and iron beams arrive from inland quarries and forges, the iron destined to bind the tower's core against the coast's fierce winds. Master sculptors arrive to plan the chariot wheels' intricate carvings.
      desc_zh: 满载石料与铁梁的车队自内陆采石场与锻坊源源而来，这些铁料日后将用以加固塔身核心，抵御海岸强风。雕塑大师陆续到场，筹划神辇车轮上繁复精美的雕饰。
      cost:
      - type: scaled_gold
        value: -5
    - title_en: The Chariot's Platform Is Laid
      title_zh: 神辇台基铺设动工
      desc_en: The great platform representing the chariot's base is laid into the coastal earth, the true construction of the temple finally underway after seasons of gathering. Waves crash nearby as the first massive stones settle into place.
      desc_zh: 象征神辇底座的巨大台基铺设入沿海的土地，经数季的筹备，神庙真正的营造终于展开。海浪在不远处拍打，第一批巨石稳稳落定其中。
      cost:
      - type: gold
        value: -55
    - title_en: The Twenty-Four Wheels Are Carved
      title_zh: 二十四石轮逐一雕成
      desc_en: Sculptors carve the temple's twenty-four wheels one at a time, each rim adorned with spokes and figures so fine that they are said to tell the hours of the day. Crowds gather at the site simply to watch each wheel emerge from raw stone.
      desc_zh: 雕匠一只接一只精雕这二十四只石轮，每只轮辐与图案之精细，据说竟能借以计辰报时。人群纷纷聚集工地，只为亲眼目睹每一只石轮自粗石中渐渐显形。
      cost:
      - type: artwork
        value: 1
    - title_en: The Seven Horses Take Their Stride
      title_zh: 七骏昂首奔姿初现
      desc_en: The seven horses meant to draw Surya's chariot are carved along the temple's eastern face, frozen mid-stride as if racing toward the dawn. Friezes of dancers and celestial figures fill every remaining plinth.
      desc_zh: 象征牵引苏利耶神辇的七匹骏马，在庙宇东面被雕成腾跃奔驰之姿，宛如正朝着朝阳疾驰而去。舞者与天界诸神的浮雕则填满了余下的每一处基座。
      cost:
      - type: artwork
        value: 1
    - title_en: The Deul Tower Nears Its Crown
      title_zh: 主塔近乎加冕封顶
      desc_en: The temple's soaring deul tower nears completion, its upper courses drawing gasps from travelers who can already see it rising above the coastal palms from far out at sea. Dancers begin final rehearsals for the consecration.
      desc_zh: 神庙高耸的主塔已近完工，其上部石层令远航海上便能望见其超越沿岸棕榈的旅人啧啧称奇。舞者也开始为奉献大典进行最后的排演。
      cost:
      - type: prestige
        value: -22
    - title_en: Surya's Chariot Is Consecrated
      title_zh: 苏利耶神辇正式奉献
      desc_en: Priests consecrate the completed chariot temple as the first light of dawn strikes its carved wheels, dancers performing before the assembled court and pilgrims from across the region. The Sun God's blessing, now fixed in stone upon the coast, shines steadily over the whole kingdom.
      desc_zh: 晨曦初现，第一缕阳光洒在雕饰精美的石轮之上，祭司为落成的神辇庙宇举行奉献大典，舞者在朝臣与远道而来的香客面前翩然起舞。太阳神的庇佑如今已凝固于这沿海的石造神辇之中，其光辉从此长久照耀整个王国。
      cost:
      - type: devotion
        value: -30
      - type: prestige
        value: -35
