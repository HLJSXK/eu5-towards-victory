    stages:
    - title_en: The Inca Orders the Slopes Tamed
      title_zh: 印卡下令驯服山坡
      desc_en: The Sapa Inca commands that the steep flanks below the royal citadel be shaped into terraces fit to feed a court and its priests, and calls for the finest agricultural engineers of the empire to survey the mountain's face. Offerings are made to Pachamama before a single stone is moved.
      desc_zh: 萨帕印卡下令，将王家城邑下方的陡峭山坡改造为足以供养朝廷与祭司的梯田，并召集帝国最优秀的农业工程师勘察山体地势。在挪动第一块石头之前，先向帕查玛玛献上祭品。
      cost:
      - type: devotion
        value: -10
    - title_en: Stone Is Quarried from the Mountain Itself
      title_zh: 石料取自山体本身
      desc_en: Quarrymen cut fitted stone from outcrops near the citadel, shaping the retaining blocks that will hold back tons of earth on slopes too steep for ordinary farming. Llama trains begin hauling soil and gravel up from the valley floor below.
      desc_zh: 采石工从城邑附近的岩层中开凿出精准契合的石块，用以塑造能在陡峭得无法寻常耕种的坡地上挡住数吨泥土的挡土石。驮运骆马队开始将谷底的泥土与砾石运往山上。
      cost:
      - type: scaled_gold
        value: -4
    - title_en: The Engineers Lay Out the Drainage
      title_zh: 工程师规划排水层
      desc_en: Engineers trace the hidden layers of gravel, sand, and topsoil that will let each terrace drain without washing away in the mountain rains, and priests mark the highest terrace as sacred ground for the first planting rite. The citadel above watches over the work still confined to stakes and string.
      desc_zh: 工程师规划每层梯田隐藏其下的砾石、沙层与表土结构，使其在山雨中能够排水而不致流失，祭司则将最高一层梯田定为首次播种仪式的圣地。城邑俯瞰着这仍仅以木桩与绳线标记的工程。
      cost:
      - type: harmony
        value: -8
    - title_en: The First Retaining Walls Are Set
      title_zh: 首段挡土墙立起
      desc_en: Laborers finally lift the first fitted stones into place along the lowest slope, packing gravel and soil behind each course as the mountainside begins to step upward in true terraces. What was staked line now becomes stone holding back earth.
      desc_zh: 劳工终于将最初契合的石块安放在最低一段坡地上，每砌一层便在其后填入砾石与泥土，山坡开始真正地阶梯状抬升。曾经只是木桩标线，如今化作挡住泥土的石墙。
      cost:
      - type: manpower
        value: -20
    - title_en: The Terraces Climb Toward the Citadel
      title_zh: 梯田攀向城邑
      desc_en: Course after course of terrace wall rises up the slope toward the royal buildings above, workers passing stone and soil hand to hand along paths too narrow for llama trains. Drainage channels are tested with buckets of water poured from the topmost tier.
      desc_zh: 一层又一层梯田墙沿坡地向上方的王家建筑攀升，工人们沿骆马队无法通行的狭窄小径手手相传石料与泥土。排水渠道以从最高一层浇下的整桶水进行测试。
      cost:
      - type: manpower
        value: -30
    - title_en: Canals Carry Water Down the Slope
      title_zh: 渠水顺坡而下
      desc_en: Stone-lined channels are cut alongside the finished terraces to carry spring water down from higher on the mountain, feeding each level in turn without a single terrace flooding the one below. Farmers begin preparing seed maize and potatoes for the terraces nearing completion.
      desc_zh: 已完工的梯田旁开凿出石砌水渠，将山上更高处的泉水引流而下，逐层灌溉而不致任何一层梯田淹没下方。农人开始为即将完工的梯田准备种植用的玉米与马铃薯种子。
      cost:
      - type: scaled_gold
        value: -6
    - title_en: The Highest Terrace Nears the Sky
      title_zh: 最高一层直逼云天
      desc_en: The uppermost terraces, closest to the citadel's temples, are finished last with the finest fitted stonework the masons can manage, reserved for the crops offered directly to the sun god. Priests inspect every drainage channel a final time before the planting rite is set.
      desc_zh: 最靠近城邑神庙的最高几层梯田最后完工，工匠倾尽所能施以最精细的石砌工艺，专为献给太阳神的作物所留。祭司在播种仪式定期之前，最后一次检查每条排水渠道。
      cost:
      - type: gold
        value: -70
    - title_en: The First Sowing Rite Is Held
      title_zh: 首次播种大典举行
      desc_en: Priests and farmers gather on the highest terrace to bless the first maize kernels pressed into the mountain's new soil, the royal citadel above looking down on slopes that were bare rock only seasons before. The terraces now feed the mountain settlement permanently, turning the steepest Andean slopes into some of the empire's most reliable farmland.
      desc_zh: 祭司与农人齐聚最高一层梯田，为按入这片山地新土中的首批玉米种子祈福，山上的王家城邑俯瞰着这片不久前还是裸岩的坡地。梯田自此永久供养这处山间聚落，将安第斯山脉最陡峭的坡地变为帝国最可靠的农田之一。
      cost:
      - type: devotion
        value: -25
