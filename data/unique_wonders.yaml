      title_zh: 换地择址临河而建
      desc_en: Land along the riverbank is exchanged with local nobles for the mausoleum's plot, and the foundation is blessed while architect Ustad Ahmad Lahauri surveys the ground.
      desc_zh: 朝廷以其他田产与当地贵族交换河畔地块以作陵址，建筑师乌斯塔德·艾哈迈德·拉合里勘测地基之际，工程举行了奠基祝祷。
      cost:
      - type: gold
        value: -40
    - title_en: Marble Caravans Arrive From Makrana
      title_zh: 马克拉纳白石千里运抵
      desc_en: Caravans haul white marble from the Makrana quarries hundreds of miles away, while agents across Asia gather jasper, jade, and lapis for the inlay to come.
      desc_zh: 驮队将数百里外马克拉纳采石场的白色大理石运抵工地，各方使者也在亚洲各地搜罗碧玉、翡翠与青金石，以备日后镶嵌之用。
      cost:
      - type: scaled_gold
        value: -7
    - title_en: The Riverbank Platform Is Sunk
      title_zh: 河岸台基深井筑固
      desc_en: Engineers sink deep wells filled with rubble and mortar into the riverbank to bear the mausoleum's weight, and the great plinth begins to take shape above the water.
      desc_zh: 工程师在河岸下凿出深井，填以碎石与灰浆，以承载陵寝的重量，宏伟的基座自此开始在水岸之上渐显雏形。
      cost:
      - type: gold
        value: -70
    - title_en: The Great Dome and Minarets Rise
      title_zh: 穹顶宣礼塔并起
      desc_en: The central dome climbs above the plinth as four slender minarets rise at its corners, each built to lean fractionally outward so that, should they ever fall, they would fall away from the tomb.
      desc_zh: 中央穹顶在基座之上逐渐升高，四角的宣礼塔也随之耸立，每座皆刻意略向外倾，若有朝一日倾颓，也不致砸向陵寝本身。
      cost:
      - type: artwork
        value: 1
    - title_en: Pietra Dura Blooms Across the Marble
      title_zh: 嵌花石艺缀满玉石
      desc_en: Craftsmen inlay flowering vines of carnelian and lapis into the white marble in the pietra dura technique, while calligrapher Amanat Khan carves the long bands of Quranic verse framing every archway.
      desc_zh: 匠人以嵌花石工艺将玛瑙与青金石雕琢的藤蔓花卉嵌入白色大理石，书法家阿马纳特·汗则在每道拱门四周刻下长长的古兰经文。
      cost:
      - type: artwork
        value: 1
    - title_en: The Charbagh Gardens Are Laid Out
      title_zh: 四分园林引水成镜
      desc_en: The formal charbagh gardens are laid out in quartered symmetry before the tomb, and the long reflecting pool is cut to double the mausoleum's image in still water.
      desc_zh: 陵寝前依四分对称格局铺展出规整的查尔巴格花园，一条长长的倒影水渠也随之开凿，将陵寝的身影映照于静水之中。
      cost:
      - type: cultural_influence
        value: -10
    - title_en: The Mausoleum Is Unsealed and Dedicated
      title_zh: 陵寝启封，永昭盛名
      desc_en: The finished tomb is formally unsealed and dedicated before the court, Mumtaz Mahal's remains laid to rest beneath the dome, and the realm's prestige is declared bound to marble that will not fade.
      desc_zh: 竣工的陵寝在满朝文武见证下正式启封奉献，莫塔芝·玛哈的遗骨安葬于穹顶之下，王朝的威望自此被宣告与这不朽白石一同长存。
      cost:
      - type: prestige
        value: -50
      - type: artwork
        value: 1
