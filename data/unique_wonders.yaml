    stages:
    - title_en: The Grand Master Calls for a Fortress-Convent
      title_zh: 大团长号召修建堡垒修道院
      desc_en: The Grand Master of the Teutonic Order summons his commanders to Malbork, declaring that the Order's seat on the Nogat shall be rebuilt as a fortress no army can take and a convent no rule can corrupt. Knights in white mantles ride from every commandery to witness the proclamation.
      desc_zh: 条顿骑士团大团长召集各地指挥官齐聚马尔堡，宣告将在诺加特河畔重建一座任何军队都无法攻破的堡垒，一座任何规章都无法腐蚀的修道院。身着白袍的骑士们从各个领地策马赶来，见证这一宣告。
      cost:
      - type: prestige
        value: -15
    - title_en: Kilns Along the Nogat
      title_zh: 诺加特河畔的砖窑
      desc_en: Brickmakers set up rows of kilns along the Nogat's banks, firing the deep red clay that will become the Order's signature walls, while barges bring granite fieldstone for the foundations from the Prussian countryside. Commanders requisition serf labor from surrounding villages under the Order's authority.
      desc_zh: 制砖工人沿诺加特河岸架起一排排砖窑，烧制出日后成为骑士团标志性建筑材料的深红黏土砖；驳船则从普鲁士乡间运来花岗岩石块，用作地基。各地指挥官依骑士团权柄，从周边村庄征调农奴劳力。
      cost:
      - type: manpower
        value: -50
    - title_en: The Chapter Blesses the Foundations
      title_zh: 教务会议为地基祝圣
      desc_en: Priest-brothers of the Order bless the marked foundations in a solemn chapter mass, invoking the Virgin Mary as patroness of the coming stronghold. The first stones of the High Castle's cellars are laid before an assembly of knights and sergeants.
      desc_zh: 骑士团中的神职兄弟在庄严的教务弥撒中为已标记的地基祝圣，祈求圣母玛利亚护佑这座即将崛起的堡垒。高堡地窖的第一批基石，在骑士与士官的集会见证下奠定。
      cost:
      - type: devotion
        value: -12
    - title_en: The High Castle's Walls Climb
      title_zh: 高堡城墙拔地而起
      desc_en: Brick by red brick, the towering curtain walls of the High Castle begin to rise above the Nogat, the true labor of building at last replacing the surveying and blessing that came before. Scaffolds of poplar poles line the walls as masons work through the cool desert mornings before the heat of day.
      desc_zh: 一块块红砖垒砌，高堡巍峨的城墙开始沿诺加特河拔地而起——经过清理与祝圣之后，真正的修复劳作终于展开。白杨木杆搭成的脚手架沿城墙一字排开，石匠们趁沙漠清晨的凉爽时分抓紧劳作，赶在酷热来临之前收工。
      cost:
      - type: manpower
        value: -90
    - title_en: Vaulting the Chapel of St. Mary
      title_zh: 圣母礼拜堂穹顶合拢
      desc_en: Master masons raise the ribbed vaults of the castle chapel dedicated to St. Mary, its brick pillars climbing toward a ceiling meant to humble even the proudest knight. Beneath it, the Convent's refectory and dormitories take shape for the brothers' communal life.
      desc_zh: 大石匠们为献给圣母玛利亚的城堡礼拜堂砌起肋拱穹顶，砖砌立柱直冲天际，那穹顶足以令最骄傲的骑士也心生敬畏。其下，供修士们共同生活起居的修道院食堂与宿舍也逐渐成形。
      cost:
      - type: religious_influence
        value: -15
    - title_en: Granaries Against the Long Siege
      title_zh: 为长期围城而建的谷仓
      desc_en: Vast brick granaries and storerooms rise within the middle bailey, stocked against any siege the Poles or Lithuanians might one day bring to the Nogat. Engineers add a moat, drawbridges, and murder-holes, turning devotion into deterrence.
      desc_zh: 巍峨的砖砌谷仓与库房在中院拔地而起，用以储备粮草，以防波兰人或立陶宛人有朝一日兵临诺加特河下。工程师们又加筑护城河、吊桥与杀人孔，令信仰化作了震慑之力。
      cost:
      - type: army_tradition
        value: -3
    - title_en: The Grand Master's Palace Takes Its Splendor
      title_zh: 大团长宫殿尽显华彩
      desc_en: A new palace wing rises for the Grand Master himself, its Grand Refectory vaulted on slender palm-tree columns to seat the whole chapter at once. Painters and glaziers fill the halls with heraldic glass and frescoes befitting the Order's growing wealth.
      desc_zh: 一座新的宫殿侧翼为大团长本人而建，其大食堂以纤细如棕榈树般的立柱支撑穹顶，足以容纳全体教务会议成员同席用餐。画师与玻璃工匠为大厅装点纹章彩窗与壁画，与骑士团日益丰厚的财富相称。
      cost:
      - type: prestige
        value: -35
    - title_en: Malbork Stands Unconquerable
      title_zh: 马尔堡固若金汤
      desc_en: The Grand Master consecrates the finished fortress-convent with a mass in the Chapel of St. Mary, its red walls now the largest brick stronghold in Christendom. From this day the Order's knights muster with a discipline and endurance that Malbork's completed walls will inspire for generations.
      desc_zh: 大团长在圣母礼拜堂举行弥撒，为这座竣工的堡垒修道院举行祝圣仪式——其红色城墙如今已是基督教世界最大的砖砌要塞。自此日起，骑士团麾下的骑士们因马尔堡的落成而更添纪律与耐力，这份精神将激励后世数代。
      cost:
      - type: prestige
        value: -45
      - type: honor
        value: -25
