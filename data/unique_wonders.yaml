      title_zh: 印卡王择定双峰之脊
      desc_en: The Sapa Inca Pachacuti declares that a royal estate shall crown the saddle between Machu Picchu and Huayna Picchu, a retreat worthy of the Sun's own descendant.
      desc_zh: 萨帕印卡帕查库特克宣告，要在马丘比丘与瓦伊纳比丘两峰之间的山脊上建起一座王家庄园，唯有太阳之裔才配拥有这般居所。
      cost:
      - type: prestige
