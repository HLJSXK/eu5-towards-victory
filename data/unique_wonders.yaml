    stages:
    - title_en: The Compere Is Chartered
      title_zh: 圣乔治银行特许成立
      desc_en: The Genoese Republic charters the compere of Casa di San Giorgio into a single bank, empowered to manage the state's debts and collect its taxes in the Republic's name. Merchant magistrates gather in the loggia to elect the first protectors of the new institution.
      desc_zh: 热那亚共和国特许将圣乔治宫的各债权公会合并为一家统一的银行，授权其代表共和国管理国债并征收赋税。商界要人齐聚回廊，推选新机构的首任监护官。
      cost:
      - type: scaled_gold
        value: -4
    - title_en: The Ledgers Are Consolidated
      title_zh: 账册合并归一
      desc_en: Clerks labor through the winter merging the scattered debt registers of a dozen compere into a single set of books, each column checked twice against the Republic's own tax rolls. Old creditors line up at the doors of the Palazzo San Giorgio to have their claims re-entered under the new seal.
      desc_zh: 文书们整个冬天忙于将十几个债权公会分散的账簿合并成一套统一的账本，每一栏都须与共和国税册反复核对两遍。旧日债权人排队来到圣乔治宫门前，要求将其债权重新登记于新印之下。
      cost:
      - type: gold
        value: -40
    - title_en: The Magistrates Take Their Oaths
      title_zh: 长官宣誓就任
      desc_en: The elected protectors and their council of ancients swear before the notaries to administer the state's revenue with the same rigor as their own private fortunes. Guards are posted at the vaults where the coin reserves of the new bank will be kept under lock and seal.
      desc_zh: 当选的监护官与元老议事会在公证人面前宣誓，将以管理自家财产同等的严谨对待国家岁入。新银行金库的守卫已就位，钱币储备将上锁加封，严加看管。
      cost:
      - type: honor
        value: -10
    - title_en: The Banking Hall Is Raised
      title_zh: 银行大厅动工兴建
      desc_en: Masons break ground on the great vaulted hall of the Palazzo San Giorgio itself, its columns and coffered ceiling designed to declare the permanence of Genoese credit in stone. What was charter and oath now becomes brick, marble, and iron-bound doors.
      desc_zh: 石匠们在圣乔治宫内开凿宏伟的拱顶大厅，其立柱与藻井天花意在以石材本身宣示热那亚信用的永固。此前的特许与誓言，如今化作砖石、大理石与铁箍大门。
      cost:
      - type: scaled_gold
        value: -7
    - title_en: The Vaults Are Sealed in Iron
      title_zh: 铁封金库落成
      desc_en: Guarded strongrooms are cut deep into the palazzo's foundations, their iron-bound coin chests set beneath vaulted ceilings painted with the Republic's arms. Notaries begin recording every deposit in triplicate, one copy for the depositor, one for the bank, one for the Republic's own archive.
      desc_zh: 守卫森严的金库深凿于宫殿地基之中，铁箍钱柜安放在绘有共和国纹章的拱顶之下。公证人开始将每笔存款誊录三份，一份予存户，一份留银行，一份归共和国档案。
      cost:
      - type: gold
        value: -60
    - title_en: The Colonial Ledgers Arrive
      title_zh: 殖民地账目汇入
      desc_en: Ships bring in the accounts of Genoese colonies from Chios to the Crimea, their revenues folded into the bank's growing web of credit, and the Casa di San Giorgio begins to resemble less a debt office than a state within the state. Foreign merchants seek loans against its now-famous seal.
      desc_zh: 商船带来了从希俄斯到克里米亚各处热那亚殖民地的账目，其收益并入银行日益庞大的信用网络，圣乔治宫渐渐不再只是一处债务管理所，倒像是一个国中之国。外国商人纷纷寻求以其如今声名远播的印信作抵押借贷。
      cost:
      - type: scaled_gold
        value: -9
    - title_en: The Public Debt Is Refounded
      title_zh: 公共债务重整
      desc_en: The bank restructures the whole of the Republic's public debt into shares that may be bought, sold, and inherited, a device so effective that foreign princes send envoys to study it. Guards double at the vaults as the volume of coin and credit passing through the halls swells beyond all early estimates.
      desc_zh: 银行将共和国全部公共债务重组为可买卖、可继承的股份，这一制度成效卓著，甚至有外国王公遣使前来学习。随着经手大厅的钱币与信用规模远超最初预估，金库的守卫也随之加倍。
      cost:
      - type: gold
        value: -100
    - title_en: The Casa di San Giorgio Opens Its Doors
      title_zh: 圣乔治宫正式开张
      desc_en: The Republic's magistrates preside over the formal opening of the Casa di San Giorgio, and the bank's seal is affixed to the first public account of the reorganized state debt. Genoa's credit now rests on an institution foreign courts will study and envy for centuries.
      desc_zh: 共和国的官员主持圣乔治宫的正式开幕仪式，银行的印信盖在重组后国债的首份公开账目之上。热那亚的信用自此立于一座将被后世各国宫廷研究与艳羡数百年的机构之上。
      cost:
      - type: scaled_gold
        value: -12
      - type: prestige
        value: -30
