    - type: honor
      value: 15
    stages:
    - title_en: The Oba Decrees the Great Walls
      title_zh: 奥巴下令兴建大城垣
      desc_en: The Oba proclaims a great earthwork to encircle the capital, its ramparts and moats to stand as proof of Benin's power to every neighboring kingdom. Bronze casters and chiefs alike swear oaths of labor before the first spade breaks ground.
      desc_zh: 奥巴颁布诏令，宣布兴建一道环绕王都的宏伟土垣，其城墙与壕沟将向每一个邻邦昭示贝宁的国力。在第一锹土被挖起之前，铜匠与酋长们已一同起誓效力。
      cost:
      - type: honor
        value: -10
    - title_en: Marking the Palace Roads
      title_zh: 标定王宫道路
      desc_en: Surveyors mark the great roads radiating from the palace, tracing the line the earthworks must follow through forest edge and red earth alike. Chiefs from outlying wards are summoned to pledge labor from their households.
      desc_zh: 测量员标出自王宫向外辐射的主干道，勾勒出土垣需穿越林缘与红土之地的路线。外围各区的酋长受召，承诺征调各自家户的劳力。
      cost:
      - type: government_power
        value: -8
    - title_en: Gathering Labor from Every Ward
      title_zh: 征调各区劳力
      desc_en: Households across every ward of the capital send laborers with baskets and hoes, organized under the palace's careful reckoning of who owes what season's work. Guards are posted along the marked lines to keep the route from being disturbed before digging begins.
      desc_zh: 王都各区的家户纷纷派出携带篮筐与锄头的劳工，由王宫依据各家应尽的季节劳役详加统筹调度。卫兵沿标定路线驻守，防止在挖掘开始前有人扰动路线。
      cost:
      - type: government_power
        value: -12
    - title_en: The Ramparts Truly Begin
      title_zh: 城垣工程正式动工
      desc_en: Diggers break the red earth in earnest, and the first true ridge of the rampart rises where surveyors' marks once lay alone. What was decree and labor rolls now becomes a wall climbing steadily from the forest floor.
      desc_zh: 挖掘工们正式破开红土，测量员标记之处曾经空无一物，如今第一道真正的土垣脊线拔地而起。曾经只是诏令与劳役名册，如今已化作从林地地面稳步攀升的城墙。
      cost:
      - type: army_tradition
        value: -2
    - title_en: The Moats Are Cut Deep
      title_zh: 深挖护城壕沟
      desc_en: Deep moats are cut alongside the rising ramparts, the excavated earth piled directly onto the walls above in the old Edo method of building both at once. Rains fill the trenches before the season is out, testing the first stretch of earthwork.
      desc_zh: 深壕沿新起的土垣一侧挖凿而成，挖出的泥土直接堆筑于上方城墙，正是埃多古法中同时营建二者的手法。雨季未过，壕沟便已蓄满雨水，正好检验第一段土垣的成色。
      cost:
      - type: army_tradition
        value: -3
    - title_en: The Gates Are Set in Timber
      title_zh: 木造城门安装完成
      desc_en: Great timber gates are hung at the points where the palace roads cross the earthworks, each one guarded and blessed before travelers are allowed through. Bronze plaques are commissioned to mark the ceremony for the palace's own record.
      desc_zh: 巨大的木制城门安装于王宫道路穿越土垣之处，每一座城门在开放通行之前都需经守卫与祝祷。宫廷特意委制铜牌，记录此次仪典以留存王室档案。
      cost:
      - type: prestige
        value: -20
    - title_en: The Ramparts Encircle the Capital
      title_zh: 土垣环绕王都合围
      desc_en: The earthworks close the final gap around the capital, forming an unbroken ring of ramparts and moats said to rival any wall in the wider world. Guards begin regular patrols along the completed stretches even as laborers finish the last few miles.
      desc_zh: 土垣工程合拢了环绕王都的最后缺口，形成一道连绵不绝的城墙与壕沟环带，据传足以媲美世间任何城垣。已完工路段开始有卫兵例行巡逻，而劳工们仍在赶完最后几里工程。
      cost:
      - type: honor
        value: -25
    - title_en: The Oba Consecrates the Finished Walls
      title_zh: 奥巴为竣工城垣举行祝圣
      desc_en: The Oba rides the full circuit of the finished ramparts in a great procession, bronze casters and chiefs alike proclaiming Benin's power secured for generations. The capital's defenses now stand as a lasting mark of the kingdom's strength, felt in every garrison across the realm.
      desc_zh: 奥巴乘坐仪仗，巡视竣工城垣的整条环线，铜匠与酋长齐声宣告贝宁国力将由此世代永固。王都的防御工事自此成为王国实力历久不衰的象征，其影响遍及举国每一处驻防。
      cost:
      - type: prestige
        value: -40
      - type: honor
        value: -30
