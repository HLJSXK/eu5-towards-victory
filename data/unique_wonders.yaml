      desc_zh: 苏丹颁布敕令，宣布对非斯古城的宗教学院、清真寺与城门进行大规模重修，以彰显王朝的正统。在第一片瓦片被更换之前，传令官早已将消息传遍狭窄的巷弄。
      cost:
      - type: legitimacy
        value: -12
    - title_en: Surveying the Ancient Lanes
      title_zh: 勘察古城巷道
      desc_en: Surveyors and qadis walk the medina's dense lanes, cataloguing which walls lean, which gates rot, and which fountains have run dry. Craft guild elders are consulted before a single stone is touched.
      desc_zh: 测量员与卡迪们走遍麦地那狭窄的巷道，登记哪些墙体倾斜、哪些城门朽坏、哪些喷泉早已干涸。在动工触碰任何一块石头之前，工匠行会的长老们先被征询意见。
      cost:
      - type: research_progress
        value: -10
    - title_en: Gathering Dyers and Masons
      title_zh: 召集染工与石匠
      desc_en: Dyers, tile-cutters, and masons are gathered from across the Maghreb, their guilds blessed by local scholars before work begins. Vats and scaffolding are stocked along the lanes leading to the great madrasas.
      desc_zh: 染工、瓷砖工与石匠从马格里布各地被召集而来，动工之前，行会先接受当地学者的祝福。染缸与脚手架沿着通往几座大型宗教学院的巷道一一备齐。
      cost:
      - type: cultural_tradition
        value: -8
    - title_en: The Restoration Truly Begins
      title_zh: 重修工程正式动工
      desc_en: Scaffolding rises against the first crumbling wall, and craftsmen begin the true work of restoration rather than mere planning. Dust and the ring of chisels fill lanes that had stood quiet for a generation.
      desc_zh: 脚手架在第一堵斑驳墙体前搭起，工匠们开始了真正意义上的重修，而不再只是纸上规划。凿刀敲击声与尘土弥漫在这些沉寂了一代人的巷弄之中。
      cost:
      - type: scaled_gold
        value: -6
    - title_en: The Madrasa Courtyards Are Renewed
      title_zh: 宗教学院庭院焕然一新
      desc_en: Zellige tile-cutters fit fresh geometric mosaics across the madrasa courtyards, matching centuries-old patterns stone by stone. Scholars return to lecture beneath scaffolding that has not yet fully come down.
      desc_zh: 泽利吉瓷砖工在宗教学院庭院里逐块拼贴出与百年旧纹样相符的几何镶嵌图案。学者们已在尚未完全拆除的脚手架下重新开课讲学。
      cost:
      - type: artwork
        value: 1
    - title_en: The Gates and Ramparts Are Reset
      title_zh: 城门与城垣重新加固
      desc_en: Masons reset the great gates on their hinges and reinforce the ramparts that ring the ancient city, their work watched by craft guild processions who parade in celebration of each finished section. Merchants reopen stalls beneath the freshly restored arches.
      desc_zh: 石匠们重新校正大门的转轴，加固环绕古城的城垣，每完成一段，工匠行会便会举行游行庆祝。商贩们纷纷在修葺一新的拱门下重新开张摊位。
      cost:
      - type: honor
        value: -15
    - title_en: The Fountains Run Clear Again
      title_zh: 喷泉重新涌流清澈
      desc_en: Engineers clear and reline the city's underground water channels, and the medina's fountains run clear for the first time in a generation. Dyers return to their vats along the tanneries, the ancient trade in full color once more.
      desc_zh: 工程师们清理并重新铺砌城市地下水道，麦地那的喷泉时隔一代人重新涌流出清澈的水。染工们回到皮革坊的染缸旁，古老的行业再次色彩斑斓。
      cost:
      - type: scaled_gold
        value: -9
    - title_en: Fez Is Reconsecrated in Splendor
      title_zh: 非斯古城重焕荣光
      desc_en: The sultan walks the restored lanes in a formal procession, the madrasas, gates, and fountains of Fez reconsecrated as living proof of the dynasty's enduring right to rule. Word of the renewed city travels the caravan roads, and the crown's standing grows with every merchant who repeats the tale.
      desc_zh: 苏丹在正式仪仗的引领下走过修复一新的巷道，非斯的宗教学院、城门与喷泉重新祝圣，成为王朝统治合法性历久弥新的明证。古城重焕荣光的消息随商队传遍四方，每一位复述此事的商人，都让王室的声望更添一分。
      cost:
      - type: legitimacy
        value: -30
      - type: artwork
        value: 1
