      title_zh: 夯土与木料上山
      desc_en: Rammed earth and stone are hauled up switchback paths from the valley floor, while timber cut in lower forests is carried by mule train to the summit.
      desc_zh: 夯土与石料沿之字山道从谷底运上山来，低地林中砍伐的木材也由骡队驮运，一路送至山巅。
      cost:
      - type: scaled_gold
        value: -5
    - title_en: The White Palace Foundations Are Laid
      title_zh: 白宫地基初奠
      desc_en: Workers break ground for the White Palace's first terrace, and the hillside begins its slow transformation from bare fortress ruin into rising palace wall.
      desc_zh: 工匠为白宫第一层台地破土动工，这座山坡自此开始由荒废的古堡遗迹，缓缓化作层层耸立的宫墙。
      cost:
      - type: gold
        value: -55
    - title_en: Terrace Upon Terrace, the White Palace Climbs
      title_zh: 白宫层层叠上山巅
      desc_en: The White Palace rises tier upon tier up the hillside, its whitewashed walls following the contour of the rock until the summit itself disappears beneath them.
      desc_zh: 白宫沿山势一层层向上垒砌，粉白的宫墙顺着岩体的轮廓延展，直至连山巅本身也隐没于宫墙之下。
      cost:
      - type: artwork
        value: 1
    - title_en: The Red Palace Rises in Secret Mourning
      title_zh: 秘不发丧，红宫续起
      desc_en: When the Great Fifth dies before his palace is finished, his regent Desi Sangye Gyatso conceals the death and presses on, raising the crimson Red Palace as if the Dalai Lama himself still willed it.
      desc_zh: 五世达赖喇嘛在宫殿竣工前圆寂，摄政第悉桑结嘉措秘不发丧，只当法旨仍在，继续督建那座朱红色的红宫。
      cost:
      - type: legitimacy
        value: -15
    - title_en: Gold Stupas and Murals Fill the Halls
      title_zh: 金塔壁画满殿生辉
      desc_en: Gilded reliquary stupas are installed within the Red Palace's chapels, and painters cover the corridors with murals of past incarnations and protector deities.
      desc_zh: 镀金灵塔一座座安放入红宫的佛殿，画师则在回廊满绘历世化身与护法神像，殿内自此金碧生辉。
      cost:
      - type: artwork
        value: 1
    - title_en: Banners Rise Over the Completed Palace
      title_zh: 宫殿落成，经幡漫卷
      desc_en: Monks process with banners along the winding stairs as the palace-monastery is consecrated whole, and its blessing over pilgrims and pious subjects alike is declared to last as long as the hill itself.
      desc_zh: 僧众持经幡沿盘旋石阶列队而行，宫殿全体举行开光大典，据传其对朝圣者与虔信子民的护佑，将如红山本身一般长存不衰。
      cost:
      - type: devotion
        value: -30
