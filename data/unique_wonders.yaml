        value: -10
    - title_en: The First Waystation Fortress Rises
      title_zh: 首座驿堡奠基动工
      desc_en: Masons begin raising the first fortified waystation's walls in the true stone of the route, and the caravan road ceases to be a mere plan drawn on parchment.
      desc_zh: 石匠开始在路线的真实石地上垒起第一座设防驿堡的城墙，朝觐之路自此不再只是羊皮纸上的图样。
      cost:
      - type: manpower
        value: -25
    - title_en: Cisterns Carved Into the Rock
      title_zh: 蓄水池凿入岩层
      desc_en: Engineers cut great cisterns into the rock beside each station, storing the rare desert rains against the thirst of tens of thousands who will pass each pilgrimage season.
      desc_zh: 工匠在每座驿站旁的岩层中凿出巨大蓄水池，储存稀少的沙漠雨水，以备每年朝觐季节数万人之渴。
      cost:
      - type: artwork
        value: 1
    - title_en: The Watchtowers Stand Against Raiders
      title_zh: 望楼矗立以御劫匪
      desc_en: Garrisoned watchtowers rise along the exposed stretches of the road, their sentries trained to signal warning of raiders long before the caravan bells are heard.
      desc_zh: 沿途暴露地段筑起有驻军的望楼，哨兵训练有素，能在商队驼铃声传来之前便发出劫匪来袭的警讯。
      cost:
      - type: manpower
        value: -35
    - title_en: The Great Caravan Survives the Storm
      title_zh: 大商队挺过沙暴
      desc_en: A sudden sandstorm scatters one season's caravan near the road's midpoint, and only the newly built stations and their stored water bring every pilgrim through alive.
      desc_zh: 一场突如其来的沙暴在路途中段冲散了当季商队，唯有新建的驿站与储水助其中每一位朝觐者平安脱险。
      cost:
      - type: devotion
        value: -20
    - title_en: The Road to the Kaaba Is Blessed
      title_zh: 通往天房之路受祝圣
      desc_en: Imams and officials gather at the road's completion to bless its full length from the empire's heartland to the gates of Mecca, and the Sultan's protection of the pilgrimage becomes a permanent pillar of the realm's faith and standing.
      desc_zh: 伊玛目与官员齐聚，为这条从帝国腹地直抵麦加城门的道路全线祝圣，苏丹对朝觐的庇护自此成为帝国信仰与声望永恒的支柱。
      cost:
      - type: devotion
        value: -30
      - type: artwork
        value: 1
