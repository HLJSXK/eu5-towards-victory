      title_zh: 弹药库与吊车完善兵工厂
      desc_en: Powder magazines, cranes, and rigging lofts complete the arsenal's works, and the port begins fitting out its first completed hulls.
      desc_zh: 火药库、吊车与索具棚完善了兵工厂的设施，港口也开始为首批完工的船体装配索具。
      cost:
