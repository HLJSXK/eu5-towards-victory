      desc_en: Pope Julius II proclaims that the crumbling old basilica over St. Peter's tomb shall be torn down and replaced with a church greater than any built since antiquity.
      desc_zh: 教皇儒略二世下诏，宣布将拆除圣彼得墓上那座日渐倾颓的旧圣殿，另建一座自古以来前所未有的宏伟教堂。
      cost:
      - type: papal_authority
        value: -10
    - title_en: The Cornerstone Is Blessed Over the Tomb
      title_zh: 教皇亲祝墓上基石
      desc_en: The Pope himself blesses the cornerstone laid directly above the apostle's tomb, as the last walls of the old Constantinian basilica are cleared away around it.
      desc_zh: 教皇亲自为直接安放于使徒墓穴之上的基石祝圣，君士坦丁时代旧圣殿的最后几堵残墙也在四周被逐一清除。
