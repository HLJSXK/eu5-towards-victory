  ceremony:
    stage_1_reward:
    - type: gold
      value: 90
    - type: yearly_gold
      value: 3
    - type: cultural_influence
      value: 8
    stages:
    - title_en: The Burgomasters Approve the Plan
      title_zh: 市政官批准运河计划
      desc_en: The city council of Amsterdam ratifies the Plan of the Three Canals, resolving that Herengracht, Keizersgracht, and Prinsengracht shall ring the old center in concentric arcs of water. Surveyors are given a year to stake the curve before a single spade breaks ground.
      desc_zh: 阿姆斯特丹市议会批准三运河规划，决定绅士运河、皇帝运河与王子运河将以同心弧形环绕旧城中心。测量员获准用一年时间标定曲线，方可动土开工。
      cost:
      - type: scaled_gold
        value: -3
    - title_en: The Polder Is Surveyed
      title_zh: 圩田实地勘测
      desc_en: Land agents and hydraulic engineers walk the soft polder ground beyond the Singel, driving marker poles into the peat to fix where each canal's bank must run. Investors are invited to subscribe plots along the future waterfront before the mud is even drained.
      desc_zh: 土地测量员与水利工程师踏勘辛厄尔运河外围松软的圩田，将标桩插入泥炭地，确定每条运河河岸的走向。投资者获邀在泥地尚未排干之前，便认购未来沿岸的地块。
      cost:
      - type: gold
        value: -30
    - title_en: The Peat Is Drained and Piled
      title_zh: 泥炭排干，木桩堆积
      desc_en: Windmills and horse-driven pumps draw the water from the low ground while barges bring in Norwegian timber piles by the thousand, for no house here may stand without its forest driven into the mud below. Guild masters bless the first pile with beer poured over its head.
      desc_zh: 风车与畜力水泵将低地积水抽干，驳船源源不断运来数以千计的挪威木桩，此地任何房屋若无深植泥中的地下森林支撑，皆无法立足。行会师傅将啤酒浇在第一根木桩顶端，为其祝福。
      cost:
      - type: scaled_gold
        value: -5
    - title_en: The First Bank Is Cut
      title_zh: 首段河岸破土动工
      desc_en: Diggers break the peat along the marked line of the Herengracht, and the first true stretch of canal water begins to fill where dry polder stood only months before. The plan on parchment becomes, at last, a line of mud, water, and brick along the horizon.
      desc_zh: 挖掘工沿绅士运河的标线切开泥炭，数月前尚是干燥圩田之处，如今已开始注入第一段真正的运河之水。羊皮纸上的规划，终于化作地平线上一道由泥土、河水与砖石构成的实线。
      cost:
      - type: manpower
        value: -25
    - title_en: The Merchant Houses Rise
      title_zh: 商人宅邸拔地而起
      desc_en: Narrow brick facades climb along the new quays, each fitted with a hoisting beam at the gable to lift goods straight from barge to attic, and the wealthy of Amsterdam compete to outbuild their neighbors' step-gables. The canal ring begins to look less like an engineering work and more like a city.
      desc_zh: 狭窄的砖砌立面沿新码头次第升起，每座山墙都装有吊运横梁，可将货物直接从驳船吊运至阁楼；阿姆斯特丹的富商们争相以更华丽的阶梯山墙压过邻居。运河环渐渐不再只是一项工程，而更像一座真正的城市。
      cost:
      - type: cultural_influence
        value: -6
    - title_en: The Keizersgracht Is Cut
      title_zh: 皇帝运河凿通
      desc_en: The second ring, the Keizersgracht, is dug wider still to carry the grandest houses of the regent class, its trees planted in even rows to shade the towpaths. Barges now move goods and timber through two rings of water where once only the Singel bounded the town.
      desc_zh: 第二道环形运河皇帝运河被挖得更为宽阔，专供摄政阶层最气派的宅邸使用，河岸两侧整齐种植的树木为纤道遮荫。曾经只有辛厄尔运河环绕全城，如今驳船已可穿行于两道水环之间运送货物与木材。
      cost:
      - type: scaled_gold
        value: -8
    - title_en: The Prinsengracht Closes the Ring
      title_zh: 王子运河合围成环
      desc_en: The outer Prinsengracht is finally cut through the last stretch of polder, its warehouses built plain and sturdy for the storage of grain, spice, and timber rather than display. The three canals, laid concentric as compass rings, at last enclose the entire expanded city.
      desc_zh: 最外圈的王子运河终于贯通最后一段圩田，其仓库建得朴实坚固，专为储存谷物、香料与木材而非炫示之用。三条同心如罗盘刻度般的运河，终于将整座扩展后的城市完整环绕。
      cost:
      - type: gold
        value: -70
    - title_en: The Ring Opens to Trade
      title_zh: 运河环正式通航
      desc_en: The burgomasters preside over the ceremonial opening of the completed canal ring, and merchant barges from every quarter of the Republic pass through the new waterways in procession. Amsterdam stands transformed, its water-bound geometry now the engine of trade for the entire Golden Age.
      desc_zh: 市政官主持已竣工运河环的启用典礼，来自共和国各地的商船列队驶过这片新水道。阿姆斯特丹自此焕然一新，这座以水网几何构筑的城市，成为整个黄金时代贸易运转的核心引擎。
      cost:
      - type: scaled_gold
        value: -10
      - type: gold
        value: -100
