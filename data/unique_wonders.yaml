    - title_en: The Waterkeepers Are Sworn In
      title_zh: 掌水官受命就职
      desc_en: Wells are claimed and cisterns blessed by local sheikhs, who swear to keep the water clean and the scales honest for every pilgrim who passes, rich or poor.
      desc_zh: 当地谢赫为水井祝圣，认领各处蓄水池，并宣誓保持水源洁净、秤量公道，无论过往朝觐者贫富。
