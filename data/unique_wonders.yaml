    - title_en: The Kontor Charter Is Proclaimed
      title_zh: 商馆特许状颁布
      desc_en: Hamburg's council summons the guild elders and reads out the charter for a new Kontor, a house where Baltic and North Sea trade will be weighed, sealed, and recorded under one roof. Coin changes hands before a single stone is laid, and the burghers toast to ledgers not yet opened.
      desc_zh: 汉堡市议会召集行会长老，当众宣读新商馆的特许状——往来波罗的海与北海的货物，将在同一屋檐下过秤、盖印、入账。第一块砖尚未落地，商银已先易手，市民们举杯，庆贺尚未打开的账册。
      cost:
      - type: gold
        value: -50
    - title_en: Surveying the Elbe Wharves
      title_zh: 易北河畔勘定地基
      desc_en: Surveyors pace out a stretch of muddy wharf where the Elbe runs deep enough for laden cogs. Harbor masters argue over mooring rights while clerks stake the boundary with league banners.
      desc_zh: 测量员沿着易北河一段泥泞的码头反复丈量，确认水深足以停泊满载的柯克船。港务官们为泊位权争执不下，文书们则用汉萨同盟的旗帜标出地界。
      cost:
      - type: scaled_gold
        value: -5
    - title_en: Baltic Timber and Lubeck Brick
      title_zh: 波罗的海木材与吕贝克砖
      desc_en: Barges bring oak from Baltic forests and kiln-fired brick from Lubeck, stacked along the bank under oiled tarpaulins. Guild masters bless the stores and swear the goods will not be skimmed before the walls rise.
      desc_zh: 驳船运来波罗的海的橡木和吕贝克烧制的砖块，在岸边堆成一垛垛，覆着油布。行会师傅为这些储料祝祷，并起誓在墙壁立起之前，不许任何人从中揩油。
      cost:
      - type: scaled_gold
        value: -7
    - title_en: The First Pilings Are Driven
      title_zh: 第一根木桩打入河床
      desc_en: Hammers ring out as the first pilings are driven into the soft riverbank to bear the weight of brick and cargo alike. What was a charter and a stack of timber now becomes a building rising from the mud of the Elbe.
      desc_zh: 锤声阵阵，第一批木桩打入松软的河岸，用以承受砖石与货物的重量。曾经只是一纸特许状和一堆木料，如今已在易北河的泥地上，化作拔地而起的建筑。
      cost:
      - type: scaled_gold
        value: -8
    - title_en: Vaulted Warehouses Take Form
      title_zh: 拱顶仓库初具规模
      desc_en: Brick vaults close overhead row by row, forming the dry storerooms where wax-sealed bales of wool, furs, and salted fish will wait out the winter crossings. Masons from three Hanseatic towns compare their arches with quiet pride.
      desc_zh: 一排排砖砌拱顶陆续合拢，形成干燥的库房，用来存放蜡封的羊毛、皮货和腌鱼，静待冬季航运。来自三座汉萨城市的泥瓦匠比较着各自的拱券，暗自较劲又彼此欣赏。
      cost:
      - type: scaled_gold
        value: -6
    - title_en: Counting Rooms and Sealed Ledgers
      title_zh: 算账房与铅封账册
      desc_en: Above the warehouse floors, counting rooms are fitted with high desks, iron-bound chests, and the lead seals that will mark every bale as league-certified. Clerks move in before the plaster has fully dried.
      desc_zh: 在仓库楼层之上，算账房安装了高台账桌、铁箍钱柜，以及用来标记每一捆货物为同盟认证的铅印。灰泥尚未干透，文书们便已搬入办公。
      cost:
      - type: gold
        value: -90
    - title_en: Cranes Rise Along the Quay
      title_zh: 码头吊车拔地而起
      desc_en: Timber cranes are winched upright along the quay, their long arms ready to swing cargo from ship to storeroom in a single motion. Ship masters from Bergen to Novgorod begin naming Hamburg in the same breath as Lubeck and Bruges.
      desc_zh: 一台台木制吊车沿码头绞立而起，长臂一挥便能将货物从船上直吊入库房。从卑尔根到诺夫哥罗德的船长们，开始把汉堡与吕贝克、布鲁日相提并论。
      cost:
      - type: yearly_gold
        value: -10
    - title_en: The Kontor Opens Its Gates
      title_zh: 商馆正式开馆
      desc_en: The Kontor's gates swing open under the league banner, its counting rooms staffed and its cranes turning. Merchants across the Baltic and North Sea now route their trade through Hamburg as a matter of habit, and the crown's coffers feel the difference every season.
      desc_zh: 商馆大门在同盟旗帜下正式开启，算账房人手齐备，吊车日夜运转。波罗的海与北海的商人如今习惯性地把货物转道汉堡，王室的国库也从此四季有感。
      cost:
      - type: yearly_gold
        value: -20
      - type: gold
        value: -140
