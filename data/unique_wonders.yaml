    - title_en: Selecting the Palace Wing
      title_zh: 择定宫殿侧翼
      desc_en: Architects walk the palace grounds and settle on a wing with north-facing light, ideal for viewing brushwork without glare. The elector's seal approves the plans over supper.
      desc_zh: 建筑师们踏勘宫殿场地，选定一处朝北采光的侧翼，最适合观赏画作笔触而不受眩光干扰。选帝侯在晚宴间用印批准了图纸。
