    - title_en: The Priests Read the Mountain Spirits
      title_zh: 祭司叩问山灵
      desc_en: Priests climb the ridge to consult the apus, the spirits of the surrounding peaks, and mark where a temple to Inti the sun must face the solstice sunrise.
      desc_zh: 祭司登上山脊，请示四周群峰的守护山灵阿普，标定太阳神殿必须朝向冬至日出方位的确切位置。
