    stages:
    - title_en: The Tlatoani Decrees the Roads of Stone
      title_zh: 特拉托阿尼颁布石道敕令
      desc_en: The Huey Tlatoani summons the calpixque and the chinampa councils to declare that Tenochtitlan's island shall be bound to the mainland by causeways no flood may sever. Priests read the omens over Lake Texcoco before the first cord is stretched.
      desc_zh: 特拉托阿尼召集贡赋官与奇南帕议事会，宣布特诺奇蒂特兰的岛屿将由永不为洪水所断的堤道与大陆相连。祭司们在第一根测绳拉开之前，于特斯科科湖上占卜征兆。
      cost:
      - type: devotion
        value: -10
    - title_en: The Chinampas Yield Their Reeds
      title_zh: 奇南帕献出苇料
      desc_en: Farmers of the floating gardens are called from their maize and reed plots to supply the woven stakes and matting that will anchor the causeway's foundations. Canoe fleets ferry basalt and volcanic stone from the lakeshore quarries toward the chosen crossings.
      desc_zh: 浮田上的农人们暂离玉米与芦苇地，被征召供应用以固定堤道地基的编织木桩与席垫。独木舟船队从湖岸采石场将玄武岩与火山岩运往选定的渡口。
      cost:
      - type: scaled_gold
        value: -5
    - title_en: The Waters Are Measured and Blessed
      title_zh: 测量水域，祈求祝福
      desc_en: Priests of Tlaloc walk the shallows with the calpixque surveyors, marking where pilings must be sunk deep enough to hold against the lake's seasonal swell. Offerings of copal and quetzal feathers are cast into the water at each chosen point.
      desc_zh: 特拉洛克的祭司与贡赋测量官一同涉水而行，标出桩木须深植以抵御湖水季节性涨落之处。每一处选定的地点，都投入柯巴脂香与格查尔鸟羽作为祭品。
      cost:
      - type: devotion
        value: -12
    - title_en: The First Pilings Are Driven
      title_zh: 首批桩木沉入湖底
      desc_en: Laborers by the thousands sink timber piles into the lakebed and pack them with stone and clay, and the first true causeway begins to crawl outward from the island's edge. What was ritual and survey now becomes labor visible from every rooftop of the city.
      desc_zh: 数千劳工将木桩沉入湖床，以石块与黏土层层夯实，第一条真正的堤道自岛缘向外延伸。此前的仪式与测量，如今化作全城屋顶皆可望见的实在劳作。
      cost:
      - type: manpower
        value: -30
    - title_en: The Iztapalapa Causeway Lengthens
      title_zh: 伊斯塔帕拉帕堤道延伸
      desc_en: The southern causeway to Iztapalapa stretches league by league, wide enough for eight horsemen abreast though the Mexica know no horse, its removable wooden bridges allowing canoes to pass beneath. Merchants begin using the unfinished road before the last stones are set.
      desc_zh: 通往伊斯塔帕拉帕的南向堤道逐里延展，宽度足以容纳八骑并行，尽管墨西加人尚不识马；其可移动木桥使独木舟得以从下方穿行。商人们甚至在最后一批石料铺设完成前，便已开始使用这条未竟之路。
      cost:
      - type: scaled_gold
        value: -7
    - title_en: The Great Aqueduct Follows
      title_zh: 大渡槽相伴而建
      desc_en: A second line of stone rises alongside the causeway to Chapultepec, carrying fresh spring water across the lake in twin channels so one may be cleaned while the other flows. The city's wells no longer run brackish even in the driest month.
      desc_zh: 通往查普特佩克的堤道旁，第二道石构渡槽拔地而起，以双管引导清泉之水横渡湖面，一管清洗时另一管仍可通流。即便在最干旱的月份，城中井水也不再泛咸。
      cost:
      - type: scaled_gold
        value: -9
    - title_en: The Drawbridges Are Set
      title_zh: 吊桥安设就位
      desc_en: Wooden drawbridges are fitted at intervals along every causeway, so that in time of war the city's defenders may sever the roads and strand any army upon the open water. Engineers and warriors alike inspect each span before it is judged worthy of the Tlatoani's roads.
      desc_zh: 每条堤道沿线都装设了活动木吊桥，一旦战事来临，城中守军便可斩断道路，将任何来犯之敌困于水面之上。工匠与武士共同检验每一段桥面，方才准许其列入特拉托阿尼的道路之中。
      cost:
      - type: army_tradition
        value: -2
    - title_en: Tenochtitlan Is Bound to the Shore
      title_zh: 特诺奇蒂特兰与陆岸相连
      desc_en: The last stones of the Tepeyac causeway are set, and canoes and marching columns alike now cross freely between the island capital and the four corners of the valley. The Tlatoani proclaims the city forever bound to the mainland, its markets and armies flowing as the lake itself once did alone.
      desc_zh: 特佩亚克堤道的最后一批石料落定，独木舟与行军队列如今皆可自由往来于岛都与谷地四方之间。特拉托阿尼宣告，这座城市自此永远与陆地相连，其市场与军队的流转，恰如往昔唯有湖水独具的生机。
      cost:
      - type: scaled_gold
        value: -12
      - type: manpower
        value: -60
