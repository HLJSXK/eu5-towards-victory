      desc_en: Gathered chieftains and priests decree that a new circle of standing stones shall rise on Salisbury Plain, to mark the sun's turning for every tribe that gathers there.
      desc_zh: 聚集于此的酋长与祭司共同宣告，将在索尔兹伯里平原立起一座新的巨石圆阵，为每年前来的各部族标记太阳的转折。
      cost:
      - type: tribal_cohesion
        value: -8
    - title_en: The Sarsen Stones Are Chosen
      title_zh: 择选萨尔森巨石
      desc_en: Scouts range the downs to mark the largest sarsen boulders fit for the circle, testing each for the ring it gives when struck and the way it catches the low sun.
      desc_zh: 斥候踏遍丘陵，标记出适合圆阵所用的最大萨尔森巨石，逐一敲击试其回响，观察其在低垂日光下的姿态。
