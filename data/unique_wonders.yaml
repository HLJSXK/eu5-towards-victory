  location: venice
  image: tv_wonder_unique_venetian_arsenal
  prompt: The Venetian Arsenal in the Renaissance, enclosed naval shipyard with dry docks, ropewalks, foundries, galleys under construction, Bucentaur ceremony for the Marriage of the Sea, canals and brick walls, historically grounded world wonder key art, cinematic maritime view, ultra-detailed, no modern elements.
