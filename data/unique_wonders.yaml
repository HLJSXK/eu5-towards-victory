        value: 1
    - title_en: A Dome Is Rebuilt After the Frost
      title_zh: 严冬之后重建穹顶
      desc_en: A hard frost cracks one of the newly tiled domes before it can be finished, and craftsmen labor through the following spring to remake it before the cathedral's dedication.
      desc_zh: 一场严寒使一座尚未完工的穹顶瓦面开裂，工匠们在次年春天赶工重造，务求赶在座堂奉献之前完工。
