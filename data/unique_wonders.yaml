      title_zh: 钟楼高耸于回廊之上
      desc_en: A tall bell tower climbs above the finished cloisters, its bronze bells cast on site and blessed before they are ever hung, so their first sound will already be sacred.
      desc_zh: 一座高耸的钟楼在建成的回廊之上拔地而起，其青铜钟就地铸造，悬挂之前便已受过祝福，使其初响便已神圣。
