    - type: legitimacy
      value: 10
    stages:
    - title_en: The Crown Proclaims a New Seat
      title_zh: 王室宣告新宫敕令
      desc_en: The Habsburg court declares that the old hunting grounds outside Vienna shall bear a palace worthy of receiving every ambassador in Europe.
      desc_zh: 哈布斯堡宫廷宣布，维也纳城外那片旧日猎场将建起一座配得上接待全欧使节的宫殿。
      cost:
      - type: prestige
        value: -15
    - title_en: Fischer von Erlach Presents His Plans
      title_zh: 费舍尔·冯·埃拉赫呈上图纸
      desc_en: The court architect lays wide drawings before the empress, promising a facade of imperial yellow and gardens climbing toward a hilltop gloriette.
      desc_zh: 宫廷建筑师在女皇面前展开一幅幅图纸，许诺以帝王黄的外墙，以及一路攀向山顶凉亭的花园。
      cost:
      - type: cultural_influence
        value: -8
    - title_en: The Ground Is Cleared and Blessed
      title_zh: 地基清理与祝祷
      desc_en: Court clergy bless the building plots while surveyors stake out avenues and fountains across the old grounds, and the first stone is set aside as a foundation offering.
      desc_zh: 宫廷神职人员为建址祝圣，测量员在旧猎场上标出林荫道与喷泉的位置，第一块奠基石也被特意留出。
      cost:
      - type: devotion
        value: -10
    - title_en: The Palace Wings Break Ground
      title_zh: 宫翼动工
      desc_en: Masons and carpenters begin raising the first wings of the palace, and what had lived only in Fischer von Erlach's drawings finally rises as scaffolding along the Vienna road.
      desc_zh: 泥瓦匠与木匠开始搭建宫殿最初的几翼，曾经只存在于费舍尔·冯·埃拉赫图纸上的构想，如今终于化作维也纳大道旁的脚手架，工程正式动工。
      cost:
      - type: scaled_gold
        value: -6
    - title_en: The Facade Takes Its Imperial Yellow
      title_zh: 外墙披上帝王黄
      desc_en: Plasterers finish the long facade in the pale yellow that will one day be known across Europe simply as Schonbrunn yellow, framing window after window in white stone trim.
      desc_zh: 抹灰匠为长长的立面涂上日后闻名全欧的熊布朗黄，一扇扇窗户以白石线脚勾勒，愈发庄重。
      cost:
      - type: scaled_gold
        value: -8
    - title_en: The Gloriette Crowns the Hill
      title_zh: 凉亭加冕山巅
      desc_en: Workers raise the arched gloriette on the hill behind the palace, a folly meant to be seen from every window and to be the last thing a departing ambassador remembers.
      desc_zh: 工匠在宫后山丘上建起拱廊凉亭，这座点景之作意在从每扇窗户皆可望见，也让离去的使节将其作为最后的记忆。
      cost:
      - type: honor
        value: -15
    - title_en: The Formal Gardens Are Laid
      title_zh: 规整花园铺展
      desc_en: Gardeners cut precise parterres and avenues of trees down to the palace, so that visiting courts will judge the dynasty's order and taste before they ever reach the front doors.
      desc_zh: 园丁修剪出规整的花坛与林荫道，一路延伸至宫门，好让来访的各国使团在踏入正门之前，便已领教王朝的秩序与品位。
      cost:
      - type: cultural_influence
        value: -12
    - title_en: Schonbrunn Receives the Courts of Europe
      title_zh: 熊布朗迎来全欧宫廷
      desc_en: The palace stands complete in its gardens, and courtiers, diplomats, and monarchs now gather beneath its yellow facade, carrying the dynasty's prestige into every negotiation held under its roof.
      desc_zh: 宫殿与花园终告完工，廷臣、使节与君主如今齐聚在这片黄色立面之下，王朝的声望也随每一场在此举行的谈判传扬四方。
      cost:
      - type: prestige
        value: -45
      - type: legitimacy
        value: -15
