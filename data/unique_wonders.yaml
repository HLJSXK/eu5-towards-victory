      desc_en: Raja Raja Chola stands before his court and vows to raise a temple to Shiva greater than any built by his ancestors, its tower to be seen from leagues away. Ministers begin at once drafting the land grants that will fund it.
      desc_zh: 罗茶罗乍王于朝堂之上立誓，要为湿婆建一座超越先祖的庙宇，其塔身须远隔数里亦可望见。众臣即刻着手拟定供养此工程的土地敕令。
      cost:
      - type: devotion
        value: -12
    - title_en: The Site at Thanjavur Is Chosen
      title_zh: 坦贾武尔选址落定
      desc_en: Royal engineers walk the plain at Thanjavur, testing the ground where the great vimana will stand, while scribes begin the inscriptions recording every donation of land and gold. Priests bless the chosen ground with fire and ash.
      desc_zh: 王室工匠踏遍坦贾武尔平原，反复勘验将立起巨大维摩纳塔的地基，书记官随即开始刻录每一份捐赠土地与黄金的铭文。祭司以圣火与灰烬为这片土地祈福。
      cost:
      - type: artwork
        value: 1
    - title_en: Kunjaramallan Is Appointed Architect
      title_zh: 昆贾拉马兰受命为总工
      desc_en: The royal architect Kunjaramallan Rajaraja Perunthachan is named master of the works, and granite begins arriving by raft from quarries along the Kaveri. Laborers and sculptors are drawn from villages across the kingdom.
      desc_zh: 王室建筑师昆贾拉马兰·罗茶罗乍·佩伦塔干受命为总工，花岗岩石料随即由高韦里河沿岸采石场经木筏运抵。全国各地的村庄都征调来劳工与石匠。
      cost:
      - type: scaled_gold
        value: -6
    - title_en: The Vimana's Foundation Is Laid
      title_zh: 维摩纳塔基石奠立
      desc_en: The foundation stones for the great vimana are set into the earth, the true construction of the tower finally beginning after years of planning and gathering. Workers chant hymns to Shiva as each massive block settles into the ground.
      desc_zh: 巨塔维摩纳的基石正式嵌入大地，历经数年的筹划与备料，塔身真正的营造终于开始。每当一块巨石落定，工匠们便齐声吟诵献给湿婆的赞歌。
      cost:
      - type: devotion
        value: -18
    - title_en: The Tower Climbs Course by Course
      title_zh: 塔身层层攀高而起
      desc_en: The granite tower rises course by course toward its full height, ramps of packed earth built alongside it so that blocks can be hauled ever higher without cranes. Some say the ramp itself stretches for miles across the plain.
      desc_zh: 花岗岩塔身一层层向上垒砌，塔旁筑起夯土坡道，使巨石无需吊架亦可运至高处。有人说这条坡道竟横贯平原绵延数里之远。
      cost:
      - type: gold
        value: -70
    - title_en: The Nandi Pavilion Is Completed
      title_zh: 南迪殿堂竣工
      desc_en: A pavilion is completed to house the great bull Nandi facing the sanctum, its bronze lamps cast and hung by craftsmen brought specially from the coast. The temple courts begin filling with pilgrims eager to glimpse the rising tower.
      desc_zh: 面朝圣殿而建的南迪牛殿宣告竣工，专从沿海请来的匠人为其铸造并悬挂了青铜灯盏。庙院之内渐渐挤满渴望一睹高塔的香客。
      cost:
      - type: artwork
        value: 1
    - title_en: Dancers and Priests Rehearse the Rites
      title_zh: 舞者祭司演习祭仪
      desc_en: Temple dancers and priests rehearse the elaborate consecration rites in the shadow of the nearly finished tower, while inscriptions of the king's donations are carved into every available wall. The whole city grows restless with anticipation.
      desc_zh: 庙宇舞者与祭司在几近竣工的高塔阴影下反复演练繁复的祭典仪式，宫墙之上但凡有空处，皆刻满国王的供养铭文。全城上下皆已按捺不住期盼之情。
      cost:
      - type: cultural_tradition
        value: -8
    - title_en: The Kumbhabhishekam Is Performed
      title_zh: 库姆巴毗湿卡姆大典举行
      desc_en: Priests perform the kumbhabhishekam, pouring sanctified water over the temple's summit before the assembled court, dancers, and thousands of pilgrims. The Brihadishvara Temple's completion binds Shiva's blessing to the Chola crown for generations to come.
      desc_zh: 祭司举行库姆巴毗湿卡姆大典，在满朝文武、舞者与数以千计香客的注视下，将圣水浇灌于塔顶之上。布里哈迪希瓦拉神庙的落成，从此将湿婆的庇佑与朱罗王朝的国祚紧紧相连，绵延后世。
      cost:
      - type: artwork
        value: 1
      - type: devotion
        value: -28
