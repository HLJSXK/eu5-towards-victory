    stages:
    - title_en: The Pope Decrees a Secret Archive
      title_zh: 教皇敕建秘密档案库
      desc_en: The Pope proclaims that the Holy See's scattered registers, bulls, and correspondence shall be gathered into a single guarded archive within the Apostolic Palace, its contents to be shared with no crown without express leave. Cardinals are set to inventory what already exists.
      desc_zh: 教皇宣告，将把圣座散落各处的登记册、诏书及往来文书汇集于宗座宫内一座设防档案库中，未经明令许可，任何一国不得查阅其内容。众枢机随即着手清点现存文献。
      cost:
      - type: religious_influence
        value: -10
    - title_en: Cardinals Debate What May Be Kept
      title_zh: 枢机团商议去留
      desc_en: A commission of cardinals debates which records of diplomacy, inquisition, and canonization deserve a place in the new archive, and which may remain in the older scattered registries. Blessing is sought from the Pope himself before the first stone of the vault is cut.
      desc_zh: 枢机委员会商议外交、宗教裁判及封圣等各类记录中，何者当入新档案库、何者仍可留存旧有散置登记处。教皇亲自为地库首块奠基石祝圣，工程方得开凿。
      cost:
      - type: devotion
        value: -10
    - title_en: Scribes and Sealed Chests Arrive
      title_zh: 文书与密箱运抵
      desc_en: Scribes are engaged from across Italy to copy and catalogue the growing collection, while sealed chests of parchment are carried in procession from older Vatican registries under guard. Carpenters begin fitting the high shelves the vaults will require.
      desc_zh: 教廷自意大利各地延请文书誊抄编目日益增多的藏卷，密封羊皮卷箱亦在护卫下自梵蒂冈旧有登记处列队运入。木匠同时开始为地库安装所需的高架书橱。
      cost:
      - type: artwork
        value: 1
    - title_en: The Vault's Foundations Are Cut
      title_zh: 地库地基始凿
      desc_en: Masons cut the foundations of the archive's underground vaults beneath the palace, and the project passes from committee debate into stone corridors that will hold the Church's memory for centuries. Candlelit passages begin taking shape beneath the marble courtyards above.
      desc_zh: 石匠于宫殿之下开凿档案库地下拱室的地基，工程自此由委员会争论转为将容纳教会数百年记忆的石造回廊。烛光摇曳的通道，在上方大理石庭院之下渐渐成形。
      cost:
      - type: scaled_gold
        value: -6
    - title_en: High Shelves Fill With Manuscripts
      title_zh: 高架渐满典籍
      desc_en: Shelves rising to the vault's ceiling begin filling with bound manuscripts, and a system of numbered registers is devised so that any bull or letter may be found again within the hour. Guards are posted at the archive's single narrow door.
      desc_zh: 直抵拱顶的书架逐渐堆满装订成册的手稿，编号登记之法亦告确立，使任何一份诏书或书信皆可于一时辰内寻得。档案库唯一一道窄门前，亦已派驻卫兵值守。
      cost:
      - type: artwork
        value: 1
    - title_en: The Reading Rooms Are Vaulted
      title_zh: 阅览室穹顶告成
      desc_en: Vaulted reading rooms are completed above the deepest storage chambers, lit by careful shafts of daylight so that scholars admitted by papal leave may work without carrying open flame near the parchment. The first foreign envoys petition, mostly in vain, for a glimpse inside.
      desc_zh: 深处藏卷密室之上的拱顶阅览室竣工，巧妙引入天光照明，使经教皇特许入内的学者得以工作而无需在羊皮卷旁携带明火。首批外国使节亦纷纷请求一窥库中，然多遭婉拒。
      cost:
      - type: research_progress
        value: -12
    - title_en: The Corridors of Candlelit Marble
      title_zh: 烛照大理石长廊
      desc_en: The long marble corridors linking archive to palace are finished with their final candelabra and inlaid floors, giving the whole complex the hushed grandeur of a court within a court. Cardinals now walk its length discussing matters no crown's ambassador is permitted to hear.
      desc_zh: 连接档案库与宫殿的漫长大理石长廊竣工，装设最后的烛台与镶嵌地板，使整座建筑群透出宫中之宫般的静穆庄严。枢机们此时已可漫步其间，商议任何一国使节皆无缘听闻的机密要务。
      cost:
      - type: artwork
        value: 1
    - title_en: The Archive Is Sealed and Opened at Once
      title_zh: 档案库既封且启
      desc_en: The Pope consecrates the finished archive before the assembled College of Cardinals, sealing its deepest vaults even as its reading rooms formally open to scholars under papal license. From this day the accumulated memory of the Holy See sharpens the wisdom of its diplomats and quickens the learning of all who are granted entry.
      desc_zh: 教皇于枢机团面前为落成档案库举行祝圣大典，其最深处密室即刻封存，阅览室却同时正式对获教皇特许的学者开放。自此圣座积累之记忆，令其外交使节愈加睿智，亦使获准入内者的学问与日俱进。
      cost:
      - type: religious_influence
        value: -25
      - type: research_progress
        value: -20
