      desc_en: Curators unpack crates from Italy and the Netherlands, cataloguing canvases and cabinets of porcelain by hand. Court patrons quarrel gently over which masters deserve pride of place.
      desc_zh: 策展人打开来自意大利与尼德兰的箱子，逐一登记画作与瓷器柜。宫廷赞助人们为哪位大师应享首席之位而争论不休，语气却带着几分雅趣。
      cost:
