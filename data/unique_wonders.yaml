    stages:
    - title_en: The Golden Bull Names Frankfurt
      title_zh: 金玺诏书钦定法兰克福
      desc_en: Imperial decree fixes Frankfurt am Main as the place where the prince-electors must gather to choose the King of the Romans, and the city is ordered to build a hall worthy of the honor.
      desc_zh: 帝国敕令确立美因河畔法兰克福为选帝侯们推举罗马人民的国王之地，城中奉命建起一座配得上这份殊荣的议事厅。
      cost:
      - type: honor
        value: -12
    - title_en: The Roemer Square Is Cleared
      title_zh: 罗默广场腾出场地
      desc_en: Civic councilors clear space beside the Roemer for the new chamber, while envoys from each electorate send instructions on rank, seating, and precedence.
      desc_zh: 市议会在罗默厅旁清出空地以建新厅，各选帝侯领地的使者也纷纷送来关于座次、位阶与优先权的指示。
      cost:
      - type: government_power
        value: -10
    - title_en: Timber and Seals Are Gathered
      title_zh: 备料与文书的汇集
      desc_en: Carpenters select seasoned oak for the chamber's beams while clerks assemble the electors' seals and precedent books that will govern every future gathering.
      desc_zh: 木匠精选风干橡木用作厅梁，文书们则整理各选帝侯的印玺与先例文献，这些将左右日后每一次集会的规矩。
      cost:
      - type: legitimacy
        value: -12
    - title_en: The Chamber's Frame Rises
      title_zh: 议事厅的骨架立起
      desc_en: Timber framers raise the hall's first beams beside the Roemer, and what had been drawn on parchment finally stands as a skeleton of oak and stone over the square.
      desc_zh: 木匠在罗默厅旁架起大厅最初的几根横梁，羊皮纸上的图样终于化作广场之上一副橡木与石料的骨架，工程正式动工。
      cost:
      - type: scaled_gold
        value: -7
    - title_en: The Electors' Banners Are Hung
      title_zh: 选帝侯纹章高悬
      desc_en: Imperial banners and the arms of each electorate are hung along the chamber walls, fixing in wood and cloth the order of precedence that will govern every election held here.
      desc_zh: 帝国旗帜与各选帝侯领地的纹章悬挂厅壁，将日后每一场选举的位阶秩序，永久定格在木石与织物之间。
      cost:
      - type: honor
        value: -20
    - title_en: The Council Benches Are Set
      title_zh: 议席落定
      desc_en: Joiners finish the carved benches where prince-electors will sit in strict order, close enough to argue and formal enough that no elector may claim insult from his place.
      desc_zh: 细木匠完工雕花席位，供诸位选帝侯依严格次序就坐，彼此靠得足够近以便争辩，位次却也足够分明，谁都无从借座位而生怨怼。
      cost:
      - type: scaled_gold
        value: -9
    - title_en: The First Disputed Election
      title_zh: 首次角逐激烈的选举
      desc_en: Rival candidates and their agents crowd the unfinished chamber during its first contested vote, and the hall earns its reputation as a place where empires are made and broken by ballot.
      desc_zh: 未竟的大厅内，竞争的候选人与其说客在首场争议选举中挤满会场，这座厅堂也因此赢得以票决兴亡帝国之名。
      cost:
      - type: government_power
        value: -18
    - title_en: The Electoral Hall Is Sworn Complete
      title_zh: 选帝议事厅正式落成
      desc_en: The chamber stands finished beside the Roemer, its benches and banners in permanent order, and from this day every claim the realm makes to legitimate rule carries the weight of Frankfurt's electors behind it.
      desc_zh: 议事厅在罗默广场旁落成，席位与旗帜秩序永固，自此日起，国家对统治合法性的每一次主张，都将承载法兰克福选帝侯们的分量。
      cost:
      - type: legitimacy
        value: -30
      - type: prestige
        value: -30
