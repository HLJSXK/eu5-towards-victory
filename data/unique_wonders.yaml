      title_zh: 宣礼塔高耸屋顶之上
      desc_en: Mosque minarets climb above the tower houses, their call to prayer carrying over a quarter now busy from dawn markets to evening trade.
      desc_zh: 清真寺的宣礼塔在塔楼之间拔地而起，唤拜声传遍这片从晨市到夜集都热闹不息的城区。
