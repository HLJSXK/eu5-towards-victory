      value: 4
    - type: prestige
      value: 10
    stages:
    - title_en: The Fugger Charter Is Sealed
      title_zh: 富格尔特许状用印
      desc_en: A charter is sealed granting the merchant house leave to found a banking hall in Augsburg, promising credit to princes and profit to the house that dares extend it.
      desc_zh: 一份特许状用印生效，准许这家商号在奥格斯堡设立银行会所，许诺向王公放贷生息，也让敢于承担此险的商号获利丰厚。
      cost:
      - type: gold
        value: -40
    - title_en: The Counting Quarter Is Secured
      title_zh: 银行街区落定
      desc_en: Agents secure a plot in the merchant quarter near the city's trade streets, close enough to the guildhalls that couriers can reach every ledger within the hour.
      desc_zh: 代理人在贸易街附近的商人区购得一块地皮，紧邻各行会会所，信使一个时辰之内便能送达每一份账册。
      cost:
      - type: scaled_gold
        value: -5
    - title_en: Ledgers and Reserves Are Gathered
      title_zh: 账册与储备的汇集
      desc_en: Clerks assemble the house's opening ledgers and coin reserves, while correspondents in distant cities are instructed to begin routing letters of credit toward Augsburg.
      desc_zh: 文书们整理银行开业所需的账册与现银储备，各地的通信代理人也奉命开始将信用票据陆续汇往奥格斯堡。
      cost:
      - type: gold
        value: -70
    - title_en: The Counting House Breaks Ground
      title_zh: 钱庄动工
      desc_en: Masons lay the first stones of the Renaissance counting house, and the charter's promises finally become walls and a strongroom rising on the merchant street.
      desc_zh: 匠人在贸易街上为这座文艺复兴风格的钱庄砌下第一块石料，特许状上的承诺终于化作墙垣与库房，工程正式动工。
      cost:
      - type: scaled_gold
        value: -7
    - title_en: The Vaults Are Sealed
      title_zh: 库房加锁封存
      desc_en: Ironbound vaults are set into the counting house's foundations, guarded day and night, ready to hold coin chests that princes and cities alike will come to depend upon.
      desc_zh: 包铁库房嵌入钱庄地基之中，日夜有人看守，只待存放那些日后连王公与城邦都要倚仗的钱箱。
      cost:
      - type: scaled_gold
        value: -9
    - title_en: The Courier Network Spreads
      title_zh: 信使网络铺展四方
      desc_en: Riders and agents are dispatched to open correspondent offices in distant trade cities, weaving a network of credit that can move money faster than any wagon of coin.
      desc_zh: 骑差与代理人被派往远方贸易城市设立通信分号，织就一张信贷网络，其调度资金之速远胜任何一车现银。
      cost:
      - type: yearly_gold
        value: -10
    - title_en: The Imperial Loan Contracts Are Signed
      title_zh: 帝国借贷契约签订
      desc_en: Emperors and princes sign loan contracts in the counting room's back chambers, mortgaging future revenues against the house's ready gold.
      desc_zh: 皇帝与王公在钱庄后堂签下借贷契约，以未来的税收抵押，换取银行现成的黄金。
      cost:
      - type: gold
        value: -130
    - title_en: The Banking House Opens in Full
      title_zh: 钱庄正式全面开业
      desc_en: The counting house stands complete on Augsburg's trade street, its vaults full and its couriers riding to every corner of the realm's commerce, and from this day the crown's own coffers move a little more smoothly for it.
      desc_zh: 钱庄在奥格斯堡贸易街上落成，库房盈满，信使奔走于国家商贸的每一个角落，自此日起，王室的钱库也因此运转得更加顺畅。
      cost:
      - type: yearly_gold
        value: -20
      - type: gold
        value: -150
