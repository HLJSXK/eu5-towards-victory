    stages:
    - title_en: The Emperor Decrees the Water Road
      title_zh: 皇帝颁诏兴修水道
      desc_en: An imperial edict calls for the canal binding north and south to be widened and restored, so that Jiangnan's rice may reach the capital without the sea's dangers. A canal commissioner is named and given seal and treasury to begin.
      desc_zh: 一道圣旨传下，命拓宽整修沟通南北的运河，使江南稻米无须涉险海路便能直达京师。朝廷任命一位河道总督，授印赐库，即刻筹办。
      cost:
      - type: government_power
        value: -15
    - title_en: Provinces Send Their Hands
      title_zh: 各省征发民夫
      desc_en: Corvee labor rosters arrive from a dozen prefectures, and surveyors walk the old towpaths marking where silted stretches must be redug. Officials requisition timber, rope, and draft oxen from every river town along the route.
      desc_zh: 十几个府县送来徭役名册，测量官沿旧纤道勘察，标出需要重新疏浚的淤塞河段。沿线各水乡官府征调木材、绳索与耕牛。
      cost:
      - type: manpower
        value: -30
    - title_en: The River Gods Are Asked to Bless the Work
      title_zh: 祭河神以求工程顺遂
      desc_en: Priests set offerings at the river shrines where the new locks will stand, and engineers finalize plans for the sluice gates that will lift barges between levels. The first granaries are sited at the junctions where grain must be transferred.
      desc_zh: 祭司在新船闸预定处的河神庙前设下供品，工匠也最终定下用以升降漕船的闸门方案。首批粮仓选址于须换船转运的河道交汇处。
      cost:
      - type: devotion
        value: -10
    - title_en: Spades Break the Old Riverbed
      title_zh: 铁锹凿开旧河床
      desc_en: At a chosen lock site south of the Huai, laborers finally cut into the silted channel, and the dredging that will reshape hundreds of li of waterway begins in earnest. Mud and old timbers are hauled from the bed for the first time in a generation.
      desc_zh: 在淮河以南选定的一处闸址，劳工终于挖入淤积多年的河床，重塑数百里水道的疏浚工程正式展开。多年未见天日的淤泥与朽木被首次挖出河道。
      cost:
      - type: scaled_gold
        value: -6
    - title_en: Locks Rise Along the Water Road
      title_zh: 船闸沿河道竖立
      desc_en: Stone-faced lock chambers take shape one after another, each gate tested by flooding it and watching the barges rise. Engineers argue over gate timing late into the night as the first sluices come into operation.
      desc_zh: 一座座石砌闸室相继建成，每道闸门都以放水试闸，观察漕船随水位升起。工程官员为闸门启闭的时序争论至深夜，首批水闸陆续投入使用。
      cost:
      - type: scaled_gold
        value: -8
    - title_en: Granaries and Towpaths Take Shape
      title_zh: 粮仓与纤道渐成规模
      desc_en: Long towpaths are packed and faced with stone where the water is swiftest, and tiered granaries rise at the transfer points, their tiled roofs already stacked with the season's first tribute rice. Draft crews and boat trackers settle into the rhythm of the new route.
      desc_zh: 水流湍急处的纤道以石料铺筑加固，转运节点的层楼粮仓相继建成，瓦顶之下已堆满当季首批漕粮。纤夫与船工渐渐适应了新航道的节律。
      cost:
      - type: gold
        value: -70
    - title_en: Bridges Span the Living Water
      title_zh: 长桥飞架活水之上
      desc_en: Arched bridges rise over the canal in the water towns of Jiangnan, and a trial convoy of grain barges is sent through the full length of locks to test the finished works. Merchants along the banks begin building new wharves before the canal is even declared complete.
      desc_zh: 江南水乡的运河上，一座座拱桥相继建成，一支试运的漕船队沿全线船闸驶过，检验竣工的工程。运河尚未正式竣工，两岸商人已抢先修建新码头。
      cost:
      - type: scaled_gold
        value: -9
    - title_en: The First Tribute Convoy Sails North
      title_zh: 首支漕船队北上
      desc_en: Officials gather at the southern locks to launch the first full tribute grain convoy of the restored canal, drums sounding as the barges pass gate after gate toward the capital. The Grand Canal now binds the empire's rice basket to its throne, its waters carrying grain and goods the length of the realm.
      desc_zh: 官员齐聚南端船闸，为修复后的运河送出首支完整的漕粮船队，鼓声阵阵伴随漕船一道道闸门驶向京师。大运河自此将帝国的鱼米之乡与朝廷紧密相连，漕粮货物由此贯通全境。
      cost:
      - type: gold
        value: -110
      - type: honor
        value: -20
