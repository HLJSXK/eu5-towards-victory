  ceremony:
    stage_1_reward:
    - type: devotion
      value: 25
    - type: religious_influence
      value: 12
    - type: honor
      value: 10
    stages:
    - title_en: The Vision of the Only-Begotten
      title_zh: 圣子降临的异象
      desc_en: Gregory the Illuminator reports a vision of Christ striking the earth with a golden hammer at Vagharshapat, and the king proclaims that a church shall rise where the light fell.
      desc_zh: 启蒙者格里高利称在瓦加尔沙帕特得见异象，基督以金锤击地，国王遂颁旨，命于圣光降临之处建起一座教堂。
      cost:
      - type: devotion
        value: -10
    - title_en: Tiridates Grants the Ground
      title_zh: 梯里达底赐地
      desc_en: King Tiridates III, newly converted, sets aside the royal grounds at Vagharshapat and summons masons from across Armenia to prepare the site.
      desc_zh: 新近皈依的国王梯里达底三世将瓦加尔沙帕特的王室用地划出，并召集亚美尼亚各地的石匠前来备料。
      cost:
      - type: religious_influence
        value: -8
    - title_en: The Blessing of the Stones
      title_zh: 基石的祝祷
      desc_en: Priests bless the foundation stones and the first timbers cut from the highland forests, while pilgrims already begin gathering to watch the holy work take shape.
      desc_zh: 祭司为奠基石与高地林中初伐的木料祝圣，朝圣者已开始聚集，只为亲眼看着这项圣工渐渐成形。
      cost:
      - type: gold
        value: -50
    - title_en: The First Walls Rise
      title_zh: 初墙立起
      desc_en: Stonemasons set the first course of the cruciform church at Vagharshapat, and what had been prayer and royal decree finally becomes mortar and stone underfoot.
      desc_zh: 石匠在瓦加尔沙帕特为这座十字形教堂砌下第一层墙，祷告与王命终于化作脚下的灰泥与石块，这才算真正动工。
      cost:
      - type: artwork
        value: 1
    - title_en: The Carving of the Khachkars
      title_zh: 十字石的雕琢
      desc_en: Armenian carvers cut intricate cross-stones for the courtyard walls, each khachkar a prayer frozen in basalt and each one a little slower than the mason before it.
      desc_zh: 亚美尼亚匠人为庭院墙面雕刻精美的十字石，每一块凯何阿尔都是凝固在玄武岩中的祷词，工序也一块比一块更费心力。
      cost:
      - type: devotion
        value: -15
    - title_en: The Bell Tower Ascends
      title_zh: 钟楼拔地而起
      desc_en: A tower rises above the nave to carry bells across the Ararat plain, and the monastery's outer walls close around a growing community of monks.
      desc_zh: 一座钟楼在中殿之上升起，钟声将传遍阿拉拉特平原，修道院外墙也渐渐围起愈发壮大的僧侣团体。
      cost:
      - type: religious_influence
        value: -12
    - title_en: The Catholicos Takes His Seat
      title_zh: 大公驻锡于此
      desc_en: The highland church names Etchmiadzin the seat of its Catholicos, and clergy from distant provinces travel the pilgrim roads to see the mother church of Armenia.
      desc_zh: 高地教会宣布埃奇米阿津为大公驻地，各省神职人员沿朝圣古道跋涉而来，只为一睹亚美尼亚母教堂的风采。
      cost:
      - type: artwork
        value: 1
    - title_en: Etchmiadzin Is Consecrated
      title_zh: 埃奇米阿津受祝圣
      desc_en: Under the shadow of Ararat, the cathedral is consecrated as the spiritual heart of the Armenian church, and from this day its clergy and its faithful draw strength that the whole realm can feel.
      desc_zh: 在阿拉拉特山的注视下，大教堂被祝圣为亚美尼亚教会的精神中枢，自此日起，神职与信众所汲取的力量，举国上下都能感受得到。
      cost:
      - type: devotion
        value: -25
