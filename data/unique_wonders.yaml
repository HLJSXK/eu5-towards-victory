    - title_en: The Toron Beams Are Set
      title_zh: 托罗恩木梁安装完成
      desc_en: Rows of timber toron beams are driven into the drying walls, both to reinforce the structure and to serve as permanent scaffolding for the yearly replastering to come. Students gather beneath the arcades even before the final coat of mud dries.
      desc_zh: 一排排托罗恩木梁被打入尚未干透的墙体，既加固结构，又充作日后每年重新抹泥时的固定脚手架。最后一层泥浆尚未干透，学生们便已聚集在拱廊之下。
      cost:
      - type: research_progress
        value: -6
    - title_en: The Libraries Fill with Manuscripts
      title_zh: 图书馆藏书渐丰
      desc_en: Private libraries across the quarter swell with manuscripts on law, astronomy, and theology, copied by hand and traded alongside salt and gold in the markets below. Scholars begin cataloguing what will become one of the Sahel's great collections.
      desc_zh: 街区内的私人藏书渐渐充实，法律、天文与神学的手抄本，如同盐与黄金一般在楼下市场流通交易。学者们开始为这批日后成为萨赫勒地区重要藏书的手稿编目。
      cost:
      - type: artwork
        value: 1
    - title_en: The Teaching Circles Multiply
      title_zh: 讲学圈层层扩展
      desc_en: Teaching circles multiply across the courtyards as masters take on students in law, grammar, and the Quranic sciences, each circle marked by its own carpet and reading stand. Caravans now detour through Timbuktu just to hear the debates.
      desc_zh: 各庭院中的讲学圈不断增多，教师们分别讲授法学、语法与古兰经学，每个学圈都以各自的地毯与读经架为标志。如今商队甚至特意绕道廷巴克图，只为听一场辩论。
      cost:
      - type: research_progress
        value: -12
    - title_en: Sankore Is Inaugurated Among the Great Schools
      title_zh: 桑科雷跻身学术殿堂之列
      desc_en: The university is formally inaugurated as scholars, students, and caravan traders alike fill its courtyards, its manuscripts and teaching circles now a lasting beacon of learning on the edge of the Sahara. Word of Timbuktu's scholarship travels with every caravan, lifting the realm's standing wherever books are prized.
      desc_zh: 大学正式落成揭幕，学者、学生与商队商贾齐聚庭院，其手抄本与讲学圈自此成为撒哈拉边缘一座恒久的学术灯塔。廷巴克图的学术声名随每一支商队远播四方，凡是重视典籍之地，举国声望皆因此而提升。
      cost:
      - type: artwork
        value: 1
      - type: cultural_influence
        value: -15
- id: 222
  key: unique_great_mosque_of_djenne
  base_key: giant_tower_temple
