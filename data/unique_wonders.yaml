    - title_en: Poets and Scribes Are Summoned to Court
      title_zh: 诗人书吏先行入宫
      desc_en: Court poets and calligraphers are summoned to plan verses for the walls before a single stone is set, and surveyors mark out the fortress line along the ridge.
      desc_zh: 宫廷诗人与书法家在第一块砖石落地前便已受召，着手为未来的宫墙拟定铭文，测量师则沿山脊标出城垣的走线。
