    stages:
    - title_en: The Priests Name the Place of the Gods
      title_zh: 祭司昭告众神之所
      desc_en: The city's priests declare the valley beneath the twin peaks a place where gods once gathered to remake the world, and call for a sacred avenue and pyramids to mark where that fire first burned. Word is sent to allied lineages across the highlands to send builders and tribute.
      desc_zh: 城中祭司宣布，双峰之下的这片谷地正是众神当年聚首、重塑世界之所在，遂号召修建一条圣道与金字塔，以铭记那团圣火最初燃起之地。消息传至高原各盟邦血脉，召集工匠与贡赋。
      cost:
      - type: devotion
        value: -15
    - title_en: The Avenue of the Dead Is Traced
      title_zh: 亡灵大道勘定
      desc_en: Surveyors lay a long straight line across the valley floor, aligning it with the rising of the sun on the day the calendar names sacred, and mark where the great platforms will flank its length. Quarrying begins on the volcanic stone that will face the pyramids.
      desc_zh: 测量者在谷地上勘定一条笔直长线，使其对准历法所定圣日的日出方向，并标出这条大道两侧未来平台的位置。用以包覆金字塔的火山岩开始被开采。
      cost:
      - type: scaled_gold
        value: -5
    - title_en: Offerings Are Buried Beneath the Ground
      title_zh: 祭品埋入地下
      desc_en: Priests bury caches of greenstone, obsidian blades, and the bones of sacrificed creatures beneath the marked foundations, consecrating the earth before a single course of stone is laid. Lineage heads from the city's quarters pledge labor gangs to the work.
      desc_zh: 祭司将绿石、黑曜石刃与祭牲骨骸埋入已标出的地基之下，在第一层石块铺设之前先将大地奉献神圣。城中各坊的宗族首领承诺派出劳工队伍投入工程。
      cost:
      - type: artwork
        value: 1
    - title_en: Stone Begins to Climb Toward the Sun
      title_zh: 石阶开始向太阳攀升
      desc_en: Laborers finally raise the first true tiers of the Pyramid of the Sun above its buried offerings, adobe brick and rubble core packed and faced with cut stone under the highland light. What was marked ground now rises as a mountain built by hands.
      desc_zh: 劳工终于在埋藏祭品之上垒起太阳金字塔最初的几层台阶，泥砖与碎石填芯外覆切割石料，在高原阳光下渐渐成形。曾经只是标记的地面，如今隆起为一座人手所筑的山峦。
      cost:
      - type: manpower
        value: -35
    - title_en: The Pyramid of the Moon Rises to Match
      title_zh: 月亮金字塔相映而起
      desc_en: At the avenue's northern end the Pyramid of the Moon grows tier by tier to frame the sacred peak behind it, its builders adjusting each stage's height so the whole silhouette reads true from the avenue below. Painters begin the first murals along the platform walls.
      desc_zh: 大道北端的月亮金字塔也一层层增高，其形制经过精心调整，好让身后的圣山轮廓与建筑剪影恰好呼应。工匠开始在平台壁面绘制最初的壁画。
      cost:
      - type: cultural_influence
        value: -8
    - title_en: Painted Compounds Fill the City's Blocks
      title_zh: 彩绘院落布满城坊
      desc_en: Multi-family apartment compounds rise in orderly blocks along the avenue's flanks, their courtyard walls painted in the city's signature red and covered with feathered serpents and jaguars. Craft quarters begin producing obsidian tools and Thin Orange pottery for trade across the highlands.
      desc_zh: 沿大道两侧，多户合住的院落建筑群规整地排列成坊，庭院墙壁涂以这座城市标志性的红色，绘满羽蛇与美洲豹图案。手工业坊开始生产黑曜石工具与薄橙陶器，供高原各地交易。
      cost:
      - type: scaled_gold
        value: -8
    - title_en: The Feathered Serpent Temple Is Adorned
      title_zh: 羽蛇神庙饰以雕像
      desc_en: Sculptors set row upon row of carved serpent and storm-god heads into the temple facade rising along the avenue's southern reach, their stone eyes once inlaid with obsidian and shell. Processions already walk the finished stretches of the avenue ahead of the temple's completion.
      desc_zh: 雕刻师将一排排羽蛇与雨神头像镶入沿大道南段兴建的神庙立面，石雕双眼曾嵌有黑曜石与贝壳。神庙尚未竣工，队伍已沿已完工的大道路段举行游行。
      cost:
      - type: artwork
        value: 1
    - title_en: Fire Is Lit Atop the Sacred Mountain
      title_zh: 圣火燃于山巅
      desc_en: Priests climb to the summit of the Pyramid of the Sun to kindle the New Fire above the whole finished avenue, smoke rising to answer the peaks that watch over the valley. Teotihuacan now stands complete as a sacred city whose influence and rites will radiate across the highlands for generations.
      desc_zh: 祭司登上太阳金字塔之巅，在竣工的整条大道之上点燃新火，青烟升起，与俯瞰谷地的群峰遥相呼应。特奥蒂瓦坎自此以一座圣城的姿态屹立，其影响与祭仪将向高原各地辐射数代之久。
      cost:
      - type: devotion
        value: -28
      - type: artwork
        value: 1
