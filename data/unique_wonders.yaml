    - title_en: The Order to Crown the Ridge
      title_zh: 定都山脊的敕令
      desc_en: The court proclaims that the ridge above the Kura shall bear an unbreakable fortress, and word of the coming works spreads through Tbilisi's markets and monasteries alike.
      desc_zh: 朝廷颁旨，命于库拉河畔的山脊上筑起一座不可摧毁的堡垒，消息很快传遍第比利斯的市集与修道院。
      cost:
      - type: honor
        value: -8
    - title_en: Surveying the Shuris Tsikhe
      title_zh: 勘测希里斯齐赫
      desc_en: Engineers and old garrison veterans climb the ridge to mark out walls and towers, tracing lines meant to make the position, in the old tongue, invincible.
      desc_zh: 工程师与戍守老兵登上山脊，划定城墙与塔楼的走向，按古语之意，要让此地成为真正的不可攻破之城。
      cost:
      - type: prestige
        value: -10
    - title_en: Levies and Stone from the Hills
      title_zh: 山民的劳役与石料
      desc_en: Conscripted laborers and quarrymen from the surrounding hills haul cut stone up switchback paths, while officers muster the first companies who will one day hold these walls.
      desc_zh: 从周边山地征发的劳工与采石匠沿着之字形山道将凿好的石块运上山，军官们同时开始集结日后将守卫此墙的第一批士卒。
      cost:
      - type: manpower
        value: -60
    - title_en: The Walls Take Shape Above Tbilisi
      title_zh: 城墙在第比利斯上空成形
      desc_en: The first courses of the curtain wall rise along the ridgeline, and what was once staked rope and chalk marks becomes stone standing over the roofs of Tbilisi.
      desc_zh: 城垣沿山脊线砌起第一层石阶，曾经只是绳线与粉笔标记的图纸，如今终于化作矗立在第比利斯屋顶之上的实石，工程正式动工。
      cost:
      - type: army_tradition
        value: -2
    - title_en: The Watchtowers Climb Higher
      title_zh: 望楼节节升高
      desc_en: Round towers rise at each turn of the wall, giving sentries a clear line down the Kura valley and along every approach a besieger might choose.
      desc_zh: 圆塔在城墙每个转角拔地而起，哨兵得以俯瞰整条库拉河谷，将敌军可能选择的每条进路尽收眼底。
      cost:
      - type: prestige
        value: -15
    - title_en: Trial by Siege
      title_zh: 围城的考验
      desc_en: An enemy army tests the unfinished ramparts, and though breaches are made and repaired, the garrison learns which stretches of wall hold and which must be rebuilt stronger.
      desc_zh: 敌军对未竟的壁垒发起试探性进攻，虽有几处被攻破又重新修复，守军也借此明白哪段城墙经得住考验，哪段还需加固重建。
      cost:
      - type: army_tradition
        value: -3
    - title_en: The Beacon Fires Are Lit
      title_zh: 烽火台点燃
      desc_en: A chain of watchfires is set along the ramparts and outposts beyond, so that any approach toward Tbilisi can be signaled long before the enemy reaches the Kura.
      desc_zh: 城垣与外围哨所之间点起一串烽火，只要有敌情逼近第比利斯，远在敌军抵达库拉河之前便能发出警讯。
      cost:
      - type: manpower
        value: -90
    - title_en: Narikala Stands Invincible
      title_zh: 纳里卡拉屹立不摧
      desc_en: The fortress crowns the ridge complete, its garrison drilled and its walls proven by siege, and from this day every garrison in the realm holds a little steadier for what was learned above Tbilisi.
      desc_zh: 堡垒竣工，雄踞山脊之上，守军操练有素，城墙也在围城中证明了自身，自此日起，全国各处的驻军都因第比利斯城头所学而更加稳固。
      cost:
      - type: honor
        value: -20
      - type: manpower
        value: -120
