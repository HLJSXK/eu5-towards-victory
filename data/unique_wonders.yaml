    stages:
    - title_en: The Chancellor's Decree for a New City
      title_zh: 大执政官的建城敕令
      desc_en: Grand Chancellor Jan Zamoyski proclaims his design for an ideal city where his family seat once stood, a settlement built on reason rather than accident. Surveyors and Italian architects are summoned to Zamość to give the vision its first lines on parchment.
      desc_zh: 大执政官扬·扎莫厄斯基宣布在祖传领地上建造一座理想之城的宏愿——一座依据理性而非偶然规划的城池。测量师与意大利建筑师应召赶赴扎莫希奇，将这一构想绘成最初的图纸。
      cost:
      - type: gold
        value: -50
    - title_en: Bernardo Morando Draws the Grid
      title_zh: 贝尔纳多·莫兰多绘制城市网格
      desc_en: Architect Bernardo Morando surveys the low hills between the Łabuńka and Topornica streams, marking out the pentagonal outline of streets, market square, and future bastions with cord and stake. Local nobles are pressed to cede land and timber for the surveyors' camp.
      desc_zh: 建筑师贝尔纳多·莫兰多在瓦本卡河与托波尔尼察河之间的丘陵地带展开测量，用绳索与木桩标出街道、市场广场与未来棱堡的五边形轮廓。当地贵族被要求让出土地与木材，供测量队扎营使用。
      cost:
      - type: scaled_gold
        value: -4
    - title_en: Masons and Merchants Take the Oath
      title_zh: 石匠与商贾的誓言
      desc_en: Guild masons, brought from Italy and Poland alike, swear before Zamoyski's stewards to build to the plan without deviation, while merchant families are enticed with tax privileges to settle the still-empty streets. The first foundation trenches are cut into the black earth.
      desc_zh: 来自意大利与波兰各地的行会石匠在扎莫厄斯基管家面前宣誓，绝不擅自更改图纸；商贾家族则以免税特权为诱，迁入这座尚是空地的街巷。第一道基槽被切入黑土之中。
      cost:
      - type: gold
        value: -65
    - title_en: The Great Market Square Rises
      title_zh: 大市场广场拔地而起
      desc_en: Stone by stone, the arcaded facades of the Great Market Square begin to climb around its open plaza, the true construction of the ideal city finally underway rather than merely drawn. Wagons of Carpathian sandstone and Italian craftsmen's tools rattle daily through the unfinished gates.
      desc_zh: 石块一层层垒起，大市场广场四周的拱廊立面开始拔地而起——理想之城终于从图纸走向真正的营造。满载喀尔巴阡砂岩与意大利工匠工具的马车，每日穿行于尚未完工的城门。
      cost:
      - type: scaled_gold
        value: -6
    - title_en: Foundations for the Zamość Academy
      title_zh: 扎莫希奇学院奠基
      desc_en: Beyond the market, scholars and Jesuit-trained masters lay the cornerstone of the Zamość Academy, envisioned as a school to rival Kraków and Padua. Students from across the Commonwealth begin arriving even as the lecture halls stand roofless.
      desc_zh: 市场之外，学者与耶稣会培养的教师们为扎莫希奇学院奠下基石，志在建成一所可与克拉科夫、帕多瓦比肩的学府。尽管讲堂尚未封顶，来自联邦各地的学生已陆续抵达。
      cost:
      - type: research_progress
        value: -12
    - title_en: The Bastions Close the Perimeter
      title_zh: 棱堡合围全城
      desc_en: Engineers trace seven angular bastions in the modern Italian style around the city's edge, their earthen ramparts faced with brick to withstand Tatar raids and Cossack incursions alike. The city begins to look less like a market town and more like a fortress that happens to trade.
      desc_zh: 工程师们按照意大利式的最新样式，沿城市边缘修筑七座棱角分明的棱堡，土墙外包以砖石，以抵御鞑靼与哥萨克的袭扰。这座城市渐渐不再像单纯的集市小镇，倒像是一座顺带经商的要塞。
      cost:
      - type: government_power
        value: -10
    - title_en: Armenian and Greek Merchants Adorn Their Houses
      title_zh: 亚美尼亚与希腊商人的宅邸装饰
      desc_en: Armenian, Greek, and Italian merchant families, drawn by Zamoyski's trading privileges, paint and stucco their arcaded townhouses along the square in a riot of color and coats of arms. The Rynek Wielki takes on the cosmopolitan face it will keep for centuries.
      desc_zh: 受扎莫厄斯基贸易特权吸引而来的亚美尼亚、希腊与意大利商人家族，纷纷为广场沿线的拱廊宅邸粉刷灰泥、绘饰纹章，色彩斑斓、争奇斗艳。大市场广场由此形成日后延续数百年的多元面貌。
      cost:
      - type: cultural_influence
        value: -8
    - title_en: Zamość Stands as the Padua of the North
      title_zh: 扎莫希奇成为北方的帕多瓦
      desc_en: Bells ring across the finished square as Zamoyski consecrates his ideal city, its academy, arcades, and bastions complete at last. From this day the model city's disciplined streets and busy workshops quicken every builder's hand across the realm.
      desc_zh: 竣工的广场上钟声齐鸣，扎莫厄斯基为这座理想之城举行落成典礼——学院、拱廊与棱堡终告完工。自此日起，这座模范之城严整的街巷与繁忙的作坊，让全国工匠的双手都更添几分效率。
      cost:
      - type: scaled_gold
        value: -12
