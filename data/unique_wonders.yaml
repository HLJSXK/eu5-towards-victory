  ceremony:
    stage_1_reward:
    - type: gold
      value: 100
    - type: cultural_influence
      value: 10
    - type: yearly_gold
      value: 3
    stages:
    - title_en: The Sultan Proclaims the Entrepot
      title_zh: 苏丹颁布港埠敕令
      desc_en: The Sultan of Malacca summons the harbor chiefs, the shahbandars of each merchant nation, and declares the port shall be widened to receive every fleet the monsoon brings. Gongs sound along the waterfront as the decree is read in four tongues.
      desc_zh: 马六甲苏丹召集港务官与各商团的沙班达尔，宣布港口将扩建以迎接季风带来的每一支船队。锣声在海滨回荡，敕令以四种语言宣读。
      cost:
      - type: gold
        value: -35
    - title_en: The Shahbandars Confer
      title_zh: 沙班达尔的商议
      desc_en: Representatives of the Gujarati, Chinese, Javanese, and Arab quarters gather beneath the palace stilts to divide the labor of dredging channels and laying new quays. Each community pledges timber, coin, or craftsmen according to its custom.
      desc_zh: 古吉拉特、华人、爪哇与阿拉伯商馆的代表齐聚宫殿高脚屋下，商定疏浚航道与铺设新码头的分工。各社群依照本族惯例，认捐木材、钱财或工匠。
      cost:
      - type: cultural_influence
        value: -6
    - title_en: The Site Is Cleared for the Monsoon
      title_zh: 季风前的清场
      desc_en: Mangrove roots are pulled from the mudflats and the tides are read by old pilots to mark where the new warehouses must stand clear of the surge. Buddhist, Muslim, and animist rites are all performed over the cleared ground, each in its own quarter.
      desc_zh: 潮滩上的红树根被连根拔起，年迈的领航员依潮汐推算新仓库须避开涌潮的位置。佛教、伊斯兰与万物有灵的仪式分别在各自区域的清空之地举行。
      cost:
      - type: scaled_gold
        value: -5
    - title_en: The Piles Are Driven
      title_zh: 桩木深植入海
      desc_en: Hardwood piles are hammered into the strait's soft floor and the first stone foundations of the great warehouse row rise above the tideline. What was council and custom now becomes timber, stone, and sweat along the shore.
      desc_zh: 硬木桩被夯入海峡松软的海床，大仓库群的第一批石基已高出潮线。此前的商议与礼仪，如今化作岸边的木石与汗水。
      cost:
      - type: gold
        value: -55
    - title_en: The Godowns Rise in Rows
      title_zh: 货栈成排林立
      desc_en: 'Warehouse after warehouse takes shape along the river mouth, each marked with the sigil of the nation that filled it: cloves and nutmeg, Coromandel cloth, Chinese porcelain, Gujarati indigo. Porters chant in half a dozen languages as the rows lengthen.'
      desc_zh: 河口一座座货栈拔地而起，每座都刻上填充其中之国的标记：丁香与肉豆蔻、科罗曼德尔棉布、中国瓷器、古吉拉特靛蓝。搬运工用六七种语言喊着号子，货栈的行列不断延伸。
      cost:
      - type: scaled_gold
        value: -8
    - title_en: The Deep Channel Is Cut
      title_zh: 深水航道贯通
      desc_en: Divers and dredgers widen the strait's approach so that even the largest Chinese junks and Indian dhows may ride at anchor without grounding. The harbor master boasts that no tide now turns a ship away.
      desc_zh: 潜水者与疏浚工拓宽海峡入口，即便是最庞大的中国帆船与印度独桅三角帆船也能安然下锚而不搁浅。港务长夸口，如今再无潮汐会让船只折返。
      cost:
      - type: gold
        value: -65
    - title_en: The Weighing House Is Built
      title_zh: 司秤所落成
      desc_en: A great scale-house rises where every cargo is weighed, taxed, and recorded under the Sultan's seal, its ledgers kept in Malay, Tamil, and Chinese script side by side. Merchants from a dozen coasts learn that Malacca's word on a contract is as good as any king's.
      desc_zh: 一座巨大的司秤所建成，所有货物在此过秤、征税并加盖苏丹印记备案，账册以马来文、泰米尔文与汉字并列记录。来自十几处海岸的商人渐渐明白，马六甲的契约之言，与任何君王的承诺同样可靠。
      cost:
      - type: scaled_gold
        value: -10
    - title_en: The Covenant of the Straits Is Sealed
      title_zh: 海峡盟约缔结
      desc_en: The Sultan and the assembled shahbandars swear the merchant covenant beneath a canopy of silk, binding every nation trading at Malacca to its common law of the sea. The entrepot stands complete, and ships of every monsoon now call it the richest port between two oceans.
      desc_zh: 苏丹与众沙班达尔在丝绸华盖下立下商人盟约，将所有在马六甲贸易的邦国纳入共同的海商律法。港埠自此建成，往来于两洋季风间的船只，皆称此地为两洋之间最富庶的港口。
      cost:
      - type: yearly_gold
        value: -15
      - type: scaled_gold
        value: -12
