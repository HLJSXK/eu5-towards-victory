      title_zh: 市议会颁发大码头特许状
      desc_en: The Gdańsk city council, flush with grain profits, charters an expansion of the Motława quays to match the port's swelling trade with Amsterdam, Lübeck, and beyond. Word of new wharves and warehouses spreads through the Hanseatic counting houses within the week.
      desc_zh: 满载粮食贸易利润的但泽市议会，颁发特许状扩建莫特瓦瓦河沿岸的码头，以应对与阿姆斯特丹、吕贝克等地日益兴旺的贸易往来。新建码头与仓库的消息，短短一周内便传遍汉萨同盟各地的商行账房。
      cost:
      - type: scaled_gold
        value: -4
    - title_en: Surveying the Motława Banks
      title_zh: 勘察莫特瓦瓦河岸
      desc_en: Harbor masters and Dutch-trained engineers walk the marshy banks of the Motława, staking claims against competing granary owners and marking where the river must be deepened for heavier hulls. Old fishing jetties are bought out or torn down to clear the ground.
      desc_zh: 港务官与受荷兰技艺训练的工程师沿莫特瓦瓦河泥泞的河岸勘察，与争地的谷仓主们划定界线，标出河道需要疏浚加深以承载更重船体之处。旧渔码头或被买断，或被拆除，以腾出施工用地。
      cost:
      - type: scaled_gold
        value: -5
    - title_en: Timber Rafts Down the Vistula
      title_zh: 维斯瓦河上的木筏
      desc_en: Rafts of Polish oak and pine, floated down the Vistula from the forests of Mazovia, are lashed together beneath the walls to await the shipwrights and pile-drivers. Guild carpenters swear their contracts before the burgomaster as the first coin changes hands.
      desc_zh: 从马佐夫舍森林顺维斯瓦河漂运而下的波兰橡木与松木木筏，被捆扎在城墙下等待造船匠与打桩工使用。行会木匠们在市长面前签订契约，首笔工钱随即交付。
      cost:
      - type: gold
        value: -55
    - title_en: Piles Driven Into the Riverbed
      title_zh: 木桩打入河床
      desc_en: Massive oak piles are driven deep into the Motława's silt, the true work of the great port finally underway as pile-drivers pound from dawn to dusk. The skeleton of the first new quay begins to take shape along the water's edge.
      desc_zh: 巨大的橡木桩被深深打入莫特瓦瓦河的淤泥之中，打桩机自晨至暮轰鸣不停——这座大港真正的营造工程终于展开。第一座新码头的骨架，沿着水岸线渐渐成形。
      cost:
      - type: manpower
        value: -70
    - title_en: The Granaries of Ołowianka Rise
      title_zh: 奥沃维安卡谷仓拔地而起
      desc_en: On Ołowianka island, brick granaries rise story by story, their thick walls designed to keep grain dry through the long Baltic winters before it fills the holds of Dutch fluyts. Sacks of Polish rye already stack at the water's edge awaiting storage.
      desc_zh: 在奥沃维安卡岛上，砖砌谷仓一层层拔地而起，厚实的墙体旨在让粮食在漫长的波罗的海冬季里保持干燥，直至装满荷兰平底商船的船舱。波兰黑麦的麻袋已在岸边堆积，等待入库。
      cost:
      - type: scaled_gold
        value: -7
    - title_en: The Great Crane Is Hoisted Into Place
      title_zh: 大起重机安装就位
      desc_en: Carpenters raise the twin wooden towers of the great harbor crane, its huge treadwheels built to lift masts, cannon, and cargo alike from the holds of ships too heavy for human arms. Crowds gather on the quay to watch the first test lift groan skyward.
      desc_zh: 木匠们竖起大港起重机的双塔式木构，巨大的踏轮设计用以吊起桅杆、火炮与货物——那些船只自身人力已无法搬动的重物。人群聚集在码头，观看首次试吊时那沉重的吱呀声升向天空。
      cost:
      - type: gold
        value: -90
    - title_en: Amber and Timber Fill the Warehouses
      title_zh: 琥珀与木材堆满商栈
      desc_en: Merchant houses along the quay fill with baled Baltic amber, sacks of grain, and stacked timber bound for shipyards as far as England, while Hanseatic factors haggle over prices under the crane's shadow. The port's new district hums with a dozen languages at once.
      desc_zh: 码头沿线的商栈里堆满了成捆的波罗的海琥珀、成袋的谷物，以及运往远至英格兰造船厂的木材，汉萨代理商们在起重机的阴影下讨价还价。这座新兴港区里，十几种语言同时喧闹交织。
      cost:
      - type: cultural_influence
        value: -10
    - title_en: Danzig's Harbor Opens to the World
      title_zh: 但泽港向世界敞开
      desc_en: The council declares the rebuilt harbor open with a procession of laden ships past the great crane, granaries, and stone quays. From this day the port's reach and its granaries' bounty draw trade and coin from every corner of the Baltic to fill the treasury each year.
      desc_zh: 市议会以满载货物的船队列队驶过大起重机、谷仓与石砌码头的方式，宣告重建后的港口正式开放。自此日起，这座港口的贸易网络与谷仓的丰饶，每年都从波罗的海各个角落吸引商贸与钱财，充盈国库。
      cost:
      - type: scaled_gold
        value: -12
      - type: gold
        value: -130
