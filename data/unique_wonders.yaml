  prompt: The Iberian Inquisition as a late medieval monastery-tribunal complex in Toledo, cloisters, archive rooms, council chamber, guarded chapel, scribes, friars, banners, stone courtyards, historically grounded solemn world wonder key art, cinematic interior courtyard, ultra-detailed, no modern elements.
