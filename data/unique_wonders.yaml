      title_zh: 圆丘首层筑起
      desc_en: Workers break ground on the great round altar itself, laying its first marble terrace in the numerological patterns of nine that govern every measurement of the sacred precinct. The plans debated in the capital now stand as stone beneath the open sky.
      desc_zh: 役夫于巨大圆丘本身破土动工，依循贯穿整座圣地度量的九数之制，铺就其第一层大理石台阶。都中议论已久的图纸，此刻终化作露天之下的实石。
      cost:
      - type: scaled_gold
        value: -6
    - title_en: The Hall of Prayer Takes Its Circle
      title_zh: 祈年殿圆基渐成
      desc_en: Carpenters raise the circular timber frame of the Hall of Prayer for Good Harvests, its triple-tiered roof designed without a single iron nail, held together by an intricate lattice of interlocking wooden brackets. Imperial inspectors climb the scaffolding weekly to check the joinery's precision.
      desc_zh: 木匠架起祈年殿的圆形木构骨架，其三重檐屋顶不用一枚铁钉，全凭精巧的斗栱互锁相扣支撑而成。钦差每周皆登上脚手架，查验榫卯之精密。
      cost:
      - type: artwork
        value: 1
    - title_en: The Twenty-Eight Pillars Rise
      title_zh: 二十八根巨柱矗立
      desc_en: The hall's inner pillars are raised in their prescribed numbers, four great columns for the seasons, twelve for the months, and twelve more for the hours of day and night, all bound beneath the rising blue-tiled dome. Painters begin the dragon and phoenix motifs upon every beam.
      desc_zh: 殿内立柱依定制而立，四根应四季，十二根应十二月，另十二根应昼夜十二时辰，皆汇于渐次升起的蓝瓦穹顶之下。画工随即于每根梁上绘制龙凤纹样。
      cost:
      - type: celestial_authority
        value: -15
    - title_en: The Ceremonial Path Is Paved
      title_zh: 御道铺石告成
      desc_en: The raised stone walkway linking altar, hall, and palace gate is paved in its final slabs, and cypress groves along its length grow tall enough to shade the emperor's procession. Officials rehearse the full sequence of the sacrifice within sight of the nearly finished dome.
      desc_zh: 连接祭坛、大殿与宫门的高台御道铺就最后一块石板，沿途柏树亦已长得足以荫蔽天子仪仗。百官在几近竣工的穹顶注视下，反复演习祭祀全套礼仪。
      cost:
      - type: legitimacy
        value: -10
    - title_en: Heaven Receives the Emperor's Sacrifice
      title_zh: 天纳天子之祭
      desc_en: The emperor ascends the finished round altar at the winter solstice to offer the first sacrifice beneath the completed Hall of Prayer, and the court declares the temple forever the meeting place of Heaven and the throne. From this day the rites performed here confirm the dynasty's mandate before its people, and Heaven's favor is said to settle gently over every corner of the realm.
      desc_zh: 冬至日，天子登临竣工圆丘，于落成祈年殿下奉上首次祭祀，朝廷宣告此坛永为天人交会之所。自此于此举行之礼仪，向万民昭示王朝天命所归，据传天佑亦自此温润普施于国境每一隅。
      cost:
      - type: devotion
        value: -35
