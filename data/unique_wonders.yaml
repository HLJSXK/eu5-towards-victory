      title_zh: 宫廷占星师择定吉日
      desc_en: The Khan's court astrologer selects an auspicious day for the ground-breaking, and mullahs bless the palace grounds before assembled courtiers and craftsmen. Laborers begin raising the outer walls of what will become a sprawling complex of courtyards.
      desc_zh: 可汗的宫廷占星师择定动工的吉日，毛拉们在朝臣与工匠齐聚之下为宫殿用地举行祝圣仪式。劳工们开始砌筑外墙，日后这里将扩展成一片庭院纵横的宏大建筑群。
      cost:
      - type: devotion
        value: -10
    - title_en: The Audience Hall's Timbers Are Raised
      title_zh: 觐见厅木柱竖立
      desc_en: Carpenters raise the first painted timber columns of the great audience hall, the true building of the palace finally underway after the astrologer's blessing and the felling of the poplars. Gilders and painters follow close behind, brush in hand before the roof beams are even set.
      desc_zh: 木匠们竖起大觐见厅第一批彩绘木柱——经过占星师祝福与白杨伐运之后，宫殿真正的营造工程终于展开。镀金匠与画师紧随其后，屋梁尚未架好，手中画笔便已开始工作。
      cost:
      - type: manpower
        value: -65
    - title_en: Painters Cover the Courtyards in Color
      title_zh: 画师为庭院铺满色彩
      desc_en: Master painters cover the palace's inner courtyards in intricate floral and geometric patterns of red, blue, and gold, working panel by panel across dozens of wooden columns. Envoys already passing through Kokand pause to admire the half-finished galleries.
      desc_zh: 大画师们以繁复的花卉与几何纹样，将红、蓝、金三色铺满宫殿内庭，逐块木板、逐根立柱地精心绘制。途经浩罕的使节们纷纷驻足，赞叹这片尚未完工的回廊之美。
      cost:
      - type: honor
        value: -15
    - title_en: The Throne Room's Ceiling Is Gilded
      title_zh: 王座厅天花板镀金
      desc_en: Craftsmen finish gilding the coffered ceiling of the great audience hall, where the Khan will one day receive tribute from merchants and rival khans alike. Carved marble facings are set into the walls below, brought at great cost from quarries beyond the valley.
      desc_zh: 工匠们完成大觐见厅藻井天花板的镀金工程，日后可汗将在此接受来自商人与邻邦可汗的朝贡。厅堂下方的墙壁镶嵌上雕花大理石贴面，那是不惜重金从谷地之外的采石场运来的。
      cost:
      - type: legitimacy
        value: -18
    - title_en: Gardens Bloom Behind the Palace Walls
      title_zh: 宫墙之后花园盛放
      desc_en: Gardeners lay out formal gardens behind the palace, channeling irrigation water from the valley's rivers into pools and fruit orchards for the Khan's private pleasure. Silk merchants from across the roads leave gifts of rare saplings to be planted among the palace's new walks.
      desc_zh: 园丁们在宫墙之后布置规整的花园，将谷地河流的灌溉水引入池塘与果园，供可汗私下游赏。丝路各地而来的丝绸商人纷纷献上珍稀树苗，栽种于宫殿新辟的游廊之间。
      cost:
      - type: honor
        value: -20
    - title_en: The Khan Receives Tribute in Splendor
      title_zh: 可汗盛大接受朝贡
      desc_en: The Khan holds his first grand audience in the finished palace, envoys and tribute-bearers filing past painted columns and gilded ceilings to lay silk, silver, and horses before his throne. From this day the palace's splendor lends new weight to the Khan's word before every envoy who crosses the Ferghana valley.
      desc_zh: 可汗在竣工的宫殿中举行首次盛大觐见，使节与献贡者列队经过彩绘立柱与镀金天花板，将丝绸、银两与骏马呈献于王座之前。自此日起，这座宫殿的辉煌，让可汗的话语在每一位穿越费尔干纳谷地的使节面前更添分量。
