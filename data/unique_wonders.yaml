      title_zh: 认领永不熄灭之火
      desc_en: Travelers along the Absheron road speak of a fire that never dies, seeping from the earth itself, and the court proclaims that a shrine shall be raised around it for all who honor flame.
      desc_zh: 往来阿布歇伦道上的旅人都说，那里有一簇从大地深处渗出、永不熄灭的火焰，朝廷遂颁旨，要在火焰四周立一座圣祠，供敬火之人朝拜。
      cost:
      - type: devotion
        value: -10
    - title_en: Merchants of Many Faiths Gather
      title_zh: 多信仰商人共襄圣举
      desc_en: Hindu, Sikh, and Zoroastrian traders on the caravan routes pledge coin and craftsmen to the shrine, each seeing in the burning ground a sign of their own devotion.
      desc_zh: 商队路上的印度教徒、锡克教徒与拜火教商人纷纷捐资招募匠人，各自都在这团燃烧的土地中看见了自己信仰的印证。
      cost:
      - type: gold
        value: -50
    - title_en: The Priests Bless the Burning Ground
      title_zh: 祭司为圣地祝祷
      desc_en: Fire-priests walk the site at dusk, marking where the pentagonal courtyard and central altar will stand so the flame is never left uncircled by stone.
      desc_zh: 拜火祭司在黄昏时分踏勘此地，标出五边形庭院与中央祭坛的位置，务求那火焰永远不失石墙的环护。
      cost:
      - type: religious_influence
        value: -8
    - title_en: The Courtyard Walls Rise
      title_zh: 庭院石墙拔地而起
      desc_en: Masons set the first stones of the pentagonal enclosure around the burning ground, and the shrine that was only markers in the sand becomes a building the wind cannot scatter.
      desc_zh: 匠人为燃烧之地砌下五边形围墙的第一层石，曾经只是沙地上的标记，如今终于化作风也吹不散的建筑，工程正式动工。
      cost:
      - type: artwork
        value: 1
    - title_en: The Altar of the Central Flame
      title_zh: 中央火坛
      desc_en: A domed altar is raised directly over the strongest vent of fire, its four corner pillars carved to draw pilgrims' eyes upward with the flame itself.
      desc_zh: 一座圆顶祭坛直接立于火势最盛的裂口之上，四角石柱精雕细琢，引得朝圣者的目光随火焰一同向上攀升。
      cost:
      - type: devotion
        value: -18
    - title_en: Cells for the Ascetics
      title_zh: 苦修者的居室
      desc_en: Small stone cells line the inner courtyard wall for wandering ascetics who mean to spend years, some the rest of their lives, in sight of the sacred fire.
      desc_zh: 内庭墙边排开一间间石室，供云游的苦修者栖身，有人只住数年，有人则甘愿终生守望这团圣火。
      cost:
      - type: religious_influence
        value: -12
    - title_en: A Caravanserai for Pilgrims
      title_zh: 为朝圣者建起商旅驿站
      desc_en: Merchants fund a guest house and stables beside the shrine, so that pilgrims and traders crossing the Caspian wind can rest within sight of the flame before continuing on.
      desc_zh: 商人出资在圣祠旁建起客舍与马厩，好让穿越里海寒风的朝圣者与行商能在火光可见之处歇脚，再继续上路。
      cost:
      - type: artwork
        value: 1
    - title_en: The Ateshgah Is Consecrated
      title_zh: 阿捷什嘎火祠受祝圣
      desc_en: The fire temple stands finished on the Absheron peninsula, its flame never once needing to be lit by human hand, and from this day the realm's prestige burns a little brighter for the pilgrims it draws.
      desc_zh: 拜火神庙终于在阿布歇伦半岛落成，圣火从未需人手点燃，自此日起，因这团吸引朝圣者的圣火，举国声望也愈发耀眼。
      cost:
      - type: devotion
        value: -25
      - type: prestige
        value: -15
