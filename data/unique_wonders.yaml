    - title_en: Charting the Guadalquivir
      title_zh: 勘测瓜达尔基维尔河道
      desc_en: Pilots and river-masters sound the shallows of the Guadalquivir, marking channels deep enough for laden galleons and warning of the sandbars that have swallowed lesser ships.
      desc_zh: 领航员与河道官沿瓜达尔基维尔河测量水深，标出足以容纳满载大帆船的航道，并对吞没过往船只的暗沙发出警示。
