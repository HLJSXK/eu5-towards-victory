      desc_zh: 石匠在天守预定地基下砌起倾斜的石垣，工匠们自此谈论的不再只是四周城墙，而是天守本身。
      cost:
      - type: gold
        value: -50
    - title_en: Five Stories Rise Tier by Tier
      title_zh: 五重楼阁层叠而起
      desc_en: Carpenters raise the keep's timber frame story by story, each level set slightly back from the one below, until the donjon's silhouette begins to resemble a heron in flight.
      desc_zh: 木匠将天守的木构架逐层筑起，每一层都略微内收于下层之上，直至天守轮廓渐渐显出白鹭振翅欲飞之姿。
      cost:
      - type: cultural_influence
        value: -8
    - title_en: White Plaster Covers the Walls
      title_zh: 白漆遍涂如鹭栖山
      desc_en: Layers of white plaster are troweled over the keep's walls and gables until the whole complex gleams like a heron settling on the hill, giving the castle its enduring name.
      desc_zh: 一层层白色灰泥被涂抹于天守墙面与破风之上，直至整座城郭如白鹭栖山般通体皎洁，姬路城因此得名。
      cost:
      - type: artwork
        value: 1
    - title_en: Retainers Drill Within the Maze of Gates
      title_zh: 迷阵重门内演武
      desc_en: Samurai retainers drill within the winding maze of gates and dead-end passages meant to confound any attacker, while inspectors walk the finished walls checking every joint.
      desc_zh: 家臣武士在那专为迷惑来敌而设的曲折门阵与死巷中演练操防，巡查官则沿竣工的城墙逐一检视每处接缝。
      cost:
      - type: army_tradition
        value: -3
