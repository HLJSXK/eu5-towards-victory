    stages:
    - title_en: The Rada Calls for a New Sich
      title_zh: 拉达号召修建新谢契
      desc_en: The Cossack rada, gathered in open assembly on the riverbank, votes by acclamation to raise a new sich fortified camp beyond the rapids, free of any lord's writ. Kurin atamans send riders across the steppe to summon free men to the timber and the palisade.
      desc_zh: 哥萨克拉达在河岸露天集会，以齐声呼应的方式表决通过：在急流之外修建一座新的谢契要塞营地，不受任何领主管辖。各库林阿塔曼派出骑手驰骋草原，召集自由人前来参与伐木筑栅的工程。
      cost:
      - type: honor
        value: -12
    - title_en: Choosing the Island Beyond the Rapids
      title_zh: 选定急流之外的岛屿
      desc_en: Kish otamans and elder Cossacks scout the islands and river bends beyond the Dnieper rapids, judging each for its approach by water, its cover of reed and willow, and its distance from any khan's or king's reach. Rafts of oak logs are lashed together upriver and floated down to the chosen ground.
      desc_zh: 卡什阿塔曼与年长的哥萨克们在第聂伯河急流之外的岛屿与河湾间四处勘察，衡量每处水路可及、芦苇柳林可作掩护、以及距任何可汗或国王势力范围的远近。上游捆扎好的橡木筏顺流而下，运抵选定之地。
      cost:
      - type: legitimacy
        value: -8
    - title_en: The Priest Blesses the Palisade Ground
      title_zh: 神父为栅墙用地祝圣
      desc_en: An Orthodox priest travelling with the host blesses the cleared ground and the banner of the Sich before the first stakes are driven, while free men swear the Cossack oath around a bonfire. The forges are lit for the first time to shape nails and axeheads.
      desc_zh: 随军而行的东正教神父在第一根木桩打入之前，为清理出的场地与谢契的军旗举行祝圣仪式，自由人们则围着篝火宣誓成为哥萨克。锻炉首次点燃，开始打制铁钉与斧头。
      cost:
      - type: army_tradition
        value: -2
    - title_en: The Palisade Wall Takes Its First Timbers
      title_zh: 栅墙立起第一批木料
      desc_en: Rows of sharpened oak stakes rise into a true palisade wall around the chosen island, the sich's real construction now underway after the rada's vote and the priest's blessing. Cossacks haul timber through mud and reed to raise the wagon-camp defenses behind it.
      desc_zh: 一排排削尖的橡木桩在选定的岛屿四周立起，形成真正的栅墙——在拉达表决与神父祝圣之后，谢契的实际营造工程终于展开。哥萨克们踏过泥泞与芦苇丛，运送木料，在栅墙之后筑起车营防御工事。
      cost:
      - type: honor
        value: -18
    - title_en: The Kurins Rise Around the Square
      title_zh: 库林营房环绕广场而立
      desc_en: Long wooden kurin barracks rise in a ring around the open rada square, each housing a company of free Cossacks under its own ataman and banner. The bare earth at the center is left open, already marked as the place where the whole host will gather to shout its will.
      desc_zh: 一排排木造的库林营房环绕着露天的拉达广场拔地而起，每座营房都由各自的阿塔曼与旗帜统率一支自由哥萨克连队。中央的空地依旧裸露，早已被划定为全军集会、齐声呼喊表决意愿之处。
      cost:
      - type: army_tradition
        value: -3
    - title_en: Chaikas Take Shape on the Riverbank
      title_zh: 河岸边的恰伊卡快船
      desc_en: Shipwrights and blacksmiths work side by side, hollowing out chaika boats from single oak trunks while the forges hammer out sabers, musket barrels, and horseshoes without pause. The Sich begins to look less like a camp and more like a floating arsenal on the Dnieper.
      desc_zh: 造船匠与铁匠并肩劳作，用整根橡木凿刻出恰伊卡快船的船身，锻炉则不停打制马刀、火枪管与马蹄铁。谢契渐渐不再像是单纯的营地，倒像第聂伯河上的一座水上兵工厂。
      cost:
      - type: gold
        value: -50
    - title_en: Cannon Mounted on the Ramparts
      title_zh: 土垒之上架起火炮
      desc_en: Captured or bartered cannon are hauled up onto the earthen ramparts overlooking the river approaches, manned by gunners who have served under a half-dozen banners before joining the host. Watch towers rise at the corners, their sentries scanning the steppe for Tatar dust.
      desc_zh: 缴获或以货易得的火炮被拖上俯瞰河道要道的土垒，由曾效力过数面旗帜、如今才加入本队的炮手操作。角楼在四隅拔地而起，哨兵在其上警惕地扫视草原，留意鞑靼骑兵扬起的尘烟。
      cost:
      - type: honor
        value: -25
    - title_en: The Sich Stands Free Beyond the Rapids
      title_zh: 谢契屹立于急流之外
      desc_en: The kish otaman raises the host's banner over the finished Sich before the full rada, declaring the free camp complete and answerable to no crown. From this day the discipline forged in its kurins and the manpower it musters strengthen every host the hetmanate sends into the field.
      desc_zh: 卡什阿塔曼在全体拉达面前，于竣工的谢契升起本军旗帜，宣告这座自由营地大功告成，不受任何王权号令。自此日起，在其库林中锤炼出的纪律与所能征募的兵力，将增强盖特曼国派往战场的每一支军队。
      cost:
      - type: prestige
        value: -40
      - type: army_tradition
        value: -4
