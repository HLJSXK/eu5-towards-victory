      desc_en: The court proclaims Jingdezhen the seat of official porcelain, its wares to be marked apart from all common ware. Fuliang's potters gather to hear the imperial commissioner read the charter aloud.
      desc_zh: 朝廷诏令景德镇为官窑重地，所出瓷器须与民间粗器分而别之。浮梁陶工齐聚，听钦差宣读敕文。
      cost:
      - type: scaled_gold
        value: -4
    - title_en: The Clay Banks Are Chosen
      title_zh: 择定高岭泥矿
      desc_en: Surveyors walk the riverbanks near Fuliang, testing the whiteness of kaolin pulled from each pit. The finest clay beds are marked and reserved for the crown alone.
      desc_zh: 勘查者沿浮梁河岸行走，逐坑试验高岭土的洁白程度。最优的泥矿被一一标出，专供皇室采用。
