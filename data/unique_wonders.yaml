    stages:
    - title_en: The Sultan Decrees the Strait Sealed
      title_zh: 苏丹敕令封锁海峡
      desc_en: The Sultan orders the narrows at Gallipoli fortified against any fleet that dares approach the capital by sea. Engineers and gunners alike are summoned to the shores of the Dardanelles.
      desc_zh: 苏丹下令加固加里波利海峡窄口，以御任何胆敢由海路逼近京城的舰队。工匠与炮手皆奉召齐聚达达尼尔海峡两岸。
      cost:
      - type: honor
        value: -10
    - title_en: Both Shores Are Surveyed
      title_zh: 两岸勘定炮位
      desc_en: Surveyors cross the narrow water again and again, marking where the currents run slowest and the guns would bear best on any passing hull. Local fishermen are paid for their knowledge of the strait's moods.
      desc_zh: 勘测者反复渡过狭窄水道，标出水流最缓、火炮最能瞄准过往船身之处。当地渔民也因熟知海峡脾性而受雇献策。
      cost:
      - type: scaled_gold
        value: -4
    - title_en: Stone and Bronze Are Brought Down
      title_zh: 石料铜炮运抵两岸
      desc_en: Quarried stone is barged to both banks while bronze is cast into cannon barrels at foundries inland. Ottoman gunners arrive to drill the coming garrisons in the discipline of the guns.
      desc_zh: 采石经由驳船运至两岸，内陆铸炮厂则将青铜铸成炮管。奥斯曼炮手随后抵达，训练即将驻守的守军操炮之法。
      cost:
      - type: army_tradition
        value: -3
    - title_en: The Tower Foundations Rise
      title_zh: 塔基初起
      desc_en: Masons lay the first courses of stone for towers on both shores of the strait. What was until now surveys and cargo now stands as walls rising directly from the water's edge.
      desc_zh: 石匠在海峡两岸同时垒起塔楼的最初几层。此前不过是勘测与运来的物料，如今已成为直接立于水畔的墙垣。
      cost:
      - type: scaled_gold
        value: -6
    - title_en: The Batteries Are Mounted
      title_zh: 炮台安装就位
      desc_en: Heavy cannon are winched into place along the ramparts, their muzzles trained across the narrow channel toward the opposite shore. Powder magazines are dug deep beneath the towers for safety.
      desc_zh: 重炮被绞车吊装至胸墙之上，炮口越过狭窄水道，对准彼岸。火药库则深挖于塔楼之下，以求安全。
      cost:
      - type: navy_tradition
        value: -3
    - title_en: The Garrisons Are Drilled
      title_zh: 守军演练操炮
      desc_en: Gunners and soldiers alike rehearse the loading and firing of the great guns until the drills run without a wasted motion. War galleys anchor nearby to test the batteries' range against real targets.
      desc_zh: 炮手与士兵反复演练装填与发射巨炮，直至动作娴熟毫无浪费。战船就近抛锚，以真实目标试验炮台的射程。
      cost:
      - type: navy_tradition
        value: -4
    - title_en: A Fleet Tests the Guns
      title_zh: 敌舰试探炮火
      desc_en: An enemy squadron probes the strait and is driven back under a curtain of smoke and iron, proving the fortress's worth before it is even finished. Word of the cannon's roar reaches the capital within days.
      desc_zh: 一支敌方舰队试探性驶入海峡，尚未待要塞完工便在炮火与硝烟之下折返，证明了这座堡垒的价值。炮声之威，数日之内便传至京城。
      cost:
      - type: honor
        value: -20
    - title_en: The Strait Is Sealed
      title_zh: 海峡终成铜墙铁壁
      desc_en: The batteries on both shores now stand complete, their guns commanding every ship that dares the narrows. No fleet crosses the Dardanelles again without reckoning the cost, and the navy's discipline is forged harder for it.
      desc_zh: 两岸炮台如今皆已竣工，火炮扼守住每一艘胆敢驶入窄口的船只。此后再无舰队敢无视代价穿越达达尼尔海峡，海军的纪律也因此愈发坚韧。
      cost:
      - type: prestige
        value: -35
      - type: navy_tradition
        value: -5
