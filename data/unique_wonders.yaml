  ceremony:
    stage_1_reward:
    - type: devotion
      value: 25
    - type: religious_influence
      value: 10
    stages:
    - title_en: The Chief Proclaims a Mosque of Earth
      title_zh: 酋长宣告兴建泥造清真寺
      desc_en: Djenne's ruler proclaims a great mosque to rise from the banks of the Bani, built in the earthen tradition of the Sahel and blessed to outshine every mudbrick building before it. Griots carry the news through the market square before the first brick is molded.
      desc_zh: 杰内的统治者宣告，将在巴尼河畔兴建一座宏伟的清真寺，遵循萨赫勒地区的泥造传统营建，祝愿其光彩超越此前任何一座夯土建筑。在第一块土坯成型之前，格里奥（吟游诗人）已将消息传遍市集广场。
      cost:
      - type: artwork
        value: 1
    - title_en: Mixing the Sacred Mud
      title_zh: 调制圣泥
      desc_en: Craftsmen mix mud from the riverbank with rice husks and shea butter, following a recipe passed down through generations of Djenne's builder families. Elders bless the pits where the mixture will cure before molding begins.
      desc_zh: 工匠们将河岸的泥土与稻壳、乳木果油调和，配方世代相传于杰内的营造世家。长老们为泥料醒发的坑池举行祝祷，随后方可开始塑形。
      cost:
      - type: devotion
        value: -8
    - title_en: Gathering the Toron Timbers
      title_zh: 筹备托罗恩木梁
      desc_en: Palm timbers are cut and shaped into toron beams, destined to jut from the walls both as structure and as scaffolding for the yearly festival of replastering. Market traders and scholars alike pledge labor days to the mosque's construction.
      desc_zh: 棕榈木被砍伐并削制成托罗恩木梁，日后将从墙体中探出，既作结构支撑，也充作每年抹泥节的脚手架。市集商贩与学者们纷纷承诺为清真寺工程贡献劳役。
      cost:
      - type: scaled_gold
        value: -6
    - title_en: The Earthen Walls Begin to Rise
      title_zh: 夯土墙体正式动工
      desc_en: Builders begin laying the true mudbrick walls of the mosque, its buttresses and towers taking shape above the market square where only blessings and timber once stood. Children run alongside the mud-carriers, eager to press their own handprints into the wet walls.
      desc_zh: 营造者们开始砌筑清真寺的实体夯土墙体，扶壁与塔楼在市集广场之上逐渐成形，此前那里只有祝祷与木材。孩童们跟在运泥人身旁奔跑，急切地想在湿润的墙面上按下自己的手印。
      cost:
      - type: scaled_gold
        value: -8
    - title_en: The Towers Reach Their Height
      title_zh: 宣礼塔攀升至顶
      desc_en: The three great towers rise above the rooftops, their conical spires topped with ostrich eggs in the old custom for prosperity and purity. Scaffolders scale the toron beams with baskets of fresh mud slung across their backs.
      desc_zh: 三座巍峨的塔楼在屋顶之上耸立，锥形塔尖依循古俗顶以鸵鸟蛋，象征丰饶与纯洁。搭架工人肩挎盛满新泥的篮筐，攀上托罗恩木梁。
      cost:
      - type: purity
        value: -12
    - title_en: The Prayer Hall Is Sealed
      title_zh: 礼拜大殿封顶完工
      desc_en: The great prayer hall's roof of palm timber and mud is sealed, its forest of interior pillars finally shaded from the Sahel sun. Merchants below begin timing their market days to the mosque's shadow across the square.
      desc_zh: 礼拜大殿以棕榈木与泥土铺就的屋顶封顶完工，殿内林立的柱群终于免受萨赫勒烈日的曝晒。市集商贩们开始按照清真寺投在广场上的阴影来安排赶集的时辰。
      cost:
      - type: scaled_gold
        value: -10
    - title_en: The First Replastering Festival
      title_zh: 首届抹泥节庆典
      desc_en: The whole city turns out for the first replastering festival, men and boys scaling the toron beams to smooth fresh mud across the walls in a single joyous day of labor. Musicians and market women feed the workers as the mosque takes on its final, seamless coat.
      desc_zh: 全城百姓齐聚参加首届抹泥节，男子与男孩们攀上托罗恩木梁，在这欢乐的一日劳作中为墙面抹上新泥。乐师与市集妇女为工人们送去食物，清真寺渐渐披上最后一层浑然一体的泥衣。
      cost:
      - type: artwork
        value: 1
    - title_en: The Great Mosque Stands Consecrated
      title_zh: 大清真寺祝圣落成
      desc_en: The Great Mosque of Djenne is formally consecrated as the faithful fill its earthen courtyard, its towers casting the market square in shadow for generations to come. The city's devotion becomes known across the Sahel, and the faithful throughout the realm draw lasting strength from its example.
      desc_zh: 杰内大清真寺正式祝圣落成，信众挤满夯土庭院，塔楼的阴影自此世代笼罩市集广场。此城的虔诚之名传遍萨赫勒，举国信众亦从其典范中获得历久弥新的力量。
      cost:
      - type: religious_influence
        value: -25
      - type: devotion
        value: -20
