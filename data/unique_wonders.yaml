  ceremony:
    stage_1_reward:
    - type: prestige
      value: 15
    - type: harmony
      value: 15
    stages:
    - title_en: Milan Vows a Cathedral of White Marble
      title_zh: 米兰立誓建白石大教堂
      desc_en: Archbishop and Visconti duke together proclaim that Milan shall raise a Gothic cathedral unlike any in Lombardy, faced entirely in gleaming white marble from the quarries of Candoglia. Fabbrica del Duomo is founded to oversee the labor for as long as it takes.
      desc_zh: 大主教与维斯孔蒂公爵联袂宣告，米兰将兴建一座伦巴第前所未见的哥特式大教堂，全以坎多利亚采石场的洁白大理石为饰。大教堂工程局随即成立，无论历时多久，皆将督理此项工程。
      cost:
      - type: prestige
        value: -15
    - title_en: German Masters Consult on the Design
      title_zh: 德意志名匠共议图样
      desc_en: Milanese masters summon architects from beyond the Alps to settle disputes over proportion and structure, for no one in Lombardy has raised flying buttresses at such scale before. Candoglia's quarry is granted tax-free passage for its marble down the Navigli canals.
      desc_zh: 米兰匠师延请阿尔卑斯山以北的建筑师前来共议比例与结构之争，盖因伦巴第境内从未有人建过如此规模的飞扶壁。坎多利亚采石场亦获准其大理石沿纳维利运河免税运输。
      cost:
      - type: scaled_gold
        value: -4
    - title_en: Marble Barges on the Navigli
      title_zh: 运河驳船载运大理石
      desc_en: Barges loaded with Candoglia marble glide down the Navigli canals toward the city, each block stamped with the mark of the Fabbrica to keep it free of toll. Sculptors' workshops spring up around the building site to carve the thousands of statues the design will require.
      desc_zh: 满载坎多利亚大理石的驳船沿纳维利运河缓缓驶向城中，每块石料皆刻有工程局标记以免关税。雕刻工坊亦在工地周围纷纷建立，专为雕琢这设计所需的数以千计的雕像。
      cost:
      - type: artwork
        value: 1
    - title_en: The Choir's Foundations Break Ground
      title_zh: 唱诗席地基破土
      desc_en: Masons break ground on the cathedral's choir, and Milan's cathedral at last rises from disputed drawings into pier and buttress upon Lombard soil. Duke and archbishop both attend the laying of the first great pillar.
      desc_zh: 石匠于大教堂唱诗席处破土动工，米兰大教堂终于自争议不断的图纸化作矗立伦巴第土地上的立柱与扶壁。公爵与大主教亲临首根巨柱奠基仪式。
      cost:
      - type: scaled_gold
        value: -6
    - title_en: The Nave's Forest of Pillars
      title_zh: 中殿柱林渐立
      desc_en: Rows of soaring piers rise to enclose the nave, each crowned with carved capitals depicting saints and Visconti emblems alike. Cranes worked by treadwheel lift block after block to heights no Lombard building has reached before.
      desc_zh: 一排排高耸立柱拔地而起，环绕中殿而立，柱头皆雕刻圣徒与维斯孔蒂家族纹章。以踏轮驱动的起重机将石块一块块吊升至伦巴第建筑前所未及的高度。
      cost:
      - type: artwork
        value: 1
    - title_en: Flying Buttresses Span the Vaults
      title_zh: 飞扶壁横跨拱顶
      desc_en: Flying buttresses arc outward from the clerestory to brace the ambitious stone vaults overhead, a solution finally settled after decades of argument between Italian and transalpine masters. The building's Gothic spires begin to needle above the rooftops of Milan.
      desc_zh: 飞扶壁自高侧窗向外弧形伸展，支撑起头顶野心勃勃的石造拱顶，这一方案历经意大利与阿尔卑斯以北匠师数十年争论方才敲定。教堂哥特式尖塔已开始如针般刺破米兰的屋脊线。
      cost:
      - type: honor
        value: -15
    - title_en: A Forest of Statues on the Roof
      title_zh: 屋顶雕像林立
      desc_en: Thousands of marble statues and pinnacles are set upon the roof and buttresses, so many that Milanese say the cathedral grows a second city of saints above its own nave. Guilds of every craft now claim a hand in some corner of the vast facade.
      desc_zh: 数以千计的大理石雕像与小尖塔陆续安置于屋顶与扶壁之上，米兰人戏言大教堂在其中殿之上又生出一座圣徒之城。各行各业的行会此时皆可在这浩大立面的某一角落，指认出自己一份手笔。
      cost:
      - type: artwork
        value: 1
    - title_en: The Duomo Opens Its Doors
      title_zh: 大教堂正式开门迎众
      desc_en: Bells ring across Milan as the cathedral is consecrated before duke, archbishop, and every guild that lent a mason or a marble block, its forest of spires declared the pride of Lombardy. From this day the Duomo's tolerant, watchful presence over the city steadies faiths of every kind within its shadow, and its glory lends fresh luster to the ducal court.
      desc_zh: 米兰钟声齐鸣，大教堂于公爵、大主教及每一个曾出力提供石匠或石料的行会面前举行祝圣大典，其如林尖塔被誉为伦巴第之荣耀。自此大教堂宽容而警觉地俯瞰全城，令其荫庇之下各方信仰皆得以安稳，其荣光亦为公爵宫廷再添光彩。
      cost:
      - type: devotion
        value: -20
      - type: prestige
        value: -40
