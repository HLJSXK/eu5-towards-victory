    - title_en: The Ribs of the Treasure Ship Rise
      title_zh: 宝船肋骨渐次立起
      desc_en: Rib after massive rib is raised along the slipway, and visitors from the capital marvel that a single hull could dwarf the merchant junks crowding the river below.
      desc_zh: 巨大的船肋沿船台一根根竖起，来自京城的访客无不惊叹，一艘船身竟能使河上往来的商船相形见绌。
      cost:
      - type: manpower
        value: -35
    - title_en: Nine Masts Are Stepped
      title_zh: 九桅立起
      desc_en: Craftsmen raise mast after towering mast until nine stand along the deck, and word of the ship's size begins to travel with merchants down the coast and beyond it.
      desc_zh: 工匠将高耸的桅杆一根接一根立起，直至甲板上九桅并立，船只之巨的传闻随沿海商人一路传向更远之地。
      cost:
      - type: navy_tradition
        value: -2
    - title_en: Fire Threatens the Yards
      title_zh: 火患威胁船坞
      desc_en: A spark from a forge nearly consumes a half-finished hull one dry autumn night, and only the yard's disciplined bucket lines and the shipwrights' quick axes save the keel from ruin.
      desc_zh: 一个干燥的秋夜，锻炉的火星几乎吞没一艘尚未完工的船身，唯有船坞纪律严明的水桶队与工匠们迅捷挥斧，方才保住了船骨。
      cost:
      - type: gold
        value: -50
    - title_en: The Treasure Fleet Sets Sail
      title_zh: 宝船舰队扬帆启航
      desc_en: Banners, drums, and incense smoke fill the Nanjing waterfront as the great ships cast off down the Yangtze toward the open sea, and Longjiang's yards are consecrated as the permanent forge of the dynasty's naval reach.
      desc_zh: 旌旗、战鼓与香烟弥漫南京江畔，巨舰顺长江解缆驶向大海，龙江船厂自此被奉为王朝海权永恒的锻造之地。
      cost:
      - type: sailors
        value: -140
