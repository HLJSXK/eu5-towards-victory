    stages:
    - title_en: The King Decrees the Great Baray
      title_zh: 国王敕造巨型蓄水池
      desc_en: The Khmer king orders a reservoir vast enough to hold back the wet season and feed the dry, so that Angkor's rice fields need never again fear drought or flood. Royal surveyors set out to trace the embankments that will one day ring a small inland sea.
      desc_zh: 高棉国王下令修建一座足以蓄住雨季、灌溉旱季的巨大蓄水池，使吴哥的稻田从此无需再惧干旱或洪涝。王室测量官出发勘察堤岸走向，这条堤岸日后将环抱一片人工内海。
      cost:
      - type: scaled_gold
        value: -4
    - title_en: Villages Are Called to the Embankments
      title_zh: 各村征调修筑堤岸
      desc_en: Corvee labor is drawn from villages across the kingdom to begin hauling earth for the baray's walls, while priests mark the cardinal points where shrines will stand at the reservoir's corners. Rice stores are set aside to feed the laborers through the dry months of digging.
      desc_zh: 全国各村落被征调徭役，开始为蓄水池堤岸搬运泥土，祭司则在水库四角标出神龛应立之方位。稻谷被专门储备下来，以供旱季挖掘期间劳工食用。
      cost:
      - type: manpower
        value: -25
    - title_en: The Canals Are Traced to the Fields
      title_zh: 渠网勘定通向田野
      desc_en: Engineers mark the network of feeder canals that will one day carry the baray's water out to the rice fields beyond the city, and Brahmin priests bless the central axis where the reservoir will mirror the heavens. The first sluice designs are tested in small clay models.
      desc_zh: 工程师标出未来将把水库之水引向城外稻田的输水渠网络，婆罗门祭司也为水库将映照天界的中轴线祈福。最初的水闸设计以小型陶土模型试验。
      cost:
      - type: devotion
        value: -10
    - title_en: Earth Is Cut for the Reservoir's Bed
      title_zh: 开挖蓄水池池底
      desc_en: Laborers finally cut into the plain itself, digging the reservoir's basin while others pack and tamp the long earthen embankments rising around it. What was staked ground now becomes a widening basin of raw red earth.
      desc_zh: 劳工终于开挖平原本身，掘出蓄水池的池底，另一批人则夯筑环绕四周的长条土堤。曾经只是打桩标记的土地，如今化作一片渐渐扩大的红土洼地。
      cost:
      - type: manpower
        value: -35
    - title_en: The Embankments Rise to Hold the Rains
      title_zh: 堤岸增高以拒雨季
      desc_en: The great earthen walls climb higher with each dry season, stone-faced sluices set into their length to control the water Angkor's engineers know will come with the monsoon. Shrine towers are built at the corners where priests will one day preside over the reservoir's opening.
      desc_zh: 每逢旱季，高大的土堤便再增高一层，堤身嵌入石砌水闸，用以控制吴哥工程师深知季风终将带来的洪水。堤角建起神龛塔楼，日后祭司将在此主持水库启用的仪式。
      cost:
      - type: scaled_gold
        value: -7
    - title_en: The Waters Are Let In for the First Time
      title_zh: 库水首次引入
      desc_en: Channels are cut open to let the swollen wet-season rivers flood into the reservoir for the first time, engineers watching anxiously as the embankments hold against the rising water. Fishermen and farmers alike gather at the banks to see the inland sea begin to fill.
      desc_zh: 渠道被凿开，让雨季暴涨的河水首次涌入水库，工程师焦急地注视着堤岸能否顶住不断上涨的水位。渔民与农人纷纷聚集堤畔，观看这片内海开始蓄满水。
      cost:
      - type: gold
        value: -90
    - title_en: The Canals Carry Water to the Rice Fields
      title_zh: 渠水灌溉稻田
      desc_en: The finished feeder canals are opened stretch by stretch, carrying the baray's stored water out across the plain to fields that have never before been watered on demand. Farmers along the new canals begin planning a second rice harvest for the coming dry season.
      desc_zh: 竣工的输水渠段段开通，将水库蓄水引向从未能按需灌溉的平原稻田。新渠沿岸的农人开始筹划旱季即将到来的第二季稻作收成。
      cost:
      - type: yearly_gold
        value: -10
    - title_en: The Priests Release the Water in Triumph
      title_zh: 祭司放水以庆大成
      desc_en: Khmer priests and engineers gather at the main sluice to perform the water-release ceremony before the assembled court, the reservoir's gates opened to send its stored water flowing out across Angkor's fields in full view of the temples on the horizon. The hydraulic system now stands complete, its baray and canals feeding the kingdom's rice through drought and flood alike.
      desc_zh: 高棉祭司与工程官员齐聚主闸，在朝臣面前举行放水大典，水库闸门开启，蓄水在地平线上诸神庙的注视下流淌至吴哥的田野。这套水利系统自此告成，其蓄水池与渠网无论旱涝都将持续滋养王国的稻田。
      cost:
      - type: harmony
        value: -20
