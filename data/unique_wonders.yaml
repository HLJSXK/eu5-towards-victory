      desc_en: The king commands that a channel be cut linking the Nile's eastern branch to the Bitter Lakes and onward to the Red Sea, so that ships need not round the deserts of Arabia. Scribes and overseers are dispatched to survey the driest stretch of the route.
      desc_zh: 国王下令开凿一条运河，连通尼罗河东支、苦湖，直抵红海，使船只无须绕行阿拉伯沙漠。书吏与监工奉命前往勘察这段最为干旱的路线。
      cost:
      - type: scaled_gold
        value: -4
    - title_en: Levies Are Called to the Desert
      title_zh: 征发劳役赴沙漠
      desc_en: Labor levies are drawn from the Delta nomes and marched into the desert with water skins and digging tools, while granaries are stocked along the route to feed the diggers through the dry season. Persian and Egyptian overseers together plan the canal's width and depth.
      desc_zh: 三角洲各诺姆征调劳役，携水囊与工具开赴沙漠，沿线也囤积粮仓以供旱季挖掘工人所需。波斯与埃及监工共同商定运河的宽度与深度。
      cost:
      - type: scaled_gold
        value: -5
    - title_en: The Gods of River and Sea Are Honored
      title_zh: 敬奉江河与海洋之神
      desc_en: Priests set up shrines at both the Nile intake and the Red Sea outlet, invoking the favor of river and sea alike for a channel that will join them. The first stelae are carved to record the king's name upon the enterprise.
      desc_zh: 祭司在尼罗河引水口与红海出口两端立起神龛，祈求江河与海洋共同护佑这条即将连通二者的水道。最早的石碑被刻上国王之名，记录这项工程。
      cost:
      - type: devotion
        value: -10
    - title_en: Spades Strike the Desert Floor
      title_zh: 铁锹凿开沙地
      desc_en: At the chosen cutting near the Bitter Lakes, the levies finally break the packed sand and clay, and the true excavation of the channel begins in earnest under the desert sun. Baskets of spoil are hauled away by the thousand as the trench begins to deepen.
      desc_zh: 在苦湖附近选定的开挖点，劳役们终于凿开坚实的沙土层，在沙漠烈日下正式展开运河的真正挖掘。成千上万筐土被运走，沟渠日渐加深。
      cost:
      - type: manpower
        value: -30
    - title_en: The Bitter Lakes Are Joined
      title_zh: 苦湖终得连通
      desc_en: The channel is driven through to the Bitter Lakes at last, brackish water spreading into the new cut as workers cheer the first sign that the two ends of the project will truly meet. Engineers adjust the grade so the current will not silt the passage shut.
      desc_zh: 运河终于凿通抵达苦湖，咸水涌入新挖的河道，工人们为这一确证工程终将首尾相接的迹象而欢呼。工程师调整坡度，以防水流将航道重新淤塞。
      cost:
      - type: scaled_gold
        value: -7
    - title_en: The Canal Reaches Toward the Sea
      title_zh: 运河直指大海
      desc_en: Diggers push the final stretch toward the Red Sea, cutting through the hardest rock shelf of the whole route with fire and vinegar to crack the stone. Ships from the Red Sea trade routes are ordered to stand ready for the canal's first true test.
      desc_zh: 挖掘工推进至全线最坚硬的岩层地段，以火烧醋淬之法开裂石层，向红海方向凿进最后一段。来自红海贸易航线的船只奉命待命，准备迎接运河的首次真正试航。
      cost:
      - type: gold
        value: -70
    - title_en: A Trial Convoy Tests the Shallow Water
      title_zh: 试航船队测试浅水
      desc_en: A cautious convoy of shallow-draft boats is sent the length of the unfinished channel, sailors calling out soundings as they thread past sandbanks still being cleared. Merchants from both the Nile and the Red Sea begin registering cargoes for the crossing to come.
      desc_zh: 一支吃水较浅的试航船队沿未完工的运河全线航行，水手一路测量水深，绕过尚未清理完毕的沙洲。来自尼罗河与红海两端的商人开始为即将到来的通航登记货物。
      cost:
      - type: gold
        value: -90
    - title_en: The Two Seas Are Joined at Last
      title_zh: 两海终得连通
      desc_en: The king's officials stand at the Red Sea mouth to receive the first full convoy sailing straight through from the Nile, incense burning as the ships pass into open water. The canal now binds Egypt's grain and goods to the trade of the Red Sea and beyond, a channel that will carry the kingdom's wealth for generations.
      desc_zh: 国王的官员齐聚红海出海口，迎接第一支从尼罗河直航而来的完整船队，香烟缭绕间船只驶入开阔海域。运河自此将埃及的粮食与货物与红海乃至更远的贸易连通，这条水道将为王国承载数代人的财富。
      cost:
      - type: scaled_gold
        value: -10
      - type: gold
        value: -140
