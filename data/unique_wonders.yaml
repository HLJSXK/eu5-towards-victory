      desc_en: A royal decree formalizes the Carrera de Indias, naming Sevilla the sole gateway for American treasure and summoning the Casa de Contratacion's clerks to prepare its ledgers.
      desc_zh: 王室诏令将塞维利亚定为美洲财货的唯一门户，贸易署的书记官们随即着手整理账册，迎接远洋航线的正式开端。
