    - title_en: Timber Supports and Guild Rolls Are Prepared
      title_zh: 木撑与工匠名册齐备
      desc_en: Timber supports are ordered by the wagonload from nearby forests, and a miners' guild is formally organized to set wages and enforce safety in the deepening galleries. Hoists are tested at the surface before the first descent.
      desc_zh: 一车又一车的木撑料从附近林地运来，采矿工行会也正式组建，负责厘定工钱并在日益幽深的矿道中维护安全。绞车在地面反复测试，方才准许首次下井。
      cost:
      - type: gold
        value: -55
    - title_en: The First Shaft Is Sunk
      title_zh: 首口矿井正式凿通
      desc_en: The first true shaft is sunk deep into the salt-bearing rock, the actual mining of Wieliczka finally underway after seasons of charter and preparation. Torches cast long shadows as the first carts of raw salt are hauled to the surface.
      desc_zh: 第一口真正的矿井深深凿入含盐岩层，历经数季的特许筹备，维利奇卡真正的采矿之工终于展开。火把投下长长的影子，第一批原盐矿车被拖运出井。
      cost:
      - type: scaled_gold
        value: -6
    - title_en: The Galleries Spread Beneath the Hills
      title_zh: 巷道于地下四方蔓延
      desc_en: New galleries branch out beneath the Polish hills in every direction, brine wells tapped alongside the solid salt deposits to double the mine's yield. Miners begin marking chamber walls with dates and names, a record etched in salt itself.
      desc_zh: 新的巷道在波兰丘陵之下向四面八方延伸，盐泉井与固态盐层同时开采，使矿产产量倍增。矿工们开始在洞室岩壁上刻下日期与姓名，将记忆刻进这盐岩本身。
      cost:
      - type: gold
        value: -75
    - title_en: Horse-Driven Hoists Are Installed
      title_zh: 马力绞车安装就位
      desc_en: Horse-driven hoists are installed at the main shafts, hauling far heavier loads of salt to the surface than the old hand-turned winches ever managed. Carts line up at the surface from dawn to dusk to carry the salt to market towns.
      desc_zh: 主井口相继安装起马力驱动的绞车，运载能力远超昔日手摇绞盘所能负荷的盐料重量。地面上的运货车队从黎明排到黄昏，将食盐运往各处集镇。
      cost:
      - type: scaled_gold
        value: -8
    - title_en: Miners Carve a Chapel in the Salt
      title_zh: 矿工于盐中凿成礼拜堂
      desc_en: Devout miners carve a small chapel directly into a salt chamber, its altar, walls, and even chandeliers fashioned entirely from the mine's own crystal. Word of the underground shrine draws curious visitors down the shaft alongside the workers.
      desc_zh: 虔诚的矿工在一处盐洞内径直凿出一座小小礼拜堂，祭坛、墙壁乃至枝形吊灯，皆由矿中盐晶亲手雕琢而成。这座地下圣所的名声渐传开来，引得好奇访客随矿工一同下井参观。
      cost:
      - type: devotion
        value: -10
    - title_en: The Works Are Fully Licensed
      title_zh: 盐矿全面获准运营
      desc_en: The crown formally licenses the Wieliczka works as fully operational, its shafts, galleries, and hoists now running at a steady output that supplies markets far beyond Poland's borders. The mine's salt and its silent underground chapel both become sources of lasting royal pride.
      desc_zh: 王室正式将维利奇卡盐矿列为全面运营的产业，其井口、巷道与绞车如今稳定产出，供应远超波兰边境的各地市场。这座盐矿本身及其静谧的地下礼拜堂，从此皆成为王室长久引以为傲之物。
      cost:
      - type: scaled_gold
        value: -12
