      title_zh: 洋葱穹顶饰以异彩
      desc_en: Craftsmen crown each chapel with a bulbous dome, painting and gilding them in patterns of gold, green, and spiraled color that make the cathedral unlike anything else in Moscow.
      desc_zh: 工匠为每座礼拜堂加冠以浑圆穹顶，饰以金色、绿色与螺旋纹样，使这座座堂在莫斯科独树一帜。
      cost:
