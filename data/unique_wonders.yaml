    - title_en: The Forge Halls Are Raised
      title_zh: 锻炉厅落成
      desc_en: Stone walls rise around the first forge hall and its adjoining proofing yard where every blade will be tested. What was until now a charter and gathered ore now becomes hammers striking real anvils.
      desc_zh: 石墙在首座锻炉厅及其相邻的试剑场周围竖起，每一柄刀剑日后都将在此接受检验。此前不过是敕状与运来的矿石，如今已化作铁锤真正敲击铁砧的声响。
      cost:
      - type: army_tradition
        value: -2
    - title_en: The Secret of the Quench Is Perfected
      title_zh: 淬火秘法臻于至善
      desc_en: Smiths guard their exact methods of tempering and quenching the blade steel, passing the technique only from master to chosen apprentice. Toledo's blades begin to earn a reputation that outpaces every rival workshop.
      desc_zh: 铸匠严守淬火与回火钢刃的确切手法，只将此技传授于亲选的学徒。托莱多的刀剑之名，渐渐超越了一切竞争的工坊。
      cost:
      - type: honor
        value: -18
    - title_en: Every Blade Faces the Proof
      title_zh: 逐剑试炼
      desc_en: Inspectors bend each finished blade against a block in the proofing yard, and any that crack or fail to spring straight are broken and melted down again. Only blades that pass hang on the armory's racks.
      desc_zh: 检验官在试剑场上将每柄成剑抵住木块弯折试验，凡断裂或不能自行弹直者，皆被折断重炼。唯有通过试炼者，方能悬挂于兵器架上。
      cost:
      - type: army_tradition
        value: -3
    - title_en: Orders Arrive from Distant Campaigns
      title_zh: 远征军令催逼工坊
      desc_en: Urgent requisitions from armies far from Toledo strain the workshops past their normal pace, and smiths work through the night to meet the quota. Apprentices are pressed early into full duty at the forge.
      desc_zh: 来自远方战场的紧急军令令工坊超负荷运转，铸匠彻夜劳作以赶制配额。学徒也被提前推上锻炉，独当一面。
      cost:
      - type: manpower
        value: -30
    - title_en: Toledo Steel Arms the Realm
      title_zh: 托莱多钢铁武装全国
      desc_en: The armory now stands at full production, its blades and armor renowned from court to campfire across the realm. Every regiment that carries Toledo steel fights with a harder edge and a deeper reserve of men behind it.
      desc_zh: 军械坊如今已全力运转，其刀剑甲胄之名传遍朝堂与军营。每一支持有托莱多钢刃的部队，皆因此战意更坚，后备兵源也更为充实。
      cost:
      - type: honor
        value: -30
