    stages:
    - title_en: The Council Convenes at Lubeck
      title_zh: 吕贝克市议会开会
      desc_en: 'Lubeck''s council summons envoys from every league town to witness the proclamation: a new town hall shall rise beside the Marienkirche, grand enough to host the Hanse itself. Seals are affixed, and a diplomat is dispatched south with the news before the ink dries.'
      desc_zh: 吕贝克市议会召集同盟各城的使节前来见证宣告：一座新的市政厅将在圣马利亚教堂旁拔地而起，气派足以接待整个汉萨同盟。印玺当场加盖，墨迹未干，一名使节便已启程南下报讯。
      cost:
      - type: honor
        value: -10
    - title_en: Clearing the Market Square
      title_zh: 清理市集广场
      desc_en: Stalls and awnings are cleared from a corner of the market square to make room for the foundations. Burghers grumble about lost trading days, until the council reminds them whose charters will hang on the new chamber's walls.
      desc_zh: 市集广场一角的摊位和棚布被清空，为地基腾出空间。市民们抱怨少了几日生意，直到议会提醒他们：新议事厅的墙上，将挂着谁的特许状。
      cost:
      - type: scaled_gold
        value: -5
    - title_en: Gathering the Guild Charters
      title_zh: 汇集行会特许状
      desc_en: Master masons and city notaries gather the charters, seals, and trade privileges that will be housed in the new hall's vaults. A blessing is read over the foundation stone by the city's provost before it is set.
      desc_zh: 泥瓦匠师傅与城市公证人一同收集将要收藏于新厅地库中的特许状、印玺与贸易特权。奠基石落地之前，城市教长为其诵读祝词。
      cost:
      - type: legitimacy
        value: -12
    - title_en: The Gothic Facade Begins
      title_zh: 哥特式立面动工
      desc_en: Brick courses climb from the cleared square as masons lay out the pointed arches of a Gothic facade. The plan and the charter give way to scaffolding, mortar, and the daily clatter of trowels.
      desc_zh: 在清空的广场上，砖层逐渐垒起，泥瓦匠们开始砌筑哥特式立面的尖拱。图纸与特许状之外，脚手架、灰浆与泥刀的敲击声开始成为日常。
      cost:
      - type: scaled_gold
        value: -7
    - title_en: The Council Chamber Is Framed
      title_zh: 议事厅木构架立起
      desc_en: Carpenters raise the timber framing of the council chamber, wide enough to seat delegates from every member town along its benches. Stonemasons carve the merchant benches where disputes over toll and tariff will one day be settled.
      desc_zh: 木匠们架起议事厅的木构架，宽敞得足以容纳每座成员城市的代表就座长凳。石匠们雕琢商人座席，日后关于关税与商税的争端，将在此裁定。
      cost:
      - type: scaled_gold
        value: -9
    - title_en: Turrets and Glazed Tiles
      title_zh: 尖塔与彩釉瓦片
      desc_en: Slender brick turrets rise above the roofline, capped with glazed tiles that catch the light over the market square. Passersby stop to watch the tile-setters work, calling it the finest roof in the Baltic.
      desc_zh: 纤细的砖砌尖塔在屋脊之上耸立，覆以彩釉瓦片，在市集广场上熠熠生辉。路人驻足观看铺瓦匠的手艺，称赞这是波罗的海沿岸最精美的屋顶。
      cost:
      - type: cultural_influence
        value: -10
    - title_en: Envoys Fill the Antechambers
      title_zh: 使节挤满前厅
      desc_en: Even before the final plasterwork dries, envoys and factors from league towns begin filling the antechambers, eager to be first to lodge a petition in the new hall. The council orders extra benches carved to meet the demand.
      desc_zh: 最后一层灰泥尚未干透，来自同盟各城的使节和代理商便已挤满前厅，争相第一个在新厅递交请愿书。议会不得不下令加雕座椅以应付需求。
      cost:
      - type: diplomats
        value: -1
    - title_en: The Town Hall Is Consecrated
      title_zh: 市政厅落成典礼
      desc_en: Bells ring from the Marienkirche as the town hall is formally consecrated, its council chamber seated and its charter vaults sealed. From this day, Lubeck's voice carries further in every league negotiation, and the crown's envoys are received with new deference across the Hanse.
