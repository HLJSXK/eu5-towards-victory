      title_zh: 查理曼颁旨建礼拜堂
      desc_en: The Frankish king declares that a palatine chapel shall rise beside his court at Aachen's warm springs, one fit to crown both his faith and his empire.
      desc_zh: 法兰克国王宣布，将于亚琛温泉旁的宫廷之侧建起一座宫廷礼拜堂，既彰其信仰，也冠其帝业。
      cost:
      - type: legitimacy
        value: -12
    - title_en: Odo of Metz Draws the Octagon
      title_zh: 奥多·冯·梅斯绘出八角图
      desc_en: The court architect presents a design for an eight-sided chapel unlike any north of the Alps, drawing on Ravenna's churches for its bones.
      desc_zh: 宫廷建筑师呈上设计，一座阿尔卑斯以北前所未见的八角礼拜堂，其骨架借鉴了拉文纳诸教堂的形制。
      cost:
      - type: cultural_influence
        value: -8
    - title_en: Marble Is Brought from Rome
      title_zh: 大理石自罗马运来
      desc_en: Columns of porphyry and marble are carried north from Rome and Ravenna at the emperor's order, and masons prepare foundations to receive stone never before seen in the Frankish lands.
      desc_zh: 遵皇帝之命，斑岩与大理石立柱自罗马与拉文纳一路北运，匠人也备好地基，迎接这从未见于法兰克土地的石料。
      cost:
