      value: 10
    - type: tribal_cohesion
      value: 10
    stages:
    - title_en: The Mambo Proclaims the Stone City's Growth
      title_zh: 曼博宣告石城扩建
      desc_en: The ruling Mambo summons the master builders of dry stone to declare that Great Zimbabwe's walls shall rise higher and wider still, binding gold traders from the coast to the cattle chiefs of the highland plateau under one royal enclosure. Messengers carry the word to the outlying chiefdoms that tribute in labor is now due.
      desc_zh: 统治的曼博召集干砌石艺的营造大师，宣告大津巴布韦的城墙将再度加高加宽，将沿海的黄金商贾与高原上的牧牛酋长一同纳入这座王家石垣之内。信使将征役劳力的旨意传达至各附属酋邦。
      cost:
      - type: tribal_cohesion
        value: -8
    - title_en: The Quarries of the Hills Are Opened
      title_zh: 山中采石场开启
      desc_en: Granite exfoliates naturally from the hills above the valley, and teams of stoneworkers begin splitting the great sheets along their natural grain, a craft passed down through generations without benefit of mortar. Cattle drivers bring tribute herds to feed the growing camps of laborers.
      desc_zh: 河谷上方的山丘自然剥落出片片花岗岩，石匠队伍开始沿其天然纹理劈开巨石，这门无需灰浆的技艺，历经数代口传心授。赶牛人驱赶纳贡的牛群，前来供养日益壮大的劳工营地。
      cost:
      - type: scaled_gold
        value: -5
    - title_en: The Diviners Choose the New Line
      title_zh: 占卜者定新线
      desc_en: Spirit mediums and the Mambo's own counselors walk the hilltop and valley together, casting bones to determine where the new curved walls must run to honor the ancestors watching from the conical tower's shadow. Cattle are slaughtered in offering before the first granite block is set upon the old foundation.
      desc_zh: 灵媒与曼博的谋臣一同踏勘山顶与谷地，掷骨占卜以定新弧形城墙应循何径，方能告慰锥形塔阴影下注视的祖灵。在第一块花岗岩石块砌上旧地基之前，牛只被宰杀献祭。
      cost:
      - type: devotion
        value: -10
    - title_en: The Great Enclosure's Walls Rise Anew
      title_zh: 大围场城墙重新崛起
      desc_en: Stoneworkers begin fitting granite blocks without mortar along the marked curve of the Great Enclosure, each course settling by weight and craft alone into the beginnings of the city's most imposing wall. What was divination and tribute now becomes stone rising course by course under skilled hands.
      desc_zh: 石匠们开始沿大围场标定的弧线，将花岗岩石块无灰浆地砌合，每一层皆仅凭重量与工艺自然稳固，渐成这座城市最雄伟城墙的雏形。此前的占卜与纳贡，如今在巧匠之手下化作层层垒起的石墙。
      cost:
      - type: manpower
        value: -30
    - title_en: The Conical Tower Grows
      title_zh: 锥形塔渐次增高
      desc_en: The solid conical tower within the Great Enclosure rises tier by tier, its purpose known only to the Mambo's priesthood, said to echo the granaries of royal wealth or the horns of royal cattle. Traders from the coast arrive to marvel at walls taller than any they have seen inland.
      desc_zh: 大围场内的实心锥形塔一层层增高，其真正用途唯有曼博的祭司阶层知晓，或说象征王室粮仓，或喻王室牛群之角。来自沿海的商贾抵达此地，为这远胜其在内陆所见的高墙而惊叹。
      cost:
      - type: cultural_influence
        value: -8
    - title_en: The Passages Are Cut Between the Walls
      title_zh: 内外墙间凿通夹道
      desc_en: Narrow stone passages are cut between the inner and outer walls of the Great Enclosure, their curves deliberately concealing the interior from any who have not been granted the right to enter. Gold, glass beads, and Chinese porcelain begin arriving in tribute from the trade routes the Mambo now commands.
      desc_zh: 大围场内外墙之间开凿出狭窄的石砌夹道，其弯曲走向刻意遮蔽内部景象，非获准之人不得窥见。黄金、玻璃珠与中国瓷器，开始沿着曼博如今掌控的贸易路线，作为贡品源源而来。
      cost:
      - type: gold
        value: -80
    - title_en: The Hill Complex Is Linked to the Valley
      title_zh: 山丘建筑群与谷地相连
      desc_en: Stairways and terraced walls are cut into the granite hillside to connect the ancient Hill Complex to the valley enclosures below, binding the old seat of spiritual authority to the new center of royal and mercantile power. The city's full extent now sprawls across hill and valley alike, unmatched on the plateau.
      desc_zh: 阶梯与梯台式石墙凿入花岗岩山坡，将古老的山丘建筑群与下方谷地围场连为一体，把旧日的灵性权威中心与新兴的王权商贸中心紧密相系。这座城市的规模如今横跨山谷，遍及整片高原，无出其右。
      cost:
      - type: scaled_gold
        value: -9
    - title_en: Great Zimbabwe Stands Complete
      title_zh: 大津巴布韦竣工屹立
      desc_en: The Mambo presides over a great gathering of cattle tribute and gold offerings within the finished Great Enclosure, its walls now the tallest dry-stone structure south of the Sahara. Traders and chiefs alike proclaim the city the undisputed heart of gold and cattle wealth across the plateau, its walls a permanent seal upon the Mambo's authority.
      desc_zh: 曼博在竣工的大围场内，主持一场牛只贡赋与黄金献礼的盛大集会，这道城墙如今已是撒哈拉以南最高的干砌石构。商贾与酋长们齐声宣告，这座城市已是高原上黄金与牛群财富无可争议的核心，其城墙将曼博的权威永久铭刻其中。
      cost:
      - type: scaled_gold
        value: -12
      - type: gold
        value: -100
