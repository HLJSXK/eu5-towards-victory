    stages:
    - title_en: The Crown Orders the Yard Enlarged
      title_zh: 王室下令扩建船坞
      desc_en: The Admiralty petitions the Crown for a dockyard at Portsmouth worthy of a fleet meant to rule the Channel, and royal surveyors are sent to mark out ground for new dry docks, ropewalks, and storehouses along the harbor. Shipwrights and riggers begin arriving from yards up and down the coast.
      desc_zh: 海军部向王室请愿，欲在朴茨茅斯建造一座配得上称霸海峡舰队的船坞，王室测量员随即前往港口沿岸勘定新建干船坞、制绳车间与仓库的用地。船匠与索具工陆续从沿海各船厂赶来。
      cost:
      - type: prestige
        value: -12
    - title_en: Timber and Hemp Are Called to the Harbor
      title_zh: 木材麻绳汇聚港口
      desc_en: Convoys of oak timber from royal forests and hemp from inland ropewalks arrive at the harbor to stock the yards before a single dock is dug, while masons begin quarrying stone for the dry dock walls. Naval clerks set up the first ledgers to track every plank and coil.
      desc_zh: 满载来自王室林场的橡木与内陆制绳厂麻绳的车队陆续抵达港口，在任何一座船坞动工之前先行囤积物资，石匠也开始为干船坞墙壁开采石料。海军文书建立起最早的账册，登记每一块木板与每一捆绳索。
      cost:
      - type: gold
        value: -80
    - title_en: The King's Yard Is Marked Out
      title_zh: 国王船坞正式奠基
      desc_en: Officials process along the harbor to formally consecrate the ground of the King's Yard, and the plan is finalized for dry docks, victualling stores, and the great ropewalk that will stretch the length of a warship's cable. Contracts are sealed with master shipwrights to oversee each stage of the work.
      desc_zh: 官员们沿港口列队而行，正式为国王船坞的用地举行开工仪式，干船坞、军需仓库与将拉伸至战舰缆绳长度的巨大制绳车间的规划就此敲定。合同与总船匠签订，负责监督工程各阶段。
      cost:
      - type: honor
        value: -15
    - title_en: The First Dry Dock Is Cut
      title_zh: 首座干船坞开凿
      desc_en: Laborers finally break ground on the first true dry dock, cutting down through harbor mud and clay toward bedrock so its gates can hold back the tide. What was surveyed line and stacked timber now becomes an excavation deep enough to cradle a warship's hull.
      desc_zh: 劳工终于在第一座真正的干船坞上破土动工，向下挖穿港口的淤泥与黏土直至基岩，以便闸门足以挡住潮水。曾经只是勘测线与堆放的木材，如今化作深足以承托战舰船体的巨大凹坑。
      cost:
      - type: manpower
        value: -30
    - title_en: The Ropewalk Stretches Its Length
      title_zh: 制绳车间延展成形
      desc_en: The great ropewalk rises as a single long shed stretching the length of a ship of the line's longest cable, spinners feeding hemp into the twisting machines from dawn to dusk. Cannon foundries nearby begin casting the first guns meant for ships not yet laid down.
      desc_zh: 巨大的制绳车间拔地而起，其长度足以容纳一艘主力舰最长缆绳的整条制绳工序，纺绳工人自晨至暮不停地将麻纤维送入绞绳机。附近的铸炮厂也开始为尚未安放龙骨的战舰铸造第一批火炮。
      cost:
      - type: navy_tradition
        value: -2
    - title_en: Dry Docks Multiply Along the Harbor
      title_zh: 干船坞沿港口增设
      desc_en: A second and third dry dock are cut and gated along the waterfront, their stone walls faced and pumps installed to keep them clear of the tide. The victualling yard's storehouses fill with salt beef, biscuit, and beer against the day the fleet must sail on short notice.
      desc_zh: 沿岸又开凿并装闸了第二座、第三座干船坞，石砌墙壁完工，抽水泵也已安装以防潮水倒灌。军需仓库堆满咸牛肉、硬饼干与啤酒，以备舰队随时需要即刻起航。
      cost:
      - type: gold
        value: -120
    - title_en: The Yard Musters for the Fleet
      title_zh: 船坞为舰队集结
      desc_en: The finished dockyard fits out its first warships stem to stern, guns hoisted aboard from the cannon stores and rigging run through blocks from the new ropewalk, while a full muster of the fleet gathers in the harbor to test the yard's readiness. Officers pronounce the yard capable of arming a fleet against any invasion fleet that dares the Channel.
      desc_zh: 竣工的船坞从船艏到船艉为首批战舰完成舾装，火炮从军械库吊装上舰，索具经新制绳车间穿过滑轮组装，舰队在港内举行全员集结，检验船坞的战备状态。军官们宣告，此船坞足以武装一支舰队，抵御任何胆敢来犯海峡的入侵舰队。
      cost:
      - type: sailors
        value: -130
    - title_en: The Fleet Sails from a Finished Yard
      title_zh: 舰队自竣工船坞启航
      desc_en: The Admiralty declares the dockyard complete as a full squadron sails out past its dry docks and storehouses in review, guns saluting from the harbor forts and crowds gathering along the walls to watch. Portsmouth's yard now stands as the permanent forge of the nation's naval power, arming and provisioning fleets for as long as the Crown holds the sea.
      desc_zh: 一支完整的分舰队驶过干船坞与仓库接受检阅之际，海军部宣告船坞全面竣工，港口炮台鸣炮致敬，人群聚集在城墙边观看盛况。朴茨茅斯船坞自此成为国家海权的永久熔炉，只要王室仍称霸海洋，便将持续武装并补给舰队。
