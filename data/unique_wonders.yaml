      desc_zh: 石匠砌起外墙与帝王门的第一层石基，宫殿自此开始呈现出日后层层庭院相套的格局。
      cost:
      - type: gold
        value: -50
    - title_en: Kitchens and Council Hall Take Shape
      title_zh: 御膳房与议事厅并起
      desc_en: The sprawling palace kitchens rise beside the Divan's council hall, the second courtyard filling with the buildings that will run the empire's daily business.
      desc_zh: 庞大的御膳房在迪万议事厅一侧拔地而起，第二进庭院逐渐布满将主理帝国日常政务的各处建筑。
      cost:
      - type: manpower
        value: -55
    - title_en: Tiled Kiosks Overlook the Golden Horn
      title_zh: 瓷砖凉阁俯瞰金角湾
      desc_en: Tiled pavilions and kiosks are raised along the palace's edge overlooking the Golden Horn, their painted eaves catching the light off the water below.
      desc_zh: 镶嵌瓷砖的凉亭与阁楼沿宫墙边缘筑起，俯瞰金角湾水色，彩绘檐角映照着水面反射的光影。
      cost:
