        value: -10
    - title_en: The Brewhouse Walls Rise
      title_zh: 酿酒坊墙体拔地而起
      desc_en: Masons lay the first courses of the brewhouse walls around the courtyard, thick enough to hold the heat of the kettle fires through a Bavarian winter. What began as decrees and malt sacks now takes the shape of a working hall.
      desc_zh: 泥瓦匠在庭院四周砌起酿酒坊的第一层墙体，墙壁之厚足以在巴伐利亚的严冬中留住炉火的热气。曾经只是诏令与麦芽袋的构想，如今已具备了一座作坊的雏形。
