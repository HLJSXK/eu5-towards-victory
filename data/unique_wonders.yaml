      title_zh: 赤土香柏陆续运抵
      desc_en: Local red clay is fired into the bricks that will give the fortress its name, while cedar beams and lime plaster are gathered from the surrounding hills.
      desc_zh: 当地赭红陶土被烧制成砖，日后城堡之名便由此而来，周边山地也源源运来香柏木梁与石灰灰泥。
      cost:
