      has_variable = tv_wonder_ceremony_stage
      var:tv_wonder_ceremony_stage ?= 8
    completion_effect_script: ''
    timed:
      years: 1
      burden_modifier: {}
      blessing_modifier: {}
    auxiliary_building:
      local_modifier: {}
      maintenance: null
      build_time: null
      construction_demand: null
      price: null
      attributes: {}
      max_levels: 6
  ceremony:
    stage_1_reward:
    - type: devotion
      value: 20
    - type: religious_influence
      value: 10
    - type: prestige
      value: 10
    stages:
    - title_en: A Dome Is Decreed Over the Rock
      title_zh: 圣石之上，穹顶降诏
      desc_en: Caliph Abd al-Malik decrees that a golden dome shall rise over the Foundation Stone atop the Haram, and criers carry word through the markets of Jerusalem before the sun sets.
      desc_zh: 哈里发阿卜杜勒-马利克降下诏令，命人在圣殿山的磐石之上竖起金顶，传令官尚未走遍市集，消息已传遍耶路撒冷全城。
      cost:
      - type: prestige
        value: -15
    - title_en: The Platform Is Cleared and Blessed
      title_zh: 高台清理，众僧同祝
      desc_en: Workmen sweep the ancient platform clean of rubble while imams and local clergy walk its perimeter together, blessing the stone the dome will crown.
      desc_zh: 工匠清扫圣殿山高台上的残砾瓦砾，伊玛目与当地教士并肩绕行台边，为即将加顶的磐石诵念祝辞。
      cost:
      - type: devotion
        value: -10
    - title_en: Marble and Gold Are Gathered
      title_zh: 大理石与金箔运抵
      desc_en: Columns and marble slabs are stripped from ruined Byzantine halls across the province, while caravans bring gold leaf and cedar beams up the road to Jerusalem.
      desc_zh: 各地拜占庭旧殿的石柱与大理石板被拆运而来，驮队沿山道将金箔与香柏木运入耶路撒冷，为工程备料。
      cost:
      - type: scaled_gold
        value: -6
    - title_en: The Octagon Rises Around the Rock
      title_zh: 八角回廊环石而起
      desc_en: Masons lay the first ring of the octagonal arcade directly around the sacred stone, and for the first time the shape of the dome to come is visible from the streets below.
      desc_zh: 石匠沿圣石四周砌起八角形回廊的第一圈墙基，穹顶的轮廓自此第一次能从山下街巷望见。
      cost:
      - type: artwork
        value: 1
    - title_en: The Double Ambulatory Takes Shape
      title_zh: 内外回廊次第合拢
      desc_en: Inner and outer arcades of marble columns close around the Rock, their arches carrying the weight that will one day bear the great wooden dome above.
      desc_zh: 内外两重大理石列柱回廊在磐石周围合拢，拱券承起重量，为日后架设巨大木质穹顶预留支撑。
      cost:
      - type: gold
        value: -80
    - title_en: Mosaics and Verses Cover the Walls
      title_zh: 马赛克与经文缠绕四壁
      desc_en: Craftsmen set glass mosaics of vines and crowns along the drum, while calligraphers begin the long band of Quranic verse that will circle the interior.
      desc_zh: 匠人在鼓座上镶嵌葡萄藤与冠冕图案的玻璃马赛克，书法家开始镌刻那圈将环绕殿内一周的古兰经文。
      cost:
      - type: artwork
        value: 1
    - title_en: The Dome Is Gilded
      title_zh: 盛夏为穹顶铺金
      desc_en: Sheets of gold are hammered over the wooden dome in the height of summer, and pilgrims already gather at the gates to watch it catch the light before the scaffolding comes down.
      desc_zh: 盛夏时节，工匠将一片片金箔锤打覆于木质穹顶之上，脚手架尚未拆除，朝圣者已聚在门前，只为看那金光初现。
      cost:
      - type: religious_influence
        value: -20
    - title_en: The Dome Is Consecrated
      title_zh: 穹顶落成，圣光及国
      desc_en: With scaffolding gone and the gold dome catching the Jerusalem sun, the platform is consecrated before a gathered crowd, and the Rock's light is said to touch the whole realm from this day on.
      desc_zh: 脚手架尽数拆除，金顶在耶路撒冷的阳光下熠熠生辉，圣殿高台在众人见证下举行祝圣大典，据说自此圣石之光将泽及全国。
      cost:
      - type: artwork
        value: 1
      - type: prestige
        value: -45
