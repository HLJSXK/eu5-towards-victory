      desc_en: A solemn charter is sealed declaring Jerusalem's sacred precincts inviolable, promising protection to every gate, quarter, and shrine within its ancient walls.
      desc_zh: 一份庄严的敕令被正式封印，宣告耶路撒冷的圣地不容侵犯，承诺保护古城墙内每一座城门、街区与圣所。
      cost:
