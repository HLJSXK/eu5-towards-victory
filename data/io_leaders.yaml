# IO leader data for tv_io_leader_actions.txt
# Each entry generates 3 generic_actions: tv_appoint_<id>_leader, tv_remove_<id>_leader, tv_change_<id>_leader
# char_filter: extra lines inside the visible = {} block of the character selector
# character_column: attribute column used by the character selector; defaults to character_info
ios:
  - id: arts              # generates tv_appoint_arts_leader, tv_remove_arts_leader, tv_change_arts_leader
    display_name: Arts Exhibition
    io_type: tv_arts_exhibition
    member_var: tv_arts_exhibition_member
    leader_var: tv_arts_exhibition_leader_char
    select_name: tv_select_arts_leader
    no_leader_msg: tv_no_arts_leader_available
    title_modifier: tv_chief_artist_role_modifier
    title_loc_key: character_title_tv_chief_artist
    character_column: character_artist
    char_filter: |
      is_adult = yes
      is_artist = yes
      custom_tooltip = {
      	text = TV_HAS_VARIABLE_NOT_SET_TT
      	NOT = { has_variable = tv_on_exhibition }
      }

  - id: alliance          # generates tv_appoint_alliance_leader, tv_remove_alliance_leader, tv_change_alliance_leader
    display_name: Diplomatic Alliance
    io_type: tv_diplomatic_alliance
    member_var: tv_diplomatic_alliance_member
    leader_var: tv_diplomatic_alliance_leader_char
    select_name: tv_select_alliance_leader
    no_leader_msg: tv_no_alliance_leader_available
    char_filter: |
      is_adult = yes

  - id: academy           # generates tv_appoint_academy_leader, tv_remove_academy_leader, tv_change_academy_leader
    display_name: Academy of Sciences
    io_type: tv_academy_of_sciences
    member_var: tv_academy_io_member
    leader_var: tv_academy_leader_char
    select_name: tv_select_academy_leader
    no_leader_msg: tv_no_academy_leader_available
    title_modifier: tv_chief_scientist_role_modifier
    title_loc_key: character_title_tv_chief_scientist
    on_appoint_effect: |
      tv_update_chief_scientist_effective_adm_effect = yes
      set_variable = { name = tv_med_disp_adm value = var:tv_scientist_effective_adm }
      set_variable = { name = tv_med_disp_dip value = var:tv_academy_leader_char.dip }
      set_variable = { name = tv_med_disp_mil value = var:tv_academy_leader_char.mil }
    on_remove_effect: |
      set_variable = { name = tv_scientist_effective_adm value = 0 }
      set_variable = { name = tv_med_disp_adm value = 0 }
      set_variable = { name = tv_med_disp_dip value = 0 }
      set_variable = { name = tv_med_disp_mil value = 0 }
    on_change_after_effect: |
      tv_update_chief_scientist_effective_adm_effect = yes
      set_variable = { name = tv_med_disp_adm value = var:tv_scientist_effective_adm }
      set_variable = { name = tv_med_disp_dip value = var:tv_academy_leader_char.dip }
      set_variable = { name = tv_med_disp_mil value = var:tv_academy_leader_char.mil }
    char_filter: |
      is_adult = yes
      NOT = { is_artist = yes }
      OR = {
        is_female = no
        scope:actor = {
          any_international_organizations_member_of = {
            international_organization_type = international_organization_type:tv_academy_of_sciences
            leader_country ?= scope:actor
            international_organization_has_policy = policy:tv_academy_leader_gender_unrestricted_policy
          }
        }
      }

  - id: engineering        # generates tv_appoint_engineering_leader, tv_remove_engineering_leader, tv_change_engineering_leader
    display_name: Engineering Department
    io_type: tv_engineering_department
    member_var: tv_engineering_department_member
    leader_var: tv_great_engineer_char
    select_name: tv_select_engineering_leader
    no_leader_msg: tv_no_engineering_leader_available
    title_modifier: tv_great_engineer_role_modifier
    title_loc_key: character_title_tv_great_engineer
    on_appoint_effect: |
      tv_engineering_on_great_engineer_appointed_effect = yes
    on_remove_effect: |
      tv_engineering_on_great_engineer_removed_effect = yes
    on_change_after_effect: |
      tv_engineering_on_great_engineer_appointed_effect = yes
    char_filter: |
      is_adult = yes
      NOT = { is_artist = yes }

  - id: conquest_general  # generates tv_appoint_conquest_general_leader, tv_remove_conquest_general_leader, tv_change_conquest_general_leader
    display_name: "Governor's House - Grand General"
    io_type: tv_govhouse
    member_var: tv_govhouse_member
    leader_var: tv_conquest_general_char
    select_name: tv_select_grand_general
    no_leader_msg: tv_no_grand_general_available
    title_modifier: tv_grand_general_role_modifier
    title_loc_key: character_title_tv_grand_general
    on_appoint_effect: |
      tv_govhouse_reset_power_consolidation_effect = yes
    on_remove_effect: |
      tv_govhouse_pay_grand_general_replacement_cost_effect = yes
      hidden_effect = {
        tv_training_clear_effect = yes
        tv_govhouse_clear_war_tent_effect = yes
        tv_govhouse_reset_power_consolidation_effect = yes
      }
    on_change_effect: |
      tv_govhouse_pay_grand_general_replacement_cost_effect = yes
      hidden_effect = {
        tv_training_clear_effect = yes
        tv_govhouse_clear_war_tent_effect = yes
        tv_govhouse_reset_power_consolidation_effect = yes
      }
    char_filter: |
      is_adult = yes
      is_female = no
      is_artist = no
