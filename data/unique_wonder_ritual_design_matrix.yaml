  - atom_17
  - atom_27
  proposed_core_mechanic: 'Institutionalize Hagia Sophia by keeping a synaxis register of clergy, imperial officials, relic access, and public order, then settle the final doctrinal hearing under the dome.'
  player_agency_model: 'The player balances monthly register work with a decisive hearing that chooses whether imperial officers, clergy, or public procession defines the opening.'
