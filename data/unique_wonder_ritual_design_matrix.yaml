  - progress_track
  - checklist
  - incident_log
  expected_capabilities:
  - event_chain
  - monthly_progress
  - listener_gate
  - retry_branch
  - final_reward_handoff
  expected_listeners:
  - monthly
  non_monthly_validation_point: After the monthly register phase, the player must resolve a visible public hearing or rededication event before the reward handoff.
  risk_or_failure_branch: 'A stalled register or doctrinal challenge suspends the rite until the player disciplines a faction, pays for a public synaxis, or accepts a narrower consecration.'
  implementation_feasibility: current_harness_ready
  uniqueness_notes: 'The monthly portion is justified by Hagia Sophia as a living imperial church administration; most wonders do not bind dome acoustics, relic access, clergy discipline, and street processions into one institution.'
