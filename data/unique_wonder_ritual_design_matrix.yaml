metadata:
  purpose: Planning-only global mechanism matrix for full-corpus Unique Wonder Ritual authoring.
  source_data:
  - data/unique_wonders.yaml
  - data/wonders.yaml
  - data/wonder_localization.yaml
  - docs/guides/Unique_Wonder_Ritual_Design_Prompt_Library.md
  generated_game_code: false
  authoring_policy: This matrix is an editable pre-spec planning surface. It is not a formal ritual spec and must not be consumed as loadable EU5 code.
  safe_seed_policy: Initial entries copy only discovered facts from local data; blank mechanism fields are not frozen design decisions.
  coverage_source: data/unique_wonders.yaml
  allowed_implementation_feasibility:
  - current_harness_ready
  - needs_trigger_check_only
  - needs_new_capability
  - needs_new_listener
  - needs_eu5_verification
  - blocked
  allowed_authoring_status:
  - unassigned
  - drafted
  - reviewed
  - frozen
  supported_listener_policy: expected_listeners must use only monthly, ruler_death, pre_winning_war, ending_war, and auxiliary_building_completion.
  freeze_policy: 'Set authoring_status: frozen only after the global matrix audit is clean enough for full-corpus spec authoring.'
unique_wonders:
- wonder_id: 101
  wonder_key: unique_pharos_lighthouse
  wonder_name: Pharos Lighthouse
  base_wonder_type: great_lighthouse
  category: infrastructure_category
  location: alexandria
  culture: null
  religion: null
  region: null
  historical_design_hook: A tower of white stone rises from the Alexandrian harbor, turning royal ambition into a light that sailors can trust.
  primary_cadence_type: hybrid
  secondary_cadence_type: route_certification
  cadence_rationale: Hybrid pacing fits because A tower of white stone rises from the Alexandrian harbor, turning royal ambition into a light that sailors can trust; the wonder combines route, resource, actor, or crisis proof and should not collapse into one safe template.
  mechanic_prompt_atoms:
  - atom_06
  - atom_07
  - atom_14
  - atom_30
  proposed_core_mechanic: 'Certify the Pharos by assigning a harbor pilot, lighting the beacon for a named sea lane, and resolving the first navigation incident before the lighthouse claim is trusted.'
  player_agency_model: 'The player chooses the pilotage authority and the first route to certify, then decides whether to spend supplies, accept delay, or risk unsafe passage.'
  expected_ui_model:
  - route_map
  - incident_log
  - actor_slots
  expected_capabilities:
  - event_chain
  - retry_branch
  - final_reward_handoff
  - route_gate
  - actor_assignment
  expected_listeners:
  - monthly
  non_monthly_validation_point: 'The non-monthly proof is the selected pilot route and its first incident resolution, not the supporting monthly harbor preparation.'
  risk_or_failure_branch: 'Privateers, bad lamp oil, or a failed pilot report can leave a route uncertified until the player reroutes traffic or funds a stronger beacon watch.'
  implementation_feasibility: current_harness_ready
  uniqueness_notes: 'This loop needs a coastal beacon that turns light, pilots, and named sea lanes into state power; inland temples, palaces, or ordinary ports cannot make navigation visibility itself the proof.'
  similarity_group: composite_actor_route_incident
  authoring_status: drafted
