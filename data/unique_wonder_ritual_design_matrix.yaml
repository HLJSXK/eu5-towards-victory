  primary_cadence_type: monthly_institutionalization
  secondary_cadence_type: actor_assignment
  cadence_rationale: Monthly institutionalization fits because The rebuilt dome gathers gold, marble, incense, and imperial memory beneath a vault that seems to float; periodic administration is the subject, but completion still requires a non-monthly public validation.
  mechanic_prompt_atoms:
