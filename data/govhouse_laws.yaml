# Governor's House law categories for tv_govhouse_laws.txt.
# Structure: Governor's House policy laws plus Local Governor Function laws.
# All laws use IO policy votes, following the Academy of Sciences pattern.
#
# DO NOT hand-edit generated output files. Run:
#   conda run --no-capture-output -n eu5 python scripts/in_game/common/laws/gen_tv_govhouse_laws.py

law_category: tv_govhouse_laws
io_type: tv_govhouse

laws:
  - id: tv_govhouse_expedition_goal_law
    display_comment: "LAW 1: Expedition Goal"
    policies:
      - id: tv_govhouse_trade_posts_policy
        display_comment: "Trade Posts (default)"
        default: true
        country_modifier: |
          global_foreign_build_buildings_cost = -0.10
          trade_sea_efficiency = 0.10
          global_trade_center_power = 0.10
          naval_range_modifier = 0.10
          global_burghers_estate_power = 0.10
          global_max_control = -0.025
      - id: tv_govhouse_conquest_colony_policy
        display_comment: "Conquest Colony"
        country_modifier: |
          tax_income_efficiency = 0.03
          global_garrison_size_modifier = 0.10
          monthly_rebel_growth = 0.0005
          global_bureaucracy_maintenance_cost_modifier = 0.10
      - id: tv_govhouse_frontier_settlement_policy
        display_comment: "Frontier Settlement"
        country_modifier: |
          colonial_migration_size_modifier = 0.15
          global_population_growth = 0.00025
          global_pop_assimilation_speed_modifier = 0.10
          global_monthly_prosperity = 0.0005
          tax_income_efficiency = -0.05
      - id: tv_govhouse_tributary_system_policy
        display_comment: "Tributary System"
        country_modifier: |
          subject_income_modifier = 0.10
          diplomatic_reputation = 1
          global_bureaucracy_maintenance_cost_modifier = -0.10
          subject_loyalty = -5
          global_monthly_control = -0.001

  - id: tv_govhouse_governor_appointment_law
    display_comment: "LAW 2: Governor Appointment"
    policies:
      - id: tv_govhouse_royal_appointment_policy
        display_comment: "Royal Appointment (default)"
        default: true
        country_modifier: |
          monthly_legitimacy = 0.10
          global_monthly_control = 0.001
          global_estate_target_satisfaction = -0.025
      - id: tv_govhouse_hereditary_nobility_policy
        display_comment: "Hereditary Nobility"
        country_modifier: |
          global_nobles_estate_power = 0.50
          nobles_estate_target_satisfaction = 0.05
      - id: tv_govhouse_merchant_tax_farming_policy
        display_comment: "Merchant Tax Farming"
        country_modifier: |
          global_burghers_estate_power = 0.50
          trade_income = 0.10
      - id: tv_govhouse_military_land_grants_policy
        display_comment: "Military Land Grants"
        country_modifier: |
          siege_ability = 0.10
          monthly_army_tradition = 0.05
          monthly_legitimacy = -0.05

  - id: tv_govhouse_local_autonomy_law
    display_comment: "LAW 3: Local Autonomy"
    policies:
      - id: tv_govhouse_strict_direct_rule_policy
        display_comment: "Strict Direct Rule (default)"
        default: true
        country_modifier: |
          tax_income_efficiency = 0.03
          global_monthly_control = 0.002
          global_estate_target_satisfaction = -0.025
          monthly_rebel_growth = 0.0005
      - id: tv_govhouse_limited_autonomy_policy
        display_comment: "Limited Autonomy"
        country_modifier: |
          global_estate_target_satisfaction = 0.025
          global_production_efficiency = 0.05
          global_monthly_prosperity = 0.0005
          tax_income_efficiency = -0.05
          global_monthly_control = -0.001
      - id: tv_govhouse_chartered_colonies_policy
        display_comment: "Chartered Colonies"
        country_modifier: |
          colonial_migration_size_modifier = 0.25
          global_foreign_build_buildings_cost = -0.10
          global_burghers_estate_power = 0.50
      - id: tv_govhouse_vassal_autonomy_policy
        display_comment: "Vassal Autonomy"
        country_modifier: |
          monthly_rebel_growth = -0.0005
          global_pop_assimilation_speed_modifier = -0.40
          global_pop_conversion_speed_modifier = -0.40

  - id: tv_govhouse_religious_mission_law
    display_comment: "LAW 4: Religious Mission"
    policies:
      - id: tv_govhouse_secular_governance_policy
        display_comment: "Secular Governance (default)"
        default: true
        country_modifier: |
          tolerance_heathen = 1
          tolerance_heretic = 1
          global_pop_conversion_speed_modifier = -0.20
      - id: tv_govhouse_official_mission_policy
        display_comment: "Official Mission"
        country_modifier: |
          global_pop_conversion_speed_modifier = 0.20
          global_clergy_estate_power = 0.10
          diplomatic_reputation = -1
      - id: tv_govhouse_religious_orders_policy
        display_comment: "Religious Orders"
        country_modifier: |
          global_pop_conversion_speed_modifier = 0.40
          land_morale_modifier = 0.05
          clergy_estate_target_satisfaction = 0.025
          global_clergy_estate_power = 0.50
      - id: tv_govhouse_religious_tolerance_policy
        display_comment: "Religious Tolerance"
        country_modifier: |
          tolerance_heathen = 2
          tolerance_heretic = 2
          global_pop_conversion_speed_modifier = -0.40

  - id: tv_govhouse_frontier_military_law
    display_comment: "LAW 5: Frontier Military"
    policies:
      - id: tv_govhouse_regular_garrison_policy
        display_comment: "Regular Garrison (default)"
        default: true
        country_modifier: |
          discipline = 0.025
          global_garrison_size_modifier = 0.10
          global_defensive = 0.05
          army_maintenance_efficiency = -0.10
      - id: tv_govhouse_local_militia_policy
        display_comment: "Local Militia"
        country_modifier: |
          levy_maintenance_modifier = -0.10
          global_army_levy_size_modifier = 0.10
          global_monthly_control = -0.001
          global_soldiers_pop_growth = 0.25
          monthly_rebel_growth = 0.0005
      - id: tv_govhouse_military_colonies_policy
        display_comment: "Frontier Military Colonies"
        country_modifier: |
          global_monthly_control = 0.002
          global_monthly_prosperity = 0.0005
          global_soldiers_pop_growth = 0.25
          global_estate_target_satisfaction = -0.025
      - id: tv_govhouse_mercenary_system_policy
        display_comment: "Mercenary System"
        country_modifier: |
          mercenary_maintenance_efficiency = 0.10
          mercenary_range_modifier = 0.25
          army_movement_speed = 0.05
          monthly_war_exhaustion = 0.025

  - id: tv_govhouse_imperial_integration_law
    display_comment: "LAW 6: Imperial Integration"
    policies:
