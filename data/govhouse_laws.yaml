          global_estate_target_satisfaction = 0.025
          global_monthly_prosperity = 0.0005
          subject_income_modifier = -0.10
          tax_income_efficiency = -0.05
      - id: tv_govhouse_imperial_province_policy
        display_comment: "Imperial Provinces"
        country_modifier: |
          global_pop_assimilation_speed_modifier = 0.15
          global_integration_speed_modifier = 0.15
          global_monthly_development = 0.001
          global_bureaucracy_maintenance_cost_modifier = 0.20
      - id: tv_govhouse_plunder_evacuate_policy
        display_comment: "Plunder and Evacuate"
        country_modifier: |
          global_production_efficiency = 0.10
          global_monthly_prosperity = -0.001
          global_monthly_control = -0.002
          global_integration_speed_modifier = -0.20

  - id: tv_govhouse_administrative_function_law
    law_category: tv_govhouse_governor_functions
    display_comment: "LAW 7: Local Governor Administrative Function"
    policies:
      - id: tv_govhouse_admin_control_registers_policy
        display_comment: "Control Registers (default)"
        default: true
        on_activate: |
          custom_tooltip = { text = tv_govhouse_admin_control_registers_policy_effect_tt }
          hidden_effect = {
            leader_country ?= {
              tv_apply_governor_bonuses_effect = yes
