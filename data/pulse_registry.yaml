# Towards Victory - on_action bridge registry
# Maps shared EU5 parent on_action names to TV mod custom named on_actions
# emitted into src/in_game/common/on_action/tv_pulse_bridges.txt.
#
# Monthly country pulse event rule:
# Any TV event whose conditions are checked from monthly_country_pulse must be
# fired with a one-day delay. Direct trigger_event_* calls use days = 1; native
# on_action events/random_events blocks use delay = { days = 1 } before event ids.
#
# To add a new feature hook: append its named on_action here, then re-run:
#   conda run --no-capture-output -n eu5 python scripts/in_game/common/on_action/gen_tv_pulse_registry.py

settings:
  monthly_country_pulse_event_delay_days: 1

pulses:
  monthly_country_pulse:
    - tv_io_establishment_monthly_pulse # six IO establishment basic checks, HQ cache, and AI auto-progress
    - tv_leaderboard_monthly_pulse    # leaderboard + touring artist roll + research/medicine/diplo inline
    - tv_cmf_warning_suppressions_monthly_pulse # CMF suppressions for intentional static warning noise
    - tv_io_chief_alert_monthly_pulse # CMF alerts for missing chiefs in the five main-mod IOs
    - tv_engineering_department_chief_alert_monthly_pulse # standalone mod: CMF alert for a missing Great Engineer
    - tv_local_exhibition_monthly_pulse # Domestic Exhibition timer and monthly events
    - tv_research_target_completed_pulse # cancel focused research when target is unlocked normally
    - tv_research_a_pulse             # sub-process A random events
    - tv_research_d_pulse             # sub-process D concentrated research random events
    - tv_med_discovery_pulse          # medicine discovery events
    - tv_med_minor_accident_pulse     # medicine minor accident events
    - tv_med_major_accident_pulse     # medicine major accident events
    - tv_meditation_monthly_pulse     # medicine meditation events
    - tv_academy_of_sciences_monthly_pulse # Academy IO progress completion and philosophy upkeep
    - tv_govhouse_training_monthly_pulse # Grand General training timer
    - tv_govhouse_loyalty_monthly_pulse # Grand General loyalty random events
    - tv_govhouse_negative_monthly_pulse # Governor's House balance-of-power backlash events
    - tv_govhouse_governor_events_monthly_pulse # Regional governor random events
    - tv_govhouse_war_tent_monthly_pulse # War Tent plans and tactic refresh
    - tv_arts_exchange_monthly_pulse     # Arts Exchange timer, auto-invites, and monthly events
    - tv_engineering_department_concept_monthly_pulse # Wonder concept completion checks
    - tv_engineering_department_debate_monthly_pulse # Wonder debate estate support swings
    - tv_engineering_department_support_resolution_monthly_pulse # Wonder support-collapse completion/abort checks
    - tv_engineering_department_survey_monthly_pulse # Wonder survey completion checks and survey events
    - tv_engineering_department_construction_monthly_pulse # Wonder labor/material/construction monthly tick
    - tv_engineering_department_construction_random_events_monthly_pulse # Wonder construction monthly random events
    - tv_engineering_department_ritual_monthly_pulse # Wonder timed ceremony completion checks
    - tv_engineering_department_wonder_auto_cache_monthly_pulse # Wonder owned-level country auto modifier cache
    - tv_diplomatic_alliance_monthly_pulse # Diplomatic Alliance victory-point maintenance
    - tv_trade_league_monthly_pulse # Trade League leader-country slot monopoly maintenance
    - tv_victory_tree_points_monthly_pulse # Victory Path Tree placeholder points trickle

  yearly_country_pulse:
    - tv_science_victory_yearly_pulse # temporary full has_advance scan for player countries; engine count is broken
    - tv_meditation_yearly_pulse # 50% chance for an eligible character to begin meditation autonomously
    - tv_arts_exhibition_yearly_pulse # touring artist elapsed counter + return-home
    - tv_govhouse_governor_tasks_yearly_pulse # autonomous regional governor task reassessment
    - tv_trade_league_yearly_pulse # Trade League global market cache and full monopoly rebuild
    - tv_io_establishment_yearly_pulse # AI-only yearly conquest score recompute (every_subject_or_below off the monthly path)

  on_character_death:
    - tv_govhouse_char_death           # Grand General death cleanup
    - tv_govhouse_governor_death       # Governor death cleanup + popup
    - tv_arts_exhibition_char_death    # touring artist + Chief Artist death cleanup
    - tv_academy_char_death            # Chief Scientist death cleanup
    - tv_engineering_department_char_death # Great Engineer death cleanup

  on_ruler_death:
    - tv_engineering_department_ritual_on_ruler_death # Wonder ritual ruler-death completion checks

bridges:
  on_game_start:
    - tv_govhouse_initialize_on_game_start
    - tv_academy_debate_initialize_global_maps_on_game_start
    - tv_wonder_initialize_index_on_game_start
    - tv_wonder_sync_final_building_level_maps_on_game_start
    - tv_wonder_initialize_existing_unique_wonders_on_game_start
    - tv_wonder_initialize_country_auto_cache_on_game_start
    - tv_wonder_initialize_location_display_state_on_game_start
    - tv_engineering_department_standalone_game_start_bridge # standalone mod: schedule the intro event for every country one day later

  on_game_load:
    - tv_govhouse_initialize_on_game_load
    - tv_io_establishment_save_load_validation # remove stale route enable flags when the matching TV IO is absent
    - tv_academy_debate_initialize_global_maps_on_game_load
    - tv_wonder_initialize_index_on_game_load
    - tv_wonder_sync_final_building_level_maps_on_game_load
    - tv_wonder_initialize_existing_unique_wonders_on_game_load
    - tv_wonder_initialize_country_auto_cache_on_game_load
    - tv_wonder_initialize_location_display_state_on_game_load
    - tv_wonder_repair_stuck_expansion_ceremony_finalized_on_game_load # one-time save repair for the pre-2026-07-20 tv_wonder_finalized-never-cleared-on-expansion bug
    - tv_engineering_department_standalone_game_load_bridge # standalone mod: repair IOs and schedule missing-save intro events one day later

  on_work_of_art_created:
    - tv_on_work_of_art_created_callback # Cultural Influence Points from newly created art
    - tv_academy_debate_on_work_of_art_created

  on_work_of_art_destroyed:
    - tv_academy_debate_on_work_of_art_destroyed

  on_work_of_art_looted:
    - tv_academy_debate_on_work_of_art_looted

  on_location_occupied:
    - tv_academy_debate_on_location_occupied

  on_siege_won:
    - tv_academy_debate_on_siege_won

  on_loan_repaid:
    - tv_academy_debate_on_loan_repaid

  on_loan_renewed:
    - tv_academy_debate_on_loan_renewed

  on_bankruptcy:
    - tv_academy_debate_on_bankruptcy

  on_exploration_success:
    - tv_academy_debate_on_exploration_success

  on_colonial_charter_finished:
    - tv_academy_debate_on_colonial_charter_finished

  on_colonial_charter_failed:
    - tv_academy_debate_on_colonial_charter_failed

  on_took_location_in_peace_treaty:
    - tv_academy_debate_on_took_location_in_peace_treaty

  on_reform_change:
    - tv_academy_debate_on_reform_change

  on_bureaucracy_added:
    - tv_academy_debate_on_bureaucracy_added

  on_religion_changed:
    - tv_academy_debate_on_religion_changed

  on_cabinet_assigned:
    - tv_academy_debate_on_cabinet_assigned

  on_cabinet_removed:
    - tv_academy_debate_on_cabinet_removed

  on_parliament_passed:
    - tv_academy_debate_on_parliament_passed

  on_policy_changed:
    - tv_academy_debate_on_policy_changed

  on_character_moved_country:
    - tv_govhouse_governor_moved_country

  on_new_ruler:
    - tv_govhouse_new_ruler

  on_character_marriage:
    - tv_govhouse_character_marriage

  on_royal_marriage:
    - tv_govhouse_royal_marriage

  on_dependency_gained:
    - tv_govhouse_on_dependency_gained
    - tv_diplomatic_alliance_on_dependency_gained

  on_becoming_free:
    - tv_govhouse_on_becoming_free
    - tv_diplomatic_alliance_on_becoming_free

  on_subject_created:
    - tv_govhouse_on_subject_created
    - tv_diplomatic_alliance_on_subject_created

  on_transfer_subject:
    - tv_govhouse_on_transfer_subject
    - tv_diplomatic_alliance_on_transfer_subject

  on_war_declared:
    - tv_govhouse_war_tent_on_war_declared
    - tv_academy_debate_on_war_declared

  on_join_war:
    - tv_govhouse_war_tent_on_join_war

  on_ending_war:
    - tv_govhouse_war_tent_on_ending_war
    - tv_engineering_department_ritual_on_ending_war

  on_pre_winning_war:
    - tv_engineering_department_ritual_on_pre_winning_war

  on_winning_war:
    - tv_academy_debate_on_winning_war

  on_losing_war:
    - tv_academy_debate_on_losing_war

  on_location_changed_owner:
    - tv_govhouse_location_changed_owner
    - tv_wonder_ownership_location_changed_owner

  on_institution_embraced:
    - tv_academy_philosophy_on_institution_embraced

  on_capital_moved:
    - tv_govhouse_capital_moved
    - tv_trade_league_capital_moved # reset Trade Chain if the capital market changes

  cmf_on_callback:
    - tv_io_chief_alert_on_cmf_callback
    - tv_engineering_department_chief_alert_on_cmf_callback
