      local_building_reward: >-
        巴黎应该保留画廊库存、赞助名册、特使座位计划、修复的外墙、守卫塞纳河的通道、展示的礼物和王朝肖像路线的记忆。后来的实施可以将其表达为当地文化输出、宫廷威望、外交吸引力或减少宫廷骚乱。
    notes: >-
      源仪式是直接的，但定时模式更好地代表宫廷展览季节。每月涵盖修复、展示、赞助和特使编排；包含ruler_death是因为宫殿画廊只有在继承确定后才能成为王朝纪念馆。奖励必须保持声望和外交声誉，而不是一般的艺术家作品。
