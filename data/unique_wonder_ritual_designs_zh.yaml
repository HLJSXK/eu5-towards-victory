        刷新每月威望、每月合法性、当前威望、合法性、稳定性、国库、债务、厌战、贵族或宫廷忠诚、文化输出、邀请关系、当地占领、动乱、破坏、繁荣、宫殿可用性、画廊状况，花园状况、森林安全、道路安全、马厩、车间、教堂通道、人群控制、瘟疫或火灾风险、继承状态和最终建筑存在。
      progress_effect_script: >-
        每月的费用、提前法庭搬迁、画廊佣金、灰泥和绘画工作、花园和喷泉维修、狩猎名册、马厩检查、艺术家赞助名册、诗歌/音乐节目、特使静修、教堂服务、警卫路线和最终揭幕准备。由于破产、占领、动乱、瘟疫、火灾、不安全的道路、森林暴力、无薪艺术家、法院派系危机、丑闻或继承纠纷而暂停或衰退。在ruler_death上，要求接受继承并重定向到纪念赞助。
      completion_trigger_script: >-
        要求完成总进度或基本计数器，Melun控制，最终建筑存在，没有破产，没有占领，可控制的骚乱，可用的画廊和花园，安全的森林和道路，付费艺术家和警卫，公认的统治者/摄政者/继承人，以及足以居住的法院稳定。
      completion_effect_script: >-
        删除临时负担居住，应用永久国家修正保留monthly_prestige 和 monthly_legitimacy，授予一次性声望、合法性、文化传统、高贵忠诚或艺术家支持奖励，添加枫丹白露赞助季站点记忆、清除瞬态计数器，并设置持久完成或冷却标记。
    intended_rewards:
      permanent_country_modifier: >-
        保留 monthly_prestige 和 monthly_legitimacy。声望来自于知名的皇家艺术学校、画廊、花园和狩猎；合法性来自于受控的居住、赞助、贵族出入、教堂记忆以及对统治者恩惠的公众认可。
      one_time_reward: 通过撤退授予一次性威望、合法性、文化传统、宫廷或贵族忠诚、艺术家支持或外交恩惠。如果ruler_death重新定向仪式，则将部分奖励转向纪念合法性和继任者认可。
      local_building_reward: >-
        枫丹白露应该保留对画廊卡通、灰泥模具、赞助卷、花园修复、狩猎名册、马厩检查、特使静修和教堂纪念馆的记忆。后来的实施可以将其表达为当地文化输出、宫廷平静、艺术家招募或居住期间更强的合法性。
    notes: >-
      源仪式是直接的，但定时模式更好地代表居住和赞助季节。每月涵盖佣金、狩猎、花园和法庭使用费；包含ruler_death是因为宫殿只有在继承被承认后才能将住所转变为王朝纪念馆。奖励必须保持声望和合法性。
- id: 194
  key: unique_bordeaux_port
  base_key: great_port
  location: bordeaux
  source_ritual_key: garonne_wine_fair
  status: designed
  ritual_design_zh:
    title: 加龙葡萄酒博览会和斑海豹
    mode: timed
    duration: >-
      定时模式应持续一个葡萄酒出口和博览会季节，通常为每月六到九个周期。这段时间包括检查码头和起重机、认证木桶、审核制桶工人和仓库工人、确认河流通行费和海关封条、指派引航员、准备商业摊位以及派遣船只沿加龙河驶向大西洋。来源是直接的，但波尔多的贸易收入和范围来自于反复的质量控制和港口信任。
    listeners:
    - monthly
    historical_flavor: >-
      加龙葡萄酒博览会和海豹属于波尔多，因为这座城市将河流、葡萄园、仓库和海洋变成了一个商业机构。它的码头、商行、起重机、驳船、海关室、葡萄酒商店、制桶场、引航员和拥挤的贸易街道让远方的买家相信，来自波尔多的密封木桶是按照公认的规则进行测量、征税、装载和发货的。参与者包括法官或城市官员、海关官员、酒商、葡萄园代理人、制桶工人、仓库管理员、内河驳船工人、起重机工作人员、飞行员、水手、公证人、经纪人、外国代理人、警卫和为展会参观者提供服务的旅馆老板。这些地方包括加龙河码头、木桶仓库、起重机平台、海关、商人摊位、制桶场、河岸码头、收费站、船舶甲板以及从葡萄园和内陆市场通往港口的街道。这些物品包括带有品牌标志的木桶、箍、木板、蜡封、海关分类账、飞行员名单、通行费收据、合同、秤、测量杆、系泊绳、装载钩、葡萄酒样品和出口特权。由于质量、通行费、储存和运输的协调，贸易收入增加。贸易范围扩大是因为引航员、公证人和外国因素将波尔多的声誉扩展到河口之外。
    confirmation_logic: >-
      赞助商必须拥有或控制波尔多，波尔多港口奇迹的最终建筑必须存在，国家不能破产，港口、码头、海关和加龙河引道不得被占领、封锁、围困或严重动乱。确认应要求开放的河流和海洋通道、足够的资金用于检查员、警卫、码头维修、领航员工资和公平安排，以及足够的当地生产或储存的货物，以使葡萄酒博览会有意义。如果实施可以检查贸易收入、贸易范围、市民支持、当地繁荣、产量、海上封锁、河流安全、战争状态、瘟疫、火灾或商人满意度，那么这些应该完善触发器。只有当加龙河和大西洋航线仍然可用时才允许战争；封锁或占领应阻止启动。
    start_logic: >-
      起始效果记录了赞助国、仪式地点波尔多、最终的港口建筑、当前的城市当局、出口季节和主要商人/要素背景。它概括了贸易收入、贸易范围、财政、收入、债务、稳定性、声望、市民或商人支持、海军准入、厌战以及外交或市场影响力（如果有）的国家基线。它快照了当地占领、封锁、动乱、破坏、繁荣、港口可用性、码头状况、起重机准备情况、仓库容量、葡萄酒或当地生产、海关职能、河流安全、引航员可用性、船舶存在、火灾风险和瘟疫风险的基线。它初始化码头检查、仓库审核、木桶认证、制桶检查、葡萄酒样品登记、海关封条、通行费核对、引航员名册、商户摊位分配、外国因素合同、起重机和驳船时间表、警卫巡逻和最终港口调度等柜台。临时负担包括检查员、海豹、警卫、码头维修、引航员工资、展位、公证费、样品测试以及审核木桶时的临时延误。
    progress_logic: >-
      每月的进度是港口将收获和河流系统转变为可靠的出口。市政府官员检查码头、起重机、系泊柱和仓库，确保木桶能够无损失地移动。库珀斯展示木板、箍、品牌和修理品；检查员测试木桶是否泄漏或带有虚假标记。葡萄园代理商和商家提交样品和批次清单；公证人将合同与仓库号码进行匹配。海关官员核对通行费收据、出口特权并封存库存，以便货物一次性征税并在国外得到信任。飞行员检查潮汐、沙洲、河道和船员；驳船员协调从内陆到远洋船舶的负载。经纪人为外国因素分配摊位，并解决有关价格、尺寸和损坏货物的纠纷。当港口开放、维护费用支付、仓库正常运行、飞行员可用、当地骚乱程度较低且加龙河未被封锁时，进展就会推进。因破产、占领、封锁、严重动乱、瘟疫、火灾、恶劣的河流状况、起重机故障、木桶欺诈、海关腐败、海盗或私掠者威胁或关闭大西洋航线的战争而暂停。它以高本地产量、繁荣的商人、安全的水域、强大的财政、良好的市民支持、活跃的外国买家和低动荡而加速。
    completion_logic: >-
      完成需要码头、仓库、木桶、制桶、样品、海关、收费、引航员、摊位、因素、起重机/驳船、警卫和最终调度柜台完成或高于阈值。波尔多仍然必须受到控制，最后的建筑必须存在，国家不能破产，港口必须开放，加龙河航线必须安全。最后的场景从海关开始，一直到码头。法官或市政府官员展示海豹；制桶工人在商人面前滚动经过认证的木桶；公证员阅读出口合同；海关官员在账簿上盖章；飞行员提供潮汐和航线列表；起重机工作人员负责装载驳船和船只，而警卫则保持人群畅通。当第一支车队驶向下游时，外国因素收到了密封样本和特权副本。这一奇迹已成为国家能力，因为波尔多已将葡萄酒、河流物流和港口法转化为可靠的贸易收入和更广泛的商业范围。
    failure_or_timeout_logic: >-
      这种仪式可以等到另一个公平季节，但如果推迟太久，葡萄酒质量、买家出席率和飞行员承诺就会下降。如果赞助商失去波尔多、最后一座港口建筑消失、国家仍然破产、港口被占领或摧毁、或者加龙河和大西洋通道仍然被封锁，那么它就会取消。严重的骚乱、火灾、瘟疫、海关丑闻、木桶欺诈、起重机倒塌、船舶短缺、河流阻塞、私掠船威胁或关闭航线的战争可能会暂停进度，并可能重置认证和调度计数器。如果港口在占领后重新开放，仓库、封条、收费账本和木桶品牌必须在完成前再次审核。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对波尔多的所有权或控制权、最终独特的港口建筑存在、没有破产、没有占领或无效围困、没有封锁、可控的骚乱、可用的码头和海关、开放的加龙河和出海通道、足够的金库、可用的货物或生产以及没有活跃的重复仪式。添加对商人支持、港口繁荣、飞行员可用性、当地火灾或瘟疫缺席以及战争不关闭大西洋航线的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和波尔多、商店城市当局、出口季节和商人/要素背景，初始化码头检查、仓库、木桶认证、制桶检验、葡萄酒样品、海关封条、收费分类帐、飞行员名册、摊位、外国要素合同、起重机/驳船时间表、警卫和最终柜台调度，应用临时港口负担，并存储贸易，范围，金库，商人和当地基线。
      snapshot_effect_script: >-
        刷新贸易收入，贸易范围，金库，债务，稳定性，声望，市民或商人支持，海军准入，战争疲劳，当地占领，封锁，动乱，破坏，繁荣，港口可用性，码头状况，起重机准备情况，仓库容量，生产，海关功能，河流安全，飞行员，船舶存在，火灾风险，瘟疫
      progress_effect_script: >-
        每月报价、提前码头检查、仓库审核、木桶认证、制桶检验、样品登记、海关封条、通行费核对、引航员名册、摊位分配、保理商合同、起重机和驳船时间表、警卫巡逻和调度准备。因破产、占领、封锁、动乱、瘟疫、火灾、河流阻塞、起重机故障、欺诈、海关腐败、私掠威胁或战争关闭而暂停或衰退。加速生产、繁荣、安全水域、财务、商人支持和外国买家。
      completion_trigger_script: >-
        要求总体进度或基本港口柜台完成，波尔多受控，最终建筑存在，无破产，无占领或封锁，可控骚乱，可用码头，正常运作的海关，安全的加龙河航线，可用的引航员和船舶，经过认证的木桶和付费维护。
      completion_effect_script: >-
        消除临时公平负担，应用永久公平负担保留trade_income和trade_range的国家修正，授予一次性贸易收入、当地繁荣、商人忠诚度、声望或船舶/水手支持，添加加龙海豹站点记忆，清除瞬态计数器，并设置持久完成或冷却标记。
    intended_rewards:
      permanent_country_modifier: >-
        保留trade_income和trade_range。贸易收入来自木桶认证、海关封条、仓库和公平合同；贸易范围来自于试点、外国因素、受保护的河流通道以及波尔多在加龙河以外的声誉。
      one_time_reward: 授予一次性贸易收入、国库、当地繁荣、商人或市民的满意度、声望或成功派遣的水手。如果封锁或欺诈被克服，回报可能会倾向于恢复贸易信心。
      local_building_reward: >-
        波尔多应该保留海豹、经过认证的木桶品牌、制桶检查、收费分类账、飞行员名册、仓库编号、外国供应商合同和起重机时间表的记忆。稍后的实施可以将其表达为当地贸易价值、生产繁荣、港口弹性或更快地从封锁中恢复。
    notes: >-
      源仪式是直接的，但定时模式更好地代表葡萄酒博览会和出口季节。每月是正确的监听者，因为质量、通行费、飞行员和仓库的信任都是通过反复检查积累的。奖励必须以贸易收入和贸易范围为中心。
- id: 195
  key: unique_marseille_old_port
  base_key: great_port
  location: marseille
  source_ritual_key: mediterranean_convoy_blessing
  status: designed
  ritual_design_zh:
    title: 地中海护航队祝福
    mode: timed
    duration: >-
      定时模式应涵盖一个护航队准备季节，通常为每月六到九个周期。这段时间包括在船舶离开旧港之前检查船体和三角帆平台、组织引航员、护航信号、检疫文件、港口链、灯塔灯、仓库和商业合同。来源是直接的，但马赛的贸易收入和海军航程来自于纪律严明的出发和安全的地中海航线。
    listeners:
    - monthly
    - ending_war
    historical_flavor: >-
      地中海护航祝福属于马赛，因为旧港是一个狭窄的民用港口，商业、海军到达、检疫、信仰和强化安全在这里交汇。石头码头、海港堡垒、铁链、灯塔、鱼市、仓库、领航员长凳、厨房停泊处和商船建造了一个系统，让船只穿越充满机遇和危险的海洋。参与者包括港口领事、商人、厨房船长、船长、领航员、水手、桨手（相关情况）、检疫官员、港链管理员、灯塔或航标员、牧师、海关文员、仓库管理员、鱼市代表、警卫和等待货舱的外国人员。包括旧港码头、港口、炮台、哨所、引航处、检疫站、仓库、鱼市、礼拜堂、烽火台、出发场等。这些物品包括舱单、卫生单、护航旗帜、信号灯、锚、桨、三角帆、系泊绳、海关封条、检疫簿、港口链钥匙、祝福蜡烛和航线图。由于货物、健康文件和合同的协调，贸易收入增加。海军航程的扩大是因为飞行员、信号灯、信标和护航纪律扩展了马赛在整个地中海的实际影响范围。
    confirmation_logic: >-
      赞助商必须拥有或控制马赛，最后的旧港奇迹建筑必须存在，国家不能破产，港口不能被占领、封锁、围困或因严重骚乱而关闭。确认应需要可用的海上航线、正常运作的码头、引航员和检疫机构、足够的资金用于警卫、信标维护、船体修理、牧师和车队管理，并且没有积极的瘟疫封锁来禁止出发。如果实施可以检查贸易收入、海军范围、海军准入、水手、商人支持、海盗/私掠者威胁、战争状态、港口繁荣、封锁和疾病风险，那么这些应该完善触发器。只有在车队准备合理的情况下才允许战争；完全封锁或敌方舰队在港口封锁开始。仅当战争影响地中海航运或港口安全时，ending_war
      才有意义。
    start_logic: >-
      起始效果记录了赞助国、仪式地点马赛、最终的港口建筑、现任港口领事或总督、护航季节以及海上通道安全背景。它概括了贸易收入、海军航程、国库、收入、债务、稳定性、声望、水手、海军传统或舰队战备状态（如果有）、商人支持、战争疲劳以及海军封锁或制海状态的国家基线。它快照了占领、封锁、动乱、破坏、繁荣、港口可用性、码头状况、港口链准备情况、堡垒安全、信标状况、飞行员可用性、船舶存在、检疫状态、仓库容量、海盗威胁以及瘟疫或火灾风险的当地基线。它初始化了船体检查、索具和桨修理、引航员名册、航线图审查、检疫文件审核、仓库舱单、海关封条、港链演习、信标照明、车队信号练习、商业合同登记、教堂祝福、警卫巡逻和最后车队出发等柜台。临时负担包括修理、飞行员、警卫、信标、检疫人员、牧师津贴、车队旗帜、仓库劳动力以及检查舱单时延误的货物。
    progress_logic: >-
      每月进度是车队出发前准备的海事信托。造船工人和船员检查船体接缝、桅杆、桨、锚、三角帆、绳索、水桶和应急桅杆。飞行员比较航线图、风季、浅滩、敌对海岸和安全港。检疫官员审查健康单，隔离可疑货物，并防止疾病将贸易变成灾难。仓库工人将舱单与大包、桶、鱼、油、布料和乘客进行匹配。海关文员封存货物清单；商人结算车队股份和保险承诺。链条管理员练习升降港口链条；信标船测试信号火；守卫在堡垒和码头巡逻。牧师在不更换实际支票的情况下准备祝福。当港口开放、维护费用支付、船舶和引航员到位、检疫正常运行、海上航线未关闭时，进展就会取得进展。它因破产、占领、封锁、严重骚乱、瘟疫关闭、火灾、港口的海盗威胁、飞行员失踪、链条损坏、船员欠薪、货物欺诈或海军失败而暂停。它因强大的商人信心、可用的水手、良好的海军战备、安全的海上通道、繁荣的仓库和低动荡而加速。在ending_war上，仅当战争结束重新开放航线、释放船只或允许感恩节和护航派遣时才添加进度。
    completion_logic: >-
      完成要求船体、索具、飞行员、海图、检疫、舱单、海关、链条、信标、信号、合同、教堂、警卫和最终出发柜台完成或高于阈值。马赛仍然必须受到控制，最终的建筑必须存在，国家不能破产，港口不能被封锁，检疫必须允许离境。最后的场景从教堂或码头开始。牧师为船长、水手、飞行员和护航船旗祝福；检疫人员赠送健康书籍；商家展示密封的舱单；链条管理员打开港口；信标供应船点亮出发信号；当晚船、桨帆船和货船有序离开时，守卫和炮台炮手监视着海峡。如果相关战争刚刚结束，仪式包括感谢重新开放的航线并列出恢复服务的船只。这一奇迹变成了国家能力，因为马赛将港口仪式、健康控制和船队纪律转化为收入和地中海航线。
    failure_or_timeout_logic: >-
      这种仪式可以等待更安全的航行季节，但如果拖延太久，舱单、健康文件、船员合同和船队准备情况就会减弱。如果赞助商失去马赛、最后一座港口建筑消失、国家仍然破产、旧港被占领或摧毁、或者出海通道仍然被封锁，那么比赛就会取消。严重骚乱、瘟疫关闭、火灾、港口链故障、信标丢失、飞行员短缺、海盗封锁、货物欺诈丑闻、拖欠船员工资或将船只困在港口的战争应该会暂停进度，并可能重置出发计数器。如果ending_war发生在破坏性的失败或港口占领之后，则应该需要重新检查而不是给予进展。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对马赛的所有权或控制权、最终独特的旧港口建筑存在、没有破产、没有占领或无效围攻、没有封锁、可控的骚乱、可用的码头、海上通道、职能飞行员和检疫机构、足够的金库以及没有活跃的重复仪式。添加对商人支持、水手或船队可用性、海盗威胁、信标和链条准备情况、瘟疫状态以及未完全关闭港口的战争的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和马赛，存储港务局、护航季节和海上航线安全背景，初始化船体检查、索具/桨、飞行员、航线图、检疫文件、舱单、海关封条、港口链、信标、护航信号、商人的计数器合同、教堂祝福、守卫和最终离港、应用临时港口负担、商店贸易、海军范围、水手、商人和当地基线。
      snapshot_effect_script: >-
        刷新贸易收入、海军范围、财政、债务、稳定、声望、水手、海军战备代理、商人支持、战争疲劳、制海或封锁状态、当地占领、封锁、动乱、破坏、繁荣、港口可用性、码头状况、链准备状态，堡垒安全、信标状况、飞行员、船舶、检疫状态、仓库容量、海盗威胁、瘟疫/火灾风险和最终建筑存在。
      progress_effect_script: >-
        按月进行，预先船体检查、索具和桨修理、飞行员名册、海图审查、检疫审核、仓库清单、海关封条、链钻、信标照明、车队信号、商业合同、教堂祝福、警卫巡逻和出发准备。由于破产、占领、封锁、动乱、瘟疫、火灾、海盗威胁、飞行员失踪、链条损坏、船员欠薪、货物欺诈或海战失败而暂停或衰退。在
        ending_war 上，仅在和平重新开放相关海上航线时验证进度。
      completion_trigger_script: >-
        要求总体进度或基本计数器完成、马赛控制、最终建筑存在、无破产、无占领或封锁、可控制的骚乱、可用的港口、功能性检疫、可用的船舶和飞行员、准备好的链条和信标、受薪船员、安全的出海通道和密封的舱单。
      completion_effect_script: >-
        消除临时车队负担，应用永久的保留trade_income和naval_range的国家修改器，授予一次性贸易收入、水手、海军传统、声望、商人信心或当地港口繁荣，添加地中海护航队地点记忆，清除瞬态计数器，并设置持久的完成或冷却标记。
    intended_rewards:
      permanent_country_modifier: >-
        保留trade_income和naval_range。贸易收入来自密封舱单、检疫信托、仓库和运输合同；海军范围来自于飞行员、航线图、信标、港口链以及地中海的纪律出发。
      one_time_reward: 授予一次性贸易收入、水手、海军传统、声望、商人满意度或当地繁荣。如果ending_war做出了贡献，则将部分奖励用于重新开放海上航线并恢复商人信心。
      local_building_reward: >-
        马赛应该保留对护航旗帜、健康手册、港口链钥匙、信标名册、飞行员名单、密封舱单、教堂祝福和守卫码头的记忆。稍后的实施可以将其表达为当地港口安全、海军补给、检疫弹性或封锁后更快的恢复。
    notes: >-
      源仪式是即时的，但定时模式更好地代表了车队准备季节。每月处理船舶、检疫、舱单和信标工作； ending_war仅包含在海上战争结束时重新开放航线或返回船只。奖励必须以贸易收入和海军航程为中心。
- id: 196
  key: unique_lyon_silk_workshops
  base_key: giant_workshop_complex
  location: lyon
  source_ritual_key: canut_guild_charter
  status: designed
  ritual_design_zh:
    title: Grande Fabrique Loom Charter
    mode: timed
    duration: >-
      定时模式应持续一个生产和公平周期，通常为每月九到十二个周期。这一时期包括登记师徒、检查织布机、批准样板书、密封染坊、审核丝包、核对商人信用以及在集市上展示成品布。来源是直接的，但生产效率和贸易收入取决于里昂工坊区内重复的质量纪律。
    listeners:
    - monthly
    historical_flavor: >-
      Grande Fabrique Loom Charter 属于里昂，因为该市的丝绸力量依赖于由织布机、染色工、商人、图案设计师、学徒、河桥、公平信用和行会式监管组成的密集城市系统。奇迹不在于一个大厅，而在于一个工业区，那里的家庭作坊和商业资本对国家来说是清晰可辨的。参与者包括织工大师、熟练工、学徒、丝绸商人、染色工、制版师、金银线供应商、城市领事、皇家或市政检查员、公证人、河运搬运工、公平经纪人、管理织布机的寡妇，以及劳资紧张局势加剧时派出的警卫或调解员。这些地方包括高大窗户照亮的织机房、染坊、商人计数室、行会或领事馆、图案档案室、索恩桥和罗讷河大桥附近存放的捆包、集市摊位以及生丝进入和成品布离开的街道。这些物品包括织布机、梭子、图样书、染色绞纱、印章、商人分类帐、学徒卷、样品卡、布螺栓、重量石、合同和河流舱单。由于工具、劳动力、图案和质量标记的协调，生产效率得以提高。贸易收入的增加是因为买家信任里昂封闭的纺织品和商业信用网络。
    confirmation_logic: >-
      赞助商必须拥有或控制里昂，最后的丝绸工坊奇迹建筑必须存在，国家不能破产，工坊区不能被占领、烧毁、因瘟疫关闭或遭受严重动乱。确认应要求稳定的行会或作坊秩序，获得生丝和染料材料，有效的河流或集市路线，足够的金库供检查员、公证员、警卫和样品印章使用，并且没有导致检查无法进行的积极的劳工反抗。如果实施可以检查全球生产效率、贸易收入、市民或工匠满意度、当地繁荣、奢侈品需求、贸易路线安全、火灾风险、供应短缺或战争状态，那么这些应该细化资格。只有在丝绸供应和公平路线仍然可用的情况下才允许战争；封锁或征用危机应该会阻碍仪式。
    start_logic: >-
      起始效果记录了主办国、仪式地点里昂、最终的车间建筑、当前城市权限、生产季节以及商人/车间章程背景。它概括了全球生产效率、贸易收入、国库、收入、债务、稳定性、声望、市民或工匠支持、奢侈品或纺织品需求（如果有）以及贸易路线风险的国家基线。它记录了占领、动乱、破坏、繁荣、车间可用性、织布机数量、染厂状况、丝绸供应、图案档案、商业信贷、河流通道、公平通道、火灾风险、瘟疫风险和劳动力紧张等方面的当地基线。它初始化主注册、学徒卷、织布机检查、梭子和工具修理、样板书批准、染料印章、线和丝包审核、商业信用分类账、公平合同登记、样品展示、劳工调解、河流舱单和最终租船合同读取等计数器。临时负担包括检验员、公证员、印章、警卫、更换工具、染料测试、纸张、展会摊位费以及检查织机时的产量损失。
    progress_logic: >-
      每月进度是车间区域将技能转化为可靠的产出。检查员参观织机室并记录哪些大师拥有工作织机、训练有素的劳动力和可用的工具。学徒按期限、义务和师傅进行登记，防止隐藏的劳资纠纷扰乱生产。图案抽屉带来书籍和样品卡进行批准，这样图案就可以重复，而不是即兴创作，造成浪费。染工展示大桶、媒染剂、颜料和密封的颜色样品；假染料或弱线将被拒绝。丝绸商人打开账簿，显示生丝购买情况、大师的信用以及与公平买家的合同。内河搬运工和经纪人核对穿越索恩和罗纳河航线的货物的舱单。劳工调解员会在工资、债务和质量纠纷演变成街头骚乱之前对其进行审理。当工场安全、维护费用得到支付、丝绸和染料到达、市场开放、工匠合作时，进步就会取得进展。它因破产、占领、严重动乱、瘟疫、火灾、生丝短缺、染料污染、商业信用崩溃、劳工骚乱、河流堵塞或战争扰乱集市而暂停。它随着高度繁荣、强大的商人信用、合作工匠、良好的奢侈品需求、安全的路线和低动荡而加速。
    completion_logic: >-
      完成需要师傅、学徒、织布机、工具、图案、染料、丝包、商人信用、公平合同、样品、调解、河流舱单和最终包机柜台完成或高于阈值。里昂仍然必须受到控制，最终的建筑必须存在，国家不能破产，车间必须开放，集市或河流路线必须发挥作用。最后的场景发生在领事馆或行会大厅，并蔓延到车间街道。市政府官员宣读了章程；检查员展示密封的图案书和染料样品；大师们为他们的织布机负责；学徒被命名；商人提出公平的合同；河运搬运工展示舱单；成品丝螺栓被悬挂起来供买家检查。该州确认带有里昂印章的布料符合标准尺寸、染料和图案。这一奇迹已成为国家能力，因为该市已将分散的作坊转变为纪律严明的生产和出口系统。
    failure_or_timeout_logic: >-
      该仪式可以等待稍后的公平周期，但如果延迟太久，模式批准、买家合同和学徒名册就会衰减。如果赞助商失去里昂、最后一座车间大楼消失、国家仍然破产、该地区被占领或摧毁、或者火灾和瘟疫关闭车间，它就会取消。严重的骚乱、劳工起义、生丝短缺、染厂丑闻、商人破产、河道堵塞、战争关闭集市或普遍的欺诈行为都可能会导致进展暂停，并可能重置检验、染料和信用柜台。如果灾难后恢复生产，则必须在完成前重新检查织布机、样板书和商业分类帐。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对里昂的所有权或控制权、最终独特的丝绸作坊建筑的存在、没有破产、没有占领、可控的骚乱、可用的作坊、运转良好的丝绸和染料供应、开放的河流或公平的路线、稳定的行会/作坊秩序、充足的金库以及没有活跃的重复仪式。添加对工匠和市民合作、当地繁荣、奢侈品需求、火灾或瘟疫缺席、劳动力紧张以及战争不关闭贸易路线的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和里昂，存储城市权威和生产季节背景，初始化大师、学徒、织布机、工具、图案书、印章、丝包审计、商业信用、公平合同、样品展示、调解、河流清单和最终包机的柜台，申请临时研讨会
      snapshot_effect_script: >-
        刷新全球生产效率、贸易收入、国库、债务、稳定性、声望、市民或工匠支持、奢侈品需求、路线暴露、当地占领、动乱、破坏、繁荣、车间可用性、织布机数量、染厂条件、丝绸供应、图案档案、商业信用、河流通道、公平准入、火灾风险、瘟疫风险、劳动力紧张和最终建筑存在。
      progress_effect_script: >-
        每月报价、提前主注册、学徒卷、织机检查、工具维修、图案批准、染料印章、丝包审核、商业信用分类账、公平合同登记、样品展示、劳工调解、河流舱单和章程准备。由于破产、占领、动乱、瘟疫、火灾、供应短缺、染料丑闻、信用崩溃、劳工骚乱、河流堵塞或战争关闭集市而暂停或衰退。加速实现繁荣、信用、工匠合作、需求、安全路线和低骚乱。
      completion_trigger_script: >-
        要求完成总体进度或基本柜台，里昂控制，最终建筑存在，无破产，无占领，可控制的骚乱，开放车间，充足的丝绸和染料供应，检查的织布机，批准的图案，密封的染料，有效的商业合同，开放的路线和付费检查员。
      completion_effect_script: >-
        消除临时车间负担，应用保留的永久国家修正global_production_efficiency 和 trade_income，授予一次性生产、贸易收入、当地繁荣、工匠满意度、声望或创新奖励，添加里昂织机包机站点内存，清除瞬态计数器，并设置持久完成或冷却标记。
    intended_rewards:
      permanent_country_modifier: >-
        保留 global_production_efficiency 和 trade_income。生产效率来自于经过检验的织机、图案、染料、学徒和工具；贸易收入来自于买家信任的密封质量、公平合同、商业信用和河运舱单。
      one_time_reward: 授予一次性产量、贸易收入、当地繁荣、工匠或市民满意度、声望或改进模式的研究/创新。如果劳工骚乱是一个问题，奖励可以包括通过调解车间秩序来缓解当地骚乱。
      local_building_reward: >-
        里昂应该保留密封的图案书、染料样品、学徒卷、检查过的织布机、商业分类账、公平合同、河流清单和带有城市标记的布螺栓的记忆。稍后的实施可以将其表达为本地生产、贸易价值、工匠稳定性或奢侈品弹性。
    notes: >-
      源仪式是直接的，但定时模式更好地代表生产和公平周期。每月是正确的听众，因为车间纪律是通过反复检查、分类账和合同建立的。源代码提到了 canuts，但设计使用了更广泛的早期现代丝织物机构；奖励必须停留在生产效率和贸易收入上。
- id: 197
  key: unique_mont_saint_michel
  base_key: sacred_mountain
  location: avranches
  source_ritual_key: tidal_pilgrimage
  status: designed
  ritual_design_zh:
    title: 潮汐登顶朝圣
    mode: timed
    duration: >-
      定时模式应持续一个朝圣和潮汐季节，通常为每月六到九次。这段时间包括标记安全通道、培训潮汐向导、准备修道院办公室、修复墙壁和大门、储备避难所商店、安排施舍和宾客空间，以及聚集朝圣者以进行最后的低潮上升。源头是直接的，但圣米歇尔山的宽容和威望来自于对信仰、潮汐、避难所和边境危险的反复纪律。
    listeners:
    - monthly
    - ending_war
    historical_flavor: >-
      圣米歇尔山的潮汐朝圣属于圣米歇尔山，因为修道院是一座神圣的岛屿堡垒，其权威取决于海洋和陆地之间的危险节奏。朝圣者不能简单地到达；他们在指导下穿过潮沙，爬上坚固的街道，穿过大门，进入由僧侣、守卫和当地向导看守的寺院办公室。参与者包括修道院院长或修道院院长、本笃会修道士、牧师、来自诺曼底及其他地区的朝圣者、潮汐向导、熟悉沙滩的渔民、看门人、城墙守卫、施舍管理员、大陆牧师、旅店老板、车夫、旗手以及将这座山视为圣地和避难所的皇家或公爵官员。这些地方是阿夫朗什附近的大陆聚集点、潮滩、堤道标记、修道院大门、村庄街道、围墙、餐厅、宾馆、教堂、金库和粮仓。这些物品包括手杖、绳索、潮汐标记、蜡烛、圣物盖、圣迈克尔横幅、施舍碗、朝圣者令牌、墙钥匙、粮量、防风灯以及获准避难的人员名单。对自己信仰的宽容度上升，因为仪式将奉献引导到有序的朝圣、慈善、忏悔和受保护的崇拜中。每月的声望会上升，因为国家被视为守护着神奇的、困难的、著名的神圣边境。
    confirmation_logic: >-
      赞助商必须拥有或控制阿夫朗什和山的当地遗址，最后的圣米歇尔山奇迹建筑必须存在，国家不能破产，修道院、围墙、潮汐通道和大陆道路不能被占领、围困、封锁或严重动乱。确认应该需要安全的低潮路线、训练有素的向导、足够的金库用于警卫、施舍、维修、食品商店和招待，以及能够主办朝圣的公认宗教权威。如果实施可以检查tolerance_own、威望、神职人员支持、当地繁荣、沿海封锁、战争状态、风暴或潮汐危险、朝圣路线安全、破坏或继承稳定性，则应细化资格。战争不会自动阻止仪式，但威胁海岸、占领道路或使避难所无法使用的战争应该阻止仪式的开始。
      ending_war 只有在山、海岸或朝圣者需要保护的战争结束后才有意义。
    start_logic: >-
      开始效果记录了赞助国、阿夫朗什/圣米歇尔山作为仪式地点、最终的修道院建筑、修道院院长或宗教领袖、统治者或当地赞助人以及朝圣季节。它快照了tolerance_own、每月威望、当前威望、稳定性、合法性、神职人员支持、财政、收入、债务、厌战情绪和沿海安全（如果有）的国家基线。它记录了占领、围困、封锁、动乱、破坏、繁荣、修道院可用性、围墙状况、大门安全、潮汐路线安全、向导可用性、朝圣者道路安全、宾馆容量、避难所粮食、风暴风险和当地食品供应的当地基线。它初始化潮汐测量、导游名册、堤道标记、道路护送、修道院办公室准备、文物和旗帜护理、施舍店、宾馆、墙壁和大门检查、避难粮仓、朝圣者登记、最后低潮渡口和感恩节服务等柜台。临时负担包括警卫、向导、蜡烛、食物、修理、施舍、灯笼、船只或马车，以及在过境点受到监管时损失的通行费。
    progress_logic: >-
      每月的进展是朝圣变得足够安全，成为公共权威。潮汐向导和渔民勘察航道、流沙、天气和安全渡窗；当沙子移动时，标记和绳索会被修复或移动。大陆的牧师和车夫将朝圣者聚集在一起，而不是让他们陷入危险。大门看守和警卫检查墙壁、锁和避难点，而粮仓管理员则为朝圣者和战时避难所测量谷物、咸鱼、水和燃料。僧侣们准备办公室、忏悔时间、圣物展示、蜡烛和圣迈克尔横幅。施舍管家会安排面包和住宿，以免人群变得混乱。当路线安全、维护费用已支付、修道院开放、潮汐可用、神职人员和向导合作以及骚乱程度较低时，就会取得进展。它因破产、占领、围困、沿海封锁、严重骚乱、风暴季节、不安全的沙地、瘟疫、火灾、神职人员拒绝、道路抢劫或避难商店短缺而暂停。它凭借强大的神职人员支持、高度的信仰凝聚力、当地的繁荣、良好的天气、安全的道路、坚固的城墙以及最近的生存声望而加速发展。在ending_war上，只有在山或海岸经历危险后和平允许感恩节穿越时才添加进度。
    completion_logic: >-
      完成需要潮汐、指南、标记、道路护送、办公室、遗物、施舍、宾馆、墙/门、粮仓、朝圣者登记、最终穿越和感恩节计数器完成或高于阈值。阿夫朗什/山仍然必须受到控制，最终的建筑必须存在，国家不能破产，潮汐通道必须安全，修道院必须开放。最后一幕在退潮时的大陆开始。导游带领朝圣者穿过沙滩上的标记；守卫看守墙壁；僧侣们在修道院敲响钟声；施舍管家接待穷人；方丈举起圣米迦勒旗帜并主持仪式。如果相关战争已经结束，游行活动包括感谢保护和公开清点避难商店。赞助商确认这座山将仍然是一个受看守的神殿和庇护所。这一奇迹变成了国家能力，因为危险的朝圣、修道院戒律和堡垒避难所现在增强了宗教凝聚力和威望。
    failure_or_timeout_logic: >-
      仪式可以等待更安全的潮汐或下一个朝圣季节，但如果推迟太久，朝圣者的出席率、导游的准备情况和食品储备就会减少。如果赞助商失去了山或阿夫朗什，最后一座修道院建筑消失，国家仍然破产，修道院被占领或摧毁，或者潮汐通道变得不可能，它就会取消。严重的骚乱、围困、封锁、风暴破坏、不安全的沙地、瘟疫、火灾、路匪、神职人员拒绝、饥荒或海岸战争应该会暂停进度，并可能重置过境和避难柜台。如果ending_war发生破坏或占领，仪式必须在感恩节之前首先重新检查墙壁、商店和路线。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对阿夫朗什/圣米歇尔山的所有权或控制权、最终独特的修道院建筑存在、没有破产、没有占领或无效围攻、没有沿海封锁、可控的骚乱、可用的潮汐通道、安全的大陆路线、公认的宗教权威、可用的向导和警卫、足够的国库，并且没有活跃的重复仪式。添加对神职人员支持、自身信仰宽容、避难商店、墙壁状况、风暴或瘟疫缺席以及不威胁海岸的相关战争的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和山址、商店方丈/宗教长官、统治者或赞助人和朝圣季节，初始化潮汐测量计数器、指南、标记、道路护送、修道院办公室、文物和横幅、施舍、宾馆、墙壁/大门，避难粮仓，朝圣者登记，最后穿越和感恩节，应用临时负担，并存储宽容，声望，神职人员，国库，沿海和地方基线。
      snapshot_effect_script: >-
        刷新tolerance_own，每月声望，当前声望，稳定性，合法性，神职人员支持，国库，债务，厌战，沿海安全，当地占领，围攻，封锁，动乱，破坏、繁荣、修道院可用性、墙壁状况、大门安全、潮汐路线安全、向导可用性、朝圣道路、宾客容量、避难谷物、风暴风险、食品供应和最终建筑存在。
      progress_effect_script: >-
        每月刻度、提前潮汐调查、向导名册、堤道标记、道路护送、修道院办公室、文物和旗帜护理、施舍店、宾馆、墙壁和大门检查、避难粮仓、朝圣者登记、最终穿越准备和感恩节准备。由于破产、占领、围攻、封锁、动乱、风暴、不安全的沙子、瘟疫、火灾、神职人员拒绝、道路危险或食物短缺而暂停或衰退。在ending_war上，只有当和平能够进行相关的感恩节朝圣时，才验证进度。
      completion_trigger_script: >-
        要求完成全部进度或基本计数器，控制山地，存在最终建筑，没有破产，没有占领或围困，没有封锁，可控的骚乱，安全的潮汐，可用的指南，开放的修道院办公室，足够的避难所商店，守卫的墙壁和付费维护。
      completion_effect_script: >-
        删除临时朝圣负担，应用保留tolerance_own和monthly_prestige的永久国家修正，授予一次性声望，神职人员支持，稳定，当地繁荣，动乱救济或防御/避难准备奖励，添加潮汐朝圣地点记忆，清除瞬态计数器，并设置持久完成或冷却标记。
    intended_rewards:
      permanent_country_modifier: >-
        保留tolerance_own和monthly_prestige。自身信仰的宽容来自有序的朝圣、忏悔、施舍和受保护的修道院崇拜；声望来自于守护游客亲身体验的著名潮汐圣地和堡垒避难所。
      one_time_reward: >-
        授予一次性威望、神职人员忠诚、稳定、当地繁荣、防御准备或骚乱缓解。如果ending_war做出了贡献，则将部分奖励用于感恩节声望并重新树立人们对圣米歇尔山避难所角色的信心。
      local_building_reward: >-
        圣米歇尔山应该保留潮汐标记、导游名册、朝圣者登记册、圣迈克尔横幅、避难所谷物、墙钥匙、救济品商店和低潮感恩节路线的记忆。后来的实施可以将其表达为当地朝圣繁荣、防御、沿海恢复力或自身信仰中较低的动荡。
    notes: >-
      源仪式是直接的，但定时模式更好地代表潮汐和朝圣季节。路线、商店、墙壁和办公室需要每月； ending_war 仅适用于沿海或神社危险后的相关感恩节。奖励必须保持自己的信仰、宽容和声望，并以防御为支持背景。
- id: 198
  key: unique_bastille
  base_key: star_fortress_city
  location: paris
  source_ritual_key: royal_prison_muster
  status: designed
  ritual_design_zh:
    title: 皇家监狱召集和兵工厂印章
    mode: timed
    duration: >-
      定时模式应持续一次资本安全审计，通常为每月六到九次。这段时间意味着在州长公开更新要塞誓言之前，要检查塔楼、吊桥、牢房、军械库、钥匙、警卫轮换、监狱登记册、皇家搜查令和城市通道。来源是直接的，但驻军规模和合法性需要在首都进行反复的行政和军事检查。
    listeners:
    - monthly
    - ruler_death
    - pre_winning_war
    historical_flavor: >-
      皇家监狱集结和阿森纳印章属于巴士底狱，因为这座堡垒是皇家控制巴黎的集中标志：砖石塔楼、吊桥、护城河、军械库、监狱庭院、警卫室、授权档案和附近的城市街道都表明王室有能力维持首都秩序。参与者包括要塞总督、守卫队长、钥匙保管员、看守、军械师、皇家秘书、治安法官或教务长、工程师、城市守卫代表、囚犯牧师、补给官和宫廷信使。囚犯不是庆祝者；它们通过登记册、搜查令、健康检查和牢房审计出现，证明堡垒是受控制的而不是混乱的。这些地方包括门楼、塔楼、吊桥、护城河、军械室、牢房走廊、监狱庭院、总督室、授权档案、火药库以及连接要塞与皇家和市政指挥网络的街道。这些物品包括大门钥匙、封条、步枪、火药桶、长矛、监狱登记册、皇家授权令、警卫名册、口粮账簿、链条、灯笼和吊桥装置。驻军规模扩大是因为要塞维持人员、物资和轮换。每月的合法性会上升，因为王室可以明显地审计武力、监管和资本秩序。
    confirmation_logic: >-
      赞助商必须拥有或控制巴黎，最后的巴士底奇迹建筑必须存在，国家不能破产，堡垒不能被占领、围攻、攻破、烧毁或被严重的资本骚乱所包围。确认应需要得到公认的王室或摄政当局、足够的金库用于警卫、军械师、口粮、牢房维护和记录工作，以及能够履行授权令和警卫命令的正常运作的法院或城市指挥部。如果实施可以检查合法性、全球驻军规模、首都动乱、贵族或宫廷忠诚度、战争状态、围困风险、监狱丑闻、破坏或巴黎繁荣，那么这些应该完善资格。如果要塞能够保卫首都，那么战争就被允许；直接威胁巴黎的战争可能会加剧仪式，但占领或积极的围困应该会阻止仪式的开始。
      ruler_death 状态应在接受密钥之前要求更新权限。
    start_logic: >-
      起始效果记录了赞助国、作为仪式地点的巴黎、最终的巴士底狱建筑、现任统治者或摄政王、要塞总督、首都安全环境以及战争/继承状态。它快照了全球驻军规模、每月合法性、当前合法性、稳定性、财政、收入、债务、战争疲劳、人力或驻军储备、宫廷/贵族忠诚度以及叛乱风险（如果有）的国家基线。它快照了占领、围困、动乱、破坏、繁荣、要塞状况、护城河和吊桥可用性、军火库、火药安全、警卫力量、监狱登记完整性、牢房状况、授权档案、城市守望合作和资本人群压力等当地基线。它初始化塔楼检查、大门和吊桥测试、钥匙审计、警卫轮换、军械库库存、火药和口粮分类账、牢房检查、囚犯登记核对、授权封条审查、城市守望协调、州长宣誓和最终军械库封印等计数器。临时负担包括警卫工资、军械库维修、火药安全、囚犯口粮、工程师工作、抄写员、海豹和加强城市巡逻。
    progress_logic: >-
      每月进度是资本强制能力的问责。工程师检查塔楼、大门、护城河边缘、吊桥链、锁和屋顶。钥匙保管员出示每扇门和牢房的钥匙，将它们与登记册进行匹配，这样私人保管或丢失的锁就不会损害权威。军械兵清点步枪、长矛、霰弹、火药、备用枪械、灯笼和消防桶；配给官员将食品商店与警卫和囚犯的需求进行比较。看守检查牢房、健康状况、逃亡和转移；秘书们将皇家搜查令与囚犯名单进行比较，并标记不规则的文件以供审查。守卫队长在塔楼和庭院中轮流值守，而城市守卫官员则协调附近的街道，以防止人群、派系特工或敌方间谍测试堡垒。当巴黎被控制、维护费得到支付、堡垒平静、总督服从、首都骚乱可控时，进步就会推进。它因破产、占领、围攻、严重骚乱、监狱骚乱、火灾、火药事故、钥匙丢失、搜查令丑闻、守卫无薪、继承纠纷或法庭派系暴力而暂停。它以高度的合法性、强大的财政、忠诚的卫兵、良好的驻军储备、平静的巴黎以及战时保护首都的需要而加速。在ruler_death上，要求新统治者或摄政王更新关键誓言。在pre_winning_war上，仅当巴士底狱安全在相关战争期间防止了资本混乱时才添加进度。
    completion_logic: >-
      完成要求塔、门、钥匙、守卫、军火库、火药/口粮、牢房、登记册、搜查令、城市守卫、州长宣誓和最终密封计数器完成或高于阈值。巴黎必须保持控制，最后的建筑必须存在，国家不能破产，巴士底狱不能被占领或受到积极围困，资本骚乱必须得到遏制。最后一幕发生在总督府和内院。钥匙放在桌子上并大声数数；监狱卷册和逮捕证档案已封存；军械师展示库存武器和火药分类帐；警卫队队长宣誓轮换；城市守望代表收到街头命令；统治者的秘书宣布要塞总督以国王的名义拥有巴士底狱。这一奇迹变成了国家能力，因为巴士底狱将资本保管、军火库纪律和可见的关键控制转化为更大的驻军和经常性的合法性。
    failure_or_timeout_logic: >-
      仪式可以通过短暂的法庭延迟来等待，但如果审计推迟太久，守备准备、保证清晰度和火药安全性就会减弱。如果赞助商失去了巴黎，最后的巴士底狱建筑消失，国家仍然破产，堡垒被占领或摧毁，或者没有公认的统治者/摄政王可以授权钥匙和搜查令，那么它就会取消。严重的首都骚乱、围困、监狱骚乱、火灾、火药爆炸、高价值囚犯越狱、逮捕令丑闻、守卫无薪、城市守卫拒绝或未解决的继承问题都应该暂停进度，并可能重置钥匙、逮捕令和州长宣誓计数器。如果胜利伴随着资本混乱或堡垒破坏，则pre_winning_war贡献应被撤销或忽略。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对巴黎的所有权或控制权，最终独特的巴士底狱建筑存在，没有破产，没有占领或无效围攻，可控的资本动乱，可用的堡垒，公认的统治者或摄政，有效的州长/城市命令，足够的金库，以及没有活跃的重复仪式。添加主题检查，包括驻军可用性、军火库安全、监狱记录、法庭忠诚度、没有严重的监狱丑闻以及尚未侵犯巴黎的战争。
      start_effect_script: >-
        将仪式绑定到赞助商和巴黎，存储统治者/摄政王、要塞总督、首都安全、战争和继承背景，初始化塔楼、大门/吊桥、钥匙、警卫、军火库、火药和口粮、牢房、囚犯登记册、授权印章、城市守望的计数器，总督宣誓和最终军火库印章，应用临时安全负担，并存储驻军、合法性、财政、动乱和当地基线。
      snapshot_effect_script: >-
        刷新全球驻军规模、每月合法性、当前合法性、稳定性、财政、债务、战争疲劳、人力或驻军储备、宫廷/贵族忠诚度、叛乱风险、当地占领、围困、动乱、破坏、繁荣，要塞状况、护城河/吊桥可用性、军械库、火药安全、警卫强度、监狱登记完整性、牢房状况、授权档案、城市守望合作、资本拥挤压力、继承状态和最终建筑存在。
      progress_effect_script: >-
        每月刻度、高级塔检查、大门和吊桥测试、关键审计、警卫轮换、军火库库存、火药/口粮分类账、牢房检查、囚犯登记核对、逮捕令审查、城市守望协调、州长宣誓、和密封准备。因破产、占领、围困、动乱、监狱骚乱、火灾、火药事故、钥匙丢失、搜查令丑闻、守卫无薪、法院派系暴力或继承纠纷而暂停或衰退。使用ruler_death更新关键誓言，pre_winning_war仅在资本安全重要时使用。
      completion_trigger_script: >-
        要求总体进度或基本计数器完成，巴黎控制，最终建筑存在，没有破产，没有占领或围攻，可控的骚乱，可用的堡垒，完成关键审计，封存的手令，库存军火库，受薪警卫，合作城市守卫和公认的统治者/摄政王
      completion_effect_script: >-
        移除临时安全负担，应用保留global_garrison_size_modifier和monthly_legitimacy的永久国家修正，授予一次性合法性、驻军增援、首都动乱救济、声望或安全奖励，添加巴士底狱军火库封印站点记忆，清除瞬态计数器，并设置持久完成或冷却标记。
    intended_rewards:
      permanent_country_modifier: >-
        保留global_garrison_size_modifier和monthly_legitimacy。驻军规模来自经过审计的警卫、补给、轮换和兵工厂容量；合法性来自于王室对钥匙、搜查令、保管权和资本防御的明显控制。
      one_time_reward: >-
        授予一次性合法性、减少首都骚乱、增援驻军、人力、威望或安全准备。如果pre_winning_war做出了贡献，则将部分奖励用于战时资本控制，而不是原始的军事荣耀。
      local_building_reward: >-
        巴黎应该保留计算钥匙、密封的授权箱、警卫名册、军械库分类帐、火药库、吊桥测试、监狱登记册和城市守望命令的记忆。稍后的实施可以将其表达为当地驻军规模、较低的首都动荡、更快的堡垒恢复或危机期间更强的合法性。
    notes: >-
      源仪式是即时的，但定时模式更好地代表首都要塞和监狱审计。每月负责库存和警卫纪律； ruler_death 更新关键誓言；仅当巴士底狱的首都安全支持相关战争时，才会包含 pre_winning_war。奖励必须保持驻军规模和合法性，并以起义威慑作为辅助效果。
- id: 199
  key: unique_carcassonne_castle
  base_key: star_fortress_city
  location: carcassonne
  source_ritual_key: double_wall_watch
  status: designed
  ritual_design_zh:
    title: 卡尔卡松双壁手表
    mode: timed
    duration: >-
      定时模式应持续一个前沿手表季节，通常为六到九个月的滴答声。这段时期包括检查幕墙、指派塔楼值班、检查门楼和外堡、填充粮仓、修理弩和火炮库，以及在设防城镇和周围道路上进行巡逻。来源是直接的，但驻军规模和士气来自于反复的守望纪律，而不是一次游行。
    listeners:
    - monthly
    - pre_winning_war
    - ending_war
    historical_flavor: >-
      卡尔卡松的双城守望属于要塞城市，因为卡尔卡松是一个分层的防御社区：双层幕墙、塔楼、门楼、内堡、市场街道、水井、粮仓、葡萄园和穿过法国南部的道路都依赖于纪律严明的守望。参与者包括总管或城主、城门队长、塔楼军士、弩手、军械师、敲钟人、泥瓦匠、粮仓管理员、市场官员、葡萄园和村庄代表、护卫神职人员、信使以及来自城镇和乡村的巡逻队。这些地方包括外墙、内墙、两条赛道之间的列表、纳博讷和奥德门区、塔楼、外堡、城堡庭院、市场街道、水井、粮仓、军械库以及通往葡萄园和山丘的道路。这些物品包括塔钥匙、钟、十字弓、火药、火药或火炮、头盔、修石工具、粮食量具、巡逻牌、门链、消防桶、横幅和道路警告喇叭。驻军规模不断扩大，因为每个塔楼和大门都接收指定的人员、物资和轮换。土地士气高涨，因为士兵和城镇居民看到双层城墙是一个活跃的系统，而不是一个古老的外壳。
    confirmation_logic: >-
      赞助商必须拥有或控制卡尔卡松，最终的卡尔卡松城堡奇迹建筑必须存在，国家不能破产，城墙电路、门楼和城堡内部不能被占领、被积极围攻、被破坏、被烧毁或严重动乱。确认需要有足够的国库来支付警卫、泥瓦匠、粮食、武器和巡逻工资，有公认的当地军事当局，有供村庄和葡萄园代表回答的安全道路，以及城镇内可管理的市场秩序。如果实施可以检查驻军规模、士气、当地防御力、破坏程度、当地繁荣、人力、战争状况、边境压力或叛乱风险，则应细化资格。如果城墙能够准备好，战争就可以被允许；积极的围攻或占领阻碍了开始。战争听众应该只与卡尔卡松的防御、道路或驻军很重要的冲突相关。
    start_logic: >-
      起始效果记录了赞助国、作为仪式地点的卡尔卡松、最终的要塞建筑、城主或军事当局以及当前的边境战争状态。它概述了全球驻军规模、土地士气、人力或驻军储备、稳定性、声望、合法性、财政、收入、债务、厌战和军事财产支持（如果有）的国家基线。它快照了占领、围困、动乱、破坏、繁荣、外墙状况、内墙状况、门楼准备情况、塔楼监视覆盖范围、军械库、粮仓库存、油井安全、市场秩序、道路和葡萄园安全以及巡逻可用性的当地基线。它初始化了外墙测量、内墙测量、门楼测试、塔钟名册、重点审计、弩和火炮储备、装甲修理、粮仓库存、水井和火桶检查、市场街道巡逻、葡萄园道路巡逻、村庄警报网络和最终双回路检查等计数器。临时负担包括卫兵、泥瓦匠、粮食、弓弦、争吵、火药、钟声、巡逻工资以及训练中损失的市场时间。
    progress_logic: >-
      每月的进展是要塞城市的警觉。泥瓦匠检查塔楼、护墙、围板、楼梯以及围墙电路之间的步行空间，标记必须重置的石头。门长测试链条、吊闸、门、铰链和夜间锁。敲钟人和警官向每个塔楼分配警报，这样来自一堵墙的信号就会得到另一堵墙的应答。军械师清点弩、弦、弓、头盔、盾牌、长矛、火罐和火炮储备。粮仓管理员测量谷物、盐、水和饲料，以便驻军能够保持武装。巡逻队在市场、葡萄园、桥路和山道上行走，而村庄代表则报告袭击者、土匪或敌人侦察兵的情况。当卡尔卡松受到控制、维护费用得到支付、墙壁可用、骚乱程度较低且道路可以巡逻时，就会取得进展。它因破产、占领、主动围攻、严重动乱、火灾、瘟疫、粮食短缺、守卫无薪、城门被攻破、道路失控或指挥纠纷而暂停。它以强大的人力、良好的士气、地方的繁荣、乡民的合作、道路的安全、物资的充足和战时的紧迫而加速。
      pre_winning_war 仅当坚固的城市有助于确保即将到来的胜利时才应增加进度。 ending_war 仅在战争对该地区进行考验时才应协调伤亡、修复物资并验证防御。
    completion_logic: >-
      完成要求外墙、内墙、门楼、塔钟、钥匙、武器、盔甲、粮仓、井/火、市场巡逻、葡萄园道路、村庄警报和最终审查计数器完成或高于阈值。卡尔卡松仍然必须受到控制，最终的建筑必须存在，国家不能破产，两条城墙电路必须可用，并且城镇必须安全以进行监视审查。最后的场景从内部城堡开始，穿过两堵墙之间的列表。城主收到塔楼钥匙；敲钟人应答从一个门到另一个门的信号；弩手展示修理过的商店；粮仓管理员呈上计量的谷物；市场和葡萄园代表确认巡逻路线；神职人员祝福守望旗帜；然后警卫在外墙和内墙上完成完整的循环。这一奇迹变成了国家能力，因为卡尔卡松的双层城墙现在支持更大的驻军义务和建立在可见准备基础上的士气系统。
    failure_or_timeout_logic: >-
      该仪式可以等到下一个观察季节，但如果推迟太久，守卫名册、商店和道路情报就会衰退。如果赞助商失去卡尔卡松，最后的堡垒建筑消失，国家仍然破产，城墙被占领或摧毁，或者城镇受到积极围困，它就会取消。严重的骚乱、火灾、瘟疫、大门被破坏、粮仓损失、守卫无薪、村庄拒绝、道路不安全、指挥纠纷或战争破坏应该暂停进度，并可能重置大门、武器和巡逻柜台。一场以失败告终的战争应该在完成之前强制进行新的修复和名册审核；只有在城墙和驻军幸存的情况下，相关胜利才能确认守望。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对卡尔卡松的所有权或控制权、最终独特的堡垒建筑存在、没有破产、没有占领或主动围攻、可控的骚乱、可用的外墙和内墙、准备好的门楼、公认的军事权威、足够的金库以及没有活跃的重复仪式。添加对驻军储备、士气、粮仓商店、道路/葡萄园安全、当地繁荣、破坏和战争相关性的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和卡尔卡松，存储城堡或军事当局和边境战争背景，初始化外墙、内墙、大门、塔钟、钥匙、武器、盔甲、粮仓、水井/消防桶、市场巡逻、葡萄园道路、村庄警告和最终计数器审查，应用临时值班负担，并储存驻军、士气、人力、财政和当地基线。
      snapshot_effect_script: >-
        刷新全球驻军规模、土地士气、人力或驻军储备、稳定性、声望、合法性、国库、债务、厌战、军事支持、当地占领、围困、动乱、破坏、繁荣、城墙状况、大门准备情况、塔楼守望、军械库、粮仓库存、井安全、市场秩序、道路/葡萄园安全、巡逻可用性和最终建筑存在。
      progress_effect_script: >-
        每月检查、提前墙调查、大门测试、塔钟名册、关键审计、武器和装甲维修、粮仓库存、井和消防桶检查、市场巡逻、葡萄园道路巡逻、村庄预警网络和最终审查准备。由于破产、占领、围困、动乱、火灾、瘟疫、食物短缺、守卫无薪、大门被攻破、道路损失或指挥纠纷而暂停或衰退。仅将pre_winning_war和ending_war用于相关区域防御。
      completion_trigger_script: >-
        要求完成全部进度或基本计数器，卡尔卡松受控，最终建筑存在，无破产，无占领或围攻，可控制的骚乱，可用的双墙，准备好的门楼，库存武器和粮仓，受薪警卫，安全巡逻道路和认可的指挥。
      completion_effect_script: >-
        消除临时值班负担，应用永久国家修正保留global_garrison_size_modifier和land_morale_modifier，授予一次性驻军增援、人力、军队传统、声望、地方防御或骚乱救援奖励，添加卡尔卡松双墙监视站点内存，清除瞬态计数器，并设置持久完成或冷却标记。
    intended_rewards:
      permanent_country_modifier: >-
        保留global_garrison_size_modifier和land_morale_modifier。驻军规模取决于指定的塔楼和城门义务、补给和巡逻；士气来自于知道双层城墙、钟声、粮仓和道路都经过了明显的考验。
      one_time_reward: 给予一次性驻军增援、人力、军队传统、威望、地方防御或骚乱救济。如果战争听众做出了贡献，则将部分奖励用于修复商店和测试防御后的士气。
      local_building_reward: >-
        卡尔卡松应该保留塔钟名册、大门钥匙、弩库、粮仓措施、修复的墙壁、市场巡逻、葡萄园道路巡逻和村庄警报喇叭的记忆。稍后的实施可以将其表达为当地防御、补给、堡垒恢复或减少边境压力期间的骚乱。
    notes: >-
      源仪式是即时的，但定时模式更好地代表边境观察季节。每月涵盖墙壁、商店和巡逻人工；仅当卡尔卡松的防御对冲突很重要时才包含pre_winning_war和ending_war。奖励必须以驻军规模和土地士气为中心。
- id: 200
  key: unique_brest_naval_port
  base_key: national_shipyard
  location: brest
  source_ritual_key: atlantic_fleet_muster
  status: designed
  ritual_design_zh:
    title: 大西洋舰队在布雷斯特集结
    mode: timed
    duration: >-
      定时模式应持续一个舰队准备季节，通常为每月九到十二个周期。在宣布舰队准备好投入大西洋服役之前，这段时间需要勘察路基、修理码头和干船坞、检查船只、绳索、木材堆场、帆棚、杂志、船员名册、食品、海图和海军物品。来源是直接的，但海军士气和航程来自持续的武库例行程序和经过验证的海战准备。
    listeners:
    - monthly
    - pre_winning_war
    - ending_war
    historical_flavor: >-
      布雷斯特的大西洋舰队集结属于军港，因为布雷斯特不仅仅是一个港口；它是一个海军港口。它是一个兵工厂、路边基地、修理基地、绳索和木材系统以及面向大西洋的指挥学校。石头码头、遮蔽水域、索道、干船坞、木材堆场、起重机、杂志、帆棚、军官宿舍和入海通道使国家能够将船只变成一支纪律严明的舰队，可以在当地水域之外航行。参与者包括海军上将或舰队指挥官、海军总司令、码头长、造船工、填缝工、制绳工、帆工、炮手、火药军官、飞行员、制图师、外科医生、牧师、海军陆战队员、水手、粮食供应商、木材商以及记录工资和物品的职员。这些地方包括布雷斯特修路场、石头码头、干船坞、索道、木材堆场、杂志社、帆棚、电池平台、海图室、集合码头和大西洋出发航道。这些物品包括船体平面图、桅杆、焦油、麻绳、帆、大炮、火药桶、炮弹、锚、饼干、盐肉、水桶、海图、信号旗、海军物品、工资单和护航命令。海军士气高涨，因为船员们看到船只、工资、枪支、食物和指挥都准备好了。海军航程的扩大是因为飞行员、海图、补给品、维修和护航规划让舰队能够更远地驶入大西洋。
    confirmation_logic: >-
      赞助商必须拥有或控制布雷斯特，最后的布雷斯特海军港奇迹建筑必须存在，国家不能破产，港口、陆路停泊处、码头、杂志和大西洋通道不能被占领、封锁、围困或严重动乱。确认应需要可用的船只或舰队容量、水手、飞行员、木材或修理材料、足够的工资、食品、火药和码头劳动力的国库，以及运作良好的海军指挥部。如果实施可以检查海军士气、海军射程、水手、舰队规模、海军传统、封锁、战争状态、私掠船威胁、当地繁荣、火灾风险、叛变风险或供应短缺，那么这些应该细化资格。如果港口能够准备舰队，则允许战争；封锁或敌人在布雷斯特登陆阻碍开始。只有当布雷斯特的舰队、维修或大西洋后勤很重要时，战争听众才应该考虑。
    start_logic: >-
      起始效果记录了赞助国、作为仪式地点的布雷斯特、最终的军港建筑、海军上将或海军总司令、当前战争状态以及大西洋护航队或舰队背景。它概括了海军士气、海军射程、水手、海军传统或舰队战备状态、船舶数量（如果有）、财政、收入、债务、稳定性、威望、厌战状态、封锁状态以及商业或海军派系支持等国家基线。它快照了占领、封锁、动乱、破坏、繁荣、港口可用性、路基安全、码头状况、干船坞容量、绳索输出、木材供应、帆棚准备情况、弹药库安全、船员可用性、食品储备、飞行员和海图可用性、风暴风险和火灾风险的当地基线。它初始化用于路基调查、码头和干船坞检查、船体审查、索道审计、木材堆场库存、帆阁检查、杂志和枪支审查、船员名册、工资和物品、食品储存、海图和引航员板、车队订单、外科医生和牧师名册以及最终舰队集合的计数器。临时负担包括工资、绳索、焦油、木材、帆、火药安全、食品、码头劳动力、飞行员和保留军火库时延迟的商业运输。
    progress_logic: >-
      每月进度是将军火库转变为舰队。码头管理员检查码头、起重机、滑台、干船坞、泵和填缝时间表。造船工人检查船体接缝、桅杆、舵、锚和索具；绳索制造商测量大麻和电缆的强度；帆匠修补帆布并计算备用帆。木材官员将堆场库存与维修需求进行比较。炮手检查大炮、炮架、火药桶、射击、慢火和防火措施。食品供应商包装饼干、咸肉、水桶、啤酒、醋和医疗用品；外科医生和牧师被分配到船上。职员会阅读工资单和海军文章，以便船员在航行前了解指挥和纪律。飞行员和制图师更新海图、探测、大西洋航线、护航站和风暴避难所。当布雷斯特开放、维护费已支付、人员和材料到位、弹药库安全且大西洋航线不被封锁时，进展就会取得进展。它因破产、占领、封锁、严重动乱、叛乱、火灾、火药事故、木材短缺、水手短缺、风暴破坏、拖欠工资或舰队失败而暂停。它通过强大的财政、高水平的水手、良好的海军士气、可用的船只、安全的路基、强大的码头能力以及紧急但可管理的战争需求而加速。仅当布雷斯特的舰队服务有助于即将到来的胜利时，pre_winning_war才会增加进度。
      ending_war 在确认进度之前审核损失、维修和返回人员。
    completion_logic: >-
      完成要求锚地、码头、船体、索道、木材、帆、杂志、船员、工资/物品、食物、海图/飞行员、车队、外科医生/牧师和最终集合计数器完成或高于阈值。布雷斯特仍然必须受到控制，最终的建筑必须存在，国家不能破产，港口不能被封锁，弹药库和路基必须安全。最后的场景发生在集合码头和路边。海军上将从总督那里收到船舶清单；码头管理员出示维修证书；枪手封存弹匣台账；绳索和帆大师展示样品；飞行员展开大西洋海图；职员向集合的船员宣读工资和海军条款；当战舰和护航护航舰鸣礼并驶向海峡时，信号旗升起。这一奇迹变成了国家能力，因为布雷斯特的军火库例行公事已经提高了士气，并且其实际运作范围远远超出了布列塔尼。
    failure_or_timeout_logic: >-
      这种仪式可以等到稍后的航行季节，但如果拖延太久，船员的准备情况、食物、图表和维修证书就会减弱。如果赞助商失去布雷斯特、最后的港口建筑消失、国家仍然破产、港口被占领或摧毁、或者大西洋通道仍然被封锁，那么它就会取消。严重的骚乱、叛乱、火灾、火药爆炸、风暴破坏、木材或水手短缺、拖欠工资、敌人袭击或破坏集结舰队的失败都会暂停进度，并可能重置船舶、杂志和船员计数器。
      ending_war胜利后只有记录损失和修复后才能确认集结；
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对布雷斯特的所有权或控制权、最终独特的军港建筑存在、没有破产、没有占领或围困、没有封锁、可控的骚乱、可用的码头和路基、可用的船舶或舰队容量、水手、飞行员、维修材料、足够的金库以及没有活跃的重复仪式。添加对海军士气、海军射程、杂志、索道、木材、兵变风险、火灾风险和战争相关性的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和布雷斯特，存储海军上将/总督、战争状态和大西洋舰队背景，初始化路基、码头、船体、索道、木材、帆、杂志/枪支、船员名册、工资和物品、食物的计数器，海图/飞行员、护航舰队命令、外科医生/牧师名册和最终集结，应用临时军火库负担，并存储海军、水手、金库、封锁和当地基线。
      snapshot_effect_script: >-
        刷新海军士气、海军射程、水手、海军传统或舰队战备状态、舰船数量、金库、债务、稳定性、威望、厌战状态、封锁状态、海军/商船支持、当地占领、封锁、动乱、破坏、繁荣、港口可用性、路基安全、码头状况、干船坞容量、索道输出、木材供应、风帆阁楼准备情况、杂志安全、船员可用性、食品商店、飞行员/海图可用性、风暴/火灾风险和最终建筑存在。
      progress_effect_script: >-
        按月进行，提前路基调查、码头和干船坞检查、船体审查、索道审计、木材库存、风帆阁楼检查、杂志和枪支审查、船员名册、工资/物品、食物、图表和飞行员委员会、护航命令、外科医生/牧师名册以及最后的集结准备。由于破产、占领、封锁、动乱、叛乱、火灾、火药事故、木材短缺、水手短缺、风暴破坏、拖欠工资或失败而暂停或衰退。仅将
        pre_winning_war 和 ending_war 用于相关车队服务。
      completion_trigger_script: >-
        要求总进度或基本计数器完成，布雷斯特控制，最终建筑存在，没有破产，没有占领或封锁，可控制的骚乱，可用的码头和路基，安全弹匣，可用的船员，船舶，飞行员，食品，图表，支付的工资和完成的海军物品。
      completion_effect_script: >-
        消除临时军火库负担，应用保留naval_morale_modifier和naval_range的永久国家修正，一次性授予水手、海军传统、声望、维修能力、贸易保护或当地繁荣奖励，添加大西洋舰队集合地点记忆，清除瞬态计数器，并设置持久完成或冷却标记。
    intended_rewards:
      permanent_country_modifier: >-
        保留naval_morale_modifier和naval_range。海军士气来自于受薪船员、物品、枪支、修理和补给；海军范围来自海图、飞行员、食物、绳索、帆、路基安全以及能够使船舶远离家乡运行的武库。
      one_time_reward: 授予一次性水手、海军传统、声望、维修能力、贸易保护或当地港口繁荣。如果战争听众做出了贡献，请将部分奖励用于经过验证的舰队服务和战后维修，而不是一般的声望。
      local_building_reward: >-
        布雷斯特应该保留对路基调查、干船坞证书、索道审计、木材库存、杂志封条、船员名册、飞行员图表、护航命令和海军物品的记忆。稍后的实施可以将其表达为本地船舶维修、水手、海军补给、封锁恢复或大西洋作战范围。
    notes: >-
      源仪式是即时的，但定时模式更好地代表舰队准备季节。每月处理兵工厂劳务；仅当布雷斯特的舰队或维修对冲突很重要时才包含pre_winning_war和ending_war。奖励必须保持海军士气和海军射程。
- id: 201
  key: unique_colmar_old_town
  base_key: ancient_city_ruins
  location: colmar
  source_ritual_key: alsatian_heritage_fair
  status: designed
  ritual_design_zh:
    title: 老城阿尔萨斯遗产博览会
    mode: timed
    duration: >-
      定时模式应持续一个城市修复和博览会季节，通常为每月六到九次。这段时间意味着在最后的遗产博览会之前检查半木结构的房屋、运河、行会标志、桥梁、市场摊位、教堂记录、坚固的大门、酒窖和城镇章程。来源是直接的，但科尔马的声望和合法性来自于随着时间的推移明显维护的公民记忆和行会秩序。
    listeners:
    - monthly
    historical_flavor: >-
      老城区的阿尔萨斯遗产博览会属于科尔马，因为该镇的力量是公民的连续性，在街道、木材、运河、行会标志、市场、酒馆、教堂石头和大门记录中体现得淋漓尽致。这不是从虚空中回收的古老废墟，而是一座古老的废墟。它是一个充满活力的城市结构，经过精心修复，告诉居民和游客合法的城镇生活一直在延续。参加者包括市长或镇议会、行会大师、木匠、泥水匠、油漆工、石匠、运河管理员、桥梁管理员、酒商、制桶工人、市场检查员、教堂神职人员、公证人、门卫、看守人和面向游行路线的住户。这些地方包括集市广场、石头教堂、半木结构的小巷、运河边缘、桥梁、酒摊、会馆、城镇档案馆、坚固的大门、商人酒窖以及大声朗读标志和章程的古老街道。这些物品包括行会标志、木梁、石膏、油漆、屋顶瓦片、运河钩、桥板、酒桶、市场砝码、城镇印章、章程书、门钥匙、蜡烛、横幅和集市令牌。每月的声望都会上升，因为科尔马展现了保存和修复的阿尔萨斯城市特征。每月的合法性会上升，因为行会、教堂、议会、大门、市场和家庭都确认了相同的公民秩序。
    confirmation_logic: >-
      赞助者必须拥有或控制科尔马，最后的科尔马老城奇迹建筑必须存在，国家不能破产，老城不能被占领、烧毁、淹没、围困或严重动乱。确认应该需要和平的行会关系、运作良好的理事会或市政当局、为木匠、泥水匠、警卫、公证人提供足够的金库、市场安排和运河工程，以及为酒商和游客提供安全的道路。如果实施可以检查每月的声望、每月的合法性、当地的繁荣、市民或行会的支持、贸易准入、火灾或洪水风险、破坏、战争状态、宗教紧张或继承稳定性，那么这些应该细化资格。只有在科尔马及其道路保持安全的情况下才允许战争；围困、占领或市场关闭应该阻止该仪式。
    start_logic: >-
      开始效果记录了赞助国、作为仪式地点的科尔马、最终的老城区建筑、当前的议会或市政当局以及修复/公平季节。它快照了每月威望、每月合法性、当前威望、合法性、稳定性、财政、收入、债务、市民或行会支持、文化产出（如果有）以及贸易路线暴露的国家基线。它记录了占领、围困、动乱、破坏、繁荣、老城可用性、立面状况、运河状况、桥梁安全、会馆通道、集市广场秩序、教堂通道、大门状况、档案完整性、葡萄酒贸易、火灾风险、洪水风险和道路安全等方面的当地基线。它初始化立面调查、木材和灰泥修复、运河清理、桥梁检查、行会标志修复、行会章程阅读、市场重量审核、酒摊登记、教堂游行、档案和城镇印章审查、大门钥匙检查、值班巡逻和最终遗产博览会等柜台。临时负担代表工匠、油漆、木材、灰泥、警卫、公证人、蜡烛、市场摊位、运河劳动力以及街道修复期间市场准入的减少。
    progress_logic: >-
      每月的进展是旧的公民记忆变得值得信赖。木匠和泥水匠检查游行路线沿线的半木结构房屋，更换腐烂的横梁，重新粉刷可见的面板，并记录哪些家庭需要维护。运河管理员清除淤泥和碎片，检查桥板，并防止水侵蚀地窖和街道。行会会长将标语、横幅、学徒名册和章程带到理事会；公证人将旧的特权与当前的市场义务进行比较。酒商对酒桶、地窖和集市摊位进行登记；制桶工人和检查员测试措施，以便游客信任该行业。教堂神职人员准备仪式和游行秩序，而门卫则检查钥匙、哨所和道路。当老城区安全、维护费用得到支付、行会合作、道路开放、运河健全、当地骚乱程度较低时，就会取得进步。它因破产、占领、围困、严重动乱、火灾、洪水、瘟疫、行会纠纷、葡萄酒欺诈、道路堵塞、档案损坏或议会合法性危机而暂停。它随着当地繁荣、强大的市民支持、高合法性、良好的财政、安全的道路、活跃的葡萄酒贸易和低动荡而加速。
    completion_logic: >-
      完成需要立面、木材/灰泥、运河、桥梁、行会标志、特许、市场、葡萄酒、教堂、档案、大门、手表和最终公平柜台完成或超过阈值。科尔马仍然必须受到控制，最终的建筑必须存在，国家不能破产，老城区必须安全，行会和议会必须合作。最后的场景从坚固的大门开始，在那里展示钥匙和值班名册，然后穿过半木结构的街道到达集市广场。重新悬挂行会标志；城镇章程和印章由公证人阅读；教堂的钟声召唤着游行队伍；酒商开设经过认证的摊位；运河管理员和桥梁管理员报告已完成的工作；理事会确认旧的特权、市场措施和家庭维护义务仍然有效。这一奇迹成为国家能力，因为科尔马保存完好的街道将公民记忆转化为反复出现的声望和合法性。
    failure_or_timeout_logic: >-
      仪式可以等到下一个公平季节，但如果拖延太久，门面修复、行会出席和酒商承诺就会减弱。如果赞助商失去科尔马、最后一座老城区建筑消失、国家仍然破产、老城区被占领或摧毁，或者火灾/洪水导致游行路线无法使用，那么游行就会取消。严重的骚乱、行会骚乱、市场欺诈、运河崩溃、桥梁故障、瘟疫、档案丢失、宗教混乱、道路堵塞或威胁城镇的战争应该暂停进度，并可能重置特许权、大门和公平柜台。如果城镇在占领后恢复，则在完成前必须重新审核外墙、档案、行会标志和市场权重。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对科尔马的所有权或控制权、最终独特的老城区建筑存在、没有破产、没有占领或无效围困、可控的骚乱、可用的老城区街道、正常运作的公民权威、和平的行会、开放的道路、用于恢复和公平工作的足够金库以及没有活跃的重复仪式。添加对当地繁荣、市民/行会支持、教堂和市场准入、火灾/洪水/瘟疫缺席、档案完整性和战争不关闭城镇的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和科尔马、商店议会/公民权威和公平季节背景，初始化立面调查、木材/石膏修复、运河清理、桥梁检查、行会标志、行会章程、市场重量、酒摊、教堂游行的柜台，档案/封印审查、大门钥匙、监视巡逻和最终公平，应用临时恢复负担，并存储声望、合法性、市民、金库、贸易和地方基线。
      snapshot_effect_script: >-
        刷新每月声望、每月合法性、当前声望、合法性、稳定性、金库、债务、市民或行会支持、文化输出、路线暴露、当地占领、围困、动乱、破坏，繁荣、老城区可用性、立面状况、运河状况、桥梁安全、会馆通道、市场广场秩序、教堂通道、大门状况、档案完整性、葡萄酒贸易、火灾风险、洪水风险、道路安全和最终建筑存在。
      progress_effect_script: >-
        每月检查、提前立面调查、木材和灰泥修复、运河清理、桥梁检查、行会标志修复、章程阅读、市场重量审核、酒摊登记、教堂游行、档案和封条审查、大门钥匙检查、观看巡逻，以及最后的公平准备。因破产、占领、围困、动乱、火灾、洪水、瘟疫、行会纠纷、葡萄酒欺诈、道路堵塞、档案损坏或议会合法性危机而暂停或衰退。加速繁荣、市民支持、合法性、财政、安全道路、葡萄酒贸易和低骚乱。
      completion_trigger_script: >-
        要求总体进度或基本计数器完成，科尔马控制，最终建筑存在，没有破产，没有占领或围困，可控骚乱，可用的街道和运河，合作行会，有效的许可证，经过认证的市场措施，安全的道路，开放的教堂和市场，以及有偿修复
      completion_effect_script: >-
        消除临时恢复负担，应用保留monthly_prestige和monthly_legitimacy的永久国家修正，授予一次性声望、合法性、当地繁荣、市民满意度、贸易收入或骚乱救济奖励，添加阿尔萨斯遗产博览会现场记忆，清除瞬态计数器，并设置持久完成或冷却标记。
    intended_rewards:
      permanent_country_modifier: >-
        保留 monthly_prestige 和 monthly_legitimacy。声望来自于维护良好的半木结构街道、行会标志、运河、教堂、葡萄酒市场和可见的遗产；合法性来自于公开确认的章程、印章、大门、行会义务和议会命令。
      one_time_reward: 授予一次性声望、合法性、地方繁荣、市民或行会满意度、来自葡萄酒博览会的贸易收入或骚乱救济。如果火灾、洪水或占领威胁到了老城区，奖励可以倾向于恢复公民信心。
      local_building_reward: >-
        科尔马应该保留修复的木质外墙、行会标志、运河空地、桥梁检查、酒摊登记册、特许阅读、市场重量、大门钥匙和城镇印章的记忆。稍后的实施可以将其表达为当地声望、合法性、贸易价值、减少骚乱或更好地从火灾和洪水中恢复。
    notes: >-
      源仪式是直接的，但定时模式更好地代表恢复和遗产博览会季节。每月一次就足够了，因为这项工作是公民的、商业的和档案的，而不是战争或继承驱动的。奖励必须保持每月的声望和每月的合法性；当地贸易和文化记忆是支持机制。
