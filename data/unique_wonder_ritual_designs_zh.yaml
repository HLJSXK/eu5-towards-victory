  ritual_design_zh:
    title: 枫丹白露学校赞助季
    mode: timed
    duration: >-
      定时模式应持续一个住宿和赞助季，通常为每月九到十二个周期。这段时间意味着将宫廷搬到宫殿，准备画廊和花园，雇用画家、灰泥工人、诗人、建筑师和工匠，组织森林狩猎，接待选定的撤退使节，并揭晓完成的委托。来源是直接的，但枫丹白露的威望和合法性来自于持续的居住、赞助和对君主的控制。
    listeners:
    - monthly
    - ruler_death
    historical_flavor: >-
      枫丹白露学校赞助季节属于枫丹白露，因为宫殿将皇室休闲变成了统治工具。其彩绘画廊、灰泥装饰、马蹄形楼梯、花园、森林、狩猎小屋、警卫路线、作坊、教堂和私人接见室，让宫廷展现出统治者的宏伟、品味、王朝、自然和精选外交。参与者是君主或摄政王、王室官员、画家、灰泥工人、雕塑家、建筑师、诗人、音乐家、花园管家、猎人、马厩主人、朝臣、宠臣、远离城市人群邀请的大使、秘书、警卫、厨师和教堂神职人员。这些地方包括画廊、马蹄形楼梯、教堂、庭院、正式花园、森林游乐设施、马厩、艺术家工作室和私人房间，在这些地方，进入本身就很受欢迎。这些物品包括壁画卡通、颜料、灰泥模具、挂毯、狩猎号角、马鞍、花园平面图、喷泉部件、诗歌、外交信件、赞助名册、座位表和纪念肖像（如果发生死亡）。由于宫殿不断产生可识别的宫廷风格，每月的威望都会上升。每月的合法性会上升，因为统治者在受控制的皇家住所中施予恩惠、正义、艺术、准入和王朝记忆。
    confirmation_logic: >-
      赞助者必须拥有或控制默伦，最后的枫丹白露宫奇迹建筑必须存在，国家不能破产，宫殿、花园、森林通道和来自巴黎的宫廷道路不能被占领、不安全或遭受严重骚乱。确认需要有一位公认的统治者或摄政王能够主持朝廷，有足够的国库供艺术家、狩猎、守卫、维修和招待，以及足够的宫廷稳定性以顺利地移动贵族和使节。如果实施可以检查威望、合法性、宫廷或贵族忠诚、艺术家支持、当地繁荣、瘟疫、森林安全、战争状态、继承稳定性或外交准入，那么这些应该完善触发器。只有宫道和森林安全，才允许战争；威胁巴黎或默伦的战争应该阻止开始。
      ruler_death 州应要求接受继承或正式摄政。
    start_logic: >-
      起始效果记录了赞助国、作为仪式地点的默伦/枫丹白露、最终的宫殿建筑、现任统治者或摄政王、居住季节、受邀艺术家以及任何使节撤退背景。它快照了每月威望、每月合法性、当前威望、合法性、稳定性、财政、收入、债务、厌战、贵族或宫廷忠诚、艺术家/文化产出（如果有）以及与受邀使节的外交关系的国家基线。它快照了占领、动乱、破坏、繁荣、宫殿可用性、画廊状况、花园状况、森林安全、道路安全、马厩准备情况、车间容量、教堂通道、人群控制以及瘟疫或火灾风险的当地基线。它初始化了法庭搬迁、画廊委托、灰泥和绘画工作、花园和喷泉维修、狩猎名册、马厩检查、艺术家赞助名册、诗歌和音乐节目、特使撤退、教堂服务、警卫路线和最终揭幕等柜台。临时负担包括艺术家工资、颜料、石膏、园林工程、马匹、狩猎、警卫、厨房费用、宫廷住宿和外交招待费。
    progress_logic: >-
      每月进度是皇家住所变成国家剧院。内务官员将法庭记录、厨房、警卫和礼仪物品移入宫殿。艺术家准备卡通、颜料、灰泥模具、框架和脚手架时间表；建筑师和泥瓦匠在委托展示之前修复画廊、楼梯、屋顶和潮湿的墙壁。花园管理员清洁小巷、喷泉、池塘和正式的床，而猎人则检查森林游乐设施、猎犬、马、角和安全通道。诗人和音乐家准备歌颂王朝和赞助的表演。秘书们为贵族和使节安排私人接见，将进入官邸的权限变成了一种受控的恩惠。教堂神职人员准备服务，特别是在需要纪念语言的情况下。当宫殿安全、维护费用得到支付、统治者或摄政王得到承认、艺术家可以工作、森林和道路安全、宫廷派系保持平静时，进步就会推进。它因破产、占领、严重动乱、瘟疫、火灾、不安全的道路、森林盗匪、无薪艺术家、宫廷派别暴力、丑闻的恩惠纠纷或继承危机而暂停。它以高度的合法性、强大的金库、合作的贵族、才华横溢的艺术家、和平的道路、繁荣的当地供应和低动荡而加速。在ruler_death上，只有在新的授权被接受的情况下，听众才应该将进度转换为纪念肖像、教堂办公室和继任者住所。
