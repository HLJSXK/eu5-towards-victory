  ritual_design_zh:
    title: 犹太教堂区理事会登记册
    mode: timed
    duration: >-
      定时模式应持续九到十二个月的时间间隔，足够长的时间来代表市政和公共登记周期，而不是单一的奉献。这几个月的内容包括确认旧的特权、复制公共登记簿、在拉比法庭审理纠纷、组织学习室日历、分配慈善机构和学校资金、审核市场摊位和重量，以及在主要展会季节之前就商人的安全行为进行谈判。源仪式是直接的，但该地区的价值来自记录的信任和反复出现的城市实践。
    listeners:
    - monthly
    historical_flavor: >-
      犹太教堂区的议会登记册属于布列斯特-立托夫斯克犹太区，因为它的奇迹不是一个单一的纪念性立面，而是一个由犹太教堂、书房、市场小巷、法官、商人、抄写员、教师和户主组成的紧凑的公民世界，他们在英联邦边境城市的谈判特权下工作。参与者包括拉比、公共法庭的达亚尼姆、帕纳西姆和卡哈长老、校长、图书抄写员、货币兑换商、从事布料、谷物、蜡、盐和皮革交易的商人、基督教市政官员、贵族房地产经纪人、看守人、寡妇和慈善机构看守、赌注米德拉什的学生以及需要城门外信任合同的来访商人。这些地方包括主要的犹太教堂、木结构或砖结构的祈祷室、烛光书房、市场小巷、称重台、档案箱、慈善箱、通往基督教城镇的大门以及集市，这里的商贩们会在更宽的路线上相遇。这些物品包括托拉卷轴、账簿、公共印章、税单、市场重量、仲裁记录、学校长凳、贷款质押、蜡烛存根、上锁的文件箱和安全行为信。象征意义是实用的和制度化的：受保护的学习产生可靠的识字能力、法律推理和记录保存；受保护的贸易产生信贷、经纪和可重复的合同。通过学校、抄写员和辩论性学术研究，研究速度得以提高；贸易收入增加是因为该季度将信托、仲裁和多语言经纪业务转变为商业。
    confirmation_logic: >-
      赞助商必须拥有或控制布列斯特-立托夫斯克，最后的犹太教堂季度奇迹建筑必须存在，国家不能破产，该季度不能被占领、焚烧、抢劫或严重动乱。确认应要求国家能够保护公共特权和市场准入：城门和公平路线必须安全，地方法院或市政当局必须正常运转，并且任何积极的驱逐、骚乱、宗教迫害危机或庄园叛乱都不应该使登记册变得毫无意义。主办方应有足够的资金来支付警卫、公证人、维修费用以及有争议的通行费赔偿。如果实施可以检查宽容、阶层关系、市民忠诚、神职人员压力、当地繁荣、贸易路线安全或自治特权，那么这些应该会影响资格。只有在布列斯特及其道路不受威胁的情况下，战争才是可以接受的；被围困或封锁的城市无法举办公平的仲裁。
    start_logic: >-
      起始效果记录了主办国、作为仪式地点的布列斯特-立托夫斯克、最后四分之一的建筑、现任统治者或城市当局以及公共特权的法律地位。它概括了研究速度、贸易收入、稳定性、声望、合法性、宗教团结或宽容（如果有）、市民和神职人员态度、国库、收入、债务和贸易路线风险等方面的国家基线。它记录了占领、动乱、破坏、繁荣、市场准入、公平活动、路线安全、犹太教堂区保护、市法院职能以及任何当地歧视或特权变量的当地基线。它初始化用于特权确认、pinkas复制、拉比法庭会议、学习室讲座、学校捐赠、商业登记、度量衡审计、公平安全行为、慈善评估、档案封存和最终公众认可的计数器。临时负担包括警卫、抄写员、蜡烛和纸张供应、车道和门的维修、向市政公证人付款以及执行保护的政治成本。
    progress_logic: >-
      每月的进展是可信城市基础设施的缓慢创建。长老们带来旧的章程和税单，与当前的需求进行比较；抄写员抄写平卡，列出家庭名单，记录学校会费，并将决定密封在档案箱中。拉比法官审理商业纠纷、影响财产的婚姻和继承问题以及合伙索赔，并制定书面和解书，供商人在前往集市之前信赖。校长安排自习室日历，选择课文，并为贫困学生提供支持，将季度的学习变成一个可衡量的学术网络。商家登记摊位、重量、仓库承诺、债务义务以及与外部经纪人的合作关系。市政官员和看守人员检查大门、夜间巡逻和市场通道；慈善守护者确保贫困不会变成动乱。当季度受到保护、维护费已支付、法庭可以开庭、市场开放、路线安全、允许来访交易者到达时，进度就会前进。因破产、占领、严重骚乱、反犹太骚乱、市场关闭、道路不安全、市政拒绝尊重特权、火灾、瘟疫或阻碍犹太教堂和书房使用的宗教危机而暂停。它随着地方的高度繁荣、宽容或务实的政策、强大的市民合作、有利可图的贸易路线、稳定的法院、可用的纸张和抄写员以及低骚乱而加速。决不能因为国家稳定就前进；每月的勾号必须代表文件的复制、争议的解决、学生的教学以及合同的可执行。
    completion_logic: >-
      完成需要特权、登记、法院、学习室、学校、商人、重量、安全行为、慈善、档案和最终认可计数器完成或高于阈值。布列斯特-立托夫斯克仍然必须受到控制，最终的建筑必须存在，国家不能破产，季度必须安全，市场通道和城门必须开放。最后的场景首先发生在主犹太教堂，然后发生在市场边缘。长老们从档案箱中取出密封的公共登记册；拉比和法官阅读法庭、学校、慈善机构和商业仲裁的规则；市政官员会签特权和安全行为条款；商户展示认可的重量和承诺牌；学生和老师聚集在学习室，为新学期点燃蜡烛。镇上的一份通知宣称，通过该区法院解决并由其抄写员记录的合同将得到履行。这一奇迹变成了国家能力，因为国家已将受保护的少数族裔自治权转化为识字能力、有纪律的记录、市场信任和长途经纪业务。
    failure_or_timeout_logic: >-
      这种仪式可以在没有自动超时的情况下暂停，因为登记册可以在上锁的箱子里等待，但如果城市在太多季节中仍然不安全，复印的页面、公平的安排和商人的出席率就会下降。如果赞助者失去了布列斯特-立托夫斯克、最后的建筑消失、国家仍然破产、该地区被占领或摧毁，或者国家政策取消了仪式旨在确认的公共保护，则仪式将被取消。严重的当地动乱、骚乱、火灾、瘟疫、道路堵塞、贸易崩溃、市政敌对、神职人员或庄园骚乱，或导致特许状无效的继承危机，都应该暂停进展，并可能重置特权和安全行为计数器。如果城市在占领后恢复，则必须检查登记册是否有缺失的页面，重新召集法院，并在恢复完成之前审核商人的权重。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对布列斯特-立托夫斯克的所有权或控制权、最终独特的犹太教堂区建筑的存在、没有破产、没有占领或无效的围困、可控的当地骚乱、受保护的市场准入、安全的道路或公平的路线、职能市政当局以及没有活跃的重复仪式。添加对公共特权、容忍或不存在迫害危机、市民合作、警卫和抄写员的金库以及该季度没有破坏性骚乱或火灾的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和布列斯特-立托夫斯克，存储法律特权背景和城市当局，初始化特权计数器，登记复印，法庭会议，自习室讲座，学校资助，商人注册，权重审计，安全行为，慈善机构，档案密封和最终认可，应用临时维护，并存储研究、贸易、宽容、国库和当地市场基线。
      snapshot_effect_script: >-
        刷新研究速度、贸易收入、稳定性、声望、合法性、宽容或宗教统一代理、市民和神职人员态度、国库、债务、路线暴露、当地占领、动乱、破坏、繁荣、公平活动、市场准入、季度安全、市法院职能和特权地位。保留扩展和失败决策的启动基线。
      progress_effect_script: >-
        每月报价、提前特权确认、pinkas复制、拉比法庭仲裁、学习室教学、学校支持、商家和摊位注册、重量审核、安全行为、慈善评估、档案密封和认可准备。由于破产、占领、动乱、骚乱、市场关闭、不安全路线、火灾、瘟疫、市政拒绝、迫害危机或无薪警卫和抄写员而暂停或衰退。加速实现繁荣、贸易收入、宽容的政策、合作的市民、安全的公平和强大的法院。
      completion_trigger_script: >-
        要求总体进展或基本柜台完成，布列斯特-立托夫斯克控制，最终建筑存在，没有破产，没有占领，可控的骚乱，受保护的地区，开放的市场车道，安全的路线，有效的公共特权，付费维护，以及职能法院或市政当局。
      completion_effect_script: >-
        消除临时负担，应用永久国家修正保留research_speed和trade_income，授予一次性研究、贸易收入、声望、当地繁荣、宽容或骚乱救济，添加布雷斯特寄存器站点内存，清除瞬态计数器，并设置持久完成或冷却标记。
    intended_rewards:
      permanent_country_modifier: >-
        保留源research_speed和trade_income。研究方代表学校、书房、文士、法律论证；贸易方代表使用季度记录的商家的可执行合同、可信权重、多语言经纪和安全行为。
      one_time_reward: 通过完整的登记册授予一次性研究进展、贸易收入、当地繁荣、市民满意度、容忍度或减少骚乱。如果该城市最近遭遇骚乱，部分奖励可以被视为恢复信心，而不是经济意外之财。
      local_building_reward: >-
        布列斯特-立托夫斯克应该保留对密封的平卡斯登记册、犹太教堂档案箱、学习室长凳、法庭和解、批准的市场重量、慈善机构名单、安全通行信和受保护的市场通道的记忆。稍后的实施可以将其表达为当地贸易价值、学者产出、减少骚乱或路线弹性，同时该季度仍然受到保护。
    notes: >-
      源仪式是直接的，但定时模式更好地表达了公共注册和市场信任的工作。每月是唯一的听众，因为这个过程是行政、学术和商业的，而不是王朝或军事的。奖励必须与研究和贸易挂钩；宽容和地方和谐是支撑条件或一次性后果，而不是替代主题。
- id: 184
  key: unique_vilnius_university
  base_key: university_city
  location: vilnius
  source_ritual_key: vilnius_university_rite
  status: designed
  ritual_design_zh:
    title: 维尔纽斯校长游行
    mode: timed
    duration: >-
      定时模式应持续一学年，通常为十二个月。这段时间代表着入学、法规确认、教师讲座周期、辩论、图书馆编目、印刷许可、考试以及穿过大学庭院的最后校长游行。源仪式是直接的，但大学不能仅通过奇观来创造研究和社会促进；它通过使城市和国家可见的学习、等级和证书日历来实现这一目的。
    listeners:
    - monthly
    historical_flavor: >-
      维尔纽斯校长游行属于维尔纽斯大学，因为该机构将法院、教堂、城市和学术官僚机构结合在一起，使立陶宛首都不仅仅是一个政治中心。在其早期现代形式中，学院的庭院、图书馆、教堂、演讲室、出版社和学生宿舍将年轻的贵族、神职人员、市民、翻译和行政人员变成了一个纪律严明的受过教育的阶层。参与者包括校长、院长或系主任、神学、哲学、法学、修辞学、数学和语言学教授、耶稣会士或其他适当的大学神职人员、市议员、法院赞助人、印刷商、图书管理员、装订工、学生团体或团体、助学金持有者、争论者、考官和被指派防止穿着城镇礼服争吵扰乱学期的警卫。这些地方包括拱廊庭院、学院教堂、图书馆、演讲厅、印刷室、校长室、学生宿舍和维尔纽斯街道，游行队伍向这座城市表明学习是一个公共机构。这些物品包括入学名册、教师章程、讲台、印刷论文、图书馆目录、墨水、印章、试题、学位服、蜡烛、文凭和特权章程。由于讲座、书籍、辩论和出版社都被纳入可靠的日历中，研究速度得以提高。流行晋升之所以兴起，是因为证书为人才提供了进入神职人员、法律、行政、教学和技术服务的阶梯。
    confirmation_logic: >-
      赞助商必须拥有或控制维尔纽斯，维尔纽斯大学最后的奇迹建筑必须存在，国家不能破产，大学校园不能被占领、因骚乱而关闭、被烧毁或遭受严重的当地动乱。确认应该需要一个能够承认大学章程的正常运转的法院、教堂或公民当局，足够的财政来资助教授、助学金、印刷、纸张和警卫，以及足够的地方稳定以供学生聚集。如果实施可以检查识字率、神职人员或市民的支持、宗教冲突、阶层特权、资本或行政准入、印刷能力、繁荣或瘟疫风险，那么这些应该完善触发器。战争不会自动禁止学年，但威胁维尔纽斯、关闭道路、征用印刷机或掏空国库的战争应该阻止确认。在新法规颁布之前，继承纠纷应该需要得到公认的权威。
    start_logic: >-
      开始效果记录了赞助国、仪式地点维尔纽斯、最终的大学建筑、现任统治者或公认的赞助人、校长权威和学年开始。它概述了研究速度、流行推广速度、行政能力（如果有）、神职人员和市民的态度、合法性、声望、稳定性、财政、收入、债务以及当前的战争或危机状态的国家基线。它快照了当地占领、动乱、破坏、繁荣、大学可用性、图书馆状况、媒体可用性、学生安全、学者道路通行、城镇礼服紧张以及当地疾病或火灾风险的基线。它初始化法规确认、校长就职、入学、教师讲座时间表、图书馆目录、印刷许可证、公开辩论、考试、助学金分配、学生纪律、城市游行准备和文凭密封等柜台。临时负担包括教授工资、助学金、纸张、墨水、书籍维修、蜡烛、宿舍、警卫、印刷费以及保护学术特权的政治成本。
    progress_logic: >-
      每月的进步是学年成为国家能力的引擎。开幕勾选确认法规并安装校长；抄写员将学生登记在入学册上，并注明他们的出身、赞助人、助学金和义务。教员负责人公布讲座时间表，分配房间，并确保神学、哲学、法律、修辞学、数学和语言按顺序进行。图书馆员对书籍进行编目、修复链接的书籍并控制借阅。印刷商收到批准的论文、日历、教义问答、地图、法律摘要或语法书，并安排纸张和字体。教授们举行辩论，在公开辩论中考验学生；审查员记录谁准备好担任职员、教师、牧师、律师、测量员或秘书。市政府官员在市场和宿舍巡逻，以便学生能够学习，而不会使特权变成混乱。当大学开放、维护费用得到支付、教师可用、道路安全、印刷机和图书馆正常运行以及当地骚乱可控时，就会取得进展。它因破产、占领、围困、瘟疫、火灾、学生骚乱、宗教镇压、导致媒体关闭的审查危机、教授流失、道路不安全或城镇与礼服之间的严重冲突而暂停。它以高度的稳定性、繁荣的维尔纽斯、支持的神职人员和市民、强大的财政、资本或法院的关注、可用的打印机以及吸引学生的和平地区而加速发展。每月的刻度应始终代表讲授的讲座、编目的书籍、印刷的论文或完成的考试。
    completion_logic: >-
      完成要求法规、校长、入学、演讲、图书馆、新闻、辩论、考试、助学金、纪律、游行和文凭计数器完成或高于阈值。维尔纽斯必须保持控制，最终建筑必须存在，国家不能破产，大学必须开放，城市必须足够安全，可以举行公共仪式。最后的场景从学院教堂开始，进行布道或正式演讲，然后穿过拱廊庭院。校长与教职员工、学生群体、携带装订论文的印刷商、拿着目录的图书馆员以及拿着特权宪章的城市官员一起行走。公众争论者在赞助人和议员面前回答问题；考官宣读成功学者的名字；文凭和服务推荐信均已密封。赞助商宣布，办公室、学校、法院、调查和教会任命将认可大学证书。这个奇迹变成了国家能力，因为它的庭院现在生产知识，并将受过教育的人转变为更高的社会和行政角色。
    failure_or_timeout_logic: >-
      仪式应该暂停，而不是因为普通的学术延误而失败，但如果这个术语中断太久，队列、讲座进度和印刷承诺应该会衰减。如果赞助商失去维尔纽斯，最后的大学建筑消失，国家仍然破产，学院被占领或烧毁，或者法律和特权不再允许其运作，它就会取消。占领、围困、瘟疫、严重骚乱、学生骚乱、失去媒体访问权、驱逐教授、宗教危机、道路堵塞或导致法规失效的继任危机都应该暂停进度，并可能重置校长、法规和考试计数器。如果城市在暴力事件后恢复，则必须在学年恢复之前重新检查图书馆、出版社、学生名册和教职员工的可用性。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对维尔纽斯的所有权或控制权、最终独特的大学建筑存在、没有破产、没有占领或无效的围困、可控的骚乱、可用的大学校区、安全的道路、运作良好的公民或法院权威以及没有活跃的重复仪式。添加对神职人员或市民支持、印刷和图书馆使用、当地繁荣、工资和助学金充足的国库以及没有瘟疫、火灾或严重的城镇服装混乱的专题检查。
      start_effect_script: >-
        将仪式与赞助商和维尔纽斯绑定，存储统治者或赞助人、校长权威和学年背景，初始化法规、校长、入学、讲座、图书馆、印刷、辩论、考试的计数器，助学金、纪律、游行和文凭密封、申请临时维护以及存储研究、晋升、财政、遗产和地方基线。
      snapshot_effect_script: >-
        刷新研究速度、流行晋升速度、行政能力代理、神职人员和市民态度、合法性、声望、稳定性、国库、债务、战争状态、当地占领、动乱、破坏、繁荣、大学可用性、图书馆条件、新闻可用性、学生安全、道路通行、城镇礼服的紧张、疾病风险和最终建筑的存在。
      progress_effect_script: >-
        每月的费用、预先法规确认、校长就职、入学、讲座时间表、图书馆目录、印刷许可证、辩论、考试、助学金分配、纪律、游行准备和文凭密封。由于破产、占领、围困、瘟疫、火灾、骚乱、审查制度关闭、教授失踪、道路不安全、严重骚乱或拖欠工资而暂停或衰退。加速实现稳定、繁荣、强大的财政、支持神职人员和市民、法院关注、打印机和低骚乱。
      completion_trigger_script: >-
        要求完成总体进展或必要的学术计数器，维尔纽斯控制，最终建筑存在，没有破产，没有占领，可控的骚乱，大学开放，印刷机或图书馆可用，安全的道路，受薪教授和公认的法定权威。
      completion_effect_script: >-
        取消临时学术维持，应用保留research_speed和global_pop_promotion_speed_modifier的永久国家修正，授予一次性研究、顾问或行政人才、声望、当地繁荣或庄园满意度奖励，添加维尔纽斯长官游行地点记忆，清除瞬态计数器，并设置持久完成或冷却标记。
    intended_rewards:
      permanent_country_modifier: >-
        保留research_speed和global_pop_promotion_speed_modifier。研究来自讲座、出版、图书馆秩序和公共辩论；流行晋升来自入学、考试、助学金和公认的证书，这些证书使受过教育的人进入文书、法律、教学和行政职位。
      one_time_reward: >-
        授予一次性研究进展、声望、顾问群体质量、管理能力、神职人员或市民满意度，或学生和印刷商的当地繁荣。如果国家正在从不稳定中恢复，部分回报可以是重新承认法规的合法性。
      local_building_reward: >-
        维尔纽斯应该保留对校长法规、入学书籍、印刷论文、修复的图书馆目录、考试名册、助学金清单和穿过庭院的游行的记忆。后期的实施可以将其表现为当地教育产出、学者招募、减少晋升摩擦或更具弹性的知识生产。
    notes: >-
      源仪式是直接的，但定时模式对于学年来说是必要的。每月是正确的听众，因为大学的力量是通过长期重复的讲座、书籍、争论和考试产生的。不要把它变成一个普通的教堂节日；宗教行为者很重要，但永久的奖励必须仍然是研究速度和通过证书进行社会促进。
- id: 185
  key: unique_cave_monastery
  base_key: great_monastery
  location: kyiv
  source_ritual_key: cave_monastery_rite
  status: designed
  ritual_design_zh:
    title: 洞穴修道院守夜和编年史复制
    mode: timed
    duration: >-
      定时模式应运行一个礼拜和复制年，通常是每月十二个刻度。这几个月代表着照明和维护洞穴守夜、验证圣物室、分配僧侣到办公室、抄写编年史和布道、准备教义问答书籍、修复朝圣者庇护所、接收贡品以及派遣训练有素的神职人员或教师外出。来源是直接的，但修道院的力量是累积的：神圣性、学习和皈依需要反复祈祷、记录保存、指导和进入洞穴的守卫。
    listeners:
    - monthly
    historical_flavor: >-
      洞穴修道院守夜和编年史复制属于基辅的洞穴修道院，因为该地点将神圣的地形与书面记忆结合在一起。洞穴、遗迹、教堂、城墙、抄经室、朝圣之路和第聂伯河的景色使修道院成为精神权威可以成为教育、文本生产、传教纪律和政治合法性的地方。参与者包括修道院院长或方丈、负责洞穴守夜的僧侣、圣物保管人、抄写员、照明师、圣像画家、执事、忏悔神父、来访的主教或都主教、朝圣者、当地警卫、捐助者、学生、翻译以及向教区教堂或边境传教团运送书籍的信使。这些地方包括远近的洞穴、遗迹壁龛、上层教堂、钟楼、餐厅、写字间、学校教室、宾馆、城墙和第聂伯河通道。这些物品包括油灯、圣物封面、圣像、香、福音书、编年史、墨水、羊皮纸或纸张、木制书板、印章绳、朝圣者令牌、蜡烛账户和施舍清单。其象征意义是信仰被保存在地下洞穴中，并通过书面教导向外传播。研究速度因编年史工作、流派、翻译和神学论证而提高。转换速度之所以会提高，是因为圣物奉献、训练有素的神职人员、教义问答文本和朝圣者的热情好客，使信仰在基辅之外变得清晰易携带。
    confirmation_logic: >-
      赞助者必须拥有或控制基辅，最终的洞穴修道院奇迹建筑必须存在，国家不能破产，修道院辖区和洞穴入口不能被占领、抢劫、烧毁或陷入严重的当地动乱。确认应该需要安全的朝圣和沿第聂伯河和城市道路的供应通道，足够的金库来存放蜡烛、警卫、抄写员、修理和客人的食物，以及一个能够祝福守夜活动并批准复制文本的公认的宗教权威。如果实施过程中可以检查宗教团结、神职人员的支持、对修道院忏悔的容忍、当地的繁荣、破坏、瘟疫、路线安全、首都或大都市的地位，或者正在进行的皈依政策，那么这些应该完善触发器。只有在基辅没有受到直接威胁的情况下才允许战争；被围困的修道院无法接待朝圣者，也无法保证圣物的保管。继承或教会等级危机应该阻止开始，直到赞助人和宗教领袖得到承认。
    start_logic: >-
      起始效果记录了赞助国、仪式地点基辅、最终的修道院建筑、现任统治者或赞助人、宗教上司以及活跃的守夜年份。它概述了研究速度、转换速度、稳定性、声望、合法性、神职人员支持、宗教统一或和谐、传教士或神职人员能力（如果有）、国库、收入、债务和战争状态的国家基线。它记录了占领、围攻风险、动乱、破坏、繁荣、修道院可用性、洞穴通道、遗迹安全、朝圣路线安全、第聂伯河通道安全、写字间状况、学校活动、瘟疫或火灾风险以及当地宗教紧张局势的当地基线。它初始化洞穴灯守夜、圣物库存、礼仪办公室、编年史复制、布道或教义问答复制、圣像和书籍修复、学校教学、朝圣者庇护所、施舍分发、警卫名册、神职人员调度和最终圣物游行的计数器。临时负担包括灯油、蜡、墨水、纸张、食物、警卫、抄写员的劳动、书籍材料、洞穴通道的维修以及僧侣专注于办公室时的收入损失。
    progress_logic: >-
      每月的进步是寺院将神圣记忆转化为可教的权威。僧侣们重新点燃洞灯，清理通道，并记录哪些舍利壁龛需要维修或看守。文物保管人会比较盖子、封条和库存，因此谣言或盗窃不会损害信任。抄写员抄写编年史，将基辅的统治者、圣人、主教和社区与连续的过去联系起来；其他抄写员为城外的神职人员准备布道、祈祷书、教义问答、学校课本和翻译材料。图标画家修复教学中使用的面板和盖子。老师为新手和小学生授课；忏悔神父接待朝圣者并记录施舍；客座主人准备庇护所、食物和路线。守卫负责保护洞穴入口、墙壁和第聂伯河通道的安全。当修道院受到保护、神职人员合作、维护费用得到支付、朝圣者可以旅行、抄写室有材料时，进步就会向前推进。它因破产、占领、围困、严重动乱、瘟疫、火灾、文物丑闻、道路堵塞、河流接近不安全、宗教冲突、方丈去世或墨水和纸张短缺而暂停。它因神职人员的高度支持、宗教统一或公认的多元秩序、当地繁荣、安全的朝圣路线、强大的财政、运转良好的学校和低骚乱而加速。每月的刻度线必须代表具体的办公室：照管灯、复印书页、接待朝圣者、教育儿童和准备神职人员。
    completion_logic: >-
      完成需要洞穴守夜、遗物库存、礼拜仪式、编年史、教义问答、圣像/书籍修复、学校、朝圣者、施舍、警卫、神职人员调度和最终游行计数器完成或高于阈值。基辅必须保持控制，最终的建筑必须存在，国家不能破产，洞穴通道必须安全，修道院不能被占领、围困、瘟疫关闭或严重动乱。最后一幕在黎明前的洞穴通道中开始。僧侣们提着灯经过圣物壁龛，而修士和神职人员则从清单中读出名字；抄写员从写字间带来完整的编年史和教义问答书籍；朝圣者在上层教堂等候；警卫守卫着大门和第聂伯河公路。文物队伍从洞穴上升到教堂，赞助人在那里收到密封的抄本登记册，并指派神职人员或教师将它们带出去。这一奇迹成为国家能力，因为基辅的修道院已将神圣记忆、识字、朝圣和指导纳入可重复的网络，以供研究和转换。
    failure_or_timeout_logic: >-
      仪式可以在冬天、瘟疫或不安全的道路上暂停，但如果守夜中断太久，复制的工作、朝圣者出席和神职人员派遣就会减弱。如果赞助商失去基辅，最后一座修道院建筑消失，国家仍然破产，洞穴被占领或摧毁，或者保护文物和批准文本所需的宗教权威崩溃，它就会取消。占领、围攻、严重骚乱、火灾、瘟疫、河流封锁、文物盗窃或丑闻、反修道院政策、不安全的朝圣路线、或者继承或等级危机应该会暂停进度，并可能重置文物库存和最终游行计数器。如果基辅被恢复，则必须在恢复工作之前检查洞穴，验证遗物封印，并更换损坏的手稿。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对基辅的所有权或控制权，最终独特的洞穴修道院建筑存在，没有破产，没有占领或无效围攻，可控的当地骚乱，可用的修道院和洞穴通道，安全的朝圣或第聂伯河路线，公认的宗教权威，以及没有活跃的重复仪式。添加对神职人员支持、宗教团结或宽容的忏悔、灯和抄写员的金库、低破坏以及没有火灾、瘟疫或文物丑闻的主题检查。
      start_effect_script: >-
        将仪式与赞助商和基辅绑定，存储赞助人和宗教上级背景，初始化洞穴灯计数器，文物库存，礼仪办公室，编年史复制，教义问答复制，圣像和书籍修复，学校教学，朝圣者庇护所，施舍，守卫、神职人员派遣和最后游行，应用临时维护，并存储研究、皈依、神职人员、国库和地方基线。
      snapshot_effect_script: >-
        刷新研究速度、皈依速度、稳定性、声望、合法性、神职人员支持、宗教团结或和谐、传教士或神职人员能力、国库、债务、战争状态、地方占领、围困、动乱、破坏、繁荣、修道院可用性，洞穴通道、遗迹安全、朝圣路线、第聂伯河安全、写字间条件、学校活动、瘟疫风险和最终建筑存在。
      progress_effect_script: >-
        每月的滴答声、提前守灯、圣物清点、办公室、编年史工作、教义问答复制、圣像和书籍修复、学校课程、朝圣者庇护所、施舍、警卫、神职人员派遣和游行准备。由于破产、占领、围困、动乱、瘟疫、火灾、文物丑闻、道路不安全、河流封锁、宗教冲突、权威缺失或物质短缺而暂停或衰退。加速神职人员支持、安全路线、繁荣、财政、学校活动和低骚乱。
      completion_trigger_script: >-
        要求总体进度或基本修道院柜台完成，基辅控制，最终建筑存在，没有破产，没有占领或围困，可控骚乱，安全洞穴通道，遗迹安全，开放的朝圣者路线，正常运行的写字间，可用的神职人员和付费维护。
      completion_effect_script: >-
        取消临时守夜和复制负担，应用永久国家修改器保留research_speed和global_pop_conversion_speed_modifier，授予一次性研究，稳定性，神职人员支持，转换动力，声望或当地繁荣奖励，添加基辅洞穴守夜地点记忆，清除瞬态计数器，并设置持久完成或冷却标记。
    intended_rewards:
      permanent_country_modifier: >-
        保留research_speed和global_pop_conversion_speed_modifier。研究以编年史复制、学校、翻译和书籍修复为基础；皈依的基础是圣物权威、训练有素的神职人员、朝圣者的热情好客、布道和从基辅发出的教义问答文本。
      one_time_reward: 从朝圣者和礼物中获得一次性研究进展、稳定性、神职人员忠诚度、威望、皈依动力或当地繁荣。如果修道院从危险中恢复过来，部分奖励可以是缓解当地骚乱或恢复文物信心。
      local_building_reward: >-
        基辅应该保留洞穴灯名册、文物清单、编年史手稿、教义问答包、修复圣像、朝圣床、施舍清单和第聂伯河哨所的记忆。后来的实施可以将其表达为当地朝圣繁荣、传教准备、学者招募或在修道院受到保护的情况下减少骚乱。
    notes: >-
      源仪式是直接的，但定时模式更好地代表完整的守夜和复制年。每月一次是正确的听众，因为修道院的权威是通过重复的办公室、页面、课程和朝圣者关怀而建立的。保持对研究和转化速度的奖励；当地的虔诚、稳定和声望应该支持这些主题，而不是取代它们。
- id: 186
  key: unique_zaporizhian_sich
  base_key: mobile_fortress
  location: kremenchuk
  source_ritual_key: zaporizhian_sich_rite
  status: designed
  ritual_design_zh:
    title: Sich Rada 和 River-Fort Oath
    mode: timed
    duration: >-
      定时模式应涵盖一个边境战役年，通常为十二个月。这一时期包括召集拉达、更新服役条款、选举或确认军官、修复栅栏和马车营地、分发火药、填缝河船、沿第聂伯河派遣侦察兵、收集马匹和给养，以及在战争爆发时证明现役誓言。来源是直接的，但移动堡垒文化通过重复的巡逻、议会和补给程序来创造士气和人力。
    listeners:
    - monthly
    - pre_winning_war
    - ending_war
    historical_flavor: >-
      Sich Rada 和 River-Fort Oath 誓言属于 Zaporizhian Sich，因为奇迹的力量是第聂伯河边境的政治军事社区，而不是石碑。它的木栅栏、库林兵营、东正教教堂、锻造厂、船只登陆处、火药库、马绳和马车防御设施让自由战士在得到适当认可的情况下将粗暴的自治转变为纪律严明的服务。参与者包括拉达的哥萨克普通士兵、科舍沃伊酋长或民选军官、斯塔什纳长老、库林酋长、抄写员、旗手、祝福圣像和旗帜的牧师、造船者、铁匠、炮手、侦察兵、骑兵、渔民、摆渡人、火药保管员、边疆定居者以及必须进行谈判而不是简单指挥的国家特使。这些地方包括克列缅丘克、河岸、木栅栏、议会广场、教堂、锻造厂、船棚、草原岗哨和马车营地训练场。这些物品包括狼牙棒、标准、鼓、图标、步枪、军刀、火药桶、船桨、沥青、马匹、口粮袋、侦察报告和服务卷。其象征意义是相互的：国家承认西奇人的习俗，而西奇人以勇气、人力、河流流动性和边境警告来回应。由于战士们在同行面前重新宣誓，土地士气高涨；人力增加是因为库林人、船只、侦察兵和定居点都被计入可用的边境主机中。
    confirmation_logic: >-
      赞助商必须拥有或控制克列缅丘克，最终的扎波罗热西奇奇迹建筑必须存在，国家不能破产，西奇不能被占领、烧毁、围困或与第聂伯河的接近被切断。确认需要河流通道、边境路线安全、足够的火药、口粮、船只修理和礼物的国库，以及能够履行拉达服务条款的政治权威。如果实施可以检查自治压力、庄园或军事派别忠诚度、东正教或当地神职人员的支持、人力储备、动乱、破坏、袭击者威胁、战争状态或边境繁荣，那么这些应该会影响资格。战争是允许的，而且通常是相关的，但占领锡奇、封锁河流或使付款无法进行的战争应该阻止开始。如果特使不能可信地承诺报酬、特权或获得认可，继任危机应该会阻止确认。
    start_logic: >-
      起始效果记录了赞助国、作为仪式地点的克列缅丘克、最终的西奇建筑、现任统治者或授权使节、拉达当局、边境战争国家以及当前自治或庄园压力。它概括了土地士气、人力池、人力恢复或征兵能力、骑兵或轻步兵能力（如果有）、稳定性、威望、合法性、财政、收入、债务、厌战和军事派别支持的国家基线。它快照了占领、围攻风险、动乱、破坏、繁荣、第聂伯河通道、栅栏状况、船只准备情况、火药库、锻造能力、马匹可用性、侦察网络、袭击者威胁以及通往盟军市场或城镇的路线安全等当地基线。它初始化雷达召唤、军官选举、宣誓更新、库林点名、教堂祝福、栅栏修复、马车营地演习、火药分发、船填缝、锻造工作、马匹集合、侦察巡逻、口粮商店和最终河堡审查等计数器。临时负担包括火药、铅、沥青、木材、铁匠劳力、马饲料、食物、特使礼物、卫兵报酬以及承认哥萨克特权的政治成本。
    progress_logic: >-
      每月的进步是边疆主机在不失去自己议会文化的情况下使自己可用。第一批蜱虫派遣信使前往库林和河流营地，在拉达聚集战士，阅读旧的服役条款，并选举或确认军官。抄写员用库林、船、马和武器来书写名字；牧师在宣誓前祝福圣像、旗帜和教堂。铁匠修理步枪、军刀、锁、马车链条和马蹄铁。造船者对河船进行填缝、测试桨并分配船员。火药保管员在宣誓下称量桶的重量并分发子弹，而不是让商店消失在私人袭击中。侦察兵在草原和河岸上骑行，返回有关渡口、袭击者和补给路线的报告。马车大师们演练移动防御和栅栏维修。当河流开放、维护费用支付、拉达接受赞助商的特使、当地的骚乱可控、侦察兵可以旅行时，就会取得进展。它因破产、占领、河流封锁、严重骚乱、未支付火药或口粮、破坏特权、军官纠纷、破坏性袭击、锻造短缺、饥荒、瘟疫或敌人控制过境而暂停。它以大量的人力、强大的士气、合作的军事派系、安全的第聂伯河路线、可用的马匹、边疆的繁荣以及给东道主明确的敌人的积极的防御战争而加速。仅当
      Sich 的侦察兵、船只、骑兵或马车营地对即将到来的胜利做出实质性贡献时，pre_winning_war 侦听器才应添加进度。 ending_war听众应该与主持人协调一致：胜利确认标准和滚动；失败、背叛或无偿服务会阻碍进展，直到拉达重拾信心。
    completion_logic: >-
      完成要求雷达、军官、誓言、库林、教堂、栅栏、马车、火药、船、熔炉、马、侦察兵、口粮和最终审查计数器完成或高于阈值。克列缅丘克必须仍然受到控制，最后的建筑必须存在，国家不能破产，第聂伯河必须开放，西奇河必须足够安全，以便拉达会面。最后的场景发生在议会广场，然后是河岸码头。勇士们聚集在库林；显示狼牙棒和标准；牧师祝福圣像和横幅；特使宣读商定的服务条款；官员们在雷达前回答；火药桶、船只、马匹、马车和侦察报告均被提交以供检查。随后，主持人移至栅栏门和河岸，船员们在此下水，骑兵们在新的誓言下出发。这一奇迹变成了国家能力，因为国家已经将一个自治的边境社区变成了士气、人力、巡逻情报和河流机动防御的可靠来源。
    failure_or_timeout_logic: >-
      仪式应该在冬季或临时战役期间暂停而不是终止，但如果拉达太长时间没有重新召集，集结名册、火药信任和船只准备状态应该会减弱。如果赞助商失去了克列缅丘克、最后一座西奇建筑消失、国家仍然破产、栅栏被占领或摧毁，或者第聂伯河入口被永久封锁，那么它就会取消。严重动乱、哥萨克叛乱、无偿服役、特权撤销、竞争对手军官选举、饥荒、瘟疫、伪造品破坏、火药盗窃或使国家承诺失效的继承危机都应该暂停进展，并可能重置誓言和军官计数器。以失败告终的战争不应自动使仪式失败，但如果失败导致东道主无偿、分散或政治上背叛，完成必须等待新的拉达。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对克列缅丘克的所有权或控制权、最终独特的西奇建筑存在、没有破产、没有占领或无效围攻、开放第聂伯河通道、可控的当地动乱、可用的栅栏和议会场地、火药和口粮的库房，以及没有活跃的重复仪式。添加对自治压力、军事派系或庄园合作、神职人员支持、路线安全、人力可用性以及没有河流封锁、叛乱或直接边境破坏的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助者和克列缅丘克，存储统治者或特使，雷达权威，战争状态和自治背景，初始化传票计数器，军官选举，宣誓，库林卷，祝福，栅栏，马车钻，粉末，船只、熔炉、马匹、侦察兵、口粮和最终审查，施加临时负担，并储存士气、人力、金库、地产和当地边境基线。
      snapshot_effect_script: >-
        刷新陆地士气、人力、人力恢复或征召能力、骑兵或轻步兵代理、稳定性、威望、合法性、国库、债务、战争疲劳、军事派别支持、当地占领，围困、动乱、破坏、繁荣、第聂伯河通道、栅栏状况、船只准备情况、火药库、锻造能力、马匹、侦察网络、袭击者威胁、路线安全和最终建筑存在。
      progress_effect_script: >-
        每月进行一次拉达提前传票、军官选举、更新誓言、库林点名、教堂祝福、栅栏修复、马车营地演习、火药分发、船填缝、锻造工作、马匹集合、侦察巡逻、口粮储存和复习准备。因破产、占领、封锁、动乱、无偿服役、特权被破坏、军官纠纷、饥荒、瘟疫、伪造品丢失、火药盗窃或不安全过境而暂停或衰退。仅使用
        pre_winning_war 和 ending_war 来验证相关边境服务。
      completion_trigger_script: >-
        要求总体进度或基本计数器完成、克列缅丘克控制、最终建筑存在、无破产、无占领或围困、开放的河流通道、可控的骚乱、付费服务、接受的雷达授权、可用的船只和火药、可用的人力和安全的侦察路线。
      completion_effect_script: >-
        消除临时服务负担，应用保留land_morale_modifier和global_manpower_modifier的永久国家修正，授予一次性人力、军队传统、声望、边境安全、当地繁荣或骚乱救济奖励，添加Sich
        rada站点记忆，清除瞬态计数器，并设置持久完成或冷却标记。
    intended_rewards:
      permanent_country_modifier: >-
        保留land_morale_modifier和global_manpower_modifier。士气来自誓言、拉达认可和同事纪律；人力来自库林卷、边境定居点、船员、侦察兵和骑兵，计入公认的服务框架。
      one_time_reward: >-
        授予一次性人力、军队传统、威望、边境安全、当地繁荣，或通过协调的服务条款减少骚乱。如果战争听众做出了贡献，则在经过验证的竞选服务后，将部分奖励用于士气恢复或人力。
      local_building_reward: >-
        克列缅丘克应该保留对拉达名册、祝福标准、军官选举、火药分类帐、填缝船、修理马车、侦察路线、马匹名单和栅栏维修的记忆。稍后的实施可以将其表达为当地防御、移动、补给、袭击者警告或边境更快的人力恢复。
    notes: >-
      源仪式是即时的，但需要定时模式来表示雷达和边境准备周期。每月处理日常巡逻、维修和集合；包含pre_winning_war和ending_war是因为Sich的权威在竞选中得到了部分证明。奖励必须保持士气和人力。实施时应避免将哥萨克视为普通征兵；只有当特权和服务义务都得到承认时，这种仪式才有效。
- id: 187
  key: unique_registan_square
  base_key: grand_theater_festival_district
  location: samarkand
  source_ritual_key: registan_square_rite
  status: designed
  ritual_design_zh:
    title: Registan Madrasa Festival
    mode: timed
    duration: >-
      定时模式应持续六到九个月的时间，足以为宗教学校和商队路线周围的节日做好准备。这段时间代表着修复瓷砖和伊万、邀请学者、指派学生朗诵、谈判使节优先权、安排商队安全通行、准备礼物和地毯以及为公众观众清理广场。来源是直接的，但声望和外交声誉应该来自有管理的展示、学习和接待日历。
    listeners:
    - monthly
    historical_flavor: >-
      雷吉斯坦宗教学校节属于撒马尔罕，因为广场是一个公民剧院，在这里可以同时看到王朝、学术、商业和外交。在宏伟的宗教学校、瓷砖大门、市场和商队街道之间，统治者或总督可以将权威呈现为有序的辉煌，而不是残酷的命令。参与者包括统治者的代表、宫廷引座员、卡迪斯、宗教学校教师、接受过背诵和辩论训练的学生、书法家、瓷砖修理工、地毯商人、商队领袖、翻译、诗人、音乐家、守卫、运水人、邻近宫廷的大使以及需要安全通过河中地区的商人。这些地方包括雷吉斯坦广场本身、兀鲁伯格、谢尔多尔和蒂拉卡里宗教学校的前线（适用于那个时代）、讲堂、市场通道、商队路线、观众地毯和通向更广泛的丝绸之路网络的大门。这些物品包括《古兰经》、天文学或几何手稿、法律意见书、地毯、礼物、外交信函、印章、瓷砖模具、鼓、横幅、遮阳篷、水罐和安全牌匾。由于撒马尔罕一再表现出优雅、秩序和巨大的赞助，每月的威望都会上升。外交声誉的提升是因为使节们看到在可预测的公共空间中处理争端、优先权、贸易担保和学术荣誉。
    confirmation_logic: >-
      赞助者必须拥有或控制撒马尔罕，最后的雷吉斯坦广场奇迹建筑必须存在，国家不能破产，广场不能被占领、被围困、因骚乱而关闭或遭受严重的当地动乱。确认应该需要进入撒马尔罕的安全商队路线、能够接待使节的正常运转的法院或总督、足够的国库用于维修、警卫、招待、学者津贴和外交礼物，并且没有活跃的瘟疫或饥荒，以免公共节日变得危险。如果实施可以检查外交声誉、威望、贸易路线安全、当地繁荣、学者或神职人员的支持、文化输出、与邻国的关系、战争状态或继承稳定性，那么这些都应该影响资格。战争不会自动阻止该仪式，但关闭商队道路、威胁撒马尔罕或使使节不安全的战争应该阻止确认。
    start_logic: >-
      起始效果记录了主办国、作为仪式地点的撒马尔罕、最终的方形建筑、现任统治者或总督、以及受邀使者和学者的背景。它概述了每月威望、外交声誉、当前威望、合法性、稳定性、财政、收入、债务、战争疲劳、贸易范围或商队贸易代理以及与附近大国的关系或停战背景（如果有）的国家基线。它记录了当地占领、围困、动乱、破坏、繁荣、市场准入、商队路线安全、广场可用性、宗教学校状况、学者出勤、警卫准备情况、水和食品供应以及外交安全等方面的基线。它初始化瓷砖和
      iwan 维修、广场清理、讲座邀请、学生朗诵、公开辩论、特使优先、礼品库存、商队安全引导、市场和工艺品展示、警卫警戒线、招待厨房和最终观众的柜台。临时负担代表招待、礼物、地毯、警卫、运水、修理、音乐家、翻译、学者津贴以及保留广场时失去的市场时间。
    progress_logic: >-
      每月的进步是声誉的精心打造。瓷砖工人和泥瓦匠修复门户、拱门和庭院入口上的明显损坏，这样来访的使节就不会看到疏忽。引座员测量广场，在地毯上做标记，并决定大使、卡迪、学者、商人和卫兵的站立位置，而不会侮辱等级。教师选择公开讲座、法律问题、天文演示、诗歌或辩论来展示撒马尔罕的博学遗产。学生们排练朗诵，书法家准备展示页，抄写员抄写大篷车的安全守则。大篷车领队提交货物、路线和安全投诉清单；市场工作人员分配摊位并保护重量。翻译人员准备信件和礼物，警卫检查通道，运水车为人群准备阴凉处和饮料。当广场安全、道路畅通、维护费用支付、学者出席、使节可以到达时，进步就会向前推进。它因破产、占领、围困、严重动乱、商队道路封闭、瘟疫、饥荒、外交侮辱、继承纠纷、市场骚乱、守卫欠薪或使使节成为目标的战争而暂停。它以高威望、良好的财政、繁荣的撒马尔罕、强大的贸易安全、和平的邻国、众多的学者和低动荡而加速。勾号应该始终意味着具体的准备工作：进行修理、安排讲座、抄写信件、清点礼物、派遣使节就座或保护商队。
    completion_logic: >-
      完成要求修理、清理、演讲、背诵、辩论、特使、礼物、安全引导、市场、警卫、接待和最终观众柜台完成或超过阈值。撒马尔罕必须保持控制，最后的建筑必须存在，国家不能破产，广场必须安全，商队和使节路线必须开放。最后的场景发生在宗教学校大门下。警卫将人群控制在有序的车道上；卡迪斯和教师坐在讲台附近；学生背诵；学者们辩论一个准备好的问题；大篷车领导者收到密封的安全通行证；大使们按照指定的优先顺序带着信件和礼物前来；统治者或总督在铺着地毯的讲台上回答。音乐家和诗人标志着从学术展示到公共节日的转变，而市场官员则宣布受保护的摊位和路线。这一奇迹变成了国家能力，因为雷吉斯坦将撒马尔罕的建筑宏伟转化为可重复的声望以及尊重使节、学者和贸易承诺的声誉。
    failure_or_timeout_logic: >-
      仪式可以推迟到下一个节日季节，但如果推迟太久，使节出席、礼物和商队承诺就会减少。如果赞助商失去了撒马尔罕，最后的广场建筑消失，国家仍然破产，广场被占领或毁坏，或者商队通道永久不安全，那么它就会取消。严重的动乱、瘟疫、饥荒、市场骚乱、外交羞辱、谋杀特使、道路封锁、继承危机或直接威胁城市的战争应该暂停进度，并可能重置特使、礼物和安全传导计数器。如果撒马尔罕在占领后被收复，则在完成之前必须重新检查瓷砖状况、市场秩序、学者出勤和使节信任。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查撒马尔罕的赞助商所有权或控制权、最终独特的雷吉斯坦建筑存在、没有破产、没有占领或无效围攻、可控的骚乱、安全广场、开放的商队和使节路线、有效的统治者或总督、足够的国库以及没有活跃的重复仪式。添加对当地繁荣、外交安全、学者或神职人员支持、市场准入、没有瘟疫或饥荒以及没有战争直接关闭路线的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和撒马尔罕，存储统治者或州长、使节和学者上下文，初始化用于维修、清理、演讲、朗诵、争论、使节优先、礼物、安全通行、市场展示、警卫、招待和最终观众的计数器，应用临时节日负担，并存储声望、外交、财政、贸易和当地基线。
      snapshot_effect_script: >-
        刷新每月声望、外交声誉、当前声望、合法性、稳定性、财政、债务、厌战、贸易路线代理、邻里关系背景、当地占领、围困、动乱、破坏、繁荣、市场准入、商队安全、广场可用性、宗教学校状况、学者出勤、警卫准备情况、招待供应和最终建筑存在。
      progress_effect_script: >-
        每月的蜱虫，提前瓷砖和iwan修复，广场清理，讲座邀请，学生朗诵，辩论准备，特使优先，礼物库存，商队安全引导，市场和工艺品展示，警卫警戒线，招待厨房和最终观众准备。由于破产、占领、围困、动乱、道路封闭、瘟疫、饥荒、外交侮辱、继承纠纷、市场骚乱、无薪警卫或撒马尔罕附近的战争而暂停或衰退。加速声望、繁荣、贸易安全、和平邻国、学者出席和强大的财政。
      completion_trigger_script: >-
        要求总体进度或基本计数器完成，撒马尔罕控制，最终建筑存在，没有破产，没有占领或围攻，可控的骚乱，安全广场，开放的商队路线，可用的使节和学者，有偿招待，并且没有阻止公众观众的积极外交危机。
      completion_effect_script: >-
        消除临时节日负担，应用保留的永久国家修正monthly_prestige 和 diplomatic_reputation，授予一次性声望、外交、贸易、学者或当地繁荣奖励，添加雷吉斯坦观众站点记忆，清除瞬态计数器，并设置持久完成或冷却标记。
    intended_rewards:
      permanent_country_modifier: >-
        保留 monthly_prestige 和 diplomatic_reputation。声望来自于广场上反复出现的建筑、学术和仪式展示；外交声誉来自可预测的使节优先权、受保护的商队、公共仲裁和荣誉信件。
      one_time_reward: 通过节日和商队保护获得一次性威望、改善关系、外交优惠、贸易收入、学者支持或当地繁荣。如果路线安全很困难，奖励可能会倾向于贸易信心而不是纯粹的声望。
      local_building_reward: >-
        撒马尔罕应该保留修复过的瓷砖、演讲地毯、特使座位图、安全通行平板电脑、商队名单、礼品清单、警卫警戒线和公共辩论脚本的记忆。稍后的实施可以将其表达为当地声望、贸易路线弹性、学者吸引力或在雷吉斯坦保持安全的情况下降低外交事件风险。
    notes: >-
      源仪式是即时的，但定时模式更适合使节和节日季节。每月一次就足够了，因为这项工作是外交、学术和商业准备，而不是战争或继承问题。奖励必须保持威望和外交声誉；研究和贸易是辅助手段，而不是永久主题。
- id: 188
  key: unique_khiva_old_city
  base_key: ancient_city_ruins
  location: khiva
  source_ritual_key: khiva_old_city_rite
  status: designed
  ritual_design_zh:
    title: Ichan Kala Gate Renewal
    mode: timed
    duration: >-
      定时模式应运行一个绿洲公民季节，通常为每月九到十二个周期。这一时期包括测量泥砖墙、在冬季和沙漠天气后修复大门、清理水井和运河、确认季度长老、登记商队驿站和市场小巷，以及准备穿过伊坎卡拉的最后游行。来源是直接的，但希瓦的威望和合法性来自于对城墙、水、血统、法律和商队通道的明显管理。
    listeners:
    - monthly
    historical_flavor: >-
      伊坎卡拉门更新属于希瓦，因为旧城是一个有城墙的绿洲首都，主权通过门槛的控制来展示。泥砖墙、大门、尖塔、宗教学校、商队街道、水井、蓄水池、工艺巷和街区集会表明，统治者可以在允许贸易、正义和学习的同时遏制沙漠的不安全感。参与者包括可汗或总督、门卫、卡迪斯、宗教学校教师、区长、马哈拉代表、商队饲养员、水务主管、泥砖瓦匠、瓷砖工人、警卫、市场检查员、来自草原和绿洲路线的商人、骆驼司机以及记录通行费和誓言的抄写员。这些地方包括
      Ichan Kala 门、内墙、瞭望台、清真寺和宗教学校庭院、商队街道、集市小巷、水井、蓄水池以及可以看到公共权力的宫殿通道。这些物品包括大门钥匙、泥砖、石膏、绿松石瓷砖、水罐、收费账簿、印章、市场秤、祈祷毯、值班鼓、大篷车标签和季度义务章程。由于老城被维持为可见的遗产之都，因此每月的声望都会上升。每月的合法性会上升，因为统治者每月都会证明城墙、水、法律、长老和大门仍然听从中央权威。
    confirmation_logic: >-
      赞助者必须拥有或控制希瓦，最后的希瓦老城奇迹建筑必须存在，国家不能破产，伊昌卡拉不能被占领、围攻、烧毁或严重动乱。确认应需要可用的大门、安全的绿洲通道、运转正常的水井或水道、足够的库房用于维修、警卫、水务和招待，以及一位公认的能够接受季度宣誓的统治者或州长。如果实施可以检查当地繁荣、破坏、干旱或缺水、商队路线安全、合法性、声望、神职人员或城市显着支持、贸易准入和战争状态，那么这些应该细化资格。战争不会自动阻止仪式，但威胁希瓦的战争、关闭沙漠道路或封锁旧城应该会阻止仪式的开始。继任危机应该阻止确认，直到大门钥匙可以交给公认的权威机构。
    start_logic: >-
      起始效果记录了主办国、作为仪式地点的希瓦、最终的旧城建筑、现任统治者或总督以及公民季节。它快照了每月威望、每月合法性、当前威望、合法性、稳定性、财政、收入、债务、厌战以及外交或贸易路线风险（如果有）的国家基线。它记录了占领、围困、动乱、破坏、繁荣、城墙状况、大门状况、水安全、水井或运河功能、商队路线安全、市场准入、长老合作、警卫准备、宗教学校活动以及干旱或饥荒风险的当地基线。它初始化用于墙壁测量、大门维修、水清理、值班、季度宣誓、商队旅馆登记、市场重量审计、宗教学校和清真寺接待、宫殿通道清洁、收费账簿审查、长老理事会和最后大门游行的柜台。临时负担包括泥砖、灰泥、瓷砖修理、水工、警卫工资、抄写费、招待费以及检查大门和市场巷道时减少的通行费收入。
    progress_logic: >-
      每月的进展是城市证明其封闭秩序仍然有效。泥瓦匠检查泥砖墙的裂缝，并用新鲜的砖和灰泥重建裸露的表面。门卫负责修理门、铰链、锁和值班台，然后将门卫名册与实际人员进行比较。水务大师清理水井、蓄水池和渠道，以便游行队伍、家庭和商队能够度过旱季。季度长老向理事会提交家庭名单、纳税义务和安全投诉；卡迪听取争端，否则可能会演变成骚乱。商队旅馆的饲养员登记来访的商人、驮畜、房间和通行费；市场检查员测试重量并为布料、谷物、牲畜和手工艺品分配安全通道。宗教学校教师和清真寺官员为最后的大门日准备公众祈祷和读经。当旧城得到控制、维护费用得到支付、水井发挥作用、大门打开、路线安全、长辈合作时，进展就会取得进展。它因破产、占领、围困、严重动乱、干旱、饥荒、沙漠道路堵塞、市场骚乱、大门损坏、拒绝老人、水污染或继承纠纷而暂停。它以高合法性、繁荣的希瓦、安全的商队路线、良好的金库、合作的城市名人、稳定的供水和低骚乱来加速。
    completion_logic: >-
      完成需要墙、门、水、手表、宿舍、商队服务、市场、宗教学校、宫殿通道、收费站、长老和最终游行柜台完成或高于阈值。希瓦仍然必须受到控制，最终的建筑必须存在，国家不能破产，水井和大门必须可用，城市必须安全，适合公众游行。最后一幕从
      Ichan Kala 的一扇大门开始。门卫出示钥匙和账本；水师将干净的井水倒入公共罐子里；泥瓦匠展示修复后的砖瓦样品；卡迪斯和宗教学校的教师与区长老站在一起；大篷车领队和市场检查员出示密封的通行费和重量记录。统治者或总督穿过城门进入旧城，接受长老的宣誓，确认受保护的商队通道，并宣布下一季的守卫和供水义务。这一奇迹成为了国家能力，因为希瓦的城墙和绿洲机构成为了威望和合法统治的反复证明。
    failure_or_timeout_logic: >-
      仪式可以等到一个更安全的季节进行，但如果拖延太久，大门维修、水清理和商队出席率就会下降。如果赞助商失去希瓦、最后一座老城建筑消失、国家仍然破产、伊昌卡拉被占领或毁坏、或者水井和大门无法使用，它就会取消。严重的骚乱、围困、干旱、饥荒、市场骚乱、商队路线崩溃、长老叛乱、道路堵塞、火灾、瘟疫或继承危机应该会暂停进度，并可能重置大门、水和四分之一誓言计数器。如果希瓦在占领后被收回，则必须重新勘察城墙，重新发放钥匙，并核对收费账簿，然后才能进行最终游行。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查希瓦的赞助商所有权或控制权、最终独特的旧城建筑存在、没有破产、没有占领或无效围攻、可控的骚乱、可用的大门和城墙、安全的绿洲通道、正常运行的水井或水道、公认的统治者或州长，以及没有活跃的重复仪式。添加对当地繁荣、水安全、商队路线安全、城市显着合作、维修库房以及没有干旱、饥荒或直接封锁的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和希瓦，存储统治者或总督和公民季节背景，初始化墙测量计数器，大门维修，水清理，值班表，季度誓言，商队登记册，市场重量审计，宗教接待，宫殿方法，通行费审查，长者议会和最后游行，应用临时负担，并存储声望、合法性、水、贸易和当地基线。
      snapshot_effect_script: >-
        刷新每月声望、每月合法性、当前声望、合法性、稳定性、国库、债务、厌战、路线暴露、当地占领、围困、动乱、破坏、繁荣、城墙状况、大门状况、水安全、井或运河功能、商队安全、市场准入、老年人合作、警卫准备、宗教学校活动、干旱或饥荒风险以及最终建筑存在。
      progress_effect_script: >-
        每月检查、提前城墙测量、大门维修、清理水、值班值班、季度宣誓、商队旅馆登记、市场重量审计、宗教学校和清真寺准备、宫殿通道清洁、收费账簿审查、长老理事会和最终游行准备。因破产、占领、围攻、骚乱、干旱、饥荒、道路堵塞、市场骚乱、大门损坏、老人拒绝、水故障、继承纠纷或无薪警卫而暂停或衰败。
      completion_trigger_script: >-
        要求总进度或基本计数器完成，希瓦控制，最终建筑存在，无破产，无占领或围攻，可控制的骚乱，可用的大门，安全的墙壁，运转的水，安全的商队通道，合作的长老，受薪的警卫，并得到认可
      completion_effect_script: >-
        消除临时更新负担，应用保留monthly_prestige和monthly_legitimacy的永久国家修正，授予一次性声望、合法性、当地繁荣、贸易信心或骚乱救济奖励，添加Ichan Kala门更新站点记忆，清除瞬态计数器，并设置持久完成或冷却标记。
    intended_rewards:
      permanent_country_modifier: >-
        保留monthly_prestige和monthly_legitimacy。声望来自于维持希瓦作为可见的绿洲遗产首都的地位；合法性来自于统治者对城门、城墙、水源、长老、通行费和商队保护的公共控制。
      one_time_reward: 授予一次性威望、合法性、当地繁荣、贸易收入、城市显着满意度，或减少成功的门游行带来的骚乱。如果水安全紧张，部分奖励可以是当地的恢复，而不是纯粹的宫廷荣誉。
      local_building_reward: >-
        希瓦应该保留更新门钥匙、修复泥砖墙、清理水井、收费账簿、季度誓言、商队服务登记册、市场重量和公共水罐的记忆。后来的实施可以将其表达为当地防御、繁荣、商队安全、水恢复力或减少骚乱。
    notes: >-
      源仪式是直接的，但定时模式更好地代表绿洲公民修复和宣誓季节。 Monthly 是正确的监听器，因为墙壁、水井、大门、通行费和季度政治都需要反复检查。奖励必须保持声望和合法性；贸易和防御是支持旧城权威的机制。
- id: 189
  key: unique_bukhara_kalyan_minaret
  base_key: giant_tower_temple
  location: bukhara
  source_ritual_key: bukhara_kalyan_minaret_rite
  status: designed
  ritual_design_zh:
    title: Kalyan Minaret Call 和 Madrasa Endowment
    mode: timed
    duration: >-
      定时模式应持续一个宗教捐赠周期，通常为每月九到十二个滴答声。这几个月的时间包括检查尖塔的砖砌结构和楼梯、任命呼叫者、核对穆斯林宗教与社团组织的收入、指派教师、准备布道和基本指导、修复清真寺和宗教学校的空间，以及组织最后的公开呼叫和契约密封。来源是直接的，但卡扬尖塔的力量来自反复的崇拜和资助的指导，而不是任何声音。
    listeners:
    - monthly
    historical_flavor: >-
      卡扬尖塔的召唤和宗教学校捐赠基金属于布哈拉，因为这座巨大的砖塔既是城市神圣威望的明显标志，也是教学、布道、裁决和皈依机构的支柱。尖塔矗立在清真寺庭院、宗教学校、市场、商队街道和伊斯兰宗教组织财产之上；只有当周围的机构得以维持时，它的呼吁才可信。参与者包括统治者或总督、伊玛目、宣礼员、卡迪斯、宗教学校的教师、学生、宗教与社团组织受托人、抄写员、砖瓦匠、灯笼管理员、商店提供捐赠资金的商人、朝圣者、市场检查员和保持庭院开放的警卫。这些地方包括卡扬尖塔、其内部楼梯、清真寺庭院、宗教学校牢房、宗教与社团组织商店、市场小巷、档案箱和进入布哈拉的商队通道。这些物品包括宗教与社团组织契约、印章、祈祷毯、灯、布道笔记、学生津贴、砖模、脚手架、商店租金分类帐、古兰经、教学手册和尖塔钥匙。每月的声望都会上升，因为天际线和公众号召使布哈拉的虔诚和学识可见一斑。转变速度之所以加快，是因为受资助的教师、布道、法律秩序和训练有素的传教士将这种权威带入了家庭、村庄和商队社区。
    confirmation_logic: >-
      赞助者必须拥有或控制布哈拉，最终的卡扬尖塔奇迹建筑必须存在，国家不能破产，尖塔、清真寺庭院和宗教学校辖区不得被占领、围困、损坏或发生严重的当地动乱。确认应该需要一个公认的宗教权威、运作良好的宗教与社团组织或同等的捐赠财产、足够的财政来支付泥瓦匠、呼叫者、教师和警卫的费用，以及学生、朝圣者和市场租金的安全通道。如果实施过程中可以检查神职人员的支持、宗教团结或皈依政策、声望、当地繁荣、贸易活动、市场准入、破坏、瘟疫或战争状态，那么这些都应该完善触发器。只有在布哈拉保持安全的情况下才允许战争；受到直接威胁或商队关闭的城市无法维持公共礼拜和教学。如果宗教与社团组织的受托人和法官不能信任赞助人的印章，继承危机就会阻碍启动。
    start_logic: >-
      起始效果记录了赞助国、作为仪式地点的布哈拉、最终的尖塔建筑、现任统治者或州长、伊玛目或宗教领袖以及宗教与社团组织/捐赠背景。它概括了每月威望、转换速度、当前威望、稳定性、合法性、神职人员支持、宗教团结或和谐、国库、收入、债务、厌战以及贸易或朝圣活动（如果有）的国家基线。它记录了当地占领、围困风险、动乱、破坏、繁荣、尖塔状况、庭院可用性、宗教学校活动、穆斯林宗教与社团组织收入、市场安全、学生出勤、道路通行以及瘟疫或火灾风险的基线。它初始化砖砌检查、楼梯和灯具安全、宣礼员名册、通话时间表、宗教与社团组织契约审计、教师津贴、学生登记、布道准备、说明文本、庭院清洁、市场租金收取、警卫警戒线和最后公开通话等柜台。临时负担包括砖瓦和脚手架工程、灯油、教师津贴、学生面包、抄写员费用、警卫工资以及宗教与社团组织商店接受审计时损失的租金。
    progress_logic: >-
      每月进度包括维护宗教教育。泥瓦匠检查砖井、修复风化的路线、固定楼梯并检查灯具，以便尖塔能够安全地承载召唤。宣礼员排练时间、声音和轮换，而伊玛目则准备与公共秩序和指示相关的布道，而不仅仅是场面。宗教与社团组织受托人将店租账簿、田间收入和旧契约交给卡迪和抄写员；有争议的收入得到解决，以便教师和学生能够得到报酬。宗教学校的教师招收学生、布置课程，并为传教士或乡村教师准备基本文本。市场检查员保持宗教与社团组织商店的开放和诚实，因为捐赠取决于商业信任。守卫为礼拜者和朝圣者维护庭院通道。当布哈拉得到控制、维护费用得到支付、宣礼塔安全、庭院开放、宗教与社团组织收入流动以及宗教当局合作时，就会取得进展。因破产、占领、围困、严重骚乱、楼梯受损、火灾、瘟疫、穆斯林宗教与社团组织没收、市场关闭、神职人员拒绝、学生驱散、道路不安全或印章继承纠纷而暂停。它会随着神职人员的高度支持、繁荣的市场、宗教团结或接受的皈依政策、稳定的财政、安全的商队道路和低骚乱而加速。
    completion_logic: >-
      完成需要砖砌、楼梯、宣礼员、呼叫时间表、宗教与社团组织、教师、学生、布道、文本、庭院、市场租金、警卫和最终呼叫柜台完成或高于阈值。布哈拉仍然必须受到控制，最终的建筑必须存在，国家不能破产，尖塔必须在结构上可用，庭院必须安全，宗教与社团组织的契约必须被接受。最后一幕从清真寺庭院开始。宗教基金受托人出示密封的租金分类账；卡迪确认有争议的捐赠；老师和学生拿着津贴和书本站着；泥瓦匠检查后归还尖塔钥匙。指定的宣礼员登上塔楼向公众宣讲，而伊玛目则在塔下布道。统治者或总督确认捐赠并向附属社区派遣训练有素的教师或传教士。这一奇迹已成为国家能力，因为布哈拉的塔楼、清真寺、市场和学校现在已经产生了明显的声望和一个配备人员的宗教教育网络。
    failure_or_timeout_logic: >-
      该仪式可以等到下一个捐赠季节举行，但如果推迟太久，学生出勤率、穆斯林宗教与社团组织收入和来电者准备情况就会下降。如果赞助商失去布哈拉、最后一座尖塔建筑消失、国家仍然破产、尖塔变得无法使用、或者清真寺和宗教学校区被占领或摧毁，它就会取消。严重的骚乱、围困、火灾、瘟疫、楼梯受损、宗教与社团组织被没收、市场崩溃、神职人员拒绝、宗教内部冲突、道路堵塞或继承危机都可能会导致进展暂停，并可能重置宗教与社团组织和呼叫柜台。如果布哈拉在占领后被收回，则必须检查塔楼，核对宗教与宗教团体账目，并召回教师，然后才能进行最后的通话。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对布哈拉的所有权或控制权、最终独特的卡扬尖塔建筑的存在、没有破产、没有占领或无效的围困、可控的骚乱、可用的宣礼塔和清真寺庭院、公认的宗教权威、可用的宗教与宗教团体或捐赠支持、安全的市场和学生准入，并且没有活跃的重复仪式。添加对神职人员支持、宗教团结或皈依政策、当地繁荣、财政、低度破坏以及没有火灾、瘟疫或直接封锁的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和布哈拉、存储统治者或州长、宗教领袖和宗教与社团组织背景，初始化砖砌、楼梯和灯具计数器、宣礼员名册、通话时间表、宗教与社团组织契约审计、教师津贴、学生登记册、布道、指示文本、庭院清洁、市场租金、守卫和最后召唤、应用临时维护以及存储声望、皈依、神职人员、国库和当地基线。
      snapshot_effect_script: >-
        刷新每月声望、皈依速度、当前声望、稳定性、合法性、神职人员支持、宗教团结或和谐、国库、债务、厌战、朝圣或贸易活动、当地占领、围攻、动乱、破坏、繁荣、尖塔状况、庭院可用性、伊斯兰教学校活动、宗教与社团组织收入、市场安全、学生出勤、道路通行、瘟疫或火灾风险以及最终建筑物的存在。
      progress_effect_script: >-
        每月检查、提前砖砌检查、楼梯和灯具安全、宣礼员名册、通话时间表、宗教与宗教基金会契据审核、教师津贴、学生登记、布道准备、教学文本、庭院清洁、市场租金收取、警卫警戒线和最后呼叫准备。由于破产、占领、围困、动乱、楼梯损坏、火灾、瘟疫、宗教与社团组织没收、市场关闭、神职人员拒绝、道路不安全或继承纠纷而暂停或衰退。加速实现神职人员支持、繁荣、安全路线、稳定的财政和低骚乱。
      completion_trigger_script: >-
        要求总体进度或基本计数器完成，布哈拉控制，最终建筑存在，没有破产，没有占领或围攻，可控的骚乱，结构安全的尖塔，开放的庭院，接受的宗教与宗教组织契约，可用的教师和宣礼员，付费维护以及安全的学生通道。
      completion_effect_script: >-
        删除临时设施捐赠负担，应用保留monthly_prestige和global_pop_conversion_speed_modifier的永久国家修正，授予一次性威望，神职人员忠诚度，转换动力，研究支持，贸易收入或当地繁荣奖励，添加Kalyan呼叫站点内存，清除瞬态计数器，并设置持久完成或冷却标记。
    intended_rewards:
      permanent_country_modifier: >-
        保留monthly_prestige和global_pop_conversion_speed_modifier。威望来自布哈拉的塔楼、公众崇拜和维护的神圣天际线；转变速度来自资助教师、布道、学生津贴、宗教与社团组织收入和向外派遣的传教士。
      one_time_reward: 授予一次性声望、神职人员满意度、皈依动力、当地繁荣、研究支持或恢复宗教与社团组织市场的贸易收入。如果塔楼需要大修，部分奖励可以是当地的信心和缓解骚乱。
      local_building_reward: >-
        布哈拉应该保留对检查过的砖墙、尖塔钥匙、宣礼员名册、密封的宗教与社团组织账本、教师津贴、学生登记册、布道笔记和有人看守的庭院的记忆。稍后的实施可以将其表达为当地朝圣价值、宗教教育、皈依支持或声望，同时尖塔保持安全。
    notes: >-
      源仪式是直接的，但定时模式更好地代表了捐赠和指导周期。每月是正确的听众，因为尖塔的政治价值取决于反复的呼吁、资助的学校和维护的砖砌体。奖励必须保持声望和转化速度；学术和市场活动是制度支撑。
- id: 190
  key: unique_ferghana_palace
  base_key: palace_of_nations
  location: kokand
  source_ritual_key: ferghana_palace_rite
  status: designed
  ritual_design_zh:
    title: Kokand Audience of the Valley Gates
    mode: timed
    duration: >-
      定时模式应运行一个法庭观众季，通常为每月九到十二个周期。持续时间包括通过费尔干纳山谷发送传票，准备彩绘大厅和花园，安排贝克和使节的优先顺序，收集贡品和请愿书，检查马匹和丝绸义务，解决路线争端，以及在浩罕举行最后的朝见。来源是直接的，但外交声誉和合法性来自于反复的宫廷实践，而不是一次接待。
    listeners:
    - monthly
    - ruler_death
    historical_flavor: >-
      浩罕谷门的观众属于费尔干纳宫殿，因为浩罕的权威取决于通过观众、仲裁、礼物和控制路线做出肥沃但政治密集的山谷回应。宫殿内有彩绘木柱、华丽的大厅、花园、马厩、库房和守卫的庭院，是山口、丝绸城镇、马场、商队道路和当地贵族转化为国家合法性的地方。参与者包括可汗或总督、王室官员、山谷城镇的贝克、卡迪斯、抄写员、估税员、商队商人、丝绸经纪人、养马人、邻近宫廷的使节、翻译、守卫、音乐家、花园管家，以及因运河、通行费、牧场或继承而发生纠纷的请愿者。这些地方包括觐见大厅、宫门、花园、金库、马厩、请愿法庭、山门路线图以及进入浩罕的商队通道。这些物品包括荣誉长袍、印章、外交信件、进贡托盘、马匹清单、丝绸样品、收费登记册、运河请愿书、地毯、鼓和统治者的观众垫。外交声誉的提高是因为外人看到浩罕在处理优先权、礼物、特使和道路承诺方面遵守纪律。每月的合法性因山谷名流公开接受统治者的仲裁和印章而上升。
    confirmation_logic: >-
      赞助者必须拥有或控制浩罕，最终的费尔干纳宫殿奇迹建筑必须存在，国家不能破产，宫殿不能被占领、围攻、烧毁或因严重动乱而关闭。确认应要求有一位公认的统治者或摄政王能够接受宣誓、安全的山谷路线和山门、足够的国库用于存放长袍、招待、卫兵和特使礼物，以及可以控制的贵族或庄园的不满情绪。如果实施可以检查外交声誉、合法性、崇高忠诚、贸易路线安全、当地繁荣、马匹供应、丝绸或市场活动、战争状态、继承稳定性或边境安全，那么这些应该细化触发器。只有使节和贝克能够安全出行，战争才被允许；关闭山谷大门或威胁浩罕的战争应该阻止该仪式。有争议的继承应阻止确认，除非在更新ruler_death誓言后明确恢复设计。
    start_logic: >-
      起始效果记录了主办国、作为仪式地点的浩罕、最终的宫殿建筑、现任统治者或摄政王、观众季节以及受邀的贝克和使节背景。它概括了外交声誉、每月合法性、当前合法性、声望、稳定性、财政、收入、债务、厌战、贵族或庄园忠诚以及与邻国的关系或边境紧张局势（如果有）的国家基线。它记录了当地占领、围困、动乱、破坏、繁荣、宫殿可用性、道路和山门安全、市场准入、马厩、马匹供应、丝绸贸易、运河或灌溉纠纷、警卫准备和宫廷接待等方面的基线。它初始化了召见、使节邀请、殿堂准备、座位、请愿案卷、马帛检查、贡品清点、道门仲裁、卡迪判决、发放礼服、警戒线、花园宴会和最后宣誓等柜台。临时负担指的是长袍、礼物、地毯、食物、卫兵、抄写员、翻译、马厩饲料以及居住季节期间的宫廷开支。
    progress_logic: >-
      每月的进度是宫廷将山谷聚集成可见的秩序。信使向贝克斯、城镇长老、商人、养马者和邻近的使节发出召唤；抄写员会记录谁及时答复、谁迟延答复。宫廷管事人员修复彩绘柱子、准备地毯、清洁花园并分配房间。引导员设定优先顺序，这样竞争对手的引导员就不会把座位变成侮辱。卡迪斯和抄写员建立了一份关于运河、通行费、牧场、继承、商队损失和边境袭击的请愿书清单。税务官员清点贡品托盘、丝绸样品和硬币；马厩主人检查承诺服务或外交的马匹。特使职员翻译信件并根据等级匹配礼物。当宫殿安全、维护费用得到支付、道路畅通、统治者的权威得到承认、名人出席时，就会取得进展。它因破产、占领、围困、严重动乱、山门关闭、贵族叛乱、守卫无薪、外交侮辱、马病、市场崩溃或继承纠纷而暂停。它以高度合法性、强大的财政、安全的路线、繁荣的费尔干纳市场、合作的贵族、良好的外交地位和低动荡而加速。
      ruler_death监听器应立即测试后继者是否被接受；如果是，它将剩余的工作转换为新的誓言计数器，如果不是，它会暂停观众，直到贝克和特使能够认出赞助人。
    completion_logic: >-
      完成需要传票、特使、大厅、优先、请愿、马、丝绸、贡品、路门、审判、长袍、守卫、宴会和最终誓言计数器完成或高于阈值。浩罕仍然必须受到控制，最终的建筑必须存在，国家不能破产，宫殿大厅必须可用，山谷路线必须安全。最后一幕从宫殿门口开始，守卫和乐师们划定进入的顺序。贝克斯献上贡品并接受荣誉长袍；卡迪宣读判决书；商人和养马者出示密封的名单；特使按照指定的优先顺序递交信件；统治者或公认的继任者坐在彩绘的觐见大厅里，用国家印章确认道路、牧场、运河和贸易承诺。聚集在一起的名人在前往花园宴会之前宣誓。这一奇迹变成了国家能力，因为浩罕的宫殿将山谷的多样性变成了重复的外交和合法性体系。
    failure_or_timeout_logic: >-
      该仪式可以在季节性道路封闭期间等待，但如果推迟太久，使节信任、贡品库存和贵族出席就会减弱。如果赞助者失去浩罕、最后的宫殿建筑消失、国家仍然破产、宫殿被占领或摧毁，或者没有公认的统治者可以宣誓，那么它就会取消。严重的动乱、贵族叛乱、封锁山门、威胁浩罕的战争、外交羞辱、被谋杀的使者、马病、饥荒、市场崩溃或未解决的继承问题都会暂停进度，并可能重置优先权、誓言和长袍计数器。在ruler_death上，只有记录了继任者的权威并且贝克们重复或更新了他们的誓言后才能完成。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对浩罕的所有权或控制权，最终独特的费尔干纳宫殿建筑的存在，没有破产，没有占领或无效的围攻，可控的骚乱，可用的宫殿，安全的山谷和山门路线，公认的统治者或摄政，足够的金库，并且没有活跃的重复仪式。添加贵族合作、外交安全、市场和马匹供应、当地繁荣、没有继承危机、没有战争直接关闭路线的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和浩罕，存储统治者或摄政王，观众季节，以及贝克/使者背景，初始化传票计数器，使节邀请，大厅准备，优先级，请愿，马和丝绸检查，贡品，路门仲裁，卡迪判决，长袍，卫兵，宴会和最后宣誓，应用临时法庭负担，并存储外交、合法性、遗产、国库和地方基线。
      snapshot_effect_script: >-
        刷新外交声誉、每月合法性、当前合法性、声望、稳定性、国库、债务、厌战、贵族或庄园忠诚、邻居紧张、当地占领、围困、动乱、破坏、繁荣、宫殿可用性、道路和大门安全、市场准入、马厩、马匹供应、丝绸贸易、运河纠纷、卫兵准备、宫廷招待、继承状况和最终建筑存在。
      progress_effect_script: >-
        月票、提前传唤、使者邀请、大厅准备、座位、请愿案卷、马匹和丝绸检查、贡品库存、路门仲裁、判决、袍子分发、警卫警戒线、宴会和最后宣誓准备。因破产、占领、围困、动乱、大门堵塞、贵族叛乱、守卫无薪、外交侮辱、马病、市场崩溃或继承纠纷而暂停或衰退。在ruler_death上，要求接受继承并将进展重新定向到更新的誓言。
      completion_trigger_script: >-
        要求完成总进度或基本计数器，浩罕控制，最终建筑存在，没有破产，没有占领或围攻，可控制的骚乱，可用的宫殿大厅，开放的山谷路线，合作的贝克，安全的特使，受薪招待，以及能够密封判决的公认的统治者或继任者。
      completion_effect_script: >-
        消除临时观众负担，应用永久观众保留diplomatic_reputation和monthly_legitimacy的国家修改器，授予一次性合法性、声望、外交恩惠、高贵忠诚、贸易信心或当地繁荣奖励，添加浩罕受众站点记忆，清除瞬态计数器，并设置持久完成或冷却标记。
    intended_rewards:
      permanent_country_modifier: >-
        保留diplomatic_reputation和monthly_legitimacy。外交声誉来自于管理使者的地位、袍服、书信和山谷的承诺；合法性来自于贝克斯、卡迪斯、商人和养马者公开接受统治者的印章。
      one_time_reward: >-
        授予一次性的合法性、威望、改善的关系、高贵的忠诚、贸易收入或来自完整受众的当地繁荣。如果ruler_death重新定向仪式，则将部分奖励的规模转向继承合法性而不是物质利益。
      local_building_reward: >-
        浩罕应该保留对观众地毯、长袍清单、进贡托盘、马匹登记册、丝绸样本、路门判决、特使信件和花园宴会誓言的记忆。稍后的实施可以将其表达为当地的外交拉力、较低的贵族骚乱、贸易路线安全或继承后更强的合法性。
    notes: >-
      源仪式是直接的，但定时模式更好地代表山谷观众季节。每月处理传票、请愿、礼物和路线仲裁；包含ruler_death是因为当宣誓人发生变化时，宫殿的合法性必须更新。奖励必须保持外交声誉和月度合法性，并以贸易和贵族忠诚作为支持机制。
- id: 191
  key: unique_tashkent_old_bazaar
  base_key: world_market
  location: chach
  source_ritual_key: tashkent_old_bazaar_rite
  status: designed
  ritual_design_zh:
    title: Chorsu Scales 和 Caravan Peace
    mode: timed
    duration: >-
      定时模式应该持续一个主要市场和商队季节，通常是每月六到九个滴答声。这段时间代表着校准秤、许可经纪人和货币兑换商、指派大篷车警卫、核对收费账簿、准备宾客空间和饲料、听取贸易争端以及宣布公共市场和平。来源是直接的，但贸易收入和外交声誉应该来自反复证明查赫可以让陌生人安全交易。
    listeners:
    - monthly
    historical_flavor: >-
      《乔尔苏天平》和《商队和平》属于塔什干老集市，因为查赫站在一个以市场秩序为外交语言的十字路口。圆顶市场大厅、商队大门、纺织巷、茶摊、货币兑换长凳、驮畜场、手工艺作坊和卡迪法庭让来自不同城镇、语言和统治者的商人在他们能理解的规则下会面。参与者包括市场检查员、卡迪、掮客、货币兑换商、商队领袖、纺织品商人、茶馆主人、警卫、抄写员、收费员、驮畜饲养员、手工艺行会长老、翻译、邻近法院的使节或领事代理人，以及负责公共秩序的当地知名人士。这些地方包括
      Chorsu 市场十字路口、圆顶大厅、商队大门、称重台、货币兑换长凳、茶馆、动物场、工艺巷、卡迪法庭以及通往草原、费尔干纳、撒马尔罕和锡尔河引道的道路出口。这些物品包括秤、标准重量、印章、经纪人执照、大篷车标签、收费账本、平板电脑、纺织品样品、茶碗、警卫名单、仲裁记录和安全行为信。贸易收入增加是因为商人信任重量、信用和安全。外交声誉的提升是因为外国商人和使节看到
      Chach 跨越政治边界执行市场和平。
    confirmation_logic: >-
      赞助商必须拥有或控制 Chach，最后的塔什干旧集市奇迹建筑必须存在，国家不能破产，集市不能被占领、围攻、烧毁、瘟疫关闭或遭受严重动乱。确认应要求开放的商队道路、运作良好的市场权威、足够的金库用于警卫、检查员、维修、宾客空间和纠纷赔偿，并且没有使外国商人不安全的积极政策或叛乱。如果实施可以检查贸易收入、外交声誉、商人或市民满意度、当地繁荣、路线安全、土匪或袭击者威胁、市场准入、战争状态、瘟疫或破坏，那么这些应该完善触发器。只有商队使用的道路保持开放，战争才被允许；关闭市场退出或针对特使的战争应该阻止确认。
    start_logic: >-
      起始效果记录了赞助国、作为仪式地点的查赫、最终的集市建筑、现任统治者或总督、市场权威以及商队季节。它概括了贸易收入、外交声誉、威望、稳定性、合法性、财政、收入、债务、贸易范围或路线代理、厌战以及商人或市民支持（如果有）的国家基线。它记录了占领、围困、动乱、破坏、繁荣、集市可用性、商队道路安全、市场准入、收费办公室功能、警卫准备、土匪威胁、货币兑换活动、商品品种、宾客空间、动物饲料以及瘟疫或火灾风险的当地基线。它初始化用于秤校准、重量密封、经纪人许可、货币兑换商审计、商队登记、收费分类账核对、卡迪仲裁、警卫分配、宾馆准备、动物庭院供应、茶馆调解、工艺车道秩序和最终市场和平公告的计数器。临时负担包括警卫、检查员、抄写员、印章、修理、饲料、水、宾客接待以及审核期间的临时通行费减免。
    progress_logic: >-
      每月的进度是使信任可衡量的集市。检查员将标准重量带到每个大厅，测试秤，并在不诚实的桌子上标记罚款或排除。经纪人更新许可证并指定他们将负责的货物、语言和路线。货币兑换商提供硬币余额、汇率和质押记录以供审计。商队领队登记出发地、装载量、驮畜、警卫和计划出发；收费员将付款与路线安全义务进行核对。卡迪斯和商人长老们听到有关货物丢失、合作关系破裂、重量过重、未付债务和外国商人受伤等纠纷。大门和道路出口都有警卫；动物饲养场准备饲料和水；茶馆主人会在小争吵演变成外交事件之前进行调解。当道路开放、集市安全、维护费用得到支付、检查人员可以工作、外国商人参加时，就会取得进展。它因破产、占领、围困、严重动乱、瘟疫、火灾、市场骚乱、不安全的道路、土匪、不诚实的秤、无薪警卫、外交侮辱或关闭出口的战争而暂停。它以繁荣的贸易、强大的财政、良好的外交声誉、低动荡、安全的路线、合作的商人和活跃的商队到来而加速。
    completion_logic: >-
      完成要求规模、重量、经纪人、货币兑换商、商队、通行费、仲裁、警卫、宾馆、动物场、茶馆、工艺巷和最终公告柜台完成或超过阈值。查赫仍然必须受到控制，最终的建筑必须存在，国家不能破产，集市必须开放，商队道路必须安全。最后一幕发生在市场十字路口。检查员展示密封的重量；经纪人和货币兑换商持有会签的许可证；卡迪斯阅读市场和平与争议程序；大篷车领导者收到道路标签和警卫任务；外国商人和使节见证了收费账本被封存。茶馆主人和工艺长老们打开了小巷，驮畜被牵着穿过大门，州长宣布查赫发行的债务、重量和安全通行证将得到兑现。这一奇迹变成了国家能力，因为集市将商业可靠性转化为收入和外交信任。
    failure_or_timeout_logic: >-
      该仪式可以等到下一个商队季节举行，但如果推迟太久，商人出席率、经纪人执照和守卫承诺就会减弱。如果赞助商失去了查赫、最后的集市建筑消失、国家仍然破产、集市被占领或摧毁、或者商队道路仍然不安全，它就会取消。严重的骚乱、瘟疫、火灾、市场骚乱、土匪控制、外交暴力、通行费腐败、守卫拿不到薪水、影响饲料的饥荒或关闭出口的战争都会暂停进度，并可能重置商队和安全通行计数器。如果集市在占领后重新开放，则在完成之前必须再次审核所有重量、收费账簿、经纪人执照和货币兑换台。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对 Chach 的所有权或控制权、最终独特的集市建筑存在、没有破产、没有占领或无效围攻、可控的骚乱、开放的市场、安全的商队道路、有效的市场权威、足够的警卫和检查员金库以及没有活跃的重复仪式。添加对商人支持、外交安全、路线安全、当地繁荣、低土匪威胁以及没有瘟疫、火灾或战争结束出口的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和 Chach、商店管理者和市场权威上下文，初始化秤、重量、经纪人许可证、货币兑换商审计、商队登记、收费分类账、仲裁、警卫、宾馆、动物庭院、茶馆调解、工艺车道和最终计数器公告，应用临时市场负担，并存储贸易，外交，金库，路线和当地基线。
      snapshot_effect_script: >-
        刷新贸易收入，外交声誉，声望，稳定性，合法性，金库，债务，贸易路线代理，战争疲劳，商人支持，当地占领，围困，动乱，破坏，繁荣，集市可用性，道路安全，市场准入，收费办公室职能，警卫准备，土匪威胁，货币兑换活动、商品品种、宾客空间、饲料、瘟疫或火灾风险以及最终建筑存在。
      progress_effect_script: >-
        每月刻度、预先秤校准、重量密封、经纪人许可、货币兑换商审核、大篷车登记、通行费核对、卡迪仲裁、警卫分配、宾馆准备、动物庭院供应、茶馆调解、工艺车道命令和公告准备。因破产、占领、围困、动乱、瘟疫、火灾、骚乱、不安全的道路、土匪、不诚实的天秤、无薪警卫、外交侮辱或战争结束而暂停或衰退。加速繁荣、商业合作、安全的道路、强大的财政、良好的外交和活跃的商队。
      completion_trigger_script: >-
        要求总体进展或必要的市场柜台完成，Chach控制，最终建筑存在，没有破产，没有占领或围困，可控的骚乱，开放的集市，安全的商队道路，密封的重量，有执照的经纪人，受薪的警卫，有效的卡迪仲裁，并且没有活跃的外交事件。
      completion_effect_script: >-
        删除临时市场负担，应用保留trade_income和diplomatic_reputation的永久国家修正，授予一次性贸易收入、外交恩惠、商人满意度、声望、当地繁荣或骚乱救济，添加Chorsu市场和平站点记忆，清除瞬态计数器，并设置持久完成或冷却标记。
    intended_rewards:
      permanent_country_modifier: >-
        保留trade_income和diplomatic_reputation。贸易收入来自可信赖的权重、经纪人、货币兑换商和有人看守的道路；外交声誉来自外国商人和使节尊重的安全通行和卡迪仲裁。
      one_time_reward: 在宣布市场和平后，给予一次性贸易收入、改善关系、商人忠诚度、声望、当地繁荣或减少骚乱。如果土匪或路线封闭是一个主要障碍，奖励可以倾向于路线信心和商队恢复。
      local_building_reward: >-
        Chach 应该保留密封秤、经纪人执照、货币兑换审计、商队标签、卡迪定居点、看守的道路出口、茶馆调解和收费账簿的记忆。稍后的实施可以将其表达为当地市场繁荣、路线安全、贸易价值或更少的外交贸易事件。
    notes: >-
      源仪式是即时的，但定时模式更好地代表商队市场季节。每月是正确的倾听者，因为集市信任是通过反复审核、仲裁和道路安全建立的。奖励必须保持贸易收入和外交声誉；当地繁荣和商人满意度正在支撑成果。
- id: 192
  key: unique_louvre_palace
  base_key: palace_of_nations
  location: paris
  source_ritual_key: louvre_court_exhibition
  status: designed
  ritual_design_zh:
    title: 卢浮宫宫廷展览和特使画廊
    mode: timed
    duration: >-
      定时模式应持续一个法庭季节，通常为每月九到十二个周期。这一时期包括准备画廊和庭院，修复外墙，选择绘画、挂毯、地图、盔甲和古物，安排大使的优先顺序，发布赞助名单，协调守卫和河道，以及举行最后的特使画廊观众。来源是直接的，但声望和外交声誉来自持续的宫廷编排。
    listeners:
    - monthly
    - ruler_death
    historical_flavor: >-
      卢浮宫宫廷展览和特使画廊属于卢浮宫，因为宫殿是将艺术、建筑、仪式和外交转变为公共权威的皇家机器。在成为现代博物馆之前，卢浮宫的庭院、画廊、雕塑立面、河滨、哨所、工作室和观众室让卢浮宫展示了它对历史、品味、秩序和国际通行的拥有。参与者包括统治者或摄政王、司仪、王室官员、大使、翻译、国务秘书、画家、雕塑家、建筑师、挂毯管理员、收藏管理员、守卫、传令官、塞纳河上的船夫、印刷商和争夺可见青睐的朝臣。这些地方包括宫殿庭院、拱廊、画廊、楼梯、警卫室、收藏室、河岸平台、会议室以及教堂或纪念空间（如果死亡改变了仪式的方向）。这些物品包括肖像、王朝家谱、挂毯、古董碎片、地图、外交礼物、奖章、盔甲、建筑模型、赞助名册、座位图、印章和警卫命令。由于宫廷一再表现出辉煌和王朝记忆，每月的威望都会上升。外交声誉的提升是因为使节们遇到了一座以可靠的方式管理着优先权、礼物、承诺和准入的宫殿。
    confirmation_logic: >-
      赞助者必须拥有或控制巴黎，最终的卢浮宫奇迹建筑必须存在，国家不能破产，宫殿、庭院、画廊和塞纳河通道不能被占领、围攻、封锁或处于严重动乱之中。确认应该需要一个正常运作的法院、公认的统治者或摄政王、足够的财政资金用于艺术家、警卫、维修、印刷和外交招待，并且没有导致优先权危险的活跃的继承纠纷。如果实施可以检查威望、外交声誉、合法性、宫廷或贵族忠诚、艺术家支持、资本准入、当地繁荣、战争状态、封锁、瘟疫或巴黎动乱，那么这些应该细化资格。如果使节能够安全参加，战争是允许的，但威胁巴黎或塞纳河的战争应该阻止开始。如果ruler_death刚刚发生，则应需要接受的继任者或摄政进行确认。
    start_logic: >-
      起始效果记录了赞助国、作为仪式地点的巴黎、最终的卢浮宫建筑、现任统治者或摄政王、宫廷季节以及受邀使节背景。它概括了每月威望、外交声誉、当前威望、合法性、稳定性、财政、收入、债务、厌战、贵族或宫廷忠诚、艺术家或文化产出（如果有）以及与受邀权力的关系等国家基线。它记录了占领、围攻、动乱、破坏、繁荣、宫殿可用性、画廊状况、立面状况、塞纳河通道、警卫准备情况、人群控制、瘟疫风险和法庭安全等当地基线。它初始化用于画廊维修、门面清洁、藏品库存、肖像和挂毯布置、外交礼品登记、使节优先、赞助名单、艺术家委托、警卫和河流通道计划、印刷节目、法庭排练和最终画廊观众的柜台。临时负担包括艺术家津贴、维修、警卫、印刷、蜡烛、招待、船只服务、礼品展示和宫廷开支。
    progress_logic: >-
      每月的进步是宫廷学习如何表现自己。管家们检查画廊、库存画、挂毯、地图、古物、奖章和盔甲，并决定哪些物品讲述了一个连贯的王朝故事。建筑师和泥瓦匠修复外墙、楼梯、地板和照明，使从庭院到画廊的路线看起来受到控制。画家、雕塑家和挂毯管理员完成委托或修复损坏的作品。秘书们编制赞助名单，并决定哪些职位、婚姻、条约或胜利可以在不激怒宫廷派系的情况下展示。仪式主持人为大使制定座位和优先顺序；翻译人员准备信件和礼物描述。警卫人员演练人群控制，而河流官员则保持塞纳河引道可用。当巴黎被控制、维护费得到支付、法院得到承认、画廊可用、特使可以出席、骚乱程度较低时，就会取得进展。它因破产、占领、围困、巴黎严重骚乱、瘟疫、画廊火灾、艺术家无薪、外交侮辱、塞纳河通道受阻、派系法庭危机或继承纠纷而暂停。它因高声望、强大的财政、稳定的合法性、活跃的艺术家赞助、和平的外交通道和低动荡而加速。在ruler_death上，只有在继承被认可的情况下，听众才应该将未完成的画廊作品转为纪念订购；否则所有特使优先暂停。
    completion_logic: >-
      完成要求画廊、立面、收藏、肖像/挂毯、礼物、特使、赞助、艺术家、守卫/河流、节目、排练和最终观众计数器完成或高于阈值。巴黎仍然必须受到控制，最终的建筑必须存在，国家不能破产，宫殿必须开放，使节必须安全。最后一幕从卢浮宫庭院开始。路线上有守卫；朝臣按等级进入；艺术家站在成品旁边；收藏管理员打开画廊；大使按优先顺序领导；统治者、摄政王或公认的继承人在王朝肖像、地图、挂毯和建筑模型之前收到信件和礼物。宣读赞助名册，列出佣金和受青睐的艺术家，秘书向法庭分发副本。这一奇迹已成为国家能力，因为卢浮宫已将皇家艺术和宫廷仪式转变为一种持久的声望和外交信誉语言。
    failure_or_timeout_logic: >-
      仪式可以等到晚些时候的宫廷季节举行，但如果拖延太久，特使出席、艺术家承诺和画廊准备工作就会减弱。如果赞助商失去了巴黎，最后的卢浮宫建筑消失，国家仍然破产，宫殿被占领或摧毁，或者没有公认的统治者或摄政王可以接待观众，比赛就会取消。严重的骚乱、围攻、瘟疫、火灾、塞纳河通道受阻、外交丑闻、宫廷派系暴力、艺术家无薪或继承危机都可能会暂停进度，并可能重置特使和赞助计数器。在
      ruler_death 上，仪式必须成为公认的纪念和继承展示，或者暂停，直到新的权威得到认可。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对巴黎的所有权或控制权、最终独特的卢浮宫建筑存在、没有破产、没有占领或无效围攻、可控的骚乱、可用的宫殿和画廊、开放的塞纳河或宫廷通道、公认的统治者或摄政、足够的金库供宫廷招待，并且没有活跃的重复仪式。添加对声望、外交安全、艺术家支持、贵族或宫廷忠诚、瘟疫/火灾缺席以及除非解决否则不会出现继承危机的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和巴黎、存储统治者或摄政王、宫廷季节和特使背景，初始化画廊修复、正面清洁、收藏库存、肖像和挂毯布置、外交礼物、特使优先级、赞助名单、艺术家委员会、警卫和河流通道、印刷节目、宫廷排练的柜台，以及最终观众，应用临时法庭负担，并存储声望、外交、合法性、金库和当地基线。
      snapshot_effect_script: >-
        刷新每月声望、外交声望、当前声望、合法性、稳定、国库、债务、厌战、宫廷或贵族忠诚、文化输出、邀请关系、当地占领、围困、动乱、破坏、繁荣、宫殿可用性、画廊状况、立面状况、塞纳河通道、守卫准备情况、人群控制、瘟疫或火灾风险、继任状态和最终建筑存在。
      progress_effect_script: >-
        每月报价、提前画廊维修、立面工作、藏品库存、肖像和挂毯布置、礼品登记、特使优先、赞助名单、艺术家委员会、警卫和河流计划、印刷节目、排练和观众准备。由于破产、占领、围困、动乱、瘟疫、火灾、艺术家无酬、外交侮辱、塞纳河通道受阻、法庭危机或继承纠纷而暂停或衰退。在ruler_death上，要求接受继承并将进度重定向到王朝纪念馆展示。
      completion_trigger_script: >-
        要求完成全部进度或基本计数器，巴黎控制，最终建筑存在，没有破产，没有占领或围困，可控制的骚乱，可用的宫殿画廊，安全的特使通道，付费艺术家和警卫，开放的宫廷路线以及公认的统治者，摄政者或继承人。
      completion_effect_script: >-
        消除临时展览负担，应用永久国家保留monthly_prestige和diplomatic_reputation修改器，授予一次性声望、外交恩惠、合法性、艺术家支持或宫廷忠诚奖励，添加卢浮宫特使画廊站点内存，清除瞬态计数器，并设置持久完成或冷却标记。
    intended_rewards:
      permanent_country_modifier: >-
        保留monthly_prestige和diplomatic_reputation。声望来自画廊、收藏、委托和王朝展示；外交声誉来自受控的优先权、礼物处理、宫廷准入以及向使节提供可信的皇家介绍。
