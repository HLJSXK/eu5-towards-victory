        广州应该记住行牌、工厂钥匙、仓库封条、翻译名册、关税表、货物舱单、债券、投诉簿、消防通道、引航员统计和季节性关闭记录。稍后的实施可以将其表达为当地贸易实力、港口繁荣、外交使团能力或较低的走私风险。
    notes: >-
      源仪式是即时的，但定时模式适合受监管的贸易季节。每月一次就足够了，因为该网站通过合同、清单、翻译和海关而不是战争或继承来运作。保留贸易收入和外交声誉的永久奖励；本地商人信任是支撑逻辑，而不是替代主题。
- id: 163
  key: unique_dardanelles_fortress
  base_key: coastal_defense_cannon
  location: gallipoli
  source_ritual_key: strait_battery_muster
  status: designed
  ritual_design_zh:
    title: 达达尼尔海峡炮台集结
    mode: timed
    duration: >-
      定时模式应运行一个海军防御季节。每月十二个刻度代表校准海岸炮、审核弹药库、探测水流、注册飞行员、测试链条或吊杆程序、钻探信号柱、协调厨房与岸上电池以及复习战斗经验。当海峡成为一个排练系统而不是炮台集合时，海军士气和全球防御力量都会提高。
    listeners:
    - monthly
    - pre_winning_war
    - ending_war
    historical_flavor: >-
      海峡炮台集合属于达达尼尔海峡要塞系统，因为加里波利和海峡控制着爱琴海和马尔马拉海之间的通道。通过海峡的舰队必须面对水流、机动受限、岸塔、重型大炮、巡逻艇、飞行员、信号机和两岸的弹药库。参与者包括要塞指挥官、奥斯曼帝国或赞助商炮手、海军上尉、厨房船员、火药店员、军械师、飞行员、信号员、链条或吊杆人员、工程师、木匠、灯塔或灯塔管理员、海关官员、警卫以及通过证明该海峡受到管辖的特使或商人。这些地方包括加里波利炮台、对岸塔楼、炮台、火药库、码头堆场、引航站、信号山、锚链锚点、巡逻锚地以及将海上报告变成命令的会议室。这些物品包括大炮、火药桶、子弹、推弹杆、慢速火柴、靶标、当前笔记、飞行员手册、链节、旗帜、信标燃料、厨房桨、修理木材和密封的海峡通道。
      naval_morale_modifier 上升是因为水手们知道他们的船只是在友好的海岸火力和纪律信号下作战。 global_defensive之所以崛起，是因为国家学会了将地形、火炮、后勤和指挥时机转变为防御学说。
    confirmation_logic: >-
      赞助商必须拥有或控制加里波利，最后的达达尼尔海峡要塞奇迹建筑必须存在，国家不能破产，海峡要塞、弹药库、码头和信号站不能被占领，在敌对围攻下，被敌军封锁，或处于严重的骚乱中。国家应该拥有足够的海军准入权、水手、炮手、火炮、火药和指挥权，以使炮兵集结具有可信性。如果实施能够检测到海军士气、防御实力、舰队规模、水手、炮兵准备情况、堡垒维护、封锁、航道控制、战争疲劳、当地破坏和附近的敌对舰队，那么这些应该会得到确认。如果堡垒坚守，战争就不会阻碍仪式；这使得演习变得紧迫。失去海岸或被俘获的杂志应该阻止启动。
    start_logic: >-
      起始效果记录了赞助国、作为仪式地点的加里波利、最终的堡垒建筑、当前的海战背景、附近的敌对舰队（如果有）以及活跃的海峡炮台周期。它快照了国家基线：naval_morale_modifier、global_defensive、海军士气、堡垒防御、炮兵力量、水手、舰队战备状态、财政/收入、厌战状态、稳定性和战争状态。它快照了当地的基线：占领、围攻、封锁、动乱、破坏、繁荣、堡垒状况、枪支状况、火药供应、弹药库安全、码头通道、飞行员可用性、信号可见性、链条/吊杆状况、巡逻艇和补给路线安全。它初始化用于火炮校准、火药审计、弹丸储存、距离标记放置、电流探测、飞行员名册、信号演习、链条或吊杆测试、厨房岸协调、弹匣消防安全、通行证登记、战斗课程回顾和最终实弹集合的计数器。临时负担包括火药、子弹、枪支维修、飞行员工资、信号燃料、链条维护、巡逻艇维护、工程师工资以及演习限制通行时损失的通行费。
    progress_logic: >-
      每月进度是海峡学习作为一个整体射击。炮手清理炮管、测试炮架、设置射程桩，并为进入狭窄区域的船只排练命令。粉末工作人员计算桶数，清除弹匣中的火花，并记录潮湿或变质的库存。飞行员探测水流和浅滩的声音，然后标记友方桨帆船可以在不阻挡海岸火力的情况下进行机动的位置。信号管理员在塔楼之间悬挂旗帜、灯笼和信标烟雾。链条工作人员检查锚点并练习关闭或打开障碍物；木匠修理巡逻艇；海关官员更新通行证登记册，这样商人就不会与袭击者混淆。当加里波利被控制、火炮和航道都可用、火药供应充足、水手和飞行员可用、骚乱得到遏制时，进展就会取得进展。它会因破产、占领、围攻、敌人封锁、严重骚乱、弹匣事故、火药短缺、枪支爆裂、链条断裂、飞行员失踪、风暴破坏或舰队叛变而暂停。强大的海军士气、良好的堡垒维护、经验丰富的炮手、可用的水手、安全的补给路线以及附近友军舰队的存在，可以加速它的发展。当战役因为海峡阻止敌人通过、保护补给或困住敌方舰队而发生转变时，pre_winning_war
      监听器应该添加进度。 ending_war 监听器记录战斗课程、修复的电池、囚犯或战利品名单、新的通行证规则以及影响海峡的条约条款。
    completion_logic: >-
      完成需要完成火炮、火药、射击、射程、水流、飞行员、信号机、链条、厨房、杂志、通行证、战斗回顾和实弹计数器。加里波利必须保持控制，最后的堡垒必须存在，国家不能破产，海峡不能被敌人封锁。最后的场景发生在受控的实弹射击通道中。巡逻艇通过有标记的水域；飞行员发出航线信号；岸上炮台向目标驳船或有标记的岩石开火；信标在塔之间传递命令；链条工作人员展示关闭；粉店员盖章杂志审核；船长收到海峡订单簿。如果战争刚刚结束，指挥官也会在驻军前阅读战事回顾。这一奇迹成为国家能力，因为达达尼尔海峡教导水手和士兵，防御是协调纵深的：堡垒、飞行员、信号灯、船只、通行证和火药都听从一个命令。
    failure_or_timeout_logic: >-
      在激烈的冲突期间，仪式可以暂停，但如果由于射程标记移动、火药变质以及飞行员当前的笔记变得陈旧而导致演习失败，那么进展就会减弱。如果赞助商失去加里波利、最后的要塞建筑消失、国家仍然破产、要塞被占领、弹匣爆炸或敌方舰队永久控制海峡，比赛就会失败或取消。严重的骚乱、弹匣损坏、枪支灾难、封锁、链条故障、飞行员开小差、海军叛变、风暴破坏或导致两岸暴露的失败都会暂停进度，并可能重置枪支、信号或通行计数器。
      ending_war失败后需要在完成前进行恢复审查。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对加里波利的控制、最终独特的要塞建筑存在、没有破产、没有重复的活动仪式、没有占领、决定性的围攻、封锁或严重的骚乱、可用的枪支和弹匣、可用的火药、水手、飞行员和信号站，以及至少一条安全的海岸/补给路线。添加对海军士气、防御力量、火炮、堡垒维护、舰队战备、敌对舰队、厌战、破坏和航道访问的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和加里波利，存储海战和敌对舰队背景，应用临时电池集结负担，初始化火炮校准计数器，火药审计，射击储备，距离标记，当前探测，飞行员名册，信号演习，链/吊杆测试，厨房岸协调、弹匣消防安全、通行证登记、战斗经验回顾、实弹集结、记录国家/地方基线。
      snapshot_effect_script: >-
        刷新海军士气修正值、全球防御、海军士气、要塞防御、炮兵力量、水手、舰队战备、财务、厌战、稳定、战争状态、加里波利占领、围困、封锁、动乱、破坏、繁荣、要塞状况、枪支状况、火药、弹匣安全、码头通道、飞行员可用性、信号可见性、链条/吊杆状况、巡逻艇、补给路线安全和最终建筑物存在。
      progress_effect_script: >-
        每月检查、提前枪支清洁和校准、火药和射击审核、距离标记、当前探测、飞行员名册、信号演习、链条测试、巡逻艇维修、厨房岸上演习、弹药库消防检查、通行证登记和实弹准备。因破产、占领、围困、封锁、骚乱、弹匣事故、火药短缺、枪支爆裂、链条断裂、飞行员失踪、风暴破坏或叛变而暂停或衰退。使用pre_winning_war奖励海峡控制的战役动力，使用ending_war记录维修和条约教训。
      completion_trigger_script: >-
        要求完成电池计数器或总进度，加里波利控制，存在最终堡垒，没有破产，没有敌人封锁，可用的电池和弹匣，可用的飞行员和信号，经过测试的链条/吊杆，完成的通行证登记，以及最终的实弹集结或战争审查
      completion_effect_script: >-
        移除临时炮台负担，应用永久国家修正，保持海军士气和全球防御力量，授予一次性海军士气、声望、水手、防御战备、战争疲惫救济或当地海峡控制奖励，添加达达尼尔海峡站点记忆，清除瞬态计数器，并保留完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留naval_morale_modifier和global_defensive。海军士气来自于在可靠的岸炮、飞行员和信号的支持下运行的舰队。防御力量来自于将海峡的分层地形、炮兵、补给和指挥时机的学说输出到其他防御工事。
      one_time_reward: 授予一次性海军士气、声望、水手、防御战备、减少战争疲劳或当地海峡贸易/安全利益。如果战争听众做出了贡献，则围绕已证实的海上航线封锁或成功的战后修复进行规模奖励。
      local_building_reward: >-
        加里波利应该记住校准的火炮弧线、火药分类账、射击库、当前探测、飞行员手册、信号演习、链锚检查、巡逻名册、通行证登记册和战斗回顾笔记。稍后的实施可以将其表达为当地海岸防御、封锁抵抗、海军补给或更快的电池恢复。
    notes: >-
      源仪式是即时的，但定时模式适合炮兵、飞行员和信号演习的季节。 pre_winning_war 和 ending_war 是合适的，因为该海峡证明了其在战役和和平解决中的价值。保持海军士气和防御的永久奖励，而不是一般的贸易代价。
- id: 164
  key: unique_escorial_monastery
  base_key: great_monastery
  location: el_escorial
  source_ritual_key: royal_cloister_dedication
  status: designed
  ritual_design_zh:
    title: 皇家回廊奉献和万神殿守夜
    mode: timed
    duration: >-
      定时模式应运行一年的宫廷修道院。每月十二个刻度代表奉献回廊、分配修道院办公室、命令皇家图书馆、检查皇家陵墓、安排弥撒、住宿法庭官员、复制奏折，以及确认皇室死亡和继承如何通过万神殿。由于君主制受到祈祷、档案和王朝记忆的约束，合法性和稳定性投资上升。
    listeners:
    - monthly
    - ruler_death
    historical_flavor: >-
      皇家回廊奉献属于埃斯科里亚尔，因为该建筑群是修道院、宫殿、大教堂、图书馆和王朝万神殿在一台简朴的花岗岩机器中。它将王权从喧闹的宫廷景观转向有序的奉献、记录保存、埋葬和在山脉下的行政撤退。参加者包括国王或公认的统治者、王室议员、修道院院长、僧侣、告解神父、图书管理员、档案管理员、宫廷秘书、负责万神殿职责的医生或防腐服务员、守卫、建筑师、家庭官员、等待接见的使节，以及在场证明服从王朝的贵族。这些地方包括回廊、大教堂、皇家公寓、会议室、图书馆画廊、档案柜、万神殿或皇家墓室、服务庭院以及从马德里或其他首都通往法院的道路。这些物品包括圣物、祭坛器皿、祈祷书、皇家遗嘱、继承文件、议会纪念碑、图书馆目录、地球仪和手稿、墓穴钥匙、丧服、蜡烛、印章和宫廷住宿卷。
      monthly_legitimacy 上升是因为统治者被放置在持久的神圣王朝秩序中。 stability_investment之所以上升，是因为议会、僧侣、档案馆和坟墓为国家提供了记忆、死亡、咨询和撤退的平静程序。
    confirmation_logic: >-
      赞助者必须拥有或控制埃斯科里亚尔，最后的修道院宫殿奇迹建筑必须存在，国家不能破产，建筑群和宫廷路线不能被占领，处于敌对围困或严重动乱中。国家应该有一位公认的统治者或摄政王、一个正常运作的法院、合作的神职人员或修道院工作人员，以及足够的国库来支持群众、警卫、图书馆管理和家庭旅行。如果实施能够检测到合法性、稳定投资、神职人员满意度、法院支出、王朝威望、继承危机、图书馆/研究能力、腐败、当地破坏以及首都/法院准入，那么这些应该会形成确认。只有当战争使法庭路线不安全或威胁到万神殿和档案馆时，才应该封锁。
    start_logic: >-
      起始效果记录了赞助国、作为仪式地点的埃斯科里亚尔、最终建筑、统治者或摄政、王朝背景、宫廷路线和活跃的回廊奉献周期。它快照了国家基线：monthly_legitimacy、stability_investment、合法性、稳定性、神职人员满意度、声望、法院支出压力、国库/收入、腐败、继承风险、战争状态以及图书馆或档案容量（如果有）。它快照了当地的基线：占领、围困、动乱、破坏、繁荣、复杂状况、大教堂准备情况、回廊状况、图书馆状况、坟墓安全、档案安全、法院住宿能力、路线安全和修道院合作。它初始化用于回廊奉献、大教堂服务、修道院办公室名册、图书馆目录、档案订购、议会纪念复印、皇家公寓准备、宫廷住宿登记、万神殿检查、墓穴钥匙保管、王朝弥撒时间表和最后皇家守夜的柜台。临时负担包括修道院津贴、蜡烛、图书馆维修、抄写员、卫兵、护路、宫廷内务移动、坟墓维护，以及将统治者和议会从普通宫廷日常事务中剔除的费用。
    progress_logic: >-
      每月的进展是君主政体变得有序。僧侣们分配办公室、维持祈祷时间并为王朝安排弥撒。神职人员检查大教堂和文物；图书馆员对手稿、地球仪、地图、神学书籍和皇家收藏进行编目；档案员整理遗嘱、议会纪念碑、继承文件和外交记录。法院秘书复制撤退期间做出的决定，这样埃斯科里亚尔就不会成为政府的逃避者。家庭官员为议员、贵族和使节准备住宿清单，而卫兵则负责保护回廊和宫殿之间的走廊。万神殿的守护者检查墓穴钥匙、墓地、哀悼布和蜡烛库，这样死亡就不会产生即兴创作。当建筑群安全、国库支付维护费、僧侣和宫廷官员合作、统治者或摄政得到承认时，就会取得进展。它因破产、占领、围困、严重动乱、法庭逃亡、修道院纠纷、档案丢失、图书馆失火、盗墓、家庭账户腐败或继承争议而暂停。它以高度的合法性、稳定的政府、满意的神职人员、干净的档案、强大的国库、宫廷纪律和王朝的连续性而加速。
      ruler_death 监听器是核心：如果统治者去世，万神殿守夜、埋葬记录、遗嘱验证和继任者识别计数器将成为强制性的；顺利的埋葬和继承可以加速完成，而有争议的死亡则冻结了仪式。
    completion_logic: >-
      完成需要回廊、大教堂、修道院、图书馆、档案馆、议会、公寓、住宿、万神殿、墓穴钥匙、弥撒和最后守夜柜台。埃斯科里亚尔必须保持控制，最终建筑必须存在，国家不能破产，统治者或摄政必须得到承认。最后一幕是万神殿守夜活动，随后是议会观众。僧侣们在大教堂的办公室里诵经；图书馆员提供目录；档案保管员封存王室文件；家庭官员读取住宿和出入登记册；守墓人出示钥匙；统治者或继任者跪在王朝的纪念碑前；议员们收到政府根据这一有序记忆进行的书面指示。这一奇迹变成了国家能力，因为埃斯科里亚尔为君主政体提供了稳定的咨询、奉献、记录、继承和埋葬节奏，使每月的合法性和稳定性变得可投资。
    failure_or_timeout_logic: >-
      仪式可以暂停，但如果宫廷出勤、修道院时间表或档案目录因为复杂的失去其综合纪律而失效，那么进展就会衰退。如果赞助商失去了埃斯科里亚尔、最终的建筑消失、国家仍然破产、建筑群被占领或洗劫、万神殿被侵犯或者法院永久逃亡，那么它就会失败或取消。严重的骚乱、图书馆火灾、档案丢失、修道院拒绝、墓穴钥匙纠纷、法庭派系危机、家庭账户腐败、瘟疫般的关闭或有争议的继承都会暂停进度，并可能重置档案、万神殿或法庭住宿柜台。当战争威胁到路线、记录或皇家陵墓时，战争就会中断。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对埃斯科里亚尔的控制、最终独特的修道院宫殿建筑的存在、没有破产、没有重复的活动仪式、没有占领、围攻或严重的骚乱、公认的统治者/摄政、正常运作的法院和神职人员/修道院办公室、可用的法院路线以及安全的图书馆/万神殿。添加对合法性、稳定投资、神职人员满意度、宫廷支出、继任危机、档案/图书馆状况、腐败、破坏和战争威胁的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和埃斯科里亚尔，存储统治者/摄政和王朝背景，应用临时法院修道院负担，初始化回廊奉献计数器，大教堂服务，修道院办公室花名册，图书馆目录，档案订购，议会纪念复制，皇家公寓、宫廷住宿、万神殿检查、墓钥匙保管、王朝弥撒时间表和最后守夜，以及记录国家/地方基线。
      snapshot_effect_script: >-
        刷新每月合法性、稳定投资、合法性、稳定、神职人员满意度、声望、法院支出压力、国库、腐败、继承风险、战争状态、档案/图书馆容量、埃斯科里亚尔占领、围困、动乱、破坏、繁荣、复杂状况、大教堂准备情况、回廊状况、图书馆状况、坟墓安全、档案安全、法庭住宿、路线安全、修道院合作和最终建筑存在。
      progress_effect_script: >-
        按月计算，提前回廊办公室、大教堂服务、群众时间表、图书馆目录、档案订购、议会副本、公寓准备、住宿名册、警卫路线、万神殿检查、墓穴钥匙保管和最后守夜准备情况。由于破产、占领、围困、动乱、法庭逃亡、修道院纠纷、档案丢失、图书馆失火、盗墓、腐败或继承争议而暂停或衰退。在
        ruler_death 上，需要埋葬、遗嘱验证、万神殿守夜和继任者识别计数器。
      completion_trigger_script: >-
        要求完成宫廷-修道院柜台或全部进度，埃斯科里亚尔控制，最终建筑存在，没有破产，没有占领或不安全的围攻，公认的统治者/摄政，安全的万神殿，密封的档案，有序的图书馆，活跃的修道院办公室，准备好的法庭住宿，以及完成的皇家守夜。
      completion_effect_script: >-
        消除临时的宫廷-修道院负担，应用永久国家修正，保留每月的合法性和稳定投资，授予一次性合法性，稳定性，神职人员满意度、王朝声望或继承顺序奖励，添加埃尔埃斯科里亚尔站点内存，清除瞬态计数器，并保留完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留monthly_legitimacy和stability_investment。埃斯科里亚尔通过王朝葬礼、皇家隐居和神圣仪式来产生合法性；它通过在一个受控复合体中组织议会记录、修道院时间表、图书馆知识和继承程序来提高稳定性投资。
      one_time_reward: >-
        授予一次性合法性、稳定性、神职人员满意度、王朝威望、减少腐败或更顺利的继承。如果发生ruler_death，则将奖励分配给经过验证的埋葬、遗嘱和继任者认可，而不是一般的声望。
      local_building_reward: >-
        埃斯科里亚尔应该记住修道院名册、大教堂服务手册、图书馆目录、密封的议会纪念碑、皇家公寓卷、万神殿检查、墓穴钥匙保管、王朝弥撒时间表和宫廷住宿清单。后期的实施可以表现为地方法院命令、档案保护、合法性恢复或继承稳定性。
    notes: >-
      源仪式是即时的，但定时模式适合寺院、宫殿、图书馆和万神殿的整合。每月负责机构维护； ruler_death 至关重要，因为皇家葬礼和继承是埃斯科里亚尔职能的核心。对合法性和稳定性投资保留永久奖励，而不是对一般的宗教皈依。
- id: 165
  key: unique_toledo_armory
  base_key: giant_armory
  location: toledo
  source_ritual_key: blade_proofing
  status: designed
  ritual_design_zh:
    title: 托莱多钢刀片校样
    mode: timed
    duration: >-
      定时模式应涵盖六到十二个月的军械库认证。这几个月涉及矿石和钢材采购、木炭和水管理、锻造、回火、刀片打样、打样标记、装甲架检查、部队装配和战场反馈。士气和人力奖励的出现是因为士兵和征兵人员信任可见的武器质量、维修和更换系统。
    listeners:
    - monthly
    - pre_winning_war
    historical_flavor: >-
      托莱多钢铁的刀片校样属于托莱多军械库，因为这座城市代表的不仅仅是有吸引力的剑。它的讲习班将塔古斯地区的工艺技术、金属供应、水力、铁匠行会、皇家检查员、检验场和军事需求转变为武器士兵所相信的声誉。参加者包括剑匠大师、盔甲匠、炉工、木炭供应商、钢铁商人、抛光学徒、皇家检查员、陆军军需官、退伍上尉、精选的步兵和骑兵测试员、城市治安官以及记录校对标记和批次的抄写员。起源。这些地方有锻造大厅、磨房、淬火槽、打样庭院、盔甲架、皇家仓库、行会室、骡场、城外的集结地等。这些物品包括钢坯、棒材、刀片毛坯、锤子、砧座、回火油、水轮、弯曲框架、靶柱、压印的校样标记、刀鞘密封件、盔甲架、交付分类账以及在公共场合损坏的废弃刀片。
      land_morale_modifier 之所以得以保留，是因为一名配发了托莱多防护武器的士兵看到了王冠在钢铁中的承诺。 global_manpower_modifier之所以被保留，是因为可靠的供应、维修和检查使招募变得更容易：人员可以装备，民兵可以标准化，退伍军人知道损坏的武器将被更换而不是默默地被忽视。
    confirmation_logic: >-
      赞助商必须拥有或控制托莱多，最后的托莱多军械库奇迹建筑必须存在，国家不能破产，军械库区不能被占领，处于敌对围困之下，金属供应被封锁，或者遭受严重的打击骚乱。该国应该能够获得金属、木炭或燃料、熟练的工匠以及能够接收标准化批次的军事设施。如果可以的话，检查应考虑土地士气、人力储备、活跃的军队需求、工匠或市民满意度、生产效率、贸易路线安全、金库、破坏、当地繁荣、战争状态以及军械库仓库是否完好。如果托莱多安全的话，战争可能会成为证明，但敌人的占领、供应路线的破坏、铁匠的工资不高或采购中的腐败应该会阻碍开始。
    start_logic: >-
      起始效果记录了赞助国、仪式地点托莱多、最终的军械库建筑、现役军队背景以及打样周期。它快照了国家基线：土地士气、全球人力修正或人力储备、军队专业精神或演习（如果有）、财政、生产效率、军事物资供应、工匠/市民满意度、战争状态、招募压力和当前装备短缺（如果实施可以跟踪）。它反映了当地的情况：占领、围困、动乱、破坏、繁荣、军械状况、金属通道、燃料通道、水力、行会合作、仓库安全、检验场安全和通往军队的道路。它初始化了钢材进料、备炉、叶片锻造、调质、弯曲检验、边缘检验、装甲架检查、打样标记、不良批次统计、军需交付、部队装配、维修名册和现场报告等计数器。临时负担包括金属采购、木炭、铁匠工资、检查津贴、破坏测试损失、警卫工资、马车租赁以及转移选定部队进行验证使用的机会成本。
    progress_logic: >-
      每月进度是将军械库的工艺声誉转化为军事纪律。金属商人交付钢坯和棒材；在学徒拉制和磨削毛坯之前，行会大师会测试钢材的质量。炉管理员记录热色和燃料使用情况。史密斯锻造刀片，在受控的槽中淬火，回火，然后将它们交给检验大师。校对人员弯曲样品刀片，撞击目标柱，测试皮革或装甲板的边缘，并打破故障，学徒可以看到不良工作的成本。制甲师检查胸甲、头盔和架子；军需官将批次号与连队名册进行比较；选定的部队使用配发的刀片进行训练，并报告抓地力、平衡性、破损和维修需求。当托莱多安全、金属和燃料到达、铁匠得到报酬、检验场运转、军队可以接收批次时，进展就会取得进展。它因破产、占领、围困、严重骚乱、仓库火灾、采购欺诈、金属短缺、燃料短缺、行会罢工、工人患病、证据标记损坏或战争切断军队路线而暂停。它以高生产效率、满意的工匠、强大的财政、活跃的军队需求、安全的道路、经验丰富的教官和现有的军事纪律来加速。
      pre_winning_war 侦听器不应自行授予胜利；这意味着，当一场战役接近成功并且装备托莱多的部队似乎已经服役时，战场报告可以完成现场验证计数器并将车间验证转化为军队士气。
    completion_logic: >-
      竣工要求钢材进料、锻造、回火、校弯、校边、装甲检验、校样冲压、不合格批次核算、军需交付、部队装配、维修名册和现场报告柜台完成。托莱多必须保持控制，最后的军械库建筑必须存在，国家不能破产，军械库通道必须安全。最后的场景发生在打样庭院。铁匠大师向皇家军官和经验丰富的船长展示压印的刀片并检查盔甲。样品刀片被弯曲并释放，目标柱被撞击，被拒绝的分类帐中的不合格刀片被折断，并且接受的批次被运送到军需马车上。士兵们宣誓维护武器，队长们签署维修报告。皇家将证明标记作为军队标准发布。这一奇迹已成为国家能力，因为托莱多的手艺不再只是当地的技艺；而是当地的技艺。它是一个用于装备、修理和安抚军队的可重复系统。
    failure_or_timeout_logic: >-
      仪式可以在没有严格超时的情况下暂停，但如果金属生锈、记录损坏或现场反馈过时，未完成的批次就会失去价值。如果赞助商失去托莱多，最后的军械库建筑消失，国家仍然破产，军械库被占领或摧毁，或者证明标记被证明是欺诈的，那么它就会失败或取消。严重的骚乱、仓库火灾、金属或燃料短缺、行会罢工、采购丑闻、道路中断或敌人围攻都会暂停进度，并可能重置摄入、证明、交付或现场计数器。如果战争切断了托莱多的联系，仪式就会中断；
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对托莱多的控制、最终独特的军械库建筑存在、没有破产、没有重复的活动仪式、没有占领或敌对围困、可控的骚乱、安全的军械库区、获得金属/燃料/工匠的通道、完整的仓库、通往军队的可用道路以及能够接收经过认证的武器的军事设施。添加对土地士气、人力、财务、生产效率、工匠满意度、战争状态、破坏和采购腐败（如果有）的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和托莱多，存储军队和战争背景，应用临时军械库负担，初始化钢材摄入计数器，熔炉准备，锻造，淬火，回火，弯曲证明，边缘证明，装甲检查，证明冲压，拒绝批次分类账，军需交付，部队装配，
      snapshot_effect_script: >-
        刷新土地士气、人力储备或修正值、军队纪律、金库、生产效率、军用物资供应、工匠/市民满意度、战争状态、招募压力、设备短缺、托莱多占领、围困、动乱、破坏、繁荣、军械状况、金属获取、燃料获取、水力、行会合作、仓库安全、校场安全、道路通行和最终建筑存在。
      progress_effect_script: >-
        按月报价、提前采购、锻造、回火、证明、冲压、拒绝、装甲检查、交付、部队装配、维修和现场报告柜台。由于破产、占领、围困、严重动乱、仓库火灾、金属/燃料短缺、行会罢工、腐败、路线中断、拖欠工资或军队无法接收批次而暂停或衰退。在
        pre_winning_war 上，仅当经过认证的设备确实支持该活动时，才添加或完成现场验证进度。
      completion_trigger_script: >-
        要求完成军械库柜台或总体进度，托莱多控制，最终建筑存在，没有破产，没有占领或不安全的围攻，可控制的骚乱，金属/燃料访问，付费铁匠，干净的证明分类账，盖章接受的批次，拒绝的失败原因，军需官交付准备，和现场报告完成或在和平时期用替代演习放弃。
      completion_effect_script: >-
        消除临时军械库负担，应用永久国家修正保持土地士气和人力，授予一次性士气、人力、军队传统、装备库存、工匠满意度或生产奖励，添加 Toledo Steel 打样站点内存，清除瞬态计数器，并保留完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留 land_morale_modifier 和 global_manpower_modifier。士气来自于经过验证的可信武器、对失败的公开拒绝以及经验丰富的现场报告。人力得到改善，因为可靠的军械库吞吐量使全国范围内的招募、民兵装备和维修管理变得更加容易。
      one_time_reward: >-
        通过公共打样授予一次性人力、军队士气、军队传统、军用物资、生产效率、工匠满意度或声望。如果pre_winning_war做出了贡献，则将部分奖励转向战场信心而不是原始胜利分数。
      local_building_reward: >-
        托莱多应该记住校样标记、破损的废弃刀片、熔炉分类账、回火槽记录、盔甲架标签、军需交付书、维修名册、行会会长签名和现场报告。稍后的实施可以将其表达为当地军械库吞吐量、较低的设备成本或军队损失后更快的恢复。
    notes: >-
      源仪式是即时的，但需要定时模式，因为可靠的士​​气和人力来自重复认证的批次。每月处理工艺和采购；保留 pre_winning_war 仅用于在设备实际形成活动时验证现场报告计数器。保持军事和后勤方面的永久奖励，而不是名剑的一般声望奖励。
- id: 166
  key: unique_camino_de_santiago
  base_key: imperial_post_road_network
  location: santiago_compostela
  source_ritual_key: pilgrim_way_blessing
  status: designed
  ritual_design_zh:
    title: 圣詹姆斯朝圣之路祝福
    mode: timed
    duration: >-
      定时模式应涵盖一个朝圣之路年。每月十二个刻度代表测量路站、修复桥梁、登记朝圣者、供应医院、发布扇贝壳标志和安全通行、协调沿途主教和城镇以及在孔波斯特拉接待朝圣者。转换速度和外交声誉得到提高，因为道路通过受保护的国际运动而不是通过单一的神社仪式传播信仰。
    listeners:
    - monthly
    historical_flavor: >-
      朝圣者之路祝福属于圣地亚哥卡米诺，因为奇迹是一个网络：大教堂、遗迹崇拜、道路、桥梁、旅馆、医院、路边神社、集镇、主教和外国朝圣者因安全通行的期望而联系在一起。参与者包括孔波斯特拉大教堂的神职人员、沿途的主教和修道院院长、医院兄弟姐妹、桥梁看守、城镇治安官、路卫、导游、旅店老板、抄写员、贝壳卖家、文物保管人、外国朝圣者、与朝圣团体同行的商人以及关注臣民待遇的使节。这些地方包括圣地亚哥大教堂、城门、朝圣者医院、桥头堡、山口、圣地、旅馆、集市广场、收费站和充当神圣邮路的路站。这些物品包括扇贝壳、朝圣者徽章、安全通行信、医院分类账、桥梁收费簿、文物游行横幅、路线图、布道笔记、食品店、蜡烛、忏悔登记册和投诉卷。
      global_pop_conversion_speed_modifier 的上升是因为朝圣者聆听布道、接受忏悔、传播故事并将虔诚的习惯带回家。 diplomatic_reputation 之所以上升，是因为外国城镇和统治者认为赞助商保护旅行者、遵守安全通行规则并处理跨境争端。
    confirmation_logic: >-
      赞助商必须拥有或控制圣地亚哥孔波斯特拉，最后的卡米诺奇迹建筑必须存在，国家不能破产，大教堂、路站和直接路线不能被占领、封锁或遭受严重骚乱。朝圣道路必须足够安全，可以进行护送；医院和桥梁必须可用；神职人员或地方官员必须愿意合作。如果实施可以检测到转换速度、外交声誉、宗教团结、神职人员满意度、当地繁荣、路线安全、破坏、盗匪、道路基础设施、外交关系和朝圣者交通，那么这些应该得到确认。只有当战争关闭道路走廊或使外国安全通行变得不可能时，战争才应该被封锁。
    start_logic: >-
      起始效果记录了赞助国圣地亚哥·孔波斯特拉（Santiago Compostela）作为仪式地点、最终的卡米诺（Camino）建筑、路线网络环境以及活跃的朝圣之路（Pilgrim Way）周期。它概括了国家基线：global_pop_conversion_speed_modifier、diplomatic_reputation、宗教团结或宽容、神职人员满意度、声望、稳定性、财政/收入、外交关系和战争状态。它记录了当地的基线：占领、动乱、破坏、繁荣、大教堂状况、道路通行、桥梁状况、医院容量、食品商店、警卫覆盖范围、强盗压力、朝圣者数量、投诉积压和路线站合作。它初始化用于路线调查、桥梁维修、宿舍检查、医院供应、炮弹/徽章发放、安全行为登记、布道和忏悔轮班、遗物横幅准备、警卫巡逻、城镇通知、外国朝圣者接待、投诉听证会和最后的孔波斯特拉祝福的柜台。临时负担包括食物、蜡烛、桥梁维修、医院工资、警卫、抄写员、道路标记、安全通行印章，以及为受保护的朝圣者免除或调整通行费的费用。
    progress_logic: >-
      每月的进展是逐步证明自己的道路。桥梁管理员检查拱门、渡口和收费站；医院管理人员清点床位、面包、酒、绷带和墓地；神职人员为抵达者安排布道、忏悔、弥撒和圣物游行。抄写员会发出安全通行信，并登记扇贝壳徽章，以便朝圣者可以在城镇中被认出。警卫在树木繁茂或山区巡逻，并将投诉记录与旅馆的报告进行比较。城镇治安官对市场、旅馆、价格以及当地人和外国朝圣者之间的纠纷制定规则。特使或外国神职人员会收到受保护旅行者的名单，因此赞助商的声誉会随之消失。当圣地亚哥被控制、公路车站合作、医院得到供应、神职人员传教和土匪受到遏制时，进步就会取得进展。因破产、占领、严重骚乱、桥梁被毁、通行证关闭、医院饥荒、强盗控制、不安全的外国通道、神职人员纠纷、文物丑闻、伪造安全通行证或因疾病关闭旅馆而暂停。它随着神职人员的高满意度、强大的路线基础设施、当地的繁荣、良好的外交关系、活跃的朝圣者交通以及成功的事先道路维护而加速。每个月的勾选应该是一个具体的道路行动：修桥、建医院、发放徽章、巡逻通行证、解决投诉或接待朝圣代表团。
    completion_logic: >-
      完成需要完成路线、桥梁、旅馆、医院、徽章、安全通行、布道、遗物、巡逻、城镇通知、对外接待、投诉和最终祝福柜台。圣地亚哥必须保持控制，最后的建筑必须存在，国家不能破产，至少一条受保护的朝圣者路线必须保持开放。最后一幕发生在孔波斯特拉。朝圣者团体携带炮弹进入并遵守安全规定；医院工作人员出示食品和护理账簿；桥梁管理员和警卫确认开放的路线阶段；神职人员举着圣物旗帜，传教，祝福离去归来的朝圣者；抄写员记录外国起源和解决的投诉。这一奇迹成为国家能力，因为圣地亚哥不再只是一座圣地：它是一条有管理的指导、热情好客和国际信任的道路，传播信仰并提高外交声誉。
    failure_or_timeout_logic: >-
      仪式可以在没有严格暂停的情况下暂停，但如果朝圣季节过去，进展就会减弱，因为道路报告、食品商店、安全通行和外国接触都过时了。如果赞助商失去了圣地亚哥·孔波斯特拉，最终的建筑消失，国家仍然破产，大教堂被占领或洗劫，或者道路网络因战争或强盗控制而关闭，那么它就会失败或取消。严重骚乱、桥梁倒塌、医院饥荒、伪造徽章、文物丑闻、疾病、外国朝圣者被杀、神职人员拒绝或滥用通行费应暂停进度，并可能重置徽章、医院或外交计数器。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对圣地亚哥孔波斯特拉的控制，最终独特的道路/神社建筑存在，无破产，无重复的活跃仪式，无占领或严重骚乱，开放朝圣路线，可用大教堂、医院和桥梁、合作神职人员/城镇以及易于管理的盗匪。添加对转换速度、外交声誉、宗教团结、神职人员满意度、繁荣、破坏、道路基础设施、外交关系、朝圣者交通和战争结束的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和圣地亚哥，存储路线网络上下文，应用临时朝圣道路负担，初始化路线调查计数器，桥梁修复，宿舍检查，医院供应，贝壳/徽章问题，安全行为登记，布道/忏悔轮班，遗物横幅、警卫巡逻、城镇通知、外国朝圣者接待、投诉听证会和最后祝福，并记录国家/地方基线。
      snapshot_effect_script: >-
        刷新转换速度、外交声誉、宗教团结或宽容、神职人员满意度、声望、稳定性、财政部、外交关系、战争状态、圣地亚哥占领、动乱、破坏、繁荣、大教堂状况、道路通行、桥梁状况、医院容量、食品商店、警卫覆盖、土匪压力、朝圣者数量、投诉积压、路线站合作和最终建筑存在。
      progress_effect_script: >-
        每月报价、预先道路调查、桥梁/渡轮维修、宿舍检查、医院用品、徽章发放、安全行为记录、布道、忏悔时间表、文物横幅、巡逻、市场通知、外国接待和投诉听证会。由于破产、占领、动乱、桥梁倒塌、通行证关闭、医院饥荒、土匪、不安全的外国通道、神职人员纠纷、文物丑闻、伪造文件或疾病而暂停或衰退。加速改善道路、神职人员支持、繁荣、朝圣者交通和外国信任。
      completion_trigger_script: >-
        要求完成朝圣柜台或总体进度，圣地亚哥受控，最终建筑存在，无破产，无占用，开放路线，可用大教堂，库存医院，修复桥梁或渡轮阶段，发放徽章，有效安全通行，完成圣物祝福，并解决投诉登记册。
      completion_effect_script: >-
        消除临时道路负担，申请永久国家修改器保留转换速度和外交声誉，授予一次性稳定性，威望，神职人员满意度，当地繁荣，朝圣收入或外国恩惠奖励，添加卡米诺站点记忆，清除瞬态计数器，并保留完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留global_pop_conversion_speed_modifier和diplomatic_reputation。皈依速度来自布道、忏悔、圣物游行、徽章和传播虔诚的归来朝圣者。外交声誉来自安全通行、受保护的外国人、开放的道路和可靠的争端处理。
      one_time_reward: 给予一次性的声望、稳定、神职人员满意度、当地繁荣、朝圣收入、减少道路上的骚乱，或来自受保护的外国朝圣者的外交支持。通过安全通行和干净的投诉记录来进行奖励。
      local_building_reward: >-
        圣地亚哥应该记住桥梁维修清单、医院分类账、扇贝徽章登记册、安全通行印章、布道名册、文物横幅游行、警卫巡逻记录、城镇市场条例和外国朝圣者接待簿。稍后的实施可以将其表达为当地朝圣繁荣、路线安全或外交使团支持。
    notes: >-
      源仪式是直接的，但定时模式最能代表热情好客和安全通行的公路季节。每月一次就足够了，因为卡米诺的力量来自路线管理而不是战斗或继承。保留对转换速度和外交声誉的永久奖励，而不仅仅是一般的本地贸易。
- id: 167
  key: unique_sagres_navigation_school
  base_key: naval_school
  location: lagos
  source_ritual_key: oceanic_chart_lecture
  status: designed
  ritual_design_zh:
    title: 萨格里什海洋海图讲座
    mode: timed
    duration: >-
      定时模式应涵盖一门航海课程和试航季节。每月十二个刻度代表关于风和洋流、飞行员考试、天文观测、海图校正、船舵复制、卡拉维尔装备检查、补给表起草、试航和返回汇报的讲座。当水手们相信穿越未知水域的可重复纪律时，海军航程和海军士气就会提高。
    listeners:
    - monthly
    - ending_war
    historical_flavor: >-
      海洋图讲座属于萨格里什和拉各斯，因为葡萄牙的大西洋边缘将悬崖、港口、飞行员、制图师、造船师、学者和皇家赞助变成了一所充满风险的航海学校。无论是被想象为一所正式的学校还是亨利王子时代较为宽松的圈子，该机构不仅仅是一个演讲厅：它是航海者、绘画者、观察天空的人和建造船只的人之间的工作交流。参与者包括飞行员、船长、制图师、天文学家、仪器制造商、造船师、帆匠、绳索供应商、皇家官员、牧师、翻译、资助航行的商人，以及带来谣言、探测和海岸描述的归国船员。这些地方包括地图室、悬崖观察点、拉各斯港口、造船厂、教堂、飞行员教室、仪器台、补给店以及帆船返回接受询问的锚地。这些物品包括波多兰海图、船舵、星盘、十字星、罗盘、沙漏、风笔记、海流表、船体图纸、航行计划、水桶清单和密封航行报告。
      naval_range 上升，因为距离变得可计算。 naval_morale之所以崛起，是因为船员们使用经过测试的仪器、修正的路线以及从损失中吸取教训而不是隐瞒损失的社区。
    confirmation_logic: >-
      赞助商必须拥有或控制拉各斯，最后的萨格里什航海学校奇迹建筑必须存在，国家不能破产，学校、港口、造船厂和通海道不能被占领、封锁或严重动乱。这个国家应该有水手、船只、飞行员和足够的财政来资助讲座、仪器和试航。如果实施可以检测海军范围、海军士气、水手池、探险家/海军上将的存在、造船能力、研究或创新、贸易范围、港口准入、封锁、海盗压力和战争状态，那么这些应该形成确认。战争只有在关闭港口时才会封锁；否则，ending_war
      可以将捕获的图表和汇报纳入课程中。
    start_logic: >-
      起始效果记录了赞助国拉各斯作为仪式地点、最终的航海学校建筑、活跃的海上战争/贸易背景、可用的飞行员和船只以及海洋图课程周期。它快照了国家基线：naval_range、naval_morale_modifier、水手、舰队规模、海军传统或士气、探险家/海军上将能力、研究速度（如果有）、贸易范围、财政/收入、海盗压力和战争状态。它记录了当地基线：占领、封锁、动乱、破坏、繁荣、港口通道、造船厂状况、地图室状况、仪器供应、海图库、飞行员可用性、船舶准备情况、供应商店以及天气/航道安全（如果有）。它初始化风讲座、当前讲座、天文观测、仪器校准、飞行员检查、海图复制、船舵校正、卡拉维尔检查、供应表、试航、返回汇报、捕获海图审查和最终海图讲座的计数器。临时负担包括仪器、海图羊皮纸、飞行员津贴、船舶修理、试航规定、沿海信标、文员以及因保持船舶训练而损失的收入。
    progress_logic: >-
      每月的进展是探索成为一门手艺。天文学家测量正午高度并比较表格；仪器制造商校准星盘和指南针；飞行员在考官面前背诵海岸线、风、洋流、珊瑚礁和锚地。制图师复制波托兰轮廓，根据返回的车辙校正比例，并用另一只手标记不确定的海岸，这样猜测就不会成为官方事实。造船工人检查远距离作业的轻快帆船、帆、索具、水桶和船体修理。供应商起草饼干、水、贸易商品、备用帆布和药品的表格。试航从拉各斯出发，测试风向，返回时进行测深，并听取船长、飞行员和抄写员将记忆与仪器进行比较的汇报。当拉各斯安全、船只可以航行、飞行员和学者得到报酬、仪器完好无损并且港口开放时，进步就会推进。它因破产、封锁、占领、严重骚乱、缺乏水手、造船厂停工、仪器丢失、海图失窃、海盗统治、风暴破坏或派系拒绝分享航线知识而暂停。凭借经验丰富的探险家、高昂的海军士气、良好的造船厂、强大的研究、安全的海上通道、商人的支持和成功的回报，它会加速发展。
      ending_war 收听者应将捕获或恢复的海图包、囚犯飞行员证词、护航课程和进入海道的条约通道添加到捕获海图审查计数器中。
    completion_logic: >-
      完成要求风、海流、天文学、仪器、飞行员、海图、船舵、船舶、补给、试航、汇报、捕获海图和最终讲座计数器完成或在没有发生战争的情况下适当放弃。拉各斯必须保持控制，最终学校必须存在，国家不能破产，港口必须开放。最后的场景发生在港口上方的地图室。飞行员站在修正后的图表上；天文学家显示仪器读数；造船师呈现卡拉维尔笔记；配置者读取范围表；返回的船长找出海图错误的地方；皇家官员将修改后的船舵密封起来，并将副本分配给下一次航行。机组人员随后在登机前聆听讲座。这一奇迹变成了国家能力，因为海洋风险已转化为共享技术，扩大了影响范围，并让水手们相信国家可以从每次航行中吸取教训。
    failure_or_timeout_logic: >-
      这种仪式可以暂停，但如果在航行季节之后没有更新海图和船舵，那么进展就会减弱，因为风和海岸知识变得陈旧。如果赞助商失去拉各斯、最后一座校舍消失、国家仍然破产、港口在整个赛季被封锁、或者海图室被摧毁或占领，比赛就会失败或取消。严重骚乱、造船厂火灾、飞行员失踪、仪器失窃、海图伪造、无人生还的航行失败、海盗控制或商船撤退都应暂停进度，并可能重置海图、试航或汇报计数器。
      ending_war海战失败后应要求在完成前进行恢复汇报而不是自动奖励。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对拉各斯的控制、最终独特的海军学校建筑的存在、没有破产、没有重复的活动仪式、没有占领、封锁或严重的骚乱、可用的港口和造船厂、可用的水手/飞行员/船只、功能正常的地图室和仪器以及海上通道。添加对海军航程、士气、探险家、研究、贸易范围、海盗、金库和战争破坏的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和拉各斯，存储海上战争/贸易背景，应用临时航海学校负担，初始化风讲座计数器，当前讲座，天文观测，仪器校准，飞行员检查，海图复制，船舵校正，卡拉维尔检查，供应表，试航，返回汇报，捕获海图
      snapshot_effect_script: >-
        刷新海军航程、海军士气修正值、水手、舰队规模、海军传统/士气、探险家/海军上将能力、研究/贸易范围、财政、海盗压力、战争状态、拉各斯占领、封锁、动乱、破坏、繁荣、港口通道、造船厂状况、地图室状况、仪器供应、海图库、飞行员可用性、船舶准备情况、供应商店、海上航线安全和最终建筑物存在。
      progress_effect_script: >-
        每月记号、预先讲座、天体观测、仪器检查、飞行员考试、海图复制、船舵校正、船舶检查、补给表、试航和汇报。因破产、占领、封锁、动乱、缺乏水手、造船厂停工、仪器丢失、海图失窃、盗版、风暴破坏或拒绝分享航线知识而暂停或衰退。在
        ending_war 上，处理捕获的海图、囚犯飞行员证词、护航课程和条约航道通行权。
      completion_trigger_script: 要求完成导航计数器或总体进度、拉各斯控制、最终学校在场、无破产、开放港口、可用的飞行员和仪器、更正海图、完成试航或同等情况汇报、供应表和最终海图讲座。
      completion_effect_script: >-
        消除临时学校负担，应用永久国家修正，保护海军范围和海军士气，授予一次性水手、海军传统、探索进度、研究、声望或贸易范围奖励，添加萨格雷斯导航站点内存，清除瞬态计数器，并保留完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留naval_range和naval_morale_modifier。航程来自海图、仪器、船舵、给养和船舶试验；士气来自于船员相信正确的知识并将损失转化为指导。
      one_time_reward: 给予一次性海军传统、水手、探索动力、研究进展、声望或贸易范围支持。如果ending_war做出了贡献，则将部分奖励用于捕获图表或恢复海上航线信心。
      local_building_reward: >-
        拉各斯应该记住风表、当前记录、校准仪器、飞行员考试名册、校正海图、船舵副本、卡拉维尔检查报告、补给表、试航日志和捕获的海图包。稍后的实施可以将其表达为当地海军训练、船舶准备或更快的探索事件。
    notes: >-
      源仪式是直接的，但定时模式更好地代表课程和试航季节。每月处理学习和修正； ending_war 很有用，因为图表和航道课程通常来自冲突。保持对射程和士气的永久奖励，而不是一般的贸易收入。
- id: 168
  key: unique_milan_arsenal
  base_key: giant_armory
  location: milano
  source_ritual_key: lombard_foundry_contract
  status: designed
  ritual_design_zh:
    title: Lombard 铸造合同
    mode: timed
    duration: >-
      定时模式应涵盖合同执行的六到十二个月。这几个月代表矿石和木炭承包、铸造模具准备、大炮铸造、装甲板成型、校样射击、行会工资结算、仓库标准化以及交付给公爵或国家军队。这个仪式不是游行，而是游行。在这个赛季中，米兰证明其兵工厂可以将城市工业转化为可靠的现场信心和生产纪律。
    listeners:
    - monthly
    - pre_winning_war
    historical_flavor: >-
      伦巴第铸造合同属于米兰兵工厂，因为文艺复兴时期米兰的军事声誉依赖于密集的城市工艺、金属加工、军械师、大炮铸造、公爵管理和合同执行。与托莱多以刀片为中心的打样不同，这个仪式是关于工业协调的：铸造枪支、安装板、标准化交付，以及让船长相信军械库和车间可以保证军队的供应。参与者包括公爵或皇家军事专员、行会大师、大炮制造者、模具制造商、军械匠、钟金属专家、木炭和铁供应商、会计师、仓库守卫、炮兵军官、骑兵队长、步兵中士以及负责工资和交货日期的城市治安官。这些地方包括铸造厂、装甲车间、钻场、火药库、称重室、合同室、河流或公路仓库以及接受的零件被标记为可供使用的军火库大门。这些物品包括粘土模具、青铜或铁锭、铸造坑、镗孔工具、板模板、铆钉、校样弹、射击台、盔甲架、公爵印章、行会工资簿、交货标签和废弃铸件。
      land_morale_modifier 被保留，因为当火炮和装甲达到标准时，部队的战斗力会更好。 global_production_efficiency之所以被保留，是因为兵工厂仪式教导供应商、行会、铸造厂、仓库和军队专员根据共享账本而不是临时订单进行工作。
    confirmation_logic: >-
      赞助商必须拥有或控制米兰，最后的米兰阿森纳奇迹建筑必须存在，国家不能破产，兵工厂和铸造厂区不能被占领、敌对围困或严重骚乱。该国应该能够获得金属、木炭或燃料、粉末、熟练工匠和军队需求管道。如果可用，确认应检查土地士气、生产效率、金库、军事物资供应、工匠/市民满意度、腐败或采购欺诈、战争状态、当地破坏、道路或河流通道以及弹药库安全。如果米兰安全，战争可以与合同共存，但金属供应封锁、行会拖欠工资、粉末短缺或铸造厂不安全应该会阻碍启动。
    start_logic: >-
      起始效果记录了赞助国米兰作为仪式场地、最终的兵工厂建设、活跃的军队采购背景以及铸造合同周期。它反映了国家基线：土地士气、全球生产效率、国库/收入、军事物资供应、大炮或围攻能力（如果有）、军队需求、战争状态、人力压力、工匠/市民满意度以及腐败或采购摩擦。它快照了当地的基线：占领、围困、动乱、破坏、繁荣、军火库状况、铸造安全、金属通道、燃料通道、火药库状况、行会合作、仓库容量、道路/河流运输通道和钻场安全。它初始化合同密封、供应商名册、模具准备、熔炉点火、大炮铸造、膛检查、校样点火、装甲板成型、线束安装、火药库审计、仓库标签、送货车、工资结算和现场信心报告等计数器。临时负担包括金属预付款、燃料、打样的粉末费用、行会工资、检查员、警卫、马车租金以及报废有缺陷铸件的费用。
    progress_logic: >-
      每月的进度是伦巴第工业学习遵守军事合同。委员们将供应商召集到合同室，并将金属、木炭和粉末的交付情况与密封账本进行匹配。在检验人员检查缺陷之前，创始人准备粘土模具、火炉、浇注大炮金属、钻孔桶和冷却铸件。炮兵军官进行射击射击并记录后坐力、爆炸风险和射击效果。制甲师将钢板切割成模板、铆钉束带、测试头盔和胸甲的合身性，并标记可接受的骑兵或步兵套件。会计师结算行会工资；仓库警卫按批次对货物进行标记；马车管理员指定前往集合地点的路线。当铸造厂安全、材料到达、工资支付、火药库安全、陆军专员可以检查交付情况时，进展就会取得进展。它因破产、占领、围困、严重骚乱、铸造厂火灾、熔炉事故、粉末爆炸、金属短缺、燃料短缺、工资罢工、采购欺诈、道路破损或杂志不安全而暂停。它以高生产效率、繁荣的米兰、满意的工匠、低腐败、活跃的军队需求、强大的财政和经验丰富的炮兵军官来加速。
      pre_winning_war 监听器代表战地信心：如果米兰的枪支或装甲似乎支持一场接近成功的战役，那么战地报告计数器就会前进，因为兵工厂的合同已在压力下得到证明。
    completion_logic: >-
      完成需要合同密封、供应商、模具、熔炉、铸造、膛、校样、装甲成型、装配、弹匣、仓库、交付、工资和战地信心计数器完成。米兰必须保持控制，最后的兵工厂必须存在，国家不能破产，铸造厂和杂志必须安全。最后的场景发生在兵工厂门口和校样场。用经过检查的装药发射一门大炮，为选定的部队安装装甲带，有缺陷的金属被显示为不合格的废料，委员们在接受的批次上盖上军械库和合同标记。行会师傅在工资簿上签字；军需官收到标记的大炮、装甲和备件；船长会签交付卷。这一奇迹变成了国家能力，因为米兰已将工艺技能转化为可靠的工业合同，既提高了士兵的信心，又提高了国家更广泛的生产程序。
    failure_or_timeout_logic: >-
      仪式可以暂停，但如果储存的金属、粉末或盔甲在没有检查的情况下放置太久，铸造和交付计数器就会腐烂。如果赞助商失去米兰、最后的武器库消失、国家仍然破产、铸造厂被占领或毁坏、或者合同账簿被揭露为欺诈，那么它就会失败或取消。严重骚乱、粉末爆炸、铸造厂火灾、材料短缺、行会罢工、拖欠工资、道路封闭或敌对围攻都会暂停进度，并可能重置铸造、试制、仓库或交货柜台。
      pre_winning_war如果军队无法获得米兰装备，则应忽略进度。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对米兰的控制、最终独特的军火库建筑存在、没有破产、没有重复的活动仪式、没有占领或敌对围困、可控的骚乱、安全的铸造厂、金属/燃料/粉末通道、合作行会、完整的弹匣、可用的仓库和交付路线以及军队采购需求。添加对土地士气、生产效率、财务、工匠满意度、腐败、战争状态、破坏和道路/河流通道的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和米兰、商店采购和战争背景、应用临时铸造负担、初始化合同密封计数器、供应商名册、模具准备、熔炉点火、大炮铸造、膛检查、校样、装甲成型、装配、杂志审计、仓库标签、送货车、工资结算、
      snapshot_effect_script: >-
        刷新土地士气、生产效率、金库、军用物资、火炮/攻城能力、军队需求、战争状态、人力压力、工匠/市民满意度、腐败/采购摩擦、米兰占领、围困、动乱、破坏、繁荣、军火库状况、铸造安全、金属访问、燃料访问、弹匣状况、行会合作、仓库容量、交付访问、钻场安全和最终建筑存在。
      progress_effect_script: >-
        关于每月报价、预付合同、供应、模具、熔炉、铸造、钻孔、防火、装甲、装配、杂志、仓库、交货和工资柜台。由于破产、占领、围困、严重骚乱、铸造厂火灾、粉末事故、金属/燃料短缺、工资罢工、欺诈、不安全杂志或路线阻塞而暂停或衰退。在pre_winning_war上，只有当米兰装备合理地支持战役时，才能提高野战信心。
      completion_trigger_script: >-
        要求完成军械库计数器或总体进度，米兰控制，最终建筑存在，没有破产，没有占领或不安全的围困，可控的骚乱，安全弹匣，成功的证明射击，接受的装甲批次，支付的行会，标记的仓库库存，准备好的运输车，以及由和平时期演习完成或取代的野战信心审查。
      completion_effect_script: >-
        消除临时铸造厂负担，应用永久国家修正，保持土地士气和生产效率，授予一次性军队士气、炮兵/军队传统、生产、军事物品或工匠满意度奖励，添加米兰阿森纳合同记忆，清除瞬态计数器，并保留完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留land_morale_modifier和global_production_efficiency。士气来自于久经考验的大炮、合适的装甲和可靠的投送；生产效率来自共享合同账本、批次标签、供应商名册、工资结算、标准化车间。
      one_time_reward: >-
        授予一次性的军队士气、炮兵或军队传统、军事物资、生产进度、有效承包带来的国库节省或工匠满意度。如果pre_winning_war有所贡献，则扩大一部分以增强对经过战役测试的设备的信心。
      local_building_reward: >-
        米兰应该记住密封的铸造合同、模具模型、防火记录、拒绝的铸件、装甲模板、杂志审计、仓库标签、行会工资簿和交货单。稍后的实施可以将其表达为本地铸造厂吞吐量、更便宜的军用商品或设备损失后更快的恢复。
    notes: >-
      源仪式是即时的，但定时模式更好地代表合同履行和工业打样。每月是主要听众；保留 pre_winning_war 仅用于验证字段置信度。与托莱多不同的是：米兰是关于铸造厂、盔甲、大炮、合同和生产效率，而不是著名的刀片威望。
- id: 169
  key: unique_university_of_bologna
  base_key: university_city
  location: bologna
  source_ritual_key: doctorate_convocation
  status: designed
  ritual_design_zh:
    title: 国家博士会议
    mode: timed
    duration: >-
      定时模式应运行一个学年。每月十二个刻度代表注册学生国家、安排讲座、复制法律文本、举行辩论、审查候选人、公证学位、确认学者特权以及将毕业生安置到法院、总理府和公民办公室。研究速度和流行推广得到提高，因为知识被认证为职业。
    listeners:
    - monthly
    historical_flavor: >-
      博士学位会议属于博洛尼亚大学，因为博洛尼亚是一座法学家、来自许多国家的学生、拱廊街道、演讲室、稿台、公证人和学术特权公民谈判的城市。参与者包括民法和教会法博士、学生校长、学生社团、公证人、抄写员、书商、地方法官、主教代表、法官、外国学者、地主、执事以及希望将学习转化为公职的候选人。这些地方包括演讲厅、租用的学校、拱廊图书街、用于仪式的教堂、公证长凳、学生宿舍、市议会会议室以及宣布博士学位的公共大厅。这些物品包括带有注释的法律手稿、讲义、印章、入学名册、试题、辩论论文、学位章程、学者特权文件、租赁协议和法院任命书。
      research_speed 的兴起是因为争议、注释和复制文本使法律和行政更加系统化。 global_pop_promotion_speed_modifier之所以上升，是因为学位、公证培训和法律素养为有能力的人成为职员、法官、顾问、官员和城市专业人士创造了途径。
    confirmation_logic: >-
      赞助商必须拥有或控制博洛尼亚，最终的大学奇迹建筑必须存在，国家不能破产，大学区不能被占领、遭到敌对围困或严重动乱。这座城市必须能够保护学者、维持演讲空间并允许公证人颁发认可的学位。如果实施能够检测到研究速度、流行推广、识字率、神职人员/市民满意度、地方繁荣、学者能力、稳定性、腐败、审查压力、学生骚乱和外国准入，那么这些应该会形成确认。只有当战争对学生关闭道路、威胁演讲厅或暂停学位承认所需的民事法庭时，战争才应封锁。
    start_logic: >-
      开始效果记录了赞助国、作为仪式地点的博洛尼亚、最终的大学建筑、活跃学年、参与院系或国家以及公民特权背景。它快照了国家基线：research_speed、global_pop_promotion_speed_modifier、识字率或教育（如果有）、顾问/学者能力、神职人员/市民满意度、财政/收入、稳定性、腐败、法院/衡平法院需求和战争状态。它记录了当地的基线：占领、围困、动乱、破坏、繁荣、演讲厅的通行、手稿供应、公证可用性、学生住房、教师合作、城市特权执行、道路安全和外国学生的通行。它初始化注册、国家登记、讲座时间表、手稿复印、争议记录、考试委员会、公证印章、学位章程、特权确认、毕业生安置、租金纠纷解决和最终召集等柜台。临时负担包括教授津贴、手稿复印、蜡和羊皮纸、公证费、警卫费、住宿纠纷、仪式费用以及公民对学生特权的让步。
    progress_logic: >-
      每月的进步是经过认证的知识的形成。学生校长提交国家名单；执事宣布上课时间；医生阅读民法和教会法文本，而抄写员则为买不起整本书的学生准备带有注释的摘录。候选人辩论争论，回答异议，并学习法院、合同、继承和特权的公式。公证员起草检查记录并测试姓名、见证人和印章是否有效。市治安法官审理有关租金、学生逮捕和城镇礼服暴力等方面的纠纷，以便大学能够得到保护而不会变得无法无天。教堂或礼堂专为博士典礼保留；法官和总理官员挑选毕业生来服务。当博洛尼亚安全、教师有工资、学生可以到校、有书籍和公证、公民特权得到执行时，进步就会取得进展。它因破产、占领、围困、严重骚乱、学生骚乱、教授罢工、手稿短缺、瘟疫般的关闭、伪造学位、公证丑闻、审查危机或道路封闭而暂停。它随着高识字率、强大的学者能力、繁荣的图书贸易、满意的市民和神职人员、低腐败、外国学生流入以及对训练有素的官员的需求而加速。每个月的勾选应代表一次讲座、稿件批次、国家卷、争议、考试、公证印章、特权听证会或安置审查。
    completion_logic: >-
      完成需要完成入学、国家、讲座、稿件、争议、考试、公证、学位、特权、安置、争议和最终会议计数器。博洛尼亚必须保持控制，最终的大学建筑必须存在，国家不能破产，公共秩序必须允许举行学位典礼。最后一幕是博士毕业典礼。学生国家按顺序入场；医生介绍候选人；公证员阅读检查记录；地方法官确认特权；候选人在收到书、戒指、帽子或密封章程之前对最后一个问题进行答辩；毕业生被列入法院、学校和总理府的名单。这一奇迹变成了国家能力，因为博洛尼亚将研究变成了公认的办公室：研究进展得更快，从受过教育的学科晋升为管理人员或专业人士在制度上变得可信。
    failure_or_timeout_logic: >-
      仪式可以暂停，但如果一个学年因为学生分散、讲义失去连续性、考试委员会必须重新组建而崩溃，那么进步就会衰退。如果赞助商失去博洛尼亚，最后的大学建筑消失，国家仍然破产，季度被占领或被洗劫，或者学位证书因公民崩溃而失去认可，那么它就会失败或取消。严重骚乱、城镇礼服暴力、伪造学位、教授罢工、审查制度清洗、公证人腐败、手稿火灾、道路封闭或瘟疫般的封闭应该暂停进度，并可能重置讲座、考试或学位计数器。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对博洛尼亚的控制、最终独特的大学建筑存在、没有破产、没有重复的活动仪式、没有占领或严重骚乱、受保护的演讲空间、可用的教授、公证人、书籍和学生访问权限，并得到认可公民特权。添加对研究速度、晋升速度、读写能力、学者能力、神职人员/市民满意度、繁荣、腐败、学生骚乱以及道路/外国人通道的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和博洛尼亚，存储学年、教师或国家背景和特权背景，应用临时学术负担，初始化入学计数器、国家登记、讲座时间表、手稿复印、争议记录、考试委员会、公证印章、学位章程、特权确认、毕业生安置、租金纠纷解决和最终召集，并记录国家/地方基线。
      snapshot_effect_script: >-
        刷新研究速度、流行推广速度、识字/教育、顾问或学者能力，神职人员/市民满意度、财政、稳定、腐败、法院需求、战争状态、博洛尼亚占领、围困、动乱、破坏、繁荣、讲座访问、手稿供应、公证可用性、学生住房、教师合作、特权执行、道路安全、外国学生访问和最终建筑存在。
      progress_effect_script: >-
        每月报价、先进国家卷、讲座、复制注释、辩论、考试、公证记录、学位章程、特权听证会、租金争议解决、毕业生安置和毕业典礼准备。由于破产、占领、围困、骚乱、学生骚乱、教授罢工、手稿短缺、关闭、伪造学位、公证丑闻、审查危机或道路封闭而暂停或衰退。加速扫盲、学者、图书贸易、低腐败、外国学生和行政需求。
      completion_trigger_script: >-
        要求完成学术指标或总体进展，博洛尼亚控制，最终大学存在，没有破产，没有占领，可控的骚乱，活跃的教授和公证人，完成的讲座和辩论，有效的考试记录，密封的学位章程，确认的特权，以及最终的集会准备。
      completion_effect_script: >-
        消除临时学术负担，应用永久国家修正来保护研究速度和流行升级速度，授予一次性研究，顾问/学者能力，法院的合法性，市民或神职人员满意度，当地繁荣或声望奖励，添加博洛尼亚大学站点内存，清除瞬态计数器，并保留完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留research_speed和global_pop_promotion_speed_modifier。研究速度来自讲座、注释、争论、稿件流通；晋升速度来自于认可的学位、公证素养、法律培训以及法院和总理府的安置。
      one_time_reward: 授予一次性研究进展、顾问或学者招聘、法律合法性、市民/神职人员满意度、当地繁荣或集会的声望。通过干净的学位记录和成功的外国学生参与来进行规模奖励。
      local_building_reward: >-
        博洛尼亚应该记住入学名册、学生国书、讲座时间表、注释手稿、争议记录、考试记录、公证印章、学位章程、特权确认书、租金结算和毕业生安置清单。稍后的实施可以将其表达为当地奖学金、顾问质量或减少行政摩擦。
    notes: >-
      源仪式是立即的，但定时模式适合学年。每月一次是正确的听众，因为其机制是讲座、考试和资格认证，而不是战争或继承。保留研究速度和流行推广的永久奖励；法律传统是历史载体，而不是单独的替代修饰语。
- id: 170
  key: unique_carrara_marble_quarries
  base_key: mining_city
  location: prato
  source_ritual_key: marble_contract
  status: designed
  ritual_design_zh:
    title: 山地切割机的大理石合同
    mode: timed
    duration: >-
      定时模式应在一个采石和交付季节运行。每月十二个刻度代表签署采石场合同、标记开采面、切割楔形孔、降低石块、修复山路、分配牛雪橇、匹配雕刻家和建筑商订单以及交付经过检查的大理石。建筑成本的降低和生产效率来自于可靠的材料物流，而不是单一的仪式祝福。
    listeners:
    - monthly
    historical_flavor: >-
      大理石合同属于卡拉拉采石场，因为只有当山区劳动力、运输、合同、泥瓦匠、雕塑家和建筑办公室协调一致时，白色大理石才能成为国家产能。尽管实施的设计地点是普拉托，但仪式应该代表对卡拉拉供应路线进入托斯卡纳城市经济的控制。参与者包括采石场师傅、开山工人、楔子工作人员、牛队司机、道路管理员、起重机操作员、泥瓦匠、雕塑家、城市建筑官员、商人、公证人、警卫以及为教堂、宫殿、市政厅和雕像预留街区的赞助人。这些地方包括采石场、切割台、块料场、雪橇道、河流或公路仓库、称重站、雕刻师工作室、建筑场和合同室，其中块标记成为可执行的承诺。这些物品包括铁楔、凿子、绳索、雪橇、牛轭、采石场标记、区块编号、订单簿、起重机、测量杆、样品芯片、交货封条、事故卷和雕刻模板。
      global_build_buildings_efficiency 下降是因为标准化区块、已知路线和签名交付可以防止浪费。 global_production_efficiency 之所以上升，是因为采石场系统教授开采、分级、运输和车间调度。
    confirmation_logic: >-
      赞助商必须拥有或控制普拉托，最终的卡拉拉大理石采石场奇迹建筑必须存在，国家不能破产，采石场路线、仓库和车间不得被占领、堵塞或严重动乱。该国应该能够获得采石场劳动力、运输动物、工具、道路和工匠需求。如果实施可以检测建筑成本修正、生产效率、当地繁荣、采矿产量、工匠/市民满意度、基础设施状况、破坏、劳动安全、合同腐败和道路安全，那么这些应该形成确认。战争只有在关闭山路或征用无法使用的动物和劳动力时才会封锁。
    start_logic: >-
      开始效果记录了赞助国、作为仪式地点的普拉托、最终的采石场建筑、卡拉拉供应路线、活跃的建筑需求和大理石合同周期。它快照了国家基线：global_build_buildings_efficiency、global_production_efficiency、国库/收入、建筑能力、工匠需求、市民或行会满意度、稳定性、腐败、基础设施投资和战争状态。它反映了当地的基线：占领、动乱、破坏、繁荣、采石场通道、道路安全、仓库库存、工具供应、运输动物、劳动力可用性、车间产能、事故风险和合同执行。它初始化了合同公证、采石面测量、楔形孔切割、块分离、块标记、雪橇道路维修、牛队名册、起重机检查、称重站审核、雕刻师订单匹配、建筑场交付、事故赔偿和最终大理石验收等柜台。临时负担包括工资、铁工具、绳索、雪橇、牛饲料、道路维修、起重机、警卫、公证人和危险山地工作的补偿。
    progress_logic: >-
      每月的进展就是将这座山变成可预测的材料。测量员标记安全采石面；刀具钻或凿楔形孔；工头跟踪哪些块可以在不破碎的情况下分离；绳索人员和牛队将块体降低到院子里。公证人将区块号码复制到合同中，然后商人或顾客才能认领它们。道路管理员清理雪橇道、修复桥梁并标记危险转弯。起重机操作员检查仓库的绳索和提升点。称重人员将块大小与订单进行比较；雕刻师检查样品碎片的颜色和缺陷；建筑商为柱子、饰面或铺路保留常规尺寸。当采石场劳动力得到报酬、道路安全、普拉托受到控制、车间有需求、仓库可以储存石头时，进步就会取得进展。它因破产、占领、严重骚乱、道路塌陷、采石场事故、工具短缺、牛队损失、合同欺诈、土匪、天气关闭、工人罢工或区块标记腐败而暂停。强劲的建筑需求、良好的道路、繁荣的车间、低腐败、熟练的切割工、可用的动物和廉洁的合同执行，它会加速发展。每个月的勾选都应该是一个有形的行为：测量一个面、切割一块、标记一块石头、修复一条道路、检查一台起重机、解决事故索赔或交付订单。
    completion_logic: >-
      完成需要完成合同、测量、楔入、分离、标记、道路、牛、起重机、称重、雕刻师、交付、事故和最终验收计数器。普拉托必须保持受控，最后的采石场建筑必须存在，国家不能破产，至少一批经过检查的货物必须到达车间或建筑场地。最后的场景发生在区块堆场。采石场大师展示标记的块；公证人阅读合同；道路管理员报告已清理的路线；牛夫们出示送货记录；雕刻家和泥瓦匠敲击样品碎片并接受或拒绝块；建筑官员为未来的项目确定了标准尺寸。这一奇迹已成为国家能力，因为卡拉拉的大理石不再是靠即兴创作而获得的昂贵稀有物；而是成为了国家的财富。它是一条合同供应链，教会国家如何廉价建设和高效生产。
    failure_or_timeout_logic: >-
      这种仪式可以暂停，但如果街区无人认领、道路维修失效或合同标记出现争议，进展就会减弱。如果赞助商失去了普拉托、最后一座采石场建筑消失、国家仍然破产、采石场路线被占用或永久封锁、或者合同办公室失去法律权力，那么项目就会失败或取消。严重骚乱、山体滑坡、重大事故、道路塌陷、动物损失、伪造的方块标记、劳工起义、土匪控制或战争征用运输应暂停进度，并可能重置道路、交付或合同计数器。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对普拉托的控制，最终独特的采石场建筑存在，无破产，无重复的活动仪式，无占领，路线阻塞或严重骚乱，可用的采石场通道，道路，工具，劳动力，运输动物，仓库和工匠/建筑需求。添加对建筑成本、生产效率、繁荣、采矿产量、行会满意度、基础设施、破坏、腐败、事故风险和战争破坏的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和普拉托，存储卡拉拉路线和建筑需求背景，应用临时采石和运输负担，初始化合同公证计数器，采石场测量，楔形孔切割，块分离，标记，道路维修，牛队名册，起重机检查，称重审核，雕刻师订单匹配，建筑场交付，事故赔偿和最终大理石验收，并记录国家/当地基线。
      snapshot_effect_script: >-
        刷新建筑成本修改器，生产效率，金库、建筑能力、工匠需求、行会/市民满意度、稳定性、腐败、基础设施投资、战争状态、普拉托占领、动乱、破坏、繁荣、采石场通道、道路安全、仓库库存、工具供应、运输动物、劳动力可用性、车间容量、事故风险、合同执行和最终建筑存在。
      progress_effect_script: >-
        按月进行，提前采石场面调查、楔形切割、块分离、块标记、雪橇道路修复，牛队分配、起重机检查、称重站审核、样品检验、订单匹配、交货和事故解决。由于破产、占领、动乱、道路塌陷、采石场事故、工具短缺、牛队损失、欺诈、土匪、天气原因、罢工或损坏的标记而暂停或衰退。加速满足需求、道路、车间、低腐败、熟练劳动力和运输能力。
      completion_trigger_script: >-
        要求完成采石场或总体进度、普拉托控制、最终建筑存在、无破产、无占用路线、可用道路、标记区块、检查起重机、指定运输、有效合同、已接受的雕塑家或建筑商订单以及至少收到一份交付。
      completion_effect_script: >-
        消除临时采石场负担，应用永久国家修正，保持降低的建筑成本和生产效率、授予一次性施工进度、国库储蓄、工匠满意度、当地繁荣或文化声望奖励、添加卡拉拉路线站点内存、清除瞬态计数器并保留完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留global_build_buildings_efficiency和global_production_efficiency。更便宜的建筑来自标准区块、可靠的交付和更少的失败订单；生产效率来自采石场调度、标记材料、运输物流和车间协调。
      one_time_reward: 授予一次性施工进度、国库节约、当地繁荣、工匠满意度、文化声望或降低基础设施成本。通过成功交付和干净的合同来衡量奖励。
      local_building_reward: >-
        普拉托应该记住采石场合同、面调查、块标记、楔线、雪橇道路维修、牛队名册、起重机检查、称重审核、雕刻师订单、交付封条和事故赔偿卷。稍后的实施可以将其表达为当地采矿产量、建设速度或工匠吸引力。
    notes: >-
      源仪式是即时的，但定时模式适合采石和交付季节。 Monthly 是正确的听众，因为材料的开采和运输是重复发生的。保持建筑成本和生产效率的永久奖励；艺术声望应该仍然是次要的、一次性的影响。
- id: 171
  key: unique_east_india_company
  base_key: colonial_trade_company
  location: london
  source_ritual_key: east_india_company_rite
  status: designed
  ritual_design_zh:
    title: 东印度公司宪章印章
    mode: timed
    duration: >-
      定时模式应运行一个宪章和认购年。十二个月的刻度代表签署皇家特许状、开放股票认购、任命董事和代理人、授权武装航行、审计泰晤士仓库、登记货物、安排海军保护以及协调海外特权。只有当投资、船舶、仓库和海外机构成为可执行的公司惯例时，贸易收入和贸易公司付款才会改善。
    listeners:
    - monthly
    - ending_war
    historical_flavor: >-
      宪章印章属于东印度公司，因为它的权力是王权、私人资本、海上暴力、海外外交和账本纪律的合并。参与者包括王室官员、公司董事、股东、职员、代理人、仓库管理员、武装船长、水手、保险公司、海关官员、律师、泰晤士河驳船商、香料和纺织品经纪人、海外使节以及必须记录其付款和特权的臣民或特许当局。这些地方包括租船大厅、会计室、董事室、泰晤士河畔的强化仓库、海关码头、造船厂、保险柜台、地图室和海外信函室。这些物品包括包机印章、股票认购簿、股票、货物清单、仓库钥匙、汇票、香料包、纺织品样品、大炮许可证、要素佣金、条约副本、海关收据和车队订单。
      trade_income 上升是因为公司标准化了投资、货运和转售。 subject_pays_trade_company_cost_modifier之所以被保留，是因为特许臣民、贸易公司或海外属地会增加堡垒、工厂、要素、护送和特权的企业成本。
    confirmation_logic: >-
      赞助商必须拥有或控制伦敦，东印度公司最后的奇迹建筑必须存在，国家不能破产，公司办公室、泰晤士仓库和港口航线不得被占领、封锁、烧毁或严重动乱。海外贸易必须是可能的：赞助商应该拥有港口通道、船舶、水手、贸易范围，以及至少潜在的主体或海外商业关系。如果实施可以检测贸易收入、贸易公司付款、商人满意度、海军范围、水手、外交声誉、臣民忠诚度、腐败、海盗/私掠压力、战争状态和封锁，那么这些应该会形成确认。如果伦敦和海上航线正常运转，战争可能会继续，但全面封锁、公司破产或非法租船纠纷应该会阻止这一仪式。
    start_logic: >-
      起始效果记录了赞助国、作为仪式地点的伦敦、最终的公司建筑、活跃的海外贸易环境、相关主题或特许贸易公司实体（如果有）以及特许印章周期。它快照国家基线：trade_income、subject_pays_trade_company_cost_modifier、财政/收入、商人满意度、海军范围、水手、舰队战备状态、外交声誉、臣民忠诚度、腐败、海盗压力、战争状态以及当前贸易公司价值（如果有）。它反映了当地的基线：占领、封锁、动乱、破坏、繁荣、港口通道、仓库状况、会计室安全、租船办公室功能、造船厂通道、海关能力、投资者信心和货物库存。它初始化用于包机密封、董事选举、认购簿、股东收据、因素佣金、仓库密钥审计、货物舱单、武装航行许可证、护航/护航计划、保险和汇票登记、主题付款计划、海外条约或特权登记以及最终包机公告的柜台。临时负担包括职员工资、律师费、海军护航、仓库维修、给使节的礼物、保险押金、船舶预付款以及审计期间延迟的股息。
    progress_logic: >-
      每月的进步是公司学习如何让帝国在账目上清晰可见。皇家律师阅读租船条款并确认垄断权或航行许可证。董事记录认购情况、出具收据并解决投资者之间的纠纷。职员将要素分配给海外工厂，复制指令，并登记每个要素可以使用的权限。仓库管理员清点香料、纺织品、金条、武器、包装材料和钥匙；海关官员将舱单与关税进行比较；保险公司和票据经纪人的价格风险；船长提交船员名单、大炮许可证和护航需求。如果存在臣民或贸易公司家属，他们的预期付款将被输入为工厂维护费、堡垒维护费、护送费或特权费，而不是模糊的贡品。当伦敦安全、港口开放、投资者付款、船舶可用、海外信件到达时，进展就会取得进展。它因破产、占领、封锁、严重骚乱、仓库火灾、股东恐慌、腐败丑闻、盗版灾难、缺失因素、主体拒绝付款、外交破裂或包机诉讼而暂停。它以高商人满意度、强大海军、有利可图的贸易、忠诚的臣民、干净的账目和良好的外交声誉而加速发展。
      ending_war监听器将结算结果折叠到宪章中：占领的工厂、恢复的海道、赔偿、条约特权或失去的堡垒必须更新海外特权和支付柜台。
    completion_logic: >-
      完成需要完成包机、董事、认购、股东、保理、仓库、舱单、航行许可证、护航、保险/付款、标的表、海外特权和最终公告柜台。伦敦必须保持控制，最终的公司大楼必须存在，国家不能破产，泰晤士河港口不能被封锁。最后的场景发生在特许厅和会计室。董事将密封的章程放在桌子上；订阅者的书籍被阅读；保理商收取佣金；仓库钥匙交给管理员；船长获得武装航行许可证；海关职员封印舱单；主题或公司付款计划已会签；海外使节或信件确认特权。这一奇迹变成了国家能力，因为私人资本、王室权威、海上力量和主体付款现在都通过可重复的企业机器运行，从而扩大了贸易收入。
    failure_or_timeout_logic: >-
      仪式可以暂停，但如果由于订阅、保险和货运合同到期而导致交易季节没有航行，那么进展就会减弱。如果赞助商失去伦敦，最后的公司大楼消失，国家仍然破产，公司办公室被烧毁，泰晤士河在整个赛季被封锁，或者章程被合法撤销，那么比赛就会失败或取消。严重的骚乱、投资者崩溃、仓库扣押、车队灾难、盗版统治、因素叛变、拒绝付款、腐败丑闻、伪造股票或条约失败都应该暂停进展，并可能重置订阅、航行或海外特权计数器。
      ending_war 达成不良和解后，应在奖励之前强制进行修订的租船审核。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对伦敦的控制、最终独特的公司建筑存在、无破产、无重复的活动仪式、无占领、封锁、火灾危机或严重骚乱、可用的港口和仓库、合法的租船机构、船舶/水手、投资者或商人支持以及海外贸易或主题公司背景。添加贸易收入、主题付款修正、海军影响力、外交声誉、主题忠诚度、腐败、海盗和战争干扰的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和伦敦，存储海外贸易、主题和战争背景，应用临时公司管理负担，初始化包机密封计数器，董事选举，订阅簿，股东收据，要素佣金，仓库密钥审计，货物清单，武装航行许可证，护航计划，保险/账单，主题付款计划，海外特权登记册和最终公告，以及记录国家/地方基线。
      snapshot_effect_script: >-
        刷新贸易收入、主题贸易公司付款修正、财务、商人满意度、海军范围、水手、舰队战备状态、外交声誉、主题忠诚度、腐败、海盗压力、战争状态、贸易公司价值、伦敦占领、封锁、骚乱、破坏、繁荣、港口访问、仓库状况、会计室安全、租船办公室、造船厂、海关能力、投资者信心、货物库存和最终建筑存在。
      progress_effect_script: >-
        每月报价、预付租船条款、董事记录、认购、股份收据、要素指令、仓库库存、舱单、海关检查、武装航行许可证、护航计划、保险和账单、主题付款计划和海外特权记录。由于破产、占领、封锁、动乱、火灾、投资者恐慌、腐败、盗版、缺失因素、主体拒绝、外交破裂或包机诉讼而暂停或衰退。在
        ending_war 上，更新被占领/丢失的工厂、航道条款、赔偿和条约特权。
      completion_trigger_script: >-
        要求完成公司柜台或总体进度、伦敦控制、最终建筑存在、无破产、无封锁、法定租船有效、认购已结算、指定因素、仓库锁定、舱单密封、武装航行许可、主题付款时间表记录、海外特权验证和最终公告准备就绪。
      completion_effect_script: >-
        消除临时公司负担，应用永久国家修正，保留贸易收入和附属贸易公司付款价值，授予一次性财政/贸易、商人影响力、海军商业影响力、外交声誉或附属付款奖励，添加东印度公司站点内存，清除瞬态计数器，并保留完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留trade_income和subject_pays_trade_company_cost_modifier。贸易收入来自订阅、货物清单、仓库、要素和受保护的航程。主题支付修正来自于让海外属地或特许贸易实体通过记录的时间表为工厂、护航、堡垒和特权提供资金。
      one_time_reward: >-
        授予一次性国库、贸易收入、商人满意度、海军影响力、外交声誉、主题支付或减少海盗风险。如果ending_war做出了贡献，则围绕条约特权、恢复海上航线或被捕获/丢失的公司资产进行奖励。
      local_building_reward: >-
        伦敦应该记住租船印章、订阅簿、董事会议记录、要素佣金、仓库钥匙、货物清单、武装航行许可证、保险分类账、汇票、主题付款时间表和条约特权登记册。稍后的实施可以将其表达为当地贸易力量、商人影响力或公司主题管理。
    notes: >-
      源仪式是即时的，但定时模式适合包机、订阅和航季。每月处理公司文书工作和货物；保留 ending_war 是因为条约特权和海外资产通常决定公司价值。保留贸易收入和贸易公司付款的永久奖励，而不是一般的海军征服。
- id: 172
  key: unique_peacock_throne
  base_key: palace_of_nations
  location: delhi
  source_ritual_key: peacock_throne_rite
  status: designed
  ritual_design_zh:
    title: Peacock Throne Darbar of Jewels
    mode: timed
    duration: >-
      定时模式应涵盖 6 至 12 个月的 darbar 准备和法庭认证。这几个月代表着珠宝库存、王座大厅安全、特使调度、长袍和头衔准备、进贡会计、曼萨布或等级确认、卫兵排练以及最后的公众接见。只有当宫廷反复证明它能够围绕统治者组织等级制度、朝贡和外国承认时，宝石王座才会产生每月的合法性和外交声誉。
    listeners:
    - monthly
    - ruler_death
    historical_flavor: >-
      珠宝孔雀王座 Darbar 属于德里，因为莫卧儿王座是帝国秩序的集中展示。黄金、宝石、孔雀造型、大理石大厅、地毯、屏风、卫兵、使节、贵族、贡品携带者、文士和长袍官员使主权可见，就像一个排列在皇帝面前的世界一样。参与者包括统治者或公认的继承人、维齐尔和宫廷秘书、司库、珠宝保管人、太监或宫廷侍从（如果适用）、曼萨卜达尔和显贵、省代表、外国使节、进贡者、传令官、礼服官员、卫兵、音乐家、画家或记录员，以及将礼物和头衔记入登记册的抄写员。分别为觐殿、宝台、库房、宝库门、衣库、候使室、侍卫院、宫门、尚书房等。这些物品包括镶满宝石的宝座、祖母绿和红宝石镶嵌物、皇家遮阳伞、地毯、长袍束、头衔专利、贡品托盘、外交信件、印章盒、座位表、军衔徽章和礼品账簿。
      monthly_legitimacy 被保留，因为王座将统治变成了连续可见的等级制度。 diplomatic_reputation之所以被保留，是因为使节和省份精英看到了一个有序的法庭，可以接受贡品，授予荣誉，并记住承诺。
    confirmation_logic: >-
      赞助者必须拥有或控制德里，最后的孔雀王座奇迹建筑必须存在，国家不能破产，宫殿和金库不能被占领，受到敌对围困，或遭受严重动乱。该国必须有一位公认的统治者或摄政王能够担任达尔巴尔；在继承过程中，最终的观众要等待继承人的认可。如果有的话，确认应检查每月的合法性、外交声誉、合法性、威望、法庭支出能力、国库、腐败、贵族满意度、封臣或臣民忠诚度、活跃使节、对德里的战争威胁、王权状况和继承危机。战争不会自动阻止准备工作，但逃亡、夺取珠宝、无薪警卫或使节出入被破坏应该会阻止开始。
    start_logic: >-
      起始效果记录了赞助国、作为仪式地点的德里、最终的王座建筑、统治者或摄政背景以及活跃的达尔巴周期。它快照了国家基线：每月合法性、外交声誉、合法性、威望、国库/收入、法庭支出压力、腐败、贵族或精英满意度、臣民或封臣忠诚度、特使可用性、战争状态和继承风险。它反映了当地的情况：占领、围攻、动乱、破坏、繁荣、宫殿通道、金库安全、王座状况、珠宝库存、长袍储存准备情况、卫兵忠诚度、朝堂秩序、使节通道以及大法官容量。它初始化珠宝库存、宝座清洁和维修、国库印章、观众座位、贵族出席、特使日程、贡品登记、荣誉长袍准备、产权专利起草、守卫排练、先驱公告、画家/编年史记录和最终达尔巴等计数器。临时负担包括宫廷俸禄、侍卫、乐师、袍服、珠宝检验、使节住宿、大臣抄写、礼品处理，以及召唤显贵加入可见等级制度的政治成本。
    progress_logic: >-
      每月的进展是帝国展示成为可执行的命令。珠宝保管者打开密封的金库，将宝石和黄金镶嵌物与旧库存进行比较，并报告丢失的宝石。宫殿侍从清洁宝座平台、地毯和屏风。宫廷秘书会制定座位表，以便贵族、曼萨卜达尔、省代表和特使知道自己的位置。司库登记贡品托盘；长袍军官准备
      khil'at 或荣誉长袍；总理办公室抄写所有权专利草案并回复外交信件。卫兵排练宫门秩序；先驱者练习宣告；画家或编年史家记录了谁在王座前被看见。当德里安全、统治者或摄政得到承认、珠宝安全、守卫得到报酬、贵族出席、使节路线保持畅通时，就会取得进展。它因破产、占领、围困、严重动乱、金库盗窃、珠宝丑闻、宫廷逃亡、贵族抵制、特使侮辱、礼物账簿腐败或继承争议而暂停。它以高度的合法性、强大的威望、忠诚的贵族或臣民、健康的国库、低腐败、积极的外交接触和安全的宫殿道路而加速。
      ruler_death 听众是决定性的：周期变成了加冕礼。顺利的继承将珠宝、长袍和座位柜台转变为新的统治者；有争议的继承权冻结了最后的观众，直到法院同意谁可以坐在遮阳伞下。
    completion_logic: >-
      完成需要珠宝、王座、国库、座位、贵族出席、特使、贡品、长袍、头衔、守卫、传令官、记录和最终的达尔巴柜台。德里必须保持控制，最后的王座建筑必须存在，国家不能破产，统治者或公认的继任者必须能够接待观众。最后的场景是在观众厅举行正式的宴会。警卫按顺序打开大门；贵族有等级；使节带着书信和礼物进来；司库出示进贡账簿；珠宝保管者展示密封的王座；尺坐在阳伞下；长袍军官颁发荣誉；秘书宣读标题和回复；编年史家记录观众。如果发生继任，这将是继任者首次确认的公开会议。这一奇迹变成了国家能力，因为王位将珠宝和仪式变成了一种对精英进行排名、接受外国承认以及每月更新合法性的系统。
    failure_or_timeout_logic: >-
      仪式可以暂停，但如果朝廷未能开会太久，观众和特使计数器就会减少。如果赞助商失去德里、最后的王座建筑消失、国家仍然破产、宫殿被占领、国库被占领或王位/王权丢失，它就会失败或取消。严重的骚乱、贵族叛乱、珠宝盗窃、宫廷逃亡、使节暴力、卫兵叛变、腐败丑闻、臣民叛乱或有争议的继承权应该会暂停进度，并可能重置座位、贡品、长袍或最终的暗号柜台。当战争威胁到德里、阻止使节或迫使法庭隐藏王权时，战争就很重要了。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对德里的控制、最终独特的王座建筑存在、没有破产、没有重复的活动仪式、没有宫殿占领或敌对围攻、可控的骚乱、安全的国库和王权、公认的统治者/摄政、可用的法庭访问权、可用的警卫以及特使或精英访问权。添加对合法性、外交声誉、声望、宫廷开支、腐败、贵族满意度、臣民忠诚度、战争威胁和继承危机的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和德里，存储统治者/摄政背景，应用临时法庭展示负担，初始化珠宝库存计数器，王座修复，国库印章，观众座位，贵族出席，特使时间表，贡品登记，长袍准备，头衔专利，警卫排练，先驱公告，编年史
      snapshot_effect_script: >-
        刷新每月合法性、外交声誉、合法性、声望、国库、法庭支出、腐败、精英满意度、臣民/封臣忠诚度、特使可用性、战争状态、继承风险、德里占领、围困、动乱、破坏、繁荣、宫殿访问、金库安全、王位状况、珠宝库存、长袍商店准备情况、卫兵忠诚度、观众命令、路线访问和最终建筑存在。
      progress_effect_script: >-
        关于每月的记号、提前珠宝审计、王座清洁、国库印章、座位列表、贵族出席、特使调度、进贡账本、长袍准备、头衔起草、警卫演习、先驱排练、宫廷编年史和最终的 darbar 准备。因破产、占领、围困、严重动乱、国库盗窃、珠宝丑闻、宫廷逃亡、贵族抵制、使节侮辱、腐败或继承危机而暂停或衰退。在ruler_death上，将周期转换为继任者登基，并需要更新座位和长袍柜台。
      completion_trigger_script: >-
        要求完成达尔巴计数器或全面进展，德里控制，最终王座出现，没有破产，没有占领或不安全的围攻，可控的骚乱，安全的珠宝，公认的统治者/继承人，贵族出席，特使访问，密封的贡账，准备好的长袍和头衔，确认的警卫命令，以及最终的观众准备好。
      completion_effect_script: >-
        消除临时法院负担，应用永久国家修正，保留每月的合法性和外交声誉，授予一次性合法性，声望、臣民忠诚、外交恩惠或贵族满意度奖励，添加孔雀王座暗黑记忆，清除瞬态计数器，并保留完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留monthly_legitimacy和diplomatic_reputation。合法性来自于王位周围重复的公共等级制度。外交声誉来自使节、贡品、长袍、产权专利和可靠的法庭记录，这些记录使外交和臣民义务可见。
      one_time_reward: 授予一次性合法性、威望、外交恩惠、臣民或封臣忠诚、贵族满意度或宫廷凝聚力。如果ruler_death发生，则将部分奖励用于有序继承和第一达尔巴认可。
      local_building_reward: >-
        德里应该记住密封的珠宝库存、王座修复笔记、观众座位列表、特使等待记录、进贡账簿、荣誉长袍束、所有权专利、警卫路线演习、先驱公告和宫廷编年史。稍后的实施可以将其表达为当地法院命令、减少贵族骚乱或加强臣民忠诚度检查。
    notes: >-
      源仪式是直接的，但定时模式是必要的，因为奖励是有组织的法院系统而不是单一的财富一瞥。每月处理重复的观众准备工作； ruler_death 被保留，因为当继任者必须公开就座时，王位的合法性最为重要。将奖励保留在合法性和外交上，而不是纯粹的财政或征服。
- id: 173
  key: unique_varanasi_ghats
  base_key: sky_dome_grand_temple
  location: varanasi
  source_ritual_key: varanasi_ghats_rite
  status: designed
  ritual_design_zh:
    title: 瓦拉纳西高止山脉上的黎明灯
    mode: timed
    duration: >-
      定时模式应涵盖一个朝圣和河流管理季节，通常为六到十二个月。这段时间代表着清理高止山脉、管理沐浴场所、安排黎明灯、供应火葬场、协调牧师和船夫、记录朝圣者、修复洪水后的台阶以及管理卫生设施。该仪式加强了稳定性和皈依，因为神圣的例行公事在许多每月的活动中都是可预测的、安全的和可见的。
    listeners:
    - monthly
    historical_flavor: >-
      瓦拉纳西高止山脉上的黎明灯属于瓦拉纳西，因为高止山脉不是一个单一的神殿，而是一个河滨系统，死亡、净化、学习、商业和家庭奉献在这里相遇。长长的石阶、寺庙、火葬平台、船只、黎明沐浴线、灯、钟、祭司血统、挑水者、木商、朝圣者、寡妇、家庭主顾和城市官员，所有这些都将恒河变成了公共机构。参与者包括寺庙祭司、火葬服务员、船夫、河坛清洁工、水测量员、朝圣抄写员、旅馆管理员、节日管理员、音乐家、守卫、医生或卫生官员（如果有）、捐助者、当地户主以及负责维护公共秩序的统治者代理人。这些地方被命名为高止山脉、沐浴台阶、火葬场、寺庙庭院、船只停泊处、灯台、朝圣者宿舍、木材市场、水梯和通往圣城的街道。这些物品包括油灯、黄铜器皿、祈祷文、木帐、朝圣者登记簿、船代币、水位标记、清洁扫帚、灰坑、捐款账簿和节日横幅。
      stability_investment之所以得以保留，是因为高止山脉将悲伤、宣誓、朝圣人群和当地纠纷吸收到公认的惯例中。 global_pop_conversion_speed_modifier之所以被保留，是因为有序的仪式、可见的牧师、安全的沐浴和有记录的朝圣使得国家支持的宗教活动更容易传授和采用。
    confirmation_logic: >-
      赞助者必须拥有或控制瓦拉纳西，最后的高止山脉奇迹建筑必须存在，国家不能破产，河边不能被占领、遭到敌对围困、阻止朝圣者进入或遭受严重骚乱。河流通道必须足够安全，可供沐浴和划船；火葬场必须可用；寺庙和加特办事处必须能够协调人群。如果有的话，确认应检查稳定投资、转换速度、宗教团结或国家信仰凝聚力、神职人员满意度、当地动乱、破坏、繁荣、疾病或卫生风险、洪水季节、朝圣者交通、财政以及进入城市的路线控制。只有当战争威胁到高止山脉、朝圣者或渡河时，战争才应该阻止这项仪式。
    start_logic: >-
      起始效果记录了赞助国、仪式地点瓦拉纳西、最终的河坛建筑、国家信仰或宗教背景以及活跃的河滨季节。它反映了国家基线：稳定投资、全球转变速度、稳定性、宗教团结、神职人员/仪式满意度、财政、动乱压力、合法性或权威以及战争状态。它反映了当地的基线：占领、围困、动乱、破坏、繁荣、河流通道、洪水风险、水位、卫生/疾病风险、河坛状况、寺庙办公室准备情况、火葬场容量、船夫合作、木材供应、宿舍容量和路线安全。它初始化台阶清洁、水位标记、沐浴顺序、灯准备、牧师名册、船夫登记、火葬木分类账、骨灰处理、朝圣者登记、宿舍供应、节日时间表、卫生值班和最后黎明灯仪式的计数器。临时负担包括油、灯、警卫工资、木材会计、清洁工、船代币、朝圣食物、寺庙津贴以及台阶和登陆平台的维修。
    progress_logic: >-
      每月的进展是圣河秩序变成公民秩序。河坛工作人员擦洗石阶、清除淤泥、修复破裂的平台并重新粉刷水位标记。牧师们分配沐浴时间、准备经文并协调黎明祭祀，以免人群挤坏台阶。船夫登记船只和安全过河率。火葬工作人员审核木材、灰坑和平台通道；卫生官员或城市官员负责监视疾病、污水和过度拥挤的情况。朝圣者抄写员记录了名字和起源；旅馆老板报告谷物和床上用品；警卫保持节日路线畅通；灯管员准备油、灯芯和平台。当河流通道安全、牧师和船夫合作、城市支付维护费用、火葬场有序、骚乱可控时，进步就会取得进展。它因破产、占领、围困、严重动乱、洪水破坏、干旱导致高止山脉无法使用、流行病、木材短缺、船夫罢工、牧师纠纷、污染丑闻、人群拥挤或路线封锁而暂停。它以高稳定性、满意的神职人员、强大的财政、安全的道路、繁荣的旅馆、可控的洪水水位和现有的朝圣交通来加速。
    completion_logic: >-
      完成需要完成步骤清洁、水位、沐浴、灯、牧师、船夫、火葬、灰烬、朝圣者、旅馆、节日、卫生和最后灯柜台。瓦拉纳西必须保持控制，最终的建筑必须存在，国家不能破产，河边必须安全。最后一幕在日出之前开始。牧师们带着灯和黄铜器皿走下干净的台阶。船夫们把他们的船排列得井然有序；火葬人员将平台保持在远离沐浴人群的位置；朝圣者在看守下沐浴；寺庙的钟声标志着第一道曙光；主办方官员宣读一份公告，确认河坛维护、朝圣者保护和仪式秩序。这一奇迹成为国家能力，因为瓦拉纳西将私人悲伤、净化、教导和朝圣转化为一个稳定的公共机构，可以将国家支持的信仰向外传播。
    failure_or_timeout_logic: >-
      仪式可以暂停，但如果季节过去或洪水破坏未得到修复，卫生、节日和朝圣计数器就会腐烂。如果赞助商失去了瓦拉纳西、最后的河坛建筑消失、国家仍然破产、河坛被占领或毁坏、或者河道长期无法使用，那么它就会失败或取消。严重的骚乱、流行病、洪水、干旱、火葬场混乱、牧师冲突、船夫罢工、路线封锁或人群灾难应该会暂停进度，并可能重置沐浴、卫生、节日或最后一盏灯的计数器。战争关系到朝圣者的安全和河流控制。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对瓦拉纳西的控制、最终独特的河坛建筑存在、没有破产、没有重复的活跃仪式、没有占领或敌对围困、可控的骚乱、可用的河流通道、安全的沐浴和乘船路线、可用的火葬场、正常运转的寺庙办公室以及没有严重的卫生危机。添加稳定性、转换速度、宗教团结、神职人员满意度、朝圣者交通、洪水/疾病风险、金库、破坏和路线安全的主题检查。
      start_effect_script: >-
        将仪式与赞助商和瓦拉纳西绑定，存储宗教背景，应用临时河边维护负担，初始化台阶清洁计数器，水位标记，沐浴顺序，灯准备，牧师名册，船夫登记，火葬木分类帐，灰烬处理，朝圣者登记、宿舍供应、节日时间表、卫生监视和最后的黎明灯，并记录国家/地方基线。
      snapshot_effect_script: >-
        刷新稳定投资、转换速度、稳定性、宗教团结、神职人员满意度、财政、动乱压力、合法性、战争状态、瓦拉纳西占领、围困、动乱、破坏、繁荣、河流通道、洪水风险、水位、卫生/疾病风险、河坛状况、寺庙办公室准备情况、火葬能力、船夫合作、木材供应、宿舍容量、路线安全和最终建筑存在。
      progress_effect_script: >-
        每月蜱虫、提前清洁、水痕、沐浴顺序、灯库、牧师名册、船只登记、火葬木材、灰烬处理、朝圣者记录、宿舍供应、节日准备、卫生巡逻、路线警卫和最终黎明灯准备。因破产、占领、围攻、严重骚乱、洪水、干旱、流行病、木材短缺、船夫罢工、牧师纠纷、污染、人群灾难或路线阻塞而暂停或衰败。
      completion_trigger_script: >-
        要求完成河坛柜台或总体进度，瓦拉纳西控制，最终建筑存在，没有破产，没有占领或不安全的围困，可控的骚乱，安全的河流通道，正常的牧师和船夫，有序的火葬场，干净的台阶，准备好的灯，马厩
      completion_effect_script: >-
        消除临时河边负担，应用永久国家修正，保持稳定投资和转换速度，给予一次性稳定，宗教团结，神职人员满意度，当地骚乱救济，朝圣者繁荣或声望奖励，添加瓦拉纳西河坛记忆，清除瞬态计数器，并保留完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留stability_investment和global_pop_conversion_speed_modifier。稳定来自规范的哀悼、沐浴、火葬、卫生和人群秩序。转换速度来自可见的、受保护的、反复传授的河流仪式和朝圣记录。
      one_time_reward: 授予一次性稳定进展、宗教团结、神职人员满意度、减少当地骚乱、朝圣者收入或声望。奖励应与清洁的卫生设施、安全的河流通道以及有序的火葬和沐浴柜台相匹配。
      local_building_reward: >-
        瓦拉纳西应该记住清洁的台阶、水位标记、灯台、牧师名册、船夫登记册、火葬木书、灰坑、朝圣者登记册、旅馆分类帐、卫生报告和节日路线。稍后的实施可以将其表达为当地朝圣繁荣、更少的动荡、疾病恢复能力或更快的稳定恢复。
    notes: >-
      源仪式是直接的，但定时模式适合活生生的河滨机构。每月一次就足够了，因为每个蜱虫都有具体的维护、礼拜、卫生和人群管理工作。保持稳定和转化的永久奖励；声望应该保持次要的和地方性的。
- id: 174
  key: unique_brihadishvara_temple
  base_key: giant_tower_temple
  location: thanjavur
  source_ritual_key: brihadishvara_temple_rite
  status: designed
  ritual_design_zh:
    title: 坦贾武尔大维玛那开光
    mode: timed
    duration: >-
      定时模式应涵盖完整的寺庙服务和遗产审计周期，通常为六到十二个月。这段时间代表着塔的涂油、青铜圣像的检查、灯和油的供应、铭文的阅读、舞者和音乐家名册的更新、寺庙土地收入审计以及围绕伟大的维曼纳的最后的开光。合法性和皈依源于重复的皇家服务，而不是单一的奇观。
    listeners:
    - monthly
    - ruler_death
    historical_flavor: >-
      维曼那大奉献属于布里哈迪什瓦拉寺庙，因为坦贾武尔建筑群融合了乔拉王权、纪念性建筑、寺庙经济、铭文记忆和日常仪式。高耸的花岗岩维马那、南迪亭、围墙庭院、青铜灯、青铜圣像、皇家铭文、仓库、厨房、舞者服务、音乐家、牧师、会计师、抄写员和寺庙土地，将统治者的权威变成了一个可以看到、阅读、歌唱和审计的机构。参与者是统治者或公认的继承人、湿婆祭司、寺庙受托人、土地会计师、青铜器保管人、灯管人、舞者、鼓手、歌手、铭文朗诵者、捐赠土地的村长、守卫、抄写员和王室代理人。这些地方有主殿、维摩那基座、绕行场、难地阁、青铜器店、灯室、厨房、金库、碑墙、舞厅和遗产记录处。这些物品有油灯、铜板、石刻、青铜像、花环、王伞、鼓、舞蹈脚镯、土地账簿、粮量和寺庙印章。
      monthly_legitimacy 之所以被保留，是因为这座神庙使统治者成为宇宙和农业秩序的可见守护者。 global_pop_conversion_speed_modifier 得以保留，是因为资金充足的服务、铭文、游行和寺庙网络在整个乡村进行国家支持的宗教活动。
    confirmation_logic: >-
      赞助商必须拥有或控制坦贾武尔，最后的 Brihadishvara 奇迹建筑必须存在，国家不能破产，寺庙区域不能被占领、遭到敌对围困或遭受严重动乱。寺庙的庄园和来自受赠村庄的道路必须足以运送粮食、石油、鲜花和音乐家。国家应该有一个公认的统治者或摄政者；如果继承权存在争议，则应等待最终的祖先确认。如果可用，检查应考虑每月的合法性、转换速度、合法性、宗教团结、神职人员满意度、当地繁荣、土地收入、财产控制、破坏、寺庙账户腐败、国库和统治者死亡/继承状态。战争只有在威胁到寺庙、庄园或游行路线时才会被封锁。
    start_logic: >-
      起始效果记录了赞助国坦贾武尔作为仪式地点、最终的寺庙建筑、统治者/摄政背景、宗教背景和活跃的奉献周期。它快照了国家基线：每月合法性、转换速度、合法性、稳定性或宗教凝聚力、神职人员满意度、国库/收入、土地收入、宫廷或寺庙支出压力、战争状态和继承风险。它快照了当地的基线：占领、围困、动乱、破坏、繁荣、寺庙状况、维曼那状况、圣所访问、南迪亭状况、青铜圣像库存、灯油供应、粮食供应、铭文完整性、舞者/音乐家可用性、庄园路线安全和帐户清洁度。它初始化维曼那洗涤/涂油、圣所服务、青铜库存、灯供应、油和谷物审计、舞者名册、音乐家名册、铭文朗诵、寺庙土地审计、捐赠者/村庄确认、游行路线、皇家公告、祖先/继承人确认和最终开光等计数器。临时负担代表石油、鲜花、音乐家、舞者、守卫、抄写员、维修以及审计寺庙财产的机会成本。
    progress_logic: >-
      每月的进展是皇家奉献成为行政记忆。祭司清洗并涂油维玛纳底座、维护圣所灯并检查仪式器皿。青铜看门人清点圣像、检查锁并准备游行图像。灯管员审核油；厨房测量谷物；会计师将村里的付款与寺庙土地赠款进行比较，并记下遗漏的会费。舞者、鼓手和歌手更新名册并进行排练。抄写员清理并阅读铭文，以便统治者的礼物和义务保持公开。村长带来捐赠土地的报告；守卫清晰的游行路线。当坦贾武尔安全、寺庙办公室得到报酬、庄园发送物资、牧师和服务人员合作、公共秩序平静时，进展就会推进。它因破产、占领、围困、严重骚乱、庄园叛乱、圣所受损、青铜圣像失踪、石油或谷物短缺、舞者或音乐家缺席、账户腐败、游行路线危险或继承争议而暂停。它以高度的合法性、满意的神职人员、繁荣的庄园、干净的账目、强大的国库、低破坏性和公认的皇室赞助而加速。
      ruler_death听众将仪式变成王朝确认：顺利的继承者可以添加祖先祭祀计数器，而有争议的继承则冻结最终公告和铭文计数器。
    completion_logic: >-
      完成需要维曼那，圣所，青铜器，灯，油/谷物，舞者，音乐家，铭文，庄园，村庄，游行，公告，祖先/继承人和最终开光计数器是完整的。坦贾武尔必须保持受控，最终建筑必须存在，国家不能破产，统治者或摄政必须得到承认。最后的场景聚集了祭司、舞者、音乐家、会计师、村庄代表、皇家官员和寺庙庭院中的守卫。灯亮了；显示青铜图标；鼓声；大声朗读皇家礼物的铭文；遗产账簿已封存；统治者或继任者在圣殿前献祭并承认圣殿的义务。这一奇迹成为国家能力，因为寺庙将不朽的奉献转化为合法性、乡村庄园秩序和可教的宗教网络。
    failure_or_timeout_logic: >-
      仪式可以暂停，但如果灯未配备、花名册失效或长时间不公开宣读铭文，服务和财产柜台就会腐烂。如果赞助商失去了坦贾武尔、最后一座寺庙建筑消失、国家仍然破产、圣所被占领或摧毁、或者关键的青铜圣像和账本丢失，它就会失败或取消。严重的骚乱、庄园叛乱、补给缺失、帐户欺诈、游行暴力、牧师抵制、维曼纳受损或继承争议应该暂停进度，并可能重置服务、庄园或最终奉献计数器。战争关系到寺庙、庄园和道路的安全。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对坦贾武尔的控制、最终独特的寺庙建筑存在、没有破产、没有重复的活跃仪式、没有占领或敌对围困、可控的骚乱、可用的寺庙区域、安全的庄园路线、正常运转的寺庙办公室、公认的统治者/摄政以及没有严重的帐户或图标危机。添加对合法性、转换速度、宗教统一、神职人员满意度、土地收入、国库、破坏、遗产控制和继承危机的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和坦贾武尔，存储统治者/摄政和宗教背景，应用临时寺庙服务负担，初始化维马纳涂油计数器，圣所服务，青铜库存，灯供应，石油/谷物审计，舞者名册，音乐家名册，铭文阅读、寺庙土地审计、村庄确认、游行路线、皇家公告、祖先/继承人确认和最终开光，并记录国家/地方基线。
      snapshot_effect_script: >-
        刷新每月合法性、转换速度、合法性、稳定性或宗教凝聚力、神职人员满意度、国库、土地收入、寺庙支出压力、战争状态、继承风险、坦贾武尔占领、围困、动乱、破坏、繁荣、寺庙条件、维曼那条件、圣所访问、南迪亭条件、青铜库存、灯油、粮食供应、铭文完整性、舞者/音乐家可用性、庄园路线安全、帐户清洁度和最终建筑存在。
      progress_effect_script: >-
        每月刻度、提前维曼那清洗、圣所服务、青铜审计、灯店、油/谷物帐户、舞者和音乐家名册、铭文背诵、遗产审计、村庄确认、游行许可、公告起草和最后的奉献准备。因破产、占领、围困、严重骚乱、庄园叛乱、圣所受损、圣像缺失、供应短缺、账户腐败、路线危险、服务人员缺席或继承危机而暂停或衰退。在ruler_death上，在最终完成之前要求祖先/继承人确认。
      completion_trigger_script: >-
        要求完成寺庙柜台或总体进度，坦贾武尔控制，最终建筑存在，没有破产，没有占领或不安全的围困，可控制的骚乱，公认的统治者/摄政，准备好的圣所，完整的青铜库存，点亮的灯，审计的庄园，当前的服务名册，可读的铭文，安全的游行路线和最终的奉献准备好。
      completion_effect_script: >-
        移除临时神庙负担，应用永久国家修正，保留每月合法性和转换速度，授予一次性合法性，宗教团结，神职人员满意度，财产繁荣，稳定或文化声望奖励，添加布里哈迪什瓦拉神庙记忆，清除瞬态计数器，并保留完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留 monthly_legitimacy 和 global_pop_conversion_speed_modifier。合法性来自于对伟大圣殿的公共皇家服务；皈依速度来自于资助的牧师、铭文、游行、庄园网络和服务人员，他们将寺庙的习俗传播到坦贾武尔以外。
      one_time_reward: 授予一次性合法性、稳定性、宗教统一、神职人员满意度、当地繁荣、庄园收入或文化声望。如果ruler_death发生，则将部分奖励用于有序的王朝继承和祖先承认。
      local_building_reward: >-
        坦贾武尔应该记住受膏的维马纳石头、青铜库存、灯台账本、舞者和音乐家名册、铭文阅读、寺庙土地审计印章、村庄确认、游行路线和祖先祭品。稍后的实施可以将其表达为当地寺庙经济、较低的动荡或更强的遗产合规性。
    notes: >-
      源仪式是直接的，但定时模式适合寺庙服务、遗产审计和铭文记忆。每月处理重复的寺庙管理； ruler_death 被保留，因为王室合法性和祖先确认是该网站的核心。保持对合法性和转化的永久奖励，而不仅仅是一般的声望。
- id: 175
  key: unique_konark_sun_temple
  base_key: grand_cathedral
  location: puri
