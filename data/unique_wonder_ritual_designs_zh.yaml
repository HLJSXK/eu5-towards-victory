        拉萨应该保留布达拉寺转法路的记忆：登记的朝圣者、维护的酥油灯、密封的寺院预约、复印的法师执照、受保护的商队道路以及为僧侣和游客提供食物的宫殿商店。稍后的实施可以将其表现为减少当地骚乱、加强宗教服务、对附近地区的皈依支持或从继承冲击中更快恢复。
    notes: >-
      这将源坐床从即时扩大到定时，因为布达拉宫的历史功能是反复出现的宫殿寺院政府，负责教学、朝圣、庄园和公认的权威。每月的听众进行行政和传教巡回演出； ruler_death 被保留，因为继承、摄政和精神认可是布达拉统治的核心。除非后期设计需要，否则实施者不应硬编码一个特定的藏文标题；目前的地图可以使用国家信仰等级制度，同时保留布达拉宫的西藏宫殿寺院风格。
- id: 106
  key: unique_alhambra
  base_key: palace_of_nations
  location: granada
  source_ritual_key: capitulation_treaty
  status: designed
  ritual_design_zh:
    title: 格拉纳达的钥匙和宫廷协和
    mode: timed
    historical_flavor: >-
      阿罕布拉被视为一座协商主权的宫殿，美丽、投降、记忆和外交表演在格拉纳达的红墙内相遇。仪式聚集了赞助统治者的特使、宫廷公证人、卡迪或法学家、翻译、城主、纳斯瑞德或当地贵族家庭、诗人、水道监督者、瓷砖和灰泥工匠、正义之门的守卫、税务官员、外国观察员以及权利被写入定居点的社区代表。他们穿过梅克斯议会厅、香桃木庭院、大使厅、狮子庭院、倒影池、雕刻的灰泥房间、瓷砖墙裙和俯瞰格拉纳达织女星的墙壁。这些物品同样具体：象征性钥匙、密封的投降卷、双语或多语条约副本、丝绸横幅、来自阿塞奎亚运河的水、工匠名册、受保护家庭名单、贡品表和安全通行证。阿罕布拉的仪式力量来自于表明，一个胜利的国家可以在不显得粗鲁的情况下统治被征服的宫廷：声望来自于拥有和保护宫殿，而外交声誉则随着外国观察者看到宣誓条款、受保护的精英、工匠、花园、水厂和观众融入稳定的公共定居点而增长。
    duration: >-
      仪式使用十二个月的检查：六个月来审核、翻译和宣布投降条件；三个月确认宫户、工匠、水利维护、守卫例行和纳税义务；三个月的时间接待外交观众，证明格拉纳达已经成为一个受管理的法院，而不是一个被解雇的奖品。这改变了源直接仪式，因为只有宫殿在第一次签署后继续产生明显的和谐，《格拉纳达条约》才有意义。一次点击无法表达征服到声誉的缓慢转化。
    listeners:
    - monthly
    - ending_war
    confirmation_logic: >-
      赞助商必须拥有并控制格拉纳达，最终的阿罕布拉建筑必须在那里存在，而且国家不能破产。格拉纳达不得被占领、直接围困或发生严重的地方叛乱。宫殿的水道、宫门、城门应可用；如果实施可以表达封锁、供应隔离、破坏或当地繁荣，那么严重的破坏应该阻止确认。赞助者必须能够向格拉纳达派遣特使、公证人和警卫，并且当前不应违反新的投降、休战或地方保护安排（如果此类国家可以派代表的话）。其他地方的战争并不禁止这种仪式，但格拉纳达的战争、威胁宫殿的围困或迫使该城市严酷占领的战役应该阻止或暂停它。确认应显示所有权、控制权、最终建筑、偿付能力、非占领、非叛乱以及宫殿/城市的可用性作为单独的检查。
    start_logic: >-
      起始效果记录了赞助国、作为仪式地点的格拉纳达、现任统治者或外交当局以及任何相关的战争或休战背景。它反映了国家每月的威望、外交声誉、稳定性、合法性或同等权威、财政状况、当前战争状况、宽容或文化动荡（如果有），以及与附近或最近击败的大国的关系。它还反映了格拉纳达当地的情况：动乱、破坏或繁荣、占领、围困、最终建筑的存在、当地文化或信仰紧张（如果有）、水源和宫殿守卫状况。对法庭翻译、公证员、宾客住宿、工匠津贴、喷泉和水瓶维护、仪仗队、条约副本存储以及向当地家庭承诺的付款施加临时负担。这些快照应该允许进展在镇压或叛乱下暂停，并允许最终的一次性奖励扩展到声望或外交认可，具体取决于格拉纳达的和平管理程度。
    progress_logic: >-
      每个月的刻度代表一项可执行的宫廷协约。一个月的时间翻译并比较了《Mexuar》中的投降书副本；另一份清单则保护家庭、图书馆、作坊和工匠；另一个让水务监督员检查维持宫殿活力的水渠、倒影池和喷泉；另一场在大使厅举行了一场克制的接见活动，当地贵族和外国观察员出席了会议；另一个审查税表，以便上交不会成为任意掠夺；另一个为家庭、商人和学者发放安全通行证；另一个则付钱给灰泥雕刻师、瓷砖镶嵌工、园丁和守卫，他们的持续服务使宫殿成为克制的战利品，而不是废墟。当格拉纳达保持受控、有偿付能力、无人居住并且对观众和审计足够冷静时，进展就会取得进展。在破产、占领、直接围困、严重动乱、宫殿供水中断、严重破坏或最终建筑消失的情况下，它会暂停。凭借强大的外交声誉、高威望、稳定、低动荡、当地繁荣、受尊重的停战协议或统治者亲自接见，它可能会前进得更快。
      ending_war 听众很重要，因为每当战争结束时，阿尔罕布拉宫的承诺都会受到考验：在活跃仪式期间的光荣和平、受保护的投降或谈判解决可以增加进度或提高奖励规模，而严厉的解雇、失败的投降或对格拉纳达的新战争应该会暂停进度，并将条约法院标记为信誉不佳，直到命令返回。
    completion_logic: >-
      完成需要十二个成功的每月周期，继续拥有和控制格拉纳达，最后的阿罕布拉建筑，偿付能力，没有直接围困或占领，并且没有严重的当地叛乱。最后一幕在大使厅举行并流入狮子庭院。赞助商特使赠送象征性钥匙；公证人展示密封的条约副本；翻译人员大声朗读术语；宫殿水渠中的水被倒入宫廷喷泉中，以表明花园和作坊仍然受到保护；当地法学家和贵族代表见证宣誓；在门口守卫较低的横幅；外国观察员收到协约的副本。一份公开声明宣称，格拉纳达的统治是宣誓条款、受保护的船只、受保护的水源和定期观众，而不是无纪律的征服。通过使威望持续和外交声誉可信，奇迹变成了国家能力：其他法院将赞助者视为可以获胜、谈判、维护和管理的统治者。
    failure_or_timeout_logic: >-
      没有普通的超时。当格拉纳达不安全时，仪式会暂停，当宫殿再次可以接待观众时，仪式就会恢复。失去格拉纳达、失去对场地的控制、最终建筑的消失或宫殿定居点的永久废弃都会取消仪式并消除没有奖励的负担。破产暂停是因为公证人、工匠、警卫和水务官员没有得到报酬，使条约变得空洞。占领、直接围困、严重叛乱、严重破坏、供水中断或当地的严厉镇压政策都会阻碍进展。只有当战争触及格拉纳达或暴露赞助商无法履行谈判条款时，战争才会中断；否则遥远的战争可能会继续。统治者的死亡应该通过普通权威或骚乱检查来处理，而不是通过特殊的倾听者：如果新朝廷拒绝接受条约，进展就会暂停；
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对格拉纳达的所有权和控制权，最终存在独特的阿罕布拉建筑，赞助商未破产，没有占领，没有直接围困，没有严重的当地动乱或叛乱，以及可用的宫殿/城市通道，包括水道或低度破坏检查（如果存在可靠的触发器）。
      start_effect_script: >-
        商店赞助国，格拉纳达仪式地点，活动仪式标记，进度目标为 12，当前进度为零，现任统治者或外交当局，以及任何相关的战争/休战状态。应用临时条约法庭维护负担并每月注册，加上 ending_war
        听众。
      snapshot_effect_script: >-
        快照国家每月威望、外交声誉、稳定性、合法性或同等权威、财政状况、战争状态、停战或投降背景（如果有），以及格拉纳达当地动乱、破坏或繁荣、占领、围困、文化/信仰紧张、供水、宫殿守卫状态和最终建筑
      progress_effect_script: >-
        在每月的刻度上，添加条约翻译、家庭保护审计、水道检查、宫殿接见、税务术语确认、安全行为问题或工匠津贴审查的进度。为高威望、强大的外交声誉、低当地动乱、繁荣、稳定的休战和个人统治者出席添加适度的奖励进度。在破产、占领、直接围困、严重动乱、严重破坏、供水中断、严酷镇压或最终建筑缺失等情况下暂停。在ending_war上，为光荣的谈判和平添加进度或奖励比例；在解雇或失败投降后暂停或标记耻辱。
      completion_trigger_script: 需要至少十二个成功的进度单位，继续赞助者对格拉纳达的所有权和控制权，最终建筑仍然存在，没有破产，没有占领或直接围攻，没有严重的动乱，并且没有主动的信誉条约暂停。
      completion_effect_script: 移除临时负担，清除主动仪式进度和暂停变量，应用永久的阿罕布拉国家修正，授予一次性声望或外交奖励，并记录密封投降、保护工匠和维护宫殿水的格拉纳达遗址记忆
    intended_rewards:
      permanent_country_modifier: >-
        保留源修饰符方向：monthly_prestige 仍然是宫廷利益，因为阿尔罕布拉宫让赞助商将被征服的宫殿展示为精致、保存完好且在行政上有用； diplomatic_reputation
        仍然是外部利益，因为宣誓投降、受保护的家庭和明显的克制使其他法院相信赞助商的承诺。后期的扩张应该加深威望和外交信誉，而不是把宫殿变成税收、人力或宗教皈依的奖励。
      one_time_reward: >-
        完成可以给格拉纳达带来适度的威望、外交支持、合法性以及当地骚乱的减少或繁荣。如果ending_war听众在仪式期间记录了一次光荣的和平，那么一次性奖励应该倾向于外交声誉或外国舆论；如果格拉纳达在所有十二个周期中都保持平静，它可以倾向于声望和地方和谐。
      local_building_reward: >-
        格拉纳达应该保留阿罕布拉投降法庭的记忆：受保护的水道、受薪工匠、守卫的大门、翻译的条约副本、安全通行卷和宫殿中保留的观众习俗。未来的实施可以将其表达为更少的骚乱、改善当地繁荣、更强的文化传统或抵抗占领现场的破坏。
    notes: >-
      这将capitulation_treaty从立即扩展到定时，因为阿罕布拉的历史价值在于征服后继续履行协商主权。每月听众涵盖法庭管理和保存；选择 ending_war 而不是 ruler_death
      是因为，当战争结束且发起国兑现或违反谈判达成的和平时，该条约的可信度受到最明显的考验。 [第 1492 章]该设计可以代表任何赞助商使用阿罕布拉将格拉纳达从被征服的宫殿转变为外交首都。
- id: 107
  key: unique_machu_picchu
  base_key: sacred_mountain
  location: picchu
  source_ritual_key: inti_raymi
  status: designed
  ritual_design_zh:
    title: 云台之上的 Inti Raymi
    mode: timed
    historical_flavor: >-
      马丘比丘被视为皇家山地庄园，海拔、砖石、太阳观测和控制通道使这里的繁荣和合法性变得可信。仪式聚集了萨帕印加人或赞助统治者、皇室亲属、因蒂祭司、基普卡马约克记录员、查斯基赛跑者、美洲驼饲养员、米塔劳工监督员、梯田管理员、玉米和古柯服务员、了解干石墙的泥瓦匠、山脊小路的守卫，以及受邀见证宫廷可以指挥云林上方隐藏庇护所的贵族。他们穿过皇家区域、太阳神庙、Intihuatana
      石头、水道、楼梯、储藏室、露台和乌鲁班巴山谷的了望点。这些物品包括基普绳、玉米啤酒、金或铜的太阳徽章、美洲驼祭品、种子篮、路标、家庭劳动清单以及从山脊渠道抽取的水。该遗址属于 Inti Raymi，因为太阳仪式的作用不仅仅是尊崇神祇：它证明王权可以攀登山脉、协调劳动、供养扈从、保持道路畅通，并将偏远的神圣庄园变成繁荣和合法统治的明显保证。
    duration: >-
      该仪式每月进行十四次检查。十二个月代表了一个完整的太阳能和农业年，包括比丘周围的观测、供奉、劳动力轮换、梯田护理、水道检查和仓库核算。另外两项检查代表皇家见证人沿着山路正式上山和下山。这改变了源直接仪式，因为马丘比丘的
      Inti Raymi 应该表达维护的皇家财产和年度繁荣周期，而不是单一的节日点击。
    listeners:
    - monthly
    - ruler_death
    confirmation_logic: >-
      赞助商必须拥有并控制比丘，最终的马丘比丘建筑必须在那里存在，并且国家不能破产。山脊不应被占领、直接围困或严重动乱。由于该地点依赖于山区通道，因此从赞助商到比丘的路线对于跑步者、贵族、牧师、美洲驼和劳工监督员来说应该足够安全；如果实施可以测试路线安全、供应隔离、破坏、繁荣或当地粮食储备，则严重中断应阻止确认或显示为失败条件。赞助者应该有足够的法院权威和国家信仰组织来派遣太阳牧师和记录员。其他地方的战争是可以接受的，但关闭山路、威胁庇护所或破坏劳动力轮换的战争应该暂停或阻止仪式。继承危机应该会阻止初步确认，因为英蒂·雷米在这里公开确定了哪位统治者与太阳和王室庄园息息相关。
    start_logic: >-
      启动效果记录了赞助国、作为仪式地点的比丘、现任统治者以及该国是否有活跃的高地或道路网络权威可以支持登顶。它快照了国家全球每月繁荣修正值、每月合法性、稳定性、统治者合法性或同等权威、宗教团结或国家信仰凝聚力、财政健康、战争状况以及任何可供以后实施的粮食储备、道路或劳动力能力指标。它还反映了比丘当地的状况：占领、围困、骚乱、破坏或繁荣、最终建筑的存在、路线安全、露台状况、水道可用性以及当地存储或农业支持（如果有）。对美洲驼商队、牧师祭品、玉米和奇恰、卫兵轮换、查斯基接力、基普审计、露台清理和皇家宾客住宿施加临时负担。这些快照应该让进展在破损的道路或骚乱的情况下暂停，并应该让完成将繁荣解释为有组织的财产管理而不是一般财富。
    progress_logic: >-
      每个月的听众滴答声代表了皇家财产周期中的一个具体行为。祭司们在因蒂瓦塔纳 (Intihuatana) 观察一个月的太阳，标志着即将到来的农业阶段；另一个是露台管理员负责修复挡土墙、排水系统和土床；另一个则用
      quipu 计数发送 Chasqui 跑步者沿路线行驶；另一份清单列出了分配给该庄园的玉米、古柯、布料和美洲驼群；另一个则与卫兵和贵族一起排练统治者的登基。另一个净化庇护所的水道；另一个将储存的食物分发给工人和服务员；另一份记录了哪些社区履行了
      mit'a 职责。当比丘保持可控、有偿付能力、无人居住、有安全路线连接并且足够平静以进行攀登时，进展不断推进。它因破产、占领、直接围困、严重骚乱、路线崩溃、严重破坏、供水中断、食物供应失败或最终建筑缺失而暂停。当繁荣已经上升、合法性很高、道路或中继基础设施强大、当地梯田健康、稳定积极或统治者亲自参加上升时，它可能会前进得更快。
      ruler_death听众将仪式期间的死亡变成了祖先交接仪式：如果继承是有序的，祭司会将已故统治者的记忆带入血统仪式中，通过太阳观测携带继承者的名字，并以合法性为导向的前进来保持进步。如果继承权存在争议，进展就会暂停，因为庇护所无法保证在不确定的统治者统治下的繁荣。
    completion_logic: >-
      完成需要十四个成功的每月周期，继续拥有和控制比丘（最后的马丘比丘建筑），没有破产，没有直接围攻或占领，足够安全的山区通道，并且没有未解决的继承危机。最后一幕在日出之前在山脊上开始。因蒂的祭司在太阳石前放置玉米、古柯、奇恰和美洲驼供品；
      quipucamayoc 显示记录劳务和仓库余额的绳索；跑步者带着来自山谷的代币从路上到达；贵族们站在露台上；水从石槽中注入；统治者或公认的继承者面临着山上的第一道曙光。公告称，王室、道路、水流、台地、侍从、库房，与国家的繁荣息息相关。这一奇迹变成了国家能力，因为法院现在可以以马丘比丘作为证据，证明合法统治可以产生有序的劳动力、肥沃的庄园和循环的太阳历的丰富。
    failure_or_timeout_logic: >-
      没有普通的超时；恶劣天气、道路维修或收获延迟可能会暂停循环，但不会破坏它。失去比丘、失去对场地的控制、最终建筑物的消失或永久失去山路都会取消仪式并在没有奖励的情况下消除负担。破产立即暂停，因为供品、护卫、跑者、劳工无法维持。占领、直接围困、严重骚乱、路线崩溃、严重破坏、水道失效或食品仓库破损都会阻碍进展。如果继承有序，统治者死亡并不会取消仪式；它成为祖先过渡和继承人认证。有争议的继任者会暂停进展，直到权威得到解决。只有当战争威胁到比丘、切断道路或阻止庄园工人和目击者聚集时，战争才会暂停。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对比丘的所有权和控制权，最终呈现独特的马丘比丘建筑，赞助商没有破产，没有占领，没有直接围困，没有严重的骚乱，也没有未解决的继承危机。包括对路线安全、低破坏、食物或储存支持、水道完整性以及法院/国家信仰访问（如果存在可靠触发因素）的可选检查。
      start_effect_script: >-
        商店赞助国、比丘仪式地点、统治者身份、活动仪式标记、十四个进度目标、当前进度为零，以及路线或高地支持旗帜（如果有）。应用临时 Inti Raymi 遗产负担并每月注册加上 ruler_death
        听众。
      snapshot_effect_script: >-
        快照国家全球每月繁荣、每月合法性、稳定性、统治者合法性或同等权威、宗教团结、财政健康、战争状态、道路或劳动力能力（如果有），以及当地比丘占领、围困、动乱、繁荣或破坏、路线安全、露台状况、水源、食物/存储支持和最终建筑存在。
      progress_effect_script: >-
        在每月的刻度上，添加太阳观测、露台修复、基普会计、仓库库存、皇家上升排练、水净化、劳动力分配或 mit'a 服务审计的进度。为日益繁荣、高度合法性、稳定的道路、健康的梯田、当地的繁荣和统治者的出勤率添加适度的奖励进度。在破产、占领、直接围困、严重动乱、路线崩溃、严重破坏、水/食物供应失败或最终建筑缺失的情况下暂停。在
        ruler_death 上，仅当继承有序时才保留并推进进度。
      completion_trigger_script: >-
        需要至少十四个成功的进度单位，继续赞助商拥有和控制比丘，最终建筑仍然存在，没有破产，没有占领或直接围攻，没有严重的当地动乱，可用的山区通道，并且没有未解决的继承危机。
      completion_effect_script: 删除临时遗产负担，清除主动仪式进度和暂停状态，应用永久马丘比丘国家修正，授予一次性繁荣或合法性奖励，并为太阳能遗产登记册记录比丘遗址记忆，维护
    intended_rewards:
      permanent_country_modifier: >-
        保留源修正方向：global_monthly_prosperity仍然是中心，因为马丘比丘代表着一个皇家庄园，其道路、商店、露台和仪式日历使整个领域繁荣昌盛； monthly_legitimacy
        仍然是核心，因为太阳上升公开地将统治者与因蒂、祖先、劳动服务和可见的高地秩序联系在一起。后期的扩展应该加深繁荣和合法性，而不是把这个奇迹变成一般的供应、人力或转换奖励。
      one_time_reward: >-
        完成可以给予比丘合法性、威望、稳定进展和当地繁荣或粮食储备恢复的适度脉搏。如果ruler_death祖先过渡路径干净地完成，一次性奖励应该倾向于合法性和继承接受度；如果所有十四个周期都不间断，它可以趋于繁荣和财产丰富。
      local_building_reward: >-
        比丘应该保留因蒂雷米遗产登记记忆：维护的山脊路径，经过验证的基普账户，受祝福的水道，健康的梯田，仓库余额和公认的皇家上升路线。稍后的实施可以将其表达为当地繁荣恢复、动乱后破坏程度降低、粮食弹性更好或继承期间更强的合法性效应。
    notes: >-
      这将inti_raymi从即时扩展到定时，因为马丘比丘的仪式价值是太阳观测、劳动力核算、道路通行、食物储存和仪式上升的重复皇家财产周期。每月收听者承载着繁荣周期； ruler_death 被保留，因为印加王室的合法性可以通过祖先崇拜和继承人认可来转移。将此与
      id 134 马丘比丘梯田区分开来：梯田维护在这里显示为皇家庄园繁荣系统的一部分，而不是主要的农业工程主题。
- id: 108
  key: unique_himeji_castle
  base_key: star_fortress_city
  location: shikama
  source_ritual_key: castle_receipt
  status: designed
  ritual_design_zh:
    title: 白鹭集结和城堡收据
    mode: timed
    historical_flavor: >-
      姬路城被视为活体防御机器的军事收据，而不是美丽城堡中的宴会。仪式聚集了赞助领主或高级指挥官、城堡巡查员、武士队长、足轻军官、火绳枪和弓箭大师、门卫、仓库管理员、木匠、泥水匠、石墙泥瓦匠、水井管理员、消防员、骑兵和信使以及来自播磨城下町的城镇代表。他们穿过白色灰泥的城堡、分层的屋顶、石头底座、橹塔、倾斜的走廊、混乱的大门顺序、谋杀孔、漏洞、水井、军械库、米店和外部通道，这些使得"白鹭"从远处看很优雅，但进入时却很痛苦。这些物品包括大门钥匙、守卫名册、火药和弹丸库存、箭束、盔甲架、米账本、水深计、火钩、修理碑以及通往天枢的迷宫般路线的地图。通过在公共秩序中接收每个大门、商店、水井和射击位置，国家将姬路从一个引人注目的地标变成了一个模范驻军：一个通过纪律训练士气的地方，并且该领域的每座城堡都学会分层思考、储备、商店和控制方法。
    duration: >-
      该仪式每月进行十二次检查。八个月的时间包括接收要塞综合体、大门、水井、商店、防火设施、维修计划和警卫轮换。四个月的时间包括将姬路当地系统与国家驻军政策联系起来的野战演习和战备审查。这改变了源直接仪式，因为只有在库存、演习和指挥程序证明优雅的迷宫可以在压力下运行后，城堡收据才有意义。
    listeners:
    - monthly
    - pre_winning_war
    - ending_war
    confirmation_logic: >-
      赞助商必须拥有并控制Shikama，最终的姬路城建筑必须在那里存在，并且国家不能破产。城堡不得被占领、直接围困或发生严重的局部骚乱。如果实施可以表达堡垒损坏、破坏、当地驻军耗尽或供应隔离，则严重损坏或孤立的城堡应阻止确认或显示为失败情况。赞助商应该有足够的军事管理机构来任命队长并维持警卫轮换。战争本身并不会阻碍仪式，因为城堡经受着战争的考验，但对鹿摩的围攻或城堡的直接损失会中断收据。如果国家破产了，行动必然失败，因为守卫、木匠、火药、大米、修理人员都拿不到工资。
    start_logic: >-
      起始效果记录了赞助国、仪式地点鹿间、当前指挥官或统治者权限以及当前战争状态。它反映了国家驻军规模调整因素、土地士气、军队专业精神或军事传统（如果有）、人力或士兵储备、财政状况、近期战争压力以及任何广泛的防御准备指标。它还快照了姬路当地的情况：占领、围困、骚乱、破坏或繁荣、最终建筑的存在、当地驻军实力、堡垒状况、军械库状态、井的可用性以及供应通道（如果存在此类数据）。对警卫工资、米店审计、粉末检查、木匠和泥水工工资、井清洁、消防服务、信使马匹和钻弹药施加临时负担。这些快照应该允许在被围困或破产的情况下暂停进度，并允许在城堡在真正的战争期间保持准备状态的情况下完成进度以提高士气。
    progress_logic: >-
      每个月的监听器刻度代表一个特定的收据或演习。一个月内，城门看守会展示外门的钥匙和挑战短语；另一张地图绘制了通往要塞的道路上的强制转弯和死胡同；另一个库存火药、箭、火绳、盔甲和备用矛杆；另一个检查水井、米库、盐和消防桶；另一个让泥水匠和木匠检查白墙、屋顶瓦片、谋杀洞和塔楼地板；另一个轮流在橹塔上值夜。另一个人沿着层层通道用弓、矛和火绳枪训练足轻。另一个让武士队长排练从主堡到外贝利的信号。进展不断推进，而鹿间仍保持可控、有偿付能力、无人居住、供应充足且足够平静，可以进行演习。它会因破产、占领、直接围困、严重动乱、严重破坏、商店耗尽、水井无法使用或最终建筑物消失而暂停。凭借强大的地面士气、强大的驻军力量、积极的军事领导、当地的繁荣、坚固的堡垒条件或最近的防御胜利，它可能会前进得更快。
      pre_winning_war 监听器代表了一个战役时刻，姬路的预备队、信使和受过城堡训练的船长支持一场即将获胜的战争；如果城堡本身没有受到威胁，它可以增加进度或提高士气。 ending_war听众代表战后回顾：返回横幅，伤亡名单，修复武器，以及纪律严明的驻军坚守岗位的证据，在光荣的胜利后增加进度，或者在战争暴露疏忽时暂停。
    completion_logic: >-
      完成需要十二个成功的进度单位，继续拥有和控制Shikama，最后的姬路城堡建筑，没有破产，没有直接围攻或占领，并且没有严重的当地动乱。最后的场景从第一个门开始。队长交出钥匙和名册；足轻展示缠绕方法；火绳枪兵从漏洞中发射空弹；井管理员在检查员之前提水；仓库职员读取大米和粉末的总数；木匠标记修理；赞助领主或指挥官爬到白色要塞接受最后的封印。一份公告下令在全国范围内效仿姬路模式：训练有素的驻军规模更大，预备队更清晰，城门纪律更好，并且知道每座城墙和塔楼都有一名指定的军官，从而提高了士气。通过将美丽的防御建筑转变为可重复的驻军纵深和士兵信心的学说，这一奇迹成为国家军事能力。
    failure_or_timeout_logic: >-
      没有普通的超时；当战争、维修或供应问题得到解决时，未完成的收据可能会暂停。失去鹿间、失去对场地的控制、最终建筑物的消失或永久无法维护城堡都会取消仪式并消除负担而没有奖励。破产立即暂停，因为未付工资的警卫和维修人员使收据失效。占领、直接围困、严重骚乱、严重破坏、水井破损、商店空空，或者道路被毁，都会阻碍进展。遥远的战争不会取消仪式，但到达鹿间的战争会暂停每月的工作；
      pre_winning_war只有在姬路充当安全锚的情况下才能提供帮助，而如果战争暴露出一支被忽视的驻军而不是一支纪律严明的驻军，ending_war应该暂停或惩罚进展。
    implementation_mapping:
      confirmation_trigger_script: 检查赞助商对鹿摩的所有权和控制权、最终独特的姬路城建筑存在、赞助商未破产、没有占领、没有直接围攻、没有严重动乱、可用的城堡供应或低破坏（如果存在可靠的检查）。
      start_effect_script: >-
        商店赞助商国家、鹿摩仪式地点、活动仪式标记、进度目标 12、当前进度为零、当前指挥官或统治者权限以及战争状态快照。应用临时城堡收据负担并每月注册pre_winning_war和ending_war听众。
      snapshot_effect_script: >-
        快照国家全球驻军规模修正、土地士气、人力或储备、军事传统/专业精神（如果有）、国库健康、战争压力和姬路当地占领、围困、动乱、破坏或繁荣、驻军实力、堡垒状况、军械库商店、油井可用性、供应通道和最终建筑存在。
      progress_effect_script: >-
        在每月的刻度上，添加大门收据、迷宫路线测绘、军械库库存、水井和大米审计、墙壁维修检查、夜班轮换、导弹演习或信号排练的进度。为高昂的士气、强大的驻军、当地的繁荣、良好的堡垒条件、军事领导力或最近的防御成功添加适度的奖励进展。在破产、占领、直接围困、严重动乱、严重破坏、空商店、无法使用的水井或最终建筑缺失的情况下暂停。在pre_winning_war和ending_war上，只有当城堡安全并且战争结果强化了驻军条令时才调整进度。
      completion_trigger_script: >-
        要求至少有12个成功的进度单位，继续赞助者对Shikama的所有权和控制，最终建筑仍然存在，没有破产，没有占领或直接围攻，没有严重的骚乱，并且没有主动的被忽视的驻军暂停战争审查。
      completion_effect_script: 移除临时负担，清除活跃的仪式进度和暂停变量，应用永久性姬路城国家修正，授予一次性军事准备奖励，并记录已接受的大门、检查的商店、水井和白堡的鹿间遗址记忆。
    intended_rewards:
      permanent_country_modifier: >-
        保留源修正方向：global_garrison_size_modifier仍然是核心，因为姬路成为全国更深、供应更好、有名的驻军的典范； land_morale_modifier 仍然是核心，因为士兵们信任一个系统，该系统的大门、商店、水井和射击位置都经过了演习和战争回顾的测试。后期的扩展应该加深驻军能力和士气，而不是增加不相关的外交、贸易或宫廷威望。
      one_time_reward: >-
        完成可以授予适度的军队传统、威望、人力恢复、当地驻军补充或军事经验。如果pre_winning_war或ending_war产生了干净的战役回顾，那么一次性奖励应该倾向于士气或军队传统；如果城堡在和平时期完工并拥有良好的库存，它可以倾向于当地战备和驻军补充。
      local_building_reward: >-
        Shikama应该保留白鹭收据记忆：接受的大门钥匙、绘制的进场转弯、检查的水井、库存的军械库、指定的值班轮换和修复的白色石膏要塞。后来的实施可以将其表达为当地的堡垒防御、更快的驻军恢复、防御者的围攻消耗率更低或战后抵抗破坏。
    notes: >-
      这将castle_receipt从即时扩展为定时，因为姬路的军事价值在于复杂城堡的运作纪律，而不是单独的城堡的视觉辉煌。每月蜱虫快检及演练； pre_winning_war 和 ending_war
      被保留，因为当战役获胜以及返回的部队证明驻军系统有效时，该仪式的教义得到验证。实施者应该让战争听众有条件，这样当姬路本身被占领或被忽视时，仪式就无法从战争中获得进展。
- id: 109
  key: unique_taj_mahal
  base_key: giant_necropolis
  location: agra
  source_ritual_key: royal_memorial_unsealing
  status: designed
  ritual_design_zh:
    title: 皇家纪念碑在月光下启封
    mode: timed
    historical_flavor: >-
      泰姬陵被视为一个王朝记忆机构，悲伤、大理石、花园几何、河光、手工艺赞助和帝国合法性被结合在一起。仪式聚集了统治者和王室成员、宫廷编年史家、卡迪斯或国家信仰法学家、《古兰经》背诵者或官方纪念神职人员、皮埃特拉·杜拉工匠、大理石抛光师、书法家、花园管理员、水道工程师、司库、施舍者、坟墓守卫、宫廷贵族以及为陵墓建造的工坊代表。他们穿过大门、查巴花园、倒影池、大理石基座、纪念碑室、清真寺、下巴、河边露台和阿格拉周围的作坊。这些物品包括密封的纪念卷、纪念碑面纱、灯、花环、施舍账簿、大理石抛光布、石镶嵌样品、书法板、花园水位和王朝家谱。该仪式属于泰姬陵，因为该建筑将私人哀悼转变为公共治国之道：王朝表明它可以以秩序纪念死者，向工匠支付报酬，维持天堂花园的对称性，并将帝国的爱和损失转化为持续的威望和合法性。
    duration: >-
      该仪式每月使用十六次支票。十二个月代表了一个完整的纪念年，包括朗诵、施舍、花园维护、大理石清洁、工艺检查、水利调整和法庭出庭。另外四项检查分别是纪念碑室的密封和启封、车间账目的审查以及王朝记忆的公开铭文。这改变了直接仪式的来源，因为皇家陵墓不会仅仅通过打开一次坟墓而变得具有政治权力；它通过反复、可见的关怀和宫廷纪律来获得力量。
    listeners:
    - monthly
    - ruler_death
    confirmation_logic: >-
      赞助商必须拥有并控制阿格拉，最后的泰姬陵建筑必须在那里存在，而且国家不能破产。阿格拉不得被占领、直接围困或严重动乱。花园、河滨和墓区应该是无障碍的；如果实施可以测试破坏、繁荣、供应隔离或河流/花园的可用性，那么严重的中断应该阻止确认或显示为故障线。赞助者应该有一个公认的法院和王朝或同等的裁决机构，能够赞助公共纪念馆。一场活跃的继承危机应该会阻碍确认，因为仪式将王朝记忆转变为合法性。其他地方的战争是可以接受的，但威胁阿格拉、中断工匠付款或使公共集会不安全的战争应该暂停或阻止。
    start_logic: >-
      起始效果记录了赞助国、作为仪式地点的阿格拉、现任统治者、纪念的王朝或王室（如果有代表性），以及继承或哀悼环境是否活跃。它快照了国家每月的合法性、每月的声望、稳定性、统治者的合法性或同等权威、财政状况、法院支出能力、当前的战争状况以及可供以后实施的任何艺术家/工匠或文化赞助指标。它还反映了阿格拉当地的情况：占领、围困、骚乱、破坏或繁荣、最终建筑的存在、花园和水的状况、工匠的存在以及进入亚穆纳河畔的通道（如果有）。为朗诵者、守卫、施舍、大理石抛光者、镶嵌修复、书法检验、园林劳动、水道维护、灯油、花卉供应和宫廷编年史者施加临时负担。这些快照应该让进展在破产或动乱的情况下暂停，并在测试王朝连续性的情况下让奖励朝着合法性扩展。
    progress_logic: >-
      每个月的听众滴答声都代表了具体的纪念义务。一个月内，朗诵者在清真寺和纪念碑室完成朗诵；另一个让花园管理员对齐卡巴格水道和倒影池；另一个有大理石抛光机清洁底座和室屏风；另一个让镶嵌工匠检查彼得拉杜拉花和书法边框；另一个记录了对寡妇、学者、工人和穷人的施舍分配；另一个让宫廷编年史家抄写纪念家谱；另一个审查车间工资，因此王朝被视为赞助人而不是剥削者；另一个测试河边通道和墓穴守卫轮换。进展不断推进，而阿格拉仍然受控、有偿付能力、无人居住、交通方便，并且对宫廷访客来说足够平静。它因破产、占领、直接围困、严重骚乱、严重破坏、花园供水系统破损、工匠无薪或最终建筑消失而暂停。凭借高合法性、高声望、稳定的继承、强大的财政、当地的繁荣、积极的宫廷赞助以及完整的花园或河流系统，它可能会更快地前进。
      ruler_death 听众具有特殊的力量：如果统治者在仪式期间去世并且继承有序，泰姬陵会将新的哀悼吸收到王朝的连续性中，从而增加进步和合法性规模。如果继承权受到争议，纪念碑就会在政治上变得危险，进展会暂停，直到法院可以在一份接受的命令中命名已故和在世的统治者。
    completion_logic: >-
      完成需要十六次成功的每月周期，继续拥有和控制阿格拉，泰姬陵的最后一座建筑，没有破产，没有直接围攻或占领，可进入的花园和坟墓，并且没有未解决的继承危机。最后一幕发生在月出时。经过一天的公共施舍后，大门打开了；贵族和工匠按等级进入查巴格；水映照着白色的圆顶；朗诵者完成纪念朗诵；财务主管展示密封的车间和施舍账簿；书法家揭晓检查过的匾额；纪念碑的面纱在看守下被揭开。统治者或公认的继承人在纪念册上盖上印章，并宣布王朝的悲伤被存放在大理石、花园、河流和合法的赞助中。这一奇迹变成了国家能力，因为合法性现在有了一个可见的王朝圣殿，而随着外国游客、贵族、诗人和工匠继续见证严格的帝国记忆，威望又重新出现。
    failure_or_timeout_logic: >-
      没有普通的超时；在战争或动乱期间，法庭哀悼和花园维护可能会暂停。失去阿格拉、失去对墓区的控制、最终建筑的消失或永久无法维护纪念碑都会取消仪式并消除负担而没有奖励。破产立即暂停，因为没有报酬的工匠、守卫、背诵者和施舍官员将王朝的爱情变成了丑闻。占领、直接围困、严重骚乱、严重破坏、花园水体破损、河边封闭或不安全的公众集会都会阻碍进展。如果继承有序，统治者死亡并不会取消仪式；可以加深纪念。有争议的继承会暂停进展，直到宫廷能够安全地呈现王朝的连续性。其他地方的战争只有在威胁到阿格拉、将国库耗尽到无法维持的水平或阻止宫廷和工匠出席时才会暂停。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对阿格拉的所有权和控制权，最终独特的泰姬陵建筑存在，赞助商没有破产，没有占领，没有直接围困，没有严重的骚乱，也没有未解决的继承危机。包括对低度破坏、花园或河边通道、工匠/法庭可用性以及安全公共集会（如果存在可靠触发器）的可选检查。
      start_effect_script: >-
        商店赞助国家、阿格拉仪式地点、统治者身份、活动仪式标记、十六个进度目标、当前进度为零以及任何纪念或哀悼背景。应用临时纪念馆维护负担并每月注册加上 ruler_death 听众。
      snapshot_effect_script: >-
        快照国家每月合法性、每月声望、稳定性、统治者合法性或同等权力、财政健康、法院赞助能力、战争状态和当地阿格拉占领、围困、动乱、繁荣或破坏、花园水状况、河边通道、工匠存在和最终建筑
      progress_effect_script: >-
        在每月的刻度上，添加背诵、charbagh 水对齐、大理石抛光、pietra dura 检查、施舍审计、家谱抄写、车间工资审查或墓守轮换的进度。为高合法性、声望、稳定的继承、财政实力、当地繁荣和完整的花园添加适度的奖励进展。由于破产、占领、直接围困、严重动乱、严重破坏、供水系统破损、工匠无薪、组装不安全或最终建筑缺失而暂停。在ruler_death上，仅当连续有序时才添加进度；否则设置暂停继承状态。
      completion_trigger_script: >-
        需要至少十六个成功的进度单位，继续赞助商拥有和控制阿格拉，最终建筑仍然存在，没有破产，没有占领或直接围困，没有严重的当地动乱，可用的纪念区，并且没有未解决的继承危机。
      completion_effect_script: >-
        消除临时负担，清除主动仪式进度和暂停变量，应用永久泰姬陵国家修正，授予一次性合法性或声望奖励，并记录月光下的开封、维护的花园、工匠登记册和王朝纪念账本的阿格拉遗址记忆。
    intended_rewards:
      permanent_country_modifier: >-
        保留源修改方向：monthly_legitimacy仍然是中心，因为泰姬陵为王朝提供了可见的、精心维护的记忆，可以稳定继承和统治； monthly_prestige 仍然是中心，因为大理石、对称花园、河光和赞助的工艺不断展现出帝国的精致。后期的扩张应该加深合法性和威望，而不是增加不相关的军事、贸易或转换效应。
      one_time_reward: >-
        完成可以带来适度的声望、合法性、稳定进展、宫廷满意度或文化/工匠赞助。如果ruler_death哀悼路径得到彻底解决，奖励应该倾向于合法性和继承接受；如果纪念年不间断地完成，它可以朝着阿格拉工匠和花园周围的声望和当地繁荣发展。
      local_building_reward: >-
        阿格拉应该保留皇家纪念账本记忆：维护的卡巴格通道、付费的大理石和镶嵌工匠、看守的衣冠冢室、施舍记录、河边通道和密封的王朝家谱。稍后的实施可以将其表达为当地繁荣、文化吸引力、宫廷哀悼周围的骚乱减少或继承冲击后更强的恢复能力。
    notes: >-
      这将royal_memorial_unsealing从即时扩展到定时，因为泰姬陵的历史功能是持续的王朝记忆、工匠赞助、花园维护和受控哀悼。每月的听众承担着这些重复的职责； ruler_death
      被保留，因为新的王室成员的去世可能会加强或破坏纪念秩序的稳定。实施者应将奖励重点放在合法性和声望上，而不是一般墓地的人力或税收上。
- id: 110
  key: unique_forbidden_city
  base_key: triumphal_axis
  location: dadu
  source_ritual_key: capital_transfer
  status: designed
  ritual_design_zh:
    title: 午门移册
    historical_flavor: >-
      紫禁城仪式不仅将大都/北京视为宫殿大院，而且将其视为国家认识自身的衡量中心。参加者有国君、太子或太子、礼部、六部、御史、翰林编修、侍卫、内务、宦门官、记朝历的天文士、地图吏、档案员、贡解释员、信使、粮税簿保管员，以及接受新都命令的各省代表团。他们聚集在午门、秩序井然的前院、外殿、档案室、哨所、鼓钟站，以及将公众观众与家庭统治分开的内门。这些物品包括印玺、黄册、贡卷、行省路线图、宫门钥匙、谒见牌位、侍卫名册、宫历、诏书、横幅、迁都文封等。这里特别属于紫禁城，因为它的红墙和严格的南北轴线使首都的运动成为一种行政几何学：每一个大门决定谁可以接近皇位，每个庭院确定等级，每个档案室让遥远的省份清晰可辨，每条信使路线都开始测量与皇帝封闭中心的距离。国家通过在观众秩序中体现合法性，并通​​过教导行省管理、军事报告、贡品接收和仪式时间从同一宫殿轴线向外传播，将奇迹转化为长期权力。
    mode: timed
    duration: >-
      使用十八个月的检查。十二个月代表了一个完整的仪式和财政年度，其中宫廷日历、税务登记、贡品时间表、粮食分配、快递阶段和省报告日期都在大都周围重新计算。剩下的六个月意味着档案、印章保管、家庭办公室、警卫轮换和观众礼仪从前政治中心到紫禁城的转移速度较慢。这有意改变了源头的直接仪式：资金转移可以在一天之内宣布，但行政范围只有在文员、卫兵、道路、档案、历法和省级官员都服从新轴心之后才能真正实现。
    listeners:
    - monthly
    - ruler_death
    confirmation_logic: >-
      赞助国必须拥有并控制大都，最后的紫禁城建筑必须在那里存在，国家不能破产。大都必须能够作为礼仪和行政中心使用：不被占领，不被直接围困，不遭受严重动乱，不与朝廷的主要道路、交通和粮食供应网络隔绝。如果实施可以区分当前资本和预期资本，那么大都应该已经是资本，或者是转移的有效目标，而不存在未解决的法律或王朝纠纷。统治者或公认的摄政王必须能够接待观众；持续的继承危机、被俘虏的统治者或无法召集各部委的法庭都应该阻止确认。其他地方的战争是允许的，但威胁大都、关闭旧都路线、阻止省代表团参加或使宫廷卫兵无法参加的战争应该阻止或警告。
    start_logic: >-
      起始效果记录了赞助国、作为仪式地点的大都、统治者、继承人或摄政（如果有代表性）、前首都或行政中心以及大都是否已经是正式首都。它反映了国家每月的合法性、现有的资本距离速度传播修正因子、稳定性、集权或行政范围、法院/内阁实力、财政健康状况、腐败或官僚压力（如果有）、战争状况、当前资本距离规则以及支付法院费用的能力。它反映了大都当地的情况：占领、围困、动乱、破坏或繁荣、最终建筑的存在、宫殿轴线的完整性、警卫的可用性、档案容量、大门通道以及道路、邮政或粮道的安全。临时负担搬迁档案、封箱、供养各省使团、饷文士、图吏、住宿各部、维持宫廷侍卫、修理城门、排练朝见、以及向遥远的省份颁发复旨。这些基线值稍后应允许有序管理的进度奖励，并允许在宫殿物理安全但国家无力使其正常运行时进行失败检查。
    progress_logic: >-
      每个月的监听器滴答声代表特定的转移职责，而不是一般的庆祝活动。礼部每月排练午门行列，使诸侯、大臣、武将、朝贡使节、各省使节都站在正确的院落里。又过了一个月，档案员清点了黄色登记册、土地税卷、人口名单、贡品账目和旧资本备忘录，然后将它们密封在编号的箱子中。又一个月，地图工作人员重新绘制了省级报告路线，以大都作为测量距离和快递延误的点。再过一个月，宫殿守卫就会收到大门钥匙、名册平板电脑、值班时间表和警报信号。又一个月，天文局和法庭日历官员重新计算接见日、祭祀日、市场关闭和派遣日期。接下来的一个月，内阁文员测试了从王位法令到内阁副本、审查审查、快递发送、省级收据和退回奏折的整个链条。其他的事项还包括粮食供应审计、进贡宿舍准备、鼓钟信号检查、封印保管宣誓、军事旗帜登记以及复制档案复制，以防火灾或叛乱袭击宫殿。进展不断推进，而大都仍然受到控制、有偿付能力、法庭集会安全，并且与可以向外传送法令的路线相连。在破产、直接围困、占领、严重动乱、严重破坏、路线封闭、无薪职员、宫殿守卫短缺或最终建筑损失等情况下，它会暂停。当合法性和稳定性高、金库强大、官僚机构集中、地方繁荣程度高、通往前首都的路线仍然安全、法院已经拥有强大的行政影响力时，它可能会加速。
      ruler_death听众测试紫禁城的中心前提：如果继承是有序的，新统治者将沿着同一轴进行登基观众，证明合法性和命令在死亡后仍然存在，并增加进度或奖励规模。如果继承权存在争议，仪式就会暂停，直到王位、封印和档案保管被公开接受。
    completion_logic: >-
      完成需要十八个成功的进展单位，继续拥有和控制大都，最后的紫禁城建筑，没有破产，没有占领或直接围攻，安全的宫殿组装，可用的档案办公室，以及没有未解决的继承危机。最后一幕是黎明时的宫廷观众。宫卫依次打开午门；鼓声和钟声标志着时间；礼部领大臣、御史、校尉、档案员、贡解释员、各省使节入等朝廷。皇玺被带到宝座前；路线图和黄色登记册以密封的包裹形式展示；统治者或公认的摄政王在宫殿屋顶下接收首都登记册。法令从大门宣读，并立即由部门抄写员、监察官员、信使和省级信使抄写。这一象征性的行为不仅仅是坐在宫殿里：它证明了等级、记录、时间、守卫、法令、贡品和距离现在都通过一个纪律严明的中心。这一奇迹变成了国家能力，因为每月的合法性与可见的法庭命令息息相关，而更快的首都距离传播反映了衡量紫禁城报告和命令的新行政习惯。
    failure_or_timeout_logic: >-
      没有普通的超时；这种仪式可能会暂停，因为真正的资本转移往往会在中断后继续存在，但它无法通过虚构来完成。失去大都、失去对宫殿区域的控制、最终建筑被毁坏或拆除，或者永久无法召集宫廷，都会取消仪式并消除其负担，而无需奖励。破产立即暂停，并可能在长期破产后取消，因为未付工资的警卫、饥饿的代表和废弃的档案使转让不合法。占领、直接围困、严重骚乱、严重破坏、道路封闭、封锁粮食或快递路线、失去宫殿守卫或关闭大门和档案室都会使进展暂停。只有当继承权存在争议时，统治者的死亡才会暂停；有序加入可以成为转让的一部分。战争只有在威胁到大都、封锁前都路线、消耗朝廷预算、或阻止省级报告和朝贡代表团到达皇宫时才会中断仪式。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对大都的所有权和控制权，最终独特的紫禁城建筑存在，赞助商没有破产，没有占领，没有直接围困，没有严重的动乱，并且有一个有效的朝廷能够集结。包括检查或警告大都是否为当前或有效的目标首都，没有未解决的继承危机，路线和粮食/快递通道，以及没有直接威胁宫殿或前首都转移路线的战争状况。
      start_effect_script: >-
        商店赞助国，大都仪式地点，现任统治者和继承人或摄政，前首都或行政中心，活跃的仪式标记，进度目标十八，当前进度为零。将临时资金转移负担应用于档案、警卫、抄写员、路线、代表团住宿、大门维护、观众排练和复制法令。每月注册和
        ruler_death 听众。
      snapshot_effect_script: >-
        每月快照合法性、现有首都距离传播、稳定性、集权或行政范围、法院/内阁实力、财政部健康状况、官僚压力、战争状态、首都状况和当地大都占领、围困、动乱、破坏或繁荣、最终建筑存在、宫殿轴线完整性、大门和档案通道、警卫可用性和路线安全。
      progress_effect_script: >-
        在每月的刻度上，添加一项具体任务的进度：观众等级排练、档案库存、印章转移、地图重绘、警卫名册安装、日历重新计算、法令链测试、粮食审计、进贡宿舍准备、鼓钟信号检查或复制档案复制。为强大的合法性、稳定性、财政、集权、地方繁荣、安全的路线和良好的行政影响力增加额外的进步。由于破产、占领、围困、严重动乱、路线封闭、警卫短缺、职员无薪、集会不安全或最终建筑缺失而暂停。在ruler_death上，添加有序登基进度或设置继承暂停状态。
      completion_trigger_script: >-
        要求至少有十八个成功进度单位，继续赞助者对大都的所有权和控制权，最终建筑仍然存在，没有破产，没有占领或直接围攻，没有严重动乱，可用的宫门和档案，安全的路线访问，没有未解决的继承危机。
      completion_effect_script: >-
        消除临时转移负担，清除主动仪式进度和暂停变量，应用永久紫禁城国家修正，授予一次性合法性或行政奖励，并为转移的登记册、接受的印章、排序的午门观众、信使路线图和宫殿守卫名册记录大都遗址记忆。
    intended_rewards:
      permanent_country_modifier: >-
        完全保留主题中的源修正：monthly_legitimacy代表朝廷反复公开确认统治者、档案、印章和观众等级占据同一神圣和行政中心； global_distance_from_capital_speed_propagation
        代表从大都向外重新计算的法令、奏折、税务报告、进贡时间表和信使期望。后期的扩展应该加深合法性和行政范围，而不是将宫殿变成通用的税收、贸易或军事建筑。
      one_time_reward: >-
        完成后可以授予适度的合法性脉搏、稳定进展、行政能力、法院满意度或暂时减少首都距离惩罚。如果在仪式期间发生有序的ruler_death继位，则一次性奖励应倾向于合法性和继承接受；如果转移在没有路线或档案中断的情况下完成，它可以倾向于行政范围和更快的省级响应。
      local_building_reward: >-
        大都应该保留午门记忆的首都登记册：密封的档案室，接受的皇帝印章，与宫廷对齐的部委办公室，门口的警卫名单，重新计算的信使地图，以及省代表见证转移的公共记录。后来的实施可以将其表现为当地繁荣、减少首都动荡、更好地抵御继承冲击或增强宫殿周围的行政吸引力。
    notes: >-
      源仪式是直接的，但这种设计使用每月定时的进展，因为紫禁城的历史功能是宫廷、档案、警卫、历法和路线系统的缓慢机构搬迁。包含 ruler_death 侦听器是因为宫殿轴线只有在不破坏封印监护或省级命令的情况下能够进行继承时才能证明其合法性。实施者应避免允许自由资本流动，除非其他地方已经支持，并应强调命令传播和宫廷合法性而不是粮食物流作为主要奖励，从而与大运河区分开来。
- id: 111
  key: unique_topkapi_palace
  base_key: palace_of_nations
  location: constantinople
  source_ritual_key: conquest_entry
  status: designed
  ritual_design_zh:
    title: 幸福之门征服入口
    mode: timed
    historical_flavor: >-
      托普卡普皇宫将君士坦丁堡的征服变成了中央统治和外交承认的日常编排。仪式聚集了统治者、大维齐尔、高级议员、大法官文士、财务官员、禁卫军指挥官、宫廷侍从、内部导师、守门人、宫殿厨房厨师、乌里玛、法官、文物保管员、博斯普鲁斯海峡和金角湾的海军军官、外国大使、贡使、译员和新隶属城市社区的代表。他们穿过帝国之门、第一宫廷、致敬之门、设有议事厅和厨房的第二宫廷、金库、觐见室和幸福之门，从被征服的城市到主权者的通道都变窄了。这些物品包括征服旗帜、城市钥匙、外交信件、进贡账簿、国库印章、荣誉袍纺织品、禁卫军工资单、议会登记册、遗物封面、食物分配清单和观众平板电脑。这个仪式属于托普卡帕宫，因为这座宫殿不仅是一个住所，也是一座宫殿。它是一个舞台机器，决定谁可以接近统治者，请愿书如何成为法令，外国使节​​如何了解新帝国的等级制度，以及军事征服如何纳入法庭程序。当宫廷使士兵、大臣和省份都能看到中央集权，而其受控制的受众使外人将征服者视为合法的外交平等者时，这种奇迹就变成了长期的权力。
    duration: >-
      使用十六个月的支票。前八个月代表了征服宫殿秩序的解决：大门进入、警卫轮换、议会席位、金库保管、厨房供应、文物展示、城市社区请愿书和禁卫军薪酬纪律。后八个月代表外向的外交计划：使馆接待、翻译礼节、贡品登记、礼服仪式、海军进场安保、大法官副本、省级任命接见以及最终通过幸福之门。这改变了源头的直接仪式，因为征服者可以立即进入一座城市，但集权和外交声誉取决于反复的观众，教会每个访客如何新法院的运作。
    listeners:
    - monthly
    - ruler_death
    confirmation_logic: >-
      赞助国必须拥有并控制君士坦丁堡，最后的托普卡普皇宫建筑必须在那里存在，而且国家不能破产。君士坦丁堡不得被占领、直接围困，或在宫殿区遭受严重骚乱。博斯普鲁斯海峡和金角湾航道对于使节和贡船应该足够安全，宫殿大门、议事厅、金库、厨房和谒见室必须可以使用。公认的统治者、摄政王或征服王朝必须能够接受请愿书和大使；活跃的继承危机或被俘虏的统治者应该会阻止确认。如果宫廷仍然可以集会，战争是可以接受的，但直接威胁君士坦丁堡、切断出海通道、阻止使馆出席或消耗宫殿工资所需国库的战争应该阻止或警告。
    start_logic: >-
      起始效果记录了赞助国、作为仪式地点的君士坦丁堡、当前的统治者、继承人或摄政（如果有），以及该城市最近是否被征服或发生政治争议。它快照monthly_towards_centralization、外交声誉、合法性、稳定性、集权或国家权威、战争状态、财政状况、军队忠诚度或警卫可靠性（如果有）、外交关系压力、特使能力和法庭支出。它还反映了当地的情况：占领、围困、动乱、破坏或繁荣、最终建筑的存在、宫殿大门的进入、议会厅的可用性、金库保管、厨房供应、博斯普鲁斯海峡和金角湾的安全以及外国使节的安全住宿。为禁卫军薪酬游行、荣誉长袍纺织品、大使住宿、翻译、宫殿厨房、国库展示、议会复印、门卫和游行维护施加临时负担。这些快照应该让进展随着有序的中央权威和外交出席而扩大，并在征服仍然是军事占领而不是宫廷政府时暂停。
    progress_logic: >-
      每个月的刻度代表一个宫殿程序。一个月后，皇门在守卫下打开，同时展示了城市钥匙和征服旗帜，这证明入口现在是由宫廷当局控制的，而不是战场上的临时决定。再过一个月，禁卫军指挥官和军饷职员会在外宫检查人员名单，这样赢得这座城市的军队就可以享受正常的宫廷军饷。一个月后，第二法院确定了座位顺序，维齐尔、法官、财务官员和抄写员了解请愿书在哪里成为法令。又一个月，财政部官员封存了征服的贵重物品和荣誉长袍纺织品，将公共奖励与私人掠夺分开。接下来的一个月，厨房从记录的商店中为使节、守卫、请愿者和宫廷仆人提供食物，将慷慨变成了一个经过审计的机构。接下来的一个月，译员们要排练大使馆礼仪、信件翻译和礼物登记。其他的问题还包括文物展示、省级任命观众、博斯普鲁斯海峡沿岸的海军安全、大法官抄写法令、为被征服社区举行投诉听证会，以及严格限制通往幸福之门的通道。在宫殿保持安全、有偿付能力、可供议会和特使访问、并有能力为公务员提供食物和报酬的同时，进展不断推进。它因破产、占领、围困、严重动乱、宫门关闭、金库纠纷、卫兵叛变、厨房欠薪、入海受阻或最终建筑缺失而暂停。合法性高、中央集权强、警卫可靠、国库稳定、地方繁荣、海峡安全、外国使节活跃，它可能会加速发展。
      ruler_death 听众很重要，因为托普卡普集权是通过继承来检验的：幸福之门前有序的加入观众会增加进度并加强奖励规模，而有争议的继承会暂停，直到大使、卫兵和部长知道他们在为谁服务。
    completion_logic: >-
      完成需要十六个成功的进展单位，继续拥有和控制君士坦丁堡，最后的托普卡普建筑，没有破产，没有直接围攻或占领，安全的宫殿大门，可用的议会和观众空间，并且没有未解决的继承危机。最后的场景是一个分阶段的征服入口，从帝国之门开始，到幸福之门结束。禁卫军把外宫按顺序排列；市和省请愿者提交书面请求；长沙发接待大使和口译员；国库展示着密封的礼物和荣誉长袍；海军军官报告海峡安全；统治者或公认的摄政王在朝堂中接见经过宫廷每一层秩序的选定使者。一份公告指出，征服已经作为一场战役结束，现在继续作为法律、议会、财政部、警卫纪律和外交。这一奇迹变成了国家能力，因为中央集权是通过皇宫不断将武装胜利转化为服从的办公室的能力而进步的，而外交声誉的提高是因为外国宫廷经历了一个自信、清晰和礼仪的皇室。
    failure_or_timeout_logic: >-
      没有正常的超时；征服条目可以暂停，直到秩序恢复。失去君士坦丁堡、失去对宫殿区的控制、最终建筑的消失或永久无法举行宫廷都会取消仪式并消除其负担而无需奖励。破产立即暂停，因为禁卫军拖欠工资、饥饿的厨房、无人提供的使节和未密封的国库将仪式变成了危险。占领、直接围困、严重骚乱、大门关闭、金库被扣押、卫兵叛变、博斯普鲁斯海峡或金角湾通道受阻，或不安全的使节住宿会导致进度暂停。统治者死亡且已被接受的继任者可以作为继任观众纳入仪式中；由于大使和省级官员无法承认一个无法指定其统治者的中央集权法院，因此有争议的继承问题暂停了。其他地方的战争只有在威胁到城市、耗尽国库或阻止大使馆和省级任命参加时才会中断。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对君士坦丁堡的所有权和控制权，最终独特的托普卡普建筑存在，赞助商没有破产，没有占领，没有直接围困，没有严重的当地动乱，并且有一个有效的统治者或摄政能够主持法庭。包括安全进入博斯普鲁斯海峡或金角湾、可用的宫殿大门、议会厅、金库、厨房、接见室、没有未解决的继承危机以及不直接威胁宫殿的战争的检查或警告。
      start_effect_script: >-
        商店赞助国、君士坦丁堡仪式地点、统治者和继承人或摄政、活动仪式标记、十六个进度目标、当前进度为零，以及最近征服或有争议的城市背景（如果有）。承担警卫、厨房、口译员、大使、荣誉袍纺织品、金库展示、议会复印和游行维护的临时负担。每月注册和ruler_death听众。
      snapshot_effect_script: >-
        快照monthly_towards_centralization、外交声誉、合法性、稳定性、集权或国家权威、财政健康、战争状态、军事忠诚或警卫可靠性、特使能力、外交压力和当地君士坦丁堡占领、围困、动乱、破坏或繁荣、最终建筑的存在、大门进入、议会可用性、金库保管、厨房供应、海峡安全、使节住宿。
      progress_effect_script: >-
        在每月的刻度上，增加具体宫殿职责的进展：受控的帝国大门进入、禁卫军工资审查、沙发座位、金库密封、厨房审计、大使馆翻译排练、文物展示、省级任命观众、海峡安全报告、大法官复印、被征服社区请愿听证会或幸福之门进入排练。为高合法性、稳定的国库、强大的中央集权、可靠的守卫、当地的繁荣、安全的出海通道和活跃的使节增加奖励进度。在破产、占领、围困、严重骚乱、通道受阻、卫兵叛变、金库纠纷、不安全的使节住宿或丢失最终建筑的情况下暂停。在ruler_death上，添加有序加入的进度或设置继承暂停状态。
      completion_trigger_script: >-
        需要至少十六个成功的进度单位，持续赞助者对君士坦丁堡的所有权和控制，最终建筑仍然存在，没有破产，没有占领或直接围困，没有严重的骚乱，安全的宫殿大门，可用的议会和观众空间，安全的特使通道，并且没有未解决的继承危机。
      completion_effect_script: >-
        删除临时征服进入负担、清除主动仪式进程和暂停变量、应用永久托普卡普国家修正、授予一次性集中或外交奖励，并记录征服旗帜、沙发座位登记册、国库印章、禁卫军工资单、荣誉袍分类账和幸福之门观众协议的君士坦丁堡站点记忆。
    intended_rewards:
      permanent_country_modifier: >-
        保留源奖励方向。 monthly_towards_centralization 代表托普卡普的分层法庭、长官办公室、金库保管、警卫纪律和宫廷家庭，将征服转变为对中心的定期服从。 diplomatic_reputation
        代表了外国大使、贡使和翻译体验宫廷礼仪的方式，宫廷可以接受礼物、答复请愿并表达主权信心。后期的扩展应该加深这两个主题，而不是增加不相关的税收、人力或转换效应。
      one_time_reward: >-
        完成后可以授予适度的集权脉冲、合法性、外交声誉进步、与出席使节的关系改善、宫廷满意度或临时使节接待强度。如果在仪式期间解决了ruler_death的加入问题，那么一次性奖励应该倾向于合法性和外交承认；
      local_building_reward: >-
        君士坦丁堡应该保留幸福之门入境登记册的记忆：订购的宫殿大门、经过审计的禁卫军工资、密封的国库展示、工作沙发室、荣誉袍库存、使节住宿、翻译记录和海峡安全报告。后来的实施可以将其表达为当地宫廷的繁荣、宫殿服务方面的骚乱减少、更好的特使接待或继承或征服合法性受到挑战时的弹性。
    notes: >-
      源仪式是直接的，但这种设计使用定时进度，因为托普卡普的力量来自于使征服可以作为宫廷例行公事重复进行。每月的听众承载着具体的宫廷行政和外交；保留ruler_death是因为加入观众是集中化和外国认可的关键考验。实施者应该将奖励集中在集权倾向和外交声誉上，并且应该避免将仪式作为通用的征服胜利奖励或海军控制仪式，尽管博斯普鲁斯海峡的背景如此。
- id: 112
  key: unique_st_peters_basilica
  base_key: sky_dome_grand_temple
  location: rome
  source_ritual_key: dedication
  status: designed
  ritual_design_zh:
    title: 使徒门槛奉献
    mode: timed
    historical_flavor: >-
      圣彼得大教堂被视为使徒中心的机构奉献，而不是作为大圆顶下的单个弥撒。仪式聚集了统治者或教皇赞助人、红衣主教、主教、大教堂教士、教廷公证人、忏悔神父、圣物保管人、圣器保管员、唱诗班指挥、赎罪券和施舍官员、行会艺术家、大理石工人、瑞士人或宫廷守卫（如果有）、城市治安官、兄弟会领袖、来自赞助者自己信仰的朝圣者，以及统治者希望在罗马得到承认的特使。他们穿过中庭和大门、中殿、小教堂、彼得墓上方的忏悔室、高坛、唱诗班座位、圣器收藏室、金库、朝圣者宿舍，以及穹顶下的空间，那里是使徒记忆、艺术辉煌和普遍主张的交汇处。这些物品包括祭坛石块、圣油、圣物清单、大教堂钥匙、教皇或皇家公牛、朝圣徽章、唱诗班书籍、蜡烛、忏悔灯、施舍账簿、行会合同、法衣和密封的神职人员义务清单。这个仪式属于圣彼得大教堂，因为这座建筑使使徒的坟墓成为神职人员、朝圣者、艺术家和君主的功能秩序。它的长期权力不仅仅是敬畏：大教堂教导赞助者自己的信仰主体，神圣的权威可以接收他们，宽恕他们，组织他们的奉献，纪律其神职人员，并将有关教义或赞助的争议转化为使徒门槛上的可见服务。
    duration: >-
      使用十五个月的检查。十二个月代表一个完整的礼拜年，在这一年里，大教堂证明日常办公、朝圣季节、使徒盛宴、忏悔通道、施舍分配、唱诗班秩序和神职人员出席都可以维持。剩下的三张支票代表了最后的奉献行为：密封祭坛文物、公布神职人员的义务以及向朝圣者开放主要门槛。这改变了直接奉献的来源，因为大教堂可以在一次仪式中祝圣，但真正的信仰宽容和神职人员的满意度来自反复的牧师访问、纪律严明的文书服务和可见的奉献管理。
    listeners:
    - monthly
    - ruler_death
    confirmation_logic: >-
      赞助国必须拥有和控制罗马，最后的圣彼得大教堂建筑必须在那里存在，而且国家不能破产。罗马不得被占领、直接围困或严重动乱，大教堂区域必须向神职人员和朝圣者开放。赞助者应遵循、保护或正式赞助大教堂所服务的信仰；如果赞助商的国教对该网站怀有敌意，则应阻止确认或要求以后实施明确支持的特殊容忍路径。神职人员阶层或同等宗教机构必须能够参与，并且不得公开叛乱。朝圣道路和城市旅馆应该可用；只有在罗马保持安全、神职人员可以旅行、可以支付施舍和维持费用的情况下，其他地方的战争才是可以接受的。继承危机或有争议的教皇/神职人员权威应该阻止确认，因为奉献取决于公认的宗教等级制度。
    start_logic: >-
      起始效果记录了赞助国、作为仪式地点的罗马、现任统治者或教皇赞助商、占主导地位的国家信仰、参与的神职人员或宗教机构，以及继承、教会纠纷或最近的骚乱是否活跃。它反映了国家tolerance_own、clergy_estate_target_satisfaction、稳定性、宗教团结或信仰凝聚力（如果有）、神职人员的影响力和满意度、财政健康、声望或类似虔诚的权威（如果有）、战争状况以及资助礼拜仪式和施舍的能力。它反映了罗马当地的情况：占领、围困、动乱、破坏或繁荣、最终建筑的存在、朝圣者通道、大教堂大门、高坛和忏悔室的可用性、圣器收藏室和金库的安全、唱诗班人员配备以及神职人员的可用性。临时负担蜡烛、香、祭坛布、唱诗班津贴、警卫、圣物保管、朝圣者宿舍、施舍分配、公证复印、大理石清洁、教堂维修和神职人员住宿。这些快照应该让信仰凝聚力和神职人员合作取得进展，同时如果赞助商可以拥有罗马但无法提供可信的宗教服务，则暂停。
    progress_logic: >-
      每个月的听众滴答声都是奉献年的具体行动。圣器管理员会在一个月内清点圣物、钥匙、祭坛器皿、法衣和忏悔灯，这样就没有人可以指责赞助者将使徒圣地视为掠夺品。接下来的一个月，主教和教士们排练从大门到高祭坛的奉献游行，确定谁携带圣油、圣物、蜡烛和唱诗班书籍。再过一个月，唱诗班指挥将在圆顶下设立日常办公室，证明大教堂将听起来像一座活生生的教堂，而不是一座空荡荡的纪念碑。再过一个月，忏悔神父和朝圣者官员将控制进入彼得墓的通道，并安排宿舍、徽章、队列和警卫，以免虔诚的活动变得混乱。接下来的一个月，救济官员会审核对穷人、旅行朝圣者、神职人员和维修工人的募集和分配情况。其他问题可以包括侧教堂分配、行会艺术家付款、大理石和人行道清洁、神职人员出勤记录、节日人群控制、主教给各省的信件、赦免或赦免记录审查（如果适用）以及城市治安官和教会官员之间投诉的调解。进展不断推进，而罗马仍保持可控、有偿付能力、平静、平易近人，并能够接待赞助者信仰的神职人员和朝圣者。由于破产、占领、围困、严重动乱、朝圣道路关闭、神职人员庄园充满敌意、唱诗班或警卫无薪、文物安全丑闻、旅馆不安全或最终建筑缺失，它暂停了。它可能会因高真实信仰宽容、高神职人员满意度、强大稳定性、当地繁荣、安全的朝圣路线和慷慨的施舍而加速。
      ruler_death 听众代表使徒墓前的安魂曲和继承祈祷：有序的继承可以通过表明大教堂将王朝的死亡纳入教会秩​​序来增加进步，而有争议的继承则暂停，因为神职人员无法围绕分裂的主权奉献团结。
    completion_logic: >-
      完成需要十五个成功的进展单位，继续拥有和控制罗马，最后的圣彼得大教堂，没有破产，没有占领或直接围攻，安全的朝圣者通道，神职人员的参与，可用的祭坛和忏悔，以及没有未解决的宗教或继承危机。最后的场景在黎明前开始，守卫打开大教堂的大门，朝圣者手持蜡烛和徽章有序排队等待。红衣主教和主教穿过中殿；唱诗班书籍在摊位上回答；文物保管人展示密封的库存；施舍官员出示账簿；行会大师站在清洁的大理石和教堂旁；统治者、教皇或公认的赞助人在彼得坟墓上方的高祭坛前确认神职人员的义务。圣油标志着祭坛，大教堂的钥匙被委托给神职人员，并向朝圣者宣读奉献法令并为各省抄写。具有象征意义的举动是，使徒坟墓现在管理着一个服务网络：神职人员职责、朝圣者通道、施舍、艺术品维护和主权要求都在穹顶下进行。这一奇迹变成了国家能力，因为自己的信仰主体看到了奉献和赦免的有序渠道，而神职人员阶层获得了一个享有声望但纪律严明的中心，其满足感取决于服务，而不是不受限制的特权。
    failure_or_timeout_logic: >-
      没有普通的超时；奉献仪式可以因战争、瘟疫般的破坏（如果建模）或教职争议而暂停，但在神社关闭时无法完成。失去罗马、失去对大教堂区域的控制、最终建筑消失或永久拒绝相关神职人员参加都会取消仪式并消除负担而没有奖励。破产立即暂停，因为唱诗班、警卫、旅馆、工匠和施舍官员拖欠工资，使神圣秩序看起来腐败。占领、直接围困、严重骚乱、道路封闭、朝圣者宿舍失败、文物丑闻、敌对神职人员叛乱或不安全的公共礼拜都会阻碍进展。只有当继承权存在争议时，统治者的死亡才会暂停；有序的安魂曲和就任祈祷可以加强奉献精神。当其他地方的战争阻碍朝圣者旅行、消耗维护资金或阻止主教和红衣主教在罗马集会时，战争就会中断。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对罗马的所有权和控制权，最终独特的圣彼得大教堂存在，赞助商没有破产，没有占领，没有直接围困，没有严重的当地动乱，以及参与的神职人员或国家信仰机构能够参加。包括对赞助商信仰兼容性的检查或警告，没有敌对的神职人员叛乱，朝圣者的安全通道，可用的大教堂祭坛和门，以及没有未解决的继承或宗教权威危机。
      start_effect_script: >-
        商店赞助国、罗马仪式地点、统治者或教皇赞助商、国家信仰、神职人员庄园或宗教机构、活动仪式标记、进度目标十五、当前进度为零。将临时奉献负担应用于礼拜仪式、唱诗班、警卫、文物保管、宿舍、施舍、公证、大理石清洁、教堂维修和神职人员住宿。每月注册
        ruler_death 听众。
      snapshot_effect_script: >-
        快照 tolerance_own、clergy_estate_target_satisfaction、稳定性、宗教团结或信仰凝聚力、神职人员影响力和满意度、国库健康、声望或虔诚权威、战争状态和罗马当地占领、围困、动乱、破坏或繁荣、最终建筑存在、朝圣者通道、大教堂大门、高坛和忏悔可用性、圣器收藏室和国库安全、唱诗班人员配置和神职人员的可用性。
      progress_effect_script: >-
        在每月的刻度上，增加具体大教堂职责的进展：圣物库存、游行排练、唱诗班办公室建立、告解和朝圣者准入监管、施舍审计、教堂分配、艺术家和大理石付款、神职人员出勤名册、节日人群控制、省级牧函、赦免或赦免记录审查或城市教会投诉调解。为高真实信仰宽容、满意的神职人员、稳定、当地繁荣、安全路线和慷慨施舍添加奖励进度。由于破产、占领、围困、严重骚乱、敌对神职人员、朝圣路线关闭、服务人员无薪、文物丑闻、旅馆不安全或最终建筑缺失而暂停。在ruler_death上，添加有序安魂曲的进度或设置继承暂停状态。
      completion_trigger_script: >-
        需要至少十五个成功的进度单位，对罗马的持续赞助者所有权和控制权，最终建筑仍然存在，没有破产，没有占领或直接围困，没有严重的骚乱，安全的朝圣者通道，参与的神职人员，可用的祭坛和忏悔，并且没有未解决的继承或宗教权威危机。
      completion_effect_script: >-
        移除临时奉献负担，清除主动仪式进度和暂停变量，应用永久圣彼得国家修正，给予一次性宽容或神职人员满意奖励，并记录专用祭坛、使徒坟墓访问、圣物库存、唱诗班办公室、施舍账本、朝圣者宿舍和神职人员义务法令的罗马遗址记忆。
    intended_rewards:
      permanent_country_modifier: >-
        保留来源修正方向。 tolerance_own 代表大教堂，为自己的信仰对象提供一个稳定的使徒中心，用于忏悔、朝圣、宴会、施舍和共享神圣记忆。 clergy_estate_target_satisfaction
        代表主教、教士、圣器管理员和宗教官员，他们在公共礼拜中享有声望、资金支持和明确义务的角色。后期的扩展应该加强真实信仰的凝聚力和神职人员的满意度，而不是将大教堂转化为一般的声望、转换权力或税收收入。
      one_time_reward: >-
        完成可以给予稳定进步、真实信仰宽容、神职人员满意度、威望、宗教团结或罗马当地朝圣和施舍的繁荣的适度脉搏。如果发生了ruler_death安魂曲并且继承保持有序，那么奖励应该倾向于稳定性和自我信仰宽容；如果神职人员始终保持高度满意，则可以倾向于神职人员财产满意度和宗教权威。
      local_building_reward: >-
        罗马应该保留使徒阈值奉献记忆：彼得墓上的专用祭坛，打开朝圣者之门，审计施舍，唱诗班办公室，文物清单，神职人员义务法令，安全旅馆和维护的教堂。后来的实施可以将其表达为朝圣带来的当地繁荣、自身信仰社区的骚乱减少、神职人员服务能力更强或宗教纠纷期间的恢复能力。
    notes: >-
      源仪式是直接的，但这种设计使用了定时进度，因为圣彼得的历史功能取决于礼拜仪式、朝圣、施舍、神职人员服务和圣物保管的完整周期。每月听众承担这些职责；包含ruler_death是因为安魂曲和继承祈祷是对大教堂是否稳定信仰社区的有意义的测试。实施者应将奖励保留在个人信仰宽容和神职人员财产满意度上，并避免与圣索菲亚大教堂的帝国圆顶稳定主题或后来的修道院/图书馆设计过多重叠。
- id: 113
  key: unique_lalibela_churches
  base_key: sacred_mountain
  location: lalibela
  source_ritual_key: holy_city_pilgrimage
  status: designed
  ritual_design_zh:
    title: 石凿十字架的新耶路撒冷朝圣
    historical_flavor: >-
      拉利贝拉教堂的仪式将高地遗址视为雕刻在活岩上的埃塞俄比亚新耶路撒冷。参与者包括统治者或王室赞助人、埃塞俄比亚东正教牧师、执事、僧侣、抄写员、塔博特保管人、抬十字架者、鼓手和西斯特拉吟唱者、隐士、当地凿石家庭、水卫士、高地酋长、赞助者自己信仰的朝圣者、派往边境社区的传教员以及分配到峡谷和引路的警卫。他们在岩石凿成的教堂、凹陷的庭院、战壕、隧道、雕刻的门廊、Bet
      Medhane Alem、Bet Maryam、Bet Golgotha、Bet Giyorgis、象征性的约旦河道、仪式池、手稿室和高地城镇周围的朝圣者营地之间移动。这些物品包括游行十字架、包裹的塔博特、福音书、祈祷棒、香、鼓、灯油、洗礼水、雕刻的门槛标记、朝圣杖、面包和蜂蜜啤酒用品，以及神职人员将把仪式带回家的村庄名单。这属于拉利贝拉，因为教堂不仅仅表现出虔诚；他们制作了一张朝圣地图，将耶路撒冷、各各他、约旦河、皇室的赞助和当地的岩石变成了一个可以进入的神圣地理区域。国家通过利用这条线路来培训神职人员、接待朝圣者、调和高地社区，并将十字架、圣歌、洗礼水和圣城记忆的重复模式送回家，从而将奇迹转化为长期的宗教能力，这些模式支持皈依，同时让自己的信仰对象感到聚集而不是受到胁迫。
    mode: timed
    duration: >-
      每月进行十四次检查。十二个月代表了埃塞俄比亚完整的礼拜和朝圣年，包括主要节日、斋戒季节、洗礼、禁忌游行、手稿阅读以及朝圣者在干燥和多雨的高原条件下的移动。另外两项检查代表最终的王室或神职人员的誓言，以及派遣训练有素的传教员和传道员返回边境社区。这改变了直接朝圣的来源，因为只有在重复的路线、住宿、水仪式、圣歌和村庄神职人员网络证明奉献可以在雕刻的教堂之外再现之后，圣城才在政治上变得有用。
    listeners:
    - monthly
    - ruler_death
    confirmation_logic: >-
      赞助国必须拥有并控制拉利贝拉，最后的拉利贝拉教堂建筑必须在那里存在，而且国家不能破产。拉利贝拉不得被占领、直接围困或发生严重的局部骚乱。高地朝圣道路、沟壑、战壕、教堂入口、水源和朝圣者营地必须对牧师和普通朝圣者足够安全。赞助者应遵循、保护或正式赞助教会所代表的信仰；如果国教是敌对的，确认应需要一条受支持的特殊宽容道路。神职人员或同等宗教团体必须随时可用且不得叛乱。只有在不威胁高地路线、不夺取神职人员物资或阻止边境社区派遣朝圣者的情况下，才允许发动战争。继承危机应该会阻止确认，因为教会也确认了皇室对神圣地理的赞助。
    start_logic: >-
      启动效果记录了赞助国、作为仪式地点的拉利贝拉、统治者或皇家赞助人、赞助者的国家信仰、参与的神职人员机构以及边境或少数民族信仰地区，如果实施能够代表这些地区，这些地区以后可能会从训练有素的传教员中受益。它快照了国家global_pop_conversion_speed_modifier、tolerance_own、宗教团结或信仰凝聚力、神职人员满意度、稳定性、合法性或神圣王权、国库健康、战争状况以及任何可用于实施的传教或皈依压力值。它反映了拉利贝拉当地的情况：占领、围困、动乱、破坏或繁荣、最终建筑的存在、高地路线安全、水源通道、朝圣者住宿、神职人员配备、手稿室安全以及教堂战壕和隧道是否开放。临时负担供养香客、看守山沟、维护水道、抄写福音书、支付诵经费用、提供香火灯油、修理雕花门槛、接待僧侣、派遣传教员等。这些快照应该让进展随着当地和平、神职人员合作和国家信仰凝聚力而扩大，并在朝圣变得不安全或受到剥削时暂停。
    progress_logic: >-
      每个月的刻度代表朝圣线路中的一项真实任务。一个月后，牧师们会在岩石凿成的教堂内打开包裹，并确认哪些游行十字架可以离开每个圣所。再过一个月，执事们会清理战壕、台阶、隧道和雕刻的门槛，以便朝圣者可以从一个教堂移动到另一个教堂，而不会将圣城变成一片尸体。接下来的一个月，水卫士会检查仪式池和具有象征意义的约旦河道，准备洗礼和祝福仪式。接下来的一个月，吟诵者用鼓和西斯特拉排练对歌，而抄写员则为来访的神职人员抄写福音段落。再过一个月，僧侣们接待来自遥远高地的朝圣者，听取纠纷，分配食物、灯和睡觉的地方。又一个月，传教员与边境皈依者一起巡游，解释为什么贝特·各各他、贝特·玛丽亚姆和贝特·吉约吉斯将这片风景变成了便携式的救赎记忆。其他的任务还包括节日人群控制、斋戒规定、圣人传说背诵、治愈水队列、峡谷巡逻、修复被侵蚀的岩石通道、村庄神职人员宣誓以及派遣十字架携带者返回周边地区。进展不断推进，而拉利贝拉仍然对神职人员和朝圣者来说保持可控、有偿付能力、可接近、供应和平静。它在破产、占领、直接围困、严重骚乱、道路不安全、供水中断、神职人员叛乱、敌对信仰政策、手稿丢失、类似流行病的朝圣者营地失败（如果建模）或最终建筑消失的情况下暂停。它可以通过高度的自身信仰宽容、满意的神职人员、强大的宗教团结、当地繁荣、安全的高原路线、积极的传教能力和慷慨的朝圣者支持来加速。
      ruler_death听众很重要，因为拉利贝拉的神圣地理与皇室的赞助联系在一起：有序的继承可以通过纪念祈祷和游行十字架前更新皇家誓言来增加进展，而有争议的继承则暂停，直到牧师可以在不分裂信徒的情况下命名赞助人。
    completion_logic: >-
      完成需要十四个成功的进展单位，继续拥有和控制拉利贝拉，最后的教堂，没有破产，没有占领或直接围困，安全的朝圣道路，神职人员参与，可用的水和教堂通道，并且没有未解决的继承或神职人员叛乱。最后一幕在日出前开始，朝圣者手持蜡烛走进雕刻的庭院。牧师们扛着包裹好的长袍和游行十字架穿过战壕；吟唱者在岩壁旁敲鼓；水卫士祝福具有象征意义的约旦河道；僧侣们阅读抄写的福音书；乡村神职人员和传教员按地区下跪；统治者或公认的赞助人站在
      Bet Giyorgis 或主要集会法庭，确认圣城将提供食物、住所、教导和送出朝圣者。最后一幕是从拉利贝拉派遣十字架搬运者和传教员，带着圣水、抄写的读物和路线标记。这一奇迹变成了国家能力，因为皈依不再只是当地的传教行动：它附属于受人尊敬的朝圣之旅，而自己的信仰宽容则因共同进入岩石凿成的新耶路撒冷而增长。
    failure_or_timeout_logic: >-
      没有普通的超时；朝圣可以等待雨、战争或短缺结束。失去拉利贝拉、失去对教堂区域的控制、最终建筑被毁坏或拆除，或者神职人员永久拒绝服务，都会取消仪式并在没有奖励的情况下消除负担。破产立即停止，因为饥饿的朝圣者、无薪的吟诵者、无人看守的峡谷和被忽视的水仪式将使圣城看起来被遗弃。占领、直接围困、严重骚乱、不安全的道路、封闭的战壕、水源中断、朝圣者营地倒塌、敌对的国家信仰政策、神职人员叛乱或手稿和禁忌安全丑闻都会阻碍进展。只有当继承权存在争议时，统治者的死亡才会暂停；有序的纪念活动和更新的皇家誓言可以加强仪式。其他地方的战争会因为封锁高地路线、征召卫兵或阻止边境朝圣者和传教员旅行而中断。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对拉利贝拉的所有权和控制权，最终独特的拉利贝拉教堂建筑存在，赞助商没有破产，没有占领，没有直接围困，没有严重的当地动乱，以及参与的神职人员或信仰机构。包括对赞助者信仰兼容性、安全高地路线、可用的教堂通道和水源、朝圣者住宿、没有敌对神职人员叛乱以及没有未解决的继承危机的检查或警告。
      start_effect_script: >-
        商店赞助国、拉利贝拉仪式地点、统治者或皇家赞助人、国家信仰、神职机构、活动仪式标记、十四个进度目标、当前进度为零，以及可选的边境社区或转换目标（如果有）。临时朝觐负担包括护卫、供水、食物、灯火、香火、诵经、抄写、修门槛、僧人住宿、传教员派遣等。每月注册
        ruler_death 听众。
      snapshot_effect_script: >-
        快照global_pop_conversion_speed_modifier、tolerance_own、宗教团结或信仰凝聚力、神职人员满意度、稳定性、合法性或神圣王权权威、财政健康、传教士或皈依压力、战争状态和当地拉利贝拉占领、围困、动乱、破坏或繁荣、最终建筑存在、高地路线安全、水源、朝圣者住宿、神职人员人员配置、手稿安全和露天战壕或隧道。
      progress_effect_script: >-
        在每月的刻度上，增加具体朝圣职责的进展：禁忌确认、交叉游行、沟渠清洁、水检查、圣歌排练、福音抄写、朝圣者住宿、传教员教学、盛宴人群控制、禁食规定、治愈水命令、峡谷守卫巡逻、岩石通道修复、村庄神职人员宣誓或派遣十字架者。为高度的自身信仰宽容、满意的神职人员、宗教团结、当地繁荣、安全的路线、传教能力和慷慨的支持增加奖励进步。由于破产、占领、围困、严重骚乱、道路不安全、断水、敌对神职人员、封闭通道、手稿或禁忌丑闻或最终建筑缺失而暂停。在ruler_death上，添加有序纪念誓言的进度或设置继承暂停状态。
      completion_trigger_script: >-
        需要至少十四个成功的进度单位，持续赞助商对拉利贝拉的所有权和控制权，最终建筑仍然存在，没有破产，没有占领或直接围困，没有严重的骚乱，安全的朝圣路线，参与的神职人员，可用的水和教堂通道，并且没有未解决的继承或神职人员
      completion_effect_script: >-
        移除临时朝圣负担，清除主动仪式进度和暂停变量，应用永久拉利贝拉国家修正，授予一次性皈依或宽容奖励，并记录新耶路撒冷环路、受祝福的水、游行十字架、抄写的福音读物、朝圣者营地和派遣传教员的拉利贝拉遗址记忆。
    intended_rewards:
      permanent_country_modifier: >-
        保留源修正。 global_pop_conversion_speed_modifier 代表训练有素的传教员、抄写的读物、游行十字架以及将拉利贝拉的神圣地理带回边境社区的朝圣者。 tolerance_own
        代表了共享一个享有声望的圣城的自己信仰的主体，在那里朝圣、忏悔、洗礼和盛宴秩序使宗教归属感可见且热情好客。后期的扩展应该支持皈依和自身信仰的凝聚力，而不是一般的山地防御、贸易或声望。
      one_time_reward: >-
        完成可以给予宗教团结、当地繁荣、声望或类似虔诚的权威、神职人员满意度或附近或选定的非自身信仰人口的适度脉搏。如果ruler_death的纪念被彻底解决，奖励应该倾向于tolerance_own和合法性；
      local_building_reward: >-
        拉利贝拉应该保留岩石凿成的新耶路撒冷记忆：守卫的峡谷通道、开放的战壕和隧道、维护仪式用水、抄写福音书籍、正常运作的朝圣者营地、得到认可的乡村神职人员誓言以及分配给教堂的游行十字架。后来的实施可以将其表达为朝圣带来的当地繁荣、减少自身信仰的动荡、更强的传教活动或宗教和继承危机期间的恢复能力。
    notes: >-
      源仪式是直接的，但这种设计使用了定时进度，因为拉利贝拉的历史力量在于反复的朝圣、礼拜仪式、水仪式、手稿教学和神职人员网络。每月的进展承担着这些职责；包含ruler_death是因为皇家赞助传说和神圣地理应该连续测试。实施者应将奖励重点放在转化速度和自身信仰宽容上，并避免将教堂降低为通用的圣山稳定性奖励。
