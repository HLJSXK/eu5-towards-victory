      start_effect_script: >-
        商店赞助国、拉萨仪式地点、当前统治者或公认的权威、活跃的仪式标记、十八个进度目标、当前零进度以及任何摄政或宗教权威范围。申请行宫寺院维护负担并每月注册加上ruler_death听众。
      snapshot_effect_script: >-
        国家转变速度、宽容、宗教团结、神职人员或宗教财产满意度、合法性或同等权威、稳定性、财政健康、战争状态和边境任务相关性的快照。拉萨当地占领、围困、骚乱、繁荣或破坏、路线安全、朝圣活动、寺院支持和最终建筑情况的快照。
      progress_effect_script: >-
        在每月的刻度上，添加朝圣者登记、酥油灯供养、法令抄写、寺院接见、遗产收入审计、商队护送、公共屋顶露台祈祷或传教士派遣的进度。为高度的宗教团结、强烈的神职人员满意度、稳定的继承、当地的繁荣、安全的路线以及统治者或摄政王的出席添加适度的奖励进展。在破产、占领、直接围困、严重骚乱、路线崩溃、严重破坏、代表失踪或最终建筑缺失的情况下暂停。在ruler_death上，只有在继承或摄政承认有序的情况下才能保留和推进进度。
      completion_trigger_script: 要求至少有十八个成功的进度单位，继续赞助者对拉萨的所有权和控制，最终建筑仍然存在，没有破产，没有直接围困或占领，没有严重的当地动乱，没有未解决的继承或摄政危机。
      completion_effect_script: 消除临时负担，清除仪式进度和暂停状态，应用永久性布达拉宫宫殿国家修正，授予一次性宗教权威或稳定奖励，并为密封的宫殿寺院登记册和公认的教学线路记录拉萨遗址记忆。
