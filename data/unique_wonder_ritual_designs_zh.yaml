    historical_flavor: 舟山烽火台网已在 data/unique_wonders.yaml 中实现为八阶段即时典礼。其仪式凭证绑定于海岛哨兵、筑塔匠、柴薪管事、港口信使、巡哨船长与舰队军官和固定地点 dinghai，不是可复用的通用仪式。
    mode: immediate_ceremony
    duration: 使用 tv_wonder_ceremony_stage 推进的八个每月典礼阶段。
    listeners:
    - monthly
    confirmation_logic: 赞助者拥有并控制固定地点，最终唯一奇观建筑存在，国家未破产，且没有重复典礼正在进行。
    start_logic: 典礼记录赞助国、固定地点、当前阶段、最终建筑，以及玩家为该阶段选择支付的成本。
    progress_logic: 每月监听器在玩家支付该阶段唯一的计算成本项后推进已撰写的典礼阶段。
    completion_logic: 第八阶段完成"海岛烽火巡守"，并交接唯一最终建筑与基础奇观的国家修正主题。
    failure_or_timeout_logic: 拒绝阶段会延后典礼；失去固定地点、偿付能力或最终建筑会阻止完成，直到恢复。
    implementation_mapping:
      confirmation_trigger_script: 由生成的唯一奇观典礼效果与固定地点锁定检查处理
      start_effect_script: 由 unique_wonders.yaml 的典礼数据生成
      snapshot_effect_script: 即时典礼 v1 不需要
      progress_effect_script: tv_wonder_ceremony_monthly_tick_effect = yes
      completion_trigger_script: 要求 tv_wonder_ceremony_stage 达到 8
      completion_effect_script: 生成落成与世界新闻交接
    intended_rewards:
      permanent_country_modifier: 使用 coastal_beacon_network 第一分支国家修正主题。
      local_building_reward: 海岛烽台、柴薪储备、轮值名册、港口传讯、海盗警报与舰队信号让舟山烽火台网成为海上预警体系。
      one_time_reward: 阶段成本与最终新闻强调该仪式如何把海岛烽火转化为海上存在与海军传统。
    notes: 亚洲区奇观扩展中新增，用于覆盖零采用原型并补强东亚、南亚与西亚锚点。
