  ritual_design_zh:
    title: 海上联姻兵工厂评论
    historical_flavor: >-
      威尼斯兵工厂仪式将共和国对亚得里亚海的仪式性主权与其造船厂的隐藏工业纪律结合在一起。参加者包括总督、公爵议员、兵工厂总督、兵工厂工人、填缝工、锯木工、绳索工、帆匠、桨匠、铸造工、炮手、厨房船长、飞行员、公证人、海军出纳员、布森托尔游行队伍的神职人员、水手行会代表以及从舰队中抽调的水手。他们在兵工厂大门、带顶棚的码头、厨房滑台、木材商店、索道、帆棚、大炮铸造厂、火药库、守卫盆地、运河引道、布森托尔河和铸造戒指的泻湖水域之间移动。这些物品包括金戒指、造船厂钥匙、木材计数、绳索样本、帆布螺栓、船体框架、桨束、青铜枪、船员集合、工资箱、发射绳、海军旗帜和护航队名单。这属于威尼斯兵工厂，因为海上联姻不仅仅是一场盛大的盛会：它宣示了海上主权，而兵工厂则通过船只、物资、船员和守卫的技术知识使这一宣言变得可信。当仪式性的海洋主权与经过审核的生产、快速装备、纪律严明的船员以及看到共和国真正与他们必须保卫的水域结合起来的水手们的士气结合起来时，国家将奇迹转化为长期的海军能力。
    mode: timed
    duration: >-
      使用十二个月的检查。一整年代表了从木材购买和干燥，到绳索和帆准备、船体框架、填缝、火炮铸造、桨和桅杆安装、船员集合、食物装载、泻湖下水和最后的布森托尔游行的周期。这改变了源直接仪式，因为戒指可以在一天内扔进海里，但奖励主题，更快的造船和海军士气，需要一年的明显造船厂准备，证明共和国的誓言得到了船只的支持。
    listeners:
    - monthly
    - ending_war
    confirmation_logic: >-
      赞助国必须拥有并控制威尼斯，最终的威尼斯兵工厂建筑必须在那里存在，并且国家不能破产。威尼斯不得被占领、直接围困或严重动乱，并且港口、泻湖通道、运河、兵工厂大门、码头、索道、铸造厂和守卫的盆地必须可用。如果实施支持海军国家，该国应该有水手、舰队，或者至少有足够的海军准入，使仪式不仅仅是一场枯燥的公民游行。敌人全面封锁威尼斯、失去出海通道、木材或水手严重短缺、舰队叛变或不安全的布森托人游行都应阻止确认或显示作为警告。战争是允许的，甚至可以使审查更加紧迫，但前提是威尼斯本身和阿森纳保持安全。
    start_logic: >-
      起始效果记录了赞助国、作为仪式地点的威尼斯、现任统治者或共和政府、舰队指挥官（如果有）以及该国是否处于战争状态或受到海军威胁。它快照国家 ship_build_speed、naval_morale_modifier、水手预备队、舰队规模或海军力量限制、财政状况、海军维护、战争状态、封锁状态、厨房或船舶生产队列（如果有）以及可能影响泻湖的任何贸易或护航漏洞。它反映了威尼斯当地的情况：占领、围困、动乱、破坏或繁荣、最终建筑的存在、港口通道、封锁、码头可用性、绳索和帆棚准备情况、铸造厂安全、木材库存、火药安全、布森托尔可用性和造船厂工人稳定性。对木材购买、绳麻、帆布、铸造燃料、青铜、工人工资、水手工资、发射人员、运河疏浚、码头维修、布森托维护、神职人员津贴和公共供给施加临时负担。当军火库是一个正在运行的生产系统时，这些快照应该让进展加速，而当海洋主权与无法使用的港口或无薪工人相矛盾时，这些快照应该让进展暂停。
    progress_logic: >-
      每个月的刻度代表一个造船厂和仪式职责。一个月后，proveditori 会检查木材商店并标记哪些梁适合船体框架。接下来的一个月，索道工作人员扭曲并测试电缆，同时公证人将大麻交付与阿森纳账户进行比较。又一个月，帆匠们切割帆布并记录哪些厨房可以在不等待布料的情况下下水。接下来的一个月，铸造工们会在看守下铸造或检查枪支、弹丸、锚和配件。再过一个月，填缝工就会在有顶棚的码头上测试船体接缝，并修复可能会延迟发射的滑道。接下来的一个月，桨制造商和桅杆工作人员将配套的套件捆绑在一起，以便快速装配。再过一个月，工资主管就会召集水手、飞行员和炮手，这样士气就与定期工资而不是紧急征税挂钩。再过一个月，布森托尔路线就通过了运河和泻湖水域，神职人员排练了海洋祝福，官员们准备了戒指。其他问题还包括火药库审核、粮食装载、车队名单、信号旗、囚犯或劳动纪律（如果有代表）以及公开发射示威。当威尼斯受到控制、有偿付能力、畅通无阻、有工人和水手供应并且能够操作码头时，进步就在进步。它因破产、占领、直接围困、严重骚乱、全面封锁、港口无法使用、木材短缺、铸造事故、工人叛乱、舰队叛变、不安全的布森托尔路线或最终建筑缺失而暂停。高昂的海军士气、强大的水手储备、高额的财政和海军维护、当地的繁荣、活跃的船舶生产以及战时舰队的生存可能会加速这一过程。
      ending_war 监听器代表海上战役之后的评论：如果战争结束而威尼斯及其舰队仍然可信，则捕获的战利品、幸存的船员和修复的船体可以增加进度或奖励规模。如果战争以海难、封锁或港口丧失而结束，仪式就会暂停以进行重建。
    completion_logic: >-
      完成需要十二个成功的进展单位，继续拥有和控制威尼斯，最终的兵工厂建筑，没有破产，没有占领或直接围攻，没有全面封锁，可用的码头和港口，稳定的造船厂劳动力，以及安全的布森托尔路线。最后一幕开始于泻湖游行之前的阿森纳内部。
      Proveditori 打开大门；工人师傅展示木材统计、绳索样品、帆布、枪支、桨和工资单；船长在新下水或改装的厨房旁边宣读船员集合；并由公证人证明生产账户与实体店相符。然后，总督与议员、神职人员、船长和造船厂代表一起登上布森托尔号，在海军旗帜下通过兵工厂和泻湖航道，并在宣布共和国与水域合法结合后将戒指投入海中。具有象征意义的行为是，海上婚姻是由使其得以执行的工人和船员见证的。这一奇迹变成了国家能力，因为造船速度现在取决于经过审计的造船厂例行程序，而水手和工匠看到共和国尊重他们的劳动作为海洋主权的基础，海军士气就会上升。
    failure_or_timeout_logic: >-
      没有普通的超时；造船厂的准备工作可能会在短缺或战争期间暂停。失去威尼斯、失去对阿森纳盆地的控制、最终建筑的消失或永久失去出海通道都会取消仪式，并在没有奖励的情况下消除负担。破产立即暂停，因为未付工资的阿森纳洛蒂、水手、铸造工和布森陶船员将公民海上领主的地位变成了公开的耻辱。占领、直接围困、严重动乱、全面封锁、港口关闭、运河阻塞、木材或水手短缺、火药灾难、铸造事故、劳工起义、舰队叛变或不安全的布森托尔游行会暂停进度。如果兵工厂发挥作用，战争就可以与仪式一起继续；
      ending_war可以在舰队生存后增加进度，或者在海军失败、港口损坏或羞辱性封锁后暂停仪式。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查威尼斯的赞助商所有权和控制权，最终独特的威尼斯阿森纳建筑存在，赞助商没有破产，没有占领，没有直接围困，没有严重的当地动乱，以及可用的港口和阿森纳区。包括对没有完全封锁、可用的水手或舰队进入、安全的布森托尔航线、码头可用性、工人稳定性以及没有严重的木材或海军供应短缺（如果存在这些触发因素）的检查或警告。
      start_effect_script: >-
        商店赞助国、威尼斯仪式地点、统治者或共和政府、舰队指挥官（如果有）、活动仪式标记、十二进度目标、当前进度为零以及战时或封锁背景。将临时军火库负担应用于木材、大麻、帆布、铸造燃料、工人工资、水手工资、发射人员、运河维护、码头维修、布森托维护、神职人员和公共供给。每月注册
        ending_war 听众。
      snapshot_effect_script: >-
        快照ship_build_speed、naval_morale_modifier、水手储备、舰队规模或海军力量限制、财政部健康状况、海军维护、战争状态、封锁状态、船舶生产队列（如果有）、车队脆弱性和当地威尼斯占领、围困、动乱、破坏或繁荣、最终建筑存在、港口通道、码头可用性、绳索和帆楼准备情况、铸造安全、木材库存、火药安全、布森托尔可用性和工人稳定性。
      progress_effect_script: >-
        在每月的刻度上，增加具体军械库职责的进度：木材检查、索道测试、帆切割、铸造铸造、填缝、桨和桅杆捆绑、水手集合、布森托尔路线清理、粉末审计、食物装载、车队清单审查、信号旗准备、劳动纪律或公开发射演示。为高昂的海军士气、水手储备、金库、海军维护、当地繁荣、活跃的船舶生产和幸存的战时舰队增加奖励进度。在破产、占领、围困、严重动乱、全面封锁、港口无法使用、供应短缺、铸造事故、工人叛乱、叛乱、布森托尔路线不安全或最终建筑缺失等情况下暂停。在ending_war上，为舰队生存和安全威尼斯添加进度，或在海难或封锁后设置重建暂停。
      completion_trigger_script: >-
        需要至少十二个成功的进度单位，继续赞助者对威尼斯的所有权和控制，最终建筑仍然存在，没有破产，没有占领或直接围困，没有严重的骚乱，没有完全封锁，可用的港口和码头，稳定的工人和水手，安全的布森托尔航线，并且没有未解决的海难暂停。
      completion_effect_script: >-
        移除临时军械库负担，清除活动仪式进程和暂停变量，应用永久性威尼斯兵工厂国家修正，授予一次性水手、声望、造船或海军士气奖励，并记录海环、布森托尔航线、审计木材和绳索账户、铸造印章、发射单和船员集合的威尼斯站点记忆。
    intended_rewards:
      permanent_country_modifier: >-
        保留源修正。 ship_build_speed 代表阿森纳经过审核的木材、绳索、帆、铸造、填缝、装配和下水程序的顺序，使国家能够比临时私人造船厂更快地建造船只。 naval_morale_modifier
        代表了海洋的公共婚姻、定期工资、造船厂的能力以及共和国水手捍卫与泻湖和亚得里亚海的神圣公民联盟的信念。后期的规模化应该会提高生产速度和海军士气，而不是用一般的贸易收入来取代它们。
      one_time_reward: >-
        完成后可以授予水手、海军声望、临时造船速度脉冲、海军士气、减少船舶建造延误，或从造船厂工资中获得当地威尼斯的繁荣。如果最终的战争回顾证实了舰队的生存，那么奖励应该倾向于士气和威望；如果生产在和平时期顺利完成，它可以向水手、造船厂吞吐量和当地繁荣倾斜。
      local_building_reward: >-
        威尼斯应该保留阿森纳海上婚姻账本的记忆：守卫的盆地大门、经过认证的木材和绳索商店、活跃的铸造厂、准备发射的滑道、布森托尔路线标记、环形游行记录、付费阿森纳和舰队集合。后来的实施可以将其表达为当地造船吞吐量、减少造船厂骚乱、提高水手恢复能力或封锁后的恢复力。
    notes: >-
      源仪式是直接的，但此设计使用每月定时进度，因为威尼斯兵工厂的历史力量是与公民海事仪式相结合的工业常规。 ending_war 侦听器需要谨慎使用：它应该在海战后验证舰队的生存、修复的船体和士气，而不是授予通用的胜利奖励。实施者应保留对船舶建造速度和海军士气的奖励，并且应仅将贸易利益视为局部或一次性的副作用。
- id: 115
  key: unique_malacca_port
  base_key: great_port
  location: malacca
  source_ritual_key: port_covenant
  status: designed
  ritual_design_zh:
    title: 海峡港主契约
    historical_flavor: >-
      马六甲港仪式将海峡视为一个通过季风时机、商法、仓库、翻译和安全锚地结合在一起的协商世界市场。参与者包括统治者或班达哈拉、分配到不同商业社区的沙赫班达尔、马来港口管理员、海关抄写员、称重官员、飞行员、海军巡逻队长、仓库管理员、货币兑换商、商业纠纷法官、翻译、中国帆船船长、古吉拉特和泰米尔商人、阿拉伯和波斯商人、爪哇和苏门答腊船长、当地经纪人、船木匠和外国地区的代表。他们聚集在码头、河口锚地、海关大厅、保税仓库、香料和纺织品商店、称重棚、领航船、商人宿舍、适合港口社区的清真寺或宣誓场所以及海峡了望哨。这些物品包括收费表、盖印重量、仓库封条、安全通行牌、引航图、季风日历、货物清单、商人誓言、翻译名册、港口旗帜、债务分类账和争议裁决。这属于马六甲，因为它的伟大之处在于使许多海洋在一个港口内合法清晰：来自中国、印度、阿拉伯、马来世界和东南亚岛屿的船只可以等待相反的季风，交换货物，解决债务，并按照抵达前已知的规则再次航行。国家通过使贸易收入更加可预测并通过值得信赖的港口法、飞行员、经纪人和商业社区扩大贸易范围，将奇迹转化为长期力量，他们将马六甲的价格和保证远远超出了海峡。
    mode: timed
    duration: >-
      使用十二个月的支票。一整年代表了主要的季风交换：船舶到达、等待、仓储、贸易、修理、诉讼纠纷以及逆风时离开。这几个月还包括公布通行费、承认商业区、任命沙赫班达尔、校准重量、安全通行问题以及测试海峡沿岸巡逻。这改变了源直接契约，因为商人只有在规则适用于整个季风周期后才信任马六甲，而不是在一次宣誓之后。
    listeners:
    - monthly
    confirmation_logic: >-
      赞助国必须拥有并控制马六甲，最终的马六甲港口建筑必须在那里存在，并且国家不得破产。马六甲不得被占领、直接围困、封锁或严重动乱，港口、锚地、海关大厅、仓库、称量棚、引航船、商人宿舍和海峡通道必须可用。国家应该有足够的海军或巡逻能力来保护安全锚地，并有足够的行政权力来使海关裁决具有可信度。只有不关闭海峡、不抓捕外国商人、不中断仓库、不阻止多个地区的船只抵达，积极的战争才是可以接受的。严重的盗版、市场崩溃、敌对的商业社区或无法向港口工作人员支付工资应阻止确认或显示为警告。
    start_logic: >-
      起始效果记录了赞助国、作为仪式地点的马六甲、统治者或港务局、相关商业社区（如果有代表性）以及当前的战争、封锁或海盗背景。它快照了国家trade_income、trade_range、贸易实力或市场准入（如果有）、外交影响力、海军巡逻能力、财政状况、稳定性、商业地产满意度（如果有）、当前贸易路线安全以及任何有效的禁运或贸易冲突。它反映了马六甲当地的情况：占领、围困、动乱、破坏或繁荣、最终建筑存在、港口通道、封锁、仓库容量、海关办公室功能、称重棚可靠性、口译员可用性、引航船准备情况、安全锚地和海峡巡逻状态。对港口引航员、巡逻艇、海关文员、口译员、仓库警卫、称重设备、商人宿舍维护、争议法官、运河或码头维护以及丢失或损坏货物的赔偿基金施加临时负担。这些快照应该让进展随着安全路线、多样化的商人出席和可信的法律而扩大，同时如果港口试图对其无法保护的贸易征税，则应暂停。
    progress_logic: >-
      每个月的刻度都代表季风契约的一部分。一个月后，沙赫班达尔召集中国、印度、阿拉伯、马来、爪哇、苏门答腊和其他商人团体，以确定谁来裁决他们的争端以及谁在海关事务上代表他们。接下来的一个月，称重官员会用香料、锡、纺织品、陶瓷、芳香剂和硬币来测试天平和压印砝码。再过一个月，仓库管理员就会密封保税仓库，并记录哪些货物可以等待季风返回而不会被扣押或损坏。接下来的一个月，飞行员将检查航道、浅滩、潮汐和锚地信号，以便到达的帆船和单桅帆船能够安全到达港口。再过一个月，海关抄写员会用口译员可以解释的语言或文字发布收费表。再过一个月，法官将审理一场分阶段的债务和货物纠纷，以证明外国商人可以在不使用暴力的情况下寻求补救。其他问题可能包括商人宿舍维修、港口巡逻演习、安全行为问题、市场价格复制、检疫或消防值班（如果有代表）、经纪人许可、货币兑换审计以及每个商人区宣誓遵守港口契约的仪式。在马六甲继续受控、有偿付能力、畅通无阻、对船舶开放、免受海盗侵害、并至少受到一小部分商业社区信任的同时，进展不断推进。它因破产、占领、直接围困、封锁、严重骚乱、不安全的锚地、仓库故障、海关腐败丑闻、敌对商人骚乱、海盗激增、翻译短缺或最终建筑缺失而暂停。贸易收入高、贸易范围广、当地繁荣、巡逻有力、通行费稳定、客商满意、港口存在多个外国贸易商群体，可能会加速发展。
    completion_logic: >-
      完成需要十二个成功的进展单位，继续拥有和控制马六甲，最后的港口建筑，没有破产，没有占领或直接围困，没有封锁，可用的仓库和海关办公室，安全的锚地，正常运作的飞行员和翻译，以及没有未解决的商人骚乱或海盗危机。最后的场景发生在季风转变时。港口旗帜在码头上空升起；沙赫班达尔站在统治者的官员旁边；中国帆船船长、印度纺织品商人、阿拉伯和波斯商人、马来经纪人和岛屿船长展示密封的货物理货；飞行员将更新后的海图放在海关桌上；称重人员展示加盖印章的计量单位；法官阅读商法条款；仓库管理员解锁整个季节持有的货物。统治者或港口当局确认通行费、安全通行、重量、住宿和争端解决等方面的约定，然后放行船只以应对逆风。这一奇迹变成了国家能力，因为商人现在将马六甲视为可靠的法律和物流枢纽：更多的贸易收入通过可预测的费用流动，并且贸易范围扩大，因为安全通行、口译员、飞行员和商人宿舍在整个海洋航线上提升了港口的声誉。
    failure_or_timeout_logic: >-
      没有普通的超时；圣约可以暂停，直到下一个季风窗口到来。失去马六甲、失去对港口区的控制、最终建筑物的消失或海峡的永久关闭都会取消仪式并在没有奖励的情况下消除负担。破产立即暂停，因为领不到工资的飞行员、抄写员、仓库管理员和法官使商法变得毫无意义。占领、直接围困、封锁、严重骚乱、不安全的锚地、海盗激增、市场火灾、仓库抢劫、海关腐败丑闻、敌对商人骚乱、翻译失败或扣押外国商人都会阻碍进展。其他地方的战争只有在关闭海峡、吓跑商业社区、消耗巡逻能力或强制实行违反盟约的禁运时才会中断。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对马六甲的所有权和控制权，最终独特的马六甲港口建筑存在，赞助商没有破产，没有占领，没有直接围困，没有严重的当地动乱，没有封锁，并且可以使用港口通道。包括对安全锚地、仓库和海关功能、飞行员和口译员可用性、海军巡逻能力、没有严重海盗或商船骚乱以及没有关闭海峡的战争或禁运条件的检查或警告。
      start_effect_script: >-
        商店赞助国、马六甲仪式地点、统治者或港口当局、活动仪式标记、十二个进度目标、当前进度为零、商业社区背景（如果有）以及战争、封锁或海盗背景。对引航员、巡逻员、海关文员、口译员、仓库警卫、称重设备、宿舍、争议法官、码头维护和赔偿基金实行临时港口契约负担。注册每月听众。
      snapshot_effect_script: >-
        快照 trade_income、trade_range、贸易实力或市场准入、外交影响力、海军巡逻能力、国库健康状况、稳定性、商人财产满意度（如果有）、贸易路线安全、禁运或贸易冲突状态以及马六甲当地占领、围困、动乱、破坏或繁荣、最终建筑存在、港口准入、封锁、仓库容量、海关功能、称重可靠性、口译员、领航船、锚地安全以及海峡巡逻状况。
      progress_effect_script: >-
        在每月的刻度上，添加具体港口职责的进展：shahbandar识别、重量校准、保税仓库密封、引航图检查、通行费公布、争议听证预演、商人旅馆维修、港口巡逻演习、安全行为问题、市场价格复制、消防值班、经纪人许可、货币兑换审计或商人季度宣誓。为高贸易收入、广泛的贸易范围、当地繁荣、强大的巡逻、稳定的通行费、满意的商人和多样化的外国参加者增加奖励进度。因破产、占领、围困、封锁、严重动乱、不安全锚地、海盗、仓库故障、海关丑闻、商人骚乱、翻译短缺或最终建筑缺失而暂停。
      completion_trigger_script: >-
        需要至少十二个成功的进展单位，继续赞助商拥有和控制马六甲，最终建筑仍然存在，没有破产，没有占领或直接围困，没有严重动乱，没有封锁，可用的仓库和海关办公室，安全锚地，正常运作的飞行员和翻译，没有未解决的海盗行为、商人骚乱或海关丑闻暂停。
      completion_effect_script: >-
        移除临时港口契约负担，清除主动仪式进度和暂停变量，应用永久马六甲港口国家修正，授予一次性贸易或国库奖励，并记录商业契约、盖章重量、保税仓库、安全通行平板电脑、飞行员海图、沙赫班达尔办公室和季风出发的马六甲站点记忆注册表。
    intended_rewards:
      permanent_country_modifier: >-
        保留源修饰符。 trade_income 代表可预测的通行费、保税仓储、争端解决和商人信任，使每艘船为国家带来更多利润。 trade_range 代表马六甲的安全通行、引航员、口译员、商船区和季风声誉，该港口的商业范围横跨南中国海、印度洋和岛屿航线。后期的扩展应该会加深贸易收入和范围，而不是将奇迹重定向到海军士气或一般税收收入。
      one_time_reward: >-
        完成后可以从海关、贸易力量、商人财产满意度、与商业国家的外交联系、当地繁荣或临时贸易范围脉冲中获得国库。如果盟约在战时没有封锁的情况下完成，奖励可以倾向于商人信任和贸易范围；如果整个季风周期平静，则可能有利于财政和当地繁荣。
      local_building_reward: >-
        马六甲应该保留季风契约分类账记忆：公认的沙赫班达尔、盖印的重量、收费表、保税仓库、口译员、飞行员图表、安全通行平板电脑、商人旅馆以及随逆风释放的船舶登记册。稍后的实施可以将其表达为当地港口繁荣、减少商人骚乱、更好的贸易路线弹性或封锁和海盗后更强的恢复。
    notes: >-
      源仪式是直接的，但这种设计使用定时的每月进度，因为马六甲的历史力量来自季风年证明的规则。每月的听众直接映射到港口管理、商法和航线安全。战争被视为暂停或警告条件，而不是听众，因为奖励应该保持贸易收入和贸易范围，而不是海军士气。
- id: 116
  key: unique_red_fort_delhi
  base_key: star_fortress_city
  location: delhi
  source_ritual_key: peacock_throne
  status: designed
  ritual_design_zh:
    title: 拉合里门安装孔雀王座
    historical_flavor: >-
      德里红堡的仪式将孔雀王座的安装视为莫卧儿主权的强化表现。参加者包括统治者、王子、瓦齐尔、曼萨卜达尔、宫廷编年史家、珠宝商、司库、传令官、卡迪斯、私人寓所的守卫、拉合里城门官员、纳卡尔汗鼓手、炮兵大师、火绳枪手、大象军官、军械师、工资职员、花园管理员、水道工程师以及获准出席法庭的特使或省贵族。他们在拉合里门、恰塔集市、纳卡尔卡纳、迪万伊阿姆、迪万伊哈斯、大理石屏风、皇家花园、纳赫尔比希什特水道、军械库、火药店、城墙和面向城市的城垛之间移动。这些物品包括王座平台、珠宝库存、阳伞、拂尘、帝国标准、鼓、观众请愿书、农民盒子、曼萨布卷、驻军名册、大门钥匙、大炮计数、火绳枪店、大象挽具和密封的钱箱。这里属于红堡，因为这里融合了宫廷的辉煌与保卫首都的指挥权：统治者出现在珠宝和大理石之下，但这种外观的合法性受到红砂岩墙、纪律严明的大门、武装家庭和了解其薪水、职位和象征性职责的驻军的保护。当帝国展示、书面命令和堡垒准备状态相互加强时，奇迹就会成为长期力量。
    mode: timed
    duration: >-
      使用十六个月的检查。十二个月代表宫廷和驻军的一年：觐见日、领薪、炮兵检查、门禁值班、花园和水利维护、珠宝审计、法令抄写和省级陈述。另外四项检查代表王座的实际安装和公众接受：金库释放、珠宝商验证、Diwan-i-Khas
      观众排练以及堡垒的最终公告。这改变了源头的直接仪式，因为孔雀王座可以立即放置在大厅中，但合法性和驻军能力来自于首都堡垒可以展示、保护和指挥帝国权威的反复证明。
    listeners:
    - monthly
    - ruler_death
    - pre_winning_war
    confirmation_logic: >-
      赞助国必须拥有并控制德里，最终的红堡建筑必须在那里存在，国家不能破产。德里和堡垒区不得被占领、直接围困或发生严重骚乱。拉合里门、观众厅、军械库、火药库、城墙、花园和水道必须可用，并且宫廷必须有一位公认的统治者、摄政王或能够接待贵族的继任者。国库必须能够支持警卫、珠宝保管和驻军工资；破产或未支付费用的堡垒会使王座的安装变得危险。如果德里保持安全，战争是允许的，但敌人逼近首都、叛乱的驻军、供应路线受阻或未解决的继承危机应该阻止确认或显示为严厉警告。
    start_logic: >-
      起始效果记录了赞助国、作为仪式地点的德里、现任统治者、继承人或摄政、堡垒指挥官（如果有）以及该国家是否处于战争状态或面临继承纠纷。它快照了国家monthly_legitimacy、global_garrison_size_modifier、稳定性、威望、军队士气或军事信心（如果有）、财政状况、战争状况、人力、堡垒维护以及任何宫廷或贵族满意度指标。它反映了德里当地的情况：占领、围困、动乱、破坏或繁荣、最终建筑的存在、大门通道、观众厅的可用性、军械库和火药安全、城墙完整性、水道功能、花园秩序、驻军兵力、警卫工资以及通往首都的路线安全。对珠宝商审计、金库守卫、宝座平台工作、鼓仪式、宫廷编年史、大象和骑兵展示、大炮检查、火绳枪店、驻军工资、大门维修和观众供应施加临时负担。这些快照应该让进展具有合法性和强大的堡垒秩序，同时在法庭奇观不受军事纪律支持时暂停。
    progress_logic: >-
      每个月的刻度代表一项具体的强化法庭职责。珠宝商和财务主管将在一个月内检查孔雀王座的配件，将宝石和珐琅与库存进行比较，并密封金库。接下来的一个月，传令官和纳卡尔汗鼓手会排练观众的节奏，以便请愿、荣誉和解雇都遵循帝国的时间安排。再过一个月，曼萨卜达尔人在
      Diwan-i-Am 中展示自己的军衔，而工资职员则将服务义务复制到法庭登记册中。接下来的一个月，警卫会检查大门钥匙、夜间值班以及从拉合里门到私人大厅的许可路线。接下来的一个月，炮兵师傅们将检查城墙上的枪支、火药库、炮弹堆和射击人员。接下来的一个月，火绳枪手、大象军官和骑兵护卫队在堡垒城的道路上进行演练。接下来的一个月，水利工程师和花园管理员会维护
      Nahr-i-Bihisht 和宫殿花园，这样宫廷天堂就不会在军事围墙后面腐烂。其他的事项还包括农民抄写、使节出席、省级贡品展示、盔甲修理、监狱和金库安全以及公众观众的人群控制。当德里受到控制、有偿付能力、平静、有供应、有能力为驻军支付费用和住房时，进展就会取得进展。它会因破产、占领、直接围困、严重动乱、未领军饷、兵变、火药事故、军械库损失、大门破损、王座库存丢失、资本路线受阻或最终建筑消失而暂停。它可能会因高度合法性、强大的财政、高堡垒维护、当地繁荣、忠诚的贵族和大量可靠的驻军而加速发展。
      ruler_death 听众测试王位权威是否能在死亡后幸存：有序的继承通过 Diwan-i-Khas 中的重新呈现增加了进展，而有争议的继承则暂停。 pre_winning_war 监听器代表要塞在战争结束前发出最后的胜利农民和召集后备力量；只有德里安全并且驻军不仅仅是装饰性的，它才会取得进展。
    completion_logic: >-
      完成需要十六个成功的进展单位，继续拥有和控制德里，最后的红堡建筑，没有破产，没有占领或直接围攻，没有严重的骚乱，安全的大门和军械库，付费驻军，可用的观众厅，完整的王座库存，以及没有未解决的继承或叛变。最后一幕从拉合里门开始，纳卡尔卡纳的鼓声响起，守卫打开了穿过有顶集市通往观众厅的道路。曼萨卜达尔人坚守岗位；炮兵和火绳枪军官出示名册；财务主管展示密封的珠宝库存；编年史家持有安装登记册；水流经宫渠；统治者或公认的摄政王进入
      Diwan-i-Khas 坐在已安装的孔雀宝座前。一名农民首先被宣读到法庭上，然后被带到城墙和大门，宣布帝国的正义、军队的俸禄和首都的防御在同一个坚固的座位上讲话。这一奇迹变成了国家能力，因为每月的合法性通过可见的登基仪式得到加强，而驻军规模则反映了堡垒在帝国中心周围容纳、支付和训练更多守军的能力。
    failure_or_timeout_logic: >-
      没有普通的超时；当首都安全时，法庭和驻军的准备工作可以暂停。失去德里、失去对要塞辖区的控制、最终建筑消失或永久失去王座库存都会取消仪式并消除负担而没有奖励。破产立即暂停，因为没有报酬的警卫和不受保护的珠宝将宫廷的辉煌变成了政变风险。占领、直接围困、严重骚乱、叛变、无薪驻军、火药爆炸、军械库没收、城门破损、资本路线受阻、水道被破坏或不安全的公众观众都会导致进度暂停。只有当继承权存在争议时，统治者的死亡才会暂停；有序的即位才能完成一次王位呈献。当德里受到威胁或堡垒失去补给时，战争就会中断，但如果胜利农民是从安全、配备人员且付费的红堡发出的，那么pre_winning_war时刻可以增加进度。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对德里的所有权和控制权，最终独特的红堡建筑存在，赞助商没有破产，没有占领，没有直接围困，没有严重的当地动乱，并且有一个公认的统治者或摄政能够主持法庭。包括对可用大门、观众厅、军械库、火药库、城墙、花园和供水系统、付费驻军、安全资本路线、无叛变和未解决的继承危机的检查或警告。
      start_effect_script: >-
        商店赞助国、德里仪式地点、统治者和继承人或摄政、堡垒指挥官（如果有）、活动仪式标记、十六个进度目标、当前进度为零以及战争或继承背景。将临时孔雀王座负担应用于珠宝审计、金库守卫、平台工作、鼓、编年史、大象和骑兵展示、火炮检查、火绳枪商店、驻军工资、大门维修和观众供应。每月注册
        ruler_death 和 pre_winning_war 听众。
      snapshot_effect_script: >-
        快照monthly_legitimacy、global_garrison_size_modifier、稳定性、威望、军队士气或军事信心、国库健康、战争状态、人力、堡垒维护、宫廷或贵族满意度、德里当地占领、围困、动乱、破坏或繁荣、最终建筑存在、大门通道、观众厅可用性、军械库和火药安全、城墙完整性、水功能、花园秩序、驻军兵力、警卫工资和路线安全。
      progress_effect_script: >-
        在每月的刻度上，添加具体任务的进度：珠宝库存、纳卡尔汗排练、曼萨布演示、大门钥匙审查、火炮检查、火绳枪和大象演习、水道维护、农民复制、特使出席、贡品展示、盔甲修理、金库安全或公众观众人群控制。为高合法性、强大的金库、堡垒维护、当地繁荣、忠诚的贵族和可靠的驻军添加奖励进度。在破产、占领、围困、严重动乱、未领薪水的士兵、兵变、火药事故、军械库丢失、大门破损、王座库存丢失、路线受阻或最终建筑缺失的情况下暂停。在ruler_death上，添加有序加入进度或设置继承暂停；在pre_winning_war上，仅当安全的德里发行由付费驻军支持的胜利农场主时才能增加进度。
      completion_trigger_script: >-
        需要至少十六个成功的进度单位，对德里的持续赞助商所有权和控制权，最终建筑仍然存在，没有破产，没有占领或直接围攻，没有严重的骚乱，安全的大门和军械库，付费驻军，可用的观众厅，完整的王位库存，安全的资本路线，并且没有未解决的继承，叛变或战时资本威胁暂停。
      completion_effect_script: >-
        移除临时王位安装负担，清除主动仪式进度和暂停变量，应用永久红堡国家修正，授予一次性合法性、声望、人力或驻军准备奖励，并记录拉合里门游行、迪万-伊-卡斯安装、珠宝登记、驻军名册、炮兵审计和胜利农民的德里遗址记忆协议。
    intended_rewards:
      permanent_country_modifier: >-
        保留源修饰符。 monthly_legitimacy代表了红堡在孔雀王座前反复上演帝国正义、等级制度、贡品和继承的能力。 global_garrison_size_modifier 代表与功能正常的首都要塞相同的地点，配有付费警卫、安全大门、军械库、火药库以及容纳规模更大、纪律严明的驻军的房间。后期的扩展应该增强合法性和驻军能力，而不是把堡垒变成一般的土地士气或税收。
      one_time_reward: >-
        完成后可以在有限的脉冲中赋予合法性、威望、军队传统或士气、人力或驻军增援、宫廷满意度或从宫殿服务中获得当地德里的繁荣。如果ruler_death加入被解决，奖励应该倾向于合法性；如果pre_winning_war农民得到了安全堡垒的验证，它可能倾向于驻军准备或军事信心。
      local_building_reward: >-
        德里应该保留孔雀堡登记记忆：接受的王座安装，密封的珠宝库存，付费驻军卷，拉合里门钥匙登记，火炮和火药审计，Nahr-i-Bihisht维护和公共农民协议。后来的实施可以将其表达为当地堡垒的防御性、减少首都的动荡、更强的驻军恢复或在继承危机期间的恢复力。
    notes: >-
      源仪式是直接的，但这种设计使用定时进度，因为红堡的合法性取决于王位周围重复的宫廷和驻军例行公事。 pre_winning_war 侦听器仅作为胜利前安全资本指挥的上下文脉冲而包含在内，而 ruler_death
      则测试继任演示。实施者应该通过强调堡垒、大门、驻军和首都防御系统，而不仅仅是珠宝展示和外交贡品，将其与单独的独特孔雀王座条目区分开来。
- id: 117
  key: unique_versailles_palace
  base_key: triumphal_axis
  location: mantes
  source_ritual_key: sun_king_transfer
  status: designed
  ritual_design_zh:
    title: 镜厅 太阳宫的转移
    historical_flavor: >-
      凡尔赛宫仪式将宫殿视为将贵族存在转化为皇家政府的机器。参加者包括统治者、继承人或摄政王、王室官员、大臣、国务卿、总督代表、礼仪官、护卫、教堂神职人员、音乐家、园丁、喷泉工程师、镜子和蜡烛管理员、马厩官员、狩猎队长、厨师、侍童、宫廷的女士们和先生们、必须出席的大贵族、外国大使和携带各省请愿书的职员。他们在皇家卧室、教堂、议会厅、镜厅、官邸、花园、喷泉、大运河、马厩、厨房、大使接待室以及道路和住宿区之间移动，使永久出席成为可能。这些物品包括杠杆和沙发清单、法院优先登记册、公寓钥匙、议会文件、密封盒、请愿书、大使礼物、蜡烛、镜面抛光布、花园平面图、喷泉时间表、狩猎号角、制服库存和贵族住宿分配。这里属于凡尔赛宫，因为宫殿将官邸改造成剧院，将剧院改造成中央政府：贵族们争夺邻近，外国使节​​通过仪式解读权力，大臣们利用同样的受控空间使王权正规化。国家通过强迫精英野心围绕统治者的日常生活，将奇迹转化为长期的威望和集权。
    mode: timed
    duration: >-
      每月进行十八次检查。十二个月代表一个完整的法庭年：每个季节的杠杆、议会、教堂、观众、大使招待会、狩猎、花园散步、晚餐、娱乐、住宿轮换和请愿书处理。六项额外的检查代表着将部长文件、贵族家庭、服务人员、道路供应、喷泉维护和优先登记册转移到宫殿轨道上的速度较慢。这改变了源头的直接仪式，因为统治者可以在一天内宣布宫廷转移，但威望和集权需要数月的反复出席，贵族们知道访问、恩惠和决定都是通过凡尔赛宫进行的。
    listeners:
    - monthly
    - ruler_death
    confirmation_logic: >-
      赞助国必须拥有并控制曼特/凡尔赛宫，最后的凡尔赛宫建筑必须在那里存在，而且国家不能破产。宫殿、道路引道、住宿区、镜厅、教堂、议会厅、厨房、马厩、花园和供水系统必须可用。该地点不得被占领、直接围困或发生严重骚乱。统治者、摄政王或公认的宫廷必须能够接待贵族；活跃的继承危机、被俘的统治者或阻止出席的贵族叛乱都应该阻止确认。国库必须能够支付家庭工作人员、警卫、蜡烛、膳食、音乐家、喷泉和部长搬迁费用。如果宫廷道路安全，其他地方的战争是可以接受的，但威胁宫殿、清空国库或召回所有贵族的战争应该封锁或警告。
    start_logic: >-
      起始效果记录了赞助国、曼特/凡尔赛作为仪式地点、统治者、继承人或摄政、当前首都或宫廷所在地（如果有），以及贵族骚乱或继承紧张是否活跃。它快照了国家monthly_prestige、monthly_towards_centralization、稳定性、合法性、贵族阶层满意度或影响力（如果有）、法院/内阁能力、财政部健康状况、外交声誉或特使存在（如果有）、战争状况和资本管理压力。它反映了当地的场地状况：占领、围困、动乱、破坏或繁荣、最终建筑的存在、道路通行、住宿能力、镜厅的可用性、教堂和议会厅的通行、厨房和马厩的准备情况、花园和喷泉的功能、家庭工作人员的可用性以及大使的安全。对宫廷住宿、膳食、蜡烛、警卫、制服、镜子护理、喷泉、音乐家、教堂服务、狩猎、道路供应、部长抄写和贵族出席补贴施加临时负担。这些快照应该让进步随着精英出席率和法庭偿付能力而扩大，同时如果宫殿变得昂贵的空虚而不是中央政府，就会暂停。
    progress_logic: >-
      每个月的刻度代表一个具体的法庭例行公事。一个月后，司仪公布了杠杆和卧榻名单，决定哪些贵族可以见证统治者醒来和退休。再过一个月，部长们将议会文件和印章移入宫殿，测试是否可以在不返回旧法院的情况下答复请愿书。再过一个月，教堂神职人员和音乐家将每日弥撒、节日座位和贵族游行路线正规化。再过一个月，镜子管理员、蜡烛官员和守卫将在镜厅为大使招待会做准备，外国使节​​们将在镜厅看到受控的辉煌。再过一个月，园丁和喷泉工程师就会制定用水计划，这样正式的花园就能展示出对土地、劳动力和景观的掌控力。又一个月，马厩官员和狩猎队长组织了一次皇家狩猎，使贵族休闲依赖于皇家邀请。其他问题包括住宿纠纷、优先诉讼、晚餐服务、法庭剧院、请愿书复印、总督报告、警卫轮换、道路供应车队以及贵族债务或人情登记册。当宫殿仍然受到控制、有偿付能力、可进入、供应并有有意义的贵族和大臣出席时，进步就在进步。它因破产、占领、直接围困、严重动乱、道路堵塞、空荡荡的住宿、贵族抵制、派系暴力、家政人员短缺、喷泉破损、大使通道不安全或最终建筑缺失而暂停。它可能会因崇高的威望、强大的合法性、满意但依赖的贵族、健康的财政、积极的外交出席、当地的繁荣以及运转良好的花园和自来水厂而加速。
      ruler_death 听众测试机器：如果新统治者立即收到杠杆、议会、教堂和大使例行程序，有序的继承会增加进度；由于朝臣们无法围绕不确定的太阳运行，有争议的继承权暂停了。
    completion_logic: >-
      完成需要十八个成功的进度单位，继续拥有和控制曼特/凡尔赛宫，最后的宫殿建筑，没有破产，没有占领或直接围攻，安全的道路，可用的镜厅，教堂，议会厅，住宿，厨房，花园和喷泉，有意义的贵族出席，并且没有未解决的继承或贵族叛乱。最后的场景在精心设计的一天内展开。黎明时分，选定的贵族出席皇家卧室的杠杆仪式；部长们收到密封的理事会文件；教堂音乐吸引宫廷进行等级崇拜；大使们在镜厅等候，蜡烛放大了统治者的形象；园丁释放喷泉；马厩官员准备狩猎；书记员为总督和省份抄送决定。晚上，统治者或公认的继任者在被贵族包围的镜廊中行走，贵族的头衔现在取决于出席情况，然后宣布宫廷、议会、恩惠和公众荣耀将留在凡尔赛宫。这一奇迹变成了国家能力，因为每月的声望来自于重复的奇观，而随着崇高的野心和行政文书工作被拉入同一个日常轨道，集权也会增强。
    failure_or_timeout_logic: >-
      没有普通的超时；法庭移交可以暂停，直到道路、继承或财务恢复为止。失去曼特/凡尔赛宫、失去对宫殿区域的控制、最终建筑消失或永久无法聚集宫廷都会取消仪式并消除负担而没有奖励。破产立即停止，因为没有报酬的仆人、警卫、厨师、音乐家和喷泉工程师将辉煌变成了嘲笑。占领、直接围困、严重动乱、贵族叛乱、贵族抵制、道路封锁、宫殿失火、供水系统故障、空荡荡的住所、不安全的大使出入或在运输途中丢失的部长文件都会阻碍进展。只有当继承权存在争议时，统治者的死亡才会暂停；有序的第一杠杆和继任者领导下的理事会可以推进仪式。当其他地方的战争威胁到宫殿、耗尽国库或阻止贵族和使节参加时，战争就会中断。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对曼特/凡尔赛宫的所有权和控制权，最终独特的凡尔赛宫建筑，赞助商未破产，没有占领，没有直接围困，没有严重的当地动乱，并且有一个公认的统治者或摄政能够主持法庭。包括对可用道路、住宿、镜厅、教堂、议会厅、厨房、马厩、花园、供水系统、贵族出席、没有贵族叛乱或抵制以及没有未解决的继承危机的检查或警告。
      start_effect_script: >-
        商店赞助国、曼特/凡尔赛仪式地点、统治者和继承人或摄政、当前首都或宫廷所在地（如果有）、活动仪式标记、十八个进度目标、当前零进度以及贵族动乱或继承背景。适用临时法庭转移负担，包括住宿、膳食、蜡烛、警卫、制服、镜子、喷泉、音乐家、教堂服务、狩猎、道路供应、部长复印和出勤补贴。每月注册
        ruler_death 听众。
      snapshot_effect_script: >-
        快照monthly_prestige、monthly_towards_centralization、稳定性、合法性、贵族阶层满意度或影响力、法院/内阁能力、财政部健康状况、外交声誉或特使存在、战争状态、资本管理压力和当地场地占领、围困、动乱、破坏或繁荣、最终建筑存在、道路通道、住宿能力、镜厅可用性、教堂和议会通道、厨房和马厩准备情况、花园和喷泉功能，
      progress_effect_script: >-
        在每月的刻度上，添加具体法庭职责的进度：杠杆和沙发列表发布、议会文件传输、教堂游行、镜厅接待、喷泉时间表、皇家狩猎、住宿纠纷、优先裁决、晚餐服务、法庭剧院、请愿书复印、总督报告、警卫轮换、道路供应车队或人情登记册。为高威望、合法性、国库实力、附属贵族出席、特使存在、当地繁荣和功能花园添加奖励进度。在破产、占领、围困、严重骚乱、道路封锁、贵族抵制、派系暴力、工作人员短缺、喷泉损坏、大使不安全或最终建筑缺失等情况下暂停。在ruler_death上，为有序的第一杠杆和议会添加进度，或设置继承暂停状态。
      completion_trigger_script: >-
        需要至少十八个成功的进度单位，继续赞助商拥有和控制曼特/凡尔赛宫，最终建筑仍然存在，没有破产，没有占领或直接围困，没有严重的骚乱，道路安全，可用的镜厅，教堂，议会厅，住宿，厨房，花园和喷泉，贵族出席，并且没有未解决的继承、贵族叛乱或宫廷抵制暂停。
      completion_effect_script: >-
        消除临时宫廷转移负担，清除主动仪式进度和暂停变量，应用永久凡尔赛国家修正，授予一次性威望或集权奖励，并记录杠杆登记册、镜厅接待、喷泉时间表、贵族住宿卷、大臣文件转移和太阳宫廷出勤的凡尔赛遗址记忆协议。
    intended_rewards:
      permanent_country_modifier: >-
        保留源修饰符。 monthly_prestige 代表了宫殿中不断出现的奇观：镜子、花园、大使、音乐、服饰、狩猎和优先顺序，使统治者成为欧洲风格华丽的中心。 monthly_towards_centralization
        代表贵族和大臣被实际吸引到皇家日常事务中，获得青睐取决于出席情况，而行政管理则遵循宫廷。后期的扩展应该加深威望和集权，而不是成为通用税收、合法性或军队士气。
      one_time_reward: >-
        完成可以带来声望、集权进步、宫廷/内阁效率、贵族阶层的满意度（如果服从被视为恩惠）、出席大使的外交声誉或围绕宫廷服务的当地繁荣。如果ruler_death继承问题得到彻底解决，奖励应该倾向于中心化和合法性；
      local_building_reward: >-
        曼特/凡尔赛宫应该保留太阳宫廷转让登记册的记忆：贵族的住宿分配、杠杆和躺椅清单、部长文件室、镜厅接待记录、教堂秩序、功能喷泉、道路供应和宫廷服务工资单。后来的实施可以将其表现为当地繁荣、减少贵族因出庭而产生的骚乱、更强的内阁吞吐量或继承过渡期间的弹性。
    notes: >-
      起源仪式是直接的，但这种设计使用了定时进度，因为只有当宫廷住所重复出现，直到贵族、大臣、仆人、使节和省级文书依赖它时，凡尔赛宫才会变得强大。包含 ruler_death 侦听器是因为宫殿例程必须在代表太阳的君主去世后继续存在。实施者应将奖励保留在声望和集中化倾向上，并避免将宫殿变成一般的资本转移或税收效率效应。
- id: 118
  key: unique_tenochtitlan_causeways
  base_key: river_extension
  location: tenochtitlan
  source_ritual_key: temple_expansion_sacrifice
  status: designed
  ritual_design_zh:
    title: 神庙市长堤道奉献
    historical_flavor: >-
      特诺奇蒂特兰堤道仪式将湖城视为一个神圣的后勤有机体，其道路、运河、渡槽、市场、武士和神庙区必须一起移动。参与者包括统治者、大神庙的祭司、卡尔普利劳工队长、堤道泥瓦匠、独木舟驾驶员、桥梁守护者、渡槽管理员、特拉特洛尔科的市场法官、波赫特卡商人、贡品记录员、瓷器种植者、战士、旗手、搬运工、湖泊巡逻人员以及通往特佩亚克、特拉科潘和伊斯塔帕拉帕路线的地区长老。他们沿着石堤、可移动的桥跨、运河交叉口、独木舟登陆处、渡槽、市场通道、湖边岗哨、chinampa
      补给路线移动，最后到达大寺庙区。这些物品包括桥销、独木舟记数器、进贡篮、水罐、作为神圣王冠的黑曜石刀、战争旗帜、市场度量、玉米和苋菜祭品、石头修复标记、渡槽塞以及标明每个部分由哪些地区维护的路碑。这里属于特诺奇蒂特兰，因为这座城市通过将水转化为运动来统治特斯科科湖：军队在堤道上行进，食物和贡品通过独木舟运来，淡水穿过湖面，繁荣取决于神圣、军事和市场路线的同步。因此，大圣殿扩建祭祀并不是一种超然的宗教奇观；而是一种宗教奇观。正是交通系统的公共奉献使战争更快，城市生活更加繁荣。
    mode: timed
    duration: >-
      使用十三个月的检查。十二个月代表了一个完整的湖城维护年：旱季石材修复、雨季运河清理、渡槽检查、市场交通、瓷器收获运动、贡品抵达、桥梁排练、独木舟治安和武士集结。最后的检查代表了大神殿扩建的奉献，修复后的路线在仪式上与城市的神和统治者相连。这改变了源直接仪式，因为寺庙祭祀可以在一天内发生，但只有在堤道、运河、市场和供水系统证明其随季节变化的可靠性之后，军队的移动速度和每月的繁荣才会随之而来。
    listeners:
    - monthly
    - pre_winning_war
    confirmation_logic: >-
      赞助国必须拥有并控制特诺奇蒂特兰，最终的特诺奇蒂特兰堤道建筑必须在那里存在，并且国家不能破产。岛城不得被占领、直接围困或严重动乱。至少主要堤道、可移动桥点、运河、独木舟登陆处、渡槽、市场引道和大神庙区域必须可用。如果实施可以测试湖泊的通行、供应、破坏、水中断或类似封锁的隔离，那么严重的中断应该阻止确认。活跃的战争是允许的，并且在历史上是适当的，但前提是首都路线仍然可以运送战士和物资；敌人切断堤道、投毒或切断水源、关闭市场或阻止寺庙聚会，应予以阻止或警告。
    start_logic: >-
      起始效果记录了赞助国、作为仪式地点的特诺奇蒂特兰、当前的统治者、相关的祭司或寺庙机构，以及战争或朝贡活动是否活跃。它快照了国家army_movement_speed、global_monthly_prosperity、稳定性、合法性或神圣王权（如果有）、人力或战士力量、国库健康状况、战争状况、供应紧张以及任何市场或繁荣指标。它反映了当地的情况：占领、围困、动乱、破坏或繁荣、最终建筑的存在、堤道的通行性、桥跨准备情况、运河深度、独木舟交通、渡槽功能、市场秩序、湖泊巡逻安全、chinampa
      供应通道和大寺庙的可达性。为石头修复、木桥跨度、独木舟巡逻、渡槽清理、市场治安、祭司祭品、劳工征税、战士集结、旗帜准备、食物供应和路线碑施加临时负担。这些快照应该让进度随着安全的湖泊物流而扩展，并在神圣仪式掩盖损坏的基础设施时暂停。
    progress_logic: >-
      每个月的刻度代表特定的湖城职责。为期一个月的堤道泥瓦匠会检查铺路石并标记凹陷部分以供修复。再过一个月，桥梁管理员就会拆除并更换木跨，以测试部队是否可以快速通过，以及防御者是否仍然可以在紧急情况下切断通道。再过一个月，运河工作人员就会疏浚独木舟航道，以便贡篮、玉米、鲜花、燃料和建筑石材到达岛上市场。接下来的一个月，渡槽管理员清理了渠道、测试了堵塞，并将淡水罐运到寺庙区域，作为城市供水的证据。再过一个月，市场法官将规范特拉特洛尔科和堤道之间的交通，将搬运工、独木舟、战士和商人分开，这样拥堵就不会扼杀繁荣。又一个月，波赫特卡和贡品记录员将到达的货物与地区义务进行了比较。接下来的一个月，战士们排练了从地区集会出发穿过堤道前往圣殿的横幅运动。接下来的一个月，祭司们根据场景的支持基调协调祭品、禁食、焚香、音乐以及战俘或象征性替代品的呈现。其他的蜱虫可能包括湖泊巡逻、chinampa
      收获车队、洪水监视、夜间信号、堤道通行费、地区劳工宣誓和独木舟登陆维修。在城市保持可控、有偿付能力、供应和通行的同时，进展不断推进。它因破产、占领、直接围困、严重骚乱、堤道破损、渡槽被切断、运河被堵塞、市场骚乱、湖泊封锁、桥梁被毁、食品运输失败、牧师扰乱或最终建筑缺失而暂停。随着当地的高度繁荣、强大的人力、活跃的市场、安全的湖泊巡逻、完整的渡槽和成功的贡品运输，它可能会加速。
      pre_winning_war 听众代表一场近乎胜利的战役，战士们可以穿越修复的堤道，将贡品或俘虏带到寺庙；只有在特诺奇蒂特兰本身安全并且路线系统明显支持该战役的情况下，它才应该取得进展。
    completion_logic: >-
      完成需要十三个成功的进展单位，继续拥有和控制特诺奇蒂特兰，最终的堤道建设，没有破产，没有占领或直接围困，没有严重的骚乱，可以通行的堤道，功能正常的桥梁，可用的运河，工作的渡槽，开放的市场和可访问的大神庙区域。最后一幕在黎明前在修复好的堤道上开始。独木舟在有序的小道上航行，载着玉米、鲜花、水罐和贡品；战士们举着横幅穿过经过测试的桥跨度；市场评委为特拉特洛尔科扫清道路；湖泊巡逻人员从水中发出信号；渡槽管理员在寺庙台阶前倒淡水；地区劳工队长展示了命名其修复部分的牌匾。祭司们用香火、音乐、祭品和有控制地赠送战争令牌或俘虏来引导扩张的奉献仪式，而统治者则宣布湖边道路将市场、寺庙和军队连接成一座城市。这一奇迹变成了国家能力，因为军队可以以熟练的速度穿过堤道网络，而全球繁荣则得益于可靠的贡品、市场流动、供水和城市供应。
    failure_or_timeout_logic: >-
      没有普通的超时；湖泊工程可能会在洪水、战争或短缺期间暂停。失去特诺奇蒂特兰，失去对堤道网络的控制，最终建筑物的消失，或者渡槽和主要路线的永久倒塌，都会取消仪式并消除负担而没有奖励。破产立即停止，因为无偿劳动、饥饿的工人和被忽视的祭品暴露了这座城市无法维持其神圣的道路。占领、直接围困、严重动乱、堤道决口、桥梁被毁、运河堵塞、渡槽切断、市场骚乱、食品运输失败、湖泊封锁、寺庙关闭或严重到足以停止修复的破坏都会暂停进度。如果首都航线畅通，战争就会继续；
      pre_winning_war 如果战役绕过堤道或首都受到威胁，进展就会被拒绝。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对特诺奇蒂特兰的所有权和控制权，最终独特的特诺奇蒂特兰堤道建筑存在，赞助商没有破产，没有占领，没有直接围困，没有严重的当地动乱，以及可用的堤道，桥梁，运河，渡槽，市场和大神庙通道。包括对湖泊通道、供应安全、低破坏、无封锁式隔离以及没有切断首都路线的战争状况进行检查或警告。
      start_effect_script: >-
        商店赞助国、特诺奇蒂特兰仪式地点、统治者、寺庙或祭司机构、活动仪式标记、十三的进度目标、当前进度为零以及战争或贡品活动背景。将临时负担应用于石头修复、桥梁木材、独木舟巡逻、渡槽清洁、市场治安、祭品、劳工征费、战士集结、横幅、食物和路线牌匾。每月注册
        pre_winning_war 听众。
      snapshot_effect_script: >-
        快照army_movement_speed、global_monthly_prosperity、稳定性、合法性或神圣王权、人力或武士实力、国库健康状况、战争状态、供应紧张、市场或繁荣价值、当地特诺奇蒂特兰占领、围困、动乱、破坏或繁荣、最终建筑存在、堤道通行性、桥跨准备情况、运河深度、独木舟交通、渡槽功能、市场秩序、湖泊巡逻安全、
        chinampa 供应和大寺庙访问。
      progress_effect_script: >-
        在每月的刻度上，添加具体的湖城任务的进度：堤道铺设、可移动桥梁测试、运河疏浚、渡槽清理、市场交通管制、贡品统计、战士运动排练、提供准备、湖泊巡逻、chinampa车队、洪水监视、夜间信号检查、路线劳动宣誓或独木舟登陆维修。为高度繁荣、人力、市场秩序、安全的湖泊巡逻、完整的渡槽和成功的贡品流动添加奖励进度。在破产、占领、围困、严重骚乱、堤道破裂、渡槽切断、运河堵塞、市场骚乱、湖泊封锁、桥梁被毁、食品运输失败、寺庙关闭或最终建筑缺失等情况下暂停。在
        pre_winning_war 上，仅当安全资本路线系统支持接近胜利的战役时才添加进度。
      completion_trigger_script: >-
        需要至少 13 个成功的进度单位、对特诺奇蒂特兰的持续赞助商所有权和控制权、最终建筑仍然存在、没有破产、没有占领或直接围困、没有严重的骚乱、可通行的堤道、正常运行的桥梁、可用的运河、有效的渡槽、开放的市场、安全的湖泊通道和可进入的大神庙
      completion_effect_script: >-
        移除临时堤道奉献负担，清除主动仪式进度和暂停变量，应用永久特诺奇蒂特兰堤道国家修正，授予一次性移动、繁荣、人力或当地供应奖励，并记录修复堤道、桥碑、独木舟车道、渡槽罐、市场秩序、湖泊巡逻和寺庙奉献的特诺奇蒂特兰遗址记忆。
    intended_rewards:
      permanent_country_modifier: >-
        保留源修饰符。 army_movement_speed 代表了纪律严明的堤道穿越、经过测试的可移动桥梁、独木舟支撑和清晰的区域路线，使战士和物资能够更快地穿过湖都。 global_monthly_prosperity
        代表相同的系统，为市场提供饲料、运送贡品、维持淡水并保持 chinampa 和独木舟物流的可靠性。后期的扩展应该会加强移动和繁荣，而不是将奇观转变为一般的堡垒防御或宗教转变。
      one_time_reward: >-
        完成后可以使特诺奇蒂特兰当地繁荣，人力或战士准备就绪，临时移动速度，市场秩序的稳定性，或通过湖城干净地移动的贡品的金库。如果pre_winning_war贡献了进步，一次性奖励应该倾向于军事行动和士气；如果这个周期是和平且供应充足的，它可以走向繁荣和当地粮食的恢复能力。
      local_building_reward: >-
        特诺奇蒂特兰应该保留湖堤道奉献记忆：修复铺路、测试桥梁跨度、清理独木舟车道、有人看守的湖泊巡逻路线、工作渡槽、市场交通规则、地区劳动碑和大神庙供奉记录。稍后的实施可以将其表达为当地供应弹性、减少市场动荡、更快的当地军队行动或围困和洪水破坏后更强的恢复。
    notes: >-
      源仪式是直接的，但该设计使用定时进度，因为堤道的历史价值是重复的湖泊物流。每月的听众报道维护、市场、水和运动；仅当一场接近胜利的战役可以在叙事上与穿过修复的堤道系统的战士和贡品联系在一起时，才会包含pre_winning_war。实施者应该保留历史上清晰但非无偿的牺牲的参考，并将奖励集中在军队的行动和繁荣上。
- id: 119
  key: unique_amsterdam_canal_ring
  base_key: canal_hub_city
  location: amsterdam
  source_ritual_key: three_canal_opening
  status: designed
  ritual_design_zh:
    title: 三运河开通和地块抽签
    historical_flavor: >-
      阿姆斯特丹运河环仪式将城市规划视为用水、砖、码头墙、仓库和账本书写的商业宪法。参与者包括市长、乡镇议员、测量员、城市工程师、水务局官员、疏浚人员、打桩机、泥瓦匠、木匠、船闸和水闸管理员、商业投资者、公证人、仓库管理员、保险公司、外汇经纪人、酿酒商、船商、纺织加工商、锯木厂老板、驳船船长、行会院长、贫困救济官员以及沿线分配新地块的家庭。绅士运河、国王运河、王子运河和连接码头。他们聚集在勘察桩、新运河切口、水闸、桥梁、码头地基、抽签台、商人房屋正面、仓库、计数室、车间、驳船码头和连接运河几何与生产的环路处。这些物品包括测深杆、测量链、打桩标记、排水地图、水闸钥匙、地契、税务登记册、仓库封条、保险簿、行会生产记录、砖块样本、桥梁收费表和驳船时间表。这属于阿姆斯特丹，因为运河环使水服务于信贷和生产：土地被划分，货物被储存，车间被供应，驳船运输投入，计数室将可预测的城市形态转化为贸易收入。当规划中的运河减少商人、制造商、金融家和市政府之间的摩擦时，奇迹就变成了长期的国家能力。
    mode: timed
    duration: >-
      使用十八个月的检查。十二个月代表市政工程年：测量、排水、打桩、运河挖掘、码头围墙、水闸测试、桥梁设置、地块分配、仓库许可、车间连接、驳船调度和税务登记。六项额外的检查代表了该环的财务和生产结算：公证契约转让、商铺占用、仓库库存会计、行会生产路线、保险注册和三个主要运河的最终开放。这改变了源头的直接突破性，因为只有当城市水、财产、劳动力、信贷和商品流通共同作用，不仅仅是仪式上的第一锹时，贸易收入和生产效率才会出现。
    listeners:
    - monthly
    confirmation_logic: >-
      赞助国必须拥有并控制阿姆斯特丹，最终的阿姆斯特丹运河环建筑必须在那里存在，而且国家不能破产。阿姆斯特丹不得被占领、直接围困或严重动乱。运河工程、港口通道、排水系统、水闸、码头、桥梁、仓库、会计室、车间和驳船路线必须可用或至少能够上线。城市应该有足够的市民、商人或行会参与，以使地块抽签变得可信。洪水、严重的市场扰乱、港口通道受阻、市民的敌对叛乱或无法支付工程师和挖泥船的费用都应阻止确认或显示为警告。只有在不切断贸易路线、消耗运河资金或使城市对商人和劳工不安全的情况下，其他地方的战争才被允许。
    start_logic: >-
      起始效果记录了赞助国、作为仪式地点的阿姆斯特丹、城市治安官或统治者、参与的商人和行会利益（如果有）以及当前的洪水、战争或贸易中断背景。它快照了国家trade_income、global_production_efficiency、贸易实力或市场准入（如果有）、生产收入、市民或商人财产满意度、稳定性、财政状况、通货膨胀或信贷紧张（如果建模）以及战争/封锁状态。它反映了阿姆斯特丹当地的情况：占领、围困、动乱、破坏或繁荣、最终建筑存在、港口通道、排水安全、运河开挖进度、水闸功能、码头和桥梁准备情况、仓库容量、车间通道、驳船交通、地块可用性和会计室活动。为测量人员、疏浚、打桩、砖木采购、水闸维修、桥梁工程、公证人、地块抽签管理、仓库检查员、行会路线、贫困救济搬迁和运河看守人施加临时负担。这些快照应该让进展随着偿付能力、市场信心和生产路线而扩大，同时如果城市在没有信贷或货物的情况下挖掘运河，则暂停。
    progress_logic: >-
      每个月的滴答声都代表着一项实际的公民行为。测量员用一个月的时间打桩，并根据现有街道、港口引道和排水线路确认三条运河的几何形状。再过一个月，水务局官员将测试水闸和临时水坝，以便挖掘工作不会淹没地窖或车间。又一个月，打桩机在潮湿的地面上为码头墙和商铺打下了地基。接下来的一个月，疏浚人员清理了运河河床，并移走弃土以加固道路和地块。另外一个月，公证人负责土地抽签，分配包裹并记录码头维护、税收和临街规则的义务。再过一个月，仓库管理员和保险公司就会封存第一批保税仓储空间，并登记火灾和水灾风险。接下来的一个月，驳船船长会排练从港口到仓库再到车间的路线，而行会院长则记录哪些投入到达啤酒厂、纺织加工商、锯木厂、印刷厂和船舶供应商。其他的问题可能包括桥梁通行费、账房账本、商铺许可证、贫困救济搬迁、夜间巡更路线、运河清洁条例、外汇经纪表以及起重机、地窖和装货门的检查。进步在进步，而阿姆斯特丹仍然受控、有偿付能力、平静、疲惫和商业活跃。在破产、占领、直接围困、严重骚乱、港口封锁、洪水决口、水闸故障、码头倒塌、商业信贷恐慌、行会罢工、仓库火灾、驳船路线受阻或最终建筑缺失等情况下，它会暂停。贸易收入高、生产效率高、地方繁荣、商人满意、信用稳定、港口贸易活跃、水闸运转良好、车间供应充足，可能会加速发展。
    completion_logic: >-
      完成需要十八个成功的进展单位，继续拥有和控制阿姆斯特丹，最后的运河环建筑，没有破产，没有占领或直接围困，没有严重的骚乱，安全排水，正常运行的水闸，可用的码头和桥梁，活跃的仓库，开放的港口通道，工作驳船路线，以及没有未解决的商人或行会危机。最后一幕从新运河工程旁边的剧情抽签台开始。市长们宣读运河法令；测量员布置完成的地图；公证人绘制并盖章地契；仓库管理员出示库存分类帐；行会院长承诺生产路线；水务局官员转动水闸钥匙；运载木材、谷物、布料、啤酒和进口货物的驳船在三条开放的运河中穿行。然后，商人和工匠沿着码头检查第一道装货门和计数室。具有象征意义的行为是将沼泽扩张转变为法律、水利和金融机器。这一奇迹变成了国家能力，因为可靠的储存、临街和信贷可以提高贸易收入，而更好的投入交付、车间集群和可预测的驳船物流则可以提高生产效率。
    failure_or_timeout_logic: >-
      没有普通的超时；市政工程可能会因洪水、战争或市场恐慌而暂停。失去阿姆斯特丹，失去对运河区的控制，最终建筑的消失，或者排水系统和港口通道的永久性故障，都会取消仪式并消除负担而没有奖励。由于未付工资的挖泥工、公证人、看守人和工程师留下了露天切口和法律纠纷，破产立即暂停。占领、直接围困、严重动乱、港口封锁、洪水决口、水闸故障、码头倒塌、仓库火灾、商业信贷恐慌、敌对市民起义、行会罢工、驳船交通受阻或阴谋欺诈丑闻会阻碍进展。当其他地方的战争关闭贸易路线、撤离工作人员、耗尽国库或阻止商人占领新环时，战争就会中断。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对阿姆斯特丹的所有权和控制权，最终独特的阿姆斯特丹运河环建筑存在，赞助商没有破产，没有占领，没有直接围困，没有严重的当地动乱，以及可用的港口和运河区。包括对排水系统、水闸、码头、桥梁、仓库、计数室、车间、驳船路线、商人或市民参与、没有严重洪水、没有封锁、没有敌对行会或市民危机的检查或警告。
      start_effect_script: >-
        商店赞助国、阿姆斯特丹仪式地点、城市治安官或统治者、活动仪式标记、十八个进度目标、当前进度为零、商人/行会背景（如果有）以及洪水、战争或贸易中断背景。对测量人员、疏浚、打桩、制砖、木材、水闸、桥梁、公证人、地块抽签、仓库检查、行会路由、搬迁和运河看守人施加临时运河环负担。注册每月听众。
      snapshot_effect_script: >-
        快照trade_income、global_production_efficiency、贸易实力或市场准入、生产收入、市民或商业地产满意度、稳定性、国库健康、信用紧张（如果有）、战争或封锁状态以及阿姆斯特丹当地占领、围困、动乱、破坏或繁荣、最终建筑存在、港口通道、排水安全、运河进展、水闸功能、码头和桥梁准备情况、仓库容量、车间通道、驳船交通、地块可用性、和计数室活动。
      progress_effect_script: >-
        在每月的刻度上，添加具体公民义务的进度：测量放样、水闸测试、打桩、运河疏浚、弃土路堤、地块抽签、公证契约密封、仓库检查、保险登记、驳船路线排练、行会输入路线、桥梁收费设置、会计室分类账开放、商人房屋许可证、贫困救济搬迁、夜间值班路线、运河清洁条例或起重机和地窖检查。为高贸易收入、生产效率、当地繁荣、商人满意度、稳定的信用、港口贸易、运转的水闸和供应的车间增加奖励进度。因破产、占领、围困、严重动乱、封锁、洪水决口、水闸故障、码头倒塌、信贷恐慌、行会罢工、火灾、驳船受阻、阴谋欺诈或最终建筑缺失而暂停。
      completion_trigger_script: >-
        需要至少十八个成功的进度单位，持续赞助商拥有和控制阿姆斯特丹，最终建筑仍然存在，无破产，无占领或直接围困，无严重动乱，安全排水，功能正常的水闸，可用码头和桥梁，活跃的仓库，开放的港口通道，工作驳船路线，并且没有未解决的商人，行会，洪水或信贷恐慌暂停。
      completion_effect_script: >-
        删除临时运河环负担，清除活跃的仪式进度和暂停变量，应用永久阿姆斯特丹运河环国家修正，授予一次性贸易，生产，国库或当地繁荣奖励，并记录三运河开通的阿姆斯特丹站点记忆，情节契约，水闸钥匙、仓库封条、账房分类账、行会路线承诺和驳船时间表。
    intended_rewards:
      permanent_country_modifier: >-
        保留源修改器。 trade_income 代表运河环的仓库、码头、保税仓库、会计所和商人财产规则，将更多的货物转变为应税和可融资的商业。 global_production_efficiency
        代表通过驳船接收输入的车间，聚集在可靠的运河周围，并使用支持贸易的相同账本和存储系统。后期的规模化应该会加深贸易收入和生产效率，而不是将奇迹转化为海军士气或一般城市税收。
      one_time_reward: >-
        完成后可以从地块销售和许可证、当地繁荣、生产进步、商人满意度、贸易实力或短暂的建设/城市发展脉冲中获得国库。如果仪式在洪水或信贷恐慌中幸存下来而没有崩溃，那么回报可能会倾向于恢复力和生产；
      local_building_reward: >-
        阿姆斯特丹应该保留三运河地块登记记忆：测量的几何形状、密封的地块契约、工作水闸、稳定的码头墙、保税仓库、会计室分类账、行会输入路线、驳船时间表和运河清洁条例。稍后的实施可以将其表达为当地繁荣、减少洪水破坏、更好的城市生产吞吐量或更快地从封锁和市场冲击中恢复。
    notes: >-
      源仪式是直接的，但该设计使用每月定时进度，因为阿姆斯特丹的运河环只有通过持续的市政工程、财产法、仓储、信贷和车间物流才能变得强大。月月是正确的聆听者；统治者的死亡和战争挂钩会分散人们对市政和商业机制的注意力。实施者应将奖励重点放在贸易收入和生产效率上。
