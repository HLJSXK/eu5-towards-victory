  status: designed
  ritual_design_zh:
    title: 科纳克太阳能战车奉献
    mode: timed
    duration: >-
      定时模式应涵盖一个太阳节和维护年。每月的十二个刻度代表观察日出角度、清洁雕花车轮、修理马匹和战车石雕、安排舞蹈和音乐服务、准备祭品、维护沿海朝圣之路以及为苏里亚举行季节性仪式。由于寺庙通过建筑、表演和朝圣反复教导宇宙秩序，因此声望和皈依速度得到提高。
    listeners:
    - monthly
    historical_flavor: >-
      太阳战车奉献仪式属于科纳克，因为寺庙的形式是石头神学：一辆巨大的苏里亚战车，配有轮子、马匹、平台、舞者、牧师、海岸灯和雕刻表面，使朝圣者可以看到太阳的运动。参与者包括太阳崇拜的牧师、天文学家历法观察者、雕塑家、石头抛光师、舞者、鼓手、歌手、灯管人、朝圣者向导、沿海道路守卫、捐助者、运水者、寺庙会计以及协调神圣道路的普里当地官员。这些地方包括战车平台、车轮雕刻、马雕、舞厅、圣所或图像空间，设有厨房、灯室、沿海引路、朝圣者庇护所和日出观赏点。器物有石轮、影痕、花环、铜灯、鼓、舞饰、供器、修棚架、供养名单、路标、水盆、节历等。
      monthly_prestige 之所以得以保存，是因为这座寺庙是雕刻天文学和海岸奇观的公共奇迹。 global_pop_conversion_speed_modifier之所以得以保留，是因为该仪式将太阳观测、舞蹈、布道、供奉和朝圣变成了重复的指令。
    confirmation_logic: >-
      赞助者必须拥有或控制普里，最后的科纳克太阳神庙奇迹建筑必须存在，国家不能破产，寺庙、沿海道路和朝圣者避难所不得被占领、遭到敌对围困或严重动乱。寺庙必须有牧师、表演者、雕塑家，并有通往日出路线的通道；朝圣道路和供水必须安全。如果有的话，确认应检查每月的声望、转换速度、文化传统、神职人员满意度、当地繁荣、朝圣者交通、道路安全、沿海袭击或风暴破坏、破坏、卫生和财政。只有当战争关闭沿海道路、危及朝圣者或损坏寺庙平台时，战争才会造成封锁。
    start_logic: >-
      起始效果记录了赞助国、作为仪式地点的普里、最终的寺庙建筑、当地的宗教背景、沿海路线背景和活跃的太阳开光年份。它反映了国家的基线：每月的声望、皈依速度、声望、宗教团结或宽容、神职人员满意度、文化传统、财政、稳定、战争状态和朝圣活动。它快照了当地的基线：占领、围困、动乱、破坏、繁荣、寺庙状况、车轮状况、马雕塑状况、舞厅通道、祭品供应、灯油、表演者可用性、牧师合作、沿海道路安全、供水、朝圣者避难所容量以及风暴或袭击风险。它初始化用于太阳观测、车轮清洁、阴影标记检查、马/战车修理、脚手架安全、舞蹈名册、音乐名册、牧师服务、祭品准备、灯服务、朝圣路线、庇护所供应、捐赠者登记和最终日出奉献的计数器。临时负担代表石头修复、石油、鲜花、音乐家和舞蹈家的支持、警卫、水、避难所食物、脚手架和历法专家。
    progress_logic: >-
      每月的进步是太阳的路径成为公共指导。日历观察者观察日出和阴影线，然后将它们与节日日历进行比较。石材抛光机清洁车轮辐条和轮辋；雕塑家修复受损的马匹、战车面板和平台边缘；脚手架工作人员让访客远离不安全的工作。祭司们为苏里亚准备祭品和诵经。舞者、鼓手和歌手排练与季节性仪式相关的仪式。灯管人数着油和灯芯；捐赠职员记录用于维修和节日的礼物；道路警卫在沿海通道巡逻；朝圣者导游标记安全路径和供水点。当普里安全、寺庙办公室得到报酬、道路安全、表演者和牧师合作、朝圣者可以聚集时，进步就会推进。它因破产、占领、围困、严重骚乱、风暴破坏、沿海袭击、不安全的雕塑、表演者失踪、牧师纠纷、缺水、灯油短缺、避难所疾病或道路堵塞而暂停。它以崇高的声望、活跃的朝圣、满意的神职人员、深厚的文化传统、繁荣的施主、清晰的沿海路线和良好的季节条件而加速。
    completion_logic: >-
      完成需要太阳、车轮、影子、马/战车、脚手架、舞蹈、音乐、牧师、供品、灯、路线、庇护所、施主和最后的开光计数器才能完成。普里必须保持控制，最后的神庙必须存在，国家不能破产，沿海途径必须安全。最后的场景发生在日出时。祭司带着供品站在车庙前；观察者在清洁过的车轮上标记出第一道光；舞者和音乐家表演太阳仪式；雕塑家展示修复后的马匹和镶板；朝圣者通过有人看守的道路抵达；宣读捐助者姓名和节日义务。这一奇迹成为了国家能力，因为科纳克通过建筑、日历、表演和朝圣的公共结合来进行教学：国家获得了威望，信仰通过重复的太阳仪式传播。
    failure_or_timeout_logic: >-
      仪式可以暂停，但如果错过太阳节，进展就会减弱，因为日历、表演名单和朝圣者时间表必须重新设置。如果赞助商失去了普里，最后的寺庙建筑消失，国家仍然破产，寺庙被占领或严重损坏，或者沿海路线变得永久不安全，那么它就会失败或取消。严重骚乱、风暴损坏、雕塑倒塌、沿海袭击、表演者缺席、牧师冲突、庇护所疾病、缺水或道路封锁应暂停进度，并可能重置车轮、路线、表演或最终奉献计数器。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对普里的控制，最终独特的寺庙建筑存在，没有破产，没有重复的活动仪式，没有占领或不安全的围困，可控制的骚乱，可用的寺庙平台，安全的沿海道路，可用的牧师，表演者，雕塑家、朝圣者庇护所，没有严重的风暴/袭击损坏。添加对声望、转换速度、文化传统、神职人员满意度、朝圣、路线安全、繁荣、破坏和金库的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和普里，存储宗教和沿海路线背景，应用临时太阳节负担，初始化太阳观测计数器，车轮清洁，阴影检查，马/战车修理，脚手架安全，舞蹈名册，音乐名册，牧师服务，祭品准备，灯服务，朝圣者路线、庇护所供应、捐助者登记和最终日出奉献，并记录国家/地方基线。
      snapshot_effect_script: >-
        刷新每月声望、转换速度、声望、宗教统一或宽容、神职人员满意度、文化传统、国库、稳定性、战争状态、朝圣活动、普里占领、围困、动乱、破坏、繁荣、寺庙状况、车轮状况、马雕状况、舞厅访问、供奉供应、灯油、表演者可用性、牧师合作、道路安全、水、避难所容量、风暴/袭击风险和最终建筑物存在。
      progress_effect_script: >-
        每月刻度、提前日出观察、车轮清洁、阴影标记检查、雕塑修复、脚手架安全、舞蹈和音乐排练、牧师服务、祭品、灯具、路线巡逻、避难所供应、捐赠者记录和最后仪式准备。由于破产、占领、围困、动乱、风暴破坏、沿海袭击、不安全的雕塑、表演者失踪、牧师纠纷、水或石油短缺、避难所疾病或道路堵塞而暂停或衰退。加速声望、朝圣、神职人员支持、文化传统、捐助者和安全道路。
      completion_trigger_script: >-
        要求完成太阳能计数器或总体进展，普里控制，最终寺庙存在，没有破产，没有占领或危险的风暴破坏，可控的骚乱，修理轮子和马匹，准备好的牧师和表演者，开放的沿海路线，储备的避难所，有效的节日日历，并准备好最终的日出奉献。
      completion_effect_script: >-
        删除临时节日负担，应用永久国家修正，保留每月威望和转换速度，授予一次性威望，文化传统，神职人员满意度，朝圣收入，宗教团结或当地繁荣奖励，添加科纳克太阳神庙记忆，清除瞬态计数器，并保留完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留monthly_prestige和global_pop_conversion_speed_modifier。科纳克的声望来自于其太阳能战车建筑、雕塑、舞蹈和海岸奇观。转换速度来自牧师、节日、朝圣和历法教学，这些使邪教变得可见和可重复。
      one_time_reward: 授予一次性威望、文化传统、神职人员满意度、朝圣繁荣、宗教团结或当地骚乱救济。通过成功的日出对准、修复的雕塑和安全的朝圣路线来获得规模奖励。
      local_building_reward: >-
        普里应该记住清洁的轮雕、阴影标记、修复的马雕塑、舞蹈和音乐名册、提供账本、灯库、捐赠者登记册、沿海路线巡逻、庇护所用品和日出节日记录。稍后的实施可以将其表达为当地朝圣收入、文化输出或路线安全。
    notes: 源仪式是即时的，但定时模式更好地代表太阳观测、节日准备和雕塑维护。每月就够了；战争钩子只是中断检查。保留对声望和转化速度的永久奖励，并将当地文化作为辅助记忆。
- id: 176
  key: unique_fatehpur_sikri
  base_key: great_assembly_hall
  location: agra
  source_ritual_key: fatehpur_sikri_rite
  status: designed
  ritual_design_zh:
    title: 伊巴达特卡纳辩论和帝国观众
    mode: timed
    duration: >-
      定时模式应涵盖六到十二个月的法庭辩论和观众季。这段时间包括准备伊巴达特卡纳日程、安排学者和法学家、翻译争议、记录会议记录、起草法令、接待特使以及测试审议是否可以纳入内阁决定。只有当辩论成为可用的帝国程序时，内阁效率和外交声誉才会提高。
    listeners:
    - monthly
    - ruler_death
    historical_flavor: >-
      伊巴达特卡纳辩论属于法塔赫布尔西格里，因为阿格拉附近的红砂岩宫殿城市使帝国思想变得空间化：Buland Darwaza、庭院、带有中心柱子的 Diwan-i-Khas、观众厅、抄写室和辩论空间，所有这些都构成了一位统治者在发布政策之前想要听取学者、法学家、贵族和特使的意见。参与者包括皇帝或公认的继承人、维齐尔、宫廷秘书、法学家、神学家、哲学家、翻译家、苏菲派或宗教学者、拉杰普特和图拉尼贵族、省级官员、外国使节、警卫、抄写员和请愿者，他们的案例检验了论坛的情况。这些地方包括伊巴达特卡纳
      (Ibadat Khana)、迪万伊哈斯 (Diwan-i-Khas)、公众法庭、使节住宿处、大法官办公桌、档案馆、宫殿大门以及通往布兰达瓦扎 (Buland Darwaza) 的游行通道。这些物品包括辩论议程、请愿书、翻译文本、法律意见、法令草稿、印章、观众座位表、特使礼物、回信、编年史笔记和登记簿。
      country_cabinet_efficiency 之所以被保留，是因为论坛将分歧转化为总结性建议和命令。 diplomatic_reputation之所以被保留，是因为使节们看到了一个能够听到多种声音并给出一致答案的朝廷。
    confirmation_logic: >-
      赞助者必须拥有或控制阿格拉，最后的法塔赫布尔西格里奇迹建筑必须存在，国家不能破产，集会城、宫门和朝道不能被占领、遭到敌对围困或严重动乱。该国应该有一个公认的统治者或摄政、运作良好的议会或内阁、可用的抄写员和翻译，以及足够的宫廷保安来接待学者和使节。如果可以的话，检查应考虑内阁效率、外交声誉、合法性、法院支出、稳定性、宗教宽容或紧张、贵族满意度、腐败、特使可用性、档案能力和继承危机。战争只有在威胁法庭或阻止使节和官员参加时才会封锁。
    start_logic: >-
      开始效果记录了赞助国、阿格拉作为仪式地点、最后的集会大楼、统治者/摄政背景、当前内阁和特使背景以及活跃的辩论季节。它快照了国家基线：country_cabinet_efficiency、diplomatic_reputation、合法性、稳定性、法院支出压力、腐败、贵族满意度、宗教宽容或冲突、财政/收入、特使关系、战争状态和继承风险。它快照了当地的基线：占领、围困、动乱、破坏、繁荣、宫殿通道、辩论厅状况、档案/抄写能力、翻译能力、警卫忠诚度、使节住宿、观众法庭秩序和路线安全。它初始化了议程登记、学者传唤、法学家案卷、翻译台、贵族出席、使节接待、请愿整理、辩论记录、内阁摘要、法令起草、接见回复、档案归档、继任者确认和最后朝见等计数器。临时负担包括津贴、住宿、翻译、抄写、警卫、宫廷膳食、礼物以及让部长们参与结构化辩论的机会成本。
    progress_logic: >-
      每月的进展是审议成为政府。法院秘书收集请愿书和议程项目，然后按法律、宗教、收入、外交、军事供应和省级冲突对它们进行排序。学者、法学家发表意见；译者提出不熟悉的论点；贵族解释省级利益；特使递送信件并等待一致的答复。抄写员做会议记录，找出矛盾，并将摘要发送给瓦齐尔和统治者。在觐见厅，统治者向参与者提问并下令起草法令。档案馆职员将最终摘要归档，以便后来的议会知道决定了什么。当阿格拉安全、统治者或摄政得到承认、抄写员和翻译得到报酬、贵族出席、特使可以到达这座城市时，进步就会推进。它因破产、占领、围困、严重动乱、法庭逃亡、学者抵制、贵族派别暴力、翻译失败、档案丢失、请愿书分类腐败、使节侮辱或继承危机而暂停。它以高度的合法性、强大的内阁能力、低腐败、满意的贵族、积极的外交、熟练的翻译和稳定的国库而加速。
      ruler_death听众要求继任者确认论坛：顺利继任可以保留议程和档案计数器，而有争议的继任则重置观众和法令计数器，直到新统治者接受程序。
    completion_logic: >-
      完成需要议程、学者、法学家、翻译、贵族、特使、请愿、会议记录、内阁摘要、法令、观众答复、档案、继任者和最终观众计数器完成。阿格拉必须保持控制，最终的建筑必须存在，国家不能破产，统治者或摄政当局必须得到承认。最后一幕发生在
      Ibadat Khana 和 Diwan-i-Khas 之间。抄写员宣读内阁摘要，学者和法学家承认有记录的论点，贵族听取实际命令，特使收到密封的答复，统治者发布公告，辩论将充实内阁，而不是成为奇观。如果发生继承，继承人将在相同的支柱和法院面前重复确认。这一奇迹变成了国家能力，因为法塔赫布尔西格里将知识分子的多元化和外交受众变成了可重复的决策渠道。
    failure_or_timeout_logic: >-
      仪式可以暂停，但如果辩论季节因参与者分散和请愿摘要变得陈旧而结束，进展就会减弱。如果赞助商失去阿格拉、最后的集会大楼消失、国家仍然破产、宫殿城市被占领或废弃、或者统治者拒绝承认论坛，则该论坛失败或取消。严重骚乱、贵族叛乱、学者抵制、特使暴力、档案破坏、翻译丑闻、请愿书腐败、宗教骚乱、法庭逃亡或有争议的继承权应该暂停进度，并可能重置议程、会议记录、法令或最终观众计数器。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对阿格拉的控制，最终独特的议会大楼存在，没有破产，没有重复的活跃仪式，没有占领或敌对围困，可控的骚乱，公认的统治者/摄政，正常运转内阁/议会、可用的抄写员和翻译、安全的特使通道以及可用的宫殿城市。添加对内阁效率、外交声誉、合法性、法院支出、腐败、贵族满意度、宗教紧张、档案容量和继承危机的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助者和阿格拉，存储统治者/摄政、内阁和特使上下文，应用临时辩论法庭负担，初始化议程登记、学者传票、法学家案卷、翻译台、贵族出勤、特使接待、请愿整理、辩论记录、内阁摘要、法令起草、听众答复、档案归档、继任者确认和最终帝国听众的计数器，并记录国家/地方基准。
      snapshot_effect_script: >-
        刷新内阁效率、外交声誉、合法性，稳定性、法庭支出、腐败、贵族满意度、宗教宽容/紧张、国库、使节关系、战争状态、继承风险、阿格拉占领、围困、动乱、破坏、繁荣、宫殿通道、辩论厅状况、档案/抄写能力、翻译能力、警卫忠诚度、使节住宿、观众秩序、路线安全和最终建筑存在。
      progress_effect_script: >-
        按月勾选、提前议程排序、学者和法学家参与、翻译、贵族出勤、特使接待、请愿书审查、辩论记录、内阁摘要、法令草案、观众答复、档案归档和最终观众准备。因破产、占领、围困、动乱、法庭逃亡、学者抵制、派系暴力、翻译失败、档案丢失、腐败、使节侮辱、宗教骚乱或继承危机而暂停或衰退。在ruler_death上，要求在完成之前确认论坛。
      completion_trigger_script: >-
        要求完成辩论计数器或总体进度，阿格拉控制，最终建筑存在，没有破产，没有占领或不安全的围困，可控的骚乱，公认的统治者/摄政，完成的内阁摘要，密封的法令或答复，归档会议记录，准备好特使答复，并准备好最终的帝国观众。
      completion_effect_script: >-
        消除临时辩论负担，应用永久国家修正保留内阁效率和外交声誉，授予一次性合法性、稳定性、宽容、学者声望、高贵满意度或外交恩惠奖励，添加法塔赫布尔西格里论坛内存，清除瞬态计数器，并保留完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留country_cabinet_efficiency和diplomatic_reputation。内阁效率来自于议程、会议记录、摘要和法令；外交声誉来自于结构化的特使接待、翻译后的答复以及以理性听众而闻名的法庭。
      one_time_reward: 通过更干净的请愿分类授予一次性合法性、稳定、宽容、学者威望、贵族满足、外交青睐或减少腐败。如果ruler_death发生，将部分奖励用于论坛的继任者确认。
      local_building_reward: >-
        阿格拉应该记住辩论议程、学者传票、翻译登记册、贵族出席名册、特使住宿清单、请愿书包、会议记录、内阁摘要、法令草稿、观众答复和档案文件。稍后的实施可以将其表达为当地法院效率、外交准入或较低的派系骚乱。
    notes: >-
      源仪式是即时的，但定时模式适合辩论和观众季节。每月表达审议和起草； ruler_death 被保留，因为继任者必须接受该论坛才能保持内阁效率。对内阁效率和外交保持永久奖励；宽容是重要的味道和一次性奖励，而不是源永久修饰符。
- id: 177
  key: unique_calicut_port_city
  base_key: great_port
  location: kozhikode
  source_ritual_key: calicut_port_city_rite
  status: designed
  ritual_design_zh:
    title: 扎莫林的胡椒码头契约
    mode: timed
    duration: >-
      定时模式应涵盖一个季风交易周期。十二个月的刻度代表预测抵达、开设胡椒仓库、认证重量、注册经纪人和翻译、分配锚地、与阿拉伯、印度和中国商人谈判合同，以及在船舶离开后关闭海关账户。由于卡利卡特成为可靠的季风转口港，贸易收入和贸易范围不断扩大。
    listeners:
    - monthly
    historical_flavor: >-
      扎莫林的胡椒码头契约属于卡利卡特，因为科泽科德是马拉巴尔港口，季风知识、胡椒腹地、外国商人、船长、经纪人、海关官员和皇家保护形成了国际化的商业秩序。参与者包括扎莫林官员、港口警卫、穆斯林和印度教商人、阿拉伯单桅帆船船长、中国垃圾船船长、当地经纪人、口译员、海关称重员、仓库管理员、木材起重机工作人员、胡椒种植者代理人、货币兑换商、飞行员和解决码头纠纷的法官。这些地方包括香料码头、胡椒仓库、木材起重机、市场街道、海关、商人宿舍、贸易社区使用的清真寺和寺庙、锚地、船只停靠点以及确认扎莫林保护的观众席。这些物品包括胡椒袋、样品碗、天平、重量石、仓库钥匙、锚地统计、季风日历、海关收据、合同棕榈叶或文件、翻译登记册、飞行员笔记和纠纷分类账。
      trade_income 被保留，因为合同、重量和海关变得可信。 trade_range之所以得以保留，是因为季风引航员、外国商人网络和受保护的锚地将港口的商业范围延伸到了印度洋。
    confirmation_logic: >-
      赞助商必须拥有或控制科泽科德，最终的卡利卡特港口奇迹建筑必须存在，国家不得破产，港口、仓库、商人宿舍和入海通道不得被占领、封锁或严重动乱。国内外客商必须能够进入；来自内陆地区的胡椒路线必须足够安全才能供应；必须有飞行员和口译员。如果有的话，确认应检查贸易收入、贸易范围、商人满意度、港口准入、封锁、海军安全、当地繁荣、海关效率、海盗、季风季节、外交关系和腐败。只有当战争关闭港口或使锚地在贸易季节变得不安全时，才会造成封锁。
    start_logic: >-
      起始效果记录了赞助国科泽科德作为仪式地点、最终的港口建筑、活跃的季风/贸易背景以及胡椒码头盟约周期。它快照国家基线：trade_income、trade_range、财政/收入、商人满意度、外交声誉（如果有）、海军/港口安全、水手或护航能力、腐败、海盗压力、外交关系和战争状态。它记录了当地的基线：占领、封锁、动乱、破坏、繁荣、港口通道、仓库容量、起重机状况、胡椒供应、海关职能、口译员可用性、飞行员可用性、锚地安全、商家季度订单和争议积压。它初始化季风预报、胡椒样品检验、重量校准、经纪人许可、翻译登记、仓库密钥审核、锚地分配、海关收据、引航员名册、合同认证、商船纠纷听证会、车队或巡逻通知以及最终码头契约等柜台。临时负担包括港口警卫、称重员、翻译、仓库维修、引航费、市场治安、给外国船长的礼物以及货物采样和称重时的延误。
    progress_logic: >-
      每月的进展是季风港口使距离可预测。港口官员宣布预计抵达时间并指定锚地，以便单桅三角帆船、帆船和沿海船只不会拥挤在港口。辣椒代理赠送样品碗；秤校准石块；海关职员将合同与麻袋和收据进行比较。经纪人获得许可并与商业公司挂钩；口译员注册语言和批准的合同公式；飞行员注意安全进场和季节性危险。仓库管理员发放钥匙并检查干燥度；起重机工作人员在搬运麻袋时不会压碎它们；法官审理有关掺假胡椒、未付预付款、货物损坏和锚地权的争议。当科泽科德安全、船只可以进入、胡椒到达、商人相信秤、海关官员得到报酬时，进步就会推进。它因破产、占领、封锁、严重骚乱、海盗统治、胡椒短缺、仓库火灾、砝码损坏、翻译丑闻、经纪人违约、季风灾难或外国商船飞行而暂停。它以高商人满意度、强大的海军安全、繁荣的腹地、干净的海关、活跃的外交关系、安全的锚地和强大的季风知识来加速。
    completion_logic: >-
      完成需要季风、胡椒、重量、经纪人、口译员、仓库、锚地、海关、领航员、合同、争端、巡逻和最终契约柜台完成。科泽科德必须保持控制，最终建筑必须存在，国家不能破产，港口不能被封锁。最后一幕发生在胡椒码头。扎莫林官员宣读了该盟约；经纪人站在许可权重旁边；口译员重复外籍船长的术语；仓库管理员出示密封的钥匙；飞行员指定起飞时间；海关职员关闭收据；商人接受锚地保护和争议规则。这一奇迹变成了国家能力，因为卡利卡特将胡椒、季风时机和商人多元化转变为可靠的港口秩序，从而增加了收入并扩大了贸易范围。
    failure_or_timeout_logic: >-
      该仪式可能会在季风之间暂停，但如果错过交易季节，进展就会减弱，因为胡椒合同、锚地清单和外国商人信托很快就会到期。如果赞助商失去科泽科德、最后的港口建筑消失、国家仍然破产、港口被封锁或占领、或者商业区被摧毁，那么它就会失败或取消。严重骚乱、海盗、仓库火灾、辣椒作物歉收、天平损坏、经纪人破产、翻译丑闻、外国船长暴力或季风灾难应该暂停进度，并可能重置合同、锚地或争议计数器。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对科泽科德的控制、最终独特的港口建筑存在、没有破产、没有重复的活动仪式、没有占领、封锁或严重骚乱、可用的港口和仓库、可用的胡椒供应、商人、经纪人、口译员、飞行员和安全锚地。添加对贸易收入、贸易范围、商人满意度、海军安全、海关效率、海盗、繁荣、腐败、外交关系和战争干扰的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和科泽科德，存储季风和贸易背景，应用临时港口管理负担，初始化季风预报计数器，胡椒样品，重量校准，经纪人许可，翻译登记，仓库钥匙，锚地分配，海关收据，飞行员名册，合同认证，争议听证会，船队/巡逻通知和最终契约，以及记录国家/地方基线。
      snapshot_effect_script: >-
        刷新贸易收入、贸易范围、金库、商人满意度、外交声誉、海军/港口安全、水手/船队、腐败、海盗压力、外交关系、战争状态、科泽科德占领、封锁、动乱、破坏、繁荣、港口通道、仓库容量、起重机状况、胡椒供应、海关职能、翻译和飞行员可用性、锚地安全、商人季度订单、争议积压和最终建筑存在。
      progress_effect_script: >-
        关于每月报价、提前季风时间表、胡椒检查、秤校准、经纪人许可证、口译员名册、仓库审计、锚地分配、海关收据、飞行员注释、合同认证、争议听证会、巡逻通知和契约准备情况。因破产、占领、封锁、动乱、盗版、胡椒短缺、仓库火灾、砝码损坏、翻译丑闻、经纪人违约、季风灾难或商船航班而暂停或衰退。加速实现商人信任、海军安全、胡椒供应、清洁海关、外交关系和安全锚地。
      completion_trigger_script: >-
        要求完成港口柜台或总体进度，科泽科德控制，最终建筑存在，无破产，无封锁，开放港口，经过认证的重量，许可经纪人，注册口译员，密封仓库，指定锚地，有效海关收据，解决争端，并准备好最终契约。
      completion_effect_script: >-
        消除临时港口负担，申请永久国家保留贸易收入和贸易范围的修改器，授予一次性国库、商人满意度、当地繁荣、外交准入或减少海盗奖励，添加卡利卡特港契约内存，清除瞬态计数器，并保留完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留trade_income和trade_range。收入来自经过认证的胡椒合同、重量、海关和仓库；范围来自季风领航员、外国商人网络、锚地权和值得信赖的多语言经纪。
      one_time_reward: 授予一次性国库/贸易收入、商人满意度、当地繁荣、外交准入、水手或护航队支持或减少海盗行为。通过干净的重量、开放的锚地和解决的商业纠纷来衡量奖励。
      local_building_reward: >-
        科泽科德应该记住季风时间表、胡椒样本记录、校准重量、经纪人许可证、翻译登记册、仓库钥匙、锚地理货、海关收据、飞行员记录和争议分类账。稍后的实施可以将其表达为当地港口的繁荣、贸易范围或商人信任。
    notes: 源仪式是即时的，但定时模式适合季风贸易季节。每月就足够了，因为港口的逻辑是合同、规模、仓库和船舶到达。保留贸易收入和贸易范围的永久奖励；外交准入是次要结果。
- id: 178
  key: unique_wieliczka_salt_mine
  base_key: mining_city
  location: wieliczka
  source_ritual_key: wieliczka_salt_mine_rite
  status: designed
  ritual_design_zh:
    title: 盐教堂下降和皇家称重
    mode: timed
    duration: >-
      定时模式应涵盖一个采矿和市场交付年份。每月十二个刻度代表通过竖井下降、检查木材支撑、祝福盐教堂、检查起重机、审核推车、称盐、密封皇家股份以及将货物发送到市场。生产效率和贸易收入提高，因为该矿成为了一个有纪律的地下财政机器。
    listeners:
    - monthly
    historical_flavor: >-
      盐教堂下降属于维利奇卡，因为该矿的意义在于地下劳动力、王室收入、工人虔诚、技术安全和市场分配的结合。参与者包括矿工、竖井管理员、木匠、起重机操作员、马车司机、皇家检查员、称重员、抄写员、盐切割工、教堂服务员、牧师、警卫、商人和财务代理。这些地方包括竖井、木结构画廊、水晶盐室、雕刻盐教堂、提升室、马车轨道、称重室、地面仓库、路门和皇家会计办公室。这些物品包括镐、楔子、盐块、盐水桶（如适用）、木材道具、绳索、提升鼓、灯具、教堂雕刻、矿工代币、重量石、皇家印章、手推车、市场合同和事故卷。
      global_production_efficiency 得以保留，是因为安全竖井、测量的推车和训练有素的工作人员减少了浪费和干扰。 trade_income之所以被保留，是因为盐是一种应税、可运输的主食，其价值取决于标准重量、受保护的道路和值得信赖的皇家股份。
    confirmation_logic: >-
      赞助商必须拥有或控制维利奇卡，最终的盐矿奇迹建筑必须存在，国家不能破产，矿井、地面仓库和市场道路不得被占用、淹没、燃烧或严重动乱。矿井必须有矿工、木材、绳索、提升机、灯具和通往市场的工作道路。如果可行，确认应检查生产效率、贸易收入、当地繁荣、工人安全、采矿产出、国库需求、商人准入、破坏、事故风险、重量腐败和道路安全。只有当战争切断市场道路、征用矿工或威胁竖井和仓库时，战争才应该被封锁。
    start_logic: >-
      开始效果记录了赞助国、作为仪式地点的维利奇卡、最终的矿山建设、活跃的采矿季节和皇家财政背景。它反映了国家基线：全球生产效率、贸易收入、财政/收入、采矿或生产能力、商人满意度、稳定性、腐败、劳动力/人力压力和战争状态。它快照了当地基线：占领、动乱、破坏、繁荣、矿山状况、竖井安全、木材供应、绳索/提升机状况、灯具供应、教堂状况、矿工士气、车轨状况、称重室精度、道路通行、仓库库存、洪水或瓦斯风险（如果有）以及警卫覆盖范围。它初始化用于下降检查、木材支撑、提升机审计、灯具库存、房间测绘、教堂服务、切割人员名册、推车批次、重量校准、皇家份额印章、市场合同、道路护送、事故赔偿和最终皇家称重的计数器。临时负担包括木材、绳索、灯具、工资、牧师或教堂支持、警卫、起重机维修、事故赔偿以及审计期间的延迟销售。
    progress_logic: >-
      每月的进展证明了盐可以在不消耗工人或欺骗王室的情况下提取。竖井管理员与检查员一起下降，检查空气、水、灯具和木材支柱。木匠更换破裂的支架；起重机操作员检查绳索和卷筒；矿工们切割石块并记录哪个房间生产了每辆车。教堂服务员在危险工作之前维护灯具和服务。称重器校准石头；抄写员输入购物车号码；皇家检查员标记王冠份额；商家在地面仓库检查标准批次。警卫和道路管理员准备护送货物到市场。当矿井安全、矿工得到报酬、支架和提升机完好、重量准确且道路保持畅通时，就会取得进展。它因破产、占领、严重骚乱、竖井倒塌、洪水、提升机故障、灯短缺、木材短缺、矿工罢工、事故丑闻、伪造重物、仓库盗窃、道路抢劫或市场关闭而暂停。它随着高涨的工人士气、良好的木材供应、干净的账目、当地的繁荣、强劲的商业需求、安全的道路和稳定的皇家监督而加速。
    completion_logic: >-
      完成需要完成下降、木材、起重机、灯、房间、教堂、船员、推车、重量、皇家印章、合同、护送、事故和最终称重计数器。维利奇卡必须保持控制，最终的矿井建筑必须存在，国家不能破产，竖井和市场道路必须可用。最后的场景从盐教堂的地下开始，矿工和检查员在那里参加简短的仪式，然后带着标记的推车上升。在称重室，皇家检查员校准宝石，密封皇冠份额，补偿或记录事故，并在看守下释放商人批次。这个奇迹变成了国家能力，因为维利奇卡将地下纪律与财政可靠性联系起来：生产更安全，重量值得信赖，盐作为可预测的贸易收入来源进入市场。
    failure_or_timeout_logic: >-
      仪式可以暂停，但如果由于木材腐烂、绳索磨损、房间地图变得不准确以及重量失去信任而导致检查失败，进展就会减弱。如果赞助商失去了维利奇卡、最后一座矿场建筑消失、国家仍然破产、矿场被洪水淹没或倒塌而无法使用，或者市场道路被永久切断，那么活动就会失败或取消。严重骚乱、竖井灾难、提升机故障、木材短缺、矿工叛乱、教堂亵渎、伪造砝码、皇室股份欺诈、仓库火灾、土匪控制或战争征用应暂停进度，并可能重置安全、称重或交付计数器。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对维利奇卡的控制，最终独特的矿井建筑存在，无破产，无重复的活跃仪式，无占领，严重骚乱，洪水/倒塌/火灾危机，可用竖井和仓库、可用的矿工、木材、绳索、提升机、灯具、重物和市场道路通道。添加对生产效率、贸易收入、采矿产量、金库、工人安全、繁荣、腐败、商人准入、事故风险和战争干扰的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和维利奇卡，存储采矿季节和皇家财政背景，应用临时矿山安全和称重负担，初始化下降检查计数器，木材支撑，提升机审计，灯库存，房间测绘，教堂服务，切割人员名册，购物车批次，重量校准，皇家股份印章，市场合同，道路护送、事故赔偿、最终皇家称重以及记录国家/当地基线。
      snapshot_effect_script: >-
        刷新生产效率、贸易收入、金库、采矿产量、商人满意度、稳定性、腐败、劳动压力、战争状态、维利奇卡占领、动乱、破坏、繁荣、矿山状况、竖井安全、木材、绳索/提升机状况、灯具供应、教堂状况、矿工士气、车轨、称重室精度、道路通行、仓库库存、洪水/瓦斯风险、警卫覆盖率和最终建筑物存在。
      progress_effect_script: >-
        按月刻度，推进竖井下降检查、木材维修、起重机测试、灯数、房间地图、教堂服务、船员名册、推车批次、重量校准、皇家印章、市场合同、道路护送和事故记录。因破产、占领、动乱、倒塌、洪水、起重机故障、灯/木材短缺、矿工罢工、事故丑闻、伪造重物、盗窃、土匪行为或市场关闭而暂停或衰退。加快士气、木材、清洁账目、需求和安全道路。
      completion_trigger_script: >-
        要求完成矿山计数器或总体进度，维利奇卡控制，最终建筑存在，无破产，无占领或重大矿山危机，安全竖井，工作提升机，校准重量，密封的皇家份额，商人批次准备就绪，道路护送准备好，并完成最终称重。
      completion_effect_script: >-
        消除临时矿山负担，应用永久国家修正，保持生产效率和贸易收入、授予一次性国库、当地繁荣、工人安全、采矿产出、商人满意度或破坏恢复奖励、添加 Wieliczka 矿场内存、清除瞬态计数器并保留完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留 global_production_efficiency 和 trade_income。生产效率来自更安全的支撑、提升机、室地图和推车记录；贸易收入来自校准重量、皇家份额、守卫仓库和可靠的盐交付。
      one_time_reward: 授予一次性国库、贸易收入、当地繁荣、采矿产量、工人安全或商人满意度。通过清洁重量审核和低事故干扰来衡量奖励。
      local_building_reward: >-
        维利奇卡应该记住木材支撑分类帐、起重机检查、灯具库存、房间地图、教堂服务、购物车批次记录、校准重量、皇家份额印章、市场合同、护送名册和事故赔偿卷。稍后的实施可以将其表达为当地采矿安全、生产或贸易可靠性。
    notes: >-
      源仪式是即时的，但定时模式适合采矿年的安全检查和市场交付。每月一次就足够了，因为该站点的力量来自于重复的提取规则。保持生产效率和贸易收入的永久奖励；财务可靠性是一种一次性或局部的表现。
- id: 179
  key: unique_wawel_castle
  base_key: star_fortress_city
  location: krakow
  source_ritual_key: wawel_castle_rite
  status: designed
  ritual_design_zh:
    title: 瓦维尔加冕和龙山集结
    mode: timed
    duration: >-
      定时模式应涵盖宫廷、大教堂和驻军季节。每月十二个刻度代表王权检查、大教堂礼拜仪式、贵族召唤、卫兵集结、墙检阅、皇家坟墓祈祷、宣誓名单以及最后的加冕或皇家集结。当瓦维尔将神圣的王权、贵族出席和军事秩序联系起来时，合法性和土地士气就会提高。
    listeners:
    - monthly
    - ruler_death
    - pre_winning_war
    historical_flavor: >-
      瓦维尔加冕和龙山集会属于瓦维尔，因为克拉科夫上方的山将城堡、大教堂、皇家陵墓、防御墙、维斯瓦河通道、宫廷游行和国家王权连接在一个坚固的皇家景观中。参与者是统治者或公认的继承人、主教和大教堂神职人员、王室官员、贵族、卫兵、传令官、金库管理员、坟墓管理员、驻军队长、炮兵或弓弩军官（如果适用）、抄写员、特使和城市代表。这些地方包括大教堂、皇家公寓、金库、墓室教堂、城堡大门、城墙、集合庭院、维斯瓦河通道和上山的仪式路线。这些物品包括王冠和宝剑、誓言簿、贵族出勤名册、横幅、守卫钥匙、武器架、墓烛、皇家印章、游行布、驻军花名册和战争集结信。
      monthly_legitimacy之所以被保留，是因为这把尺子被反复放置在加冕记忆和贵族认可中。 land_morale_modifier之所以被保留，是因为士兵和贵族们看到皇家权威受到真正的堡垒的保护，而不仅仅是王座。
    confirmation_logic: >-
      赞助商必须拥有或控制克拉科夫，最后的瓦维尔城堡奇迹建筑必须存在，国家不能破产，城堡、大教堂、金库和山路不能被占领，处于敌对围困或严重动乱中。该国家必须有公认的统治者或摄政；如果继承正在进行，最终完成应等待加冕认可。如果可以的话，检查应考虑每月的合法性、土地士气、贵族满意度、神职人员满意度、驻军规模、堡垒条件、金库/王权安全、稳定性、继承危机、战争状态和当地破坏。如果瓦维尔安全，战争可以继续，但围困、王权损失、贵族抵制或宫廷逃亡应该会阻止开始。
    start_logic: >-
      开始效果记录赞助国、作为仪式地点的克拉科夫、最终的城堡建筑、统治者/摄政背景、贵族和神职人员背景以及活跃的瓦维尔季节。它快照了国家基线：每月合法性、土地士气、合法性、稳定性、贵族满意度、神职人员满意度、人力或驻军能力、国库/收入、战争状态、继承风险和军队信心（如果有）。它快照了当地的基线：占领、围困、动乱、破坏、繁荣、城堡状况、大教堂状况、王权安全、坟墓安全、大门状况、城墙状况、驻军工资、军械库存、维斯瓦河接近安全和贵族通道。它会初始化王权库存、大教堂日历、守墓、贵族召唤、宣誓、守卫钥匙审计、城墙检查、大门值班、军械库审查、驻军演习、旗帜祝福、城市出席、加冕/继任者认可和最终山丘集合等计数器。临时负担包括宫廷旅行、蜡烛、神职人员津贴、警卫工资、军械库维修、宴会费用、传令官、抄写员和贵族住宿。
    progress_logic: >-
      瓦维尔每月的进步证明了王室记忆可以指挥人们。库房管理员检查王冠、剑、印章和王权布料。大教堂神职人员为前任统治者准备弥撒和守墓活动。使者向贵族和城市代表发出传票；抄写员更新宣誓名册和优先名单。门卫检查钥匙和手表；城墙军官检查塔楼、火药或弩库，维斯瓦河逼近。驻军队长在院子里训练守卫；军械库管理员清点武器；横幅已修复并加持。当克拉科夫安全、王权安全、贵族出席、神职人员合作、警卫得到报酬、骚乱可控时，进步就会取得进展。它因破产、占领、围攻、严重动乱、失去王权、大教堂纠纷、贵族抵制、无薪驻军、大门暴力、盗墓或继承争议而暂停。它以高度的合法性、忠诚的贵族、强大的神职人员支持、有薪驻军、良好的堡垒条件和活跃的王室而加速。
      ruler_death 听众将仪式变成了加冕礼：继任者认可、王权转移和贵族誓言计数器成为强制性的。 pre_winning_war只有当瓦维尔的集结、旗帜或贵族征兵合理地支持一场接近成功的战役时，pre_winning_war听众才应该添加进度。
    completion_logic: >-
      完成需要王权、大教堂、坟墓、贵族召唤、誓言、守卫钥匙、墙、大门、军械库、演习、旗帜、城市出勤、继任者/加冕和最终集结计数器才能完成。克拉科夫必须保持控制，最后的城堡建筑必须存在，国家不能破产，统治者或摄政当局必须得到承认。最后的场景从大教堂转移到城堡庭院。神职人员在皇家陵墓前祈祷，王权在警卫之下展示，贵族宣誓或更新誓言，城市代表见证皇家印章，驻军队长展示钥匙和武器卷，旗帜在墙上升起，统治者或继任者接受鼓掌。这一奇迹变成了国家能力，因为瓦维尔将王朝记忆转化为每月的合法性，并将堡垒出席率转化为陆地士气。
    failure_or_timeout_logic: >-
      仪式可以暂停，但如果召唤失效、守卫轮换或王权库存变得陈旧，进度就会衰退。如果赞助商失去了克拉科夫，最后的城堡建筑消失，国家仍然破产，瓦维尔被占领，王权被夺取，或者大教堂/皇家陵墓被亵渎，那么它就会失败或取消。严重的骚乱、贵族叛乱、神职人员拒绝、无薪驻军、城门被攻破、围攻、继承危机或宣誓失败都会暂停进度，并可能重置王权、誓言、守卫或最终集结计数器。如果继承问题未解决，pre_winning_war
      绝不应取代加冕要求。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对克拉科夫的控制、最终独特的城堡建筑存在、无破产、无重复的活动仪式、无占领或敌对围攻、可控的骚乱、公认的统治者/摄政、安全的王权和坟墓、可用的大教堂和城堡大门、付费驻军以及可访问的贵族路线。添加对合法性、土地士气、贵族/神职人员满意度、驻军规模、堡垒条件、继承危机、战争状态和破坏的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和克拉科夫，存储统治者/摄政，贵族，神职人员和战争背景，应用临时宫廷驻军负担，初始化王权库存计数器，大教堂日历，守墓，贵族传票，宣誓，守卫钥匙审计，墙壁检查，大门值班，军械库审查，驻军演习，旗帜祝福，城市出勤，加冕/继任者认可和最终集合，并记录国家/当地
      snapshot_effect_script: >-
        刷新每月合法性、土地士气、合法性、稳定性、贵族和神职人员满意度、人力/驻军能力、财政、战争状态、继承风险、军队信心、克拉科夫占领、围困、动乱、破坏、繁荣、城堡状况、大教堂状况、王室安全、坟墓安全、大门、城墙、驻军工资、军械库存、维斯瓦河安全、贵族
      progress_effect_script: >-
        每月进行一次，提前进行王权检查、大教堂服务、守墓、贵族传票、宣誓、守卫钥匙、墙壁和大门检查、军械库清点、演习、横幅祝福、城市出席和最终集合准备。由于破产、占领、围攻、动乱、王权损失、神职人员纠纷、贵族抵制、无薪驻军、大门暴力、盗墓或继承危机而暂停或衰退。在ruler_death上，需要加冕和继任者宣誓计数器；在pre_winning_war上，仅在瓦维尔的集结相关时添加战役验证。
      completion_trigger_script: >-
        需要完成瓦维尔计数器或总进度，克拉科夫控制，存在最终城堡，没有破产，没有占领或不安全的围攻，可控的骚乱，安全的王权，完成的大教堂/坟墓仪式，高贵的誓言，付费驻军，检查的墙壁/大门，公认的统治者或继任者以及最终的山地集结准备就绪。
      completion_effect_script: >-
        移除临时宫廷驻军负担，应用永久国家修正，保留每月合法性和土地士气，授予一次性合法性、稳定性、高贵满意度、军队士气、人力或王朝记忆奖励，添加瓦维尔加冕地点记忆，清除瞬态计数器，并保留完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留monthly_legitimacy和land_morale_modifier。合法性来自于加冕礼、守墓仪式、贵族誓言和大教堂的认可；士气来自于看到皇家权威锚定在守卫森严的山间堡垒中，旗帜聚集。
      one_time_reward: >-
        授予一次性的合法性、稳定性、贵族满意度、神职人员满意度、土地士气、人力或威望。如果发生ruler_death，则根据加冕的连续性调整奖励；如果pre_winning_war做出了贡献，则仅进行次要士气奖励。
      local_building_reward: >-
        克拉科夫应该记住王权库存、誓言卷、大教堂日历、守墓活动、守卫钥匙簿、城墙检查、军械库审查、横幅祝福、城市出席名单和加冕记录。稍后的实施可以将其表达为当地驻军的可靠性、贵族忠诚或继承稳定性。
    notes: >-
      源仪式是即时的，但定时模式适合王权准备、贵族出席和驻军检阅。保留ruler_death是因为瓦维尔最重要的功能是加冕连续性； pre_winning_war 仅可用于验证竞选活动的士气。保持合法性和土地士气的永久奖励，而不是一般的堡垒防御。
- id: 180
  key: unique_zamosc_ideal_city
  base_key: city_expansion_project
  location: krasnystaw
  source_ritual_key: zamosc_ideal_city_rite
  status: designed
  ritual_design_zh:
    title: 理想城市网格与学院章程
    mode: timed
    duration: >-
      定时模式应涵盖一个规划和建设季节。每月十二个刻度代表测量网格、在街道上放桩、准备排水系统和地基、标记中央市场、分配拱廊商人房屋、起草学院章程、铺设堡垒角度以及核对材料账户。通过将理想城市设计为可重复的实践，可以降低建筑成本并提高声望。
    listeners:
    - monthly
    historical_flavor: >-
      理想城市网格属于扎莫斯克，因为波兰立陶宛联邦文艺复兴时期规划的城市加入了贵族赞助、人文主义城市理论、商人特权、军事几何学和教育。参与者包括创始人的专员、测量员、建筑师、泥瓦匠、木匠、堡垒工程师、学院大师、行会长老、商人、公证人、城镇法官、工头、守卫和接收土地的定居者。这些地方是网格街道线、中央集市广场、拱廊商人房屋、学院遗址、市政厅地块、堡垒墙痕迹、大门、排水沟、材料场和包租室。这些物品包括测量绳、木桩、平面图、基石、砖模、木材账户、石灰坑、行会图册、学院章程、市场摊位许可证、堡垒图和公民章程。
      global_build_buildings_efficiency 之所以下降，是因为该市在建设浪费资金之前对地块、材料、地基和街道几何形状进行了标准化。 monthly_prestige之所以崛起，是因为使节、贵族、学者和商人将理性的城市建设视为有序统治的公共论据。
    confirmation_logic: >-
      赞助者必须拥有或控制克拉斯尼斯托夫，最终的扎莫斯克理想城市奇迹建筑必须存在，国家不能破产，规划的工程、道路和市场场地不能被占领、遭到敌对围困或严重动乱。国家必须有测量员、泥瓦匠、材料和公民权力来分配地块和执行网格。如果可用，确认应检查建筑成本降低、每月声望、当地繁荣、市民满意度、建筑能力、材料供应、腐败、破坏、道路通行、学院/学者能力和防御条件。只有当战争关闭工地或阻止劳动力和材料到达时，战争才会封锁。
    start_logic: >-
      开始效果记录了赞助国、作为仪式地点的克拉斯尼斯塔夫、最终规划的城市建筑、创始人/公民背景（如果有）以及活跃的网格宪章周期。它快照了国家基线：全球建筑成本修正、每月声望、声望、财政/收入、建筑能力、市民满意度、稳定性、腐败、学者或学院能力、战争状态和材料可用性。它快照了当地的基线：占领、围攻、动乱、破坏、繁荣、地形适宜性、道路通行、市场场地状况、排水状况、材料堆场库存、劳动力可用性、工程师可用性、行会合作、地块纠纷和墙迹安全。它初始化城市调查、街道桩、排水规划、地基标准、市场面积测量、拱廊房地块、行会地块书、学院章程、市政厅章程、堡垒几何形状、大门对齐、材料分类帐、劳工名册和最终公民公告的计数器。临时负担包括勘察费、材料、石灰、砖块、木材、警卫、公证人、工程师、学院院长以及搬迁或调整地块的补偿。
    progress_logic: >-
      每月的进展是一座城市在变得拥挤之前变得清晰可见。测量员拉紧绳索并标记街道轴线；工程师测试排水和土壤；泥瓦匠设定了标准的地基深度，这样房屋就不会成为不规则的危险。委员们测量集市广场，分配带有拱廊的商铺地块，并为市政厅、学院、教堂或礼拜堂以及行会摊位预留空间。堡垒工程师布置了角度和大门，以便防御适合网格，而不是稍后突破它。公证人复制情节书籍、行会特权、摊位许可证和学院章程。工头将材料账目与实际的砖块、木材和石灰进行比较。当工地安全、财政向工人支付工资、材料到达、地块纠纷得到解决、骚乱得到控制时，进展就会取得进展。它因破产、占领、围困、严重动乱、材料短缺、测量员纠纷、腐败的地块销售、劳动力外逃、排水系统故障、火灾、道路封闭或战争破坏而暂停。它以强大的建设能力、低腐败、合作行会、繁荣的定居者、良好的道路、可用的工程师和学院的赞助来加速。
    completion_logic: >-
      完成需要完成调查、街道、排水、地基、市场、拱廊、行会、学院、市政厅、堡垒、大门、材料、劳动力和最终公告柜台。克拉斯尼斯托夫必须保持控制，最终的建筑必须存在，国家不能破产，工地必须有序。最后的场景发生在测量的市场广场上。测量员展示计划；公证人阅读行会情节书籍和学院章程；泥瓦匠提供标准地基；工程师标记堡垒线和大门；商人收到街机地块；民事法官宣布建筑规则和材料措施。这个奇迹变成了国家能力，因为扎莫斯克将城市声望变成了一种方法：首先规划，测量土地，标准化材料，教育官员，然后以可见的秩序建造更便宜的建筑。
    failure_or_timeout_logic: >-
      仪式可以暂停，但如果桩子腐烂，情节书籍有争议，或者材料在建造前损坏，进步就会衰退。如果赞助商失去了克拉斯尼斯塔夫、最终的规划城市建筑消失、国家仍然破产、工地被占领或摧毁，或者市政当局无法执行网格，那么它就会失败或取消。严重骚乱、地块欺诈、劳工起义、材料失窃、排水系统塌陷、无记录的工程师死亡、火灾、围攻或道路封闭应暂停进度，并可能重置调查、地块或材料计数器。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对克拉斯尼斯托夫的控制、最终独特的规划城市建筑存在、无破产、无重复的活动仪式、无占领或敌对围困、可控制的骚乱、可用的工地、可用的测量员/工程师/泥瓦匠、材料和道路访问权和公民对地块的权威。添加对建筑成本、声望、繁荣、市民满意度、建设能力、腐败、破坏、学院能力和战争破坏的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和Krasnystaw、商店创始人/公民背景、应用临时规划和建设负担、初始化城市调查计数器、街道桩、排水计划、基础标准、集市广场、拱廊房地块、行会情节书、学院章程、市政厅章程、堡垒几何形状、大门对齐、材料分类账、劳动力名册和最终公告，以及记录国家/当地基线。
      snapshot_effect_script: >-
        刷新建筑成本修正、每月声望、声望、金库、建筑能力、市民满意度、稳定性、腐败、学者/学院能力、战争状态、材料可用性、红土城占领、围困、动乱、破坏、繁荣、地形适宜性、道路通道、市场站点、排水、材料场、劳动力可用性、工程师、行会合作、地块纠纷、墙迹安全和最终建筑存在。
      progress_effect_script: >-
        每月记号、预先测量线、街道桩、排水系统、地基、市场测量、拱廊地块、行会书籍、学院章程、市政厅章程、堡垒和大门的几何形状、材料分类账、劳工名册和最终公告准备情况。由于破产、占领、围困、严重动乱、材料短缺、调查纠纷、腐败的地块销售、劳动力外逃、排水系统故障、火灾、道路封闭或战争破坏而暂停或衰退。加速建设能力、低腐败、行会合作、道路、工程师和学院赞助。
      completion_trigger_script: >-
        要求完成城市规划柜台或总体进度，红土城控制，最终建筑存在，没有破产，没有占领或不安全的围困，可控的骚乱，接受的调查，开放的道路，标准的基础，测量的市场，分配的行会地块，学院章程，堡垒/大门计划，清洁材料分类账和最终公民公告准备就绪。
      completion_effect_script: >-
        消除临时规划负担，应用永久国家修正，保留降低的建筑成本和每月声望，授予一次性建设进度，当地繁荣，市民满意度，学院支持或声望奖励，添加扎莫斯克理想城市记忆，清除瞬态计数器，并保留完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留global_build_buildings_efficiency和monthly_prestige。建筑成本通过标准化地块、地基、材料和规划的街道来降低；声望上升是因为这座城市展现了理性的文艺复兴秩序、学院生活、市场特权和坚固的现代性。
      one_time_reward: 授予一次性建设进度、国库储蓄、地方繁荣、市民满意度、学院/学者支持或声望。通过干净的情节簿和材料分类帐来衡量奖励。
      local_building_reward: >-
        Krasnystaw应该记住测量桩、街道网格、排水计划、地基标准、市场测量、街机情节簿、学院章程、市政厅章程、堡垒图、大门线、材料分类帐和劳动花名册。稍后的实施可以将其表达为当地发展、更便宜的建筑或城市凝聚力。
    notes: >-
      源仪式是直接的，但定时模式适合规划和建筑季节。每月一次就足够了，因为该过程是勘察、施工和包租工作。保留对降低建筑成本和声望的永久奖励；地方繁荣和管理正在支持成果。
- id: 181
  key: unique_gdansk_port
  base_key: great_port
  location: gdansk
  source_ritual_key: gdansk_port_rite
  status: designed
  ritual_design_zh:
    title: 维斯瓦河谷物起重机博览会
    mode: timed
    duration: >-
      定时模式应涵盖一个波罗的海出口季节。每月十二个刻度代表开放维斯瓦河谷物路线、检查莫特拉瓦码头、测试木制起重机、密封粮仓、校准行会秤、分配港口领航员、确认公平特权以及派遣波罗的海船只。由于河流粮食和海上出口已成为一个值得信赖的港口惯例，因此贸易收入和贸易范围得到改善。
    listeners:
    - monthly
    historical_flavor: >-
      维斯瓦河谷物起重机博览会属于格但斯克，因为该港口的动力来自于将内河生产与波罗的海和北海的交换结合起来。来自维斯瓦河、莫特拉瓦码头的谷物驳船、高大的粮仓、木制起重机、汉萨商人、琥珀和木材经销商、港口引航员、行会称重员和城市特权使这座城市成为出口引擎。参与者包括市民法官、粮食加工厂、驳船船长、波罗的海船长、起重机船员、行会称重员、粮仓管理员、海关职员、琥珀和木材经纪人、飞行员、车队组织者、警卫和外国商人。这些地方包括河码头、粮仓行、起重机房、行会大厅、海关亭、引航站、集市、仓库巷、船舶锚地以及维斯瓦河公路和河流引道。这些物品包括谷物袋、湿度探测器、行会秤、称重石、起重机绳索、粮仓钥匙、海关封条、车队名单、船舶清单、琥珀地块、木材标记、通行费收据和公平特权宪章。
      trade_income 被保留，因为谷物、琥珀、木材、关税和仓储费变得可靠。 trade_range之所以被保留，是因为飞行员、船长和商人特权将港口连接到更广泛的波罗的海航线。
    confirmation_logic: >-
      赞助商必须拥有或控制格但斯克，最后的格但斯克港口奇迹建筑必须存在，国家不能破产，港口、河码头、粮仓和入海口不得被占领、封锁或严重动乱。维斯瓦河谷物航线必须对驳船足够开放，波罗的海航线必须对船舶足够安全。如果有的话，确认应检查贸易收入、贸易范围、市民满意度、港口准入、封锁、河流准入、粮食供应、海军或车队安全、商人信任、当地繁荣、腐败和战争状态。战争只有在关闭季节内的河流或海上通道时才会封锁。
    start_logic: >-
      开始效果记录了赞助国、作为仪式地点的格但斯克、最终的港口建设、活跃的粮食出口季节以及维斯瓦河-波罗的海贸易背景。它快照国家基线：trade_income、trade_range、国库/收入、市民或商人满意度、海军或车队安全、外交/贸易关系、腐败、战争状态以及食品/谷物供应（如果有）。它快照了当地的基线：占领、封锁、动乱、破坏、繁荣、港口通道、河流通道、粮仓容量、起重机状况、行会秤精度、海关职能、飞行员可用性、仓库安全、船舶交通、车队准备情况和公平特权稳定性。它初始化维斯瓦河驳船登记、谷物检查、水分检查、粮仓密封、起重机检查、秤校准、海关收据、引航员名册、船舶舱单、琥珀/木材批次登记、公平特权公告、车队通知、争议听证会和最终谷物起重机公平的柜台。临时负担包括起重机维修、仓库警卫、文员、飞行员、秤官员、公平警务、车队规划以及检查期间延迟的存储释放。
    progress_logic: >-
      每月的进步是江海学习同一本账本。驳船船长登记维斯瓦河抵达情况；谷物因素测试水分和品质；粮仓管理员分配储藏室并密封门。起重机工作人员在将麻袋吊装到船上之前检查绳索、横梁、吊钩和装载平台。行会秤校准秤；海关职员开具通行费和出口收据；琥珀和木材经纪人将批次标记为单独出售。港口引航员安排船舶通过航道的活动；护航组织者比较有关私掠船、风暴和海冰的报告；展会官员公布摊位规则并解决有关重量、变质谷物、仓储费和交货延误的争议。当河道畅通、港口不被封锁、起重机和粮仓发挥作用、商人信任秤、船舶可用时，进步就会前进。因破产、占领、封锁、严重骚乱、河流关闭、粮食短缺、粮仓火灾、起重机故障、砝码损坏、飞行员短缺、车队危险、商人抵制或海关欺诈而暂停。它随着强劲的粮食供应、市民满意度、安全的波罗的海航线、干净的账目、当地繁荣、良好的河流通道和活跃的外国需求而加速。
    completion_logic: >-
      完成需要驳船、粮食、湿气、粮仓、起重机、秤、海关、领航员、船舶、琥珀/木材、公平特权、护航、争端和最终公平柜台完成。格但斯克必须保持控制，最后的港口建筑必须存在，国家不能破产，河流和海路都不能被封锁。最后一幕发生在谷物博览会期间的莫特拉瓦码头。地方法官宣布公平的特权，行会称重员展示秤，起重机工作人员吊起密封的麻袋，粮仓管理员出示钥匙，飞行员向船长提交出发单，海关职员密封舱单，商人签订谷物、琥珀和木材合同。这一奇迹变成了国家能力，因为格但斯克通过有规律的储存、装载、引航和商业法将内陆收成转变为波罗的海范围。
    failure_or_timeout_logic: >-
      这种仪式可以在出口季节之间暂停，但如果谷物储存时间过长、起重机检查到期或公平特权没有更新，进展就会减弱。如果赞助商失去格但斯克、最后的港口建筑消失、国家仍然破产、港口被占领或烧毁、出海通道在整个季节被封锁，或者维斯瓦河航线被永久切断，那么比赛就会失败或取消。严重骚乱、粮仓火灾、起重机倒塌、变质谷物、伪造砝码、私掠者控制、海关腐败、商人抵制或河流洪水应暂停进度，并可能重置存储、秤、车队或舱单计数器。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对格但斯克的控制、最终独特的港口建筑存在、无破产、无重复的活动仪式、无占领、封锁、严重骚乱或港口火灾、可用的河流和海洋通道、可用的粮食供应、功能粮仓/起重机/秤/海关、飞行员和商人。添加贸易收入、贸易范围、市民满意度、车队安全、腐败、繁荣、战争状态和河流破坏的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和格但斯克，存储维斯瓦河-波罗的海贸易背景，应用临时公平和港口检查负担，初始化驳船登记柜台，粮食检查，水分检查，粮仓密封，起重机检查，秤校准，海关收据，引航员名册，船舶清单，琥珀/木材批次登记，公平特权公告、车队通知、争议听证会、最终公平和记录基线。
      snapshot_effect_script: >-
        刷新贸易收入、贸易范围、国库、商人/市民满意度、海军或车队安全、贸易关系、腐败、战争状态、粮食供应、格但斯克占领、封锁、动乱、破坏、繁荣、港口通道、河流通道、粮仓容量、起重机状况、秤精度、海关功能、飞行员可用性、仓库安全、船舶交通、车队准备情况、公平特权和最终建筑存在。
      progress_effect_script: >-
        每月刻度、提前驳船到达、谷物质量和湿度检查、粮仓密封、起重机维修、秤校准、海关收据、飞行员时间表、船舶舱单、琥珀和木材批次、公平公告、车队通知和争议听证会。因破产、占领、封锁、动乱、河流封闭、粮食短缺、粮仓火灾、起重机故障、伪造重物、飞行员短缺、车队危险、抵制或海关欺诈而暂停或衰退。加速供应、商人信任、安全的波罗的海航线和干净的账户。
      completion_trigger_script: >-
        要求完成粮食交易会柜台或总体进度，格但斯克控制，最终港口存在，无破产，无封锁，开放的河道，检查起重机，密封粮仓，校准秤，海关收据，分配飞行员，清单准备好，公平特权确认，并解决争端。
      completion_effect_script: >-
        消除临时港口交易会负担，申请永久国家修改器保留贸易收入和贸易范围，授予一次性国库，商人满意度，当地繁荣，车队安全或贸易力量奖励，添加格但斯克谷物起重机记忆，清除瞬态计数器，并保留完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留trade_income和trade_range。收入来自谷物、琥珀、木材、海关、仓储和公平合同；范围来自维斯瓦河通道、波罗的海飞行员、船长、车队规划和商人特权。
      one_time_reward: 授予一次性国库/贸易收入、商人或市民满意度、当地繁荣、车队安全或减少海关腐败。通过干净的秤和成功的船舶调度来获得秤奖励。
      local_building_reward: >-
        格但斯克应该记住驳船登记册、谷物湿度记录、粮仓封条、起重机检查、行会秤记录、海关收据、飞行员名册、舱单、琥珀和木材地段标记、公平特权、车队通知和争议分类账。稍后的实施可以将其表达为当地港口繁荣、贸易范围或粮食出口弹性。
    notes: >-
      来源仪式是即时的，但定时模式适合波罗的海出口季节。 Monthly 是正确的监听器，因为粮食流动、储存和船舶调度会重复发生。保留贸易收入和贸易范围的永久奖励；商人的影响力是一个支持性的结果。
- id: 182
  key: unique_malbork_castle
  base_key: knightly_fortress_order
  location: malbork
  source_ritual_key: malbork_castle_rite
  status: designed
  ritual_design_zh:
    title: 砖块堡垒的章节集合
    mode: timed
    duration: >-
      定时模式应涵盖一年的战役，最好是每月十二个刻度。这个跨度代表了十字军要塞修道院内部的真实循环：冬季粮仓和军械库的库存，教堂的四旬斋和节日纪律，春季检查诺加特河上的马匹和河流运输，夏季野外演习，秋季会计，以及兄弟、军士和附属定居者被分配义务的最后一章。消息来源是直接的，但马尔堡并不是一场宫廷庆典；而是一场宫廷庆典。它的力量来自于反复的审核、宣誓、储备和集结，使士气和人力变得可靠。
    listeners:
    - monthly
    - pre_winning_war
    - ending_war
    historical_flavor: >-
      砖块堡垒的战团集结属于马尔堡，因为这座城堡不仅仅是一个防御外壳。它是普鲁士条顿骑士团的高级行政和惯例机构，在这里，兄弟会将誓言、土地收入、河流供应、马匹服务、军械库会计和礼仪纪律转化为军事准备。参加者包括大团长或他的副官、身穿白斗篷的骑士兄弟、城堡教堂的牧师和牧师、军士、弩手、军械师、骑兵元帅、粮仓管理员、诺加特河上的领航员、财政部的抄写员、郡县代表、提供马车和啤酒的城镇居民以及服役的普鲁士或德国定居者。这些地方包括高堡教堂、修道院餐厅、礼拜堂、桥门、军械库、马厩、粮仓、外堡、河岸以及砖墙外的集结场。这些物品包括密封的服务卷、商店的蜡板、白色斗篷、祝福的旗帜、马具、十字弓、争吵、邮件、粮食量、马匹清单、河驳船和大门钥匙。它的象征意义是制度性的：赞助商证明了红砖堡垒仍然可以约束身体和资源，而不仅仅是给游客留下深刻的印象。士兵们看到了植根于誓言、教堂和堡垒惯例的指挥链，因此陆军士气高涨；人力增加是因为郡县、庄园、城镇和河流供应商都被统计在内，并对共同集结负责。
    confirmation_logic: >-
      赞助者必须拥有或控制马尔堡，最终的马尔堡城堡奇迹建筑必须存在，国家不能破产，城堡区域不能被占领、围攻、烧毁或与诺加特河路线切断。确认应该需要一个可用的军事管理机构：一个公认的统治者或秩序权威，足够的国库来养活修道院和支付警卫费用，当地的驻军或征兵框架，马尔堡或维斯瓦河下游没有严重的地方骚乱。如果可以遏制阶层、神职人员、贵族、市民或军事秩序的影响，他们就不应该公开反抗。战争是允许的，因为仪式具有军事目的，但直接威胁马尔堡、阻碍河流供应或消耗国库的战争应该阻止开始。该地点应有粮食、马匹、铠甲、使者的路线安全；如果港口、河流或道路网络被封锁，集结人员就无法诚实地计算可用的人力。
    start_logic: >-
      起始效果记录了发起国、作为仪式地点的马尔堡、最终的要塞建筑、当前的统治者或上级以及当前的战争状态。它概述了土地士气、人力库、人力恢复或征兵能力（如果有）、军队专业精神或纪律代理、威望、合法性、稳定性、财政、收入、债务、厌战和相关遗产支持的国家基线。它记录了当地驻军兵力、占领状况、围困风险、破坏、动乱、繁荣、当地供应、河流通道、堡垒状况、粮仓容量、军械库准备情况、马匹可用性和郡道安全等方面的基线。它初始化用于章节召唤、修道院宣誓更新、教堂祝福、军械库审计、粮仓库存、马厩检查、河流运输名册、指挥官征兵卷、军士演习、弩和火炮商店、城镇服务合同和最终旗帜集合的计数器。临时负担应代表食物、烛蜡、武器修理、信使费用、马饲料、警卫工资、河道引航员以及定居者响应集合时失去的劳动力。
    progress_logic: >-
      每月进度代表要塞修道院的特定部分正在准备就绪。在最初的时间里，抄写员向附属郡县和城镇发送章节召唤，将旧的服务名册与实际家庭进行比较，并标记哪些兄弟、军士、马匹、马车和水手可以出现。牧师准备教堂办公室，忏悔兄弟，并设定旗帜和剑被祝福的日子。粮仓管理员根据记录的人和马的数量来衡量黑麦、燕麦、咸肉、啤酒和饲料。军械师检查邮件、板甲、头盔、十字弓、弓弦、火药或火炮仓库（如果适用）以及大门装置。马术官检查重新安装的坐骑、马鞍、鞋子和马厩。河道领航员和马车师傅正在演练补给品如何从诺加特登陆点运至外贝雷。当城堡被控制、维护费得到支付、骚乱程度较低、河流和道路保持畅通、驻军可以进行演习时，进度就会前进。它因该地区的破产、占领、围困、严重动乱、瘟疫或饥荒、无薪驻军、庄园叛乱、河流登陆受阻或军械库受损而暂停。如果人力储备高，军队最近赢得了防御威望，贵族或军事庄园合作，当地繁荣供应谷物和马匹，并且国家处于战争状态而不危及马尔堡，那么它会加速。仅当使用马尔堡集结的人员、物资或指挥链的军队即将赢得相关战争时，pre_winning_war侦听器才应添加进度，这表明章节纪律不是仪式性的。
      ending_war监听者应该审核结果：胜利可以确认横幅和幸存的卷轴；失败、精疲力竭或严重占领应该暂停并在完成之前强制征兵。
    completion_logic: >-
      完成要求章节、誓言、教堂、军械库、粮仓、马厩、河流、征兵、演习、城镇服务和最终集合计数器完成或高于阈值。马尔堡仍然必须受到控制，最终的建筑必须存在，国家不能破产，河流登陆必须开放，当地地区必须足够安全，以便军队和供应商聚集。最后一幕以高堡教堂的钟声开始。团长或赞助人的中尉会听到在分会室宣读服役名册；兄弟们将手放在规则书或祭坛上；军械师展示修复后的马具；粮仓管理员出示测量过的钥匙和密封的计数；河流引航员发誓让驳船保持准备状态；镇民和庄园官员确认马车和饲料；然后，旗帜穿过大门到达外贝利，在那里，骑士、中​​士、弩手和征召队长逐一应答。公告将这些义务变成了长期义务。通过将马尔堡的砖砌大厅转变为可重复的士气、招募、补给和战场信心系统，这一奇迹将成为国家能力。
    failure_or_timeout_logic: >-
      该仪式不应该有严格的固定超时，但如果集结季节反复中断，计数器应该衰减。如果赞助商失去马尔堡，最后的堡垒消失，国家持续破产，城堡被占领或直接围困，或者诺加特路线被封锁，库存变成虚构，那么它就会取消。严重的地方骚乱、庄园叛乱、无薪驻军、饥荒、瘟疫、军械库受损、粮仓被烧毁，或者没有留下任何公认的军事权威的继承危机，都应该暂停进展，并可能重置誓言、征兵和服役计数器。以失败告终的战争不应自动使仪式失败，但如果它耗尽了人力，摧毁了维斯瓦河下游，或损害了指挥链，则必须在授予奖励之前使用替换卷重复最后的集结。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对马尔堡的所有权或控制权，最终独特的马尔堡建筑存在，没有破产，没有占领或主动围攻，开放诺加特或同等补给路线，可管理的当地动乱和破坏，公认的统治者或秩序权威，可用的金库，并且没有活跃的重复仪式。添加对驻军或征兵框架、路线安全、庄园或军事命令合作以及要塞周围没有直接封锁或叛乱的专题检查。
      start_effect_script: >-
        将仪式与赞助商和马尔堡绑定，存储统治者/秩序权威和战争背景，初始化章节、誓言、教堂、军械库、粮仓、马厩、河流、征兵、演习、城镇服务和最终集结柜台，应用临时维护负担，并存储国家
      snapshot_effect_script: >-
        刷新土地士气、人力池、人力恢复或征兵能力、军队纪律代理、声望、合法性、稳定性、财政、债务、厌战、地产支持、当地驻军、占领、围攻、破坏、动乱、繁荣、补给、河流通道、要塞条件、粮仓容量、军械库准备情况、马匹可用性和路线安全，同时保持开局基线。
      progress_effect_script: >-
        每月记事、提前传票、宣誓、教堂祝福、军械库审计、粮仓库存、马厩检查、河流名册、征兵卷、军士演习、商店和城镇合同。由于破产、占领、围困、动乱、封锁、庄园叛乱、无薪驻军、饥荒、商店受损或没有公认的权威而暂停或衰退。加速实现强大的人力、合作地产、繁荣、良好的财政和有用的战时需求。在pre_winning_war和ending_war上，仅当马尔堡集结的人力和商店合理支持该战役时添加或验证进度。
      completion_trigger_script: >-
        要求总进度或核心计数器完成，马尔堡控制，最终建筑存在，没有破产，没有占领或围攻，开放的河流或道路供应，可用的军械库和粮仓，可控制的骚乱，可用的驻军或征兵，付费维护，以及
      completion_effect_script: >-
        消除临时集结负担，应用永久国家修正，保护土地士气和全球人力，授予一次性人力、军队传统或声望、当地补给或驻军战备奖励，添加马尔堡章节集结地点记忆，清除瞬态计数器，并设置持久完成或冷却标记。
    intended_rewards:
      permanent_country_modifier: >-
        保留并强调来源land_morale_modifier和global_manpower_modifier。从历史上看，这些并不是来自抽象的荣耀，而是来自马尔堡的命令纪律：人员被计算在内，物资是可见的，旗帜受到祝福，指挥官知道他们应该提供什么服务。
      one_time_reward: >-
        授予一次性人力储备，军队传统，威望，驻军增援，补给恢复，或通过成功集结减少当地骚乱。如果战争听众做出了贡献，则将一部分用于在竞选服务后恢复人力或士气，而不是金钱。
      local_building_reward: >-
        马尔堡应该保留对章节卷、粮仓印章、修复的军械库、马厩名册、河流驳船、宣誓日和穿过高堡大门的旗帜的记忆。稍后的实施可以将其表达为当地要塞防御、供应限制、更快的驻军恢复或在要塞保持供应的情况下减少骚乱。
    notes: >-
      源仪式是即时的，但需要定时模式来模拟要塞修道院的审核和集合周期。每月是核心侦听器，因为库存、钻探和供应是经常性的劳动。 pre_winning_war和ending_war仅用于在真实战役中证明或协调军事系统；它们不应该成为无关战争的自由进步。奖励必须以士气和人力为中心，并以要塞声望作为支撑。
