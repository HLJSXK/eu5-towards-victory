unique_wonders:
- id: 101
  key: unique_pharos_lighthouse
  base_key: great_lighthouse
  location: alexandria
  source_ritual_key: harbor_lighting
  status: designed
  ritual_design_zh:
    title: 港口照明和引航誓言
    historical_flavor: >-
      灯塔被视为一个活生生的港口机构，而不是一个单一的仪式篝火。该仪式聚集了亚历山大的皇家工程师、镜面抛光工、消防员、飞行员、海关抄写员和海军军官。在整个航行的一年中，他们校准夜间信标，排练港口信号，向王室宣誓飞行员，并将塔转变为国家支持的导航、检疫、海关控制和海上威望系统。
    mode: timed
    duration: 最终奇迹建筑落成后每月进行 12 次检查。
    listeners:
    - monthly
    confirmation_logic: >-
      国家必须拥有并控制亚历山大，灯塔最终建筑必须存在，国家不得成为破产了，亚历山大必须作为一个可用的沿海港口发挥作用。如果可用的触发器可以测试占领、封锁、破坏或港口访问，这些检查应显示为单独的确认线，以便玩家了解该塔需要稳定的港口当局。
    start_logic: >-
      在仪式开始时，记录赞助国、亚历山大作为仪式地点，以及当前的海上基线：海军范围、贸易范围、当地港口活动、水手或造船能力，以及该国家是否控制附近的地中海或红海航线。施加轻微的临时负担，包括灯油、铜镜维护、飞行员津贴、信号旗和港口守夜的费用。
    progress_logic: >-
      每个月脉冲代表一个周期的守夜、镜子校准、飞行员考试和港口信号演习。进展正常进行，而亚历山大仍然由赞助商拥有和控制，该国仍然有偿付能力，而且港口也没有瘫痪。强大的海上条件可能会带来一些额外的进步：活跃的造船厂、规模庞大的海军、亚历山大的贸易力量或对重要海上航线的控制。战争不应该自动使仪式失败；如果港口被封锁、被占领，或者国家陷入严重混乱，进度就会暂停，负担仍然存在。
    completion_logic: >-
      当记录了 12 次成功的每月检查时，完成火灾。最后一个月将举行黎明和黄昏的公共照明活动：抛光的镜子在白天捕捉阳光，在夜间点燃火光，港口引航员重复宣誓，灯塔被宣布为国家海上的官方眼睛。该国获得永久的灯塔仪式福利和一次性航海声望奖励。
    failure_or_timeout_logic: >-
      不需要正常超时。当亚历山大暂时不安全时，该仪式旨在暂停而不是失败，因为历史幻想是制度的耐力。如果该国永久失去亚历山大或最终的灯塔建筑，则取消仪式并消除暂时的负担，而不授予完成奖励。
    implementation_mapping:
      confirmation_trigger_script: 检查亚历山大的所有权/控制权、最终独特的灯塔建筑的存在性、偿付能力和港口可用性。如果有可靠的触发器，可选检查可以暴露封锁或占领。
      start_effect_script: 设置仪式地点和进度变量，快照海上基线，并施加临时维护负担。
      snapshot_effect_script: 存储初始海军/贸易范围和相关港口状况值，用于每月进度和奖励缩放。
      progress_effect_script: 在每月监听器上，如果港务局保持完好，则添加一个进度单位。为强大的海事基础设施添加小额奖励进展。在封锁、占领、破产或当地严重破坏的情况下暂停进展。
      completion_trigger_script: 要求进度计数器达到十二次成功的每月检查，并重新检查亚历山大和最终建筑是否仍由赞助商持有。
      completion_effect_script: 消除负担，应用永久法罗斯国家修正，并授予一次性奖励，重点关注海军范围、贸易范围、海上声望、水手或造船势头。
    intended_rewards:
      permanent_country_modifier: >-
        保留并强调源naval_range和trade_range效果。永久利益代表灯塔作为一个正在运行的国家引航、信标和港口信号机构，可扩展亚历山大的海军范围和值得信赖的商业航行。
      one_time_reward: 当最终的照明和引航誓言证明灯塔系统正在运行时，授予一次性海上声望、水手、造船动力、海军传统或港口贸易奖励。
      local_building_reward: 亚历山大应该感觉像是系统的中心。如果以后的实现支持本地修改器，请为该位置添加港口吞吐量或船舶维修收益，而不仅仅是国家奖励。
    notes: 此设计故意将当前的源仪式从立即更改为定时。从历史上看，现有的直接奖励对于灯塔来说太微薄了；每月一次的听众更好地将塔楼描述为一个运作的海事官僚机构。
- id: 102
  key: unique_hagia_sophia
  base_key: sky_dome_grand_temple
  location: constantinople
  source_ritual_key: justinian_dedication
  status: designed
  ritual_design_zh:
    title: 查士丁尼大教堂的结构
    historical_flavor: >-
      圣索菲亚大教堂并不被视为一座可以被祝福一次并被遗忘的大厅，而是被视为君士坦丁堡的大教堂：一座大教堂、宫殿礼拜堂、文物宝库、帝国记忆的公共法庭，以及对查士丁尼在尼卡灾难后重建的饱经骚乱的城市的明显回应。仪式聚集了统治者或统治家族、族长或最高国家信仰的教主、主教、执事、守卫船只和文物的石像、帝国大法官、城市长官、行会大师、马赛克工人、灯管人、唱诗班领袖、宫殿守卫和城市各区的代表。他们在大皇宫、奥古斯特翁教堂、前厅、安博、画廊和浮动圆顶下的镀银祭坛之间移动，携带着福音书、圣物棺材、圣油、捐赠蜡板、紫色面纱、游行十字架、香和神职人员津贴清单。圆顶的金色马赛克和大理石护墙使天堂对法庭来说清晰可见，而维修、施舍、圣所规则和宴会义务的登记册将象征意义转化为持久的规则：国家学会通过礼拜仪式、可见的慈善机构、纪律严明的神职人员以及将王座和祭坛视为在一个有序空间中运作的资本人口来购买稳定。
    mode: timed
    duration: >-
      该设计使用十八个月的检查：在穹顶下的整个礼拜年有十二个月，四个月几个月的时间用于审计大教堂的捐赠和神职人员津贴，两个月的时间用于在君士坦丁堡的法院和行会大会上发布帝国确认书。这故意改变了源头直接仪式，因为圣索菲亚大教堂的力量来自于反复的公众崇拜、记录在案的维护以及宫殿、宗主教和城市之间的纪律关系，而不是来自单一的奉献祈祷。
    listeners:
    - monthly
    - ruler_death
    confirmation_logic: >-
      赞助者必须拥有并控制君士坦丁堡，最终的圣索菲亚大教堂建筑必须在那里存在，国家不能破产。这座城市不应该被占领、被积极围困、因严重骚乱而瘫痪，也不应该因封锁而被切断，从而导致博斯普鲁斯海峡和宫殿的补给路线无法使用。如果游戏国家可以表达首都或宫廷的访问权限，那么触发器应该要求君士坦丁堡是首都，或者统治者的宫廷可以安全地从首都前往大教堂。担保人应拥有公认的国家信仰或能够任命高级神职人员的国家宗教机构，并且国家在确认时不应陷入未解决的继承危机。其他地方的战争本身并不妨碍确认，但直接威胁君士坦丁堡、关闭海峡或使宫殿无法参加的战争应该显示为失败条件。
    start_logic: >-
      起始效果记录了发起国、作为仪式地点的君士坦丁堡、统治者身份以及该城市是否充当首都。它反映了国家稳定、合法性或同等政府权威、宗教团结或国家信仰凝聚力、神职人员满意度、财政健康、战争状况以及对国家信仰或稳定投资奖金的任何现有容忍度，因此最终奖励可以解释为制度强化而不是重复的礼物。它还反映了当地的情况：占领和封锁状态、动乱、破坏或繁荣、城市等级、当地神职人员或寺庙的存在（如果有），以及最终独特建筑的存在。临时负担用于代表灯油、蜡、香、马赛克和穹顶检查、神职人员津贴、公共施舍、宫殿守卫加班以及抄写捐赠登记册的大法官文员。当仪式暂停时，这种负担应该继续存在，因为大教堂仍然需要被看守、照明、供给和管理。
    progress_logic: >-
      每个月的滴答声代表一个命名的行政礼仪周期，而不是抽象的稳定。用一个月的时间审核银质祭坛、圣杯、帷幕和拟物门下的圣物箱；另一位负责检查圆顶肋骨、灯链、大理石路面和被煤烟熏黑的马赛克；另一个将神职人员津贴和救济粮食登记在教堂登记册中；另一个与守卫和城市官员一起演练统治者从宫殿到前厅的路线；另一个派执事到各支会宣布节日义务和圣所规则；另一个则由公证人对捐赠与国库进行核对；另一个座位让使节和当地精英坐在画廊里，见证首都的等级制度。当君士坦丁堡保持受控、有偿付能力、无人居住且足够平静以使这些公共周期发生时，进展就会取得进展。它会因占领、封锁、严重的城市混乱、破产或最终建筑物的损失而暂停。如果稳定性高、神职人员满意度强、首都位于君士坦丁堡、宗教团结度高、统治者亲自出席、或者城市繁荣而不遭到破坏，它可能会前进得更快。如果城市安全，战争可能会在幕后继续，但围困或封锁会暂停进展，因为仪式依赖于公开游行、可靠的宫殿出席以及蜡、油、谷物和香的供应。
      ruler_death听众将仪式期间的死亡转化为帝国葬礼语法：如果继承有序并且继承人被接受，神职人员将统治者的名字读到双联画中，在穹顶下进行纪念祈祷，并通过以合法性为导向的小进步来保持进展。如果继承权存在争议，葬礼就无法成为欢呼声，因此进展会暂停，直到危机结束。
    completion_logic: >-
      完成需要十八个成功的每月周期、对君士坦丁堡的持续赞助、圣索菲亚大教堂最终建筑的幸存，并且没有主动破产或直接占领。最后一幕在奥古斯都神庙黎明前开始：行会旗帜和区长守卫广场，统治者从宫殿大门走向前厅，高级神职人员接收福音书和圣物棺材，公证员携带密封的捐赠登记册。在安博，族长或国家信仰的教主祝福圆顶灯；执事打开圣所的幔子；唱诗班在画廊里回答；统治者在祭坛前铺上紫色的布或印章。城市长官宣读了一份公共法令，确认了修复义务、圣所纪律、施舍时间表以及大教堂在国家仪式中的地位。从那时起，奇迹不再只是一座已完工的建筑。它成为一种国家工具，可以减少宗教整合的脆弱性，并降低维持稳定的成本，因为争端、葬礼、登基、节日和公共慈善现在都通过一个单一的可识别的资本机构。
    failure_or_timeout_logic: >-
      没有普通的超时；如果首都中断，仪式可能会持续超过十八个月。失去君士坦丁堡、失去对场地的控制、最终建筑被拆除或消失，或者赞助国与场地的关系永久丧失，仪式就会取消，并在没有奖励的情况下消除负担。破产会立即暂停进展，只有在长期破产后实施需要硬失败的情况下才应取消。占领、围困、封锁城市、严重骚乱或严重破坏都会暂停仪式，因为游行和审计无法安全进行。统治者的死亡本身并不会使仪式失败；有序的继承将下一个ruler_death挂钩转变为纪念鼓掌的进程，而有争议的继承或摄政危机则暂停，直到法庭再次能够用一个声音说话。对外战争只有在到达城市、关闭海峡或阻止宫殿和神职人员会面时才会中断。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对君士坦丁堡的所有权和控制权、最终独特的圣索菲亚大教堂是否存在、未破产、没有占领、没有直接围困或严重骚乱，以及如果存在可靠的封锁或港口访问条件，则没有造成场地瘫痪的封锁。当这种状态可用时，还要检查法院或资本的准入以及是否存在活跃的继承危机。
      start_effect_script: >-
        存储赞助国、仪式地点、统治者身份、首都/法院访问标志、十八个进度目标、零当前进度以及活动的仪式标记。应用临时大教堂维护负担并安排每月和 ruler_death 听众进入标准化的独特奇迹仪式进程路径。
      snapshot_effect_script: >-
        国家稳定、合法性或同等权威、宗教团结、神职人员满意度、财政状况、战争状态、当前的宽容和稳定投资修正因素，以及当地的动乱、破坏或繁荣、占领、封锁、城市等级和君士坦丁堡的最终建筑存在。
      progress_effect_script: >-
        在每月的刻度上，当站点仍然可用时，添加已完成的审核、游行、维修检查、施舍登记或宴会订单周期的进度。为高稳定性、强烈的神职人员满意度、资本存在、高度宗教团结、繁荣或个人统治者出勤添加小额奖励进展。暂停而不消除破产、占领、封锁、直接围困、严重动乱、严重破坏或最终建筑缺失等情况下的负担。在
        ruler_death 上，仅当连续有序时才保留或添加进度；否则设置暂停继承状态。
      completion_trigger_script: 要求至少十八个成功进度单位，赞助君士坦丁堡的所有权和控制权，最终建筑仍然存在，没有破产，没有占领或直接围攻，并且没有未解决的继承危机。
      completion_effect_script: >-
        删除临时维护负担，明确仪式进度和暂停变量，应用永久圣索菲亚大教堂国家修正，授予一次性合法性，神职人员，稳定性或声望奖励，并记录描述已确认的伟大教会捐赠和公共仪式秩序的君士坦丁堡遗址记忆。
    intended_rewards:
      permanent_country_modifier: >-
        准确保留源国家修改主题：tolerance_own仍然是主要好处，因为伟大教会使国家信仰可见、有组织且不那么脆弱； stability_investment 仍然是第二个好处，因为捐赠登记、施舍时间表、神职人员纪律和宫殿礼拜仪式使恢复公共秩序的成本更低。如果以后的实施允许扩展，任何强化都应该只会加深这两个主题，而不是增加不相关的军事、贸易或研究奖金。
      one_time_reward: >-
        完成可以授予适度的一次性声望、合法性或赞助者的同等政府权威、神职人员满意度，以及可能的小额稳定投资回扣或稳定进展。如果一位统治者去世，并采用有序的葬礼-鼓掌方式，那么一次性的奖励应该更倾向于合法性；如果整整十八个月没有中断，它可以更倾向于神职人员的满意度和声望。
      local_building_reward: >-
        君士坦丁堡应该保留一个伟大的教堂捐赠登记册记忆：代表维护的灯、看守的文物、贫瘠的救济分配、训练有素的唱诗班和神职人员以及使用圣索菲亚大教堂作为首都礼仪法庭的当地注释或未来修饰语。即使当前的实现仅存储自然语言设计，站点内存也应指向减少当地骚乱、恢复繁荣或增强首都宗教服务，而不是通用的建筑产出奖励。
    notes: >-
      这将原始justinian_dedication从即时扩展为定时，因为圣索菲亚大教堂的历史功能是重复的首都机构：礼拜仪式、修复、慈善、捐赠、等级制度和继承仪式。每月的听众表达了普通的大教堂官僚机构；
      ruler_death 表达了大教堂在葬礼、双联画和鼓掌政治中的作用。实施者应该避免硬编码仅限东正教的触发器，除非更广泛的奇迹系统想要特定宗教的所有权；更安全的映射是需要一个国家信仰等级制度或神职人员阶层，同时让非拜占庭赞助者将仪式转化为他们自己的官方宗教秩序。
- id: 103
  key: unique_dome_of_the_rock
  base_key: sky_dome_grand_temple
  location: jerusalem
  source_ritual_key: dome_pilgrimage
  status: designed
  ritual_design_zh:
    title: 高贵岩石的保管契约
    historical_flavor: >-
      圆顶清真寺被设计为耶路撒冷神圣平台的保管机构，而不是作为单一公共祈祷的装饰性神殿。仪式聚集了统治者的专员、城市的卡迪或最高国家信仰的法官、伊玛目和古兰经朗诵者、门卫、运水者、瓷砖和马赛克检查员、灯管人、抄写捐赠契约的抄写员、圣地的守卫、受人尊敬的当地名人、来访的朝圣者，以及，如果赞助商的领域包括其他亚伯拉罕社区，则监督这些社区必须了解新规则的代表的访问权限。他们围绕岩石本身、内部回廊、宣告神圣统一的铭文、外部平台、大门、蓄水池、拱廊、灯以及朝圣者进入耶路撒冷的道路进行工作。蓝色和金色的瓷砖、镀金的圆顶、戒备森严的门槛，以及岩石周围的背诵，都使主权成为监护权：国家证明了它可以保护一个有争议的圣地而不将其变成战场，将虔诚的崇敬转化为外交信用，并通过发布规则将士兵、朝圣者、法学家、捐赠官员和当地社区约束到一个公认的秩序中，从而使国家信仰的宽容得以持久。
    mode: timed
    duration: >-
      该仪式使用十二张每月支票，代表一张支票耶路撒冷的守卫朝圣和维护年：四个月的时间来审计圣地的捐赠、大门、蓄水池、灯和铭文；四个月的时间接收和登记受保护路线下的朝圣团体；四个月的时间通过法官、驻军军官、当地知名人士和外国特使公布监护权宪章。这改变了源头的直接仪式，因为圆顶的政治意义在于持续的监管、受控的访问和族群间的认可，而不是单一的奉献时刻。
    listeners:
    - monthly
    confirmation_logic: >-
      赞助者必须拥有并控制耶路撒冷，最后的圆顶清真寺建筑必须在那里存在，而且国家不能破产。耶路撒冷不得被占领、直接围困或发生严重的局部骚乱。如果实施可以测试道路或朝圣安全，那么进入耶路撒冷的路线应该足够开放，以便受看守的朝圣者、学者和捐赠官员到达；如果能够测试封锁或供应隔离，这座城市就不应该断粮、断水、断灯油。赞助者应该有一个正常运转的国家信仰机构，能够任命一名监护人、法官或同等宗教官员。其他地方的战争并不禁止这种仪式，因为圣城经常在遥远的战争中运作，但一场使耶路撒冷成为前线城市、威胁到圣所区或阻止朝圣者安全进入的战争应该阻止或暂停它。确认工具提示应将当地动乱、占领、建筑物存在、偿付能力和路线安全性作为单独的可读要求进行披露。
    start_logic: >-
      启动效果记录了赞助国、作为仪式地点的耶路撒冷、赞助商的国家信仰或官方宗教秩序，以及指定的托管机构（如果可以代表这样的范围）。它反映了国家对国家信仰的容忍度、外交声誉、宗教团结或宗教间凝聚力、神职人员或宗教阶层的满意度、当前涉及城市的战争、财政健康以及围绕圣城的任何现有外交压力。它还记录了耶路撒冷当地的情况：动乱、破坏或繁荣、占领、围困、通道安全、最终独特建筑的存在，以及该城市通过水、食物、住宿和警卫支持朝圣者的能力。临时负担灯油、保管津贴、站台门口的警卫轮班、运水车、水箱清洁、瓷砖和铭文维修、朝圣者住宿补贴以及抄写穆斯林宗教与社团组织或国家捐赠登记册的抄写员。这些快照稍后应该让进展在动荡中暂停，为和平的朝圣季节提供奖励，并将外交奖励解释为公认的监护权而不是一般的声望。
    progress_logic: >-
      每个月的刻度代表一次具体的监护行动。在一个月内，门卫会检查站台门处的锁链、钥匙和监视名单；在另一个地方，运水人和泥瓦匠清理蓄水池并修复为朝圣者供水的渠道；在另一场比赛中，朗诵者绕着岩石转一圈，评委们在庭院里宣读准入规则；在另一处，瓷砖镶嵌工和灯管员检查圆顶、马赛克、灯具和铭文，以便圣殿保持明显的维护；在另一个例子中，抄写员对店铺租金、村庄收入或为保管人提供资金的国库拨款进行核对；在另一处，卫兵护送朝圣商队从城门到辖区；在另一个案例中，特使或当地知名人士目睹了监护条款的宣读，以便外国法院得知耶路撒冷是被命令而不是被掠夺的。进展不断推进，而耶路撒冷仍然由赞助商控制，有偿付能力，无人居住，没有受到直接围困，并且对看守的访客来说足够平静。如果爆发严重骚乱，如果辖区受​​到战斗威胁，如果城市供应中断，如果破产导致津贴和维修无法进行，或者最后的建筑消失，它就会暂停。当宗教团结度高、神职人员或宗教阶层满意度高、城市动荡程度低且繁荣、赞助商拥有良好的外交声誉或附近路线安全时，它可能会进展得更快。它不应该仅仅从征服中获得奖励进度；叙述是依法拘留，因此暴力镇压可能会保留该地点，但不应加速仪式，除非骚乱实际上减少了。
    completion_logic: >-
      完成需要十二个成功的每月托管周期、对耶路撒冷（圆顶清真寺的最终建筑）的持续所有权和控制权、偿付能力，并且没有直接围困或严重骚乱。最后的场景是圣地平台上的公众阅读。赞助者的专员与首席法官或宗教监护人一起站在岩石附近，看门人出示钥匙，运水人在水池台阶旁放置装满水的容器，灯管人点亮顶灯，背诵者在铭文下吟诵，警卫在门槛处放下武器，抄写员向当地名人、朝圣者和使节大声朗读密封的监护契约。该文件确认了捐赠收入、维修职责、朝圣者进入规则、对侵犯保护区的士兵的惩罚，以及赞助商保卫圣地的义务。此后，圆顶不再仅仅是一座令人印象深刻的宗教建筑。它成为一个外交证据，表明国家可以在没有混乱的情况下控制耶路撒冷，加强国内的国家信仰宽容，并增加外国对赞助者监管权的尊重。
    failure_or_timeout_logic: >-
      没有普通的超时；每当耶路撒冷无法安全地履行监护权时，仪式就会暂停。失去耶路撒冷、失去对场地的控制、最终建筑物被破坏或消失，或者赞助者与圣城之间永久决裂，仪式就会取消，负担就会消失，并且不会获得任何奖励。破产立即暂停，因为守卫、运水人和抄写员拿不到工资，把监护权变成了空话；如果需要，实施可能会在长期破产后取消。占领、直接围困、严重动乱、路线崩溃或供应孤立都会阻碍进展并保持负担。其他地方的战争是可以接受的，但耶路撒冷本身的战争会中断圣约，直到圣所再次安全为止。对于此设计，标尺的更改不需要特殊的侦听器；如果继承产生不稳定或法院无法确认托管人，每月检查应在相同的骚乱、权力或路线安全条件下暂停。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对耶路撒冷的所有权和控制权、最终独特的圆顶清真寺建筑的存在、赞助商未破产、没有占领、没有直接围困、没有严重的骚乱以及可用的朝圣或供应路线（如果存在此类检查）。另请检查赞助商是否拥有能够指定托管人的国家信仰机构或同等宗教管理机构。
      start_effect_script: >-
        存储赞助商所在国家/地区、耶路撒冷仪式地点、活动仪式标记、进度目标 12、当前进度为零以及任何可用的托管人或宗教权威范围。应用临时监护维护负担并注册每月听众以参与此活跃的独特奇迹仪式。
      snapshot_effect_script: >-
        快照国家宽容、外交声誉、宗教团结或凝聚力、神职人员或宗教财产满意度、财政状况、耶路撒冷周围的战争压力以及耶路撒冷当地的动乱、繁荣或破坏、占领、围困、路线安全、供应通道和最终建筑存在。
      progress_effect_script: >-
        在每个月的监听器勾选上，添加已完成的保管周期的进度，例如大门检查、水箱清洁、灯维护、捐赠审计、朝圣者登记、看守护送或公开阅读访问规则。为平静的耶路撒冷、繁荣的当地条件、强大的宗教阶层支持、高度的宗教团结、积极的外交声誉和安全的路线添加适度的奖励进展。在破产、占领、直接围攻、严重动乱、路线崩溃、供应隔离或缺少最终建筑的情况下暂停，无奖励。
      completion_trigger_script: 需要至少 12 个成功进度单位，继续赞助者对耶路撒冷的所有权和控制权，最终建筑仍然存在，无破产，无直接围攻或占领，并且无严重的当地动乱。
      completion_effect_script: 消除临时监护负担，清除主动仪式进度和暂停状态，应用永久圆顶清真寺国家修正，授予一次性外交或宗教秩序奖励，并记录密封监护盟约和看守朝圣令的耶路撒冷遗址记忆。
    intended_rewards:
      permanent_country_modifier: >-
        保留源修正方向：tolerance_own仍然是宗教核心，因为盟约将赞助者的国家信仰转变为围绕耶路撒冷最神圣的区域之一的有纪律的公共秩序； diplomatic_reputation 仍然是外部核心，因为其他法院、朝圣者和当地社区承认对有争议的圣城的管辖权。任何后续的扩展都应该加深这两个含义，而不是把圆顶变成一个贸易、人力或一般税收奇迹。
      one_time_reward: >-
        完成后应该从公认的监护人中获得适度的声望或合法性，从资助的捐赠中获得神职人员或宗教财产的满足，并可能获得与分享或尊重赞助者国家信仰的国家的外交支持或意见。如果耶路撒冷在所有十二个周期中保持平静，奖励可能包括当地的小规模繁荣或骚乱恢复脉冲，以标志着和平的朝圣季节。
      local_building_reward: >-
        耶路撒冷应该保留监护契约记忆：维护的灯、注册的捐赠、看守的大门、干净的蓄水池、受保护的朝圣者住宿以及在圣地平台周围公布的访问规则。未来的实施可以将其表达为减少当地骚乱、改善当地宗教服务、更好的朝圣者繁荣或更强的对占领相关破坏的抵抗力，即使当前通行证仅记录自然语言设计。
    notes: >-
      这将dome_pilgrimage从即时扩展到定时，因为圆顶清真寺的历史游戏价值不是虔诚的爆发，而是管理耶路撒冷神圣平台的艰难例行公事。每月的听众就足够了：仪式是关于重复监护、路线安全、捐赠管理和公共访问规则，而不是统治者死亡或战争胜利。实施者应避免使设计狭隘地依赖于一种现代宗教标签，除非完整的独特奇观系统随后选择特定于宗教的所有权；更安全的测绘是国家对争议激烈的圣地的监护。
- id: 104
  key: unique_angkor_wat
  base_key: giant_tower_temple
  location: angkor
  source_ritual_key: devaraja_entrance
  status: designed
  ritual_design_zh:
    title: 西堤道的天神游行
    historical_flavor: >-
      吴哥窟被视为皇家寺庙-城市机制，而不仅仅是宫廷提供祭祀的壮观圣所。仪式聚集了国王或统治家族、婆罗门仪式专家、寺庙舞者、梵文和高棉铭文抄写员、画廊管理员、护城河守护者、稻田官员、大象管理员、进贡的省长、宫殿围墙的守卫、维护浅浮雕的工匠以及代表吴哥周围国家信仰的僧侣或当地宗教人物。他们从西堤道穿过护城河，穿过刻有宇宙战争和皇家记忆的纳迦栏杆和画廊，走向中央梅鲁形的塔楼，这些塔楼用石头映射了梅鲁山。仪式的物品是吴哥特有的：来自护城河和巴莱的清澈之水、棕榈叶土地登记册、贡米篮、阳伞、皇家凉鞋、花环、海螺贝、寺庙灯，以及为神王圣所供养的庄园的铭文复制品。通过进入、审核和重新书写这座寺庙景观，赞助商将吴哥窟变成了一台合法性机器：灌溉、贡品、仪式等级、王室谱系和国家信仰宽容都在同一条游行路线中清晰可见。
    mode: timed
    duration: >-
      该仪式每月进行十六次检查。十二个月代表吴哥周围的一个农业和礼仪年，其中水、大米贡品、寺庙服务、画廊维护和法庭出席都必须在圣所中循环。另外四项检查代表将土地授予和寺庙服务义务复制到持久登记册中。这故意改变了源头直接仪式，因为吴哥窟的历史功能不是单一的进入祈祷；
    listeners:
    - monthly
    - ruler_death
    confirmation_logic: >-
      赞助者必须拥有并控制吴哥，最终的吴哥窟建筑必须在那里存在，国家不能破产。吴哥不应被占领、直接围困或遭受严重的局部动乱。由于这种仪式取决于寺庙-城市景观，因此该地点应该可以使用其护城河、堤道、寺庙区域和附近的农业支持；如果实施对破坏、繁荣、供水系统或供应隔离进行检查，则严重破坏或破坏的供水通道应阻止确认或显示为故障线。赞助者应该拥有足够的王室或中央权力来组织宫廷游行，并拥有足够的国家信仰组织来任命仪式专家。其他地方的战争是可以接受的，但是威胁吴哥、扰乱附近省份的贡品或阻止朝廷参加的战争应该阻止或暂停仪式。如果国家在确认时陷入继承危机，则触发器应要求在天神进入开始之前解决危机。
    start_logic: >-
      起始效果记录了主办国、作为仪式地点的吴哥、现任统治者、吴哥是首都还是仪式中心地带，以及用于仪式的活跃宗教权威。它反映了国家每月的合法性或同等权威、对国家信仰的宽容、宗教团结、稳定、统治者合法性、财政状况、战争状况和法庭可用性。它还反映了吴哥当地的状况：占领、围困、骚乱、破坏或繁荣、最终建筑的存在、水或水库状况（如果有）、城市等级以及附近的农业生产力（如果以后的实施可以表达的话）。对寺庙灯、花环、舞者、婆罗门津贴、铭文复制、护城河和堤道清洁、大象和守卫后勤、省级贡品护送以及向寺庙人员分发大米施加临时负担。快照应该让后续效果能够区分顺利的皇家入场和因干旱、动乱或继承中断而导致的延迟仪式。
    progress_logic: >-
      每个月的监听器滴答声代表吴哥窟的具体仪式管理行为。一个月清理并祝福西堤和龙栏杆；另一个检查游行中使用的护城河岸和圣水点；另一幅则排练了国王在阳伞下从外廊到中央圣所的通道；另一个有抄写员抄写土地赠款、稻田义务和寺庙服务清单；另一个有工匠清洁的海洋翻腾和皇家游行的浅浮雕，因此宇宙秩序仍然清晰可辨；另一个在画廊前接受省长的贡品；另一个向舞者、守卫、牧师和看守人分发大米和油；另一个在中央塔进行供奉，并将祝福的水返回到当地的田地。当吴哥仍然受到控制、有偿付能力、无人占领、没有受到直接围困、并且足够平静以供宫廷和寺庙仆人聚集时，进展不断推进。它因破产、占领、围困、严重骚乱、严重破坏、通往寺庙区域的通道被破坏或最终建筑消失而暂停。当合法性已经很高、宗教​​统一性很强、吴哥是首都或仪式中心、当地繁荣程度较高、水利设施完好或统治者亲自出席时，它可能会前进得更快。
      ruler_death 听众具有特殊含义：如果统治者在仪式期间去世并且继承有序，则游行将成为继承奉献仪式，在画廊中携带新统治者的名字并以合法性为导向的前进来保持进步。如果继承权存在争议，进展就会暂停，因为圣殿无法宣布哪个机构拥有神圣的王权。
    completion_logic: >-
      完成需要十六个成功的每月周期，继续拥有和控制吴哥窟，吴哥窟的最后建筑，没有破产，没有直接围攻或占领，也没有未解决的继承危机。最后一幕从西堤道的日出开始。护城河的水被吸入青铜器皿中；省长们拿着米篮和棕榈叶登记册站在那里；婆罗门专家和寺庙舞者带领统治者经过纳迦栏杆；大象驯养员和守卫负责守卫路线；铭文抄写员将复制的赠款带入画廊；统治者进入莲花塔下的中央圣殿。在最后时刻，在塔前浇上祝福之水，封印土地和服务登记册，点亮寺庙灯，并发布公告将吴哥窟命名为合法统治的石图。然后，这一奇迹就变成了国家能力：每月的合法性得以维持，因为每次登基和朝廷仪式都可以指向圣殿山，而国家信仰的宽容度则上升，因为牧师、当地宗教团体、耕种者和省长都被纳入一个公共仪式秩序中。
    failure_or_timeout_logic: >-
      没有正常的超时；只要赞助商保留遗址，吴哥窟就可以等待恶劣的季风、宫廷的混乱或临时的战争。失去吴哥、失去对地点的控制、最终建筑物的消失或永久无法维护寺庙区域都会取消仪式并消除负担而没有奖励。破产立即暂停，如果实施需要硬失败，则在长期破产后可能会取消，因为无偿的寺庙仆人和守卫破坏了仪式经济。占领、直接围困、严重的当地动乱、严重破坏、供水中断或进贡路线中断都会阻碍进展。只有当继承权仍然存在争议时，统治者的死亡才会使仪式失败。有序的继承将仪式重新引导到新统治者的祝圣仪式中，并保留了积累的工作。吴哥城外的战争只有在妨碍法庭出席、贡品护送或寺庙城市安全时才会暂停。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对吴哥的所有权和控制权，最终呈现独特的吴哥窟建筑，赞助商没有破产，没有占领，没有直接围攻，没有严重的动乱，没有未解决的继承危机。包括对可用寺庙区域、低度破坏、供水系统或水库完整性以及法庭访问（如果存在可靠触发因素）的可选检查。
      start_effect_script: >-
        商店赞助国、吴哥仪式遗址、统治者身份、活动仪式标记、十六个进度目标、当前进度为零以及首都或仪式中心状态。应用临时的 Devaraja 维护负担并每月注册 ruler_death 听众，以进行活跃的独特奇迹仪式。
      snapshot_effect_script: >-
        快照国家合法性或同等权威、每月合法性修正、宽容、宗教团结、稳定、国库健康、战争状态和法院可用性。快照当地占领、围困、动乱、繁荣或破坏、水/水库状况、农业支持（如果有）、城市等级以及吴哥的最终建筑存在。
      progress_effect_script: >-
        在每月的刻度上，添加已完成的堤道清洁、护城河水仪式、画廊修复、铭文复制、贡品审计、寺庙服务登记、供奉周期或法庭游行排练的进度。为高度合法性、强大的宗教团结、首都或仪式中心的存在、完整的供水系统、当地繁荣和个人统治者出席添加适度的奖励进展。在破产、占领、直接围困、严重动乱、严重破坏、寺庙/水路破损或最终建筑缺失的情况下暂停。在ruler_death上，仅当继承有序时才保留并推进进度；
      completion_trigger_script: 要求至少有十六个成功进度单位，继续对吴哥拥有和控制，最终建筑仍然存在，没有破产，没有占领或直接围攻，没有严重的当地动乱，没有未解决的继承危机。
      completion_effect_script: >-
        移除临时仪式负担，清除主动仪式进度和暂停状态，应用永久吴哥窟国家修正，授予一次性合法性或宗教秩序奖励，并为密封的寺庙服务登记册、祝福堤道和皇家进入路线记录吴哥遗址记忆。
    intended_rewards:
      permanent_country_modifier: >-
        保留源修正方向：monthly_legitimacy仍然是核心奖励，因为天神游行使王权成为一个可重复的寺庙机构而不是个人主张； tolerance_own 仍然是宗教奖励，因为牧师、寺庙仆人、当地耕种者和省长都通过土地赠与、祭品和公众游行融入了国家信仰秩序。任何后续的扩张都应该加强这两个轴，而不是增加不相关的贸易或军事利益。
      one_time_reward: >-
        完成可以赋予吴哥周围合法性、威望、神职人员或宗教财产满意度以及当地繁荣的适度脉搏。如果成功使用ruler_death继承奉献路径，则一次性奖励应倾向于合法性和继承接受度；如果仪式在没有中断且水源充足的情况下完成，它可能会包括一个小型的当地繁荣或稳定脉冲，以代表有序的寺庙服务和大米分配。
      local_building_reward: >-
        吴哥应该保留天神堤道登记记忆：清洁的护城河、受祝福的水点、维护的画廊、复制的土地授予、寺庙服务清单，以及从西堤道到中央塔的公认的皇家入口路线。稍后的实施可以将这一点表现为当地繁荣恢复、骚乱减少、国家信仰服务更强大或遗址对继承动荡的恢复能力提高。
    notes: >-
      这将devaraja_entrance从即时扩展为定时，因为吴哥窟的历史角色是连接神圣王权、灌溉、大米进贡、铭文和省级等级制度的持续寺庙-城市秩序。每月监听器表示每年的维护和服务周期；包含ruler_death是因为该仪式似乎可以成为连续的奉献仪式。实施者应将其与
      id 132 吴哥自来水厂区分开来：水在这里作为支持合法性的神圣和皇家基础设施，而不是作为主要经济产出主题。
- id: 105
  key: unique_potala_palace
  base_key: sacred_mountain
  location: lhasa
  source_ritual_key: enthronement
  status: designed
  ritual_design_zh:
    title: 雪狮坐床场
    mode: timed
    historical_flavor: >-
      布达拉宫被设计为一个神圣行政的高原政府，而不仅仅是一座山上的宫殿。仪式聚集了统治者或公认的精神政治领袖、摄政者、大寺院的住持、密宗仪式专家、甘丹颇章政府的文士、税务和徭役官员、旗手、酥油灯守护者、医生和占星师、商队护卫、拉萨的贵族家庭、携带哈达的朝圣者以及边疆寺院的使者。他们带着印章、香、经幡、海螺号、酥油灯、粮账、寺院任命书和庄园户籍卷，爬上玛波里，穿过白色的宫殿庭院、红色的大厅、圣物教堂、集会室、屋顶露台和手稿库。布达拉宫的高度使拉萨上空的规则清晰可见；红色的教堂将记忆和文物与权威联系在一起，而白色的行政大厅则将朝圣、皈依、财产记录和修道院纪律变成了日常的国家机构。该仪式属于此，因为宫殿通过有组织的教师使皈依变得可信，并通过可以将朝圣者、僧侣、贵族、边疆酋长和当地家庭吸收为一个神圣秩序的宫廷使真正信仰的宽容持久。
    duration: >-
      该仪式使用十八个月的支票。十二个月代表了整个拉萨的寺院接见、朝圣登记、户籍、酥油灯供养和法令发送的循环。另外六个月的时间是确认住持、复制教学许可、确保商队路线以及协调遗产收入与宫殿和修道院义务的缓慢工作。这改变了直接仪式的来源，因为布达拉宫不是单一的坐床场景；
    listeners:
    - monthly
    - ruler_death
    confirmation_logic: >-
      赞助者必须拥有并控制拉萨，最终的布达拉宫建筑必须在那里存在，国家不能破产。拉萨决不能被占领、直接围困或严重动乱。因为这是一座山上宫殿寺院，从城市到玛波里的路线以及更宽的高原朝圣道路对于僧侣、朝圣者、使节和庄园官员来说应该足够安全；如果实施可以明确路线安全、封锁、供应隔离或破坏，则这些应作为确认检查出现。赞助者应该拥有一个运转良好的国家信仰等级制度或神职人员阶层，能够任命方丈和派遣教师。如果现任统治者存在争议、摄政危机活跃或继承人尚未被接受，则应等待确认。其他地方的战争不会阻碍该仪式，但威胁拉萨的战争、关闭商队道路或阻止僧侣代表到达的情况应该阻碍或暂停该仪式。
    start_logic: >-
      起始效果记录了赞助国、作为仪式地点的拉萨、现任统治者或精神政治领袖，以及任何可用的摄政或宗教权威范围。它反映了国家的转变速度、国家信仰的宽容、宗教团结、神职人员或宗教阶层的满意度、合法性或同等权威、稳定性、财政健康、战争状况，以及赞助者是否有边境或高地省份应该接受教学任务。它还记录了拉萨当地的情况：占领、围困、动乱、破坏或繁荣、最终建筑的存在、路线安全、朝圣活动以及寺院或寺庙支持（如果有）。临时负担酥油灯、焚香、抄写、抄写任命书、宫廷侍卫、寺院俸禄、朝圣者住宿、商队护送、以及给僧侣和游客分发食物等费用。这些快照应该让实施在不安全的道路上暂停，衡量和平路线的奖励，并将转换工作与一般的合法性仪式区分开来。
    progress_logic: >-
      每个月的监听器滴答声代表一个特定的宫殿寺院任务。月记殿阶下香客姓名及供品；另一个检查酥油灯商店和红教堂的香火；另一个为派往边境地区的僧侣复制教学执照；另一个则由哲蚌寺、色拉寺和甘丹寺的方丈或当地的同级方丈在法座前确认纪律；另一个则由抄写员协调庄园粮食、徭役和为宫殿仪式提供资金的税收义务；另一个护送使节穿过高原道路，向宫印宣誓；另一位在面向拉萨的屋顶露台上进行公开祈祷和祝福。另一个则向修道院发送书面法令，对当地社区进行教学、翻译、辩论和皈依。当拉萨得到控制、赞助商有偿付能力、道路足够安全、寺院代表可以聚集时，进展就会取得进展。它会在破产、占领、直接围困、严重骚乱、路线崩溃、严重破坏或最终建筑物损失等情况下暂停。如果宗教高度团结、神职人员强烈满意度、积极稳定、当地繁荣、安全的高地路线以及公认的统治者或摄政王亲自出席，它可能会进展得更快。
      ruler_death听众代表了布达拉宫在连续性中的作用：如果统治者在巡演期间去世，并且继承或摄政承认是有序的，宫殿会将下一位观众变成葬礼祈祷和承认仪式，保留进度并增加一个小的权威预付。如果继承权存在争议，进展就会暂停，因为传教士信件和修道院任命不能以有争议的名字说话。
    completion_logic: >-
      完成需要十八个成功的月度周期、继续拥有和控制拉萨、最后的布达拉宫建筑、偿付能力、没有直接围困或占领、没有未解决的继承危机。最后的场景从白色的行政大厅开始，抄写员在那里展示密封的修道院任命、遗产收入和朝圣者家庭的登记册。游行队伍在酥油灯和海螺号声中登上红色大厅；修道院院长或高级神职人员将教书置于王座前；使节、贵族献哈达；统治者、摄政王或公认的教主收到宫印；一份公告命令教师、翻译和寺院官员在高地和边境社区传播国家信仰。当灯光在拉萨上空点亮时，布达拉宫就不再是一座完整的宫殿了。它是一个有组织的皈依和真正信仰宽容的国家机构，因为信仰现在通过注册教师、寺院纪律、遗产支持、朝圣接待和公认的神圣管理机构传播。
    failure_or_timeout_logic: >-
      没有普通的超时；山地政治和朝圣之路可能会延迟线路，但不会使其失效。失去拉萨、失去对该地点的控制、最终建筑的消失或永久无法维持宫殿寺院的权威都会取消仪式并消除负担而没有奖励。破产立即暂停，因为未领取报酬的抄写员、侍卫、僧侣和商队护卫无法保持宫殿网络的活跃。占领、直接围困、严重动乱、路线崩溃、严重破坏或寺院代表的损失会阻碍进展并保持负担。如果继承、摄政或精神认可是有序的，统治者的死亡不会取消仪式；它成为一种连续性仪式。有争议的继承权、有争议的摄政或未被承认的精神领袖都会暂停进程，直到权威得到解决。只有当战争威胁到拉萨或连接宫殿与寺院和边疆使团的道路时，战争才会暂停。
