  ritual_design_zh:
    title: 扩大圣地的基斯瓦更新
    historical_flavor: >-
      麦加大清真寺扩建仪式将圣所视为一个监护机构，其中心必须受到尊重，而其扩大的拱廊、庭院、供水系统、道路和朝圣服务为信徒的世界腾出了空间。参与者包括统治者或指定的监护人、麦加谢里夫或适当的当地监护人、卡迪斯、法学家、伊玛目、宣礼员、基斯瓦工匠、纺织品检查员、运水者、水井和蓄水池管理员、商队埃米尔、道路警卫、市场检查员、圣所清洁工、拱廊建造者、捐赠书抄写员、教导朝圣者的学者以及来自主要国家的代表团。朝圣路线。他们在天房、扩建的庭院、拱廊、大门、灯、渗渗泉和水站（如果建模的话）、朝圣者住宿、商队接待点、市场通道、维修脚手架和遮荫的教学圈周围移动。这些物品包括
      kiswah 布、窗帘绳、清洁容器、灯油、捐赠账簿、水袋、路线安全通道、学者的 ijaza 或教学清单（如果有代表性）、大门钥匙、人群流量标记和维修帐户。这里属于麦加，因为扩张必须为圣地服务，但不能取代其中心：国家通过使通行更加安全、礼拜更加有序、学习更加可传播来证明其合法性。奖励主题源于这种关怀：随着信徒经历受保护的朝圣，自身信仰的宽容度会增长，而皈依速度则反映了朝圣者、学者、商人和向外传播圣所教义的路线网络。
    mode: timed
    duration: >-
      使用十二个月的支票。一整年代表着朝圣季的准备和恢复：布匹的制作和检验、庭院的修缮、供水、路线的保障、教学安排、住宿、​​市场管理、人流、清洁、捐赠核算。这改变了直接报道的来源，因为更新基斯瓦是一个可见的高潮，但宽容和信仰的传播取决于一年可靠的圣所服务。
    listeners:
    - monthly
    confirmation_logic: >-
      赞助国必须拥有和控制麦加，麦加大清真寺扩建的最后一座建筑必须在那里存在，而且国家不能破产。麦加不得被占领、直接围困或严重动乱，圣所、大门、扩建庭院、拱廊、配水系统、朝圣者住宿、市场通道和主要朝圣路线必须可用。赞助者应遵循或正式保护圣所的信仰；敌对的信仰政策应该阻止确认，除非存在特殊支持的宽容路径。宗教当局和当地监护人必须能够参与，而不应该公开反抗。只有在不关闭朝圣路线、威胁麦加、夺取商队资金或阻止圣地维护的情况下，积极的战争才是可以接受的。
    start_logic: >-
      起始效果记录了赞助国、作为仪式地点的麦加、统治者或指定的监护人、参与的宗教当局、国家信仰以及朝圣路线背景（如果可以表示）。它快照了国家tolerance_own、global_pop_conversion_speed_modifier、宗教团结或信仰凝聚力、神职人员或宗教财产满意度、稳定性、合法性或虔诚权威、财政健康、战争状况、朝圣路线安全以及任何传教士或学者网络指标。它反映了麦加当地的情况：占领、围困、骚乱、破坏或繁荣、最终建筑的存在、庇护所通道、庭院可用性、大门功能、拱廊维修、供水、住宿能力、市场秩序、人群安全、kiswah
      工作室准备情况和捐赠基金。对基斯瓦布、纺织工、清洁工、挑水工、守卫、灯火、法师监督、学者界、商队接待、住宿、市场巡查、城门修缮、资抄等施加临时负担。这些快照应该让安全朝圣和宗教合作取得进展，同时如果赞助商控制麦加但无法保护信徒，则暂停。
    progress_logic: >-
      每个月的刻度代表一项特定的保管职责。一个月后，基斯瓦工匠会对布料进行测量、缝合、检查和密封，而纺织官员则记录费用。再过一个月，清洁工清洗和清扫庭院和拱廊，确认扩建仍然是一种崇拜服务，而不仅仅是添加石头。接下来的一个月，运水人和蓄水池管理员会为即将到来的朝圣者测试水井、水皮、罐子和阴凉的取水点。再过一个月，卡迪斯和法学家就市场和住宿规则达成一致，以免朝圣者受到剥削。又一个月，道路警卫和商队酋长报告了主要路线的安全通行情况。还有一个月，伊玛目、宣礼员和学者为不同地区的游客组织教学圈和祈祷仪式。其他问题还包括灯管维护、大门值班、维修脚手架、捐赠审计、人流标记、朝圣者住宿检查、外国朝圣者的翻译或法律指导，以及最大集会后的季后清洁。进步不断推进，而麦加仍然受控、有偿付能力、平静、对朝圣者开放，并得到宗教监护人的支持。它因破产、占领、直接围困、严重骚乱、路线封闭、不安全的人群条件、停水、基斯瓦车间中断、敌对宗教当局、市场掠夺丑闻、捐赠基金失踪或最终建筑消失而暂停。它可以通过高度的信仰宽容、宗教团结、满意的监护人、安全的路线、强大的财政、当地的繁荣、慷慨的捐赠和活跃的学者网络来加速。
    completion_logic: >-
      完成需要十二个成功的进展单位，继续拥有和控制麦加，最终的扩建建筑，没有破产，没有占领或直接围困，没有严重的骚乱，开放的朝圣路线，可用的避难所和拱廊，可靠的供水服务，参与的宗教当局，准备好的基斯瓦，以及没有未解决的人群，市场或捐赠危机。最后的场景是虔诚而有序的。在聚集的管理员、法学家、学者、路线官员、运水人和选定的朝圣者代表面前，旧的覆盖物被恭敬地移除或根据当地习俗进行记录，新的基斯瓦被升起并固定，灯被点亮，水站被打开，大门官员确认人群路线，并阅读捐赠账簿以显示扩大的圣地将如何维护。然后，学者们坐在教学圈中，而商队埃米尔则收到返回路线的安全通行确认。这一奇迹变成了国家能力，因为信徒们看到赞助者保护圣地及其朝圣者，而朝圣者带回家的知识、法律裁决和记忆通过和平网络扩大了皈依和信仰凝聚力。
    failure_or_timeout_logic: >-
      没有普通的超时；庇护所准备工作可以暂停，直到路线重新开放或资金恢复。失去麦加、失去对圣地的控制、最终建筑的消失、或者当地监护人和宗教当局永久拒绝参加，都会取消仪式并消除负担，而不会得到任何奖励。破产立即暂停，因为没有报酬的警卫、运水员、清洁工和纺织工人危及朝圣者并羞辱了覆盖物。占领、直接围困、严重骚乱、朝圣路线关闭、断水、不安全的拥挤、市场掠夺丑闻、捐赠品扣押、拱廊受损、敌对信仰政策或基斯瓦工坊失败都会阻碍进展。当其他地方的战争威胁到麦加、封锁商队或夺取用于维护圣地的资金时，战争就会中断。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对麦加的所有权和控制权，最终独特的麦加大清真寺扩建建筑存在，赞助商没有破产，没有占领，没有直接围困，没有严重的当地动乱，并且可以使用避难所。包括对赞助者信仰兼容性、参与的宗教当局、开放的朝圣路线、供水、住宿、市场秩序、kiswah
        研讨会准备情况、捐赠资金、没有敌对监护人叛乱以及没有结束朝圣的战争条件的检查或警告。
      start_effect_script: >-
        商店赞助国、麦加仪式地点、统治者或指定保管人、国家信仰、宗教权威、活动仪式标记、十二进度目标、当前进度为零，以及朝圣路线背景（如果有）。适用基斯瓦布、纺织工人、清洁、水、警卫、灯、法学家、学者、商队接待、住宿、市场巡查、大门维修、禀赋抄写等临时庇护负担。注册每月听众。
      snapshot_effect_script: >-
        快照tolerance_own、global_pop_conversion_speed_modifier、宗教统一或信仰凝聚力、宗教财产满意度、稳定性、合法性或虔诚权威、财政健康、战争状态、路线安全、传教士或学者网络以及当地麦加占领、围困、动乱、破坏或繁荣、最终建筑存在、圣所通道、庭院可用性、大门、拱廊维修、供水、住宿、市场秩序、人群安全、kiswah
        研讨会和捐赠基金。
      progress_effect_script: >-
        在每月的刻度上，添加具体保管职责的进度：基斯瓦测量和缝合、庭院清洁、拱廊维修、水检查、住宿规则出版、市场正义、商队安全行为报告、教学圈时间表、灯维护、门值班、捐赠审计、人群流量标记、外国朝圣者指导或季后清洁。为高度的自身信仰宽容、宗教团结、满意的监护人、安全路线、财政实力、当地繁荣、捐赠和学者网络增加奖励进展。在破产、占领、围困、严重动乱、封闭路线、供水失败、不安全拥挤、市场丑闻、捐赠基金扣押、敌对当局、kiswah
        失败或最终建筑缺失情况下暂停。
      completion_trigger_script: >-
        需要至少 12 个成功的进展单位、持续赞助商对麦加的所有权和控制权、最终建筑仍然存在、无破产、无占领或直接围困、无严重动乱、开放的朝圣路线、可用的圣所和拱廊、可靠的供水服务、参与的宗教当局，准备好的
        kiswah，并且没有未解决的人群、市场、路线或捐赠暂停。
      completion_effect_script: >-
        移除临时庇护所负担，清除活跃的仪式进度和暂停变量，应用永久的麦加圣地扩张国家修正，授予一次性宽容，宗教团结，声望或朝圣奖励，并为更新的 kiswah 记录麦加遗址记忆，开放拱廊，水站，捐赠账簿，教学圈、安全通道和有序的朝圣路线。
    intended_rewards:
      permanent_country_modifier: >-
        保留源修正。 tolerance_own 代表信徒看到圣所在扩大的圣地中受到保护、清洁、浇灌、教导和尊严地开放。 global_pop_conversion_speed_modifier
        代表朝圣者、学者、商人和商队网络，从麦加向外传播教义、法律记忆和威望。这应该被视为吸引力、指导和信仰凝聚力，而不是强迫皈依。
      one_time_reward: >-
        完成可以赋予宗教团结、声望或类似虔诚的权威、神职人员/监护人的满意度、朝圣带来的当地繁荣、稳定的进步，或者通过朝圣者和学者网络带来的适度的皈依进步脉搏。如果在困难的条件下保持路线安全，回报可能会倾向于宽容和朝圣能力；如果学者网络强大，它可以倾向于转化速度和信仰凝聚力。
      local_building_reward: >-
        麦加应该保留基斯瓦更新账本的记忆：准备好的布料、运转良好的拱廊、打开的大门、水站、清洁的庭院、捐赠账户、学者圈子、商队安全通道和人群秩序标记。后来的实施可以将其表达为当地朝圣能力、减少自身信仰的不安、更强的宗教吸引力或朝圣路线中断时的恢复能力。
    notes: >-
      源仪式是直接的，但这种设计使用每月定时的进展，因为圣所的历史功能是围绕朝圣、水、教学和维护的持续监护。月听者足而恭敬；战争和统治者的死亡被视为背景而不是叙事驱动因素。实施者应将奖励重点放在个人信仰的宽容以及通过朝圣和学术来和平皈依，并避免耸人听闻的圣地。
- id: 121
  key: unique_ming_great_wall
  base_key: great_wall
  location: dadu
  source_ritual_key: nine_borders_beacons
  status: designed
  ritual_design_zh:
    title: 九界烽火台
    mode: auxiliary_building
    duration: >-
      这里应该使用auxiliary_building模式，因为明长城不能通过单一时刻的奉献来很好地表现出来。该仪式创建并维护了一个与最终奇迹相关的支持性边境网络：信标场、马匹中继站、城墙粮仓、军械库、大门登记处和与九境指挥系统相连的检查站。在实施方面，辅助结构可以作为长城的耐用"服务体"而存在，而进度则代表着人员塔楼、修复通行证、核对驻军账簿以及证明烟雾、火、鼓、信使和骑兵信号可以从北部通行证返回大都所需的时间。目标持续时间大约为十八到二十四个月的刻度是合适的：足够长，让人感觉像是一个边境动员周期，但又不能太长，以至于玩家只能看到一个被动的施工计时器。
    listeners:
    - monthly
    - pre_winning_war
    - ending_war
    historical_flavor: >-
      九界烽火台专门属于明长城，因为长城的战略力量来自有组织的边境政权，而不仅仅是砖石。北京大都朝廷、兵部、宦官边防、辽东、冀州、宣府、大同、山西、延绥、宁夏、固原、甘肃等地都尉，世袭军户、牧马人、烽火人、采石人、铁匠、运粮员、通市通译员等都参加。物理环境包括首都作战办公室、北门道路、居庸关和山海关等要塞、山脊线上的砖砌瞭望塔、数谷子和箭的杂志场以及在密封牌匾下等待新坐骑的中继站。仪式从京城下达"九边之火"的朱红命令开始：巡查员将成对的记录从大都带到城墙区域，每个驻军必须出示城墙登记册、塔楼名册、信号燃料储备、弓箭和火器库存、马数和粮食储备，当地长老或军户宣誓维持指定的范围。其物品包括信标燃料包、青铜或木质理货单、塔旗、信号鼓、大门钥匙、边境地图、粮食测量封条、印有制造商标记的墙砖以及战争办公室分类帐。这一具有象征意义的行为是将分散的边境防御变成一个可见的国家神经系统：当一座塔燃烧时，下一座山脊会响应；当一座塔被烧毁时，下一座山脊会响应；当通道关闭时，最近的指挥部知道应该移动哪条道路和哪条驻军。这就是为什么源奖励应该加强驻军规模和军队调动：仪式使长城成为一个国家机构，用于储存人员、粮食、马匹和预警时间，允许野战部队沿着准备好的道路行进，让指挥官在突袭变成入侵之前集中部队。
    confirmation_logic: >-
      只有赞助商拥有或牢牢控制大都、最终的明长城奇迹建筑存在、国家没有破产、城墙遗址没有被占领、被围困或与首都的行政范围隔绝的情况下，玩家才可以开始。国家必须能够支持有组织的边境指挥部：它应该拥有一支正常运作的军队，至少有最低限度的人力或士兵储备，足够的国库或定期收入来支付塔台工作人员的费用，并且不存在会导致边境统计在政治上无效的严重合法性或继承危机。如果实施可以间接检查地理位置或标签，那么它应该更喜欢控制北部边境或至少有一个暴露边界的国家，其中墙服务很重要；然而，这不应将仪式硬性锁定在大都遗址以外的确切历史省份之后。大都的当地严重骚乱、首都道路中断、敌人占领该地点或阻碍国家供应的积极封锁/包围都应阻止确认。战争不应该自动禁止仪式，因为边境系统经常受到威胁检查，但国家不能处于彻底崩溃的状态：如果首都被占领，主力部队被解散，或者财政部无法支付第一次检查车队的费用，触发就会失败。
    start_logic: >-
      启动效果记录了赞助国，大都奇观地点，最终的城墙建筑，以及将举行仪式状态的辅助信标网络实体。它应该反映国家军事和行政基线：当前的人力或同等的士兵储备、经常收入/国库、军队规模、与驻军相关的修正（如果有）、军队调动修正（如果有）、当前的战争状态、合法性或政府权威，以及统治者是否足够稳定以发布有效的边境统计。它还应该快照地点和边境条件：大都占领和动乱状态，当地繁荣或破坏，道路/控制对赞助商的连续性，墙最终建筑的存在，以及任何可以扩大进展的当地堡垒或驻军力量。启动效应会带来暂时的负担，即检查成本：每月维护、转移到墙上杂志的谷物、采购马匹以及用于塔楼维修的工匠劳动力。它应该初始化被调查区域的进度计数器、训练有素的信标人员、储备的粮仓、重新安装的中继站、经过审计的墙门和成功的信号演习。它还应该存储一个"边界警报内存"标志，以便
      pre_winning_war 和 ending_war 挂钩可以识别该国当前正在实际冲突中测试电路，而不是授予一般战争进展。
    progress_logic: >-
      每月的进步并不是抽象的稳定性增益。每个月，九界系统的一部分都会受到检查并连接至首都：测量员将通行地图与实际道路进行比较；泥瓦匠更换倒塌的护墙并盖上修复砖；灯塔守护者晒干芦苇、粪便、硫磺和灌木燃料；职员根据军户检查塔台名册；粮官量黍、盐、箭、粉；接力监督员分配马匹并确认站之间的距离；指挥员白天演烟，晚上演火，雾中鼓，大风中骑使。当大都被控制、最后的城墙建筑仍然存在、国家可以支付临时维修费用、场地没有被占用、首都沿线的动乱是可控的时，进展正常进行。当场地被占用、破产中断津贴、严重的当地骚乱阻碍检查、辅助建筑被禁用或继承危机导致指挥官拒绝新的统计时，它就会暂停。如果该国拥有强大的人力储备、健康的财政、高度的合法性/权威、庞大的常备军、大都的繁荣的当地条件或相关的堡垒/驻军能力，那么它可以加速，因为这些条件使得更容易配置塔楼和储存通行证。只有当赞助商即将赢得一场边境防御或快速部队集中似乎很重要的战争时，pre_winning_war听众才应该添加有意义的爆发：故事是墙警报系统为反击赢得了时间，甚至在和平签署之前就证明了这一点。
      ending_war听众应该回顾战争记录：如果该国在袭击中幸存下来，占领了大都，并在没有占领城墙的情况下结束了战争，指挥官将验证哪些塔楼报告正确，哪些通道及时调动了部队，以及哪些弹匣必须补充。灾难性的结束战争结果不一定会取消仪式本身，但它应该扣留战争进度奖金，并且如果城墙遗址受到威胁，可能会增加修复债务。
    completion_logic: >-
      完成要求进度计数器显示电路已被勘察、配备人员、供应、钻孔和认证；发起人仍控制大都；最后的奇迹建筑和辅助信标网络仍然存在；该国没有破产，也没有在政治上无法履行边境统计。最后的场景不是宫宴，而是京城与边疆的接力。天一亮，兵部就打开大都封印的九境名册。边境指挥官或他们的特使会出示配对的记录、大门钥匙、塔楼名册和标有最新修复的地图。在北部，选定的了望塔点燃了受控的烟雾和火焰链；骑手通过中继站携带匹配的书面报告；主要关口都敲锣打鼓；粮仓职员在目击者面前打开应急物资的封条并重新封条。当最后的消息到达大都时，朝廷宣布长城不再仅仅是一道防御工事，而是一个受监管的帝国警告和集中系统。完成的仪式将奇迹转化为国家能力，让驻军在经过审计的家庭义务的情况下扩大，让军队通过已知的通道、道路、准备好的重新安装站和可靠的警报计时更快地移动。
    failure_or_timeout_logic: >-
      如果条件仍然可以接受，则不应有普通的超时；辅助网络可能需要更长的时间，因为边境维修和驻军审计是季节性的。在短暂的战争、暂时的动乱、每月资金的损失或不会导致继承危机的统治者死亡期间，仪式应该暂停，而不是立即失败。如果赞助商失去了大都、最后的长城奇迹建筑被摧毁或降级到所需的最终状态以下、辅助信标网络被拆除、国家持续破产、或者敌人占领了该地点证明首都无法再指挥长城，那么它应该取消或失败。如果大都被占用并随后被恢复，则仅当辅助建筑仍然存在时，实施才可以允许从减少的保留进度重新启动；否则，国家应该需要一个新的仪式，因为塔台计数、供给和命令印章不再值得信赖。严重的当地破坏、封锁的首都道路或边境叛乱应该会暂停并缓慢耗尽进展，这意味着燃料变质、船员工资被拖欠、马匹被盗和登记册被伪造。与战争相关的中断应该是上下文相关的：远海战斗应该不重要，但是一场导致占领、失去通行证或金库崩溃的战争应该停止电路，直到再次检查边境指挥部。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助者是否拥有或控制大都，该地点存在所需的最终独特长城建筑，国家没有破产，该地点没有被占领或处于无效的围困状态，辅助仪式尚未激活，并且国家有足够的资源资助边防检查的军事行政能力。添加对道路/控制连续性、可容忍的当地骚乱、可用人力或常备部队以及不存在严重继承或政府当局危机（如果这些信号在现有辅助触发器中可用）的专题检查。
      start_effect_script: >-
        创建或激活辅助信标网络状态，将其绑定到赞助商和 Dadu，设置扇区、人员、粮仓、中继站、门审计和信号演习的初始进度变量，应用临时维护负担，并存储当前的国家以及缩放所需的本地基线。记录战争听众应仅在该仪式保持活动状态时将未来的战争胜利前和战争结束事件视为对墙电路的可能测试。
      snapshot_effect_script: >-
        刷新进度和奖励缩放所使用的已保存基线值：赞助商身份、站点身份、最终建筑存在、占领状态、当地动乱/繁荣/破坏、人力或士兵储备、军队规模、国库或收入、合法性/政府权威、战争状态、堡垒/驻军指标、以及是否支付临时维护费。快照还应保留原始起始值，以便完成可以区分真正的改进与仅在最终刻度时具有高值。
      progress_effect_script: >-
        在每月的刻度上，根据当月代表的工作将进度添加到适当的子计数器：墙调查、塔维修、信标燃料、花名册审核、粮仓储备、继电器重新安装、大门检查或信号演习。对占领、破产、无偿维护、严重骚乱、路线阻塞或指挥危机应用暂停或小幅衰退。应用加速以获得强大的人力、健康的财务、较高的权威、相关的驻军力量和繁荣的场地条件。在
        pre_winning_war 上，仅当仪式处于活动状态并且墙站点保持安全时才添加使用进度证明。在ending_war上，评估战争是否验证了电路、未受影响或损坏了其供应。
      completion_trigger_script: >-
        要求满足所有必要的子计数器或总进度阈值，Dadu仍然由赞助商控制，最终的建筑和辅助网络仍然存在，没有破产，没有主动占领或严重的局部混乱，并且没有未解决的指挥合法性危机。如果战争听众贡献了进度，请验证这些贡献是否来自审查期间未失地且国家未崩溃的战争。
      completion_effect_script: >-
        消除临时检查负担，将辅助信标网络标记为已认证或将其转换为长期维护记忆，应用保留长城驻军规模和移动速度主题的永久国家修改器，授予一次性战备奖励，并在大都留下代表已审核塔楼的本地记忆，库存通行证和首都战争办公室登记册。清除瞬时进度变量，这些变量在完成后不应该保持热状态，但保留显示或未来冷却逻辑所需的持久标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留并形式化源修饰符方向：global_garrison_size_modifier应该仍然是主要奖励，因为仪式将军户、塔楼工作人员、门卫和粮仓义务绑定到更大的边境设施中。 army_movement_speed
        也应该保留，因为经过认证的城墙网络可以改善通道、中继马匹、警告时间以及指挥官在沿北部通道集中部队时的信心。任何强化都应该是适度的，并被视为制度准备，而不是魔法墙无懈可击。
      one_time_reward: >-
        授予一次性准备方案，而不是财富或一般的辉煌：来自经过审计的军户的人力或士兵，临时驻军增援预备队，成功演习的军队传统或军事威望，如果最终的信标链干净地到达大都，可能还可能会带来一个小的稳定性/合法性提升。如果仪式在一场成功的防御战争期间或之后不久完成，则将部分奖励用于人力恢复或减少战争疲劳，以代表所守的关卡。
      local_building_reward: >-
        大都和城墙站点应通过持久的本地记录来记住经过认证的电路：作战办公室边境登记册、储存的信号燃料、重新安装的哨所、库存的弹匣、修复的关卡道路以及知道哪些塔楼响应哪些火力的指挥官。在以后的实施中，这可能会成为本地堡垒防御、供应限制、减少袭击造成的破坏、更快的驻军恢复或更好地通过站点移动，即使当前的设计阶段仅以自然语言数据记录内存。
    notes: >-
      源仪式被标记为立即进行，但本次设计特意将其更改为auxiliary_building，因为九界系统是一个永久的维护和指挥网络，而不是单一的启动仪式。选定的每月监听器携带检查和配置周期； pre_winning_war和ending_war让真实的冲突测试信标链，而不强制战争。实施时应避免将每场战争都视为相关的，避免在大都被占领时取得进展，并避免将长城变成普遍的进攻性征服引擎。奖励必须停留在驻军能力和行动准备情况上，与源数据相匹配，而本地记忆稍后可以表达首都周围的实际边境基础设施。
- id: 122
  key: unique_bank_of_saint_george
  base_key: royal_mint_system
  location: genoa
  source_ritual_key: bank_founding
  status: designed
  ritual_design_zh:
    title: 圣乔治的账本誓言
    mode: timed
    duration: >-
      定时模式优于源即时模式，因为圣乔治银行代表着一种缓慢的机构结算：公共债务被合并，债权人被绑定到法人团体中，税收流被分配为抵押品，铸币厂必须证明其硬币、账本和还款承诺一致。十二到十八个月的持续时间符合历史进程。每个月代表一次审计会议、一组公证债务转换、一次海关农场注册或一个造币厂化验周期，而不是被动等待。
    listeners:
    - monthly
    historical_flavor: >-
      圣乔治的账本誓言属于热那亚，因为圣乔治的 Casa delle Compere e dei Banchi di San Giorgio 不仅仅是一个富有的会计室；在这里，共和国将战争债务、商业信贷、铸币和税务管理转变为持久的公共机器。参与者包括总督的官员、安齐亚尼人、持有老主持人股份的商业债权人、公社的公证人、铸币厂主、金匠化验员、海关农民、盐税征收员、船舶保险公司、港口抄写员以及将密封的箱子从码头搬运到银行大厅的警卫。场景是港口附近的圣乔治宫，里面有拱形房间、上锁的档案柜、会计长凳、公告板、硬币秤、蜡封，以及面向热那亚港口桅杆和起重机的窗户。仪式物品包括装订账本、取消的债务工具、新发行的股票、化验针、硬币模具、天平、印有印章的银和金、税收农场合同、盐量印章以及代表共和国承诺收入的保险箱钥匙。其象征意义是明确的：国家承认其分散的义务和紧急征税必须先让债权人明白，然后才能成为权力。通过公开宣誓账本，热那亚将私人商人的信任转变为国家能力。现有的奖励主题直接源于此：由于对硬币进行了化验，记录了铸币税，并且市场信任在圣乔治账簿下发行的货币，因此铸币收入有所提高；税收收入效率得到提高，因为指定的关税、盐费、港口通行费和直接会费是根据书面义务收取的，而不是在每次危机中重新协商。
    confirmation_logic: >-
      赞助商必须拥有或控制热那亚，最终的圣乔治银行奇迹建筑必须存在于现场，国家不能破产，热那亚必须没有占领、围困或严重的城市混乱。由于银行的权力取决于港口收入和商业信贷，因此港口应该是可用的：如果实施可以检测到封锁、对海洋的敌意控制或当地贸易关闭，这些条件应该阻止或延迟确认。该国应该拥有足够的现有贷款、税收流、铸币收入、贸易收入或国库余额，以使公共和解有意义；一个没有财政基础的州只能将圣乔治视为风景。商人或市民的庄园，如果有的话，不应该彻底反抗，腐败或动乱也不应该严重到账簿被忽视的地步。战争不应该自动阻止仪式，因为热那亚的财政经常应对战时的压力，但首都港口、造币厂和档案馆仍然必须发挥作用。
    start_logic: >-
      起始效果记录了赞助国、作为仪式地点的热那亚、最终的银行大楼以及国家当前的财政身份。它概括了与奖励相关的国家价值观：铸币收入或铸币税系数（如果有）、税收收入效率、财政、收入、贷款或债务负担、利息压力、通货膨胀或货币紧张（如果建模）、贸易收入、商人/市民满意度、稳定性或合法性，以及腐败或行政效率。它还反映了热那亚当地的情况：占领状况、当地动乱、繁荣或破坏、港口准入、封锁状态、贸易价值或市场重要性，以及政府是否可以联系造币厂和档案馆。启动效应为经过审计的主持人、转换的债务份额、承诺的税收流、分析的硬币批次、注册的海关农民和密封的档案卷创造了仪式变量。它施加了临时负担，包括公证费、债权人谈判、化验成本、钱箱警卫，以及在国家可以自由支出之前将收入分配给债权人公司的政治成本。
    progress_logic: >-
      每月进展是一系列具体的财政行动。在一个月内，公证人会将旧的战争贷款与财政部的付款承诺进行比较，并标记哪些债务将转换为股票。另一方面，造币厂大师根据法律标准权衡当前硬币，并记录在不损害信任的情况下可以收取多少铸币税。海关农民带来港口费、盐、明矾、布料和过境费的合同；银行抄写员将它们复制到承诺收入分类账中。商业债权人就优先权、利息和抵押品争论不休，然后发誓接受银行账簿作为权威登记册。警卫护送硬币箱从港口到大厅；化验人员测试样品弗罗林、达克特和当地问题；职员将收到的现金与分配的税款进行核对。当热那亚受到控制、银行大楼仍然存在、国家有足够的偿付能力支付审计负担、港口开放、城市骚乱低于会分散公证人或债权人的水平时，进展就会取得进展。在破产、占领、严重骚乱、港口封锁或政府与热那亚之间无法通行的情况下，它会暂停。当发起人拥有强劲的贸易收入、健康的国库、低腐败、满意的商人或市民团体、高度稳定性或重大但可管理的债务负担时，它会加速，因为债权人有理由和信心接受合并。如果该国根本没有贷款，进展仍应通过税收和造币厂认证进行，但债务转换子柜台对奖励规模的贡献小于实际清偿债务的国家。
    completion_logic: >-
      完成需要对主要分类账进行认证：转换或确认足够的债务份额、承诺和登记足够的税收流、分析足够的硬币批次以及密封足够的档案卷。热那亚必须仍然受到控制，最终的银行大楼必须仍然存在，国家不能破产，港口不能处于使银行的收入分配虚构的情况下。最后的场景发生在圣乔治的主厅。总督的代表将公共印章放在银行印章旁边；商业债权人将旧有的债务搁置一旁；公证人按债务、税田和铸币收据类别大声朗读新账本；造币厂主铸造或展示经过验证的硬币；海关官员将象征性的钥匙交给盐库和港口收费站。当最后一页被密封时，港口门口会张贴公告，宣布银行的登记册将管理还款、分配收入和硬币信托。由此，奇迹从建筑转变为国家能力：税收以可预测的渠道到达，根据审计标准铸造的货币产生可靠的收入，债权人将共和国的承诺视为可交易资产而不是绝望的恳求。
    failure_or_timeout_logic: >-
      这种仪式不应该有严格的正常超时，但如果无法进行审计，它应该停滞不前。失去热那亚、失去最后的银行大楼、持续破产、占领城市、削减港口收入的敌对封锁或严重的商人叛乱都应该取消或失败该过程，因为承诺的收入和钱箱不再可信。短暂的战争、暂时的现金短缺或轻微的骚乱应该会阻碍进展，并可能增加审计欠款，而不是消除这种仪式。如果该国在仪式期间违约，进展要么重新启动债务转换工作，要么增加重罚，因为债权人将要求新的条款。如果城市在占领后恢复，只有在银行大厅和账本没有被破坏的情况下，设计才允许从部分存档进度重新启动；否则，印章、箱子和合同必须从头开始重新签发。统治者的死亡本身并不重要，除非国家陷入严重到足以使偿还承诺产生政治争议的合法性危机。
    implementation_mapping:
      confirmation_trigger_script: >-
        验证赞助者对热那亚的控制，最终独特的银行建筑存在，没有破产，没有占领或无效的围攻状态，没有活跃的仪式重复，以及可接受的当地骚乱。添加以金融为主题的检查以获取可用的港口通道，如果此类房地产逻辑可用，则商人房地产不会反抗，通过国库、收入、贷款、贸易、税收或铸币建立有意义的财政基础，并且不存在极端腐败或政治崩溃。
      start_effect_script: >-
        将仪式与赞助商和热那亚绑定，初始化主持人审计、债务转换、税收流承诺、硬币分析、海关农民登记和档案封存的进度变量，应用临时行政和财政负担，以及记录每月监听器应在国家保持偿付能力且港口仍可通行的情况下处理圣乔治审计工作。
      snapshot_effect_script: >-
        存储并刷新相关国家和地方基线：铸币收入因素、税收效率、国库、收入、贷款、利息或通货膨胀压力（如果有）、贸易收入、商人/市民满意度、稳定性、合法性、腐败、热那亚占领、动乱、繁荣/破坏、港口和封锁状态以及最终建筑物存在。保持奖励缩放和失败比较的起始基线。
      progress_effect_script: >-
        在每月的滴答声中，推进一个或多个财政子柜台进行债务审计、债务转换、承诺收入登记、硬币化验、海关农民登记、档案封存和公告发布。由于破产、错过维护、占领、封锁、严重动乱或商人叛乱而暂停或衰退。加速实现强劲的贸易收入、健康的国库、可控的债务、低腐败、高稳定性和满意的商人。允许特定债务进度与实际债务规模相匹配，同时仍允许轻债务国家通过税收和造币厂认证来完成。
      completion_trigger_script: >-
        要求满足财政子柜台或总进度阈值、热那亚控制、最终建筑存在、没有破产、没有占领、没有严重的地方混乱以及可用的港口或收入渠道。要求在最终审计月份之前支付临时负担，以便在国家功能违约后完成不会启动。
      completion_effect_script: >-
        消除临时审计负担，应用永久国家修改器保留铸币收入和税收效率，授予一次性国库/债务稳定奖励，用本地圣乔治分类账记忆标记热那亚，清除活动进度变量，并仅保留显示、冷却或未来银行相关所需的持久标志
    intended_rewards:
      permanent_country_modifier: >-
        直接保留源效应：minting_income_factor反映了值得信赖的硬币分析、严格的铸币税以及市场对银行审查下发行的货币的信心； tax_income_efficiency 反映了承诺的关税、盐费、港口通行费和直接税进入经过审计的账本，而不是通过紧急讨价还价泄漏。任何改进都应该停留在财政和行政管理上，而不是成为一般的贸易或声望奇迹。
      one_time_reward: >-
        授予一次性财政稳定奖励：新规范化的通行费、有限的贷款或利息削减、通胀缓解（如果引擎支持的话）、商人满意度或结束债务纠纷带来的小幅稳定性/合法性收益。如果赞助商从大量贷款开始并完成了债务转换柜台，则将部分奖励用于债务减免而不是原始现金。
      local_building_reward: >-
        热那亚应该保留圣乔治经过认证的分类账的记忆：上锁的档案、经过公证的税场、造币厂分析台、债权人会议室、有人看守的钱币箱以及港口门口的公告。稍后的实施可以将其表现为地方税收效率、减少地方腐败、额外的贸易价值保护或更快地从以港口为中心的财政危机中恢复。
    notes: >-
      最初的仪式是立即进行的，但每月定时处理更好地代表了债权人治理的财政机构的创建。只需每月收听一次，因为核心戏剧是簿记、谈判、化验和税务登记，而不是战场计时或统治者继承。实施过程中应避免将其写为免费债务消除：银行提高信誉和收款，而任何一次性减免都应通过经过审计的转换工作来衡量和证明其合理性。该设计还需要港口和占领检查，因此被封锁或占领的热那亚无法证明其无法实际收集的收入。
- id: 123
  key: unique_cahokia_mounds
  base_key: world_monument_group
  location: cahokia
  source_ritual_key: woodhenge_final_rite
  status: designed
  ritual_design_zh:
    title: 木阵日历和土丘盛宴
    mode: timed
    duration: >-
      这应该使用定时模式而不是源即时模式，因为卡霍基亚的力量是通过年度公民日历来表达的：太阳观测、土丘维护、农业调度、区域收集、食物储存和公共再分配。十二个月的持续时间是理想的。它让仪式经历了一个完整的周期，从后期设置和春季播种信号到夏季广场聚会、收获储存，以及木材圈的最终日出确认。
    listeners:
    - monthly
    historical_flavor: >-
      木阵日历和土丘盛宴属于卡霍基亚，因为土丘城市是密西西比河谷广阔景观的仪式和行政中心，而不仅仅是土方工程的集合。设计应该谨慎考虑确定性：卡霍基亚确切的口头神学无法恢复，但考古学为围绕僧侣土丘、宽阔广场、栅栏、通常被称为"木阵"的木圈、玉米农业、手工艺生产、长途交流和使权威可见的聚会而建立的公民仪式提供了强有力的物质基础。参与者是平台土丘上的统治者或最高血统、通过雪松柱观察日出的仪式专家、搬运一篮子土的土丘修复人员、来自附近洪泛平原村庄的农民、陶工、贝珠制造者、铜和石头工人、来自密西西比和密苏里路线的独木舟商人、来自附属社区的跑步者以及安排宴会和游戏的广场管理员。这些地方包括僧侣土丘、大广场、木材太阳圈、储藏室、栅栏门、借土坑和沿河的独木舟码头。这些物品包括雪松柱、编织篮、贝珠、雕刻陶器、铜板、石锄头、玉米、南瓜、豆类、干鱼、鹿肉、厚块石头以及用于更新土堆表面的土捆。该仪式的象征力量在于卡霍基亚将日历变成了命令。当太阳按照正确的方向升起时，城市可以宣布何时应开放田地、何时应聚集游客、何时重新分配储存的食物以及何时周边城镇承认土丘中心的优先权。这就是为什么来源奖励是每月的声望和全球每月的繁荣：声望来自可见的宇宙和区域权威，而繁荣来自有纪律的种植计划、储存的剩余、修复的公民空间以及纳入盛宴周期的交换网络。
    confirmation_logic: >-
      赞助商必须拥有或控制卡霍基亚，最终的卡霍基亚土墩奇迹建筑必须存在，国家不能破产，土墩区不能被占领，在被围困，或遭受严重的局部骚乱。当地应该有足够的人口、粮食储备或繁荣来举办区域盛宴而不成为负担；如果实施可以检测到饥荒、破坏、人口减少或极端骚乱，这些国家应该阻止确认。仪式还应该选择有足够稳定性、合法性或地方权威的赞助商来召集附近的社区，因为没有出席的土墩盛宴无法产生声望。控制河流通道或贸易路线应该会有所帮助，而严格封锁河流或完全隔离地点应该会阻止这种情况的发生。除非卡霍基亚本身受到威胁，否则战争不应自动阻止仪式，因为区域集会也可以在危险期间重申权威，但占领土丘区、烧毁的储藏室或倒塌的金库必须阻止确认。
    start_logic: >-
      起始效果记录了赞助国、作为仪式地点的卡霍基亚、最终的土丘奇迹以及活动日历周期。它概括了与奖励相关的国家和地区指标：当前的声望、合法性或权威、稳定性、全球繁荣趋势（如果有）、财政/维持收入、粮食或供应储备（如果建模）、人口/人力作为劳动力的代表，以及贸易或河流通道作为访问代表团的代表。它反映了卡霍基亚当地的状况：占领、动乱、破坏、繁荣、当地粮食储存、人口、建筑或维修能力，以及广场和林圈是否可用。它为后对齐、土丘面修复、广场清理、储藏室填充、贡品代表团到达、工艺品准备、种植日历公告和盛宴分发创建进度变量。启动效果应该在劳动力和供给方面造成暂时的负担：土堆修复人员被从田里调走几天，储存的玉米和干粮被保留用于公共宴会，雪松或其他木材被收集用于柱子，守卫或管家在大型集会期间维护栅栏门。
    progress_logic: >-
      每月进度应描述真实的公民仪式工作量。最初几个月，观察员会通过现有的雪松柱观察日出线，将其与记忆中的种植标记进行比较，并标记哪些雪松柱需要更换。土丘工作人员用篮子土壤修复被侵蚀的斜坡，填装新的表面，并清理僧侣土丘上的游行路径。广场工作人员平整空地，清除杂物，设置烹饪场所，并为比赛和代表团准备场地。仓库官员清点玉米、豆类、南瓜、干鱼和肉类，这样盛宴就不会让当地家庭空空如也。陶艺家烧制船只，珠子工人准备贝壳装饰品，独木舟商人带来铜、石头、盐、兽皮和象征性物品，而跑步者则携带前往邻近定居点的邀请函或义务。当卡霍基亚得到控制、最后的奇迹依然存在、每月的供给充足、当地的骚乱是可控的、土丘/广场/木圈没有被占领时，就会取得进展。如果出现局部破坏、占领、严重动乱、无偿维护或直接威胁该地区的战争，则它会因饥荒、毁灭性洪水或火灾而暂停。它随着当地的高度繁荣、粮食过剩、强大的稳定性或合法性、良好的河流/贸易通道、大量的当地人口和积极的声望而加速，因为这些条件使社区更愿意参与和做出贡献。如果繁荣程度较低但食物仍然充足，进展应该会缓慢进行：仪式在一定程度上是一种恢复机制，但在真正短缺的情况下强行举行盛宴可能会面临衰退或取消的风险。
    completion_logic: >-
      完成需要一个完整的日历周期或同等进度：柱子已对齐，土丘已修复，广场已准备好，储藏室已填满，工艺品已组装，并收到了附近社区的代表团。卡霍基亚必须仍然受到控制，最终的建筑必须仍然存在，国家不能破产，辖区必须足够安静以供公众集会。最后一幕在黎明前在林场开始。观察者站在中央柱子后面，而统治者或仪式领导者则在僧侣丘上或下方等待。当太阳穿过标记线升起时，跑步者将确认书带到广场；鼓声、号召声或其他公共信号召集聚集的社区；打开装有玉米和储存食物的篮子；展示工艺品；游客通过栅栏门；中央当局宣布下一周期的种植时间、义务和保护。这场盛宴不是一般的庆祝活动：它是土丘中心可以读取天空、修复神圣土方工程、收集劳动力、储存剩余食物和重新分配食物的公开证明。这一奇迹成为国家能力，因为日历为国家提供了著名的仪式时钟和田野、仓库和贸易集会的实际繁荣节奏。
    failure_or_timeout_logic: >-
      仪式可以暂停而无需硬性暂停，但错过了太多重要月份的十二个月周期应该滚动到延迟的日历中，而不是立即完成。如果赞助商失去卡霍基亚、最后的土丘奇迹消失、国家持续破产、辖区被占领，或者当地的饥荒/破坏使再分配盛宴变得不可能，那么它应该失败或取消。严重的骚乱应该暂停并慢慢减少代表团的进度，代表游客远离，仓库受到看守而不是开放。远离密西西比河的战争应该无关紧要，但威胁卡霍基亚、阻碍河流流动、烧毁粮食储备或导致人口外逃的战争应该会打断仪式。如果场地恢复得很快，实施可能会保留完整的观察和土墩修复进度，但食物、代表团和宴会柜台应该会部分丢失，因为存储的物品变质或被消耗，并且必须再次召集访问团体。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对卡霍基亚的控制，最终独特的土墩建筑存在，没有破产，没有占领或无效的围攻状态，没有活跃的重复仪式，以及低于严重阈值的当地动乱。添加足够的当地粮食/繁荣或供应能力、可用的河流/贸易通道（如果可检测到）以及足够的国家稳定或权力来召集区域集会的主题要求。
      start_effect_script: >-
        将仪式与赞助商和卡霍基亚绑定，初始化用于柱对齐、土堆修复、广场清理、存储填充、代表团到达、手工艺品准备、日历公告和盛宴分发的计数器，应用临时劳动力和供给维护，并存储初始的国家和地方基线声望、繁荣、食品/供应、动乱、人口和路线访问。
      snapshot_effect_script: >-
        刷新赞助商和站点，说明每个勾选：声望、权威或合法性、稳定性、财政/收入、食品或供应代理、全球繁荣趋势、河流/贸易通道、卡霍基亚占领、动乱、破坏、当地繁荣、当地人口、存储条件和最终建筑存在。保留开始基线，以衡量该仪式是否真正改善了繁荣，或者仅仅发生在已经富裕的条件下。
      progress_effect_script: >-
        在每月的滴答声中，推进适当的子柜台，用于日出观测、雪松柱更换、土墩面修复、广场准备、食品储存、工艺品供应、代表团到达和宴会后勤。因占领、破产、严重动乱、饥荒/短缺、严重破坏、河流流动受阻或直接战争威胁而暂停或衰退。加速实现剩余粮食、高度繁荣、强大权威、大量当地人口、稳定的政府和开放的交流路线。
      completion_trigger_script: >-
        要求完整的日历进度阈值或所有必要的子柜台、持续赞助商控制卡霍基亚、最终建筑存在、没有破产、没有占领、可控的骚乱、为结束盛宴提供充足的食物储备，并且没有阻止土墩区公众集会的直接冲突。
      completion_effect_script: >-
        消除临时劳动力/供给负担，应用永久国家修正保留每月声望和全球每月繁荣，授予一次性盛宴和合法性奖励，为经过认证的木阵日历和存储周期添加本地记忆，清除瞬态进度变量，并根据需要保留持久的完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留monthly_prestige作为卡霍基亚日历中心的可见权威：周围社区看到赞助商收集劳动力，维护土堆，确认太阳秩序，并重新分配僧侣的食物土丘和广场。保留global_monthly_prosperity作为协调种植时间、储存纪律、维修劳动力和交流聚会的实际利益。奖励应保持公民仪式和农业性质，而不是成为军事或转换效果。
      one_time_reward: >-
        授予一次性威望、合法性/权威、当地繁荣以及从最终盛宴中恢复食物或供应。如果实施能够扩大回报，那么在经济低迷但非饥荒的繁荣之后成功完成应该会给当地带来更多的恢复，而在已经繁荣的卡霍基亚完成应该在邻近社区中给予更多的威望和外交影响力。
      local_building_reward: >-
        卡霍基亚应该记住对齐的木材圈、修复的土堆表面、清理的广场、填充的仓库、独木舟登陆时间表和访问社区的义务。后来的实施可以将其表达为当地繁荣增长、食物储存、丰富期间骚乱减少、当地吸引力增加或以土丘区域为中心的破坏后更强的恢复。
    notes: >-
      源仪式是直接的，但选择每月定时模式，因为木阵仪式只有在遵循完整的日历和重新分配周期时才具有设计重量。每月就够了；统治者的死亡和战争挂钩会分散农业和仪式节奏，除非未来的系统为卡霍基亚添加特定的继承用途。避免过分强调精确的仪式教义；将实施文本锚定在诸如哨所、土丘、广场、仓库、玉米、工艺品和河流代表团等物质特征中。奖励规模决不应该让盛宴在实际的饥荒或占领期间有利可图。
- id: 124
  key: unique_great_zimbabwe
  base_key: world_market
  location: great_zimbabwe
  source_ritual_key: gold_tribute
  status: designed
  ritual_design_zh:
    title: 石围金贡
    mode: timed
    duration: >-
      定时模式比源即时模式更适合，因为金贡是季节性的商业结算，而不是单一的宝物交付。每月九到十二个周期的持续时间是合适的：矿工和经纪人必须从内陆田地收集金粉和金锭，必须清点牛的财富，必须保证通往海岸的商队路线的安全，进口布料、珠子、瓷器和其他名贵商品必须在皇家围场确认交换周期之前返回。
    listeners:
    - monthly
    historical_flavor: >-
      石围场的黄金贡品属于大津巴布韦，因为该地点的力量取决于连接高地的能力生产、牲畜财富、皇家仪式、熟练的石工和印度洋贸易，而本身并不是一个沿海港口。参与者包括山丘建筑群和大围场内的统治者和宫廷、控制牛群的世系首领、周边地区的淘金者和挖掘者、铁匠和铜匠、象牙猎人、商队领袖、通往索法拉和其他沿海市场的路线上的守卫、与斯瓦希里商人打交道的翻译和经纪人，以及维护使王权可见的城墙的干石匠。这些地方包括大围场、圆锥形塔楼、牛栏、淘金场、仓库、山上神社、墙外的市场空地以及从高原通往海岸的商队小道。这些物品包括小包金粉、象牙、铜、铁工具、牲畜计数、进口玻璃珠、布料、陶瓷、称重石、密封篮子、皇家凳子和没有砂浆的砌块。其象征意义在于，贡品不仅仅是原始的提取。只有当黄金在证人面前被衡量、在途中被看守、交换为声望商品并由法院以确认谁控制牛群、矿山和贸易通道的方式重新分配时，它才成为政治权力。来源奖励方向完全遵循以下原则：trade_income上升是因为大津巴布韦标准化并保护了内陆到海岸的交换，而global_raw_material_output上升是因为采矿、牛、象牙、金属加工和其他原材料供应网络被纳入可预测的贡品日历。
    confirmation_logic: >-
      赞助商必须拥有或控制大津巴布韦，最终的独特奇迹建筑必须存在，国家不能破产，石头城市不得被占领、被围困或发生严重的局部骚乱。由于这一仪式依赖于产区和市场之间的流动，因此通往至少一个对外贸易出口或区域市场的路线应该是开放的；如果实施可以检测到贸易路线中断、破坏、袭击或类似封锁的隔离，那么这些条件应该阻止或延迟确认。当地应有足够的繁荣、人口、牲畜/供应能力、采矿或原材料实力或贸易价值，以使贡品有意义。战争不应自动阻止仪式，但占领场地、摧毁附近乡村或使商队不安全的战争应该阻止仪式的开始。商业团体、当地精英或地产界人士不应反抗，因为贡品需要生产者和经纪人双方认可的重量和公众认可。
    start_logic: >-
      开局效果记录了赞助国大津巴布韦作为祭祀地点、最终的石城建筑以及活跃的贡品季节。它反映了国家奖励基线：贸易收入、原材料产出、国库/收入、稳定性或权威、商人满意度（如果有）、腐败或征收效率以及战争或破坏状态。它还反映了当地的情况：占领、动乱、繁荣、人口、当地原材料生产、牲畜或食品/供应代理、贸易路线准入、市场安全以及围地是否可以举办公众致敬。它为收集的矿山贡品、确认的牲畜计数、分配商队守卫、认证重量、收到进口货物、密封仓库、完成砖石修复和准备皇家重新分配创建进度变量。临时负担应包括警卫、商队补给、称重官员、市场招待、城墙维护，以及在公共解决之前将黄金保留在皇家仓库中的政治成本。
    progress_logic: >-
      每月的进展代表了贡品周期中明显的一步。最初的几个月，派信使前往金矿区和养牛区，宣布预计的份额和到达日期。洗金工给当地经纪人带来灰尘和金块；炼铁工人和铜工人缴纳原材料费；象牙和兽皮均算在内；血统首领在城市附近赶牛，这样法庭官员就可以核实牛群的实力，而不必剥夺家庭的财产。接下来的一个月将验证重量和篮子：目击者比较当地的衡量标准，拒绝掺假的包裹，并标记可以安全发送到沿海交易所的贡品。商队领袖雇佣警卫、修理包装装备、安排停水点，并记录哪些经纪人将携带黄金、象牙和金属出境，以及哪些进口货物应返回。泥瓦匠修复了石墙和围墙入口，以便最终的展示发生在一个明显体现权威的区域。当大津巴布韦仍然受到控制、赞助商支付临时维护费用、当地骚乱可控且路线对商队来说足够安全时，进展就会取得进展。它因占领、破产、严重骚乱、毁灭性干旱或乡村破坏、路线封闭或商人叛乱而暂停。随着当地高度繁荣、贸易收入强劲、原材料产量强劲、权威稳定、腐败程度低、道路安全和商人满意，这种过程会加速，因为贡品是作为谈判义务而不是强行扣押而到达的。如果该国处于战争状态，但地点和路线安全，则进展可以缓慢地继续，但需要额外的警卫费用。
    completion_logic: >-
      完成需要收集黄金和原材料贡品、重量认证、商队交换确认、进口货物退回或记入贷方以及皇家围墙准备就绪。大津巴布韦必须仍然受到控制，最终的奇迹建筑必须仍然存在，赞助商不能破产，场地必须足够安全，适合公开市场和法庭展示。最后的场景发生在大围墙内部和周围。金包被倒在称重垫上；牲畜栏旁边会读取牲畜计数；象牙、铜、铁、布、珠、陶瓷等有序排列陈列；商队首领背诵路线并接受交换的沿海经纪人；石匠和宫廷侍从站在干石墙和圆锥形塔旁，将物质财富与皇家合法性联系起来。统治者或首席管家接受贡品，将选定的进口货物和牲畜返还给盟友血统，并宣布下一季节的标准措施和受保护的路线。这一奇迹成为国家能力，因为石头城现在充当受监管的内陆市场权威：生产者知道如何衡量贡品，商人知道路线受到保护，宫廷可以将原材料转化为经常性贸易收入。
    failure_or_timeout_logic: >-
      仪式不应该有严格的日历超时，但如果贡品季节反复中断，它应该会失去动力。如果赞助商失去了大津巴布韦、最后的奇迹建筑消失、国家仍然破产、城市被占领，或者严重的当地骚乱导致公众无法向公众致敬，那么活动就会失败或取消。路线封闭、严重破坏、饥荒程度的短缺或持续的袭击都会阻碍进展，并可能腐烂商队和牲畜柜台，因为牛群离开，经纪人拒绝冒险，储存的货物被消耗。如果该场地在占领后恢复，则可能需要重复进行砌体修复和权威工作；除非实施跟踪受保护的仓库，否则已经收集的贡品应该会部分丢失。战争应该通过实际破坏来发挥作用，而不是通过全面禁止：遥远的战争可以以更高的成本继续，而切断海岸道路或威胁圈地的战争应该停止仪式。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对大津巴布韦的控制，最终独特的建筑存在，没有破产，没有占领或无效的围攻，没有活跃的重复仪式，可控的当地动乱以及充足的当地生产或繁荣。添加主题检查，以确保安全的贸易路线或市场准入、未受破坏的乡村、商人/当地精英合作（如果有）以及能够支付商队守卫和贡品官员费用的财政基础。
      start_effect_script: >-
        将仪式与赞助商和大津巴布韦绑定，初始化黄金贡品、牛理货、原材料费、重量认证、商队安全、进口货物退货、仓库密封、砖石修复和重新分配的进度变量，应用临时维护和记录贸易收入、原材料产出、繁荣、权威、动乱、路线安全和财政的初始国家和地方基线。
      snapshot_effect_script: >-
        刷新当前赞助商和场地条件：贸易收入、原材料产出、财政/收入、稳定性或权威、商人满意度、腐败、战争状态、大津巴布韦占领、当地动乱、破坏、繁荣、人口、生产、路线通道和最终建筑存在。保留原始基线，以扩大规模并确定进贡季节期间产量和贸易是否真正有所改善。
      progress_effect_script: >-
        每月提前设立分柜台，负责矿山贡品收集、牲畜和原材料登记、重量认证、商队警卫分配、市场交换、进口货物退货、围栏修复和重新分配准备。由于破产、占领、严重动乱、路线封闭、严重破坏、饥荒般的短缺或商人叛乱而暂停或衰退。加速实现繁荣、强劲的原材料生产、安全的路线、高贸易收入、低腐败、稳定的权威和有偿维护。
      completion_trigger_script: >-
        要求完成总体进展或必要的分柜台，大津巴布韦仍受控制，最终建筑存在，没有破产，没有占领，可控的骚乱，足够安全的市场交换路线，以及足够的储存贡品/进口货物以进行最终的公共结算。
      completion_effect_script: >-
        消除临时贡品季节负担，应用永久国家修改器保留贸易收入和全球原材料产出，授予一次性贸易/繁荣/国库或权威奖励，为认证重量和受保护的商队路线添加本地站点内存，清除主动进度变量，并保留持久的完成或冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        通过大津巴布韦的法院和经纪人将trade_income保留为受保护的内陆交换的经常性价值。保留global_raw_material_output作为由贡历、牛验证、黄金收集、象牙和金属税以及标准化重量创建的更广泛的生产规则。修改器应该感觉像是一个受管理的高地市场系统，而不是一堆简单的黄金。
      one_time_reward: >-
        通过认证的贡品、大津巴布韦的当地繁荣、公共围栏展示的威望或合法性以及可能从受保护的路线获得的商人满意度来授予一次性国库或贸易价值。如果仪式期间原材料产量增加，则将一部分用于生产或当地繁荣，而不是纯粹的现金。
      local_building_reward: >-
        大津巴布韦应该保留对密封贡品仓库、经过认证的重量、修复干石墙、牲畜统计、商队警卫义务以及公认的海岸路线经纪人的记忆。稍后的实施可以将其表达为当地贸易价值、产量、减少对路线的破坏影响或混乱后市场繁荣的更快恢复。
    notes: >-
      原始来源模式是即时的，但每月定时模式更好地捕捉季节性贡品和交换周期。仅使用每月听众，因为该机制是经济和后勤的，而不是与统治者死亡或战争解决有关。实施时应避免将大津巴布韦视为沿海港口；它的优势在于与通往斯瓦希里海岸的航线的内陆协调。奖励必须始终以贸易和原材料为重点，以黄金作为仪式的可见媒介，而不是取代更广泛的牛、手工艺和商队经济。
- id: 125
  key: unique_isfahan_square
  base_key: triumphal_axis
  location: isfahan
  source_ritual_key: capital_polo
  status: designed
  ritual_design_zh:
    title: Naqsh-e Jahan 马球和集市观众
    mode: timed
    duration: >-
      定时模式优于源立即模式，因为马球庆祝活动只是较长萨非首都订购的可见高潮。每月十二到十六个刻度的持续时间应该代表宫廷观众、清真寺游行、集市合同、行会请愿、商队到达以及以广场作为政治舞台的皇家马球队的训练的安排。广场是一个活生生的资本机制，所以进步应该感觉像是对空间的重复使用，而不是一个单一的节日。
    listeners:
    - monthly
    - ruler_death
    historical_flavor: >-
      Naqsh-e Jahan Polo 和 Bazaar 观众属于伊斯法罕，因为阿巴斯国王的广场被刻意塑造成一个微型世界：宫殿、清真寺、集市和公共景观都面向同一个开放场地。参与者包括站在阿里卡普阳台上观看的国王和宫廷官员、排列整齐的奇兹勒巴什和古拉姆指挥官、来自国王清真寺和较小的皇家清真寺的乌里玛和清真寺看门人、亚美尼亚和波斯商人、丝绸经纪人、货币兑换商、商队领袖、行会长老、建筑师、瓷砖制造商、驯马师、马球骑手、外交使节和聚集在清真寺边缘的请愿者。迈丹。这些地方包括长方形广场、马球球门柱、阿里卡普宫大门、Qeysarieh
      集市门户、清真寺庭院、商队、拱廊、咖啡馆以及将丝绸、金属、地毯和手稿贸易转化为应税财富的作坊。这些物品包括马球槌和马球、皇家马匹、丝绸包、盖章的市场合同、请愿书卷轴、宫廷长袍、瓷砖铭文、清真寺灯、秤、零钱包和阳台地毯。其象征意义是，萨法维首都并不将辉煌与商业分开。统治者展示了对该领域的掌控，接收请愿书，将星期五祈祷和皇家观众连接到同一个城市轴线，并让商人看到他们的摊位和商队在明显的皇家保护下运作。每月的声望来自于在一个被称为"世界形象"的广场上反复进行的公共舞蹈；贸易收入随之而来，因为集市、商队和宫廷需求被整合到相同的仪式和行政秩序中。
    confirmation_logic: >-
      赞助商必须拥有或控制伊斯法罕，最后的纳克什贾汉广场奇迹建筑必须存在，国家不能破产，广场不能被占领、围困或遭受严重的当地动乱。当地首都地区应该能够同时容纳法院、清真寺和集市：如果实施可以检测首都状况、法院可用性、当地繁荣、贸易路线通道、宗教秩序、商人满意度或主动封锁/隔离，则应按主题使用这些检查。仪式应该需要足够的国库或每月收入来支付警卫、马夫、公众接待、清真寺管理员和市场检查员的费用。战争不应自动阻止仪式，因为萨法维统治者在压力下使用仪式，但敌人占领伊斯法罕、关闭集市、继承危机或宗教/公民叛乱应该阻止确认。如果赞助商的首都在其他地方，只有当设计打算将广场作为仪式性的第二首都时，仍然可以允许举行仪式；否则，资本/法院准入应该是一个强烈的要求或加速器。
    start_logic: >-
      起始效果记录了赞助国、作为仪式地点的伊斯法罕、最终的广场建筑、当前的统治者（如果有）以及活跃的宫廷集市观众周期。它反映了与奖励相关的国家价值观：每月声望、当前声望、贸易收入、国库/收入、稳定性、合法性或权威、外交声誉或特使存在（如果有）、宗教团结或神职人员满意度（如果相关）、商人满意度以及战争/继承状态。它反映了伊斯法罕当地的价值观：占领、动乱、当地繁荣、贸易价值、市场准入、破坏、资本/法院的可用性以及清真寺和集市区是否可用。它初始化宫殿阳台观众、清真寺游行秩序、集市合同登记、行会请愿听证会、商队接待、马球队准备、广场保安和特使座位的进度计数器。它用于警卫的临时维护、马饲料、瓷砖维修、市场检查、礼仪招待以及清真寺和宫殿工作人员的津贴。
    progress_logic: >-
      每月的进度是使迈丹发挥资本机器作用的重复工作。一个月后，宫殿迎来了指挥官、特使和请愿者走近阿里卡普阳台的命令。再过一个月，清真寺管理员和法院官员就会协调游行路线，以便祈祷、皇家接见和集市日不会相互阻碍。集市检查员登记丝绸合同、检查重量、分配商队旅馆空间，并听取金属工人、地毯销售商、货币兑换商和马匹经销商的行会请愿书。马厩主人训练马球马和骑手，不仅仅是为了运动，而是为了在商业和信仰构成的广场上纪律严明地展示皇家指挥。瓷砖工人修复铭文和拱廊；警卫清理场地；预示着受保护的市场日。当伊斯法罕得到控制、赞助商支付维护费、当地骚乱可控、贸易通道保持开放、法院可以使用广场时，进展就会取得进展。它会因占领、破产、严重动乱、集市关闭、路线隔离或阻止认可观众的继承危机而暂停。随着当地高度繁荣、贸易收入强劲、合法性高、稳定性好、商人或神职人员满意、外交活动和资本地位，它会加速发展。
      ruler_death 侦听器不应授予随机奖励；它应该将剩余的仪式重新解释为登基观众。如果新统治者顺利得到承认，广场可以通过举办公开宣誓、接待请愿和安抚市场来取得进展。如果统治者的死亡引发了有争议的继承，进展就会暂停或衰退，因为商人和使​​节不会接受阳台观众的约束力。
    completion_logic: >-
      完成要求宫殿、清真寺、集市、马球、行会、商队和保安柜台已达到其门槛；伊斯法罕仍受控制；最后的奇迹建筑存在；国家没有破产；广场对于公众观众来说足够平静。最后的场景在整个广场上展开。国王或公认的统治者出现在阿里卡普，而特使和指挥官则坐在下面。马球骑手进入球门柱之间，在球场上展示严格的纪律。从清真寺一侧，看门人带来灯或《古兰经》架，以纪念批准的公共秩序；公会长老和商队首领在集市门户上展示丝绸合同、零钱包、请愿书和秤。统治者收到请愿书，确认市场保护，承认集市的权重和商队旅馆的特权，并让马球比赛在宫廷、神职人员、商人和外国游客的注视下开始。这一奇迹成为国家能力，因为伊斯法罕的广场现在提供了一个具有皇家威望的经常性剧院和一个受监管的商业中心，这里的贸易受到与首都相同的权威机构的保护。
    failure_or_timeout_logic: >-
      不应该有严格的暂停，但如果反复错过法庭季节，仪式应该会失去进展。如果赞助商失去伊斯法罕，最后的广场建筑消失，国家仍然破产，广场被占领，或者当地动乱/宗教骚乱关闭清真寺或集市，那么它应该失败或取消。远离首都的临时战争只会提高警卫成本，从而减缓进展，而威胁伊斯法罕、孤立商队路线或迫使朝廷撤离的战争则应该暂停或削弱进展。统治者死亡是一个特例：顺利的继承可以融入仪式，甚至加速最终的承认，但有争议的继承应该暂停阳台观众，直到权威恢复。如果占领对城市造成损害并且后来恢复，则应重做市场合同和使节座位，同时可以部分保留已完成的瓷砖或广场修复进度。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对伊斯法罕的控制，最终独特的广场建筑的存在，没有破产，没有占领或无效的围攻，没有活跃的重复仪式，可控的骚乱以及足够的收入/国库用于法院和市场费用。添加对宫廷或资本可用性、可用集市/贸易路线访问、宗教秩序、商人合作以及不存在严重继承危机的专题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和伊斯法罕，存储当前统治者或权威背景，初始化宫殿观众、清真寺游行、集市合同、行会请愿书、商队接待、马球准备、广场安全和特使座位的进度计数器，应用临时维护，并存储国家/地方基线声望、贸易收入、权威、稳定性、商人/神职人员满意度、当地繁荣和路线访问。
      snapshot_effect_script: >-
        刷新当前赞助商和站点状态：声望、每月声望、贸易收入、财政/收入、合法性或权威、稳定性、外交活动、商人和神职人员满意度（如果有）、战争/继承状态、伊斯法罕占领、动乱、破坏、当地繁荣、贸易价值、路线访问、资本/法院可用性和最终建筑存在。保持奖励缩放和失败比较的起始基线。
      progress_effect_script: >-
        每月，提前设立分柜台，用于法庭观众排练、清真寺游行协调、集市合同登记、行会请愿听证会、大篷车接待、马球队训练、广场保安和建筑/拱廊维护。由于破产、占领、严重动乱、贸易路线关闭、法庭缺席或继承争议而暂停或衰退。加速资本地位、高度繁荣、强大的贸易收入、合法性、稳定性、商人满意度、神职秩序和外交存在。在ruler_death上，检查继承是否足够顺利，可以将进度转换为加入观众，或者仪式是否必须暂停。
      completion_trigger_script: 需要基本的法庭、清真寺、集市、马球、商队、行会和安全柜台或总进度阈值；伊斯法罕控制；最终建筑呈现；没有破产；无职业；可控的骚乱；可用的集市路线；
      completion_effect_script: >-
        删除临时维护，应用永久国家修正，保留每月的声望和贸易收入，授予一次性声望、商人/贸易、外交或当地繁荣奖励，用本地记忆标记伊斯法罕以获得经过认证的集市观众秩序，清除活动进度变量，并保留持久旗帜以供完成显示或冷却。
    intended_rewards:
      permanent_country_modifier: >-
        保留monthly_prestige 作为首都广场反复出现的威望，统治者、清真寺、使节、骑兵展示和请愿者都在这里公开编排。保留trade_income作为受保护的集市合同、商队服务通道、标准化重量以及以Qeysarieh门户和周围拱廊为中心的法庭需求的利益。奖励应该保持城市宫廷和商业性，而不是成为一种通用的军事演习，尽管有马球意象。
      one_time_reward: >-
        授予一次性威望、合法性或权威、伊斯法罕当地的繁荣、商人的满意度，如果最终观众中有外国客人，还可能获得外交使节或声誉奖励。如果仪式吸收了顺利的ruler_death加入，则添加适度的继承稳定性奖励，而不是额外的贸易现金。
      local_building_reward: >-
        伊斯法罕应该记住经过认证的独立广场秩序：马球球门柱、阳台观众协议、清真寺游行路线、登记的集市权重、商队服务特权、行会请愿长凳和守卫的市场日。稍后的实施可以将其表达为当地贸易价值、繁荣增长、减少行会骚乱或改善城市的外交接待。
    notes: >-
      源仪式是直接的，但定时模式更好地代表了计划中的萨法维首都如何反复训练宫廷、清真寺和市场共享一个广场。每月一次进行正常的城市准备工作，而ruler_death也被包括在内，因为阿里卡普阳台和独立广场是新统治者获得公众认可的理想场所。实施过程中应避免让继任危机变成自由进展，也不应过度军事化；奖励的来源是声望和贸易收入，因此每一个效果都应该指向景观支持的权威和受监管的商业。
- id: 126
  key: unique_grand_canal
  base_key: large_canal_system
  location: shangyuan
  source_ritual_key: grain_fleet_first_sailing
  status: designed
  ritual_design_zh:
    title: 运河办事处第一粮船队
    mode: auxiliary_building
    duration: >-
      辅助建筑模式比源直接模式更合适，因为第一粮船队仅证明持久的运河管理已经存在。辅助建筑应代表运河办公室：粮仓、闸站、疏浚人员、拖道中继站、船舶登记处、水位哨所和护卫军营，这些军营在首航船队之后保证贡粮和官方命令的移动。每月十八至二十四次的目标，符合从江南评估到装货、过闸浅水、正式检验、最后在资金供应系统登记的完整运输周期。
    listeners:
    - monthly
    historical_flavor: >-
      运河署第一粮船队属于大运河，因为中国的运河系统不仅仅是一条水路，而是一条官僚和物质动脉。它的力量来自于曹云贡粮系统、水利官署、船夫、船闸、纤道夫、粮仓吏、省税吏、守库兵、浚船夫、盐商、木材商和宫廷巡抚，他们使河流景观符合京城的历法。在上原和江南水乡，丰田的粮食被计量、封存，运往运河仓库；沿途的船闸、水闸、堤坝、浅水渡口和堆场决定了国家是否能够真正指挥远程生产。祭祀物品有粮理、印麻袋、船登记单、锁钥匙、水位杆、挖泥篮、拖绳、粮仓印、车队旗、航路簿等。其象征意义是行政压缩：大米、税务登记、快递、检查员和紧急命令都沿着同一条维护线路运输。这直接解释了奖励的来源。
      global_distance_from_capital_speed_propagation 代表了一条正常运作的运河缩短了法院和省之间的实际距离的方式； global_raw_material_output代表了一旦运输、储存和检验可预测，规范化的粮食、木材、盐、纤维和其他大宗货物的生产力就会提高。
    confirmation_logic: >-
      赞助商必须拥有或控制上苑，最后的大运河奇迹建筑必须存在，国家不能破产，运河遗址不能被占领、被围困或遭受严重的地方骚乱。仪式应该需要可用的水路或运输网络：如果实施过程中可以发现封锁、路线隔离、破坏、重大洪水破坏或敌人对关键运河段的控制，这些国家应该阻止确认。国家应该有足够的国库或收入来支付船工、纤夫、挖泥船、检查员和粮仓守卫的费用，并且当地应该有足够的繁荣、粮食剩余、原材料生产或人口来供应第一批船队。腐败或走私压力不应总是阻碍这一仪式的开始，因为仪式在一定程度上是一种审计反应，但极端腐败、粮食短缺或运输工人的反抗应该阻止它。只有保证上原和运河路线安全，才允许战争；敌人占领仓库或军事封锁水道应停止确认。
    start_logic: >-
      起始效果记录了主办国、作为仪式地点的上元、最终的运河建筑、辅助运河办公网络以及用于远距离传播解释的首都或中央行政范围。它概括了与奖励相关的国家价值观：当前资本范围或距离传播修正因子（如果有）、全球原材料产量、财政/收入、稳定性、行政效率、腐败、贸易或生产收入、粮食/供应储备和战争状态。它反映了当地和路线价值：上原占领、动乱、繁荣、破坏、水道通道、当地原材料或粮食产量、港口/运河可用性和运输安全。它初始化用于粮食评估、驳船登记、粮仓密封、船闸检查、疏浚、拖道修复、护航分配、检查站审计和资金接收的柜台。它施加临时维护负担，包括疏浚劳动力、船舶修理、粮食搬运、护送工资、公务旅行以及在仓库中存放税粮造成的损失，而不是立即支出。
    progress_logic: >-
      每月进度是第一支舰队的移动和审计。在一个月内，省级官员会评估粮食配额，并在麻袋或篮子上贴上原产地标记。在另一个案例中，船舶登记员检查船体，分配船队编号，并拒绝无法在浅水或船闸通道中生存的驳船。粮仓职员测量粮食、封存仓库，并将收据与税务登记册进行比较。锁卫人员测试大门和水闸；水务官员读取水位杆；疏浚人员清除弯道和浅水道处的淤泥；追踪器修复拖道和绳柱；护卫队巡逻仓库，防止土匪、叛乱或转移粮食。当上苑被控制、赞助商支付维护费用、最终建筑和辅助办公室保持活跃、水路开放、当地骚乱或腐败可控时，进展就会取得进展。它因占领、破产、严重动乱、路线封锁、洪水破坏、仓库被毁或无法供应粮食而暂停。随着当地高度繁荣、原材料产量强劲、行政稳定、腐败程度低、财政状况良好、贸易路线开放以及人口或劳动力较多，经济加速发展。如果战争遥远，则可能会以增加护航成本的方式继续取得进展；如果战争威胁到航线，船队应该等待，否则就会失去货运进度。每个月的滴答声也应该刷新资本到达的叙述：与检查员一起发送的命令、从仓库返回的收据以及证明法院可以知道其谷物在哪里的路线分类帐。
    completion_logic: >-
      完成要求对粮食进行评估和装载、驳船登记、检查船闸和浅水区、密封仓库、指派护送人员以及中央运河办公室或资本供应官僚机构确认的车队收据。上原仍然必须受到控制，最终的运河建设和辅助网络必须存在，国家不能破产，路线必须足够开放，以使最终的车队具有可信度。最后的场景始于上原或江南交通区的一个运河仓库。官员们大声朗读粮食登记册；粮仓封条完好无损；运河官员提供锁钥匙和水棒；船夫和纤夫带着他们的护航旗帜；护送人员登上或沿着纤道行进；第一艘驳船驶入运河，同时职员向首都发送匹配的急件。确认收到后，法院宣布运河办公室现已成为该州正常指挥结构的一部分。通过使遥远的收获、散装材料、官员和订单通过受管理的水走廊而不是通过不确定的当地讨价还价来转移，这一奇迹成为国家能力。
    failure_or_timeout_logic: >-
      辅助网络不应在普通延迟下到期，但当路线不可信时，进展应暂停。如果主办方失去上苑、最后的大运河建筑消失、附属机构被拆除、国家破产或运河遗址被占领，它就应该取消或失败。严重的洪水破坏、淤塞或堵塞的水道、仓库火灾、运输工人反抗或路线隔离都会导致进度暂停，并可能因货物腐烂、驳船散落和必须重新签发封条而导致装载谷物或车队柜台腐烂。如果占领后恢复场地，疏浚和修船进度可部分保留，但粮食评估、仓库封印和押运任务应重新进行。只有当战争威胁到路线或耗尽国库时才应该中断；遥远的冲突应该增加护送成本，而不是消除已经认证的工作。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对上原的控制，最终独特的运河建筑存在，没有破产，没有占领或无效围攻，没有活跃的重复仪式，可控的当地骚乱，以及足够的金库或收入用于运河维护。添加对可用水路/运输路线、足够的当地繁荣或粮食/原材料产量、未受破坏的仓库、可容忍的腐败以及没有敌对封锁或路线隔离（如果可以检测到）的主题检查。
      start_effect_script: >-
        创建或激活辅助运河办公室网络，将其绑定到赞助商和上元，初始化粮食评估计数器，驳船登记，粮仓密封，船闸检查，疏浚，拖道修复，护送任务，检查点审计和资本接收，应用临时维护，并存储资本范围、原始产出、金库、腐败、繁荣、路线访问和安全的初始国家/地方基线。
      snapshot_effect_script: >-
        每次勾选刷新赞助商和站点状态：距资本传播或行政范围代理的距离、原材料输出、金库/收入、稳定性、腐败、贸易/生产收入、粮食/供应储备、战争状态、上原占领、动乱、破坏、当地繁荣、当地生产、水路通达、运输安全、最终建筑存在和辅助网络存在。保留扩展和失败决策的启动基线。
      progress_effect_script: >-
        每月进行配额评估、装载、驳船登记、船闸和水闸检查、疏浚、拖道修复、粮仓密封、护航巡逻、检查站审核和调度收据等高级子柜台。因破产、占领、严重动乱、路线封锁、洪水破坏、仓库损失、腐败危机或粮食短缺而暂停或衰退。加速繁荣、强劲的原材料产出、开放的路线、低腐败、稳定的权威、充足的劳动力和有偿维护。
      completion_trigger_script: 需要必要的车队和运河办公室柜台或总进度阈值；上元控股；最终建筑和辅助网络已存在；没有破产；无职业；航线开通；骚乱可控；
      completion_effect_script: >-
        取消临时车队维护，将辅助运河-办公网络认证为持久站点内存，应用永久国家修改器保留资本距离传播速度和全球原材料输出，授予一次性供应/繁荣/国库奖励，清除瞬态进度变量，并保留持久旗帜以供显示或冷却。
    intended_rewards:
      permanent_country_modifier: >-
        保留global_distance_from_capital_speed_propagation 作为在首都和遥远省份之间移动官员、收据、调度和粮食登记的运河办事处的行政效果。保留global_raw_material_output作为粮食、木材、盐、纤维、石材和其他原材料的可靠散装运输的生产效果。任何强化都应与后勤和管理挂钩，而不是一般财富。
      one_time_reward: 从成功的第一支舰队中获得一次性供应、财政、当地繁荣或稳定奖励。如果该国遭受短缺但保持路线畅通，则将部分奖励用于恢复粮食/供应；
      local_building_reward: >-
        上元应该保留经过认证的运河办公室的记忆：密封的粮仓、登记的驳船、修复的拖道、校准的船闸、水位标杆、护航营房和路线台账。稍后的实施可以将这一点表达为当地产量、供应限制、减少运输中断造成的破坏、更快的繁荣增长或沿运河更强的资本整合。
    notes: >-
      源模式是直接的，但选择auxiliary_building是因为大运河的历史功能更多地依赖于永久性维护办公室，而不是一次仪式航行。每月就足够了：设计的动作是检查、疏浚、装载、护送和登记货物。实施过程中应避免要求每个历史运河段的精确地图，除非此类数据已经存在；使用上原控制、路线安全、水道通行和当地繁荣作为实际指标。奖励必须停留在行政范围和原材料产出上，以粮食贡品作为连接两者的可见机制。
- id: 127
  key: unique_inca_royal_road
  base_key: imperial_post_road_network
  location: picchu
  source_ritual_key: relay_message
  status: designed
  ritual_design_zh:
    title: 四季度 Chasqui 中继
    mode: auxiliary_building
    duration: >-
      辅助建筑模式优于源立即模式，因为仅当道路有永久支持机构时，单个中继消息才有意义：tambos、qollqa 仓库、chasqui 站、桥梁守护者社区、道路劳动义务和通行证管理员。主动认证应每月十二到十八次，代表在干燥和潮湿条件下的完整山地维护周期，而不是沿着已经完美的路线进行一次运行。
    listeners:
    - monthly
    - pre_winning_war
    historical_flavor: >-
      四季度的查斯奎中继属于印加皇家道路网，因为卡帕克·南让帝国权力通过地形移动，否则它会分裂。参与者包括萨帕印加的官员、基普记录员、查斯基接力赛跑者、库拉卡当地领袖、mit'a劳工、织桥社区、仓库管理员、美洲驼商队管理员、道路测量员、负责通行的士兵以及标记危险过境点的牧师或当地仪式专家。场景包括比丘的山道、铺砌的石阶、挡土墙、索桥、休息和接力的坦博、qollqa
      仓库、露台、高山口、峡谷和指向帝国四个苏尤的路标。这些物品包括基普绳索、跑步者手杖、贝壳或喇叭信号、编织桥缆、玉米和干土豆、美洲驼负载、石头铺路工具、凉鞋、高空跑步者用的古柯包和密封的仓库计数。这种象征意义既实用又具有帝国意义：一条用绳子打结的信息离开统治者的手，穿过受过高空奔跑训练的身体，穿过有义务的社区更新的桥梁，停留在国家储备的坦博中，在当地距离成为政治独立之前到达山区庄园或军队。源奖励直接跟随。
      army_movement_speed 是已修复的道路、桥梁和补给站的军事面貌； global_distance_from_capital_speed_propagation 是 Chasqui
      中继和 quipu 寄存器的管理界面，用于传送整个安第斯山脉的命令、贡品计数和警告。
    confirmation_logic: >-
      赞助商必须拥有或控制比丘，最后的皇家道路奇迹建筑必须存在，国家不能破产，路口不能被占领、被围困或严重的当地混乱。仪式需要足够的国家权威、劳动力和食物/供应储备来维持山路和坦博；如果实施可以检测当地繁荣、人力/劳动力、供应商店、地形通道或路线安全，则应使用这些。当地社区的严重叛乱、山区道路被毁、桥梁网络被毁，或者赞助商首都和比丘之间的通道中断，这些都会阻碍确认。战争不应自动禁止这种仪式，因为道路通常是在战役压力下获得认证的，但如果敌人占领或路线中断阻止跑步者和劳工人员移动，则启动触发器应该失败。
    start_logic: >-
      启动效果记录了主办国、作为仪式场地的比丘、最终的道路建设以及辅助中继路网。它概括了与奖励相关的国家价值观：当前的军队移动速度或移动代理、距资本传播的距离或行政范围代理、人力/劳动力储备、财政/收入、稳定性或统治者权威、战争状态、供应能力，以及可能的合法性或臣民忠诚度（如果有）。它快照了当地的路线状况：占领、动乱、繁荣、破坏、山区通道、仓库容量、桥梁状况（如果有代表）、当地人口以及通往邻近地区的道路是否安全。它为道路测量、铺路和楼梯维修、挡土墙维修、绳桥更新、tambo
      人员配备、qollqa 备货、chasqui 名册培训、quipu 调度测试、美洲驼负载调度和通行证安全创建计数器。临时维护应包括 mit'a 劳动日、qollqas 中储存的食物、桥梁纤维收集、跑步者供给以及分配给困难通道的警卫。
    progress_logic: >-
      每月进度应为具体道路工作。测量员沿着路线行走，标记出被冲刷的路面、倒塌的挡土墙以及对于装载的美洲驼来说太危险的楼梯部分。劳工人员重置石头、清理山体滑坡、修复排水系统并加固高处道路。桥梁维护社区扭转新的草缆，测试绳桥，并安排下一次更新。坦博的管家负责修理庇护所、分配水和床上用品，并为
      qollqas 储备玉米、chuño、纺织品和备用凉鞋。 Quipu 守护者准备标准消息； Chasqui 跑步者以已知的时间间隔练习短距离交接；美洲驼处理员测试供应负载在休息前可以移动多远。当比丘被控制、赞助商支付维护费、仓库保持供应、骚乱可控、道路或桥梁可以通行时，进度就会前进。它因占领、破产、严重叛乱、山体滑坡/洪水破坏、空仓库、桥梁故障或路线隔离而暂停。它因高权威、充足的供应、强大的当地人口/劳动力、良好的繁荣、低破坏性和当前的军事准备而加速。仅当赞助商在一场运动中接近胜利时，pre_winning_war
      听众才应添加证据进展，其中快速山地运动、补给或调度可能很重要。叙述是指挥官收到命令，集中通过通道，或在敌人做出反应之前保护一座桥梁。它不应该由无关的海外或遥远的战争引发。
    completion_logic: >-
      完成要求中继道路计数器证明该路线已经修复、架桥、库存、配备人员、看守和测试。比丘仍然必须被控制，最终的建筑和辅助网络必须存在，国家不能破产，任何重大叛乱或占领都不能中断最后的运行。最后的场景以黎明时向第一个
      Chasqui 传递的 quipu 消息和口头命令开始。信息从一个车站传递到另一个车站：穿过石阶，越过一座翻新的索桥，穿过新跑步者等待的坦博，经过库尔卡仓库，那里的乘务员展示密封的食物储备，沿着一个戒备森严的通道，士兵们在那里展示军队可以走同样的路线。在比丘，最后的跑步者在当地领导人和仓库管理员面前向官员展示了基普。他们将到达时间与路线登记册进行比较，并宣布四季度的道路已获得认证。这一奇迹变成了国家能力，因为命令、军队、贡品记录和物资现在可以通过维护的山区基础设施移动，而不是依赖临时的本地路径。
    failure_or_timeout_logic: >-
      辅助网络不应该有正常的超时，但当山区基础设施被忽视时，进展可能会衰退。如果赞助商失去比丘、最后的皇家道路建筑消失、辅助中继网络被移除、国家仍然破产或路头被占领，仪式就会失败或取消。严重的叛乱、路线隔离、索桥被毁、qollqas空空如也，或者严重的局部破坏都会导致进度暂停，并可能减少桥梁、仓库和跑者计数器，因为易腐烂的补给品被消耗，训练有素的人员分散。战争只有在威胁道路或证明这一点时才有意义：遥远的冲突不应停止修复，但通过道路区域的活动可以通过
      pre_winning_war 验证网络，或者在通行证丢失时损坏网络。从占领中恢复后，铺路进度可能会保留，但名册、桥梁更新和仓库密封应需要重新检查。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对比丘的控制、最终独特的道路建设存在、没有破产、没有占领或无效围攻、没有活跃的重复仪式、可控的当地骚乱以及足够的劳动力/供应能力来维护道路。添加对路线通行、当地繁荣或人口、未受破坏的山路、可用的仓库/供应代理以及无严重叛乱或首都路线隔离的专题检查。
      start_effect_script: >-
        创建或激活辅助中继道路网络，将其绑定到赞助商和比丘，初始化道路测量计数器，铺路修复，挡土墙，绳桥更新，tambo人员配备，qollqa库存，chasqui名册培训，quipu调度测试，骆驼负载调度，并通过安全，应用临时劳动力/供应维护，以及存储移动，传播，权威，供应和当地路线基线。
      snapshot_effect_script: >-
        刷新当前赞助商和站点状态：军队移动速度，行政传播或资本到达代理，国库/收入，人力或劳动力储备，稳定性/权威，供应/粮食储备，战争状态，比丘占领，动乱，破坏，繁荣，当地人口，路线访问，桥梁/仓库条件代理、最终建筑物存在和辅助网络存在。保留扩展和故障比较的开始基线。
      progress_effect_script: >-
        每月进行路线勘察、铺路、排水、挡土墙、索桥、tambo 维修、qollqa 备养、跑步者训练、quipu 交接测试、骆驼补给测试和通行安检等高级子计数器。由于破产、占领、严重叛乱、路线孤立、严重破坏、桥梁故障、补给空缺或无偿维护而暂停或衰退。加速实现强大的权威、充足的劳动力、高繁荣、充足的仓库、低破坏和军事准备。在pre_winning_war上，仅在道路网络看似有助于移动、补给或指挥的战争中添加验证进度。
      completion_trigger_script: >-
        要求总体进度或所有必要的计数器，比丘控制，最终建筑和辅助网络存在，没有破产，没有占领，可管理的骚乱，可通行的路线，提供qollqas，并且没有未解决的叛乱或阻碍最终查斯基运行的路线隔离。
      completion_effect_script: >-
        删除临时维护，证明辅助道路中继网络持久，应用永久国家修改器保持军队移动速度和距首都传播速度的距离，授予一次性补给/人力/声望或权威奖励，在比丘添加当地路站记忆，清除活动进度变量，并保留持久的完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留army_movement_speed作为铺砌道路的军事价值，通过安全，绳桥，坦博， qollqa 供应和 llama-load 调度。保留 global_distance_from_capital_speed_propagation
        作为 chasqui runners 和 quipu handoffs 的管理价值，将命令、账户和警告从中心传送到安第斯山脉。奖励应保持后勤和帝国的性质，而不是一般的纪律奖金。
      one_time_reward: >-
        从库存的 qollqas 和训练有素的劳工名册中授予一次性供应或人力准备奖励，再加上成功接力的声望或合法性。如果pre_winning_war验证有所贡献，则将部分奖励用于减少战役压力或军事传统，代表经过验证的道路网络。
      local_building_reward: >-
        比丘应该保留经过认证的chasqui车站、更新的索桥、修复的石阶、填充的仓库、通行证警卫和路线登记册的记忆。稍后的实施可以将其表达为当地移动速度、供应限制、减少破坏恢复时间、改善道路交通的繁荣或通过山地更快地加固。
    notes: >-
      源模式是直接的，但auxiliary_building更好地捕获了道路的维护机构。每月涵盖维修、备货、继电器测试等日常工作； pre_winning_war 仅作为使用该网络的活动几近成功的证据。如果数据模型仅公开比丘和一般路线安全，那么实施应避免使每场战争都具有相关性，并且不应要求精确的历史印加地图覆盖范围。永久奖励必须集中于行动和中央指挥范围。
- id: 128
  key: unique_roman_aqueducts
  base_key: hydraulic_workshop
  location: rome
  source_ritual_key: aqueduct_opening
  status: designed
  ritual_design_zh:
    title: Curator Aquarum Flow Inspection
    mode: timed
    duration: >-
      保留了定时模式，因为渡槽开放是技术审核的最后行为，而不是永久的独立机构。每月十二到十八次刻度应代表对从泉头和沉淀池到拱门、有盖渠道、分配池、管道、喷泉、浴室、磨坊和车间的全面检查。玩家应该将仪式体验为工程和城市卫生循环，而不是即时的水祝福。
    listeners:
    - monthly
    historical_flavor: >-
      馆长水族馆流量检查属于罗马，因为罗马渡槽将景观工程变成了城市繁荣。参与者包括水族馆馆长和他的抄写员、使用测量杆和水平仪的测量员、石匠、水利工程师、清理渠道的奴隶或劳工、执行水权的地方法官、浴室经营者、喷泉管理员、磨坊主、漂白者、陶工、园丁、关心城市健康的医生以及依赖公共用水的社区代表。这些场景包括城外的泉水集水区、沉淀池、地下水道、横跨山谷的拱廊、检查竖井、分水的城堡分区、铅或陶瓷管道、公共喷泉、浴室、洗衣房、花园区和需要可预测水流的车间。实物为青铜测水嘴、水权片、石灰砂浆、防水水泥、铅瘘、陶瓷管、闸板、清洁钩、流量帐蜡片、公共水池钥匙等。其象征意义具有强烈的公民性：国家证明它可以在城墙外捕获干净的水，以精确的梯度输送水，防止其被盗窃，并以可见的方式将其分配给公民和生产者。源奖励自然随之而来。
      global_monthly_prosperity反映健康、浴室、喷泉、花园和减少日常水摩擦； global_production_efficiency 反映漂洗工、磨坊、陶工、制革商、食品加工商和建筑工人在水可靠且合法分配的情况下工作得更好。
    confirmation_logic: >-
      赞助商必须拥有或控制罗马，最终的罗马渡槽奇迹建筑必须存在，国家不能破产，供水系统不能被占领、围困或遭受严重的当地动乱。罗马应该有足够的国库或收入来支付测量员、泥瓦匠、管道工人和清洁人员的工资。该地点不应被破坏到无法进入通道或泉头的程度；如果实施能够检测到水源控制、干旱、洪水破坏、疾病、卫生压力、当地繁荣或人口压力，则应按主题使用这些信号。战争不应自动阻止检查，但切断渡槽的围困或占领必须这样做，因为历史上围困者会攻击供水。非法水龙头、腐败或私人偷水不应默认阻止确认，因为拆除它们是仪式的一部分，但妨碍执行的极端混乱应该阻止它。
    start_logic: >-
      启动效果记录了主办国、罗马作为仪式地点、最终的渡槽建设情况以及巡检周期。它快照了国家奖励基线：全球每月繁荣、生产效率、财政/收入、稳定性、行政效率、腐败、城市人口或繁荣指标，以及任何可用的疾病、卫生或破坏信号。它反映了罗马当地的状况：占领、动乱、繁荣、破坏、供水、人口压力、当地生产、车间密度或建筑价值，以及公共喷泉/浴室是否可以重新开放。它为水源调查、坡度测量、渠道清洁、拱门修复、沉淀池清理、非法水龙头拆除、管道登记、分配水箱校准、公共喷泉重新开放、浴室和车间连接以及最终地方法官认证创建计数器。临时维护包括有酬劳力、石头和砂浆、更换管道、对非法水龙头的执法，以及在街道或渠道开放维修时的临时中断。
    progress_logic: >-
      每月的进度应随水流而定。首先，测量员检查泉水集水区并记录水源是否清洁、受保护且高度是否足以承受重力流。然后，他们使用测量工具沿着路线行走，将坡度标记与实际流量进行比较，并识别下垂、泄漏和倒塌的盖子。工人进入干燥或改道部分刮除矿藏、清除沉淀池中的淤泥并修补防水砂浆。泥瓦匠更换破裂的拱门并加固桥墩；管道工人将盖印的瘘管与官方登记处进行比较；治安法官会标记非法的私人水龙头，并对它们征税、调整大小或拆除。在城市末端，官员们测试了城堡区、公共喷泉、浴室、磨坊、洗衣房、花园和车间，记录哪些渠道获得稳定的流量。当罗马被控制、维护费用得到支付、最终的建筑得以保留、骚乱得到控制、水路没有被切断时，就会取得进展。它因围困、占领、破产、严重骚乱、重大水灾或旱灾、或水源渠道无法进入而暂停。它凭借高行政能力、强大的财政、低腐败、高度的当地繁荣、熟练的生产基础以及造成政治紧迫性的现有卫生压力而加速。腐败应该通过偷水和虚假管道尺寸来减缓进展，但成功的审计月数可以减少这种处罚。
    completion_logic: >-
      完成要求水源、渠道、拱门、管道、分配和公共使用计数器已达到其阈值；罗马仍受控制；最终的渡槽建筑已经存在；国家没有破产；没有任何围困或严重骚乱中断开放。最后的场景是土木工程演示。地方法官、水管理员、测量员、行会代表、浴室经营者和邻里目击者聚集在主配水池前。管理员读取流量寄存器并命令打开水闸。水通过校准通道进入喷泉、浴室和车间供水；测定人员或工作人员将测得的流量与药片进行比较；泥瓦匠展示修复后的石制品；官员对非法窃听行为进行了处罚。公共水池在人群面前注满水，选定的工作坊或浴室在密封下重新开放。这一奇迹成为国家能力，因为国家已经证明它可以规范基础设施，改善健康、城市日常、手工艺生产和对公民秩序的信心。
    failure_or_timeout_logic: >-
      这种仪式可以在没有严格超时的情况下暂停，因为工程检查可能会等待季节，但如果通道仍然被忽视，它就会衰退。如果赞助商失去了罗马，最后的渡槽建筑消失，国家仍然破产，城市被占领，或者围困切断了供水，那么它就会失败或取消。沿途的严重骚乱、水源流失、破坏性洪水、极端干旱或破坏都会导致进度暂停，并可能减少通道清洁、喷泉或车间连接计数器。如果罗马在占领后收复，则应重新进行路线勘察和水权登记，因为围攻者或当地人可能会破坏管道并更改水龙头。轻微的腐败或非法窃听应该减缓而不是取消仪式，除非它们变得无法执行。远离渡槽的战争应该只会影响财政和劳动力可用性。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对罗马的控制，最终独特的渡槽建筑存在，没有破产，没有占领或无效的围攻，没有活跃的重复仪式，可控的当地骚乱，以及用于工程维护的足够的财政/收入。添加对无障碍水路、未受破坏的水源/渠道、可容忍的腐败、当地人口或生产需求以及不存在切断供水的围困或封锁条件的专题检查。
      start_effect_script: >-
        将仪式与赞助商和罗马绑定，初始化水源调查、坡度测量、渠道清洁、拱门修复、沉降池清理、非法水龙头拆除、管道登记、分配校准、喷泉重新开放、浴室/车间连接和最终认证的计数器，应用临时维护和存储繁荣、生产效率、财政、腐败、卫生、动乱和破坏的国家和地方基准。
      snapshot_effect_script: >-
        刷新当前赞助商和站点值：全球每月繁荣、全球生产效率、财政/收入、稳定性、行政效率、腐败、疾病或卫生代理、罗马占领、动乱、繁荣、破坏、供水、人口压力、当地生产、最终建筑存在以及是否被围困或路线切断条件申请。保留奖励缩放和失败决策的开始基线。
      progress_effect_script: >-
        在每月的刻度上，提前子计数器进行源头检查、路线坡度调查、渠道清淤、沉淀池清洁、拱门和砂浆修复、管道注册审计、非法水龙头执法、分配罐校准、喷泉重新开放和浴室/车间重新连接。由于破产、围困、占领、严重动乱、路线破坏、源头损失、极端洪水/干旱或无偿维护而暂停或衰退。加速实现强大的财政、低腐败、行政能力、地方繁荣和生产需求。
      completion_trigger_script: >-
        需要必要的水力计数器或总进度阈值、罗马控制、最终建筑存在、无破产、无占领或围攻截水、可控制的骚乱、可用的水源、公共喷泉的工作分配以及至少一种生产性用途，如浴室、磨坊、洗衣房、花园或车间。
      completion_effect_script: >-
        移除临时设施维护，应用永久国家修改器维护全球每月繁荣和全球生产效率，授予一次性当地繁荣、健康/卫生或生产恢复奖励，为经过认证的渡槽流量和水权登记添加本地内存，清除瞬时进度变量，并保留持久的完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留global_monthly_prosperity作为清洁公共用水、浴室、喷泉、花园、卫生设施和减少日常劳动力的持久公民效应。保留 global_production_efficiency
        作为工厂、漂洗厂、陶工、制革厂、建筑商和食品加工商可靠液压供应的经济效果。修改器应该感觉像是受监管的基础设施，而不是宗教或威望仪式。
      one_time_reward: >-
        给予罗马一次当地繁荣、生产恢复、减少骚乱或疾病压力（如果支持的话），或许还可以通过注册非法水龙头和水权获得一小笔财政收益。如果城市开始遭到破坏或不健康，但路线仍然可以恢复，请将奖励分配给当地恢复而不是原始财富。
      local_building_reward: >-
        罗马应该保留对调查的泉水、清理的水道、修复的拱门、校准的分配水箱、注册的管道、重新开放的喷泉以及经过认证的浴室/车间连接的记忆。后来的实施可以表现为当地繁荣增长、生产效率、抗病能力、减少缺水造成的骚乱或更快的破坏恢复。
    notes: >-
      源仪式是即时的，但选择定时模式，因为在检查、清洁、测量和执行之后，开口仅具有机械意义。每月就够了；除非未来存在攻城水系统，否则统治者的死亡和战争钩子会分散注意力。实施应避免声称帝国的每条渡槽实际上都在罗马；罗马站点建立了一个可复制的国家水务管理机构。奖励处理必须保持以繁荣和生产为中心，以公共喷泉和车间作为可见的联系。
- id: 129
  key: unique_suez_ancient_canal
  base_key: large_canal_system
  location: suez
  source_ritual_key: canal_opening
  status: designed
  ritual_design_zh:
    title: 红海运河开通护航队
    mode: timed
    duration: >-
      定时模式是合适的，因为该仪式是航行的证明：国家必须证明浅水护航队可以在尼罗河相连的水域、沙漠运河切口和红海通道之间移动，而不会因淤泥、干旱、收费混乱或敌对干扰而迷路。每月十二到十八次的检查应涵盖测量、疏浚、井标记、港口准备、收费登记、飞行员培训和最终护航。长期维护网络可以在完成后留下作为站点记忆，而不需要在这里单独的辅助模式。
    listeners:
    - monthly
    historical_flavor: >-
      红海运河开通车队属于古老的苏伊士运河传统，因为该项目始终既是工程又是帝国地理：统治者试图使尼罗河税收、沙漠劳力和红海航运符合一条走廊。参与者包括埃及或波斯风格的王室官员、运河测量员、抄写员、疏浚人员、强迫或有偿劳动的帮派、井管理员、沙漠守卫、熟悉浅水的领航员、红海船长、尼罗河船夫、海关收税员、运送谷物、亚麻布、焚香、金属和东方货物的商人，以及目睹界碑和公告的牧师或宫廷传令官。这些地方包括苏伊士附近的运河盆地、图米拉特干河或类似的沙漠路线、尼罗河沿岸的粮食码头、红海锚地、堤岸切口、水闸或水控制点、收费站、商队井以及给浅船重新填缝的临时修理场。这些物品包括测量绳、水位杆、挖泥篮、泥砖、界碑、收费碑、货封、引杆、帆布、绳索、双耳瓶以及从河流到海上携带的官方信件。其象征意义在于，一个国家可以通过将河流和海洋之间的危险缺口变成受管制的通道来延长其商业臂膀。
      trade_range 上升是因为商人和官员可以到达红海赛道，而无需将沙漠视为硬停； trade_income 上涨是因为通行费、转运、车队保护和可预测的海关记录吸引了更多的货物通过该路线。
    confirmation_logic: >-
      赞助商必须拥有或控制苏伊士运河，最后的古代运河奇迹建筑必须存在，国家不能破产，场地不能被占领、围困或遭受严重的当地骚乱。沙漠和海洋方法都应该可用：如果实施可以检测港口可用性、封锁、路线隔离、敌对海军控制、被毁坏的运河岸、干旱或低水位条件或不安全的商队井，那么这些条件应该得到确认。赞助商应该有足够的资金或收入来支付测量员、挖泥船、警卫、领航员和收费员的费用，再加上一定的海上或贸易能力，以使护航队有意义。严重的商人反抗、海盗压力或无法确保红海入口的安全都会阻碍确认。只有在运河地点和入海口仍处于戒备状态的情况下，才应允许战争；封锁苏伊士运河或敌人占领运河流域必须阻止其开始。
    start_logic: >-
      启动效果记录了赞助国、苏伊士作为仪式地点、最终的运河建设以及主动通航证明周期。它快照了与奖励相关的国家价值观：当前trade_range、trade_income、国库/收入、海军范围或水手/船舶能力（如果有）、商人满意度、稳定性或权威、腐败以及战争/封锁状态。它反映了当地和路线状况：占领、动乱、破坏、港口通道、进海安全、水路通道、沙漠井安全、当地贸易价值以及路线是否实际可通行。它初始化了沙漠调查、航道疏浚、河岸加固、水位管理、井站标记、引航员名册、收费站登记、货物舱单密封、车队护航和最终海运收据等柜台。临时维护费用应包括劳动力口粮、疏浚工具、警卫、引航员工资、收费站设置、船舶修理以及商人等待官方车队期间的货物延误。
    progress_logic: >-
      每月进度遵循从河流到海洋的路线。测量员测量坡度并标记运河河床淤积、干燥或破裂成浅水池的位置。疏浚人员清除泥土和沙子，用砖块或填土加固河岸，并清理着陆点。水务官员将季节性水位与浅吃水船只所需的深度进行比较。沙漠守卫在水井和巡逻站上做了标记，以便工人、飞行员和商人可以在不丢失动物或货物的情况下穿越。造船工人修补船只；飞行员测试杆和转弯；海关文员准备货物清单和收费板；商人为第一批船队登记谷物、亚麻布、香、铜和其他货物。当苏伊士运河得到控制、维护费用得到支付、港口和运河盆地不被占领、出海通道不被封锁、当地动乱可控时，进展就会取得进展。它因破产、占领、封锁、严重骚乱、路线破坏、不安全的水井、低水位或洪水破坏、导致护送无法进行的海盗行为或伪造收费登记册的腐败而暂停。它随着强劲的贸易收入、可用的港口、满意的商人、充足的海军或护航能力、低腐败、稳定的权威和良好的当地繁荣而加速。即使国家富裕，在恶劣的沙漠或受损的河岸条件下，该过程也会较慢，因为物理导航仍然是核心证明。
    completion_logic: >-
      完成需要测量、疏浚、银行、井、引航员、收费站、货物和护航柜台达到要求的门槛；苏伊士运河仍受控制；最终的建筑存在；保荐人没有破产；入海口是开放的；运河盆地对于官方目击者来说足够平静。最后的场景从运河盆地开始。皇家官员阅读边界石碑或标记河岸旁边的路线登记册；测量员出示水位杆；收费员对货物清单进行封印；飞行员登上浅水机队；警卫人员在井和着陆点就位；商人展示来自尼罗河和红海环线的样品商品。第一批船只穿过清理干净的航道，到达红海锚地，在那里密封收据并发回法院。这一奇迹变成了国家能力，因为商人现在信任受保护的转运和航行走廊，而国家可以对旧河流地平线以外的交通征税、护送和做广告。
    failure_or_timeout_logic: >-
      仪式可以在没有严格超时的情况下暂停，但如果延迟太久，运河就会因沙子和淤泥返回而遭受腐烂。如果赞助商失去苏伊士运河、最终的运河建设消失、国家仍然破产、场地被占领，或者红海通道被持续封锁，那么项目就会失败或取消。严重的当地骚乱、航线破坏、河岸倒塌、航道干涸或被淹没、不安全的水井或海盗活动都可能会导致进度暂停，并可能减少疏浚、货物或引航柜台。如果苏伊士运河在占领后恢复，则必须重新进行勘察和收费设置；如果基础设施幸存下来，一些银行加固可能会保留。远方的战争只会通过成本减缓进展，但关闭出海口或转移护航的战争应该停止护航队，直到恢复安全。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对苏伊士运河的控制，最终独特的运河建筑存在，没有破产，没有占领或无效的围攻，没有活跃的重复仪式，可控的当地骚乱，以及足够的金库/收入用于疏浚和护航费用。添加对可用港口或海上通道、无封锁、安全的沙漠路线或水井、未被破坏的运河岸、商业/贸易能力以及足够的护航/海军范围（如果有）的专题检查。
      start_effect_script: >-
        将仪式与赞助商和苏伊士运河绑定，初始化沙漠调查、疏浚、河岸加固、水位管理、井标记、飞行员名册、通行费登记、货物清单、车队护航和最终收据的柜台，申请临时维护，并存储贸易范围、贸易收入、港口准入、航线安全、海军能力、腐败和当地繁荣的基线。
      snapshot_effect_script: >-
        刷新当前赞助商和站点值：贸易范围、贸易收入、财政/收入、商人满意度、海军或护航能力、稳定/权威、腐败、战争/封锁状态、苏伊士占领、动乱、破坏、港口准入、海上安全、水道准入、油井安全、当地贸易价值和最终建筑存在。保留用于扩展和识别路线崩溃的起始基线。
      progress_effect_script: >-
        在每月的刻度上，提前进行测量、疏浚、河岸修复、水位检查、井和站标记、飞行员培训、船舶准备、收费站设置、舱单密封、护航分配和测试导航的子计数器。由于破产、占领、封锁、严重动乱、严重破坏、不安全的水井、低水位/洪水破坏、海盗、腐败危机或无偿维护而暂停或衰退。加速实现强大的贸易、开放的港口、商业合作、护航能力、低腐败和稳定的权威。
      completion_trigger_script: >-
        要求必要的导航计数器或总进度阈值、苏伊士控制、最终建筑存在、没有破产、没有占领、可控的骚乱、畅通的红海通道、可通行的运河路线、登记的货物以及为最终船队指派的引航员/护航。
      completion_effect_script: >-
        移除临时船队和疏浚维护，应用永久国家修改器保留贸易范围和贸易收入，授予一次性贸易/财政/海军后勤或当地繁荣奖励，为开放的运河路线、收费站、水井和飞行员登记添加本地记忆，清除瞬时进度变量，并保留持久的完成或冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留trade_range作为通过受管制通道将尼罗河相关物流与红海航运连接起来的战略效果。保留 trade_income 作为通行费、舱单、车队保护和可靠转运的财政影响。奖励不应成为通用的海军力量；船舶很重要，因为它们证明了运河航线并从中获利。
      one_time_reward: >-
        授予一次性贸易收入、通行费登记的财政、苏伊士的当地繁荣、商人满意度，以及可能的水手或海军供应（如果实施有这样的资源）。如果通过强大的护航克服了封锁风险，则将一小部分用于海军后勤或从成功开放的车队中获得声望。
      local_building_reward: >-
        苏伊士应该记住畅通的航道、标记的水井、加固的堤岸、收费板、飞行员名册、货物封条办公室和红海收据档案。稍后的实施可以将其表达为当地贸易价值、港口容量、现场贸易范围、减少封锁恢复时间或转运带来的更快的繁荣增长。
    notes: >-
      来源仪式是直接的，但定时模式为运河开放提供了足够的物理和商业实质：勘察、疏浚、水位、水井、通行费、引航员和车队安全。每月一次就足够了，因为危险是环境和后勤方面的，而不是与统治者死亡或战斗有关。实施不应要求确切的历史王朝所有权；它应该需要对苏伊士运河的实际控制和一条开放的航线。奖励必须集中在贸易范围和贸易收入上，红海车队就是两者的证明。
- id: 130
  key: unique_kremlin
  base_key: star_fortress_city
  location: moscow
  source_ritual_key: tsar_coronation
  status: designed
  ritual_design_zh:
    title: 克里姆林宫墙后的安息加冕
    mode: timed
    duration: >-
      定时模式优于源立即模式，因为克里姆林宫加冕是一系列认可：准备王权、安排神职人员制裁、贵族和服务贵族宣誓、支付驻军工资和接受检阅，以及使城市堡垒明显安全。六到十二个月的正常持续时间是合适的。这一仪式可以在顺利的继承或经过验证的竞选期间加速，但它永远不应该是一键式的合法性授予。
    listeners:
    - monthly
    - ruler_death
    - pre_winning_war
    historical_flavor: >-
      克里姆林宫墙后的安眠加冕仪式属于莫斯科，因为克里姆林宫将神圣的王权、王朝住所、档案馆、国库和军事堡垒结合在一个封闭的空间中。参加者包括新沙皇或在位统治者、都主教或宗主教和大教堂神职人员、博雅尔家族、杜马官员、服役贵族、斯特雷齐或其他驻军士兵、克里姆林宫军械库的军械师、敲钟人、宫廷抄写员、获准见证仪式的外国使节以及聚集在城门外的市民。这些地方是安息大教堂、大教堂广场、宫殿房间、军械库、国库、红砖墙和塔楼、门教堂、集合场和通往红场的通道。这些物品是莫诺马赫帽或类似的王冠、十字架、球体、权杖、圣像、加冕长袍、誓言书、服役名册、铃铛、旗帜、盔甲、步枪或长矛、大门钥匙和密封的宪章。其象征意义是统治者的合法性不仅仅是血缘关系。他必须在大教堂里受到祝福，受到大家族的接受，受到要塞的看守，受到军人的服从，并向城市宣告。这准确地解释了奖励的来源。
      monthly_legitimacy 来自一位在莫斯科神圣防御中心加冕的统治者的反复记忆； land_morale_modifier来自宣誓保卫统治者的士兵，统治者的权威得到教堂、城墙、军火库和法院的支持。
    confirmation_logic: >-
      赞助者必须拥有或控制莫斯科，最后的克里姆林宫奇迹建筑必须存在，国家不能破产，克里姆林宫辖区不能被占领、围困或遭受严重的局部骚乱。该国应该有一位正常运转的统治者或公认的继承人、足够的国库或收入来支付卫兵费用和资助仪式，以及足够的军队或驻军以进行有意义的集结。如果实施可以检测首都/法院的可用性、神职人员财产满意度、贵族忠诚、合法性、稳定性、继承危机、当地堡垒/驻军实力或宗教混乱，那么这些应该形成确认。战争不应该自动阻止仪式，因为紧急加冕可以加强防御，但敌人占领莫斯科、拖欠军饷、破产国库或严重到足以使誓言无效的有争议的继承权都应该阻止仪式的开始。
    start_logic: >-
      起始效果记录了赞助国、作为仪式地点的莫斯科、最终的克里姆林宫建筑、现任统治者、继承人或继承国（如果有）以及活跃的加冕周期。它快照了奖励基线：每月合法性、当前合法性、土地士气、稳定性或权威、神职人员支持、贵族/贵族忠诚、军队规模、人力、驻军兵力、国库/收入、战争状态和继承风险。它反映了莫斯科当地的状况：占领、围困、动乱、破坏、要塞状况、当地繁荣、首都/法院的存在，以及大教堂和军械库是否可用。它初始化用于王权检查、大教堂准备、圣像游行、神职人员祝福、博雅尔誓言收集、服务贵族点名、驻军工资、墙壁和大门检查、军械库集合、钟声公告以及特使或城市证人座位的柜台。临时维护费用包括警卫工资、礼仪长袍、施舍或公共分配、大教堂费用、军械问题以及在全国范围内收集宣誓的行政负担。
    progress_logic: >-
      每月的进步应该使统治者获得公众的认可。法庭官员检查金库中的王冠、长袍、权杖和特许状。神职人员准备安息大教堂，确认祝福顺序，并在克里姆林宫教堂中移动圣像。博雅抄写员抄写誓言表格、召集大家族并解决优先权争议，否则这些争议可能会演变成派系侮辱。服务贵族文员审查土地和服务名册；驻军军官缴纳欠款、检查武器并在塔楼和大门上分配哨所。军械师颁发礼仪武器；铃经过测试；先驱者准备城市公告；卫兵负责保护宫殿房间和大教堂之间的路线。当莫斯科被控制、维护费得到支付、大教堂和要塞可以使用、当地的骚乱可以控制、继承权得到充分认可、誓言变得重要时，进步就会取得进展。它因破产、占领、围困、严重动乱、神职人员拒绝、贵族叛乱、无薪驻军危机或有争议的继承而暂停。它以高合法性、强稳定性、忠诚的神职人员和贵族、良好的国库、强大的驻军和活跃的首都地位而加速。
      ruler_death听众应该让仪式变得紧迫：如果继承是有序的，它可以通过将准备工作转变为登基加冕来增加进度；如有争议，应暂停或腐烂誓言柜台。仅当加冕或即将加冕的统治者统治下的军队接近胜利时，pre_winning_war
      听众才应添加证据进展，表明服役誓言和克里姆林宫公告已转化为战场士气。
    completion_logic: >-
      完成需要完成王权、大教堂、誓言、要塞、城墙、军械库和公告台；莫斯科仍受控制；最终的建筑存在；国家没有破产；统治者或继承人得到承认。最后的场景从宫殿房间开始，然后进入大教堂广场。统治者在圣像和钟声的陪伴下走向安息大教堂。神职人员为他祝福并加冕，贵族们根据当地习俗亲吻十字架或誓言书，服役贵族和驻军军官展示卷轴和横幅，军械匠展示来自克里姆林宫商店的武器。大教堂仪式结束后，统治者出现在要塞区内或大门处，同时传令官向莫斯科宣布加冕典礼。塔楼上响起钟声，士兵们以集合礼回应。这一奇迹变成了国家能力，因为克里姆林宫现在储存着合法统治和军事义务的记忆：合法性源于神圣和王朝的认可，而土地士气则源于在堡垒墙下宣誓并由受薪警卫支持的誓言。
    failure_or_timeout_logic: >-
      仪式在正常准备期间不应该有一个严格的暂停，但如果由于危机而推迟宣誓，它应该会衰退。如果赞助者失去莫斯科、克里姆林宫最后一座建筑消失、国家仍然破产、克里姆林宫被占领或遭到决定性围困，或者统治者/继承国加冕无效，则加冕仪式失败或取消。严重的骚乱、贵族叛乱、神职人员拒绝、无偿驻军叛变或大教堂/军械库区域的破坏应该会暂停进度，并可能减少宣誓、守卫和公告计数器。统治者的死亡可以加强或破坏仪式：顺利的继承会融入加冕礼，但有争议的继承至少会重置王权和宣誓工作。远离莫斯科的战争不应阻碍进展，而威胁莫斯科的战争则应暂停进展，直到堡垒安全为止。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对莫斯科的控制、最终独特的克里姆林宫建筑的存在、没有破产、没有占领或无效的围攻、没有活跃的重复仪式、可控的当地骚乱以及是否存在统治者或公认的继承目标。添加对首都/法院准入、神职人员和贵族合作、可用大教堂/军械库、驻军实力、足够的警卫工资国库以及不存在严重继承危机的主题检查。
      start_effect_script: >-
        将仪式与赞助商和莫斯科绑定，存储当前统治者和继承背景，初始化王权计数器，大教堂准备，圣像游行，神职人员祝福，波雅尔誓言，服务名册，驻军工资，墙壁检查，军械库集结，钟声公告和城市/特使见证人，应用临时维护，并存储合法性，士气，财产，军队，金库和当地要塞基线。
      snapshot_effect_script: >-
        刷新赞助商和站点值：每月合法性，当前合法性，土地士气，稳定性/权威，神职人员支持，贵族/贵族忠诚度，军队规模，人力，驻军力量，财政/收入、战争状态、继承状态、莫斯科占领、围困、动乱、破坏、要塞状况、首都/法院可用性、最终建筑存在、大教堂可用性和军械库可用性。保留扩展和失败决策的启动基线。
      progress_effect_script: >-
        在每月的刻度上，提前子柜台进行王权检查、大教堂秩序、圣像游行、誓言收集、服务名录审查、驻军付款、墙/门检查、军械库发行、钟测试和公告准备。因破产、占领、围困、严重动乱、贵族叛乱、神职人员拒绝、无薪部队或有争议的继承而暂停或衰退。加速实现高度合法性、稳定性、忠诚的财产、强大的驻军、良好的财政和资本地位。在
        ruler_death 上，转换为加入进度或根据继承顺序暂停。在pre_winning_war上，仅为相关的陆地战争添加士气证明。
      completion_trigger_script: >-
        需要必要的加冕和集结计数器或总体进展，莫斯科控制，最终建筑存在，没有破产，没有占领/围攻，可控的骚乱，公认的统治者，可用的大教堂和军械库，付费驻军，并且没有未解决的贵族或神职人员拒绝。
      completion_effect_script: >-
        删除临时加冕维护，应用永久国家修改器保留每月合法性和土地士气，授予一次性合法性/稳定性/军事士气或人力准备奖励，添加当地克里姆林宫加冕记忆，清除活跃进度变量，并保留持久的完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留monthly_legitimacy作为在神职人员面前在克里姆林宫神圣王朝中心加冕的统治者的持久效果，博雅尔和城市见证人。保留land_morale_modifier作为服役誓言、付费驻军、军械库展示和要塞公告的军事效果。奖励应保持皇家军事目的，而不是转向贸易或一般声望。
      one_time_reward: >-
        授予一次性合法性、稳定性、贵族/神职人员满意度以及军事准备状态，例如士气、人力恢复或驻军信心。如果pre_winning_war证据有所贡献，则将部分奖励调整为军队传统，或减少新确认的统治者领导下的战役中的厌战感。
      local_building_reward: >-
        莫斯科应该记住穿过克里姆林宫的加冕路线：准备好的王权、大教堂宣誓书、钟声公告、检查的墙壁、受薪警卫、军械库发放记录和服务名册。后来的实施可以将其表达为当地堡垒防御、驻军恢复、继承期间的骚乱减少或更强的首都合法性效果。
    notes: >-
      源仪式是即时的，但选择定时模式是因为加冕必须获得教堂、博雅尔、士兵和城市的认可。包含 ruler_death 是因为继承是这一仪式的自然时刻；包含pre_winning_war只是为了通过相关活动证明土地士气。实施应避免在有争议的继承期间自由完成，并且绝不应从不相关的冲突中获得战争进展。奖励必须保持每月的合法性和士气，而克里姆林宫的堡垒大教堂身份则发挥着作用。
- id: 131
  key: unique_teotihuacan
  base_key: world_monument_group
  location: tenochtitlan
  source_ritual_key: sun_pyramid_fire
  status: designed
  ritual_design_zh:
    title: 太阳金字塔的新火灾
    mode: timed
    duration: >-
      首选定时模式，因为金字塔火灾应该是历法和公民准备的结束，而不是即时的神圣奇观。十二个月的持续时间让设计代表了一个完整的仪式年，包括区域清洁、壁画和寺庙准备、市场和朝圣者聚会、壁炉纪律、天文手表和最后的重新点燃。确切的古代教义应该刻意宽泛，但这个过程可以植根于城市可见的神圣建筑。
    listeners:
    - monthly
    historical_flavor: >-
      太阳金字塔的新火属于特奥蒂瓦坎，因为这座城市通过规划的神圣轴线表达了权力：死亡大道、太阳金字塔、月亮金字塔、Ciudadela、彩绘公寓大院、工艺区、市场空间和按一定规模排列的游行通道，使公共秩序可见。参与者包括寺庙侍者、历法观察者、公寓大院的世系首领、黑曜石工人、壁画画家、香火搬运工、市场管理员、运来玉米和苋菜的农民、来自附属城镇的朝圣者、消防员以及规定谁可以攀登山顶或接收新火焰的国家官员。这些物品包括柯巴香、火盆、捆绑的火把、熄灭的家庭壁炉余烬、黑曜石刀片和镜子、彩绘容器、羽毛横幅、玉米祭品、石灰灰泥、壁画颜料和大道沿线的路线标记。其象征意义在于，城市通过让每个家庭、每个车间、每个参观社区都从一盏公共火焰中汲取灵感，来更新自己的社会秩序。声望来自于沿着纪念轴线聚集人们并使太阳金字塔成为可见的更新中心的能力。
      tolerance_own 源于为国家信仰提供一种共享、有序的仪式，将社区和游客融为一体，而不需要在每个神社进行强制。设计应避免声称精确恢复礼拜仪式；它应该使用建筑、物质文化、城市规划和公共消防象征作为历史基础。
    confirmation_logic: >-
      赞助商必须拥有或控制所列出的地点，最终的特奥蒂瓦坎奇迹建筑必须存在，国家不能破产，神圣区域不能被占领、围困或遭受严重动乱。国家应该能够安全地聚集社区：如果实施能够检测到当地的繁荣、粮食过剩、宗教团结、神职人员/祭司的满意度、朝圣或市场准入、破坏或资本路线的安全，那么这些信号应该会形成触发器。仪式不应该在饥荒程度的短缺、烧毁或毁坏的地区条件下开始，或者在宗教叛乱导致共享壁炉无法更新的情况下开始。只有在不威胁该地点并且不切断聚集社区的情况下才应允许战争。国家应有足够的国库/收入或储备物资，以提供集会期间的公祭、香火、火炬材料、护卫和市场秩序。
    start_logic: >-
      启动效果记录了赞助国、特奥蒂瓦坎仪式地点、最终的奇迹建筑以及活跃的火更新周期。它概括了与奖励相关的国家价值观：每月声望、当前声望、自身信仰宽容、宗教团结或同等水平、稳定性、神职人员/牧师满意度、国库/收入、战争状态以及食品或供应代理。它反映了当地的情况：占领、动乱、破坏、繁荣、人口、市场或朝圣通道、辖区状况，以及大道和金字塔顶是否可以举办游行。它初始化用于区域清洁、壁画和灰泥修复、大道游行秩序、家庭炉灶登记、香火和火炬储存、日历监视、朝圣代表团到达、市场供应、峰会准备和公共圣火分发的柜台。临时维护包括祭品、聚集社区的食物、守卫、修理工、焚香、火把束，以及更新前暂停普通炉灶使用的费用。
    progress_logic: >-
      每月的进度是一座神圣城市的准备工作。工人们清理大道、修复石膏台阶、重新粉刷或固定公寓内的壁画，并清理山顶通道。消防员登记哪些家庭或社区将扑灭旧炉灶并接收新火焰。焚香者备有柯巴脂；火炬制造者收集芦苇、木材和纤维；市场管理员会摆放玉米、豆类、苋菜、布料和工艺品，以便游客能够得到食物和控制。历法观察者可以从金字塔区域观看日出、阴影和季节标记，而不需要实施精确的天文学建模。朝圣者团体沿着标记的路线到达，并按院落或城镇分配地点。当场地仍受控制、维护费用得到支付、食品和市场秩序充足且当地骚乱可控时，进展就会取得进展。它因占领、破产、严重动乱、饥荒、金字塔区遭到破坏、宗教叛乱或路线封闭而暂停。它以高度的稳定性、高度的宗教统一或自身信仰凝聚力、强大的地方繁荣、丰富的食物、满意的祭司团体和强大的威望而加速，因为人们随后愿意到来并接受新的火作为共同的秩序。如果容忍度较低，但骚乱是可以控制的，那么进展应该继续缓慢：仪式的目的是重建凝聚力，但当社区积极对抗国家信仰时，它就不可能成功。
    completion_logic: >-
      Completion requires that the precinct, avenue, hearth, offering, calendar, pilgrim, market, and
      summit counters have reached their thresholds;该网站仍受控制；最后的奇迹建筑存在；国家没有破产； and the gathering is peaceful
      enough for public flame distribution.最后一幕在黎明前在太阳金字塔上开始。 Old hearths in participating compounds have
      been extinguished or symbolically covered.观察员确认指定时间；香火升起； attendants bring torches and braziers
      to the summit; representatives of neighborhoods, workshops, and visiting communities wait along
      the Avenue of the Dead. A new flame is kindled and carried down the steps, then divided among torches
      that move through the avenue, market, and apartment compounds. Public announcements define feast
      days, market protections, and obligations to the sacred precinct.这一奇迹成为国家能力，因为特奥蒂瓦坎不再只是一个古老的纪念性遗址：它是一个有组织的仪式中心，反复将共享的神圣秩序转化为声望和内部宗教凝聚力。
    failure_or_timeout_logic: >-
      仪式可以暂停，而不会出现严重的超时，但如果周期延迟太久，炉灶、朝圣者和祭品柜台就会腐烂，因为社区恢复了普通的火灾，食物被消耗，游客回家。如果赞助商失去场地、最后的奇迹建筑消失、国家仍然破产、辖区被占领，或者严重的宗教/当地骚乱导致共享圣火分发变得不可能，那么活动就会失败或取消。饥荒程度的短缺、严重的破坏、路线阻塞或直接威胁圣城的战争应该会暂停进展，并可能重置市场和朝圣者柜台。如果该地点在占领后恢复，则可以部分保留物理清洁和修复，但必须重复炉灶登记、朝圣者到达和最终登顶准备。统治者的死亡应该不重要，除非它造成了更广泛的宗教或合法性危机，因为这种仪式与城市轴线而不是王朝加冕典礼有关。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对特奥蒂瓦坎仪式地点的控制、最终独特的建筑存在、没有破产、没有占领或无效的围攻、没有活跃的重复仪式、可控的当地骚乱以及足够的金库/食物或聚会供应。添加对宗教团结或自身信仰凝聚力、牧师/神职人员合作、当地繁荣、朝圣/市场路线通道、未受破坏的地区以及没有严重宗教叛乱的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和地点，初始化用于地区清洁、壁画/灰泥修复、大道秩序、炉灶登记、香火/火炬储存、日历表、朝圣者到达的柜台，市场供应、峰会准备和火焰分发，应用临时维护，并存储国家/地方威望、信仰宽容、宗教团结、稳定、食物、繁荣、动乱和破坏的基线。
      snapshot_effect_script: >-
        刷新当前赞助商和站点值：每月威望、当前声望、对自己信仰的宽容、宗教团结或同等水平、稳定性、神职人员/神职人员满意度、国库/收入、战争状态、食品/供应代理、站点 occupation, unrest,
        devastation, prosperity, population, route access, market condition, precinct usability, and final
        building presence.保留扩展和失败决策的启动基线。
      progress_effect_script: >-
        每月一次，提前设立分柜台，负责区域清洁、灰泥和壁画修复、大道游行秩序、壁炉登记、香火和火炬供应、历法观察、朝圣者代表团抵达、市场供应、峰会准备和最后的圣火物流。由于破产、占领、严重动乱、饥荒、严重破坏、路线封闭、宗教叛乱或无偿维护而暂停或衰退。加速实现高度稳定性、宗教凝聚力、当地繁荣、粮食过剩、牧师支持和声望。
      completion_trigger_script: >-
        需要必要的火更新计数器或总进度阈值、地点受控、最终建筑存在、无破产、无占领、可控制的骚乱、充足的食物/祭品、开放的集会路线以及足够的信仰凝聚力，以便接受公共火焰分发。
      completion_effect_script: >-
        删除临时集会维护，应用永久国家修改器保留每月的声望和对自己信仰的宽容，授予一次性声望，宗教凝聚力，当地繁荣或骚乱救援奖励，为新的火灾和大道游行添加当地记忆，清除主动进度变量，并保留持久的完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留monthly_prestige作为神圣城市的可见权威，可以聚集死亡大道沿线的社区并从太阳金字塔恢复公共火力。保留tolerance_own作为家庭、作坊和参观城镇通过国家管理的仪式秩序接收圣火时所产生的内部凝聚力。奖励应该保持神圣的公民性，而不是转换速度或军事效果。
      one_time_reward: >-
        授予一次性威望、自身信仰凝聚力或宗教团结、朝圣和市场聚集带来的当地繁荣，如果食物和火焰分发顺利完成，则可能减少当地骚乱。如果该地点开始时有适度的紧张，但在仪式期间稳定下来，则将部分奖励转向宽容或稳定而不是现金。
      local_building_reward: >-
        该地点应保留对清理过的大道、修复过的金字塔灰泥、登记的壁炉、香店、朝圣路线、市场秩序和山顶火平台的记忆。后来的实施可以将其表达为当地宗教团结、减少骚乱、朝圣价值、繁荣增长或对信仰相关混乱的更强抵抗力。
    notes: >-
      源仪式是直接的，但每月定时模式更好地尊重全市火灾更新所需的准备。该设计避免声称精确丢失的礼拜仪式和场地在物理特征上的实现：金字塔、大道、院落、壁画、市场、香火、壁炉和公共火焰。不使用 ruler_death
      或战争侦听器，因为奖励主题是声望和自身信仰宽容，而不是继承或战场验证。实施应避免在饥荒、占领或宗教叛乱期间完成。
- id: 132
  key: unique_angkor_hydraulic_system
  base_key: hydraulic_workshop
  location: angkor
  source_ritual_key: west_baray_water
  status: designed
  ritual_design_zh:
    title: 西巴莱放水
    mode: auxiliary_building
    duration: >-
      辅助建筑模式优于源直接模式，因为西巴莱放水证明了持续的水利管理：堤坝工作人员、水闸管理员、运河疏浚者、村庄水共享登记处、稻田堤岸检查员和寺庙水神社，它们协调季节性合法性与实际灌溉。十二至十八个月的持续时间应涵盖季风前修复、雨季储存、控制释放、旱季分配和收获审查。
    listeners:
    - monthly
    historical_flavor: >-
      西巴莱放水属于吴哥，因为高棉首都将水管理纳入政治神学和经济基础设施。参与者包括国王的水利官员、水利神社的婆罗门或寺庙祭司、水稻种植的村庄、徭役劳动监督者、堤坝建设者、运河疏浚者、渔民、使用河粘土的陶工、林产品收集者、粮仓职员以及在田地取水时进行谈判的当地头人。这些地方包括西巴雷水库、支水渠、红土和土堤、溢洪道、寺庙护城河、稻田、村庄堤坝、粮仓和神社，在水被灌溉之前，这些地方会被仪式性地标记。这些物品包括水位杆、闸板、量碗、堤标、疏浚篮、稻种、莲花供品、石刻或棕榈叶劳动记录、粮仓印章以及放生后设置在运河中的鱼夹。其象征意义在于，繁荣源于统治者控制季风水的能力，将其明显地分开，并使村庄相信他们在堤坝上的劳动将以稻米、鱼类、粘土、木材运输和市场剩余的形式回归。来源奖励与此完全匹配。
      global_raw_material_output上升是因为稻米、鱼、粘土、芦苇、木材运输和其他农村材料变得更加可靠； global_monthly_prosperity 之所以上升，是因为水的规律性降低了饥荒风险，支持密集定居，并让当地市场围绕可预测的收成进行计划。
    confirmation_logic: >-
      赞助商必须拥有或控制吴哥，最终的水利系统奇迹建筑必须存在，国家不能破产，水库/运河区不能被占领、围困或严重的当地动乱。该地区应有足够的劳动力、人口、食物或供应储备，以便在释放前进行维护。如果实施过程可以检测到季风/洪水/干旱状况、当地繁荣、破坏、原材料产出、农业生产或路线通行，这些信号应该控制或扩展仪式。洪水危机、堤坝决口、水库干旱空空、劳动村的叛乱或水库与田地之间的通道被堵塞，都可能会阻止确认。战争不应自动阻止这一仪式，除非它威胁到吴哥、摧毁运河、占领水库或夺走保护堤坝安全所需的劳动力。
    start_logic: >-
      起始效果记录了主办国、作为仪式地点的吴哥、最终的水利建筑以及辅助水利办公网络。它反映了奖励基线：全球原材料产量、全球月度繁荣、财政/收入、稳定性或权威、人力/劳动力储备、食品/供应储备、腐败或行政效率以及战争状态。它反映了当地的情况：占领、动乱、破坏、当地繁荣、人口、水库可用性、运河通道、农业/原材料产出以及洪水或干旱压力（如果有）。它初始化用于堤防检查、水闸校准、运河疏浚、现场堤坝修复、村庄水共享登记、神社祭品、劳动力名册履行、粮仓准备、渔业/航道清理和最终受控释放的计数器。临时维护费用包括徭役劳动、工作人员的食物、木材和红土维修、牧师或神社费用以及在计划释放之前保持水的机会成本。
    progress_logic: >-
      每月进度遵循农业用水年。在下雨之前，工程师检查堤坝是否有动物洞穴、侵蚀和薄弱的溢洪道；劳工团伙搬土、重置红土块、清理运河口。在蓄水月份，水务官员读取水平杆并将水库高度与预期的现场需求进行比较；神社的侍者用祭品在水上做标记，使分配公开合法化。挖泥船清除淤泥和杂草；村长确认哪些堤岸、稻田和支水渠道将首先获得水；粮仓职员记录种子储备；渔民在放生后为运河准备陷阱；陶艺家和木材加工商注意到何时可以运输。当吴哥得到控制、维护费用得到支付、堤坝完好无损、当地动乱可控且有水可用时，就会取得进展。它因破产、占领、严重骚乱、堤坝决口、极端洪水、空水库、严重破坏或拒绝劳动力而暂停。它凭借强大的劳动力储备、高度繁荣、稳定的权威、良好的食品储备、低腐败、现有的原材料产出以及维护良好的当地运河而加速。如果干旱程度适中，仪式可以缓慢进行，作为保护；
    completion_logic: >-
      完成需要水库、水闸、运河、田地、村庄、神社、劳工、粮仓柜台完成；如果完全干旱，则必须等待释放。吴哥仍然受到控制；最终的建筑和辅助供水办公网络已经存在；国家没有破产；并且水位可以安全释放。最后一幕发生在西巴莱的堤岸上。水利官员展示水位杆和运河登记册；寺庙祭司在水神殿献上节制的祭品；村长站在标记的股份上；劳动监察员展示已完成的外滩修缮工作；粮仓职员打开种子库进行检查。闸板按顺序升起，而不是一次性全部升起，水在农民、渔民和官员的注视下进入运河。信使将发布时间传送到下游领域。这一奇迹变成了国家能力，因为国家已将季风的不确定性转化为原材料生产和繁荣的负责任的时间表：每条运河都知道其劳动义务，每个村庄都知道其水份额，每个粮仓都可以围绕释放进行计划。
    failure_or_timeout_logic: >-
      在正常延迟情况下，辅助网络不应到期，但如果错过水和劳动力周期，进度就会衰减。如果赞助商失去了吴哥、最终的水利建筑消失、辅助水利办公网络被拆除、国家仍然破产或水库被占领，它就会失败或取消。严重的骚乱、劳工起义、堤坝决口、灾难性洪水、全面干旱、运河堵塞或严重破坏都会使进展停止，并可能减少运河、田地和粮仓的数量。如果吴哥在占领后恢复，则应重新进行堤防检查和水共享登记，因为大门和登记册可能已被更改。远离吴哥的战争应该只影响劳工和财政，而威胁水库或吸引维护人员的战争应该中断释放。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对吴哥的控制，最终独特的水利建筑的存在，没有破产，没有占领或无效的围攻，没有活跃的重复仪式，可控的骚乱，以及足够的劳工/财政/粮食能力用于维护。添加对水库可用性、未被破坏的运河、水的可用性、没有灾难性洪水或干旱状态（如果有）、当地农业/原材料基地以及没有劳工村叛乱的主题检查。
      start_effect_script: >-
        创建或激活辅助水务办公室网络，将其绑定到赞助商和吴哥，初始化用于堤防检查、水闸校准、运河疏浚、现场堤坝修复、水共享登记、神社供奉的计数器，劳动力名册、粮仓准备情况、渔业/航道清理和最终释放、应用临时维护并存储奖励/当地基线。
      snapshot_effect_script: >-
        刷新全球原材料产出、全球每月繁荣、财政/收入、稳定/权威、劳动力/人力、食品/供应、腐败、战争状态、吴哥占领、动乱、破坏、当地繁荣、人口、水库状况、运河通道、农业产出、水的当前值压力、最终建筑物存在和辅助网络存在。保留扩展和失败决策的开始基线。
      progress_effect_script: >-
        在每月的刻度上，提前子计数器用于堤坝、水闸、疏浚、田野堤坝、水共享登记册、神社合法性、劳动力履行、粮仓种子存储、渔业/渠道准备和释放计划。由于破产、占领、严重动乱、堤坝决口、洪水灾害、全面干旱、运河堵塞、劳工反抗、严重破坏或无偿维护而暂停或衰退。加速实现繁荣、劳动力储备、良好的粮食储备、稳定的权威、低腐败、水资源供应和现有的原材料产出。
      completion_trigger_script: >-
        需要必要的水力计数器或总进度阈值、吴哥控制、最终建筑和辅助网络存在、没有破产、没有占领、可控的骚乱、完整的堤坝、可用水库水位、开放的运河和注册的村庄份额，以实现最终的受控释放。
      completion_effect_script: >-
        消除临时维护负担，认证辅助网络水办公室网络，应用永久国家修改器，保留全球原材料产量和全球每月繁荣，授予一次性当地农业/繁荣/供应奖励，为 West Baray 释放寄存器添加本地内存，清除瞬时进度变量，并保留持久的完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保护global_raw_material_output，为水稻、鱼类、粘土、芦苇、木材运输和相关农村生产提供可靠的水源。保留global_monthly_prosperity作为受监管的水库、运河和村庄水源的定居和粮食安全效应。奖励应该保持在水利和农业方面，而不是成为寺庙威望效应。
      one_time_reward: >-
        给予当地一次性繁荣、粮食或供应恢复、原材料输出动力，如果释放修复了一个受压力的地区，也许还可以减少破坏或骚乱。如果仪式在适度的干旱管理后完成，则将奖励调整为恢复力；
      local_building_reward: >-
        吴哥应该保留校准水闸、修复堤坝、疏浚运河、登记的村庄用水份额、种子粮仓检查、神社标记和渔业渠道的记忆。稍后的实施可以将其表达为当地粮食产量、生产效率、繁荣增长、干旱/洪水恢复力或更快地从破坏中恢复。
    notes: >-
      源仪式是直接的，但auxiliary_building模式更好地捕捉成功释放背后的永久水管理网络。每月一次就足够了，因为机械师遵循季风、劳动和收获周期。实施过程中应将其与吴哥窟的寺庙主权区分开来：这里的回报是原材料产出和通过工程水分配实现的繁荣。不允许在灾难性洪水、彻底干旱、占领或劳工起义期间完成。
- id: 133
  key: unique_dutch_polders
  base_key: giant_dam_project
  location: amsterdam
  source_ritual_key: dike_closure
  status: designed
  ritual_design_zh:
    title: 环堤合流和水委员会誓言
    mode: auxiliary_building
    duration: >-
      辅助建筑模式至关重要，因为荷兰圩田既是一项工程，也是一个永久性机构。辅助结构应代表水板房、堤坝监视站、排水风车、泵组、水闸、勘察处和税务登记处，以防止填海土地返回水源。每月 18 到 24 次刻度应涵盖环堤截流、抽水、干燥、土壤评估、地块测量、税收分配和第一次维护轮换。
    listeners:
    - monthly
    historical_flavor: >-
      环堤截流和水局誓言属于荷兰圩田，因为这一成就不仅仅是英勇的筑坝；这是集体水治理。参与者包括阿姆斯特丹地方法官和投资者、hoogheemraadschap 或水务局官员、堤坝管理员、测量员、排水磨坊主、木匠、打桩机、泥炭切割机、等待分配的农民、牛主、水闸管理员、船夫、税务员以及暴风雨期间在海堤巡逻的守夜人。这些地方是环堤、最后的封口、排水沟、风车线、水闸房、测量场、再生粘土和泥炭地、临时工作营以及分配成本和义务的水板房。这些物品包括打桩锤、束带、粘土垫、芦苇束、风车帆、泵轮、水闸钥匙、测深杆、测量链、地块地图、水位标记、维护名册和水税分类账。其象征意义是清醒和公民的：社区只有通过接受分担成本、持续测量和严格维护才能从水中赢得土地。这解释了奖励的来源。
      global_raw_material_output 上升是因为开垦田、奶牛牧场、泥炭、芦苇、粘土和菜园土地扩大了物质基础。 global_production_efficiency 上升，因为排水、调查和征税的地块支持可预测的农业产出、碾磨、运输和车间供应。
    confirmation_logic: >-
      赞助商必须拥有或控制阿姆斯特丹，最后的荷兰圩田奇迹建筑必须存在，国家不能破产，圩田不能被占领、围困或严重的当地动乱。由于维护成本是核心，触发因素应该需要足够的财政或收入来支付堤坝工作人员、风车维修、水闸管理员和测量员的费用。如果实施可以检测沿海通道、洪水破坏、风暴破坏、当地繁荣、产量、民商合作或行政能力，那么这些应该形成确认。战争不应自动阻碍工作，但敌人占领、物资封锁、军事洪水或缺乏劳动力应该阻碍工作。严重的农民或城市税收反抗也应该阻止确认，因为如果受益家庭拒绝水务局评估，圩田就无法发挥作用。
    start_logic: >-
      起始效果记录了主办国阿姆斯特丹作为仪式场地、最终的圩田建筑以及辅助水板网络。它反映了国家奖励基线：全球原材料产量、生产效率、财政/收入、稳定性、行政效率、市民或当地精英满意度（如果有）、腐败和战争/洪水状态。它反映了当地的情况：占领、动乱、破坏、繁荣、产值、沿海或水源、洪水风险、当地人口/劳动力和材料可用性。它初始化用于环堤闭合、打桩和围墙工作、水闸安装、风车/泵准备、排水渠清理、水位测量、土壤干燥、包裹调查、水税评估、分配确认和堤坝监视名册的计数器。临时维护费用包括木材、粘土、工资、投资者预付款、水泵维修、船员食物以及在新土地完全生产之前征收水税的政治成本。
    progress_logic: >-
      每月进度应遵循圩田的制作和管理。最初的几个月是打桩、打包、搬运粘土以及缩小环堤最后一个缺口的位置。木匠安装水闸和排水框架；风车工作人员升起风帆，测试泵轮，并根据风力和水位分配磨坊工人轮班。运河工作人员清理排水沟；测量员进行测深，标记沉降地面，并将新兴土地分成几块。税务员计算哪些业主和城镇欠维护份额；迪克·里夫斯发誓要在高水位之夜观察花名册；农民测试土壤盐分，并决定首先使用的是牧场、谷物、芦苇、泥炭还是商品花园。当阿姆斯特丹得到控制、维护费用得到支付、辅助水务局保持活跃、当地骚乱可控、洪水损害并不严重时，就会取得进展。它因破产、占领、严重骚乱、军事洪水、暴风雨决口、水泵损坏、木材供应受阻或拒绝水税而暂停。随着高额财政、强大的地方繁荣、满意的市民或投资者、良好的行政效率、可用的劳动力、低腐败和现有的生产需求，它会加速。轻微的洪水会造成修复工作并且进展缓慢；灾难性决口应重置关闭和抽水计数器。
    completion_logic: >-
      完成要求堤坝关闭、水泵和水闸工作、水位足够低以供使用、对地块进行勘察、分配税收以及宣誓就职第一批维护名册。阿姆斯特丹仍然必须受到控制，最终的奇迹建筑和辅助水板网络必须存在，国家不能破产，并且该地点必须安全，不会立即被破坏。最后的场景发生在最后一个封闭间隙，然后是水板室。工人们放置最后的粘土和法斯尼斯捆；风车开始按顺序抽水；水闸管理员在见证下交钥匙；测量员在干燥的土地上放置地块标记；迪克·里夫斯宣读了值班名单；办事员封存水税台账；地方法官和土地所有者发誓即使在庆祝活动结束后也会维持这项工作。这一奇迹变成了国家能力，因为填海土地现在与一个财政和技术机构挂钩，该机构可以继续生产原材料并逐月改善生产程序。
    failure_or_timeout_logic: >-
      辅助网络不应该有正常的超时，但疏忽和风暴应该很重要。如果赞助商失去阿姆斯特丹，最后的圩田建筑消失，辅助水板被拆除，国家仍然破产，场地被占领，或者灾难性的破坏使当前项目无法恢复，则仪式失败或取消。严重的骚乱、税收叛乱、军事洪水、风暴破坏、泵故障、材料堵塞或严重破坏可能会导致进度暂停，并可能减少关闭、泵送或包裹柜台的数量。如果该场地在占用后恢复，则应重新进行调查和纳税评估，因为土地权利和维护义务可能已被中断。水区之外的战争应该只影响成本和劳动力，而砍伐木材、占领水闸或故意淹没圩田的战争应该停止仪式。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助者对阿姆斯特丹的控制，最终独特的圩田建筑存在，没有破产，没有占领或无效的围攻，没有活跃的重复仪式，可控的骚乱，以及足够的金库/收入用于高额维护。添加对低于严重阈值的洪水损害、可用的沿海/水域通道、可用的劳动力/材料、当地繁荣或生产基地、市民/投资者合作以及没有积极的水税反抗（如果有）的主题检查。
      start_effect_script: >-
        创建或激活辅助水板网络，将其绑定到赞助商和阿姆斯特丹，初始化环堤关闭、法索/打桩工作、水闸安装、风车准备情况、排水渠、水位测量、土壤的计数器干燥、包裹调查、水税评估、分配确认和堤坝监视名册、应用临时维护和商店生产、原材料输出、金库、洪水、动乱和当地繁荣基线。
      snapshot_effect_script: >-
        刷新当前赞助商和站点值：全球原材料输出、全球生产效率、金库/收入、稳定性、行政效率、市民/当地精英满意度、腐败、战争/洪水状态、阿姆斯特丹占领、动乱、破坏、当地繁荣、产值、沿海/水域通道、劳动力、材料、最终建筑存在和辅助网络存在。保留奖励缩放和失败决策的开始基线。
      progress_effect_script: >-
        在每月的刻度上，提前子计数器用于堤坝关闭、打桩、粘土和法尼斯、水闸、风车、水泵、排水渠、水测量、土壤干燥、包裹调查、水税登记、分配拨款和堤坝监视名册。由于破产、占领、严重动乱、拒税、暴风雨破坏、军事洪水、泵故障、材料堵塞、严重破坏或无偿维护而暂停或衰退。加速实现强大的财政、劳动力、行政效率、投资者支持、当地繁荣、低腐败和生产需求。
      completion_trigger_script: >-
        需要必要的圩田计数器或总进度阈值，阿姆斯特丹控制，最终建筑和辅助网络存在，没有破产，没有占领，可管理的骚乱，封闭的堤坝，功能正常的水泵/水闸，可接受的水位，调查的地块和分配的维护税。
      completion_effect_script: >-
        消除临时施工负担，认证辅助设施水板网络持久，应用永久国家修改器保留原材料输出和生产效率，授予一次性当地繁荣/生产/国库奖励，添加当地圩田记忆，清除瞬时进度变量，并保留持久的完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保护global_raw_material_output，因为开垦土地、奶牛牧场、谷物、芦苇、泥炭、粘土和商品花园投入生产。保护global_production_efficiency作为排水、测量地块、水税、风车抽水和可预测维护的结果。奖励应该仍然是工程和农业工业收入，而不是一般贸易收入。
      one_time_reward: 给予当地一次性繁荣、生产动力、来自评估的新土地的资金，或许还包括灾后恢复或洪水风险救济。如果项目在风暴修复阶段后完成，则将部分奖励用于恢复力而不是原始资金。
      local_building_reward: >-
        阿姆斯特丹应该保留对环堤、抽水风车、水闸房、地块地图、水税分类账、堤坝监视名册和第一批开垦田地的记忆。后来的实施可以将其表达为当地生产效率、原始产出、减少洪水破坏、繁荣增长或灾后更快的修复。
    notes: >-
      源仪式是直接的，但选择auxiliary_building模式是因为圩田通过永久治理和维护而得以生存。每月的滴答声就足够了：这个过程是工程、财务和水管理，而不是战争或继承。实施应确保破产和无偿维护是严重的障碍，因为无法支付水泵和堤坝值班费的圩田并不是一个运转良好的奇迹。奖励必须始终以原材料和生产为重点。
- id: 134
  key: unique_machu_picchu_terraces
  base_key: mountain_terrace_network
  location: picchu
  source_ritual_key: first_sowing
  status: designed
  ritual_design_zh:
    title: 在神圣梯田上首次播种
    mode: auxiliary_building
    duration: >-
      辅助建筑模式是首选，因为第一次播种仅在梯田维护人员随后保留的情况下才重要：墙壁修复人员、排水石检查员、灌溉渠道管理员、种子和肥料存储、田间管理员以及通往 qollqa 仓库的道路。每月十二次的持续时间符合从旱季墙壁修复到整地、水质测试、第一次播种、生长季节检查和收获审查的农业周期。
    listeners:
    - monthly
    historical_flavor: >-
      神圣梯田上的第一次播种属于马丘比丘，因为该地点的农业力量来自精心设计的斜坡，而不是来自移植到山上的普通田地。参与者包括印加庄园官员、当地 ayllu 劳工团体、mit'a 监督员、梯田泥瓦匠、灌溉管理员、种子管理员、美洲驼管理员、仓库职员、标记第一道犁沟的仪式服务员以及了解海拔、霜冻和排水的农民。这些地方包括皇家城堡下方的梯田、挡土墙、石头排水沟、岩石、砾石、沙子和肥沃的土壤层、灌溉渠道、连接田地和仓库的小路，以及可以读取乌鲁班巴山谷天气的瞭望点。这些物品包括挖掘棒、玉米种子、土豆、藜麦或其他高地作物、美洲驼粪便、排水石、编织种子袋、引水塞、露台墙壁工具、qollqa理货绳、古柯或玉米祭品以及修复过的台阶之间的台阶。其象征意义在于，国家可以在不撕裂自己的情况下，让陡峭的神圣景观养活人们。
      global_raw_material_output 的上升是因为有纪律的梯田扩大了可用作物、纤维植物、肥料循环和储存的食物。 global_monthly_prosperity之所以上升，是因为排水、土壤分层和有计划的种植减少了山体滑坡、霜冻和饥饿风险，使山区定居点更加稳定。
    confirmation_logic: >-
      赞助商必须拥有或控制比丘，最终的梯田奇迹建筑必须存在，国家不能破产，梯田区域不能被占领、围困或严重的当地动乱。该地区应有足够的劳动力、种子、肥料和粮食储备，以便在收获前准备好田地，避免家庭挨饿。如果实施过程可以检测道路通行、山路安全、当地繁荣、破坏、粮食/供应储备、山体滑坡或洪水破坏、干旱/霜冻压力或农业生产，那么这些信号应该控制仪式。战争不应自动阻碍工作，但敌人占领、路线隔离、空荡荡的仓库或劳工社区的叛乱应该阻止确认。主办方还应具有足够的权威或稳定性来指挥工作并解决现场责任。
    start_logic: >-
      起始效果记录了主办国、作为仪式场地的比丘、最终的露台建筑以及辅助露台维护网络。它快照了奖励基线：全球原材料产量、全球月度繁荣、财政/收入、稳定性或权威、劳动力/人力、食品/供应储备、生产效率或产出（如果有）以及战争状态。它反映了当地的情况：占领、动乱、破坏、繁荣、人口、道路通行、露台墙状况、灌溉可用性、食品储存以及天气或灾害压力（如果建模的话）。它初始化挡土墙修复、排水石检查、土层更新、灌溉渠道清理、种子选择、粪便分配、田间分配、第一道沟准备、生长检查和收获/仓库审查等计数器。临时维护代表劳动日、不能立即消费的籽粒、骆驼粪便运输、灌溉工具、仪式祭品以及田地和仓库之间的道路运输成本。
    progress_logic: >-
      每月进度遵循山区田年。最初的几个月检查挡土墙是否有凸起，重置石头，并清理排水沟，以便大雨可以穿过梯田而不是摧毁它们。工作人员更新土壤层，在侵蚀使河床变薄的地方添加沙子或肥沃的土壤，并修复各层之间的台阶。灌溉管理员清理小渠道并测试水是否到达每个露台而不淹没下墙。种子管理员根据海拔和暴露程度选择玉米、马铃薯、藜麦或其他作物品种；美洲驼饲养员运送粪便；
      qollqa 职员记录可以保留多少种子。田间管理员将劳动组分配到各个级别，准备第一道犁沟，然后检查豆芽、霜害、害虫和收获储存。当比丘得到控制、维护费用得到支付、路线开放、当地动乱可控且食物储备充足时，进展就会取得进展。它因占领、破产、严重动乱、路线隔离、山体滑坡、干旱、霜冻灾害、种子储备空缺或灌溉中断而暂停。它以强大的劳动力、充足的仓库、高度的当地繁荣、稳定的权威、良好的道路通行、低破坏和现有的农业产出而加速。适度的困难会减缓但不会阻碍仪式，因为梯田在一定程度上是一个弹性系统；灾难性边坡失稳应重置墙体和排水计数器。
    completion_logic: >-
      竣工要求梯田墙体、排水沟、土层、灌溉、种子、肥料、田间分配、播种、生长检查和仓库审查计数器完成；比丘仍然受到控制；最终的建筑和辅助网络已经存在；而且国家还没有破产。最后的场景发生在城堡下方准备好的上层露台上。庄园官员和当地劳工领袖检查排水石和更新土壤的横截面；灌溉管理员打开一个有测量的通道；种子管理员带上编织袋；美洲驼饲养员撒上最后的粪便；仪式侍者用对大地和太阳的有限供品来标记第一道犁沟；农民一层层播下第一批种子，仓库管理员则记录预期的收成。这一奇迹成为国家能力，因为梯田被认证为可重复的山区生产系统：它们的墙壁坚固，排水系统正常，种子按海拔分配，仓库知道如何接收农作物。
    failure_or_timeout_logic: >-
      正常延迟情况下，辅助网络不会过期，但如果错过季节，农业计数器就会衰减。如果赞助商失去比丘、最终的露台建筑消失、辅助维护网络被移除、国家仍然破产或露台被占用，则失败或取消。严重的骚乱、路线隔离、山体滑坡、灌溉崩溃、种子储备耗尽、饥荒或灾难性的霜冻/洪水都会使进度暂停，并可能减少播种、生长或仓库计数器。如果比丘在占领后被恢复，则必须重复检查墙壁和排水系统，因为损坏可能隐藏在土壤下面。远程战争应该只影响劳动力和供应；山区的战争应该停止工作，直到道路和田地安全为止。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对比丘的控制，最终独特的梯田建筑的存在，没有破产，没有占领或无效的围攻，没有活跃的重复仪式，可控的骚乱以及足够的劳动力/食物/种子能力。添加对路线通道、未受破坏的斜坡、灌溉可用性、当地繁荣或农业基础以及劳工社区中没有严重叛乱的专题检查。
      start_effect_script: >-
        创建或激活辅助梯田维护网络，将其绑定到赞助商和比丘，初始化用于墙壁修复、排水检查、土壤更新、灌溉清理、种子选择、肥料分配、田间分配、第一道犁沟、生长检查和收获/仓库审查的计数器，应用临时维护并存储原始输出，繁荣度、劳动力、食物、路线和当地条件基线。
      snapshot_effect_script: >-
        刷新当前赞助商和场地值：全球原材料产出、全球月度繁荣度、财政/收入、权威/稳定、劳动力/人力、粮食/供应储备、产量、战争状态、比丘占领、动乱、破坏、繁荣、人口、道路通行、梯田状况、灌溉、天气/灾害压力、最终建筑存在和辅助网络存在。保留缩放和失败决策的开始基线。
      progress_effect_script: >-
        在每月的刻度上，提前进行挡土墙、排水石、土壤分层、灌溉渠道、种子储存、肥料、田间分配、第一次播种、生长检查和收获/仓库审查的子计数器。由于破产、占领、严重动乱、路线隔离、山体滑坡、干旱、霜冻灾害、灌溉崩溃、种子储备耗尽、饥荒或无偿维护而暂停或衰退。加速劳动力、充足的商店、繁荣、权威、开放的道路、低破坏和强大的农业产量。
      completion_trigger_script: >-
        需要必要的露台计数器或总进度阈值，比丘控制，最终建筑和辅助网络存在，没有破产，没有占领，可控的骚乱，有效的排水和灌溉，充足的种子/食物储备，以及通往仓库的开放路线。
      completion_effect_script: >-
        删除临时露台维护，认证辅助维护网络，应用永久国家修正保留原材料产出和每月繁荣，授予一次性当地食物/繁荣或原材料产出奖励，为第一次播种和露台寄存器添加本地内存，清除瞬时进度变量，并保留持久的完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留global_raw_material_output作为高原作物、纤维、肥料循环和工程梯田生产的储存食物的收益。保持global_monthly_prosperity作为稳定山区农业的恢复力：排水防止塌陷，土层保持肥力，仓库缓解短缺。奖励应该仍然是农业和基础设施，而不是皇宫威望。
      one_time_reward: 授予一次性粮食或供应储备、比丘当地的繁荣、原材料输出动力，或许还可以减少修复斜坡造成的破坏。如果仪式在恢复受损梯田后完成，则为恢复提供更多奖励；
      local_building_reward: >-
        比丘应该保留修复挡土墙、检查排水石、更新土层、清理灌溉渠道、种子记录、肥料路线和首次播种登记的记忆。稍后的实施可以将其表达为当地粮食产量、供应限制、繁荣增长、山体滑坡恢复能力或更快地从破坏中恢复。
    notes: >-
      源仪式是直接的，但auxiliary_building模式更好地捕捉了第一次播种后所需的持续梯田维护。每月就足够了，因为周期是农业和季节性的。这种设计应该与更广泛的马丘比丘皇家城堡仪式和印加道路网络保持不同：它的回报是原材料的产出和通过斜坡工程的繁荣。不要在饥荒、占领或灾难性斜坡塌陷期间完成。
- id: 135
  key: unique_british_navy_dockyards
  base_key: national_shipyard
  location: portsmouth
  source_ritual_key: armada_readiness
  status: designed
  ritual_design_zh:
    title: 朴茨茅斯的舰队战备文章
    mode: timed
    duration: >-
      保留了定时模式，因为仪式是一个战备周期而不是永久性的辅助建筑：造船厂已经存在，但海军必须证明船舶、补给品、船员、船长和修理厂可以一起行动。十二到十八个月的刻度应该代表战列舰的舾装、审核补给品、发放火药、修理船体、召集水手和进行港口试验。
    listeners:
    - monthly
    - pre_winning_war
    - ending_war
    historical_flavor: >-
      朴茨茅斯的舰队战备文章属于英国皇家海军造船厂系统，因为朴茨茅斯是海军士气的工作机器：干船坞、索道、帆棚、桅杆池、补给场、军械库、制桶厂、港口领航员、海军文员和船长使战斗前的信心成为可能。参与者包括海军委员会官员、造船厂专员、造船大师、填缝工、索具工、制绳工、制帆工、制桶工、事务长、粮食管理员、炮手、火药库管理员、海军分队、港口引航员、准尉、船长、新闻或征兵官员以及船上聚集的水手。这些地方包括朴茨茅斯港、干船坞、船台、索道、仓库、炮码头、饼干和咸肉堆场、水桶棚、帆棚、火药库以及停泊船只展示枪支和旗帜的锚地。这些物品包括集结书、战争条款、索具、帆布、焦油、橡木板、铜护套（如适用）、大炮、火药桶、子弹、饼干、咸牛肉、啤酒或水桶、药箱、信号旗和船长密封的航行命令。其象征意义不仅仅是一次阅兵：每个水手都看到这艘船将得到一个能够维持海上战斗的国家的供给、武装、修理、指挥和支持。这就是为什么来源奖励是naval_morale_modifier：士气来自于对船坞系统的信心，而不是来自从绳索、火药、食物和修理中抽象出来的勇气。
    confirmation_logic: >-
      赞助商必须拥有或控制朴茨茅斯，最终的船坞奇迹建筑必须存在，国家不能破产，港口不能被占领、围攻、封锁或遭受严重的当地动乱。该国至少应该拥有一个有意义的海军或海军建设基地、足够的水手或可招募的船员，以及足够的国库/收入来资助商店、维修和工资。如果实施可以检测港口访问、造船厂容量、海军维护、水手储备、舰队规模、封锁、海军传统、厌战或叛变/骚乱，这些信号应该形成确认。战争本身不应该阻碍仪式；事实上，战时可能会使准备工作变得紧迫。但舰队被困、缺乏补给、朴茨茅斯被封锁、水手没有工资、财政破产或造船厂被占领，这些都会阻止启动。
    start_logic: >-
      启动效果记录了赞助国朴茨茅斯作为仪式地点、最终的船坞建筑以及准备周期。它反映了国家和海军的价值观：海军士气、当前海军规模、水手、用于海军陆战队的人力、造船或维修速度、海军维护、财政/收入、战争状态、封锁状态、海军传统或威望（如果有）以及动乱/叛变压力。它反映了朴茨茅斯当地的状况：占领、动乱、繁荣、破坏、港口通道、造船厂容量、维修状况以及是否可以到达火药/物资商店。它初始化用于船体检查、干船坞修理、索具和帆问题、索道供应、桅杆和木材准备、粉末和射击审核、食品供应、水和药品储存、船员集合、海军分队、船长物品、港口试验和信号演习的计数器。临时维护费用包括工资、测试消耗的物资、粉末处理、额外的维修班次以及保持船舶处于就绪状态的机会成本。
    progress_logic: >-
      每月进度是装配例行程序。造船工人检查船体、填缝接缝、更换桅杆以及清理干船坞中的船舶。索具工和制绳工发放绳索；帆匠修补帆布；桅杆人员准备备用桅杆；炮手检查炮车、射击架、火药干燥度和弹匣纪律。食品供应商清点饼干、咸肉、豌豆、啤酒或水桶以及药箱；库珀测试桶；事务长的职员将商店与船员名单进行比较。船长阅读战争条款，准尉检查值班，海军陆战队演习登船和守卫职责，港口引航员带领船只进行试航，信号官测试锚定船只之间的旗帜命令。当朴茨茅斯被控制、港口开放、维护费用得到支付、水手可用且当地骚乱可控时，进展就会推进。它因破产、占领、封锁、严重骚乱、叛乱、水手失踪、火药危机或造船厂设施被毁而暂停。它通过强大的财政、充足的水手、大型或现代化的舰队、高尚的海军传统、良好的造船厂能力、低动荡和积极的战争准备而加速。仅当海军行动、封锁、护航队保护或海上控制确实有助于即将到来的胜利时，pre_winning_war
      侦听器才应添加进度。 ending_war 听众应该进行事后审计：成功的舰队服役可以验证士气，而被忽视的商店、封锁的港口或严重的海军损失应该扣留奖金或增加维修债务。
    completion_logic: >-
      完成需要完成基本的准备工作：检查船体、发放索具和帆、审核火药和枪支、储备食物、召集船员、指派海军陆战队员、阅读船长文章、通过港口试验以及认证信号演习。朴茨茅斯仍然必须受到控制，最终的建筑必须存在，国家不能破产，港口不能被封锁或占领。最后的场景是朴茨茅斯港的舰队集结。船坞专员出示商店分类帐；船长与准尉和事务长站在一起；海军陆战队在甲板上列队；炮手展示密封的火药账户；信号从旗舰传输到线路；船只发射有控制的礼炮或开炮，而不会浪费战斗物资；港口引航员证明已准备好在下一次潮汐中航行。海军部或王室代表确认舰队准备条款。这一奇迹变成了国家能力，因为水手和军官们知道，战斗将得到食物、绳索、枪支、修理、指挥和造船厂纪律的支持。
    failure_or_timeout_logic: >-
      仪式不应该有严格的暂停，但如果储存时间太长，准备状态就会减弱。如果赞助商失去了朴茨茅斯、最后一座造船厂建筑消失、国家仍然破产、港口被占领或持续封锁、或者水手无法得到报酬，那么它就会失败或取消。严重的骚乱、叛乱、火药库故障、船员短缺、造船厂遭到破坏或摧毁被检查舰队的海军失败都会导致进度暂停，并可能减少船员、物资和士气。如果朴茨茅斯在占领后恢复，所有商店分类账和火药审计都应重新进行。只有当海军力量真正重要时，战争才能帮助证明战备状态。遥远的陆地战争不应该增加进展。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对朴茨茅斯的控制，最终独特的造船厂存在，没有破产，没有占领或无效围攻，没有封锁，没有活跃的重复仪式，可控的当地骚乱，以及足够的海军或造船能力，使准备周期有意义。添加对水手、金库、港口通道、海军维护、造船厂状况以及没有兵变级别骚乱的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和朴茨茅斯，初始化船体检查、干船坞修理、索具、帆、索道供应、桅杆/木材准备情况、火药和射击审核、补给、水和药品、船员集合、海军陆战队、船长物品、港口审判的计数器，和信号演习，应用临时维持，并存储海军士气、舰队、水手、造船厂、金库、封锁和当地基线。
      snapshot_effect_script: >-
        刷新当前赞助商和地点值：海军士气、海军规模、水手、人力/海军陆战队代理、造船或维修能力、海军维护、金库/收入、战争状态、封锁状态、海军传统/声望、动乱/叛变压力、朴茨茅斯占领、当地动乱、破坏、繁荣、港口通道、造船厂状况、火药/食物通道以及最终建筑的存在。保留扩展和失败决策的启动基线。
      progress_effect_script: >-
        在每月的刻度上，推进船体、干船坞、索具、帆、绳索、桅杆、大炮、火药、射击、食物、水、药品、船员集合、海军陆战队、物品、港口试验和信号的子计数器。由于破产、占领、封锁、严重动乱、叛乱、水手失踪、造船厂被毁、火药危机或无偿维护而暂停或衰退。加速水手、财政、造船厂能力、海军传统、开放港口以及积极的相关战争准备。在pre_winning_war或ending_war上，仅对海军战备状态至关重要的战争添加验证。
      completion_trigger_script: >-
        需要必要的战备计数器或总进度阈值，朴茨茅斯受控，最终建筑存在，没有破产，没有占领，没有封锁，可控制的骚乱，仍然有足够的水手和船只，储备了食物/粉末，并完成了港口试验和信号演习。
      completion_effect_script: >-
        删除临时战备维持，应用永久国家修正保持海军士气，授予一次性水手/战备/声望或维修奖励，为经过认证的商店和舰队物品添加当地朴茨茅斯造船厂内存，清除瞬时进度变量，并保留持久的完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留naval_morale_modifier作为中心且唯一的永久源主题。它代表了水手们对朴茨茅斯能够为舰队提供补给、武装、修理、指挥和增援的信心。不要将其转化为造船速度或贸易实力作为永久奖励；
      one_time_reward: >-
        为曾经在港的舰队提供一次性水手、海军声望/传统、临时维修准备或有限供应/成本减免。如果战争听众验证了仪式，则将奖励的一部分调整为士气持续时间或减少海军战争疲惫感，而不是现金。
      local_building_reward: >-
        朴茨茅斯应该记住经过认证的干船坞、经过审计的食品堆场、火药库、绳索供应、帆阁、船员集合手册和港口信号演习。稍后的实施可以将其表达为本地船舶维修、水手恢复、造船厂容量或封锁恢复后更快的准备状态。
    notes: >-
      源仪式是即时的，但定时模式更好地代表装备舰队。每月处理正常的造船厂流程，而pre_winning_war和ending_war让相关的海军冲突证明或审查准备情况。实施过程中决不能让不相关的陆地胜利推进仪式，并应将封锁、叛变和无薪船员视为严重的阻碍者。永久奖励仍然是海军士气，与源数据相符。
- id: 136
  key: unique_spanish_silver_fleet
  base_key: maritime_trade_station_network
  location: sevilla
  source_ritual_key: silver_return
  status: designed
  ritual_design_zh:
    title: Casa de Contratacion Silver Return
    mode: timed
    duration: >-
      定时模式优于源立即模式，因为白银返回是一个完整的护航和分类账周期。每月十二到十八个刻度应该代表登记出境和入境舱单、集结看守的车队、接收车队报告、在塞维利亚卸货、化验金条、分离皇室股份、向商人征税以及将金属发送到铸币厂。归还仪式是受监管的大西洋体系的可见终结。
    listeners:
    - monthly
    - ending_war
    historical_flavor: >-
      Casa de Contratacion Silver Return 属于塞维利亚，因为西班牙白银舰队系统使海洋帝国通过一个河港及其账簿清晰可见。参与者包括合同局官员、皇家财务官、公证人、飞行员、宇宙学家、护航舰队上将、大帆船船长、水手、武装警卫、商人、保险公司、海关农民、造币师、铸币师、骡夫和瓜达尔基维尔河上的港口工人。这些地方包括卡萨的计数室、河边码头、看守的仓库、海关秤、化验台、造币厂、船舶锚地以及从港口到金库的道路。这些物品包括货物清单、飞行员图表、密封的保险箱、银条和硬币、金包、胭脂虫或其他高价值货物、皇家第五账户、阿维里亚或车队税分类账、秤、试金石、铸币模具、大炮、信号旗和仓库钥匙。其象征意义在于，只有当远距离开采在海上幸存下来、进入官方舱单、在证人面前称重并成为货币或应税贸易时，它才成为国家能力。
      trade_income 上升是因为 Casa 通过塞维利亚引导商人、保险、运输费、海关和高价值货物。 minting_income_factor 之所以上涨，是因为经过检验的金条和皇家股票在可靠的记录下为造币厂提供原料，而不是通过不规则扣押或私人走私。
    confirmation_logic: >-
      赞助商必须拥有或控制塞维利亚，最后的白银舰队奇迹建筑必须存在，国家不能破产，港口和卡萨辖区不能被占领、围困、封锁或严重的当地动乱。海洋贸易必须能够到达瓜达尔基维尔河：如果实施能够检测封锁、私掠、海盗、海军准入、海外贸易路线、商人满意度、护航力量或港口破坏，那么这些检查就应该很重要。国家应该有足够的海军或护航能力、水手、财政和贸易基地，以使受保护的返回成为可能。腐败或走私不应该总是阻碍这个开始，因为仪式包括审计，但导致清单无效的极端腐败应该阻碍它。只有塞维利亚和海上通道不被切断，战争才能与循环共存。
    start_logic: >-
      开局效果记录了赞助国、塞维利亚作为仪式场地、最终的白银舰队建造以及主动回归周期。它快照了奖励基线：贸易收入、铸币收入因素、国库/收入、通货膨胀或货币压力（如果有）、海军实力、水手、护航/护航能力、商人满意度、腐败、战争和封锁状态以及海外贸易范围。它反映了塞维利亚当地的状况：占领、动乱、破坏、繁荣、港口通道、河流通道、海关状况、仓库安全和铸币厂通道。它初始化用于舱单登记、车队组装、引航图认证、航道安全、入境船队目视、仓库准备、海关称重、金条化验、皇家份额分离、商业税结算、铸币交付和公共回归公告的柜台。临时维护费包括车队工资、船舶修理、港口警卫、仓库保安、化验费、公证劳动力以及货物等待官方清关期间延迟的商户流动资金。
    progress_logic: >-
      每月的进度随着白银从海上到硬币的变化而变化。 Casa 职员复制舱单并将预期货物与船队报告进行比较。飞行员核证海图，护航官员分配大帆船和武装护卫，港口官员准备看守的仓库。当舰队接近家乡时，瞭望员和信使报告船只损失、风暴损坏、私掠船袭击或安全抵达。一旦货物到达塞维利亚，工人们就会在看守下卸下保险箱；海关官员打开封条；化验人员测试银成色；财务主管计算皇家第五税和运输税；商人结算关税；铸币厂官员收到有记录的批次的金条。当塞维利亚被控制、港口开放、维护费用得到支付、车队安全充足、当地骚乱可控时，进展就会推进。它因破产、占领、封锁、严重骚乱、海盗危机、车队损失、仓库破坏或伪造清单的腐败而暂停。它凭借强大的海军护航、高贸易收入、健康的国库、低腐败、满意的商人、强大的港口繁荣和现有的铸币能力而加速发展。
      ending_war监听器应该检查海军和贸易条件：如果战争结束时海上通道受到保护并且塞维利亚畅通无阻，它可以验证舰队系统；如果战争以车队损失或封锁结束，则应扣留奖金进度或增加追偿债务。
    completion_logic: >-
      完成要求舱单、车队报告、港口接收、海关称重、金条化验、皇家份额分离、商人税收结算和铸币交付完成。塞维利亚仍然必须受到控制，最终的建筑必须存在，国家不能破产，港口不能被封锁或占领。最后的场景发生在瓜达尔基维尔码头和卡萨计数室。大帆船卸下受保护的箱子；官员将封条与舱单进行比较；分析人员切割并测试样品条；皇家财务主管拨出王室份额；商户收到清关标记；造币厂官员在护送下携带有记录的金条。钟声或预示宣告着舰队归来，但真正的高潮是账本的关闭：每个箱子都绑在船上，每笔税都绑在商人身上，每一块金条都绑在铸币厂上。这一奇迹变成了国家能力，因为大西洋贸易和金条现在通过值得信赖的行政渠道流动，从而提高了贸易收入和铸币税。
    failure_or_timeout_logic: >-
      仪式不应该有严格的超时，但如果船队延误太久，护航工作就会衰退：商店被消耗，水手分散，商人要求新的保险，舱单变得陈旧。如果赞助商失去了塞维利亚，最后的建筑消失，国家仍然破产，港口被占领或封锁持续一段时间，或者回国的船队损失惨重，比赛就会失败或取消。严重的骚乱、仓库被破坏、铸币厂关闭、海盗危机、海军失败或极端腐败都可能会导致进度暂停，并可能重置货物和化验计数器。如果塞维利亚在占领后恢复，所有舱单、封条和仓库库存都应重新审核。海上战争很重要：遥远的陆地战争不应该阻碍前进，而切断车队的海上战争应该阻止返回。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对塞维利亚的控制，最终独特的银色舰队建设存在，没有破产，没有占领或无效的围攻，没有封锁，没有活跃的重复仪式，可控的当地骚乱，以及有意义的贸易/海军基地。添加对海外贸易准入、车队或护航能力、水手、商人合作、港口和铸币厂准入、可容忍的腐败以及如果可检测到的没有严重海盗/私掠危机的专题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和塞维利亚，初始化舱单登记、车队集结、飞行员图表、海上航线安全、入境船队目击、仓库准备、海关称重、金条化验、皇家份额分离、商人税务结算、铸币交付等柜台，和归国公告，应用临时维护和商店贸易，铸币，海军，国库，腐败，港口和战争基线。
      snapshot_effect_script: >-
        刷新贸易收入，铸币收入因素，国库/收入，通货膨胀/货币压力（如果有）的当前值，海军实力，水手，护航能力，商人满意度，腐败，战争/封锁状态，海外贸易范围，塞维利亚占领，动乱，破坏，繁荣，港口通道，河流访问、仓库安全、铸币厂访问和最终建筑存在。保留扩展和失败决策的开始基线。
      progress_effect_script: >-
        在每月的刻度上，提前进行舱单子计数器、车队护送、飞行员认证、航道报告、船队到达、仓库准备情况、海关称重、金条分析、皇家五分之一/税收计算、商人清关、造币厂交付和公共公告。因破产、占领、封锁、严重动乱、车队损失、海盗、仓库破坏、造币厂关闭、腐败危机或无偿维护而暂停或衰退。加速实现强有力的护航、高贸易、低腐败、商人满意度、港口繁荣和造币能力。在ending_war上，根据海上航线和车队结果验证或破坏进度。
      completion_trigger_script: >-
        需要必要的白银返回计数器或总进度阈值，塞维利亚控制，最终建筑存在，没有破产，没有占领或封锁，可管理的骚乱，货物到达，完成化验，分离皇家份额，结算商人关税，以及开放铸币交付。
      completion_effect_script: >-
        删除临时车队/审计维护，应用永久国家修改器保留贸易收入和铸币收入，授予一次性金库/铸币/贸易或商人奖励，添加本地 Casa de Contratacion 内存，清除瞬时进度变量，并保留持久的完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留 trade_income 作为运输费、海关费、商户清关费、保险信心和途经塞维利亚的高价值货物的经常性价值。保留minting_income_factor作为官方分类账下交付的已检验金条的铸币税和铸币收益。奖励应该仍然是财政海事，而不是一般的海军士气或殖民榨取奖金。
      one_time_reward: >-
        从王室份额和职责、商人满意度、通货膨胀或货币减免（如果支持）以及塞维利亚的当地繁荣中授予一次性国库。如果该周期在战时护航风险中幸存下来，则可以对海军声望或减少贸易干扰进行一些奖励。
      local_building_reward: >-
        塞维利亚应该保留卡萨账本、看守仓库、化验台、皇家共享箱子、造币厂交付记录、飞行员图表和瓜达尔基维尔号上的返航协议的记忆。稍后的实施可以将其表达为当地贸易价值、铸币效率、减少走私/腐败或封锁后更快的恢复。
    notes: >-
      源仪式是即时的，但定时模式更好地代表了车队、海关、化验和铸币周期。包月承运普通物流；包含ending_war是为了回顾战时海上航线的结果，而不是为了奖励不相关的战争。实施应避免在没有车队安全和分类账完成的情况下提供免费资金。永久的奖励必须是贸易收入和铸币收入，以白银回归为机制。
- id: 137
  key: unique_ottoman_hajj_road
  base_key: imperial_post_road_network
  location: mecca
  source_ritual_key: hajj_departure
  status: designed
  ritual_design_zh:
    title: 苏雷商队出发
    mode: auxiliary_building
    duration: >-
      辅助建筑模式是首选，因为朝觐出发只有在存在固定道路系统的情况下才可能实现：水井、堡垒、商队驿站、骆驼站、警卫、医生、法学家、宗教与社团组织管理员以及连接帝国中心和圣城的通信办公室。每月十二个刻度应该代表每年的准备和通行周期，但辅助道路记忆在完成后仍然保留。
    listeners:
    - monthly
    historical_flavor: >-
      苏尔商队出发属于奥斯曼朝觐道路，因为苏丹声称保护朝觐不仅取决于仪式虔诚，还取决于实际后勤。参与者包括准备钱袋的帝国官员、朝觐埃米尔或商队指挥官、陪伴朝圣者的乌拉玛和法学家、伊斯兰宗教组织管家、医生、抄写员、禁卫军或省级卫兵、骆驼夫、运水人、井管理员、堡垒指挥官、贝都因人或部落谈判代表、商人、来自许多省份的朝圣者以及接受礼物并确认安全抵达的麦加当局。这些地点是出发宫廷、大马士革或开罗商队路线（通过帝国网络表示）、沙漠井、坚固的中途站、商队驿站、山口、蓄水池以及作为神圣目的地的麦加。这些物品包括神秘的钱包、横幅、密封的礼品箱、水袋、骆驼登记册、路线许可证、医疗包、法律意见书、宗教与社团组织账簿、警卫名册、井钥匙和给地方当局的信件。其象征意义在于，国家权力谦卑地为自己服务：它并不拥有朝圣活动，但它通过保护朝圣者、资助圣城的需求以及让遥远的穆斯林臣民感到与一条关心和指挥的路线有联系来证明其合法性。
      tolerance_own 上升是因为共同的宗教保护减少了国家信仰之间的内部不信任； global_distance_from_capital_speed_propagation 之所以上升，是因为承载朝圣者的同一个路站还远距离传送命令、报告、补贴和省级新闻。
    confirmation_logic: >-
      赞助商必须拥有或控制麦加或以其他方式持有所需的最终朝觐道路奇迹地点，最终建筑必须存在，国家不得破产，圣城/路区不得被占领、围困或遭受严重骚乱。路线对于朝圣者来说必须足够安全：如果实施可以检测到占领、路线隔离、袭击、破坏、封锁朝圣者使用的港口、对中转站的敌意控制或严重的宗教骚乱，则这些条件应该阻止确认。赞助者应该有足够的国库或收入来资助恐怖礼物、警卫、水和医疗支持，以及足够的国家权威或宗教凝聚力以使保护可信。战争不应该自动阻止仪式，但是威胁麦加、切断道路、清空国库或使守卫无法使用的战争应该阻止仪式的开始。
    start_logic: >-
      起始效果记录了赞助国、作为仪式地点的麦加、最终的朝觐道路建设以及辅助朝觐道路网络。它概括了奖励基线：对自己信仰的容忍度、与资本传播的距离或行政范围代理、宗教团结、稳定性或权威、财政/收入、合法性或虔诚（如果有）、人力/警卫能力、战争状态和宗教团体之间的动荡。它反映了当地和路线状况：麦加占领、动乱、破坏、朝圣能力、路线安全、良好状况、堡垒/中转站通道、当地繁荣以及影响朝圣者流动的任何封锁或隔离。它初始化用于准备钱包、横幅和礼物密封、警卫名册、骆驼和水供应、井检查、堡垒/中转站准备、部落或当地安全通行协议、法学家/医生陪同、朝圣者登记、路线报告和麦加收据的柜台。临时维护费用包括礼物、警卫工资、骆驼租赁、储水、医疗用品、宗教与社团组织管理以及水井和堡垒的维护。
    progress_logic: >-
      每月进度是在管理上可见的年度商队。财政部官员清点并封存了这个奇怪的钱包；抄写员抄写礼物清单和写给麦加的信件；警卫被分配到舞台；骆驼驾驶员登记动物和负载；水载体​​填充皮肤并修复水箱；井管理员报告深度和安全性；要塞指挥官准备护送；法学家和医生被分配到车队中；谈判人员与沿线社区确认安全行为；朝圣者按来源进行登记，以便可以调查失踪的群体。当麦加和道路安全、维护费用得到支付、宗教秩序稳定、路线报告清晰时，进展就会取得进展。因破产、占领、严重骚乱、袭击、关闭的水井、敌对的中转站、路线隔离、影响朝圣者通行的封锁或无法提供警卫和水而暂停。它通过高度的宗教团结、强大的财政、良好的稳定性/权威、安全的中转站、地方繁荣、满意的神职人员/乌拉玛以及强大的行政影响力而加速。如果战争遥远，则可以通过增加警卫成本来继续取得进展；如果战争威胁到道路或麦加，就应该停止。每个月的刻度还应该通过从车站发回报告来服务传播主题，而不仅仅是推动朝圣者前进。
    completion_logic: >-
      完成需要完成 surre、警卫、水、水井、中途站、安全通道、朝圣者登记处、法学家/医生、路线报告和麦加收据柜台。麦加必须继续受到赞助商的控制或有效保护，最终的建筑和辅助网络必须存在，国家不能破产，路线不能受到严重的破坏。最后的场景以商队在帝国旗帜下出发开始，以经过认证的抵达结束。埃米尔朝觐收到密封的钱包和路线信件；警卫就位；朝圣者和商人携带水袋和骆驼出行；报告从水井传递到堡垒再到中途站。在麦加，官员们打开礼品箱，确认幸存的登记团体的名称，并将收据寄回朝廷。这一奇迹成为国家能力，因为国家已经证明它可以保护神圣的旅程，资助圣城义务，并维持远距离的一系列报告和服务。
    failure_or_timeout_logic: >-
      在正常延迟情况下，辅助网络不应消失，但如果错过季节，年度商队计数器应该会衰减。如果赞助商失去麦加或所需场地、最终建筑物消失、辅助道路网络被拆除、国家破产、圣城被占领、或者路线因持续袭击或战争而关闭，则该计划失败或取消。严重的宗教骚乱、对朝圣者的袭击、空井、堡垒倒塌、港口堵塞或安全通行协议的丢失都可能会导致进展暂停，并可能重置朝圣者登记、水和路线报告计数器。如果道路在中断后恢复，则必须重新检查油井和安全通行协议。统治者的死亡本身并不重要，除非它导致了使萨雷命令或宗教合法性失效的危机。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对麦加或仪式地点的控制/保护，最终独特的朝觐道路建筑的存在，没有破产，没有占领或无效的围攻，没有活跃的重复仪式，可控的当地和宗教骚乱，以及足够的金库用于礼物和守卫。添加对路线安全、无障碍水井/中转站、无严重袭击或封锁、宗教团结、神职人员/乌拉玛合作和警卫能力的专题检查。
      start_effect_script: >-
        创建或激活辅助朝圣道路网络，将其绑定到赞助商和麦加，初始化钱包柜台，礼品密封，警卫名册，骆驼供应，水储存，井检查，堡垒/中转站准备情况，安全行为协议，法学家/医生伴奏、朝圣者登记、路线报告和麦加收据，应用临时维护，并存储宗教、行政、金库、路线和当地基线。
      snapshot_effect_script: >-
        刷新当前价值观，以容忍自己的信仰、资本到达或传播代理、宗教统一、稳定/权威、财政、合法性或虔诚、警卫/人力能力、战争状态、宗教骚乱、麦加占领、地方骚乱、破坏、朝圣容量、路线安全、良好状况、中途站访问、当地繁荣、封锁/隔离、最终建筑存在和辅助网络存在。保留扩展和失败的开始基线。
      progress_effect_script: >-
        在每月的刻度上，提前子计数器进行安全准备、礼物、守卫、骆驼、水、水井、堡垒、安全行为、法学家、医生、朝圣者登记、路线报告和最终收据。由于破产、占领、严重骚乱、袭击、空井、敌对的中转站、路线受阻、封锁、缺乏警卫或无偿维护而暂停或衰退。加速宗教团结、财政、稳定、神职人员支持、安全路线、当地繁荣和行政范围。
      completion_trigger_script: >-
        要求必要的商队柜台或总进度阈值、麦加或场地得到有效控制/保护、最终建筑和辅助网络存在、无破产、无占领、可管理的骚乱、安全路线、水和警卫供应完整，以及目的地的回执或同等确认。
      completion_effect_script: >-
        取消临时商队维护，认证辅助道路网络，应用永久国家修正以保持自身信仰宽容和资本距离传播速度，授予一次性虔诚/声望、稳定性、当地朝圣或路线安全奖励，添加当地朝觐道路记忆，清除瞬态变量，并保留持久的完成或冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留tolerance_own作为国家保护朝圣者并履行共同信仰的圣城义务时获得的内部凝聚力。保留global_distance_from_capital_speed_propagation作为连接遥远省份和麦加与帝国中心的水井、中途站、守卫和报告的行政效果。奖励应该保持宗教后勤作用，而不是贸易或军事征服效应。
      one_time_reward: 给予一次性威望或虔诚、稳定或宗教团结、麦加的当地繁荣/朝圣能力，并可能减少自己信仰的人群中的骚乱。如果袭击后路线安全，则将一部分用于路线安全或权力恢复。
      local_building_reward: >-
        麦加和道路应该记住安全收据、看守的水井、恢复的堡垒、商队登记、穆斯林宗教与社团组织账本、安全通行协议和旗帜出发协议。稍后的实施可以将其表达为当地朝圣价值、减少宗教骚乱、更快的行政传播或改善路线中断的恢复。
    notes: >-
      源仪式是直接的，但auxiliary_building模式更好地代表永久的朝圣基础设施。每月处理年度准备和通过周期。设计必须保持尊重：国家通过服务和保护朝觐来获得凝聚力，而不是通过将其商品化。实施时应将袭击、封锁路线、破产和占领圣城视为严重失败。奖励必须保持个人信仰的宽容和行政影响力。
- id: 138
  key: unique_persian_qanat
  base_key: hydraulic_workshop
  location: isfahan
  source_ritual_key: water_rights
  status: designed
  ritual_design_zh:
    title: 坎儿井水共享登记
    mode: auxiliary_building
    duration: >-
      辅助建筑模式是首选，因为坎儿井只有通过持续维护和公认的水法才能生存。辅助结构应代表穆卡尼隧道工作人员、竖井警卫、米拉布水务主管、水钟办公室、花园和田地份额登记册以及维修资金。每月 12 到 18
      个周期应涵盖母井检查、竖井清理、隧道修复、水测量、份额谈判和第一个完整的分配周期。
    listeners:
    - monthly
    historical_flavor: >-
      坎儿井水共享登记册属于波斯坎儿井网络，因为伊朗高原的繁荣往往依赖于无形的工程：缓坡的地下渠道将地下水从山麓输送到田野、花园、磨坊和城镇。参与者包括挖掘和修复隧道的穆卡尼专家、米拉布水利大师、村长、花园业主、耕种者、穆斯林宗教与社团组织或庄园管家、税务员、记录股份的法官或公证人、保护竖井的警卫、使用下游粘土和水的陶工和砖匠，以及果园和作坊依赖可靠水流的商人。这些地方包括母井、穿过干燥地面的竖井、地下渠道、沉淀池、配水池、伊斯法罕周围的花园、田野、磨坊以及审理纠纷的水法庭。这些物品包括铅垂线、挖掘镐、皮革水袋、井绳、隧道灯、测量杆、水钟或定时流动的碗、粘土片或纸质记录器、密封环、果园契约和修理征税账簿。其象征意义在于，干旱国家的生活就像水一样需要法律：国家通过让每根井都可维护、每一份份额都为公众所知，将隐藏的流量转化为繁荣。
      global_monthly_prosperity源自花园、田野、城镇水源，纠纷较少； global_raw_material_output 之所以上升，是因为灌溉支持农作物、水果、饲料、陶土、芦苇和动物生产。
    confirmation_logic: >-
      赞助商必须拥有或控制伊斯法罕，最后的坎儿井奇迹建筑必须存在，国家不能破产，坎儿井地区不能被占领、围困或发生严重的当地动乱。该仪式应该需要可用的含水层或水源代理、足够的劳动力和资金来修复隧道，以及足够的当地农业或园艺生产以使水共享有意义。如果实施能够检测到干旱、破坏、当地繁荣、原材料产出、财产纠纷、腐败或通往山麓的路线，那么这些应该会形成确认。严重的水骚乱、母井倒塌、全面干旱或无法执行份额都会阻碍启动。战争不应自动阻止仪式，除非它占领了伊斯法罕，危及竖井，或消耗了修复所需的劳动力和资金。
    start_logic: >-
      起始效果记录了主办国伊斯法罕作为仪式场地、最终的坎儿井建筑以及辅助的分水办公室。它反映了国家奖励基线：全球每月繁荣、全球原材料产量、财政/收入、稳定性或权威、行政效率、腐败、粮食/供应储备和战争状态。它反映了当地的情况：占领、动乱、破坏、繁荣、人口、花园/农业产出、含水层或取水、竖井状况、争议压力以及通往水源的路线安全。它初始化用于母井测量、竖井清理、隧道修复、坡度/流量测量、配水池清理、水钟校准、共享协商、登记密封、修复征费评估、警卫分配和首次分配的计数器。临时维护费用包括穆卡尼工资、绳索和灯具、倒塌竖井的维修、法律听证会、警卫以及等待轮到的田地的补偿。
    progress_logic: >-
      每月进度遵循隐藏通道。穆卡尼工作人员下井，清理落土，修复隧道衬砌，并测试地下斜坡是否仍能载水而不塌陷。测量员标记堵塞的竖井并将母井与下游盆地的流量进行比较。米拉布负责清洁配水池、校准水钟或定时轮流，并听取花园业主、村庄、磨坊和宗教与宗教基金庄园的索赔要求。公证人按小时、天或季节份额记录谁获得水；税务员分配修理费；警卫关闭非法砍伐；田间管理员检查哪些果园、粮田和饲料田可以首先浇水。当伊斯法罕得到控制、维护费用得到支付、竖井可以使用、有水并且争端仍然可控时，就会取得进展。它因破产、占领、严重动乱、全面干旱、母井崩溃、严重破坏、伪造股份的腐败或索赔人之间的暴力而暂停。稳定的权威、低腐败、熟练的劳动力、当地的繁荣、现有的农业产出和适度的水资源短缺使各方愿意接受登记，从而加速了这一过程。极度干旱应该阻碍分配，中度干旱可以让合法解决更有价值。
    completion_logic: >-
      完成需要母井、竖井、隧道、流量、分配、共享、登记、征税、看守、分配柜台齐全；伊斯法罕仍受控制；最终建筑和辅助水务办公室已存在；国家没有破产；水流量足以供公共分配。最后的场景发生在配水池和水场。穆卡尼工头展示来自检查井的灯和绳索；
      Mirab 倾倒或测量通过校准装置的第一流量；村庄和花园代表听到轮流朗读；法官或公证人对登记册进行封印；税务员记录修理费；防护装置标记受保护的轴。然后根据新的时间表将水输送到果园、田地和车间渠道。这一奇迹成为国家能力，因为隐藏的地下水已变得合法、可测量和可维护，支持干旱地区的繁荣和原材料生产。
    failure_or_timeout_logic: >-
      辅助网络不应该有严格的超时，但如果忽视的话，轴和共享工作应该会衰减。如果赞助商失去伊斯法罕、最后一座坎儿井建筑消失、辅助水务办公室被拆除、国家仍然破产或坎儿井地区被占领，则该活动失败或取消。严重的骚乱、水骚乱、母井倒塌、全面干旱、严重破坏、登记册腐败或拒绝支付维修费都会暂停进度，并可能减少隧道、共享和分配柜台。如果占领后恢复场地，则必须重新进行隧道测量和登记，因为可能存在隐藏损坏和非法开挖。远离伊斯法罕的战争只会影响金钱和劳动力；竖井附近的战争应该停止仪式。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对伊斯法罕的控制、最终独特的坎儿井建筑存在、没有破产、没有占领或无效的围攻、没有活跃的重复仪式、可控的当地骚乱以及充足的财政/劳动力。添加对水源接入、未倒塌竖井、当地农业或花园基地、可容忍的腐败、无严重水骚乱、无全面干旱情况（如果有）以及可执行的地方当局的专题检查。
      start_effect_script: >-
        创建或激活辅助水共享办公室，将其与赞助商和伊斯法罕绑定，初始化母井调查、竖井清洁、隧道修复、流量测量、流域清理、水钟校准、共享谈判、登记密封、维修征费、警卫的计数器分配和首次分配，应用临时维护，以及商店繁荣、原始产出、水、争端和当地基线。
      snapshot_effect_script: >-
        刷新全球月度繁荣、全球原材料产出、财政/收入、稳定/权威、行政效率、腐败、食品/供应、战争状态、伊斯法罕占领、动乱、破坏、繁荣、人口、花园/农业产出、供水、竖井状况、争端压力、路线安全、最终建筑存在和辅助网络的存在。保留扩展和故障决策的开始基线。
      progress_effect_script: >-
        在每月的刻度上，提前子计数器用于母井、竖井、隧道、坡度/流量、分配盆地、水钟、份额、登记册、维修费、警卫和首次分配。由于破产、占领、严重动乱、全面干旱、源头倒塌、严重破坏、暴力纠纷、腐败危机、拒绝征税或无偿维护而暂停或衰退。加速实现熟练劳动力、稳定的权威、低腐败、地方繁荣、现有产出和可管理的稀缺性。
      completion_trigger_script: >-
        要求必要的坎儿井柜台或总进度门槛，伊斯法罕控制，最终建筑和辅助办公室存在，没有破产，没有占领，可控的骚乱，工作水流，密封的股份登记册，分配的维修费，并且没有未解决的暴力水纠纷。
      completion_effect_script: >-
        取消临时坎儿井维护，认证辅助设施水共享办公室，应用永久国家修改器，保留每月的繁荣和原材料产出，授予一次性当地繁荣、粮食/原材料产出或减少动乱奖励，添加当地坎儿井寄存器内存，清除瞬时进度变量，并保留持久的完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保护global_monthly_prosperity，因为可靠的水、更少的纠纷、花园、城镇供应和稳定的旱地定居点的效果。保护global_raw_material_output作为坎儿井水流支持的灌溉作物、果园、饲料、粘土、芦苇和动物生产的影响。奖励应该保持水力和合法性，而不是一般的税收或声望效应。
      one_time_reward: >-
        给予当地一次性繁荣、粮食或原材料产出、减少因解决水权要求而引起的骚乱，或许还可以为执行公平份额提供少量的稳定或权威奖励。如果仪式解决了适度的干旱压力，则对恢复力和骚乱救济进行规模奖励。
      local_building_reward: >-
        伊斯法罕应该保留对调查母井、清理竖井、修复隧道、校准水钟、密封共享登记册、维修税、守卫竖井和第一个分配盆地的记忆。稍后的实施可以将其表达为当地繁荣、原始产出、抗旱能力、减少水纠纷动荡或更快地从破坏中恢复。
    notes: >-
      源仪式是直接的，但auxiliary_building模式更好地反映了坎儿井繁荣背后的永久维护和法律办公室。每月一次就足够了，因为这个过程是工程、测量和争端解决。实施过程中应避免让全面干旱完成仪式；适度的稀缺可以激励股票，但没有水就不能配置。奖励必须以繁荣和原始产出为重点。
- id: 139
  key: unique_longjiang_shipyard
  base_key: national_shipyard
  location: shangyuan
  source_ritual_key: zheng_he_departure
  status: designed
  ritual_design_zh:
    title: 宝船龙江出发
    mode: timed
    duration: >-
      定时模式是合适的，因为郑和出发是一个漫长的舾装周期的最后一次公开航行。每月十二到十八个刻度应代表木材采购、船体建造、填缝、帆和绳索问题、船员集合、口译员分配、贡品包装、星图审查、河流试验和季风调度。造船厂后来仍然很重要，但仪式本身就是一次伟大远征周期的证明。
    listeners:
    - monthly
    - ending_war
    historical_flavor: >-
      从龙江出发的宝藏船队属于明龙江造船厂，因为该造船厂将帝国的野心转化为木材、帆布、船员和航程。参加者有工部官员、历史想象中的郑和等太监航海统帅、造船工、填缝工、木工、锯工、制绳工、制帆工、操纵桅杆的人、引航员、指南针和星图专家、翻译人员、记贡和礼物账簿的文士、士兵和海军、医生、厨师、水桶制桶工、供应瓷器和丝绸的商人以及等待的外国使节。回来或印象深刻。这些地点包括上园/南京河堆场、龙江船台、木材池塘、索道、帆棚、仓库、军械库、长江沿岸和下游引海道。这些物品包括龙骨木、船体框架、嵌缝纤维、螺距、舵、桅杆、帆、绳圈、指南针、星图、水钟、贡品清单、圣旨、瓷器、丝绸、铜钱、礼品、武器、水桶和船员登记册。其象征意义是，在舰队到达海洋之前就已经到达了海上。
      naval_range 上升是因为船舶带着引航员、海图、物资、口译员和季风计划离开； ship_build_speed之所以上升，是因为造船厂记录了标准化的木材、劳动力、船台排序以及出发后可以重复使用的检查程序。
    confirmation_logic: >-
      赞助商必须拥有或控制上源，最后的龙江船厂奇迹建筑必须存在，国家不能破产，船厂和引道不能被占领、围攻、封锁或遭受严重动乱。该国应该有足够的财政、水手或船员能力、木材/材料供应以及海军管理部门来装备一支舰队。如果实施可以检测河流通道、港口通道、封锁、海军范围、造船速度、造船厂容量、商人或外交范围或海上战争，那么这些检查应该形成确认。如果河流和造船厂安全，战争不会自动阻止仪式，但敌对封锁、沿海通道丧失、木材短缺、工人无薪或船厂被占用应该会阻止仪式的开始。
    start_logic: >-
      起始效果记录了主办国、上元作为仪式场地、最终的造船厂建筑以及活跃的宝藏舰队舾装周期。它快照了奖励基线：海军航程、船舶建造速度、财政/收入、水手、海军规模、造船厂容量、木材或原材料供应代理、外交声誉或贡品范围（如果有）、贸易收入、战争/封锁状态和当地生产。它反映了当地的情况：占领、动乱、破坏、繁荣、河流通道、港口/海洋通道、造船厂状况、仓库安全和材料库存。它初始化木材采购、船体框架、填缝、桅杆和舵安装、帆和绳索问题、武器、水和食品储存、船员集合、翻译和特使登记、海图和指南针审查、贡品礼品包装、河流试验和季风出发等柜台。临时维护费用包括工资、木材、帆布、绳索、食品和水储存、礼物、军事护送以及按计划安排许多工匠的行政费用。
    progress_logic: >-
      每月进度从庭院地面移动到开放水域。官员审核木材交付并将其分配给船体；造船工人设置框架、木板侧面、填缝接缝和测试舵。索道生产索具；帆阁楼切割和标记帆布；桅杆船员安装桅杆；军械师发放武器；制桶工人装满水桶；医生和厨师检查商店。抄写员将船员登记与工资单进行比较，口译员按目的地分配，飞行员检查河口和季风航线，贡品文员密封礼物和清单。在船队冒险出海之前，河流试验会测试转向、帆操纵、装载和信号。当上原得到控制、维护费用得到支付、河道开放、物资到达、水手和工匠可用、当地动乱可控时，进展就会推进。如果破产、占领、封锁、严重动乱、木材短缺、仓库火灾/损失（如果表现为破坏、缺乏船员或封闭海岸的战争），它会暂停。它随着强大的财政、高造船厂产能、原材料供应、熟练劳动力、水手、当地繁荣和外交/贸易需求而加速。
      ending_war 侦听器应检查最近结束的战争是否保障了海上航线、船舶木材路线或沿海港口的安全；如果是这样，它可以验证进度，而海军失败或封锁应该施加修复债务而不是奖金。
    completion_logic: >-
      完成要求船体、索具、物料、船员、航行记录、礼物、河流试验和出发时间全部完成。上苑仍须控制，最终建筑仍须存在，国家不可破产，江海通道仍须畅通。最后一幕发生在龙江河畔。部委官员查阅造船厂账目；指挥官接受圣旨；飞行员展示指南针和海图；口译员手持贡品账簿站立；工作人员装载水桶、丝绸、瓷器、礼物和武器；造船师对船体和舵进行认证；鼓和旗标志着航行的顺序。船队按照指定的季风时间表沿着长江向大海驶去。这一奇迹成为了国家能力，因为龙江已经证明它可以反复快速建造大型船舶，并通过计划的供应、外交文件和训练有素的船员将它们运送到熟悉的水域之外。
    failure_or_timeout_logic: >-
      仪式不应有严格的暂停，但如果商店腐烂、工作人员分散或错过季风窗口，装修柜台就会腐烂。如果发起人失去商源、最终的造船厂建筑消失、国家破产、船厂被占领或河/海通道持续被封锁，则失败或取消。严重的骚乱、木材短缺、水手流失、仓库被毁、造船厂火灾或摧毁远征舰队的海军失败都会暂停进度，并可能重置船体、商店或船员计数器。如果上园被占领后被收回，船厂账目和物资库存必须重新审核。战争只能通过确保
      ending_war 的路线来提供帮助；不相关的陆地战争不应增加进度。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对上原的控制，最终独特的龙江建筑存在，没有破产，没有占领或无效围攻，没有封锁河流/海洋通道，没有活跃的重复仪式，可控的骚乱，以及足够的海军/造船厂基地。添加对水手、木材或原材料供应、金库、造船厂容量、港口通道以及没有严重工人或商人干扰的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和上元，初始化木材、船体、填缝、桅杆/舵、帆、绳索、武器、食物和水储存、船员集合、翻译/特使、海图/罗盘、贡品、河流试验和和季风出发，应用临时维护，并存储海军航程、造船速度、水手、造船厂容量、材料、外交/贸易、港口访问和战争的基线。
      snapshot_effect_script: >-
        刷新海军航程、造船速度、国库/收入、水手、海军规模、造船厂容量、原材料供应、外交/贸易范围、战争/封锁状态、上原占领、动乱、破坏、繁荣、河流访问、海上访问的当前值，造船厂状况、仓库安全、材料库存和最终建筑状况。保留缩放和故障的启动基线。
      progress_effect_script: >-
        在每月的刻度上，提前进行木材采购、船体框架、填缝、桅杆/舵安装、帆、绳索、武器、商店、船员集合、口译员、海图、礼物、河流试验和出发计划的子计数器。由于破产、占领、封锁、严重动乱、材料丢失、人员缺乏、仓库毁坏、港口关闭或无偿维护而暂停或衰退。加速财政、材料、造船厂产能、水手、熟练劳动力、当地繁荣和外交/贸易需求。在ending_war上，仅验证与探险相关的海上航道、沿海或海军结果。
      completion_trigger_script: >-
        需要基本的舰队计数器或总进度阈值、上元控制、最终建筑存在、无破产、无占领、开放的河流和海洋通道、可控的骚乱、已完成的河流试验、足够的船员和物资以及出发时密封的海图/礼品清单。
      completion_effect_script: >-
        消除临时装备负担，应用永久国家修正保持海军航程和船舶建造速度，授予一次性海军声望、水手、外交或当地造船厂吞吐量奖励，添加龙江出发记忆，清除瞬态变量，并保留持久的完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留naval_range作为海图、飞行员、口译员、水库、季风规划和外交路线知识的结果。通过有组织的龙江木材场、船台、专业人员、材料台账和重复检查例行工作，保护了ship_build_speed。奖励应该仍然是海上后勤，而不是一般的贸易收入。
      one_time_reward: >-
        授予一次性海军威望、水手或船员的战备状态、外交声誉以及当地造船厂的繁荣。如果ending_war验证了海上航线的安全性，则将一部分用于探索/航程动力或减少海军干扰，而不是现金。
      local_building_reward: >-
        商园应该记住标准化木材场、经过认证的船台、绳索和帆存储、飞行员图表室、翻译登记册、贡品仓库和河流试验协议。稍后的实施可以将其表达为本地船舶建造速度、距现场的海军范围、维修能力或更快的探险准备状态。
    notes: >-
      源仪式是即时的，但定时模式更好地代表了一次主要探险的装备。每月涵盖造船厂工作，包含 ending_war 仅用于审查海上航线或沿海安全结果。实施不应要求字面上的郑和或明标签检查，除非更广泛的模组数据已经使用它们；该设计以龙江的机构为重点。奖励必须保持海军射程和船舶建造速度，外交仅作为一次性或叙述性支持。
- id: 140
  key: unique_jerusalem_holy_city
  base_key: world_monument_group
  location: jerusalem
  source_ritual_key: holy_city_transfer
  status: designed
  ritual_design_zh:
    title: 圣城钥匙
    mode: timed
    duration: >-
      定时模式优于源立即模式，因为圣城转移是一个微妙的行政结算。每月六到十二个刻度应该代表保护大门、接收或确认神社钥匙、任命保管人、保护朝圣路线、听取宗教团体的请愿书、监管税收和提供公共担保。这是一个压缩但复杂的认可过程，而不是立即创造合法性的游行。
    listeners:
    - monthly
    - ruler_death
    historical_flavor: >-
      圣城的钥匙属于耶路撒冷，因为这座城市的力量来自于一个有围墙的城市系统内重叠的神圣地理和社区。参与者是赞助者的总督或王室代表、大门指挥官、法官、税务官员、主要圣地的公认监护人、赞助者自己信仰的神职人员和学者、国家允许的其他受保护社区的代表、朝圣者、为朝圣者交通服务的商人、抄写员、警卫和观察承诺是否兑现的外国使节。这些地方包括城门、神圣区域、适合时代和主人的教堂和清真寺庭院、广义上的前现代意义上的犹太教、基督教和穆斯林居住区、市场、朝圣者宿舍、蓄水池、城墙以及审理有关通行和税收纠纷的总督法院。这些物品包括大门钥匙、神社钥匙、监护文件、安全通行信、免税或确认书、灯、香、横幅、朝圣者的水和面包、警卫名册、法院印章和公共担保副本。其象征意义是在神圣压力下的克制：国家通过保持准入、秩序和尊重免遭掠夺或羞辱来证明权威。来源奖励如下。
      tolerance_own 上升是因为赞助商自己的信徒看到他们的神圣义务受到保护； diplomatic_reputation 的兴起是因为外国势力和社区承认一位能够维持有争议的圣城秩序的统治者；
      monthly_prestige之所以上升，是因为耶路撒冷受保护的圣地不断体现着国家的荣誉。
    confirmation_logic: >-
      赞助商必须拥有或控制耶路撒冷，最终的圣城奇迹建筑必须存在，国家不能破产，城市不能被占领、围困，或遭受严重的宗教或公民骚乱。进入主要圣地必须受到保护：如果实施过程中能够发现圣地被封锁、朝圣路线关闭、宿舍被敌对占领、破坏、宗教财产叛乱、低容忍度或外交孤立，那么这些条件就应该得到确认。赞助者应该有足够的资金或收入来支付警卫费用、修理大门、资助水和宿舍，以及补偿维护通道的管理员或官员。如果城市安全，战争不应自动阻止转移，但威胁耶路撒冷、关闭朝圣者路线或使外国担保变得毫无意义的战争应该阻止转移的开始。没有公认权威或没有严重继承危机的统治者不应该能够颁发可信的密钥和保护措施。
    start_logic: >-
      起始效果记录了主办国、作为仪式地点的耶路撒冷、最终的圣城建筑、当前的统治者或权威背景以及主动转移结算。它概括了奖励基线：对自己信仰的宽容、外交声誉、每月威望、当前威望、稳定性或合法性、宗教团结、神职人员/学术满意度、外交关系或特使压力（如果有）、国库/收入、战争状态和宗教动荡。它反映了耶路撒冷当地的状况：占领、围困、动乱、破坏、当地繁荣、朝圣者通道、大门安全、圣地通道、市场秩序、水/蓄水池状况和社区纠纷压力。它初始化大门安全、神社钥匙确认、保管人任命、朝圣者安全通行、税务保护、警卫名册、季度请愿听证会、市场/宿舍供应、神圣游行命令、外国通知和最终公共保证等柜台。临时维护代表了警卫、修理、施舍或招待、抄写工作、外交使者以及保护敏感城市的访问的政治成本。
    progress_logic: >-
      每月的进展是对神圣城市秩序的仔细解决。大门指挥官检查墙壁、钥匙和手表，以便游行队伍和朝圣者可以在没有突然暴力的情况下移动。托管人提出现有权利或请愿书；抄写员副本确认；法官审理有关通行时间、灯具、维修、通行费和市场行为的争议。大门和主要神社之间的路线上都有警卫；运水人和旅馆老板为朝圣者的到来做准备；税务官员确认哪些费用适用以及哪些保护得到保留；使者或使者将统治者的保证带到感兴趣的宫廷。当耶路撒冷受到控制、维护费用得到支付、圣地的出入开放、当地的骚乱可控、统治者的权威可信时，进步就会取得进展。它因破产、占领、围困、严重宗教暴力、朝圣路线受阻、辖区遭到亵渎或破坏、卫兵叛变或导致担保无法执行的外交危机而暂停。它以高度稳定性、强大的合法性、对赞助者信仰满意的神职人员、与当地社区的良好关系、良好的财政状况、当地繁荣和积极的外交而加速。
      ruler_death 侦听器应强制进行更新检查：顺利的继承可以通过立即重新发出保证来增加进度，而有争议的继承应暂停或衰减密钥和外部通知计数器。
    completion_logic: >-
      完成需要门、神社、保管人、朝圣者、税务、警卫、请愿、供给、游行、外交和担保柜台完成。耶路撒冷仍然必须受到控制，最终的建筑必须存在，国家不能破产，这座城市必须足够平静以得到公众的认可。最后的场景庄严而克制。在正门或州长法庭，大门钥匙和神社钥匙会在证人面前出示或确认。州长宣读统治者对赞助者神圣义务和国家选择保留的公认准入安排的保护保证。保管人收到密封文件；朝圣路线上有警卫驻守；税务官员公布受保护的会费；一支受约束的游行队伍穿过城市，没有抢劫或羞辱；外国特使或使者收到和解的副本。这一奇迹变成了国家能力，因为耶路撒冷从有争议的占有转变为受管理的神圣信托，产生威望、自身信仰凝聚力和外交可信度。
    failure_or_timeout_logic: >-
      仪式不应该有严格的超时时间，但如果不解决，肯定会腐烂。如果赞助商失去了耶路撒冷，最终的建筑消失，国家仍然破产，城市被占领或遭到决定性的围困，或者严重的宗教暴力使受保护的访问变得不可能，那么它就会失败或取消。圣地被封锁、朝圣路线关闭、大门/蓄水池被毁、保管人拒绝、因违反保证而发生的外国危机或继承危机都应该暂停进展，并可能减少钥匙、请愿和外交计数器。如果耶路撒冷在占领后被收复，所有钥匙、保管文件和税收保护都应重新检查。统治者的死亡并不是自动失败：顺利的重新颁布可以保持进步，有争议的统治会威胁到进步。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对耶路撒冷的控制，最终独特的圣城建筑的存在，没有破产，没有占领或无效的围攻，没有活跃的重复仪式，可控的公民和宗教骚乱，可信的统治者权威，以及足够的金库用于守卫和担保。添加对开放神殿/朝圣者通道、大门安全、低于严重阈值的当地破坏、神职人员或宗教庄园未发生叛乱、以及没有重大路线封闭或外交危机（如果有）的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和耶路撒冷，存储统治者/权威背景，初始化大门安全计数器，神殿钥匙，保管人，朝圣者安全行为，税收保护，警卫名册，季度请愿书，市场/旅馆供应，游行命令、对外通知和公共保障，应用临时维持，并存储宽容、外交、声望、稳定、宗教、地方和战争基线。
      snapshot_effect_script: >-
        刷新当前的信仰宽容、外交声誉、每月威望、当前威望、合法性/稳定性、宗教团结、神职人员满意度、外交压力、财政部、战争状态、宗教骚乱、耶路撒冷占领、围困、骚乱、破坏的当前值，繁荣、朝圣者通道、大门安全、神社通道、市场秩序、水/蓄水池状态、社区纠纷压力和最终建筑存在。保留扩展和失败决策的启动基线。
      progress_effect_script: >-
        在每月的刻度上，提前设置大门、神社钥匙、保管人、朝圣路线、税收担保、警卫、季度请愿书、宿舍和水、游行命令、外国通知和公共担保起草的子柜台。由于破产、占领、围困、严重的宗教骚乱、圣地被封锁、路线封闭、保管人拒绝、警卫失败、外交危机、继承争议或无偿维护而暂停或衰退。加速实现合法性、稳定、财政、神职人员支持、当地平静、繁荣和外交。在
        ruler_death 上，根据继承顺序要求续订或暂停。
      completion_trigger_script: >-
        需要必要的圣城转移计数器或总进度阈值、耶路撒冷受控、最终建筑存在、无破产、无占领或围攻、可控骚乱、开放神殿和朝圣者通道、公认的统治者权威、指定的保管人/守卫以及密封的公共担保。
      completion_effect_script: >-
        删除临时转移维护，应用永久国家修正保留自身信仰宽容、外交声誉和每月声望，授予一次性声望/稳定/外交或当地朝圣奖励，添加圣城记忆的本地钥匙，清除瞬时进度变量，并保留持久的完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留tolerance_own作为赞助者对国家保护耶路撒冷神圣义务的忠实信心。保留diplomatic_reputation作为通过保证而不是不受控制的夺取来管理有争议的圣城而获得的外部信誉。保护monthly_prestige作为受保护的保护区和朝圣者秩序的持续荣誉。奖励应该保持神圣外交，而不是转换或税收引擎。
      one_time_reward: 如果和平解决，则给予一次性威望、稳定或合法性、外交声誉进步、朝圣带来的当地繁荣以及减少宗教骚乱。如果发生继承更新，请将部分奖励分配给合法性而不是财富。
      local_building_reward: >-
        耶路撒冷应该记住已确认的大门钥匙、圣地保管文件、朝圣者安全通行路线、受保护的会费、警卫名册、市场/旅馆供应以及外国担保的副本。稍后的实施可以将其表现为当地朝圣价值、减少宗教骚乱、外交吸引力或围困后更快的恢复。
    notes: >-
      源仪式是即时的，但选择定时模式是因为圣城转移需要公共保障、准入安排和社区请愿。包含 ruler_death 是因为保证必须在新的统治者下更新。设计应保持尊重，避免将所有社区视为相同或一次性的；发起人通过维护秩序获得利益。奖励必须保持自己的信仰宽容、外交声誉和威望。
- id: 141
  key: unique_stonehenge
  base_key: megalithic_circle
  location: salisbury
  source_ritual_key: solstice_reckoning
  status: designed
  ritual_design_zh:
    title: 立石的至日推算
    mode: timed
    duration: >-
      定时模式是合适的，因为至日推算是观察、访问控制、本地调解和公众认可的季节性循环。十二个月的刻度应该代表一整年的地平线观察、场地清理、争端解决、供应、祖先景观解释和最后的黎明集合。即使最后的可见时刻是日出，它仍然是一个复杂的公民仪式。
    listeners:
    - monthly
    historical_flavor: >-
      立石的至日推算属于巨石阵，因为这座纪念碑持久的政治用途在于使深刻的时间和季节秩序可见。该设计不应假装了解单一可恢复的史前礼拜仪式。在前现代国家，巨石阵可以被牧师、学者、古物学家、当地贵族、村庄长老、测量员、牧民、农民和皇家官员重新解释为索尔兹伯里平原上的古代历法和祖先聚会场所。这些地方包括萨尔森圈、三石场、脚跟石引道、周围的手推车、游行路径、附近的放牧和田野边界、临时市场和营地区域，以及观察日出和日落的观察点。这些物品包括瞄准棒、粉笔标记、界线、火把、炉边余烬、时令食品、宣誓杖、土地卷、适合赞助者文化的祭品，以及将种植、放牧、税收和集会日期与计算年份联系起来的书面或口头日历。其象征意义并不是石头能神奇地稳定境界。相反，国家利用一个受人尊敬的古老地方来确定时间和记忆：当社区就季节、集会和祖先见证达成一致时，就会减少让人感觉任意的改革和义务。这解释了来源奖励，stability_cost_efficiency：纪念碑降低了恢复秩序的政治成本，因为统治者可以将变化包含在可接受的日历和共享景观中。
    confirmation_logic: >-
      赞助商必须拥有或控制索尔兹伯里，最终的巨石阵奇迹建筑必须存在，国家不能破产，巨石不能被占领、被围困、无法进入或遭受严重的当地动乱。该地点应该足够安静，适合聚集的贵族、神职人员或学者、平民和市场追随者。如果实施能够检测到文化凝聚力、宗教紧张、当地繁荣、破坏、庄园忠诚、合法性/稳定性或对周围道路的控制，这些信号应该形成确认。在饥荒程度严重短缺、索尔兹伯里平原发生叛乱或继承/政府危机严重到没有议会愿意接受清算的情况下，不应该开始仪式。远方的战争不应阻止它，但占领平原或征用所有食物和卫兵的军队应该阻止它的开始。
    start_logic: >-
      起始效果记录了赞助国、作为仪式地点的索尔兹伯里、最终的巨石阵建筑以及活跃的计算年份。它概括了与回报相关的国家价值观：稳定成本或当前的稳定压力、稳定水平、合法性或权威、文化凝聚力、宗教团结、财产忠诚度、国库/收入、战争状态和动乱。它反映了当地的情况：占领、动乱、破坏、繁荣、道路、粮食/供给能力、当地文化接受度以及手推车/石路是否完好无损。它初始化地平线观察、石头通道清理、手推车和边界尊重、地方争端调解、日历起草、贵族和神职人员/学者出席、村庄供应、市场秩序、火把/炉灶准备和最后的夏至集会等计数器。临时维护包括警卫、供给、道路清理、抄写员或传令官、对中断放牧的补偿以及对与会者的招待。
    progress_logic: >-
      每月的进度应该感觉像是建立一个共享日历。观察者根据脚跟石和主要石头标记日出和日落的位置，重复记录而不是依赖于一个早晨。测量员在不损坏纪念碑的情况下清理道路，标记安全观看地点，并解决附近放牧或田野边界的争端，这些争端可能会破坏聚会。当地贵族和长老被召集来听取哪些集会日、纳税截止日期、种植信号和集市日将与清算相关。神职人员、学者或仪式专家将古代遗址翻译成赞助者的信仰和文化可以接受的术语。村庄准备食物、火把、帐篷和市场秩序；警卫阻止人群攀爬或破坏石头；抄写员起草一份公告，将观察的季节与国家秩序联系起来。当索尔兹伯里受到控制、维护费得到支付、骚乱可控、道路开放、食物/供给充足时，进展就会取得进展。它因破产、占领、严重骚乱、遗址损坏、饥荒、文化或宗教拒绝、道路堵塞或严重破坏而暂停。它以高度合法性、文化凝聚力、稳定的财产、地方繁荣、良好的财政状况和低动荡而加速。如果国家不稳定但现场保持平静，进展应该继续缓慢，因为仪式的目的是为了让稳定变得更便宜。
    completion_logic: >-
      完成需要完成地平线观察、通道清理、边界解决、日历起草、出席、规定、市场秩序和最终组装柜台。索尔兹伯里仍然必须受到控制，最终的建筑必须存在，国家不能破产，黎明集会的地点必须安全。最后一幕在日出之前开始。贵族、当地长老、神职人员或学者、测量员、村民和皇家官员站在石头和手推车附近的指定地点。当至日太阳与标记的地平线对齐时，观察者证实了这一推算。根据当地习俗熄灭或更新火把或壁炉余烬；统治者的官员宣读集会日历、义务、集市日和和解条款；年内解决的边界争端将在证人面前公布。这一奇迹成为国家能力，因为国家已将古老的纪念性景观变成了共享的秩序时间表。未来的稳定努力成本更低，因为它们可以被定义为返回到计算的年份，而不是强加任意命令。
    failure_or_timeout_logic: >-
      如果错过一个至日，仪式应该延续到下一个季节周期，而不是立即失败，但重复的延迟应该会降低出席率和日历计数器。如果赞助商失去索尔兹伯里、最后一座巨石阵建筑消失、国家仍然破产、场地被占领，或者当地严重骚乱导致集会无法进行，那么活动就会失败或取消。石头损坏、饥荒、道路封闭、宗教或文化拒绝、庄园叛乱或平原破坏都会暂停进度，并可能重置出勤和供给计数器。如果该场地在占领后恢复，则必须重复进行通道清理和边界调解。统治者的死亡应该不重要，除非它产生了合法性危机，导致日历公告无效。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对索尔兹伯里的控制，最终独特的巨石阵建筑存在，没有破产，没有占领或无效的围攻，没有活跃的重复仪式，可控的当地骚乱，可访问的地点，以及足够的规定/金库用于集会。添加对文化或宗教接受度、庄园合作、道路通行、低于严重阈值的当地破坏以及不存在使公众清算毫无意义的危机的专题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和索尔兹伯里，初始化地平线观察、通道清理、手推车/边界尊重、争端调解、日历起草、贵族出席、神职人员/学者出席、村庄规定、市场秩序、火炬/炉灶准备和最后组装的计数器，应用临时维护，
      snapshot_effect_script: >-
        刷新稳定成本或稳定压力、稳定性、合法性/权威、文化凝聚力、宗教团结、遗产忠诚度、国库/收入、战争状态、国家动乱、索尔兹伯里占领、当地动乱、破坏、繁荣、通道、粮食容量、当地文化接受度、场地条件和最终建筑存在的当前值。保留扩展和失败决策的开始基线。
      progress_effect_script: >-
        在每月的刻度上，提前子计数器进行地平线监视、路径清理、纪念碑保护、手推车/边界调解、日历公告起草、出勤、供给、市场秩序、警卫巡逻和夏至准备。由于破产、占领、严重动乱、遗址损坏、饥荒、道路封闭、文化/宗教拒绝、庄园叛乱、严重破坏或无偿维护而暂停或衰退。加速实现合法性、文化凝聚力、庄园忠诚度、地方繁荣、财政和低动荡。
      completion_trigger_script: >-
        需要基本的计算计数器或总进度阈值、索尔兹伯里控制、最终建筑存在、无破产、无占用、可控的骚乱、可接近且未损坏的石头、足够的出勤/供给、以及观察到的至日或同等的最终黎明条件。
      completion_effect_script: >-
        删除临时组装维护，应用永久国家修改器保留降低的稳定性成本，授予一次性稳定性/声望或本地凝聚力奖励，添加本地巨石阵计算记忆，清除瞬态变量，并保留持久的完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留stability_cost_efficiency减少作为唯一的永久源主题。它代表着恢复秩序的政治成本较低，因为国家将集会、义务和和解与公认的古代历法联系在一起。不要将其变成广泛的声望、研究或宗教皈依修饰语。
      one_time_reward: 给予一次性的稳定进步、合法性或威望、减少当地骚乱以及文化凝聚力。如果国家开始时有中度不稳定，但和平地完成了清算，请将奖励分配给稳定救济而不是金钱。
      local_building_reward: >-
        索尔兹伯里应该记住清理的通道、受保护的石头、手推车边界、记录的地平线标记、集会日历、解决的争端和补给路线。稍后的实施可以将其表达为当地骚乱减少、文化接受、稳定成本支持或混乱后更快的恢复。
    notes: >-
      源仪式是即时的，但每月定时模式更好地捕捉完整的夏至周期。该设计刻意避免假装了解确切的史前学说；它模拟了一个前现代国家使用古代纪念碑作为日历和集会场所的情况。奖励必须集中于降低稳定性成本。竣工应因占领、饥荒、场地损坏或公众拒绝而受阻。
- id: 142
  key: unique_tower_of_london
  base_key: star_fortress_city
  location: london
  source_ritual_key: crown_jewel_warding
  status: designed
  ritual_design_zh:
    title: 皇冠宝石守卫和自耕农监视
    mode: auxiliary_building
    duration: >-
      辅助建筑模式是首选，因为皇冠宝石守卫是一个永久保管系统：珠宝店守卫、警察官员、军械库职员、铸币厂或国库审计员（如果适用）、河门看守、囚犯看守和密封箱。六到十二个月的刻度应代表一次完整的审计和值班轮换，而辅助保管办公室仍然是伦敦塔的持久机构机构。
    listeners:
    - monthly
    - ruler_death
    historical_flavor: >-
      皇冠宝石监护和自耕农值守属于伦敦塔，因为伦敦塔是皇家权威成为受监护财产的地方。参与者包括君主或皇家议会、伦敦塔警察、珠宝店看门人、看守、卫戍部队士兵、军械师、财政部职员、造币厂官员（当该职能代表时）、记录员、监狱官员、传令官、贵族人质或地位较高的囚犯（如果有）以及观看泰晤士河逼近的城市官员。这些地方包括白塔、幕墙、珠宝屋、军械库、金库或铸币室、教堂、河门、囚犯塔、保险库以及伦敦和王室之间的守卫路线。这些物品包括王冠、权杖、宝珠、国家剑、宝石板、印章、钥匙、库存卷、庄园章程、硬币模具、盔甲、上锁的箱子、守卫账单和誓言书。其象征意义是，王室的财产权力依赖于安全监护：王权证明继承权，印章授权土地和收入，军械库执行王室指挥，囚犯或人质提醒权贵们，君主在首都有一座堡垒。
      global_crown_estate_power 之所以崛起，是因为伦敦塔将个人王权变成了受保护的机构财产。
    confirmation_logic: >-
      赞助商必须拥有或控制伦敦，伦敦塔最后的奇迹建筑必须存在，国家不得破产，并且塔区不得被占领、围攻、封锁泰晤士河（如果有这样的条件），或遭受严重的当地骚乱。国家应该有一个有效的统治者或公认的继承权，足够的国库来支付警卫费用，以及足够的资本安全来保护王权和印章。如果实施可以检测王室实力、合法性、高贵忠诚、驻军实力、首都状况、当地堡垒状况或继承危机，这些检查应该形成确认。战争不应自动阻止仪式，但威胁伦敦的战争、无薪驻军、贵族叛乱或严重到足以使监护权无效的有争议的继承权应该阻止启动。
    start_logic: >-
      启动效果记录了主办国、作为仪式地点的伦敦、最终的塔楼、当前的统治者或继承背景以及辅助监护办公室。它快照了奖励基线：全球王室权力、合法性或权威、贵族忠诚、国库/收入、稳定性、资本状况、驻军实力、战争状态和动乱。它快照了当地塔楼的状况：占领、围攻、骚乱、破坏、堡垒状况、河门通道、军械库安全、金库/铸币厂通道（如果有代表）、囚犯安全和当地繁荣。它初始化用于王权库存、珠宝印章检查、钥匙轮换、看守宣誓、驻军工资、军械库审计、造币厂或国库审计、遗产宪章验证、囚犯登记、河门值班和继承转移准备的计数器。临时维护费用包括警卫工资、锁和箱子修理、文员时间、军械库维护、记录的安全运输以及宣誓仪式费用。
    progress_logic: >-
      每月的进度是对王室监护权的审计。珠宝保管者在证人面前打开箱子，将每件王冠、权杖、剑、板甲和印章与库存进行比较，并用注明日期的标记重新密封。看守轮换钥匙和值夜；驻军军官给士兵发工资并检查塔楼；军械师清点武器和盔甲；财政部或造币厂职员比较硬币模具、金条或税收印章（如果这些功能处于活动状态）；记录保管员核实与皇家土地和收入相关的特许状。河闸看守人员检查泰晤士河引道，监狱官员确认高级囚犯或人质的安全和合法记录。当伦敦被控制、维持费得到支付、驻军忠诚且当地骚乱可控时，进步就会推进。它因破产、占领、围困、严重动乱、盗窃或封印破损、守卫无薪、贵族叛乱或继承争议而暂停。它以强大的合法性、忠诚的贵族、良好的财政、强大的驻军、首都地位、低动荡和现有的王室权力而加速。
      ruler_death听众应该强制进行王权转移检查：顺利的继承通过证明珠宝和印章可以交给新的统治者来增加进度，而有争议的继承应该暂停或腐烂库存和誓言计数器。
    completion_logic: >-
      完成需要王权，印章，钥匙，看守，驻军，军械库，金库/造币厂，宪章，囚犯，河门和继承准备计数器要完整。伦敦仍然必须受到控制，最终的塔楼和辅助保管办公室必须存在，国家不能破产，王权不能有争议。最后的场景发生在守卫森严的内塔中。警察将钥匙交给皇家委员会；珠宝保管者展示密封的王权；文员阅读库存和遗产宪章清单；军械师展示军械库数量；看守们宣誓值班；驻军军官确认工资和职位；河门在见证下被封。如果新统治者最近继任，王权将正式移交给该统治者的权力。这一奇迹变成了国家能力，因为王室的土地、印章、珠宝、武器和强制监管显然都安全地集中在一个首都要塞中，从而加强了王室对王室财产的控制。
    failure_or_timeout_logic: >-
      辅助监管办公室不应该有正常的超时，但如果被忽视，审计计数器应该会衰退。如果赞助商失去伦敦、最终的塔楼消失、辅助办公室被拆除、国家仍然破产、塔楼被占领或遭到决定性围困、或者王冠丢失或政治上无效，则该计划失败或取消。严重的骚乱、贵族叛乱、无薪驻军、封印破损、囚犯逃跑、军械库破坏或有争议的继承权都会暂停进度，并可能重置誓言、库存和转移计数器。如果伦敦在占领后收复，所有珠宝、印章、武器、囚犯和特许状都必须经过全面重新审核。战争仅通过塔楼安全、金库和继承压力产生影响；战场胜利不应直接授予进度。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对伦敦的控制、最终独特的塔楼建筑存在、没有破产、没有占领或无效围攻、没有活跃的重复仪式、可控的当地骚乱、正在运作的统治者或公认的权威，以及足够的金库/驻军力量进行监管。添加对资本状况、贵族忠诚、王室背景、河流/港口访问（如果相关）、军械库/金库访问以及无严重继承危机的主题检查。
      start_effect_script: >-
        创建或激活辅助监护办公室，将其绑定到赞助商和伦敦，存储统治者/继承上下文，初始化王权库存、宝石印章、钥匙轮换、看守誓言、驻军工资、军械库审计、造币厂/财政部审计、遗产特许、囚犯登记、河门监视和继承转移准备情况的计数器，应用临时维护，并存储王室财产、合法性、贵族、驻军、国库和地方
      snapshot_effect_script: >-
        刷新全球王权、合法性/权威、高贵忠诚、国库/收入、稳定性、资本状况、驻军实力、战争状态、动乱、继承状态、伦敦占领、围困、当地动乱、破坏、要塞状况、河门通道、军械库安全、金库/造币厂通道、囚犯安全、最终建筑存在和辅助办公室存在的当前值。保留扩展和失败决策的开始基线。
      progress_effect_script: >-
        在每月的刻度上，提前子计数器进行王权库存、印章检查、钥匙、看守誓言、驻军工资、军械库计数、造币厂或国库审计、遗产宪章验证、囚犯登记、河门监视和转移准备。因破产、占领、围困、严重动乱、封印破损、盗窃、无薪守卫、贵族叛乱、囚犯越狱、有争议的继承权或无偿维持费而暂停或衰退。加速争取合法性、高贵的忠诚、财政、强大的驻军、资本安全和现有的王室权力。在
        ruler_death 上，要求顺利转移或暂停。
      completion_trigger_script: >-
        需要必要的托管柜台或总进度阈值、伦敦控制、最终建筑和辅助办公室存在、没有破产、没有占领或围攻、可控的骚乱、安全的徽章和印章、付费驻军、没有未解决的继承纠纷以及已完成的钥匙和特许审计。
      completion_effect_script: >-
        删除临时托管维护，认证辅助塔托管办公室，应用永久国家修正值保留王权，授予一次性合法性/资本安全/声望或高贵忠诚奖励，添加本地塔楼守护记忆，清除瞬态变量，并保留持久的完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留global_crown_estate_power作为塔楼的直接历史意义：守卫的王权、印章、特许权、军械库、囚犯和财政部职能使王室的财产和特权可执行。不要将要塞防御或军队士气作为永久效果。
      one_time_reward: 通过完成的清单和誓言授予一次性合法性、威望、高贵的忠诚、资本安全或财政信心。如果ruler_death续约有所贡献，则将部分奖励转向继承稳定性而不是金钱。
      local_building_reward: >-
        伦敦应该保留密封珠宝箱、钥匙轮换、看守誓言、军械库库存、遗产特许状、囚犯登记册和河门手表的记忆。稍后的实施可以将其表达为当地堡垒安全、减少首都的继承骚乱、王室财产执法或改善围困后的恢复。
    notes: >-
      源仪式是直接的，但auxiliary_building模式更好地捕获永久保管和审计。占位符包括 pre_winning_war，但此设计将其删除，因为奖励来源是王室权力，而不是战场信心。 ruler_death
      仍然很重要，因为王权转移是继承过程中的核心。实施过程中应将盗窃、占领、无薪警卫和有争议的继承权视为严重的阻碍因素。
- id: 143
  key: unique_notre_dame_de_paris
  base_key: grand_cathedral
  location: paris
  source_ritual_key: cathedral_crown_procession
  status: designed
  ritual_design_zh:
    title: 西岱岛上的皇冠游行
    mode: timed
    duration: >-
      首选定时模式，因为游行是大型大教堂赞助计划的公众形象。十二个月的刻度应代表礼拜仪式规划、研讨会合同、唱诗班准备、行会参与、雕塑和玻璃委员会、路线安全以及穿过西岱岛的最后皇家或公民游行。这个仪式并不是一个简单的加冕仪式，而是一个简单的仪式。法国可能会在其他地方加冕，而巴黎圣母院则将巴黎人的虔诚和艺术转化为宫廷文化。
    listeners:
    - monthly
    - ruler_death
    historical_flavor: >-
      西岱岛的皇冠游行属于巴黎圣母院，因为这座大教堂将皇室存在、主教权威、城市行会生活、学术学习、音乐、雕塑、玻璃和首都稠密中心的朝圣活动结合在一起。参与者包括主教和大教堂分会、王室官员、宫廷成员、大学校长和学生、金匠、玻璃匠、雕塑家、泥瓦匠、画家、书籍插画家、管风琴师、唱诗班成员、行会长老、兄弟会、朝圣者和塞纳河沿岸的商人。这些地方包括西立面、玫瑰窗、中殿、唱诗班、教堂、金库、教堂、西岱岛的桥梁、附近的皇家和法律建筑、行会街道和河码头。这些物品包括游行十字架、圣物神龛、唱诗班书籍、蜡蜡烛、行会旗帜、用于展示的皇家斗篷或皇冠符号、图案图、石头模型、彩色玻璃卡通、颜料盒、脚手架、雕刻首都和密封的委托合同。其象征意义是巴黎成为一座神圣仪式滋养艺术就业的城市。皇家游行提供了可见性，但持久的国家能力是在享有声望的赞助下形成艺术家、音乐家、图像制作者和工匠的作坊和学校网络。
      num_possible_artists 的崛起是因为大教堂为额外的伟大艺术家提供了佣金、培训、观众和合法性来为这个领域服务。
    confirmation_logic: >-
      赞助商必须拥有或控制巴黎，最后的巴黎圣母院奇迹建筑必须存在，国家不能破产，大教堂和西岱岛不能被占领、围困、烧毁/毁坏，或陷入严重的当地动乱。国家应该有足够的国库或收入来资助佣金、游行安保、蜡烛、音乐和研讨会材料。如果实施能够检测神职人员的满意度、文化传统、艺术家的能力、当地的繁荣、大学或学者的存在、行会合作、合法性或路线访问，那么这些都应该形成确认。战争不应该自动阻止仪式，但威胁巴黎、关闭桥梁或掏空国库的战争应该阻止这一仪式。统治者死后，如果继承有序，就不会阻碍；它可以将仪式转变为纪念或登基感恩节。严重的宗教叛乱或行会罢工应该会阻止确认。
    start_logic: >-
      起始效果记录了赞助国、作为仪式地点的巴黎、最终的大教堂建筑、当前的统治者或继承背景以及活跃的赞助游行周期。它快照了奖励基线：可能的艺术家能力、当前艺术家或文化资源（如果有）、声望、合法性、神职人员支持、文化影响力、财政/收入、稳定性、战争状态和城市动乱。它反映了巴黎当地的情况：占领、围困、动乱、破坏、繁荣、大教堂的可用性、桥梁/路线的通行、行会合作、学者/大学的存在、研讨会的容量和朝圣的通行。它初始化礼拜日历、唱诗班和音乐准备、文物/金库展示、行会旗帜登记、皇家路线安全、雕塑家委员会、玻璃工委员会、手稿/音乐委员会、工作坊材料供应、学者布道或辩论以及最后游行的柜台。临时维护费用包括蜡烛、唱诗班津贴、石材和玻璃材料、画家颜料、行会招待费、警卫、脚手架和皇家/大教堂的行政费用。
    progress_logic: >-
      每月的进度是赞助变成仪式。大教堂的大炮决定节日的日期和游行的顺序；合唱团指挥排练圣歌和复调音乐；风琴师和抄写员准备音乐书籍。国库库存有文物和器皿供展示。公会长老提交横幅并确认他们在路线中的位置。泥瓦匠和雕塑家展示石模型或门户修复；玻璃工准备玻璃卡通片和铅；画家和插画家接受面板、手稿或礼拜书籍的委托；大学大师起草连接王室、城市和大教堂的布道或公开辩论。警卫负责保护桥梁、桥梁和河道。当巴黎被控制、维护费得到支付、神职人员和行会合作、大教堂可用、当地骚乱可控时，进展就会推进。它因破产、占领、围困、严重骚乱、大教堂受损、神职人员拒绝、行会混乱、路线封闭或缺乏研讨会资金而暂停。它随着崇高的威望、强大的财政、地方繁荣、满意的神职人员、学者的存在、现有的文化传统和稳定的合法性而加速。
      ruler_death听众应将游行转换为登基感恩节或纪念周期：顺利的继承会增加进度，而有争议的继承则会延迟皇家路线和赞助合同。
    completion_logic: >-
      完成需要礼仪、唱诗班、圣物、行会、路线、雕塑、玻璃、手稿/音乐、材料、学者和游行柜台完成。巴黎必须保持控制，最终的建筑必须存在，国家不能破产，大教堂必须安全供公众集会。最后的场景从帕尔维斯开始，穿过巴黎圣母院。神职人员携带十字架和圣物游行；行会举着横幅入场；学者和合唱团就座；皇家官员陪同皇冠标志或君主庄严入场；法院确认了一系列玻璃、雕塑、书籍、音乐和教堂的委托。艺术家在分会和法庭上展示模型或样品作品，密封的合同存放在大教堂的金库中。这一奇迹成为国家能力，因为巴黎现在拥有公认的神圣艺术、音乐、学术展览和皇家赞助的管道，能够维持另一位主要艺术家的发展。
    failure_or_timeout_logic: >-
      仪式可以在没有严格超时的情况下暂停，但如果反复错过游行季节，工作坊和出勤计数器就会下降。如果赞助商失去巴黎、最后一座大教堂建筑消失、国家仍然破产、大教堂被占领或严重损坏，或者严重的宗教/城市骚乱阻碍集会，集会就会失败或取消。公会拒绝、神职人员冲突、路线封闭、金库故障或有争议的继承权都会暂停进度，并可能重置游行和委托计数器。如果巴黎在占领后收复，则必须重复清点金库、遗迹、路线和工场。遥远的战争应该只影响成本；巴黎战争应该停止仪式。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对巴黎的控制、最终独特的巴黎圣母院建筑存在、没有破产、没有占领或无效围攻、没有活跃的重复仪式、可控的当地骚乱、可用的大教堂以及足够的佣金金库。添加对神职人员支持、行会合作、文化/学者存在、穿过城市的路线访问、当地繁荣以及没有严重继承或宗教危机的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和巴黎，存储统治者/继承背景，初始化礼拜日历、唱诗班/音乐、文物展示、行会横幅、路线安全、雕塑委员会、玻璃委员会、手稿/音乐委员会、材料、学者布道或争论和最后游行，应用临时维护，并存储艺术家能力、声望、神职人员、文化、财政和当地基线。
      snapshot_effect_script: >-
        刷新可能的艺术家、文化资源、声望、合法性、神职人员支持、文化影响力、财政/收入、稳定、战争状态、巴黎占领、围困、骚乱、破坏、繁荣、大教堂可用性、桥梁/路线通道的当前值，行会合作、学者/大学存在、研讨会能力、朝圣通道、最终建筑存在以及统治者/继承国。保留扩展和失败决策的开始基线。
      progress_effect_script: >-
        在每月的刻度上，提前子计数器用于礼拜仪式、唱诗班、文物、公会横幅、路线守卫、雕塑、玻璃、手稿/音乐、材料、学者参与和游行准备。由于破产、占领、围攻、大教堂损坏、严重动乱、神职人员拒绝、行会混乱、路线封闭、有争议的继承权或无偿维护而暂停或衰退。加速声望、财政、地方繁荣、神职人员支持、学者存在、文化传统和稳定。在ruler_death上，只有在继承有序的情况下才转换为纪念/登基进度。
      completion_trigger_script: >-
        需要基本的赞助/游行柜台或总体进度，巴黎控制，最终建筑存在，没有破产，没有占领或围困，可控制的骚乱，可用的大教堂，资助的委员会，合作的神职人员/行会，并且没有阻碍王室的未解决的继承危机游行。
      completion_effect_script: >-
        删除临时赞助维护，应用永久国家修改器保留额外的艺术家能力，授予一次性声望/文化或当地繁荣奖励，添加圣母院研讨会游行记忆，清除瞬态变量，并保留持久的完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留num_possible_artists作为核心奖励。圣母院的分会、工作坊、行会委员会、音乐、玻璃、雕塑和学术仪式为该领域的另一位伟大艺术家提供了空间。不要用一般威望或神职人员忠诚来取代它作为永久效果。
      one_time_reward: >-
        授予一次性威望、文化影响力、神职人员满意度、朝圣和行会工作带来的当地繁荣，或者成功的王室入主带来的适度合法性提升。如果ruler_death重新调整仪式的方向，则应将规模转向纪念声望或继承合法性而不是金钱。
      local_building_reward: >-
        巴黎应该保留对唱诗班书籍、工作坊合同、雕塑家和玻璃工模型、行会横幅、文物展示路线、学者布道以及通往大教堂的守卫桥梁的记忆。后来的实施可以将其表达为当地文化输出、艺术家招募、声望或减少重大节日期间的城市骚乱。
    notes: >-
      源仪式是直接的，但定时模式更好地代表了额外艺术家时段背后的赞助渠道。包含 ruler_death 是因为皇家纪念或登基游行可以重复使用圣母院的仪式，但有争议的继承不得创造自由进展。这并不是兰斯加冕典礼的原型；这是巴黎的皇冠游行和大教堂艺术节目。奖励必须始终以艺术家的能力为中心。
- id: 144
  key: unique_st_basils_cathedral
  base_key: grand_cathedral
  location: moscow
  source_ritual_key: intercession_of_moscow
  status: designed
  ritual_design_zh:
    title: 彩绘圆顶代祷游行
    mode: timed
    duration: >-
      优先选择定时模式，因为代祷游行需要重复准备：教堂、圣像、钟声、施舍、红场安保、布道、胜利记忆和公众出席必须在一个盛宴周期内协调一致。每月六到十二次的滴答声足以将其与克里姆林宫加冕礼区分开来，同时仍然通过可见的城市奉献而不是即时点击来获得合法性。
    listeners:
    - monthly
    - ruler_death
    historical_flavor: >-
      彩绘圆顶的代祷游行属于圣瓦西里大教堂，因为这座教堂更正式地与代祷和喀山的记忆联系在一起，矗立在红场上，神圣的奉献、胜利纪念、市场生活和沙皇奇观在这里相遇。参与者包括沙皇或王室代表、莫斯科神职人员、圣像持有者、敲钟人、歌手、克里姆林宫卫兵、与边境胜利有关的退伍军人或指挥官、施舍管理员、红场商人、朝圣者、贫困请愿者以及防止人群骚乱的城市官员。这些地方包括大教堂密集的教堂、彩绘圆顶、红场、克里姆林宫大门的路线、市场行、附近的墙壁和护城河记忆，以及图标或横幅停顿的车站。这些物品包括代祷者和当地圣人的圣像、蜡烛、钟声、游行十字架、胜利旗帜、施舍碗、面包、绣花布、教堂灯、布道书、守卫杖和捐款记录。象征意义是统治者在保护和胜利的神圣记忆下反复站在人民面前。
      monthly_legitimacy之所以崛起，是因为大教堂以公开形式表达了这样的主张：莫斯科的统治者受到信仰的捍卫，将胜利视为义务，并在可见的仪式空间中喂养或聆听这座城市。
    confirmation_logic: >-
      赞助商必须拥有或控制莫斯科，最后的圣瓦西里大教堂奇迹建筑必须存在，国家不能破产，红场/大教堂区不得被占领、围困或遭受苦难当地发生严重骚乱。国家应该有一个有效的统治者或公认的继承权，有足够的国库来资助施舍、蜡烛、卫兵和神职人员，以及足够的宗教秩序来接受游行。如果实施能够检测神职人员的满意度、合法性、声望、当地繁荣、首都地位、战争记忆或克里姆林宫和大教堂之间的路线安全，那么这些应该会形成确认。战争不会自动阻止这一仪式，但威胁莫斯科、关闭红场或使国家破产的战争应该阻止这一仪式。有争议的继承应该阻止开始，除非在秩序重建后故意使用仪式来恢复认可。
    start_logic: >-
      起始效果记录了赞助国、作为仪式地点的莫斯科、最终的大教堂建筑、当前的统治者/继承背景以及活跃的盛宴游行周期。它快照了奖励基线：每月合法性、当前合法性、声望、稳定性、神职人员支持、宗教团结、国库/收入、战争状态和当地动乱。它反映了莫斯科的状况：占领、围困、骚乱、破坏、繁荣、首都/法院通道、从克里姆林宫到红场的路线安全、大教堂的可用性、市场秩序和人群容量。它初始化用于教堂准备、圣像游行、钟声时间表、布道/胜利记忆、施舍供应、警卫名册、商人路线清理、朝圣者出席、统治者出现和最终公众代祷的计数器。临时维护包括蜡烛、施舍、面包、神职人员和歌手的津贴、警卫、人群屏障、横幅修复和公共招待。
    progress_logic: >-
      每月的进步是合法性的公共建设。神职人员准备每个教堂并制定宴会顺序；圣像持有者排练路线；敲钟者协调信号；歌手准备赞美诗；文士和传教士塑造的布道将神圣的代祷、莫斯科的保护和纪念胜利联系起来，而不是将仪式变成通用的军事演习。警卫清理了克里姆林宫的路线，商人商定摊位将关闭或继续营业，施舍管理员收集面包和硬币，城市官员为朝圣者、退伍军人和请愿者分配座位。当莫斯科被控制、维护费用得到支付、大教堂可以使用、红场平静、统治者的权威得到承认时，进步就会前进。它因破产、占领、围困、严重动乱、神职人员拒绝、市场骚乱、路线受阻或继承争议而暂停。它因高度合法性、强大的神职人员支持、当地繁荣、资本地位、良好的国库、近期的防御或边境威望以及低动荡而加速。仅当新统治者被接受时，ruler_death侦听器才应将游行转换为继承代祷；
    completion_logic: >-
      完成需要教堂、圣像、钟声、布道、施舍、守卫、市场、朝圣者、统治者出现和最后代祷柜台完成。莫斯科仍然必须受到控制，最终的建筑必须存在，国家不能破产，红场必须安全供公众礼拜。最后的场景从克里姆林宫大门开始，进入红场。守卫打开道路；神职人员携带圣像和十字架；大教堂里响起钟声；尺子出现在彩绘圆顶前；布道回顾保护和胜利是统治的职责；施舍已分发；商人和朝圣者目睹游行队伍进入或绕行教堂。如果最近发生了继承，新统治者的名字会在祈祷中被提及，公众的请愿书也会受到严格的保护。这一奇迹变成了国家能力，因为圣巴西尔将合法性变成了将统治者、首都、信仰、胜利记忆和对城市的关怀联系起来的重复的公共行为。
    failure_or_timeout_logic: >-
      仪式可以等到下一个节日季节，但如果一再推迟，出席人数和施舍计数就会减少。如果赞助商失去莫斯科、最后一座大教堂建筑消失、国家仍然破产、大教堂被占领或严重损坏，或者严重的骚乱使红场不安全，那么它就会失败或取消。神职人员的拒绝、市场暴力、克里姆林宫路线受阻、导致施舍变得不可能的饥荒或有争议的继承人都应该暂停进度，并可能重置游行和统治者出现计数器。如果莫斯科在占领后收复，教堂、横幅、图标和路线必须重新检查。远离莫斯科的战争只会影响成本；莫斯科附近的战争应该停止仪式。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对莫斯科的控制，最终独特的圣瓦西里建筑存在，没有破产，没有占领或无效的围攻，没有活跃的重复仪式，可控的当地骚乱，可用的大教堂，以及公认的统治者权威。添加对神职人员支持、从克里姆林宫到红场的路线安全、首都/法院通道、当地繁荣或施舍规定以及没有严重继承或宗教危机的专题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和莫斯科，存储统治者/继承背景，初始化教堂准备计数器，圣像游行，钟声时间表，布道/胜利记忆，施舍，警卫，市场路线，朝圣出席，统治者外观和最终调解，应用临时维持，并存储合法性、神职人员、声望、国库、动乱和地方基线。
      snapshot_effect_script: >-
        刷新每月合法性、当前合法性、声望、稳定性、神职人员支持、宗教团结、国库/收入、战争状态、继承状态、莫斯科占领、围困、动乱、破坏、繁荣、资本准入、克里姆林宫路线安全的当前值，大教堂的可用性、市场秩序、人群容量和最终建筑的存在。保留扩展和失败决策的开始基线。
      progress_effect_script: >-
        在每月的刻度上，提前子计数器用于教堂、圣像、钟声、布道、施舍、守卫、市场清理、朝圣者、统治者出现和代祷准备。因破产、占领、围困、严重骚乱、神职人员拒绝、市场骚乱、路线受阻、继承争议、大教堂受损或无偿维护而暂停或衰退。加速合法性、神职人员支持、繁荣、资本地位、财政、低动荡和相关胜利记忆。在ruler_death上，需要接受的继承才能取得进展。
      completion_trigger_script: >-
        需要基本的游行计数器或总进度阈值，莫斯科控制，最终建筑存在，没有破产，没有占领或围攻，可控制的骚乱，可用的大教堂，开放的路线，足够的施舍/供给，合作的神职人员和公认的统治者。
      completion_effect_script: >-
        删除临时游行维护，应用永久国家修正，保留每月的合法性，授予一次性合法性、声望、神职人员支持或当地骚乱救济奖励，添加当地圣巴兹尔的代祷记忆，清除瞬态变量，并保留持久的完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留monthly_legitimacy作为唯一永久源主题。大教堂通过在莫斯科人民、神职人员、市场和胜利记忆面前反复展示统治者受保护的存在来增强合法性。不要将奖励转化为军队士气或一般大教堂艺术家的能力。
      one_time_reward: 授予一次性合法性、威望、神职人员满意度、地方奉献精神，或减少施舍和公众请愿带来的骚乱。如果ruler_death将仪式转变为继任代祷，则将部分奖励用于稳定继任。
      local_building_reward: >-
        莫斯科应该保留准备好的教堂、圣像路线、钟表时间表、红场哨所、施舍站、胜利横幅和游行请愿书的记忆。稍后的实施可以将其表达为当地骚乱的减少、首都的合法性、神职人员的支持或混乱后更快的恢复。
    notes: >-
      源仪式是即时的，但定时模式更好地代表盛宴和游行周期。包含 ruler_death 是因为继承可能需要公开调解，但前提是新统治者得到承认。这种设计与克里姆林宫加冕典礼截然不同：圣瓦西里加冕典礼是公共红场的合法性和胜利记忆，而不是加冕仪式的守卫大教堂堡垒机器。奖励必须保持每月的合法性。
- id: 145
  key: unique_trinity_lavra
  base_key: great_monastery
  location: moscow
  source_ritual_key: monastic_host_sanctification
  status: designed
  ritual_design_zh:
    title: 三一修道院的写字间守夜
    mode: timed
    duration: >-
      定时模式是首选，因为修道院的研究效益应该来自复制、教学、编目、通信和严格的修道院例行程序的循环。十二个月的刻度应该代表一整年的抄写工作、图书馆审计、长老指导、朝圣者交流和编年史编辑。源仪式名称唤起了神圣化，但设计通过知识和机构记忆而不是战场祝福来表达它。
    listeners:
    - monthly
    historical_flavor: >-
      圣三一修道院的守夜祈祷室属于圣谢尔盖圣三一修道院，因为该修道院是一个坚固的精神中心，其长期影响来自长老、手稿、编年史、朝圣、外交和纪律严明的社区，就像穿过墙壁一样。参与者包括修道院院长或方丈、修道院长老、抄写员、圣像画家、圣歌教师、新手导师、装订工、朝圣者、莫斯科特使、土地管理员、医院兄弟、修道院围墙的守卫，以及寻求副本和咨询的来访神职人员或学者。这些地方包括圣三一大教堂、回廊、写字间、图书馆、圣像作坊、食堂、宾馆、朝圣者庭院、修道院围墙、粮仓以及连接修道院和莫斯科的道路。这些物品包括羊皮纸或纸张、墨水、羽毛笔、蜡板、抄写的编年史、圣人的生活、礼拜书籍、正在进行的圣像、装订板、印章、捐赠章程、粮食统计和特使携带的信件。象征意义是，学习通过有纪律的传播而神圣化。保护修道院的统治者获得了一个网络，可以复制法律和礼拜仪式，保存记忆，培训职员和神职人员，接待旅行者，并将分散的报告转化为可用的知识。这就是为什么research_speed是永久奖励：修道院通过使文本、教师和档案更加可靠来加速查询和管理。
    confirmation_logic: >-
      赞助者必须拥有或控制莫斯科/修道院遗址，最终的圣三一修道院奇迹建筑必须存在，国家不能破产，修道院不能被占领、围困或遭受严重的当地动乱。国家应该能够保护寺院的土地和道路，支付抄写材料的费用，并维持足够的宗教秩序，以便抄写和教学能够进行。如果实施能够检测到神职人员满意度、识字/研究资源、稳定性、当地繁荣、道路通达、破坏或宗教动乱，这些都应该形成确认。如果修道院安全，战争不应自动阻止守夜活动，但围困、占领、烧毁图书馆、袭击道路或金库崩溃应该阻止守夜活动的开始。尽管有源密钥，但仪式不应需要军事主持人；任何横幅或保护对于写字间来说都是次要的。
    start_logic: >-
      开始效果记录了赞助国、修道院/莫斯科遗址、最终的修道院建筑以及活跃的写字间守夜活动。它快照了奖励基线：研究速度、当前知识或创新代理（如果有）、神职人员支持、稳定性、宗教团结、财政/收入、识字/学者能力（如果有）、行政效率、战争状态和破坏压力。它反映了当地的情况：占领、围困、动乱、繁荣、道路/朝圣者通道、修道院围墙安全、图书馆/书写室条件、粮仓支持和宾馆容量。初始化图书馆馆藏、抄写、编年史、图解研讨会、新手指导、长者争论、朝圣报告收集、使者信件、捐赠章程审核、医院/宾馆订单和最终书籍祝福等柜台。临时维持费用包括墨水、纸张、羊皮纸、装订材料、蜡烛、新手和朝圣者的食物、警卫、暖气和抄写员津贴。
    progress_logic: >-
      每月的进度是修道院用双手思考的。抄写员抄写礼拜书籍、法律文本、编年史和教学著作，而校对员则将抄本与旧的范例进行比较。装订工修理卷册；图书馆员库存箱；图标画家和图表制作者准备视觉教具；诵经老师和长辈指导新手；来访的神职人员带来其他学院的问题；朝圣者和使节带来的消息被编年史家整理成可靠的记忆。土地管理员会审核捐赠章程，这样修道院的收入就可以支持复制，而无需法院持续补贴。警卫和宾馆兄弟维持道路和住宿秩序，以便交流继续进行。当场地得到控制、维护费用得到支付、道路开放、写字间完好无损、宗教/当地骚乱可控时，就会取得进展。它因破产、占领、围困、严重骚乱、图书馆被烧毁或被抢劫、道路被封锁、神职人员冲突或缺乏物资而暂停。它通过神职人员的高度支持、强大的财政、地方繁荣、现有的学者能力、稳定、宗教团结、受保护的道路和健康的档案来加速。只有当战争威胁到修道院或提供有用的报告而不干扰工作时，战争才有意义；不需要战争挂钩。
    completion_logic: >-
      完成需要完成图书馆、复印、编年史、圣像/研讨会、说明、争论、朝圣者报告、信件、宪章、宾馆和最终祝福柜台。场地必须保持受控，最终的建筑必须存在，国家不能破产，写字间必须完好无损。最后的场景发生在修道院教堂和图书馆。修道院的长老们守夜，抄写员展示修正过的书籍，编年史家展示当年的编纂条目，圣像画家展示完成的面板，新手背诵课程，特使寄托信件，方丈密封副本分发给教堂，法院和学校。这些书并不是作为战利品，而是作为记忆和指导的工具。这一奇迹成为国家能力，因为修道院现在充当复制、教学和档案交换的受保护节点，加速了整个领域的研究。
    failure_or_timeout_logic: >-
      在普通的延迟下，仪式应该暂停而不是终止，但如果材料用完或道路关闭，手稿和出席计数器应该会衰减。如果赞助商失去场地、最终的修道院建筑消失、国家仍然破产、修道院被占领或遭到决定性围困，或者图书馆/写字室被摧毁，它就会失败或取消。严重的骚乱、神职人员冲突、道路袭击、食堂空空的饥荒、抄写材料的丢失或重大破坏都会暂停进度，并可能重置复印和宾馆柜台。如果场地在占用后恢复，则必须重新进行图书馆库存和章程审核。统治者的死亡应该不重要，除非它造成赞助或宗教危机，从而减少支持。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对修道院/莫斯科遗址的控制，最终独特的修道院建筑存在，没有破产，没有占领或无效的围攻，没有活跃的重复仪式，可控的地方和宗教骚乱，可用的道路，以及足够的材料库。添加神职人员支持、写字间/图书馆完整性、当地繁荣、学者或识字能力以及无严重破坏或烧毁档案情况的专题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和地点，初始化图书馆库存、手稿复制、编年史、图标/图表工作坊、新手指导、长者争论、朝圣者报告、特使信件、捐赠章程审计、宾馆/医院订单和最终书籍祝福的计数器，应用临时维护和储存研究、神职人员、稳定性、财务、道路和地方基线。
      snapshot_effect_script: >-
        刷新研究速度、创新/知识代理、神职人员支持、稳定性、宗教团结、财务/收入、学者/识字能力、行政效率、战争状态、场地占用、围困、动乱、破坏、繁荣、道路通行、修道院安全、图书馆/书房条件、粮仓支持、宾馆的当前值容量和最终建筑存在。保留扩展和失败决策的开始基线。
      progress_effect_script: >-
        在每月的刻度上，提前进行图书馆审计、复印、更正、装订、编年史工作、图标/图表制作、新手课程、老年人争论、朝圣者报告收集、特使信件、章程审计和宾馆订单的子计数器。由于破产、占领、围困、严重骚乱、图书馆被烧毁、道路被封锁、神职人员冲突、物质短缺、饥荒、严重破坏或无偿维护而暂停或衰退。加速神职人员支持、财政、繁荣、学者能力、稳定、宗教团结、档案健康和开放道路。
      completion_trigger_script: >-
        需要必要的写字间柜台或总进度阈值、场地控制、最终建筑存在、没有破产、没有占领或围困、可控的骚乱、完整的图书馆/写字间、开放的道路、付费维护以及已完成的更正手稿集可供分发。
      completion_effect_script: >-
        删除临时写字间维护，应用永久国家修正保持研究速度，授予一次性研究/文化，神职人员，稳定或当地繁荣奖励，添加圣三一修道院写字室记忆，清除瞬态变量，并保留持久的完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留research_speed作为中央奖励。修道院通过复制、更正、编年史保存、文书教育、图标和图表研讨会、档案和信件来改进研究。尽管修道院环境坚固，但不要将永久奖励转化为人力、皈依或士气。
      one_time_reward: 授予一次性研究进展、文化或宗教传统、神职人员满意度、稳定或朝圣和赞助带来的当地繁荣。如果守夜活动在危机期间保留了记录，则将一部分用于稳定或行政恢复。
      local_building_reward: >-
        修道院应该记住库存图书馆、更正的手稿、编年史箱、圣像工作室、新手学校、宾馆路线、捐赠章程和受保护的书写室。稍后的实现可以将其表达为当地研究、神职人员影响力、朝圣价值或围困后知识的恢复力。
    notes: >-
      占位符使用pre_winning_war，但此设计将其删除，因为源奖励是研究速度。每月定时模式更好地捕捉寺院一年的抄写和教学。强化的方面仍然是确认和失败检查，而不是军事奖励。后期的实施应保持学术寺院的效果，避免陷入一般信仰转变或军队支持。
- id: 146
  key: unique_winter_palace
  base_key: triumphal_axis
  location: neva
  source_ritual_key: imperial_gallery_opening
  status: designed
  ritual_design_zh:
    title: 涅瓦河上的帝国画廊开幕
    mode: timed
    duration: >-
      优先选择定时模式，因为帝国画廊的开幕是一个法庭认证周期，而不是单个展览。每月六到十二个刻度应代表藏品库存、大厅准备、优先规划、大使邀请、翻译和礼节审查、警卫路线、正式观众以及涅瓦河上的最终开放。宫殿通过反复有序的接待赢得了外交声誉。
    listeners:
    - monthly
    - ruler_death
    historical_flavor: >-
      涅瓦河上的皇家画廊开口属于冬宫，因为冬宫将皇家展示变成了外交机器。参加者有君主或摄政王、宫廷内侍、外国大使、翻译、传令官、卫兵、车夫、画廊馆长、画家、建筑师、档案管理员、音乐家、大臣、礼仪官员以及管理河堤的城市官员。这些地方包括涅瓦河上的宫殿正面、宏伟的楼梯、观众厅、画廊室、外交前厅、档案室、哨所、马车场、教堂或哀悼空间（需要时），以及游客在报告中带回家的照明河滨。这些物品包括特使证书、优先顺序列表、条约副本、艺术目录、画廊钥匙、制服、宫廷长袍、国家肖像、地图、时钟、外交礼物、烛台、马车通行证、警卫命令和密封的接待记录。其象征意义是，一个大国必须是外人看得见的。绘画和大厅不仅仅是奢华：它们展示着血统、征服、学习、礼仪以及记住档案中每一个承诺的能力。
      diplomatic_reputation之所以崛起，是因为使节们看到了一个能够正确排列他们的宫廷，能够安全地接待他们，通过翻译进行交谈，展现出受控的辉煌，并在稳定的首都记录谈判。
    confirmation_logic: >-
      赞助商必须拥有或控制涅瓦宫遗址，最后的冬宫奇迹建筑必须存在，国家不能破产，宫殿不能被占领，被围困，被封锁进入首都，或遭受严重的当地动乱。法院必须能够接待使节：如果实施能够检测到首都/法院的准入、外交声誉、活跃的外交官、合法性、稳定、财政、当地繁荣、路线安全或继承危机，这些都应该形成确认。国家应该有足够的资金用于警卫、照明、宫廷服装、翻译和画廊准备。战争不应自动阻止这一开放，但威胁首都、关闭外交通道或造成宫廷逃亡的战争应该阻止这一开放。统治者死亡不应在命令返回后阻塞；它通过哀悼和重新认可来重新调整开放的方向。
    start_logic: >-
      起始效果记录了赞助国、作为仪式地点的涅瓦河、最终的宫殿建筑、当前的统治者/继承背景以及活跃的画廊认证周期。它概括了奖励基线：外交声誉、当前威望、合法性、稳定性、外交关系的数量或质量（如果有）、财政/收入、法院/内阁效率（如果有代表）、战争状态和特使访问。它反映了当地宫殿的状况：占领、围困、动乱、破坏、繁荣、首都/宫廷的可用性、河流或道路的通道、画廊的状况、警卫准备情况、档案安全和宫廷供应。它初始化藏品库存、画廊修复、肖像和地图布置、优先顺序列表起草、大使邀请、翻译分配、警卫路线规划、观众厅排练、外交礼品登记、接待会议纪要、河流照明和最终画廊开放等柜台。临时维护费用包括宫廷开支、警卫、照明、音乐、运输后勤、修复工作、翻译费用和外交礼品。
    progress_logic: >-
      每月的进展是协议变得可信。策展人清点绘画、肖像、地图和外交礼物，然后将它们排列起来讲述一个连贯的帝国故事。档案管理员准备条约副本和以前的信件，以便大使能够得到准确的答复。礼仪官员起草优先顺序表和座位；口译员审查语言和标题；管家们排练从马车场到画廊和观众厅的路线；警卫保护楼梯和河流入口；音乐家和灯光师准备晚间招待会。部长们安排哪位特使接受私人接见、公众观看、礼物交换或书面答复。当宫殿得到控制、维护费用得到支付、使节可以到达首都、当地的骚乱得到控制、朝廷权威得到承认时，进步就会推进。它因破产、占领、围困、严重骚乱、逃亡、外交路线关闭、继承争议、档案泄露或无法资助协议而暂停。它以高度的合法性、强大的财政、现有的外交声誉、许多活跃的关系、稳定的朝廷、当地的繁荣和安全的资本路线而加速发展。在ruler_death，仪式转变为哀悼和重新认证：平稳的继任通过吊唁观众和重新颁发证书来增加进展，而有争议的继任则暂停，直到特使知道该向谁讲话。
    completion_logic: >-
      完成需要收集、画廊、档案、优先权、特使、口译员、警卫、观众、礼物、会议记录、照明和开放柜台完成。涅瓦河遗址必须保持控制，最终的建筑必须存在，国家不能破产，宫廷必须足够稳定以供使节出席。最后一幕以马车在守卫下抵达宫殿开始。大使按正确顺序递交国书；口译员和传令官宣布头衔；部长们引导使节参观肖像、地图和收藏艺术品的画廊；条约副本和接待记录密封存档；记录外交礼物；涅瓦河立面为城市和外国观察者点亮。如果刚刚发生继承，新的统治者或摄政者会收到哀悼并重新颁发认可。这一奇迹成为了国家能力，因为冬宫被认证为外交的可靠舞台，这里的宏伟、记忆和礼节使外国法院相信国家的承诺。
    failure_or_timeout_logic: >-
      仪式可以在没有严格超时的情况下暂停，但如果接待一再延迟，特使和礼宾计数器就会衰减。如果赞助商失去了涅瓦河遗址、最后的宫殿建筑消失、国家仍然破产、宫殿被占领或遭到决定性围困、或者宫廷永久逃离，则该计划失败或取消。严重的骚乱、继承争议、档案火灾、优先权处理不当造成的外交丑闻、资本路线关闭或无法支付警卫和口译员的费用，都应该暂停进展，并可能重置特使和优先权计数器。如果宫殿在占领后被收回，则必须重复清点、档案和安全柜台。战争通过外交通道和资本安全而不是战场结果来决定。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对涅瓦河遗址的控制、最终独特的冬宫建筑存在、没有破产、没有占领或无效围攻、没有活跃的重复仪式、可控的骚乱、可用的宫廷/资本以及足够的金库用于接待。添加对外交准入、合法性、稳定继承、当地繁荣、安全河流或道路通道、档案/画廊可用性以及无严重外交隔离（如果有）的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和涅瓦河、存储统治者/继承背景、初始化藏品库存计数器、画廊修复、肖像和地图排列、优先顺序列表、大使邀请、口译员、警卫路线、观众排练、礼品登记、接待会议记录、河流照明和最终开放，应用临时维护，并存储外交、声望、合法性、财政、法院和地方基线。
      snapshot_effect_script: >-
        刷新外交声誉、声望、合法性、稳定性、外交关系或特使访问、财政/收入、法院/内阁效率、战争状态、继承状态、涅瓦占领、围困、动乱、破坏、繁荣、首都/法院可用性、河流/道路访问的当前值，画廊状况、警卫准备情况、档案安全、法庭供应和最终建筑的存在。保留扩展和失败决策的开始基线。
      progress_effect_script: >-
        在每月的刻度上，提前进行库存、画廊修复、展示布置、档案准备、优先级、特使邀请、口译员、警卫路线、观众排练、礼品登记、会议记录、照明和最终开幕的子计数器。由于破产、占领、围困、严重动乱、法庭逃亡、外交通道关闭、档案泄露、继承争议、丑闻或无偿维护而暂停或衰退。加速实现合法性、财政、外交声誉、活跃的关系、稳定的法庭、繁荣和安全的路线。在
        ruler_death 上，需要哀悼/认证更新。
      completion_trigger_script: >-
        需要必要的画廊认证柜台或总体进展，涅瓦河控制，最终建筑存在，没有破产，没有占领或围困，可控制的骚乱，正常运作的法院，稳定的统治者或摄政，特使出席，准备好的优先顺序列表，安全档案和完整的接待记录。
      completion_effect_script: 删除临时法庭维护，应用永久国家修正保留外交声誉，授予一次性声望/外交或宫廷权威奖励，添加冬宫画廊记忆，清除瞬态变量，并保留持久的完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留diplomatic_reputation作为永久奖励。这座宫殿提高了声誉，因为它标准化了接待、优先、翻译、档案记忆和可见的帝国辉煌。即使画廊使用艺术品，也不要用艺术家能力或一般声望来取代它。
      one_time_reward: 授予一次性声望、改善关系或外交恩惠、成功宫廷展示的合法性以及宫廷开支带来的当地繁荣。如果ruler_death续订有所贡献，则对外国使节的继任认可进行奖励。
      local_building_reward: >-
        涅瓦宫应记住编目画廊、密封的接待记录、优先顺序列表、翻译名册、警卫路线、外交礼品登记和河流照明协议。稍后的实施可以将其表达为当地威望、外交使节吸引力、宫廷效率或从继承外交中更快恢复。
    notes: >-
      源仪式是即时的，但定时模式更好地捕捉宫廷和画廊认证周期。包含 ruler_death 是因为外交证书必须在新统治者或摄政期间更新。实施时应保持奖励的外交性，以艺术和宫殿奇观作为手段，而不是永久的主题。占领、破产、逃亡和有争议的继承权应该会阻碍完成。
- id: 147
  key: unique_gyeongbokgung
  base_key: triumphal_axis
  location: namgyeong
  source_ritual_key: royal_audience_renewal
  status: designed
  ritual_design_zh:
    title: Geunjeongjeon 皇家观众更新
    mode: timed
    duration: >-
      首选定时模式，因为皇家观众更新是一个管理校准周期。每月六到十二个刻度应代表大门协议、办公室花名册、纪念路线、皇家讲座、文件审核、等级座位、档案审查和勤政殿的最终观众。只有当大臣和职员反复练习如何进出王座大厅时，宫殿才会变得高效。
    listeners:
    - monthly
    - ruler_death
    historical_flavor: >-
      勤政殿皇家观众更新属于景福宫，因为朝鲜宫殿是儒家政府的空间图：大门、庭院、王座大厅、议会办公室、档案室和仪式空间有序地在国王、士大夫和国家文件之间流动。参加者包括国王或摄政王、国务大臣、六部官员、御史、御史、记录朝词的史官、侍卫、门吏、主考官、礼官、宦官或侍从，以及在正式接见秩序外等候的使节。这些地方包括勤政殿、光化门和内门、庭院中的排石、议会办公室、秘书室、档案室、皇家书房、祠堂和礼堂以及决定谁可以接近统治者的宫殿走廊。这些物品包括奏折、皇家印章、任命牌位、爵位牌匾、朝服、朝鼓、历史笔记本、考试名册、法律法规、法令草稿和门牌。象征意义是遵守纪律的访问。统治者的权威之所以有效，是因为请愿、报告、任命和责备按照已知的顺序到达，并以记录的决定形式离开。
      country_cabinet_efficiency之所以崛起，是因为宫殿更新了让大臣辩论、文士记录、审查员反对、国王决定的惯例，而不是让每个问题都成为个人瓶颈。
    confirmation_logic: >-
      赞助商必须拥有或控制南镜，最后的景福宫奇迹建筑必须存在，国家不能破产，宫殿区不能被占领、围困或遭受严重的局部动乱。这个国家应该有一个有效的统治者或摄政王，有足够的国库来运行法庭办公室，以及足够的学者官员或官僚合作以使协议发挥作用。如果实施能够检测内阁效率、合法性、稳定性、学者/神职人员或官僚财产满意度、腐败、资本状况、法庭准入或继承危机，这些检查应该形成确认。如果首都安全，战争不应该自动阻止仪式，但敌人对宫殿的威胁、宫廷逃亡、档案丢失或官员破产工资应该阻止仪式的开始。
    start_logic: >-
      起始效果记录了主办国、作为仪式地点的南镜、最终的宫殿建筑、统治者或摄政背景以及活跃的观众更新周期。它快照了奖励基线：country_cabinet_efficiency、合法性或权威、稳定性、腐败或行政摩擦、学者官员满意度、财政/收入、活跃顾问或部长（如果有）、战争状态和继承风险。它记录了当地宫殿的状况：占领、围困、动乱、破坏、繁荣、首都/法院通道、大门安全、档案状况、办公室可用性和官员的路线通道。它初始化门礼宾、等级座位、奏折入座、秘书处备审、国务院咨询、部委答复路由、审查审查、历史记录、皇家讲座、考试名册、档案封存和最终观众等柜台。临时维持费用包括朝廷俸禄、纸张和墨水、侍卫工资、信使费用、档案修复、礼服以及拉官员重复接见的时间成本。
    progress_logic: >-
      每月的进展是政府学习自己的节奏。登机口官员测试通行证和进入时间；卫兵们排练光化门和内门的开启；排名石和座位表都会经过检查，因此地位争议不会破坏辩论。秘书处文员接收奏折，将其归档，复制摘要，然后将其发送给正确的部门。国务院部长在皇家接见前举行磋商；部委书记员草拟答复；审查员标记不当提案；历史学家记录演讲；皇家讲师准备文本来约束统治者自己的决策。考试官员更新名册，以便人才能够进入办公室。当宫殿得到控制、维护费用得到支付、官员可以到达法庭、当地骚乱得到控制、统治者/摄政得到认可时，就会取得进展。它因破产、占领、围困、严重骚乱、法庭逃亡、档案火灾、官方派系抵制、腐败危机或继承争议而暂停。它以高度的合法性、稳定的政府、满意的士大夫、低腐败、强大的财政、资本地位和现有的行政能力而加速。
      ruler_death听众应该需要继任观众：顺利的摄政或继承通过确认新统治者下的协议来增加进展，而有争议的继承则暂停案卷和观众计数器。
    completion_logic: >-
      完成需要完成门，等级，纪念馆，秘书处，议会，部委，检查员，历史学家，讲座，考试，档案和最终观众计数器。南镜必须保持控制，最后的建筑必须存在，国家不能破产，统治者或摄政当局必须得到承认。最后一幕发生在勤政殿。官员们从正门进入，站在排列的石头旁，并献上纪念包。皇家秘书处宣读案卷；部长们依次回答；审查员提出反对意见；历史学家记录了这次交流；统治者发布密封的决定；办事员将答复带到部委办公室；档案官员密封副本。如果最近发生了继承，新统治者将首先接受命令的接见。这一奇迹变成了国家能力，因为宫殿已经更新了建议、批评、法律、任命和命令通过内阁传递的纪律渠道。
    failure_or_timeout_logic: >-
      仪式可以在没有严格超时的情况下暂停，但如果法庭停止开会，文件和出勤计数器就会减少。如果赞助商失去了南镜，最后的宫殿建筑消失，国家仍然破产，宫殿被占领或遭到决定性的围困，或者朝廷永久逃亡，那么它就会失败或取消。严重的派系骚乱、档案破坏、官方抵制、大门暴力、腐败丑闻或继任争议应该会暂停进展，并可能重置观众和记事计数器。如果宫殿在被占领后被恢复，档案、大门协议和办公室花名册必须重新审核。战争的重要性仅取决于首都安全和政府连续性，而不是胜利。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对南镜的控制、最终独特的宫殿建筑存在、没有破产、没有占领或无效的围攻、没有活跃的重复仪式、可控的骚乱、正常运作的统治者/摄政以及可用的宫廷办公室。添加对首都/朝廷准入、士官合作、合法性、危机下腐败、档案状况、国库和无严重继承危机的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助者和南京，存储统治者/摄政背景，初始化门协议计数器，等级座位，纪念馆接收，秘书处记录，国务院咨询，部委路线，审查审查，历史记录，皇家讲座，考试名册，档案密封和最终
      snapshot_effect_script: >-
        刷新内阁效率、合法性/权威、稳定性、腐败、士大夫满意度、财政部/收入、顾问/部长能力、战争状态、继承状态、南镜占领、围困、动乱、破坏、繁荣、首都/法院准入、大门安全、档案状况的当前值，办公室可用性、路线访问和最终建筑存在。保留扩展和失败决策的开始基线。
      progress_effect_script: >-
        在每月的刻度上，提前子计数器用于大门、排名顺序、纪念馆、秘书处记录、理事会辩论、部门回复、审查审查、历史记录、皇家讲座、考试名册、档案密封和最终观众准备。由于破产、占领、围困、严重动乱、法庭逃亡、档案丢失、派系抵制、腐败危机、有争议的继承或无偿维护而暂停或衰退。加速合法性、稳定性、官员满意度、低腐败、财政、资本状况和现有行政能力。在ruler_death上，需要继任观众。
      completion_trigger_script: >-
        需要基本的观众更新计数器或总体进度，南镜控制，最终建筑存在，没有破产，没有占领或围攻，可控制的骚乱，正常运作的法院，公认的统治者/摄政，密封档案，并完成了奏折到法令的路由测试。
      completion_effect_script: 删除临时法院维护，应用永久国家修正保持内阁效率，一次性授予合法性/稳定性或官僚凝聚力奖励，添加景福宫观众记忆，清除瞬态变量，并保留持久的完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留country_cabinet_efficiency作为永久奖励。宫殿通过组织通道、纪念馆、议会辩论、部门路线、审查审查和档案记录来改善内阁职能。不要将其转化为威望、合法性或文化作为永久的主题。
      one_time_reward: 通过成功的受众更新，授予一次性合法性、稳定性、减少腐败、顾问/官僚满意度或行政进展。如果ruler_death需要继任观众，则将部分奖励分配给有序继承。
      local_building_reward: >-
        南镜应该记住门协议、排名石、观众记录、秘书处登记册、密封档案、考试名册、历史笔记本和部门回复路线。稍后的实施可以将其表现为地方行政效率、法庭纠纷引起的骚乱减少或从继承危机中更快恢复。
    notes: >-
      源仪式是即时的，但定时模式更好地代表了提高内阁效率所需的重复法庭日。包含 ruler_death 是因为新的统治者或摄政必须证明相同的协议仍然有效。实施应保持奖励的行政性，而不仅仅是声望，并应将档案丢失、法庭逃亡、腐败危机和有争议的继承视为严重的障碍。
- id: 148
  key: unique_changbai_mountain_altar
  base_key: sacred_mountain
  location: girin_ula
  source_ritual_key: sacred_mountain_investiture
  status: designed
  ritual_design_zh:
    title: 长白封祖山
    mode: timed
    duration: >-
      定时模式应持续大约一年祭祀年。这几个月代表着派遣朝廷钦差大臣、召集旗人代表、核实祖宗谱系、准备满汉和汉人的奏折、开辟吉林乌拉的戒备路线、提供猎人和向导、净化祭坛露台、进行季节性祭祀以及将封印的山报告带回宫廷预算周期。回报是较低的法庭支出成本，因为合法性是通过可重复的祖先制度而不是通过持续的大量现金法庭展示来更新的。
    listeners:
    - monthly
    - ruler_death
    historical_flavor: >-
      长白山封山属于吉林乌拉的祭坛，因为长白山拥有火山峰和天湖，不仅仅是风景高地：它可以被视为满族血统、旗帜身份、狩猎秩序和王朝的神圣源泉。授权。参加者包括携带朱旨的钦差大臣、满族和蒙古旗贵族、萨满教仪式专家、朝廷礼官、家谱抄写员、翻译、猎人、护林员、包装工、土司和精选的士兵，他们确保道路安全，但不会将仪式变成一场战役。这些地方是石坛台、吉林乌拉的森林通道、河流渡口、狩猎营地、岗哨、山坡、天池景观以及宣读归还奏章的谒见大厅。器物有牌位、符文、祭祀动物、水谷碗、白布、旗幡、玉器或青铜礼器、家谱、路数、印章、账簿等。这一象征性的行动是为了让统治者的宫廷记住，它不仅仅通过宫廷俸禄、袍服、娱乐和派系赞助来购买权威。它从纪律严明的祖先景观中获得权威，这些景观由横幅守护，由抄写员记录，并得到当地社区的认可。这就是court_spending_efficiency下降的原因：当继承、贵族等级和宫廷礼仪秩序都以公认的山地仪式为基础时，宫殿可以减少在竞争性展示上的花费。
    confirmation_logic: >-
      赞助商必须拥有或控制吉林乌拉，最后的长白山祭坛奇迹建筑必须存在，国家不能破产，祭坛区和引道不能被占领，被敌对围困，或被严重动乱切断。这个国家应该有一个公认的统治者或摄政，一个运转良好的宫廷金库，以及足够的边境安全，以派遣特使、萨满、旗帜代表和抄写员进入山区。如果实施可以检测到文化、宗教、王朝、合法性、宫廷支出压力、庄园或贵族忠诚、当地破坏、路线安全、冬季/季节困难或边境不服从，则应通知确认。只有当吉林乌拉路线保持安全并且朝廷使节没有被困时，战争才是可以接受的。处于激烈争论中的统治者继承应该阻止或推迟开始，因为该仪式是对起源的授予，而不是中立的景观节日。
    start_logic: >-
      起始效果记录了赞助国、作为仪式地点的吉林乌拉、最终的祭坛建筑、当前的统治者或摄政、王朝背景以及活跃的长白册封周期。它快照了国家基线：court_spending_efficiency或当前法院支出压力、合法性或权威、声望、稳定性、国库/收入、贵族或旗帜财产满意度、军事进入边境、战争状态和继承风险。它记录了当地的基线：占领、围困或相当于封锁的路线封闭、动乱、破坏、繁荣、供应、冬季严酷程度（如果有）、森林路线安全、祭坛状况以及当地文化或信仰一致性。它初始化了子柜台，用于准备法令、验证家谱、征集旗帜代表、净化萨满、护送路线、提供猎营、修复祭坛、季节性祭祀、起草山表和批准朝廷预算。临时负担应该包括使节俸禄、侍卫工资、祭品、马匹、裘衣、粮食、礼器、翻译工作、家谱抄写、给当地向导的礼物，以及召唤旗贵族离开首都的机会成本。
    progress_logic: >-
      每月的进步将神山变成了一个工作机构。第一阶段，朝廷礼官拟定诏书，比较历代山奏疏；家谱文士会检查氏族记录，以便仪式能够正确命名祖先和横幅。旗帜贵族选择代表，猎人标记安全的森林小路，卫兵检查河流渡口，包装工发放马匹和冬衣，当地首领确认祭坛路线可以接收游行队伍。随后的每月滴答声代表萨满和仪式官员净化石台、更换损坏的器皿、准备祭祀动物、用适当的语言排练祈祷、建立看守火堆和营地。最后的旅行月份包括登高、向天池供奉、收集泉水或湖水（如果合适）、起草山奏章，以及将密封的报告返回宫殿。当吉林乌拉安全、国库支付负担、贵族和旗帜代表出席、路线供应完好无损、没有继承危机挑战法令中指定的统治者时，进展就会推进。它因破产、占领、重大动乱、路线封闭、森林叛乱、守卫无薪、旗帜精英派系拒绝、严重破坏或仪式专家流失而暂停。它以高度的合法性、忠诚的贵族或旗帜、强大的边疆驻军、当地的繁荣、稳定的国库、与山地传统的文化亲和力以及相关朝廷或祖先仪式的先前完成而加速。
      ruler_death 监听器很重要，因为新的统治者必须与长白绑在一起：顺利的继承增加了继承者任命计数器，并且可以将现有的进展转化为新的合法性，而有争议的继承会冻结家谱验证和法院批准，直到指定的主权者得到解决。
    completion_logic: >-
      完成要求路线、祭坛、代表、供品、纪念馆和法庭批准柜台都完整；吉林乌拉必须保持控制，最后的祭坛必须仍然存在，国家不能破产，仪式中指定的统治者或摄政必须得到承认。最后一幕从山台开始：寒峰下插旗，萨满和礼官献上祭品，使者宣读御旨，家谱诵读正统，当地向导和卫兵见证安全通行，封印器皿或书写信物准备回程。结束场景发生在法庭上。大臣和贵族面前宣读山奏疏，统治者接受祖先的报告，宫廷会计将仪式纳入常规礼仪预算，派系馈赠明确服从公认的祭坛周期。这个奇迹变成了国家能力，因为祭坛现在提供了一个反复出现的、有记录的王朝认可来源，减少了通过临时宫廷慷慨来购买忠诚的需要。
    failure_or_timeout_logic: >-
      仪式不应该有严格的超时，但如果每年的周期被打破太久，进展就会衰退，因为使节分散，贡品变质，路线情报变得陈旧，贵族们争论出席。如果赞助者失去了吉林乌拉、最后的祭坛建筑消失、国家持续破产、路线被敌对势力占领或关闭，或者法令中指定的统治者在批准之前被推翻，那么法令就会失败或取消。严重的当地动乱、破坏、冬季供应崩溃、旗帜不服从、萨满教或仪式办公室纠纷、宫廷派系抵制、继承危机或边境战争应该会暂停进度，并可能重置旅行、奉献或批准计数器。如果祭坛在占领后恢复，则必须重新检查路线的起点、祭坛状况和家谱计数器，然后才能再次计数。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对吉林乌拉的控制、最终独特的祭坛建筑存在、没有破产、没有重复的活动仪式、没有占领、相当于围攻的路线封闭或严重的当地动乱、公认的统治者/摄政、可用的金库以及使节的安全通道。添加对合法性、贵族/旗帜合作、当地破坏、边境安全、文化或信仰亲和力以及没有未解决的继承危机的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助者和吉林乌拉，存储统治者/摄政和王朝背景，应用临时使者和祭祀负担，初始化法令计数器，家谱，旗帜代表，净化，路线护送，供给，祭坛修复，季节性祭祀，山纪念馆，和法院批准，并存储与法院支出和边境安全相关的国家和地方基线。
      snapshot_effect_script: >-
        刷新法院支出压力、合法性/权威、声望、稳定性、国库/收入、贵族或旗帜满意度、战争状态、继承风险、吉林乌拉占领、围攻或路线封闭、动乱、破坏、繁荣、供应、路线安全、祭坛状况、当地文化/信仰契合度以及最终建筑存在。保留奖励缩放和失败检查的起始基线。
      progress_effect_script: >-
        每月，推进具体的子柜台，包括起草法令、抄写家谱、召集代表、巡视林道、供给卫猎、净化祭坛、修理器皿、祭祀季节、起草山表、归朝、批准预算等。由于破产、失去控制、占领、路线封闭、严重骚乱、破坏、无偿护送、派系抵制、仪式专家失踪或继承争议而暂停或衰退。在ruler_death上，根据继任稳定性要求或加速继任者授职。
      completion_trigger_script: >-
        要求全部进度或所有关键计数器完成，吉林乌拉控制，最终祭坛存在，没有破产，没有占领或路线封闭，可控的骚乱，完成的祭品和密封的山纪念馆，返回的使节，公认的统治者/摄政以及法院预算批准。
      completion_effect_script: >-
        消除临时使节负担，应用保留的永久国家修正降低法庭支出成本，授予一次性合法性、声望、贵族/旗帜忠诚度或按干净完成比例缩放的稳定性奖励，添加长白站点内存，清除瞬态计数器，并保留持久完成和冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留court_spending_efficiency作为永久奖励。祭坛降低了宫廷开支，因为王朝出身、贵族等级和礼仪准入是通过与长白相关的预定祖先仪式来更新的，而不是通过临时的宫廷慷慨、有竞争力的礼物和昂贵的示好。
      one_time_reward: >-
        授予一次性的合法性、威望、稳定、贵族或旗帜忠诚，并可能通过规范礼仪预算而获得一小笔国库减免或法庭费用退款。如果ruler_death听众完成了继任者授予仪式，则将部分奖励直接用于继承接受而不是一般的荣耀。
      local_building_reward: >-
        Girin Ula应该记住净化的祭坛露台、安全的森林通道、命名指南、岗哨、家谱副本、供奉容器、密封的山纪念碑和横幅出席卷。稍后的实施可以将其表达为减少当地骚乱、边境忠诚、路线安全或更快的未来祖先仪式。
    notes: >-
      源仪式是即时的，但定时模式更合适，因为神山册封只有在使节、旗帜、萨满、记录、祭品和会计师使其成为常规机构后才能减少朝廷成本。每月记录旅行和准备周期；之所以包含ruler_death，是因为当继承必须固定在祖山上时，仪式最为强烈。保持对宫廷支出的永久影响，并避免陷入一般的征服、朝圣或声望仪式。
- id: 149
  key: unique_belgrade_fortress
  base_key: star_fortress_city
  location: belgrad
  source_ritual_key: danube_watch_muster
  status: designed
  ritual_design_zh:
    title: Danube Watch Muster
    mode: timed
    duration: >-
      定时模式应运行一个战役季节，大约十二个月一次。这几个月的任务是检查多瑙河和萨瓦河上方的城墙，登记河流船只，校准火炮，重新组织门岗守望，向侦察兵通报情况，复制边境信件，以及为通行费、囚犯、商人和使节发布可预测的规则。仪式不是筑墙后的盛宴；这是一次纪律严明的集结，让邻国知道贝尔格莱德是戒备森严、善于交流、难以轻易挑衅的。
    listeners:
    - monthly
    - pre_winning_war
    - ending_war
    historical_flavor: >-
      多瑙河守望集结属于贝尔格莱德要塞，因为这座城市坐落在多瑙河和萨瓦河畔，是中欧、巴尔干半岛和奥斯曼边境之间的军事和外交枢纽。参与者包括要塞队长、炮兵大师、河船夫、门卫、海关职员、侦察兵、骑兵信使、工程师、牧师或伊玛目（取决于赞助商）、获得过渡码头许可的商人、翻译、囚犯官员以及来自邻近法院的使节，他们需要看到秩序而不被邀请。这些地方包括上层要塞、河门、堡垒、弹药库、信号塔、桥头堡、海关、渡轮码头、外部侦察哨所和议会厅，监视报告在这些地方成为政策。这些物品包括炮弹、火药账本、灯塔旗、大门钥匙、河链记录、护照、通行费簿、缴获的标准、囚犯名单、工程师草图和给边境指挥官的密封信件。象征意义是控制力量。管理不善的边境会招致对抗，因为竞争对手认为袭击、侮辱和机会主义压力都是廉价的。纪律严明的贝尔格莱德会减少antagonism_received_modifier，因为这表明赞助商可以看到河流动向，通过已知渠道应对边境事件，并保卫汇合点，而不会将每一次争吵升级为圣战或仇杀。
    confirmation_logic: >-
      赞助商必须拥有或控制贝尔格莱德，最后的堡垒奇迹建筑必须存在，国家不能破产，堡垒、河门和直接汇合处不应该被占领，处于敌对状态或因严重动乱而瘫痪。多瑙河/萨瓦河路线必须足以供巡逻艇、信使和商人通行；不需要完全和平，因为边境集结经常是在威胁下发生的，但实际控制通道的敌军应该阻止开始。如果实施可以检测到驻军兵力、堡垒维护、人力、水手或河流容量、炮兵准备情况、当地破坏、敌对邻居、厌战、主动停战、外交声誉或边境不服从行为，这些都应该影响确认。仪式不应该在破产、叛变、无薪驻军危机或不受控制的越狱期间开始，因为重点是纪律威慑。
    start_logic: >-
      起始效果记录了赞助国贝尔格莱德作为仪式地点、最终的堡垒建筑、当前的战争和休战背景、已知的敌对邻居以及活跃的多瑙河守望周期。它快照国家基线：antagonism_received_modifier、外交声誉或威胁感知（如果有）、军队士气、人力、炮兵或围攻能力、堡垒维护、国库/收入、厌战程度、稳定性和军事专业精神或同等纪律。它记录了当地的基线：驻军水平、要塞状况、占领、围困状态、动乱、破坏、繁荣、河流通道、港口/码头可用性、补给、弹匣状况、大门安全和侦察范围。它初始化用于城墙检查、堡垒维修、火炮校准、火药审计、门名册、河流巡逻登记、海关和护照规则、侦察报告、囚犯协议、特使简报、商人安全行为和战争教训回顾的计数器。临时负担包括驻军工资、火药、船只维护、工程师工资、灯塔燃料、办事员、翻译、边境礼品以及检查通道时损失的通行费收入。
    progress_logic: >-
      每月的进步是边境官僚机构学习如何避免引发危险。工程师们在城墙上行走并标记受损的砖石；炮兵大师在河湾上测试射击弧线；火药办事员负责清点桶数并清除弹匣中的火花。门长修改夜更，船夫登记渡轮和巡逻艇，海关抄写员抄写护照规则，口译员为商人、囚犯和外国使节准备标准短语。侦察兵骑马前往上游和下游哨所，将商人的谣言与骑兵报告进行比较，并返回可能携带袭击者的道路地图。牧师或法律官员见证了囚犯的程序，因此被俘的人成为讨价还价的资产，而不是争执的原因。当工资支付、河道仍然可用、骚乱得到遏制、驻军力量充足、邻近事件通过书面渠道得到答复时，进展就会推进。它会因破产、占领、主动围攻、严重骚乱、叛变、杂志灾难、河流封闭、巡逻艇被摧毁或超过侦察网络的边境突袭而暂停。它通过强大的驻军、维护的防御工事、良好的财政、低战争疲劳度、工程师或炮兵能力、值得信赖的当地商人以及允许发布规则的积极休战协议来加速。当战争转向对赞助商有利并且贝尔格莱德的巡逻、河流拒止或侦察合理地塑造结果时，pre_winning_war听众应该添加进展：敌人的谨慎验证了集结。
      ending_war 监听器记录了解决方案：遣返囚犯、边界条款、通行费承诺、重建哨所以及对指挥官的指示，以便胜利或失败不会留下复仇的真空。
    completion_logic: >-
      完成需要墙、火炮、杂志、大门、河流巡逻、护照、侦察、囚犯、特使、商人和战争教训柜台完整或被战役事件可信地取代。贝尔格莱德必须保持控制，最后的堡垒必须存在，国家不能破产，驻军必须得到支付，河道必须可用。最后一幕是在交汇处进行公开但军事的检查。大炮被滚到有标记的发射口，内河船只从悬挂着注册旗帜的监视大门下方通过，大门队长出示钥匙，侦察员提供密封路线报告，职员阅读通行费和安全通行规则，囚犯官员对俘虏进行交代，特使或边境代表见证事件将通过指挥渠道得到答复。然后，指挥官向附近国家发送相同的边境信件。这一奇迹变成了国家能力，因为贝尔格莱德不再仅仅充当一个响亮的象征；它成为一种可预测的军事界面，威慑、外交和河流管理减少了竞争对手测试赞助商的动机。
    failure_or_timeout_logic: >-
      这种仪式可以在战争期间暂停，但如果观察报告变得陈旧或如果无薪士兵放弃例行公事，则应该衰退。如果赞助商失去了贝尔格莱德、最后的要塞建筑消失、国家仍然破产、要塞被占领、成功的围攻破坏了驻军，或者河门永久无法使用，则比赛失败或取消。严重的当地骚乱、叛乱、弹匣被毁、不受控制的囚犯杀戮、码头遭到破坏、对河流流动的敌对封锁或与每个邻国的外交崩溃都应该暂停进度，并可能重置大门、巡逻或特使计数器。以羞辱结束战争不会自动使仪式失败，但ending_war听众应该在领取减少对抗奖励之前强制进行更严格的恢复审查。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对贝尔格莱德的控制，最终独特的堡垒建筑存在，没有破产，没有重复的活动仪式，没有占领或决定性的围攻，可控的骚乱，可用的河门或汇合路线，付费/足够的驻军，以及没有叛变或杂志危机。添加对堡垒维护、人力、炮兵、金库、敌对邻居、休战或战争背景、当地破坏和外交信誉的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和贝尔格莱德，存储战争/休战和敌对邻居背景，初始化墙检查计数器，堡垒维修，火炮校准，火药审计，门名册，河流巡逻登记，护照规则，侦察报告，囚犯协议，特使简报，商人安全行为和战争教训审查，应用临时驻军和河流监视负担，并记录国家/地方基线。
      snapshot_effect_script: >-
        刷新收到的对抗、外交声誉或威胁感知、军队士气、人力、炮兵战备、堡垒维护、财政、厌战、稳定、专业精神、贝尔格莱德驻军、堡垒状况、占领、围困、动乱、破坏、繁荣、河流通道、码头可用性、杂志状况、大门安全、侦察范围和最终建筑物的存在。
      progress_effect_script: >-
        通过具体的检查和记录，每月检查、推进城墙、堡垒、大炮、杂志、大门、巡逻、海关、护照、侦察、囚犯、特使和商人柜台。因破产、占领、围攻、叛变、严重骚乱、河流封闭、驻军无薪、杂志灾难或巡逻破坏而暂停或衰退。当贝尔格莱德实质上支持有利的战役时，使用
        pre_winning_war 添加进度，并使用 ending_war 记录囚犯、边界、通行费和战后监视协议。
      completion_trigger_script: >-
        需要完成的集结计数器或同等的战争验证进度，贝尔格莱德控制，存在最终堡垒，没有破产，没有占领或决定性围攻，付费驻军，可用的河流通道，完整的监视报告，安全行为规则，囚犯记录，以及准备好边境信件。
      completion_effect_script: >-
        移除临时监视负担，应用永久国家修正，保留减少的对抗性，授予一次性士气、声望、外交信誉、人力恢复或边境稳定奖励，添加贝尔格莱德多瑙河监视站点内存，清除瞬态变量，并保留完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留antagonism_received_modifier作为永久奖励。堡垒减少了对抗，因为竞争对手面临着可见的、可预测的、记录良好的边境系统：监视河流、付费驻军、纪律严明的囚犯处理以及事件的标准信件使骚扰不那么有吸引力，误解也不那么爆炸。
      one_time_reward: >-
        授予一次性威望，军队士气，外交声誉，边境稳定，人力或驻军恢复，并可能减少战争疲劳，如果ending_war 完成了干净和解审查。当巡逻记录和囚犯协议在实际战争中幸存下来时，奖励应该会更大。
      local_building_reward: >-
        贝尔格莱德应该保留对标记的射击孔、检查过的杂志、门名册、登记的河流巡逻队、护照簿、侦察地图、囚犯分类帐、安全通行公式和边境信件的记忆。稍后的实施可以将其表达为当地的堡垒防御、更少的骚乱、更好的河流贸易控制或围困后更快的恢复。
    notes: >-
      源仪式是即时的，但定时模式更好地代表了守望和外交信号的季节。 pre_winning_war 和 ending_war 被保留，因为当战役势头和和解表明严格的边境控制减少了敌对测试时，这座堡垒证明了它的价值。将永久奖励集中在减少对抗上，而不仅仅是一般防御；防御加值应该是次要的或一次性的。
- id: 150
  key: unique_meteora_monasteries
  base_key: great_monastery
  location: trikala
  source_ritual_key: suspended_liturgy
  status: designed
  ritual_design_zh:
    title: 悬崖修道院的暂停礼拜仪式
    mode: timed
    duration: >-
      定时模式应运行完整的礼拜仪式和供应周期，大约每月十二个周期。这段时间包括修理绳索葫芦、储备悬崖粮仓、分配修道院轮换、复制和编目手稿、修复圣像、许可看守的朝圣者路径、听取当地请愿书以及在岩石上进行季节性服务。国家获得了稳定投资，因为修道院将无序的虔诚、难民流动和山地不安全变成了一个有纪律的祈祷、档案、调解和避难网络。
    listeners:
    - monthly
    historical_flavor: >-
      暂停的礼拜仪式属于迈泰奥拉，因为它的修道院与色萨利上方的砂岩柱子密不可分：通过梯子、台阶和绳篮到达的建筑物使宗教生活明显地与普通暴力分开，同时仍然与下面的村庄联系在一起。参与者包括修道院院长、僧侣、圣像画家、手稿抄写员、绳索葫芦工作人员、骡夫、当地东正教神职人员、道路守卫、村长、朝圣者、寻求庇护的难民、财政部职员以及资助国派来的官员，他们的目的是使修道院网络清晰易读，同时又不消除其自治权。这些地方包括悬崖教堂、卡托利卡、食堂、写字间、圣像室、蓄水池、绳索平台、梯子、有人看守的引道、乡村旅馆以及将谷物和石油转移到岩石上的市场点。这些物品包括圣像、福音书、手抄本、蜡封、篮子、绳子、滑轮、油灯、圣物箱、面粉袋、祈祷清单、避难所登记册和安全通行信。象征意义是提升纪律以服务。迈泰奥拉不仅仅通过激发敬畏来稳定国家；它之所以能稳定下来，是因为焦虑的人们看到争端得到了受人尊敬的方丈的调解，手稿在突袭中得到保存，难民得到登记而不是流浪，朝圣者通过安全路线引导，祈祷与有序的食物和施舍重新分配联系在一起。这直接支持stability_investment。
    confirmation_logic: >-
      赞助者必须拥有或控制特里卡拉，最后的迈泰奥拉修道院奇迹建筑必须存在，国家不能破产，悬崖寺院、小路和下面的村庄不能被敌对势力占领、切断或被严重动乱淹没。当地的宗教社区必须能够发挥作用：修道院院长不应公开反抗，写字间和教堂应可供使用，朝圣者和供应品应有保安通道。如果实施可以检测到国家信仰、神职人员满意度、宗教团结、稳定、破坏、当地繁荣、土匪/骚乱、学者或研究活动、粮食供应或难民压力，那么这些应该会形成确认。战争不应该自动阻止仪式，因为迈泰奥拉的防御景观在乱世中很重要，但占领特里卡拉、封锁山路或无薪守卫应该会阻止仪式的开始。
    start_logic: >-
      开始效果记录了赞助国、作为仪式地点的特里卡拉、最终的修道院建筑、当地的信仰背景和活跃的暂停礼拜仪式周期。它概括了国家基线：stability_investment、稳定水平或动乱压力、神职人员满意度、宗教团结或宽容、合法性、财政/收入、研究或手稿能力（如果有）、战争状态以及难民或破坏压力。它记录了当地的基线：占领、动乱、破坏、繁荣、供应、道路安全、修道院状况、升降机状况、书写室可用性、圣像/遗迹安全、朝圣者通道和村庄合作。它初始化用于升降机维修、蓄水池和粮仓储备、礼拜日历、僧侣轮换、圣像库存、手稿复制、圣所登记、朝圣者安全引导、路径警卫巡逻、村庄请愿听证会、施舍分配和最后悬崖礼拜仪式的计数器。临时负担包括谷物、石油、蜡、羊皮纸、绳索、滑轮修理、警卫工资、骡夫合同、施舍、抄写员时间，以及在不失去国家权威的情况下承认庇护所要求的行政成本。
    progress_logic: >-
      每月的进展是远程神圣向公共秩序的缓慢转变。绳索人员在将面粉、油、蜡、羊皮纸和灯燃料拖到柱子上之前测试篮子和滑轮。僧侣们在教堂、食堂、蓄水池和写字间之间轮流；修道院院长会检查祈祷名单，并为在战争或饥荒中失去亲人的村庄分配服务。抄写员修复装订、抄写福音书和法律或神学手稿，并密封目录，以便知识在袭击中幸存下来。圣像画家清理被烟雾熏黑的面板，并记录哪些圣像可以被带下来进行游行。卫兵在道路上巡逻，骡夫组织补给日，村里的长老们将有关债务、避难所、继承、放牧和难民安置的请愿书提交给方丈，方丈可以进行调解，而不会让每一个纠纷都成为皇室案件。当道路安全、补给得到支付、修道院院长合作、骚乱可控、修道院不受敌人控制时，进步就会取得进展。它因破产、占领、轨道堵塞、严重土匪行为、圣像或手稿丢失、提升机故障、在到达岩石之前耗尽物资的饥荒、神职人员叛乱或破坏修道院信任的国家干预而暂停。它随着神职人员的高满意度、稳定的国家信仰、当地繁荣、低破坏、强大的奖学金、慷慨的施舍以及以前的修道院或朝圣投资而加速。每月的滴答声不应该是一般性的进展：每一次滴答声都应该代表在支柱之上和之下提供供应、复制、守卫、调解或崇拜的具体行为。
    completion_logic: >-
      完成需要完成升降机、供应、礼拜仪式、手稿、圣像、圣所、朝圣者、警卫、请愿书、施舍和最后礼拜仪式柜台。特里卡拉必须保持控制，最终的建筑必须存在，国家不能破产，悬崖路径必须足够开放以供结束游行。最后一幕在黎明前开始，篮子里的灯被升起，柱子之间响起钟声。住持们从村长那里收到密封的请愿书卷，抄写员将编好的手稿放入写字间，警卫护送数量有限的朝圣者穿过小道，圣像揭开面纱，僧侣们在平原上吟诵礼拜仪式。国家官员并不在祭坛上指挥仪式；随后，他们收到庇护所登记册、施舍账户和安全通行名单，并确认由寺院调解的纠纷将得到承认。这一奇迹变成了国家能力，因为迈泰奥拉现在在恐惧和秩序之间提供了一个持久的阶梯：祈祷平静，档案保存，守卫通道移动，方丈调解，国家通过值得信赖的神圣机构来维持稳定。
    failure_or_timeout_logic: >-
      仪式可能会在没有严格超时的情况下暂停，但如果物资腐烂，绳索磨损，复制的聚会不被束缚，或者朝圣路线变得不安全太久，进展就会衰退。如果赞助商失去特里卡拉、最终的修道院建筑消失、国家仍然破产、修道院被占领或洗劫、或者悬崖通道系统被破坏，它就会失败或取消。严重的骚乱、强盗控制通道、饥荒、升降机倒塌、写字间火灾、圣像盗窃、神职人员叛乱、强迫皈依压力或不受控制的难民营都会暂停进度，并可能重置庇护所、手稿或朝圣者计数器。战争只有在切断道路、摧毁补给村庄或将修道院变成战场时才会中断。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对特里卡拉的控制、最终独特的修道院建筑存在、没有破产、没有重复的活动仪式、没有占领、敌对路径关闭或严重的当地动乱、可用的修道院设施、合作的神职人员/修道院院长以及足够的金库和供应渠道。添加对国家信仰或宽容、宗教团结、神职人员满意度、破坏、繁荣、道路安全、学者活动和难民压力的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和 Trikala，存储当地信仰背景，应用临时供应和寺院支持负担，初始化起重机维修计数器，粮仓/蓄水池库存，礼拜日历，僧侣轮换，圣像库存，手稿复制，圣所登记，朝圣者安全行为，路径巡逻、请愿听证会、施舍分配和最后的悬崖礼拜仪式，以及存储国家/地方基线。
      snapshot_effect_script: >-
        刷新稳定投资、稳定或动乱压力、神职人员满意度、宗教团结/宽容、合法性、财政、奖学金、战争状态、破坏/难民压力、特里卡拉占领、动乱、繁荣、供应、道路安全、修道院状况、升降机状况、书写室可用性、圣像/文物安全、朝圣者通道、村庄合作和最终建筑存在。
      progress_effect_script: >-
        每月，推进提升机、补给、僧侣轮换、服务、手稿修复和复印、圣像清洁、路径巡逻、朝圣者许可、圣所记录、请愿调解、施舍分配和最后仪式准备等具体工作。由于破产、失去控制、占领、轨道堵塞、严重动乱、土匪、饥荒、起重机故障、手稿或圣像丢失、神职人员叛乱或修道院信任破裂而暂停或衰退。加速神职人员满意度、当地繁荣、低破坏、奖学金、施舍和安全朝圣路线。
      completion_trigger_script: >-
        要求完成仪式计数器或总体进度，特里卡拉控制，最终修道院存在，没有破产，没有占领或敌对路径封闭，可控制的骚乱，可用的起重机，库存物资，安全的朝圣路线，密封的圣所登记册，编目手稿，并完成最终的
      completion_effect_script: >-
        消除临时供应负担，应用永久国家修正保持稳定投资，授予一次性稳定性、神职人员满意度、合法性、研究/手稿或当地骚乱救济奖励，添加迈泰奥拉站点内存，清除瞬态变量，并保留持久的完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留stability_investment作为永久奖励。迈泰奥拉改善了稳定投资，因为其悬崖修道院将祈祷、档案工作、避难所、朝圣、施舍和当地调解转变为一种值得信赖的制度途径，用于在叛乱之前吸收恐惧和混乱。
      one_time_reward: >-
        授予一次性稳定进展、神职人员满意度、合法性、宗教统一或宽容、减少当地骚乱，以及可能通过编目复制获得研究或手稿声望。奖励应与安全的朝圣者处理、手稿保存和干净的请愿调解相一致。
      local_building_reward: >-
        特里卡拉应该记住修复的提升机、储备的悬崖粮仓、有人看守的路径、复制的手稿、清洁的圣像、圣所登记册、施舍账簿、请愿书卷和指定的朝圣日。后来的实施可以将其表达为当地动乱减少、破坏恢复、学者产出或战争期间的恢复力。
    notes: >-
      源仪式是即时的，但定时模式是必要的，因为迈泰奥拉的稳定效果来自重复的供应、礼拜仪式、复制、守卫访问和调解。每月就足够了；战争和统治者死亡的听众会将设计从修道院的中心功能中拉出来，除非后来的实施增加了明确的避难所危机挂钩。将奖励集中于稳定投资，而不是一般的声望朝圣。
- id: 151
  key: unique_belem_tower
  base_key: city_great_tower
  location: lisbon
  source_ritual_key: tagus_watch_rite
  status: designed
  ritual_design_zh:
    title: 塔古斯守望和出发祝福
    mode: timed
    duration: >-
      定时模式应在航行季节运行，大约每月十二个周期。这几个月包括测试塔古斯海峡、认证飞行员、记录潮汐和沙洲、检查贝伦塔的火炮弧、登记轻快帆船和瑙斯、审核货运合同、祝福出发以及审查返航船只。只有在塔楼、港口、飞行员、商人和王室官员就可重复的出发和返回程序达成一致后，海军航程和贸易收入才会改善。
    listeners:
    - monthly
    - ending_war
    historical_flavor: >-
      塔霍守望和出发祝福属于贝伦塔，因为该塔标志着里斯本的河口，船只离开受保护的塔霍河并进入大西洋的不确定性。参与者包括皇家港口官员、受过大西洋航海训练的飞行员、卡拉维尔船长和瑙船长、炮兵船员、海关职员、商人、代理人、制图师、牧师、附近造船厂的造船工人、绳索和帆供应商、灯塔或信号灯管理员以及聚集在码头附近的水手家属。这些地方包括塔台、河门、锚地、海关、皇家仓库、飞行员学校或海图室、炮兵射击场、教堂、船只登陆处和经过沙洲的向外通道。这些物品包括飞行员手册、船舵、星盘或十字星、潮汐表、货物清单、海关封条、香料和糖合同、炮弹、信号灯、祝福水、帆、绳索和海外因素的密封信件。其象征意义在于海洋野心在变成利润之前先被驯化。贝伦不仅仅是一座装饰性的塔楼；它是一个检查站，航海、防御、皇家税收、商人风险和精神祝福都在这里可见。
      naval_range 上升是因为飞行员和机组人员携带经过测试的航线和补给品离开。 trade_income 上升，因为货物、通行费、合同和退货均通过值得信赖的河口机构登记。
    confirmation_logic: >-
      赞助商必须拥有或控制里斯本，最后的贝伦塔奇迹建筑必须存在，国家不能破产，塔霍港、塔楼、河道和海关设施不能被严重骚乱占领、封锁或瘫痪。该国应该有足够的水手、船只或海军能力，使离港仪式有意义，并有足够的贸易活动，使舱单和因素发挥作用。如果实施可以检测港口准入、封锁、海军范围、贸易收入、水手、商人庄园满意度、造船厂容量、探险家/海军上将的存在、海外贸易节点、战争疲劳、破坏、海盗/私掠压力或当地繁荣，那么这些应该形成确认。只有当塔霍河不安全或被封锁时，战争才应该被阻止；遥远的海上战争反而会使ending_war审查变得更加重要。
    start_logic: >-
      起始效果记录了赞助国里斯本作为仪式地点、最终的塔楼建筑、当前的海军和贸易背景、影响海上航线的活跃战争以及塔霍守望周期。它快照了国家基线：naval_range、trade_income、水手、海军士气或维护、舰队规模、商业力量、国库/收入、贸易效率（如果有）、探险家或海军上将能力、殖民或海外影响力、海盗压力和战争疲劳。它记录了当地的基线：占领、封锁、动乱、破坏、繁荣、港口通道、造船厂状况、塔楼状况、炮兵准备情况、码头可用性、海关职能、飞行员可用性和航道安全。它初始化潮汐测量、沙洲标记、飞行员检查、海图和船舵复制、火炮检查、信号灯值班、船舶登记、货物舱单审核、商船合同密封、教堂祝福、补给、出发护航和回程审查等柜台。临时负担包括飞行员工资、海图复印、灯笼和枪支修理、港口巡逻、海关职员、绳索和帆检查、教堂费用以及检查舱单时的延迟贸易。
    progress_logic: >-
      每月的进展是港口证明远洋航行可以重复而不是赌博。飞行员探查塔霍河航道并标记移动河岸；制图师将返回的船辙与旧海图进行比较；港口官员检查船长的风、海流和登陆情况；造船工人检查船体、泵、桅杆、帆和绳索。塔楼炮手测试火药库和发射弧线，以便河口能够保卫有价值的出发点。海关职员称重货物，在清单上盖章，并将商业合同与王室会费进行核对。牧师在教堂祝福船员，而信号员则记录大雾、暴风雨或敌方风帆的提灯和旗帜程序。商家安排信用证和保理商函；供应商装载饼干、水、酒、盐肉、备用帆布和贸易货物。当里斯本受到控制、港口开放、水手和船只可用、关税得到支付并且航道保持安全时，进展就会取得进展。它因破产、封锁、占领、严重骚乱、码头流行病、水手短缺、领航员领工资被拖欠、海图被毁、造船厂停工、海盗统治或以严重港口破坏为代表的风暴而暂停。它因高贸易收入、强大的商人支持、经验丰富的探险家或海军上将、良好的造船厂、低海盗、繁荣的里斯本以及先前航行的成功返回而加速。
      ending_war 监听器应该在海上战争结束时添加或改变进度：在贸易充分受益之前，捕获的海图、车队损失、战利品、恢复的海上航线以及和平条款都将被输入到塔霍记录中。
    completion_logic: >-
      完成要求潮汐、引航员、海图、火炮、信号、登记、舱单、合同、祝福、供应、离港和回程审查计数器完整或通过成功的航行可信地完成。里斯本必须保持控制，最后的塔楼必须存在，国家不能破产，塔霍河不能被封锁。最后一幕发生在贝伦，车队正准备出发。塔楼发出信号，炮手站在干净的大炮旁边，飞行员展示密封的船舵，海关职员读取货物总数，商人移交合同和供应商信件，牧师祝福船员，船长发誓带着货物账户和更新的航线注释返回。当船只经过塔楼时，港口管理员会记录其旗帜、吨位、目的地和预期返航。这个奇迹变成了国家能力，因为大西洋的航行和商业现在是通过一个连接飞行员知识、皇家收入、国防和商业信用的单一河口机构进行认证的。
    failure_or_timeout_logic: >-
      这种仪式应该暂停，而不是因为普通的恶劣天气而立即失败，但如果航行季节过去而没有出发或返回，因为海图变得陈旧，商人将资本转移到其他地方，那么进步就会衰退。如果赞助商失去里斯本，最后一座塔楼消失，国家仍然破产，塔古斯河被封锁或占领，港口被摧毁而无法使用，或者船舶登记处因叛乱、海盗或扣押而崩溃，那么它就会失败或取消。严重的骚乱、海关记录被毁、飞行员流失、造船厂火灾、流行病、海战失败导致海上航线关闭或商人抵制都会暂停进度，并可能重置舱单、出发或返回柜台。失败后的ending_war钩子应该需要在奖励之前进行恢复审核，而不是自动奖励海军范围。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对里斯本的控制，最终独特的塔楼存在，没有破产，没有重复的活动仪式，没有占领，封锁或严重的港口骚乱，可用的塔霍港口/通道，正常运作的海关和船舶设施，以及足够的船舶/水手或贸易活动。添加对海军范围、贸易收入、水手、商人支持、造船厂、探险家/海军上将可用性、海盗压力、破坏和相关战争状态的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和里斯本，存储海军/贸易/战争背景，应用临时港口和认证负担，初始化潮汐测量计数器，沙洲标记，飞行员检查，海图复制，火炮检查，信号监视，船舶登记，货物清单，商业合同，教堂祝福，
      snapshot_effect_script: >-
        刷新海军航程、贸易收入、水手、海军维护或士气、舰队规模、商船实力、财务、贸易效率、探险家/海军上将能力、海外影响力、海盗压力、厌战情绪、里斯本占领、封锁、动乱、破坏、繁荣、港口通道、造船厂状况、塔台状况、炮兵战备情况、码头可用性、海关功能、飞行员可用性、通道安全和最终建筑存在。
      progress_effect_script: >-
        每月刻度、提前航道探测、飞行员考试、海图/船舵复制、船体和帆检查、塔炮、信号灯、船舶登记、货物称重、舱单密封、商业信用、教堂祝福、供应、出发和返回审核。由于破产、封锁、占领、严重动乱、缺乏水手、领航员无薪、海图丢失、造船厂停工、海盗、流行病或港口破坏而暂停或衰退。在ending_war上，添加海上航线审查，记录车队损失、奖品、恢复航线和条约效力。
      completion_trigger_script: >-
        要求完成认证柜台或总进度、里斯本控制、存在最终塔楼、没有破产、没有封锁或占领、可用的航道和港口、可用的引航员、密封的货物记录、准备好的车队或返回的船只、检查火炮以及完成的离港祝福。
      completion_effect_script: >-
        消除临时港口负担，申请保留海军范围和贸易收入的永久国家修正，授予一次性声望、水手、国库/贸易、海军传统或商人满意度奖励，添加贝伦塔古斯观察站点内存，清除瞬态计数器，并保留持久的完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留naval_range和trade_income。贝伦通过经过认证的飞行员、海图、航道知识和规定的出发时间扩大海军航程；它通过舱单、海关封条、商人信用、退货审核以及河口塔楼创建的防御信心来提高贸易收入。
      one_time_reward: >-
        授予一次性声望、水手、海军传统、商人满意度、国库/贸易收入或探险家准备状态。如果ending_war完成了审查，则将部分奖励用于恢复海上航线、追回奖品或降低海盗风险。
      local_building_reward: >-
        里斯本应该记住潮汐表、标记的沙洲、飞行员名册、复制的船舵、检查的火炮、信号灯例行程序、船舶登记、货物清单、商业合同、教堂祝福簿和返回审核。稍后的实施可以将其表达为当地造船、港口繁荣、海军供应或贸易保护。
    notes: >-
      源仪式是直接的，但定时模式更好地捕捉认证和回报会计的航行季节。每月处理港口工作； ending_war 被保留，因为海上战争改变了航线、护航安全、战利品和商人信心。将这两种永久奖励联系在一起：没有港口记录的航程只是探索，没有飞行员的贸易收入就错过了贝伦的河口功能。
- id: 152
  key: unique_iberian_inquisition
  base_key: great_monastery
  location: toledo
  source_ritual_key: tribunal_register
  status: designed
  ritual_design_zh:
    title: 托莱多法庭登记册
    mode: timed
    duration: >-
      定时模式应在正式司法和牧师登记年运行，大约每月十二个刻度。这几个月包括开放登记册、许可公证人、培训忏悔神父、发布传票规则、记录证词、检查布道和教义问答、审查和解、封存档案以及向王室和教会报告。永久的影响是皈依速度和稳定投资，因为该机构通过可重复的程序加速了国家信仰的整合，同时也将宗教冲突转化为官方的、严格监督的秩序。
    listeners:
    - monthly
    historical_flavor: >-
      法庭登记册属于托莱多，因为托莱多可以代表大教堂权威、皇家官僚机构、修道院纪律、法学家、皈依社区、古老基督教血统、档案和有争议的公众信仰的密集伊比利亚十字路口。参与者包括审判官、多米尼加或其他修道士、主教代表、皇家议会官员、公证人、狱卒、警卫、翻译、告解神父、教区牧师、地方法官、证人、被告、和解的悔罪者以及社区长老，他们的合作或恐惧决定了法庭是否会产生秩序或反弹。这些地方包括回廊、有人看守的教堂、议会厅、档案室、牢房、教区讲坛、公证台、用于公告的街道，以及程序获得神圣权威的大教堂或修道院空间。这些物品包括登记册、密封证词包、布道笔记、教义问答清单、恩典法令、授权令、和解证书、账簿、审查书籍或灵修物品、蜡烛、法衣和上锁的档案箱。象征意义是受控的正统观念。这种设计不应将这一机构视为无害的庆祝活动；它是一个强制法庭，其行政权力可以改变、惩戒、恐吓、和解和破坏稳定。当教义问答、忏悔、布道检查和法律传票正规化时，该国获得global_pop_conversion_speed_modifier。只有当程序阻止谣言、仇杀和肆意暴力吞噬城镇时，它才会获得stability_investment。
    confirmation_logic: >-
      赞助者必须拥有或控制托莱多，最后的法庭-修道院奇迹建筑必须存在，国家不能破产，法庭区不能被占领、围攻或被严重骚乱淹没。国家应该有一个能够任命法官的国家信仰或公认的宗教权威，足够的神职人员或法律人员来审理案件，以及足够的国库来支付公证人和警卫的费用。如果实施过程中能够发现宗教团结、国家信仰宽容或不宽容政策、神职人员满意度、合法性、稳定、腐败、动乱、当地少数民族的存在、破坏、法院能力或活跃的宗教战争，这些都会影响确认。如果当地法院面临暴徒压力、囚犯无法得到保护、公证记录丢失或王室和教会办公室公开争夺管辖权，则不应开始仪式。
    start_logic: >-
      起始效果记录了主办国、作为仪式地点的托莱多、最终法庭大楼、国家信仰背景、相关宗教社区以及活跃的法庭登记周期。它快照了国家基线：global_pop_conversion_speed_modifier、stability_investment、宗教团结或整合压力、神职人员满意度、合法性、稳定性、动乱压力、腐败、国库/收入、战争状态以及宗教战争或异端危机（如果有）。它反映了当地的基线：占领、围困、动乱、破坏、繁荣、监狱安全、档案状况、公证可用性、教堂访问、教区合作、少数民族或新转变的社区紧张局势以及警卫纪律。它初始化了法令发布、公证许可、忏悔者培训、教区布道检查、证词获取、证人交叉核对、被告人保护、和解登记册、教义问答审查、档案密封、皇冠教会管辖权审查和最终法庭报告等柜台。临时负担包括文书津贴、法律文件、警卫、监狱维护、翻译、档案箱、教区检查的旅行，以及迫使地方精英接受中央法庭的政治成本。
    progress_logic: >-
      每月的进展是在谣言和地方恩怨面前维护自己的程序。在一个月内，教区讲坛上会复制并宣读通知，以便人们知道可以在哪里提供证词。在另一种情况下，公证员获得许可、教授公式并分配印章，以便可以追踪证词。忏悔者审查教义问答和和解要求；教区神父提交布道笔记和指示清单；警卫清点牢房和囚犯食物，以免拘留期间发生骚乱。审判员和法律评估员会比较证人的陈述，驳回相互矛盾的指控，记录翻译人员的姓名，并将教牧指导与正式起诉区分开来。档案馆职员将证词、搜查令和核对表分别封存。皇家官员检查是否记录了罚款、没收或处罚，而没有发生私人盗窃行为。当托莱多安全、神职人员和王室合作、公证人可以写信、监狱监管受到纪律、当地骚乱仍然可控时，进展就会取得进展。它因破产、占领、围困、严重骚乱、暴民暴力、腐败记录篡改、管辖权冲突、监狱虐待丑闻、失控的谴责浪潮或妨碍有序听证会的宗教战争而暂停。它随着神职人员的高满意度、强大的国家权威、低腐败、充足的法律人员、运作良好的教区网络以及稳定的当地粮食和安全而加速。每月进度绝不应该是通用的换算表；它是记录、指示、听证会、档案印章和和解路线的积累。
    completion_logic: >-
      完成要求完成法令、公证、忏悔、布道、证词、证人、监护、和解、教义问答、档案、管辖权和最终报告计数器。托莱多必须保持控制，最后的建筑必须存在，国家不能破产，公共秩序必须足够稳定，以便法庭的报告能够在没有立即骚乱的情况下被宣读。最后的场景发生在戒备森严的议会厅和教堂，而不是简单的庆祝活动。调查人员出示密封的登记册；公证人识别他们的标记；忏悔神父列出和解的忏悔者名单和教义问答时间表；教区神父接受指示；皇家官员审计罚款和费用；警卫交出监护名单；档案箱在教会和官方见证人的见证下上锁。然后发布公告，说明法庭的规则、可用的和解程序以及对虚假证言或私人报复的处罚。这一奇迹变成了国家能力，因为国家现在拥有一套可复制的皈依、指导和宗教秩序机制，而档案让官员能够区分有管理的服从和不受控制的迫害。
    failure_or_timeout_logic: >-
      仪式不应该有严格的超时，但如果听证会因为证人消失、教区记录过时、密封证词失去法律效力而停滞，计数器应该衰减。如果赞助商失去托莱多、最终的建筑消失、国家仍然破产、法庭被占领或解散、或者王权和教会权力完全分裂，那么它就会失败或取消。严重的骚乱、暴徒暴力、监狱虐待、伪造证词、腐败的没收账户、不受控制的谴责、神职人员叛乱、地区宗教战争、档案火灾或当地精英抵抗应该会暂停进展，并可能重置证词、拘留或和解计数器。当战争使听证会不安全时，战争就会中断，而不仅仅是因为国家处于战争状态。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对托莱多的控制、最终独特的法庭建筑存在、没有破产、没有重复的活跃仪式、没有占领或围困、可控的骚乱、正常运作的宗教和法律权威、可用的神职人员/公证人/警卫、安全的监狱和档案访问以及没有严重的司法管辖区崩溃。添加对宗教团结、神职人员满意度、稳定、腐败、当地少数民族紧张局势、破坏、法院能力和宗教战争压力的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和托莱多，存储国家信仰和当地社区背景，施加临时法庭管理负担，初始化法令出版柜台，公证许可，忏悔者培训，布道检查，证词采集，证人交叉核对，监护保护，和解登记，教义问答审查，档案密封，
      snapshot_effect_script: >-
        刷新转换速度、稳定性投资、宗教统一或整合压力、神职人员满意度、合法性、稳定性、骚乱压力、腐败、财政部、战争/宗教战争国家、托莱多占领、围困、骚乱、破坏、繁荣、监狱安全、档案条件、公证可用性、教堂访问、教区合作、社区紧张局势、警卫纪律和最终建筑存在。
      progress_effect_script: >-
        每月记号、提前通知、公证印章、告解神父任务、布道审查、教义问答列表、证词记录、证人检查、保管清单、和解证书、档案包、官方审计和管辖权审查。由于破产、占领、围困、严重骚乱、暴徒暴力、记录损坏、监狱丑闻、管辖权分裂、档案火灾、宗教战争破坏或不受控制的谴责浪潮而暂停或衰退。加速神职人员合作、强有力的权威、低腐败、法律人员、教区网络覆盖和地方安全。
      completion_trigger_script: >-
        要求完成登记柜台或总体进展，托莱多控制，最终建筑存在，没有破产，没有占领或不安全的围困，可控的骚乱，安全的档案和保管，许可的公证人，完成的和解和教义问答登记册，已解决的管辖权审查，以及准备好的最终法庭报告。
      completion_effect_script: >-
        删除临时法庭负担，应用永久国家修正，保留转换速度和稳定性投资，授予一次性神职人员满意度、合法性、稳定性、宗教统一或受控的当地骚乱救济，添加托莱多法庭寄存器内存，清除瞬态变量，并保留完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留global_pop_conversion_speed_modifier和stability_investment。转换速度来自于系统的教义问答、忏悔、讲道检查、传票规则、和解记录。稳定投资只能来自于使这一过程清晰、有界、存档，足以减少谣言、私人报复和行政混乱。
      one_time_reward: 给予一次性稳定进展、神职人员满意度、合法性、宗教团结或减少当地骚乱。避免让一次性奖励感觉像是庆祝惩罚；它应该来自完整的记录、对账、审计纪律和恢复的公共秩序。
      local_building_reward: >-
        托莱多应该记住有执照的公证人、密封的登记簿、布道检查簿、教义问答时间表、保管名册、对账证书、档案箱、管辖权记录以及对虚假证言的处罚。稍后的实施可以将其表达为当地宗教秩序、严重性造成的骚乱风险或更快的未来法庭审查。
    notes: >-
      源仪式是立即的，但需要定时模式，因为奖励取决于缓慢的记录、布道、公证、监护和和解装置。每月是正确的听众；战争钩子会过分强调强制，除非它们后来仅用作干扰检查。实施时应谨慎处理该网站：奖励方向是转化和稳定，但过程必须包括滥用、骚乱、腐败和司法管辖失败的风险。
- id: 153
  key: unique_santa_maria_del_fiore
  base_key: grand_cathedral
  location: florence
  source_ritual_key: florentine_dome_consecration
  status: designed
  ritual_design_zh:
    title: 佛罗伦萨圆顶奉献和公会游行
    mode: timed
    duration: >-
      定时模式应在公民礼仪年运行。每月十二个刻度代表检查布鲁内莱斯基的圆顶和灯笼，协调大教堂的账目，组织行会游行，委托画家和雕塑家，排练大教堂音乐，接待来访的使节和学者，以及在使佛罗伦萨的视觉语言可输出的工作室中培训学徒。
      monthly_prestige和cultural_tradition_modifier只有在大教堂成为一个重复的市政机构而不仅仅是一座完整的建筑后才会得到改善。
    listeners:
    - monthly
    historical_flavor: >-
      佛罗伦萨圆顶奉献和行会游行属于圣母百花大教堂，因为大教堂及其巨大的红瓦圆顶使佛罗伦萨的共和、商业、虔诚和艺术抱负在天际线中清晰可见。参与者包括大教堂神职人员、大教堂歌剧院管理人员、拉纳艺术区羊毛行会领导人、泥瓦匠、起重机操作员、石匠、金匠、画家、雕塑家、音乐家、公民院长、公证人、人文学者、外国使节、学徒、兄弟会和管理广场的人群执法人员。这些地方包括中殿、唱诗班、洗礼堂轴线、乔托钟楼、圆顶走道、灯笼脚手架、大理石庭院、会馆、艺术家工作室、音乐阁楼和大教堂广场，游行将私人赞助转化为公众声誉。这些物品包括行会旗帜、帐簿、大理石块、赤土砖、木葫芦、脚手架平面图、唱诗班书、蜡烛、圣物箱、素描本、祭坛和雕像的合同、节日布和外交座位表。其象征意义是公民对规模的掌控。圆顶证明佛罗伦萨可以协调金融、工程、崇拜、工艺和公共记忆。
      monthly_prestige 之所以上升，是因为游客反复目睹了一座以秩序统治奇观的城市。 cultural_tradition_modifier之所以上升，是因为该仪式资助讲习班，培训学徒，并使艺术创新成为公民习惯。
    confirmation_logic: >-
      赞助商必须拥有或控制佛罗伦萨，最终的圣母百花奇迹建筑必须存在，国家不能破产，大教堂区域不能被占领、围困或遭受严重骚乱。圆顶和广场必须可供检查和游行使用；大教堂歌剧院或同等大教堂工作办公室必须能够记账；地方行会或工匠团体不得公开反抗。如果实施可以检测到声望、文化传统、市民/行会满意度、神职人员满意度、当地繁荣、建设能力、艺术家或顾问的存在、稳定性、腐败、火灾或破坏以及资本/法院的关注，那么这些应该形成确认。战争不会自动阻止仪式，除非它阻止使节、艺术家或游行队伍到达广场。
    start_logic: >-
      开始效果记录了赞助国、作为仪式地点的佛罗伦萨、最终的大教堂建筑、活跃的公民年份以及参与的行会/教堂办公室。它快照了国家基线：monthly_prestige、cultural_tradition_modifier、声望水平、文化传统、市民或行会满意度、神职人员满意度、财政/收入、稳定性、腐败、外交知名度以及艺术家/学者能力（如果有）。它快照了当地的基线：占领、围困、骚乱、破坏、繁荣、大教堂状况、圆顶/灯笼状况、广场通道、车间产量、大理石供应、行会合作和人群安全。它初始化圆顶检查、灯笼检查、歌剧帐目、行会游行、神职人员日历、唱诗班排练、工作坊委托、学徒招生、大理石/兵马俑供应、特使接待、公共节日秩序和最终奉献游行等柜台。临时负担代表蜡烛、音乐、游行布、脚手架维护、公证人、人群警卫、车间预付款、大理石运输以及行会领袖参加公民仪式的机会成本。
    progress_logic: >-
      每月的进展是佛罗伦萨在演练艺术与政府之间的关系。在一个月内，工程师和泥瓦匠爬上穹顶，检查裂缝，检查瓷砖路线，并报告灯笼的情况。在另一份文件中，大教堂歌剧院的公证人对捐赠者的承诺、行会会费、石匠工资和材料采购进行核对，以便这座城市的声誉建立在可信的账目之上。羊毛协会官员准备横幅和优先名单；神职人员安排节日和文物展示；合唱团指挥复制音乐并排练歌手，为游客留下难忘的回忆。车间收到面板、雕塑、金属制品、法衣和装饰维修的合同；大师们带学徒并展示教授佛罗伦萨风格的模型图。人群管理人员规划穿过广场的路线，防止市场摊位阻塞游行队伍，并为特使保留观看空间。当大教堂安全、行会合作、财政部支付节日和工作坊费用、工匠可用以及公共秩序得到维护时，进展就会推进。它因破产、占领、严重骚乱、行会罢工、神职人员纠纷、脚手架事故、圆顶损坏、火灾、歌剧院账户腐败、瘟疫般的人群关闭或大理石和兵马俑短缺而暂停。它随着高度繁荣、满意的行会和神职人员、强大的艺术家能力、低腐败、外交访客和成功的先前委托而加速。每个月的记号应该列出实际工作：审计、检查、排练、委托、学徒、游行路线或特使接待。
    completion_logic: >-
      完成需要圆顶、灯笼、帐户、行会、神职人员、唱诗班、作坊、学徒、材料、特使、群众秩序和游行柜台完成。佛罗伦萨必须保持控制，最后的大教堂必须存在，国家不能破产，广场必须安全。最后的场景以钟楼的钟声和从行会大厅到洗礼堂再进入大教堂的游行队伍开始。
      Arte della Lana 和其他行会按照约定的顺序举着横幅；神职人员展示遗物；音乐家根据准备好的书籍进行表演；艺术家展示已完成或委托创作的作品；徒弟与师傅站在一起；歌剧院官员读了一份清白的账目；使节们坐在可以看到圆顶内部和上方灯笼的地方。当公民院长和大教堂神职人员共同确认明年的赞助时间表时，仪式结束。这一奇迹成为了国家能力，因为佛罗伦萨将建筑名声变成了反复出现的声望，以及由熟练艺术家、赞助人和公共节日组成的有组织的管道。
    failure_or_timeout_logic: >-
      仪式可以在没有严格超时的情况下暂停，但如果工作坊缺乏报酬、唱诗班书籍闲置或游行日历失效，文化动力就会衰退。如果赞助商失去佛罗伦萨，最后一座大教堂建筑消失，国家仍然破产，大教堂被占领或严重损坏，或者广场无法维持公共秩序，那么它就会失败或取消。严重的骚乱、行会叛乱、账目腐败、脚手架倒塌、火灾、瘟疫般的关闭、神职人员抵制、材料短缺或战争破坏应该会暂停进度，并可能重置车间、账目或游行计数器。如果圆顶本身损坏，则在获得任何声望奖励之前必须重新检查竣工情况。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对佛罗伦萨的控制、最终独特的大教堂建筑存在、没有破产、没有重复的活动仪式、没有占领或严重骚乱、可用的大教堂和广场、正常运作的工作办公室以及合作行会/神职人员机构。添加对声望、文化传统、行会/市民满意度、神职人员满意度、繁荣、艺术家能力、建筑供应、腐败、火灾或破坏以及外交可见性的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和佛罗伦萨，存储行会/教堂办公室环境，应用临时游行和赞助负担，初始化圆顶检查、灯笼检查、歌剧帐户、行会游行、神职人员日历、唱诗班排练、研讨会的柜台佣金、学徒入学、大理石/兵马俑供应、特使接待、人群秩序和最终祝圣，并记录国家和地方基线。
      snapshot_effect_script: >-
        刷新每月声望、文化传统、声望、行会和神职人员满意度、财政、稳定、腐败、外交能见度、艺术家/学者能力、佛罗伦萨占领、围困、骚乱、破坏、繁荣、大教堂状况、圆顶/灯笼状况、广场通道、车间产出、大理石供应、行会合作、人群安全和最终建筑存在。
      progress_effect_script: >-
        每月检查、预先检查圆顶和灯笼、账户审计、捐赠者/公会账本核对、宴会安排、合唱团复制和排练、游行计划、研讨会委托、学徒注册、材料交付、特使座位、人群控制和最终仪式准备。由于破产、占领、严重骚乱、行会罢工、神职人员纠纷、脚手架事故、穹顶损坏、火灾、账户损坏、人群关闭或材料短缺而暂停或衰退。加速繁荣、艺术家、满意的行会/神职人员、低腐败和来访使节。
      completion_trigger_script: >-
        要求完成公民礼仪柜台或全面进展，佛罗伦萨控制，最终大教堂存在，没有破产，没有占领或不安全的骚乱，圆顶和灯笼完好，歌剧帐户干净，游行路线准备好，委托工作坊，排练音乐和广场公共秩序。
      completion_effect_script: >-
        删除临时仪式负担，应用永久国家修正，保留每月声望和文化传统，授予一次性声望、文化传统、艺术家支持、公会满意度、当地繁荣或外交知名度奖励，添加佛罗伦萨圆顶遗址记忆，清除瞬态变量，并保留完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留monthly_prestige和cultural_tradition_modifier。大教堂通过定期举行的公共仪式、外交参观和可见的报道来赢得声誉；它通过工作坊委托、学徒培训、音乐复制以及行会支持的将公民身份转化为艺术的习惯来深化文化传统。
      one_time_reward: >-
        从完成的节日和赞助周期中授予一次性声望、文化传统、艺术家或顾问进步、行会/市民满意度、神职人员满意度和当地繁荣。当账目干净且讲习班自始至终都得到资助时，向上增加奖励。
      local_building_reward: >-
        佛罗伦萨应该记住检查过的穹顶肋骨、灯笼报告、歌剧账簿、行会游行路线、唱诗班书籍、委托艺术品、学徒名册、大理石供应标记、特使座位计划和人群控制条例。稍后的实施可以将其表达为当地文化、繁荣、建筑技巧或艺术家招募。
    notes: >-
      源仪式是直接的，但定时模式更适合大教堂，其国家影响来自反复的公民赞助和公共展示。每月就够了；战争的挂钩会分散人们对佛罗伦萨行会、作坊和礼拜日历的注意力。将永久奖励与声望和文化传统挂钩，而不是与一般的教会权威挂钩。
- id: 154
  key: unique_leaning_tower_of_pisa
  base_key: city_great_tower
  location: pisa
  source_ritual_key: campanile_stabilization
  status: designed
  ritual_design_zh:
    title: 钟楼稳定和钟声推算
    mode: timed
    duration: >-
      定时模式应该在仔细的工程年中运行。每月十二个刻度代表测量不同季节的倾斜度、检查地基和土壤、检查大理石地面、调节钟声、聚集大学学者和石匠大师、记录实验并将结果提交给市政和大教堂当局。声望和研究速度的回报来自于将一个危险的结构问题转变为一所公立测量学校。
    listeners:
    - monthly
    historical_flavor: >-
      钟楼稳定和钟声推算属于比萨斜塔，因为该塔的名声源于一个明显的缺陷，需要立即观察、克制和公民自豪感。参与者包括大教堂教士、敲钟人、石匠大师、测量员、大学学者、几何教师、挖土工、大理石工人、市政法官、公证员、让人群远离不安全弧线的警卫，以及对塔楼不可能幸存感到好奇的来访学生或特使。这些地方包括奇迹广场、大教堂和洗礼堂、钟楼的拱廊、钟室、地基周边、附近的工作室、大学演讲室以及复制测量数据的公民档案馆。这些物品包括铅垂线、测量杆、标记的石头、土壤样本、楔子、脚手架、钟绳、青铜钟、几何图表、泥瓦匠合同、破解笔记本、重量估计和限制钟声何时响起的公共法令。象征意义是有纪律的好奇心。比萨之所以获得monthly_prestige，是因为它敢于保存和诠释其他城市将其隐藏为失败的奇迹。它之所以获得research_speed，是因为该仪式将实证测量、结构性辩论和记录实验作为公民管理的一部分。
    confirmation_logic: >-
      赞助者必须拥有或控制比萨，最终的斜塔奇迹建筑必须存在，国家不能破产，奇迹广场不能被占领、被围困或遭受严重骚乱。测量员和泥瓦匠必须能够足够方便地进入塔楼；大教堂分会和市政官员必须能够规范钟声的使用；国家必须有足够的国库来支付工程师和警卫的费用。如果实施能够检测到声望、研究速度、学者/顾问的存在、市民或神职人员满意度、建设能力、当地破坏、繁荣、地震或土壤风险变量、稳定性、腐败和当地动乱，那么这些应该形成确认。如果塔楼正在倒塌，广场因战争而关闭，或者敲钟人和神职人员拒绝监管，则不应开始仪式。
    start_logic: >-
      起始效果记录了赞助国、作为仪式地点的比萨、最终的塔楼、大教堂/市政当局背景以及主动稳定周期。它快照了国家基线：monthly_prestige、research_speed、声望水平、学者或大学能力、建筑知识、财政/收入、市民和神职人员满意度、稳定性、腐败和战争状态。它快照了当地的基线：占领、围困、骚乱、破坏、繁荣、塔楼状况、精益严重程度（如果有代表性）、地基风险、广场通道、车间可用性、钟声状况、人群压力和档案访问。它初始化了铅垂线测量、地基检查、土壤取样、大理石路线审查、脚手架安全、钟重审计、鸣钟条例、学者争论、泥瓦匠实验、公共人群控制、档案复制和最终计算等计数器。临时负担包括测量员工资、脚手架、警卫、挖掘人员、更换石头、大学津贴、公证复印以及钟声限制时损失的仪式收入。
    progress_logic: >-
      每月的进度是在公众目光下仔细观察的。测量员在上层画廊悬挂铅垂线，并与上个月进行比较；泥瓦匠检查裂缝、砂浆和大理石层；挖掘机暴露地基附近的小部分以测试潮湿或松软的土壤；学者们在教室里讨论几何形状、重量和对策建议。钟声创始人和敲钟人会称重钟声、测试振动，并起草完整钟声何时安全的规则。市政警卫用绳子围起了广场上不安全的观看区域；公证人将测量结果复制到档案中；大教堂官员平衡礼拜仪式的需要和结构上的谨慎。当比萨安全、财政部支付专家费用、斜塔保持足够稳定以进行检查、学者、神职人员和公民官员合作时，进展就会取得进展。它因破产、占领、围困、严重骚乱、脚手架事故、塔的突然移动、拒绝限制响铃、洪水或土壤危机、工作合同腐败或测量记录丢失而暂停。它凭借高水平的学者能力、繁荣的工场、满意的神职人员/市民、低腐败、稳定的天气和土壤以及现有的建筑专业知识而加速发展。每个月的勾选都应映射到具体的行动：测量、挖掘、钟声审计、讲座、合同审查或公共安全条例。
    completion_logic: >-
      完成需要完成调查、地基、土壤、砖石、脚手架、钟声、法令、学者、实验、人群、档案和最终计算计数器。比萨必须保持控制，最后的塔必须存在，国家不能破产，并且塔必须被认为足够稳定以供监管使用。最后一幕发生在奇迹广场。泥瓦匠展示有标记的石头和裂纹痕迹；测量员显示铅垂线读数；学者们宣读了一篇关于重量和土壤的简明争论；敲钟者展示新限制范围内批准的铃声；大教堂教规接受该法令；民事治安法官将测量书封入档案室。游客目睹的不是一个被修复的谎言，而是一个被管理的奇迹。这一奇迹成为国家能力，因为比萨将建筑危险转化为声望和记录查询，使后来的工程师养成了在建造之前进行测量的习惯。
    failure_or_timeout_logic: >-
      这种仪式可以在没有严格超时的情况下暂停，但如果错过了测量间隔，进展就会减弱，因为精益记录变得不太可比，学者们重新开始辩论。如果赞助商失去比萨、最后一座塔楼消失、国家仍然破产、塔楼倒塌或无法进入、或者广场被占领，那么它就会失败或取消。严重骚乱、脚手架倒塌、钟事故、地基洪水、档案火灾、腐败丑闻、神职人员拒绝调节钟或战争破坏应该暂停进度，并可能重置调查、钟或档案计数器。如果仪式期间塔的状况恶化，则竣工必须需要重新测量，而不是因不安全的景观而获得声望。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对比萨的控制、最终独特的塔楼建筑存在、没有破产、没有重复的活动仪式、没有占领或严重的骚乱、无障碍的塔楼和广场、功能正常的大教堂/市政当局、可供工程师使用的金库以及没有活动的倒塌危机。添加对声望、研究速度、学者能力、建筑技能、神职人员/市民满意度、繁荣、破坏、土壤风险、腐败和战争破坏的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和比萨，存储大教堂/市政当局背景，应用临时工程和安全负担，初始化铅垂线测量计数器，地基检查，土壤采样，大理石课程审查，脚手架安全，钟重审计，敲响法令，学者争论，梅森实验、人群控制、档案复制和最终计算，并记录国家/地方基线。
      snapshot_effect_script: >-
        刷新每月声望、研究速度、声望、学者/大学能力、建筑知识、财政、神职人员和市民满意度、稳定性、腐败、战争状态、比萨占领、围困、骚乱、破坏、繁荣、塔楼状况、倾斜或地基风险、广场通道、车间可用性、钟声状况、人群压力、档案访问和最终建筑存在。
      progress_effect_script: >-
        按月进行提前铅垂线读数、裂缝检查、地基暴露、土壤取样、脚手架检查、钟重、振动/振铃测试、条例起草、学术讲座、泥瓦工实验、人群屏障和档案副本。因破产、占领、围困、严重骚乱、脚手架事故、塔楼突然移动、洪水/土壤危机、拒绝限制钟声、合同腐败或丢失记录而暂停或衰退。为学者、作坊、满意的神职人员/市民、低腐败和稳定的建设条件而加速。
      completion_trigger_script: 要求完成工程柜台或总体进度，比萨控制，最终塔存在，没有破产，没有占领，安全广场，塔足够稳定以供规范使用，密封测量书，批准钟令，并完成最终公共清算。
      completion_effect_script: >-
        消除临时工程负担，应用永久国家修正，保留每月的声望和研究速度、授予一次性声望、研究进展、建筑知识、市民/神职人员满意度或当地繁荣，添加比萨钟楼遗址记忆，清除瞬态变量，并保留完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留monthly_prestige和research_speed。声望来自于在奇迹广场展示精心管理的奇迹；研究速度来自于重复测量、土壤观察、结构实验和存档的工程辩论。
      one_time_reward: >-
        授予一次性声望、研究或创新进展、建设成本/知识收益、市民或神职人员满意度以及来自游客和学者的当地繁荣。奖励应以干净的记录和安全的钟声监管为衡量标准，而不是鲁莽的场面。
      local_building_reward: >-
        比萨应该记住铅垂线标记、土壤样本记录、基坑、裂缝分类账、脚手架检查、钟重书、鸣钟条例、学者争论和存档的测量表。稍后的实施可以将其表达为当地的建筑技术、学术吸引力、旅游声誉或减少灾害风险。
    notes: >-
      源仪式是直接的，但定时模式是必不可少的，因为塔的研究价值取决于一段时间内的重复测量。每月是正确的倾听者；战争钩子并不能表达钟楼的工程教训。将奖励集中在声望和研究速度上，将当地安全和建设奖金作为次要记忆。
- id: 155
  key: unique_milan_cathedral
  base_key: grand_cathedral
  location: milano
  source_ritual_key: marble_spire_consecration
  status: designed
  ritual_design_zh:
    title: Fabbrica 的大理石尖塔奉献
    mode: timed
    duration: >-
      定时模式应在大教堂工程年运行。每月十二个刻度代表确保坎多利亚大理石的安全、在河流和运河路线上移动石头、检查起重机和脚手架、任命雕塑家、祝福尖塔和雕像、核对 Fabbrica del Duomo
      账目、命令教区游行以及公布捐助义务。该仪式提高了国家信仰的容忍度和每月的威望，因为大教堂让共同的崇拜、手工艺劳动和公民的辉煌日复一日地可见。
    listeners:
    - monthly
    historical_flavor: >-
      大理石尖顶奉献仪式属于米兰大教堂，因为大教堂不是一个单一的成品；它是米兰大教堂的一部分。这是一个由白色大理石、哥特式雄心、主教仪式、王公庇护、公民自豪感和专业劳动组成的悠久机构。参与者包括大主教或大教堂分会、大教堂管理员、公爵或市政法官、坎多利亚的采石场官员、运河船夫、起重机操作员、石匠大师、雕塑家、玻璃工人、木匠、行会代表、教区神父、兄弟会、捐赠者、警卫和公证人，他们将礼物转化为负责任的工作。这些地方包括教堂中殿、唱诗班、屋顶走道、尖顶脚手架、大理石庭院、运河码头、采石场、雕塑工作室、牧师会堂、教区街道和大教堂前的广场。这些物品包括标记为
      Fabbrica 的大理石块、起重机、绳索、脚手架木材、雕像模型、圣人图像、彩色玻璃卡通、法衣、圣物盒、捐赠账簿、采石场许可证、游行蜡烛和密封账簿。其象征意义是使公民正统观念变得持久。 tolerance_own
      之所以兴起，是因为该仪式为家庭、行会、教区、神职人员和统治者提供了一个共同的国家信仰项目，其中通过游行、捐赠和可见的圣人来实现归属感。 monthly_prestige 之所以崛起，是因为大理石尖顶宣传这座城市能够支撑艰巨、美丽且国际上清晰的神圣工作。
    confirmation_logic: >-
      赞助商必须拥有或控制米兰，最终的米兰大教堂奇迹建筑必须存在，国家不能破产，大教堂区域、作坊和大理石路线不得被占领、遭到敌对围困或严重动乱。 Fabbrica 或同等工作办公室必须能够记账；神职人员必须足够合作才能举行游行；这座城市必须能够获得大理石、工匠和安全的交通。如果实施能够检测到对国家信仰、威望、神职人员满意度、市民/行会满意度、地方繁荣、建设能力、贸易/河流通道、腐败、破坏、稳定以及首都或公爵宫廷支持的容忍度，那么这些应该形成确认。只有当战争切断大理石路线、关闭广场或阻止工场运转时，才应封锁。
    start_logic: >-
      起始效果记录了赞助国、作为仪式地点的米兰、最终的大教堂建筑、国家信仰背景、Fabbrica 办公室和活跃的大理石尖顶循环。它快照了国家基线：tolerance_own、monthly_prestige、声望水平、神职人员满意度、市民或行会满意度、文化传统（如果有）、国库/收入、稳定性、腐败、建设能力和战争状态。它快照了当地的基线：占领、围困、动乱、破坏、繁荣、大教堂状况、脚手架安全、大理石供应、运河/道路通道、车间可用性、神职人员合作、捐助者信心和人群安全。它初始化采石场分配、大理石运输、起重机检查、脚手架检查、泥瓦匠名册、雕塑家委托、圣像审查、玻璃或装饰工作、教区游行秩序、捐赠分类账审计、尖塔祝福和最终
      Fabbrica 公告等柜台。临时负担包括采石场费、船只和马车租金、绳索和木材、工匠预付款、蜡烛、法衣、公证人、人群警卫，以及因大教堂日程而推迟其他市政工程的费用。
    progress_logic: >-
      每月的进展是 Fabbrica 证明信仰可以组织一座复杂的城市。采石场工作人员在大理石块上做标记以供大教堂使用；船夫和车夫在水路和公路上搬运石头；起重机师傅在起吊滑轮之前测试绳索和滑轮；木匠更新脚手架木材。泥瓦匠布置课程，雕塑家展示圣人和尖塔的模型，玻璃工人准备窗户，神职人员审查图像，以便作品表达国家信仰而不是私人派系。公证人将捐助者的承诺与实际付款进行核对；教区牧师组织街头游行，让社区看到他们在大教堂秩序中的位置；警卫让人群远离落下的石头。当米兰被控制、国库支付负担、大理石路线开放、神职人员和行会合作、骚乱仍然可控时，就会取得进展。它因破产、占领、围困、严重骚乱、采石场关闭、运河中断、脚手架事故、工匠罢工、捐助丑闻、Fabbrica账户腐败、肖像争议或流行病般的人群关闭而暂停。它随着神职人员和行会的强烈满意度、当地繁荣、干净的账目、丰富的大理石、熟练的工匠和宫廷赞助而加速。每个月的刻度应与物理或制度行为联系起来：石头移动、脚手架检查、雕像批准、捐赠账本密封、教区路线设置或尖塔祝福。
    completion_logic: >-
      完成需要采石场、运输、起重机、脚手架、泥瓦匠、雕塑家、图像、装饰品、游行、捐赠者、尖塔和公告柜台完成。米兰必须保持控制，最后的大教堂必须存在，国家不能破产，大教堂区域必须安全。最后的场景开始于教区游行队伍手持蜡烛和行会横幅聚集在广场上。
      Fabbrica 官员展示密封的捐赠者账户；检查新大理石上的采石痕迹；雕塑家揭开圣徒或尖顶装饰品的面纱；神职人员从唱诗班和屋顶线祝福工作；地方法官确认下一个劳工和运输时间表。这座城市认为自己围绕着同一个信仰项目进行管理。这一奇迹成为了国家能力，因为大教堂的工地将国家信仰转化为反复的公共合作，而其尖顶则将威望传播到了伦巴第以外。
    failure_or_timeout_logic: >-
      仪式可以在没有严格超时的情况下暂停，但如果大理石运输停止、脚手架腐烂、捐赠者承诺失效或教区日历不按顺序进行，进展就会减弱。如果赞助商失去米兰、最后一座大教堂建筑消失、国家仍然破产、大教堂被占领或严重损坏、或者
      Fabbrica 办公室倒塌，活动就会失败或取消。严重的骚乱、行会叛乱、神职人员抵制、采石场或运河损失、脚手架灾难、账户腐败、捐赠者拒绝、肖像冲突、火灾或战争破坏应该会暂停进度，并可能重置运输、脚手架或游行柜台。如果城市在占领后恢复，大理石供应和账户合法性必须在完成前重新审核。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对米兰的控制、最终独特的大教堂建筑的存在、没有破产、没有重复的活动仪式、没有占领或严重的骚乱、可用的大教堂/车间、正常运转的 Fabbrica 或工作办公室、合作神职人员/行会以及大理石运输的通道。添加对国家信仰容忍度、威望、神职人员满意度、市民/行会满意度、繁荣、建设能力、贸易/河流通道、腐败、破坏和战争破坏的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和米兰，存储国家信仰和Fabbrica背景，应用临时大教堂工程负担，初始化采石场分配柜台，大理石运输，起重机检查，脚手架检查，石匠名册，雕塑家委员会，圣像审查、玻璃/装饰品工作、教区游行秩序、捐赠账本审核、尖顶祝福和最终公告，并记录国家/地方基线。
      snapshot_effect_script: >-
        刷新tolerance_own、每月声望、声望等级、神职人员满意度、行会/市民满意度、文化传统、财政、稳定、腐败、建设能力、战争状态、米兰占领、围困、动乱、破坏、繁荣、大教堂状况、脚手架安全、大理石供应、运河/道路通道、车间可用性、神职人员合作、捐赠者信心、人群安全和最终建筑存在。
      progress_effect_script: >-
        每月刻度、提前采石场标记、大理石运输、起重机和脚手架检查、石匠作业、雕塑模型、圣像审查、玻璃或装饰工作、捐赠者分类帐审计、教区游行计划、人群控制和尖顶祝福。由于破产、占领、围困、严重动乱、采石场关闭、路线中断、脚手架事故、工匠罢工、捐赠者丑闻、账户损坏、神职人员纠纷或人群关闭而暂停或衰退。加速繁荣、干净的账户、熟练的工匠、忠诚的神职人员/行会和宫廷赞助。
      completion_trigger_script: >-
        要求完成 Fabbrica 柜台或总体进度，米兰控制，最终大教堂存在，没有破产，没有占领，可控的骚乱，安全的脚手架，交付的大理石，批准的图像，密封的捐赠分类账，组织教区游行，并完成尖塔奉献。
      completion_effect_script: >-
        消除临时工作负担，应用永久国家修正，保留对国家信仰和每月威望的宽容，授予一次性威望，神职人员/行会满意度，文化传统，建筑知识或当地繁荣奖励，添加米兰大教堂遗址记忆，清除瞬态变量，并保留完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留 tolerance_own 和 monthly_prestige。大教堂通过让行会、教区、捐助者、神职人员和统治者参与一项可见的虔诚项目，提高了对国家信仰的容忍度。它通过白色大理石尖顶、干净的
        Fabbrica 帐户以及以技术和艺术野心而闻名的工地提供每月的声望。
      one_time_reward: 授予一次性声望、神职人员满意度、行会/市民满意度、文化传统、建筑知识或当地繁荣。奖励应与干净的捐赠者账本、安全的脚手架和不间断的大理石供应相匹配。
      local_building_reward: >-
        米兰应该记住坎多利亚大理石标记、运河运输账本、起重机检查、脚手架名册、雕塑家模型、圣人形象批准、彩色玻璃卡通、教区游行路线、捐赠者账户和尖顶祝福记录。后来的实施可以将其表达为当地的建筑技能、信仰凝聚力、繁荣或文化输出。
    notes: >-
      源仪式是直接的，但定时模式符合大教堂缓慢的制度特征。每月是正确的听众，因为 Fabbrica 通过物质循环和公共游行而不是继承或战争来运作。保持对国家信仰宽容和威望的永久奖励；不要用通用转换替换它。
- id: 156
  key: unique_vatican_archives
  base_key: library_of_nation
  location: rome
  source_ritual_key: apostolic_archive_seal
  status: designed
  ritual_design_zh:
    title: 使徒档案印章和索引
    mode: timed
    duration: >-
      定时模式应运行整个档案年。每月十二个刻度代表密封房间、分类公牛和内裤、对信件进行编目、任命档案员、复制查找工具、登记特使的信件、审核访问权限以及在现场外交问题期间测试检索。只有当档案馆能够保存知识并根据需要生成权威文件时，研究和外交奖励才会出现。
    listeners:
    - monthly
    - ruler_death
    historical_flavor: >-
      使徒档案馆印章和索引属于罗马，因为梵蒂冈档案馆以纸张、羊皮纸、印章、架子和内存的形式存储能量。他们将教皇训令、外交信件、法律特权、请愿书、任命记录、议会法案、财务账目和大使报告变成了可搜索的机构。参与者包括红衣主教、教皇或王室秘书（视赞助商而定）、档案保管员、抄写员、公证员、商会官员、警卫、神学家、教会律师、外交官、翻译、装订员和可信赖的信使，他们可以携带副本而不泄露原件。这些地方是手稿库、密封的箱子、高高的书架、烛光走廊、编目台、观众室、法庭、信使到达的庭院，以及钥匙证明记忆受到控制的上锁的房间。这些物品包括公报、公报、登记簿、条约副本、大使派遣、印章、货架标记、钥匙、蜡、库存、索引、密码列表、外交邮包和访问许可证。象征意义是验证记忆。
      research_speed 之所以上升，是因为学者和官员可以找到先前的决定、法律先例、地理报告和神学论证，而无需重新发现它们。 diplomatic_reputation之所以崛起，是因为外国法院信任一个能够制作密封副本、履行旧承诺、用记录而不是谣言解决争端的国家。
    confirmation_logic: >-
      赞助者必须拥有或控制罗马，最后的梵蒂冈档案馆奇迹建筑必须存在，国家不能破产，档案宫不能被占领、围攻、烧毁、抢劫或遭受严重动乱。国家必须有一个运转良好的大法官办公室或法院办公室、受过教育的职员、足够的国库来支付档案管理员和警卫的费用，并确保特使或信使的出入。如果实施可以检测到研究速度、外交声誉、神职人员满意度、合法性、稳定性、腐败、间谍/保密压力、活跃的外交关系、统治者或教皇的继承、档案火灾风险和当地破坏，那么这些应该形成确认。该仪式不应该在破产、不受控制的解雇、档案丑闻或有争议的继承权导致不清楚谁的印章控制访问权的情况下开始。
    start_logic: >-
      起始效果记录了赞助国、作为仪式地点的罗马、最终的档案建筑、当前的统治者或教皇/法院权威、大法官背景和活跃的档案索引周期。它快照了国家基线：research_speed、diplomatic_reputation、合法性或权威、神职人员满意度（如果相关）、声望、稳定性、腐败、财政/收入、外交关系、间谍或保密压力以及继承风险。它记录了当地的基线：占领、围困、动乱、破坏、繁荣、档案状况、房间安全、火灾风险、警卫纪律、抄写员可用性、特使访问、快递路线安全和货架容量。它初始化用于房间密封、钥匙保管、公牛登记、简要登记、条约登记、大使派遣登记、法律特权索引、神学/理事会索引、外交检索测试、访问许可证审核、抄写员验证和最终印章仪式的计数器。临时负担包括档案保管员的工资、蜡和羊皮纸、锁、警卫、装订、灯、干燥存储、快递费用，以及记录分类时限制访问的管理成本。
    progress_logic: >-
      每月的进展是政府学习其记忆所在的地方。只需一分钟，警卫和密室官员就会清点钥匙、检查锁并用目击蜡密封房间。在另一个案例中，档案管理员将公牛、简报、特权和请愿书分类放入登记册中。抄写员将货架标记复制到查找工具中；粘合剂修复损坏的卷；译者总结外国信件。正典律师和神学家指出哪些理事会法案和法律先例可以回答教义或外交问题。外交文员登记大使派遣、条约副本、索赔、豁免、婚姻或继承文件以及大使信件。访问许可证经过审核，以便学者、特使和官员无需打开敏感房间即可获得摘录。检索测试应该是具体的：回答边界要求，找到旧的特权，产生密封的约会，或者比较两个矛盾的派遣。当罗马安全、职员得到报酬、档案干燥且受到保护、大法官的权威得到承认、信使路线畅通时，进步就会取得进展。它因破产、占领、围困、火灾、抢劫、严重骚乱、伪造印章、访问许可证腐败、抄写员短缺、外交丑闻或继承争议而暂停。它通过高识字率或学识、低腐败、强大的外交网络、忠诚的神职人员或官僚机构、安全的信使和稳定的国库来加速。
      ruler_death 侦听器需要继承记录验证：旧印章、条约、任命和访问许可证在新权限下进行检查。顺利的继任可以增加进步；有争议的一项会冻结密钥保管和外交检索。
    completion_logic: >-
      完成需要完成房间、钥匙、公报、摘要、条约、调度、法律、神学、检索、访问、复印和最终密封柜台。罗马必须保持控制，最终档案必须存在，国家不能破产，档案必须安全，管理当局必须得到承认。最后的场景发生在一个上锁的档案室，然后是观众室。档案管理员提供货架索引；公证人比较印章；警卫移交钥匙保管权；佳能律师展示了对先例的检索；外交人员出示密封的条约副本和大使报告；抄写员证明提取的内容与原件相符。然后，统治者、教皇或授权委员会确认谁可以索取记录，以及密封副本如何成为官方答案。这一奇迹变成了国家能力，因为罗马现在可以将存储的文件转化为更快的研究、可信的外交和有序的机构记忆。
    failure_or_timeout_logic: >-
      仪式可以暂停，但如果房间仍未密封或索引因没有架子标记的新信件堆积而过时，进展就会衰退。如果赞助商失去了罗马，最后的档案馆消失了，国家仍然破产，档案馆被洗劫或烧毁，或者关键监护权被敌人或竞争对手夺取，那么它就会失败或取消。严重骚乱、伪造记录、档案失火、潮湿废墟、外交泄密、访问许可证腐败、抄写员罢工、信使崩溃、神职人员或大法官管辖权冲突，或有争议的统治者继承应该暂停进度，并可能重置房间、钥匙或登记柜台。战争通过安全和信使访问来解决问题，而不是作为直接的奖励来源。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对罗马的控制，最终独特的档案馆存在，没有破产，没有重复的活动仪式，没有占领，围攻，火灾/解雇情况，或严重的骚乱，运作的大法官，公认的统治者/法院权威，可用的书记员和警卫，安全的特使/信使访问，以及没有未解决的印章或继承危机。添加对研究、外交、神职人员/官僚满意度、腐败、保密压力、破坏和档案条件的主题检查。
      start_effect_script: >-
        将仪式与赞助商和罗马绑定，存储统治者/教皇权力和大法官背景，应用临时档案安全和索引负担，初始化房间密封计数器，钥匙保管，公牛登记册，简报登记册，条约登记册，大使派遣登记册，法律特权索引，神学/理事会索引，检索测试，访问许可证审计，抄写员验证和最终印章仪式，并记录国家/地方基线。
      snapshot_effect_script: >-
        刷新研究速度、外交声誉、合法性/权威、神职人员或官僚满意度、声望、稳定性、腐败、财政部、外交网络、保密压力、继承风险、罗马占领、围困、动乱、破坏、繁荣、档案状况、房间安全、火灾风险、警卫纪律、抄写员可用性、特使访问、信使安全、货架容量和最终建筑物的存在。
      progress_effect_script: >-
        在每月的刻度上，提前关键库存、房间封条、登记排序、货架标记、装订修复、翻译摘要、法律和神学索引、条约和调度登记、访问许可证审计、抄写员检查以及实时外交或学术问题的检索测试。因破产、占领、围困、火灾、抢劫、严重骚乱、伪造印章、腐败访问、抄写员短缺、泄密、快递失败或继承争议而暂停或衰退。在ruler_death上，要求验证新权力机构下的印章、条约、任命和档案许可。
      completion_trigger_script: >-
        要求完成档案柜台或总体进度，罗马控制，存在最终档案，没有破产，没有占用或解雇，安全房间和钥匙，密封登记册，功能检索测试，验证副本，认可的管理机构，并完成最终封印仪式。
      completion_effect_script: >-
        消除临时档案负担，应用永久国家修饰符，保持研究速度和外交声誉，授予一次性研究进展、外交信誉、合法性、神职人员或官僚满意度，或保密/命令奖励，添加梵蒂冈档案站点内存，清除瞬态变量，并保留完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留research_speed和diplomatic_reputation。研究的进步是因为索引、先例、报告和查找工具使存储的知识变得可用。外交声誉得到改善，因为密封记录让国家可以通过可靠的副本证明承诺、任命、特权和条约主张。
      one_time_reward: >-
        授予一次性研究进展、外交声誉或恩惠、经过验证的继承记录的合法性、神职人员/官僚满意度或减少腐败/保密风险。如果ruler_death发生在周期内，则将部分奖励用于顺利转移印章和访问权。
      local_building_reward: >-
        罗马应该记住密封的档案室、钥匙保管清单、货架标记、公牛和简报登记册、条约副本、大使派遣包、访问许可证、复制标记、检索测试记录以及防火或警卫程序。稍后的实施可以将其表达为当地学者的产出、外交使团的支持或对文件丢失的抵抗。
    notes: >-
      源仪式是即时的，但定时模式更好地代表了索引和保护档案的劳动。每月捕获记录工作； ruler_death 被保留，因为档案证明了印章、任命、条约和继承后权利的连续性。将奖励集中在研究和外交信誉上，而不是一般的虔诚或声望上。
- id: 157
  key: unique_temple_of_heaven
  base_key: sky_dome_grand_temple
  location: dadu
  source_ritual_key: heavenly_sacrifice
  status: designed
  ritual_design_zh:
    title: 冬至祭天
    mode: timed
    duration: >-
      定时模式应涵盖冬至祭天和丰收祈福周期之前的一个祭祀年。月代表历法计算、宫斋斋戒、祭祀牲畜和谷物的选择、坛台的修缮、礼乐舞蹈的排练、器皿的净化、柏树林和行道的巡查、君与天的最后沟通。国家信仰的合法性和宽容性来自于反复的准备，而不是按一下按钮。
    listeners:
    - monthly
    - ruler_death
    historical_flavor: >-
      冬至祭祀属于天坛，因为这一复杂性使帝国统治成为可见的宇宙服务。其圆形祭坛、青瓦祈年殿、大理石露台、柏树林、大门、灵道、斋堂，将统治者从普通君主变成了在仪式上负责天、历、收成、人之间和谐的人。参加者包括皇帝或公认的统治者、礼部官员、天文历官、乐师、舞蹈家、祭祀动物饲养员、粮食巡查员、监察员、侍卫、太监或宫廷侍从（如果适用）、记录抄写员以及为祈祷提供收获报告的省级官员。地点有祈年殿、圜丘坛、御库或牌位殿、斋宫、祭灶、库房、大门、柏树道、宣布仪式结果的朝堂等。器物有神位、玉器、铜器、蓝色礼服、历书、乐器、舞碑、祭祀动物、粮样、香、帛、路印、御史等。
      monthly_legitimacy 上升是因为统治者公开接受对宇宙和农业秩序的仪式责任。 tolerance_own之所以兴起，是因为国家信仰机构、官员和臣民认为他们的做法在公认的帝国仪式下得到协调，而不是相互竞争的地方主张。
    confirmation_logic: >-
      赞助者必须拥有或控制大都，最终的天坛奇迹建筑必须存在，国家不能破产，寺庙区域、游行道路和法庭通道不得被占领、遭到敌对围困或遭受严重动乱。该国必须有一位公认的统治者或摄政王能够授权举行该仪式；如果统治者本人无法出席，则应要求合法的摄政替代或推迟最终法案的实施。如果可以的话，检查应考虑每月的合法性、国家信仰的容忍度、当前的合法性、稳定性、宗教团结、神职人员/仪式官员的满意度、收获或饥荒压力、破坏、法院支出能力、日历/天文办公职能和继承危机。战争不应该自动阻止准备工作，但敌人对大都的威胁、封锁粮食/动物供应或宫廷逃亡应该阻止战争的开始。
    start_logic: >-
      起始效果记录了赞助国、作为仪式地点的大都、最终的寺庙建筑、统治者或摄政、国家信仰/仪式背景以及活跃的天祭周期。它快照了国家基线：monthly_legitimacy、tolerance_own、合法性、稳定性、宗教团结或国家信仰凝聚力、仪式/神职人员满意度、国库/收入、宫廷支出压力、收获/饥荒状况、战争状态和继承风险。它记录了当地的基线：占领、围困、动乱、破坏、繁荣、寺庙状况、祭坛状况、斋戒宫殿通道、游行道路安全、礼器状况、动物和粮食供应、日历办公室准备情况和人群控制。它初始化了日历计算、收获报告收集、斋戒法令、禁宫准备、器皿净化、动物选择、谷物检查、音乐排练、舞蹈排练、祭坛修复、牌位放置、游行路线和最后的至日祭祀等计数器。临时负担包括祭祀办公俸禄、畜粮费用、乐舞训练、器皿修理、警卫部署、道路清扫、监察审查、以及使统治者服从祭祀纪律的政治成本。
    progress_logic: >-
      每月的进展是宇宙秩序在行政上变得有形。历法官员计算吉祥日期，并将夏至时间与天文记录进行比较。省级书记官会提交收成报告，以便法庭知道仪式必须解决哪些焦虑。礼官视察礼拜殿、圜丘石、牌位室、祭灶、器皿库等。动物饲养员选择完美的产品；谷物检验员测试样品；音乐家和舞者排练曲目，其顺序必须与仪式手册相匹配。检查员核实统治者是否遵守斋戒、戒除不当娱乐、并通过正确的大门。警卫清理游行道路，抄写员准备祈祷文。当大都安全、统治者或摄政得到承认、仪式官职得到支付、物资到达、公共秩序平静时，进步就会推进。它因破产、占领、围困、严重动乱、逃亡、祭坛受损、石板丢失、动物疾病、粮食短缺、日历纠纷、审查丑闻或继承冲突而暂停。它以高度的合法性、强大的国家信仰凝聚力、丰收、满意的礼仪官员、稳定的国库、低破坏性和运转良好的天文/历法办公室而加速。
      ruler_death 监听器是核心：如果统治者去世，则循环必须执行继承者的天堂通知识别。平稳的继任将进展转化为新的任务；有争议的继承权会冻结禁食、石碑和最后的祭祀计数器，直到上天召唤一位公认的统治者。
    completion_logic: >-
      完成需要历法、丰收、斋戒、宫殿、器皿、动物、粮食、音乐、舞蹈、坛、牌位、路线、最后的祭祀计数器完成。大都必须保持控制，最后的寺庙必须存在，国家不能破产，统治者或摄政必须得到承认。最后一幕在黎明前开始。统治者穿着规定的服装离开斋宫，穿过森严的大门和柏树道，登上大理石平台，祭天，而音乐、舞蹈、香火和祭器则按照日历的顺序进行。礼官呈献丰收报告和神位；审查员记录是否遵守了表格；抄写员准备向王国发布公告。闭幕公告称，统治者已接受对天、收成和人民的责任。这一奇迹变成了国家能力，因为寺庙将合法性从个人魅力转变为日历、国家信仰、农业福利和宫廷服从之间有纪律的年度纽带。
    failure_or_timeout_logic: >-
      仪式可以暂停，但如果夏至窗口过去而没有正确完成，进展就会衰退，因为必须在下一个周期重新计算斋戒和日历计数器。如果赞助者失去了大都、最后的寺庙建筑消失、国家仍然破产、祭坛被占领或亵渎、朝廷逃跑、或者为仪式指定的统治者在承认之前被废黜，仪式就会失败或取消。严重的骚乱、饥荒供应崩溃、动物疾病、药片丢失、仪式性办公室抵制、日历丑闻、对禁食不当的审查指控、继承危机或敌人围攻应该会暂停进度，并可能重置禁食、路线或最终牺牲计数器。当战争威胁到大都或仪式供应链时，它就很重要。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对大都的控制、最终独特的寺庙建筑存在、没有破产、没有重复的活跃仪式、没有占领或敌对围困、可控的骚乱、公认的统治者/摄政、可用的法庭和游行通道、功能正常的仪式/日历办公室以及可用的谷物/动物供应。添加对合法性、宽容/国家信仰凝聚力、稳定性、仪式官员满意度、丰收/饥荒压力、破坏、朝廷支出和继承危机的主题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和大都，存储统治者/摄政和国家信仰背景，应用临时仪式准备负担，初始化日历计算计数器，收获报告，禁食法令，禁欲宫殿，器皿净化，动物选择，谷物检查，音乐排练，舞蹈排练、祭坛修复、牌位放置、游行路线和最后的冬至祭祀，并记录国家/地方基线。
      snapshot_effect_script: >-
        刷新每月合法性、tolerance_own、合法性、稳定性、宗教统一/国家信仰凝聚力、仪式/神职人员满意度、国库、宫廷支出压力、收获/饥荒状况、战争状态、继承风险、大都占领、围攻、动乱、破坏、繁荣、寺庙状况、祭坛状况、斋戒宫殿通道、道路安全、船只状况、动物/谷物供应、日历办公室准备情况、人群控制和最终建筑存在。
      progress_effect_script: >-
        每月的记号、提前日期计算、收获报告收集、禁食执行、宫殿准备、器皿清洁、动物和谷物检查、音乐和舞蹈排练、祭坛修复、牌位放置、路线清理、祈祷起草和最后仪式准备。由于破产、占领、围困、严重动乱、法庭逃亡、祭坛受损、牌匾丢失、供应失败、日历纠纷、审查丑闻或继承危机而暂停或衰退。在ruler_death上，在最终完成之前需要后继天堂通知验证。
      completion_trigger_script: >-
        要求完成天祭计数器或总进度，大都控制，最终寺庙存在，没有破产，没有占领或不安全的围困，可控的骚乱，公认的统治者/摄政，完成斋戒，净化器皿，选定的祭品，准备音乐/舞蹈，放置平板电脑，清理路线和有效日历日期。
      completion_effect_script: >-
        删除临时仪式负担，应用永久国家修正，保留每月的合法性和国家信仰的宽容，授予一次性合法性，稳定性，仪式官方满意度，收获信心或骚乱缓解，添加天坛遗址记忆，清除瞬态变量，并保留完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留monthly_legitimacy和tolerance_own。寺庙通过要求统治者向天履行公共的历法义务来产生每月的合法性。它通过将宫廷仪式、神职人员或仪式官员、收获报告和公共秩序置于一个单一的公认框架中来增加对国家信仰的容忍度。
      one_time_reward: 授予一次性合法性、稳定性、国家信仰凝聚力、仪式官员满意度、当地骚乱减少和收获信心。如果ruler_death发生，将部分奖励用于表彰继任者并减少委任焦虑。
      local_building_reward: >-
        大都应记住清理的柏树道路、修复的祭坛石、净化的器皿、日历表、收获报告包、斋戒宫殿记录、选定的动物和谷物清单、音乐和舞蹈名册、牌位放置和审查记录。稍后的实施可以将其表达为当地法院命令、合法性恢复或丰收/饥荒恢复力。
    notes: >-
      源仪式是即时的，但定时模式更好地代表了为天祭做准备的日历年。每月处理礼仪官僚事务； ruler_death 被保留，因为继承必须先向天堂宣布，合法性才能顺利延续。保持合法性和国家信仰宽容的永久奖励，而不是一般的威望或皈依。
- id: 158
  key: unique_dujiangyan
  base_key: giant_dam_project
  location: chengdu
  source_ritual_key: fish_mouth_water_division
  status: designed
  ritual_design_zh:
    title: 首选鱼口水分区开通
    mode: auxiliary_building
    duration: >-
      auxiliary_building模式，因为都江堰不是一年仪式，而是永久维护网络。附属建筑包括水位站、竹笼石库、疏浚人员营房、航道标志、工程师办公室以及与鱼嘴堤、飞沙堰和瓶颈航道相连的当地劳动力粮仓。竣工意味着这些维护节点被接受为国家建设和生产系统的一部分。
    listeners:
    - monthly
    historical_flavor: >-
      鱼口水利枢纽工程属于都江堰，因为该系统的天才不是一个巨大的拦河坝，而是对岷江的管理分流，灌溉成都平原，同时带走洪水和泥沙。参与者包括水利工程师、地方官员、工头、疏浚人员、竹工、运石工、灌区农民、粮仓职员、船夫、测量员、纪念工程创始人的神社或祖先侍从，以及防止私自开凿渠道的守卫。这些地方有分流的鱼嘴堤、泄洪泥沙的飞沙堰、补给平原的瓶颈航道、支渠、水闸、检查道、田间口、劳务站、以及依赖可靠水源的成都粮仓。这些物品包括装满石头的竹笼、挖泥篮、水尺、淤泥棒、木桩、航道图、劳务花名册、口粮簿、修理台账和季节性洪水报告。其象征意义是通过有节制的克制进行生产。
      global_production_efficiency 上升是因为田地和车间的水源更加稳定，洪水冲击也更少。 global_build_buildings_efficiency之所以失败，是因为相同的工程师、劳动力名册、材料库和测量习惯教导国家因地制宜地建设而不是蛮力浪费。
    confirmation_logic: >-
      赞助商必须拥有或控制成都，最后的都江堰奇迹建筑必须存在，国家不能破产，河流工程、支渠和劳工路线不能被占领、破坏或被严重动乱淹没。当地水情必须可用：不遭受彻底的洪水灾害，不因道路塌陷而干涸，不被敌对势力封锁。如果实施能够检测生产效率、建筑成本、当地农业、繁荣、破坏、洪水或饥荒风险、劳动力可用性、农民满意度、河流通道、基础设施状况、腐败以及地方自治或土匪行为，那么这些应该形成确认。只有当战争阻止船员到达堤坝或征用无法使用的劳动力粮仓时，才应阻止战争。
    start_logic: >-
      启动效果记录了主办国成都作为仪式场地、最终的水厂建筑、计划中的辅助维护网络以及活跃的鱼嘴分区周期。它快照了国家基线：global_production_efficiency、global_build_buildings_efficiency、财政/收入、建设能力、劳动力/人力压力、稳定性、腐败、粮食供应或饥荒压力以及战争状态。它反映了当地的基线：占领、动乱、破坏、繁荣、河流状况、洪水/淤泥压力、运河状况、农业产出、劳动力可用性、农民满意度、仓库库存、路线安全和现有辅助建筑。初始化水位安装、鱼口检查、飞沙堰清除、瓶颈航道切割、竹笼制作、石料堆存核算、疏浚人员排班、劳粮配给、支渠勘察、现场出水口仲裁、洪水报告、最终分水等计数器。临时负担包括工资、配给粮食、竹子、石头、绳索、工具、勘察桩、地方官员旅行以及在正确季节从田地里抽出劳动力的机会成本。
    progress_logic: >-
      每月的进展是实用的水文学。测量员读取水位计并标记内外通道是否正确分流。工作人员更换竹笼，用石头包裹，并检查鱼嘴是否在水流下移动。挖泥船在飞沙堰附近清除淤泥，这样洪水就可以溢出沉积物，而不是掩埋运河。工程师检查瓶颈航道是否有冲刷、倒塌的河岸和障碍物。农民报告田间出口是否获得足够的水；地方法官仲裁上下游村庄之间的纠纷；粮仓职员为徭役或有偿劳动发放口粮；
      boatmen move stone and timber;神社侍者和长老目睹了通道的打开，因此私人篡改成为公共犯罪。当成都得到控制、辅助补给站得到供应、船员得到工资或配给、骚乱得到控制、河流条件允许工作时，进展就会取得进展。它因破产、占领、严重动乱、洪水紧急情况、暴露错误测量的干旱、淤泥涌动、破坏、劳动力外流、腐败的材料账目、强盗控制路线或农民在不公平的水分配后拒绝而暂停。它随着繁荣、强大的当地农业、干净的账目、可用的劳动力、良好的基础设施、忠诚的农民社区和以前的辅助建筑而加速。每月的刻度线应代表指定的维护：读取仪表、更换笼子、疏浚堰、切割渠道、完成支流调查或解决水纠纷。
    completion_logic: >-
      竣工要求辅助养护管网达到规定水位，水尺、鱼口、堰、渠道、网箱、石料、船员、粮仓、支渠、出水口、报汛、开柜等齐全。成都必须保持受控，最终的建筑必须存在，国家不能破产，河道工程必须能够实际使用。最后一幕发生在灌溉季节之前的鱼嘴。工程师读取仪表，地方法官比较现场请愿书，工头出示花名册，粮仓职员清点口粮，竹子工人展示替换的笼子，疏浚人员打开沉积物切口，平原上的农民见证了第一次将水分配到渠道中。州公告确认了维护义务、维修站以及私自切割的处罚。这一奇迹成为国家能力，因为都江堰的方法作为行政知识输出：测量、划分、疏浚、配给，并与河流一起建造，而不是逆流而上。
    failure_or_timeout_logic: >-
      辅助建筑仪式不应该有普通的超时，但如果由于仪表腐烂、淤泥数据陈旧、竹笼失效、劳动力名册不再与村庄匹配而忽视维护节点，进度就会衰退。如果主办方失去成都、最终的水利工程建筑消失、国家破产、工程被占领或毁坏、或者河流系统被永久切断，则该项目失败或取消。严重动乱、水灾、干旱危机、破坏、物资库腐败、农民水乱、劳工​​粮仓枯竭、巡查道被盗贼控制、或战争征用人员时，应暂停进度，并可能重置仪表、疏浚或支渠计数器。洪水破坏后，竣工触发应要求重新调查，而不是依赖旧的进度。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对成都的控制、最终独特的水厂建筑存在、没有破产、没有重复的活动仪式、没有占领、破坏或严重骚乱、可用的河流/运河通道、可用的劳动力和材料以及建造或维护辅助站的能力。添加生产效率、建筑成本、农业、繁荣、破坏、洪水/饥荒压力、农民满意度、腐败、基础设施状况、路线安全和战争干扰等主题检查。
      start_effect_script: >-
        绑定仪式到赞助商和成都，创建或标记计划的辅助维护建筑，施加临时劳动力/材料负担，初始化仪表安装计数器，鱼嘴检查，飞沙堰清理，瓶颈航道切割，竹笼，石料堆放，疏浚人员，劳动力粮仓配给、支渠调查、出水口仲裁、洪水报告和最终通航，并记录国家/地方基线。
      snapshot_effect_script: >-
        刷新生产效率、建筑成本修正、财务、建设能力、劳动力压力、稳定、腐败、粮食或饥荒压力、战争状态、成都占领、动乱、破坏、繁荣、河流状况、洪水/淤泥压力、运河状况、农业、劳动力可用性、农民满意度、仓库库存、路线安全、辅助建筑水平和最终建筑存在。
      progress_effect_script: >-
        月报、提前量表读数、堤防检查、竹笼更换、石料运送、飞沙堰疏浚、瓶颈航道清理、支渠调查、现场仲裁、粮仓配给、人员排班、洪水报告、附属建筑竣工等。因破产、占领、严重骚乱、洪水紧急情况、干旱危机、淤泥涌动、破坏、劳动力外逃、腐败仓库、土匪行为或不公平的水分配而暂停或衰退。加速实现繁荣、廉洁、劳工、农业和现有基础设施。
      completion_trigger_script: >-
        要求完成所需的辅助建筑层或所有关键维护柜台，成都控制，最终建筑存在，没有破产，没有占领或破坏性洪水条件，可控的骚乱，可用的仪表，清理的堰，开放的渠道，库存库，分配的人员，解决出水口纠纷，并准备好最终的水分配。
      completion_effect_script: >-
        消除临时维护负担，应用永久国家修改器保护生产效率和降低建筑成本，授予一次性当地繁荣、粮食安全、金库、建筑知识或抗洪奖励，添加都江堰遗址记忆，清除瞬态计数器，并保留辅助完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留global_production_efficiency和global_build_buildings_efficiency。由于水更可靠地到达田地和车间，生产得到改善；建筑成本下降，因为都江堰办事处教授测量、材料分期、劳动力配给和适应性工程，以减少国家项目中的浪费。
      one_time_reward: 实现当地一次性繁荣、农业恢复、粮食或饥荒救济、建设进度、国库储蓄、农民满意度或减少破坏。以干净的洪水报告、公平的用水仲裁、完善的辅助维护节点为尺度奖励。
      local_building_reward: >-
        成都要牢记量石、鱼嘴检查标志、疏浚飞沙堰切口、瓶颈清理记录、竹笼库、石堆、劳粮台账、支渠图、出水口仲裁卷、洪水报告。稍后的实施可以将其表达为当地农业、抗洪、较低的建筑成本或灾后更快的恢复。
    notes: >-
      源仪式是直接的，但auxiliary_building模式最适合都江堰，因为它的动力来自持久的维护网络。每月是正确的听众，因为每个月都有具体的水和沉积物工作。保持生产效率和建筑成本降低的永久奖励；威望或合法性至多应该是次要的。
- id: 159
  key: unique_porcelain_tower_of_nanjing
  base_key: giant_tower_temple
  location: shangyuan
  source_ritual_key: glazed_lantern_rite
  status: designed
  ritual_design_zh:
    title: 瓷塔琉璃灯祭
    mode: timed
    duration: >-
      定时模式应运行一年的庙会。每月十二个刻度代表检查琉璃瓦、修塔灯、安排灯夜、抄经、准备讲经、登记供养者、管理香客流动、维护报恩寺院区。该塔通过有组织的教学、文本和朝圣，通过反复的公共光辉和转化速度产生每月的声望。
    listeners:
    - monthly
    historical_flavor: >-
      琉璃灯仪式属于南京瓷塔，因为报恩寺的宝塔不仅以其高度而闻名，而且以其发光的物质文化而闻名：琉璃瓦、五彩表面、悬灯、佛像、舍利协会以及能够从街道和河道上看到神圣光芒的城市观众。参与者包括住持、僧人、抄经者、瓦匠、窑匠、灯匠、木匠、施主、香客、知县、侍卫、搬运工、香商、河商等，他们的天赋和行动将塔与南京的经济联系在一起。这些地方包括塔层、楼梯、舍利像殿、写字间、灯库、瓦房、寺庙庭院、施主殿、香客门、附近的市场以及可以看到塔灯的城市或河流的有利位置。器物有琉璃砖、瓷砖、灯架、油坛、香炉、经卷、木刻、供养牌位、香经符、僧名册、舍利匣、修葺架、市众法器等。
      monthly_prestige之所以崛起，是因为这座塔反复展现了技术的辉煌和神圣的可见性。 global_pop_conversion_speed_modifier之所以兴起，是因为讲经、抄经、观舍利、引导香客将敬畏变成了可教的实践。
    confirmation_logic: >-
      赞助商必须拥有或控制上元，最后的瓷塔奇迹建筑必须存在，国家不能破产，塔和报恩寺辖区不能被占领、焚烧、遭到敌对围困或遭受严重动乱。这座塔必须足够方便僧侣、工匠、捐赠者和朝圣者进入； lamps
      and stairs must be safe;地方当局必须能够管理人群。如果实施可以检测每月的声望、转换速度、神职人员或修道院的满意度、工匠能力、当地繁荣、宗教团结/宽容、火灾风险、破坏、贸易/河流交通和公共秩序，那么这些应该形成确认。只有当战争关闭辖区、破坏朝圣路线或将塔楼变成军事观察所而不是寺庙时，战争才会封锁。
    start_logic: >-
      The start effect records the sponsoring country, Shangyuan as ritual site, the final tower building,
      the temple/faith context, and the active Glazed Lantern cycle. It snapshots country baselines: monthly_prestige,
      global_pop_conversion_speed_modifier, prestige level, religious unity or tolerance, clergy/monastic
      satisfaction, cultural tradition, treasury/income, artisan capacity, stability, and war state. It
      snapshots local baselines: occupation, siege, unrest, devastation, prosperity, tower condition,
      tile condition, stair safety, fire risk, lamp oil supply, scriptorium capacity, donor confidence,
      pilgrim access, market/river traffic, and crowd control. It initializes counters for tile inspection,
      scaffold repair, lamp inventory, lantern-night calendar, sutra copying, sermon preparation, relic
      or image display, donor tablet registration, pilgrim route marking, artisan payment, crowd watch,
      and final illuminated dedication. The temporary burden represents oil, lamp frames, tile repairs,
      scaffolds, monk stipends, copyist paper, incense, guards, crowd barriers, and artisan wages.
    progress_logic: >-
      Monthly progress is the tower making light legible. Tile masters inspect each exposed tier for cracked
      glaze and replace damaged pieces;脚手架工作人员修理楼梯和栏杆； lamp keepers count frames, oil, wicks, and safe
      hanging points. Monks copy sutras, prepare public sermons, arrange relic or image viewings, and
      train guides to explain the tower's stories to pilgrims rather than simply pushing crowds through
      the gates. Donor clerks record offerings on tablets and account books; artisans and kiln workers
      receive payment so repairs do not become casual patchwork; magistrates set market boundaries, fire
      watches, and night-opening rules. Pilgrim guides coordinate routes from city gates and river landings,
      while guards keep the stairways from overcrowding. Progress advances when Shangyuan is secure, the
      treasury pays the burden, monks and artisans cooperate, the tower is safe, and pilgrim movement
      remains orderly. It pauses for bankruptcy, occupation, siege, severe unrest, fire, storm damage,
      lamp-oil shortage, unsafe stairs, tile collapse, donor scandal, monk dispute, crowd panic, or blocked
      pilgrimage routes. It accelerates with high prosperity, strong artisan capacity, satisfied clergy,
      good trade/river traffic, clean donor records, and previous temple investment. Each monthly tick
      should represent an actual action: tile replacement, lamp inventory, sutra copying, sermon rehearsal,
      donor registration, pilgrim routing, or fire watch.
    completion_logic: >-
      Completion requires tile, scaffold, lamp, calendar, sutra, sermon, relic/image, donor, pilgrim,
      artisan, crowd, and final-dedication counters to be complete. Shangyuan must remain controlled,
      the final tower must exist, the state must not be bankrupt, and the tower must be safe for night
      viewing.最后的场景发生在日落之后。 Monks chant from the temple court, lamp keepers light tier after tier, glazed
      tiles catch the flames, donors see their tablets read, pilgrims receive copied sutra slips or instruction,
      artisans present repaired tiles, and magistrates open a controlled route through the precinct. The
      city and river see a tower that is splendid, taught, maintained, and governed. The wonder becomes
      national capacity because public brilliance is tied to an organized system of texts, monks, donors,
      artisans, and pilgrims that can spread faith while increasing the state's visible prestige.
    failure_or_timeout_logic: >-
      The ritual can pause without strict timeout, but progress should decay if festival seasons pass
      because lamps deteriorate, donor confidence fades, copied sutras go unused, and tile damage spreads.
      It fails or cancels if the sponsor loses Shangyuan, the final tower building disappears, the country
      remains bankrupt, the tower burns, the precinct is occupied, or stair and lamp safety cannot be
      restored. Severe unrest, fire, crowd deaths, donor fraud, monk faction dispute, blocked pilgrim
      routes, artisan shortage, trade collapse, or war devastation should pause progress and may reset
      lamp, tile, donor, or pilgrim counters.
    implementation_mapping:
      confirmation_trigger_script: >-
        Check sponsor control of Shangyuan, final unique tower building presence, no bankruptcy, no duplicate
        active ritual, no occupation, siege, fire, or severe unrest, usable temple precinct, safe tower
        access, available僧侣/工匠，以及可控的人群条件。 Add thematic checks for prestige, conversion speed, clergy satisfaction,
        artisan capacity, prosperity, religious unity/tolerance, fire risk, trade/river traffic, and pilgrim
        access.
      start_effect_script: >-
        Bind ritual to sponsor and Shangyuan, store temple/faith context, apply temporary lantern and
        maintenance burden, initialize counters for tile inspection, scaffold repair, lamp inventory,
        lantern-night calendar, sutra copying, sermon preparation, relic/image display, donor tablet registration,
        pilgrim route marking, artisan payment, crowd watch, and final illuminated dedication, and record
        country/local baselines.
      snapshot_effect_script: >-
        Refresh monthly prestige, conversion speed, prestige, religious unity or tolerance, clergy/monastic
        satisfaction, cultural tradition, treasury, artisan capacity, stability, war state, Shangyuan
        occupation, siege, unrest, devastation, prosperity, tower condition, tile condition, stair safety,
        fire risk, lamp oil, scriptorium capacity, donor confidence, pilgrim access, market/river traffic,
        crowd control, and final building presence.
      progress_effect_script: >-
        On monthly ticks, advance glazed tile replacement, scaffold repair, lamp and oil inventory, lantern
        calendar, sutra copying, sermon rehearsal, relic or image display preparation, donor tablets,
        pilgrim routes, artisan wages, fire watches, crowd ordinances, and final lighting readiness. Pause
        or decay for bankruptcy, occupation, siege, severe unrest, fire, storm damage, oil shortage, unsafe
        stairs, tile collapse, donor scandal, monastic dispute, crowd panic, or blocked pilgrim routes.
        Accelerate for prosperity, artisans, satisfied clergy, river trade, and clean donor records.
      completion_trigger_script: >-
        Require completed lantern-rite counters or total progress, Shangyuan controlled, final tower present,
        no bankruptcy, no occupation or fire crisis, safe stairs, available lamps and oil, copied sutras,
        prepared sermons, registered donors, controlled pilgrim route, and final night lighting ready.
      completion_effect_script: >-
        Remove temporary lantern burden, apply permanent country modifiers preserving monthly prestige
        and conversion speed, grant one-time prestige, clergy satisfaction, cultural tradition, local
        prosperity, or pilgrimage income rewards, add Porcelain Tower site memory, clear transient variables,
        and retain completion/cooldown flags.
    intended_rewards:
      permanent_country_modifier: >-
        Preserve monthly_prestige and global_pop_conversion_speed_modifier.威望来自于塔楼反复出现的发光奇观和可见的技术维护；皈依速度来自于抄经、讲经、观赏舍利、引导朝圣和捐助寺院教学。
      one_time_reward: 授予一次性威望、文化传统、神职人员或修道院满意度、当地繁荣、朝圣收入，或从完成的光明奉献中获得少量的皈依进展。奖励应以安全人群、清理捐献记录和修复瓷砖为标准。
      local_building_reward: >-
        上院应记住更换琉璃瓦、灯库存、灯夜历、抄经、讲经名册、供养牌位、朝圣路线标记、消防岗哨、工匠付款单和夜间开放条例。稍后的实施可以将其表达为当地朝圣收入、信仰教导、工匠产出或防火恢复能力。
    notes: >-
      源仪式是直接的，但定时模式适合塔的节日、维护和教学周期。每月一次就足够了，因为设计是由寺庙工作驱动的，而不是战争或继承。将永久奖励与声望和转换速度挂钩，而不是与一般贸易或军事瞭望塔效果挂钩。
- id: 160
  key: unique_jingdezhen_imperial_kilns
  base_key: giant_workshop_complex
  location: fuliang
  source_ritual_key: imperial_kiln_seal
  status: designed
  ritual_design_zh:
    title: 御窑印记和烧制登记
    mode: timed
    duration: >-
      定时模式应涵盖一个车间一年内的多个烧制周期。每月十二个刻度分别代表取土、制坯、抛制、干燥、素烧、试釉、青花、装窑、温度管理、御检、整理、封印、送往宫廷和贸易渠道。只有当窑炉能够规模化重复质量时，生产效率和贸易收入才会提高。
    listeners:
    - monthly
    historical_flavor: >-
      御窑印记和烧制记录属于景德镇，因为该遗址的动力是一个有组织的瓷器生态系统：粘土源、水、燃料山、专业户、龙窑、画师、检验员、商人和宫廷需求都聚集在浮梁。参加者包括御窑监、窑师、洗泥工、投掷工、制模工、画工、调釉工、樵工、木炭工、火工、质检员、抄写员、包装工、河商和宫廷官员，他们决定哪些作品成为贡品。地点有土场、沉淀池、抛棚、画房、釉坊、龙窑、燃料库、检验厅、储藏库、河岸、帐房等。这些物品包括高岭土和瓷石、模具、抛轮、钴颜料、釉罐、窑架、烧锥或颜色测试、龙窑门、印章、废料堆、稻草包装、贡箱、商人理货和烧制登记册。象征意义是受控变换。地球成为一种有声望的商品，因为国家标准化了每一步。
      global_production_efficiency 的上升是因为批量纪律、质量控制和专业化劳动力扩展到瓷器之外。 trade_income之所以崛起，是因为商人信任经过密封、检验的商品，能够可靠地定价、包装和运输。
    confirmation_logic: >-
      赞助商必须拥有或控制浮梁，最终的景德镇窑奇建筑必须存在，国家不能破产，窑区、粘土路线、燃料路线和河道不能被占领、封锁或严重动乱。窑炉必须有足够的粘土、燃料、水、工匠和市场准入来运行烧制周期。如果实施能够检测到生产效率、贸易收入、工匠或市民满意度、当地繁荣、燃料供应、森林砍伐压力、河流通道、法院需求、腐败、火灾风险、破坏和劳动力短缺，那么这些应该得到确认。只有在削减材料、关闭运输或从窑炉征用熟练工人的情况下，战争才应该被阻止。
    start_logic: >-
      起始效果记录了主办国、祭祀地点浮梁、最终的窑址、有效的御令以及当前的烧制周期。它快照了国家基线：global_production_efficiency、trade_income、财政/收入、贸易效率（如果有）、工匠或市民满意度、法院需求、稳定、腐败、燃料供应和战争状态。它反映了当地的基线：占领、动乱、破坏、繁荣、粘土供应、供水、燃料供应、窑炉状况、车间容量、油漆工可用性、检查员可用性、仓库空间、河流通道、火灾风险和商业需求。它初始化了粘土清洗、坯体混合、模具密封、投掷员名单、干燥棚、素瓷烧制、釉料测试、钴漆、窑装载、烧制手表、检验分类、皇家印章标记、包装和贸易调度的计数器。临时负担包括粘土和燃料采购、工匠工资、检验员工资、颜料进口、窑炉维修、消防值班、储存、包装材料以及延迟销售用于质量审查的物品。
    progress_logic: >-
      每月的进度遵循车间瓷器的寿命。粘土清洗机对材料进行研磨和沉降，这样杂质就不会破坏批次。身体搅拌机结合了粘土和瓷石；投掷者和模具制造者生产模型；干燥棚工头防止工件破裂。窑师安排素瓷烧制；釉料搅拌机在碎片上测试配方；画家应用钴设计并记录哪些工作室制作了它们。装载人员用架子和支架堆放货物；消防车管理木材、通风口、火焰颜色和冷却；检查员会破坏或标记不合格品，选择贡品，并将形状与帝国模型进行比较。抄写员复制印章标记、批号、工人名册和目的地板条箱；预留宫廷份额后，商户安排河运。当浮梁安全、材料到达、工资支付、车间配备人员、河流通道开放时，进展就会取得进展。它因破产、占领、严重动乱、粘土短缺、燃料危机、窑炉倒塌、火灾、检查员腐败、工匠逃亡、颜料短缺、河流关闭、法院命令混乱或商人抵制而暂停。它随着工匠的高满意度、充足的燃料和粘土、当地的繁荣、强劲的贸易需求、干净的账目、熟练的监督人员以及之前的烧制成功而加速。每个月的刻度应该将指定的批次移动到具体的生产阶段，而不是添加抽象的车间进度。
    completion_logic: >-
      完成需要粘土、坯体、模具、抛掷、干燥、素瓷、釉料、绘画、装载、烧制、检查、密封、包装和调度柜台完成。浮梁必须保持控制，最后的窑炉必须存在，国家不能破产，至少一批经过检验的批次必须准备好上法庭和市场。最后一幕发生在成功开窑后的检验大厅。窑炉大师展示冷却的烟囱；检查员对贡品、出口品质、国产品和废品进行分类；油漆工识别车间痕迹；抄写员输入批号和印章；法庭代理人保留选定的商品；商人在河岸码头收到包装好的板条箱。这一奇迹之所以成为国家能力，是因为景德镇将质量控制、专业化劳动力和可靠的贸易包装成为生产纪律的典范。
    failure_or_timeout_logic: >-
      仪式可以在烧制之间暂停，但如果材料放置时间太长，粘土体干燥不正确，釉料测试变得无关紧要，或者工人离开，进展就会减弱。如果赞助商失去浮梁，最后的窑炉建筑消失，国家破产，窑区被占领或烧毁，或者材料和河流通道被永久切断，则失败或取消。严重的骚乱、窑炉火灾、燃料危机、粘土源损失、检查员腐败、工匠罢工、颜料短缺、仓库倒塌、河流封锁或法院取消应该暂停进度，并可能重置批次、检查或调度计数器。失败的烧制不应自动导致整个仪式失败，但应在完成前强制更换批次。
    implementation_mapping:
      confirmation_trigger_script: >-
        检查赞助商对浮梁的控制、最终独特的窑炉建筑存在、无破产、无重复的活动仪式、无占领或严重动乱、可用的粘土/燃料/水供应、正常运转的车间、河流或贸易通道、可用的工匠和检查员、以及无活跃的火灾或窑炉崩溃危机。添加生产效率、贸易收入、工匠满意度、繁荣、朝廷需求、腐败、破坏和战争干扰等主题检查。
      start_effect_script: >-
        将仪式绑定到赞助商和浮梁，存储有效的圣旨和烧制记录上下文，应用临时生产和检验负担，初始化洗泥、坯体混合、模具密封、投掷员名册、干燥棚、素瓷烧制、釉料测试、钴画、入窑、烧制表、检验分类、皇家印章计数器
      snapshot_effect_script: >-
        刷新生产效率、贸易收入、金库、贸易效率、工匠/市民满意度、宫廷需求、稳定、腐败、燃料供应、战争状态、浮梁占领、动乱、破坏、繁荣、粘土供应、供水、窑炉状况、车间容量、油漆工和检验员可用性、仓库空间、河流通道、火灾风险、商人需求和最终建筑
      progress_effect_script: >-
        每月进行粘土准备、混坯、成型、干燥、素瓷烧制、釉料测试、涂漆、装窑、烧制手表、冷却、质量检验、密封标记、包装和发货。由于破产、占领、动乱、材料短缺、燃料危机、窑炉倒塌、火灾、腐败、工人逃亡、颜料短缺、河流关闭、法庭命令混乱或商人抵制而暂停或衰退。加速技术熟练的工匠、良好的供应、繁荣、需求、干净的账户和事先的烧制成功。
      completion_trigger_script: >-
        要求完成烧制登记计数器或总进度，浮梁控制，最终窑存在，没有破产，没有占领，稳定的车间，完成的检查批次，密封的贡品，包装的贸易箱，可用的河流/贸易路线，以及接受的烧制登记。
      completion_effect_script: >-
        消除临时窑炉负担，应用永久国家修正，保持生产效率和贸易收入，授予一次性国库/贸易、工匠满意度、声望商品、当地繁荣或生产进度奖励，添加景德镇窑址记忆，清除瞬态计数器，并保留完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留global_production_efficiency和trade_income。 Production efficiency comes from standardized batch
        work, inspection, seals, and specialized labor; trade income comes from reliable porcelain quality,
        packing, merchant trust, and court-endorsed prestige goods.
      one_time_reward: 从成功的解雇登记中授予一次性贸易收入、国库、工匠满意度、当地繁荣、声望商品或生产进度。规模奖励以清洁检验和可出口批次而不是生窑量来衡量。
      local_building_reward: >-
        浮梁应记住洗土坑、模具印章、画痕、试釉碎片、窑烧日志、废品堆、检验印章、贡箱、商人理货和河流调度记录。稍后的实施可以将其表达为当地作坊产量、贸易价值、工匠吸引力或火灾风险控制。
    notes: >-
      来源仪式是直接的，但定时模式更好地代表重复的瓷器烧制周期和检查。每月就够了；除非后来的设计增加了军事采购瓷器，否则战争听众只会作为干扰而产生影响，这将错过来源奖励。保持生产和贸易的永久主题，将高级商品作为次要奖励。
- id: 161
  key: unique_mogao_caves
  base_key: great_sculpture_group
  location: shazhou
  source_ritual_key: thousand_buddha_dedication
  status: designed
  ritual_design_zh:
    title: 千佛洞奉献
    mode: timed
    duration: >-
      定时模式应运行一年的赞助和商队。每月十二个刻度代表稳定洞穴入口、准备颜料、委托壁画、修复雕像、复制手稿、记录捐赠者、庇护朝圣者以及与丝绸之路商队协调。永久的奖励停留在文化传统和每月的声望上：莫高窟的力量是图像、文本、赞助人和沙漠记忆的积累。
    listeners:
    - monthly
    historical_flavor: >-
      千佛洞奉献属于莫高窟，因为敦煌附近的石窟是丝绸之路奉献和赞助的悬崖档案：彩绘佛像、巨大的雕像、捐赠者肖像、手稿、翻译、商队祈祷和几个世纪以来建造的沙漠庇护所。参与者包括僧侣、壁画画家、雕塑家、泥水匠、颜料研磨师、抄写员、翻译员、商队商人、朝圣者向导、当地统治者的代理人、捐赠者、守卫、挑水者以及负责整理灯、香和洞门的神社侍者。这些地方包括沙洲的悬崖面、个别洞穴教堂、巨大的图像大厅、抄经室、商店洞穴、朝圣者庇护所、绿洲井、商队集结地、岗哨和施主大厅。这些物品包括矿物颜料、石膏、画笔、支架、泥像、经卷、翻译笔记、施主铭文、丝巾、灯油、香、商队帐、水罐和密封的手稿包。
      cultural_tradition_modifier 之所以兴起，是因为该网站教​​导艺术家、抄写员和赞助人如何跨代保存风格、故事和文本。 monthly_prestige之所以兴起，是因为商人和朝圣者携带有关洞穴图像和穿越沙漠路线的安全庇护的报道。
    confirmation_logic: >-
      赞助商必须拥有或控制沙州，莫高窟最后的奇迹建筑必须存在，国家不能破产，洞穴区、绿洲通道和商队庇护所不能被占领、抢劫或遭受严重骚乱。颜料、石膏、灯油、水、艺术家、僧侣和商队交通应该存在。如果实施能够检测到文化传统、声望、当地繁荣、学者或艺术家能力、贸易路线安全、宗教宽容/团结、破坏、土匪行为、供水和捐助者信心，那么这些应该会形成确认。只有在关闭沙漠道路、危及洞穴或剥夺该地点的守卫和补给的情况下，战争才应封锁。
    start_logic: >-
      开始效果记录了主办国、作为仪式地点的沙州、最终的洞穴建筑、当地的信仰/文化背景、商队路线状态以及活跃的千佛奉献周期。它快照了国家基线：cultural_tradition_modifier、monthly_prestige、声望水平、文化传统、财政/收入、学者/艺术家能力、宗教宽容或和谐（如果有）、贸易路线活动、稳定性和战争状态。它记录了当地的基线：占领、动乱、破坏、繁荣、洞穴条件、悬崖稳定性、供水、颜料供应、石膏供应、僧侣合作、复制者可用性、商队安全、朝圣者通道、警卫力量和捐助者信心。它初始化悬崖检查、洞门修复、壁画设计、颜料准备、雕像修复、脚手架安全、手稿复制、翻译/目录、捐赠者铭文、朝圣者庇护所、商队保护、灯服务和最后奉献等柜台。临时负担包括颜料、石膏、灯油、画笔、脚手架、复印纸、警卫工资、挑水工、僧侣俸禄以及对捐助者和朝圣者的招待。
    progress_logic: >-
      每月的进展是将沙漠悬崖变成一个有组织的记忆系统。泥瓦匠和泥水匠在开始粉刷之前检查洞口并加固受损的墙壁。颜料研磨机制备矿物颜料；画家们铺设网格，勾画出佛、菩萨、施主、乐师、马队场景。雕塑家修复现有雕像上的粘土身体、光环和手部。抄写员抄写经文、合同和奉献笔记；翻译者比较不同朝圣者带来的术语；僧侣决定哪些文本用于背诵以及哪些文本被存储。捐赠者的职员记录下姓名、礼物和承诺的灯，这样赞助就变成了记忆而不是谣言。守卫在绿洲道路上巡逻，运水车供应避难所，商队首领报告土匪风险。当沙州被控制，洞穴安全，物资到达，艺术家和僧侣合作，商队可以到达绿洲时，进展就会推进。它因破产、占领、严重骚乱、土匪袭击、缺水、颜料流失、洞穴倒塌、圣像损坏、捐赠者违约、手稿被盗、僧侣纠纷或贸易路线关闭而暂停。
      It accelerates with high caravan traffic, strong patronage, skilled artists, local prosperity, safe
      roads, good water supply, and existing scholarship.每个月的勾号应该代表一个具体的行为：稳定洞穴、混合颜料、粉刷墙壁、修复雕像、复制手稿、登记捐赠者或护送朝圣者。
    completion_logic: >-
      完成需要完成悬崖、门、壁画、颜料、雕像、脚手架、手稿、翻译、捐赠者、庇护所、商队、灯和最终奉献计数器。沙州必须保持控制，最后的洞穴建筑必须存在，国家不能破产，绿洲之路必须足够安全以供奉献。最后的场景发生在一个新修复的或专用的洞穴中。僧人在灯前诵经；捐助者坚持他们的铭文；画家揭开完成的图像；雕塑家展示修复后的雕像；抄写员将密封的手稿放在受保护的房间里；大篷车代表提供安全通行记录；人群离开后，警卫关闭了路线。
      The wonder becomes national capacity because Mogao turns scattered patronage into a durable repertoire
      of images, texts, and stories that travel with merchants and scholars, increasing cultural tradition
      and prestige every month.
    failure_or_timeout_logic: >-
      The ritual can pause without strict timeout, but progress should decay if desert seasons pass because
      pigments dry badly, scaffolds weaken, donors disperse, and caravan reports go stale.如果赞助商失去沙州、最终的洞穴建筑消失、国家破产、洞穴被占领或洗劫、或者绿洲水源无法使用，则该活动失败或取消。
      Severe unrest, bandit control, cave collapse, manuscript theft, fire or smoke damage, icon destruction,
      donor fraud, monk factionalism, closed caravan routes, or war devastation should pause progress
      and may reset mural, manuscript, shelter, or caravan counters.
    implementation_mapping:
      confirmation_trigger_script: >-
        Check sponsor control of Shazhou, final unique cave building presence, no bankruptcy, no duplicate
        active ritual, no occupation, sack, or severe unrest, usable cave precinct, water supply,艺术家/僧侣的可用性，以及足够安全的商队/朝圣者通道。
        Add thematic checks for cultural tradition, prestige, prosperity, scholar/artist capacity, route
        safety, religious tolerance, devastation, banditry, and donor confidence.
      start_effect_script: >-
        将仪式与赞助商和沙洲绑定，存储信仰/文化和商队背景，申请临时赞助和洞穴维护负担，初始化悬崖检查、洞门修复、壁画设计、颜料准备、雕像修复、脚手架安全、手稿复制、翻译/目录、捐助者铭文、朝圣者庇护所、商队保护、灯服务和最终奉献的计数器，并记录国家/地方基线。
      snapshot_effect_script: >-
        刷新文化传统、每月声望、声望等级、金库、学者/艺术家能力、宗教宽容、路线活动、稳定性、战争状态、沙州占领、动乱、破坏、繁荣、洞穴状况、悬崖稳定性、水、颜料和石膏供应、僧侣合作、抄写员可用性、商队安全、朝圣者通道、警卫力量、捐赠者信心和最终建筑存在。
      progress_effect_script: >-
        每月蜱虫，提前洞穴稳定，门修复，壁画草图，颜料研磨，雕像修复，脚手架检查，手稿复印、翻译/编目、捐赠者铭文、朝圣者庇护所、商队护送、灯服务和最后奉献准备。由于破产、占领、动乱、土匪、缺水、颜料流失、洞穴倒塌、圣像损坏、捐赠者违约、手稿被盗、修道院纠纷或封闭路线而暂停或衰退。加速赞助、艺术家、安全道路、商队、水和奖学金。
      completion_trigger_script: >-
        要求完成奉献柜台或总体进度，沙洲控制，最终洞穴存在，没有破产，没有占领或解雇，安全绿洲道路，稳定洞穴，完成的壁画/雕像工作，复制和保护手稿，注册捐赠者，准备灯服务和商队保护到位。
      completion_effect_script: >-
        消除临时赞助负担，应用永久国家修改器保留文化传统和每月声望，授予一次性文化传统、声望、学者/工匠支持、当地繁荣或商队交通奖励，添加莫高窟遗址记忆，清除瞬态计数器，并保留完成/冷却标志。
    intended_rewards:
      permanent_country_modifier: >-
        保留cultural_tradition_modifier和monthly_prestige。文化传统来自壁画、雕塑、手稿、翻译、捐助者铭文和工作坊传播。声望来自洞穴在穿越沙漠的朝圣者、商人、使节和学者中的声誉。
      one_time_reward: 授予一次性文化传统、声望、学者或艺术家进步、当地繁荣、商队安全或朝圣收入。仅在需要时才将皈依或宗教教导作为可能的风味奖励；
      local_building_reward: >-
        沙洲应该记住稳定的洞门、壁画草图、颜料库、修复的雕像、脚手架笔记、复制的手稿、翻译目录、捐赠者铭文、灯名册、商队护送统计和朝圣者庇护所记录。稍后的实施可以将其表达为当地文化、路线安全、学者吸引力或朝圣繁荣。
    notes: >-
      源仪式是直接的，但定时模式更好地代表洞穴赞助和商队季节。 Monthly 是正确的听众，因为该作品具有艺术性、文本性和逻辑性。压缩稿提到了转换速度，但源修改器没有；保持对文化和声望的永久奖励。
- id: 162
  key: unique_canton_thirteen_factories
  base_key: guild_alliance
  location: guangzhou
  source_ritual_key: hong_merchant_charter
  status: designed
  ritual_design_zh:
    title: 香港商户章程和工厂钥匙
    mode: timed
    duration: >-
      定时模式应涵盖一个受监管的交易季节。 Twelve monthly ticks represent licensing hong merchants, assigning factory keys,
      registering interpreters, auditing warehouses, publishing tariff routines, managing foreign residence
      boundaries, inspecting fire watches, settling debts, and closing the season's manifests on the Pearl
      River. Trade income and diplomatic reputation rise only when the port can turn foreign demand into
      controlled, documented exchange.
    listeners:
    - monthly
    historical_flavor: >-
      The Hong Merchant Charter belongs to the Canton Thirteen Factories because the waterfront system
      at Guangzhou made overseas trade possible through licensed intermediaries rather than open, unmanaged
      contact. The participants are hong merchants, guild elders, customs officials, Hoppo-style revenue
      clerks where appropriate, foreign supercargoes, interpreters, warehouse keepers, compradores, river
      pilots, customs weighers, guards, fire-watch crews, scribes, debt guarantors, and magistrates who
      hear complaints without letting every quarrel become an international crisis. The places are the
      foreign factory compounds, hong offices, bonded warehouses, flag-marked courtyards, customs stations,
      Pearl River wharves, weighing houses, interpreter rooms, fire lanes, and the gates that separate
      resident foreigners from the wider city. The objects are factory keys, merchant licenses, chop seals,
      tariff tables, tea and silk manifests, silver accounts, cargo samples, weighing stones, interpreter
      registers, complaint books, debt bonds, fire buckets, and river pilot tallies. trade_income 上升是因为交易变得可预测且应纳税。
      diplomatic_reputation rises because foreign merchants and courts encounter a port that can enforce
      rules, settle disputes, and keep records without chaos.
    confirmation_logic: >-
      The sponsor must own or control Guangzhou, the final Thirteen Factories wonder building must exist,
      the country must not be bankrupt, and the factory district, Pearl River wharves, and customs houses
      must not be occupied, blockaded, burning, or in severe unrest.对外贸易必须是合法或实际上允许的；如果国家关闭了港口，驱逐了商人，或者无法保护仓库，则仪式不应该开始。
      If the implementation can detect trade income, diplomatic reputation, merchant/burgher satisfaction,
      port access, blockade, naval security, tariff efficiency, corruption, local prosperity, foreign
      relations, smuggling, fire risk, and unrest, those should shape confirmation.只有当海上通道或珠江通道不安全到足以阻止贸易季节时，战争才应该被阻止。
    start_logic: >-
      启动效果记录了主办国、仪式地点广州、最终的厂房、活跃的贸易季节背景、外贸伙伴（如果有）以及洪包机周期。它快照了国家基线：trade_income、diplomatic_reputation、财政/收入、贸易效率、商人满意度、海军/港口安全、腐败、稳定、外交关系、走私压力和战争状态。它反映了当地的基线：占领、封锁、动乱、破坏、繁荣、港口通道、工厂状况、仓库容量、海关职能、口译员可用性、行商偿付能力、火灾风险、河流引航能力和人群控制。它初始化了香港许可、工厂关键任务、仓库审核、翻译登记、关税表公布、货物检查、债务债券审查、外国人居住边界、投诉听证会、消防值班检查、河流引航员名册、舱单结账和最终租船印章等柜台。临时负担包括海关职员、警卫、翻译、消防值班、仓库维修、飞行员费用、正式礼物、法律听证会以及在检查账目时延迟货物放行。
    progress_logic: >-
      每月的进展是规范的商业成为外交语言。港商提供偿付能力担保并获得许可证；官员标记哪些钥匙可以打开哪些仓库；海关秤测试秤并记录茶叶、丝绸、瓷器、香料、银器和其他货物。口译员登记合同、债务、投诉和惩罚的姓名和批准的短语。外国押运员提交舱单；买办安排当地供应；河流引航员安排船舶移动以避免拥堵。治安法官审理有关损坏货物、逾期付款、走私指控和居住边界的纠纷。消防值班人员检查灯具、厨房、巷道和水桶，因为一场工厂火灾就可能演变成一场贸易和外交灾难。当广州安全、港口开放、商人保持偿付能力、缴纳关税、提供口译员以及不因封锁而导致季节中断时，就会取得进展。它因破产、占领、封锁、严重骚乱、工厂火灾、走私丑闻、商人破产、翻译短缺、外国争吵、仓库扣押、海关腐败或海军扰乱而暂停。商户满意度高、地方繁荣、通关能力强、账目干净、河运安全、对外关系良好、贸易需求活跃。每个月的刻度应该代表一次真正的港口行动：颁发许可证、检查舱单、阅读关税表、解决投诉、检查消防通道或密封债务债券。
    completion_logic: >-
      完成需要完成许可、钥匙、仓库、翻译、关税、货物、债务、边界、投诉、消防值班、飞行员、舱单和最终包机柜台。 Guangzhou must remain controlled, the final
      factory building must exist, the country must not be bankrupt, and the port must not be blockaded.
      The final scene occurs in the hong office and on the waterfront.持牌香港商户收到标记密钥；海关职员阅读关税表；口译员向批准的登记册宣誓；
      foreign supercargoes acknowledge residence rules;仓库管理员密封货舱；消防人员展示值班路线；飞行员提供当季船舶清单；地方法官关闭投诉簿。这一奇迹变成了国家能力，因为工厂将海外联系转变为征税贸易和可信程序，使国家即使在严格控制准入的情况下也显得可靠。
    failure_or_timeout_logic: >-
      这种仪式可以在交易季节之间暂停，但如果清单和债务债券变得陈旧，或者如果外国商人在关闭前离开，那么进展就会减弱。如果赞助商失去广州，最后的厂房消失，国家破产，厂区被占领或烧毁，对外贸易正式关闭，或者港口被封锁，比赛就会失败或取消。严重骚乱、走私危机、洪氏破产、工厂火灾、海关腐败、翻译丑闻、外国人质事件、河流封闭或困住船只的海战应暂停进度，并可能重置许可证、舱单或外交计数器。
