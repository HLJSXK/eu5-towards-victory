metadata:
  purpose: "Capability registry for Unique Wonder Ritual Harness semantic validation."
  generated_game_code: false
  safety_boundary: "Capabilities describe the current Harness projection semantics only; they may not write src, certify loadable EU5 syntax, or cap design_ir complexity."
  status: "v1_semantic_contracts"
  design_fidelity_policy: "Specs may record richer design_ir primitives with compiler_gap_ledger rows even when no capability exists yet."

capabilities:
  - key: event_chain
    supported_node_kinds:
      - event
      - choice_event
      - incident_event
    required_node_fields:
      - node.event_id
      - node.next_nodes
      - node.loc_refs
    required_variable_roles: []
    supported_listener_kinds: []
    supported_ui_components:
      - checklist
      - incident_log
      - route_map
      - progress_track
    output_kinds:
      - markdown_fragment
      - event_skeleton
      - loc_draft
      - player_facing_tooltip
    verified_interface: "harness_v1_semantic_fragment"
    may_write_src: false
    notes: "Visible event-chain semantics for Harness Markdown fragments only."

  - key: retry_branch
    supported_node_kinds:
      - retry_event
      - choice_event
      - incident_event
    required_node_fields:
      - node.failure_or_retry
      - node.retry_target
    required_variable_roles:
      - stage_state
    supported_listener_kinds: []
    supported_ui_components:
      - checklist
      - incident_log
      - route_map
    output_kinds:
      - markdown_fragment
      - event_skeleton
      - player_facing_tooltip
    verified_interface: "harness_v1_semantic_fragment"
    may_write_src: false
    notes: "Documents failure/retry branches and their state handoff without emitting event code."

  - key: monthly_progress
    supported_node_kinds:
      - monthly_progress_gate
    required_node_fields:
      - node.reads
      - node.writes
    required_variable_roles:
      - progress_counter
    supported_listener_kinds:
      - monthly
    supported_ui_components:
      - progress_track
    output_kinds:
      - markdown_fragment
      - trigger_stub
      - effect_stub
      - gui_summary
      - player_facing_tooltip
    verified_interface: "harness_v1_semantic_fragment"
    may_write_src: false
    notes: "Documents progress/counter state expected to be advanced by a monthly listener."

  - key: actor_assignment
    supported_node_kinds:
      - assignment_gate
      - choice_event
    required_node_fields:
      - node.reads
      - node.writes
      - node.scope_contract
    required_variable_roles:
      - assigned_actor
    supported_listener_kinds: []
    supported_ui_components:
      - actor_slots
      - checklist
    output_kinds:
      - markdown_fragment
      - gui_summary
      - player_facing_tooltip
    verified_interface: "harness_v1_semantic_fragment"
    may_write_src: false
    notes: "Documents actor/role selection semantics before real character-scope scripting exists."

