metadata:
  purpose: AI prompts for implementing unique wonder rituals from the design-only ritual source.
  source_data: data/unique_wonder_ritual_designs.yaml
  generated_game_code: false
  design_policy: |
    This file stores user-authored AI prompts only. It is not consumed by game-code generators until a later implementation pass defines an explicit schema.
unique_wonders:
- id: 101
  key: unique_pharos_lighthouse
  base_key: great_lighthouse
  location: alexandria
  ritual_title: Harbor Lighting and Pilotage Oath
  prompt: |-
    后端：
    1.将地中海的8个标志性地点作为判定地点，硬编码
    2.仪式可以随时开始，点击开始时，付费并在当地开始建造独特附属建筑，该建筑建造完毕后，弹出事件1告知玩家进入阶段1
    3.阶段1：每3个月检查一次，伊斯坎达利亚海域是否存在敌对海盗，如果存在，弹出事件组2，要求玩家付出少量代价（从多个硬编码中随机一个，参考本mod其他随机事件），消灭当地的海盗，这将导致当地的所有海盗损失40%的力量，玩家也可以选择不付出代价，不发生任何事；如果当地不再有敌对海盗，弹出事件3，奖励一次性奖励，并告知玩家进入阶段2
    4.阶段2：每3个月，抽取一个标志性地点进行判定：如果该地点已经由玩家拥有，则弹出事件4，告知玩家该地点通过判定；否则，判定该国是否与玩家有双向“驻港权”关系，如果已经有，则弹出事件5，告知玩家该地点通过判定；否则，弹出事件6，要求玩家付出少量代价，并与目标国家建立双向“驻港权”关系。当所有标志性地点都完成判定时，弹出事件7，奖励永久国家buff奖励，并告知玩家仪式成功，触发奇观落成事件
    前端：
    仪式面板由3个部分组成，初始只显示一个建造按钮，进入阶段1后，改为显示一个无标题Card，左侧放置一个较大的Piechart，用于展示当地海盗的平均力量，Piechart中心放置海盗Icon，右侧放置一行风味文本：消灭伊斯坎达利亚的海盗以推进仪式；进入阶段2后，改为显示另一个无标题Card，左侧放置一个较大的Piechart，用于展示当前的控制进度，即x/8，Piechart中心放置与海上航线相关的Icon；在该无标题Card下方，放置8行矮无标题Card，每行开始于location icon，随后是标准location link，中间是expander，右侧是标准country 国旗+country link，最后是status：分为“控制”、“驻港”、“未控”。status是控制、驻港时，Card使用不饱和绿色作为底色，否则使用不饱和红色。
- id: 102
  key: unique_hagia_sophia
  base_key: sky_dome_grand_temple
  location: constantinople
  ritual_title: Justinianic Synaxis of the Great Church
  prompt: |-
    后端：
    使用一个角色选择槽+事件链驱动本仪式
    1.审核银质祭坛、圣杯、帷幕和拟物门下的圣物箱。玩家需要指派一位角色行事，这名角色将获得10点行政和永久buff：不适合加入内阁、不适合指挥陆军、不适合指挥海军。三个月后，弹出事件1，玩家需要付出一些金钱；否则该事件会在三个月后再次触发
    2.检查圆顶肋骨、灯链、大理石路面和被煤烟熏黑的马赛克。玩家需要指派一位角色行事，这名角色将获得10点行政和永久buff：不适合加入内阁、不适合指挥陆军、不适合指挥海军。三个月后，弹出事件2，玩家需要付出一些威望；否则该事件会在三个月后再次触发
    3.将神职人员津贴和救济粮食登记在教堂登记册中。玩家需要指派一位角色行事，这名角色将获得10点外交和永久buff：不适合加入内阁、不适合指挥陆军、不适合指挥海军。三个月后，弹出事件3，玩家需要授予教士一种独特特权；否则该事件会在三个月后再次触发
    4.与守卫和城市官员一起演练统治者从宫殿到前厅的路线。玩家需要指派统治者到角色槽上，这将导致国家获得每月-0.2正统性。三个月后，弹出事件4，玩家将被奖励一项永久buff
    5.到各支会宣布节日义务和圣所规则。玩家需要指派一位角色行事，这名角色将获得10点外交和永久buff：不适合加入内阁、不适合指挥陆军、不适合指挥海军。三个月后，弹出事件5，在当地建设一座独特建筑
    6.由公证人对捐赠与国库进行核对。玩家需要指派一位角色行事，这名角色将获得10点行政和永久buff：不适合加入内阁、不适合指挥陆军、不适合指挥海军。三个月后，弹出事件6，这将会有数个随机分支，玩家需要付出对应分支的少量代价；否则该事件会在三个月后再次触发
    7.让使节和当地精英坐在画廊里，见证首都的等级制度。玩家需要指派一位贵族行事，这名角色将获得10点军事和永久buff：不适合加入内阁、不适合指挥陆军、不适合指挥海军。三个月后，弹出事件7，这将会要求玩家付出少量金钱，但是会在当地创作一件高品质艺术品；否则该事件会在三个月后再次触发
    8.公开游行。玩家需要指派一位角色行事，这名角色将获得10点军事和永久buff：不适合加入内阁、不适合指挥陆军、不适合指挥海军。这会在当地产生+10%的每月繁荣度。当地繁荣度达到100%后，弹出事件8，这会授予玩家一次性奖励，并告知仪式完成，最后触发奇观落成事件
    前端：
    1.使用8个无标题Card承载内容，每个都使用相同设计：左侧是一个方形人物肖像栏，点击时触发角色选择，角色就位，才开始3个月倒计时。右侧是一行风味文本，有3种显示状态：告知玩家需要指派一位角色、告知玩家正在进行xxx、告知玩家该项目已完成。
    2.每个Card只有在对应项目正在执行或已完成时才可见，即一开始只能看到1个Card，随着进度推进逐渐最终看到8个Card
    3.每个Card在完成后显示为不饱和绿色，在激活时显示为标准颜色，隐藏时无所谓，统一为标准颜色
