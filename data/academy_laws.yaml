# Academy of Sciences law categories for tv_academy_laws.txt.
# Structure: 7 laws across the Scientific Factions and Leadership IO law
# categories. Most policies use country_modifier entries so Academy laws
# provide immediate member-country effects.
#
# Academy law changes are routed through the IO parliament tab. The Academy has
# exactly one member for now, but proposals should still use vanilla law voting
# instead of instant law changes.
#
# DO NOT hand-edit generated output files. Run:
#   conda run --no-capture-output -n eu5 python scripts/in_game/common/laws/gen_tv_academy_laws.py

law_category: tv_science_factions
io_type: tv_academy_of_sciences

laws:
  - id: tv_academy_research_priority_law
    display_comment: "LAW 1: Research Priority"
    policies:
      - id: tv_academy_research_priority_balanced_policy
        display_comment: "Balanced (default)"
        default: true
        required_support: commons
      - id: tv_academy_research_priority_theory_policy
        display_comment: "Theory First"
        required_support: clergy
        country_modifier: |
          research_speed_modifier = 0.05
          global_build_buildings_cost = 0.10
      - id: tv_academy_research_priority_application_policy
        display_comment: "Application First"
        required_support: burghers
        country_modifier: |
          research_speed_modifier = -0.05
          global_build_buildings_cost = -0.10
      - id: tv_academy_research_priority_medicine_policy
        display_comment: "Medicine First"
        required_support: clergy
        country_modifier: |
          research_speed_modifier = -0.05
          global_build_buildings_cost = 0.10
          global_disease_resistance = 0.05

  - id: tv_academy_research_openness_law
    display_comment: "LAW 2: Research Openness"
    policies:
      - id: tv_academy_research_openness_closed_policy
        display_comment: "State Seclusion (default)"
        default: true
        required_support: crown
        country_modifier: |
          stability_cost = -0.05
      - id: tv_academy_research_openness_school_control_policy
        display_comment: "School Supervision"
        required_support: clergy
        country_modifier: |
          research_speed_modifier = -0.05
          global_estate_target_satisfaction = 0.025
      - id: tv_academy_research_openness_school_free_policy
        display_comment: "School Freedom"
        required_support: commons
        country_modifier: |
          research_speed_modifier = 0.05
          pop_join_rebel_threshold = 0.05
      - id: tv_academy_research_openness_international_policy
        display_comment: "International Openness"
        required_support: burghers
        country_modifier: |
          research_speed_modifier = 0.05
          diplomatic_reputation = 1
          antagonism_received_modifier = 0.20

  - id: tv_academy_research_risk_law
    display_comment: "LAW 3: Research Risk Management"
    policies:
      - id: tv_academy_research_risk_mandatory_review_policy
        display_comment: "Mandatory Review (default)"
        default: true
        required_support: clergy
        country_modifier: |
          clergy_estate_target_satisfaction = 0.025
      - id: tv_academy_research_risk_conservative_policy
        display_comment: "Conservative Security"
        required_support: crown
        country_modifier: |
          research_speed_modifier = 0.05
      - id: tv_academy_research_risk_high_breakthrough_policy
        display_comment: "High-Risk Breakthroughs"
        required_support: commons
        country_modifier: |
          research_speed_modifier = 0.10
          clergy_estate_target_satisfaction = -0.025

  - id: tv_academy_research_funding_law
    display_comment: "LAW 4: Research Resource Allocation"
    policies:
      - id: tv_academy_research_funding_private_policy
        display_comment: "Private Patronage (default)"
        default: true
        required_support: nobles
        country_modifier: |
          nobles_estate_target_satisfaction = 0.025
          global_nobles_estate_power = 0.25
      - id: tv_academy_research_funding_guild_policy
        display_comment: "Guild Patronage"
        required_support: burghers
        country_modifier: |
          research_speed_modifier = 0.05
          global_production_efficiency = -0.05
          global_burghers_estate_power = 0.25
      - id: tv_academy_research_funding_royal_policy
        display_comment: "Royal Priority"
        required_support: crown
        country_modifier: |
          research_speed_modifier = 0.05
          court_spending_cost_modifier = 0.20
      - id: tv_academy_research_funding_international_policy
        display_comment: "International Cooperation"
        required_support: burghers
        country_modifier: |
          research_speed_modifier = 0.05
          diplomatic_reputation = 1
          antagonism_received_modifier = 0.20

  - id: tv_academy_technology_spread_law
    display_comment: "LAW 5: Technology Diffusion Regulations"
    policies:
      - id: tv_academy_technology_spread_laissez_faire_policy
        display_comment: "Laissez-Faire Diffusion (default)"
        default: true
        required_support: commons
        country_modifier: |
          global_institution_growth_modifier = 0.20
      - id: tv_academy_technology_spread_private_policy
        display_comment: "Privatized Research"
        required_support: nobles
        country_modifier: |
          global_production_efficiency = 0.05
          global_burghers_estate_power = 0.25
      - id: tv_academy_technology_spread_state_standard_policy
        display_comment: "State Standardization"
        required_support: crown
        country_modifier: |
          research_speed_modifier = 0.05
          court_spending_cost_modifier = 0.20

  - id: tv_academy_academic_prestige_law
    display_comment: "LAW 6: Academic Prestige"
    policies:
      - id: tv_academy_academic_prestige_none_policy
        display_comment: "No Rewards (default)"
        default: true
        required_support: crown
      - id: tv_academy_academic_prestige_titles_policy
        display_comment: "Titles and Nobility"
        required_support: nobles
        country_modifier: |
          research_speed_modifier = 0.05
          nobles_estate_target_satisfaction = -0.025
      - id: tv_academy_academic_prestige_money_policy
        display_comment: "Monetary Rewards"
        required_support: crown
        country_modifier: |
          research_speed_modifier = 0.05
          court_spending_cost_modifier = 0.20
      - id: tv_academy_academic_prestige_reputation_policy
        display_comment: "Prestige Rewards"
        required_support: commons
        country_modifier: |
          research_speed_modifier = 0.05
          diplomatic_reputation = -1
          monthly_prestige = -0.05

  - id: tv_academy_leader_gender_law
    law_category: tv_academy_leadership
    display_comment: "LAW 7: Leader Gender Restriction"
    policies:
      - id: tv_academy_leader_gender_male_only_policy
        display_comment: "Male Only (default)"
        default: true
        required_support: clergy
      - id: tv_academy_leader_gender_unrestricted_policy
        display_comment: "Unrestricted"
        required_support: commons
