# Foundational task-pool catalog for AI-assisted design across Towards Victory.
#
# This is base-layer data, not owned by or tied to any single mechanic — the same
# independence convention as data/cost_reward_units.yaml (see
# docs/design/Cost_Reward_Unit_Concepts.md, section 6). Nothing in the mod reads from
# this catalog yet; it exists so a future "assignable task" mechanic (or several) can pick
# a pre-vetted, engine-verified task definition instead of inventing one from scratch.
#
# A "task" here means: something assignable to the player that resolves to a clear
# complete/incomplete state. Two families, cutting by how completion is detected:
#
# - `on_action_task` — an "action" characteristic. Completion is detected by hooking a
#   specific EU5 on_action (an engine callback that fires the moment a qualifying action
#   happens in-game — winning a war, marrying into a foreign dynasty, founding an
#   International Organization, etc.), not by polling game state. Each entry names a real
#   vanilla on_action (verified against reference_game_files/game/in_game/common/on_action/
#   and reference_official_defines/), the scope variables that on_action provides
#   (root/scope:x, copied from the vanilla source comment), and a `wired` flag:
#     - `wired: true`  — this on_action already has a Towards Victory bridge entry in
#       data/pulse_registry.yaml / src/in_game/common/on_action/tv_pulse_bridges.txt. A
#       consuming mechanic can add its own TV-named on_action under the existing bridge
#       block without touching the registry file itself.
#     - `wired: false` — this on_action is a real, verified vanilla hook, but nothing in
#       the mod currently bridges it. A consuming mechanic must add a new entry to
#       data/pulse_registry.yaml's `bridges` map and re-run
#       scripts/in_game/common/on_action/gen_tv_pulse_registry.py before it can fire.
#   `completion_note` records any extra condition needed to tell "the on_action fired at
#   all" apart from "the task's specific player-facing condition is satisfied" (e.g. only
#   root's own action counts, not the counterparty's).
#
# - `trigger_task` — a "reach state X" characteristic. Completion is detected by polling a
#   real EU5 trigger (verified against reference_official_defines/docs/triggers.log) from a
#   monthly check, the same monthly_country_pulse dispatcher already used by every other TV
#   system's monthly polling logic (see data/pulse_registry.yaml). Each entry names the
#   trigger, its supported scope, a comparison direction, and a `representative_threshold`.
#   The threshold is illustrative only, exactly like the "1 unit" convention in sections 1-5
#   of the sibling cost/reward catalog: a single plausible instance of "reach this," not a
#   tuned milestone tier. A future mechanic scales it up/down (or ignores it and substitutes
#   its own tier ladder, the same way victory_paths.yaml's milestones use their own 5-tier
#   thresholds rather than a single flat number) — playtesting, not this catalog, decides the
#   final number. `comparison: boolean` entries have no threshold (the trigger itself is a
#   yes/no fact, e.g. `is_great_power`). `comparison: lte` entries are the inverted-polarity
#   case (paralleling `country_reward.inflation` in section 1): completion means the value
#   stays AT OR BELOW the threshold, not above it (e.g. keeping war exhaustion low).
#
# Neither family stores a reward. This catalog only records "what must happen" /
# "what must be reached" and how the engine detects it — pairing a task with a reward
# (e.g. from data/cost_reward_units.yaml) is left to whichever future mechanic consumes it.
#
# Edited by hand today; no generator required — the merged towards_victory_editor_web/ tool's
# cost/reward tab now also exposes this catalog as two additional tabs (on_action_task/trigger_task), editing only
# `wired`/`completion_note` and `comparison`/`representative_threshold` respectively.
#
# Second wave (bolder, wider net): both lists were roughly doubled with entries reaching into
# less commonly touched EU5 scopes — character-scope on_actions/triggers (a specific person, not
# the country), International Organization-scope on_actions, percentage-of-maximum triggers
# (`*_percentage`), and a few on_actions whose "is this a positive task" framing is genuinely
# ambiguous (e.g. a regency ending, a country's power rank changing in either direction). Two
# extra optional fields mark that boldness explicitly rather than silently:
#
# - `requires_target` (on trigger_task only) — this trigger takes an extra parameter beyond the
#   scope itself (a specific culture/religion/reform/country id) that the catalog does not and
#   cannot pin down generically; the consuming mechanic supplies it.
# - `verify_in_game: true` (either family) — the entry's real-engine behavior, scope resolution,
#   or "is this actually a reachable positive task" framing has not been confirmed by loading the
#   game; the on_action/trigger name itself is still verified against source, but the task design
#   built on top of it should be spot-checked in-game before relying on it.

on_action_task:
  # --- Military ---
  - id: win_a_war
    on_action: on_winning_war
    wired: true
    scope: "root = country, scope:winner = country, scope:loser = country, scope:war = war"
    category: military
    completion_note: >-
      Counts only when root = scope:winner (the war's victor), not every participant on the
      winning side's coalition.
    loc:
      en: "Win a war as the victorious party."
      zh: "作为胜利方赢得一场战争。"
  - id: win_a_siege
    on_action: on_siege_won
    wired: true
    scope: "root = country, scope:target = location, scope:character = leading general character"
    category: military
    completion_note: >-
      Fires once per successful siege; a task consumer wanting "N sieges" must accumulate
      across firings itself (this on_action carries no running count).
    loc:
      en: "Win a siege against a fortified location."
      zh: "攻克一座设防地点的围城战。"
  - id: win_a_great_battle
    on_action: on_great_battle_won
    wired: false
    scope: >-
      root = actor (winning unit), scope:actor = winning unit, scope:target = losing unit;
      supports scope:killed_land_units/killed_navy_units/lost_land_units/lost_navy_units/war_score
    category: military
    completion_note: >-
      "Great battle" is the engine's own large-battle classification, distinct from the
      plain on_battle_won hook — no extra size condition needs to be added by the consumer.
    loc:
      en: "Win a great battle (a large-scale engagement, not a minor skirmish)."
      zh: "赢得一场大规模会战（而非小规模冲突）。"
  - id: annex_a_country
    on_action: on_annexed
    wired: false
    scope: "root = country doing the annexing, scope:target = country being annexed"
    category: military
    completion_note: >-
      Fires after any annexation method completes (military/diplomatic/civil-war/colonize) —
      use this generic hook rather than the four method-specific "_annexed" variants unless
      the task cares which method was used.
    loc:
      en: "Annex another country in its entirety, by any method."
      zh: "以任意方式完全吞并另一个国家。"
  - id: take_location_in_peace
    on_action: on_took_location_in_peace_treaty
    wired: true
    scope: "root = winner, scope:location = location, scope:winner = new owner, scope:loser = old owner"
    category: military
    completion_note: "Counts only when root = scope:winner, i.e. the location's new owner."
    loc:
      en: "Gain a location through a peace treaty."
      zh: "通过和约获得一处地点。"

  # --- Diplomatic ---
  - id: conclude_royal_marriage
    on_action: on_royal_marriage
    wired: true
    scope: >-
      root, scope:actor = sender, scope:recipient = receiver, scope:target_1 = actor's married
      character, scope:target_2 = recipient's married character
    category: diplomatic
    completion_note: "Counts for both scope:actor and scope:recipient; no extra filter needed."
    loc:
      en: "Conclude a royal marriage with another ruling dynasty."
      zh: "与另一统治王朝缔结王室联姻。"
  - id: form_personal_union
    on_action: on_union_formation
    wired: false
    scope: >-
      root = new union IO, scope:ruler = ruling character or heir, scope:first_leader
      (optional) = leader country of the first union in the merge, scope:second_leader
      (optional) = leader country of the second union in the merge
    category: diplomatic
    completion_note: >-
      Root here is the union's International Organization scope, not a country — a country-
      scope consumer must resolve the union's member country from scope:ruler.owner or the
      leader-country links before crediting a specific country.
    loc:
      en: "Form a personal union with another crown."
      zh: "与另一王室建立共主邦联。"
  - id: mediate_peace
    on_action: on_enforce_peace_accepted
    wired: false
    scope: "happens before the war ends; scope:actor = mediator, scope:recipient = accepting party, scope:war = war"
    category: diplomatic
    completion_note: "Root is not documented on this hook; resolve the mediator from scope:actor."
    loc:
      en: "Successfully mediate peace between two warring parties."
      zh: "成功斡旋交战双方达成和平。"
  - id: send_diplomatic_gift
    on_action: on_gift_sent
    wired: false
    scope: "root, scope:actor = sender, scope:recipient = receiver, scope:target = amount of gold sent"
    category: diplomatic
    completion_note: >-
      Counts only when root = scope:actor (the sender); a "received a gift" task would
      instead filter on root = scope:recipient.
    loc:
      en: "Send a diplomatic gift to another country."
      zh: "向他国赠送外交礼物。"
  - id: gain_subject
    on_action: on_subject_created
    wired: true
    scope: "root = new subject, scope:overlord = country which created the subject, scope:subject_type = subject type"
    category: diplomatic
    completion_note: "Counts for the overlord's task progress; filter root = scope:overlord's own perspective by reading scope:overlord directly, not root."
    loc:
      en: "Bring another country into your sphere as a subject."
      zh: "使另一国成为你的附庸。"
  - id: become_independent
    on_action: on_becoming_free
    wired: true
    scope: "root = country, scope:overlord = former overlord"
    category: diplomatic
    completion_note: "Root is the newly-freed country; no extra filter needed."
    loc:
      en: "Break free from subject status and become independent."
      zh: "摆脱附庸地位，获得独立。"

  # --- Political / Administrative ---
  - id: enact_government_reform
    on_action: on_reform_change
    wired: true
    scope: "root = country"
    category: political
    completion_note: >-
      This hook fires on any reform change; a task targeting one specific reform must add
      its own trigger check (e.g. has_reform = government_reform:<id>) in the consumer, since
      the on_action itself carries no reform identity in scope.
    loc:
      en: "Enact a new government reform."
      zh: "颁布一项新的政府改革。"
  - id: change_government_type
    on_action: on_government_type_change
    wired: false
    scope: "root = country, scope:from = old government_type, scope:to = new government_type"
    category: political
    completion_note: "A task targeting a specific transition (e.g. monarchy -> republic) filters on scope:from/scope:to directly; both are available on this hook."
    loc:
      en: "Change your country's government type."
      zh: "改变国家的政体类型。"
  - id: relocate_capital
    on_action: on_capital_moved
    wired: true
    scope: "root = country"
    category: political
    completion_note: "No extra filter needed; fires once per capital relocation."
    loc:
      en: "Relocate your capital to a new location."
      zh: "将首都迁移至新的地点。"
  - id: found_international_organization
    on_action: on_international_organization_creation
    wired: false
    scope: "root = international organization, scope:actor = creator (optional), scope:target = target (optional)"
    category: political
    completion_note: >-
      Root is the IO scope, not a country — a country-scope consumer resolves the founder
      from scope:actor when present.
    loc:
      en: "Found a new International Organization."
      zh: "创立一个新的国际组织。"
  - id: become_io_leader
    on_action: on_international_organization_changed_leader
    wired: false
    scope: "root = new_ruler (new leader country), target = organization, scope:old_ruler = previous leader"
    category: political
    completion_note: "Counts for root (the incoming leader country) taking over leadership of the named organization."
    loc:
      en: "Become the leader country of an International Organization."
      zh: "成为某国际组织的领导国。"
  - id: achieve_great_power_status
    on_action: on_gain_great_power_status
    wired: false
    scope: "root = country"
    category: political
    completion_note: "No extra filter needed; fires once when Great Power status is newly gained."
    loc:
      en: "Achieve recognized Great Power status."
      zh: "获得公认的列强地位。"

  # --- Religious / Cultural ---
  - id: canonize_a_saint
    on_action: on_made_saint
    wired: false
    scope: "root = country, scope:recipient = character"
    category: religious_cultural
    completion_note: "No extra filter needed; fires once per canonization."
    loc:
      en: "Have a character canonized as a saint."
      zh: "使一位人物被封为圣徒。"
  - id: create_masterpiece
    on_action: on_work_of_art_created
    wired: true
    scope: "root = country the art is created for (see also data/pulse_registry.yaml's existing tv_on_work_of_art_created_callback bridge, which already grants Cultural Influence Points from this same hook)"
    category: religious_cultural
    completion_note: >-
      Already consumed by the live Cultural Victory CIP source — a new task built on the
      same hook should add its own TV-named on_action under the existing
      on_work_of_art_created bridge block rather than a second bridge entry for the same
      vanilla key.
    loc:
      en: "Commission or otherwise cause a new work of art to be created."
      zh: "委托创作或以其他方式促成一件新艺术品的诞生。"
  - id: embrace_institution
    on_action: on_institution_embraced
    wired: true
    scope: "root = country"
    category: religious_cultural
    completion_note: >-
      Fires on any institution; a task targeting one specific institution must add its own
      trigger check (has_embraced_institution = institution:<id>) in the consumer.
    loc:
      en: "Embrace a new institution."
      zh: "接纳一项新的制度（Institution）。"

  # --- Economic / Colonial / Exploration ---
  - id: complete_colonial_charter
    on_action: on_colonial_charter_finished
    wired: true
    scope: "root = country, scope:target = province"
    category: economic_colonial
    completion_note: "No extra filter needed; fires once per completed charter."
    loc:
      en: "Complete a colonial charter."
      zh: "完成一份殖民特许状。"
  - id: complete_exploration_mission
    on_action: on_exploration_success
    wired: true
    scope: "see reference_game_files/game/in_game/common/on_action/exploration_mission_monthly.txt for exact scope variables"
    category: economic_colonial
    completion_note: "No extra filter needed beyond what the vanilla hook already guarantees on success."
    loc:
      en: "Successfully complete an exploration mission."
      zh: "成功完成一次探索任务。"
  - id: found_new_country
    on_action: on_new_country_formed
    wired: false
    scope: "root = newly formed country"
    category: economic_colonial
    completion_note: "No extra filter needed; fires once for the new country itself, not its predecessor."
    loc:
      en: "Form a new country (e.g. through a country-formation mechanic)."
      zh: "通过国家转变机制建立一个新国家。"
  - id: pass_parliament_vote
    on_action: on_parliament_passed
    wired: true
    scope: "root = country (see reference_game_files/game/in_game/common/on_action/parliament_monthly_pulse.txt for full scope variables)"
    category: economic_colonial
    completion_note: >-
      Fires on any passed parliamentary issue; a task targeting a specific issue must add its
      own identity check in the consumer.
    loc:
      en: "Pass a vote in your country's parliament."
      zh: "在本国议会中通过一项表决。"

  # --- Wave 2 (bolder, wider net) ---
  - id: take_command_of_army
    on_action: on_command_gained
    wired: false
    scope: "root = character, scope:unit = unit"
    category: military
    completion_note: >-
      Character-scope, not country-scope — a country-level consumer resolves the country from
      root.owner. No extra filter needed beyond the character actually taking command.
    loc:
      en: "Have a character take command of a military unit."
      zh: "任命一名人物统领一支部队。"
  - id: win_country_election
    on_action: on_election
    wired: false
    scope: "root = country"
    category: political
    completion_note: >-
      Fires on any election outcome; the hook does not distinguish who won the election from
      who merely held one, so a consumer wanting "won" specifically must add its own
      post-election ruler/government check.
    verify_in_game: true
    loc:
      en: "Win a country election."
      zh: "赢得一次国家选举。"
  - id: expand_bureaucracy
    on_action: on_bureaucracy_added
    wired: true
    scope: "root = country, scope:bureaucracy_type = the bureaucracy type added"
    category: political
    completion_note: >-
      Fires on any bureaucracy type gained; a task targeting one specific type must filter on
      scope:bureaucracy_type in the consumer.
    loc:
      en: "Gain a new bureaucracy type."
      zh: "获得一种新的官僚机构类型。"
  - id: ennoble_a_commoner
    on_action: on_character_estate_change
    wired: false
    scope: "root = character, scope:estate = estate type"
    category: political
    completion_note: >-
      Fires on any estate change; counts as "ennoble" only when scope:estate =
      estate_type:nobles_estate — the consumer must add that filter itself.
    loc:
      en: "Elevate a character into the nobility."
      zh: "将一名人物提升为贵族。"
  - id: adopt_new_policy
    on_action: on_policy_changed
    wired: true
    scope: "root = country"
    category: political
    completion_note: >-
      Fires on any policy slot change; a task targeting one specific policy must filter in the
      consumer, since the on_action carries no policy identity in scope.
    loc:
      en: "Adopt a new policy."
      zh: "推行一项新政策。"
  - id: establish_parliament
    on_action: on_parliament_established
    wired: false
    scope: "root = country (parliament type changed from no_parliament to one with a parliament)"
    category: political
    completion_note: "No extra filter needed; fires once when a country first gains a parliament."
    loc:
      en: "Establish a parliament for the first time."
      zh: "首次建立议会。"
  - id: pass_io_parliament_vote
    on_action: on_io_parliament_passed
    wired: false
    scope: "root = international organization, scope:target = parliament issue, scope:location = parliament seat location"
    category: political
    completion_note: >-
      Root is the IO scope, not a country — a country-scope consumer must resolve the relevant
      country (e.g. the IO's leader country) from context.
    verify_in_game: true
    loc:
      en: "Pass a vote in an International Organization's parliament."
      zh: "在某国际组织的议会中通过一项表决。"
  - id: disband_international_organization
    on_action: on_international_organization_disbanding
    wired: false
    scope: "root = international organization, scope:actor = instigator (optional); sent just before the IO disbands"
    category: political
    completion_note: >-
      Root is the IO scope, not a country; resolve the instigator from scope:actor when
      present. Whether disbanding an IO should read as a positive task depends heavily on the
      consuming mechanic's framing.
    verify_in_game: true
    loc:
      en: "Disband an International Organization."
      zh: "解散一个国际组织。"
  - id: secure_marriage_union
    on_action: on_marriage_union_formation
    wired: false
    scope: "root = union, scope:ruler = ruling character, consorts list = the list of all consort characters"
    category: diplomatic
    completion_note: >-
      Root is the union scope, not a country — a country-scope consumer resolves the member
      country from scope:ruler.owner.
    loc:
      en: "Secure a marriage-based personal union."
      zh: "通过联姻建立共主邦联。"
  - id: grant_independence_to_subject
    on_action: on_released_country
    wired: false
    scope: "root = released country, scope:overlord = overlord"
    category: diplomatic
    completion_note: >-
      Counts for the grantor's task progress by reading scope:overlord directly, not root
      (root is the newly released country).
    loc:
      en: "Voluntarily grant independence to one of your subjects."
      zh: "主动允许一个附庸获得独立。"
  - id: weather_a_regency
    on_action: on_regency_end
    wired: false
    scope: "root = country"
    category: political
    completion_note: >-
      The hook only confirms a regency period concluded, not that it concluded well (no coup,
      no lost territory, etc.) — a "successful" framing needs an extra state check in the
      consumer.
    verify_in_game: true
    loc:
      en: "Bring a regency period to a close."
      zh: "结束一段摄政时期。"
  - id: appoint_a_minister
    on_action: on_cabinet_assigned
    wired: true
    scope: "root = country, scope:target = character who got assigned to the cabinet"
    category: political
    completion_note: "No extra filter needed; fires once per cabinet appointment."
    loc:
      en: "Appoint a minister to your cabinet."
      zh: "任命一位内阁大臣。"
  - id: attract_a_notable_character
    on_action: on_character_moved_country
    wired: true
    scope: "root = character, scope:target = new country, scope:owner = old country"
    category: political
    completion_note: >-
      Counts for scope:target (the receiving country), not root. The hook fires for any
      character switching employer, not only "notable" ones — a consumer wanting a quality bar
      (e.g. minimum ADM/DIP/MIL) must add its own character filter.
    verify_in_game: true
    loc:
      en: "Attract a notable character into your service from abroad."
      zh: "从他国招揽一位知名人物为己所用。"
  - id: reform_heir_selection
    on_action: on_heir_selection_changed
    wired: false
    scope: "root = country; scope:old_heir_selection; scope:heir_selection"
    category: political
    completion_note: >-
      Fires on any heir-selection law change; a task targeting a specific selection law filters
      on scope:heir_selection in the consumer.
    loc:
      en: "Change your country's heir selection law."
      zh: "改变国家的继承人选定法律。"
  - id: upgrade_subject_relationship
    on_action: on_subject_type_changed
    wired: false
    scope: "root = subject, scope:overlord = overlord, scope:subject_type = current subject type, scope:old_subject_type = subject type before the change"
    category: diplomatic
    completion_note: >-
      Fires from the subject's own perspective (root); an overlord-scope consumer resolves
      scope:overlord instead. Whether a given scope:old_subject_type -> scope:subject_type
      transition counts as an "upgrade" needs a consumer-defined ordering, since the hook
      itself carries no ranking.
    verify_in_game: true
    loc:
      en: "Change a subject relationship to a different subject type."
      zh: "将附庸关系转变为另一种附庸类型。"
  - id: receive_transferred_subject
    on_action: on_transfer_subject
    wired: true
    scope: "root = subject, scope:overlord = new overlord, scope:former_overlord = old overlord (fires after the transfer)"
    category: diplomatic
    completion_note: "Counts for scope:overlord (the receiving country), not root."
    loc:
      en: "Receive a subject transferred from another overlord."
      zh: "接收一个由他国转让而来的附庸。"
  - id: rise_in_power_rank
    on_action: on_country_rank_change
    wired: false
    scope: "root = country, scope:old_rank = country's old rank"
    category: political
    completion_note: >-
      Fires on ANY rank change, up or down — a consumer confirming a genuine rise must compare
      the country's current rank trigger value against scope:old_rank itself; the on_action
      carries no direction.
    verify_in_game: true
    loc:
      en: "Improve your country's overall power rank."
      zh: "提升国家的整体实力排名。"
  - id: achieve_hegemon_status
    on_action: on_gain_hegemon_status
    wired: false
    scope: "root = country, scope:target = hegemony"
    category: political
    completion_note: "No extra filter needed; fires once when hegemon status is newly gained."
    loc:
      en: "Achieve recognized Hegemon status."
      zh: "获得公认的霸权地位。"
  - id: complete_country_mission
    on_action: on_mission_completion
    wired: false
    scope: "root = country"
    category: economic_colonial
    completion_note: >-
      Fires on any completed country mission (the vanilla mission-tree system); a task
      targeting one specific mission must add its own identity check in the consumer, since the
      on_action carries no mission identity in scope.
    loc:
      en: "Complete a country mission."
      zh: "完成一项国家任务（Mission）。"
  - id: embrace_the_revolution
    on_action: on_embrace_revolution
    wired: false
    scope: "root = country"
    category: political
    completion_note: >-
      Tied to the Age of Revolution flavor content (fires alongside the_revolution.9);
      reachability depends on that content actually being active in a given campaign — treat as
      a late-game-only task.
    verify_in_game: true
    loc:
      en: "Embrace the Revolution."
      zh: "拥抱大革命。"
  - id: change_state_culture
    on_action: on_culture_changed
    wired: false
    scope: "root = country, scope:old_culture = old culture"
    category: religious_cultural
    completion_note: "No extra filter needed; fires once per primary-culture change."
    loc:
      en: "Change your country's primary culture."
      zh: "改变国家的主体文化。"
  - id: secure_a_protector
    on_action: on_dependency_gained
    wired: true
    scope: "root = country, scope:overlord = new overlord"
    category: diplomatic
    completion_note: >-
      Counts for root itself (the country entering the dependency), distinct from
      gain_subject's overlord-side perspective on the same lifecycle moment.
    loc:
      en: "Secure a powerful protector by becoming its subject."
      zh: "成为强国的附庸以寻求庇护。"
  - id: adopt_io_policy
    on_action: on_international_organization_policy_changed
    wired: false
    scope: "root = international organization"
    category: political
    completion_note: >-
      Root is the IO scope with no country or actor link documented on this hook — a
      country-scope consumer must resolve which country to credit from other context (e.g. the
      vote's own effect chain), not from this on_action's scope alone.
    verify_in_game: true
    loc:
      en: "Have an International Organization adopt a new policy."
      zh: "使某国际组织通过一项新政策。"
  - id: provoke_a_rival
    on_action: on_insult
    wired: false
    scope: "root, scope:actor = sender, scope:recipient = receiver"
    category: diplomatic
    completion_note: >-
      Counts for scope:actor (the sender). Framing an insult as a rewarded "task" is an
      unusual, aggressive-diplomacy playstyle choice — double-check against the mod's mostly
      positive-achievement tone before using this in a real mechanic.
    verify_in_game: true
    loc:
      en: "Send a diplomatic insult to another country."
      zh: "向他国发出外交侮辱。"

trigger_task:
  # --- Economic ---
  - id: accumulate_treasury
    trigger: gold
    scope: country
    comparison: gte
    representative_threshold: 500
    category: economic
    loc:
      en: "Accumulate at least this much gold in the treasury."
      zh: "国库积累至少达到此数额的金币。"
  - id: sustain_monthly_income
    trigger: monthly_income_total
    scope: country
    comparison: gte
    representative_threshold: 20
    category: economic
    loc:
      en: "Sustain at least this much total monthly income."
      zh: "维持至少此数额的每月总收入。"
  - id: sustain_monthly_trade_income
    trigger: monthly_trade_income
    scope: country
    comparison: gte
    representative_threshold: 10
    category: economic
    loc:
      en: "Sustain at least this much monthly trade income (mirrors the Trade Victory core metric — see Towards_Victory_Design.md section 3.3)."
      zh: "维持至少此数额的每月贸易收入（对应贸易胜利核心指标，参见 Towards_Victory_Design.md 3.3 节）。"
  - id: reach_markets_with_merchants
    trigger: num_of_markets_with_merchants
    scope: country
    comparison: gte
    representative_threshold: 10
    category: economic
    loc:
      en: "Have merchants present in at least this many markets."
      zh: "在至少这么多个市场中派驻商人。"
  - id: reach_colonial_charters
    trigger: num_colonial_charters
    scope: country
    comparison: gte
    representative_threshold: 3
    category: economic
    loc:
      en: "Hold at least this many colonial charters."
      zh: "持有至少这么多份殖民特许状。"

  # --- Territorial ---
  - id: reach_owned_locations
    trigger: num_locations
    scope: country
    comparison: gte
    representative_threshold: 50
    category: territorial
    loc:
      en: "Own at least this many locations (mirrors the Conquest Victory core metric — see Towards_Victory_Design.md section 3.1)."
      zh: "拥有至少这么多个地点（对应征服胜利核心指标，参见 Towards_Victory_Design.md 3.1 节）。"
  - id: reach_owned_provinces
    trigger: num_provinces
    scope: country
    comparison: gte
    representative_threshold: 15
    category: territorial
    loc:
      en: "Own at least this many provinces."
      zh: "拥有至少这么多个省份。"
  - id: reach_total_development
    trigger: total_development
    scope: country
    comparison: gte
    representative_threshold: 500
    category: territorial
    loc:
      en: "Reach at least this much total development across all owned locations."
      zh: "所有拥有地点的总发展度达到此数值。"

  # --- Military ---
  - id: reach_army_size
    trigger: army_size
    scope: country
    comparison: gte
    representative_threshold: 10000
    category: military
    loc:
      en: "Raise an army of at least this size."
      zh: "组建至少此规模的陆军。"
  - id: reach_regular_army_size
    trigger: regular_army_size
    scope: country
    comparison: gte
    representative_threshold: 5000
    category: military
    loc:
      en: "Raise a regular (maximum-strength) army of at least this size."
      zh: "组建至少此规模的满编正规陆军。"
  - id: reach_navy_size
    trigger: navy_size
    scope: country
    comparison: gte
    representative_threshold: 20
    category: military
    loc:
      en: "Build a navy of at least this many ships."
      zh: "建造至少这么多艘舰船的海军。"
  - id: reach_manpower_pool
    trigger: manpower
    scope: country
    comparison: gte
    representative_threshold: 10000
    category: military
    loc:
      en: "Build up a manpower pool of at least this size."
      zh: "储备至少此数量的人力。"
  - id: reach_sailors_pool
    trigger: sailors
    scope: country
    comparison: gte
    representative_threshold: 5000
    category: military
    loc:
      en: "Build up a sailors pool of at least this size."
      zh: "储备至少此数量的水手。"
  - id: keep_war_exhaustion_low
    trigger: war_exhaustion
    scope: country
    comparison: lte
    representative_threshold: 5
    category: military
    loc:
      en: "Keep war exhaustion at or below this level (inverted polarity, same convention as country_reward.inflation in section 1 — completion means staying under the threshold, not exceeding it)."
      zh: "将战争疲劳维持在此水平及以下（方向相反，与第 1 节 country_reward.inflation 的约定相同——达成条件是保持在阈值之下，而非超过阈值）。"

  # --- Diplomatic / Great Power ---
  - id: reach_prestige
    trigger: prestige
    scope: country
    comparison: gte
    representative_threshold: 50
    category: diplomatic
    loc:
      en: "Reach at least this much prestige."
      zh: "威望达到此数值。"
  - id: reach_stability
    trigger: stability
    scope: country
    comparison: gte
    representative_threshold: 3
    category: diplomatic
    loc:
      en: "Reach at least this much stability."
      zh: "稳定度达到此数值。"
  - id: reach_government_power
    trigger: government_power
    scope: country
    comparison: gte
    representative_threshold: 50
    category: diplomatic
    loc:
      en: "Reach at least this much government power (auto-resolves to legitimacy/republican_tradition/devotion/horde_unity/tribal_cohesion by government type, mirroring country_reward.government_power in section 1)."
      zh: "政府权力值达到此数值（按政府类型自动对应正统性/共和传统/虔诚度/部落统一度/部落凝聚力，对应第 1 节 country_reward.government_power）。"
  - id: reach_diplomats
    trigger: num_of_diplomats
    scope: country
    comparison: gte
    representative_threshold: 3
    category: diplomatic
    loc:
      en: "Have at least this many diplomats available."
      zh: "拥有至少这么多名可用外交官。"
  - id: reach_average_estate_satisfaction
    trigger: average_estate_satisfaction
    scope: country
    comparison: gte
    representative_threshold: 0.6
    category: diplomatic
    loc:
      en: "Reach at least this much average estate satisfaction (crown estate excluded, matching the trigger's own definition)."
      zh: "平均阶层满意度达到此数值（不含王室阶层，与该 trigger 本身的定义一致）。"
  - id: reach_great_power_score
    trigger: great_power_score
    scope: country
    comparison: gte
    representative_threshold: 100
    category: diplomatic
    loc:
      en: "Reach at least this much Great Power (area-dominance) score."
      zh: "列强（地区支配力）分数达到此数值。"
  - id: become_recognized_great_power
    trigger: is_great_power
    scope: country
    comparison: boolean
    representative_threshold: null
    category: diplomatic
    loc:
      en: "Be recognized as a Great Power."
      zh: "被公认为列强。"

  # --- Science ---
  - id: reach_advances_researched
    trigger: num_of_advances_researched
    scope: country
    comparison: gte
    representative_threshold: 15
    category: science
    loc:
      en: "Research at least this many Advances (mirrors the Scientific Victory core metric — see Towards_Victory_Design.md section 3.6)."
      zh: "研究至少这么多项技术进步（Advance）（对应科技胜利核心指标，参见 Towards_Victory_Design.md 3.6 节）。"

  # --- International Organization scope ---
  - id: reach_io_electors
    trigger: num_of_electors
    scope: international_organization
    comparison: gte
    representative_threshold: 4
    category: international_organization
    loc:
      en: "Have at least this many electors within an International Organization."
      zh: "某国际组织内拥有至少这么多名选帝侯（选举人）。"
  - id: reach_io_total_great_power_score
    trigger: io_total_great_power_score
    scope: international_organization
    comparison: gte
    representative_threshold: 200
    category: international_organization
    loc:
      en: "Reach at least this much combined Great Power score across an International Organization's membership (cached, updated monthly by the engine)."
      zh: "某国际组织全体成员的列强分数总和达到此数值（引擎每月缓存更新）。"

  # --- Wave 2 (bolder, wider net) ---
  # --- Character scope ---
  - id: character_adm_threshold
    trigger: adm
    scope: character
    comparison: gte
    representative_threshold: 5
    category: character
    loc:
      en: "Have a character reach at least this much administrative (ADM) skill."
      zh: "使一名人物的行政（ADM）能力达到此数值。"
  - id: character_dip_threshold
    trigger: dip
    scope: character
    comparison: gte
    representative_threshold: 5
    category: character
    loc:
      en: "Have a character reach at least this much diplomatic (DIP) skill."
      zh: "使一名人物的外交（DIP）能力达到此数值。"
  - id: character_mil_threshold
    trigger: mil
    scope: character
    comparison: gte
    representative_threshold: 5
    category: character
    loc:
      en: "Have a character reach at least this much military (MIL) skill."
      zh: "使一名人物的军事（MIL）能力达到此数值。"
  - id: character_num_traits
    trigger: num_of_traits
    scope: character
    comparison: gte
    representative_threshold: 3
    category: character
    loc:
      en: "Have a character accumulate at least this many traits."
      zh: "使一名人物积累至少这么多个特质。"
  - id: character_num_children
    trigger: num_of_children
    scope: character
    comparison: gte
    representative_threshold: 3
    category: character
    loc:
      en: "Have a character raise a family of at least this many children."
      zh: "使一名人物拥有至少这么多个子女。"
  - id: character_longevity
    trigger: age_in_years
    scope: character
    comparison: gte
    representative_threshold: 60
    category: character
    loc:
      en: "Have a character live to at least this age."
      zh: "使一名人物活到至少此年龄。"
  - id: character_has_heir
    trigger: is_heir
    scope: character
    comparison: boolean
    representative_threshold: null
    category: character
    loc:
      en: "Designate a character as heir apparent."
      zh: "指定一名人物为法定继承人。"

  # --- Religious / cultural, target-parameterized ---
  - id: dominant_state_religion
    trigger: religious_unity
    scope: country
    comparison: gte
    representative_threshold: 0.8
    category: religious_cultural
    loc:
      en: "Reach at least this fraction of the population sharing your country's own religion."
      zh: "使信奉本国国教的人口比例达到此数值。"
  - id: dominant_culture_share
    trigger: culture_percentage_in_country
    scope: country
    comparison: gte
    representative_threshold: 0.5
    requires_target: "culture (a specific culture id)"
    verify_in_game: true
    category: religious_cultural
    loc:
      en: "Have a specific culture reach at least this population share within your country."
      zh: "使某一特定文化在本国的人口占比达到此数值。"
  - id: dominant_religion_in_realm
    trigger: religion_percentage
    scope: country
    comparison: gte
    representative_threshold: 0.5
    requires_target: >-
      religion (a specific religion id); the trigger also supports
      location/province/province_definition/area/region/subcontinent/continent/scripted_geography
      scopes per triggers.log — country-scope aggregation behavior was not separately confirmed
    verify_in_game: true
    category: religious_cultural
    loc:
      en: "Have a specific religion reach at least this population share within your realm."
      zh: "使某一特定宗教在本国境内的人口占比达到此数值。"
  - id: hold_specific_reform
    trigger: has_reform
    scope: country
    comparison: boolean
    representative_threshold: null
    requires_target: "government_reform (a specific reform id)"
    category: political
    loc:
      en: "Hold a specific government reform."
      zh: "拥有一项特定的政府改革。"
  - id: at_war_with_rival
    trigger: is_at_war_with
    scope: country
    comparison: boolean
    representative_threshold: null
    requires_target: "country (a specific rival country)"
    verify_in_game: true
    category: military
    loc:
      en: "Be at war with a specific designated rival."
      zh: "与某个特定的对手处于战争状态。"
  - id: become_colonial_overlord
    trigger: is_colonial_overlord
    scope: country
    comparison: boolean
    representative_threshold: null
    category: economic_colonial
    loc:
      en: "Become the overlord of a colonial subject."
      zh: "成为殖民附庸的宗主国。"

  # --- Military breadth ---
  - id: reach_regular_navy_size
    trigger: regular_navy_size
    scope: country
    comparison: gte
    representative_threshold: 15
    category: military
    loc:
      en: "Build a regular (maximum-strength) navy of at least this many ships."
      zh: "建造至少这么多艘满编正规舰船的海军。"
  - id: reach_owned_ports
    trigger: num_of_ports
    scope: country
    comparison: gte
    representative_threshold: 5
    category: economic
    loc:
      en: "Own at least this many ports."
      zh: "拥有至少这么多个港口。"
  - id: reach_expected_army_size
    trigger: expected_army_size
    scope: country
    comparison: gte
    representative_threshold: 12000
    category: military
    loc:
      en: "Reach at least this much expected army size."
      zh: "预期陆军规模达到此数值。"
  - id: reach_potential_navy_size
    trigger: potential_navy_size
    scope: country
    comparison: gte
    representative_threshold: 25
    category: military
    loc:
      en: "Reach at least this much potential navy size (ships the country has and could still raise)."
      zh: "潜在海军规模（已有及可征召舰船总数）达到此数值。"

  # --- Tradition / percentage-of-maximum ---
  - id: army_tradition_threshold
    trigger: army_tradition
    scope: country
    comparison: gte
    representative_threshold: 30
    category: military
    loc:
      en: "Reach at least this much army tradition."
      zh: "陆军传统达到此数值。"
  - id: navy_tradition_threshold
    trigger: navy_tradition
    scope: country
    comparison: gte
    representative_threshold: 30
    category: military
    loc:
      en: "Reach at least this much navy tradition."
      zh: "海军传统达到此数值。"
  - id: prestige_percentage_threshold
    trigger: prestige_percentage
    scope: country
    comparison: gte
    representative_threshold: 0.75
    category: diplomatic
    loc:
      en: "Reach at least this percentage of your maximum possible prestige."
      zh: "威望达到其理论上限的此百分比。"
  - id: legitimacy_percentage_threshold
    trigger: legitimacy_percentage
    scope: country
    comparison: gte
    representative_threshold: 0.9
    verify_in_game: true
    category: diplomatic
    loc:
      en: "Reach at least this percentage of maximum legitimacy (this trigger name is monarchy-specific; other government types may need a differently-named equivalent percentage trigger — verify before use)."
      zh: "正统性达到其理论上限的此百分比（该 trigger 名称为君主制专属，其他政体可能需要另一个同类百分比 trigger——使用前请核实）。"

  # --- Alternate detection / bold ---
  - id: recognized_as_subject
    trigger: is_subject
    scope: country
    comparison: boolean
    representative_threshold: null
    category: diplomatic
    loc:
      en: "Be recognized as another country's subject (an alternative trigger-based detection of the same fact as the on_action_task entry secure_a_protector — a consumer should pick one detection method, not both)."
      zh: "被承认为他国的附庸（与 on_action_task 中 secure_a_protector 检测的是同一事实，只是改用 trigger 轮询——消费方应二选一，不要同时使用）。"
  - id: unit_morale_threshold
    trigger: morale_percentage
    scope: unit
    comparison: gte
    representative_threshold: 1.0
    verify_in_game: true
    category: military
    loc:
      en: "Have a military unit reach at least this much morale, as a fraction of maximum (unit scope — a country-level consumer must iterate the country's own units to apply this)."
      zh: "使一支部队的士气（占理论上限的比例）达到此数值（部队级 scope——国家级消费方需要自行遍历本国部队来应用此项）。"
  - id: gold_percentage_threshold
    trigger: gold_percentage
    scope: country
    comparison: gte
    representative_threshold: 0.9
    category: economic
    loc:
      en: "Reach at least this percentage of your maximum possible treasury."
      zh: "国库金币达到其理论上限的此百分比。"
