# Arts Exhibition law categories for tv_arts_exhibition_laws.txt.
# Structure: 8 Arts Exhibition laws with 4-5 policies each.
# All laws use IO policy votes, following the Academy of Sciences and
# Governor's House pattern.
#
# DO NOT hand-edit generated output files. Run:
#   conda run --no-capture-output -n eu5 python scripts/in_game/common/laws/gen_tv_arts_exhibition_laws.py

law_category: tv_arts_exhibition_laws
io_type: tv_arts_exhibition

laws:
  - id: tv_arts_patronage_law
    display_comment: "LAW 1: Artistic Patronage"
    policies:
      - id: tv_arts_church_patronage_policy
        display_comment: "Church Patronage (default)"
        default: true
        country_modifier: |
          global_pop_conversion_speed_modifier = 0.30
          global_clergy_estate_power = 0.25
          global_monthly_art_start_chance = -0.05
      - id: tv_arts_court_patronage_policy
        display_comment: "Court Patronage"
        country_modifier: |
          monthly_legitimacy = 0.10
          monthly_prestige = 0.05
          court_spending_efficiency = -0.15
      - id: tv_arts_noble_patronage_policy
        display_comment: "Noble Patronage"
        country_modifier: |
          cultures_capacity = 1
          global_nobles_estate_power = 0.25
          global_monthly_control = -0.001
      - id: tv_arts_commercial_patronage_policy
        display_comment: "Commercial Patronage"
        country_modifier: |
          global_monthly_art_start_chance = 0.10
          global_monthly_development = 0.001
          trade_income = -0.05
      - id: tv_arts_state_academy_patronage_policy
        display_comment: "State Academy System"
        country_modifier: |
          skill_of_new_artists = 0.10
          cultural_tradition_modifier = 0.10
          global_monthly_art_start_chance = -0.05
          court_spending_efficiency = -0.10

