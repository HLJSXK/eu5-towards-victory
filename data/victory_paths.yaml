      	if = { limit = { var:tv_diplomatic_progress_pct > 100 } set_variable = { name = tv_diplomatic_progress_pct value = 100 } }
      }

    extra_loc_keys: []

    loc:
      title:
        en: "Diplomatic Victory"
        zh: "外交胜利"
      description:
        en: "War leaves only widows and ruins. True power is the art of making every throne your [alliance|e] partner, every border your [guarantee|e], and every prince your debtor."
        zh: "战争留下的只有孤寡与废墟。真正的权力，是让每一座王座成为你的[alliance|e]伙伴，每一道边境成为你的[guarantee|e]，每一位王公成为你的债务人。"
      flavor:
        en: '"An army is of little use where reason fails."'
        zh: '"在理性失败之处，军随谓少用。"'
      progress_display:
        en: "[tv_diplomatic_victory_points|e]: [Country.MakeScope.GetVariable('tv_diplomatic_victory_points').GetValue|0] / 580"
        zh: "[tv_diplomatic_victory_points|e]：[Country.MakeScope.GetVariable('tv_diplomatic_victory_points').GetValue|0] / 580"

    milestones:
      - n: 1
        is_short_term: false
        is_long_term: false
        threshold: 50
        extra_trigger_block: |
          custom_tooltip = {
          	text = TV_DIPLOMATIC_M1_EXTRA_TRIGGER_DESC
          	has_variable = tv_diplomatic_support_count
          	var:tv_diplomatic_support_count >= 10
          }
        custom_grant_body: |
          add_country_modifier = { modifier = tv_diplomatic_m1_bonus days = -1 }
          if = {
              limit = {
                  NOT = {
                      any_international_organizations_member_of = {
                          international_organization_type = international_organization_type:tv_diplomatic_alliance
                          leader_country = this
                      }
                  }
              }
              custom_tooltip = { text = tv_create_diplomatic_alliance_tt }
              hidden_effect = {
                  save_scope_as = tv_founder
                  create_international_organization = {
                      type = international_organization_type:tv_diplomatic_alliance
                      add_country_to_international_organization = prev
                      set_leader_country = prev
                      save_scope_as = tv_alliance_io
                      every_country = {
                          limit = {
                              has_variable = tv_diplomatic_supporter_of
                              var:tv_diplomatic_supporter_of = scope:tv_founder
                          }
                          scope:tv_alliance_io = {
                              add_country_to_international_organization = prev
                          }
                      }
                      set_variable = { name = tv_alliance_cohesion value = 0 }
                      set_variable = { name = tv_alliance_tier value = 0 }
                  }
                  set_variable = { name = tv_alliance_tier value = 0 }
              }
          }
        modifier:
          monthly_diplomats: 0.10
        modifier_name:
          en: "Diplomatic Corps"
          zh: "外交团队"
        loc:
          title:
            en: "Diplomatic Victory — Milestone 1"
            zh: "外交胜利 — 里程碑一"
          meaning:
            en: "50 [tv_diplomatic_victory_points|e]. A voice that carries weight in the courts of nations."
            zh: "50 [tv_diplomatic_victory_points|e]。一个在各国宫廷中具有分量的声音。"
          trigger_desc:
            en: "[tv_diplomatic_victory_points|e] ≥ 50"
            zh: "[tv_diplomatic_victory_points|e] ≥ 50"
          extra_trigger_desc:
            en: "Diplomatic Supporters ≥ 10"
            zh: "外交支持国 ≥ 10"
          event_title:
            en: "A Voice Among Nations"
            zh: "外交展露头角"
          event_desc:
            en: "Our patient diplomacy has begun to bear fruit. Through [alliance|e]s and [royal_marriage|e]s, our nation is earning a place at the table of [great_power|e]s. Ten nations have pledged their diplomatic support — together, we shall form a grand alliance."
            zh: "我们耐心的外交已开始结果。通过[alliance|e]与[royal_marriage|e]，我国正在赢得一席之地。十个国家已承诺外交支持——我们将共同组建一个伟大的联盟。"
          event_option:
            en: "Let our word carry weight."
            zh: "让我们的话语具有分量。"

