        loc:
          title:
            en: "Scientific Victory — Milestone 4"
            zh: "科技胜利 — 第四里程碑"
          meaning:
            en: "The preeminent scientific power — three hundred [advance|e]s, generations of investment made manifest."
            zh: "首屈一指的科学强国——三百项[advance|e]，数代投入已然成真。"
          trigger_desc:
            en: "[tv_science_score|e] ≥ 300"
            zh: "[tv_science_score|e] ≥ 300"
          extra_trigger_desc:
            en: "[tv_academy_of_sciences|E] Level ≥ 4"
            zh: "[tv_academy_of_sciences|E]等级 ≥ 4"
          event_title:
            en: "[tv_science_victory|E]：On the Threshold of Modernity"
            zh: "[tv_science_victory|E]：现代性的门槛"
          event_desc:
            en: "Our natural philosophers and engineers now push against the boundaries of the known world with an impatience that unsettles older minds. Three hundred [advance|e]s stand as testimony to generations of investment in learning, but also to failures carefully preserved so the next hand need not repeat them. Workshops consult mathematicians, physicians consult instrument makers, and administrators discover that tables can be as disruptive as decrees. The [tv_academy_of_sciences|E] is no longer simply a monument; it is an engine with many rooms. Its gears are paper, brass, reputation, and sleeplessness. The threshold of modernity is not a door we found, but one we have been building plank by plank."
            zh: "我们的自然哲学家与工程师如今以一种令旧头脑不安的急切，推挤着已知世界的边界。三百项[advance|e]是数代人持续投入学问的证明，也是一次次失败被认真保存、以免后来者重蹈覆辙的证明。工坊请教数学家，医师请教仪器匠，行政官发现表格有时和敕令一样会搅动世界。[tv_academy_of_sciences|E]不再只是一座丰碑；它是一台拥有许多房间的机器。它的齿轮由纸张、黄铜、名声与失眠组成。现代性的门槛不是我们找到的一扇门，而是我们一块木板一块木板搭建出来的东西。"
          event_option:
            en: "Keep building the door to tomorrow."
            zh: "继续搭建通向明日的大门。"

      - n: 5
        is_short_term: false
        is_long_term: true
        threshold: 400
        extra_trigger_block: |
          custom_tooltip = {
          	text = TV_SCIENCE_M5_EXTRA_TRIGGER_DESC
          	has_variable = tv_academy_of_sciences_level
          	var:tv_academy_of_sciences_level >= 5
