            en: "Our commercial networks now dominate the region. The caravans and ships answer to us."
            zh: "我们的商业网络如今主导着整个地区。商队与船只都听命于我们。"
          event_option:
            en: "Send more merchants."
            zh: "派遣更多商人。"

      - n: 3
        is_short_term: true
