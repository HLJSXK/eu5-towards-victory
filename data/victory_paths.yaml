    extra_loc_keys: []

    loc:
      title:
        en: "Diplomatic Victory"
        zh: "外交胜利"
      description:
        en: "Accumulate influence through alliances, treaties, and statecraft."
        zh: "通过同盟、条约和外交手段积累影响力。"
      flavor:
        en: '"An army is of little use where reason fails."'
        zh: '"在理性失败之处，军随谓少用。"'
      progress_display:
        en: "[tv_diplomatic_victory_points|e]: [Country.MakeScope.GetVariable('tv_diplomatic_victory_points').GetValue|0] / 580"
        zh: "[tv_diplomatic_victory_points|e]：[Country.MakeScope.GetVariable('tv_diplomatic_victory_points').GetValue|0] / 580"

    milestones:
      - n: 1
        is_short_term: false
        is_long_term: false
        threshold: 50
        extra_trigger_block: |
          has_variable = tv_diplomatic_support_count
          var:tv_diplomatic_support_count >= 10
          OR = {
              NOT = { exists = international_organization:tv_diplomatic_alliance }
              is_leader_of_international_organization = international_organization:tv_diplomatic_alliance
          }
        custom_grant_body: |
          add_country_modifier = { modifier = tv_diplomatic_m1_bonus days = -1 }
          # Create the Diplomatic Alliance international organization
          if = {
              limit = { NOT = { exists = international_organization:tv_diplomatic_alliance } }
              create_international_organization = {
                  type = international_organization_type:tv_diplomatic_alliance
                  add_country_to_international_organization = root
                  set_leader_country = root
              }
              # Add all existing supporters to the organization
              every_country = {
                  limit = {
                      has_variable = tv_diplomatic_supporter_of
                      var:tv_diplomatic_supporter_of = root
                  }
                  international_organization:tv_diplomatic_alliance = {
                      add_country_to_international_organization = prev
                  }
              }
              # Initialize cohesion and alliance tier on the newly created IO
              international_organization:tv_diplomatic_alliance = {
                  set_variable = { name = tv_alliance_cohesion value = 0 }
                  set_variable = { name = tv_alliance_tier value = 0 }
              }
