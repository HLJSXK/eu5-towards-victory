            zh: "文化胜利 — 长期胜利"
          meaning:
            en: "1600 [tv_cultural_influence_points|e]. The greatest cultural legacy in history — [work_of_art|e]s made in your name will outlast every empire. Long-term Victory."
            zh: "1600 [tv_cultural_influence_points|e]。历史上最伟大的文化遗产——以你名义创作的[work_of_art|e]将超越每一个帝国，永世流传。长期胜利。"
          trigger_desc:
            en: "[tv_cultural_influence_points|e] ≥ 1600"
            zh: "[tv_cultural_influence_points|e] ≥ 1600"
