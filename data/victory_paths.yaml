        is_long_term: false
        threshold: 100
        extra_trigger_block: null
        reward_options:
          - modifier:
              merchant_maintenance_efficiency: 0.10
          - modifier:
              global_merchant_capacity_modifier: 0.10
          - modifier:
              global_merchant_power: 0.20
        unlock_body: null
        loc:
          title:
            en: "Trade Victory — Milestone 1"
            zh: "贸易胜利 — 里程碑一"
          meaning:
            en: "A [merchant|e] of note — seated at the heart of a great [market_center|e]. Monthly [trade_income|e] ~100."
            zh: "一位举足轻重的[merchant|e]——坐镇伟大的[market_center|e]核心。每月[trade_income|e]约100。"
          trigger_desc:
            en: "[tv_trade_score|e] ≥ 100"
            zh: "[tv_trade_score|e] ≥ 100"
          event_title:
            en: "[tv_trade_victory|E]：The First Markets"
            zh: "[tv_trade_victory|E]：首批市场"
          event_desc:
            en: "Our [merchant|e]s have won their first reliable places in the great [trade|e] [market|e]s. They do not yet command the world, but their agents know which doors open before dawn, which clerks can be trusted, and which warehouses smell of opportunity. A foothold in commerce is rarely dramatic; it is a stool in a counting house, a seal respected at a quay, a debt repaid on time. Still, the ledgers already show the first pulse of [tv_trade_victory|E]. Coin now travels toward us by habit rather than accident. Let rivals boast of treasures found; we will teach silver to keep appointments."
            zh: "我们的[merchant|e]已在伟大的[trade|e] [market|e]中赢得第一批可靠位置。他们尚不能号令世界，却已经知道哪些门会在黎明前开启，哪些书记值得信任，哪些仓库散发着机会的气味。商业立足点很少显得壮观；它是一间账房里的坐凳，一枚在码头受尊重的印章，一笔准时偿还的债务。然而账册上已经出现[tv_trade_victory|E]的第一阵脉搏。钱币如今开始因习惯而非偶然流向我们。让对手夸耀发现的宝藏吧；我们要教白银准时赴约。"
          event_option:
            en: "Sharpen the quills and count the tides."
            zh: "削尖羽笔，数清潮汐。"

      - n: 2
        is_short_term: false
        is_long_term: false
        threshold: 200
        extra_trigger_block: null
        reward_options:
          - modifier:
              global_foreign_build_buildings_efficiency: 0.10
          - modifier:
              diplomatic_reputation: 2
          - modifier:
              spy_network_construction: 0.20
        loc:
          title:
            en: "Trade Victory — Milestone 2"
            zh: "贸易胜利 — 里程碑二"
          meaning:
            en: "A maritime power — dominating regional [trade|e]. Monthly [trade_income|e] ~200."
            zh: "区域贸易霸主——主导地区[trade|e]。每月[trade_income|e]约200。"
          trigger_desc:
            en: "[tv_trade_score|e] ≥ 200"
            zh: "[tv_trade_score|e] ≥ 200"
          event_title:
            en: "[tv_trade_victory|E]：Lords of the Trade Route"
            zh: "[tv_trade_victory|E]：贸易路线之主"
          event_desc:
            en: "The region's caravans and ships have begun to arrange themselves around our convenience. Contracts are drafted in our measures, warehouses wait for our factors, and captains delay departure until our [merchant|e]s finish bargaining. This is not conquest by cannon, but it still changes who must bow before acting. Regional [trade|e] now moves through a network of favors, credit, escorts, and prices that our houses understand better than anyone else. Competitors still sail and ride, but they increasingly do so inside a world we priced for them. The map has roads, but the ledgers have routes of their own."
            zh: "本地区的商队与船只已经开始按照我们的便利重新排列。契约使用我们的度量，仓库等待我们的代理人，船长在我们的[merchant|e]谈完价之前推迟启航。这不是火炮征服，却同样改变了谁必须在行动前低头。区域[trade|e]如今穿行于一张由人情、信用、护送与价格构成的网络，而我们的商号比任何人都更懂这张网。竞争者仍在航行，仍在骑行，却越来越是在我们为他们标价的世界中前进。地图有道路，账册也有自己的航线。"
          event_option:
            en: "Let every caravan learn our rates."
            zh: "让每一支商队都学会我们的价格。"

      - n: 3
        is_short_term: true
        is_long_term: false
        threshold: 400
        extra_trigger_block: |
          # Use prev, not root: this trigger is also evaluated from situation->every_country, where root is the situation.
          custom_tooltip = {
          	text = tv_trade_market_dominance_5_tt
          	any_market_with_merchants = {
          		most_powerful_merchant = prev
          		count >= 5
          	}
          }
        reward_options:
          - modifier:
              diplomatic_range: 1000
          - modifier:
              trade_range: 1000
          - modifier:
              colonial_range: 1000
        loc:
          title:
            en: "Trade Victory — Short-term Victory"
            zh: "贸易胜利 — 短期胜利"
          meaning:
            en: "A great [trade|e] empire, our name known in every counting house. Short-term Victory. Monthly [trade_income|e] ~400."
            zh: "一个伟大的[trade|e]帝国，名字广为人知。短期胜利。每月[trade_income|e]约400。"
          trigger_desc:
            en: "[tv_trade_score|e] ≥ 400"
            zh: "[tv_trade_score|e] ≥ 400"
          event_title:
            en: "[tv_trade_victory|E]：A Great Commercial Empire"
            zh: "[tv_trade_victory|E]：伟大的商业帝国"
          event_desc:
            en: "What began as a handful of [merchant|e]s has become an empire of [trade|e], and it needs no throne room to be obeyed. Our name appears in the letters of insurers, the complaints of rivals, the prayers of sailors, and the quiet calculations of rulers who need loans before they need allies. In every great [market|e], someone now asks what we will pay, what we will carry, and what we will refuse. This short-term [tv_trade_victory|E] is measured not only in income, but in anticipation. People prepare for our arrival before our ships are sighted. That is power of a subtler kind, and subtle power often lasts the longest."
            zh: "昔日寥寥几名[merchant|e]，如今已经成长为一个无需王座也能受人服从的[trade|e]帝国。我们的名字出现在保险人的书信里、竞争者的抱怨里、水手的祈祷里，也出现在那些先需要贷款、后需要盟友的统治者的静默计算里。在每一个伟大的[market|e]中，如今都有人询问我们愿意支付什么、承运什么、拒绝什么。这场短期[tv_trade_victory|E]不只以收入衡量，也以期待衡量。人们在看见我们的船帆之前，便已为我们的到来做准备。这是一种更细微的权力，而细微的权力往往最持久。"
          event_option:
            en: "Give the counting houses their triumph."
            zh: "把凯旋交给账房。"

      - n: 4
        is_short_term: false
        is_long_term: false
        threshold: 1000
        extra_trigger_block: null
        reward_options:
          - modifier:
              global_trade_protection_factor: 0.50
          - modifier:
              global_trade_center_power: 0.25
          - modifier:
              colonial_migration_size: 0.10
        loc:
          title:
            en: "Trade Victory — Milestone 4"
            zh: "贸易胜利 — 里程碑四"
          meaning:
            en: "Near-monopoly control of the world's key [market|e]s — rivals count their losses. Monthly [trade_income|e] ~1,000."
            zh: "近乎垄断世界关键[market|e]——竞争者只能数着自己的损失。每月[trade_income|e]约1,000。"
          trigger_desc:
            en: "[tv_trade_score|e] ≥ 1,000"
            zh: "[tv_trade_score|e] ≥ 1,000"
          event_title:
            en: "[tv_trade_victory|E]：Masters of the Seas of Commerce"
            zh: "[tv_trade_victory|E]：商业之海的主宰"
          event_desc:
            en: "Our [trade|e] routes now cross the known world like a second set of currents. Ships leave one harbor with cloth, another with spice, another with metal, and all of them seem to return with information as valuable as cargo. Distance has not disappeared, but our [merchant|e] fleets have taught it to charge a lower price. Harbormasters recognize our signals, brokers wait for our news, and distant producers plant or mine with our demand in mind. Each voyage tightens the pattern. We are no longer merely participating in world commerce; we are teaching world commerce where to turn."
            zh: "我们的[trade|e]航线如今纵横已知世界，仿佛另一套洋流。船只从一座港口带出布匹，从另一座港口带出香料，从第三座港口带出金属，而它们归来时携带的信息往往与货物同样珍贵。距离并未消失，但我们的[merchant|e]舰队已经教会它收取更低的价码。港务官认得我们的信号，经纪人等待我们的消息，远方生产者也会把我们的需求纳入播种或开采的考虑。每一次航行都让图案收紧。我们不再只是参与世界商业；我们正在教世界商业该往哪里转向。"
          event_option:
            en: "Let the compass point toward profit."
            zh: "让罗盘指向利润。"

      - n: 5
        is_short_term: false
        is_long_term: true
        threshold: 2000
        extra_trigger_block: |
          custom_tooltip = {
          	text = tv_trade_market_dominance_10_tt
          	any_market_with_merchants = {
          		most_powerful_merchant = prev
          		count >= 10
          	}
          }
        reward_options:
          - modifier:
              colonial_migration_size: 0.10
          - modifier:
              war_no_cb_cost_modifier: -1.00
          - modifier:
              trade_income: 0.20
        loc:
          title:
            en: "Trade Victory — Long-term Victory"
            zh: "贸易胜利 — 长期胜利"
          meaning:
            en: "Undisputed [trade|e] hegemon. Long-term Victory. Monthly [trade_income|e] ~2,000."
            zh: "[trade|e]霸主，无可争议。长期胜利。每月[trade_income|e]约2,000。"
          trigger_desc:
            en: "[tv_trade_score|e] ≥ 2,000"
            zh: "[tv_trade_score|e] ≥ 2,000"
          event_title:
            en: "[tv_trade_victory|E]：The Trade Hegemon"
            zh: "[tv_trade_victory|E]：贸易霸主"
          event_desc:
            en: "We have done what no nation before us managed: we have made the world's commerce answer in our accent. Not every port is ours, not every ship flies our colors, and not every contract bears our seal, but every serious calculation must now include us. Prices tremble when our convoys are delayed. Princes wait for our credit, colonists wait for our cargoes, and rivals build policies around our habits. This is [tv_trade_victory|E] fulfilled, a hegemony written in ledgers rather than marble. It may look quieter than conquest, but no throne is truly steady when its treasury depends on routes we can disturb. The world's commerce is not a place we own; it is a conversation we have learned to lead."
            zh: "我们完成了前所未有的壮举：让世界商业以我们的口音作答。并非每一座港口都属于我们，并非每一艘船都悬挂我们的旗帜，也并非每一份契约都盖有我们的印章，但每一次严肃的计算都必须把我们纳入其中。我们的船队一旦延误，价格便会颤动。王公等待我们的信用，殖民者等待我们的货物，竞争者围绕我们的习惯制定政策。这就是[tv_trade_victory|E]的完成，一种写在账册而非大理石上的霸权。它或许比征服安静，但当国库依赖我们能扰动的航路时，没有哪座王座真正稳固。世界商业不是我们拥有的一处地方；它是一场我们学会主导的谈话。"
          event_option:
            en: "Balance the world in our books."
            zh: "在我们的账册中为世界结算。"

  # ── DIPLOMATIC ────────────────────────────────────────────────────────────
  - id: diplomatic
    score_var: tv_diplomatic_victory_points
    gui:
      order: 3
      tab_label:
        en: "Diplomatic"
        zh: "外交"
      icon: "gfx/interface/icons/towards_victory/victory_paths/tv_victory_diplomatic.dds"
      progress_style: progress_bar_blue_alt
    call_updater_in_checker: false     # accumulated by Diplomatic Alliance tier monthly effect
    score_var_init_in_checker: true    # DVP variable may not exist before alliance foundation

    score_updater_body: null           # no score updater; IO monthly_effect handles accumulation

    progress_pct_body: |
      # ── Diplomatic Victory ────────────────────────────────────────────────────
      # piecewise progress: each milestone band contributes 20%
      if = {
      	limit = {
      		custom_tooltip = {
      			text = TV_HAS_DIPLOMATIC_VICTORY_POINTS_TT
      			has_variable = tv_diplomatic_victory_points
      		}
      	}
      	# Seg 1: 0-1 → 0-20
      	set_variable = { name = tv_diplomatic_progress_pct value = var:tv_diplomatic_victory_points }
      	change_variable = { name = tv_diplomatic_progress_pct multiply = 20 }
      	# Seg 2: 1-100 → 20-40
      	if = {
      		limit = { var:tv_diplomatic_victory_points >= 1 }
      		set_variable = { name = tv_diplomatic_progress_pct value = var:tv_diplomatic_victory_points }
      		change_variable = { name = tv_diplomatic_progress_pct subtract = 1 }
      		change_variable = { name = tv_diplomatic_progress_pct multiply = 20 }
      		change_variable = { name = tv_diplomatic_progress_pct divide = 99 }
      		change_variable = { name = tv_diplomatic_progress_pct add = 20 }
      	}
      	# Seg 3: 100-1000 → 40-60
      	if = {
      		limit = { var:tv_diplomatic_victory_points >= 100 }
      		set_variable = { name = tv_diplomatic_progress_pct value = var:tv_diplomatic_victory_points }
      		change_variable = { name = tv_diplomatic_progress_pct subtract = 100 }
      		change_variable = { name = tv_diplomatic_progress_pct multiply = 20 }
      		change_variable = { name = tv_diplomatic_progress_pct divide = 900 }
      		change_variable = { name = tv_diplomatic_progress_pct add = 40 }
      	}
      	# Seg 4: 1000-5000 → 60-80
      	if = {
      		limit = { var:tv_diplomatic_victory_points >= 1000 }
      		set_variable = { name = tv_diplomatic_progress_pct value = var:tv_diplomatic_victory_points }
      		change_variable = { name = tv_diplomatic_progress_pct subtract = 1000 }
      		change_variable = { name = tv_diplomatic_progress_pct multiply = 20 }
      		change_variable = { name = tv_diplomatic_progress_pct divide = 4000 }
      		change_variable = { name = tv_diplomatic_progress_pct add = 60 }
      	}
      	# Seg 5: 5000-20000 → 80-100
      	if = {
      		limit = { var:tv_diplomatic_victory_points >= 5000 }
      		set_variable = { name = tv_diplomatic_progress_pct value = var:tv_diplomatic_victory_points }
      		change_variable = { name = tv_diplomatic_progress_pct subtract = 5000 }
      		change_variable = { name = tv_diplomatic_progress_pct multiply = 20 }
      		change_variable = { name = tv_diplomatic_progress_pct divide = 15000 }
      		change_variable = { name = tv_diplomatic_progress_pct add = 80 }
      	}
      	if = { limit = { var:tv_diplomatic_progress_pct > 100 } set_variable = { name = tv_diplomatic_progress_pct value = 100 } }
      }

    extra_loc_keys: []

    loc:
      title:
        en: "Diplomatic Victory"
        zh: "外交胜利"
      description:
        en: "War leaves only widows and ruins. True power is the art of making every throne your [alliance|e] partner, every border your [guarantee|e], and every prince your debtor."
        zh: "战争留下的只有孤寡与废墟。真正的权力，是让每一座王座成为你的[alliance|e]伙伴，每一道边境成为你的[guarantee|e]，每一位王公成为你的债务人。"
      flavor:
        en: '"An army is of little use where reason fails."'
        zh: '"在理性失败之处，军随谓少用。"'
      overview_card:
        title:
          en: "[tv_diplomatic_victory|E]：Every Treaty Turns Toward Us"
          zh: "[tv_diplomatic_victory|E]：每份条约都转向我们"
        playstyle:
          en: "Playstyle: establish the alliance, raise alliance tier, and make other thrones depend on your guarantees, assemblies, and diplomatic timing."
          zh: "玩法风格：建立联盟、提升联盟等级，并让诸王座依赖你的保障、议会与外交时机。"
        formula:
          en: "Progress formula: [tv_diplomatic_victory_points|e] comes from monthly [tv_alliance_tier|e] output after [tv_diplomatic_alliance|e] membership: the alliance leader gains the full current tier, while non-leader members gain half; victory progress is the current milestone segment's linear share, capped at 100%."
          zh: "进程公式：[tv_diplomatic_victory_points|e]来自加入[tv_diplomatic_alliance|e]后每月的[tv_alliance_tier|e]产出：联盟领袖获得完整当前等级，非领袖成员获得一半；胜利进度按当前里程碑段线性折算，上限100%。"
      progress_display:
        en: "[tv_diplomatic_victory_points|e]: [Country.MakeScope.GetVariable('tv_diplomatic_victory_points').GetValue|0] / 20000"
        zh: "[tv_diplomatic_victory_points|e]：[Country.MakeScope.GetVariable('tv_diplomatic_victory_points').GetValue|0] / 20000"

    milestones:
      - n: 1
        is_short_term: false
        is_long_term: false
        threshold: 1
        unlock_body: null
        reward_options:
          - modifier:
              diplomatic_reputation: 2
          - modifier:
              improve_relation_impact: 0.20
          - modifier:
              spy_network_construction: 0.20
        loc:
          title:
            en: "Diplomatic Victory — Milestone 1"
            zh: "外交胜利 — 里程碑一"
          meaning:
            en: "The [tv_diplomatic_alliance|e] has taken formal shape. A voice that carries weight in the courts of nations."
            zh: "[tv_diplomatic_alliance|e]已经正式成形。一个在各国宫廷中具有分量的声音。"
          trigger_desc:
            en: "[tv_diplomatic_victory_points|e] ≥ 1"
            zh: "[tv_diplomatic_victory_points|e] ≥ 1"
          event_title:
            en: "[tv_diplomatic_victory|E]：A Voice Among Nations"
            zh: "[tv_diplomatic_victory|E]：外交展露头角"
          event_desc:
            en: "Our patient diplomacy has begun to bear fruit in the only form that matters: institutions other courts must answer. Through [alliance|e]s, [royal_marriage|e]s, promises, dinners, condolences, and carefully timed silences, we have earned a place at the table of [great_power|e]s. The first stones of the [tv_diplomatic_alliance|E] are not stones at all, but signatures, witnesses, and shared risk. Enemies will call it intrigue; friends will call it order. Both will be correct enough."
            zh: "我们耐心的外交终于以唯一真正重要的形式结果：一种其他宫廷必须回应的制度。通过[alliance|e]、[royal_marriage|e]、承诺、宴席、吊唁与恰到好处的沉默，我们在[great_power|e]的桌前赢得了一席之地。[tv_diplomatic_alliance|E]的第一批基石并非石料，而是签名、见证人与共同承担的风险。敌人会称之为阴谋，朋友会称之为秩序。两者都不算全错。"
          event_option:
            en: "Seal friendship until it hardens into policy."
            zh: "把友谊盖上印，直到它凝固为政策。"

      - n: 2
        is_short_term: false
        is_long_term: false
        threshold: 100
        extra_trigger_block: null
        reward_options:
          - modifier:
              diplomatic_capacity_modifier: 0.25
          - modifier:
              monthly_diplomats: 0.10
          - modifier:
              diplomatic_spending_cost: -0.01
        loc:
          title:
            en: "Diplomatic Victory — Milestone 2"
            zh: "外交胜利 — 里程碑二"
          meaning:
            en: "100 [tv_diplomatic_victory_points|e]. A reliable ally — princes seek your [guarantee|e] before they seek your sword."
            zh: "100 [tv_diplomatic_victory_points|e]。可靠的盟友——王公们在索求你的刀剑之前，先寻求你的[guarantee|e]。"
          trigger_desc:
            en: "[tv_diplomatic_victory_points|e] ≥ 100"
            zh: "[tv_diplomatic_victory_points|e] ≥ 100"
          event_title:
            en: "[tv_diplomatic_victory|E]：A Reliable Ally"
            zh: "[tv_diplomatic_victory|E]：可靠的盟友"
          event_desc:
            en: "Nations now seek us out as [guarantee|e]ors and partners before crisis forces their hand. They have learned that our promises are not decorative phrases kept for weddings and coronations, but tools that survive bad weather. In council chambers abroad, our name is spoken when borders shake, debts sour, and dynastic tempers rise. The [tv_diplomatic_alliance|E] has begun to develop habits of trust, and those habits raise [tv_alliance_tier|E] more surely than grand speeches. Reputation purchased with coin is spent quickly. Reputation earned by arriving when expected becomes a kind of fortress."
            zh: "各国如今会在危机迫使他们行动之前，主动把我们视为[guarantee|e]人与伙伴。他们已经明白，我们的承诺不是婚礼和加冕礼上用来装饰的辞藻，而是能经受坏天气的工具。在异国议事厅中，当边界动摇、债务发酸、王朝怒气上升时，人们会提起我们的名字。[tv_diplomatic_alliance|E]已经开始形成信任的习惯，而这种习惯比盛大演说更可靠地提升[tv_alliance_tier|E]。用金钱买来的声望花得很快。按时到场换来的声望，则会变成一种堡垒。"
          event_option:
            en: "Let reliability become our herald."
            zh: "让可靠成为我们的传令官。"

      - n: 3
        is_short_term: true
        is_long_term: false
        threshold: 1000
        extra_trigger_block: null
        reward_options:
          - modifier:
              diplomatic_range: 1000
          - modifier:
              trade_range: 1000
          - modifier:
              colonial_range: 1000
        loc:
          title:
            en: "Diplomatic Victory — Short-term Victory"
            zh: "外交胜利 — 短期胜利"
          meaning:
            en: "1,000 [tv_diplomatic_victory_points|e]. A power of the first diplomatic rank — [treaty|e]s bear your seal. Short-term Victory."
            zh: "1,000 [tv_diplomatic_victory_points|e]。一流外交大国——[treaty|e]上盖有你的印签。短期胜利。"
          trigger_desc:
            en: "[tv_diplomatic_victory_points|e] ≥ 1,000"
            zh: "[tv_diplomatic_victory_points|e] ≥ 1,000"
          event_title:
            en: "[tv_diplomatic_victory|E]：A Power of the First Rank — Short-term Victory"
            zh: "[tv_diplomatic_victory|E]：一流外交大国 — 短期胜利"
          event_desc:
            en: "Our diplomatic reach now extends across continents, carried by couriers, marriage lines, resident envoys, and debts of gratitude no ledger can quite capture. [treaty|e]s bear our seal because our seal has become useful to those who fear isolation. [diplomat|e]s from distant courts seek our counsel not out of courtesy, but because they suspect decisions made without us may not survive contact with reality. This is the short-term height of [tv_diplomatic_victory|E]: a state whose approval has become part of the machinery of peace. The [tv_diplomatic_alliance|E] gives that machinery a chamber, a voice, and a memory. When we speak now, others do not merely listen; they adjust."
            zh: "我们的外交触角如今已覆盖大陆，由信使、婚姻线、常驻使节，以及账册无法完全记录的人情债共同承载。[treaty|e]上盖有我们的印签，是因为我们的印签对害怕孤立的人变得有用。远方宫廷的[diplomat|e]寻求我们的建言，并非出于礼貌，而是因为他们怀疑没有我们参与的决定经不起现实触碰。这是[tv_diplomatic_victory|E]的短期高点：一个其认可已成为和平机器组成部分的国家。[tv_diplomatic_alliance|E]则为这台机器提供房间、声音与记忆。如今我们说话时，别人不只是倾听；他们会调整姿态。"
          event_option:
            en: "Speak softly enough that everyone leans in."
            zh: "轻声开口，让所有人都不得不倾身来听。"

      - n: 4
        is_short_term: false
        is_long_term: false
        threshold: 5000
        extra_trigger_block: null
        reward_options:
          - modifier:
              subject_loyalty: 10
          - modifier:
              subject_income_modifier: 0.05
          - modifier:
              subject_opinions: 10
        loc:
          title:
            en: "Diplomatic Victory — Milestone 4"
            zh: "外交胜利 — 里程碑四"
          meaning:
            en: "5,000 [tv_diplomatic_victory_points|e]. The arbiter of international order — no quarrel is settled without your consent."
            zh: "5,000 [tv_diplomatic_victory_points|e]。国际秩序的仲裁人——没有任何争端能绕开你的同意而得到解决。"
          trigger_desc:
            en: "[tv_diplomatic_victory_points|e] ≥ 5,000"
            zh: "[tv_diplomatic_victory_points|e] ≥ 5,000"
          event_title:
            en: "[tv_diplomatic_victory|E]：Arbiter of Nations"
            zh: "[tv_diplomatic_victory|E]：万国仲裁人"
          event_desc:
            en: "No quarrel between princes now settles cleanly without our consent. Our [subject|e]s remain loyal because they see the shelter our name provides, and our [alliance|e] partners remain numerous because they have learned that proximity to us changes the odds of every negotiation. Petitions arrive from courts that once ignored our envoys, each one asking us to bless, delay, condemn, or quietly tolerate some arrangement. The [tv_alliance_tier|E] has risen high enough that procedure itself begins to serve our influence. We do not need to shout over Europe, Asia, Africa, or the seas; a pause from us can be louder than another ruler's army. The age has many crowns, but fewer and fewer settlements proceed without our shadow crossing the parchment."
            zh: "如今，没有任何王公纷争能够在绕过我们同意的情况下干净地收场。我们的[subject|e]保持忠诚，因为他们看见了我们名号所提供的庇护；我们的[alliance|e]伙伴众多，因为他们学会了靠近我们会改变每一次谈判的胜算。请愿书从那些曾无视我国使节的宫廷送来，每一封都请求我们祝准、拖延、谴责，或安静地容忍某项安排。[tv_alliance_tier|E]已经高到连程序本身都开始服务于我们的影响力。我们不必向欧亚非或海洋大声喊话；我们的一次停顿，就能比另一位统治者的军队更响亮。这个时代仍有许多王冠，但越来越少的和约能在没有我们阴影掠过羊皮纸的情况下成立。"
          event_option:
            en: "Let peace wait upon our signature."
            zh: "让和平等待我们的签名。"

      - n: 5
        is_short_term: false
        is_long_term: true
        threshold: 20000
        extra_trigger_block: null
        reward_options:
          - modifier:
              diplomatic_reputation: 10
          - modifier:
              improve_relation_impact: 1.00
          - modifier:
              spy_network_construction: 1.00
        loc:
          title:
            en: "Diplomatic Victory — Long-term Victory"
            zh: "外交胜利 — 长期胜利"
          meaning:
            en: "20,000 [tv_diplomatic_victory_points|e]. Undisputed diplomatic hegemon — the web of [alliance|e]s and [royal_marriage|e]s is yours alone. Long-term Victory."
            zh: "20,000 [tv_diplomatic_victory_points|e]。无可争议的外交霸主——[alliance|e]与[royal_marriage|e]交织的大网唯你独有。长期胜利。"
          trigger_desc:
            en: "[tv_diplomatic_victory_points|e] ≥ 20,000"
            zh: "[tv_diplomatic_victory_points|e] ≥ 20,000"
          event_title:
            en: "[tv_diplomatic_victory|E]：Long-term Victory — Diplomatic Hegemon"
            zh: "[tv_diplomatic_victory|E]：长期胜利 — 外交霸主"
          event_desc:
            en: "Twenty thousand [tv_dvp|E] now stand behind our name like witnesses in a grand hall. No nation in history has woven so vast a web of [alliance|e]s, [royal_marriage|e]s, mutual [guarantee|e]s, shared procedures, and useful obligations. Some empires make silence by burning cities; we have made silence by convincing cities that speaking through us is safer. The [tv_diplomatic_alliance|E] no longer looks like a project, but like an international habit. Rivals may resent it, but they schedule their resentment around our congresses, marriages, and letters. This is [tv_diplomatic_victory|E] fulfilled: not the absence of conflict, but the presence of our hand on every conflict that matters."
            zh: "两万点[tv_dvp|E]如今像大厅中的见证人一样站在我们的名字背后。史上从未有任何国家编织过如此广大的[alliance|e]、[royal_marriage|e]、互保[guarantee|e]、共同程序与有用义务之网。有些帝国通过焚烧城市制造沉默；我们则让城市相信，经由我们发声更为安全，于是制造了沉默。[tv_diplomatic_alliance|E]不再像一个计划，而像一种国际习惯。竞争者也许憎恨它，却会围绕我们的会议、婚姻与书信安排自己的憎恨。这就是[tv_diplomatic_victory|E]的完成：并非冲突消失，而是每一场重要冲突上都有我们的手。"
          event_option:
            en: "Let the chancelleries write around us."
            zh: "让各国文书厅围绕我们落笔。"

  # ── CULTURAL ──────────────────────────────────────────────────────────────
  - id: cultural
    score_var: tv_cultural_influence_points
    gui:
      order: 4
      tab_label:
        en: "Cultural"
        zh: "文化"
      icon: "gfx/interface/icons/towards_victory/victory_paths/tv_victory_cultural.dds"
      progress_style: progress_bar_green_alt
    call_updater_in_checker: false     # accumulated via on_action, no updater effect
    score_var_init_in_checker: false   # monthly_country_pulse always initializes it

    score_updater_body: null

    progress_pct_body: |
      # ── Cultural Victory ──────────────────────────────────────────────────────
      # piecewise progress: each milestone band contributes 20%
      if = {
      	limit = {
      		custom_tooltip = {
      			text = TV_HAS_CULTURAL_INFLUENCE_POINTS_TT
      			has_variable = tv_cultural_influence_points
      		}
      	}
      	# Seg 1: 0–50 → 0–20
      	set_variable = { name = tv_cultural_progress_pct value = var:tv_cultural_influence_points }
      	change_variable = { name = tv_cultural_progress_pct multiply = 20 }
      	change_variable = { name = tv_cultural_progress_pct divide = 50 }
      	# Seg 2: 50–200 → 20–40
      	if = {
      		limit = { var:tv_cultural_influence_points >= 50 }
      		set_variable = { name = tv_cultural_progress_pct value = var:tv_cultural_influence_points }
      		change_variable = { name = tv_cultural_progress_pct subtract = 50 }
      		change_variable = { name = tv_cultural_progress_pct multiply = 20 }
      		change_variable = { name = tv_cultural_progress_pct divide = 150 }
      		change_variable = { name = tv_cultural_progress_pct add = 20 }
      	}
      	# Seg 3: 200–400 → 40–60
      	if = {
      		limit = { var:tv_cultural_influence_points >= 200 }
      		set_variable = { name = tv_cultural_progress_pct value = var:tv_cultural_influence_points }
      		change_variable = { name = tv_cultural_progress_pct subtract = 200 }
      		change_variable = { name = tv_cultural_progress_pct multiply = 20 }
      		change_variable = { name = tv_cultural_progress_pct divide = 200 }
      		change_variable = { name = tv_cultural_progress_pct add = 40 }
      	}
      	# Seg 4: 400–800 → 60–80
      	if = {
      		limit = { var:tv_cultural_influence_points >= 400 }
      		set_variable = { name = tv_cultural_progress_pct value = var:tv_cultural_influence_points }
      		change_variable = { name = tv_cultural_progress_pct subtract = 400 }
      		change_variable = { name = tv_cultural_progress_pct multiply = 20 }
      		change_variable = { name = tv_cultural_progress_pct divide = 400 }
      		change_variable = { name = tv_cultural_progress_pct add = 60 }
      	}
      	# Seg 5: 800–1600 → 80–100
      	if = {
      		limit = { var:tv_cultural_influence_points >= 800 }
      		set_variable = { name = tv_cultural_progress_pct value = var:tv_cultural_influence_points }
      		change_variable = { name = tv_cultural_progress_pct subtract = 800 }
      		change_variable = { name = tv_cultural_progress_pct multiply = 20 }
      		change_variable = { name = tv_cultural_progress_pct divide = 800 }
      		change_variable = { name = tv_cultural_progress_pct add = 80 }
      	}
      	if = { limit = { var:tv_cultural_progress_pct > 100 } set_variable = { name = tv_cultural_progress_pct value = 100 } }
      }

    extra_loc_keys: []

    loc:
      title:
        en: "Cultural Victory"
        zh: "文化胜利"
      description:
        en: "Empires rise and crumble, but great art endures. Let your court be the envy of princes, your [artist|e]s the voice of an age, and your culture outlast every conqueror."
        zh: "帝国兴衰更迭，而伟大的艺术永世长存。让你的宫廷令王公嫉羡，让你的[artist|e]成为一个时代的声音，让你的文明超越每一位征服者。"
      flavor:
        en: '"Art is the signature of civilisations."'
        zh: '"艺术是文明的印记。"'
      overview_card:
        title:
          en: "[tv_cultural_victory|E]：The Court Becomes an Age"
          zh: "[tv_cultural_victory|E]：宫廷成为时代"
        playstyle:
          en: "Playstyle: patronize [artist|e]s, create [work_of_art|e]s, tour abroad, and turn admiration into durable cultural gravity."
          zh: "玩法风格：赞助[artist|e]、创作[work_of_art|e]、组织海外巡演，把仰慕转化为持久的文化引力。"
        formula:
          en: "Progress formula: [tv_cultural_influence_points|e] gains +3 per created [work_of_art|e]; victory progress is the current milestone segment's linear share, capped at 100%. Milestones 2-5 also require rising [tv_arts_intl_influence|e]."
          zh: "进程公式：每创作一件[work_of_art|e]获得+3[tv_cultural_influence_points|e]；胜利进度按当前里程碑段线性折算，上限100%。第2-5里程碑还要求逐步提升[tv_arts_intl_influence|e]。"
      progress_display:
        en: "[tv_cultural_influence_points|e]: [Country.MakeScope.GetVariable('tv_cultural_influence_points').GetValue|0] / 1600"
        zh: "[tv_cultural_influence_points|e]：[Country.MakeScope.GetVariable('tv_cultural_influence_points').GetValue|0] / 1600"

    milestones:
      - n: 1
        is_short_term: false
        is_long_term: false
        threshold: 50
        extra_trigger_block: null
        reward_options:
          - modifier:
              num_possible_artists: 1
          - modifier:
              artist_salary_modifier: -0.10
          - modifier:
              hire_artist_cost_modifier: -0.50
        unlock_body: null
        loc:
          title:
            en: "Cultural Victory — Milestone 1"
            zh: "文化胜利 — 里程碑1"
          meaning:
            en: "50 [tv_cultural_influence_points|e]. Your court draws its first [artist|e]s and patrons — a cultural legacy begins."
            zh: "50 [tv_cultural_influence_points|e]。你的宫廷吸引了第一批[artist|e]与赞助人——文化遗产由此发轫。"
          trigger_desc:
            en: "[tv_cultural_influence_points|e] ≥ 50"
            zh: "[tv_cultural_influence_points|e] ≥ 50"
          event_title:
            en: "[tv_cultural_victory|E]：A Patron of the Arts"
            zh: "[tv_cultural_victory|E]：艺术赞助人"
          event_desc:
            en: "Our court has begun to attract [artist|e]s, sculptors, singers, translators, and men of letters who can smell patronage before it is announced. The first [work_of_art|e]s commissioned in our name do more than flatter the throne; they give strangers a way to imagine us. A court that once measured itself in marriages and campaigns now finds its reputation carried by pigments, verses, carved stone, and clever gossip. This is the first living breath of [tv_cultural_victory|E]. The [tv_arts_exhibition|E] will turn that breath outward, giving our artists roads, audiences, and rivals worthy of them. Politics may command obedience, but beauty teaches people to desire association."
            zh: "我们的宫廷已经开始吸引[artist|e]、雕塑家、歌者、译者与文人，他们总能在赞助正式宣布之前嗅到它的气味。以我们名义委托的第一批[work_of_art|e]不只是奉承王座；它们让陌生人有了想象我们的方式。一个曾以婚姻和战役衡量自身的宫廷，如今发现自己的名声正由颜料、诗句、雕石与机敏流言携带。这是[tv_cultural_victory|E]的第一口活气。[tv_arts_exhibition|E]会把这口气向外吹送，为我们的艺术家提供道路、观众与配得上他们的竞争者。政治可以命令人服从，美却会教人渴望靠近。"
          event_option:
            en: "Make patronage our softest weapon."
            zh: "让赞助成为我们最柔软的武器。"

      - n: 2
        is_short_term: false
        is_long_term: false
        threshold: 200
        extra_trigger_block: |
          custom_tooltip = {
          	text = TV_CULTURAL_M2_EXTRA_TRIGGER_DESC
          	has_variable = tv_arts_exhibition_member
          	any_international_organizations_member_of = {
          		international_organization_type = international_organization_type:tv_arts_exhibition
          		var:tv_arts_intl_influence >= 25
          	}
          }
        reward_options:
          - modifier:
              skill_of_new_artists: 0.10
          - modifier:
              artist_monthly_start_chance: 0.20
          - modifier:
              country_cabinet_efficiency: 0.10
        loc:
          title:
            en: "Cultural Victory — Milestone 2"
            zh: "文化胜利 — 里程碑2"
          meaning:
            en: "200 [tv_cultural_influence_points|e]. A celebrated cultural power — [work_of_art|e]s from your court speak of your greatness."
            zh: "200 [tv_cultural_influence_points|e]。享誉盛名的文化强国——你宫廷中的[work_of_art|e]彰显了你的伟大。"
          trigger_desc:
            en: "[tv_cultural_influence_points|e] ≥ 200"
            zh: "[tv_cultural_influence_points|e] ≥ 200"
          extra_trigger_desc:
            en: "[tv_arts_intl_influence|E] ≥ 25"
            zh: "[tv_arts_intl_influence|E] ≥ 25"
          event_title:
            en: "[tv_cultural_victory|E]：The Renaissance Court"
            zh: "[tv_cultural_victory|E]：文艺复兴宫廷"
          event_desc:
            en: "Word of our court's magnificence has crossed borders more gracefully than any ambassador. Scholars and [artist|e]s seek our patronage because they believe our halls can turn skill into memory, and our [work_of_art|e]s are now praised in places that once knew us only through rumor. The [tv_arts_intl_influence|E] gathered through tours, exhibitions, and cultivated admiration has begun to change the traffic of prestige. Foreign princes ask who painted for us, which poet dined with us, and whether their own courts look provincial by comparison. That question is the real victory. We have made taste political without making it crude."
            zh: "我们宫廷的辉煌跨越边境，比任何使节都更从容。学者与[artist|e]纷纷寻求我们的赞助，因为他们相信我们的厅堂能把技艺变成记忆；我们的[work_of_art|e]如今也在那些过去只通过传闻知晓我们的地方受到称赞。通过巡演、展览与精心培育的赞叹积累起来的[tv_arts_intl_influence|E]，已经开始改变声望的流向。外国王公询问谁曾为我们作画，哪位诗人与我们共宴，以及他们自己的宫廷是否因此显得乡气。这个问题本身就是真正的胜利。我们让品味变得政治化，却没有让它变得粗俗。"
          event_option:
            en: "Let every court compare itself to ours."
            zh: "让每座宫廷都拿自己与我们相比。"

      - n: 3
        is_short_term: true
        is_long_term: false
        threshold: 400
        extra_trigger_block: |
          custom_tooltip = {
          	text = TV_CULTURAL_M3_EXTRA_TRIGGER_DESC
          	has_variable = tv_arts_exhibition_member
          	any_international_organizations_member_of = {
          		international_organization_type = international_organization_type:tv_arts_exhibition
          		var:tv_arts_intl_influence >= 50
          	}
          }
        reward_options:
          - modifier:
              cultural_tradition_modifier: 0.25
          - modifier:
              cultural_influence_modifier: 0.25
          - modifier:
              monthly_prestige: 0.05
        loc:
          title:
            en: "Cultural Victory — Short-term Victory"
            zh: "文化胜利 — 短期胜利"
          meaning:
            en: "400 [tv_cultural_influence_points|e]. A centre of Renaissance brilliance — [artist|e]s from across the world seek your court. Short-term Victory."
            zh: "400 [tv_cultural_influence_points|e]。文艺复兴的璀璨中心——各地[artist|e]慕名而来。短期胜利。"
          trigger_desc:
            en: "[tv_cultural_influence_points|e] ≥ 400"
            zh: "[tv_cultural_influence_points|e] ≥ 400"
          extra_trigger_desc:
            en: "[tv_arts_intl_influence|E] ≥ 50"
            zh: "[tv_arts_intl_influence|E] ≥ 50"
          event_title:
            en: "[tv_cultural_victory|E]：A Centre of Civilisation — Short-term Victory"
            zh: "[tv_cultural_victory|E]：文明中心 — 短期胜利"
          event_desc:
            en: "No court in this age now surpasses ours in the arts, letters, ceremony, and learned conversation. The halls are crowded, but not merely with flatterers; they are crowded with people who believe being seen here changes the value of their work. Our [tv_arts_exhibition|E] gives them a wider world, while our palace gives them a center of gravity. This short-term [tv_cultural_victory|E] will echo because it is not confined to one masterpiece or one festival. It is a style of rule, a rhythm of patronage, a reputation that makes talent travel toward us before soldiers ever need to march. Lesser princes collect ornaments; we are collecting an age."
            zh: "这个时代已经没有任何宫廷能在艺术、文学、典礼与学术谈话上超越我们。厅堂里挤满了人，却不只是奉承者；他们相信在这里被看见，会改变自己作品的价值。我们的[tv_arts_exhibition|E]给他们更广阔的世界，而我们的宫殿则给他们重心。这场短期[tv_cultural_victory|E]之所以会回响，并不是因为某一件杰作或某一场庆典。它是一种统治风格，一种赞助节奏，一种让才华在士兵尚未出发前便主动向我们旅行的名声。平庸王公收藏饰物；我们正在收藏一个时代。"
          event_option:
            en: "Let genius queue at our doors."
            zh: "让天才在我们的门前排队。"

      - n: 4
        is_short_term: false
        is_long_term: false
        threshold: 800
        extra_trigger_block: |
          custom_tooltip = {
          	text = TV_CULTURAL_M4_EXTRA_TRIGGER_DESC
          	has_variable = tv_arts_exhibition_member
          	any_international_organizations_member_of = {
          		international_organization_type = international_organization_type:tv_arts_exhibition
          		var:tv_arts_intl_influence >= 75
          	}
          }
        reward_options:
          - modifier:
              global_pop_assimilation_speed_modifier: 0.50
          - modifier:
              cultures_capacity: 2
          - modifier:
              monthly_rebel_growth: -0.0005
        loc:
          title:
            en: "Cultural Victory — Milestone 4"
            zh: "文化胜利 — 里程碑4"
          meaning:
            en: "800 [tv_cultural_influence_points|e]. [cultural_influence|e] radiates from your court across the world — your [artist|e]s define the age."
            zh: "800 [tv_cultural_influence_points|e]。[cultural_influence|e]从你的宫廷辐射至全世界——你的[artist|e]定义了这个时代。"
          trigger_desc:
            en: "[tv_cultural_influence_points|e] ≥ 800"
            zh: "[tv_cultural_influence_points|e] ≥ 800"
          extra_trigger_desc:
            en: "[tv_arts_intl_influence|E] ≥ 75"
            zh: "[tv_arts_intl_influence|E] ≥ 75"
          event_title:
            en: "[tv_cultural_victory|E]：Light of the World"
            zh: "[tv_cultural_victory|E]：世界之光"
          event_desc:
            en: "Our [cultural_influence|e] has spread far beyond our borders and returned wearing foreign colors. Other nations imitate our fashions, translate our books, quote our critics, and send their finest minds to study under masters who once waited outside our doors. The [tv_arts_intl_influence|E] we have built no longer behaves like a number; it behaves like a weather pattern. Provincial courts alter their ceremonies before our envoys arrive, fearing the quiet shame of seeming old-fashioned. Even our enemies borrow our language when they wish to sound civilized. The world looks to us as the arbiter of taste, and arbitration is power by another name."
            zh: "我们的[cultural_influence|e]早已越过国界，又披着异国颜色返回。他国模仿我们的风尚，翻译我们的书籍，引用我们的评论，把最优秀的才智送到那些曾在我们门外等待的大师门下学习。我们积累的[tv_arts_intl_influence|E]已不再像一个数字，而像一种天气。偏远宫廷在我国使节抵达前便修改典礼，害怕显得落伍所带来的安静羞耻。甚至敌人在想显得文明时，也会借用我们的语言。世界将我们视为品味的仲裁者，而仲裁不过是另一种权力。"
          event_option:
            en: "Set the fashion, then let others chase it."
            zh: "先定下风尚，再让别人追赶。"

