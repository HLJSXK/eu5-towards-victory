            zh: "学问中心 — 短期胜利"
          event_desc:
            en: "No nation rivals our command of the sciences and arts of governance. Two hundred advances — a short-term scientific victory that marks us as the intellectual power of our age."
            zh: "没有任何国家能与我们在科学与治理之道上的造诣相抗衡。两百项技艺——一个短期科技胜利，标志着我们已成为这个时代的智识强国。"
          event_option:
            en: "Reason and inquiry shall carry us forward."
            zh: "理性与探究将引领我们继续前行。"

      - n: 4
        is_short_term: false
        is_long_term: false
        threshold: 300
