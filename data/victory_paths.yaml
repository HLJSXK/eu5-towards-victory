            zh: "贸易胜利 — 短期胜利"
          meaning:
            en: "A great [trade|e] empire, our name known in every counting house. Short-term Victory. Monthly [trade_income|e] ~400."
            zh: "一个伟大的[trade|e]帝国，名字广为人知。短期胜利。每月[trade_income|e]约400。"
          trigger_desc:
            en: "[tv_trade_score|e] ≥ 400"
            zh: "[tv_trade_score|e] ≥ 400"
          event_title:
