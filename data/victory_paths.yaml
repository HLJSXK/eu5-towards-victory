# data/victory_paths.yaml
# Single source of truth for all Towards Victory victory path data.
# Regenerate all 13 game files with:
#   conda run --no-capture-output -n eu5 python scripts/gen_victory.py
#
# 1对1原则: Each field maps directly to one piece of generated output.
# Complex EU5 script bodies are stored verbatim (multiline strings); the generator
# inserts them unchanged. Simple repetitive blocks use Python templates.
#
# Do NOT hand-edit the generated files — edit this YAML and re-run gen_victory.py.

# ─────────────────────────────────────────────────────────────────────────────
# SHARED — written to both localization files
# ─────────────────────────────────────────────────────────────────────────────
shared:
  situation_name:
    en: "Towards Victory"
    zh: "胜利条件"
  situation_desc:
    en: "Track your progress across six distinct victory paths."
    zh: "追踪您在六条胜利路径上的进度。"
  situation_title:
    en: "Victory Progress"
    zh: "胜利进度"
  tooltip_conditions_header:
    en: "Required Conditions"
    zh: "达成条件"
  tooltip_rewards_header:
    en: "Milestone Reward"
    zh: "里程碑奖励"
  milestone_labels:
    1: "1"
    2: "2"
    3: "V1"
    4: "4"
    5: "V2"

# ─────────────────────────────────────────────────────────────────────────────
# VICTORY PATHS
# ─────────────────────────────────────────────────────────────────────────────
paths:

  # ── CONQUEST ──────────────────────────────────────────────────────────────
  - id: conquest
    score_var: tv_conquest_score
    call_updater_in_checker: true      # true → emit tv_update_{id}_score_effect = yes at top of checker
    score_var_init_in_checker: false   # true → emit extra has_variable init for score_var in checker

    # 1对1: Score updater body — inserted verbatim into tv_update_conquest_score_effect
    score_updater_body: |
      set_variable = { name = tv_conquest_score value = num_locations }
      set_variable = { name = tv_conquest_subj_temp value = 0 }
      every_subject_or_below = {
      	root = {
      		change_variable = { name = tv_conquest_subj_temp add = { value = prev.num_locations } }
      	}
      }
      change_variable = { name = tv_conquest_subj_temp divide = 2 }
      change_variable = { name = tv_conquest_score add = var:tv_conquest_subj_temp }

    # 1对1: Progress pct body — inserted verbatim into tv_update_all_progress_pct_effect
    progress_pct_body: |
      # ── Conquest Victory ─────────────────────────────────────────────────────
      # piecewise: thresholds 150/300/500/1000/2000 → each milestone = +20%
      if = {
      	limit = { has_variable = tv_conquest_score }
      	# Seg 1: 0–150 → 0–20
      	set_variable = { name = tv_conquest_progress_pct value = var:tv_conquest_score }
      	change_variable = { name = tv_conquest_progress_pct multiply = 20 }
      	change_variable = { name = tv_conquest_progress_pct divide = 150 }
      	# Seg 2: 150–300 → 20–40
      	if = {
      		limit = { var:tv_conquest_score >= 150 }
      		set_variable = { name = tv_conquest_progress_pct value = var:tv_conquest_score }
      		change_variable = { name = tv_conquest_progress_pct subtract = 150 }
      		change_variable = { name = tv_conquest_progress_pct multiply = 20 }
      		change_variable = { name = tv_conquest_progress_pct divide = 150 }
      		change_variable = { name = tv_conquest_progress_pct add = 20 }
      	}
      	# Seg 3: 300–500 → 40–60
      	if = {
      		limit = { var:tv_conquest_score >= 300 }
      		set_variable = { name = tv_conquest_progress_pct value = var:tv_conquest_score }
      		change_variable = { name = tv_conquest_progress_pct subtract = 300 }
      		change_variable = { name = tv_conquest_progress_pct multiply = 20 }
      		change_variable = { name = tv_conquest_progress_pct divide = 200 }
      		change_variable = { name = tv_conquest_progress_pct add = 40 }
      	}
      	# Seg 4: 500–1000 → 60–80
      	if = {
      		limit = { var:tv_conquest_score >= 500 }
      		set_variable = { name = tv_conquest_progress_pct value = var:tv_conquest_score }
      		change_variable = { name = tv_conquest_progress_pct subtract = 500 }
      		change_variable = { name = tv_conquest_progress_pct multiply = 20 }
      		change_variable = { name = tv_conquest_progress_pct divide = 500 }
      		change_variable = { name = tv_conquest_progress_pct add = 60 }
      	}
      	# Seg 5: 1000–2000 → 80–100
      	if = {
      		limit = { var:tv_conquest_score >= 1000 }
      		set_variable = { name = tv_conquest_progress_pct value = var:tv_conquest_score }
      		change_variable = { name = tv_conquest_progress_pct subtract = 1000 }
      		change_variable = { name = tv_conquest_progress_pct multiply = 20 }
      		change_variable = { name = tv_conquest_progress_pct divide = 1000 }
      		change_variable = { name = tv_conquest_progress_pct add = 80 }
      	}
      	if = { limit = { var:tv_conquest_progress_pct > 100 } set_variable = { name = tv_conquest_progress_pct value = 100 } }
      }

    extra_loc_keys: []

    loc:
      title:
        en: "Conquest Victory"
        zh: "征服胜利"
      description:
        en: "Dominate the world through territorial expansion."
        zh: "通过领土扩张称霸世界。"
      flavor:
        en: '"The greatest happiness is to vanquish your enemies." — Genghis Khan'
        zh: '"最大的幸福就是征服你的敌人。" — 成吉思汗'
      progress_display:
        en: "[tv_conquest_score|e]: [Country.MakeScope.GetVariable('tv_conquest_score').GetValue|0] / 2,000"
        zh: "[tv_conquest_score|e]：[Country.MakeScope.GetVariable('tv_conquest_score').GetValue|0] / 2,000"

    milestones:
      - n: 1
        is_short_term: false
        is_long_term: false
        threshold: 150
        extra_trigger_block: null
        modifier:
          discipline: 0.05
        modifier_name:
          en: "Seasoned Legions"
          zh: "百炼雄师"
        loc:
          title:
            en: "Conquest Victory — Milestone 1"
            zh: "征服胜利 — 里程碑一"
          meaning:
            en: "A nation of modest reach. ~150 owned locations."
            zh: "初具规模的国家。征服分数约150。"
          trigger_desc:
            en: "[tv_conquest_score|e] ≥ 150"
            zh: "[tv_conquest_score|e] ≥ 150"
          event_title:
            en: "The Empire Grows"
            zh: "帝国正在壮大"
          event_desc:
            en: "Our armies have marched and our banners now fly over territories once beyond reach. With 150 locations under our dominion, the realm is taking shape."
            zh: "我们的军队已经远征，旗帜飘扬在150处领地之上。帝国的轮廓日渐清晰。"
          event_option:
            en: "Let our dominion grow ever wider."
            zh: "让我们的疆域继续扩张。"

      - n: 2
        is_short_term: false
        is_long_term: false
        threshold: 300
        extra_trigger_block: null
        modifier:
          global_manpower_modifier: 0.25
        modifier_name:
          en: "Manpower Surge"
          zh: "兵源汹涌"
        loc:
          title:
            en: "Conquest Victory — Milestone 2"
            zh: "征服胜利 — 里程碑二"
          meaning:
            en: "A substantial empire. ~300 owned locations."
            zh: "幅员辽阔的帝国。征服分数约300。"
          trigger_desc:
            en: "[tv_conquest_score|e] ≥ 300"
            zh: "[tv_conquest_score|e] ≥ 300"
          event_title:
            en: "A Substantial Empire"
            zh: "幅员辽阔的帝国"
          event_desc:
            en: "Our realm now encompasses 300 locations. Supplying our vast armies and reducing the ravages of campaign attrition will be essential to sustaining this empire."
            zh: "我国版图已覆盖300处领地。维持如此广袤的帝国，后勤补给与减少行军损耗至关重要。"
          event_option:
            en: "Our logistics must match our ambition."
            zh: "后勤必须跟上我们的雄心。"

      - n: 3
        is_short_term: true
        is_long_term: false
        threshold: 500
        extra_trigger_block: null
        modifier:
          pop_join_rebel_threshold: -0.05
          monthly_legitimacy: 0.10
          monthly_republican_tradition: 0.10
          monthly_devotion: 0.10
        modifier_name:
          en: "Iron Governance"
          zh: "铁腕治国"
        loc:
          title:
            en: "Conquest Victory — Short-term Victory"
            zh: "征服胜利 — 短期胜利"
          meaning:
            en: "Territorial supremacy secured. Short-term Victory. ~500 owned locations."
            zh: "确立领土霸主地位。短期胜利。征服分数约500。"
          trigger_desc:
            en: "[tv_conquest_score|e] ≥ 500"
            zh: "[tv_conquest_score|e] ≥ 500"
          event_title:
            en: "Territorial Supremacy — Short-term Victory"
            zh: "领土霸权 — 短期胜利"
          event_desc:
            en: "Five hundred locations bow before our flag. This is no mere kingdom — this is an empire. Yet governing so vast a domain demands firm administration and a steady hand."
            zh: "500处领地已向我国旗帜俯首。这已不是王国，这是一个帝国。然而统治如此广袤的疆域，需要严明的治理与坚定的手腕。"
          event_option:
            en: "The realm is ours to govern."
            zh: "这片疆土是我们治理的基业。"

      - n: 4
        is_short_term: false
        is_long_term: false
        threshold: 1000
        extra_trigger_block: null
        modifier:
          global_integration_speed_modifier: 0.25
          annexation_speed_modifier: 0.25
        modifier_name:
          en: "Imperial Absorption"
          zh: "帝国消化"
        loc:
          title:
            en: "Conquest Victory — Milestone 4"
            zh: "征服胜利 — 里程碑四"
          meaning:
            en: "An empire spanning continents. ~1,000 owned locations."
            zh: "横跨大陆的帝国。征服分数约1,000。"
          trigger_desc:
            en: "[tv_conquest_score|e] ≥ 1,000"
            zh: "[tv_conquest_score|e] ≥ 1,000"
          event_title:
            en: "An Empire Spanning Continents"
            zh: "横跨大陆的帝国"
          event_desc:
            en: "Over a thousand locations have fallen under our sway. The world watches. To hold what we have seized, we must project power with discipline and sustain our armies across every front."
            zh: "超过千处领地已臣服于我们的统治。全世界都在注视。守住已征服之地，需要铁的纪律与强大的后勤。"
          event_option:
            en: "We shall hold what we have conquered."
            zh: "我们将守护所征服的一切。"

      - n: 5
        is_short_term: false
        is_long_term: true
        threshold: 2000
        extra_trigger_block: null
        modifier:
          global_war_score_efficiency: 0.5
          siege_ability: 0.5
        modifier_name:
          en: "Unstoppable Tide"
          zh: "势如破竹"
        loc:
          title:
            en: "Conquest Victory — Long-term Victory"
            zh: "征服胜利 — 长期胜利"
          meaning:
            en: "Undisputed world empire. Long-term Victory. ~2,000 owned locations."
            zh: "无可争议的世界帝国。长期胜利。征服分数约2,000。"
          trigger_desc:
            en: "[tv_conquest_score|e] ≥ 2,000"
            zh: "[tv_conquest_score|e] ≥ 2,000"
          event_title:
            en: "Long-term Victory — World Empire"
            zh: "长期胜利 — 世界帝国"
          event_desc:
            en: "Two thousand locations. No empire in recorded history has claimed so much of the known world. Our legacy is written not in ink but in the march of armies and the raising of banners."
            zh: "两千处领地。有史以来，从未有任何帝国掌控过如此广阔的疆土。我们的功业不书于纸，而铭刻于万里征途与猎猎旌旗之中。"
          event_option:
            en: "Our name shall echo through the ages."
            zh: "我们的名字将永垂青史。"

  # ── PROSPERITY ────────────────────────────────────────────────────────────
  - id: prosperity
    score_var: tv_prosperity_score
    call_updater_in_checker: false     # updater called separately in situation (expensive)
    score_var_init_in_checker: false

    score_updater_body: |
      # 1. 计数领地
      set_variable = { name = tv_num_locs value = 0 }
      every_owned_location = {
      	root = { change_variable = { name = tv_num_locs add = 1 } }
      }
      # 2. 累加总量：total_pop + Σdev + tax_base
      set_variable = { name = tv_raw_score value = total_population }
      set_variable = { name = tv_sum_dev value = 0 }
      every_owned_location = {
      	root = { change_variable = { name = tv_sum_dev add = prev.development } }
      }
      change_variable = { name = tv_raw_score add = var:tv_sum_dev }
      change_variable = { name = tv_raw_score add = country_tax_base }
      # 3. base_score = raw × 100 / (N + 100)  递减规模惩罚
      set_variable = { name = tv_denom value = var:tv_num_locs }
      change_variable = { name = tv_denom add = 100 }
      change_variable = { name = tv_raw_score multiply = 100 }
      change_variable = { name = tv_raw_score divide = var:tv_denom }
      set_variable = { name = tv_prosperity_score value = var:tv_raw_score }
      # 4. 稳定度乘数：× (100 + stability) / 100
      set_variable = { name = tv_stab_factor value = stability }
      change_variable = { name = tv_stab_factor add = 100 }
      change_variable = { name = tv_prosperity_score multiply = var:tv_stab_factor }
      change_variable = { name = tv_prosperity_score divide = 100 }
      # 5. 政体权力乘数（君主=合法性，共和=传统，等）
      if = {
      	limit = { government_type = government_type:monarchy }
      	set_variable = { name = tv_gov_power value = legitimacy }
      	change_variable = { name = tv_prosperity_score multiply = var:tv_gov_power }
      	change_variable = { name = tv_prosperity_score divide = 100 }
      }
      else_if = {
      	limit = { government_type = government_type:republic }
      	set_variable = { name = tv_gov_power value = republican_tradition }
      	change_variable = { name = tv_prosperity_score multiply = var:tv_gov_power }
      	change_variable = { name = tv_prosperity_score divide = 100 }
      }
      else_if = {
      	limit = { government_type = government_type:theocracy }
      	set_variable = { name = tv_gov_power value = devotion }
      	change_variable = { name = tv_prosperity_score multiply = var:tv_gov_power }
      	change_variable = { name = tv_prosperity_score divide = 100 }
      }
      else_if = {
      	limit = { government_type = government_type:tribe }
      	set_variable = { name = tv_gov_power value = tribal_cohesion }
      	change_variable = { name = tv_prosperity_score multiply = var:tv_gov_power }
      	change_variable = { name = tv_prosperity_score divide = 100 }
      }
      else_if = {
      	limit = { government_type = government_type:steppe_horde }
      	set_variable = { name = tv_gov_power value = horde_unity }
      	change_variable = { name = tv_prosperity_score multiply = var:tv_gov_power }
      	change_variable = { name = tv_prosperity_score divide = 100 }
      }

    progress_pct_body: |
      # ── Prosperity Victory ────────────────────────────────────────────────────
      # piecewise: thresholds 5000/8000/12000/18000/25000 → each milestone = +20%
      if = {
      	limit = { has_variable = tv_prosperity_score }
      	# Seg 1: 0–5000 → 0–20
      	set_variable = { name = tv_prosperity_progress_pct value = var:tv_prosperity_score }
      	change_variable = { name = tv_prosperity_progress_pct multiply = 20 }
      	change_variable = { name = tv_prosperity_progress_pct divide = 5000 }
      	# Seg 2: 5000–8000 → 20–40
      	if = {
      		limit = { var:tv_prosperity_score >= 5000 }
      		set_variable = { name = tv_prosperity_progress_pct value = var:tv_prosperity_score }
      		change_variable = { name = tv_prosperity_progress_pct subtract = 5000 }
      		change_variable = { name = tv_prosperity_progress_pct multiply = 20 }
      		change_variable = { name = tv_prosperity_progress_pct divide = 3000 }
      		change_variable = { name = tv_prosperity_progress_pct add = 20 }
      	}
      	# Seg 3: 8000–12000 → 40–60
      	if = {
      		limit = { var:tv_prosperity_score >= 8000 }
      		set_variable = { name = tv_prosperity_progress_pct value = var:tv_prosperity_score }
      		change_variable = { name = tv_prosperity_progress_pct subtract = 8000 }
      		change_variable = { name = tv_prosperity_progress_pct multiply = 20 }
      		change_variable = { name = tv_prosperity_progress_pct divide = 4000 }
      		change_variable = { name = tv_prosperity_progress_pct add = 40 }
      	}
      	# Seg 4: 12000–18000 → 60–80
      	if = {
      		limit = { var:tv_prosperity_score >= 12000 }
      		set_variable = { name = tv_prosperity_progress_pct value = var:tv_prosperity_score }
      		change_variable = { name = tv_prosperity_progress_pct subtract = 12000 }
      		change_variable = { name = tv_prosperity_progress_pct multiply = 20 }
      		change_variable = { name = tv_prosperity_progress_pct divide = 6000 }
      		change_variable = { name = tv_prosperity_progress_pct add = 60 }
      	}
      	# Seg 5: 18000–25000 → 80–100
      	if = {
      		limit = { var:tv_prosperity_score >= 18000 }
      		set_variable = { name = tv_prosperity_progress_pct value = var:tv_prosperity_score }
      		change_variable = { name = tv_prosperity_progress_pct subtract = 18000 }
      		change_variable = { name = tv_prosperity_progress_pct multiply = 20 }
      		change_variable = { name = tv_prosperity_progress_pct divide = 7000 }
      		change_variable = { name = tv_prosperity_progress_pct add = 80 }
      	}
      	if = { limit = { var:tv_prosperity_progress_pct > 100 } set_variable = { name = tv_prosperity_progress_pct value = 100 } }
      }

    extra_loc_keys: []

    loc:
      title:
        en: "Prosperity Victory"
        zh: "繁荣胜利"
      description:
        en: "Build a thriving nation through domestic development."
        zh: "通过国内发展建设一个繁荣的国家。"
      flavor:
        en: '"Prosperity is the fruit of labour." — Thucydides'
        zh: '"繁荣是劳动的果实。" — 修昔底德'
      progress_display:
        en: "[tv_prosperity_score|e]: [Country.MakeScope.GetVariable('tv_prosperity_score').GetValue|0] / 25,000"
        zh: "[tv_prosperity_score|e]：[Country.MakeScope.GetVariable('tv_prosperity_score').GetValue|0] / 25,000"

    milestones:
      - n: 1
        is_short_term: false
        is_long_term: false
        threshold: 5000
        extra_trigger_block: null
        modifier:
          global_monthly_prosperity: 0.001
        modifier_name:
          en: "Steady Prosperity"
          zh: "稳步繁荣"
        loc:
          title:
            en: "Prosperity Victory — Milestone 1"
            zh: "繁荣胜利 — 里程碑一"
          meaning:
            en: "A growing nation — early domestic prosperity. Score ~5,000."
            zh: "蓬勃发展的国家 — 国内繁荣初现。分数约5,000。"
          trigger_desc:
            en: "[tv_prosperity_score|e] ≥ 5,000"
            zh: "[tv_prosperity_score|e] ≥ 5,000"
          event_title:
            en: "A Nation Begins to Thrive"
            zh: "国家开始兴旺"
          event_desc:
            en: "Our people are prospering. Farms yield more, towns bustle with commerce, and the realm's foundations grow stronger with each passing year."
            zh: "我们的人民正在繁荣。农田收成更丰，城镇商贸兴盛，国家的根基日益稳固。"
          event_option:
            en: "Let our prosperity continue to grow."
            zh: "愿我们的繁荣持续增长。"

      - n: 2
        is_short_term: false
        is_long_term: false
        threshold: 8000
        extra_trigger_block: null
        modifier:
          global_population_growth: 0.001
        modifier_name:
          en: "Growing Population"
          zh: "人口滋长"
        loc:
          title:
            en: "Prosperity Victory — Milestone 2"
            zh: "繁荣胜利 — 里程碑二"
          meaning:
            en: "A flourishing nation — sustained domestic investment. Score ~8,000."
            zh: "兴旺发达的国家 — 持续的国内投入。分数约8,000。"
          trigger_desc:
            en: "[tv_prosperity_score|e] ≥ 8,000"
            zh: "[tv_prosperity_score|e] ≥ 8,000"
          event_title:
            en: "A Flourishing Realm"
            zh: "蓬勃发展的王国"
          event_desc:
            en: "Sustained investment in our lands is bearing fruit. The population swells, buildings rise, and the wealth of the nation is evident to all who enter our borders."
            zh: "对土地的持续投入正在结出硕果。人口增长，建筑林立，国家的财富令所有踏入边境者叹为观止。"
          event_option:
            en: "Our people shall want for nothing."
            zh: "我们的人民将衣食无忧。"

      - n: 3
        is_short_term: true
        is_long_term: false
        threshold: 12000
        extra_trigger_block: null
        modifier:
          global_build_buildings_cost: -0.25
          city_upgrade_cost_modifier: -0.25
          town_upgrade_cost_modifier: -0.25
          rural_settlement_upgrade_cost_modifier: -0.25
        modifier_name:
          en: "Builder's Economy"
          zh: "建设经济"
        loc:
          title:
            en: "Prosperity Victory — Short-term Victory"
            zh: "繁荣胜利 — 短期胜利"
          meaning:
            en: "A prosperous heartland. Short-term Victory. Score ~12,000."
            zh: "繁荣的腹地。短期胜利。分数约12,000。"
          trigger_desc:
            en: "[tv_prosperity_score|e] ≥ 12,000"
            zh: "[tv_prosperity_score|e] ≥ 12,000"
          event_title:
            en: "Prosperity Victory — The Heartland Thrives"
            zh: "繁荣胜利 — 腹地蓬勃兴盛"
          event_desc:
            en: "Our realm has achieved a level of domestic prosperity that few nations ever reach. The combination of healthy population, vibrant towns, and well-tended lands marks us as a true short-term victor."
            zh: "我国已实现极少数国家能够企及的内政繁荣水平。健康的人口、活跃的城镇与精心耕耘的土地，使我们成为真正的短期胜利者。"
          event_option:
            en: "Let this prosperity be the foundation of our greatness."
            zh: "愿这份繁荣成为我们伟大的基石。"

      - n: 4
        is_short_term: false
        is_long_term: false
        threshold: 18000
        extra_trigger_block: null
        modifier:
          global_construction_speed: 0.5
