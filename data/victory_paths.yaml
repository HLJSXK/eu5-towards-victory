            zh: "拥抱新思想"
          event_desc:
            en: "Our scholars have absorbed and spread the great institutions of this era. One hundred and fifty advances stand to our name, and foreign thinkers seek the patronage of our court."
            zh: "我们的学者已消化并传播了这个时代的伟大制度。一百五十项技艺以我们的名义立下，外邦思想家纷纷寻求我们宫廷的庇护。"
          event_option:
            en: "Open minds conquer more than armies."
            zh: "开放的心灵胜过千军万马。"

      - n: 3
        is_short_term: true
        is_long_term: false
        threshold: 200
        extra_trigger_block: |
