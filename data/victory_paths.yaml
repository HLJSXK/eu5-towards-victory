      - key: tv_trade_market_dominance_10_tt
        has_version_suffix: true
        en: "Leading [merchant|e] in at least 10 [market|e]s"
        zh: "在至少10个[market|e]中拥有最高贸易优势"

    loc:
      title:
        en: "Trade Victory"
        zh: "贸易胜利"
      description:
        en: "The ledger is mightier than the sword. Command the world's [market|e]s, and let every coin spent in every port find its way to your treasury."
        zh: "账本比刀剑更有力量。掌控天下的[market|e]，让每一个港口流转的钱币，都汇入你的国库。"
      flavor:
        en: '"Venice does not make war; Venice makes money."'
        zh: '"威尼斯不打仗；威尼斯赚钱。"'
      overview_card:
        title:
          en: "[tv_trade_victory|E]：Ledgers Across the Seas"
          zh: "[tv_trade_victory|E]：账册越过海洋"
        playstyle:
          en: "Playstyle: dominate [market|e]s, grow [merchant|e] reach, and convert commercial command into a treasury that wins without marching."
          zh: "玩法风格：主导[market|e]、扩张[merchant|e]网络，把商业控制转化为无需行军也能取胜的国库。"
