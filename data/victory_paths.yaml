            zh: "学者之国"
          event_desc:
            en: "Our universities and academies are beginning to bear fruit. One hundred advances researched — our realm stands at the vanguard of learning in this age."
            zh: "我们的大学与学院已开始结出硕果。一百项技艺已被我们掌握——在这个时代，我们的国度已站在学问的前沿。"
          event_option:
