            zh: "[tv_academy_of_sciences|E]等级 ≥ 2"
          event_title:
            en: "[tv_science_victory|E]：Embracing New Ideas"
            zh: "[tv_science_victory|E]：拥抱新思想"
          event_desc:
            en: "Our scholars have absorbed and spread the great [institution|e]s of this era until they no longer feel foreign in our lecture halls. One hundred and fifty [advance|e]s now stand to our name, each one copied, debated, corrected, and set to work somewhere in the realm. Foreign thinkers seek the patronage of our court because they hear that questions are not merely tolerated here, but organized. The [tv_academy_of_sciences|E] has become a crossing point for instruments, letters, methods, and pride. New ideas still arrive with accents, rivalries, and inconvenient implications. That is how we know they are alive."
            zh: "我们的学者已经消化并传播这个时代的伟大[institution|e]，直到它们在我们的讲堂中不再显得外来。一百五十项[advance|e]如今以我们的名义立下，每一项都被抄录、辩论、修正，并在国家某处投入使用。外邦思想家寻求我们宫廷的庇护，因为他们听说这里不只是容忍问题，而是组织问题。[tv_academy_of_sciences|E]已经成为器械、书信、方法与自尊的交汇点。新思想仍会带着口音、敌意和不合时宜的暗示抵达。也正因如此，我们知道它们还活着。"
          event_option:
            en: "Let foreign questions become domestic tools."
            zh: "让外来的问题变成国内的工具。"

      - n: 3
