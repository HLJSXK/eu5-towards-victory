            zh: "首屈一指的科学强国。约已研究300项技艺。"
          trigger_desc:
            en: "[tv_science_score|e] ≥ 300 and Academy Level ≥ 4"
            zh: "[tv_science_score|e] ≥ 300，科学院等级 ≥ 4"
          event_title:
            en: "On the Threshold of Modernity"
            zh: "现代性的门槛"
          event_desc:
            en: "Our natural philosophers and engineers now push at the very boundaries of the known world. Three hundred advances stand as testament to generations of investment in learning."
            zh: "我们的自然哲学家与工程师如今已将探索推至已知世界的边疆。三百项技艺，是数代人对学问持续投入的明证。"
          event_option:
            en: "The age of steam and iron awaits."
            zh: "蒸汽与钢铁的时代正在等待我们。"

      - n: 5
        is_short_term: false
        is_long_term: true
        threshold: 400
        extra_trigger_block: |
          has_variable = tv_academy_of_sciences_level
          var:tv_academy_of_sciences_level >= 5
        modifier:
