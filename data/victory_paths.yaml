            en: "[tv_arts_intl_influence|E] ≥ 100"
            zh: "[tv_arts_intl_influence|E] ≥ 100"
          event_title:
            en: "[tv_cultural_victory|E]：Long-term Victory — Cultural Hegemon"
            zh: "[tv_cultural_victory|E]：长期胜利 — 文化霸主"
          event_desc:
            en: "One thousand six hundred [tv_cip|E] now stand behind a cultural achievement no rival can plausibly dismiss. No nation in history has gathered so much beauty, wisdom, ceremony, argument, and wonder into one recognizable name. Long after our [army|e]s are forgotten, the [work_of_art|e]s created in our name will still teach strangers how our age wished to be seen. The [tv_arts_exhibition|E] has carried that name abroad until admiration became expectation and expectation became inheritance. This is [tv_cultural_victory|E] fulfilled: the conversion of patronage into civilization. Empires can lose provinces; a culture that teaches others how to dream has already crossed the border no army can guard."
            zh: "一千六百点[tv_cip|E]如今支撑着一项任何竞争者都无法认真否认的文化成就。历史上从未有任何国家把如此之多的美、智慧、典礼、争论与奇迹汇聚到同一个可识别的名字之下。在我们的[army|e]早已被遗忘之后，以我们名义创造的[work_of_art|e]仍会教陌生人理解这个时代曾希望如何被看见。[tv_arts_exhibition|E]已把这个名字带向海外，直到赞叹变成期待，期待变成遗产。这就是[tv_cultural_victory|E]的完成：把赞助转化为文明。帝国可能失去省份；一种教会他人如何做梦的文化，已经越过了任何军队都无法守卫的边境。"
          event_option:
            en: "Let future centuries borrow our light."
            zh: "让未来的世纪借用我们的光。"

  # ── SCIENCE ───────────────────────────────────────────────────────────────
  - id: science
    score_var: tv_science_score
    gui:
      order: 5
      tab_label:
        en: "Science"
        zh: "科技"
      icon: "gfx/interface/icons/towards_victory/victory_paths/tv_victory_science.dds"
      progress_style: progress_bar_blue_alt
    # The engine count is currently broken, so the independent generated full
    # has_advance scan runs only for player countries at situation start and yearly.
    call_updater_in_checker: false
    call_updater_on_situation_start: player_only
    score_var_init_in_checker: false

    progress_pct_body: |
      # ── Scientific Victory ────────────────────────────────────────────────────
      # piecewise progress: each milestone band contributes 20%
      if = {
      	limit = {
      		custom_tooltip = {
      			text = TV_HAS_SCIENCE_SCORE_TT
      			has_variable = tv_science_score
      		}
      	}
      	# Seg 1: 0–100 → 0–20
      	set_variable = { name = tv_science_progress_pct value = var:tv_science_score }
      	change_variable = { name = tv_science_progress_pct multiply = 20 }
      	change_variable = { name = tv_science_progress_pct divide = 100 }
      	# Seg 2: 100–150 → 20–40
      	if = {
      		limit = { var:tv_science_score >= 100 }
      		set_variable = { name = tv_science_progress_pct value = var:tv_science_score }
      		change_variable = { name = tv_science_progress_pct subtract = 100 }
      		change_variable = { name = tv_science_progress_pct multiply = 20 }
      		change_variable = { name = tv_science_progress_pct divide = 50 }
      		change_variable = { name = tv_science_progress_pct add = 20 }
      	}
      	# Seg 3: 150–200 → 40–60
      	if = {
      		limit = { var:tv_science_score >= 150 }
      		set_variable = { name = tv_science_progress_pct value = var:tv_science_score }
      		change_variable = { name = tv_science_progress_pct subtract = 150 }
      		change_variable = { name = tv_science_progress_pct multiply = 20 }
      		change_variable = { name = tv_science_progress_pct divide = 50 }
      		change_variable = { name = tv_science_progress_pct add = 40 }
      	}
      	# Seg 4: 200–300 → 60–80
      	if = {
      		limit = { var:tv_science_score >= 200 }
      		set_variable = { name = tv_science_progress_pct value = var:tv_science_score }
      		change_variable = { name = tv_science_progress_pct subtract = 200 }
      		change_variable = { name = tv_science_progress_pct multiply = 20 }
      		change_variable = { name = tv_science_progress_pct divide = 100 }
      		change_variable = { name = tv_science_progress_pct add = 60 }
      	}
      	# Seg 5: 300–400 → 80–100
      	if = {
      		limit = { var:tv_science_score >= 300 }
      		set_variable = { name = tv_science_progress_pct value = var:tv_science_score }
      		change_variable = { name = tv_science_progress_pct subtract = 300 }
      		change_variable = { name = tv_science_progress_pct multiply = 20 }
      		change_variable = { name = tv_science_progress_pct divide = 100 }
      		change_variable = { name = tv_science_progress_pct add = 80 }
      	}
      	if = { limit = { var:tv_science_progress_pct > 100 } set_variable = { name = tv_science_progress_pct value = 100 } }
      }

