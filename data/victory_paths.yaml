        modifier_name:
          en: "Preeminent Science"
          zh: "科学巅峰"
        loc:
          title:
            en: "Scientific Victory — Milestone 4"
            zh: "科技胜利 — 第四里程碑"
          meaning:
            en: "The preeminent scientific power — three hundred [advance|e]s, generations of investment made manifest."
            zh: "首屈一指的科学强国——三百项[advance|e]，数代投入已然成真。"
          trigger_desc:
            en: "[tv_science_score|e] ≥ 300"
            zh: "[tv_science_score|e] ≥ 300"
          extra_trigger_desc:
            en: "Academy of Sciences Level ≥ 4"
            zh: "科学院等级 ≥ 4"
          event_title:
            en: "On the Threshold of Modernity"
            zh: "现代性的门槛"
          event_desc:
            en: "Our natural philosophers and engineers now push at the very boundaries of the known world. Three hundred [advance|e]s stand as testament to generations of investment in learning."
            zh: "我们的自然哲学家与工程师如今已将探索推至已知世界的边疆。三百项[advance|e]，是数代人对学问持续投入的明证。"
          event_option:
            en: "The age of steam and iron awaits."
            zh: "蒸汽与钢铁的时代正在等待我们。"

      - n: 5
        is_short_term: false
        is_long_term: true
        threshold: 400
        extra_trigger_block: |
          custom_tooltip = {
          	text = TV_SCIENCE_M5_EXTRA_TRIGGER_DESC
          	has_variable = tv_academy_of_sciences_level
          	var:tv_academy_of_sciences_level >= 5
          }
        modifier:
          global_institution_growth_modifier: 2.0
          global_max_literacy: 20
        modifier_name:
          en: "Industrial Vanguard"
          zh: "工业先驱"
        loc:
          title:
            en: "Scientific Victory — Long-term Victory"
            zh: "科技胜利 — 长期胜利"
          meaning:
            en: "The nation that ushered in the Industrial Age — four hundred [advance|e]s. Long-term Victory. The future belongs to you."
            zh: "开创工业时代的国度——四百项[advance|e]。长期胜利。未来属于你。"
          trigger_desc:
            en: "[tv_science_score|e] ≥ 400"
            zh: "[tv_science_score|e] ≥ 400"
          extra_trigger_desc:
            en: "Academy of Sciences Level ≥ 5"
            zh: "科学院等级 ≥ 5"
          event_title:
            en: "Long-term Victory — The Industrial Vanguard"
            zh: "长期胜利 — 工业先驱"
          event_desc:
            en: "Four hundred [advance|e]s. Steam, iron, and the rational mind have remade our nation. Long after the old empires crumble, the knowledge forged in our academies will transform the world entire."
            zh: "四百项[advance|e]。蒸汽、钢铁与理性的思维已彻底改造了我们的国度。旧帝国相继崩塌之后，在我们学院中铸就的知识，将永远改变整个世界。"
          event_option:
            en: "Our name shall be synonymous with progress itself."
            zh: "我们的名字将与进步本身永远共存。"

# ─────────────────────────────────────────────────────────────────────────────
# ON-ACTION HOOKS
# 1对1: effect_body stored verbatim; generator wraps in hook = { effect = { ... } }
# ─────────────────────────────────────────────────────────────────────────────
on_actions:
  - hook: on_royal_marriage
    effect_body: |
      scope:actor = {
      	if = {
      		limit = { NOT = { has_variable = tv_diplomatic_victory_points } }
      		set_variable = { name = tv_diplomatic_victory_points value = 0 }
      	}
      	change_variable = { name = tv_diplomatic_victory_points add = 3 }
      }
      scope:recipient = {
      	if = {
      		limit = { NOT = { has_variable = tv_diplomatic_victory_points } }
      		set_variable = { name = tv_diplomatic_victory_points value = 0 }
      	}
      	change_variable = { name = tv_diplomatic_victory_points add = 3 }
      }

  - hook: on_winning_war
    effect_body: |
      scope:winner = {
      	if = {
      		limit = { NOT = { has_variable = tv_diplomatic_victory_points } }
      		set_variable = { name = tv_diplomatic_victory_points value = 0 }
      	}
      	change_variable = { name = tv_diplomatic_victory_points add = 5 }
      }

  - hook: on_work_of_art_created
    effect_body: |
      root.owner ?= {
      	if = {
      		limit = { NOT = { has_variable = tv_cultural_influence_points } }
      		set_variable = { name = tv_cultural_influence_points value = 0 }
      	}
      	change_variable = { name = tv_cultural_influence_points add = 10 }
      }

