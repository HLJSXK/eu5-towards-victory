          - modifier:
              global_production_efficiency: 0.05
        loc:
          title:
            en: "Scientific Victory — Short-term Victory"
            zh: "科技胜利 — 短期胜利"
          meaning:
            en: "A vanguard of learning — two hundred [advance|e]s. Short-term Victory. No nation rivals your command of knowledge."
            zh: "学问的先锋国度——两百项[advance|e]。短期胜利。没有任何国家能在知识领域与你抗衡。"
          trigger_desc:
            en: "[tv_science_score|e] ≥ 200"
            zh: "[tv_science_score|e] ≥ 200"
          extra_trigger_desc:
            en: "[tv_academy_of_sciences|E] Level ≥ 3"
            zh: "[tv_academy_of_sciences|E]等级 ≥ 3"
          event_title:
            en: "[tv_science_victory|E]：A Centre of Learning — Short-term Victory"
            zh: "[tv_science_victory|E]：学问中心 — 短期胜利"
          event_desc:
            en: "No nation now rivals our command of the sciences and the arts of governance. Two hundred [advance|e]s are not a pile of discoveries, but a working language shared by officials, mechanics, physicians, surveyors, and teachers. The [tv_academy_of_sciences|E] has given that language grammar, ceremony, and ambition. This short-term [tv_science_victory|E] marks us as the intellectual power of the age, not because every scholar agrees, but because every serious disagreement now wants our audience. Reason has become a courtier, but not a tame one. We should be grateful for that danger."
            zh: "如今，没有任何国家能与我们在科学与治理之道上的造诣相抗衡。两百项[advance|e]并不是一堆发现，而是官员、机械师、医师、测绘师与教师共同使用的一套工作语言。[tv_academy_of_sciences|E]为这套语言提供了语法、仪式与雄心。这场短期[tv_science_victory|E]标志着我们已成为时代的智识强国，并不是因为每位学者都同意我们，而是因为每一场严肃分歧都希望获得我们的听众。理性已经成为宫廷人物，但不是温顺的那一种。我们应当为这种危险感到庆幸。"
          event_option:
            en: "Give argument a larger hall."
            zh: "给争论更大的厅堂。"

      - n: 4
        is_short_term: false
        is_long_term: false
        threshold: 300
        extra_trigger_block: |
          custom_tooltip = {
          	text = TV_SCIENCE_M4_EXTRA_TRIGGER_DESC
          	has_variable = tv_academy_of_sciences_level
