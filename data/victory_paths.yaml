    loc:
      title:
        en: "Scientific Victory"
        zh: "科技胜利"
      description:
        en: "While others sharpen their blades, sharpen your minds. The nation that masters nature's secrets commands not just its own age, but the shape of all ages to come."
        zh: "他人在磨刀，你们在磨砺心智。掌握自然奥秘的国度，统御的不只是当下，更是未来每一个时代的面貌。"
      flavor:
        en: '"The true method of knowledge is experiment." — William Blake'
        zh: '"认识真相的真正方法是实验。" — 威廉·布莱克'
      progress_display:
        en: "[tv_science_score|e]: [Country.MakeScope.GetVariable('tv_science_score').GetValue|0] / 400"
        zh: "[tv_science_score|e]：[Country.MakeScope.GetVariable('tv_science_score').GetValue|0] / 400"

