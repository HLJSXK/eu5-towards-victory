            zh: "[tv_academy_of_sciences|E]等级 ≥ 1"
          event_title:
            en: "[tv_science_victory|E]：The First Hall Opens"
            zh: "[tv_science_victory|E]：第一厅堂启幕"
          event_desc:
            en: "The first halls of our [tv_academy_of_sciences|E] now stand complete, smelling of fresh timber, lamp oil, ink, and argument. With one hundred [advance|e]s mastered, our scholars have given the realm more than a building; they have given curiosity a public address. Instruments are unpacked beside copied manuscripts, and students whisper as if the walls themselves might answer. This is the opening note of [tv_science_victory|E]. The state has always used knowledge, but now it has made a place where knowledge can use the state in return. A country with an academy has not solved the mysteries of nature, but it has made those mysteries report to a schedule."
            zh: "我们的[tv_academy_of_sciences|E]第一批厅堂已经落成，空气里有新木、灯油、墨水与争论的味道。一百项[advance|e]已被掌握，学者们给予国家的不只是一座建筑；他们给好奇心提供了公开地址。仪器在抄本旁被拆封，学生低声交谈，仿佛墙壁本身也可能回答问题。这是[tv_science_victory|E]的开场音。国家一直在使用知识，但如今它建立了一个知识也能反过来使用国家的地方。拥有[tv_academy_of_sciences|E]的国家尚未解开自然之谜，却已经让这些谜题按日程报到。"
          event_option:
            en: "Open the doors and sharpen the questions."
            zh: "打开大门，磨利问题。"

