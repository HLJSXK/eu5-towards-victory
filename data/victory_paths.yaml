        is_short_term: false
        is_long_term: false
        threshold: 100
        extra_trigger_block: |
          custom_tooltip = {
          	text = TV_SCIENCE_M1_EXTRA_TRIGGER_DESC
          	has_variable = tv_academy_of_sciences_level
          	var:tv_academy_of_sciences_level >= 1
          }
        modifier:
          global_max_literacy: 10
        modifier_name:
          en: "Literate Nation"
          zh: "知识之国"
        custom_grant_body: |
          add_country_modifier = { modifier = tv_science_m1_bonus days = -1 }
          custom_tooltip = { text = tv_science_m1_io_grant_tt }
          hidden_effect = {
              if = {
                  limit = { NOT = { has_variable = tv_academy_io_member } }
                  set_variable = { name = tv_academy_io_member value = 1 }
                  set_variable = { name = tv_research_phase value = 0 }
                  set_variable = { name = tv_research_interest value = 0 }
                  set_variable = { name = tv_research_b_done value = 0 }
                  set_variable = { name = tv_rm_subprocess_a value = 0 }
                  set_variable = { name = tv_rm_subprocess_b value = 0 }
                  set_variable = { name = tv_rm_subprocess_c value = 0 }
                  set_variable = { name = tv_rm_subprocess_d_ready value = 0 }
                  set_variable = { name = tv_med_progress  value = 0 }
                  set_variable = { name = tv_med_disp_adm  value = 0 }
                  set_variable = { name = tv_med_disp_dip  value = 0 }
                  set_variable = { name = tv_med_disp_mil  value = 0 }
                  create_international_organization = {
                      type = international_organization_type:tv_academy_of_sciences
                      hidden_effect = {
                          add_country_to_international_organization = prev
                          set_leader_country = prev
                      }
                  }
              }
          }
        loc:
          title:
            en: "Scientific Victory — Milestone 1"
            zh: "科技胜利 — 第一里程碑"
          meaning:
            en: "A nation of curious minds — one hundred [advance|e]s claimed in the pursuit of knowledge."
            zh: "充满求知欲的国度——在追求知识的征途上掌握了一百项[advance|e]。"
          trigger_desc:
            en: "[tv_science_score|e] ≥ 100"
            zh: "[tv_science_score|e] ≥ 100"
          extra_trigger_desc:
            en: "Academy of Sciences Level ≥ 1"
            zh: "科学院等级 ≥ 1"
          event_title:
            en: "Academy of Sciences Founded"
            zh: "科学院建成"
          event_desc:
            en: "The first halls of our Academy of Sciences now stand complete. With one hundred [advance|e]s mastered, our scholars have given the realm both a monument to learning and a new institution for the pursuit of knowledge."
            zh: "科学院的第一批厅堂已正式落成。一百项[advance|e]已被我们掌握，学者们既为国家立起了学问的丰碑，也开启了追求知识的新机构。"
          event_option:
            en: "Knowledge shall light our way forward."
            zh: "知识将为我们照亮前行之路。"

