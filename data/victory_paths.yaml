          zh: "市场支配"
        loc:
          title:
            en: "Trade Victory — Milestone 4"
            zh: "贸易胜利 — 里程碑四"
          meaning:
            en: "Near-monopoly control of the world's key [market|e]s — rivals count their losses. Monthly [trade_income|e] ~1,000."
            zh: "近乎垄断世界关键[market|e]——竞争者只能数着自己的损失。每月[trade_income|e]约1,000。"
          trigger_desc:
