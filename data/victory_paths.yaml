  # ── CULTURAL ──────────────────────────────────────────────────────────────
  - id: cultural
    score_var: tv_cultural_influence_points
    call_updater_in_checker: false     # accumulated via on_action, no updater effect
    score_var_init_in_checker: false   # monthly_country_pulse always initializes it

    score_updater_body: null

    progress_pct_body: |
      # ── Cultural Victory ──────────────────────────────────────────────────────
      # piecewise: thresholds 100/200/400/800/1600 → each milestone = +20%
      if = {
      	limit = { has_variable = tv_cultural_influence_points }
      	# Seg 1: 0–100 → 0–20
      	set_variable = { name = tv_cultural_progress_pct value = var:tv_cultural_influence_points }
      	change_variable = { name = tv_cultural_progress_pct multiply = 20 }
      	change_variable = { name = tv_cultural_progress_pct divide = 100 }
      	# Seg 2: 100–200 → 20–40
      	if = {
      		limit = { var:tv_cultural_influence_points >= 100 }
      		set_variable = { name = tv_cultural_progress_pct value = var:tv_cultural_influence_points }
      		change_variable = { name = tv_cultural_progress_pct subtract = 100 }
      		change_variable = { name = tv_cultural_progress_pct multiply = 20 }
      		change_variable = { name = tv_cultural_progress_pct divide = 100 }
      		change_variable = { name = tv_cultural_progress_pct add = 20 }
      	}
      	# Seg 3: 200–400 → 40–60
      	if = {
      		limit = { var:tv_cultural_influence_points >= 200 }
      		set_variable = { name = tv_cultural_progress_pct value = var:tv_cultural_influence_points }
      		change_variable = { name = tv_cultural_progress_pct subtract = 200 }
      		change_variable = { name = tv_cultural_progress_pct multiply = 20 }
      		change_variable = { name = tv_cultural_progress_pct divide = 200 }
      		change_variable = { name = tv_cultural_progress_pct add = 40 }
      	}
      	# Seg 4: 400–800 → 60–80
      	if = {
