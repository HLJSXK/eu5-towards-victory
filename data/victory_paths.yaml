      		change_variable = { name = tv_cultural_progress_pct divide = 400 }
      		change_variable = { name = tv_cultural_progress_pct add = 60 }
      	}
      	# Seg 5: 800–1600 → 80–100
      	if = {
      		limit = { var:tv_cultural_influence_points >= 800 }
      		set_variable = { name = tv_cultural_progress_pct value = var:tv_cultural_influence_points }
      		change_variable = { name = tv_cultural_progress_pct subtract = 800 }
      		change_variable = { name = tv_cultural_progress_pct multiply = 20 }
      		change_variable = { name = tv_cultural_progress_pct divide = 800 }
      		change_variable = { name = tv_cultural_progress_pct add = 80 }
      	}
      	if = { limit = { var:tv_cultural_progress_pct > 100 } set_variable = { name = tv_cultural_progress_pct value = 100 } }
      }

    extra_loc_keys: []

    loc:
      title:
        en: "Cultural Victory"
        zh: "文化胜利"
      description:
        en: "Empires rise and crumble, but great art endures. Let your court be the envy of princes, your [artist|e]s the voice of an age, and your culture outlast every conqueror."
        zh: "帝国兴衰更迭，而伟大的艺术永世长存。让你的宫廷令王公嫉羡，让你的[artist|e]成为一个时代的声音，让你的文明超越每一位征服者。"
      flavor:
        en: '"Art is the signature of civilisations."'
        zh: '"艺术是文明的印记。"'
      progress_display:
        en: "[tv_cultural_influence_points|e]: [Country.MakeScope.GetVariable('tv_cultural_influence_points').GetValue|0] / 1600"
        zh: "[tv_cultural_influence_points|e]：[Country.MakeScope.GetVariable('tv_cultural_influence_points').GetValue|0] / 1600"

