          trigger_desc:
            en: "[tv_science_score|e] ≥ 150"
            zh: "[tv_science_score|e] ≥ 150"
          extra_trigger_desc:
            en: "Academy of Sciences Level ≥ 2"
            zh: "科学院等级 ≥ 2"
          event_title:
            en: "Embracing New Ideas"
            zh: "拥抱新思想"
          event_desc:
            en: "Our scholars have absorbed and spread the great [institution|e]s of this era. One hundred and fifty [advance|e]s stand to our name, and foreign thinkers seek the patronage of our court."
            zh: "我们的学者已消化并传播了这个时代的伟大[institution|e]。一百五十项[advance|e]以我们的名义立下，外邦思想家纷纷寻求我们宫廷的庇护。"
          event_option:
            en: "Open minds conquer more than armies."
            zh: "开放的心灵胜过千军万马。"

