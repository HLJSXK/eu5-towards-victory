# data/victory_paths.yaml
# Single source of truth for all Towards Victory victory path data.
# Regenerate all 13 game files with:
#   conda run --no-capture-output -n eu5 python scripts/gen_victory.py
#
# 1对1原则: Each field maps directly to one piece of generated output.
# Complex EU5 script bodies are stored verbatim (multiline strings); the generator
# inserts them unchanged. Simple repetitive blocks use Python templates.
#
# Do NOT hand-edit the generated files — edit this YAML and re-run gen_victory.py.

# ─────────────────────────────────────────────────────────────────────────────
# SHARED — written to both localization files
# ─────────────────────────────────────────────────────────────────────────────
shared:
  situation_name:
    en: "Towards Victory"
    zh: "胜利条件"
  situation_desc:
    en: "Six paths to glory lie open before you. Which legacy shall your realm leave upon the world?"
    zh: "六条荣耀之路，就在您的前方。您的国度，将向世界留下怎样的传世遗产？"
  situation_title:
    en: "Victory Progress"
    zh: "胜利进度"
  tooltip_conditions_header:
    en: "Required Conditions"
    zh: "达成条件"
  tooltip_rewards_header:
    en: "Milestone Reward"
    zh: "里程碑奖励"
  milestone_labels:
    1: "1"
    2: "2"
    3: "V1"
    4: "4"
    5: "V2"

# ─────────────────────────────────────────────────────────────────────────────
# VICTORY PATHS
# ─────────────────────────────────────────────────────────────────────────────
paths:

  # ── CONQUEST ──────────────────────────────────────────────────────────────
  - id: conquest
    score_var: tv_conquest_score
    gui:
      order: 0
      tab_label:
        en: "Conquest"
        zh: "征服"
      icon: "gfx/interface/icons/towards_victory/victory_paths/tv_victory_conquest.dds"
      progress_style: progress_bar_blue_alt
    call_updater_in_checker: true      # true → emit tv_update_{id}_score_effect = yes at top of checker
    score_var_init_in_checker: false   # true → emit extra has_variable init for score_var in checker

    # 1对1: Score updater body — inserted verbatim into tv_update_conquest_score_effect
    score_updater_body: |
      set_variable = { name = tv_conquest_score value = num_locations }
      set_local_variable = { name = tv_conquest_subj_temp value = 0 }
      every_subject_or_below = {
      	change_local_variable = { name = tv_conquest_subj_temp add = { value = num_locations  multiply = 0.5 } }
      }
      change_variable = { name = tv_conquest_score add = local_var:tv_conquest_subj_temp }

    # 1对1: Progress pct body — inserted verbatim into tv_update_all_progress_pct_effect
    progress_pct_body: |
      # ── Conquest Victory ─────────────────────────────────────────────────────
      # piecewise progress: each milestone band contributes 20%
      if = {
      	limit = {
      		custom_tooltip = {
      			text = TV_HAS_CONQUEST_SCORE_TT
      			has_variable = tv_conquest_score
      		}
      	}
      	# Seg 1: 0–200 → 0–20
      	set_variable = { name = tv_conquest_progress_pct value = var:tv_conquest_score }
      	change_variable = { name = tv_conquest_progress_pct multiply = 20 }
      	change_variable = { name = tv_conquest_progress_pct divide = 200 }
      	# Seg 2: 200–400 → 20–40
      	if = {
      		limit = { var:tv_conquest_score >= 200 }
      		set_variable = { name = tv_conquest_progress_pct value = var:tv_conquest_score }
      		change_variable = { name = tv_conquest_progress_pct subtract = 200 }
      		change_variable = { name = tv_conquest_progress_pct multiply = 20 }
      		change_variable = { name = tv_conquest_progress_pct divide = 200 }
      		change_variable = { name = tv_conquest_progress_pct add = 20 }
      	}
      	# Seg 3: 400–600 → 40–60
      	if = {
      		limit = { var:tv_conquest_score >= 400 }
      		set_variable = { name = tv_conquest_progress_pct value = var:tv_conquest_score }
      		change_variable = { name = tv_conquest_progress_pct subtract = 400 }
      		change_variable = { name = tv_conquest_progress_pct multiply = 20 }
      		change_variable = { name = tv_conquest_progress_pct divide = 200 }
      		change_variable = { name = tv_conquest_progress_pct add = 40 }
      	}
      	# Seg 4: 600–1200 → 60–80
      	if = {
      		limit = { var:tv_conquest_score >= 600 }
      		set_variable = { name = tv_conquest_progress_pct value = var:tv_conquest_score }
      		change_variable = { name = tv_conquest_progress_pct subtract = 600 }
      		change_variable = { name = tv_conquest_progress_pct multiply = 20 }
      		change_variable = { name = tv_conquest_progress_pct divide = 600 }
      		change_variable = { name = tv_conquest_progress_pct add = 60 }
      	}
      	# Seg 5: 1200–2500 → 80–100
      	if = {
      		limit = { var:tv_conquest_score >= 1200 }
      		set_variable = { name = tv_conquest_progress_pct value = var:tv_conquest_score }
      		change_variable = { name = tv_conquest_progress_pct subtract = 1200 }
      		change_variable = { name = tv_conquest_progress_pct multiply = 20 }
      		change_variable = { name = tv_conquest_progress_pct divide = 1300 }
      		change_variable = { name = tv_conquest_progress_pct add = 80 }
      	}
      	if = { limit = { var:tv_conquest_progress_pct > 100 } set_variable = { name = tv_conquest_progress_pct value = 100 } }
      }

    extra_loc_keys: []

    loc:
      title:
        en: "Conquest Victory"
        zh: "征服胜利"
      description:
        en: "The sword writes history. March beyond your borders, seize what others dare not hold, and forge an empire that the world cannot ignore."
        zh: "刀剑书写历史。越过疆界，夺取他人不敢染指之地，铸就一个令世界无法漠视的帝国。"
      flavor:
        en: '"The greatest happiness is to vanquish your enemies." — Genghis Khan'
        zh: '"最大的幸福就是征服你的敌人。" — 成吉思汗'
      overview_card:
        title:
          en: "[tv_conquest_victory|E]：Banners Beyond the Border"
          zh: "[tv_conquest_victory|E]：疆界之外的旌旗"
        playstyle:
          en: "Playstyle: expand aggressively, subdue rivals, and turn direct rule plus subject land into a single imperial machine."
          zh: "玩法风格：主动扩张、压制对手，并把直属领土与附属国疆域共同纳入帝国机器。"
        formula:
          en: "Progress formula: [tv_conquest_score|e] = owned [location|e]s + 0.5 × subject-or-below [location|e]s; victory progress is the current milestone segment's linear share, capped at 100%."
          zh: "进程公式：[tv_conquest_score|e] = 直属[location|e]数量 + 0.5 × 附属及其下级国家[location|e]数量；胜利进度按当前里程碑段线性折算，上限100%。"
      progress_display:
        en: "[tv_conquest_score|e]: [Country.MakeScope.GetVariable('tv_conquest_score').GetValue|0] / 2,500"
        zh: "[tv_conquest_score|e]：[Country.MakeScope.GetVariable('tv_conquest_score').GetValue|0] / 2,500"

    milestones:
      - n: 1
        is_short_term: false
        is_long_term: false
        threshold: 200
        extra_trigger_block: |
          custom_tooltip = {
            text = TV_CONQUEST_M1_EXTRA_TRIGGER_DESC
            is_subject = no
          }
        reward_options:
          - modifier:
              discipline: 0.05
          - modifier:
              military_tactics: 0.25
          - modifier:
              land_morale_modifier: 0.10
        unlock_body: null
        loc:
          title:
            en: "Conquest Victory — Milestone 1"
            zh: "征服胜利 — 里程碑一"
          meaning:
            en: "Beyond your heartland, banners now fly over distant [location|e]s. The empire's first outline is drawn. ~200 [location|e]s."
            zh: "故土之外，旗帜飘扬在遥远的[location|e]之上。帝国的第一道轮廓已然成形。约200处[location|e]。"
          trigger_desc:
            en: "[tv_conquest_score|e] ≥ 200"
            zh: "[tv_conquest_score|e] ≥ 200"
          extra_trigger_desc:
            en: "Is not a [subject|E]"
            zh: "不是[subject|E]"
          event_title:
            en: "[tv_conquest_victory|E]：The Empire Grows"
            zh: "[tv_conquest_victory|E]：帝国正在壮大"
          event_desc:
            en: "The first report arrives with mud still drying on the dispatch case. Our [army|e]s have crossed old frontiers, and banners now fly over 200 [location|e]s once marked as beyond practical command. Courtiers trace the new borders with a mixture of pride and dread, for each fresh province adds roads, tax rolls, garrisons, and quarrels. The [tv_conquest_victory|E] is no longer a soldier's boast spoken over campaign wine; it has become a problem of state. Messengers ride through nights that used to belong to foreign rulers. The realm is taking shape, and its shape is larger than habit can easily understand."
            zh: "第一份捷报送抵宫廷时，封套上的泥水尚未干透。我们的[army|e]已经越过旧日边界，旗帜如今飘扬在200处曾被认为难以控制的[location|e]之上。廷臣们带着骄傲与隐忧描摹新边境，因为每一片新土地都意味着道路、税册、驻军与争执。[tv_conquest_victory|E]不再只是军官在庆功酒席上的豪言，而已成为真正的国家事务。信使连夜穿过那些过去属于他国君主的道路。帝国的轮廓正在显现，而且这道轮廓已经大到令旧习难以理解。"
          event_option:
            en: "Send the surveyors after the banners."
            zh: "让测绘官追上旗帜。"

      - n: 2
        is_short_term: false
        is_long_term: false
        threshold: 400
        extra_trigger_block: null
        reward_options:
          - modifier:
              naval_damage_done: 0.10
          - modifier:
              naval_damage_taken: -0.10
          - modifier:
              naval_morale_modifier: 0.10
        loc:
          title:
            en: "Conquest Victory — Milestone 2"
            zh: "征服胜利 — 里程碑二"
          meaning:
            en: "A substantial empire takes shape, its frontiers drawn by the march of [army|e]s. ~400 [location|e]s."
            zh: "幅员辽阔的帝国初具规模，其疆界由[army|e]的行进划定。约400处[location|e]。"
          trigger_desc:
            en: "[tv_conquest_score|e] ≥ 400"
            zh: "[tv_conquest_score|e] ≥ 400"
          event_title:
            en: "[tv_conquest_victory|E]：A Substantial Empire"
            zh: "[tv_conquest_victory|E]：幅员辽阔的帝国"
          event_desc:
            en: "Four hundred [location|e]s now answer to our seals, our taxmen, and our marching drums. The triumph is obvious on the map, but less tidy on the road, where grain wagons sink into rain and quartermasters argue over names no clerk can spell twice the same way. Our [army|e]s have won the space; now the state must learn how to feed it. Every failed bridge becomes [attrition|e], every delayed mule becomes a rumor of weakness, and every hungry regiment teaches the frontier to doubt us. The empire can still grow, but only if logistics becomes as honored as courage. Victory has given us distance, and distance demands discipline."
            zh: "四百处[location|e]如今听命于我们的印玺、税吏与军鼓。地图上的胜利一目了然，道路上的胜利却远没有这么整齐：运粮车陷入雨泥，军需官为那些书记从未写对两次的地名争吵不休。我们的[army|e]赢得了空间，如今国家必须学会喂养这片空间。每一座失修的桥都会变成[attrition|e]，每一头迟到的骡子都会变成软弱的传闻，每一支饥饿的军团都会教边境怀疑我们。帝国仍可继续扩张，但后勤必须像勇气一样受人尊崇。胜利给予我们距离，而距离要求纪律。"
          event_option:
            en: "Put the empire on wheels, hooves, and ledgers."
            zh: "让帝国行于车轮、蹄声与账册之上。"

      - n: 3
        is_short_term: true
        is_long_term: false
        threshold: 600
        extra_trigger_block: null
        reward_options:
          - modifier:
              global_pop_conversion_speed: 0.01
          - modifier:
              global_pop_assimilation_speed: 0.01
          - modifier:
              stability_investment: 0.05
        loc:
          title:
            en: "Conquest Victory — Short-term Victory"
            zh: "征服胜利 — 短期胜利"
          meaning:
            en: "Territorial supremacy secured — no neighbour may challenge your [location|e] count without ruin. Short-term Victory. ~600 [location|e]s."
            zh: "领土霸权已然确立——无邻国可在不自取灭亡的前提下撼动你的[location|e]数量。短期胜利。约600处[location|e]。"
          trigger_desc:
            en: "[tv_conquest_score|e] ≥ 600"
            zh: "[tv_conquest_score|e] ≥ 600"
          event_title:
            en: "[tv_conquest_victory|E]：Territorial Supremacy — Short-term Victory"
            zh: "[tv_conquest_victory|E]：领土霸权 — 短期胜利"
          event_desc:
            en: "Six hundred [location|e]s now bow before our flag, and the word kingdom has begun to sound too small in the mouths of heralds. Provincial elites arrive with gifts and grievances, conquered towns ask which laws survived the surrender, and officers discover that a garrison can win a gate without winning obedience. This is the first true test of imperial rule. The [tv_govhouse|E] must turn conquest into habit, not merely into fear. If the hand is too soft, the edges fray; if it is too hard, the whole cloth tears. Our [tv_conquest_victory|E] has reached its short-term crown, but crowns are heavy things."
            zh: "六百处[location|e]如今向我们的旗帜俯首，王国二字在传令官口中已经显得狭小。地方显贵携礼物与冤情而来，被征服城镇询问投降后哪些法律仍然有效，军官们也发现驻军能夺下一座城门，却未必能夺下服从。这是真正帝国统治的第一次考验。[tv_govhouse|E]必须把征服变成习惯，而不是只变成恐惧。手腕太软，边缘便会散开；手腕太硬，整匹布都会撕裂。我们的[tv_conquest_victory|E]已抵达短期桂冠，但桂冠从来沉重。"
          event_option:
            en: "Rule it before it remembers another master."
            zh: "在它想起旧主之前，先让它学会我们的统治。"

      - n: 4
        is_short_term: false
        is_long_term: false
        threshold: 1200
        extra_trigger_block: null
        reward_options:
          - modifier:
              global_manpower_modifier: 0.20
          - modifier:
              mercenary_maintenance_efficiency: -0.20
          - modifier:
              global_levy_size_modifier: 0.10
        loc:
          title:
            en: "Conquest Victory — Milestone 4"
            zh: "征服胜利 — 里程碑四"
          meaning:
            en: "An empire spanning continents — distance itself becomes the adversary your [army|e]s must defeat. ~1,200 [location|e]s."
            zh: "横跨大陆的帝国——距离本身成为你的[army|e]必须征服的对手。约1,200处[location|e]。"
          trigger_desc:
            en: "[tv_conquest_score|e] ≥ 1,200"
            zh: "[tv_conquest_score|e] ≥ 1,200"
          event_title:
            en: "[tv_conquest_victory|E]：An Empire Spanning Continents"
            zh: "[tv_conquest_victory|E]：横跨大陆的帝国"
          event_desc:
            en: "More than 1,200 [location|e]s now lie within the shadow of our authority. Foreign courts no longer ask whether we are dangerous; they ask whether distance itself can survive us. The old language of borders is failing, for our frontier is not a line but a moving arrangement of forts, roads, governors, hostages, merchants, and soldiers. Every province we absorb adds strength, but also another memory that must be negotiated or broken. Our [army|e]s must appear where revolt expects absence, and our administrators must arrive before rumor writes its own law. The world watches because the world is measuring how much empire one state can bear."
            zh: "超过1,200处[location|e]如今都落在我们权威的阴影之下。外国宫廷不再询问我们是否危险，而是询问距离本身是否还能阻挡我们。旧日边界的语言已经失效，因为我们的边境不是一条线，而是由堡垒、道路、总督、人质、商人和士兵组成的流动秩序。每吸收一片土地，我们便多一份力量，也多一段必须谈判或打碎的记忆。我们的[army|e]必须在叛乱期待空缺之处出现，行政官必须在流言写下自己的法律之前抵达。世界注视着我们，因为世界正在衡量一个国家究竟能承受多少帝国。"
          event_option:
            en: "Bind every road back to the capital."
            zh: "让每一条道路都重新系回首都。"

      - n: 5
        is_short_term: false
        is_long_term: true
        threshold: 2500
        extra_trigger_block: null
        reward_options:
          - modifier:
              global_integration_speed_modifier: 0.50
          - modifier:
              annexation_speed_modifier: 0.50
          - modifier:
              global_war_score_efficiency: 0.50
        loc:
          title:
            en: "Conquest Victory — Long-term Victory"
            zh: "征服胜利 — 长期胜利"
          meaning:
            en: "A world empire without rival or precedent. The last [location|e]s fall into the vast whole. Long-term Victory. ~2,500 [location|e]s."
            zh: "无与伦比、史无前例的世界帝国。最后的[location|e]并入这庞大的整体之中。长期胜利。约2,500处[location|e]。"
          trigger_desc:
            en: "[tv_conquest_score|e] ≥ 2,500"
            zh: "[tv_conquest_score|e] ≥ 2,500"
          event_title:
            en: "[tv_conquest_victory|E]：Long-term Victory — World Empire"
            zh: "[tv_conquest_victory|E]：长期胜利 — 世界帝国"
          event_desc:
            en: "Two thousand five hundred [location|e]s stand within our dominion, and scribes have begun to run out of comparisons. No empire in recorded history has claimed so much of the known world, nor forced so many peoples to reckon with one banner at once. The news does not arrive as a single triumph, but as a thousand smaller submissions: a city gate opened, a frontier oath sworn, a rebel standard taken down, a distant tax paid without soldiers watching. Our [tv_conquest_victory|E] has passed from campaign into myth. Future rulers will study our roads as if they were veins, our sieges as if they were scripture, and our mistakes as warnings written in fire. Our legacy is no longer merely recorded by history; it has become one of the measures by which history will judge ambition."
            zh: "两千五百处[location|e]已在我们的统治之内，书记们甚至开始找不到合适的比喻。有史以来，从未有任何帝国掌控过如此广阔的已知世界，也从未迫使如此众多的人群同时面对同一面旗帜。捷报并非以单一凯旋的形式抵达，而是化作千百个更细小的归顺：一座城门开启，一项边疆誓言立下，一面叛旗被降下，一笔远方税款在没有士兵注视时缴清。我们的[tv_conquest_victory|E]已经从战役进入神话。后世君主会研究我们的道路，如同研究血脉；研究我们的围城，如同研读经文；研究我们的错误，如同阅读火写成的警告。我们的遗产不再只是被历史记录，它已经成为历史衡量雄心的尺度之一。"
          event_option:
            en: "Let the map learn our name."
            zh: "让地图学会我们的名字。"

  # ── PROSPERITY ────────────────────────────────────────────────────────────
  - id: prosperity
    score_var: tv_prosperity_score
    gui:
      order: 1
      tab_label:
        en: "Prosperity"
        zh: "繁荣"
      icon: "gfx/interface/icons/towards_victory/victory_paths/tv_victory_prosperity.dds"
      progress_style: progress_bar_green_alt
    call_updater_in_checker: true      # player gets monthly update; AI still uses 12-month batch in situation
    score_var_init_in_checker: false

    score_updater_body: |
      # 1. 计数领地
      set_local_variable = { name = tv_num_locs value = 0 }
      every_owned_location = {
      	change_local_variable = { name = tv_num_locs add = 1 }
      }
      # 2. 累加总量：total_pop + Σdev + tax_base
      set_variable = { name = tv_raw_score value = total_population }
      set_local_variable = { name = tv_sum_dev value = 0 }
      every_owned_location = {
      	change_local_variable = { name = tv_sum_dev add = development }
      }
      change_variable = { name = tv_raw_score add = local_var:tv_sum_dev }
      change_variable = { name = tv_raw_score add = country_tax_base }
      # 3. base_score = raw × 50 / (N + 50)  递减规模惩罚
      set_variable = { name = tv_denom value = local_var:tv_num_locs }
      change_variable = { name = tv_denom add = 50 }
      change_variable = { name = tv_raw_score multiply = 50 }
      change_variable = { name = tv_raw_score divide = var:tv_denom }
      set_variable = { name = tv_prosperity_score value = var:tv_raw_score }
      # 4. 稳定度乘数：× (100 + stability) / 100
      set_variable = { name = tv_stab_factor value = stability }
      change_variable = { name = tv_stab_factor add = 100 }
      change_variable = { name = tv_prosperity_score multiply = var:tv_stab_factor }
      change_variable = { name = tv_prosperity_score divide = 100 }
      # 5. 政体权力乘数（君主=合法性，共和=传统，等）
      if = {
      	limit = { government_type = government_type:monarchy }
      	set_variable = { name = tv_gov_power value = legitimacy }
      	change_variable = { name = tv_prosperity_score multiply = var:tv_gov_power }
      	change_variable = { name = tv_prosperity_score divide = 100 }
      }
      else_if = {
      	limit = { government_type = government_type:republic }
      	set_variable = { name = tv_gov_power value = republican_tradition }
      	change_variable = { name = tv_prosperity_score multiply = var:tv_gov_power }
      	change_variable = { name = tv_prosperity_score divide = 100 }
      }
      else_if = {
      	limit = { government_type = government_type:theocracy }
      	set_variable = { name = tv_gov_power value = devotion }
      	change_variable = { name = tv_prosperity_score multiply = var:tv_gov_power }
      	change_variable = { name = tv_prosperity_score divide = 100 }
      }
      else_if = {
      	limit = { government_type = government_type:tribe }
      	set_variable = { name = tv_gov_power value = tribal_cohesion }
      	change_variable = { name = tv_prosperity_score multiply = var:tv_gov_power }
      	change_variable = { name = tv_prosperity_score divide = 100 }
      }
      else_if = {
      	limit = { government_type = government_type:steppe_horde }
      	set_variable = { name = tv_gov_power value = horde_unity }
      	change_variable = { name = tv_prosperity_score multiply = var:tv_gov_power }
      	change_variable = { name = tv_prosperity_score divide = 100 }
      }

    progress_pct_body: |
      # ── Prosperity Victory ────────────────────────────────────────────────────
      # piecewise progress: each milestone band contributes 20%
      if = {
      	limit = {
      		custom_tooltip = {
      			text = TV_HAS_PROSPERITY_SCORE_TT
      			has_variable = tv_prosperity_score
      		}
      	}
      	# Seg 1: 0–2000 → 0–20
      	set_variable = { name = tv_prosperity_progress_pct value = var:tv_prosperity_score }
      	change_variable = { name = tv_prosperity_progress_pct multiply = 20 }
      	change_variable = { name = tv_prosperity_progress_pct divide = 2000 }
      	# Seg 2: 2000–3000 → 20–40
      	if = {
      		limit = { var:tv_prosperity_score >= 2000 }
      		set_variable = { name = tv_prosperity_progress_pct value = var:tv_prosperity_score }
      		change_variable = { name = tv_prosperity_progress_pct subtract = 2000 }
      		change_variable = { name = tv_prosperity_progress_pct multiply = 20 }
      		change_variable = { name = tv_prosperity_progress_pct divide = 1000 }
      		change_variable = { name = tv_prosperity_progress_pct add = 20 }
      	}
      	# Seg 3: 3000–5000 → 40–60
      	if = {
      		limit = { var:tv_prosperity_score >= 3000 }
      		set_variable = { name = tv_prosperity_progress_pct value = var:tv_prosperity_score }
      		change_variable = { name = tv_prosperity_progress_pct subtract = 3000 }
      		change_variable = { name = tv_prosperity_progress_pct multiply = 20 }
      		change_variable = { name = tv_prosperity_progress_pct divide = 2000 }
      		change_variable = { name = tv_prosperity_progress_pct add = 40 }
      	}
      	# Seg 4: 5000–7000 → 60–80
      	if = {
      		limit = { var:tv_prosperity_score >= 5000 }
      		set_variable = { name = tv_prosperity_progress_pct value = var:tv_prosperity_score }
      		change_variable = { name = tv_prosperity_progress_pct subtract = 5000 }
      		change_variable = { name = tv_prosperity_progress_pct multiply = 20 }
      		change_variable = { name = tv_prosperity_progress_pct divide = 2000 }
      		change_variable = { name = tv_prosperity_progress_pct add = 60 }
      	}
      	# Seg 5: 7000–11000 → 80–100
      	if = {
      		limit = { var:tv_prosperity_score >= 7000 }
      		set_variable = { name = tv_prosperity_progress_pct value = var:tv_prosperity_score }
      		change_variable = { name = tv_prosperity_progress_pct subtract = 7000 }
      		change_variable = { name = tv_prosperity_progress_pct multiply = 20 }
      		change_variable = { name = tv_prosperity_progress_pct divide = 4000 }
      		change_variable = { name = tv_prosperity_progress_pct add = 80 }
      	}
      	if = { limit = { var:tv_prosperity_progress_pct > 100 } set_variable = { name = tv_prosperity_progress_pct value = 100 } }
      }

    extra_loc_keys: []

    loc:
      title:
        en: "Prosperity Victory"
        zh: "繁荣胜利"
      description:
        en: "True greatness is not measured in miles of conquest, but in the full granaries, the thriving towns, and the flourishing of a people who want for nothing."
        zh: "真正的伟大，不以征服的里程衡量，而在于粮仓充盈、城镇兴旺，以及无所匮乏的子民。"
      flavor:
        en: '"Prosperity is the fruit of labour." — Thucydides'
        zh: '"繁荣是劳动的果实。" — 修昔底德'
      overview_card:
        title:
          en: "[tv_prosperity_victory|E]：Granaries Full, Cities Awake"
          zh: "[tv_prosperity_victory|E]：粮仓充盈，城镇苏醒"
        playstyle:
          en: "Playstyle: cultivate a stable, well-governed realm where population, taxes, development, and construction capacity compound into domestic supremacy."
          zh: "玩法风格：经营稳定且治理良好的国家，让人口、税基、发展度与建设能力共同滚成国内优势。"
        formula:
          en: "Progress formula: [tv_prosperity_score|e] = ([population|e] + total owned-location [development|e] + country tax base) × 50/(owned [location|e]s + 50) × (100 + stability)/100 × [government_power|e]/100; victory progress is the current milestone segment's linear share, capped at 100%."
          zh: "进程公式：[tv_prosperity_score|e] = （总[population|e] + 直属地点[development|e]总和 + 国家税基） × 50/（直属[location|e]数量 + 50） × （100 + 稳定度）/100 × [government_power|e]/100；胜利进度按当前里程碑段线性折算，上限100%。"
      progress_display:
        en: "[tv_prosperity_score|e]: [Country.MakeScope.GetVariable('tv_prosperity_score').GetValue|0] / 11,000"
        zh: "[tv_prosperity_score|e]：[Country.MakeScope.GetVariable('tv_prosperity_score').GetValue|0] / 11,000"

    milestones:
      - n: 1
        is_short_term: false
        is_long_term: false
        threshold: 2000
        extra_trigger_block: null
        reward_options:
          - modifier:
              global_monthly_prosperity: 0.001
          - modifier:
              global_population_growth: 0.001
          - modifier:
              global_monthly_development: 0.001
        unlock_body: null
        loc:
          title:
            en: "Prosperity Victory — Milestone 1"
            zh: "繁荣胜利 — 里程碑一"
          meaning:
            en: "The first signs of [prosperity|e]: fields yield more, towns grow, and [population|e] swells. Score ~2,000."
            zh: "[prosperity|e]的初兆：田野更加丰饶，城镇日益壮大，[population|e]持续增长。分数约2,000。"
          trigger_desc:
            en: "[tv_prosperity_score|e] ≥ 2,000"
            zh: "[tv_prosperity_score|e] ≥ 2,000"
          event_title:
            en: "[tv_prosperity_victory|E]：A Nation Begins to Thrive"
            zh: "[tv_prosperity_victory|E]：国家开始兴旺"
          event_desc:
            en: "The first signs are humble, which is why they matter. Fields that once barely met the tithe now leave grain in reserve, market streets stay loud after sunset, and families speak of next year with less caution than before. Tax collectors notice steadier payments, builders notice fuller order books, and magistrates notice fewer desperate petitions. This is [tv_prosperity_victory|E] in its earliest language: bread, roofs, tools, and time. It is not yet glory, but it is the soil from which glory grows. A realm that can feed hope can begin to build wonders."
            zh: "最初的迹象并不壮丽，也正因如此才显得重要。昔日勉强缴足什一税的田地，如今还能留下余粮；市街在日落后依然喧闹；家户谈起明年时，语气比以往少了几分谨慎。税吏看见更稳定的缴纳，建筑匠看见更厚的订册，地方官看见更少绝望的请愿。这就是[tv_prosperity_victory|E]最早的语言：面包、屋顶、工具与时间。它还不是荣耀，却是荣耀生长的土壤。一个能喂养希望的国家，才有资格开始建造奇迹。"
          event_option:
            en: "Count every full granary as a promise."
            zh: "把每一座满仓都记作承诺。"

      - n: 2
        is_short_term: false
        is_long_term: false
        threshold: 3000
        extra_trigger_block: null
        reward_options:
          - modifier:
              tax_income_efficiency: 0.025
          - modifier:
              global_production_efficiency: 0.05
          - modifier:
              global_raw_material_output: 0.10
        loc:
          title:
            en: "Prosperity Victory — Milestone 2"
            zh: "繁荣胜利 — 里程碑二"
          meaning:
            en: "A flourishing realm — sustained [development|e] and investment in [building|e]s bears tangible fruit. Score ~3,000."
            zh: "兴旺发达的王国——对[development|e]与[building|e]的持续投入已结出丰硕果实。分数约3,000。"
          trigger_desc:
            en: "[tv_prosperity_score|e] ≥ 3,000"
            zh: "[tv_prosperity_score|e] ≥ 3,000"
          event_title:
            en: "[tv_prosperity_victory|E]：A Flourishing Realm"
            zh: "[tv_prosperity_victory|E]：蓬勃发展的王国"
          event_desc:
            en: "Sustained investment has changed the sound of the country. Hammers answer bells, carts answer harvest songs, and new [building|e]s climb above streets that once ended in mud. The [population|e] swells not as a burden, but as proof that households believe the future can be afforded. Travelers crossing our borders no longer speak only of soldiers or ceremonies; they speak of workshops, canals, granaries, and the visible [wealth|e] of ordinary districts. Every road improvement shortens a quarrel with distance. Every town improvement teaches the countryside to expect more. The realm is not merely richer; it is learning how to turn riches into structure."
            zh: "持续投入已经改变了国家的声音。锤声应和钟声，车轮应和丰收歌声，新的[building|e]矗立在昔日泥路尽头的街巷之上。[population|e]增长不再只是负担，而成为家户相信未来可被承担的证明。跨过边境的旅人不再只谈士兵或典礼，他们谈论作坊、运河、粮仓，以及普通地区肉眼可见的[wealth|e]。每一段道路修整都缩短了与距离的争执。每一座城镇改善都让乡野学会期待更多。国家不只是更富有，它正在学习如何把财富变成结构。"
          event_option:
            en: "Let timber, stone, and wages keep speaking."
            zh: "让木石与工钱继续发声。"

      - n: 3
        is_short_term: true
        is_long_term: false
        threshold: 5000
        extra_trigger_block: null
        reward_options:
          - modifier:
              global_build_buildings_efficiency: 0.10
          - modifier:
              global_max_rgo_size_modifier_in_rural: 0.20
          - modifier:
              global_max_rgo_size_modifier_in_non_rural: 0.20
        loc:
          title:
            en: "Prosperity Victory — Short-term Victory"
            zh: "繁荣胜利 — 短期胜利"
          meaning:
            en: "A prosperous heartland that sets the standard for the age. Short-term Victory. Score ~5,000."
            zh: "繁荣的腹地，为这个时代树立了标杆。短期胜利。分数约5,000。"
          trigger_desc:
            en: "[tv_prosperity_score|e] ≥ 5,000"
            zh: "[tv_prosperity_score|e] ≥ 5,000"
          event_title:
            en: "[tv_prosperity_victory|E]：The Heartland Thrives"
            zh: "[tv_prosperity_victory|E]：腹地蓬勃兴盛"
          event_desc:
            en: "Our heartland has ceased to look fortunate and begun to look deliberate. Healthy [population|e], vibrant towns, and well-tended fields now reinforce one another so reliably that foreign observers mistake our routines for natural abundance. The baker, the mason, the magistrate, and the canal keeper each handle a small part of the same machine. This is the short-term crest of [tv_prosperity_victory|E]: a country whose domestic strength no longer depends on one brilliant season or one favored city. Even unrest finds fewer cracks to enter, because ordinary life has acquired weight and expectation. The state has built a floor beneath ambition, and that floor is crowded with people who intend to stand on it."
            zh: "我们的腹地已经不再像是幸运，而像是有意造就的成果。健康的[population|e]、活跃的城镇与精心耕耘的田地彼此支撑，稳定到让外国观察者误以为这只是天然丰饶。面包师、石匠、地方法官与运河看守，各自掌管着同一台机器的一小部分。这便是[tv_prosperity_victory|E]的短期高峰：一个国内力量不再依赖某个丰年或某座宠城的国家。即便动乱也更难找到裂缝，因为日常生活已经拥有了重量与期待。国家在雄心之下铺起了一层地基，而这地基上站满了打算继续生活的人。"
          event_option:
            en: "Build higher on this living foundation."
            zh: "在这片有生命的根基上继续向上建造。"

      - n: 4
        is_short_term: false
        is_long_term: false
        threshold: 7000
        extra_trigger_block: null
        reward_options:
          - modifier:
              global_distance_from_capital_speed_propagation: 0.10
          - modifier:
              land_cost_on_distance_from_capital_speed_propagation: 0.20
          - modifier:
              sea_cost_on_distance_from_capital_when_maritime: -1
        loc:
          title:
            en: "Prosperity Victory — Milestone 4"
            zh: "繁荣胜利 — 里程碑四"
          meaning:
            en: "An advanced nation — neighbouring powers envy your [population|e] and the splendour of your towns. Score ~7,000."
            zh: "先进的国家——邻国艳羡你的[population|e]与城镇之辉煌。分数约7,000。"
          trigger_desc:
            en: "[tv_prosperity_score|e] ≥ 7,000"
            zh: "[tv_prosperity_score|e] ≥ 7,000"
          event_title:
            en: "[tv_prosperity_victory|E]：An Advanced Nation"
            zh: "[tv_prosperity_victory|E]：先进的国家"
          event_desc:
            en: "Neighboring courts have begun to send envoys who claim to study etiquette while counting our warehouses. They see cities that compete with capitals, villages tied into markets, and a [population|e] numerous enough to frighten soldiers yet well-fed enough to frighten economists. Our [prosperity|e] has become a diplomatic fact, something rivals must explain to their own subjects. Still, abundance has its own appetite. More roads demand more stones, more towns demand more rules, and more wealth demands a state clever enough not to drown in its own success. The summit is visible now, which means the climb has become less forgiving."
            zh: "邻国宫廷开始派来声称研究礼仪的使节，却在暗中清点我们的仓库。他们看见足以与首都竞辉的城市、被市场联结的村庄，以及多到令士兵不安、又丰衣足食到令财政家不安的[population|e]。我们的[prosperity|e]已经成为外交事实，成为竞争者必须向本国臣民解释的东西。然而丰裕也有自己的胃口。更多道路需要更多石料，更多城镇需要更多规则，更多财富需要一个足够聪明、不会淹没在自身成功中的国家。顶峰已经看得见了，这也意味着攀登再无宽容可言。"
          event_option:
            en: "Make envy our most reliable export."
            zh: "让艳羡成为我们最稳定的出口品。"

      - n: 5
        is_short_term: false
        is_long_term: true
        threshold: 11000
        extra_trigger_block: null
        reward_options:
          - modifier:
              global_estate_max_tax: 0.50
          - modifier:
              global_estate_target_satisfaction: 0.10
          - modifier:
              monthly_inflation: -0.001
        loc:
          title:
            en: "Prosperity Victory — Long-term Victory"
            zh: "繁荣胜利 — 长期胜利"
          meaning:
            en: "The most [development|e]-advanced nation on earth, its [wealth|e] and [population|e] unrivalled. Long-term Victory. Score ~11,000."
            zh: "地球上[development|e]程度最高的国家，其[wealth|e]与[population|e]无可比拟。长期胜利。分数约11,000。"
          trigger_desc:
            en: "[tv_prosperity_score|e] ≥ 11,000"
            zh: "[tv_prosperity_score|e] ≥ 11,000"
          event_title:
            en: "[tv_prosperity_victory|E]：Long-term Victory — The Most Developed Nation"
            zh: "[tv_prosperity_victory|E]：长期胜利 — 最繁荣的国家"
          event_desc:
            en: "No nation in the known world now rivals the [prosperity|e] of our realm. Our people are numerous without being merely crowded, our towns are rich without being merely swollen, and our lands have been worked until improvement itself seems like a civic instinct. Foreign merchants arrive expecting profit and leave describing order; foreign princes arrive expecting spectacle and leave describing permanence. This is [tv_prosperity_victory|E] fulfilled, not as a single marvel, but as a civilization of maintained abundance. The barns are full, the workshops are loud, the tax rolls are legible, and even ambition has learned to wait its turn in the queue of public works. History will not remember us only for what we conquered or commanded. It will remember that, for a time, human life under our rule looked more possible than anywhere else."
            zh: "已知世界中，已无任何国家能与我国的[prosperity|e]相媲美。我们的人民众多却不只是拥挤，我们的城镇富庶却不只是膨胀，我们的土地被经营到仿佛改良本身已成为公民本能。外国商人怀着利润预期而来，却带着对秩序的描述离去；外国王公怀着观赏奇景的预期而来，却带着对恒久的描述离去。这是[tv_prosperity_victory|E]的完成，不是单一奇迹，而是一整套被维持的丰裕文明。粮仓充盈，工坊喧响，税册清晰，甚至雄心也学会在公共工程的队伍里等待轮次。历史不会只因我们征服或号令过什么而记住我们。它会记住，在某一段时间里，我们统治下的人类生活比任何地方都更像是可能的。"
          event_option:
            en: "Let plenty become the monument."
            zh: "让丰裕本身成为纪念碑。"

