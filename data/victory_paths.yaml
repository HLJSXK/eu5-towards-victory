          global_max_literacy: 0.20
        modifier_name:
          en: "Industrial Vanguard"
          zh: "工业先驱"
        loc:
          title:
            en: "Scientific Victory — Long-term Victory"
            zh: "科技胜利 — 长期胜利"
          meaning:
            en: "The nation that ushered in the Industrial Age. Long-term Victory. ~400 advances researched."
            zh: "开创工业时代的国度。长期胜利。约已研究400项技艺。"
          trigger_desc:
            en: "[tv_science_score|e] ≥ 400 and Academy Level ≥ 5"
            zh: "[tv_science_score|e] ≥ 400，科学院等级 ≥ 5"
          event_title:
            en: "Long-term Victory — The Industrial Vanguard"
            zh: "长期胜利 — 工业先驱"
          event_desc:
            en: "Four hundred advances. Steam, iron, and the rational mind have remade our nation. Long after the old empires crumble, the knowledge forged in our academies will transform the world entire."
            zh: "四百项技艺。蒸汽、钢铁与理性的思维已彻底改造了我们的国度。旧帝国相继崩塌之后，在我们学院中铸就的知识，将永远改变整个世界。"
          event_option:
            en: "Our name shall be synonymous with progress itself."
            zh: "我们的名字将与进步本身永远共存。"

# ─────────────────────────────────────────────────────────────────────────────
# ON-ACTION HOOKS
# 1对1: effect_body stored verbatim; generator wraps in hook = { effect = { ... } }
# ─────────────────────────────────────────────────────────────────────────────
on_actions:
  - hook: on_royal_marriage
    effect_body: |
      scope:actor = {
      	if = {
      		limit = { NOT = { has_variable = tv_diplomatic_victory_points } }
      		set_variable = { name = tv_diplomatic_victory_points value = 0 }
      	}
      	change_variable = { name = tv_diplomatic_victory_points add = 3 }
      }
      scope:recipient = {
      	if = {
      		limit = { NOT = { has_variable = tv_diplomatic_victory_points } }
      		set_variable = { name = tv_diplomatic_victory_points value = 0 }
      	}
      	change_variable = { name = tv_diplomatic_victory_points add = 3 }
      }

  - hook: on_winning_war
    effect_body: |
      scope:winner = {
      	if = {
      		limit = { NOT = { has_variable = tv_diplomatic_victory_points } }
      		set_variable = { name = tv_diplomatic_victory_points value = 0 }
      	}
      	change_variable = { name = tv_diplomatic_victory_points add = 5 }
      }

  - hook: on_work_of_art_created
    effect_body: |
      root.owner ?= {
      	if = {
      		limit = { NOT = { has_variable = tv_cultural_influence_points } }
      		set_variable = { name = tv_cultural_influence_points value = 0 }
      	}
      	change_variable = { name = tv_cultural_influence_points add = 10 }
      }

