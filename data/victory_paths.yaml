        reward_options:
          - modifier:
              research_speed_modifier: 0.10
          - modifier:
              research_speed: 0.10
          - modifier:
              global_pop_promotion_speed_modifier: 0.50
        loc:
          title:
            en: "Scientific Victory — Long-term Victory"
            zh: "科技胜利 — 长期胜利"
          meaning:
            en: "The nation that ushered in the Industrial Age — four hundred [advance|e]s. Long-term Victory. The future belongs to you."
            zh: "开创工业时代的国度——四百项[advance|e]。长期胜利。未来属于你。"
          trigger_desc:
            en: "[tv_science_score|e] ≥ 400"
            zh: "[tv_science_score|e] ≥ 400"
          extra_trigger_desc:
            en: "[tv_academy_of_sciences|E] Level ≥ 5"
            zh: "[tv_academy_of_sciences|E]等级 ≥ 5"
          event_title:
            en: "[tv_science_victory|E]：Long-term Victory — The Industrial Vanguard"
            zh: "[tv_science_victory|E]：长期胜利 — 工业先驱"
          event_desc:
            en: "Four hundred [advance|e]s now mark the long road from curiosity to transformation. Steam, iron, disciplined experiment, careful records, and the rational mind have remade our nation from its workshops outward. The [tv_academy_of_sciences|E] has become more than a school or society; it is the place where the future negotiates with the present and usually wins. Old empires may still count cavalry, titles, and ceremonies, but the world has begun to count pressure, literacy, engines, tolerances, and repeatable proof. This is [tv_science_victory|E] fulfilled. Long after older powers crumble, knowledge forged in our academies will continue to change how people work, heal, travel, govern, and imagine the possible."
            zh: "四百项[advance|e]如今标记着从好奇到改造的漫长道路。蒸汽、钢铁、有纪律的实验、细致的记录与理性思维，已经从工坊向外彻底重塑我们的国家。[tv_academy_of_sciences|E]已不只是学校或会社；它是未来与现在谈判、并且通常获胜的地方。旧帝国或许仍在清点骑兵、头衔与典礼，但世界已经开始清点压力、识字率、机器、误差与可重复的证明。这就是[tv_science_victory|E]的完成。旧日强权崩塌许久之后，在我们学院中锻造的知识仍会继续改变人们如何工作、治病、旅行、治理，以及想象可能。"
          event_option:
            en: "Let tomorrow cite us in its footnotes."
            zh: "让明日在脚注中引用我们。"

# ─────────────────────────────────────────────────────────────────────────────
# ON-ACTION HOOKS
# 1-to-1: effect_body stored verbatim; generator wraps it in a TV-owned callback.
# Vanilla hardcoded hooks receive only on_actions = { callback } delegates.
# ─────────────────────────────────────────────────────────────────────────────
on_actions:
  - hook: yearly_country_pulse
    callback: tv_science_victory_yearly_pulse
    effect_body: |
      if = {
        limit = { is_ai = no }
        tv_update_science_score_effect = yes
        tv_check_science_milestones_effect = yes
        tv_update_all_progress_pct_effect = yes
      }

  - hook: on_work_of_art_created
    effect_body: |
      root.owner ?= {
        tv_change_cultural_influence_points_effect = { value = 3 }
      }
