name: Deploy Unique Wonders Site

on:
  push:
    branches: [main]
    paths:
      - "unique_wonders_site/dist/**"
      - ".github/workflows/deploy-unique-wonders.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      
      - name: Debug checkout
        run: |
          pwd
          git rev-parse --show-toplevel
          git rev-parse HEAD
          git branch --show-current || true
          git ls-tree -r --name-only HEAD | grep -E '^unique_wonders_site/(dist|Dist)/' | head -50 || true
          find . -maxdepth 4 -type d | sort | grep -E 'unique|wonder|dist' || true

      - name: Disable Jekyll
        run: touch unique_wonders_site/dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: unique_wonders_site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
