# Central routing table for scripts/ai_context.py.
# Keep this operational: match rules, reason, risk card, and short summary.

mod_roots:
  - src
  - src_engineering_department
  - src_court_positions
  - src_eureka

core_reads:
  - path: CLAUDE.md
    reason: compact mandatory workflow entry point
  - path: docs/knowledge/BRIEF.md
    reason: compact project-wide gotchas and indexes

project_overview:
  path: docs/knowledge/PROJECT_OVERVIEW.md
  reason: current project state, deployable roots, and directory map

cross_surface_audits:
  eureka_advance_surfaces:
    instruction: Treat Advance as the EU5 research-project concept; inspect every listed surface before deciding what is affected, and record an explicit reason for any surface left unchanged.
    paths:
      - src_eureka/in_game/gui/technology_lateralview.gui
      - src_eureka/in_game/gui/advances_lateralview.gui
      - src_eureka/in_game/gui/agenda_view.gui
      - src_eureka/in_game/gui/hud_topbar.gui
      - src_eureka/main_menu/gui/shared/advances_tooltips.gui
      - scripts_eureka/patch_gui_progress.py

subprojects:
  - id: main_mod
    path_prefixes: [src, scripts]
    path_exact:
      - data/victory_paths.yaml
      - data/io_establishment.yaml
      - data/io_leaders.yaml
      - data/pulse_registry.yaml
      - data/locked_advances.yaml
      - data/research_d_events.yaml
      - data/academy_laws.yaml
      - data/govhouse_laws.yaml
      - data/trade_league_laws.yaml
      - data/trade_league_goods.yaml
      - data/trade_chain.yaml
      - data/philosophy_debates.yaml
      - data/cmf_warning_suppressions.yaml
    exclude_paths:
      - data/wonders.yaml
      - data/wonder_final_buildings.yaml
      - data/wonder_generic_rituals.yaml
      - data/wonder_base_modifiers.yaml
      - data/wonder_site_rules.yaml
      - data/unique_wonders.yaml
      - data/court_positions.yaml
    overview: docs/knowledge/subprojects/main_mod.md
    summary: core Towards Victory mod, victory paths, research, IOs, and shared infrastructure
    reason: detailed main-mod state, ownership boundaries, and generated-data map
  - id: engineering_department
    path_prefixes: [src_engineering_department, scripts_engineering_department]
    overview: docs/knowledge/subprojects/engineering_department.md
    summary: standalone Wonder Construction and Engineering Department mod
    reason: detailed wonder mechanics, GUI, generators, and ownership boundaries
  - id: court_positions
    path_prefixes: [src_court_positions, scripts_court_positions]
    overview: docs/knowledge/subprojects/court_positions.md
    summary: standalone CMF-backed court-office situation mod
    reason: detailed office data, generated scripts, situation GUI, and lifecycle
  - id: eureka
    path_prefixes: [src_eureka, scripts_eureka]
    overview: docs/knowledge/subprojects/eureka.md
    reads:
      - path: docs/knowledge/eureka_gui_maintenance.md
        reason: verified Eureka GUI ownership and Advance display-surface boundaries
    summary: standalone Eureka research-project conditions, effects, and cross-surface GUI
    reason: detailed Eureka state plus the complete Advance GUI surface map

ownership_routes:
  - id: eureka_gui_codegen
    path_prefixes:
      - src_eureka/in_game/gui/
      - src_eureka/main_menu/gui/shared/
    owner: scripts_eureka/patch_gui_progress.py
    reason: Eureka GUI outputs are regenerated from vanilla files by the checked-in patcher

domain_routes:
  - id: generic_actions
    expand_mod_roots: true
    path_prefixes: [in_game/common/generic_actions/]
    card: generic_actions.md
    summary: selector and hover pre-evaluation risks
    reason: generic actions are pre-evaluated before final click

  - id: gui
    expand_mod_roots: true
    path_prefixes: [in_game/gui/]
    card: gui.md
    summary: GUI expression, datacontext, layout, and tooltip constraints
    reason: GUI expression failures are often silent

  - id: eureka_advance_backend
    path_prefixes:
      - src_eureka/in_game/common/advances/
      - src_eureka/in_game/common/scripted_triggers/
      - src_eureka/in_game/common/scripted_effects/
      - src_eureka/in_game/common/on_action/
    card: eureka_advance_surfaces.md
    summary: Eureka Advance backend changes must be reviewed with all display surfaces
    reason: Eureka research-project state crosses backend and GUI boundaries
    cross_surface_audit: eureka_advance_surfaces

  - id: international_organizations
    expand_mod_roots: true
    path_prefixes:
      - in_game/common/international_organizations/
      - in_game/common/laws/
      - in_game/common/country_interactions/
    card: international_organizations.md
    summary: non-unique TV IO scope, leader, law, and monthly-change invariants
    reason: IO scope and AI pre-evaluation are high risk

  - id: events
    expand_mod_roots: true
    path_prefixes: [in_game/events/]
    card: events.md
    summary: event option hover can pre-evaluate visible and hidden effect chains
    reason: event option tooltips evaluate more than final-click code

  - id: on_action
    expand_mod_roots: true
    path_prefixes: [in_game/common/on_action/]
    card: on_action.md
    summary: bridge-registry, root scope, and one-day monthly event delay rules
    reason: shared hardcoded hooks can conflict or run from unexpected roots

  - id: localization
    expand_mod_roots: true
    path_prefixes: [main_menu/localization/]
    card: localization.md
    summary: BOM, quote, loc key, and semantic color-tag rules
    reason: localization parser failures cascade into UI errors

  - id: wonder_buildings
    expand_mod_roots: true
    path_prefixes:
      - in_game/common/building_types/
      - in_game/common/auto_modifiers/
      - main_menu/common/static_modifiers/
      - main_menu/common/modifier_type_definitions/
      - main_menu/common/modifier_icons/
      - main_menu/common/prices/
    filename_substrings: [wonder, engineering_department]
    card: wonder_buildings.md
    summary: wonder building lifecycle, price, modifier, and labor/input rules
    reason: wonder building or modifier data touched

  - id: wonder_gui
    expand_mod_roots: true
    path_prefixes:
      - in_game/gui/
      - main_menu/gui/
      - main_menu/localization/
    filename_substrings: [wonder, engineering_department, location_window, encyclopedia_lateralview]
    card: wonder_gui.md
    summary: wonder GUI override, tooltip scope, layout, and icon-routing rules
    reason: wonder GUI or GUI-facing localization touched

filename_routes:
  - id: wonders
    substrings: [wonder, engineering_department]
    card: wonders.md
    summary: Engineering Department and wonder-construction top-level invariants
    reason: wonder files are interspersed across many directories

  - id: philosophy_debate
    substrings: [philosophy_debate, world_debate, academy_debate]
    card: philosophy_debate.md
    summary: generated debate seat/event/stance and world debate rules
    reason: debate files are filename-routed instead of directory-isolated

  - id: trade_league
    substrings: [trade_league, trade_chain]
    card: trade_league.md
    summary: Trade League chain, monopoly, and network state rules
    reason: Trade League files are filename-routed instead of directory-isolated

  - id: europedia
    substrings: [encyclopedia_lateralview]
    card: europedia.md
    summary: full-panel override and tab-toggle constraints
    reason: Europedia has no data-driven custom-tab registration point

  - id: wonder_ceremony
    substrings:
      - wonder_ceremony
      - ceremony_cost
      - wonder_ritual
      - unique_wonders
    card: wonder_ceremony.md
    summary: ceremony cost schema, option text, and hidden-scheduler rules
    reason: ceremony or ritual shared data touched

  - id: wonder_unique_rituals
    substrings:
      - unique_wonder_ritual
      - wonder_unique_
      - pharos
      - hagia
    card: wonder_unique_rituals.md
    summary: bespoke unique-ritual implementation and audit rules
    reason: bespoke unique-wonder ritual source or output touched

  - id: eureka_advance_surfaces
    substrings:
      - advances_lateralview
      - technology_lateralview
      - agenda_view
      - hud_topbar
      - advances_tooltips
    card: eureka_advance_surfaces.md
    summary: Advance research-project display spans every Eureka GUI surface, not one lateral view
    reason: an Advance-related GUI file may be one part of a cross-surface feature
    cross_surface_audit: eureka_advance_surfaces

content_routes:
  - id: variable_map
    markers:
      - variable_map(
      - global_variable_map(
      - local_variable_map(
      - add_to_variable_map
      - add_to_global_variable_map
      - add_to_local_variable_map
      - is_key_in_variable_map
      - is_key_in_global_variable_map
      - random_key_in_variable_map
    excluded_prefixes:
      - docs/
      - tests/
      - reference_game_files/
      - reference_mods/
    excluded_paths:
      - CLAUDE.md
      - scripts/ai_context.py
    reads:
      - path: docs/technical/EU5_Modding_Knowledge_Base.md section 5.2 Variable maps
        reason: variable-map scope-link and RHS rules
      - path: docs/knowledge/anti_patterns.yaml rule variable_map_scope_link_used_direct_rhs
        reason: direct map RHS/effect-parameter use is unsafe
    reason: file content uses variable-map APIs

keyword_routes:
  - id: eureka_advance_concept
    keywords: [advance, advances, research, research_project, eureka, guilds, current_research]
    reads:
      - path: docs/knowledge/subprojects/eureka.md
        reason: Advance is the EU5 research-project concept and Eureka owns a cross-surface implementation of it
      - path: docs/knowledge/eureka_gui_maintenance.md
        reason: Advance is a research-project concept with multiple GUI owners and generator ownership
    card: eureka_advance_surfaces.md
    summary: route the full Advance/Eureka concept context even when only one surface is named
    reason: prevent conceptual narrowing of Advance to advances_lateralview.gui
    cross_surface_audit: eureka_advance_surfaces

object_alerts:
  - id: object_on_built
    severity: high
    markers: [on_built]
    expand_mod_roots: true
    path_prefixes:
      - in_game/common/building_types/
      - scripts/in_game/common/building_types/
      - scripts_engineering_department/in_game/common/building_types/
      - scripts_court_positions/in_game/common/building_types/
      - data/
    file_suffixes: [.txt, .py, .yaml]
    excluded_prefixes:
      - docs/
      - tests/
      - reference_game_files/
      - reference_mods/
    card: object_on_built.md
    summary: on_built is not a reliable upgrade-completion signal
    reason: building lifecycle hook touched
    message: If a building can be upgraded or reused, do not use on_built as the only completion signal; verify on_construction_ended and do not assume location_building_level has already updated.

maintenance_routes:
  - id: ai_workflow
    path_prefixes:
      - docs/knowledge/
      - docs/guides/
      - scripts/ai_context.py
      - scripts/gen_brief.py
      - CLAUDE.md
    reads:
      - path: CLAUDE.md
        reason: workflow maintenance protocol
      - path: docs/guides/AI_Tool_Workflow_Prompt.md
        reason: external AI-tool prompt must match routing behavior
    reason: AI workflow or knowledge file touched
