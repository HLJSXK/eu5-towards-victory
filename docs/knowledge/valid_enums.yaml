# EU5 Valid Enum Values
# =====================
# Authoritative whitelist of enum values that must be verified before use.
# Feed into scripts/validate.py and scripts/gen_brief.py.
#
# Source: reference_game_files/ and reference_official_defines/
# Verified: 2026-04-21

location_rank:
  values:
    - rural_settlement
    - town
    - city
  source: "reference_game_files/game/in_game/common/building_types/unique_buildings.txt"
  notes: "Only 3 valid ranks in EU5. EU4 names (village, hamlet, metropolis) cause silent failures."

government_type:
  values:
    - monarchy
    - republic
    - theocracy
    - tribe
    - steppe_horde
  source: "reference_game_files/game/in_game/common/government_types/00_default.txt"
  notes: "Government type IDs for trigger: government_type = government_type:X. Use exact IDs — not pluralized (monarchies/republics). steppe_horde is the horde subtype."

