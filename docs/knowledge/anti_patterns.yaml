- id: unique_wonder_ceremony_stage_cost_must_have_exactly_one_entry
  pattern: cost:\s*\n(\s*- catalog:.*\n.*\n.*\n){2,}
  detectability: lint
  bad: Authoring `ceremony.stages[i].cost` in `data/unique_wonders.yaml` with 2 entries (e.g. one `country_reward`/`local_reward`/`character_reward`
    resource cost plus one `country_modifier`/`local_modifier` debuff) instead of exactly 1.
  correction: The Unique Wonder Ceremony's 8-stage design (docs/knowledge/risk_cards/wonders.md rule 20) requires **exactly
    one** authored cost per stage — odd steps (1/3/5/7) at ×1 magnitude, even steps (2/4/6/8) at ×2 magnitude via `ceremony_cost_stage_multiplier`
    — with steps 2/4/8 additionally carrying the one-time/local-building/national reward channels. `_validate_ceremony_stage_cost`
    in `scripts_engineering_department/wonder_mechanics/_core.py` previously allowed `1-2` entries, which let 120 of 121 wonders
    (740 of 968 stages) drift to 2 costs per stage during initial authoring; the generator (`wonder_ceremony_lib.py:ceremony_cost_effect_lines`)
    faithfully emitted every authored entry, so players saw 2 cost lines in the pay-option tooltip instead of 1. Fixed by
    tightening the validator to `len(items) != 1` (hard error) and re-authoring all 120 wonders via a per-wonder judgment
    pass (matching each stage's narrative flavor to the single cost that fits best) through `scripts_engineering_department/wonder_mechanics/merge_ceremony_cost_options.py`.
    When authoring or reviewing new `ceremony.stages[i].cost` entries, always author (and expect) exactly 1 `{catalog, type}`
    per stage — the validator now rejects 0, 2, or more.
  category: script
  scope: any
  source: data/unique_wonders.yaml ceremony.stages[*].cost; scripts_engineering_department/wonder_mechanics/_core.py:_validate_ceremony_stage_cost;
    scripts_engineering_department/wonder_mechanics/merge_ceremony_cost_options.py; docs/knowledge/risk_cards/wonders.md rule
    20
  notes: '2026-07-15: user reported ''很多步骤有两个代价'' (many steps have two costs) against the original 1-cost-per-step / 2-4-8-reward-channel
    / odd-1x-even-2x design. Confirmed 740/968 ceremony stages had 2 cost entries. User directed a per-stage judgment pass
    (pick whichever cost fits that stage''s own title/desc narrative) rather than a mechanical positional rule, since the
    2-cost pairs had no consistent catalog ordering. Fanned out 10 parallel agents (one per ~12-wonder batch) to decide per
    stage, merged via merge_ceremony_cost_options.py, then tightened the schema validator so this can''t silently reappear.'
- id: unreleased_project_compatibility_layer
