- id: custom_tooltip_do_not_remove
  pattern: ''
  bad: "Removing custom_tooltip from event options (wrong fix for dotted key confusion)"
  correction: "Keep custom_tooltip; verify key format via Step 2/3 — dotted suffix IS valid in event options"
  category: gui
  scope: any
  source: "reference_game_files/game/in_game/common/character_interactions/ali_qushji_settles.txt"
  notes: "AI wrongly removed custom_tooltip thinking dotted key format was invalid. Never remove; only verify format."

- id: event_numeric_id_over_9999
  pattern: ''
  detectability: advisory
  bad: "Generating or referencing an event ID whose numeric part is 10000 or higher, such as tv_engineering_department.50011"
  correction: "EU5 event IDs must be <namespace>.<integer> with the integer below 10000. Do high-cardinality dispatch before firing the event, or branch only over a small non-event-id dimension inside an already typed event."
  category: event
  scope: any
  source: "runtime error.log: jomini_eventmanager.cpp:141, 2026-06-08"
  notes: "The engine logs that five-digit numeric event IDs are invalid and can then report duplicate IDs as parser fallout. scripts/validate.py scans src/data/scripts for dotted event references whose numeric part is >= 10000."

- id: event_option_effect_block_unknown_effect
  pattern: ''
  validator: check_event_option_effect_blocks
  detectability: lint
  only_in_paths: ['events']
  bad: "Putting `effect = { ... }` as a direct child of an event `option = { ... }`"
  correction: "Write effect calls directly in the option block, alongside `name` and optional `trigger` / `hidden_effect`. Use `hidden_effect = { ... }` only when the option chain should be hidden from the tooltip."
  category: event
  scope: country
  source: "runtime error.log: jomini_effect.cpp:556, events/tv_wonder_unique_alhambra_ritual_events.txt:24; fixed 2026-07-07"
  notes: "EU5 parses event option contents as an effect list. A direct child named effect is treated as an effect command named `effect`, which does not exist, producing 'Unknown effect effect'."

- id: scripted_trigger_top_level_in_scripted_effects
  pattern: '^(?![ \t])[A-Za-z0-9_]+_trigger\s*=\s*\{'
  detectability: lint
  only_in_paths: ['scripted_effects']
  bad: "Defining a top-level scripted_trigger-style block inside common/scripted_effects"
  correction: "Generate or move the `_trigger = { ... }` block to common/scripted_triggers, and keep common/scripted_effects for real scripted effects only."
  category: script
  scope: scripted_effects
  source: "runtime error.log: common/scripted_effects/tv_academy_philosophy_debate_effects.txt:5738-5878, 2026-07-07"
  notes: "EU5 parses every top-level block in common/scripted_effects as a scripted effect. If a generated trigger body is placed there, trigger clauses such as has_variable, religious_unity, or any_international_organizations_member_of are parsed as effect commands and log `Unknown effect ...`."

- id: blockoverride_widget_child_invalid
  pattern: 'blockoverride\s+"common_header_text"\s*\{[^}]*text_single'
  bad: "text_single widget inside blockoverride \"common_header_text\""
  correction: "blockoverride overrides a 'text' property value, not a widget container; do not add child widgets"
  category: gui
  scope: any
  source: "reference_game_files/game/main_menu/common/cards.gui:1084"
  notes: "Guessing block structure causes silent failures; always read cards.gui before using blockoverride"

- id: gui_boolean_helper_arity
  pattern: ''
  only_in_paths: ['gui']
  bad: "Using GUI And(...) or Or(...) with three or more operands"
  correction: "Use And3(...) / Or3(...) for exactly three operands, or nest binary And(...) / Or(...) calls for larger expressions."
  category: gui
  scope: any
  source: "runtime error.log: pdx_data_factory.cpp:1401; reference_game_files/game/in_game/gui/panels/organization/members.gui:927"
  notes: "EU5 GUI And() and Or() are binary helpers, not variadic. And(a,b,c) fails conversion with 'Function And expected 2 arguments, got 3'. Pattern left empty because commas inside typed comparison calls make static regex detection noisy."

- id: gui_icon_percent_position_ignored
  pattern: ''
  only_in_paths: ['gui']
  bad: "Using percent position directly on icon widgets for fixed-position overlays"
  correction: "For icon overlays on a fixed-size parent, use pixel positions; if percent placement is needed, put the icon inside a positioned widget wrapper instead."
  category: gui
  scope: any
  source: "runtime UI observation in src/in_game/gui/panels/organization/tv_govhouse.gui; reference_game_files/game/main_menu/gui/shared/progressbars.gui:268-286"
  notes: "Percent position is confirmed on vanilla widget wrappers, but percent position directly on these icon overlays collapsed them to the left edge. Fixed pixel bins are reliable for fixed-width bars."

- id: gui_ignoreinvisible_on_plain_widget
  pattern: ''
  detectability: advisory
  only_in_paths: ['gui']
  bad: "Putting ignoreinvisible on a plain widget/uberwidget"
  correction: "Use ignoreinvisible on layout containers such as hbox/vbox/scrollwidget content, not on a plain image or wrapper widget. To hide an image area, control the parent widget's visible expression and let the actual image children use their own visible expressions."
  category: gui
  scope: any
  source: "runtime error.log: docs/error_log/error.log; fixed in src/in_game/gui/panels/organization/tv_engineering_department.gui"
  notes: "A plain widget logs Property 'ignoreinvisible' not handled and Error setting properties for the uberwidget. The attribute is accepted on layout containers elsewhere in the same panel, but not on the generic image wrapper."

- id: gui_conditional_background_image_needs_explicit_size
  pattern: ''
  detectability: advisory
  only_in_paths: ['gui']
  bad: "Building a conditional background-image column inside a plain widget/button with only expanding layout policies and no explicit image bounds"
  correction: "Give the clickable wrapper and image column fixed bounds, and size each visible background child with fixed pixels that match the content area. Keep the existing card/hbox/vbox structure instead of relying on invisible siblings or layoutpolicy alone to size the preview."
  category: gui
  scope: any
  source: "runtime UI observation in src/in_game/gui/location_window.gui; fixed in scripts/in_game/gui/gen_location_window.py"
  notes: "Conditional background widgets can collapse to the parent's left edge when the visible branch has no explicit size. In the wonder location panel, the plain widget/button wrapper also had to fill the parent before the image column, and the inner preview widgets needed fixed pixel sizes instead of percentage bounds."

- id: gui_location_tooltip_effect_location_owner_link
  pattern: ''
  detectability: advisory
  only_in_paths: ['gui', 'scripted_effects', 'gen_location_window', 'wonder_mechanics']
  bad: "Using location.owner inside a scripted effect rendered by ShowScriptedEffectForScope with LocationView.GetLocation.MakeScope.Self"
  correction: "When the GUI passes the location itself as the effect scope, enter the owning country with owner ?= { ... }. Reserve location.owner for contexts that expose a separate location event target, such as building on_built."
  category: gui
  scope: location
  source: "runtime error.log: Event target link 'location' expected non-location scopes; reference_game_files/game/in_game/common/on_action/_hardcoded.txt:69"
  notes: "In location-window tooltips the scripted effect root is already the location. A dotted location.owner chain is parsed as an event-target link named location, which is invalid from a location root and can also leave COUNTRY.GetName unavailable for add_country_modifier tooltip localization."

- id: gui_raw_text_localization_substitution_literal
  pattern: ''
  detectability: advisory
  only_in_paths: ['gui']
  bad: "Putting $LOCALIZATION_KEY$ substitutions inside raw_text GUI fields"
  correction: "Use a localized text = \"KEY\" field and put inline icons or static text in the localization value, or split dynamic raw text and localized text into separate widgets."
  category: gui
  scope: any
  source: "runtime UI observation in src/in_game/gui/panels/organization/tv_trade_league.gui; fixed by using text fields for TV_TRADE_LEAGUE_WORLD_COLUMN and TV_TRADE_LEAGUE_IO_COLUMN"
  notes: "raw_text renders the string literally; $KEY$ substitutions are not expanded, so the UI displays the key."

- id: prosperity_value_is_fractional
  pattern: ''
  detectability: advisory
  bad: "Treating location prosperity reads as 0..100 percent points, such as dividing an average prosperity value by 100 before using it as a weight"
  correction: "Use the raw signed fractional prosperity value. For recovery priorities, negate the average directly and clamp below 0."
  category: script
  scope: location
  source: "reference_game_files/game/in_game/events/government/societal_values.txt:12373; reference_game_files/game/in_game/events/exploration/exploration_monthly_events.txt:235"
  notes: "Vanilla checks use fractional thresholds such as prosperity < 1 and prosperity < -0.1; an extra divide by 100 makes prosperity-derived weights too small to compete."

- id: trade_monopoly_wrong_goods_metrics
  pattern: ''
  detectability: advisory
  only_in_paths: ['tv_trade_league_effects', 'gen_tv_trade_league_effects']
  bad: "Trade League monopoly control computed from produced/traded/supply market proxies, old global-vs-IO goods totals, or representative-market-only samples"
  correction: "Compute monopoly control from a full scan of world markets using market every_export/every_import routes filtered by goods = goods:<good> and summed with trade_volume. Annual representative markets are display/decision support only."
  category: script
  scope: international_organization
  source: "user-reported runtime behavior in Trade League monopoly metrics (2026-05-22); reference_game_files/game/in_game/events/economy/slave_trade.txt:43-48; reference_game_files/game/in_game/events/government/republic_factions.txt:148"
  notes: "produced_in_market:<good> and goods_demand_in_market(goods:<good>) are valid for weighting origin and consumer control and for choosing representative markets; traded_in_market and goods_supply_in_market are not route volume. Export/transit control uses market every_export trade_volume; consumer control uses market every_import trade_volume."

- id: trade_league_bulk_state_on_io_variables
  pattern: ''
  detectability: advisory
  only_in_paths: ['tv_trade_league.txt', 'gen_tv_trade_league.py', 'gen_tv_trade_league_gui.py', 'gen_tv_trade_league_actions.py', 'gen_tv_trade_league_effects.py']
  bad: "Declaring or reading generated per-good Trade League monopoly/action state as IO variables"
  correction: "Store generated monopoly/action variables on the Trade League leader country; the country monthly pulse should enter the matching leader-owned IO for membership checks, then enter leader_country for state writes, and GUI should read GetInternationalOrganization.GetLeaderCountry.MakeScope.GetVariable(...)."
  category: script
  scope: international_organization
  source: "user-reported runtime stutter from initializing thousands of Trade League IO variables (2026-05-22)"
  notes: "The IO type should remain a light shell with leader/member behavior. Global annual marker variables remain global; per-IO/per-good state lives on the leader country."

- id: trade_league_bulk_maintenance_on_io_monthly_effect
  pattern: ''
  detectability: advisory
  only_in_paths: ['tv_trade_league.txt', 'gen_tv_trade_league.py', 'gen_tv_trade_league_effects.py', 'pulse_registry.yaml']
  bad: "Running generated per-good Trade League monopoly maintenance from the Trade League IO type's monthly_effect"
  correction: "Leave the Trade League IO type without monthly_effect. Register a named monthly_country_pulse hook, save the current country scope, iterate every_international_organizations_member_of filtered to tv_trade_league and leader_country ?= the saved country, then call the IO-scoped monopoly refresh from inside that IO."
  category: script
  scope: international_organization
  source: "user-reported runtime stutter from Trade League IO monthly_effect maintenance (2026-05-22)"
  notes: "For this generated high-cardinality system, even hidden IO monthly maintenance was too expensive. A country pulse turns the work into a cheap country membership/leader check before the heavy IO refresh runs."

- id: monthly_country_pulse_event_without_delay
  pattern: ''
  validator: check_monthly_country_pulse_event_delay
  detectability: lint
  only_in_paths: ['on_action', 'scripted_effects', 'pulse_registry.yaml']
  bad: "Firing an event immediately from a condition path reached by country_monthly_pulse"
  correction: "Use trigger_event_* = { id = <event> days = 1 } for direct event fires, or put delay = { days = 1 } before event entries in native events/random_events blocks."
  category: on_action
  scope: country
  source: "reference_game_files/game/in_game/common/on_action/on_actions.info; reference_mods/3735059838/in_game/common/on_action/MnT_pulse.txt"
  notes: "Monthly country pulse checks and event display should be separated by one day. scripts/validate.py walks monthly_country_pulse registry callbacks and TV helper calls to enforce this."

- id: trade_league_intelligence_merchant_power_stale
  pattern: ''
  detectability: advisory
  only_in_paths: ['tv_trade_league_effects', 'gen_tv_trade_league_effects']
  bad: "Refreshing Trade League commercial-intelligence merchant power by repeatedly adding a temporary months=2 modifier, or adding permanent merchant power without first clearing the keyed state."
  correction: "For each monthly intelligence refresh, clear only the tv_trade_intelligence_network merchant-power key from previously tracked markets, then reapply months = -1 merchant power for current Trade League members only when the current floor strength is at least 1. Also clear that same key when the Grand Merchant becomes invalid."
  category: script
  scope: international_organization
  source: "fixed in scripts/in_game/common/scripted_effects/gen_tv_trade_league_effects.py (2026-06-03); reference_game_files/game/in_game/common/effect_localization/market_effects.txt:16; reference_game_files/game/in_game/events/diplomacy/overextension.txt:149-153"
  notes: "Commercial-intelligence strength is leader-country state, but merchant power is market/country keyed state. Permanent application must be synchronized by key so inactive decay, cancellation, death, and membership changes cannot leave stale power, while monopoly embargo keys remain independent."

- id: tv_io_initial_laws_seeded
  pattern: '(?:^\s*default:\s*true\s*$|(?s:tv_trade_league\s*=\s*\{.*?\blaws\s*=\s*\{\s*\w))'
  detectability: lint
  only_in_paths: ['trade_league_laws.yaml', 'tv_trade_league.txt']
  bad: "Trade League starts with enacted laws or generated default policies"
  correction: "Keep Trade League lawless at creation: do not emit a laws block with policy mappings in the IO type, and do not mark generated Trade League policies as default. Diplomatic Alliance is a separate design exception that explicitly seeds baseline no-effect policies."
  category: script
  scope: international_organization
  source: "user design clarification (2026-05-25); reference_game_files/game/main_menu/setup/start/15_international_organizations.txt:288"
  notes: "AI generated default level-1 Trade League policies into tv_trade_league's IO definition. This violated the Trade League design that policies are enacted later through votes. Vanilla setup shows an IO can explicitly start with laws = {  }; Diplomatic Alliance intentionally uses a non-empty laws block for its baseline tier-0 state."

- id: tv_io_missing_opinion_bias
  pattern: ''
  detectability: advisory
  only_in_paths: ['international_organizations', 'biases']
  bad: "Defining a TV international organization without a matching io_opinion_<io_type> bias"
  correction: "Add src/in_game/common/biases/<io_type>_biases.txt with io_opinion_<io_type> = { value = <opinion> } and localize the same key."
  category: script
  scope: international_organization
  source: "reference_game_files/game/in_game/common/international_organizations/readme.txt:6"
  notes: "EU5 applies automatic member opinions through io_opinion_<key>; missing the bias logs 'International Organization Type needs an opinion of other members'."

- id: dynamic_scope_value_must_use_script_value_block
  pattern: ''
  detectability: advisory
  only_in_paths: ['generic_actions', 'scripted_effects', 'gen_tv_trade_league_actions', 'gen_tv_trade_league_effects']
  bad: "Passing a generic-action value selector or scoped variable directly as set_variable value, add_temporary_demand scale, or add_goods_supply amount"
  correction: "Wrap dynamic numeric reads in an explicit script-value block, e.g. value = { value = scope:target_1 }, value = { value = scope:target_1 divide = 2 }, scale = { value = scope:io.var:X }, or amount = { value = scope:io.var:X }."
  category: script
  scope: any
  source: "user-reported runtime behavior in Trade League virtual demand/supply actions (2026-05-22); reference_game_files/game/in_game/common/generic_actions/international_organizations.txt:275; reference_game_files/game/in_game/events/government/town_rights_events.txt:476"
  notes: "Direct scoped numeric reads in these dynamic value slots can be interpreted as existence/truthy values and collapse to 1. The script-value block preserves the selected number and supports inline arithmetic."

- id: generic_action_cleanup_effect_must_be_hidden
  pattern: ''
  only_in_paths: ['generic_actions']
  bad: "Calling cleanup-only scripted effects from a visible generic action effect"
  correction: "Wrap cleanup/rebuild-only helper calls in hidden_effect = { ... }. scripts/validate.py enforces the registered high-risk helper list, including tv_governor_remove_effect."
  category: script
  scope: any
  source: "runtime tooltip pre-evaluation errors from Governor's House regional governor dismissal; fixed in src/in_game/common/generic_actions/tv_govhouse_actions.txt"
  notes: "Generic action effect tooltips can pre-evaluate cleanup helpers, causing variable/list cleanup chains to run through unsafe reads while merely hovering the button. Hidden output is required for these internal maintenance effects."

- id: trade_efficiency_nonexistent
  pattern: '\btrade_efficiency\s*='
  bad: "trade_efficiency = <value>"
  correction: "Use trade_land_efficiency and trade_sea_efficiency separately (both category=country, percent)"
  category: modifier
  scope: country
  source: "reference_game_files/game/main_menu/common/modifier_type_definitions/00_modifier_types.txt:10044"
  notes: "trade_efficiency does not exist in EU5; split into trade_land_efficiency + trade_sea_efficiency"

- id: yaml_localization_non_ascii_quotes
  pattern: "[“”‘’]"
  bad: "Smart/curly quotes (“”‘’) in localization YAML"
  correction: "Use straight ASCII double-quotes (\") only; escape with \\\" inside values"
  category: localization
  scope: any
  source: "reference_official_defines/docs/data_types_gui.txt"
  notes: "PDX parser rejects non-ASCII quote characters; the failure is silent"

- id: localization_value_raw_physical_newline
  pattern: ''
  detectability: lint
  validator: localization_physical_lines
  only_in_paths: ['localization']
  bad: "A localization value contains a real physical newline inside the quoted string"
  correction: "Keep each localization key/value on one physical line. Generators should render intentional line breaks as \\n inside the quoted value."
  category: localization
  scope: any
  source: "runtime error.log: localization_reader.cpp:445 Invalid character in key name; fixed in scripts/wonder_mechanics/_core.py"
  notes: "The localization reader treats the continuation line as a new key, causing invalid-character and missing-colon errors. scripts/validate.py checks main-menu localization physical lines."

- id: localization_duplicate_key_across_files
  pattern: ''
  detectability: needs_parser
  only_in_paths: ['localization']
  bad: "Defining the same localization key in more than one YAML file for the same language"
  correction: "Keep each localization key owned by exactly one file per language. When a generator takes over a key family, remove the stale manual copies instead of redefining them."
  category: localization
  scope: any
  source: "runtime error.log: pdx_localize.cpp:221 Duplicate localization key. Key 'STATIC_MODIFIER_NAME_tv_wonder_sacred_mountain_level_1' is defined in both localization/simp_chinese/tv_engineering_department_l_simp_chinese.yml and localization/simp_chinese/tv_engineering_department_wonder_mechanics_l_simp_chinese.yml"
  notes: "Main-menu localization YAML does not merge duplicate keys across files within one language pack. Startup logs a duplicate-key error and only one definition can win, so manual and generated files must have unambiguous ownership."

- id: io_law_category_missing_uppercase_loc
  pattern: ''
  bad: "Custom IO law category localized only by raw category id (e.g. tv_science_factions)"
  correction: "Also define <CATEGORY_ID_UPPERCASE>_LAW_CATEGORY in main_menu localization, e.g. TV_SCIENCE_FACTIONS_LAW_CATEGORY"
  category: localization
  scope: international_organization
  source: "user-reported runtime UI behavior (2026-05-15)"
  notes: "The vanilla IO Laws tab displays InternationalOrganizationLawCategory.GetName and looks up the uppercase *_LAW_CATEGORY key for law category headers; missing keys render literally."

- id: io_header_controls_in_country_header_extra
  pattern: ''
  only_in_paths: ['gui/panels/organization']
  bad: "Putting visible IO header controls such as action buttons in blockoverride \"country_header_extra\" on the standard organization header"
  correction: "Put compact IO header controls/readouts in ios_information_header_content_extra_1/2/3 with ios_header_content_extra_template, or override abilities_widget to include ios_information_header plus the controls."
  category: gui
  scope: international_organization
  source: "reference_game_files/game/in_game/gui/panels/organization/common_header.gui:387; reference_game_files/game/in_game/gui/panels/organization/common_header.gui:563"
  notes: "In the standard organization_panel_default_header path, the visible lower header row is ios_information_header inside abilities_widget. country_header_extra is outside the character/header info row and can be absent or effectively hidden in UI bounds, so interactive controls may not render where expected."

- id: eu4_province_modifier_scope
  pattern: 'add_province_modifier'
  bad: "add_province_modifier (EU4 effect)"
  correction: "add_location_modifier or add_static_modifier with location scope"
  category: scope
  scope: location
  source: "reference_game_files/game/in_game/common/"
  notes: "EU4 province scope effects do not exist in EU5; use location-scoped equivalents"

- id: eu4_has_province_modifier
  pattern: 'has_province_modifier'
  bad: "has_province_modifier (EU4 trigger)"
  correction: "has_location_modifier"
  category: scope
  scope: location
  source: "reference_game_files/game/in_game/common/"
  notes: "EU4 province scope triggers do not exist in EU5"

- id: float_precision_exceeds_5dp
  pattern: '\d\.\d{6,}'
  bad: "float literal with 6+ decimal places (e.g. value = 0.123456789)"
  correction: "Round to at most 5 decimal places: value = 0.12346; EU5 engine reads no further"
  category: precision
  scope: any
  source: "user-reported engine behavior (2026-04)"
  notes: "EU5 engine truncates all float literals at 5 decimal places; digits beyond the 5th are silently ignored"

- id: change_variable_divide_is_integer
  pattern: ''
  bad: "change_variable { divide = N } expecting float result when input < N (e.g. score ÷ large_threshold to get [0,1])"
  correction: "Multiply by 100 (or desired precision) BEFORE dividing, then compare/cap at 100 instead of 1. For thresholds divisible by 100, use divide = (threshold÷100) in one step."
  category: script
  scope: any
  source: "reference_game_files/game/in_game/common/scripted_effects/global_effects.txt:137"
  notes: "EU5 change_variable { divide } performs FLOOR integer division. E.g. 160÷2000=0, not 0.1. Use integer scale [0,100] with max=100 on GUI progressbar. Pattern left empty (no auto-detect) — all divide uses cannot be classified as bad without context."

- id: progressbar_default_max_is_one
  pattern: ''
  bad: "progressbar with dynamic GetVariable value binding and no explicit max"
  correction: "Always set max = 100 on the progressbar widget. Store values as integer [0,100] in scripted variables using integer-scale arithmetic."
  category: gui
  scope: any
  source: "reference_game_files/game/in_game/gui/panels/situation/the_revolution.gui:112"
  notes: "Default progressbar max appears to be 1; GetVariable returning an integer 0-100 without matching max produces 0% for all values except 1 (which shows 100%). Pattern left empty — regex cannot reliably detect the missing-max + variable-value combination."

- id: situation_panel_empty_subheader_row
  pattern: ''
  bad: "Custom situation_panel leaves the shared default situation_subheader_content in place when no subheader content is needed"
  correction: "Add blockoverride \"situation_subheader_content\" {} near the top of the situation_panel block to suppress the default 45px empty row."
  category: gui
  scope: any
  source: "reference_game_files/game/in_game/gui/panels/situation/common.gui:197; reference_game_files/game/in_game/gui/panels/situation/colonial_revolution.gui:14"
  notes: "The shared situation_panel template includes a default subheader widget. Vanilla situation panels that do not use it override the block to empty; otherwise custom panels show unwanted blank space above their main content."

- id: gui_no_getgoods_from_string
  pattern: "GetGoods\\('|GetGoodsFromKey|MakeGoods\\("
  bad: "GetGoods('key'), GetGoodsFromKey, or MakeGoods('key') in GUI expressions to construct a Goods object from a string literal"
  correction: "Goods datacontext must come from a data model accessor chain (e.g. GoodsMarketEntry.GetGoods, Trade.GetGoods, GoodsItem.GetGoods in a foreach); there is no string-to-Goods lookup function in EU5 GUI"
  category: gui
  scope: any
  source: "reference_game_files/game/in_game/gui/shared/market_tooltips.gui:435"
  notes: "Exhaustive search of all reference_game_files *.gui files found zero occurrences of any string-to-Goods constructor; all goods access is typed accessor chains only"

- id: gui_getvariable_getgoods_invalid
  pattern: "GetVariable\\('[^']+'\\)\\.GetGoods"
  detectability: advisory
  only_in_paths: ['gui']
  bad: "Chaining .GetGoods from MakeScope.GetVariable(...) in GUI expressions"
  correction: "Use a real Goods datacontext from a typed data model/accessor, or generate static icon/name branches keyed by a saved numeric goods id."
  category: gui
  scope: any
  source: "docs/error_log/error.log; fixed in scripts/in_game/gui/panels/organization/gen_tv_trade_league_gui.py"
  notes: "Scope/numeric variables returned by MakeScope.GetVariable do not expose a .GetGoods accessor. Runtime error: Could not find data system function 'GetGoods'."

- id: gui_getvariable_getinternationalorganization_invalid
  pattern: "GetVariable\\('[^']+'\\)\\.GetInternationalOrganization"
  detectability: advisory
  only_in_paths: ['gui']
  bad: "Chaining .GetInternationalOrganization from MakeScope.GetVariable(...) in GUI expressions"
  correction: "Call OpenInternationalOrganizationView only with a typed InternationalOrganization object from a verified view/datamodel chain, such as InternationalOrganization.Self or OrgItem.GetOrg.Self."
  category: gui
  scope: international_organization
  source: "docs/error_log/error.log; reference_game_files/game/in_game/gui/diplomacy_lateralview.gui:462"
  notes: "Variables saved from script scope are not promoted to GUI InternationalOrganization objects by .GetInternationalOrganization. Runtime error: Could not find data system function 'GetInternationalOrganization'."

- id: gui_select_location_to_build_string
  pattern: "SelectLocationToBuild(?:Default|WithLocation)?\\s*\\(\\s*'[^']+'"
  only_in_paths: ['gui']
  bad: "Passing a building key string to SelectLocationToBuildDefault / SelectLocationToBuildWithLocation in GUI"
  correction: "Pass a BuildingType object from GUI data context, such as BuildingItem.GetBuildingType, LocationBuildingItem.GetBuilding.GetType, or BuildingType.Self. If no BuildingType object is available in the panel, route the button through a generic action with a location select_trigger."
  category: gui
  scope: building
  source: "reference_game_files/game/in_game/gui/production_lateralview.gui:987; runtime report in src/in_game/gui/panels/organization/tv_engineering_department.gui"
  notes: "The vanilla build-location GUI calls SelectLocationToBuildDefault with a typed BuildingType object. A literal string key can leave the click appearing successful only because a following PlayAudioEffect runs, while no build-location interface opens."

- id: gui_goodsview_inaccessible_in_tooltip
  pattern: 'GoodsView\.GetGoods'
  bad: "datamodel = \"[GoodsView.GetGoods]\" inside a ContextualTooltipType or tooltipwidget template to iterate all goods and filter by key"
  correction: "GoodsView is a view-model object only available in goods_overview.gui panel scope; it is not accessible from tooltip/ContextualTooltipType contexts. No equivalent all-goods datamodel exists for tooltip scope."
  category: gui
  scope: any
  source: "reference_game_files/game/in_game/gui/goods_overview.gui:77"
  notes: "Exhaustive search of reference_game_files found GoodsView only in the goods_overview panel; tooltip templates have no equivalent all-goods iteration datamodel"

- id: multiply_global_variable_nonexistent
  pattern: 'multiply_global_variable'
  bad: "multiply_global_variable = { name = X  value = 0.95 } to scale a global variable in-place"
  correction: "Use set_global_variable with hardcoded per-case values: set_global_variable = { name = X  value = computed_literal }. For era-decay patterns, hardcode the result per age (idempotent, no dedup guard needed). If truly dynamic, compute in a local_variable then use set_global_variable = { name = X  value = local_var:tmp }."
  category: scope
  scope: any
  source: "reference_game_files/game/in_game/common/scripted_effects/global_effects.txt"
  notes: "Exhaustive search of reference_game_files/ and reference_mods/ found no multiply_global_variable effect. Only set_global_variable and change_global_variable exist for global-scope numeric variables."

- id: variable_list_remove_wrong_effect
  pattern: 'remove_from_variable_list\s*='
  bad: "remove_from_variable_list = { name = X target = Y } for persistent variable lists"
  correction: "remove_list_variable = { name = X target = Y } to remove a specific entry. add_to_variable_list = { name = X target = Y } is still correct for adding. Temporary lists (add_to_list) use a different API: every_in_list = { list = X } and remove_from_list = X."
  category: script
  scope: any
  source: "src/in_game/common/scripted_effects/tv_govhouse_effects.txt"
  notes: "EU5 uses remove_list_variable (not remove_from_variable_list) to remove a scope reference from a persistent variable list. Confirmed by govhouse implementation."

- id: action_button_diamond_datacontext_breaks_tooltip
  pattern: ''
  bad: "datacontext = \"[InternationalOrganizationsView.GetPlayer]\" inside action_button_diamond in an organization panel"
  correction: "Remove datacontext entirely. Use Player.MakeScope.GetVariable(...).IsSet in visible expressions instead of Country.MakeScope.GetVariable(...).IsSet"
  category: gui
  scope: any
  source: "reference_game_files/game/in_game/gui/panels/organization/defensive_league.gui:128-149"
  notes: "Adding datacontext to action_button_diamond overrides the widget's internal binding, causing tooltip generation to fail silently (empty tooltip, button stays grayed regardless of action potential). Vanilla IO panels never use datacontext on action_button_diamond. Use Player (global GUI binding) instead of Country (datacontext-dependent) to access player-country variables."

- id: gui_button_missing_tooltip
  pattern: ''
  detectability: needs_parser
  bad: "A GUI button widget without tooltip/tooltipwidget, including visual button templates such as button_checkbox_auto or disabled button_regular_diamond"
  correction: "Give every button-derived widget its own tooltip or tooltipwidget, even if another transparent action_button overlays it or the button is disabled."
  category: gui
  scope: any
  source: "EU5 runtime tooltip_validation.cpp: Button is missing tooltip"
  notes: "The engine validates the button widget itself. A separate overlay action_button with title/description does not satisfy tooltip validation for the underlying button_checkbox_auto, and disabled placeholder buttons still need a tooltip."

- id: positive_sign_in_float_literal
  pattern: 'value = \+\d'
  bad: "Writing a leading + sign on positive float literals, e.g. value = +0.025 or change_variable = { ... value = +0.003 }"
  correction: "Omit the + sign entirely: value = 0.025. The EU5/Jomini parser does not accept a leading + on numeric literals and will misread the value."
  category: scripted_values
  scope: any
  source: "runtime observation"
  notes: "Triggered by Python f-string format spec +:  e.g. f'{delta:+.5f}' emits +0.00357 for positive deltas. Fix: use f'{delta:.5f}' so no leading sign is emitted for positive values."

- id: gui_situation_get_player_country_nonexistent
  pattern: 'GetPlayerCountry'
  bad: "GetPlayerCountry.MakeScope.GetVariable(...) or GetPlayerCountry in situation panel GUI expressions"
  correction: "Use Country.MakeScope.GetVariable('name').GetValue — Country is the implicit player country datacontext in situation panels. For situation-scope variables use SituationView.GetActiveSituation.GetSituation.MakeScope.GetVariable('name')"
  category: gui
  scope: any
  source: "reference_game_files/game/in_game/gui/panels/situation/western_schism.gui:43"
  notes: "Exhaustive search of all situation panel .gui files found zero occurrences of GetPlayerCountry; western_schism.gui:43 confirms Country.MakeScope as the correct chain for per-country variables"

- id: gui_variable_comparison_no_operators
  pattern: ''
  bad: "Using > >= < <= == operators directly in GUI visible expressions to compare variable values (e.g. visible = \"[Country.MakeScope.GetVariable('x').GetValue >= 3]\")"
  correction: "Use typed comparison functions: GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.GetVariable('name').GetValue, '(CFixedPoint)N.0') for integer milestone variables; EqualTo_float(FixedPointToFloat(...GetValue), '(float)N.0') for float comparisons"
  category: gui
  scope: any
  source: "reference_game_files/game/in_game/gui/panels/situation/treaty_of_tordesillas.gui:138"
  notes: "EU5 GUI expression language has no inline comparison operators; all comparisons require named typed functions (GreaterThanOrEqualTo_CFixedPoint, LessThan_float, EqualTo_int32, etc.) with explicit type-cast literals"

- id: icon_widget_before_texticon_check
  pattern: ''
  bad: "Using an icon widget or designing custom icon syntax without first checking if @icon_name! inline texticon syntax already covers the case"
  correction: "Check font_icons.gui for existing texticon definitions first; use @icon_name! in raw_text/text/localization if available; fall back to icon widget; only design from scratch as last resort"
  category: gui
  scope: any
  source: "reference_game_files/game/main_menu/gui/shared/font_icons.gui"
  notes: "EU5 has 180+ pre-defined inline icons via the @xxx! texticon system; skipping this check causes unnecessary widget complexity and misses the preferred engine-native approach"

- id: event_id_multi_dot
  pattern: '^[a-z_]+\.[a-z_]+\.\d+\s*=\s*\{'
  bad: "Event ID with more than one dot, e.g. tv.conquest.1 = { type = country_event ... }"
  correction: "Event ID must be exactly <namespace>.<integer> with one dot. Use one namespace per category (e.g. namespace = tv_conquest, IDs tv_conquest.1..5), or flatten to sequential integers under one namespace. Localization keys for title/desc/option name CAN still use dotted suffixes (tv_conquest.1.t)."
  category: event
  scope: any
  source: "reference_game_files/game/in_game/events/ages.txt:1-3 (namespace = ages_of_eu, ID ages_of_eu.1)"
  notes: "EU5 jomini_eventmanager splits the event ID on the FIRST dot. tv.conquest.1 becomes namespace 'tv' + integer 'conquest.1' which fails to parse, the event is dropped, and surviving entries collide as duplicates. Engine error: 'Failed to split namespaced event ID, needs to be in the form of namespace.integer'."

- id: parentanchor_under_hbox_vbox
  pattern: ''
  validator: check_gui_parentanchor_under_hbox_vbox
  detectability: lint
  only_in_paths: ['.gui']
  bad: "Setting parentanchor on a widget that is a direct child of an hbox or vbox (e.g. inside hbox = { widget = { parentanchor = vcenter ... } })"
  correction: "Remove parentanchor from hbox/vbox children — the layout box arranges them automatically on the cross-axis. parentanchor remains valid on children of plain widget/window/container parents."
  category: gui
  scope: any
  source: "EU5 engine validation (pdx_gui_validation.cpp:62: 'Unsupported property: parentanchor on widgets that are a child of a hbox/vbox. Hboxes/vboxes arrange their children automatically.')"
  notes: "Brace-aware validator checks direct hbox/vbox child blocks for direct parentanchor properties. Children of progressbar/widget/window are unaffected."

- id: gui_progressbar_margin_top
  pattern: '(?ms)^[ \t]*progressbar\s*=\s*\{(?:(?!^[ \t]*\}).)*^[ \t]*margin_top\s*='
  detectability: lint
  only_in_paths: ['.gui']
  bad: "Putting margin_top directly on a progressbar widget"
  correction: "Wrap the progressbar in a fixed-size widget/layout container, put vertical placement such as parentanchor/widgetanchor on the progressbar inside that wrapper, and leave margin_top off the progressbar itself."
  category: gui
  scope: any
  source: "runtime error.log from gui/panels/organization/tv_engineering_department.gui: Property 'margin_top' not handled for progressbar"
  notes: "EU5 progressbar does not handle margin_top. Text and container widgets may use margins, but progressbar vertical offset should be expressed through a parent wrapper."

- id: percent_size_under_hbox_vbox
  pattern: ''
  bad: "Setting size with a percentage component on a widget that is a direct child of an hbox or vbox, e.g. size = { 97% 72 } inside organization_custom_content"
  correction: "Remove the percentage size and rely on layout policies, or use non-percent fixed/min/max sizing when a fixed dimension is actually needed. For io_character_card in organization_custom_content, omit size/parentanchor and rely on the card type's built-in layoutpolicy_expanding."
  category: gui
  scope: any
  source: "EU5 engine validation (pdx_gui_validation.cpp:62: 'Unsupported property: size with a percentage on widgets that are a child of a vbox/hbox. Consider using layout policies and stretch factors instead.')"
  notes: "Pattern is empty because static detection requires parsing GUI parent structure. Percent sizes are valid in some plain widget/fixedgrid contexts, but hbox/vbox children are arranged by the box layout and should be driven by layoutpolicy_* or stretch factors."

- id: io_custom_tab_scrollarea_autosize_wrapper_misaligns
  pattern: ''
  bad: "Wrapping an organization_custom_content scrollarea in a child vbox and relying on autoresizescrollarea for dynamic overflow"
  correction: "Inject the scrollarea directly into organization_custom_content so it becomes a child of the vanilla inner vbox. Override margin_top/spacing on the block. Use a fixed viewport such as size = { 100% 430 } for bounded panels, or set the block layoutpolicy_vertical = expanding and the scrollarea using = layoutpolicy_expanding when the tab must claim the full IO pane from the common trailing expand spacer. Keep scrollwidget content with a natural/fixed vertical height (for example layoutpolicy_vertical = fixed plus ignoreinvisible = yes). Avoid autoresizescrollarea for tabs whose content can grow after state changes, because it can resize the viewport to the content and leave no useful overflow to scroll."
  category: gui
  scope: any
  source: "reference_game_files/game/in_game/gui/panels/organization/common.gui:558-567; reference_game_files/game/in_game/gui/panels/organization/middle_kingdom.gui:209-214; reference_game_files/game/main_menu/gui/shared/main_menu_lists.gui:258-263; runtime playtest of tv_arts_exhibition"
  notes: "The vanilla custom content slot is already an inner vbox with margin_top = 5 followed by an expand spacer, and vanilla middle_kingdom injects children/properties directly into organization_custom_content. Adding another child vbox can make UI bounds look correct for the wrapper while the scrollarea sits lower inside it. A direct fixed viewport prevents autosize growth, but a full-pane custom tab also needs the injected block and scrollarea to be vertically expanding so the common trailing expand does not own the lower area. autoresizescrollarea is useful for dropdown-like natural-height widgets, but in this IO tab it grew with active exhibition content, removed overflow, and made the scrollarea stop scrolling."

- id: io_character_card_sort_highlight_without_filtered_list
  pattern: ''
  bad: "Using io_character_card outside a FilteredSortedList context without suppressing the inherited name sort highlights"
  correction: "Inside standalone io_character_card usages, add blockoverride \"name_highlight\" {} and blockoverride \"character_entry_name_sort_by_highlight\" {} unless the card is actually inside a sortable FilteredSortedList."
  category: gui
  scope: any
  source: "reference_game_files/game/in_game/gui/panels/organization/middle_kingdom.gui:226-228"
  notes: "io_character_card uses character_entry, whose name highlight blocks call FilteredSortedList.IsKeyHoveredByWidgetName. Without a FilteredSortedList datacontext, the GUI data manager spams 'No context supplied' while the card is visible."

- id: gui_datamodel_item_multiple_children
  pattern: ''
  bad: "A datamodel item block with more than one top-level child widget, e.g. item = { vbox = { ... } widget = { ... } }"
  correction: "Wrap all row content inside a single parent widget/vbox/hbox so the item block contains exactly one child. Put dividers or auxiliary widgets inside that parent."
  category: gui
  scope: any
  source: "EU5 runtime error docs/error_log/error.log:10; reference_game_files/game/in_game/gui/panels/organization/middle_kingdom.gui:333"
  notes: "GUI datamodel item descriptions can only contain a single child and no properties. Multiple top-level children log 'Malformed item desc' and can cause adjacent formatter noise while the list is rendered."

- id: gui_requirements_list_empty_block_title_override
  pattern: ''
  only_in_paths: ['gui']
  bad: "RequirementsList with an empty blockoverride \"block_title\" { } to hide its title"
  correction: "Keep the nested title block and hide it explicitly: blockoverride \"block_title\" { block \"block_title\" { visible = no } }"
  category: gui
  scope: any
  source: "runtime error docs/error_log/error.log: ExtraTooltipInfo.GetTintColor; reference_game_files/game/in_game/gui/cooltip_types.gui:1177; reference_game_files/game/main_menu/gui/shared/main_menu_cooltip_types.gui:1367"
  notes: "An empty override removes RequirementsList's safe title replacement and exposes the underlying TooltipTableHeader textbox. Outside an actual tooltip, that header has no ExtraTooltipInfo context and continuously logs GetTintColor failures while the panel is hovered."

- id: gui_tooltip_text_block_outside_tooltip_context
  pattern: ''
  only_in_paths: ['gui']
  bad: "Using TooltipTextBlock as a normal always-visible panel widget"
  correction: "Reserve TooltipTextBlock for real tooltip content (`tooltipwidget`, `ContextualTooltipType`, `AlertTooltipType`, etc.). In normal panels use text_single/text_multi or another non-tooltip text widget."
  category: gui
  scope: any
  source: "runtime error docs/error_log/error.log: ExtraTooltipInfo.GetTintColor; reference_game_files/game/main_menu/gui/shared/main_menu_cooltip_types.gui:328"
  notes: "TooltipTextBlock inherits tooltip_text_block_template, whose font tint reads ExtraTooltipInfo.GetTintColor. Visible uses outside an actual tooltip context can continuously log FetchData failures while the panel is open."

- id: gui_tooltip_fixed_height_row_overflows
  pattern: ''
  only_in_paths: ['gui']
  bad: "Wrapping tooltip rows that can grow in height in a fixed-size `widget` or an `expanding` child, e.g. `size = { W H }` around a `TooltipStringPairList` chain"
  correction: "Let the visible tooltip content establish its own height. Constrain width with `size = { W -1 }` or `minimumsize`, add `set_parent_size_to_minimum = yes` to the containing layout, and keep `ignoreinvisible = yes` so only visible rows contribute to the measured height."
  category: gui
  scope: any
  source: "scripts/in_game/gui/gen_location_window.py; reference_game_files/game/main_menu/gui/shared/main_menu_cooltip_types.gui:1314, 1840"
  notes: "A fixed-height tooltip row can keep the frame visually short while the modifier text spills below the border. The container must be height-auto if the modifier block can wrap to multiple lines."

- id: building_eu4_price_numeric
  pattern: '^\s*price\s*=\s*\d+'
  only_in_paths: ['building_types']
  bad: "Direct numeric price in EU5 building definition, e.g. price = 200 (EU4 carry-over)"
  correction: "Use price = <named_constant> referencing a definition in common/prices/ (e.g. price = tv_academy_1_price with gold = 600). Capital buildings that scale with age use expensive = yes instead."
  category: modifier
  scope: location
  source: "reference_official_defines/types/building_types.txt:18, reference_game_files/game/in_game/common/building_types/estate_buildings.txt:416"
  notes: "EU5 building gold cost uses named price constants from common/prices/ (e.g. price = expensive_estate_building at line 416 of estate_buildings.txt). Direct numeric literals like price = 200 are silently ignored. Named constants ARE valid."

- id: boolean_modifier_can_recruit_regiment_numeric
  pattern: 'can_recruit_regiment_in_this_location\s*=\s*(?:0|1)\b'
  detectability: lint
  only_in_paths: ['building_types', 'static_modifiers']
  bad: "Boolean location modifier can_recruit_regiment_in_this_location assigned numeric 0/1"
  correction: "Use can_recruit_regiment_in_this_location = yes or no. The modifier type is declared boolean=yes, and vanilla building modifiers use yes."
  category: modifier
  scope: location
  source: "reference_game_files/game/main_menu/common/modifier_type_definitions/00_modifier_types.txt:9910; reference_game_files/game/in_game/common/building_types/manpower_buildings.txt:29"
  notes: "EU5 logs Malformed token near the numeric literal when a boolean modifier value is emitted as 1. Generated YAML data must preserve bools and render them as yes/no, not Python True/False or 1/0."

- id: wonder_fixed_modifier_thousand_scaled_value
  pattern: ''
  detectability: lint
  validator: wonder_engine_scaled_fixed_modifiers
  only_in_paths: ['wonder']
  bad: "Setting fixed-value wonder modifiers such as global_pop_conversion_speed, local_pop_assimilation_speed, local_manpower, or local_sailors above 0.5"
  correction: "Keep these fixed-value entries at or below 0.5. If a percentage bonus was intended, use the matching *_modifier percent modifier instead."
  category: modifier
  scope: wonder
  source: "User-reported EU5 engine behavior, 2026-06-13; modifier ids verified in reference_game_files/game/main_menu/common/modifier_type_definitions/00_modifier_types.txt:4553-4564, 4609-4619, 5080-5092"
  notes: "EU5 multiplies these fixed-value modifier values by 1000 in game. scripts/validate.py checks wonder paths in src/ and data/ for direct YAML/script assignments to global_pop_assimilation_speed, global_pop_conversion_speed, local_pop_assimilation_speed, local_pop_conversion_speed, local_manpower, and local_sailors; percent *_modifier variants are intentionally excluded."

- id: python_boolean_token_in_common_script
  pattern: '^\s*[A-Za-z0-9_:.]+\s*=\s*(?:True|False)\b'
  detectability: lint
  only_in_paths: ['src/in_game/common', 'src/main_menu/common']
  bad: "Python-style boolean token True/False emitted into an EU5 common script"
  correction: "Render script booleans as yes or no. In Python generators, handle bool before int/float because bool is an int subclass."
  category: script
  scope: any
  source: "reference_game_files/game/main_menu/common/modifier_type_definitions/00_modifier_types.txt:1270; reference_game_files/game/main_menu/common/static_modifiers/country.txt:5603"
  notes: "YAML true/false loads as Python True/False; str(value) emits malformed tokens in Jomini scripts, as seen with global_peasants_migration_allowed = True."

- id: utf8_bom_mandatory_on_common_scripts
  pattern: ''
  bad: "Saving common/ scripts (static_modifiers, situations, scripted_effects, on_action, etc.) as plain UTF-8 without a byte-order mark"
  correction: "Save with UTF-8 BOM (first 3 bytes EF BB BF). In Python: write_bytes(b'\\xef\\xbb\\xbf' + text.encode('utf-8')) or open(..., encoding='utf-8-sig'). Verify with `head -c 3 <file> | xxd` -> expect ef bb bf."
  category: encoding
  scope: any
  source: "EU5 engine warning (lexer.cpp:501: 'File X should be in utf8-bom encoding (will try to use it anyways)')"
  notes: "Engine retries without BOM but emits a warning per file per load. Localization YAMLs already require BOM; this rule extends the same requirement to common/ .txt scripts. Auto-generated files via scripts/gen_scaffold.py should always emit the BOM."

- id: loc_color_tag_adjacent_variable
  pattern: '#[A-Z]\['
  only_in_paths: ['localization']
  bad: "#Y[variable_expression]#! — color tag immediately followed by [ with no separator"
  correction: "Either omit the color tag and write [variable_expression] as plain text, OR add a space: #Y [variable_expression]#! — the space terminates the tag name so the parser reads #Y (tag) then ' value' (content). Note the leading space will be visible in the rendered string."
  category: localization
  scope: any
  source: "EU5 engine error log: pdx_text_formatter.cpp:807: Unknown formatting tag 'y64!'"
  notes: "In EU5 Jomini localization, the color tag name is read from # until the first non-alphanumeric. When a [var] resolves to a number (e.g. 64) and is placed directly after #Y, the parser reads #Y64 as the tag name (unknown). The leading space in '#Y [var]' terminates the tag name at Y."

- id: loc_color_tag_adjacent_text
  pattern: '#[YGR](?=[^\s#!\[$@+\-])'
  detectability: lint
  only_in_paths: ['localization', 'philosophy_debate_codegen.py']
  bad: "#YText#! / #Y{generated_text}#! — color tag immediately followed by normal text or generated text with no separator"
  correction: "Insert a separator after the color tag, e.g. #Y Text#!, #G Text#!, or #R Text#!. Do the same in generators before substituting localized names or concept text."
  category: localization
  scope: any
  source: "User-reported display truncation in tv_academy_debate.100, 2026-07-07; vanilla examples use a space such as reference_game_files/game/main_menu/localization/english/events/DHE/flavor_kor_l_english.yml:86"
  notes: "EU5/Jomini localization does not reliably treat #Y/#G/#R as complete color tags when text or a generated placeholder starts immediately after the tag. The formatter can treat the adjacent content as part of the formatting tag and drop or mangle the highlighted span. A visible space after the tag terminates it."

- id: custom_description_needs_trigger_loc
  pattern: ''
  only_in_paths: ['scripted_triggers']
  bad: "custom_description { text = MY_LOC_KEY } where MY_LOC_KEY exists only in a localization YAML but not in common/trigger_localization/"
  correction: "Create a trigger localization entry in src/in_game/common/trigger_localization/your_file.txt: MY_LOC_KEY = { global = MY_LOC_KEY }. The YAML key is still needed as the display text; the trigger_localization file is the bridge the engine uses at validation time."
  category: localization
  scope: any
  source: "reference_game_files/game/in_game/common/trigger_localization/_trigger_localization.info, reference_game_files/game/in_game/common/trigger_localization/scripted_triggers.txt:275"
  notes: "EU5 engine validates custom_description text keys against common/trigger_localization/ at load. A YAML-only key passes validate.py but produces 'PostValidate of trigger custom_description returned false' and 'No trigger loc KEY' at game startup."

- id: gui_variable_isset_check
  pattern: ''
  bad: "Using HasVariable or is_set (script trigger syntax) inside a GUI visible expression to check whether a situation-scope variable exists"
  correction: "Use GetVariable('name').IsSet as the final accessor in a GUI visible expression: visible = \"[SituationView.GetActiveSituation.GetSituation.MakeScope.GetVariable('name').IsSet]\""
  category: gui
  scope: any
  source: "reference_game_files/game/in_game/gui/panels/situation/council_of_trent.gui:232, golden_age_of_piracy.gui:139"
  notes: "HasVariable is a script-side trigger and does not exist in the GUI expression language. GetVariable('name').IsSet is the GUI-native null guard for optional variables stored on situation/country scopes."

- id: gui_equality_comparison_cfixedpoint
  pattern: ''
  bad: "Attempting to check equality of a CFixedPoint variable in a GUI visible expression without a typed function (e.g. assuming == works, or forgetting EqualTo_CFixedPoint exists)"
  correction: "Use EqualTo_CFixedPoint(expr, '(CFixedPoint)N.0') for equality; also available: LessThan_CFixedPoint, GreaterThan_CFixedPoint, LessThanOrEqualTo_CFixedPoint. Example: visible = \"[EqualTo_CFixedPoint(Country.MakeScope.GetVariable('tv_best_path').GetValue, '(CFixedPoint)0.0')]\""
  category: gui
  scope: any
  source: "reference_game_files/game/main_menu/gui/shared/geopolitics_tooltips.gui:198, building_tooltips.gui:1043"
  notes: "EqualTo_CFixedPoint and related typed comparison functions are confirmed to exist in EU5 GUI. The inline == operator does not work in visible expressions. The _scripted_widgets.info file also documents EqualTo_CFixedPoint as the canonical equality check."

- id: var_comparison_unset_crash
  detectability: needs_parser
  pattern: ''
  bad: "limit = { var:some_var >= var:other_var } when some_var may not be set on the scope"
  correction: "Add has_variable = some_var to the limit block before the var: comparison: limit = { has_variable = some_var  var:some_var >= var:other_var }"
  category: script
  scope: any
  source: "error.log: 'Failed to fetch variable for tv_science_progress_pct due to not being set', towards_victory_leaderboard.txt:47"
  notes: "EU5 does NOT default unset variables to 0 in trigger comparisons; var:X on the left side of >= throws a script error and aborts the if-block. set_variable = { value = var:X } with an unset var appears to be silent (no error), so only limit comparisons need the has_variable guard."

- id: event_option_effect_reads_newly_set_variable
  detectability: needs_parser
  pattern: ''
  bad: "Event option effect sets variable X and then immediately calls a visible helper that compares var:X, assuming the option tooltip pre-evaluator sees the new value"
  correction: "Wrap the state-changing/application sequence in hidden_effect, or make the called helper guard has_variable before direct var:X comparisons. For optional option triggers, use var:X ?= N."
  category: event
  scope: country
  source: "runtime error.log: tv_govhouse.40 -> tv_govhouse_approve_pending_tactic_effect -> tv_govhouse_apply_tactic_effect"
  notes: "EU5 event option tooltip generation may pre-evaluate option effects without committing earlier set_variable writes. A later visible direct var:X comparison can fetch an unset variable repeatedly while the event is open."

- id: event_option_hidden_effect_not_performance_boundary
  detectability: advisory
  pattern: ''
  only_in_paths: ['events', 'scripted_effects']
  bad: "Putting global scans, high-cardinality dispatch, broadcasts, construction cleanup, map rebuilds, or other heavy work in an event option hidden_effect and expecting tooltip hover not to evaluate it"
  correction: "Keep option hidden_effect blocks to light guards or scheduler calls. Run heavy hidden work from a hidden = yes event immediate block or another non-tooltip execution path."
  category: event
  scope: any
  source: "User-reported Engineering Department wonder finalization tooltip stutter, 2026-06-10; fixed in generated tv_wonder_finalization_events.txt / tv_wonder_finalization_effects.txt via tv_engineering_department.6202"
  notes: "hidden_effect suppresses visible tooltip output, but it does not isolate event-option code from hover evaluation. The wonder finalization hidden chain was expensive because it included per-wonder/per-style dispatch, final building construction, cleanup, world-news broadcast, post-finalization priority caching, and project-state clearing."

- id: event_gui_structure_downgrade_for_data_change
  detectability: advisory
  pattern: ''
  only_in_paths: ['events', 'gui', 'scripted_effects', 'localization']
  bad: "Collapsing existing per-target event descriptions, target-specific options, per-id effect dispatch, staged GUI rows, or localized branch text into generic fallback behavior just to make a data-list change smaller"
  correction: "Preserve the existing player-facing structure when changing the data set. If the branch count is large, extend the appropriate generator/data source first, or stop and ask before changing structure. Do not silently replace target-specific UX with generic text/options or leave stale unreachable branches."
  category: event
  scope: any
  source: "User correction during Academy research-target update, 2026-07-06"
  notes: "A data-list update is not permission to downgrade event/GUI structure. Removing or genericizing established branch structure is a design change and must be explicitly requested or approved."

- id: event_option_temp_variable_used_by_visible_helper
  detectability: needs_parser
  pattern: ''
  only_in_paths: ['events', 'scripted_effects']
  bad: "Event option or visible event helper computes a temporary variable and a later visible helper compares var:X or uses scope.var:X as an effect value"
  correction: "Do not rely on temporary variables written earlier in the same visible option/effect chain. Use optional checks directly against persistent state, branch over bounded values with literals, or wrap the state-changing chain in hidden_effect when the nested tooltip is not needed."
  category: event
  scope: any
  source: "runtime error.log: tv_engineering_department.500 -> tv_wonder_complete_finalization_effect -> tv_wonder_construct_final_building_effect -> tv_wonder_construct_final_building_in_site_effect; tv_prosperity.1 -> tv_grant_prosperity_milestone_1 -> tv_engineering_department_create_effect -> tv_wonder_reinitialize_building_state_effect -> tv_wonder_combine_completed_modules_at_location_effect; tv_engineering_department.200 -> tv_wonder_after_unit_completed_event_effect -> tv_wonder_apply_helper_building_to_final_site_effect / tv_wonder_materialize_module_buildings_from_unit_vars_effect / tv_wonder_update_construction_progress_display_effect"
  notes: "The event option tooltip pre-evaluator did not commit tv_wonder_final_building_extra_levels before the nested helper ran. The same failure reappeared when Prosperity M1 reinitialized wonder module/helper buildings from partially built wonders, and again when unit-completion hover rebuilt helper/module levels through temporary current/target vars. For bounded 0..6 helper/module sync, emit literal per-level building deltas directly from persistent state instead of temporary combinable/current/target variables. For rounded countdown displays, prefer script-value operators such as ceiling/floor over scratch check variables like tv_wonder_remaining_months_floor_check."

- id: event_option_computed_variable_map_key_for_dynamic_building_tooltip
  detectability: needs_parser
  pattern: ''
  only_in_paths: ['events', 'scripted_effects']
  bad: "A visible event option/helper computes a temporary variable-map key and immediately uses global_variable_map(...|var:X) to choose a dynamic building for construct_building or change_building_level_in_location"
  correction: "Do not infer that dynamic building effects are unsupported. For tooltip-visible building effects, use a map key that already exists before the event opens, or branch over bounded non-wonder dimensions such as module part or ceremony style and use direct maps keyed by persistent project state. Capture the mapped building type into a local variable before switching to the location scope."
  category: event
  scope: variable_map
  source: "In-game runtime test, 2026-06-05: tv_engineering_department.200 and .201 rendered dynamic module construct/demolition effects after replacing the same-chain tv_wonder_locked * 10 + part map key with per-part maps keyed directly by tv_wonder_locked; helper-building construction already rendered through tv_wonder_id_to_helper_building_type."
  notes: "The failed chain was set_variable/change_variable of tv_wonder_module_building_key followed by set_local_variable value = global_variable_map(tv_wonder_module_key_to_building_type|var:tv_wonder_module_building_key) and building_type = local_var:tv_wonder_module_building_type. The working chain branches on tv_wonder_last_completed_part, captures from tv_wonder_id_to_<part>_module_building_type keyed by var:tv_wonder_locked, and then runs construct_building/change_building_level_in_location with local_var:tv_wonder_module_building_type. This preserves variable_map/numeric-id architecture without generated per-wonder dispatch tables."

- id: event_building_cost_manual_text_hidden_construction
  detectability: advisory
  pattern: ''
  only_in_paths: ['events', 'scripted_effects', 'localization']
  bad: "Event option text manually states a building cost while the real construction is hidden behind pay_price plus free or silent construct_building"
  correction: "Put real building construction in the visible option effect chain when the player should see the cost. Let `construct_building` / `change_building_level_in_location` render the building name, price, and modifiers automatically. Use manual `pay_price` and hidden construction only for intentionally hidden or nonstandard funding flows."
  category: event
  scope: building
  source: "tv_govhouse.5 Local Administration confirmation cleanup, 2026-07-07"
  notes: "The Governor's House local-administration event option said 'Build ... for 400 ducats' while a hidden follow-up paid tv_govhouse_local_administration_price and constructed the building with cost_multiplier = 0. Moving construct_building into the visible option made the engine render the actual building cost and avoids stale duplicated cost text."

- id: generic_action_effect_reads_newly_set_variable
  detectability: needs_parser
  pattern: ''
  only_in_paths: ['generic_actions', 'scripted_effects', 'gui/panels/organization']
  bad: "A visible generic action calls an effect that initializes persistent variables and then compares `var:X` later in the same visible effect chain, assuming action tooltip pre-evaluation commits the earlier writes"
  correction: "Hide action widgets until their prerequisite state exists, re-check prerequisites inside the action effect, and make reusable effects safe under pre-evaluation. For derived display/helper values, compute and compare `local_var:X` scratch values first, then write persistent display variables as outputs. For nullable persistent state, use `has_variable` / `var:X ?= ...` or branch from already-existing state instead of directly comparing variables set earlier in the same chain."
  category: script
  scope: any
  source: "runtime error.log: tv_wonder_select_construction_site -> tv_wonder_update_wonder_level_effect (tv_wonder_body_units/function_units/decoration_units unset during action hover); tv_wonder_select_construction_site -> tv_wonder_update_construction_progress_display_effect (tv_wonder_remaining_progress unset after announcing a completed survey); tv_establish_science_io -> tv_academy_philosophy_refresh_timeline_effect (tv_academy_debate_node_N_index unset during select-trigger pre-evaluation)"
  notes: "EU5 generic action card and tooltip rendering can pre-evaluate the action effect without committing preceding set_variable writes. A helper that initializes construction variables or Academy timeline display variables and then immediately reads them with direct var:X comparisons can spam Failed to fetch variable / Invalid left side errors while the card is merely visible, hovered, or clicked. Even a display refresh that sets a variable to 0 before comparing it needs optional reads or local scratch comparisons if it is reachable from a visible generic action."

- id: generic_action_hidden_effect_not_hover_boundary
  detectability: advisory
  pattern: ''
  only_in_paths: ['generic_actions', 'scripted_effects']
  bad: "A generic action effect wrapped in hidden_effect still initializes variables that a later helper compares during select_trigger hover pre-evaluation"
  correction: "Do not treat hidden_effect as a hover-evaluation barrier in generic actions. Guard the action effect on persistent state and make nested helper reads safe with optional variable links, persistent-state checks, or local scratch variables that are compared before persistent display variables are written."
  category: script
  scope: any
  source: "runtime error.log: common/generic_actions/tv_govhouse_actions.txt:142 -> common/scripted_effects/tv_govhouse_effects.txt:1307; common/generic_actions/tv_io_leader_actions.txt:823 -> tv_academy_philosophy_refresh_timeline_effect, 2026-07-07"
  notes: "Hovering the Governor appointment selector still reached tv_governor_apply_modifiers_effect even though the appointment chain used hidden_effect. The same class reappeared when the Science IO establishment action reached the Academy Philosophy timeline refresh through an effect chain. The pre-evaluator walked into helpers and needed safe reads or local scratch calculations for newly initialized task/display variables."

- id: generic_action_helper_assumes_root_owner
  detectability: needs_parser
  pattern: ''
  only_in_paths: ['generic_actions', 'scripted_effects']
  bad: "A reusable helper reached from a generic-action effect compares IO leader/member state to `root`, assuming `root` is the action actor or current country"
  correction: "At helper entry or before changing scope, save the current owner/actor with `save_scope_as = <owner_scope>`, then compare against `scope:<owner_scope>` inside nested IO/member iterators. Use `root` only in contexts whose root scope is verified by the caller."
  category: scope
  scope: generic_actions
  source: "runtime error.log: tv_establish_science_io -> tv_academy_debate_change_local_progress_effect, 2026-07-07"
  notes: "The Academy Philosophy debate progress helper used `leader_country ?= root` under `every_international_organizations_member_of`. Generic-action effect pre-evaluation reached it with no valid root RHS and logged `Invalid right side during comparison 'root'`; saving `tv_academy_debate_progress_owner` at helper start made the comparison stable."

- id: trigger_loc_missing_first_perspective
  pattern: ''
  only_in_paths: ['trigger_localization']
  bad: "MY_KEY = { global = MY_KEY } when the trigger using MY_KEY has custom_tooltip nested inside custom_description"
  correction: "Declare all four perspectives: MY_KEY = { none = MY_KEY  global = MY_KEY  first = MY_KEY  third = MY_KEY }. Use this form for every trigger_localization entry as a safe default."
  category: localization
  scope: any
  source: "reference_game_files/game/in_game/common/trigger_localization/scripted_triggers.txt (ironman block)"
  notes: "EU5 engine requires the 'first' perspective when custom_description wraps a nested custom_tooltip. A global-only entry causes '(BUG: KEY missing perspective. Could not find parameters for PROMOUN first Negative required false)' at runtime. Adding all four perspectives is zero-cost and prevents this for any trigger regardless of nesting."

- id: artist_skill_modifier_invalid
  pattern: 'artist_skill_modifier'
  bad: "static_modifier or character_modifier using artist_skill_modifier = X"
  correction: "Use artist_skill_level_gain = X instead (already_percent = yes, category = character)"
  category: modifier
  scope: character
  source: "reference_game_files/game/main_menu/common/modifier_type_definitions/00_modifier_types.txt, reference_game_files/game/in_game/common/traits/03_artist.txt"
  notes: "artist_skill_modifier does not exist. The correct modifier type for boosting artist skill development is artist_skill_level_gain (declared as already_percent in modifier_type_definitions)."

- id: government_trigger_eu4_style
  pattern: '\bgovernment\s*=\s*(monarchy|republic|theocracy|tribal|tribe|horde|steppe_horde)\b'
  bad: "government = monarchy (EU4 trigger style)"
  correction: "government_type = government_type:monarchy  (and similarly for republic, theocracy, tribe, steppe_horde)"
  category: enum
  scope: country
  source: "reference_game_files/game/in_game/common/government_types/00_default.txt"
  notes: "EU5 government type trigger is government_type = government_type:X; the EU4 'government = X' form does not exist"

- id: multiply_divide_variable_nonexistent
  pattern: '\b(multiply_variable|divide_variable)\s*='
  bad: "multiply_variable = { name = X value = Y } or divide_variable = { name = X value = Y }"
  correction: "change_variable = { name = X multiply = Y } or change_variable = { name = X divide = Y }. Both accept var:Z references: multiply = var:Z, divide = var:Z"
  category: script
  scope: any
  source: "reference_mods/3692202776/in_game/common/scripted_effects/cmm_core_slider_setting_effects.txt:223"
  notes: "multiply_variable and divide_variable do not exist in EU5; all variable math uses change_variable with multiply/divide parameters"

- id: change_variable_uses_value_key
  pattern: 'change_variable\s*=\s*\{[^\}\n]*\bvalue\s*='
  bad: "change_variable = { name = X value = 1 }"
  correction: "Use a named arithmetic operator with change_variable, e.g. change_variable = { name = X add = 1 }. If you want to overwrite the variable, use set_variable = { name = X value = 1 }."
  category: script
  scope: any
  source: "reference_game_files/game/in_game/events/situations/red_turban_rebellions.txt:3349; runtime error.log: jomini_effect.cpp:918"
  notes: "change_variable does not accept a value field. The engine logs 'Failed to read value for change_variable' when value is used there. value belongs to set_variable; change_variable uses add/subtract/multiply/divide.
    False-positive edge case (confirmed live 2026-07 in scripts/unique_wonder_ritual_content/bank_of_saint_george.py): the single-line regex also fires on a legitimate nested scriptvalue block, e.g. `change_variable = { name = X add = { value = var:X multiply = var:Y } }` (compounding interest). That inline `add = { value = ... multiply = ... }` idiom is valid vanilla syntax -- confirmed at reference_game_files/game/in_game/events/disaster/turmoil_in_brandenburg.txt:1598 (`add_gold = { value = var:bra_owes_gold multiply = -1 }`) -- because the pattern's negated-character-class scan does not track brace depth and cannot tell the nested block's own `value =` from a top-level one on the same physical line. Do not silence this by weakening the regex (it still correctly catches the real mistake). Prefer rewriting the nested arithmetic as a named scratch variable instead: `set_variable = { name = tmp value = var:X }`, `change_variable = { name = tmp multiply = var:Y }`, `change_variable = { name = X add = var:tmp }`, `remove_variable = tmp` -- this also matches the codebase's existing scratch-variable convention (e.g. `*_ritual_total_favorable`, `*_combined_score`) better than a one-line nested scriptvalue."

- id: trigger_event_invalid_in_scripted_effects
  pattern: '\btrigger_event\s*='
  only_in_paths: ['scripted_effects', 'on_action']
  bad: "trigger_event = { id = X } or trigger_event = X inside scripted_effects or on_action"
  correction: "Use trigger_event_non_silently = { id = X } for popup events shown to the player, or trigger_event_silently = X for background events. Both accept simple form (= event_id) and object form (= { id = X days = Y })."
  category: script
  scope: any
  source: "reference_game_files/game/in_game/common/scripted_effects/on_action_effects.txt:39, reference_game_files/game/in_game/common/on_action/character_death_pulses.txt:57"
  notes: "EU5 does not have a bare trigger_event effect. In scripted_effects and on_action files, the engine reports 'Unknown effect trigger_event'. The two valid variants are trigger_event_non_silently (shows popup) and trigger_event_silently (hidden/background). This distinction does not apply inside event option = { } blocks, which may use a different syntax."

- id: recurring_silent_event_loop_without_guard
  pattern: ''
  detectability: advisory
  bad: "Seeding a delayed trigger_event_silently recurring hidden-event loop without a persistent sentinel, active-prerequisite guard, or teardown cleanup"
  correction: "Seed the loop once from a lifecycle point, set a persistent sentinel, and call trigger_event_silently = { id = tv_feature.900 days = 1 }. In the hidden = yes country event's immediate block, re-check both the feature prerequisite and sentinel before doing work and before rescheduling itself. Clear the sentinel on teardown so already queued events stop naturally."
  category: event
  scope: country
  source: "Governor's House daily hidden-event test, 2026-06; trigger_event_invalid_in_scripted_effects documents delayed trigger_event_silently object form"
  notes: "Delayed silent hidden events can implement daily immediate work outside monthly pulses and tooltip-rendered option chains, but every seed starts an independent loop. The sentinel prevents duplicate chains, and the teardown guard prevents a queued event from resurrecting a removed feature."

- id: variable_list_wrong_iteration_syntax
  pattern: 'every_in_variable_list|remove_from_variable_list'
  bad: "every_in_variable_list = { name = X ... } or remove_from_variable_list = { name = X target = Y } for persistent variable lists"
  correction: "every_in_list = { variable = X ... } to iterate; remove_list_variable = { name = X target = Y } to remove a specific entry. add_to_variable_list = { name = X target = Y } is still correct for adding. Temporary lists (add_to_list) use a different API: every_in_list = { list = X } and remove_from_list = X."
  category: script
  scope: any
  source: "reference_game_files/game/in_game/events/culture/culture_greek.txt:452 (every_in_list variable =), reference_game_files/game/in_game/common/on_action/character_death_pulses.txt:37 (remove_list_variable)"
  notes: "EU5 has two distinct list types: (1) Temporary lists created with add_to_list — iterated with every_in_list { list = X }, removed with remove_from_list = X. (2) Persistent variable lists created with add_to_variable_list — iterated with every_in_list { variable = X }, removed with remove_list_variable { name = X target = Y }. every_in_variable_list and remove_from_variable_list do not exist in EU5; the engine reports 'Unknown effect' for both."

- id: add_treasury_nonexistent
  pattern: '\badd_treasury\b'
  bad: "add_treasury = X to add or subtract gold from a country"
  correction: "Use add_gold = X (simple literal: add_gold = -200) or add_gold = { value = script_value multiply = N } (computed form). Trigger side: gold >= 200 (literal integer) is valid."
  category: script
  scope: country
  source: "reference_game_files/game/in_game/common/scripted_effects/country_effects.txt:2161 (add_gold = 5000), reference_game_files/game/in_game/common/generic_actions/fall_of_delhi.txt:44 (add_gold = { value = ... })"
  notes: "add_treasury does not exist in EU5. The effect is add_gold; it accepts a bare literal integer (positive or negative) or a block with value/multiply. Error: 'Unknown effect add_treasury'."

- id: flat_gold_cost_when_dynamic_event_cost_intended
  pattern: ''
  bad: "Hardcoding add_gold = -N for an event option that should scale with the country's economy"
  correction: "Use vanilla scripted effect change_gold_effect = { scale = -N } for dynamic country-event costs. The effect scales with capital_wealth and country_economical_base and clamps the result."
  category: script
  scope: country
  source: "reference_game_files/game/in_game/common/scripted_effects/country_gold_effects.txt:1, reference_game_files/game/in_game/events/government/laws.txt:238"
  notes: "Vanilla event laws.0005 uses change_gold_effect = { scale = -3.5 } for the paid +10 research-progress option. Use fixed add_gold only when a flat cost is the design intent."

- id: price_requires_cost_modifier_type
  pattern: ''
  bad: "Defining a price in common/prices/ without a corresponding modifier_type in common/modifier_type_definitions/"
  correction: "For every price named {name} in common/prices/, a modifier type named {name}_cost_modifier MUST exist in common/modifier_type_definitions/. EU5's price_database.cpp validates this at startup and logs 'Missing modifier type for price. {name}_cost_modifier'. The modifier type allows future modifiers/events to discount the price."
  category: script
  scope: any
  source: "price_database.cpp:116 (runtime error log)"
  notes: "This is an engine-enforced convention, not optional. Even if no modifier currently applies the discount, the modifier_type definition must be present. The naming is exact: price 'tv_academy_1_price' requires modifier type 'tv_academy_1_price_cost_modifier'. These appear unused but are implicitly consumed by the price loading system."

- id: on_action_effect_block_singleton
  detectability: needs_parser
  pattern: ''
  bad: "Defining a direct effect block on a vanilla hardcoded on_action hook inside a mod file when the same hook already exists in the vanilla _hardcoded on_action table"
  correction: "Extend hardcoded vanilla hooks with on_actions = { tv_named_callback } delegation and put the TV logic in the named callback's own effect block. Do not add a second direct effect block to the hardcoded hook itself."
  category: script
  scope: any
  source: "reference_game_files/game/in_game/common/on_action/_hardcoded.txt:497, 1182, 1436, 1575, 1790, 3175, 4833"
  notes: "Hardcoded on_action hooks are singleton by key for top-level effect blocks. A mod file that adds another direct effect to the same hardcoded hook will not merge the bodies; Jomini keeps the most recent effect and silently drops the earlier one. Use an on_actions delegate to route TV logic into a separate named on_action."

- id: ordered_in_global_list_limit_unguarded_var
  pattern: ''
  bad: "ordered_in_global_list limit block that references situation:X.var:Y without a prior has_variable = Y guard when Y might not be set"
  correction: "Wrap the entire ordered_in_global_list block in: if = { limit = { has_variable = Y } ordered_in_global_list = { ... } }. The outer if is evaluated once on the situation scope, so it is cheap. The inner limit still includes the var: reference but now only runs when Y is known to be set."
  category: script
  scope: any
  source: "src/in_game/common/scripted_effects/towards_victory_leaderboard.txt (ranks 2-5 fix, 2026-05)"
  notes: "ordered_in_global_list evaluates its limit block for EVERY entry in the pool. If the referenced situation variable (e.g. tv_rank_1_country) was never set (because the pool was empty at situation on_start), every pool entry triggers a script error, producing N errors on first load. Guard with has_variable on the outer if to skip the whole pass when the prerequisite rank is absent."

- id: ordered_in_global_list_stale_rank_rebuild
  pattern: ''
  bad: "Cascading ordered_in_global_list ranks that never clear old rank variables and gate later ranks only with has_variable = previous_rank"
  correction: "Treat ranking output as a fresh snapshot: remove all rank_N variables before rebuilding, ensure every pool entry has numeric order_by variables, and guard rank N with global_variable_list_size value > N-1 before running ordered_in_global_list."
  category: script
  scope: any
  source: "src/in_game/common/scripted_effects/towards_victory_leaderboard.txt (leaderboard rebuild fix, 2026-05)"
  notes: "A stale previous rank can survive from an earlier rebuild. If the current pool has fewer eligible entries, the later ordered_in_global_list pass can run with no selected item; prev is none, set_variable value = prev logs 'Value of wrong type ... none', and order_by/var reads may log failed variable fetches. Clearing outputs and checking current pool size prevents the pass from running when no current candidate exists."

- id: game_is_initialized_delays_situation_spawn
  pattern: 'game_is_initialized\s*=\s*yes'
  only_in_paths: ['situations']
  bad: "can_start = { game_is_initialized = yes } on a situation intended to spawn at game start"
  correction: "Use can_start = { always = yes } for situations with monthly_spawn_chance_unique that should exist from turn 1. game_is_initialized evaluates to current_date > 1337.5.1 (strictly greater); EU5 starts on exactly 1337.5.x, so the first spawn attempt fails and the situation spawns one month late."
  category: script
  scope: any
  source: "reference_game_files/game/in_game/common/scripted_triggers/game_triggers.txt:58-60"
  notes: "game_is_initialized = { current_date > 1337.5.1 }. The strict > operator means month-1 (1337.5.x) evaluates to FALSE. Situation spawns in month 2 and becomes visible to the player in month 3 due to UI propagation delay. For non-popup situations with on_start initialization, always = yes is safe because monthly_spawn_chance_unique prevents duplicate instances."

- id: root_scope_in_situation_on_monthly
  pattern: ''
  bad: "every_X = { root = { change_variable = { name = Y ... } } } where Y was set_variable'd on `this` before the loop, called from a situation's on_monthly"
  correction: "Use set_local_variable / change_local_variable for the accumulator. local_variable persists across all scope switches. Inside every_X, access the current-scope value directly (no prev. needed): change_local_variable = { name = acc add = some_value }. Then use local_var:acc after the loop."
  category: scope
  scope: any
  source: "reference_game_files/game/in_game/common/situations/guelphs_and_ghibellines.txt:229 (add = local_var:guelphs_total_tax); reference_game_files/game/in_game/events/wokou_events.txt:140 (change_local_variable block form)"
  notes: "In a situation's on_monthly, root = the situation scope, not the iterating country. set_variable stores onto `this` (country); root = { change_variable } then targets the situation — the accumulation goes to the wrong scope and the variable on the country stays 0. fix: local_variable is scope-independent and thread-local to the effect call."

- id: select_trigger_custom_target_flag
  pattern: 'target_flag\s*=\s+(?!target(_\d+)?\b|recipient\b)'
  bad: "target_flag = selected_artist (or any custom name) in select_trigger for 3-step generic actions"
  correction: "Use the vanilla naming convention: target_flag = target for step 1, target_flag = target_1 for step 2, target_flag = target_2 for step 3. Always wrap effect block in if = { limit = { exists = scope:target } ... } guard."
  category: scope
  scope: any
  source: "reference_game_files/game/in_game/common/generic_actions/make_unit_available_for_hire.txt (target / target_1 / target_2 pattern)"
  notes: "Custom target_flag names (e.g. selected_artist) in multi-step generic actions cause 'Undefined event target' / 'scope returned unset scope' errors at runtime. Engine appears to only reliably resolve target, target_1, target_2 for scope: lookups in effects. Missing exists guard causes THIRD_MOVE_CHARACTER_EFFECT loc failures when AI path skips selections."

- id: select_trigger_world_source_reads_previous_target
  pattern: ''
  detectability: needs_parser
  bad: "A later select_trigger uses source = world while visible/enabled/effect-preview logic reads scope:target or another earlier target_flag"
  correction: "Do not use source = world on a selector that depends on earlier selections. Omit source, use an inherited/actor source, or build an interaction_source_list so the chooser retains the previous target flags."
  category: scope
  scope: any
  source: "src/in_game/common/generic_actions/tv_trade_league_actions.txt (Trade League embargo country selector fix, 2026-05); reference_game_files/game/in_game/common/country_interactions/force_embargo.txt:33-36"
  notes: "Trade League embargo selected a market, then opened a country selector with source = world and filtered countries by any_owned_location = { market = scope:target }. The selector showed no countries and logged 'Asking for a flag that's not in the interaction target chooser specified'. Removing source = world kept the later selector in the same interaction-target chooser so scope:target remained available."

- id: generic_action_player_selector_uses_ai_interaction_source_list
  pattern: ''
  detectability: advisory
  only_in_paths: ['generic_actions']
  bad: "A player-facing select_trigger relies on ai_interaction_source_list to populate its candidate list"
  correction: "Use interaction_source_list for candidates shared by player and AI. Reserve ai_interaction_source_list for AI-only overrides only when the player selector also has a valid source, source_flags, or interaction_source_list."
  category: generic_actions
  scope: any
  source: "reference_official_defines/types/peace_treaties.txt:21-22; reference_game_files/game/in_game/common/generic_actions/readme.txt:25-26; fixed src/in_game/common/generic_actions/tv_io_leader_actions.txt"
  notes: "ai_interaction_source_list is only applied to AI countries. If it is the only custom source list, human players can see the selector's none_available_msg_key even when a valid target exists."

- id: generic_action_allow_rechecks_select_target_availability
  pattern: ''
  detectability: advisory
  only_in_paths: ['generic_actions']
  bad: "A generic action allow block calls a has-any-valid-target trigger solely to prevent opening an empty select_trigger chooser"
  correction: "Do not duplicate selector candidate scans in allow. Keep allow for actor/state/resource prerequisites, put target eligibility in select_trigger visible/enabled, provide none_available_msg_key for an empty chooser, and keep the final effect guarded with exists = scope:target."
  category: performance
  scope: generic_actions
  source: "reference_game_files/game/in_game/common/generic_actions/readme.txt:43-44; project performance rule, 2026-06-20"
  notes: "EU5 already handles a select_trigger with no selectable targets by showing the none_available_msg_key and blocking completion of that selection step. Repeating the same any-target scan in allow charges action rendering, tooltip evaluation, and AI/list evaluation before the chooser performs its own candidate pass."

- id: io_link_invalid_same_tick_creation
  pattern: ''
  bad: "international_organization:type_key used in the same effect call that creates the IO via create_international_organization"
  correction: "Use save_scope_as = my_io inside create_international_organization = { ... }, then reference scope:my_io. Put all post-creation IO operations (every_country loops, set_variable) inside the creation block. Save the calling country BEFORE the block with save_scope_as = tv_founder; use scope:tv_founder inside loops to reference the founder."
  category: scope
  scope: any
  source: "reference_game_files/game/in_game/common/scripted_effects/religious_effects.txt:69-82 (crusade_effect pattern)"
  notes: "international_organization:X link cannot resolve an IO created in the same effect invocation. Only works for IOs created in a previous tick or persisted from prior game state. Pattern empty — detection requires full effect-context analysis."

- id: change_variable_add_prev_var
  pattern: 'add\s*=\s*\{?\s*value\s*=\s*prev\.var:|add\s*=\s*prev\.var:'
  bad: "change_variable = { name = X add = prev.var:some_var } — reading a named variable from prev scope in a numeric value position"
  correction: "Use set_local_variable / change_local_variable to capture the numeric value before the scope switch, then use add = local_var:name inside the new scope. Example: set_local_variable = { name = tmp value = var:some_var }  then in the other scope: change_variable = { name = X add = local_var:tmp }."
  category: script
  scope: any
  source: "reference_game_files/game/in_game/common/situations/guelphs_and_ghibellines.txt:229 (add = local_var:guelphs_total_tax)"
  notes: "prev.var:X is valid only as a scope reference (country, religion, etc.), not as a numeric value source. Using it in an add = position causes 'Variable not of the value scope type. Type: empty'. Built-in scripted values like prev.num_locations are valid inline; only prev.var:X is broken."

- id: comparison_prev_var_numeric_rhs
  pattern: '(>=|<=|>|<)\s*prev\.var:'
  bad: "var:X ?= { this >= prev.var:some_numeric_var } or var:X > prev.var:some_numeric_var inside a trigger/effect limit"
  correction: "Use root.var:some_numeric_var when root is verified to be the original numeric owner, or capture the value before an effect iterator with set_local_variable and compare/use local_var:name inside the switched scope."
  category: script
  scope: any
  source: "runtime error.log: common/scripted_triggers/tv_engineering_department_triggers.txt:311; reference_game_files/game/in_game/common/missions/generic_capital_economy_mission_pack.txt:388 (root.var comparison)"
  notes: "Using prev.var:X as the RHS of a numeric comparison can log 'Invalid right side during comparison 'var'' and make the condition fail every tick. In Engineering Department construction this caused the monthly material check to fail and kept the UI stuck on the materials-insufficient pause state."

- id: comparison_plain_var_numeric_rhs_in_iterator
  pattern: ''
  detectability: needs_parser
  bad: "local_var:X ?= var:Y, local_var:X > var:Y, or similar dynamic numeric comparisons inside an effect/key iterator when var:Y is owned by the outer scope"
  correction: "Capture the outer-scope value before entering the iterator with set_local_variable, then compare local_var to local_var inside the iterator. For equality, prefer NOT < and NOT > against the captured local instead of ?= var:Y."
  category: script
  scope: any
  source: "runtime error.log: common/scripted_effects/tv_wonder_module_effects.txt:3305, 2026-06-10"
  notes: "During Engineering Department priority-candidate unregister, a variable-map key iterator compared a map-captured local candidate id against the country-scoped current candidate id with local_var:X ?= var:Y. EU5 logged 'Invalid right side during comparison var'. Capturing the country value into a second local before the iterator and comparing locals avoids the RHS parser path."

- id: nested_location_scope_plain_var_reads_location_store
  pattern: ''
  detectability: advisory
  bad: "Inside a location-scoped block (`capital = {}`, `var:site ?= {}`, `every_location_in_province = {}`, etc.), reading a country-owned numeric as plain `var:X`"
  correction: "Plain `var:X` always reads the current scope's variable store. After switching into a location/province block, use `root.var:X` when root is the original country owner, or capture the number before the scope switch with `set_local_variable` and use `local_var:X` inside the nested scope."
  category: scope
  scope: location
  source: "reference_game_files/game/in_game/events/disaster/chinese_crisis_events.txt:306-311 (change_prosperity = root.var:character_ability_prosperity_variable); runtime error.log: common/scripted_effects/tv_engineering_department_effects.txt:2128-2129"
  notes: "A nested location/province scope does not inherit country `var:` reads. If the numeric lives on the country, plain `var:X` inside the location block fetches the location variable store instead and can log 'Failed to fetch variable' / unset-scope errors."

- id: country_capital_link_non_optional_in_trigger
  pattern: ''
  detectability: advisory
  bad: "Country-scoped pulse, iterator, scripted trigger, or effect `limit` uses a direct `capital = { ... }` link, or puts sibling `exists = capital` before it expecting trigger short-circuiting"
  correction: "Use the optional link form `capital ?= { ... }` for trigger/limit checks. For effects, put `capital ?= { ... }` in the `limit`, and only enter direct `capital = { ... }` in the effect body after that `if` limit passes."
  category: scope
  scope: country
  source: "runtime error.log: common/scripted_triggers/towards_victory_triggers.txt:487, 2026-06-21; reference_game_files/game/in_game/common/generic_actions/religious_factions.txt:1352"
  notes: "Some countries can have no valid capital object when yearly/monthly refresh effects run. Trigger blocks do not reliably short-circuit sibling lines, so `exists = capital` beside `capital = { ... }` still allows the direct link to be evaluated and can log `Event target link 'capital' returned an invalid object`."

- id: random_list_inside_random
  pattern: 'random\s*=\s*\{[^}]*random_list'
  bad: "random = { chance = X random_list = { ... } } — nesting random_list as a child of random"
  correction: "random_list = { (100-X) = {} X = { random_list = { ... } } }. Use the outer random_list to implement the probability gate and the inner random_list to pick the specific outcome. Both levels of random_list are confirmed valid EU5 syntax."
  category: script
  scope: any
  source: "reference_game_files/game/in_game/common/situations/the_revolution.txt:59-72 (random_list { 98={} 1={event} 1={event} } pattern confirmed)"
  notes: "random_list as a direct child of random = { chance = X } is silently dropped by the EU5 engine — the 8% roll fires but the random_list produces no outcome. All intended events are skipped with no error in the log. Fix: restructure to nested random_list where the high-weight option is the no-event case."

- id: io_typed_variable_update_in_on_action
  pattern: ''
  bad: "Applying a computed bonus to an IO typed variable via change_variable inside on_action (e.g. every_international_organizations_member_of { change_variable { name = tv_arts_intl_influence add = local_var:X } }) to implement a monthly character contribution, or moving an existing visible IO variable's monthly gain from monthly_change into monthly_country_pulse/country effects"
  correction: "Put the contribution in the IO type's monthly_change scripted value using leader_country.var:X chained access: if = { limit = { international_organization_has_leader = yes  leader_country = { has_variable = X } }  add = { desc = KEY  value = leader_country.var:X } }. Store computed helper values on the country via on_action only for cached inputs or GUI display. If a visible IO variable stops advancing, fix the monthly_change scope/conditions or its cached inputs; do not migrate the source arithmetic out of monthly_change."
  category: script
  scope: any
  source: "reference_game_files/game/in_game/events/situations/red_turban_rebellions.txt:3371 (value = root.var:X); reference_game_files/game/in_game/common/laws/christian_tenets.txt:359 (value = scope:recipient.leader_country.modifier:X); src/in_game/common/international_organizations/tv_diplomatic_alliance.txt (leader_country.modifier: in monthly_change)"
  notes: "IO typed variables (in the variables = {} block of the IO type) have a monthly_change scripted value that drives the tooltip and automatic monthly breakdown. Contributions applied externally via on_action or country pulse change_variable are invisible to that breakdown and can make the UI lie even when the number changes. The leader_country.var:X chain is valid in scripted value context (same family as root.var:X); it is NOT valid in change_variable { add = } effect context (see change_variable_add_prev_var anti-pattern). Set leader_type = country and call set_leader_country in on_creation or the creation block."

- id: io_non_unique_scope_link
  pattern: ''
  bad: "international_organization:type_name or is_member_of_international_organization = type_name for an IO type without unique = yes"
  correction: "For non-unique IOs, never add unique = yes. Use on_creation = { set_leader_country = scope:actor } in the IO type definition to set the leader on creation. To scope to an IO instance at runtime, use every_international_organization = { limit = { type = type_name } ... }. Do NOT use international_organization:type_name or is_member_of_international_organization = type_name — both require unique = yes and will error at runtime for non-unique types."
  category: scope
  scope: any
  source: "runtime error.log: 'key tv_arts_exhibition does not lead to a unique international organization', reference_game_files/game/in_game/common/international_organizations/swiss_confederation.txt:3 (unique = yes enables the scope link)"
  notes: "tv_arts_exhibition is a non-unique IO: each country pursuing cultural victory creates their own independent instance. unique = yes is FORBIDDEN on this IO. The engine errors 'Failed to find a valid event target link' and 'does not lead to a unique international organization' for both the scope link and is_member_of_international_organization trigger. Pattern empty — static detection would require cross-referencing IO type definitions."

- id: is_courtier_invalid_after_move_country_unilateral
  pattern: 'is_courtier\s*=\s*yes'
  only_in_paths: ['on_action']
  bad: "is_courtier = yes in every_character limit to find a character dispatched via move_country in a generic_action"
  correction: "Use is_alive = yes + has_variable = <dispatch_tag> instead. The dispatch tag (e.g. tv_on_exhibition) set before move_country is sufficient to uniquely identify the character."
  category: scope
  scope: character
  source: "reference_game_files/game/in_game/common/country_interactions/invite_artist.txt:104 (move_country in formal interaction grants courtier); src/in_game/common/on_action/tv_arts_exhibition_on_action.txt"
  notes: "move_country called unilaterally from a generic_action (owncountry type) does NOT grant is_courtier = yes in the destination court. Only formal country_interaction invitations (e.g. invite_artist where the recipient accepts) produce a true courtier relationship. The result: every_character { is_courtier = yes } silently skips the dispatched character in both yearly and monthly pulses — timer never increments, no events fire."

- id: local_var_lost_across_var_scope_switch
  pattern: ''
  detectability: needs_parser
  bad: "set_local_variable inside var:X ?= {} and then reading that local_var from prev = {} or after leaving the dynamic scope. Example: var:tv_chief_artist ?= { set_local_variable = { name = ca value = artist_skill } change_local_variable = { name = ca multiply = 0.002 }  prev = { set_variable = { name = tv_chief_artist_monthly_bonus value = local_var:ca } } }"
  correction: "Use chained scope access from the original scope instead of switching when possible. To read a character skill stored in a country variable: value = var:tv_chief_artist.artist_skill. If a temporary value is needed inside a later scope, set_local_variable before entering that scope and read local_var:X inside it; that direction is valid."
  category: scope
  scope: any
  source: "reference_game_files/game/in_game/common/country_interactions/invite_artist.txt:129 (add = scope:target.artist_skill confirms chained character-scope access); hellenism_religion.txt:2866 (value = artist_skill as direct scripted value)"
  notes: "The unreliable direction is dynamic-scope local_var escaping outward through prev or later outer-scope reads. The opposite direction is valid: set_local_variable before a var:X ?= {} / location scope switch, then use local_var:X inside the nested scope."

- id: create_io_inner_effects_must_be_hidden
  pattern: ''
  bad: "add_country_to_international_organization = prev or set_leader_country = prev placed as direct (visible) children of create_international_organization = { ... }"
  correction: "Wrap add_country_to_international_organization and set_leader_country inside hidden_effect = { } within the create_international_organization block: create_international_organization = { type = ... hidden_effect = { add_country_to_international_organization = prev  set_leader_country = prev } }"
  category: script
  scope: any
  source: "reference_game_files/game/in_game/events/situations/red_turban_rebellions.txt:379-386"
  notes: "The vanilla tooltip strings THIRD_ADD_TO_INTERNATIONAL_ORGANIZATION_EFFECT and SET_LEADER_EFFECT use INTERNATIONAL_ORGANIZATION.GetName / .GetLeaderTitle. When these effects are visible children of create_international_organization, the engine evaluates the tooltip before the IO is fully instantiated, causing 'Promote INTERNATIONAL_ORGANIZATION returned nullptr' errors. Wrapping in hidden_effect suppresses tooltip generation and eliminates the errors. The outer create_international_organization tooltip (CREATE_INTERNATIONAL_ORGANIZATION_EFFECT) still shows correctly."

- id: var_optional_scope_silent_fail_nested_random_list
  pattern: ''
  bad: "var:X ?= { trigger_event_non_silently = ... } or var:X ?= { change_variable = ... } inside a random_list weight branch that is itself inside another random_list or every_character"
  correction: "Navigate to the scope ONCE before the random_list using save_scope_as: var:tv_exhibition_home_country ?= { save_scope_as = touring_home }. Then use scope:touring_home = { ... } inside every branch. Guard the outer random_list with if = { limit = { exists = scope:touring_home } }."
  category: scope
  scope: any
  source: "src/in_game/common/on_action/towards_victory_leaderboard.txt (Block C rewrite)"
  notes: "var:X ?= {} is the optional-navigation operator: it silently skips the block if the variable is unset or the target doesn't exist. Inside deeply nested random_list branches (every_character → random_list { 8 = { random_list { weight = { ... } } } }) the optional scope switch silently fails — no engine error is logged, the block is skipped, and no event fires. Pre-saving the target as a named scope before the random_list and using scope:name = {} inside branches is the reliable pattern."

- id: io_has_leader_invalid_gui_function
  pattern: 'InternationalOrganization\.HasLeader|GetInternationalOrganization\.HasLeader'
  bad: "visible = \"[InternationalOrganizationsView.GetInternationalOrganization.HasLeader]\" — HasLeader does not exist on InternationalOrganization in the GUI data system"
  correction: "Use IsLeaderCountryInPlace instead: visible = \"[InternationalOrganizationsView.GetInternationalOrganization.IsLeaderCountryInPlace]\". To display the IO leader character's name, use datacontext = \"[InternationalOrganizationsView.GetInternationalOrganization.GetLeaderCountry.GetGovernment.GetRuler]\" then text = \"[Character.GetShortNameWithNoTooltip]\"."
  category: gui
  scope: any
  source: "reference_game_files/game/in_game/gui/panels/organization/common_header.gui:10 (IsLeaderCountryInPlace); reference_game_files/game/in_game/gui/character_header.gui:46 (GetShortNameWithNoTooltip)"
  notes: "HasLeader is a method on Unit (for army/navy leaders), not on InternationalOrganization. Calling it on an IO scope produces 'Could not find data system function HasLeader' and a malformed token error. IsLeaderCountryInPlace is the equivalent check for IOs."

- id: event_flavor_invalid_key
  pattern: '^\s+flavor\s*=\s*flavor_'
  bad: "flavor = flavor_neutral / flavor_good / flavor_bad inside an event block"
  correction: "Use outcome = neutral / good / bad / positive / negative instead. Valid values confirmed from vanilla: neutral, good, bad, positive, negative."
  category: event
  scope: any
  source: "reference_game_files/game/in_game/events/culture/culture_greek.txt:2847 (outcome = neutral)"
  notes: "EU5 uses outcome = (neutral|good|bad|positive|negative); there is no 'flavor' key on events. Using flavor causes 'Unexpected token: flavor' parse errors and the event will be missing an outcome."

- id: event_multiple_desc_blocks_invalid
  pattern: ''
  bad: "Two or more top-level desc = { ... } blocks on the same event — e.g. desc = { desc = key_a trigger = {...} } followed by desc = { desc = key_b trigger = {...} }"
  correction: "Use a single desc block with first_valid + triggered_desc children: desc = { first_valid = { triggered_desc = { trigger = { ... } desc = key_a } triggered_desc = { trigger = { ... } desc = key_b } } }"
  category: event
  scope: any
  source: "reference_game_files/game/in_game/events/culture/culture_greek.txt:2831-2846"
  notes: "EU5 allows only one top-level desc block per event. A second desc block at the same level causes 'Scoped pointer has already been read' and 'There should be only one special desc' engine errors. All conditional descriptions must be nested inside a single desc = { first_valid = { ... } } block."

- id: var_read_without_outer_scope_guard
  detectability: needs_parser
  pattern: 'has_variable\s*=\s*(\w+)[\s\S]{0,300}var:\1\s*='
  only_in_paths: ['generic_actions']
  bad: "scope:actor = { has_variable = X } followed by scope:actor = { var:X = { ... } } in a generic action allow/custom_tooltip/trigger, expecting has_variable to suppress the var:X read"
  correction: "Use the optional variable link for variable-dependent reads: var:X ?= { ... }, var:X ?= 1, or var:X ?= { this >= N }. For generic actions, move a prerequisite to potential only when the action should disappear entirely. Do not rely on has_variable, custom_tooltip order, or separate sibling scope blocks to prevent a direct var:X read."
  category: scope
  scope: any
  source: "Runtime: docs/error_log/error.log (tv_govhouse_actions.txt:57); vanilla optional variable links: reference_game_files/game/in_game/common/generic_actions/autocephalous_patriarchates.txt:214 and reference_game_files/game/in_game/events/religion/buddhism_events.txt:1541"
  notes: "EU5 generic action UI evaluation may fetch every trigger line needed for tooltips, including sibling scope blocks inside allow. A direct var:X = { ... } fetches X before the logical result of has_variable can protect it, producing 'Failed to fetch variable' and 'Event target link var returned an unset scope'. Optional ?= returns false when the variable/scope is absent and avoids the error."

- id: generic_action_nullable_numeric_comparison_direct
  detectability: needs_parser
  pattern: ''
  only_in_paths: ['generic_actions']
  bad: "OR = { NOT = { has_variable = X } var:X < N } in generic action potential/allow/select_trigger logic when X may be unset"
  correction: "Use optional variable links for nullable reads. For bounded counts, emit an OR of NOT has_variable plus var:X ?= each allowed literal value, or otherwise restructure so the value is guaranteed initialized before the action can render. Do not use direct var:X < N when X can be absent."
  category: scope
  scope: generic_actions
  source: "runtime error.log: common/generic_actions/tv_trade_league_actions.txt:640/652/671, 2026-07-07"
  notes: "Generic action potential, allow, visible, and enabled blocks can be evaluated while startup/lifecycle variables are still absent. The engine still fetches the direct comparison inside an OR with NOT has_variable, logging Failed to fetch variable, unset var scope, and invalid left side errors. In Trade Chain add-node, the generated count < 20 checks were replaced with optional equality branches for 0..19 plus the unset branch."

- id: gui_datamodel_getlist_scope_wrapper
  pattern: ''
  bad: "item = { widget = { datacontext = \"[Scope.GetCharacter]\" ... action_button_diamond = { parameter = { parameter_value = \"[Character]\" } } } } — rebinding datacontext to Character, then using [Character] in action_button_diamond parameter_value"
  correction: "MakeScope.GetList returns Scope wrappers. Do NOT rebind datacontext inside item's widget. Instead, use the full Scope.GetCharacter chain everywhere: raw_text = \"[Scope.GetCharacter.GetNameToFit(...)]\", parameter_value = \"[Scope.GetCharacter]\". action_button_diamond evaluates parameter_value in UIAction context, which does NOT inherit parent widget datacontext — so [Character] after datacontext rebind silently resolves to the outer context or null."
  category: gui
  scope: any
  source: "reference_game_files/game/in_game/gui/panels/organization/middle_kingdom.gui:332-336 (GetList + Scope.GetCountry), reference_game_files/game/in_game/gui/government_lateralview.gui:4225 (parameter_value uses full explicit chain)"
  notes: "GetList always returns Scope wrappers regardless of stored type. action_button_diamond creates a UIAction object that evaluates parameter_value outside the widget's local datacontext chain. [Character] after datacontext = \"[Scope.GetCharacter]\" on the parent widget is NOT visible to the UIAction evaluator. Always use the explicit Scope.GetCharacter.xxx chain in every expression within the item, including parameter_value — never rely on datacontext inheritance through action_button_diamond."

- id: advance_inject_duplicates_allow_block
  pattern: ''
  bad: "INJECT:advance_name = { allow = { ... } } when the vanilla advance already has an allow block"
  correction: "Use REPLACE:advance_name = { <full vanilla block> allow = { OR = { <mod condition> <original condition> } } } to merge conditions. Use INJECT only for advances with no existing allow block."
  category: modifier
  scope: any
  source: "reference_game_files/game/in_game/common/advances/0_age_of_discovery.txt:336 (printing_press_advance has allow); reference_mods/3649381461/in_game/common/advances/mod_improved_trade_and_buildings_advances.txt:1 (REPLACE syntax)"
  notes: "EU5 advance definitions allow only ONE allow block. INJECT appends properties; a second allow block via INJECT is invalid. Must copy the full vanilla advance definition into a REPLACE block and merge the OR condition manually."

- id: io_limit_leader_country_non_optional
  pattern: '(?<!set_)leader_country = scope:actor'
  bad: "leader_country = scope:actor inside limit = {} inside any/every_international_organizations_member_of — non-optional = operator on leader_country"
  correction: "leader_country ?= scope:actor — use the optional scope operator so null leader_country returns false instead of erroring"
  category: scope
  scope: any
  source: "reference_game_files/game/in_game/common/generic_actions/unlockable_io_actions.txt:322"
  notes: "EU5 tooltip evaluator does not short-circuit inside limit = {} blocks. any_international_organizations_member_of iterates ALL IOs the country is a member of (including vanilla coalitions, sects, unions) that have no leader_country. Using = on a null scope throws 'Event target link leader_country returned an invalid object'. Also: DA and Academy IOs had empty on_creation blocks that never called set_leader_country, making leader_country permanently null and breaking the leader block entirely."

- id: io_trigger_iterator_limit_invalid
  pattern: 'any_international_organizations_member_of\s*=\s*\{\s*limit\s*='
  only_in_paths: ['scripted_triggers']
  bad: "limit = {} as a direct child of any_international_organizations_member_of in a scripted trigger"
  correction: "In trigger context, put iterator filters directly in the block: any_international_organizations_member_of = { international_organization_type = international_organization_type:<io_type> ... }. Reserve limit = {} for effect iterators such as every_international_organizations_member_of."
  category: scope
  scope: country
  source: "src/in_game/common/scripted_triggers/tv_arts_exhibition_triggers.txt:7-10; runtime error.log tv_engineering_department_triggers.txt:68"
  notes: "The trigger iterator treats direct children as trigger clauses; limit is not a trigger here and logs 'Unknown trigger type: limit'."

- id: io_any_member_of_not_effect_iterator
  pattern: ''
  detectability: needs_parser
  only_in_paths: ['scripted_effects']
  bad: "Using any_international_organizations_member_of as an effect iterator in a scripted_effect body"
  correction: "Use every_international_organizations_member_of = { limit = { international_organization_type = international_organization_type:<io_type> ... } ... } when applying effects. Keep any_international_organizations_member_of only inside trigger contexts such as if/limit blocks."
  category: scope
  scope: country
  source: "docs/error_log/error.log; fixed in scripts/in_game/common/scripted_effects/gen_tv_trade_league_effects.py"
  notes: "any_international_organizations_member_of is trigger syntax. In effect context the engine logs Unknown effect any_international_organizations_member_of."

- id: country_interaction_potential_io_iterator_without_actor
  pattern: 'potential\s*=\s*\{\s*(?:hidden_trigger\s*=\s*\{\s*)?(?:NOT\s*=\s*\{\s*)?any_international_organizations_member_of\s*='
  detectability: lint
  only_in_paths: ['country_interactions']
  bad: "any_international_organizations_member_of directly under country_interaction potential"
  correction: "Wrap country-scoped checks in scope:actor = { ... } inside country_interaction potential."
  category: scope
  scope: country
  source: "reference_official_defines/types/country_interactions.txt:11; reference_game_files/game/in_game/common/country_interactions/bribe_vote.txt:26-33"
  notes: "country_interaction potential does not provide a country root for this iterator; direct usage logs inconsistent trigger scopes (invalid vs. country). Official defines document scope:actor as the acting country."

- id: tv_io_chooses_new_leader_forbidden
  pattern: 'international_organization_chooses_new_leader'
  bad: "Calling international_organization_chooses_new_leader anywhere in TV IO-related code (leader management actions, on_action, events, effects)"
  correction: "Never call international_organization_chooses_new_leader on TV IO types. The leader_country is locked to the founding country via on_creation and never reassigned. The great person character is tracked via independent country variables. This effect triggers the vanilla EU5 leader-election process, which violates the no-elections design."
  category: script
  scope: any
  source: "src/in_game/common/international_organizations/tv_diplomatic_alliance.txt (leader_change_trigger_type = none), tv_arts_exhibition.txt (leader_change_trigger_type = none), tv_academy_of_sciences.txt (leader_change_trigger_type = none)"
  notes: "international_organization_chooses_new_leader re-runs the leader selection process, which with leader_change_trigger_type = none still evaluates the leader = {} block and may reassign the engine-internal leader state in ways inconsistent with the design. The design deliberately omits this call to fully prevent any automatic leader change."

- id: tv_io_unique_yes_forbidden
  pattern: '^\s*unique\s*=\s*yes'
  only_in_paths: ['international_organizations']
  bad: "unique = yes on a TV IO type definition (tv_arts_exhibition, tv_diplomatic_alliance, tv_academy_of_sciences)"
  correction: "All three TV IOs are non-unique (unique = no). Never add unique = yes. Use every_international_organizations_member_of = { limit = { international_organization_type = international_organization_type:<io_type> } ... } to scope to them from country scope."
  category: scope
  scope: any
  source: "src/in_game/common/international_organizations/tv_diplomatic_alliance.txt:3 (unique = no)"
  notes: "Adding unique = yes would collapse per-country IO instances into one shared instance, breaking the independent-per-country design. It also makes international_organization:type_name syntax appear to work, masking the underlying design violation."

- id: tv_io_unique_scope_link
  pattern: 'international_organization:(tv_arts_exhibition|tv_diplomatic_alliance|tv_academy_of_sciences)'
  bad: "international_organization:tv_arts_exhibition (or tv_diplomatic_alliance, tv_academy_of_sciences) scope link"
  correction: "Use every_international_organizations_member_of = { limit = { international_organization_type = international_organization_type:<io_type> } ... }. The international_organization:type_name syntax requires unique = yes and produces a runtime error for non-unique types."
  category: scope
  scope: any
  source: "src/in_game/common/international_organizations/tv_diplomatic_alliance.txt:3 (unique = no)"
  notes: "All three TV IO types have unique = no. Using international_organization:X on non-unique types causes 'does not lead to a unique international organization' and the scope resolves to null, silently skipping all effects."

- id: tv_io_appointed_leader_forbidden
  pattern: 'appointed_leader\.'
  bad: "appointed_leader.adm, appointed_leader.dip, appointed_leader.artist_skill, etc. in TV IO monthly_change or monthly_effect blocks"
  correction: "Use leader_country.var:tv_xxx_leader_char.attribute instead. Example: value = leader_country.var:tv_academy_leader_char.adm. Always guard with international_organization_has_leader = yes and leader_country = { has_variable = tv_xxx_leader_char }."
  category: scope
  scope: any
  source: "src/in_game/common/international_organizations/tv_academy_of_sciences.txt:87 (leader_country.var:tv_academy_leader_char.adm); src/in_game/common/international_organizations/tv_arts_exhibition.txt:49 (leader_country.var:tv_arts_exhibition_leader_char.artist_skill)"
  notes: "appointed_leader accesses the leader via the vanilla IO leader mechanism, which in our design is decoupled from the great person character. The great person is stored as a country variable on leader_country; chained access leader_country.var:tv_xxx_leader_char.attribute is the correct pattern."

- id: artist_skill_is_normalized_float
  pattern: 'artist_skill\s*\n.*multiply\s*=\s*0\.00[0-9]'
  bad: "value = character.artist_skill  multiply = 0.002 (assuming artist_skill is an integer 0-100 scale)"
  correction: "Use multiply = 0.1 (or other factor scaled to the 0-1 range). artist_skill in EU5 is a normalized float 0.0-1.0, not a raw integer. A skill-5 artist returns ~0.5, not 5."
  category: modifier
  scope: character
  source: "src/in_game/common/international_organizations/tv_arts_exhibition.txt (confirmed by runtime: original multiply = 0.002 was 100× too small; corrected to multiply = 0.1)"
  notes: "artist_skill is a level-based attribute normalized to [0,1] by the engine when accessed as a scripted value. Design formulas written assuming 0-100 scale must divide the intended multiplier by 100."

- id: character_modifier_missing_game_data_category
  pattern: ''
  bad: "Static modifier used with add_character_modifier but defined without game_data = { category = character }, e.g. my_modifier = { }"
  correction: "All static modifiers intended for use with add_character_modifier / has_character_modifier MUST include game_data = { category = character }. Example: my_modifier = { game_data = { category = character } [effects...] }"
  category: modifier
  scope: character
  source: "reference_game_files/game/main_menu/common/static_modifiers/character.txt:227-232 (bastard); D008_fate_of_the_phoenix_modifiers.txt:472-480 (despot_modifier)"
  notes: "Without category = character, the engine does not recognize the modifier as character-scoped. add_character_modifier runs (tooltip shows the grant) but the modifier is not stored on the character — has_character_modifier returns false and no title prefix fires. Confirmed at runtime: tv_chief_artist_role_modifier = {} appeared in appoint tooltip but never on the character panel."


- id: govhouse_tactic_as_character_modifier
  pattern: 'add_character_modifier\s*=\s*\{\s*modifier\s*=\s*tv_govhouse_tactic_'
  bad: "Applying Governor's House War Tent tactics with add_character_modifier"
  correction: "Governor's House War Tent tactics intentionally use country-scoped modifiers as a fallback because the combat modifiers did not take effect from the general character in this system. Keep a code comment near the country modifier application explaining the approximation."
  category: modifier
  scope: country
  source: "runtime behavior in Governor's House War Tent; src/in_game/events/tv_govhouse_events.txt"
  notes: "Vanilla character static modifiers can carry commander/army combat modifiers in general, but the Governor's House stored-general tactic application did not affect combat from the character. This feature is intentionally approximated as a country modifier."

- id: artist_selector_should_use_artist_column
  pattern: 'name\s*=\s*"tv_select_arts_leader"[\s\S]{0,240}?column\s*=\s*\{\s*data\s*=\s*character_info\s*\}'
  only_in_paths: ['generic_actions']
  bad: "Arts leader select_trigger using column.data = character_info"
  correction: "Use column.data = character_artist for artist-only character selectors so the list uses the artist ability view."
  category: gui
  scope: character
  source: "reference_game_files/game/in_game/common/country_interactions/invite_artist.txt:68; reference_game_files/game/in_game/gui/attribute_columns/character.gui:10"
  notes: "The character_artist attribute column swaps the character list's ability area and tooltip to artist skill. Generic character_info shows ruler-style ADM/DIP/MIL information and is the wrong view for selecting a Chief Artist."

- id: custom_description_collapses_multi_condition_tooltip
  pattern: ''
  bad: "custom_description { text = KEY  has_variable = X  var:X >= N  has_variable = Y  var:Y >= M } — multiple independent conditions collapsed into one block"
  correction: "Use one custom_tooltip block per condition group at the top level of the scripted_trigger body (implicit AND). The extra_trigger_block YAML field must be a complete custom_tooltip { } block, not raw condition lines."
  category: gui
  scope: scripted_triggers
  source: "reference_game_files/game/in_game/common/scripted_triggers/building_triggers.txt:1-13"
  notes: "When multiple sub-conditions are collapsed into one custom_description or custom_tooltip, the player sees a single pass/fail indicator for all conditions combined. Separate custom_tooltip blocks each show their own pass/fail state, allowing the player to see which specific sub-condition is not yet met."

- id: customizable_localization_duplicate_key_ignored
  pattern: ''
  only_in_paths: ['customizable_localization']
  bad: "Defining a second character_title_prefix block in a separate customizable_localization file"
  correction: "Copy/generate the full vanilla character_title.txt and insert custom title text entries into the original character_title_prefix block."
  category: localization
  scope: character
  source: "reference_game_files/game/in_game/common/customizable_localization/character_title.txt:1; runtime debug.log: 'Duplicated key character_title_prefix will not be created'"
  notes: "Top-level customizable localization keys are unique database entries, not additive merge blocks. A duplicate block is ignored, so custom character title prefixes never load."

- id: mod_io_geticon_without_matching_texture
  pattern: 'InternationalOrganization\.GetIcon|InternationalOrganizationsView\.GetInternationalOrganization\.GetIcon'
  detectability: advisory
  bad: "Relying on InternationalOrganization.GetIcon for a mod-defined IO without providing a matching icon texture"
  correction: "Add a DDS at main_menu/gfx/interface/icons/international_organizations/<io_type>.dds. The filename should match the international_organization type key, e.g. tv_arts_exhibition.dds."
  category: gui
  scope: international_organization
  source: "reference_game_files/game/in_game/gui/panels/organization/common.gui:26; C:/Program Files (x86)/Steam/steamapps/common/Europa Universalis V/game/main_menu/gfx/interface/icons/international_organizations/hre.dds"
  notes: "The shared IO UI calls InternationalOrganization.GetIcon. Vanilla IO icon files are named after IO type keys in gfx/interface/icons/international_organizations/. Mod IOs without matching files fall back to the generic IO icon."

- id: game_concept_loc_without_concept_definition
  pattern: ''
  only_in_paths: ['localization']
  bad: "Adding localization keys game_concept_tv_x / game_concept_tv_x_desc and then using [tv_x|e] without defining tv_x in main_menu/common/game_concepts"
  correction: "Register every custom concept ID in src/main_menu/common/game_concepts/tv_game_concepts.txt with at least a texture block. Localization alone is not enough."
  category: localization
  scope: game_concepts
  source: "reference_game_files/game/main_menu/common/game_concepts/00_game_concepts.txt:73-75; runtime error.log: Data error in loc string 'tv_cultural_m1_io_grant_tt'"
  notes: "Unregistered custom concepts in square brackets are parsed as data-system functions. The engine logs 'Could not find data system function <concept>' and renders ERROR:<concept> in tooltip text."

- id: gui_dynamic_selectgameconcept_localized_key
  detectability: advisory
  pattern: ''
  only_in_paths: ['gui']
  bad: "Using dynamic concept-link helpers with key expressions that can be localized before the concept-link parser consumes them"
  correction: "Feed SelectGameConcept or [...|E] only registered raw concept ids. For generated dynamic routes, store a numeric id and build ids such as tv_wonder_display_<id>; use Localize(Concatenate('game_concept_', key)) only for intentionally plain text."
  category: gui
  scope: localization
  source: "runtime error.log from location_window.gui dynamic wonder display: Data error in loc string with localized wonder name"
  notes: "The failing test used a flag-derived wonder key that localized before link parsing. The bug is the localized key source, not numeric-id dynamic concept routing."

- id: gui_getflagname_used_as_raw_key
  detectability: advisory
  pattern: 'GetFlagName'
  only_in_paths: ['gui']
  bad: "Using GetFlagName from a script variable or variable_map value as a raw script key for localization, modifier, texture, or effect-name concatenation"
  correction: "If the downstream GUI needs a stable script key, store a numeric id and generate static id branches, or use a typed datamodel object with a real GetKey accessor. Treat GetFlagName as display/localization-prone text."
  category: gui
  scope: variable_map
  source: "in-game location_window dynamic display test: GetFlagName for flag:tv_wonder_unique_pharos_lighthouse rendered 法罗斯灯塔"
  notes: "Concept/localized flags can return their localized display name in GUI. Concatenating that result produced game_concept_法罗斯灯塔 and 法罗斯灯塔_level_3 instead of raw script keys."

- id: variable_map_scope_link_used_direct_rhs
  pattern: ''
  detectability: needs_parser
  bad: "Using a quoted variable_map/global_variable_map/local_variable_map lookup directly as an equality right-hand side, trigger comparison RHS, or effect parameter after scope switching"
  correction: "Use variable-map lookups primarily as left-side scope links. When the mapped value is needed as a RHS, first capture it with set_local_variable or set_variable in the map-owning scope, then use local_var:X or var:X. Prefer local_var for temporary values."
  category: scope
  scope: variable_map
  source: "User-provided Variable maps reference excerpt, 2026-06-04; TV runtime test with Engineering Department wonder helper building probes"
  notes: "Quoted variable-map expressions are reliable for entering the mapped value scope on the left side. Runtime tests found direct RHS use unreliable for value extraction or comparisons, e.g. building_type = \"variable_map(...)\" inside a later location/building scope. Cache the mapped value before entering the later scope."

- id: variable_map_rebuild_on_read_path
  pattern: ''
  detectability: advisory
  bad: "Calling a variable-map/global-map rebuild effect, including an if-needed rebuild router, from GUI refresh, country cache refresh, tooltip/projection, selection, monthly read, or other hot/read paths as a compatibility fallback"
  correction: "Build global variable-map indexes only at lifecycle points: startup, save-load initialization, data-change regeneration, or explicit initialization. If a read misses a map, fix the current lifecycle hook or the call order that reads before initialization; do not add if-needed routers, old-schema repair, or legacy state preservation."
  category: performance
  scope: variable_map
  source: "Engineering Department global wonder-map lifecycle fix, 2026-06-11"
  notes: "Engineering Department briefly added tv_wonder_index_rebuild_global_maps_if_needed_effect with a map-version gate, then called it from cache/module refresh paths. That violated the no-compatibility policy, hid lifecycle/call-order bugs, and charged hot paths for defensive global-map checks."

- id: variable_map_callback_root_in_generic_action
  pattern: ''
  detectability: needs_parser
  bad: "Using root inside a variable-map key callback called from a generic-action effect to write back to the action actor/current country"
  correction: "Save the current owner scope before random_key_in_variable_map/every_key_in_variable_map, then write back through scope:<saved_owner>; preserve the variable-map key stream instead of replacing it with generated per-id branches."
  category: scope
  scope: variable_map
  source: "Runtime error.log from Engineering Department Great Engineer select-trigger tooltip pre-evaluation, 2026-06-04"
  notes: "Generic action selector hover can pre-evaluate action effects without a usable root event target. A proposal deck helper using random_key_in_variable_map -> root = { set_variable = { value = prev } } logged Event target link 'root' returned an unset scope and left no proposal slots."

- id: variable_map_key_iterator_scope_used_for_map_read
  pattern: ''
  detectability: needs_parser
  bad: "Calling is_key_in_variable_map on the current every_key_in_variable_map/ordered_key_in_variable_map callback scope, especially with target = this"
  correction: "Save the map-owning scope before the key iterator, copy this into a local variable, and run is_key_in_variable_map inside scope:<saved_owner> with target = local_var:<key>."
  category: scope
  scope: variable_map
  source: "Runtime error.log: common/scripted_effects/tv_wonder_module_effects.txt:3364 via tv_wonder_bribe_proposal generic action, 2026-06-10"
  notes: "In a key iterator callback the current scope may be the numeric key itself (for example 1.00), which does not support scope-owned variables. Membership checks for sibling country-scoped maps must execute from the saved country/map owner while the key is passed through a local variable."

- id: variable_map_owner_read_from_item_iterator_scope
  pattern: ''
  detectability: needs_parser
  bad: "Calling is_key_in_variable_map or variable_map(...) for a country-scoped map directly from an every_in_list/random_in_list/any_in_list item scope such as a region, location, or character"
  correction: "Save the country/map owner before the item iterator, copy the dynamic key to a local variable, and run both is_key_in_variable_map and the quoted variable_map scope link inside scope:<saved_owner>."
  category: scope
  scope: variable_map
  source: "Runtime error.log: common/scripted_effects/tv_govhouse_effects.txt:2281 via Governor's House creation, 2026-07-07"
  notes: "Governor's House display refresh iterated tv_govhouse_region_list, making the current scope a region. The country-scoped region_to_admin_location map check then logged 'This scope doesn't support variables' for each region. The same pattern can happen while iterating character/location lists; variable-map reads belong on the scope that owns the map."

- id: ordered_key_variable_map_oversized_max
  pattern: ''
  detectability: advisory
  bad: "Using an inflated ordered_key_in_variable_map max value such as 10000 to process every current key"
  correction: "Use every_key_in_variable_map with a found/stop flag when all keys may need inspection, or set ordered_key_in_variable_map max only to an exact known upper bound that cannot exceed the current map size."
  category: scope
  scope: variable_map
  source: "Runtime error.log: common/scripted_effects/tv_wonder_module_effects.txt:3361 via Engineering Department saved priority proposal selection, 2026-06-10"
  notes: "EU5 logs a Script system error when ordered_key_in_variable_map max is larger than the current key list, even though it reports that it capped max at the list size. Do not use a huge max as a harmless 'iterate all' shortcut."

- id: gui_css_like_fittype_contain
  detectability: advisory
  pattern: 'fittype\s*=\s*contain'
  only_in_paths: ['gui']
  bad: "Using CSS-like GUI image fittype = contain"
  correction: "Use a vanilla-supported EU5 fittype such as centercrop, fill, start, or end, or omit fittype when no fit transform is needed."
  category: gui
  scope: image
  source: "runtime error.log from location_window.gui: Unknown fit type 'contain'; vanilla GUI search shows fittype values centercrop/fill/start/end"
  notes: "EU5 GUI fittype names are not CSS object-fit names. The location-window dynamic test icon used contain and failed static GUI conversion at startup."

- id: engineering_building_loc_used_as_game_concept
  detectability: lint
  pattern: '\[(tv_wonder_labor_camp|tv_wonder_material_depot|tv_wonder_material_dispatch_point)\|[Ee]\]'
  only_in_paths: ['localization']
  bad: "Engineering Department support building localization keys used as square-bracket game concept links"
  correction: "Use plain localization substitution such as $tv_wonder_labor_camp$ for building names, or register a real game concept before using [key|E]."
  category: localization
  scope: gui
  source: "runtime error.log: pdx_gui_localize.cpp:302 in tv_engineering_department.gui; fixed in src/main_menu/localization/english/tv_engineering_department_l_english.yml"
  notes: "These support buildings have normal localization keys, not game_concept definitions. In GUI-bound localized text, [tv_wonder_labor_camp|E] is parsed as a data-system function and logs Could not find data system function."

- id: localization_getbuilding_function_invalid
  detectability: lint
  pattern: '\[GetBuilding\(''[^'']+''\)\.GetName\]'
  only_in_paths: ['localization', 'io_establishment.yaml']
  bad: "Using [GetBuilding('building_key').GetName] inside localization text"
  correction: "Use the localization helper [ShowBuildingTypeName('building_key')] for building-type display names."
  category: localization
  scope: building
  source: "runtime error.log: pdx_data_factory.cpp failed to find type GetBuilding in IO establishment localization; fixed in data/io_establishment.yaml"
  notes: "EU5 localization exposes ShowBuildingTypeName/ShowBuildingTypeNameWithNoTooltip helpers for building types. GetBuilding('key').GetName is not a valid localization data function and causes GUI-bound localized text parsing to fail."

- id: generic_action_loc_uses_gui_country_binding
  detectability: advisory
  pattern: ''
  only_in_paths: ['localization']
  bad: "Using datacontext-dependent Country.MakeScope or container-dependent SCOPE.sCountry('actor') reads inside generic action title/description localization"
  correction: "Generic action description loc may be prefetched with no Country datacontext and no script-scope Container. Preserve player-country dynamic features by using a context-independent global binding such as Player.MakeScope, or move non-player-scope dynamic lines to a GUI widget/tooltip with an explicit datacontext. Do not replace the dynamic feature with static text without user approval."
  category: localization
  scope: generic_actions
  source: "runtime error.log from Engineering Department accept-proposal description, 2026-06-04"
  notes: "action_button descriptions may be localized once through a contextless prefetch path and again through the real action hover. Country.MakeScope.GetVariable(...) and SCOPE.sCountry('actor').MakeScope.GetVariable(...) produced continuous PdxDataFetchLocalizedData errors even while the visible tooltip rendered the selected wonder correctly."

- id: gui_no_get_area_accessor
  pattern: 'GetVariable\([^)]*\)\.GetArea\.'
  bad: "GetVariable('tv_governed_area').GetArea.GetName — navigating from a scope variable that stores an Area to call .GetName directly via .GetArea"
  correction: "GetVariable(...).GetArea is not a valid EU5 GUI accessor. To display an area name from a scope variable, store a location from the area as a separate character variable (e.g. tv_governed_area_capital), then use GetVariable('tv_governed_area_capital').GetLocation.GetArea.GetNameWithNoTooltip. Location.GetArea.GetName IS valid when the Location type is a proper GUI-layer typed object (e.g. from GetLocation on a typed view)."
  category: gui
  scope: any
  source: "Exhaustive search of reference_game_files/game/main_menu/gui/ — zero occurrences of GetVariable(...).GetArea in any .gui file. Location.GetArea IS used in reference_game_files/game/in_game/gui/context_menu.gui and area.gui (typed Location, not scope variable). GetVariable('x').GetLocation confirmed valid in fall_of_delhi.gui."
  notes: "The accessor .GetArea exists on the Location GUI type but not on scope variable wrappers returned by GetVariable(). Chain: GetVariable('loc_var').GetLocation.GetArea.GetNameWithNoTooltip works because GetLocation returns a typed Location object. Pattern rule narrowed to only flag GetVariable(...).GetArea. to allow Location.GetArea. chains."

- id: kill_character_yes_in_character_scope
  pattern: 'kill_character\s*=\s*yes'
  bad: "kill_character = yes"
  correction: "Use kill_character = this when in character scope (e.g. inside var:name ?= { }), or kill_character = scope:char_ref from any scope. kill_character = yes is invalid — EU5 expects a character scope reference, not a boolean."
  category: event
  scope: character
  source: "reference_game_files/game/in_game/events/DHE/flavor_ENG.txt:11243"
  notes: "kill_character takes a character scope value, not a boolean. kill_character = yes causes PostValidate error: target scope type boolean, expected character."

- id: remove_trait_missing_trait_prefix
  pattern: 'remove_trait\s*=\s*(?!trait:)\w+'
  bad: "remove_trait = blind"
  correction: "remove_trait = trait:blind — always prefix the trait name with trait: for remove_trait and add_trait effects. Note: has_trait = blind (no prefix) is correct for trigger checks."
  category: event
  scope: character
  source: "reference_game_files/game/in_game/events/character/artist_events.txt:260"
  notes: "remove_trait effect requires trait: prefix (remove_trait = trait:blind). has_trait trigger does NOT use the prefix (has_trait = blind). Mixing them causes: remove_trait effect [ target: field not set ]."

- id: none_available_msg_key_missing_trigger_no_icon
  pattern: ''
  bad: "none_available_msg_key localization value missing @trigger_no! icon prefix"
  correction: "In the localization YAML, the VALUE of the none_available_msg_key string must begin with @trigger_no! — e.g. \"@trigger_no! No characters available.\" The key name itself has no prefix requirement."
  category: localization
  scope: any
  source: "src/main_menu/localization/english/tv_arts_exhibition_l_english.yml:27"
  notes: "Engine logs: Key X doesn't exist or doesn't start with trigger_no icon. The @trigger_no! inline icon must be the first token in the localization value string."

- id: generic_action_selector_unknown_attribute_column
  pattern: ''
  detectability: advisory
  bad: "Using column = { data = character_noble } or another selector attribute column that is not defined in common/attribute_columns"
  correction: "Use a defined attribute column such as character_info or character_artist, or add a real common/attribute_columns entry plus localization. Keep eligibility filtering in visible/enabled."
  category: generic_actions
  scope: character
  source: "runtime error.log, 2026-06: character_noble localization fallback; reference_game_files/game/in_game/common/attribute_columns/09_character.txt defines character_info and character_artist"
  notes: "The selector column data token is an attribute-column id, not a free label for the filtered target type. An undefined column can surface as a startup localization fallback such as character_noble: \"Character noble\"."

- id: character_traits_wrong_directory
  pattern: 'common/character_traits/'
  bad: "Placing character trait definitions in common/character_traits/ (e.g. src/in_game/common/character_traits/my_traits.txt)"
  correction: "Place trait files in common/traits/ — the correct EU5 directory: src/in_game/common/traits/my_traits.txt"
  category: script
  scope: any
  source: "reference_game_files/game/in_game/common/traits/ (confirmed directory; character_traits/ does not exist in vanilla)"
  notes: "EU5 loads character traits from common/traits/ not common/character_traits/. Files in the wrong directory are silently ignored and all has_trait checks against those trait IDs produce 'Invalid database object' errors at PostValidate."

- id: construct_building_cost_multiplier_needs_reason
  pattern: ''
  bad: "construct_building = { ... cost_multiplier = N ... } without cost_multiplier_reason"
  correction: "When construct_building uses cost_multiplier, also provide cost_multiplier_reason = <loc key>. For event-funded free construction, vanilla commonly uses cost_multiplier_reason = \"game_concept_event\"."
  category: script
  scope: location
  source: "reference_game_files/game/in_game/events/situations/golden_age_of_piracy.txt:261-265"
  notes: "EU5 logs a script system error when construct_building has a cost multiplier but no reason key: 'No reason given for the cost multiplier in construct_building effect'."

- id: noncapital_building_country_effects_via_capital_country_modifier
  pattern: ''
  only_in_paths: ['building_types']
  bad: "Using capital_country_modifier for a building that can be finalized or created outside the capital, expecting country-wide effects everywhere"
  correction: "Keep local effects in building modifier/raw_modifier; for noncapital national effects use Country Auto modifiers gated by owned buildings, or require the building to be in the capital."
  category: modifier
  scope: country
  source: "reference_official_defines/types/building_types.txt:29"
  notes: "capital_country_modifier is explicitly applied to the country only if the building is built in the capital. Engineering Department wonders may be sited outside the capital, so their final buildings carry national/base/ritual country effects only as display data; actual national effects come from building-gated Country Auto modifiers."

- id: gui_text_missing_localization_key
  pattern: ''
  only_in_paths: ['gui']
  bad: "text = \"LOC_KEY\" in a GUI file when LOC_KEY is not defined in main_menu/localization"
  correction: "Define the key in every supported localization file, correct the key to an existing one, or use raw_text for literal display strings."
  category: localization
  scope: any
  source: "runtime error.log: pdx_gui_localize.cpp:182"
  notes: "GUI text fields are localized. A typo such as TV_RM_TARGET_STEAM_ENGINE when only TV_RM_TARGET_IRON_WORKING exists logs 'Unlocalized text' at load."

- id: generic_action_missing_ai_list
  pattern: ''
  only_in_paths: ['generic_actions']
  bad: "Defining a generic action without listing it in common/generic_action_ai_lists"
  correction: "Add every generic action id to at least one generic_action_ai_lists file. Use the list potential to restrict evaluation to countries that can use that feature; player-only actions may still set ai_will_do = { add = -100 }."
  category: script
  scope: country
  source: "reference_game_files/game/in_game/common/generic_action_ai_lists/readme.txt:3-7; runtime error.log: generic_action_ai_list.cpp:82"
  notes: "Unlisted generic actions are put into the global AI list and the engine logs a performance warning: 'Action X is not explicitly listed in an ai list!'."

- id: on_action_simulates_generic_action_actor_context
  pattern: ''
  detectability: advisory
  only_in_paths: ['on_action', 'scripted_effects', 'generic_actions']
  bad: "A monthly/yearly/on_action helper manually simulates a generic action by calling action/building eligibility helpers that evaluate code expecting literal scope:actor."
  correction: "Put AI behavior on the generic action itself with ai_tick, ai_will_do, and a generic_action_ai_lists entry. If an execution-only pulse must call action-style helpers, create the exact event targets they require before evaluating them; a custom saved scope name is not a substitute for scope:actor."
  category: scope
  scope: country
  source: "runtime error.log, 2026-06: IO establishment monthly AI progress called location_and_owner_can_build, which evaluated headquarters building allow blocks reading scope:actor; fixed in scripts/gen_victory.py and scripts/in_game/common/generic_actions/gen_tv_io_leader_actions.py"
  notes: "The generated tv_io_establishment_ai_progress_effect saved the country as tv_io_establishment_ai_actor, then entered capital and called location_and_owner_can_build. That helper invokes can_build_building for the location and owner, causing the building allow block to read scope:actor. Because the monthly pulse did not define the literal actor event target, the engine logged Undefined event target 'actor' and unset scope errors every month. The current flow keeps monthly pulses to requirement/cache updates and lets AI use the generated build-HQ/establish-IO actions."

- id: price_missing_cost_modifier_type
  pattern: ''
  only_in_paths: ['prices']
  bad: "Defining a mod price key without a matching <price_key>_cost_modifier modifier type"
  correction: "For every mod-defined price key, add <price_key>_cost_modifier in main_menu/common/modifier_type_definitions with category = country, and localize the price key plus MODIFIER_TYPE_NAME/DESC entries."
  category: modifier
  scope: country
  source: "src/main_menu/common/modifier_type_definitions/towards_victory_modifier_types.txt:41; runtime error.log: price_database.cpp:116"
  notes: "EU5 automatically looks for a cost modifier type named <price_key>_cost_modifier for each price. If it is absent, the engine logs 'Missing modifier type for price'."

- id: custom_goods_missing_modifier_type_family
  pattern: ''
  detectability: advisory
  only_in_paths: ['goods']
  bad: "Defining a custom goods key without the matching auto-requested modifier type family"
  correction: "For every custom goods ID, add ban_exports_of_<good>, ban_imports_of_<good>, local_<good>_output_modifier, global_<good>_output_modifier, can_extract_<good>, <good>_impacts_inflation, <good>_used_for_minting, and global_<good>_pop_demand in main_menu/common/modifier_type_definitions, matching vanilla goods categories and boolean/percent flags."
  category: modifier
  scope: country
  source: "reference_game_files/game/main_menu/common/modifier_type_definitions/00_modifier_types.txt:9391-9415; runtime error.log: modifier_type.cpp:1147"
  notes: "EU5 automatically tries to use these modifier type names for every goods database entry. A custom goods key without the family logs 'Modifier type definition <name> must exist in DB'."

- id: custom_goods_reuses_vanilla_goods_color
  pattern: 'color\s*=\s*goods_(?!tv_)'
  detectability: advisory
  only_in_paths: ['goods']
  bad: "Defining a custom goods key with a vanilla goods color such as color = goods_masonry"
  correction: "Create a unique named color for the custom good in main_menu/common/named_colors, then reference it from the goods definition, e.g. color = goods_tv_wonder_materials."
  category: script
  scope: any
  source: "runtime error.log: utility.h:242"
  notes: "EU5 logs 'Goods <custom_good> has same color as <vanilla_good>' when two goods resolve to the same named color/value. Custom goods should have their own goods_<id> color key."

- id: custom_modifier_type_missing_modifier_icon
  pattern: ''
  detectability: advisory
  only_in_paths: ['modifier_type_definitions']
  bad: "Defining a custom modifier type without a matching common/modifier_icons entry"
  correction: "For every mod-defined modifier type, add a same-key entry in main_menu/common/modifier_icons with at least positive = \"gfx/interface/icons/modifier_types/<vanilla_or_custom_icon>.dds\". Reuse a close vanilla icon when no custom asset is needed."
  category: modifier
  scope: any
  source: "reference_game_files/game/main_menu/common/modifier_icons/00_modifier_icons.txt:7; runtime error.log: modifier_type.cpp:1248"
  notes: "EU5 loads modifier icon mappings separately from modifier_type_definitions. A valid custom modifier type can still log 'Missing Icon for Modifier : <name>' at startup until common/modifier_icons maps the key to a DDS."

- id: generic_action_missing_message_type
  pattern: ''
  only_in_paths: ['generic_actions']
  bad: "Defining a generic action without a PERFORM_<action_id>_ACTION message type"
  correction: "Add a PERFORM_<action_id>_ACTION block to scripts/gen_messagetypes.py TV_ENTRIES, rerun scripts/gen_messagetypes.py, and define SETUP/LOG/MAP localization keys for supported languages."
  category: script
  scope: country
  source: "scripts/gen_messagetypes.py:3; scripts/gen_messagetypes.py:39; runtime error.log: message_handler.cpp:421"
  notes: "EU5 expects a message type for generic action notifications. Missing entries log 'Failed to find message type: PERFORM_<action_id>_ACTION' at startup or action evaluation."

- id: event_loc_root_makescope_getvariable
  pattern: '\bROOT\.MakeScope\.GetVariable\('
  only_in_paths: ['localization']
  bad: "ROOT.MakeScope.GetVariable('var_name') inside event localization"
  correction: "Use ROOT.GetVariable('var_name') in event localization. Reserve Country.MakeScope.GetVariable(...) / Location.MakeScope.GetVariable(...) for GUI object contexts."
  category: localization
  scope: any
  source: "reference_game_files/game/main_menu/localization/english/events/DHE/flavor_mal_l_english.yml:46"
  notes: "In event localization, ROOT is already a script scope. Adding MakeScope produces runtime data errors such as 'Could not find promote for MakeScope' and 'Failed converting statement'."

- id: custom_description_effect_needs_effect_loc
  pattern: ''
  validator: check_effect_loc_coverage
  detectability: lint
  only_in_paths: ['scripted_effects', 'effect_localization']
  bad: "custom_description { text = MY_KEY } in common/scripted_effects where MY_KEY exists only in YAML or is absent from common/effect_localization"
  correction: "Register MY_KEY in src/in_game/common/effect_localization with the needed perspective mappings. The mapped localization keys still live in src/main_menu/localization."
  category: localization
  scope: any
  source: "runtime error.log: common/scripted_effects/tv_academy_philosophy_debate_effects.txt:370-583, 2026-07-09; reference_game_files/game/in_game/common/effect_localization/scripted_effects.txt:597"
  notes: "EU5 validates scripted-effect custom_description text keys against common/effect_localization at load. YAML-only keys produce 'No effect loc KEY' and PostValidate errors even when the display text exists."

- id: effect_localization_positive_negative_share_loc_key
  pattern: ''
  validator: check_effect_loc_positive_negative_pairs
  detectability: lint
  only_in_paths: ['effect_localization']
  bad: "An effect_localization block maps a *_neg perspective to the same localization key as its positive counterpart"
  correction: "Map global_neg/first_neg/third_neg/global_past_neg/first_past_neg/third_past_neg to distinct negative localization keys, even for static custom_description text."
  category: localization
  scope: any
  source: "runtime error.log: jomini_effect_localization.cpp:214, 2026-07-09; reference_game_files/game/in_game/common/effect_localization/scripted_effects.txt:597-610"
  notes: "The engine logs 'Negative and positive version share loc for effect loc KEY' when a negative perspective reuses the positive loc id. For static effect text, generate separate *_negative_text localization keys; the translated text may be simple negative wording, but the loc ids must be distinct."

- id: scripted_effect_io_variable_change_needs_effect_localization
  pattern: ''
  bad: "Changing an IO type variable inside a scripted_effect with a bare change_variable, expecting callers to show the variable gain or loss"
  correction: "Wrap the IO-scope change_variable in custom_description = { text = <effect_loc_key> value = $value$ ... } and register <effect_loc_key> in common/effect_localization with global/first/third/past/negative perspectives. Add matching main_menu localization strings for those perspective keys."
  category: script
  scope: international_organization
  source: "reference_game_files/game/in_game/common/scripted_effects/international_organization_effects.txt:1508-1528; reference_game_files/game/in_game/common/effect_localization/scripted_effects.txt:597-610"
  notes: "Scripted effect calls can otherwise produce empty option/action tooltips even though the IO variable changes. Vanilla uses custom_description plus effect_localization for imperial, celestial, and papal authority so the tooltip shows the signed value while executing the real effect."

- id: effect_localization_third_country_context_missing
  pattern: ''
  bad: "Using [COUNTRY.GetName] in third/third_past effect localization strings for a custom_description shown from a generic action tooltip"
  correction: "Keep effect localization perspective strings self-contained, e.g. 'Gains $VALUE|+$ #Y $var$#!'; do not assume COUNTRY exists during action hover pre-evaluation."
  category: localization
  scope: any
  source: "runtime error.log: TV_THIRD_ADD_WONDER_DOMESTIC_SUPPORT hover on tv_wonder_accept_*_demand"
  notes: "Generic action hover pre-evaluation may select the third-person effect localization perspective without a COUNTRY promote target. [COUNTRY.GetName] then returns nullptr and logs data errors repeatedly while hovering."

- id: create_art_dynamic_event_missing_type_key
  pattern: ''
  only_in_paths: ['events', 'scripted_effects']
  bad: "Event-created artwork uses create_art with only artist/quality and no explicit type/key, expecting a reliable tooltip and artwork name"
  correction: "For event-created named artworks, provide an explicit work_of_art_type and key with matching main_menu localization. If the type depends on the artist, branch with visible if/else_if create_art blocks so the real effect tooltip renders."
  category: script
  scope: location
  source: "reference_game_files/game/in_game/events/culture/cultural_event.txt:406-411; src/in_game/events/tv_arts_exhibition_events.txt:1302-1428"
  notes: "tv_arts_exhibition.406 created a work in the capital but the option tooltip was empty and the resulting artwork had no name. Vanilla named artworks pair create_art with both type = work_of_art_type:<type> and key = <loc_key>. Visible if/else_if branches can render the real create_art tooltip while still selecting the appropriate art type by artist_type."

- id: tv_io_monthly_effect_block_forbidden
  pattern: ''
  validator: check_tv_io_monthly_effect_blocks
  detectability: lint
  only_in_paths: ['international_organizations']
  bad: "Defining a monthly_effect block on a TV international_organization type"
  correction: "Do not use IO monthly_effect blocks. Keep visible typed-variable monthly arithmetic in the variable's monthly_change, and move maintenance/completion side effects to registered country monthly pulses or explicit lifecycle hooks."
  category: script
  scope: international_organization
  source: "user project rule, 2026-06-24"
  notes: "TV IO monthly_effect blocks have severe performance costs even when the body is hidden. IO variable monthly_change remains the correct place for visible variable breakdowns; side-effect maintenance should be routed through country pulses that first do cheap membership/leader checks."

- id: io_parliament_tab_visible_not_overrideable
  pattern: 'blockoverride\s+"organization_parliament_tab_visible"'
  bad: "Trying to hide an IO parliament tab with blockoverride \"organization_parliament_tab_visible\""
  correction: "Set has_parliament = no on the international_organization type. Keep law requires_vote behavior as a separate design decision."
  category: gui
  scope: international_organization
  source: "reference_game_files/game/in_game/gui/panels/organization/common.gui:383-384; reference_game_files/game/in_game/common/international_organizations/readme.txt:126"
  notes: "The vanilla organization panel comments out the would-be parliament visible block and binds the tab directly to InternationalOrganizationsView.GetInternationalOrganization.HasParliament. There is no block to override."

- id: io_law_vote_without_special_status_power
  pattern: ''
  bad: "IO law votes routed through parliament without an implemented special status that has special_status_power"
  correction: "For uses_parliament_for_law_votes IOs, add a special status in common/international_organization_special_statuses, list it in special_statuses_implemented, give it special_status_power, define <status>_can_participate_in_parliament with category = internationalorganization, and enable that modifier in the parliament type."
  category: script
  scope: international_organization
  source: "reference_game_files/game/in_game/common/resolutions/policy_vote.txt:620; reference_game_files/game/in_game/common/international_organization_special_statuses/readme.txt:12; reference_game_files/game/main_menu/common/modifier_type_definitions/00_modifier_types.txt:14570"
  notes: "The policy_vote resolution requires country_combined_special_status_power(scope:recipient) > 0 when uses_parliament_for_law_votes_trigger is active. Without a participating special status, the law debate can open but the IO parliament page has no voter group to show."

- id: io_special_status_auto_bestow_without_lifecycle_sync
  pattern: ''
  detectability: advisory
  bad: "A custom IO parliament special status relies only on auto_bestowal_trigger or same-tick on_joined state to appear"
  correction: "For custom IO statuses that drive parliament voting or UI power, grant/remove the status directly in the action or lifecycle effect that creates, invites, promotes, demotes, or removes the country. Do not add recurring monthly refreshes for special-status repair."
  category: script
  scope: international_organization
  source: "reference_game_files/game/in_game/common/country_interactions/hre.txt:502-560; reference_game_files/game/in_game/common/international_organization_special_statuses/hre.txt:187-274; reference_game_files/game/in_game/common/resolutions/policy_vote.txt:620; runtime playtest of tv_diplomatic_alliance 2026-06-25"
  notes: "HRE free city actions explicitly call international_organization_add_special_status from the HRE scope; free_city has an empty auto_bestowal_trigger and does not need a monthly repair pass. Diplomatic Alliance members could wait through monthly pulses without showing tv_alliance_* special statuses, but starting a law vote refreshed visible status/power state. The minimal TV pattern is to grant the leader's advocator status at creation and grant each joining country member status in on_joined, without recurring special-status maintenance or extra parliament-seat repair."

- id: io_law_vote_without_parliament_location
  pattern: ''
  bad: "IO law votes routed through parliament for an organization that has neither a parliament_seat nor an owned location"
  correction: "For uses_parliament_for_law_votes IOs with no IO-owned locations, set the IO variable parliament_seat to a valid location such as the leader country's capital before any law vote can be proposed."
  category: script
  scope: international_organization
  source: "reference_game_files/game/in_game/common/scripted_effects/international_organization_effects.txt:226-294; runtime error.log tv_diplomatic_alliance 2026-06-24"
  notes: "Vanilla call_parliament_for_law_change unconditionally calls set_parliament_location = scope:parliament_location. For non-HRE IOs it first uses parliament_seat, then a proposer-owned location that is owned by the IO, then a random IO-owned location. Diplomatic Alliance has no IO-owned locations, so law votes reached set_parliament_location with a null target until parliament_seat was set from the leader capital."

- id: io_scoped_effect_called_inside_create_io_block
  pattern: ''
  bad: "Calling an IO-scoped helper with IO-only triggers directly inside create_international_organization's effect block"
  correction: "Put IO-scoped initialization in the IO type's on_creation/on_joined hooks, or call it only after switching to a saved IO scope that is verified to exist. Keep create_international_organization blocks free of helpers that assume root is the new IO during pre-evaluation."
  category: scope
  scope: international_organization
  source: "runtime error.log tv_diplomatic_alliance 2026-06-24; reference_game_files/game/in_game/common/international_organizations/readme.txt:75"
  notes: "Generic-action tooltip/effect pre-evaluation can walk a create_international_organization block before the new IO is a stable root. An IO helper that starts with international_organization_type then logs 'Expected international_organization, but got country'. Diplomatic Alliance fixed this by relying on IO on_creation/on_joined and removing the direct helper call from the creation block."

- id: io_special_status_missing_parliament_modifier_types
  pattern: ''
  bad: "Defining a custom IO special status without the matching auto-requested parliament modifier type pair"
  correction: "For every custom IO special status key that can be implemented on an international organization, define <status>_can_participate_in_parliament as boolean and <status>_agenda_impact as percent in main_menu/common/modifier_type_definitions with game_data category = internationalorganization."
  category: modifier
  scope: international_organization
  source: "reference_game_files/game/main_menu/common/modifier_type_definitions/00_modifier_types.txt:14570-14582; runtime error.log tv_trade_league_member_status 2026-05-27"
  notes: "EU5 automatically tries to resolve these modifier type names for custom IO special statuses; missing definitions produce startup DB assertions such as 'Modifier type definition <status>_can_participate_in_parliament must exist in DB'."

- id: io_policy_execution_scope_recipient_unset
  pattern: ''
  bad: "Using scope:recipient inside IO policy allow/on_activate/on_deactivate to read or mutate the IO"
  correction: "Use the current IO root directly in policy allow/on_activate/on_deactivate. Reserve scope:recipient for documented country-root policy AI math blocks such as wants_this_policy_bias and wants_propose_policy."
  category: scope
  scope: international_organization
  source: "reference_game_files/game/in_game/common/laws/readme.txt:31-40; runtime error.log tv_alliance_laws.txt 2026-05-21"
  notes: "Generated Diplomatic Alliance laws wrapped IO variable checks and tier changes in scope:recipient in execution blocks. At runtime those blocks had no recipient event target, causing repeated 'Undefined event target recipient' and unset-scope errors."

- id: io_policy_activation_direct_leader_country
  pattern: ''
  detectability: needs_parser
  bad: "Using direct `leader_country = { ... }` inside IO policy on_activate/on_deactivate effect chains"
  correction: "Keep IO variable writes on the current IO root, but enter the leader country with `leader_country ?= { ... }` for mirrored country state or side effects."
  category: scope
  scope: international_organization
  source: "reference_game_files/game/in_game/common/parliament_agendas/10_hre_agendas.txt:104; runtime error.log tv_alliance_laws.txt 2026-06-25"
  notes: "The law browser and policy tooltips can walk activation/deactivation effect chains before a leader country is available. Direct leader_country scope entry logs `Event target link 'leader_country' returned an invalid object`; the optional link safely no-ops when null."

- id: io_policy_ai_math_scope_recipient_requires_exists
  pattern: ''
  detectability: needs_parser
  bad: "Using scope:recipient inside IO policy AI math without first checking exists = scope:recipient"
  correction: "In wants_this_policy_bias, wants_propose_policy, wants_keep_policy, reasons_to_join, and diplomatic_capacity_cost, guard direct scope:recipient reads with exists = scope:recipient or use optional scope:recipient ?= blocks."
  category: scope
  scope: international_organization
  source: "reference_official_defines/types/laws.txt:39-43; reference_game_files/game/in_game/common/resolutions/policy_vote.txt:408; runtime error.log tv_alliance_laws.txt 2026-05-21"
  notes: "Although the law readme documents recipient = IO for policy AI math, the engine can pre-evaluate these maths without a recipient event target. Unguarded scope:recipient reads caused repeated 'Undefined event target recipient' and unset-scope errors in generated Diplomatic Alliance laws."

- id: io_policy_member_modifier_utility_unfiltered
  pattern: ''
  detectability: advisory
  only_in_paths: ['laws']
  bad: "An IO policy member modifier is meant to affect only the leader or another subset, but the modifier block has no potential_trigger filter."
  correction: "Use an appropriate member filter. For visible leader-only effects that must stack with other law modifiers, keep country_modifier but guard the filter for law browsing: potential_trigger = { OR = { NOT = { exists = scope:recipient } is_leader_of_international_organization = scope:recipient } }. Use leader_modifier/non_leader_modifier only when replacement semantics are intended. Vanilla policy_vote automatically adds scope:vote.modifier_utility(scope:actor) as POLICY_MODIFIER_UTILITY, so every voting member evaluates unfiltered member modifiers as personal policy utility."
  category: script
  scope: international_organization
  source: "reference_game_files/game/in_game/common/resolutions/policy_vote.txt:842-843; reference_game_files/game/in_game/common/laws/20_hre.txt:187; fixed in scripts/in_game/common/laws/gen_tv_govhouse_laws.py"
  notes: "Governor's House subject-chain members voted on overlord administration country modifiers. Some subject tooltips showed extreme 'Policy Modifier Utility' support for particular laws. A recipient-guarded potential_trigger keeps the additive country modifiers and their automatic utility on the supreme overlord while still displaying during ordinary law browsing."

- id: io_policy_leader_country_modifier_unguarded_recipient_tooltip
  pattern: ''
  detectability: advisory
  only_in_paths: ['laws']
  bad: "Representing a visible additive leader-only IO law effect as country_modifier = { potential_trigger = { is_leader_of_international_organization = scope:recipient } ... } without a no-recipient display branch"
  correction: "Use country_modifier = { potential_trigger = { OR = { NOT = { exists = scope:recipient } is_leader_of_international_organization = scope:recipient } } ... } when the leader-only policy effect must remain an additive country modifier. The no-recipient branch is for ordinary law browsing; the leader check still applies when a vote/application recipient exists."
  category: script
  scope: international_organization
  source: "reference_game_files/game/in_game/common/laws/readme.txt:36; reference_game_files/game/in_game/common/laws/readme.txt:48; fixed in scripts/in_game/common/laws/gen_tv_govhouse_laws.py"
  notes: "The normal law browser may evaluate modifier display without a populated scope:recipient, causing an unguarded filtered country_modifier package to collapse to 'No Effects'. leader_modifier has leader-country target semantics, but the law readme says it replaces previous leader_modifier blocks, so additive multi-law packages should stay country_modifier with a display-safe filter."

- id: generic_action_ai_list_io_leader_country_this
  pattern: 'any_international_organizations_member_of\s*=\s*\{[^{}]*\bleader_country\s*=\s*this\b'
  detectability: lint
  only_in_paths: ['generic_action_ai_lists']
  bad: "Comparing leader_country to this inside any_international_organizations_member_of in a generic_action_ai_list"
  correction: "The AI-list potential root is the evaluating country, while this becomes the IO inside the iterator. Compare with root instead: exists = leader_country; leader_country = root."
  category: scope
  scope: country
  source: "reference_game_files/game/in_game/common/generic_action_ai_lists/readme.txt:10; reference_game_files/game/in_game/common/generic_action_ai_lists/high_kingship_of_ireland_list.txt:13-15"
  notes: "Inside the IO membership iterator, this is the international organization. leader_country = this compares a country to an international_organization and logs a type-mismatch error."

- id: io_parliament_issue_without_special_status_agenda
  pattern: ''
  bad: "Adding IO parliament issues for a special status without any valid parliament_agenda for that special status"
  correction: "Add at least one common/parliament_agendas entry with type = international_organization and special_status = <status>. Keep its potential/allow valid for the IO so the parliament button has a special-status agenda to resolve."
  category: script
  scope: international_organization
  source: "reference_game_files/game/in_game/common/parliament_agendas/readme.txt:1-11; reference_game_files/game/in_game/common/parliament_agendas/10_hre_agendas.txt:1-23"
  notes: "IO parliaments rely on special-status agendas as well as issues. Without a valid agenda for the participating special status, the UI can report that no special status wants to propose an issue even when parliament_issues exist."

- id: io_idle_parliament_issue_nonpositive_wants_bias
  pattern: ''
  detectability: advisory
  bad: "All idle IO parliament issues for a custom special status have non-positive wants_this_parliament_issue_bias in ordinary founding conditions"
  correction: "Give at least one normal idle parliament_issue for the participating special status a positive base wants_this_parliament_issue_bias after normal modifiers, while keeping potential/allow/selectable_for valid."
  category: script
  scope: international_organization
  source: "reference_game_files/game/in_game/common/generic_actions/io_parliament.txt:86-120; reference_game_files/game/in_game/common/parliament_issues/readme.txt:13; runtime playtest of tv_diplomatic_alliance 2026-06-24"
  notes: "The vanilla call_organization_parliament issue chooser reports that no special status has issues to bring when it cannot surface any issue. Diplomatic Alliance issues with base -25 and only opinion-based bonuses could leave a new or neutral alliance with no positively desired idle issue, even though the issue definitions otherwise passed potential/allow/selectable_for."

- id: io_single_member_parliament_without_leader_special_status
  pattern: ''
  bad: "A single-member IO relies on a generic member special status to propose IO parliament issues"
  correction: "Do not rely on vanilla call_organization_parliament for single-member support-token meetings. The mechanic needs a different design before custom support meetings are enabled."
  category: script
  scope: international_organization
  source: "reference_game_files/game/in_game/common/generic_actions/io_parliament.txt:86-120; reference_game_files/game/in_game/common/scripted_effects/international_organization_effects.txt:507-538; runtime playtest of tv_academy_of_sciences"
  notes: "The vanilla call_organization_parliament picker builds its issue list through every_possible_parliament_issue and reports 'no special status wants to propose an issue' when it cannot surface one. propose_parliament_issue then initializes support from the issue special status and marks the proposer as voting yes. In a founder-only IO, self-backed support issues are brittle even with a leader status."

- id: country_trigger_root_inside_situation_every_country
  pattern: 'most_powerful_merchant\s*=\s*root'
  only_in_paths: ['victory_paths.yaml', 'towards_victory_triggers.txt']
  bad: "Reusable country milestone trigger uses root inside a nested market iterator"
  correction: "Use prev inside nested iterators so the target remains the currently checked country when the trigger is called from situation->every_country."
  category: scope
  scope: country
  source: "reference_game_files/game/in_game/events/diplomacy/overextension.txt:167-168; reference_game_files/game/in_game/events/economy/trade.txt:129"
  notes: "GUI ShowTriggerConditions(PlayerScope.Self) can pass because root is the player country, while the monthly situation checker calls the same trigger from a situation root. In any_market_with_merchants, prev points back to the iterated country."

- id: gui_hbox_unbounded_multiline_text_width
  pattern: ''
  only_in_paths: ['gui']
  bad: "Putting text_single with multiline text inside an hbox elastic column whose width is unconstrained (for example size = { -1 H })"
  correction: "Give the text area an explicit width or maximum width. For paragraph-like content, wrap it in a fixed-width widget/card and use text_multi with max_width and autoresize, as vanilla IO GUI does."
  category: gui
  scope: any
  source: "reference_game_files/game/in_game/gui/panels/organization/common_header.gui:188-199; src/in_game/gui/panels/organization/tv_engineering_department.gui:230-293"
  notes: "In Jomini GUI, multiline text can contribute its natural text width back into hbox layout. A right-side size = { -1 H } text column in the Engineering Department proposal row expanded to 446px and pushed its parent vbox from 470px to 548.3px even though the outer card bounds were correct."

- id: production_method_invalid_goods_aliases
  pattern: '\b(candles|luxury_cloth)\s*='
  only_in_paths: ['production_methods']
  bad: "Using display/alias-like goods names such as candles or luxury_cloth in production method upkeep"
  correction: "Use real goods database IDs: beeswax for candle upkeep, fine_cloth for luxury cloth upkeep."
  category: script
  scope: any
  source: "reference_game_files/game/in_game/common/goods/03_food.txt:319; reference_game_files/game/in_game/common/goods/02_produced_goods.txt:130"
  notes: "Production method input keys must be exact goods IDs. Invalid goods tokens inside common/production_methods can load as 'Unexpected token' errors, as seen with candles and luxury_cloth."

- id: production_method_base_profit_too_high
  pattern: ''
  detectability: needs_parser
  only_in_paths: ['production_methods']
  bad: "Production method base input/output values produce profit above 30%"
  correction: "Compute recipe value from goods default_market_price and keep base profit below 30%, usually by slightly increasing inputs or reducing output/default output price."
  category: script
  scope: any
  source: "runtime error.log: production_methods.cpp:429"
  notes: "EU5 logs a startup error when a production_method's base profit exceeds 30%, e.g. tv_wonder_material_dispatch_point_production at 33.33%. A recipe worth 5 output needs input value greater than 3.8462 to be just under 30% profit."

- id: building_level_not_current_employment
  pattern: 'location_building_level\(building_type:tv_wonder_labor_camp\)'
  only_in_paths: ['scripted_effects']
  bad: "Using building levels multiplied by nominal employment size to determine how many workers a building actually employs"
  correction: "Scope into the building object with ordered_buildings_in_location/random_buildings_in_location and read building_employed_amount. If downstream variables are stored as people rather than pop-size units, multiply the value by 1000."
  category: script
  scope: building
  source: "reference_game_files/game/in_game/common/trigger_localization/building_triggers.txt:137; reference_game_files/game/in_game/common/scripted_effects/location_effects.txt:338; fixed in src/in_game/common/scripted_effects/tv_engineering_department_effects.txt"
  notes: "location_building_level reports completed levels/capacity, not current staffing. For labor-sensitive mechanics such as Engineering Department construction, underfilled labor camps must contribute only their actual employed laborers."

- id: custom_build_action_without_explicit_cap
  pattern: ''
  only_in_paths: ['generic_actions', 'scripted_effects']
  bad: "Custom generic-action building buttons rely only on can_build_building and do not repeat the building max-level / in-construction cap check"
  correction: "Add an explicit trigger shared by the action allow, select_trigger visible/enabled, and final effect guard. For per-country building caps, use total_building_levels_including_construction:<building> so queued levels count. For one-per-location selectors, also filter existing buildings and any_buildings_in_location with building_levels_under_construction >= 1."
  category: script
  scope: building
  source: "reference_game_files/game/in_game/common/building_types/capital_buildings.txt:615-617; reference_game_files/game/in_game/common/missions/generic_traditional_economy_mission_pack.txt:173-176; fixed in src/in_game/common/scripted_triggers/tv_engineering_department_triggers.txt"
  notes: "Building max_levels can stop normal construction but a custom IO/generic-action button can still spend its scripted price unless its action and effect repeat the cap logic. Re-check inside the effect because generic action UI pre-evaluation and stale target lists can otherwise charge the player for a no-op."

- id: has_building_is_not_completion_gate
  pattern: ''
  detectability: advisory
  only_in_paths: ['scripted_triggers', 'generic_actions', 'scripted_effects']
  bad: "Using has_building = building_type:X as the gate for a mechanic that should unlock only after X is completed"
  correction: "Use has_building_with_at_least_one_level = X for completed-building gates. Keep separate under-construction checks such as building_levels_under_construction >= 1 when the mechanic needs to block duplicate queues."
  category: script
  scope: building
  source: "User-reported IO establishment bug, 2026-06-24; fixed in scripts/gen_victory.py. Syntax verified in reference_game_files/game/in_game/events/economy/building_events.txt:7 and reference_game_files/game/main_menu/localization/english/triggers_l_english.yml:2033."
  notes: "The IO establishment headquarters cache used has_building on the capital, so starting construction made the step-3 appoint-chief action available before the headquarters finished. The completed gate must require an actual built level."

- id: scripted_trigger_typed_parameter_double_prefix
  pattern: 'location_and_owner_can_build\s*=\s*\{[^}]*\bbuilding_type\s*=\s*building_type:'
  detectability: lint
  only_in_paths: ['scripted_triggers', 'scripted_effects', 'gen_victory.py', 'generic_actions']
  bad: "Passing a typed building_type:<id> value into location_and_owner_can_build"
  correction: "Pass the bare building id, e.g. location_and_owner_can_build = { building_type = tv_conquest_headquarters }. The scripted trigger adds building_type: internally."
  category: script
  scope: building
  source: "reference_game_files/game/in_game/common/scripted_triggers/location_triggers.txt:132-138"
  notes: "location_and_owner_can_build expands its parameter as building_type:$building_type$ for value, can_build_building, and owner can_build_building checks. Supplying building_type:<id> as the parameter produces building_type:building_type:<id> and logs 'More than one colon in event target link'."

- id: while_waiting_for_instant_building_level
  pattern: ''
  only_in_paths: ['scripted_effects']
  bad: "A while loop checks location_building_level and then tries to drive construct_building instant = yes or change_building_level_in_location until the level catches up"
  correction: "Do not wait for location_building_level to change inside the same effect. Use fixed if / else_if branches or a bounded script-value delta so the effect runs once and never depends on a 0-day build task updating synchronously."
  category: script
  scope: building
  detectability: needs_parser
  source: "fixed in src/in_game/common/scripted_effects/tv_engineering_department_effects.txt; runtime behavior: construct_building instant = yes queues a 0-day task rather than synchronously updating the level"
  notes: "Wonder selection/finalization previously used while loops that assumed instant construction updated the location building level during the same effect. That can deadlock or spin forever because the engine only creates a queued task. Treat instant construction as asynchronous for script control flow."

- id: building_upgrade_completion_relying_on_on_built
  pattern: ''
  only_in_paths: ['building_types', 'scripted_effects']
  bad: "Using building on_built as the only completion signal for a mechanic that also upgrades existing building levels"
  correction: "Use on_construction_ended to directly mark the active auxiliary-building ritual finished and run the normal ritual completion effect. Do not depend on on_built for upgrades, and do not require location_building_level to have updated inside the construction-ended hook."
  category: script
  scope: building
  detectability: advisory
  source: "reference_official_defines/types/building_types.txt:36 lists on_built; reference_game_files/game/in_game/common/building_types/trade_company_buildings.txt:66-78 uses on_construction_started/on_construction_ended; fixed in scripts/in_game/common/building_types/gen_tv_engineering_department_wonder_mechanics_buildings.py"
  notes: "Engineering Department style-2 ritual annex completion relied on on_built. Fresh annex construction completed, but expansion reused the same annex building as a higher level, so the ritual needed construction-ended direct completion."

- id: country_trigger_reused_inside_io_monthly_change
  pattern: ''
  only_in_paths: ['international_organizations']
  bad: "Calling a country-scoped scripted_trigger from an IO variable monthly_change when that trigger depends on root, prev, caller-specific saved scopes, or country variables"
  correction: "Write the monthly_change condition in IO scope, or create a separate IO-scoped trigger. Use leader_country ?= { ... } for country state, compare IO variables directly against leader_country.var:X from the IO scope, and inline ownership/state checks whose prev/root chain must point at the leader country."
  category: scope
  scope: international_organization
  source: "fixed in src/in_game/common/international_organizations/tv_engineering_department.txt; runtime reports: Engineering Department construction progressed while materials stockpile never decreased; Engineering Department survey active state passed in country pulse but survey progress did not advance from IO monthly_change"
  notes: "monthly_change evaluates from the international organization/variable context. A nested leader_country block does not make root inside a called scripted_trigger become the country, and caller-sensitive prev/root chains can differ from the same trigger's country-pulse behavior. In Engineering Department survey progress, reusing tv_wonder_survey_active_trigger inside the IO variable monthly_change silently prevented the visible IO progress variable from gaining monthly progress; inlining the active-survey conditions under leader_country preserved monthly_change as the tooltip-visible source."

- id: random_list_branch_modifier_filter
  pattern: '(?m)^\s*\d+\s*=\s*\{\s*\n\s*modifier\s*=\s*\{\s*factor\s*=\s*0'
  bad: "Filtering random_list branches with modifier = { factor = 0 ... }"
  correction: "Use trigger = { ... } inside each weighted random_list branch. Vanilla random_list branch eligibility uses trigger blocks; use NOT = { var:current ?= N } there when a reroll must exclude the current result."
  category: script
  scope: any
  source: "reference_game_files/game/in_game/common/scripted_effects/location_effects.txt:238-240; reference_game_files/game/in_game/common/missions/generic_progress_and_literacy_mission_pack.txt:160-166"
  notes: "Engineering Department estate-demand rerolls used modifier factor zero in random_list branches. A player could bribe a demand into the artwork-loss branch and repeated same-day rerolls kept resolving to that same visible demand. Replacing branch modifiers with trigger filters and excluding the current demand makes the random pool behave like vanilla and prevents visible no-op rerolls."

- id: music_player_tracks_as_scripted_playback_rules
  pattern: ''
  only_in_paths: ['music_player_tracks']
  bad: "Using common/music_player_tracks as if it can load raw audio files or define country/event/war trigger conditions for automatic music playback"
  correction: "Register only Wwise event keys there, with optional composer/performer/soloist metadata and matching music_player localization. Use verified GUI/audio hooks such as Audio_PlayEvent(..., 'music_manager') or hardcoded on_actions for conditional music behavior; do not invent trigger fields inside music_player_tracks."
  category: script
  scope: any
  source: "reference_official_defines/types/music_player_tracks.txt:1-14; reference_game_files/game/in_game/common/music_player_tracks/00_music_player_tracks.txt:1-19; reference_game_files/game/in_game/gui/music_player_lateralview.gui:133-185; reference_game_files/game/in_game/gui/shared/animation.gui:199-203; reference_game_files/game/in_game/common/on_action/_hardcoded.txt:1789-1792"
  notes: "The official type note says new songs are added in Wwise and registered by event key. Vanilla entries contain no trigger/chance/category fields beyond metadata, and the in-game music player plays registered track objects via GUI bindings. EU5 does expose Audio_PlayEvent to send a Wwise event to music_manager from GUI, and on_war_declared exists as a script hook, but current references do not expose EU4-style songs.txt conditional rules or a normal effect that directly plays a named music-player track."

- id: religion_conversion_need_scope_mismatch
  pattern: ''
  detectability: advisory
  bad: "Applying vanilla promote_religion's full target condition to a regional priority heuristic without checking the mechanic's design intent"
  correction: "Use the full vanilla OR when mirroring cabinet-action province eligibility. For Governor's House autonomous conversion priority, use only the share of owned locations whose dominant_religion differs from the governing country's religion."
  category: script
  scope: location
  source: "reference_game_files/game/in_game/common/cabinet_actions/promote_religion.txt:73-76"
  notes: "Vanilla promote_religion can still work on minority non-state-religion pops when local_religious_unity is below 100%. The Governor's House design intentionally ignores that cleanup case so regional governors only prioritize locations where the non-state religion is still dominant."

- id: gui_io_membertype_name_filter_empty
  pattern: 'EqualTo_string\(MemberTypeItem\.GetName,\s*ShowSpecialStatusName'
  detectability: advisory
  only_in_paths: ['gui']
  bad: "Filtering InternationalOrganizationsView.GetMemberItems by comparing MemberTypeItem.GetName to a special-status display helper"
  correction: "Use real MemberTypeItem predicates such as MemberTypeItem.IsAllMembers for the outer group, then apply country-row filters inside MemberTypeItem.GetCountries."
  category: gui
  scope: international_organization
  source: "runtime UI observation in src/in_game/gui/panels/organization/tv_diplomatic_alliance.gui, 2026-06-25"
  notes: "The display-name comparison against ShowSpecialStatusName('tv_alliance_member_status') hid every Diplomatic Alliance member row. MemberTypeItem.GetName is not a reliable selector for custom special-status groups in this panel."

- id: gui_io_member_row_leader_check_wrong_shape
  pattern: 'IsIOLeaderCountry\(Country\.Self\)|ObjectsEqual\(Country\.Self,\s*InternationalOrganizationsView\.GetInternationalOrganization\.GetLeaderCountry\)'
  detectability: advisory
  only_in_paths: ['gui']
  bad: "Checking an IO member-row country with IsIOLeaderCountry(Country.Self), or comparing Country.Self directly to GetLeaderCountry without .Self"
  correction: "Compare matching GUI objects, e.g. Not(ObjectsEqual(Country.Self, InternationalOrganizationsView.GetInternationalOrganization.GetLeaderCountry.Self))."
  category: gui
  scope: international_organization
  source: "runtime error.log from tv_diplomatic_alliance.gui, 2026-06-25; verified vanilla shape in reference_game_files/game/in_game/gui/panels/organization/union.gui:401"
  notes: "IsIOLeaderCountry(Country.Self) produced FetchData failed in the IO member row context. The original ObjectsEqual without .Self did not hide the leader because it compared different object shapes."

- id: gui_action_button_ui_action_enabled_out_of_context
  pattern: 'enabled\s*=\s*"\[UIAction\.IsEnabled\]"'
  detectability: advisory
  only_in_paths: ['gui']
  bad: "Using enabled = \"[UIAction.IsEnabled]\" directly inside a custom-panel button without a verified UIAction datacontext"
  correction: "Use an explicit GUI predicate, or keep the conventional action_button/action_button_diamond template only when the widget defines a real left_action and has been verified after a full panel/game reload."
  category: gui
  scope: generic_actions
  source: "runtime error.log from tv_diplomatic_alliance.gui action_button, 2026-06-25"
  notes: "A direct enabled = [UIAction.IsEnabled] produced 'No function for call' / empty FetchData errors in this custom panel. Later apparent errors from normal action-button templates were traced to stale GUI hot reload state, not the template itself."

- id: gui_country_action_parameter_uses_self
  pattern: ''
  detectability: advisory
  only_in_paths: ['gui']
  bad: "Passing an IO member-row country action parameter as [Country.Self]"
  correction: "Pass country targets that generic actions read as scope:target through [Country.MakeScope], and place the parameter on the action button so both tooltip/allow evaluation and the click action receive the same scope. Reserve Country.Self for GUI object comparisons such as ObjectsEqual."
  category: gui
  scope: generic_actions
  source: "reference_game_files/game/in_game/gui/context_menu.gui:317-322; fixed in src/in_game/gui/panels/organization/tv_diplomatic_alliance.gui, 2026-06-25"
  notes: "The Diplomatic Alliance row button passed [Country.Self] inside left_action, leaving scope:target absent for the generic action. The guarded effect then no-oped silently: no cohesion was spent and no subject was created."

- id: character_modifier_country_cabinet_efficiency
  pattern: ''
  detectability: advisory
  bad: "Putting country_cabinet_efficiency inside a character-scoped modifier to lower one cabinet member's efficiency"
  correction: "Use character_cabinet_efficiency for character modifiers. Reserve country_cabinet_efficiency for country modifiers."
  category: modifier
  scope: character
  source: "reference_game_files/game/main_menu/common/modifier_type_definitions/00_modifier_types.txt:5924-5943"
  notes: "country_cabinet_efficiency is a country modifier type and has no effect on a character modifier; the character-scoped equivalent is character_cabinet_efficiency."

- id: gui_texture_concatenate_raw_path
  pattern: ''
  detectability: advisory
  bad: "Using texture = \"[Concatenate('gfx/...', key, '.dds')]\" to dynamically select a raw DDS path"
  correction: "Route dynamic images through a GUI function that returns a texture handle, such as GetConceptTexture(...). For arbitrary mod DDS assets, register image-only game concepts like tv_wonder_display_image_<id>, add matching game_concept_* and game_concept_*_desc localization, and build that concept id from a numeric slot id."
  category: gui
  scope: texture
  source: "runtime-tested in src/in_game/gui/location_window.gui dynamic wonder display test; reference_official_defines/docs/data_types_uncategorized.txt lists GetConceptTexture"
  notes: "In the location-window test, GetConceptTexture(Concatenate(...)) rendered, but nested, suffix-only, and flat Concatenate expressions that returned raw DDS path strings did not render and produced no useful error log. Static texture paths are parsed by the GUI loader, while runtime texture expressions need a texture-like return value rather than a CString path."

- id: gui_show_modifier_effect_dynamic_key_static_reference
  pattern: ''
  detectability: advisory
  only_in_paths: ['gui']
  bad: "Calling ShowModifierEffect with wonder display modifier ids built by GUI Concatenate(...) without generated static modifier definitions and unreachable script references"
  correction: "Generate matching static display modifiers plus an unreachable always = no script block that references every possible display id through add_country_modifier/add_location_modifier. Use those mirrors for GUI ShowModifierEffect display only; do not route completed wonder grants or scripted-effect tooltip previews through them."
  category: gui
  scope: modifier
  source: "Engineering Department wonder auto-modifier refactor, 2026-06; follow-up runtime error.log for add_country_modifier invalid database objects, 2026-06"
  notes: "Building modifier blocks and GUI static mirrors carry display-only country/local effects, while country auto modifiers provide the actual national effects from owned final buildings. Scripted effect previews are a separate parser path: add_country_modifier validates against static/country modifiers, not common/auto_modifiers; the current wonder flow avoids modifier-list previews for auto-driven country effects."

- id: gui_show_trigger_conditions_dynamic_key_needs_numeric_id_alias
  pattern: ''
  detectability: advisory
  only_in_paths: ['gui']
  bad: "Calling ShowTriggerConditionsForScope with a trigger name built by GUI Concatenate(...) from a numeric display id, but only defining the underlying scripted_trigger under its string wonder key; or aliasing straight to a real gameplay trigger that carries extra guard conditions the display context already guarantees"
  correction: "Generate a thin alias scripted_trigger named with the numeric display id (e.g. tv_wonder_display_<id>_base_site_rules_trigger) so the Concatenate-built name resolves. Unlike ShowModifierEffect, scripted_trigger/scripted_effect names are not a separate database lookup, so no unreachable always = no reference block is needed for these aliases. Do not simply delegate the alias to the real gameplay trigger (tv_wonder_location_meets_<key>_base_site_rules_trigger = yes) if that trigger carries a guard condition (such as unique wonders' this = location:<site>) that is always true in the display's own context — a location tooltip already IS that location, so showing that condition as a row is redundant noise. Instead, re-embed just the site-rule condition list (the same trigger_conditions(...)/site_trigger_lines_for_wonder(...) call the real trigger uses) directly in the display alias, omitting the always-true guard."
  category: gui
  scope: trigger
  source: "reference_official_defines/docs/data_types_uncategorized.txt (ShowTriggerConditions/ShowTriggerConditionsForScope both Arg0 CString, Arg1 Scope -> CString, same shape as ShowScriptedEffectForScope/ShowModifierEffect); location_window.gui wonder construction-conditions block, 2026-07"
  notes: "tv_wonder_location_meets_<key>_base_site_rules_trigger is already the location-scoped (unwrapped) form of the Engineering Department's any_owned_location-wrapped site rule check, so a GUI block that already runs in LocationView.GetLocation.MakeScope.Self can reuse its condition list directly via ShowTriggerConditionsForScope(Concatenate('tv_wonder_display_', Concatenate(idString, '_base_site_rules_trigger')), LOCATION_SCOPE) without any_owned_location. For unique wonders specifically, keep the this = location:<site> guard only on the real gameplay trigger (still needed so the wonder can only be queued/built at its designated site); the display alias should call trigger_conditions(wonder, mechanics, 1) directly rather than delegating, so the redundant 'is <site>' row does not render."

- id: gui_tooltip_text_block_ignores_row_size_override
  pattern: ''
  detectability: advisory
  only_in_paths: ['gui']
  bad: "Using TooltipTextBlock for a fallback/empty-state line next to a sibling TooltipRequirementsList or text_single that has blockoverride row_size / field_text_format sizing, expecting both to render at the same height"
  correction: "TooltipTextBlock (vanilla type in main_menu_cooltip_types.gui) wraps its text in a fixed vbox { margin = { @tooltip_inner_margin @tooltip_inner_margin } } (10px each side) around a text_multi_template textbox, and exposes no blockoverride for font size or row height. blockoverride row_size / field_text_format on a sibling TooltipRequirementsList does not reach it. When a mutually-exclusive fallback line must match a sized row's height (e.g. an effect list vs. its own \"no effect\" line), replace TooltipTextBlock with a plain text_single using the same fontsize and an explicit size, not the templated tooltip type."
  category: gui
  scope: sizing
  source: "reference_game_files/game/main_menu/gui/shared/main_menu_cooltip_types.gui (TooltipTextBlock / tooltip_text_block_template); location_window.gui wonder ritual no-effect row height mismatch, 2026-07"
  notes: "Observed in src/in_game/gui/location_window.gui: the ritual TooltipRequirementsList was resized to 13pt/22px rows to match the country/local modifier columns, but the mutually-exclusive ritual_no_effect_visible TooltipTextBlock stayed visibly taller until it was swapped for a text_single with fontsize = 13 and size = { -1 22 }."

- id: add_country_modifier_auto_modifier_id
  pattern: 'add_country_modifier\s*=\s*\{[^\n{}]*modifier\s*=\s*[A-Za-z0-9_]*auto[A-Za-z0-9_]*'
  detectability: advisory
  bad: "Using add_country_modifier with a modifier id defined only in common/auto_modifiers"
  correction: "Keep Country Auto modifiers in common/auto_modifiers for actual automatic effects. For tooltip previews or scripted effect lists, emit real non-modifier effect lines or omit the modifier-list preview. Do not pass auto modifier ids to add_country_modifier, and do not restore finalization-time static grants/removals for building-gated wonder effects."
  category: modifier
  scope: country
  source: "runtime error.log, 2026-06: add_country_modifier rejected tv_wonder_auto_unique_*_style_1_country_modifier in tv_engineering_department_wonder_mechanics_effects.txt"
  notes: "Country Auto modifiers and static country modifiers are separate databases. A Country Auto modifier may have category = country, but add_country_modifier still cannot use its id."

- id: auto_modifier_missing_name_localization
  pattern: ''
  detectability: advisory
  bad: "Emitting a common/auto_modifiers id without matching AUTO_MODIFIER_NAME_<id> localization"
  correction: "Generate AUTO_MODIFIER_NAME_<id> for every emitted auto modifier, including hidden hide_effects companions such as *_unscaled."
  category: localization
  scope: modifier
  source: "runtime error.log, 2026-06: AUTO_MODIFIER_NAME_tv_wonder_auto_pirate_port_unscaled and AUTO_MODIFIER_NAME_tv_wonder_auto_unique_algiers_pirate_port_unscaled"
  notes: "Hidden Country Auto modifiers still load as modifier database entries and the localization system requests their AUTO_MODIFIER_NAME keys during startup."

- id: static_modifier_missing_name_localization
  pattern: ''
  detectability: lint
  validator: check_static_modifier_name_loc_coverage
  only_in_paths: ['static_modifiers', 'localization']
  bad: "Emitting a common/static_modifiers id without matching STATIC_MODIFIER_NAME_<id> localization in every supported main-menu language"
  correction: "Generate or add STATIC_MODIFIER_NAME_<id> for every static modifier id, including generated display-only families used by ShowModifierEffect."
  category: localization
  scope: modifier
  source: "runtime error.log, 2026-07: STATIC_MODIFIER_NAME_tv_trade_chain_strength_display_18980 through _18984 fell back to generated English text"
  notes: "Static modifiers load as modifier database entries and the localization system requests their STATIC_MODIFIER_NAME keys during startup or GUI display. scripts/validate.py checks static modifiers in both in_game and main_menu common/static_modifiers against all supported main-menu localization languages."

- id: eu5_1_2_cost_modifier_compatibility
  pattern: ''
  detectability: advisory
  bad: "Using EU5 1.3 *_efficiency cost-style modifier keys while the project/reference data target EU5 1.2"
  correction: "Use the EU5 1.2 *_cost modifier key. When rolling back from 1.3, invert the value sign: +x% efficiency becomes -x% cost, while -x% efficiency becomes +x% cost."
  category: modifier
  scope: any
  source: "reference_game_files/game/main_menu/common/modifier_type_definitions/00_modifier_types.txt:3115,4025,4057,4065,4073,6600,6616,6864,6872,15389"
  notes: "The current reference files define 1.2 cost-style keys and do not define the migrated 1.3 efficiency keys. EU5 1.3 replaced several of these with good-colored percent efficiency variants; changing direction without sign inversion reverses the intended gameplay effect."

- id: subject_loyalty_modifier_is_points
  pattern: '(?m)^\s*subject_loyalty\s*[:=]\s*0\.\d+'
  detectability: lint
  only_in_paths: ['victory_paths.yaml', 'static_modifiers', 'advances']
  bad: "Writing subject_loyalty as a fractional percent-like value such as 0.10"
  correction: "Write subject_loyalty as loyalty points, e.g. 10 for +10 loyalty. Vanilla advances use values such as subject_loyalty = 5 even though the modifier type displays decimals."
  category: modifier
  scope: country
  source: "reference_game_files/game/in_game/common/advances/0_age_of_renaissance.txt:356; reference_game_files/game/in_game/common/advances/0_age_of_traditions.txt:583; reference_game_files/game/main_menu/common/modifier_type_definitions/00_modifier_types.txt:5944-5948"
  notes: "The modifier definition has decimals=2 but no percent=yes, and vanilla advances grant whole loyalty points. A 0.x value is effectively a tiny fraction of a loyalty point, not a 10% or +10 loyalty bonus."

- id: trade_route_all_goods_per_good_expansion
  pattern: ''
  detectability: advisory
  bad: "Generating one market every_export/every_import route scan per good when the mechanic needs all goods from matching routes"
  correction: "Scan each route once, save the route good with `traded_goods = { save_scope_as = ... }`, and use that goods scope as a variable_map key or list item. Keep per-good static branches only for effects that require a static database id, such as `add_temporary_demand type = demand:*`."
  category: performance
  scope: international_organization
  source: "reference_game_files/game/in_game/events/government/republic_factions.txt:164-191; Trade Chain refactor, 2026-06"
  notes: "Trade route scopes can expose the current good as a scope. The Trade Chain bargaining-demand accumulator now stores demand by slot maps keyed by goods scope, while final temporary-demand application still dispatches to generated static demand ids because no dynamic `type = demand:<scope>` pattern is verified."

- id: country_interaction_accept_unset_selection_reads
  pattern: ''
  detectability: advisory
  only_in_paths: ['country_interactions']
  bad: "Reading `scope:recipient` or an unset actor variable directly inside country interaction accept scoring or a target-mutating effect before the select_trigger has chosen a country"
  correction: "Guard recipient-dependent reads and mutations with `exists = scope:recipient`. Initialize actor-owned variables at the feature creation lifecycle point, and gate nullable value reads with `has_variable` before using `scope:actor.var:<name>` in `accept`."
  category: scope
  scope: country
  source: "runtime error.log for tv_invite_to_diplomatic_alliance, 2026-06-24; reference_game_files/game/in_game/common/country_interactions/invite_settlers.txt:90-104"
  notes: "Country interaction accept/effect paths can be evaluated from panel buttons before the selector populates recipient. Direct reads then report wrong-type `none`, unset variables, or unset `var` scopes while the player is only looking at the country picker."

- id: hidden_event_missing_title
  pattern: ''
  detectability: advisory
  only_in_paths: ['events']
  bad: "Defining hidden country events without a `title = ...` field"
  correction: "Give every event, including hidden tick/executor events, a localized title key. The title can be technical if the event is never shown."
  category: event
  scope: events
  source: "runtime error.log, 2026-07-07: event_database.cpp reported tv_academy_debate.1, tv_research.45, and tv_research.46 missing titles"
  notes: "EU5 validates the event database schema before considering whether an event is hidden. Hidden monthly tick or executor events still need a title field and matching localization to avoid startup errors."

- id: save_scope_as_used_in_trigger_context
  pattern: 'save_scope_as\s*='
  detectability: needs_parser
  only_in_paths: ['generic_actions']
  bad: "Using `save_scope_as` inside a select_trigger `visible`/`enabled` block, or inside an `effect`'s `if`/`limit` trigger body, to stash a scope for a later comparison in that same trigger context"
  correction: "Use `save_temporary_scope_as` for any scope save performed inside a trigger-evaluated block (select_trigger visible/enabled, allow, potential, or any `limit = { ... }` body). Reserve `save_scope_as` for saves performed directly inside an effect body (siblings of `limit`, not inside it), where the scope needs to persist to sibling/later effect lines."
  category: scope
  scope: generic_actions
  source: "reference_game_files/game/main_menu/common/scripted_triggers/00_coa_triggers.txt:116 (c:BOH = { save_temporary_scope_as = custom_overlord } inside a trigger-only scripted_trigger); pdx_persistent_reader.cpp 'Unknown trigger type: save_scope_as' runtime error in tv_trade_league_actions.txt, 2026-07-07"
  notes: "The engine's trigger parser does not register `save_scope_as` as a valid trigger type at all; only `save_temporary_scope_as` is valid inside trigger evaluation. `save_scope_as` is effect-only. The Trade Chain generator (`scripts/in_game/common/generic_actions/gen_tv_trade_league_actions.py`) used `save_scope_as` inside `chain_previous_save`/`chain_nearest_previous_limits` (limit-block distance comparisons) and `chain_selector_filter` (select_trigger visible/enabled), producing hundreds of duplicate 'Unknown trigger type: save_scope_as' errors on load. Fixed by switching those three helpers to `save_temporary_scope_as`; the one genuine effect-body save (`scope:target = { save_scope_as = tv_trade_chain_candidate_market }` in the action's `effect` block) was left unchanged."

- id: on_action_war_gate_missing_winner_check
  pattern: 'on_(pre_winning_war|ending_war)\s*='
  detectability: advisory
  only_in_paths: ['on_action']
  bad: "Gating an `on_pre_winning_war`/`on_ending_war` on_action's effect only on `has_variable`/ownership/site-control checks, treating 'this war-ending on_action fired' as equivalent to 'root won a war'"
  correction: "Add `scope:winner = { this = root }` to the trigger when the gated effect is meant to require an actual win, not just war conclusion. `root` fires for both the winner and loser of the war; `scope:winner`/`scope:loser`/`scope:war` are all available scopes in both on_actions."
  category: scope
  scope: on_action
  source: "reference_game_files/game/in_game/common/on_action/_hardcoded.txt:1518-1576 (`#root = country ..., scope:winner = country, scope:loser = country, scope:war = war`); scope-equality idiom verified at line 3292 (`leader_country ?= { this = root }`) and in src/in_game/common/generic_actions/tv_arts_exhibition_actions.txt"
  notes: "Confirmed live instance: `scripts/unique_wonder_ritual_content/alhambra.py:build_on_action_body` set `tv_wonder_alhambra_war_validation = 1` in both `tv_wonder_unique_alhambra_ritual_on_pre_winning_war` and `_on_ending_war` whenever root held Granada, with no winner/loser distinction — a lost war validated the ritual's 'won or ended' war-gate exactly like a won one. Fixed 2026-07 by adding `scope:winner = { this = root }` to both on_actions' triggers."

- id: wonder_ritual_cleanup_stale_after_entity_ritual_rename
  pattern: ''
  detectability: advisory
  bad: "Trusting a generated wonder ritual/mechanics file at face value after `scripts/unique_wonder_ritual_content/<key>.py` row-set or variable-naming conventions change, instead of re-running every generator registered against it"
  correction: "When error.log reports `Variable 'tv_wonder_<unique_key>_<...>_status' is used but is never set` (or a matching `_favorable_count`/`_narrowed`/`_started`/`_completed`/`_ritual_phase`/`_ritual_row_set_index` variant) for one of the bespoke unique wonders (Dome of the Rock, Bank of Saint George, St. Peter's Basilica), diff the flagged names against the wonder's own content module (`entity_status_var`/`favorable_count_var`/`narrowed_var`/`_stage_var` in `scripts/unique_wonder_ritual_content/_entity_ritual.py` and `<key>.py`) before assuming a runtime bug. Re-run `gen_tv_wonder_ritual_effects.py` (owns `tv_wonder_ritual_effects.txt`, `data/generated_files.yaml`); it regenerates `tv_wonder_mechanics_clear_selected_ritual_runtime_effect` from each wonder's live `runtime_variables` list in `data/unique_wonders.yaml` and drops any stale entries left over from a prior naming convention. Do not hand-patch the generated file."
  category: workflow
  scope: any
  source: "runtime error.log, 2026-07-09: jomini_effect.cpp reported tv_wonder_dome_of_the_rock_custody_duties_*, tv_wonder_dome_of_the_rock_sanctuary_access_groups_*, tv_wonder_dome_of_the_rock_ritual_row_set_index/ritual_phase, and the matching st_peters_basilica/bank_of_saint_george variants as used but never set"
  notes: "Dome of the Rock, Bank of Saint George, and St. Peter's Basilica were reworked 2026-07 from the shared `_entity_ritual` row-set naming (`sanctuary_access_groups`, `custody_duties`, `sacred_official_candidates`, `apostolic_service_duties`, `charter_options`, `public_credit_pledges`, plus `ritual_row_set_index`/`ritual_phase`) to bespoke short-form naming (`access`, `duty`, `role`, `assigned_role`, `ritual_stage`), and `data/unique_wonders.yaml`'s `ritual.runtime_variables` lists were updated to match — but `src/in_game/common/scripted_effects/tv_wonder_ritual_effects.txt` (generated by `gen_tv_wonder_ritual_effects.py`) had not been regenerated since, so its `tv_wonder_mechanics_clear_selected_ritual_runtime_effect` cleanup effect still emitted `remove_variable` calls for the old long-form names. Those names are never set (false 'used but never set' warnings) and, worse, the *real* current-name status/favorable_count/narrowed/started/completed/ritual_stage variables were never cleaned up on ritual reset, leaking state across a ritual restart. Fixed by re-running the generator with no data changes; always re-run generators after editing a content module's naming helpers even when no runtime error has been observed yet."

- id: saved_scope_name_must_match_save_scope_as_exactly
  pattern: 'scope:tv_trade_candidate_market_location'
  detectability: lint
  only_in_paths: ['trade_league']
  bad: "Reading `scope:<name>` where `<name>` does not exactly match the string passed to any `save_scope_as = <name>` earlier in the same effect chain (e.g. reading `scope:tv_trade_candidate_market_location` when only `save_scope_as = tv_trade_candidate_market` was ever executed)"
  correction: "Grep the generator for every `save_scope_as = <name>` it emits and use that exact name in every later `scope:<name>` reference, including references made from a nested scope such as `scope:tv_trade_monopoly_leader = { ... }`. Saved scopes are exact-string keyed; a plausible near-miss name (an extra `_location` suffix, a singular/plural mismatch) silently resolves to nothing rather than erroring at generation time."
  category: scope
  scope: any
  source: "runtime error.log, 2026-07-09: jomini_effect.cpp reported Event target 'tv_trade_candidate_market_location' is used but is never set; scripts/in_game/common/scripted_effects/gen_tv_trade_league_effects.py:1717 (assign_candidate_to_io_rank) read scope:tv_trade_candidate_market_location while every_market_in_world only ever saved scope:tv_trade_candidate_market (annual_good_refresh_block, lines ~1849/1882)"
  notes: "assign_candidate_to_io_rank runs inside scope:tv_trade_monopoly_leader = { ... }, itself nested inside the every_market_in_world iterator that saved the candidate as tv_trade_candidate_market. The `_location` suffix was never saved anywhere (no STATIC_MARKET_FIELDS entry and no other save_scope_as call produces it), so the representative-market assignment for the Trade League detail page silently wrote an unresolved scope into tv_trade_{prefix}_market_{rank}_{good} instead of the real candidate market. Fixed by correcting the reference to scope:tv_trade_candidate_market and regenerating tv_trade_league_effects.txt."

- id: cmf_suppress_for_confirmed_dynamic_reference_variables
  pattern: ''
  detectability: advisory
  bad: "Treating a `jomini_effect.cpp` 'Variable X is set but is never used' / 'used but is never set' warning as an unfixable false positive and leaving it undocumented once the read/write site is confirmed to be a GUI-only `GetVariable` read, a `variable_map`/`global_variable_map` name that is only ever touched by `add_to_*_variable_map`/`clear_variable_map` (never a literal `set_variable`), or a vanilla-consumed variable name (e.g. `parliament_seat`)"
  correction: "Once source-reading confirms the variable genuinely has a legitimate consumer the engine's static usage tracker cannot see, register it in `data/cmf_warning_suppressions.yaml` (a literal name in `extra_suppressions`, or a new structured family function in `scripts/in_game/common/on_action/gen_tv_cmf_suppressions.py` for anything with more than a couple of instances, e.g. per-advance or per-slot families read straight from the owning data YAML) and regenerate `tv_cmf_suppressions.txt`. Do not hand-add `cmf_suppress` lines to that generated file."
  category: workflow
  scope: any
  source: "docs/knowledge/risk_cards/gui.md rule 2; src/in_game/common/on_action/tv_cmf_suppressions.txt (`tv_cmf_warning_suppressions_monthly_pulse`, an intentionally unreachable `if = { limit = { always = no } cmf_suppress = { v = ... } } }` block — this shape is CMF's own recommended suppression idiom, not dead code)"

- id: wonder_ritual_choice_branch_retry_reward_template_trap
  pattern: ''
  detectability: advisory
  bad: "Writing a new unique-wonder ritual whose narrative shape is 'choice -> deterministic branch marking a fixed subset of tracked entities at risk -> one retry/incident event offering pay-a-cost-to-fully-resolve vs. accept-narrower-for-free -> threshold-scaled reward', even after removing `random_list` dice and renaming every variable"
  correction: "Design each wonder's state representation, time structure, and decision shape independently from its own `data/unique_wonder_ritual_specs.yaml` design_ir/mechanic_signature, not from a template shared with sibling wonders. When authoring more than one wonder ritual in the same batch, assign each to an isolated agent/context with no visibility into sibling implementations or into scripts/unique_wonder_ritual_content/_entity_ritual.py, so the natural 'copy the pattern already in this file' shortcut is unavailable. Run scripts/audit_unique_wonder_ritual_mechanic_similarity.py after the batch and treat any pair scoring combined_ratio >= 0.15 as a real finding to investigate, not just a number to beat."
  category: workflow
  scope: any
  source: "docs/knowledge/risk_cards/wonders.md rules 12-13; scripts/audit_unique_wonder_ritual_mechanic_similarity.py"
  notes: "Confirmed twice on the same 3-4 wonders: first when Alhambra/Dome of the Rock/Bank of Saint George/St. Peter's Basilica all routed through the shared _entity_ritual.py dice engine (combined_ratio up to ~0.7+), then again 2026-07 when Dome/Bank/St Peter's each got an independent bespoke rewrite that removed the dice but still converged on the same higher-level template (combined_ratio 0.48-0.71). Resolved 2026-07 by a second rewrite of all four wonders (including Alhambra, whose dice-driven _entity_ritual usage was itself a second instance of template reuse), each authored by an isolated subagent with no visibility into siblings: effects-file combined_ratio among Dome/Bank/St Peter's dropped to 0.18-0.32."

- id: mechanic_similarity_audit_short_triggers_file_dominates_combined_ratio
  pattern: ''
  detectability: advisory
  bad: "Reading scripts/audit_unique_wonder_ritual_mechanic_similarity.py's combined_ratio (effects+triggers together) as a direct proxy for mechanic-shape similarity when every wonder being compared has a very short triggers file (2-3 blocks total)"
  correction: "When a wonder ritual's triggers file is short, most of its content is the mandatory, near-identical site_control_trigger (owns = location:X) and active_trigger (has_variable = tv_wonder_locked / var:tv_wonder_locked ?= <id> / has_variable = tv_wonder_ritual_in_progress) every ritual in the mod must define. On short files this boilerplate can push combined_ratio over the 0.15 gate even when the effects files (the actual mechanic) are genuinely dissimilar. Read the printed effects_ratio and triggers_ratio components separately, not just combined_ratio; judge homogenization primarily from effects_ratio plus a direct read of the mechanic. Adding one genuine, wonder-specific, differently-shaped extra trigger per wonder (vary the shape across wonders too -- a flat comparison for one, an OR-of-AND compound for another -- reusing the same shape across two wonders' 'extra' triggers just recreates the same problem one level up) and wiring it into a real triggered_desc reduces but does not eliminate this artifact on very short files."
  category: workflow
  scope: any
  source: "docs/knowledge/risk_cards/wonders.md rule 13 resolution note, 2026-07"
  notes: "Observed while resolving wonder_ritual_choice_branch_retry_reward_template_trap: after the four-agent rewrite, Dome of the Rock <-> St. Peter's Basilica triggers_ratio swung from 0.99 (both had a redundant eligibility_trigger wrapping active_trigger+site_control_trigger) to 0.30 (after removing eligibility_trigger and adding an OR-of-AND compound trigger to Dome) to 0.909 for a different pair, Bank of Saint George <-> St. Peter's Basilica, purely because their two 'extra' triggers were accidentally given the identical AND-of-4-conditions shape. combined_ratio for that pair barely moved (0.300 -> 0.302) despite the swing, confirming the metric is noisy on short files and should not be chased below 0.15 in isolation from the effects-file ratio."
  notes: "2026-07-09: error.log flagged tv_advance_<id>_researched (31 advances, GUI-only read), tv_academy_debate_node_<1-5>_year/index/type (15 vars, GUI-only read), tv_research_open_age_ceiling (GUI-only read), tv_wonder_final_building_type_to_display_id and tv_trade_good_global_consumption/production (global_variable_map names, never literally set_variable'd), tv_trade_chain_demand_slot_1..20 (variable_map names, same reason), and parliament_seat (vanilla-consumed IO parliament-seat location, confirmed against reference_game_files) as used-but-never-set/set-but-never-used. All were confirmed as legitimate dynamic-reference cases (not bugs) and added to data/cmf_warning_suppressions.yaml via new add_locked_advance_researched_suppressions/add_academy_debate_suppressions family functions plus TRADE_EXTRA_VARIABLES/trade-chain-slot-loop extensions and two extra_suppressions singletons, then tv_cmf_suppressions.txt was regenerated. This is the pre-existing, already-adopted project mechanism for this whole class of warning — check it before spending time re-deriving why a variable 'looks unused'."

- id: loc_text_format_tag_catalog_undiscovered
  pattern: ''
  detectability: advisory
  bad: "Only using #R/#G color tags (or inventing a custom GUI/widget solution) for localization text emphasis, tabular tooltip alignment, or numeric breakdowns, without checking whether an existing `#tag` already covers the need"
  correction: "Check the Text Format Tag Catalog in docs/technical/EU5_Modding_Knowledge_Base.md section 6.3 before designing new emphasis/layout for event or tooltip text. Confirmed tags: colors #R #G #Y #W #V #L #P #N #X #D #F (plus lowercase #r #g #y); style #bold #italic #weak #high #T #subtle_name; tabular #col #col_t #col_m; and special #TOOLTIP:$BREAKDOWN_TAG$, #indent_newline:N, #trigger_pass/#trigger_fail. All must be closed with #! and (per [[loc_color_tag_adjacent_text]]) separated from adjacent content by a space."
  category: localization
  scope: any
  source: "reference_game_files/game/main_menu/localization/english/*.yml (empirical grep across ~530 English localization files, 2026-07-10); docs/technical/EU5_Modding_Knowledge_Base.md section 6.3"
  notes: "There is no single canonical reference file for the full #tag list in this repo's mirror — the underlying textformatting.gui asset is gfx-adjacent and pruned by scripts/sync_reference.py. The catalog was reconstructed by frequency-counting #[A-Za-z_0-9]+ tokens across all main_menu English localization files and reading surrounding usage context to infer each tag's semantics."

- id: monthly_country_pulse_callback_missing_participation_gate
  pattern: ''
  detectability: needs_parser
  only_in_paths: ['on_action', 'scripted_effects', 'pulse_registry.yaml']
  bad: "A monthly_country_pulse-registered callback (or any per-country on_monthly-style hook) starting straight into a global/expensive scope iteration (every_character, every_country, every_international_organizations_member_of, every_owned_location, nested every_key_in_variable_map, etc.) with no cheap has_variable/has_variable_list membership check first. Because the callback runs for EVERY country every month, an ungated O(k) scan inside it becomes O(countries x k) system-wide, and if k itself scales with world population/character count the callback alone is O(countries x world_size)."
  correction: "Before any nontrivial scope walk inside a per-country monthly callback, gate it behind the cheapest possible existence/membership check for the state the walk actually needs (has_variable_list on a country-scoped list variable is strictly better than a global every_character/every_country scan filtered by a limit, since the list is already bounded to what this country owns). Example fix: tv_leaderboard_monthly_pulse's touring-artist roll used an ungated every_character = { limit = { is_artist=yes has_variable=tv_on_exhibition } } scanning every living character in the world every country every month; replaced with if = { limit = { has_variable_list = tv_dispatched_artists_list } } every_in_list = { variable = tv_dispatched_artists_list ... } since dispatching countries already maintain that list."
  category: on_action
  scope: country
  source: "src/in_game/common/on_action/towards_victory_leaderboard.txt (tv_leaderboard_monthly_pulse, fixed 2026-07-10); src/in_game/common/scripted_effects/towards_victory_effects.txt (tv_io_establishment_mark_basic_requirements_effect conquest branch, fixed 2026-07-10); src/in_game/common/scripted_effects/tv_trade_league_effects.txt + tv_diplomatic_alliance_effects.txt (tv_trade_league_country_monthly_pulse_effect / tv_diplomatic_alliance_country_monthly_pulse_effect, fixed 2026-07-10); src/in_game/common/scripted_effects/tv_academy_philosophy_debate_effects.txt (tv_academy_world_debate_monthly_effect's mirror call, fixed 2026-07-10); audit also found the same missing-gate shape still open in tv_wonder_mechanics_refresh_country_auto_level_map_effect"
  notes: "Engineering Department, Governor's House, and Academy of Sciences monthly pulses already follow the correct has_variable-gate-first pattern and are good reference examples. This rule is needs_parser (not lint) because detecting it requires knowing whether a cheap gate trigger precedes the expensive iterator within the same callback body, which needs brace-aware scope tracking; a future scripts/validate.py checker could walk pulse_registry.yaml callbacks and flag every_character/every_country/every_international_organizations_member_of/every_owned_location appearing before any has_variable/has_variable_list check in the same effect body.

  Second technique, used for tv_io_establishment_mark_basic_requirements_effect's conquest branch: an existence/membership gate does not help when the country IS a legitimate participant and the value must still progress toward completion (e.g. tv_update_conquest_score_effect's every_subject_or_below scan feeds a threshold every not-yet-established country needs to keep evaluating). There, split by is_ai instead of gating on existence: keep the scan on the existing monthly_country_pulse callback for is_ai = no, and add a sibling callback registered under yearly_country_pulse (see pulse_registry.yaml) that runs the same scan for is_ai = yes once a year. This mirrors the already-accepted human-monthly/AI-yearly split in towards_victory_situations.txt's tv_victory_situation.on_monthly. The scan itself is bounded by the ticking country's own subject count (not world size), so this is a lower-severity instance of the pattern than the world-character scan in tv_leaderboard_monthly_pulse -- worth fixing for consistency and to stop it running forever for AI, but not an O(n^2) hazard on its own.

  Third technique, used for tv_trade_league_country_monthly_pulse_effect and tv_diplomatic_alliance_country_monthly_pulse_effect: both scanned every_international_organizations_member_of across ALL instances of the IO type every country every month, relying on an inner limit (leader_country ?= scope:<pulse_country>) to discard every entry except the one where the ticking country happens to be that instance's leader -- meaning only actual IO leaders ever did real work, but every non-leader country still paid the full scan cost walking every league/alliance's membership list. A plain has_variable_list membership gate is too coarse here (it would still admit every non-leader member, not just leaders). Use is_leader_of_international_organization_of_type = { type = tv_<io> } instead -- a single O(1) trigger check, already used elsewhere in this codebase (data/io_establishment.yaml ai_creation_requirement_body, src/in_game/common/generic_actions/tv_io_leader_actions.txt) -- to skip the scan entirely for every country that isn't currently leading any instance of that IO type.

  Fourth case, tv_academy_world_debate_monthly_effect (scripts/philosophy_debate_codegen.py): this one already had the right gate (if = { limit = { has_variable = tv_academy_world_debate_active } ... }) but the tv_academy_world_debate_mirror_all_countries_effect = yes call (an every_country walk over every academy-owning country) was emitted at the WRONG indent level, one level shallower than the if body, so it ran every month unconditionally regardless of whether a debate was active. Not a missing gate, a misplaced statement outside an otherwise-correct one -- when a codegen helper builds nested blocks by explicit indent level (emit(lines, level, text) style, as opposed to raw multi-line string templates), double-check the indent level of every appended line against the block it is meant to close into, especially the last statement before a block's closing brace. The mirror is still safe to run on the exact month the debate resolves, since resolve_effect only clears active partway through the same if body and EU5 effect blocks execute sequentially rather than re-checking the outer limit -- so moving the call to be the last line inside the if (not after it) preserves the one clearing pass on resolution while skipping all the months no debate is running."
