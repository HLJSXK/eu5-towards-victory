# eu5-towards-victory project-specific anti-patterns; reusable entries are loaded from .eu5-base/docs/knowledge/anti_patterns.yaml.
- id: card_common_list_missing_fixed_vertical_size_overlaps_in_vbox
  pattern: ''
  detectability: advisory
  bad: Stacking multiple *_card_common instances directly in a vbox (or wrapping each in a plain `widget = { ... }`) without
    giving each instance an explicit `layoutpolicy_vertical = fixed` plus a numeric `minimumsize`/`maximumsize` height --
    e.g. gen_tv_wonder_ceremony_cards_gui.py's ready/stage cards had no vertical policy or size at all, only `layoutpolicy_horizontal
    = expanding` on an outer wrapper widget.
  correction: A plain `widget` (unlike `hbox`/`vbox`) does not auto-size vertically from its child content in this codebase's
    GUI convention; every other stacked card usage in tv_engineering_department.gui (7467-7472, 7495-7499, 7542-7545, 7635-7638,
    1646-1650) sets `layoutpolicy_vertical = fixed` with an explicit `minimumsize`/`maximumsize` height directly on the card_common
    instantiation itself (no extra wrapper widget). Without it, every card collapses to zero height and the vbox stacks them
    all at the same position, reading as cards 'piled on top of each other' instead of listed in sequence.
  category: gui
  scope: any
  source: src/in_game/gui/panels/organization/tv_engineering_department.gui:7467-7472,1646-1650 (working fixed-height precedents)
  notes: Found 2026-07-11 alongside card_common_untitled_card_missing_common_header_blockoverride in the same ceremony-card
    fragment; the two bugs compounded visually (the leaked header content from the missing common_header override was what
    was actually visible piled up at the top of the collapsed card stack).
- id: card_common_shrinking_height_chain_broken_by_one_fixed_height_wrapper
  pattern: ''
  detectability: advisory
  bad: A card_common instance declares auto/flexible height at the outermost level (`maximumsize = { W -1 }`, no explicit
    layoutpolicy_vertical needed there) and the first nested content wrapper correctly uses `layoutpolicy_vertical = shrinking`
    + `size = { W -1 }` + `set_parent_size_to_minimum = yes` on its vbox, but a DEEPER nested wrapper widget inside that same
    content reverts to a hardcoded fixed height (e.g. `widget = { size = { 462 330 } vbox = { ... } }` with no shrinking policy)
    -- found in tv_engineering_department.gui's outer Ceremony card (TV_ENGINEERING_CEREMONY_CARD_TITLE), whose inner `widget
    = { size = { 462 330 } ... }` wrapped the Pharos/Hagia ritual-status area and the newly generated 1-9 ceremony stage cards.
  correction: The auto-height chain (`layoutpolicy_vertical = shrinking` + `size = { W -1 }` on the wrapper widget, `set_parent_size_to_minimum
    = yes` + `layoutpolicy_vertical = shrinking` on its vbox) must be applied at EVERY nesting level between the outermost
    flexible card_common and the actual variable-height content, not just the first level. A single fixed-height wrapper anywhere
    in that chain caps the measured content at its hardcoded number regardless of how much content is actually rendered inside
    it, so variable-count child lists (like a growing stack of ceremony stage cards) silently overflow past the outer card's
    computed bounds instead of stretching it taller.
  category: gui
  scope: any
  source: src/in_game/gui/panels/organization/tv_engineering_department.gui:8115-8137 (outer card + first-level shrinking
    wrapper, both correct) vs. :8220-8226 (second-level wrapper, hardcoded `size = { 462 330 }`, fixed 2026-07-11 to `layoutpolicy_vertical
    = shrinking` + `size = { 462 -1 }` + `set_parent_size_to_minimum = yes` on its vbox)
  notes: 'Reported by the user: the ceremony stage cards (now correctly stacked in sequence per card_common_list_missing_fixed_vertical_size_overlaps_in_vbox)
    still didn''t stretch the outer Ceremony card taller, because that card''s ritual-status content sat inside a hardcoded
    330px-tall widget dating from when this area only ever held the much shorter Pharos/Hagia step text. The generated ceremony
    cards fragment itself needed no change; only the hand-maintained wrapper one level up in tv_engineering_department.gui
    did.'
- id: card_common_text_wrapped_in_expanding_widget_blows_out_fixed_card
  pattern: ''
  detectability: advisory
  bad: Wrapping a `text_multi` in an extra `widget = { layoutpolicy_horizontal = expanding text_multi = { layoutpolicy_horizontal
    = fixed max_width = N autoresize = yes ... } } }` inside a card_common bottom-content row -- e.g. gen_tv_wonder_ceremony_cards_gui.py's
    stage cards, observed rendering the text column at ~375px against a nominal 380 max_width and pulling the whole fixed-500-wide
    card wider than its declared minimumsize/maximumsize.
  correction: Do not sandwich text_multi inside an extra `layoutpolicy_horizontal = expanding` generic `widget`. Place text_multi
    directly as the hbox child instead, with `layoutpolicy_horizontal = expanding`, `max_width`, and `autoresize = yes` set
    on the text_multi itself -- matching the verified working precedent at tv_engineering_department.gui:8422-8428 (the Pharos
    stage-1 text row). Also keep max_width comfortably below the row's real budget (card width minus card_common_bottom_margin
    minus the icon column minus hbox spacing gaps), not flush against it -- this project settled on a shared `TEXT_MAX_WIDTH
    = 340` constant in wonder_ceremony_lib-adjacent gen_tv_wonder_ceremony_cards_gui.py for a 500px card with a 60px icon
    column.
  category: gui
  scope: any
  source: src/in_game/gui/panels/organization/tv_engineering_department.gui:8422-8428 (working direct-hbox-child text_multi
    precedent) vs. scripts/in_game/gui/panels/organization/gen_tv_wonder_ceremony_cards_gui.py (first draft, extra expanding
    wrapper widget)
  notes: Found 2026-07-11, reported by the user as the ceremony stage cards' right-side text visibly overflowing the card
    at ~375px. This is the same failure class already documented in docs/technical/EU5_Modding_Knowledge_Base.md (an expanding
    child pulling its natural width back into the row and blowing out a bounded parent, historically observed at 548.3px against
    a 470px-bounded card) -- confirms the anti-pattern recurs even when max_width nominally fits the arithmetic budget, because
    the expanding wrapper widget does not respect the ancestor's declared size clamp at all. See docs/knowledge/risk_cards/wonders.md
    rule 11 and rule 22.
- id: card_common_untitled_card_missing_common_header_blockoverride
  pattern: ''
  detectability: needs_parser
  bad: Instantiating tv_engineering_department_card_common (or any similarly-templated *_card_common type with a `common_header`
    icon+text block) with `blockoverride "header_size" { size = { -1 0 } }` to zero out the header row, but not also `blockoverride
    "common_header" {}` -- e.g. gen_tv_wonder_ceremony_cards_gui.py's first draft overrode header_size/header_decor_templates/common_header_back_decor
    only.
  correction: 'Forcing the header widget''s declared size to 0 does not suppress its child content: the default `common_header_icon`/`common_header_text_full`
    block (an icon plus a literal placeholder title) still gets created and renders, overflowing the zero-height parent and
    appearing as a leaked duplicate icon+title above the card''s real content. Add `blockoverride "common_header" {}` alongside
    header_size/header_decor_templates, matching the verified in-repo precedent at tv_engineering_department.gui:7547-7549
    and :7640-7642.'
  category: gui
  scope: any
  source: src/in_game/gui/panels/organization/tv_engineering_department.gui:7547-7549,7640-7642 (working untitled-card precedent)
    vs. scripts/in_game/gui/panels/organization/gen_tv_wonder_ceremony_cards_gui.py (first draft, missing the common_header
    override)
  notes: 'Found 2026-07-11 fixing the Unique Wonder Ceremony card fragment: all 9 cards (the ready card + 8 stage cards) leaked
    the default ''Card title header'' placeholder icon+text once above the whole card group. common_header_back_decor was
    already empty by default in the type, so overriding it again was a no-op that didn''t address the real leak.'
- id: ceremony_cost_gold_must_use_scaled_gold_not_flat_add_gold
  pattern: ''
  detectability: advisory
  bad: Rendering a `country_reward` gold cost via bare `add_gold = <N>` (a flat literal amount) when the design intent is
    an economy-scaled loss.
  correction: '`data/cost_reward_units.yaml`''s `country_reward` catalog originally had an id `gold` (value: 1) that `wonder_ceremony_lib.py:CEREMONY_COST_COUNTRY_REWARD_EFFECTS`
    mapped straight to bare `add_gold = <value>`. The user clarified the intended semantics was always ''lose gold at scale=1''
    — i.e. the vanilla `change_gold_effect = { scale = <N> }` scripted effect (which computes the actual gold delta from the
    country''s `capital_wealth`/`country_economical_base`), matching the sibling `scaled_gold` catalog entry already used
    everywhere else in the Wonder Ritual system (Pharos/Hagia/tv_wonder_ritual_effects.txt/tv_academy_philosophy_debate_effects.txt
    all use `change_gold_effect = { scale = ±1..±5 }`, never bare `add_gold` for a scaled cost). Renamed the catalog id from
    `gold` to `scaled_gold` (same base value=1, so no `ceremony_cost_computed_value` magnitude changed) and added an explicit
    `scaled_gold` branch in `ceremony_cost_effect_lines()` that renders `change_gold_effect = { scale = <value> }` instead
    of going through the flat-scalar `CEREMONY_COST_COUNTRY_REWARD_EFFECTS` map. Do not add a new flat-literal `gold` cost
    id back to this catalog — any gold-flavored ceremony cost must render through `change_gold_effect`, consistent with `docs/knowledge/anti_patterns.yaml`
    rule `flat_gold_cost_when_dynamic_event_cost_intended`''s general guidance that dynamic/repeatable costs should scale
    with the economy, not use a flat literal.'
  category: script
  scope: any
  source: 'data/cost_reward_units.yaml country_reward.scaled_gold; scripts_engineering_department/wonder_ceremony_lib.py:CEREMONY_COST_COUNTRY_REWARD_EFFECTS,ceremony_cost_effect_lines;
    data/unique_wonders.yaml ceremony.stages[*].cost (43 stages renamed type: gold -> type: scaled_gold)'
  notes: '2026-07-15: user flagged this immediately after the exactly-1-cost-per-stage fix landed: ''所有的gold代价直接写了数值，其实原始数据的含义是失去scale=1的gold''.
    Confirmed via the sibling scaled_gold usage across Pharos/Hagia/philosophy-debate effects that change_gold_effect with
    small integer scale (±1 to ±5) is the established convention for gold costs tied to economy scale, and that add_gold''s
    value-block form has no scale sub-key at all (scale is a change_gold_effect macro parameter, not part of add_gold''s syntax).
    Renamed the catalog id and added the dedicated render branch rather than inventing new add_gold syntax.'
- id: ceremony_locked_flag_conflates_first_confirm_with_expansion_reuse
  pattern: ''
  detectability: advisory
  bad: 'Gating GUI text on a generic state flag (`tv_wonder_ceremony_locked`, meaning only ''the ceremony style choice is
    now finalized/uneditable'') as if it uniquely identified one specific cause of that state (here: ''this style was auto-reused
    from an earlier expansion''), when the same flag is set identically for the unrelated first-time-confirm case.'
  correction: '`tv_wonder_ceremony_locked` is set to 1 inside every generic ritual''s `tv_wonder_mechanics_start_*_ritual_effect`
    (tv_wonder_ritual_effects.txt, ~60 near-identical call sites, one per wonder/style) as soon as the player confirms and
    the ritual actually starts — this happens identically whether the wonder is being built for the very first time or is
    a resumed/expanded project reusing an earlier ceremony choice. The GUI card at `tv_engineering_department.gui`''s ceremony
    section showed `TV_ENGINEERING_CEREMONY_LOCKED_BY_EXPANSION_TEXT` (''this is an expansion of an existing wonder, so it
    reuses its prior ceremony'') whenever `tv_wonder_ceremony_locked.IsSet` and the wonder is not unique — with no check for
    whether it was actually an expansion — so every normal first-time generic wonder ceremony wrongly displayed the expansion
    message after confirming. The real distinguishing signal is `tv_wonder_project_mode ?= 2` (already the established ''this
    project is a resume/expansion'' marker used elsewhere, e.g. `tv_wonder_project_base_level`''s snapshot guard, docs/knowledge/risk_cards/wonders.md
    rule 29), which persists unchanged from proposal time through the ceremony stage (only cleared on abandon/reset, never
    on normal completion). Fixed by ANDing `tv_wonder_project_mode == 2` into the expansion text''s visibility and adding
    a sibling `TV_ENGINEERING_CEREMONY_STYLE_CONFIRMED_TEXT` card (visible when locked but project_mode != 2) so the first-time-confirm
    case gets its own accurate message instead of silently falling through to the expansion one. General lesson: when a boolean
    ''locked/confirmed/done'' flag is set from multiple different code paths for different reasons, GUI text that narrates
    *why* it''s locked must check the specific reason''s own variable, not just the shared flag.'
  category: gui
  scope: any
  source: src_engineering_department/in_game/gui/panels/organization/tv_engineering_department.gui ceremony style card; src_engineering_department/in_game/common/scripted_effects/tv_wonder_ritual_effects.txt
    tv_wonder_mechanics_start_*_ritual_effect; docs/knowledge/risk_cards/wonders.md rule 29; 2026-07-16
  notes: '2026-07-16: user reported that after locking in a ceremony for what was actually a brand-new (non-expansion) generic
    wonder, the panel inexplicably showed ''这是对已有奇观的扩建...'' (this is an expansion of an existing wonder...). Traced `tv_wonder_ceremony_locked`
    to ~60 set sites, all inside per-ritual ''start'' effects triggered by the confirm button for ANY generic ceremony, not
    specifically expansions. The GUI text''s visibility only checked this shared flag plus non-unique, with no `tv_wonder_project_mode
    ?= 2` (the actual resume/expansion marker) guard. Also fixed a related missing-prompt gap reported in the same session:
    the row of three ceremony-style-choice buttons had no heading text at all (''从如下三个仪式中选择一个'' never existed — confirmed
    via `git log -S` across all localization history, not a regression) — added `TV_ENGINEERING_CEREMONY_CHOOSE_STYLE_PROMPT`
    as a new text_multi above the button row, visible under the same `Not(ceremony_locked)` condition as the buttons themselves.
    validate.py --changed --fix --ai-report passed with 0 errors/warnings after both fixes.'
- id: cmm_mod_id_too_long_breaks_menu_visibility
  pattern: ''
  detectability: advisory
  bad: Using an unnecessarily long Community Mod Menu `mod_id` so the same namespace is repeated inside every generated setting
    id, callback flag, and cache key, and the mod stops appearing in the in-game CMM list
  correction: Keep the CMM namespace short and distinct from gameplay ids. Use a compact registration id such as `tv_ed` for
    `cmm_register_*`, and keep gameplay-facing aliases under the longer `tv_engineering_department_*` namespace. The CMM `mod_id`
    is just the registration prefix; it does not need to match the gameplay mod id.
  category: gui
  scope: any
  source: reference_mods/3692202776/loading_screen/data_binding/cmm_macros_view.txt:145; reference_mods/3692202776/loading_screen/data_binding/cmm_macros_settings.txt:112;
    src_engineering_department/in_game/common/scripted_effects/tv_engineering_department_cmm_effects.txt:4; src_engineering_department/in_game/common/scripted_guis/tv_engineering_department_cmm_scripted_gui.txt:1
  notes: '2026-08-03: the Engineering Department CMM integration used the gameplay id `tv_engineering_department` as the CMM
    namespace at first. That namespace was then repeated in every generated setting key and callback flag and the project
    did not show up in the in-game menu. Shortening the CMM id to `tv_ed` fixed the visibility issue without changing the
    gameplay aliases.'
- id: country_trigger_reused_inside_io_monthly_change
  pattern: ''
  only_in_paths:
  - international_organizations
  bad: Calling a country-scoped scripted_trigger from an IO variable monthly_change when that trigger depends on root, prev,
    caller-specific saved scopes, or country variables
  correction: Write the monthly_change condition in IO scope, or create a separate IO-scoped trigger. Use leader_country ?=
    { ... } for country state, compare IO variables directly against leader_country.var:X from the IO scope, and inline ownership/state
    checks whose prev/root chain must point at the leader country.
  category: scope
  scope: international_organization
  source: 'fixed in src/in_game/common/international_organizations/tv_engineering_department.txt; runtime reports: Engineering
    Department construction progressed while materials stockpile never decreased; Engineering Department survey active state
    passed in country pulse but survey progress did not advance from IO monthly_change'
  notes: monthly_change evaluates from the international organization/variable context. A nested leader_country block does
    not make root inside a called scripted_trigger become the country, and caller-sensitive prev/root chains can differ from
    the same trigger's country-pulse behavior. In Engineering Department survey progress, reusing tv_wonder_survey_active_trigger
    inside the IO variable monthly_change silently prevented the visible IO progress variable from gaining monthly progress;
    inlining the active-survey conditions under leader_country preserved monthly_change as the tooltip-visible source.
- id: court_character_variable_scope_link_missing_var_prefix
  pattern: ^[ \t]*tv_court_[A-Za-z0-9_]*_character\s*\?=\s*\{
  detectability: lint
  only_in_paths:
  - common/scripted_effects/
  bad: Entering a saved Court Position character variable as bare `tv_court_*_character ?= { ... }`
  correction: Enter the character stored in a variable with `var:tv_court_*_character ?= { ... }`. The `var:` prefix is required
    for a variable scope link.
  category: scope
  scope: character
  source: error.log jomini_effect.cpp:556, 2026-07-30; docs/technical/EU5_Modding_Knowledge_Base.md:503-505; src_engineering_department/in_game/common/scripted_effects/tv_engineering_department_effects.txt:347
  notes: A bare variable name is parsed as an effect identifier, producing `Unknown effect tv_court_*_character`; `var:` enters
    the stored character scope safely when the variable exists.
- id: event_option_effect_block_unknown_effect
  pattern: ''
  validator: check_event_option_effect_blocks
  detectability: lint
  only_in_paths:
  - events
  bad: Putting `effect = { ... }` as a direct child of an event `option = { ... }`
  correction: Write effect calls directly in the option block, alongside `name` and optional `trigger` / `hidden_effect`.
    Use `hidden_effect = { ... }` only when the option chain should be hidden from the tooltip.
  category: event
  scope: country
  source: 'runtime error.log: jomini_effect.cpp:556, events/tv_wonder_unique_alhambra_ritual_events.txt:24; fixed 2026-07-07'
  notes: EU5 parses event option contents as an effect list. A direct child named effect is treated as an effect command named
    `effect`, which does not exist, producing 'Unknown effect effect'.
- id: generic_action_effect_reads_newly_set_variable
  detectability: needs_parser
  pattern: ''
  only_in_paths:
  - generic_actions
  - scripted_effects
  - gui/panels/organization
  bad: A visible generic action calls an effect that initializes persistent variables and then compares `var:X` later in the
    same visible effect chain, assuming action tooltip pre-evaluation commits the earlier writes
  correction: Hide action widgets until their prerequisite state exists, re-check prerequisites inside the action effect,
    and make reusable effects safe under pre-evaluation. For derived display/helper values, compute and compare `local_var:X`
    scratch values first, then write persistent display variables as outputs. For nullable persistent state, use `has_variable`
    / `var:X ?= ...` or branch from already-existing state instead of directly comparing variables set earlier in the same
    chain.
  category: script
  scope: any
  source: 'runtime error.log: tv_wonder_select_construction_site -> tv_wonder_update_wonder_level_effect (tv_wonder_body_units/function_units/decoration_units
    unset during action hover); tv_wonder_select_construction_site -> tv_wonder_update_construction_progress_display_effect
    (tv_wonder_remaining_progress unset after announcing a completed survey); tv_establish_science_io -> tv_academy_philosophy_refresh_timeline_effect
    (tv_academy_debate_node_N_index unset during select-trigger pre-evaluation)'
  notes: EU5 generic action card and tooltip rendering can pre-evaluate the action effect without committing preceding set_variable
    writes. A helper that initializes construction variables or Academy timeline display variables and then immediately reads
    them with direct var:X comparisons can spam Failed to fetch variable / Invalid left side errors while the card is merely
    visible, hovered, or clicked. Even a display refresh that sets a variable to 0 before comparing it needs optional reads
    or local scratch comparisons if it is reachable from a visible generic action.
- id: gui_generator_rewrite_silently_dropped_generic_wonder_confirm_buttons
  pattern: ''
  detectability: advisory
  bad: 'A GUI generator rewrite that adds a new bespoke UI path (here: the unique-wonder ceremony framework''s Pharos/Hagia
    bespoke confirm buttons) deletes the generic-case code block it''s replacing without checking whether the generic case
    still needs its own equivalent.'
  correction: 'Every player-facing generic_action in this mod''s Engineering Department panel (including `tv_wonder_confirm_ceremony`/`_scaled_gold`/`_prestige`)
    is reachable ONLY through an explicitly hand-authored widget in this generator — these are not vanilla-surfaced generic
    actions with an automatic fallback UI. Commit 5a56683e (''add unique ceremony framework and update UI elements'', 2026-07-12)
    rewrote `scripts_engineering_department/in_game/gui/panels/organization/gen_tv_engineering_department_wonder_mechanics_gui.py`''s
    `TV_WONDER_MECHANICS_HOLD_BUTTONS` section to add the two bespoke Pharos/Hagia `hold_button()` calls (wonder id 101/102
    specifically), and in the same edit deleted the pre-existing generic-wonder block (`not_special_unique_locked_expr()`/`selected_ritual_cost_visible()`
    + three `hold_button()` calls for `tv_wonder_confirm_ceremony`/`_scaled_gold`/`_prestige` gated to ''any locked wonder
    that is not Pharos/Hagia'') without adding a replacement. The underlying generic_actions, their `allow=` trigger chains,
    and the cache-effect pipeline that populates `tv_wonder_selected_ritual_*` variables were all still fully correct and
    functional — the regression was pure GUI wiring: no widget anywhere called `left_action = { action_name = "tv_wonder_confirm_ceremony..."
    }` for a non-unique wonder, so the button silently vanished for every generic wonder after choosing a ceremony style,
    while Pharos/Hagia (the only two wonders exercised by the accompanying test) kept working — masking the regression from
    `scripts_engineering_department/test_wonder_mechanics_rules.py`, which only asserted the Pharos/Hagia buttons exist and
    (over-broadly) that the shared button-must NOT appear at all, never asserting a generic-wonder path still worked. Fixed
    by restoring the generic hold-button block, reusing the already-present `generic_wonder_locked_expr()` helper (a cleaner
    equivalent to the deleted `not_special_unique_locked_expr()`, added by a later commit for the ceremony-style-choice buttons)
    instead of re-adding a redundant helper, and narrowing the test''s blanket ''must not be emitted'' assertions to ''must
    be emitted, gated on `tv_wonder_locked_is_unique`'' so Pharos/Hagia and generic wonders can''t double-render buttons.
    General lesson: when a generator rewrite adds a bespoke special-case path, explicitly verify (or write a test asserting)
    that the generic/default case this special-case is carved out of still has its own working path — do not assume deleting
    the special case''s old home also means the generic case has nowhere else to live.'
  category: gui
  scope: any
  source: scripts_engineering_department/in_game/gui/panels/organization/gen_tv_engineering_department_wonder_mechanics_gui.py
    TV_WONDER_MECHANICS_HOLD_BUTTONS; scripts_engineering_department/test_wonder_mechanics_rules.py validate_generated_ceremony_gui;
    git commit 5a56683e (introduced the regression, 2026-07-12); src_engineering_department/in_game/common/generic_actions/tv_engineering_department_wonder_mechanics_actions.txt
    tv_wonder_confirm_ceremony/_scaled_gold/_prestige; 2026-07-16
  notes: '2026-07-16: after the ceremony-style two-variable comparison bug was fixed (see [[preceding_has_variable_does_not_guard_a_later_raw_two_variable_comparison]]),
    user reported the bottom execute/confirm button for a generic wonder''s ceremony no longer appeared after choosing a style
    (''这个问题是解决了，为什么底部用于执行的按钮又不显示了''), again not knowing which commit broke it. Dispatched a dedicated read-only investigation
    (Explore agent) to trace the full allow=/cache chain end to end rather than guessing; it confirmed the generic_action/effect/trigger/cache
    pipeline was internally consistent (regenerated the relevant generators in-memory and byte-matched the committed .txt
    output) and isolated the actual break to `git log -S` on the GUI generator, finding commit 5a56683e deleted the generic-wonder
    hold-button block. Restored it (reusing `generic_wonder_locked_expr()` rather than the original deleted helper, since
    a newer commit had already added an equivalent for the style-choice buttons), regenerated+merged the GUI fragment, and
    updated the test''s over-broad ''must never appear'' assertions to the correct ''must appear, gated away from Pharos/Hagia''
    shape. `test_wonder_mechanics_rules.py` and `validate.py --changed --fix --ai-report` both passed after the fix.'
- id: io_creation_in_visible_option_effect_breaks_tooltip_preview
  pattern: ''
  detectability: advisory
  bad: Calling an effect that runs `create_international_organization` (with nested `add_country_to_international_organization`
    / `set_leader_country`) directly inside a normal (non-`immediate`) event `option = { ... }` effect chain, especially when
    it is the option's only/first effect.
  correction: Event option effect chains are pre-evaluated to render the option's tooltip before the player confirms. `add_country_to_international_organization`
    and `set_leader_country` each render their own tooltip line (`THIRD_ADD_TO_INTERNATIONAL_ORGANIZATION_EFFECT`, `SET_LEADER_EFFECT`)
    by promoting an `INTERNATIONAL_ORGANIZATION` scope — but during preview the option's own `create_international_organization`
    block has not actually run yet, so that promote returns nullptr and the engine logs `Promote 'INTERNATIONAL_ORGANIZATION'
    returned nullptr` for both `GetName` and `GetLeaderTitle`, with a `Data error in loc string` for each of the two effect
    tooltip keys. Move the whole IO-creation call (and any join/leader-assignment nested inside the same `create_international_organization`
    block) to the event's `immediate` block instead, so the IO is real, committed state by the time the option renders its
    tooltip. `immediate` runs unconditionally and is not tooltip-previewed the way option effects are. Keep the option itself
    for player-facing acknowledgment/hidden bookkeeping (e.g. clearing a pending flag) only.
  category: events
  scope: any
  source: src_engineering_department/in_game/events/tv_engineering_department_standalone_events.txt tv_engineering_department_standalone.1;
    src_engineering_department/in_game/common/scripted_effects/tv_engineering_department_effects.txt tv_engineering_department_create_effect;
