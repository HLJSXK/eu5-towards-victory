# EU5 Known Anti-Patterns
# ========================
# Machine-readable knowledge store. Feed into:
#   - scripts/validate.py  (static pre-flight checks)
#   - scripts/gen_brief.py (generates docs/knowledge/BRIEF.md)
#
# Fields:
#   id        : unique slug (no spaces)
#   pattern   : Python regex to detect the bad form in source files
#   validator : Optional named validator in scripts/validate.py for semantic lint rules
#   detectability: lint | needs_parser | advisory
#             lint = safe regex/static check; needs_parser = requires brace-aware
#             or semantic analysis; advisory = human/AI warning only.
#             Omit this field for legacy entries: non-empty pattern defaults to
#             lint, empty pattern defaults to advisory.
#   bad       : human-readable description of the bad form
#   correction: what to do instead
#   category  : modifier | enum | encoding | gui | scope | event | localization
#   scope     : country | location | character | global | any
#   source    : reference file that verifies the correction (path:line if known)
#   notes     : one-line explanation of why the bad form fails
#
# To add a new entry: append a YAML dict with all fields, then run:
#   C:\Users\Hades\anaconda3\envs\eu5\python.exe scripts\gen_brief.py

- id: unreleased_project_compatibility_layer
  pattern: ''
  detectability: advisory
  bad: "Adding or preserving compatibility layers, legacy save migrations, alias variables, wrapper launchers, duplicate old/new paths, or defensive fallback branches for a previous internal implementation"
  correction: "Treat this unreleased v0.1.0 project as mutable. Update all callers, generators, data, and docs to the current architecture, delete stale branches/state, and prefer direct efficient refactors over compatibility shims. Only add compatibility when the user explicitly requests it for a named external consumer."
  category: workflow
  scope: any
  source: "Project owner directive, 2026-06-07"
  notes: "There are no shipped saves or public APIs to protect. Compatibility code creates hot-path cost, hides call-order bugs, and teaches future agents to preserve obsolete structures."

- id: managed_sandbox_conda_run_hang
  pattern: ''
  detectability: advisory
  bad: "Running or retrying `conda run -n eu5` from Codex, Claude subagents, or another managed sandbox"
  correction: 'Run project scripts with the direct environment interpreter: `C:\Users\Hades\anaconda3\envs\eu5\python.exe scripts\<script>.py ...`. Reserve `conda run --no-capture-output -n eu5 python ...` for normal user terminals only.'
  category: workflow
  scope: any
  source: "Project owner report, 2026-07-04"
  notes: 'Managed sandboxes can have read-only access to `C:\Users\Hades\anaconda3\conda-meta\history`, causing `conda run` to hang before the agent reaches validation or context output.'

- id: gui_list_filter_needs_cached_variable
  pattern: ''
  detectability: advisory
  bad: "Trying to bind a GUI row/list visible= expression to a scripted_trigger's result (e.g. an age-gate or has_advance check) so the display can filter a candidate list"
  correction: "GUI expressions cannot evaluate scripted triggers at all (see docs/knowledge/risk_cards/gui.md rule 2, which covers has_variable specifically — this generalizes to any scripted_trigger). Mirror the trigger's result into a country variable via a scripted_effect, and refresh that effect from a real lifecycle point (join/founding effect for immediate correctness, plus the feature's existing monthly_country_pulse hook for ongoing correctness) — never from a GUI/tooltip read path. Bind the GUI expression to the mirrored variable instead."
  category: gui
  scope: country
  source: "src/in_game/common/scripted_effects/tv_research_subprocess_effects.txt (tv_research_refresh_open_age_ceiling_effect, tv_research_refresh_advance_status_effect); docs/knowledge/risk_cards/gui.md rule 2"
  notes: "Discovered building the Academy of Sciences 'Potential Projects' card: the age-frontier eligibility trigger and has_advance are only readable in script scope, so the card needed a tv_research_open_age_ceiling variable (contiguous-prefix simplification of 4 age-gate triggers into one int) and per-advance tv_advance_<id>_researched variables, refreshed from the join effect and the existing tv_academy_of_sciences_monthly_pulse. Once mirrored, register the mirror variable with [[cmf_suppress_for_confirmed_dynamic_reference_variables]] — the GUI read does not count as a script-side use, so error.log still flags it as 'set but never used'."

- id: ritual_content_event_text_dict_letter_key_collides_with_desc
  pattern: ''
  detectability: advisory
  bad: "In a scripts/unique_wonder_ritual_content/<key>.py module's per-event localization dict, storing option-letter text directly alongside `\"t\"`/`\"d\"` keys (e.g. `{\"t\": ..., \"d\": ..., \"a\": ..., \"d\": \"Install the Alms Prefect.\"}`) whenever an event has 4+ options and therefore reaches option letter `\"d\"`."
  correction: "Nest per-event option text under its own `\"options\"` sub-dict (`{\"t\": ..., \"d\": ..., \"options\": {\"a\": ..., \"d\": ...}}`) and read `text[\"options\"][letter]` in `build_localization`'s option loop. Never let the `for letter in (\"a\",...,\"e\")` option loop check `letter in text` directly against the same dict that holds the `\"t\"`/`\"d\"` keys."
  category: localization
  scope: any
  source: "scripts/unique_wonder_ritual_content/st_peters_basilica.py build_localization; error.log pdx_localize.cpp:221 duplicate key tv_engineering_department.1678/1679/1680/1681.d, 2026-07-10"
  notes: "Python dict literals silently keep only the last `\"d\"` key, so the event's real long-form description (e.g. ASSIGNMENT_EVENT_ID's 5-role summary) was discarded entirely and replaced by the 4th option's text (\"Install the Alms Prefect.\") before it ever reached the generator. Separately, the option loop's `if letter in text` matched the dict's own `\"d\"` desc key even on events with fewer than 4 real options (OPENING/SCANDAL/REWARD), re-emitting the description a second time under the `.d` key and producing the exact 'Duplicate localization key ... defined in both X and X' engine warning. bank_of_saint_george.py and dome_of_the_rock.py were unaffected because their option loops only check `(\"a\",\"b\",\"c\")` and never reach letter `\"d\"`."

- id: v1_3_cost_modifier_renamed_to_efficiency
  pattern: '\b(global_build_buildings_cost|global_foreign_build_buildings_cost|global_fort_build_buildings_cost|global_port_build_buildings_cost|global_urban_build_buildings_cost|global_rural_build_buildings_cost|local_build_buildings_cost|local_build_new_buildings_cost|local_fort_maintenance_cost|local_port_build_buildings_cost|fort_maintenance_cost|stability_cost|court_spending_cost_modifier|building_upkeep_costs|food_purchase_cost|army_reinforce_cost|navy_repair_cost|colonial_maintenance_cost|exploration_maintenance_cost|diplomatic_annexation_cost|hostile_diplomatic_annexation_cost|diplomatic_upkeep_modifier|foreign_export_from_market_cost_modifier|global_trade_through_owned_territory_cost_modifier|local_trade_embark_disembark_cost_modifier|global_bureaucracy_implementation_cost_modifier|global_bureaucracy_removal_cost_modifier|global_bureaucracy_maintenance_cost_modifier|hire_for_cabinet_cost_modifier)\b'
  detectability: lint
  bad: "Using a v1.2-era `_cost`/`_cost_modifier` static modifier name (e.g. `global_build_buildings_cost`, `stability_cost`, `court_spending_cost_modifier`, `global_bureaucracy_maintenance_cost_modifier`) — these were renamed to `_efficiency` in EU5 v1.3."
  correction: "Rename to the v1.3 `_efficiency` identifier (see reference_game_files/game/main_menu/common/static_modifiers/00_modifier_types.txt) and negate the value: `color=bad->good` flips at the same time, so a value that reduced cost (e.g. -0.10) becomes a positive efficiency value (e.g. 0.10). Exception: `stability_cost` -> `stability_cost_efficiency` and `court_spending_cost_modifier` -> `court_spending_efficiency` (name doesn't just gain the suffix). Confirmed exact `x-1` negation via matched vanilla `inflation_impact`/`construction_wages` country_modifier blocks; for fields without a matched-block confirmation, this project's convention (see reverted scripts/archive/revert_1_3_modifier_efficiency_to_1_2_cost.ps1) is a uniform x-1 sign flip, treated as a placeholder pending a real balance pass."
  category: modifier
  scope: any
  source: "git diff <pre-v1.3 commit>^..c7978920 -- reference_game_files/game/main_menu/common/static_modifiers/00_modifier_types.txt"
  notes: "v1.3 renamed ~29 `_cost`-suffixed static modifiers to `_efficiency`. Also lost the `min=-0.95` floor clamp on the three `global_bureaucracy_*_cost_modifier` -> `_efficiency` fields. Discovered during the v1.3 migration pass (2026-07-10); ~114 usage sites found across hand-written src files and ~10 generator data YAMLs (victory_paths.yaml, trade_league_laws.yaml, govhouse_laws.yaml, arts_exhibition_laws.yaml, academy_laws.yaml, wonder_final_buildings.yaml, wonder_generic_rituals.yaml, unique_wonders.yaml). Unrelated to the separate v1.3 building_type.cpp validator capping local_manpower/employment_size <= 0.0125 (undocumented, not a rename)."

- id: v1_3_event_outcome_enum_good_bad_rejected
  pattern: '\boutcome\s*=\s*(good|bad)\b'
  detectability: lint
  bad: "`outcome = good` / `outcome = bad` at event top level (the `EAudioEventOutcome` audio-direction field)"
  correction: "Use `outcome = positive` / `outcome = negative` (keep `outcome = neutral` unchanged). Confirmed valid enum set from `reference_game_files/game/in_game/events/readme.txt` line 72: `outcome = positive/neutral/negative`, identical in both the pre-v1.3 and v1.3 reference commits — v1.3 only made the `pdx_persistent_reader.cpp` enum parser strict about rejecting values outside that set (error.log: `Failed to read enum! Type: \"EAudioEventOutcome\", Val \"bad\"/\"good\"`)."
  category: event
  scope: any
  source: "reference_game_files/game/in_game/events/readme.txt:72"
  notes: "Found 2026-07-10 in error.log across ~841 sites in 17 TV event files after the v1.3 reference bump. Most sources were generator Python (hardcoded strings or dict literals in gen_tv_wonder_finalization_events.py, gen_tv_wonder_ownership_events.py, wonder_construction_event_lib.py's KIND_OUTCOMES, philosophy_debate_codegen.py's event_specs/notification_specs, and scripts/unique_wonder_ritual_content/*.py) or data/research_d_events.yaml, plus 6 hand-written event files with no generator (tv_academy_of_sciences_events.txt, tv_engineering_department_events.txt, tv_arts_exhibition_events.txt, tv_govhouse_events.txt, tv_medicine_events.txt, tv_research_events.txt). Fix at the generator/data source, never the generated .txt, then regenerate."

- id: raw_trigger_count_has_no_live_tooltip_value
  pattern: ''
  detectability: advisory
  bad: "Assuming a built-in country trigger (e.g. `num_of_advances_researched >= 50`) will show the player's current progress '(37/50)' in its custom_tooltip. Vanilla's own default tooltip loc for these triggers (see `NUM_ADVANCES_TRIGGER` in triggers_l_english.yml: \"Has $COMPARATOR$ $NUM|V0$ [advances|E] researched\") only substitutes the comparator and threshold — never the live value — and GetVariable-style GUI live-value display only works on country *variables*, not raw engine triggers/counts."
  correction: "To show a live '(current/target)' readout for a raw trigger-only count, mirror it into a country variable via `set_variable = { name = tv_x_mirror value = <trigger_or_count> }` on the same monthly cadence that already checks the trigger (verify the count is usable as a `value =` expression first — e.g. `value = num_of_advances_researched` is confirmed vanilla usage in `reference_game_files/game/in_game/common/script_values/research_values.txt` and `estates/00_default.txt`). Then embed `[Country.MakeScope.GetVariable('tv_x_mirror').GetValue|0]` in the GUI-facing loc key only (e.g. an `_ESTABLISHMENT_STEP1_TEXT` card string), matching the existing `TV_CONQUEST_PROGRESS_DISPLAY`-style pattern. Do NOT also add this GUI `Country.MakeScope` macro to a sibling loc key that is rendered as a `custom_tooltip.text` inside a scripted_trigger — that renders in script-tooltip context (ROOT/THIS scopes), not GUI data-binding context, so the GUI-only accessor is unverified there and should be kept out."
  category: gui
  scope: country
  source: "data/io_establishment.yaml (science progress_mirror), scripts/gen_victory.py mark_basic_requirements_effect + loc generation; reference_game_files/game/in_game/common/script_values/research_values.txt:3; src/main_menu/localization/*/towards_victory_leaderboard_l_*.yml Country.MakeScope.GetVariable(...).GetValue|0] precedent"
  notes: "Discovered while investigating a user report that the Academy of Sciences 'research at least 50 advances' requirement 'seemed unsatisfiable' after the EU5 1.3 patch. First fix attempt added a tv_science_advances_researched_mirror variable (refreshed monthly inside tv_io_establishment_mark_basic_requirements_effect) and appended the live value only to TV_SCIENCE_ESTABLISHMENT_STEP1_TEXT. The player then confirmed in-game that the mirrored value itself never moved — num_of_advances_researched is apparently stuck/broken under this EU5 1.3 build, not just missing a tooltip — so the mirror was reverted (see [[num_of_advances_researched_broken_eu5_1_3]] for the replacement stopgap). The GUI-vs-script-tooltip loc-key split documented above is still valid general guidance for any OTHER numeric establishment route that wants a live readout — conquest/prosperity/trade/diplomatic already track a working `var:tv_x_score` for their basic requirement, so the same live-display pattern could be extended to them the same way if requested."

- id: num_of_advances_researched_broken_eu5_1_3
  pattern: ''
  detectability: advisory
  bad: "Gating a requirement on `num_of_advances_researched >= N` and assuming it will progress normally. As of the EU5 1.3 build tested 2026-07-10, this country trigger appeared stuck/non-updating in an actual playthrough (confirmed via the live tooltip added for TV_SCIENCE_ESTABLISHMENT_STEP1_TEXT — the displayed count never moved despite the player researching advances). Also, there is NO engine on_action that fires when a country finishes researching any advance — confirmed empty against `reference_official_defines/docs/on_actions.log` (no advance/research/tech/innovation entries) and by inspecting a live Steam Workshop mod (reference_mods/3668193813, 'National Destinies'): its DHE (dynamic_historical_event) reactions to specific advances use `monthly_chance = 100` + `trigger = { has_advance = <specific_advance> }` + `fire_only_once = yes` — i.e. the same has_advance-polling idiom, just applied per-known-advance, not a real completion callback."
  correction: "Do not build a from-scratch replacement counter that still reads num_of_advances_researched (e.g. baseline-diffing it) — if the underlying value is genuinely stuck, a diff against it is equally stuck. A reliable self-tracked count of 'any newly researched advance' requires monthly has_advance polling over an explicit candidate advance list (bounded to the country's current age, or the full game's advance list if completeness matters more than cost) — there is no cheaper primitive. Given that real cost, the project's chosen interim fix for the Academy of Sciences science-establishment gate is to waive it entirely (`always = yes` in tv_science_establishment_basic_requirement, see data/io_establishment.yaml basic_requirement_body) until num_of_advances_researched is confirmed fixed upstream, rather than spending the perf budget on a workaround for what looks like a temporary Paradox-side bug. Revert to a real requirement (numeric threshold, or a has_advance-polling counter if still needed) once verified fixed in a later EU5 patch."
  category: scope
  scope: country
  source: "docs/error_log/error.log investigation 2026-07-10 (user-confirmed live tooltip showed no progress); reference_official_defines/docs/on_actions.log (no advance/research/tech hooks); reference_mods/3668193813/in_game/events/nd_aeg.txt (has_advance + dynamic_historical_event polling pattern); data/io_establishment.yaml science basic_requirement_body"
  notes: "Not independently reproduced against Paradox's own changelog/bug tracker — based on this project's single playthrough observation on the tested 1.3 build. If a later patch (1.3.10+ per the wiki) fixes this, remove the always=yes workaround and the explanatory 'temporarily waived' loc text in data/io_establishment.yaml, restore a real numeric threshold, and re-run scripts/gen_victory.py. See [[raw_trigger_count_has_no_live_tooltip_value]] for the reverted live-tooltip mirror attempt that surfaced this."

- id: location_auto_modifier_nonfunctional
  pattern: 'category\s*=\s*location'
  only_in_paths: ['auto_modifiers']
  bad: "auto_modifier with category = location (inside auto_modifiers/ file)"
  correction: "TRY_REPLACE entry in main_menu/common/static_modifiers/ with game_data.category = location"
  category: modifier
  scope: location
  source: "reference_game_files/game/main_menu/common/static_modifiers/"
  notes: "Location auto_modifiers are NON-FUNCTIONAL in EU5; bake effects into static_modifier values instead"

- id: temporary_scope_name_collides_with_permanent_scope
  pattern: ''
  detectability: needs_parser
  bad: "Using `save_temporary_scope_as = <name>` inside a `limit` block (or other trigger context) when the same effect/file also does a real `save_scope_as = <name>` with the identical name for the loop's payload, e.g. `every_in_list = { limit = { save_temporary_scope_as = tv_display_region ... } save_scope_as = tv_display_region ... }`"
  correction: "Give the trigger-context temporary save a distinct name (e.g. `tv_display_region_check`) and keep the real `save_scope_as = tv_display_region` for the effect body outside `limit`. This mod's convention (see `tv_govhouse_refresh_governor_display_effect`) is `<name>_check` for the limit-only temporary."
  category: scope
  scope: any
  source: "src/in_game/common/scripted_effects/tv_govhouse_effects.txt:2295 (tv_govhouse_refresh_governor_display_effect region-init loop); docs/error_log/error.log jomini_eventscope.cpp:676"
  notes: "Engine logs `Trying to add the temporary target '<name>' which has the same name as a permanent target` and the effect/action silently fails at runtime (reproduced by appointing a regional governor). Temporary and permanent scope target names share one namespace per game-object scope; a `save_temporary_scope_as` registered inside a `limit`/trigger context conflicts with a later `save_scope_as` of the same name in the same effect chain, even though `save_temporary_scope_as` is otherwise the mandatory form inside trigger contexts (see EU5_Modding_Knowledge_Base.md 'save_scope_as is an effect only')."

