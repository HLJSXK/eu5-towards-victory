  correction: 'Every variant sharing a base_estate/base_group must exclude the base estate''s available_trigger, and every
    later-id sibling variant''s available_trigger, via variant_condition_lines()/emit_variant_exclusion() in scripts/philosophy_debate_codegen.py.
    Group id order (ascending) is the mutual-exclusion tie-break: lower id wins when two variants'' raw conditions are both
    true. Never rely on tv_academy_debate_pick_unseated_*_group_effect''s random_list weighting to resolve this.'
  category: scope
  scope: country
  source: scripts/philosophy_debate_codegen.py (variant_condition_lines, emit_variant_exclusion, variants_excluding_estate);
    docs/knowledge/risk_cards/philosophy_debate.md rule 4
  notes: 'Found while adding societal-value-driven variants: tv_academy_debate_pick_unseated_*_group_effect puts every group
    whose available_trigger is true into one equal-weight random_list, so a base estate whose available_trigger only checked
    has_estate/not-seated could still be picked over a variant even when the variant''s condition (e.g. societal_value:land_vs_naval
    > 50) was clearly satisfied.'
- id: ritual_content_event_text_dict_letter_key_collides_with_desc
  pattern: ''
  detectability: advisory
  bad: 'In a scripts_engineering_department/unique_wonder_ritual_content/<key>.py module''s per-event localization dict, storing
    option-letter text directly alongside `"t"`/`"d"` keys (e.g. `{"t": ..., "d": ..., "a": ..., "d": "Install the Alms Prefect."}`)
    whenever an event has 4+ options and therefore reaches option letter `"d"`.'
  correction: 'Nest per-event option text under its own `"options"` sub-dict (`{"t": ..., "d": ..., "options": {"a": ...,
    "d": ...}}`) and read `text["options"][letter]` in `build_localization`''s option loop. Never let the `for letter in ("a",...,"e")`
    option loop check `letter in text` directly against the same dict that holds the `"t"`/`"d"` keys.'
  category: localization
  scope: any
  source: scripts_engineering_department/unique_wonder_ritual_content/st_peters_basilica.py build_localization; error.log
    pdx_localize.cpp:221 duplicate key tv_engineering_department.1678/1679/1680/1681.d, 2026-07-10
  notes: Python dict literals silently keep only the last `"d"` key, so the event's real long-form description (e.g. ASSIGNMENT_EVENT_ID's
    5-role summary) was discarded entirely and replaced by the 4th option's text ("Install the Alms Prefect.") before it ever
    reached the generator. Separately, the option loop's `if letter in text` matched the dict's own `"d"` desc key even on
    events with fewer than 4 real options (OPENING/SCANDAL/REWARD), re-emitting the description a second time under the `.d`
    key and producing the exact 'Duplicate localization key ... defined in both X and X' engine warning. bank_of_saint_george.py
    and dome_of_the_rock.py were unaffected because their option loops only check `("a","b","c")` and never reach letter `"d"`.
