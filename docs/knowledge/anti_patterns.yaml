    / tv_wonder_survey_scale_tier on that location for the wonder's id.
  correction: 'tv_wonder_surveyed is a shared gate used in three places: (1) this init effect''s own re-run guard (it fires
    on both on_game_start and on_game_load, so it must skip re-registering the priority candidate once done), (2) tv_wonder_mechanics_copy_completed_survey_from_location_effect''s
    guard for restoring saved competence into the country''s active project, and (3) tv_wonder_selected_survey_already_cached_trigger,
    which tv_wonder_mechanics_start_survey_effect checks to decide whether reassigning the survey site to this location should
    restore cached values or start a fresh survey from 0. Because the existing-wonder priority-resume path (tv_wonder_prepare_priority_project_effect)
    never runs a real survey, tv_wonder_surveyed for that wonder id is never set by the normal survey-completion effect (tv_wonder_mechanics_complete_survey_effect,
    gated on tv_wonder_survey_active which the resume path never sets) -- so reassigning the survey site to that location
    always takes the ''fresh survey'' branch and resets competence to 0/0/0, even though the resume-proposal fallback in tv_wonder_prepare_priority_project_effect
    had shown 85/85/85 (100 fixed-tier scale seed after this fix) moments earlier. Fix: seed tv_wonder_surveyed=1 plus the
    four competence/tier maps (scale=100, logistics=85, organization=85, scale_tier=6) for that wonder id, in the SAME already-not-yet-surveyed
    guarded block that calls append_register_existing_unique_priority_candidate (append_existing_unique_wonders_initialization_effect
    in gen_tv_engineering_department_wonder_mechanics_effects.py). Seeding it there, atomically with the one-time candidate
    registration, satisfies all three consumers at once: registration only ever happens once (across every future game_load),
    and both the priority-resume copy and the reassign-survey-site cached branch find real saved data instead of falling through
    to a country-scope default or a from-scratch survey.'
  category: scripted_effects
  scope: wonders
  source: scripts_engineering_department/in_game/common/scripted_effects/gen_tv_engineering_department_wonder_mechanics_effects.py:append_existing_unique_wonders_initialization_effect
    (writes into generate_location_display_effects() -> src_engineering_department/in_game/common/scripted_effects/tv_wonder_location_display_effects.txt,
    NOT the file's own OUT_FILE/generate()); tv_wonder_survey_effects.txt:11146-11166 tv_wonder_mechanics_start_survey_effect;
    tv_engineering_department_wonder_mechanics_triggers.txt:30658 tv_wonder_selected_survey_already_cached_trigger
  notes: User recalled the original design intent was to seed the location as 'already surveyed' at game start, but it was
    never implemented; the reason turned out not to be a genuine architectural conflict (the same tv_wonder_surveyed map's
    three consumers are all compatible once seeded atomically with registration), just a missed step in the original generator.
    Also a reminder that gen_tv_engineering_department_wonder_mechanics_effects.py holds multiple independent generate_*()
    entry points (generate(), generate_proposal_effects(), generate_survey_effects(), generate_ritual_effects(), generate_location_display_effects())
    feeding DIFFERENT output files via separate thin wrapper scripts (gen_tv_wonder_proposal_effects.py, gen_tv_wonder_survey_effects.py,
    gen_tv_wonder_ritual_effects.py, gen_tv_wonder_location_display_effects.py) -- editing a function in this file and regenerating
    via its own OUT_FILE/main() can produce a byte-identical no-op diff if that function is only reachable from a sibling
    generate_*() used by a different wrapper script; always trace which generate_*() a target function feeds before assuming
    `python gen_<file>.py` regenerates it.
- id: wonder_fixed_modifier_thousand_scaled_value
  pattern: ''
  detectability: lint
  validator: wonder_engine_scaled_fixed_modifiers
  only_in_paths:
  - wonder
  bad: Setting fixed-value wonder modifiers such as global_pop_conversion_speed, local_pop_assimilation_speed, local_manpower,
    or local_sailors above 0.5
  correction: Keep these fixed-value entries at or below 0.5. If a percentage bonus was intended, use the matching *_modifier
    percent modifier instead.
  category: modifier
  scope: wonder
  source: User-reported EU5 engine behavior, 2026-06-13; modifier ids verified in reference_game_files/game/main_menu/common/modifier_type_definitions/00_modifier_types.txt:4553-4564,
    4609-4619, 5080-5092
  notes: EU5 multiplies these fixed-value modifier values by 1000 in game. scripts/validate.py checks wonder paths in src/
    and data/ for direct YAML/script assignments to global_pop_assimilation_speed, global_pop_conversion_speed, local_pop_assimilation_speed,
    local_pop_conversion_speed, local_manpower, and local_sailors; percent *_modifier variants are intentionally excluded.
- id: wonder_ritual_choice_branch_retry_reward_template_trap
  pattern: ''
  detectability: advisory
  bad: Writing a new unique-wonder ritual whose narrative shape is 'choice -> deterministic branch marking a fixed subset
    of tracked entities at risk -> one retry/incident event offering pay-a-cost-to-fully-resolve vs. accept-narrower-for-free
    -> threshold-scaled reward', even after removing `random_list` dice and renaming every variable
  correction: Design each wonder's state representation, time structure, and decision shape independently from its own `data/unique_wonder_ritual_specs.yaml`
    design_ir/mechanic_signature, not from a template shared with sibling wonders. When authoring more than one wonder ritual
    in the same batch, assign each to an isolated agent/context with no visibility into sibling implementations or into scripts_engineering_department/unique_wonder_ritual_content/_entity_ritual.py,
    so the natural 'copy the pattern already in this file' shortcut is unavailable. Run scripts_engineering_department/audit_unique_wonder_ritual_mechanic_similarity.py
    after the batch and treat any pair scoring combined_ratio >= 0.15 as a real finding to investigate, not just a number
    to beat.
  category: workflow
  scope: any
  source: docs/knowledge/risk_cards/wonders.md rules 12-13; scripts_engineering_department/audit_unique_wonder_ritual_mechanic_similarity.py
  notes: 'Confirmed twice on the same 3-4 wonders: first when Alhambra/Dome of the Rock/Bank of Saint George/St. Peter''s
    Basilica all routed through the shared _entity_ritual.py dice engine (combined_ratio up to ~0.7+), then again 2026-07
    when Dome/Bank/St Peter''s each got an independent bespoke rewrite that removed the dice but still converged on the same
    higher-level template (combined_ratio 0.48-0.71). Resolved 2026-07 by a second rewrite of all four wonders (including
    Alhambra, whose dice-driven _entity_ritual usage was itself a second instance of template reuse), each authored by an
    isolated subagent with no visibility into siblings: effects-file combined_ratio among Dome/Bank/St Peter''s dropped to
    0.18-0.32.'
- id: wonder_ritual_cleanup_stale_after_entity_ritual_rename
  pattern: ''
  detectability: advisory
  bad: Trusting a generated wonder ritual/mechanics file at face value after `scripts_engineering_department/unique_wonder_ritual_content/<key>.py`
    row-set or variable-naming conventions change, instead of re-running every generator registered against it
  correction: When error.log reports `Variable 'tv_wonder_<unique_key>_<...>_status' is used but is never set` (or a matching
    `_favorable_count`/`_narrowed`/`_started`/`_completed`/`_ritual_phase`/`_ritual_row_set_index` variant) for one of the
    bespoke unique wonders (Dome of the Rock, Bank of Saint George, St. Peter's Basilica), diff the flagged names against
    the wonder's own content module (`entity_status_var`/`favorable_count_var`/`narrowed_var`/`_stage_var` in `scripts_engineering_department/unique_wonder_ritual_content/_entity_ritual.py`
    and `<key>.py`) before assuming a runtime bug. Re-run `gen_tv_wonder_ritual_effects.py` (owns `tv_wonder_ritual_effects.txt`,
    `data/generated_files.yaml`); it regenerates `tv_wonder_mechanics_clear_selected_ritual_runtime_effect` from each wonder's
    live `runtime_variables` list in `data/unique_wonders.yaml` and drops any stale entries left over from a prior naming
    convention. Do not hand-patch the generated file.
  category: workflow
  scope: any
  source: 'runtime error.log, 2026-07-09: jomini_effect.cpp reported tv_wonder_dome_of_the_rock_custody_duties_*, tv_wonder_dome_of_the_rock_sanctuary_access_groups_*,
    tv_wonder_dome_of_the_rock_ritual_row_set_index/ritual_phase, and the matching st_peters_basilica/bank_of_saint_george
    variants as used but never set'
  notes: Dome of the Rock, Bank of Saint George, and St. Peter's Basilica were reworked 2026-07 from the shared `_entity_ritual`
    row-set naming (`sanctuary_access_groups`, `custody_duties`, `sacred_official_candidates`, `apostolic_service_duties`,
    `charter_options`, `public_credit_pledges`, plus `ritual_row_set_index`/`ritual_phase`) to bespoke short-form naming (`access`,
    `duty`, `role`, `assigned_role`, `ritual_stage`), and `data/unique_wonders.yaml`'s `ritual.runtime_variables` lists were
    updated to match — but `src/in_game/common/scripted_effects/tv_wonder_ritual_effects.txt` (generated by `gen_tv_wonder_ritual_effects.py`)
    had not been regenerated since, so its `tv_wonder_mechanics_clear_selected_ritual_runtime_effect` cleanup effect still
    emitted `remove_variable` calls for the old long-form names. Those names are never set (false 'used but never set' warnings)
    and, worse, the *real* current-name status/favorable_count/narrowed/started/completed/ritual_stage variables were never
    cleaned up on ritual reset, leaking state across a ritual restart. Fixed by re-running the generator with no data changes;
    always re-run generators after editing a content module's naming helpers even when no runtime error has been observed
    yet.
