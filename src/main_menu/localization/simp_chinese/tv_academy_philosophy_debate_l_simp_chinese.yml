 STATIC_MODIFIER_DESC_tv_academy_debate_scandal_sheet_crackdown: "惩罚印刷商会把丑闻变成警示并恢复可见秩序，却也让旁观者明白出版自由止步于宫廷难堪。"
 STATIC_MODIFIER_DESC_tv_academy_debate_sealed_cargo_order: "封存货物可以防止混乱和谣言，却也让发现继续停留在抽象层面，并由官员独占解释权。由于公众被剥夺了最直接的证据，辩论的势头会减弱。"
 STATIC_MODIFIER_DESC_tv_academy_debate_service_rolls: "将严格服役计入考量，会把才能的范围从课堂考试扩展到可验证的军旅履历，而不只是诉诸同情。职业军人会支持此举，因为长期服役终于成为可读的资格，而不只是旧日功劳。"
 STATIC_MODIFIER_DESC_tv_academy_debate_simplified_tariffs: "简化关税会让全球贸易不再只是偶然的特权，而成为可读的制度。商人能够围绕清晰规则制定计划，因此改革会加强接受倾向，尽管旧有海关租利会被削弱。"
 STATIC_MODIFIER_DESC_tv_academy_debate_standard_military_contracts: "标准化生产把制造工场同国家能力连接起来：武器、制服和补给之所以可靠，是因为作坊能够反复执行同一规格。职业军队支持这种改革，因为战场上的可预期性极其重要。"
 STATIC_MODIFIER_DESC_tv_academy_debate_standard_weights: "统一度量衡会让远方市场变得可比较、可执行，使全球贸易显得是一套法定制度，而不是一串地方把戏。官僚和商人都会获得可用的计量语言。"
 STATIC_MODIFIER_DESC_tv_academy_debate_subject_catalogue: "按学科编目的做法会悄然使比较与分类的文艺复兴习惯正常化，给学者们一个温和但稳定的支持理由。"
 STATIC_MODIFIER_DESC_tv_academy_debate_textbook_review: "再审查一季能安抚谨慎教师和保守赞助者，却把印刷术统一知识的能力当成需要拖延的风险。"
 STATIC_MODIFIER_DESC_tv_academy_debate_trade_embassy_reception: "公开接待使团，是把全球贸易视为一种通过契约和使节共同进行的外交。进度提升有限，因为更深接触既带来机会，也会把敌手影响引入辩论。"
 STATIC_MODIFIER_DESC_tv_academy_debate_visible_port_closure: "限制外国船只，会通过缩窄贸易流动来展示安全感。辩论因此后退，因为外国交换被当成问题本身，哪怕民众会看到港口正在果断行动。"
 STATIC_MODIFIER_DESC_tv_academy_debate_waterwheel_disruption: "兴建水力工场证明制造工场不只是集中工人，还能调动自然之力。论点会大幅推进，但附近社区必须承受水渠、水权和日常节奏被改动的扰动。"
