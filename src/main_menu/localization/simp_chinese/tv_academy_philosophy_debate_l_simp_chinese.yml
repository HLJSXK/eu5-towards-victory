 STATIC_MODIFIER_DESC_tv_academy_debate_royal_observatory: "资助一座常设天文台，会给新方法一个能够长期观察、比对，并一夜又一夜地回到同一问题的制度场所。花费不小，但持久的观察，会有力地推动接受当前议题。"
