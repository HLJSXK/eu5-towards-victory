l_simp_chinese:
 STATIC_MODIFIER_DESC_tv_academy_debate_artisan_demonstrations: "接纳工匠的证据，会把求真的范围扩展到古典学问之外，也向会场表明：经受检验的实践，能够修正书本上的理论——而这样的修正，只要被允许过一次，便会一再出现。"
 STATIC_MODIFIER_DESC_tv_academy_debate_avoided_foreign_claim_crisis: "避免挑衅，让谨慎来定义政策。宫廷拒绝卷入遥远的争端，国内稳定得以保全；但辩论也明显后退，不再把发现视为值得争夺之事。"
 STATIC_MODIFIER_DESC_tv_academy_debate_battered_chart: "信任这张海图，等于让航海实践的证据正面挑战承袭下来的地理知识。辩论会强烈转向接受，因为海商终于能指着一条真能航行的航路，而不再是就着麦酒交换的传闻。"
 STATIC_MODIFIER_DESC_tv_academy_debate_bespoke_supply_networks: "保留定制供应，护住了旧承包商和地方做法，却让制造工场显得不那么必要，生产仍是一张人情与临场调整的网，而非可重复规格的体系。"
 STATIC_MODIFIER_DESC_tv_academy_debate_bills_of_exchange: "认可汇票，会让银行改革不只是账本上的整洁，而是真正对贸易有用，使海商有了切身的理由去支持新制度。"
 STATIC_MODIFIER_DESC_tv_academy_debate_broadsides_watch: "搜捕作者能安抚官员、缓解街头的压力，却把匿名印刷品塑造成威胁，而非辩论扩大的迹象。"
 STATIC_MODIFIER_DESC_tv_academy_debate_cabinet_of_curiosities: "将这份叙述当作奇闻，是把陌生证词放进陈列柜、而非放进论证，从而保住旧地理。活生生的知识被当成装饰，辩论因此明显退回保守立场。"
 STATIC_MODIFIER_DESC_tv_academy_debate_capital_certification: "要求首都认证，让地方训练继续服从中央。中央官僚为此赞成，因为才能仍须经过熟悉的机关、印信与宫廷标准的筛检。"
 STATIC_MODIFIER_DESC_tv_academy_debate_catechism_lessons: "印行教理问答，就把宗派教义化作能在每间教室、每座讲坛反复传授的课业，推动接受向前；只是那些不满具体措辞的教士，也被一并激怒。"
 STATIC_MODIFIER_DESC_tv_academy_debate_central_print_office: "集中管理印刷事务能满足那些希望每台印刷机都向上负责的官员，却剥夺了大学一次展示学术自理的机会。"
 STATIC_MODIFIER_DESC_tv_academy_debate_ceremonial_patronage: "把赞助留作礼仪，省下国库开支，也让艺术继续从属于宫廷排场；但这样一来，更新只能仰仗私人偶然，而非公共承诺。"
 STATIC_MODIFIER_DESC_tv_academy_debate_child_labor_rules: "劳动规则让制造工场的论点继续成立，同时承认生产无法与道德监督分离；教士与农民部分赞同，因为改革如今带着限制，而不只是一味扩张。"
 STATIC_MODIFIER_DESC_tv_academy_debate_civil_posts_separate: "保持文职任命独立，维护了官僚体系的主张：职位当由文书、学业与宫廷程序决定。它宣告一种已被证明的效力无关紧要，从而拖慢任人唯才的推进。"
 STATIC_MODIFIER_DESC_tv_academy_debate_civil_press_boundary: "让印刷机只管民政事务，能让保守的军官相信营房纪律不会被印刷单页改写，却也否认了印刷术一个真正有用的技术角色。"
 STATIC_MODIFIER_DESC_tv_academy_debate_clergy_marriage_jurisdiction: "把婚姻留在现有教会法庭，护住了一项旧管辖权，也赢得教士的支持；可这也让宗派国家失去一个能直插家庭内部的有力制度。"
 STATIC_MODIFIER_DESC_tv_academy_debate_clerical_discipline: "支持纪律，让信纲不再只是教士阶层的私产，而成为连教士也须遵守的规矩，强力推动接受；却也激怒了那些恋着团体特权的教士。"
 STATIC_MODIFIER_DESC_tv_academy_debate_clock_discipline: "接受钟表纪律，会让制造工场成为以计时劳动为核心的新秩序，而不只是更大的工具房，进度因此陡升；代价是农民与工人不满被铃声支配。"
 STATIC_MODIFIER_DESC_tv_academy_debate_closed_royal_accounts: "继续封存账目，能保护宫廷的运作，也让官僚不必公开为每一个数字辩护；但这会让银行改革显得像一条只加诸臣民、王权自身却悄悄豁免的纪律。"
 STATIC_MODIFIER_DESC_tv_academy_debate_commission_review: "承认战场功绩，为改革带来一批军中支持者，并说明能力不只见于纸面，也能在压力下证明。职业军人因此有了支持这场辩论的理由。"
 STATIC_MODIFIER_DESC_tv_academy_debate_common_army_oath: "共同誓词把信纲化作共享的军中纪律，让新秩序不再只停在讲坛与宫廷文辞里，而有了实打实的约束力。"
 STATIC_MODIFIER_DESC_tv_academy_debate_consensus_delay: "延后等待共识，能在彼此较劲的教士读者之间维持和平；可每多修一轮，就削去几分\"这项定制已可接受\"的说服力。"
 STATIC_MODIFIER_DESC_tv_academy_debate_corrected_charts: "接受修正，让新世界辩论成为一桩制度性的修订，而不只是旅行者的一面之词。学术权威转向那些能够改写承袭知识的证据。"
 STATIC_MODIFIER_DESC_tv_academy_debate_court_masque: "资助假面剧，等于把文艺复兴式新生装扮成公开的宫廷仪式，借盛典与声望略微推动接受，代价是国库要实打实地出一笔钱。"
 STATIC_MODIFIER_DESC_tv_academy_debate_court_order_preserved: "遥致嘉奖，让宫廷得以赞美才能，却不必让它动摇一桩任命。秩序保住了，但辩论也记下：人才仍可被客客气气地挡在门外那头。"
 STATIC_MODIFIER_DESC_tv_academy_debate_court_style_uniformity: "要求宫廷文体，让标准保持统一，也让中央官员更安心，却让修辞教养在能力得以平白开口之前，就先筛去了人。"
 STATIC_MODIFIER_DESC_tv_academy_debate_crown_discovery_lock: "将发现权锁在王权之下，维护了正统性与中央控制，却也让每一次远航都得等待谨慎的官方节奏。热切的资助者被保持在一臂之外，辩论的势头因此减弱。"
 STATIC_MODIFIER_DESC_tv_academy_debate_customs_house_routine: "否掉这场试验，海关体系照旧可预期，也护住了那些叫得出每道关卡名字的官员。可它把全球贸易描画成需要围堵的危险，而非需要治理的流动。"
 STATIC_MODIFIER_DESC_tv_academy_debate_established_routes: "守着旧航线，是在敬重那些信赖祖传航海术的船长。可这也让辩论把风向知识当成一桩奇谈，而非一套足以承载全球交换的体系。"
 STATIC_MODIFIER_DESC_tv_academy_debate_experiment_code: "采纳这套守则，会把实验的可信度变成一种共同的制度，而不再是个人荣誉的问题。文书负担压在每个人身上，但只要见证者能把一次试验的记录与另一次并排比对，接受新方法也就更容易了。"
 STATIC_MODIFIER_DESC_tv_academy_debate_familiar_accounts: "保留旧式账目能让熟悉旧格式的文书和官署省心，却也让含混继续披着体面的外衣，拖慢会场对银行制度纪律的接受。"
 STATIC_MODIFIER_DESC_tv_academy_debate_funded_trade_escorts: "出资护航，把全球贸易变成王室背书的战略事业，而非私人的赌博。远方商业被明明白白地护住，接受度陡升，只是国库呻吟，海商也就此陷得更深。"
 STATIC_MODIFIER_DESC_tv_academy_debate_globe_lessons: "公共教学通过稳定的授课、而非奇观或危机来传播新世界论点。进展幅度不大，但当学生把新地理当作平常知识来学，公众舆论便渐渐倾向接受。"
 STATIC_MODIFIER_DESC_tv_academy_debate_gold_rumor_speculation: "用黄金传闻筹资，是承认一种道德上可疑的动机，同时让探索继续前行。私人欲望被引入航行事业，辩论因此小幅转向接受；但副作用也标记了这笔交易背后的投机风险。"
 STATIC_MODIFIER_DESC_tv_academy_debate_guild_apprenticeship_preserved: "保留行会学徒制，保住了技能、庇护与城市身份的旧阶梯；辩论因此明确转向反对制造工场，因为训练仍被系在最受工场纪律威胁的旧制度上。"
 STATIC_MODIFIER_DESC_tv_academy_debate_harbor_exhibition: "公开展示把遥远的发现变成普通旁观者也能触摸的证据。这份好奇广而不深，进展因此只是小幅，但公众舆论已开始倾向接受。"
 STATIC_MODIFIER_DESC_tv_academy_debate_icon_local_truce: "不下裁决，能保住围着这幅圣像的地方平静；可虔敬始终没个界定，建立有纪律宗派秩序的论证，也就软了。"
 STATIC_MODIFIER_DESC_tv_academy_debate_informal_army_credit: "再借一笔私下款项，能把钱送到士兵手里，又不必承认旧的财政渠道已经失灵；代价是国家重新依赖那些靠改革半途而废获利的私人债主。"
 STATIC_MODIFIER_DESC_tv_academy_debate_laboratory_safety_rules: "改进安全，会把事故解释为程序的失败，而非实验本身的失败，因此推进的势头得以保住——代价是实实在在的开销，也让日后每一场演示都多添了几分谨慎。"
 STATIC_MODIFIER_DESC_tv_academy_debate_liability_restraint: "拒绝新式责任，会安抚保守的法学者，让他们相信责任仍应系在看得见的个人与旧契约之上；但这会削弱银行作为一种有组织的信任的论证。"
 STATIC_MODIFIER_DESC_tv_academy_debate_licensed_wit: "任讽刺流传，会给改革者一种反对陈腐权威的通俗语言；但推进有限，因为讥讽说服了一些人，也让另一些人更加固执。"
 STATIC_MODIFIER_DESC_tv_academy_debate_limited_exam_scandal: "只作废最坏的几份，把丑闻压在可控之内，也保住了在任的考官，行政秩序得以维持——却也悄悄暗示：只要藏得够好，舞弊便可容忍。"
 STATIC_MODIFIER_DESC_tv_academy_debate_local_contract_forms: "各市场自说其言，保住了每座港口熟悉的权威。可这也让远距离交换任由误译摆布，把整个议题死死按在地方的层面上。"
 STATIC_MODIFIER_DESC_tv_academy_debate_local_language_access: "允许地方语言作答，把能力与宫廷修饰分开，使省份人才可按行政本领而非口音受评。地方社群因此相信，晋身之门并非只为首都的做派而开。"
 STATIC_MODIFIER_DESC_tv_academy_debate_local_measures_preserved: "各镇自守其秤，护住了各地市场的惯例，也让每个城镇把熟悉的欺诈藏在熟悉的名号下。这大大削弱了接受，因为没有共通的度量，全球贸易根本无从铺展。"
 STATIC_MODIFIER_DESC_tv_academy_debate_local_order_preserved: "把请愿交还地方，维护了行政秩序，却也把寒门才智是否有资格被听见，交由地方的等级来裁定。"
 STATIC_MODIFIER_DESC_tv_academy_debate_local_pulpits: "保留地方惯例，各堂区便安心：熟悉的声音不会被噤声；可教义也因此参差不齐，难以有力地推动接受。"
 STATIC_MODIFIER_DESC_tv_academy_debate_manufactory_fire_codes: "监管承认大型作坊带来新风险，却把风险当作治理制造工场的理由，而非放弃它们的理由；金币用于检查、防火隔离与更安全的储料。"
 STATIC_MODIFIER_DESC_tv_academy_debate_maritime_insurance_pool: "把海运保险载入记录，会将全球贸易从鲁莽的赌注变成有章可循的共同分险，让每一个惧怕一夜破产的人都更容易点头。"
 STATIC_MODIFIER_DESC_tv_academy_debate_measured_ruins: "把丈量数字印行，等于让古代的物证反过来规范当下技艺，借工艺、比例，以及艺术家与学者的合作，来巩固接受。"
 STATIC_MODIFIER_DESC_tv_academy_debate_measurement_standard: "统一的度量，会让各省的观察结果彼此可比，为科学革命提供一套共享证据的实际基础设施。这份大幅的进展，来自把分散的实验化为一种共同的语言——代价则以银钱支付。"
 STATIC_MODIFIER_DESC_tv_academy_debate_merchant_capital_pool: "使资本池合法化，给制造工场配上足以匹配其物质野心的金融身体，接纳因此大幅推进：规模化从此可投资，有银行头脑的市民也看见了从账本通向工场的路。"
 STATIC_MODIFIER_DESC_tv_academy_debate_mission_priority: "传教优先，会在学院把新土地当作经验问题来看待之前，先把发现收窄成一桩神职差事。神职人员对此认可，但测绘、贸易与证词都被迫跪在皈依之后，接受进程因此放缓。"
 STATIC_MODIFIER_DESC_tv_academy_debate_named_method: "接受这个名字，会把分散的做法变成一个可以辨认的纲领，使接纳更易于组织，也更易于辩护。可同样的这份清晰，也帮着反对者，把自己重新聚拢起来对抗它。"
 STATIC_MODIFIER_DESC_tv_academy_debate_observation_tables: "相信这份耐心的记录表，会给辩论一个可复现的立足点：议题不再依赖某个耀眼的单一主张，而是依靠任何谨慎学者都能亲自核对的证据，这份记录也会随时间悄悄赢得信誉。"
 STATIC_MODIFIER_DESC_tv_academy_debate_observational_collections: "建造这座陈列柜，会把观察变成一种持久的制度习惯，只是它推动接受的力道，不及一项证明、一次预测或一场公开实验那样迅猛。"
 STATIC_MODIFIER_DESC_tv_academy_debate_old_customs_controls: "一把火烧了它，旧海关秩序得以保全，也不让走私者在道理上占先。可这同样烧掉了一份证据：合法商路，早已不如那些非法商路来得合理。"
 STATIC_MODIFIER_DESC_tv_academy_debate_open_chair_competition: "开放教席，把任人唯才施于学院自身，证明它愿在规劝国家之前先考核自己的职位。学者因此获得支持，因为他们的前途不再只系于赞助人的一念之善。"
 STATIC_MODIFIER_DESC_tv_academy_debate_orderly_bankruptcy: "合法破产把失败视作一桩可管理的金融事件，而非一场道德崩塌，从而强化银行制度需要可预期规则的主张；保守的道德权威会反对，因为羞辱失去了一部分惩戒的锋芒。"
 STATIC_MODIFIER_DESC_tv_academy_debate_orderly_proceedings: "驱逐诗人，程序的严肃性保住了，却抽干了辩论的公共活力；维护有序议事的官僚因此更为得势，议题也退回受控的房间之中。"
 STATIC_MODIFIER_DESC_tv_academy_debate_patron_rights_confirmed: "确认赞助人权利，安抚了那些资助并庇护学院职位的人，却也让学术继续拴在继承而来的恩惠上，而非公开的比较。"
 STATIC_MODIFIER_DESC_tv_academy_debate_patronage_buried: "掩埋这场调查，护住了庇护者免于丑闻，也让贵族家族继续把考试当作又一条影响力的渠道。辩论因此倒退，因为所谓才能被允许披上借来的笔迹。"
 STATIC_MODIFIER_DESC_tv_academy_debate_plain_contract_forms: "明白的文句，让那些平日只在蝇头小字里碰见金融的人，也看得见银行改革；公众舆论因此转暖，因为改革如今护的不只是账面，还有看懂的权利。"
 STATIC_MODIFIER_DESC_tv_academy_debate_pooled_risk_fund: "承认共同分担风险，会让银行改革显得具有社会用途，而不只是牟利手段；市民为此欣慰，因为他们的金融制度被视作公共保障，而非精巧的投机。"
 STATIC_MODIFIER_DESC_tv_academy_debate_port_credit_shock: "任投资者退场，让这些破船成为对整项事业的判决。贸易信心下跌，发现事业显得财务脆弱，辩论因此明显转向拒绝。"
 STATIC_MODIFIER_DESC_tv_academy_debate_prediction_expectations: "宣扬这次预测，会给新方法一场人人可见的胜利：它不只解释了过去，还预先说中了未来，并在众目睽睽之下得到应验——从此民众也会期待它再来一次。"
 STATIC_MODIFIER_DESC_tv_academy_debate_printed_law_standardization: "标准化的印刷法令证明印刷机能以速度和一致性服务王室行政，接受印刷应用也就有了强有力的制度论据。"
 STATIC_MODIFIER_DESC_tv_academy_debate_private_lecture_strain: "开小课确实能让首席科学家很快说服几个关键人物，可这份额外功夫，压的是学院最要紧的那位倡导者。"
 STATIC_MODIFIER_DESC_tv_academy_debate_private_pilot_interrogation: "私下盘问让官员继续能用得上领航员，却不给辩论一位公开的见证人。宫廷的谨慎减缓了接受进程，却始终没把这段经历说成假的。"
 STATIC_MODIFIER_DESC_tv_academy_debate_private_rankings: "保持排名私密，让宫廷机构得以在门后处理尴尬与人情。官僚的裁量之权得以保全，但任人唯才能在光天化日下站住脚的主张，也随之削弱。"
 STATIC_MODIFIER_DESC_tv_academy_debate_private_trials: "保持试验私密，能守住谨慎，也防止一次看得见的失误羞辱学院，却也剥夺了科学革命支持者一直盼望的那份公共证明。"
 STATIC_MODIFIER_DESC_tv_academy_debate_provincial_disruption: "把这名外省候选人召入宫廷，任人唯才便从理论变成一道看得见的阶梯。地方精英反感这份扰动，因为人才如今能径直越过他们的庇护往上走。"
 STATIC_MODIFIER_DESC_tv_academy_debate_provincial_training: "承认这所学校，等于承认行政才能可在首都的礼法与庇护圈之外培养。地方自治因此更有信心，因为地方机构被视为人才的来源。"
 STATIC_MODIFIER_DESC_tv_academy_debate_quarantine_precautions: "资助防疫，是承认医生的警告，却不让恐惧决定整个议题。发现被塑造成可管理、可规制的风险，而非鲁莽的欲望，辩论因此小幅转向接受。"
 STATIC_MODIFIER_DESC_tv_academy_debate_quarantine_reform: "训练检疫官，是在主张全球贸易可以在不关港的前提下更安全。一个实际的反对理由就此消失，接受度小幅上升，而细看货物的能力则要国库付账。"
 STATIC_MODIFIER_DESC_tv_academy_debate_quiet_courtyards: "禁止集会，业余论辩就不会闹成街头争吵，秩序保住了，可接受新主张的势头也跟着弱了下去。"
 STATIC_MODIFIER_DESC_tv_academy_debate_rankings_suspended: "暂停排名，把一场公开的胜利送给大族，也稳住了他们的配合，却让门第强大到足以叫停证据。"
 STATIC_MODIFIER_DESC_tv_academy_debate_reformed_colonial_charters: "改革特许制度，承认了滥用，却主张发现事业可以被治理，而非抛弃。规制挽救了原则，接受度因此小幅上升；但市民阶层会失去一部分经营远方事业的自由。"
 STATIC_MODIFIER_DESC_tv_academy_debate_restricted_correspondence: "限制交流，会让重视安全的官员把科学书信说成泄密，而非证据。这会强力推动拒斥方向，因为公开探究开始显得像是外交上的鲁莽；而留下的那些渠道，也变得更加戒备森严。"
 STATIC_MODIFIER_DESC_tv_academy_debate_royal_absolutist_court_faction_modifier: "该阶层因王室在哲学辩论中公开抬举其代表而更加满意，也拥有更高影响力。"
 STATIC_MODIFIER_DESC_tv_academy_debate_royal_account_published: "公布账目，意味着王权以身示范它要求他人接受的那份财政纪律；改革因此大有斩获，但每一个暴露出来的弱点都会变成政治论据，正当性也随之冒险。"
