 tv_academy_debate.115.t: "跟墙头草的私下交易"
 tv_academy_debate.116.a: "圆桌记下这一笔。"
 tv_academy_debate.116.d: "这个月的政策和公众行动，都替当前议题攒了几分说服力。辩论的风向，正慢慢往接纳那头吹。"
 tv_academy_debate.116.t: "辩论渐占上风"
 tv_academy_debate.117.a: "圆桌记下这一笔。"
 tv_academy_debate.117.d: "这个月的政策和公众行动，反倒削弱了当前议题的说服力。辩论的风向，正慢慢往排斥那头吹。"
 tv_academy_debate.117.t: "辩论渐落下风"
 tv_academy_debate.118.a: "派我们的代表入席。"
 tv_academy_debate.118.d: "各国的科学院，都围着同一个哲学议题坐了下来。我们的科学院也会派人上场，看这场争论最后落在哪一边。"
 tv_academy_debate.118.t: "世界辩论开场"
 tv_academy_debate.119.a: "记下这个结论。"
 tv_academy_debate.119.d: "世界辩论有了结论：这个议题，被接纳了。我们的科学院就此推进哲学序列，让相关思潮在国内扎下根。"
 tv_academy_debate.119.t: "世界辩论，接纳了"
 tv_academy_debate.120.a: "记下这个结论。"
 tv_academy_debate.120.d: "世界辩论有了结论：这个议题，被否了。我们的科学院就此收起这个议题，继续往哲学序列的下一步走。"
 tv_academy_debate.120.t: "世界辩论，否了"
 tv_academy_debate.121.a: "把档案封起来。"
 tv_academy_debate.121.d: "世界辩论没能吵出个结果。我们的科学院把这个议题归了档，继续往哲学序列的下一步走。"
 tv_academy_debate.121.t: "世界辩论，不了了之"
 tv_academy_debate.122.a: "记下这次转向。"
 tv_academy_debate.122.d: "这个月的政局和民情，悄悄挪动了圆桌上几张椅子。至少有一个辩论席，已经转而支持当前议题了。"
 tv_academy_debate.122.t: "有人倒向了支持"
 tv_academy_debate.123.a: "记下这次转向。"
 tv_academy_debate.123.d: "这个月的政局和民情，悄悄挪动了圆桌上几张椅子。至少有一个辩论席，已经转而反对当前议题了。"
 tv_academy_debate.123.t: "有人倒向了反对"
 tv_academy_debate.124.a: "记下这次转向。"
 tv_academy_debate.124.d: "这个月的政局和民情，悄悄挪动了圆桌上几张椅子。至少有一个辩论席，已经不再明确支持或反对当前议题了。"
 tv_academy_debate.124.t: "有人不表态了"
 tv_academy_debate.125.a: "记下这次空缺。"
 tv_academy_debate.125.d: "圆桌上一位特殊的常客，已经没法再来了。这个月的清点，把对应的辩论席空了出来。"
 tv_academy_debate.125.t: "一个席位空了下来"
 tv_academy_debate.2000.a: "书记员把摘要发到每一排座位上。"
 tv_academy_debate.2000.b: "趁没人能拿它当把柄，先把最扎眼的句子删掉。"
 tv_academy_debate.2000.d: "三天唇枪舌剑之后，主席把满室争执压成一份连后排的人也看得懂的简报。有人说这叫条理清楚，也有人说，这不过是一份字写得特别工整的陷阱。\n\n#Y 本事件出现是因为一场本地辩论正在进行，且适用于任何辩论议题。#!"
 tv_academy_debate.2000.t: "主席的摘要"
 tv_academy_debate.2001.a: "引座员招手，放人群从大门涌进来。"
 tv_academy_debate.2001.b: "肃静！再吵下去旁听席要闹起来了。"
 tv_academy_debate.2001.d: "旁听席挤满了学生、书记员、闲得没事干的贵族，还有几个耳朵好得可疑的市民。谁说了句硬话，传得都比自己想的远——流言从来不用讲证据，学问却处处都要。\n\n#Y 本事件出现是因为一场本地辩论正在进行，且适用于任何辩论议题。#!"
 tv_academy_debate.2001.t: "拥挤的旁听席"
 tv_academy_debate.2002.a: "学者们查出引文的真正出处，当众撇清关系。"
 tv_academy_debate.2002.b: "死无对证，正好。"
 tv_academy_debate.2002.d: "有人抄了一句权威著作里的话，正好帮新论点撑腰。措辞太顺、墨迹太新，几位学者忽然对笔迹这门手艺产生了浓厚兴趣。\n\n#Y 本事件出现是因为一场本地辩论正在进行，且适用于任何辩论议题。#!"
 tv_academy_debate.2002.t: "有用的误引"
 tv_academy_debate.2003.a: "书吏照古人原样，把旧批注列为证据。"
 tv_academy_debate.2003.b: "我们要问一句：死人还能不能有最后的发言权？"
 tv_academy_debate.2003.d: "学院图书馆里翻出一部旧注释，页边的批注够锋利，两边都能拿来当武器。到正午，各派都说那位已故的注释者站在自己这边——好在他没法反驳。\n\n#Y 本事件出现是因为一场本地辩论正在进行，且适用于任何辩论议题。#!"
 tv_academy_debate.2003.t: "旧书页边的批注"
 tv_academy_debate.2004.a: "首席科学家留下那几位关键人物，直到他们真正理解为止。"
 tv_academy_debate.2004.b: "让烛火自己燃尽吧。"
 tv_academy_debate.2004.d: "议厅渐渐散去时，首席科学家提议趁蜡烛还没燃尽，把几位关键听众留下来单独谈谈。困惑变成信念，今晚还来得及——前提是有人肯付这份烛火钱。\n\n#Y 本事件出现是因为一场本地辩论正在进行，且适用于任何辩论议题。#!"
 tv_academy_debate.2004.t: "黄昏的私人讲课"
 tv_academy_debate.2005.a: "文吏拿到一份详尽记录，字字都能拿来钉死条款。"
 tv_academy_debate.2005.b: "这场争论，我们再让它口说无凭一阵子。"
 tv_academy_debate.2005.d: "学院的论点要影响政策之前，各部文吏先要一份记得够细的会议记录，好归档、好引用、也好拖延。这个王国里，还没有哪个想法真正跑赢过一位铁了心的档房文吏。\n\n#Y 本事件出现是因为一场本地辩论正在进行，且适用于任何辩论议题。#!"
 tv_academy_debate.2005.t: "各部所需的会议记录"
 tv_academy_debate.2006.a: "书吏在每份抄本上都附上所要求的谨慎说明。"
 tv_academy_debate.2006.b: "这想法站得住脚，用不着穿什么外衣。"
 tv_academy_debate.2006.d: "宗教人士要求先给这项争议主张裹上一层道德上的谨慎说明，才准许任何人称它为智慧。看来每个新念头出场之前，都得先赔个礼。\n\n#Y 本事件出现是因为一场本地辩论正在进行，且适用于任何辩论议题。#!"
 tv_academy_debate.2006.t: "道德序言"
 tv_academy_debate.2007.a: "商人们看到自己的名字印在论点旁边。"
 tv_academy_debate.2007.b: "我们拒绝把真理卖给一份认捐。"
 tv_academy_debate.2007.d: "市民商人愿意出钱印小册子、抄笔记、请人在咖啡馆里讨论，条件是他们的名字要挨着标题印出来。看来赞助自古偏爱署名，胜过脚注。\n\n#Y 本事件出现是因为一场本地辩论正在进行，且适用于任何辩论议题。#!"
 tv_academy_debate.2007.t: "商人认捐"
 tv_academy_debate.2008.a: "庭院里挤满了争论到日暮时分的年轻声音。"
 tv_academy_debate.2008.b: "安静下来，免得庭院变成第二个议厅。"
 tv_academy_debate.2008.d: "学生们在庭院里自己办了一场辩论，又一次证明热情有时确实比准备更响亮——而且便宜得多。\n\n#Y 本事件出现是因为一场本地辩论正在进行，且适用于任何辩论议题。#!"
 tv_academy_debate.2008.t: "学生论辩"
 tv_academy_debate.2009.a: "一名文吏在满座的议厅里当众朗读这封外国来信。"
 tv_academy_debate.2009.b: "悄悄归入档房，免得外来的墨迹让我们难堪。"
 tv_academy_debate.2009.d: "一位外国学者寄来一封措辞谨慎的信，折得像证据，读起来却像流言。信里的论证足以帮上学院，又足够\"外来\"，让每个听众都在心里犯嘀咕：这信一读出来，到底谁得利。\n\n#Y 本事件出现是因为一场本地辩论正在进行，且适用于任何辩论议题。#!"
 tv_academy_debate.2009.t: "海外来信"
 tv_academy_debate.2010.a: "满座目睹仪器运转，并选择相信自己的眼睛。"
 tv_academy_debate.2010.b: "有趣，但远称不上定论。"
 tv_academy_debate.2010.d: "一件能运转的仪器被抬进辩论厅，摆在理论再也没法装作孤军奋战的位置。齿轮、镜片或是刻度，未必能解决每一个问题，却足以让旧有的空谈冒汗——顺带也让几位老先生跟着冒汗。\n\n#Y 本事件出现是因为一场本地辩论正在进行，且适用于任何辩论议题。#!"
 tv_academy_debate.2010.t: "会场中的仪器"
 tv_academy_debate.2011.a: "曲调从一间酒馆传到另一间，一路招揽听众与流言。"
 tv_academy_debate.2011.b: "让歌者住口，免得曲调比论点活得更久。"
 tv_academy_debate.2011.d: "这议题变成一首街头歌谣，从学院里溜了出去，一半是误解，一半是拉人入伙。到日落时，好些说不出这项主张名字的人，已经能凭记忆哼出里面最刻薄的那句。\n\n#Y 本事件出现是因为一场本地辩论正在进行，且适用于任何辩论议题。#!"
 tv_academy_debate.2011.t: "街头歌谣"
 tv_academy_debate.2012.a: "评判者裁定新论证挺过了每一次交锋。"
 tv_academy_debate.2012.b: "古老的智慧无需新的见证人。"
 tv_academy_debate.2012.d: "一位受人尊重的反对者按严密的规矩挑战新主张，严到任何回避都藏不住。大厅安静了下来，不是因为火气消了，而是因为每个人都能大声数清每一回交锋。\n\n#Y 本事件出现是因为一场本地辩论正在进行，且适用于任何辩论议题。#!"
 tv_academy_debate.2012.t: "正式挑战"
 tv_academy_debate.2013.a: "议事槌落下，委员会被迫作出选择。"
 tv_academy_debate.2013.b: "还不到时候。"
 tv_academy_debate.2013.d: "人人都明白，再辩一个月，只会让发言更长，不会让理由更好。委员会开始打磨自己的反对意见，而不是去检验它——这是个古老又舒服的毛病。\n\n#Y 本事件出现是因为一场本地辩论正在进行，且适用于任何辩论议题。#!"
 tv_academy_debate.2013.t: "委员会疲惫"
 tv_academy_debate.2014.a: "学院出钱另请人重译一遍，墨迹和论证都从头来。"
 tv_academy_debate.2014.b: "先辈用过的那个词，如今仍够用。"
 tv_academy_debate.2014.d: "同一个关键词，两种译法，硬是给国家画出两个不同的未来。双方都咬定，对方译错的不只是这个词，还有它所属的整个时代。\n\n#Y 本事件出现是因为一场本地辩论正在进行，且适用于任何辩论议题。#!"
 tv_academy_debate.2014.t: "译词之争"
 tv_academy_debate.2015.a: "画作挂在大厅正中，谁的目光都躲不开它。"
 tv_academy_debate.2015.b: "教义无需画廊。"
 tv_academy_debate.2015.d: "一位艺术家把这议题画成一幅格外偏爱新意的场景，连反对者都停下脚步端详颜色。看来这场争论，总算学会了披上光线，而不只是嘴上提提。\n\n#Y 本事件出现是因为一场本地辩论正在进行，且适用于任何辩论议题。#!"
 tv_academy_debate.2015.t: "画布上的寓言"
 tv_academy_debate.2016.a: "法警展开一场冷静的调查，书信与流言一并追查。"
 tv_academy_debate.2016.b: "室内的文书，日落之前全数扣下。"
 tv_academy_debate.2016.d: "一封密封的指控信声称，这场辩论不是阴谋就是虚荣，或者两样都占。字迹恰好没人认得，屋里的人忽然都对门口来了兴趣。\n\n#Y 本事件出现是因为一场本地辩论正在进行，且适用于任何辩论议题。#!"
 tv_academy_debate.2016.t: "匿名告发"
 tv_academy_debate.2017.a: "灯火不熄，会议一直开下去，直到连天色都撑不住了。"
 tv_academy_debate.2017.b: "让自尊先睡一觉再说。"
 tv_academy_debate.2017.d: "烛光下，疲惫的反对者一时松了口，承认了几处再也驳不倒的论点。还没人愿意叫它\"同意\"，但满屋子人都听出了那个轮廓——就像雨还没落下，风声已经先到了。\n\n#Y 本事件出现是因为一场本地辩论正在进行，且适用于任何辩论议题。#!"
 tv_academy_debate.2017.t: "午夜后的共识"
 tv_academy_debate.2018.a: "书吏在评分开始前，抹去试卷上的每一个姓名。"
 tv_academy_debate.2018.b: "我们把姓名留在考官看得见的地方。"
 tv_academy_debate.2018.d: "试卷上落下第一个评分之前，考官们想先抹去每一个姓名，只留下论证与笔迹替人说话。门第愤愤不平，说墨水竟学会了装瞎——再也分不清名门望族与杂货商的儿子。\n\n#Y 本事件出现是因为当前辩论议题为【唯贤主义】。#!"
 tv_academy_debate.2018.t: "无名的试卷"
 tv_academy_debate.2019.a: "我们要这些羊皮纸向证据交代，而不是向礼节交代。"
 tv_academy_debate.2019.b: "宫廷表彰那份像传家宝一样继承下来的功劳。"
 tv_academy_debate.2019.d: "大族带来打磨得像祭坛银器般的族谱，每一张羊皮纸都坚称，治理之能会像一套银匙那样，沿着血脉稳稳传下来。\n\n#Y 本事件出现是因为当前辩论议题为【唯贤主义】。#!"
 tv_academy_debate.2019.t: "桌上的族谱"
 tv_academy_debate.2020.a: "学院召这位外乡人入朝，并给了他靠前的一个座位。"
 tv_academy_debate.2020.b: "可敬——离得远远地敬着。"
 tv_academy_debate.2020.d: "一名来自宫廷连好地图上都难寻的省份的候选人，一个晚上就理清了宠臣们绕着走了数周的难题。\n\n#Y 本事件出现是因为当前辩论议题为【唯贤主义】。#!"
 tv_academy_debate.2020.t: "外省奇才"
 tv_academy_debate.2021.a: "书吏把这笔交易摊在记录上，公之于众。"
 tv_academy_debate.2021.b: "我们由着这笔钱，悄悄找到它的官职。"
 tv_academy_debate.2021.d: "辩论还在厅中回响，一项肥缺已在楼下的走廊里许给了某位捐献者的儿子——此人最大的资历，是有个账本慷慨的父亲。\n\n#Y 本事件出现是因为当前辩论议题为【唯贤主义】。#!"
 tv_academy_debate.2021.t: "买来的官职"
 tv_academy_debate.2022.a: "评审会把经过考验的指挥资历，正式录入资格名册。"
 tv_academy_debate.2022.b: "刀剑一如爵位，最好留在家里。"
 tv_academy_debate.2022.d: "军官们起身主张，炮火下赢得的指挥权，在任命的账簿上应比一个早已入土的先人传下的姓氏更有分量。\n\n#Y 本事件出现是因为当前辩论议题为【唯贤主义】。#!"
 tv_academy_debate.2022.t: "战场上的功绩"
 tv_academy_debate.2023.a: "议事会把这位侄子送去接受与任何外人一样的考核。"
 tv_academy_debate.2023.b: "我们准了这份人情，也保住了宫廷的太平。"
 tv_academy_debate.2023.d: "王室教师上书，为一位才华罕见的侄子谋一个内阁席位——只是满室的见证者，似乎对那层亲缘远比对那份才华更有把握。\n\n#Y 本事件出现是因为当前辩论议题为【唯贤主义】。#!"
 tv_academy_debate.2023.t: "王室教师的侄子"
 tv_academy_debate.2024.a: "先看真本事，讲道容后再说。"
 tv_academy_debate.2024.b: "教区的印信，须盖在考官落墨之前。"
 tv_academy_debate.2024.d: "教士们提议，任何人担任公职前都须先取得一纸品行证明，让德行成为能力必须停下脚步、请求放行的门。\n\n#Y 本事件出现是因为当前辩论议题为【唯贤主义】。#!"
 tv_academy_debate.2024.t: "教士证明"
 tv_academy_debate.2025.a: "行会厅堂敞开工作台，任何愿以实活受考的候选人皆可上前。"
 tv_academy_debate.2025.b: "我们仍以旧日的文凭与旧日的学问为尺。"
 tv_academy_debate.2025.d: "城市行会愿为会计、工程师和书记员设下实务试炼，坚称一双能稳稳应付真木料与真账簿的手，足以证明漂亮引文永远证明不了的东西。\n\n#Y 本事件出现是因为当前辩论议题为【唯贤主义】。#!"
 tv_academy_debate.2025.t: "行会测试"
 tv_academy_debate.2026.a: "议厅准这份带泥的请愿当众宣读，连同那双靴子。"
 tv_academy_debate.2026.b: "溪流如何，自有本乡的水磨来评说。"
 tv_academy_debate.2026.d: "一位乡村塾师递上一个朴素的问题——生在茅屋之下的头脑，是否就少了几分头脑——这份请愿走进大理石铺就的议厅时，鞋上还沾着一路的泥。\n\n#Y 本事件出现是因为当前辩论议题为【唯贤主义】。#!"
 tv_academy_debate.2026.t: "农民的请愿"
 tv_academy_debate.2027.a: "我们照旧张榜，把那几排空座留着。"
 tv_academy_debate.2027.b: "王冠暂停排名，直到大族肯回来为止。"
 tv_academy_debate.2027.d: "几个大族威胁说，若公开排名照旧推行，便让他们的儿子退出学院——仿佛一排空座就等于一条胜过人的论据。\n\n#Y 本事件出现是因为当前辩论议题为【唯贤主义】。#!"
 tv_academy_debate.2027.t: "旧家族的抵制"
 tv_academy_debate.2028.a: "王冠把整个考官席位一并清空。"
 tv_academy_debate.2028.b: "我们作废最坏的几份，其余的只字不提。"
 tv_academy_debate.2028.d: "一份泄露的标准答案挑明了一件难堪的事：钱袋够沉、手够稳，所谓才能的模样便能被彻底伪造出来。\n\n#Y 本事件出现是因为当前辩论议题为【唯贤主义】。#!"
 tv_academy_debate.2028.t: "考试舞弊"
 tv_academy_debate.2029.a: "名单张贴在大门上，任每个路过的人评说。"
 tv_academy_debate.2029.b: "还是关起门来了断为好。"
 tv_academy_debate.2029.d: "改革者要把结果钉在大门上，让每个家族都能用清清楚楚的名次，读出他们的影响力究竟没能买下什么。\n\n#Y 本事件出现是因为当前辩论议题为【唯贤主义】。#!"
 tv_academy_debate.2029.t: "公开排名榜"
 tv_academy_debate.2030.a: "评审会接受以朴实省地文字写就的答卷。"
 tv_academy_debate.2030.b: "我们要求每一份答卷都用统一的宫廷文体。"
 tv_academy_debate.2030.d: "省份候选人请求用本乡朴实的行政语言作答，而不必用那套先评人品级、再评人本事的华丽宫廷文体。\n\n#Y 本事件出现是因为当前辩论议题为【唯贤主义】。#!"
 tv_academy_debate.2030.t: "地方语言答卷"
 tv_academy_debate.2031.a: "改革者把这一日的失手，作为证据录入记录。"
 tv_academy_debate.2031.b: "一次失足，废不了一门世家。"
 tv_academy_debate.2031.d: "一名世袭官员当着满厅的面，恰好在辩论一直坚称应受考核的那桩差事上失了手。\n\n#Y 本事件出现是因为当前辩论议题为【唯贤主义】。#!"
 tv_academy_debate.2031.t: "世袭官职危机"
 tv_academy_debate.2032.a: "学院把自家的教席，摆上公开竞争的擂台。"
 tv_academy_debate.2032.b: "我们把教席留在当初捐立它们的那些手里。"
 tv_academy_debate.2032.d: "学院自己的学者要求，教席应经公开竞争取得，而不是由赞助人随手传给恰好站在身边的哪个门生。\n\n#Y 本事件出现是因为当前辩论议题为【唯贤主义】。#!"
 tv_academy_debate.2032.t: "学者要求公开教席"
 tv_academy_debate.2033.a: "我们把切实的服役年资，计入任官的权衡。"
 tv_academy_debate.2033.b: "各部把文职名册与征兵名册分开摆放。"
 tv_academy_debate.2033.d: "老兵们把服役名册摊在桌上，直白地问：多年恪守纪律的效力，究竟算不算功绩，还是只算一本伤疤的账。\n\n#Y 本事件出现是因为当前辩论议题为【唯贤主义】。#!"
 tv_academy_debate.2033.t: "老兵服役名册"
 tv_academy_debate.2034.a: "分数照算，管他是不是宠儿。"
 tv_academy_debate.2034.b: "王冠为这位宠儿另开一场考核，另给一次机会。"
 tv_academy_debate.2034.d: "一名深得王冠喜爱的候选人，在监督试炼中表现糟糕，而见证者实在太多，这场失败无法被悄悄遗忘。\n\n#Y 本事件出现是因为当前辩论议题为【唯贤主义】。#!"
 tv_academy_debate.2034.t: "王冠的宠儿失败了"
 tv_academy_debate.2035.a: "学院当着满厅的面，作废这些被玷污的试卷。"
 tv_academy_debate.2035.b: "有些账本，最好永不翻开。"
 tv_academy_debate.2035.d: "调查者发现，考桌上卷面最干净的试卷，恰恰出自全国最肮脏的那张庇护网络之手。\n\n#Y 本事件出现是因为当前辩论议题为【唯贤主义】。#!"
 tv_academy_debate.2035.t: "清白墨迹，肮脏之手"
 tv_academy_debate.2036.a: "王冠准这所省立学校的学生入场应试。"
 tv_academy_debate.2036.b: "首都不盖印，一概免谈。"
 tv_academy_debate.2036.d: "一所省立学校传来消息，称自己无需一堂宫廷仪态课也能培养出称职的官员，所求不过是让它的学生同场应试。\n\n#Y 本事件出现是因为当前辩论议题为【唯贤主义】。#!"
 tv_academy_debate.2036.t: "首都之外的学校"
 tv_academy_debate.2037.a: "王冠立誓，以印信为考官提供庇护。"
 tv_academy_debate.2037.b: "还是别去惊动那些大族为好。"
 tv_academy_debate.2037.d: "在把结果张贴上门之前，考官们请求王冠立誓，为他们挡下某些大族已在僻静走廊里许下的报复。\n\n#Y 本事件出现是因为当前辩论议题为【唯贤主义】。#!"
 tv_academy_debate.2037.t: "考官之誓"
 tv_academy_debate.2038.a: "残躯被立在学院大厅的基座上。"
 tv_academy_debate.2038.b: "我们把它锁进珍奇柜里。"
 tv_academy_debate.2038.d: "工匠掘出一具古代大理石残躯，四肢早已不存，论证却完整得令人不安。艺术家围在坑边，赌咒说这块石头已经回答了注疏年复一年推说\"下次再谈\"的问题。\n\n#Y 本事件出现是因为当前辩论议题为【文艺复兴】。#!"
 tv_academy_debate.2038.t: "出土的残躯"
 tv_academy_debate.2039.a: "医师在满座宫廷面前剖开身体。"
 tv_academy_debate.2039.b: "不行，不在这座宫廷，也不在今日。"
 tv_academy_debate.2039.d: "医师请求在廷臣与学者面前举行一场获准的解剖课。旧图谱端正地摊在桌上，但医师提醒众人：再端正的图，也从未因端正而贴合它底下那具真实的身体。\n\n#Y 本事件出现是因为当前辩论议题为【文艺复兴】。#!"
 tv_academy_debate.2039.t: "宫廷前的解剖"
 tv_academy_debate.2040.a: "该设计受到赞扬，被定为礼拜堂的范本。"
 tv_academy_debate.2040.b: "让祭坛保有它古老的模样。"
 tv_academy_debate.2040.d: "一位画家展示了一份礼拜堂设计，拱券、圣像与阴影都服从同一个可测量的消失点。有人说这是把虔敬画得更清楚了，也有人低声嘀咕：几何站得离祭坛未免太近。\n\n#Y 本事件出现是因为当前辩论议题为【文艺复兴】。#!"
 tv_academy_debate.2040.t: "礼拜堂中的透视"
 tv_academy_debate.2041.a: "我们打开国库，任宫廷放手委约。"
 tv_academy_debate.2041.b: "宫廷的施予仍是礼仪，止于形式。"
 tv_academy_debate.2041.d: "艺术家把一本账册摊在桌上，列明哪些工坊在赞助到账那月才有变化，哪些布道只是在作品雕成、画就、交付之后才赞美这变化。账目暗示：灵感也雇了个司库。\n\n#Y 本事件出现是因为当前辩论议题为【文艺复兴】。#!"
 tv_academy_debate.2041.t: "赞助账册"
 tv_academy_debate.2042.a: "导师获得一个公开讲席和一众听众。"
 tv_academy_debate.2042.b: "这样的课程，我们只留在紧闭的门后。"
 tv_academy_debate.2042.d: "一位人文主义导师主张，统治者读史应当是为了受教，而非装点门面。几位贵族一听\"受教\"二字，立刻琢磨起来：究竟是谁，要被教着放下自己的旧习惯。\n\n#Y 本事件出现是因为当前辩论议题为【文艺复兴】。#!"
 tv_academy_debate.2042.t: "人文主义导师"
 tv_academy_debate.2043.a: "由他们读去，咸鱼与西塞罗一同摆卖。"
 tv_academy_debate.2043.b: "抄本被限定在学者手中。"
 tv_academy_debate.2043.d: "廉价的古典诗人印本出现在货摊上，与账簿和咸鱼摆在一处。学院颇为不安地发现：当人们按市价买下这些旧作者时，他们读起来竟大不一样。\n\n#Y 本事件出现是因为当前辩论议题为【文艺复兴】。#!"
 tv_academy_debate.2043.t: "市场上的古典诗篇"
 tv_academy_debate.2044.a: "我们主张，美可以教人心智认识真理。"
 tv_academy_debate.2044.b: "学院把更高的座次给了神学。"
 tv_academy_debate.2044.d: "一位艺术家与一位神学家争执起来：美究竟是教人认识真理，还是只把灵魂引开去。学院端坐旁听，看着笔触与教义轮番指责对方虚荣。\n\n#Y 本事件出现是因为当前辩论议题为【文艺复兴】。#!"
 tv_academy_debate.2044.t: "艺术家与神学家"
 tv_academy_debate.2045.a: "王室为音乐、戏服与舞台机关买单。"
 tv_academy_debate.2045.b: "不必了，别拿一场盛装布道劳烦王国。"
 tv_academy_debate.2045.d: "朝臣提议办一场盛大假面剧，颂扬新生、秩序，以及王室无可挑剔的品味。众人一致认为，只要配上音乐、戏服，再加一沓慷慨的账单，学说便会有说服力得多。\n\n#Y 本事件出现是因为当前辩论议题为【文艺复兴】。#!"
 tv_academy_debate.2045.t: "宫廷新生假面剧"
 tv_academy_debate.2046.a: "测绘者的数字被印发到各家工坊。"
 tv_academy_debate.2046.b: "旧石头当不了好先生。"
 tv_academy_debate.2046.d: "测绘者丈量古代遗迹，量出的比例悄悄令王国在世的建造者难堪。石头对此一言不发，这反倒让它们的算术更难被人打断。\n\n#Y 本事件出现是因为当前辩论议题为【文艺复兴】。#!"
 tv_academy_debate.2046.t: "丈量古代遗迹"
 tv_academy_debate.2047.a: "我们把这些文章原样读入记录，不加星注。"
 tv_academy_debate.2047.b: "沙龙被挥手斥为不过是客厅清谈。"
 tv_academy_debate.2047.d: "一群博学女性主持的沙龙开始传阅文章，使学院显得远不如它自诩的那般宏大。这些论证送来时字斟句酌，不附任何讲席或头衔，且麻烦地难以挥手赶走。\n\n#Y 本事件出现是因为当前辩论议题为【文艺复兴】。#!"
 tv_academy_debate.2047.t: "女性学识沙龙"
 tv_academy_debate.2048.a: "学院聘来抄写员与语文学者，将它译成完帙。"
 tv_academy_debate.2048.b: "我们先把它搁下，仔细审阅再说。"
 tv_academy_debate.2048.d: "一部希腊手稿送抵学院，其中的含混恰好足以引发三场争论，并开创一个学派。\n\n#Y 本事件出现是因为当前辩论议题为【文艺复兴】。#!"
 tv_academy_debate.2048.t: "希腊文本的翻译"
 tv_academy_debate.2049.a: "湿壁画被请上学院大厅的主墙。"
 tv_academy_debate.2049.b: "罢了，让墙面继续沉默。"
 tv_academy_debate.2049.d: "一幅湿壁画描绘王国从阴影中步入有度量的光明。它毫不含蓄，而这恰恰是它奏效的缘由。\n\n#Y 本事件出现是因为当前辩论议题为【文艺复兴】。#!"
 tv_academy_debate.2049.t: "新时代的湿壁画"
 tv_academy_debate.2050.a: "我们把新的比例法定为教授的规矩。"
 tv_academy_debate.2050.b: "老大师们守住了自己的工案与规矩。"
 tv_academy_debate.2050.d: "行会里的传统大师干脆拒绝新的比例法，把它斥为外来的虚荣，不过是拿尺规装点门面。\n\n#Y 本事件出现是因为当前辩论议题为【文艺复兴】。#!"
 tv_academy_debate.2050.t: "旧工坊的抵制"
 tv_academy_debate.2051.a: "他们最好的句子被编入学院自己的论说。"
 tv_academy_debate.2051.b: "韵脚跑得比裁决快。"
 tv_academy_debate.2051.d: "诗人们着手把议题改写成可供传诵的句子——这或许有用，却毫无疑问危险。\n\n#Y 本事件出现是因为当前辩论议题为【文艺复兴】。#!"
 tv_academy_debate.2051.t: "辩论中的诗人"
 tv_academy_debate.2052.a: "我们让画笔把统治者绘成一位饱学之士。"
 tv_academy_debate.2052.b: "肖像画师保留旧日那份神圣的距离。"
 tv_academy_debate.2052.d: "王室肖像画师提议以人文主义手法描绘统治者——近而写实，而非维持旧日那种神圣而遥远的姿态。\n\n#Y 本事件出现是因为当前辩论议题为【文艺复兴】。#!"
 tv_academy_debate.2052.t: "王子的肖像"
 tv_academy_debate.2053.a: "新的节庆之日被列入市历。"
 tv_academy_debate.2053.b: "不行，一年的日子不由我们随意重排。"
 tv_academy_debate.2053.d: "学者提议重塑市民节庆，使其围绕学问、艺术与城市荣誉展开，直到一年的圣日与集市日看起来都像是在争论：王国究竟选择尊崇什么。\n\n#Y 本事件出现是因为当前辩论议题为【文艺复兴】。#!"
 tv_academy_debate.2053.t: "新节庆历"
 tv_academy_debate.2054.a: "外国大师获得一间画室和一批门徒。"
 tv_academy_debate.2054.b: "我们诚挚道谢，请他另谋高就。"
 tv_academy_debate.2054.d: "一位外国大师带来新技法，本地艺术家因其既是外来之物、又分明更高明而心生怨气；于是每一句献给这位客人的赞美，落在他们耳中都像一句纠正。\n\n#Y 本事件出现是因为当前辩论议题为【文艺复兴】。#!"
 tv_academy_debate.2054.t: "外来的大师"
 tv_academy_debate.2055.a: "书架从头到尾按学科重排。"
 tv_academy_debate.2055.b: "我们把每一卷书都放回传统安放它的地方。"
 tv_academy_debate.2055.d: "人文主义者按学科重整学院图书馆，不再沿用祖传的书架传统；于是旧书忽然开始与陌生的邻居彼此攀谈。\n\n#Y 本事件出现是因为当前辩论议题为【文艺复兴】。#!"
 tv_academy_debate.2055.t: "重新整理图书馆"
 tv_academy_debate.2056.a: "王室出资兴建新的广场、立面与市政工程。"
 tv_academy_debate.2056.b: "钱袋谨慎，便不立丰碑。"
 tv_academy_debate.2056.d: "城市改革者主张，街道、广场与立面都能教市民养成更好的品味——只要国库肯承认，石头如今也是一门课程。\n\n#Y 本事件出现是因为当前辩论议题为【文艺复兴】。#!"
 tv_academy_debate.2056.t: "城市即课堂"
 tv_academy_debate.2057.a: "由他们笑去，笑声自有它的用处。"
 tv_academy_debate.2057.b: "法警在日落前收缴每一份印本。"
 tv_academy_debate.2057.d: "一篇辛辣讽刺把旧权威写得傲慢可笑，效果显著，也略有些不公；到正午，学院一半人在发笑，另一半人在悄悄清点印本。\n\n#Y 本事件出现是因为当前辩论议题为【文艺复兴】。#!"
 tv_academy_debate.2057.t: "讽刺旧大师"
 tv_academy_debate.2058.a: "学院将复式记账定为验证的标准。"
 tv_academy_debate.2058.b: "我们保留文书们早已烂熟于心的旧式账目。"
 tv_academy_debate.2058.d: "一位商人会计在学院众人面前摊开账簿，让每一笔主张都对上它的反项，借方对贷方，直到两栏彼此闭合。这套算术枯燥而冷峻，却难得地比席间任何雄辩都更有说服力。\n\n#Y 本事件出现是因为当前辩论议题为【银行系统】。#!"
 tv_academy_debate.2058.t: "复式记账呈于席前"
 tv_academy_debate.2059.a: "银行家的债册被逐一验封，记入案卷。"
 tv_academy_debate.2059.b: "够了。这卷债册不许出这间议厅。"
 tv_academy_debate.2059.d: "银行家带来一卷贵族债册，蜡封了两层，走廊里却早已被人低声传过一遍。它表明好几座骄傲的世家，全靠他们在公开场合痛斥的信用撑着门面。\n\n#Y 本事件出现是因为当前辩论议题为【银行系统】。#!"
 tv_academy_debate.2059.t: "一卷贵族债册"
 tv_academy_debate.2060.a: "我们承认利息自有其分，再用法律把它约束住。"
 tv_academy_debate.2060.b: "学院让布道者的谴责作为定论留下。"
 tv_academy_debate.2060.d: "黎明时分，一位布道者把利息说成一桩人人都能在自家钱袋里感到的罪。到正午，学院已在争吵：监管究竟是净化了信用，还是只给恶习开了一张工整的收据。\n\n#Y 本事件出现是因为当前辩论议题为【银行系统】。#!"
 tv_academy_debate.2060.t: "反高利贷布道"
 tv_academy_debate.2061.a: "王室为这家新的公共银行盖上印玺。"
 tv_academy_debate.2061.b: "我们让这份特许状再等一等，等来一个配得上这滴火漆的承诺。"
 tv_academy_debate.2061.d: "城市市民起草了一份倚仗王室承诺的公共银行方案。纸面上它许诺稳定，随后又客客气气地请满座众人一同追问：这份承诺本身，究竟值几个钱。\n\n#Y 本事件出现是因为当前辩论议题为【银行系统】。#!"
 tv_academy_debate.2061.t: "纸面上的公共银行"
 tv_academy_debate.2062.a: "各处铸币所重开，硬币被重新铸得足重。"
 tv_academy_debate.2062.b: "都住口，免得这些流言把每只钱袋都掏空。"
 tv_academy_debate.2062.d: "流言赌咒发誓，说每只钱袋里的硬币都比王室的诺言更薄；于是市场开始像称量白银一样，仔细称量起信任来。\n\n#Y 本事件出现是因为当前辩论议题为【银行系统】。#!"
 tv_academy_debate.2062.t: "劣币恐慌"
 tv_academy_debate.2063.a: "我们为存户托付的每一枚硬币，都立下一条规矩。"
 tv_academy_debate.2063.b: "议厅将这笔损失记作私人不幸，随后继续议程。"
 tv_academy_debate.2063.d: "一名寡妇带着一张收据、一份不翼而飞的嫁资，以及一副平静得无法被打发的嗓音，来到学院面前。原本一场关于银行规则的争论，如今有了一张面孔——而它正望着席位。\n\n#Y 本事件出现是因为当前辩论议题为【银行系统】。#!"
 tv_academy_debate.2063.t: "寡妇的存款"
 tv_academy_debate.2064.a: "书吏们把信用法草拟得明白无误，王室与放贷者一体受约束。"
 tv_academy_debate.2064.b: "掂量掂量，你们让谁的急需在柜台前干等。"
 tv_academy_debate.2064.d: "王室以紧急之名请求一笔贷款；银行家先报以沉默，再报以条件。大厅由此明白，含混的银行法，竟能让王室的急需也在柜台前干等。\n\n#Y 本事件出现是因为当前辩论议题为【银行系统】。#!"
 tv_academy_debate.2064.t: "王室贷款遭拒"
 tv_academy_debate.2065.a: "学院认可汇票，作为一纸合法的信用凭证。"
 tv_academy_debate.2065.b: "手中硬币，重过纸上墨迹。"
 tv_academy_debate.2065.d: "商人摊开书信、印章与签名，显示财富如何在护送的钱车还在争论走哪条路时，就已越过了边境。那纸张看着脆弱，直到众人发觉，它能调动多少硬币。\n\n#Y 本事件出现是因为当前辩论议题为【银行系统】。#!"
 tv_academy_debate.2065.t: "汇票"
 tv_academy_debate.2066.a: "这本伪造的账簿被公开展示，作为设立强制标准的理由。"
 tv_academy_debate.2066.b: "我们绞死那名书记员，至于他背后的贵人，一个不动。"
 tv_academy_debate.2066.d: "这本账簿优雅、平衡，且是假的。它的栏目保有良好秩序的那份冷静美感，也不知怎地，让藏在其中的盗窃，显得像是冲着算术本身来的一记侮辱。\n\n#Y 本事件出现是因为当前辩论议题为【银行系统】。#!"
 tv_academy_debate.2066.t: "会说谎的账簿"
 tv_academy_debate.2067.a: "学院将教会放贷纳入与旁人一体适用的法律。"
 tv_academy_debate.2067.b: "与修道院，暂且相安无事吧。"
 tv_academy_debate.2067.d: "修道院与教会机构把记录打开到刚好露出一张由贷款、抵押与沉默豁免织成的网。辩论就此发现——还带着几分尴尬——神圣之手同样会算利息。\n\n#Y 本事件出现是因为当前辩论议题为【银行系统】。#!"
 tv_academy_debate.2067.t: "修道院的信用箱"
 tv_academy_debate.2068.a: "王权带着一套新规则，插身于两拨人群之间。"
 tv_academy_debate.2068.b: "把门闩上，免得债务变成血案。"
 tv_academy_debate.2068.d: "债务人与债权人在一家城市银行门前扭打，双方都把契约挥舞得像伤口，并骂对方不过是字迹更工整的抢劫。学院再也没法假装，银行改革只是账簿之间的一场口角。\n\n#Y 本事件出现是因为当前辩论议题为【银行系统】。#!"
 tv_academy_debate.2068.t: "城市银行骚乱"
 tv_academy_debate.2069.a: "我们解开缎带，把每一位包税人的账册当众念出来。"
 tv_academy_debate.2069.b: "旧日的征税人留住了他们系着缎带的账册，也留住了那些舒服的阴影。"
 tv_academy_debate.2069.d: "包税人抗议说，透明的财政会让他们这门行当不再那么有赚头——这话是真的，所以格外招人厌。他们的账簿系着缎带送来，仿佛一根缎带就能把租利装扮成服务。\n\n#Y 本事件出现是因为当前辩论议题为【银行系统】。#!"
 tv_academy_debate.2069.t: "系着缎带的账目"
 tv_academy_debate.2070.a: "讲堂里开始教授复利的算法。"
 tv_academy_debate.2070.b: "债务人算不清的账，也就吓不着他。"
 tv_academy_debate.2070.d: "一位数学家在干净的石板上一步步推演复利，几名听众的神情，仿佛那支粉笔刚刚点了自己的名。原本被当作商人习性的东西，随着一行行算式，成了数字的法则。\n\n#Y 本事件出现是因为当前辩论议题为【银行系统】。#!"
 tv_academy_debate.2070.t: "利息学者"
 tv_academy_debate.2071.a: "书吏们将这项共同基金登记为一种公共保障。"
 tv_academy_debate.2071.b: "债，认的是一张脸，不是一只基金。"
 tv_academy_debate.2071.d: "市民提议设立一项共同基金，接济水手的家属、折本的商队，以及那些尾随着一趟再未归来的旅程而至的沉默灾难。这方案让风险不再那么像命运，而更像一屋子书吏可以合起来计算的东西。\n\n#Y 本事件出现是因为当前辩论议题为【银行系统】。#!"
 tv_academy_debate.2071.t: "商人遗孀基金"
 tv_academy_debate.2072.a: "这家外国行号获准入内，其每一条款皆在王国的注视之下。"
 tv_academy_debate.2072.b: "我们让王国的钱袋，只说自己的乡音。"
 tv_academy_debate.2072.d: "一家外国银行行号带来专门知识、资本，以及一份条款整齐得不可能全然天真的契约。支持者看见的是输入的学问，反对者看见的是王国的钱袋，开始学着操一口外国口音。\n\n#Y 本事件出现是因为当前辩论议题为【银行系统】。#!"
 tv_academy_debate.2072.t: "外国银行家到来"
 tv_academy_debate.2073.a: "这份供认被付印张贴，就贴在各家账房会看到的地方。"
 tv_academy_debate.2073.b: "那就悄悄地吧，让这老头留着他的养老金。"
 tv_academy_debate.2073.d: "一名疲惫的铸币官承认，旧有的铸币全靠一种被默许的混乱撑着：削薄的成色、私下通融的例外，以及一册册无人真正敢去对平的账。\n\n#Y 本事件出现是因为当前辩论议题为【银行系统】。#!"
 tv_academy_debate.2073.t: "铸币官的供认"
 tv_academy_debate.2074.a: "军需官依着理清后的银行办法，把军饷结清。"
 tv_academy_debate.2074.b: "我们再向那些私人债主，凑一回份子。"
 tv_academy_debate.2074.d: "士兵们等在发饷处外，司库们却还在争论方法、准备金与签押。这场辩论忽然有了靴声、饥饿，以及一种极其具体的时辰感。\n\n#Y 本事件出现是因为当前辩论议题为【银行系统】。#!"
 tv_academy_debate.2074.t: "军饷拖延"
 tv_academy_debate.2075.a: "学院要求每一份契约都用明白的话写成。"
 tv_academy_debate.2075.b: "我们把那些蝇头小字，留给受过训练、读得懂它的人。"
 tv_academy_debate.2075.d: "改革者呈上一份金融契约，写得让普通读者一眼就看清自己被什么绑住。律师们的神情，像是有人在隆冬里猛地推开了一扇窗。\n\n#Y 本事件出现是因为当前辩论议题为【银行系统】。#!"
 tv_academy_debate.2075.t: "白话契约"
 tv_academy_debate.2076.a: "学院将有序破产写入合法的程序。"
 tv_academy_debate.2076.b: "败坏了的名声，偿的是钱偿不了的债。"
 tv_academy_debate.2076.d: "一名破产的商人辩称，一场有秩序的破产，比公开羞辱更能保住作坊、债权人与家庭。道德家听见的是宽恕，银行家听见的是残值。\n\n#Y 本事件出现是因为当前辩论议题为【银行系统】。#!"
 tv_academy_debate.2076.t: "破产之耻"
 tv_academy_debate.2077.a: "我们把王室自己的账目，摊在向别人索要的同一片日光下。"
 tv_academy_debate.2077.b: "宫廷把账目锁着，数字也只留给自己。"
 tv_academy_debate.2077.d: "学院提议公布一份简化的王室账目：数字要多到足以证明底气，又不能多到让每个宫廷派系都能拿去磨刀。会场当即追问：这条线，究竟该画在哪儿。\n\n#Y 本事件出现是因为当前辩论议题为【银行系统】。#!"
 tv_academy_debate.2077.t: "王室的账目"
 tv_academy_debate.2078.a: "领航员们把海图钉在大案之上，照着它定下航向。"
 tv_academy_debate.2078.b: "酒馆里的墨迹，我们一眼就认得。"
 tv_academy_debate.2078.d: "一张浸满盐渍的海图送进学院，海岸线怎么也贴不平任何一张已知地图。那些墨渍起初像酒馆里留下的证物，直到誊抄的人发现，每一条歪斜的线仍固执地指向西方。\n\n#Y 本事件出现是因为当前辩论议题为【发现新大陆】。#!"
 tv_academy_debate.2078.t: "水手的海图"
 tv_academy_debate.2079.a: "一名文吏敲定秩序，让领航员当着每一排座位开口。"
 tv_academy_debate.2079.b: "我们把他的说法带到闭门之后再问。"
 tv_academy_debate.2079.d: "一名领航员归来，外套上结着盐霜，骨子里还烧着热病，讲出的故事前后一致得不像胡话，难以随手打发。学院必须决定，是让王国把这段经历当作证词来听，还是当作秘密来埋。\n\n#Y 本事件出现是因为当前辩论议题为【发现新大陆】。#!"
 tv_academy_debate.2079.t: "归来的领航员"
 tv_academy_debate.2080.a: "海岸上不救得一条灵魂，便算不得真正发现了它。"
 tv_academy_debate.2080.b: "学院让传教士与测绘师同坐一张桌子。"
 tv_academy_debate.2080.d: "神职人员主张，没有皈依的发现，不过是带着更好地图的游荡罢了。学院的辩论被撕扯在灵魂、测绘，与一个尴尬的问题之间：谁有资格最先为一片新海岸命名？\n\n#Y 本事件出现是因为当前辩论议题为【发现新大陆】。#!"
 tv_academy_debate.2080.t: "神职人员索要传教权"
 tv_academy_debate.2081.a: "印章按下，港湾还没得到名字，便先有了主人。"
 tv_academy_debate.2081.b: "且慢——那片海岸只听命于王权。"
 tv_academy_debate.2081.d: "商人提出资助远航，条件是王权允许他们为尚未亲眼见过的港湾命名。他们的信心有用、昂贵，且早已忙着把印章按在一片空白海面上。\n\n#Y 本事件出现是因为当前辩论议题为【发现新大陆】。#!"
 tv_academy_debate.2081.t: "商人索要特许状"
 tv_academy_debate.2082.a: "我们让这份叙述改写我们自以为早已知道的东西。"
 tv_academy_debate.2082.b: "文吏把这份叙述归入陈列柜里的奇珍异闻。"
 tv_academy_debate.2082.d: "一份来自海彼岸的译文叙述反驳了学院一半的假设，且听起来对其中任何一条都毫不动容。众人这才发现，新世界并不曾沉默端坐，礼貌地等待别人来描述。\n\n#Y 本事件出现是因为当前辩论议题为【发现新大陆】。#!"
 tv_academy_debate.2082.t: "原住民使者的叙述"
 tv_academy_debate.2083.a: "医生们得到资助，船只带着他们的防范条陈一同起航。"
 tv_academy_debate.2083.b: "海岸再美，也藏着恶疾。"
 tv_academy_debate.2083.d: "医生们提醒学院，新海岸带来的不只海岸线，还可能有热病。发现的支持者如今必须证明，谨慎与好奇心能装上同一批船。\n\n#Y 本事件出现是因为当前辩论议题为【发现新大陆】。#!"
 tv_academy_debate.2083.t: "疾病报告"
 tv_academy_debate.2084.a: "我们不会为了一座空港就降下旗帜。"
 tv_academy_debate.2084.b: "够了。别再把船送进那片黑暗。"
 tv_academy_debate.2084.d: "一支远征队迟迟未归，空荡的港口比任何讲师都更懂得挑时机发言。反对者把这份沉默称作证据，支持者则回答：未知从来不会礼貌地投降。\n\n#Y 本事件出现是因为当前辩论议题为【发现新大陆】。#!"
 tv_academy_debate.2084.t: "失踪的远征队"
 tv_academy_debate.2085.a: "异域货物摊开陈列，让港口的人群都能上手触碰。"
 tv_academy_debate.2085.b: "货物先锁起来，等账目对齐再说。"
 tv_academy_debate.2085.d: "港口挤满了伸长脖子、想看异域货物卸船的人。每一件物品都成了一位小小的使节，给学院的论点添上颜色、重量，以及围观者真能伸手指认的东西。\n\n#Y 本事件出现是因为当前辩论议题为【发现新大陆】。#!"
 tv_academy_debate.2085.t: "港口人群"
 tv_academy_debate.2086.a: "修正后的海岸连同边界，一并录入母本海图。"
 tv_academy_debate.2086.b: "劳驾，还是把旧地图挂回去吧。"
 tv_academy_debate.2086.d: "制图师当着众人的面刮去一道传统边界，在曾经写着确定性的地方画上新的海岸。刮刀的声响很轻，直到满室的人明白，刚刚失去墨迹的是哪一种权威。\n\n#Y 本事件出现是因为当前辩论议题为【发现新大陆】。#!"
 tv_academy_debate.2086.t: "制图师的修正"
 tv_academy_debate.2087.a: "船坞开工，为经得起远海的船只备下木料。"
 tv_academy_debate.2087.b: "我们的船，就留在望得见故土的地方。"
 tv_academy_debate.2087.d: "海军军官告诉学院，发现新世界靠的不是仪典用的木料。王国若想把海洋变成道路，就得出钱造出经得起检阅之外风浪的船。\n\n#Y 本事件出现是因为当前辩论议题为【发现新大陆】。#!"
 tv_academy_debate.2087.t: "海军军官索要经费"
 tv_academy_debate.2088.a: "这一回，就让贪欲来划桨吧。"
 tv_academy_debate.2088.b: "主席在议厅当众斥责这则传闻。"
 tv_academy_debate.2088.d: "黄金的消息比任何可靠的纬度都传得更快。支持者认为，可以趁贪欲还没自行凝成政策之前先加以驾驭；反对者则警告，学院正把狂热误当成证据。\n\n#Y 本事件出现是因为当前辩论议题为【发现新大陆】。#!"
 tv_academy_debate.2088.t: "黄金传闻"
 tv_academy_debate.2089.a: "学院起草回信，一里海岸也不让给对手。"
 tv_academy_debate.2089.b: "息事宁人吧——那片纸上的海岸，就让给对手。"
 tv_academy_debate.2089.d: "一个敌对宫廷宣称率先发现了新海岸，并送来措辞被自信打磨得发亮的书信。学院的问题骤然不再只是那片海岸是否存在，而是沉默会不会把它拱手让给别人。\n\n#Y 本事件出现是因为当前辩论议题为【发现新大陆】。#!"
 tv_academy_debate.2089.t: "外国声索"
 tv_academy_debate.2090.a: "议厅称许这份坦白，毫不脸红地录下新的数字。"
 tv_academy_debate.2090.b: "这处算错，就留在这四壁之内吧。"
 tv_academy_debate.2090.d: "学院偏爱的宇宙志学者承认，一项重要的距离估算出了错。这个错误在羊皮纸上显得很小，只因为羊皮纸——谢天谢地——是平的。\n\n#Y 本事件出现是因为当前辩论议题为【发现新大陆】。#!"
 tv_academy_debate.2090.t: "宇宙志学者的错误"
 tv_academy_debate.2091.a: "军需官打开钱袋，随船教士摆出道理，直到水手们松了口。"
 tv_academy_debate.2091.b: "大海自有它的主意。"
 tv_academy_debate.2091.d: "水手们拒绝再次出海，除非那些征兆得到回应，而每一种官方解释似乎都只让征兆更加顽固。学院必须判断，海上的恐惧究竟是薪酬、劝说，还是天意的问题。\n\n#Y 本事件出现是因为当前辩论议题为【发现新大陆】。#!"
 tv_academy_debate.2091.t: "水手的迷信"
 tv_academy_debate.2092.a: "学院逐条重写特许状，字字都盯得很紧。"
 tv_academy_debate.2092.b: "我们把这整场实验召回国内。"
 tv_academy_debate.2092.d: "一名特许权持有人在这项原则尚未于国内辩论中获胜之前，就已滥用了远方的权力。这桩丑闻给了反对者一个尖锐的问题：如果发现事业开头就如此不堪，我们究竟是在接受什么？\n\n#Y 本事件出现是因为当前辩论议题为【发现新大陆】。#!"
 tv_academy_debate.2092.t: "殖民特许权滥用"
 tv_academy_debate.2093.a: "秧苗被分送到王国里每一块肯接纳它的田地。"
 tv_academy_debate.2093.b: "它就留在围栏后面。"
 tv_academy_debate.2093.d: "一种陌生作物在学院的试验园里活了下来，在理论只许诺过传闻的地方，倔强地泛着绿。农民、商人与怀疑者都围到叶片旁，因为未知之物终于变成了可以浇水的东西。\n\n#Y 本事件出现是因为当前辩论议题为【发现新大陆】。#!"
 tv_academy_debate.2093.t: "输入作物"
 tv_academy_debate.2094.a: "王国宣告：凡船首所能抵达之处，皆有本国航行之权。"
 tv_academy_debate.2094.b: "我们不会拿脚下的实土，去换想象中的海岸。"
 tv_academy_debate.2094.d: "外交官询问，那些制图师还只能半凭想象描摹的海岸，是否已经可以用墨水分割。学院的争论骤然不只关乎那里是否存在，也关乎谁有权声称自己可以率先抵达。\n\n#Y 本事件出现是因为当前辩论议题为【发现新大陆】。#!"
 tv_academy_debate.2094.t: "未知海岸条约"
 tv_academy_debate.2095.a: "语法书的抄本从学院的座席一路传到讲道坛。"
 tv_academy_debate.2095.b: "先有经文，才轮到语法。"
 tv_academy_debate.2095.d: "一名传教士带来一部新语言的语法书，宫中无人能不带谦卑地念出那些音节。书页证明，发现新世界所面对的是自有声音、规则与意义的人群，而不只是一串等待命名的海岸线。\n\n#Y 本事件出现是因为当前辩论议题为【发现新大陆】。#!"
 tv_academy_debate.2095.t: "传教士语法书"
 tv_academy_debate.2096.a: "王权为这次远征提供担保，风浪都算在内。"
 tv_academy_debate.2096.b: "受了惊的钱，我们就任它走吧。"
 tv_academy_debate.2096.d: "一场风暴把为下一次航行备好的船只劈成碎木，港口的信心几乎和桅杆一起断裂。昨日还在称颂发现事业的投资者，如今像恐惧的账房先生一样，盯着残骸细算。\n\n#Y 本事件出现是因为当前辩论议题为【发现新大陆】。#!"
 tv_academy_debate.2096.t: "港口投资者恐慌"
 tv_academy_debate.2097.a: "地球仪摆进教室，任每一名学生动手转动。"
 tv_academy_debate.2097.b: "只交给有学问的人经手。"
 tv_academy_debate.2097.d: "一具新的地球仪被抬进学院教室，那圆弧足以让墙上的旧地图显得窘迫。学生们用手转动它，整间屋子发现，地理知识竟能在指尖之下移动。\n\n#Y 本事件出现是因为当前辩论议题为【发现新大陆】。#!"
 tv_academy_debate.2097.t: "学校地球仪"
 tv_academy_debate.2098.a: "书记员把小册子运到每一个摊位和街角。"
 tv_academy_debate.2098.b: "我们先把这批印品留在学者圈里，等这样的墨迹能公开诵读再说。"
 tv_academy_debate.2098.d: "第一批小册子从印机上下来，还带着油墨味，印完时审查官还没决定一份小册子在律法上究竟算什么。铅字已经拆开去排下一活了；至于那道裁决，多半会和第二版一同到场。\n\n#Y 本事件出现是因为当前辩论议题为【印刷机应用】。#!"
 tv_academy_debate.2098.t: "小册子的第一次印刷"
 tv_academy_debate.2099.a: "特许状加了印，印刷机就此列入正当行业的名册。"
 tv_academy_debate.2099.b: "我们宁可对每一台印刷机逐一发照，各记其名。"
 tv_academy_debate.2099.d: "印刷匠们来到学院面前，请求一纸特许状、一座行会厅，以及律法上的一个名分，免得又有更多印刷机住进地窖和借来的厨房。\n\n#Y 本事件出现是因为当前辩论议题为【印刷机应用】。#!"
 tv_academy_debate.2099.t: "印刷匠行会的请愿"
 tv_academy_debate.2100.a: "我们不会让教会来裁定，哪些书是生来有罪的。"
 tv_academy_debate.2100.b: "索引获批，每一份印出来的论点都要等审查官的批注。"
 tv_academy_debate.2100.d: "教士提议编制一份危险书籍索引，编得极为用心，长过大多数图书馆。学生们听人把书目念出来，只当是荐读清单，把每一个书名都抄了下来。\n\n#Y 本事件出现是因为当前辩论议题为【印刷机应用】。#!"
 tv_academy_debate.2100.t: "危险书籍索引"
 tv_academy_debate.2101.a: "印刷机转而为改革效力，一张廉价印单接着一张。"
 tv_academy_debate.2101.b: "够了，免得每个田间野道的传道人都私藏一台印刷机。"
 tv_academy_debate.2101.d: "廉价印刷的祈祷单比本该先行一步的正式布道更快传到乡下。一位堂区神父抱怨说，他的会众如今拿着揣在口袋里捂热的折页，反过来纠正他的诵读。\n\n#Y 本事件出现是因为当前辩论议题为【印刷机应用】。#!"
 tv_academy_debate.2101.t: "一文钱的祈祷单"
 tv_academy_debate.2102.a: "我们不会因为印刷机印出了宫廷宁愿掩埋的东西，就去封住它的口。"
 tv_academy_debate.2102.b: "法警查封了店铺，把它的铅字一一放回字盘。"
 tv_academy_debate.2102.d: "一名印刷商把宫廷流言和严肃论辩排在同一张纸上，结果发现两栏卖得一样好。哲学家们震惊地发现，他们的推理竟与某位公爵夫人的风流韵事挨得如此之近，而围在他们这一栏前的人又少得多。\n\n#Y 本事件出现是因为当前辩论议题为【印刷机应用】。#!"
 tv_academy_debate.2102.t: "丑闻小报"
 tv_academy_debate.2103.a: "总算有了一幅图，它老老实实待在作者摆下的位置。"
 tv_academy_debate.2103.b: "委员会把这本书扣下，再审查一个学季。"
 tv_academy_debate.2103.d: "一本印刷课本在一个学季内把校正过的图表送进每一所学校，每一份都与上一份分毫不差，连最小的图形都一样。从前抄书人要花一整个冬天才能传开、也才能抄坏的东西，如今几周便可送达，再无一支走神的笔可供责怪。\n\n#Y 本事件出现是因为当前辩论议题为【印刷机应用】。#!"
 tv_academy_debate.2103.t: "校正过的课本"
 tv_academy_debate.2104.a: "国库拨了款，纸坊到周末又重新转了起来。"
 tv_academy_debate.2104.b: "我们要么量入为出地印，要么干脆不印。"
 tv_academy_debate.2104.d: "造纸匠捎来话说，辩论光凭热情是印不出来的：收破布的两手空空，纸坊也静了下来。原来议厅里每一场激昂的演说，都要用没人买过的一捆捆纸来计量。\n\n#Y 本事件出现是因为当前辩论议题为【印刷机应用】。#!"
 tv_academy_debate.2104.t: "纸张短缺"
 tv_academy_debate.2105.a: "由他们喊去，这些墙壁扛过更难听的话。"
 tv_academy_debate.2105.b: "巡役受命顺着浆糊追查，看是谁调的。"
 tv_academy_debate.2105.d: "匿名传单以雷鸣般的热烈替这项议题呐喊，连它的盟友都开始躲开墙上那层浆糊。一位支持者嘟囔道，这样的支持，是人熬过去的，不是享受的。\n\n#Y 本事件出现是因为当前辩论议题为【印刷机应用】。#!"
 tv_academy_debate.2105.t: "匿名传单"
 tv_academy_debate.2106.a: "我们用同样的墨、在同一天回敬他们。"
 tv_academy_debate.2106.b: "隔着国界狂吠的狗，不必去理会。"
 tv_academy_debate.2106.d: "一家外国印刷所转载了学院的论点，添上新的讹误、更刻薄的讥讽，还有着实惊人的速度。学者们几乎拿不定主意：是该为这场剽窃受宠若惊，还是该为那些错别字痛心。\n\n#Y 本事件出现是因为当前辩论议题为【印刷机应用】。#!"
 tv_academy_debate.2106.t: "外国印刷所转载我方"
 tv_academy_debate.2107.a: "抄写员被安排到印刷机前，教着认识一盘盘铅字。"
 tv_academy_debate.2107.b: "不该把哪个匠人挤得连自己的口粮都保不住。"
 tv_academy_debate.2107.d: "抄写员警告说，活字印刷会让诚实的双手和不诚实的缩写一同挨饿。他们的请愿书一如既往写得极美，而一门手艺以自己最工整的字迹为性命求告，其中总有几分哀伤。\n\n#Y 本事件出现是因为当前辩论议题为【印刷机应用】。#!"
 tv_academy_debate.2107.t: "抄写员的抗议"
 tv_academy_debate.2108.a: "文书院下令，每一份公告都用统一的字体排印。"
 tv_academy_debate.2108.b: "我们的公告，还是照传令官一贯的喊法来。"
 tv_academy_debate.2108.d: "官员们发现，一份印刷公告能在谣言来得及改写之前就抵达民众手中，字字皆如王室本意。对一个政府而言，被准确地引用，是一种新奇而略感不安的体验。\n\n#Y 本事件出现是因为当前辩论议题为【印刷机应用】。#!"
 tv_academy_debate.2108.t: "印成铅字的公告"
 tv_academy_debate.2109.a: "这本书被合法化并重新发行，外面裹着一层官方注解。"
 tv_academy_debate.2109.b: "架上一本不留，统统查抄。"
 tv_academy_debate.2109.d: "一本禁书恰恰因为遭禁而流行起来，书籍有时就是这样，带着几分纯粹的倔强。那位定它罪的审查官，无心之间写下了这一季最有效的广告。\n\n#Y 本事件出现是因为当前辩论议题为【印刷机应用】。#!"
 tv_academy_debate.2109.t: "禁书的畅销"
 tv_academy_debate.2110.a: "大学获准在自己的院墙之内设一台印刷机。"
 tv_academy_debate.2110.b: "我们要让国中每一台印刷机，都归一个衙门管辖。"
 tv_academy_debate.2110.d: "一所大学请求拥有一台自己的印刷机，实在厌倦了央求城里的印刷工把严肃学问排在歌谣和戏单之前。它的学者们宁可等自家的墨，也不愿等一个买卖人的轻重缓急。\n\n#Y 本事件出现是因为当前辩论议题为【印刷机应用】。#!"
 tv_academy_debate.2110.t: "大学自己的印刷所"
 tv_academy_debate.2111.a: "印刷机再度开动，这一回印的是勘误。"
 tv_academy_debate.2111.b: "谬误排成了铅字，仍旧是谬误，只是快了些。"
 tv_academy_debate.2111.d: "一张出错的印刷表格，把同一个错误忠实而分毫不差地传遍数百份副本。有人低声指出，印刷术已经学会了错得如此一致——这是从前的抄书人从未做到的。\n\n#Y 本事件出现是因为当前辩论议题为【印刷机应用】。#!"
 tv_academy_debate.2111.t: "被复制的错误"
 tv_academy_debate.2112.a: "我们让这支曲子去承载脚注永远送不到的地方。"
 tv_academy_debate.2112.b: "地方官下令把这首歌谣从印机上撤下。"
 tv_academy_debate.2112.d: "一首印刷歌谣把整场辩论解释得既不准确又难以忘怀，配着一支入夜前谁也甩不掉的调子。哲学家们对那些韵脚直皱眉；而街头，正把他们的论点哼着还给他们。\n\n#Y 本事件出现是因为当前辩论议题为【印刷机应用】。#!"
 tv_academy_debate.2112.t: "议题的歌谣"
 tv_academy_debate.2113.a: "法庭判印刷商胜诉，那本小册子得以留存。"
 tv_academy_debate.2113.b: "好一份廉价的俏皮话，让他付钱吧。"
 tv_academy_debate.2113.d: "一名贵族起诉一名印刷商，因为廉价而清晰的铅字把旧特权印得可笑。那本触犯了他的小册子，与其说是驳斥他的身份，不如说是把它明明白白摆上纸面，任何花得起一文钱的人都能一笑。\n\n#Y 本事件出现是因为当前辩论议题为【印刷机应用】。#!"
 tv_academy_debate.2113.t: "贵族的诽谤诉讼"
 tv_academy_debate.2114.a: "这些版本以国中通行的每一种语言付印。"
 tv_academy_debate.2114.b: "我们要把这项论点限定在唯一一种官方语言之内。"
 tv_academy_debate.2114.d: "印刷商提议同时用数种语言出版，这将让这项论点远远更难被圈住。一个已经不肯安分待在一本书里的念头，如今又打算逃进国中每一张嘴里。\n\n#Y 本事件出现是因为当前辩论议题为【印刷机应用】。#!"
 tv_academy_debate.2114.t: "多种语言的版本"
 tv_academy_debate.2115.a: "团属印刷机开动起来，印制手册和单页。"
 tv_academy_debate.2115.b: "我们让印刷机只管民政事务。"
 tv_academy_debate.2115.d: "军官们请求印刷操典手册和技术单页，每一份都一模一样，好让没有哪个连队把同一个动作练成两种样子。哲学家们当作原则来辩论的东西，军士们只希望它以指令的形式送来，编号无误。\n\n#Y 本事件出现是因为当前辩论议题为【印刷机应用】。#!"
 tv_academy_debate.2115.t: "营房里的印刷机"
 tv_academy_debate.2116.a: "也罢，名声卖出去的页数，并不比真理少。"
 tv_academy_debate.2116.b: "学院把作者的名字重新放回印刷商之上。"
 tv_academy_debate.2116.d: "一名印刷商出了名，名气大到足以惹恼那些真正写下这些文字、而他不过是把它们排好的学者。他被请去赴宴，在沙龙里被人引用，为一些他只是排得匀称的句子受人称道。\n\n#Y 本事件出现是因为当前辩论议题为【印刷机应用】。#!"
 tv_academy_debate.2116.t: "成名的印刷商"
 tv_academy_debate.2117.a: "墨迹干得，总比审查官的谨慎快。"
 tv_academy_debate.2117.b: "学院照着流程的要求，等着。"
 tv_academy_debate.2117.d: "审查官斟酌得太久，这项议题眼看就要在一只上锁的抽屉里，安静而体面地死去。裁决并未被驳回；只是那道决定的墨迹，似乎永远不情愿干透。\n\n#Y 本事件出现是因为当前辩论议题为【印刷机应用】。#!"
 tv_academy_debate.2117.t: "审查官的拖延"
 tv_academy_debate.2118.a: "君主将自己的信仰告白定为国策。"
 tv_academy_debate.2118.b: "我们把王室信仰留在礼拜堂里，余下的交给沉默。"
 tv_academy_debate.2118.d: "朝臣们终于当众问出前厅里已窃语整整一季的话题：君主的信仰究竟该公开立作全国的准则，还是仍旧只是私人习惯——靠出席礼拜和几次恰到好处的沉默来表白？\n\n#Y 本事件出现是因为当前辩论议题为【认信主义】。#!"
 tv_academy_debate.2118.t: "君主的信仰告白"
 tv_academy_debate.2119.a: "我们下令各堂区都以工整字迹保存登记簿。"
 tv_academy_debate.2119.b: "登记簿一如往常，留在堂区的箱柜里。"
 tv_academy_debate.2119.d: "改革者把一摞堂区登记簿摊在学院面前，把话说得直白：信仰、婚姻与出生，若国家不能以同一手工整字迹尽数读懂，就当不了政策的依据。倒是那几位书记员，看上去颇为欢欣。\n\n#Y 本事件出现是因为当前辩论议题为【认信主义】。#!"
 tv_academy_debate.2119.t: "堂区登记簿"
 tv_academy_debate.2120.a: "凡欲代表正统发声的讲坛，都须领取王室颁发的许可。"
 tv_academy_debate.2120.b: "由着那些老讲坛去吧。"
 tv_academy_debate.2120.d: "如今教义开始听起来像政务，讲坛便不再只是地方的事。传道人想要个明白话：当每一篇讲道都可能被当成政策来听，究竟谁才准许代表正统发声？\n\n#Y 本事件出现是因为当前辩论议题为【认信主义】。#!"
 tv_academy_debate.2120.t: "讲道许可"
 tv_academy_debate.2121.a: "主教的巡查员查封了这座家族礼拜堂，直到其礼仪归于一统。"
 tv_academy_debate.2121.b: "我们让这个老家族留着自己的烛火。"
 tv_academy_debate.2121.d: "一个显赫家族仍在自家礼拜堂里维持旧例，而这套做法已同正在成形的国家信纲不合。辩护者称之为家族荣誉，反对者则说，那不过是点着蜡烛的一个漏洞。\n\n#Y 本事件出现是因为当前辩论议题为【认信主义】。#!"
 tv_academy_debate.2121.t: "贵族礼拜堂之争"
 tv_academy_debate.2122.a: "趁争论还没追上来，我们先把它送进印坊。"
 tv_academy_debate.2122.b: "草案退回委员会，再走一轮共识。"
 tv_academy_debate.2122.d: "学者们写出一份教理问答，短到孩子也背得下，锋利到成年人也要争执。页边空白挤满了各家笔迹，早已像一片战场。\n\n#Y 本事件出现是因为当前辩论议题为【认信主义】。#!"
 tv_academy_debate.2122.t: "教理问答草案"
 tv_academy_debate.2123.a: "法学家把对少数社群的保护，直接写进信纲本身。"
 tv_academy_debate.2123.b: "别许下日后或许得兑现的承诺。"
 tv_academy_debate.2123.d: "一个少数信仰社群派出长老来到学院，呈上一份封印谨慎的请愿书。他们并不否认王国的信纲，只想问一句：服从换来的，究竟是保护，还是一种更安静的排斥？\n\n#Y 本事件出现是因为当前辩论议题为【认信主义】。#!"
 tv_academy_debate.2123.t: "少数社群请愿"
 tv_academy_debate.2124.a: "趁地方习俗还没把军营分开，我们先用一份誓词把整座营地系紧。"
 tv_academy_debate.2124.b: "各团仍守着父辈立下的旧誓词。"
 tv_academy_debate.2124.d: "军官们警告说，士兵纵在十几个不同堂区祈祷，终究站在同一条战线上。他们要一份共同誓词，够牢固，好在地方习俗把军营拆散之前先把它系紧。\n\n#Y 本事件出现是因为当前辩论议题为【认信主义】。#!"
 tv_academy_debate.2124.t: "军中誓词"
 tv_academy_debate.2125.a: "召集令发出，宗教会议在多到足以钉住记忆的见证者面前召开。"
 tv_academy_debate.2125.b: "言多必失，不如缄默。"
 tv_academy_debate.2125.d: "有人提议召开一场正式宗教会议，列席见证者多到任何派别日后都无法佯称尖锐言辞从未出口。教义将以盖印署期的公开决议离开学院，而不是化作传闻流散。\n\n#Y 本事件出现是因为当前辩论议题为【认信主义】。#!"
 tv_academy_debate.2125.t: "召集宗教会议"
 tv_academy_debate.2126.a: "一名文吏把外国来信连同署名，一并读入记录。"
 tv_academy_debate.2126.b: "我们让本国信纲只做国内之事，把来信原封退回。"
 tv_academy_debate.2126.d: "外国同信者寄来书信，满纸是鼓励、不请自来的建议，以及显眼到无法忽视的署名。他们的支持强化了厅内的论点——也让每个听众都忍不住揣度：边境那头，还有谁在旁听？\n\n#Y 本事件出现是因为当前辩论议题为【认信主义】。#!"
 tv_academy_debate.2126.t: "外国同信者"
 tv_academy_debate.2127.a: "修订过的历法连同被划去的节日，一并公布。"
 tv_academy_debate.2127.b: "习俗自成一部历法，非诏令所能改写。"
 tv_academy_debate.2127.d: "改革者把一份修订过的圣日历铺开在桌上，一个节日一个节日地发现：每一个被划去的日子，身后都拖着邻里、行会与祖辈的记忆。看来国家可以校准神圣时间，却绝无法悄无声息地做到。\n\n#Y 本事件出现是因为当前辩论议题为【认信主义】。#!"
 tv_academy_debate.2127.t: "圣日历改革"
 tv_academy_debate.2128.a: "新课本获准送进王国的每一间教室。"
 tv_academy_debate.2128.b: "让各家塾师，各教各的吧。"
 tv_academy_debate.2128.d: "新课本送抵学院，教义与拼写表、算术题和臣民格言并排印在一处。孩子们将从同一页纸上，既学会字母，也学会王国的信纲。\n\n#Y 本事件出现是因为当前辩论议题为【认信主义】。#!"
 tv_academy_debate.2128.t: "宗派教义课本"
 tv_academy_debate.2129.a: "巡吏为朝圣定下固定的路线与时辰。"
 tv_academy_debate.2129.b: "我们把朝圣者交还给他们自己的古老规矩。"
 tv_academy_debate.2129.d: "一场朝圣在相互较劲的布道、旧徽记与新口号挤上同一条道路之后，从虔敬滑向街头暴力。学院必须判断：一项祖传旧俗，能否被约束，而不至于被折断。\n\n#Y 本事件出现是因为当前辩论议题为【认信主义】。#!"
 tv_academy_debate.2129.t: "朝圣骚乱"
 tv_academy_debate.2130.a: "我们为信纲设一座法庭，管到王国每一户人家。"
 tv_academy_debate.2130.b: "婚姻仍在一贯裁断之处了结——教会自己的法庭。"
 tv_academy_debate.2130.d: "法学家提议设立由国家承认、依宗派法律裁断的婚姻法庭。过去人家悄悄交给熟识教士处理的事，或许很快就要带着印章、书记员和一架子判例登门。\n\n#Y 本事件出现是因为当前辩论议题为【认信主义】。#!"
 tv_academy_debate.2130.t: "婚姻法庭"
 tv_academy_debate.2131.a: "宗教会议为这幅圣像定下唯一规则，就此了结。"
 tv_academy_debate.2131.b: "并非每场争执，都需一纸裁决。"
 tv_academy_debate.2131.d: "一幅教堂图像，在布道者、信众与官员都咬定它能证明己方之后，便不再只是颜料与木板。问题已不在图像是否美丽，而在谁有权断定虔敬的含义。\n\n#Y 本事件出现是因为当前辩论议题为【认信主义】。#!"
 tv_academy_debate.2131.t: "圣像之争"
 tv_academy_debate.2132.a: "君主把庇护伸到边境那头的传教士身上。"
 tv_academy_debate.2132.b: "消停些，免得一篇布道引出一场战争。"
 tv_academy_debate.2132.d: "传教士带着足以同时赢得皈依者与抗议的布道越过边境。他们的教义强化了国内辩论，可如今每一个边境村庄，都会把一段外交回声传回厅堂。\n\n#Y 本事件出现是因为当前辩论议题为【认信主义】。#!"
 tv_academy_debate.2132.t: "边境传教士"
 tv_academy_debate.2133.a: "税吏在各堂区的税册上，添了一项学校税。"
 tv_academy_debate.2133.b: "不加新税——不管我们给它起什么名目。"
 tv_academy_debate.2133.d: "官员提议为宗派学校专设一项税，声称教义教得太廉价，便会忘得太迅速。可乡里听见的是\"学校\"，心里默默盘算的，却是\"税\"。\n\n#Y 本事件出现是因为当前辩论议题为【认信主义】。#!"
 tv_academy_debate.2133.t: "信纲税"
 tv_academy_debate.2134.a: "君主把教士约束于他们所侍奉的教义之下。"
 tv_academy_debate.2134.b: "我们让教士保住本阶层的特权。"
 tv_academy_debate.2134.d: "曾以同一等级发声的教士，如今为新宗派争执不下：它究竟该把他们约束为教义的仆从，还是护他们作祖传特权的守护者？\n\n#Y 本事件出现是因为当前辩论议题为【认信主义】。#!"
 tv_academy_debate.2134.t: "教士分裂"
 tv_academy_debate.2135.a: "我们接受悔认，免了这人受辱。"
 tv_academy_debate.2135.b: "那位反对者被要求当着满堂人，跪地悔认。"
 tv_academy_debate.2135.d: "一位著名反对者表示，只要学院免去那套羞辱仪式，他便愿意悔认。有人把宽恕读作自信的证明，也有人读作一次白白错过、本可让反抗者战栗的机会。\n\n#Y 本事件出现是因为当前辩论议题为【认信主义】。#!"
 tv_academy_debate.2135.t: "公开悔认"
 tv_academy_debate.2136.a: "清查员把每个社群，一一归入各自的宗派栏目。"
 tv_academy_debate.2136.b: "入册者，易成猎物。"
 tv_academy_debate.2136.d: "官僚请求按宗派把每个社群逐一统计入册，保证工整的表格总比零散的传闻冷静。少数社群的长老心里明白（却不说破）：一栏数字，既能当工具，也一样容易变成靶子。\n\n#Y 本事件出现是因为当前辩论议题为【认信主义】。#!"
 tv_academy_debate.2136.t: "宗派户籍清查"
 tv_academy_debate.2137.a: "王室条文在每一座集市十字碑前昭告天下。"
 tv_academy_debate.2137.b: "拿回去，重新拟过。"
 tv_academy_debate.2137.d: "顾问们草拟出一套王室条文，指望它明早听来已如古训，下周听来已成天命。词句打磨得足够发亮——而发亮，与尘埃落定，全然是两回事。\n\n#Y 本事件出现是因为当前辩论议题为【认信主义】。#!"
 tv_academy_debate.2137.t: "王室信纲条文"
 tv_academy_debate.2138.a: "书记员把每一列数字念给满座听。"
 tv_academy_debate.2138.b: "我们斥之为商人的算术，翻过这一页。"
 tv_academy_debate.2138.d: "港口书记员把盐、丝绸、香料、运费与保险的账簿一列挨一列铺满学院长桌。每一个数字都在申辩：远方的价格早已管着这个国家，无论土地上的荣誉如何假装闻不到那股气味。\n\n#Y 本事件出现是因为当前辩论议题为【全球贸易】。#!"
 tv_academy_debate.2138.t: "港口账簿"
 tv_academy_debate.2139.a: "王室准许商馆区拥有仓库与守卫。"
 tv_academy_debate.2139.b: "码头上的客人，绝非码头的伙伴。"
 tv_academy_debate.2139.d: "外国商人请求在港口旁拥有仓库、住所，还有自己的守卫。这要求听着不过是务实之举——直到众人回过神来：它会让远方市场在境内落下固定地址、挂上门牌，说不定连锁都比王室的更结实。\n\n#Y 本事件出现是因为当前辩论议题为【全球贸易】。#!"
 tv_academy_debate.2139.t: "外商馆区"
 tv_academy_debate.2140.a: "我们把税目删减成商人看得懂的规则。"
 tv_academy_debate.2140.b: "熟悉的乱麻，好过陌生的秩序。"
 tv_academy_debate.2140.d: "一场海关审查翻出纠缠不清的税目：有利可图的货物被莫名其妙地惩罚，受偏爱的商品却凭习惯一路放行。整张税表，已经成了一场写满划线数字的政策争吵。\n\n#Y 本事件出现是因为当前辩论议题为【全球贸易】。#!"
 tv_academy_debate.2140.t: "关税混乱"
 tv_academy_debate.2141.a: "货物就在满堂鼻子都能评判的地方开箱。"
 tv_academy_debate.2141.b: "趁它开口作证之前，我们先给它上税。"
 tv_academy_debate.2141.d: "一批香料在学院面前开箱，室内顿时弥漫起内陆税册从未记录在案的气味。遥远的岛屿一下子不再像传闻，倒像一场沾着肉桂香、径直登门的论证。\n\n#Y 本事件出现是因为当前辩论议题为【全球贸易】。#!"
 tv_academy_debate.2141.t: "香料货物"
 tv_academy_debate.2142.a: "我们回敬一句：满仓与良田，一样为国增光。"
 tv_academy_debate.2142.b: "主席向拥有田产的诸位保证，田地仍居首位。"
 tv_academy_debate.2142.d: "内陆贵族警告说，海洋贸易正教这个国家向仓库低头，而非向田地。他们的演说打磨光洁、满含委屈，且笃信不疑：财富到底该带着翻耕过的泥土味。\n\n#Y 本事件出现是因为当前辩论议题为【全球贸易】。#!"
 tv_academy_debate.2142.t: "港口遭贵族反对"
 tv_academy_debate.2143.a: "学院将海运保险载入正式记录。"
 tv_academy_debate.2143.b: "各人淹死，各人认命。"
 tv_academy_debate.2143.d: "商人把风暴记录、沉船清单和幸存者证词摆到学院面前。他们的论点像水手长一样直白：一个想分享远洋利润的国家，得先学会分担远洋的损失。\n\n#Y 本事件出现是因为当前辩论议题为【全球贸易】。#!"
 tv_academy_debate.2143.t: "船舶保险"
 tv_academy_debate.2144.a: "书记员照走私者的门道，重画合法商路。"
 tv_academy_debate.2144.b: "一把火烧了它。"
 tv_academy_debate.2144.d: "一张缴获的地图把海湾、仓库、僻静小路和可信暗号标得一丝不苟，比任何海关簿册都上心。这个非法网络叫人难堪，难堪之处正在于——它真的管用。\n\n#Y 本事件出现是因为当前辩论议题为【全球贸易】。#!"
 tv_academy_debate.2144.t: "走私者的地图"
 tv_academy_debate.2145.a: "议事会为码头谈定一套劳工保护。"
 tv_academy_debate.2145.b: "我们清空码头，让吊机重新转起来。"
 tv_academy_debate.2145.d: "码头工人叫停了吊机、绳索、货车和喧嚷——正是这些让贸易在议事厅里显得毫不费力。他们向学院抛出一个朴素的问题：为什么商业越是扩张，每一份工钱反倒越显得单薄？\n\n#Y 本事件出现是因为当前辩论议题为【全球贸易】。#!"
 tv_academy_debate.2145.t: "码头劳工罢工"
 tv_academy_debate.2146.a: "敌手的使节在敞开的大厅里被接待。"
 tv_academy_debate.2146.b: "礼数止于门口，不许再进。"
 tv_academy_debate.2146.d: "一个敌对宫廷派来商人，携着礼物、契约草案和一番打磨到几乎能冒充友谊的恭维。每一项提议都飘着那股熟悉的淡淡气味——机会里掺着牵制。\n\n#Y 本事件出现是因为当前辩论议题为【全球贸易】。#!"
 tv_academy_debate.2146.t: "敌手的贸易使团"
 tv_academy_debate.2147.a: "商人的各式天平，让位于全国统一的标准。"
 tv_academy_debate.2147.b: "各镇自守其秤。"
 tv_academy_debate.2147.d: "商人带着天平、砝码、打印过的金属条，以及足以填满半数集镇的相互控诉走进学院。此地的欺诈已经地方化到这般地步——人们竟以\"传统\"之名替它辩护。\n\n#Y 本事件出现是因为当前辩论议题为【全球贸易】。#!"
 tv_academy_debate.2147.t: "标准度量衡"
 tv_academy_debate.2148.a: "学院把商队与船队接成一套体系。"
 tv_academy_debate.2148.b: "我们让每条路线各守其特权。"
 tv_academy_debate.2148.d: "内陆商队首领与海上船长争执，究竟哪条路线配得上王室的银钱。在学院辩论厅里，路上的尘土与海上的盐雾都被端出来当证据，证明王国必须学会把遥远的距离当作彼此相连的一体。\n\n#Y 本事件出现是因为当前辩论议题为【全球贸易】。#!"
 tv_academy_debate.2148.t: "商队与护航船队"
 tv_academy_debate.2149.a: "王室出资兴办一所航海与契约学校。"
 tv_academy_debate.2149.b: "账桌嘛，还是留在自家吧。"
 tv_academy_debate.2149.d: "市民阶层提议，把航海、契约与语言当作严肃的公共学问来教授。这念头让所有人都不安——那些宁可让商业永远做一门附带账桌的家族秘传的人，尤其如此。\n\n#Y 本事件出现是因为当前辩论议题为【全球贸易】。#!"
 tv_academy_debate.2149.t: "商人学校"
 tv_academy_debate.2150.a: "粮食继续流通，只是多了一双盯着的眼睛。"
 tv_academy_debate.2150.b: "我们关上出口的闸门，等田地缓过气来。"
 tv_academy_debate.2150.d: "一场歉收，让饥饿的城镇把每一船出口都看成叛国。商人坚称他们的契约能让明天的粮食继续流通，门口的人群却想弄明白：凭什么明天的信用，要压过今晚的面包？\n\n#Y 本事件出现是因为当前辩论议题为【全球贸易】。#!"
 tv_academy_debate.2150.t: "出口恐慌"
 tv_academy_debate.2151.a: "检疫官受训，让港口既开着又干净。"
 tv_academy_debate.2151.b: "我们把外国船只挡在防波堤外。"
 tv_academy_debate.2151.d: "检疫官员拖慢贸易，并以\"活命\"作辩护。商人说每一次延误都是失去一整季，医师则回敬：若港口卸下的下一批货是葬礼，全世界最忙的码头也一文不值。\n\n#Y 本事件出现是因为当前辩论议题为【全球贸易】。#!"
 tv_academy_debate.2151.t: "港口检疫"
 tv_academy_debate.2152.a: "王室为每一条有利可图的天际线出资护航。"
 tv_academy_debate.2152.b: "大海从不为谁保险。"
 tv_academy_debate.2152.d: "商人要护航，将领要拨款，这门亲事从没人说它便宜。学院听见一个穿着华服的简单问题：既然贸易已然全球化，国家是否非得守卫每一条为它带来利润的天际线？\n\n#Y 本事件出现是因为当前辩论议题为【全球贸易】。#!"
 tv_academy_debate.2152.t: "海军护航之辩"
 tv_academy_debate.2153.a: "我们把旧垄断上的锁一并砸开。"
 tv_academy_debate.2153.b: "行会大师们的特许状原封不动。"
 tv_academy_debate.2153.d: "海外贸易商把契约摆在城市行会特许状旁边，称那些旧垄断不过是精美的锁链。行会大师们怒发上冲，可年轻商人早已听见远方市场，正在撼动那些锁扣。\n\n#Y 本事件出现是因为当前辩论议题为【全球贸易】。#!"
 tv_academy_debate.2153.t: "行会垄断挑战"
 tv_academy_debate.2154.a: "学院为每一份契约定下统一的措辞。"
 tv_academy_debate.2154.b: "各市场自说其言。"
 tv_academy_debate.2154.d: "译员把同一份贸易契约的三种文本带到学院，其中只有一种，本可以保住那批货。众人这才后知后觉地明白：一笔财富，足以淹死在一个含混的条款里。\n\n#Y 本事件出现是因为当前辩论议题为【全球贸易】。#!"
 tv_academy_debate.2154.t: "契约语言"
 tv_academy_debate.2155.a: "我们承认，远方的价格如今在替我们掌舵。"
 tv_academy_debate.2155.b: "怪投机者，自然是怪投机者。"
 tv_academy_debate.2155.d: "海外价格变动的消息传来，本地的安排竟在官员还没说完\"外国市场远着呢\"之前就已塌了。学院听见港口之间的距离一路收缩，直到能塞进一个数字里。\n\n#Y 本事件出现是因为当前辩论议题为【全球贸易】。#!"
 tv_academy_debate.2155.t: "远方价格震荡"
 tv_academy_debate.2156.a: "王室特许设立自由港。"
 tv_academy_debate.2156.b: "我们否掉这场试验，把关卡留着。"
 tv_academy_debate.2156.d: "改革者勾勒出这样一座港口：王室不再在每道关卡扼住货流，而是向流动本身征税。海关官员斥之为鲁莽，商人却说，这才是货物一直以来如何流动的第一张诚实地图。\n\n#Y 本事件出现是因为当前辩论议题为【全球贸易】。#!"
 tv_academy_debate.2156.t: "自由港提案"
 tv_academy_debate.2157.a: "我们照图行船，不再凭老习惯。"
 tv_academy_debate.2157.b: "船长们守着父辈走过的航线。"
 tv_academy_debate.2157.d: "航海者在学院桌上展开风向图，旧航线忽然不再像传统，倒像一门扬着帆的迷信。连出声讥笑的船长，也忍不住一次次偷瞄那些线条。\n\n#Y 本事件出现是因为当前辩论议题为【全球贸易】。#!"
 tv_academy_debate.2157.t: "贸易风向图"
 tv_academy_debate.2158.a: "账房与织机被并到一个屋檐之下。"
 tv_academy_debate.2158.b: "我们让每个匠人各守各的门户。"
 tv_academy_debate.2158.d: "一名商人陈述把纺工、整饰工、账房和监工聚到同一屋檐下的理由。院门上方的钟声听起来不像工具，倒像一场新的论证：劳动该如何排布，又该由谁来排。\n\n#Y 本事件出现是因为当前辩论议题为【工厂生产】。#!"
 tv_academy_debate.2158.t: "同檐工坊"
 tv_academy_debate.2159.a: "检查员被派驻到制造工场门口。"
 tv_academy_debate.2159.b: "布好不好，织的人最清楚。"
 tv_academy_debate.2159.d: "行会师傅带来变形的布匹、易脆的器具，还有仓促到近乎控诉的收尾活。他们警告：规模既能成倍出货，也能同样麻利地成倍出错。\n\n#Y 本事件出现是因为当前辩论议题为【工厂生产】。#!"
 tv_academy_debate.2159.t: "行会师傅的控诉"
 tv_academy_debate.2160.a: "我们让这条河到水轮上做工。"
 tv_academy_debate.2160.b: "工程师被打发回家，图纸卷了起来。"
 tv_academy_debate.2160.d: "工程师勾出一套由水力驱动的工序，能拉、能捣、能转，其胃口远非人手所能填。那条河不再像风景，倒像个等着受雇的工人。\n\n#Y 本事件出现是因为当前辩论议题为【工厂生产】。#!"
 tv_academy_debate.2160.t: "水轮提案"
 tv_academy_debate.2161.a: "何必大惊小怪，给她们发工钱便是。"
 tv_academy_debate.2161.b: "用工名册对这些新雇工关上了。"
 tv_academy_debate.2161.d: "一家制造工场雇了许多女性，数目大到再不能被轻描淡写地当作家内帮工。最初只是工资问题，如今变成关于习俗、纪律，以及谁能光明正大地站进新经济的争论。\n\n#Y 本事件出现是因为当前辩论议题为【工厂生产】。#!"
 tv_academy_debate.2161.t: "织机旁的女性"
 tv_academy_debate.2162.a: "账房为每一样原料拟定长期契约。"
 tv_academy_debate.2162.b: "我们照旧让收成来定节奏。"
 tv_academy_debate.2162.d: "生产停了下来，因为羊毛、木材、染料和矿石仍按村庄习惯送来，而不是按制造工场的胃口。工作台闲着等，乡间却坚持：供应自有季节、邻里，还有旧日的义务。\n\n#Y 本事件出现是因为当前辩论议题为【工厂生产】。#!"
 tv_academy_debate.2162.t: "原料瓶颈"
 tv_academy_debate.2163.a: "王权把防火隔离与检查写进了工场章程。"
 tv_academy_debate.2163.b: "火星聚一处，便是柴堆。"
 tv_academy_debate.2163.d: "一场作坊大火留下焦黑的梁木、毁掉的存货，还有一群早已在给火焰下定论的目击者。有人从集中生产本身读出危险，也有人从无人看管的集中生产里读出危险。\n\n#Y 本事件出现是因为当前辩论议题为【工厂生产】。#!"
 tv_academy_debate.2163.t: "院中失火"
 tv_academy_debate.2164.a: "钟铃挂了起来，一天照着它们的刻度被切开。"
 tv_academy_debate.2164.b: "消停些吧，别让时辰都成了狱卒。"
 tv_academy_debate.2164.d: "管事把钟和铃挂在从前只靠习惯运转的地方。工人很快学到：时间也能被立成一名监工，一个既没耐心、也不用睡觉的监工。\n\n#Y 本事件出现是因为当前辩论议题为【工厂生产】。#!"
 tv_academy_debate.2164.t: "钟表纪律"
 tv_academy_debate.2165.a: "每一家作坊都被绑定到同一份规格上。"
 tv_academy_debate.2165.b: "我们宁可留着每家供应商各自的手法。"
 tv_academy_debate.2165.d: "军队开出一份大到让每个作坊主把工台数上两遍的合同。条件很直白：王权要的是彼此一致的零件与布匹，而不是各镇各有风味的差异。\n\n#Y 本事件出现是因为当前辩论议题为【工厂生产】。#!"
 tv_academy_debate.2165.t: "军需合同"
 tv_academy_debate.2166.a: "纹章一条规矩，工台也是这条规矩。"
 tv_academy_debate.2166.b: "纹章获准豁免，市民则被驳回。"
 tv_academy_debate.2166.d: "一处贵族庄园满怀自信地开起大作坊，却在市民也要同样的自由时立刻反对。学院被请去裁断：难道规模化只有戴上纹章才算体面？\n\n#Y 本事件出现是因为当前辩论议题为【工厂生产】。#!"
 tv_academy_debate.2166.t: "贵族庄园作坊"
 tv_academy_debate.2167.a: "学院给工作台定下年龄，再让活计继续。"
 tv_academy_debate.2167.b: "不行，不能用这样的手。"
 tv_academy_debate.2167.d: "堂区领袖带着姓名、年岁，以及一双双辩论此前不愿细想的小手来到学院。问题不再是制造工场能否生产更多，而是它被允许消耗怎样的劳动。\n\n#Y 本事件出现是因为当前辩论议题为【工厂生产】。#!"
 tv_academy_debate.2167.t: "童工请愿"
 tv_academy_debate.2168.a: "学院认可那些只对量规、不对姓名负责的部件。"
 tv_academy_debate.2168.b: "我们留住匠人亲手打下的记号。"
 tv_academy_debate.2168.d: "工匠们摆出一排整齐的部件，它们能毫无怨言地彼此互换。半个会场看见更快的维修、更稳的供应；另一半却听见个人手艺的静默丧钟。\n\n#Y 本事件出现是因为当前辩论议题为【工厂生产】。#!"
 tv_academy_debate.2168.t: "标准部件"
 tv_academy_debate.2169.a: "我们用作坊自己的账册来管作坊。"
 tv_academy_debate.2169.b: "业主把自己的账目栏留给自己看。"
 tv_academy_debate.2169.d: "会计把废料、迟误、损耗和闲置的钟点排成整齐得像控诉的栏目。曾藏在尘土与习惯里的东西，如今成了关于管理、纪律与追责的公共问题。\n\n#Y 本事件出现是因为当前辩论议题为【工厂生产】。#!"
 tv_academy_debate.2169.t: "工厂账册"
 tv_academy_debate.2170.a: "王权掏钱缓冲村庄，任工台一点点填满。"
 tv_academy_debate.2170.b: "慢些来，别把田都掏空了。"
 tv_academy_debate.2170.d: "农民代表抱怨，工场的需求把劳力从田里拽走，也把女儿们从家庭安排里带走。学院听见的不只是对生产的抱怨，而是整个乡村秩序的吱呀作响。\n\n#Y 本事件出现是因为当前辩论议题为【工厂生产】。#!"
 tv_academy_debate.2170.t: "乡村流离"
 tv_academy_debate.2171.a: "学院把机器拆开，好造出自己的一台。"
 tv_academy_debate.2171.b: "外来的铁，牵着外来的手。"
 tv_academy_debate.2171.d: "一台外国机器被搬进学院，螺栓陌生，野心却熟悉得很。赞成者看见一套可以仿制的设计，反对者则看见另一个国家把金属之手伸进本地工坊。\n\n#Y 本事件出现是因为当前辩论议题为【工厂生产】。#!"
 tv_academy_debate.2171.t: "舶来机器"
 tv_academy_debate.2172.a: "王权出钱装更干净的烟道，任炉火照烧。"
 tv_academy_debate.2172.b: "我们把炉子赶到城墙外去。"
 tv_academy_debate.2172.d: "城里人提醒学院：能带来产量的烟，终究还是烟。窗台、肺，还有晾衣绳，一并被传作证人，反驳那种以为产出增加便自证清白的理论。\n\n#Y 本事件出现是因为当前辩论议题为【工厂生产】。#!"
 tv_academy_debate.2172.t: "煤烟之争"
 tv_academy_debate.2173.a: "账房给每件成品定价，把工价贴了出来。"
 tv_academy_debate.2173.b: "够了，工钱不是记数。"
 tv_academy_debate.2173.d: "业主提议按件付薪，于是每一匹织好的布、每一件磨亮的工具、每一箱封好的货，既是工资，也是责备。工人听见算术正想变成监工。\n\n#Y 本事件出现是因为当前辩论议题为【工厂生产】。#!"
 tv_academy_debate.2173.t: "计件工资"
 tv_academy_debate.2174.a: "制造工场在自家门口办起了学校。"
 tv_academy_debate.2174.b: "我们把学徒送回行会师傅那里。"
 tv_academy_debate.2174.d: "改革者提议在制造工场内部训练工人，让课程从工作台开讲，以一批可计数的成品收尾。行会师傅立刻察觉：学徒制正被要求把自己的语汇借出去。\n\n#Y 本事件出现是因为当前辩论议题为【工厂生产】。#!"
 tv_academy_debate.2174.t: "工场学校"
 tv_academy_debate.2175.a: "学院搭上自己的名声，去修补检验环节。"
 tv_academy_debate.2175.b: "我们说，毛病就出在这规模本身。"
 tv_academy_debate.2175.d: "一大批货物当众没能过检：缝线绽开，配件崩断，反对规模化的人几乎要谢过这份证据。眼下的问题是：这次失败定罪的是整套制度，还是只是检验者。\n\n#Y 本事件出现是因为当前辩论议题为【工厂生产】。#!"
 tv_academy_debate.2175.t: "质量丑闻"
 tv_academy_debate.2176.a: "王权准许商人把各自的钱袋并成一个。"
 tv_academy_debate.2176.b: "我们不会让一个委员会攥住整个行当。"
 tv_academy_debate.2176.d: "商人提议合资筹集一笔足以立起制造工场的资本，大到任何单一家族都无法独掌。这笔钱来时不像一个钱袋，倒像一群带着账本与耐心的委员。\n\n#Y 本事件出现是因为当前辩论议题为【工厂生产】。#!"
 tv_academy_debate.2176.t: "商人资本池"
 tv_academy_debate.2177.a: "也罢，就让汽笛来守着钟点。"
 tv_academy_debate.2177.b: "地方官下令让汽笛停下。"
 tv_academy_debate.2177.d: "一只新的工场汽笛以令人赞叹的效率、也以令人难忍的确定，切开一天。它告诉工人何时开工，告诉邻人何时抱怨，也告诉改革者：纪律隔着三条街也听得见。\n\n#Y 本事件出现是因为当前辩论议题为【工厂生产】。#!"
 tv_academy_debate.2177.t: "第一声汽笛"
 tv_academy_debate.2178.a: "书吏把记录表一行行誊入卷宗，任那些数字自己说话。"
 tv_academy_debate.2178.b: "一燕不成夏。"
 tv_academy_debate.2178.d: "一栏又一栏的重复观察记录被摆到学院面前，每一条都平淡得难以炫目，却又一致得无法挥手带过。古老的权威仍然镇得住全场，可这些数字，已经悄悄不再向他们低头了。\n\n#Y 本事件出现是因为当前辩论议题为【科学革命】。#!"
 tv_academy_debate.2178.t: "观察记录表"
 tv_academy_debate.2179.a: "书记员把这次一无所获的结果，紧挨着那项著名成果一并刊印。"
 tv_academy_debate.2179.b: "我们让那项著名成果，再多保住一阵名声。"
 tv_academy_debate.2179.d: "一项备受称颂的结果在谨慎的见证者面前被重新试验，却干脆不肯现身。空手而归后的沉默令人窘迫，可它也是会场整整一周里听到的第一声全然诚实的声音。\n\n#Y 本事件出现是因为当前辩论议题为【科学革命】。#!"
 tv_academy_debate.2179.t: "复验失败"
 tv_academy_debate.2180.a: "符号指向哪里，我们就跟到哪里。"
 tv_academy_debate.2180.b: "粉笔画得再满，也不是智慧。"
 tv_academy_debate.2180.d: "一名数学家把争议中的自然问题化为极其简练的符号，简练得让好几位官员觉得那份清晰是在当面指控自己。原本被当作哲学的东西，如今在纸面上化作一串必然，一环紧扣一环，毫不留情。\n\n#Y 本事件出现是因为当前辩论议题为【科学革命】。#!"
 tv_academy_debate.2180.t: "数学证明"
 tv_academy_debate.2181.a: "司库数出银钱，买下镜片、螺丝与黄铜。"
 tv_academy_debate.2181.b: "净是些玩意儿罢了。"
 tv_academy_debate.2181.d: "一名仪器匠带着镜片、螺丝和黄铜部件走了进来，还带着一种笃定的从容——他早已认定，学者们不过是需要一双更好的手罢了。他坚称，更好的工具造出的不是更好的玩具，而是更好的真理。\n\n#Y 本事件出现是因为当前辩论议题为【科学革命】。#!"
 tv_academy_debate.2181.t: "仪器匠的主张"
 tv_academy_debate.2182.a: "书记员划好表格的栏目，把笔递过去要人签字。"
 tv_academy_debate.2182.b: "比起书记员的表格，我们更愿意相信一位绅士的一句话。"
 tv_academy_debate.2182.d: "改革者提议制定一套见证、记录与重复实验的守则——表格、签名，外加足以让每一位随性天才对着袖口叹气的繁琐程序。他们主张：信任也该留下纸面的痕迹。\n\n#Y 本事件出现是因为当前辩论议题为【科学革命】。#!"
 tv_academy_debate.2182.t: "学院实验守则"
 tv_academy_debate.2183.a: "仰观星空，我们不必先向上天请示。"
 tv_academy_debate.2183.b: "学者们修剪这套模型，直到它不再惊动讲坛为止。"
 tv_academy_debate.2183.d: "神职人员警告说，新的天体模型重新排布的，远不止是星辰。若天空可以凭观察来争辩，那么讲坛、法庭与王冠，迟早都可能被追问：它们还有多少东西，只是未经证明便继承了下来。\n\n#Y 本事件出现是因为当前辩论议题为【科学革命】。#!"
 tv_academy_debate.2183.t: "神职宇宙论异议"
 tv_academy_debate.2184.a: "报事人把这项计算，连同它的应验，一路喊遍街巷。"
 tv_academy_debate.2184.b: "不过是碰巧猜中，仅此而已。"
 tv_academy_debate.2184.d: "一项计算指名道姓地预告了某场自然现象发生的时刻，而那现象竟准时得令人不安。有那么漫长的一瞬，连怀疑者都不得不掂量：巧合是不是近来也开始钻研数学了。\n\n#Y 本事件出现是因为当前辩论议题为【科学革命】。#!"
 tv_academy_debate.2184.t: "预言成真"
 tv_academy_debate.2185.a: "工匠给实验台装上新的防护，接着点起了下一场试验。"
 tv_academy_debate.2185.b: "我们扑灭火头，把实验室的门锁上。"
 tv_academy_debate.2185.d: "一场演示轰然炸开，那股力道至少解决了一个问题：实验究竟有没有能量。烟雾顺着屋梁飘散，两边却都抢着把这堆残骸说成对自己有利的证据。\n\n#Y 本事件出现是因为当前辩论议题为【科学革命】。#!"
 tv_academy_debate.2185.t: "实验室事故"
 tv_academy_debate.2186.a: "名册把这名工匠的成果，与那些博学之人的成果并列在册。"
 tv_academy_debate.2186.b: "手粗，证据也粗。"
 tv_academy_debate.2186.d: "一名工匠用一个下午，解决了学者们花数周时间用拉丁文精心包装的实际难题。当他的工具箱往桌上一放，几篇文采斐然的注释，忽然显得沉重得可以。\n\n#Y 本事件出现是因为当前辩论议题为【科学革命】。#!"
 tv_academy_debate.2186.t: "工匠的知识"
 tv_academy_debate.2187.a: "抽屉如何排列，我们听凭眼睛所见，而非书本所定。"
 tv_academy_debate.2187.b: "管理员让每一件标本，都留在它继承下来的标签之下。"
 tv_academy_debate.2187.d: "收藏家提议建一座陈列柜，把贝壳、骨骼、种子与石块，按亲眼所见的相似之处来排列，而不是按继承下来的类别摆放。旧标签仍能整整齐齐地滑进抽屉——而这，恰恰就是麻烦所在。\n\n#Y 本事件出现是因为当前辩论议题为【科学革命】。#!"
 tv_academy_debate.2187.t: "自然史陈列柜"
 tv_academy_debate.2188.a: "信使带着未封缄的书信策马而出，送往各家学院。"
 tv_academy_debate.2188.b: "一页纸也别想出这道墙。"
 tv_academy_debate.2188.d: "科学家请求在竞争者抢先之前，把书信与成果跨越国界发表出去。原本在私下流动的墨迹，如今俨然成了一场竞赛，要判定真理究竟属于戒备森严的密室，还是属于所有来得及回信的人。\n\n#Y 本事件出现是因为当前辩论议题为【科学革命】。#!"
 tv_academy_debate.2188.t: "公开通信"
 tv_academy_debate.2189.a: "印刷匠照原样把这条脚注排入铅字。"
 tv_academy_debate.2189.b: "我们删去这条脚注，让那位大师安然无扰。"
 tv_academy_debate.2189.d: "一位备受尊崇的权威，在一条彬彬有礼得近乎残忍的脚注里遭到了反驳。那一页几乎没有高声宣告什么，可每一个维护旧学问的人，却仿佛隔着整座大厅都听得一清二楚。\n\n#Y 本事件出现是因为当前辩论议题为【科学革命】。#!"
 tv_academy_debate.2189.t: "旧大师遭到反驳"
 tv_academy_debate.2190.a: "我们把名声当众押在这次结果上。"
 tv_academy_debate.2190.b: "门依旧紧闭，试验仍留在里屋进行。"
 tv_academy_debate.2190.d: "首席科学家想办一场公开实验，让失败无处遁形。这个提议让旁听席兴奋不已，也让所有宁愿把不确定性锁在闭门之后的人，心里发怵。\n\n#Y 本事件出现是因为当前辩论议题为【科学革命】。#!"
 tv_academy_debate.2190.t: "公开演示"
 tv_academy_debate.2191.a: "学院为各省铸下同一把尺、同一个砝码、同一套量器。"
 tv_academy_debate.2191.b: "各省的尺子，就由它各自留着吧。"
 tv_academy_debate.2191.d: "研究者抱怨说，每个省份都用不同的工具、外加同样多的自尊，来衡量自然。学院终于明白：当每一把尺、每一个砝码、每一只量器都执意说着自己的方言时，一个事实能走出的距离，其实短得可怜。\n\n#Y 本事件出现是因为当前辩论议题为【科学革命】。#!"
 tv_academy_debate.2191.t: "度量标准"
 tv_academy_debate.2192.a: "登记员把每一次失败，都归入与成功同放的卷宗。"
 tv_academy_debate.2192.b: "为了名声，我们把失败自己收着。"
 tv_academy_debate.2192.d: "学者提议把错误也当作数据来研究，这个提议悄悄威胁到了许多人的仕途。转眼之间，每一次算砸的运算、每一片裂开的镜片、每一份变质的样本，都不再那么像耻辱，倒更像是来得不合时宜的证据。\n\n#Y 本事件出现是因为当前辩论议题为【科学革命】。#!"
 tv_academy_debate.2192.t: "解剖错误"
 tv_academy_debate.2193.a: "石匠垒起高塔，守夜人领着薪俸，值起了一夜又一夜。"
 tv_academy_debate.2193.b: "晴夜一宿，借片屋顶也就够了。"
 tv_academy_debate.2193.d: "天文学家请求建一座常设的天文台，因为天空执拗得很，从不肯走进室内来参加会议。一座高塔、一套仪器，加上受薪的守夜人，能把零散夜晚里的争论，变成一门稳稳站住的学问。\n\n#Y 本事件出现是因为当前辩论议题为【科学革命】。#!"
 tv_academy_debate.2193.t: "皇家天文台"
 tv_academy_debate.2194.a: "会场把这具转动的模型，作为证据记入卷宗。"
 tv_academy_debate.2194.b: "我们赞叹一番这件玩意儿，随后把它放回图解堆里。"
 tv_academy_debate.2194.d: "一名机械匠把一具模型摆上桌面，转动曲柄。齿轮把一个看不见的自然过程，翻译成了明明白白的运动，满屋子人还没来得及端起架子，身子已经先探了过去。\n\n#Y 本事件出现是因为当前辩论议题为【科学革命】。#!"
 tv_academy_debate.2194.t: "机械匠的模型"
 tv_academy_debate.2195.a: "付印吧，此后爱落到谁头上，就落到谁头上。"
 tv_academy_debate.2195.b: "手稿被收回抽屉，等资助人的火气平息下去。"
 tv_academy_debate.2195.d: "一部论著已经备好，只待交给印刷匠——它锋利得足以推翻一条旧教义，也昂贵得足以冒犯几乎每一个资助学院的人。纸页早已干透，唯一还没干的，是那份勇气。\n\n#Y 本事件出现是因为当前辩论议题为【科学革命】。#!"
 tv_academy_debate.2195.t: "危险的出版"
 tv_academy_debate.2196.a: "谁如实报出仪器所示，我们便立誓护他周全。"
 tv_academy_debate.2196.b: "师长们提醒助手：各安其位，莫忘本分。"
 tv_academy_debate.2196.d: "助手们请求得到保护，以防结果违背了资助人、导师，或是王室钟爱的那套理论。他们愿意诚实地测量，却不愿只因如实说出仪器分明显示的东西，就毁掉自己的前程。\n\n#Y 本事件出现是因为当前辩论议题为【科学革命】。#!"
 tv_academy_debate.2196.t: "实验誓约"
 tv_academy_debate.2197.a: "这个词被写进卷宗，这场运动，就此有了名字。"
 tv_academy_debate.2197.b: "还是先别急着给它安名字。"
 tv_academy_debate.2197.d: "有人给这套方法取了个名字，一簇松散的习惯，转眼之间就成了一场运动。支持者如释重负地念着这个词，反对者则警惕地念着它，而犹疑者念起它时，隐隐生出一种不安：历史，也许就要用得上一个标签了。\n\n#Y 本事件出现是因为当前辩论议题为【科学革命】。#!"
 tv_academy_debate.2197.t: "新方法得名"
