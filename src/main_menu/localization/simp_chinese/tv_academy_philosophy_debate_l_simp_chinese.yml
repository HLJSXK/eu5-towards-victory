 tv_academy_debate.120.a: "记录这项结论。"
 tv_academy_debate.120.d: "世界辩论已经形成排斥当前哲学议题的结论。本国科学院据此结束该议题，并继续推进哲学序列。"
 tv_academy_debate.120.t: "世界辩论走向排斥"
 tv_academy_debate.121.a: "将档案封存。"
 tv_academy_debate.121.d: "世界辩论未能形成明确结论。本国科学院将当前哲学议题归档，继续推进哲学序列。"
 tv_academy_debate.121.t: "世界辩论无果而终"
 tv_academy_debate.122.a: "记录这次转向。"
 tv_academy_debate.122.d: "本月的政治与社会条件改变了圆桌上的部分立场。至少一个辩论席位已经转向支持当前哲学议题。"
 tv_academy_debate.122.t: "辩论席位转向支持"
 tv_academy_debate.123.a: "记录这次转向。"
 tv_academy_debate.123.d: "本月的政治与社会条件改变了圆桌上的部分立场。至少一个辩论席位已经转向反对当前哲学议题。"
 tv_academy_debate.123.t: "辩论席位转向反对"
 tv_academy_debate.124.a: "记录这次转向。"
 tv_academy_debate.124.d: "本月的政治与社会条件改变了圆桌上的部分立场。至少一个辩论席位已经不再明确支持或反对当前哲学议题。"
 tv_academy_debate.124.t: "辩论席位转向中立"
 tv_academy_debate.125.a: "记录这次空缺。"
 tv_academy_debate.125.d: "圆桌上的一名特殊参与者已经无法继续出席。本月的清理将对应辩论席位腾空。"
 tv_academy_debate.125.t: "辩论席位空缺"
 tv_academy_debate.2000.a: "公布摘要。"
 tv_academy_debate.2000.b: "删去危险段落。"
 tv_academy_debate.2000.d: "三天缠绕不清的论辩之后，主席把争点压成一份连后排听众也能读懂的简报。众人一旦看清真正的分歧，室内的气氛立刻改变。"
 tv_academy_debate.2000.t: "主席的摘要"
 tv_academy_debate.2001.a: "继续开放大门。"
 tv_academy_debate.2001.b: "清空旁听席。"
 tv_academy_debate.2001.d: "学生、书记员、闲散贵族，以及一些听力好得可疑的市民挤满旁听席。每一句有力的话都会传得比发言者预想的更远。"
 tv_academy_debate.2001.t: "拥挤的旁听席"
 tv_academy_debate.2002.a: "公开更正。"
 tv_academy_debate.2002.b: "任由含混发挥作用。"
 tv_academy_debate.2002.d: "一句抄自权威著作的话看起来支持新论点。措辞太过方便，墨迹又太新，几位学者忽然对笔迹产生了浓厚兴趣。"
 tv_academy_debate.2002.t: "有用的误引"
 tv_academy_debate.2003.a: "将旧批注视为证据。"
 tv_academy_debate.2003.b: "质疑批注的权威。"
 tv_academy_debate.2003.d: "学院图书馆里翻出一部旧注释，页边的批注锋利得足以被双方同时当作武器。到正午时，所有人都声称那位已故注释者站在自己一边。"
 tv_academy_debate.2003.t: "旧书页边的批注"
 tv_academy_debate.2004.a: "准许讲课。"
 tv_academy_debate.2004.b: "保留他们的精力。"
 tv_academy_debate.2004.d: "议厅渐渐散去时，首席科学家提议在烛火燃尽前召集几位关键听众。只要有人承担这个夜晚的代价，困惑仍可被转化为信念。"
 tv_academy_debate.2004.t: "黄昏的私人讲课"
 tv_academy_debate.2005.a: "提交详尽记录"
 tv_academy_debate.2005.b: "让争论保持非正式"
 tv_academy_debate.2005.d: "在学院的争论影响政策之前，各部文吏要求取得足以归档、引用并拖延程序的详尽记录。"
 tv_academy_debate.2005.t: "各部所需的会议记录"
 tv_academy_debate.2006.a: "加上序言"
 tv_academy_debate.2006.b: "拒绝序言"
 tv_academy_debate.2006.d: "宗教人士要求在任何人敢称这项争议主张为智慧之前，先为它包上一层道德上的谨慎说明。"
 tv_academy_debate.2006.t: "道德序言"
 tv_academy_debate.2007.a: "接受认捐"
 tv_academy_debate.2007.b: "拒绝商业喧嚣"
 tv_academy_debate.2007.d: "市民商人愿意资助小册子、抄写笔记和咖啡馆讨论，条件是他们的名字要离标题足够近。"
 tv_academy_debate.2007.t: "商人认捐"
 tv_academy_debate.2008.a: "让他们争辩"
 tv_academy_debate.2008.b: "禁止集会"
 tv_academy_debate.2008.d: "学生们自行举办了一场辩论，并证明热情有时确实比准备更响亮。"
 tv_academy_debate.2008.t: "学生论辩"
 tv_academy_debate.2009.a: "当众朗读。"
 tv_academy_debate.2009.b: "悄悄归档。"
 tv_academy_debate.2009.d: "一位外国学者寄来措辞谨慎的书信，它像证据一样被折好，却像流言一样被传读。信中的论证足以帮助学院，也足够\"外来\"，让每个听众都怀疑公开朗读究竟会让谁得利。"
 tv_academy_debate.2009.t: "海外来信"
 tv_academy_debate.2010.a: "相信演示。"
 tv_academy_debate.2010.b: "称其仍属初步。"
 tv_academy_debate.2010.d: "一件能够运作的仪器被抬进辩论厅，摆在理论再也无法假装孤身作战的位置。齿轮、镜片或刻度未必能解决所有问题，却足以让旧有的抽象说法冒汗。"
 tv_academy_debate.2010.t: "会场中的仪器"
 tv_academy_debate.2011.a: "任由歌谣流传。"
 tv_academy_debate.2011.b: "压制这首歌。"
 tv_academy_debate.2011.d: "这项议题化作一首街头歌谣逃出了学院，一半是误解，一半是动员。到日落时，许多说不出命题名称的人已经会哼其中最尖刻的一句。"
 tv_academy_debate.2011.t: "街头歌谣"
 tv_academy_debate.2012.a: "支持新论证。"
 tv_academy_debate.2012.b: "支持旧解读。"
 tv_academy_debate.2012.d: "一位受人尊重的反对者依照严密规则挑战新主张，严密到任何回避都会显形。大厅安静下来，并非怒气消散，而是因为每个人都能数清交锋的回合。"
 tv_academy_debate.2012.t: "正式挑战"
 tv_academy_debate.2013.a: "强行作出决定"
 tv_academy_debate.2013.b: "暂且延期"
 tv_academy_debate.2013.d: "人人都明白，再辩一个月只会让发言更长，而不会让理由更好。委员会已经开始打磨反对意见，而不是检验它们。"
 tv_academy_debate.2013.t: "委员会疲惫"
 tv_academy_debate.2014.a: "资助新的译本"
 tv_academy_debate.2014.b: "保留传统措辞"
 tv_academy_debate.2014.d: "同一个关键词的两种译法，为国家勾勒出两个不同的未来。双方都坚称，对方不仅译错了词，也译错了时代。"
 tv_academy_debate.2014.t: "译词之争"
 tv_academy_debate.2015.a: "展出这幅作品"
 tv_academy_debate.2015.b: "让艺术远离教义"
 tv_academy_debate.2015.d: "一位艺术家把议题画成一幅格外偏爱新意的场景，连反对者也停下来端详色彩。争论仿佛学会了披上光线。"
 tv_academy_debate.2015.t: "画布上的寓言"
 tv_academy_debate.2016.a: "冷静调查"
 tv_academy_debate.2016.b: "扣押文书"
 tv_academy_debate.2016.d: "一封密封的指控声称这场辩论不是阴谋，就是虚荣，或者两者兼有。字迹恰好无人认得，屋里的人忽然都开始留意门口。"
 tv_academy_debate.2016.t: "匿名告发"
 tv_academy_debate.2017.a: "让他们继续开会"
 tv_academy_debate.2017.b: "体面休会"
 tv_academy_debate.2017.d: "烛光之下，疲惫的反对者无意中承认了哪些论点已经无法否认。还没有人称之为同意，但所有人都听见了它的轮廓。"
 tv_academy_debate.2017.t: "午夜后的共识"
 tv_academy_debate.2018.a: "采用匿名评分。"
 tv_academy_debate.2018.b: "保留姓名可见。"
 tv_academy_debate.2018.d: "考官提议在评判前抹去试卷上的姓名。门第抱怨说，墨水竟然变得盲目了。"
 tv_academy_debate.2018.t: "匿名考试"
 tv_academy_debate.2019.a: "质疑这些家谱。"
 tv_academy_debate.2019.b: "表彰世袭服务。"
 tv_academy_debate.2019.d: "大族带来打磨精美的家谱，想证明服务可以像银器一样世代相传。"
 tv_academy_debate.2019.t: "桌上的族谱"
 tv_academy_debate.2020.a: "邀请其入朝。"
 tv_academy_debate.2020.b: "遥致嘉奖。"
 tv_academy_debate.2020.d: "一名来自遥远省份的候选人，解决了宫廷宠臣们回避数周的问题。"
 tv_academy_debate.2020.t: "外省奇才"
 tv_academy_debate.2021.a: "揭露这笔交易。"
 tv_academy_debate.2021.b: "接受这项安排。"
 tv_academy_debate.2021.d: "辩论期间，一项肥缺被悄悄许给某位捐献者的儿子。"
 tv_academy_debate.2021.t: "买来的官职"
 tv_academy_debate.2022.a: "承认战场功绩。"
 tv_academy_debate.2022.b: "维护贵族指挥特权。"
 tv_academy_debate.2022.d: "军官们主张，炮火下赢得的指挥资格应当比古老姓氏更有分量。"
 tv_academy_debate.2022.t: "战场上的功绩"
 tv_academy_debate.2023.a: "要求公开考核。"
 tv_academy_debate.2023.b: "准许这份人情。"
 tv_academy_debate.2023.d: "王室教师请求为一位聪慧的侄子谋取内阁职位，只是所有见证者似乎更确信那层亲缘，而不是那份聪慧。"
 tv_academy_debate.2023.t: "王室教师的侄子"
 tv_academy_debate.2024.a: "能力优先。"
 tv_academy_debate.2024.b: "接受道德证明。"
 tv_academy_debate.2024.d: "教士们提出，任何人担任公职前都应取得道德证明，让德行成为能力必须请求许可的门槛。"
 tv_academy_debate.2024.t: "教士证明"
 tv_academy_debate.2025.a: "加入实务测试。"
 tv_academy_debate.2025.b: "保留古典资历。"
 tv_academy_debate.2025.d: "城市行会愿为会计、工程师和书记员提供实务试炼，坚持认为能稳稳处理真活的手，足以证明漂亮引文证明不了的东西。"
 tv_academy_debate.2025.t: "行会测试"
 tv_academy_debate.2026.a: "接纳请愿。"
 tv_academy_debate.2026.b: "交还地方当局。"
 tv_academy_debate.2026.d: "一位乡村塾师问，生在茅屋下的才智是否仍算才智；这个问题带着泥点走进了辩论厅。"
 tv_academy_debate.2026.t: "农民的请愿"
 tv_academy_debate.2027.a: "任其抵制。"
 tv_academy_debate.2027.b: "暂停排名。"
 tv_academy_debate.2027.d: "几个贵族家族威胁说，如果公开排名继续推进，就让他们的儿子退出学院，仿佛缺席本身就是论据。"
 tv_academy_debate.2027.t: "旧家族的抵制"
 tv_academy_debate.2028.a: "清洗考官队伍。"
 tv_academy_debate.2028.b: "只悄悄作废最严重的试卷。"
 tv_academy_debate.2028.d: "一份泄露的标准答案显示，只要钱袋足够体面，所谓才能也能被漂亮笔迹模仿出来。"
 tv_academy_debate.2028.t: "考试舞弊"
 tv_academy_debate.2029.a: "张贴排名。"
 tv_academy_debate.2029.b: "保持排名私密。"
 tv_academy_debate.2029.d: "改革者希望把结果张贴在每个家族都能看见的地方，让他们明白哪些东西并非影响力可以买到。"
 tv_academy_debate.2029.t: "公开排名榜"
 tv_academy_debate.2030.a: "允许地方语言作答。"
 tv_academy_debate.2030.b: "要求使用宫廷文体。"
 tv_academy_debate.2030.d: "省份候选人请求用地方行政语言作答，而不是用宫廷风格行文。"
 tv_academy_debate.2030.t: "地方语言答卷"
 tv_academy_debate.2031.a: "以这次失败作为证据。"
 tv_academy_debate.2031.b: "保护该官职。"
 tv_academy_debate.2031.d: "一名世袭官员正好在辩论声称应被测试的任务上当众失败。"
 tv_academy_debate.2031.t: "世袭官职危机"
 tv_academy_debate.2032.a: "开放教席竞争。"
 tv_academy_debate.2032.b: "确认赞助人权利。"
 tv_academy_debate.2032.d: "学院学者要求教职通过竞争取得，而不是从赞助人手中继承。"
 tv_academy_debate.2032.t: "学者要求公开教席"
 tv_academy_debate.2033.a: "将服役年限计入任官考量。"
 tv_academy_debate.2033.b: "保持文职任命独立。"
 tv_academy_debate.2033.d: "老兵们询问，多年纪律严明的服役究竟算不算功绩，还是只算一身旧伤。"
 tv_academy_debate.2033.t: "老兵服役名册"
 tv_academy_debate.2034.a: "让结果照常生效。"
 tv_academy_debate.2034.b: "命令重新考核。"
 tv_academy_debate.2034.d: "一名受宠候选人在监督试炼中表现糟糕，而且人人都看见了。"
 tv_academy_debate.2034.t: "王冠的宠儿失败了"
 tv_academy_debate.2035.a: "公开作废这些试卷。"
 tv_academy_debate.2035.b: "掩埋这场调查。"
 tv_academy_debate.2035.d: "调查者发现，卷面最干净的试卷出自最肮脏的庇护网络。"
 tv_academy_debate.2035.t: "清白墨迹，肮脏之手"
 tv_academy_debate.2036.a: "承认这所学校。"
 tv_academy_debate.2036.b: "要求首都认证。"
 tv_academy_debate.2036.d: "一所省立学校声称，它无需宫廷润饰也能培养官员。"
 tv_academy_debate.2036.t: "首都之外的学校"
 tv_academy_debate.2037.a: "宣誓保护考官。"
 tv_academy_debate.2037.b: "拒绝激怒大族。"
 tv_academy_debate.2037.d: "考官们要求王冠在他们公布结果前保护他们免受贵族报复。"
 tv_academy_debate.2037.t: "考官之誓"
 tv_academy_debate.2038.a: "在学院展出它。"
 tv_academy_debate.2038.b: "将它作为珍品收藏。"
 tv_academy_debate.2038.d: "工匠掘出一具古代大理石残躯，四肢虽断，论证却完整得令人不安。艺术家围在它周围，坚持说石头已经回答了注疏一再拖延的问题。"
 tv_academy_debate.2038.t: "新发现的残躯"
 tv_academy_debate.2039.a: "准许这堂课。"
 tv_academy_debate.2039.b: "禁止这场展示。"
 tv_academy_debate.2039.d: "医师请求在廷臣与学者面前举行一场获准的解剖课。旧图依然端正地摆在桌上，但医师提醒众人，端正从来不能让身体变得真实。"
 tv_academy_debate.2039.t: "宫廷前的解剖"
 tv_academy_debate.2040.a: "赞扬这种方法。"
 tv_academy_debate.2040.b: "要求沿用传统形式。"
 tv_academy_debate.2040.d: "一位画家展示了新的礼拜堂设计，拱券、圣像与阴影都服从同一个可测量的消失点。有人说这是更清晰的虔敬，也有人说几何站得离祭坛太近了。"
 tv_academy_debate.2040.t: "礼拜堂中的透视"
 tv_academy_debate.2041.a: "扩大宫廷赞助。"
 tv_academy_debate.2041.b: "将赞助保持为礼仪事务。"
 tv_academy_debate.2041.d: "艺术家带来一本账簿，列出哪些工坊在赞助到来后发生改变，哪些布道只是在作品已经雕好、画好、交付之后才赞美变化。账簿暗示，灵感也有司库。"
 tv_academy_debate.2041.t: "赞助账册"
 tv_academy_debate.2042.a: "邀请其公开讲学。"
 tv_academy_debate.2042.b: "让导师留在私人场合。"
 tv_academy_debate.2042.d: "一位人文主义导师主张，统治者阅读历史应当是为了受教，而不是为了装点门面。几位贵族一听见'受教'二字，立刻开始怀疑是谁要被教着放下旧习惯。"
 tv_academy_debate.2042.t: "人文主义导师"
 tv_academy_debate.2043.a: "让市场读下去。"
 tv_academy_debate.2043.b: "只准学者持有抄本。"
 tv_academy_debate.2043.d: "廉价的古典诗篇抄本出现在账簿和咸鱼旁边。学院发现，当普通人以市价买下旧作者时，那些旧文字听起来便不再只属于书斋。"
 tv_academy_debate.2043.t: "市场上的古典诗篇"
 tv_academy_debate.2044.a: "捍卫艺术探究。"
 tv_academy_debate.2044.b: "站在神学一边。"
 tv_academy_debate.2044.d: "一位艺术家和一位神学家争论美究竟能教人认识真理，还是只会让灵魂分心。学院听着笔触与教义彼此指责对方虚荣。"
 tv_academy_debate.2044.t: "艺术家与神学家"
 tv_academy_debate.2045.a: "资助这场假面剧。"
 tv_academy_debate.2045.b: "避免把学说搬上舞台。"
 tv_academy_debate.2045.d: "朝臣提议举办一场盛大演出，歌颂新生、秩序，以及王室无可挑剔的品味。众人一致认为，只要有音乐、服饰和账单，学说就会更有说服力。"
 tv_academy_debate.2045.t: "宫廷新生假面剧"
 tv_academy_debate.2046.a: "公布丈量结果。"
 tv_academy_debate.2046.b: "当作古董趣闻处理。"
 tv_academy_debate.2046.d: "测绘者丈量古代遗迹，发现其中比例足以让当代建造者脸红。石头一言不发，正因如此，它们的算术更难被打断。"
 tv_academy_debate.2046.t: "丈量古代遗迹"
 tv_academy_debate.2047.a: "欢迎这些文章。"
 tv_academy_debate.2047.b: "轻视这场沙龙。"
 tv_academy_debate.2047.d: "一场由博学女性主持的沙龙开始传阅文章，使学院显得没有自己宣称的那样广大。她们的论证优雅，并不依附任何讲席，而且麻烦地难以驳倒。"
 tv_academy_debate.2047.t: "女性学识沙龙"
 tv_academy_debate.2048.a: "资助翻译"
 tv_academy_debate.2048.b: "延后审阅"
 tv_academy_debate.2048.d: "一部希腊文本送抵学院，其中的含混之处足以引发三场争论，并催生一个学派。"
 tv_academy_debate.2048.t: "希腊文本的翻译"
 tv_academy_debate.2049.a: "将它置于学院"
 tv_academy_debate.2049.b: "保持墙面中立"
 tv_academy_debate.2049.d: "一幅湿壁画描绘王国从阴影中走向有度量的光明。它并不含蓄，也正因如此才有效。"
 tv_academy_debate.2049.t: "新时代的湿壁画"
 tv_academy_debate.2050.a: "强制推行新课程"
 tv_academy_debate.2050.b: "尊重工坊惯例"
 tv_academy_debate.2050.d: "传统大师拒绝新的比例法，称其为外来的虚荣。"
 tv_academy_debate.2050.t: "旧工坊的抵制"
 tv_academy_debate.2051.a: "借用他们的语言"
 tv_academy_debate.2051.b: "驱逐诗人"
 tv_academy_debate.2051.d: "诗人开始把议题改写成可传诵的句子。这也许有用，但绝对危险。"
 tv_academy_debate.2051.t: "辩论中的诗人"
 tv_academy_debate.2052.a: "接受这种风格"
 tv_academy_debate.2052.b: "保留旧图像传统"
 tv_academy_debate.2052.d: "王室肖像画师提议以人文主义风格描绘统治者，而不是维持神圣而遥远的姿态。"
 tv_academy_debate.2052.t: "王子的肖像"
 tv_academy_debate.2053.a: "采纳新的节庆安排。"
 tv_academy_debate.2053.b: "保留旧有节庆秩序。"
 tv_academy_debate.2053.d: "学者建议重塑市民节庆，使其围绕学问、艺术与城市荣誉展开。于是，一年的圣日与集市日也开始像是在争论王国究竟尊崇什么。"
 tv_academy_debate.2053.t: "新节庆历"
 tv_academy_debate.2054.a: "聘用这位大师。"
 tv_academy_debate.2054.b: "礼貌谢绝。"
 tv_academy_debate.2054.d: "一位外国大师带来新技法，本地艺术家因其既是外来之物又确实更高明而心生怨气。每一句赞美听起来都像在纠正他们。"
 tv_academy_debate.2054.t: "外来的大师"
 tv_academy_debate.2055.a: "接受新的分类。"
 tv_academy_debate.2055.b: "恢复旧书架。"
 tv_academy_debate.2055.d: "人文主义者按照学科重新整理学院图书馆，而不是沿用祖传书架传统。旧书于是突然开始与新的邻居彼此相识。"
 tv_academy_debate.2055.t: "重新整理图书馆"
 tv_academy_debate.2056.a: "支持城市计划。"
 tv_academy_debate.2056.b: "让艺术留在室内。"
 tv_academy_debate.2056.d: "城市改革者主张，街道、广场与立面都能教导市民更好的品味，只要国库愿意承认石头如今也是一种课程。"
 tv_academy_debate.2056.t: "城市即课堂"
 tv_academy_debate.2057.a: "允许讽刺流传。"
 tv_academy_debate.2057.b: "没收所有印本。"
 tv_academy_debate.2057.d: "一篇辛辣讽刺把旧权威写得傲慢可笑，效果显著，也略显不公。到正午时，学院一半人在发笑，另一半人在清点印本。"
 tv_academy_debate.2057.t: "讽刺旧大师"
 tv_academy_debate.2058.a: "采用复式记账标准。"
 tv_academy_debate.2058.b: "保留旧式账目。"
 tv_academy_debate.2058.d: "一位商人会计在学院众人面前摊开账簿，把每一项主张都同对应的反项核在一起。这套算术枯燥、冷峻，却忽然比修辞更有说服力。"
 tv_academy_debate.2058.t: "复式记账演示"
 tv_academy_debate.2059.a: "将债册作为证据。"
 tv_academy_debate.2059.b: "压下这卷债册。"
 tv_academy_debate.2059.d: "银行家带来一卷贵族债册，蜡封了两层，流言却早已绕过一圈。它表明好几座骄傲的庄园，正靠他们公开鄙夷的信用支撑门面。"
 tv_academy_debate.2059.t: "贵族债册"
 tv_academy_debate.2060.a: "为受监管的利息辩护。"
 tv_academy_debate.2060.b: "谴责这种做法。"
 tv_academy_debate.2060.d: "黎明时分，一位布道者把利息说成每个债务人都能听懂的罪。到正午，学院已经在争论：监管能净化信用，还是只给恶习开了一张收据。"
 tv_academy_debate.2060.t: "反高利贷布道"
 tv_academy_debate.2061.a: "特许成立银行。"
 tv_academy_debate.2061.b: "推迟特许状。"
 tv_academy_debate.2061.d: "城市市民起草了一份由王室承诺担保的公共银行方案。纸面上它能带来稳定，却也立刻让所有人追问：这份承诺本身究竟值多少。"
 tv_academy_debate.2061.t: "公共银行提案"
 tv_academy_debate.2062.a: "改革铸币。"
 tv_academy_debate.2062.b: "指责散布流言者。"
 tv_academy_debate.2062.d: "流言声称每只钱袋里的硬币，都比王室承诺更薄。市场于是开始像称量白银一样，仔细称量信任。"
 tv_academy_debate.2062.t: "劣币恐慌"
 tv_academy_debate.2063.a: "监管存款。"
 tv_academy_debate.2063.b: "视为私人不幸。"
 tv_academy_debate.2063.d: "一名寡妇带着收据、失去的嫁资和不容轻慢的平静声音来到学院。原本抽象的银行规则之争，忽然在大厅里有了人的面孔。"
 tv_academy_debate.2063.t: "寡妇的存款"
 tv_academy_debate.2064.a: "澄清法律。"
 tv_academy_debate.2064.b: "威胁银行家。"
 tv_academy_debate.2064.d: "王室以紧急之名请求贷款，银行家先以沉默回应，随后才提出条件。大厅由此明白，含混的银行法甚至能让王室的急需在柜台前等待。"
 tv_academy_debate.2064.t: "王室贷款遭拒"
 tv_academy_debate.2065.a: "认可汇票。"
 tv_academy_debate.2065.b: "限制纸面工具。"
 tv_academy_debate.2065.d: "商人摊开书信、印章和签名，证明财富可以在护送钱车尚未选路时就已越过边境。纸张看似脆弱，直到众人看见它能调动多少硬币。"
 tv_academy_debate.2065.t: "汇票"
 tv_academy_debate.2066.a: "借此要求标准。"
 tv_academy_debate.2066.b: "只惩罚书记员。"
 tv_academy_debate.2066.d: "这本账簿优雅、平衡，并且虚假。它的栏目带着秩序的冷静美感，也因此让藏在其中的盗窃显得像是对算术本身的侮辱。"
 tv_academy_debate.2066.t: "欺诈账簿"
 tv_academy_debate.2067.a: "将其纳入法律。"
 tv_academy_debate.2067.b: "豁免宗教信用。"
 tv_academy_debate.2067.d: "修道院和教会机构把记录打开到刚好足以露出贷款、抵押和沉默豁免的网络。辩论由此发现，神圣之手同样会计算利息。"
 tv_academy_debate.2067.t: "教会信用箱"
 tv_academy_debate.2068.a: "以新规则调停。"
 tv_academy_debate.2068.b: "暂时关闭银行。"
 tv_academy_debate.2068.d: "债务人与债权人在城市银行门前冲突，双方都把契约挥得像伤口，并指责对方只是字迹更工整的抢劫。学院再也不能假装银行改革只是账簿之间的争论。"
 tv_academy_debate.2068.t: "城市银行骚乱"
 tv_academy_debate.2069.a: "审计包税账目。"
 tv_academy_debate.2069.b: "保留税收惯例。"
 tv_academy_debate.2069.d: "包税人抗议说，透明财政会让他们的行当不再那么有利可图；这话是真的，所以格外刺耳。他们把账簿用缎带捆好送来，仿佛缎带能把租利装扮成服务。"
 tv_academy_debate.2069.t: "包税账目"
 tv_academy_debate.2070.a: "讲授这种方法。"
 tv_academy_debate.2070.b: "让计算继续晦涩。"
 tv_academy_debate.2070.d: "一位数学家在干净的石板上演示复利，几名听众的神情仿佛粉笔点名点到了自己。原本像商人习惯的东西，忽然变成了数字的法则。"
 tv_academy_debate.2070.t: "利息学者"
 tv_academy_debate.2071.a: "承认共同分担风险。"
 tv_academy_debate.2071.b: "拒绝新式责任。"
 tv_academy_debate.2071.d: "市民提议设立共同基金，照顾水手家属、失利商队，以及归途断裂后接踵而来的沉默灾难。这个提案让风险不再像命运，而更像某种可以共同计算的东西。"
 tv_academy_debate.2071.t: "商人遗孀基金"
 tv_academy_debate.2072.a: "在监管下邀请他们。"
 tv_academy_debate.2072.b: "保持银行业本土化。"
 tv_academy_debate.2072.d: "一家外国银行行号带来专门知识、资本，以及一份条款整齐得不可能天真的契约。支持者看见输入的知识，反对者则看见王国的钱袋开始带上外国口音。"
 tv_academy_debate.2072.t: "外国银行家到来"
 tv_academy_debate.2073.a: "公开这份供认。"
 tv_academy_debate.2073.b: "让其悄然退休。"
 tv_academy_debate.2073.d: "一名疲惫的铸币官承认，旧有铸币流程靠被默许的混乱维持：被削薄的成色、私下通融的例外，以及无人真正敢对清的账册。"
 tv_academy_debate.2073.t: "铸币官的供认"
 tv_academy_debate.2074.a: "以银行改革解决军饷。"
 tv_academy_debate.2074.b: "再次私下借款。"
 tv_academy_debate.2074.d: "士兵们等在发饷处外，司库们却仍在争论方法、准备金和签押。抽象辩论忽然有了靴声、饥饿，以及极其现实的时间感。"
 tv_academy_debate.2074.t: "军饷拖延"
 tv_academy_debate.2075.a: "要求契约使用明白文句。"
 tv_academy_debate.2075.b: "保留精英法律格式。"
 tv_academy_debate.2075.d: "改革者呈上一份金融契约，普通读者也能看懂自己受何约束。律师们的神情像是有人在寒冬里突然开了窗。"
 tv_academy_debate.2075.t: "白话契约"
 tv_academy_debate.2076.a: "使有序破产合法化。"
 tv_academy_debate.2076.b: "保留羞辱作为惩罚。"
 tv_academy_debate.2076.d: "一名破产商人辩称，有秩序的破产比公开羞辱更能保住作坊、债权人和家庭。道德家听见的是宽恕，银行家听见的是残值。"
 tv_academy_debate.2076.t: "破产之耻"
 tv_academy_debate.2077.a: "公布账目。"
 tv_academy_debate.2077.b: "继续封存账目。"
 tv_academy_debate.2077.d: "学院提议公布一份简化的王室账目：数字要足以证明财政自信，却又不能多到让宫廷派系人人磨刀。会场立刻追问，这条界线究竟画在哪里。"
 tv_academy_debate.2077.t: "公布王室账目"
 tv_academy_debate.2078.a: "信任这张海图。"
 tv_academy_debate.2078.b: "将其斥为酒馆墨迹。"
 tv_academy_debate.2078.d: "一张破旧的海图被送进学院，上面的海岸线不肯嵌入任何已知地图。它的污痕起初像酒馆里的证据，直到满屋人发现，每一条不合旧图的线仍然指向西方。"
 tv_academy_debate.2078.t: "水手的海图"
 tv_academy_debate.2079.a: "公开听取其证词。"
 tv_academy_debate.2079.b: "私下盘问。"
 tv_academy_debate.2079.d: "一名领航员归来，衣上带着盐痕，骨子里还留着热病，讲出的故事前后一致到难以随手抹去。学院必须决定，是让王国把这段经历当作证据来听，还是当作秘密来审。"
 tv_academy_debate.2079.t: "归来的领航员"
 tv_academy_debate.2080.a: "授予传教优先权。"
 tv_academy_debate.2080.b: "让传教与测绘并重。"
 tv_academy_debate.2080.d: "神职人员主张，没有皈依的发现不过是带着更好地图的游荡。学院的辩论被拉扯在灵魂、测绘，以及一个令人不安的问题之间：谁有资格最先定义一片新海岸？"
 tv_academy_debate.2080.t: "神职人员索要传教权"
 tv_academy_debate.2081.a: "颁发特许状。"
 tv_academy_debate.2081.b: "将发现权锁在王权之下。"
 tv_academy_debate.2081.d: "商人提出资助远航，条件是王权允许他们给尚未见过的港湾命名。他们的信心有用、昂贵，而且已经迫不及待想把印章盖在空白海面上。"
 tv_academy_debate.2081.t: "商人索要特许状"
 tv_academy_debate.2082.a: "让它重塑辩论。"
 tv_academy_debate.2082.b: "将其视为奇闻。"
 tv_academy_debate.2082.d: "一份来自海彼岸的译文叙述反驳了学院一半的假设，而且听起来并不为其中任何一种假设所折服。众人这才发现，新世界并不是一直沉默地等待别人来描述。"
 tv_academy_debate.2082.t: "原住民使者的叙述"
 tv_academy_debate.2083.a: "资助防疫并继续探索。"
 tv_academy_debate.2083.b: "把疾病视为警告。"
 tv_academy_debate.2083.d: "医生提醒学院，新海岸带来的不只海岸线，也可能有港口从未见过的热病。发现的支持者必须证明，谨慎和好奇心可以登上同一批船。"
 tv_academy_debate.2083.t: "疾病报告"
 tv_academy_debate.2084.a: "继续航海计划。"
 tv_academy_debate.2084.b: "暂停远航。"
 tv_academy_debate.2084.d: "一支远征队迟迟未归，空荡的港口比任何讲师都更会挑时机发言。反对者把沉默称作证据，支持者则回答说，未知从来不会礼貌地投降。"
 tv_academy_debate.2084.t: "失踪的远征队"
 tv_academy_debate.2085.a: "展示这些货物。"
 tv_academy_debate.2085.b: "封存货物。"
 tv_academy_debate.2085.d: "港口挤满了想看异域货物卸船的人。每一件物品都像一位小小的使节，让学院的论点有了颜色、重量，以及围观者可以指认的形状。"
 tv_academy_debate.2085.t: "港口人群"
 tv_academy_debate.2086.a: "接受修正。"
 tv_academy_debate.2086.b: "恢复旧地图。"
 tv_academy_debate.2086.d: "制图师当着众人的面擦去旧有边界，在曾经写着确定性的地方画上新的海岸。刮刀的声音很轻，直到众人意识到刚刚失去墨迹的是哪一种权威。"
 tv_academy_debate.2086.t: "制图师的修正"
 tv_academy_debate.2087.a: "资助远洋准备。"
 tv_academy_debate.2087.b: "让舰队留在近海。"
 tv_academy_debate.2087.d: "海军军官告诉学院，发现新世界不能靠仪典用的木头航行。如果王国想让海洋成为道路，就必须出钱准备那些不只会参加检阅的船。"
 tv_academy_debate.2087.t: "海军军官索要经费"
 tv_academy_debate.2088.a: "用贪欲资助航行。"
 tv_academy_debate.2088.b: "斥责这则传闻。"
 tv_academy_debate.2088.d: "黄金的消息比可靠的纬度传播得更快。支持者认为，可以先利用贪欲来资助航行，免得它自行变成政策；反对者则警告，学院正在把狂热误当作证据。"
 tv_academy_debate.2088.t: "黄金传闻"
 tv_academy_debate.2089.a: "争辩这项声索。"
 tv_academy_debate.2089.b: "避免挑衅。"
 tv_academy_debate.2089.d: "一个敌对宫廷宣称自己率先发现了新海岸，并送来措辞自信得发亮的书信。学院的问题突然不再只是那片海岸是否存在，而是沉默是否会让它属于别人。"
 tv_academy_debate.2089.t: "外国声索"
 tv_academy_debate.2090.a: "将修正誉为科学精神。"
 tv_academy_debate.2090.b: "掩盖这个错误。"
 tv_academy_debate.2090.d: "学院偏爱的宇宙志学者承认，一项重要的距离估算错了。这个错误只有在羊皮纸上才显得很小，因为羊皮纸毕竟仁慈地保持平整。"
 tv_academy_debate.2090.t: "宇宙志学者的错误"
 tv_academy_debate.2091.a: "付钱并劝服他们。"
 tv_academy_debate.2091.b: "将他们的恐惧视为智慧。"
 tv_academy_debate.2091.d: "水手们拒绝再次出航，除非那些征兆得到回应，而每一种官方解释似乎都让征兆变得更加顽固。学院必须判断，海上的恐惧究竟是薪酬、劝说，还是天意的问题。"
 tv_academy_debate.2091.t: "水手的迷信"
 tv_academy_debate.2092.a: "改革特许制度。"
 tv_academy_debate.2092.b: "撤销这场实验。"
 tv_academy_debate.2092.d: "一名特许权持有人在这项原则尚未于国内辩论中获胜之前，就已经滥用了远方权力。这桩丑闻给了反对者一个尖锐的问题：如果发现事业一开始就如此糟糕，我们到底是在接受什么？"
 tv_academy_debate.2092.t: "殖民特许权滥用"
 tv_academy_debate.2093.a: "推广这种作物。"
 tv_academy_debate.2093.b: "将它限制在园中。"
 tv_academy_debate.2093.d: "一种陌生作物在学院试验园里活了下来，在理论只期待传闻的地方倔强地泛着绿色。农民、商人和怀疑者都围到叶片旁，因为未知之物终于变成了可以浇水的东西。"
 tv_academy_debate.2093.t: "输入作物"
 tv_academy_debate.2094.a: "宣示航行权利。"
 tv_academy_debate.2094.b: "拒绝远方纠葛。"
 tv_academy_debate.2094.d: "外交官询问，那些制图师还只能半凭想象描绘的海岸，是否已经可以用墨水分割。学院的争论忽然不只关乎那里是否存在，也关乎谁有权声称自己可以率先抵达。"
 tv_academy_debate.2094.t: "未知海岸条约"
 tv_academy_debate.2095.a: "传阅这部语法书。"
 tv_academy_debate.2095.b: "仅供传教使用。"
 tv_academy_debate.2095.d: "一名传教士带来了一部新语言的语法书，宫廷中无人能不带谦卑地读出那些音节。书页证明，发现新世界面对的是自有声音、规则和意义的人群，而不只是等待命名的海岸线。"
 tv_academy_debate.2095.t: "传教士语法书"
 tv_academy_debate.2096.a: "为远征提供担保。"
 tv_academy_debate.2096.b: "允许投资者退场。"
 tv_academy_debate.2096.d: "一场风暴摧毁了为下一次航行准备的船只，港口的信心几乎和桅杆一起断裂。昨日还称颂发现事业的投资者，如今像恐惧的账房一样盯着残骸盘算。"
 tv_academy_debate.2096.t: "港口投资者恐慌"
 tv_academy_debate.2097.a: "将它用于公共教学。"
 tv_academy_debate.2097.b: "仅供专家使用。"
 tv_academy_debate.2097.d: "一具新的地球仪被抬进学院教室，它的圆弧足以让墙上的旧地图显得窘迫。学生们亲手转动它，整个房间发现，地理知识竟能在人们指尖下改变。"
 tv_academy_debate.2097.t: "学校地球仪"
 tv_academy_debate.2098.a: "广泛散发。"
 tv_academy_debate.2098.b: "仅限学者传阅。"
 tv_academy_debate.2098.d: "第一批小册子刚印完，审查官还没决定小册子究竟算什么。"
 tv_academy_debate.2098.t: "小册子首印"
 tv_academy_debate.2099.a: "承认行会。"
 tv_academy_debate.2099.b: "对印刷机逐案许可。"
 tv_academy_debate.2099.d: "印刷匠请求法律承认，以免更多印刷机出现在地下室和借来的厨房里。"
 tv_academy_debate.2099.t: "印刷匠行会请愿"
 tv_academy_debate.2100.a: "拒绝广泛索引。"
 tv_academy_debate.2100.b: "批准索引。"
 tv_academy_debate.2100.d: "教士提议编制危险书籍索引，而学生们立刻想把这些书全读一遍。"
 tv_academy_debate.2100.t: "教士禁书索引"
 tv_academy_debate.2101.a: "用印刷推动改革。"
 tv_academy_debate.2101.b: "限制乡村印刷。"
 tv_academy_debate.2101.d: "廉价印刷祈祷单比正式布道更快传到乡村。"
 tv_academy_debate.2101.t: "廉价祈祷单"
 tv_academy_debate.2102.a: "捍卫出版自由。"
 tv_academy_debate.2102.b: "惩罚印刷商。"
 tv_academy_debate.2102.d: "一名印刷商把宫廷流言和严肃论辩印在一起出售，两者卖得同样好。"
 tv_academy_debate.2102.t: "丑闻小报"
 tv_academy_debate.2103.a: "采用它。"
 tv_academy_debate.2103.b: "再审查一季。"
 tv_academy_debate.2103.d: "一本印刷课本在一个学季内把修正过的图表传遍各地学校。"
 tv_academy_debate.2103.t: "校正课本"
 tv_academy_debate.2104.a: "补贴纸张。"
 tv_academy_debate.2104.b: "限制印数。"
 tv_academy_debate.2104.d: "造纸匠警告说，辩论不能只靠热情印在纸上。"
 tv_academy_debate.2104.t: "纸张短缺"
 tv_academy_debate.2105.a: "容忍这些传单。"
 tv_academy_debate.2105.b: "搜捕作者。"
 tv_academy_debate.2105.d: "匿名传单以过分热烈的语气支持这项议题，连盟友都显得不安。"
 tv_academy_debate.2105.t: "匿名传单"
 tv_academy_debate.2106.a: "以印刷回应。"
 tv_academy_debate.2106.b: "忽视外国噪声。"
 tv_academy_debate.2106.d: "一家外国印刷所带着错误、讥讽和惊人的速度转载了学院论点。"
 tv_academy_debate.2106.t: "外国印刷所转载我方论点"
 tv_academy_debate.2107.a: "重新训练抄写员操作印刷机。"
 tv_academy_debate.2107.b: "保护手抄行业。"
 tv_academy_debate.2107.d: "抄写员警告说，活字印刷会让诚实的双手和不诚实的缩写一起挨饿。"
 tv_academy_debate.2107.t: "抄写员抗议"
 tv_academy_debate.2108.a: "统一印刷法令。"
 tv_academy_debate.2108.b: "保留传统公告方式。"
 tv_academy_debate.2108.d: "官员们发现，印刷公告能在谣言替它改写之前抵达民众手中。"
 tv_academy_debate.2108.t: "印刷王室公告"
 tv_academy_debate.2109.a: "将其合法化并加注解。"
 tv_academy_debate.2109.b: "扩大查禁。"
 tv_academy_debate.2109.d: "一本被禁的书因为遭禁而流行起来，书籍有时就是这样带着几分倔强。"
 tv_academy_debate.2109.t: "禁书畅销"
 tv_academy_debate.2110.a: "准许设立印刷所。"
 tv_academy_debate.2110.b: "集中管理印刷事务。"
 tv_academy_debate.2110.d: "一所大学请求拥有自己的印刷机，免得总要求城中印刷工优先处理严肃文本。"
 tv_academy_debate.2110.t: "大学印刷所"
 tv_academy_debate.2111.a: "印制勘误单。"
 tv_academy_debate.2111.b: "借此质疑印刷可靠性。"
 tv_academy_debate.2111.d: "一张错误的印刷表格让同一个错误随着数百份副本传播开来。"
 tv_academy_debate.2111.t: "错误成倍扩散"
 tv_academy_debate.2112.a: "利用通俗印刷品。"
 tv_academy_debate.2112.b: "压制粗俗论辩。"
 tv_academy_debate.2112.d: "一首印刷歌谣把这场辩论解释得不甚准确，却令人难忘。"
 tv_academy_debate.2112.t: "议题歌谣"
 tv_academy_debate.2113.a: "保护印刷商。"
 tv_academy_debate.2113.b: "罚款惩戒印刷商。"
 tv_academy_debate.2113.d: "一名贵族起诉印刷商，因为廉价铅字把旧特权写得可笑起来。"
 tv_academy_debate.2113.t: "贵族诽谤诉讼"
 tv_academy_debate.2114.a: "出版多语种版本。"
 tv_academy_debate.2114.b: "只保留一种官方语言。"
 tv_academy_debate.2114.d: "印刷商提议用数种语言出版同一论点，让这场争论更难被圈住。"
 tv_academy_debate.2114.t: "多语种版本"
 tv_academy_debate.2115.a: "批准军事印刷。"
 tv_academy_debate.2115.b: "让印刷机只服务民政事务。"
 tv_academy_debate.2115.d: "军官们请求印刷操典手册和技术单页。"
 tv_academy_debate.2115.t: "营房里的印刷机"
 tv_academy_debate.2116.a: "借用这份名声。"
 tv_academy_debate.2116.b: "重新把学者放回中心。"
 tv_academy_debate.2116.d: "一名印刷商出名到足以惹恼真正写下那些文字的学者。"
 tv_academy_debate.2116.t: "印刷商成了名人"
 tv_academy_debate.2117.a: "绕过拖延程序。"
 tv_academy_debate.2117.b: "尊重既定流程。"
 tv_academy_debate.2117.d: "审查官拖得太久，以至于这项议题可能体面地死在上锁抽屉里。"
 tv_academy_debate.2117.t: "审查官的拖延"
 tv_academy_debate.2118.a: "将信仰告白列为公开国策。"
 tv_academy_debate.2118.b: "让宫廷信仰留在私下。"
 tv_academy_debate.2118.d: "朝臣们追问，君主的信仰究竟应当公开成为统治王国的准则，还是只在出席礼拜与谨慎沉默中作为私人习惯存在。"
 tv_academy_debate.2118.t: "宫廷的信仰告白"
 tv_academy_debate.2119.a: "强制使用登记簿。"
 tv_academy_debate.2119.b: "让记录留在地方。"
 tv_academy_debate.2119.d: "改革者把堂区登记簿推到学院面前，声称信仰、婚姻与出生若不能被国家稳定读懂，就无法真正成为政策的依据。"
 tv_academy_debate.2119.t: "堂区登记簿"
 tv_academy_debate.2120.a: "由中央许可讲道。"
 tv_academy_debate.2120.b: "保留地方布道惯例。"
 tv_academy_debate.2120.d: "当教义开始成为政务，讲坛便不再只是地方事务。传道人要求说明，当每篇讲道都可能像政策一样被听见时，谁才有资格代表正统发声。"
 tv_academy_debate.2120.t: "讲道许可"
 tv_academy_debate.2121.a: "强制执行信仰统一。"
 tv_academy_debate.2121.b: "容忍贵族礼拜堂。"
 tv_academy_debate.2121.d: "一个贵族家族仍在自家礼拜堂中维持旧例，而这种做法已同正在形成的国家信纲不合。辩护者称之为家族荣誉，反对者则说那不过是点着蜡烛的漏洞。"
 tv_academy_debate.2121.t: "贵族礼拜堂之争"
 tv_academy_debate.2122.a: "印行并教授它。"
 tv_academy_debate.2122.b: "延后，等待共识。"
 tv_academy_debate.2122.d: "学者们写出一份教理问答，短到儿童也能背诵，锋利到成年人也会争执。它的页边空白已经像一片战场。"
 tv_academy_debate.2122.t: "教理问答草案"
 tv_academy_debate.2123.a: "在信纲之下规定法律保护。"
 tv_academy_debate.2123.b: "避免作出保障。"
 tv_academy_debate.2123.d: "一个少数信仰社群派出长老来到学院，呈上一份封印谨慎的请愿书。他们并不否认王国的信纲，只想知道服从之后得到的是保护，还是更安静的排斥。"
 tv_academy_debate.2123.t: "少数社群请愿"
 tv_academy_debate.2124.a: "颁布共同誓词。"
 tv_academy_debate.2124.b: "保留旧有誓词。"
 tv_academy_debate.2124.d: "军官们警告说，士兵即使在不同堂区祈祷，也终究站在同一条战线上。他们要求一份共同誓词，在地方习俗把军营分开之前先把军队系紧。"
 tv_academy_debate.2124.t: "军中誓词"
 tv_academy_debate.2125.a: "召集宗教会议。"
 tv_academy_debate.2125.b: "避免公开场面。"
 tv_academy_debate.2125.d: "有人提议召开一场正式宗教会议，列席见证者多到足以让任何派别都无法事后装作尖锐言辞从未出现。教义将以公开决议的形式离开学院，而不是以传闻流散。"
 tv_academy_debate.2125.t: "召集宗教会议"
 tv_academy_debate.2126.a: "接受他们的来信。"
 tv_academy_debate.2126.b: "拒绝外国影响。"
 tv_academy_debate.2126.d: "外国同信者寄来书信，里面满是鼓励、建议，以及显眼到无法忽视的署名。他们的支持加强了论点，也让每个听众都忍不住猜测还有谁在旁听。"
 tv_academy_debate.2126.t: "外国同信者"
 tv_academy_debate.2127.a: "改革圣日历。"
 tv_academy_debate.2127.b: "保留地方节日。"
 tv_academy_debate.2127.d: "改革者把一份修订后的圣日历铺在桌上，随即发现每个被划去的节日背后都有邻里、行会和祖辈记忆。国家可以校准神圣时间，却很难悄无声息地做到。"
 tv_academy_debate.2127.t: "圣日历改革"
 tv_academy_debate.2128.a: "批准使用这些课本。"
 tv_academy_debate.2128.b: "让各地学校自行讲授教义。"
 tv_academy_debate.2128.d: "新课本被送到学院，教义与拼写、算术和臣民格言并排印在纸上。孩子们将从同一页上学会字母，也学会国家希望他们信奉的教义。"
 tv_academy_debate.2128.t: "宗派教义课本"
 tv_academy_debate.2129.a: "规范朝圣活动。"
 tv_academy_debate.2129.b: "让习俗自行维持秩序。"
 tv_academy_debate.2129.d: "一场朝圣在相互竞争的布道、旧徽记和新口号相遇后，从虔敬滑向街头冲突。学院必须判断，是否能约束旧俗而不彻底摧毁它。"
 tv_academy_debate.2129.t: "朝圣骚乱"
 tv_academy_debate.2130.a: "设立这些法庭。"
 tv_academy_debate.2130.b: "仍由现有教会法庭处理婚姻。"
 tv_academy_debate.2130.d: "法学家提议设立由国家承认、依宗派法律裁决的婚姻法庭。过去家庭交给熟悉教士处理的事情，或许很快就要带着印章、书记员和判例而来。"
 tv_academy_debate.2130.t: "婚姻法庭"
 tv_academy_debate.2131.a: "制定宗派规则。"
 tv_academy_debate.2131.b: "暂不裁决。"
 tv_academy_debate.2131.d: "一幅教堂图像在布道者、信众和官员都坚持它能证明己方立场之后，便不再只是颜料与木板。问题已不再是图像是否美丽，而是谁有权解释虔敬的含义。"
 tv_academy_debate.2131.t: "圣像之争"
 tv_academy_debate.2132.a: "保护这些传教士。"
 tv_academy_debate.2132.b: "约束他们的活动。"
 tv_academy_debate.2132.d: "传教士带着足以赢得皈依者和投诉的布道越过边境。他们的教义强化了国内辩论，但每个边境村庄如今都会在外交厅里产生回声。"
 tv_academy_debate.2132.t: "边境传教士"
 tv_academy_debate.2133.a: "征收这项税。"
 tv_academy_debate.2133.b: "拒绝这项税。"
 tv_academy_debate.2133.d: "官员提议为宗派学校征收一项专门税，声称教义若教得太廉价，就会被遗忘得太迅速。乡村听见的是\"学校\"，盘算的却是\"税\"。"
 tv_academy_debate.2133.t: "信纲税"
 tv_academy_debate.2134.a: "支持宗派纪律。"
 tv_academy_debate.2134.b: "支持教士特权。"
 tv_academy_debate.2134.d: "曾经以同一等级发声的教士，如今争论新宗派究竟应把他们约束为教义的仆从，还是继续保护他们作为祖传特权守护者的身份。"
 tv_academy_debate.2134.t: "教士分裂"
 tv_academy_debate.2135.a: "接受悔认。"
 tv_academy_debate.2135.b: "要求公开受辱。"
 tv_academy_debate.2135.d: "一位著名反对者表示，只要学院免去羞辱仪式，自己便愿意悔认。有人认为宽恕证明了自信，也有人觉得这是错过了让反抗者战栗的机会。"
 tv_academy_debate.2135.t: "公开悔认"
 tv_academy_debate.2136.a: "将他们统计入册。"
 tv_academy_debate.2136.b: "拒绝这次清查。"
 tv_academy_debate.2136.d: "官僚请求按宗派统计各地社群，保证表格总比传闻冷静。少数社群的长老却明白，一栏数字既可以是工具，也很容易变成目标。"
 tv_academy_debate.2136.t: "宗派户籍清查"
 tv_academy_debate.2137.a: "正式颁布。"
 tv_academy_debate.2137.b: "退回重修。"
 tv_academy_debate.2137.d: "顾问们草拟了一套王室条文，希望它明早听起来就像古训，下周听起来就像天命。词句已经打磨得发亮，但发亮并不等于尘埃落定。"
 tv_academy_debate.2137.t: "王室信纲条文"
 tv_academy_debate.2138.a: "当众宣读账簿。"
 tv_academy_debate.2138.b: "斥之为商人的算术。"
 tv_academy_debate.2138.d: "港口书记员把盐、丝绸、香料、运费和保险的账簿铺满学院长桌。每一列数字都在说明，远方价格早已塑造着本国，哪怕土地上的荣誉假装毫不在意。"
 tv_academy_debate.2138.t: "港口账簿"
 tv_academy_debate.2139.a: "准许设立商馆区。"
 tv_academy_debate.2139.b: "拒绝特殊权利。"
 tv_academy_debate.2139.d: "外国商人请求在港口附近拥有仓库、住所和自己的守卫。这个要求听起来务实，直到众人意识到，它会让远方市场在本国境内拥有一个固定地址。"
 tv_academy_debate.2139.t: "外商馆区"
 tv_academy_debate.2140.a: "简化关税。"
 tv_academy_debate.2140.b: "保留原有税目。"
 tv_academy_debate.2140.d: "一场海关审查发现，现行税目纠缠到会意外惩罚有利可图的货物，而受偏爱的商品却凭习惯轻松通行。税表已经变成一场写满划线数字的政策争论。"
 tv_academy_debate.2140.t: "关税混乱"
 tv_academy_debate.2141.a: "展示这批货物。"
 tv_academy_debate.2141.b: "悄悄征税。"
 tv_academy_debate.2141.d: "一批香料货物在学院面前开箱，室内立刻弥漫起内陆税册从未记录过的气味。遥远岛屿忽然不再像传闻，而像一场袖口沾着肉桂的论证。"
 tv_academy_debate.2141.t: "香料货物"
 tv_academy_debate.2142.a: "反驳他们的主张。"
 tv_academy_debate.2142.b: "安抚土地特权。"
 tv_academy_debate.2142.d: "内陆贵族警告说，海洋贸易会教本国更尊重仓库而不是田地。他们的演说修饰得体、满怀不悦，并且坚信财富仍然应该带着泥土气味。"
 tv_academy_debate.2142.t: "港口遭贵族反对"
 tv_academy_debate.2143.a: "承认海运保险。"
 tv_academy_debate.2143.b: "将损失视为私人风险。"
 tv_academy_debate.2143.d: "商人把风暴记录、沉船清单和幸存者证词摆到学院面前。他们的论点很直接：既然国家要分享远洋利润，就必须学会分担远洋损失。"
 tv_academy_debate.2143.t: "船舶保险"
 tv_academy_debate.2144.a: "改革合法商路。"
 tv_academy_debate.2144.b: "烧掉地图。"
 tv_academy_debate.2144.d: "一张被缴获的地图细致标出海湾、仓库、隐秘道路和可信暗号，比任何海关簿册都更周密。这个非法网络令人难堪，因为它确实有效。"
 tv_academy_debate.2144.t: "走私者的地图"
 tv_academy_debate.2145.a: "谈判劳工保护。"
 tv_academy_debate.2145.b: "镇压罢工。"
 tv_academy_debate.2145.d: "码头工人停下吊机、绳索、货车和叫喊声，让议事厅里看似轻松的贸易突然露出本来面目。他们追问，为何贸易扩张反而让每一份工钱都显得更少。"
 tv_academy_debate.2145.t: "码头劳工罢工"
 tv_academy_debate.2146.a: "公开接待他们。"
 tv_academy_debate.2146.b: "限制他们的接触。"
 tv_academy_debate.2146.d: "一个敌对宫廷派来商人，带着礼物、契约草案和打磨得几乎像友谊的恭维话。每一项提议都同时带着机会与牵制的气味。"
 tv_academy_debate.2146.t: "敌手的贸易使团"
 tv_academy_debate.2147.a: "统一度量衡。"
 tv_academy_debate.2147.b: "保留地方量制。"
 tv_academy_debate.2147.d: "商人带着天平、砝码、打印金属条和来自半数集镇的控诉来到学院。欺诈已经地方化到可以被辩称为传统的程度。"
 tv_academy_debate.2147.t: "标准度量衡"
 tv_academy_debate.2148.a: "将商队与船队衔接起来。"
 tv_academy_debate.2148.b: "保持路线特权分立。"
 tv_academy_debate.2148.d: "内陆商队首领与海上船长争论哪条路线更值得国家扶持。在学院辩论厅里，路上的尘土和海上的盐雾都被说成证据，证明王国必须学会把遥远距离视为同一套相连体系。"
 tv_academy_debate.2148.t: "商队与护航船队"
 tv_academy_debate.2149.a: "资助这所学校。"
 tv_academy_debate.2149.b: "让训练继续由家族承担。"
 tv_academy_debate.2149.d: "市民阶层提议把航海、契约和语言作为严肃的公共知识来教授。这个主张让所有偏爱把商业保留为家族秘传技艺的人感到不安，仿佛账桌旁的私学忽然要搬进国家课堂。"
 tv_academy_debate.2149.t: "商人学校"
 tv_academy_debate.2150.a: "加以监管，但继续贸易。"
 tv_academy_debate.2150.b: "广泛停止出口。"
 tv_academy_debate.2150.d: "一场欠收让饥饿城镇眼中的出口几乎像是叛国。商人坚持契约能保证未来粮食流通，门外的人群却想知道，为什么明日的信用应当高过今晚的面包。"
 tv_academy_debate.2150.t: "出口恐慌"
 tv_academy_debate.2151.a: "改善检疫体系。"
 tv_academy_debate.2151.b: "限制外国船只。"
 tv_academy_debate.2151.d: "检疫官员拖慢贸易，并以生存作为自己的辩护。商人说每一次延误都是失去一个季节，医师则回答，若港口带来的下一批货物是葬礼，再繁忙的码头也毫无用处。"
 tv_academy_debate.2151.t: "港口检疫"
 tv_academy_debate.2152.a: "资助护航。"
 tv_academy_debate.2152.b: "让商人自行投保。"
 tv_academy_debate.2152.d: "商人要求护航，海军将领要求拨款，这种合作没人会称之为便宜。学院听见了一个穿着昂贵外衣的简单问题：如果贸易已经走向全球，国家是否必须守卫每一条让它获利的天际线？"
 tv_academy_debate.2152.t: "海军护航之辩"
 tv_academy_debate.2153.a: "打破垄断。"
 tv_academy_debate.2153.b: "维护行会特权。"
 tv_academy_debate.2153.d: "海外贸易商把契约摆在城市行会特许状旁边，称那些旧垄断不过是精美的锁链。行会大师们怒气上涌，但年轻商人已经听见远方市场正在撼动锁扣。"
 tv_academy_debate.2153.t: "行会垄断挑战"
 tv_academy_debate.2154.a: "统一贸易语言。"
 tv_academy_debate.2154.b: "保留本地契约格式。"
 tv_academy_debate.2154.d: "译员把同一份贸易契约的三种文本带到学院，而其中只有一种本能保住那批货物。众人这才发现，利润也会淹没在一个含混条款之中。"
 tv_academy_debate.2154.t: "契约语言"
 tv_academy_debate.2155.a: "接受全球性风险。"
 tv_academy_debate.2155.b: "指责投机者。"
 tv_academy_debate.2155.d: "海外价格变动的消息传来，本地安排在官员尚未说完\"外国市场很遥远\"之前就已经塌陷。学院听见港口之间的距离缩成了一个数字。"
 tv_academy_debate.2155.t: "远方价格震荡"
 tv_academy_debate.2156.a: "特许自由港。"
 tv_academy_debate.2156.b: "拒绝这场试验。"
 tv_academy_debate.2156.d: "改革者描绘了一座港口：王冠不再在每道关卡勒紧货流，而是向流动本身征税。海关官员称其鲁莽，商人则说这才是货物流动的第一张诚实地图。"
 tv_academy_debate.2156.t: "自由港提案"
 tv_academy_debate.2157.a: "采用风向航路。"
 tv_academy_debate.2157.b: "保留既定航线。"
 tv_academy_debate.2157.d: "航海者在学院桌上展开风向图，旧航线忽然不再像传统，而像挂着帆的迷信。连出声嘲笑的船长也忍不住反复偷看那些线条。"
 tv_academy_debate.2157.t: "贸易风向图"
 tv_academy_debate.2158.a: "支持这种模式。"
 tv_academy_debate.2158.b: "保留分散工坊。"
 tv_academy_debate.2158.d: "一名商人陈述把纺工、整饰工、账房和监工集中到同一屋檐下的理由。院门上方的钟声听起来不像工具，更像一场关于劳动应如何安排的新论证。"
 tv_academy_debate.2158.t: "同檐工坊"
 tv_academy_debate.2159.a: "在制造工场执行质量标准。"
 tv_academy_debate.2159.b: "保留行会检验。"
 tv_academy_debate.2159.d: "行会师傅带来变形的布匹、易碎的器具和仓促到近乎控诉的收尾活。他们警告说，规模既能成倍增加货物，也能同样高效地成倍放大错误。"
 tv_academy_debate.2159.t: "行会师傅的控诉"
 tv_academy_debate.2160.a: "兴建水力工场。"
 tv_academy_debate.2160.b: "拒绝机械化压力。"
 tv_academy_debate.2160.d: "工程师勾画出一种由水力驱动的工序，能拉、能捣、能转，其胃口远非人手可比。那条河忽然不再只是风景，更像一名等待受雇的工人。"
 tv_academy_debate.2160.t: "水轮提案"
 tv_academy_debate.2161.a: "捍卫有薪劳动。"
 tv_academy_debate.2161.b: "限制雇佣惯例。"
 tv_academy_debate.2161.d: "一家制造工场雇用了许多女性，多到无法再被轻描淡写地称作家内帮工。最初只是工资的问题，如今变成了关于习俗、纪律以及谁能公开站进新经济的争论。"
 tv_academy_debate.2161.t: "织机旁的女性"
 tv_academy_debate.2162.a: "组织供应契约。"
 tv_academy_debate.2162.b: "让产量服从供应旧俗。"
 tv_academy_debate.2162.d: "生产停滞了，因为羊毛、木材、染料或矿石仍按村庄习惯抵达，而不是按制造工场的胃口供应。机器与工作台只能等待，乡间则坚持供应自有季节、邻里和旧义务。"
 tv_academy_debate.2162.t: "原料瓶颈"
 tv_academy_debate.2163.a: "监管制造工场。"
 tv_academy_debate.2163.b: "谴责大型作坊。"
 tv_academy_debate.2163.d: "一场作坊大火留下焦黑梁木、毁坏存货，以及一群急着解释火焰含义的目击者。有人认为集中生产本身危险，也有人认为真正危险的是集中生产却无人监管。"
 tv_academy_debate.2163.t: "院中失火"
 tv_academy_debate.2164.a: "接受钟表纪律。"
 tv_academy_debate.2164.b: "限制作坊规章。"
 tv_academy_debate.2164.d: "管事把钟和铃挂在从前只靠习惯运转的地方。工人很快发现，时间也能变成一名既无耐心也无需睡眠的监督者。"
 tv_academy_debate.2164.t: "钟表纪律"
 tv_academy_debate.2165.a: "接受标准化生产。"
 tv_academy_debate.2165.b: "保留定制供应。"
 tv_academy_debate.2165.d: "军队开出一份大到足以让每个作坊主重新清点工台的合同。条件也很简单：王权要的是一致的零件和布匹，而不是各地各有风味的差异。"
 tv_academy_debate.2165.t: "军需合同"
 tv_academy_debate.2166.a: "平等适用规则。"
 tv_academy_debate.2166.b: "豁免贵族作坊。"
 tv_academy_debate.2166.d: "一处贵族庄园满怀自信地开办了大型作坊，却在市民也要求同样自由时表示反对。学院被迫判断：难道只有带着纹章的规模化才算体面？"
 tv_academy_debate.2166.t: "贵族庄园作坊"
 tv_academy_debate.2167.a: "制定劳动规则并继续推进。"
 tv_academy_debate.2167.b: "关闭这种模式。"
 tv_academy_debate.2167.d: "堂区领袖带着姓名、年龄，以及辩论此前不愿认真想象的一双双小手来到学院。问题不再是制造工场能否生产更多，而是它被允许消耗怎样的劳动。"
 tv_academy_debate.2167.t: "童工请愿"
 tv_academy_debate.2168.a: "推广标准部件。"
 tv_academy_debate.2168.b: "保留手工差异。"
 tv_academy_debate.2168.d: "工匠们带来一排整齐的部件，它们可以毫无怨言地互换位置。半个会场看见了维修更快、供应更稳的未来；另一半则听见了个人手艺的静默丧钟。"
 tv_academy_debate.2168.t: "标准部件"
 tv_academy_debate.2169.a: "使用这些账册。"
 tv_academy_debate.2169.b: "避免侵入式核算。"
 tv_academy_debate.2169.d: "会计把废料、迟误、损耗和闲置时间列成整齐得近乎控诉的栏目。曾经藏在尘土和习惯里的东西，如今变成了关于管理、纪律与责任的公共问题。"
 tv_academy_debate.2169.t: "工厂账册"
 tv_academy_debate.2170.a: "管理这场转变。"
 tv_academy_debate.2170.b: "放慢扩张。"
 tv_academy_debate.2170.d: "农民代表抱怨，工场需求把劳力从田地里拉走，也把女儿们从家庭安排里带走。学院听见的并非单纯的生产异议，而是整个乡村秩序正在吱呀作响。"
 tv_academy_debate.2170.t: "乡村流离"
 tv_academy_debate.2171.a: "仿制并改造它。"
 tv_academy_debate.2171.b: "拒绝外国机械。"
 tv_academy_debate.2171.d: "一台外国机器被搬进学院，螺栓陌生，野心却十分熟悉。赞成者看见一套可以仿制的设计，反对者则看见另一个国家把金属之手伸进本地工坊。"
 tv_academy_debate.2171.t: "舶来机器"
 tv_academy_debate.2172.a: "管控烟尘并继续推进。"
 tv_academy_debate.2172.b: "限制工业场址。"
 tv_academy_debate.2172.d: "城中居民提醒学院，能带来产量的烟雾依旧是烟雾。窗台、肺部和晾衣绳一起作证，反驳那种只要产出增加便足以自证其正当性的理论。"
 tv_academy_debate.2172.t: "煤烟之争"
 tv_academy_debate.2173.a: "允许受规制的计件工资。"
 tv_academy_debate.2173.b: "禁止计件工资。"
 tv_academy_debate.2173.d: "业主提议按件付薪，于是每一匹织好的布、每一件磨亮的工具、每一箱封好的货物，都既是工资，也是责备。工人听见算术正试图变成监工。"
 tv_academy_debate.2173.t: "计件工资"
 tv_academy_debate.2174.a: "资助工场学校。"
 tv_academy_debate.2174.b: "保留行会学徒制。"
 tv_academy_debate.2174.d: "改革者提议在制造工场内部训练工人，让课程从工作台开始，以一批可计数的成品结束。行会师傅立刻意识到，学徒制正在被迫分享自己的语汇。"
 tv_academy_debate.2174.t: "工场学校"
 tv_academy_debate.2175.a: "改进检验并继续推进。"
 tv_academy_debate.2175.b: "指责规模本身。"
 tv_academy_debate.2175.d: "一大批货物当众未能通过检验：缝线裂开，配件崩断，反对规模化的人几乎要感谢这份证据。眼下的问题是，这次失败究竟定罪的是整个制度，还是只是检验者。"
 tv_academy_debate.2175.t: "质量丑闻"
 tv_academy_debate.2176.a: "使资本池合法化。"
 tv_academy_debate.2176.b: "禁止这种集中。"
 tv_academy_debate.2176.d: "商人提议合资筹集一笔足以兴建制造工场的资本，规模大到任何单一家族都难以独自掌握。这笔钱来的时候不像一个钱袋，更像一群带着账本和耐心的委员。"
 tv_academy_debate.2176.t: "商人资本池"
 tv_academy_debate.2177.a: "捍卫新的纪律。"
 tv_academy_debate.2177.b: "让汽笛安静。"
 tv_academy_debate.2177.d: "一只新的工场汽笛以令人赞叹的效率、也以令人难忍的确定性切分一天。它告诉工人何时开工，告诉邻人何时抱怨，也告诉改革者：纪律隔着三条街也能被听见。"
 tv_academy_debate.2177.t: "第一声汽笛"
 tv_academy_debate.2178.a: "相信重复观察。"
 tv_academy_debate.2178.b: "将其视为异常。"
 tv_academy_debate.2178.d: "一份耐心整理的重复观察记录表被摆在学院面前，每一行都平淡得不足以炫目，却又一致得无法忽视。旧权威依然令人敬畏，但这些数字已经开始拒绝低头。"
 tv_academy_debate.2178.t: "观察记录表"
 tv_academy_debate.2179.a: "公布这次失败。"
 tv_academy_debate.2179.b: "隐瞒失败的试验。"
 tv_academy_debate.2179.d: "一项备受称颂的结果在谨慎见证者面前被重新试验，却迟迟不肯出现。失败后的沉默令人难堪，但它也是会场这一周听到的第一种诚实声音。"
 tv_academy_debate.2179.t: "复验失败"
 tv_academy_debate.2180.a: "接受数学方法。"
 tv_academy_debate.2180.b: "要求沿用朴素传统。"
 tv_academy_debate.2180.d: "一名数学家把争议中的自然问题化成简洁的符号，清晰得仿佛是在当面指控几位官员。原本听起来像哲学的话题，如今在纸面上成了一串不得不承认的必然。"
 tv_academy_debate.2180.t: "数学证明"
 tv_academy_debate.2181.a: "资助新仪器。"
 tv_academy_debate.2181.b: "不信任工具制造的主张。"
 tv_academy_debate.2181.d: "一名仪器匠带来镜片、螺丝、黄铜部件，以及那种明白学者其实需要更好双手的平静自信。他坚持说，更好的工具造出的不是更好的玩具，而是更好的真理。"
 tv_academy_debate.2181.t: "仪器匠的主张"
 tv_academy_debate.2182.a: "采纳这套守则。"
 tv_academy_debate.2182.b: "保持绅士式信任。"
 tv_academy_debate.2182.d: "改革者提议制定一套见证、记录和重复实验的守则，里面有表格、签名，以及足以让每位随性天才叹气的程序。他们说，信任也应当留下纸面痕迹。"
 tv_academy_debate.2182.t: "学院实验守则"
 tv_academy_debate.2183.a: "捍卫探究。"
 tv_academy_debate.2183.b: "缓和模型。"
 tv_academy_debate.2183.d: "神职人员警告说，新的天体模型重排的不只是星辰。若天空可以由观察来争辩，讲坛、法庭与王冠都可能被追问还有什么只是未经证明的继承。"
 tv_academy_debate.2183.t: "神职宇宙论异议"
 tv_academy_debate.2184.a: "宣扬这次预测。"
 tv_academy_debate.2184.b: "称它只是巧合。"
 tv_academy_debate.2184.d: "一项计算预告了一场自然现象的时刻，而那现象竟准时到来。片刻之间，连怀疑者也不得不判断：巧合是否已经学会了数学。"
 tv_academy_debate.2184.t: "预言成真"
 tv_academy_debate.2185.a: "改进安全并继续。"
 tv_academy_debate.2185.b: "暂停实验。"
 tv_academy_debate.2185.d: "一场演示轰然炸裂，至少证明了实验确实充满能量。烟雾飘过大厅时，双方都把残骸说成对自己有利的证据。"
 tv_academy_debate.2185.t: "实验室事故"
 tv_academy_debate.2186.a: "接纳工匠证据。"
 tv_academy_debate.2186.b: "维持学术等级。"
 tv_academy_debate.2186.d: "一名工匠解决了学者们用拉丁文包装了数周的实际难题。当工具箱被放上桌面时，几篇精致的注释忽然显得格外沉重。"
 tv_academy_debate.2186.t: "工匠的知识"
 tv_academy_debate.2187.a: "建造陈列柜。"
 tv_academy_debate.2187.b: "保留旧分类。"
 tv_academy_debate.2187.d: "收藏家提议建立一座陈列柜，把贝壳、骨骼、种子与石块按亲眼所见的相似性排列，而不是按继承下来的类别摆放。旧标签仍能贴进抽屉，这正是问题所在。"
 tv_academy_debate.2187.t: "自然史陈列柜"
 tv_academy_debate.2188.a: "开放通信。"
 tv_academy_debate.2188.b: "限制交流。"
 tv_academy_debate.2188.d: "科学家请求在竞争者抢先之前，将书信与成果跨境发表。原本私下流动的墨迹，如今变成一场竞赛，要决定真理究竟属于戒备森严的房间，还是属于所有来得及回应的人。"
 tv_academy_debate.2188.t: "公开通信"
 tv_academy_debate.2189.a: "保留脚注。"
 tv_academy_debate.2189.b: "删除脚注。"
 tv_academy_debate.2189.d: "一位备受尊崇的权威在脚注里遭到反驳，措辞礼貌得近乎残酷。那一页几乎没有高声宣告什么，却偏偏让每个维护旧学问的人都听得清清楚楚。"
 tv_academy_debate.2189.t: "旧大师遭到反驳"
 tv_academy_debate.2190.a: "公开举行。"
 tv_academy_debate.2190.b: "保持试验私密。"
 tv_academy_debate.2190.d: "首席科学家希望举行一场公开实验，让失败无法被掩藏。这个提议让旁听席兴奋不已，也让所有希望不确定性能留在闭门之后的人感到惊恐。"
 tv_academy_debate.2190.t: "公开演示"
 tv_academy_debate.2191.a: "统一度量。"
 tv_academy_debate.2191.b: "接受地方度量。"
 tv_academy_debate.2191.d: "研究者抱怨各省都用不同的工具和自尊来衡量自然。学院终于意识到，当每把尺、每个砝码、每只量器都说着自己的方言时，事实能走出的距离也十分有限。"
 tv_academy_debate.2191.t: "度量标准"
 tv_academy_debate.2192.a: "公开记录错误。"
 tv_academy_debate.2192.b: "维护名声。"
 tv_academy_debate.2192.d: "学者提议把错误也当作数据来研究，这个建议威胁到了许多人的仕途。突然之间，每一次失败的计算、裂开的镜片和变质的样本，都不再只是耻辱，而像是来得不合时宜的证据。"
 tv_academy_debate.2192.t: "解剖错误"
 tv_academy_debate.2193.a: "建造或资助天文台。"
 tv_academy_debate.2193.b: "采用临时观察。"
 tv_academy_debate.2193.d: "天文学家请求建立一座常设天文台，因为天空并不会按时走进室内参加会议。一座高塔、一批仪器和受薪守夜人，能够把零散夜晚里的争论变成一门稳定的学问。"
 tv_academy_debate.2193.t: "皇家天文台"
 tv_academy_debate.2194.a: "将模型视为证据。"
 tv_academy_debate.2194.b: "只把模型当作图解。"
 tv_academy_debate.2194.d: "一名机械匠把模型摆上桌面，转动曲柄。齿轮把看不见的自然过程翻译成运动，满屋人还没来得及端起架子，身体已经向前倾去。"
 tv_academy_debate.2194.t: "机械匠的模型"
 tv_academy_debate.2195.a: "将其出版。"
 tv_academy_debate.2195.b: "推迟出版。"
 tv_academy_debate.2195.d: "一部论著已经准备交给印刷匠，锋利得足以推翻一条旧教义，也昂贵得足以冒犯几乎所有资助学院的人。纸页已经干透，尚未干透的只有勇气。"
 tv_academy_debate.2195.t: "危险的出版"
 tv_academy_debate.2196.a: "保护助手。"
 tv_academy_debate.2196.b: "要求服从。"
 tv_academy_debate.2196.d: "助手们请求得到保护，以免结果违背资助人、导师或王室偏爱的理论时遭到清算。他们愿意诚实测量，却不愿因为看见仪器所显示的事实而毁掉前程。"
 tv_academy_debate.2196.t: "实验誓约"
 tv_academy_debate.2197.a: "接受这个名称。"
 tv_academy_debate.2197.b: "避免为它命名。"
 tv_academy_debate.2197.d: "有人为这套方法取了名字，于是一簇习惯忽然变成了一场运动。支持者如释重负地重复它，反对者警惕地重复它，犹豫者则危险地感觉到，历史也许正需要一个标签。"
 tv_academy_debate.2197.t: "新方法得名"
 tv_academy_world_debate_situation: "科学院世界辩论"
 tv_academy_world_debate_situation_desc: "拥有科学院的国家会在世界辩论阶段围绕同一思潮展开辩论。"
