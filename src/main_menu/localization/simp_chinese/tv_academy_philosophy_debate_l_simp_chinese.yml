 STATIC_MODIFIER_DESC_tv_academy_debate_royal_warrior_clans_modifier: "该阶层因王室在哲学辩论中公开抬举其代表而更加满意，也拥有更高影响力。"
 STATIC_MODIFIER_DESC_tv_academy_debate_scandal_sheet_crackdown: "惩罚印刷商把丑闻立成了警示，恢复了看得见的秩序，却也让每个旁观者明白：出版自由止步于宫廷的难堪。"
 STATIC_MODIFIER_DESC_tv_academy_debate_sealed_cargo_order: "封存货物挡下了混乱与谣言，却也让发现停留在抽象层面，握在官员手中。公众被剥夺了最直接的证据，辩论的势头因此减弱。"
 STATIC_MODIFIER_DESC_tv_academy_debate_service_rolls: "将严格的服役计入考量，把才能的范围从考场向外拓展，却不放开对证据的要求。职业军人为此赞同，因为长年效力终成一份可读的资格，而不再只是诉诸旧情的恳求。"
 STATIC_MODIFIER_DESC_tv_academy_debate_simplified_tariffs: "把税目删减下来，全球贸易便从偶然的特权变成一套读得懂的制度。商人能依着清晰规则筹划，接受倾向随之增强，尽管旧日的海关租利也悄悄枯竭。"
 STATIC_MODIFIER_DESC_tv_academy_debate_standard_military_contracts: "标准化生产把制造工场同国家能力绑在一起：作坊能反复照一份规格来做，武器、制服和补给便可靠；职业军队支持这项改革，因为战场上可预期性能取胜。"
 STATIC_MODIFIER_DESC_tv_academy_debate_standard_weights: "全国一套标准，让远方市场变得可比较、可执行，全球贸易于是显得是一套法度，而非一连串地方把戏。官吏与商人也一同得到了共通的计量语言。"
 STATIC_MODIFIER_DESC_tv_academy_debate_subject_catalogue: "按学科编目，会悄然把比较与分类这些文艺复兴习惯变得寻常，给学者一个温和却稳定的理由去支持这项新议。"
 STATIC_MODIFIER_DESC_tv_academy_debate_textbook_review: "再审查一季能安抚谨慎的教师和他们保守的赞助者，却把印刷术统一知识的能力当成一桩最好拖着的风险。"
 STATIC_MODIFIER_DESC_tv_academy_debate_trade_embassy_reception: "在敞开的大厅接待使节，是把全球贸易当作既凭契约、也凭使节进行的外交。收益有限，因为更近的往来在带来机会的同时，也把敌手的影响放进了会场。"
 STATIC_MODIFIER_DESC_tv_academy_debate_visible_port_closure: "把外国船挡在堤外，靠掐紧货流来把安全感做给人看。辩论因此失分，因为外国交换被当成病症本身——哪怕民众正为港口的果断鼓掌。"
 STATIC_MODIFIER_DESC_tv_academy_debate_waterwheel_disruption: "兴建水力工场证明制造工场不只是把工人赶到一处，还能驱使自然之力，论点因此大幅推进；附近社区则要承受新水渠、水权与日常节奏被打乱的扰动。"
 STATIC_MODIFIER_NAME_tv_academy_debate_artisan_demonstrations: "工匠的知识：名册把这名工匠的成果，与那些博学之人的成果并列在册。"
 STATIC_MODIFIER_NAME_tv_academy_debate_avoided_foreign_claim_crisis: "外国声索：息事宁人吧——那片纸上的海岸，就让给对手。"
 STATIC_MODIFIER_NAME_tv_academy_debate_battered_chart: "水手的海图：领航员们把海图钉在大案之上，照着它定下航向。"
 STATIC_MODIFIER_NAME_tv_academy_debate_bespoke_supply_networks: "军需合同：我们宁可留着每家供应商各自的手法。"
 STATIC_MODIFIER_NAME_tv_academy_debate_bills_of_exchange: "汇票：学院认可汇票，作为一纸合法的信用凭证。"
 STATIC_MODIFIER_NAME_tv_academy_debate_broadsides_watch: "匿名传单：巡役受命顺着浆糊追查，看是谁调的。"
 STATIC_MODIFIER_NAME_tv_academy_debate_cabinet_of_curiosities: "原住民使者的叙述：文吏把这份叙述归入陈列柜里的奇珍异闻。"
 STATIC_MODIFIER_NAME_tv_academy_debate_capital_certification: "首都之外的学校：首都不盖印，一概免谈。"
 STATIC_MODIFIER_NAME_tv_academy_debate_catechism_lessons: "教理问答草案：趁争论还没追上来，我们先把它送进印坊。"
 STATIC_MODIFIER_NAME_tv_academy_debate_central_print_office: "大学自己的印刷所：我们要让国中每一台印刷机，都归一个衙门管辖。"
 STATIC_MODIFIER_NAME_tv_academy_debate_ceremonial_patronage: "赞助账册：宫廷的施予仍是礼仪，止于形式。"
 STATIC_MODIFIER_NAME_tv_academy_debate_child_labor_rules: "童工请愿：学院给工作台定下年龄，再让活计继续。"
 STATIC_MODIFIER_NAME_tv_academy_debate_civil_posts_separate: "老兵服役名册：各部把文职名册与征兵名册分开摆放。"
 STATIC_MODIFIER_NAME_tv_academy_debate_civil_press_boundary: "营房里的印刷机：我们让印刷机只管民政事务。"
 STATIC_MODIFIER_NAME_tv_academy_debate_clergy_marriage_jurisdiction: "婚姻法庭：婚姻仍在一贯裁断之处了结——教会自己的法庭。"
 STATIC_MODIFIER_NAME_tv_academy_debate_clerical_discipline: "教士分裂：君主把教士约束于他们所侍奉的教义之下。"
 STATIC_MODIFIER_NAME_tv_academy_debate_clock_discipline: "钟表纪律：钟铃挂了起来，一天照着它们的刻度被切开。"
 STATIC_MODIFIER_NAME_tv_academy_debate_closed_royal_accounts: "王室的账目：宫廷把账目锁着，数字也只留给自己。"
 STATIC_MODIFIER_NAME_tv_academy_debate_commission_review: "战场上的功绩：评审会把经过考验的指挥资历，正式录入资格名册。"
 STATIC_MODIFIER_NAME_tv_academy_debate_common_army_oath: "军中誓词：趁地方习俗还没把军营分开，我们先用一份誓词把整座营地系紧。"
 STATIC_MODIFIER_NAME_tv_academy_debate_consensus_delay: "教理问答草案：草案退回委员会，再走一轮共识。"
 STATIC_MODIFIER_NAME_tv_academy_debate_corrected_charts: "制图师的修正：修正后的海岸连同边界，一并录入母本海图。"
 STATIC_MODIFIER_NAME_tv_academy_debate_court_masque: "宫廷新生假面剧：王室为音乐、戏服与舞台机关买单。"
