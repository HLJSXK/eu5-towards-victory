 STATIC_MODIFIER_DESC_tv_academy_debate_provincial_training: "承认这所学校，就是承认行政才能可以在首都礼法和庇护圈之外培养。地方自治会因此更有信心，因为地方机构被视为人才来源，而不是等待核准的边缘。"
 STATIC_MODIFIER_DESC_tv_academy_debate_quarantine_precautions: "资助防疫意味着承认医生的警告，却不让恐惧决定整个议题。由于探索被塑造成可管理、可规制的风险，而不是鲁莽欲望，辩论会小幅转向接受。"
 STATIC_MODIFIER_DESC_tv_academy_debate_quarantine_reform: "改善检疫体系，等于主张全球贸易可以在不关闭港口的前提下变得更安全。改革消除了一个实际反对理由，因此接受度小幅上升，但国库必须支付检查能力的成本。"
 STATIC_MODIFIER_DESC_tv_academy_debate_quiet_courtyards: "禁止集会能防止业余论辩演变为街头争执，从而维护秩序，但也会削弱接受新主张的势头。"
 STATIC_MODIFIER_DESC_tv_academy_debate_rankings_suspended: "暂停排名让贵族家族获得公开胜利，也稳定了他们的配合，却等于承认门第足以叫停证据。"
 STATIC_MODIFIER_DESC_tv_academy_debate_reformed_colonial_charters: "改革特许制度承认了滥用，却主张发现事业可以被治理，而不是被抛弃。接受度会小幅上升，因为规制挽救了原则；但市民阶层会失去一部分经营远方事业的自由。"
 STATIC_MODIFIER_DESC_tv_academy_debate_restricted_correspondence: "限制交流会让重视安全的官员把科学书信说成泄密，而不是证据。这会使公开探究显得像外交冒险，从而强烈推动拒斥方向。"
 STATIC_MODIFIER_DESC_tv_academy_debate_royal_account_published: "公布账目意味着王权以自身示范它要求他人接受的财政纪律。改革因此大获推动，但每一个暴露出的弱点都可能变成政治论据，正当性也随之冒险。"
 STATIC_MODIFIER_DESC_tv_academy_debate_royal_burghers_modifier: "该阶层因王室在哲学辩论中公开抬举其代表而更加满意，也拥有更高影响力。"
