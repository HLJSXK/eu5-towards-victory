 # ── Towards Victory — Game Concepts ───────────────────────────────────────
 game_concept_tv_conquest_score: "征服分数"
 game_concept_tv_conquest_score_desc: "征服分数衡量您国家的领土规模。每个直接拥有的地点加1分；每个[subject|e]或下属国家持有的地点加0.5分。每月更新。达到2,500即可实现[tv_victory_situation|E]的长期胜利。"

 game_concept_tv_prosperity_score: "繁荣分数"
 game_concept_tv_prosperity_score_desc: "繁荣分数追踪您国家的国内发展水平。它综合总人口、所有拥有地点的发展度与国家税基，并按国家规模、稳定度和政府权力进行修正。每年更新。达到11,000即可实现[tv_victory_situation|E]的长期胜利。"

 game_concept_tv_trade_score: "贸易分数"
 game_concept_tv_trade_score_desc: "贸易分数反映您的商业实力。它是您国家每月[trade_income|e]总量的月度快照。达到2,000即可实现[tv_victory_situation|E]的长期胜利。"

 game_concept_tv_diplomatic_victory_points: "外交胜利点"
 game_concept_tv_dvp: "DVP"
 game_concept_tv_diplomatic_victory_points_desc: "外交胜利点（DVP）来自加入[tv_diplomatic_alliance|e]后每月的[tv_alliance_tier|e]产出：联盟领袖获得完整等级，非领袖成员获得一半。里程碑设于1、50、500、2,500和15,000点DVP。"

 game_concept_tv_cultural_influence_points: "文化影响力点"
 game_concept_tv_cip: "CIP"
 game_concept_tv_cultural_influence_points_desc: "文化影响力点（CIP）通过艺术成就积累：每创作一件[work_of_art|e]为拥有者国家增加3点CIP。CIP永不减少。达到1,600即可实现[tv_victory_situation|E]的长期胜利。"

 game_concept_tv_science_score: "科技分数"
 game_concept_tv_science_score_desc: "科技分数追踪您国家的技术进步。它是您国家已研究的[advances|e]总数的月度快照。达到400即可实现[tv_victory_situation|E]的长期胜利。"

 # ── Situation ──────────────────────────────────────────────────────────────
 game_concept_tv_victory_situation: "胜利之路"
 game_concept_tv_victory_situation_desc: "胜利之路是一项对所有国家永久生效的局势，同步追踪六条通往霸主地位的路径上的进展。每条路径设有五个里程碑；达到第三里程碑可获得短期胜利奖励，达到第五里程碑则实现长期胜利。可通过胜利之路面板随时查看己方与竞争对手的进展。"

 # ── Six Victory Types ──────────────────────────────────────────────────────
 game_concept_tv_conquest_victory: "征服胜利"
 game_concept_tv_conquest_victory_desc: "以领土扩张主宰世界。[tv_conquest_score|e]衡量你的疆域规模：直属领地完整计算，附属国与封臣领地折半计算。里程碑设于200、400、600、1,200和2,500，奖励军事战力与伟大遗产。"

 game_concept_tv_prosperity_victory: "繁荣胜利"
 game_concept_tv_prosperity_victory_desc: "建立最富庶、发展最完善的国家。[tv_prosperity_score|e]奖励规模庞大、稳定且治理良好的发展，而不只是单纯的领土数量。里程碑设于2,000、3,000、5,000、7,000和11,000，奖励国内生产、人口增长与建设能力。"

 game_concept_tv_trade_victory: "贸易胜利"
 game_concept_tv_trade_victory_desc: "掌控世界商业命脉。[tv_trade_score|e]是你每月贸易收入的月度快照。[tv_trade_league|e]会通过IO建立流程创立，并在贸易胜利进度解锁前完成；第三和第五里程碑还要求主导市场数量（分别为5和10个）。奖励着重商人容量、贸易效率与贸易收入倍增。"

 game_concept_tv_diplomatic_victory: "外交胜利"
 game_concept_tv_diplomatic_victory_desc: "构建世界上最强大的联盟与影响力网络。建立或加入[tv_diplomatic_alliance|e]会解锁外交胜利进度，但[tv_dvp|e]每月由[tv_alliance_tier|e]产生，里程碑设于1、50、500、2,500和15,000。"

 game_concept_tv_cultural_victory: "文化胜利"
 game_concept_tv_cultural_victory_desc: "以艺术与文化输出塑造文明。[tv_cip|e]永久积累：每创作一件艺术品+3。里程碑设于50、200、400、800和1,600，奖励艺术家技能、威望与文化传统。第2至5里程碑还要求最低[tv_arts_intl_influence|e]分别达到25、50、75和100。"

 game_concept_tv_science_victory: "科技胜利"
 game_concept_tv_science_victory_desc: "引领人类迈入理性时代。[tv_science_score|e]追踪已研究的进步总数。每个里程碑还需在首都建造[tv_academy_of_sciences|e]的相应阶段。奖励加速研究、机构传播与生产。"

 # ── Prosperity Victory Unique Mechanics ───────────────────────────────────
 game_concept_tv_engineering_department: "工程部"
 game_concept_tv_engineering_department_desc: "通过[tv_prosperity_victory|e]IO建立流程创立的非唯一国际组织。它负责[tv_great_engineer|e]职位，并管理奇观提案、论证、选址、组织、物流和[tv_wonder_construction|e]。"

 game_concept_tv_great_engineer: "大工程师"
 game_concept_tv_great_engineer_desc: "领导[tv_engineering_department|e]的任命角色。[tv_great_engineer|e]以国家变量保存，可在[tv_engineering_department|e]面板中任命、更换或撤职。"

 game_concept_tv_wonder_survey: "奇观测绘"
 game_concept_tv_wonder_survey_desc: "[tv_wonder_construction|e]的工地评估阶段。测绘进度每月由[tv_great_engineer|e]的军事能力推动，并揭示规模、物流与组织三项称职度；读数完成后，国家即可确认建设地点。"

 game_concept_tv_wonder_materials: "奇观建材"
 game_concept_tv_wonder_materials_desc: "一种用于维护$tv_wonder_labor_camp$的市场商品。$tv_wonder_material_dispatch_point$把基础建筑商品加工成[tv_wonder_materials|e]，其供给与价格由普通市场处理。"

 game_concept_tv_wonder_ceremony: "奇观仪式"
 game_concept_tv_wonder_ceremony_desc: "[tv_wonder_construction|e]完工后的最终献成。所选仪式分支决定纪念碑的最终建筑、永久国家修正，并根据剩余[tv_wonder_domestic_support|e]给予最后一轮威望、稳定度与正统性奖励。"

 game_concept_tv_wonder_construction: "奇观建设"
 game_concept_tv_wonder_construction_desc: "由[tv_engineering_department|e]管理的[tv_prosperity_victory|e]机制。[tv_great_engineer|e]会提出可行的[tv_wonder_small|e]、[tv_wonder_medium|e]或[tv_wonder_large|e]，国家完成国内论证后，可以选址、组织劳工、收集物资，并将四个建设部分推进为实际奇观等级。"

 game_concept_tv_wonder_small: "小型奇观"
 game_concept_tv_wonder_small_desc: "[tv_wonder_construction|e]的规模分类。小型奇观可以重复建造。其基础国家效果仅限价值观移动，本地效果与仪式效果不受此限制。"

 game_concept_tv_wonder_medium: "中型奇观"
 game_concept_tv_wonder_medium_desc: "[tv_wonder_construction|e]的规模分类，介于小型与大型之间。同一国家不能开启第二个同类型中型奇观，但其基础国家效果、本地效果与仪式效果不受类型限制。"

 game_concept_tv_wonder_large: "大型奇观"
 game_concept_tv_wonder_large_desc: "[tv_wonder_construction|e]的规模分类。同一国家不能开启第二个同类型大型奇观，但其基础国家效果、本地效果与仪式效果不受类型限制。"










 game_concept_tv_wonder_domestic_support: "国内支持度"
 game_concept_tv_wonder_domestic_support_desc: "[tv_wonder_construction|e]资源，代表精英与公众对大型奇观工程的支持。达到100即可结束初始辩论；支持度最多储存到200，并会在辩论结束后逐月衰减。"

 game_concept_tv_wonder_scale_competence: "规模适性"
 game_concept_tv_wonder_scale_competence_desc: "[tv_wonder_survey|e]读数，衡量选址能否承载奇观预期的尺度、轴线、地基与公共入口，而不至于把设计压成尴尬的形状。它以20%、40%、60%、80%、100%为分界决定奇观最大等级，6级奇观需要100%适性。"

 game_concept_tv_wonder_organization_competence: "组织适性"
 game_concept_tv_wonder_organization_competence_desc: "[tv_wonder_survey|e]读数，衡量劳役名册、工头、工坊与施工阶段能否听命于同一张计划，而不是被互相竞争的号令拉扯。它以0%到100%线性决定0到20级奇观工地最大等级。"

 game_concept_tv_wonder_logistics_competence: "物流适性"
 game_concept_tv_wonder_logistics_competence_desc: "[tv_wonder_survey|e]读数，衡量道路、车队、港口、桥梁与交接点能否让[tv_wonder_materials|e]在匠人需要时抵达工地。"

 # -- 贸易胜利独有机制 --------------------------------------------------------
 game_concept_tv_trade_league: "贸易联盟"
 game_concept_tv_trade_league_desc: "通过[tv_trade_victory|e]IO建立流程创立的非唯一国际组织。盟主可邀请或驱逐成员、任命[tv_grand_merchant|e]，并追踪商品垄断。"

 game_concept_tv_grand_merchant: "大商人"
 game_concept_tv_grand_merchant_desc: "领导[tv_trade_league|e]的任命角色。没有[tv_grand_merchant|e]时，贸易链、商业情报和垄断系统不会激活。"

 game_concept_tv_trade_monopoly: "贸易垄断"
 game_concept_tv_trade_monopoly_desc: "[tv_trade_league|e]针对单一商品的垄断状态。每月联盟会遍历全球市场，分别计算原产、中转和消费控制率；最终0-100%的垄断水平取三者中的最高值。达到25%的商品可填入垄断槽，入槽且达到50%后才可使用垄断行动，将部分垄断水平锁定到虚构需求、虚构生产或禁运施压。"

 # ── Diplomatic Victory Unique Mechanics ───────────────────────────────────
 game_concept_tv_diplomatic_alliance: "外交联盟"
 game_concept_tv_diplomatic_alliance_desc: "通过[tv_diplomatic_victory|e]建立的非唯一国际组织。它由[tv_alliance_advocator|e]领导，通过[tv_alliance_assembly|e]进行政策投票，并依靠[tv_alliance_tier|e]与[tv_alliance_cohesion|e]发展。"

 game_concept_tv_alliance_advocator: "倡导者"
 game_concept_tv_alliance_advocator_desc: "受任领导[tv_diplomatic_alliance|e]的角色。[tv_alliance_advocator|e]提出联盟法律，代表创始国的外交事业，并可参与[tv_alliance_assembly|e]。"

 game_concept_tv_alliance_assembly: "联盟议会"
 game_concept_tv_alliance_assembly_desc: "[tv_diplomatic_alliance|e]的议会场所。成员在此审议并表决联盟法律，将[tv_alliance_cohesion|e]转化为更高的[tv_alliance_tier|e]。"

 game_concept_tv_alliance_tier: "联盟等级"
 game_concept_tv_alliance_tier_desc: "[tv_diplomatic_alliance|e]的0至15变量，代表联盟制度的发展程度。通过升级后的联盟法律会消耗[tv_alliance_cohesion|e]并提高[tv_alliance_tier|e]。每点等级每月为联盟领袖提供1点[tv_dvp|e]，并为每个非领袖成员提供0.5点[tv_dvp|e]。"

 game_concept_tv_alliance_cohesion: "联盟凝聚力"
 game_concept_tv_alliance_cohesion_desc: "[tv_diplomatic_alliance|e]的0至100变量，衡量联盟成员之间的合作程度。它每月从基础增长、领袖国家的外交声望和联盟内部和平中增长。升级后的联盟法律会消耗凝聚力，以提高[tv_alliance_tier|e]。"

 # ── Cultural Victory Unique Mechanics ──────────────────────────────────────
 game_concept_tv_arts_intl_influence: "国际影响力"
 game_concept_tv_arts_intl_influence_desc: "衡量你的国家在境外文化影响力的指标，通过[tv_arts_exhibition|e]积累，主要来自派遣艺术家出国巡演。随着旧日文化输出的影响消退，它每月衰减当前值的0.1%。[tv_cultural_victory|E]第2至5里程碑分别要求[tv_arts_intl_influence|e]达到25、50、75和100。"

 game_concept_tv_domestic_exhibition: "国内展出"
 game_concept_tv_domestic_exhibition_desc: "通过[tv_arts_exhibition|e]在本国境内举办的持续性展览。需要至少5件拥有的艺术品并选择一处首要地点，花费缩放金钱×3.5，以80点[tv_local_exhibition_enthusiasm|e]开场，并在闭幕时产出[tv_cip|e]。展出期间可投入更多展品并花费缩放金钱×1，将展览扩大到相邻的本国地点；追加展品需求从5提升至10，之后固定为20。闭幕[tv_cip|e]按单位地点计算：每个持续月份0.5点加等级奖励（-3 / 0 / +3 / +6），再乘以展出地点数。"

 game_concept_tv_local_exhibition_enthusiasm: "展览热情"
 game_concept_tv_local_exhibition_enthusiasm_desc: "[tv_arts_exhibition|e]IO变量，用于[tv_domestic_exhibition|e]。开始时为80，上限为200，每月衰减8；降至0时，展览结束。"

 game_concept_tv_arts_exhibition: "文艺展演"
 game_concept_tv_arts_exhibition_desc: "联合文化雄心勃勃国家的国际组织。国家通过[tv_cultural_victory|e]IO建立流程创建并加入自己的实例。成员可派遣[tv_artist_tour|e]，也可举办[tv_domestic_exhibition|e]。[tv_domestic_exhibition|E]需要至少5件艺术品，花费缩放金钱×3.5，使用[tv_local_exhibition_enthusiasm|e]维持，可投入更多展品扩大到相邻本国地点，并在结束时产出按地点数乘算的[tv_cip|e]。"

 game_concept_tv_chief_artist: "首席艺术家"
 game_concept_tv_chief_artist_desc: "领导[tv_arts_exhibition|e]的任命艺术家。其艺术能力每月贡献[tv_arts_intl_influence|e]，只要仍在宫廷中，也可以主持[tv_arts_exchange|e]。"

 game_concept_tv_arts_exchange: "艺术交流会"
 game_concept_tv_arts_exchange_desc: "由[tv_chief_artist|e]主持、持续一年的[tv_arts_exhibition|e]项目。国内与外国艺术家都可受邀参与，共同产生技能成长、灵感、威望与文化影响。"

 game_concept_tv_artist_tour: "海外艺术巡演"
 game_concept_tv_artist_tour_desc: "[tv_arts_exhibition|e]行动，可派遣一位艺术家前往外国宫廷巡演1至10年。巡演能提高[tv_arts_intl_influence|e]、触发特殊文化事件，并可能带回艺术品、研究进展、金钱或悲剧。"
 # ── Scientific Victory Unique Mechanics ────────────────────────────────────
 game_concept_tv_academy_of_sciences: "科学院"
 game_concept_tv_academy_of_sciences_desc: "锁定各科技胜利里程碑的五阶段首都建筑与国际组织。第一阶段在[tv_science_score|e]达到100时解锁；后续阶段分别在150、200、300和400时解锁。每个阶段必须在首都实际建造完毕，相应里程碑方可触发。第一阶段还会开启[tv_research_mechanism|e]。"

 game_concept_tv_chief_scientist: "首席科学家"
 game_concept_tv_chief_scientist_desc: "主持[tv_academy_of_sciences|e]的任命学者。其[tv_effective_administrative_skill|e]推动[tv_concentrated_research|e]、[tv_academy_medical_treatment|e]、[tv_academy_meditation|e]以及多类[tv_academy_of_sciences|E]事件。"

 game_concept_tv_research_mechanism: "研究机制"
 game_concept_tv_research_mechanism_desc: "[tv_academy_of_sciences|e]的运作系统。一个研究周期会选择一项前沿[tv_research_target|e]，收集[tv_research_interest|e]，完成前置条件与[tv_literacy_foundation|e]子流程，最后通过[tv_concentrated_research|e]解锁目标。这是获得进步的额外路线，不会锁定正常研究。"

 game_concept_tv_research_target: "研究目标"
 game_concept_tv_research_target_desc: "[tv_research_mechanism|e]当前选定的锁定进步。目标确定后，[tv_academy_of_sciences|E]必须积累[tv_research_interest|e]、完成前置研究、打下[tv_literacy_foundation|e]，并结束[tv_concentrated_research|e]，该目标才会解锁。"

 game_concept_tv_research_interest: "学术兴趣"
 game_concept_tv_research_interest_desc: "[tv_research_mechanism|e]的第一项子流程，代表宫廷中的好奇心、学者间的议论，以及愿意把注意力投入当前[tv_research_target|e]的赞助者。"

 game_concept_tv_literacy_foundation: "识字基础"
 game_concept_tv_literacy_foundation_desc: "[tv_research_mechanism|e]中的人口学习子流程。它衡量是否已有足够读者、书记、教师与工坊使用者，能把新进步带出[tv_academy_of_sciences|E]高墙。"

 game_concept_tv_effective_administrative_skill: "等效行政能力"
 game_concept_tv_effective_administrative_skill_desc: "[tv_chief_scientist|e]在[tv_academy_of_sciences|e]工作中发挥的实际行政能力。大科学家特质可使其高于角色原本的行政能力；数值越高，[tv_concentrated_research|e]越可能进入更安全的事件池。"

 game_concept_tv_academy_medical_treatment: "科学院医疗"
 game_concept_tv_academy_medical_treatment_desc: "[tv_academy_of_sciences|e]项目，由[tv_chief_scientist|e]治疗一位患有健康状况的角色。治疗会通过发现与事故事件推进，直到病人康复、死亡或研究被重置。"

 game_concept_tv_academy_meditation: "科学院冥想"
 game_concept_tv_academy_meditation_desc: "[tv_academy_of_sciences|e]项目，由[tv_chief_scientist|e]引导一位角色摆脱负面统治者、内阁或艺术家特质。冥想会通过反思事件获得或失去进度。"

 game_concept_tv_concentrated_research: "集中研究"
 game_concept_tv_concentrated_research_desc: "[tv_research_mechanism|e]的最终子流程。它需要一位已任命且[tv_effective_administrative_skill|e]至少20的[tv_chief_scientist|e]，每月根据其等效能力获得进度，生效期间施加临时研究速度惩罚，并在进度达到100时完成。"

 # ── Conquest Victory Unique Mechanics ──────────────────────────────────────
 game_concept_tv_govhouse: "总督府"
 game_concept_tv_govhouse_desc: "通过[tv_conquest_victory|e]IO建立流程创立的国际组织。创始国可任命[tv_grand_general|e]，并向领土内各地区派遣[tv_local_governor|e]。每位总督可降低其管辖地区内的建造费用与动乱，并提升最大控制力，效果与其军事属性成正比。"
 game_concept_tv_grand_general: "大将军"
 game_concept_tv_grand_general_desc: "通过[tv_govhouse|e]任命的最高军事统帅。[tv_grand_general|e]可以接受训练、提出战术与[tv_war_plan|e]，并在任期间积累[tv_govhouse_power_consolidation|e]。"
 game_concept_tv_local_governor: "地方总督"
 game_concept_tv_local_governor_desc: "由[tv_govhouse|e]派往某一地区治理的角色。[tv_local_governor|E]根据[tv_govhouse|e]法律及个人能力，为该地区提供建造、动乱、控制、生产、人口或防御加成。每位总督还会根据地方需求选择一项[tv_governor_autonomous_task|e]。"
 game_concept_tv_governor_autonomous_task: "总督自主任务"
 game_concept_tv_governor_autonomous_task_desc: "[tv_local_governor|e]每年为其管辖地区选择的治理重点。任务可恢复繁荣、整合地区、转换文化、转换宗教、加强征兵或强化秩序；选择由地区权重决定，并可受[tv_govhouse|e]法律倾向影响。"
 game_concept_tv_govhouse_plan_progress: "计划进度"
 game_concept_tv_govhouse_plan_progress_desc: "[tv_govhouse|E]的[tv_war_tent|e]中由[tv_grand_general|e]积累的数值。[tv_war_plan|E]会在相关战争条件生效时，将它转化为随进度提高的军事加成。"
 game_concept_tv_war_tent: "战帐"
 game_concept_tv_war_tent_desc: "[tv_govhouse|e]中用于[tv_grand_general|e]战术与[tv_war_plan|e]的指挥标签页。战争期间，[tv_grand_general|e]可以提出战术供你批准。战前或战时，玩家可以准备[tv_war_plan|e]，将[tv_govhouse_plan_progress|e]转化为临时军事加成。"
 game_concept_tv_war_plan: "战争计划"
 game_concept_tv_war_plan_desc: "来自[tv_war_tent|e]的预备战略。进攻计划会指定目标国家，并在对该目标开战后，将[tv_govhouse_plan_progress|e]转化为围城能力与训练度。防御计划会在防御战争中激活，并将进度转化为要塞防御与军事战术。"
 game_concept_tv_govhouse_power_balance: "权力平衡"
 game_concept_tv_govhouse_power_balance_desc: "[tv_govhouse|e]中表示实际权力有多少归属于[tv_grand_general|e]而非王室的数值。它每月向均衡值移动，而均衡值受统治者能力、[tv_grand_general|e]能力和[tv_govhouse_power_consolidation|e]影响。[tv_grand_general|e]权力越高，越会解锁严厉的反弹事件。"
 game_concept_tv_govhouse_power_consolidation: "巩固权力"
 game_concept_tv_govhouse_power_consolidation_desc: "[tv_grand_general|e]在任期间逐渐积累的个人权势。它会随时间上升，将[tv_govhouse_power_balance|e]推向[tv_grand_general|e]一侧，并决定罢免或更换[tv_grand_general|e]所需的政府权力花费。[tv_grand_general|e]离任时归零。"

 # Additional Engineering Department wonder concepts
