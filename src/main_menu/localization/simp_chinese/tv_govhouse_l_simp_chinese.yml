 tv_remove_governor: "取消总督"
 tv_remove_governor_desc: "取消该地区的总督安排，其地区加成将立即移除。"
 tv_change_governor: "更换总督"
 tv_change_governor_desc: "以另一位符合条件的角色替换该地区现任总督。"

