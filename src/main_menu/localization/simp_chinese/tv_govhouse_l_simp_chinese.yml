 # ── 训练行动 ─────────────────────────────────────────────────────────────────
 tv_train_grand_general: "训练大将军"
 tv_train_grand_general_desc: "对大将军进行一年的强化训练。训练期间宫廷花费增加10%。训练结束后，将随机触发以下结果之一：军事能力提升、军事特质路线晋级，或——极少情况下——受伤乃至死亡。"

 PERFORM_tv_train_grand_general_ACTION_SETUP: "当我们开始训练大将军时。"
