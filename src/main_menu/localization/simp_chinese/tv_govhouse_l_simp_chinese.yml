 # ── 地方总督随机事件 ─────────────────────────────────────────────────────────
 tv_govhouse.100.t: "[tv_local_governor|E]：总督私设关卡"
 tv_govhouse.100.d: "[SCOPE.sCharacter('tv_gov_event_governor').GetShortNameWithNoTooltip]在[SCOPE.sLocation('tv_gov_event_location').GetName]一带的要道与港口增设临时税卡，声称这是弥补地方财政空缺的权宜之计。商人抱怨车队被迫反复缴费，本地贵族却乐见外来货物被挡在门外。[tv_govhouse|E]送来的账册看似漂亮，但每一枚新税钱都在提醒中央：远方官员正在学会自己解释法令。"
 tv_govhouse.100.a: "默许临时税卡。"
 tv_govhouse.100.b: "派巡按拆除关卡。"

 tv_govhouse.101.t: "[tv_local_governor|E]：殖民地商人暴动"
 tv_govhouse.101.d: "[SCOPE.sCharacter('tv_gov_event_governor').GetShortNameWithNoTooltip]要求[SCOPE.sLocation('tv_gov_event_location').GetName]附近商人只能经由特许公司交易。港口随即罢市，税吏在空码头前等待，几名船长甚至雇佣武装护航，公开宣称他们只是在保护自己的货物。贸易垄断让[tv_govhouse|E]更容易收税，也让地方资本第一次尝到联合抵抗的力量。"
 tv_govhouse.101.a: "强行重开港口。"
 tv_govhouse.101.b: "承认有限自由贸易。"

 tv_govhouse.102.t: "[tv_local_governor|E]：原住民向总督献礼"
 tv_govhouse.102.d: "来自[SCOPE.sLocation('tv_gov_event_location').GetName]周边的部族使者抵达[tv_govhouse|E]，向[SCOPE.sCharacter('tv_gov_event_governor').GetShortNameWithNoTooltip]献上象征臣服与友好的礼物。他们期待的是保护、互市和一套能被双方理解的礼节，而非写在遥远宫廷里的抽象法理。如何回应这份礼物，将决定边疆接下来记住的是盟约还是威胁。"
 tv_govhouse.102.a: "接受朝贡并提供保护。"
 tv_govhouse.102.b: "以礼物换取向导与情报。"

 tv_govhouse.103.t: "[tv_local_governor|E]：总督家族联姻"
 tv_govhouse.103.d: "[SCOPE.sCharacter('tv_gov_event_governor').GetShortNameWithNoTooltip]的家族与[SCOPE.sLocation('tv_gov_event_location').GetName]附近一支显贵家族缔结婚约。地方精英迅速围拢到总督身边，宴席上的祝词把帝国、家族和土地说成同一件事。宫廷却听出了另一层含义：一个外派官员正在被当地社会收养。"
 tv_govhouse.103.a: "承认这桩婚约。"
 tv_govhouse.103.b: "要求婚约接受中央登记。"

 tv_govhouse.104.t: "[tv_local_governor|E]：海盗袭击海岸"
 tv_govhouse.104.d: "海盗在[SCOPE.sLocation('tv_gov_event_location').GetName]外海袭击船队，幸存商船带回了烧焦的桅杆和互相矛盾的证词。[SCOPE.sCharacter('tv_gov_event_governor').GetShortNameWithNoTooltip]请求增派兵船，但也有人报告说，总督的幕僚正与几名海盗头目秘密接触。边疆海面上，走私者、私掠者与正规贸易常常只隔着一纸许可。"
 tv_govhouse.104.a: "派兵清剿海盗。"
 tv_govhouse.104.b: "默许总督私下招安。"

 tv_govhouse.105.t: "[tv_local_governor|E]：总督秘密扩军"
 tv_govhouse.105.d: "[SCOPE.sCharacter('tv_gov_event_governor').GetShortNameWithNoTooltip]声称中央支援迟缓，已在[SCOPE.sLocation('tv_gov_event_location').GetName]周边自行招募士兵。新兵让道路安全了几分，军饷来源却含混不清，地方豪强也开始把自己的年轻人送入这支队伍。若中央追认此事，边疆会更安全；若置之不理，安全本身也会变成总督的私人资本。"
 tv_govhouse.105.a: "追认地方招募。"
 tv_govhouse.105.b: "命其裁撤私兵。"

 tv_govhouse.106.t: "[tv_local_governor|E]：传教士与军队冲突"
 tv_govhouse.106.d: "传教士公开指责[SCOPE.sCharacter('tv_gov_event_governor').GetShortNameWithNoTooltip]纵容驻军在[SCOPE.sLocation('tv_gov_event_location').GetName]征粮，称受洗者与未受洗者都不该被当作军粮账目。驻军则反驳说，若没有粮食，秩序只会比神学更快崩溃。宗教与行政在边疆并非天然同盟，它们只是暂时走在同一条路上。"
 tv_govhouse.106.a: "支持传教士。"
 tv_govhouse.106.b: "支持驻军征粮。"

 tv_govhouse.107.t: "[tv_local_governor|E]：黄金矿脉发现"
 tv_govhouse.107.d: "一支探险队在[SCOPE.sLocation('tv_gov_event_location').GetName]附近发现了含金矿脉。消息比公文传得更快，移民、商人、赌徒和工匠已经沿道路涌来。[SCOPE.sCharacter('tv_gov_event_governor').GetShortNameWithNoTooltip]请求建立矿务秩序，以免财富在到达国库之前先点燃边疆。"
 tv_govhouse.107.a: "建立矿务秩序。"

 tv_govhouse.108.t: "[tv_local_governor|E]：总督长期失联"
 tv_govhouse.108.d: "战争、海难或纯粹的坏天气切断了与[SCOPE.sCharacter('tv_gov_event_governor').GetShortNameWithNoTooltip]的联络。来自[SCOPE.sLocation('tv_gov_event_location').GetName]的最后一封信已经陈旧，地方书记、军官和商人开始自行处理政务。当前现代帝国的命令抵达太晚，空白本身就会变成一种制度。"
 tv_govhouse.108.a: "让当地官员暂理政务。"

 tv_govhouse.109.t: "[tv_local_governor|E]：边疆瘟疫"
 tv_govhouse.109.d: "疾病沿港口贸易或军队行进路线进入[SCOPE.sLocation('tv_gov_event_location').GetName]。[SCOPE.sCharacter('tv_gov_event_governor').GetShortNameWithNoTooltip]下令封锁城镇，商队被挡在路障之外，祈祷声和责骂声同时升起。民众很快开始相信，瘟疫并非偶然，而是外来统治与总督无能共同带来的征兆。"
 tv_govhouse.109.a: "封锁疫区。"

 tv_govhouse.110.t: "[tv_local_governor|E]：总督挪用军费"
 tv_govhouse.110.d: "拨给[SCOPE.sLocation('tv_gov_event_location').GetName]驻军的银钱被发现流向[SCOPE.sCharacter('tv_gov_event_governor').GetShortNameWithNoTooltip]主持的私人工程。士兵欠薪，军纪松动，几支巡逻队开始向村镇索取《补偿》。远方财政监督最可怕的地方，不是账册造假，而是等真相抵达时秩序已经先一步崩坏。"
 tv_govhouse.110.a: "派员审计军费。"

 tv_govhouse.111.t: "[tv_local_governor|E]：殖民者与本地居民械斗"
 tv_govhouse.111.d: "[SCOPE.sLocation('tv_gov_event_location').GetName]附近的土地、水源和贸易纠纷演变成械斗。殖民者要求总督保护《开发成果》，本地居民则声称旧有边界被一步步抹去。[SCOPE.sCharacter('tv_gov_event_governor').GetShortNameWithNoTooltip]若偏向任何一方，另一方都会把这次裁决记成长期敌意。"
 tv_govhouse.111.a: "支持殖民者自卫。"
 tv_govhouse.111.b: "强制双方赔偿。"

 tv_govhouse.112.t: "[tv_local_governor|E]：总督举办盛大庆典"
 tv_govhouse.112.d: "[SCOPE.sCharacter('tv_gov_event_governor').GetShortNameWithNoTooltip]计划在[SCOPE.sLocation('tv_gov_event_location').GetName]举行盛大阅兵与庆典，展示帝国旗帜、军乐和恩赐。地方精英已经准备出席，民众却在计算这场仪式会吞掉多少粮食、工日和税款。前现代权威需要被看见，但被看见也从不便宜。"
 tv_govhouse.112.a: "让庆典盛大举行。"
 tv_govhouse.112.b: "削减仪式开销。"

 tv_govhouse.113.t: "[tv_local_governor|E]：边疆出现新宗教"
 tv_govhouse.113.d: "在[SCOPE.sLocation('tv_gov_event_location').GetName]周边，传教词句、本地传说和商旅带来的仪式混合出新的信仰团体。追随者称这只是旧神与新神彼此理解，传统宗教势力却称其为危险异端。[SCOPE.sCharacter('tv_gov_event_governor').GetShortNameWithNoTooltip]必须决定，这种边疆融合是秩序的桥梁，还是裂缝。"
 tv_govhouse.113.a: "暂时容忍新教义。"
 tv_govhouse.113.b: "宣布其为异端。"

 tv_govhouse.114.t: "[tv_local_governor|E]：驻军拥立总督"
 tv_govhouse.114.d: "[SCOPE.sLocation('tv_gov_event_location').GetName]的驻军公开向[SCOPE.sCharacter('tv_gov_event_governor').GetShortNameWithNoTooltip]宣誓效忠，理由是总督比遥远宫廷更能保障军饷、土地和荣誉。军旗仍称属于国家，但士兵们望向的已经是另一个人。若不及时处理，边疆安全会变成半独立权力的外衣。"
 tv_govhouse.114.a: "重申军队只效忠国家。"

 tv_govhouse.115.t: "[tv_local_governor|E]：特许公司要求自治"
 tv_govhouse.115.d: "经营[SCOPE.sLocation('tv_gov_event_location').GetName]贸易的特许公司指控[SCOPE.sCharacter('tv_gov_event_governor').GetShortNameWithNoTooltip]干涉利润，并要求司法、税收甚至驻军权限。公司代表说他们能让港口繁荣，前提是中央承认商业判断快过官僚命令。若答应他们，帝国会获得贸易；也会获得一个懂得要价的新政治实体。"
 tv_govhouse.115.a: "授予商业特权。"
 tv_govhouse.115.b: "只准许港务自治。"

 tv_govhouse.116.t: "[tv_local_governor|E]：移民船队抵达"
 tv_govhouse.116.d: "一支满载贫民、冒险者和债务人的船队抵达[SCOPE.sLocation('tv_gov_event_location').GetName]。[SCOPE.sCharacter('tv_gov_event_governor').GetShortNameWithNoTooltip]请求分配土地、种子与工具，让这些新来者尽快变成纳税人与民兵。边疆并非只靠征服扩大，也靠一批批愿意把未来押在陌生土地上的人。"
 tv_govhouse.116.a: "分配土地与补给。"

 tv_govhouse.117.t: "[tv_local_governor|E]：边疆发现古老遗迹"
 tv_govhouse.117.d: "修路工人在[SCOPE.sLocation('tv_gov_event_location').GetName]附近发现古老石刻与埋藏室。学者想测绘铭文，传教士想证明神意，军官则只关心传闻中的宝藏。[SCOPE.sCharacter('tv_gov_event_governor').GetShortNameWithNoTooltip]来信询问应如何处理。遗迹本身沉默不语，但围绕它的每一种解释都会塑造边疆记忆。"
 tv_govhouse.117.a: "资助学者测绘。"
 tv_govhouse.117.b: "将遗迹纳入帝国叙事。"

 tv_govhouse.118.t: "[tv_local_governor|E]：总督拒绝执行新法令"
 tv_govhouse.118.d: "中央新法送抵[SCOPE.sLocation('tv_gov_event_location').GetName]后，[SCOPE.sCharacter('tv_gov_event_governor').GetShortNameWithNoTooltip]迟迟不肯执行，声称条文没有理解地方水土。地方精英一致支持拖延，百姓也更愿意接受熟悉的旧规。远方总督经常握有事实上的解释权，而解释权一旦稳定下来，就会长成自治传统。"
 tv_govhouse.118.a: "默许地方解释。"
 tv_govhouse.118.b: "命其立即执行。"

 tv_govhouse.119.t: "[tv_local_governor|E]：边疆英雄崛起"
 tv_govhouse.119.d: "一名军官、探险家或商人因战功与财富在[SCOPE.sLocation('tv_gov_event_location').GetName]声望骤升。民众称其比[SCOPE.sCharacter('tv_gov_event_governor').GetShortNameWithNoTooltip]更懂边疆，酒馆里已经开始流传夸张的故事。英雄能成为国家的旗帜，也能成为地方派系的核心；关键在于谁先给他位置。"
 tv_govhouse.119.a: "把英雄招入体制。"
 tv_govhouse.119.b: "让总督压制其名声。"

