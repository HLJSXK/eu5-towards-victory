 # ── 训练结果事件 ─────────────────────────────────────────────────────────────
 tv_grand_general.1.t: "将才磨砺"
 tv_grand_general.1.d: "严酷的训练硕果累累。大将军从中走出，比训练前更加敏锐、强健，战术眼光也愈加犀利。"
 tv_grand_general.1.a: "每一次历练都让我们愈加强大。"

 tv_grand_general.2.t: "世间无双"
 tv_grand_general.2.d: "训练已无法再赋予大将军更多——其军事天赋已达巅峰。这份精熟向上传递，甚至启迪了我们的统治者，使其战略眼光提升至新的境界。"
 tv_grand_general.2.a: "吾国坐拥当世无双的军事智慧。"

 tv_grand_general.3.t: "精进之道"
 tv_grand_general.3.d: "训练将大将军的技艺磨砺至锋芒毕露。一条新的军事精进之道在其眼前展开——请选择他们将踏上哪条路线。"
 tv_grand_general.3.a: "走进攻路线（进攻）。"
 tv_grand_general.3.b: "走防御路线（防御）。"
 tv_grand_general.3.c: "走战术路线（战术）。"

 tv_grand_general.4.t: "百炼成钢"
 tv_grand_general.4.d: "所有军事精进路线皆已走到尽头。大将军对战争艺术本身已无更多可学——但其个人军事能力仍有提升空间。"
 tv_grand_general.4.a: "吾国能有如此战将，实乃幸事。"

 tv_grand_general.5.t: "世间无双"
 tv_grand_general.5.d: "大将军已超越技能与技法的一切极限。当世再无更伟大的军事头脑。这份完美也提升了我们统治者的境界。"
 tv_grand_general.5.a: "吾国坐拥当世无双的军事智慧。"

 tv_grand_general.6.t: "训练受伤"
 tv_grand_general.6.d: "训练中的一次意外使大将军留下了永久的伤疤。他以坚忍之心承受，但若再次训练而不加谨慎，旧伤终有一日将致命。"
 tv_grand_general.6.a: "愿他早日康复。"

 tv_grand_general.7.t: "旧伤复发"
 tv_grand_general.7.d: "训练的严酷超出了极限。旧伤再度撕裂——这一次，再无恢复的可能。大将军倒在了训练场上。"
 tv_grand_general.7.a: "损失惨重。我们将寻找一位worthy的继任者。"

 tv_grand_general.8.t: "折损将才"
 tv_grand_general.8.d: "命运残酷。训练中的一次意外夺走了我们的大将军。他在其潜力充分发挥之前便已离世。"
 tv_grand_general.8.a: "我们将铭记他的功勋，继续前行。"

 # ── 大将军特质 ───────────────────────────────────────────────────────────────
 # 进攻路线
 tv_gg_offense_1: "进攻指挥官 I"
 tv_gg_offense_1_desc: "此将军钟爱大胆的攻势，以无情的纪律与热情驱使部队奋勇向前。"
 desc_tv_gg_offense_1: "该大将军是一位进攻型指挥官。其大胆的战术激励麾下军队以更高的纪律与士气作战。"
 tv_gg_offense_1_die_desc: "[CHARACTER.GetSheHe|U]是一位身先士卒的进攻型指挥官，[CHARACTER.GetHerHis]无所畏惧的战斗精神将令我们深深怀念。"
 tv_gg_offense_2: "进攻指挥官 II"
 tv_gg_offense_2_desc: "精炼的攻势与高昂的士气使此将军成为进攻中的威慑。"
 desc_tv_gg_offense_2: "该大将军是一位经验丰富的进攻型指挥官。精炼的进攻战术与鼓舞人心的气质将麾下军队推向新的战斗高度。"
 tv_gg_offense_2_die_desc: "[CHARACTER.GetSheHe|U]是进攻性战争的大师。敌人们听闻[CHARACTER.GetSheHe]再无法率兵冲锋，无不暗自庆幸。"
 tv_gg_offense_3: "战争领主"
 tv_gg_offense_3_desc: "此将军已完全掌握攻势作战之道。其在战场上的存在，在第一击落下前便已扭转战局。"
 desc_tv_gg_offense_3: "该大将军是一位军阀，其进攻战争的造诣已臻完境。[CHARACTER.GetHerHis]战场直觉能在首战开始之前便将战局逆转。"
 tv_gg_offense_3_die_desc: "[CHARACTER.GetSheHe|U]是真正的军阀，这样的人物我们的国家或许难再遇见。没有[CHARACTER.GetHerHim]，战场将黯然失色。"

 # 防御路线
 tv_gg_defense_1: "坚守指挥官 I"
 tv_gg_defense_1_desc: "此将军的士兵坚守阵地如铁，在他人消耗之处积蓄实力。"
 desc_tv_gg_defense_1: "该大将军是一位坚定的防御者。麾下军队以铁的纪律坚守阵地，将战力保存于他人所挥霍之处。"
 tv_gg_defense_1_die_desc: "[CHARACTER.GetSheHe|U]是一位麾下士卒从不溃散的坚定防御者。没有[CHARACTER.GetHerHim]，我们的城防似乎也薄弱了几分。"
 tv_gg_defense_2: "坚守指挥官 II"
 tv_gg_defense_2_desc: "防御作战的战术天才——无攻势可破其防线，无伏击可击溃其部队。"
 desc_tv_gg_defense_2: "该大将军是一位出色的坚定防御者。防御战争的战术天才令其固若金汤——无论是攻城战线还是伏兵突袭，皆无法撼动其分毫。"
 tv_gg_defense_2_die_desc: "[CHARACTER.GetSheHe|U]无论面对怎样的形势都能坚守阵地。敌人知晓[CHARACTER.GetSheHe]已不在，必将重新试探我们的防线。"
 tv_gg_defense_3: "铁壁"
 tv_gg_defense_3_desc: "此将军已将防御升华为艺术。敌人撞上他的防线，如浪击磐石。"
 desc_tv_gg_defense_3: "该大将军坚不可摧。[CHARACTER.GetHerHis]将防御战争化为了一门艺术——敌人撞上[CHARACTER.GetHerHis]防线，如同波浪拍打礁石，徒劳无功。"
 tv_gg_defense_3_die_desc: "[CHARACTER.GetSheHe|U]是一位打不垮的将领——然而终究，即便是坚不可摧者也难逃一死。[CHARACTER.GetHerHis]的离去令我们的国家蒙受了巨大的损失。"

 # 战术路线
 tv_gg_tactics_1: "战术家 I"
 tv_gg_tactics_1_desc: "快速行军与精准围城是此将军战役的印记——总出现在敌人最意想不到之处。"
 desc_tv_gg_tactics_1: "该大将军是一位战术家。迅捷的行军与精准的围城是其战役的标志——总是在敌人最意想不到之处出现。"
 tv_gg_tactics_1_die_desc: "[CHARACTER.GetSheHe|U]是一位高明的战术家，其战役永远比敌人快上一步。没有[CHARACTER.GetHerHis]那些大胆的进攻路线，战图上少了几分生气。"
 tv_gg_tactics_2: "战术家 II"
 tv_gg_tactics_2_desc: "卓越的协调与战场感知赋予此将军在机动战中决定性的优势。"
 desc_tv_gg_tactics_2: "该大将军是一位出色的战术家。卓越的战场协调能力与超前的战略眼光赋予[CHARACTER.GetHerHim]在机动战中决定性的优势。"
 tv_gg_tactics_2_die_desc: "[CHARACTER.GetSheHe|U]曾以机动战胜所有对手。没有[CHARACTER.GetHerHis]的绝妙智慧，我们的行动将不再那么灵活。"
 tv_gg_tactics_3: "大战略家"
 tv_gg_tactics_3_desc: "完全的战术家——其战役在开始前便已结束，对手在第一场战斗打响前便已被调离。"
 desc_tv_gg_tactics_3: "该大将军是一位大战略家。[CHARACTER.GetHerHis]的战役在开打之前便已结束——在第一场战斗打响前，对手就已被算计在内。"
 tv_gg_tactics_3_die_desc: "[CHARACTER.GetSheHe|U]是[CHARACTER.GetHerHis]所在时代最杰出的战略头脑。据说[CHARACTER.GetSheHe]不拔剑便能赢得战争。这样的人，我们恐怕再也见不到了。"

 # 伤疤特质
 tv_gg_injured: "伤疤"
 tv_gg_injured_desc: "一次强化训练事故留下的持久创伤。如若再次训练而不加小心，旧伤有致命复发之虞。"
 desc_tv_gg_injured: "该大将军身上留有一道训练事故所造成的持久疤痕。继续训练有可能使旧伤复发——后果可能是致命的。"
 tv_gg_injured_die_desc: "[CHARACTER.GetSheHe|U]多年来以坚忍之心承受着伤痛。最终，旧伤夺去了战场未能夺走的一切。"

 # ── 附庸税收法律 ─────────────────────────────────────────────────────────────
 tv_subject_tax: "附庸税收"
 tv_subject_tax_desc: "决定从附庸国征收的贡金水平。"
 tv_subject_tax_low: "低税收"
 tv_subject_tax_low_desc: "减少从附庸国征收的贡金。他们将更为满意，但总督府的财库将有所损失。"
 tv_subject_tax_medium: "中税收"
 tv_subject_tax_medium_desc: "附庸国贡金的默认标准——不慷慨，也不苛索。"
 tv_subject_tax_high: "高税收"
 tv_subject_tax_high_desc: "提高附庸国贡金。对帝国有利可图，但深受附庸国民的憎恨。"

