 tv_govhouse.40.t: "[tv_war_tent|E]：战帐献策"
 tv_govhouse.40.d: "[tv_grand_general|E]向[tv_war_tent|e]提交了一项新的战术方案。地图已经钉好，军官们也不再假装自己没有偏爱的战争学派，而当前战役正等待一个获准的想法变成条令。批准后，该战术将在当前战争中生效；否决则维持既有部署。这并非单纯的技术选择。它会告诉战场上的每一支军队，中央愿意赐福哪一种风险。"
 tv_govhouse.40.a: "批准稳步进军。"
 tv_govhouse.40.b: "批准谨慎推进。"
 tv_govhouse.40.c: "批准快速推进。"
 tv_govhouse.40.e: "批准伏击。"
 tv_govhouse.40.f: "批准奇袭。"
 tv_govhouse.40.g: "批准游击战术。"
 tv_govhouse.40.h: "批准围点打援。"
 tv_govhouse.40.j: "批准奇袭首都。"
 tv_govhouse.40.k: "批准防守反击。"
 tv_govhouse.40.l: "批准千里奔袭。"
 tv_govhouse.40.m: "批准合围。"
 tv_govhouse.40.i: "否决该提案。"
 tv_govhouse.41.t: "[tv_war_tent|E]：进攻计划启动"
 tv_govhouse.41.d: "战争已经在我们进攻[tv_war_plan|e]指定的目标上爆发。[tv_war_tent|E]把数月筹划转化为围城时程、行军路线、补给预期与更严密的指挥纪律。曾经称计划只是纸上理论的军官，如今发现理论也会穿上靴子。每一点积累的进度都变成送往前线的指令。战役开始时，敌人所期待的即兴混乱已少了许多。"
 tv_govhouse.41.a: "执行计划。"
 tv_govhouse.42.t: "[tv_war_tent|E]：防御计划启动"
 tv_govhouse.42.d: "我们已卷入一场防御战争。[tv_war_tent|E]展开预先拟定的[tv_war_plan|e]：要塞账册、预备路线、后撤线，以及在恐慌有机会握笔之前写好的战场条令。和平时期看似谨慎的东西，如今显得像远见。驻军得到更清楚的命令，指挥官认出自己被分配的阵地，敌人迎上的不是散乱恐惧，而是排练过的抵抗。防御一旦准备充分，也会拥有记忆。"
 tv_govhouse.42.a: "执行计划。"

