 tv_govhouse.40.t: "战帐献策"
 tv_govhouse.40.d: "大将军向战帐提交了一项新的战术方案。批准后，该战术将在当前战争中生效；否决则维持既有部署。"
 tv_govhouse.40.a: "批准稳步进军。"
 tv_govhouse.40.b: "批准谨慎推进。"
 tv_govhouse.40.c: "批准快速推进。"
 tv_govhouse.40.e: "批准伏击。"
 tv_govhouse.40.f: "批准奇袭。"
 tv_govhouse.40.g: "批准游击战术。"
 tv_govhouse.40.h: "批准围点打援。"
 tv_govhouse.40.i: "否决该提案。"
 tv_govhouse.41.t: "进攻计划启动"
 tv_govhouse.41.d: "战争已经在我们进攻计划指定的目标上爆发。战帐将既有筹划转化为围城时程、行军路线与更严密的指挥纪律。"
 tv_govhouse.41.a: "执行计划。"
 tv_govhouse.42.t: "防御计划启动"
 tv_govhouse.42.d: "我们已卷入一场防御战争。战帐展开预先拟定的防御部署，强化要塞并收紧战场条令。"
 tv_govhouse.42.a: "执行计划。"

