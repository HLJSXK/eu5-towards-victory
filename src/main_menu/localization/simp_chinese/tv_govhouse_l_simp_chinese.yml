 # ── 总督府 ────────────────────────────────────────────────────────────────────
 tv_govhouse: "总督府"
 tv_govhouse_desc: "[tv_govhouse|E]是征服帝国的行政体系。当国家控制200处地点后建立，负责任命总督管辖各占领地区，并统领最高军事指挥官大将军。"
 diplomatic_status_tv_govhouse_name: "总督府成员"
 diplomatic_status_tv_govhouse_tooltip: "该国建立了总督府，用于管辖其征服的领土。"
 tv_govhouse_list_who_tt: "总督府成员"
 io_opinion_tv_govhouse: "同为总督府成员"
 TV_GOVHOUSE_GRAND_GENERAL: "大将军"
 TV_GOVHOUSE_GRAND_GENERAL_MALE:0 "大将军"
 TV_GOVHOUSE_GRAND_GENERAL_FEMALE:0 "大将军"
 tv_govhouse_authority:0 "总督权威"
 tv_govhouse_authority_desc:0 "代表总督府所掌握的行政与军事权威。高权威有助于更有效地管理征服领土。"
 tv_govhouse_power_balance:0 "权力平衡"
 tv_govhouse_power_balance_desc:0 "大将军与王室之间的实际权力分布。大将军一侧的[tv_govhouse_power_balance|e]越高，反弹事件的风险越大。"
 tv_govhouse_power_equilibrium:0 "权力平衡均衡点"
 tv_govhouse_power_equilibrium_desc:0 "权力平衡每月会向该数值移动，最多移动1%。"
 tv_govhouse_power_consolidation:0 "巩固权力"
 tv_govhouse_power_consolidation_desc:0 "大将军在任期间逐月积累的个人权势。它会将[tv_govhouse_power_balance|e]推向大将军，提高罢免和更换花费，并在大将军离任时立刻归零。"
 TV_GOVHOUSE_GENERAL_TAB: "大将军"
 TV_GOVHOUSE_GENERAL_TAB_TOOLTIP: "大将军管理"
 TV_GOVHOUSE_CURRENT_GENERAL_LABEL: "现任大将军："
 TV_GOVHOUSE_NO_GENERAL: "尚未任命"
 TV_GOVHOUSE_AUTHORITY_LABEL: "总督权威："
 TV_GOVHOUSE_POWER_BALANCE_CARD_TITLE: "权力平衡"
 TV_GOVHOUSE_POWER_BALANCE_TOOLTIP: "左侧代表大将军，右侧代表王室。[tv_govhouse_power_balance|E]每月向均衡点移动最多1%。"
 TV_GOVHOUSE_POWER_BALANCE_GENERAL_SIDE: "大将军"
 TV_GOVHOUSE_POWER_BALANCE_CROWN_SIDE: "王室"
 TV_GOVHOUSE_POWER_SEGMENT_0: "@warning_icon! <25%：安定。不会触发权力失衡负面事件。"
 TV_GOVHOUSE_POWER_SEGMENT_1: "@warning_icon! 25-49%：轻度反噬可能发生。"
 TV_GOVHOUSE_POWER_SEGMENT_2: "@warning_icon! 50-74%：反噬增强，并可能波及宫廷珍藏。"
 TV_GOVHOUSE_POWER_SEGMENT_3: "@warning_icon! 75-100%：严重反噬，内阁也可能陷入危险。"

 # ── 总督府法律 ───────────────────────────────────────────────────────────────
 tv_govhouse_laws: "总督府法律"
 TV_GOVHOUSE_LAWS_LAW_CATEGORY: "总督府法律"
 tv_govhouse_governor_functions: "地方总督职能"
 TV_GOVHOUSE_GOVERNOR_FUNCTIONS_LAW_CATEGORY: "地方总督职能"

 tv_govhouse_expedition_goal_law: "远征目标法"
 tv_govhouse_expedition_goal_law_desc: "总督府决定扩张应追随港口、征服、移民，还是朝贡统治者。"
 tv_govhouse_trade_posts_policy: "贸易据点"
 tv_govhouse_trade_posts_policy_desc: "港口、市场和航线成为远征核心。海外商业更便宜也更丰厚，但内陆控制薄弱。"
 tv_govhouse_conquest_colony_policy: "征服殖民"
 tv_govhouse_conquest_colony_policy_desc: "总督府为长期统治夺取土地。税收小幅提高，但驻军、叛乱和官僚负担随之增加。"
 tv_govhouse_frontier_settlement_policy: "边疆拓殖"
 tv_govhouse_frontier_settlement_policy_desc: "移民、垦殖和城镇建设优先。人口增长与同化能力提升，但早期财政收益有限。"
 tv_govhouse_tributary_system_policy: "朝贡体系"
 tv_govhouse_tributary_system_policy_desc: "影响力经由依附统治者流动。行政负担很轻，贡赋也有价值，但直接控制与臣属忠诚下降。"

 tv_govhouse_governor_appointment_law: "总督任命法"
 tv_govhouse_governor_appointment_law_desc: "本法决定谁获得地方统治权，以及谁的利益会塑造边疆行政。"
 tv_govhouse_royal_appointment_policy: "王室任命"
 tv_govhouse_royal_appointment_policy_desc: "官员由中央宫廷直接派遣。他们的忠诚稳固正统与控制，但各阶层会不满王室插手。"
 tv_govhouse_hereditary_nobility_policy: "贵族世袭"
 tv_govhouse_hereditary_nobility_policy_desc: "地方贵族将职权变为世袭。贵族权力与满意度提高，边疆统治更集中于世家。"
 tv_govhouse_merchant_tax_farming_policy: "商人包税"
 tv_govhouse_merchant_tax_farming_policy_desc: "商人与公司承包治理。市民权力提高，贸易收入随之增长。"
 tv_govhouse_military_land_grants_policy: "军功授地"
 tv_govhouse_military_land_grants_policy_desc: "军事将领因功获地。围城与陆军传统提高，但正统性会受损。"

 tv_govhouse_local_autonomy_law: "地方自治法"
 tv_govhouse_local_autonomy_law_desc: "总督府规定多少权力留在中央，多少权力留给殖民团体、地方精英或藩属。"
 tv_govhouse_strict_direct_rule_policy: "严格直辖"
 tv_govhouse_strict_direct_rule_policy_desc: "重大事务由中央直接控制。税收和控制力提高，但阶层不满与地方怨气也会累积。"
 tv_govhouse_limited_autonomy_policy: "有限自治"
 tv_govhouse_limited_autonomy_policy_desc: "地方议会、行会和贵族获得有限权力。稳定与生产改善，国家直接收益下降。"
 tv_govhouse_chartered_colonies_policy: "特许殖民地"
 tv_govhouse_chartered_colonies_policy_desc: "特许团体以国家名义自治。迁移与市民力量提高，海外建设也更便宜。"
 tv_govhouse_vassal_autonomy_policy: "藩属自治"
 tv_govhouse_vassal_autonomy_policy_desc: "原有精英与制度得以保留。冲突减少，但同化与宗教整合显著放缓。"

 tv_govhouse_religious_mission_law: "宗教传播法"
 tv_govhouse_religious_mission_law_desc: "本法决定信仰是否置身边疆国家之外，或成为边疆统治的工具之一。"
 tv_govhouse_secular_governance_policy: "世俗治理"
 tv_govhouse_secular_governance_policy_desc: "宗教权威不直接介入边疆统治。宽容度提高，但改宗动力下降。"
 tv_govhouse_official_mission_policy: "官方传教"
 tv_govhouse_official_mission_policy_desc: "国家支持传教活动。改宗能力增强，教士影响与外交摩擦也随之上升。"
 tv_govhouse_religious_orders_policy: "宗教军团"
 tv_govhouse_religious_orders_policy_desc: "宗教组织参与军事与行政事务。改宗、士气与教士影响显著提高。"
 tv_govhouse_religious_tolerance_policy: "宗教宽容"
 tv_govhouse_religious_tolerance_policy_desc: "多种信仰被允许共存。宽容度提高，但宗教统一推进缓慢。"

 tv_govhouse_frontier_military_law: "边疆军事法"
 tv_govhouse_frontier_military_law_desc: "边疆必须有人防守；本法决定由哪种武装承担这项职责。"
 tv_govhouse_regular_garrison_policy: "正规驻军"
 tv_govhouse_regular_garrison_policy_desc: "中央常备军驻守边疆据点。纪律和防御提高，但维护费用昂贵。"
 tv_govhouse_local_militia_policy: "地方民兵"
 tv_govhouse_local_militia_policy_desc: "殖民者与地方居民组织自卫。成本降低、征召扩大，但中央控制减弱。"
 tv_govhouse_military_colonies_policy: "边疆军镇"
 tv_govhouse_military_colonies_policy_desc: "军队兼具定居、生产与防卫职能。控制、繁荣与士兵增长提高，社会也更加军事化。"
 tv_govhouse_mercenary_system_policy: "雇佣兵体系"
 tv_govhouse_mercenary_system_policy_desc: "私人武装与雇佣兵提供灵活力量。机动性提升，但战争疲惫恶化。"

 tv_govhouse_imperial_integration_law: "帝国整合法"
 tv_govhouse_imperial_integration_law_desc: "帝国决定征服地是长期作为殖民地、成为自治领、并入国家，还是遭掠夺后放弃。"
 tv_govhouse_permanent_colony_policy: "永久殖民地"
 tv_govhouse_permanent_colony_policy_desc: "殖民地长期附属于母国。属国收入稳定，但官僚负担与独立压力会逐渐增长。"
 tv_govhouse_dominion_status_policy: "自治领化"
 tv_govhouse_dominion_status_policy_desc: "殖民地获得更广泛自治。稳定和忠诚提高，但中央直接收益下降。"
 tv_govhouse_imperial_province_policy: "帝国行省化"
 tv_govhouse_imperial_province_policy_desc: "边疆被纳入正式国土。同化、整合与发展提高，但官僚成本巨大。"
 tv_govhouse_plunder_evacuate_policy: "掠夺撤离"
 tv_govhouse_plunder_evacuate_policy_desc: "总督府榨取物资而不追求持久统治。生产提高，但控制、繁荣和整合都会衰退。"

 tv_govhouse_administrative_function_law: "行政职能"
 tv_govhouse_administrative_function_law_desc: "本法决定总督的行政能力提供哪一项地方加成。"
 tv_govhouse_admin_control_registers_policy: "控制簿册"
 tv_govhouse_admin_control_registers_policy_desc: "测绘册、印信与复核机构让边疆权威清晰可查。总督每点行政能力提供+0.1%本地最大控制力。"
 tv_govhouse_admin_development_surveys_policy: "开发测绘"
 tv_govhouse_admin_development_surveys_policy_desc: "总督在发号施令前，必须先丈量道路、田亩、水井与工坊。总督每点行政能力提供+0.00001本地每月发展度。"
 tv_govhouse_admin_production_offices_policy: "生产官署"
 tv_govhouse_admin_production_offices_policy_desc: "地方书记把精力投向产出定额、仓储规章与可贸易物资。总督每点行政能力提供+0.1%本地生产效率。"

 tv_govhouse_diplomatic_function_law: "外交职能"
 tv_govhouse_diplomatic_function_law_desc: "本法决定总督的外交能力提供哪一项地方加成。"
 tv_govhouse_dip_construction_charters_policy: "营造特许"
 tv_govhouse_dip_construction_charters_policy_desc: "总督与行会、承包商和城镇精英议价，使公共工程更为廉价。总督每点外交能力提供-0.2%本地建造花费。"
 tv_govhouse_dip_pop_advancement_policy: "民籍晋升"
 tv_govhouse_dip_pop_advancement_policy_desc: "地方特权与请愿渠道被用来为人口打开通往更高职业的道路。总督每点外交能力提供+0.5%本地人口晋升速度。"
 tv_govhouse_dip_settlement_patronage_policy: "拓殖赞助"
 tv_govhouse_dip_settlement_patronage_policy_desc: "总督府邸资助移民家庭、契约和定居权。总督每点外交能力提供+0.001%本地人口增长。"

 tv_govhouse_military_function_law: "军事职能"
 tv_govhouse_military_function_law_desc: "本法决定总督的军事能力提供哪一项地方加成。"
 tv_govhouse_mil_order_patrols_policy: "秩序巡逻"
 tv_govhouse_mil_order_patrols_policy_desc: "巡逻路线、守望制度与快速惩戒阻止不满聚集成势。总督每点军事能力提供-0.2%本地动乱度。"
 tv_govhouse_mil_frontier_levies_policy: "边疆征召"
 tv_govhouse_mil_frontier_levies_policy_desc: "总督维持家户名册与地方操练场，以备紧急征召。总督每点军事能力提供+0.2%本地陆军征召规模。"
 tv_govhouse_mil_fortress_engineers_policy: "堡垒工程"
 tv_govhouse_mil_fortress_engineers_policy_desc: "军事总督将注意力投向城墙、仓库与火炮平台。总督每点军事能力提供+0.5%本地要塞防御。"

