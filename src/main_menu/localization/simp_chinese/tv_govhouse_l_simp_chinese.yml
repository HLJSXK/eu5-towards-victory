 # ── 训练结果事件 ─────────────────────────────────────────────────────────────
 tv_grand_general.1.t: "[tv_grand_general|E]：将才磨砺"
 tv_grand_general.1.d: "严酷训练终于结出果实。[tv_grand_general|E]从校场走出时，比从前更敏锐、更强健，也更懂得怎样把混乱压成命令。原本以为只是例行操练的军官们，见到的是强行军、图上推演、夜间警号，以及围着泥泞桌面的激烈争论。身体经受了考验，判断力也同样如此。[tv_govhouse|e]如今掌握着一颗更愿意把苦难转化为方法的头脑。此后每一场战役都会继承这座训练场的纪律。"
 tv_grand_general.1.a: "让下一场战役记住校场的教训。"

 tv_grand_general.2.t: "[tv_grand_general|E]：世间无双"
 tv_grand_general.2.d: "训练已经无法再赋予[tv_grand_general|E]更多东西。每一次操练都像排演，每一次考验都像确认，每一次质疑都只是让已经完成的造诣再次显形。其军事天赋已达巅峰，连教官们如今也更像见证者，而非老师。这份精熟向上传递，启迪我们的统治者，使其战略眼光提升到新的境界。国家可以由许多才能治理，但会被一个让战争变得清晰可读的头脑改变。"
 tv_grand_general.2.a: "吾国坐拥当世无双的军事智慧。"

 tv_grand_general.3.t: "[tv_grand_general|E]：精进之道"
 tv_grand_general.3.d: "训练已经把[tv_grand_general|E]的技艺磨砺至锋芒毕露。幕僚能从其阅读地形、纠正队长、以及对空泛勇气的不耐烦中看出变化。一条新的军事修习之道在其面前展开，它不再只是课程，而会成为塑造未来每一道军令的召唤。[tv_govhouse|e]等待这个选择，因为不同的天才会改变制度本身。请选择其将踏上的道路。"
 tv_grand_general.3.a: "走进攻路线（进攻）。"
 tv_grand_general.3.b: "走防御路线（防御）。"
 tv_grand_general.3.c: "走战术路线（战术）。"

 tv_grand_general.4.t: "[tv_grand_general|E]：百炼成钢"
 tv_grand_general.4.d: "所有军事精进路线皆已走到尽头。我们的[tv_grand_general|E]已经研习进攻、防御、机动、耐心、暴力、补给，以及更艰难的艺术：在当下知道哪一种才真正重要。关于战争作为系统的一切，已经没有更多可教；但技巧仍存在于那个必须在雨水、烟尘、饥饿与恐惧中做决定的人身上。[tv_war_tent|e]得到了一位教育已然完成、锋刃仍可磨利的统帅。这是一种罕见而危险的福分。"
 tv_grand_general.4.a: "吾国能有如此战将，实乃幸事。"

 tv_grand_general.5.t: "[tv_grand_general|E]：世间无双"
 tv_grand_general.5.d: "我们的[tv_grand_general|E]已经超越技能与技法的一切极限。其不再只是应用教条，而是让教条显得像对既成判断的迟缓描述。当世再无更伟大的军事头脑，[tv_war_tent|e]中的每个人都知道这一点，哪怕骄傲让他们不愿承认。这份完美也提升了统治者的境界，因为站在如此清晰的头脑旁边，很难不看得更远。国家获得的不只是一位统帅，也是一把衡量统帅本身的标尺。"
 tv_grand_general.5.a: "吾国坐拥当世无双的军事智慧。"

 tv_grand_general.6.t: "[tv_grand_general|E]：校场留痕"
 tv_grand_general.6.d: "训练中的一次意外使[tv_grand_general|E]留下了持久伤痕。校场安静得比任何命令都更快，就连老练军官也在医师忙碌时移开目光。他们以坚忍之心承受伤痛，把痛苦转化为另一种纪律。然而身体也有自己的账册。若继续训练而不加谨慎，这道痕迹终有一日会要求全额偿付。"
 tv_grand_general.6.a: "愿他早日康复。"

 tv_grand_general.7.t: "[tv_grand_general|E]：旧伤复发"
 tv_grand_general.7.d: "训练的严酷超出了极限。旧伤在重压下再次撕裂，这一次，没有医师、祈祷或咆哮的命令能够将其合拢。我们的[tv_grand_general|E]倒在训练场上，身旁是地图、兵器，以及曾令其强大的纪律。[tv_govhouse|e]失去的不只是一名军官，而是军事服从围绕其组织起来的那个人。校场会被清理干净，但很长一段时间里，它都不会再显得寻常。"
 tv_grand_general.7.a: "损失惨重。我们将寻找一位配得上此位的继任者。"

 tv_grand_general.8.t: "[tv_grand_general|E]：折损将才"
 tv_grand_general.8.d: "命运残酷。训练中的一次意外夺走了我们的[tv_grand_general|E]，而其潜力尚未完全绽放。前一刻，校场还是精进之地；下一刻，它便成了一座满是惊愕见证人的法庭。所有假定其未来指挥的计划，如今都显得突然愚蠢，仿佛墨水本身伸得太远。[tv_war_tent|e]必须学会在听不到预期声音的情况下说话。曾经可能发生的一切，如今成了无人能使用的军事秘密。"
 tv_grand_general.8.a: "我们将铭记他的功勋，继续前行。"

 tv_grand_general.9.t: "[tv_grand_general|E]：冷淡军书"
 tv_grand_general.9.d: "[tv_grand_general|E]送来的军书礼数周全，却没有半分热意。命令是正确的，要求也合乎情理，只是字里行间的沉默清楚得令人难安。或许是一次怠慢、一次拖延，或一次私下盘算，使其对王室的忠诚冷却了几分。"
 tv_grand_general.9.a: "信任总是从细处变薄。"

 tv_grand_general.10.t: "[tv_grand_general|E]：同心之事"
 tv_grand_general.10.d: "[tv_grand_general|E]毫无讨价还价地回应了一项棘手要求。军帐中的军官提起王室时比往常更为笃定，连彼此猜疑的大臣也不得不承认，服从仍可以被塑造成一种体面。"
 tv_grand_general.10.a: "让这份信任被记住。"

 tv_grand_general.11.t: "[tv_grand_general|E]：索要赏赐"
 tv_grand_general.11.d: "[tv_grand_general|E]要求一笔看得见的赏赐：用于供养亲随、酬谢军官，也用于证明王室确实看见了他的功劳。这笔钱尚不至于伤筋动骨，但若拒绝，在他眼中恐怕不像节俭，更像猜忌。"
 tv_grand_general.11.a: "支付赏赐。"
 tv_grand_general.11.b: "拒绝要求。"

 # ── 总督死亡事件 ──────────────────────────────────────────────────────────────
 tv_govhouse.1.t: "[tv_local_governor|E]：总督已逝世"
 tv_govhouse.1.d: "一位[tv_local_governor|E]已经离世。来自其管辖地区的信件语气已经变了，因为地方书记、士兵、商人和请愿者都在试探，当任命之手消失后还剩多少权威。在派遣新的总督之前，该地区将不再获得[tv_govhouse|E]加成。边疆统治很少能长期保持抽象；它有名字、习惯、仇敌，也有等待命令的房间。如今其中一间房空了下来。"
 tv_govhouse.1.a: "我们必须安排继任者。"

 tv_govhouse.2.t: "[tv_grand_general|E]：大将军已逝世"
 tv_govhouse.2.d: "我国[tv_grand_general|E]已经逝世。消息抵达[tv_govhouse|e]时，既是一场个人损失，也是一阵制度警铃，因为命令不会只因发令者倒下而暂停。军官压低嗓音，总督们揣测哪些请愿应当等待，[tv_war_tent|e]忽然显得过于空阔。在继任者被任命之前，国家将暂缺最高军事统帅。空置的权威会招来问题，而问题在征服地之间传播得很快。"
 tv_govhouse.2.a: "我们必须任命继任者。"

 # ── 权力失衡负面事件 ───────────────────────────────────────────────────────
 tv_govhouse.10.t: "[tv_govhouse_power_balance|E]：地方怨声"
 tv_govhouse.10.d: "[tv_govhouse|E]辖下的一处地方发现，日常请愿正被军中书记与后勤官层层转递。市集纠纷排在草料清单旁边，婚姻诉状压在道路巡查下面，每一道答复都带着同一种短促笔迹。百姓已经明白，如今真正有分量的是谁的印玺。地方长老仍向文官行礼，却会在开口前看向他的身后。[tv_grand_general|E]并未夺取这片地方，但地方已经开始像夺取已经发生那样行事。权威最初改变形状时，往往没有号角，只有表格。\n\n#R 警告：该事件出现，是因为你的[tv_grand_general|E]至少掌握了25%的[tv_govhouse_power_balance|E]。#!"
 tv_govhouse.10.a: "让地方学会哪枚印玺才会回话。"
 tv_govhouse.10.b: "买下足够让街巷安静的时间。"

 tv_govhouse.11.t: "[tv_govhouse_power_balance|E]：玺印与军令"
 tv_govhouse.11.d: "宫廷拟定的命令，如今会带着军官的批注返回。有些批注关乎道路与补给，有些却关乎谁能命令谁，而后者的墨迹更难忽视。书记们假装这些只是务实修正。大臣们则假装没有看见，每一项务实修正都让他们自己的回旋余地更窄。若坚持旧有权威，国家付出的代价恐怕不止颜面。剑没有劈开玺印，但已经学会把重量压在玺印之上。\n\n#R 警告：该事件出现，是因为你的[tv_grand_general|E]至少掌握了25%的[tv_govhouse_power_balance|E]。#!"
 tv_govhouse.11.a: "让剑在边注里写字。"
 tv_govhouse.11.b: "让斥责公开到足以刺痛。"

 tv_govhouse.12.t: "[tv_govhouse_power_balance|E]：贵族冷眼"
 tv_govhouse.12.d: "贵族们私下议论，[tv_govhouse|E]把古老特权当作又一份补给清单处理。他们的餐桌上，酒依旧按礼仪斟满，讥讽却斟得更加小心。年轻继承人询问，血统如今是否还比马匹数目重要。年长领主以更少的兵、更少的信和更少真诚笑容作答。宴席愈发冷清，承诺也愈发空泛。宫廷可以无视这股寒意，但霜总擅长沿着石墙蔓延。\n\n#R 警告：该事件出现，是因为你的[tv_grand_general|E]至少掌握了25%的[tv_govhouse_power_balance|E]。#!"
 tv_govhouse.12.a: "让豪门在银杯后面生闷气。"
 tv_govhouse.12.b: "提醒他们，血统仍有座位。"

 tv_govhouse.13.t: "[tv_govhouse_power_balance|E]：研究中断"
 tv_govhouse.13.d: "学者报告说，档案、仪器与书信都被征用于军事行政。一柜地图成了行军索引，一组透镜不再测量星辰，而开始核对火药仓储。助手们压低声音抱怨，因为带着礼貌命令的士兵终究还是士兵。没人把这称作敌视学问；他们称之为必要，而必要最喜欢这样的伪装。研究必须先等待行军命令。[tv_govhouse|E]借走了国家的头脑，并承诺日后归还。\n\n#R 警告：该事件出现，是因为你的[tv_grand_general|E]至少掌握了25%的[tv_govhouse_power_balance|E]。#!"
 tv_govhouse.13.a: "让笔记本随辎重车出发。"
 tv_govhouse.13.b: "用首都财富保住这场追问。"

 tv_govhouse.20.t: "[tv_govhouse_power_balance|E]：一省皆怨"
 tv_govhouse.20.d: "整片省份都感受到了[tv_govhouse|E]透过税册、巡逻与强制协作施加的压力。一座城抱怨粮食被征用，另一座城抱怨士兵睡进市政厅，第三座城则抱怨法官必须等待军方副署。这些怨言单独看都不足以称为叛乱。合在一起，它们足以改变每个市集的声音。最初的不满已经从城镇蔓延到城镇。该省尚未起事，却已经不再相信忍耐会有回报。\n\n#R 警告：该事件出现，是因为你的[tv_grand_general|E]至少掌握了50%的[tv_govhouse_power_balance|E]。#!"
 tv_govhouse.20.a: "让该省吞下苦味。"
 tv_govhouse.20.b: "在它学会更硬的名字前买下和解。"

 tv_govhouse.21.t: "[tv_govhouse_power_balance|E]：敕令被驳"
 tv_govhouse.21.d: "[tv_grand_general|E]的幕僚悄然推翻了一道王室敕令。羊皮纸上仍写着统治者的名字，但其下的命令先被附加条件，又被拖延，最后变得无关紧要。廷臣盯着这处矛盾，仿佛只要看得够久，它就会变成惯例。各省官员已经领会教训，开始询问[tv_war_tent|E]究竟哪些命令才真正算数。假装这只是普通行政将损害政府权威。正面对抗则会动摇国家，因为所有人如今都知道，确实有某种东西值得对抗。\n\n#R 警告：该事件出现，是因为你的[tv_grand_general|E]至少掌握了50%的[tv_govhouse_power_balance|E]。#!"
 tv_govhouse.21.a: "让敕令安静死在卷宗里。"
 tv_govhouse.21.b: "把公开敕令读得足够响亮。"

 tv_govhouse.22.t: "[tv_govhouse_power_balance|E]：贵族退缩"
 tv_govhouse.22.d: "贵族不再只是窃窃私语。狩猎聚会变成会议，会议变成控诉，每个古老家族忽然都记起更古老的权利。他们以一种把阻挠称作传统的优雅方式，拒绝配合[tv_govhouse|E]。即便忠诚的家族也开始询问，服从军人是否会损害他们的出身。要求很简单：证明贵族等级仍然有其分量。若宫廷拒绝，贵族的沉默或许会比愤怒更昂贵。\n\n#R 警告：该事件出现，是因为你的[tv_grand_general|E]至少掌握了50%的[tv_govhouse_power_balance|E]。#!"
 tv_govhouse.22.a: "让他们的纹章冻在墙上。"
 tv_govhouse.22.b: "把优先地位的旧香气还给他们。"

 tv_govhouse.23.t: "[tv_govhouse_power_balance|E]：手稿被没收"
 tv_govhouse.23.d: "研究笔记像作战计划一样被扣押。批注、草图与未完成计算如今同马匹和火药清单一起被锁了起来。军官说，知识必须服务安全。学者们则非常谨慎地回答，安全很少能在堵住知识嘴巴之前认出知识。学者们开始怀疑，宫廷重视的究竟是发现，还是服从。一个国家可以让实验室害怕，但恐惧不是好助手。\n\n#R 警告：该事件出现，是因为你的[tv_grand_general|E]至少掌握了50%的[tv_govhouse_power_balance|E]。#!"
 tv_govhouse.23.a: "让研究在锁后等待。"
 tv_govhouse.23.b: "消耗首都繁荣，保住灯火。"

 tv_govhouse.24.t: "[tv_govhouse_power_balance|E]：画廊付之一炬"
 tv_govhouse.24.d: "一件艺术品成了威望斗争中的筹码。接近[tv_govhouse|E]的军官称它是由虚荣赞助人养活的无用奢侈。宫廷则称它为记忆、虔敬，以及权力不只会保存道路和口粮的证明。仆人拿着水桶与毯子穿过画廊，动作带着知道美会燃烧之人的谨慎。[tv_grand_general|E]并未亲自下令纵火，但其权势已让纵火变得可以想象。若这件作品烧毁，烟里就不只会有颜料味。\n\n#R 警告：该事件出现，是因为你的[tv_grand_general|E]至少掌握了50%的[tv_govhouse_power_balance|E]。#!"
 tv_govhouse.24.a: "让画布化为烟尘。"
 tv_govhouse.24.b: "以威望让画廊不可触碰。"

 tv_govhouse.25.t: "[tv_govhouse_power_balance|E]：画室沉默"
 tv_govhouse.25.d: "一位艺术家激怒了[tv_grand_general|E]身边的军官。或许冒犯是有意为之，或许只是粗心草图落入了不该落入的眼中，又或许权力本就不喜欢镜子。画室除了匆忙遮盖作品的刮擦声外，已经一片沉默。如今若要保住艺术家，就必须找一条更有价值的性命挡下罪责。所有人都在说出这场交换前明白了它。[tv_govhouse|E]已经把艺术变得足够政治，也足够危险。\n\n#R 警告：该事件出现，是因为你的[tv_grand_general|E]至少掌握了50%的[tv_govhouse_power_balance|E]。#!"
 tv_govhouse.25.a: "关闭画室，并称之为谨慎。"
 tv_govhouse.25.b: "让一名阁臣挡在画笔与刀锋之间。"

 tv_govhouse.30.t: "[tv_govhouse_power_balance|E]：一区拒府"
 tv_govhouse.30.d: "整片区域的忍耐同时崩塌。从未在边界问题上达成一致的村庄，如今对怨恨达成一致；曾经争抢宠信的城镇，如今像交换钱币一样交换控诉。每一道命令、每一笔税赋、每一次羞辱，如今都长着[tv_govhouse|E]的面孔。就连例行巡逻也被视作证明：首都里无人倾听，除非有靴声相伴。这股怒气尚未组织起来，因此容易被轻视，也更难衡量。一片区域最初并不会大声拒绝，它会先拒绝相信。\n\n#R 警告：该事件出现，是因为你的[tv_grand_general|E]至少掌握了75%的[tv_govhouse_power_balance|E]。#!"
 tv_govhouse.30.a: "让不信任沉进土里。"
 tv_govhouse.30.b: "用金钱平息到怨言失声。"

 tv_govhouse.31.t: "[tv_govhouse_power_balance|E]：国家低头"
 tv_govhouse.31.d: "廷臣如今在昔日发号施令之处请求许可。[tv_grand_general|E]的权威已经成了另一部写在军令上的宪章。大臣们仍坐在各自任命的椅子上，但争论开始前，房间已经先向军事书案倾斜。仆人会凭本能把文件送往最可能答复的办公室。统治者或许仍能第一个开口，但所有人都在等谁说最后一句。国家可以低头低得如此缓慢，以至于把这个动作误认为平衡。\n\n#R 警告：该事件出现，是因为你的[tv_grand_general|E]至少掌握了75%的[tv_govhouse_power_balance|E]。#!"
 tv_govhouse.31.a: "让国家弯下去，直到它称弯曲为秩序。"
 tv_govhouse.31.b: "以稳定度让拒绝足够响亮。"

 tv_govhouse.32.t: "[tv_govhouse_power_balance|E]：贵族结阵"
 tv_govhouse.32.d: "豪门围绕自身特权结成防线。他们派来堂亲而非继承人，送来恭维而非承诺，献上的仪式礼物也都在提醒我们旧日交易。除非宫廷公开恢复贵族权重，否则他们绝不会听命于军人。[tv_grand_general|E]可以命令服从，但贵族合作从来住在更柔软的地方。每一次结阵都让国家更不像等级秩序，而像一场花边下藏刀的谈判。宫廷必须决定，是让骄傲受伤，还是继续喂养它。\n\n#R 警告：该事件出现，是因为你的[tv_grand_general|E]至少掌握了75%的[tv_govhouse_power_balance|E]。#!"
 tv_govhouse.32.a: "让贵族满意度在礼貌鞠躬后崩落。"
 tv_govhouse.32.b: "把更多重量放回贵族手中。"

 tv_govhouse.33.t: "[tv_govhouse_power_balance|E]：空桌之季"
 tv_govhouse.33.d: "学者的书桌空置，文书官把他们的成果拖进军需仓库。草稿与征发表捆在一起，标本被塞在备用扣具旁边，信件也要等到对指挥有用之后才能放行。整月整月的思考消失在控制机器之中。[tv_academy_of_sciences|E]可以抗议，但抗议缓慢，命令迅速。学生学会沉默比好奇更安全。一个因服从而失去的季节，可能需要数年才能补回。\n\n#R 警告：该事件出现，是因为你的[tv_grand_general|E]至少掌握了75%的[tv_govhouse_power_balance|E]。#!"
 tv_govhouse.33.a: "让研究在命令阴影下变得稀薄。"
 tv_govhouse.33.b: "消耗首都繁荣，让思想撑过这个季节。"

 tv_govhouse.34.t: "[tv_govhouse_power_balance|E]：剑下内阁"
 tv_govhouse.34.d: "内阁已经成为[tv_grand_general|E]发号施令的阻碍。诸位大臣争辩、拖延，并抓住旧日舒适幻觉不放，仿佛建议仍能约束权力。入夜之后，信使传递的方案听上去不像改革，更像清除。到明天清晨，要么诸位阁臣消失，要么统治者必须以更切身的方式证明顺从。房间里有蜡、汗水，以及任何忠诚臣民都不该见证的决定气味。当剑进入政务时，连幸存都开始像投降。\n\n#R 警告：该事件出现，是因为你的[tv_grand_general|E]至少掌握了75%的[tv_govhouse_power_balance|E]。#!"
 tv_govhouse.34.a: "让内阁在清晨前沉默。"
 tv_govhouse.34.b: "让统治者支付阁臣付不起的代价。"

 # ── 大将军特质 ───────────────────────────────────────────────────────────────
 # 进攻路线
 tv_gg_offense_1: "进攻指挥官 I"
 tv_gg_offense_1_desc: "此将军钟爱大胆的攻势，以无情的纪律与热情驱使部队奋勇向前。"
 desc_tv_gg_offense_1: "该大将军是一位进攻型指挥官。其大胆的战术激励麾下军队以更高的纪律与士气作战。"
 tv_gg_offense_1_die_desc: "[CHARACTER.GetSheHe|U]是一位身先士卒的进攻型指挥官，[CHARACTER.GetHerHis]无所畏惧的战斗精神将令我们深深怀念。"
 tv_gg_offense_2: "进攻指挥官 II"
 tv_gg_offense_2_desc: "精炼的攻势与高昂的士气使此将军成为进攻中的威慑。"
 desc_tv_gg_offense_2: "该大将军是一位经验丰富的进攻型指挥官。精炼的进攻战术与鼓舞人心的气质将麾下军队推向新的战斗高度。"
 tv_gg_offense_2_die_desc: "[CHARACTER.GetSheHe|U]是进攻性战争的大师。敌人们听闻[CHARACTER.GetSheHe]再无法率兵冲锋，无不暗自庆幸。"
 tv_gg_offense_3: "战争领主"
 tv_gg_offense_3_desc: "此将军已完全掌握攻势作战之道。其在战场上的存在，在第一击落下前便已扭转战局。"
 desc_tv_gg_offense_3: "该大将军是一位军阀，其进攻战争的造诣已臻完境。[CHARACTER.GetHerHis]战场直觉能在首战开始之前便将战局逆转。"
 tv_gg_offense_3_die_desc: "[CHARACTER.GetSheHe|U]是真正的军阀，这样的人物我们的国家或许难再遇见。没有[CHARACTER.GetHerHim]，战场将黯然失色。"

 # 防御路线
 tv_gg_defense_1: "坚守指挥官 I"
 tv_gg_defense_1_desc: "此将军的士兵坚守阵地如铁，在他人消耗之处积蓄实力。"
 desc_tv_gg_defense_1: "该大将军是一位坚定的防御者。麾下军队以铁的纪律坚守阵地，将战力保存于他人所挥霍之处。"
 tv_gg_defense_1_die_desc: "[CHARACTER.GetSheHe|U]是一位麾下士卒从不溃散的坚定防御者。没有[CHARACTER.GetHerHim]，我们的城防似乎也薄弱了几分。"
 tv_gg_defense_2: "坚守指挥官 II"
 tv_gg_defense_2_desc: "防御作战的战术天才——无攻势可破其防线，无伏击可击溃其部队。"
 desc_tv_gg_defense_2: "该大将军是一位出色的坚定防御者。防御战争的战术天才令其固若金汤——无论是攻城战线还是伏兵突袭，皆无法撼动其分毫。"
 tv_gg_defense_2_die_desc: "[CHARACTER.GetSheHe|U]无论面对怎样的形势都能坚守阵地。敌人知晓[CHARACTER.GetSheHe]已不在，必将重新试探我们的防线。"
 tv_gg_defense_3: "铁壁"
 tv_gg_defense_3_desc: "此将军已将防御升华为艺术。敌人撞上他的防线，如浪击磐石。"
 desc_tv_gg_defense_3: "该大将军坚不可摧。[CHARACTER.GetHerHis]将防御战争化为了一门艺术——敌人撞上[CHARACTER.GetHerHis]防线，如同波浪拍打礁石，徒劳无功。"
 tv_gg_defense_3_die_desc: "[CHARACTER.GetSheHe|U]是一位打不垮的将领——然而终究，即便是坚不可摧者也难逃一死。[CHARACTER.GetHerHis]的离去令我们的国家蒙受了巨大的损失。"

 # 战术路线
 tv_gg_tactics_1: "战术家 I"
 tv_gg_tactics_1_desc: "快速行军与精准围城是此将军战役的印记——总出现在敌人最意想不到之处。"
 desc_tv_gg_tactics_1: "该大将军是一位战术家。迅捷的行军与精准的围城是其战役的标志——总是在敌人最意想不到之处出现。"
 tv_gg_tactics_1_die_desc: "[CHARACTER.GetSheHe|U]是一位高明的战术家，其战役永远比敌人快上一步。没有[CHARACTER.GetHerHis]那些大胆的进攻路线，战图上少了几分生气。"
 tv_gg_tactics_2: "战术家 II"
 tv_gg_tactics_2_desc: "卓越的协调与战场感知赋予此将军在机动战中决定性的优势。"
 desc_tv_gg_tactics_2: "该大将军是一位出色的战术家。卓越的战场协调能力与超前的战略眼光赋予[CHARACTER.GetHerHim]在机动战中决定性的优势。"
 tv_gg_tactics_2_die_desc: "[CHARACTER.GetSheHe|U]曾以机动战胜所有对手。没有[CHARACTER.GetHerHis]的绝妙智慧，我们的行动将不再那么灵活。"
 tv_gg_tactics_3: "大战略家"
 tv_gg_tactics_3_desc: "完全的战术家——其战役在开始前便已结束，对手在第一场战斗打响前便已被调离。"
 desc_tv_gg_tactics_3: "该大将军是一位大战略家。[CHARACTER.GetHerHis]的战役在开打之前便已结束——在第一场战斗打响前，对手就已被算计在内。"
 tv_gg_tactics_3_die_desc: "[CHARACTER.GetSheHe|U]是[CHARACTER.GetHerHis]所在时代最杰出的战略头脑。据说[CHARACTER.GetSheHe]不拔剑便能赢得战争。这样的人，我们恐怕再也见不到了。"

 # 伤疤特质
 tv_gg_injured: "伤疤"
 tv_gg_injured_desc: "一次强化训练事故留下的持久创伤。如若再次训练而不加小心，旧伤有致命复发之虞。"
 desc_tv_gg_injured: "该大将军身上留有一道训练事故所造成的持久疤痕。继续训练有可能使旧伤复发——后果可能是致命的。"
 tv_gg_injured_die_desc: "[CHARACTER.GetSheHe|U]多年来以坚忍之心承受着伤痛。最终，旧伤夺去了战场未能夺走的一切。"

 # ── 附庸税收法律 ─────────────────────────────────────────────────────────────
 tv_subject_tax: "附庸税收"
 tv_subject_tax_desc: "决定从附庸国征收的贡金水平。"
 tv_subject_tax_low: "低税收"
 tv_subject_tax_low_desc: "减少从附庸国征收的贡金。他们将更为满意，但[tv_govhouse|E]的财库将有所损失。"
 tv_subject_tax_medium: "中税收"
 tv_subject_tax_medium_desc: "附庸国贡金的默认标准——不慷慨，也不苛索。"
 tv_subject_tax_high: "高税收"
 tv_subject_tax_high_desc: "提高附庸国贡金。对帝国有利可图，但深受附庸国民的憎恨。"

