 # ── 贸易胜利事件 ──────────────────────────────────────────────────────────────
 tv_trade.1.t: "首批市场"
 tv_trade.1.d: "我们的商人已在伟大的贸易市场站稳脚跟。让他们积累财富吧。"
 tv_trade.1.a: "打开账本。"
 tv_trade.2.t: "贸易路线之主"
 tv_trade.2.d: "我们的商业网络如今主导着整个地区。商队与船只都听命于我们。"
 tv_trade.2.a: "派遣更多商人。"
 tv_trade.3.t: "伟大的商业帝国"
 tv_trade.3.d: "昔日的几名商人已成长为一个商业帝国。我们的名字出现在每一个伟大的市场上。"
 tv_trade.3.a: "荣耀归于商人阶层。"
 tv_trade.4.t: "商业之海的主宰"
 tv_trade.4.d: "我们的贸易航线纵横交错，遍布已知世界。连距离本身也向我们的商业舰队低头。"
 tv_trade.4.a: "开辟新航线。"
 tv_trade.5.t: "贸易霸主"
 tv_trade.5.d: "我们完成了前所未有的壮举：将世界的商业据为己有。这场胜利，永世长存。"
 tv_trade.5.a: "我们的账本已满溢。"

