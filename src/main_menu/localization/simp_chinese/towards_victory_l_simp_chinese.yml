 TV_PROSPERITY_M2_REWARDS: "+5% 人口增长\n-10% 建筑费用"
 TV_PROSPERITY_M3_TITLE: "繁荣胜利 — 短期胜利"
 TV_PROSPERITY_M3_MEANING: "繁荣的腹地。短期胜利。分数约12,000。"
 TV_PROSPERITY_M3_CONDITIONS: "繁荣分数 ≥ 12,000。"
 TV_PROSPERITY_M3_REWARDS: "+0.01 每月发展度\n+0.01 每月繁荣度"
 TV_PROSPERITY_M4_TITLE: "繁荣胜利 — 里程碑四"
 TV_PROSPERITY_M4_MEANING: "先进的国家 — 令邻国艳羡。分数约18,000。"
 TV_PROSPERITY_M4_CONDITIONS: "繁荣分数 ≥ 18,000。"
 TV_PROSPERITY_M4_REWARDS: "+10% 建筑速度\n+5% 商品黄金产出"
 TV_PROSPERITY_M5_TITLE: "繁荣胜利 — 长期胜利"
 TV_PROSPERITY_M5_MEANING: "地球上最发达的国家。长期胜利。分数约25,000。"
 TV_PROSPERITY_M5_CONDITIONS: "繁荣分数 ≥ 25,000。"
 TV_PROSPERITY_M5_REWARDS: "+10% 建筑速度\n+10% 人口容量"

