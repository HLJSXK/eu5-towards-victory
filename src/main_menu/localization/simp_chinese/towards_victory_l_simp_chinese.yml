 tv_cultural.2.t: "文艺复兴宫廷"
 tv_cultural.2.d: "我们宫廷的辉煌已传播至遥远之地。学者与[artist|e]纷纷寻求我们的赞助，以我们名义委托的[work_of_art|e]令王公与教皇皆赞叹不已。"
