 tv_cultural.5.a: "我们的名字将与文明本身永远共存。"


 # ── Science Victory ──────────────────────────────────────────────────────────
 TV_SCIENCE_TITLE: "科技胜利"
 TV_SCIENCE_DESCRIPTION: "他人在磨刀，你们在磨砺心智。掌握自然奥秘的国度，统御的不只是当下，更是未来每一个时代的面貌。"
 TV_SCIENCE_FLAVOR: "\"认识真相的真正方法是实验。\" — 威廉·布莱克"

 TV_SCIENCE_M1_TITLE: "科技胜利 — 第一里程碑"
 TV_SCIENCE_M1_MEANING: "充满求知欲的国度——在追求知识的征途上掌握了一百项[advance|e]。"
 TV_SCIENCE_M1_TRIGGER_DESC: "[tv_science_score|e] ≥ 100，科学院等级 ≥ 1"
 TV_SCIENCE_M2_TITLE: "科技胜利 — 第二里程碑"
 TV_SCIENCE_M2_MEANING: "积极拥抱这个时代伟大[institution|e]的国度——已掌握一百五十项[advance|e]。"
 TV_SCIENCE_M2_TRIGGER_DESC: "[tv_science_score|e] ≥ 150，科学院等级 ≥ 2"
 TV_SCIENCE_M3_TITLE: "科技胜利 — 短期胜利"
 TV_SCIENCE_M3_MEANING: "学问的先锋国度——两百项[advance|e]。短期胜利。没有任何国家能在知识领域与你抗衡。"
 TV_SCIENCE_M3_TRIGGER_DESC: "[tv_science_score|e] ≥ 200，科学院等级 ≥ 3"
 TV_SCIENCE_M4_TITLE: "科技胜利 — 第四里程碑"
 TV_SCIENCE_M4_MEANING: "首屈一指的科学强国——三百项[advance|e]，数代投入已然成真。"
 TV_SCIENCE_M4_TRIGGER_DESC: "[tv_science_score|e] ≥ 300，科学院等级 ≥ 4"
 TV_SCIENCE_M5_TITLE: "科技胜利 — 长期胜利"
 TV_SCIENCE_M5_MEANING: "开创工业时代的国度——四百项[advance|e]。长期胜利。未来属于你。"
 TV_SCIENCE_M5_TRIGGER_DESC: "[tv_science_score|e] ≥ 400，科学院等级 ≥ 5"

 # ── Science Victory Events ───────────────────────────────────────────────
 tv_science.1.t: "学者之国"
 tv_science.1.d: "我们的大学与学院已开始结出硕果。一百项[advance|e]已被我们掌握——在这个时代，我们的国度已站在学问的前沿。"
 tv_science.1.a: "知识将为我们照亮前行之路。"
 tv_science.2.t: "拥抱新思想"
 tv_science.2.d: "我们的学者已消化并传播了这个时代的伟大[institution|e]。一百五十项[advance|e]以我们的名义立下，外邦思想家纷纷寻求我们宫廷的庇护。"
 tv_science.2.a: "开放的心灵胜过千军万马。"
 tv_science.3.t: "学问中心 — 短期胜利"
 tv_science.3.d: "没有任何国家能与我们在科学与治理之道上的造诣相抗衡。两百项[advance|e]——一个短期科技胜利，标志着我们已成为这个时代的智识强国。"
 tv_science.3.a: "理性与探究将引领我们继续前行。"
 tv_science.4.t: "现代性的门槛"
 tv_science.4.d: "我们的自然哲学家与工程师如今已将探索推至已知世界的边疆。三百项[advance|e]，是数代人对学问持续投入的明证。"
 tv_science.4.a: "蒸汽与钢铁的时代正在等待我们。"
 tv_science.5.t: "长期胜利 — 工业先驱"
 tv_science.5.d: "四百项[advance|e]。蒸汽、钢铁与理性的思维已彻底改造了我们的国度。旧帝国相继崩塌之后，在我们学院中铸就的知识，将永远改变整个世界。"
 tv_science.5.a: "我们的名字将与进步本身永远共存。"

 tv_academy_of_sciences_1: "科学院，第一阶段"
 tv_academy_of_sciences_1_desc: "国内最优秀的头脑首次汇聚一堂——对自然哲学的系统性探索由此开始。"
 tv_academy_of_sciences_2: "科学院，第二阶段"
 tv_academy_of_sciences_2_desc: "新的讲堂、新的仪器、新的问题。科学院将探索延伸至自然最深邃的奥秘。"
 tv_academy_of_sciences_3: "科学院，第三阶段"
 tv_academy_of_sciences_3_desc: "来自已知世界各宫廷的学者纷至沓来，皆为科学院日益彰显的声望所吸引。我们不再只是求学者——我们已成为传道者。"
 tv_academy_of_sciences_4: "科学院，第四阶段"
 tv_academy_of_sciences_4_desc: "科学院矗立于人类知识的前沿，开创性的发现推翻了数百年的假设，重塑了可能性的边界。"
 tv_academy_of_sciences_5: "科学院，第五阶段"
 tv_academy_of_sciences_5_desc: "蒸汽、钢铁与理性的思维已不再是理论。科学院的发现已成为新时代的筋骨——一个将超越每一个王朝的时代。"
