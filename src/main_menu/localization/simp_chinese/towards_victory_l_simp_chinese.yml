 TV_TRADE_M3_MEANING: "贸易帝国。短期胜利。每月贸易收入约400。"
 TV_TRADE_M3_TRIGGER_DESC: "贸易分数 ≥ 400，且需达到市场主导地位"
 TV_TRADE_M4_TITLE: "贸易胜利 — 里程碑四"
 TV_TRADE_M4_MEANING: "商业之海 — 近乎垄断关键贸易要道。每月贸易收入约1,000。"
 TV_TRADE_M4_TRIGGER_DESC: "贸易分数 ≥ 1,000"
 TV_TRADE_M5_TITLE: "贸易胜利 — 长期胜利"
 TV_TRADE_M5_MEANING: "贸易霸主。无可争议。长期胜利。每月贸易收入约2,000。"
 TV_TRADE_M5_TRIGGER_DESC: "贸易分数 ≥ 2,000，且需达到市场主导地位"

 # ── Trade Victory Events ───────────────────────────────────────────────
 tv_trade.1.t: "首批市场"
 tv_trade.1.d: "我们的商人已在伟大的贸易市场站稳脚跟。让他们积累财富吧。"
 tv_trade.1.a: "打开账本。"
 tv_trade.2.t: "贸易路线之主"
 tv_trade.2.d: "我们的商业网络如今主导着整个地区。商队与船只都听命于我们。"
 tv_trade.2.a: "派遣更多商人。"
 tv_trade.3.t: "伟大的商业帝国"
 tv_trade.3.d: "昔日的几名商人已成长为一个商业帝国。我们的名字出现在每一个伟大的市场上。"
 tv_trade.3.a: "荣耀归于商人阶层。"
 tv_trade.4.t: "商业之海的主宰"
 tv_trade.4.d: "我们的贸易航线纵横交错，遍布已知世界。连距离本身也向我们的商业舰队低头。"
 tv_trade.4.a: "开辟新航线。"
 tv_trade.5.t: "贸易霸主"
 tv_trade.5.d: "我们完成了前所未有的壮举：将世界的商业据为己有。这场胜利，永世长存。"
 tv_trade.5.a: "我们的账本已满溢。"

 tv_trade_market_dominance_5_tt:0 "在至少5个贸易市场中拥有最高贸易优势"
 tv_trade_market_dominance_10_tt:0 "在至少10个贸易市场中拥有最高贸易优势"

 # ── Diplomatic Victory ──────────────────────────────────────────────────────────
 TV_DIPLOMATIC_TITLE: "外交胜利"
 TV_DIPLOMATIC_DESCRIPTION: "通过同盟、条约和外交手段积累影响力。"
 TV_DIPLOMATIC_FLAVOR: "\"在理性失败之处，军随谓少用。\""

 TV_DIPLOMATIC_M1_TITLE: "外交胜利 — 里程碑一"
 TV_DIPLOMATIC_M1_MEANING: "50 外交胜利点且10国支持我们的事业。联盟诞生。"
 TV_DIPLOMATIC_M1_TRIGGER_DESC: "外交胜利点 ≥ 50 且外交支持国 ≥ 10"
 TV_DIPLOMATIC_M2_TITLE: "外交胜利 — 里程碑二"
 TV_DIPLOMATIC_M2_MEANING: "120 DVP 且联盟等级 ≥ 3。可靠的盟友与和平居间人。"
