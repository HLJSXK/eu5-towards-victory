 # ── Prosperity Victory Events ───────────────────────────────────────────────
 tv_prosperity.1.t: "[tv_prosperity_victory|E]：国家开始兴旺"
 tv_prosperity.1.d: "最初的迹象并不壮丽，也正因如此才显得重要。昔日勉强缴足什一税的田地，如今还能留下余粮；市街在日落后依然喧闹；家户谈起明年时，语气比以往少了几分谨慎。税吏看见更稳定的缴纳，建筑匠看见更厚的订册，地方官看见更少绝望的请愿。这就是[tv_prosperity_victory|E]最早的语言：面包、屋顶、工具与时间。它还不是荣耀，却是荣耀生长的土壤。一个能喂养希望的国家，才有资格开始建造奇迹。"
 tv_prosperity.1.a: "把每一座满仓都记作承诺。"
 tv_prosperity.2.t: "[tv_prosperity_victory|E]：蓬勃发展的王国"
 tv_prosperity.2.d: "持续投入已经改变了国家的声音。锤声应和钟声，车轮应和丰收歌声，新的[building|e]矗立在昔日泥路尽头的街巷之上。[population|e]增长不再只是负担，而成为家户相信未来可被承担的证明。跨过边境的旅人不再只谈士兵或典礼，他们谈论作坊、运河、粮仓，以及普通地区肉眼可见的[wealth|e]。每一段道路修整都缩短了与距离的争执。每一座城镇改善都让乡野学会期待更多。国家不只是更富有，它正在学习如何把财富变成结构。"
 tv_prosperity.2.a: "让木石与工钱继续发声。"
 tv_prosperity.3.t: "[tv_prosperity_victory|E]：腹地蓬勃兴盛"
 tv_prosperity.3.d: "我们的腹地已经不再像是幸运，而像是有意造就的成果。健康的[population|e]、活跃的城镇与精心耕耘的田地彼此支撑，稳定到让外国观察者误以为这只是天然丰饶。面包师、石匠、地方法官与运河看守，各自掌管着同一台机器的一小部分。这便是[tv_prosperity_victory|E]的短期高峰：一个国内力量不再依赖某个丰年或某座宠城的国家。即便动乱也更难找到裂缝，因为日常生活已经拥有了重量与期待。国家在雄心之下铺起了一层地基，而这地基上站满了打算继续生活的人。"
 tv_prosperity.3.a: "在这片有生命的根基上继续向上建造。"
 tv_prosperity.4.t: "[tv_prosperity_victory|E]：先进的国家"
 tv_prosperity.4.d: "邻国宫廷开始派来声称研究礼仪的使节，却在暗中清点我们的仓库。他们看见足以与首都竞辉的城市、被市场联结的村庄，以及多到令士兵不安、又丰衣足食到令财政家不安的[population|e]。我们的[prosperity|e]已经成为外交事实，成为竞争者必须向本国臣民解释的东西。然而丰裕也有自己的胃口。更多道路需要更多石料，更多城镇需要更多规则，更多财富需要一个足够聪明、不会淹没在自身成功中的国家。顶峰已经看得见了，这也意味着攀登再无宽容可言。"
 tv_prosperity.4.a: "让艳羡成为我们最稳定的出口品。"
 tv_prosperity.5.t: "[tv_prosperity_victory|E]：长期胜利 — 最繁荣的国家"
 tv_prosperity.5.d: "已知世界中，已无任何国家能与我国的[prosperity|e]相媲美。我们的人民众多却不只是拥挤，我们的城镇富庶却不只是膨胀，我们的土地被经营到仿佛改良本身已成为公民本能。外国商人怀着利润预期而来，却带着对秩序的描述离去；外国王公怀着观赏奇景的预期而来，却带着对恒久的描述离去。这是[tv_prosperity_victory|E]的完成，不是单一奇迹，而是一整套被维持的丰裕文明。粮仓充盈，工坊喧响，税册清晰，甚至雄心也学会在公共工程的队伍里等待轮次。历史不会只因我们征服或号令过什么而记住我们。它会记住，在某一段时间里，我们统治下的人类生活比任何地方都更像是可能的。"
 tv_prosperity.5.a: "让丰裕本身成为纪念碑。"


