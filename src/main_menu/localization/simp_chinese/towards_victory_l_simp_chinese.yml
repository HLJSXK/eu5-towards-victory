 # ── 外交胜利事件 ──────────────────────────────────────
 tv_diplomatic.1.t: "外交展露头角"
 tv_diplomatic.1.d: "我们耐心的外交已开始结果。通过同盟与联姻，我国正在赢得一席之地。"
 tv_diplomatic.1.a: "让我们的话语具有分量。"
 tv_diplomatic.2.t: "可靠的盟友"
 tv_diplomatic.2.d: "各国将我们视为促成和平的保证人与合作伙伴。我们履行承诺的意愿已树立了金钱买不到的声望。"
 tv_diplomatic.2.a: "我们以诺言为盟。"
 tv_diplomatic.3.t: "一流外交大国 — 短期胜利"
 tv_diplomatic.3.d: "我们的外交触角已覆盖大陆。条约盖有我们的印签，远方宫廷的使节寻求我们的建言。我们已取得短期外交胜利。"
 tv_diplomatic.3.a: "世界在我们说话时会倾听我们的声音。"
 tv_diplomatic.4.t: "万国仲裁人"
 tv_diplomatic.4.d: "没有任何小国纷争可绕过我们的同意而得到解决。我们的属国忠诚，盟友众多，在这个时代影响无可匹敌。"
 tv_diplomatic.4.a: "我们将维护世界和平。"
 tv_diplomatic.5.t: "长期胜利 — 外交霸主"
 tv_diplomatic.5.d: "五百八十分外交胜利点。史上从未有任何国家编织过如此广大的同盟、联姻与互保网络。我们的功勣不写于征服，而写于我们保卫的和平。"
 tv_diplomatic.5.a: "我们的名字将与外交艺术永远共存。"

 # ── 文化胜利事件 ──────────────────────────────────────
 tv_cultural.1.t: "艺术赞助人"
 tv_cultural.1.d: "我们的宫廷已开始吸引画家、雕塑家和文人。以我们名义委托的作品已经彰显出某种远超政治的意义——一个文明正在成形。"
 tv_cultural.1.a: "让艺术在我们的庇护下繁荣。"
 tv_cultural.2.t: "文艺复兴宫廷"
 tv_cultural.2.d: "我们宫廷的辉煌已传播至遥远之地。学者与艺术家纷纷寻求我们的赞助，以我们名义委托的作品令王公与教皇皆赞叹不已。"
 tv_cultural.2.a: "我们的宫廷将成为学问的灯塔。"
 tv_cultural.3.t: "文明中心 — 短期胜利"
 tv_cultural.3.d: "这个时代没有任何宫廷在艺术、文学和学问上能超越我们。我们取得了平庸王公只能梦想之物——一个将在几个世纪中回响的短期文化胜利。"
 tv_cultural.3.a: "文明本身从我们的大殿中放射光芒。"
 tv_cultural.4.t: "世界之光"
 tv_cultural.4.d: "我们的文化影响力早已超越国界。他国模仿我们的风尚，接受我们的思想，将其最优秀的才智送来在我们的大师门下学习。世界将我们视为品位与文雅的仲裁者。"
 tv_cultural.4.a: "我们将肩负文明的火炬。"
 tv_cultural.5.t: "长期胜利 — 文化霸主"
 tv_cultural.5.d: "五百八十文化影响力点。历史上从未有任何国家创造出如此之多的美、智慧与奇迹。在我们的军队早已被遗忘之后，以我们名义创造的作品将永久流传，成为世界有史以来最伟大的文化遗产。"
 tv_cultural.5.a: "我们的名字将与文明本身永远共存。"

