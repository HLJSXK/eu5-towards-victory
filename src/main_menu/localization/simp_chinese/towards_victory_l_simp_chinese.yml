 # ── Trade Victory Events ───────────────────────────────────────────────
 tv_trade.1.t: "[tv_trade_victory|E]：首批市场"
 tv_trade.1.d: "我们的[merchant|e]已在伟大的[trade|e] [market|e]中赢得第一批可靠位置。他们尚不能号令世界，却已经知道哪些门会在黎明前开启，哪些书记值得信任，哪些仓库散发着机会的气味。商业立足点很少显得壮观；它是一间账房里的坐凳，一枚在码头受尊重的印章，一笔准时偿还的债务。然而账册上已经出现[tv_trade_victory|E]的第一阵脉搏。钱币如今开始因习惯而非偶然流向我们。让对手夸耀发现的宝藏吧；我们要教白银准时赴约。"
 tv_trade.1.a: "削尖羽笔，数清潮汐。"
 tv_trade.2.t: "[tv_trade_victory|E]：贸易路线之主"
 tv_trade.2.d: "本地区的商队与船只已经开始按照我们的便利重新排列。契约使用我们的度量，仓库等待我们的代理人，船长在我们的[merchant|e]谈完价之前推迟启航。这不是火炮征服，却同样改变了谁必须在行动前低头。区域[trade|e]如今穿行于一张由人情、信用、护送与价格构成的网络，而我们的商号比任何人都更懂这张网。竞争者仍在航行，仍在骑行，却越来越是在我们为他们标价的世界中前进。地图有道路，账册也有自己的航线。"
 tv_trade.2.a: "让每一支商队都学会我们的价格。"
 tv_trade.3.t: "[tv_trade_victory|E]：伟大的商业帝国"
 tv_trade.3.d: "昔日寥寥几名[merchant|e]，如今已经成长为一个无需王座也能受人服从的[trade|e]帝国。我们的名字出现在保险人的书信里、竞争者的抱怨里、水手的祈祷里，也出现在那些先需要贷款、后需要盟友的统治者的静默计算里。在每一个伟大的[market|e]中，如今都有人询问我们愿意支付什么、承运什么、拒绝什么。这场短期[tv_trade_victory|E]不只以收入衡量，也以期待衡量。人们在看见我们的船帆之前，便已为我们的到来做准备。这是一种更细微的权力，而细微的权力往往最持久。"
 tv_trade.3.a: "把凯旋交给账房。"
 tv_trade.4.t: "[tv_trade_victory|E]：商业之海的主宰"
 tv_trade.4.d: "我们的[trade|e]航线如今纵横已知世界，仿佛另一套洋流。船只从一座港口带出布匹，从另一座港口带出香料，从第三座港口带出金属，而它们归来时携带的信息往往与货物同样珍贵。距离并未消失，但我们的[merchant|e]舰队已经教会它收取更低的价码。港务官认得我们的信号，经纪人等待我们的消息，远方生产者也会把我们的需求纳入播种或开采的考虑。每一次航行都让图案收紧。我们不再只是参与世界商业；我们正在教世界商业该往哪里转向。"
 tv_trade.4.a: "让罗盘指向利润。"
 tv_trade.5.t: "[tv_trade_victory|E]：贸易霸主"
 tv_trade.5.d: "我们完成了前所未有的壮举：让世界商业以我们的口音作答。并非每一座港口都属于我们，并非每一艘船都悬挂我们的旗帜，也并非每一份契约都盖有我们的印章，但每一次严肃的计算都必须把我们纳入其中。我们的船队一旦延误，价格便会颤动。王公等待我们的信用，殖民者等待我们的货物，竞争者围绕我们的习惯制定政策。这就是[tv_trade_victory|E]的完成，一种写在账册而非大理石上的霸权。它或许比征服安静，但当国库依赖我们能扰动的航路时，没有哪座王座真正稳固。世界商业不是我们拥有的一处地方；它是一场我们学会主导的谈话。"
 tv_trade.5.a: "在我们的账册中为世界结算。"

