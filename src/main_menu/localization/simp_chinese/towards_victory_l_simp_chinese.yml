 # ── Cultural Victory Events ───────────────────────────────────────────────
 tv_cultural.1.t: "[tv_cultural_victory|E]：艺术赞助人"
 tv_cultural.1.d: "我们的宫廷已经开始吸引[artist|e]、雕塑家、歌者、译者与文人，他们总能在赞助正式宣布之前嗅到它的气味。以我们名义委托的第一批[work_of_art|e]不只是奉承王座；它们让陌生人有了想象我们的方式。一个曾以婚姻和战役衡量自身的宫廷，如今发现自己的名声正由颜料、诗句、雕石与机敏流言携带。这是[tv_cultural_victory|E]的第一口活气。[tv_arts_exhibition|E]会把这口气向外吹送，为我们的艺术家提供道路、观众与配得上他们的竞争者。政治可以命令人服从，美却会教人渴望靠近。"
 tv_cultural.1.a: "让赞助成为我们最柔软的武器。"
 tv_cultural.2.t: "[tv_cultural_victory|E]：文艺复兴宫廷"
 tv_cultural.2.d: "我们宫廷的辉煌跨越边境，比任何使节都更从容。学者与[artist|e]纷纷寻求我们的赞助，因为他们相信我们的厅堂能把技艺变成记忆；我们的[work_of_art|e]如今也在那些过去只通过传闻知晓我们的地方受到称赞。通过巡演、展览与精心培育的赞叹积累起来的[tv_arts_intl_influence|E]，已经开始改变声望的流向。外国王公询问谁曾为我们作画，哪位诗人与我们共宴，以及他们自己的宫廷是否因此显得乡气。这个问题本身就是真正的胜利。我们让品味变得政治化，却没有让它变得粗俗。"
 tv_cultural.2.a: "让每座宫廷都拿自己与我们相比。"
 tv_cultural.3.t: "[tv_cultural_victory|E]：文明中心 — 短期胜利"
 tv_cultural.3.d: "这个时代已经没有任何宫廷能在艺术、文学、典礼与学术谈话上超越我们。厅堂里挤满了人，却不只是奉承者；他们相信在这里被看见，会改变自己作品的价值。我们的[tv_arts_exhibition|E]给他们更广阔的世界，而我们的宫殿则给他们重心。这场短期[tv_cultural_victory|E]之所以会回响，并不是因为某一件杰作或某一场庆典。它是一种统治风格，一种赞助节奏，一种让才华在士兵尚未出发前便主动向我们旅行的名声。平庸王公收藏饰物；我们正在收藏一个时代。"
 tv_cultural.3.a: "让天才在我们的门前排队。"
 tv_cultural.4.t: "[tv_cultural_victory|E]：世界之光"
 tv_cultural.4.d: "我们的[cultural_influence|e]早已越过国界，又披着异国颜色返回。他国模仿我们的风尚，翻译我们的书籍，引用我们的评论，把最优秀的才智送到那些曾在我们门外等待的大师门下学习。我们积累的[tv_arts_intl_influence|E]已不再像一个数字，而像一种天气。偏远宫廷在我国使节抵达前便修改典礼，害怕显得落伍所带来的安静羞耻。甚至敌人在想显得文明时，也会借用我们的语言。世界将我们视为品味的仲裁者，而仲裁不过是另一种权力。"
 tv_cultural.4.a: "先定下风尚，再让别人追赶。"
 tv_cultural.5.t: "[tv_cultural_victory|E]：长期胜利 — 文化霸主"
 tv_cultural.5.d: "一千六百点[tv_cip|E]如今支撑着一项任何竞争者都无法认真否认的文化成就。历史上从未有任何国家把如此之多的美、智慧、典礼、争论与奇迹汇聚到同一个可识别的名字之下。在我们的[army|e]早已被遗忘之后，以我们名义创造的[work_of_art|e]仍会教陌生人理解这个时代曾希望如何被看见。[tv_arts_exhibition|E]已把这个名字带向海外，直到赞叹变成期待，期待变成遗产。这就是[tv_cultural_victory|E]的完成：把赞助转化为文明。帝国可能失去省份；一种教会他人如何做梦的文化，已经越过了任何军队都无法守卫的边境。"
 tv_cultural.5.a: "让未来的世纪借用我们的光。"


