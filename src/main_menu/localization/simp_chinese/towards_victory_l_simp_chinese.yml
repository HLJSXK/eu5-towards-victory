 tv_cultural.3.t: "文明中心 — 短期胜利"
 tv_cultural.3.d: "这个时代没有任何宫廷在艺术、文学和学问上能超越我们。我们取得了平庸王公只能梦想之物——一个将在几个世纪中回响的短期文化胜利。"
 tv_cultural.3.a: "文明本身从我们的大殿中放射光芒。"
 tv_cultural.4.t: "世界之光"
 tv_cultural.4.d: "我们的[cultural_influence|e]早已超越国界。他国模仿我们的风尚，接受我们的思想，将其最优秀的才智送来在我们的大师门下学习。世界将我们视为品位与文雅的仲裁者。"
 tv_cultural.4.a: "我们将肩负文明的火炬。"
 tv_cultural.5.t: "长期胜利 — 文化霸主"
