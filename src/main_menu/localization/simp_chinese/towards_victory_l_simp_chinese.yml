 # ── Conquest Victory ──────────────────────────────────────────────────────────
 TV_CONQUEST_TITLE: "征服胜利"
 TV_CONQUEST_DESCRIPTION: "通过领土扩张称霸世界。"
 TV_CONQUEST_FLAVOR: "\"最大的幸福就是征服你的敌人。\" — 成吉思汗"

 TV_CONQUEST_M1_TITLE: "征服胜利 — 里程碑一"
 TV_CONQUEST_M1_MEANING: "初具规模的国家。征服分数约150。"
 TV_CONQUEST_M1_TRIGGER_DESC: "征服分数 ≥ 150"
 TV_CONQUEST_M2_TITLE: "征服胜利 — 里程碑二"
 TV_CONQUEST_M2_MEANING: "幅员辽阔的帝国。征服分数约300。"
 TV_CONQUEST_M2_TRIGGER_DESC: "征服分数 ≥ 300"
 TV_CONQUEST_M3_TITLE: "征服胜利 — 短期胜利"
 TV_CONQUEST_M3_MEANING: "确立领土霸主地位。短期胜利。征服分数约500。"
 TV_CONQUEST_M3_TRIGGER_DESC: "征服分数 ≥ 500"
 TV_CONQUEST_M4_TITLE: "征服胜利 — 里程碑四"
 TV_CONQUEST_M4_MEANING: "横跨大陆的帝国。征服分数约1,000。"
 TV_CONQUEST_M4_TRIGGER_DESC: "征服分数 ≥ 1,000"
 TV_CONQUEST_M5_TITLE: "征服胜利 — 长期胜利"
 TV_CONQUEST_M5_MEANING: "无可争议的世界帝国。长期胜利。征服分数约2,000。"
 TV_CONQUEST_M5_TRIGGER_DESC: "征服分数 ≥ 2,000"

 # ── Conquest Victory Events ───────────────────────────────────────────────
 tv_conquest.1.t: "帝国正在壮大"
 tv_conquest.1.d: "我们的军队已经远征，旗帜飘扬在150处领地之上。帝国的轮廓日渐清晰。"
 tv_conquest.1.a: "让我们的疆域继续扩张。"
 tv_conquest.2.t: "幅员辽阔的帝国"
 tv_conquest.2.d: "我国版图已覆盖300处领地。维持如此广袤的帝国，后勤补给与减少行军损耗至关重要。"
 tv_conquest.2.a: "后勤必须跟上我们的雄心。"
 tv_conquest.3.t: "领土霸权 — 短期胜利"
 tv_conquest.3.d: "500处领地已向我国旗帜俯首。这已不是王国，这是一个帝国。然而统治如此广袤的疆域，需要严明的治理与坚定的手腕。"
 tv_conquest.3.a: "这片疆土是我们治理的基业。"
 tv_conquest.4.t: "横跨大陆的帝国"
 tv_conquest.4.d: "超过千处领地已臣服于我们的统治。全世界都在注视。守住已征服之地，需要铁的纪律与强大的后勤。"
 tv_conquest.4.a: "我们将守护所征服的一切。"
 tv_conquest.5.t: "长期胜利 — 世界帝国"
 tv_conquest.5.d: "两千处领地。有史以来，从未有任何帝国掌控过如此广阔的疆土。我们的功业不书于纸，而铭刻于万里征途与猎猎旌旗之中。"
 tv_conquest.5.a: "我们的名字将永垂青史。"


 # ── Prosperity Victory ──────────────────────────────────────────────────────────
 TV_PROSPERITY_TITLE: "繁荣胜利"
 TV_PROSPERITY_DESCRIPTION: "通过国内发展建设一个繁荣的国家。"
 TV_PROSPERITY_FLAVOR: "\"繁荣是劳动的果实。\" — 修昔底德"

 TV_PROSPERITY_M1_TITLE: "繁荣胜利 — 里程碑一"
 TV_PROSPERITY_M1_MEANING: "蓬勃发展的国家 — 国内繁荣初现。分数约5,000。"
 TV_PROSPERITY_M1_TRIGGER_DESC: "繁荣分数 ≥ 5,000"
 TV_PROSPERITY_M2_TITLE: "繁荣胜利 — 里程碑二"
 TV_PROSPERITY_M2_MEANING: "兴旺发达的国家 — 持续的国内投入。分数约8,000。"
 TV_PROSPERITY_M2_TRIGGER_DESC: "繁荣分数 ≥ 8,000"
 TV_PROSPERITY_M3_TITLE: "繁荣胜利 — 短期胜利"
 TV_PROSPERITY_M3_MEANING: "繁荣的腹地。短期胜利。分数约12,000。"
 TV_PROSPERITY_M3_TRIGGER_DESC: "繁荣分数 ≥ 12,000"
 TV_PROSPERITY_M4_TITLE: "繁荣胜利 — 里程碑四"
 TV_PROSPERITY_M4_MEANING: "先进的国家 — 令邻国艳羡。分数约18,000。"
 TV_PROSPERITY_M4_TRIGGER_DESC: "繁荣分数 ≥ 18,000"
 TV_PROSPERITY_M5_TITLE: "繁荣胜利 — 长期胜利"
 TV_PROSPERITY_M5_MEANING: "地球上最发达的国家。长期胜利。分数约25,000。"
 TV_PROSPERITY_M5_TRIGGER_DESC: "繁荣分数 ≥ 25,000"

 # ── Prosperity Victory Events ───────────────────────────────────────────────
 tv_prosperity.1.t: "国家开始兴旺"
 tv_prosperity.1.d: "我们的人民正在繁荣。农田收成更丰，城镇商贸兴盛，国家的根基日益稳固。"
 tv_prosperity.1.a: "愿我们的繁荣持续增长。"
 tv_prosperity.2.t: "蓬勃发展的王国"
 tv_prosperity.2.d: "对土地的持续投入正在结出硕果。人口增长，建筑林立，国家的财富令所有踏入边境者叹为观止。"
 tv_prosperity.2.a: "我们的人民将衣食无忧。"
 tv_prosperity.3.t: "繁荣胜利 — 腹地蓬勃兴盛"
 tv_prosperity.3.d: "我国已实现极少数国家能够企及的内政繁荣水平。健康的人口、活跃的城镇与精心耕耘的土地，使我们成为真正的短期胜利者。"
 tv_prosperity.3.a: "愿这份繁荣成为我们伟大的基石。"
 tv_prosperity.4.t: "先进的国家"
 tv_prosperity.4.d: "邻国投以艳羡的目光。我们的城市跻身已知世界最出色之列，我们的人口位居最多且衣食充足。然而繁荣的顶峰依然在向我们招手。"
 tv_prosperity.4.a: "我们将攀登文明的巅峰。"
 tv_prosperity.5.t: "长期胜利 — 最繁荣的国家"
 tv_prosperity.5.d: "已知世界中，没有任何国家能与我国的繁荣相媲美。我们的人民最为众多，我们的城镇最为繁盛，我们的土地最为发达。历史将铭记我们是人类文明的巅峰。"
 tv_prosperity.5.a: "我们的遗产书写于人民的繁荣之中。"


 # ── Trade Victory ──────────────────────────────────────────────────────────
 TV_TRADE_TITLE: "贸易胜利"
 TV_TRADE_DESCRIPTION: "建立一个商业与海上力量的帝国。"
 TV_TRADE_FLAVOR: "\"威尼斯不打仗；威尼斯赚钱。\""

 TV_TRADE_M1_TITLE: "贸易胜利 — 里程碑一"
 TV_TRADE_M1_MEANING: "商业立足 — 主导一个贸易节点。每月贸易收入约100。"
 TV_TRADE_M1_TRIGGER_DESC: "贸易分数 ≥ 100"
