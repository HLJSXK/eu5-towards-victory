 TV_SCIENCE_TITLE: "科技胜利"
 TV_SCIENCE_DESCRIPTION: "通过推动知识与技术的进步，引领世界走向未来。"
 TV_SCIENCE_FLAVOR: "\"认识真相的真正方法是实验。\" — 威廉·布莱克"

