 # ── Science Victory Events ───────────────────────────────────────────────
 tv_science.1.t: "[tv_science_victory|E]：第一厅堂启幕"
 tv_science.1.d: "我们的[tv_academy_of_sciences|E]第一批厅堂已经落成，空气里有新木、灯油、墨水与争论的味道。一百项[advance|e]已被掌握，学者们给予国家的不只是一座建筑；他们给好奇心提供了公开地址。仪器在抄本旁被拆封，学生低声交谈，仿佛墙壁本身也可能回答问题。这是[tv_science_victory|E]的开场音。国家一直在使用知识，但如今它建立了一个知识也能反过来使用国家的地方。拥有[tv_academy_of_sciences|E]的国家尚未解开自然之谜，却已经让这些谜题按日程报到。"
 tv_science.1.a: "打开大门，磨利问题。"
 tv_science.2.t: "[tv_science_victory|E]：拥抱新思想"
 tv_science.2.d: "我们的学者已经消化并传播这个时代的伟大[institution|e]，直到它们在我们的讲堂中不再显得外来。一百五十项[advance|e]如今以我们的名义立下，每一项都被抄录、辩论、修正，并在国家某处投入使用。外邦思想家寻求我们宫廷的庇护，因为他们听说这里不只是容忍问题，而是组织问题。[tv_academy_of_sciences|E]已经成为器械、书信、方法与自尊的交汇点。新思想仍会带着口音、敌意和不合时宜的暗示抵达。也正因如此，我们知道它们还活着。"
 tv_science.2.a: "让外来的问题变成国内的工具。"
 tv_science.3.t: "[tv_science_victory|E]：学问中心 — 短期胜利"
 tv_science.3.d: "如今，没有任何国家能与我们在科学与治理之道上的造诣相抗衡。两百项[advance|e]并不是一堆发现，而是官员、机械师、医师、测绘师与教师共同使用的一套工作语言。[tv_academy_of_sciences|E]为这套语言提供了语法、仪式与雄心。这场短期[tv_science_victory|E]标志着我们已成为时代的智识强国，并不是因为每位学者都同意我们，而是因为每一场严肃分歧都希望获得我们的听众。理性已经成为宫廷人物，但不是温顺的那一种。我们应当为这种危险感到庆幸。"
 tv_science.3.a: "给争论更大的厅堂。"
 tv_science.4.t: "[tv_science_victory|E]：现代性的门槛"
 tv_science.4.d: "我们的自然哲学家与工程师如今以一种令旧头脑不安的急切，推挤着已知世界的边界。三百项[advance|e]是数代人持续投入学问的证明，也是一次次失败被认真保存、以免后来者重蹈覆辙的证明。工坊请教数学家，医师请教仪器匠，行政官发现表格有时和敕令一样会搅动世界。[tv_academy_of_sciences|E]不再只是一座丰碑；它是一台拥有许多房间的机器。它的齿轮由纸张、黄铜、名声与失眠组成。现代性的门槛不是我们找到的一扇门，而是我们一块木板一块木板搭建出来的东西。"
 tv_science.4.a: "继续搭建通向明日的大门。"
 tv_science.5.t: "[tv_science_victory|E]：长期胜利 — 工业先驱"
 tv_science.5.d: "四百项[advance|e]如今标记着从好奇到改造的漫长道路。蒸汽、钢铁、有纪律的实验、细致的记录与理性思维，已经从工坊向外彻底重塑我们的国家。[tv_academy_of_sciences|E]已不只是学校或会社；它是未来与现在谈判、并且通常获胜的地方。旧帝国或许仍在清点骑兵、头衔与典礼，但世界已经开始清点压力、识字率、机器、误差与可重复的证明。这就是[tv_science_victory|E]的完成。旧日强权崩塌许久之后，在我们学院中锻造的知识仍会继续改变人们如何工作、治病、旅行、治理，以及想象可能。"
 tv_science.5.a: "让明日在脚注中引用我们。"

 tv_academy_of_sciences_1: "[tv_academy_of_sciences|E]第一阶段"
 tv_academy_of_sciences_1_desc: "国内最优秀的头脑首次汇聚一堂——对自然哲学的系统性探索由此开始。"
 tv_academy_of_sciences_2: "[tv_academy_of_sciences|E]第二阶段"
 tv_academy_of_sciences_2_desc: "新的讲堂、新的仪器、新的问题。[tv_academy_of_sciences|E]将探索延伸至自然最深邃的奥秘。"
 tv_academy_of_sciences_3: "[tv_academy_of_sciences|E]第三阶段"
 tv_academy_of_sciences_3_desc: "来自已知世界各宫廷的学者纷至沓来，皆为[tv_academy_of_sciences|E]日益彰显的声望所吸引。我们不再只是求学者——我们已成为传道者。"
 tv_academy_of_sciences_4: "[tv_academy_of_sciences|E]第四阶段"
 tv_academy_of_sciences_4_desc: "[tv_academy_of_sciences|E]矗立于人类知识的前沿，开创性的发现推翻了数百年的假设，重塑了可能性的边界。"
 tv_academy_of_sciences_5: "[tv_academy_of_sciences|E]第五阶段"
 tv_academy_of_sciences_5_desc: "蒸汽、钢铁与理性的思维已不再是理论。[tv_academy_of_sciences|E]的发现已成为新时代的筋骨——一个将超越每一个王朝的时代。"
