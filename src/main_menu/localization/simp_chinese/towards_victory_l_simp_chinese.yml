 TV_SCIENCE_M2_TRIGGER_DESC: "科技分数 ≥ 150，科学院等级 ≥ 2"
 TV_SCIENCE_M3_TITLE: "科技胜利 — 短期胜利"
 TV_SCIENCE_M3_MEANING: "学问的先锋国度。短期胜利。约已研究200项技艺。"
 TV_SCIENCE_M3_TRIGGER_DESC: "科技分数 ≥ 200，科学院等级 ≥ 3"
 TV_SCIENCE_M4_TITLE: "科技胜利 — 第四里程碑"
