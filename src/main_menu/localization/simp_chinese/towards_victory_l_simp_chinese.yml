 # ── 科技胜利事件 ─────────────────────────────────────────
 tv_science.1.t: "学者之国"
 tv_science.1.d: "我们的大学与学院已开始结出硕果。三十项技艺已被我们掌握——在这个时代，我们的国度已站在学问的前沿。"
 tv_science.1.a: "知识将为我们照亮前行之路。"
 tv_science.2.t: "拥抱新思想"
 tv_science.2.d: "我们的学者已消化并传播了这个时代的伟大制度。八十项技艺以我们的名义立下，外邦思想家纷纷寻求我们宫廷的庇护。"
 tv_science.2.a: "开放的心灵胜过千军万马。"
 tv_science.3.t: "学问中心 — 短期胜利"
 tv_science.3.d: "没有任何国家能与我们在科学与治理之道上的造诣相抗衡。一百四十项技艺——一个短期科技胜利，标志着我们已成为这个时代的智识强国。"
 tv_science.3.a: "理性与探究将引领我们继续前行。"
 tv_science.4.t: "现代性的门槛"
 tv_science.4.d: "我们的自然哲学家与工程师如今已将探索推至已知世界的边疆。两百项技艺，是数代人对学问持续投入的明证。"
 tv_science.4.a: "蒸汽与钢铁的时代正在等待我们。"
 tv_science.5.t: "长期胜利 — 工业先驱"
 tv_science.5.d: "二百七十项技艺。蒸汽、钢铁与理性的思维已彻底改造了我们的国度。旧帝国相继崩塌之后，在我们学院中铸就的知识，将永远改变整个世界。"
 tv_science.5.a: "我们的名字将与进步本身永远共存。"
