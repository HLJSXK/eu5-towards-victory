 # ── Conquest Victory Events ───────────────────────────────────────────────
 tv_conquest.1.t: "[tv_conquest_victory|E]：帝国正在壮大"
 tv_conquest.1.d: "第一份捷报送抵宫廷时，封套上的泥水尚未干透。我们的[army|e]已经越过旧日边界，旗帜如今飘扬在200处曾被认为难以控制的[location|e]之上。廷臣们带着骄傲与隐忧描摹新边境，因为每一片新土地都意味着道路、税册、驻军与争执。[tv_conquest_victory|E]不再只是军官在庆功酒席上的豪言，而已成为真正的国家事务。信使连夜穿过那些过去属于他国君主的道路。帝国的轮廓正在显现，而且这道轮廓已经大到令旧习难以理解。"
 tv_conquest.1.a: "让测绘官追上旗帜。"
 tv_conquest.2.t: "[tv_conquest_victory|E]：幅员辽阔的帝国"
 tv_conquest.2.d: "四百处[location|e]如今听命于我们的印玺、税吏与军鼓。地图上的胜利一目了然，道路上的胜利却远没有这么整齐：运粮车陷入雨泥，军需官为那些书记从未写对两次的地名争吵不休。我们的[army|e]赢得了空间，如今国家必须学会喂养这片空间。每一座失修的桥都会变成[attrition|e]，每一头迟到的骡子都会变成软弱的传闻，每一支饥饿的军团都会教边境怀疑我们。帝国仍可继续扩张，但后勤必须像勇气一样受人尊崇。胜利给予我们距离，而距离要求纪律。"
 tv_conquest.2.a: "让帝国行于车轮、蹄声与账册之上。"
 tv_conquest.3.t: "[tv_conquest_victory|E]：领土霸权 — 短期胜利"
 tv_conquest.3.d: "六百处[location|e]如今向我们的旗帜俯首，王国二字在传令官口中已经显得狭小。地方显贵携礼物与冤情而来，被征服城镇询问投降后哪些法律仍然有效，军官们也发现驻军能夺下一座城门，却未必能夺下服从。这是真正帝国统治的第一次考验。[tv_govhouse|E]必须把征服变成习惯，而不是只变成恐惧。手腕太软，边缘便会散开；手腕太硬，整匹布都会撕裂。我们的[tv_conquest_victory|E]已抵达短期桂冠，但桂冠从来沉重。"
 tv_conquest.3.a: "在它想起旧主之前，先让它学会我们的统治。"
 tv_conquest.4.t: "[tv_conquest_victory|E]：横跨大陆的帝国"
 tv_conquest.4.d: "超过1,200处[location|e]如今都落在我们权威的阴影之下。外国宫廷不再询问我们是否危险，而是询问距离本身是否还能阻挡我们。旧日边界的语言已经失效，因为我们的边境不是一条线，而是由堡垒、道路、总督、人质、商人和士兵组成的流动秩序。每吸收一片土地，我们便多一份力量，也多一段必须谈判或打碎的记忆。我们的[army|e]必须在叛乱期待空缺之处出现，行政官必须在流言写下自己的法律之前抵达。世界注视着我们，因为世界正在衡量一个国家究竟能承受多少帝国。"
 tv_conquest.4.a: "让每一条道路都重新系回首都。"
 tv_conquest.5.t: "[tv_conquest_victory|E]：长期胜利 — 世界帝国"
 tv_conquest.5.d: "两千五百处[location|e]已在我们的统治之内，书记们甚至开始找不到合适的比喻。有史以来，从未有任何帝国掌控过如此广阔的已知世界，也从未迫使如此众多的人群同时面对同一面旗帜。捷报并非以单一凯旋的形式抵达，而是化作千百个更细小的归顺：一座城门开启，一项边疆誓言立下，一面叛旗被降下，一笔远方税款在没有士兵注视时缴清。我们的[tv_conquest_victory|E]已经从战役进入神话。后世君主会研究我们的道路，如同研究血脉；研究我们的围城，如同研读经文；研究我们的错误，如同阅读火写成的警告。我们的遗产不再只是被历史记录，它已经成为历史衡量雄心的尺度之一。"
 tv_conquest.5.a: "让地图学会我们的名字。"


