 # ── Cultural Victory Events ───────────────────────────────────────────────
 tv_cultural.1.t: "艺术赞助人"
 tv_cultural.1.d: "我们的宫廷已开始吸引[artist|e]、雕塑家和文人。以我们名义委托的[work_of_art|e]已经彰显出某种远超政治的意义——一个文明正在成形。"
