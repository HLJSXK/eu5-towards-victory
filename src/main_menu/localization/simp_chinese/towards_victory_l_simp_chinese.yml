 # ── 外交胜利事件 ──────────────────────────────────────
 tv.diplomatic.1.t: "外交展露头角"
 tv.diplomatic.1.d: "我们耐心的外交已开始结果。通过同盟与联姻，我国正在赢得一席之地。"
 tv.diplomatic.1.a: "让我们的话语具有分量。"
 tv.diplomatic.2.t: "可靠的盟友"
 tv.diplomatic.2.d: "各国將我们视为促成和平的保证人与合作伙伴。我们履行承诺的意愿已席建了金钱买不到的声望。"
 tv.diplomatic.2.a: "我们以診言为盟。"
 tv.diplomatic.3.t: "一流外交大国 — 短期胜利"
 tv.diplomatic.3.d: "我们的外交触角已覆盖大陆。条约盖有我们的印签，远方庭院的使节俬岔1我们的廣语。我们已取得短期外交胜利。"
 tv.diplomatic.3.a: "世界在我们说话时会值岗刀傅。"
 tv.diplomatic.4.t: "万国仲裁人"
 tv.diplomatic.4.d: "没有任何小国纷争可绕过我们的同意而得到解决。我们的属国忠诚，盟友众多，在这个时代影响无可匹敌。"
 tv.diplomatic.4.a: "我们将维护世界和平。"
 tv.diplomatic.5.t: "长期胜利 — 外交霸主"
 tv.diplomatic.5.d: "五百八十分外交胜利点。史上从未有任何国家编织过如此广大的同盟、联姻与互保网络。我们的功勣不写于征服，而写于我们保卫的和平。"
 tv.diplomatic.5.a: "我们的名字将与外交艺术永远共存。"
