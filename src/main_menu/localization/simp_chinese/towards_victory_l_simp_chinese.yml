 # ── Diplomatic Victory Events ───────────────────────────────────────────────
 tv_diplomatic.1.t: "[tv_diplomatic_victory|E]：外交展露头角"
 tv_diplomatic.1.d: "我们耐心的外交终于以唯一真正重要的形式结果：一种其他宫廷必须回应的制度。通过[alliance|e]、[royal_marriage|e]、承诺、宴席、吊唁与恰到好处的沉默，我们在[great_power|e]的桌前赢得了一席之地。[tv_diplomatic_alliance|E]的第一批基石并非石料，而是签名、见证人与共同承担的风险。敌人会称之为阴谋，朋友会称之为秩序。两者都不算全错。"
 tv_diplomatic.1.a: "把友谊盖上印，直到它凝固为政策。"
 tv_diplomatic.2.t: "[tv_diplomatic_victory|E]：可靠的盟友"
 tv_diplomatic.2.d: "各国如今会在危机迫使他们行动之前，主动把我们视为[guarantee|e]人与伙伴。他们已经明白，我们的承诺不是婚礼和加冕礼上用来装饰的辞藻，而是能经受坏天气的工具。在异国议事厅中，当边界动摇、债务发酸、王朝怒气上升时，人们会提起我们的名字。[tv_diplomatic_alliance|E]已经开始形成信任的习惯，而这种习惯比盛大演说更可靠地提升[tv_alliance_tier|E]。用金钱买来的声望花得很快。按时到场换来的声望，则会变成一种堡垒。"
 tv_diplomatic.2.a: "让可靠成为我们的传令官。"
 tv_diplomatic.3.t: "[tv_diplomatic_victory|E]：一流外交大国 — 短期胜利"
 tv_diplomatic.3.d: "我们的外交触角如今已覆盖大陆，由信使、婚姻线、常驻使节，以及账册无法完全记录的人情债共同承载。[treaty|e]上盖有我们的印签，是因为我们的印签对害怕孤立的人变得有用。远方宫廷的[diplomat|e]寻求我们的建言，并非出于礼貌，而是因为他们怀疑没有我们参与的决定经不起现实触碰。这是[tv_diplomatic_victory|E]的短期高点：一个其认可已成为和平机器组成部分的国家。[tv_diplomatic_alliance|E]则为这台机器提供房间、声音与记忆。如今我们说话时，别人不只是倾听；他们会调整姿态。"
 tv_diplomatic.3.a: "轻声开口，让所有人都不得不倾身来听。"
 tv_diplomatic.4.t: "[tv_diplomatic_victory|E]：万国仲裁人"
 tv_diplomatic.4.d: "如今，没有任何王公纷争能够在绕过我们同意的情况下干净地收场。我们的[subject|e]保持忠诚，因为他们看见了我们名号所提供的庇护；我们的[alliance|e]伙伴众多，因为他们学会了靠近我们会改变每一次谈判的胜算。请愿书从那些曾无视我国使节的宫廷送来，每一封都请求我们祝准、拖延、谴责，或安静地容忍某项安排。[tv_alliance_tier|E]已经高到连程序本身都开始服务于我们的影响力。我们不必向欧亚非或海洋大声喊话；我们的一次停顿，就能比另一位统治者的军队更响亮。这个时代仍有许多王冠，但越来越少的和约能在没有我们阴影掠过羊皮纸的情况下成立。"
 tv_diplomatic.4.a: "让和平等待我们的签名。"
 tv_diplomatic.5.t: "[tv_diplomatic_victory|E]：长期胜利 — 外交霸主"
 tv_diplomatic.5.d: "一万五千点[tv_dvp|E]如今像大厅中的见证人一样站在我们的名字背后。史上从未有任何国家编织过如此广大的[alliance|e]、[royal_marriage|e]、互保[guarantee|e]、共同程序与有用义务之网。有些帝国通过焚烧城市制造沉默；我们则让城市相信，经由我们发声更为安全，于是制造了沉默。[tv_diplomatic_alliance|E]不再像一个计划，而像一种国际习惯。竞争者也许憎恨它，却会围绕我们的会议、婚姻与书信安排自己的憎恨。这就是[tv_diplomatic_victory|E]的完成：并非冲突消失，而是每一场重要冲突上都有我们的手。"
 tv_diplomatic.5.a: "让各国文书厅围绕我们落笔。"


