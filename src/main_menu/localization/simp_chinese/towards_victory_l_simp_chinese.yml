 TV_SCIENCE_M5_TRIGGER_DESC: "科技分数 ≥ 400，科学院等级 ≥ 5"

 # ── Science Victory Events ───────────────────────────────────────────────
 tv_science.1.t: "学者之国"
 tv_science.1.d: "我们的大学与学院已开始结出硕果。一百项技艺已被我们掌握——在这个时代，我们的国度已站在学问的前沿。"
 tv_science.1.a: "知识将为我们照亮前行之路。"
 tv_science.2.t: "拥抱新思想"
 tv_science.2.d: "我们的学者已消化并传播了这个时代的伟大制度。一百五十项技艺以我们的名义立下，外邦思想家纷纷寻求我们宫廷的庇护。"
 tv_science.2.a: "开放的心灵胜过千军万马。"
 tv_science.3.t: "学问中心 — 短期胜利"
 tv_science.3.d: "没有任何国家能与我们在科学与治理之道上的造诣相抗衡。两百项技艺——一个短期科技胜利，标志着我们已成为这个时代的智识强国。"
 tv_science.3.a: "理性与探究将引领我们继续前行。"
 tv_science.4.t: "现代性的门槛"
 tv_science.4.d: "我们的自然哲学家与工程师如今已将探索推至已知世界的边疆。三百项技艺，是数代人对学问持续投入的明证。"
 tv_science.4.a: "蒸汽与钢铁的时代正在等待我们。"
 tv_science.5.t: "长期胜利 — 工业先驱"
 tv_science.5.d: "四百项技艺。蒸汽、钢铁与理性的思维已彻底改造了我们的国度。旧帝国相继崩塌之后，在我们学院中铸就的知识，将永远改变整个世界。"
 tv_science.5.a: "我们的名字将与进步本身永远共存。"

 tv_academy_of_sciences_1: "科学院，第一阶段"
 tv_academy_of_sciences_1_desc: "建立一所专门致力于系统推进学问与自然哲学的国家科学院。"
 tv_academy_of_sciences_2: "科学院，第二阶段"
 tv_academy_of_sciences_2_desc: "扩充科学院的研究部门，建立专用的自然哲学实验室。"
 tv_academy_of_sciences_3: "科学院，第三阶段"
 tv_academy_of_sciences_3_desc: "科学院获得国际认可，成为顶尖学术重镇，汇聚各地学者。"
 tv_academy_of_sciences_4: "科学院，第四阶段"
 tv_academy_of_sciences_4_desc: "科学院成为自然哲学革命的中心，引领开创性发现，重新定义人类知识的边界。"
 tv_academy_of_sciences_5: "科学院，第五阶段"
 tv_academy_of_sciences_5_desc: "科学院推动国家迈入工业与理性的时代，其发现奠定了新世界的基础。"
