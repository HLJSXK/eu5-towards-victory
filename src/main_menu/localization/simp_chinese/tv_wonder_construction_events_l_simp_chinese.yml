 tv_engineering_department.7090.t:0 "奇观建设：国内支持度波动"
 tv_engineering_department.7090.d:0 "围绕国内支持度的一项临场决定带来了难以预判的结果。同一条捷径可能节省一个月，也可能赔掉一个月；同一种权宜可能成为方法，也可能成为教训。昂贵而未完成的石料旁，所有人都在等待答案。"
 tv_engineering_department.7090.a:0 "让工地给出答案。"
