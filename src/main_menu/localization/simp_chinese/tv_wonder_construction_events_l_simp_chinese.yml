 tv_engineering_department.7121.d:0 "雨后的车辙陷得太深，码头上的货堆又一次比工地的耐心更高，同时地方已经被频繁的征调和传令搅得心神不宁，再多一步就会有人把怨气说出口。若让工程自己吞下这口气，车队会继续误点，工匠也会继续等着看空车回来；若把压力推出围栏，[stability|E]会在看似普通的命令之间松动。参事们都能说明两边为何必要，却没有人能把账页变干净。"
