 tv_engineering_department.7000.t:0 "奇观建设：国内支持度激增"
 tv_engineering_department.7000.d:0 "一次少见的顺利月份降临在奇观工地上。原本只是照常核算的工序，忽然在国内支持度方面打开了余地。工头的日程更清楚，书记的账册更宽松，选址上的人们也短暂相信这项工程并非只会吞噬命令与耐心。"
 tv_engineering_department.7000.a:0 "抓住这次难得机会。"
