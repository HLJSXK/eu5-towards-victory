 tv_engineering_department.7200.t:0 "奇观建设：大工程师带来国内支持度突破"
 tv_engineering_department.7200.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]为工程强行理出了一套罕见而漂亮的方案，使国内支持度大幅改善。连最怀疑的工头也暂时不再把这称作运气。\n\n#G 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力高于80。#!"
