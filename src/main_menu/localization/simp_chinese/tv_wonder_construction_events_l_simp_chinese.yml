 tv_engineering_department.7000.t:0 "[tv_wonder_construction|E]：街巷为工地喝彩"
 tv_engineering_department.7000.d:0 "围栏外的议论忽然变得顺耳。行会愿意署名，乡绅愿意少问几句，路人也开始把这项工程说成共同的体面。[tv_wonder_domestic_support|E]因此大幅抬升。"
 tv_engineering_department.7000.a:0 "把这份优势立刻用上。"
 tv_engineering_department.7001.t:0 "[tv_wonder_construction|E]：宏图重新合上地平"
 tv_engineering_department.7001.d:0 "新的测线证明地基还能承受更宽阔的展开。图纸上的野心终于找到可以落脚的土地，[tv_wonder_scale_competence|E]随之大幅提高。"
 tv_engineering_department.7001.a:0 "把这份优势立刻用上。"
 tv_engineering_department.7002.t:0 "[tv_wonder_construction|E]：名册与号令归位"
 tv_engineering_department.7002.d:0 "新名册挂上工棚后，工种、时辰和责任终于彼此对齐。混乱少了藏身处，[tv_wonder_organization_competence|E]大幅提高。"
 tv_engineering_department.7002.a:0 "把这份优势立刻用上。"
 tv_engineering_department.7003.t:0 "[tv_wonder_construction|E]：道路与车队合拍"
 tv_engineering_department.7003.d:0 "新路线把道路、水路、堆场与脚手架接成一口气。第一支车队准时得近乎尴尬，[tv_wonder_logistics_competence|E]猛然提高。"
 tv_engineering_department.7003.a:0 "把这份优势立刻用上。"
 tv_engineering_department.7004.t:0 "[tv_wonder_construction|E]：石层越过标线"
 tv_engineering_department.7004.d:0 "当前部件在天黑前越过标线。没有单一奇迹，只是吊具、榫口和手臂恰好在同一刻对上，[tv_wonder_construction|E]进度大幅推进。"
 tv_engineering_department.7004.a:0 "把这份优势立刻用上。"
 tv_engineering_department.7005.t:0 "[tv_wonder_construction|E]：民议稍向工地"
 tv_engineering_department.7005.d:0 "工地外的冷话少了一些，石料车通过时也少了几道阻拦。这不是举国欢呼，却足以让[tv_wonder_domestic_support|E]向前挪动。"
 tv_engineering_department.7005.a:0 "把这份优势立刻用上。"
 tv_engineering_department.7006.t:0 "[tv_wonder_construction|E]：尺规修正宏愿"
 tv_engineering_department.7006.d:0 "一处逼仄转角被改顺，主轴线也多出呼吸的余地。[tv_wonder_scale_competence|E]的改善并不炫目，却让宏图更可信。"
 tv_engineering_department.7006.a:0 "把这份优势立刻用上。"
 tv_engineering_department.7007.t:0 "[tv_wonder_construction|E]：工棚秩序理清"
 tv_engineering_department.7007.d:0 "几处总被漏掉的交接被补上，工具、夜班和守卫也有了清楚说法。[tv_wonder_organization_competence|E]因此改善。"
 tv_engineering_department.7007.a:0 "把这份优势立刻用上。"
 tv_engineering_department.7008.t:0 "[tv_wonder_construction|E]：车辙找到新路"
 tv_engineering_department.7008.d:0 "补给线上的坏转角被改掉。空等的车少了，摔裂的货少了，[tv_wonder_logistics_competence|E]也随之改善。"
 tv_engineering_department.7008.a:0 "把这份优势立刻用上。"
 tv_engineering_department.7009.t:0 "[tv_wonder_construction|E]：锤声推近完工"
 tv_engineering_department.7009.d:0 "拖延许久的接口终于合上，下一队工匠不用再等一个月。[tv_wonder_construction|E]进度以最令人安心的方式前进：看得见。"
 tv_engineering_department.7009.a:0 "把这份优势立刻用上。"
 tv_engineering_department.7010.t:0 "[tv_wonder_construction|E]：国库拨款，换民心归拢"
 tv_engineering_department.7010.d:0 "司库打开预备金箱，把原本留给军饷、赈济和宫廷修缮的硬币拨往工地。工程部门趁这阵并不体面的余裕，换来民众耐心、地方背书与可见的秩序。于是工程更像国家的共同事业，但空出的账格会被每个有眼睛的官员看见。这笔账说得通，却绝不会自己消失。"
 tv_engineering_department.7010.a:0 "动用国库，换取民心。"
 tv_engineering_department.7010.b:0 "让这个月安静过去。"
 tv_engineering_department.7011.t:0 "[tv_wonder_construction|E]：王命背书，换民心归拢"
 tv_engineering_department.7011.d:0 "宫廷把王命压在工程布告上，使反对者暂时不敢高声质问。工程部门趁这阵并不体面的余裕，换来民众耐心、地方背书与可见的秩序。于是工程更像国家的共同事业，但被当作脚手架使用的权威，很难原样收回。这笔账说得通，却绝不会自己消失。"
 tv_engineering_department.7011.a:0 "动用王命，换取民心。"
 tv_engineering_department.7011.b:0 "让这个月安静过去。"
 tv_engineering_department.7012.t:0 "[tv_wonder_construction|E]：扰动乡里，换民心归拢"
 tv_engineering_department.7012.d:0 "地方秩序被临时拨开，好让车队、工队和文书不用等待。工程部门趁这阵并不体面的余裕，换来民众耐心、地方背书与可见的秩序。于是工程更像国家的共同事业，但乡里会记住日常生活何时为远处的石头弯折。这笔账说得通，却绝不会自己消失。"
 tv_engineering_department.7012.a:0 "动用秩序，换取民心。"
 tv_engineering_department.7012.b:0 "让这个月安静过去。"
 tv_engineering_department.7013.t:0 "[tv_wonder_construction|E]：透支声名，换民心归拢"
 tv_engineering_department.7013.d:0 "宫廷把声名花在宣告、仪式和使工程显得必然的承诺上。工程部门趁这阵并不体面的余裕，换来民众耐心、地方背书与可见的秩序。于是工程更像国家的共同事业，但夸下的词句会在日后反过来要求结果。这笔账说得通，却绝不会自己消失。"
 tv_engineering_department.7013.a:0 "动用声望，换取民心。"
 tv_engineering_department.7013.b:0 "让这个月安静过去。"
 tv_engineering_department.7014.t:0 "[tv_wonder_construction|E]：借用贵族耐性，换民心归拢"
 tv_engineering_department.7014.d:0 "显贵们借出车马、佃户和名义，同时清楚表示这份耐性只是借款。工程部门趁这阵并不体面的余裕，换来民众耐心、地方背书与可见的秩序。于是工程更像国家的共同事业，但贵族宴席上的沉默会记住这次人情。这笔账说得通，却绝不会自己消失。"
 tv_engineering_department.7014.a:0 "动用贵族耐性，换取民心。"
 tv_engineering_department.7014.b:0 "让这个月安静过去。"
 tv_engineering_department.7015.t:0 "[tv_wonder_construction|E]：动用教士宽容，换民心归拢"
 tv_engineering_department.7015.d:0 "教士缩短仪式、借出地产或勉强祝福一项靠近祭坛的安排。工程部门趁这阵并不体面的余裕，换来民众耐心、地方背书与可见的秩序。于是工程更像国家的共同事业，但圣所旁的低语会问工程是否过于世俗。这笔账说得通，却绝不会自己消失。"
 tv_engineering_department.7015.a:0 "动用教士耐性，换取民心。"
 tv_engineering_department.7015.b:0 "让这个月安静过去。"
 tv_engineering_department.7016.t:0 "[tv_wonder_construction|E]：占用市民便利，换民心归拢"
 tv_engineering_department.7016.d:0 "商人把仓库、码头和信用再一次转向工地。工程部门趁这阵并不体面的余裕，换来民众耐心、地方背书与可见的秩序。于是工程更像国家的共同事业，但账房会把每一处不便逐笔记下。这笔账说得通，却绝不会自己消失。"
 tv_engineering_department.7016.a:0 "动用市集耐性，换取民心。"
 tv_engineering_department.7016.b:0 "让这个月安静过去。"
 tv_engineering_department.7017.t:0 "[tv_wonder_construction|E]：借走乡民余力，换民心归拢"
 tv_engineering_department.7017.d:0 "村社在临时承诺下交出更多车驾、人手和粮秣。工程部门趁这阵并不体面的余裕，换来民众耐心、地方背书与可见的秩序。于是工程更像国家的共同事业，但疲惫的田埂很清楚临时二字能拖多久。这笔账说得通，却绝不会自己消失。"
 tv_engineering_department.7017.a:0 "动用乡村耐性，换取民心。"
 tv_engineering_department.7017.b:0 "让这个月安静过去。"
 tv_engineering_department.7018.t:0 "[tv_wonder_construction|E]：拆用工址积累，换民心归拢"
 tv_engineering_department.7018.d:0 "当地街道、作坊和既有设施被切开，为奇观腾出空间。工程部门趁这阵并不体面的余裕，换来民众耐心、地方背书与可见的秩序。于是工程更像国家的共同事业，但工址更容易施工，是因为旧日的自己少了一块。这笔账说得通，却绝不会自己消失。"
 tv_engineering_department.7018.a:0 "动用工址，换取民心。"
 tv_engineering_department.7018.b:0 "让这个月安静过去。"
 tv_engineering_department.7019.t:0 "[tv_wonder_construction|E]：抽走工址生意，换民心归拢"
 tv_engineering_department.7019.d:0 "当地客栈、作坊和交易被转向工地这个巨口。工程部门趁这阵并不体面的余裕，换来民众耐心、地方背书与可见的秩序。于是工程更像国家的共同事业，但围栏外的街声低了下去。这笔账说得通，却绝不会自己消失。"
 tv_engineering_department.7019.a:0 "动用本地繁荣，换取民心。"
 tv_engineering_department.7019.b:0 "让这个月安静过去。"
 tv_engineering_department.7020.t:0 "[tv_wonder_construction|E]：挪用首都积累，换民心归拢"
 tv_engineering_department.7020.d:0 "首都修缮与扩建被推迟，熟练工和材料转投奇观。工程部门趁这阵并不体面的余裕，换来民众耐心、地方背书与可见的秩序。于是工程更像国家的共同事业，但首都会记住哪些承诺被延后。这笔账说得通，却绝不会自己消失。"
 tv_engineering_department.7020.a:0 "动用首都工程，换取民心。"
 tv_engineering_department.7020.b:0 "让这个月安静过去。"
 tv_engineering_department.7021.t:0 "[tv_wonder_construction|E]：借首都商气，换民心归拢"
 tv_engineering_department.7021.d:0 "王城市场、信用和仓储被拉向工地。工程部门趁这阵并不体面的余裕，换来民众耐心、地方背书与可见的秩序。于是工程更像国家的共同事业，但首都街道为远处石头低声下来。这笔账说得通，却绝不会自己消失。"
 tv_engineering_department.7021.a:0 "动用首都商气，换取民心。"
 tv_engineering_department.7021.b:0 "让这个月安静过去。"
 tv_engineering_department.7022.t:0 "[tv_wonder_construction|E]：压上劳工筋骨，换民心归拢"
 tv_engineering_department.7022.d:0 "劳工被要求把班次、休息和安全余量拉到舒适之外。工程部门趁这阵并不体面的余裕，换来民众耐心、地方背书与可见的秩序。于是工程更像国家的共同事业，但疲惫身体记账比书记更严。这笔账说得通，却绝不会自己消失。"
 tv_engineering_department.7022.a:0 "动用劳工，换取民心。"
 tv_engineering_department.7022.b:0 "让这个月安静过去。"
 tv_engineering_department.7023.t:0 "[tv_wonder_construction|E]：国库拨款，换宏图舒展"
 tv_engineering_department.7023.d:0 "司库打开预备金箱，把原本留给军饷、赈济和宫廷修缮的硬币拨往工地。工程部门趁这阵并不体面的余裕，换来更宽的基址、更多测量日和结构余量。于是奇观的尺度不再像硬撑出来的狂想，但空出的账格会被每个有眼睛的官员看见。这笔账说得通，却绝不会自己消失。"
 tv_engineering_department.7023.a:0 "动用国库，换取尺度。"
 tv_engineering_department.7023.b:0 "让这个月安静过去。"
