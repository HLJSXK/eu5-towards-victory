 tv_engineering_department.7065.d:0 "宫廷把声名花在宣告、仪式和使工程显得必然的承诺上。工程部门趁这阵并不体面的余裕，换来额外人手、更长班次和足以立刻推进的材料。于是未完成的石头实实在在地接近完工，但夸下的词句会在日后反过来要求结果。这笔账说得通，却绝不会自己消失。"
