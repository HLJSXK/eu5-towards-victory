 tv_engineering_department.7069.d:0 "村社在临时承诺下交出更多车驾、人手和粮秣。工程部门趁这阵并不体面的余裕，换来额外人手、更长班次和足以立刻推进的材料。于是未完成的石头实实在在地接近完工，但疲惫的田埂很清楚临时二字能拖多久。这笔账说得通，却绝不会自己消失。"
