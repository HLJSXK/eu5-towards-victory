 tv_engineering_department.7000.t:0 "[tv_wonder_construction|E]：街巷为工地喝彩"
 tv_engineering_department.7000.d:0 "布告还没贴满，工地外的茶肆已经先把这项工程说成国家的荣光。行会愿意多派熟手，乡绅愿意少问几句账目，连原本只看热闹的人也开始替石料车让路。[tv_wonder_domestic_support|E]被一车车可见的秩序推高，奇观第一次像是属于围栏外的所有人。"
 tv_engineering_department.7000.a:0 "让这股拥护顺势灌入工地。"
 tv_engineering_department.7001.t:0 "[tv_wonder_construction|E]：宏图重新合上地平"
 tv_engineering_department.7001.d:0 "测量队在晨雾中重拉基线，发现原本被视为边界的坡地其实能承受更宏大的展开。新图纸把道路、台阶和主轴连成一口气，[tv_wonder_scale_competence|E]骤然提高。这不是把奇观画大那么简单，而是让大变得可信。"
 tv_engineering_department.7001.a:0 "让扩展后的图纸立刻盖印。"
 tv_engineering_department.7002.t:0 "[tv_wonder_construction|E]：名册与号令归位"
 tv_engineering_department.7002.d:0 "一夜之间，工棚门口的旧名册被换成按工种、时辰和责任划开的新册。石匠不再等木匠让路，书记也终于知道每一车灰浆该算在哪一段。[tv_wonder_organization_competence|E]的跃升像一道不显眼的梁，把原本松散的工地托了起来。"
 tv_engineering_department.7002.a:0 "把新名册分发到每座工棚。"
 tv_engineering_department.7003.t:0 "[tv_wonder_construction|E]：道路与车队合拍"
 tv_engineering_department.7003.d:0 "雨停之后，斥候在旧路旁找到一条能避开泥沼的高地车道。临时桥板、驿站和堆料点被迅速串联起来，[tv_wonder_logistics_competence|E]猛然提高。工地第一次听见车轮声像一支守时的队伍，而不是一串借口。"
 tv_engineering_department.7003.a:0 "把新运道纳入正式线路。"
 tv_engineering_department.7004.t:0 "[tv_wonder_construction|E]：石层越过标线"
 tv_engineering_department.7004.d:0 "天色尚早，工头就在标线旁发现今日的石层已经超过预定高度。临时调整的脚手架没有塌，吊具也没有误时，[tv_wonder_construction|E]进度因此大幅推进。在奇观工地上，这样的日子少得足以让人不敢高声庆祝。"
 tv_engineering_department.7004.a:0 "让下一层石块紧跟上去。"
 tv_engineering_department.7005.t:0 "[tv_wonder_construction|E]：民议稍向工地"
 tv_engineering_department.7005.d:0 "几名原本皱眉的地方头面人物愿意在名册上添下姓名，市场里的抱怨也少了些锋芒。这不是举国欢呼，却足以让工地少听见几句冷话。[tv_wonder_domestic_support|E]向前挪了一步，而大型工程有时正需要这样的半步。"
 tv_engineering_department.7005.a:0 "把新得的耐心登记下来。"
 tv_engineering_department.7006.t:0 "[tv_wonder_construction|E]：尺规修正宏愿"
 tv_engineering_department.7006.d:0 "一处尴尬的转角被重新丈量，几段过紧的通道也被移到更顺手的位置。[tv_wonder_scale_competence|E]因此得到改善，宏图少了一些勉强，多了一些能落在土地上的重量。工地没有欢呼，只是许多人同时点了点头。"
 tv_engineering_department.7006.a:0 "按新的尺规修订工程图。"
 tv_engineering_department.7007.t:0 "[tv_wonder_construction|E]：工棚秩序理清"
 tv_engineering_department.7007.d:0 "几个总被遗漏的小组被重新纳入排班，工具领取和夜间守卫也有了清楚的交接。[tv_wonder_organization_competence|E]因此改善。它不会让石头自己升起，却能让抬石头的人少走冤枉路。"
 tv_engineering_department.7007.a:0 "让工头们照此排班。"
 tv_engineering_department.7008.t:0 "[tv_wonder_construction|E]：车辙找到新路"
 tv_engineering_department.7008.d:0 "一段绕远的石料路线被改短，码头到仓棚之间也添了更清楚的交接。[tv_wonder_logistics_competence|E]因此改善。少几次空等，少几车翻覆，奇观就多一点像会准时到来的东西。"
 tv_engineering_department.7008.a:0 "让车队按这条路试行。"
 tv_engineering_department.7009.t:0 "[tv_wonder_construction|E]：锤声推近完工"
 tv_engineering_department.7009.d:0 "一处拖延许久的榫口终于合上，后续工段得以接上锤声。[tv_wonder_construction|E]进度向前推进了一截。它不是传奇，只是许多手臂在同一刻终于没有互相等待。"
 tv_engineering_department.7009.a:0 "把这段进展钉进日程。"
 tv_engineering_department.7010.t:0 "[tv_wonder_construction|E]：国库拨款，换民心归拢"
 tv_engineering_department.7010.d:0 "司库打开预备金箱，把原本留给军饷、赈济和宫廷修缮的硬币拨往工地。工程部门趁这阵并不体面的余裕，把民众的耐心和乡绅的背书推进到图纸和工棚之间。街巷开始把工程称作国家的体面，但空出的账格会被每个有眼睛的官员看见。这不是没有代价的聪明，只是把代价放到了当下最容易被承受的位置。"
 tv_engineering_department.7010.a:0 "打开国库暗格，换来民心上的余裕。"
 tv_engineering_department.7010.b:0 "把国库铁锁重新扣上，让民心慢慢积累。"
 tv_engineering_department.7011.t:0 "[tv_wonder_construction|E]：王命背书，换民心归拢"
 tv_engineering_department.7011.d:0 "宫廷愿意把君主的名义压在工程布告上，让反对者暂时不敢把抱怨说得太响。工程部门趁这阵并不体面的余裕，把民众的耐心和乡绅的背书推进到图纸和工棚之间。街巷开始把工程称作国家的体面，但被动用的威仪很难完全收回。这不是没有代价的聪明，只是把代价放到了当下最容易被承受的位置。"
 tv_engineering_department.7011.a:0 "以王命为工程背书，换来民心上的余裕。"
 tv_engineering_department.7011.b:0 "别让王命替工棚担保，让民心慢慢积累。"
 tv_engineering_department.7012.t:0 "[tv_wonder_construction|E]：扰动乡里，换民心归拢"
 tv_engineering_department.7012.d:0 "地方官同意加快征调人手和车辆，让原本安静的乡里为工程让出道路。工程部门趁这阵并不体面的余裕，把民众的耐心和乡绅的背书推进到图纸和工棚之间。街巷开始把工程称作国家的体面，但被惊动的日常秩序不会立刻恢复原状。这不是没有代价的聪明，只是把代价放到了当下最容易被承受的位置。"
 tv_engineering_department.7012.a:0 "让地方秩序为工程让路，换来民心上的余裕。"
 tv_engineering_department.7012.b:0 "不要再惊动乡里，让民心慢慢积累。"
 tv_engineering_department.7013.t:0 "[tv_wonder_construction|E]：透支声名，换民心归拢"
 tv_engineering_department.7013.d:0 "宫廷愿意把已经积累的声名借给工地，用典礼、宣告和夸饰遮住几处现实缺口。工程部门趁这阵并不体面的余裕，把民众的耐心和乡绅的背书推进到图纸和工棚之间。街巷开始把工程称作国家的体面，但夸下的词句会反过来要求结果。这不是没有代价的聪明，只是把代价放到了当下最容易被承受的位置。"
 tv_engineering_department.7013.a:0 "拿宫廷声名替工程开路，换来民心上的余裕。"
 tv_engineering_department.7013.b:0 "别把声望再押上去，让民心慢慢积累。"
 tv_engineering_department.7014.t:0 "[tv_wonder_construction|E]：借用贵族耐性，换民心归拢"
 tv_engineering_department.7014.d:0 "数家显贵同意把车马、佃户和名义借给工地，只是他们的微笑比契约更薄。工程部门趁这阵并不体面的余裕，把民众的耐心和乡绅的背书推进到图纸和工棚之间。街巷开始把工程称作国家的体面，但宴席上的沉默会记住这次让步。这不是没有代价的聪明，只是把代价放到了当下最容易被承受的位置。"
 tv_engineering_department.7014.a:0 "借贵族的车马与面子，换来民心上的余裕。"
 tv_engineering_department.7014.b:0 "别再试探贵族耐性，让民心慢慢积累。"
 tv_engineering_department.7015.t:0 "[tv_wonder_construction|E]：动用教士宽容，换民心归拢"
 tv_engineering_department.7015.d:0 "教士们同意缩短若干仪式、让出若干地产便利和祝祷时辰，好让工程赶上安排。工程部门趁这阵并不体面的余裕，把民众的耐心和乡绅的背书推进到图纸和工棚之间。街巷开始把工程称作国家的体面，但祭坛旁的低语会问这一切是否过于世俗。这不是没有代价的聪明，只是把代价放到了当下最容易被承受的位置。"
 tv_engineering_department.7015.a:0 "请教士为工地让出时辰，换来民心上的余裕。"
 tv_engineering_department.7015.b:0 "别让祭坛继续让步，让民心慢慢积累。"
 tv_engineering_department.7016.t:0 "[tv_wonder_construction|E]：占用市民便利，换民心归拢"
 tv_engineering_department.7016.d:0 "城镇商人同意让仓库、码头和信用暂时偏向工地，哪怕市场因此少了几分顺滑。工程部门趁这阵并不体面的余裕，把民众的耐心和乡绅的背书推进到图纸和工棚之间。街巷开始把工程称作国家的体面，但账房会把这份不便逐笔记下。这不是没有代价的聪明，只是把代价放到了当下最容易被承受的位置。"
 tv_engineering_department.7016.a:0 "让商街替工地周转，换来民心上的余裕。"
 tv_engineering_department.7016.b:0 "别再挤压商街，让民心慢慢积累。"
 tv_engineering_department.7017.t:0 "[tv_wonder_construction|E]：借走乡民余力，换民心归拢"
 tv_engineering_department.7017.d:0 "乡村被要求多出劳役、车驾和粮秣，地方官保证这只是临时安排。工程部门趁这阵并不体面的余裕，把民众的耐心和乡绅的背书推进到图纸和工棚之间。街巷开始把工程称作国家的体面，但田埂上的疲惫不会因为文书写着临时就消失。这不是没有代价的聪明，只是把代价放到了当下最容易被承受的位置。"
 tv_engineering_department.7017.a:0 "让村社再撑一程，换来民心上的余裕。"
 tv_engineering_department.7017.b:0 "别再抽走乡民余力，让民心慢慢积累。"
 tv_engineering_department.7018.t:0 "[tv_wonder_construction|E]：拆用工址积累，换民心归拢"
 tv_engineering_department.7018.d:0 "建设地点周边的既有设施被拆改、征用和改道，好给奇观腾出更顺手的空间。工程部门趁这阵并不体面的余裕，把民众的耐心和乡绅的背书推进到图纸和工棚之间。街巷开始把工程称作国家的体面，但当地原本积累的便利会留下缺口。这不是没有代价的聪明，只是把代价放到了当下最容易被承受的位置。"
 tv_engineering_department.7018.a:0 "拆改工址既有设施，换来民心上的余裕。"
 tv_engineering_department.7018.b:0 "别再拆用工址街区，让民心慢慢积累。"
 tv_engineering_department.7019.t:0 "[tv_wonder_construction|E]：抽走工址生意，换民心归拢"
 tv_engineering_department.7019.d:0 "当地的客栈、作坊和集市被要求优先服务工地，原本流动的生意被引向同一个巨口。工程部门趁这阵并不体面的余裕，把民众的耐心和乡绅的背书推进到图纸和工棚之间。街巷开始把工程称作国家的体面，但被抽走的市声不会立刻回到街角。这不是没有代价的聪明，只是把代价放到了当下最容易被承受的位置。"
 tv_engineering_department.7019.a:0 "把当地生意转向工地，换来民心上的余裕。"
 tv_engineering_department.7019.b:0 "让工址生意喘口气，让民心慢慢积累。"
 tv_engineering_department.7020.t:0 "[tv_wonder_construction|E]：挪用首都积累，换民心归拢"
 tv_engineering_department.7020.d:0 "首都几项原定修缮和扩建被暂缓，熟练工匠与材料转而支援奇观。工程部门趁这阵并不体面的余裕，把民众的耐心和乡绅的背书推进到图纸和工棚之间。街巷开始把工程称作国家的体面，但宫城与街区会记住被推迟的承诺。这不是没有代价的聪明，只是把代价放到了当下最容易被承受的位置。"
 tv_engineering_department.7020.a:0 "让首都工程暂且让路，换来民心上的余裕。"
 tv_engineering_department.7020.b:0 "别再挪走首都积累，让民心慢慢积累。"
 tv_engineering_department.7021.t:0 "[tv_wonder_construction|E]：借首都商气，换民心归拢"
 tv_engineering_department.7021.d:0 "首都市场的信用、仓储和人流被工程吸走一部分，最繁华的街道也为远处的石头腾出余裕。工程部门趁这阵并不体面的余裕，把民众的耐心和乡绅的背书推进到图纸和工棚之间。街巷开始把工程称作国家的体面，但王城市声会短暂低下去。这不是没有代价的聪明，只是把代价放到了当下最容易被承受的位置。"
 tv_engineering_department.7021.a:0 "把首都商气引向工地，换来民心上的余裕。"
 tv_engineering_department.7021.b:0 "别再抽走王城市声，让民心慢慢积累。"
 tv_engineering_department.7022.t:0 "[tv_wonder_construction|E]：压上劳工筋骨，换民心归拢"
 tv_engineering_department.7022.d:0 "工头要求劳工延长班次，把休息、替换和安全余量一并压缩到最窄。工程部门趁这阵并不体面的余裕，把民众的耐心和乡绅的背书推进到图纸和工棚之间。街巷开始把工程称作国家的体面，但疲惫的身体会把代价记得比账册更准。这不是没有代价的聪明，只是把代价放到了当下最容易被承受的位置。"
 tv_engineering_department.7022.a:0 "让劳工再撑一轮，换来民心上的余裕。"
 tv_engineering_department.7022.b:0 "别再压榨劳工筋骨，让民心慢慢积累。"
 tv_engineering_department.7023.t:0 "[tv_wonder_construction|E]：国库拨款，换宏图舒展"
 tv_engineering_department.7023.d:0 "司库打开预备金箱，把原本留给军饷、赈济和宫廷修缮的硬币拨往工地。工程部门趁这阵并不体面的余裕，把更宽的基址、更多的测量日和更大胆的结构余量推进到图纸和工棚之间。图纸上的庞大轮廓不再显得像狂想，但空出的账格会被每个有眼睛的官员看见。这不是没有代价的聪明，只是把代价放到了当下最容易被承受的位置。"
 tv_engineering_department.7023.a:0 "打开国库暗格，换来尺度上的余裕。"
 tv_engineering_department.7023.b:0 "把国库铁锁重新扣上，让尺度慢慢积累。"
 tv_engineering_department.7024.t:0 "[tv_wonder_construction|E]：王命背书，换宏图舒展"
 tv_engineering_department.7024.d:0 "宫廷愿意把君主的名义压在工程布告上，让反对者暂时不敢把抱怨说得太响。工程部门趁这阵并不体面的余裕，把更宽的基址、更多的测量日和更大胆的结构余量推进到图纸和工棚之间。图纸上的庞大轮廓不再显得像狂想，但被动用的威仪很难完全收回。这不是没有代价的聪明，只是把代价放到了当下最容易被承受的位置。"
 tv_engineering_department.7024.a:0 "以王命为工程背书，换来尺度上的余裕。"
 tv_engineering_department.7024.b:0 "别让王命替工棚担保，让尺度慢慢积累。"
 tv_engineering_department.7025.t:0 "[tv_wonder_construction|E]：扰动乡里，换宏图舒展"
 tv_engineering_department.7025.d:0 "地方官同意加快征调人手和车辆，让原本安静的乡里为工程让出道路。工程部门趁这阵并不体面的余裕，把更宽的基址、更多的测量日和更大胆的结构余量推进到图纸和工棚之间。图纸上的庞大轮廓不再显得像狂想，但被惊动的日常秩序不会立刻恢复原状。这不是没有代价的聪明，只是把代价放到了当下最容易被承受的位置。"
 tv_engineering_department.7025.a:0 "让地方秩序为工程让路，换来尺度上的余裕。"
 tv_engineering_department.7025.b:0 "不要再惊动乡里，让尺度慢慢积累。"
 tv_engineering_department.7026.t:0 "[tv_wonder_construction|E]：透支声名，换宏图舒展"
 tv_engineering_department.7026.d:0 "宫廷愿意把已经积累的声名借给工地，用典礼、宣告和夸饰遮住几处现实缺口。工程部门趁这阵并不体面的余裕，把更宽的基址、更多的测量日和更大胆的结构余量推进到图纸和工棚之间。图纸上的庞大轮廓不再显得像狂想，但夸下的词句会反过来要求结果。这不是没有代价的聪明，只是把代价放到了当下最容易被承受的位置。"
 tv_engineering_department.7026.a:0 "拿宫廷声名替工程开路，换来尺度上的余裕。"
 tv_engineering_department.7026.b:0 "别把声望再押上去，让尺度慢慢积累。"
 tv_engineering_department.7027.t:0 "[tv_wonder_construction|E]：借用贵族耐性，换宏图舒展"
 tv_engineering_department.7027.d:0 "数家显贵同意把车马、佃户和名义借给工地，只是他们的微笑比契约更薄。工程部门趁这阵并不体面的余裕，把更宽的基址、更多的测量日和更大胆的结构余量推进到图纸和工棚之间。图纸上的庞大轮廓不再显得像狂想，但宴席上的沉默会记住这次让步。这不是没有代价的聪明，只是把代价放到了当下最容易被承受的位置。"
 tv_engineering_department.7027.a:0 "借贵族的车马与面子，换来尺度上的余裕。"
 tv_engineering_department.7027.b:0 "别再试探贵族耐性，让尺度慢慢积累。"
 tv_engineering_department.7028.t:0 "[tv_wonder_construction|E]：动用教士宽容，换宏图舒展"
 tv_engineering_department.7028.d:0 "教士们同意缩短若干仪式、让出若干地产便利和祝祷时辰，好让工程赶上安排。工程部门趁这阵并不体面的余裕，把更宽的基址、更多的测量日和更大胆的结构余量推进到图纸和工棚之间。图纸上的庞大轮廓不再显得像狂想，但祭坛旁的低语会问这一切是否过于世俗。这不是没有代价的聪明，只是把代价放到了当下最容易被承受的位置。"
 tv_engineering_department.7028.a:0 "请教士为工地让出时辰，换来尺度上的余裕。"
 tv_engineering_department.7028.b:0 "别让祭坛继续让步，让尺度慢慢积累。"
 tv_engineering_department.7029.t:0 "[tv_wonder_construction|E]：占用市民便利，换宏图舒展"
 tv_engineering_department.7029.d:0 "城镇商人同意让仓库、码头和信用暂时偏向工地，哪怕市场因此少了几分顺滑。工程部门趁这阵并不体面的余裕，把更宽的基址、更多的测量日和更大胆的结构余量推进到图纸和工棚之间。图纸上的庞大轮廓不再显得像狂想，但账房会把这份不便逐笔记下。这不是没有代价的聪明，只是把代价放到了当下最容易被承受的位置。"
 tv_engineering_department.7029.a:0 "让商街替工地周转，换来尺度上的余裕。"
 tv_engineering_department.7029.b:0 "别再挤压商街，让尺度慢慢积累。"
 tv_engineering_department.7030.t:0 "[tv_wonder_construction|E]：借走乡民余力，换宏图舒展"
 tv_engineering_department.7030.d:0 "乡村被要求多出劳役、车驾和粮秣，地方官保证这只是临时安排。工程部门趁这阵并不体面的余裕，把更宽的基址、更多的测量日和更大胆的结构余量推进到图纸和工棚之间。图纸上的庞大轮廓不再显得像狂想，但田埂上的疲惫不会因为文书写着临时就消失。这不是没有代价的聪明，只是把代价放到了当下最容易被承受的位置。"
 tv_engineering_department.7030.a:0 "让村社再撑一程，换来尺度上的余裕。"
 tv_engineering_department.7030.b:0 "别再抽走乡民余力，让尺度慢慢积累。"
 tv_engineering_department.7031.t:0 "[tv_wonder_construction|E]：拆用工址积累，换宏图舒展"
 tv_engineering_department.7031.d:0 "建设地点周边的既有设施被拆改、征用和改道，好给奇观腾出更顺手的空间。工程部门趁这阵并不体面的余裕，把更宽的基址、更多的测量日和更大胆的结构余量推进到图纸和工棚之间。图纸上的庞大轮廓不再显得像狂想，但当地原本积累的便利会留下缺口。这不是没有代价的聪明，只是把代价放到了当下最容易被承受的位置。"
 tv_engineering_department.7031.a:0 "拆改工址既有设施，换来尺度上的余裕。"
 tv_engineering_department.7031.b:0 "别再拆用工址街区，让尺度慢慢积累。"
 tv_engineering_department.7032.t:0 "[tv_wonder_construction|E]：抽走工址生意，换宏图舒展"
 tv_engineering_department.7032.d:0 "当地的客栈、作坊和集市被要求优先服务工地，原本流动的生意被引向同一个巨口。工程部门趁这阵并不体面的余裕，把更宽的基址、更多的测量日和更大胆的结构余量推进到图纸和工棚之间。图纸上的庞大轮廓不再显得像狂想，但被抽走的市声不会立刻回到街角。这不是没有代价的聪明，只是把代价放到了当下最容易被承受的位置。"
 tv_engineering_department.7032.a:0 "把当地生意转向工地，换来尺度上的余裕。"
 tv_engineering_department.7032.b:0 "让工址生意喘口气，让尺度慢慢积累。"
 tv_engineering_department.7033.t:0 "[tv_wonder_construction|E]：挪用首都积累，换宏图舒展"
 tv_engineering_department.7033.d:0 "首都几项原定修缮和扩建被暂缓，熟练工匠与材料转而支援奇观。工程部门趁这阵并不体面的余裕，把更宽的基址、更多的测量日和更大胆的结构余量推进到图纸和工棚之间。图纸上的庞大轮廓不再显得像狂想，但宫城与街区会记住被推迟的承诺。这不是没有代价的聪明，只是把代价放到了当下最容易被承受的位置。"
 tv_engineering_department.7033.a:0 "让首都工程暂且让路，换来尺度上的余裕。"
 tv_engineering_department.7033.b:0 "别再挪走首都积累，让尺度慢慢积累。"
 tv_engineering_department.7034.t:0 "[tv_wonder_construction|E]：借首都商气，换宏图舒展"
 tv_engineering_department.7034.d:0 "首都市场的信用、仓储和人流被工程吸走一部分，最繁华的街道也为远处的石头腾出余裕。工程部门趁这阵并不体面的余裕，把更宽的基址、更多的测量日和更大胆的结构余量推进到图纸和工棚之间。图纸上的庞大轮廓不再显得像狂想，但王城市声会短暂低下去。这不是没有代价的聪明，只是把代价放到了当下最容易被承受的位置。"
 tv_engineering_department.7034.a:0 "把首都商气引向工地，换来尺度上的余裕。"
 tv_engineering_department.7034.b:0 "别再抽走王城市声，让尺度慢慢积累。"
 tv_engineering_department.7035.t:0 "[tv_wonder_construction|E]：压上劳工筋骨，换宏图舒展"
 tv_engineering_department.7035.d:0 "工头要求劳工延长班次，把休息、替换和安全余量一并压缩到最窄。工程部门趁这阵并不体面的余裕，把更宽的基址、更多的测量日和更大胆的结构余量推进到图纸和工棚之间。图纸上的庞大轮廓不再显得像狂想，但疲惫的身体会把代价记得比账册更准。这不是没有代价的聪明，只是把代价放到了当下最容易被承受的位置。"
 tv_engineering_department.7035.a:0 "让劳工再撑一轮，换来尺度上的余裕。"
 tv_engineering_department.7035.b:0 "别再压榨劳工筋骨，让尺度慢慢积累。"
 tv_engineering_department.7036.t:0 "[tv_wonder_construction|E]：国库拨款，换号令整肃"
 tv_engineering_department.7036.d:0 "司库打开预备金箱，把原本留给军饷、赈济和宫廷修缮的硬币拨往工地。工程部门趁这阵并不体面的余裕，把更清楚的名册、轮班和责任界线推进到图纸和工棚之间。工棚里的命令终于能按同一种节拍传下去，但空出的账格会被每个有眼睛的官员看见。这不是没有代价的聪明，只是把代价放到了当下最容易被承受的位置。"
