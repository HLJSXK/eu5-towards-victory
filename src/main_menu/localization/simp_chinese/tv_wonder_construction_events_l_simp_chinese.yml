 tv_engineering_department.7075.t:0 "[tv_wonder_construction|E]：脚手架旁的人心摇摆"
 tv_engineering_department.7075.d:0 "工地前的公开展示引来人群，也引来判断。脚手架旁的每一句惊叹都可能变成支持，每一句讥笑也可能伤到[tv_wonder_domestic_support|E]。"
 tv_engineering_department.7075.a:0 "让工地给出答案。"
 tv_engineering_department.7076.t:0 "[tv_wonder_construction|E]：尺度在图纸边缘摇晃"
 tv_engineering_department.7076.d:0 "一项大胆调整把图纸推过旧边界。它可能成就宏伟，也可能成为书记日后用红笔圈出的教训。"
 tv_engineering_department.7076.a:0 "让工地给出答案。"
 tv_engineering_department.7077.t:0 "[tv_wonder_construction|E]：号令在雨棚下改口"
 tv_engineering_department.7077.d:0 "新的号令链在棚下强行推开。它可能让工地守纪律，也可能只是教会每个工头新的争吵方式。"
 tv_engineering_department.7077.a:0 "让工地给出答案。"
 tv_engineering_department.7078.t:0 "[tv_wonder_construction|E]：运道在泥水间改线"
 tv_engineering_department.7078.d:0 "一条险路有望缩短运线。天气若配合，它就是远见；天气若翻脸，所有人都会记得是谁下的令。"
 tv_engineering_department.7078.a:0 "让工地给出答案。"
 tv_engineering_department.7079.t:0 "[tv_wonder_construction|E]：新工法悬在半空"
 tv_engineering_department.7079.d:0 "更快的方法被用在当前部件上。它可能救下这个月，也可能让下一班工匠修补一个漂亮错误。"
 tv_engineering_department.7079.a:0 "让工地给出答案。"
