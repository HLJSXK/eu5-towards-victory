 tv_engineering_department.7069.d:0 "乡村被要求多出劳役、车驾和粮秣，地方官保证这只是临时安排。工程部门趁这阵并不体面的余裕，把当前部件上更密集的工序、更长的白昼和更少的等待推进到图纸和工棚之间。未完成的部件越过了昨日谁也不敢保证的标线，但田埂上的疲惫不会因为文书写着临时就消失。这不是没有代价的聪明，只是把代价放到了当下最容易被承受的位置。"
 tv_engineering_department.7069.a:0 "让村社再撑一程，换来工段上的余裕。"
 tv_engineering_department.7069.b:0 "别再抽走乡民余力，让工段慢慢积累。"
 tv_engineering_department.7070.t:0 "[tv_wonder_construction|E]：拆用工址积累，换工程突进"
 tv_engineering_department.7070.d:0 "建设地点周边的既有设施被拆改、征用和改道，好给奇观腾出更顺手的空间。工程部门趁这阵并不体面的余裕，把当前部件上更密集的工序、更长的白昼和更少的等待推进到图纸和工棚之间。未完成的部件越过了昨日谁也不敢保证的标线，但当地原本积累的便利会留下缺口。这不是没有代价的聪明，只是把代价放到了当下最容易被承受的位置。"
 tv_engineering_department.7070.a:0 "拆改工址既有设施，换来工段上的余裕。"
 tv_engineering_department.7070.b:0 "别再拆用工址街区，让工段慢慢积累。"
 tv_engineering_department.7071.t:0 "[tv_wonder_construction|E]：抽走工址生意，换工程突进"
 tv_engineering_department.7071.d:0 "当地的客栈、作坊和集市被要求优先服务工地，原本流动的生意被引向同一个巨口。工程部门趁这阵并不体面的余裕，把当前部件上更密集的工序、更长的白昼和更少的等待推进到图纸和工棚之间。未完成的部件越过了昨日谁也不敢保证的标线，但被抽走的市声不会立刻回到街角。这不是没有代价的聪明，只是把代价放到了当下最容易被承受的位置。"
 tv_engineering_department.7071.a:0 "把当地生意转向工地，换来工段上的余裕。"
 tv_engineering_department.7071.b:0 "让工址生意喘口气，让工段慢慢积累。"
 tv_engineering_department.7072.t:0 "[tv_wonder_construction|E]：挪用首都积累，换工程突进"
 tv_engineering_department.7072.d:0 "首都几项原定修缮和扩建被暂缓，熟练工匠与材料转而支援奇观。工程部门趁这阵并不体面的余裕，把当前部件上更密集的工序、更长的白昼和更少的等待推进到图纸和工棚之间。未完成的部件越过了昨日谁也不敢保证的标线，但宫城与街区会记住被推迟的承诺。这不是没有代价的聪明，只是把代价放到了当下最容易被承受的位置。"
 tv_engineering_department.7072.a:0 "让首都工程暂且让路，换来工段上的余裕。"
 tv_engineering_department.7072.b:0 "别再挪走首都积累，让工段慢慢积累。"
 tv_engineering_department.7073.t:0 "[tv_wonder_construction|E]：借首都商气，换工程突进"
 tv_engineering_department.7073.d:0 "首都市场的信用、仓储和人流被工程吸走一部分，最繁华的街道也为远处的石头腾出余裕。工程部门趁这阵并不体面的余裕，把当前部件上更密集的工序、更长的白昼和更少的等待推进到图纸和工棚之间。未完成的部件越过了昨日谁也不敢保证的标线，但王城市声会短暂低下去。这不是没有代价的聪明，只是把代价放到了当下最容易被承受的位置。"
 tv_engineering_department.7073.a:0 "把首都商气引向工地，换来工段上的余裕。"
 tv_engineering_department.7073.b:0 "别再抽走王城市声，让工段慢慢积累。"
 tv_engineering_department.7074.t:0 "[tv_wonder_construction|E]：压上劳工筋骨，换工程突进"
 tv_engineering_department.7074.d:0 "工头要求劳工延长班次，把休息、替换和安全余量一并压缩到最窄。工程部门趁这阵并不体面的余裕，把当前部件上更密集的工序、更长的白昼和更少的等待推进到图纸和工棚之间。未完成的部件越过了昨日谁也不敢保证的标线，但疲惫的身体会把代价记得比账册更准。这不是没有代价的聪明，只是把代价放到了当下最容易被承受的位置。"
 tv_engineering_department.7074.a:0 "让劳工再撑一轮，换来工段上的余裕。"
 tv_engineering_department.7074.b:0 "别再压榨劳工筋骨，让工段慢慢积累。"
 tv_engineering_department.7075.t:0 "[tv_wonder_construction|E]：脚手架旁的人心摇摆"
 tv_engineering_department.7075.d:0 "一次仓促安排的开放参观把工地推到众人眼前。有人看见秩序，有人只看见泥水和征发；同一排脚手架在不同嘴里变成荣光或浪费。[tv_wonder_domestic_support|E]会向哪边倾斜，要等街巷把今日见闻嚼碎之后才知道。"
 tv_engineering_department.7075.a:0 "让民议在工棚外自行落定。"
 tv_engineering_department.7076.t:0 "[tv_wonder_construction|E]：尺度在图纸边缘摇晃"
 tv_engineering_department.7076.d:0 "匠师们提出要放宽某段布局，以免未来的主殿显得局促。若判断正确，[tv_wonder_scale_competence|E]会因此受益；若判断错误，更多空地只会让未完成的部分显得更刺眼。每一寸扩张都在询问国家到底想留下多大的影子。"
 tv_engineering_department.7076.a:0 "让测量绳再向外拉一次。"
 tv_engineering_department.7077.t:0 "[tv_wonder_construction|E]：号令在雨棚下改口"
 tv_engineering_department.7077.d:0 "为了赶上某个关键节点，工头们临时打乱了原有排班。如果新顺序成立，[tv_wonder_organization_competence|E]会有所提高；如果它只是纸上秩序，工棚明早就会被互相寻找的人塞满。命令发出时总显得简单，执行时才显出牙齿。"
 tv_engineering_department.7077.a:0 "让这套临时号令跑满一日。"
 tv_engineering_department.7078.t:0 "[tv_wonder_construction|E]：运道在泥水间改线"
 tv_engineering_department.7078.d:0 "车队主管建议改走一条更短却更难维护的线路。若路基撑得住，[tv_wonder_logistics_competence|E]会因此上涨；若撑不住，省下的时辰会被泥水连本带利讨回。每一道车辙都像在替工程投票。"
 tv_engineering_department.7078.a:0 "让货车跟着新标桩走。"
 tv_engineering_department.7079.t:0 "[tv_wonder_construction|E]：新工法悬在半空"
 tv_engineering_department.7079.d:0 "匠师建议用一套更快的搭接办法处理当前部件。若它成功，[tv_wonder_construction|E]进度会明显受益；若它失败，返工会把节省的时间吞回去。未完成的石面沉默地等着这次判断。"
 tv_engineering_department.7079.a:0 "让新工法在当前部件上试一次。"
 tv_engineering_department.7080.t:0 "[tv_wonder_construction|E]：民望收缩，还是银箱吃紧"
 tv_engineering_department.7080.d:0 "围观者的赞叹正变得迟疑，工地外的闲谈已经学会计算每一车石料，同时国库已经为本季度的各项开销列满注脚，任何额外支出都要从别处拔钉。若让工程自己吞下这口气，布告会失去光泽，支持者也会把声音压低；若把压力推出围栏，钱箱会发出比反对声更清楚的回响。参事们都能说明两边为何必要，却没有人能把账页变干净。"
 tv_engineering_department.7080.a:0 "让民心先退一步，免得国库被拖下水。"
 tv_engineering_department.7080.b:0 "保住民心，把压力推给国库。"
