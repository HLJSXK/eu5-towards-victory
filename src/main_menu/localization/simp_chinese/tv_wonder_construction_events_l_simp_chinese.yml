 tv_engineering_department.7029.t:0 "[tv_wonder_construction|E]：占用市民便利，换宏图舒展"
 tv_engineering_department.7029.d:0 "商人把仓库、码头和信用再一次转向工地。工程部门趁这阵并不体面的余裕，换来更宽的基址、更多测量日和结构余量。于是奇观的尺度不再像硬撑出来的狂想，但账房会把每一处不便逐笔记下。这笔账说得通，却绝不会自己消失。"
 tv_engineering_department.7029.a:0 "动用市集耐性，换取尺度。"
 tv_engineering_department.7029.b:0 "让这个月安静过去。"
 tv_engineering_department.7030.t:0 "[tv_wonder_construction|E]：借走乡民余力，换宏图舒展"
 tv_engineering_department.7030.d:0 "村社在临时承诺下交出更多车驾、人手和粮秣。工程部门趁这阵并不体面的余裕，换来更宽的基址、更多测量日和结构余量。于是奇观的尺度不再像硬撑出来的狂想，但疲惫的田埂很清楚临时二字能拖多久。这笔账说得通，却绝不会自己消失。"
 tv_engineering_department.7030.a:0 "动用乡村耐性，换取尺度。"
 tv_engineering_department.7030.b:0 "让这个月安静过去。"
 tv_engineering_department.7031.t:0 "[tv_wonder_construction|E]：拆用工址积累，换宏图舒展"
 tv_engineering_department.7031.d:0 "当地街道、作坊和既有设施被切开，为奇观腾出空间。工程部门趁这阵并不体面的余裕，换来更宽的基址、更多测量日和结构余量。于是奇观的尺度不再像硬撑出来的狂想，但工址更容易施工，是因为旧日的自己少了一块。这笔账说得通，却绝不会自己消失。"
 tv_engineering_department.7031.a:0 "动用工址，换取尺度。"
 tv_engineering_department.7031.b:0 "让这个月安静过去。"
 tv_engineering_department.7032.t:0 "[tv_wonder_construction|E]：抽走工址生意，换宏图舒展"
 tv_engineering_department.7032.d:0 "当地客栈、作坊和交易被转向工地这个巨口。工程部门趁这阵并不体面的余裕，换来更宽的基址、更多测量日和结构余量。于是奇观的尺度不再像硬撑出来的狂想，但围栏外的街声低了下去。这笔账说得通，却绝不会自己消失。"
 tv_engineering_department.7032.a:0 "动用本地繁荣，换取尺度。"
 tv_engineering_department.7032.b:0 "让这个月安静过去。"
 tv_engineering_department.7033.t:0 "[tv_wonder_construction|E]：挪用首都积累，换宏图舒展"
 tv_engineering_department.7033.d:0 "首都修缮与扩建被推迟，熟练工和材料转投奇观。工程部门趁这阵并不体面的余裕，换来更宽的基址、更多测量日和结构余量。于是奇观的尺度不再像硬撑出来的狂想，但首都会记住哪些承诺被延后。这笔账说得通，却绝不会自己消失。"
 tv_engineering_department.7033.a:0 "动用首都工程，换取尺度。"
 tv_engineering_department.7033.b:0 "让这个月安静过去。"
 tv_engineering_department.7034.t:0 "[tv_wonder_construction|E]：借首都商气，换宏图舒展"
 tv_engineering_department.7034.d:0 "王城市场、信用和仓储被拉向工地。工程部门趁这阵并不体面的余裕，换来更宽的基址、更多测量日和结构余量。于是奇观的尺度不再像硬撑出来的狂想，但首都街道为远处石头低声下来。这笔账说得通，却绝不会自己消失。"
 tv_engineering_department.7034.a:0 "动用首都商气，换取尺度。"
 tv_engineering_department.7034.b:0 "让这个月安静过去。"
 tv_engineering_department.7035.t:0 "[tv_wonder_construction|E]：压上劳工筋骨，换宏图舒展"
 tv_engineering_department.7035.d:0 "劳工被要求把班次、休息和安全余量拉到舒适之外。工程部门趁这阵并不体面的余裕，换来更宽的基址、更多测量日和结构余量。于是奇观的尺度不再像硬撑出来的狂想，但疲惫身体记账比书记更严。这笔账说得通，却绝不会自己消失。"
 tv_engineering_department.7035.a:0 "动用劳工，换取尺度。"
 tv_engineering_department.7035.b:0 "让这个月安静过去。"
 tv_engineering_department.7036.t:0 "[tv_wonder_construction|E]：国库拨款，换号令整肃"
 tv_engineering_department.7036.d:0 "司库打开预备金箱，把原本留给军饷、赈济和宫廷修缮的硬币拨往工地。工程部门趁这阵并不体面的余裕，换来更清楚的名册、轮班和责任界线。于是命令在工地里少绕了许多弯路，但空出的账格会被每个有眼睛的官员看见。这笔账说得通，却绝不会自己消失。"
 tv_engineering_department.7036.a:0 "动用国库，换取组织。"
 tv_engineering_department.7036.b:0 "让这个月安静过去。"
 tv_engineering_department.7037.t:0 "[tv_wonder_construction|E]：王命背书，换号令整肃"
 tv_engineering_department.7037.d:0 "宫廷把王命压在工程布告上，使反对者暂时不敢高声质问。工程部门趁这阵并不体面的余裕，换来更清楚的名册、轮班和责任界线。于是命令在工地里少绕了许多弯路，但被当作脚手架使用的权威，很难原样收回。这笔账说得通，却绝不会自己消失。"
 tv_engineering_department.7037.a:0 "动用王命，换取组织。"
 tv_engineering_department.7037.b:0 "让这个月安静过去。"
 tv_engineering_department.7038.t:0 "[tv_wonder_construction|E]：扰动乡里，换号令整肃"
 tv_engineering_department.7038.d:0 "地方秩序被临时拨开，好让车队、工队和文书不用等待。工程部门趁这阵并不体面的余裕，换来更清楚的名册、轮班和责任界线。于是命令在工地里少绕了许多弯路，但乡里会记住日常生活何时为远处的石头弯折。这笔账说得通，却绝不会自己消失。"
 tv_engineering_department.7038.a:0 "动用秩序，换取组织。"
 tv_engineering_department.7038.b:0 "让这个月安静过去。"
 tv_engineering_department.7039.t:0 "[tv_wonder_construction|E]：透支声名，换号令整肃"
 tv_engineering_department.7039.d:0 "宫廷把声名花在宣告、仪式和使工程显得必然的承诺上。工程部门趁这阵并不体面的余裕，换来更清楚的名册、轮班和责任界线。于是命令在工地里少绕了许多弯路，但夸下的词句会在日后反过来要求结果。这笔账说得通，却绝不会自己消失。"
