 tv_engineering_department.7096.t:0 "奇观建设：国内支持度或国库资金"
 tv_engineering_department.7096.d:0 "这个月把一个令人不快的账目选择推到了建筑者面前：要么让工程在国内支持度上受损，要么让围栏之外的国家以国库资金承受代价。没有哪一个选择干净，只有把淤青放在哪里更不显眼。"
 tv_engineering_department.7096.a:0 "让工程承受代价。"
 tv_engineering_department.7096.b:0 "把代价转移出去。"
