 tv_engineering_department.7126.d:0 "工地面前摆着一笔难看的账。若让工程自己吞下冲击，车队会重新陷入延期和借口；若把压力推到围栏之外，则要由平民[estate_satisfaction|E]承受。账目能被摊平，却不会因此变干净。"
