 tv_engineering_department.7144.b:0 "保住进度，让劳工承压。"
 tv_engineering_department.7145.t:0 "[tv_wonder_construction|E]：国库添上新缺口"
 tv_engineering_department.7145.d:0 "奇观吃钱的速度超过账册预期。司库能解释短缺从何而来，却不能把解释铸成银币。"
 tv_engineering_department.7145.a:0 "承受这份压力。"
 tv_engineering_department.7146.t:0 "[tv_wonder_construction|E]：王命染上灰尘"
 tv_engineering_department.7146.d:0 "王命被拉过太多现实妥协。印玺仍然有效，却显得薄了。"
 tv_engineering_department.7146.a:0 "承受这份压力。"
 tv_engineering_department.7147.t:0 "[tv_wonder_construction|E]：地方安宁受扰"
 tv_engineering_department.7147.d:0 "施工节奏压到了寻常生活。市场晚开，村镇低语，秩序稍稍后退。"
 tv_engineering_department.7147.a:0 "承受这份压力。"
 tv_engineering_department.7148.t:0 "[tv_wonder_construction|E]：宫廷声望失色"
 tv_engineering_department.7148.d:0 "宫廷给工程添色，收回的却是灰尘。几句玩笑和几个未兑现的夸口足以磨薄声望。"
 tv_engineering_department.7148.a:0 "承受这份压力。"
 tv_engineering_department.7149.t:0 "[tv_wonder_construction|E]：贵族席间传出冷语"
 tv_engineering_department.7149.d:0 "贵族家门再次为工程让路。让步很正式，也很冷，这往往比拒绝更难处理。"
 tv_engineering_department.7149.a:0 "承受这份压力。"
 tv_engineering_department.7150.t:0 "[tv_wonder_construction|E]：祭坛前的眉头"
 tv_engineering_department.7150.d:0 "神圣日程再次为工地弯折。教士服从了，但服从带着棱角。"
 tv_engineering_department.7150.a:0 "承受这份压力。"
 tv_engineering_department.7151.t:0 "[tv_wonder_construction|E]：商街账本变薄"
 tv_engineering_department.7151.d:0 "市场生意被迫绕着工程转。市民可以从宏伟中获利，但不能在每条路都被堵住时获利。"
 tv_engineering_department.7151.a:0 "承受这份压力。"
 tv_engineering_department.7152.t:0 "[tv_wonder_construction|E]：村社肩背发沉"
 tv_engineering_department.7152.d:0 "乡村肩膀又添一担。工程前进了，村社耐性也变薄了。"
 tv_engineering_department.7152.a:0 "承受这份压力。"
 tv_engineering_department.7153.t:0 "[tv_wonder_construction|E]：工址街区让出骨肉"
 tv_engineering_department.7153.d:0 "工址又交出一部分日常肌理。未来奇观得到空间，眼前街巷失去用途。"
 tv_engineering_department.7153.a:0 "承受这份压力。"
 tv_engineering_department.7154.t:0 "[tv_wonder_construction|E]：工址市声变低"
 tv_engineering_department.7154.d:0 "当地商业因工程牵引而安静。繁荣可以改道，但改道太多次就会变薄。"
 tv_engineering_department.7154.a:0 "承受这份压力。"
 tv_engineering_department.7155.t:0 "[tv_wonder_construction|E]：首都工程被迫让路"
 tv_engineering_department.7155.d:0 "首都工程再次为奇观让路。王城仍然宏伟，只是骨架被借走了一些。"
 tv_engineering_department.7155.a:0 "承受这份压力。"
 tv_engineering_department.7156.t:0 "[tv_wonder_construction|E]：首都街市变冷"
 tv_engineering_department.7156.d:0 "工程吸走信用和货物，首都市场少了几分亮色。宫廷称之为爱国，商人称之为生意变慢。"
 tv_engineering_department.7156.a:0 "承受这份压力。"
 tv_engineering_department.7157.t:0 "[tv_wonder_construction|E]：工地伤亡添名"
 tv_engineering_department.7157.d:0 "伤员名册添了新名字。工程继续，但每个新标记都会改变劳工看石头的眼神。"
 tv_engineering_department.7157.a:0 "承受这份压力。"
 tv_engineering_department.7158.t:0 "[tv_wonder_construction|E]：金库门前的沉默"
 tv_engineering_department.7158.d:0 "工地一次硬邦邦的索取让国库明显塌下去一块。奇观还没供人瞻仰，国家已经先付了账。"
 tv_engineering_department.7158.a:0 "这会被记住。"
 tv_engineering_department.7159.t:0 "[tv_wonder_construction|E]：名分在工地前裂开"
 tv_engineering_department.7159.d:0 "工地迫使王权摆出并不体面的姿态。宏伟的承诺如今压在受损的权威上。"
 tv_engineering_department.7159.a:0 "这会被记住。"
 tv_engineering_department.7160.t:0 "[tv_wonder_construction|E]：秩序在征发中破声"
 tv_engineering_department.7160.d:0 "更硬的扰动越过围栏。官员能说清原因，却不能靠说明让国家重新安稳。"
 tv_engineering_department.7160.a:0 "这会被记住。"
 tv_engineering_department.7161.t:0 "[tv_wonder_construction|E]：[prestige|E]在众目下折损"
 tv_engineering_department.7161.d:0 "工地上的尴尬比官方修正跑得更快。荣誉正在为尚未立起的石头付账。"
 tv_engineering_department.7161.a:0 "这会被记住。"
 tv_engineering_department.7162.t:0 "[tv_wonder_construction|E]：贵族耐心被凿穿"
 tv_engineering_department.7162.d:0 "工程凿穿了贵族耐性，礼貌已经遮不住声响。会吞家产的奇观，从来不是好客人。"
 tv_engineering_department.7162.a:0 "这会被记住。"
 tv_engineering_department.7163.t:0 "[tv_wonder_construction|E]：教士耐心告罄"
 tv_engineering_department.7163.d:0 "施工需求踩得离祭坛太近。虔敬被当成空地时，教士不会忘记。"
 tv_engineering_department.7163.a:0 "这会被记住。"
 tv_engineering_department.7164.t:0 "[tv_wonder_construction|E]：市民怒气上街"
 tv_engineering_department.7164.d:0 "愤怒抵达店门口；工地吞下空间、时间和信用，城市先听见奇观，再看见奇观。"
 tv_engineering_department.7164.a:0 "这会被记住。"
 tv_engineering_department.7165.t:0 "[tv_wonder_construction|E]：平民怨气压不住"
 tv_engineering_department.7165.d:0 "这次征调后，乡间怒气不会安静待在田里。奇观的阴影已经落到也许永远看不见它的人身上。"
 tv_engineering_department.7165.a:0 "这会被记住。"
 tv_engineering_department.7166.t:0 "[tv_wonder_construction|E]：工址发展倒退"
 tv_engineering_department.7166.d:0 "工程把工址挖空到足以倒退。奇观还没有升起，周围地点已经先付了账。"
 tv_engineering_department.7166.a:0 "这会被记住。"
 tv_engineering_department.7167.t:0 "[tv_wonder_construction|E]：工址繁荣被压熄"
 tv_engineering_department.7167.d:0 "工地一时闷住了本地市场。车队仍在抵达，只是其中更少服务于石头周围的城镇。"
 tv_engineering_department.7167.a:0 "这会被记住。"
 tv_engineering_department.7168.t:0 "[tv_wonder_construction|E]：首都发展替奇观买单"
 tv_engineering_department.7168.d:0 "首都用石料、劳力和迟到的修缮付账。远处纪念碑更真实，近处计划更空。"
 tv_engineering_department.7168.a:0 "这会被记住。"
 tv_engineering_department.7169.t:0 "[tv_wonder_construction|E]：王城市声被压低"
 tv_engineering_department.7169.d:0 "王城贸易被工程压低。远处的宏伟，正在削暗负责供养它的街道。"
 tv_engineering_department.7169.a:0 "这会被记住。"
 tv_engineering_department.7170.t:0 "[tv_wonder_construction|E]：劳工血汗越过界线"
 tv_engineering_department.7170.d:0 "汗水在工地越界成血。奇观没有因此停下，这也许正是最残酷的教训。"
 tv_engineering_department.7170.a:0 "这会被记住。"
 tv_engineering_department.7171.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]说服街市"
 tv_engineering_department.7171.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]把一次技术巡视变成公开胜利，使[tv_wonder_domestic_support|E]大幅提高。\n\n#G 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力高于80。#!"
