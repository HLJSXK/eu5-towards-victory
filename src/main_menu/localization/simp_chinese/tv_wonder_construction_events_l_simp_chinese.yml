 tv_engineering_department.7068.d:0 "商人把仓库、码头和信用再一次转向工地。工程部门趁这阵并不体面的余裕，换来额外人手、更长班次和足以立刻推进的材料。于是未完成的石头实实在在地接近完工，但账房会把每一处不便逐笔记下。这笔账说得通，却绝不会自己消失。"
