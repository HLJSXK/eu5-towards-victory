 tv_engineering_department.7065.b:0 "让这个月安静过去。"
 tv_engineering_department.7066.t:0 "[tv_wonder_construction|E]：借用贵族耐性，换工程突进"
 tv_engineering_department.7066.d:0 "显贵们借出车马、佃户和名义，同时清楚表示这份耐性只是借款。工程部门趁这阵并不体面的余裕，换来额外人手、更长班次和足以立刻推进的材料。于是未完成的石头实实在在地接近完工，但贵族宴席上的沉默会记住这次人情。这笔账说得通，却绝不会自己消失。"
 tv_engineering_department.7066.a:0 "动用贵族耐性，换取进度。"
 tv_engineering_department.7066.b:0 "让这个月安静过去。"
