 tv_engineering_department.7046.t:0 "[tv_wonder_construction|E]：挪用首都积累，换号令整肃"
 tv_engineering_department.7046.d:0 "首都几项原定修缮和扩建被暂缓，熟练工匠与材料转而支援奇观。工程部门趁这阵并不体面的余裕，把更清楚的名册、轮班和责任界线推进到图纸和工棚之间。工棚里的命令终于能按同一种节拍传下去，但宫城与街区会记住被推迟的承诺。这不是没有代价的聪明，只是把代价放到了当下最容易被承受的位置。"
 tv_engineering_department.7046.a:0 "让首都工程暂且让路，换来组织上的余裕。"
 tv_engineering_department.7046.b:0 "别再挪走首都积累，让组织慢慢积累。"
 tv_engineering_department.7047.t:0 "[tv_wonder_construction|E]：借首都商气，换号令整肃"
 tv_engineering_department.7047.d:0 "首都市场的信用、仓储和人流被工程吸走一部分，最繁华的街道也为远处的石头腾出余裕。工程部门趁这阵并不体面的余裕，把更清楚的名册、轮班和责任界线推进到图纸和工棚之间。工棚里的命令终于能按同一种节拍传下去，但王城市声会短暂低下去。这不是没有代价的聪明，只是把代价放到了当下最容易被承受的位置。"
 tv_engineering_department.7047.a:0 "把首都商气引向工地，换来组织上的余裕。"
 tv_engineering_department.7047.b:0 "别再抽走王城市声，让组织慢慢积累。"
 tv_engineering_department.7048.t:0 "[tv_wonder_construction|E]：压上劳工筋骨，换号令整肃"
 tv_engineering_department.7048.d:0 "工头要求劳工延长班次，把休息、替换和安全余量一并压缩到最窄。工程部门趁这阵并不体面的余裕，把更清楚的名册、轮班和责任界线推进到图纸和工棚之间。工棚里的命令终于能按同一种节拍传下去，但疲惫的身体会把代价记得比账册更准。这不是没有代价的聪明，只是把代价放到了当下最容易被承受的位置。"
 tv_engineering_department.7048.a:0 "让劳工再撑一轮，换来组织上的余裕。"
 tv_engineering_department.7048.b:0 "别再压榨劳工筋骨，让组织慢慢积累。"
 tv_engineering_department.7049.t:0 "[tv_wonder_construction|E]：国库拨款，换运道畅通"
 tv_engineering_department.7049.d:0 "司库打开预备金箱，把原本留给军饷、赈济和宫廷修缮的硬币拨往工地。工程部门趁这阵并不体面的余裕，把桥、仓、驿路和车队之间更可靠的衔接推进到图纸和工棚之间。石料和木材能按工地真正需要的速度抵达，但空出的账格会被每个有眼睛的官员看见。这不是没有代价的聪明，只是把代价放到了当下最容易被承受的位置。"
 tv_engineering_department.7049.a:0 "打开国库暗格，换来转运上的余裕。"
 tv_engineering_department.7049.b:0 "把国库铁锁重新扣上，让转运慢慢积累。"
 tv_engineering_department.7050.t:0 "[tv_wonder_construction|E]：王命背书，换运道畅通"
 tv_engineering_department.7050.d:0 "宫廷愿意把君主的名义压在工程布告上，让反对者暂时不敢把抱怨说得太响。工程部门趁这阵并不体面的余裕，把桥、仓、驿路和车队之间更可靠的衔接推进到图纸和工棚之间。石料和木材能按工地真正需要的速度抵达，但被动用的威仪很难完全收回。这不是没有代价的聪明，只是把代价放到了当下最容易被承受的位置。"
 tv_engineering_department.7050.a:0 "以王命为工程背书，换来转运上的余裕。"
 tv_engineering_department.7050.b:0 "别让王命替工棚担保，让转运慢慢积累。"
 tv_engineering_department.7051.t:0 "[tv_wonder_construction|E]：扰动乡里，换运道畅通"
 tv_engineering_department.7051.d:0 "地方官同意加快征调人手和车辆，让原本安静的乡里为工程让出道路。工程部门趁这阵并不体面的余裕，把桥、仓、驿路和车队之间更可靠的衔接推进到图纸和工棚之间。石料和木材能按工地真正需要的速度抵达，但被惊动的日常秩序不会立刻恢复原状。这不是没有代价的聪明，只是把代价放到了当下最容易被承受的位置。"
 tv_engineering_department.7051.a:0 "让地方秩序为工程让路，换来转运上的余裕。"
 tv_engineering_department.7051.b:0 "不要再惊动乡里，让转运慢慢积累。"
 tv_engineering_department.7052.t:0 "[tv_wonder_construction|E]：透支声名，换运道畅通"
 tv_engineering_department.7052.d:0 "宫廷愿意把已经积累的声名借给工地，用典礼、宣告和夸饰遮住几处现实缺口。工程部门趁这阵并不体面的余裕，把桥、仓、驿路和车队之间更可靠的衔接推进到图纸和工棚之间。石料和木材能按工地真正需要的速度抵达，但夸下的词句会反过来要求结果。这不是没有代价的聪明，只是把代价放到了当下最容易被承受的位置。"
 tv_engineering_department.7052.a:0 "拿宫廷声名替工程开路，换来转运上的余裕。"
 tv_engineering_department.7052.b:0 "别把声望再押上去，让转运慢慢积累。"
 tv_engineering_department.7053.t:0 "[tv_wonder_construction|E]：借用贵族耐性，换运道畅通"
 tv_engineering_department.7053.d:0 "数家显贵同意把车马、佃户和名义借给工地，只是他们的微笑比契约更薄。工程部门趁这阵并不体面的余裕，把桥、仓、驿路和车队之间更可靠的衔接推进到图纸和工棚之间。石料和木材能按工地真正需要的速度抵达，但宴席上的沉默会记住这次让步。这不是没有代价的聪明，只是把代价放到了当下最容易被承受的位置。"
 tv_engineering_department.7053.a:0 "借贵族的车马与面子，换来转运上的余裕。"
 tv_engineering_department.7053.b:0 "别再试探贵族耐性，让转运慢慢积累。"
 tv_engineering_department.7054.t:0 "[tv_wonder_construction|E]：动用教士宽容，换运道畅通"
 tv_engineering_department.7054.d:0 "教士们同意缩短若干仪式、让出若干地产便利和祝祷时辰，好让工程赶上安排。工程部门趁这阵并不体面的余裕，把桥、仓、驿路和车队之间更可靠的衔接推进到图纸和工棚之间。石料和木材能按工地真正需要的速度抵达，但祭坛旁的低语会问这一切是否过于世俗。这不是没有代价的聪明，只是把代价放到了当下最容易被承受的位置。"
 tv_engineering_department.7054.a:0 "请教士为工地让出时辰，换来转运上的余裕。"
 tv_engineering_department.7054.b:0 "别让祭坛继续让步，让转运慢慢积累。"
 tv_engineering_department.7055.t:0 "[tv_wonder_construction|E]：占用市民便利，换运道畅通"
 tv_engineering_department.7055.d:0 "城镇商人同意让仓库、码头和信用暂时偏向工地，哪怕市场因此少了几分顺滑。工程部门趁这阵并不体面的余裕，把桥、仓、驿路和车队之间更可靠的衔接推进到图纸和工棚之间。石料和木材能按工地真正需要的速度抵达，但账房会把这份不便逐笔记下。这不是没有代价的聪明，只是把代价放到了当下最容易被承受的位置。"
 tv_engineering_department.7055.a:0 "让商街替工地周转，换来转运上的余裕。"
 tv_engineering_department.7055.b:0 "别再挤压商街，让转运慢慢积累。"
 tv_engineering_department.7056.t:0 "[tv_wonder_construction|E]：借走乡民余力，换运道畅通"
 tv_engineering_department.7056.d:0 "乡村被要求多出劳役、车驾和粮秣，地方官保证这只是临时安排。工程部门趁这阵并不体面的余裕，把桥、仓、驿路和车队之间更可靠的衔接推进到图纸和工棚之间。石料和木材能按工地真正需要的速度抵达，但田埂上的疲惫不会因为文书写着临时就消失。这不是没有代价的聪明，只是把代价放到了当下最容易被承受的位置。"
 tv_engineering_department.7056.a:0 "让村社再撑一程，换来转运上的余裕。"
 tv_engineering_department.7056.b:0 "别再抽走乡民余力，让转运慢慢积累。"
 tv_engineering_department.7057.t:0 "[tv_wonder_construction|E]：拆用工址积累，换运道畅通"
 tv_engineering_department.7057.d:0 "建设地点周边的既有设施被拆改、征用和改道，好给奇观腾出更顺手的空间。工程部门趁这阵并不体面的余裕，把桥、仓、驿路和车队之间更可靠的衔接推进到图纸和工棚之间。石料和木材能按工地真正需要的速度抵达，但当地原本积累的便利会留下缺口。这不是没有代价的聪明，只是把代价放到了当下最容易被承受的位置。"
 tv_engineering_department.7057.a:0 "拆改工址既有设施，换来转运上的余裕。"
 tv_engineering_department.7057.b:0 "别再拆用工址街区，让转运慢慢积累。"
 tv_engineering_department.7058.t:0 "[tv_wonder_construction|E]：抽走工址生意，换运道畅通"
 tv_engineering_department.7058.d:0 "当地的客栈、作坊和集市被要求优先服务工地，原本流动的生意被引向同一个巨口。工程部门趁这阵并不体面的余裕，把桥、仓、驿路和车队之间更可靠的衔接推进到图纸和工棚之间。石料和木材能按工地真正需要的速度抵达，但被抽走的市声不会立刻回到街角。这不是没有代价的聪明，只是把代价放到了当下最容易被承受的位置。"
 tv_engineering_department.7058.a:0 "把当地生意转向工地，换来转运上的余裕。"
 tv_engineering_department.7058.b:0 "让工址生意喘口气，让转运慢慢积累。"
