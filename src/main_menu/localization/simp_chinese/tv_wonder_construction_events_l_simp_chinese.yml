 tv_engineering_department.7067.d:0 "教士缩短仪式、借出地产或勉强祝福一项靠近祭坛的安排。工程部门趁这阵并不体面的余裕，换来额外人手、更长班次和足以立刻推进的材料。于是未完成的石头实实在在地接近完工，但圣所旁的低语会问工程是否过于世俗。这笔账说得通，却绝不会自己消失。"
 tv_engineering_department.7067.a:0 "动用教士耐性，换取进度。"
 tv_engineering_department.7067.b:0 "让这个月安静过去。"
