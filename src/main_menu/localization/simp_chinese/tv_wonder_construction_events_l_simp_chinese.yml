 tv_engineering_department.7137.d:0 "脚手架已经搭好，熟手也在场，可每一次停顿都像在把完工日往后推，同时教士已经觉得奇观把神圣用作施工借口，再多一步就会让讲坛发出责备。若让工程自己吞下这口气，当前部件会少一段本该属于今日的高度；若把压力推出围栏，教士的[estate_satisfaction|E]会在祈祷声里冷下去。参事们都能说明两边为何必要，却没有人能把账页变干净。"
 tv_engineering_department.7137.a:0 "让工段先退一步，免得教士被拖下水。"
 tv_engineering_department.7137.b:0 "保住工段，把压力推给教士。"
 tv_engineering_department.7138.t:0 "[tv_wonder_construction|E]：进度回落，还是商街怨声"
 tv_engineering_department.7138.d:0 "脚手架已经搭好，熟手也在场，可每一次停顿都像在把完工日往后推，同时市民已经为封路、征车和临时仓储让出太多便利，商街的笑脸快维持不住。若让工程自己吞下这口气，当前部件会少一段本该属于今日的高度；若把压力推出围栏，市民的[estate_satisfaction|E]会在账本边缘被削薄。参事们都能说明两边为何必要，却没有人能把账页变干净。"
 tv_engineering_department.7138.a:0 "让工段先退一步，免得市民被拖下水。"
 tv_engineering_department.7138.b:0 "保住工段，把压力推给市民。"
 tv_engineering_department.7139.t:0 "[tv_wonder_construction|E]：进度回落，还是村社疲惫"
 tv_engineering_department.7139.d:0 "脚手架已经搭好，熟手也在场，可每一次停顿都像在把完工日往后推，同时平民已经在农时和工役之间来回奔走，再加一层负担就会让沉默变成怨声。若让工程自己吞下这口气，当前部件会少一段本该属于今日的高度；若把压力推出围栏，平民的[estate_satisfaction|E]会在田垄之间掉落。参事们都能说明两边为何必要，却没有人能把账页变干净。"
 tv_engineering_department.7139.a:0 "让工段先退一步，免得平民被拖下水。"
 tv_engineering_department.7139.b:0 "保住工段，把压力推给平民。"
 tv_engineering_department.7140.t:0 "[tv_wonder_construction|E]：进度回落，还是工址被掏空"
 tv_engineering_department.7140.d:0 "脚手架已经搭好，熟手也在场，可每一次停顿都像在把完工日往后推，同时工址周边能拆能改的地方越来越少，再动一刀就会伤到当地自己的生计。若让工程自己吞下这口气，当前部件会少一段本该属于今日的高度；若把压力推出围栏，建设地点[development|E]会被工程从脚下掏走一块。参事们都能说明两边为何必要，却没有人能把账页变干净。"
 tv_engineering_department.7140.a:0 "让工段先退一步，免得工址发展被拖下水。"
 tv_engineering_department.7140.b:0 "保住工段，把压力推给工址发展。"
 tv_engineering_department.7141.t:0 "[tv_wonder_construction|E]：进度回落，还是工址繁荣降温"
 tv_engineering_department.7141.d:0 "脚手架已经搭好，熟手也在场，可每一次停顿都像在把完工日往后推，同时工址附近的生意已经被工程吞下太多，再继续抽调会让繁荣本身开始退潮。若让工程自己吞下这口气，当前部件会少一段本该属于今日的高度；若把压力推出围栏，建设地点[prosperity|E]会在看似热闹的工棚旁降温。参事们都能说明两边为何必要，却没有人能把账页变干净。"
 tv_engineering_department.7141.a:0 "让工段先退一步，免得工址繁荣被拖下水。"
 tv_engineering_department.7141.b:0 "保住工段，把压力推给工址繁荣。"
 tv_engineering_department.7142.t:0 "[tv_wonder_construction|E]：进度回落，还是首都骨架受削"
 tv_engineering_department.7142.d:0 "脚手架已经搭好，熟手也在场，可每一次停顿都像在把完工日往后推，同时首都自己的工程已经多次让路，再抽调一次就会把城市的骨架削得太明显。若让工程自己吞下这口气，当前部件会少一段本该属于今日的高度；若把压力推出围栏，首都[development|E]会替奇观承担看得见的缺口。参事们都能说明两边为何必要，却没有人能把账页变干净。"
 tv_engineering_department.7142.a:0 "让工段先退一步，免得首都发展被拖下水。"
 tv_engineering_department.7142.b:0 "保住工段，把压力推给首都发展。"
 tv_engineering_department.7143.t:0 "[tv_wonder_construction|E]：进度回落，还是首都繁荣失温"
 tv_engineering_department.7143.d:0 "脚手架已经搭好，熟手也在场，可每一次停顿都像在把完工日往后推，同时首都商路已经被工程借走太多周转，再继续抽取会让繁荣在街角失温。若让工程自己吞下这口气，当前部件会少一段本该属于今日的高度；若把压力推出围栏，首都[prosperity|E]会在最亮的橱窗后暗下去。参事们都能说明两边为何必要，却没有人能把账页变干净。"
 tv_engineering_department.7143.a:0 "让工段先退一步，免得首都繁荣被拖下水。"
 tv_engineering_department.7143.b:0 "保住工段，把压力推给首都繁荣。"
 tv_engineering_department.7144.t:0 "[tv_wonder_construction|E]：进度回落，还是劳工倒下"
 tv_engineering_department.7144.d:0 "脚手架已经搭好，熟手也在场，可每一次停顿都像在把完工日往后推，同时劳工已经在石尘和绳索下撑到极限，再赶一步就会有人倒在奇观的影子里。若让工程自己吞下这口气，当前部件会少一段本该属于今日的高度；若把压力推出围栏，建设地点劳工会用伤亡替工程付款。参事们都能说明两边为何必要，却没有人能把账页变干净。"
 tv_engineering_department.7144.a:0 "让工段先退一步，免得劳工被拖下水。"
 tv_engineering_department.7144.b:0 "保住工段，把压力推给劳工。"
 tv_engineering_department.7145.t:0 "[tv_wonder_construction|E]：国库添上新缺口"
 tv_engineering_department.7145.d:0 "工程继续向前，但国库账页比往常薄了一截。司库能解释每一笔支出，却无法让空出的栏位重新生钱。奇观还没立起，国家已经先学会为它垫付耐心。"
 tv_engineering_department.7145.a:0 "让司库先把缺口缝起来。"
 tv_engineering_department.7146.t:0 "[tv_wonder_construction|E]：王命染上灰尘"
 tv_engineering_department.7146.d:0 "几道催工文书以君主名义发出，却没有得到同样庄重的结果。朝臣仍然服从，语气却多了一点计算。[legitimacy|E]不是崩塌，只是在奇观阴影下蒙了一层灰。"
 tv_engineering_department.7146.a:0 "让宫廷尽快修补礼数。"
 tv_engineering_department.7147.t:0 "[tv_wonder_construction|E]：地方安宁受扰"
 tv_engineering_department.7147.d:0 "额外征调打乱了几处市镇的平常节奏，抱怨先在酒馆里出现，随后才进入官员的耳朵。[stability|E]受到冲击，工程也因此显得比石头更重。"
 tv_engineering_department.7147.a:0 "先把地方怨气压下去。"
 tv_engineering_department.7148.t:0 "[tv_wonder_construction|E]：宫廷声望失色"
 tv_engineering_department.7148.d:0 "一次本该显示气派的工程展示只让来宾看见了未完成的尴尬。[prestige|E]受到轻微折损，宫廷仍然体面，只是笑声来得比掌声更快。"
 tv_engineering_department.7148.a:0 "把失色的体面擦一擦。"
 tv_engineering_department.7149.t:0 "[tv_wonder_construction|E]：贵族席间传出冷语"
 tv_engineering_department.7149.d:0 "几位贵族把原本答应的协助照常送到，却在席间把话说得很凉。贵族的[estate_satisfaction|E]受损，工地得到的帮助也因此带上了欠债的味道。"
 tv_engineering_department.7149.a:0 "派人去贵族席间解释。"
 tv_engineering_department.7150.t:0 "[tv_wonder_construction|E]：祭坛前的眉头"
 tv_engineering_department.7150.d:0 "几场仪式因工程安排被迫简化，讲坛上的语气随之变得谨慎而冷。教士的[estate_satisfaction|E]下降，奇观在神圣名义下多了一层不安。"
 tv_engineering_department.7150.a:0 "向祭坛送去迟来的歉意。"
 tv_engineering_department.7151.t:0 "[tv_wonder_construction|E]：商街账本变薄"
 tv_engineering_department.7151.d:0 "几处市场因工程调度改道，商人们照常营业，却把算盘拨得格外响。市民的[estate_satisfaction|E]下降，工地从商街借来的便利开始计息。"
 tv_engineering_department.7151.a:0 "向商街许诺补偿。"
 tv_engineering_department.7152.t:0 "[tv_wonder_construction|E]：村社肩背发沉"
 tv_engineering_department.7152.d:0 "劳役名单又向乡里伸出一截，村社照办，却把怨气藏进晚饭后的沉默里。平民的[estate_satisfaction|E]下降，奇观的宏伟在田垄上显得格外遥远。"
 tv_engineering_department.7152.a:0 "让地方官去听村社诉苦。"
 tv_engineering_department.7153.t:0 "[tv_wonder_construction|E]：工址街区让出骨肉"
 tv_engineering_department.7153.d:0 "几处原本服务当地的设施被改作工程用途，居民仍能生活，却明显绕了更远的路。建设地点[development|E]受损，奇观开始从自己的地基周围取肉。"
 tv_engineering_department.7153.a:0 "先修补工址周边的空洞。"
 tv_engineering_department.7154.t:0 "[tv_wonder_construction|E]：工址市声变低"
 tv_engineering_department.7154.d:0 "工地带来了人潮，却也把当地原本多样的生意挤成单一的供给线。建设地点[prosperity|E]下降，街市仍然喧闹，却不再像从前那样自由流动。"
 tv_engineering_department.7154.a:0 "让街市重新流动起来。"
 tv_engineering_department.7155.t:0 "[tv_wonder_construction|E]：首都工程被迫让路"
 tv_engineering_department.7155.d:0 "首都几处原本排定的修缮被推迟，工匠和材料流向远处或城郊的奇观工地。首都[development|E]受损，中心之城第一次显得像在为自己的荣光节衣缩食。"
 tv_engineering_department.7155.a:0 "让首都先把缺口遮住。"
 tv_engineering_department.7156.t:0 "[tv_wonder_construction|E]：首都街市变冷"
 tv_engineering_department.7156.d:0 "首都市场仍旧拥挤，但几条原本最灵活的商路被工程调度牵住。首都[prosperity|E]下降，繁华没有消失，只是被迫放慢了呼吸。"
 tv_engineering_department.7156.a:0 "让王城商路重新呼吸。"
 tv_engineering_department.7157.t:0 "[tv_wonder_construction|E]：工地伤亡添名"
 tv_engineering_department.7157.d:0 "几处工段为了赶时辰压缩了休息，伤病名单随即多出一些本可避免的姓名。建设地点劳工遭受损失，工地的进度表第一次显得像一张冷硬的判词。"
 tv_engineering_department.7157.a:0 "先把伤者抬离工段。"
 tv_engineering_department.7158.t:0 "[tv_wonder_construction|E]：金库门前的沉默"
 tv_engineering_department.7158.d:0 "这次不再只是普通超支。几项早已承诺的拨款被迫后移，金库门前的沉默比任何责问都难听。官员们把原因写得很整齐，可整齐的字迹补不上[gold|E]的裂口。"
 tv_engineering_department.7158.a:0 "记下这场昂贵的沉默。"
 tv_engineering_department.7159.t:0 "[tv_wonder_construction|E]：名分在工地前裂开"
 tv_engineering_department.7159.d:0 "一场围绕工程的争执被迫抬到王座之前，名分因此成了施工耗材。当君主的威仪被拿来解释石料迟到，[legitimacy|E]的裂口便很难再被称作小事。"
 tv_engineering_department.7159.a:0 "这道裂缝会被史官看见。"
 tv_engineering_department.7160.t:0 "[tv_wonder_construction|E]：秩序在征发中破声"
 tv_engineering_department.7160.d:0 "几地同时出现延误、争执和拒役，地方秩序被工程牵出一串裂响。官员们仍能压住局面，却无法否认[stability|E]已经为奇观付出一笔硬账。"
 tv_engineering_department.7160.a:0 "让巡吏去收拾回声。"
 tv_engineering_department.7161.t:0 "[tv_wonder_construction|E]：[prestige|E]在众目下折损"
 tv_engineering_department.7161.d:0 "关于工地失误的消息传得太快，远方使节听到的版本甚至比现场更锋利。[prestige|E]被公开磨损，奇观还未完成，已经先替国家招来一场难看的审视。"
 tv_engineering_department.7161.a:0 "这份羞辱要有人记账。"
 tv_engineering_department.7162.t:0 "[tv_wonder_construction|E]：贵族耐心被凿穿"
 tv_engineering_department.7162.d:0 "工程征用越过了某些显贵能忍受的界线，抱怨开始从私人书信流向公开场合。贵族的[estate_satisfaction|E]明显下跌，奇观的每一块石头都像压在一张纹章上。"
 tv_engineering_department.7162.a:0 "这杯冷酒先饮下去。"
 tv_engineering_department.7163.t:0 "[tv_wonder_construction|E]：教士耐心告罄"
 tv_engineering_department.7163.d:0 "一项施工决定被教士视为对礼仪的公开冒犯。解释可以送到修院，却无法让被冒犯者立刻点头；教士的[estate_satisfaction|E]遭到重创。"
 tv_engineering_department.7163.a:0 "让神职者先把怒意说完。"
 tv_engineering_department.7164.t:0 "[tv_wonder_construction|E]：市民怒气上街"
 tv_engineering_department.7164.d:0 "临时征用仓库和码头的命令引发了公开抱怨，商街终于不愿只在账房里生气。市民的[estate_satisfaction|E]大幅受损，工程的影子压到了每一张柜台上。"
 tv_engineering_department.7164.a:0 "先让市场重新开门。"
 tv_engineering_department.7165.t:0 "[tv_wonder_construction|E]：平民怨气压不住"
 tv_engineering_department.7165.d:0 "一轮过重的征调撞上农时，村社的忍耐终于破出声来。平民的[estate_satisfaction|E]明显受损，工地得到的每一双手都带着被迫离开的影子。"
 tv_engineering_department.7165.a:0 "这份怨气会沿田埂传开。"
 tv_engineering_department.7166.t:0 "[tv_wonder_construction|E]：工址发展倒退"
 tv_engineering_department.7166.d:0 "为了工地便利，一片原本繁忙的街区被强行拆改到失去原有功能。建设地点[development|E]明显下降，未来的奇观将站在一块被它自己削瘦的土地上。"
 tv_engineering_department.7166.a:0 "这块地会记住拆痕。"
 tv_engineering_department.7167.t:0 "[tv_wonder_construction|E]：工址繁荣被压熄"
 tv_engineering_department.7167.d:0 "连续的封路、征用和优先供应让工址周边的正常交易冷了下来。建设地点[prosperity|E]遭到重击，奇观的阴影第一次盖过了街市的烟火气。"
 tv_engineering_department.7167.a:0 "别让工地吞完整座街市。"
 tv_engineering_department.7168.t:0 "[tv_wonder_construction|E]：首都发展替奇观买单"
 tv_engineering_department.7168.d:0 "一轮过重的抽调让首都街区的实际建设停摆，连宫廷也难以假装这只是临时挪用。首都[development|E]明显下降，奇观的账单被送到了王国心脏。"
 tv_engineering_department.7168.a:0 "王城也会记账。"
 tv_engineering_department.7169.t:0 "[tv_wonder_construction|E]：王城市声被压低"
 tv_engineering_department.7169.d:0 "连续抽调仓储、车马和信用之后，首都街市明显冷了下来。首都[prosperity|E]受到重创，王城第一次像是在替一座尚未完工的纪念碑禁声。"
 tv_engineering_department.7169.a:0 "这阵冷清太过刺眼。"
 tv_engineering_department.7170.t:0 "[tv_wonder_construction|E]：劳工血汗越过界线"
 tv_engineering_department.7170.d:0 "一次过度赶工造成了严重伤亡，血和石粉一起留在未完成的部件旁。建设地点劳工付出惨痛代价，任何关于宏伟的词句都暂时说不出口。"
 tv_engineering_department.7170.a:0 "这不是能被石粉盖住的事。"
 tv_engineering_department.7171.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]说服街市"
 tv_engineering_department.7171.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]没有只谈石料，而是亲自向行会、乡绅和工头解释奇观的用途。一场原本可能散成争吵的集会被压成了赞同，[tv_wonder_domestic_support|E]因此猛然上扬。\n\n#G 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力高于80。#!"
 tv_engineering_department.7171.a:0 "把这场说服写进工程日志。"
 tv_engineering_department.7172.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]重定宏图"
 tv_engineering_department.7172.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]把旧图摊在泥地上，亲手划掉了几条让人困惑的轴线。新的尺度安排让宏愿与地形重新咬合，[tv_wonder_scale_competence|E]大幅提升。\n\n#G 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力高于80。#!"
 tv_engineering_department.7172.a:0 "批准这份更大胆的总图。"
 tv_engineering_department.7173.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]重排工序"
 tv_engineering_department.7173.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]用半日时间拆开了整个工地的排程，再把它按真正的先后关系装回去。工棚里的等待和互相推诿突然少了许多，[tv_wonder_organization_competence|E]随之大幅改善。\n\n#G 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力高于80。#!"
 tv_engineering_department.7173.a:0 "让工程师的排程成为新规。"
 tv_engineering_department.7174.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]打开运道"
 tv_engineering_department.7174.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]亲自沿着运道走了一遍，随后把桥板、驿夫和仓位重新排成一张清楚的网。[tv_wonder_logistics_competence|E]大幅提升，工地终于能预先知道明日会到什么。\n\n#G 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力高于80。#!"
 tv_engineering_department.7174.a:0 "照工程师的线路调度车马。"
 tv_engineering_department.7175.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]推进主工段"
 tv_engineering_department.7175.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]把最熟练的几支队伍集中到当前部件，并亲自重新安排吊装顺序。石层越过旧标线，[tv_wonder_construction|E]进度大幅推进。\n\n#G 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力高于80。#!"
 tv_engineering_department.7175.a:0 "照工程师的节奏推进主工段。"
 tv_engineering_department.7176.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]安定民议"
 tv_engineering_department.7176.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]补上了工地与民众之间最刺耳的几处误会。传令更清楚，征调更有分寸，[tv_wonder_domestic_support|E]也随之稳稳抬升。\n\n#G 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力高于50。#!"
 tv_engineering_department.7176.a:0 "让工程师继续稳住人心。"
 tv_engineering_department.7177.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]校准尺度"
 tv_engineering_department.7177.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]发现总图里一处迟早会拖慢全局的收束，并在施工前将它校正。[tv_wonder_scale_competence|E]因此更稳，工程也少了一份未来的尴尬。\n\n#G 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力高于50。#!"
 tv_engineering_department.7177.a:0 "采纳工程师的尺度修正。"
 tv_engineering_department.7178.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]理顺名册"
 tv_engineering_department.7178.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]在名册中找到了几处长期无人承认的空白。补上责任人之后，[tv_wonder_organization_competence|E]稳步提高，连书记的墨水都少浪费了一些。\n\n#G 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力高于50。#!"
 tv_engineering_department.7178.a:0 "按工程师的名册重新点人。"
 tv_engineering_department.7179.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]疏通车队"
 tv_engineering_department.7179.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]找出了车队总在同一处误时的原因，并把那里改成真正的交接点。[tv_wonder_logistics_competence|E]随之改善，抱怨声至少少了一种。\n\n#G 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力高于50。#!"
 tv_engineering_department.7179.a:0 "按工程师的办法疏通转运。"
 tv_engineering_department.7180.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]补上关键榫口"
 tv_engineering_department.7180.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]在一处反复卡住的连接点上做出修正，使后续工段重新接续。[tv_wonder_construction|E]进度因此稳步提升。\n\n#G 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力高于50。#!"
 tv_engineering_department.7180.a:0 "让工程师补上这处关键榫口。"
 tv_engineering_department.7181.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]押注公议"
 tv_engineering_department.7181.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]决定把一项尚未完工的阶段成果展示给众人。这可能换来信任，也可能把未完成的瑕疵暴露得太早；[tv_wonder_domestic_support|E]正在等待街巷裁决。\n\n#Y 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力处于20到80之间。#!"
 tv_engineering_department.7181.a:0 "押上工程师的公众判断。"
 tv_engineering_department.7182.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]放大蓝图"
 tv_engineering_department.7182.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]坚持把一段设计放大到原先无人敢签字的程度。它可能让奇观获得配得上野心的尺度，也可能让工程背上过大的身躯。\n\n#Y 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力处于20到80之间。#!"
 tv_engineering_department.7182.a:0 "让工程师赌一赌更大的轮廓。"
 tv_engineering_department.7183.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]改写排班"
 tv_engineering_department.7183.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]下令把三支熟练队伍临时拆散，分插到最拖后的工段。这可能立刻治好堵点，也可能让所有人都忘了原本该听谁的。\n\n#Y 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力处于20到80之间。#!"
 tv_engineering_department.7183.a:0 "用工程师的新排班赌一轮。"
 tv_engineering_department.7184.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]改走险路"
 tv_engineering_department.7184.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]命令转运队伍绕开拥堵官道，改走一条尚未完全压实的新路。这条路可能成为捷径，也可能成为下一封坏消息的开头。\n\n#Y 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力处于20到80之间。#!"
 tv_engineering_department.7184.a:0 "准许工程师改走这条险路。"
 tv_engineering_department.7185.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]试行新工法"
 tv_engineering_department.7185.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]决定在当前部件上试行一套更快但容错更低的工法。成功时它会像灵感，失败时它会像傲慢。\n\n#Y 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力处于20到80之间。#!"
 tv_engineering_department.7185.a:0 "允许工程师试行这套新工法。"
 tv_engineering_department.7186.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]漏算库银"
 tv_engineering_department.7186.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]把吊装和石料算得分毫不差，却低估了每一次临时采购会怎样啃食国库。账册还能勉强合上，只是合上时声音很重。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7186.a:0 "叫工程师重新看账。"
 tv_engineering_department.7187.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]轻慢名分"
 tv_engineering_department.7187.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]把宫廷礼制当成可以挪动的脚手架，却忘了名分一旦拆动就会留下痕迹。工程保住了节奏，[legitimacy|E]却被磨薄。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7187.a:0 "提醒工程师敬畏名分。"
 tv_engineering_department.7188.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]误触安宁"
 tv_engineering_department.7188.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]只看见调度表上的空格，却没有看见村镇日常能承受多少扰动。工地得到了人手，[stability|E]却被拉扯了一下。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7188.a:0 "让工程师听一听地方官。"
 tv_engineering_department.7189.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]误伤声望"
 tv_engineering_department.7189.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]过早宣布了一项尚未稳固的成果。当细节被追问时，工程还能解释，[prestige|E]却先红了脸。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7189.a:0 "让工程师少说多做。"
 tv_engineering_department.7190.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]怠慢贵族"
 tv_engineering_department.7190.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]安排车马时忘了给几家贵族留下体面。物资到了，脸色也到了，贵族的[estate_satisfaction|E]随之受损。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7190.a:0 "让工程师补上礼数。"
 tv_engineering_department.7191.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]触犯祭坛"
 tv_engineering_department.7191.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]把祭日当成普通日程来排，直到教士们用沉默提醒工地并非万事皆可调度。教士的[estate_satisfaction|E]因此受损。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7191.a:0 "让工程师记住祭历。"
 tv_engineering_department.7192.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]压住商街"
 tv_engineering_department.7192.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]为了赶料，要求商街连续几日替工地让路。货物到了，市民的[estate_satisfaction|E]却被堵在路口。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7192.a:0 "让工程师给商人让出路来。"
 tv_engineering_department.7193.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]低估乡里"
 tv_engineering_department.7193.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]在排程上看见的是可用人手，在村社里留下的却是缺席的父兄。平民的[estate_satisfaction|E]因此受损。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7193.a:0 "让工程师重新数一数农时。"
 tv_engineering_department.7194.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]拆错街区"
 tv_engineering_department.7194.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]把一处看似碍事的街区划入拆改范围，却低估了它对当地日常的支撑。建设地点[development|E]因此受损。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7194.a:0 "让工程师重新画拆改线。"
 tv_engineering_department.7195.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]扰乱工址生计"
 tv_engineering_department.7195.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]把当地所有便利都视作工程供应链的一部分。工地更顺了，建设地点[prosperity|E]却被挤得发皱。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7195.a:0 "让工程师给生意留路。"
 tv_engineering_department.7196.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]误拆首都余裕"
 tv_engineering_department.7196.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]从首都调走一批关键匠人时，没有意识到他们原本支撑着多少既定工程。首都[development|E]因此受损。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7196.a:0 "让工程师归还首都匠人。"
 tv_engineering_department.7197.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]扰乱王城市声"
 tv_engineering_department.7197.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]为了让材料准时到达，强行改写了首都几条重要商路的节奏。工地听见车轮声，王城却少了市声。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7197.a:0 "让工程师放过几条商路。"
 tv_engineering_department.7198.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]误判劳役极限"
 tv_engineering_department.7198.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]把劳工当作排程上可以延展的线，却忘了人的筋骨不会按墨线弯曲。伤病增加，建设地点劳工为这次误判付出代价。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于50。#!"
 tv_engineering_department.7198.a:0 "让工程师重新计算人的极限。"
 tv_engineering_department.7199.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]拖垮账册"
 tv_engineering_department.7199.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]批准了一连串本可避免的急购，把国库推到不得不补洞的境地。工地没有停下，账册却替它摔了一跤。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于20。#!"
 tv_engineering_department.7199.a:0 "让这笔烂账成为训诫。"
 tv_engineering_department.7200.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]折损王命"
 tv_engineering_department.7200.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]让一项工程命令越过了礼制能承受的界线。工地得到了一时方便，王命却替这份方便付出沉重代价。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于20。#!"
 tv_engineering_department.7200.a:0 "把王命从工地泥水里抬出来。"
 tv_engineering_department.7201.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]搅乱地方"
 tv_engineering_department.7201.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]连续改变征调安排，使地方官还没解释完上一道命令就收到下一道。安宁被搅碎，[stability|E]也随之下跌。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于20。#!"
 tv_engineering_department.7201.a:0 "把混乱从排程里剔除。"
 tv_engineering_department.7202.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]毁了体面"
 tv_engineering_department.7202.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]把一场施工失误变成了公开笑柄。石头可以重砌，[prestige|E]却不能用同一把凿子修好。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于20。#!"
 tv_engineering_department.7202.a:0 "先把宫廷脸面救回来。"
 tv_engineering_department.7203.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]激怒贵族"
 tv_engineering_department.7203.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]把贵族的让步当成理所当然，直到他们决定用冷硬的礼貌回应。工程仍有车马，国家却少了贵族的好脸色。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于20。#!"
 tv_engineering_department.7203.a:0 "去安抚那些被轻慢的纹章。"
 tv_engineering_department.7204.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]冒犯教士"
 tv_engineering_department.7204.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]在不合时宜的地点开工，让祭坛旁的人把锤声听成冒犯。工程抢到了一日，教士的[estate_satisfaction|E]却失去许多。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于20。#!"
 tv_engineering_department.7204.a:0 "把工地从祭坛前退开。"
 tv_engineering_department.7205.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]惹恼市民"
 tv_engineering_department.7205.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]把商人的仓库视为工地附属，直到市民决定用公开怨声追回界线。这次误判让市民的[estate_satisfaction|E]狠狠下跌。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于20。#!"
 tv_engineering_department.7205.a:0 "把仓库钥匙还给市民。"
 tv_engineering_department.7206.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]压垮村社"
 tv_engineering_department.7206.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]把劳役推过了乡里能承受的边界。工地多了人，村社少了耐心，平民的[estate_satisfaction|E]随之重挫。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于20。#!"
 tv_engineering_department.7206.a:0 "把劳役从乡里肩上卸下一些。"
 tv_engineering_department.7207.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]伤及工址"
 tv_engineering_department.7207.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]为赶工拆掉了太多工址周边的骨架。奇观得到空间，当地发展却被硬生生削下一层。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于20。#!"
 tv_engineering_department.7207.a:0 "停止继续啃食工址。"
 tv_engineering_department.7208.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]熄了工址市声"
 tv_engineering_department.7208.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]连续改变道路和供给安排，使工址周边的生意无处落脚。繁荣被施工声压低，损失已经无法装作寻常。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于20。#!"
 tv_engineering_department.7208.a:0 "把市声从锤声下救出来。"
 tv_engineering_department.7209.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]掏空首都安排"
 tv_engineering_department.7209.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]把首都的修缮安排拆成了奇观的备用零件。工地暂时顺利，首都发展却被掏出一个清楚的洞。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于20。#!"
 tv_engineering_department.7209.a:0 "停止拆解首都的未来。"
 tv_engineering_department.7210.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]压熄首都繁荣"
 tv_engineering_department.7210.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]连续从首都市场抽走周转能力，让繁荣像火盆一样被人掀开。奇观的供应稳住了，首都[prosperity|E]却明显下跌。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于20。#!"
 tv_engineering_department.7210.a:0 "把市声还给首都。"
 tv_engineering_department.7211.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E]酿成伤亡"
 tv_engineering_department.7211.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName]批准了一次过于凶狠的赶工，结果让伤亡越过了所有人能轻描淡写的界线。奇观继续沉默地上升，劳工却倒在它脚下。\n\n#R 该事件出现是因为当前[tv_great_engineer|E]的等效军事能力低于20。#!"
 tv_engineering_department.7211.a:0 "停止这场带血的赶工。"
