 tv_engineering_department.7119.t:0 "[tv_wonder_construction|E]：车队迟滞，还是银箱吃紧"
 tv_engineering_department.7119.d:0 "雨后的车辙陷得太深，码头上的货堆又一次比工地的耐心更高，同时国库已经为本季度的各项开销列满注脚，任何额外支出都要从别处拔钉。若让工程自己吞下这口气，车队会继续误点，工匠也会继续等着看空车回来；若把压力推出围栏，钱箱会发出比反对声更清楚的回响。参事们都能说明两边为何必要，却没有人能把账页变干净。"
 tv_engineering_department.7119.a:0 "让转运先退一步，免得国库被拖下水。"
 tv_engineering_department.7119.b:0 "保住转运，把压力推给国库。"
 tv_engineering_department.7120.t:0 "[tv_wonder_construction|E]：车队迟滞，还是名分受损"
 tv_engineering_department.7120.d:0 "雨后的车辙陷得太深，码头上的货堆又一次比工地的耐心更高，同时王命若为一处工段反复背书，名分本身也会被拖进泥水里。若让工程自己吞下这口气，车队会继续误点，工匠也会继续等着看空车回来；若把压力推出围栏，[legitimacy|E]会在每一道催工诏令后变薄。参事们都能说明两边为何必要，却没有人能把账页变干净。"
