 tv_engineering_department.7058.d:0 "当地客栈、作坊和交易被转向工地这个巨口。工程部门趁这阵并不体面的余裕，换来桥、仓、驿路和准时抵达的车队。于是石料木材开始按工地真正需要的速度抵达，但围栏外的街声低了下去。这笔账说得通，却绝不会自己消失。"
 tv_engineering_department.7058.a:0 "动用本地繁荣，换取转运。"
 tv_engineering_department.7058.b:0 "让这个月安静过去。"
 tv_engineering_department.7059.t:0 "[tv_wonder_construction|E]：挪用首都积累，换运道畅通"
 tv_engineering_department.7059.d:0 "首都修缮与扩建被推迟，熟练工和材料转投奇观。工程部门趁这阵并不体面的余裕，换来桥、仓、驿路和准时抵达的车队。于是石料木材开始按工地真正需要的速度抵达，但首都会记住哪些承诺被延后。这笔账说得通，却绝不会自己消失。"
 tv_engineering_department.7059.a:0 "动用首都工程，换取转运。"
 tv_engineering_department.7059.b:0 "让这个月安静过去。"
 tv_engineering_department.7060.t:0 "[tv_wonder_construction|E]：借首都商气，换运道畅通"
 tv_engineering_department.7060.d:0 "王城市场、信用和仓储被拉向工地。工程部门趁这阵并不体面的余裕，换来桥、仓、驿路和准时抵达的车队。于是石料木材开始按工地真正需要的速度抵达，但首都街道为远处石头低声下来。这笔账说得通，却绝不会自己消失。"
 tv_engineering_department.7060.a:0 "动用首都商气，换取转运。"
 tv_engineering_department.7060.b:0 "让这个月安静过去。"
 tv_engineering_department.7061.t:0 "[tv_wonder_construction|E]：压上劳工筋骨，换运道畅通"
 tv_engineering_department.7061.d:0 "劳工被要求把班次、休息和安全余量拉到舒适之外。工程部门趁这阵并不体面的余裕，换来桥、仓、驿路和准时抵达的车队。于是石料木材开始按工地真正需要的速度抵达，但疲惫身体记账比书记更严。这笔账说得通，却绝不会自己消失。"
 tv_engineering_department.7061.a:0 "动用劳工，换取转运。"
 tv_engineering_department.7061.b:0 "让这个月安静过去。"
 tv_engineering_department.7062.t:0 "[tv_wonder_construction|E]：国库拨款，换工程突进"
 tv_engineering_department.7062.d:0 "司库打开预备金箱，把原本留给军饷、赈济和宫廷修缮的硬币拨往工地。工程部门趁这阵并不体面的余裕，换来额外人手、更长班次和足以立刻推进的材料。于是未完成的石头实实在在地接近完工，但空出的账格会被每个有眼睛的官员看见。这笔账说得通，却绝不会自己消失。"
 tv_engineering_department.7062.a:0 "动用国库，换取进度。"
 tv_engineering_department.7062.b:0 "让这个月安静过去。"
 tv_engineering_department.7063.t:0 "[tv_wonder_construction|E]：王命背书，换工程突进"
 tv_engineering_department.7063.d:0 "宫廷把王命压在工程布告上，使反对者暂时不敢高声质问。工程部门趁这阵并不体面的余裕，换来额外人手、更长班次和足以立刻推进的材料。于是未完成的石头实实在在地接近完工，但被当作脚手架使用的权威，很难原样收回。这笔账说得通，却绝不会自己消失。"
 tv_engineering_department.7063.a:0 "动用王命，换取进度。"
 tv_engineering_department.7063.b:0 "让这个月安静过去。"
 tv_engineering_department.7064.t:0 "[tv_wonder_construction|E]：扰动乡里，换工程突进"
 tv_engineering_department.7064.d:0 "地方秩序被临时拨开，好让车队、工队和文书不用等待。工程部门趁这阵并不体面的余裕，换来额外人手、更长班次和足以立刻推进的材料。于是未完成的石头实实在在地接近完工，但乡里会记住日常生活何时为远处的石头弯折。这笔账说得通，却绝不会自己消失。"
 tv_engineering_department.7064.a:0 "动用秩序，换取进度。"
 tv_engineering_department.7064.b:0 "让这个月安静过去。"
