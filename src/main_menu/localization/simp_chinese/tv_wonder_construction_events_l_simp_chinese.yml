 tv_engineering_department.7175.d:0 "奇观工程对国家施加的压力比预想更重，首先显现在正统性上。随后，人们又开始低声谈论：任何宏伟纪念碑都会投下实际的阴影。工程仍在继续，但国家已经记起壮丽从不会只寄来一张账单。"
