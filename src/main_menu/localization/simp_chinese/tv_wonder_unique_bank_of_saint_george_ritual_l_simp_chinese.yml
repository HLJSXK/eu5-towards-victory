 tv_engineering_department.1670.t:0 "公债账簿的召集"
 tv_engineering_department.1670.d:0 "总督的官员、长老会、商人债权人、公证人、铸币官与关税承包人齐聚一堂，筹建一份有资金支持的公共债务：一份由抵押收入担保的统一公债账簿，将在数年间自行偿清，而非永远悬而未决。"
 tv_engineering_department.1670.a:0 "召集公债会议。"
 tv_engineering_department.1671.t:0 "创立宪章"
 tv_engineering_department.1671.d:0 "三份宪章将以不同方式为整合后的债务提供资金。保守偿债基金借贷最少、增长最慢，但创立成本最低、偿还也最稳妥。均衡公债以中等速度借贷更多。激进整合大举借贷以一次性偿清旧债，创立成本高昂，每月偿付负担也更重。"
 tv_engineering_department.1671.a:0 "保守偿债基金宪章。（国库 -2；债务较小、抵押较少、进度从容。）"
 tv_engineering_department.1671.b:0 "均衡公债宪章。（国库 -4；债务与抵押适中。）"
 tv_engineering_department.1671.c:0 "激进整合宪章。（国库 -7；债务最大、抵押最重，但偿清速度最快。）"
 tv_engineering_department.1672.t:0 "账簿会议的召集"
 tv_engineering_department.1672.d:0 "随着公债账簿逐步推进，债权人与官员组成的会议会定期审视其进度。债务可以被推动更快偿清，也可以按宪章原定的节奏自行运行。"
 tv_engineering_department.1672.race_close.d:0 "重组期限已经临近，账簿仍未清偿完毕。若不果断推动，这份公债恐将被迫按期重组，而非按会议自身的条件偿清。"
 tv_engineering_department.1672.a:0 "从国库拨付一笔款项以提前偿还债务。（国库 -5）"
 tv_engineering_department.1672.b:0 "永久性地征调更多抵押收入。"
 tv_engineering_department.1672.c:0 "维持现状，不作改变。"
 tv_engineering_department.1673.t:0 "圣乔治的印信"
 tv_engineering_department.1673.d:0 "无论是提前偿清、按期偿清、历经长久耐心偿清，还是在期限届满时被迫重组，公债账簿如今都已封印。圣乔治对热那亚公共信贷、抵押收入与货币信用的权威由此永久确立。"
 tv_engineering_department.1673.a:0 "封印公债账簿。"
