 tv_engineering_department.1670.t:0 "圣乔治的账簿誓言"
 tv_engineering_department.1670.d:0 "总督的官员、商人债权人、公证人、铸币官与关税承包人齐聚账簿誓言之前。三份宪章草案供创立者权衡：债权人特权、王室监管与商人开放准入。"
 tv_engineering_department.1670.a:0 "开启账簿誓言。"
 tv_engineering_department.1671.t:0 "债权人、王室或公开市场"
 tv_engineering_department.1671.d:0 "每份宪章都要接受议事会信任度的检验：债权人特权宪章面向战争债权人，王室监管宪章面向王室官员，商人开放准入宪章面向更广泛的贸易公众。"
 tv_engineering_department.1671.a:0 "衡量议事会对每份宪章的信任。"
 tv_engineering_department.1672.t:0 "信任的初次考验"
 tv_engineering_department.1672.d:0 "债权人越权、王室的不信任，或公开市场的违约压力，都可能在银行的印信获得信任之前使某份宪章蒙上污点。"
 tv_engineering_department.1672.a:0 "遏制越权并重新协商。"
 tv_engineering_department.1672.b:0 "坚持宪章原案并承担代价。"
 tv_engineering_department.1673.t:0 "圣乔治的印信"
 tv_engineering_department.1673.d:0 "创立宪章已经封印。债权人、王室官员与商人如今都承认圣乔治银行对债务、税收与货币信用的权威。"
 tv_engineering_department.1673.a:0 "封印创立宪章。"
 tv_engineering_department.1674.t:0 "抵押名册开启"
 tv_engineering_department.1674.d:0 "旧战债、关税、盐税、港口通行税、货币成色检验与档案卷宗，全部开放供抵押登记，随后公共账簿方可取信于人。"
 tv_engineering_department.1674.a:0 "开启抵押名册。"
 tv_engineering_department.1675.t:0 "债务、税捐与档案库"
 tv_engineering_department.1675.d:0 "每项抵押都要接受信用的衡量：旧战债对照过往违约记录，关税与盐税对照走私风险，港口通行税对照港口流量，货币成色检验对照剪边货币，档案卷宗对照火灾与虫蛀。"
 tv_engineering_department.1675.a:0 "衡量每项抵押的信用。"
 tv_engineering_department.1676.t:0 "一项抵押陷入疑云"
 tv_engineering_department.1676.d:0 "一笔违约的债务、一批走私货物，或一卷腐坏的档案，都可能使某项抵押在账簿获得兑现之前变得一文不值。"
 tv_engineering_department.1676.a:0 "以国库储备作担保。"
 tv_engineering_department.1676.b:0 "将账簿范围缩减至已验证的收入来源。"
 tv_engineering_department.1677.t:0 "账簿获得兑现"
 tv_engineering_department.1677.d:0 "旧战债、关税、盐税、港口通行税、货币成色检验与档案卷宗，全部抵押进入如今受公众信任的账簿。"
 tv_engineering_department.1677.a:0 "兑现账簿。"
