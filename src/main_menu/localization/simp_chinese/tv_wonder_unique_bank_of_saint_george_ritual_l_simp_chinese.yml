 tv_engineering_department.1012.t:0 "抵押清册开启"
 tv_engineering_department.1012.d:0 "宪章既已宣誓，更艰难的工作随之而来：让账簿具备足以借贷的信誉。关税包税人、盐税官员、港口通行税征收人、铸币检验官与国家档案的看管人齐聚银行大厅，各自携来一项共和国可能用以抵押的岁入账目。仅凭旧日战争债务无法支撑银行的信用，还需加入商人们能够信赖的税收与通行费。"
 tv_engineering_department.1012.a:0 "开启抵押清册。"
 tv_engineering_department.1013.t:0 "债务、税捐与档案库"
 tv_engineering_department.1013.d:0 "各项抵押逐一被权衡：最初促成组合成立的旧日战争债务、每艘商船通过防波堤时缴纳的关税、各处市场征收的盐税、港口锁链处课取的通行税、为每一枚铸造杜卡特验明真伪的铸币检验，以及记录历来每一笔借贷的档案卷宗。抵押过多会拖累共和国自身的财库，抵押过少又会让必须信赖此账簿的人们觉得它空洞无物。"
 tv_engineering_department.1013.a:0 "分配抵押清册各项。"
 tv_engineering_department.1014.t:0 "一项抵押陷入疑虑"
 tv_engineering_department.1014.d:0 "分配的墨迹未干，一项抵押已然动摇：盐税出现短缺，验币中传出剪削劣币的流言，又或某位关税包税人无法按期缴清本季应付之数。若置之不理，一项抵押的失信便可能蔓延至整本账簿，银行的违约风险也随着每一周悬而未决的短缺不断攀升。"
 tv_engineering_department.1014.a:0 "以国库储备为该项抵押作保。"
 tv_engineering_department.1014.b:0 "收缩抵押范围，仅留已证明稳妥的岁入。"
 tv_engineering_department.1015.t:0 "账簿获得兑现"
 tv_engineering_department.1015.d:0 "有争议的抵押终获解决，档案卷宗盖上银行印记封存，从旧日战争债务到铸币检验的每一项岁入如今都被记录为已兑现的担保。商人、关税包税人乃至总督自己的国库，都能指着这本账簿信赖其所载之言。圣乔治银行的公共信用不再只是一句承诺，而是共和国自身绝不违约的债务。"
 tv_engineering_department.1015.a:0 "兑现抵押清册。"
 tv_engineering_department.1854.t:0 "圣乔治的账簿誓约"
 tv_engineering_department.1854.d:0 "在港口旁的银行大厅里，总督官员、长老议员、商人债主、公证人、铸币官、关税包税人与持械卫兵齐聚账簿之前。热那亚纠缠不清的战争债务与躁动的债权人已无法再以私人组合的形式维持，共和国决意将其束缚为一个可宣誓的机构。在铸出任何钱币、写下任何宪章之前，誓约本身必须先行开启。"
 tv_engineering_department.1854.a:0 "开启账簿誓约。"
 tv_engineering_department.1855.t:0 "债权人、王权，还是自由市场"
 tv_engineering_department.1855.d:0 "桌上摆着三份草案：一份《债权人特权宪章》让组合旧日债主对账簿享有优先索偿权，一份《王权监督宪章》让总督官员审核每一笔入账，一份《开放商人准入宪章》让任何商行都能以同等条件入股银行。三条路径许诺的都是同一种公共信用，却把信任与责任交到不同人手中。公证人正等着抄录创立者最终宣誓的那份草案。"
 tv_engineering_department.1855.a:0 "选定创立宪章。"
 tv_engineering_department.1856.t:0 "信任的第一道考验"
 tv_engineering_department.1856.d:0 "墨迹未干，宪章已受到考验。享有特权的债主开始向铸币厂发号施令；受监督的王室官员本该安抚商行，却令其惊惧；又或开放准入招来了银行尚无法核实的抵押。无论宣誓的是哪一支路径，银行大厅此刻回荡着偏袒、猜忌与迫近违约的指控。"
 tv_engineering_department.1856.a:0 "遏制越权行为，重新协商宪章条款。"
 tv_engineering_department.1856.b:0 "坚持宪章原样，承受相应的政治代价。"
 tv_engineering_department.1857.t:0 "圣乔治的印玺"
 tv_engineering_department.1857.d:0 "宪章在齐聚的官员、债主与商人面前正式盖印，一枚刚经检验的钱币被置于账簿之旁，以证明信任已然恢复。公证人将宣誓条款誊入档案，关税包税人将宪章张贴于港口城门，圣乔治银行由此成为公共权威，而非私人组合。热那亚的公共信用如今有了名号、印玺与统一的声音。"
 tv_engineering_department.1857.a:0 "盖印公共信用。"
