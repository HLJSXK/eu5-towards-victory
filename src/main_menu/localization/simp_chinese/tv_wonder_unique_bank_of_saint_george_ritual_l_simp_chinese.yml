 tv_engineering_department.1670.t:0 "圣乔治的账簿誓言"
 tv_engineering_department.1670.d:0 "总督的官员、商人债权人、公证人、铸币官与关税承包人齐聚账簿誓言之前。在誓言宣读之前，必须先选定三份创立宪章之一。"
 tv_engineering_department.1670.a:0 "开启账簿誓言。"
 tv_engineering_department.1671.t:0 "债权人、王室或公开市场"
 tv_engineering_department.1671.d:0 "债权人特权偏重战争债权人，但会使旧战债与货币成色检验陷入风险。王室监管偏重王室官员，但会使关税与盐税陷入风险。商人开放准入偏重更广泛的贸易公众，但会使港口通行税与档案卷宗陷入风险。"
 tv_engineering_department.1671.a:0 "债权人特权宪章。"
 tv_engineering_department.1671.b:0 "王室监管宪章。"
 tv_engineering_department.1671.c:0 "商人开放准入宪章。"
 tv_engineering_department.1672.t:0 "信任的初次考验"
 tv_engineering_department.1672.d:0 "被所选宪章置于风险中的抵押品如今陷入疑云。国库可以直接为其担保，也可以将账簿缩减至从未受质疑的收入来源。"
 tv_engineering_department.1672.a:0 "以国库储备作担保。（国库 -3）"
 tv_engineering_department.1672.b:0 "将账簿缩减至已验证的收入来源。"
 tv_engineering_department.1673.t:0 "圣乔治的印信"
 tv_engineering_department.1673.d:0 "创立宪章已经封印。债权人、王室官员与商人如今都承认圣乔治银行对债务、税收与货币信用的权威。"
 tv_engineering_department.1673.a:0 "封印创立宪章。"
