 io_opinion_tv_diplomatic_alliance: "同在外交联盟中"

 # ── 调整值类型 ──────────────────────────────────────────────────────────
 MODIFIER_TYPE_NAME_tv_alliance_advocator_can_participate_in_parliament: "倡导者可参与议会"
 MODIFIER_TYPE_DESC_tv_alliance_advocator_can_participate_in_parliament: "外交联盟的倡导者可参与该国议会。"
 MODIFIER_TYPE_NAME_tv_alliance_advocator_agenda_impact: "倡导者议程影响"
 MODIFIER_TYPE_DESC_tv_alliance_advocator_agenda_impact: "调整倡导者议程对外交联盟运作的影响程度。"

 # ── 效果提示 ────────────────────────────────────────────────────────────
 tv_create_diplomatic_alliance_tt: "组建外交联盟，所有现有支持国将成为创始成员。"

 tv_diplomatic_alliance_desc: "外交联盟是一个由致力于外交霸权的国家组成的宏大联盟。在倡导者的领导下，联盟协调对外政策，建立共同协议，并就成员国合作法律进行投票。"

 # ── 法律类别描述 ────────────────────────────────────────────────────────
 tv_court_protocol_desc: "决定联盟成员之间的外交礼仪水平与合法性认可程度。"
 tv_information_network_desc: "管理联盟内部情报、地图测绘与通讯共享方式。"
 tv_commerce_consensus_desc: "为联盟成员制定海洋贸易、贸易协议及航行权利规则。"
 tv_faith_harmony_desc: "决定联盟对宗教宽容和意识形态凝聚力的立场。"
 tv_colonization_sphere_desc: "规定联盟成员如何划定和尊重彼此的殖民势力范围。"

 # ── 国家互动 — 寻求外交支持 ────────────────────────────────────────────
 dip_tv_seek_diplomatic_support_CATEGORY: "CATEGORY_FRIENDLY_ACTIONS"
 tv_seek_diplomatic_support_act: "寻求[SCOPE.sCountry('recipient').GetName]的外交支持。"
 tv_seek_diplomatic_support_effect_text: "[SCOPE.sCountry('actor').GetName]获得了[SCOPE.sCountry('recipient').GetName]的外交支持。"
