 MODIFIER_TYPE_NAME_tv_alliance_advocator_agenda_impact: "$tv_alliance_advocator$议程影响"
 MODIFIER_TYPE_DESC_tv_alliance_advocator_agenda_impact: "修正由$tv_alliance_advocator$集团提出的[parliament_agendas|e]所拥有的支持度。"
 tv_alliance_member_status: "[tv_diplomatic_alliance|E]成员"
 tv_alliance_member_status_desc: "[tv_diplomatic_alliance|E]中的投票成员。"
