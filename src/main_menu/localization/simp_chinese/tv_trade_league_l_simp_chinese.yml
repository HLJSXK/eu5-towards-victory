 tv_trade_customs_union_law: "关税同盟"
 tv_trade_customs_union_law_desc: "联盟统一关税与账册，以地方财政控制为代价，换取更顺畅的贸易。"
 tv_trade_customs_ledgers_policy: "共享关税账册"
 tv_trade_customs_ledgers_policy_desc: "各港交换税率与豁免清单，贸易更通畅，但地方监管有所松动。"
 tv_trade_customs_bureau_policy: "联盟海关局"
 tv_trade_customs_bureau_policy_desc: "常设海关机构执行共同账册，在不增加新义务的情况下扩大同类收益。"
 tv_trade_customs_code_policy: "强制关税法典"
 tv_trade_customs_code_policy_desc: "联盟推行有约束力的关税法典，大幅改善贸易，同时抬高商人阶层权势。"

 tv_trade_maritime_convoys_law: "海运护航"
 tv_trade_maritime_convoys_law_desc: "联盟组织海上航线护卫，用水手与海军维护成本换取更安全的商业。"
 tv_trade_private_convoys_policy: "特许私人护航"
 tv_trade_private_convoys_policy_desc: "私人船长获得护航许可，扩大海贸范围，但会消耗水手。"
 tv_trade_league_escorts_policy: "联盟护航署"
 tv_trade_league_escorts_policy_desc: "联盟机构协调护航班期，进一步放大同类海运收益。"
 tv_trade_armed_convoys_policy: "武装护航令"
 tv_trade_armed_convoys_policy_desc: "武装护航成为强制制度，打开远方航路，但水手与海军预算都会吃紧。"

 tv_trade_merchant_courts_law: "商事法庭"
 tv_trade_merchant_courts_law_desc: "商业纠纷转入共同法庭，以行政开支换取商人容量和内陆贸易效率。"
 tv_trade_arbitration_panels_policy: "港口仲裁庭"
 tv_trade_arbitration_panels_policy_desc: "港口仲裁庭能快速解决契约纠纷，但需要更多宫廷支出。"
 tv_trade_league_courts_policy: "联盟商事法庭"
 tv_trade_league_courts_policy_desc: "常设商事法庭扩大同类商业优势，且不再增加额外成本。"
 tv_trade_commercial_code_policy: "约束性商法典"
 tv_trade_commercial_code_policy_desc: "有约束力的商法典极大偏向联盟贸易，但其强硬边界会惹恼外国外交官。"

 tv_trade_staple_monopolies_law: "集散垄断"
 tv_trade_staple_monopolies_law_desc: "联盟保留关键集散市场，提高贸易中心力量与收入，但压缩进口灵活性。"
 tv_trade_registered_staples_policy: "登记集散市场"
 tv_trade_registered_staples_policy_desc: "登记制度把贸易集中到认可市场，增加收入，却削弱进口灵活性。"
 tv_trade_league_staples_policy: "联盟集散特许"
 tv_trade_league_staples_policy_desc: "联盟特许加深对集散市场的控制，放大同类商业收益。"
 tv_trade_exclusive_staples_policy: "排他集散权"
 tv_trade_exclusive_staples_policy_desc: "排他权让集散市场变得强大，但消费者与各阶层都会感到被挤压。"

 tv_trade_investment_code_law: "投资法典"
 tv_trade_investment_code_law_desc: "联盟规范海外金融，使海外建设更便宜，但会增加官僚负担。"
 tv_trade_counting_house_loans_policy: "账房贷款"
 tv_trade_counting_house_loans_policy_desc: "商人银行资助海外事业，改善生产和海外建设成本，同时增加官僚维护。"
 tv_trade_joint_stock_charters_policy: "合股特许"
 tv_trade_joint_stock_charters_policy_desc: "合股特许放大同一套投资机制，而不继续抬高行政负担。"
 tv_trade_permanent_factories_policy: "常设海外商馆"
 tv_trade_permanent_factories_policy_desc: "常设商馆会重塑联盟海外投资，但官僚体系和地方控制都会受损。"

