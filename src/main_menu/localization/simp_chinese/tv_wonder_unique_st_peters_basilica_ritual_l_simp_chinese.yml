 tv_engineering_department.1678.t:0 "为彼得墓寻找监护人"
 tv_engineering_department.1678.d:0 "在门槛开启之前，必须先任命一位枢机总务、一位教区主教、一位圣物监护人、一位施赈长官与一位艺匠咏礼司铎，各自执掌使徒墓上的圣职。"
 tv_engineering_department.1678.a:0 "开始任命官员。"
 tv_engineering_department.1679.t:0 "钥匙的授予"
 tv_engineering_department.1679.d:0 "每个圣职都要接受考验：总务的账目、主教的教规、监护人对圣物的照料、长官对施赈的诚实，以及司铎对委托艺术品的判断。"
 tv_engineering_department.1679.a:0 "衡量每位官员的表现。"
 tv_engineering_department.1680.t:0 "首次丑闻"
 tv_engineering_department.1680.d:0 "一件失踪的圣物、一笔被挪用的施赈款，或一位结党的主教，都可能在奉献礼进行之前使该圣职蒙羞。"
 tv_engineering_department.1680.a:0 "调查并惩处该圣职。"
 tv_engineering_department.1680.b:0 "对此不予追究，转而举行较小规模的奉献礼。"
 tv_engineering_department.1681.t:0 "神圣圣职获得确认"
 tv_engineering_department.1681.d:0 "枢机总务、教区主教、圣物监护人、施赈长官与艺匠咏礼司铎，全部在使徒墓上的圣职中获得确认。"
 tv_engineering_department.1681.a:0 "确认神圣圣职。"
 tv_engineering_department.1682.t:0 "监护人身后的门扉"
 tv_engineering_department.1682.d:0 "在新任官员身后，圣物清册、施赈账簿、朝圣门槛、唱诗职务与小圣堂赞助，都必须妥善安排，大教堂才能承担起完整的使徒职责。"
 tv_engineering_department.1682.a:0 "开始安排使徒职责。"
 tv_engineering_department.1683.t:0 "职责分派"
 tv_engineering_department.1683.d:0 "每项职责都在神职人员与俗务人员之间分派：圣物清册被编目，施赈账簿被核平，朝圣门槛配备了人手，唱诗职务排定了班次，小圣堂赞助也已指派。"
 tv_engineering_department.1683.a:0 "在人员之间分派职责。"
 tv_engineering_department.1684.t:0 "穹顶下的私语"
 tv_engineering_department.1684.d:0 "一件被误计的圣物、一本不平的账簿，或一处闲置的唱诗职务，都会在穹顶下引发关于疏于职守的私语。"
 tv_engineering_department.1684.a:0 "纠正疏漏并重新核查。"
 tv_engineering_department.1684.b:0 "悄悄缩减该职责的范围。"
 tv_engineering_department.1685.t:0 "使徒门槛封印"
 tv_engineering_department.1685.d:0 "圣物清册、施赈账簿、朝圣门槛、唱诗职务与小圣堂赞助均已就绪，使徒门槛在获得承认的神职义务下完成封印。"
 tv_engineering_department.1685.a:0 "封印使徒门槛。"
