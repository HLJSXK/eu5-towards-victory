 tv_engineering_department.5055.t:0 "彼得墓的守护者"
 tv_engineering_department.5055.d:0 "穹顶已高耸于使徒墓穴之上，但没有指定守护者的巴西利卡只是一座纪念碑。在门槛开启之前，罗马必须选定谁来为这座墓穴负责：或是拥有全权的枢机管理人，或是扎根牧灵关怀的教区主教，或是亲自守卫忏悔室的圣髑守护人，或是核算每一笔奉献的施舍总监，或是守护建筑荣光可读性的艺术教士。每位候选人都带着自己的追随者，而穹顶将铭记第一个握有钥匙之人。"
 tv_engineering_department.5055.a:0 "开启彼得守护者的甄选。"
 tv_engineering_department.5056.t:0 "钥匙的呈递"
 tv_engineering_department.5056.d:0 "五只手同时伸向同一个职位。枢机管理人拥有无可匹敌的权威，却首先要向教廷负责；教区主教拥有牧灵上的正当性，却对圣髑与施舍的掌控有限；圣髑守护人对忏悔室的照看无可指摘，却在教士中缺乏地位；施舍总监的账目清晰透明，却在圣职权威上底气不足；艺术教士能让巴西利卡配得上这座穹顶，却把职责当作装饰。罗马必须在正当性、能力与派系之间权衡，才能将钥匙交到某一人手中。"
 tv_engineering_department.5056.a:0 "任命神圣官员。"
 tv_engineering_department.5057.t:0 "第一桩丑闻"
 tv_engineering_department.5057.d:0 "无论钥匙落入谁手，那只手的弱点如今暴露无遗。圣髑账目不清，施舍流入私囊，朝圣者被拒于门槛之外，或某派系的靠山被发现把忏悔室当作自身野心的舞台。若过错无人问责，落成便无法进行；但若彻查到底，罗马刚刚授予的权威本身也可能因此受损。"
 tv_engineering_department.5057.a:0 "彻查并惩戒该官员。"
 tv_engineering_department.5057.b:0 "对过错既往不咎，缩小落成的名义。"
 tv_engineering_department.5058.t:0 "圣职的确立"
 tv_engineering_department.5058.d:0 "丑闻已被回应或消化，守护者的权威经受住了第一次考验。教士、圣髑守护者与信众如今都明白谁在为彼得之墓发言，落成仪式得以凭此名义继续进行。罗马将这一职位确立为对巴西利卡每一项神圣职能的实际管辖，而非一个虚衔。"
 tv_engineering_department.5058.a:0 "确立神圣官员的职责。"
 tv_engineering_department.7317.t:0 "守护者身后的诸门"
 tv_engineering_department.7317.d:0 "一位官员如今握有钥匙，但仅凭钥匙无法运转一座巴西利卡。在高坛之后，还有许多无法由一人独自承担的职责等待安排：守护墓穴的圣髑清册、供养贫民与建筑本身的施舍账簿、必须判定谁可接近的朝圣门槛、维持时辰颂唱的唱诗职务，以及仍有小家族觊觎的礼拜堂赞助权。罗马必须先决定这些职责如何分配，巴西利卡才能称得上是使徒真正运作的居所。"
 tv_engineering_department.7317.a:0 "开启使徒职责名册。"
 tv_engineering_department.7318.t:0 "职责的分授"
 tv_engineering_department.7318.d:0 "在神圣官员的印信之下，各项职责被逐一托付。文书被派去管理圣髑清册，宣誓的稽核员接管施舍账簿，守门人被安置在朝圣门槛处，领唱者被分配到唱诗职务，而某座礼拜堂的赞助权则被授予或拒绝那些提出请求的家族。每一次托付本身都是一份小小的宪章，也都可能各自被恪守或背弃。"
 tv_engineering_department.7318.a:0 "托付使徒职责。"
 tv_engineering_department.7319.t:0 "穹顶下的低语"
 tv_engineering_department.7319.d:0 "被托付的职责之一在自身的重压下开始动摇。圣髑文书说不清一件圣物匣的下落，施舍账簿出现可疑的亏空，朝圣者抱怨被无端拒之门外，唱诗职务陷入混乱，或某个赞助家族被发现把自家礼拜堂当成私产经营。巴西利卡对纪律化服务的宣称，其可信度取决于这最薄弱的一项职责能否得到回应。"
 tv_engineering_department.7319.a:0 "惩戒此过失并恢复账目。"
 tv_engineering_department.7319.b:0 "对此过失听之任之，缩小落成的名义。"
 tv_engineering_department.7320.t:0 "使徒门槛的封印"
 tv_engineering_department.7320.d:0 "圣髑已清点，施舍已入账，朝圣者依序获准进入，唱诗班按时辰咏唱，每座礼拜堂的赞助权也已尘埃落定，巴西利卡的诸项职责至此汇成一份完整运作的宪章。彼得之墓不再只是供人瞻仰的穹顶，而是信众可以倚赖的一项服务。罗马封印这道门槛，让使徒宗座就此敞开。"
 tv_engineering_department.7320.a:0 "封印使徒门槛。"
