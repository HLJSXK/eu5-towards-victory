 tv_engineering_department.1678.t:0 "圣座空缺"
 tv_engineering_department.1678.d:0 "圣墓门槛、高坛与圣库均已备妥，但自上一任总铎的任期结束以来，总铎之位一直空缺。在此职位被填补、并在日后一再重新填补之前，大教堂无法被奉献给一个真正运作的机构。"
 tv_engineering_department.1678.a:0 "开启继任程序。"
 tv_engineering_department.1679.t:0 "圣座的填补"
 tv_engineering_department.1679.d:0 "每当圣座空缺，罗马都必须再次决定该职位的威望要如何交到下一任手中。教皇任命使职位保持稳固而平淡。教士团投票选举带来热忱与更快的积累，但需付出政治代价，且会损耗此前积累的部分威望。任命一位族人为助祭则能以最快速度增益职位权柄，但会损耗神职人员的善意。"
 tv_engineering_department.1679.strong.d:0 "圣座的威望已然广受认可。无论谁接掌此职，都将继承一个正处于权柄巅峰的职位——无论这是福是祸。"
 tv_engineering_department.1679.final_risk.d:0 "这是圣座封印之前的最后一任，而迄今其威望至多平平。此刻的任命，将是在最终定论之前提升圣座权柄的最后真正机会。"
 tv_engineering_department.1679.a:0 "以教皇诏令任命总铎。"
 tv_engineering_department.1679.b:0 "通过教士团选举总铎。（声望 -2）"
 tv_engineering_department.1679.c:0 "任命一位族人为助祭。（神职阶层满意度代价）"
 tv_engineering_department.1680.t:0 "不曾断绝的圣座"
 tv_engineering_department.1680.d:0 "总铎之位已历经三任，每一次交接的方式都塑造了其权柄的走向。无论经由任命、选举还是任人唯亲所积累的一切，如今都已被封存于大教堂的永久地位之中。"
 tv_engineering_department.1680.a:0 "封印使徒的继任。"
