 # 文艺展演法律
 tv_arts_exhibition_laws: "文艺展演法律"
 TV_ARTS_EXHIBITION_LAWS_LAW_CATEGORY: "文艺展演法律"
 TV_ARTS_LAWS_TAB: "艺术法律"

 tv_arts_patronage_law: "艺术赞助制度"
 tv_arts_patronage_law_desc: "国家决定由谁为艺术付费，谁的品味成为公共权威，谁来定义这个时代的审美。"
 tv_arts_church_patronage_policy: "教会赞助"
 tv_arts_church_patronage_policy_desc: "教堂、修道院与宗教基金会主导艺术劳动。宗教整合与教士影响上升，世俗实验空间收窄。"
 tv_arts_court_patronage_policy: "宫廷赞助"
 tv_arts_court_patronage_policy_desc: "君主直接资助艺术家与大型工程。合法性与宫廷威望提升，但王室家计必须承担这份辉煌。"
 tv_arts_noble_patronage_policy: "贵族赞助"
 tv_arts_noble_patronage_policy_desc: "显贵家族经营私人艺术圈与庄园文化。地方多样性与贵族权力增长，中央控制则被削弱。"
 tv_arts_commercial_patronage_policy: "商业赞助"
 tv_arts_commercial_patronage_policy_desc: "商人、行会与城市买家成为艺术主要消费者。城市与新艺术家更繁荣，但赞助活动会分流常规贸易收入。"
 tv_arts_state_academy_patronage_policy: "国家学院体系"
 tv_arts_state_academy_patronage_policy_desc: "国家通过官方学院培养并管理艺术家。标准与技艺提升，自由创造则被压入官方形式。"

 tv_arts_organization_law: "艺术组织结构"
 tv_arts_organization_law_desc: "本法决定艺术家是工匠、宫廷仆役、独立大师，还是皇家学校训练出的精英。"
 tv_arts_guild_system_policy: "行会体系"
 tv_arts_guild_system_policy_desc: "艺术家以工匠身份受行会与学徒制管理。生产稳定，新晋艺术家训练更狭窄，新风格推进缓慢。"
 tv_arts_court_workshops_policy: "宫廷工坊"
 tv_arts_court_workshops_policy_desc: "大型工坊直接向国家负责。巨型工程与国家控制改善，但宫廷维护开支上升。"
 tv_arts_independent_masters_policy: "独立大师制"
 tv_arts_independent_masters_policy_desc: "艺术家自由接受委托并经营声名。创新与人才涌现增加，但也更容易出现纷争与不稳。"
 tv_arts_royal_academy_policy: "皇家学院"
 tv_arts_royal_academy_policy_desc: "理论、考试与标准化教育塑造精英艺术家。官方审美更强，地方流派空间缩小。"

 tv_arts_official_purpose_law: "官方艺术目的"
 tv_arts_official_purpose_law_desc: "国家指定公共艺术的最高目的：信仰、王权、教化、外交竞争，或真理。"
 tv_arts_glory_of_god_policy: "荣耀神明"
 tv_arts_glory_of_god_policy_desc: "艺术服务礼拜与信仰传播。改宗与教士信心提升，异端容忍降低。"
 tv_arts_praise_monarch_policy: "歌颂君主"
 tv_arts_praise_monarch_policy_desc: "艺术被用于塑造统治者形象。合法性与威望受益，但宫廷展示需要经费。"
 tv_arts_educate_people_policy: "教化人民"
 tv_arts_educate_people_policy_desc: "公共图像与表演传播道德和秩序。最大识字率与社会安定改善，同时带来少量行政支出。"
 tv_arts_display_civilization_policy: "彰显文明"
 tv_arts_display_civilization_policy_desc: "艺术成为国际比较的工具。文化影响与外交声望提升，也会吸引竞争者更多注视。"
 tv_arts_seek_truth_policy: "追求真理"
 tv_arts_seek_truth_policy_desc: "艺术家与解剖、数学、自然哲学结合。科研与识字受益，传统教会盟友则更不安。"

 tv_arts_censorship_law: "审查与艺术自由"
 tv_arts_censorship_law_desc: "国家决定艺术必须多么服从官方意识形态，以及私人想象能走多远。"
 tv_arts_strict_censorship_policy: "严格审查"
 tv_arts_strict_censorship_policy_desc: "所有公共艺术必须符合官方教义。稳定改善，艺术生态则不再肥沃。"
 tv_arts_licensed_creation_policy: "特许创作"
 tv_arts_licensed_creation_policy_desc: "艺术家获得许可后方可发表。国家保有控制，文化影响提高，但宫廷监管开支也会上升。"
 tv_arts_court_tolerance_policy: "宫廷宽容"
 tv_arts_court_tolerance_policy_desc: "实验被允许存在于宫廷圈层之内。更优秀的人才出现，但宫廷派系与各阶层更难取悦。"
 tv_arts_free_creation_policy: "自由创作"
 tv_arts_free_creation_policy_desc: "市场与个人意志主导艺术生活。创新与思想迅速传播，也带来更高动荡风险。"

 tv_arts_city_aesthetics_law: "建筑与城市美学"
 tv_arts_city_aesthetics_law_desc: "本法决定城市服务于实用、信仰、王权奇观、古典秩序，还是地方自由。"
 tv_arts_utilitarian_city_policy: "实用主义"
 tv_arts_utilitarian_city_policy_desc: "城市强调功能与经济效率。建设更便宜，文化景观则更朴素。"
 tv_arts_religious_city_policy: "宗教城市"
 tv_arts_religious_city_policy_desc: "城市生活围绕教堂、圣所与仪式路线展开。改宗事业受益，世俗容忍下降。"
 tv_arts_royal_axis_policy: "王权轴线"
 tv_arts_royal_axis_policy_desc: "广场、宫殿与纪念碑塑造王权秩序。威望与控制上升，但公共展示开销不小。"
 tv_arts_classical_planning_policy: "古典规划"
 tv_arts_classical_planning_policy_desc: "几何与理性布局支配城市。行政与控制改善，僵硬标准也抬高建设成本。"
 tv_arts_mixed_autonomy_policy: "混合自治"
 tv_arts_mixed_autonomy_policy_desc: "城市自由发展自身地方风格。多样性与发展增长，最大控制力下降。"

 tv_arts_knowledge_media_law: "知识传播媒介"
 tv_arts_knowledge_media_law_desc: "国家选择图像与知识通过手工、雕版、活字，还是国家许可印刷传播。"
 tv_arts_manuscripts_frescoes_policy: "手抄与壁画"
 tv_arts_manuscripts_frescoes_policy_desc: "知识依靠手抄与墙面图像传播。传统与宗教保持强势，思潮扩散缓慢。"
 tv_arts_woodblock_printing_policy: "雕版印刷"
 tv_arts_woodblock_printing_policy_desc: "图像与宗教文本通过雕版流通。信仰传播与出版范围扩大，旧形式权威略降。"
 tv_arts_movable_type_policy: "活字出版"
 tv_arts_movable_type_policy_desc: "书籍与小册子快速传播。识字与思潮扩散显著增长，也带来危险观念的扰动。"
 tv_arts_state_publishing_policy: "国家出版体系"
 tv_arts_state_publishing_policy_desc: "国家控制印刷与许可。宣传和秩序增强，异端与制度扩散受到压制。"

 tv_arts_state_ritual_law: "国家仪式美学"
 tv_arts_state_ritual_law_desc: "本法设定国家典礼的视觉语言：节制、神圣敬畏、盛大奇观，或公共参与。"
 tv_arts_plain_ritual_policy: "朴素礼仪"
 tv_arts_plain_ritual_policy_desc: "典礼保持节制与传统。宫廷开支下降，威望增长也更慢。"
 tv_arts_religious_ritual_policy: "宗教仪式化"
 tv_arts_religious_ritual_policy_desc: "国家典礼高度神圣化。宗教权威与教士满意上升，容忍空间缩小。"
 tv_arts_baroque_court_ritual_policy: "巴洛克宫廷仪式"
 tv_arts_baroque_court_ritual_policy_desc: "盛大庆典与视觉奇观宣示权力。威望与合法性大幅增长，财政负担也极重。"
 tv_arts_enlightenment_festival_policy: "启蒙公共庆典"
 tv_arts_enlightenment_festival_policy_desc: "庆典歌颂国家、人民与公共理性。合法性与识字上升，贵族则怨恨权威转移。"

 tv_arts_science_relation_law: "艺术与科学关系"
 tv_arts_science_relation_law_desc: "国家决定艺术继续依赖工艺，采用数学，服务工程，还是与自然科学合流。"
 tv_arts_craft_tradition_policy: "技艺传统"
 tv_arts_craft_tradition_policy_desc: "艺术依赖经验与传承技法。传统与技艺保持稳定，理论发展放缓。"
 tv_arts_mathematical_perspective_policy: "数学透视学"
 tv_arts_mathematical_perspective_policy_desc: "几何、透视与比例进入艺术训练。艺术与科学思维改善，同时显著增加宫廷支出。"
 tv_arts_royal_engineering_art_policy: "皇家工程艺术"
 tv_arts_royal_engineering_art_policy_desc: "艺术直接服务国家工程与军事建设。建设速度和防御改善，官僚维护更昂贵。"
 tv_arts_scientific_aesthetic_unity_policy: "科学美学统一"
 tv_arts_scientific_aesthetic_unity_policy_desc: "艺术与自然科学共同发展。科研与文化影响提升，传统宗教赞助人的信心进一步下降。"

 # 通用动作名称及说明
 tv_host_domestic_exhibition: "举办国内展出"
 tv_host_domestic_exhibition_desc: "在选定地点开启一场[tv_domestic_exhibition|e]。需要至少5件艺术品，花费缩放金钱，建造文艺展览会，并以80点[tv_local_exhibition_enthusiasm|e]开始。"
 tv_local_exhibition_add_artworks: "增加更多展品"
 tv_local_exhibition_add_artworks_desc: "该动作已整合进\"扩大展览规模\"。"
 tv_local_exhibition_royal_visit: "国王亲临！"
 tv_local_exhibition_royal_visit_desc: "统治者亲自参观展览，立即增加10点[tv_local_exhibition_enthusiasm|e]，并触发一项宫廷结果。每次展览限用一次。"
 tv_local_exhibition_radical_art: "宣扬激进的艺术理念！"
 tv_local_exhibition_radical_art_desc: "让先锋艺术不受拘束地登场。结果可能点燃公众、动摇国家，也可能毁掉一件艺术品。1年冷却。"
 tv_local_exhibition_expand: "扩大展览规模！"
 tv_local_exhibition_expand_desc: "投入下一批展品，花费缩放金钱×1，并从任一当前[tv_domestic_exhibition|e]地点相邻的本国地点中选择一个新地点。将在新地点建造文艺展览会，并增加10点[tv_local_exhibition_enthusiasm|e]。所需未投入藏品数量将从5提升至10，之后固定为20。无冷却。"
 tv_local_exhibition_sell_art: "王室贩卖艺术品！"
 tv_local_exhibition_sell_art_desc: "摧毁一件随机拥有的艺术品，并获得缩放金钱。1年冷却。"
 tv_local_exhibition_recruit_artists: "招揽更多艺术家！"
 tv_local_exhibition_recruit_artists_desc: "消耗威望吸引新艺术家入廷。大多数来者资质平平，但也可能有天才应召而来。1年冷却。"
 tv_local_exhibition_invite_foreign_artist: "邀请国外艺术家参与！"
 tv_local_exhibition_invite_foreign_artist_desc: "请求另一个国家派出一名艺术家参与[tv_domestic_exhibition|e]。若对方同意，东道国获得威望，本国展览获得10点[tv_local_exhibition_enthusiasm|e]。每次展览限用一次。"
 tv_local_exhibition_designate_treasure: "指定镇馆之宝！"
 tv_local_exhibition_designate_treasure_desc: "消耗威望，将一件选定艺术品的品质提高10，并增加10点[tv_local_exhibition_enthusiasm|e]。每次展览限用一次。"
 tv_local_exhibition_live_creation: "举行现场创作大会！"
 tv_local_exhibition_live_creation_desc: "召集艺术家在公众面前现场创作。大会可能磨砺技艺、伤及自信、激起热情，或诞生新的艺术品。1年冷却。"
 tv_start_arts_exchange: "开启艺术交流会"
 tv_start_arts_exchange_desc: "开启一场由[tv_chief_artist|e]主持、持续一年的[tv_arts_exchange|e]。花费缩放金钱×2，需要[tv_chief_artist|e]且至少拥有两位在世艺术家，无冷却。"
 tv_invite_domestic_arts_exchange_artist: "邀请国内艺术家"
 tv_invite_domestic_arts_exchange_artist_desc: "花费缩放金钱×1，说服另一位国内艺术家加入当前[tv_arts_exchange|e]。参会者没有数量上限。"
 tv_invite_foreign_arts_exchange_artist: "邀请国外艺术家"
 tv_invite_foreign_arts_exchange_artist_desc: "花费缩放金钱×1.5，邀请一位国外艺术家加入当前[tv_arts_exchange|e]。先选择国家，再选择该国一位可用艺术家。"

