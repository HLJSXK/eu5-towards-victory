 # 文艺展演事件
 tv_arts_exhibition.10.t: "艺术家已出发"
 tv_arts_exhibition.10.d.1: "我们的艺术家已踏上巡演之旅。命运给了他们一段短暂的任务——此次展演预计持续#bold 1年#!。"
 tv_arts_exhibition.10.d.2: "我们的艺术家已踏上巡演之旅。此次展演预计持续#bold 2年#!。"
 tv_arts_exhibition.10.d.3: "我们的艺术家已踏上巡演之旅。此次展演预计持续#bold 3年#!。"
 tv_arts_exhibition.10.d.4: "我们的艺术家已踏上巡演之旅。此次展演预计持续#bold 4年#!。"
 tv_arts_exhibition.10.d.5: "我们的艺术家已踏上巡演之旅。此次展演预计持续#bold 5年#!。"
 tv_arts_exhibition.10.d.6: "我们的艺术家已踏上巡演之旅。此次展演预计持续#bold 6年#!。"
 tv_arts_exhibition.10.d.7: "我们的艺术家已踏上巡演之旅。此次展演预计持续#bold 7年#!。"
 tv_arts_exhibition.10.d.8: "我们的艺术家已踏上巡演之旅。此次展演预计持续#bold 8年#!。"
 tv_arts_exhibition.10.d.9: "我们的艺术家已踏上巡演之旅。此次展演预计持续#bold 9年#!。"
 tv_arts_exhibition.10.d.10: "我们的艺术家已踏上巡演之旅。命运给了他们一段漫长的任务——此次展演预计持续#bold 10年#!。"
 tv_arts_exhibition.10.d.default: "我们的艺术家已出发前往海外展演，巡演正式开始。"
 tv_arts_exhibition.10.a: "期待他们归来。"

 tv_arts_exhibition.1.t: "盛大国内展出"
 tv_arts_exhibition.1.d: "展厅大门已经开启。织锦垂入烛光，圣匣被擦拭一新，手稿翻到最明亮的一页，第一批访客已涌入厅堂。只要公众的惊叹尚未熄灭，这场展览便将考验王国的品味、钱袋与耐心。"
 tv_arts_exhibition.1.a: "让他们前来惊叹吧。"
 tv_arts_exhibition.1.tt: "[tv_domestic_exhibition|E]已经开始。"

 tv_arts_exhibition.5.t: "艺术家载誉归来"
 tv_arts_exhibition.5.d: "我们的艺术家已结束在海外的展演，满载新体验与开阔的视野，从异国宫廷回归故土。"
 tv_arts_exhibition.5.a: "欢迎归来。"

 tv_arts_exhibition.6.t: "艺术家客死他乡"
 tv_arts_exhibition.6.d: "噩耗从远方传来：我们派往异国展演的艺术家，在归国之前不幸离世。"
 tv_arts_exhibition.6.a: "这是艺术界的巨大损失。"

 tv_arts_exhibition.7.t: "首席艺术家已逝世"
 tv_arts_exhibition.7.d: "我们的首席艺术家已经离世。该职位现已空缺；在我们任命继承人之前，文艺展演将在没有首席艺术家的情况下继续运作。"
 tv_arts_exhibition.7.a: "我们必须物色新的首席艺术家。"

 tv_arts_exhibition.8.t: "首席艺术家出访"
 tv_arts_exhibition.8.d: "我们的首席艺术家已经启程前往海外巡演。既然其职责已远离本国宫廷，他们便不再适合继续担任首席艺术家。该职位将暂时空缺，直到我们任命继任者。"
 tv_arts_exhibition.8.a: "我们会适时任命继任者。"

 tv_arts_exhibition.101.t: "展演：反响平平"
 tv_arts_exhibition.101.d: "消息传来，我们的巡演艺术家所到之处受到了礼貌而平淡的接待——既非大获成功，亦非糟糕透顶。但仍赢得了些许国际关注。"
 tv_arts_exhibition.101.a: "至少引起了注意。"

 tv_arts_exhibition.102.t: "展演：大获成功！"
 tv_arts_exhibition.102.d: "捷报传来！我们的巡演艺术家令异国宫廷为之倾倒，本国艺术才华的美名正在边境之外广为流传。"
 tv_arts_exhibition.102.a: "我们的名声在遥远的殿堂中回响。"

 tv_arts_exhibition.103.t: "展演：糟糕透顶"
 tv_arts_exhibition.103.d: "令人汗颜的消息传来：我们的巡演艺术家遭到了嘲讽与鄙视。这场丢脸的展演对我们的海外声誉造成了一定损害。"
 tv_arts_exhibition.103.a: "此事不必再提。"

 tv_arts_exhibition.104.t: "艺术家被异国聘用！"
 tv_arts_exhibition.104.d: "惊人消息传来：我们的巡演艺术家深深打动了东道主，对方已邀请其长期留任。尽管我们就此失去了一位才俊，但此等殊荣所带来的声望已远播四方。"
 tv_arts_exhibition.104.a: "苦乐参半的荣誉。"

 tv_arts_exhibition.105.t: "艺术家灵感爆发！"
 tv_arts_exhibition.105.d: "异域文化的熏陶在我们的巡演艺术家身上激发出了非凡的创造力。其技艺的升华是在本国永远无法实现的，他们将以焕然一新的热忱继续创作。"
 tv_arts_exhibition.105.a: "艺术超越国界。"

 # ── 月度特殊事件（201-205） ────────────────────────────────────────────────────
 tv_arts_exhibition.201.t: "文化的桥梁"
 tv_arts_exhibition.201.d: "我们的巡演艺术家在异国的存在远不止于展示作品——他们打动了人心。外国宫廷对我国充满好感，而我们亦以同样的温情回应。"
 tv_arts_exhibition.201.a: "艺术所建之桥，外交难以企及。"

 tv_arts_exhibition.202.t: "展览令全城倾倒"
 tv_arts_exhibition.202.d: "我们艺术家的作品令东道城市焕然一新。来自周边乡野的访客纷纷涌入，只为亲眼目睹这场盛展，为街头带来了勃勃生机与商业活力。"
 tv_arts_exhibition.202.a: "愿城市因此繁荣。"

 tv_arts_exhibition.203.t: "贵族赞助人现身"
 tv_arts_exhibition.203.d: "东道宫廷一位富裕贵族深受我们艺术家的感染，慷慨出资在展演地修建了一座宏伟剧院——这将成为我国文化影响力的长久见证。"
 tv_arts_exhibition.203.a: "我们的艺术将铭刻于砖石之上。"

 tv_arts_exhibition.204.t: "大师间的交流"
 tv_arts_exhibition.204.d: "我们的巡演艺术家与当地一位大师数周以来相互切磋技艺，两人均从彼此身上汲取到了独自无法成就的精进。"
 tv_arts_exhibition.204.a: "最伟大的艺术不分国界。"

 tv_arts_exhibition.205.t: "海外丑闻：盗窃与悲剧"
 tv_arts_exhibition.205.d: "大祸临头。我们的艺术家显然被异国作品迷了心窍，竟试图从东道宫廷盗取一件珍宝，当场被擒，死于混乱之中。画作毁于一旦，我国声名蒙羞。"
 tv_arts_exhibition.205.a: "我国的至暗时刻。"

 # ── 归国特殊事件（120-124） ──────────────────────────────────────────────────
 tv_arts_exhibition.120.t: "带着纪念品归来"
 tv_arts_exhibition.120.d: "我们的艺术家归来了——而且并非两手空空。行囊中藏着一件来自东道宫廷的艺术品，据称是赠予之物。无论真相如何，它如今已为我国所有。"
 tv_arts_exhibition.120.a: "为我们的藏品添上精彩一笔。"

 tv_arts_exhibition.121.t: "归国：一部新的杰作"
 tv_arts_exhibition.121.d: "这段旅程彻底改变了我们的艺术家。几乎刚踏上归途，他们便再度执笔，创作出一幅深邃而隽永的新作——这是他们在异国所见所感的见证。"
 tv_arts_exhibition.121.a: "让我们为他们的归来而庆贺。"

 tv_arts_exhibition.122.t: "归国：异域的启示"
 tv_arts_exhibition.122.d: "我们的艺术家归来时，带回的不仅是记忆。对异国技艺的细心观察，被认真记录在案，为我国学者提供了新的思路，将加速我们自身的探索步伐。"
 tv_arts_exhibition.122.a: "知识亦能旅行。"

 tv_arts_exhibition.123.t: "归国：艺术家的安息"
 tv_arts_exhibition.123.d: "我们的艺术家年迈而满足地归来。漫长的海外岁月已将他们消磨殆尽，他们在故土悄然离世，留下的作品将使其名字永垂不朽。"
 tv_arts_exhibition.123.a: "愿他们安息。"

 tv_arts_exhibition.124.t: "归国：慷慨的临别馈赠"
 tv_arts_exhibition.124.d: "东道宫廷满怀温情地送我们的艺术家踏上归途，并附上一份丰厚的礼金——以感谢多年来为他们带来光彩的文化交流。"
 tv_arts_exhibition.124.a: "多情的惜别。"

 # ── 本地展览事件 ─────────────────────────────────────────────────────────────
 tv_arts_exhibition.310.t: "展览冷清落幕"
 tv_arts_exhibition.310.d: "人群渐稀，灯火低垂，侍从甚至在最后一批访客离开前便开始遮盖展品。展览持续了[ROOT.GetVariable('tv_local_exhibition_last_duration').GetValue|0]个月，产出了[ROOT.GetVariable('tv_local_exhibition_last_reward').GetValue|0]点[tv_cip|e]，但反响平平使我们损失10点威望。"
 tv_arts_exhibition.310.a: "品味的教训并不便宜。"
 tv_arts_exhibition.311.t: "尚可称道的展览"
 tv_arts_exhibition.311.d: "这场展览在[ROOT.GetVariable('tv_local_exhibition_last_duration').GetValue|0]个月后走向尾声。它未能成为传奇，却也足以在城市记忆中留下痕迹：获得[ROOT.GetVariable('tv_local_exhibition_last_reward').GetValue|0]点[tv_cip|e]。"
 tv_arts_exhibition.311.a: "这是一份体面的成绩。"
 tv_arts_exhibition.312.t: "令人铭记的展览"
 tv_arts_exhibition.312.d: "在[ROOT.GetVariable('tv_local_exhibition_last_duration').GetValue|0]个月里，展览吸引了赞助人、批评家与模仿者。它的声名如今越过举办城市，带来[ROOT.GetVariable('tv_local_exhibition_last_reward').GetValue|0]点[tv_cip|e]与10点威望。"
 tv_arts_exhibition.312.a: "我们的厅堂替我们说了好话。"
 tv_arts_exhibition.313.t: "艺术的凯旋"
 tv_arts_exhibition.313.d: "展览持续了[ROOT.GetVariable('tv_local_exhibition_last_duration').GetValue|0]个月，并成为奇观本身。它的落幕不像结束，倒像一场游行：获得[ROOT.GetVariable('tv_local_exhibition_last_reward').GetValue|0]点[tv_cip|e]、15点威望，并为举办地留下繁荣余韵。"
 tv_arts_exhibition.313.a: "这将被长久铭记。"

 tv_arts_exhibition.320.t: "厅堂金资不足"
 tv_arts_exhibition.320.d: "典礼官提醒我们，乐师、卫兵、灯烛与修复师都不能只靠掌声过活。此刻打开钱袋，方能保住今夜的热度。"
 tv_arts_exhibition.320.a: "支付厅堂所需。"
 tv_arts_exhibition.320.b: "让今夜缩小些吧。"
 tv_arts_exhibition.321.t: "批评家索要姿态"
 tv_arts_exhibition.321.d: "诗人与鉴赏家私下议论，真正的赞助人理应更大胆地献身于展览。一点公开的威望让步，或可让尖舌变成号角。"
 tv_arts_exhibition.321.a: "用名声换取名声。"
 tv_arts_exhibition.321.b: "随他们低语。"
 tv_arts_exhibition.322.t: "贵族席位空置"
 tv_arts_exhibition.322.d: "数个贵族家族不满座次、请柬，也许只是彼此不满。私下致歉会损害贵族满意度，却能让前排重新闪耀。"
 tv_arts_exhibition.322.a: "安抚贵族。"
 tv_arts_exhibition.322.b: "他们的缺席自会被看见。"
 tv_arts_exhibition.323.t: "反对虚荣的布道"
 tv_arts_exhibition.323.d: "一位知名神职人员警告说，没有谦卑的美只是一条通往罪恶的抛光道路。谨慎让步或可平息讲坛，让信众重新踏入展厅。"
 tv_arts_exhibition.323.a: "安抚教士。"
 tv_arts_exhibition.323.b: "画作会作答。"
 tv_arts_exhibition.324.t: "商人清点摊位"
 tv_arts_exhibition.324.d: "供应画框、颜料、长凳与印刷告示的市民如今要求更好的条件。向他们让步会损害满意度，却能维持展览周边的热闹市集。"
 tv_arts_exhibition.324.a: "与市民议定条件。"
 tv_arts_exhibition.324.b: "没有他们，展会也能继续。"
 tv_arts_exhibition.325.t: "大门外的人群"
 tv_arts_exhibition.325.d: "平民访客抱怨这场展览更属于天鹅绒袖子，而非粗糙的双手。增加开放时段会激怒地方显贵、拖累平民，却能重燃公众热情。"
 tv_arts_exhibition.325.a: "为普通人腾出位置。"
 tv_arts_exhibition.325.b: "大门照旧。"
 tv_arts_exhibition.326.t: "秩序的问题"
 tv_arts_exhibition.326.d: "赞美展览的小册子如今赞美得太多：新风尚、新自由、新真理。牺牲一点稳定，便能让这股热潮不受打断。"
 tv_arts_exhibition.326.a: "允许思想发酵。"
 tv_arts_exhibition.326.b: "压低这些议论。"
 tv_arts_exhibition.327.t: "投向王冠的疑影"
 tv_arts_exhibition.327.d: "有廷臣称，展览已成了宫廷中的宫廷，在那里品味压倒血统。王室让步会损伤正统性，却能把丑闻重新变成奇观。"
 tv_arts_exhibition.327.a: "王冠可为美而弯。"
 tv_arts_exhibition.327.b: "王冠不会弯折。"
 tv_arts_exhibition.328.t: "举办地献出砖石"
 tv_arts_exhibition.328.d: "举办地若要继续扩展展览，就必须将工坊、院落与实用房舍让给画廊与步道。发展度将受损，但热情会随之高涨。"
 tv_arts_exhibition.328.a: "将砖石化作华彩。"
 tv_arts_exhibition.328.b: "保持城市原貌。"
 tv_arts_exhibition.329.t: "以繁荣点燃节庆"
 tv_arts_exhibition.329.d: "若由本地仓储、行会与住户共同承担，展览便可化为全城庆典。繁荣会像灯油一样被消耗。"
 tv_arts_exhibition.329.a: "让城市明亮燃烧。"
 tv_arts_exhibition.329.b: "不要挥霍城市的好运。"

 tv_arts_exhibition.340.t: "统治者目光清明"
 tv_arts_exhibition.340.d: "在拥挤的厅堂中，统治者停在一件晦涩作品前，给出了出人意料的精准评判。宫廷听见的不是背熟的恭维，而是真正的判断。"
 tv_arts_exhibition.340.a: "更锐利的眼光配得上更锐利的王冠。"
 tv_arts_exhibition.341.t: "王室失言"
 tv_arts_exhibition.341.d: "统治者在错误的作品前停留，赞美了错误的作者，又问出一个无人能不尴尬回答的问题。厅堂记住了这一刻。"
 tv_arts_exhibition.341.a: "沉默本会更仁慈。"
 tv_arts_exhibition.342.t: "王冠受到喝彩"
 tv_arts_exhibition.342.d: "统治者的到访成了一幅和谐画面：王冠、艺术与人民，共处同一座彩绘穹顶之下。"
 tv_arts_exhibition.342.a: "正统性在公众光芒中闪耀。"
 tv_arts_exhibition.343.t: "王冠受到嘲弄"
 tv_arts_exhibition.343.d: "蜡烛尚未冷却，讽刺作家便抓住了王室参观的细节。本意是赞助，结果却成了笑料。"
 tv_arts_exhibition.343.a: "拥挤厅堂中的王冠格外沉重。"
 tv_arts_exhibition.350.t: "激进宣言"
 tv_arts_exhibition.350.d: "新的宣言像刀刃划破画布般撕开惯例。青年欢呼，老人退缩，国家本身也为之震颤。"
 tv_arts_exhibition.350.a: "让艺术搅动世界。"
 tv_arts_exhibition.351.t: "新风尚"
 tv_arts_exhibition.351.d: "昨日还显得危险的言辞，今日忽然成了时髦。展厅里挤满了急于宣称自己最先理解它的人。"
 tv_arts_exhibition.351.a: "新奇找到了自己的时刻。"
 tv_arts_exhibition.352.t: "公众转身离去"
 tv_arts_exhibition.352.d: "言辞跑在艺术前面。访客困惑离去，赞助人愤然退场，展览热情随之冷却。"
 tv_arts_exhibition.352.a: "锋刃割错了方向。"
 tv_arts_exhibition.353.t: "一件作品被毁"
 tv_arts_exhibition.353.d: "在表演、抗议与掌声交织的混乱中，一件艺术品遭到不可挽回的损毁。再激昂的宣言也无法使其复原。"
 tv_arts_exhibition.353.a: "过度的代价。"
 tv_arts_exhibition.354.t: "一位平凡的新艺术家"
 tv_arts_exhibition.354.d: "招揽令得到了一只勤勉之手的回应：或许不是天才，但懂得工作，也懂得倾听。"
 tv_arts_exhibition.354.a: "工坊里有他的位置。"
 tv_arts_exhibition.355.t: "卓越者抵达"
 tv_arts_exhibition.355.d: "一位罕见的才俊几乎毫无预兆地抵达，带着草图，也带着同等分量的自信。宫廷能感到房间的空气变了。"
 tv_arts_exhibition.355.a: "给他空间与赞助。"
 tv_arts_exhibition.356.t: "无人问津"
 tv_arts_exhibition.356.d: "信使带回的是礼貌的拒绝、陈旧的借口，以及那些早已受雇于别处的艺术家的沉默。"
 tv_arts_exhibition.356.a: "空荡的工作室已经说明一切。"
 tv_arts_exhibition.360.t: "来自海外的邀请"
 tv_arts_exhibition.360.d: "[SCOPE.sCountry('inviting_country').GetName]邀请[SCOPE.sCharacter('guest_artist').GetShortName]作为客座艺术家参与其[tv_domestic_exhibition|e]。同意将使其出访至该展览结束，并为我国带来10点威望。"
 tv_arts_exhibition.360.a: "让艺术旅行。"
 tv_arts_exhibition.360.b: "他必须留在这里。"
 tv_arts_exhibition.361.t: "邀请获准"
 tv_arts_exhibition.361.d: "我们的邀请得到了同意。外国艺术家已在问候、好奇与公众关注的涌动中抵达。"
 tv_arts_exhibition.361.a: "欢迎贵客。"
 tv_arts_exhibition.362.t: "邀请遭拒"
 tv_arts_exhibition.362.d: "我们的邀请被拒绝了。展览只能依靠自己的声音继续。"
 tv_arts_exhibition.362.a: "那就这样吧。"
 tv_arts_exhibition.363.t: "客座艺术家归来"
 tv_arts_exhibition.363.d: "外国展览已经闭幕，我们的艺术家带着旅尘、故事与若干有用见闻回到了本国。"
 tv_arts_exhibition.363.a: "欢迎回家。"
 tv_arts_exhibition.370.t: "一只手更加纯熟"
 tv_arts_exhibition.370.d: "在公众面前，一位艺术家找到了更清晰的线条、更合宜的节奏、更严格的技艺。"
 tv_arts_exhibition.370.a: "练习成了启示。"
 tv_arts_exhibition.371.t: "一只手开始颤抖"
 tv_arts_exhibition.371.d: "大会的喧闹过于残酷。一位艺术家离开创作台时，比来时更不确信自己。"
 tv_arts_exhibition.371.a: "公众评判也会伤人。"
 tv_arts_exhibition.372.t: "人群屏息"
 tv_arts_exhibition.372.d: "画笔移动，凿子咬入，墨色渐深，观众几乎忘记呼吸。亲眼见证创作本身，便足以推高热情。"
 tv_arts_exhibition.372.a: "这正是他们前来的理由。"
 tv_arts_exhibition.373.t: "最后的杰作"
 tv_arts_exhibition.373.d: "一位艺术家将一切献给大会，在完成新作后倒下，再也无法恢复。展厅同时收获了创造与哀恸。"
 tv_arts_exhibition.373.a: "愿作品承载他的名字。"
 tv_arts_exhibition.374.t: "公众面前诞生的作品"
 tv_arts_exhibition.374.d: "大会在众目睽睽之下孕育出一件新艺术品，它仍带着刚刚成形的热度。"
 tv_arts_exhibition.374.a: "将它列入藏品。"

 tv_arts_exhibition.400.t: "国内艺术家加入交流会"
 tv_arts_exhibition.400.d.3: "艺术交流会已渐入佳境。我们已邀请[SCOPE.sCharacter('tv_arts_exchange_auto_invite_1_scope').GetShortName]、[SCOPE.sCharacter('tv_arts_exchange_auto_invite_2_scope').GetShortName]和[SCOPE.sCharacter('tv_arts_exchange_auto_invite_3_scope').GetShortName]加入会场，与首席艺术家共同交流。"
 tv_arts_exhibition.400.d.2: "艺术交流会已渐入佳境。我们已邀请[SCOPE.sCharacter('tv_arts_exchange_auto_invite_1_scope').GetShortName]和[SCOPE.sCharacter('tv_arts_exchange_auto_invite_2_scope').GetShortName]加入会场，与首席艺术家共同交流。"
 tv_arts_exhibition.400.d.1: "艺术交流会已渐入佳境。我们已邀请[SCOPE.sCharacter('tv_arts_exchange_auto_invite_1_scope').GetShortName]加入会场，与首席艺术家共同交流。"
 tv_arts_exhibition.400.d.0: "艺术交流会已渐入佳境，但目前没有合适的国内艺术家可供自动邀请。"
 tv_arts_exhibition.400.a: "让交流更加热闹。"

 tv_arts_exhibition.401.t: "愉快的技艺交流"
 tv_arts_exhibition.401.d: "[SCOPE.sCharacter('tv_arts_exchange_artist_1').GetShortName]与[SCOPE.sCharacter('tv_arts_exchange_artist_2').GetShortName]花了许久比较技法、修正手势，并为旧日失误相视而笑。"
 tv_arts_exhibition.401.a: "让他们在彼此眼中磨砺技艺。"
 tv_arts_exhibition.402.t: "交流中的顿悟"
 tv_arts_exhibition.402.d: "[SCOPE.sCharacter('tv_arts_exchange_artist_1').GetShortName]从交流中体会颇多，将零散点评转化为更稳定的手法与更清明的眼光。"
 tv_arts_exhibition.402.a: "一点灵光便已足够。"
 tv_arts_exhibition.403.t: "大师引领众人"
 tv_arts_exhibition.403.d: "[SCOPE.sCharacter('tv_arts_exchange_leading_artist').GetShortName]高超的技艺成为会场中心。其他人几乎不放过其每一个动作。"
 tv_arts_exhibition.403.a: "让众人临摹大师的手。"
 tv_arts_exhibition.404.t: "大吃特吃"
 tv_arts_exhibition.404.d: "[SCOPE.sCharacter('tv_arts_exchange_artist_1').GetShortName]发现交流会的餐桌也相当丰盛，而并非所有过度享受都会导向灵感。"
 tv_arts_exhibition.404.a: "这桌宴席或许太丰盛了。"
 tv_arts_exhibition.405.t: "来自海外的赞誉"
 tv_arts_exhibition.405.d: "[SCOPE.sCharacter('tv_arts_exchange_foreign_artist').GetShortName]盛赞本次艺术交流会水平之高。赞语很快传开。"
 tv_arts_exhibition.405.a: "让赞誉传得更远。"
 tv_arts_exhibition.406.t: "众目之下的杰作"
 tv_arts_exhibition.406.d: "在众人的注视下，[SCOPE.sCharacter('tv_arts_exchange_masterpiece_artist').GetShortName]创作出一件似乎注定会比这场会议更加长久的作品。"
 tv_arts_exhibition.406.a: "将此作置于显要之处。"
 tv_arts_exchange_masterpiece: "《$TARGET$的交流杰作》"
 tv_arts_exchange_masterpiece_desc: "这件作品诞生于艺术交流会众人注视之下，既署有创作者之名，也留存着群艺切磋的痕迹。"
 tv_arts_exhibition.407.t: "首都因盛会而鲜活"
 tv_arts_exhibition.407.d: "首都的厅堂、工坊与沙龙都因交流会而生辉。即使未曾入场者，也能感到国家文化底蕴有所增厚。"
 tv_arts_exhibition.407.a: "这座城市会记住这一季。"
 tv_arts_exhibition.408.t: "一位民间艺术家挤了进来"
 tv_arts_exhibition.408.d: "一位民间艺术家从人群中挤进会场，怎么也不肯离开。其举止粗率，技艺难测，自信却不容忽视。"
 tv_arts_exhibition.408.a: "招揽此人，并让其加入交流会。"
 tv_arts_exhibition.409.t: "国王被交流会吸引"
 tv_arts_exhibition.409.d: "统治者的好奇心将其带到交流会中。争论、表演与机敏谈吐，都磨砺了其外交直觉。"
 tv_arts_exhibition.409.a: "让王冠也学会倾听。"
 tv_arts_exhibition.410.t: "众人争执不下"
 tv_arts_exhibition.410.d: "参会者围绕一个问题不断兜圈，每个答案最终都变成了反驳。什么也没有解决，尽管所有人都坚持这场辩论很有必要。"
 tv_arts_exhibition.410.a: "也只能如此。"
 tv_arts_exhibition.420.t: "艺术交流会结束"
 tv_arts_exhibition.420.d: "一整年的拜访、争论、示范与意外友谊之后，艺术交流会落下帷幕。它的影响将留在每一位参会艺术家身上。"
 tv_arts_exhibition.420.a: "期待下一次相聚。"

