 tv_appoint_arts_leader_desc: "从宫廷艺术家中任命一位作为文艺展演的文化领袖。其艺术技能将每月贡献国际影响力（技能 × 0.1 / 月）。"
 tv_remove_arts_leader: "解除领袖"
 tv_remove_arts_leader_desc: "解除现任文化领袖职务。在任命新领袖之前，国际影响力将不再获得领袖的月度贡献。"
 tv_change_arts_leader: "更换领袖"
