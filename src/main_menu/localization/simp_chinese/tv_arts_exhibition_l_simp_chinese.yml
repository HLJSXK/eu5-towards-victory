 # 文艺展演事件
 tv_arts_exhibition.10.t: "[tv_artist_tour|E]：来自画室的提议"
 tv_arts_exhibition.10.d: "[SCOPE.sCharacter('proposed_artist').GetShortName]希望携我国收藏中所有符合条件的本人作品，前往[SCOPE.sCountry('proposed_tour_target').GetName]的[SCOPE.sLocation('proposed_tour_location').GetName]举办国际展出。旅程或许能传播我国声名，但在巡演结束前，艺术家与作品都将离开我国的直接保护。"
 tv_arts_exhibition.10.a: "允许出访。"
 tv_arts_exhibition.10.b: "资助展出。"
 tv_arts_exhibition.10.c: "禁止出访；其艺术生涯就此结束。"

 tv_arts_exhibition.1.t: "[tv_domestic_exhibition|E]：盛大国内展出"
 tv_arts_exhibition.1.d: "展厅大门已经开启。织锦垂入烛光，圣匣被擦拭一新，手稿翻到最明亮的一页，第一批访客已涌入厅堂。廷臣假装评判技法，眼角却在计算谁站得离珍品最近。商人低声估价，教士寻找德性，年轻学徒则寻找允许自己梦得更高的理由。只要公众的惊叹尚未熄灭，这场[tv_domestic_exhibition|E]便将考验王国的品味、钱袋与耐心。装满美的厅堂从来不只是厅堂；它是一个正在决定自己愿意崇敬何物的小小国家。"
 tv_arts_exhibition.1.a: "打开每一道门，让惊叹自己消耗殆尽。"
 tv_arts_exhibition.1.tt: "[tv_domestic_exhibition|E]已经开始。"

 tv_arts_exhibition.5.t: "[tv_artist_tour|E]：艺术家载誉归来"
 tv_arts_exhibition.5.d: "一位艺术家结束[tv_artist_tour|e]，回到了故土。道路在箱笼上留下尘土，异国习惯则留在他们的眼神里，但旧日宫廷仍认得当年离开的那只手。助手们拆开草图、抄来的歌、奇异颜料，以及含义必须仔细解释的赠礼。廷臣们围上前来，装作并不好奇每一句外国赞美与每一道外国轻蔑。[tv_arts_exhibition|E]得到的不只是一名归来的臣仆，更是一位见证者。"
 tv_arts_exhibition.5.a: "打开厅门，好好听他说。"

 tv_arts_exhibition.6.t: "[tv_artist_tour|E]：艺术家客死他乡"
 tv_arts_exhibition.6.d: "噩耗从远方传来：一位艺术家在[tv_artist_tour|e]期间离世。信写得很正式，过于正式，仿佛谨慎的墨水能够缩短异国病榻与故乡工坊之间的距离。他们未完成的习作将由陌生双手收拾，最后的话也只能通过并不完全懂得其语言的见证人跨越边境。东道宫廷送来慰问，但慰问无法让我们的厅堂重新响起那个声音。[tv_arts_exhibition|E]在海外赢得了注意，也付出了任何账册都无法整理的代价。"
 tv_arts_exhibition.6.a: "让他的名字留在厅堂里。"

 tv_arts_exhibition.7.t: "[tv_arts_exhibition|E]：[tv_chief_artist|E]已逝世"
 tv_arts_exhibition.7.d: "我们的[tv_chief_artist|E]已经离世。工坊最先从信使突如其来的沉默中听懂了这件事，因为他们甚至不知道该先敲哪扇门。[tv_arts_exhibition|E]中，助手仍在誊抄账册，艺术家仍在为品味争执，赞助人仍在索要答案，但中央那把椅子已经空了。没有引导之手，每月影响力只会依靠惯性，而不是眼光。必须有人继承这个头衔，否则国家艺术会像一支永远只在调音的乐队。"
 tv_arts_exhibition.7.a: "为那把椅子找一只稳健的手。"

 tv_arts_exhibition.8.t: "[tv_arts_exhibition|E]：[tv_chief_artist|E]出访"
 tv_arts_exhibition.8.d: "我们的[tv_chief_artist|E]已经踏上[tv_artist_tour|e]。这个决定或许能在海外服务国家，但他们留下的职位不能靠异国旅店和借来画室寄回的书信治理。[tv_arts_exhibition|E]仍需要有人在场，调解争执、挑选展陈、接待赞助人，并把才华翻译成政策。廷臣们已经开始猜测，这究竟是灵感充沛的使命，还是体面的卸任。在任命继任者之前，这个职位只是一张空桌上方的名字。"
 tv_arts_exhibition.8.a: "那张桌子不能一直空着。"

 tv_arts_exhibition.101.t: "[tv_artist_tour|E]：反响平平"
 tv_arts_exhibition.101.d: "消息传来，我们巡演艺术家的最新展示得到了礼貌而平淡的接待。观众赞赏其纪律，重复了应有的恭维，随后便转向晚宴，只留下少数迟疑目光。没有宫廷诗人突然高声赞美，没有赞助人当场打开钱袋，也没有竞争者写出愤怒檄文。尽管如此，安静的接待并不等于失败。艺术家的名字进入了又一场海外谈话，而[tv_arts_intl_influence|e]正是由这种细小而耐久的增量堆成。"
 tv_arts_exhibition.101.a: "礼貌的掌声也会旅行。"

 tv_arts_exhibition.102.t: "[tv_artist_tour|E]：大获成功！"
 tv_arts_exhibition.102.d: "捷报从海外传来。异国宫廷在我们的艺术家作品前拥挤到仆从不得不重开侧门透气。赞助人以谈论新风尚和危险观念时才有的谨慎喜悦重复我国之名。竞争艺术家们近前观看，有人赞叹，有人默记，有人已经准备反驳。到清晨时，这场展示已成为宫墙外也在流传的故事。[tv_arts_intl_influence|E]并不总以政策形式抵达；有时它以惊叹抵达。"
 tv_arts_exhibition.102.a: "让惊叹越过每一道边境。"

 tv_arts_exhibition.103.t: "[tv_artist_tour|E]：糟糕透顶"
 tv_arts_exhibition.103.d: "[tv_artist_tour|E]传来了令人汗颜的消息。一场艰难的演出遇上了敌意的厅堂，而敌意很快学会了嘲笑。有人讥讽色彩，有人讥讽姿态，最刻薄者则讥讽我国宫廷派遣艺术家出访时那份自信。尴尬已经找到了比官方解释更快的信使。损害并非毁灭性的，却提醒[tv_arts_exhibition|e]：异国品味是一座没有上诉的法庭。"
 tv_arts_exhibition.103.a: "烧掉报告，别烧掉教训。"

 tv_arts_exhibition.104.t: "[tv_artist_tour|E]：艺术家被异国聘用！"
 tv_arts_exhibition.104.d: "我们的巡演艺术家深深打动了东道宫廷，对方已邀请其长期留任。这份邀请写得像赞美，但每一句赞美下都藏着钩子。失去这位才俊会刺痛我们的工坊，可拒绝这样的承认，又会显得我们嫉妒自己的成功。东道宫廷会得到一件活着的饰物；我们则会宣称，我国训练出了值得被抢走的人。这是一场苦涩交易，但被渴求的声望能传得很远。"
 tv_arts_exhibition.104.a: "让损失看起来像胜利。"

 tv_arts_exhibition.105.t: "[tv_artist_tour|E]：艺术家灵感爆发！"
 tv_arts_exhibition.105.d: "异域文化在我们的巡演艺术家身上打开了某种非凡之物。他们写信谈到陌生颜料、更严厉的批评、不同的比例，以及那些连沉默都仿佛遵守另一套规则的工坊。起初，这些新奇令他们不安；如今，它们变成了工具。其技法不再只是被带到海外的我国技法，而是被旅程改变过的我国技法。当[tv_artist_tour|e]结束时，艺术家或许会带回一只本国宫廷永远无法独自教出的手。"
 tv_arts_exhibition.105.a: "让距离磨亮那只手。"

 # ── 月度特殊事件（201-205） ────────────────────────────────────────────────────
 tv_arts_exhibition.201.t: "[tv_artist_tour|E]：文化的桥梁"
 tv_arts_exhibition.201.d: "我们的巡演艺术家在异国的存在远不止于展示作品：他们打动了人心。一个曾经只通过使节、关税和可疑地图认识我们的宫廷，如今开始谈论我们的颜色、姿态与玩笑。宴谈变得柔和，书信变得温暖，连正式觐见也带上一丝共同欢悦。这不是条约，但条约常常始于怀疑忘记端起架子的地方。通过[tv_arts_exhibition|e]，艺术在外交宣布到场之前先溜进了房间。"
 tv_arts_exhibition.201.a: "让柔软的话去做艰硬的事。"

 tv_arts_exhibition.202.t: "[tv_artist_tour|E]：展览令全城倾倒"
 tv_arts_exhibition.202.d: "我们艺术家的作品令东道城市焕然一新。访客从集镇、庄园和远方堂区赶来，每个人都声称自己是为生意而来，然后又漂向展厅门口。旅店客满，摊贩高呼，本地孩童学会给陌生人指向厅堂。东道官员假装这只是良好秩序，但人人都看得出，我国艺术已经改变了城市节奏。一个季节里，异国繁荣正按着我们的声誉打拍子。"
 tv_arts_exhibition.202.a: "让他们的街道记住我们。"

 tv_arts_exhibition.203.t: "[tv_artist_tour|E]：贵族赞助人现身"
 tv_arts_exhibition.203.d: "东道宫廷一位富裕贵族深受我们艺术家的感染，决定在展演地出资修建一座宏伟剧院。这道命令当众宣布，姿态恰到好处，足以让每个竞争家族明白是谁最先认出了天才。建筑师已经开始丈量土地，诗人则争论这座剧院应被称作慷慨还是虚荣。我们无需作答。无论如何，我们的[tv_artist_tour|e]已经留下了必须由锤子和石匠变成永久的印记。"
 tv_arts_exhibition.203.a: "我们的艺术找到了自己的砖石。"

 tv_arts_exhibition.204.t: "[tv_artist_tour|E]：大师间的交流"
 tv_arts_exhibition.204.d: "我们的巡演艺术家与当地一位大师已相互研究技法数周。他们始于礼貌示范，很快转向争执，最后竟能不经请求便修正对方的手势。助手们在两间工坊之间搬运模型、粉末、草图和受伤的自尊。到结束时，两位大师都学到了一种任何单一传统无法独自产生的东西。这才是最真实的[tv_arts_exchange|e]：并非和谐，而是有用的摩擦。"
 tv_arts_exhibition.204.a: "让摩擦变成光芒。"

 tv_arts_exhibition.205.t: "[tv_artist_tour|E]：盗窃与悲剧"
 tv_arts_exhibition.205.d: "大祸降临到[tv_artist_tour|e]。我们的艺术家显然被周遭异国作品迷了心窍，竟试图从东道宫廷盗走一件杰作。他们当场被擒，随后的冲突以鲜血、碎裂画框和毁坏艺术品告终。东道宫廷怒不可遏，我国使节哑口无言，而每一个反对文化展示的人如今都有了可反复讲述的故事。艺术能以宾客身份跨越边境，丑闻却会像火一样越界。"
 tv_arts_exhibition.205.a: "以黑蜡封缄这些信件。"

 # ── 归国特殊事件（120-124） ──────────────────────────────────────────────────
 tv_arts_exhibition.120.t: "[tv_artist_tour|E]：带着纪念品归来"
 tv_arts_exhibition.120.d: "我们的艺术家从[tv_artist_tour|e]归来，而且并非两手空空。行囊中有一件来自东道宫廷的艺术品，被过分仔细地包裹着，也被解释得过分详细。他们声称那是赠礼，尽管这份赠礼似乎没有公开送别便踏上了旅途。没有指控跟着它回国，而占有本身有一套很有说服力的语法。无论真是赠予、巧妙交换，还是悄然取得，它如今都点缀了我们的厅堂。"
 tv_arts_exhibition.120.a: "把它挂在无人好意思发问的地方。"

 tv_arts_exhibition.121.t: "[tv_artist_tour|E]：一部新的杰作"
 tv_arts_exhibition.121.d: "这段旅程彻底改变了我们的艺术家。他们归来时疲惫、消瘦，对熟悉赞美几乎带着无礼的不耐。几乎刚回到故土，他们便带着异国草图和旧日记忆闭门创作，连仆从经过门前都开始放轻脚步。最终诞生的作品带着我国训练、个人苦难，以及从别处借来的明亮之物。这是一件新的杰作，而它若没有道路便无法出生。"
 tv_arts_exhibition.121.a: "让道路也享有胜利。"

 tv_arts_exhibition.122.t: "[tv_artist_tour|E]：异域的启示"
 tv_arts_exhibition.122.d: "我们的艺术家归来时，带回的不仅是记忆。草图边缘藏着关于工具、颜料、几何、解剖与工坊纪律的观察。原本只是艺术好奇心的记录，如今成了学者们未曾预料的证据，足以扰动他们的理论。因此，[tv_arts_exhibition|e]把一份礼物从画厅送到了学问世界。知识和颜料一样，有时最好换个名字旅行。"
 tv_arts_exhibition.122.a: "把笔记送给学者。"

 tv_arts_exhibition.123.t: "[tv_artist_tour|E]：艺术家的安息"
 tv_arts_exhibition.123.d: "我们的艺术家年迈而满足地归来。[tv_artist_tour|E]给予了他们赞助人、争执、陌生天气，以及再也无法整齐装进旧房间的声名。他们似乎只为能重新坐在熟悉声音之间而心满意足，并以无须再证明自己的温和纠正年轻艺术家。漫长海外岁月早已耗尽了最后力气。他们在故土安静离世，留下足够庞大的遗产，使这份沉默不至于难以承受。"
 tv_arts_exhibition.123.a: "用干净布巾覆盖他的工具。"

 tv_arts_exhibition.124.t: "[tv_artist_tour|E]：慷慨的临别馈赠"
 tv_arts_exhibition.124.d: "东道宫廷以温暖言辞和丰厚钱袋送我们的艺术家归国。大臣称这笔钱是感激，廷臣称其为惜别，而会计官则明智地把它写进了一个不那么多情的栏目。多年来，我们的艺术家照亮了他们的厅堂，扰动了他们的竞争者，也让他们自己的赞助人显得很有眼光。如今[tv_artist_tour|e]以足够沉重的黄金收场，令赞美变得非常实际。赞誉和钱袋，我们都收下。"
 tv_arts_exhibition.124.a: "体面的告别，也很实用。"

 # ── 本地展览事件 ─────────────────────────────────────────────────────────────
 tv_arts_exhibition.310.t: "[tv_domestic_exhibition|E]：展览冷清落幕"
 tv_arts_exhibition.310.d: "人群渐稀，灯火低垂，侍从甚至在最后一批访客离开前便开始遮盖展品。展览持续了[ROOT.GetVariable('tv_local_exhibition_last_duration').GetValue|0]个月，产出了[ROOT.GetVariable('tv_local_exhibition_last_reward').GetValue|1]点[tv_cip|e]，但反响平平使我们损失10点威望。"
 tv_arts_exhibition.310.a: "品味的教训并不便宜。"
 tv_arts_exhibition.311.t: "[tv_domestic_exhibition|E]：尚可称道的展览"
 tv_arts_exhibition.311.d: "这场展览在[ROOT.GetVariable('tv_local_exhibition_last_duration').GetValue|0]个月后走向尾声。它未能成为传奇，却也足以在城市记忆中留下痕迹：获得[ROOT.GetVariable('tv_local_exhibition_last_reward').GetValue|1]点[tv_cip|e]。"
 tv_arts_exhibition.311.a: "这是一份体面的成绩。"
 tv_arts_exhibition.312.t: "[tv_domestic_exhibition|E]：令人铭记的展览"
 tv_arts_exhibition.312.d: "在[ROOT.GetVariable('tv_local_exhibition_last_duration').GetValue|0]个月里，展览吸引了赞助人、批评家与模仿者。它的声名如今越过举办城市，带来[ROOT.GetVariable('tv_local_exhibition_last_reward').GetValue|1]点[tv_cip|e]与10点威望。"
 tv_arts_exhibition.312.a: "我们的厅堂替我们说了好话。"
 tv_arts_exhibition.313.t: "[tv_domestic_exhibition|E]：艺术的凯旋"
 tv_arts_exhibition.313.d: "展览持续了[ROOT.GetVariable('tv_local_exhibition_last_duration').GetValue|0]个月，并成为奇观本身。它的落幕不像结束，倒像一场游行：获得[ROOT.GetVariable('tv_local_exhibition_last_reward').GetValue|1]点[tv_cip|e]、15点威望，并让所有展出地点都回荡着凯旋余韵。"
 tv_arts_exhibition.313.a: "这将被长久铭记。"

 tv_arts_exhibition.320.t: "[tv_domestic_exhibition|E]：厅堂金资不足"
 tv_arts_exhibition.320.d: "典礼官提醒我们，乐师、卫兵、灯烛与修复师都不能只靠掌声过活。[tv_domestic_exhibition|E]已经比最初预算更加饥饿，而美好夜晚一旦被众人承认重要，往往都会如此。灯油见底，乐师望向门口，一名修复师拒绝触碰受损画框，除非有人解释谁会为这份荣幸付钱。此刻打开钱袋，方能保住今夜的热度。拒绝不会终结展出，但会教会观众降低期待。"
 tv_arts_exhibition.320.a: "支付厅堂所需。"
 tv_arts_exhibition.320.b: "让今夜缩小些吧。"
 tv_arts_exhibition.321.t: "[tv_domestic_exhibition|E]：批评家索要姿态"
 tv_arts_exhibition.321.d: "诗人与鉴赏家私下议论，真正的赞助人理应更大胆地献身于展览。他们聚在光线最好的墙边，假装讨论笔触，实则衡量我们的赞助勇气。[tv_domestic_exhibition|E]仍能赢得他们，但批评家讨厌被廉价赢得。一点公开的威望让步，或可让尖舌变成号角。若置之不理，聪明的失望会慢慢硬化成风尚。"
 tv_arts_exhibition.321.a: "用名声换取名声。"
 tv_arts_exhibition.321.b: "随他们低语。"
 tv_arts_exhibition.322.t: "[tv_domestic_exhibition|E]：贵族席位空置"
 tv_arts_exhibition.322.d: "数个贵族家族不满座次、请柬，也许只是彼此不满。他们空出的座位比任何书信都更会抗议，而所有人都看见了前排的缺口。[tv_domestic_exhibition|E]依靠辉煌支撑，而有头衔的家族选择用缺席做装饰时，辉煌便会显得单薄。私下致歉会损害贵族满意度，却能让前排重新闪耀。骄傲也必须像艺术品一样谨慎布置。"
 tv_arts_exhibition.322.a: "安抚贵族。"
 tv_arts_exhibition.322.b: "他们的缺席自会被看见。"
 tv_arts_exhibition.323.t: "[tv_domestic_exhibition|E]：反对虚荣的布道"
 tv_arts_exhibition.323.d: "一位知名神职人员警告说，没有谦卑的美只是一条通往罪恶的抛光道路。这篇布道已经越过集市广场，并在每次转述中变得更尖锐，连无害肖像也听起来像神学挑衅。[tv_domestic_exhibition|E]承受不起让奇观与救赎公开对决。谨慎让步或可平息讲坛，让信众重新踏入展厅。美若学会克制的语言，便更容易幸存。"
 tv_arts_exhibition.323.a: "安抚教士。"
 tv_arts_exhibition.323.b: "画作会作答。"
 tv_arts_exhibition.324.t: "[tv_domestic_exhibition|E]：商人清点摊位"
 tv_arts_exhibition.324.d: "供应画框、颜料、长凳与印刷告示的市民如今要求更好的条件。他们发现，文化这个高贵词语背后其实是一条非常实际的供应链。没有他们，[tv_domestic_exhibition|e]仍有画作，却会少些长凳、暗些灯火，也少得多穿过市场摊位的流言。向他们让步会损害满意度，却能维持展览周边的热闹市集。艺术或许崇高，但清漆总有人开账单。"
 tv_arts_exhibition.324.a: "与市民议定条件。"
 tv_arts_exhibition.324.b: "没有他们，展会也能继续。"
 tv_arts_exhibition.325.t: "[tv_domestic_exhibition|E]：大门外的人群"
 tv_arts_exhibition.325.d: "平民访客抱怨这场展览更属于天鹅绒袖子，而非粗糙的双手。他们等在门外，听着本不属于自己的乐声，重复那些尚未获准亲眼见到的作品名称。[tv_domestic_exhibition|E]本应展示国家光辉，但若多数人只能看见灯烟，光辉也会失去些力量。增加开放时段会激怒地方显贵、拖累平民，却能重燃公众热情。即使迟来的入场，也会被人记住。"
 tv_arts_exhibition.325.a: "为普通人腾出位置。"
 tv_arts_exhibition.325.b: "大门照旧。"
 tv_arts_exhibition.326.t: "[tv_domestic_exhibition|E]：秩序的问题"
 tv_arts_exhibition.326.d: "赞美展览的小册子如今赞美得太多：新风尚、新自由、新真理。印刷商发现，赞美若与危险并排出售，最容易卖出去。原本只是[tv_domestic_exhibition|e]告示的文字，如今读起来像是在议论整个国家。牺牲一点稳定，便能让这股热潮不受打断。压制会更安静，只是对依靠公众热度维持的展出而言，或许太安静了。"
 tv_arts_exhibition.326.a: "允许思想发酵。"
 tv_arts_exhibition.326.b: "压低这些议论。"
 tv_arts_exhibition.327.t: "[tv_domestic_exhibition|E]：投向王冠的疑影"
 tv_arts_exhibition.327.d: "有廷臣称，展览已成了宫廷中的宫廷，在那里品味压倒血统。画家被奉承得像大臣，批评家像法官，赞助人像王朝奠基者。[tv_domestic_exhibition|E]本该装点王权，但装饰物总爱追问若无自己墙壁会是什么样子。王室让步会损伤正统性，却能把丑闻重新变成奇观。王冠必须决定，是命令这座厅堂，还是取悦它。"
 tv_arts_exhibition.327.a: "王冠可为美而弯。"
 tv_arts_exhibition.327.b: "王冠不会弯折。"
 tv_arts_exhibition.328.t: "[tv_domestic_exhibition|E]：举办地献出砖石"
 tv_arts_exhibition.328.d: "举办地若要继续扩展展览，就必须将工坊、院落与实用房舍让给画廊与步道。木匠带着歉意丈量这些生产空间，似乎已经看见挂毯取代工具。如此一来，[tv_domestic_exhibition|e]会更宏大、更适合游览，也更难令访客抗拒，但城市会用日常效用支付代价。发展度将受损，而[tv_local_exhibition_enthusiasm|e]会随之高涨。有时，一座城市必须决定自己想工作，还是被铭记。"
 tv_arts_exhibition.328.a: "将砖石化作华彩。"
 tv_arts_exhibition.328.b: "保持城市原貌。"
 tv_arts_exhibition.329.t: "[tv_domestic_exhibition|E]：以繁荣点燃节庆"
 tv_arts_exhibition.329.d: "若由本地仓储、行会与住户共同承担，展览便可化为全城庆典。这个提议闻起来有灯油、烤肉、昂贵缎带，还有翌日清晨会变得难看的账目。短短数周里，[tv_domestic_exhibition|e]可以溢出厅堂，让整座城市都像一件运动中的艺术品。繁荣会像灯油一样被消耗。问题只在于，这份光亮是否值得燃料。"
 tv_arts_exhibition.329.a: "让城市明亮燃烧。"
 tv_arts_exhibition.329.b: "不要挥霍城市的好运。"

 tv_arts_exhibition.340.t: "[tv_domestic_exhibition|E]：统治者目光清明"
 tv_arts_exhibition.340.d: "在拥挤的厅堂中，统治者停在一件晦涩作品前，给出了出人意料的精准评判。廷臣们本已准备听到惯常的圆滑恭维，却听见一句锐利到令艺术家也站直身子的判断。[tv_domestic_exhibition|E]在这一刻不再只是陈列，而成了王冠当众通过的一场考验。原本期待无知的批评家发现自己也在不情愿地点头。一个看得清楚的统治者，会教整座厅堂重新观看。"
 tv_arts_exhibition.340.a: "更锐利的眼光配得上更锐利的王冠。"
 tv_arts_exhibition.341.t: "[tv_domestic_exhibition|E]：王室失言"
 tv_arts_exhibition.341.d: "统治者在错误的作品前停留，赞美了错误的作者，又问出一个无人能不尴尬回答的问题。厅堂陷入那种可怕的沉默，每个听众都在一瞬间变成了见证人。[tv_domestic_exhibition|E]经受过批评家、账单和坏天气，但王室误解造成的是更细腻的伤口。笑容很快回来了，回来得太快。灯火收起很久以后，厅堂仍会记住这个错误。"
 tv_arts_exhibition.341.a: "沉默本会更仁慈。"
 tv_arts_exhibition.342.t: "[tv_domestic_exhibition|E]：王冠受到喝彩"
 tv_arts_exhibition.342.d: "统治者的到访成了一幅和谐画面：王冠、艺术与人民，共处同一座彩绘穹顶之下。每个手势都仿佛恰逢其时，每次问候都落得温暖，连最怀疑的旁观者也被卷入这场演出。[tv_domestic_exhibition|E]把自身之美借给王座，而王座又把权威还给厅堂。一时间，奇观与正统性不再争夺位置。它们并肩站立，让人群同时为二者鼓掌。"
 tv_arts_exhibition.342.a: "正统性在公众光芒中闪耀。"
 tv_arts_exhibition.343.t: "[tv_domestic_exhibition|E]：王冠受到嘲弄"
 tv_arts_exhibition.343.d: "蜡烛尚未冷却，讽刺作家便抓住了王室参观的细节。或许是一个误读的手势，一个尴尬问题，又或许只是某个不讨喜的角度，如今都成了笑料。本意是赞助，结果却长出了一条腿脚灵便的笑话。[tv_domestic_exhibition|E]仍在吸引人群，只是其中有人如今是为了站在王冠出丑的地方。公共艺术很慷慨；它连嘲弄也会赠予更好的舞台。"
 tv_arts_exhibition.343.a: "拥挤厅堂中的王冠格外沉重。"
 tv_arts_exhibition.350.t: "[tv_domestic_exhibition|E]：激进宣言"
 tv_arts_exhibition.350.d: "新的宣言像刀刃划破画布般撕开惯例。青年艺术家欢呼，老大师退缩，官员们开始询问一份宣言是否能在变成风尚之前被逮捕。[tv_domestic_exhibition|E]忽然不像作品厅，而像塞满引线的房间。有些访客之所以兴奋，正因为他们尚未理解它。国家本身也为之震颤，而震颤吸引了更多人。"
 tv_arts_exhibition.350.a: "让艺术搅动世界。"
 tv_arts_exhibition.351.t: "[tv_domestic_exhibition|E]：新风尚"
 tv_arts_exhibition.351.d: "昨日还显得危险的言辞，今日忽然成了时髦。那些曾令赞助人皱眉的语句，如今带着小心翼翼的误读和自信点头出现在沙龙里。展厅挤满了急于宣称自己最先理解它的人，最好还要当着那些没有理解的人说出口。[tv_domestic_exhibition|E]已把风险转化为风格。让新奇变得体面最快的方法，莫过于让人害怕自己显得太迟。"
 tv_arts_exhibition.351.a: "新奇找到了自己的时刻。"
 tv_arts_exhibition.352.t: "[tv_domestic_exhibition|E]：公众转身离去"
 tv_arts_exhibition.352.d: "言辞跑在艺术前面。访客原本准备被改变，离开时却只是困惑，而困惑的失望比愤怒更危险。赞助人询问冒犯是否也成了一种技法，艺术家则坚持观众没能足够迅速地变得现代。[tv_domestic_exhibition|E]随着解释取代惊叹而失去温度。热情冷却下来，连最激进的小册子也开始听着像辩解。"
 tv_arts_exhibition.352.a: "锋刃割错了方向。"
 tv_arts_exhibition.353.t: "[tv_domestic_exhibition|E]：一件作品被毁"
 tv_arts_exhibition.353.d: "在表演、抗议与掌声交织的混乱中，一件艺术品遭到不可挽回的损毁。没有人同意这究竟是意外、宣言，还是恐慌，这也确保三种说法都会流传下去。[tv_domestic_exhibition|E]短暂地闻起来像碎裂清漆与公共羞耻。艺术家争论牺牲，赞助人争论赔偿。再激昂的宣言也无法使作品复原，任何道歉也无法完全复原气氛。"
 tv_arts_exhibition.353.a: "过度的代价。"
 tv_arts_exhibition.354.t: "[tv_domestic_exhibition|E]：一位平凡的新艺术家"
 tv_arts_exhibition.354.d: "招揽令得到了一只勤勉之手的回应。来者带着朴素作品、谨慎礼节，以及那种已经计算过每一枚抵达宫廷所需钱币的微微恐惧神情。没人会误以为他是天才，但[tv_domestic_exhibition|e]既容得下光芒，也容得下耐心。他懂得工作，懂得倾听，也懂得不必为每一次进步发表演说。或许这就够了。"
 tv_arts_exhibition.354.a: "工坊里有他的位置。"
 tv_arts_exhibition.355.t: "[tv_domestic_exhibition|E]：卓越者抵达"
 tv_arts_exhibition.355.d: "一位罕见的才俊几乎毫无预兆地抵达，带着草图，也带着同等分量的自信。他走进厅堂时，仿佛一场命运迟到了，而命运本该更礼貌地等他。[tv_domestic_exhibition|E]周围的空气随之改变：赞助人倾身，竞争者沉默，较次的恭维半途死去。作品并非完美，但前途已清晰得无法否认。宫廷能感到房间变了。"
 tv_arts_exhibition.355.a: "给他空间与赞助。"
 tv_arts_exhibition.356.t: "[tv_domestic_exhibition|E]：无人问津"
 tv_arts_exhibition.356.d: "信使带回的是礼貌的拒绝、陈旧的借口，以及那些早已受雇于别处的艺术家的沉默。请柬写得十分漂亮，这让失败更令人恼火。几位候选人一边赞美我们的[tv_domestic_exhibition|e]，一边拒绝靠近它，证明赞赏总比旅行便宜。空荡的工作室等着干净的光，却没有一只手来使用它。即使是赞助，也偶尔只能敲到上锁的门。"
 tv_arts_exhibition.356.a: "空荡的工作室已经说明一切。"
 tv_arts_exhibition.360.t: "[tv_domestic_exhibition|E]：来自海外的邀请"
 tv_arts_exhibition.360.d: "[SCOPE.sCountry('inviting_country').GetName]邀请[SCOPE.sCharacter('guest_artist').GetShortName]作为客座艺术家参与其[tv_domestic_exhibition|e]。同意将使其出访至该展览结束，并为我国带来10点威望。"
 tv_arts_exhibition.360.a: "让艺术旅行。"
 tv_arts_exhibition.360.b: "他必须留在这里。"
 tv_arts_exhibition.361.t: "[tv_domestic_exhibition|E]：邀请获准"
 tv_arts_exhibition.361.d: "我们的邀请得到了同意。外国艺术家在问候、好奇与公众关注的涌动中抵达，而每个想被看见率先问候他的人都迅速调整了站位。其口音、衣着、工具和习惯，在作品尚未拆箱之前就成了奇观的一部分。[tv_domestic_exhibition|E]因此获得了新的声音，也获得了一缕有用的异国认可。访客如今前来，不只为看我们的藏品，也为衡量我们迎接另一种传统时有多自信。这份自信几乎和艺术同样有价值。"
 tv_arts_exhibition.361.a: "欢迎贵客。"
 tv_arts_exhibition.362.t: "[tv_domestic_exhibition|E]：邀请遭拒"
 tv_arts_exhibition.362.d: "我们的邀请被拒绝了。回信足够礼貌，让愤怒难以发作；也足够单薄，让失望显而易见。宫廷中有人坚称那位外国艺术家害怕比较，也有人悄悄怀疑我们的邀约不够耀眼。[tv_domestic_exhibition|E]只能依靠自己的声音继续。幸好，借不到光彩的厅堂仍可制造尊严。"
 tv_arts_exhibition.362.a: "那就这样吧。"
 tv_arts_exhibition.363.t: "[tv_domestic_exhibition|E]：客座艺术家归来"
 tv_arts_exhibition.363.d: "外国展览已经闭幕，我们的艺术家带着旅尘、故事与若干有用见闻回到了本国。他谈及陌生的悬挂顺序、不同的喝彩习惯，以及那些比侮辱更难理解的赞美。他的缺席曾给另一座宫廷一件临时珍宝；他的归来则给了我们比较。[tv_domestic_exhibition|E]在他的眼中不会再和过去完全一样。一次短暂旅程，让熟悉的厅堂少了一点乡气。"
 tv_arts_exhibition.363.a: "欢迎回家。"
 tv_arts_exhibition.370.t: "[tv_domestic_exhibition|E]：一只手更加纯熟"
 tv_arts_exhibition.370.d: "在公众面前，一位艺术家找到了更清晰的线条、更合宜的节奏、更严格的技艺。变化来得如此可见，以至观众在任何人命名它之前便感到了不同。[tv_domestic_exhibition|E]短暂地不再是成品荣耀的陈列，而成了一间敞开大门的工坊。其他艺术家假装没有过分仔细地观察这一刻。他们失败了。"
 tv_arts_exhibition.370.a: "练习成了启示。"
 tv_arts_exhibition.371.t: "[tv_domestic_exhibition|E]：一只手开始颤抖"
 tv_arts_exhibition.371.d: "大会的喧闹过于残酷。一位艺术家带着自信开始，却把每一次咳嗽、每一句耳语、每一个无聊的轻微移动都听成了判决。[tv_domestic_exhibition|E]承诺的是公众创作，但公众评判有牙齿。他离开创作台时，比来时更不确信自己，带走一处任何绷带都无法显示的伤口。掌声若被 withheld，本身就是一件精确的器具。"
 tv_arts_exhibition.371.a: "公众评判也会伤人。"
 tv_arts_exhibition.372.t: "[tv_domestic_exhibition|E]：人群屏息"
 tv_arts_exhibition.372.d: "画笔移动，凿子咬入，墨色渐深，观众几乎忘记呼吸。人群见过完成的艺术，但亲眼看见创造发生，仍像偷偷窥见幕后一场风暴。孩子站上长凳，赞助人越过礼节前倾，连无聊官员也停止假装审阅文书。[tv_local_exhibition_enthusiasm|E]上升，只因厅堂真正活了起来。至少这一刻，所有人都明白为什么艺术家讨厌被打断。"
 tv_arts_exhibition.372.a: "这正是他们前来的理由。"
 tv_arts_exhibition.373.t: "[tv_domestic_exhibition|E]：最后的杰作"
 tv_arts_exhibition.373.d: "一位艺术家将一切献给大会。作品以惊人的速度推进，仿佛他的手已经决定身体的抱怨可以稍后再处理。最后一笔完成时，他倒下，再也无法恢复，厅堂中的掌声碎成哀恸。[tv_domestic_exhibition|E]在同一个可怕时刻同时收获了创造与死亡。新作将承载他的名字，但任何荣誉都无法让这份代价变得温柔。"
 tv_arts_exhibition.373.a: "愿作品承载他的名字。"
 tv_arts_exhibition.374.t: "[tv_domestic_exhibition|E]：公众面前诞生的作品"
 tv_arts_exhibition.374.d: "大会在众目睽睽之下孕育出一件新艺术品。它仍带着刚刚成形的热度，闻起来有颜料、油脂、压力与紧张。作品尚未全干，人们便已开始争论它，或许这正说明它重要。[tv_domestic_exhibition|E]今日不仅展示了文化；它当众制造了文化。厅堂因见证诞生而显得更宽阔。"
 tv_arts_exhibition.374.a: "将它列入藏品。"

 tv_arts_exhibition.400.t: "[tv_arts_exchange|E]：国内艺术家加入"
 tv_arts_exhibition.400.d.3: "[tv_arts_exchange|E]已渐入佳境。[tv_chief_artist|E]选定了房间，安排了最初的示范，并确保葡萄酒好到足以松动自尊，却不至于淹没判断。请柬已送往[SCOPE.sCharacter('tv_arts_exchange_auto_invite_1_scope').GetShortName]、[SCOPE.sCharacter('tv_arts_exchange_auto_invite_2_scope').GetShortName]和[SCOPE.sCharacter('tv_arts_exchange_auto_invite_3_scope').GetShortName]处。他们将以竞争者、合作者和见证人的身份加入会场。到年底时，没有人该声称自己毫无所得。"
 tv_arts_exhibition.400.d.2: "[tv_arts_exchange|E]已渐入佳境。[tv_chief_artist|E]选定了房间，安排了最初的示范，并确保葡萄酒好到足以松动自尊，却不至于淹没判断。请柬已送往[SCOPE.sCharacter('tv_arts_exchange_auto_invite_1_scope').GetShortName]和[SCOPE.sCharacter('tv_arts_exchange_auto_invite_2_scope').GetShortName]处。他们将以竞争者、合作者和见证人的身份加入会场。到年底时，没有人该声称自己毫无所得。"
 tv_arts_exhibition.400.d.1: "[tv_arts_exchange|E]已渐入佳境。[tv_chief_artist|E]选定了房间，安排了最初的示范，并确保葡萄酒好到足以松动自尊，却不至于淹没判断。一份请柬已送往[SCOPE.sCharacter('tv_arts_exchange_auto_invite_1_scope').GetShortName]处。他将以竞争者、合作者和见证人的身份加入会场。到年底时，没人该说这间屋子过于安静。"
 tv_arts_exhibition.400.d.0: "[tv_arts_exchange|E]已渐入佳境，尽管目前没有合适的国内艺术家可供自动邀请。[tv_chief_artist|E]选定了房间，安排了最初的示范，并确保葡萄酒好到足以松动自尊，却不至于淹没判断。空椅子并不理想，但也能成为有用的控诉。愿意回应号召者将先行入座。小圈子也能切得很深。"
 tv_arts_exhibition.400.a: "让交流更加热闹。"

 tv_arts_exhibition.401.t: "[tv_arts_exchange|E]：愉快的技艺交流"
 tv_arts_exhibition.401.d: "[SCOPE.sCharacter('tv_arts_exchange_artist_1').GetShortName]与[SCOPE.sCharacter('tv_arts_exchange_artist_2').GetShortName]花了许久比较技法、修正手势，并为旧日失误相视而笑。[tv_arts_exchange|E]允许他们说出宫廷礼节通常埋在恭维下的话。一条坏线被点名，一个懒惰习惯被揭露，一个巧妙解法被毫不羞愧地借走。到夜晚时，两位艺术家都疲惫得很有用。他们的竞争变成了磨刀石。"
 tv_arts_exhibition.401.a: "让他们在彼此眼中磨砺技艺。"
 tv_arts_exhibition.402.t: "[tv_arts_exchange|E]：交流中的顿悟"
 tv_arts_exhibition.402.d: "[SCOPE.sCharacter('tv_arts_exchange_artist_1').GetShortName]从[tv_arts_exchange|e]中获得了超出所有人预期的东西。某句零散点评，也许原本只是玩笑，却挂在他的心里不肯离开。他带着新的不耐重新练习旧功课，又带着意外的冷静转向新草图。等其他人注意到时，变化已经沉入他的手与眼。一点灵光找到了干燥火绒。"
 tv_arts_exhibition.402.a: "一点灵光便已足够。"
 tv_arts_exhibition.403.t: "[tv_arts_exchange|E]：大师引领众人"
 tv_arts_exhibition.403.d: "[SCOPE.sCharacter('tv_arts_exchange_leading_artist').GetShortName]高超的技艺成为会场中心。起初旁人还假装只是随意观看，但大师之技并不适合用眼角余光学习。很快，整场[tv_arts_exchange|e]都向他的工作台弯曲。每个动作都成了教诲，每次修正都成了小型公共事件。房间找到了临时主人。"
 tv_arts_exhibition.403.a: "让众人临摹大师的手。"
 tv_arts_exhibition.404.t: "[tv_arts_exchange|E]：大吃特吃"
 tv_arts_exhibition.404.d: "[SCOPE.sCharacter('tv_arts_exchange_artist_1').GetShortName]发现交流会的餐桌也相当丰盛。面包、葡萄酒、水果、酱汁和奉承都来得比纪律拒绝得更快。[tv_arts_exchange|E]本意是滋养技艺，但身体显然把任务理解得更直白。并非所有过度享受都会导向灵感。有些只会导向艰难的下午，以及关于节制的一课。"
 tv_arts_exhibition.404.a: "这桌宴席或许太丰盛了。"
 tv_arts_exhibition.405.t: "[tv_arts_exchange|E]：来自海外的赞誉"
 tv_arts_exhibition.405.d: "[SCOPE.sCharacter('tv_arts_exchange_foreign_artist').GetShortName]盛赞本次[tv_arts_exchange|e]水平罕见。因为赞美来自外国，宫廷中每个人都以两倍小心和一半怀疑重复它。这句话从工坊传到沙龙，在每一站都增添装饰。我国艺术家假装并不需要外部认可，但他们还是站得更直了一点。[tv_arts_intl_influence|E]有时只是从恰当餐桌上被听见的一句话开始。"
 tv_arts_exhibition.405.a: "让赞誉传得更远。"
 tv_arts_exhibition.406.t: "[tv_arts_exchange|E]：众目之下的杰作"
 tv_arts_exhibition.406.d: "在众人的注视下，[SCOPE.sCharacter('tv_arts_exchange_masterpiece_artist').GetShortName]创作出一件似乎注定会比这场会议更加长久的作品。[tv_arts_exchange|E]陷入一种罕见的安静：不是无聊，而是整间屋子共享的专注。每个见证者日后都会声称自己最先看见了决定性瞬间。也许他们都没有。这件作品已经开始逃入传说。"
 tv_arts_exhibition.406.a: "将此作置于显要之处。"
 tv_arts_exchange_masterpiece: "《$TARGET$的交流杰作》"
 tv_arts_exchange_masterpiece_desc: "这件作品诞生于[tv_arts_exchange|e]众人注视之下，既署有创作者之名，也留存着群艺切磋的痕迹。"
 tv_arts_exhibition.407.t: "[tv_arts_exchange|E]：首都因盛会而鲜活"
 tv_arts_exhibition.407.d: "首都的厅堂、工坊与沙龙都因[tv_arts_exchange|e]而生辉。学徒模仿他们并未完全理解的争论，赞助人重复昨日才学会的术语，酒馆则发现艺术流言很适合下酒。即使未曾入场者，也能感到国家文化底蕴有所增厚。这座城市不只是在举办一场聚会；它正在吸收聚会。一个季节里，每条街都仿佛通向更明亮的房间。"
 tv_arts_exhibition.407.a: "这座城市会记住这一季。"
 tv_arts_exhibition.408.t: "[tv_arts_exchange|E]：一位民间艺术家挤了进来"
 tv_arts_exhibition.408.d: "一位民间艺术家从人群中挤进会场，怎么也不肯离开。其举止粗率，技艺难测，自信却不容忽视。几位精致参会者本能地表示反对，随后又看了眼作品，反对声便低了些。[tv_arts_exchange|E]意外发现了一种只能从侧门进入的才华，因为从来没人为它修建正门。赶走他可以保护礼节。招揽他或许能改善艺术。"
 tv_arts_exhibition.408.a: "招揽此人，并让其加入交流会。"
 tv_arts_exhibition.409.t: "[tv_arts_exchange|E]：国王被吸引"
 tv_arts_exhibition.409.d: "统治者的好奇心将其带到[tv_arts_exchange|e]中。他原本期待的是消遣，或许还有奉承，却发现这里的争论像藏在丝绸里的刀刃。艺术家谈判侮辱、赞美、沉默与让步时的精确，足以让外交官认出来，倘若他们不那么自负。统治者离开时，机敏谈吐已经磨亮了他的外交直觉。艺术提供了一堂课，却不承认那是授课。"
 tv_arts_exhibition.409.a: "让王冠也学会倾听。"
 tv_arts_exhibition.410.t: "[tv_arts_exchange|E]：众人争执不下"
 tv_arts_exhibition.410.d: "参会者围绕一个问题不断兜圈，每个答案最终都变成了反驳。[tv_arts_exchange|E]花了一整天证明，聪明人确实能用定义造出迷宫。什么也没有解决，尽管所有人都坚持这场辩论很有必要，并私下认为自己最接近胜利。助手们悄悄收走空杯、未完成草图，以及同一论点的三种写法。没有杰作诞生，但至少整间屋子都彻底清醒了。"
 tv_arts_exhibition.410.a: "也只能如此。"
 tv_arts_exhibition.420.t: "[tv_arts_exchange|E]：盛会结束"
 tv_arts_exhibition.420.d: "一整年的拜访、争论、示范与意外友谊之后，[tv_arts_exchange|e]落下帷幕。房间被缓慢清理，仿佛仆从担心把仍藏在长凳下的某个想法一起扫走。艺术家们带着更锋利的手、新的怨气、借来的习惯，以及他们或许会在公开场合否认的友谊离开。最后一盏灯尚未冷却，赞助人便已询问下一次何时举行。[tv_arts_exhibition|E]并未终止谈话；它只是教会国家，谈话能改变多少东西。"
 tv_arts_exhibition.420.a: "关上厅门，别关上争论。"

