 # ── 科学院 ─────────────────────────────────────────────────────────────────────
 # IO type auto-derived keys (engine looks these up by the IO type name)
 tv_academy_of_sciences: "科学院"
 tv_academy_of_sciences_desc: "在科学院（第一阶段）建成后设立的国际学术机构。每个国家均拥有独立的科学院实例，作为学术研究中心与研究机制的运作入口。"
 diplomatic_status_tv_academy_of_sciences_name: "科学院成员国"
 diplomatic_status_tv_academy_of_sciences_tooltip: "该国已建立科学院并参与研究机制。"
 tv_academy_of_sciences_list_who_tt: "科学院成员国"
 io_opinion_tv_academy_of_sciences: "科学院共同成员"
 TV_ACADEMY_IO_LEADER: "科学院院长"

 # ── 科学院法律 ───────────────────────────────────────────────────────────────
 tv_science_factions: "科学派系"

 tv_academy_research_priority_law: "科研优先权"
 tv_academy_research_priority_law_desc: "决定科学院公开优先支持的研究方向。目前无实际效果。"
 tv_academy_research_priority_balanced_policy: "平衡"
 tv_academy_research_priority_balanced_policy_desc: "科学院在理论、应用与医学研究之间保持谨慎平衡。"
 tv_academy_research_priority_theory_policy: "理论优先"
 tv_academy_research_priority_theory_policy_desc: "科学院将抽象学问与自然哲学置于首位。"
 tv_academy_research_priority_application_policy: "应用优先"
 tv_academy_research_priority_application_policy_desc: "科学院偏重发明、仪器与可直接运用的技艺。"
 tv_academy_research_priority_medicine_policy: "医学优先"
 tv_academy_research_priority_medicine_policy_desc: "科学院将学术注意力集中于解剖、治疗与公共健康。"

 tv_academy_research_openness_law: "科研开放度"
 tv_academy_research_openness_law_desc: "决定科学院知识在学派、赞助人和外国通信者之间流通的自由程度。目前无实际效果。"
 tv_academy_research_openness_closed_policy: "国家封闭"
 tv_academy_research_openness_closed_policy_desc: "研究记录受国家严格监管。"
 tv_academy_research_openness_school_control_policy: "学派管控"
 tv_academy_research_openness_school_control_policy_desc: "受承认的学派自行管理研究成果的传播。"
 tv_academy_research_openness_school_free_policy: "学派自由"
 tv_academy_research_openness_school_free_policy_desc: "各学派与学者自行决定如何分享其工作。"
 tv_academy_research_openness_international_policy: "国际开放"
 tv_academy_research_openness_international_policy_desc: "科学院欢迎与外国学者通信、交流与互证。"

 tv_academy_research_risk_law: "科研风险管理"
 tv_academy_research_risk_law_desc: "决定科学院对不确定实验和危险主张的正式容忍度。目前无实际效果。"
 tv_academy_research_risk_mandatory_review_policy: "强制审查"
 tv_academy_research_risk_mandatory_review_policy_desc: "具有风险的主张必须先受审查，科学院才会给予权威背书。"
 tv_academy_research_risk_conservative_policy: "保守稳妥"
 tv_academy_research_risk_conservative_policy_desc: "科学院偏好缓慢、可重复的进展，而非鲁莽的新奇论断。"
 tv_academy_research_risk_high_breakthrough_policy: "鼓励高风险突破"
 tv_academy_research_risk_high_breakthrough_policy_desc: "只要可能带来重大发现，科学院便容许大胆探索。"

 tv_academy_research_funding_law: "科研资源分配"
 tv_academy_research_funding_law_desc: "决定哪些赞助人与机构塑造科学院的物质支持。目前无实际效果。"
 tv_academy_research_funding_private_policy: "私人赞助"
 tv_academy_research_funding_private_policy_desc: "私人赞助人资助学者，并决定哪些项目值得投入。"
 tv_academy_research_funding_guild_policy: "行会赞助"
 tv_academy_research_funding_guild_policy_desc: "行会与学术团体为科学院提供实际支持。"
 tv_academy_research_funding_royal_policy: "皇家优先"
 tv_academy_research_funding_royal_policy_desc: "王室为科学院项目保留优先资源。"
 tv_academy_research_funding_international_policy: "国际合作"
 tv_academy_research_funding_international_policy_desc: "科学院接纳来自海外的合作资金与共享材料。"

 tv_academy_technology_spread_law: "科技传播法规"
 tv_academy_technology_spread_law_desc: "决定发现如何从科学院传入作坊、宫廷与市场。目前无实际效果。"
 tv_academy_technology_spread_laissez_faire_policy: "放任扩散"
 tv_academy_technology_spread_laissez_faire_policy_desc: "新技艺通过印刷、作坊和赞助人自由传播，几乎不受正式限制。"
 tv_academy_technology_spread_private_policy: "私有化科研"
 tv_academy_technology_spread_private_policy_desc: "发现被视为赞助人与研究圈子的财产。"
 tv_academy_technology_spread_state_standard_policy: "国家标准化"
 tv_academy_technology_spread_state_standard_policy_desc: "科学院与国家先行确立标准方法，再推动更广泛采纳。"

 tv_academy_academic_prestige_law: "学术声望"
 tv_academy_academic_prestige_law_desc: "决定国家如何正式表彰学术成就。目前无实际效果。"
 tv_academy_academic_prestige_none_policy: "无奖励"
 tv_academy_academic_prestige_none_policy_desc: "发现只被记录，不授予正式奖励。"
 tv_academy_academic_prestige_titles_policy: "头衔与爵位奖励"
 tv_academy_academic_prestige_titles_policy_desc: "卓越学者可获得头衔与贵族尊荣。"
 tv_academy_academic_prestige_money_policy: "金钱奖励"
 tv_academy_academic_prestige_money_policy_desc: "学术成就以直接金钱赏赐表彰。"
 tv_academy_academic_prestige_reputation_policy: "声望奖励"
 tv_academy_academic_prestige_reputation_policy_desc: "发现带来公共荣誉与典礼承认。"

 # ── 科学院加入事件（tv_academy.1）─────────────────────────────────────────────
 tv_academy.1.t: "科学院建成"
 tv_academy.1.d: "我国学者已完成科学院的建设。这一机构将成为探索之地，汇聚王国中最杰出的思想者，共同揭开自然的奥秘，推动知识的边界。"
 tv_academy.1.a: "让求知之路由此开始。"
 tv_science_m1_io_grant_tt: "我们将可以使用[tv_academy_of_sciences|e]机制，见国际组织界面。"

