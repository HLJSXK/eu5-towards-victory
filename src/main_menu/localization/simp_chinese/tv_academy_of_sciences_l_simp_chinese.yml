 # ── 首席科学家死亡事件（tv_academy.10）──────────────────────────────────────────
 tv_academy.10.t: "首席科学家已逝世"
 tv_academy.10.d: "我们的首席科学家已经离世。该职位现已空缺；在任命新的首席科学家之前，集中研究将暂停进行。"
 tv_academy.10.a: "我们必须任命新的首席科学家。"
