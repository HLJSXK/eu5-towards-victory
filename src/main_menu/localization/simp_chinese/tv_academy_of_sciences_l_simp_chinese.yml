 # ── 首席科学家死亡事件（tv_academy.10）──────────────────────────────────────────
 tv_academy.10.t: "[tv_academy_of_sciences|E]：[tv_chief_scientist|E]已逝世"
 tv_academy.10.d: "[tv_chief_scientist|E]已经离世，消息在[tv_academy_of_sciences|E]中传播得比任何钟声都更安静。助手们盖上仪器，书记合起未完成的账册，昨日还显得急迫的争论忽然失去了主持声音。[tv_concentrated_research|E]不能只靠名声继续；它需要一个活着的头脑来整理混乱。有些学生在悼念老师，也有人已经低声议论继任。[tv_academy_of_sciences|E]依然矗立，但正中的椅子空了下来。"
 tv_academy.10.a: "找到下一位能镇住厅堂的头脑。"
