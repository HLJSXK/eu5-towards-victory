 # ── IO 领袖管理 ───────────────────────────────────────────────────────────────
 tv_appoint_academy_leader: "任命首席科学家"
 tv_appoint_academy_leader_desc: "任命我国的一位角色担任科学院的首席科学家。首席科学家的行政技能驱动集中研究子流程；其外交与军事技能决定其每月金币花费。"
 tv_remove_academy_leader: "解除首席科学家"
 tv_remove_academy_leader_desc: "解除现任首席科学家的职务。在任命新首席科学家之前，集中研究将停止。"
 tv_change_academy_leader: "更换首席科学家"
 tv_change_academy_leader_desc: "以另一位角色替换现任首席科学家。"
 tv_select_academy_leader: "选择首席科学家"
 tv_no_academy_leader_available: "@trigger_no! 没有符合条件的角色可供选择。"

