 tv_research.119.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName]需要的权力超出我们的想象。若授予授权，研究将大幅加速。\n\n#Y 该事件出现是因为你的首席科学家等效行政能力不低于20但低于80。#!"
 tv_research.119.a: "授予授权。"
 tv_research.119.b: "拒绝请求。"
 tv_research.120.t: "认识和学习！"
 tv_research.120.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName]在实践中增进了技能。\n\n#G 该事件出现是因为你的首席科学家等效行政能力不低于50但低于80。#!"
 tv_research.120.a: "他正在学习。"
 tv_research.121.t: "内阁协作！"
 tv_research.121.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName]近期的研究项目显著激励了我们的内阁。\n\n#G 该事件出现是因为你的首席科学家等效行政能力不低于50但低于80。#!"
 tv_research.121.a: "富有成效的榜样。"
 tv_research.122.t: "线索！"
 tv_research.122.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName]发现了一条线索，可以继续追踪，但未必有成效。\n\n#G 该事件出现是因为你的首席科学家等效行政能力不低于50但低于80。#!"
 tv_research.122.a: "追踪线索。"
 tv_research.123.t: "研究伙伴！"
 tv_research.123.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName]闲暇时与内阁成员[SCOPE.sCharacter('tv_research_cabinet').GetShortName]交流，结果二人都茅塞顿开。\n\n#G 该事件出现是因为你的首席科学家等效行政能力不低于50。#!"
 tv_research.123.a: "富有成果的交流。"
 tv_research.124.t: "即时返利！"
 tv_research.124.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName]将他开发的原型公开，立即有贵族重金收购，所得已经完全上交国家。\n\n#G 该事件出现是因为你的首席科学家等效行政能力不低于50。#!"
 tv_research.124.a: "有用的收入。"
 tv_research.125.t: "勤奋！"
 tv_research.125.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName]近期非常能干，我们可以安排其下一步的重点任务，或者让他自行发挥。\n\n#G 该事件出现是因为你的首席科学家等效行政能力不低于50。#!"
 tv_research.125.a: "专注研究。"
 tv_research.125.b: "让成功转化为威望。"
 tv_research.126.t: "公开研讨！"
 tv_research.126.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName]刚刚组织了一场公开研讨，这不会立即推进任务，但参与者都十分满意！\n\n#G 该事件出现是因为你的首席科学家等效行政能力不低于50。#!"
 tv_research.126.a: "令人愉快的成功。"
 tv_research.127.t: "突破！"
 tv_research.127.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName]不愧为当世的学术大师，他最近的推论被证实是完全正确的。\n\n#G 该事件出现是因为你的首席科学家等效行政能力不低于80。#!"
 tv_research.127.a: "卓越。"
 tv_research.128.t: "协同进步！"
 tv_research.128.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName]最新的研究内容直接影响到了我们的教士科研。\n\n#G 该事件出现是因为你的首席科学家等效行政能力不低于80。#!"
 tv_research.128.a: "知识正在传播。"
 tv_research.129.t: "榜样！"
 tv_research.129.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName]最新的科研进展已经吸引了一大片拥簇，我们的王室因之而光荣。\n\n#G 该事件出现是因为你的首席科学家等效行政能力不低于80。#!"
 tv_research.129.a: "值得骄傲。"

