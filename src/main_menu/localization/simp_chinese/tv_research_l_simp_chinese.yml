 tv_research.101.t: "[tv_concentrated_research|E]：失败！"
 tv_research.101.d_tier1: "一条研究路线被自己的聪明压垮了。[SCOPE.sCharacter('tv_research_scientist').GetShortName]一路追过三张修正表、两幅充满希望的图示，最后得到的实验答案却是彻底的否定。[tv_academy_of_sciences|E]当然能从失败中学习，但从失败中学习终究比不上完成[tv_research_target|E]。[tv_concentrated_research|E]在此失去的不只是时间，还有信心。\n\n#R 该事件出现是因为你的[tv_chief_scientist|E]的[tv_effective_administrative_skill|E]低于20。#!"
