 # tv_research.11 — 放弃目标确认
 tv_research.11.t: "确认放弃研究计划？"
 tv_research.11.d: "放弃当前研究目标意味着失去迄今积累的所有进度。学者们将备受打击，我们也需要一段时间才能提出新的研究方向。"
 tv_research.11.a: "放弃研究。"
 tv_research.11.b: "继续——我改变主意了。"

 # tv_research.19 — 集中研究可用通知
 tv_research.19.t: "科学院已准备就绪"
 tv_research.19.d: "科学院已完成全部准备工作。学术兴趣、前置研究与识字基础均已达标，现在可以开展集中研究了。"
 tv_research.19.a: "明白了。"

 # tv_research.20 — 开展集中研究确认
 tv_research.20.t: "开展集中研究"
 tv_research.20.d: "前置条件已就绪，首席科学家蓄势待发。集中研究期间可能出现随机事件：优秀的首席科学家更容易带来正面进展，而不称职的首席科学家则会频繁招致负面事故。\n\n首席科学家必须至少拥有20点等效行政能力，才能开始或完成集中研究。一般来说，等效行政能力高于50才有利于研究顺利推进。"
 tv_research.20.a: "开始集中研究。"
 tv_research.20.random_events.tt: "集中研究期间可能出现随机事件。更高的等效行政能力会解锁更好的事件池；更低的等效行政能力会解锁更糟糕的事件池。"
 tv_research.20.b: "暂不行动，稍后决定。"

