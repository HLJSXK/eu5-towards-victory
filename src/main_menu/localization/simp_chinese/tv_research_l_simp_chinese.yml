 tv_research.106.t: "搞砸了！"
 tv_research.106.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName]在推进研究时不小心打碎了昂贵的科学仪器。\n\n#R 该事件出现是因为你的首席科学家等效行政能力低于20。#!"
