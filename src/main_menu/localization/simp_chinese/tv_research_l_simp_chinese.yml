 # ── 医学事件 ──────────────────────────────────────────────────────────────────
 tv_medicine.1.t: "[tv_academy_medical_treatment|E]：关键医学发现"
 tv_medicine.1.d: "[tv_chief_scientist|E]在患者的痛苦中发现了普通医师忽略的规律。脉搏、热度、记忆、食欲与传闻都指向一个不能永远拖延的选择。保守的[tv_academy_medical_treatment|E]或许能保全性命，却推进缓慢；投入更多资源的方案可能更快，但速度也自带刀锋。助手们守在洁布、热水和没人愿意大声说出名字的器械旁。患者望着我们，仿佛政策本身走进了病房。"
 tv_medicine.1.a: "保守方案（95%：+5%进度 / 5%：患者死亡）"
 tv_medicine.1.b: "激进方案（80%：+10%进度 / 20%：患者死亡）"
 tv_medicine.1.c: "继续研究——我们还不能冒险"
 tv_medicine.2.t: "[tv_academy_medical_treatment|E]：轻度医疗事故"
 tv_medicine.2.d: "治疗室忽然安静下来，所有人都因此知道出了差错。也许是一项读数被误解，也许是一只手慢了一拍，也许是患者的身体用[tv_academy_of_sciences|E]尚未学会的语言作答。没有生命丧失，但信心受了伤。[tv_chief_scientist|E]命人从头整理记录，[tv_academy_medical_treatment|E]进度倒退10%。患者熬过了事故，方法本身如今必须经受审视。"
 tv_medicine.2.a: "令人遗憾，但我们继续努力"
 tv_medicine.5.t: "[tv_academy_medical_treatment|E]：致命医疗事故"
 tv_medicine.5.d: "事故在所有人弄清原因之前便已经结束。前一刻房中还充满指令，下一刻只剩寂静，患者的名字变成了人人都不愿先说出口的东西。[tv_chief_scientist|E]可以解释风险、方法、反应，以及那串可怕的错误顺序，但解释不是复活。[tv_academy_medical_treatment|E]夺走了它原本想保住的生命。此后每当[tv_academy_of_sciences|E]磨利器械时，都会想起这场死亡。"
 tv_medicine.5.a: "痛失英才"
 tv_medicine.3.t: "[tv_academy_medical_treatment|E]：患者已康复"
 tv_medicine.3.d: "患者的康复先是流言，随后才成为事实。食欲恢复，热度退去，血色回到皮肤之下，病房也不再闻起来像投降。[tv_chief_scientist|E]没有称其为奇迹，这反而让宫廷更相信它。[tv_academy_medical_treatment|E]把细致观察转化为一条被挽回的生命。每个怀疑[tv_academy_of_sciences|E]的医师，如今都必须解释这位能走出门来的患者。"
 tv_medicine.3.a: "好消息！"
 tv_medicine.4.t: "[tv_academy_medical_treatment|E]：患者在治疗期间死亡"
 tv_medicine.4.d: "尽管有图表、药剂、祈祷与修正，患者仍在衰弱。到黎明时，病房已变成众人垂目的地方，[tv_chief_scientist|E]只剩一叠忽然显得过分鲜活的记录。死亡未必由我们亲手造成，却确实发生在我们的照护之下。当前[tv_academy_medical_treatment|E]无法再假装这只是一个谜题。我们必须重置工作，带着新的谨慎重新开始。"
 tv_medicine.4.a: "痛失英才"
 tv_medicine.11.t: "[tv_academy_meditation|E]：心平气和！"
 tv_medicine.11.d: "[SCOPE.sCharacter('tv_meditation_target').GetShortName]进入了难得的清明状态，连旧日怨恨都像是远了许多。房间变得更静，却并不空洞，[tv_chief_scientist|E]也明白此刻不能催促。某句话、某次呼吸或某段羞惭的记忆终于找到了自己的位置。[tv_academy_meditation|E]并非靠强迫前进，而是让心智停止守错门。记录上写下一次关键进展。"
 tv_medicine.11.a: "让宁静延续"
 tv_medicine.12.t: "[tv_academy_meditation|E]：难以平静！"
 tv_medicine.12.d: "[SCOPE.sCharacter('tv_meditation_target').GetShortName]无论如何都无法安定。旧日习性像不受欢迎的客人一样自信地归来，混乱思绪挤走每一个谨慎问题。[tv_chief_scientist|E]尝试沉默、记忆、纪律与转向，却没有任何方法能维持太久。[tv_academy_meditation|E]倒退了，因为这颗心太熟悉旧路。有些门，只有在被拒绝许多次后才会打开。"
 tv_medicine.12.a: "重新开始"
 tv_medicine.13.t: "[tv_academy_meditation|E]：大科学家引导[SCOPE.sCharacter('tv_meditation_target').GetShortName]！"
 tv_medicine.13.d: "[SCOPE.sCharacter('tv_meditation_scientist').GetShortName]平静的话语，恰好在骄傲开始疲倦的那一刻触及了[SCOPE.sCharacter('tv_meditation_target').GetShortName]。这份引导既不是布道，也不是命令，而是把若干终于可以承受的真实轻轻摆好。旧日防御第一次没有抢先作答。[tv_academy_meditation|E]随之前进，道路也清晰起来。房间终于呼出一口气。"
 tv_medicine.13.a: "卓越的引导"
 tv_medicine.14.t: "[tv_academy_meditation|E]：大科学家起到了反作用！"
 tv_medicine.14.d: "[SCOPE.sCharacter('tv_meditation_scientist').GetShortName]的引导落点糟糕，本想触及理解，却刺中了骄傲。[SCOPE.sCharacter('tv_meditation_target').GetShortName]僵硬起来，回答过快，离开时旧伤反而守得更严。[tv_chief_scientist|E]不加修饰地记录了这次失败。[tv_academy_meditation|E]这一次让事情变得更糟。心智若被从错误角度推动，就会变成上锁的门。"
 tv_medicine.14.a: "令人遗憾的教训"
 tv_medicine.15.t: "[tv_academy_meditation|E]：[SCOPE.sCharacter('tv_meditation_target').GetShortName]的内心躁动不安！"
 tv_medicine.15.d: "[SCOPE.sCharacter('tv_meditation_target').GetShortName]突然陷入内在挣扎，房中任何人都无法礼貌地假装没有看见。声音变了，记忆变得锋利，一种旧日模式像挑战一样升起。[tv_chief_scientist|E]必须判断，是让挣扎自行走完，还是在其加深前打断它。这正是[tv_academy_meditation|E]最危险的中段：进步与复发有着相似的面孔。下一次呼吸可能比过去一个月的纪律都更重要。"
 tv_medicine.15.a: "让挣扎过去"
 tv_medicine.20.t: "[tv_academy_meditation|E]：冥想完成"
 tv_medicine.20.d: "在[SCOPE.sCharacter('tv_meditation_scientist').GetShortName]的引导下，[SCOPE.sCharacter('tv_meditation_target').GetShortName]终于无需大声否认旧错，也能从中迈开一步。改变先出现在姿态里，随后才出现在言语中。仆人注意到尖锐命令少了，廷臣注意到停顿变长了，[tv_academy_of_sciences|E]注意到重复终于变成选择。[tv_academy_meditation|E]完成了惩罚很少能做到的事：让自我约束显得可能。记录以罕见的满意合上。"
 tv_medicine.20.a: "心境澄明"
 tv_medicine.21.t: "[tv_academy_meditation|E]：冥想中断"
 tv_medicine.21.d: "正在接受[tv_academy_meditation|E]的角色在工作完成前离世。留下的记录写满了未完成的观察，以及如今再也没有活人回答的问题。[tv_chief_scientist|E]没有举行仪式，只是合上卷宗，因为仪式仿佛意味着完成。原本可能出现的改变，如今已经超出[tv_academy_of_sciences|E]所能触及的范围。工作结束了，因为它追随的那颗心已经沉默。"
 tv_medicine.21.a: "到此为止"
