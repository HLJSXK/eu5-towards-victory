 # ── 研究事件 ──────────────────────────────────────────────────────────────────

 # tv_research.1 — 月度兴趣事件
 tv_research.1.t: "[tv_research_interest|E]：好奇之火"
 tv_research.1.d: "一位平日只在会议上整理袖口与联姻关系的廷臣，在讲座结束后留了下来，提出的问题精确到不像虚荣。他们的好奇心围绕[tv_research_target|E]打转，像是在熟悉墙面上忽然发现了一扇门。[tv_academy_of_sciences|E]不能只靠天才运转；它还需要赞助人、流言、执念，以及愿意在晚餐后重复一个问题的人。若我们培养这点火星，它也许会成为[tv_research_interest|E]，而不只是短暂消遣。若我们驳回它，宫廷便会学到：探究最好还是私下进行。即使很小的问题，也需要许可才能长大。"
 tv_research.1.d_printing_press: "一名书坊主人把几枚粗糙活字和一份大胆承诺带到[tv_academy_of_sciences|E]：文字也能像士兵一样排队。若投入些许资金，#Y 印刷机应用#!就不再只是好奇玩物，而会成为体面人也愿意追问的课题。"
 tv_research.1.d_iron_working: "乡间铁匠送来一块比师傅们预料更少瑕疵的铁料。[tv_academy_of_sciences|E]请求经费用于矿石、木炭和耐心称量，免得#Y 炼铁#!又退回工坊吹嘘。"
 tv_research.1.d_gunpowder: "一名炮兵仆役注意到，同一配方调出的火药并不总以同一方式发怒。若资助正式试验，#Y 火药#!就能得到通常只留给更安全事物的关注。"
 tv_research.1.d_blast_furnace: "一位铸造师声称，更炽烈的炉火可以改变金属生产的尺度。[tv_academy_of_sciences|E]希望检验风道、砖墙和燃料账，让#Y 高炉#!不只是烟雾缭绕的夸口。"
 tv_research.1.d_scientific_experimentation: "仪器匠献上一套灵敏到能羞辱旧演示的天平。只需适度资助，#Y 科学实验#!便能成为反复验证的习惯，而非聪明人的下午消遣。"
 tv_research.1.d_scientific_revolution: "一名讲师把黑板写满运动推论，使旧解释忽然显得疲惫。[tv_academy_of_sciences|E]请求支持，免得#Y 科学革命#!只作为时髦惊叹流散出去。"
 tv_research.1.d_manufactories: "一位工坊监工展示了分工如何让手更快，哪怕脑子并未更聪明。些许金钱可让[tv_academy_of_sciences|E]把#Y 工场生产#!作为制度研究，而非幸运屋子。"
 tv_research.1.d_industrialization: "磨坊工画出一台似乎愿意在主人睡后继续工作的机器。[tv_academy_of_sciences|E]需要材料和安静空间，判断#Y 工业革命#!是许诺，还是昂贵得漂亮的错误。"
 tv_research.1.d_vaccination: "乡村医师寄来几户人家的记录：他们在旁人哀悼时活了下来。[tv_academy_of_sciences|E]需要资金检验#Y 疫苗#!是否真能把怜悯变成方法。"
 tv_research.1.d_renaissance: "一位人文教师发现的古稿，让旧学问带着危险的青春气息。赞助可以把零散热情凝结为对#Y 文艺复兴#!本身的兴趣。"
 tv_research.1.d_banking: "一名商人银行家献上账册，其中信任几乎像仪器一样运转。[tv_academy_of_sciences|E]想用硬币研究#Y 银行系统#!如何把承诺变成力量。"
 tv_research.1.d_professional_armies: "操练军官呈交的名册显示，把士兵当成职业训练，他们忘得更少，也更晚崩溃。资助可让#Y 职业军队#!成为学者议题，而不只留在营房。"
 tv_research.1.d_new_world: "一位领航员带回一段拒绝塞进旧地图的海岸线。[tv_academy_of_sciences|E]请求经费比对海图、风向与证词，免得#Y 发现新大陆#!变成又一个酒馆奇迹。"
 tv_research.1.d_pike_and_shot: "老练操典官描述了长枪与火器如何在谁都不许自负时保护彼此。[tv_academy_of_sciences|E]可资助试演，让#Y 枪刺与射击#!不只是战场闲谈。"
 tv_research.1.d_confessionalism: "一位袖口沾墨的神学家展示了印刷教义如何硬化为公共秩序。[tv_academy_of_sciences|E]想研究#Y 认信主义#!，免得讲坛与印刷机跑在政策前面。"
 tv_research.1.d_global_trade: "一名代理商带回的账册里，远方价格像钟声一样彼此回应。资助能让[tv_academy_of_sciences|E]追踪使#Y 全球贸易#!显形的规律。"
 tv_research.1.d_artillery_institution: "一位要塞工程师带来计算，证明城墙也可以被说服。[tv_academy_of_sciences|E]需要火药、金属和量具，把#Y 炮兵应用#!变成严肃探究。"
 tv_research.1.d_military_revolution: "军需官发现，军队的形状如今与勇气同样重要。资金可让[tv_academy_of_sciences|E]在仓储、道路和指挥表中审视#Y 军事革命#!。"
 tv_research.1.d_enlightenment: "一篇沙龙文章抵达[tv_academy_of_sciences|E]，读者比作者预想更多。适度资助能把#Y 启蒙运动#!的谈论变成有组织的好奇，而非愉快的不服从。"
 tv_research.1.d_levee_en_masse: "一名民兵队长列出名册，说明整个社会如何被计入战争。[tv_academy_of_sciences|E]请求资金研究#Y 全民动员#!，赶在修辞变成政策之前。"
 tv_research.1.a: "给这点火星一支蜡烛和一本账簿。"
 tv_research.1.b: "让好奇心在走廊里冷却。"
 tv_research.2.t: "[tv_research_interest|E]：一个有损声誉的问题"
 tv_research.2.d: "关于[tv_research_target|E]的最新讨论还没来得及穿上宫廷礼服，就已经逃出了[tv_academy_of_sciences|E]。机敏之人开始嘲笑他们根本读不懂的图样，竞争者也把不确定当成愚蠢的证据。[tv_academy_of_sciences|E]请求我们用公开的信心作答：花费一些[prestige|E]，保护探究，让好奇心披着借来的体面继续前进。"
 tv_research.2.d_printing_press: "宫廷开始打趣说活字会先复制坏诗，再复制有用书籍。为#Y 印刷机应用#!花费声望，是在告诉满屋人：王室懂得在笑话停止前看见价值。"
 tv_research.2.d_iron_working: "贵族称炼铁试验满是烟灰，不配学术体面。把王室声誉借给#Y 炼铁#!，能保护探究撑到有用金属开口回答。"
 tv_research.2.d_gunpowder: "#Y 火药#!引来偏爱勇气而非化学的指挥官们紧张发笑。公开信任能让[tv_academy_of_sciences|E]看起来不是在玩雷声。"
 tv_research.2.d_blast_furnace: "更炽烈的炉火已成宫廷笑料，仿佛学者想胜过铁匠。声望可以保护#Y 高炉#!，直到热量、矿石和耐心说话。"
 tv_research.2.d_scientific_experimentation: "有些廷臣说反复实验只是学者不信自己眼睛的借口。为#Y 科学实验#!花费声望，能让有纪律的怀疑足够时髦，从而活下来。"
 tv_research.2.d_scientific_revolution: "如今每个聪明人都声称自己早料到#Y 科学革命#!，同时暗自害怕它。我们的名望能稳住[tv_academy_of_sciences|E]，让众人继续假装不颤抖。"
