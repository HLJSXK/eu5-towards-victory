 # ── 研究事件 ──────────────────────────────────────────────────────────────────

 # tv_research.1 — 月度兴趣事件
 tv_research.1.t: "[tv_research_interest|E]：好奇之火"
 tv_research.1.d: "一位平日只在会议上整理袖口与联姻关系的廷臣，在讲座结束后留了下来，提出的问题精确到不像虚荣。他们的好奇心围绕[tv_research_target|E]打转，像是在熟悉墙面上忽然发现了一扇门。[tv_academy_of_sciences|E]不能只靠天才运转；它还需要赞助人、流言、执念，以及愿意在晚餐后重复一个问题的人。若我们培养这点火星，它也许会成为[tv_research_interest|E]，而不只是短暂消遣。若我们驳回它，宫廷便会学到：探究最好还是私下进行。即使很小的问题，也需要许可才能长大。"
 tv_research.1.a: "给这点火星一支蜡烛和一本账簿。"
 tv_research.1.b: "让好奇心在走廊里冷却。"
 tv_research.2.t: "[tv_research_interest|E]：一个有损声誉的问题"
 tv_research.2.d: "关于[tv_research_target|E]的最新讨论还没来得及穿上宫廷礼服，就已经逃出了[tv_academy_of_sciences|E]。机敏之人开始嘲笑他们根本读不懂的图样，竞争者也把不确定当成愚蠢的证据。[tv_academy_of_sciences|E]请求我们用公开的信心作答：花费一些[prestige|E]，保护探究，让好奇心披着借来的体面继续前进。"
 tv_research.2.a: "让声誉替下一个问题付账。"
 tv_research.2.b: "宫廷想笑就让他们笑。"
 tv_research.3.t: "[tv_research_interest|E]：反对臆测的布道"
 tv_research.3.d: "几位博学教士认定[tv_research_target|E]带着太浓的新奇味。他们的反对并不致命，却足够公开，足以让助手在打开账簿前先压低声音。[tv_academy_of_sciences|E]仍可承受一季教士不满，把猜疑转化为另一点[tv_research_interest|E]。"
 tv_research.3.a: "让神学家皱眉吧。"
 tv_research.3.b: "不要惊动讲坛。"
 tv_research.4.t: "[tv_research_interest|E]：商人要求有用的答案"
 tv_research.4.d: "市民本指望[tv_academy_of_sciences|E]产出工具、量具和聪明机器。如今他们听见的却是[tv_research_target|E]，于是怀疑学术是否已经学会花钱而不碰利润。我们可以承受他们的不快，让探究继续推进，只是账房会记住这次冒犯。"
 tv_research.4.a: "让账簿抱怨去吧。"
 tv_research.4.b: "别让商人不满。"
 tv_research.5.t: "[tv_research_interest|E]：令人不安的演示"
 tv_research.5.d: "一场本该让[tv_research_target|E]显得体面的公开演示，反而让它变得惊人。仆人复述最怪异的细节，地方法官询问此事是否得到授权，而每一次澄清听起来都像承认。[tv_academy_of_sciences|E]坚称，只要国家能承受一点混乱，结果仍然有用。"
 tv_research.5.a: "秩序可以摇晃，知识不能停下。"
 tv_research.5.b: "关上门，等平静回来。"
 tv_research.6.t: "[tv_research_interest|E]：王冠上的疑问"
 tv_research.6.d: "这项探究擦到了王权确定性的边缘。没人说[tv_research_target|E]在挑战王座，但措辞小心到足以证明这种念头已经出现。现在推进工作将消耗一些[legitimacy|E]，仿佛王冠本身也必须侧身，好让这个问题通过。"
 tv_research.6.a: "王冠经得起一个问题。"
 tv_research.6.b: "有些疑问太昂贵了。"
