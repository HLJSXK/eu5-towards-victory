 tv_research.106.b: "凑合使用残余设备。"
 tv_research.107.t: "耗材消耗巨大！"
 tv_research.107.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName]大手大脚的性格已经造成了严重浪费！我们不得不购买额外耗材来填窟窿。\n\n#R 该事件出现是因为你的首席科学家等效行政能力低于50。#!"
 tv_research.107.a: "购买更多耗材。"
 tv_research.108.t: "方向错误！"
 tv_research.108.d: "看来[SCOPE.sCharacter('tv_research_scientist').GetShortName]已经误入歧途，不得不走另一条路。\n\n#R 该事件出现是因为你的首席科学家等效行政能力低于50。#!"
 tv_research.108.a: "修正方向。"
 tv_research.109.t: "可笑的断言！"
 tv_research.109.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName]刚刚发表了一则可笑言论，即使是一名普通贵族也知道其荒谬至极。\n\n#R 该事件出现是因为你的首席科学家等效行政能力低于50。#!"
 tv_research.109.a: "真丢人。"
 tv_research.110.t: "笨手笨脚！"
 tv_research.110.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName]正在花费大量时间处理一件小事，我们的内阁不得不前来帮助他。\n\n#R 该事件出现是因为你的首席科学家等效行政能力低于50。#!"
 tv_research.110.a: "内阁必须协助。"
 tv_research.111.t: "需要帮助！"
 tv_research.111.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName]刚刚告诉我们，他无法独自完成攻关，我们不得不派遣[SCOPE.sCharacter('tv_research_cabinet').GetShortName]前去帮忙。\n\n#R 该事件出现是因为你的首席科学家等效行政能力不低于20但低于50。#!"
 tv_research.111.a: "派人协助。"
 tv_research.112.t: "请求额外耗材！"
 tv_research.112.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName]使用耗材的速度比我们想象得更快，现在我们不得不为他购买新的耗材。\n\n#R 该事件出现是因为你的首席科学家等效行政能力不低于20但低于50。#!"
 tv_research.112.a: "节省耗材，损失进度。"
 tv_research.112.b: "购买新耗材。"
 tv_research.113.t: "争吵！"
 tv_research.113.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName]正在与他的贵族同僚争吵。由于他的身份不会受到报复，但这严重降低了贵族的满意度。\n\n#R 该事件出现是因为你的首席科学家等效行政能力不低于20但低于50。#!"
 tv_research.113.a: "安抚贵族。"
 tv_research.114.t: "大胆的提议！"
 tv_research.114.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName]提出了一种大胆的想法，希望我们支持。它可能推进研究，也可能让我们颜面扫地。\n\n#Y 该事件出现是因为你的首席科学家等效行政能力不低于20但低于80。#!"
 tv_research.114.a: "支持尝试。"
 tv_research.115.t: "扩大测试规模！"
 tv_research.115.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName]刚刚提出了一种并行研究方案，希望我们支持。\n\n#Y 该事件出现是因为你的首席科学家等效行政能力不低于20但低于80。#!"
 tv_research.115.a: "资助扩大测试。"
 tv_research.115.b: "维持当前规模。"
 tv_research.116.t: "更换班组！"
 tv_research.116.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName]指出当前任务需要重新调配人员，他已经看中了[SCOPE.sCharacter('tv_research_cabinet').GetShortName]。\n\n#Y 该事件出现是因为你的首席科学家等效行政能力不低于20但低于80。#!"
 tv_research.116.a: "重新调配。"
 tv_research.116.b: "维持原状。"
 tv_research.117.t: "喜忧参半！"
 tv_research.117.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName]熬夜完成了一次重大推进，但也因此累垮了身体。\n\n#Y 该事件出现是因为你的首席科学家等效行政能力不低于20但低于80。#!"
 tv_research.117.a: "进步总有代价。"
 tv_research.118.t: "金钱的力量！"
 tv_research.118.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName]擅自花大价钱推进研究，确实有所斩获，但我们现在不得不加大投资了。\n\n#Y 该事件出现是因为你的首席科学家等效行政能力不低于20但低于80。#!"
 tv_research.118.a: "支付账单。"
