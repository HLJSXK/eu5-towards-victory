 tv_research.105.t: "科学家累倒！"
 tv_research.105.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName]为了完成集中研究的任务，已经彻底搞垮了身体！\n\n#R 该事件出现是因为你的首席科学家等效行政能力低于20。#!"
