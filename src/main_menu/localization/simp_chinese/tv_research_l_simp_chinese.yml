 tv_research.6.d: "这项探究擦到了王权确定性的边缘。没人说[tv_research_target|E]在挑战王座，但措辞小心到足以证明这种念头已经出现。现在推进工作将消耗一些[legitimacy|E]，仿佛王冠本身也必须侧身，好让这个问题通过。"
 tv_research.6.d_printing_press: "顾问警告#Y 印刷机应用#!会让臣民发声的速度快过王冠回应。支持探究意味着相信王权能站在更明亮的光里。"
 tv_research.6.d_iron_working: "王室官员追问为何#Y 炼铁#!应由学者而非传统军需师傅引导。支持[tv_academy_of_sciences|E]会让王室判断显得大胆，也略显暴露。"
 tv_research.6.d_gunpowder: "将军们坚持#Y 火药#!属于军事机密，而非学术好奇。王冠可以压过他们，但王室确定性要为此付账。"
 tv_research.6.d_blast_furnace: "宫廷工程师认为#Y 高炉#!太接近战略金属，不宜公开探究。让[tv_academy_of_sciences|E]继续，王冠就要为它释放的热量负责。"
 tv_research.6.d_scientific_experimentation: "支持#Y 科学实验#!，等于承认即便官方智慧也要接受反复检验。这有用、危险，也不完全奉承权威。"
 tv_research.6.d_scientific_revolution: "#Y 科学革命#!询问当证据长出牙齿时，旧解释是否可以被取代。若王冠资助这个问题，也会教会旁人如何提问。"
 tv_research.6.d_manufactories: "贵族家族担心#Y 工场生产#!会重排他们熟悉范围之外的劳力。王室支持会让王冠看起来像每个被挪动习惯的作者。"
 tv_research.6.d_industrialization: "#Y 工业革命#!承诺的力量足以改变谁重要。资助它会让改革者觉得王冠有远见，也让偏爱旧等级者觉得鲁莽。"
 tv_research.6.d_vaccination: "王室为#Y 疫苗#!背书，会把王冠置于家庭恐惧与医学希望之间。若工作失足，合法性会先于医生解释而流血。"
 tv_research.6.d_renaissance: "#Y 文艺复兴#!奉承君主，却也教会旧文本衡量当下统治者。支持它意味着接受学问既会赞美王冠，也会审视王冠。"
 tv_research.6.d_banking: "#Y 银行系统#!给王室承诺带来新工具，也带来新见证人。王冠可以资助研究，但未来每位债主都会记住这课。"
 tv_research.6.d_professional_armies: "#Y 职业军队#!要求士兵先属于制度，再属于赞助人。王冠可以支持它，只是旧忠诚会听见挑战。"
 tv_research.6.d_new_world: "#Y 发现新大陆#!同时扩张王室想象与王室责任。资助探究意味着王冠要为尚无官员治理的地平线负责。"
 tv_research.6.d_pike_and_shot: "#Y 枪刺与射击#!暗示贵族勇气也必须站进操练几何里。支持它也许增强军队，同时削薄旧日指挥浪漫。"
 tv_research.6.d_confessionalism: "#Y 认信主义#!把教义和国家技艺系得太紧，以至每个错误都可能显得属于王室。王冠可以继续，但合法性会靠近火焰。"
 tv_research.6.d_global_trade: "#Y 全球贸易#!教会人们，远方市场也能牵动王室政策。资助探究等于承认王冠统治的世界大过自身仪式。"
 tv_research.6.d_artillery_institution: "#Y 炮兵应用#!把王室权威放在能拆解古老防御的工具背后。王冠可以承担这负担，但石头与身份都会察觉。"
 tv_research.6.d_military_revolution: "#Y 军事革命#!暗示昨日受敬的制度或许已不足够。王室支持在改革者眼中是智慧，在老兵眼中可能是背叛。"
 tv_research.6.d_enlightenment: "#Y 启蒙运动#!很有礼貌，直到理性开始询问谁授权了这个房间。资助它会花掉王冠一点不容置疑的确定性。"
 tv_research.6.d_levee_en_masse: "#Y 全民动员#!把人民视作国家力量，而不仅是旗帜下的臣民。若王冠研究这个想法，合法性就必须围绕更大的国家弯曲。"
 tv_research.6.a: "王冠经得起一个问题。"
 tv_research.6.b: "有些疑问太昂贵了。"
