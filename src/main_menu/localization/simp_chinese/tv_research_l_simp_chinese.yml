 # ── 目标革新提示框 ────────────────────────────────────────────────────────────────
 TV_RM_TARGET_PRINTING_PRESS_TT:0 "解锁印刷术革新，极大地加速思想传播，推动宗教改革，并提升全国识字率。"
 TV_RM_TARGET_IRON_WORKING_TT:0 "解锁炼铁技术革新，提升军事生产效率、资源开采能力和早期工业潜力。"
 TV_RM_TARGET_ANATOMY_TT:0 "解锁解剖学革新，提高医学认知，减少疾病伤亡，并为现代医学奠定基础。"
 TV_RM_TARGET_GUNPOWDER_TT:0 "解锁火药技术革新，使军队得以装备火器与火炮，从根本上改变攻城战术与军事理论。"
 TV_RM_TARGET_BLAST_FURNACE_TT:0 "解锁高炉炼铁革新，实现大规模铁器生产，为工业制造奠定基础。"
 TV_RM_TARGET_SCIENTIFIC_EXPERIMENTATION_TT:0 "解锁科学实验革新，确立实证研究方法，加速自然哲学与应用科学的全面进步。"
 TV_RM_TARGET_SCIENTIFIC_REVOLUTION_TT:0 "解锁科学革命革新，这一划时代突破重新塑造了人类对自然界的认知，并奠定了现代科学的基础。"
 TV_RM_TARGET_MANUFACTORIES_TT:0 "解锁工厂制造革新，引入原始工业化生产方式，大幅提升产出与经济实力。"
 TV_RM_TARGET_INDUSTRIALIZATION_TT:0 "解锁工业化革新，推动机械化生产，从根本上增强国家的经济与军事潜能。"
 TV_RM_TARGET_VACCINATION_TT:0 "解锁疫苗接种革新，为人口提供瘟疫防护，大幅减少疫情造成的人口损失。"

 # ── 通用动作键 ────────────────────────────────────────────────────────────────
 tv_request_research_target:0 "申请研究目标"
 tv_request_research_target_desc:0 "请科学院提议一个研究方向。目标将从当前锁定的前沿技术中随机选取。"
 tv_abandon_research_target:0 "放弃研究目标"
 tv_abandon_research_target_desc:0 "放弃当前研究目标，所有进度将会丢失，并触发12个月的冷却。"
 tv_start_concentrated_research:0 "开展集中研究"
 tv_start_concentrated_research_desc:0 "指示首席科学家全力攻关。所有前置子流程均需完成方可启动。"

 # ── 研究事件 ──────────────────────────────────────────────────────────────────

 # tv_research.1 — 月度兴趣事件
 tv_research.1.t: "好奇之火"
 tv_research.1.d: "宫廷中一位成员对科学院当前研究课题展现出异乎寻常的求知热情，若加以引导，或许大有裨益。"
 tv_research.1.a: "鼓励探究。"
 tv_research.1.b: "不过是分心之举，不必理会。"

 # tv_research.10 — 目标选择提案
 tv_research.10.t: "科学院提出研究方向"
 tv_research.10.d_printing_press: "科学院学者认为印刷术是最具前景的研究方向。若批准此项调查，我方最优秀的学者将全力投入这一突破。"
 tv_research.10.d_iron_working: "科学院学者认为炼铁技术是最具前景的研究方向。若批准此项调查，我方最优秀的学者将全力投入这一突破。"
 tv_research.10.d_anatomy: "科学院学者认为解剖学是最具前景的研究方向。若批准此项调查，我方最优秀的学者将全力投入这一突破。"
 tv_research.10.d_gunpowder: "科学院学者认为火药技术是最具前景的研究方向。若批准此项调查，我方最优秀的学者将全力投入这一突破。"
 tv_research.10.d_blast_furnace: "科学院学者认为高炉炼铁是最具前景的研究方向。若批准此项调查，我方最优秀的学者将全力投入这一突破。"
 tv_research.10.d_scientific_experimentation: "科学院学者认为科学实验方法是最具前景的研究方向。若批准此项调查，我方最优秀的学者将全力投入这一突破。"
 tv_research.10.d_scientific_revolution: "科学院学者认为科学革命是最具前景的研究方向。若批准此项调查，我方最优秀的学者将全力投入这一突破。"
 tv_research.10.d_manufactories: "科学院学者认为工厂制造是最具前景的研究方向。若批准此项调查，我方最优秀的学者将全力投入这一突破。"
 tv_research.10.d_industrialization: "科学院学者认为工业化是最具前景的研究方向。若批准此项调查，我方最优秀的学者将全力投入这一突破。"
 tv_research.10.d_vaccination: "科学院学者认为疫苗接种是最具前景的研究方向。若批准此项调查，我方最优秀的学者将全力投入这一突破。"
 tv_research.10.a: "批准调查。"
 tv_research.10.b: "否决，我们尚未准备好。"

 # tv_research.11 — 放弃目标确认
 tv_research.11.t: "确认放弃研究计划？"
 tv_research.11.d: "放弃当前研究目标意味着失去迄今积累的所有进度。学者们将备受打击，我们也需要一段时间才能提出新的研究方向。"
 tv_research.11.a: "放弃研究。"
 tv_research.11.b: "继续——我改变主意了。"

 # tv_research.20 — 开展集中研究确认
 tv_research.20.t: "开展集中研究"
 tv_research.20.d: "前置条件已就绪，首席科学家蓄势待发。此举将占用其全部精力，并每月消耗国家资源，直至取得突破。"
 tv_research.20.a: "开始集中研究。"
 tv_research.20.b: "暂不行动，稍后决定。"

 # tv_research.30 — 革新解锁通知
 tv_research.30.t: "重大突破！"
 tv_research.30.d_printing_press: "历经数年专注研究，我方科学院终于成功。印刷术的原理已然掌握，这一知识将彻底改变我们的文明。"
 tv_research.30.d_iron_working: "历经数年专注研究，我方科学院终于成功。炼铁技术的原理已然掌握，这一知识将彻底改变我们的文明。"
 tv_research.30.d_anatomy: "历经数年专注研究，我方科学院终于成功。解剖学的原理已然掌握，这一知识将彻底改变我们的文明。"
 tv_research.30.d_gunpowder: "历经数年专注研究，我方科学院终于成功。火药技术的原理已然掌握，这一知识将彻底改变我们的文明。"
 tv_research.30.d_blast_furnace: "历经数年专注研究，我方科学院终于成功。高炉炼铁的原理已然掌握，这一知识将彻底改变我们的文明。"
 tv_research.30.d_scientific_experimentation: "历经数年专注研究，我方科学院终于成功。科学实验方法的原理已然掌握，这一知识将彻底改变我们的文明。"
 tv_research.30.d_scientific_revolution: "历经数年专注研究，我方科学院终于成功。科学革命的原理已然掌握，这一知识将彻底改变我们的文明。"
 tv_research.30.d_manufactories: "历经数年专注研究，我方科学院终于成功。工厂制造的原理已然掌握，这一知识将彻底改变我们的文明。"
 tv_research.30.d_industrialization: "历经数年专注研究，我方科学院终于成功。工业化的原理已然掌握，这一知识将彻底改变我们的文明。"
 tv_research.30.d_vaccination: "历经数年专注研究，我方科学院终于成功。疫苗接种的原理已然掌握，这一知识将彻底改变我们的文明。"
 tv_research.30.a: "知识的伟大胜利！"

