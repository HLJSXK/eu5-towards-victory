 # ── 医学事件 ──────────────────────────────────────────────────────────────────
 tv_medicine.1.t: "关键医学发现"
 tv_medicine.1.d: "首席科学家发现了患者病情的一个关键特征。我们必须决定如何推进治疗方案。"
 tv_medicine.1.a: "保守方案（95%：+5%进度 / 5%：患者死亡）"
 tv_medicine.1.b: "激进方案（80%：+10%进度 / 20%：患者死亡）"
 tv_medicine.1.c: "继续研究——我们还不能冒险"
 tv_medicine.2.t: "轻度医疗事故"
 tv_medicine.2.d: "治疗过程中发生了一起意外事故，治疗进度因此倒退了10%。"
 tv_medicine.2.a: "令人遗憾，但我们继续努力"
 tv_medicine.5.t: "致命医疗事故"
 tv_medicine.5.d: "治疗过程中发生了一场灾难性的事故，患者未能生还。"
 tv_medicine.5.a: "痛失英才"
 tv_medicine.3.t: "患者已康复"
 tv_medicine.3.d: "在首席科学家的不懈努力下，患者已从病患中完全康复。"
 tv_medicine.3.a: "好消息！"
 tv_medicine.4.t: "患者在治疗期间死亡"
 tv_medicine.4.d: "遗憾的是，患者在治疗过程中死亡了。我们必须重置研究，重新开始。"
