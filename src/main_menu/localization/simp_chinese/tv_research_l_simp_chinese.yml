 TV_RM_TARGET_ANATOMY:0 "解剖学"
 TV_RM_TARGET_GUNPOWDER:0 "火药技术"
 TV_RM_TARGET_BLAST_FURNACE:0 "高炉炼铁"
 TV_RM_TARGET_SCIENTIFIC_EXPERIMENTATION:0 "科学实验"
 TV_RM_TARGET_SCIENTIFIC_REVOLUTION:0 "科学革命"
 TV_RM_TARGET_MANUFACTORIES:0 "工厂制造"
 TV_RM_TARGET_INDUSTRIALIZATION:0 "工业化"
 TV_RM_TARGET_VACCINATION:0 "疫苗接种"

 # ── 通用动作键 ────────────────────────────────────────────────────────────────
 tv_request_research_target:0 "申请研究目标"
 tv_request_research_target_desc:0 "请科学院提议一个研究方向。目标将从当前锁定的前沿技术中随机选取。"
 tv_abandon_research_target:0 "放弃研究目标"
 tv_abandon_research_target_desc:0 "放弃当前研究目标，所有进度将会丢失，并触发12个月的冷却。"
 tv_start_concentrated_research:0 "开展集中研究"
 tv_start_concentrated_research_desc:0 "指示首席科学家全力攻关。所有前置子流程均需完成方可启动。"

 # ── 研究事件 ──────────────────────────────────────────────────────────────────

 # tv_research.1 — 月度兴趣事件
 tv_research.1.t:0 "好奇之火"
 tv_research.1.d:0 "宫廷中一位成员对科学院当前研究课题展现出异乎寻常的求知热情，若加以引导，或许大有裨益。"
 tv_research.1.a:0 "鼓励探究。"
 tv_research.1.b:0 "不过是分心之举，不必理会。"

 # tv_research.10 — 目标选择提案
 tv_research.10.t:0 "科学院提出研究方向"
 tv_research.10.d_printing_press:0 "科学院学者认为印刷术是最具前景的研究方向。若批准此项调查，我方最优秀的学者将全力投入这一突破。"
 tv_research.10.d_iron_working:0 "科学院学者认为炼铁技术是最具前景的研究方向。若批准此项调查，我方最优秀的学者将全力投入这一突破。"
 tv_research.10.d_anatomy:0 "科学院学者认为解剖学是最具前景的研究方向。若批准此项调查，我方最优秀的学者将全力投入这一突破。"
 tv_research.10.d_gunpowder:0 "科学院学者认为火药技术是最具前景的研究方向。若批准此项调查，我方最优秀的学者将全力投入这一突破。"
 tv_research.10.d_blast_furnace:0 "科学院学者认为高炉炼铁是最具前景的研究方向。若批准此项调查，我方最优秀的学者将全力投入这一突破。"
 tv_research.10.d_scientific_experimentation:0 "科学院学者认为科学实验方法是最具前景的研究方向。若批准此项调查，我方最优秀的学者将全力投入这一突破。"
 tv_research.10.d_scientific_revolution:0 "科学院学者认为科学革命是最具前景的研究方向。若批准此项调查，我方最优秀的学者将全力投入这一突破。"
 tv_research.10.d_manufactories:0 "科学院学者认为工厂制造是最具前景的研究方向。若批准此项调查，我方最优秀的学者将全力投入这一突破。"
 tv_research.10.d_industrialization:0 "科学院学者认为工业化是最具前景的研究方向。若批准此项调查，我方最优秀的学者将全力投入这一突破。"
 tv_research.10.d_vaccination:0 "科学院学者认为疫苗接种是最具前景的研究方向。若批准此项调查，我方最优秀的学者将全力投入这一突破。"
 tv_research.10.a:0 "批准调查。"
 tv_research.10.b:0 "否决，我们尚未准备好。"

 # tv_research.11 — 放弃目标确认
 tv_research.11.t:0 "确认放弃研究计划？"
 tv_research.11.d:0 "放弃当前研究目标意味着失去迄今积累的所有进度。学者们将备受打击，我们也需要一段时间才能提出新的研究方向。"
 tv_research.11.a:0 "放弃研究。"
 tv_research.11.b:0 "继续——我改变主意了。"

 # tv_research.20 — 开展集中研究确认
 tv_research.20.t:0 "开展集中研究"
 tv_research.20.d:0 "前置条件已就绪，首席科学家蓄势待发。此举将占用其全部精力，并每月消耗国家资源，直至取得突破。"
 tv_research.20.a:0 "开始集中研究。"
 tv_research.20.b:0 "暂不行动，稍后决定。"

 # tv_research.30 — 革新解锁通知
 tv_research.30.t:0 "重大突破！"
 tv_research.30.d_printing_press:0 "历经数年专注研究，我方科学院终于成功。印刷术的原理已然掌握，这一知识将彻底改变我们的文明。"
 tv_research.30.d_iron_working:0 "历经数年专注研究，我方科学院终于成功。炼铁技术的原理已然掌握，这一知识将彻底改变我们的文明。"
 tv_research.30.d_anatomy:0 "历经数年专注研究，我方科学院终于成功。解剖学的原理已然掌握，这一知识将彻底改变我们的文明。"
 tv_research.30.d_gunpowder:0 "历经数年专注研究，我方科学院终于成功。火药技术的原理已然掌握，这一知识将彻底改变我们的文明。"
 tv_research.30.d_blast_furnace:0 "历经数年专注研究，我方科学院终于成功。高炉炼铁的原理已然掌握，这一知识将彻底改变我们的文明。"
 tv_research.30.d_scientific_experimentation:0 "历经数年专注研究，我方科学院终于成功。科学实验方法的原理已然掌握，这一知识将彻底改变我们的文明。"
 tv_research.30.d_scientific_revolution:0 "历经数年专注研究，我方科学院终于成功。科学革命的原理已然掌握，这一知识将彻底改变我们的文明。"
 tv_research.30.d_manufactories:0 "历经数年专注研究，我方科学院终于成功。工厂制造的原理已然掌握，这一知识将彻底改变我们的文明。"
 tv_research.30.d_industrialization:0 "历经数年专注研究，我方科学院终于成功。工业化的原理已然掌握，这一知识将彻底改变我们的文明。"
 tv_research.30.d_vaccination:0 "历经数年专注研究，我方科学院终于成功。疫苗接种的原理已然掌握，这一知识将彻底改变我们的文明。"
 tv_research.30.a:0 "知识的伟大胜利！"

