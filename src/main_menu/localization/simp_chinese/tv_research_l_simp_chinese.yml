 TV_RM_TARGET_GUNPOWDER_TT:0 "解锁火药革新，使军队得以装备火器与火炮，从根本上改变攻城战术与军事理论。"
 TV_RM_TARGET_BLAST_FURNACE_TT:0 "解锁高炉革新，实现大规模铁器生产，为工业制造奠定基础。"
 TV_RM_TARGET_SCIENTIFIC_EXPERIMENTATION_TT:0 "解锁科学实验革新，确立实证研究方法，加速自然哲学与应用科学的全面进步。"
 TV_RM_TARGET_SCIENTIFIC_REVOLUTION_TT:0 "解锁科学革命革新，这一划时代突破重新塑造了人类对自然界的认知，并奠定了现代科学的基础。"
 TV_RM_TARGET_MANUFACTORIES_TT:0 "解锁工场生产革新，引入原始工业化生产方式，大幅提升产出与经济实力。"
 TV_RM_TARGET_INDUSTRIALIZATION_TT:0 "解锁工业革命革新，推动机械化生产，从根本上增强国家的经济与军事潜能。"
 TV_RM_TARGET_VACCINATION_TT:0 "解锁疫苗革新，为人口提供瘟疫防护，大幅减少疫情造成的人口损失。"
 TV_RM_TARGET_RENAISSANCE_TT:0 "解锁文艺复兴革新，使[tv_academy_of_sciences|E]研究可越过通常的文艺复兴思潮门槛。"
 TV_RM_TARGET_BANKING_TT:0 "解锁银行系统革新，使[tv_academy_of_sciences|E]研究可越过通常的银行系统思潮门槛。"
 TV_RM_TARGET_PROFESSIONAL_ARMIES_TT:0 "解锁职业军队革新，使[tv_academy_of_sciences|E]研究可越过通常的职业军队思潮门槛。"
 TV_RM_TARGET_NEW_WORLD_TT:0 "解锁发现新大陆革新，使[tv_academy_of_sciences|E]研究可越过通常的新大陆思潮门槛。"
 TV_RM_TARGET_PIKE_AND_SHOT_TT:0 "解锁枪刺与射击革新，使[tv_academy_of_sciences|E]研究可越过通常的枪刺与射击思潮门槛。"
 TV_RM_TARGET_CONFESSIONALISM_TT:0 "解锁认信主义革新，使[tv_academy_of_sciences|E]研究可越过通常的认信主义思潮门槛。"
 TV_RM_TARGET_GLOBAL_TRADE_TT:0 "解锁全球贸易革新，使[tv_academy_of_sciences|E]研究可越过通常的全球贸易思潮门槛。"
 TV_RM_TARGET_ARTILLERY_INSTITUTION_TT:0 "解锁炮兵应用革新，使[tv_academy_of_sciences|E]研究可越过通常的炮兵思潮门槛。"
 TV_RM_TARGET_MILITARY_REVOLUTION_TT:0 "解锁军事革命革新，使[tv_academy_of_sciences|E]研究可越过通常的军事革命思潮门槛。"
 TV_RM_TARGET_ENLIGHTENMENT_TT:0 "解锁启蒙运动革新，使[tv_academy_of_sciences|E]研究可越过通常的启蒙运动思潮门槛。"
