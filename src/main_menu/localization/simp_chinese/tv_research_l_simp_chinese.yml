 tv_research.103.t: "[tv_concentrated_research|E]：不堪重负！"
 tv_research.103.d_tier1: "工作开始吞噬工作者。[SCOPE.sCharacter('tv_research_scientist').GetShortName]如今回答普通问题时也像在回应指控，助手们则学会了从其肩膀的弧度判断时辰。[tv_concentrated_research|E]需要注意力，但没有休息的注意力会让判断变脆。[tv_academy_of_sciences|E]能在每一条指示里听出压力，而项目也因为主持者不再完整而变得更不确定。\n\n#R 该事件出现是因为你的[tv_chief_scientist|E]的[tv_effective_administrative_skill|E]低于20。#!"
 tv_research.103.d_tier2: "工作开始吞噬工作者。[SCOPE.sCharacter('tv_research_scientist').GetShortName]如今回答普通问题时也像在回应指控，助手们则学会了从其肩膀的弧度判断时辰。[tv_concentrated_research|E]需要注意力，但没有休息的注意力会让判断变脆。[tv_academy_of_sciences|E]能在每一条指示里听出压力，而项目也因为主持者不再完整而变得更不确定。\n\n#R 该事件出现是因为你的[tv_chief_scientist|E]的[tv_effective_administrative_skill|E]不低于20但低于50。#!"
 tv_research.103.d_tier3: "工作开始吞噬工作者。[SCOPE.sCharacter('tv_research_scientist').GetShortName]如今回答普通问题时也像在回应指控，助手们则学会了从其肩膀的弧度判断时辰。[tv_concentrated_research|E]需要注意力，但没有休息的注意力会让判断变脆。[tv_academy_of_sciences|E]能在每一条指示里听出压力，而项目也因为主持者不再完整而变得更不确定。\n\n#G 该事件出现是因为你的[tv_chief_scientist|E]的[tv_effective_administrative_skill|E]不低于50但低于80。#!"
 tv_research.103.d_tier4: "工作开始吞噬工作者。[SCOPE.sCharacter('tv_research_scientist').GetShortName]如今回答普通问题时也像在回应指控，助手们则学会了从其肩膀的弧度判断时辰。[tv_concentrated_research|E]需要注意力，但没有休息的注意力会让判断变脆。[tv_academy_of_sciences|E]能在每一条指示里听出压力，而项目也因为主持者不再完整而变得更不确定。\n\n#G 该事件出现是因为你的[tv_chief_scientist|E]的[tv_effective_administrative_skill|E]不低于80。#!"
 tv_research.103.a: "先在压力吃掉工作前缓一缓。"
 tv_research.104.t: "[tv_concentrated_research|E]：彻底的失败！"
 tv_research.104.d: "工作核心的前提干净利落地裂成了两半。[SCOPE.sCharacter('tv_research_scientist').GetShortName]先用新测量维护它，又用旧权威维护它，最后只剩沉默。如今再假装[tv_research_target|E]仍然立在这块地基上，已经没有任何用处。[tv_concentrated_research|E]必须从废墟中重新开始，而废墟至少诚实到不再撒谎。\n\n#R 该事件出现是因为你的[tv_chief_scientist|E]的[tv_effective_administrative_skill|E]低于20。#!"
 tv_research.104.a: "抢救仍能教人的东西。"
 tv_research.105.t: "[tv_concentrated_research|E]：科学家累倒！"
 tv_research.105.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName]越过了所有明智的界限，而身体终于发出了否决。助手们在药物、冷掉的食物和一盏早该熄灭的灯旁发现了未完成的笔记。[tv_concentrated_research|E]用健康换取速度，而任何[tv_academy_of_sciences|E]都不该轻易接受这种交易。房间里仍堆满工作，但正中央那把椅子如今显得脆弱得可怕。\n\n#R 该事件出现是因为你的[tv_chief_scientist|E]的[tv_effective_administrative_skill|E]低于20。#!"
 tv_research.105.a: "没有发现值得换一把空椅子。"
 tv_research.106.t: "[tv_concentrated_research|E]：搞砸了！"
 tv_research.106.d: "[tv_academy_of_sciences|E]一件昂贵仪器在最糟糕的时刻碎裂了。[SCOPE.sCharacter('tv_research_scientist').GetShortName]坚称这次尝试必要，但地板上仍闪着必要也可能笨拙的证据。助手们已经开始争论哪些读数还能用，哪些必须随玻璃一起埋葬。[tv_concentrated_research|E]可以继续，但会少一些体面，也少一些工具。\n\n#R 该事件出现是因为你的[tv_chief_scientist|E]的[tv_effective_administrative_skill|E]低于20。#!"
 tv_research.106.a: "在工作冷却前补上仪器。"
 tv_research.106.b: "清点碎片，继续前进。"
 tv_research.107.t: "[tv_concentrated_research|E]：耗材消耗巨大！"
 tv_research.107.d: "项目正在以惊人速度吞掉墨水、玻璃、稀有粉末、金属配件和耐心。[SCOPE.sCharacter('tv_research_scientist').GetShortName]称其为必要迭代，而军需官称之为一张有书法修养的昂贵胃口。[tv_academy_of_sciences|E]无法靠空架子完成[tv_concentrated_research|E]。在节省变成另一种失败前，我们必须购买替代品。\n\n#R 该事件出现是因为你的[tv_chief_scientist|E]的[tv_effective_administrative_skill|E]低于50。#!"
 tv_research.107.a: "买下表格要求的一切。"
 tv_research.108.t: "[tv_concentrated_research|E]：方向错误！"
 tv_research.108.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName]的方法优雅到危险。它能漂亮解释早期结果，却在[tv_research_target|E]提出更难问题时屡屡失败。助手们开始带着紧张的顺从继续抄写，仿佛知道它错了，却尚未获得说出口的许可。在骄傲变成流程之前，[tv_concentrated_research|E]必须转向。\n\n#R 该事件出现是因为你的[tv_chief_scientist|E]的[tv_effective_administrative_skill|E]低于50。#!"
 tv_research.108.a: "在骄傲凝固前调转罗盘。"
 tv_research.109.t: "[tv_concentrated_research|E]：可笑的断言！"
 tv_research.109.d: "[tv_academy_of_sciences|E]还没来得及修饰论证，[SCOPE.sCharacter('tv_research_scientist').GetShortName]就把它公开了。这个断言大胆、好记，而且错得连无聊贵族都能享受。廷臣们已经开始带着添油加醋重复它，而嘲笑正是这样变得长久。[tv_concentrated_research|E]不只是绊了一跤；它是在观众面前表演了一次摔倒。\n\n#R 该事件出现是因为你的[tv_chief_scientist|E]的[tv_effective_administrative_skill|E]低于50。#!"
 tv_research.109.a: "悄悄撤回这项主张。"
 tv_research.110.t: "[tv_concentrated_research|E]：笨手笨脚！"
 tv_research.110.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName]被困在一项本不该惊动内阁的小任务里。每一天用于完善其排列，都等于从[tv_research_target|E]那里偷走一天，而除了守着错误的人之外，人人都知道这一点。一名大臣必须带着处理家族争吵般的强忍耐心走进实验室。[tv_concentrated_research|E]有时需要天才；今天它只需要有人把纸挪开。\n\n#R 该事件出现是因为你的[tv_chief_scientist|E]的[tv_effective_administrative_skill|E]低于50。#!"
 tv_research.110.a: "派内阁去疏通这台机器。"
 tv_research.111.t: "[tv_concentrated_research|E]：需要帮助！"
 tv_research.111.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName]承认自己无法独力完成工作。这份承认来得晚、带着骄傲，但仍然必要，因此也许还能挽救[tv_research_target|E]。[SCOPE.sCharacter('tv_research_cabinet').GetShortName]必须坐到表格之间，把散乱要求翻译成命令，并让助手们重新相信日程。[tv_concentrated_research|E]需要另一双手，并不因此减少学术性。\n\n#R 该事件出现是因为你的[tv_chief_scientist|E]的[tv_effective_administrative_skill|E]不低于20但低于50。#!"
 tv_research.111.a: "让助手坐上桌边。"
 tv_research.112.t: "[tv_concentrated_research|E]：请求额外耗材！"
 tv_research.112.d: "消耗品储备消失得比整齐估算承诺的更快。[SCOPE.sCharacter('tv_research_scientist').GetShortName]将其归咎于意料之外的复杂性，而复杂性往往是学者不愿把账单叫作账单时使用的词。[tv_academy_of_sciences|E]可以放慢工作、延长库存，也可以买足材料让[tv_concentrated_research|E]继续推进。不论哪种选择，负责把算术写成政策的书记都会记住。\n\n#R 该事件出现是因为你的[tv_chief_scientist|E]的[tv_effective_administrative_skill|E]不低于20但低于50。#!"
 tv_research.112.a: "拉长库存，接受延误。"
 tv_research.112.b: "为新储备付钱。"
 tv_research.113.t: "[tv_concentrated_research|E]：争吵！"
 tv_research.113.d: "争论已经从讲堂溢进了贵族的自尊。[SCOPE.sCharacter('tv_research_scientist').GetShortName]或许是对的，但像耳光一样送来的正确很少能提高满意度。贵族赞助人开始抱怨[tv_academy_of_sciences|E]礼貌收钱，却用拉丁文回赠轻蔑。[tv_concentrated_research|E]可以经受一次争吵，却经受不起每位赞助人都认定羞辱是课程的一部分。\n\n#R 该事件出现是因为你的[tv_chief_scientist|E]的[tv_effective_administrative_skill|E]不低于20但低于50。#!"
 tv_research.113.a: "冷却贵族的火气。"
 tv_research.114.t: "[tv_concentrated_research|E]：大胆的提议！"
 tv_research.114.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName]把一个狂野设想摆在房间中央，并拒绝让任何人绕过去。它可能打开通往[tv_research_target|E]的直路，也可能变成一代人用来举例的错误。助手们在恐惧与敬佩之间分裂，而危险想法常常正是这样自我介绍。[tv_concentrated_research|E]正在询问：我们想要有序谨慎，还是一次跃进的可能？\n\n#Y 该事件出现是因为你的[tv_chief_scientist|E]的[tv_effective_administrative_skill|E]不低于20但低于80。#!"
 tv_research.114.a: "让危险想法喘口气。"
 tv_research.115.t: "[tv_concentrated_research|E]：扩大测试规模！"
 tv_research.115.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName]希望让工作并行推进，而不是单列前进。更多桌子、更多人手与更多同时发生的错误，或许能把[tv_research_target|E]拖近，只要房间不坍缩成昂贵噪音。[tv_academy_of_sciences|E]有足够野心支撑方案，但野心并不等于预算。[tv_concentrated_research|E]如今问我们：规模究竟是勇气，还是急躁？\n\n#Y 该事件出现是因为你的[tv_chief_scientist|E]的[tv_effective_administrative_skill|E]不低于20但低于80。#!"
 tv_research.115.a: "资助更宽的试验。"
 tv_research.115.b: "一张桌子已经够了。"
 tv_research.116.t: "[tv_concentrated_research|E]：更换班组！"
 tv_research.116.d: "当前团队已经开始保护习惯，而非保护成果。[SCOPE.sCharacter('tv_research_scientist').GetShortName]希望由[SCOPE.sCharacter('tv_research_cabinet').GetShortName]重新分配职责，拆开旧日嫌隙，并把最吵的助手放到其噪音能变得有用的位置。这样的调整可能推动[tv_concentrated_research|E]前进，也可能只给所有人新的怨恨理由。[tv_academy_of_sciences|E]等待我们决定：秩序究竟该被修补，还是被扰动。\n\n#Y 该事件出现是因为你的[tv_chief_scientist|E]的[tv_effective_administrative_skill|E]不低于20但低于80。#!"
 tv_research.116.a: "重新洗牌这间屋子。"
 tv_research.116.b: "让秩序保持原状。"
 tv_research.117.t: "[tv_concentrated_research|E]：喜忧参半！"
 tv_research.117.d: "到了黎明，[SCOPE.sCharacter('tv_research_scientist').GetShortName]做到了。一次重大推进躺在桌上，周围是冷却的蜡、疲惫的助手，以及过度用力之后那种危险的安静。[tv_research_target|E]更近了，但把它拖近的人付出了健康。[tv_concentrated_research|E]给出了一份带齿的祝福，屋内众人也懂得不该欢呼得太响。\n\n#Y 该事件出现是因为你的[tv_chief_scientist|E]的[tv_effective_administrative_skill|E]不低于20但低于80。#!"
 tv_research.117.a: "进步索取了它的什一税。"
 tv_research.118.t: "[tv_concentrated_research|E]：金钱的力量！"
 tv_research.118.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName]在请求许可之前先买下了速度。成果真实到让愤怒显得不方便，账单庞大到让批准显得尴尬。[tv_academy_of_sciences|E]可以称之为主动性，国库则称其为一场字迹礼貌的突袭。[tv_concentrated_research|E]有所推进，但国家现在必须为金钱能跑赢流程这堂课付费。\n\n#Y 该事件出现是因为你的[tv_chief_scientist|E]的[tv_effective_administrative_skill|E]不低于20但低于80。#!"
 tv_research.118.a: "付钱，然后索要收据。"
 tv_research.119.t: "[tv_concentrated_research|E]：请求王室授权！"
 tv_research.119.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName]请求获得越过许可、征用低级官署时间、并在委员会还没对材料睡着前先行调拨的权力。这可能大幅拉近[tv_research_target|E]。它也可能让[tv_academy_of_sciences|E]学会，急迫是支配邻人的好借口。[tv_concentrated_research|E]正在索要王室印玺，而印玺会记住谁借走过它。\n\n#Y 该事件出现是因为你的[tv_chief_scientist|E]的[tv_effective_administrative_skill|E]不低于20但低于80。#!"
 tv_research.119.a: "把印玺交给科学。"
 tv_research.119.b: "让印玺留在内阁。"
 tv_research.120.t: "[tv_concentrated_research|E]：认识和学习！"
 tv_research.120.d: "实践改变了[SCOPE.sCharacter('tv_research_scientist').GetShortName]。那些曾经需要费力处理的表格，如今墨迹未干便已得到判断，助手们的错误也在变成习惯前被纠正。[tv_academy_of_sciences|E]尤其注意这种进步，因为它让其他每件事都少了些戏剧性。当掌握不再需要自我宣告时，[tv_concentrated_research|E]会推进得更平稳。\n\n#G 该事件出现是因为你的[tv_chief_scientist|E]的[tv_effective_administrative_skill|E]不低于50但低于80。#!"
 tv_research.120.a: "让熟练安静沉淀。"
 tv_research.121.t: "[tv_concentrated_research|E]：内阁协作！"
 tv_research.121.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName]近期的工作让内阁少了几分表演，多了几分有用。过去带着意见抵达的大臣，如今带着清单抵达，而[tv_academy_of_sciences|E]把这视为小型奇迹。榜样会传播，因为能力在被看见并奖励时更容易被模仿。[tv_concentrated_research|E]得到的不只是进度，还有一个短暂愿意像研究仪器那样运转的政府。\n\n#G 该事件出现是因为你的[tv_chief_scientist|E]的[tv_effective_administrative_skill|E]不低于50但低于80。#!"
 tv_research.121.a: "让榜样安静发挥作用。"
 tv_research.122.t: "[tv_concentrated_research|E]：线索！"
 tv_research.122.d: "某个小东西拒绝合位。[SCOPE.sCharacter('tv_research_scientist').GetShortName]之所以注意到这个顽固细节，正因为其他人已经决定它只是错误。它也许通向空处，但许多好路最初都伪装成页边恼人的不协调。[tv_research_target|E]仍然遥远，但[tv_concentrated_research|E]得到了一根值得拉扯的线。\n\n#G 该事件出现是因为你的[tv_chief_scientist|E]的[tv_effective_administrative_skill|E]不低于50但低于80。#!"
 tv_research.122.a: "追踪这条顽固线索。"
 tv_research.123.t: "[tv_concentrated_research|E]：研究伙伴！"
 tv_research.123.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName]与[SCOPE.sCharacter('tv_research_cabinet').GetShortName]从正式职责中偷出一点时间，争论起这项计划。最初只是解释，随后变成交流，再变成修正，最后成了两颗头脑发现纸张都不够用的罕见乐趣。二人离开时都比来时更锋利。当学术不再只是孤独表演，而成为能当场改进答案的房间，[tv_concentrated_research|E]便会受益。\n\n#G 该事件出现是因为你的[tv_chief_scientist|E]的[tv_effective_administrative_skill|E]不低于50。#!"
 tv_research.123.a: "好头脑会互相磨利。"
 tv_research.124.t: "[tv_concentrated_research|E]：即时返利！"
 tv_research.124.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName]的原型从理论走进了一位贵族的钱袋。演示短暂、耀眼，而且实用到连廷臣也明白钱该流向哪里。所得已经上交国家，让[tv_academy_of_sciences|E]难得能解释：科学也能支付账单。当国库露出笑容，[tv_concentrated_research|E]便在更温暖的灯光下前进。\n\n#G 该事件出现是因为你的[tv_chief_scientist|E]的[tv_effective_administrative_skill|E]不低于50。#!"
 tv_research.124.a: "把钱重新投入秩序。"
 tv_research.125.t: "[tv_concentrated_research|E]：勤奋！"
 tv_research.125.d: "[tv_academy_of_sciences|E]度过了罕见的好一周。[SCOPE.sCharacter('tv_research_scientist').GetShortName]在委员会拖慢决定前就把决定变成了成果，助手们也开始期待能力，而不是期待救援。我们可以把每一份收获都指向[tv_research_target|E]，也可以让一部分成功转化为公开荣光。[tv_concentrated_research|E]提出了一个愉快的问题：当效率终于足够时，该拿它做什么？\n\n#G 该事件出现是因为你的[tv_chief_scientist|E]的[tv_effective_administrative_skill|E]不低于50。#!"
 tv_research.125.a: "让所有人继续扑在研究上。"
 tv_research.125.b: "让成功成为公开威望。"
 tv_research.126.t: "[tv_concentrated_research|E]：公开研讨！"
 tv_research.126.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName]为一场公开研讨打开了门，并谨慎藏起[tv_concentrated_research|E]中会吓坏赞助人或把他们无聊到残忍的部分。人群听到的足以让他们觉得自己参与其中，又不足以让他们插手。学生离开时受到鼓舞，贵族离开时觉得受了奉承，而[tv_academy_of_sciences|E]得到的善意比早晨更多。按量度来说，[tv_research_target|E]并没有更近，但国家更愿意相信它终会抵达。\n\n#G 该事件出现是因为你的[tv_chief_scientist|E]的[tv_effective_administrative_skill|E]不低于50。#!"
 tv_research.126.a: "让掌声也做点事。"
 tv_research.127.t: "[tv_concentrated_research|E]：突破！"
 tv_research.127.d: "最新推论经受住了所有杀死它的尝试。[SCOPE.sCharacter('tv_research_scientist').GetShortName]从敌意角度检验主张，邀请反驳，然后看着结果一次次站得更直。[tv_academy_of_sciences|E]知道真正突破的声音：先是沉默，然后是疯狂誊抄。[tv_concentrated_research|E]在墙上找到了一扇门，而这一次，门真的打开了。\n\n#G 该事件出现是因为你的[tv_chief_scientist|E]的[tv_effective_administrative_skill|E]不低于80。#!"
 tv_research.127.a: "这就是门被打开的声音。"
 tv_research.128.t: "[tv_concentrated_research|E]：协同进步！"
 tv_research.128.d: "这一发现进入教士主导的学术领域，比预想更快。[SCOPE.sCharacter('tv_research_scientist').GetShortName]把工作表述得足够谨慎，使有学识的教士可以使用它，而不觉得自己被它征服。布道、学校与安静通信，如今都带着[tv_research_target|E]的片段走出[tv_academy_of_sciences|E]墙外。[tv_concentrated_research|E]不再只是闭门房间；它在国家中找到了另一条道路。\n\n#G 该事件出现是因为你的[tv_chief_scientist|E]的[tv_effective_administrative_skill|E]不低于80。#!"
 tv_research.128.a: "知识找到了另一条路。"
 tv_research.129.t: "[tv_concentrated_research|E]：榜样！"
 tv_research.129.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName]的进展以最好的形式逃出了[tv_academy_of_sciences|E]：不是丑闻，而是赞赏。昨日还解释不清工作内容的廷臣，如今赞美其纪律、前景，以及赞助它的王室自然无比英明。[tv_research_target|E]不再只是任务，也成了象征。当威望本身开始帮忙搬运纸张，[tv_concentrated_research|E]便获得了新的动量。\n\n#G 该事件出现是因为你的[tv_chief_scientist|E]的[tv_effective_administrative_skill|E]不低于80。#!"
 tv_research.129.a: "让宫廷享受一次学术胜利。"

