 tv_research.101.a: "标出死路，继续前进。"
 tv_research.102.t: "[tv_concentrated_research|E]：忙里偷闲！"
 tv_research.102.d_tier1: "门仍然关着，但[SCOPE.sCharacter('tv_research_scientist').GetShortName]终于让房间喘了口气。账册被重新整理，失败样本被诚实标注，助手们得到的任务也不再彼此冲突。这算不上伟大发现，但[tv_concentrated_research|E]常常要先变得有秩序，才有资格变得聪明。[tv_chief_scientist|E]把疲惫转化成了一种还能撑过下个月的方法。\n\n#R 该事件出现是因为你的[tv_chief_scientist|E]的[tv_effective_administrative_skill|E]低于20。#!"
 tv_research.102.d_tier2: "门仍然关着，但[SCOPE.sCharacter('tv_research_scientist').GetShortName]终于让房间喘了口气。账册被重新整理，失败样本被诚实标注，助手们得到的任务也不再彼此冲突。这算不上伟大发现，但[tv_concentrated_research|E]常常要先变得有秩序，才有资格变得聪明。[tv_chief_scientist|E]把疲惫转化成了一种还能撑过下个月的方法。\n\n#R 该事件出现是因为你的[tv_chief_scientist|E]的[tv_effective_administrative_skill|E]不低于20但低于50。#!"
