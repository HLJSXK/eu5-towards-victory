 # tv_research.11 — 放弃目标确认
 tv_research.11.t: "[tv_research_target|E]：确认放弃研究计划？"
 tv_research.11.d: "当前[tv_research_target|E]已经消耗了通信、仪器、人情、耐心，以及书记都懒得清点的蜡烛残根。放弃它不会是一次安静的转向，而是在承认[tv_academy_of_sciences|E]眼下的道路通向不了有用之处。所有已积累进度都会丢失，宫廷还必须花费10点威望解释为什么昨日的伟大必要变成了今日的错误。有些学者会觉得解脱，另一些则会觉得遭到背叛。这个决定也许仍然明智，但明智有时会戴着尴尬的面具抵达。"
 tv_research.11.a: "合上账册，忍受低语。"
 tv_research.11.b: "不，这条路仍要走下去。"

 # tv_research.19 — 集中研究可用通知
 tv_research.19.t: "[tv_concentrated_research|E]：[tv_academy_of_sciences|E]已准备就绪"
 tv_research.19.d: "[tv_academy_of_sciences|E]已经完成了让天才不那么孤独的缓慢工作。[tv_research_interest|E]已聚集足够赞助与注意，前置研究不再抱怨得那么响亮，[tv_literacy_foundation|E]也足够宽阔，能让发现走出一间上锁的房间。助手们重新誊抄表格，仪器也完成检查，[tv_chief_scientist|E]开始拒绝晚宴邀请。最后阶段如今可以开始。[tv_concentrated_research|E]会把准备转化为压力。"
 tv_research.19.a: "把灯移近些。"

 # tv_research.20 — 开展集中研究确认
 tv_research.20.t: "[tv_concentrated_research|E]：开展集中研究"
 tv_research.20.d: "前置条件已就绪，[tv_chief_scientist|E]也准备将[tv_academy_of_sciences|E]拉入最严苛的节奏。门会关闭，通信会收窄，每一名助手都会学会哪种沉默意味着专注，哪种沉默意味着灾难。[tv_concentrated_research|E]期间可能出现随机事件：有能力的[tv_chief_scientist|E]更容易带来正面进展，而不称职者会反复招致失败。这项工作不会宽恕虚荣、仓促或软弱的行政能力。[tv_chief_scientist|E]必须至少拥有20点[tv_effective_administrative_skill|E]，才能开始或完成[tv_concentrated_research|E]。一般来说，等效能力高于50才有利于研究顺利推进。"
 tv_research.20.a: "开始闭门苦工。"
 tv_research.20.random_events.tt: "[tv_concentrated_research|E]期间可能出现随机事件。更高的[tv_effective_administrative_skill|E]会解锁更好的事件池；更低的等效能力会解锁更糟糕的事件池。"
 tv_research.20.b: "暂且不要点灯。"

 # tv_research.100-129 — 集中研究随机事件
 tv_research.100.t: "[tv_concentrated_research|E]：灵感！"
 tv_research.100.d_tier1: "在[tv_concentrated_research|E]闭门苦工的压力中，[SCOPE.sCharacter('tv_research_scientist').GetShortName]把一个恼人的矛盾变成了可用思路。助手们最初以为那只是另一条页边注，随后才发现桌上的每一份表格都能围绕它重新排列。[tv_academy_of_sciences|E]尚未解开[tv_research_target|E]，但房间里的声音已经不再像失败。连疲惫的书记都抄得更快了，因为希望比命令便宜，也比纪律更容易传染。\n\n#R 该事件出现是因为你的[tv_chief_scientist|E]的[tv_effective_administrative_skill|E]低于20。#!"
