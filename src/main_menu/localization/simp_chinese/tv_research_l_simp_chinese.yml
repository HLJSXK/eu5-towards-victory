l_simp_chinese:
 # ── 科学院 IO 领袖称谓（character类型需要性别后缀变体）────────────────────────────
 TV_ACADEMY_IO_LEADER_MALE:0 "科学院院长"
 TV_ACADEMY_IO_LEADER_FEMALE:0 "科学院院长"

 # ── IO 变量显示格式 ────────────────────────────────────────────────────────────
 TV_C_PROGRESS_FORMAT:0 "$VALUE|0$/100"
 TV_C_PROGRESS_CHANGE_FORMAT:0 "$VALUE|2$/月"
 TV_D_PROGRESS_FORMAT:0 "$VALUE|0$/100"
 TV_D_PROGRESS_CHANGE_FORMAT:0 "$VALUE|2$/月"

 # ── IO 变量月度变化描述 ────────────────────────────────────────────────────────
 TV_C_LITERACY_CONTRIBUTION:0 "识字基础（国民识字率）"
 TV_D_RESEARCH_CONTRIBUTION:0 "集中研究（首席科学家行政技能）"

 # ── 研究机制 UI 按钮 ───────────────────────────────────────────────────────────
 TV_RM_REQUEST_TARGET_BTN:0 "申请研究目标"
 TV_RM_ABANDON_TARGET_BTN:0 "放弃研究目标"
 TV_RM_START_D_BTN:0 "开展集中研究"

 # ── 研究机制 UI 标签 ───────────────────────────────────────────────────────────
 TV_RM_SELECTION_CD_LABEL:0 "选择冷却（月）："
 TV_RM_CHIEF_SCIENTIST_LABEL:0 "首席科学家："

 # ── 目标革新名称 ────────────────────────────────────────────────────────────────
 TV_RM_TARGET_PRINTING_PRESS:0 "印刷术"
 TV_RM_TARGET_STEAM_ENGINE:0 "蒸汽机"

 # ── 通用动作键 ────────────────────────────────────────────────────────────────
 tv_request_research_target:0 "申请研究目标"
 tv_request_research_target_desc:0 "请科学院提议一个研究方向。目标将从当前锁定的前沿技术中随机选取。"
 tv_abandon_research_target:0 "放弃研究目标"
 tv_abandon_research_target_desc:0 "放弃当前研究目标，所有进度将会丢失，并触发12个月的冷却。"
 tv_start_concentrated_research:0 "开展集中研究"
 tv_start_concentrated_research_desc:0 "指示首席科学家全力攻关。所有前置子流程均需完成方可启动。"

 # ── 研究事件 ──────────────────────────────────────────────────────────────────

 # tv_research.1 — 月度兴趣事件
 tv_research.1.t:0 "好奇之火"
 tv_research.1.d:0 "宫廷中一位成员对科学院当前研究课题展现出异乎寻常的求知热情，若加以引导，或许大有裨益。"
 tv_research.1.a:0 "鼓励探究。"
 tv_research.1.b:0 "不过是分心之举，不必理会。"

 # tv_research.10 — 目标选择提案
 tv_research.10.t:0 "科学院提出研究方向"
 tv_research.10.d_printing_press:0 "科学院学者认为印刷术是最具前景的研究方向。若批准此项调查，我方最优秀的学者将全力投入这一突破。"
 tv_research.10.d_steam_engine:0 "科学院学者认为蒸汽机是最具前景的研究方向。若批准此项调查，我方最优秀的学者将全力投入这一突破。"
 tv_research.10.a:0 "批准调查。"
 tv_research.10.b:0 "否决，我们尚未准备好。"

 # tv_research.11 — 放弃目标确认
 tv_research.11.t:0 "确认放弃研究计划？"
 tv_research.11.d:0 "放弃当前研究目标意味着失去迄今积累的所有进度。学者们将备受打击，我们也需要一段时间才能提出新的研究方向。"
 tv_research.11.a:0 "放弃研究。"
 tv_research.11.b:0 "继续——我改变主意了。"

 # tv_research.20 — 开展集中研究确认
 tv_research.20.t:0 "开展集中研究"
 tv_research.20.d:0 "前置条件已就绪，首席科学家蓄势待发。此举将占用其全部精力，并每月消耗国家资源，直至取得突破。"
 tv_research.20.a:0 "开始集中研究。"
 tv_research.20.b:0 "暂不行动，稍后决定。"

 # tv_research.30 — 革新解锁通知
 tv_research.30.t:0 "重大突破！"
 tv_research.30.d_printing_press:0 "历经数年专注研究，我方科学院终于成功。印刷术的原理已然掌握，这一知识将彻底改变我们的文明。"
 tv_research.30.d_steam_engine:0 "历经数年专注研究，我方科学院终于成功。蒸汽机的原理已然掌握，这一知识将彻底改变我们的文明。"
 tv_research.30.a:0 "知识的伟大胜利！"
