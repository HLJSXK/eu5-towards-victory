 # tv_research.10 — 目标选择提案
 tv_research.10.t: "[tv_research_target|E]：[tv_academy_of_sciences|E]提出研究方向"
 tv_research.10.d_printing_press: "[tv_academy_of_sciences|E]将目光投向了活字，这不是确信，而是面对一扇上锁之门时才会出现的饥渴。讲师开始绕着这个主题授课，书记誊抄出可疑相似的图样，赞助人也突然宣称自己一直关心活字。\n\n#Y 目标科技：印刷机应用#!\n\n若我们批准，[tv_research_interest|E]就必须被慢慢培育，直到流言变成承诺。[tv_chief_scientist|E]提醒我们，突破总以热情开始，却立刻要求纪律。"
 tv_research.10.d_iron_working: "[tv_academy_of_sciences|E]将目光投向了更坚硬的金属，这不是确信，而是面对一扇上锁之门时才会出现的饥渴。讲师开始绕着这个主题授课，书记誊抄出可疑相似的图样，赞助人也突然宣称自己一直关心炉火与矿石。\n\n#Y 目标科技：炼铁#!\n\n若我们批准，[tv_research_interest|E]就必须被慢慢培育，直到流言变成承诺。[tv_chief_scientist|E]提醒我们，突破总以热情开始，却立刻要求纪律。"
 tv_research.10.d_gunpowder: "[tv_academy_of_sciences|E]将目光投向了烟、硝石与雷声，这不是确信，而是面对一扇上锁之门时才会出现的饥渴。讲师开始绕着这个主题授课，书记誊抄出可疑相似的图样，赞助人也突然宣称自己一直关心可控爆炸。\n\n#Y 目标科技：火药#!\n\n若我们批准，[tv_research_interest|E]就必须被慢慢培育，直到流言变成承诺。[tv_chief_scientist|E]提醒我们，突破总以热情开始，却立刻要求纪律。"
 tv_research.10.d_blast_furnace: "[tv_academy_of_sciences|E]将目光投向了更炽烈的火，这不是确信，而是面对一扇上锁之门时才会出现的饥渴。讲师开始绕着这个主题授课，书记誊抄出可疑相似的图样，赞助人也突然宣称自己一直关心风道与砖墙。\n\n#Y 目标科技：高炉#!\n\n若我们批准，[tv_research_interest|E]就必须被慢慢培育，直到流言变成承诺。[tv_chief_scientist|E]提醒我们，突破总以热情开始，却立刻要求纪律。"
 tv_research.10.d_scientific_experimentation: "[tv_academy_of_sciences|E]将目光投向了可重复的证据，这不是确信，而是面对一扇上锁之门时才会出现的饥渴。讲师开始绕着这个主题授课，书记誊抄出可疑相似的图样，赞助人也突然宣称自己一直关心能羞辱记忆的仪器。\n\n#Y 目标科技：科学实验#!\n\n若我们批准，[tv_research_interest|E]就必须被慢慢培育，直到流言变成承诺。[tv_chief_scientist|E]提醒我们，突破总以热情开始，却立刻要求纪律。"
 tv_research.10.d_scientific_revolution: "[tv_academy_of_sciences|E]将目光投向了重塑自然秩序，这不是确信，而是面对一扇上锁之门时才会出现的饥渴。讲师开始绕着这个主题授课，书记誊抄出可疑相似的图样，赞助人也突然宣称自己一直关心旧天空的新法则。\n\n#Y 目标科技：科学革命#!\n\n若我们批准，[tv_research_interest|E]就必须被慢慢培育，直到流言变成承诺。[tv_chief_scientist|E]提醒我们，突破总以热情开始，却立刻要求纪律。"
 tv_research.10.d_manufactories: "[tv_academy_of_sciences|E]将目光投向了更有纪律的工坊，这不是确信，而是面对一扇上锁之门时才会出现的饥渴。讲师开始绕着这个主题授课，书记誊抄出可疑相似的图样，赞助人也突然宣称自己一直关心被切成巧妙片段的劳动。\n\n#Y 目标科技：工场生产#!\n\n若我们批准，[tv_research_interest|E]就必须被慢慢培育，直到流言变成承诺。[tv_chief_scientist|E]提醒我们，突破总以热情开始，却立刻要求纪律。"
 tv_research.10.d_industrialization: "[tv_academy_of_sciences|E]将目光投向了不会睡觉的机器，这不是确信，而是面对一扇上锁之门时才会出现的饥渴。讲师开始绕着这个主题授课，书记誊抄出可疑相似的图样，赞助人也突然宣称自己一直关心被束缚到生产中的力量。\n\n#Y 目标科技：工业革命#!\n\n若我们批准，[tv_research_interest|E]就必须被慢慢培育，直到流言变成承诺。[tv_chief_scientist|E]提醒我们，突破总以热情开始，却立刻要求纪律。"
 tv_research.10.d_vaccination: "[tv_academy_of_sciences|E]将目光投向了教会身体如何活下来，这不是确信，而是面对一扇上锁之门时才会出现的饥渴。讲师开始绕着这个主题授课，医师誊抄出可疑相似的病例，赞助人也突然宣称自己一直关心乡村医疗记录。\n\n#Y 目标科技：疫苗#!\n\n若我们批准，[tv_research_interest|E]就必须被慢慢培育，直到流言变成承诺。[tv_chief_scientist|E]提醒我们，突破总以热情开始，却立刻要求纪律。"
 tv_research.10.d_renaissance: "[tv_academy_of_sciences|E]将目光投向了重新年轻的旧学问，这不是确信，而是面对一扇上锁之门时才会出现的饥渴。讲师开始绕着这个主题授课，书记誊抄出可疑优雅的手稿，赞助人也突然宣称自己一直关心古代权威。\n\n#Y 目标科技：文艺复兴#!\n\n若我们批准，[tv_research_interest|E]就必须被慢慢培育，直到流言变成承诺。[tv_chief_scientist|E]提醒我们，突破总以热情开始，却立刻要求纪律。"
 tv_research.10.d_banking: "[tv_academy_of_sciences|E]将目光投向了信贷、信任与风险，这不是确信，而是面对一扇上锁之门时才会出现的饥渴。讲师开始绕着这个主题授课，书记誊抄出可疑整齐的账册，赞助人也突然宣称自己一直关心承诺的科学。\n\n#Y 目标科技：银行系统#!\n\n若我们批准，[tv_research_interest|E]就必须被慢慢培育，直到流言变成承诺。[tv_chief_scientist|E]提醒我们，突破总以热情开始，却立刻要求纪律。"
 tv_research.10.d_professional_armies: "[tv_academy_of_sciences|E]将目光投向了如何把士兵变成制度，这不是确信，而是面对一扇上锁之门时才会出现的饥渴。讲师开始绕着这个主题授课，书记誊抄出可疑相似的名册，赞助人也突然宣称自己一直关心操练与军饷。\n\n#Y 目标科技：职业军队#!\n\n若我们批准，[tv_research_interest|E]就必须被慢慢培育，直到流言变成承诺。[tv_chief_scientist|E]提醒我们，突破总以热情开始，却立刻要求纪律。"
 tv_research.10.d_new_world: "[tv_academy_of_sciences|E]将目光投向了拒绝旧地图的地平线，这不是确信，而是面对一扇上锁之门时才会出现的饥渴。讲师开始绕着这个主题授课，制图师誊抄出可疑残缺的海岸线，赞助人也突然宣称自己一直关心西风。\n\n#Y 目标科技：发现新大陆#!\n\n若我们批准，[tv_research_interest|E]就必须被慢慢培育，直到流言变成承诺。[tv_chief_scientist|E]提醒我们，突破总以热情开始，却立刻要求纪律。"
 tv_research.10.d_pike_and_shot: "[tv_academy_of_sciences|E]将目光投向了阵形、烟雾与时机，这不是确信，而是面对一扇上锁之门时才会出现的饥渴。讲师开始绕着这个主题授课，操练官誊抄出可疑相似的图样，赞助人也突然宣称自己一直关心步兵几何。\n\n#Y 目标科技：枪刺与射击#!\n\n若我们批准，[tv_research_interest|E]就必须被慢慢培育，直到流言变成承诺。[tv_chief_scientist|E]提醒我们，突破总以热情开始，却立刻要求纪律。"
 tv_research.10.d_confessionalism: "[tv_academy_of_sciences|E]将目光投向了被国家技艺约束的教义，这不是确信，而是面对一扇上锁之门时才会出现的饥渴。讲师开始绕着这个主题授课，书记誊抄出可疑谨慎的公式，赞助人也突然宣称自己一直关心信仰的结构。\n\n#Y 目标科技：认信主义#!\n\n若我们批准，[tv_research_interest|E]就必须被慢慢培育，直到流言变成承诺。[tv_chief_scientist|E]提醒我们，突破总以热情开始，却立刻要求纪律。"
 tv_research.10.d_global_trade: "[tv_academy_of_sciences|E]将目光投向了能跨越海洋的账册，这不是确信，而是面对一扇上锁之门时才会出现的饥渴。讲师开始绕着这个主题授课，代理商誊抄出可疑遥远的价格，赞助人也突然宣称自己一直关心市场回应市场。\n\n#Y 目标科技：全球贸易#!\n\n若我们批准，[tv_research_interest|E]就必须被慢慢培育，直到流言变成承诺。[tv_chief_scientist|E]提醒我们，突破总以热情开始，却立刻要求纪律。"
 tv_research.10.d_artillery_institution: "[tv_academy_of_sciences|E]将目光投向了带炮管的数学，这不是确信，而是面对一扇上锁之门时才会出现的饥渴。讲师开始绕着这个主题授课，工程师誊抄出可疑相似的射表，赞助人也突然宣称自己一直关心角度与城墙。\n\n#Y 目标科技：炮兵应用#!\n\n若我们批准，[tv_research_interest|E]就必须被慢慢培育，直到流言变成承诺。[tv_chief_scientist|E]提醒我们，突破总以热情开始，却立刻要求纪律。"
