 tv_research.10.d_levee_en_masse: "[tv_academy_of_sciences|E]将目光投向了如何把社会本身转化为军事力量，这不是确信，而是面对一扇上锁之门时才会出现的饥渴。讲师开始绕着这个主题授课，书记誊抄出可疑完整的名册，赞助人也突然宣称自己一直关心被完整计数的国家。\n\n#Y 目标科技：全民动员#!\n\n若我们批准，[tv_research_interest|E]就必须被慢慢培育，直到流言变成承诺。[tv_chief_scientist|E]提醒我们，突破总以热情开始，却立刻要求纪律。"
