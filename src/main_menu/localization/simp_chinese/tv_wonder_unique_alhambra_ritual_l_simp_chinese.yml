 tv_engineering_department.7309.t:0 "格拉纳达钥匙与宫廷协和"
 tv_engineering_department.7309.d:0 "使节、译员、公证人、水务监督、宫廷卫兵、受保护家族、工匠与外国观察者聚集在阿尔罕布拉宫内。这座宫殿不能像普通宫廷那样落成。它的证明始于胜者能否在战争仍有实际分量时保存象征钥匙、条约卷宗、安全通行证与水庭。"
 tv_engineering_department.7309.a:0 "开启条约宫廷。"
 tv_engineering_department.7310.t:0 "红墙前的胜利"
 tv_engineering_department.7310.d:0 "条约宫廷等待真正的战争或和平窗口。格拉纳达必须仍被控制，宫殿不能显得遭到洗劫，结算必须在胜利变成普通占领前被见证。这一验证刻意不是计时器。阿尔罕布拉的证明在于把战争结果转化为克制，而不是填满月度进度。"
 tv_engineering_department.7310.a:0 "验证投降窗口。"
 tv_engineering_department.7311.t:0 "宽恕、贡赋或威慑"
 tv_engineering_department.7311.d:0 "条约分支定义宫殿的记忆。宽恕保护家族和工匠，贡赋让投降带来收益，威慑通过受控的接见警告未来叛乱。每条路径都有不同失败。安全通行可能被破坏，水庭可能被忽视，外国副本也可能记录强迫而非协和。"
 tv_engineering_department.7311.a:0 "写下宽恕协和。"
 tv_engineering_department.7311.b:0 "将贡赋绑定到受保护秩序。"
 tv_engineering_department.7312.t:0 "条约获得见证"
 tv_engineering_department.7312.d:0 "象征钥匙被呈入使节厅。译员宣读条款，水被倒入受保护的庭院，工匠与家族被点名，外国观察者收到副本。奖励仍是威望与外交声誉，因为阿尔罕布拉证明征服可以成为受治理的宫廷，而不是无纪律的战利品。"
 tv_engineering_department.7312.a:0 "盖印宫廷条约。"
