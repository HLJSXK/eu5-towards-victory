 tv_engineering_department.1686.t:0 "投降法庭开启"
 tv_engineering_department.1686.d:0 "围绕格拉纳达的战争已经胜利或结束，投降法庭终于得以开启。象征性钥匙、受保护的家户与显贵、工匠与宫廷作坊、灌渠水权与法庭、安全通行证，以及外邦条约副本，全部呈交赞助者以议定投降条款。"
 tv_engineering_department.1686.a:0 "开启投降法庭。"
 tv_engineering_department.1687.t:0 "条款宣读"
 tv_engineering_department.1687.d:0 "每一条条款都被宣读并接受检验：钥匙作为投降的象征，家户不受报复，工匠不致逃散，灌渠法庭不受破坏，安全通行证不受匪患侵扰，外邦副本不被伪造。"
 tv_engineering_department.1687.a:0 "当众宣读条约条款。"
 tv_engineering_department.1688.t:0 "条款受到挑战"
 tv_engineering_department.1688.d:0 "一份被背弃的安全通行证、一处遭劫掠的作坊，或一场有争议的灌渠诉讼，都可能在条约被外邦宫廷见证之前使其瓦解。"
 tv_engineering_department.1688.a:0 "力求宽仁与和解。"
 tv_engineering_department.1688.b:0 "接受更严苛、更狭窄的和议。"
 tv_engineering_department.1689.t:0 "条约获得见证"
 tv_engineering_department.1689.d:0 "钥匙、家户、工匠、灌渠法庭、安全通行证与外邦副本均已清点完毕。投降条约获得见证并封印。"
 tv_engineering_department.1689.a:0 "封印条约。"
 tv_engineering_department.1690.t:0 "确保红堡的安全"
 tv_engineering_department.1690.d:0 "在宫殿可以托付给新秩序之前，正义之门、使节大厅、狮子庭院、宫廷水渠，以及俯瞰韦加平原的城墙，都必须确保安全。"
 tv_engineering_department.1690.a:0 "开始确保宫殿安全。"
 tv_engineering_department.1691.t:0 "宫廷卫队呈报"
 tv_engineering_department.1691.d:0 "每处要点都受到检查：正义之门看人群管控，使节大厅看阴谋，狮子庭院看象征性损毁，水渠看破坏，韦加城墙看袭掠者。"
 tv_engineering_department.1691.a:0 "接收宫廷卫队的呈报。"
 tv_engineering_department.1692.t:0 "城门前的越权行为"
 tv_engineering_department.1692.d:0 "正义之门前卫兵的强硬手段、使节大厅内一间遭劫掠的厅室，或韦加平原上的一次袭掠，都可能使守护变成占领。"
 tv_engineering_department.1692.a:0 "约束卫兵并作出补偿。"
 tv_engineering_department.1692.b:0 "接受更严苛、更狭窄的占领条款。"
 tv_engineering_department.1693.t:0 "红堡确保安全"
 tv_engineering_department.1693.d:0 "正义之门、使节大厅、狮子庭院、水渠与韦加城墙，全部在新秩序下确保安全。"
 tv_engineering_department.1693.a:0 "确认宫殿安全无虞。"
