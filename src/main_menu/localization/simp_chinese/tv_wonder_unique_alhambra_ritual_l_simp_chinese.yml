 tv_engineering_department.1686.t:0 "王宫易主"
 tv_engineering_department.1686.d:0 "格拉纳达已经陷落，决定其命运的战争已经胜利。阿尔罕布拉宫的国库、卫戍军、书记厅、水务衙署与宗教基金，如今必须逐一从纳斯里德王朝移交给新的君主。"
 tv_engineering_department.1686.a:0 "接管这份遗产。"
 tv_engineering_department.1687.t:0 "国库账册"
 tv_engineering_department.1687.d:0 "纳斯里德王朝的国库衙署保管着埃米尔国的税册、贡赋记录与现钱储备。它的命运，将决定新秩序在人们记忆中的模样。"
 tv_engineering_department.1687.a:0 "让国库官员留任原职。"
 tv_engineering_department.1687.b:0 "改编该衙署以服务新政。"
 tv_engineering_department.1687.c:0 "没收储备并遣散官员。"
 tv_engineering_department.1688.t:0 "城堡卫戍军"
 tv_engineering_department.1688.d:0 "阿尔卡萨瓦城堡的卫戍军，昔日宫殿的守卫者，正等候消息：他们将被留用、改编，还是彻底解散。"
 tv_engineering_department.1688.a:0 "将卫戍军收编为己用。"
 tv_engineering_department.1688.b:0 "由新任军官改编该卫戍军。"
 tv_engineering_department.1688.c:0 "解散卫戍军并出售其军械。"
 tv_engineering_department.1689.t:0 "书记厅"
 tv_engineering_department.1689.d:0 "书记厅的译员与公证人曾亲手起草了投降条款本身。他们的笔，以及他们的忠诚，如今都悬而未决。"
 tv_engineering_department.1689.a:0 "让书记留任原职。"
 tv_engineering_department.1689.b:0 "将书记厅并入自己的行政体系。"
 tv_engineering_department.1689.c:0 "遣散书记并夺取其档案。"
 tv_engineering_department.1690.t:0 "灌渠衙署"
 tv_engineering_department.1690.d:0 "灌渠法庭管理着将内华达山脉的水源引入宫廷花园与山下城市的渠道。掌控它们，便掌控了格拉纳达的命脉。"
 tv_engineering_department.1690.a:0 "让水法庭继续由原有法官管理。"
 tv_engineering_department.1690.b:0 "由新任官员重新编排水权。"
 tv_engineering_department.1690.c:0 "榨取渠道收益并出售水权。"
 tv_engineering_department.1691.t:0 "宗教基金"
 tv_engineering_department.1691.d:0 "瓦克夫宗教基金资助着全城的清真寺、济贫院与慈善机构，也包括宫殿本身的清真寺。它们的处置，将受到信众与外邦宫廷的密切关注。"
 tv_engineering_department.1691.a:0 "让基金依创设者的本意继续运作。"
 tv_engineering_department.1691.b:0 "将基金转向新秩序的机构。"
 tv_engineering_department.1691.c:0 "清算基金并占有其收益。"
 tv_engineering_department.1692.t:0 "治理的清算"
 tv_engineering_department.1692.d:0 "五个衙署已经完成了从旧秩序到新秩序的移交。格拉纳达将把这段历史记作和睦、良治，还是掠夺，取决于保留、改编与没收之间的平衡。"
 tv_engineering_department.1692.a:0 "细读这份清算。"
 tv_engineering_department.1693.t:0 "阿尔罕布拉宫长存"
 tv_engineering_department.1693.d:0 "王宫的命运如今已经确定。"
 tv_engineering_department.1693.concord.d:0 "仁慈主导了这场移交。国库、卫戍军、书记厅、灌渠与宗教基金，尽可能地被完整保留，外邦宫廷都称阿尔罕布拉宫证明了征服未必要吞噬它所赢得的一切。"
 tv_engineering_department.1693.administration.d:0 "改革主导了这场移交。一个又一个衙署被纳入新秩序重组，阿尔罕布拉宫如今成为一座运作良好、却不带多少温情的治理宫殿。"
 tv_engineering_department.1693.extraction.d:0 "掠夺主导了这场移交。宫中各衙署被榨取一空，阿尔罕布拉宫如今更像是一座驻防要塞，而非治理中心，其财富已流入夺取它的王室。"
 tv_engineering_department.1693.a:0 "确认阿尔罕布拉宫的新秩序。"
