 tv_engineering_department.1000.t:0 "平台上的职守"
 tv_engineering_department.1000.d:0 "城门之内，还有证明盟约真实与否的日常劳作：钥匙与巡视名册需要看管，蓄水池需要挑水人照料，圆顶灯盏与其铭文需要添油续芯，赠地契据需要抄录官打理，受护送的朝圣路线也需要护卫随行。总督召集各项职守的负责官员，好让人们托付而非想当然地假定圣石得到了真正的看护，而非仅仅被占有。"
 tv_engineering_department.1000.a:0 "召集职守官员。"
 tv_engineering_department.1001.t:0 "托付圣所的劳作"
 tv_engineering_department.1001.d:0 "钥匙与巡视名册、蓄水池与挑水人、灯盏与铭文、赠地契据与抄录官，以及受护送的朝圣路线，每一项都需要有人看管，盟约才不至于沦为空谈。将这些职责逐一分派下去，便能把金顶许下的守护承诺，变成任何显贵或法学家都能查验的账册。总督今日托付出去的，圣石都会铭记。"
 tv_engineering_department.1001.a:0 "分派职守。"
 tv_engineering_department.1002.t:0 "被疏忽的职守"
 tv_engineering_department.1002.d:0 "一座蓄水池在挑水人领到工钱前便已干涸，或是一名赠地抄录官被发现篡改了资助灯油的契据——瞬间，尽心的看护看起来竟像披着虔诚外衣的掠夺。若置之不理，这一失职将令朝圣者与本地显贵对其余每一项职守都心生怀疑。总督可以选择公开修补这一过失，或是悄悄将其转交给更严厉的人手。"
 tv_engineering_department.1002.a:0 "公开修补过失。"
 tv_engineering_department.1002.b:0 "将职守转交更严厉的人手。"
 tv_engineering_department.1003.t:0 "职守被托付完成"
 tv_engineering_department.1003.d:0 "钥匙与巡视名册、蓄水池与挑水人、灯盏与铭文、赠地契据与抄录官，以及受护送的朝圣路线，一一在聚集的众守护者面前被宣布托付完成。圣石圆顶不再只是矗立于耶路撒冷之上，它被人以姓名与誓言看管、供水、点亮、供养与护卫。这正是此地主权即服务、而非攫取的日常明证。"
 tv_engineering_department.1003.a:0 "托付职守。"
 tv_engineering_department.1658.t:0 "金色门槛前的守卫者"
 tv_engineering_department.1658.d:0 "总督在金顶之下召集了平台门卫、国教法学家、来访的朝圣团、耶路撒冷本地显贵，以及受监督的跨信仰见证人。目前尚无惯例或驻防命令规定谁可以通过城门，每一方都期待自己的规矩能够胜出。这份决定谁可进入圣石的盟约，必须先被宣读，才能被遵行。"
 tv_engineering_department.1658.a:0 "召集守护议事会。"
 tv_engineering_department.1659.t:0 "权衡门禁盟约"
 tv_engineering_department.1659.d:0 "在纪律严明的守卫门槛、法学家的公开宣告与见证下的朝圣宽容之间，门卫与显贵们等待着盟约的最终形态被宣布。三条路径各自以不同方式守护圣所：守卫在圣石周围收紧防线，法学家写下全城都能读懂的规则，见证人则确认门禁既非掠夺也非随心所欲。这一决定一旦说出，便成为平台的法律，直到它受到挑战。"
 tv_engineering_department.1659.a:0 "宣布门禁盟约。"
 tv_engineering_department.1660.t:0 "盟约受到考验"
 tv_engineering_department.1660.d:0 "朝圣商队对门卫设下的门槛人数心生抵触，耶路撒冷的本地显贵们低声抱怨，说受监督的见证人目睹了士兵为取乐而将信众拒之门外。无论这是守卫越权、一次遭到抵制的排斥，还是见证人如实的怀疑，这份圣所盟约如今都被指控正把主权收窄为占领。总督必须以公开的和解，或是更严厉、更低调的宣告作出回应。"
 tv_engineering_department.1660.a:0 "重开城门，寻求和解。"
 tv_engineering_department.1660.b:0 "以更严苛的宣告坚守防线。"
 tv_engineering_department.1661.t:0 "门禁盟约被封印"
 tv_engineering_department.1661.d:0 "门卫、法学家、朝圣商队、本地显贵与受监督的见证人齐聚一堂，聆听盟约在平台上最后一次被宣读。曾经五方各执一词、争夺门槛的局面，如今化作一部众人公认的门禁律法，连原本心存怀疑者也已见证。圣顶的主权，不是靠守卫之强得到证明，而是靠如今安然持有钥匙者的长久稳固得到证明。"
 tv_engineering_department.1661.a:0 "封印门禁盟约。"
