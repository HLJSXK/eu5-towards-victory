 tv_engineering_department.1662.t:0 "金色门槛前的门卫"
 tv_engineering_department.1662.d:0 "专员召集圣殿平台门卫、国教法学家、来访朝圣团、耶路撒冷本地贤达，以及一组受监督的跨教派见证人，随后才能当众宣读门禁盟约。"
 tv_engineering_department.1662.a:0 "开始宣读盟约。"
 tv_engineering_department.1663.t:0 "衡量门禁契约"
 tv_engineering_department.1663.d:0 "各方依次受到评估：门卫看纪律，法学家看宣示，朝圣者看耐心，贤达看声望，见证人看公正。有些欣然接受契约，有些则表明保留意见。"
 tv_engineering_department.1663.a:0 "记录各方的反应。"
 tv_engineering_department.1664.t:0 "契约受到考验"
 tv_engineering_department.1664.d:0 "门前守卫的越权行为、朝圣团对偏袒的怀疑，或见证团对公正性的疑虑，都可能在盟约封印之前使其瓦解。"
 tv_engineering_department.1664.a:0 "重开谈判，寻求和解。"
 tv_engineering_department.1664.b:0 "接受更保守、更安全的宣告。"
 tv_engineering_department.1665.t:0 "门禁盟约封印"
 tv_engineering_department.1665.d:0 "监护盟约在圣殿平台上封印：门卫、法学家、朝圣者、贤达与见证人各自在受认可的圣所秩序下就位。"
 tv_engineering_department.1665.a:0 "封印盟约。"
 tv_engineering_department.1666.t:0 "圣殿平台的职守"
 tv_engineering_department.1666.d:0 "在圣所可以托付给监护人之前，门钥与值守名册、蓄水池与运水人、穹顶灯盏与铭文、瓦克夫契据与书吏，以及受护朝圣路线，都必须托付给专职的看守人。"
 tv_engineering_department.1666.a:0 "开始托付职守。"
 tv_engineering_department.1667.t:0 "托付圣所的劳作"
 tv_engineering_department.1667.d:0 "每项职守都分派了看守人。有些立即证明可靠，另一些则在其职责被确认前招致玩忽职守、贪腐或延误的指控。"
 tv_engineering_department.1667.a:0 "记录每项职守的履行情况。"
 tv_engineering_department.1668.t:0 "一项被忽视的职守"
 tv_engineering_department.1668.d:0 "一处荒废的蓄水池、一盏未点燃的灯，或一名书吏经手不当的契据，若不加以纠正，都会让监护看起来像掠夺而非守护。"
 tv_engineering_department.1668.a:0 "惩处看守人并重新托付职守。"
 tv_engineering_department.1668.b:0 "转而悄悄缩减该职守的范围。"
 tv_engineering_department.1669.t:0 "职守托付完成"
 tv_engineering_department.1669.d:0 "门钥、蓄水池、灯盏、瓦克夫契据与朝圣路线，如今都已托付给纪律有据可查的看守人。"
 tv_engineering_department.1669.a:0 "确认职守安排。"
