 tv_engineering_department.1662.t:0 "金色门槛前的门卫"
 tv_engineering_department.1662.d:0 "专员召集圣殿平台门卫、国教法学家、来访朝圣团、耶路撒冷本地贤达，以及一组受监督的跨教派见证人。在门禁盟约当众宣读之前，必须先选定三份契约之一来治理它。"
 tv_engineering_department.1662.a:0 "开始宣读盟约。"
 tv_engineering_department.1663.t:0 "选择门禁契约"
 tv_engineering_department.1663.d:0 "卫队纪律偏重严格秩序，但可能疏远朝圣者与本地贤达。法学家宣示偏重公开的法理清晰，但可能触怒门卫与跨教派见证人。见证下的宽容偏重广泛认可，但可能触怒法学家与门卫。"
 tv_engineering_department.1663.a:0 "卫队纪律：门前的严格秩序。"
 tv_engineering_department.1663.b:0 "法学家宣示：公开的法理清晰。"
 tv_engineering_department.1663.c:0 "见证下的宽容：广泛的、有见证的门禁。"
 tv_engineering_department.1664.t:0 "契约受到考验"
 tv_engineering_department.1664.d:0 "未被所选契约安抚的各方与职守如今提出异议。盟约仍可完全封印，但需付出声望代价；亦可接受更保守、更安全的宣告。"
 tv_engineering_department.1664.a:0 "增派法学家监督，完全封印盟约。（声望 -3）"
 tv_engineering_department.1664.b:0 "接受更保守、更安全的宣告。"
 tv_engineering_department.1665.t:0 "门禁盟约封印"
 tv_engineering_department.1665.d:0 "监护盟约在圣殿平台上封印：门卫、法学家、朝圣者、贤达与见证人各自在受认可的圣所秩序下就位，受托的职守也已交付专职看守人。"
 tv_engineering_department.1665.a:0 "封印盟约。"
