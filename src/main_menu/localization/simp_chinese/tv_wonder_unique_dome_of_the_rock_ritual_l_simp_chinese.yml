 tv_engineering_department.1662.t:0 "共享监护的历法"
 tv_engineering_department.1662.d:0 "专员提议这座圣所在本朝从未有过的安排：一份固定的共享监护历法。此举并非一次性地敲定门禁，而是让努赛贝守门世家、瓦克夫捐产议事会与卫戍平台警戒队依次执掌钥匙，历经六个任期、跨越数年，赞助者自身在公正与维护上的记录才是这份盟约真正的度量。"
 tv_engineering_department.1662.a:0 "开启共享监护历法。"
 tv_engineering_department.1663.t:0 "任期已至"
 tv_engineering_department.1663.d:0 "监护历法的一个任期已经到期。钥匙、值守名册与在朝圣者面前的地位，必须移交给赞助者为本任期指定的一方——轮换监护能保持公正统治的形象，而让同一方连任则能积累圣所可以倚仗的行政经验。"
 tv_engineering_department.1663.strained.d:0 "迄今为止的记录并不乐观：公正、延续性或基金会自身的维护——历法三项度量中至少有一项已经出现问题，本任期的选择本身并不能就此扭转局面。"
 tv_engineering_department.1663.a:0 "本任期交由努赛贝守门世家执掌。"
 tv_engineering_department.1663.b:0 "本任期交由瓦克夫捐产议事会执掌。"
 tv_engineering_department.1663.c:0 "本任期交由卫戍平台警戒队执掌。"
 tv_engineering_department.1664.t:0 "任期维护经费"
 tv_engineering_department.1664.d:0 "平台上的灯盏、蓄水池与门扉木构需要持续维护，本任期的监护人已呈上账目。赞助者可投入个人声望以全额资助基金会，也可让本任期的维护搁置，任由圣所构造多耗损一分。"
 tv_engineering_department.1664.critical.d:0 "基金会的构造如今已明显破败——灯盏不亮，蓄水池污浊，门扉木构朽坏。再搁置一个任期恐将令平台本身遭受实质损害。"
 tv_engineering_department.1664.a:0 "投入声望，全额资助基金会。（声望 -2）"
 tv_engineering_department.1664.b:0 "让本任期的维护搁置。"
 tv_engineering_department.1665.t:0 "历法圆满"
 tv_engineering_department.1665.d:0 "六个任期已经过去，监护历法圆满完成。记录已经写定：监护轮换是否公正、同一方连任是否带来了稳定、平台构造是否维护得当——正是这份记录，而非某一日的宣告，才是历史将会承认的圆顶真正监护。"
 tv_engineering_department.1665.a:0 "封印圆满的历法。"
