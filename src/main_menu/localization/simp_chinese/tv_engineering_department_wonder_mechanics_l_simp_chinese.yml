 tv_engineering_department.500.d_unique_british_navy_dockyards:0 "船坞、绳场、补给场、军械库与军官在战云抵达地平线前整备舰队。 大工程师看向朴次茅斯与皇家船坞：海军战备在那里成为常设制度。 如今，无敌舰队战备整编为这座奇观完成了固定历史地点上的落成。战备整编提升造船速度与海军士气。"
