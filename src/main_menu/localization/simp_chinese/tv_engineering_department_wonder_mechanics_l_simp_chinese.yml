 tv_engineering_department.500.d_unique_pharos_lighthouse:0 "白石高塔矗立于亚历山大港口，将王权的野心化作水手可以信赖的灯火。 大工程师谈起法罗斯岛上的灯塔：亚历山大曾把安全航行变成一种公开的权力宣言。 如今，港口点灯典礼为这座奇观完成了固定历史地点上的落成。灯火延伸海军航程与贸易范围。"
 game_concept_tv_wonder_unique_hagia_sophia:0 "圣索菲亚大教堂"
 game_concept_tv_wonder_unique_hagia_sophia_desc:0 "重建的穹顶收拢黄金、大理石、香烟与帝国记忆，仿佛悬浮于尘世之上。 这是一项必须在固定历史地点建造的独特[tv_wonder_construction|e]工程，沿用其通用原型的地点规则，并以查士丁尼重建落成祈祷作为历史定制落成仪式。"
 TV_ENGINEERING_PROPOSAL_UNIQUE_HAGIA_SOPHIA_TEXT:0 "大工程师以君士坦丁堡查士丁尼重建的圣堂为例：那座穹顶要证明帝国仍能号令天国与石材。 简报：[tv_wonder_unique_hagia_sophia|E]是一项固定于其历史地点的独特历史[tv_wonder_medium|E]工程。"
