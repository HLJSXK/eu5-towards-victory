 tv_engineering_department.500.d_naval_school_3:0 "学院召集船长、领航员与造船师，围在一张不再止步于海岸的地图前。[tv_wonder_ceremony|E]把远洋指挥变成一种受训职业。"
 tv_engineering_department.600.d_naval_school:0 "消息称，[SCOPE.sCountry('tv_wonder_builder_country').GetName]已在[SCOPE.sLocation('tv_wonder_completed_site').GetName]创立一座[tv_wonder_naval_school|E]。海图、领航员、码头与指挥大厅如今使海洋不再只是谜题，而是一套课程。"
 game_concept_tv_wonder_unique_belem_tower_desc:0 "石灰岩塔楼矗立于塔霍河口，守望从里斯本驶向旧地图之外海洋的船只。此独特[tv_wonder_construction|e]必须在固定历史地点建造，沿用城市巨塔原型，并以塔霍守望仪式落成。"
