 game_concept_tv_wonder_display_image_1:0 "圣山"
 game_concept_tv_wonder_display_image_1_desc:0 "由阶梯、露台、圣祠与肃穆殿堂层层攀升的山岳圣所，仿佛把土地托近天穹。朝圣者在香烟与石阶之间上行，王廷的权威也随之披上神圣外衣，使信仰不再像命令，而像一整片地景。"
 game_concept_tv_wonder_display_image_2:0 "凯旋轴线"
 game_concept_tv_wonder_display_image_2_desc:0 "由笔直大道、宏阔广场、胜利门、阅兵场与宫殿立面串联而成的仪式都市。使节、军队与市民在有序的石材之间穿行，连移动本身都化作剧场，并反复指向谁才居于中心。"
 game_concept_tv_wonder_display_image_3:0 "巨港"
 game_concept_tv_wonder_display_image_3_desc:0 "由防波堤、码头、仓廒、船坞与市集大厅组成的巨型海港，让海洋按王国的规矩进入陆地。桅杆在塔楼下聚集，财富随潮水而来，远方宫廷也会先从这片水岸记住城市之名。"
 game_concept_tv_wonder_display_image_4:0 "国家陵墓"
 game_concept_tv_wonder_display_image_4_desc:0 "由陵墓台地、祭祀道路、享堂与卫护园林组成的宏大王家墓葬景观。它在丘陵与聚落附近最能发挥价值，将王朝记忆转化为石材、仪式与公共秩序。"
 game_concept_tv_wonder_display_image_5:0 "大灯塔"
 game_concept_tv_wonder_display_image_5_desc:0 "矗立于港湾入口的巨型航标，以一束火光联结贸易航线与海军航程。港口容量越高，选址越优；不同仪式则决定灯塔更偏向舰队、商人还是海上守望。"
 game_concept_tv_wonder_display_image_6:0 "水利工坊复合体"
 game_concept_tv_wonder_display_image_6_desc:0 "由水渠、水轮、蓄水池、工坊与闸门组成的工程片区。当地既有建筑越完善，它越能把水利控制转化为生产能力、建造效率与市民权威。"
 game_concept_tv_wonder_display_image_7:0 "矿业都市"
 game_concept_tv_wonder_display_image_7_desc:0 "由矿井、矿场、排水工程、市场与铸币设施组成的计划型采掘城市。高发展度与乡村矿区最适合它，而仪式会决定矿井、王权与平民矿工如何分配地下财富。"
 game_concept_tv_wonder_display_image_8:0 "天文观象台"
 game_concept_tv_wonder_display_image_8_desc:0 "由观测塔、测星廊、星表厅与仪器庭院组成的巨型观象台。丘陵、高原、山地与识字人口较多的地点最适合它，而仪式会把观天活动导向学术、航海或天象预兆。"
 game_concept_tv_wonder_display_image_9:0 "万国宫城"
 game_concept_tv_wonder_display_image_9_desc:0 "建于首都的外交宫城，将等级秩序、觐见仪式与外国存在转化为永久建筑。发展度高的大都会最适合它，而仪式会决定宫城偏向万国会议、贡礼展示或常设使馆区。"
 game_concept_tv_wonder_display_image_10:0 "大学城"
 game_concept_tv_wonder_display_image_10_desc:0 "由讲堂、学院、图书馆和学生区组成的学术城市。城市地点和高识字人口最适合它，其仪式可强化研究、公共识字或学院制度下的人口晋升。"
 game_concept_tv_wonder_display_image_11:0 "天穹大圣殿"
 game_concept_tv_wonder_display_image_11_desc:0 "一座聚集在巨大仪式穹顶下的纪念性圣殿。正信人口和宗教基础设施最适合它，其仪式可强调祝圣、朝圣收入或教士化行政。"
 game_concept_tv_wonder_display_image_12:0 "巨塔式神庙"
 game_concept_tv_wonder_display_image_12_desc:0 "一座由阶梯、灯火室、圣所和学校组成的高塔神庙。其仪式可将高度转化为威望、朝圣纪律或有组织的皈依。"
 game_concept_tv_wonder_display_image_13:0 "河道拓宽工程"
 game_concept_tv_wonder_display_image_13_desc:0 "由拓宽河道、桥梁、堤岸、集市和办公室构成的水利奇观。它需要河流地点，并能将移动、贸易与运河行政转化为永久国家能力。"
 game_concept_tv_wonder_display_image_14:0 "国家船坞"
 game_concept_tv_wonder_display_image_14_desc:0 "一座沿海造船复合体，由船台、吊机、仓库和海军办公室组成。港口容量和发展度最适合它，其仪式可强调造船速度、舰队士气或海军范围。"
 game_concept_tv_wonder_display_image_15:0 "星型要塞城"
 game_concept_tv_wonder_display_image_15_desc:0 "一座由棱堡、操场、弹药库和军械区组成的规划要塞城市。城市防御地点最适合它，其仪式可强化驻军、攻城能力或要塞容量。"
 game_concept_tv_wonder_display_image_16:0 "长城"
 game_concept_tv_wonder_display_image_16_desc:0 "一条由城楼、关门、烽火台和集结场组成的边疆长墙。非城市防御地点最适合它，其仪式可强调人力、移动或士气。"
 game_concept_tv_wonder_display_image_17:0 "巨型军械库"
 game_concept_tv_wonder_display_image_17_desc:0 "一座用于武器、铸造厂和大师甲匠的大型军事仓储与生产城区。高发展城镇和城市最适合它，其仪式会塑造士气、生产或训练度。"
 game_concept_tv_wonder_display_image_18:0 "国家图书馆"
 game_concept_tv_wonder_display_image_18_desc:0 "一座首都图书馆，由目录、抄写屋、阅览室和法定缴存办公室组成。其仪式可通过被保存的知识加速研究、识字或社会晋升。"
 game_concept_tv_wonder_display_image_19:0 "大水渠"
 game_concept_tv_wonder_display_image_19_desc:0 "大水渠是一项聚焦农业、运输、防灾的[tv_wonder_construction|e]项目。它偏好河流或湖泊沿岸。仪式可转向灌溉优先、漕运优先、防洪优先。"
 game_concept_tv_wonder_display_image_20:0 "山地梯田网络"
 game_concept_tv_wonder_display_image_20_desc:0 "山地梯田网络是一项聚焦高地开发、人口承载的[tv_wonder_construction|e]项目。它偏好山地、高原或丘陵。仪式可转向粮食梯田、经济作物梯田、圣山梯田。"
 game_concept_tv_wonder_display_image_21:0 "巨堤"
 game_concept_tv_wonder_display_image_21_desc:0 "巨堤是一项聚焦防洪、控河、权力象征的[tv_wonder_construction|e]项目。它偏好河流、湖泊沿岸或港口。仪式可转向河口防洪、沼泽开垦、水力驱动工坊。"
 game_concept_tv_wonder_display_image_22:0 "皇家粮仓"
 game_concept_tv_wonder_display_image_22_desc:0 "皇家粮仓是一项聚焦抗饥荒、国家调控的[tv_wonder_construction|e]项目。它偏好任意非荒芜的己方地点。仪式可转向平抑粮价、战时储备、赈灾。"
 game_concept_tv_wonder_display_image_23:0 "帝国驿道网络"
 game_concept_tv_wonder_display_image_23_desc:0 "帝国驿道网络是一项聚焦行政、通信、军队调动的[tv_wonder_construction|e]项目。它偏好任意己方地点。仪式可转向军事驿道、商贸驿道、皇家巡游大道。"
 game_concept_tv_wonder_display_image_24:0 "运河枢纽城"
 game_concept_tv_wonder_display_image_24_desc:0 "运河枢纽城是一项聚焦区域贸易与物流的[tv_wonder_construction|e]项目。它偏好河流、湖泊沿岸或港口，且不能为乡村。仪式可转向漕运中心、金融货栈、工业工坊带。"
 game_concept_tv_wonder_display_image_25:0 "边疆垦殖带"
 game_concept_tv_wonder_display_image_25_desc:0 "边疆垦殖带是一项聚焦殖民、边疆稳定的[tv_wonder_construction|e]项目。它偏好乡村或边疆开发地点。仪式可转向军屯殖民、移民垦荒、宗教拓殖。"
 game_concept_tv_wonder_display_image_26:0 "海岸烽火网络"
 game_concept_tv_wonder_display_image_26_desc:0 "海岸烽火网络是一项聚焦海盗预警、海防的[tv_wonder_construction|e]项目。它偏好港口或海岸地点。仪式可转向烽火通讯、炮台防御、海关巡查。"
 game_concept_tv_wonder_display_image_27:0 "骑士要塞团"
 game_concept_tv_wonder_display_image_27_desc:0 "骑士要塞团是一项聚焦军事贵族与边疆秩序的[tv_wonder_construction|e]项目。它偏好非乡村地点，或拥有要塞的地点。仪式可转向圣战骑士团、边疆领主团、雇佣军要塞。"
 game_concept_tv_wonder_display_image_28:0 "战争学院"
 game_concept_tv_wonder_display_image_28_desc:0 "战争学院是一项聚焦军事理论与军官培养的[tv_wonder_construction|e]项目。它偏好城市、大都会或拥有军械库的地点。仪式可转向火器战术、骑兵传统、海军指挥。"
 game_concept_tv_wonder_display_image_29:0 "巨钟报时塔"
 game_concept_tv_wonder_display_image_29_desc:0 "巨钟报时塔是一项聚焦宗教秩序、城市时间的[tv_wonder_construction|e]项目。它偏好非乡村地点。仪式可转向礼拜报时、城市宵禁、天文历法。"
 game_concept_tv_wonder_display_image_30:0 "皇家艺术园区"
 game_concept_tv_wonder_display_image_30_desc:0 "皇家艺术园区是一项聚焦文化繁荣的[tv_wonder_construction|e]项目。它偏好城市、大都会或首都。仪式可转向宫廷艺术、民间艺术、外来风格融合。"
 game_concept_tv_wonder_display_image_31:0 "大剧场与庆典区"
 game_concept_tv_wonder_display_image_31_desc:0 "大剧场与庆典区是一项聚焦公共文化的[tv_wonder_construction|e]项目。它偏好非乡村地点。仪式可转向宫廷戏剧、宗教戏剧、群众节庆。"
 game_concept_tv_wonder_display_image_32:0 "万国使馆区"
 game_concept_tv_wonder_display_image_32_desc:0 "万国使馆区是一项聚焦外交影响力的[tv_wonder_construction|e]项目。它偏好首都或非乡村地点。仪式可转向商贸外交、情报外交、宗教外交。"
 game_concept_tv_wonder_display_image_33:0 "法典石碑工程"
 game_concept_tv_wonder_display_image_33_desc:0 "法典石碑工程是一项聚焦法统与治理的[tv_wonder_construction|e]项目。它偏好任意己方地点。仪式可转向宗教法、成文法、皇权敕令。"
 game_concept_tv_wonder_display_image_34:0 "万国大市场"
 game_concept_tv_wonder_display_image_34_desc:0 "万国大市场是一项聚焦区域贸易中心的[tv_wonder_construction|e]项目。它偏好城市、大都会或港口。仪式可转向奢侈品贸易、粮食贸易、国际转口。"
 game_concept_tv_wonder_display_image_35:0 "皇家铸币厂"
 game_concept_tv_wonder_display_image_35_desc:0 "皇家铸币厂是一项聚焦金融与税收的[tv_wonder_construction|e]项目。它偏好城市、大都会，或金、银、铜产地。仪式可转向金银本位、铜币流通、国际结算。"
 game_concept_tv_wonder_display_image_36:0 "商业行会大厅"
 game_concept_tv_wonder_display_image_36_desc:0 "商业行会大厅是一项聚焦城市商业组织的[tv_wonder_construction|e]项目。它偏好非乡村地点。仪式可转向手工业联盟、远洋商帮、金融同业。"
 game_concept_tv_wonder_display_image_37:0 "海上贸易站网络"
 game_concept_tv_wonder_display_image_37_desc:0 "海上贸易站网络是一项聚焦全球贸易扩张的[tv_wonder_construction|e]项目。它偏好港口。仪式可转向香料贸易、奴隶贸易、殖民补给。"
 game_concept_tv_wonder_display_image_38:0 "巨型工坊"
 game_concept_tv_wonder_display_image_38_desc:0 "巨型工坊是一项聚焦手工业集中化的[tv_wonder_construction|e]项目。它偏好非乡村地点。仪式可转向纺织制造、军工制造、奢侈品工艺。"
 game_concept_tv_wonder_display_image_39:0 "纪念碑群"
 game_concept_tv_wonder_display_image_39_desc:0 "纪念碑群是一项聚焦文明象征与历史记忆的[tv_wonder_construction|e]项目。它偏好首都、城市或大都会。仪式可转向征服纪念、民族统一、世界博览。"
 game_concept_tv_wonder_display_image_40:0 "城市扩建工程"
 game_concept_tv_wonder_display_image_40_desc:0 "城市扩建工程是一项聚焦城市空间与地块扩容的[tv_wonder_construction|e]项目。它偏好城市或大都会。仪式可转向城市宪章、市政方格网、城区更新。"
 game_concept_tv_wonder_display_image_41:0 "巨石环"
 game_concept_tv_wonder_display_image_41_desc:0 "由立石、至日准线、祖灵记忆与祭火组成的史前石环。此类[tv_wonder_construction|e]偏好乡村或古老圣地，可成为历法圣所、星象准线或祖灵会场。"
 game_concept_tv_wonder_display_image_42:0 "大教堂"
 game_concept_tv_wonder_display_image_42_desc:0 "由高塔、唱诗席、钟楼、圣物与朝圣门槛组成的纪念性主教座堂。此类[tv_wonder_construction|e]偏好城市宗教中心，可服务教士权威、朝圣收入或城市礼仪。"
 game_concept_tv_wonder_display_image_43:0 "大型修道院"
 game_concept_tv_wonder_display_image_43_desc:0 "由回廊、缮写室、斋堂、围墙和朝圣道路组成的大型修道院。此类[tv_wonder_construction|e]偏好修道院、圣山与隐修圣地，将学术、虔敬与避难结合起来。"
 game_concept_tv_wonder_display_image_44:0 "城市巨塔"
 game_concept_tv_wonder_display_image_44_desc:0 "由钟室、瞭望台、市政厅室与商人廊台组成的高耸城市塔楼。此类[tv_wonder_construction|e]偏好城市，可将城市高度转化为威望、安全与更低建筑花费。"
 game_concept_tv_wonder_display_image_45:0 "大雕塑群"
 game_concept_tv_wonder_display_image_45_desc:0 "由石窟、雕像园、英雄长廊与王家工坊组成的纪念性雕塑群。此类[tv_wonder_construction|e]偏好城市文化中心，可将艺术转化为威望、传统与熟练生产。"
 game_concept_tv_wonder_display_image_46:0 "海防大炮"
 game_concept_tv_wonder_display_image_46_desc:0 "由重炮、港链、弹药库、海墙与海军署铸炮厂组成的设防海岸火炮体系。此类[tv_wonder_construction|e]需要港口，并将海上咽喉转化为防御力量。"
 game_concept_tv_wonder_display_image_47:0 "海军学校"
