 tv_engineering_department.500.d_unique_santa_maria_del_fiore:0 "布鲁内莱斯基的大穹顶把大理石、行会骄傲与城市信仰覆于佛罗伦萨之上。大工程师研究佛罗伦萨主教座堂穹顶：一个被如此公开地解决的问题，答案本身成了市民荣耀。如今佛罗伦萨穹顶祝圣完成了这座固定历史地点上的奇观。祝圣提升威望与文化传统。"
