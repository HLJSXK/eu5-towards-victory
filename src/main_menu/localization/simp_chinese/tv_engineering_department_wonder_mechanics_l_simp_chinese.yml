 tv_engineering_department.500.d_unique_tenochtitlan_causeways:0 "堤道、运河、水渠与岛上城区把湖中城市连接到市场、神庙与战争。 大工程师研究特诺奇蒂特兰：这座湖中都城以堤道把水变成城市权力的工具。 如今，大神庙献祭扩建典礼为这座奇观完成了固定历史地点上的落成。扩建典礼提升行军速度与繁荣。"
