 tv_engineering_department.500.d_unique_leaning_tower_of_pisa:0 "白色大理石钟塔倾斜于比萨主教座堂广场之上，让不完美本身成名。大工程师承认，比萨塔之所以著名，是因为它违背预期，并且在违背中幸存。如今斜塔稳固仪式完成了这座固定历史地点上的奇观。高塔将建筑名声转化为威望与研究速度。"
 game_concept_tv_wonder_unique_milan_cathedral_desc:0 "大理石尖塔森林升起于米兰之上，把城市变成一条虔敬的天际线。此独特[tv_wonder_construction|e]必须在固定历史地点建造，沿用大教堂原型，并以大理石尖塔祝圣落成。"
