 tv_engineering_department.500.d_unique_spanish_silver_fleet:0 "护航舰队、账册、设防港口与王家仓库让大西洋白银在封印与护卫下流动。 大工程师提出塞维利亚白银舰队体系：帝国在那里化为定期抵港的金属与文书。 如今，白银归港为这座奇观完成了固定历史地点上的落成。归港仪式提升贸易收入与铸币收入。"
