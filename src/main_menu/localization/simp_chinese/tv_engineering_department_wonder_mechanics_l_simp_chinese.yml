 TV_ENGINEERING_PROPOSAL_UNIQUE_LEANING_TOWER_OF_PISA_TEXT:0 "大工程师承认，比萨塔之所以著名，是因为它违背预期，并且在违背中幸存。简报：[tv_wonder_unique_leaning_tower_of_pisa|E]是一项固定于其历史地点的独特历史[tv_wonder_small|E]工程。"
