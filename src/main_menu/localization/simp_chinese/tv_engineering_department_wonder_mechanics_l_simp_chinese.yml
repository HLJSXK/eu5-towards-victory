 tv_engineering_department.500.d_unique_alhambra:0 "蜂巢穹顶、水庭与红墙保存着一个走到投降边缘的宫廷世界。 大工程师忆及格拉纳达的宫殿：纳斯尔王朝最后的转折处，外交与美感在此相遇。 如今，格拉纳达投降条约签署为这座奇观完成了固定历史地点上的落成。条约签署提升威望与外交声誉。"
