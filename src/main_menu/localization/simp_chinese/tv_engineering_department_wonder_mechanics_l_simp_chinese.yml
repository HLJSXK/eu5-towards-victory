 game_concept_tv_wonder_display_image_145_desc:0 "城墙、金顶、回廊、缮写院与朝圣道路让三一修道院成为精神堡垒。此独特[tv_wonder_construction|e]必须在固定历史区域建造，沿用大型修道院原型，并以修道军圣化仪式落成。"
 game_concept_tv_wonder_display_image_146:0 "冬宫"
 game_concept_tv_wonder_display_image_146_desc:0 "河岸立面、礼仪大厅、守卫长廊与宫廷仪式让涅瓦首都成为帝国舞台。此独特[tv_wonder_construction|e]必须在固定历史地点建造，沿用凯旋轴线原型，并以帝国画廊开幕仪式落成。"
 game_concept_tv_wonder_display_image_147:0 "景福宫"
 game_concept_tv_wonder_display_image_147_desc:0 "宫门、勤政殿、山脉轴线与礼仪庭院让朝鲜王权在汉阳显形。此独特[tv_wonder_construction|e]必须在固定历史地点建造，沿用凯旋轴线原型，并以王家朝会更新仪式落成。"
 game_concept_tv_wonder_display_image_148:0 "长白山祭坛"
 game_concept_tv_wonder_display_image_148_desc:0 "火山峰、天池、森林、祭坛台地与旗帜让长白山成为神圣王朝源头。此独特[tv_wonder_construction|e]必须在固定历史区域建造，沿用圣山原型，并以圣山册封仪式落成。"
 game_concept_tv_wonder_display_image_149:0 "贝尔格莱德要塞"
 game_concept_tv_wonder_display_image_149_desc:0 "城墙、棱堡、高塔与河门控制多瑙河和萨瓦河交汇处。此独特[tv_wonder_construction|e]必须在固定历史地点建造，沿用星形要塞城市原型，并以多瑙河守望集结仪式落成。"
 game_concept_tv_wonder_display_image_150:0 "梅黛奥拉修道院"
 game_concept_tv_wonder_display_image_150_desc:0 "岩柱、悬空礼拜堂、绳索吊篮、圣像与窄梯让梅黛奥拉成为远离尘世的修道院群。此独特[tv_wonder_construction|e]必须在固定历史地点建造，沿用大型修道院原型，并以悬空礼拜仪式落成。"
 game_concept_tv_wonder_display_image_151:0 "贝伦塔"
 game_concept_tv_wonder_display_image_151_desc:0 "石灰岩塔楼矗立于塔霍河口，守望从里斯本驶向旧地图之外海洋的船只。此独特[tv_wonder_construction|e]必须在固定历史地点建造，沿用城市巨塔原型，并以塔霍守望仪式落成。"
 game_concept_tv_wonder_display_image_152:0 "伊比利亚宗教裁判所"
 game_concept_tv_wonder_display_image_152_desc:0 "审判厅、档案室、回廊与受守卫的讲坛把宗教纪律转化为制度。此独特[tv_wonder_construction|e]必须在固定历史地点建造，沿用大型修道院原型，并以裁判登记仪式落成。"
 game_concept_tv_wonder_display_image_153:0 "圣母百花大教堂"
 game_concept_tv_wonder_display_image_153_desc:0 "布鲁内莱斯基的大穹顶把大理石、行会骄傲与城市信仰覆于佛罗伦萨之上。此独特[tv_wonder_construction|e]必须在固定历史地点建造，沿用大教堂原型，并以佛罗伦萨穹顶祝圣落成。"
 game_concept_tv_wonder_display_image_154:0 "比萨斜塔"
 game_concept_tv_wonder_display_image_154_desc:0 "白色大理石钟塔倾斜于比萨主教座堂广场之上，让不完美本身成名。此独特[tv_wonder_construction|e]必须在固定历史地点建造，沿用城市巨塔原型，并以斜塔稳固仪式落成。"
 game_concept_tv_wonder_display_image_155:0 "米兰大教堂"
 game_concept_tv_wonder_display_image_155_desc:0 "大理石尖塔森林升起于米兰之上，把城市变成一条虔敬的天际线。此独特[tv_wonder_construction|e]必须在固定历史地点建造，沿用大教堂原型，并以大理石尖塔祝圣落成。"
 game_concept_tv_wonder_display_image_156:0 "梵蒂冈档案馆"
 game_concept_tv_wonder_display_image_156_desc:0 "手稿库、教宗登记册与封存房间让记忆成为外交工具。此独特[tv_wonder_construction|e]必须在固定历史地点建造，沿用国家图书馆原型，并以宗座档案封印落成。"
 game_concept_tv_wonder_display_image_157:0 "天坛"
 game_concept_tv_wonder_display_image_157_desc:0 "圆坛与蓝瓦殿宇把帝国统治同有序天穹绑定在一起。此独特[tv_wonder_construction|e]必须在固定历史地点建造，沿用天穹大圣殿原型，并以圜丘大祀落成。"
 game_concept_tv_wonder_display_image_158:0 "都江堰"
 game_concept_tv_wonder_display_image_158_desc:0 "堰堤、渠道与鱼嘴分水在不扼杀岷江的情况下分驯其流。此独特[tv_wonder_construction|e]必须在固定历史地点建造，沿用巨堤原型，并以鱼嘴分水仪式落成。"
 game_concept_tv_wonder_display_image_159:0 "大报恩寺琉璃塔"
 game_concept_tv_wonder_display_image_159_desc:0 "琉璃砖瓦与寺灯让南京高塔像一座垂直舍利匣般发光。此独特[tv_wonder_construction|e]必须在固定历史地点建造，沿用巨塔式神庙原型，并以琉璃灯仪式落成。"
 game_concept_tv_wonder_display_image_160:0 "景德镇官窑"
 game_concept_tv_wonder_display_image_160_desc:0 "窑炉、瓷土场、画工与督造官把瓷器转化为帝国工业。此独特[tv_wonder_construction|e]必须在固定历史地点建造，沿用巨型工坊原型，并以官窑封印落成。"
 game_concept_tv_wonder_display_image_161:0 "莫高窟"
 game_concept_tv_wonder_display_image_161_desc:0 "彩绘洞窟、巨佛、经卷与沙漠香客让敦煌成为记忆走廊。此独特[tv_wonder_construction|e]必须在固定历史地点建造，沿用大雕塑群原型，并以千佛开窟仪式落成。"
 game_concept_tv_wonder_display_image_162:0 "广州十三行"
 game_concept_tv_wonder_display_image_162_desc:0 "行商会馆、洋行、货栈与江边码头让广州成为受管理的海外贸易门户。此独特[tv_wonder_construction|e]必须在固定历史地点建造，沿用商业行会大厅原型，并以行商特许仪式落成。"
 game_concept_tv_wonder_display_image_163:0 "达达尼尔海峡要塞"
 game_concept_tv_wonder_display_image_163_desc:0 "火炮、高塔与岸防炮台控制着爱琴海与马尔马拉海之间的狭窄水道。此独特[tv_wonder_construction|e]必须在固定历史地点建造，沿用海防大炮原型，并以海峡炮台集结落成。"
 game_concept_tv_wonder_display_image_164:0 "埃斯科里亚尔修道院"
 game_concept_tv_wonder_display_image_164_desc:0 "王家修道院、宫殿、图书馆与王朝记忆共同立于肃穆石墙之中。此独特[tv_wonder_construction|e]必须在固定历史地点建造，沿用大型修道院原型，并以王家回廊奉献落成。"
 game_concept_tv_wonder_display_image_165:0 "托莱多兵工厂"
 game_concept_tv_wonder_display_image_165_desc:0 "锻坊、刀剑厅、试锋场与王家库房让托莱多钢成为军事制度。此独特[tv_wonder_construction|e]必须在固定历史地点建造，沿用巨型军械库原型，并以名剑试锋落成。"
 game_concept_tv_wonder_display_image_166:0 "圣地亚哥朝圣路"
 game_concept_tv_wonder_display_image_166_desc:0 "道路、客舍、圣龛、桥梁与贝壳标识的驿站把香客带向孔波斯特拉。此独特[tv_wonder_construction|e]必须在固定历史地点建造，沿用帝国驿道网络原型，并以朝圣路祝福落成。"
 game_concept_tv_wonder_display_image_167:0 "萨格里什航海学校"
 game_concept_tv_wonder_display_image_167_desc:0 "海图、星盘、领航员与大西洋海风汇聚于拉各斯附近，训练远洋指挥。此独特[tv_wonder_construction|e]必须在固定历史地点建造，沿用海军学校原型，并以远洋海图讲习落成。"
 game_concept_tv_wonder_display_image_168:0 "米兰兵工厂"
 game_concept_tv_wonder_display_image_168_desc:0 "甲匠、铸坊、操场与公爵库房把伦巴第工业同战争绑定起来。此独特[tv_wonder_construction|e]必须在固定历史地点建造，沿用巨型军械库原型，并以伦巴第铸造契约落成。"
 game_concept_tv_wonder_display_image_169:0 "博洛尼亚大学"
 game_concept_tv_wonder_display_image_169_desc:0 "讲堂、法学院、学生团体与拱廊让博洛尼亚成为学识之城。此独特[tv_wonder_construction|e]必须在固定历史地点建造，沿用大学城原型，并以博士大会落成。"
 game_concept_tv_wonder_display_image_170:0 "卡拉拉大理石矿"
 game_concept_tv_wonder_display_image_170_desc:0 "白色采石面、拖石道路、吊机与雕刻家契约把山中石材转化为国家材料。此独特[tv_wonder_construction|e]必须在固定历史地点建造，沿用矿业都市原型，并以大理石采办契约落成。"
 game_concept_tv_wonder_display_1:0 "圣山"
 game_concept_tv_wonder_display_1_desc:0 "由阶梯、露台、圣祠与肃穆殿堂层层攀升的山岳圣所，仿佛把土地托近天穹。朝圣者在香烟与石阶之间上行，王廷的权威也随之披上神圣外衣，使信仰不再像命令，而像一整片地景。"
 game_concept_tv_wonder_display_2:0 "凯旋轴线"
 game_concept_tv_wonder_display_2_desc:0 "由笔直大道、宏阔广场、胜利门、阅兵场与宫殿立面串联而成的仪式都市。使节、军队与市民在有序的石材之间穿行，连移动本身都化作剧场，并反复指向谁才居于中心。"
 game_concept_tv_wonder_display_3:0 "巨港"
 game_concept_tv_wonder_display_3_desc:0 "由防波堤、码头、仓廒、船坞与市集大厅组成的巨型海港，让海洋按王国的规矩进入陆地。桅杆在塔楼下聚集，财富随潮水而来，远方宫廷也会先从这片水岸记住城市之名。"
 game_concept_tv_wonder_display_4:0 "国家陵墓"
 game_concept_tv_wonder_display_4_desc:0 "由陵墓台地、祭祀道路、享堂与卫护园林组成的宏大王家墓葬景观。它在丘陵与聚落附近最能发挥价值，将王朝记忆转化为石材、仪式与公共秩序。"
 game_concept_tv_wonder_display_5:0 "大灯塔"
 game_concept_tv_wonder_display_5_desc:0 "矗立于港湾入口的巨型航标，以一束火光联结贸易航线与海军航程。港口容量越高，选址越优；不同仪式则决定灯塔更偏向舰队、商人还是海上守望。"
 game_concept_tv_wonder_display_6:0 "水利工坊复合体"
 game_concept_tv_wonder_display_6_desc:0 "由水渠、水轮、蓄水池、工坊与闸门组成的工程片区。当地既有建筑越完善，它越能把水利控制转化为生产能力、建造效率与市民权威。"
 game_concept_tv_wonder_display_7:0 "矿业都市"
 game_concept_tv_wonder_display_7_desc:0 "由矿井、矿场、排水工程、市场与铸币设施组成的计划型采掘城市。高发展度与乡村矿区最适合它，而仪式会决定矿井、王权与平民矿工如何分配地下财富。"
 game_concept_tv_wonder_display_8:0 "天文观象台"
 game_concept_tv_wonder_display_8_desc:0 "由观测塔、测星廊、星表厅与仪器庭院组成的巨型观象台。丘陵、高原、山地与识字人口较多的地点最适合它，而仪式会把观天活动导向学术、航海或天象预兆。"
 game_concept_tv_wonder_display_9:0 "万国宫城"
 game_concept_tv_wonder_display_9_desc:0 "建于首都的外交宫城，将等级秩序、觐见仪式与外国存在转化为永久建筑。发展度高的大都会最适合它，而仪式会决定宫城偏向万国会议、贡礼展示或常设使馆区。"
 game_concept_tv_wonder_display_10:0 "大学城"
 game_concept_tv_wonder_display_10_desc:0 "由讲堂、学院、图书馆和学生区组成的学术城市。城市地点和高识字人口最适合它，其仪式可强化研究、公共识字或学院制度下的人口晋升。"
 game_concept_tv_wonder_display_11:0 "天穹大圣殿"
 game_concept_tv_wonder_display_11_desc:0 "一座聚集在巨大仪式穹顶下的纪念性圣殿。正信人口和宗教基础设施最适合它，其仪式可强调祝圣、朝圣收入或教士化行政。"
 game_concept_tv_wonder_display_12:0 "巨塔式神庙"
 game_concept_tv_wonder_display_12_desc:0 "一座由阶梯、灯火室、圣所和学校组成的高塔神庙。其仪式可将高度转化为威望、朝圣纪律或有组织的皈依。"
 game_concept_tv_wonder_display_13:0 "河道拓宽工程"
 game_concept_tv_wonder_display_13_desc:0 "由拓宽河道、桥梁、堤岸、集市和办公室构成的水利奇观。它需要河流地点，并能将移动、贸易与运河行政转化为永久国家能力。"
 game_concept_tv_wonder_display_14:0 "国家船坞"
 game_concept_tv_wonder_display_14_desc:0 "一座沿海造船复合体，由船台、吊机、仓库和海军办公室组成。港口容量和发展度最适合它，其仪式可强调造船速度、舰队士气或海军范围。"
 game_concept_tv_wonder_display_15:0 "星型要塞城"
 game_concept_tv_wonder_display_15_desc:0 "一座由棱堡、操场、弹药库和军械区组成的规划要塞城市。城市防御地点最适合它，其仪式可强化驻军、攻城能力或要塞容量。"
 game_concept_tv_wonder_display_16:0 "长城"
 game_concept_tv_wonder_display_16_desc:0 "一条由城楼、关门、烽火台和集结场组成的边疆长墙。非城市防御地点最适合它，其仪式可强调人力、移动或士气。"
 game_concept_tv_wonder_display_17:0 "巨型军械库"
 game_concept_tv_wonder_display_17_desc:0 "一座用于武器、铸造厂和大师甲匠的大型军事仓储与生产城区。高发展城镇和城市最适合它，其仪式会塑造士气、生产或训练度。"
 game_concept_tv_wonder_display_18:0 "国家图书馆"
 game_concept_tv_wonder_display_18_desc:0 "一座首都图书馆，由目录、抄写屋、阅览室和法定缴存办公室组成。其仪式可通过被保存的知识加速研究、识字或社会晋升。"
 game_concept_tv_wonder_display_19:0 "大水渠"
 game_concept_tv_wonder_display_19_desc:0 "大水渠是一项聚焦农业、运输、防灾的[tv_wonder_construction|e]项目。它偏好河流或湖泊沿岸。仪式可转向灌溉优先、漕运优先、防洪优先。"
 game_concept_tv_wonder_display_20:0 "山地梯田网络"
 game_concept_tv_wonder_display_20_desc:0 "山地梯田网络是一项聚焦高地开发、人口承载的[tv_wonder_construction|e]项目。它偏好山地、高原或丘陵。仪式可转向粮食梯田、经济作物梯田、圣山梯田。"
 game_concept_tv_wonder_display_21:0 "巨堤"
 game_concept_tv_wonder_display_21_desc:0 "巨堤是一项聚焦防洪、控河、权力象征的[tv_wonder_construction|e]项目。它偏好河流、湖泊沿岸或港口。仪式可转向河口防洪、沼泽开垦、水力驱动工坊。"
 game_concept_tv_wonder_display_22:0 "皇家粮仓"
 game_concept_tv_wonder_display_22_desc:0 "皇家粮仓是一项聚焦抗饥荒、国家调控的[tv_wonder_construction|e]项目。它偏好任意非荒芜的己方地点。仪式可转向平抑粮价、战时储备、赈灾。"
 game_concept_tv_wonder_display_23:0 "帝国驿道网络"
 game_concept_tv_wonder_display_23_desc:0 "帝国驿道网络是一项聚焦行政、通信、军队调动的[tv_wonder_construction|e]项目。它偏好任意己方地点。仪式可转向军事驿道、商贸驿道、皇家巡游大道。"
 game_concept_tv_wonder_display_24:0 "运河枢纽城"
 game_concept_tv_wonder_display_24_desc:0 "运河枢纽城是一项聚焦区域贸易与物流的[tv_wonder_construction|e]项目。它偏好河流、湖泊沿岸或港口，且不能为乡村。仪式可转向漕运中心、金融货栈、工业工坊带。"
 game_concept_tv_wonder_display_25:0 "边疆垦殖带"
 game_concept_tv_wonder_display_25_desc:0 "边疆垦殖带是一项聚焦殖民、边疆稳定的[tv_wonder_construction|e]项目。它偏好乡村或边疆开发地点。仪式可转向军屯殖民、移民垦荒、宗教拓殖。"
 game_concept_tv_wonder_display_26:0 "海岸烽火网络"
 game_concept_tv_wonder_display_26_desc:0 "海岸烽火网络是一项聚焦海盗预警、海防的[tv_wonder_construction|e]项目。它偏好港口或海岸地点。仪式可转向烽火通讯、炮台防御、海关巡查。"
 game_concept_tv_wonder_display_27:0 "骑士要塞团"
 game_concept_tv_wonder_display_27_desc:0 "骑士要塞团是一项聚焦军事贵族与边疆秩序的[tv_wonder_construction|e]项目。它偏好非乡村地点，或拥有要塞的地点。仪式可转向圣战骑士团、边疆领主团、雇佣军要塞。"
 game_concept_tv_wonder_display_28:0 "战争学院"
