 tv_engineering_department.500.d_unique_jerusalem_holy_city:0 "城墙、圣所、街区、城门与游行使同一座城市承载多套神圣权威地图。 大工程师提出耶路撒冷圣城体系：每一次权力转换都必须先同记忆谈判，再触碰石头。 如今，圣城权力转换仪式为这座奇观完成了固定历史地点上的落成。权力转换提升信仰容忍、外交声誉与威望。"
