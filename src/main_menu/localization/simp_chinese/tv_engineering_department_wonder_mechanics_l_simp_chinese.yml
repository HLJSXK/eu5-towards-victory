 tv_engineering_department.500.d_unique_teotihuacan:0 "大道、金字塔、院落与彩绘墙保存着一座按宇宙尺度规划的城市。 大工程师转向特奥蒂瓦坎：这座中墨西哥圣城在衰落后仍以金字塔组织记忆。 如今，太阳金字塔火焰终末祭为这座奇观完成了固定历史地点上的落成。火焰终末祭提升威望与正统信仰容忍。"
