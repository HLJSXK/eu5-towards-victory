 tv_engineering_department.500.d_unique_angkor_hydraulic_system:0 "水库、运河、堤岸与稻田让吴哥圣城依赖被工程化的水。 大工程师研究吴哥水网：水库与运河给予神庙王季节性的权力。 如今，西池落成供水礼为这座奇观完成了固定历史地点上的落成。供水礼提升原料产出与繁荣。"
