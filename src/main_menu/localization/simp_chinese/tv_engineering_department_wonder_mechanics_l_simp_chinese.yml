 tv_engineering_department.500.d_unique_belem_tower:0 "石灰岩塔楼矗立于塔霍河口，守望从里斯本驶向旧地图之外海洋的船只。大工程师指向贝伦：一座河口塔楼能在船只越过浅滩之前，先让远洋野心变得可见。如今塔霍守望仪式完成了这座固定历史地点上的奇观。仪式扩展海军航程并提升贸易收入。"
