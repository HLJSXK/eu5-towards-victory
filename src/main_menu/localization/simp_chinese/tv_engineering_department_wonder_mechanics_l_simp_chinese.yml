 tv_wonder_unique_jerusalem_holy_city_inaugurated_desc:0 "城墙、圣所、街区、城门与游行使同一座城市承载多套神圣权威地图。"
 STATIC_MODIFIER_NAME_tv_wonder_unique_jerusalem_holy_city_ceremony_modifier:0 "圣城权力转换仪式"
 TV_ENGINEERING_CEREMONY_UNIQUE_JERUSALEM_HOLY_CITY_INAUGURATED_BUTTON:0 "圣城权力转换仪式"
 TV_ENGINEERING_ACTIVE_RITUAL_UNIQUE_JERUSALEM_HOLY_CITY_1:0 "确认耶路撒冷圣城的圣城权力转换仪式仪式。权力转换提升信仰容忍、外交声誉与威望。。"
 tv_engineering_department.500.d_unique_jerusalem_holy_city:0 "城墙、圣所、街区、城门与游行使同一座城市承载多套神圣权威地图。 大工程师提出耶路撒冷圣城：每一次权力转换都必须先同记忆谈判，再触碰石头。 如今，圣城权力转换仪式为这座奇观完成了固定历史地点上的落成。权力转换提升信仰容忍、外交声誉与威望。"
 game_concept_tv_wonder_sacred_mountain_desc:0 "由阶梯、露台、圣祠与肃穆殿堂层层攀升的山岳圣所，仿佛把土地托近天穹。朝圣者在香烟与石阶之间上行，王廷的权威也随之披上神圣外衣，使信仰不再像命令，而像一整片地景。"
 game_concept_tv_wonder_triumphal_axis_desc:0 "由笔直大道、宏阔广场、胜利门、阅兵场与宫殿立面串联而成的仪式都市。使节、军队与市民在有序的石材之间穿行，连移动本身都化作剧场，并反复指向谁才居于中心。"
 game_concept_tv_wonder_great_port_desc:0 "由防波堤、码头、仓廒、船坞与市集大厅组成的巨型海港，让海洋按王国的规矩进入陆地。桅杆在塔楼下聚集，财富随潮水而来，远方宫廷也会先从这片水岸记住城市之名。"
 game_concept_tv_wonder_giant_necropolis_desc:0 "由陵墓台地、祭祀道路、享堂与卫护园林组成的宏大王家墓葬景观。它在丘陵与聚落附近最能发挥价值，将王朝记忆转化为石材、仪式与公共秩序。"
 game_concept_tv_wonder_great_lighthouse_desc:0 "矗立于港湾入口的巨型航标，以一束火光联结贸易航线与海军航程。港口容量越高，选址越优；不同仪式则决定灯塔更偏向舰队、商人还是海上守望。"
 game_concept_tv_wonder_hydraulic_workshop_desc:0 "由水渠、水轮、蓄水池、工坊与闸门组成的工程片区。当地既有建筑越完善，它越能把水利控制转化为生产能力、建造效率与市民权威。"
 game_concept_tv_wonder_mining_city_desc:0 "由矿井、矿场、排水工程、市场与铸币设施组成的计划型采掘城市。高发展度与乡村矿区最适合它，而仪式会决定矿井、王权与平民矿工如何分配地下财富。"
 game_concept_tv_wonder_giant_observatory_desc:0 "由观测塔、测星廊、星表厅与仪器庭院组成的巨型观象台。丘陵、高原、山地与识字人口较多的地点最适合它，而仪式会把观天活动导向学术、航海或天象预兆。"
 game_concept_tv_wonder_palace_of_nations_desc:0 "建于首都的外交宫城，将等级秩序、觐见仪式与外国存在转化为永久建筑。发展度高的大都会最适合它，而仪式会决定宫城偏向万国会议、贡礼展示或常设使馆区。"
 game_concept_tv_wonder_university_city_desc:0 "由讲堂、学院、图书馆和学生区组成的学术城市。城市地点和高识字人口最适合它，其仪式可强化研究、公共识字或学院制度下的人口晋升。"
 game_concept_tv_wonder_sky_dome_grand_temple_desc:0 "一座聚集在巨大仪式穹顶下的纪念性圣殿。正信人口和宗教基础设施最适合它，其仪式可强调祝圣、朝圣收入或教士化行政。"
 game_concept_tv_wonder_giant_tower_temple_desc:0 "一座由阶梯、灯火室、圣所和学校组成的高塔神庙。其仪式可将高度转化为威望、朝圣纪律或有组织的皈依。"
 game_concept_tv_wonder_river_extension_desc:0 "由拓宽河道、桥梁、堤岸、集市和办公室构成的水利奇观。它需要河流地点，并能将移动、贸易与运河行政转化为永久国家能力。"
 game_concept_tv_wonder_national_shipyard_desc:0 "一座沿海造船复合体，由船台、吊机、仓库和海军办公室组成。港口容量和发展度最适合它，其仪式可强调造船速度、舰队士气或海军范围。"
 game_concept_tv_wonder_star_fortress_city_desc:0 "一座由棱堡、操场、弹药库和军械区组成的规划要塞城市。城市防御地点最适合它，其仪式可强化驻军、攻城能力或要塞容量。"
 game_concept_tv_wonder_great_wall_desc:0 "一条由城楼、关门、烽火台和集结场组成的边疆长墙。非城市防御地点最适合它，其仪式可强调人力、移动或士气。"
 game_concept_tv_wonder_giant_armory_desc:0 "一座用于武器、铸造厂和大师甲匠的大型军事仓储与生产城区。高发展城镇和城市最适合它，其仪式会塑造士气、生产或训练度。"
 game_concept_tv_wonder_library_of_nation_desc:0 "一座首都图书馆，由目录、抄写屋、阅览室和法定缴存办公室组成。其仪式可通过被保存的知识加速研究、识字或社会晋升。"
 tv_engineering_department.500.d_sacred_1:0 "鲜血封圣了黄金圣域。[tv_wonder_ceremony|E]在比任何圣歌都更沉重的沉默中结束，每一位见证者都明白，这座纪念碑上的黄金不只是装饰权力，也记住了权力的代价。王权如今通过这座神圣工程发出光芒，用以震慑怀疑者，安抚忠诚者。祭司谈论献成，廷臣谈论威严，工程师则安静地谈论完工。[tv_engineering_department|E]建起了一处让服从向上仰望的地方。"
 tv_engineering_department.500.d_sacred_2:0 "一年苦修完成了苦修圣山。它的沉默熬过了急躁、流言，以及宫廷用来保护自己免于思考的千百种小声音。[tv_wonder_ceremony|E]留下的不是奇观喧嚣，而是可见的纪律。学者与祭司都发现，这座纪念碑鼓励探究，却并不放弃敬畏。圣山如今通过拒绝给予来教导，国家则被要求学习。"
 tv_engineering_department.500.d_sacred_3:0 "内阁跪入新的神圣秩序。神权帝国中心已经落成，[tv_wonder_ceremony|e]在全国眼前把行政转化为虔敬。教权如今拥有了一处纪念碑式地址，难以忽略，也更难嘲弄。[tv_engineering_department|E]为教义赋予了墙壁、门扉，以及日常统治机器中的位置。从今天起，政策说话时袖中会带着香烟。"
 tv_engineering_department.500.d_axis_1:0 "外国使节已经走过太阳王式荣耀轴线，在石材排列中见证了我国荣光。他们走在该走的地方，看向该看的方向，并明白道路本身就是论证。[tv_wonder_ceremony|E]把见证者变成了我国奇观的携带者。有人会赞美，有人会嫉妒，有人会假装自己并未动容。他们都会记住这条轴线。"
 tv_engineering_department.500.d_axis_2:0 "胜利给予军事凯旋都市真正凯旋。[tv_wonder_ceremony|E]不再依赖排练、旗帜或承诺，而承载了真实战争的重量。士兵穿过如今既属于交通也属于公众记忆的街道。纪念碑以鼓声、整齐队列和幸存之后的宽慰说话。从今天起，它的石头会听见每一次未来的武功夸耀。"
 tv_engineering_department.500.d_axis_3:0 "理性秩序之都已经完成公民庆典。它的广场训练了脚步、目光与习惯，直到服从可以伪装成公共庆祝。[tv_wonder_ceremony|E]散去，但路线留下，而路线是一种安静的教导。人群离去很久以后，这座城市仍会继续教授市民应站在哪里、如何移动，以及秩序究竟是什么感觉。纪念碑的课程如今嵌进了日常生活。"
 tv_engineering_department.500.d_port_1:0 "黄金贸易港一场接一场地被财富买入传说，直到财富本身仿佛献成了港口。[tv_wonder_ceremony|E]闪耀着出价、抛光金属，以及商人们把计算假装成敬畏的表情。每一枚花出去的钱币，都成了商业既能荣耀国家、又能充实自身的公开誓言。港口如今闻起来有盐、黄金和野心。船只会来贸易，也会来受震撼。"
 tv_engineering_department.500.d_port_2:0 "重型战舰已经在帝国海军港前接受检阅。它们的船身像木材与火炮构成的论证一样移动，宣告大海如今必须注意我们的建筑。[tv_wonder_ceremony|E]教会纪念碑在第一个外国船长询问其意义之前，先说出海军权威。水手欢呼，军官清点，码头孩子学习哪些剪影值得敬畏。大海得到了一道悬挂旗帜的门。"
 tv_engineering_department.500.d_port_3:0 "自由贸易都会已经完成开放交换的节庆。异国语言、合同与特权如今锚定了港口声望，比单靠石材更牢固。[tv_wonder_ceremony|E]把讨价还价变成剧场，又把剧场变成政策。商人离开时钱袋或轻或重，但都知道这座港口的名字。港口如今属于流动，而流动学会了使用我们的印章。"
 tv_engineering_department.500.d_necropolis_1:0 "统治者之死让国家陵墓充满王朝意义。队列沉入墓道，携带哀伤、正统性，以及继承如何在肉身之后存活的谨慎编排。[tv_wonder_ceremony|E]让死者变得有用，却又不显得被利用。生者家族从下方有序的沉默中汲取权威。石材、血统与哀悼进入了同一份契约。"
 tv_engineering_department.500.d_necropolis_2:0 "祖先祭仪以姓名、供品与静烟告终，并固定进圣祠。[tv_wonder_ceremony|E]为记忆给予了日程、路径，以及一处被认可的聚集地。国家建起的不只是墓葬，也是一套关于过去仍在监督现在的论证。孩子们会在这里先学会姓名，再理解政治。这正是它为何重要。"
 tv_engineering_department.500.d_necropolis_3:0 "寂静之地已经被永久划出。道路沉默，移民绕行，陵墓园区成为野心与静默之间的边界。[tv_wonder_ceremony|E]要求国家像尊荣征服一样有意尊荣缺席。如今，再没有市场能轻易吞下这片土地。土地被交给了记忆，而记忆是一位苛刻的主人。"
 tv_engineering_department.500.d_lighthouse_1:0 "长明火在海上方燃起。它饥渴的光芒将索取木材、看护，以及午夜之后仍让承诺可见的无尽纪律。[tv_wonder_ceremony|E]把火转化为公共职责，把水手变成远方见证者。船只已经把信标视作第二颗星辰，一颗由人手而非天空制造的星。海岸获得了一只拒绝闭合的眼睛。"
 tv_engineering_department.500.d_lighthouse_2:0 "领航员行会在塔下开门，将航标、账册与领航知识转化为市民权力。[tv_wonder_ceremony|E]把灯塔绑定给训练有素的声音，而不只是火焰和石头。曾经把知识藏在记忆中的领航员，如今把知识带入了有门、有规则、有期待的机构。信标警示船只，行会教会国家如何读懂警示。二者一同让距离更服从。"
 tv_engineering_department.500.d_lighthouse_3:0 "长夜守望已经占据邻近海域。信号从塔楼传向海面又返回，直到缺席本身也成为国家可巡逻之物。[tv_wonder_ceremony|E]把警戒变成了市民习惯，而非偶尔响起的警报。水手如今望向灯塔，不只是为了安全，也为了被允许相信海岸仍然清醒。夜晚失去了一些私密。"
 tv_engineering_department.500.d_hydraulic_1:0 "水神大祭在渠道恢复劳动的歌声中结束。[tv_wonder_ceremony|E]让水看起来服从，这也许是最大胆的工程宣称。工坊恢复运转，但它们是在新的水流、水闸与祝福的神圣秩序下运转。复合体如今通过流动的水承载市民安宁。每一道水轮和渠道都会记得那些教会它们显得服从的仪式。"
 tv_engineering_department.500.d_hydraulic_2:0 "水利工匠行会得到承认，水利工程听命于训练有素的手。[tv_wonder_ceremony|E]完成了特权、机械与本地控制之间的契约。工匠不靠演说获得地位，而靠证明城市依赖他们有度量的能力获得地位。[tv_engineering_department|E]建成了身体；行会将保持身体能言。水如今拥有了自己的专业阶层。"
 tv_engineering_department.500.d_hydraulic_3:0 "繁荣无需仪式便推动水轮，尽管最终认可让这安静运动有了公共意义。这里的[tv_wonder_ceremony|E]几乎显得朴素，因为地点本身已经为实用性作出了论证。工坊的节奏成为当地建设、修理与野心的尺度。人们将以它转动得多稳来评判未来工程。在这个分支里，奇迹听起来像机械。"
 tv_engineering_department.500.d_mining_1:0 "矿工誓言回荡在巷道与广场。权利被宣入石中，城市为了更深财富接受更硬的契约。[tv_wonder_ceremony|E]给予劳工声音，同时提醒每位听众，声音与负担可以共享同一份契约。地下巷道以沉默作答，但沉默并非拒绝。城市已经向下宣誓。"
 tv_engineering_department.500.d_mining_2:0 "王家铸币厂在矿脉闪光之处开门。金属离开土地，穿过权威，又以承载公共信任的铸币形态回到国家。[tv_wonder_ceremony|E]让采掘、主权与价值站进同一间房。矿工看见石头变成货币，官员看见货币变成秩序。城市如今以金属敲击声说话。"
 tv_engineering_department.500.d_mining_3:0 "深井排水工程终于吐息。水从下层矿井退去，水泵进入粗粝节奏，矿业都市学会触及旧日恐惧之下。这里的[tv_wonder_ceremony|e]并不温柔，却很诚实：深度必须以劳力、风险和耐心购买。工程师聆听第一段干燥巷道，如同聆听判决。黑暗并未消失，但已经后退。"
 tv_engineering_department.500.d_observatory_1:0 "星表已经完成。天文观象台将散乱夜空化作有序记录，一行行、一表表，让后世学者继承的不只是敬畏，还有方法。[tv_wonder_ceremony|E]以墨水和石材共同告终。学生将登上这些塔楼，学习天空可以在被赞叹的同时被校正。国家建起了一处让奇观服从耐心记录的地方。"
 tv_engineering_department.500.d_observatory_2:0 "航海历书已经确认，观象台的表格交给了领航员、探险家和雄心勃勃的船长。[tv_wonder_ceremony|E]把星光系上海岸线，将学术计算转化为跨海行动。水手仍会咒骂风暴、洋流和糟糕决定，但他们手中会有更好的数字。天空成了工具，却并未失去神秘。"
 tv_engineering_department.500.d_observatory_3:0 "日食证明了观象台。恐惧准时抵达，却发现宫廷已经带着解释等待。[tv_wonder_ceremony|E]没有留下普通修正，只留下比石头更锋利的公共记忆：国家预言黑暗，并未颤抖。威望随之而来，因为人们最容易记住在昏暗太阳下站立的勇气。"
 tv_engineering_department.500.d_palace_1:0 "外国宫廷穿过万国朝会宫，发现每一步都被安排成石材化的外交。[tv_wonder_ceremony|E]把觐见变成制度，把等级变成房间，把谈判变成市民奇观。使节离去时明白，即使分歧如今也必须从我们的门进入。万国宫城让中央权威变得礼貌、可见且难以回避。"
 tv_engineering_department.500.d_palace_2:0 "贡礼长廊已经完成。附属国献礼有序陈列，在外国与国内目光前被打磨成等级课程。[tv_wonder_ceremony|E]让贡献看起来像仪式而非强迫，而这常是权力最有用的伪装。未来每一位附属使节都会看见长廊，并理解缴纳也能变成建筑。"
 tv_engineering_department.500.d_palace_3:0 "常设使馆区在万国宫城旁开门。外国宫廷如今在首都拥有永久门槛，这意味着外交会在我们的日常天气中醒来、用餐、抱怨、恭维并讨价还价。[tv_wonder_ceremony|E]并非以离去结束，而是以让离去不再必要结束。国家给外国注意力一个地址，并把这个地址安放在自己的城墙之下。"
 tv_engineering_department.600.d_sacred:0 "来自[SCOPE.sCountry('tv_wonder_builder_country').GetName]的消息传来：一座[tv_wonder_sacred_mountain|E]已在[SCOPE.sLocation('tv_wonder_completed_site').GetName]升起。朝圣者、使节和抱着怀疑态度的账吏都在谈论阶台、圣所，以及被信仰驯服的石材。无论旁人称其为虔敬还是野心，这项工程已经让信仰获得了足以被远方宫廷讨论的形体。"
 tv_engineering_department.600.d_axis:0 "来自[SCOPE.sCountry('tv_wonder_builder_country').GetName]的报告称，一座[tv_wonder_triumphal_axis|E]已经在[SCOPE.sLocation('tv_wonder_completed_site').GetName]落成。道路、广场、队列与石材被编排成公共权威的语法。外国观察者或许会争论它是否雅致，却无人能错过其中的信息：那里的权力已经学会沿直线行进。"
 tv_engineering_department.600.d_port:0 "船只带来消息：[SCOPE.sCountry('tv_wonder_builder_country').GetName]已在[SCOPE.sLocation('tv_wonder_completed_site').GetName]完成一座[tv_wonder_great_port|E]。水手如今传说着码头、货栈、典礼，以及被建筑驯入秩序的财富。商人会用利润衡量它，海军会用触及范围衡量它，而对手会不安地明白：港口也能成为纪念碑。"
 tv_engineering_department.600.d_necropolis:0 "信使报告称，[SCOPE.sCountry('tv_wonder_builder_country').GetName]已在[SCOPE.sLocation('tv_wonder_completed_site').GetName]完成一座[tv_wonder_giant_necropolis|E]。墓道与纪念厅将统治、血脉和记忆绑定为一片巨大的景观。死者不会说话，但当祖先的语言被刻得足够深时，每一座宫廷都听得懂。"
 tv_engineering_department.600.d_lighthouse:0 "海员带来[SCOPE.sCountry('tv_wonder_builder_country').GetName]的消息：一座[tv_wonder_great_lighthouse|E]已在[SCOPE.sLocation('tv_wonder_completed_site').GetName]点亮。它的信标已经进入水手故事，成了由政策、劳作和顽强火焰制造的第二颗星辰。有人会称它为指引，有人会称它为警告，但每一条海岸线都有理由注意。"
 tv_engineering_department.600.d_hydraulic:0 "消息流传开来：[SCOPE.sCountry('tv_wonder_builder_country').GetName]已在[SCOPE.sLocation('tv_wonder_completed_site').GetName]完成一座[tv_wonder_hydraulic_workshop|E]。沟渠、水轮、水闸与工坊如今让水流在公众面前表演市民秩序。它比黄金或军队安静，却足以让统治者尊重任何能让河流服从日程的国家。"
 tv_engineering_department.600.d_mining:0 "来自[SCOPE.sCountry('tv_wonder_builder_country').GetName]的旅人谈起[SCOPE.sLocation('tv_wonder_completed_site').GetName]落成的[tv_wonder_mining_city|E]。矿井、熔炉、铸币、誓言与市场被牵入同一具工业城市身体。大地在仪式中被打开，而世界将注视那里会从黑暗中取出怎样的财富。"
 tv_engineering_department.600.d_observatory:0 "学者与水手共同传来消息：[SCOPE.sCountry('tv_wonder_builder_country').GetName]已在[SCOPE.sLocation('tv_wonder_completed_site').GetName]完成一座[tv_wonder_giant_observatory|E]。塔楼与表册如今承诺，天空可以由国家的耐心来观测。敬畏仍在，只是它如今拥有了仪器、记录，以及愿意资助二者的宫廷。"
 tv_engineering_department.600.d_palace:0 "使节报告称，[SCOPE.sCountry('tv_wonder_builder_country').GetName]已在[SCOPE.sLocation('tv_wonder_completed_site').GetName]为一座[tv_wonder_palace_of_nations|E]举行落成礼。觐见厅、长廊和使馆门槛把外交转化为建筑。外国事务仍会焦虑而尖锐，但它如今有了一座让东道主无法被绕开的舞台。"
 tv_engineering_department.500.d_university_1:0 "学者大会以讲学、章程与掌声结束。大学城不再只是大厅，而成为将好奇心转化为国家力量的制度。[tv_wonder_ceremony|E]让研究的速度从此受益于这座城市。"
 tv_engineering_department.500.d_university_2:0 "公开讲学让工匠、书记、官员与学生挤满大学城。[tv_wonder_ceremony|E]将识字从私人优势变成公共习惯。"
 tv_engineering_department.500.d_university_3:0 "学院大厅在特许状下开门。[tv_wonder_ceremony|E]把学术变成制度，让晋升开始穿过书本与讲席。"
 tv_engineering_department.500.d_sky_dome_1:0 "帷幕从祝圣的穹顶上拉开，光与歌声充满圣殿。[tv_wonder_ceremony|E]让正信获得了宏伟而可见的住所。"
 tv_engineering_department.500.d_sky_dome_2:0 "朝圣金库已经捐建完成。钱币、誓愿与旅程汇聚在天穹大圣殿之下，[tv_wonder_ceremony|E]让虔敬学会财政纪律。"
 tv_engineering_department.500.d_sky_dome_3:0 "天穹宗会完成了将内阁转化为教士秩序的工作。[tv_wonder_ceremony|E]给圣殿以行政灵魂。"
 tv_engineering_department.500.d_tower_temple_1:0 "灯火仪式从高塔燃起，把威望送过屋顶与道路。[tv_wonder_ceremony|E]让高度成为国家宣告。"
 tv_engineering_department.500.d_tower_temple_2:0 "一年朝圣脚步完成了塔庙。[tv_wonder_ceremony|E]让信仰拥有了一条石头道路。"
 tv_engineering_department.500.d_tower_temple_3:0 "神庙学校在塔下开门。[tv_wonder_ceremony|E]让课程、祈祷与抄本把皈依带向日常。"
 tv_engineering_department.500.d_river_1:0 "开桥典礼将拓宽河道与相邻土地连接起来。[tv_wonder_ceremony|E]让移动本身更有信心。"
 tv_engineering_department.500.d_river_2:0 "河市节在一年驳船、摊棚和关税中结束。[tv_wonder_ceremony|E]让商业公开学习了河流的新形状。"
 tv_engineering_department.500.d_river_3:0 "运河办公室在河道工程旁开门。[tv_wonder_ceremony|E]将治水变成行政。"
 tv_engineering_department.500.d_shipyard_1:0 "铺龙骨礼将船坞纳入国家事业。[tv_wonder_ceremony|E]教会船坞：海权在下水之前已经开始。"
 tv_engineering_department.500.d_shipyard_2:0 "舰队集结让国家船坞充满重型船体和期待。[tv_wonder_ceremony|E]向海洋展示了国家的工坊。"
 tv_engineering_department.500.d_shipyard_3:0 "海军署办公室在海图与印玺中开门。[tv_wonder_ceremony|E]让船坞听命于永久海军行政。"
 tv_engineering_department.500.d_star_fortress_1:0 "棱堡试验结束，角度与射界已经被证明。[tv_wonder_ceremony|E]让防御成为可检验的几何。"
 tv_engineering_department.500.d_star_fortress_2:0 "围城演习在尘土与欢呼中结束。[tv_wonder_ceremony|E]让要塞城在真正战争前先练习危险。"
 tv_engineering_department.500.d_star_fortress_3:0 "军械城区在星型要塞城内开门。[tv_wonder_ceremony|E]把要塞从城墙变成持续防御的系统。"
 tv_engineering_department.500.d_great_wall_1:0 "边疆集结完成了长城与边民、士兵之间的公开契约。[tv_wonder_ceremony|E]留下的是一条线，也是一场聚集。"
 tv_engineering_department.500.d_great_wall_2:0 "一年的烽火教会长城说话。[tv_wonder_ceremony|E]给边疆一套烟与火的神经系统。"
 tv_engineering_department.500.d_great_wall_3:0 "长城誓言沿边疆宣读。[tv_wonder_ceremony|E]将石头变成义务。"
 tv_engineering_department.500.d_armory_1:0 "武备集结让巨型军械库充满准备就绪的声音。[tv_wonder_ceremony|E]让国家看见自己的钢铁汇聚何处。"
 tv_engineering_department.500.d_armory_2:0 "铸造契约已经完成。[tv_wonder_ceremony|E]让生产成为国家仪式，而不只是工坊习惯。"
 tv_engineering_department.500.d_armory_3:0 "大师甲匠厅在军械库内开门。[tv_wonder_ceremony|E]教会军队尊重信心背后的制造者。"
 tv_engineering_department.500.d_library_1:0 "国家目录完成了第一项伟大劳作。[tv_wonder_ceremony|E]给知识一张地图，也给研究以速度。"
 tv_engineering_department.500.d_library_2:0 "抄写员基金已经封存。[tv_wonder_ceremony|E]让国家学问学会复制、传播与增长。"
 tv_engineering_department.500.d_library_3:0 "法定缴存办公室在国家图书馆旁开门。[tv_wonder_ceremony|E]把保存变成法律。"
 tv_engineering_department.600.d_university:0 "消息传来：[SCOPE.sCountry('tv_wonder_builder_country').GetName]在[SCOPE.sLocation('tv_wonder_completed_site').GetName]完成了一座[tv_wonder_university_city|E]。知识获得了城市、讲堂与制度。"
 tv_engineering_department.600.d_sky_dome:0 "朝圣者报告：[SCOPE.sCountry('tv_wonder_builder_country').GetName]在[SCOPE.sLocation('tv_wonder_completed_site').GetName]完成了一座[tv_wonder_sky_dome_grand_temple|E]。信仰获得了高度、秩序与收入。"
 tv_engineering_department.600.d_tower_temple:0 "消息升起：[SCOPE.sCountry('tv_wonder_builder_country').GetName]在[SCOPE.sLocation('tv_wonder_completed_site').GetName]落成了一座[tv_wonder_giant_tower_temple|E]。阶梯、灯火与学校将高度化作仪式。"
 tv_engineering_department.600.d_river:0 "商人传来消息：[SCOPE.sCountry('tv_wonder_builder_country').GetName]在[SCOPE.sLocation('tv_wonder_completed_site').GetName]完成了一项[tv_wonder_river_extension|E]。河流被拓宽为交通、行政与庆典。"
 tv_engineering_department.600.d_shipyard:0 "水手们说，[SCOPE.sCountry('tv_wonder_builder_country').GetName]在[SCOPE.sLocation('tv_wonder_completed_site').GetName]落成了一座[tv_wonder_national_shipyard|E]。造船已经成为国家野心的制度。"
 tv_engineering_department.600.d_star_fortress:0 "报告称，[SCOPE.sCountry('tv_wonder_builder_country').GetName]在[SCOPE.sLocation('tv_wonder_completed_site').GetName]完成了一座[tv_wonder_star_fortress_city|E]。城市让几何成为防御政治。"
 tv_engineering_department.600.d_great_wall:0 "边疆旅人带来消息：[SCOPE.sCountry('tv_wonder_builder_country').GetName]在[SCOPE.sLocation('tv_wonder_completed_site').GetName]完成了一座[tv_wonder_great_wall|E]。权威被铺展到艰难边界上。"
 tv_engineering_department.600.d_armory:0 "军事使节报告：[SCOPE.sCountry('tv_wonder_builder_country').GetName]在[SCOPE.sLocation('tv_wonder_completed_site').GetName]落成了一座[tv_wonder_giant_armory|E]。钢铁获得了一套制度。"
 tv_engineering_department.600.d_library:0 "学者带来消息：[SCOPE.sCountry('tv_wonder_builder_country').GetName]在[SCOPE.sLocation('tv_wonder_completed_site').GetName]完成了一座[tv_wonder_library_of_nation|E]。国家的书面记忆被建成公共建筑。"
