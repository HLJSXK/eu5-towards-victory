 tv_engineering_department.500.d_unique_iberian_inquisition:0 "审判厅、档案室、回廊与受守卫的讲坛把宗教纪律转化为制度。大工程师提出托莱多的修道院式裁判所：记录与仪式可以让正统信仰在行政上持久存在。如今裁判登记仪式完成了这座固定历史地点上的奇观。裁判所加速皈依并降低稳定投资。"
