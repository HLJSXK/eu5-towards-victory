 game_concept_tv_wonder_unique_pharos_lighthouse_desc:0 "白石高塔矗立于亚历山大港口，将王权的野心化作水手可以信赖的灯火。 这是一项必须在固定历史地点建造的独特[tv_wonder_construction|e]工程，沿用其通用原型的地点规则，并以港口点灯典礼作为历史定制落成仪式。"
 TV_ENGINEERING_PROPOSAL_UNIQUE_PHAROS_LIGHTHOUSE_TEXT:0 "大工程师谈起法罗斯岛上的灯塔：亚历山大曾把安全航行变成一种公开的权力宣言。 简报：[tv_wonder_unique_pharos_lighthouse|E]是一项固定于其历史地点的独特历史[tv_wonder_small|E]工程。"
