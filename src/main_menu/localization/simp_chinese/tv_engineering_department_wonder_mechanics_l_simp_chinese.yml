 TV_ENGINEERING_ACTIVE_RITUAL_UNIQUE_HAGIA_SOPHIA_1:0 "确认圣索菲亚大教堂的查士丁尼重建落成祈祷仪式。落成祈祷提升正统信仰容忍，并降低稳定度投资花费。。"
 tv_engineering_department.500.d_unique_hagia_sophia:0 "重建的穹顶收拢黄金、大理石、香烟与帝国记忆，仿佛悬浮于尘世之上。 大工程师以君士坦丁堡查士丁尼重建的圣堂为例：那座穹顶要证明帝国仍能号令天国与石材。 如今，查士丁尼重建落成祈祷为这座奇观完成了固定历史地点上的落成。落成祈祷提升正统信仰容忍，并降低稳定度投资花费。"
 game_concept_tv_wonder_unique_dome_of_the_rock:0 "岩石圆顶圣殿"
 game_concept_tv_wonder_unique_dome_of_the_rock_desc:0 "金色穹顶覆盖耶路撒冷圣台，将朝觐、主权与纷争记忆紧密相连。 这是一项必须在固定历史地点建造的独特[tv_wonder_construction|e]工程，沿用其通用原型的地点规则，并以圣殿封顶朝觐作为历史定制落成仪式。"
 TV_ENGINEERING_PROPOSAL_UNIQUE_DOME_OF_THE_ROCK_TEXT:0 "大工程师讲述耶路撒冷岩石之上的圣殿：建筑本身便是每个朝圣者都能看见的主张。 简报：[tv_wonder_unique_dome_of_the_rock|E]是一项固定于其历史地点的独特历史[tv_wonder_medium|E]工程。"
