 # Towards Victory — Diplomatic Prediction Localization (Simplified Chinese)

 tv_diplo_prediction.1.t: "基督教世界的疑问"
 tv_diplo_prediction.1.d: "西方教会大分裂使天主教欧洲在敌对宣称者之间分裂。谨慎的使节或许能在最终和解前读出枢机、庇护者与公会议之间的力量平衡。"
 tv_diplo_prediction.1.a: "罗马宣称者将会胜出。"
 tv_diplo_prediction.1.b: "敌对宣称者将会胜出。"
 tv_diplo_prediction.1.c: "这场争端过于难测。"
 tv_diplo_prediction_western_schism_papal_tt: "预测教宗国一方的宣称者将在西方教会大分裂中获胜。"
 tv_diplo_prediction_western_schism_opponent_tt: "预测分裂对手将在西方教会大分裂中获胜。"

 tv_diplo_prediction.2.t: "安纳托利亚的未来"
 tv_diplo_prediction.2.d: "安纳托利亚诸贝伊国正在争夺权势遗产。最强者或许能建立长久秩序，也可能由奥斯曼崛起并压倒诸敌。"
 tv_diplo_prediction.2.a: "当前最强的贝伊国将保持主导。"
 tv_diplo_prediction.2.b: "奥斯曼将成为主导者。"
 tv_diplo_prediction.2.c: "这场斗争不由我们评判。"
 tv_diplo_prediction_rise_ottomans_current_tt: "预测当前最强的贝伊国将在局势结算时仍然居于主导地位。"
 tv_diplo_prediction_rise_ottomans_tur_tt: "预测奥斯曼将在局势结算时居于主导地位。"

 tv_diplo_prediction.101.t: "预测得到验证"
 tv_diplo_prediction.101.d: "我们的外交官准确预见了西方教会大分裂的结局。各国宫廷如今以新的敬意谈论我们的判断力。"
 tv_diplo_prediction.102.t: "预测被证明错误"
 tv_diplo_prediction.102.d: "西方教会大分裂以不符合我们预期的方式结束。即使技艺高超的使节，也并不总能驾驭信仰与政治的暗流。"

 tv_diplo_prediction.201.t: "安纳托利亚预判成真"
 tv_diplo_prediction.201.d: "我们对安纳托利亚主导力量崛起的预测已经成真，这增强了我国在外交远见上的声誉。"
 tv_diplo_prediction.202.t: "安纳托利亚预判失败"
 tv_diplo_prediction.202.d: "安纳托利亚的力量平衡以不同于我们预期的方式尘埃落定。这一教训仍会磨炼我们未来的外交。"

 tv_diplo_prediction.correct.a: "我们的判断是正确的。"
 tv_diplo_prediction.incorrect.a: "我们会从中学习。"
 tv_diplo_prediction_major_reward_tt: "获得 30 点预测分数和 30 点外交胜利点数。"
 tv_diplo_prediction_regional_reward_tt: "获得 20 点预测分数和 20 点外交胜利点数。"
