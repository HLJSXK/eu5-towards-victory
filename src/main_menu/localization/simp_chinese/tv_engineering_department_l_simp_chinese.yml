 tv_engineering_department.10.t: "[tv_great_engineer|E]：大工程师逝世"
 tv_engineering_department.10.d: "我国的[tv_great_engineer|E]已经逝世。消息在[tv_engineering_department|e]中以合上的图纸盒、停下的测绘桌，以及助手们突然不愿擦去最后几道粉笔线的方式传播开来。每一份未完成图样如今都比昨日更显脆弱。奇观机制可以保留账册，但[tv_wonder_construction|e]需要一个活着的头脑，把野心变成次序。在任命继任者之前，国家有石材、劳力和希望，却没有能让三者彼此同意的工程大师。"
 tv_engineering_department.10.a: "在图纸冷却前找到继任者。"
 tv_engineering_department.20.t: "[tv_wonder_construction|E]：奇观工程崩溃"
 tv_engineering_department.20.d: "[tv_wonder_domestic_support|E]储备已经流失殆尽。曾经赞美工程的廷臣忽然想起了别处的急事，阶层代表重新发现自己的反对意见，供应者也要求下一辆车出发前先付款。宏大工程再也无法辩护，[tv_engineering_department|e]只能放弃已锁定的奇观，并承担这份耻辱。地面仍在，早期标记仍在，或许几块石料也仍在，但支撑它们的政治桥梁已经坍塌。没有任何纪念碑能建立在沉默、恐惧和未兑现承诺之上。"
 tv_engineering_department.20.a: "把耻辱记录得清楚些。"
 tv_engineering_department.100.t: "[tv_wonder_construction|E]：贵族家族集结支持"
 tv_engineering_department.100.d: "几个贵族家族认定，奇观既能放大王国的记忆，也能放大他们自己的名望。他们的传令官谈论祖传席位、不朽姓名，以及后世把私人荣光误认为公共目的的美妙可能。[tv_engineering_department|E]并不纠正他们。支持就是支持，而[tv_wonder_domestic_support|e]常常戴着珠宝抵达。他们的声音如今在宫廷中以有用的音量回响。"
 tv_engineering_department.100.a: "让他们站到众人面前。"
 tv_engineering_department.101.t: "[tv_wonder_construction|E]：贵族反弹"
 tv_engineering_department.101.d: "流言称奇观将吞噬贵族特权，却无法回报足够的荣誉。几个家族开始计算的不是纪念碑未来的辉煌，而是它可能夺走的席位、豁免、劳力和仪式优先权。[tv_engineering_department|E]能够测量石材，却很难测绘受伤的等级尊严。贵族中的支持开始动摇，每一次迟疑都让整个工程显得更沉。骄傲或许比大理石轻，却难搬得多。"
 tv_engineering_department.101.a: "他们的骄傲代价不低。"
 tv_engineering_department.102.t: "[tv_wonder_construction|E]：市民看见机会"
 tv_engineering_department.102.d: "行会首领和金融家开始谈论合同、道路、仓库以及未来的人潮。他们在奇观中看见的不只是壮丽，还有账单、运输权、出租房间，以及仍能收取费用的孙辈。[tv_engineering_department|E]仔细倾听，因为商业很擅长把野心说得实际。他们的热情为辩论注入了新动力。繁荣带着沾墨手指和漂亮算术抵达了。"
 tv_engineering_department.102.a: "繁荣的声音很有说服力。"
 tv_engineering_department.103.t: "[tv_wonder_construction|E]：商人计算成本"
 tv_engineering_department.103.d: "一些市民警告说，奇观将占用劳力、信用和运输。他们并不直接谴责荣耀，只是询问有多少车队、工资和仓库必须被压在荣耀底下。这种谨慎比恐慌更难打发，因为每句话都带着一列看似可信的数字。[tv_engineering_department|E]能感觉公众信心正在一度度冷却。账簿若被当众朗读，也能像演说一样伤人。"
 tv_engineering_department.103.a: "账簿也能像演说一样伤人。"
 tv_engineering_department.104.t: "[tv_wonder_construction|E]：教士祝福"
 tv_engineering_department.104.d: "有影响力的教士将奇观描述为秩序与虔敬的可见标志。布道把规整石材比作顺服灵魂，把稳固地基比作正统教义，把公共劳动比作义民的纪律。[tv_engineering_department|E]从这些语言中受益，尽管工程师私下里更喜欢垂线胜过隐喻。辩论因此多了一层庄重而安心的语调。当天堂看起来赞许脚手架时，[tv_wonder_domestic_support|e]总会更容易上涨。"
 tv_engineering_department.104.a: "有用的祝福。"
 tv_engineering_department.105.t: "[tv_wonder_construction|E]：反对奢靡的布道"
 tv_engineering_department.105.d: "布道者谴责该工程只是披着石材外衣的虚荣。他们追问饥饿村庄是否需要大理石，统治者灵魂是否能靠高度得救，以及骄傲是否只因石匠丈量过便能成圣。这一指控在本已不安的人群中找到了听众。[tv_engineering_department|E]能回答许多反对意见，但布道天生适合在反驳之后继续存活。信仰能祝福地基，也能拒绝地基。"
 tv_engineering_department.105.a: "信仰也能拒绝大理石。"
 tv_engineering_department.200.t: "[tv_wonder_construction|E]：一个奇观单元完工"
 tv_engineering_department.200.d: "奇观又有一段跨过了清晰可见的阈值。脚手架被撤下，监工标记完工单元，工人们带着谨慎自豪后退一步，因为他们知道下一项任务同样沉重。公众终于能看见那件不可能之事正在化作石材、梁柱、渠道或穹顶。即使批评者，也更难嘲弄一个已经投下阴影的东西。[tv_wonder_construction|E]获得的不只是进度，还有证据。"
 tv_engineering_department.200.a: "继续推进工程。"
 tv_engineering_department.201.t: "[tv_wonder_construction|E]：奇观拔地而起"
 tv_engineering_department.201.d: "在[SCOPE.sLocation('tv_wonder_event_location').GetName]，四个完工模块已经完成了使命。现在可以拆除这些临时构件，并正式开始建造奇观本体的核心结构。基础、主体、功能与封顶不再是彼此分离的碎片，而将被并入同一座纪念碑。"
 tv_engineering_department.201.a: "拆除模块，开始建造主体。"
 tv_engineering_department.202.t: "[tv_wonder_construction|E]：工程矗立"
 tv_engineering_department.202.d: "[tv_engineering_department|E]已经宣布建设阶段完成。奇观工地收拢器具，劳工队伍撤离，最后一批[tv_wonder_materials|e]账册也以只有会计才真正享受的满足感封存。纪念碑如今站立着，但石头本身还不是命运。未回答的问题已经从如何建造它，变成了如何献成它。国家已经造出身体；[tv_wonder_ceremony|e]必须为它赋予公共灵魂。"
 tv_engineering_department.202.a: "准备仪式。"
 tv_engineering_department.203.t: "[tv_wonder_construction|E]：辩论已经落定"
 tv_engineering_department.203.d: "宫廷已经宣布奇观辩论结束。反对并未凭空消失，却已经被计数、回答、安抚，或被折入正式方案。工程如今离开演说，进入土地、道路、坡度与距离构成的测量世界。[tv_great_engineer|e]请求确定一处测绘地点。从现在开始，[tv_wonder_domestic_support|e]会逐月缓慢流失，所以下一道命令应当务实：选择纪念碑真正能够站立的地方。"
 tv_engineering_department.203.a: "开始测绘。"
 tv_engineering_department.300.t: "[tv_wonder_survey|E]：测绘完成"
 tv_engineering_department.300.d_high: "[tv_wonder_survey|E]带回了极佳读数。选定地点足以承载野心，补给能够抵达，工队在第一座永久营地竖起前便已看见穿过地形的路径。[tv_great_engineer|E]把表格读了两遍，不是因为数字可疑，而是好消息值得复核。规模、物流与组织如今指向同一方向。此地几乎像是急于把困难变成有用之物。"
 tv_engineering_department.300.d_mid: "[tv_wonder_survey|E]带回了可用读数。这里不会让工程轻松无忧，但诚实的奇观从来不承诺轻松。土地有限制，道路有脾气，劳工计划需要纪律而非浪漫。尽管如此，[tv_engineering_department|e]已经能够围绕被命名的弱点制定方案。被测量过的障碍，已经被驯服了一半。"
 tv_engineering_department.300.d_low: "[tv_wonder_survey|E]带回了令人不安的读数。此地仍可宣布为选址，但地图看起来很紧张，测绘员也以专业谨慎挑选词句。地面、路线或劳工组织，都可能比最初预期更抵抗我们的野心。[tv_engineering_department|e]警告说，其他地点也许更适合这座奇观。在这里继续推进，将是睁着眼睛作出的决定；这比盲目更好，也比自信更昂贵。"
 tv_engineering_department.300.a: "审阅结果。"
 tv_engineering_department.310.t: "[tv_wonder_survey|E]：隐秘地基"
 tv_engineering_department.310.d: "测绘员在预定工地之下发现了稳固地层与古老石基。最初看似仅仅坚实的地面，如今几乎像是被某只遗忘之手预先整理过。[tv_wonder_survey|E]队伍愉快地争论承重、深度，以及发现一个仿佛自己解决自己的问题时那种罕见快乐。奇观可能达到的规模比最初估计更加宽裕。连[tv_great_engineer|E]也在要求再次测量前露出了一点笑意。"
 tv_engineering_department.310.a: "很好。"
 tv_engineering_department.311.t: "[tv_wonder_survey|E]：险恶地面"
 tv_engineering_department.311.d: "最初地图承诺的稳固之处正在移位。标桩倾斜，粉线彼此不再吻合，测绘队开始用更短的句子交谈。额外支撑将压缩奇观的实际规模，不是因为野心变弱，而是土地提出了自己的条件。[tv_engineering_department|E]仍可继续推进。它只是必须停止假装地面是被动的。"
 tv_engineering_department.311.a: "调整方案。"
 tv_engineering_department.312.t: "[tv_wonder_survey|E]：畅通补给线"
 tv_engineering_department.312.d: "[tv_wonder_survey|E]发现了能够更顺畅运输石料、木材和工具的路线。一条被忽视的道路接上一处可用河湾，一个集结场比记忆中更宽，当地搬运者还知道王室地图从未学会的捷径。[tv_wonder_materials|E]将因此更干净地移动，因为土地给出了几项安静恩惠。车队尚未出发，监工们却已经开始重新计算时间。物流这一次不是指控，而是一张边缘很好的地图。"
 tv_engineering_department.312.a: "仔细标注。"
 tv_engineering_department.313.t: "[tv_wonder_survey|E]：破碎通路"
 tv_engineering_department.313.d: "道路、水道与集结地都比最初报告更差。车轮在本应坚实的路上陷落，船只在本应通行的水面上误时，集结场在真正的车队进入时忽然显得狭窄。物流将更难驯服，而[tv_wonder_materials|e]不会原谅乐观。[tv_engineering_department|E]如今面对所有宏大工程的旧真相：纪念碑在石料抵达前很久便已开始。有时，它开始于泥。"
 tv_engineering_department.313.a: "我们会补救。"
 tv_engineering_department.314.t: "[tv_wonder_survey|E]：野外秩序"
 tv_engineering_department.314.d: "测量队逐渐形成清晰节奏。旗标立起，笔记抄清，监工们不再互相矛盾，粗略观察也转化为未来劳力真正能够遵守的体系。这并不是戏剧性的发现，却可能比发现更加有用。[tv_wonder_construction|E]依靠许多人按同一顺序做同一件事这种沉闷奇迹。今天，这个奇迹看起来有可能发生。"
 tv_engineering_department.314.a: "好习惯。"
 tv_engineering_department.315.t: "[tv_wonder_survey|E]：测绘混乱"
 tv_engineering_department.315.d: "相互矛盾的地图与彼此竞争的监工拖慢了工作。一队坚称应走山脊，一队坚称应走道路，第三队则拿出一张精确到立刻令人不信任的表格。[tv_engineering_department|E]对未来组织方案的信心有所下降，因为混乱一旦写在纸上，就几乎显得官方。奇观比起坏地面，更难承受坏指挥。在劳工开始之前，必须先教会地图彼此同意。"
 tv_engineering_department.315.a: "理清它。"
 tv_engineering_department.320.t: "[tv_wonder_survey|E]：特殊仪器申请"
 tv_engineering_department.320.d: "测绘员申请昂贵仪器与专业匠人。他们谈到普通目力难以分辨的角度，不能靠猜测完成的土质测试，以及能让[tv_great_engineer|e]规模评估少依赖贵族乐观的测量。宫廷听见的是开销；工程师听见的是精度。资助他们应能改善测绘，但也会教会未来每个申请者：准确有价格。拒绝则让旧工具留在原处，让未知数礼貌微笑。"
 tv_engineering_department.320.a: "为精度付款。"
 tv_engineering_department.320.b: "用现有条件将就。"
 tv_engineering_department.321.t: "[tv_wonder_survey|E]：专业声望"
 tv_engineering_department.321.d: "[tv_great_engineer|E]要求宫廷公开支持一种有争议的物流方法。该方案承诺更快移动[tv_wonder_materials|e]、减少闲置劳工，也具备那种会让保守监工开始清嗓子的全部新奇感。借出国家声望也许能让补给方案更有说服力。若它失败，尴尬同样会是公开的。宏大工程常常要求国家在第一批观众理解规则之前先下注。"
 tv_engineering_department.321.a: "以我国名望背书。"
 tv_engineering_department.321.b: "不公开背书。"
 tv_engineering_department.322.t: "[tv_wonder_survey|E]：行会协调"
 tv_engineering_department.322.d: "城市供应者可以帮助统一测绘记录，但他们也期待因这份麻烦得到补偿。他们的书记懂得重量、清单、路线，以及让一份表格与另一份表格对齐的安静专制。[tv_engineering_department|E]确实能用得上这种能力，尤其是在[tv_wonder_materials|e]真正开始流动之前。然而每一项让步都会把商业更深地写进纪念碑的记忆。我们可以买到秩序，但秩序会记得是谁卖给它的。"
 tv_engineering_department.322.a: "倚重行会。"
 tv_engineering_department.322.b: "避免新的义务。"
 tv_engineering_department.401.t: "[tv_wonder_ceremony|E]：冥想开始"
 tv_engineering_department.401.d: "已完成的奇观被沉默笼罩。祭司、工程师与王室见证人暂时离开日常喧嚣，以一年苦修赋予纪念碑最终意义。[tv_wonder_ceremony|E]并非以喧哗开始，而是以有意拒绝喧哗开始。即使[tv_engineering_department|e]也必须学会耐心，因为没有任何计算能够催促一种旨在教授克制的仪式。访客最初觉得这份安静令人不安。随后，他们在尚未明白原因前便开始压低声音。"
 tv_engineering_department.401.a: "让这一年流逝。"
 tv_engineering_department.410.t: "[tv_wonder_ceremony|E]：使节邀请"
 tv_engineering_department.410.d: "邻近宫廷请求我们派遣使节，见证其宏伟轴线的落成。邀请是仪式性的，但仪式正是国家练习被记住的地方。出席将让我国名列最先见证新纪念碑、在正确时刻鼓掌，并无需解释便听懂讯息者之中。拒绝可以省下旅程，也会放弃在其故事中的位置。有些石头建在本国，另一些则期待海外见证。"
 tv_engineering_department.410.a: "派出使节。"
 tv_engineering_department.410.b: "拒绝邀请。"
 tv_engineering_department.411.t: "[tv_wonder_ceremony|E]：一位使节抵达"
 tv_engineering_department.411.d: "受邀宫廷已经接受。又一位外国使节带着排练过的庄重、随行队伍，以及训练有素、既会观察宏伟也会观察弱点的眼睛加入仪式队列。[tv_wonder_ceremony|E]随着每一位外部见证者而更具说服力，因为荣耀若由另一种口音重复，声音总会更响。队列长调整入场顺序，书记调整贵宾名单。奇观的仪式进度随着一个个观看的宫廷向前推进。"
 tv_engineering_department.411.a: "以礼接待。"
 tv_engineering_department.412.t: "[tv_wonder_ceremony|E]：邀请遭拒"
 tv_engineering_department.412.d: "受邀宫廷拒绝派遣使节。他们的答复足够礼貌，不至于构成侮辱；也足够冷淡，必将被记住。[tv_wonder_ceremony|E]必须从别处寻找观众，因为一座追求外国敬畏的纪念碑承受不起外交席位的空缺。廷臣们已经开始建议新的名字、更悦耳的路线，以及听起来更不像请求的信件。荣耀不喜欢拒绝，但它可以改道。"
 tv_engineering_department.412.a: "邀请另一个邻国。"
 tv_engineering_department.421.t: "[tv_wonder_ceremony|E]：凯旋阅兵开始"
 tv_engineering_department.421.d: "旗帜已经沿着轴线升起，但阅兵仍缺少真正的证明。鼓手可以排练，马蹄可以用仪式性的脚步擦亮石面，军官也可以把自己排成美丽的自信，但这一切都不是胜利。[tv_wonder_ceremony|E]要求一种必须由战争本身认证的凯旋。在此之前，军事凯旋都市只是穿上了尚未完全赢得的荣誉。唯有战争胜利才能给予纪念碑所索取的记忆。"
 tv_engineering_department.421.a: "那就取得胜利。"
 tv_engineering_department.431.t: "[tv_wonder_ceremony|E]：公民庆典开始"
 tv_engineering_department.431.d: "城市将秩序井然的广场开放给一整年的仪式、游戏、游行与公共教化。工坊放慢了脚步，但人民通过行走、观看和抱怨学习公民纪律的形状，直到它显得熟悉。[tv_wonder_ceremony|E]把城市空间变成了露天反复讲授的课程。孩子们在理解口号前便记住了路线。理性秩序之都正通过让服从变得像节日来教学。"
 tv_engineering_department.431.a: "让市民集结。"
 tv_engineering_department.461.t: "[tv_wonder_ceremony|E]：自由贸易节开始"
 tv_engineering_department.461.d: "商人、使节与经纪人以开放交换的承诺填满港口。收入会暂时收紧，因为慷慨总是在账目结清前显得最高贵。[tv_wonder_ceremony|E]把码头、仓库和拥挤桌案变成了外国信心的舞台。每一份公开签下的契约，都在教港口说出远方宫廷听得懂的语言。一整年里，利润低头，让声誉先行。"
 tv_engineering_department.461.a: "开放码头。"
 tv_engineering_department.471.t: "[tv_wonder_ceremony|E]：祖先祭仪开始"
 tv_engineering_department.471.d: "陵墓园区进入了一整年的香烟、谱系与有序哀悼。姓名被反复诵念，直到比它们曾经所属的身体更加沉重；工坊则放慢脚步，让记忆优先于生产。[tv_wonder_ceremony|E]教会国家把祖先当作建筑来对待。每一份供品都在论证中再添一块石头：生者仍受有序死者监督。哀悼一旦被组织起来，便成了权威。"
 tv_engineering_department.471.a: "让祖先聚集。"
 tv_engineering_department.481.t: "[tv_wonder_ceremony|E]：领航员行会动工"
 tv_engineering_department.481.d: "领航员、制图者、绳索师与港务书记在灯塔下划定行会堂地基。他们带来海图、绳结、关于位次的争吵，以及那种能在坏天气里读懂海岸线的人特有的自信。信标必须等到这座机构立起后才算完整。单独一束光只能警示船只；行会则教会国家如何理解这份警示。[tv_wonder_ceremony|E]如今等待着头发里带盐味的官僚机构。"
 tv_engineering_department.481.a: "建设行会。"
 tv_engineering_department.491.t: "[tv_wonder_ceremony|E]：水神大祭开始"
 tv_engineering_department.491.d: "渠道被花环装点，水闸接受祝福，工坊为一整年的水神仪式放慢脚步。水被安排得仿佛听话，而任何见过洪水的人都知道，这是一项大胆的神学主张。生产必须弯折，复合体才能通过[tv_wonder_ceremony|e]取得神圣秩序。工程师看着祭司祝福他们宁愿检查的东西，祭司看着工程师测量他们宁愿圣化的东西。夹在二者之间，水仍继续流动。"
 tv_engineering_department.491.a: "让水流转。"
 tv_engineering_department.501.t: "[tv_wonder_ceremony|E]：深井排水开始"
 tv_engineering_department.501.d: "工程师将排水工程推进矿业都市深处。水泵、支架与沟渠征服地下前，矿井将近乎沉寂一年。矿工厌恶寂静几乎不亚于厌恶积水，但二者都必须忍受，才能索取更深处的财富。这里的[tv_wonder_ceremony|e]并不温柔；它是与黑暗、潮湿和耐心订立的契约。当工程终于吐息时，城市会知道自己能触及旧日恐惧之下多远。"
 tv_engineering_department.501.a: "排干黑暗。"
 tv_engineering_department.511.t: "[tv_wonder_ceremony|E]：星表编纂开始"
 tv_engineering_department.511.d: "观象台把自己封进灯火、表格和有纪律的无眠之中。天文学家逐颗记录星辰，不再把它们视作散乱光点，而是视作未来学者可以检验的公共秩序。宫廷把注意力借给天空和仪器时，立法也随之放慢。[tv_wonder_ceremony|e]今天不会以奇观喧嚣结束；它要等到诸天被足够耐心地抄录，变得真正有用。"
 tv_engineering_department.511.a: "让他们数清天空。"
 tv_engineering_department.521.t: "[tv_wonder_ceremony|E]：日食宣告开始"
 tv_engineering_department.521.d: "观象台已经发布预测：日食将至，宫廷将在恐惧先开口前说出它的名字。祭司、学者、水手和怀疑者如今都带着不同期待仰望天空。每一个月的流逝都在检验这项声明。若天空服从表格，[tv_wonder_ceremony|e]将证明国家能够读懂天象，而不必向天象屈服。"
 tv_engineering_department.521.a: "注视天穹。"
 tv_engineering_department.522.t: "[tv_wonder_ceremony|E]：日食降临"
 tv_engineering_department.522.d: "光线正如观象台所言开始改变。人群沉默下来，但这份沉默并非恐慌；传令官早已告诉他们学术表格所预言的一切。[tv_wonder_ceremony|e]在太阳、阴影与呼吸之间化作公共确信。光明重返时，宫廷不仅是在宣称智慧。它展示了时机、勇气，以及驾驭奇观本身的能力。"
 tv_engineering_department.522.a: "让国家记住这次预言。"
 tv_engineering_department.531.t: "[tv_wonder_ceremony|E]：贡礼送达"
 tv_engineering_department.531.d: "又一份附属贡礼进入万国宫城。它被仔细陈列：不只是财富，更是一套让每位使节在长廊中看见的等级论证。每一份献礼都会让贡礼长廊更有说服力，因为服从和荣耀一样，一旦拥有建筑，便更容易被相信。仪式随着一次次有度量的顺从向前推进。"
 tv_engineering_department.531.a: "记录贡礼。"
 tv_engineering_department.541.t: "[tv_wonder_ceremony|E]：常设使馆区动工"
 tv_engineering_department.541.d: "万国宫城旁的使馆区地基已经划定。外国馆舍将拥有门廊、庭院、仆役通道，以及外交从偶尔拜访变成日常存在所需的一切小小体面。[tv_wonder_ceremony|e]如今等待一片供他国宫廷居住的街区。宫殿能够命令注意；使馆区则教会注意留下。"
 tv_engineering_department.541.a: "为外国目光建造住处。"
 tv_engineering_department.500.t: "[tv_wonder_ceremony|E]：奇观落成"
 tv_engineering_department.500.d: "[tv_engineering_department|E]已经完成[tv_wonder_ceremony|e]，这座纪念碑如今成为国家野心的永久标志。脚手架已经撤去，账册已经封存，公众开始进行任何工程师都无法完成的工作：决定这座奇观究竟意味着什么。有人会称其为荣耀，有人会称其为奢靡，也有人会称其为时代已变的证明。所有人都必须看见它。这本身已经是一种胜利。"
 tv_engineering_department.500.a: "让时代记住它。"
 tv_engineering_department.600.t: "[tv_wonder_construction|E]：世界奇观落成"
 tv_engineering_department.600.d: "来自[SCOPE.sCountry('tv_wonder_builder_country').GetName]的消息传来：一座世界奇观已经在[SCOPE.sLocation('tv_wonder_completed_site').GetName]落成。关于它的花费、美感、用途与智慧，各方说法不一，但有一点无人否认：这项工程太大，已经不可能只属于当地。它进入了统治者们共同的谈话。"
 tv_engineering_department.600.a: "世界已经听见。"

