 tv_engineering_department.551.t: "[tv_wonder_ceremony|E]：学者齐聚"
 tv_engineering_department.551.d: "大学城进入一年的学者大会。教师、学生、抄写员与官员围绕课程和章程聚集，国家立法效率暂时下降。"
 tv_engineering_department.551.a: "让学者们拥有这一年。"
 tv_engineering_department.552.t: "[tv_wonder_ceremony|E]：学院大厅开工"
 tv_engineering_department.552.d: "学院大厅的图纸已经封存。它将给教师、学生与学术争辩一个永久住所。"
 tv_engineering_department.552.a: "建设学院大厅。"
 tv_engineering_department.561.t: "[tv_wonder_ceremony|E]：穹顶覆幕"
 tv_engineering_department.561.d: "大穹顶为祝圣而覆幕。宫廷接受一年的等待，让圣殿在慎重仪式中获得最终意义。"
 tv_engineering_department.561.a: "让穹顶得以祝圣。"
 tv_engineering_department.571.t: "[tv_wonder_ceremony|E]：朝圣阶梯开启"
 tv_engineering_department.571.d: "塔庙的阶梯交给朝圣者。工坊减速，劳力转向游行与攀登。"
 tv_engineering_department.571.a: "让他们攀登。"
 tv_engineering_department.572.t: "[tv_wonder_ceremony|E]：神庙学校开工"
 tv_engineering_department.572.d: "神庙学校在塔下奠基。课程、祈祷与抄本将把塔庙的影响带向日常。"
 tv_engineering_department.572.a: "建设学校。"
 tv_engineering_department.581.t: "[tv_wonder_ceremony|E]：河市节开始"
 tv_engineering_department.581.d: "摊棚、驳船和节旗沿拓宽河道聚集。贸易暂时放慢，以演练河流的新秩序。"
 tv_engineering_department.581.a: "让河流熟悉新的喧闹。"
 tv_engineering_department.582.t: "[tv_wonder_ceremony|E]：运河办公室开工"
 tv_engineering_department.582.d: "常设运河办公室开始建设。水闸、通行费、修缮和纠纷将拥有一个不能推脱责任的地址。"
 tv_engineering_department.582.a: "给河流一张书桌。"
 tv_engineering_department.591.t: "[tv_wonder_ceremony|E]：海军署办公室开工"
 tv_engineering_department.591.d: "船坞为海军署办公室划出土地。舰队需要的不只是船台，也需要海图、命令与行政。"
 tv_engineering_department.591.a: "建设办公室。"
 tv_engineering_department.601.t: "[tv_wonder_ceremony|E]：棱堡接受试验"
 tv_engineering_department.601.d: "星型要塞城开始一年的棱堡试验。生产放缓，角度、射界和城墙都将接受检验。"
 tv_engineering_department.601.a: "测试每一个角度。"
 tv_engineering_department.602.t: "[tv_wonder_ceremony|E]：军械城区开工"
 tv_engineering_department.602.d: "军械城区在要塞城内奠基。修理工坊、火药库和集结场将被组织成一个防御系统。"
 tv_engineering_department.602.a: "建设军械城区。"
 tv_engineering_department.611.t: "[tv_wonder_ceremony|E]：烽火点燃"
 tv_engineering_department.611.d: "长城沿线的哨所开始一年的烽火演练。贸易受扰，但边疆将学会用烟与火说话。"
 tv_engineering_department.611.a: "让烽火保持明亮。"
 tv_engineering_department.621.t: "[tv_wonder_ceremony|E]：大师甲匠厅开工"
 tv_engineering_department.621.d: "大师甲匠厅开始建设。军械库需要能在战场前发现失败的技艺。"
 tv_engineering_department.621.a: "为大师们建造。"
 tv_engineering_department.631.t: "[tv_wonder_ceremony|E]：国家目录开始"
 tv_engineering_department.631.d: "国家图书馆开始编制目录。学者关门工作，国家立法效率暂时下降。"
 tv_engineering_department.631.a: "让目录增长。"
 tv_engineering_department.632.t: "[tv_wonder_ceremony|E]：法定缴存办公室开工"
 tv_engineering_department.632.d: "法定缴存办公室在图书馆旁奠基。书籍、法令与抄本将因义务而被收集。"
 tv_engineering_department.632.a: "建设记忆的办公室。"
