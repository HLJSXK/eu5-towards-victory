 STATIC_MODIFIER_NAME_tv_wonder_ancestor_festival_modifier: "祖先祭仪"
 STATIC_MODIFIER_NAME_tv_wonder_water_festival_modifier: "水神大祭"
 tv_engineering_department.10.t: "大工程师逝世"
 tv_engineering_department.10.d: "我国的大工程师已经逝世。在任命继任者之前，工程部将缺少它的工程大师。"
 tv_engineering_department.10.a: "我们必须任命继任者。"
 tv_engineering_department.20.t: "奇观工程崩溃"
 tv_engineering_department.20.d: "国内支持度储备已经流失殆尽。宏大工程再也无法辩护，工程部只能放弃已锁定的奇观，并承担这份耻辱。"
 tv_engineering_department.20.a: "苦涩的结局。"
 tv_engineering_department.100.t: "贵族家族集结支持"
 tv_engineering_department.100.d: "几个贵族家族认定，奇观既能放大王国的记忆，也能放大他们自己的名望。他们的支持在宫廷中回响。"
 tv_engineering_department.100.a: "让他们站到众人面前。"
 tv_engineering_department.101.t: "贵族反弹"
 tv_engineering_department.101.d: "流言称奇观将吞噬贵族特权，却无法回报足够的荣誉。贵族中的支持开始动摇。"
 tv_engineering_department.101.a: "他们的骄傲代价不低。"
 tv_engineering_department.102.t: "市民看见机会"
 tv_engineering_department.102.d: "行会首领和金融家开始谈论合同、道路、仓库以及未来的人潮。他们的热情为辩论注入了新动力。"
 tv_engineering_department.102.a: "繁荣的声音很有说服力。"
 tv_engineering_department.103.t: "商人计算成本"
 tv_engineering_department.103.d: "一些市民警告说，奇观将占用劳力、信用和运输。他们的谨慎削弱了公众信心。"
 tv_engineering_department.103.a: "账簿也能像演说一样伤人。"
 tv_engineering_department.104.t: "教士祝福"
 tv_engineering_department.104.d: "有影响力的教士将奇观描述为秩序与虔敬的可见标志。辩论因此多了一层庄重而安心的语调。"
 tv_engineering_department.104.a: "有用的祝福。"
 tv_engineering_department.105.t: "反对奢靡的布道"
 tv_engineering_department.105.d: "布道者谴责该工程只是披着石材外衣的虚荣。这一指控在本已不安的人群中找到了听众。"
 tv_engineering_department.105.a: "信仰也能拒绝大理石。"
 tv_engineering_department.200.t: "一个奇观单元完工"
 tv_engineering_department.200.d: "奇观又有一段跨过了清晰可见的阈值。脚手架被撤下，监工标记完工单元，公众终于能看见那件不可能之事正在化作石材。"
 tv_engineering_department.200.a: "继续推进工程。"
 tv_engineering_department.201.t: "奇观拔地而起"
 tv_engineering_department.201.d: "奇观四个巨大部分都已经支撑起更高的共同等级。它看上去不再像一个承诺，而像一座纪念碑。"
 tv_engineering_department.201.a: "让全国都看见它。"
 tv_engineering_department.202.t: "奇观建设完成"
 tv_engineering_department.202.d: "工程部已经宣布建设阶段完成。物资集散地被拆除，劳工队伍撤离，而尚未回答的问题变成了：这座纪念碑将如何被献成。"
 tv_engineering_department.202.a: "准备仪式。"
 tv_engineering_department.300.t: "测绘完成"
 tv_engineering_department.300.d_high: "测绘带回了极佳读数。选定地点足以承载野心，物资能够抵达，工队也看见了穿过地形的路径。"
 tv_engineering_department.300.d_mid: "测绘带回了可用读数。这里不会让工程轻松无忧，但工程部已经能够围绕其限制制定方案。"
 tv_engineering_department.300.d_low: "测绘带回了令人不安的读数。此地仍可宣布为选址，但工程部警告说，其他地点也许更适合这座奇观。"
 tv_engineering_department.300.a: "审阅结果。"
 tv_engineering_department.310.t: "隐秘地基"
 tv_engineering_department.310.d: "测绘员在预定工地之下发现了稳固地层与古老石基。奇观可能达到的规模比最初估计更加宽裕。"
 tv_engineering_department.310.a: "很好。"
 tv_engineering_department.311.t: "险恶地面"
 tv_engineering_department.311.d: "最初地图承诺的稳固之处正在移位。额外支撑将压缩奇观的实际规模。"
 tv_engineering_department.311.a: "调整方案。"
 tv_engineering_department.312.t: "畅通补给线"
 tv_engineering_department.312.d: "测绘发现了能够更顺畅运输石料、木材和工具的路线。"
 tv_engineering_department.312.a: "仔细标注。"
 tv_engineering_department.313.t: "破碎通路"
 tv_engineering_department.313.d: "道路、水道与集结地都比最初报告更差。物流将更难驯服。"
 tv_engineering_department.313.a: "我们会补救。"
 tv_engineering_department.314.t: "野外秩序"
 tv_engineering_department.314.d: "测量队逐渐形成清晰节奏，将粗略观察转化为未来组织劳力的实用体系。"
 tv_engineering_department.314.a: "好习惯。"
 tv_engineering_department.315.t: "测绘混乱"
 tv_engineering_department.315.d: "相互矛盾的地图与彼此竞争的监工拖慢了工作。工程部对未来组织方案的信心有所下降。"
 tv_engineering_department.315.a: "理清它。"
 tv_engineering_department.320.t: "特殊仪器申请"
 tv_engineering_department.320.d: "测绘员申请昂贵仪器与专业匠人。资助他们应能改善规模评估。"
 tv_engineering_department.320.a: "为精度付款。"
 tv_engineering_department.320.b: "用现有条件将就。"
 tv_engineering_department.321.t: "专业声望"
 tv_engineering_department.321.d: "大工程师要求宫廷公开支持一种有争议的物流方法。借出国家声望也许能让补给方案更有说服力。"
 tv_engineering_department.321.a: "以我国名望背书。"
 tv_engineering_department.321.b: "不公开背书。"
 tv_engineering_department.322.t: "行会协调"
 tv_engineering_department.322.d: "城市供应者可以帮助统一测绘记录，但他们也期待因这份麻烦得到补偿。"
 tv_engineering_department.322.a: "倚重行会。"
 tv_engineering_department.322.b: "避免新的义务。"
 tv_engineering_department.401.t: "冥想开始"
 tv_engineering_department.401.d: "已完成的奇观被沉默笼罩。祭司、工程师与王室见证人暂时离开日常喧嚣，以一年苦修赋予纪念碑最终意义。"
 tv_engineering_department.401.a: "让这一年流逝。"
 tv_engineering_department.410.t: "使节邀请"
 tv_engineering_department.410.d: "邻近宫廷请求我们派遣使节，见证其宏伟轴线的落成。出席将让我国名列最先见证新纪念碑者之中。"
 tv_engineering_department.410.a: "派出使节。"
 tv_engineering_department.410.b: "拒绝邀请。"
 tv_engineering_department.411.t: "一位使节抵达"
 tv_engineering_department.411.d: "受邀宫廷已经接受。又一位外国使节加入仪式队列，奇观的仪式进度随之前进。"
 tv_engineering_department.411.a: "以礼接待。"
 tv_engineering_department.412.t: "邀请遭拒"
 tv_engineering_department.412.d: "受邀宫廷拒绝派遣使节。仪式必须从别处寻找观众。"
 tv_engineering_department.412.a: "邀请另一个邻国。"
 tv_engineering_department.421.t: "凯旋阅兵开始"
 tv_engineering_department.421.d: "旗帜已经沿着轴线升起，但阅兵仍缺少真正的证明。唯有战争胜利才能给予军事凯旋都市所需的凯旋。"
 tv_engineering_department.421.a: "那就取得胜利。"
 tv_engineering_department.431.t: "公民庆典开始"
 tv_engineering_department.431.d: "城市将秩序井然的广场开放给一整年的仪式、游戏、游行与公共教化。工坊放慢了脚步，但人民正在学习公民纪律的形状。"
 tv_engineering_department.431.a: "让市民集结。"
 tv_engineering_department.461.t: "自由贸易节开始"
 tv_engineering_department.461.d: "商人、使节与经纪人以开放交换的承诺填满港口。收入会暂时收紧，但这座港口将说出外国宫廷听得懂的语言。"
 tv_engineering_department.461.a: "开放码头。"
 tv_engineering_department.471.t: "祖先祭仪开始"
 tv_engineering_department.471.d: "陵墓园区进入了一整年的香烟、谱系与有序哀悼。工坊放慢脚步，国家则学习如何用石材记忆自身。"
 tv_engineering_department.471.a: "让祖先聚集。"
 tv_engineering_department.481.t: "领航员行会动工"
 tv_engineering_department.481.d: "领航员、制图者、绳索师与港务书记在灯塔下划定行会堂地基。信标必须等到这座机构立起后才算完整。"
 tv_engineering_department.481.a: "建设行会。"
 tv_engineering_department.491.t: "水神大祭开始"
 tv_engineering_department.491.d: "渠道被花环装点，水闸接受祝福，工坊为一整年的水神仪式放慢脚步。生产必须弯折，复合体才能取得神圣秩序。"
 tv_engineering_department.491.a: "让水流转。"
 tv_engineering_department.501.t: "深井排水开始"
 tv_engineering_department.501.d: "工程师将排水工程推进矿业都市深处。水泵、支架与沟渠征服地下前，矿井将近乎沉寂一年。"
 tv_engineering_department.501.a: "排干黑暗。"
 tv_engineering_department.500.t: "奇观落成"
 tv_engineering_department.500.d_sacred_1: "鲜血封圣了黄金圣域。王权如今通过这座神圣纪念碑发出光芒，震慑每一个见证者。"
 tv_engineering_department.500.d_sacred_2: "一年苦修完成了苦修圣山。它的沉默成为纪律与求知的学校。"
 tv_engineering_department.500.d_sacred_3: "内阁跪入新的神圣秩序。神权帝国中心成为教权权威的纪念碑。"
 tv_engineering_department.500.d_axis_1: "外国使节已经走过太阳王式荣耀轴线，在石材排列中见证了我国荣光。"
 tv_engineering_department.500.d_axis_2: "胜利给予军事凯旋都市真正凯旋。这座纪念碑如今属于士兵、旗帜与公众记忆。"
 tv_engineering_department.500.d_axis_3: "理性秩序之都已经完成公民庆典。即使人群散去，它的广场仍将教导服从。"
 tv_engineering_department.500.d_port_1: "黄金贸易港一场接一场地被财富买入传说，直到财富本身仿佛献成了港口。"
 tv_engineering_department.500.d_port_2: "重型战舰已经在帝国海军港前接受检阅。大海如今承认这座纪念碑的权威。"
 tv_engineering_department.500.d_port_3: "自由贸易都会已经完成开放交换的节庆。异国语言、合同与特权如今锚定了港口声望。"
 tv_engineering_department.500.d_necropolis_1: "统治者之死让巨型陵墓园区充满王朝意义。队列沉入墓道，生者家族从有序的死者那里汲取正统性。"
 tv_engineering_department.500.d_necropolis_2: "祖先祭仪以姓名、供品与静烟告终，并固定进圣祠。国家建起的不只是墓葬，也是一套与记忆对话的论证。"
 tv_engineering_department.500.d_necropolis_3: "寂静之地已经被永久划出。道路沉默，移民绕行，陵墓园区成为野心与静默之间的边界。"
 tv_engineering_department.500.d_lighthouse_1: "长明火在海上方燃起。它饥渴的光芒将索取木材，但船只已经把它视作第二颗星辰。"
 tv_engineering_department.500.d_lighthouse_2: "领航员行会在塔下开门，将航标、账册与领航知识转化为市民权力。灯塔如今以受训之声说话。"
 tv_engineering_department.500.d_lighthouse_3: "长夜守望已经占据邻近海域。信号从塔楼传向海面，直到缺席本身也成为国家可巡逻之物。"
 tv_engineering_department.500.d_hydraulic_1: "水神大祭在渠道恢复劳动的歌声中结束。工坊复合体如今将神圣水流引入市民安宁。"
 tv_engineering_department.500.d_hydraulic_2: "水利工匠行会得到承认，水利工程听命于训练有素的手。特权、机械与控制力锁在一起。"
 tv_engineering_department.500.d_hydraulic_3: "繁荣无需仪式便推动水轮。工坊的节奏成为当地建设本身的尺度。"
 tv_engineering_department.500.d_mining_1: "矿工誓言回荡在巷道与广场。权利被宣入石中，城市为了更深财富接受更硬的契约。"
 tv_engineering_department.500.d_mining_2: "王家铸币厂在矿脉闪光之处开门。金属离开土地，穿过权威，又以铸币形态回到国家。"
 tv_engineering_department.500.d_mining_3: "深井排水工程终于吐息。水从下层矿井退去，矿业都市学会触及旧日恐惧之下。"
 tv_engineering_department.500.d: "工程部已经完成奇观仪式，这座纪念碑如今成为国家野心的永久标志。"
 tv_engineering_department.500.a: "让时代记住它。"

