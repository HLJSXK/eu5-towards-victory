 MODIFIER_TYPE_DESC_tv_local_exhibition_add_artworks_price_cost_modifier: "Modifies the cost of committing more exhibits to a [tv_domestic_exhibition|e]."
 MODIFIER_TYPE_NAME_tv_local_exhibition_recruit_artist_price_cost_modifier: "Recruit Artists Cost"
 MODIFIER_TYPE_DESC_tv_local_exhibition_recruit_artist_price_cost_modifier: "Modifies the Prestige cost of recruiting artists for a [tv_domestic_exhibition|e]."
 MODIFIER_TYPE_NAME_tv_local_exhibition_designate_treasure_price_cost_modifier: "Designate Centerpiece Cost"
