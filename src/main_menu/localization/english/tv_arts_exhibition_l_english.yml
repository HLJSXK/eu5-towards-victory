l_english:
 # ── Arts Exhibition ───────────────────────────────────────────────────────────
 # IO type auto-derived keys (engine looks these up by the IO type name)
 tv_arts_exhibition: "Arts Exhibition"
 tv_arts_exhibition_desc: "An international forum for cultural exchange. Member nations send artists abroad and host exhibitions to grow their International Influence."
 diplomatic_status_tv_arts_exhibition_name: "Arts Exhibition Member"
 diplomatic_status_tv_arts_exhibition_tooltip: "This country is a member of the Arts Exhibition international organization."
 tv_arts_exhibition_list_who_tt: "Arts Exhibition members"
 io_opinion_tv_arts_exhibition: "Fellow Arts Exhibition Member"
 tv_cultural_diplomacy_opinion: "Cultural Diplomacy"
 tv_art_theft_opinion: "Art Theft Incident"
 STATIC_MODIFIER_NAME_tv_artistic_inspiration_modifier: "Artistic Inspiration"

 # Generic action names and descriptions
 tv_send_artist_abroad: "Send Artist Abroad"
 tv_send_artist_abroad_desc: "Dispatch one of your court artists to perform in a foreign city. The tour lasts one to ten years and may bring international renown to your realm."
 tv_host_domestic_exhibition: "Host Domestic Exhibition"
 tv_host_domestic_exhibition_desc: "Put your realm's collected artworks on grand public display. Each piece exhibited adds to your international renown."

 # Generic action tooltips
 tv_send_artist_abroad_cost_tt: "Costs 200 ducats (travel expenses)."
 tv_send_artist_abroad_requires_artist_tt: "Requires at least one available artist in your court."
 tv_host_domestic_exhibition_cost_tt: "Costs 1000 ducats (exhibition expenses)."

 # Select trigger labels
 tv_select_touring_artist: "Select an Artist"
 tv_select_touring_country: "Select Destination"
 tv_select_touring_location: "Select Exhibition Venue"
 tv_no_touring_artist_available: "@trigger_no! No artists are available for touring."
 tv_no_touring_country_available: "@trigger_no! No countries are available."
 tv_no_touring_location_available: "@trigger_no! No locations are available in that country."

 # Arts Exhibition events
 tv_arts_exhibition.10.t: "Artist Dispatched Abroad"
 tv_arts_exhibition.10.d.1: "Our artist has departed for their tour. Fate has dealt a short assignment — the exhibition is expected to last #bold 1 year#!."
 tv_arts_exhibition.10.d.2: "Our artist has departed for their tour. The exhibition is expected to last #bold 2 years#!."
 tv_arts_exhibition.10.d.3: "Our artist has departed for their tour. The exhibition is expected to last #bold 3 years#!."
 tv_arts_exhibition.10.d.4: "Our artist has departed for their tour. The exhibition is expected to last #bold 4 years#!."
 tv_arts_exhibition.10.d.5: "Our artist has departed for their tour. The exhibition is expected to last #bold 5 years#!."
 tv_arts_exhibition.10.d.6: "Our artist has departed for their tour. The exhibition is expected to last #bold 6 years#!."
 tv_arts_exhibition.10.d.7: "Our artist has departed for their tour. The exhibition is expected to last #bold 7 years#!."
 tv_arts_exhibition.10.d.8: "Our artist has departed for their tour. The exhibition is expected to last #bold 8 years#!."
 tv_arts_exhibition.10.d.9: "Our artist has departed for their tour. The exhibition is expected to last #bold 9 years#!."
 tv_arts_exhibition.10.d.10: "Our artist has departed for their tour. Fate has dealt a long assignment — the exhibition is expected to last #bold 10 years#!."
 tv_arts_exhibition.10.d.default: "Our artist has departed for their tour abroad. The exhibition is now underway."
 tv_arts_exhibition.10.a: "We await their return."

 tv_arts_exhibition.1.t: "Grand Domestic Exhibition"
 tv_arts_exhibition.1.d: "We have thrown open the doors of our greatest halls to display the collected masterworks of our realm. Crowds of nobles, merchants, and clergy have gathered to witness the achievement of our artists."
 tv_arts_exhibition.1.a: "The world shall know our cultural glory."
 tv_arts_exhibition.1.tt: "Each work of art in the realm contributes +0.1 International Influence."

 tv_arts_exhibition.5.t: "Artist Returns from Abroad"
 tv_arts_exhibition.5.d: "One of our artists has concluded their tour abroad and returned home, carrying new experiences and a broadened perspective from their time in a foreign court."
 tv_arts_exhibition.5.a: "Welcome home."

 tv_arts_exhibition.6.t: "Artist Died Abroad"
 tv_arts_exhibition.6.d: "Tragic news has reached us from afar: one of our artists, sent to perform in a foreign land, has passed away before they could return home."
 tv_arts_exhibition.6.a: "A great loss for the arts."

 tv_arts_exhibition.101.t: "Exhibition: A Modest Reception"
 tv_arts_exhibition.101.d: "Reports reach us that our touring artist's performance was received with polite interest. A small measure of international attention has nonetheless been gained."
 tv_arts_exhibition.101.a: "At least they are noticed."
 tv_arts_exhibition.101.effect_tt: "International Influence: #G +0.1#!"

 tv_arts_exhibition.102.t: "Exhibition: A Triumph!"
 tv_arts_exhibition.102.d: "Word has arrived of a spectacular success abroad. Our touring artist's work has captivated the foreign court, and word of our realm's artistic brilliance is spreading across borders."
 tv_arts_exhibition.102.a: "Our name resounds in distant halls."
 tv_arts_exhibition.102.effect_tt: "International Influence: #G +0.5#!"

 tv_arts_exhibition.103.t: "Exhibition: A Humiliation"
 tv_arts_exhibition.103.d: "Mortifying reports have arrived: our touring artist's performance was met with scorn and mockery. The embarrassment has done some damage to our reputation abroad."
 tv_arts_exhibition.103.a: "We shall not speak of this again."
 tv_arts_exhibition.103.effect_tt: "International Influence: #R -0.1#!"

 tv_arts_exhibition.104.t: "Artist Retained by Foreign Court!"
 tv_arts_exhibition.104.d: "Our touring artist has so impressed their hosts that the foreign court has offered them a permanent position. Though we lose a fine talent, the prestige of this recognition reaches far and wide."
 tv_arts_exhibition.104.a: "A bittersweet honour."
 tv_arts_exhibition.104.effect_tt: "International Influence: #G +1.0#! — The artist has been permanently retained abroad."

 tv_arts_exhibition.105.t: "Artist Finds New Inspiration"
 tv_arts_exhibition.105.d: "Exposure to a foreign culture has unlocked something extraordinary in our touring artist. Their technique has evolved in ways that would never have been possible at home."
 tv_arts_exhibition.105.a: "Art transcends borders."
 tv_arts_exhibition.105.effect_tt: "The touring artist gains #bold Artistic Inspiration#! (#G +10% Artist Skill Gain#!) for 10 years."

 # ── Monthly Special Events (201-205) ─────────────────────────────────────
 tv_arts_exhibition.201.t: "A Bridge of Cultures"
 tv_arts_exhibition.201.d: "Our touring artist's presence abroad has done more than display our works — it has opened hearts. The foreign court speaks warmly of our realm, and we reciprocate the sentiment."
 tv_arts_exhibition.201.a: "Art builds what diplomacy cannot."
 tv_arts_exhibition.201.effect_tt: "#G +20 opinion#! with the host country (decays over time). They gain the same towards us."

 tv_arts_exhibition.202.t: "The Exhibition Captivates a City"
 tv_arts_exhibition.202.d: "Our artist's works have transformed the host city. Visitors flock from the surrounding countryside to witness the display, bringing new life and commerce to the streets."
 tv_arts_exhibition.202.a: "Let the city flourish."
 tv_arts_exhibition.202.effect_tt: "The exhibition location gains a 5-year modifier: #G +2 Migration Attraction#!, #G -20% Unrest#!, #R -20% Production Efficiency#! (as workers take time off to attend)."

 tv_arts_exhibition.203.t: "A Noble Patron Emerges"
 tv_arts_exhibition.203.d: "So moved by our artist's performance, a wealthy noble of the host court has commissioned a grand theater to be built at the exhibition site — a lasting monument to our cultural reach."
 tv_arts_exhibition.203.a: "Our art leaves its mark in stone."
 tv_arts_exhibition.203.effect_tt: "A #bold Theater#! is constructed at the exhibition location at no cost."

 tv_arts_exhibition.204.t: "An Exchange of Masters"
 tv_arts_exhibition.204.d: "Our touring artist and a local master have spent weeks studying each other's techniques. Both have emerged with refined skills that neither could have achieved alone."
 tv_arts_exhibition.204.a: "The greatest art knows no borders."
 tv_arts_exhibition.204.effect_tt: "Our touring artist and a local artist each gain #G +0.05 Artist Skill#! permanently."

 tv_arts_exhibition.205.t: "Scandal Abroad: Theft and Tragedy"
 tv_arts_exhibition.205.d: "Catastrophe. Our artist, apparently overwhelmed by the foreign works, attempted to steal a masterpiece from the host court. Caught in the act, they died in the ensuing confrontation. The artwork is destroyed, and our name is tarnished."
 tv_arts_exhibition.205.a: "A dark day for our realm."
 tv_arts_exhibition.205.effect_tt: "The touring artist has #R died#!. A host-country artwork is #R destroyed#!. The host country gains #R -20 permanent opinion#! towards us."

 # ── Return Special Events (120-124) ──────────────────────────────────────
 tv_arts_exhibition.120.t: "A Souvenir Returns Home"
 tv_arts_exhibition.120.d: "Our artist returns — and not empty-handed. Among their baggage is a work of art from the host court, which they claim was gifted to them. Whether truly given or quietly acquired, it now graces our halls."
 tv_arts_exhibition.120.a: "A fine addition to our collection."

 tv_arts_exhibition.121.t: "Homecoming: A New Masterpiece"
 tv_arts_exhibition.121.d: "The journey has transformed our artist. Barely home before picking up the brush again, they have produced a new work of remarkable depth and beauty — a testament to what they witnessed abroad."
 tv_arts_exhibition.121.a: "Let us celebrate their return."

 tv_arts_exhibition.122.t: "Homecoming: Foreign Insights"
 tv_arts_exhibition.122.d: "Our artist returns carrying more than memories. Observations of foreign techniques, written in careful notes, have provided our scholars with fresh ideas that will accelerate the pace of our own inquiries."
 tv_arts_exhibition.122.a: "Knowledge, too, travels."

 tv_arts_exhibition.123.t: "Homecoming: An Artist at Rest"
 tv_arts_exhibition.123.d: "Our artist returns home aged but fulfilled. The long years abroad have taken their toll, and they pass away quietly in their homeland, their legacy preserved in the works they left behind."
 tv_arts_exhibition.123.a: "May they rest in peace."

 tv_arts_exhibition.124.t: "Homecoming: A Generous Farewell"
 tv_arts_exhibition.124.d: "The host court sends our artist home with warm words and a generous purse — a token of gratitude for the cultural exchange that brightened their halls for so many years."
 tv_arts_exhibition.124.a: "A gracious parting gift."

