 tv_local_exhibition_add_artworks_allow_tt: "Requires enough uncommitted owned artworks for the next exhibit tranche."
 TV_HAS_LOCAL_EXHIBITION_EXPAND_TARGET_TT: "An owned neighboring location can be added to the exhibition."
 TV_ARTS_EXCHANGE_REQUIRES_TWO_ARTISTS_TT: "Requires at least two living artists in court."
 tv_chief_artist_busy_with_law_change_tt: "The [tv_chief_artist|E] is busy revising [tv_arts_exhibition|e] laws."
 tv_chief_artist_busy_with_arts_exchange_tt: "The [tv_chief_artist|E] is busy hosting an [tv_arts_exchange|e]."
 tv_chief_artist_busy_with_domestic_exhibition_tt: "The [tv_chief_artist|E] is busy hosting a [tv_domestic_exhibition|e]."

