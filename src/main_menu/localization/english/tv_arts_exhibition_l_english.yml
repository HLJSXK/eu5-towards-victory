 # Arts Exhibition events
 tv_arts_exhibition.10.t: "Artist Dispatched Abroad"
 tv_arts_exhibition.10.d.1: "Our artist has departed for their tour. Fate has dealt a short assignment — the exhibition is expected to last #bold 1 year#!."
 tv_arts_exhibition.10.d.2: "Our artist has departed for their tour. The exhibition is expected to last #bold 2 years#!."
 tv_arts_exhibition.10.d.3: "Our artist has departed for their tour. The exhibition is expected to last #bold 3 years#!."
 tv_arts_exhibition.10.d.4: "Our artist has departed for their tour. The exhibition is expected to last #bold 4 years#!."
 tv_arts_exhibition.10.d.5: "Our artist has departed for their tour. The exhibition is expected to last #bold 5 years#!."
 tv_arts_exhibition.10.d.6: "Our artist has departed for their tour. The exhibition is expected to last #bold 6 years#!."
 tv_arts_exhibition.10.d.7: "Our artist has departed for their tour. The exhibition is expected to last #bold 7 years#!."
 tv_arts_exhibition.10.d.8: "Our artist has departed for their tour. The exhibition is expected to last #bold 8 years#!."
 tv_arts_exhibition.10.d.9: "Our artist has departed for their tour. The exhibition is expected to last #bold 9 years#!."
 tv_arts_exhibition.10.d.10: "Our artist has departed for their tour. Fate has dealt a long assignment — the exhibition is expected to last #bold 10 years#!."
 tv_arts_exhibition.10.d.default: "Our artist has departed for their tour abroad. The exhibition is now underway."
 tv_arts_exhibition.10.a: "We await their return."

 tv_arts_exhibition.1.t: "Grand Domestic Exhibition"
 tv_arts_exhibition.1.d: "The doors are open. Tapestries have been lowered into torchlight, reliquaries polished, manuscripts turned to their brightest pages, and the first visitors already crowd the hall. For as long as public wonder can be kept alive, this exhibition will test the realm's taste, purse, and patience."
 tv_arts_exhibition.1.a: "Let them come and marvel."
 tv_arts_exhibition.1.tt: "[tv_domestic_exhibition|E] has begun."

 tv_arts_exhibition.5.t: "Artist Returns from Abroad"
 tv_arts_exhibition.5.d: "One of our artists has concluded their tour abroad and returned home, carrying new experiences and a broadened perspective from their time in a foreign court."
 tv_arts_exhibition.5.a: "Welcome home."

 tv_arts_exhibition.6.t: "Artist Died Abroad"
 tv_arts_exhibition.6.d: "Tragic news has reached us from afar: one of our artists, sent to perform in a foreign land, has passed away before they could return home."
 tv_arts_exhibition.6.a: "A great loss for the arts."

 tv_arts_exhibition.7.t: "Chief Artist Has Died"
 tv_arts_exhibition.7.d: "Our Chief Artist has passed away. The position is now vacant; the Arts Exhibition will continue without a Chief Artist until we appoint a successor."
 tv_arts_exhibition.7.a: "We must find a new Chief Artist."

 tv_arts_exhibition.8.t: "Chief Artist Sent Abroad"
 tv_arts_exhibition.8.d: "Our Chief Artist has departed for a foreign tour. With their duties now carrying them far from court, they can no longer serve as the realm's Chief Artist. The position is vacant until we appoint a successor."
 tv_arts_exhibition.8.a: "We shall appoint a successor in time."

 tv_arts_exhibition.101.t: "Exhibition: A Modest Reception"
 tv_arts_exhibition.101.d: "Reports reach us that our touring artist's performance was received with polite interest. A small measure of international attention has nonetheless been gained."
 tv_arts_exhibition.101.a: "At least they are noticed."

 tv_arts_exhibition.102.t: "Exhibition: A Triumph!"
 tv_arts_exhibition.102.d: "Word has arrived of a spectacular success abroad. Our touring artist's work has captivated the foreign court, and word of our realm's artistic brilliance is spreading across borders."
 tv_arts_exhibition.102.a: "Our name resounds in distant halls."

 tv_arts_exhibition.103.t: "Exhibition: A Humiliation"
 tv_arts_exhibition.103.d: "Mortifying reports have arrived: our touring artist's performance was met with scorn and mockery. The embarrassment has done some damage to our reputation abroad."
 tv_arts_exhibition.103.a: "We shall not speak of this again."

 tv_arts_exhibition.104.t: "Artist Retained by Foreign Court!"
 tv_arts_exhibition.104.d: "Our touring artist has so impressed their hosts that the foreign court has offered them a permanent position. Though we lose a fine talent, the prestige of this recognition reaches far and wide."
 tv_arts_exhibition.104.a: "A bittersweet honour."

 tv_arts_exhibition.105.t: "Artist Finds New Inspiration"
 tv_arts_exhibition.105.d: "Exposure to a foreign culture has unlocked something extraordinary in our touring artist. Their technique has evolved in ways that would never have been possible at home."
 tv_arts_exhibition.105.a: "Art transcends borders."

 # ── Monthly Special Events (201-205) ─────────────────────────────────────
 tv_arts_exhibition.201.t: "A Bridge of Cultures"
 tv_arts_exhibition.201.d: "Our touring artist's presence abroad has done more than display our works — it has opened hearts. The foreign court speaks warmly of our realm, and we reciprocate the sentiment."
 tv_arts_exhibition.201.a: "Art builds what diplomacy cannot."

 tv_arts_exhibition.202.t: "The Exhibition Captivates a City"
 tv_arts_exhibition.202.d: "Our artist's works have transformed the host city. Visitors flock from the surrounding countryside to witness the display, bringing new life and commerce to the streets."
 tv_arts_exhibition.202.a: "Let the city flourish."

 tv_arts_exhibition.203.t: "A Noble Patron Emerges"
 tv_arts_exhibition.203.d: "So moved by our artist's performance, a wealthy noble of the host court has commissioned a grand theater to be built at the exhibition site — a lasting monument to our cultural reach."
 tv_arts_exhibition.203.a: "Our art leaves its mark in stone."

 tv_arts_exhibition.204.t: "An Exchange of Masters"
 tv_arts_exhibition.204.d: "Our touring artist and a local master have spent weeks studying each other's techniques. Both have emerged with refined skills that neither could have achieved alone."
 tv_arts_exhibition.204.a: "The greatest art knows no borders."

 tv_arts_exhibition.205.t: "Scandal Abroad: Theft and Tragedy"
 tv_arts_exhibition.205.d: "Catastrophe. Our artist, apparently overwhelmed by the foreign works, attempted to steal a masterpiece from the host court. Caught in the act, they died in the ensuing confrontation. The artwork is destroyed, and our name is tarnished."
 tv_arts_exhibition.205.a: "A dark day for our realm."

 # ── Return Special Events (120-124) ──────────────────────────────────────
 tv_arts_exhibition.120.t: "A Souvenir Returns Home"
 tv_arts_exhibition.120.d: "Our artist returns — and not empty-handed. Among their baggage is a work of art from the host court, which they claim was gifted to them. Whether truly given or quietly acquired, it now graces our halls."
 tv_arts_exhibition.120.a: "A fine addition to our collection."

 tv_arts_exhibition.121.t: "Homecoming: A New Masterpiece"
 tv_arts_exhibition.121.d: "The journey has transformed our artist. Barely home before picking up the brush again, they have produced a new work of remarkable depth and beauty — a testament to what they witnessed abroad."
 tv_arts_exhibition.121.a: "Let us celebrate their return."

 tv_arts_exhibition.122.t: "Homecoming: Foreign Insights"
 tv_arts_exhibition.122.d: "Our artist returns carrying more than memories. Observations of foreign techniques, written in careful notes, have provided our scholars with fresh ideas that will accelerate the pace of our own inquiries."
 tv_arts_exhibition.122.a: "Knowledge, too, travels."

 tv_arts_exhibition.123.t: "Homecoming: An Artist at Rest"
 tv_arts_exhibition.123.d: "Our artist returns home aged but fulfilled. The long years abroad have taken their toll, and they pass away quietly in their homeland, their legacy preserved in the works they left behind."
 tv_arts_exhibition.123.a: "May they rest in peace."

 tv_arts_exhibition.124.t: "Homecoming: A Generous Farewell"
 tv_arts_exhibition.124.d: "The host court sends our artist home with warm words and a generous purse — a token of gratitude for the cultural exchange that brightened their halls for so many years."
 tv_arts_exhibition.124.a: "A gracious parting gift."

 # ── Local Exhibition Events ───────────────────────────────────────────────
 tv_arts_exhibition.310.t: "The Exhibition Fades"
 tv_arts_exhibition.310.d: "The crowds thin, the lamps burn low, and the attendants begin covering the works before the final visitors have even left. The exhibition lasted [ROOT.GetVariable('tv_local_exhibition_last_duration').GetValue|0] months and produced [ROOT.GetVariable('tv_local_exhibition_last_reward').GetValue|0] [tv_cip|e], but its muted reception costs us 10 Prestige."
 tv_arts_exhibition.310.a: "A costly lesson in taste."
 tv_arts_exhibition.311.t: "A Worthy Exhibition"
 tv_arts_exhibition.311.d: "The exhibition has run its course after [ROOT.GetVariable('tv_local_exhibition_last_duration').GetValue|0] months. It never became a legend, yet its halls stayed alive long enough to leave a visible mark: [ROOT.GetVariable('tv_local_exhibition_last_reward').GetValue|0] [tv_cip|e]."
 tv_arts_exhibition.311.a: "A respectable achievement."
 tv_arts_exhibition.312.t: "An Exhibition Remembered"
 tv_arts_exhibition.312.d: "For [ROOT.GetVariable('tv_local_exhibition_last_duration').GetValue|0] months, the exhibition drew patrons, critics, and imitators. Its reputation now travels beyond the host city, granting [ROOT.GetVariable('tv_local_exhibition_last_reward').GetValue|0] [tv_cip|e] and 10 Prestige."
 tv_arts_exhibition.312.a: "Our halls have spoken well of us."
 tv_arts_exhibition.313.t: "A Triumph of the Arts"
 tv_arts_exhibition.313.d: "The exhibition endured for [ROOT.GetVariable('tv_local_exhibition_last_duration').GetValue|0] months and became a marvel in its own right. Its closing is less an end than a procession: [ROOT.GetVariable('tv_local_exhibition_last_reward').GetValue|0] [tv_cip|e], 15 Prestige, and lasting prosperity for the host location."
 tv_arts_exhibition.313.a: "This will be remembered."

 tv_arts_exhibition.320.t: "A Hall Without Enough Gold"
 tv_arts_exhibition.320.d: "The master of ceremonies warns that musicians, guards, lanterns, and restorers cannot be paid with applause. A purse opened now would keep the evening alive."
 tv_arts_exhibition.320.a: "Pay what the hall requires."
 tv_arts_exhibition.320.b: "Let the evening shrink."
 tv_arts_exhibition.321.t: "The Critics Demand a Gesture"
 tv_arts_exhibition.321.d: "Poets and connoisseurs whisper that a true patron would dedicate the exhibition more boldly. A public concession of prestige could turn their sharp tongues into trumpets."
 tv_arts_exhibition.321.a: "Let reputation be spent for reputation."
 tv_arts_exhibition.321.b: "They may whisper."
 tv_arts_exhibition.322.t: "Noble Seats Stand Empty"
 tv_arts_exhibition.322.d: "Several noble houses dislike the seating order, the invitations, or perhaps merely one another. A private apology would sour noble satisfaction, but restore the glittering front row."
 tv_arts_exhibition.322.a: "Placate the nobles."
 tv_arts_exhibition.322.b: "Their absence will be noticed."
 tv_arts_exhibition.323.t: "A Sermon Against Vanity"
 tv_arts_exhibition.323.d: "A prominent cleric warns that beauty without humility is a polished road to sin. A carefully worded concession could quiet the pulpit and bring the faithful back through the doors."
 tv_arts_exhibition.323.a: "Soothe the clergy."
 tv_arts_exhibition.323.b: "The paintings will answer."
 tv_arts_exhibition.324.t: "Merchants Count the Stalls"
 tv_arts_exhibition.324.d: "The burghers who supplied frames, pigments, benches, and printed notices now demand better terms. Yielding to them will cost satisfaction, but keep the market around the exhibition lively."
 tv_arts_exhibition.324.a: "Make terms with the burghers."
 tv_arts_exhibition.324.b: "The fair can do without them."
 tv_arts_exhibition.325.t: "Crowds at the Gates"
 tv_arts_exhibition.325.d: "Common visitors grumble that the exhibition belongs more to velvet sleeves than rough hands. Opening extra viewing hours would anger local notables and strain the peasants, but it would revive public warmth."
 tv_arts_exhibition.325.a: "Make room for the common crowd."
 tv_arts_exhibition.325.b: "The gates remain as they are."
 tv_arts_exhibition.326.t: "A Question of Order"
 tv_arts_exhibition.326.d: "Pamphlets praising the exhibition now praise too much else: new manners, new freedoms, new truths. A small sacrifice of stability could let the fervor burn without interruption."
 tv_arts_exhibition.326.a: "Permit the ferment."
 tv_arts_exhibition.326.b: "Dampen the talk."
 tv_arts_exhibition.327.t: "A Doubt Cast on the Crown"
 tv_arts_exhibition.327.d: "Some courtiers argue that the exhibition has become a court within the court, a place where taste outranks birth. A royal concession would hurt legitimacy, but turn scandal back into spectacle."
 tv_arts_exhibition.327.a: "The crown can bend for beauty."
 tv_arts_exhibition.327.b: "The crown does not bend."
 tv_arts_exhibition.328.t: "The Host City Gives Stone"
 tv_arts_exhibition.328.d: "The host location can expand the exhibition only by surrendering workshops, yards, and useful rooms to galleries and promenades. Development will suffer, but enthusiasm will surge."
 tv_arts_exhibition.328.a: "Turn stone into splendor."
 tv_arts_exhibition.328.b: "Preserve the city as it is."
 tv_arts_exhibition.329.t: "Prosperity Spent in Festival"
 tv_arts_exhibition.329.d: "The exhibition could become a citywide celebration if local stores, guilds, and households carried the burden. Prosperity would be spent like oil in a lamp."
 tv_arts_exhibition.329.a: "Let the city burn bright."
 tv_arts_exhibition.329.b: "Do not spend the city's good fortune."

 tv_arts_exhibition.340.t: "The Ruler Sees Clearly"
 tv_arts_exhibition.340.d: "Before a crowded hall, the ruler pauses before a difficult work and speaks with unexpected precision. The court hears not a memorized compliment, but judgment."
 tv_arts_exhibition.340.a: "A sharper eye makes a sharper crown."
 tv_arts_exhibition.341.t: "A Royal Misstep"
 tv_arts_exhibition.341.d: "The ruler lingers before the wrong piece, praises the wrong hand, and asks a question that no one can answer without embarrassment. The hall remembers."
 tv_arts_exhibition.341.a: "Even silence would have been kinder."
 tv_arts_exhibition.342.t: "The Crown Applauded"
 tv_arts_exhibition.342.d: "The ruler's visit becomes a tableau of harmony: crown, art, and people gathered beneath the same painted ceiling."
 tv_arts_exhibition.342.a: "Legitimacy shines in public light."
 tv_arts_exhibition.343.t: "The Crown Mocked"
 tv_arts_exhibition.343.d: "Satirists seize upon the royal visit before the candles have gone cold. What was meant as patronage becomes material for laughter."
 tv_arts_exhibition.343.a: "A crown is heavy in a crowded room."
 tv_arts_exhibition.350.t: "The Radical Manifesto"
 tv_arts_exhibition.350.d: "The new declaration tears through custom like a blade through canvas. The young cheer, the old recoil, and the state itself trembles."
 tv_arts_exhibition.350.a: "Let art disturb the world."
 tv_arts_exhibition.351.t: "A Fresh Fashion"
 tv_arts_exhibition.351.d: "What sounded dangerous yesterday is suddenly fashionable today. The hall fills with people eager to say they understood it first."
 tv_arts_exhibition.351.a: "Novelty has found its hour."
 tv_arts_exhibition.352.t: "The Public Turns Away"
 tv_arts_exhibition.352.d: "The rhetoric outruns the art. Visitors leave puzzled, patrons leave offended, and enthusiasm cools."
 tv_arts_exhibition.352.a: "The edge cut the wrong way."
 tv_arts_exhibition.353.t: "A Work Destroyed"
 tv_arts_exhibition.353.d: "In the confusion of performance, protest, and applause, one artwork is ruined beyond recovery. No manifesto can restore it."
 tv_arts_exhibition.353.a: "The price of excess."
 tv_arts_exhibition.354.t: "A Modest New Artist"
 tv_arts_exhibition.354.d: "The call for artists is answered by a diligent hand: not a genius, perhaps, but one who knows how to work and listen."
 tv_arts_exhibition.354.a: "There is room in the workshop."
 tv_arts_exhibition.355.t: "A Brilliant Arrival"
 tv_arts_exhibition.355.d: "A rare talent arrives almost without warning, carrying sketches and confidence in equal measure. The court can feel the room change."
 tv_arts_exhibition.355.a: "Give them space and patronage."
 tv_arts_exhibition.356.t: "No One Answers"
 tv_arts_exhibition.356.d: "Messengers return with polite refusals, stale excuses, and the silence of artists already employed elsewhere."
 tv_arts_exhibition.356.a: "The empty studio says enough."
 tv_arts_exhibition.360.t: "An Invitation from Abroad"
 tv_arts_exhibition.360.d: "[SCOPE.sCountry('inviting_country').GetName] invites [SCOPE.sCharacter('guest_artist').GetShortName] to attend its [tv_domestic_exhibition|e] as a guest artist. Accepting would send them abroad until that exhibition closes and grant us 10 Prestige."
 tv_arts_exhibition.360.a: "Let art travel."
 tv_arts_exhibition.360.b: "They remain here."
 tv_arts_exhibition.361.t: "The Invitation Accepted"
 tv_arts_exhibition.361.d: "Our invitation has been accepted. The foreign artist has arrived amid greetings, curiosity, and a pleasant surge of public attention."
 tv_arts_exhibition.361.a: "A welcome guest."
 tv_arts_exhibition.362.t: "The Invitation Refused"
 tv_arts_exhibition.362.d: "Our invitation has been declined. The exhibition will have to make do with its own voices."
 tv_arts_exhibition.362.a: "So be it."
 tv_arts_exhibition.363.t: "Guest Artist Returns"
 tv_arts_exhibition.363.d: "The foreign exhibition has closed, and our artist has returned with travel dust, stories, and a few useful observations."
 tv_arts_exhibition.363.a: "Welcome home."
 tv_arts_exhibition.370.t: "A Hand Refined"
 tv_arts_exhibition.370.d: "Before the crowd, one artist discovers a clearer line, a better rhythm, a more exacting discipline."
 tv_arts_exhibition.370.a: "Practice has become revelation."
 tv_arts_exhibition.371.t: "A Hand Shaken"
 tv_arts_exhibition.371.d: "The noise of the contest proves cruel. One artist leaves the floor less certain than before."
 tv_arts_exhibition.371.a: "Public judgment can wound."
 tv_arts_exhibition.372.t: "The Crowd Leans In"
 tv_arts_exhibition.372.d: "Brushes move, chisels bite, ink darkens, and the audience forgets to breathe. Enthusiasm rises simply from watching creation happen."
 tv_arts_exhibition.372.a: "This is why they came."
 tv_arts_exhibition.373.t: "A Final Masterwork"
 tv_arts_exhibition.373.d: "One artist gives everything to the contest, completing a new work before collapsing beyond recovery. The hall receives both creation and grief."
 tv_arts_exhibition.373.a: "May the work carry their name."
 tv_arts_exhibition.374.t: "A Work Born in Public"
 tv_arts_exhibition.374.d: "The contest produces a new artwork before the eyes of the crowd, still raw with the heat of its making."
 tv_arts_exhibition.374.a: "Place it among the collection."

 tv_arts_exhibition.400.t: "Domestic Artists Join the Exchange"
 tv_arts_exhibition.400.d.3: "The Arts Exchange has found its rhythm. Invitations have gone out to [SCOPE.sCharacter('tv_arts_exchange_auto_invite_1_scope').GetShortName], [SCOPE.sCharacter('tv_arts_exchange_auto_invite_2_scope').GetShortName], and [SCOPE.sCharacter('tv_arts_exchange_auto_invite_3_scope').GetShortName], who will join the Chief Artist at the gathering."
 tv_arts_exhibition.400.d.2: "The Arts Exchange has found its rhythm. Invitations have gone out to [SCOPE.sCharacter('tv_arts_exchange_auto_invite_1_scope').GetShortName] and [SCOPE.sCharacter('tv_arts_exchange_auto_invite_2_scope').GetShortName], who will join the Chief Artist at the gathering."
 tv_arts_exhibition.400.d.1: "The Arts Exchange has found its rhythm. An invitation has gone out to [SCOPE.sCharacter('tv_arts_exchange_auto_invite_1_scope').GetShortName], who will join the Chief Artist at the gathering."
 tv_arts_exhibition.400.d.0: "The Arts Exchange has found its rhythm, but no suitable domestic artist is currently available for an automatic invitation."
 tv_arts_exhibition.400.a: "Let the conversation widen."

 tv_arts_exhibition.401.t: "Joyful Exchange of Technique"
 tv_arts_exhibition.401.d: "[SCOPE.sCharacter('tv_arts_exchange_artist_1').GetShortName] and [SCOPE.sCharacter('tv_arts_exchange_artist_2').GetShortName] spend long hours comparing methods, correcting gestures, and laughing over old mistakes."
 tv_arts_exhibition.401.a: "Let them keep each other honest."
 tv_arts_exhibition.402.t: "A Moment of Insight"
 tv_arts_exhibition.402.d: "[SCOPE.sCharacter('tv_arts_exchange_artist_1').GetShortName] draws more from the exchange than anyone expected, turning stray comments into a sharper hand and clearer eye."
 tv_arts_exhibition.402.a: "A single spark is enough."
 tv_arts_exhibition.403.t: "A Master Leads the Room"
 tv_arts_exhibition.403.d: "[SCOPE.sCharacter('tv_arts_exchange_leading_artist').GetShortName]'s exceptional technique becomes the center of the meeting. The others study every motion."
 tv_arts_exhibition.403.a: "Let every hand study the master."
 tv_arts_exhibition.404.t: "A Feast Too Far"
 tv_arts_exhibition.404.d: "[SCOPE.sCharacter('tv_arts_exchange_artist_1').GetShortName] discovers that the exchange table is also very well supplied, and not all excess leads to inspiration."
 tv_arts_exhibition.404.a: "Perhaps the table was too generous."
 tv_arts_exhibition.405.t: "Praise from Abroad"
 tv_arts_exhibition.405.d: "[SCOPE.sCharacter('tv_arts_exchange_foreign_artist').GetShortName] praises the Arts Exchange as a gathering of rare quality. Word of the compliment spreads quickly."
 tv_arts_exhibition.405.a: "Let the praise travel further."
 tv_arts_exhibition.406.t: "A Masterpiece Before All"
 tv_arts_exhibition.406.d: "Under the eyes of the assembled artists, [SCOPE.sCharacter('tv_arts_exchange_masterpiece_artist').GetShortName] creates a work that seems destined to outlive the meeting itself."
 tv_arts_exhibition.406.a: "Give the work pride of place."
 tv_arts_exhibition.407.t: "The Capital Comes Alive"
 tv_arts_exhibition.407.d: "The capital's halls, workshops, and salons glow with the exchange's energy. Even those outside the meeting feel that the realm's culture has deepened."
 tv_arts_exhibition.407.a: "The city will remember this season."
 tv_arts_exhibition.408.t: "A Folk Artist Pushes In"
 tv_arts_exhibition.408.d: "A folk artist slips through the crowd and refuses to leave. Their manners are rough, their skill unpredictable, and their confidence impossible to ignore."
 tv_arts_exhibition.408.a: "Recruit them and let them join."
 tv_arts_exhibition.409.t: "The King Is Drawn In"
 tv_arts_exhibition.409.d: "The ruler's curiosity brings them to the exchange, where argument, performance, and cultivated wit sharpen their diplomatic instincts."
 tv_arts_exhibition.409.a: "Let the crown listen and learn."
 tv_arts_exhibition.410.t: "Arguments Without End"
 tv_arts_exhibition.410.d: "The participants circle one question until every answer has become an objection. Nothing is settled, though everyone insists the debate was necessary."
 tv_arts_exhibition.410.a: "So be it."
 tv_arts_exhibition.420.t: "The Arts Exchange Concludes"
 tv_arts_exhibition.420.d: "After a full year of visits, arguments, demonstrations, and unexpected friendships, the Arts Exchange closes. Its effects will live on in the artists who took part."
 tv_arts_exhibition.420.a: "Until the next gathering."

