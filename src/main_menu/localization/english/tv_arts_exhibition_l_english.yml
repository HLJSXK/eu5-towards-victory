 # Arts Exhibition laws
 tv_arts_exhibition_laws: "Arts Exhibition Laws"
 TV_ARTS_EXHIBITION_LAWS_LAW_CATEGORY: "Arts Exhibition Laws"
 TV_ARTS_LAWS_TAB: "Arts Laws"

 tv_arts_patronage_law: "Artistic Patronage"
 tv_arts_patronage_law_desc: "The realm decides who pays for art, whose taste becomes public authority, and which patrons define the age."
 tv_arts_church_patronage_policy: "Church Patronage"
 tv_arts_church_patronage_policy_desc: "Churches, monasteries, and sacred foundations guide artistic labor. Religious unity and clerical influence grow, while secular experimentation narrows."
 tv_arts_court_patronage_policy: "Court Patronage"
 tv_arts_court_patronage_policy_desc: "The monarch directly funds artists and grand works. Legitimacy and court prestige rise, but the royal household pays for the splendor."
 tv_arts_noble_patronage_policy: "Noble Patronage"
 tv_arts_noble_patronage_policy_desc: "Great houses cultivate private circles and estate culture. Local variety and noble power grow, while central control weakens."
 tv_arts_commercial_patronage_policy: "Commercial Patronage"
 tv_arts_commercial_patronage_policy_desc: "Merchants, guilds, and urban buyers become the main consumers of art. Cities and new artists flourish, though patronage pulls income away from regular trade."
 tv_arts_state_academy_patronage_policy: "State Academy System"
 tv_arts_state_academy_patronage_policy_desc: "The state trains and manages artists through official academies. Standards and technique improve, but freer invention is pressed into official forms."

 tv_arts_organization_law: "Artistic Organization"
 tv_arts_organization_law_desc: "This law defines whether artists remain craft workers, servants of the court, independent masters, or graduates of a royal school."
 tv_arts_guild_system_policy: "Guild System"
 tv_arts_guild_system_policy_desc: "Artists work as artisans under guild rule and apprenticeship. Production remains steady, while new artists train narrowly and new styles advance slowly."
 tv_arts_court_workshops_policy: "Court Workshops"
 tv_arts_court_workshops_policy_desc: "Large workshops answer directly to the state. Monumental projects and control improve, but court maintenance rises."
 tv_arts_independent_masters_policy: "Independent Masters"
 tv_arts_independent_masters_policy_desc: "Artists accept commissions freely and build personal reputations. Innovation and talent rise, with a higher risk of disorderly disputes."
 tv_arts_royal_academy_policy: "Royal Academy"
 tv_arts_royal_academy_policy_desc: "Theory, exams, and standardized teaching shape elite artists. Official style strengthens, while local schools lose room."

 tv_arts_official_purpose_law: "Official Artistic Purpose"
 tv_arts_official_purpose_law_desc: "The state names the highest purpose of public art: faith, crown, education, diplomacy, or truth."
 tv_arts_glory_of_god_policy: "Glory of God"
 tv_arts_glory_of_god_policy_desc: "Art serves worship and religious instruction. Conversion and clerical confidence grow, while tolerance of heresy falls."
 tv_arts_praise_monarch_policy: "Praise the Monarch"
 tv_arts_praise_monarch_policy_desc: "Art constructs the ruler's image. Legitimacy and prestige benefit, but court display costs money."
 tv_arts_educate_people_policy: "Educate the People"
 tv_arts_educate_people_policy_desc: "Public images and performances teach civic morals. Maximum literacy and order improve at modest administrative cost."
 tv_arts_display_civilization_policy: "Display Civilization"
 tv_arts_display_civilization_policy_desc: "Art becomes a tool of international comparison. Cultural influence and reputation grow, drawing more attention from rivals."
 tv_arts_seek_truth_policy: "Seek Truth"
 tv_arts_seek_truth_policy_desc: "Artists work with anatomy, mathematics, and natural philosophy. Research and literacy benefit, while clerical allies grow uneasy."

 tv_arts_censorship_law: "Censorship and Artistic Freedom"
 tv_arts_censorship_law_desc: "The realm decides how tightly art must serve official ideology and how far private imagination may travel."
 tv_arts_strict_censorship_policy: "Strict Censorship"
 tv_arts_strict_censorship_policy_desc: "All public art must satisfy official doctrine. Stability improves, but the artistic scene becomes less fertile."
 tv_arts_licensed_creation_policy: "Licensed Creation"
 tv_arts_licensed_creation_policy_desc: "Artists may publish after receiving permission. The state keeps control and cultural influence rises, but court oversight grows costlier."
 tv_arts_court_tolerance_policy: "Court Tolerance"
 tv_arts_court_tolerance_policy_desc: "Experiment is permitted inside court circles. Greater talents appear, while court factions and estates become harder to please."
 tv_arts_free_creation_policy: "Free Creation"
 tv_arts_free_creation_policy_desc: "Markets and individual will dominate artistic life. Innovation and ideas spread quickly, with greater risk of unrest."

 tv_arts_city_aesthetics_law: "Architecture and Urban Aesthetics"
 tv_arts_city_aesthetics_law_desc: "This law decides whether cities are built for utility, faith, royal spectacle, classical order, or local freedom."
 tv_arts_utilitarian_city_policy: "Utilitarianism"
 tv_arts_utilitarian_city_policy_desc: "Cities favor function and economy. Construction becomes cheaper, while cultural scenery becomes plainer."
 tv_arts_religious_city_policy: "Religious City"
 tv_arts_religious_city_policy_desc: "Urban life turns around churches, shrines, and ritual routes. Conversion efforts benefit, while secular tolerance declines."
 tv_arts_royal_axis_policy: "Royal Axis"
 tv_arts_royal_axis_policy_desc: "Squares, palaces, and monuments impose royal order. Prestige and control rise, but public display is expensive."
 tv_arts_classical_planning_policy: "Classical Planning"
 tv_arts_classical_planning_policy_desc: "Geometry and rational plans govern the city. Administration and control improve, though rigid standards raise building costs."
 tv_arts_mixed_autonomy_policy: "Mixed Autonomy"
 tv_arts_mixed_autonomy_policy_desc: "Cities develop their own local styles. Diversity and development grow, while maximum control falls."

 tv_arts_knowledge_media_law: "Knowledge Transmission Media"
 tv_arts_knowledge_media_law_desc: "The realm chooses whether images and knowledge move through hands, blocks, movable type, or licensed state presses."
 tv_arts_manuscripts_frescoes_policy: "Manuscripts and Frescoes"
 tv_arts_manuscripts_frescoes_policy_desc: "Knowledge spreads through hand copying and wall images. Tradition and religion remain strong, while institutions spread slowly."
 tv_arts_woodblock_printing_policy: "Woodblock Printing"
 tv_arts_woodblock_printing_policy_desc: "Images and religious texts circulate by carved blocks. Faith spreads faster and publication broadens, while older forms lose some authority."
 tv_arts_movable_type_policy: "Movable-Type Publishing"
 tv_arts_movable_type_policy_desc: "Books and pamphlets spread at speed. Literacy and institutions grow quickly, along with the danger of disruptive ideas."
 tv_arts_state_publishing_policy: "State Publishing System"
 tv_arts_state_publishing_policy_desc: "The state controls presses and licenses. Propaganda and order strengthen, but heterodox and institutional spread are constrained."

 tv_arts_state_ritual_law: "State Ritual Aesthetics"
 tv_arts_state_ritual_law_desc: "This law sets the visual language of state ceremony, from restraint to sacred awe, spectacle, or public participation."
 tv_arts_plain_ritual_policy: "Plain Ritual"
 tv_arts_plain_ritual_policy_desc: "Ceremony remains restrained and traditional. Court costs fall, but prestige grows more slowly."
 tv_arts_religious_ritual_policy: "Religious Ritualization"
 tv_arts_religious_ritual_policy_desc: "State ceremonies become highly sacred. Religious authority and clerical satisfaction rise, while tolerance narrows."
 tv_arts_baroque_court_ritual_policy: "Baroque Court Ritual"
 tv_arts_baroque_court_ritual_policy_desc: "Grand festivals and visual marvels proclaim power. Prestige and legitimacy surge at heavy fiscal cost."
 tv_arts_enlightenment_festival_policy: "Enlightenment Public Festivals"
 tv_arts_enlightenment_festival_policy_desc: "Ceremonies celebrate the state, the people, and public reason. Legitimacy and literacy rise, while nobles resent the shift."

 tv_arts_science_relation_law: "Art and Science"
 tv_arts_science_relation_law_desc: "The realm decides whether art remains craft, adopts mathematics, serves engineering, or joins natural science."
 tv_arts_craft_tradition_policy: "Craft Tradition"
 tv_arts_craft_tradition_policy_desc: "Artists rely on experience and inherited technique. Tradition and skill remain steady, while theoretical progress slows."
 tv_arts_mathematical_perspective_policy: "Mathematical Perspective"
 tv_arts_mathematical_perspective_policy_desc: "Geometry, perspective, and proportion enter artistic training. Art and scientific thinking improve, with substantial added court expense."
 tv_arts_royal_engineering_art_policy: "Royal Engineering Art"
 tv_arts_royal_engineering_art_policy_desc: "Art serves state engineering and military construction. Building speed and defenses improve, while bureaucracy becomes costlier."
 tv_arts_scientific_aesthetic_unity_policy: "Scientific Aesthetic Unity"
 tv_arts_scientific_aesthetic_unity_policy_desc: "Art and natural science develop together. Research and cultural influence rise, while traditional religious patrons lose more confidence."

 # Generic action names and descriptions
 tv_send_artist_abroad: "Send Artist Abroad"
 tv_send_artist_abroad_desc: "Spend scaled gold x1 to dispatch one of your court artists on a [tv_artist_tour|e] in a foreign city. The tour lasts one to ten years and may raise [tv_arts_intl_influence|e], bring stories home, or leave a name behind in another court's ledgers."
 tv_host_domestic_exhibition: "Host Domestic Exhibition"
 tv_host_domestic_exhibition_desc: "Open a [tv_domestic_exhibition|e] in a chosen location. Requires at least 5 artworks, costs scaled gold, creates an Arts Exhibition Fair, and begins with 80 [tv_local_exhibition_enthusiasm|e]."
 tv_local_exhibition_add_artworks: "Add More Exhibits"
 tv_local_exhibition_add_artworks_desc: "This action has been folded into Expand Exhibition Scale."
 tv_local_exhibition_royal_visit: "The King Attends!"
 tv_local_exhibition_royal_visit_desc: "The ruler personally visits the exhibition, immediately adding 10 [tv_local_exhibition_enthusiasm|e] and triggering a courtly outcome. Usable once per exhibition."
 tv_local_exhibition_radical_art: "Proclaim Radical Art"
 tv_local_exhibition_radical_art_desc: "Give the avant-garde free rein. The results may electrify the public, disturb the realm, or destroy a work of art. Has a 1-year cooldown."
 tv_local_exhibition_expand: "Expand Exhibition Scale"
 tv_local_exhibition_expand_desc: "Commit the next tranche of exhibits, pay scaled gold x1, and choose a new owned location adjacent to any current [tv_domestic_exhibition|e] venue. Builds another Arts Exhibition Fair and adds 10 [tv_local_exhibition_enthusiasm|e]. The required uncommitted reserve rises from 5 to 10, then to 20 for later uses. No cooldown."
 tv_local_exhibition_sell_art: "Royal Sale of Art"
 tv_local_exhibition_sell_art_desc: "Destroy a random owned artwork and gain scaled gold. Has a 1-year cooldown."
 tv_local_exhibition_recruit_artists: "Recruit More Artists"
 tv_local_exhibition_recruit_artists_desc: "Spend Prestige to draw new artists to court. Most arrivals are modest talents, but a prodigy may answer the call. Has a 1-year cooldown."
 tv_local_exhibition_invite_foreign_artist: "Invite Foreign Artist"
 tv_local_exhibition_invite_foreign_artist_desc: "Ask another country to send one of its artists to the [tv_domestic_exhibition|e]. If accepted, the host gains Prestige and the exhibition gains 10 [tv_local_exhibition_enthusiasm|e]. Usable once per exhibition."
 tv_local_exhibition_designate_treasure: "Designate Centerpiece"
 tv_local_exhibition_designate_treasure_desc: "Spend Prestige to raise one selected artwork's quality by 10 and add 10 [tv_local_exhibition_enthusiasm|e]. Usable once per exhibition."
 tv_local_exhibition_live_creation: "Hold Live Creation Contest"
 tv_local_exhibition_live_creation_desc: "Gather the artists for public creation. The contest may refine skill, wound pride, stir enthusiasm, or produce a new work of art. Has a 1-year cooldown."
 tv_start_arts_exchange: "Start Arts Exchange"
 tv_start_arts_exchange_desc: "Open a year-long [tv_arts_exchange|e] led by the [tv_chief_artist|e]. Costs scaled gold x2, requires a [tv_chief_artist|e] and at least two living artists, and has no cooldown."
 tv_invite_domestic_arts_exchange_artist: "Invite Domestic Artist"
 tv_invite_domestic_arts_exchange_artist_desc: "Spend scaled gold x1 to persuade another domestic artist to join the current [tv_arts_exchange|e]. There is no participant cap."
 tv_invite_foreign_arts_exchange_artist: "Invite Foreign Artist"
 tv_invite_foreign_arts_exchange_artist_desc: "Spend scaled gold x1.5 to invite a foreign artist into the current [tv_arts_exchange|e]. Select a country first, then one available artist from that country."

