 MODIFIER_TYPE_DESC_tv_invite_domestic_arts_exchange_artist_price_cost_modifier: "Modifies the cost of inviting a domestic artist to an Arts Exchange."
 MODIFIER_TYPE_NAME_tv_invite_foreign_arts_exchange_artist_price_cost_modifier: "Invite Foreign Artist Cost"
 MODIFIER_TYPE_DESC_tv_invite_foreign_arts_exchange_artist_price_cost_modifier: "Modifies the cost of inviting a foreign artist to an Arts Exchange."

 # Generic action names and descriptions
 tv_send_artist_abroad: "Send Artist Abroad"
 tv_send_artist_abroad_desc: "Dispatch one of your court artists to perform in a foreign city. The tour lasts one to ten years and may bring international renown to your realm."
 tv_host_domestic_exhibition: "Host Domestic Exhibition"
 tv_host_domestic_exhibition_desc: "Open a [tv_domestic_exhibition|e] in a chosen location. Requires at least 5 artworks, costs scaled gold, creates an Arts Exhibition Fair, and begins with 80 [tv_local_exhibition_enthusiasm|e]."
 tv_local_exhibition_add_artworks: "Add More Exhibits"
 tv_local_exhibition_add_artworks_desc: "Commit another tranche of artworks to the [tv_domestic_exhibition|e]. Costs scaled gold. The required uncommitted reserve rises from 5 to 10, then to 20 for later uses. Adds 20 [tv_local_exhibition_enthusiasm|e]."
 tv_local_exhibition_royal_visit: "The King Attends!"
 tv_local_exhibition_royal_visit_desc: "The ruler personally visits the exhibition, immediately adding 10 [tv_local_exhibition_enthusiasm|e] and triggering a courtly outcome. Usable once per exhibition."
 tv_local_exhibition_radical_art: "Proclaim Radical Art"
 tv_local_exhibition_radical_art_desc: "Give the avant-garde free rein. The results may electrify the public, disturb the realm, or destroy a work of art. Has a 1-year cooldown."
 tv_local_exhibition_expand: "Expand Exhibition Scale"
 tv_local_exhibition_expand_desc: "Pay scaled gold and choose a secondary location for another Arts Exhibition Fair. Adds 10 [tv_local_exhibition_enthusiasm|e]. Usable once per exhibition."
 tv_local_exhibition_sell_art: "Royal Sale of Art"
 tv_local_exhibition_sell_art_desc: "Destroy a random owned artwork and gain scaled gold. Has a 1-year cooldown."
 tv_local_exhibition_recruit_artists: "Recruit More Artists"
 tv_local_exhibition_recruit_artists_desc: "Spend Prestige to draw new artists to court. Most arrivals are modest talents, but a prodigy may answer the call. Has a 1-year cooldown."
 tv_local_exhibition_invite_foreign_artist: "Invite Foreign Artist"
 tv_local_exhibition_invite_foreign_artist_desc: "Ask another country to send one of its artists to the exhibition. If accepted, the host gains Prestige and the exhibition gains 10 Enthusiasm. Usable once per exhibition."
 tv_local_exhibition_designate_treasure: "Designate Centerpiece"
 tv_local_exhibition_designate_treasure_desc: "Spend Prestige to raise one selected artwork's quality by 10 and add 10 [tv_local_exhibition_enthusiasm|e]. Usable once per exhibition."
 tv_local_exhibition_live_creation: "Hold Live Creation Contest"
 tv_local_exhibition_live_creation_desc: "Gather the artists for public creation. The contest may refine skill, wound pride, stir enthusiasm, or produce a new work of art. Has a 1-year cooldown."
 tv_start_arts_exchange: "Start Arts Exchange"
 tv_start_arts_exchange_desc: "Open a year-long Arts Exchange led by the Chief Artist. Costs scaled gold x2, requires a Chief Artist and at least two living artists, and has no cooldown."
 tv_invite_domestic_arts_exchange_artist: "Invite Domestic Artist"
 tv_invite_domestic_arts_exchange_artist_desc: "Spend scaled gold x1 to persuade another domestic artist to join the current Arts Exchange. There is no participant cap."
 tv_invite_foreign_arts_exchange_artist: "Invite Foreign Artist"
 tv_invite_foreign_arts_exchange_artist_desc: "Spend scaled gold x1.5 to invite a foreign artist. Select a country first, then one available artist from that country."

 # Generic action tooltips
 tv_send_artist_abroad_cost_tt: "Costs 200 ducats (travel expenses)."
 tv_send_artist_abroad_requires_artist_tt: "Requires at least one available artist in your court."
 tv_host_domestic_exhibition_cost_tt: "Costs scaled gold x3.5 (exhibition expenses)."
 tv_host_domestic_exhibition_requires_art_tt: "Requires at least 5 owned artworks."
 tv_local_exhibition_add_artworks_allow_tt: "Requires owned artworks minus committed exhibits to be greater than the current tranche size."
 TV_ARTS_EXCHANGE_REQUIRES_TWO_ARTISTS_TT: "Requires at least two living artists in court."

