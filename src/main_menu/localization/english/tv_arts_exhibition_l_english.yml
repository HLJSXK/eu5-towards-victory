 STATIC_MODIFIER_NAME_tv_local_exhibition_triumph_location_modifier: "Exhibition Triumph"
 tv_local_arts_exhibition: "Arts Exhibition Fair"
 tv_local_arts_exhibition_desc: "A temporary but lavish exhibition complex where nobles, artists, collectors, and curious crowds gather around the realm's masterworks."
 tv_local_arts_exhibition_maintenance: "Exhibition Maintenance"
 tv_local_arts_exhibition_price: "Arts Exhibition Fair"
