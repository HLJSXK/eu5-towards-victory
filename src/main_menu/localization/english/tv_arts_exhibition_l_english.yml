 # Arts Exhibition events
 tv_arts_exhibition.10.t: "Foreign Tour：Artist Dispatched Abroad"
 tv_arts_exhibition.10.d.1: "The court has watched one of our artists depart on a [tv_artist_tour|e]. Their crates were sealed before dawn, their letters of introduction tied with silk, and the last assistants chased the wagon as if a forgotten brush might decide the fate of the journey. The host court expects a brief season of display, argument, and careful compliments. Fate has dealt a short assignment: the tour is expected to last #bold 1 year#!. Even a single year abroad can become a rumor that outlives the traveler."
 tv_arts_exhibition.10.d.2: "The court has watched one of our artists depart on a [tv_artist_tour|e]. Their crates were sealed before dawn, their letters of introduction tied with silk, and the last assistants chased the wagon as if a forgotten brush might decide the fate of the journey. The host court has promised rooms, audiences, and enough time for taste to become habit. The tour is expected to last #bold 2 years#!. By then, foreign spectators may know our hand before they learn our tongue."
 tv_arts_exhibition.10.d.3: "The court has watched one of our artists depart on a [tv_artist_tour|e]. Their crates were sealed before dawn, their letters of introduction tied with silk, and the last assistants chased the wagon as if a forgotten brush might decide the fate of the journey. Three seasons of fashion will rise and fall while our envoy of color and form works abroad. The tour is expected to last #bold 3 years#!. That is long enough for courtesy to become expectation."
 tv_arts_exhibition.10.d.4: "The court has watched one of our artists depart on a [tv_artist_tour|e]. Their crates were sealed before dawn, their letters of introduction tied with silk, and the last assistants chased the wagon as if a forgotten brush might decide the fate of the journey. The host court has opened more than a hall; it has opened a small corner of its memory. The tour is expected to last #bold 4 years#!. Our [tv_arts_intl_influence|e] may now be measured in invitations as much as applause."
 tv_arts_exhibition.10.d.5: "The court has watched one of our artists depart on a [tv_artist_tour|e]. Their crates were sealed before dawn, their letters of introduction tied with silk, and the last assistants chased the wagon as if a forgotten brush might decide the fate of the journey. A five-year stay is no mere performance but a second apprenticeship in foreign habits. The tour is expected to last #bold 5 years#!. When the artist returns, if they return unchanged at all, they will bring more than sketches."
 tv_arts_exhibition.10.d.6: "The court has watched one of our artists depart on a [tv_artist_tour|e]. Their crates were sealed before dawn, their letters of introduction tied with silk, and the last assistants chased the wagon as if a forgotten brush might decide the fate of the journey. Six years abroad will carry them through patrons, rivals, illnesses, fashions, and triumphs. The tour is expected to last #bold 6 years#!. Our court sends a person; the world may send back a school."
 tv_arts_exhibition.10.d.7: "The court has watched one of our artists depart on a [tv_artist_tour|e]. Their crates were sealed before dawn, their letters of introduction tied with silk, and the last assistants chased the wagon as if a forgotten brush might decide the fate of the journey. Seven years is long enough for a foreign audience to claim our artist as part of its own age. The tour is expected to last #bold 7 years#!. Every compliment abroad will be sweet, and every attachment will be dangerous."
 tv_arts_exhibition.10.d.8: "The court has watched one of our artists depart on a [tv_artist_tour|e]. Their crates were sealed before dawn, their letters of introduction tied with silk, and the last assistants chased the wagon as if a forgotten brush might decide the fate of the journey. Eight years will teach our artist the slow grammar of another court: who sits near the candle, who pays late, who praises only to wound. The tour is expected to last #bold 8 years#!. The [tv_arts_exhibition|e] sends art, but politics will answer."
 tv_arts_exhibition.10.d.9: "The court has watched one of our artists depart on a [tv_artist_tour|e]. Their crates were sealed before dawn, their letters of introduction tied with silk, and the last assistants chased the wagon as if a forgotten brush might decide the fate of the journey. Nine years abroad can turn an assignment into a life with its own debts, loyalties, and silences. The tour is expected to last #bold 9 years#!. We must hope our name stays bright in their hand."
 tv_arts_exhibition.10.d.10: "The court has watched one of our artists depart on a [tv_artist_tour|e]. Their crates were sealed before dawn, their letters of introduction tied with silk, and the last assistants chased the wagon as if a forgotten brush might decide the fate of the journey. Fate has dealt a long assignment: the tour is expected to last #bold 10 years#!. A decade is a bridge wide enough for fame, envy, patronage, illness, and homesickness to cross together. If fortune holds, the artist's work will speak for us long before our envoys arrive."
 tv_arts_exhibition.10.d.default: "The court has watched one of our artists depart on a [tv_artist_tour|e]. Their crates were sealed, their letters of introduction reviewed, and their attendants counted twice. Somewhere beyond the border a hall is being swept for our colors, our techniques, and our courtly confidence. The [tv_arts_exhibition|e] now has a living messenger abroad. Whether the journey returns applause, scandal, or something stranger, the first step has already been taken."
 tv_arts_exhibition.10.a: "Let their work speak for us."

 tv_arts_exhibition.1.t: "Local Exhibition：Grand Domestic Exhibition"
 tv_arts_exhibition.1.d: "The doors are open. Tapestries have been lowered into torchlight, reliquaries polished, manuscripts turned to their brightest pages, and the first visitors already crowd the hall. Courtiers pretend to judge technique while counting who stands nearest the finest pieces. Merchants whisper prices under their breath, priests search for virtue, and young apprentices search for permission to dream above their station. For as long as public wonder can be kept alive, this [tv_domestic_exhibition|E] will test the realm's taste, purse, and patience. A hall full of beauty is never only a hall; it is a little country trying to decide what it wants to admire."
 tv_arts_exhibition.1.a: "Open every door and let wonder spend itself."
 tv_arts_exhibition.1.tt: "[tv_domestic_exhibition|E] has begun."

 tv_arts_exhibition.5.t: "Foreign Tour：Artist Returns from Abroad"
 tv_arts_exhibition.5.d: "One of our artists has concluded a [tv_artist_tour|e] and returned home. The road has left dust on their trunks and foreign habits in their eye, but the old court still recognizes the hand that once left it. Assistants unpack sketches, copied songs, strange pigments, and gifts whose meaning must be interpreted carefully. Courtiers crowd close, pretending not to be curious about every foreign praise and every foreign insult. The [tv_arts_exhibition|e] has gained more than a returning servant; it has gained a witness."
 tv_arts_exhibition.5.a: "Open the doors and listen."

 tv_arts_exhibition.6.t: "Foreign Tour：Artist Died Abroad"
 tv_arts_exhibition.6.d: "Tragic news has reached us from afar: one of our artists has died while serving on a [tv_artist_tour|e]. The letter is formal, too formal, as if careful ink could soften the distance between a foreign bed and a homeland workshop. Their unfinished studies will be packed by unfamiliar hands, and whatever last words they spoke must cross borders through witnesses who barely understood them. The host court offers condolences, but condolences do not restore the voice missing from our halls. The [tv_arts_exhibition|e] has won attention abroad at a price no ledger can make tidy."
 tv_arts_exhibition.6.a: "Let their name remain in the hall."

 tv_arts_exhibition.7.t: "Arts Exhibition：Chief Artist Has Died"
 tv_arts_exhibition.7.d: "Our [tv_chief_artist|E] has passed away. The workshops heard it first in the sudden silence of messengers who did not know which door to knock upon. In the [tv_arts_exhibition|e], assistants continue copying accounts, artists continue quarrelling over taste, and patrons continue asking for answers, but the chair at the center is empty. Without a guiding hand, monthly influence becomes a matter of habit rather than vision. Someone must inherit the title before the realm's art begins to sound like an orchestra tuning forever."
 tv_arts_exhibition.7.a: "Find a hand steady enough for the chair."

 tv_arts_exhibition.8.t: "Arts Exhibition：Chief Artist Sent Abroad"
 tv_arts_exhibition.8.d: "Our [tv_chief_artist|E] has departed on a [tv_artist_tour|e]. Their decision may serve the realm abroad, but the post they leave behind cannot be governed by letters from foreign inns and borrowed studios. The [tv_arts_exhibition|e] still needs someone present to settle rivalries, select displays, greet patrons, and translate brilliance into policy. Courtiers already wonder whether this is an inspired mission or a graceful abdication. Until we appoint a successor, the office exists only as a name written above an empty desk."
 tv_arts_exhibition.8.a: "The desk must not remain empty."

 tv_arts_exhibition.101.t: "Foreign Tour：A Modest Reception"
 tv_arts_exhibition.101.d: "Reports reach us that our touring artist's latest display was received with polite interest. The audience admired the discipline, repeated the expected compliments, and then moved on to supper with only a few lingering glances. No court poet has burst into praise, no patron has emptied a purse, and no rival has written an angry pamphlet. Still, a quiet reception is not failure. The artist's name has entered one more conversation abroad, and [tv_arts_intl_influence|e] grows by small, durable increments."
 tv_arts_exhibition.101.a: "Even polite applause travels."

 tv_arts_exhibition.102.t: "Foreign Tour：A Triumph!"
 tv_arts_exhibition.102.d: "Word has arrived of a spectacular success abroad. The foreign court crowded so tightly around our artist's work that servants had to reopen the side doors for air. Patrons repeated our realm's name with the delighted caution usually reserved for new fashions and dangerous ideas. Rival artists watched closely, some admiring, some memorizing, some preparing objections. By morning, the display had become a story told outside the palace. [tv_arts_intl_influence|E] does not always arrive as policy; sometimes it arrives as astonishment."
 tv_arts_exhibition.102.a: "Let the astonishment cross every border."

 tv_arts_exhibition.103.t: "Foreign Tour：A Humiliation"
 tv_arts_exhibition.103.d: "Mortifying reports have arrived from the [tv_artist_tour|e]. A difficult performance met a hostile room, and hostility quickly learned to laugh. Some mocked the colors, others the posture, and the cruelest observers mocked the confidence with which our court had sent the artist abroad. The embarrassment has already found messengers faster than our official explanation. The damage is not ruinous, but it reminds the [tv_arts_exhibition|e] that foreign taste is a court of law with no appeal."
 tv_arts_exhibition.103.a: "Burn the report, not the lesson."

 tv_arts_exhibition.104.t: "Foreign Tour：Artist Retained by Foreign Court!"
 tv_arts_exhibition.104.d: "Our touring artist has so impressed their hosts that the foreign court has offered them a permanent position. The invitation is written as praise, but every compliment has a hook hidden beneath it. Losing the artist will sting our workshops, yet refusing such recognition would make us look jealous of our own success. The host court will claim a living ornament; we will claim that our training produced someone worth stealing. It is a bitter exchange, but the prestige of being desired travels very far."
 tv_arts_exhibition.104.a: "Let the loss look like triumph."

 tv_arts_exhibition.105.t: "Foreign Tour：Artist Finds New Inspiration"
 tv_arts_exhibition.105.d: "Exposure to a foreign culture has unlocked something extraordinary in our touring artist. They write of unfamiliar pigments, harsher criticism, different proportions, and workshops where even the silence seems to obey another rule. At first these novelties unsettled them; now they have become tools. Their technique is no longer merely ours carried abroad, but ours changed by the journey. When the [tv_artist_tour|e] ends, the artist may bring back a hand that our own court could never have taught."
 tv_arts_exhibition.105.a: "Let distance sharpen the hand."

 # ── Monthly Special Events (201-205) ─────────────────────────────────────
 tv_arts_exhibition.201.t: "Foreign Tour：A Bridge of Cultures"
 tv_arts_exhibition.201.d: "Our touring artist's presence abroad has done more than display our works: it has opened hearts. A court that once knew us through envoys, tariffs, and suspicious maps now speaks of our colors, gestures, and jokes. Banquet talk has softened, letters have grown warmer, and even formal audiences carry a trace of shared delight. This is not a treaty, but treaties often begin where suspicion forgets to keep its posture. Through the [tv_arts_exhibition|e], art has slipped into the room before diplomacy announced itself."
 tv_arts_exhibition.201.a: "Let the soft word do hard work."

 tv_arts_exhibition.202.t: "Foreign Tour：The Exhibition Captivates a City"
 tv_arts_exhibition.202.d: "Our artist's works have transformed the host city. Visitors arrive from market towns, manor houses, and distant parishes, each claiming they came for business before drifting toward the exhibition doors. Inns fill, vendors shout, and local children learn to point strangers toward the hall. The host authorities pretend this is merely good order, but everyone can see that our art has changed the city's rhythm. For a season, foreign prosperity is keeping time with our reputation."
 tv_arts_exhibition.202.a: "Let their streets remember us."

 tv_arts_exhibition.203.t: "Foreign Tour：A Noble Patron Emerges"
 tv_arts_exhibition.203.d: "A wealthy noble of the host court has been so moved by our artist's performance that they have commissioned a grand theater at the exhibition site. The order was given publicly, with just enough flourish to ensure every rival family understood who had recognized genius first. Builders already measure the ground, while poets debate whether the theater should be called generosity or vanity. We need not decide. Either way, our [tv_artist_tour|e] has left a mark that hammers and stonecutters must now make permanent."
 tv_arts_exhibition.203.a: "Our art has found its masonry."

 tv_arts_exhibition.204.t: "Foreign Tour：An Exchange of Masters"
 tv_arts_exhibition.204.d: "Our touring artist and a local master have spent weeks studying one another's techniques. They began with polite demonstrations, moved quickly to disagreement, and ended by correcting each other's hands without asking permission. Assistants carried models, powders, sketches, and wounded pride between the two workshops. By the end, both masters had learned something neither tradition could have produced alone. This is the truest kind of [tv_arts_exchange|e]: not harmony, but useful friction."
 tv_arts_exhibition.204.a: "Let the friction become brilliance."

 tv_arts_exhibition.205.t: "Foreign Tour：Theft and Tragedy"
 tv_arts_exhibition.205.d: "Catastrophe has overtaken the [tv_artist_tour|e]. Our artist, apparently overwhelmed by the foreign works around them, attempted to steal a masterpiece from the host court. They were caught in the act, and the confrontation that followed ended in blood, splintered frames, and a ruined artwork. The host court is furious, our own envoys are speechless, and every enemy of cultural display now has a story to repeat. Art can cross borders as a guest, but scandal crosses them as fire."
 tv_arts_exhibition.205.a: "Seal the letters with black wax."

 # ── Return Special Events (120-124) ──────────────────────────────────────
 tv_arts_exhibition.120.t: "Foreign Tour：A Souvenir Returns Home"
 tv_arts_exhibition.120.d: "Our artist returns from the [tv_artist_tour|e], and not empty-handed. Among their baggage is a work of art from the host court, wrapped with excessive care and explained with slightly too many details. They claim it was gifted to them, though the gift seems to have traveled without a public farewell. No accusation has followed it home, and possession has a persuasive grammar of its own. Whether truly given, artfully traded, or quietly acquired, it now graces our halls."
 tv_arts_exhibition.120.a: "Hang it where questions sound impolite."

 tv_arts_exhibition.121.t: "Foreign Tour：A New Masterpiece"
 tv_arts_exhibition.121.d: "The journey has transformed our artist. They returned tired, thinner, and almost rudely impatient with familiar praise. Barely home before picking up the brush again, they shut themselves away with foreign sketches and old memories until even the servants began walking softly past the door. The work that emerged carries our training, their suffering, and something luminous borrowed from elsewhere. It is a new masterpiece, and it could not have been born without the road."
 tv_arts_exhibition.121.a: "Let the road have its triumph."

 tv_arts_exhibition.122.t: "Foreign Tour：Foreign Insights"
 tv_arts_exhibition.122.d: "Our artist returns carrying more than memories. In the margins of sketchbooks lie observations on tools, pigments, geometry, anatomy, and workshop discipline. What began as artistic curiosity has become useful evidence for scholars who did not expect a painter's travel notes to trouble their theories. The [tv_arts_exhibition|e] has therefore sent a gift across the hall to the learned world. Knowledge, like paint, sometimes travels best under another name."
 tv_arts_exhibition.122.a: "Send the notes to the scholars."

 tv_arts_exhibition.123.t: "Foreign Tour：An Artist at Rest"
 tv_arts_exhibition.123.d: "Our artist returns home aged but fulfilled. The [tv_artist_tour|e] gave them patrons, quarrels, strange weather, and a fame that no longer fits neatly inside our old rooms. They seemed content simply to sit among familiar voices again, correcting younger artists with the gentleness of someone who had nothing left to prove. The long years abroad had already spent the last of their strength. They passed away quietly in their homeland, leaving a legacy large enough to make the silence bearable."
 tv_arts_exhibition.123.a: "Place their tools beneath a clean cloth."

 tv_arts_exhibition.124.t: "Foreign Tour：A Generous Farewell"
 tv_arts_exhibition.124.d: "The host court sends our artist home with warm words and a generous purse. Its ministers call the money a token of gratitude, its courtiers call it farewell, and its accountants have wisely written it down under a less sentimental heading. For years, our artist brightened their halls, unsettled their rivals, and made their own patrons look discerning. Now the [tv_artist_tour|e] closes with gold heavy enough to make admiration practical. We accept both the praise and the purse."
 tv_arts_exhibition.124.a: "A gracious farewell, and a useful one."

 # ── Local Exhibition Events ───────────────────────────────────────────────
 tv_arts_exhibition.310.t: "Local Exhibition：The Exhibition Fades"
 tv_arts_exhibition.310.d: "The crowds thin, the lamps burn low, and the attendants begin covering the works before the final visitors have even left. The exhibition lasted [ROOT.GetVariable('tv_local_exhibition_last_duration').GetValue|0] months and produced [ROOT.GetVariable('tv_local_exhibition_last_reward').GetValue|1] [tv_cip|e], but its muted reception costs us 10 Prestige."
 tv_arts_exhibition.310.a: "A costly lesson in taste."
 tv_arts_exhibition.311.t: "Local Exhibition：A Worthy Exhibition"
 tv_arts_exhibition.311.d: "The exhibition has run its course after [ROOT.GetVariable('tv_local_exhibition_last_duration').GetValue|0] months. It never became a legend, yet its halls stayed alive long enough to leave a visible mark: [ROOT.GetVariable('tv_local_exhibition_last_reward').GetValue|1] [tv_cip|e]."
 tv_arts_exhibition.311.a: "A respectable achievement."
 tv_arts_exhibition.312.t: "Local Exhibition：An Exhibition Remembered"
 tv_arts_exhibition.312.d: "For [ROOT.GetVariable('tv_local_exhibition_last_duration').GetValue|0] months, the exhibition drew patrons, critics, and imitators. Its reputation now travels beyond the host city, granting [ROOT.GetVariable('tv_local_exhibition_last_reward').GetValue|1] [tv_cip|e] and 10 Prestige."
 tv_arts_exhibition.312.a: "Our halls have spoken well of us."
 tv_arts_exhibition.313.t: "Local Exhibition：A Triumph of the Arts"
 tv_arts_exhibition.313.d: "The exhibition endured for [ROOT.GetVariable('tv_local_exhibition_last_duration').GetValue|0] months and became a marvel in its own right. Its closing is less an end than a procession: [ROOT.GetVariable('tv_local_exhibition_last_reward').GetValue|1] [tv_cip|e], 15 Prestige, and a triumphal afterglow across the exhibition venues."
 tv_arts_exhibition.313.a: "This will be remembered."

 tv_arts_exhibition.320.t: "Local Exhibition：A Hall Without Enough Gold"
 tv_arts_exhibition.320.d: "The master of ceremonies warns that musicians, guards, lanterns, and restorers cannot be paid with applause. The [tv_domestic_exhibition|e] has grown hungrier than its first budget, as fine evenings often do once everyone agrees they are important. Oil runs low, musicians eye the doors, and a restorer refuses to touch a damaged frame until someone explains who will pay for the privilege. A purse opened now would keep the evening alive. Refusal would not end the exhibition, but it would teach the crowd to expect less."
 tv_arts_exhibition.320.a: "Pay what the hall requires."
 tv_arts_exhibition.320.b: "Let the evening shrink."
 tv_arts_exhibition.321.t: "Local Exhibition：The Critics Demand a Gesture"
 tv_arts_exhibition.321.d: "Poets and connoisseurs whisper that a true patron would dedicate the exhibition more boldly. They have gathered near the best-lit walls, pretending to discuss brushwork while really measuring the courage of our patronage. The [tv_domestic_exhibition|e] can still win them, but critics dislike being won cheaply. A public concession of prestige could turn their sharp tongues into trumpets. Leaving them unattended would allow clever disappointment to harden into fashion."
 tv_arts_exhibition.321.a: "Let reputation be spent for reputation."
 tv_arts_exhibition.321.b: "They may whisper."
 tv_arts_exhibition.322.t: "Local Exhibition：Noble Seats Stand Empty"
 tv_arts_exhibition.322.d: "Several noble houses dislike the seating order, the invitations, or perhaps merely one another. Their empty seats form a more eloquent protest than any letter, and everyone has noticed the gap in the front row. The [tv_domestic_exhibition|e] depends on splendor, and splendor looks thinner when titled families choose absence as decoration. A private apology would sour noble satisfaction, but restore the glittering front row. Pride must be arranged as carefully as the artworks."
 tv_arts_exhibition.322.a: "Placate the nobles."
 tv_arts_exhibition.322.b: "Their absence will be noticed."
 tv_arts_exhibition.323.t: "Local Exhibition：A Sermon Against Vanity"
 tv_arts_exhibition.323.d: "A prominent cleric warns that beauty without humility is a polished road to sin. The sermon has already crossed the market square, improving with every retelling until even harmless portraits sound like theological provocations. The [tv_domestic_exhibition|e] cannot afford to become a contest between wonder and salvation. A carefully worded concession could quiet the pulpit and bring the faithful back through the doors. Beauty survives more easily when it learns the language of restraint."
 tv_arts_exhibition.323.a: "Soothe the clergy."
 tv_arts_exhibition.323.b: "The paintings will answer."
 tv_arts_exhibition.324.t: "Local Exhibition：Merchants Count the Stalls"
 tv_arts_exhibition.324.d: "The burghers who supplied frames, pigments, benches, and printed notices now demand better terms. They have discovered that culture is a noble word for a very practical supply chain. Without them, the [tv_domestic_exhibition|e] still has paintings, but fewer benches, duller lamps, and far less gossip moving through the market stalls. Yielding to them will cost satisfaction, but keep the market around the exhibition lively. Art may be sublime, but someone still invoices the varnish."
 tv_arts_exhibition.324.a: "Make terms with the burghers."
 tv_arts_exhibition.324.b: "The fair can do without them."
 tv_arts_exhibition.325.t: "Local Exhibition：Crowds at the Gates"
 tv_arts_exhibition.325.d: "Common visitors grumble that the exhibition belongs more to velvet sleeves than rough hands. They wait at the gates, listen to music meant for others, and repeat the names of artworks they have not been permitted to see. The [tv_domestic_exhibition|e] was meant to display the realm's brilliance, but brilliance loses some power when most people glimpse only the lantern smoke. Opening extra viewing hours would anger local notables and strain the peasants, but it would revive public warmth. A crowd admitted late still remembers being admitted."
 tv_arts_exhibition.325.a: "Make room for the common crowd."
 tv_arts_exhibition.325.b: "The gates remain as they are."
 tv_arts_exhibition.326.t: "Local Exhibition：A Question of Order"
 tv_arts_exhibition.326.d: "Pamphlets praising the exhibition now praise too much else: new manners, new freedoms, new truths. Printers have discovered that admiration sells best when it arrives beside danger. What began as a notice for the [tv_domestic_exhibition|e] now reads like an argument about the entire realm. A small sacrifice of stability could let the fervor burn without interruption. Suppression would be quieter, but perhaps too quiet for an exhibition that feeds on public heat."
 tv_arts_exhibition.326.a: "Permit the ferment."
 tv_arts_exhibition.326.b: "Dampen the talk."
 tv_arts_exhibition.327.t: "Local Exhibition：A Doubt Cast on the Crown"
 tv_arts_exhibition.327.d: "Some courtiers argue that the exhibition has become a court within the court, a place where taste outranks birth. Painters are being flattered like ministers, critics like judges, and patrons like founders of dynasties. The [tv_domestic_exhibition|e] was meant to ornament royal authority, but ornament has a habit of asking where the wall would be without it. A royal concession would hurt legitimacy, but turn scandal back into spectacle. The crown must decide whether to command the hall or charm it."
 tv_arts_exhibition.327.a: "The crown can bend for beauty."
 tv_arts_exhibition.327.b: "The crown does not bend."
 tv_arts_exhibition.328.t: "Local Exhibition：The Host City Gives Stone"
 tv_arts_exhibition.328.d: "The host location can expand the exhibition only by surrendering workshops, yards, and useful rooms to galleries and promenades. Carpenters measure productive spaces with apologetic faces, already imagining them filled with tapestries instead of tools. The [tv_domestic_exhibition|e] would become grander, more walkable, and more irresistible to visitors, but the city would pay in ordinary usefulness. Development will suffer, yet [tv_local_exhibition_enthusiasm|e] will surge. Sometimes a city must decide whether it wants to work or be remembered."
 tv_arts_exhibition.328.a: "Turn stone into splendor."
 tv_arts_exhibition.328.b: "Preserve the city as it is."
 tv_arts_exhibition.329.t: "Local Exhibition：Prosperity Spent in Festival"
 tv_arts_exhibition.329.d: "The exhibition could become a citywide celebration if local stores, guilds, and households carried the burden. The proposal smells of lantern oil, roasted meat, expensive ribbons, and accounts that will look worse in the morning. For a few bright weeks, the [tv_domestic_exhibition|e] could spill out of its halls and make the entire city feel like an artwork in motion. Prosperity would be spent like oil in a lamp. The question is whether the glow is worth the fuel."
 tv_arts_exhibition.329.a: "Let the city burn bright."
 tv_arts_exhibition.329.b: "Do not spend the city's good fortune."

 tv_arts_exhibition.340.t: "Local Exhibition：The Ruler Sees Clearly"
 tv_arts_exhibition.340.d: "Before a crowded hall, the ruler pauses before a difficult work and speaks with unexpected precision. The courtiers brace for the usual polished compliment, but instead hear a judgment sharp enough to make the artist stand straighter. The [tv_domestic_exhibition|e] briefly stops being a display and becomes a test that the crown has passed in public. Critics who expected ignorance find themselves nodding despite their intentions. A ruler who sees clearly teaches the room to look again."
 tv_arts_exhibition.340.a: "A sharper eye makes a sharper crown."
 tv_arts_exhibition.341.t: "Local Exhibition：A Royal Misstep"
 tv_arts_exhibition.341.d: "The ruler lingers before the wrong piece, praises the wrong hand, and asks a question that no one can answer without embarrassment. The hall enters that terrible silence in which every listener becomes a witness. The [tv_domestic_exhibition|e] has survived critics, invoices, and bad weather, but royal misunderstanding is a more delicate wound. Smiles return quickly, too quickly. The hall will remember the mistake long after the lamps are put away."
 tv_arts_exhibition.341.a: "Even silence would have been kinder."
 tv_arts_exhibition.342.t: "Local Exhibition：The Crown Applauded"
 tv_arts_exhibition.342.d: "The ruler's visit becomes a tableau of harmony: crown, art, and people gathered beneath the same painted ceiling. Every gesture seems well-timed, every greeting lands warmly, and even the most skeptical observers find themselves absorbed into the performance. The [tv_domestic_exhibition|e] lends its beauty to the throne, while the throne lends authority back to the hall. For once, spectacle and legitimacy do not compete. They stand shoulder to shoulder and let the crowd applaud both."
 tv_arts_exhibition.342.a: "Legitimacy shines in public light."
 tv_arts_exhibition.343.t: "Local Exhibition：The Crown Mocked"
 tv_arts_exhibition.343.d: "Satirists seize upon the royal visit before the candles have gone cold. A misread gesture, an awkward question, or perhaps merely an unflattering angle has become material for laughter. What was meant as patronage now circulates as a joke with excellent legs. The [tv_domestic_exhibition|e] still draws crowds, but some now come hoping to stand where the crown looked foolish. Public art is generous; it gives even mockery a better stage."
 tv_arts_exhibition.343.a: "A crown is heavy in a crowded room."
 tv_arts_exhibition.350.t: "Local Exhibition：The Radical Manifesto"
 tv_arts_exhibition.350.d: "The new declaration tears through custom like a blade through canvas. Young artists cheer, older masters recoil, and officials begin asking whether a manifesto can be arrested before it becomes fashionable. The [tv_domestic_exhibition|e] suddenly feels less like a hall of works and more like a room full of lit fuses. Some visitors are thrilled precisely because they do not understand it yet. The state itself trembles, and the tremor draws a crowd."
 tv_arts_exhibition.350.a: "Let art disturb the world."
 tv_arts_exhibition.351.t: "Local Exhibition：A Fresh Fashion"
 tv_arts_exhibition.351.d: "What sounded dangerous yesterday is suddenly fashionable today. The same phrases that made patrons frown now appear in salons with careful mispronunciations and confident nods. The hall fills with people eager to say they understood it first, preferably in front of those who did not. The [tv_domestic_exhibition|e] has converted risk into style. Nothing makes novelty respectable faster than the fear of seeming late."
 tv_arts_exhibition.351.a: "Novelty has found its hour."
 tv_arts_exhibition.352.t: "Local Exhibition：The Public Turns Away"
 tv_arts_exhibition.352.d: "The rhetoric outruns the art. Visitors arrive prepared to be transformed and leave merely puzzled, which is a more dangerous disappointment. Patrons ask whether insult is now a technique, while artists insist the audience has failed to become modern quickly enough. The [tv_domestic_exhibition|e] loses warmth as explanation replaces wonder. Enthusiasm cools, and even the boldest pamphlets begin to sound defensive."
 tv_arts_exhibition.352.a: "The edge cut the wrong way."
 tv_arts_exhibition.353.t: "Local Exhibition：A Work Destroyed"
 tv_arts_exhibition.353.d: "In the confusion of performance, protest, and applause, one artwork is ruined beyond recovery. No one agrees whether the destruction was accident, statement, or panic, which ensures all three explanations will survive. The [tv_domestic_exhibition|e] briefly smells of broken varnish and public shame. Artists argue over sacrifice; patrons argue over compensation. No manifesto can restore the work, and no apology can quite restore the mood."
 tv_arts_exhibition.353.a: "The price of excess."
 tv_arts_exhibition.354.t: "Local Exhibition：A Modest New Artist"
 tv_arts_exhibition.354.d: "The call for artists is answered by a diligent hand. They arrive with a modest portfolio, careful manners, and the slightly terrified expression of someone who has counted every coin needed to reach court. No one mistakes them for a genius, but the [tv_domestic_exhibition|e] has room for patience as well as brilliance. They know how to work, how to listen, and how to improve without making a speech about it. That may be enough."
 tv_arts_exhibition.354.a: "There is room in the workshop."
 tv_arts_exhibition.355.t: "Local Exhibition：A Brilliant Arrival"
 tv_arts_exhibition.355.d: "A rare talent arrives almost without warning, carrying sketches and confidence in equal measure. They enter the hall as if late to a destiny that should have waited more politely. The [tv_domestic_exhibition|e] changes temperature around them: patrons lean forward, rivals go still, and lesser compliments die unfinished. The work is not perfect, but the promise is unmistakable. The court can feel the room change."
 tv_arts_exhibition.355.a: "Give them space and patronage."
 tv_arts_exhibition.356.t: "Local Exhibition：No One Answers"
 tv_arts_exhibition.356.d: "Messengers return with polite refusals, stale excuses, and the silence of artists already employed elsewhere. The invitations were written beautifully, which makes their failure more irritating. A few candidates praise our [tv_domestic_exhibition|e] while declining to approach it, proving that admiration is cheaper than travel. The empty studio waits with clean light and no hand to use it. Even patronage sometimes knocks on locked doors."
 tv_arts_exhibition.356.a: "The empty studio says enough."
 tv_arts_exhibition.360.t: "Local Exhibition：An Invitation from Abroad"
 tv_arts_exhibition.360.d: "[SCOPE.sCountry('inviting_country').GetName] invites [SCOPE.sCharacter('guest_artist').GetShortName] to attend its [tv_domestic_exhibition|e] as a guest artist. Accepting would send them abroad until that exhibition closes and grant us 10 Prestige."
 tv_arts_exhibition.360.a: "Let art travel."
 tv_arts_exhibition.360.b: "They remain here."
 tv_arts_exhibition.361.t: "Local Exhibition：The Invitation Accepted"
 tv_arts_exhibition.361.d: "Our invitation has been accepted. The foreign artist arrives amid greetings, curiosity, and the quick rearrangement of every person who wants to be seen greeting them first. Their accent, clothing, tools, and habits become part of the spectacle before their work is even unpacked. The [tv_domestic_exhibition|e] gains a new voice and a useful trace of foreign approval. Visitors now come not only to see our collection, but to measure how confidently we welcome another tradition. That confidence is worth almost as much as the art."
 tv_arts_exhibition.361.a: "A welcome guest."
 tv_arts_exhibition.362.t: "Local Exhibition：The Invitation Refused"
 tv_arts_exhibition.362.d: "Our invitation has been declined. The reply is courteous enough to make anger difficult and thin enough to make disappointment obvious. Some at court insist the foreign artist feared comparison; others quietly suspect our offer lacked shine. The [tv_domestic_exhibition|e] will have to make do with its own voices. Fortunately, a hall that cannot borrow glamour may still manufacture dignity."
 tv_arts_exhibition.362.a: "So be it."
 tv_arts_exhibition.363.t: "Local Exhibition：Guest Artist Returns"
 tv_arts_exhibition.363.d: "The foreign exhibition has closed, and our artist has returned with travel dust, stories, and a few useful observations. They speak of unfamiliar hanging orders, different manners of applause, and patrons whose compliments take longer to understand than insults. Their absence gave another court a temporary jewel; their return gives us comparison. The [tv_domestic_exhibition|e] will not look quite the same through their eyes. A short journey has made the familiar hall a little less provincial."
 tv_arts_exhibition.363.a: "Welcome home."
 tv_arts_exhibition.370.t: "Local Exhibition：A Hand Refined"
 tv_arts_exhibition.370.d: "Before the crowd, one artist discovers a clearer line, a better rhythm, and a more exacting discipline. It happens visibly enough that the audience senses the change before anyone names it. The [tv_domestic_exhibition|e] becomes, for a breath, not a display of finished glory but a workshop with its doors thrown open. Other artists pretend not to study the moment too closely. They fail."
 tv_arts_exhibition.370.a: "Practice has become revelation."
 tv_arts_exhibition.371.t: "Local Exhibition：A Hand Shaken"
 tv_arts_exhibition.371.d: "The noise of the contest proves cruel. One artist begins with confidence, then hears every cough, every whisper, every small shift of boredom as if it were a verdict. The [tv_domestic_exhibition|e] promised public creation, but public judgment has teeth. They leave the floor less certain than before, carrying a wound no bandage can show. Applause, when withheld, is a very precise instrument."
 tv_arts_exhibition.371.a: "Public judgment can wound."
 tv_arts_exhibition.372.t: "Local Exhibition：The Crowd Leans In"
 tv_arts_exhibition.372.d: "Brushes move, chisels bite, ink darkens, and the audience forgets to breathe. The crowd has seen finished art before, but watching creation happen feels almost forbidden, like looking behind a curtain and finding a storm. Children stand on benches, patrons lean past etiquette, and even bored officials stop pretending to review documents. [tv_local_exhibition_enthusiasm|E] rises simply because the hall has become alive. For once, everyone understands why artists hate interruptions."
 tv_arts_exhibition.372.a: "This is why they came."
 tv_arts_exhibition.373.t: "Local Exhibition：A Final Masterwork"
 tv_arts_exhibition.373.d: "One artist gives everything to the contest. The work advances with frightening speed, as if their hand has decided the body may settle its complaints later. When the final stroke is made, they collapse beyond recovery, and the hall's applause breaks into grief. The [tv_domestic_exhibition|e] receives both creation and death in the same terrible hour. The new work will carry their name, but no honor can make the price gentle."
 tv_arts_exhibition.373.a: "May the work carry their name."
 tv_arts_exhibition.374.t: "Local Exhibition：A Work Born in Public"
 tv_arts_exhibition.374.d: "The contest produces a new artwork before the eyes of the crowd. It is still raw with the heat of its making, smelling of pigment, oil, pressure, and nerves. People argue over it before it has fully dried, which may be the clearest sign that it matters. The [tv_domestic_exhibition|e] has not merely displayed culture today; it has manufactured it in public. The hall feels larger for having witnessed the birth."
 tv_arts_exhibition.374.a: "Place it among the collection."

 tv_arts_exhibition.400.t: "Arts Exchange：Domestic Artists Join"
 tv_arts_exhibition.400.d.3: "The [tv_arts_exchange|E] has found its rhythm. The [tv_chief_artist|e] has chosen the rooms, arranged the first demonstrations, and ensured the wine is good enough to loosen pride without drowning judgment. Invitations have gone out to [SCOPE.sCharacter('tv_arts_exchange_auto_invite_1_scope').GetShortName], [SCOPE.sCharacter('tv_arts_exchange_auto_invite_2_scope').GetShortName], and [SCOPE.sCharacter('tv_arts_exchange_auto_invite_3_scope').GetShortName]. They will join the gathering as rivals, collaborators, and witnesses. By year's end, none of them should be able to claim they learned nothing."
 tv_arts_exhibition.400.d.2: "The [tv_arts_exchange|E] has found its rhythm. The [tv_chief_artist|e] has chosen the rooms, arranged the first demonstrations, and ensured the wine is good enough to loosen pride without drowning judgment. Invitations have gone out to [SCOPE.sCharacter('tv_arts_exchange_auto_invite_1_scope').GetShortName] and [SCOPE.sCharacter('tv_arts_exchange_auto_invite_2_scope').GetShortName]. They will join the gathering as rivals, collaborators, and witnesses. By year's end, none of them should be able to claim they learned nothing."
 tv_arts_exhibition.400.d.1: "The [tv_arts_exchange|E] has found its rhythm. The [tv_chief_artist|e] has chosen the rooms, arranged the first demonstrations, and ensured the wine is good enough to loosen pride without drowning judgment. An invitation has gone out to [SCOPE.sCharacter('tv_arts_exchange_auto_invite_1_scope').GetShortName]. They will join the gathering as rival, collaborator, and witness. By year's end, no one should be able to claim the room was quiet."
 tv_arts_exhibition.400.d.0: "The [tv_arts_exchange|E] has found its rhythm, though no suitable domestic artist is currently available for an automatic invitation. The [tv_chief_artist|e] has chosen the rooms, arranged the first demonstrations, and ensured the wine is good enough to loosen pride without drowning judgment. Empty chairs are not ideal, but they can still be useful accusations. The gathering begins with whoever is willing to answer the call. A small circle can still cut deeply."
 tv_arts_exhibition.400.a: "Let the conversation widen."

 tv_arts_exhibition.401.t: "Arts Exchange：Joyful Exchange of Technique"
 tv_arts_exhibition.401.d: "[SCOPE.sCharacter('tv_arts_exchange_artist_1').GetShortName] and [SCOPE.sCharacter('tv_arts_exchange_artist_2').GetShortName] spend long hours comparing methods, correcting gestures, and laughing over old mistakes. The [tv_arts_exchange|e] has given them permission to say what court etiquette usually buries beneath compliments. A bad line is named, a lazy habit exposed, and a clever solution borrowed without shame. By evening, both artists are tired in the useful way. Their rivalry has become a whetstone."
 tv_arts_exhibition.401.a: "Let them keep each other honest."
 tv_arts_exhibition.402.t: "Arts Exchange：A Moment of Insight"
 tv_arts_exhibition.402.d: "[SCOPE.sCharacter('tv_arts_exchange_artist_1').GetShortName] draws more from the [tv_arts_exchange|e] than anyone expected. A stray comment, perhaps meant as a joke, catches in their mind and refuses to leave. They return to old exercises with new impatience, then to new sketches with surprising calm. By the time others notice, the change has already settled into their hand and eye. A single spark has found dry tinder."
 tv_arts_exhibition.402.a: "A single spark is enough."
 tv_arts_exhibition.403.t: "Arts Exchange：A Master Leads the Room"
 tv_arts_exhibition.403.d: "[SCOPE.sCharacter('tv_arts_exchange_leading_artist').GetShortName]'s exceptional technique becomes the center of the meeting. At first the others pretend to watch casually, but mastery is a poor thing to observe from the corner of the eye. Soon the whole [tv_arts_exchange|e] has bent toward their table. Every motion becomes instruction, every correction a small public event. The room has found its temporary master."
 tv_arts_exhibition.403.a: "Let every hand study the master."
 tv_arts_exhibition.404.t: "Arts Exchange：A Feast Too Far"
 tv_arts_exhibition.404.d: "[SCOPE.sCharacter('tv_arts_exchange_artist_1').GetShortName] discovers that the exchange table is also very well supplied. Bread, wine, fruit, sauces, and flattery all arrive faster than discipline can refuse them. The [tv_arts_exchange|e] was meant to nourish technique, but the body has interpreted the assignment more literally. Not all excess leads to inspiration. Some of it leads to a difficult afternoon and a lesson in moderation."
 tv_arts_exhibition.404.a: "Perhaps the table was too generous."
 tv_arts_exhibition.405.t: "Arts Exchange：Praise from Abroad"
 tv_arts_exhibition.405.d: "[SCOPE.sCharacter('tv_arts_exchange_foreign_artist').GetShortName] praises the [tv_arts_exchange|e] as a gathering of rare quality. Because the compliment is foreign, everyone at court repeats it with twice the care and half the skepticism. The phrase travels from workshop to salon, acquiring ornament at every stop. Our own artists pretend not to need outside approval, but they stand a little taller all the same. [tv_arts_intl_influence|E] sometimes begins as a sentence overheard at the right table."
 tv_arts_exhibition.405.a: "Let the praise travel further."
 tv_arts_exhibition.406.t: "Arts Exchange：A Masterpiece Before All"
 tv_arts_exhibition.406.d: "Under the eyes of the assembled artists, [SCOPE.sCharacter('tv_arts_exchange_masterpiece_artist').GetShortName] creates a work that seems destined to outlive the meeting itself. The [tv_arts_exchange|e] falls quiet in the rare way that is not boredom but concentration shared by an entire room. Each witness will later claim they saw the decisive moment first. Perhaps none of them did. The work has already begun escaping into legend."
 tv_arts_exhibition.406.a: "Give the work pride of place."
 tv_arts_exchange_masterpiece: "$TARGET$'s Exchange Masterpiece"
 tv_arts_exchange_masterpiece_desc: "A work created before the assembled [tv_arts_exchange|e], carrying its maker's signature and the memory of many sharpened hands."
 tv_arts_exhibition.407.t: "Arts Exchange：The Capital Comes Alive"
 tv_arts_exhibition.407.d: "The capital's halls, workshops, and salons glow with the [tv_arts_exchange|e]'s energy. Apprentices imitate arguments they did not fully understand, patrons repeat terms they learned yesterday, and taverns discover that artistic gossip drinks well. Even those outside the meeting feel that the realm's culture has deepened. The city is not merely hosting a gathering; it is absorbing one. For a season, every street seems to lead toward a brighter room."
 tv_arts_exhibition.407.a: "The city will remember this season."
 tv_arts_exhibition.408.t: "Arts Exchange：A Folk Artist Pushes In"
 tv_arts_exhibition.408.d: "A folk artist slips through the crowd and refuses to leave. Their manners are rough, their skill unpredictable, and their confidence impossible to ignore. Several refined participants object on principle, then look again at the work and begin objecting more quietly. The [tv_arts_exchange|e] has accidentally found the kind of talent that enters through a side door because no front door was built for it. Dismissing them would protect decorum. Recruiting them may improve art."
 tv_arts_exhibition.408.a: "Recruit them and let them join."
 tv_arts_exhibition.409.t: "Arts Exchange：The King Is Drawn In"
 tv_arts_exhibition.409.d: "The ruler's curiosity brings them to the [tv_arts_exchange|e]. They expected diversion, perhaps flattery, but instead found argument performed with blades hidden in silk. Artists negotiate insult, praise, silence, and concession with a precision diplomats would recognize if they were less vain. By the time the ruler leaves, cultivated wit has sharpened their diplomatic instincts. Art has provided a lesson without admitting it was instruction."
 tv_arts_exhibition.409.a: "Let the crown listen and learn."
 tv_arts_exhibition.410.t: "Arts Exchange：Arguments Without End"
 tv_arts_exhibition.410.d: "The participants circle one question until every answer has become an objection. The [tv_arts_exchange|e] spends an entire day proving that very clever people can build a maze out of definitions. Nothing is settled, though everyone insists the debate was necessary and privately believes they were closest to victory. Assistants quietly remove empty cups, unfinished sketches, and the same argument written three different ways. No masterpiece emerges, but at least the room is thoroughly awake."
 tv_arts_exhibition.410.a: "So be it."
 tv_arts_exhibition.420.t: "Arts Exchange：The Gathering Concludes"
 tv_arts_exhibition.420.d: "After a full year of visits, arguments, demonstrations, and unexpected friendships, the [tv_arts_exchange|e] closes. The rooms are cleared slowly, as if the servants fear sweeping away an idea still hiding under a bench. Artists depart with sharper hands, new resentments, borrowed habits, and friendships they may deny in public. Patrons ask when the next gathering will be held before the last lamps are cold. The [tv_arts_exhibition|e] has not ended the conversation; it has taught the realm how much conversation can change."
 tv_arts_exhibition.420.a: "Close the hall, not the argument."

