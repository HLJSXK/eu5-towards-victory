 tv_engineering_department.1012.t:0 "The Pledge Rolls Are Opened"
 tv_engineering_department.1012.d:0 "With the charter sworn, the harder work begins: making the ledger credible enough to lend against. Customs farmers, salt tax officials, harbor toll collectors, mint assayers, and the keepers of the state archive are summoned to the bank hall, each bearing the accounts of a revenue stream the Republic might pledge. Old war debts alone cannot carry the bank's credit; they must be joined by taxes and tolls the merchants can trust."
 tv_engineering_department.1012.a:0 "Open the pledge rolls."
 tv_engineering_department.1013.t:0 "Debts, Duties, and the Archive Vault"
 tv_engineering_department.1013.d:0 "One by one the rows are weighed: the old war debts that first justified the compere, the customs dues on every galley that clears the mole, the salt tax collected in every market, the port tolls levied at the chain across the harbor mouth, the coin assays that certify each struck ducat, and the archive volumes that record every prior loan. Pledging too many strains the Republic's own treasury; pledging too few leaves the ledger looking hollow to the men who must trust it."
 tv_engineering_department.1013.a:0 "Assign the pledge rows."
 tv_engineering_department.1014.t:0 "A Pledge Falls Into Doubt"
 tv_engineering_department.1014.d:0 "Before the ink can dry on the assignments, one pledge wavers: a shortfall in the salt tax, a rumor of clipped coin among the assays, or a customs farmer who cannot meet his quarter's due. Left unaddressed, distrust in one row threatens to spread across the whole ledger, and the bank's default risk climbs with every week the shortfall goes unanswered."
 tv_engineering_department.1014.a:0 "Guarantee the pledge with treasury reserves."
 tv_engineering_department.1014.b:0 "Narrow the pledge to the streams already proven sound."
 tv_engineering_department.1015.t:0 "The Ledger Is Honored"
 tv_engineering_department.1015.d:0 "The disputed pledge is settled, the archive volumes are sealed with the bank's mark, and every revenue stream from old war debts to coin assays now stands recorded as honored collateral. Merchants, customs farmers, and the doge's own treasury can point to the ledger and trust what it says. The Bank of Saint George's public credit is no longer a promise; it is a debt the Republic itself will not default upon."
 tv_engineering_department.1015.a:0 "Honor the pledge roll."
 tv_engineering_department.1854.t:0 "The Ledger Oath of San Giorgio"
 tv_engineering_department.1854.d:0 "In the bank hall by the harbor, the doge's officers, Anziani, merchant creditors, notaries, mint masters, customs farmers, and armed guards gather around the great ledger. Genoa's tangled war debts and its restless creditors can no longer be managed as private compere; the Republic means to bind them into one sworn institution. Before any coin is struck or any charter written, the oath itself must be opened."
 tv_engineering_department.1854.a:0 "Open the ledger oath."
 tv_engineering_department.1855.t:0 "Creditors, Crown, or Common Market"
 tv_engineering_department.1855.d:0 "Three drafts lie on the table: a Creditor Privilege Charter that gives the compere's old creditors first claim on the ledger, a Crown Supervision Charter that lets the doge's officers police every entry, and an Open Merchant Access Charter that lets any trading house buy into the bank on equal terms. Each path promises the same public credit, but each hands trust, and blame, to a different hand. The notaries wait to copy whichever draft the founders choose to swear."
 tv_engineering_department.1855.a:0 "Choose the founding charter."
 tv_engineering_department.1856.t:0 "The First Test of Trust"
 tv_engineering_department.1856.d:0 "The ink is barely dry before the charter is tested. Creditors under privilege begin dictating terms to the mint; crown officers under supervision alarm the merchant houses they were meant to reassure; or open access draws in pledges the bank cannot yet verify. Whichever branch was sworn, the bank hall now rings with accusations of favoritism, distrust, or looming default."
 tv_engineering_department.1856.a:0 "Curb the overreach and renegotiate the charter's terms."
 tv_engineering_department.1856.b:0 "Stand by the charter and absorb the political cost."
 tv_engineering_department.1857.t:0 "San Giorgio's Seal"
 tv_engineering_department.1857.d:0 "The charter is sealed before the assembled officers, creditors, and merchants, and a freshly assayed coin is set beside the ledger as proof of trust restored. Notaries copy the sworn terms for the archive, customs farmers post the charter at the harbor gate, and the Bank of Saint George stands as public authority rather than private compere. Genoa's public credit now has a name, a seal, and a single voice."
 tv_engineering_department.1857.a:0 "Seal the public credit."
