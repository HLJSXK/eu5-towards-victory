 tv_engineering_department.1670.t:0 "The Ledger Oath of San Giorgio"
 tv_engineering_department.1670.d:0 "The doge's officers, merchant creditors, notaries, mint masters, and customs farmers gather around the ledger oath. Three charters are drafted for the founders to weigh: creditor privilege, crown supervision, and open merchant access."
 tv_engineering_department.1670.a:0 "Open the ledger oath."
 tv_engineering_department.1671.t:0 "Creditors, Crown, or Common Market"
 tv_engineering_department.1671.d:0 "Each charter is tested against the council's trust: the Creditor Privilege Charter for the war creditors, the Crown Supervision Charter for royal officers, and the Open Merchant Access Charter for the wider trading public."
 tv_engineering_department.1671.a:0 "Weigh the council's trust in each charter."
 tv_engineering_department.1672.t:0 "The First Test of Trust"
 tv_engineering_department.1672.d:0 "Creditor overreach, crown distrust, or open-market default pressure threatens to discredit a charter before the bank's seal can be trusted."
 tv_engineering_department.1672.a:0 "Curb the overreach and renegotiate."
 tv_engineering_department.1672.b:0 "Stand by the charter and absorb the cost."
 tv_engineering_department.1673.t:0 "San Giorgio's Seal"
 tv_engineering_department.1673.d:0 "The founding charters are sealed. Creditors, crown officers, and merchants alike now recognize San Giorgio's authority over debts, taxes, and coin trust."
 tv_engineering_department.1673.a:0 "Seal the founding charters."
 tv_engineering_department.1674.t:0 "The Pledge Rolls Are Opened"
 tv_engineering_department.1674.d:0 "The old war debts, customs dues, salt tax, port tolls, coin assays, and archive volumes are all opened for pledge before the public ledger can be trusted."
 tv_engineering_department.1674.a:0 "Open the pledge rolls."
 tv_engineering_department.1675.t:0 "Debts, Duties, and the Archive Vault"
 tv_engineering_department.1675.d:0 "Each pledge is weighed for trust: the old war debts against past defaults, the customs dues and salt tax against smuggling, the port tolls against harbor traffic, the coin assays against clipped currency, and the archive volumes against fire and rot."
 tv_engineering_department.1675.a:0 "Weigh the trust of each pledge."
 tv_engineering_department.1676.t:0 "A Pledge Falls Into Doubt"
 tv_engineering_department.1676.d:0 "A defaulted debt, a smuggled cargo, or a rotted archive volume threatens to make one of the pledges worthless before the ledger is honored."
 tv_engineering_department.1676.a:0 "Guarantee it with treasury reserves."
 tv_engineering_department.1676.b:0 "Narrow the ledger to proven streams only."
 tv_engineering_department.1677.t:0 "The Ledger Is Honored"
 tv_engineering_department.1677.d:0 "Old war debts, customs dues, salt tax, port tolls, coin assays, and archive volumes are all pledged into a ledger the public now trusts."
 tv_engineering_department.1677.a:0 "Honor the ledger."
