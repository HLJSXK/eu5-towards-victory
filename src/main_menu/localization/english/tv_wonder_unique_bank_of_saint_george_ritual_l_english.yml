 tv_engineering_department.1670.t:0 "The Ledger Oath of San Giorgio"
 tv_engineering_department.1670.d:0 "The doge's officers, merchant creditors, notaries, mint masters, and customs farmers gather around the ledger oath. Before it can be sworn, one of three founding charters must be chosen."
 tv_engineering_department.1670.a:0 "Open the ledger oath."
 tv_engineering_department.1671.t:0 "Creditors, Crown, or Common Market"
 tv_engineering_department.1671.d:0 "Creditor Privilege favors the war creditors, but risks the old debts and the coin assays. Crown Supervision favors royal officers, but risks the customs dues and the salt tax. Open Merchant Access favors the wider trading public, but risks the port tolls and the archive volumes."
 tv_engineering_department.1671.a:0 "Creditor Privilege Charter."
 tv_engineering_department.1671.b:0 "Crown Supervision Charter."
 tv_engineering_department.1671.c:0 "Open Merchant Access Charter."
 tv_engineering_department.1672.t:0 "The First Test of Trust"
 tv_engineering_department.1672.d:0 "The pledges put at risk by the chosen charter now fall into doubt. The treasury can guarantee them outright, or the ledger can be narrowed to the streams that were never in question."
 tv_engineering_department.1672.a:0 "Guarantee them with treasury reserves. (-3 treasury)"
 tv_engineering_department.1672.b:0 "Narrow the ledger to the proven streams."
 tv_engineering_department.1673.t:0 "San Giorgio's Seal"
 tv_engineering_department.1673.d:0 "The founding charter is sealed. Creditors, crown officers, and merchants alike now recognize San Giorgio's authority over debts, taxes, and coin trust."
 tv_engineering_department.1673.a:0 "Seal the founding charter."
