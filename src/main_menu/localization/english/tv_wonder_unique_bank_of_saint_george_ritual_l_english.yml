 tv_engineering_department.1670.t:0 "The Compere Ledger Convenes"
 tv_engineering_department.1670.d:0 "The doge's officers, Anziani, merchant creditors, notaries, mint masters, and customs farmers gather to found a funded public debt: a single compere ledger, backed by pledged revenue, that will pay itself down over years rather than remain a floating obligation forever."
 tv_engineering_department.1670.a:0 "Convene the compere assembly."
 tv_engineering_department.1671.t:0 "The Founding Charter"
 tv_engineering_department.1671.d:0 "Three charters would fund the consolidated debt differently. The Conservative Sinking Fund borrows least and grows slowest, but is cheapest to found and safest to service. The Balanced Compere borrows more at a middling pace. The Aggressive Consolidation borrows heavily to retire old obligations at once, at a steep founding cost and a heavier monthly service burden."
 tv_engineering_department.1671.a:0 "Conservative Sinking Fund Charter. (-2 treasury; smaller debt, modest pledge, patient schedule.)"
 tv_engineering_department.1671.b:0 "Balanced Compere Charter. (-4 treasury; moderate debt and pledge.)"
 tv_engineering_department.1671.c:0 "Aggressive Consolidation Charter. (-7 treasury; largest debt, heaviest pledge, fastest possible payoff.)"
 tv_engineering_department.1672.t:0 "The Ledger Assembly Convenes"
 tv_engineering_department.1672.d:0 "As the compere ledger runs its course, the assembly of creditors and officers periodically reviews its pace. The debt can be pushed toward faster retirement, or left to its charter's own schedule."
 tv_engineering_department.1672.race_close.d:0 "The restructuring deadline is now close, and the ledger is still not clear. Without a decisive push, the compere debt risks being forced into restructuring rather than retired on the assembly's own terms."
 tv_engineering_department.1672.a:0 "Advance a lump sum from the treasury to retire debt early. (-5 treasury)"
 tv_engineering_department.1672.b:0 "Requisition additional pledged revenue permanently."
 tv_engineering_department.1672.c:0 "Maintain steady administration; change nothing."
 tv_engineering_department.1673.t:0 "The Seal of San Giorgio"
 tv_engineering_department.1673.d:0 "Whether retired ahead of schedule, on schedule, after long patience, or restructured at the deadline, the compere ledger is sealed. San Giorgio's authority over Genoa's public credit, pledged revenue, and coin trust is now permanent."
 tv_engineering_department.1673.a:0 "Seal the compere ledger."
