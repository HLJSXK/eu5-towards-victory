l_english:
 # ── Towards Victory — Game Concepts ───────────────────────────────────────
 game_concept_tv_conquest_score: "Conquest Score"
 game_concept_tv_conquest_score_desc: "The Conquest Score measures the territorial extent of your realm. Each location you directly own adds 1 point; each location held by a [subject|e] or lower-ranked country adds 0.5 points. Updated monthly. Reach 2,000 to achieve the long-term [tv_victory_situation|E]."

 game_concept_tv_prosperity_score: "Prosperity Score"
 game_concept_tv_prosperity_score_desc: "The Prosperity Score tracks the domestic development of your realm. It accumulates as the sum of your total population, development across all owned locations, and your country tax base. Updated yearly. Reach 25,000 to achieve the long-term [tv_victory_situation|E]."

 game_concept_tv_trade_score: "Trade Score"
 game_concept_tv_trade_score_desc: "The Trade Score reflects your commercial power. It is a monthly snapshot of your country's total monthly [trade_income|e]. Reach 2,000 to achieve the long-term [tv_victory_situation|E]."

 game_concept_tv_diplomatic_victory_points: "Diplomatic Victory Points"
 game_concept_tv_dvp: "DVP"
 game_concept_tv_diplomatic_victory_points_desc: "Diplomatic Victory Points (DVP) are earned permanently through statecraft: each [royal_marriage|e] concluded grants +3 DVP to both parties, and winning a [war|e] grants +5 DVP to the victor. DVP never decrease. Reach 580 to achieve the long-term [tv_victory_situation|E]."

 game_concept_tv_cultural_influence_points: "Cultural Influence Points"
 game_concept_tv_cip: "CIP"
 game_concept_tv_cultural_influence_points_desc: "Cultural Influence Points (CIP) are earned through artistic achievement: each [work_of_art|e] created grants +10 CIP to the owner's country, and +1 CIP is earned passively each month. CIP never decrease. Reach 580 to achieve the long-term [tv_victory_situation|E]."

 game_concept_tv_science_score: "Science Score"
 game_concept_tv_science_score_desc: "The Science Score tracks the technological progress of your realm. It is a monthly snapshot of the total number of [advances|e] your country has researched. Reach 400 to achieve the long-term [tv_victory_situation|E]."

 # ── Situation ──────────────────────────────────────────────────────────────
 game_concept_tv_victory_situation: "Victory Path"
 game_concept_tv_victory_situation_desc: "The Victory Path is a permanent situation active for all countries. It tracks progress across all six paths to supremacy simultaneously. Each path has five milestones; reaching Milestone 3 earns a Short-term Victory bonus and reaching Milestone 5 clinches a Long-term Victory. Monitor your own progress and your rivals' through the Victory Path panel."

 # ── Six Victory Types ──────────────────────────────────────────────────────
 game_concept_tv_conquest_victory: "Conquest Victory"
 game_concept_tv_conquest_victory_desc: "Dominate the world through territorial expansion. Your [tv_conquest_score|e] measures the size of your realm—direct holdings count fully, subject and vassal locations at half weight. Milestones at 150, 300, 500, 1,000, and 2,000 reward military capability and leave a grand legacy."

 game_concept_tv_prosperity_victory: "Prosperity Victory"
 game_concept_tv_prosperity_victory_desc: "Build the wealthiest and most developed nation. Your [tv_prosperity_score|e] is a composite of total population, development across all owned locations, and country tax base. Milestones at 5,000, 8,000, 12,000, 18,000, and 25,000 reward domestic production, population growth, and construction power."

 game_concept_tv_trade_victory: "Trade Victory"
 game_concept_tv_trade_victory_desc: "Command the world's commerce. Your [tv_trade_score|e] is a monthly snapshot of your total monthly trade income. Milestones 3 and 5 also require leading market dominance (5 and 10 markets respectively). Rewards focus on merchant capacity, trade efficiency, and trade income multipliers."

 game_concept_tv_diplomatic_victory: "Diplomatic Victory"
 game_concept_tv_diplomatic_victory_desc: "Forge the world's most powerful network of alliances and influence. [tv_dvp|e] accumulate permanently through royal marriages (+3 each) and won wars (+5). Milestones at 50, 120, 220, 380, and 580 reward diplomatic reputation, alliance reliability, vassal management, and prestige."

 game_concept_tv_cultural_victory: "Cultural Victory"
 game_concept_tv_cultural_victory_desc: "Shape civilization through art and cultural exports. [tv_cip|e] accumulate permanently—+10 per work of art created and +1 per month passively. Milestones 2–5 also require minimum [tv_arts_intl_influence|e] (25, 50, 75, 100). Rewards enhance artist skill, prestige, and cultural tradition."

 game_concept_tv_science_victory: "Scientific Victory"
 game_concept_tv_science_victory_desc: "Lead humanity into the age of reason. Your [tv_science_score|e] tracks total advances researched. Each milestone also requires the corresponding phase of the [tv_academy_of_sciences|e] to be constructed in your capital. Rewards accelerate research, institution spread, and production."

 # ── Cultural Victory Unique Mechanics ──────────────────────────────────────
 game_concept_tv_arts_intl_influence: "International Influence"
 game_concept_tv_arts_intl_influence_desc: "A measure of your country's cultural reach beyond its borders, accumulated through the [tv_arts_exhibition|e]. Gained by sending artists on foreign tours and hosting domestic exhibitions. Decays by −0.05 each month as the impact of past cultural exports fades. Cultural Victory Milestones 2 through 5 require minimum International Influence of 25, 50, 75, and 100 respectively."

 game_concept_tv_arts_exhibition: "Arts Exhibition"
 game_concept_tv_arts_exhibition_desc: "An international organization uniting culturally ambitious powers. Countries automatically join upon reaching Cultural Victory Milestone 1 (50 [tv_cip|e]). Membership unlocks two generic actions: 'Send Artist Abroad' (200 ducats; deploys an artist on a 1–10 year foreign tour with monthly events that affect [tv_arts_intl_influence|e]) and 'Host Domestic Exhibition' (1,000 ducats; grants +0.1 [tv_arts_intl_influence|e] per owned artwork)."
 # ── Scientific Victory Unique Mechanics ────────────────────────────────────
 game_concept_tv_academy_of_sciences: "Academy of Sciences"
 game_concept_tv_academy_of_sciences_desc: "A five-phase capital building that gates each Scientific Victory milestone. Phase I unlocks once your [tv_science_score|e] reaches 100; subsequent phases unlock at 150, 200, 300, and 400 respectively. Each phase must be physically constructed in your capital before the corresponding milestone can fire. The Academy is visible in every capital from the start of the game."
 # ── Conquest Victory Unique Mechanics ──────────────────────────────────────
 game_concept_tv_govhouse: "Governor's House"
 game_concept_tv_govhouse_desc: "An international organization established at Conquest Victory Milestone 1. The founding country appoints a Grand General and can assign governors to areas within their realm. Each governor reduces construction costs and unrest while increasing maximum control in their governed area, scaled to their military attributes."
