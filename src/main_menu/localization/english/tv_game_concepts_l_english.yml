 # ── Towards Victory — Game Concepts ───────────────────────────────────────
 game_concept_tv_conquest_score: "Conquest Score"
 game_concept_tv_conquest_score_desc: "The Conquest Score measures the territorial extent of your realm. Each location you directly own adds 1 point; each location held by a [subject|e] or lower-ranked country adds 0.5 points. Updated monthly. Reach 2,500 to achieve the long-term [tv_victory_situation|E]."

 game_concept_tv_prosperity_score: "Prosperity Score"
 game_concept_tv_prosperity_score_desc: "The Prosperity Score tracks the domestic development of your realm. It combines total population, development across all owned locations, and country tax base, then scales the result by country size, stability, and government power. Updated yearly. Reach 11,000 to achieve the long-term [tv_victory_situation|E]."

 game_concept_tv_trade_score: "Trade Score"
 game_concept_tv_trade_score_desc: "The Trade Score reflects your commercial power. It is a monthly snapshot of your country's total monthly [trade_income|e]. Reach 2,000 to achieve the long-term [tv_victory_situation|E]."

 game_concept_tv_diplomatic_victory_points: "Diplomatic Victory Points"
 game_concept_tv_dvp: "DVP"
 game_concept_tv_diplomatic_victory_points_desc: "Diplomatic Victory Points (DVP) are earned through the [tv_diplomatic_alliance|e] reform path and diplomatic forecasting. Two countries offering [tv_diplomatic_support|e] found the alliance and grant the first point; later points come from monthly [tv_alliance_tier|e] output. Milestones are 1, 50, 500, 2,500, and 15,000 DVP."

 game_concept_tv_cultural_influence_points: "Cultural Influence Points"
 game_concept_tv_cip: "CIP"
 game_concept_tv_cultural_influence_points_desc: "Cultural Influence Points (CIP) are earned through artistic achievement: each [work_of_art|e] created grants +3 CIP to the owner's country, and +1 CIP is earned passively each month. CIP never decrease. Reach 1,600 to achieve the long-term [tv_victory_situation|E]."

 game_concept_tv_science_score: "Science Score"
 game_concept_tv_science_score_desc: "The Science Score tracks the technological progress of your realm. It is a monthly snapshot of the total number of [advances|e] your country has researched. Reach 400 to achieve the long-term [tv_victory_situation|E]."

 # ── Situation ──────────────────────────────────────────────────────────────
 game_concept_tv_victory_situation: "Victory Path"
 game_concept_tv_victory_situation_desc: "The Victory Path is a permanent situation active for all countries. It tracks progress across all six paths to supremacy simultaneously. Each path has five milestones; reaching Milestone 3 earns a Short-term Victory bonus and reaching Milestone 5 clinches a Long-term Victory. Monitor your own progress and your rivals' through the Victory Path panel."

 # ── Six Victory Types ──────────────────────────────────────────────────────
 game_concept_tv_conquest_victory: "Conquest Victory"
 game_concept_tv_conquest_victory_desc: "Dominate the world through territorial expansion. Your [tv_conquest_score|e] measures the size of your realm: direct holdings count fully, subject and vassal locations at half weight. Milestones at 200, 400, 600, 1,200, and 2,500 reward military capability and leave a grand legacy."

 game_concept_tv_prosperity_victory: "Prosperity Victory"
 game_concept_tv_prosperity_victory_desc: "Build the wealthiest and most developed nation. Your [tv_prosperity_score|e] rewards large, stable, well-governed development rather than raw size alone. Milestones at 2,000, 3,000, 5,000, 7,000, and 11,000 reward domestic production, population growth, and construction power."

 game_concept_tv_trade_victory: "Trade Victory"
 game_concept_tv_trade_victory_desc: "Command the world's commerce. Your [tv_trade_score|e] is a monthly snapshot of your total monthly trade income. Milestone 1 founds the [tv_trade_league|e]; Milestones 3 and 5 also require leading market dominance (5 and 10 markets respectively). Rewards focus on merchant capacity, trade efficiency, and trade income multipliers."

 game_concept_tv_diplomatic_victory: "Diplomatic Victory"
 game_concept_tv_diplomatic_victory_desc: "Forge the world's most powerful network of alliances and influence. The first milestone requires 2 countries offering [tv_diplomatic_support|e], founds the [tv_diplomatic_alliance|e], and grants the first [tv_dvp|e]. Further [tv_dvp|e] are generated each month from [tv_alliance_tier|e], with milestones at 1, 50, 500, 2,500, and 15,000."

 game_concept_tv_cultural_victory: "Cultural Victory"
 game_concept_tv_cultural_victory_desc: "Shape civilization through art and cultural exports. [tv_cip|e] accumulate permanently: +3 per work of art created and +1 per month passively. Milestones at 50, 200, 400, 800, and 1,600 reward artistic skill, prestige, and cultural tradition. Milestones 2 through 5 also require minimum [tv_arts_intl_influence|e] of 25, 50, 75, and 100."

 game_concept_tv_science_victory: "Scientific Victory"
 game_concept_tv_science_victory_desc: "Lead humanity into the age of reason. Your [tv_science_score|e] tracks total advances researched. Each milestone also requires the corresponding phase of the [tv_academy_of_sciences|e] to be constructed in your capital. Rewards accelerate research, institution spread, and production."

 # ── Prosperity Victory Unique Mechanics ───────────────────────────────────
 game_concept_tv_engineering_department: "Engineering Department"
 game_concept_tv_engineering_department_desc: "A non-unique international organization founded at [tv_prosperity_victory|e] Milestone 1. It holds the [tv_great_engineer|e] office and manages wonder proposals, debate, site selection, organization, logistics, and [tv_wonder_construction|e]."

 game_concept_tv_great_engineer: "Great Engineer"
 game_concept_tv_great_engineer_desc: "The appointed character who leads the [tv_engineering_department|e]. The [tv_great_engineer|e] is stored as a country variable and can be appointed, replaced, or dismissed from the [tv_engineering_department|e] panel."

 game_concept_tv_wonder_survey: "Wonder Survey"
 game_concept_tv_wonder_survey_desc: "The site-assessment stage of [tv_wonder_construction|e]. Survey progress rises monthly from the [tv_great_engineer|e]'s Military skill, reveals Scale, Logistics, and Organization competence, and lets the country confirm a construction site once the readings are complete."

 game_concept_tv_wonder_materials: "Wonder Materials"
 game_concept_tv_wonder_materials_desc: "A produced market good used to maintain $tv_wonder_labor_camp$ during active [tv_wonder_construction|e]. Wonder Material Workshops convert basic construction goods into [tv_wonder_materials|e], so supply and price are handled through the normal market."

 game_concept_tv_wonder_ceremony: "Wonder Ceremony"
 game_concept_tv_wonder_ceremony_desc: "The final dedication of a completed [tv_wonder_construction|e] project. The chosen ceremony branch determines the monument's final building, permanent country modifier, and last burst of prestige, stability, and legitimacy from remaining [tv_wonder_domestic_support|e]."

 game_concept_tv_wonder_construction: "Wonder Construction"
 game_concept_tv_wonder_construction_desc: "A [tv_prosperity_victory|e] mechanism managed through the [tv_engineering_department|e]. A [tv_great_engineer|e] proposes a feasible [tv_wonder_small|e], [tv_wonder_medium|e], or [tv_wonder_large|e] wonder, the country resolves domestic debate, then selects a site, organizes labor, gathers materials, and builds four construction parts into a wonder level."

 game_concept_tv_wonder_small: "Small Wonder"
 game_concept_tv_wonder_small_desc: "A [tv_wonder_construction|e] size class. Small wonders usually require less construction progress and are easier to complete, but their ceremonies are relatively complex and still need careful political preparation."

 game_concept_tv_wonder_medium: "Medium Wonder"
 game_concept_tv_wonder_medium_desc: "A [tv_wonder_construction|e] size class between small and large wonders. Medium wonders require more sustained organization and resources, with rewards and ceremony pressure between the two extremes."

 game_concept_tv_wonder_large: "Large Wonder"
 game_concept_tv_wonder_large_desc: "A [tv_wonder_construction|e] size class. Large wonders are harder to complete and demand a strong economic base and mobilization capacity, but their rewards are correspondingly richer."

 game_concept_tv_wonder_sacred_mountain: "Sacred Mountain Complex"
 game_concept_tv_wonder_sacred_mountain_desc: "A mountain sanctuary of terraces, stairways, shrines, and solemn halls, raised where earth seems nearest to the heavens. Pilgrims climb through incense and stone while the court's authority gathers a sacred weight, making faith feel less like command than landscape."

 game_concept_tv_wonder_triumphal_axis: "Triumphal Axis City"
 game_concept_tv_wonder_triumphal_axis_desc: "A ceremonial city plan of straight avenues, grand squares, victory gates, parade grounds, and palace fronts. It turns movement itself into theatre: emissaries, soldiers, and citizens pass through ordered stone and learn who stands at the center."

 game_concept_tv_wonder_great_port: "Great Port"
 game_concept_tv_wonder_great_port_desc: "A colossal harbor of breakwaters, quays, warehouses, arsenals, and market halls, built to make the sea enter the realm on royal terms. Masts gather beneath its towers, coin follows the tide, and distant courts learn the city by its waterfront."

 game_concept_tv_wonder_giant_necropolis: "Giant Necropolis Complex"
 game_concept_tv_wonder_giant_necropolis_desc: "A vast royal burial landscape of tomb terraces, processional roads, mortuary chapels, and guarded gardens. It grows strongest among hills and near settled places, turning dynastic memory into stone, ritual, and public order."

 game_concept_tv_wonder_great_lighthouse: "Great Lighthouse"
 game_concept_tv_wonder_great_lighthouse_desc: "A monumental beacon raised above a harbor mouth, binding trade routes and naval reach to a single flame. Better harbor capacity makes the site stronger, while its ceremonies shape whether the lighthouse serves fleet, merchants, or maritime watch."

 game_concept_tv_wonder_hydraulic_workshop: "Hydraulic Workshop Complex"
 game_concept_tv_wonder_hydraulic_workshop_desc: "A district of canals, wheels, reservoirs, workshops, and measured sluices. It benefits from already built local infrastructure, then turns water control into production, construction capacity, and civic authority."

 game_concept_tv_wonder_mining_city: "Mining City"
 game_concept_tv_wonder_mining_city_desc: "A planned extraction city of shafts, ore yards, drainage works, markets, and minting houses. High development and rural mineral frontiers suit it best, and its ceremonies decide how the mine, crown, and common workers share the underground wealth."

 game_concept_tv_wonder_giant_observatory: "Giant Astronomical Observatory"
 game_concept_tv_wonder_giant_observatory_desc: "A monumental observatory of towers, sighting galleries, catalog rooms, and instrument courts. Hills, plateaus, mountains, and literate local populations suit it best, and its ceremonies turn sky-watching toward scholarship, navigation, or omens."

 game_concept_tv_wonder_palace_of_nations: "Palace of Nations"
 game_concept_tv_wonder_palace_of_nations_desc: "A diplomatic palace raised in the capital to make hierarchy, audiences, and foreign presence permanent. Developed metropolitan ground suits it best, and its ceremonies can turn the palace toward congress, tribute, or standing embassy districts."

 game_concept_tv_wonder_university_city: "University City"
 game_concept_tv_wonder_university_city_desc: "A scholarly city of lecture halls, colleges, libraries, and student quarters. Urban sites and literate populations suit it best, and its ceremonies can turn the university toward research, public literacy, or promotion through collegiate institutions."

 game_concept_tv_wonder_sky_dome_grand_temple: "Sky Dome Grand Temple"
 game_concept_tv_wonder_sky_dome_grand_temple_desc: "A monumental temple gathered under a vast ceremonial dome. Orthodox populations and sacred infrastructure suit it best, and its ceremonies can emphasize consecration, pilgrimage revenue, or clerical government."

 game_concept_tv_wonder_giant_tower_temple: "Giant Tower Temple"
 game_concept_tv_wonder_giant_tower_temple_desc: "A towering temple of stairs, beacon chambers, shrines, and schools. Its ceremonies can turn height toward prestige, disciplined pilgrimage, or organized conversion."

 game_concept_tv_wonder_river_extension: "River Extension"
 game_concept_tv_wonder_river_extension_desc: "A riverworks wonder of widened channels, bridges, embankments, fairs, and offices. It requires a river site and can turn movement, trade, and canal administration into permanent state capacity."

 game_concept_tv_wonder_national_shipyard: "National Shipyard"
 game_concept_tv_wonder_national_shipyard_desc: "A coastal shipbuilding complex of slips, cranes, storehouses, and naval offices. Harbor capacity and development suit it best, and its ceremonies can emphasize shipbuilding speed, fleet morale, or naval range."

 game_concept_tv_wonder_star_fortress_city: "Star Fortress City"
 game_concept_tv_wonder_star_fortress_city_desc: "A planned fortified city of angular bastions, drill grounds, magazines, and arsenals. Urban defensive sites suit it best, and its ceremonies strengthen garrisons, siege skill, or fort capacity."

 game_concept_tv_wonder_great_wall: "Great Wall"
 game_concept_tv_wonder_great_wall_desc: "A frontier wall of towers, gates, signal posts, and mustering grounds. Non-urban defensive sites suit it best, and its ceremonies can emphasize manpower, movement, or morale."

 game_concept_tv_wonder_giant_armory: "Giant Armory"
 game_concept_tv_wonder_giant_armory_desc: "A great military storehouse and production district for weapons, foundries, and master armourers. Developed towns and cities suit it best, and its ceremonies shape morale, production, or discipline."

 game_concept_tv_wonder_library_of_nation: "Library of Nation"
 game_concept_tv_wonder_library_of_nation_desc: "A capital library of catalogs, copyist houses, reading rooms, and legal deposit offices. Its ceremonies can accelerate research, literacy, or social promotion through preserved knowledge."

 game_concept_tv_wonder_domestic_support: "Domestic Support"
 game_concept_tv_wonder_domestic_support_desc: "A [tv_wonder_construction|e] resource representing elite and public willingness to sustain a major wonder project. Reach 100 to end the initial debate; support can be stored up to 200 and decays after the debate ends."

 game_concept_tv_wonder_scale_competence: "Scale Competence"
 game_concept_tv_wonder_scale_competence_desc: "A [tv_wonder_survey|e] reading for how well the chosen site can carry the wonder's intended size, axes, foundations, and public approach without forcing the design into an awkward shape. It sets maximum wonder level at 20%, 40%, 60%, 80%, and 100%, with level 6 requiring 100%."

 game_concept_tv_wonder_organization_competence: "Organization Competence"
 game_concept_tv_wonder_organization_competence_desc: "A [tv_wonder_survey|e] reading for how cleanly labor rosters, foremen, workshops, and construction stages can be made to answer one plan instead of many competing orders. It linearly sets the maximum Wonder Worksite level from 0 to 20."

 game_concept_tv_wonder_logistics_competence: "Logistics Competence"
 game_concept_tv_wonder_logistics_competence_desc: "A [tv_wonder_survey|e] reading for roads, carts, ports, bridges, and handover points that determine whether [tv_wonder_materials|e] reach the site when the masons need them."

 # -- Trade Victory Unique Mechanics ----------------------------------------
 game_concept_tv_trade_league: "Trade League"
 game_concept_tv_trade_league_desc: "A non-unique international organization founded at [tv_trade_victory|e] Milestone 1. Its leader can invite or expel members, appoint a [tv_grand_merchant|e], and track commodity monopolies."

 game_concept_tv_grand_merchant: "Grand Merchant"
 game_concept_tv_grand_merchant_desc: "The appointed character who leads the [tv_trade_league|e]. Without a [tv_grand_merchant|e], the trade-chain, intelligence, and monopoly systems remain inactive."

 game_concept_tv_trade_monopoly: "Trade Monopoly"
 game_concept_tv_trade_monopoly_desc: "A [tv_trade_league|e] monopoly state for one commodity. Each month the league averages control across the top three origin markets, key nodes, and consumer markets, then sums those three category scores into a 0-300% monopoly level. Reaching 100% marks the good as monopolized. Monopoly actions can lock part of that level for virtual demand, virtual production, or embargo pressure."

 # ── Diplomatic Victory Unique Mechanics ───────────────────────────────────
 game_concept_tv_diplomatic_alliance: "Diplomatic Alliance"
 game_concept_tv_diplomatic_alliance_desc: "A non-unique international organization founded through [tv_diplomatic_victory|e]. It is led by an [tv_alliance_advocator|e], uses an [tv_alliance_assembly|e] for policy votes, and develops through [tv_alliance_tier|e] and [tv_alliance_cohesion|e]."

 game_concept_tv_alliance_advocator: "Advocator"
 game_concept_tv_alliance_advocator_desc: "The character appointed to lead the [tv_diplomatic_alliance|e]. The [tv_alliance_advocator|e] proposes alliance laws, represents the founder's diplomatic project, and can participate in the [tv_alliance_assembly|e]."

 game_concept_tv_alliance_assembly: "Alliance Assembly"
 game_concept_tv_alliance_assembly_desc: "The parliamentary forum of the [tv_diplomatic_alliance|e]. Members deliberate and vote on alliance laws, converting [tv_alliance_cohesion|e] into higher [tv_alliance_tier|e]."

 game_concept_tv_diplomatic_support: "Diplomatic Support"
 game_concept_tv_diplomatic_support_desc: "A permanent pledge from another country backing your bid for [tv_diplomatic_victory|e]. Two supporters open the first milestone and found the [tv_diplomatic_alliance|e]."

 game_concept_tv_alliance_tier: "Alliance Tier"
 game_concept_tv_alliance_tier_desc: "A 0-15 [tv_diplomatic_alliance|e] variable representing the alliance's institutional development. Passing upgraded alliance laws spends [tv_alliance_cohesion|e] and increases [tv_alliance_tier|e]. Each tier generates 1 [tv_dvp|e] per month for the founder."

 game_concept_tv_alliance_cohesion: "Alliance Cohesion"
 game_concept_tv_alliance_cohesion_desc: "A 0-100 [tv_diplomatic_alliance|e] variable measuring cooperation among alliance members. It grows each month from base growth, the leader country's diplomatic reputation, and internal peace. Upgraded alliance laws spend Cohesion to increase [tv_alliance_tier|e]."

 # ── Cultural Victory Unique Mechanics ──────────────────────────────────────
 game_concept_tv_arts_intl_influence: "International Influence"
 game_concept_tv_arts_intl_influence_desc: "A measure of your country's cultural reach beyond its borders, accumulated through the [tv_arts_exhibition|e]. Gained primarily by sending artists on foreign tours. It decays by 0.1% of its current value each month as the impact of past cultural exports fades. [tv_cultural_victory|E] Milestones 2 through 5 require minimum [tv_arts_intl_influence|e] of 25, 50, 75, and 100 respectively."

 game_concept_tv_domestic_exhibition: "Domestic Exhibition"
 game_concept_tv_domestic_exhibition_desc: "A persistent exhibition hosted inside your own realm through the [tv_arts_exhibition|e]. It requires at least 5 owned artworks and a selected primary location, costs scaled gold x3.5, begins with 80 [tv_local_exhibition_enthusiasm|e], and pays [tv_cip|e] when it closes. While active, you can expand into owned neighboring locations by committing more exhibits and paying scaled gold x1; the extra exhibit requirement rises from 5 to 10, then 20. Closing [tv_cip|e] is calculated per venue from 0.5 per month open plus rating bonus (-3 / 0 / +3 / +6), then multiplied by the number of venues."

 game_concept_tv_local_exhibition_enthusiasm: "Exhibition Enthusiasm"
 game_concept_tv_local_exhibition_enthusiasm_desc: "An [tv_arts_exhibition|e] IO variable used by [tv_domestic_exhibition|e]. It starts at 80, is capped at 200, falls by 8 each month, and ends the exhibition when it reaches 0."

 game_concept_tv_arts_exhibition: "Arts Exhibition"
 game_concept_tv_arts_exhibition_desc: "An international organization uniting culturally ambitious powers. Countries automatically join upon reaching [tv_cultural_victory|e] Milestone 1 (50 [tv_cip|e]). Membership unlocks [tv_artist_tour|e]s and [tv_domestic_exhibition|e]. [tv_domestic_exhibition|E] requires at least 5 artworks, costs scaled gold x3.5, uses [tv_local_exhibition_enthusiasm|e], can expand into neighboring owned locations with additional exhibits, and pays location-multiplied [tv_cip|e] when it closes."

 game_concept_tv_chief_artist: "Chief Artist"
 game_concept_tv_chief_artist_desc: "The appointed artist who leads the [tv_arts_exhibition|e]. Their Art Skill contributes to [tv_arts_intl_influence|e] each month, and they can host [tv_arts_exchange|e] while they remain at court."

 game_concept_tv_arts_exchange: "Arts Exchange"
 game_concept_tv_arts_exchange_desc: "A year-long [tv_arts_exhibition|e] programme led by the [tv_chief_artist|e]. Domestic and foreign artists may be invited into the exchange, creating a shared pool of skill growth, inspiration, prestige, and cultural influence."

 game_concept_tv_artist_tour: "Foreign Artist Tour"
 game_concept_tv_artist_tour_desc: "A [tv_arts_exhibition|e] action that sends an artist to a foreign court for 1 to 10 years. Tours can raise [tv_arts_intl_influence|e], trigger special cultural events, and return with art, research, money, or tragedy."
 # ── Scientific Victory Unique Mechanics ────────────────────────────────────
 game_concept_tv_academy_of_sciences: "Academy of Sciences"
 game_concept_tv_academy_of_sciences_desc: "A five-phase capital building and international organization that gates each Scientific Victory milestone. Phase I unlocks once your [tv_science_score|e] reaches 100; subsequent phases unlock at 150, 200, 300, and 400 respectively. Each phase must be physically constructed in your capital before the corresponding milestone can fire. Phase I also opens the [tv_research_mechanism|e]."

 game_concept_tv_chief_scientist: "Chief Scientist"
 game_concept_tv_chief_scientist_desc: "The appointed scholar who directs the [tv_academy_of_sciences|e]. Their [tv_effective_administrative_skill|e] drives [tv_concentrated_research|e], [tv_academy_medical_treatment|e], [tv_academy_meditation|e], and several Academy events."

 game_concept_tv_research_mechanism: "Research Mechanism"
 game_concept_tv_research_mechanism_desc: "The operational system of the [tv_academy_of_sciences|e]. A research cycle chooses a Frontier [tv_research_target|e], gathers [tv_research_interest|e], completes prerequisite work and the [tv_literacy_foundation|e], then unlocks the target through [tv_concentrated_research|e]. This is an extra route to an advance, not a lock on normal research."

 game_concept_tv_research_target: "Research Target"
 game_concept_tv_research_target_desc: "The locked advance currently selected by the [tv_research_mechanism|e]. Once chosen, the Academy must gather [tv_research_interest|e], complete prerequisite work, build the [tv_literacy_foundation|e], and finish [tv_concentrated_research|e] before the target unlocks."

 game_concept_tv_research_interest: "Academic Interest"
 game_concept_tv_research_interest_desc: "The first subprocess of the [tv_research_mechanism|e]. It represents courtly curiosity, scholarly gossip, and patrons willing to spend attention on the current [tv_research_target|e]."

 game_concept_tv_literacy_foundation: "Literacy Foundation"
 game_concept_tv_literacy_foundation_desc: "The population-learning subprocess of the [tv_research_mechanism|e]. It measures whether enough readers, scribes, teachers, and workshop users exist to carry a new advance beyond the Academy walls."

 game_concept_tv_effective_administrative_skill: "Effective Administrative Skill"
 game_concept_tv_effective_administrative_skill_desc: "The practical administrative capacity a [tv_chief_scientist|e] contributes to [tv_academy_of_sciences|e] work. Great Scientist traits can raise it above the character's normal Administrative skill, and higher values unlock safer [tv_concentrated_research|e] event pools."

 game_concept_tv_academy_medical_treatment: "Academy Medical Treatment"
 game_concept_tv_academy_medical_treatment_desc: "A [tv_academy_of_sciences|e] project where the [tv_chief_scientist|e] treats one character with a health condition. Treatment advances through discovery and accident events until the patient recovers, dies, or the work is reset."

 game_concept_tv_academy_meditation: "Academy Meditation"
 game_concept_tv_academy_meditation_desc: "A [tv_academy_of_sciences|e] project where the [tv_chief_scientist|e] guides one character away from a negative ruler, cabinet, or artist trait. Meditation gains or loses progress through reflective events."

 game_concept_tv_concentrated_research: "Concentrated Research"
 game_concept_tv_concentrated_research_desc: "The final subprocess of the [tv_research_mechanism|e]. It requires an appointed [tv_chief_scientist|e] with at least 20 [tv_effective_administrative_skill|e], gains progress from that effective skill each month, applies a temporary research speed penalty while active, and completes when its progress reaches 100."

 # ── Conquest Victory Unique Mechanics ──────────────────────────────────────
 game_concept_tv_govhouse: "Governor's House"
 game_concept_tv_govhouse_desc: "An international organization established at Conquest Victory Milestone 1. The founding country appoints a [tv_grand_general|e] and can assign [tv_local_governor|e]s to regions within their realm. Each governor reduces construction costs and unrest while increasing maximum control in their governed region, scaled to their military attributes."
 game_concept_tv_grand_general: "Grand General"
 game_concept_tv_grand_general_desc: "The supreme commander appointed through the [tv_govhouse|e]. The [tv_grand_general|e] can be trained, can propose tactics and [tv_war_plan|e]s, and accumulates [tv_govhouse_power_consolidation|e] while in office."
 game_concept_tv_local_governor: "Local Governor"
 game_concept_tv_local_governor_desc: "A character assigned by the [tv_govhouse|e] to govern one region. [tv_local_governor|E]s apply region-wide construction, unrest, control, production, population, or defense bonuses according to [tv_govhouse|e] laws and their personal skills."
 game_concept_tv_govhouse_plan_progress: "Plan Progress"
 game_concept_tv_govhouse_plan_progress_desc: "A [tv_war_tent|e] value accumulated by the [tv_grand_general|e]. [tv_war_plan|E]s convert it into scaling military bonuses while the relevant war condition is active."
 game_concept_tv_war_tent: "War Tent"
 game_concept_tv_war_tent_desc: "The [tv_govhouse|e] command tab for [tv_grand_general|e] tactics and [tv_war_plan|e]s. During war, the [tv_grand_general|e] can propose a tactic for approval. Outside or during war, the player can prepare [tv_war_plan|e]s that turn [tv_govhouse_plan_progress|e] into temporary military bonuses."
 game_concept_tv_war_plan: "War Plan"
 game_concept_tv_war_plan_desc: "A prepared strategy from the [tv_war_tent|e]. Offensive plans name a target country and, when war begins against that target, convert [tv_govhouse_plan_progress|e] into Siege Ability and Discipline. Defensive plans activate in defensive wars and convert progress into Fort Defense and Military Tactics."
 game_concept_tv_govhouse_power_balance: "Balance of Power"
 game_concept_tv_govhouse_power_balance_desc: "A [tv_govhouse|e] value showing how much effective power belongs to the [tv_grand_general|e] rather than the Crown. It moves monthly toward an equilibrium shaped by ruler ability, [tv_grand_general|e] ability, and [tv_govhouse_power_consolidation|e]. Higher [tv_grand_general|e] power unlocks harsher backlash events."
 game_concept_tv_govhouse_power_consolidation: "Power Consolidation"
 game_concept_tv_govhouse_power_consolidation_desc: "Personal power accumulated by the [tv_grand_general|e] while in office. It rises over time, pushes [tv_govhouse_power_balance|e] toward the [tv_grand_general|e], and determines the Government Power cost to dismiss or replace a [tv_grand_general|e]. It resets when the [tv_grand_general|e] leaves office."
