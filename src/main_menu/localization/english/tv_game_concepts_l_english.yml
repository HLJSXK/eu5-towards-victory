 # ── Towards Victory — Game Concepts ───────────────────────────────────────
 game_concept_tv_conquest_score: "Conquest Score"
 game_concept_tv_conquest_score_desc: "The Conquest Score measures the territorial extent of your realm. Each location you directly own adds 1 point; each location held by a [subject|e] or lower-ranked country adds 0.5 points. Updated monthly. Reach 2,500 to achieve the long-term [tv_victory_situation|E]."

 game_concept_tv_prosperity_score: "Prosperity Score"
 game_concept_tv_prosperity_score_desc: "The Prosperity Score tracks the domestic development of your realm. It combines total population, development across all owned locations, and country tax base, then scales the result by country size, stability, and government power. Updated yearly. Reach 11,000 to achieve the long-term [tv_victory_situation|E]."

 game_concept_tv_trade_score: "Trade Score"
 game_concept_tv_trade_score_desc: "The Trade Score reflects your commercial power. It is a monthly snapshot of your country's total monthly [trade_income|e]. Reach 2,000 to achieve the long-term [tv_victory_situation|E]."

 game_concept_tv_diplomatic_victory_points: "Diplomatic Victory Points"
 game_concept_tv_dvp: "DVP"
 game_concept_tv_diplomatic_victory_points_desc: "Diplomatic Victory Points (DVP) are earned through monthly [tv_alliance_tier|e] output after joining a [tv_diplomatic_alliance|e]: the alliance leader gains the full tier, while non-leader members gain half. Milestones are 1, 50, 500, 2,500, and 15,000 DVP."

 game_concept_tv_cultural_influence_points: "Cultural Influence Points"
 game_concept_tv_cip: "CIP"
 game_concept_tv_cultural_influence_points_desc: "Cultural Influence Points (CIP) are earned through artistic achievement: each [work_of_art|e] created grants +3 CIP to the owner's country. CIP never decrease. Reach 1,600 to achieve the long-term [tv_victory_situation|E]."

 game_concept_tv_science_score: "Science Score"
 game_concept_tv_science_score_desc: "The Science Score tracks the technological progress of your realm. It is a monthly snapshot of the total number of [advances|e] your country has researched. Reach 400 to achieve the long-term [tv_victory_situation|E]."

 # ── Situation ──────────────────────────────────────────────────────────────
 game_concept_tv_victory_situation: "Victory Path"
 game_concept_tv_victory_situation_desc: "The Victory Path is a permanent situation active for all countries. It tracks progress across all six paths to supremacy simultaneously. Each path has five milestones; reaching Milestone 3 earns a Short-term Victory bonus and reaching Milestone 5 clinches a Long-term Victory. Monitor your own progress and your rivals' through the Victory Path panel."

 # ── Six Victory Types ──────────────────────────────────────────────────────
 game_concept_tv_conquest_victory: "Conquest Victory"
 game_concept_tv_conquest_victory_desc: "Dominate the world through territorial expansion. Your [tv_conquest_score|e] measures the size of your realm: direct holdings count fully, subject and vassal locations at half weight. Milestones at 200, 400, 600, 1,200, and 2,500 reward military capability and leave a grand legacy."

 game_concept_tv_prosperity_victory: "Prosperity Victory"
 game_concept_tv_prosperity_victory_desc: "Build the wealthiest and most developed nation. Your [tv_prosperity_score|e] rewards large, stable, well-governed development rather than raw size alone. Milestones at 2,000, 3,000, 5,000, 7,000, and 11,000 reward domestic production, population growth, and construction power."

 game_concept_tv_trade_victory: "Trade Victory"
 game_concept_tv_trade_victory_desc: "Command the world's commerce. Your [tv_trade_score|e] is a monthly snapshot of your total monthly trade income. The [tv_trade_league|e] is founded through the IO establishment flow before Trade Victory progress unlocks; Milestones 3 and 5 also require leading market dominance (5 and 10 markets respectively). Rewards focus on merchant capacity, trade efficiency, and trade income multipliers."

 game_concept_tv_diplomatic_victory: "Diplomatic Victory"
 game_concept_tv_diplomatic_victory_desc: "Forge the world's most powerful network of alliances and influence. Founding or joining a [tv_diplomatic_alliance|e] unlocks Diplomatic Victory progress, but [tv_dvp|e] are generated each month from [tv_alliance_tier|e], with milestones at 1, 50, 500, 2,500, and 15,000."

 game_concept_tv_cultural_victory: "Cultural Victory"
 game_concept_tv_cultural_victory_desc: "Shape civilization through art and cultural exports. [tv_cip|e] accumulate permanently: +3 per work of art created. Milestones at 50, 200, 400, 800, and 1,600 reward artistic skill, prestige, and cultural tradition. Milestones 2 through 5 also require minimum [tv_arts_intl_influence|e] of 25, 50, 75, and 100."

 game_concept_tv_science_victory: "Scientific Victory"
 game_concept_tv_science_victory_desc: "Lead humanity into the age of reason. Your [tv_science_score|e] tracks total advances researched. Each milestone also requires the corresponding phase of the [tv_academy_of_sciences|e] to be constructed in your capital. Rewards accelerate research, institution spread, and production."

 # -- Trade Victory Unique Mechanics ----------------------------------------
 game_concept_tv_trade_league: "Trade League"
 game_concept_tv_trade_league_desc: "A non-unique international organization founded through the [tv_trade_victory|e] IO establishment flow. Its leader can invite or expel members, appoint a [tv_grand_merchant|e], and track commodity monopolies."

 game_concept_tv_grand_merchant: "Grand Merchant"
 game_concept_tv_grand_merchant_desc: "The appointed character who leads [tv_trade_league|e] intelligence and monopoly work. Trade Chains are maintained directly by the league leader country."

 game_concept_tv_trade_monopoly: "Trade Monopoly"
 game_concept_tv_trade_monopoly_desc: "A [tv_trade_league|e] monopoly state for one commodity. Each month the league scans all markets and computes origin, transit, and consumer control; the final 0-100% monopoly level is the highest of those three values. Goods with at least 25% potential can fill monopoly slots, while monopoly actions require a slotted good at 50% or higher and can lock part of that level for virtual demand, virtual production, or embargo pressure."

 # ── Diplomatic Victory Unique Mechanics ───────────────────────────────────
 game_concept_tv_diplomatic_alliance: "Diplomatic Alliance"
 game_concept_tv_diplomatic_alliance_desc: "A non-unique international organization founded through [tv_diplomatic_victory|e]. It is led by an [tv_alliance_advocator|e], uses an [tv_alliance_assembly|e] for policy votes, and develops through [tv_alliance_tier|e] and [tv_alliance_cohesion|e]."

 game_concept_tv_alliance_advocator: "Advocator"
 game_concept_tv_alliance_advocator_desc: "The character appointed to lead the [tv_diplomatic_alliance|e]. The [tv_alliance_advocator|e] proposes alliance laws, represents the founder's diplomatic project, and can participate in the [tv_alliance_assembly|e]."

 game_concept_tv_alliance_assembly: "Alliance Assembly"
 game_concept_tv_alliance_assembly_desc: "The parliamentary forum of the [tv_diplomatic_alliance|e]. Members deliberate and vote on alliance laws, converting [tv_alliance_cohesion|e] into higher [tv_alliance_tier|e]."

 game_concept_tv_alliance_tier: "Alliance Tier"
 game_concept_tv_alliance_tier_desc: "A 0-21 [tv_diplomatic_alliance|e] variable representing the alliance's institutional development. Passing upgraded alliance laws spends [tv_alliance_cohesion|e] and increases [tv_alliance_tier|e]; War Laws contribute 0/1/2 tier by level. Each tier generates 1 [tv_dvp|e] per month for the alliance leader and 0.5 [tv_dvp|e] for each non-leader member."

 game_concept_tv_alliance_cohesion: "Alliance Cohesion"
 game_concept_tv_alliance_cohesion_desc: "A 0-100 [tv_diplomatic_alliance|e] variable measuring cooperation among alliance members. It grows each month from base growth, the leader country's diplomatic reputation, and internal peace. Upgraded alliance laws spend Cohesion to increase [tv_alliance_tier|e]."

 # ── Cultural Victory Unique Mechanics ──────────────────────────────────────
 game_concept_tv_arts_intl_influence: "International Influence"
 game_concept_tv_arts_intl_influence_desc: "A measure of your country's cultural reach beyond its borders, accumulated through the [tv_arts_exhibition|e]. Gained primarily by sending artists on foreign tours. It decays by 0.1% of its current value each month as the impact of past cultural exports fades. [tv_cultural_victory|E] Milestones 2 through 5 require minimum [tv_arts_intl_influence|e] of 25, 50, 75, and 100 respectively."

 game_concept_tv_domestic_exhibition: "Domestic Exhibition"
 game_concept_tv_domestic_exhibition_desc: "A persistent exhibition hosted inside your own realm through the [tv_arts_exhibition|e]. It requires at least 5 owned artworks and a selected primary location, costs scaled gold x3.5, begins with 80 [tv_local_exhibition_enthusiasm|e], and pays [tv_cip|e] when it closes. While active, you can expand into owned neighboring locations by committing more exhibits and paying scaled gold x1; the extra exhibit requirement rises from 5 to 10, then 20. Closing [tv_cip|e] is calculated per venue from 0.5 per month open plus rating bonus (-3 / 0 / +3 / +6), then multiplied by the number of venues."

 game_concept_tv_local_exhibition_enthusiasm: "Exhibition Enthusiasm"
 game_concept_tv_local_exhibition_enthusiasm_desc: "An [tv_arts_exhibition|e] IO variable used by [tv_domestic_exhibition|e]. It starts at 80, is capped at 200, falls by 8 each month, and ends the exhibition when it reaches 0."

 game_concept_tv_arts_exhibition: "Arts Exhibition"
 game_concept_tv_arts_exhibition_desc: "An international organization uniting culturally ambitious powers. Countries create and join their own instance through the [tv_cultural_victory|e] IO establishment flow. Membership unlocks [tv_artist_tour|e]s and [tv_domestic_exhibition|e]. [tv_domestic_exhibition|E] requires at least 5 artworks, costs scaled gold x3.5, uses [tv_local_exhibition_enthusiasm|e], can expand into neighboring owned locations with additional exhibits, and pays location-multiplied [tv_cip|e] when it closes."

 game_concept_tv_chief_artist: "Chief Artist"
 game_concept_tv_chief_artist_desc: "The appointed artist who leads the [tv_arts_exhibition|e]. Their Art Skill contributes to [tv_arts_intl_influence|e] each month, and they can host [tv_arts_exchange|e] while they remain at court."

 game_concept_tv_arts_exchange: "Arts Exchange"
 game_concept_tv_arts_exchange_desc: "A year-long [tv_arts_exhibition|e] programme led by the [tv_chief_artist|e]. Domestic and foreign artists may be invited into the exchange, creating a shared pool of skill growth, inspiration, prestige, and cultural influence."

 game_concept_tv_artist_tour: "Foreign Artist Tour"
 game_concept_tv_artist_tour_desc: "A [tv_arts_exhibition|e] action that sends an artist to a foreign court for 1 to 10 years. Tours can raise [tv_arts_intl_influence|e], trigger special cultural events, and return with art, research, money, or tragedy."
 # ── Scientific Victory Unique Mechanics ────────────────────────────────────
 game_concept_tv_academy_of_sciences: "Academy of Sciences"
 game_concept_tv_academy_of_sciences_desc: "A five-phase capital building and international organization that gates each Scientific Victory milestone. Phase I unlocks once your [tv_science_score|e] reaches 100; subsequent phases unlock at 150, 200, 300, and 400 respectively. Each phase must be physically constructed in your capital before the corresponding milestone can fire. Phase I also opens the [tv_research_mechanism|e]."

 game_concept_tv_chief_scientist: "Chief Scientist"
 game_concept_tv_chief_scientist_desc: "The appointed scholar who directs the [tv_academy_of_sciences|e]. Their [tv_effective_administrative_skill|e] drives [tv_concentrated_research|e], [tv_academy_medical_treatment|e], [tv_academy_meditation|e], and several Academy events."

 game_concept_tv_research_mechanism: "Research Mechanism"
 game_concept_tv_research_mechanism_desc: "The operational system of the [tv_academy_of_sciences|e]. A research cycle chooses a Frontier [tv_research_target|e], gathers [tv_research_interest|e], completes prerequisite work and the [tv_literacy_foundation|e], then unlocks the target through [tv_concentrated_research|e]. This is an extra route to an advance, not a lock on normal research."

 game_concept_tv_research_target: "Research Target"
 game_concept_tv_research_target_desc: "The locked advance currently selected by the [tv_research_mechanism|e]. Once chosen, the Academy must gather [tv_research_interest|e], complete prerequisite work, build the [tv_literacy_foundation|e], and finish [tv_concentrated_research|e] before the target unlocks."

 game_concept_tv_research_interest: "Academic Interest"
 game_concept_tv_research_interest_desc: "The first subprocess of the [tv_research_mechanism|e]. It represents courtly curiosity, scholarly gossip, and patrons willing to spend attention on the current [tv_research_target|e]."

 game_concept_tv_literacy_foundation: "Literacy Foundation"
 game_concept_tv_literacy_foundation_desc: "The population-learning subprocess of the [tv_research_mechanism|e]. It measures whether enough readers, scribes, teachers, and workshop users exist to carry a new advance beyond the Academy walls."

 game_concept_tv_effective_administrative_skill: "Effective Administrative Skill"
 game_concept_tv_effective_administrative_skill_desc: "The practical administrative capacity a [tv_chief_scientist|e] contributes to [tv_academy_of_sciences|e] work. Great Scientist traits can raise it above the character's normal Administrative skill, and higher values unlock safer [tv_concentrated_research|e] event pools."

 game_concept_tv_academy_medical_treatment: "Academy Medical Treatment"
 game_concept_tv_academy_medical_treatment_desc: "A [tv_academy_of_sciences|e] project where the [tv_chief_scientist|e] treats one character with a health condition. Treatment advances through discovery and accident events until the patient recovers, dies, or the work is reset."

 game_concept_tv_academy_meditation: "Academy Meditation"
 game_concept_tv_academy_meditation_desc: "A [tv_academy_of_sciences|e] project where the [tv_chief_scientist|e] guides one character away from a negative ruler, cabinet, or artist trait. Meditation gains or loses progress through reflective events."

 game_concept_tv_concentrated_research: "Concentrated Research"
 game_concept_tv_concentrated_research_desc: "The final subprocess of the [tv_research_mechanism|e]. It requires an appointed [tv_chief_scientist|e] with at least 20 [tv_effective_administrative_skill|e], gains progress from that effective skill each month, applies a temporary research speed penalty while active, and completes when its progress reaches 100."

 game_concept_tv_debate_history: "History"
 game_concept_tv_debate_history_desc: "A past philosophy debate node. For a newly founded [tv_academy_of_sciences|e], debates at or before its founding node are shown as history and do not involve the player."

 game_concept_tv_local_debate: "Local"
 game_concept_tv_local_debate_desc: "A domestic philosophy debate node hosted by the [tv_academy_of_sciences|e]. Each debate has a fixed Crown seat and five [tv_debate_seat|e]s that are gradually filled by [tv_debate_group|e]s through monthly debate events."

 game_concept_tv_debate_seat: "Debate Seat"
 game_concept_tv_debate_seat_desc: "A position in a domestic [tv_local_debate|e]. Seats hold one [tv_debate_group|e], its current stance, defection cooldown, and any linked artist, foreign country, or Great Scientist."

 game_concept_tv_debate_group: "Debate Group"
 game_concept_tv_debate_group_desc: "A domestic or foreign faction that can occupy a [tv_debate_seat|e]. Groups include estates, conditional estate variants, artists, foreign powers, and the Great Scientist; supporters advance the debate, opponents push it back, and neutral groups wait for later events."

 game_concept_tv_world_debate: "World"
 game_concept_tv_world_debate_desc: "An international philosophy debate node. World debate seats are shown as placeholders in the current implementation round, with real countries, flags, stances, and outcomes to be connected later."

 # ── Conquest Victory Unique Mechanics ──────────────────────────────────────
 game_concept_tv_govhouse: "Governor's House"
 game_concept_tv_govhouse_desc: "An international organization established through the [tv_conquest_victory|e] IO establishment flow. The founding country appoints a [tv_grand_general|e], can assign [tv_local_governor|e]s to regions within their realm, and uses the [tv_govhouse_assembly|e] for Governor's House law votes."
 game_concept_tv_govhouse_assembly: "Governor's Assembly"
 game_concept_tv_govhouse_assembly_desc: "The parliamentary forum of the [tv_govhouse|e]. Only the [tv_govhouse_supreme_overlord_status|e] can propose law changes; the Supreme Overlord has 100 votes, while attached members vote according to their relative strength against the Supreme Overlord."
 game_concept_tv_grand_general: "Grand General"
 game_concept_tv_grand_general_desc: "The supreme commander appointed through the [tv_govhouse|e]. The [tv_grand_general|e] can be trained, can propose tactics and [tv_war_plan|e]s, and accumulates [tv_govhouse_power_consolidation|e] while in office."
 game_concept_tv_local_governor: "Local Governor"
 game_concept_tv_local_governor_desc: "A character assigned by the [tv_govhouse|e] to govern one region. [tv_local_governor|E]s apply region-wide construction, unrest, control, production, population, or defense bonuses according to [tv_govhouse|e] laws and their personal skills. Each one also chooses a [tv_governor_autonomous_task|e] from local needs."
 game_concept_tv_governor_autonomous_task: "Governor Autonomous Task"
 game_concept_tv_governor_autonomous_task_desc: "A yearly priority chosen by each [tv_local_governor|e] for their governed region. The task can restore prosperity, integrate the region, convert culture, convert religion, strengthen recruitment, or strengthen order; its choice is driven by regional weights and can be biased by [tv_govhouse|e] laws."
 game_concept_tv_govhouse_plan_progress: "Plan Progress"
 game_concept_tv_govhouse_plan_progress_desc: "A [tv_war_tent|e] value accumulated by the [tv_grand_general|e]. [tv_war_plan|E]s convert it into scaling military bonuses while the relevant war condition is active."
 game_concept_tv_war_tent: "War Tent"
 game_concept_tv_war_tent_desc: "The [tv_govhouse|e] command tab for [tv_grand_general|e] tactics and [tv_war_plan|e]s. During war, the [tv_grand_general|e] can propose a tactic for approval. Outside or during war, the player can prepare [tv_war_plan|e]s that turn [tv_govhouse_plan_progress|e] into temporary military bonuses."
 game_concept_tv_war_plan: "War Plan"
 game_concept_tv_war_plan_desc: "A prepared strategy from the [tv_war_tent|e]. Offensive plans name a target country and, when war begins against that target, convert [tv_govhouse_plan_progress|e] into Siege Ability and Discipline. Defensive plans activate in defensive wars and convert progress into Fort Defense and Military Tactics."
 game_concept_tv_govhouse_power_balance: "Balance of Power"
 game_concept_tv_govhouse_power_balance_desc: "A [tv_govhouse|e] value showing how much effective power belongs to the [tv_grand_general|e] rather than the Crown. It moves monthly toward an equilibrium shaped by ruler ability, [tv_grand_general|e] ability, and [tv_govhouse_power_consolidation|e]. Higher [tv_grand_general|e] power unlocks harsher backlash events."
 game_concept_tv_govhouse_power_consolidation: "Power Consolidation"
 game_concept_tv_govhouse_power_consolidation_desc: "Personal power accumulated by the [tv_grand_general|e] while in office. It rises over time, pushes [tv_govhouse_power_balance|e] toward the [tv_grand_general|e], and determines the Government Power cost to dismiss or replace a [tv_grand_general|e]. It resets when the [tv_grand_general|e] leaves office."
