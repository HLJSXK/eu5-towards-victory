l_english:
 # ── Towards Victory — Game Concepts ───────────────────────────────────────
 game_concept_tv_conquest_score: "Conquest Score"
 game_concept_tv_conquest_score_desc: "The Conquest Score measures the territorial extent of your realm. Each location you directly own adds 1 point; each location held by a [subject|e] or lower-ranked country adds 0.5 points. Updated monthly. Reach 2,000 to achieve the long-term [tv_victory_situation|E]."

 game_concept_tv_prosperity_score: "Prosperity Score"
 game_concept_tv_prosperity_score_desc: "The Prosperity Score tracks the domestic development of your realm. It accumulates as the sum of your total population, development across all owned locations, and your country tax base. Updated yearly. Reach 25,000 to achieve the long-term [tv_victory_situation|E]."

 game_concept_tv_trade_score: "Trade Score"
 game_concept_tv_trade_score_desc: "The Trade Score reflects your commercial power. It is a monthly snapshot of your country's total monthly [trade_income|e]. Reach 2,000 to achieve the long-term [tv_victory_situation|E]."

 game_concept_tv_diplomatic_victory_points: "Diplomatic Victory Points"
 game_concept_tv_dvp: "DVP"
 game_concept_tv_diplomatic_victory_points_desc: "Diplomatic Victory Points (DVP) are earned permanently through statecraft: each [royal_marriage|e] concluded grants +3 DVP to both parties, and winning a [war|e] grants +5 DVP to the victor. DVP never decrease. Reach 580 to achieve the long-term [tv_victory_situation|E]."

 game_concept_tv_cultural_influence_points: "Cultural Influence Points"
 game_concept_tv_cip: "CIP"
 game_concept_tv_cultural_influence_points_desc: "Cultural Influence Points (CIP) are earned through artistic achievement: each [work_of_art|e] created grants +10 CIP to the owner's country, and +1 CIP is earned passively each month. CIP never decrease. Reach 580 to achieve the long-term [tv_victory_situation|E]."

 game_concept_tv_science_score: "Science Score"
 game_concept_tv_science_score_desc: "The Science Score tracks the technological progress of your realm. It is a monthly snapshot of the total number of [advances|e] your country has researched. Reach 400 to achieve the long-term [tv_victory_situation|E]."
