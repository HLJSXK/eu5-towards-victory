 # ── Research Events ────────────────────────────────────────────────────────────

 # tv_research.1 — Monthly Interest Event
 tv_research.1.t: "[tv_research_interest|E]：A Spark of Curiosity"
 tv_research.1.d: "A courtier who usually spends meetings arranging sleeves and alliances has stayed behind after a lecture, asking questions too precise to be vanity. Their curiosity circles the [tv_research_target|E] with the nervous energy of someone who has found a door in a familiar wall. The [tv_academy_of_sciences|E] cannot run on brilliance alone; it also needs patrons, gossip, obsession, and people willing to repeat a question after supper. If we nurture this spark, it may become [tv_research_interest|E] rather than a passing amusement. If we dismiss it, the court will learn that inquiry is safest when kept private. Even small questions need permission to grow."
 tv_research.1.d_printing_press: "A stationer has brought the [tv_academy_of_sciences|E] a tray of uneven punches and a promise that letters can be made to march in rows. The apparatus is crude, but a little gold could turn #Y Printing Press#! from curiosity into a subject respectable people ask about."
 tv_research.1.d_iron_working: "A village smith has produced an iron sample with fewer flaws than the masters expected. The [tv_academy_of_sciences|E] wants money for ore, charcoal, and patient measurement before #Y Iron Working#! fades back into workshop boasting."
 tv_research.1.d_gunpowder: "An artillery servant has noticed that two powders mixed from the same recipe do not always behave alike. Funding proper trials would give #Y Gunpowder#! the kind of attention usually reserved for safer things."
 tv_research.1.d_blast_furnace: "A foundry master claims his hotter furnace can change the scale of metalwork itself. The [tv_academy_of_sciences|E] can test the draughts, brickwork, and fuel accounts that make #Y Blast Furnace#! more than a smoky boast."
 tv_research.1.d_scientific_experimentation: "An instrument maker has offered a set of balances delicate enough to shame old demonstrations. With modest funding, #Y Scientific Experimentation#! can become a habit of repeated proof instead of a clever afternoon."
 tv_research.1.d_scientific_revolution: "A lecturer has filled the blackboard with motions that make the old explanations look suddenly tired. The [tv_academy_of_sciences|E] asks for support before talk of #Y Scientific Revolution#! escapes as mere fashionable astonishment."
 tv_research.1.d_manufactories: "A workshop overseer has shown how divided tasks can make hands faster without making them wiser. A little gold would let the [tv_academy_of_sciences|E] examine #Y Manufactories#! as a system, not a lucky room."
 tv_research.1.d_industrialization: "A millwright has drawn a machine that seems willing to work after its maker sleeps. The [tv_academy_of_sciences|E] wants materials and quiet space to decide whether #Y Industrialization#! is a promise or a beautifully expensive mistake."
 tv_research.1.d_vaccination: "A country physician has sent notes from households that survived where others mourned. The [tv_academy_of_sciences|E] needs funds to test whether #Y Vaccination#! is mercy given method."
 tv_research.1.d_renaissance: "A humanist tutor has uncovered manuscripts that make old learning feel dangerously young. Patronage could turn these scattered enthusiasms into interest in the #Y Renaissance#! itself."
 tv_research.1.d_banking: "A merchant banker has offered ledgers where trust behaves almost like an instrument. The [tv_academy_of_sciences|E] wants coin to study how #Y Banking#! turns promises into power."
 tv_research.1.d_professional_armies: "A drill captain has submitted rosters showing that soldiers trained as a profession forget less and break later. Funding could make #Y Professional Armies#! a question for scholars rather than barracks only."
 tv_research.1.d_new_world: "A pilot has returned with a coastline that refuses to fit the map. The [tv_academy_of_sciences|E] asks for gold to compare charts, winds, and testimony before #Y New World#! becomes another tavern miracle."
 tv_research.1.d_pike_and_shot: "A veteran drillmaster has described how pikes and shot can protect each other when neither is allowed vanity. The [tv_academy_of_sciences|E] can fund trials that make #Y Pike and Shot#! more than battlefield gossip."
 tv_research.1.d_confessionalism: "A theologian with ink on his cuffs has shown how printed doctrine can harden into public order. The [tv_academy_of_sciences|E] wants to study #Y Confessionalism#! before pulpits and presses outrun policy."
 tv_research.1.d_global_trade: "A factor has returned with ledgers where distant prices answer each other like bells. Funding would let the [tv_academy_of_sciences|E] follow the patterns that make #Y Global Trade#! visible."
 tv_research.1.d_artillery_institution: "A fortress engineer has brought calculations proving that walls can be argued with. The [tv_academy_of_sciences|E] needs powder, metal, and measures to turn #Y Siege Artillery#! into disciplined inquiry."
 tv_research.1.d_military_revolution: "A quartermaster has found that the shape of armies now matters as much as courage. Gold would let the [tv_academy_of_sciences|E] examine #Y Military Revolution#! in stores, roads, and command tables."
 tv_research.1.d_enlightenment: "A salon essay has reached the [tv_academy_of_sciences|E] with more readers than its author expected. Modest funding could turn talk of the #Y Enlightenment#! into organized curiosity rather than pleasant disobedience."
 tv_research.1.d_levee_en_masse: "A militia captain has drawn up lists showing how an entire society might be counted for war. The [tv_academy_of_sciences|E] asks for funds to study #Y Levée en Masse#! before rhetoric becomes policy."
 tv_research.1.a: "Give the spark a candle and a ledger."
 tv_research.1.b: "Let curiosity cool in the corridor."
 tv_research.2.t: "[tv_research_interest|E]：A Question With a Reputation"
 tv_research.2.d: "The latest discussion of the [tv_research_target|E] has escaped the [tv_academy_of_sciences|E] before it was dressed for court. Wits are already laughing at diagrams they cannot read, and rivals are treating uncertainty as proof of foolishness. The [tv_academy_of_sciences|E] asks us to answer with visible confidence: spend some [prestige|E], protect the inquiry, and let curiosity advance under a borrowed cloak of dignity."
 tv_research.2.d_printing_press: "The court has begun joking that movable type will multiply bad poems before useful books. Spending prestige on #Y Printing Press#! would tell the room that the crown can recognize value before the punchlines stop."
 tv_research.2.d_iron_working: "Nobles call the iron trials smoky craft beneath learned dignity. Lending royal reputation to #Y Iron Working#! would protect the inquiry long enough for useful metal to answer them."
 tv_research.2.d_gunpowder: "Talk of #Y Gunpowder#! has drawn nervous laughter from commanders who prefer courage to chemistry. A public show of confidence can keep the [tv_academy_of_sciences|E] from looking like it is playing with thunder."
 tv_research.2.d_blast_furnace: "The hotter furnace has become a court jest about scholars trying to outdo blacksmiths. Prestige can shield #Y Blast Furnace#! until heat, ore, and patience have their say."
 tv_research.2.d_scientific_experimentation: "Some courtiers call repeated experiments a scholar's excuse for not trusting his own eyes. Spending prestige on #Y Scientific Experimentation#! would make disciplined doubt fashionable enough to survive."
 tv_research.2.d_scientific_revolution: "Every clever person now claims to have expected the #Y Scientific Revolution#!, while secretly fearing it. Our reputation can keep the [tv_academy_of_sciences|E] steady while the room pretends not to tremble."
 tv_research.2.d_manufactories: "Guild masters whisper that #Y Manufactories#! is just workshop theft with better handwriting. Prestige can keep the inquiry respectable until the charge can be answered in output."
 tv_research.2.d_industrialization: "The first sketches of #Y Industrialization#! have inspired admiration, dread, and several terrible jokes about lazy hands. A royal endorsement would make the machine less ridiculous and more inevitable."
 tv_research.2.d_vaccination: "Rumors around #Y Vaccination#! have become tangled with fear, mockery, and household grief. The [tv_academy_of_sciences|E] needs borrowed dignity before frightened laughter hardens into refusal."
 tv_research.2.d_renaissance: "Young scholars praise the #Y Renaissance#! so loudly that older courtiers hear only vanity. Prestige can give the revival a sober face before enthusiasm makes it suspect."
 tv_research.2.d_banking: "Critics call #Y Banking#! the art of dignifying debt. A little royal reputation would let the [tv_academy_of_sciences|E] study trust without appearing to sell it."
 tv_research.2.d_professional_armies: "The phrase #Y Professional Armies#! has offended those who think courage should be inherited, not trained. Prestige can make discipline sound honorable before pride closes the barracks."
 tv_research.2.d_new_world: "Stories of the #Y New World#! are already competing with tavern lies. A public commitment would tell navigators and patrons that the [tv_academy_of_sciences|E] seeks knowledge, not entertainment."
 tv_research.2.d_pike_and_shot: "Officers have begun mocking #Y Pike and Shot#! as a formation for soldiers who cannot decide what weapon they admire. Prestige can make the trials look like doctrine rather than indecision."
 tv_research.2.d_confessionalism: "Public argument over #Y Confessionalism#! can ruin a reputation faster than bad poetry. The [tv_academy_of_sciences|E] asks the crown to lend dignity before doctrine turns every question into accusation."
 tv_research.2.d_global_trade: "Skeptics say #Y Global Trade#! is just merchant boasting with a larger map. Spending prestige would let the [tv_academy_of_sciences|E] treat distant ledgers as evidence rather than rumor."
 tv_research.2.d_artillery_institution: "Courtiers find #Y Siege Artillery#! amusing until someone mentions the walls it can change. Royal confidence can keep the [tv_academy_of_sciences|E]'s mathematics from sounding like expensive menace."
 tv_research.2.d_military_revolution: "The phrase #Y Military Revolution#! sounds arrogant enough to offend half the general staff. Prestige can make reform feel like foresight rather than an insult to yesterday's victories."
 tv_research.2.d_enlightenment: "Pamphlets praising the #Y Enlightenment#! have made the court wonder whether reason has learned manners. Our reputation can shelter inquiry before wit becomes rebellion in miniature."
 tv_research.2.d_levee_en_masse: "The idea of #Y Levée en Masse#! sounds grand until every estate imagines being counted. Prestige can present the question as national discipline rather than a threat."
 tv_research.2.a: "Let reputation pay for one more question."
 tv_research.2.b: "The court may laugh if it wants."
 tv_research.3.t: "[tv_research_interest|E]：A Sermon Against Speculation"
 tv_research.3.d: "Several learned clerics have decided that the [tv_research_target|E] smells too strongly of novelty. Their objections are not fatal, but they are public enough to make assistants whisper before opening a ledger. The [tv_academy_of_sciences|E] can proceed by accepting a season of clerical displeasure, turning suspicion into one more measure of [tv_research_interest|E]."
 tv_research.3.d_printing_press: "Clerics fear that #Y Printing Press#! will give error the same legs as scripture. The [tv_academy_of_sciences|E] can continue, but the pulpits will not bless every page that leaves the press."
 tv_research.3.d_iron_working: "Several learned priests insist that #Y Iron Working#! belongs to noisy yards, not moral instruction. Proceeding would turn their irritation into another spark of attention."
 tv_research.3.d_gunpowder: "The clergy dislike how easily #Y Gunpowder#! turns natural philosophy toward violence. The [tv_academy_of_sciences|E] can accept their displeasure and keep asking why fire obeys some mixtures better than others."
 tv_research.3.d_blast_furnace: "A sermon has compared #Y Blast Furnace#! to human pride trying to improve on honest flame. The [tv_academy_of_sciences|E] can endure the scolding if hotter fires bring clearer answers."
 tv_research.3.d_scientific_experimentation: "Repeated trials make certain theologians nervous, as if #Y Scientific Experimentation#! places judgment in instruments rather than wisdom. Their frowns may still feed useful interest."
 tv_research.3.d_scientific_revolution: "The #Y Scientific Revolution#! has begun to sound, in some ears, like an assault on a well-ordered cosmos. The [tv_academy_of_sciences|E] can proceed while clerics measure every word for rebellion."
 tv_research.3.d_manufactories: "Clerical landlords dislike the talk of #Y Manufactories#! drawing hands from old obligations. Their displeasure is real, but so is the question of organized labor."
 tv_research.3.d_industrialization: "Some preachers call #Y Industrialization#! a promise that turns people into parts. The [tv_academy_of_sciences|E] can keep studying the machines while accepting a season of moral suspicion."
 tv_research.3.d_vaccination: "The notion of #Y Vaccination#! has unsettled priests who prefer providence spoken of carefully. If the [tv_academy_of_sciences|E] proceeds, it must endure holy doubts in the name of earthly survival."
 tv_research.3.d_renaissance: "The #Y Renaissance#! delights tutors and alarms guardians of proper humility. The [tv_academy_of_sciences|E] can turn clerical discomfort into sharper attention to old texts made new."
 tv_research.3.d_banking: "Preachers warn that #Y Banking#! tempts Christians to confuse trust with profit. The [tv_academy_of_sciences|E] can proceed, but the ledgers will carry a little incense and suspicion."
 tv_research.3.d_professional_armies: "Clerics question whether #Y Professional Armies#! teaches discipline or sanctifies violence. Their displeasure may still help make the inquiry impossible to ignore."
 tv_research.3.d_new_world: "Talk of the #Y New World#! troubles those who hear unknown shores as unknown souls. The [tv_academy_of_sciences|E] can continue, but maps will now arrive under watchful theological eyes."
 tv_research.3.d_pike_and_shot: "Some clerics object that #Y Pike and Shot#! makes slaughter look too orderly. The [tv_academy_of_sciences|E] can accept their anger and keep asking how order changes battle."
 tv_research.3.d_confessionalism: "Every discussion of #Y Confessionalism#! steps directly onto clerical ground. Proceeding means turning learned displeasure into attention without letting it become veto."
 tv_research.3.d_global_trade: "The clergy suspect #Y Global Trade#! of carrying strange habits as readily as goods. The [tv_academy_of_sciences|E] can continue, though every foreign ledger will now seem morally damp."
 tv_research.3.d_artillery_institution: "Priests dislike how #Y Siege Artillery#! makes the fall of walls sound like arithmetic. The [tv_academy_of_sciences|E] can bear the rebuke and still measure powder, angle, and consequence."
 tv_research.3.d_military_revolution: "The clergy hear #Y Military Revolution#! and wonder whether reform has forgotten restraint. Their concern may slow the room, but it also proves the question matters."
 tv_research.3.d_enlightenment: "Some sermons now warn that the #Y Enlightenment#! makes reason too proud of its own candle. The [tv_academy_of_sciences|E] can proceed while the pulpit records its displeasure."
 tv_research.3.d_levee_en_masse: "The clergy fear #Y Levée en Masse#! will turn every parish into a muster roll. The [tv_academy_of_sciences|E] can accept their anger and keep studying the terrible reach of national war."
 tv_research.3.a: "Let the theologians frown."
 tv_research.3.b: "Do not stir the pulpit."
 tv_research.4.t: "[tv_research_interest|E]：Merchants Demand Useful Answers"
 tv_research.4.d: "The burghers expected the [tv_academy_of_sciences|E] to produce tools, measures, and clever machines. Instead, they hear talk of the [tv_research_target|E] and wonder whether scholarship has learned to spend money without touching profit. We can absorb their irritation and keep the inquiry moving, though the counting houses will remember the slight."
 tv_research.4.d_printing_press: "Printers and booksellers want #Y Printing Press#! quickly, cheaply, and entirely on their terms. If the [tv_academy_of_sciences|E] refuses their timetable, burgher satisfaction will pay for another month of independent study."
 tv_research.4.d_iron_working: "The burghers ask why #Y Iron Working#! still lives in notes while tools remain expensive. Keeping the inquiry scholarly will irritate them, but better iron deserves better questions."
 tv_research.4.d_gunpowder: "Merchants smell profit in #Y Gunpowder#! and dislike being told that safety must come before sales. The [tv_academy_of_sciences|E] can disappoint them and keep the trials under its own roof."
 tv_research.4.d_blast_furnace: "Founders want #Y Blast Furnace#! turned into contracts before the bricks are even agreed. We can absorb their displeasure and let the [tv_academy_of_sciences|E] measure before merchants invoice."
 tv_research.4.d_scientific_experimentation: "Instrument sellers love #Y Scientific Experimentation#! until experiments delay purchases. The [tv_academy_of_sciences|E] can frustrate the burghers by insisting that proof is not a market stall."
 tv_research.4.d_scientific_revolution: "Publishers and lens-grinders crowd around the #Y Scientific Revolution#!, each hoping to own a piece of wonder. Holding them back will sour smiles in the counting houses."
 tv_research.4.d_manufactories: "Guilds see #Y Manufactories#! as either fortune or threat, depending on whose hands get rearranged. The [tv_academy_of_sciences|E] can keep the plans from private capture at the cost of burgher goodwill."
 tv_research.4.d_industrialization: "Investors want #Y Industrialization#! named, priced, and sold before anyone understands it. Refusing to let capital outrun knowledge will make the counting houses grumble."
 tv_research.4.d_vaccination: "Apothecaries and physicians argue over who will profit from #Y Vaccination#!. The [tv_academy_of_sciences|E] can keep the inquiry public, though burgher patience will thin."
 tv_research.4.d_renaissance: "Patrons of art and letters want the #Y Renaissance#! to flatter their houses first. The [tv_academy_of_sciences|E] can disappoint them and keep the revival broader than one merchant family."
 tv_research.4.d_banking: "Moneyed burghers like #Y Banking#! best when scholarship confirms what they already charge for. Independent inquiry will cost us some smiles across the exchange."
 tv_research.4.d_professional_armies: "Contractors see #Y Professional Armies#! as uniforms, pay chests, and supply lines. The [tv_academy_of_sciences|E] can resist their hurry and let burgher satisfaction take the bruise."
 tv_research.4.d_new_world: "Merchants want the #Y New World#! reduced to ports, spices, and shares. The [tv_academy_of_sciences|E] can insist on charts before profits, which rarely improves a trader's mood."
 tv_research.4.d_pike_and_shot: "Armorers and suppliers want #Y Pike and Shot#! settled by purchase orders. The [tv_academy_of_sciences|E] can keep doctrine ahead of contracts, though burghers will call this delay."
 tv_research.4.d_confessionalism: "Printers and town elders each want #Y Confessionalism#! to serve their own order. Holding the inquiry above their quarrel will not make either side grateful."
 tv_research.4.d_global_trade: "The burghers believe #Y Global Trade#! should begin with their ledgers and end with their margins. The [tv_academy_of_sciences|E] can study wider patterns, at the cost of mercantile irritation."
 tv_research.4.d_artillery_institution: "Gunsmiths hear #Y Siege Artillery#! and immediately hear coin. The [tv_academy_of_sciences|E] can deny them premature contracts while the burghers complain that caution is bad business."
 tv_research.4.d_military_revolution: "Suppliers expect #Y Military Revolution#! to mean new roads of money through their warehouses. The [tv_academy_of_sciences|E] can slow them down and let the counting houses sulk."
 tv_research.4.d_enlightenment: "Booksellers adore the #Y Enlightenment#! when it sells and dislike it when scholars argue too slowly. The [tv_academy_of_sciences|E] can keep the debate serious, though burgher satisfaction will fall."
 tv_research.4.d_levee_en_masse: "Merchants fear #Y Levée en Masse#! will count their clerks as bodies before it counts their accounts. Studying the matter openly will not soothe them."
 tv_research.4.a: "Let the ledgers complain."
 tv_research.4.b: "Keep the merchants sweet."
 tv_research.5.t: "[tv_research_interest|E]：Unsettled Demonstrations"
 tv_research.5.d: "A public demonstration meant to make the [tv_research_target|E] respectable has instead made it alarming. Servants repeat the strangest details, magistrates ask whether this was authorized, and every correction sounds like an admission. The [tv_academy_of_sciences|E] insists the result is still useful if the realm can bear a little disorder."
 tv_research.5.d_printing_press: "A demonstration of movable type drew such a crowd that the street outside the [tv_academy_of_sciences|E] jammed with arguments over pamphlets not yet printed. #Y Printing Press#! has gained attention, and the city has gained one more reason to shout."
 tv_research.5.d_iron_working: "The iron trial ran hotter, louder, and longer than promised, sending smoke over nearby houses. #Y Iron Working#! now has witnesses, complaints, and a sharper place in public conversation."
 tv_research.5.d_gunpowder: "A controlled powder test became uncontrolled theater when the sound carried across the market. Nobody died, but #Y Gunpowder#! now travels through rumor faster than through ledgers."
 tv_research.5.d_blast_furnace: "The furnace demonstration lit the night sky red enough for neighbors to invent three disasters. #Y Blast Furnace#! has impressed the curious and unsettled everyone else."
 tv_research.5.d_scientific_experimentation: "A public experiment contradicted a respected lecturer in front of students, patrons, and several people who came only for warmth. #Y Scientific Experimentation#! has proved its point by disturbing the peace."
 tv_research.5.d_scientific_revolution: "The lecture on celestial order became a shouting match over whether old certainties had been humiliated. #Y Scientific Revolution#! has moved from chalkboard to street corner."
 tv_research.5.d_manufactories: "A model workshop arranged for #Y Manufactories#! made apprentices cheer and masters curse. The demonstration worked, which is why it caused trouble."
 tv_research.5.d_industrialization: "The prototype machine lurched, clattered, and kept moving after the operator stepped back. #Y Industrialization#! has given the crowd a miracle and the magistrates a headache."
 tv_research.5.d_vaccination: "A vaccination trial saved its most persuasive evidence for the most anxious audience possible: parents. Relief, anger, gratitude, and fear now make #Y Vaccination#! impossible to ignore."
 tv_research.5.d_renaissance: "A public reading of recovered texts turned into a quarrel over taste, authority, and who may call themselves learned. The #Y Renaissance#! has entered the city with elbows."
 tv_research.5.d_banking: "A staged banking exercise made several people realize how much power can hide inside a promise. #Y Banking#! has disturbed the street by making trust look mechanical."
 tv_research.5.d_professional_armies: "A drill display for #Y Professional Armies#! impressed the crowd until recruits began arguing with local watchmen over whose discipline was real. Order has learned to trip over itself."
 tv_research.5.d_new_world: "New maps of the #Y New World#! were unveiled and immediately surrounded by volunteers, doubters, and investors shouting over each other. Discovery is not a quiet word."
 tv_research.5.d_pike_and_shot: "The pike and shot demonstration filled the square with smoke, timing calls, and civilians discovering where not to stand. #Y Pike and Shot#! has made doctrine visible and public order thinner."
 tv_research.5.d_confessionalism: "A debate on #Y Confessionalism#! drew printers, priests, and magistrates into the same room, which was the first mistake. The [tv_academy_of_sciences|E] gained attention; the city gained rumors."
 tv_research.5.d_global_trade: "A display of trade routes for #Y Global Trade#! sent merchants rushing to deny, confirm, and exploit the same figures. Stability suffers when every ledger becomes an accusation."
 tv_research.5.d_artillery_institution: "The artillery demonstration cracked an old wall that had not agreed to be educational. #Y Siege Artillery#! now has proof, witnesses, and an angry neighborhood."
 tv_research.5.d_military_revolution: "A mobilization exercise for #Y Military Revolution#! revealed how quickly order can look like panic when drums begin early. The [tv_academy_of_sciences|E] has data; the streets have nerves."
 tv_research.5.d_enlightenment: "A public disputation on the #Y Enlightenment#! made apprentices quote philosophers at magistrates. Reason has acquired volume, and order has lost a little sleep."
 tv_research.5.d_levee_en_masse: "An enrollment exercise for #Y Levée en Masse#! turned theoretical numbers into frightened households. The realm has glimpsed total mobilization, and the glimpse has shaken it."
 tv_research.5.a: "Order can wobble; knowledge must not."
 tv_research.5.b: "Close the doors until calm returns."
 tv_research.6.t: "[tv_research_interest|E]：A Crowned Doubt"
 tv_research.6.d: "The inquiry has brushed against royal certainty. Nobody says the [tv_research_target|E] challenges the throne, but the phrasing is careful enough to prove the thought has occurred. Advancing the work now will cost a measure of [legitimacy|E], as if the crown itself must lean aside so the question can pass."
 tv_research.6.d_printing_press: "Advisers warn that #Y Printing Press#! may give subjects a voice faster than the crown can answer it. Supporting the inquiry means trusting royal authority to stand in brighter light."
 tv_research.6.d_iron_working: "The crown's officers ask why #Y Iron Working#! should be guided by scholars rather than traditional masters of supply. Backing the [tv_academy_of_sciences|E] will make royal judgment look bold, and a little exposed."
 tv_research.6.d_gunpowder: "The generals insist #Y Gunpowder#! belongs under military secrecy, not academic curiosity. The crown can overrule them, but royal certainty will take the cost."
 tv_research.6.d_blast_furnace: "Court engineers argue that #Y Blast Furnace#! touches strategic metal too closely for open inquiry. Letting the [tv_academy_of_sciences|E] proceed makes the crown responsible for whatever heat it releases."
 tv_research.6.d_scientific_experimentation: "By endorsing #Y Scientific Experimentation#!, the crown admits that even official wisdom must submit to repeated tests. That is useful, dangerous, and not entirely flattering to authority."
 tv_research.6.d_scientific_revolution: "The #Y Scientific Revolution#! asks whether old explanations may be replaced when evidence grows teeth. If the crown sponsors that question, it also teaches others how to ask."
 tv_research.6.d_manufactories: "Noble households fear #Y Manufactories#! will reorder labor beyond their familiar reach. Royal support makes the crown look like the author of every displaced habit."
 tv_research.6.d_industrialization: "#Y Industrialization#! promises power large enough to change who matters. Sponsoring it will make the crown seem visionary to some and reckless to those who prefer known hierarchies."
 tv_research.6.d_vaccination: "A royal endorsement of #Y Vaccination#! would put the crown between household fear and medical hope. If the work stumbles, legitimacy will bleed before the doctors can explain."
 tv_research.6.d_renaissance: "The #Y Renaissance#! flatters princes, but it also teaches old texts to judge present rulers. Supporting it means accepting that learning may praise the crown and measure it."
 tv_research.6.d_banking: "#Y Banking#! gives royal promises new instruments, and therefore new witnesses. The crown can sponsor the inquiry, but every future creditor will remember the lesson."
 tv_research.6.d_professional_armies: "#Y Professional Armies#! asks soldiers to belong to institutions before patrons. The crown can support it, though old loyalties will hear a challenge."
 tv_research.6.d_new_world: "The #Y New World#! expands royal imagination and royal liability at the same time. Sponsoring the inquiry makes the crown responsible for horizons no official has yet governed."
 tv_research.6.d_pike_and_shot: "#Y Pike and Shot#! implies that noble courage must stand inside drilled geometry. Supporting it may strengthen armies while thinning the old romance of command."
 tv_research.6.d_confessionalism: "#Y Confessionalism#! binds doctrine and statecraft so tightly that every error may look royal. The crown can proceed, but legitimacy will stand close to the flame."
 tv_research.6.d_global_trade: "#Y Global Trade#! teaches that distant markets can tug at royal policy. Sponsoring the inquiry admits the crown rules in a world larger than its ceremonies."
 tv_research.6.d_artillery_institution: "#Y Siege Artillery#! places royal authority behind tools that can unmake ancient defenses. The crown can accept that burden, but stone and status will both notice."
 tv_research.6.d_military_revolution: "The #Y Military Revolution#! suggests that yesterday's honored system may no longer suffice. Royal support will look like wisdom to reformers and betrayal to veterans."
 tv_research.6.d_enlightenment: "The #Y Enlightenment#! is polite until reason starts asking who authorized the room. Sponsoring it will cost the crown a measure of unquestioned certainty."
 tv_research.6.d_levee_en_masse: "#Y Levée en Masse#! treats the people as a national force, not merely subjects beneath banners. If the crown studies that idea, legitimacy must bend around a larger nation."
 tv_research.6.a: "The crown can survive a question."
 tv_research.6.b: "Some doubts are too expensive."
