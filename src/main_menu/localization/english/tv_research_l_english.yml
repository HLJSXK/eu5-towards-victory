 # tv_research.1 — Monthly Interest Event
 tv_research.1.t: "A Spark of Curiosity"
 tv_research.1.d: "A member of the court has demonstrated unusual intellectual curiosity related to our Academy's current research topic. Their enthusiasm may prove valuable if nurtured."
 tv_research.1.a: "Encourage the inquiry."
 tv_research.1.b: "This is a distraction. Dismiss it."

 # tv_research.10 — Target Selection Proposal
 tv_research.10.t: "The Academy Proposes a Research Direction"
 tv_research.10.d_printing_press: "The scholars of our Academy have identified the Printing Press as a promising avenue for research. If we authorize this investigation, our finest minds will dedicate themselves to this breakthrough."
 tv_research.10.d_iron_working: "The scholars of our Academy have identified Iron Working as a promising avenue for research. If we authorize this investigation, our finest minds will dedicate themselves to this breakthrough."
