 tv_research.103.a: "Ease the strain before it eats the work."
 tv_research.104.t: "[tv_concentrated_research|E]：Total Failure!"
 tv_research.104.d: "The premise at the center of the work has cracked cleanly in half. [SCOPE.sCharacter('tv_research_scientist').GetShortName] tried to defend it with new measurements, then with old authorities, and finally with silence. There is no useful way to pretend the [tv_research_target|E] still rests on this foundation. [tv_concentrated_research|E] must begin again from the wreckage, which is at least honest enough to stop lying.\n\n#R This event appeared because your [tv_chief_scientist|E]'s [tv_effective_administrative_skill|E] is below 20.#!"
 tv_research.104.a: "Salvage what can still teach us."
 tv_research.105.t: "[tv_concentrated_research|E]：Scientist Collapses!"
 tv_research.105.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName] has pushed past every sensible limit, and the body has finally issued its veto. The assistants found unfinished notes beside medicine, cold food, and a lamp that should have been extinguished hours earlier. [tv_concentrated_research|E] has taken health as payment for speed, which is a bargain no academy should accept lightly. The room remains full of work, but the chair at its center now looks frighteningly fragile.\n\n#R This event appeared because your [tv_chief_scientist|E]'s [tv_effective_administrative_skill|E] is below 20.#!"
 tv_research.105.a: "No discovery is worth an empty chair."
 tv_research.106.t: "[tv_concentrated_research|E]：Botched!"
 tv_research.106.d: "One of the [tv_academy_of_sciences|E]' costly instruments has shattered at the worst possible hour. [SCOPE.sCharacter('tv_research_scientist').GetShortName] insists the attempt was necessary, but the floor is still glittering with proof that necessity can be clumsy. The assistants are already arguing over which readings remain usable and which must be buried with the glass. [tv_concentrated_research|E] can continue, but it will do so with less dignity and fewer tools.\n\n#R This event appeared because your [tv_chief_scientist|E]'s [tv_effective_administrative_skill|E] is below 20.#!"
 tv_research.106.a: "Replace it before the work cools."
 tv_research.106.b: "Catalogue the fragments and continue."
 tv_research.107.t: "[tv_concentrated_research|E]：Vast Material Consumption!"
 tv_research.107.d: "The project is consuming ink, glass, rare powders, metal fittings, and patience at an alarming rate. [SCOPE.sCharacter('tv_research_scientist').GetShortName] calls it necessary iteration, while the quartermasters call it an expensive appetite with handwriting. The [tv_academy_of_sciences|E] cannot complete [tv_concentrated_research|E] on empty shelves. We must buy replacements before thrift becomes another form of failure.\n\n#R This event appeared because your [tv_chief_scientist|E]'s [tv_effective_administrative_skill|E] is below 50.#!"
 tv_research.107.a: "Buy what the tables require."
 tv_research.108.t: "[tv_concentrated_research|E]：Wrong Direction!"
 tv_research.108.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName]'s approach is elegant enough to be dangerous. It explains the early results beautifully, then fails every time the [tv_research_target|E] asks a harder question. The assistants have begun to copy the method with the nervous obedience of people who know it is wrong but not yet authorized to say so. [tv_concentrated_research|E] must turn before pride hardens into procedure.\n\n#R This event appeared because your [tv_chief_scientist|E]'s [tv_effective_administrative_skill|E] is below 50.#!"
 tv_research.108.a: "Turn the compass before pride hardens."
 tv_research.109.t: "[tv_concentrated_research|E]：Absurd Claim!"
 tv_research.109.d: "Before the [tv_academy_of_sciences|E] could polish the argument, [SCOPE.sCharacter('tv_research_scientist').GetShortName] made it public. The claim was bold, memorable, and wrong in a way even bored nobles can enjoy. Courtiers are already repeating it with improvements, which is how ridicule becomes durable. [tv_concentrated_research|E] has not merely stumbled; it has performed the stumble before an audience.\n\n#R This event appeared because your [tv_chief_scientist|E]'s [tv_effective_administrative_skill|E] is below 50.#!"
 tv_research.109.a: "Withdraw the claim quietly."
 tv_research.110.t: "[tv_concentrated_research|E]：Clumsy Work!"
 tv_research.110.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName] has become trapped in a small task that should never have reached the cabinet. Every day spent perfecting its arrangement is a day stolen from the [tv_research_target|E], and everyone knows it except the person guarding the mistake. A minister must now enter the laboratory with the forced patience of a diplomat at a family quarrel. [tv_concentrated_research|E] sometimes needs brilliance; today it needs someone to move the papers.\n\n#R This event appeared because your [tv_chief_scientist|E]'s [tv_effective_administrative_skill|E] is below 50.#!"
 tv_research.110.a: "Send the cabinet to unjam the machine."
 tv_research.111.t: "[tv_concentrated_research|E]：Help Needed!"
 tv_research.111.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName] has admitted that the work cannot be completed alone. The admission was late, proud, and necessary, which means it may still save the [tv_research_target|E]. [SCOPE.sCharacter('tv_research_cabinet').GetShortName] will have to sit among the tables, translate scattered demands into orders, and make the assistants trust the schedule again. [tv_concentrated_research|E] is no less scholarly for needing another pair of hands.\n\n#R This event appeared because your [tv_chief_scientist|E]'s [tv_effective_administrative_skill|E] is at least 20 but below 50.#!"
 tv_research.111.a: "Put the aide at the table."
 tv_research.112.t: "[tv_concentrated_research|E]：Request for Additional Materials!"
 tv_research.112.d: "Consumable stores are disappearing faster than the neat estimates promised. [SCOPE.sCharacter('tv_research_scientist').GetShortName] blames unexpected complexity, which is what scholars call a bill when they do not want to call it a bill. The [tv_academy_of_sciences|E] can slow the work and stretch the shelves, or buy enough material to keep [tv_concentrated_research|E] moving. Either choice will be remembered by the clerks who must make arithmetic look like policy.\n\n#R This event appeared because your [tv_chief_scientist|E]'s [tv_effective_administrative_skill|E] is at least 20 but below 50.#!"
 tv_research.112.a: "Stretch the stores and accept delay."
 tv_research.112.b: "Pay for fresh stock."
 tv_research.113.t: "[tv_concentrated_research|E]：An Argument!"
 tv_research.113.d: "The debate has spilled out of the lecture room and into noble pride. [SCOPE.sCharacter('tv_research_scientist').GetShortName] may be correct, but correctness delivered like a slap rarely improves satisfaction. Aristocratic patrons now mutter that the [tv_academy_of_sciences|E] takes money politely and returns contempt in Latin. [tv_concentrated_research|E] can survive an argument, but it cannot survive every patron deciding humiliation is part of the curriculum.\n\n#R This event appeared because your [tv_chief_scientist|E]'s [tv_effective_administrative_skill|E] is at least 20 but below 50.#!"
 tv_research.113.a: "Cool noble tempers."
 tv_research.114.t: "[tv_concentrated_research|E]：A Bold Proposal!"
 tv_research.114.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName] has set a wild proposal in the middle of the room and refused to let anyone walk around it. It may open a direct path toward the [tv_research_target|E], or it may become the kind of mistake people cite for a generation. The assistants are divided between terror and admiration, which is often how dangerous ideas introduce themselves. [tv_concentrated_research|E] asks whether we want orderly caution or the possibility of a leap.\n\n#Y This event appeared because your [tv_chief_scientist|E]'s [tv_effective_administrative_skill|E] is at least 20 but below 80.#!"
 tv_research.114.a: "Let the dangerous idea breathe."
 tv_research.115.t: "[tv_concentrated_research|E]：Expand the Test Scale!"
 tv_research.115.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName] wants to run the work in parallel rather than single file. More tables, more hands, and more simultaneous errors could drag the [tv_research_target|E] closer, provided the room does not collapse into expensive noise. The [tv_academy_of_sciences|E] has enough ambition for the scheme, but ambition is not the same as budget. [tv_concentrated_research|E] now asks whether scale is courage or impatience.\n\n#Y This event appeared because your [tv_chief_scientist|E]'s [tv_effective_administrative_skill|E] is at least 20 but below 80.#!"
 tv_research.115.a: "Fund the wider trial."
 tv_research.115.b: "One table is enough."
 tv_research.116.t: "[tv_concentrated_research|E]：Reassign the Team!"
 tv_research.116.d: "The current team has begun to protect habits instead of results. [SCOPE.sCharacter('tv_research_scientist').GetShortName] wants [SCOPE.sCharacter('tv_research_cabinet').GetShortName] to reshuffle duties, separate old rivalries, and put the loudest assistants where their noise can become useful. Such changes may jolt [tv_concentrated_research|E] forward, or merely give everyone new reasons to resent each other. The [tv_academy_of_sciences|E] waits to see whether order must be repaired or disturbed.\n\n#Y This event appeared because your [tv_chief_scientist|E]'s [tv_effective_administrative_skill|E] is at least 20 but below 80.#!"
 tv_research.116.a: "Reshuffle the room."
 tv_research.116.b: "Leave the order undisturbed."
 tv_research.117.t: "[tv_concentrated_research|E]：Mixed Blessing!"
 tv_research.117.d: "By dawn, [SCOPE.sCharacter('tv_research_scientist').GetShortName] had done it. A major advance lies on the desk, surrounded by cooling wax, exhausted assistants, and the dangerous quiet that follows too much effort. The [tv_research_target|E] is closer, but the person who dragged it closer has paid in health. [tv_concentrated_research|E] has offered a blessing with teeth, and the room knows better than to cheer too loudly.\n\n#Y This event appeared because your [tv_chief_scientist|E]'s [tv_effective_administrative_skill|E] is at least 20 but below 80.#!"
 tv_research.117.a: "Progress has taken its tithe."
 tv_research.118.t: "[tv_concentrated_research|E]：The Power of Money!"
 tv_research.118.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName] has bought speed before asking permission. The results are real enough to make anger inconvenient, and the receipts are large enough to make approval embarrassing. The [tv_academy_of_sciences|E] can call it initiative, while the treasury calls it a raid conducted with polite handwriting. [tv_concentrated_research|E] advances, but now the state must pay for the lesson that money can outrun procedure.\n\n#Y This event appeared because your [tv_chief_scientist|E]'s [tv_effective_administrative_skill|E] is at least 20 but below 80.#!"
 tv_research.118.a: "Pay, then ask for receipts."
 tv_research.119.t: "[tv_concentrated_research|E]：Request for Royal Authorization!"
 tv_research.119.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName] requests authority to cut through permissions, seize time from lesser offices, and command materials before committees can fall asleep over them. Such power could bring the [tv_research_target|E] sharply closer. It could also teach the [tv_academy_of_sciences|E] that urgency is a fine excuse for ruling its neighbors. [tv_concentrated_research|E] is asking for a royal seal, and seals remember who borrowed them.\n\n#Y This event appeared because your [tv_chief_scientist|E]'s [tv_effective_administrative_skill|E] is at least 20 but below 80.#!"
 tv_research.119.a: "Give the seal to the science."
 tv_research.119.b: "Keep the seal in the cabinet."
 tv_research.120.t: "[tv_concentrated_research|E]：Recognition and Learning!"
 tv_research.120.d: "Practice has changed [SCOPE.sCharacter('tv_research_scientist').GetShortName]. The same tables that once demanded effort now receive judgement before the ink dries, and assistants find their mistakes corrected before they can become habits. The [tv_academy_of_sciences|E] notices this sort of improvement because it makes every other task less dramatic. [tv_concentrated_research|E] proceeds more smoothly when mastery no longer needs to announce itself.\n\n#G This event appeared because your [tv_chief_scientist|E]'s [tv_effective_administrative_skill|E] is at least 50 but below 80.#!"
 tv_research.120.a: "Let mastery settle in."
 tv_research.121.t: "[tv_concentrated_research|E]：Cabinet Cooperation!"
 tv_research.121.d: "Recent work by [SCOPE.sCharacter('tv_research_scientist').GetShortName] has made the cabinet less theatrical and more useful. Ministers who once arrived with opinions now arrive with lists, which the [tv_academy_of_sciences|E] regards as a minor miracle. The example spreads because competence is easier to imitate when it is visibly rewarded. [tv_concentrated_research|E] gains not only progress, but a government briefly willing to behave like a research instrument.\n\n#G This event appeared because your [tv_chief_scientist|E]'s [tv_effective_administrative_skill|E] is at least 50 but below 80.#!"
 tv_research.121.a: "Let example do its quiet work."
 tv_research.122.t: "[tv_concentrated_research|E]：A Clue!"
 tv_research.122.d: "Something small has refused to fit. [SCOPE.sCharacter('tv_research_scientist').GetShortName] noticed the stubborn detail precisely because everyone else had decided it was an error. It may lead nowhere, but many good roads first disguise themselves as irritations in the margin. The [tv_research_target|E] remains distant, yet [tv_concentrated_research|E] has acquired a thread worth pulling.\n\n#G This event appeared because your [tv_chief_scientist|E]'s [tv_effective_administrative_skill|E] is at least 50 but below 80.#!"
 tv_research.122.a: "Follow the stubborn clue."
 tv_research.123.t: "[tv_concentrated_research|E]：Research Partner!"
 tv_research.123.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName] and [SCOPE.sCharacter('tv_research_cabinet').GetShortName] stole time from formal duties to argue over the project. What began as explanation became exchange, then correction, then the rare pleasure of two minds discovering that neither had brought enough paper. Both leave sharper than they arrived. [tv_concentrated_research|E] benefits when scholarship stops being a solitary performance and becomes a room where answers can be improved aloud.\n\n#G This event appeared because your [tv_chief_scientist|E]'s [tv_effective_administrative_skill|E] is at least 50.#!"
 tv_research.123.a: "Good minds sharpen each other."
 tv_research.124.t: "[tv_concentrated_research|E]：Immediate Rebate!"
 tv_research.124.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName]'s prototype has walked out of theory and into a noble's purse. The demonstration was brief, dazzling, and practical enough that even courtiers understood where the money should go. The payment has been turned over to the state, giving the [tv_academy_of_sciences|E] the rare joy of explaining that science can pay a bill. [tv_concentrated_research|E] advances under a warmer light when the treasury smiles.\n\n#G This event appeared because your [tv_chief_scientist|E]'s [tv_effective_administrative_skill|E] is at least 50.#!"
 tv_research.124.a: "Put the money back into order."
 tv_research.125.t: "[tv_concentrated_research|E]：Diligence!"
 tv_research.125.d: "The [tv_academy_of_sciences|E] has had a rare good week. [SCOPE.sCharacter('tv_research_scientist').GetShortName] has turned decisions into results before committees could weigh them down, and the assistants have started to expect competence rather than rescue. We can keep every gain pointed at the [tv_research_target|E], or let part of the success become public glory. [tv_concentrated_research|E] offers a pleasant problem: what should be done with efficiency when there is finally enough of it?\n\n#G This event appeared because your [tv_chief_scientist|E]'s [tv_effective_administrative_skill|E] is at least 50.#!"
 tv_research.125.a: "Keep every hand on the research."
 tv_research.125.b: "Let success become public prestige."
 tv_research.126.t: "[tv_concentrated_research|E]：Public Seminar!"
 tv_research.126.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName] opened the doors for a public seminar, carefully hiding the parts of [tv_concentrated_research|E] that would alarm patrons or bore them into cruelty. The crowd heard enough to feel included and not enough to interfere. Students left inspired, nobles left flattered, and the [tv_academy_of_sciences|E] left with more goodwill than it had in the morning. The [tv_research_target|E] is not closer by measure, but the country is more willing to believe it will be reached.\n\n#G This event appeared because your [tv_chief_scientist|E]'s [tv_effective_administrative_skill|E] is at least 50.#!"
 tv_research.126.a: "Let the applause do some work."
 tv_research.127.t: "[tv_concentrated_research|E]：Breakthrough!"
 tv_research.127.d: "The latest inference has survived every attempt to kill it. [SCOPE.sCharacter('tv_research_scientist').GetShortName] tested the claim from hostile angles, invited objections, and watched the result stand straighter each time. The [tv_academy_of_sciences|E] knows the sound of a real breakthrough: first silence, then frantic copying. [tv_concentrated_research|E] has found a door in the wall, and this time the door opens.\n\n#G This event appeared because your [tv_chief_scientist|E]'s [tv_effective_administrative_skill|E] is at least 80.#!"
 tv_research.127.a: "That is the sound of a door opening."
 tv_research.128.t: "[tv_concentrated_research|E]：Coordinated Progress!"
 tv_research.128.d: "The finding has traveled into clergy-led scholarship faster than expected. [SCOPE.sCharacter('tv_research_scientist').GetShortName] framed the work carefully enough that learned clerics can use it without feeling conquered by it. Sermons, schools, and quiet correspondence now carry pieces of the [tv_research_target|E] beyond the [tv_academy_of_sciences|E] walls. [tv_concentrated_research|E] has become more than a closed room; it has found another road through the realm.\n\n#G This event appeared because your [tv_chief_scientist|E]'s [tv_effective_administrative_skill|E] is at least 80.#!"
 tv_research.128.a: "Knowledge has found another road."
 tv_research.129.t: "[tv_concentrated_research|E]：A Model Scholar!"
 tv_research.129.d: "Word of [SCOPE.sCharacter('tv_research_scientist').GetShortName]'s progress has escaped the [tv_academy_of_sciences|E] in the best possible form: admiration rather than scandal. Courtiers who could not explain the work yesterday now praise its discipline, its promise, and, naturally, the wisdom of the royal house that sponsored it. The [tv_research_target|E] has become a symbol as well as a task. [tv_concentrated_research|E] gains momentum when prestige itself starts carrying the papers.\n\n#G This event appeared because your [tv_chief_scientist|E]'s [tv_effective_administrative_skill|E] is at least 80.#!"
 tv_research.129.a: "Let the court enjoy a learned victory."

 # tv_research.30 — Advance Unlocked Notification
 tv_research.30.t: "[tv_concentrated_research|E]：A Breakthrough Has Been Achieved!"
 tv_research.30.d_printing_press: "The locked room has opened, and the [tv_academy_of_sciences|E] has emerged with #bold Printing Press#! no longer a rumor but a working body of knowledge. The final tables are stained with wax, correction marks, and the fingerprints of assistants who forgot to sleep. The [tv_chief_scientist|E] presents the conclusion with suspicious calm, as if triumph were simply the last line of a proper ledger. Outside the [tv_academy_of_sciences|E], scribes, priests, officials, and merchants are already asking how quickly the discovery can be made useful. The old [tv_research_target|E] is complete; the realm must now learn what to do with the answer."
