 # tv_research.10 — Target Selection Proposal
 tv_research.10.t: "[tv_research_target|E]：The [tv_academy_of_sciences|E] Proposes a Research Direction"
 tv_research.10.d_printing_press: "The [tv_academy_of_sciences|E] has turned its attention toward movable type, not with certainty, but with the hunger that follows a locked door. Lecturers have begun speaking around the subject, scribes have copied suspiciously similar diagrams, and patrons now pretend they always cared about movable type.\n\n#Y Target Technology: Printing Press#!\n\nIf we authorize it, [tv_research_interest|E] will need to be cultivated until gossip becomes commitment. The [tv_chief_scientist|E] warns that breakthrough work begins as enthusiasm, then immediately demands discipline."
 tv_research.10.d_iron_working: "The [tv_academy_of_sciences|E] has turned its attention toward harder metal, not with certainty, but with the hunger that follows a locked door. Lecturers have begun speaking around the subject, scribes have copied suspiciously similar diagrams, and patrons now pretend they always cared about furnaces and ore.\n\n#Y Target Technology: Iron Working#!\n\nIf we authorize it, [tv_research_interest|E] will need to be cultivated until gossip becomes commitment. The [tv_chief_scientist|E] warns that breakthrough work begins as enthusiasm, then immediately demands discipline."
 tv_research.10.d_gunpowder: "The [tv_academy_of_sciences|E] has turned its attention toward smoke, saltpeter, and thunder, not with certainty, but with the hunger that follows a locked door. Lecturers have begun speaking around the subject, scribes have copied suspiciously similar diagrams, and patrons now pretend they always cared about controlled explosions.\n\n#Y Target Technology: Gunpowder#!\n\nIf we authorize it, [tv_research_interest|E] will need to be cultivated until gossip becomes commitment. The [tv_chief_scientist|E] warns that breakthrough work begins as enthusiasm, then immediately demands discipline."
 tv_research.10.d_blast_furnace: "The [tv_academy_of_sciences|E] has turned its attention toward hotter fires, not with certainty, but with the hunger that follows a locked door. Lecturers have begun speaking around the subject, scribes have copied suspiciously similar diagrams, and patrons now pretend they always cared about draughts and brickwork.\n\n#Y Target Technology: Blast Furnace#!\n\nIf we authorize it, [tv_research_interest|E] will need to be cultivated until gossip becomes commitment. The [tv_chief_scientist|E] warns that breakthrough work begins as enthusiasm, then immediately demands discipline."
 tv_research.10.d_scientific_experimentation: "The [tv_academy_of_sciences|E] has turned its attention toward repeatable proof, not with certainty, but with the hunger that follows a locked door. Lecturers have begun speaking around the subject, scribes have copied suspiciously similar diagrams, and patrons now pretend they always cared about instruments that can embarrass memory.\n\n#Y Target Technology: Scientific Experimentation#!\n\nIf we authorize it, [tv_research_interest|E] will need to be cultivated until gossip becomes commitment. The [tv_chief_scientist|E] warns that breakthrough work begins as enthusiasm, then immediately demands discipline."
 tv_research.10.d_scientific_revolution: "The [tv_academy_of_sciences|E] has turned its attention toward remaking the order of nature, not with certainty, but with the hunger that follows a locked door. Lecturers have begun speaking around the subject, scribes have copied suspiciously similar diagrams, and patrons now pretend they always cared about new laws for old heavens.\n\n#Y Target Technology: Scientific Revolution#!\n\nIf we authorize it, [tv_research_interest|E] will need to be cultivated until gossip becomes commitment. The [tv_chief_scientist|E] warns that breakthrough work begins as enthusiasm, then immediately demands discipline."
 tv_research.10.d_manufactories: "The [tv_academy_of_sciences|E] has turned its attention toward disciplined workshops, not with certainty, but with the hunger that follows a locked door. Lecturers have begun speaking around the subject, scribes have copied suspiciously similar diagrams, and patrons now pretend they always cared about labor divided into clever pieces.\n\n#Y Target Technology: Manufactories#!\n\nIf we authorize it, [tv_research_interest|E] will need to be cultivated until gossip becomes commitment. The [tv_chief_scientist|E] warns that breakthrough work begins as enthusiasm, then immediately demands discipline."
 tv_research.10.d_industrialization: "The [tv_academy_of_sciences|E] has turned its attention toward machines that refuse to sleep, not with certainty, but with the hunger that follows a locked door. Lecturers have begun speaking around the subject, scribes have copied suspiciously similar diagrams, and patrons now pretend they always cared about power harnessed to production.\n\n#Y Target Technology: Industrialization#!\n\nIf we authorize it, [tv_research_interest|E] will need to be cultivated until gossip becomes commitment. The [tv_chief_scientist|E] warns that breakthrough work begins as enthusiasm, then immediately demands discipline."
 tv_research.10.d_vaccination: "The [tv_academy_of_sciences|E] has turned its attention toward teaching bodies to survive, not with certainty, but with the hunger that follows a locked door. Lecturers have begun speaking around the subject, physicians have copied suspiciously similar cases, and patrons now pretend they always cared about rural medical notes.\n\n#Y Target Technology: Vaccination#!\n\nIf we authorize it, [tv_research_interest|E] will need to be cultivated until gossip becomes commitment. The [tv_chief_scientist|E] warns that breakthrough work begins as enthusiasm, then immediately demands discipline."
 tv_research.10.d_renaissance: "The [tv_academy_of_sciences|E] has turned its attention toward old learning made new, not with certainty, but with the hunger that follows a locked door. Lecturers have begun speaking around the subject, scribes have copied suspiciously elegant manuscripts, and patrons now pretend they always cared about ancient authorities.\n\n#Y Target Technology: Renaissance#!\n\nIf we authorize it, [tv_research_interest|E] will need to be cultivated until gossip becomes commitment. The [tv_chief_scientist|E] warns that breakthrough work begins as enthusiasm, then immediately demands discipline."
 tv_research.10.d_banking: "The [tv_academy_of_sciences|E] has turned its attention toward credit, trust, and risk, not with certainty, but with the hunger that follows a locked door. Lecturers have begun speaking around the subject, scribes have copied suspiciously neat ledgers, and patrons now pretend they always cared about the science of promises.\n\n#Y Target Technology: Banking#!\n\nIf we authorize it, [tv_research_interest|E] will need to be cultivated until gossip becomes commitment. The [tv_chief_scientist|E] warns that breakthrough work begins as enthusiasm, then immediately demands discipline."
 tv_research.10.d_professional_armies: "The [tv_academy_of_sciences|E] has turned its attention toward turning soldiers into institutions, not with certainty, but with the hunger that follows a locked door. Lecturers have begun speaking around the subject, clerks have copied suspiciously similar rosters, and patrons now pretend they always cared about drill and pay.\n\n#Y Target Technology: Professional Armies#!\n\nIf we authorize it, [tv_research_interest|E] will need to be cultivated until gossip becomes commitment. The [tv_chief_scientist|E] warns that breakthrough work begins as enthusiasm, then immediately demands discipline."
 tv_research.10.d_new_world: "The [tv_academy_of_sciences|E] has turned its attention toward horizons that refuse old maps, not with certainty, but with the hunger that follows a locked door. Lecturers have begun speaking around the subject, cartographers have copied suspiciously incomplete coastlines, and patrons now pretend they always cared about western winds.\n\n#Y Target Technology: New World#!\n\nIf we authorize it, [tv_research_interest|E] will need to be cultivated until gossip becomes commitment. The [tv_chief_scientist|E] warns that breakthrough work begins as enthusiasm, then immediately demands discipline."
 tv_research.10.d_pike_and_shot: "The [tv_academy_of_sciences|E] has turned its attention toward formation, smoke, and timing, not with certainty, but with the hunger that follows a locked door. Lecturers have begun speaking around the subject, drillmasters have copied suspiciously similar diagrams, and patrons now pretend they always cared about infantry geometry.\n\n#Y Target Technology: Pike and Shot#!\n\nIf we authorize it, [tv_research_interest|E] will need to be cultivated until gossip becomes commitment. The [tv_chief_scientist|E] warns that breakthrough work begins as enthusiasm, then immediately demands discipline."
 tv_research.10.d_confessionalism: "The [tv_academy_of_sciences|E] has turned its attention toward doctrine disciplined into statecraft, not with certainty, but with the hunger that follows a locked door. Lecturers have begun speaking around the subject, clerks have copied suspiciously careful formulas, and patrons now pretend they always cared about the architecture of belief.\n\n#Y Target Technology: Confessionalism#!\n\nIf we authorize it, [tv_research_interest|E] will need to be cultivated until gossip becomes commitment. The [tv_chief_scientist|E] warns that breakthrough work begins as enthusiasm, then immediately demands discipline."
 tv_research.10.d_global_trade: "The [tv_academy_of_sciences|E] has turned its attention toward ledgers that cross oceans, not with certainty, but with the hunger that follows a locked door. Lecturers have begun speaking around the subject, factors have copied suspiciously distant prices, and patrons now pretend they always cared about markets answering markets.\n\n#Y Target Technology: Global Trade#!\n\nIf we authorize it, [tv_research_interest|E] will need to be cultivated until gossip becomes commitment. The [tv_chief_scientist|E] warns that breakthrough work begins as enthusiasm, then immediately demands discipline."
 tv_research.10.d_artillery_institution: "The [tv_academy_of_sciences|E] has turned its attention toward mathematics with a barrel, not with certainty, but with the hunger that follows a locked door. Lecturers have begun speaking around the subject, engineers have copied suspiciously similar firing tables, and patrons now pretend they always cared about angles and walls.\n\n#Y Target Technology: Siege Artillery#!\n\nIf we authorize it, [tv_research_interest|E] will need to be cultivated until gossip becomes commitment. The [tv_chief_scientist|E] warns that breakthrough work begins as enthusiasm, then immediately demands discipline."
 tv_research.10.d_military_revolution: "The [tv_academy_of_sciences|E] has turned its attention toward rebuilding war from its bones, not with certainty, but with the hunger that follows a locked door. Lecturers have begun speaking around the subject, quartermasters have copied suspiciously similar tables, and patrons now pretend they always cared about command as a system.\n\n#Y Target Technology: Military Revolution#!\n\nIf we authorize it, [tv_research_interest|E] will need to be cultivated until gossip becomes commitment. The [tv_chief_scientist|E] warns that breakthrough work begins as enthusiasm, then immediately demands discipline."
 tv_research.10.d_enlightenment: "The [tv_academy_of_sciences|E] has turned its attention toward reason made public, not with certainty, but with the hunger that follows a locked door. Lecturers have begun speaking around the subject, writers have copied suspiciously bright essays, and patrons now pretend they always cared about useful doubt.\n\n#Y Target Technology: Enlightenment#!\n\nIf we authorize it, [tv_research_interest|E] will need to be cultivated until gossip becomes commitment. The [tv_chief_scientist|E] warns that breakthrough work begins as enthusiasm, then immediately demands discipline."
 tv_research.10.d_levee_en_masse: "The [tv_academy_of_sciences|E] has turned its attention toward turning society itself into military force, not with certainty, but with the hunger that follows a locked door. Lecturers have begun speaking around the subject, clerks have copied suspiciously comprehensive lists, and patrons now pretend they always cared about the nation counted in full.\n\n#Y Target Technology: Levée en Masse#!\n\nIf we authorize it, [tv_research_interest|E] will need to be cultivated until gossip becomes commitment. The [tv_chief_scientist|E] warns that breakthrough work begins as enthusiasm, then immediately demands discipline."
