 # ── Medicine events ───────────────────────────────────────────────────────────
 tv_medicine.1.t: "[tv_academy_medical_treatment|E]：Critical Medical Finding"
 tv_medicine.1.d: "The [tv_chief_scientist|E] has found a pattern in the patient's suffering that had escaped ordinary physicians. Pulse, fever, memory, appetite, and rumor all point toward a choice that cannot be delayed forever. A conservative [tv_academy_medical_treatment|E] may preserve life while advancing slowly; a funded intervention could move faster, but speed carries its own knife. Assistants wait beside clean cloth, heated water, and instruments no one wishes to name aloud. The patient watches us as if policy itself has entered the room."
 tv_medicine.1.a: "Conservative treatment (95%: +5% progress / 5%: patient dies)"
 tv_medicine.1.b: "Funded treatment (80%: +10% progress / 20%: patient dies)"
 tv_medicine.1.c: "Continue research — we cannot risk it yet"
 tv_medicine.2.t: "[tv_academy_medical_treatment|E]：Minor Medical Accident"
 tv_medicine.2.d: "The treatment chamber falls suddenly silent, which is how everyone knows something has gone wrong. A measurement was misread, a hand moved too late, or the patient's body answered in a language the [tv_academy_of_sciences|E] had not yet learned. No life has been lost, but confidence has. The [tv_chief_scientist|E] orders the notes rewritten from the beginning, and the [tv_academy_medical_treatment|E] loses 10% progress. The patient survives the accident; the method must now survive scrutiny."
 tv_medicine.2.a: "Regrettable, but we press on"
 tv_medicine.5.t: "[tv_academy_medical_treatment|E]：Fatal Medical Accident"
 tv_medicine.5.d: "The accident is over before anyone agrees on its cause. One moment the chamber is full of instructions, the next it is full of stillness, and the patient's name has become something everyone avoids saying first. The [tv_chief_scientist|E] can explain the risk, the method, the reaction, and the dreadful sequence of errors, but explanation is not resurrection. [tv_academy_medical_treatment|E] has claimed the life it meant to preserve. The [tv_academy_of_sciences|E] will remember this death every time it sharpens an instrument."
 tv_medicine.5.a: "A terrible loss"
 tv_medicine.3.t: "[tv_academy_medical_treatment|E]：Patient Has Recovered"
 tv_medicine.3.d: "The patient's recovery begins as rumor before it becomes certainty. Appetite returns, fever breaks, color gathers under the skin, and the sickroom stops smelling like surrender. The [tv_chief_scientist|E] does not call it a miracle, which somehow makes the court believe in it more. [tv_academy_medical_treatment|E] has transformed careful observation into a life restored. Every physician who doubted the [tv_academy_of_sciences|E] will now have to explain the patient walking through the door."
 tv_medicine.3.a: "Excellent news!"
 tv_medicine.4.t: "[tv_academy_medical_treatment|E]：Patient Died During Treatment"
 tv_medicine.4.d: "The patient weakens despite every chart, draught, prayer, and correction. By dawn the chamber has become a place of lowered eyes, and the [tv_chief_scientist|E] is left with notes that suddenly feel indecently alive. The death may not have been caused by our hand, but it happened under our care. The current [tv_academy_medical_treatment|E] can no longer continue as if the case were only a puzzle. We must reset the work and begin again, carrying one more caution into the next attempt."
 tv_medicine.4.a: "A terrible loss"
 tv_medicine.11.t: "[tv_academy_meditation|E]：Peace of Mind!"
 tv_medicine.11.d: "[SCOPE.sCharacter('tv_meditation_target').GetShortName] settles into a rare clarity, the kind that makes even old grievances sound distant. The room grows quieter without being empty, and the [tv_chief_scientist|E] knows better than to hurry the moment. A phrase, breath, or remembered shame finally finds its proper place. [tv_academy_meditation|E] advances not by force, but by allowing the mind to stop defending the wrong gate. The record marks a meaningful step forward."
 tv_medicine.11.a: "Let the quiet hold"
 tv_medicine.12.t: "[tv_academy_meditation|E]：Hard to Find Stillness!"
 tv_medicine.12.d: "[SCOPE.sCharacter('tv_meditation_target').GetShortName] cannot settle, no matter how patiently the session is arranged. Old habits return with the confidence of unwelcome guests, and confused thoughts crowd out every careful question. The [tv_chief_scientist|E] tries silence, memory, discipline, and redirection, but nothing holds for long. [tv_academy_meditation|E] loses ground because the mind knows its old roads too well. Some doors open only after being refused many times."
 tv_medicine.12.a: "Begin again"
 tv_medicine.13.t: "[tv_academy_meditation|E]：The [tv_chief_scientist|E] Guides [SCOPE.sCharacter('tv_meditation_target').GetShortName]!"
 tv_medicine.13.d: "[SCOPE.sCharacter('tv_meditation_scientist').GetShortName]'s calm words reach [SCOPE.sCharacter('tv_meditation_target').GetShortName] at precisely the moment pride begins to tire. The guidance is neither sermon nor command, but a small arrangement of truths the target can finally bear to hear. For once, the old defensive answer does not arrive first. [tv_academy_meditation|E] advances as the path becomes clearer. The room exhales."
 tv_medicine.13.a: "Excellent guidance"
 tv_medicine.14.t: "[tv_academy_meditation|E]：The [tv_chief_scientist|E] Makes Things Worse!"
 tv_medicine.14.d: "[SCOPE.sCharacter('tv_meditation_scientist').GetShortName]'s guidance lands poorly, striking pride where it meant to touch understanding. [SCOPE.sCharacter('tv_meditation_target').GetShortName] stiffens, answers too quickly, and leaves the session with the old wound better defended than before. The [tv_chief_scientist|E] records the failure without ornament. [tv_academy_meditation|E] has made things worse this time. A mind pushed at the wrong angle becomes a locked door."
 tv_medicine.14.a: "An unfortunate lesson"
 tv_medicine.15.t: "[tv_academy_meditation|E]：[SCOPE.sCharacter('tv_meditation_target').GetShortName]'s Heart Is Restless!"
 tv_medicine.15.d: "[SCOPE.sCharacter('tv_meditation_target').GetShortName] wrestles with a sudden inner turmoil that no one in the room can politely ignore. Their voice changes, memory sharpens, and an old pattern rises like a challenge. The [tv_chief_scientist|E] must decide whether to let the struggle run its course or interrupt before it deepens. This is the perilous middle of [tv_academy_meditation|E], where progress and relapse wear similar faces. The next breath may matter more than the last month of discipline."
 tv_medicine.15.a: "Let the struggle pass"
 tv_medicine.20.t: "[tv_academy_meditation|E]：Meditation Complete"
 tv_medicine.20.d: "Guided by [SCOPE.sCharacter('tv_meditation_scientist').GetShortName], [SCOPE.sCharacter('tv_meditation_target').GetShortName] finally steps away from the old error without needing to denounce it aloud. The change is visible in posture before it appears in speech. Servants notice fewer sharp commands, courtiers notice longer pauses, and the [tv_academy_of_sciences|E] notices that repetition has become choice. [tv_academy_meditation|E] has done what punishment rarely manages: it has made self-command feel possible. The record closes with unusual satisfaction."
 tv_medicine.20.a: "A clearer mind"
 tv_medicine.21.t: "[tv_academy_meditation|E]：Meditation Interrupted"
 tv_medicine.21.d: "The character undergoing [tv_academy_meditation|E] has died before the work could reach its conclusion. The notes remain behind, full of half-finished observations and questions that now have no living answer. The [tv_chief_scientist|E] closes the folder without ceremony, because ceremony would imply completion. Whatever change might have come is now beyond the [tv_academy_of_sciences|E]'s reach. The work ends because the mind it followed has gone silent."
 tv_medicine.21.a: "So it ends"
