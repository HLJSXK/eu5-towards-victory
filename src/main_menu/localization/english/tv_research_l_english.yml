 tv_research.101.a: "Mark the dead end and move on."
 tv_research.102.t: "[tv_concentrated_research|E]：A Moment to Breathe!"
 tv_research.102.d_tier1: "The doors stayed closed, but [SCOPE.sCharacter('tv_research_scientist').GetShortName] finally made the room breathe. Ledgers were sorted, failed samples were labelled honestly, and the assistants were given tasks that no longer contradicted each other. It is not a grand discovery, but [tv_concentrated_research|E] often survives by becoming orderly before it becomes brilliant. The [tv_chief_scientist|E] has turned exhaustion into a method that can last another month.\n\n#R This event appeared because your [tv_chief_scientist|E]'s [tv_effective_administrative_skill|E] is below 20.#!"
