 tv_research.104.t: "Total Failure!"
 tv_research.104.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName] has discovered that the original premise was completely wrong.\n\n#R This event appeared because your Chief Scientist's Administrative Skill is below 20.#!"
 tv_research.104.a: "Start over from the wreckage."
 tv_research.105.t: "Scientist Collapses!"
 tv_research.105.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName] has ruined their health trying to complete the concentrated research.\n\n#R This event appeared because your Chief Scientist's Administrative Skill is below 20.#!"
 tv_research.105.a: "The burden was too much."
 tv_research.106.t: "Botched!"
 tv_research.106.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName] has broken a costly scientific instrument while trying to push the research forward.\n\n#R This event appeared because your Chief Scientist's Administrative Skill is below 20.#!"
 tv_research.106.a: "Replace the instrument."
 tv_research.106.b: "Make do with what remains."
 tv_research.107.t: "Vast Material Consumption!"
 tv_research.107.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName]'s wasteful habits have consumed far more materials than expected. We must purchase replacements.\n\n#R This event appeared because your Chief Scientist's Administrative Skill is below 50.#!"
 tv_research.107.a: "Buy more materials."
 tv_research.108.t: "Wrong Direction!"
 tv_research.108.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName] has gone astray and must choose another approach.\n\n#R This event appeared because your Chief Scientist's Administrative Skill is below 50.#!"
 tv_research.108.a: "Correct the course."
 tv_research.109.t: "Absurd Claim!"
 tv_research.109.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName] has made a ridiculous public claim. Even an ordinary noble can see that it is nonsense.\n\n#R This event appeared because your Chief Scientist's Administrative Skill is below 50.#!"
 tv_research.109.a: "This is embarrassing."
 tv_research.110.t: "Clumsy Work!"
 tv_research.110.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName] is spending far too much time on a trivial task, forcing the cabinet to intervene.\n\n#R This event appeared because your Chief Scientist's Administrative Skill is below 50.#!"
 tv_research.110.a: "The cabinet must help."
 tv_research.111.t: "Help Needed!"
 tv_research.111.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName] says the work cannot be completed alone. [SCOPE.sCharacter('tv_research_cabinet').GetShortName] will have to assist.\n\n#R This event appeared because your Chief Scientist's Administrative Skill is at least 20 but below 50.#!"
 tv_research.111.a: "Assign the aide."
 tv_research.112.t: "Request for Additional Materials!"
 tv_research.112.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName] is using materials faster than expected. We must decide how to absorb the cost.\n\n#R This event appeared because your Chief Scientist's Administrative Skill is at least 20 but below 50.#!"
 tv_research.112.a: "Conserve materials and lose time."
 tv_research.112.b: "Purchase replacements."
 tv_research.113.t: "An Argument!"
 tv_research.113.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName] is quarrelling with noble colleagues. Their status protects them from retaliation, but noble satisfaction has suffered.\n\n#R This event appeared because your Chief Scientist's Administrative Skill is at least 20 but below 50.#!"
 tv_research.113.a: "Calm the nobles."
 tv_research.114.t: "A Bold Proposal!"
 tv_research.114.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName] has proposed a daring idea and asks for our support. It may advance the research, or it may embarrass us.\n\n#Y This event appeared because your Chief Scientist's Administrative Skill is at least 20 but below 80.#!"
 tv_research.114.a: "Support the attempt."
 tv_research.115.t: "Expand the Test Scale!"
 tv_research.115.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName] has proposed parallel trials and asks us to fund them.\n\n#Y This event appeared because your Chief Scientist's Administrative Skill is at least 20 but below 80.#!"
 tv_research.115.a: "Fund the larger tests."
 tv_research.115.b: "Keep the current scale."
 tv_research.116.t: "Reassign the Team!"
 tv_research.116.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName] believes the current team must be reshuffled and has selected [SCOPE.sCharacter('tv_research_cabinet').GetShortName] for the task.\n\n#Y This event appeared because your Chief Scientist's Administrative Skill is at least 20 but below 80.#!"
 tv_research.116.a: "Make the reassignment."
 tv_research.116.b: "Leave the team as it is."
 tv_research.117.t: "Mixed Blessing!"
 tv_research.117.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName] worked through the night and achieved a major advance, but the effort has badly damaged their health.\n\n#Y This event appeared because your Chief Scientist's Administrative Skill is at least 20 but below 80.#!"
 tv_research.117.a: "Progress has a price."
 tv_research.118.t: "The Power of Money!"
 tv_research.118.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName] has spent freely without permission and gained results, but the treasury must now cover the investment.\n\n#Y This event appeared because your Chief Scientist's Administrative Skill is at least 20 but below 80.#!"
 tv_research.118.a: "Pay the bill."
 tv_research.119.t: "Request for Royal Authorization!"
 tv_research.119.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName] needs powers beyond what we expected. Granting them could greatly accelerate the research.\n\n#Y This event appeared because your Chief Scientist's Administrative Skill is at least 20 but below 80.#!"
 tv_research.119.a: "Grant the authority."
 tv_research.119.b: "Refuse the request."
 tv_research.120.t: "Recognition and Learning!"
 tv_research.120.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName] has improved their skills through practice.\n\n#G This event appeared because your Chief Scientist's Administrative Skill is at least 50 but below 80.#!"
 tv_research.120.a: "They are learning."
 tv_research.121.t: "Cabinet Cooperation!"
 tv_research.121.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName]'s recent work has noticeably inspired the cabinet.\n\n#G This event appeared because your Chief Scientist's Administrative Skill is at least 50 but below 80.#!"
 tv_research.121.a: "A productive example."
 tv_research.122.t: "A Clue!"
 tv_research.122.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName] has found a clue worth pursuing, though it may lead nowhere.\n\n#G This event appeared because your Chief Scientist's Administrative Skill is at least 50 but below 80.#!"
 tv_research.122.a: "Follow the clue."
 tv_research.123.t: "Research Partner!"
 tv_research.123.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName] spent spare time discussing the project with [SCOPE.sCharacter('tv_research_cabinet').GetShortName], and both came away enlightened.\n\n#G This event appeared because your Chief Scientist's Administrative Skill is at least 50.#!"
 tv_research.123.a: "A fruitful exchange."
 tv_research.124.t: "Immediate Rebate!"
 tv_research.124.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName] publicly demonstrated a prototype. A noble purchased it for a handsome sum, which has been turned over to the state.\n\n#G This event appeared because your Chief Scientist's Administrative Skill is at least 50.#!"
 tv_research.124.a: "Useful income."
 tv_research.125.t: "Diligence!"
 tv_research.125.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName] has been highly effective lately. We can direct the next priority, or allow independent work.\n\n#G This event appeared because your Chief Scientist's Administrative Skill is at least 50.#!"
 tv_research.125.a: "Focus on the research."
 tv_research.125.b: "Let the success build prestige."
 tv_research.126.t: "Public Seminar!"
 tv_research.126.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName] has organized a public seminar. It will not immediately advance the task, but the participants are delighted.\n\n#G This event appeared because your Chief Scientist's Administrative Skill is at least 50.#!"
 tv_research.126.a: "A pleasant success."
 tv_research.127.t: "Breakthrough!"
 tv_research.127.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName] has proven worthy of a true academic master. Their latest inference has been confirmed as entirely correct.\n\n#G This event appeared because your Chief Scientist's Administrative Skill is at least 80.#!"
 tv_research.127.a: "Outstanding."
 tv_research.128.t: "Coordinated Progress!"
 tv_research.128.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName]'s latest research has directly improved our clergy-led scholarship.\n\n#G This event appeared because your Chief Scientist's Administrative Skill is at least 80.#!"
 tv_research.128.a: "Knowledge spreads."
 tv_research.129.t: "A Model Scholar!"
 tv_research.129.d: "[SCOPE.sCharacter('tv_research_scientist').GetShortName]'s latest progress has attracted many admirers, bringing glory to the royal house.\n\n#G This event appeared because your Chief Scientist's Administrative Skill is at least 80.#!"
 tv_research.129.a: "A proud moment."

