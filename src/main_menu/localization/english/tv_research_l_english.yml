 tv_research.10.d_blast_furnace: "The scholars of our Academy have identified the Blast Furnace as a promising avenue for research. If we authorize this investigation, our finest minds will dedicate themselves to this breakthrough."
 tv_research.10.d_scientific_experimentation: "The scholars of our Academy have identified Scientific Experimentation as a promising avenue for research. If we authorize this investigation, our finest minds will dedicate themselves to this breakthrough."
 tv_research.10.d_scientific_revolution: "The scholars of our Academy have identified the Scientific Revolution as a promising avenue for research. If we authorize this investigation, our finest minds will dedicate themselves to this breakthrough."
 tv_research.10.d_manufactories: "The scholars of our Academy have identified Manufactories as a promising avenue for research. If we authorize this investigation, our finest minds will dedicate themselves to this breakthrough."
 tv_research.10.d_industrialization: "The scholars of our Academy have identified Industrialization as a promising avenue for research. If we authorize this investigation, our finest minds will dedicate themselves to this breakthrough."
 tv_research.10.d_vaccination: "The scholars of our Academy have identified Vaccination as a promising avenue for research. If we authorize this investigation, our finest minds will dedicate themselves to this breakthrough."
 tv_research.10.a: "Authorize the investigation."
 tv_research.10.b: "Veto. We are not ready for this."

 # tv_research.11 — Abandon Target Confirmation
 tv_research.11.t: "Abandon the Research Programme?"
 tv_research.11.d: "Abandoning our current research target will mean losing all progress accumulated so far. The scholars will be disheartened, and we will need time before proposing a new direction."
 tv_research.11.a: "Abandon the research."
 tv_research.11.b: "Continue — I changed my mind."

 # tv_research.20 — Start Concentrated Research Confirmation
 tv_research.20.t: "Begin Concentrated Research"
 tv_research.20.d: "The prerequisites are in place. Our chief scientist stands ready to lead a focused effort. This will consume their full attention and draw on the nation's resources each month until the breakthrough is achieved."
 tv_research.20.a: "Begin the concentrated research."
 tv_research.20.b: "Not yet. I will decide later."

