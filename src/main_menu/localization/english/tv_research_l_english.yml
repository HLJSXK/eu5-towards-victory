 # tv_research.11 — Abandon Target Confirmation
 tv_research.11.t: "[tv_research_target|E]：Abandon the Research Programme?"
 tv_research.11.d: "The current [tv_research_target|E] has consumed correspondence, instruments, favors, patience, and more candle stubs than the clerks care to count. Abandoning it would not be a quiet change of direction; it would be an admission that the [tv_academy_of_sciences|E]'s present road leads nowhere useful. All accumulated progress would be lost, and the court would spend 10 Prestige explaining why yesterday's great necessity has become today's mistake. Some scholars will feel liberated, others betrayed. The decision may still be wise, but wisdom sometimes arrives wearing the face of embarrassment."
 tv_research.11.a: "Close the books and endure the whispers."
 tv_research.11.b: "No. The road remains open."

 # tv_research.19 — Concentrated Research Ready Notification
 tv_research.19.t: "[tv_concentrated_research|E]：The [tv_academy_of_sciences|E] Is Ready"
 tv_research.19.d: "The [tv_academy_of_sciences|E] has finished the slow work that makes genius less lonely. [tv_research_interest|E] has gathered enough patrons and attention, prerequisite studies have stopped complaining quite so loudly, and the [tv_literacy_foundation|E] is broad enough for the discovery to travel beyond one locked room. Assistants have recopied the tables, instruments have been checked, and the [tv_chief_scientist|E] has begun refusing dinner invitations. The final phase can now begin. [tv_concentrated_research|E] will turn preparation into pressure."
 tv_research.19.a: "Bring the lamps closer."

 # tv_research.20 — Start Concentrated Research Confirmation
 tv_research.20.t: "[tv_concentrated_research|E]：Begin Concentrated Research"
 tv_research.20.d: "The prerequisites are in place, and the [tv_chief_scientist|E] stands ready to draw the [tv_academy_of_sciences|E] into its most demanding rhythm. Doors will close, correspondence will narrow, and every assistant will learn which silence means concentration and which silence means disaster. During [tv_concentrated_research|E], random events may occur: a capable [tv_chief_scientist|E] makes favorable developments more likely, while an incompetent one invites repeated failures. The work will not forgive vanity, haste, or weak administration. The [tv_chief_scientist|E] must have at least 20 [tv_effective_administrative_skill|E] to begin or complete [tv_concentrated_research|E]. In practice, effective skill above 50 is usually needed for research to advance smoothly."
 tv_research.20.a: "Begin the closed-door labor."
 tv_research.20.random_events.tt: "Random [tv_concentrated_research|E] events may occur while this phase is active. Better [tv_effective_administrative_skill|E] unlocks better event pools; worse effective skill unlocks harsher ones."
 tv_research.20.b: "Leave the lamps unlit for now."

 # tv_research.100-129 — Concentrated Research Random Events
 tv_research.100.t: "[tv_concentrated_research|E]：Inspiration!"
 tv_research.100.d_tier1: "Amid the locked-room pressure of [tv_concentrated_research|E], [SCOPE.sCharacter('tv_research_scientist').GetShortName] has turned one troublesome contradiction into a usable idea. The assistants first thought it was another margin note, then noticed every table on the desk could be rearranged around it. The [tv_academy_of_sciences|E] has not yet solved the [tv_research_target|E], but the room has stopped sounding defeated. Even the tired clerks are copying faster, because hope is cheaper than orders and more contagious than discipline.\n\n#R This event appeared because your [tv_chief_scientist|E]'s [tv_effective_administrative_skill|E] is below 20.#!"
