 # tv_research.10 — Target Selection Proposal
 tv_research.10.t: "The Academy Proposes a Research Direction"
 tv_research.10.d_printing_press: "The [tv_academy_of_sciences|E] has turned its attention toward #bold Printing Press#!, not with certainty, but with the hunger that follows a locked door. Lecturers have begun speaking around the subject, scribes have copied suspiciously similar diagrams, and patrons now pretend they always cared about movable type. The proposal arrives with careful margins and a dangerous promise: this could become the next [tv_research_target|E]. If we authorize it, [tv_research_interest|E] will need to be cultivated until gossip becomes commitment. The [tv_chief_scientist|E] warns that breakthrough work begins as enthusiasm, then immediately demands discipline."
