l_english:
 # ── Academy IO Leader Title (character leader requires _MALE/_FEMALE variants) ──
 TV_ACADEMY_IO_LEADER_MALE:0 "President of the Academy"
 TV_ACADEMY_IO_LEADER_FEMALE:0 "President of the Academy"

 # ── IO Variable Display Formats ───────────────────────────────────────────────
 TV_C_PROGRESS_FORMAT:0 "$VALUE|0$/100"
 TV_C_PROGRESS_CHANGE_FORMAT:0 "$VALUE|2$/month"
 TV_D_PROGRESS_FORMAT:0 "$VALUE|0$/100"
 TV_D_PROGRESS_CHANGE_FORMAT:0 "$VALUE|2$/month"

 # ── IO Variable Monthly Change Descriptions ───────────────────────────────────
 TV_C_LITERACY_CONTRIBUTION:0 "Literacy Foundation (population literacy)"
 TV_D_RESEARCH_CONTRIBUTION:0 "Concentrated Research (chief scientist admin skill)"

 # ── Research Mechanism UI Buttons ─────────────────────────────────────────────
 TV_RM_REQUEST_TARGET_BTN:0 "Request Research Topic"
 TV_RM_ABANDON_TARGET_BTN:0 "Abandon Research Target"
 TV_RM_START_D_BTN:0 "Begin Concentrated Research"

 # ── Research Mechanism UI Labels ──────────────────────────────────────────────
 TV_RM_SELECTION_CD_LABEL:0 "Selection cooldown (months):"
 TV_RM_CHIEF_SCIENTIST_LABEL:0 "Chief Scientist:"

 # ── Target Advance Names ───────────────────────────────────────────────────────
 TV_RM_TARGET_PRINTING_PRESS:0 "Printing Press"
 TV_RM_TARGET_STEAM_ENGINE:0 "Steam Engine"

 # ── Generic Action Keys ───────────────────────────────────────────────────────
 tv_request_research_target:0 "Request Research Topic"
 tv_request_research_target_desc:0 "Ask the Academy to propose a research avenue. A target will be selected from currently locked frontier technologies."
 tv_abandon_research_target:0 "Abandon Research Target"
 tv_abandon_research_target_desc:0 "Abandon the current research target. All progress will be lost and a 12-month cooldown will be applied."
 tv_start_concentrated_research:0 "Begin Concentrated Research"
 tv_start_concentrated_research_desc:0 "Direct the Academy's chief scientist to undertake focused research. Requires all prerequisite stages to be complete."

 # ── Research Events ────────────────────────────────────────────────────────────

 # tv_research.1 — Monthly Interest Event
 tv_research.1.t:0 "A Spark of Curiosity"
 tv_research.1.d:0 "A member of the court has demonstrated unusual intellectual curiosity related to our Academy's current research topic. Their enthusiasm may prove valuable if nurtured."
 tv_research.1.a:0 "Encourage the inquiry."
 tv_research.1.b:0 "This is a distraction. Dismiss it."

 # tv_research.10 — Target Selection Proposal
 tv_research.10.t:0 "The Academy Proposes a Research Direction"
 tv_research.10.d_printing_press:0 "The scholars of our Academy have identified the Printing Press as a promising avenue for research. If we authorize this investigation, our finest minds will dedicate themselves to this breakthrough."
 tv_research.10.d_steam_engine:0 "The scholars of our Academy have identified the Steam Engine as a promising avenue for research. If we authorize this investigation, our finest minds will dedicate themselves to this breakthrough."
 tv_research.10.a:0 "Authorize the investigation."
 tv_research.10.b:0 "Veto. We are not ready for this."

 # tv_research.11 — Abandon Target Confirmation
 tv_research.11.t:0 "Abandon the Research Programme?"
 tv_research.11.d:0 "Abandoning our current research target will mean losing all progress accumulated so far. The scholars will be disheartened, and we will need time before proposing a new direction."
 tv_research.11.a:0 "Abandon the research."
 tv_research.11.b:0 "Continue — I changed my mind."

 # tv_research.20 — Start Concentrated Research Confirmation
 tv_research.20.t:0 "Begin Concentrated Research"
 tv_research.20.d:0 "The prerequisites are in place. Our chief scientist stands ready to lead a focused effort. This will consume their full attention and draw on the nation's resources each month until the breakthrough is achieved."
 tv_research.20.a:0 "Begin the concentrated research."
 tv_research.20.b:0 "Not yet. I will decide later."

 # tv_research.30 — Advance Unlocked Notification
 tv_research.30.t:0 "A Breakthrough Has Been Achieved!"
 tv_research.30.d_printing_press:0 "After years of dedicated effort, our Academy has succeeded. The principles of the Printing Press are now understood. This knowledge will transform our civilization."
 tv_research.30.d_steam_engine:0 "After years of dedicated effort, our Academy has succeeded. The principles of the Steam Engine are now understood. This knowledge will transform our civilization."
 tv_research.30.a:0 "A triumph for knowledge!"
