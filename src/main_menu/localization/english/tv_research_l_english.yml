 tv_medicine.1.t: "Critical Medical Finding"
 tv_medicine.1.d: "Our chief scientist has identified a critical characteristic of the patient's condition. We must decide how to proceed with the treatment."
 tv_medicine.1.a: "Conservative treatment (95%: +5% progress / 5%: patient dies)"
 tv_medicine.1.b: "Funded treatment (80%: +10% progress / 20%: patient dies)"
 tv_medicine.1.c: "Continue research — we cannot risk it yet"
 tv_medicine.2.t: "Minor Medical Accident"
 tv_medicine.2.d: "An accident has occurred during treatment. The setback has reduced our progress by 10%."
 tv_medicine.2.a: "Regrettable, but we press on"
 tv_medicine.5.t: "Fatal Medical Accident"
 tv_medicine.5.d: "A catastrophic accident has occurred during treatment. The patient did not survive."
 tv_medicine.5.a: "A terrible loss"
 tv_medicine.3.t: "Patient Has Recovered"
 tv_medicine.3.d: "Thanks to the tireless work of our chief scientist, the patient has made a full recovery from their ailment."
 tv_medicine.3.a: "Excellent news!"
 tv_medicine.4.t: "Patient Died During Treatment"
 tv_medicine.4.d: "Tragically, the patient has died during the course of treatment. We must reset our research and begin again."
 tv_medicine.4.a: "A terrible loss"
