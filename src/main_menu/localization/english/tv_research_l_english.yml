 # tv_research.11 — Abandon Target Confirmation
 tv_research.11.t: "Abandon the Research Programme?"
 tv_research.11.d: "Abandoning our current research target will mean losing all progress accumulated so far. The scholars will be disheartened, and we will need time before proposing a new direction."
 tv_research.11.a: "Abandon the research."
 tv_research.11.b: "Continue — I changed my mind."

 # tv_research.19 — Concentrated Research Ready Notification
 tv_research.19.t: "The Academy Is Ready"
 tv_research.19.d: "The Academy has completed its preparatory work. Academic interest, prerequisite studies, and the literacy foundation are all in place; concentrated research can now begin."
 tv_research.19.a: "Understood."

 # tv_research.20 — Start Concentrated Research Confirmation
 tv_research.20.t: "Begin Concentrated Research"
 tv_research.20.d: "The prerequisites are in place. Our chief scientist stands ready to lead a focused effort. Random events may occur during concentrated research: a capable Chief Scientist makes favorable developments more likely, while an incompetent one will invite repeated disasters.\n\nThe Chief Scientist must have at least 20 Administrative Skill to begin or complete concentrated research. In practice, skill above 50 is usually needed for research to advance smoothly."
 tv_research.20.a: "Begin the concentrated research."
 tv_research.20.random_events.tt: "Random concentrated-research events may occur while this phase is active. Better Administrative Skill unlocks better event pools; worse skill unlocks harsher ones."
 tv_research.20.b: "Not yet. I will decide later."

