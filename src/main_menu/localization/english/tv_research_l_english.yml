 tv_research.102.a: "Discipline is also discovery."
 tv_research.103.t: "[tv_concentrated_research|E]：Overwhelmed!"
 tv_research.103.d_tier1: "The work has begun to eat the worker. [SCOPE.sCharacter('tv_research_scientist').GetShortName] now answers ordinary questions as if they were accusations, and the assistants have learned to read the hour by the set of their shoulders. [tv_concentrated_research|E] demands attention, but attention without rest turns judgement brittle. The [tv_academy_of_sciences|E] can hear strain in every instruction, and the project has become less certain because its leader is less whole.\n\n#R This event appeared because your [tv_chief_scientist|E]'s [tv_effective_administrative_skill|E] is below 20.#!"
