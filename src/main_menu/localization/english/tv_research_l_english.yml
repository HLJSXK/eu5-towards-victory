 tv_research.20.t: "Begin Concentrated Research"
 tv_research.20.d: "The prerequisites are in place. Our chief scientist stands ready to lead a focused effort. This will consume their full attention and draw on the nation's resources each month until the breakthrough is achieved."
 tv_research.20.a: "Begin the concentrated research."
 tv_research.20.b: "Not yet. I will decide later."

