 tv_research.101.t: "[tv_concentrated_research|E]：Failure!"
 tv_research.101.d_tier1: "A line of inquiry has collapsed under its own cleverness. [SCOPE.sCharacter('tv_research_scientist').GetShortName] followed it past three corrected tables, two hopeful diagrams, and a final experiment that answered every question with no. The [tv_academy_of_sciences|E] can still learn from failure, but learning from failure is a poor substitute for finishing the [tv_research_target|E]. [tv_concentrated_research|E] loses more than time here; it loses confidence.\n\n#R This event appeared because your [tv_chief_scientist|E]'s [tv_effective_administrative_skill|E] is below 20.#!"
