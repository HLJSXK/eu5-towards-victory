 tv_engineering_department.500.d_unique_jerusalem_holy_city:0 "Walls, shrines, quarters, gates, and processions make one city carry several maps of sacred authority. The engineer proposes Jerusalem as a holy-city system, where each transfer of power had to negotiate memory before stone. The Holy City Power Transfer now completes the wonder at its fixed historical site. The transfer improves tolerance, diplomacy, and prestige."
