 tv_engineering_department.500.d_unique_longjiang_shipyard:0 "Slipways, timber basins, workshops, and treasure ships make river shipbuilding serve oceanic ambition. The engineer looks to Nanjing's Longjiang shipyard, where the Ming court prepared fleets large enough to change horizons. The Zheng He's Voyages Departure now completes the wonder at its fixed historical site. The departure improves naval range and shipbuilding speed."
 game_concept_tv_wonder_unique_jerusalem_holy_city_desc:0 "Walls, shrines, quarters, gates, and processions make one city carry several maps of sacred authority. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Holy City Power Transfer ritual sequence."
 TV_ENGINEERING_PROPOSAL_UNIQUE_JERUSALEM_HOLY_CITY_TEXT:0 "The engineer proposes Jerusalem as a holy city, where each transfer of power had to negotiate memory before stone. Brief: [tv_wonder_unique_jerusalem_holy_city|E], a unique [tv_wonder_large|E] historical wonder at its fixed historical site."
 TV_ENGINEERING_PROPOSAL_RESUME_UNIQUE_JERUSALEM_HOLY_CITY_TEXT:0 "The [tv_great_engineer|E] wants to complete the existing [tv_wonder_unique_jerusalem_holy_city|E] and reuse the preserved construction at the site."
 TV_ENGINEERING_PROPOSAL_EXPAND_UNIQUE_JERUSALEM_HOLY_CITY_TEXT:0 "The [tv_great_engineer|E] wants to expand the existing [tv_wonder_unique_jerusalem_holy_city|E] toward the site's preserved maximum level."
