 game_concept_tv_wonder_great_monastery_desc:0 "A large monastic complex of cloisters, scriptoria, refectories, walls, and pilgrim approaches. This [tv_wonder_construction|e] favors monasteries, sacred mountains, and secluded religious landscapes, joining scholarship, devotion, and refuge."
 TV_ENGINEERING_PROPOSAL_GREAT_MONASTERY_TEXT:0 "The engineer proposes a monastery great enough to preserve learning, shelter pilgrims, and give discipline an address. Brief: [tv_wonder_great_monastery|E], a [tv_wonder_medium|E] project for monastic scholarship and sacred refuge."
