 tv_wonder_unique_jerusalem_holy_city_inaugurated_desc:0 "Walls, shrines, quarters, gates, and processions make one city carry several maps of sacred authority."
 STATIC_MODIFIER_NAME_tv_wonder_unique_jerusalem_holy_city_ceremony_modifier:0 "Holy City Power Transfer"
 TV_ENGINEERING_CEREMONY_UNIQUE_JERUSALEM_HOLY_CITY_INAUGURATED_BUTTON:0 "Holy City Power Transfer"
 TV_ENGINEERING_ACTIVE_RITUAL_UNIQUE_JERUSALEM_HOLY_CITY_1:0 "Confirm the Holy City Power Transfer ceremony for the Holy City of Jerusalem. The transfer improves tolerance, diplomacy, and prestige.."
 tv_engineering_department.500.d_unique_jerusalem_holy_city:0 "Walls, shrines, quarters, gates, and processions make one city carry several maps of sacred authority. The engineer proposes Jerusalem as a holy city, where each transfer of power had to negotiate memory before stone. The Holy City Power Transfer now completes the wonder at its fixed historical site. The transfer improves tolerance, diplomacy, and prestige."
 game_concept_tv_wonder_sacred_mountain_desc:0 "A mountain sanctuary of terraces, stairways, shrines, and solemn halls, raised where earth seems nearest to the heavens. Pilgrims climb through incense and stone while the court's authority gathers a sacred weight, making faith feel less like command than landscape."
 game_concept_tv_wonder_triumphal_axis_desc:0 "A ceremonial city plan of straight avenues, grand squares, victory gates, parade grounds, and palace fronts. It turns movement itself into theatre: emissaries, soldiers, and citizens pass through ordered stone and learn who stands at the center."
 game_concept_tv_wonder_great_port_desc:0 "A colossal harbor of breakwaters, quays, warehouses, arsenals, and market halls, built to make the sea enter the realm on royal terms. Masts gather beneath its towers, coin follows the tide, and distant courts learn the city by its waterfront."
 game_concept_tv_wonder_giant_necropolis_desc:0 "A vast royal burial landscape of tomb terraces, processional roads, mortuary chapels, and guarded gardens. It grows strongest among hills and near settled places, turning dynastic memory into stone, ritual, and public order."
 game_concept_tv_wonder_great_lighthouse_desc:0 "A monumental beacon raised above a harbor mouth, binding trade routes and naval reach to a single flame. Better harbor capacity makes the site stronger, while its ceremonies shape whether the lighthouse serves fleet, merchants, or maritime watch."
 game_concept_tv_wonder_hydraulic_workshop_desc:0 "A district of canals, wheels, reservoirs, workshops, and measured sluices. It benefits from already built local infrastructure, then turns water control into production, construction capacity, and civic authority."
 game_concept_tv_wonder_mining_city_desc:0 "A planned extraction city of shafts, ore yards, drainage works, markets, and minting houses. High development and rural mineral frontiers suit it best, and its ceremonies decide how the mine, crown, and common workers share the underground wealth."
 game_concept_tv_wonder_giant_observatory_desc:0 "A monumental observatory of towers, sighting galleries, catalog rooms, and instrument courts. Hills, plateaus, mountains, and literate local populations suit it best, and its ceremonies turn sky-watching toward scholarship, navigation, or omens."
 game_concept_tv_wonder_palace_of_nations_desc:0 "A diplomatic palace raised in the capital to make hierarchy, audiences, and foreign presence permanent. Developed metropolitan ground suits it best, and its ceremonies can turn the palace toward congress, tribute, or standing embassy districts."
 game_concept_tv_wonder_university_city_desc:0 "A scholarly city of lecture halls, colleges, libraries, and student quarters. Urban sites and literate populations suit it best, and its ceremonies can turn the university toward research, public literacy, or promotion through collegiate institutions."
 game_concept_tv_wonder_sky_dome_grand_temple_desc:0 "A monumental temple gathered under a vast ceremonial dome. Orthodox populations and sacred infrastructure suit it best, and its ceremonies can emphasize consecration, pilgrimage revenue, or clerical government."
 game_concept_tv_wonder_giant_tower_temple_desc:0 "A towering temple of stairs, beacon chambers, shrines, and schools. Its ceremonies can turn height toward prestige, disciplined pilgrimage, or organized conversion."
 game_concept_tv_wonder_river_extension_desc:0 "A riverworks wonder of widened channels, bridges, embankments, fairs, and offices. It requires a river site and can turn movement, trade, and canal administration into permanent state capacity."
 game_concept_tv_wonder_national_shipyard_desc:0 "A coastal shipbuilding complex of slips, cranes, storehouses, and naval offices. Harbor capacity and development suit it best, and its ceremonies can emphasize shipbuilding speed, fleet morale, or naval range."
 game_concept_tv_wonder_star_fortress_city_desc:0 "A planned fortified city of angular bastions, drill grounds, magazines, and arsenals. Urban defensive sites suit it best, and its ceremonies strengthen garrisons, siege skill, or fort capacity."
 game_concept_tv_wonder_great_wall_desc:0 "A frontier wall of towers, gates, signal posts, and mustering grounds. Non-urban defensive sites suit it best, and its ceremonies can emphasize manpower, movement, or morale."
 game_concept_tv_wonder_giant_armory_desc:0 "A great military storehouse and production district for weapons, foundries, and master armourers. Developed towns and cities suit it best, and its ceremonies shape morale, production, or discipline."
 game_concept_tv_wonder_library_of_nation_desc:0 "A capital library of catalogs, copyist houses, reading rooms, and legal deposit offices. Its ceremonies can accelerate research, literacy, or social promotion through preserved knowledge."
 tv_engineering_department.500.d_sacred_1:0 "Blood seals the Golden Sanctuary. The [tv_wonder_ceremony|E] has ended in a silence heavier than any hymn, and every witness understands that the monument's gold does not merely decorate power; it remembers the price of power. The realm's crown authority now shines through a sacred work built to awe the doubtful and reassure the loyal. Priests speak of consecration, courtiers of majesty, and engineers quietly of completion. The [tv_engineering_department|e] has built a place where obedience can look upward."
 tv_engineering_department.500.d_sacred_2:0 "A year of austerity completes the Ascetic Mountain. Its silence has outlasted impatience, gossip, and the thousand small noises by which courts defend themselves from thought. The [tv_wonder_ceremony|E] leaves behind not spectacle, but discipline made visible. Scholars and priests alike find that the monument invites inquiry without surrendering reverence. The mountain now teaches by withholding, and the realm is expected to learn."
 tv_engineering_department.500.d_sacred_3:0 "The cabinet kneels into its new sacred order. The Theocratic Center stands complete, and the [tv_wonder_ceremony|e] has transformed administration into devotion before the eyes of the realm. Clerical authority now has a monumental address, one difficult to ignore and harder to mock. The [tv_engineering_department|e] has given doctrine walls, doors, and a place in the daily machinery of rule. From this day, policy will speak with incense in its sleeves."
 tv_engineering_department.500.d_axis_1:0 "Foreign emissaries have crossed the Sun King Axis and seen the realm's glory arranged in stone. They walked where they were meant to walk, looked where they were meant to look, and understood that the path itself was an argument. The [tv_wonder_ceremony|E] has made witnesses into carriers of our spectacle. Some will praise it, some will envy it, and some will pretend not to have been moved. All of them will remember the axis."
 tv_engineering_department.500.d_axis_2:0 "Victory has given the Military City its triumph. The [tv_wonder_ceremony|E] no longer rests on rehearsal, banners, or promises; it carries the weight of actual war. Soldiers march through streets that now belong to public memory as much as traffic. The monument speaks in drums, ordered ranks, and the relief of survival made ceremonial. From this day, its stones will hear every future boast of arms."
 tv_engineering_department.500.d_axis_3:0 "The Civic Capital has completed its festival of rational order. Its squares have trained feet, eyes, and habits until obedience could pass for public celebration. The [tv_wonder_ceremony|E] disperses, but the routes remain, and routes are a quiet form of instruction. Long after the crowds leave, the city will continue teaching citizens where to stand, how to move, and what order feels like. The monument's lesson is now built into daily life."
 tv_engineering_department.500.d_port_1:0 "The Golden Trade Port has been bought into legend, auction by auction, until wealth itself seemed to inaugurate the harbor. The [tv_wonder_ceremony|E] glittered with bids, polished metal, and merchants pretending that calculation was reverence. Every coin spent became a public oath that commerce could honor the state while enriching itself. The harbor now smells of salt, gold, and ambition. Ships will arrive to trade, but they will also arrive to be impressed."
 tv_engineering_department.500.d_port_2:0 "Heavy ships have passed the Imperial Naval Port in review. Their hulls moved like arguments of timber and cannon, each one announcing that the sea must now notice our architecture. The [tv_wonder_ceremony|E] has taught the monument to speak naval authority before the first foreign captain asks its meaning. Sailors cheer, officers count, and dockside children learn which silhouettes deserve awe. The sea has been given a gate with banners."
 tv_engineering_department.500.d_port_3:0 "The Free Trade Metropolis has completed its festival of open exchange. Foreign tongues, contracts, and privileges now anchor the harbor's reputation more securely than stone alone could have done. The [tv_wonder_ceremony|E] turned bargaining into theater and theater into policy. Merchants leave with lighter purses or heavier ones, but all leave knowing the port's name. The harbor now belongs to movement, and movement has learned our seal."
 tv_engineering_department.500.d_necropolis_1:0 "A ruler's death has filled the Giant Necropolis with dynasty. Processions sink into the tomb roads, carrying grief, legitimacy, and the careful choreography by which succession survives the body. The [tv_wonder_ceremony|E] makes the dead useful without making them seem used. The living house draws authority from ordered silence below. Stone, lineage, and mourning have entered the same compact."
 tv_engineering_department.500.d_necropolis_2:0 "The ancestor rites end with names, offerings, and quiet smoke fixed into the shrine. The [tv_wonder_ceremony|E] has given memory a schedule, a path, and a sanctioned place to gather. The realm has built not only tombs, but an argument that the past still supervises the present. Children will learn names here before they understand politics. That is why the place will matter."
 tv_engineering_department.500.d_necropolis_3:0 "The quiet land has been set apart forever. Paths grow hushed, migrants turn away, and the necropolis becomes a boundary between ambition and silence. The [tv_wonder_ceremony|E] asks the realm to honor absence as deliberately as it honors conquest. No marketplace will easily swallow this ground now. The land has been given to memory, and memory is an exacting owner."
 tv_engineering_department.500.d_lighthouse_1:0 "The eternal flame catches above the sea. Its hungry light will demand timber, tending, and the endless discipline of keeping a promise visible after midnight. The [tv_wonder_ceremony|E] turns fire into public duty and sailors into distant witnesses. Ships already treat the beacon as a second star, one made by hands rather than heaven. The coast has acquired an eye that refuses to close."
 tv_engineering_department.500.d_lighthouse_2:0 "The Navigator Guild opens beneath the tower, turning seamarks, ledgers, and pilot lore into civic power. The [tv_wonder_ceremony|E] binds the lighthouse to trained voices, not merely flame and stone. Pilots who once carried knowledge in memory now carry it into an institution with doors, rules, and expectations. The beacon warns ships; the guild teaches the realm how to read the warning. Together they make distance more obedient."
 tv_engineering_department.500.d_lighthouse_3:0 "The long watch has claimed the neighboring waters. Signals cross from tower to sea and back again until absence itself becomes a thing the realm can patrol. The [tv_wonder_ceremony|E] has turned vigilance into a civic habit rather than an occasional alarm. Sailors now look toward the lighthouse not only for safety, but for permission to believe the coast is awake. Night has lost some of its privacy."
 tv_engineering_department.500.d_hydraulic_1:0 "The water festival closes with channels singing under restored labor. The [tv_wonder_ceremony|E] has made water look disciplined, which may be the boldest engineering claim of all. Workshops resume, but they do so beneath a new sacred order of flow, sluice, and blessing. The complex now carries civic peace through moving water. Every wheel and channel will remember the rites that taught them to seem obedient."
 tv_engineering_department.500.d_hydraulic_2:0 "The Hydraulic Artisan Guild is recognized, and the waterworks answer to its trained hands. The [tv_wonder_ceremony|E] completes a bargain between privilege, machinery, and local control. Artisans gain standing not by speech, but by proving that the city depends on their measured competence. The [tv_engineering_department|e] has built the body; the guild will keep the body articulate. Water now has a professional class."
 tv_engineering_department.500.d_hydraulic_3:0 "Prosperity turns the waterwheel without ceremony, though the final recognition gives that quiet motion public meaning. The [tv_wonder_ceremony|E] feels almost modest here, because the site itself has already argued for usefulness. The workshop's rhythm becomes the local measure of construction, repair, and ambition. People will judge future work by how steadily it turns. In this branch, miracle sounds like machinery."
 tv_engineering_department.500.d_mining_1:0 "The miners' oath echoes through galleries and squares. Rights are sworn into the stone, and the city accepts a harder bargain for deeper wealth. The [tv_wonder_ceremony|E] gives labor a voice while reminding every listener that voice and burden can share the same contract. The galleries below answer with silence, but silence is not refusal. The city has pledged itself downward."
 tv_engineering_department.500.d_mining_2:0 "The royal mint opens where ore already shines. Metal leaves the earth, passes through authority, and returns to the realm as coin bearing public trust. The [tv_wonder_ceremony|E] makes extraction, sovereignty, and value stand in the same room. Miners see stone become money; officials see money become order. The city now speaks with the ring of struck metal."
 tv_engineering_department.500.d_mining_3:0 "The deep drainage works finally breathe. Water falls away from the lower shafts, pumps settle into their harsh rhythm, and the mining city learns to reach below its old fear. The [tv_wonder_ceremony|E] here is not gentle, but it is honest: depth must be purchased with labor, risk, and patience. Engineers listen to the first dry passages as if hearing a verdict. The darkness has not vanished, but it has retreated."
 tv_engineering_department.500.d_observatory_1:0 "The star catalog is complete. The Giant Astronomical Observatory now turns scattered night into ordered record, line by line, table by table, until future scholars inherit not awe alone but a method. The [tv_wonder_ceremony|E] ends with ink as much as stone. Students will climb these towers to learn that the sky can be admired and corrected in the same breath. The realm has built a place where wonder submits to patient notation."
 tv_engineering_department.500.d_observatory_2:0 "The nautical almanac is confirmed, and the observatory's tables are given to pilots, navigators, and ambitious captains. The [tv_wonder_ceremony|E] binds starlight to coastlines and turns learned calculation into movement across water. Sailors will still curse storms, currents, and bad decisions, but they will do so with better numbers in hand. The sky has become a tool without ceasing to be mysterious."
 tv_engineering_department.500.d_observatory_3:0 "The eclipse has vindicated the observatory. Fear arrived on schedule and found the court waiting with an explanation. The [tv_wonder_ceremony|E] leaves no ordinary modifier behind, only a public memory sharper than stone: the day the realm predicted darkness and did not tremble. Prestige follows because people remember courage most clearly when it stands under a darkened sun."
 tv_engineering_department.500.d_palace_1:0 "Foreign courts have passed through the Congress Palace and found every step arranged as diplomacy made stone. The [tv_wonder_ceremony|E] turns audiences into an institution, ranks into rooms, and negotiation into a civic spectacle. Envoys leave knowing that even disagreement must now enter through our doors. The Palace of Nations has made central authority courteous, visible, and difficult to avoid."
 tv_engineering_department.500.d_palace_2:0 "The tribute gallery is complete. Subject offerings stand in ordered display, each one polished into a lesson on hierarchy before foreign and domestic eyes alike. The [tv_wonder_ceremony|E] makes contribution look ceremonial rather than coerced, which is often the most useful disguise power can wear. Every future subject envoy will see the gallery and understand that payment can become architecture."
 tv_engineering_department.500.d_palace_3:0 "The embassy quarter opens beside the Palace of Nations. Foreign courts now possess permanent thresholds within the capital, which means diplomacy will wake, eat, complain, flatter, and bargain inside our daily weather. The [tv_wonder_ceremony|E] does not end with departure; it ends by making departure less necessary. The realm has given foreign attention an address and placed that address under its own walls."
 tv_engineering_department.600.d_sacred:0 "News arrives from [SCOPE.sCountry('tv_wonder_builder_country').GetName]: a [tv_wonder_sacred_mountain|E] now rises at [SCOPE.sLocation('tv_wonder_completed_site').GetName]. Pilgrims, envoys, and skeptical accountants all speak of terraces, sanctuaries, and stone made obedient to faith. Whether admired as piety or judged as ambition, the work has given devotion a shape large enough for distant courts to discuss."
 tv_engineering_department.600.d_axis:0 "Reports from [SCOPE.sCountry('tv_wonder_builder_country').GetName] describe a [tv_wonder_triumphal_axis|E] completed at [SCOPE.sLocation('tv_wonder_completed_site').GetName]. Roads, squares, processions, and stone have been arranged into a public grammar of authority. Foreign observers may debate its taste, but none can miss the message: power there has learned to move in straight lines."
 tv_engineering_department.600.d_port:0 "Ships carry word that [SCOPE.sCountry('tv_wonder_builder_country').GetName] has completed a [tv_wonder_great_port|E] at [SCOPE.sLocation('tv_wonder_completed_site').GetName]. Sailors now trade rumors of quays, warehouses, ceremonies, and wealth disciplined into architecture. Merchants will measure it in profit, admirals in reach, and rivals in the uncomfortable knowledge that harbors can become monuments."
 tv_engineering_department.600.d_necropolis:0 "Couriers report that [SCOPE.sCountry('tv_wonder_builder_country').GetName] has finished a [tv_wonder_giant_necropolis|E] at [SCOPE.sLocation('tv_wonder_completed_site').GetName]. Tomb roads and memorial halls now bind rule, lineage, and memory into one immense landscape. The dead do not speak, yet every court understands the language of ancestors when it has been carved deeply enough."
 tv_engineering_department.600.d_lighthouse:0 "Mariners bring news from [SCOPE.sCountry('tv_wonder_builder_country').GetName]: a [tv_wonder_great_lighthouse|E] has been inaugurated at [SCOPE.sLocation('tv_wonder_completed_site').GetName]. Its signal is already entering sailors' stories as a second star made by policy, labor, and stubborn fire. Some will call it a guide, others a warning, but every coastline has reason to notice."
 tv_engineering_department.600.d_hydraulic:0 "Word spreads that [SCOPE.sCountry('tv_wonder_builder_country').GetName] has completed a [tv_wonder_hydraulic_workshop|E] at [SCOPE.sLocation('tv_wonder_completed_site').GetName]. Channels, wheels, sluices, and workshops now make water perform civic order in public. It is a quieter spectacle than gold or armies, but rulers know to respect any state that can make rivers answer schedules."
 tv_engineering_department.600.d_mining:0 "Travelers from [SCOPE.sCountry('tv_wonder_builder_country').GetName] speak of a [tv_wonder_mining_city|E] completed at [SCOPE.sLocation('tv_wonder_completed_site').GetName]. Shaft, furnace, mint, oath, and market have been drawn into one industrial civic body. The earth has been opened with ceremony, and the world will watch what wealth is pulled from the dark."
 tv_engineering_department.600.d_observatory:0 "Scholars and sailors carry the news: [SCOPE.sCountry('tv_wonder_builder_country').GetName] has completed a [tv_wonder_giant_observatory|E] at [SCOPE.sLocation('tv_wonder_completed_site').GetName]. Towers and tables now promise that the heavens can be watched with state patience. Awe remains, but it has acquired instruments, records, and a court willing to fund both."
 tv_engineering_department.600.d_palace:0 "Envoys report that [SCOPE.sCountry('tv_wonder_builder_country').GetName] has inaugurated a [tv_wonder_palace_of_nations|E] at [SCOPE.sLocation('tv_wonder_completed_site').GetName]. Audience halls, galleries, and embassy thresholds have turned diplomacy into architecture. Foreign business will still be anxious and sharp, but it now has a stage built to make the host unavoidable."
 tv_engineering_department.500.d_university_1:0 "The scholars' convocation closes with lectures, statutes, and careful applause. The University City now possesses more than halls; it has a method for turning restless minds into public strength. The [tv_wonder_ceremony|E] leaves behind a realm that will argue more sharply, read more ambitiously, and expect rulers to fund both. The city has become a machine for disciplined curiosity."
 tv_engineering_department.500.d_university_2:0 "The public lectures have filled the University City with listeners. Artisans, clerks, officials, and students crowd into disputations that once would have stayed behind narrow doors. The [tv_wonder_ceremony|E] turns literacy from a private advantage into a civic habit. The city now teaches aloud, and the realm will learn to expect the sound."
 tv_engineering_department.500.d_university_3:0 "The Collegiate Hall opens under charter. Masters gain a durable house, students gain rules to test and resent, and the crown gains a university city whose learning can outlive any single patron. The [tv_wonder_ceremony|E] has turned scholarship into institution. From now on, promotion will travel through books as well as birth."
 tv_engineering_department.500.d_sky_dome_1:0 "The veil is drawn from the consecrated dome. Light descends in ordered shafts, choirs rise into the curve above, and even skeptics find themselves speaking more softly. The [tv_wonder_ceremony|E] has made orthodoxy visible without needing to shout. The temple now shelters belief under a sky shaped by hands."
 tv_engineering_department.500.d_sky_dome_2:0 "The pilgrim treasury is endowed. Coin, vows, and long journeys gather beneath the Sky Dome Grand Temple until piety learns a fiscal discipline of its own. The [tv_wonder_ceremony|E] has taught pilgrims to leave behind more than footprints. The temple will count offerings, but the realm will count the revenue."
 tv_engineering_department.500.d_sky_dome_3:0 "The Celestial Synod completes its transformation of counsel into clergy. The cabinet now speaks under the temple's shadow, its offices carrying doctrine as well as policy. The [tv_wonder_ceremony|E] gives the Sky Dome Grand Temple an administrative soul. Sacred authority has acquired chairs, seals, and a daily schedule."
 tv_engineering_department.500.d_tower_temple_1:0 "The beacon rite blazes from the tower. Light climbs faster than pilgrims ever could, carrying prestige across rooftops, roads, and distant stories. The [tv_wonder_ceremony|E] has made height into announcement. The Giant Tower Temple now stands not only above the realm, but before its imagination."
 tv_engineering_department.500.d_tower_temple_2:0 "A year of pilgrim steps completes the tower temple. Knees ache, songs fray, and the stair has learned the weight of devotion repeated until it becomes tradition. The [tv_wonder_ceremony|E] leaves behind a monument that teaches ascent by making it bodily. Faith now has a route in stone."
 tv_engineering_department.500.d_tower_temple_3:0 "The temple school opens beneath the tower. Lessons, prayers, and copybooks bind conversion to daily discipline rather than spectacle alone. The [tv_wonder_ceremony|E] gives the Giant Tower Temple a voice that can teach after the bells stop ringing. The tower points upward; the school carries the lesson outward."
 tv_engineering_department.500.d_river_1:0 "The bridge opening binds the widened river to neighboring land. Processions cross where plans once stopped, and the [tv_wonder_ceremony|E] makes movement itself feel newly possible. The riverworks no longer divide the map; they teach it to cooperate. Roads, banks, and officials will now move with a little more confidence."
 tv_engineering_department.500.d_river_2:0 "The river fair closes after a year of barges, booths, tolls, and controlled inconvenience. Trade returns leaner and more ambitious, having learned the river's new shape in public. The [tv_wonder_ceremony|E] has made commerce rehearse the channel that will carry it. The river now belongs to traffic and spectacle together."
 tv_engineering_department.500.d_river_3:0 "The canal office opens beside the riverworks. Complaints, schedules, dredging orders, and toll disputes now have a permanent address, which is one of civilization's quieter miracles. The [tv_wonder_ceremony|E] turns water control into administration. The river has gained not only width, but memory."
 tv_engineering_department.500.d_shipyard_1:0 "The keel-laying ceremony has purchased the shipyard into national purpose. Each payment became timber, each timber a promise of hulls yet to meet the sea. The [tv_wonder_ceremony|E] teaches the yard that naval power begins before launch day. The National Shipyard now measures ambition in ribs, slips, and contracts."
 tv_engineering_department.500.d_shipyard_2:0 "The fleet muster fills the National Shipyard with heavy hulls and harder expectations. Officers count guns, sailors count omens, and crowds count silhouettes against the water. The [tv_wonder_ceremony|E] gives the yard the proof it demanded: ships enough for ceremony to sound like policy. The sea has been shown the state's workshop."
 tv_engineering_department.500.d_shipyard_3:0 "The admiralty office opens over charts, seals, and the sharp smell of new timber. The [tv_wonder_ceremony|E] has made the shipyard answer not only to carpenters and captains, but to permanent naval administration. Orders now have a shore from which to sail. The yard can build fleets and remember why."
 tv_engineering_department.500.d_star_fortress_1:0 "The bastion trials end with angles proven and doubts exhausted. The Star Fortress City now stands as a geometry lesson no enemy asked to attend. The [tv_wonder_ceremony|E] has made defense experimental, public, and difficult to dismiss. Every wall now carries the confidence of a test survived."
 tv_engineering_department.500.d_star_fortress_2:0 "The siege games close in dust, cheers, and professional embarrassment for anyone who underestimated the drills. The [tv_wonder_ceremony|E] gives the fortress city a habit of assault and answer before real war demands it. Soldiers leave with bruises and better methods. The city has practiced danger until danger looks more legible."
 tv_engineering_department.500.d_star_fortress_3:0 "The arsenal quarter opens inside the Star Fortress City. Powder, tools, repair crews, and stores now sit where defense can reach them without improvisation. The [tv_wonder_ceremony|E] turns fortification into a system rather than a wall. The city is ready not only to resist, but to continue resisting."
 tv_engineering_department.500.d_great_wall_1:0 "The frontier muster completes the Great Wall's first public compact with the soldiers and settlers who will live under its shadow. Each muster made the boundary less abstract and the realm more present. The [tv_wonder_ceremony|E] leaves behind a line that is also a gathering. Defense now has a crowd."
 tv_engineering_department.500.d_great_wall_2:0 "A year of signal fires has taught the wall to speak. Smoke by day, flame by night, and anxious messengers in between have made distance less private. The [tv_wonder_ceremony|E] gives the frontier a nervous system. The wall will not stop every threat, but fewer threats will arrive unnamed."
 tv_engineering_department.500.d_great_wall_3:0 "The wall oath is sworn along the frontier. Soldiers, officials, and local leaders bind themselves to a line too long for any one person to hold alone. The [tv_wonder_ceremony|E] turns stone into obligation. The Great Wall now stands in the realm's conscience as much as on its border."
 tv_engineering_department.500.d_armory_1:0 "The muster of arms fills the Giant Armory with the sound of readiness. Weapons leave racks, hands learn weight, and officers see how much force can be assembled when storage becomes ceremony. The [tv_wonder_ceremony|E] gives the armory a public proof. The realm now knows where its steel gathers."
 tv_engineering_department.500.d_armory_2:0 "The foundry contracts are complete. Furnaces, merchants, and military clerks have agreed to a rhythm that turns ore, coin, and urgency into supply. The [tv_wonder_ceremony|E] makes production a matter of state ceremony, not merely workshop habit. The armory will be fed by promises hammered into ledgers."
 tv_engineering_department.500.d_armory_3:0 "The Master Armourers' Hall opens inside the Giant Armory. Skilled hands now have rank, address, and expectations heavy enough to match their craft. The [tv_wonder_ceremony|E] teaches the army to respect the makers behind its confidence. Discipline begins before the battlefield, at the bench where failure is found early."
 tv_engineering_department.500.d_library_1:0 "The national catalog closes its first great labor. Shelves, indexes, and tired scholars now make the Library of Nation searchable in ways memory alone could never manage. The [tv_wonder_ceremony|E] gives knowledge a map. Future research will move faster because someone made patience permanent."
 tv_engineering_department.500.d_library_2:0 "The copyists' endowment is sealed. Pens, wages, desks, and paper now carry the library's ambition into repeated hands. The [tv_wonder_ceremony|E] makes literacy less dependent on fragile originals and generous accidents. Copies will travel where singular treasures could not. The realm's learning has learned to multiply."
 tv_engineering_department.500.d_library_3:0 "The legal deposit office opens beside the Library of Nation. Texts will arrive here by obligation, not luck, and the state will remember more because forgetting has become harder to justify. The [tv_wonder_ceremony|E] turns preservation into law. The library now has a claim on the realm's written life."
 tv_engineering_department.600.d_university:0 "News spreads from [SCOPE.sCountry('tv_wonder_builder_country').GetName]: a [tv_wonder_university_city|E] now stands at [SCOPE.sLocation('tv_wonder_completed_site').GetName]. Halls, lectures, colleges, and arguments have been arranged into a civic machine for learning. Foreign scholars will debate its methods, but every court understands that knowledge has gained an address."
 tv_engineering_department.600.d_sky_dome:0 "Pilgrims report that [SCOPE.sCountry('tv_wonder_builder_country').GetName] has completed a [tv_wonder_sky_dome_grand_temple|E] at [SCOPE.sLocation('tv_wonder_completed_site').GetName]. Dome, treasury, synod, and sanctuary now make devotion visible on a scale large enough for rivals to notice. Faith there has acquired height, order, and revenue."
 tv_engineering_department.600.d_tower_temple:0 "Word rises from [SCOPE.sCountry('tv_wonder_builder_country').GetName]: a [tv_wonder_giant_tower_temple|E] has been inaugurated at [SCOPE.sLocation('tv_wonder_completed_site').GetName]. Its stair, beacon, and school turn height into ritual and instruction. The temple will be seen from afar, and talked about from farther still."
 tv_engineering_department.600.d_river:0 "Merchants carry news that [SCOPE.sCountry('tv_wonder_builder_country').GetName] has completed a [tv_wonder_river_extension|E] at [SCOPE.sLocation('tv_wonder_completed_site').GetName]. Bridges, fairs, offices, and channels now make the river serve policy as well as current. The water has been widened into an argument about movement."
 tv_engineering_department.600.d_shipyard:0 "Sailors say [SCOPE.sCountry('tv_wonder_builder_country').GetName] has inaugurated a [tv_wonder_national_shipyard|E] at [SCOPE.sLocation('tv_wonder_completed_site').GetName]. Keels, musters, and admiralty offices now bind shipbuilding to state ambition. Every harbor with rivals will understand the meaning of such a yard."
 tv_engineering_department.600.d_star_fortress:0 "Reports from [SCOPE.sCountry('tv_wonder_builder_country').GetName] describe a [tv_wonder_star_fortress_city|E] completed at [SCOPE.sLocation('tv_wonder_completed_site').GetName]. Bastions, drills, arsenals, and streets have been drawn into one defensive machine. The city has made geometry political."
 tv_engineering_department.600.d_great_wall:0 "Frontier travelers bring word that [SCOPE.sCountry('tv_wonder_builder_country').GetName] has completed a [tv_wonder_great_wall|E] at [SCOPE.sLocation('tv_wonder_completed_site').GetName]. Musters, signal fires, oaths, and stone now stretch authority across a difficult border. The wall is too long to ignore and too deliberate to call accidental."
 tv_engineering_department.600.d_armory:0 "Military envoys report that [SCOPE.sCountry('tv_wonder_builder_country').GetName] has inaugurated a [tv_wonder_giant_armory|E] at [SCOPE.sLocation('tv_wonder_completed_site').GetName]. Musters, foundries, and master armourers now make readiness visible in one immense store of force. Steel has gained an institution."
 tv_engineering_department.600.d_library:0 "Scholars carry news that [SCOPE.sCountry('tv_wonder_builder_country').GetName] has completed a [tv_wonder_library_of_nation|E] at [SCOPE.sLocation('tv_wonder_completed_site').GetName]. Catalogs, copyists, and legal deposit now bind the realm's written memory into public architecture. Knowledge there has become harder to lose."
 game_concept_tv_wonder_megalithic_circle_desc:0 "A prehistoric circle of standing stones aligned with seasons, burial memory, and sacred gatherings. This [tv_wonder_construction|e] favors rural or ancient-feeling sites and can become a calendar shrine, an astronomical alignment, or an ancestral assembly ground."
 TV_ENGINEERING_PROPOSAL_MEGALITHIC_CIRCLE_TEXT:0 "The engineer proposes a ring of ancient stones where sky, memory, and rule can meet. Brief: [tv_wonder_megalithic_circle|E], a [tv_wonder_small|E] project for ancestral ritual and calendar authority."
