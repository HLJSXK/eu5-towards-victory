 game_concept_tv_wonder_display_image_1:0 "Sacred Mountain"
 game_concept_tv_wonder_display_image_1_desc:0 "A mountain sanctuary of terraces, stairways, shrines, and solemn halls, raised where earth seems nearest to the heavens. Pilgrims climb through incense and stone while the court's authority gathers a sacred weight, making faith feel less like command than landscape."
 game_concept_tv_wonder_display_image_2:0 "Triumphal Axis"
 game_concept_tv_wonder_display_image_2_desc:0 "A ceremonial city plan of straight avenues, grand squares, victory gates, parade grounds, and palace fronts. It turns movement itself into theatre: emissaries, soldiers, and citizens pass through ordered stone and learn who stands at the center."
 game_concept_tv_wonder_display_image_3:0 "Great Port"
 game_concept_tv_wonder_display_image_3_desc:0 "A colossal harbor of breakwaters, quays, warehouses, arsenals, and market halls, built to make the sea enter the realm on royal terms. Masts gather beneath its towers, coin follows the tide, and distant courts learn the city by its waterfront."
 game_concept_tv_wonder_display_image_4:0 "Giant Necropolis Complex"
 game_concept_tv_wonder_display_image_4_desc:0 "A vast royal burial landscape of tomb terraces, processional roads, mortuary chapels, and guarded gardens. It grows strongest among hills and near settled places, turning dynastic memory into stone, ritual, and public order."
 game_concept_tv_wonder_display_image_5:0 "Great Lighthouse"
 game_concept_tv_wonder_display_image_5_desc:0 "A monumental beacon raised above a harbor mouth, binding trade routes and naval reach to a single flame. Better harbor capacity makes the site stronger, while its ceremonies shape whether the lighthouse serves fleet, merchants, or maritime watch."
 game_concept_tv_wonder_display_image_6:0 "Hydraulic Workshop Complex"
 game_concept_tv_wonder_display_image_6_desc:0 "A district of canals, wheels, reservoirs, workshops, and measured sluices. It benefits from already built local infrastructure, then turns water control into production, construction capacity, and civic authority."
 game_concept_tv_wonder_display_image_7:0 "Mining City"
 game_concept_tv_wonder_display_image_7_desc:0 "A planned extraction city of shafts, ore yards, drainage works, markets, and minting houses. High development and rural mineral frontiers suit it best, and its ceremonies decide how the mine, crown, and common workers share the underground wealth."
 game_concept_tv_wonder_display_image_8:0 "Giant Observatory"
 game_concept_tv_wonder_display_image_8_desc:0 "A monumental observatory of towers, sighting galleries, catalog rooms, and instrument courts. Hills, plateaus, mountains, and literate local populations suit it best, and its ceremonies turn sky-watching toward scholarship, navigation, or omens."
 game_concept_tv_wonder_display_image_9:0 "Palace of Nations"
 game_concept_tv_wonder_display_image_9_desc:0 "A diplomatic palace raised in the capital to make hierarchy, audiences, and foreign presence permanent. Developed metropolitan ground suits it best, and its ceremonies can turn the palace toward congress, tribute, or standing embassy districts."
 game_concept_tv_wonder_display_image_10:0 "University City"
 game_concept_tv_wonder_display_image_10_desc:0 "A scholarly city of lecture halls, colleges, libraries, and student quarters. Urban sites and literate populations suit it best, and its ceremonies can turn the university toward research, public literacy, or promotion through collegiate institutions."
 game_concept_tv_wonder_display_image_11:0 "Sky Dome Grand Temple"
 game_concept_tv_wonder_display_image_11_desc:0 "A monumental temple gathered under a vast ceremonial dome. Orthodox populations and sacred infrastructure suit it best, and its ceremonies can emphasize consecration, pilgrimage revenue, or clerical government."
 game_concept_tv_wonder_display_image_12:0 "Giant Tower Temple"
 game_concept_tv_wonder_display_image_12_desc:0 "A towering temple of stairs, beacon chambers, shrines, and schools. Its ceremonies can turn height toward prestige, disciplined pilgrimage, or organized conversion."
 game_concept_tv_wonder_display_image_13:0 "River Extension"
 game_concept_tv_wonder_display_image_13_desc:0 "A riverworks wonder of widened channels, bridges, embankments, fairs, and offices. It requires a river site and can turn movement, trade, and canal administration into permanent state capacity."
 game_concept_tv_wonder_display_image_14:0 "National Shipyard"
 game_concept_tv_wonder_display_image_14_desc:0 "A coastal shipbuilding complex of slips, cranes, storehouses, and naval offices. Harbor capacity and development suit it best, and its ceremonies can emphasize shipbuilding speed, fleet morale, or naval range."
 game_concept_tv_wonder_display_image_15:0 "Star Fortress City"
 game_concept_tv_wonder_display_image_15_desc:0 "A planned fortified city of angular bastions, drill grounds, magazines, and arsenals. Urban defensive sites suit it best, and its ceremonies strengthen garrisons, siege skill, or fort capacity."
 game_concept_tv_wonder_display_image_16:0 "Great Wall"
 game_concept_tv_wonder_display_image_16_desc:0 "A frontier wall of towers, gates, signal posts, and mustering grounds. Non-urban defensive sites suit it best, and its ceremonies can emphasize manpower, movement, or morale."
 game_concept_tv_wonder_display_image_17:0 "Giant Armory"
 game_concept_tv_wonder_display_image_17_desc:0 "A great military storehouse and production district for weapons, foundries, and master armourers. Developed towns and cities suit it best, and its ceremonies shape morale, production, or discipline."
 game_concept_tv_wonder_display_image_18:0 "Library of Nation"
 game_concept_tv_wonder_display_image_18_desc:0 "A capital library of catalogs, copyist houses, reading rooms, and legal deposit offices. Its ceremonies can accelerate research, literacy, or social promotion through preserved knowledge."
 game_concept_tv_wonder_display_image_19:0 "Large Canal"
 game_concept_tv_wonder_display_image_19_desc:0 "A Large Canal is a [tv_wonder_construction|e] project focused on 农业、运输、防灾. It prefers 河流或湖泊沿岸。 Its ceremonies can emphasize Irrigation Priority, Grain Transport Priority, Flood Control Priority."
 game_concept_tv_wonder_display_image_20:0 "Mountain Terrace Network"
 game_concept_tv_wonder_display_image_20_desc:0 "A Mountain Terrace Network is a [tv_wonder_construction|e] project focused on 高地开发、人口承载. It prefers 山地、高原或丘陵。 Its ceremonies can emphasize Grain Terraces, Cash-Crop Terraces, Sacred Mountain Terraces."
 game_concept_tv_wonder_display_image_21:0 "Giant Dam Project"
 game_concept_tv_wonder_display_image_21_desc:0 "A Giant Dam Project is a [tv_wonder_construction|e] project focused on 防洪、控河、权力象征. It prefers 河流、湖泊沿岸或港口。 Its ceremonies can emphasize Estuary Flood Defense, Marsh Reclamation, Water-Powered Workshops."
 game_concept_tv_wonder_display_image_22:0 "Royal Granary"
 game_concept_tv_wonder_display_image_22_desc:0 "A Royal Granary is a [tv_wonder_construction|e] project focused on 抗饥荒、国家调控. It prefers 任意非荒芜的己方地点。 Its ceremonies can emphasize Grain Price Stabilization, Wartime Reserves, Disaster Relief."
 game_concept_tv_wonder_display_image_23:0 "Imperial Post Road Network"
 game_concept_tv_wonder_display_image_23_desc:0 "A Imperial Post Road Network is a [tv_wonder_construction|e] project focused on 行政、通信、军队调动. It prefers 任意己方地点。 Its ceremonies can emphasize Military Post Roads, Trade Post Roads, Royal Tour Avenue."
 game_concept_tv_wonder_display_image_24:0 "Canal Hub City"
 game_concept_tv_wonder_display_image_24_desc:0 "A Canal Hub City is a [tv_wonder_construction|e] project focused on 区域贸易与物流. It prefers 河流、湖泊沿岸或港口，且不能为乡村。 Its ceremonies can emphasize Grain Transport Hub, Financial Warehouse Hub, Industrial Workshop Belt."
 game_concept_tv_wonder_display_image_25:0 "Frontier Colonization Belt"
 game_concept_tv_wonder_display_image_25_desc:0 "A Frontier Colonization Belt is a [tv_wonder_construction|e] project focused on 殖民、边疆稳定. It prefers 乡村或边疆开发地点。 Its ceremonies can emphasize Military Colony Belt, Settler Reclamation Belt, Religious Colonization Belt."
 game_concept_tv_wonder_display_image_26:0 "Coastal Beacon Network"
 game_concept_tv_wonder_display_image_26_desc:0 "A Coastal Beacon Network is a [tv_wonder_construction|e] project focused on 海盗预警、海防. It prefers 港口或海岸地点。 Its ceremonies can emphasize Beacon Communication, Coastal Battery Defense, Customs Patrol."
 game_concept_tv_wonder_display_image_27:0 "Knightly Fortress Order"
 game_concept_tv_wonder_display_image_27_desc:0 "A Knightly Fortress Order is a [tv_wonder_construction|e] project focused on 军事贵族与边疆秩序. It prefers 非乡村地点，或拥有要塞的地点。 Its ceremonies can emphasize Crusader Knightly Order, Frontier Lord Order, Mercenary Fortress."
 game_concept_tv_wonder_display_image_28:0 "War College"
 game_concept_tv_wonder_display_image_28_desc:0 "A War College is a [tv_wonder_construction|e] project focused on 军事理论与军官培养. It prefers 城市、大都会或拥有军械库的地点。 Its ceremonies can emphasize Firearms Tactics, Cavalry Tradition, Naval Command."
 game_concept_tv_wonder_display_image_29:0 "Great Clock and Bell Tower"
 game_concept_tv_wonder_display_image_29_desc:0 "A Great Clock and Bell Tower is a [tv_wonder_construction|e] project focused on 宗教秩序、城市时间. It prefers 非乡村地点。 Its ceremonies can emphasize Worship Timekeeping, Urban Curfew, Astronomical Calendar."
 game_concept_tv_wonder_display_image_30:0 "Royal Art District"
 game_concept_tv_wonder_display_image_30_desc:0 "A Royal Art District is a [tv_wonder_construction|e] project focused on 文化繁荣. It prefers 城市、大都会或首都。 Its ceremonies can emphasize Court Art, Folk Art, Foreign Style Synthesis."
 game_concept_tv_wonder_display_image_31:0 "Grand Theater and Festival District"
 game_concept_tv_wonder_display_image_31_desc:0 "A Grand Theater and Festival District is a [tv_wonder_construction|e] project focused on 公共文化. It prefers 非乡村地点。 Its ceremonies can emphasize Court Theater, Religious Theater, Popular Festival Ground."
 game_concept_tv_wonder_display_image_32:0 "Embassy Quarter"
 game_concept_tv_wonder_display_image_32_desc:0 "A Embassy Quarter is a [tv_wonder_construction|e] project focused on 外交影响力. It prefers 首都或非乡村地点。 Its ceremonies can emphasize Trade Diplomacy, Intelligence Diplomacy, Religious Diplomacy."
 game_concept_tv_wonder_display_image_33:0 "Law Code Stele Project"
 game_concept_tv_wonder_display_image_33_desc:0 "A Law Code Stele Project is a [tv_wonder_construction|e] project focused on 法统与治理. It prefers 任意己方地点。 Its ceremonies can emphasize Religious Law, Written Law, Imperial Edicts."
 game_concept_tv_wonder_display_image_34:0 "World Market"
 game_concept_tv_wonder_display_image_34_desc:0 "A World Market is a [tv_wonder_construction|e] project focused on 区域贸易中心. It prefers 城市、大都会或港口。 Its ceremonies can emphasize Luxury Goods Trade, Grain Trade, International Entrepot."
 game_concept_tv_wonder_display_image_35:0 "Royal Mint"
 game_concept_tv_wonder_display_image_35_desc:0 "A Royal Mint is a [tv_wonder_construction|e] project focused on 金融与税收. It prefers 城市、大都会，或金、银、铜产地。 Its ceremonies can emphasize Silver-Gold Standard, Copper Coinage, International Settlement."
 game_concept_tv_wonder_display_image_36:0 "Guild Alliance"
 game_concept_tv_wonder_display_image_36_desc:0 "A Guild Alliance is a [tv_wonder_construction|e] project focused on 城市商业组织. It prefers 非乡村地点。 Its ceremonies can emphasize Artisan Guild Alliance, Overseas Merchant Guilds, Financial Guilds."
 game_concept_tv_wonder_display_image_37:0 "Maritime Trade Station Network"
 game_concept_tv_wonder_display_image_37_desc:0 "A Maritime Trade Station Network is a [tv_wonder_construction|e] project focused on 全球贸易扩张. It prefers 港口。 Its ceremonies can emphasize Spice Trade, Slave Trade, Colonial Supply."
 game_concept_tv_wonder_display_image_38:0 "Giant Workshop Complex"
 game_concept_tv_wonder_display_image_38_desc:0 "A Giant Workshop Complex is a [tv_wonder_construction|e] project focused on 手工业集中化. It prefers 非乡村地点。 Its ceremonies can emphasize Textile Manufacturing, Military Manufacturing, Luxury Craftsmanship."
 game_concept_tv_wonder_display_image_39:0 "World Monument Group"
 game_concept_tv_wonder_display_image_39_desc:0 "A World Monument Group is a [tv_wonder_construction|e] project focused on 文明象征与历史记忆. It prefers 首都、城市或大都会。 Its ceremonies can emphasize Conquest Memorial, National Unity, World Exposition."
 game_concept_tv_wonder_display_image_40:0 "City Expansion Project"
 game_concept_tv_wonder_display_image_40_desc:0 "A City Expansion Project is a [tv_wonder_construction|e] project focused on 城市空间与地块扩容. It prefers 城市或大都会。 Its ceremonies can emphasize City Charter, Civic Grid, Urban Renewal."
 game_concept_tv_wonder_display_image_41:0 "Megalithic Circle"
 game_concept_tv_wonder_display_image_41_desc:0 "A prehistoric circle of standing stones aligned with seasons, burial memory, and sacred gatherings. This [tv_wonder_construction|e] favors rural or ancient-feeling sites and can become a calendar shrine, an astronomical alignment, or an ancestral assembly ground."
 game_concept_tv_wonder_display_image_42:0 "Grand Cathedral"
 game_concept_tv_wonder_display_image_42_desc:0 "A monumental cathedral city of towers, choirs, bells, relics, and pilgrim thresholds. This [tv_wonder_construction|e] favors urban religious centers and can serve clergy authority, pilgrimage revenue, or civic ceremony."
 game_concept_tv_wonder_display_image_43:0 "Great Monastery"
 game_concept_tv_wonder_display_image_43_desc:0 "A large monastic complex of cloisters, scriptoria, refectories, walls, and pilgrim approaches. This [tv_wonder_construction|e] favors monasteries, sacred mountains, and secluded religious landscapes, joining scholarship, devotion, and refuge."
 game_concept_tv_wonder_display_image_101:0 "Pharos Lighthouse"
 game_concept_tv_wonder_display_image_101_desc:0 "A tower of white stone rises from the Alexandrian harbor, turning royal ambition into a light that sailors can trust. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Harbor Lighting Rite ritual sequence."
 game_concept_tv_wonder_display_image_102:0 "Hagia Sophia"
 game_concept_tv_wonder_display_image_102_desc:0 "The rebuilt dome gathers gold, marble, incense, and imperial memory beneath a vault that seems to float. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Justinianic Rededication Prayer ritual sequence."
 game_concept_tv_wonder_display_image_103:0 "Dome of the Rock"
 game_concept_tv_wonder_display_image_103_desc:0 "A golden dome crowns the sacred platform of Jerusalem, binding pilgrimage, sovereignty, and contested memory. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Sanctuary Dome Pilgrimage ritual sequence."
 game_concept_tv_wonder_display_image_104:0 "Angkor Wat"
 game_concept_tv_wonder_display_image_104_desc:0 "Five towers rise above galleries and moats, making the king's temple a stone diagram of cosmic order. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Devaraja Temple Entrance ritual sequence."
 game_concept_tv_wonder_display_image_105:0 "Potala Palace"
 game_concept_tv_wonder_display_image_105_desc:0 "White walls and red halls climb the hill above Lhasa, turning elevation into sacred administration. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Dalai Lama Enthronement ritual sequence."
 game_concept_tv_wonder_display_image_106:0 "Alhambra"
 game_concept_tv_wonder_display_image_106_desc:0 "Muqarnas ceilings, water courts, and red walls preserve a courtly world at the edge of surrender. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Treaty of Granada Signing ritual sequence."
 game_concept_tv_wonder_display_image_107:0 "Machu Picchu"
 game_concept_tv_wonder_display_image_107_desc:0 "Stone terraces and temples cling to the cloud forest ridge, a royal retreat balanced between mountain and sky. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Inti Raymi ritual sequence."
 game_concept_tv_wonder_display_image_108:0 "Himeji Castle"
 game_concept_tv_wonder_display_image_108_desc:0 "White plaster keeps, layered gates, and twisting approaches turn grace into defense. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Castle Reception Ceremony ritual sequence."
 game_concept_tv_wonder_display_image_109:0 "Taj Mahal"
 game_concept_tv_wonder_display_image_109_desc:0 "White marble answers grief with symmetry, gardens, river light, and a tomb made for imperial memory. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Royal Memorial Unsealing ritual sequence."
 game_concept_tv_wonder_display_image_110:0 "Forbidden City"
 game_concept_tv_wonder_display_image_110_desc:0 "A disciplined palace axis orders gates, halls, courts, and bureaucracy around the person of the emperor. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Capital Transfer Ceremony ritual sequence."
 game_concept_tv_wonder_display_image_111:0 "Topkapi Palace"
 game_concept_tv_wonder_display_image_111_desc:0 "Courtyards, gates, treasuries, and sea views turn conquest into a daily choreography of rule. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Conquest Entry Procession ritual sequence."
 game_concept_tv_wonder_display_image_112:0 "Saint Peter's Basilica"
 game_concept_tv_wonder_display_image_112_desc:0 "A great basilica rises over the apostolic tomb, gathering pilgrims, cardinals, artists, and sovereign claims. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Basilica Dedication ritual sequence."
 game_concept_tv_wonder_display_image_113:0 "Rock-Hewn Churches of Lalibela"
 game_concept_tv_wonder_display_image_113_desc:0 "Churches cut downward from living rock make a new Jerusalem in the Ethiopian highlands. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Holy City Pilgrimage Day ritual sequence."
 game_concept_tv_wonder_display_image_114:0 "Venetian Arsenal"
 game_concept_tv_wonder_display_image_114_desc:0 "Docks, ropewalks, foundries, and guarded basins make shipbuilding a state secret and a civic ritual. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Marriage of the Sea ritual sequence."
 game_concept_tv_wonder_display_image_115:0 "Port of Malacca"
 game_concept_tv_wonder_display_image_115_desc:0 "Monsoon routes, warehouses, translators, and merchant law turn a strait into a world market. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Merchant-Port Covenant ritual sequence."
 game_concept_tv_wonder_display_image_116:0 "Red Fort of Delhi"
 game_concept_tv_wonder_display_image_116_desc:0 "Red sandstone walls enclose marble halls, gardens, and a throne room for imperial display. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Peacock Throne Installation ritual sequence."
 game_concept_tv_wonder_display_image_117:0 "Palace of Versailles"
 game_concept_tv_wonder_display_image_117_desc:0 "A palace, gardens, mirrors, and ceremony draw the nobility into the orbit of a single sun. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Sun King's Court Transfer ritual sequence."
 game_concept_tv_wonder_display_image_118:0 "Tenochtitlan Causeways"
 game_concept_tv_wonder_display_image_118_desc:0 "Causeways, canals, aqueducts, and island districts bind the lake city to markets, temples, and war. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Great Temple Expansion Sacrifice ritual sequence."
 game_concept_tv_wonder_display_image_119:0 "Amsterdam Canal Ring"
 game_concept_tv_wonder_display_image_119_desc:0 "Concentric canals, quays, warehouses, and counting houses turn a marsh city into a financial engine. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Three-Canal Groundbreaking ritual sequence."
 game_concept_tv_wonder_display_image_120:0 "Great Mosque of Mecca Expansion"
 game_concept_tv_wonder_display_image_120_desc:0 "Arcades, courtyards, and pilgrim routes expand around the Kaaba, making sacred space hold a world of believers. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Kaaba Rebuilding and Covering ritual sequence."
 game_concept_tv_wonder_display_image_121:0 "Ming Great Wall"
 game_concept_tv_wonder_display_image_121_desc:0 "Walls, passes, garrisons, beacon towers, and border towns turn frontier anxiety into masonry and smoke. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Nine Garrisons Beacon Lighting ritual sequence."
 game_concept_tv_wonder_display_image_122:0 "Bank of Saint George"
 game_concept_tv_wonder_display_image_122_desc:0 "Ledgers, state debts, merchant syndicates, and fortified counters make public credit into an institution. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Bank of Saint George Founding ritual sequence."
 game_concept_tv_wonder_display_image_123:0 "Cahokia Mound City"
 game_concept_tv_wonder_display_image_123_desc:0 "Earthen pyramids, plazas, palisades, and solar alignments make a river city into a ceremonial center. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Woodhenge Final Rite ritual sequence."
 game_concept_tv_wonder_display_image_124:0 "Great Zimbabwe Stone City"
 game_concept_tv_wonder_display_image_124_desc:0 "Dry-stone walls, conical towers, cattle wealth, and gold routes anchor a highland commercial kingdom. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Gold Trade Tribute ritual sequence."
 game_concept_tv_wonder_display_image_125:0 "Royal Square of Isfahan"
 game_concept_tv_wonder_display_image_125_desc:0 "Mosques, palaces, bazaars, and a polo field frame the capital as a theater of Safavid rule. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Capital Transfer and Polo Festival ritual sequence."
 game_concept_tv_wonder_display_image_126:0 "Grand Canal of China"
 game_concept_tv_wonder_display_image_126_desc:0 "Locks, embankments, granaries, and barge routes bind northern courts to southern harvests. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the First Grain Fleet Sailing ritual sequence."
 game_concept_tv_wonder_display_image_127:0 "Inca Royal Road Network"
 game_concept_tv_wonder_display_image_127_desc:0 "Stone roads, rope bridges, tambos, and runners stitch the Andes into a state that can speak across mountains. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Full Relay Line Dispatch ritual sequence."
 game_concept_tv_wonder_display_image_128:0 "Roman Aqueducts"
 game_concept_tv_wonder_display_image_128_desc:0 "Arches march across valleys to feed baths, fountains, mills, and the confidence of an urban empire. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Aqueduct Opening Rite ritual sequence."
 game_concept_tv_wonder_display_image_129:0 "Ancient Suez Canal Attempts"
 game_concept_tv_wonder_display_image_129_desc:0 "Survey lines, desert cuts, Nile branches, and Red Sea harbors preserve the old dream of joining waters. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Canal Opening Convoy ritual sequence."
 game_concept_tv_wonder_display_image_130:0 "Moscow Kremlin"
 game_concept_tv_wonder_display_image_130_desc:0 "Brick walls, towers, cathedrals, armories, and palaces compress fortress and sovereignty into one citadel. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Tsar Coronation ritual sequence."
 game_concept_tv_wonder_display_image_131:0 "Sacred City of Teotihuacan"
 game_concept_tv_wonder_display_image_131_desc:0 "Avenue, pyramids, compounds, and painted walls survive as the plan of a city built for cosmic scale. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Sun Pyramid Final Fire Rite ritual sequence."
 game_concept_tv_wonder_display_image_132:0 "Angkor Waterworks"
 game_concept_tv_wonder_display_image_132_desc:0 "Barays, canals, embankments, and rice fields make Angkor's sacred city depend on engineered water. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the West Baray Water-Release Rite ritual sequence."
 game_concept_tv_wonder_display_image_133:0 "Dutch Polder Works"
 game_concept_tv_wonder_display_image_133_desc:0 "Dikes, pumps, windmills, drainage boards, and reclaimed fields turn the sea into taxable land. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Polder Closure ritual sequence."
 game_concept_tv_wonder_display_image_134:0 "Machu Picchu Terraces"
 game_concept_tv_wonder_display_image_134_desc:0 "Retaining walls, drainage, soil layers, and ritual fields make steep mountains feed a royal estate. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the First Sowing Rite ritual sequence."
 game_concept_tv_wonder_display_image_135:0 "British Navy Dockyards"
 game_concept_tv_wonder_display_image_135_desc:0 "Dockyards, ropewalks, victualling yards, ordnance stores, and officers prepare fleets before war reaches the horizon. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Armada Readiness Muster ritual sequence."
 game_concept_tv_wonder_display_image_136:0 "Spanish Silver Fleet"
 game_concept_tv_wonder_display_image_136_desc:0 "Convoys, ledgers, fortified ports, and royal warehouses make Atlantic silver move under guard and seal. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Silver Fleet Homecoming ritual sequence."
 game_concept_tv_wonder_display_image_137:0 "Ottoman Hajj Road"
 game_concept_tv_wonder_display_image_137_desc:0 "Caravan roads, forts, wells, banners, and imperial subsidies bind pilgrimage to state logistics. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Hajj Departure Rite ritual sequence."
 game_concept_tv_wonder_display_image_138:0 "Persian Qanat Network"
 game_concept_tv_wonder_display_image_138_desc:0 "Underground channels, mother wells, shaft lines, gardens, and water shares make desert settlement possible. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Water Rights Allocation ritual sequence."
 game_concept_tv_wonder_display_image_139:0 "Ming Longjiang Shipyard"
 game_concept_tv_wonder_display_image_139_desc:0 "Slipways, timber basins, workshops, and treasure ships make river shipbuilding serve oceanic ambition. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Zheng He's Voyages Departure ritual sequence."
 game_concept_tv_wonder_display_image_140:0 "Holy City of Jerusalem"
 game_concept_tv_wonder_display_image_140_desc:0 "Walls, shrines, quarters, gates, and processions make one city carry several maps of sacred authority. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Holy City Power Transfer ritual sequence."
 game_concept_tv_wonder_display_image_141:0 "Stonehenge"
 game_concept_tv_wonder_display_image_141_desc:0 "Standing stones, solstice sightlines, and burial memory turn Salisbury Plain into a sacred calendar. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the Megalithic Circle archetype, and culminates in the Solstice Reckoning ritual."
 game_concept_tv_wonder_display_image_142:0 "Tower of London"
 game_concept_tv_wonder_display_image_142_desc:0 "Keep, wall, river gate, prison, armoury, and jewel house make royal authority visible at London's throat. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the Star Fortress City archetype, and culminates in the Crown Jewel Warding ritual."
 game_concept_tv_wonder_display_image_143:0 "Notre-Dame de Paris"
 game_concept_tv_wonder_display_image_143_desc:0 "Gothic vaults, rose windows, flying buttresses, and the Seine make Parisian devotion into a civic center. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the Grand Cathedral archetype, and culminates in the Cathedral Crown Procession ritual."
 game_concept_tv_wonder_display_image_144:0 "Saint Basil's Cathedral"
 game_concept_tv_wonder_display_image_144_desc:0 "Clustered chapels, bright domes, processions, and Red Square make Moscow's victory visible as sacred architecture. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the Grand Cathedral archetype, and culminates in the Intercession of Moscow ritual."
 game_concept_tv_wonder_display_image_145:0 "Trinity Lavra"
 game_concept_tv_wonder_display_image_145_desc:0 "Fortified walls, domes, cloisters, scriptoria, and pilgrim roads make the Trinity Lavra a spiritual fortress. This unique [tv_wonder_construction|e] project must be raised near its fixed historical region, follows the Great Monastery archetype, and culminates in the Monastic Host Sanctification ritual."
 game_concept_tv_wonder_display_image_146:0 "Winter Palace"
 game_concept_tv_wonder_display_image_146_desc:0 "River facade, ceremonial halls, guarded galleries, and court ritual turn the Neva capital into an imperial stage. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the Triumphal Axis archetype, and culminates in the Imperial Gallery Opening ritual."
 game_concept_tv_wonder_display_image_147:0 "Gyeongbokgung"
 game_concept_tv_wonder_display_image_147_desc:0 "Gates, throne hall, mountain axis, and ritual courtyards make Joseon kingship visible in Hanseong. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the Triumphal Axis archetype, and culminates in the Royal Audience Renewal ritual."
 game_concept_tv_wonder_display_image_148:0 "Changbai Mountain Altar"
 game_concept_tv_wonder_display_image_148_desc:0 "Volcanic peak, heavenly lake, forest, altar terrace, and banners make Changbai Mountain a sacred dynastic source. This unique [tv_wonder_construction|e] project must be raised near its fixed historical region, follows the Sacred Mountain archetype, and culminates in the Sacred Mountain Investiture ritual."
 game_concept_tv_wonder_display_image_149:0 "Belgrade Fortress"
 game_concept_tv_wonder_display_image_149_desc:0 "Walls, bastions, towers, and river gates command the meeting of the Danube and Sava. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the Star Fortress City archetype, and culminates in the Danube Watch Muster ritual."
 game_concept_tv_wonder_display_image_150:0 "Meteora Monasteries"
 game_concept_tv_wonder_display_image_150_desc:0 "Cliff pillars, suspended chapels, rope hoists, icons, and narrow stairs make Meteora a monastery above ordinary reach. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the Great Monastery archetype, and culminates in the Suspended Liturgy ritual."
 game_concept_tv_wonder_display_1:0 "Sacred Mountain"
 game_concept_tv_wonder_display_1_desc:0 "A mountain sanctuary of terraces, stairways, shrines, and solemn halls, raised where earth seems nearest to the heavens. Pilgrims climb through incense and stone while the court's authority gathers a sacred weight, making faith feel less like command than landscape."
 game_concept_tv_wonder_display_2:0 "Triumphal Axis"
 game_concept_tv_wonder_display_2_desc:0 "A ceremonial city plan of straight avenues, grand squares, victory gates, parade grounds, and palace fronts. It turns movement itself into theatre: emissaries, soldiers, and citizens pass through ordered stone and learn who stands at the center."
 game_concept_tv_wonder_display_3:0 "Great Port"
 game_concept_tv_wonder_display_3_desc:0 "A colossal harbor of breakwaters, quays, warehouses, arsenals, and market halls, built to make the sea enter the realm on royal terms. Masts gather beneath its towers, coin follows the tide, and distant courts learn the city by its waterfront."
 game_concept_tv_wonder_display_4:0 "Giant Necropolis Complex"
 game_concept_tv_wonder_display_4_desc:0 "A vast royal burial landscape of tomb terraces, processional roads, mortuary chapels, and guarded gardens. It grows strongest among hills and near settled places, turning dynastic memory into stone, ritual, and public order."
 game_concept_tv_wonder_display_5:0 "Great Lighthouse"
 game_concept_tv_wonder_display_5_desc:0 "A monumental beacon raised above a harbor mouth, binding trade routes and naval reach to a single flame. Better harbor capacity makes the site stronger, while its ceremonies shape whether the lighthouse serves fleet, merchants, or maritime watch."
 game_concept_tv_wonder_display_6:0 "Hydraulic Workshop Complex"
 game_concept_tv_wonder_display_6_desc:0 "A district of canals, wheels, reservoirs, workshops, and measured sluices. It benefits from already built local infrastructure, then turns water control into production, construction capacity, and civic authority."
 game_concept_tv_wonder_display_7:0 "Mining City"
 game_concept_tv_wonder_display_7_desc:0 "A planned extraction city of shafts, ore yards, drainage works, markets, and minting houses. High development and rural mineral frontiers suit it best, and its ceremonies decide how the mine, crown, and common workers share the underground wealth."
 game_concept_tv_wonder_display_8:0 "Giant Observatory"
 game_concept_tv_wonder_display_8_desc:0 "A monumental observatory of towers, sighting galleries, catalog rooms, and instrument courts. Hills, plateaus, mountains, and literate local populations suit it best, and its ceremonies turn sky-watching toward scholarship, navigation, or omens."
 game_concept_tv_wonder_display_9:0 "Palace of Nations"
 game_concept_tv_wonder_display_9_desc:0 "A diplomatic palace raised in the capital to make hierarchy, audiences, and foreign presence permanent. Developed metropolitan ground suits it best, and its ceremonies can turn the palace toward congress, tribute, or standing embassy districts."
 game_concept_tv_wonder_display_10:0 "University City"
 game_concept_tv_wonder_display_10_desc:0 "A scholarly city of lecture halls, colleges, libraries, and student quarters. Urban sites and literate populations suit it best, and its ceremonies can turn the university toward research, public literacy, or promotion through collegiate institutions."
 game_concept_tv_wonder_display_11:0 "Sky Dome Grand Temple"
 game_concept_tv_wonder_display_11_desc:0 "A monumental temple gathered under a vast ceremonial dome. Orthodox populations and sacred infrastructure suit it best, and its ceremonies can emphasize consecration, pilgrimage revenue, or clerical government."
 game_concept_tv_wonder_display_12:0 "Giant Tower Temple"
 game_concept_tv_wonder_display_12_desc:0 "A towering temple of stairs, beacon chambers, shrines, and schools. Its ceremonies can turn height toward prestige, disciplined pilgrimage, or organized conversion."
 game_concept_tv_wonder_display_13:0 "River Extension"
 game_concept_tv_wonder_display_13_desc:0 "A riverworks wonder of widened channels, bridges, embankments, fairs, and offices. It requires a river site and can turn movement, trade, and canal administration into permanent state capacity."
 game_concept_tv_wonder_display_14:0 "National Shipyard"
 game_concept_tv_wonder_display_14_desc:0 "A coastal shipbuilding complex of slips, cranes, storehouses, and naval offices. Harbor capacity and development suit it best, and its ceremonies can emphasize shipbuilding speed, fleet morale, or naval range."
 game_concept_tv_wonder_display_15:0 "Star Fortress City"
 game_concept_tv_wonder_display_15_desc:0 "A planned fortified city of angular bastions, drill grounds, magazines, and arsenals. Urban defensive sites suit it best, and its ceremonies strengthen garrisons, siege skill, or fort capacity."
 game_concept_tv_wonder_display_16:0 "Great Wall"
 game_concept_tv_wonder_display_16_desc:0 "A frontier wall of towers, gates, signal posts, and mustering grounds. Non-urban defensive sites suit it best, and its ceremonies can emphasize manpower, movement, or morale."
 game_concept_tv_wonder_display_17:0 "Giant Armory"
 game_concept_tv_wonder_display_17_desc:0 "A great military storehouse and production district for weapons, foundries, and master armourers. Developed towns and cities suit it best, and its ceremonies shape morale, production, or discipline."
 game_concept_tv_wonder_display_18:0 "Library of Nation"
 game_concept_tv_wonder_display_18_desc:0 "A capital library of catalogs, copyist houses, reading rooms, and legal deposit offices. Its ceremonies can accelerate research, literacy, or social promotion through preserved knowledge."
 game_concept_tv_wonder_display_19:0 "Large Canal"
 game_concept_tv_wonder_display_19_desc:0 "A Large Canal is a [tv_wonder_construction|e] project focused on 农业、运输、防灾. It prefers 河流或湖泊沿岸。 Its ceremonies can emphasize Irrigation Priority, Grain Transport Priority, Flood Control Priority."
 game_concept_tv_wonder_display_20:0 "Mountain Terrace Network"
 game_concept_tv_wonder_display_20_desc:0 "A Mountain Terrace Network is a [tv_wonder_construction|e] project focused on 高地开发、人口承载. It prefers 山地、高原或丘陵。 Its ceremonies can emphasize Grain Terraces, Cash-Crop Terraces, Sacred Mountain Terraces."
 game_concept_tv_wonder_display_21:0 "Giant Dam Project"
 game_concept_tv_wonder_display_21_desc:0 "A Giant Dam Project is a [tv_wonder_construction|e] project focused on 防洪、控河、权力象征. It prefers 河流、湖泊沿岸或港口。 Its ceremonies can emphasize Estuary Flood Defense, Marsh Reclamation, Water-Powered Workshops."
 game_concept_tv_wonder_display_22:0 "Royal Granary"
 game_concept_tv_wonder_display_22_desc:0 "A Royal Granary is a [tv_wonder_construction|e] project focused on 抗饥荒、国家调控. It prefers 任意非荒芜的己方地点。 Its ceremonies can emphasize Grain Price Stabilization, Wartime Reserves, Disaster Relief."
 game_concept_tv_wonder_display_23:0 "Imperial Post Road Network"
 game_concept_tv_wonder_display_23_desc:0 "A Imperial Post Road Network is a [tv_wonder_construction|e] project focused on 行政、通信、军队调动. It prefers 任意己方地点。 Its ceremonies can emphasize Military Post Roads, Trade Post Roads, Royal Tour Avenue."
 game_concept_tv_wonder_display_24:0 "Canal Hub City"
 game_concept_tv_wonder_display_24_desc:0 "A Canal Hub City is a [tv_wonder_construction|e] project focused on 区域贸易与物流. It prefers 河流、湖泊沿岸或港口，且不能为乡村。 Its ceremonies can emphasize Grain Transport Hub, Financial Warehouse Hub, Industrial Workshop Belt."
 game_concept_tv_wonder_display_25:0 "Frontier Colonization Belt"
 game_concept_tv_wonder_display_25_desc:0 "A Frontier Colonization Belt is a [tv_wonder_construction|e] project focused on 殖民、边疆稳定. It prefers 乡村或边疆开发地点。 Its ceremonies can emphasize Military Colony Belt, Settler Reclamation Belt, Religious Colonization Belt."
 game_concept_tv_wonder_display_26:0 "Coastal Beacon Network"
 game_concept_tv_wonder_display_26_desc:0 "A Coastal Beacon Network is a [tv_wonder_construction|e] project focused on 海盗预警、海防. It prefers 港口或海岸地点。 Its ceremonies can emphasize Beacon Communication, Coastal Battery Defense, Customs Patrol."
 game_concept_tv_wonder_display_27:0 "Knightly Fortress Order"
 game_concept_tv_wonder_display_27_desc:0 "A Knightly Fortress Order is a [tv_wonder_construction|e] project focused on 军事贵族与边疆秩序. It prefers 非乡村地点，或拥有要塞的地点。 Its ceremonies can emphasize Crusader Knightly Order, Frontier Lord Order, Mercenary Fortress."
 game_concept_tv_wonder_display_28:0 "War College"
 game_concept_tv_wonder_display_28_desc:0 "A War College is a [tv_wonder_construction|e] project focused on 军事理论与军官培养. It prefers 城市、大都会或拥有军械库的地点。 Its ceremonies can emphasize Firearms Tactics, Cavalry Tradition, Naval Command."
 game_concept_tv_wonder_display_29:0 "Great Clock and Bell Tower"
 game_concept_tv_wonder_display_29_desc:0 "A Great Clock and Bell Tower is a [tv_wonder_construction|e] project focused on 宗教秩序、城市时间. It prefers 非乡村地点。 Its ceremonies can emphasize Worship Timekeeping, Urban Curfew, Astronomical Calendar."
 game_concept_tv_wonder_display_30:0 "Royal Art District"
 game_concept_tv_wonder_display_30_desc:0 "A Royal Art District is a [tv_wonder_construction|e] project focused on 文化繁荣. It prefers 城市、大都会或首都。 Its ceremonies can emphasize Court Art, Folk Art, Foreign Style Synthesis."
 game_concept_tv_wonder_display_31:0 "Grand Theater and Festival District"
 game_concept_tv_wonder_display_31_desc:0 "A Grand Theater and Festival District is a [tv_wonder_construction|e] project focused on 公共文化. It prefers 非乡村地点。 Its ceremonies can emphasize Court Theater, Religious Theater, Popular Festival Ground."
 game_concept_tv_wonder_display_32:0 "Embassy Quarter"
 game_concept_tv_wonder_display_32_desc:0 "A Embassy Quarter is a [tv_wonder_construction|e] project focused on 外交影响力. It prefers 首都或非乡村地点。 Its ceremonies can emphasize Trade Diplomacy, Intelligence Diplomacy, Religious Diplomacy."
 game_concept_tv_wonder_display_33:0 "Law Code Stele Project"
 game_concept_tv_wonder_display_33_desc:0 "A Law Code Stele Project is a [tv_wonder_construction|e] project focused on 法统与治理. It prefers 任意己方地点。 Its ceremonies can emphasize Religious Law, Written Law, Imperial Edicts."
 game_concept_tv_wonder_display_34:0 "World Market"
 game_concept_tv_wonder_display_34_desc:0 "A World Market is a [tv_wonder_construction|e] project focused on 区域贸易中心. It prefers 城市、大都会或港口。 Its ceremonies can emphasize Luxury Goods Trade, Grain Trade, International Entrepot."
 game_concept_tv_wonder_display_35:0 "Royal Mint"
 game_concept_tv_wonder_display_35_desc:0 "A Royal Mint is a [tv_wonder_construction|e] project focused on 金融与税收. It prefers 城市、大都会，或金、银、铜产地。 Its ceremonies can emphasize Silver-Gold Standard, Copper Coinage, International Settlement."
 game_concept_tv_wonder_display_36:0 "Guild Alliance"
 game_concept_tv_wonder_display_36_desc:0 "A Guild Alliance is a [tv_wonder_construction|e] project focused on 城市商业组织. It prefers 非乡村地点。 Its ceremonies can emphasize Artisan Guild Alliance, Overseas Merchant Guilds, Financial Guilds."
 game_concept_tv_wonder_display_37:0 "Maritime Trade Station Network"
 game_concept_tv_wonder_display_37_desc:0 "A Maritime Trade Station Network is a [tv_wonder_construction|e] project focused on 全球贸易扩张. It prefers 港口。 Its ceremonies can emphasize Spice Trade, Slave Trade, Colonial Supply."
 game_concept_tv_wonder_display_38:0 "Giant Workshop Complex"
 game_concept_tv_wonder_display_38_desc:0 "A Giant Workshop Complex is a [tv_wonder_construction|e] project focused on 手工业集中化. It prefers 非乡村地点。 Its ceremonies can emphasize Textile Manufacturing, Military Manufacturing, Luxury Craftsmanship."
 game_concept_tv_wonder_display_39:0 "World Monument Group"
 game_concept_tv_wonder_display_39_desc:0 "A World Monument Group is a [tv_wonder_construction|e] project focused on 文明象征与历史记忆. It prefers 首都、城市或大都会。 Its ceremonies can emphasize Conquest Memorial, National Unity, World Exposition."
 game_concept_tv_wonder_display_40:0 "City Expansion Project"
 game_concept_tv_wonder_display_40_desc:0 "A City Expansion Project is a [tv_wonder_construction|e] project focused on 城市空间与地块扩容. It prefers 城市或大都会。 Its ceremonies can emphasize City Charter, Civic Grid, Urban Renewal."
 game_concept_tv_wonder_display_41:0 "Megalithic Circle"
 game_concept_tv_wonder_display_41_desc:0 "A prehistoric circle of standing stones aligned with seasons, burial memory, and sacred gatherings. This [tv_wonder_construction|e] favors rural or ancient-feeling sites and can become a calendar shrine, an astronomical alignment, or an ancestral assembly ground."
 game_concept_tv_wonder_display_42:0 "Grand Cathedral"
 game_concept_tv_wonder_display_42_desc:0 "A monumental cathedral city of towers, choirs, bells, relics, and pilgrim thresholds. This [tv_wonder_construction|e] favors urban religious centers and can serve clergy authority, pilgrimage revenue, or civic ceremony."
 game_concept_tv_wonder_display_43:0 "Great Monastery"
 game_concept_tv_wonder_display_43_desc:0 "A large monastic complex of cloisters, scriptoria, refectories, walls, and pilgrim approaches. This [tv_wonder_construction|e] favors monasteries, sacred mountains, and secluded religious landscapes, joining scholarship, devotion, and refuge."
 game_concept_tv_wonder_display_101:0 "Pharos Lighthouse"
 game_concept_tv_wonder_display_101_desc:0 "A tower of white stone rises from the Alexandrian harbor, turning royal ambition into a light that sailors can trust. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Harbor Lighting Rite ritual sequence."
 game_concept_tv_wonder_display_102:0 "Hagia Sophia"
 game_concept_tv_wonder_display_102_desc:0 "The rebuilt dome gathers gold, marble, incense, and imperial memory beneath a vault that seems to float. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Justinianic Rededication Prayer ritual sequence."
 game_concept_tv_wonder_display_103:0 "Dome of the Rock"
 game_concept_tv_wonder_display_103_desc:0 "A golden dome crowns the sacred platform of Jerusalem, binding pilgrimage, sovereignty, and contested memory. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Sanctuary Dome Pilgrimage ritual sequence."
 game_concept_tv_wonder_display_104:0 "Angkor Wat"
 game_concept_tv_wonder_display_104_desc:0 "Five towers rise above galleries and moats, making the king's temple a stone diagram of cosmic order. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Devaraja Temple Entrance ritual sequence."
 game_concept_tv_wonder_display_105:0 "Potala Palace"
 game_concept_tv_wonder_display_105_desc:0 "White walls and red halls climb the hill above Lhasa, turning elevation into sacred administration. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Dalai Lama Enthronement ritual sequence."
 game_concept_tv_wonder_display_106:0 "Alhambra"
 game_concept_tv_wonder_display_106_desc:0 "Muqarnas ceilings, water courts, and red walls preserve a courtly world at the edge of surrender. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Treaty of Granada Signing ritual sequence."
 game_concept_tv_wonder_display_107:0 "Machu Picchu"
 game_concept_tv_wonder_display_107_desc:0 "Stone terraces and temples cling to the cloud forest ridge, a royal retreat balanced between mountain and sky. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Inti Raymi ritual sequence."
 game_concept_tv_wonder_display_108:0 "Himeji Castle"
 game_concept_tv_wonder_display_108_desc:0 "White plaster keeps, layered gates, and twisting approaches turn grace into defense. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Castle Reception Ceremony ritual sequence."
 game_concept_tv_wonder_display_109:0 "Taj Mahal"
 game_concept_tv_wonder_display_109_desc:0 "White marble answers grief with symmetry, gardens, river light, and a tomb made for imperial memory. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Royal Memorial Unsealing ritual sequence."
 game_concept_tv_wonder_display_110:0 "Forbidden City"
 game_concept_tv_wonder_display_110_desc:0 "A disciplined palace axis orders gates, halls, courts, and bureaucracy around the person of the emperor. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Capital Transfer Ceremony ritual sequence."
 game_concept_tv_wonder_display_111:0 "Topkapi Palace"
 game_concept_tv_wonder_display_111_desc:0 "Courtyards, gates, treasuries, and sea views turn conquest into a daily choreography of rule. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Conquest Entry Procession ritual sequence."
 game_concept_tv_wonder_display_112:0 "Saint Peter's Basilica"
 game_concept_tv_wonder_display_112_desc:0 "A great basilica rises over the apostolic tomb, gathering pilgrims, cardinals, artists, and sovereign claims. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Basilica Dedication ritual sequence."
 game_concept_tv_wonder_display_113:0 "Rock-Hewn Churches of Lalibela"
 game_concept_tv_wonder_display_113_desc:0 "Churches cut downward from living rock make a new Jerusalem in the Ethiopian highlands. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Holy City Pilgrimage Day ritual sequence."
 game_concept_tv_wonder_display_114:0 "Venetian Arsenal"
 game_concept_tv_wonder_display_114_desc:0 "Docks, ropewalks, foundries, and guarded basins make shipbuilding a state secret and a civic ritual. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Marriage of the Sea ritual sequence."
 game_concept_tv_wonder_display_115:0 "Port of Malacca"
 game_concept_tv_wonder_display_115_desc:0 "Monsoon routes, warehouses, translators, and merchant law turn a strait into a world market. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Merchant-Port Covenant ritual sequence."
 game_concept_tv_wonder_display_116:0 "Red Fort of Delhi"
 game_concept_tv_wonder_display_116_desc:0 "Red sandstone walls enclose marble halls, gardens, and a throne room for imperial display. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Peacock Throne Installation ritual sequence."
 game_concept_tv_wonder_display_117:0 "Palace of Versailles"
 game_concept_tv_wonder_display_117_desc:0 "A palace, gardens, mirrors, and ceremony draw the nobility into the orbit of a single sun. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Sun King's Court Transfer ritual sequence."
 game_concept_tv_wonder_display_118:0 "Tenochtitlan Causeways"
 game_concept_tv_wonder_display_118_desc:0 "Causeways, canals, aqueducts, and island districts bind the lake city to markets, temples, and war. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Great Temple Expansion Sacrifice ritual sequence."
 game_concept_tv_wonder_display_119:0 "Amsterdam Canal Ring"
 game_concept_tv_wonder_display_119_desc:0 "Concentric canals, quays, warehouses, and counting houses turn a marsh city into a financial engine. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Three-Canal Groundbreaking ritual sequence."
 game_concept_tv_wonder_display_120:0 "Great Mosque of Mecca Expansion"
 game_concept_tv_wonder_display_120_desc:0 "Arcades, courtyards, and pilgrim routes expand around the Kaaba, making sacred space hold a world of believers. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Kaaba Rebuilding and Covering ritual sequence."
 game_concept_tv_wonder_display_121:0 "Ming Great Wall"
 game_concept_tv_wonder_display_121_desc:0 "Walls, passes, garrisons, beacon towers, and border towns turn frontier anxiety into masonry and smoke. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Nine Garrisons Beacon Lighting ritual sequence."
 game_concept_tv_wonder_display_122:0 "Bank of Saint George"
 game_concept_tv_wonder_display_122_desc:0 "Ledgers, state debts, merchant syndicates, and fortified counters make public credit into an institution. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Bank of Saint George Founding ritual sequence."
 game_concept_tv_wonder_display_123:0 "Cahokia Mound City"
 game_concept_tv_wonder_display_123_desc:0 "Earthen pyramids, plazas, palisades, and solar alignments make a river city into a ceremonial center. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Woodhenge Final Rite ritual sequence."
 game_concept_tv_wonder_display_124:0 "Great Zimbabwe Stone City"
 game_concept_tv_wonder_display_124_desc:0 "Dry-stone walls, conical towers, cattle wealth, and gold routes anchor a highland commercial kingdom. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Gold Trade Tribute ritual sequence."
 game_concept_tv_wonder_display_125:0 "Royal Square of Isfahan"
 game_concept_tv_wonder_display_125_desc:0 "Mosques, palaces, bazaars, and a polo field frame the capital as a theater of Safavid rule. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Capital Transfer and Polo Festival ritual sequence."
 game_concept_tv_wonder_display_126:0 "Grand Canal of China"
 game_concept_tv_wonder_display_126_desc:0 "Locks, embankments, granaries, and barge routes bind northern courts to southern harvests. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the First Grain Fleet Sailing ritual sequence."
 game_concept_tv_wonder_display_127:0 "Inca Royal Road Network"
 game_concept_tv_wonder_display_127_desc:0 "Stone roads, rope bridges, tambos, and runners stitch the Andes into a state that can speak across mountains. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Full Relay Line Dispatch ritual sequence."
 game_concept_tv_wonder_display_128:0 "Roman Aqueducts"
 game_concept_tv_wonder_display_128_desc:0 "Arches march across valleys to feed baths, fountains, mills, and the confidence of an urban empire. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Aqueduct Opening Rite ritual sequence."
 game_concept_tv_wonder_display_129:0 "Ancient Suez Canal Attempts"
 game_concept_tv_wonder_display_129_desc:0 "Survey lines, desert cuts, Nile branches, and Red Sea harbors preserve the old dream of joining waters. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Canal Opening Convoy ritual sequence."
 game_concept_tv_wonder_display_130:0 "Moscow Kremlin"
 game_concept_tv_wonder_display_130_desc:0 "Brick walls, towers, cathedrals, armories, and palaces compress fortress and sovereignty into one citadel. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Tsar Coronation ritual sequence."
 game_concept_tv_wonder_display_131:0 "Sacred City of Teotihuacan"
 game_concept_tv_wonder_display_131_desc:0 "Avenue, pyramids, compounds, and painted walls survive as the plan of a city built for cosmic scale. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Sun Pyramid Final Fire Rite ritual sequence."
 game_concept_tv_wonder_display_132:0 "Angkor Waterworks"
 game_concept_tv_wonder_display_132_desc:0 "Barays, canals, embankments, and rice fields make Angkor's sacred city depend on engineered water. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the West Baray Water-Release Rite ritual sequence."
 game_concept_tv_wonder_display_133:0 "Dutch Polder Works"
 game_concept_tv_wonder_display_133_desc:0 "Dikes, pumps, windmills, drainage boards, and reclaimed fields turn the sea into taxable land. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Polder Closure ritual sequence."
 game_concept_tv_wonder_display_134:0 "Machu Picchu Terraces"
 game_concept_tv_wonder_display_134_desc:0 "Retaining walls, drainage, soil layers, and ritual fields make steep mountains feed a royal estate. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the First Sowing Rite ritual sequence."
 game_concept_tv_wonder_display_135:0 "British Navy Dockyards"
 game_concept_tv_wonder_display_135_desc:0 "Dockyards, ropewalks, victualling yards, ordnance stores, and officers prepare fleets before war reaches the horizon. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Armada Readiness Muster ritual sequence."
 game_concept_tv_wonder_display_136:0 "Spanish Silver Fleet"
 game_concept_tv_wonder_display_136_desc:0 "Convoys, ledgers, fortified ports, and royal warehouses make Atlantic silver move under guard and seal. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Silver Fleet Homecoming ritual sequence."
 game_concept_tv_wonder_display_137:0 "Ottoman Hajj Road"
 game_concept_tv_wonder_display_137_desc:0 "Caravan roads, forts, wells, banners, and imperial subsidies bind pilgrimage to state logistics. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Hajj Departure Rite ritual sequence."
 game_concept_tv_wonder_display_138:0 "Persian Qanat Network"
 game_concept_tv_wonder_display_138_desc:0 "Underground channels, mother wells, shaft lines, gardens, and water shares make desert settlement possible. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Water Rights Allocation ritual sequence."
 game_concept_tv_wonder_display_139:0 "Ming Longjiang Shipyard"
 game_concept_tv_wonder_display_139_desc:0 "Slipways, timber basins, workshops, and treasure ships make river shipbuilding serve oceanic ambition. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Zheng He's Voyages Departure ritual sequence."
 game_concept_tv_wonder_display_140:0 "Holy City of Jerusalem"
 game_concept_tv_wonder_display_140_desc:0 "Walls, shrines, quarters, gates, and processions make one city carry several maps of sacred authority. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the same site rules as its generic archetype, and culminates in the Holy City Power Transfer ritual sequence."
 game_concept_tv_wonder_display_141:0 "Stonehenge"
 game_concept_tv_wonder_display_141_desc:0 "Standing stones, solstice sightlines, and burial memory turn Salisbury Plain into a sacred calendar. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the Megalithic Circle archetype, and culminates in the Solstice Reckoning ritual."
 game_concept_tv_wonder_display_142:0 "Tower of London"
 game_concept_tv_wonder_display_142_desc:0 "Keep, wall, river gate, prison, armoury, and jewel house make royal authority visible at London's throat. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the Star Fortress City archetype, and culminates in the Crown Jewel Warding ritual."
 game_concept_tv_wonder_display_143:0 "Notre-Dame de Paris"
 game_concept_tv_wonder_display_143_desc:0 "Gothic vaults, rose windows, flying buttresses, and the Seine make Parisian devotion into a civic center. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the Grand Cathedral archetype, and culminates in the Cathedral Crown Procession ritual."
 game_concept_tv_wonder_display_144:0 "Saint Basil's Cathedral"
 game_concept_tv_wonder_display_144_desc:0 "Clustered chapels, bright domes, processions, and Red Square make Moscow's victory visible as sacred architecture. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the Grand Cathedral archetype, and culminates in the Intercession of Moscow ritual."
 game_concept_tv_wonder_display_145:0 "Trinity Lavra"
 game_concept_tv_wonder_display_145_desc:0 "Fortified walls, domes, cloisters, scriptoria, and pilgrim roads make the Trinity Lavra a spiritual fortress. This unique [tv_wonder_construction|e] project must be raised near its fixed historical region, follows the Great Monastery archetype, and culminates in the Monastic Host Sanctification ritual."
 game_concept_tv_wonder_display_146:0 "Winter Palace"
 game_concept_tv_wonder_display_146_desc:0 "River facade, ceremonial halls, guarded galleries, and court ritual turn the Neva capital into an imperial stage. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the Triumphal Axis archetype, and culminates in the Imperial Gallery Opening ritual."
 game_concept_tv_wonder_display_147:0 "Gyeongbokgung"
 game_concept_tv_wonder_display_147_desc:0 "Gates, throne hall, mountain axis, and ritual courtyards make Joseon kingship visible in Hanseong. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the Triumphal Axis archetype, and culminates in the Royal Audience Renewal ritual."
 game_concept_tv_wonder_display_148:0 "Changbai Mountain Altar"
 game_concept_tv_wonder_display_148_desc:0 "Volcanic peak, heavenly lake, forest, altar terrace, and banners make Changbai Mountain a sacred dynastic source. This unique [tv_wonder_construction|e] project must be raised near its fixed historical region, follows the Sacred Mountain archetype, and culminates in the Sacred Mountain Investiture ritual."
 game_concept_tv_wonder_display_149:0 "Belgrade Fortress"
 game_concept_tv_wonder_display_149_desc:0 "Walls, bastions, towers, and river gates command the meeting of the Danube and Sava. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the Star Fortress City archetype, and culminates in the Danube Watch Muster ritual."
 game_concept_tv_wonder_display_150:0 "Meteora Monasteries"
 game_concept_tv_wonder_display_150_desc:0 "Cliff pillars, suspended chapels, rope hoists, icons, and narrow stairs make Meteora a monastery above ordinary reach. This unique [tv_wonder_construction|e] project must be raised at its fixed historical site, follows the Great Monastery archetype, and culminates in the Suspended Liturgy ritual."
