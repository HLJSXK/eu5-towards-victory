 TV_ENGINEERING_PROPOSAL_UNIQUE_LONGJIANG_SHIPYARD_TEXT:0 "The engineer looks to Nanjing's Longjiang shipyard, where the Ming court prepared fleets large enough to change horizons. Brief: [tv_wonder_unique_longjiang_shipyard|E], a unique [tv_wonder_medium|E] historical wonder at its fixed historical site."
 TV_ENGINEERING_PROPOSAL_RESUME_UNIQUE_LONGJIANG_SHIPYARD_TEXT:0 "The [tv_great_engineer|E] wants to complete the existing [tv_wonder_unique_longjiang_shipyard|E] and reuse the preserved construction at the site."
 TV_ENGINEERING_PROPOSAL_EXPAND_UNIQUE_LONGJIANG_SHIPYARD_TEXT:0 "The [tv_great_engineer|E] wants to expand the existing [tv_wonder_unique_longjiang_shipyard|E] toward the site's preserved maximum level."
