 game_concept_tv_wonder_grand_cathedral_desc:0 "A monumental cathedral city of towers, choirs, bells, relics, and pilgrim thresholds. This [tv_wonder_construction|e] favors urban religious centers and can serve clergy authority, pilgrimage revenue, or civic ceremony."
 TV_ENGINEERING_PROPOSAL_GRAND_CATHEDRAL_TEXT:0 "The engineer proposes a great cathedral whose vaults can make devotion public and the city legible to faith. Brief: [tv_wonder_grand_cathedral|E], a [tv_wonder_medium|E] project for religious authority and urban ceremony."
