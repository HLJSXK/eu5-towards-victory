 tv_engineering_department.7075.t:0 "[tv_wonder_construction|E]：Opinion at the Scaffold Wavers"
 tv_engineering_department.7075.d:0 "A public demonstration at the site draws a crowd that may become loyal spectators or offended critics. The scaffolds wait while rumor decides whether [tv_wonder_domestic_support|E] has been helped or harmed."
 tv_engineering_department.7075.a:0 "Let the site prove it."
 tv_engineering_department.7076.t:0 "[tv_wonder_construction|E]：The Plan Outgrows the Page"
 tv_engineering_department.7076.d:0 "A bold adjustment pulls the plan beyond its old limits. It may become the decision that made the monument grand, or the note future clerks underline in red."
 tv_engineering_department.7076.a:0 "Let the site prove it."
 tv_engineering_department.7077.t:0 "[tv_wonder_construction|E]：Orders Change Under the Awning"
 tv_engineering_department.7077.d:0 "A new chain of command is imposed under the awnings. It may discipline the yard or merely teach every foreman a new way to argue."
 tv_engineering_department.7077.a:0 "Let the site prove it."
 tv_engineering_department.7078.t:0 "[tv_wonder_construction|E]：The Route Turns Through Mud"
 tv_engineering_department.7078.d:0 "A risky route promises to shorten the supply line. If the weather holds it will be praised as foresight; if it fails, everyone will remember who ordered the turn."
 tv_engineering_department.7078.a:0 "Let the site prove it."
 tv_engineering_department.7079.t:0 "[tv_wonder_construction|E]：A New Method Hangs in the Air"
 tv_engineering_department.7079.d:0 "A faster method is tried on the active part. It may save the month or force the next crew to repair a beautiful mistake."
 tv_engineering_department.7079.a:0 "Let the site prove it."
 tv_engineering_department.7080.t:0 "[tv_wonder_construction|E]：Public Doubt or Silver Runs Thin"
 tv_engineering_department.7080.d:0 "The works face a mean choice. If the project absorbs the blow, public backing thins; if the pressure is pushed outward, [gold|E] will pay instead. The accounts can be balanced, but not made clean."
 tv_engineering_department.7080.a:0 "Let public backing suffer."
 tv_engineering_department.7080.b:0 "Protect public backing and burden the treasury."
