 tv_engineering_department.7045.d:0 "Local inns, workshops, and trade are turned toward the great mouth of the worksite. The [tv_engineering_department|E] uses that uncomfortable opening to secure clearer rosters and stricter shifts. In return, orders cross the yard with fewer detours; still, the streets outside the fence grow quieter."
