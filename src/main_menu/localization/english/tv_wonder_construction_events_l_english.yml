 tv_engineering_department.7074.b:0 "We decline for now."
 tv_engineering_department.7075.t:0 "[tv_wonder_construction|E]：Opinion at the Scaffold Wavers"
 tv_engineering_department.7075.d:0 "A public demonstration at the site draws a crowd that may become loyal spectators or offended critics. The scaffolds wait while rumor decides whether [tv_wonder_domestic_support|E] has been helped or harmed."
 tv_engineering_department.7075.a:0 "Lets the demonstration speak for itself."
 tv_engineering_department.7076.t:0 "[tv_wonder_construction|E]：The Plan Outgrows the Page"
 tv_engineering_department.7076.d:0 "A bold adjustment pulls the plan beyond its old limits. It may become the decision that made the monument grand, or the note future clerks underline in red."
 tv_engineering_department.7076.a:0 "Pushes the design past its old limits."
 tv_engineering_department.7077.t:0 "[tv_wonder_construction|E]：Orders Change Under the Awning"
 tv_engineering_department.7077.d:0 "A new chain of command is imposed under the awnings. It may discipline the yard or merely teach every foreman a new way to argue."
 tv_engineering_department.7077.a:0 "We push the new chain of command through the yard."
 tv_engineering_department.7078.t:0 "[tv_wonder_construction|E]：The Route Turns Through Mud"
 tv_engineering_department.7078.d:0 "A risky route promises to shorten the supply line. If the weather holds it will be praised as foresight; if it fails, everyone will remember who ordered the turn."
 tv_engineering_department.7078.a:0 "Take the shorter road!"
 tv_engineering_department.7079.t:0 "[tv_wonder_construction|E]：A New Method Hangs in the Air"
 tv_engineering_department.7079.d:0 "A faster method is tried on the active part. It may save the month or force the next crew to repair a beautiful mistake."
 tv_engineering_department.7079.a:0 "Tries the faster method on the active section."
 tv_engineering_department.7080.t:0 "[tv_wonder_construction|E]：Public Doubt or Silver Runs Thin"
 tv_engineering_department.7080.d:0 "There is no way to absorb this loss cleanly. Either [tv_wonder_domestic_support|E] takes the weight and holds its ground, or the strain lands on [gold|E] instead. Someone always pays, one way or another."
 tv_engineering_department.7080.a:0 "We absorb it and move on."
 tv_engineering_department.7080.b:0 "We'll let the rest absorb this one."
 tv_engineering_department.7081.t:0 "[tv_wonder_construction|E]：Public Doubt or Mandate Wears Thin"
 tv_engineering_department.7081.d:0 "A shock has found its way to the site, and it must land somewhere. Hold firm and let [tv_wonder_domestic_support|E] take the brunt of it, or turn it aside and let [legitimacy|E] absorb the fallout."
 tv_engineering_department.7081.a:0 "We hold the line, whatever it costs."
 tv_engineering_department.7081.b:0 "We spare it and pay elsewhere."
 tv_engineering_department.7082.t:0 "[tv_wonder_construction|E]：Public Doubt or Order Loosens"
 tv_engineering_department.7082.d:0 "Something on this scaffold must give. Either [tv_wonder_domestic_support|E] takes the sag, or the load shifts onto [stability|E] instead."
 tv_engineering_department.7082.a:0 "We'll wear this one ourselves."
 tv_engineering_department.7082.b:0 "We turn the blow aside."
 tv_engineering_department.7083.t:0 "[tv_wonder_construction|E]：Public Doubt or Prestige Gathers Dust"
 tv_engineering_department.7083.d:0 "Two doors stand open, and only one can be shut in time. Close it on [tv_wonder_domestic_support|E], and the setback lands there; leave it be, and [prestige|E] takes the fall instead."
 tv_engineering_department.7083.a:0 "Take the hit!"
 tv_engineering_department.7083.b:0 "Turn it aside!"
 tv_engineering_department.7084.t:0 "[tv_wonder_construction|E]：Public Doubt or Noble Murmurs"
 tv_engineering_department.7084.d:0 "The trouble behaves like floodwater looking for the lowest ground. Dam it here and [tv_wonder_domestic_support|E] takes the first surge; open the sluice elsewhere and [estate_satisfaction|E] among the nobles takes the water instead."
 tv_engineering_department.7084.a:0 "Better a known wound than a hidden one."
 tv_engineering_department.7084.b:0 "Spare the roof; let the rain find another eave."
 tv_engineering_department.7085.t:0 "[tv_wonder_construction|E]：Public Doubt or Clerical Unease"
 tv_engineering_department.7085.d:0 "Somebody must carry this debt through the month. Let [tv_wonder_domestic_support|E] sign for it and wear the cost, or push the note across the table so [estate_satisfaction|E] among the clergy settles it instead."
 tv_engineering_department.7085.a:0 "Lets it take the hit."
 tv_engineering_department.7085.b:0 "Pushes the burden elsewhere."
 tv_engineering_department.7086.t:0 "[tv_wonder_construction|E]：Public Doubt or Merchant Complaints"
 tv_engineering_department.7086.d:0 "The blow is already swinging and cannot be stopped, only redirected. Take it on [tv_wonder_domestic_support|E], or send it wide so [estate_satisfaction|E] among the burghers catches it instead."
 tv_engineering_department.7086.a:0 "Puts the strain here and holds the line."
 tv_engineering_department.7086.b:0 "Shifts the weight outward."
 tv_engineering_department.7087.t:0 "[tv_wonder_construction|E]：Public Doubt or Tired Villages"
 tv_engineering_department.7087.d:0 "A crack has opened somewhere in the work, and mortar alone will not seal it. Let it run through [tv_wonder_domestic_support|E], or brace that line and let it surface instead in [estate_satisfaction|E] among the peasants."
 tv_engineering_department.7087.a:0 "Takes the weight without flinching."
 tv_engineering_department.7087.b:0 "Spares it and lets the strain fall on the rest."
 tv_engineering_department.7088.t:0 "[tv_wonder_construction|E]：Public Doubt or The Site Is Hollowed"
 tv_engineering_department.7088.d:0 "The scales will not sit level no matter how the numbers are read. Tip them so [tv_wonder_domestic_support|E] carries the difference, or tip them the other way and hand the difference to [development|E] at the site."
 tv_engineering_department.7088.a:0 "Keeps the loss close and bears it."
 tv_engineering_department.7088.b:0 "Turns the loss aside."
