 tv_engineering_department.7049.t:0 "[tv_wonder_construction|E]：Treasury Doors Open for A Clearer Road"
 tv_engineering_department.7049.d:0 "Treasury clerks unlock reserve coin meant for quieter obligations. The [tv_engineering_department|E] uses that uncomfortable opening to secure bridges, storehouses, marked roads, and reliable carts. In return, stone and timber arrive at the needed speed; still, the missing money will be noticed when the next account is opened."
 tv_engineering_department.7049.a:0 "Spend the treasury for logistics."
 tv_engineering_department.7049.b:0 "Let the month pass quietly."
 tv_engineering_department.7050.t:0 "[tv_wonder_construction|E]：Royal Authority Is Pledged for A Clearer Road"
 tv_engineering_department.7050.d:0 "The court lends the royal name to a decision that would otherwise invite too many questions. The [tv_engineering_department|E] uses that uncomfortable opening to secure bridges, storehouses, marked roads, and reliable carts. In return, stone and timber arrive at the needed speed; still, authority used as scaffolding never returns entirely clean."
 tv_engineering_department.7050.a:0 "Spend royal authority for logistics."
 tv_engineering_department.7050.b:0 "Let the month pass quietly."
 tv_engineering_department.7051.t:0 "[tv_wonder_construction|E]：Villages Give Way for A Clearer Road"
 tv_engineering_department.7051.d:0 "Local order is disturbed so carts, crews, and writs can move without waiting. The [tv_engineering_department|E] uses that uncomfortable opening to secure bridges, storehouses, marked roads, and reliable carts. In return, stone and timber arrive at the needed speed; still, villages remember when ordinary days are bent for distant stone."
 tv_engineering_department.7051.a:0 "Spend order for logistics."
 tv_engineering_department.7051.b:0 "Let the month pass quietly."
 tv_engineering_department.7052.t:0 "[tv_wonder_construction|E]：Reputation Is Spent for A Clearer Road"
 tv_engineering_department.7052.d:0 "Courtly reputation is spent in announcements, ceremonies, and promises. The [tv_engineering_department|E] uses that uncomfortable opening to secure bridges, storehouses, marked roads, and reliable carts. In return, stone and timber arrive at the needed speed; still, the fine words will demand results later."
 tv_engineering_department.7052.a:0 "Spend prestige for logistics."
 tv_engineering_department.7052.b:0 "Let the month pass quietly."
 tv_engineering_department.7053.t:0 "[tv_wonder_construction|E]：Noble Patience Is Borrowed for A Clearer Road"
 tv_engineering_department.7053.d:0 "Great houses lend carts, tenants, and names while making clear that patience is a loan. The [tv_engineering_department|E] uses that uncomfortable opening to secure bridges, storehouses, marked roads, and reliable carts. In return, stone and timber arrive at the needed speed; still, the silence at noble tables will remember the favor."
 tv_engineering_department.7053.a:0 "Spend noble patience for logistics."
 tv_engineering_department.7053.b:0 "Let the month pass quietly."
 tv_engineering_department.7054.t:0 "[tv_wonder_construction|E]：The Altars Are Asked to Yield for A Clearer Road"
 tv_engineering_department.7054.d:0 "Clerics shorten rites, lend ground, or bless an arrangement that sits uneasily beside the altar. The [tv_engineering_department|E] uses that uncomfortable opening to secure bridges, storehouses, marked roads, and reliable carts. In return, stone and timber arrive at the needed speed; still, low voices near the sanctuary ask whether the works have grown too worldly."
 tv_engineering_department.7054.a:0 "Spend clerical patience for logistics."
 tv_engineering_department.7054.b:0 "Let the month pass quietly."
 tv_engineering_department.7055.t:0 "[tv_wonder_construction|E]：The Market Lends Its Streets for A Clearer Road"
 tv_engineering_department.7055.d:0 "Merchants turn warehouses, docks, and credit toward the works for one more month. The [tv_engineering_department|E] uses that uncomfortable opening to secure bridges, storehouses, marked roads, and reliable carts. In return, stone and timber arrive at the needed speed; still, account books will preserve every inconvenience."
