 tv_engineering_department.7090.t:0 "Wonder Construction: Uncertain Domestic support"
 tv_engineering_department.7090.d:0 "A new decision around domestic support has produced results that nobody is quite ready to name. The same shortcut could save the project a month or cost it one; the same improvisation could become a method or a warning. The site waits for the verdict with all the dignity of people standing near expensive unfinished stone."
