 tv_engineering_department.7000.t:0 "[tv_wonder_construction|E]：The Streets Applaud the Site"
 tv_engineering_department.7000.d:0 "A few visible successes at the fence turn curiosity into pride. Guild elders lend names, neighbors stop treating the works as a royal vanity, and the project gains a sharper claim on [tv_wonder_domestic_support|E]."
 tv_engineering_department.7000.a:0 "Put the advantage to work."
 tv_engineering_department.7001.t:0 "[tv_wonder_construction|E]：A Wider Line on the Earth"
 tv_engineering_department.7001.d:0 "New measurements reveal ground that can bear a broader footprint. What had looked like ambition on parchment now has a tolerable foundation, and [tv_wonder_scale_competence|E] jumps forward."
 tv_engineering_department.7001.a:0 "Put the advantage to work."
 tv_engineering_department.7002.t:0 "[tv_wonder_construction|E]：Names and Orders Fall Into Place"
 tv_engineering_department.7002.d:0 "The yard wakes under new rosters. Crews know where to stand, clerks know which tally matters, and [tv_wonder_organization_competence|E] rises because confusion has fewer places to hide."
 tv_engineering_department.7002.a:0 "Put the advantage to work."
 tv_engineering_department.7003.t:0 "[tv_wonder_construction|E]：Roads and Carts Find Their Rhythm"
 tv_engineering_department.7003.d:0 "A better route links road, water, storeyard, and scaffold. The first convoy to use it arrives almost embarrassingly on time, and [tv_wonder_logistics_competence|E] surges."
 tv_engineering_department.7003.a:0 "Put the advantage to work."
 tv_engineering_department.7004.t:0 "[tv_wonder_construction|E]：Stone Rises Past the Mark"
 tv_engineering_department.7004.d:0 "The active part rises past its mark before the light fails. No single miracle explains it; the lifts, joints, and hands simply meet at the right hour, pushing [tv_wonder_construction|E] progress ahead."
 tv_engineering_department.7004.a:0 "Put the advantage to work."
 tv_engineering_department.7005.t:0 "[tv_wonder_construction|E]：Street Talk Turns"
 tv_engineering_department.7005.d:0 "The noise around the site softens. It is not acclaim, but it is permission enough for carts to pass and arguments to end sooner; [tv_wonder_domestic_support|E] rises by a useful margin."
 tv_engineering_department.7005.a:0 "Put the advantage to work."
 tv_engineering_department.7006.t:0 "[tv_wonder_construction|E]：The Measure Is Corrected"
 tv_engineering_department.7006.d:0 "A cramped angle is redrawn, a service path widened, and the main line of the monument breathes again. The improvement to [tv_wonder_scale_competence|E] is small but real."
 tv_engineering_department.7006.a:0 "Put the advantage to work."
 tv_engineering_department.7007.t:0 "[tv_wonder_construction|E]：The Yard Learns Its Rhythm"
 tv_engineering_department.7007.d:0 "A set of missing handovers is repaired. The work is too dry for ceremony, but it keeps tools moving and improves [tv_wonder_organization_competence|E]."
 tv_engineering_department.7007.a:0 "Put the advantage to work."
 tv_engineering_department.7008.t:0 "[tv_wonder_construction|E]：Ruts Find a Better Road"
 tv_engineering_department.7008.d:0 "One bad turn in the supply line is corrected. Fewer carts wait empty, fewer loads arrive cracked, and [tv_wonder_logistics_competence|E] improves."
 tv_engineering_department.7008.a:0 "Put the advantage to work."
 tv_engineering_department.7009.t:0 "[tv_wonder_construction|E]：Hammers Draw Completion Near"
 tv_engineering_department.7009.d:0 "A stubborn joint finally fits, and the next crew can begin without another month of waiting. [tv_wonder_construction|E] progress moves forward in the most satisfying way: visibly."
 tv_engineering_department.7009.a:0 "Put the advantage to work."
 tv_engineering_department.7010.t:0 "[tv_wonder_construction|E]：Treasury Doors Open for Public Backing"
 tv_engineering_department.7010.d:0 "Treasury clerks unlock reserve coin meant for quieter obligations. The [tv_engineering_department|E] uses that uncomfortable opening to secure fresh public patience and local signatures. In return, the works look less like an imposition; still, the missing money will be noticed when the next account is opened."
 tv_engineering_department.7010.a:0 "Spend the treasury for public backing."
 tv_engineering_department.7010.b:0 "Let the month pass quietly."
 tv_engineering_department.7011.t:0 "[tv_wonder_construction|E]：Royal Authority Is Pledged for Public Backing"
 tv_engineering_department.7011.d:0 "The court lends the royal name to a decision that would otherwise invite too many questions. The [tv_engineering_department|E] uses that uncomfortable opening to secure fresh public patience and local signatures. In return, the works look less like an imposition; still, authority used as scaffolding never returns entirely clean."
 tv_engineering_department.7011.a:0 "Spend royal authority for public backing."
 tv_engineering_department.7011.b:0 "Let the month pass quietly."
 tv_engineering_department.7012.t:0 "[tv_wonder_construction|E]：Villages Give Way for Public Backing"
 tv_engineering_department.7012.d:0 "Local order is disturbed so carts, crews, and writs can move without waiting. The [tv_engineering_department|E] uses that uncomfortable opening to secure fresh public patience and local signatures. In return, the works look less like an imposition; still, villages remember when ordinary days are bent for distant stone."
 tv_engineering_department.7012.a:0 "Spend order for public backing."
 tv_engineering_department.7012.b:0 "Let the month pass quietly."
 tv_engineering_department.7013.t:0 "[tv_wonder_construction|E]：Reputation Is Spent for Public Backing"
 tv_engineering_department.7013.d:0 "Courtly reputation is spent in announcements, ceremonies, and promises. The [tv_engineering_department|E] uses that uncomfortable opening to secure fresh public patience and local signatures. In return, the works look less like an imposition; still, the fine words will demand results later."
 tv_engineering_department.7013.a:0 "Spend prestige for public backing."
 tv_engineering_department.7013.b:0 "Let the month pass quietly."
 tv_engineering_department.7014.t:0 "[tv_wonder_construction|E]：Noble Patience Is Borrowed for Public Backing"
 tv_engineering_department.7014.d:0 "Great houses lend carts, tenants, and names while making clear that patience is a loan. The [tv_engineering_department|E] uses that uncomfortable opening to secure fresh public patience and local signatures. In return, the works look less like an imposition; still, the silence at noble tables will remember the favor."
 tv_engineering_department.7014.a:0 "Spend noble patience for public backing."
 tv_engineering_department.7014.b:0 "Let the month pass quietly."
 tv_engineering_department.7015.t:0 "[tv_wonder_construction|E]：The Altars Are Asked to Yield for Public Backing"
 tv_engineering_department.7015.d:0 "Clerics shorten rites, lend ground, or bless an arrangement that sits uneasily beside the altar. The [tv_engineering_department|E] uses that uncomfortable opening to secure fresh public patience and local signatures. In return, the works look less like an imposition; still, low voices near the sanctuary ask whether the works have grown too worldly."
 tv_engineering_department.7015.a:0 "Spend clerical patience for public backing."
 tv_engineering_department.7015.b:0 "Let the month pass quietly."
 tv_engineering_department.7016.t:0 "[tv_wonder_construction|E]：The Market Lends Its Streets for Public Backing"
 tv_engineering_department.7016.d:0 "Merchants turn warehouses, docks, and credit toward the works for one more month. The [tv_engineering_department|E] uses that uncomfortable opening to secure fresh public patience and local signatures. In return, the works look less like an imposition; still, account books will preserve every inconvenience."
 tv_engineering_department.7016.a:0 "Spend market patience for public backing."
 tv_engineering_department.7016.b:0 "Let the month pass quietly."
 tv_engineering_department.7017.t:0 "[tv_wonder_construction|E]：Village Shoulders Are Borrowed for Public Backing"
 tv_engineering_department.7017.d:0 "Villages provide more carts, hands, and grain under promises that this burden is temporary. The [tv_engineering_department|E] uses that uncomfortable opening to secure fresh public patience and local signatures. In return, the works look less like an imposition; still, tired fields know how long temporary can last."
 tv_engineering_department.7017.a:0 "Spend village patience for public backing."
 tv_engineering_department.7017.b:0 "Let the month pass quietly."
 tv_engineering_department.7018.t:0 "[tv_wonder_construction|E]：The Site Gives Stone and Space for Public Backing"
 tv_engineering_department.7018.d:0 "Existing streets, workshops, and local improvements are cut open to give the monument room. The [tv_engineering_department|E] uses that uncomfortable opening to secure fresh public patience and local signatures. In return, the works look less like an imposition; still, the site is easier to build on because it has less of its old self left."
 tv_engineering_department.7018.a:0 "Spend the site for public backing."
 tv_engineering_department.7018.b:0 "Let the month pass quietly."
 tv_engineering_department.7019.t:0 "[tv_wonder_construction|E]：Local Trade Is Bent Toward the Works for Public Backing"
 tv_engineering_department.7019.d:0 "Local inns, workshops, and trade are turned toward the great mouth of the worksite. The [tv_engineering_department|E] uses that uncomfortable opening to secure fresh public patience and local signatures. In return, the works look less like an imposition; still, the streets outside the fence grow quieter."
 tv_engineering_department.7019.a:0 "Spend local prosperity for public backing."
 tv_engineering_department.7019.b:0 "Let the month pass quietly."
 tv_engineering_department.7020.t:0 "[tv_wonder_construction|E]：Capital Works Are Reassigned for Public Backing"
 tv_engineering_department.7020.d:0 "Capital repairs and improvements are delayed so skilled hands and materials can serve the wonder. The [tv_engineering_department|E] uses that uncomfortable opening to secure fresh public patience and local signatures. In return, the works look less like an imposition; still, the capital will remember which promises were postponed."
 tv_engineering_department.7020.a:0 "Spend capital works for public backing."
 tv_engineering_department.7020.b:0 "Let the month pass quietly."
 tv_engineering_department.7021.t:0 "[tv_wonder_construction|E]：The Capital's Markets Are Turned for Public Backing"
 tv_engineering_department.7021.d:0 "Royal-city markets, credit, and storage are pulled toward the worksite. The [tv_engineering_department|E] uses that uncomfortable opening to secure fresh public patience and local signatures. In return, the works look less like an imposition; still, the capital's streets grow quieter in service of distant stone."
 tv_engineering_department.7021.a:0 "Spend capital trade for public backing."
 tv_engineering_department.7021.b:0 "Let the month pass quietly."
 tv_engineering_department.7022.t:0 "[tv_wonder_construction|E]：Labor Is Driven Harder for Public Backing"
 tv_engineering_department.7022.d:0 "Laborers are asked to stretch shifts, rest, and safety margins past comfort. The [tv_engineering_department|E] uses that uncomfortable opening to secure fresh public patience and local signatures. In return, the works look less like an imposition; still, tired bodies keep a stricter account than any clerk."
 tv_engineering_department.7022.a:0 "Spend the laborers for public backing."
 tv_engineering_department.7022.b:0 "Let the month pass quietly."
 tv_engineering_department.7023.t:0 "[tv_wonder_construction|E]：Treasury Doors Open for A Broader Design"
 tv_engineering_department.7023.d:0 "Treasury clerks unlock reserve coin meant for quieter obligations. The [tv_engineering_department|E] uses that uncomfortable opening to secure wider survey days and structural margin. In return, the monument's scale looks deliberate; still, the missing money will be noticed when the next account is opened."
 tv_engineering_department.7023.a:0 "Spend the treasury for scale."
 tv_engineering_department.7023.b:0 "Let the month pass quietly."
