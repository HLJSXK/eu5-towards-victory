 tv_engineering_department.7044.d:0 "Existing streets, workshops, and local improvements are cut open to give the monument room. The [tv_engineering_department|E] uses that uncomfortable opening to secure clearer rosters and stricter shifts. In return, orders cross the yard with fewer detours; still, the site is easier to build on because it has less of its old self left."
 tv_engineering_department.7044.a:0 "Spend the site for organization."
 tv_engineering_department.7044.b:0 "Let the month pass quietly."
