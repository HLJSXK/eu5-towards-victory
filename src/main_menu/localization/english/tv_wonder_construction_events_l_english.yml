 tv_engineering_department.7145.t:0 "[tv_wonder_construction|E]：A New Gap in the Treasury"
 tv_engineering_department.7145.d:0 "The wonder draws coin faster than the ledgers expected. The treasury can explain the shortage, but explanation does not mint silver."
 tv_engineering_department.7145.a:0 "Stretches the ledgers to cover the gap."
 tv_engineering_department.7146.t:0 "[tv_wonder_construction|E]：Dust on the Royal Seal"
 tv_engineering_department.7146.d:0 "Royal endorsement is stretched over too many compromises. The seal still holds, but it looks thinner."
 tv_engineering_department.7146.a:0 "Lets the royal seal wear a touch thinner."
 tv_engineering_department.7147.t:0 "[tv_wonder_construction|E]：Quiet Towns Are Disturbed"
 tv_engineering_department.7147.d:0 "The construction rhythm presses against ordinary life. Markets open late, villages grumble, and order gives a little ground."
 tv_engineering_department.7147.a:0 "We let the villages grumble and press on regardless."
 tv_engineering_department.7148.t:0 "[tv_wonder_construction|E]：The Court Loses Color"
 tv_engineering_department.7148.d:0 "The court lends color to the works and receives dust in return. Prestige fades in small public jokes and half-finished boasts."
 tv_engineering_department.7148.a:0 "Trades a little shine for a few court jokes."
 tv_engineering_department.7149.t:0 "[tv_wonder_construction|E]：Cold Words at Noble Tables"
 tv_engineering_department.7149.d:0 "Noble households give way once more. The concession is formal and cold, which is often worse than refusal."
 tv_engineering_department.7149.a:0 "Accepts the nobles' cold, formal concession."
 tv_engineering_department.7150.t:0 "[tv_wonder_construction|E]：Frowns Before the Altar"
 tv_engineering_department.7150.d:0 "The sacred calendar bends again for the worksite. The clergy obey, but the obedience has edges."
 tv_engineering_department.7150.a:0 "We accept the clergy's obedience, edges and all."
 tv_engineering_department.7151.t:0 "[tv_wonder_construction|E]：Thinner Ledgers in the Market"
 tv_engineering_department.7151.d:0 "Market business is bent around the project. The burghers can profit from grandeur, but not when every road to it is blocked."
 tv_engineering_department.7151.a:0 "Clear the roads and keep building!"
 tv_engineering_department.7152.t:0 "[tv_wonder_construction|E]：Heavier Backs in the Villages"
 tv_engineering_department.7152.d:0 "Rural shoulders take another load. The project advances, and village patience becomes a thinner thing."
 tv_engineering_department.7152.a:0 "Piles the extra load onto rural shoulders."
 tv_engineering_department.7153.t:0 "[tv_wonder_construction|E]：The Site Gives Up Its Streets"
 tv_engineering_department.7153.d:0 "The site gives up more of its ordinary fabric. A future wonder gains space, while present streets lose use."
 tv_engineering_department.7153.a:0 "Signs away these streets for tomorrow's wonder."
 tv_engineering_department.7154.t:0 "[tv_wonder_construction|E]：The Site Grows Quieter"
 tv_engineering_department.7154.d:0 "The site grows commercially quieter as ordinary exchange is pulled toward the monument. Prosperity can be redirected only so many times before it thins."
 tv_engineering_department.7154.a:0 "We steer the site's trade toward the monument once more."
 tv_engineering_department.7155.t:0 "[tv_wonder_construction|E]：Capital Projects Make Way"
 tv_engineering_department.7155.d:0 "Capital projects make way for the wonder again. The royal city remains grand, but some of its frame is being borrowed."
 tv_engineering_department.7155.a:0 "Lends the capital's own frame to the wonder."
 tv_engineering_department.7156.t:0 "[tv_wonder_construction|E]：Quieter Streets in the Capital"
 tv_engineering_department.7156.d:0 "The capital's markets lose a little brightness as the project draws in credit and goods. The court may call it patriotic; merchants call it slower trade."
 tv_engineering_department.7156.a:0 "Every monument borrows its brightness from somewhere."
 tv_engineering_department.7157.t:0 "[tv_wonder_construction|E]：Names Added to the Injury Roll"
 tv_engineering_department.7157.d:0 "Names are added to the injury rolls. The work continues, but each new mark changes how the laborers look at the stone."
 tv_engineering_department.7157.a:0 "Note the names, and carry on!"
 tv_engineering_department.7158.t:0 "[tv_wonder_construction|E]：Silence at the Treasury Door"
 tv_engineering_department.7158.d:0 "A hard demand from the site leaves the treasury visibly hollow. The monument continues, and the realm pays before it can admire anything."
 tv_engineering_department.7158.a:0 "Empties the treasury and lets the stone go up regardless."
 tv_engineering_department.7159.t:0 "[tv_wonder_construction|E]：Mandate Cracks Before the Site"
 tv_engineering_department.7159.d:0 "The worksite's demands force the crown into an undignified posture. The promise of grandeur now leans on damaged authority."
 tv_engineering_department.7159.a:0 "We let the crown bend so the walls can rise."
 tv_engineering_department.7160.t:0 "[tv_wonder_construction|E]：Order Splinters in the Levy"
 tv_engineering_department.7160.d:0 "A harsher disruption spills past the fence. Officials can name the cause, but they cannot make the country feel settled by naming it."
 tv_engineering_department.7160.a:0 "Lets the unrest run its course beyond the fence."
 tv_engineering_department.7161.t:0 "[tv_wonder_construction|E]：Honor Falters in Public"
 tv_engineering_department.7161.d:0 "A public embarrassment at the site travels faster than any official correction. Honor pays for stone that is not yet standing."
 tv_engineering_department.7161.a:0 "Let them talk!"
 tv_engineering_department.7162.t:0 "[tv_wonder_construction|E]：Noble Patience Is Chiseled Through"
 tv_engineering_department.7162.d:0 "The project cuts into noble patience until courtesy can no longer cover the sound. A monument is a poor guest when it eats inheritance."
 tv_engineering_department.7162.a:0 "Lets the nobles grumble while the masonry advances."
 tv_engineering_department.7163.t:0 "[tv_wonder_construction|E]：Patience Runs Out in the Vestry"
 tv_engineering_department.7163.d:0 "A construction demand tramples too near the altar. The clergy do not forget when piety is treated as open space."
 tv_engineering_department.7163.a:0 "We accept the clergy's cold silence as the price of stone."
 tv_engineering_department.7164.t:0 "[tv_wonder_construction|E]：Anger Reaches the Streets"
 tv_engineering_department.7164.d:0 "Anger reaches the shopfronts as the worksite swallows space, time, and credit. The city hears the monument before it sees it."
 tv_engineering_department.7164.a:0 "Lets the shopfronts grumble while the scaffolding climbs."
 tv_engineering_department.7165.t:0 "[tv_wonder_construction|E]：Rural Anger Will Not Stay Quiet"
 tv_engineering_department.7165.d:0 "Rural anger will not stay quiet after this levy. The wonder's shadow reaches farms that may never see its finished face."
 tv_engineering_department.7165.a:0 "Let the fields bear it!"
 tv_engineering_department.7166.t:0 "[tv_wonder_construction|E]：The Site Falls Back"
 tv_engineering_department.7166.d:0 "The works hollow the site hard enough to set it back. The monument has not yet risen, but the place around it has already paid."
 tv_engineering_department.7166.a:0 "Sets the site back so the monument can move forward."
 tv_engineering_department.7167.t:0 "[tv_wonder_construction|E]：The Site's Prosperity Is Smothered"
 tv_engineering_department.7167.d:0 "The worksite smothers the local market for a time. Carts still arrive, but fewer of them are serving the town around the stone."
 tv_engineering_department.7167.a:0 "Lets the local market thin out while the works carry on."
 tv_engineering_department.7168.t:0 "[tv_wonder_construction|E]：The Capital Pays in Stone"
 tv_engineering_department.7168.d:0 "The capital pays in stone, labor, and delayed repairs. A distant monument becomes more real while nearby plans grow hollow."
 tv_engineering_department.7168.a:0 "We let the capital's own repairs wait for the distant wonder."
 tv_engineering_department.7169.t:0 "[tv_wonder_construction|E]：The Royal City's Trade Is Pressed Low"
 tv_engineering_department.7169.d:0 "The royal city's trade is pressed low by the works. Grandeur far away dulls the streets that must finance it."
 tv_engineering_department.7169.a:0 "Dulls the royal city's streets to fund grandeur elsewhere."
 tv_engineering_department.7170.t:0 "[tv_wonder_construction|E]：Sweat Crosses Into Blood"
 tv_engineering_department.7170.d:0 "Sweat crosses into blood at the site. The monument is not cancelled, which may be the cruelest part of the lesson."
 tv_engineering_department.7170.a:0 "We press on, though the site has paid in blood."
 tv_engineering_department.7171.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Wins the Street"
 tv_engineering_department.7171.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] turns a technical tour into a public triumph. The result is a major improvement in [tv_wonder_domestic_support|E].\n\n#G This event occurred because the current [tv_great_engineer|E] has effective military ability above 80.#!"
 tv_engineering_department.7171.a:0 "Turns a routine inspection into a public triumph."
 tv_engineering_department.7172.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Redraws the Grand Line"
 tv_engineering_department.7172.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] redraws the main axis with a confidence that makes the larger plan credible. The result is a major improvement in [tv_wonder_scale_competence|E].\n\n#G This event occurred because the current [tv_great_engineer|E] has effective military ability above 80.#!"
 tv_engineering_department.7172.a:0 "Makes the grand axis look inevitable, not reckless."
 tv_engineering_department.7173.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Rebuilds the Schedule"
 tv_engineering_department.7173.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] rebuilds the schedule so cleanly that even rival foremen obey it. The result is a major improvement in [tv_wonder_organization_competence|E].\n\n#G This event occurred because the current [tv_great_engineer|E] has effective military ability above 80.#!"
 tv_engineering_department.7173.a:0 "We fall in line behind the new schedule."
 tv_engineering_department.7174.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Opens the Road"
 tv_engineering_department.7174.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] opens a supply route that makes the old delays look almost foolish. The result is a major improvement in [tv_wonder_logistics_competence|E].\n\n#G This event occurred because the current [tv_great_engineer|E] has effective military ability above 80.#!"
 tv_engineering_department.7174.a:0 "The road is open at last!"
 tv_engineering_department.7175.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Drives the Main Works"
 tv_engineering_department.7175.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] drives the main works through a problem that had stalled lesser hands. The result is a major improvement in [tv_wonder_construction|E] progress.\n\n#G This event occurred because the current [tv_great_engineer|E] has effective military ability above 80.#!"
 tv_engineering_department.7175.a:0 "Drives the stalled works clean through."
 tv_engineering_department.7176.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Calms the Rumor"
 tv_engineering_department.7176.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] answers rumors with enough plain explanation to steady public confidence. The project gains a steadier improvement in [tv_wonder_domestic_support|E].\n\n#G This event occurred because the current [tv_great_engineer|E] has effective military ability above 50.#!"
 tv_engineering_department.7176.a:0 "Quiets the rumors with plain talk."
 tv_engineering_department.7177.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Sets the Measure"
 tv_engineering_department.7177.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] finds enough margin in the site to spare the project from a timid design. The project gains a steadier improvement in [tv_wonder_scale_competence|E].\n\n#G This event occurred because the current [tv_great_engineer|E] has effective military ability above 50.#!"
 tv_engineering_department.7177.a:0 "We give the plan room enough to be bold."
 tv_engineering_department.7178.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Straightens the Rolls"
 tv_engineering_department.7178.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] straightens a stubborn mess of crews, tools, and watches. The project gains a steadier improvement in [tv_wonder_organization_competence|E].\n\n#G This event occurred because the current [tv_great_engineer|E] has effective military ability above 50.#!"
 tv_engineering_department.7178.a:0 "Sets the crews, tools, and watches back in order."
 tv_engineering_department.7179.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Clears the Convoy"
 tv_engineering_department.7179.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] clears the worst knot in the convoy schedule. The project gains a steadier improvement in [tv_wonder_logistics_competence|E].\n\n#G This event occurred because the current [tv_great_engineer|E] has effective military ability above 50.#!"
 tv_engineering_department.7179.a:0 "Clears the worst knot in the supply line."
 tv_engineering_department.7180.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Fits the Critical Joint"
 tv_engineering_department.7180.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] fits the critical piece and lets the next stage begin sooner. The project gains a steadier improvement in [tv_wonder_construction|E] progress.\n\n#G This event occurred because the current [tv_great_engineer|E] has effective military ability above 50.#!"
 tv_engineering_department.7180.a:0 "Full speed ahead!"
 tv_engineering_department.7181.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Courts the Crowd"
 tv_engineering_department.7181.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] places the unfinished works before the crowd and trusts the spectacle. The decision may lift [tv_wonder_domestic_support|E] or cost the site dearly.\n\n#Y This event occurred because the current [tv_great_engineer|E] has effective military ability between 20 and 80.#!"
 tv_engineering_department.7181.a:0 "Lets the crowd pass judgment on the unfinished stones."
 tv_engineering_department.7182.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Enlarges the Plan"
 tv_engineering_department.7182.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] orders the plan enlarged before all doubts have been paid for. The decision may lift [tv_wonder_scale_competence|E] or cost the site dearly.\n\n#Y This event occurred because the current [tv_great_engineer|E] has effective military ability between 20 and 80.#!"
 tv_engineering_department.7182.a:0 "Orders the blueprint enlarged before the doubts are settled."
 tv_engineering_department.7183.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Rewrites the Shift"
 tv_engineering_department.7183.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] rewrites the shifts in a single afternoon and dares the yard to keep up. The decision may lift [tv_wonder_organization_competence|E] or cost the site dearly.\n\n#Y This event occurred because the current [tv_great_engineer|E] has effective military ability between 20 and 80.#!"
 tv_engineering_department.7183.a:0 "We rewrite the shifts and dare the yard to keep up."
 tv_engineering_department.7184.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Takes the Risky Road"
 tv_engineering_department.7184.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] sends the carts by a difficult road and trusts calculation over habit. The decision may lift [tv_wonder_logistics_competence|E] or cost the site dearly.\n\n#Y This event occurred because the current [tv_great_engineer|E] has effective military ability between 20 and 80.#!"
 tv_engineering_department.7184.a:0 "Sends the carts down the harder road, trusting calculation over habit."
 tv_engineering_department.7185.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Tests a Faster Method"
 tv_engineering_department.7185.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] tests a quicker method where failure would be very public. The decision may lift [tv_wonder_construction|E] progress or cost the site dearly.\n\n#Y This event occurred because the current [tv_great_engineer|E] has effective military ability between 20 and 80.#!"
 tv_engineering_department.7185.a:0 "Try the faster method - let it prove itself in public!"
 tv_engineering_department.7186.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Miscounts the Coin"
 tv_engineering_department.7186.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] misjudges the cost of a fix and leaves the treasury to cover the elegance. The works continue, but [gold|E] suffers for the oversight.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 50.#!"
 tv_engineering_department.7186.a:0 "Quietly settles the shortfall before the account is questioned."
 tv_engineering_department.7187.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Forgets the Court"
 tv_engineering_department.7187.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] forgets that royal authority is a material too, and spends it carelessly. The works continue, but [legitimacy|E] suffers for the oversight.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 50.#!"
 tv_engineering_department.7187.a:0 "We rein in the careless use of the crown's name."
 tv_engineering_department.7188.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Misreads the Villages"
 tv_engineering_department.7188.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] underestimates how much disturbance a neat engineering answer can cause. The works continue, but [stability|E] suffers for the oversight.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 50.#!"
 tv_engineering_department.7188.a:0 "Smooths over the disturbance the tidy solution left behind."
 tv_engineering_department.7189.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Speaks Too Soon"
 tv_engineering_department.7189.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] speaks too confidently before the work can support the boast. The works continue, but [prestige|E] suffers for the oversight.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 50.#!"
 tv_engineering_department.7189.a:0 "Walk the boast back!"
 tv_engineering_department.7190.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Slights the Nobles"
 tv_engineering_department.7190.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] treats noble patience as if it were another supply stockpile. The works continue, but [estate_satisfaction|E] among the nobles suffers for the oversight.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 50.#!"
 tv_engineering_department.7190.a:0 "Reminds the engineer that noble patience is not a stockpile to draw from."
 tv_engineering_department.7191.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Disturbs the Calendar"
 tv_engineering_department.7191.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] moves through the religious calendar as if it were a delivery table. The works continue, but [estate_satisfaction|E] among the clergy suffers for the oversight.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 50.#!"
 tv_engineering_department.7191.a:0 "Lets the altars keep their own calendar after all."
 tv_engineering_department.7192.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Blocks the Market"
 tv_engineering_department.7192.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] blocks ordinary trade while chasing a cleaner line for the site. The works continue, but [estate_satisfaction|E] among the burghers suffers for the oversight.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 50.#!"
 tv_engineering_department.7192.a:0 "We reopen the market lane the site had closed off."
 tv_engineering_department.7193.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Underestimates the Villages"
 tv_engineering_department.7193.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] mistakes exhausted villages for an unused reserve. The works continue, but [estate_satisfaction|E] among the peasants suffers for the oversight.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 50.#!"
 tv_engineering_department.7193.a:0 "Lets the exhausted villages rest instead of being drawn on again."
 tv_engineering_department.7194.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Cuts the Wrong Streets"
 tv_engineering_department.7194.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] cuts through the wrong local arrangements and calls the gap useful. The works continue, but [development|E] at the site suffers for the oversight.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 50.#!"
 tv_engineering_department.7194.a:0 "Patches over the arrangements that were cut through by mistake."
 tv_engineering_department.7195.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Crowds the Site's Livelihoods"
 tv_engineering_department.7195.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] crowds out local livelihoods while clearing space for the works. The works continue, but [prosperity|E] at the site suffers for the oversight.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 50.#!"
 tv_engineering_department.7195.a:0 "We make room again for the livelihoods the clearing crowded out."
 tv_engineering_department.7196.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Misuses the Capital"
 tv_engineering_department.7196.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] misuses capital resources as though the royal city had no plans of its own. The works continue, but [development|E] in the capital suffers for the oversight.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 50.#!"
 tv_engineering_department.7196.a:0 "Returns the misused resources to the capital's own plans."
 tv_engineering_department.7197.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Disturbs the Royal City"
 tv_engineering_department.7197.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] disturbs the royal city's trade while solving a local engineering problem. The works continue, but [prosperity|E] in the capital suffers for the oversight.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 50.#!"
 tv_engineering_department.7197.a:0 "We calm the royal city's trade before the disruption spreads."
 tv_engineering_department.7198.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Misjudges the Labor Limit"
 tv_engineering_department.7198.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] misjudges the limit of laboring bodies. The works continue, but laboring [population|E] at the site suffers for the oversight.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 50.#!"
 tv_engineering_department.7198.a:0 "Ease the strain before more give out!"
 tv_engineering_department.7199.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Breaks the Ledger"
 tv_engineering_department.7199.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] lets an avoidable mistake break through the accounts and empty more coin than pride can excuse. The error is not enough to end the wonder, which may be the ugliest part of it.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 20.#!"
 tv_engineering_department.7199.a:0 "Chalks up the loss and quietly shuts the ledger."
 tv_engineering_department.7200.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Wounds the Crown"
 tv_engineering_department.7200.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] turns a preventable site failure into a visible wound to the crown. The error is not enough to end the wonder, which may be the ugliest part of it.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 20.#!"
 tv_engineering_department.7200.a:0 "We wear the crown's new scar and carry on."
 tv_engineering_department.7201.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Unsettles the Country"
 tv_engineering_department.7201.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] pushes the country into disorder while trying to solve a site problem. The error is not enough to end the wonder, which may be the ugliest part of it.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 20.#!"
 tv_engineering_department.7201.a:0 "Leaves the disorder to burn itself out."
 tv_engineering_department.7202.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Makes a Spectacle"
 tv_engineering_department.7202.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] makes the site a spectacle and drags courtly honor into it. The error is not enough to end the wonder, which may be the ugliest part of it.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 20.#!"
 tv_engineering_department.7202.a:0 "Let the court have its spectacle!"
 tv_engineering_department.7203.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Angers the Houses"
 tv_engineering_department.7203.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] angers the houses by solving a site problem through their privileges. The error is not enough to end the wonder, which may be the ugliest part of it.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 20.#!"
 tv_engineering_department.7203.a:0 "Spends the houses' goodwill to keep the work moving."
 tv_engineering_department.7204.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Offends the Clergy"
 tv_engineering_department.7204.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] offends the clergy by making sacred patience pay for secular stone. The error is not enough to end the wonder, which may be the ugliest part of it.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 20.#!"
 tv_engineering_department.7204.a:0 "We let sacred patience foot the bill for secular stone."
 tv_engineering_department.7205.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Provokes the Burghers"
 tv_engineering_department.7205.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] provokes the burghers by treating commerce as loose scaffolding. The error is not enough to end the wonder, which may be the ugliest part of it.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 20.#!"
 tv_engineering_department.7205.a:0 "Leaves the merchants to mend their own scaffolding."
 tv_engineering_department.7206.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Breaks the Villages"
 tv_engineering_department.7206.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] breaks village patience with a demand that should have been avoided. The error is not enough to end the wonder, which may be the ugliest part of it.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 20.#!"
 tv_engineering_department.7206.a:0 "We ask the villages' pardon for a demand we could have spared them."
 tv_engineering_department.7207.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Injures the Site"
 tv_engineering_department.7207.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] injures the site by solving a technical problem with local destruction. The error is not enough to end the wonder, which may be the ugliest part of it.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 20.#!"
 tv_engineering_department.7207.a:0 "Patches the wound the repairs themselves caused."
 tv_engineering_department.7208.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Snuffs Out the Site's Markets"
 tv_engineering_department.7208.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] snuffs out the site's markets through a preventable decision. The error is not enough to end the wonder, which may be the ugliest part of it.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 20.#!"
 tv_engineering_department.7208.a:0 "So be it—let the stalls fall silent!"
 tv_engineering_department.7209.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Hollows the Capital's Plans"
 tv_engineering_department.7209.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] hollows the capital's plans to cover a mistake at the site. The error is not enough to end the wonder, which may be the ugliest part of it.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 20.#!"
 tv_engineering_department.7209.a:0 "Guts the capital's own plans to patch the site's mistake."
 tv_engineering_department.7210.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Dims the Capital's Prosperity"
 tv_engineering_department.7210.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] dims capital prosperity through a failure that should never have reached the market. The error is not enough to end the wonder, which may be the ugliest part of it.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 20.#!"
 tv_engineering_department.7210.a:0 "We watch the capital's shine dim over a failure it never should have seen."
 tv_engineering_department.7211.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Causes Casualties"
 tv_engineering_department.7211.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] causes casualties by letting a preventable failure pass through the crews. The error is not enough to end the wonder, which may be the ugliest part of it.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 20.#!"
 tv_engineering_department.7211.a:0 "Counts the dead the crews should never have lost."
