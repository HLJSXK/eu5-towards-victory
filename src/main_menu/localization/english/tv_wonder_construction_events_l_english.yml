 tv_engineering_department.7174.t:0 "Wonder Construction: treasury funds Strain"
 tv_engineering_department.7174.d:0 "The wonder has leaned harder on the country than expected. The cost appears first as pressure on treasury funds, then as whispers that every magnificent monument casts a practical shadow. The works continue, but the realm has been reminded that grandeur never sends only one bill."
 tv_engineering_department.7174.a:0 "The country will bear it."
