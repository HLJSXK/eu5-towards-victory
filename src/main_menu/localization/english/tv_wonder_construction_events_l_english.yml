 tv_engineering_department.7145.t:0 "[tv_wonder_construction|E]：A New Gap in the Treasury"
 tv_engineering_department.7145.d:0 "The wonder draws coin faster than the ledgers expected. The treasury can explain the shortage, but explanation does not mint silver."
 tv_engineering_department.7145.a:0 "Absorb the strain."
 tv_engineering_department.7146.t:0 "[tv_wonder_construction|E]：Dust on the Royal Seal"
 tv_engineering_department.7146.d:0 "Royal endorsement is stretched over too many compromises. The seal still holds, but it looks thinner."
 tv_engineering_department.7146.a:0 "Absorb the strain."
 tv_engineering_department.7147.t:0 "[tv_wonder_construction|E]：Quiet Towns Are Disturbed"
 tv_engineering_department.7147.d:0 "The construction rhythm presses against ordinary life. Markets open late, villages grumble, and order gives a little ground."
 tv_engineering_department.7147.a:0 "Absorb the strain."
 tv_engineering_department.7148.t:0 "[tv_wonder_construction|E]：The Court Loses Color"
 tv_engineering_department.7148.d:0 "The court lends color to the works and receives dust in return. Prestige fades in small public jokes and half-finished boasts."
 tv_engineering_department.7148.a:0 "Absorb the strain."
 tv_engineering_department.7149.t:0 "[tv_wonder_construction|E]：Cold Words at Noble Tables"
 tv_engineering_department.7149.d:0 "Noble households give way once more. The concession is formal and cold, which is often worse than refusal."
 tv_engineering_department.7149.a:0 "Absorb the strain."
 tv_engineering_department.7150.t:0 "[tv_wonder_construction|E]：Frowns Before the Altar"
 tv_engineering_department.7150.d:0 "The sacred calendar bends again for the worksite. The clergy obey, but the obedience has edges."
 tv_engineering_department.7150.a:0 "Absorb the strain."
 tv_engineering_department.7151.t:0 "[tv_wonder_construction|E]：Thinner Ledgers in the Market"
 tv_engineering_department.7151.d:0 "Market business is bent around the project. The burghers can profit from grandeur, but not when every road to it is blocked."
 tv_engineering_department.7151.a:0 "Absorb the strain."
 tv_engineering_department.7152.t:0 "[tv_wonder_construction|E]：Heavier Backs in the Villages"
 tv_engineering_department.7152.d:0 "Rural shoulders take another load. The project advances, and village patience becomes a thinner thing."
 tv_engineering_department.7152.a:0 "Absorb the strain."
 tv_engineering_department.7153.t:0 "[tv_wonder_construction|E]：The Site Gives Up Its Streets"
 tv_engineering_department.7153.d:0 "The site gives up more of its ordinary fabric. A future wonder gains space, while present streets lose use."
 tv_engineering_department.7153.a:0 "Absorb the strain."
 tv_engineering_department.7154.t:0 "[tv_wonder_construction|E]：The Site Grows Quieter"
 tv_engineering_department.7154.d:0 "The site grows commercially quieter as ordinary exchange is pulled toward the monument. Prosperity can be redirected only so many times before it thins."
 tv_engineering_department.7154.a:0 "Absorb the strain."
 tv_engineering_department.7155.t:0 "[tv_wonder_construction|E]：Capital Projects Make Way"
 tv_engineering_department.7155.d:0 "Capital projects make way for the wonder again. The royal city remains grand, but some of its frame is being borrowed."
 tv_engineering_department.7155.a:0 "Absorb the strain."
 tv_engineering_department.7156.t:0 "[tv_wonder_construction|E]：Quieter Streets in the Capital"
 tv_engineering_department.7156.d:0 "The capital's markets lose a little brightness as the project draws in credit and goods. The court may call it patriotic; merchants call it slower trade."
 tv_engineering_department.7156.a:0 "Absorb the strain."
 tv_engineering_department.7157.t:0 "[tv_wonder_construction|E]：Names Added to the Injury Roll"
 tv_engineering_department.7157.d:0 "Names are added to the injury rolls. The work continues, but each new mark changes how the laborers look at the stone."
 tv_engineering_department.7157.a:0 "Absorb the strain."
 tv_engineering_department.7158.t:0 "[tv_wonder_construction|E]：Silence at the Treasury Door"
 tv_engineering_department.7158.d:0 "A hard demand from the site leaves the treasury visibly hollow. The monument continues, and the realm pays before it can admire anything."
 tv_engineering_department.7158.a:0 "This will be remembered."
 tv_engineering_department.7159.t:0 "[tv_wonder_construction|E]：Mandate Cracks Before the Site"
 tv_engineering_department.7159.d:0 "The worksite's demands force the crown into an undignified posture. The promise of grandeur now leans on damaged authority."
 tv_engineering_department.7159.a:0 "This will be remembered."
 tv_engineering_department.7160.t:0 "[tv_wonder_construction|E]：Order Splinters in the Levy"
 tv_engineering_department.7160.d:0 "A harsher disruption spills past the fence. Officials can name the cause, but they cannot make the country feel settled by naming it."
 tv_engineering_department.7160.a:0 "This will be remembered."
 tv_engineering_department.7161.t:0 "[tv_wonder_construction|E]：Honor Falters in Public"
 tv_engineering_department.7161.d:0 "A public embarrassment at the site travels faster than any official correction. Honor pays for stone that is not yet standing."
 tv_engineering_department.7161.a:0 "This will be remembered."
 tv_engineering_department.7162.t:0 "[tv_wonder_construction|E]：Noble Patience Is Chiseled Through"
 tv_engineering_department.7162.d:0 "The project cuts into noble patience until courtesy can no longer cover the sound. A monument is a poor guest when it eats inheritance."
 tv_engineering_department.7162.a:0 "This will be remembered."
 tv_engineering_department.7163.t:0 "[tv_wonder_construction|E]：Patience Runs Out in the Vestry"
 tv_engineering_department.7163.d:0 "A construction demand tramples too near the altar. The clergy do not forget when piety is treated as open space."
 tv_engineering_department.7163.a:0 "This will be remembered."
 tv_engineering_department.7164.t:0 "[tv_wonder_construction|E]：Anger Reaches the Streets"
 tv_engineering_department.7164.d:0 "Anger reaches the shopfronts as the worksite swallows space, time, and credit. The city hears the monument before it sees it."
 tv_engineering_department.7164.a:0 "This will be remembered."
 tv_engineering_department.7165.t:0 "[tv_wonder_construction|E]：Rural Anger Will Not Stay Quiet"
 tv_engineering_department.7165.d:0 "Rural anger will not stay quiet after this levy. The wonder's shadow reaches farms that may never see its finished face."
 tv_engineering_department.7165.a:0 "This will be remembered."
 tv_engineering_department.7166.t:0 "[tv_wonder_construction|E]：The Site Falls Back"
 tv_engineering_department.7166.d:0 "The works hollow the site hard enough to set it back. The monument has not yet risen, but the place around it has already paid."
 tv_engineering_department.7166.a:0 "This will be remembered."
 tv_engineering_department.7167.t:0 "[tv_wonder_construction|E]：The Site's Prosperity Is Smothered"
 tv_engineering_department.7167.d:0 "The worksite smothers the local market for a time. Carts still arrive, but fewer of them are serving the town around the stone."
 tv_engineering_department.7167.a:0 "This will be remembered."
 tv_engineering_department.7168.t:0 "[tv_wonder_construction|E]：The Capital Pays in Stone"
 tv_engineering_department.7168.d:0 "The capital pays in stone, labor, and delayed repairs. A distant monument becomes more real while nearby plans grow hollow."
 tv_engineering_department.7168.a:0 "This will be remembered."
 tv_engineering_department.7169.t:0 "[tv_wonder_construction|E]：The Royal City's Trade Is Pressed Low"
 tv_engineering_department.7169.d:0 "The royal city's trade is pressed low by the works. Grandeur far away dulls the streets that must finance it."
 tv_engineering_department.7169.a:0 "This will be remembered."
 tv_engineering_department.7170.t:0 "[tv_wonder_construction|E]：Sweat Crosses Into Blood"
 tv_engineering_department.7170.d:0 "Sweat crosses into blood at the site. The monument is not cancelled, which may be the cruelest part of the lesson."
 tv_engineering_department.7170.a:0 "This will be remembered."
 tv_engineering_department.7171.t:0 "[tv_wonder_construction|E]：[tv_great_engineer|E] Wins the Street"
 tv_engineering_department.7171.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] turns a technical tour into a public triumph. The result is a major improvement in [tv_wonder_domestic_support|E].\n\n#G This event occurred because the current [tv_great_engineer|E] has effective military ability above 80.#!"
 tv_engineering_department.7171.a:0 "Brilliant work."
