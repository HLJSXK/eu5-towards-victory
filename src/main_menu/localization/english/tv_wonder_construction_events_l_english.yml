 tv_engineering_department.7000.t:0 "[tv_wonder_construction|E]：The Streets Applaud the Site"
 tv_engineering_department.7000.d:0 "A few visible successes at the fence turn curiosity into pride. Guild elders lend names, neighbors stop treating the works as a royal vanity, and the project gains a sharper claim on [tv_wonder_domestic_support|E]."
 tv_engineering_department.7000.a:0 "Lets the guild elders' new goodwill carry the work forward."
 tv_engineering_department.7001.t:0 "[tv_wonder_construction|E]：A Wider Line on the Earth"
 tv_engineering_department.7001.d:0 "New measurements reveal ground that can bear a broader footprint. What had looked like ambition on parchment now has a tolerable foundation, and [tv_wonder_scale_competence|E] jumps forward."
 tv_engineering_department.7001.a:0 "Lays claim to the broader ground the survey just proved."
 tv_engineering_department.7002.t:0 "[tv_wonder_construction|E]：Names and Orders Fall Into Place"
 tv_engineering_department.7002.d:0 "The yard wakes under new rosters. Crews know where to stand, clerks know which tally matters, and [tv_wonder_organization_competence|E] rises because confusion has fewer places to hide."
 tv_engineering_department.7002.a:0 "We lock the new rosters in before confusion finds its way back."
 tv_engineering_department.7003.t:0 "[tv_wonder_construction|E]：Roads and Carts Find Their Rhythm"
 tv_engineering_department.7003.d:0 "A better route links road, water, storeyard, and scaffold. The first convoy to use it arrives almost embarrassingly on time, and [tv_wonder_logistics_competence|E] surges."
 tv_engineering_department.7003.a:0 "Keep those carts rolling on time!"
 tv_engineering_department.7004.t:0 "[tv_wonder_construction|E]：Stone Rises Past the Mark"
 tv_engineering_department.7004.d:0 "The active part rises past its mark before the light fails. No single miracle explains it; the lifts, joints, and hands simply meet at the right hour, pushing [tv_wonder_construction|E] progress ahead."
 tv_engineering_department.7004.a:0 "Lets the lifts press on past the mark."
 tv_engineering_department.7005.t:0 "[tv_wonder_construction|E]：Street Talk Turns"
 tv_engineering_department.7005.d:0 "The noise around the site softens. It is not acclaim, but it is permission enough for carts to pass and arguments to end sooner; [tv_wonder_domestic_support|E] rises by a useful margin."
 tv_engineering_department.7005.a:0 "Lets the carts through and the arguments die down."
 tv_engineering_department.7006.t:0 "[tv_wonder_construction|E]：The Measure Is Corrected"
 tv_engineering_department.7006.d:0 "A cramped angle is redrawn, a service path widened, and the main line of the monument breathes again. The improvement to [tv_wonder_scale_competence|E] is small but real."
 tv_engineering_department.7006.a:0 "Widens the path and lets the design breathe."
 tv_engineering_department.7007.t:0 "[tv_wonder_construction|E]：The Yard Learns Its Rhythm"
 tv_engineering_department.7007.d:0 "A set of missing handovers is repaired. The work is too dry for ceremony, but it keeps tools moving and improves [tv_wonder_organization_competence|E]."
 tv_engineering_department.7007.a:0 "We patch the handover and keep the tools moving."
 tv_engineering_department.7008.t:0 "[tv_wonder_construction|E]：Ruts Find a Better Road"
 tv_engineering_department.7008.d:0 "One bad turn in the supply line is corrected. Fewer carts wait empty, fewer loads arrive cracked, and [tv_wonder_logistics_competence|E] improves."
 tv_engineering_department.7008.a:0 "Straightens the bad turn before more loads crack."
 tv_engineering_department.7009.t:0 "[tv_wonder_construction|E]：Hammers Draw Completion Near"
 tv_engineering_department.7009.d:0 "A stubborn joint finally fits, and the next crew can begin without another month of waiting. [tv_wonder_construction|E] progress moves forward in the most satisfying way: visibly."
 tv_engineering_department.7009.a:0 "At last, it fits!"
 tv_engineering_department.7010.t:0 "[tv_wonder_construction|E]：Treasury Doors Open for Public Backing"
 tv_engineering_department.7010.d:0 "Somewhere in the ledgers, a clerk finds a line that can be crossed out without anyone asking twice: [gold|E] bends a little so that [tv_wonder_domestic_support|E] can move forward. It is the kind of arithmetic that works today and gets reread, unkindly, next season."
 tv_engineering_department.7010.a:0 "We accept the trade."
 tv_engineering_department.7010.b:0 "We'll wait this one out."
 tv_engineering_department.7011.t:0 "[tv_wonder_construction|E]：Royal Authority Is Pledged for Public Backing"
 tv_engineering_department.7011.d:0 "Like drawing water from one field to save another, the foremen suggest letting [legitimacy|E] run a little dry so that [tv_wonder_domestic_support|E] can be irrigated properly. Nobody upstream will thank them for it, but the crop of progress comes in regardless."
 tv_engineering_department.7011.a:0 "We'll make it count."
 tv_engineering_department.7011.b:0 "We decline for now."
 tv_engineering_department.7012.t:0 "[tv_wonder_construction|E]：Villages Give Way for Public Backing"
 tv_engineering_department.7012.d:0 "The [tv_engineering_department|E] asks, in effect, to borrow against [stability|E]: spend it down now, promise nothing about paying it back, and let the difference show up as hard movement on [tv_wonder_domestic_support|E]. Debts like this rarely stay quiet forever."
 tv_engineering_department.7012.a:0 "We take the deal."
 tv_engineering_department.7012.b:0 "We keep our reserves untouched."
 tv_engineering_department.7013.t:0 "[tv_wonder_construction|E]：Reputation Is Spent for Public Backing"
 tv_engineering_department.7013.d:0 "Someone has to sit on the heavier side of the scale, and this month it is [prestige|E]. Let it settle a little lower, and [tv_wonder_domestic_support|E] rises to match, though the balance rarely stays where you last left it."
 tv_engineering_department.7013.a:0 "Do it!"
 tv_engineering_department.7013.b:0 "Not this month!"
 tv_engineering_department.7014.t:0 "[tv_wonder_construction|E]：Noble Patience Is Borrowed for Public Backing"
 tv_engineering_department.7014.d:0 "The foremen put it plainly: give up a slice of [estate_satisfaction|E] among the nobles this month, and they will turn it directly into [tv_wonder_domestic_support|E]. No one pretends it is a generous exchange, only a workable one."
 tv_engineering_department.7014.a:0 "Make the trade!"
 tv_engineering_department.7014.b:0 "Better safe than sorry."
 tv_engineering_department.7015.t:0 "[tv_wonder_construction|E]：The Altars Are Asked to Yield for Public Backing"
 tv_engineering_department.7015.d:0 "Stores meant to last the season get opened early. What leaves as [estate_satisfaction|E] among the clergy does not vanish so much as change shape, arriving on the far side of the ledger as fresh [tv_wonder_domestic_support|E]. Whether that shape is worth the emptied shelf is a question for later."
 tv_engineering_department.7015.a:0 "Nothing ventured, nothing gained."
 tv_engineering_department.7015.b:0 "Lets the month pass quietly."
 tv_engineering_department.7016.t:0 "[tv_wonder_construction|E]：The Market Lends Its Streets for Public Backing"
 tv_engineering_department.7016.d:0 "It amounts to a wager: stake [estate_satisfaction|E] among the burghers on the table and see it returned, transformed, as movement on [tv_wonder_domestic_support|E]. The house — in this case, the works themselves — tends to collect on such bets one way or another."
 tv_engineering_department.7016.a:0 "Puts the cost to good use."
 tv_engineering_department.7016.b:0 "Leaves the offer on the table."
 tv_engineering_department.7017.t:0 "[tv_wonder_construction|E]：Village Shoulders Are Borrowed for Public Backing"
 tv_engineering_department.7017.d:0 "There is no clean way to say it: [estate_satisfaction|E] among the peasants must give a little ground this month if [tv_wonder_domestic_support|E] is to move at all. The engineers accept the trade without much ceremony, aware that ground given rarely returns on its own."
 tv_engineering_department.7017.a:0 "Turns the sacrifice into progress."
 tv_engineering_department.7017.b:0 "Holds off for now."
 tv_engineering_department.7018.t:0 "[tv_wonder_construction|E]：The Site Gives Stone and Space for Public Backing"
 tv_engineering_department.7018.d:0 "Building anything worth having means burning something else to light the way. This time the fuel is [development|E] at the site, and the light it throws falls squarely on [tv_wonder_domestic_support|E] — bright enough to notice, costly enough to remember."
 tv_engineering_department.7018.a:0 "Makes the trade without hesitation."
 tv_engineering_department.7018.b:0 "Passes on the bargain."
 tv_engineering_department.7019.t:0 "[tv_wonder_construction|E]：Local Trade Is Bent Toward the Works for Public Backing"
 tv_engineering_department.7019.d:0 "Someone will have to call in a favor, and this time the favor is paid out of [prosperity|E] at the site. It buys the works an unmistakable step forward in [tv_wonder_domestic_support|E], but favors spent do not refill themselves."
 tv_engineering_department.7019.a:0 "Accepts the bargain."
 tv_engineering_department.7019.b:0 "We'll wait this one out."
 tv_engineering_department.7020.t:0 "[tv_wonder_construction|E]：Capital Works Are Reassigned for Public Backing"
 tv_engineering_department.7020.d:0 "Somewhere in the ledgers, a clerk finds a line that can be crossed out without anyone asking twice: [development|E] in the capital bends a little so that [tv_wonder_domestic_support|E] can move forward. It is the kind of arithmetic that works today and gets reread, unkindly, next season."
 tv_engineering_department.7020.a:0 "Cashes in the opportunity."
 tv_engineering_department.7020.b:0 "We decline for now."
 tv_engineering_department.7021.t:0 "[tv_wonder_construction|E]：The Capital's Markets Are Turned for Public Backing"
 tv_engineering_department.7021.d:0 "Like drawing water from one field to save another, the foremen suggest letting [prosperity|E] in the capital run a little dry so that [tv_wonder_domestic_support|E] can be irrigated properly. Nobody upstream will thank them for it, but the crop of progress comes in regardless."
 tv_engineering_department.7021.a:0 "Signs off on the exchange."
 tv_engineering_department.7021.b:0 "We keep our reserves untouched."
 tv_engineering_department.7022.t:0 "[tv_wonder_construction|E]：Labor Is Driven Harder for Public Backing"
 tv_engineering_department.7022.d:0 "The [tv_engineering_department|E] asks, in effect, to borrow against the laboring [population|E] at the site: spend it down now, promise nothing about paying it back, and let the difference show up as hard movement on [tv_wonder_domestic_support|E]. Debts like this rarely stay quiet forever."
 tv_engineering_department.7022.a:0 "We'll pay the price."
 tv_engineering_department.7022.b:0 "Not this month!"
