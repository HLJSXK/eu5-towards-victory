 tv_engineering_department.7173.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] rebuilds the schedule so cleanly that even rival foremen obey it. The result is a major improvement in [tv_wonder_organization_competence|E].\n\n#G This event occurred because the current [tv_great_engineer|E] has effective military ability above 80.#!"
