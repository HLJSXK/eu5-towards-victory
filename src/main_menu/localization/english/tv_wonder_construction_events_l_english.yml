 tv_engineering_department.7089.d:0 "There is no way to absorb this loss cleanly. Either [tv_wonder_domestic_support|E] takes the weight and holds its ground, or the strain lands on [prosperity|E] at the site instead. Someone always pays, one way or another."
 tv_engineering_department.7089.a:0 "Absorbs the blow rather than pass it on."
 tv_engineering_department.7089.b:0 "We'll let the rest absorb this one."
