 tv_engineering_department.7187.t:0 "Wonder Construction: treasury funds Crisis"
 tv_engineering_department.7187.d:0 "A harsher disruption has spilled out from the construction site and struck treasury funds. Officials can explain the sequence, but explanations do not repair the damage. For now the wonder remains standing only in promise, while the country pays for the promise in advance."
