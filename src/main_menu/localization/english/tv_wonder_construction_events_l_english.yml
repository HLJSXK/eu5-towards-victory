 tv_engineering_department.7096.t:0 "Wonder Construction: Domestic support or treasury funds"
 tv_engineering_department.7096.d:0 "The month has presented the builders with an unpleasant accounting choice. Either the project absorbs a loss in domestic support, or the realm outside the fences pays through treasury funds. There is no clean option, only the familiar art of choosing where the bruise will be least visible."
