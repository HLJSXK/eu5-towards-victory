 tv_engineering_department.7186.d:0 "[SCOPE.sCharacter('tv_wonder_event_engineer').GetShortName] misjudges the cost of a fix and leaves the treasury to cover the elegance. The works continue, but [gold|E] suffers for the oversight.\n\n#R This event occurred because the current [tv_great_engineer|E] has effective military ability below 50.#!"
 tv_engineering_department.7186.a:0 "Correct what can still be corrected."
