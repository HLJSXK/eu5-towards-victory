 tv_engineering_department.7043.d:0 "Someone has to sit on the heavier side of the scale, and this month it is [estate_satisfaction|E] among the peasants. Let it settle a little lower, and [tv_wonder_organization_competence|E] rises to match, though the balance rarely stays where you last left it."
 tv_engineering_department.7043.a:0 "Turns the sacrifice into progress."
 tv_engineering_department.7043.b:0 "Leaves the offer on the table."
 tv_engineering_department.7044.t:0 "[tv_wonder_construction|E]：The Site Gives Stone and Space for Sharper Orders"
 tv_engineering_department.7044.d:0 "The foremen put it plainly: give up a slice of [development|E] at the site this month, and they will turn it directly into [tv_wonder_organization_competence|E]. No one pretends it is a generous exchange, only a workable one."
 tv_engineering_department.7044.a:0 "Makes the trade without hesitation."
 tv_engineering_department.7044.b:0 "Holds off for now."
 tv_engineering_department.7045.t:0 "[tv_wonder_construction|E]：Local Trade Is Bent Toward the Works for Sharper Orders"
 tv_engineering_department.7045.d:0 "Stores meant to last the season get opened early. What leaves as [prosperity|E] at the site does not vanish so much as change shape, arriving on the far side of the ledger as fresh [tv_wonder_organization_competence|E]. Whether that shape is worth the emptied shelf is a question for later."
 tv_engineering_department.7045.a:0 "Accepts the bargain."
 tv_engineering_department.7045.b:0 "Passes on the bargain."
 tv_engineering_department.7046.t:0 "[tv_wonder_construction|E]：Capital Works Are Reassigned for Sharper Orders"
 tv_engineering_department.7046.d:0 "It amounts to a wager: stake [development|E] in the capital on the table and see it returned, transformed, as movement on [tv_wonder_organization_competence|E]. The house — in this case, the works themselves — tends to collect on such bets one way or another."
 tv_engineering_department.7046.a:0 "Cashes in the opportunity."
 tv_engineering_department.7046.b:0 "We'll wait this one out."
 tv_engineering_department.7047.t:0 "[tv_wonder_construction|E]：The Capital's Markets Are Turned for Sharper Orders"
 tv_engineering_department.7047.d:0 "There is no clean way to say it: [prosperity|E] in the capital must give a little ground this month if [tv_wonder_organization_competence|E] is to move at all. The engineers accept the trade without much ceremony, aware that ground given rarely returns on its own."
 tv_engineering_department.7047.a:0 "Signs off on the exchange."
 tv_engineering_department.7047.b:0 "We decline for now."
 tv_engineering_department.7048.t:0 "[tv_wonder_construction|E]：Labor Is Driven Harder for Sharper Orders"
 tv_engineering_department.7048.d:0 "Building anything worth having means burning something else to light the way. This time the fuel is the laboring [population|E] at the site, and the light it throws falls squarely on [tv_wonder_organization_competence|E] — bright enough to notice, costly enough to remember."
 tv_engineering_department.7048.a:0 "We'll pay the price."
 tv_engineering_department.7048.b:0 "We keep our reserves untouched."
 tv_engineering_department.7049.t:0 "[tv_wonder_construction|E]：Treasury Doors Open for A Clearer Road"
 tv_engineering_department.7049.d:0 "Someone will have to call in a favor, and this time the favor is paid out of [gold|E]. It buys the works an unmistakable step forward in [tv_wonder_logistics_competence|E], but favors spent do not refill themselves."
 tv_engineering_department.7049.a:0 "We accept the trade."
 tv_engineering_department.7049.b:0 "Not this month!"
 tv_engineering_department.7050.t:0 "[tv_wonder_construction|E]：Royal Authority Is Pledged for A Clearer Road"
 tv_engineering_department.7050.d:0 "Somewhere in the ledgers, a clerk finds a line that can be crossed out without anyone asking twice: [legitimacy|E] bends a little so that [tv_wonder_logistics_competence|E] can move forward. It is the kind of arithmetic that works today and gets reread, unkindly, next season."
 tv_engineering_department.7050.a:0 "We'll make it count."
 tv_engineering_department.7050.b:0 "Better safe than sorry."
 tv_engineering_department.7051.t:0 "[tv_wonder_construction|E]：Villages Give Way for A Clearer Road"
 tv_engineering_department.7051.d:0 "Like drawing water from one field to save another, the foremen suggest letting [stability|E] run a little dry so that [tv_wonder_logistics_competence|E] can be irrigated properly. Nobody upstream will thank them for it, but the crop of progress comes in regardless."
 tv_engineering_department.7051.a:0 "We take the deal."
 tv_engineering_department.7051.b:0 "Lets the month pass quietly."
 tv_engineering_department.7052.t:0 "[tv_wonder_construction|E]：Reputation Is Spent for A Clearer Road"
 tv_engineering_department.7052.d:0 "The [tv_engineering_department|E] asks, in effect, to borrow against [prestige|E]: spend it down now, promise nothing about paying it back, and let the difference show up as hard movement on [tv_wonder_logistics_competence|E]. Debts like this rarely stay quiet forever."
 tv_engineering_department.7052.a:0 "Do it!"
 tv_engineering_department.7052.b:0 "Leaves the offer on the table."
