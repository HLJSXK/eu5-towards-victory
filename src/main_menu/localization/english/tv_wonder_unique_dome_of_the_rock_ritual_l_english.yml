 tv_engineering_department.1662.t:0 "Wardens at the Golden Threshold"
 tv_engineering_department.1662.d:0 "The commissioner gathers the platform gate wardens, the state-faith jurists, visiting pilgrim groups, Jerusalem's local notables, and a panel of supervised intercommunal witnesses. Before the access covenant can be read aloud, one of three compacts must be chosen to govern it."
 tv_engineering_department.1662.a:0 "Open the covenant reading."
 tv_engineering_department.1663.t:0 "Choosing the Access Compact"
 tv_engineering_department.1663.d:0 "Guard discipline favors strict order but risks alienating pilgrims and local notables. Jurist proclamation favors public legal clarity but risks the gate wardens and the intercommunal witnesses. Witnessed tolerance favors broad recognition but risks the jurists and the gate wardens."
 tv_engineering_department.1663.a:0 "Guard Discipline: strict order at the gates."
 tv_engineering_department.1663.b:0 "Jurist Proclamation: public legal clarity."
 tv_engineering_department.1663.c:0 "Witnessed Tolerance: broad, witnessed access."
 tv_engineering_department.1664.t:0 "The Compact Is Tested"
 tv_engineering_department.1664.d:0 "The parties and duties left unsettled by the chosen compact now press their objections. The covenant can still be sealed in full, at a cost to the commissioner's standing, or accepted as a narrower and safer proclamation."
 tv_engineering_department.1664.a:0 "Add jurist oversight and seal full recognition. (-3 prestige)"
 tv_engineering_department.1664.b:0 "Accept a narrower, safer proclamation."
 tv_engineering_department.1665.t:0 "The Access Covenant Is Sealed"
 tv_engineering_department.1665.d:0 "The custody covenant is sealed on the platform: gate wardens, jurists, pilgrims, notables, and witnesses each take their place under the recognized order of the sanctuary, and the entrusted duties pass to named keepers."
 tv_engineering_department.1665.a:0 "Seal the covenant."
