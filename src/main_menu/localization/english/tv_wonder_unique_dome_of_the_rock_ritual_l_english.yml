 tv_engineering_department.1000.t:0 "The Duties of the Platform"
 tv_engineering_department.1000.d:0 "Beyond the gate lies the daily labor that proves a covenant genuine: watch lists for the Gate Keys, water carriers for the Cisterns, oil and wicks for the Dome Lamps and their inscriptions, scribes for the Endowment Deeds, and escorts for the Guarded Pilgrim Routes. The commissioner gathers the officers responsible for each so that stewardship of the Rock, not mere possession, can be entrusted rather than assumed."
 tv_engineering_department.1000.a:0 "Summon the custody officers."
 tv_engineering_department.1001.t:0 "Entrusting the Sanctuary's Labor"
 tv_engineering_department.1001.d:0 "The keys and watch lists, the cisterns and their carriers, the lamps and their inscriptions, the endowment deeds and their scribes, and the guarded pilgrim routes each need a keeper before the covenant means anything beyond words. Assigning these duties one by one turns the golden dome's promise of custody into a ledger any notable or jurist can inspect. What the commissioner entrusts today, the Rock will remember."
 tv_engineering_department.1001.a:0 "Assign the custody duties."
 tv_engineering_department.1002.t:0 "A Duty Neglected"
 tv_engineering_department.1002.d:0 "A cistern runs dry before its carriers can be paid, or an endowment scribe is found altering the deeds that fund the lamps' oil, and suddenly stewardship looks like plunder dressed in piety. Left unanswered, the lapse will make every other custody duty suspect in the eyes of pilgrims and local notables alike. The commissioner can either repair the lapse in the open or quietly reassign it to sterner hands."
 tv_engineering_department.1002.a:0 "Repair the lapse openly."
 tv_engineering_department.1002.b:0 "Reassign the duty to sterner hands."
 tv_engineering_department.1003.t:0 "The Custody Duties Are Entrusted"
 tv_engineering_department.1003.d:0 "Keys and watch lists, cisterns and carriers, lamps and inscriptions, endowment deeds and scribes, and the guarded pilgrim routes are each declared entrusted before the assembled custodians. The Dome of the Rock no longer merely stands over Jerusalem; it is kept, watered, lit, funded, and guarded by name and by oath. This is the daily proof that sovereignty here means service, not seizure."
 tv_engineering_department.1003.a:0 "Entrust the custody duties."
 tv_engineering_department.1658.t:0 "Wardens at the Golden Threshold"
 tv_engineering_department.1658.d:0 "The commissioner summons the Platform Gate Wardens, the State-Faith Jurists, the Visiting Pilgrim Groups, Jerusalem's Local Notables, and the Supervised Intercommunal Witnesses beneath the gilded dome. No custom or garrison order yet says who may pass the gates, and each party has arrived expecting its own rule to prevail. The covenant governing access to the Rock must be read aloud before it can be obeyed."
 tv_engineering_department.1658.a:0 "Convene the custody council."
 tv_engineering_department.1659.t:0 "Weighing the Access Compact"
 tv_engineering_department.1659.d:0 "Between disciplined guard thresholds, a jurist's public proclamation, and witnessed pilgrim tolerance, the wardens and notables wait for the covenant's shape to be declared. Each path protects the sanctuary differently: guards close ranks around the Rock, jurists write a rule the whole city can read, and witnesses see that access is neither plunder nor caprice. The choice, once spoken, becomes the platform's law until it is challenged."
 tv_engineering_department.1659.a:0 "Declare the access compact."
 tv_engineering_department.1660.t:0 "The Compact Is Tested"
 tv_engineering_department.1660.d:0 "Pilgrim caravans balk at a warden's threshold count, and Jerusalem's Local Notables mutter that the Supervised Witnesses have seen soldiers turn the faithful away for sport. Whether this is guard overreach, a rejected exclusion, or an honest witness's suspicion, the sanctuary compact now stands accused of narrowing sovereignty into occupation. The commissioner must answer with either open reconciliation or a quieter, stricter proclamation."
 tv_engineering_department.1660.a:0 "Reopen the gates to reconciliation."
 tv_engineering_department.1660.b:0 "Hold the line with a narrower proclamation."
 tv_engineering_department.1661.t:0 "The Access Covenant Is Sealed"
 tv_engineering_department.1661.d:0 "Gate wardens, jurists, pilgrim caravans, local notables, and supervised witnesses stand together as the compact is read a final time upon the platform. What began as five competing claims to the threshold becomes one recognized law of entry, witnessed by those who might otherwise have doubted it. The Dome's sovereignty is proven not by the strength of its guards but by the durability of who now keeps the keys in peace."
 tv_engineering_department.1661.a:0 "Seal the access covenant."
