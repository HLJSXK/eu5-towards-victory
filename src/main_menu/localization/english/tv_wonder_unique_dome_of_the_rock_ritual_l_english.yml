 tv_engineering_department.1662.t:0 "Wardens at the Golden Threshold"
 tv_engineering_department.1662.d:0 "The commissioner gathers the platform gate wardens, the state-faith jurists, visiting pilgrim groups, Jerusalem's local notables, and a panel of supervised intercommunal witnesses before the access covenant can be read aloud."
 tv_engineering_department.1662.a:0 "Open the covenant reading."
 tv_engineering_department.1663.t:0 "Weighing the Access Compact"
 tv_engineering_department.1663.d:0 "Each party is measured in turn: the wardens for discipline, the jurists for proclamation, the pilgrims for patience, the notables for standing, and the witnesses for impartiality. Some accept the compact readily; others make their reservations known."
 tv_engineering_department.1663.a:0 "Record how each party responds."
 tv_engineering_department.1664.t:0 "The Compact Is Tested"
 tv_engineering_department.1664.d:0 "Guard overreach at the gates, a pilgrim group's suspicion of favoritism, or a witness panel's doubt about impartiality threatens to unravel the covenant before it is sealed."
 tv_engineering_department.1664.a:0 "Reopen talks and seek reconciliation."
 tv_engineering_department.1664.b:0 "Accept a narrower, safer proclamation."
 tv_engineering_department.1665.t:0 "The Access Covenant Is Sealed"
 tv_engineering_department.1665.d:0 "The custody covenant is sealed on the platform: gate wardens, jurists, pilgrims, notables, and witnesses each take their place under the recognized order of the sanctuary."
 tv_engineering_department.1665.a:0 "Seal the covenant."
 tv_engineering_department.1666.t:0 "The Duties of the Platform"
 tv_engineering_department.1666.d:0 "Before the sanctuary can be trusted to its custodians, the gate keys and watch lists, the cisterns and water carriers, the dome lamps and inscriptions, the endowment deeds and scribes, and the guarded pilgrim routes must all be entrusted to named keepers."
 tv_engineering_department.1666.a:0 "Begin entrusting the duties."
 tv_engineering_department.1667.t:0 "Entrusting the Sanctuary's Labor"
 tv_engineering_department.1667.d:0 "Keepers are assigned to each duty. Some prove reliable at once; others draw complaints of neglect, corruption, or delay before their charge is confirmed."
 tv_engineering_department.1667.a:0 "Record how each duty is discharged."
 tv_engineering_department.1668.t:0 "A Duty Neglected"
 tv_engineering_department.1668.d:0 "A neglected cistern, a lamp left unlit, or a scribe's mishandled deed makes custody look like plunder rather than stewardship unless it is corrected."
 tv_engineering_department.1668.a:0 "Discipline the keeper and re-entrust the duty."
 tv_engineering_department.1668.b:0 "Quietly narrow that duty's scope instead."
 tv_engineering_department.1669.t:0 "The Custody Duties Are Entrusted"
 tv_engineering_department.1669.d:0 "Gate keys, cisterns, lamps, endowment deeds, and pilgrim routes are all entrusted to keepers whose discipline is now a matter of public record."
 tv_engineering_department.1669.a:0 "Confirm the custody arrangement."
