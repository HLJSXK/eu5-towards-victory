 tv_engineering_department.1662.t:0 "A Calendar of Shared Custody"
 tv_engineering_department.1662.d:0 "The commissioner proposes something the sanctuary has never had under this reign: a fixed calendar of shared custody. Rather than settling access once and for all, the Nusaybah guardian family, the Waqf endowment council, and the garrison's platform watch will each hold the keys in turn, across six terms spanning several years, with the sponsor's own record of fairness and upkeep becoming the true measure of the covenant."
 tv_engineering_department.1662.a:0 "Open the calendar of shared custody."
 tv_engineering_department.1663.t:0 "The Term Falls Due"
 tv_engineering_department.1663.d:0 "A term of the custody calendar has come due. The keys, the watch-lists, and the standing before pilgrims must pass to whichever party the sponsor names for this term. Rotating custody preserves the appearance of impartial rule, but returning the same party to office builds administrative memory the sanctuary can rely on."
 tv_engineering_department.1663.strained.d:0 "The record so far has not been kind: fairness, continuity, or the endowment's own upkeep -- one or more of the calendar's three measures is already faltering, and this term's choice will not undo that on its own."
 tv_engineering_department.1663.a:0 "Entrust this term to the Nusaybah Guardian Family."
 tv_engineering_department.1663.b:0 "Entrust this term to the Waqf Endowment Council."
 tv_engineering_department.1663.c:0 "Entrust this term to the Garrison Platform Watch."
 tv_engineering_department.1664.t:0 "Funding the Term's Upkeep"
 tv_engineering_department.1664.d:0 "The lamps, cisterns, and gate timbers of the platform need constant tending, and this term's custodian has presented the bill. The sponsor may commit personal prestige to see the endowment funded in full, or let this term's maintenance lapse and let the fabric of the sanctuary wear a little more."
 tv_engineering_department.1664.critical.d:0 "The endowment's fabric is now in visibly poor repair -- lamps unlit, cisterns fouled, gate timbers rotting. Another lapsed term risks real damage to the platform itself."
 tv_engineering_department.1664.a:0 "Commit prestige to fund the endowment in full. (-2 prestige)"
 tv_engineering_department.1664.b:0 "Let this term's maintenance lapse."
 tv_engineering_department.1665.t:0 "The Calendar Is Completed"
 tv_engineering_department.1665.d:0 "Six terms have passed, and the custody calendar is complete. The record now stands: how often custody rotated fairly, how often the same hands kept it steady, and how well the platform's fabric was kept -- that record, not any single day's proclamation, is what history will call the Dome's true custody."
 tv_engineering_department.1665.a:0 "Seal the completed calendar."
