 # ── Conquest Victory ─────────────────────────────────────────────────────────
 TV_CONQUEST_TITLE: "Conquest Victory"
 TV_CONQUEST_DESCRIPTION: "Dominate the world through territorial expansion."
 TV_CONQUEST_FLAVOR: ""The greatest happiness is to vanquish your enemies." — Genghis Khan"

 TV_CONQUEST_M1_TITLE: "Conquest Victory — Milestone 1"
 TV_CONQUEST_M1_MEANING: "A nation of modest reach. ~150 owned locations."
 TV_CONQUEST_M1_CONDITIONS: "Conquest score ≥ 150 (direct locations + 0.5 × subject locations)."
 TV_CONQUEST_M1_REWARDS: "+5% Manpower\n+3% Land Morale"
