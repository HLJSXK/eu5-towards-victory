 # ── Conquest Victory Events ───────────────────────────────────────────────
 tv_conquest.1.t: "[tv_conquest_victory|E]：The Empire Grows"
 tv_conquest.1.d: "The first report arrives with mud still drying on the dispatch case. Our [army|e]s have crossed old frontiers, and banners now fly over 200 [location|e]s once marked as beyond practical command. Courtiers trace the new borders with a mixture of pride and dread, for each fresh province adds roads, tax rolls, garrisons, and quarrels. The [tv_conquest_victory|E] is no longer a soldier's boast spoken over campaign wine; it has become a problem of state. Messengers ride through nights that used to belong to foreign rulers. The realm is taking shape, and its shape is larger than habit can easily understand."
 tv_conquest.1.a: "Send the surveyors after the banners."
 tv_conquest.2.t: "[tv_conquest_victory|E]：A Substantial Empire"
 tv_conquest.2.d: "Four hundred [location|e]s now answer to our seals, our taxmen, and our marching drums. The triumph is obvious on the map, but less tidy on the road, where grain wagons sink into rain and quartermasters argue over names no clerk can spell twice the same way. Our [army|e]s have won the space; now the state must learn how to feed it. Every failed bridge becomes [attrition|e], every delayed mule becomes a rumor of weakness, and every hungry regiment teaches the frontier to doubt us. The empire can still grow, but only if logistics becomes as honored as courage. Victory has given us distance, and distance demands discipline."
 tv_conquest.2.a: "Put the empire on wheels, hooves, and ledgers."
 tv_conquest.3.t: "[tv_conquest_victory|E]：Territorial Supremacy — Short-term Victory"
 tv_conquest.3.d: "Six hundred [location|e]s now bow before our flag, and the word kingdom has begun to sound too small in the mouths of heralds. Provincial elites arrive with gifts and grievances, conquered towns ask which laws survived the surrender, and officers discover that a garrison can win a gate without winning obedience. This is the first true test of imperial rule. The [tv_govhouse|E] must turn conquest into habit, not merely into fear. If the hand is too soft, the edges fray; if it is too hard, the whole cloth tears. Our [tv_conquest_victory|E] has reached its short-term crown, but crowns are heavy things."
 tv_conquest.3.a: "Rule it before it remembers another master."
 tv_conquest.4.t: "[tv_conquest_victory|E]：An Empire Spanning Continents"
 tv_conquest.4.d: "More than 1,200 [location|e]s now lie within the shadow of our authority. Foreign courts no longer ask whether we are dangerous; they ask whether distance itself can survive us. The old language of borders is failing, for our frontier is not a line but a moving arrangement of forts, roads, governors, hostages, merchants, and soldiers. Every province we absorb adds strength, but also another memory that must be negotiated or broken. Our [army|e]s must appear where revolt expects absence, and our administrators must arrive before rumor writes its own law. The world watches because the world is measuring how much empire one state can bear."
 tv_conquest.4.a: "Bind every road back to the capital."
 tv_conquest.5.t: "[tv_conquest_victory|E]：Long-term Victory — World Empire"
 tv_conquest.5.d: "Two thousand five hundred [location|e]s stand within our dominion, and scribes have begun to run out of comparisons. No empire in recorded history has claimed so much of the known world, nor forced so many peoples to reckon with one banner at once. The news does not arrive as a single triumph, but as a thousand smaller submissions: a city gate opened, a frontier oath sworn, a rebel standard taken down, a distant tax paid without soldiers watching. Our [tv_conquest_victory|E] has passed from campaign into myth. Future rulers will study our roads as if they were veins, our sieges as if they were scripture, and our mistakes as warnings written in fire. Our legacy is no longer merely recorded by history; it has become one of the measures by which history will judge ambition."
 tv_conquest.5.a: "Let the map learn our name."


