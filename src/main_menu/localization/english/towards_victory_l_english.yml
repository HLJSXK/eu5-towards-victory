 # ── Conquest Victory ──────────────────────────────────────────────────────────
 TV_CONQUEST_TITLE: "Conquest Victory"
 TV_CONQUEST_DESCRIPTION: "Dominate the world through territorial expansion."
 TV_CONQUEST_FLAVOR: "\"The greatest happiness is to vanquish your enemies.\" — Genghis Khan"

 TV_CONQUEST_M1_TITLE: "Conquest Victory — Milestone 1"
 TV_CONQUEST_M1_MEANING: "A nation of modest reach. ~150 owned locations."
 TV_CONQUEST_M1_TRIGGER_DESC: "Conquest score ≥ 150"
 TV_CONQUEST_M2_TITLE: "Conquest Victory — Milestone 2"
 TV_CONQUEST_M2_MEANING: "A substantial empire. ~300 owned locations."
 TV_CONQUEST_M2_TRIGGER_DESC: "Conquest score ≥ 300"
 TV_CONQUEST_M3_TITLE: "Conquest Victory — Short-term Victory"
 TV_CONQUEST_M3_MEANING: "Territorial supremacy secured. Short-term Victory. ~500 owned locations."
 TV_CONQUEST_M3_TRIGGER_DESC: "Conquest score ≥ 500"
 TV_CONQUEST_M4_TITLE: "Conquest Victory — Milestone 4"
 TV_CONQUEST_M4_MEANING: "An empire spanning continents. ~1,000 owned locations."
 TV_CONQUEST_M4_TRIGGER_DESC: "Conquest score ≥ 1,000"
 TV_CONQUEST_M5_TITLE: "Conquest Victory — Long-term Victory"
 TV_CONQUEST_M5_MEANING: "Undisputed world empire. Long-term Victory. ~2,000 owned locations."
 TV_CONQUEST_M5_TRIGGER_DESC: "Conquest score ≥ 2,000"

 # ── Conquest Victory Events ───────────────────────────────────────────────
 tv_conquest.1.t: "The Empire Grows"
 tv_conquest.1.d: "Our armies have marched and our banners now fly over territories once beyond reach. With 150 locations under our dominion, the realm is taking shape."
 tv_conquest.1.a: "Let our dominion grow ever wider."
 tv_conquest.2.t: "A Substantial Empire"
 tv_conquest.2.d: "Our realm now encompasses 300 locations. Supplying our vast armies and reducing the ravages of campaign attrition will be essential to sustaining this empire."
 tv_conquest.2.a: "Our logistics must match our ambition."
 tv_conquest.3.t: "Territorial Supremacy — Short-term Victory"
 tv_conquest.3.d: "Five hundred locations bow before our flag. This is no mere kingdom — this is an empire. Yet governing so vast a domain demands firm administration and a steady hand."
 tv_conquest.3.a: "The realm is ours to govern."
 tv_conquest.4.t: "An Empire Spanning Continents"
 tv_conquest.4.d: "Over a thousand locations have fallen under our sway. The world watches. To hold what we have seized, we must project power with discipline and sustain our armies across every front."
 tv_conquest.4.a: "We shall hold what we have conquered."
 tv_conquest.5.t: "Long-term Victory — World Empire"
 tv_conquest.5.d: "Two thousand locations. No empire in recorded history has claimed so much of the known world. Our legacy is written not in ink but in the march of armies and the raising of banners."
 tv_conquest.5.a: "Our name shall echo through the ages."


 # ── Prosperity Victory ──────────────────────────────────────────────────────────
 TV_PROSPERITY_TITLE: "Prosperity Victory"
 TV_PROSPERITY_DESCRIPTION: "Build a thriving nation through domestic development."
 TV_PROSPERITY_FLAVOR: "\"Prosperity is the fruit of labour.\" — Thucydides"

 TV_PROSPERITY_M1_TITLE: "Prosperity Victory — Milestone 1"
 TV_PROSPERITY_M1_MEANING: "A growing nation — early domestic prosperity. Score ~5,000."
 TV_PROSPERITY_M1_TRIGGER_DESC: "Prosperity score ≥ 5,000"
 TV_PROSPERITY_M2_TITLE: "Prosperity Victory — Milestone 2"
 TV_PROSPERITY_M2_MEANING: "A flourishing nation — sustained domestic investment. Score ~8,000."
 TV_PROSPERITY_M2_TRIGGER_DESC: "Prosperity score ≥ 8,000"
 TV_PROSPERITY_M3_TITLE: "Prosperity Victory — Short-term Victory"
 TV_PROSPERITY_M3_MEANING: "A prosperous heartland. Short-term Victory. Score ~12,000."
 TV_PROSPERITY_M3_TRIGGER_DESC: "Prosperity score ≥ 12,000"
 TV_PROSPERITY_M4_TITLE: "Prosperity Victory — Milestone 4"
 TV_PROSPERITY_M4_MEANING: "An advanced nation — the envy of neighbours. Score ~18,000."
 TV_PROSPERITY_M4_TRIGGER_DESC: "Prosperity score ≥ 18,000"
 TV_PROSPERITY_M5_TITLE: "Prosperity Victory — Long-term Victory"
 TV_PROSPERITY_M5_MEANING: "The most developed nation on earth. Long-term Victory. Score ~25,000."
 TV_PROSPERITY_M5_TRIGGER_DESC: "Prosperity score ≥ 25,000"

 # ── Prosperity Victory Events ───────────────────────────────────────────────
 tv_prosperity.1.t: "A Nation Begins to Thrive"
 tv_prosperity.1.d: "Our people are prospering. Farms yield more, towns bustle with commerce, and the realm's foundations grow stronger with each passing year."
 tv_prosperity.1.a: "Let our prosperity continue to grow."
 tv_prosperity.2.t: "A Flourishing Realm"
 tv_prosperity.2.d: "Sustained investment in our lands is bearing fruit. The population swells, buildings rise, and the wealth of the nation is evident to all who enter our borders."
 tv_prosperity.2.a: "Our people shall want for nothing."
 tv_prosperity.3.t: "Prosperity Victory — The Heartland Thrives"
 tv_prosperity.3.d: "Our realm has achieved a level of domestic prosperity that few nations ever reach. The combination of healthy population, vibrant towns, and well-tended lands marks us as a true short-term victor."
 tv_prosperity.3.a: "Let this prosperity be the foundation of our greatness."
 tv_prosperity.4.t: "An Advanced Nation"
 tv_prosperity.4.d: "Neighbours look upon our realm with envy. Our cities are among the finest in the known world, our population among the most numerous and well-fed. Yet the summit of prosperity still beckons."
 tv_prosperity.4.a: "We shall reach the pinnacle of civilisation."
 tv_prosperity.5.t: "Long-term Victory — The Most Developed Nation"
 tv_prosperity.5.d: "No nation in the known world can rival the prosperity of our realm. Our people are the most numerous, our towns the most prosperous, and our lands the most developed. History shall remember us as the pinnacle of human achievement."
 tv_prosperity.5.a: "Our legacy is written in the flourishing of our people."


 # ── Trade Victory ──────────────────────────────────────────────────────────
 TV_TRADE_TITLE: "Trade Victory"
 TV_TRADE_DESCRIPTION: "Build an empire of commerce and maritime power."
 TV_TRADE_FLAVOR: "\"Venice does not make war; Venice makes money.\""

 TV_TRADE_M1_TITLE: "Trade Victory — Milestone 1"
 TV_TRADE_M1_MEANING: "A merchant of note — commanding a trade node. Monthly trade income ~100."
 TV_TRADE_M1_TRIGGER_DESC: "Trade score ≥ 100"
 TV_TRADE_M2_TITLE: "Trade Victory — Milestone 2"
 TV_TRADE_M2_MEANING: "A maritime power — dominating regional trade. Monthly trade income ~200."
 TV_TRADE_M2_TRIGGER_DESC: "Trade score ≥ 200"
 TV_TRADE_M3_TITLE: "Trade Victory — Short-term Victory"
 TV_TRADE_M3_MEANING: "A major trade empire. Short-term Victory. Monthly trade income ~400."
 TV_TRADE_M3_TRIGGER_DESC: "Trade score ≥ 400, with market dominance"
 TV_TRADE_M4_TITLE: "Trade Victory — Milestone 4"
 TV_TRADE_M4_MEANING: "Near-monopoly control of key trade arteries. Monthly trade income ~1,000."
 TV_TRADE_M4_TRIGGER_DESC: "Trade score ≥ 1,000"
 TV_TRADE_M5_TITLE: "Trade Victory — Long-term Victory"
 TV_TRADE_M5_MEANING: "Undisputed trade hegemon. Long-term Victory. Monthly trade income ~2,000."
 TV_TRADE_M5_TRIGGER_DESC: "Trade score ≥ 2,000, with market dominance"

 # ── Trade Victory Events ───────────────────────────────────────────────
 tv_trade.1.t: "The First Markets"
 tv_trade.1.d: "Our merchants have gained a foothold in the great trade markets. Let them grow rich."
 tv_trade.1.a: "Open the ledgers."
 tv_trade.2.t: "Lords of the Trade Route"
 tv_trade.2.d: "Our commercial networks now dominate the region. The caravans and ships answer to us."
 tv_trade.2.a: "Send more merchants."
 tv_trade.3.t: "A Great Commercial Empire"
 tv_trade.3.d: "What began as a handful of traders has grown into an empire of commerce. Our name is known in every great market."
 tv_trade.3.a: "Glory to the merchant class."
 tv_trade.4.t: "Masters of the Seas of Commerce"
 tv_trade.4.d: "Our trade routes crisscross the known world. Distance itself bows to our merchant fleets."
 tv_trade.4.a: "Chart new routes."
 tv_trade.5.t: "The Trade Hegemon"
 tv_trade.5.d: "We have done what no nation has done before: we have made the world's commerce our own. This victory is eternal."
 tv_trade.5.a: "Our ledgers overflow."

 tv_trade_market_dominance_5_tt:0 "Leading merchant in at least 5 markets"
 tv_trade_market_dominance_10_tt:0 "Leading merchant in at least 10 markets"

 # ── Diplomatic Victory ──────────────────────────────────────────────────────────
 TV_DIPLOMATIC_TITLE: "Diplomatic Victory"
 TV_DIPLOMATIC_DESCRIPTION: "Accumulate influence through alliances, treaties, and statecraft."
 TV_DIPLOMATIC_FLAVOR: "\"An army is of little use where reason fails.\""

 TV_DIPLOMATIC_M1_TITLE: "Diplomatic Victory — Milestone 1"
 TV_DIPLOMATIC_M1_MEANING: "50 Diplomatic Victory Points. A respected voice in affairs."
 TV_DIPLOMATIC_M1_TRIGGER_DESC: "Diplomatic Victory Points ≥ 50"
 TV_DIPLOMATIC_M2_TITLE: "Diplomatic Victory — Milestone 2"
 TV_DIPLOMATIC_M2_MEANING: "120 DVP. A reliable ally and guarantor of peace."
 TV_DIPLOMATIC_M2_TRIGGER_DESC: "Diplomatic Victory Points ≥ 120"
 TV_DIPLOMATIC_M3_TITLE: "Diplomatic Victory — Short-term Victory"
 TV_DIPLOMATIC_M3_MEANING: "220 DVP. A power of first diplomatic rank. Short-term Victory."
 TV_DIPLOMATIC_M3_TRIGGER_DESC: "Diplomatic Victory Points ≥ 220"
 TV_DIPLOMATIC_M4_TITLE: "Diplomatic Victory — Milestone 4"
 TV_DIPLOMATIC_M4_MEANING: "380 DVP. The arbiter of international order."
 TV_DIPLOMATIC_M4_TRIGGER_DESC: "Diplomatic Victory Points ≥ 380"
 TV_DIPLOMATIC_M5_TITLE: "Diplomatic Victory — Long-term Victory"
 TV_DIPLOMATIC_M5_MEANING: "580 DVP. Undisputed diplomatic hegemon. Long-term Victory."
 TV_DIPLOMATIC_M5_TRIGGER_DESC: "Diplomatic Victory Points ≥ 580"

 # ── Diplomatic Victory Events ───────────────────────────────────────────────
 tv_diplomatic.1.t: "A Voice Among Nations"
 tv_diplomatic.1.d: "Our patient diplomacy has begun to bear fruit. Through alliances and royal bonds, our nation is earning a place at the table of great powers."
 tv_diplomatic.1.a: "Let our word carry weight."
 tv_diplomatic.2.t: "A Reliable Ally"
 tv_diplomatic.2.d: "Nations seek us out as guarantors and partners. Our willingness to honour our commitments has built a reputation that money cannot buy."
 tv_diplomatic.2.a: "Our word is our bond."
 tv_diplomatic.3.t: "A Power of the First Rank — Short-term Victory"
 tv_diplomatic.3.d: "Our diplomatic reach extends across continents. Treaties bear our seal, and ambassadors from distant courts seek our counsel. We have achieved a short-term diplomatic victory."
 tv_diplomatic.3.a: "The world listens when we speak."
 tv_diplomatic.4.t: "Arbiter of Nations"
 tv_diplomatic.4.d: "No quarrel between princes is settled without our consent. Our subjects are loyal, our allies numerous, and our influence unmatched in this age."
 tv_diplomatic.4.a: "We shall keep the peace of the world."
 tv_diplomatic.5.t: "Long-term Victory — Diplomatic Hegemon"
 tv_diplomatic.5.d: "Five hundred and eighty points of diplomatic achievement. No nation in history has woven so vast a web of alliances, marriages, and mutual guarantees. Our legacy is written not in conquest but in the peace we preserved."
 tv_diplomatic.5.a: "Our name shall be synonymous with statecraft."


 # ── Cultural Victory ──────────────────────────────────────────────────────────
 TV_CULTURAL_TITLE: "Cultural Victory"
 TV_CULTURAL_DESCRIPTION: "Achieve pre-eminence through art, court, and the spread of culture."
 TV_CULTURAL_FLAVOR: "\"Art is the signature of civilisations.\""

 TV_CULTURAL_M1_TITLE: "Cultural Victory — Milestone 1"
 TV_CULTURAL_M1_MEANING: "50 Cultural Influence Points. A patron of the arts."
 TV_CULTURAL_M1_TRIGGER_DESC: "Cultural Influence Points ≥ 50"
 TV_CULTURAL_M2_TITLE: "Cultural Victory — Milestone 2"
 TV_CULTURAL_M2_MEANING: "120 CIP. A celebrated cultural power."
 TV_CULTURAL_M2_TRIGGER_DESC: "Cultural Influence Points ≥ 120"
 TV_CULTURAL_M3_TITLE: "Cultural Victory — Short-term Victory"
 TV_CULTURAL_M3_MEANING: "220 CIP. A centre of Renaissance brilliance. Short-term Victory."
 TV_CULTURAL_M3_TRIGGER_DESC: "Cultural Influence Points ≥ 220"
 TV_CULTURAL_M4_TITLE: "Cultural Victory — Milestone 4"
 TV_CULTURAL_M4_MEANING: "380 CIP. Culture radiates from your court across the world."
 TV_CULTURAL_M4_TRIGGER_DESC: "Cultural Influence Points ≥ 380"
 TV_CULTURAL_M5_TITLE: "Cultural Victory — Long-term Victory"
 TV_CULTURAL_M5_MEANING: "580 CIP. The greatest cultural legacy in history. Long-term Victory."
 TV_CULTURAL_M5_TRIGGER_DESC: "Cultural Influence Points ≥ 580"

 # ── Cultural Victory Events ───────────────────────────────────────────────
 tv_cultural.1.t: "A Patron of the Arts"
 tv_cultural.1.d: "Our court has begun to attract painters, sculptors, and men of letters. The works commissioned in our name already speak to something greater than mere politics — a civilisation is taking shape."
 tv_cultural.1.a: "Let the arts flourish in our name."
 tv_cultural.2.t: "The Renaissance Court"
 tv_cultural.2.d: "Word of our court's magnificence has spread to distant lands. Scholars and artists seek our patronage, and the works we commission are spoken of with admiration by princes and popes alike."
 tv_cultural.2.a: "Our court shall be a beacon of learning."
 tv_cultural.3.t: "A Centre of Civilisation — Short-term Victory"
 tv_cultural.3.d: "No court in this age surpasses ours in the arts, letters, and learning. We have achieved what lesser princes can only dream of — a short-term cultural victory that will echo through the centuries."
 tv_cultural.3.a: "Civilisation itself radiates from our halls."
 tv_cultural.4.t: "Light of the World"
 tv_cultural.4.d: "Our cultural influence has spread far beyond our borders. Other nations imitate our fashions, adopt our ideas, and send their finest minds to study under our masters. The world looks to us as the arbiter of taste and refinement."
 tv_cultural.4.a: "We shall carry the torch of civilisation."
 tv_cultural.5.t: "Long-term Victory — Cultural Hegemon"
 tv_cultural.5.d: "Five hundred and eighty points of cultural achievement. No nation in history has produced so much beauty, wisdom, and wonder. Long after our armies are forgotten, the works created in our name will endure as the greatest cultural legacy the world has ever known."
 tv_cultural.5.a: "Our name shall be synonymous with civilisation itself."


 # ── Science Victory ──────────────────────────────────────────────────────────
 TV_SCIENCE_TITLE: "Scientific Victory"
 TV_SCIENCE_DESCRIPTION: "Lead the world through the advancement of knowledge and technology."
 TV_SCIENCE_FLAVOR: "\"The true method of knowledge is experiment.\" — William Blake"

 TV_SCIENCE_M1_TITLE: "Scientific Victory — Milestone 1"
 TV_SCIENCE_M1_MEANING: "A nation of curious minds. ~100 advances researched."
 TV_SCIENCE_M1_TRIGGER_DESC: "Science score ≥ 100 and Academy Level ≥ 1"
 TV_SCIENCE_M2_TITLE: "Scientific Victory — Milestone 2"
 TV_SCIENCE_M2_MEANING: "A realm that embraces new institutions. ~150 advances researched."
 TV_SCIENCE_M2_TRIGGER_DESC: "Science score ≥ 150 and Academy Level ≥ 2"
 TV_SCIENCE_M3_TITLE: "Scientific Victory — Short-term Victory"
 TV_SCIENCE_M3_MEANING: "A vanguard of learning. Short-term Victory. ~200 advances researched."
 TV_SCIENCE_M3_TRIGGER_DESC: "Science score ≥ 200 and Academy Level ≥ 3"
 TV_SCIENCE_M4_TITLE: "Scientific Victory — Milestone 4"
 TV_SCIENCE_M4_MEANING: "The preeminent scientific power. ~300 advances researched."
 TV_SCIENCE_M4_TRIGGER_DESC: "Science score ≥ 300 and Academy Level ≥ 4"
 TV_SCIENCE_M5_TITLE: "Scientific Victory — Long-term Victory"
 TV_SCIENCE_M5_MEANING: "The nation that ushered in the Industrial Age. Long-term Victory. ~400 advances researched."
 TV_SCIENCE_M5_TRIGGER_DESC: "Science score ≥ 400 and Academy Level ≥ 5"

 # ── Science Victory Events ───────────────────────────────────────────────
 tv_science.1.t: "A Nation of Scholars"
 tv_science.1.d: "Our universities and academies are beginning to bear fruit. One hundred advances researched — our realm stands at the vanguard of learning in this age."
 tv_science.1.a: "Knowledge shall light our way forward."
 tv_science.2.t: "Embracing New Ideas"
 tv_science.2.d: "Our scholars have absorbed and spread the great institutions of this era. One hundred and fifty advances stand to our name, and foreign thinkers seek the patronage of our court."
 tv_science.2.a: "Open minds conquer more than armies."
 tv_science.3.t: "A Centre of Learning — Short-term Victory"
 tv_science.3.d: "No nation rivals our command of the sciences and arts of governance. Two hundred advances — a short-term scientific victory that marks us as the intellectual power of our age."
 tv_science.3.a: "Reason and inquiry shall carry us forward."
 tv_science.4.t: "On the Threshold of Modernity"
 tv_science.4.d: "Our natural philosophers and engineers now push at the very boundaries of the known world. Three hundred advances stand as testament to generations of investment in learning."
 tv_science.4.a: "The age of steam and iron awaits."
 tv_science.5.t: "Long-term Victory — The Industrial Vanguard"
 tv_science.5.d: "Four hundred advances. Steam, iron, and the rational mind have remade our nation. Long after the old empires crumble, the knowledge forged in our academies will transform the world entire."
 tv_science.5.a: "Our name shall be synonymous with progress itself."

 tv_academy_of_sciences_1: "Academy of Sciences, Phase I"
 tv_academy_of_sciences_1_desc: "The founding of a national academy dedicated to the systematic advancement of learning and natural philosophy."
 tv_academy_of_sciences_2: "Academy of Sciences, Phase II"
 tv_academy_of_sciences_2_desc: "Expansion of the Academy's research faculties and the establishment of dedicated natural philosophy laboratories."
 tv_academy_of_sciences_3: "Academy of Sciences, Phase III"
 tv_academy_of_sciences_3_desc: "International recognition of the Academy as a preeminent seat of scholarship, drawing scholars from across the known world."
 tv_academy_of_sciences_4: "Academy of Sciences, Phase IV"
 tv_academy_of_sciences_4_desc: "The Academy becomes the nexus of the natural philosophy revolution, pioneering advances that redefine the limits of human knowledge."
 tv_academy_of_sciences_5: "Academy of Sciences, Phase V"
 tv_academy_of_sciences_5_desc: "The Academy drives the nation into the age of industry and reason, its discoveries forging the foundations of a new world."
