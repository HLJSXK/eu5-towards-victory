 # ── Prosperity Victory Events ───────────────────────────────────────────────
 tv_prosperity.1.t: "Prosperity Victory：A Nation Begins to Thrive"
 tv_prosperity.1.d: "The first signs are humble, which is why they matter. Fields that once barely met the tithe now leave grain in reserve, market streets stay loud after sunset, and families speak of next year with less caution than before. Tax collectors notice steadier payments, builders notice fuller order books, and magistrates notice fewer desperate petitions. This is [tv_prosperity_victory|E] in its earliest language: bread, roofs, tools, and time. It is not yet glory, but it is the soil from which glory grows. A realm that can feed hope can begin to build wonders."
 tv_prosperity.1.a: "Count every full granary as a promise."
 tv_prosperity.2.t: "Prosperity Victory：A Flourishing Realm"
 tv_prosperity.2.d: "Sustained investment has changed the sound of the country. Hammers answer bells, carts answer harvest songs, and new [building|e]s climb above streets that once ended in mud. The [population|e] swells not as a burden, but as proof that households believe the future can be afforded. Travelers crossing our borders no longer speak only of soldiers or ceremonies; they speak of workshops, canals, granaries, and the visible [wealth|e] of ordinary districts. Every road improvement shortens a quarrel with distance. Every town improvement teaches the countryside to expect more. The realm is not merely richer; it is learning how to turn riches into structure."
 tv_prosperity.2.a: "Let timber, stone, and wages keep speaking."
 tv_prosperity.3.t: "Prosperity Victory：The Heartland Thrives"
 tv_prosperity.3.d: "Our heartland has ceased to look fortunate and begun to look deliberate. Healthy [population|e], vibrant towns, and well-tended fields now reinforce one another so reliably that foreign observers mistake our routines for natural abundance. The baker, the mason, the magistrate, and the canal keeper each handle a small part of the same machine. This is the short-term crest of [tv_prosperity_victory|E]: a country whose domestic strength no longer depends on one brilliant season or one favored city. Even unrest finds fewer cracks to enter, because ordinary life has acquired weight and expectation. The state has built a floor beneath ambition, and that floor is crowded with people who intend to stand on it."
 tv_prosperity.3.a: "Build higher on this living foundation."
 tv_prosperity.4.t: "Prosperity Victory：An Advanced Nation"
 tv_prosperity.4.d: "Neighboring courts have begun to send envoys who claim to study etiquette while counting our warehouses. They see cities that compete with capitals, villages tied into markets, and a [population|e] numerous enough to frighten soldiers yet well-fed enough to frighten economists. Our [prosperity|e] has become a diplomatic fact, something rivals must explain to their own subjects. Still, abundance has its own appetite. More roads demand more stones, more towns demand more rules, and more wealth demands a state clever enough not to drown in its own success. The summit is visible now, which means the climb has become less forgiving."
 tv_prosperity.4.a: "Make envy our most reliable export."
 tv_prosperity.5.t: "Prosperity Victory：Long-term Victory — The Most Developed Nation"
 tv_prosperity.5.d: "No nation in the known world now rivals the [prosperity|e] of our realm. Our people are numerous without being merely crowded, our towns are rich without being merely swollen, and our lands have been worked until improvement itself seems like a civic instinct. Foreign merchants arrive expecting profit and leave describing order; foreign princes arrive expecting spectacle and leave describing permanence. This is [tv_prosperity_victory|E] fulfilled, not as a single marvel, but as a civilization of maintained abundance. The barns are full, the workshops are loud, the tax rolls are legible, and even ambition has learned to wait its turn in the queue of public works. History will not remember us only for what we conquered or commanded. It will remember that, for a time, human life under our rule looked more possible than anywhere else."
 tv_prosperity.5.a: "Let plenty become the monument."


