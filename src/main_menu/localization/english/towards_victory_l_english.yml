 # ── Science Victory Events ───────────────────────────────────────────────
 tv_science.1.t: "Scientific Victory：Academy of Sciences Founded"
 tv_science.1.d: "The first halls of our [tv_academy_of_sciences|E] now stand complete, smelling of fresh timber, lamp oil, ink, and argument. With one hundred [advance|e]s mastered, our scholars have given the realm more than a building; they have given curiosity a public address. Instruments are unpacked beside copied manuscripts, and students whisper as if the walls themselves might answer. This is the opening note of [tv_science_victory|E]. The state has always used knowledge, but now it has made a place where knowledge can use the state in return. A country with an academy has not solved the mysteries of nature, but it has made those mysteries report to a schedule."
 tv_science.1.a: "Open the doors and sharpen the questions."
 tv_science.2.t: "Scientific Victory：Embracing New Ideas"
 tv_science.2.d: "Our scholars have absorbed and spread the great [institution|e]s of this era until they no longer feel foreign in our lecture halls. One hundred and fifty [advance|e]s now stand to our name, each one copied, debated, corrected, and set to work somewhere in the realm. Foreign thinkers seek the patronage of our court because they hear that questions are not merely tolerated here, but organized. The [tv_academy_of_sciences|E] has become a crossing point for instruments, letters, methods, and pride. New ideas still arrive with accents, rivalries, and inconvenient implications. That is how we know they are alive."
 tv_science.2.a: "Let foreign questions become domestic tools."
 tv_science.3.t: "Scientific Victory：A Centre of Learning — Short-term Victory"
 tv_science.3.d: "No nation now rivals our command of the sciences and the arts of governance. Two hundred [advance|e]s are not a pile of discoveries, but a working language shared by officials, mechanics, physicians, surveyors, and teachers. The [tv_academy_of_sciences|E] has given that language grammar, ceremony, and ambition. This short-term [tv_science_victory|E] marks us as the intellectual power of the age, not because every scholar agrees, but because every serious disagreement now wants our audience. Reason has become a courtier, but not a tame one. We should be grateful for that danger."
 tv_science.3.a: "Give argument a larger hall."
 tv_science.4.t: "Scientific Victory：On the Threshold of Modernity"
 tv_science.4.d: "Our natural philosophers and engineers now push against the boundaries of the known world with an impatience that unsettles older minds. Three hundred [advance|e]s stand as testimony to generations of investment in learning, but also to failures carefully preserved so the next hand need not repeat them. Workshops consult mathematicians, physicians consult instrument makers, and administrators discover that tables can be as disruptive as decrees. The [tv_academy_of_sciences|E] is no longer simply a monument; it is an engine with many rooms. Its gears are paper, brass, reputation, and sleeplessness. The threshold of modernity is not a door we found, but one we have been building plank by plank."
 tv_science.4.a: "Keep building the door to tomorrow."
 tv_science.5.t: "Scientific Victory：Long-term Victory — The Industrial Vanguard"
 tv_science.5.d: "Four hundred [advance|e]s now mark the long road from curiosity to transformation. Steam, iron, disciplined experiment, careful records, and the rational mind have remade our nation from its workshops outward. The [tv_academy_of_sciences|E] has become more than a school or society; it is the place where the future negotiates with the present and usually wins. Old empires may still count cavalry, titles, and ceremonies, but the world has begun to count pressure, literacy, engines, tolerances, and repeatable proof. This is [tv_science_victory|E] fulfilled. Long after older powers crumble, knowledge forged in our academies will continue to change how people work, heal, travel, govern, and imagine the possible."
 tv_science.5.a: "Let tomorrow cite us in its footnotes."

