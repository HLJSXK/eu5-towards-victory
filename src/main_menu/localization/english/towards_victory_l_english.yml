 # ── Diplomatic Victory Events ───────────────────────────────────────────────
 tv_diplomatic.1.t: "Diplomatic Victory：A Voice Among Nations"
 tv_diplomatic.1.d: "Our patient diplomacy has begun to bear fruit in the only form that matters: other courts have chosen to spend their credibility on us. Through [alliance|e]s, [royal_marriage|e]s, promises, dinners, condolences, and carefully timed silences, we have earned a place at the table of [great_power|e]s. Two nations have now pledged [tv_diplomatic_support|e], enough to make our design visible without making it look desperate. The first stones of [tv_diplomatic_alliance|E] are not stones at all, but signatures, witnesses, and shared risk. Enemies will call it intrigue; friends will call it order. Both will be correct enough."
 tv_diplomatic.1.a: "Seal friendship until it hardens into policy."
 tv_diplomatic.2.t: "Diplomatic Victory：A Reliable Ally"
 tv_diplomatic.2.d: "Nations now seek us out as [guarantee|e]ors and partners before crisis forces their hand. They have learned that our promises are not decorative phrases kept for weddings and coronations, but tools that survive bad weather. In council chambers abroad, our name is spoken when borders shake, debts sour, and dynastic tempers rise. The [tv_diplomatic_alliance|E] has begun to develop habits of trust, and those habits raise [tv_alliance_tier|E] more surely than grand speeches. Reputation purchased with coin is spent quickly. Reputation earned by arriving when expected becomes a kind of fortress."
 tv_diplomatic.2.a: "Let reliability become our herald."
 tv_diplomatic.3.t: "Diplomatic Victory：A Power of the First Rank — Short-term Victory"
 tv_diplomatic.3.d: "Our diplomatic reach now extends across continents, carried by couriers, marriage lines, resident envoys, and debts of gratitude no ledger can quite capture. [treaty|e]s bear our seal because our seal has become useful to those who fear isolation. [diplomat|e]s from distant courts seek our counsel not out of courtesy, but because they suspect decisions made without us may not survive contact with reality. This is the short-term height of [tv_diplomatic_victory|E]: a state whose approval has become part of the machinery of peace. The [tv_diplomatic_alliance|E] gives that machinery a chamber, a voice, and a memory. When we speak now, others do not merely listen; they adjust."
 tv_diplomatic.3.a: "Speak softly enough that everyone leans in."
 tv_diplomatic.4.t: "Diplomatic Victory：Arbiter of Nations"
 tv_diplomatic.4.d: "No quarrel between princes now settles cleanly without our consent. Our [subject|e]s remain loyal because they see the shelter our name provides, and our [alliance|e] partners remain numerous because they have learned that proximity to us changes the odds of every negotiation. Petitions arrive from courts that once ignored our envoys, each one asking us to bless, delay, condemn, or quietly tolerate some arrangement. The [tv_alliance_tier|E] has risen high enough that procedure itself begins to serve our influence. We do not need to shout over Europe, Asia, Africa, or the seas; a pause from us can be louder than another ruler's army. The age has many crowns, but fewer and fewer settlements proceed without our shadow crossing the parchment."
 tv_diplomatic.4.a: "Let peace wait upon our signature."
 tv_diplomatic.5.t: "Diplomatic Victory：Long-term Victory — Diplomatic Hegemon"
 tv_diplomatic.5.d: "Fifteen thousand [tv_dvp|E] now stand behind our name like witnesses in a grand hall. No nation in history has woven so vast a web of [alliance|e]s, [royal_marriage|e]s, mutual [guarantee|e]s, shared procedures, and useful obligations. Some empires make silence by burning cities; we have made silence by convincing cities that speaking through us is safer. The [tv_diplomatic_alliance|E] no longer looks like a project, but like an international habit. Rivals may resent it, but they schedule their resentment around our congresses, marriages, and letters. This is [tv_diplomatic_victory|E] fulfilled: not the absence of conflict, but the presence of our hand on every conflict that matters."
 tv_diplomatic.5.a: "Let the chancelleries write around us."


