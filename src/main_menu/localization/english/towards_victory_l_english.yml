 # ── Cultural Victory Events ───────────────────────────────────────────────
 tv_cultural.1.t: "Cultural Victory：A Patron of the Arts"
 tv_cultural.1.d: "Our court has begun to attract [artist|e]s, sculptors, singers, translators, and men of letters who can smell patronage before it is announced. The first [work_of_art|e]s commissioned in our name do more than flatter the throne; they give strangers a way to imagine us. A court that once measured itself in marriages and campaigns now finds its reputation carried by pigments, verses, carved stone, and clever gossip. This is the first living breath of [tv_cultural_victory|E]. The [tv_arts_exhibition|E] will turn that breath outward, giving our artists roads, audiences, and rivals worthy of them. Politics may command obedience, but beauty teaches people to desire association."
 tv_cultural.1.a: "Make patronage our softest weapon."
 tv_cultural.2.t: "Cultural Victory：The Renaissance Court"
 tv_cultural.2.d: "Word of our court's magnificence has crossed borders more gracefully than any ambassador. Scholars and [artist|e]s seek our patronage because they believe our halls can turn skill into memory, and our [work_of_art|e]s are now praised in places that once knew us only through rumor. The [tv_arts_intl_influence|E] gathered through tours, exhibitions, and cultivated admiration has begun to change the traffic of prestige. Foreign princes ask who painted for us, which poet dined with us, and whether their own courts look provincial by comparison. That question is the real victory. We have made taste political without making it crude."
 tv_cultural.2.a: "Let every court compare itself to ours."
 tv_cultural.3.t: "Cultural Victory：A Centre of Civilisation — Short-term Victory"
 tv_cultural.3.d: "No court in this age now surpasses ours in the arts, letters, ceremony, and learned conversation. The halls are crowded, but not merely with flatterers; they are crowded with people who believe being seen here changes the value of their work. Our [tv_arts_exhibition|E] gives them a wider world, while our palace gives them a center of gravity. This short-term [tv_cultural_victory|E] will echo because it is not confined to one masterpiece or one festival. It is a style of rule, a rhythm of patronage, a reputation that makes talent travel toward us before soldiers ever need to march. Lesser princes collect ornaments; we are collecting an age."
 tv_cultural.3.a: "Let genius queue at our doors."
 tv_cultural.4.t: "Cultural Victory：Light of the World"
 tv_cultural.4.d: "Our [cultural_influence|e] has spread far beyond our borders and returned wearing foreign colors. Other nations imitate our fashions, translate our books, quote our critics, and send their finest minds to study under masters who once waited outside our doors. The [tv_arts_intl_influence|E] we have built no longer behaves like a number; it behaves like a weather pattern. Provincial courts alter their ceremonies before our envoys arrive, fearing the quiet shame of seeming old-fashioned. Even our enemies borrow our language when they wish to sound civilized. The world looks to us as the arbiter of taste, and arbitration is power by another name."
 tv_cultural.4.a: "Set the fashion, then let others chase it."
 tv_cultural.5.t: "Cultural Victory：Long-term Victory — Cultural Hegemon"
 tv_cultural.5.d: "One thousand six hundred [tv_cip|E] now stand behind a cultural achievement no rival can plausibly dismiss. No nation in history has gathered so much beauty, wisdom, ceremony, argument, and wonder into one recognizable name. Long after our [army|e]s are forgotten, the [work_of_art|e]s created in our name will still teach strangers how our age wished to be seen. The [tv_arts_exhibition|E] has carried that name abroad until admiration became expectation and expectation became inheritance. This is [tv_cultural_victory|E] fulfilled: the conversion of patronage into civilization. Empires can lose provinces; a culture that teaches others how to dream has already crossed the border no army can guard."
 tv_cultural.5.a: "Let future centuries borrow our light."


 # ── Science Victory ──────────────────────────────────────────────────────────
