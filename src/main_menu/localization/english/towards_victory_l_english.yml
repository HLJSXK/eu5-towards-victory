 # ── Conquest Victory ─────────────────────────────────────────────────────────
 TV_CONQUEST_TITLE: "Conquest Victory"
 TV_CONQUEST_DESCRIPTION: "Dominate the world through territorial expansion."
 TV_CONQUEST_FLAVOR: ""The greatest happiness is to vanquish your enemies." — Genghis Khan"

 TV_CONQUEST_M1_TITLE: "Conquest Victory — Milestone 1"
 TV_CONQUEST_M1_MEANING: "A nation of modest reach. ~150 owned locations."
 TV_CONQUEST_M1_CONDITIONS: "Conquest score ≥ 150 (direct locations + 0.5 × subject locations)."
 TV_CONQUEST_M1_REWARDS: "+5% Manpower\n+3% Land Morale"
 TV_CONQUEST_M2_TITLE: "Conquest Victory — Milestone 2"
 TV_CONQUEST_M2_MEANING: "A substantial empire. ~350 owned locations."
 TV_CONQUEST_M2_CONDITIONS: "Conquest score ≥ 350 (direct locations + 0.5 × subject locations)."
 TV_CONQUEST_M2_REWARDS: "+10% Supply Limit\n-10% Land Attrition"
 TV_CONQUEST_M3_TITLE: "Conquest Victory — Short-term Victory"
 TV_CONQUEST_M3_MEANING: "Territorial supremacy secured. Short-term Victory. ~600 owned locations."
 TV_CONQUEST_M3_CONDITIONS: "Conquest score ≥ 600 (direct locations + 0.5 × subject locations)."
 TV_CONQUEST_M3_REWARDS: "-10% Stability Cost\n+3% Discipline"
 TV_CONQUEST_M4_TITLE: "Conquest Victory — Milestone 4"
 TV_CONQUEST_M4_MEANING: "An empire spanning continents. ~1100 owned locations."
 TV_CONQUEST_M4_CONDITIONS: "Conquest score ≥ 1,100 (direct locations + 0.5 × subject locations)."
 TV_CONQUEST_M4_REWARDS: "+5% Manpower\n+5% Land Morale\n+10% Supply Limit"
 TV_CONQUEST_M5_TITLE: "Conquest Victory — Long-term Victory"
