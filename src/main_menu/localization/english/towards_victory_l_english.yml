 tv_academy_of_sciences_1_desc: "A first gathering of the realm's finest minds under one roof — the systematic pursuit of natural philosophy begins."
 tv_academy_of_sciences_2: "Academy of Sciences, Phase II"
 tv_academy_of_sciences_2_desc: "New halls, new instruments, new questions. The [tv_academy_of_sciences|E] expands its reach into the deepest mysteries of nature."
 tv_academy_of_sciences_3: "Academy of Sciences, Phase III"
 tv_academy_of_sciences_3_desc: "Scholars arrive from courts across the known world, drawn by the growing reputation of the [tv_academy_of_sciences|E]. We are no longer merely students — we are teachers."
 tv_academy_of_sciences_4: "Academy of Sciences, Phase IV"
 tv_academy_of_sciences_4_desc: "The [tv_academy_of_sciences|E] stands at the frontier of human knowledge, pioneering discoveries that overturn centuries of assumption and reshape what is possible."
 tv_academy_of_sciences_5: "Academy of Sciences, Phase V"
 tv_academy_of_sciences_5_desc: "Steam, iron, and the rational mind are no longer theory. The discoveries of the [tv_academy_of_sciences|E] have become the sinew of a new age — one that will outlast every dynasty."
