 # ── Trade Victory Events ───────────────────────────────────────────────
 tv_trade.1.t: "[tv_trade_victory|E]：The First Markets"
 tv_trade.1.d: "Our [merchant|e]s have won their first reliable places in the great [trade|e] [market|e]s. They do not yet command the world, but their agents know which doors open before dawn, which clerks can be trusted, and which warehouses smell of opportunity. A foothold in commerce is rarely dramatic; it is a stool in a counting house, a seal respected at a quay, a debt repaid on time. Still, the ledgers already show the first pulse of [tv_trade_victory|E]. Coin now travels toward us by habit rather than accident. Let rivals boast of treasures found; we will teach silver to keep appointments."
 tv_trade.1.a: "Sharpen the quills and count the tides."
 tv_trade.2.t: "[tv_trade_victory|E]：Lords of the Trade Route"
 tv_trade.2.d: "The region's caravans and ships have begun to arrange themselves around our convenience. Contracts are drafted in our measures, warehouses wait for our factors, and captains delay departure until our [merchant|e]s finish bargaining. This is not conquest by cannon, but it still changes who must bow before acting. Regional [trade|e] now moves through a network of favors, credit, escorts, and prices that our houses understand better than anyone else. Competitors still sail and ride, but they increasingly do so inside a world we priced for them. The map has roads, but the ledgers have routes of their own."
 tv_trade.2.a: "Let every caravan learn our rates."
 tv_trade.3.t: "[tv_trade_victory|E]：A Great Commercial Empire"
 tv_trade.3.d: "What began as a handful of [merchant|e]s has become an empire of [trade|e], and it needs no throne room to be obeyed. Our name appears in the letters of insurers, the complaints of rivals, the prayers of sailors, and the quiet calculations of rulers who need loans before they need allies. In every great [market|e], someone now asks what we will pay, what we will carry, and what we will refuse. This short-term [tv_trade_victory|E] is measured not only in income, but in anticipation. People prepare for our arrival before our ships are sighted. That is power of a subtler kind, and subtle power often lasts the longest."
 tv_trade.3.a: "Give the counting houses their triumph."
 tv_trade.4.t: "[tv_trade_victory|E]：Masters of the Seas of Commerce"
 tv_trade.4.d: "Our [trade|e] routes now cross the known world like a second set of currents. Ships leave one harbor with cloth, another with spice, another with metal, and all of them seem to return with information as valuable as cargo. Distance has not disappeared, but our [merchant|e] fleets have taught it to charge a lower price. Harbormasters recognize our signals, brokers wait for our news, and distant producers plant or mine with our demand in mind. Each voyage tightens the pattern. We are no longer merely participating in world commerce; we are teaching world commerce where to turn."
 tv_trade.4.a: "Let the compass point toward profit."
 tv_trade.5.t: "[tv_trade_victory|E]：The Trade Hegemon"
 tv_trade.5.d: "We have done what no nation before us managed: we have made the world's commerce answer in our accent. Not every port is ours, not every ship flies our colors, and not every contract bears our seal, but every serious calculation must now include us. Prices tremble when our convoys are delayed. Princes wait for our credit, colonists wait for our cargoes, and rivals build policies around our habits. This is [tv_trade_victory|E] fulfilled, a hegemony written in ledgers rather than marble. It may look quieter than conquest, but no throne is truly steady when its treasury depends on routes we can disturb. The world's commerce is not a place we own; it is a conversation we have learned to lead."
 tv_trade.5.a: "Balance the world in our books."

