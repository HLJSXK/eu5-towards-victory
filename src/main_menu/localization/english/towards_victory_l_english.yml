 TV_CONQUEST_M5_CONDITIONS: "Conquest score ≥ 1,600 (direct locations + 0.5 × subject locations)."
 TV_CONQUEST_M5_REWARDS: "+10% Manpower\n+5% Land Morale\n+5% Discipline"

 # ── Conquest Victory Events ───────────────────────────────────────────────
 tv.conquest.1.t: "The Empire Grows"
 tv.conquest.1.d: "Our armies have marched and our banners now fly over territories once beyond reach. With 150 locations under our dominion, the realm is taking shape."
 tv.conquest.1.a: "Let our dominion grow ever wider."
 tv.conquest.2.t: "A Substantial Empire"
 tv.conquest.2.d: "Our realm now encompasses 350 locations. Supplying our vast armies and reducing the ravages of campaign attrition will be essential to sustaining this empire."
 tv.conquest.2.a: "Our logistics must match our ambition."
 tv.conquest.3.t: "Territorial Supremacy — Short-term Victory"
 tv.conquest.3.d: "Six hundred locations bow before our flag. This is no mere kingdom — this is an empire. Yet governing so vast a domain demands firm administration and a steady hand."
 tv.conquest.3.a: "The realm is ours to govern."
 tv.conquest.4.t: "An Empire Spanning Continents"
 tv.conquest.4.d: "Over a thousand locations have fallen under our sway. The world watches. To hold what we have seized, we must project power with discipline and sustain our armies across every front."
 tv.conquest.4.a: "We shall hold what we have conquered."
 tv.conquest.5.t: "Long-term Victory — World Empire"
 tv.conquest.5.d: "Sixteen hundred locations. No empire in recorded history has claimed so much of the known world. Our legacy is written not in ink but in the march of armies and the raising of banners."
 tv.conquest.5.a: "Our name shall echo through the ages."

 # ── Prosperity Victory Events ─────────────────────────────────────────────
 tv.prosperity.1.t: "A Nation Begins to Thrive"
 tv.prosperity.1.d: "Our people are prospering. Farms yield more, towns bustle with commerce, and the realm's foundations grow stronger with each passing year."
 tv.prosperity.1.a: "Let our prosperity continue to grow."
 tv.prosperity.2.t: "A Flourishing Realm"
 tv.prosperity.2.d: "Sustained investment in our lands is bearing fruit. The population swells, buildings rise, and the wealth of the nation is evident to all who enter our borders."
 tv.prosperity.2.a: "Our people shall want for nothing."
 tv.prosperity.3.t: "Prosperity Victory — The Heartland Thrives"
 tv.prosperity.3.d: "Our realm has achieved a level of domestic prosperity that few nations ever reach. The combination of healthy population, vibrant towns, and well-tended lands marks us as a true short-term victor."
 tv.prosperity.3.a: "Let this prosperity be the foundation of our greatness."
 tv.prosperity.4.t: "An Advanced Nation"
 tv.prosperity.4.d: "Neighbours look upon our realm with envy. Our cities are among the finest in the known world, our population among the most numerous and well-fed. Yet the summit of prosperity still beckons."
 tv.prosperity.4.a: "We shall reach the pinnacle of civilisation."
 tv.prosperity.5.t: "Long-term Victory — The Most Developed Nation"
 tv.prosperity.5.d: "No nation in the known world can rival the prosperity of our realm. Our people are the most numerous, our towns the most prosperous, and our lands the most developed. History shall remember us as the pinnacle of human achievement."
 tv.prosperity.5.a: "Our legacy is written in the flourishing of our people."

