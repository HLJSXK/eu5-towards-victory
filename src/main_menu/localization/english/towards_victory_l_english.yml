l_english:
 # ── Situation ──────────────────────────────────────────────────────────────
 tv_victory_situation: "Towards Victory"
 tv_victory_situation_desc: "Six paths to glory lie open before you. Which legacy shall your realm leave upon the world?"
 TV_VICTORY_SITUATION_TITLE: "Victory Progress"

 # ── Shared milestone circle labels ─────────────────────────────────────────
 TV_MILESTONE_1_LABEL: "1"
 TV_MILESTONE_2_LABEL: "2"
 TV_MILESTONE_V1_LABEL: "V1"
 TV_MILESTONE_4_LABEL: "4"
 TV_MILESTONE_V2_LABEL: "V2"

 # ── Shared tooltip section headers ─────────────────────────────────────────
 TV_TOOLTIP_CONDITIONS_HEADER: "Required Conditions"
 TV_TOOLTIP_REWARDS_HEADER: "Milestone Reward"

 # ── Conquest Victory ──────────────────────────────────────────────────────────
 TV_CONQUEST_TITLE: "Conquest Victory"
 TV_CONQUEST_DESCRIPTION: "The sword writes history. March beyond your borders, seize what others dare not hold, and forge an empire that the world cannot ignore."
 TV_CONQUEST_FLAVOR: "\"The greatest happiness is to vanquish your enemies.\" — Genghis Khan"

 TV_CONQUEST_M1_TITLE: "Conquest Victory — Milestone 1"
 TV_CONQUEST_M1_MEANING: "Beyond your heartland, banners now fly over distant [location|e]s. The empire's first outline is drawn. ~200 [location|e]s."
 TV_CONQUEST_M1_TRIGGER_DESC: "[tv_conquest_score|e] ≥ 200"
 TV_CONQUEST_M2_TITLE: "Conquest Victory — Milestone 2"
 TV_CONQUEST_M2_MEANING: "A substantial empire takes shape, its frontiers drawn by the march of [army|e]s. ~400 [location|e]s."
 TV_CONQUEST_M2_TRIGGER_DESC: "[tv_conquest_score|e] ≥ 400"
 TV_CONQUEST_M3_TITLE: "Conquest Victory — Short-term Victory"
 TV_CONQUEST_M3_MEANING: "Territorial supremacy secured — no neighbour may challenge your [location|e] count without ruin. Short-term Victory. ~600 [location|e]s."
 TV_CONQUEST_M3_TRIGGER_DESC: "[tv_conquest_score|e] ≥ 600"
 TV_CONQUEST_M4_TITLE: "Conquest Victory — Milestone 4"
 TV_CONQUEST_M4_MEANING: "An empire spanning continents — distance itself becomes the adversary your [army|e]s must defeat. ~1,200 [location|e]s."
 TV_CONQUEST_M4_TRIGGER_DESC: "[tv_conquest_score|e] ≥ 1,200"
 TV_CONQUEST_M5_TITLE: "Conquest Victory — Long-term Victory"
 TV_CONQUEST_M5_MEANING: "A world empire without rival or precedent. The last [location|e]s fall into the vast whole. Long-term Victory. ~2,500 [location|e]s."
 TV_CONQUEST_M5_TRIGGER_DESC: "[tv_conquest_score|e] ≥ 2,500"

 # ── Conquest Victory Events ───────────────────────────────────────────────
 tv_conquest.1.t: "The Empire Grows"
 tv_conquest.1.d: "Our [army|e]s have marched and our banners now fly over [location|e]s once beyond reach. With 200 [location|e]s under our dominion, the realm is taking shape."
 tv_conquest.1.a: "Let our dominion grow ever wider."
 tv_conquest.2.t: "A Substantial Empire"
 tv_conquest.2.d: "Our realm now encompasses 400 [location|e]s. Supplying our vast [army|e]s and reducing the ravages of campaign [attrition|e] will be essential to sustaining this empire."
 tv_conquest.2.a: "Our logistics must match our ambition."
 tv_conquest.3.t: "Territorial Supremacy — Short-term Victory"
 tv_conquest.3.d: "Six hundred [location|e]s bow before our flag. This is no mere kingdom — this is an empire. Yet governing so vast a domain demands firm administration and a steady hand."
 tv_conquest.3.a: "The realm is ours to govern."
 tv_conquest.4.t: "An Empire Spanning Continents"
 tv_conquest.4.d: "Over 1,200 [location|e]s have fallen under our sway. The world watches. To hold what we have seized, we must project power with discipline and sustain our [army|e]s across every front."
 tv_conquest.4.a: "We shall hold what we have conquered."
 tv_conquest.5.t: "Long-term Victory — World Empire"
 tv_conquest.5.d: "Two thousand five hundred [location|e]s. No empire in recorded history has claimed so much of the known world. Our legacy is written not in ink but in the march of [army|e]s and the raising of banners."
 tv_conquest.5.a: "Our name shall echo through the ages."


 # ── Prosperity Victory ──────────────────────────────────────────────────────────
 TV_PROSPERITY_TITLE: "Prosperity Victory"
 TV_PROSPERITY_DESCRIPTION: "True greatness is not measured in miles of conquest, but in the full granaries, the thriving towns, and the flourishing of a people who want for nothing."
 TV_PROSPERITY_FLAVOR: "\"Prosperity is the fruit of labour.\" — Thucydides"

 TV_PROSPERITY_M1_TITLE: "Prosperity Victory — Milestone 1"
 TV_PROSPERITY_M1_MEANING: "The first signs of [prosperity|e]: fields yield more, towns grow, and [population|e] swells. Score ~5,000."
 TV_PROSPERITY_M1_TRIGGER_DESC: "[tv_prosperity_score|e] ≥ 5,000"
 TV_PROSPERITY_M2_TITLE: "Prosperity Victory — Milestone 2"
 TV_PROSPERITY_M2_MEANING: "A flourishing realm — sustained [development|e] and investment in [building|e]s bears tangible fruit. Score ~8,000."
 TV_PROSPERITY_M2_TRIGGER_DESC: "[tv_prosperity_score|e] ≥ 8,000"
 TV_PROSPERITY_M3_TITLE: "Prosperity Victory — Short-term Victory"
 TV_PROSPERITY_M3_MEANING: "A prosperous heartland that sets the standard for the age. Short-term Victory. Score ~12,000."
 TV_PROSPERITY_M3_TRIGGER_DESC: "[tv_prosperity_score|e] ≥ 12,000"
 TV_PROSPERITY_M4_TITLE: "Prosperity Victory — Milestone 4"
 TV_PROSPERITY_M4_MEANING: "An advanced nation — neighbouring powers envy your [population|e] and the splendour of your towns. Score ~18,000."
 TV_PROSPERITY_M4_TRIGGER_DESC: "[tv_prosperity_score|e] ≥ 18,000"
 TV_PROSPERITY_M5_TITLE: "Prosperity Victory — Long-term Victory"
 TV_PROSPERITY_M5_MEANING: "The most [development|e]-advanced nation on earth, its [wealth|e] and [population|e] unrivalled. Long-term Victory. Score ~25,000."
 TV_PROSPERITY_M5_TRIGGER_DESC: "[tv_prosperity_score|e] ≥ 25,000"

 # ── Prosperity Victory Events ───────────────────────────────────────────────
 tv_prosperity.1.t: "A Nation Begins to Thrive"
 tv_prosperity.1.d: "Our people are prospering. Farms yield more, towns bustle with commerce, and the realm's foundations grow stronger with each passing year."
 tv_prosperity.1.a: "Let our prosperity continue to grow."
 tv_prosperity.2.t: "A Flourishing Realm"
 tv_prosperity.2.d: "Sustained investment in our lands is bearing fruit. The [population|e] swells, [building|e]s rise, and the [wealth|e] of the nation is evident to all who enter our borders."
 tv_prosperity.2.a: "Our people shall want for nothing."
 tv_prosperity.3.t: "Prosperity Victory — The Heartland Thrives"
 tv_prosperity.3.d: "Our realm has achieved a level of [prosperity|e] that few nations ever reach. Healthy [population|e], vibrant towns, and well-tended lands mark us as a true short-term victor."
 tv_prosperity.3.a: "Let this prosperity be the foundation of our greatness."
 tv_prosperity.4.t: "An Advanced Nation"
 tv_prosperity.4.d: "Neighbours look upon our realm with envy. Our cities are among the finest in the known world, our [population|e] among the most numerous and well-fed. Yet the summit of [prosperity|e] still beckons."
 tv_prosperity.4.a: "We shall reach the pinnacle of civilisation."
 tv_prosperity.5.t: "Long-term Victory — The Most Developed Nation"
 tv_prosperity.5.d: "No nation in the known world can rival the [prosperity|e] of our realm. Our people are the most numerous, our towns the most prosperous, and our lands the most developed. History shall remember us as the pinnacle of human achievement."
 tv_prosperity.5.a: "Our legacy is written in the flourishing of our people."


 # ── Trade Victory ──────────────────────────────────────────────────────────
 TV_TRADE_TITLE: "Trade Victory"
 TV_TRADE_DESCRIPTION: "The ledger is mightier than the sword. Command the world's [market|e]s, and let every coin spent in every port find its way to your treasury."
 TV_TRADE_FLAVOR: "\"Venice does not make war; Venice makes money.\""

 TV_TRADE_M1_TITLE: "Trade Victory — Milestone 1"
 TV_TRADE_M1_MEANING: "A [merchant|e] of note — seated at the heart of a great [market_center|e]. Monthly [trade_income|e] ~100."
 TV_TRADE_M1_TRIGGER_DESC: "[tv_trade_score|e] ≥ 100"
 TV_TRADE_M2_TITLE: "Trade Victory — Milestone 2"
 TV_TRADE_M2_MEANING: "A maritime power — dominating regional [trade|e]. Monthly [trade_income|e] ~200."
 TV_TRADE_M2_TRIGGER_DESC: "[tv_trade_score|e] ≥ 200"
 TV_TRADE_M3_TITLE: "Trade Victory — Short-term Victory"
 TV_TRADE_M3_MEANING: "A great [trade|e] empire, our name known in every counting house. Short-term Victory. Monthly [trade_income|e] ~400."
 TV_TRADE_M3_TRIGGER_DESC: "[tv_trade_score|e] ≥ 400, with market dominance"
 TV_TRADE_M4_TITLE: "Trade Victory — Milestone 4"
 TV_TRADE_M4_MEANING: "Near-monopoly control of the world's key [market|e]s — rivals count their losses. Monthly [trade_income|e] ~1,000."
 TV_TRADE_M4_TRIGGER_DESC: "[tv_trade_score|e] ≥ 1,000"
 TV_TRADE_M5_TITLE: "Trade Victory — Long-term Victory"
 TV_TRADE_M5_MEANING: "Undisputed [trade|e] hegemon. Long-term Victory. Monthly [trade_income|e] ~2,000."
 TV_TRADE_M5_TRIGGER_DESC: "[tv_trade_score|e] ≥ 2,000, with market dominance"

 # ── Trade Victory Events ───────────────────────────────────────────────
 tv_trade.1.t: "The First Markets"
 tv_trade.1.d: "Our [merchant|e]s have gained a foothold in the great [trade|e] [market|e]s. Let them grow rich."
 tv_trade.1.a: "Open the ledgers."
 tv_trade.2.t: "Lords of the Trade Route"
 tv_trade.2.d: "Our commercial networks now dominate the region. The caravans and ships answer to us."
 tv_trade.2.a: "Send more merchants."
 tv_trade.3.t: "A Great Commercial Empire"
 tv_trade.3.d: "What began as a handful of [merchant|e]s has grown into an empire of [trade|e]. Our name is known in every great [market|e]."
 tv_trade.3.a: "Glory to the merchant class."
 tv_trade.4.t: "Masters of the Seas of Commerce"
 tv_trade.4.d: "Our [trade|e] routes crisscross the known world. Distance itself bows to our [merchant|e] fleets."
 tv_trade.4.a: "Chart new routes."
 tv_trade.5.t: "The Trade Hegemon"
 tv_trade.5.d: "We have done what no nation has done before: we have made the world's commerce our own. This victory is eternal."
 tv_trade.5.a: "Our ledgers overflow."

 tv_trade_market_dominance_5_tt:0 "Leading [merchant|e] in at least 5 [market|e]s"
 tv_trade_market_dominance_10_tt:0 "Leading [merchant|e] in at least 10 [market|e]s"

 # ── Diplomatic Victory ──────────────────────────────────────────────────────────
 TV_DIPLOMATIC_TITLE: "Diplomatic Victory"
 TV_DIPLOMATIC_DESCRIPTION: "War leaves only widows and ruins. True power is the art of making every throne your [alliance|e] partner, every border your [guarantee|e], and every prince your debtor."
 TV_DIPLOMATIC_FLAVOR: "\"An army is of little use where reason fails.\""

 TV_DIPLOMATIC_M1_TITLE: "Diplomatic Victory — Milestone 1"
 TV_DIPLOMATIC_M1_MEANING: "50 [tv_diplomatic_victory_points|e]. A voice that carries weight in the courts of nations."
 TV_DIPLOMATIC_M1_TRIGGER_DESC: "[tv_diplomatic_victory_points|e] ≥ 50"
 TV_DIPLOMATIC_M2_TITLE: "Diplomatic Victory — Milestone 2"
 TV_DIPLOMATIC_M2_MEANING: "120 [tv_diplomatic_victory_points|e]. A reliable ally — princes seek your [guarantee|e] before they seek your sword."
 TV_DIPLOMATIC_M2_TRIGGER_DESC: "[tv_diplomatic_victory_points|e] ≥ 120"
 TV_DIPLOMATIC_M3_TITLE: "Diplomatic Victory — Short-term Victory"
 TV_DIPLOMATIC_M3_MEANING: "220 [tv_diplomatic_victory_points|e]. A power of the first diplomatic rank — [treaty|e]s bear your seal. Short-term Victory."
 TV_DIPLOMATIC_M3_TRIGGER_DESC: "[tv_diplomatic_victory_points|e] ≥ 220"
 TV_DIPLOMATIC_M4_TITLE: "Diplomatic Victory — Milestone 4"
 TV_DIPLOMATIC_M4_MEANING: "380 [tv_diplomatic_victory_points|e]. The arbiter of international order — no quarrel is settled without your consent."
 TV_DIPLOMATIC_M4_TRIGGER_DESC: "[tv_diplomatic_victory_points|e] ≥ 380"
 TV_DIPLOMATIC_M5_TITLE: "Diplomatic Victory — Long-term Victory"
 TV_DIPLOMATIC_M5_MEANING: "580 [tv_diplomatic_victory_points|e]. Undisputed diplomatic hegemon — the web of [alliance|e]s and [royal_marriage|e]s is yours alone. Long-term Victory."
 TV_DIPLOMATIC_M5_TRIGGER_DESC: "[tv_diplomatic_victory_points|e] ≥ 580"

 # ── Diplomatic Victory Events ───────────────────────────────────────────────
 tv_diplomatic.1.t: "A Voice Among Nations"
 tv_diplomatic.1.d: "Our patient diplomacy has begun to bear fruit. Through [alliance|e]s and [royal_marriage|e]s, our nation is earning a place at the table of [great_power|e]s. Ten nations have pledged their diplomatic support — together, we shall form a grand alliance."
 tv_diplomatic.1.a: "Let our word carry weight."
 tv_diplomatic.2.t: "A Reliable Ally"
 tv_diplomatic.2.d: "Nations seek us out as [guarantee|e]ors and partners. Our willingness to honour our commitments has built a reputation that money cannot buy."
 tv_diplomatic.2.a: "Our word is our bond."
 tv_diplomatic.3.t: "A Power of the First Rank — Short-term Victory"
 tv_diplomatic.3.d: "Our diplomatic reach extends across continents. [treaty|e]s bear our seal, and [diplomat|e]s from distant courts seek our counsel. We have achieved a short-term diplomatic victory."
 tv_diplomatic.3.a: "The world listens when we speak."
 tv_diplomatic.4.t: "Arbiter of Nations"
 tv_diplomatic.4.d: "No quarrel between princes is settled without our consent. Our [subject|e]s are loyal, our [alliance|e] partners numerous, and our influence unmatched in this age."
 tv_diplomatic.4.a: "We shall keep the peace of the world."
 tv_diplomatic.5.t: "Long-term Victory — Diplomatic Hegemon"
 tv_diplomatic.5.d: "Five hundred and eighty points of diplomatic achievement. No nation in history has woven so vast a web of [alliance|e]s, [royal_marriage|e]s, and mutual [guarantee|e]s. Our legacy is written not in conquest but in the peace we preserved."
 tv_diplomatic.5.a: "Our name shall be synonymous with statecraft."


 # ── Cultural Victory ──────────────────────────────────────────────────────────
 TV_CULTURAL_TITLE: "Cultural Victory"
 TV_CULTURAL_DESCRIPTION: "Empires rise and crumble, but great art endures. Let your court be the envy of princes, your [artist|e]s the voice of an age, and your culture outlast every conqueror."
 TV_CULTURAL_FLAVOR: "\"Art is the signature of civilisations.\""

 TV_CULTURAL_M1_TITLE: "Cultural Victory — Milestone 1"
 TV_CULTURAL_M1_MEANING: "100 [tv_cultural_influence_points|e]. Your court draws its first [artist|e]s and patrons — a cultural legacy begins."
 TV_CULTURAL_M1_TRIGGER_DESC: "[tv_cultural_influence_points|e] ≥ 100"
 TV_CULTURAL_M2_TITLE: "Cultural Victory — Milestone 2"
 TV_CULTURAL_M2_MEANING: "200 [tv_cultural_influence_points|e]. A celebrated cultural power — [work_of_art|e]s from your court speak of your greatness."
 TV_CULTURAL_M2_TRIGGER_DESC: "[tv_cultural_influence_points|e] ≥ 200  •  International Influence ≥ 25"
 TV_CULTURAL_M3_TITLE: "Cultural Victory — Short-term Victory"
 TV_CULTURAL_M3_MEANING: "400 [tv_cultural_influence_points|e]. A centre of Renaissance brilliance — [artist|e]s from across the world seek your court. Short-term Victory."
 TV_CULTURAL_M3_TRIGGER_DESC: "[tv_cultural_influence_points|e] ≥ 400  •  International Influence ≥ 50"
 TV_CULTURAL_M4_TITLE: "Cultural Victory — Milestone 4"
 TV_CULTURAL_M4_MEANING: "800 [tv_cultural_influence_points|e]. [cultural_influence|e] radiates from your court across the world — your [artist|e]s define the age."
 TV_CULTURAL_M4_TRIGGER_DESC: "[tv_cultural_influence_points|e] ≥ 800  •  International Influence ≥ 75"
 TV_CULTURAL_M5_TITLE: "Cultural Victory — Long-term Victory"
 TV_CULTURAL_M5_MEANING: "1600 [tv_cultural_influence_points|e]. The greatest cultural legacy in history — [work_of_art|e]s made in your name will outlast every empire. Long-term Victory."
 TV_CULTURAL_M5_TRIGGER_DESC: "[tv_cultural_influence_points|e] ≥ 1600  •  International Influence ≥ 100"

 # ── Cultural Victory Events ───────────────────────────────────────────────
 tv_cultural.1.t: "A Patron of the Arts"
 tv_cultural.1.d: "Our court has begun to attract [artist|e]s, sculptors, and men of letters. The [work_of_art|e]s commissioned in our name already speak to something greater than mere politics — a civilisation is taking shape."
 tv_cultural.1.a: "Let the arts flourish in our name."
 tv_cultural.2.t: "The Renaissance Court"
 tv_cultural.2.d: "Word of our court's magnificence has spread to distant lands. Scholars and [artist|e]s seek our patronage, and the [work_of_art|e]s we commission are spoken of with admiration by princes and popes alike."
 tv_cultural.2.a: "Our court shall be a beacon of learning."
 tv_cultural.3.t: "A Centre of Civilisation — Short-term Victory"
 tv_cultural.3.d: "No court in this age surpasses ours in the arts, letters, and learning. We have achieved what lesser princes can only dream of — a short-term cultural victory that will echo through the centuries."
 tv_cultural.3.a: "Civilisation itself radiates from our halls."
 tv_cultural.4.t: "Light of the World"
 tv_cultural.4.d: "Our [cultural_influence|e] has spread far beyond our borders. Other nations imitate our fashions, adopt our ideas, and send their finest minds to study under our masters. The world looks to us as the arbiter of taste and refinement."
 tv_cultural.4.a: "We shall carry the torch of civilisation."
 tv_cultural.5.t: "Long-term Victory — Cultural Hegemon"
 tv_cultural.5.d: "One thousand six hundred points of cultural achievement. No nation in history has produced so much beauty, wisdom, and wonder. Long after our [army|e]s are forgotten, the [work_of_art|e]s created in our name will endure as the greatest cultural legacy the world has ever known."
 tv_cultural.5.a: "Our name shall be synonymous with civilisation itself."


 # ── Science Victory ──────────────────────────────────────────────────────────
 TV_SCIENCE_TITLE: "Scientific Victory"
 TV_SCIENCE_DESCRIPTION: "While others sharpen their blades, sharpen your minds. The nation that masters nature's secrets commands not just its own age, but the shape of all ages to come."
 TV_SCIENCE_FLAVOR: "\"The true method of knowledge is experiment.\" — William Blake"

 TV_SCIENCE_M1_TITLE: "Scientific Victory — Milestone 1"
 TV_SCIENCE_M1_MEANING: "A nation of curious minds — one hundred [advance|e]s claimed in the pursuit of knowledge."
 TV_SCIENCE_M1_TRIGGER_DESC: "[tv_science_score|e] ≥ 100 and Academy Level ≥ 1"
 TV_SCIENCE_M2_TITLE: "Scientific Victory — Milestone 2"
 TV_SCIENCE_M2_MEANING: "A realm that embraces the great [institution|e]s of this era — one hundred and fifty [advance|e]s mastered."
 TV_SCIENCE_M2_TRIGGER_DESC: "[tv_science_score|e] ≥ 150 and Academy Level ≥ 2"
 TV_SCIENCE_M3_TITLE: "Scientific Victory — Short-term Victory"
 TV_SCIENCE_M3_MEANING: "A vanguard of learning — two hundred [advance|e]s. Short-term Victory. No nation rivals your command of knowledge."
 TV_SCIENCE_M3_TRIGGER_DESC: "[tv_science_score|e] ≥ 200 and Academy Level ≥ 3"
 TV_SCIENCE_M4_TITLE: "Scientific Victory — Milestone 4"
 TV_SCIENCE_M4_MEANING: "The preeminent scientific power — three hundred [advance|e]s, generations of investment made manifest."
 TV_SCIENCE_M4_TRIGGER_DESC: "[tv_science_score|e] ≥ 300 and Academy Level ≥ 4"
 TV_SCIENCE_M5_TITLE: "Scientific Victory — Long-term Victory"
 TV_SCIENCE_M5_MEANING: "The nation that ushered in the Industrial Age — four hundred [advance|e]s. Long-term Victory. The future belongs to you."
 TV_SCIENCE_M5_TRIGGER_DESC: "[tv_science_score|e] ≥ 400 and Academy Level ≥ 5"

 # ── Science Victory Events ───────────────────────────────────────────────
 tv_science.1.t: "A Nation of Scholars"
 tv_science.1.d: "Our universities and academies are beginning to bear fruit. One hundred [advance|e]s researched — our realm stands at the vanguard of learning in this age."
 tv_science.1.a: "Knowledge shall light our way forward."
 tv_science.2.t: "Embracing New Ideas"
 tv_science.2.d: "Our scholars have absorbed and spread the great [institution|e]s of this era. One hundred and fifty [advance|e]s stand to our name, and foreign thinkers seek the patronage of our court."
 tv_science.2.a: "Open minds conquer more than armies."
 tv_science.3.t: "A Centre of Learning — Short-term Victory"
 tv_science.3.d: "No nation rivals our command of the sciences and arts of governance. Two hundred [advance|e]s — a short-term scientific victory that marks us as the intellectual power of our age."
 tv_science.3.a: "Reason and inquiry shall carry us forward."
 tv_science.4.t: "On the Threshold of Modernity"
 tv_science.4.d: "Our natural philosophers and engineers now push at the very boundaries of the known world. Three hundred [advance|e]s stand as testament to generations of investment in learning."
 tv_science.4.a: "The age of steam and iron awaits."
 tv_science.5.t: "Long-term Victory — The Industrial Vanguard"
 tv_science.5.d: "Four hundred [advance|e]s. Steam, iron, and the rational mind have remade our nation. Long after the old empires crumble, the knowledge forged in our academies will transform the world entire."
 tv_science.5.a: "Our name shall be synonymous with progress itself."

 tv_academy_of_sciences_1: "Academy of Sciences, Phase I"
 tv_academy_of_sciences_1_desc: "A first gathering of the realm's finest minds under one roof — the systematic pursuit of natural philosophy begins."
 tv_academy_of_sciences_2: "Academy of Sciences, Phase II"
 tv_academy_of_sciences_2_desc: "New halls, new instruments, new questions. The Academy expands its reach into the deepest mysteries of nature."
 tv_academy_of_sciences_3: "Academy of Sciences, Phase III"
 tv_academy_of_sciences_3_desc: "Scholars arrive from courts across the known world, drawn by the Academy's growing reputation. We are no longer merely students — we are teachers."
 tv_academy_of_sciences_4: "Academy of Sciences, Phase IV"
 tv_academy_of_sciences_4_desc: "The Academy stands at the frontier of human knowledge, pioneering discoveries that overturn centuries of assumption and reshape what is possible."
 tv_academy_of_sciences_5: "Academy of Sciences, Phase V"
 tv_academy_of_sciences_5_desc: "Steam, iron, and the rational mind are no longer theory. The Academy's discoveries have become the sinew of a new age — one that will outlast every dynasty."
