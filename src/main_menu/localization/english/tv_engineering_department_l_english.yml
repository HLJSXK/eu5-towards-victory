 tv_engineering_department.10.t: "[tv_great_engineer|E]：Great Engineer Has Died"
 tv_engineering_department.10.d: "Our [tv_great_engineer|E] has passed away. The news moves through the [tv_engineering_department|e] by way of closed drawing cases, stopped surveying tables, and assistants suddenly unwilling to erase the last chalk marks. Every unfinished plan now looks more fragile than it did yesterday. The wonder mechanism can keep its ledgers, but [tv_wonder_construction|e] needs a living mind to turn ambition into sequence. Until a successor is appointed, the realm has stone, labor, and hope, but no master builder to make them agree."
 tv_engineering_department.10.a: "Find a successor before the plans go cold."
 tv_engineering_department.20.t: "[tv_wonder_construction|E]：Wonder Project Collapses"
 tv_engineering_department.20.d: "The reserve of [tv_wonder_domestic_support|e] has drained away. Courtiers who once praised the project now remember urgent business elsewhere, estate spokesmen rediscover their objections, and suppliers ask for payment before another cart moves. With the great project indefensible, the [tv_engineering_department|e] must abandon the locked wonder and bear the disgrace. The ground remains, the early marks remain, and perhaps some stones remain, but the political bridge beneath them has collapsed. No monument can stand on silence, fear, and unpaid promises."
 tv_engineering_department.20.a: "Let the shame be recorded cleanly."
 tv_engineering_department.100.t: "[tv_wonder_construction|E]：Noble Houses Rally"
 tv_engineering_department.100.d: "Several noble houses have decided that the wonder will magnify their own memory as much as the realm's. Their heralds speak of ancestral seats, immortal names, and the pleasant possibility that future generations may confuse private glory with public purpose. The [tv_engineering_department|e] does not correct them. Support is support, and [tv_wonder_domestic_support|e] often arrives wearing jewelry. Their voices now echo through court with useful volume."
 tv_engineering_department.100.a: "Let them be seen."
 tv_engineering_department.101.t: "[tv_wonder_construction|E]：Noble Backlash"
 tv_engineering_department.101.d: "Rumors spread that the wonder will consume noble privilege without returning sufficient honor. A few houses have begun counting not the monument's future splendor, but the seats, exemptions, laborers, and ceremonial precedence it may cost them. The [tv_engineering_department|e] can measure stone, but wounded rank is harder to survey. Support among the aristocracy falters, and every hesitation makes the whole project sound heavier. Pride may be lighter than marble, but it is much harder to lift."
 tv_engineering_department.101.a: "Their pride is expensive."
 tv_engineering_department.102.t: "[tv_wonder_construction|E]：Burghers See Opportunity"
 tv_engineering_department.102.d: "Guildmasters and financiers begin to speak of contracts, roads, warehouses, and future crowds. They see in the wonder not only magnificence, but invoices, transport rights, rented rooms, and grandchildren still collecting fees. The [tv_engineering_department|e] listens carefully, because commerce has a talent for making ambition sound practical. Their enthusiasm gives the debate new momentum. Prosperity has arrived with ink-stained fingers and excellent arithmetic."
 tv_engineering_department.102.a: "Prosperity has a persuasive voice."
 tv_engineering_department.103.t: "[tv_wonder_construction|E]：Merchants Count the Cost"
 tv_engineering_department.103.d: "Some burghers now warn that the wonder will tie up labor, credit, and transport. They do not denounce glory outright; they merely ask how many wagons, wages, and warehouses must be trapped beneath it. Such caution is harder to dismiss than panic, because every sentence arrives with a plausible column of numbers. The [tv_engineering_department|e] feels public confidence cool by degrees. Ledgers can wound as sharply as speeches when read aloud."
 tv_engineering_department.103.a: "Ledgers can wound as sharply as speeches."
 tv_engineering_department.104.t: "[tv_wonder_construction|E]：Clerical Blessing"
 tv_engineering_department.104.d: "Prominent clergy frame the wonder as a visible sign of order and devotion. Sermons compare measured stone to obedient souls, stable foundations to faithful doctrine, and public labor to the discipline of a righteous people. The [tv_engineering_department|e] benefits from this language even when the engineers privately prefer plumb lines to metaphors. The debate gains a solemn, reassuring tone. [tv_wonder_domestic_support|E] rises more easily when heaven appears to approve the scaffolds."
 tv_engineering_department.104.a: "A useful blessing."
 tv_engineering_department.105.t: "[tv_wonder_construction|E]：Sermons Against Excess"
 tv_engineering_department.105.d: "Preachers condemn the project as vanity dressed in stone. They ask whether a hungry village needs marble, whether the ruler's soul can be saved by height, and whether pride becomes holy merely because a mason has measured it. The charge finds listeners among those already uneasy with the cost. The [tv_engineering_department|e] can answer many objections, but sermons are built to survive counterarguments. Faith can bless foundations, and it can also refuse them."
 tv_engineering_department.105.a: "Faith can also refuse marble."
 tv_engineering_department.200.t: "[tv_wonder_construction|E]：A Wonder Unit Completed"
 tv_engineering_department.200.d: "Another section of the wonder has crossed a visible threshold. Scaffolds come down, overseers mark the completed unit, and workers stand back with the cautious pride of people who know the next task will be just as heavy. The public can finally see that the impossible is becoming stone, beam, channel, or vault. Even critics find it harder to mock something that casts a shadow. [tv_wonder_construction|E] has gained not only progress, but proof."
 tv_engineering_department.200.a: "Keep the work moving."
 tv_engineering_department.201.t: "[tv_wonder_construction|E]：The Wonder Rises"
 tv_engineering_department.201.d: "At [SCOPE.sLocation('tv_wonder_event_location').GetName], the four completed modules have served their purpose. Their temporary works can now be dismantled, and construction can finally begin on the preserved core of the wonder itself. Foundation, body, function, and crowning are no longer competing fragments; they are ready to be folded into a single monument."
 tv_engineering_department.201.a: "Dismantle the modules and raise the core."
 tv_engineering_department.202.t: "[tv_wonder_construction|E]：The Work Stands Complete"
 tv_engineering_department.202.d: "The [tv_engineering_department|E] has declared the construction phase complete. The worksites are dismantled, the work crews withdraw, and the last contractor ledgers close with a satisfaction that only accountants truly enjoy. The monument now stands, but stone alone is not yet destiny. The unfinished question has changed from how to build it to how to consecrate it. The realm has made a body; the [tv_wonder_ceremony|e] must now give it a public soul."
 tv_engineering_department.202.a: "Prepare the ceremony."
 tv_engineering_department.203.t: "[tv_wonder_construction|E]：The Debate Is Settled"
 tv_engineering_department.203.d: "The court has announced the end of the wonder debate. Opposition has not vanished, but it has been counted, answered, bought down, or folded into the official plan. The project now leaves speeches behind and enters the measured world of ground, roads, grades, and distances. The [tv_great_engineer|e] asks for a site to survey. From this point forward, [tv_wonder_domestic_support|e] will slowly drain, so the next order should be practical: choose where the monument can actually stand."
 tv_engineering_department.203.a: "Begin the survey."
 tv_engineering_department.300.t: "[tv_wonder_survey|E]：Survey Completed"
 tv_engineering_department.300.d_high: "The [tv_wonder_survey|E] returns with excellent readings. The chosen ground can bear ambition, supplies can reach it, and the work crews see a path through the terrain before the first permanent camp is raised. The [tv_great_engineer|e] reads the tables twice, not because the numbers are doubtful, but because good news deserves verification. Scale, logistics, and organization now point in the same direction. The site seems almost eager to become difficult in useful ways."
 tv_engineering_department.300.d_mid: "The [tv_wonder_survey|E] returns with usable readings. The site will not make the work effortless, but no honest wonder ever promised that. The ground has limits, the roads have moods, and the labor plan will need discipline rather than romance. Still, the [tv_engineering_department|e] can now plan around the weaknesses it has named. A measured obstacle is already half domesticated."
 tv_engineering_department.300.d_low: "The [tv_wonder_survey|E] returns with troubling readings. The site can still be declared, but the maps look nervous and the surveyors choose their words with professional care. Ground, routes, or labor organization may resist our ambition more than first expected. The [tv_engineering_department|e] warns that a different location may serve the wonder better. To proceed here would be a decision made with open eyes, which is better than blindness and more expensive than confidence."
 tv_engineering_department.300.a: "Review the result."
 tv_engineering_department.310.t: "[tv_wonder_survey|E]：Hidden Foundations"
 tv_engineering_department.310.d: "Surveyors uncover stable ground and old stone beneath the proposed works. What first seemed merely solid now appears almost prepared, as if some forgotten hand had left the earth in useful order. The [tv_wonder_survey|e] teams argue happily over load, depth, and the rare pleasure of finding a problem that has solved itself. The wonder's possible scale looks more generous than first assumed. Even the [tv_great_engineer|e] allows a smile before asking for another measurement."
 tv_engineering_department.310.a: "Excellent."
 tv_engineering_department.311.t: "[tv_wonder_survey|E]：Treacherous Ground"
 tv_engineering_department.311.d: "The ground shifts where the first maps promised certainty. Stakes lean, chalk lines no longer agree with one another, and the survey crews start speaking in shorter sentences. Additional supports will narrow the wonder's practical scale, not because ambition has weakened, but because the earth has answered with conditions of its own. The [tv_engineering_department|e] can still proceed. It must simply stop pretending that ground is passive."
 tv_engineering_department.311.a: "Adjust the plans."
 tv_engineering_department.312.t: "[tv_wonder_survey|E]：Clear Supply Lines"
 tv_engineering_department.312.d: "The [tv_wonder_survey|E] finds routes that can carry stone, timber, and tools with less friction than expected. A neglected road joins a usable river bend, a staging field proves wider than memory, and local carriers already know shortcuts that no royal map bothered to learn. [tv_wonder_materials|E] will move more cleanly because the land has offered several quiet favors. Logistics, for once, does not arrive as an accusation. It arrives as a map with good margins."
 tv_engineering_department.312.a: "Mark them carefully."
 tv_engineering_department.313.t: "[tv_wonder_survey|E]：Broken Approaches"
 tv_engineering_department.313.d: "Roads, waterways, and staging grounds prove worse than the first reports claimed. Wheels sink where the road should hold, boats lose time where water should carry, and staging fields shrink the moment real wagons enter them. Logistics will be harder to tame, and [tv_wonder_materials|e] will not forgive optimism. The [tv_engineering_department|e] now faces the old truth of great works: a monument begins long before the stone reaches it. Sometimes it begins with mud."
 tv_engineering_department.313.a: "We will compensate."
 tv_engineering_department.314.t: "[tv_wonder_survey|E]：Order in the Field"
 tv_engineering_department.314.d: "The measuring crews settle into a clean rhythm. Flags are set, notes are copied, overseers stop contradicting one another, and rough observations become a system future labor can actually obey. This is not a dramatic discovery, but it may be more useful than one. [tv_wonder_construction|E] depends on the dull miracle of many people doing the same thing in the same order. Today, that miracle looks possible."
 tv_engineering_department.314.a: "A good habit."
 tv_engineering_department.315.t: "[tv_wonder_survey|E]：Survey Confusion"
 tv_engineering_department.315.d: "Contradictory maps and rival overseers slow the work. One crew swears by the ridge, another by the road, and a third has produced a table so precise that everyone distrusts it immediately. The [tv_engineering_department|e] loses confidence in its future organization plan because confusion, once written down, looks almost official. The wonder can survive bad ground more easily than bad command. Before labor begins, someone must teach the maps to agree."
 tv_engineering_department.315.a: "Untangle it."
 tv_engineering_department.320.t: "[tv_wonder_survey|E]：Special Instruments Requested"
 tv_engineering_department.320.d: "The surveyors request costly instruments and specialist artisans. They speak of angles too fine for ordinary sight, soil tests too delicate for guesswork, and measurements that would make the [tv_great_engineer|e]'s scale assessment less dependent on noble optimism. The court hears expense; the engineers hear precision. Funding them should improve the survey, but it will also teach every future requester that accuracy has a price. Refusal leaves the old tools in place and the unknowns politely smiling."
 tv_engineering_department.320.a: "Pay for precision."
 tv_engineering_department.320.b: "Make do with what we have."
 tv_engineering_department.321.t: "[tv_wonder_survey|E]：Prestige of Expertise"
 tv_engineering_department.321.d: "The [tv_great_engineer|E] asks the court to publicly back a controversial logistics method. The proposal promises faster movement of [tv_wonder_materials|e], fewer idle laborers, and exactly the sort of novelty that makes conservative overseers begin clearing their throats. Lending the realm's prestige may make the supply plan more convincing. If it fails, the embarrassment will also be public. Great projects often ask the state to gamble before the first crowd understands the rules."
 tv_engineering_department.321.a: "Stake our name on it."
 tv_engineering_department.321.b: "No public endorsement."
 tv_engineering_department.322.t: "[tv_wonder_survey|E]：Guild Coordination"
 tv_engineering_department.322.d: "Urban suppliers can help standardize the survey records, but they expect concessions for the disruption. Their clerks understand weights, tallies, routes, and the quiet tyranny of matching one list to another. The [tv_engineering_department|e] could use that competence, especially before [tv_wonder_materials|e] begin moving in earnest. Yet every concession writes commerce a little deeper into the monument's memory. We may buy order, but order will remember who sold it."
 tv_engineering_department.322.a: "Lean on the guilds."
 tv_engineering_department.322.b: "Avoid new obligations."
 tv_engineering_department.401.t: "[tv_wonder_ceremony|E]：The Meditation Begins"
 tv_engineering_department.401.d: "The completed wonder is veiled in silence. Priests, engineers, and royal observers withdraw from ordinary spectacle so that a year of austerity can give the monument its final meaning. The [tv_wonder_ceremony|e] begins not with noise, but with the deliberate refusal of it. Even the [tv_engineering_department|e] must learn patience, for no calculation can hurry a ritual meant to teach restraint. Visitors find the quiet unnerving at first. Then they begin to lower their voices before they understand why."
 tv_engineering_department.401.a: "Let the year turn."
 tv_engineering_department.410.t: "[tv_wonder_ceremony|E]：Envoys Requested"
 tv_engineering_department.410.d: "A neighboring court asks that we send an emissary to witness the inauguration of its grand axis. The invitation is ceremonial, but ceremonies are where states practice being remembered. Attendance will place our name among those who saw the new monument first, applauded at the correct moment, and understood the message without needing it explained. Declining would save the journey and forfeit the place in their story. Some stones are built at home; others expect witnesses from abroad."
 tv_engineering_department.410.a: "Send the emissary."
 tv_engineering_department.410.b: "Decline the invitation."
 tv_engineering_department.411.t: "[tv_wonder_ceremony|E]：An Emissary Arrives"
 tv_engineering_department.411.d: "The invited court has accepted. Another foreign emissary joins the ritual procession with rehearsed dignity, a traveling retinue, and eyes trained to notice both grandeur and weakness. The [tv_wonder_ceremony|e] grows more convincing with each external witness, because glory is louder when repeated in another accent. Procession masters adjust the order of entry; scribes adjust the list of honored guests. The wonder's ceremonial progress advances, one watching court at a time."
 tv_engineering_department.411.a: "Receive them with honor."
 tv_engineering_department.412.t: "[tv_wonder_ceremony|E]：Invitation Refused"
 tv_engineering_department.412.d: "The invited court has refused to send an emissary. Their answer is polite enough to avoid insult and cold enough to be remembered. The [tv_wonder_ceremony|e] must find its audience elsewhere, for a monument that seeks foreign awe cannot afford an empty diplomatic place. Courtiers already suggest new names, more flattering routes, and letters that sound less like requests. Glory dislikes refusal, but it can be redirected."
 tv_engineering_department.412.a: "Invite another neighbor."
 tv_engineering_department.421.t: "[tv_wonder_ceremony|E]：The Triumph Parade Begins"
 tv_engineering_department.421.d: "Banners are raised along the axis, but the parade still lacks its proof. Drummers can rehearse, horses can polish the stones with ceremonial hooves, and officers can arrange themselves into beautiful confidence, yet none of that is victory. The [tv_wonder_ceremony|e] demands a triumph that war itself must certify. Until then, the Military City is dressed for an honor it has not fully earned. Only victory in war will give the monument the memory it asks for."
 tv_engineering_department.421.a: "Then victory must come."
 tv_engineering_department.431.t: "[tv_wonder_ceremony|E]：The Civic Festival Begins"
 tv_engineering_department.431.d: "The city opens its ordered squares to a year of ceremonies, games, processions, and public instruction. Workshops slow, but the people learn the shape of civic discipline by walking it, watching it, and complaining about it until it feels familiar. The [tv_wonder_ceremony|e] turns urban space into a lesson repeated under open sky. Children memorize routes before they understand the slogans. The Civic Capital is teaching obedience by making it festive."
 tv_engineering_department.431.a: "Let the citizens gather."
 tv_engineering_department.461.t: "[tv_wonder_ceremony|E]：The Free Trade Festival Begins"
 tv_engineering_department.461.d: "Merchants, envoys, and brokers fill the harbor with promises of open exchange. Revenue tightens for a time, because generosity always looks noblest before the accounts are closed. The [tv_wonder_ceremony|e] turns quays, warehouses, and crowded tables into a stage for foreign confidence. Every contract signed in public teaches the port to speak a language distant courts understand. For one year, profit bows so reputation can pass."
 tv_engineering_department.461.a: "Open the quays."
 tv_engineering_department.471.t: "[tv_wonder_ceremony|E]：The Ancestor Festival Begins"
 tv_engineering_department.471.d: "The necropolis enters a year of incense, genealogies, and measured mourning. Names are recited until they feel heavier than the bodies they once belonged to, and workshops slow while memory takes priority over production. The [tv_wonder_ceremony|e] teaches the realm to treat ancestry as architecture. Each offering sets another stone in the argument that the living are governed by the ordered dead. Mourning, when organized, becomes authority."
 tv_engineering_department.471.a: "Let the ancestors gather."
 tv_engineering_department.481.t: "[tv_wonder_ceremony|E]：The Navigator Guild Begins"
 tv_engineering_department.481.d: "Pilots, mapmakers, rope-masters, and harbor clerks stake out their guildhall beneath the lighthouse. They arrive with sea charts, knots, quarrels over precedence, and the peculiar confidence of people who can read coastlines in bad weather. The beacon will not be complete until their institution stands. A light alone warns ships; a guild teaches a country how to understand the warning. The [tv_wonder_ceremony|e] now waits on bureaucracy with salt in its hair."
 tv_engineering_department.481.a: "Build the guild."
 tv_engineering_department.491.t: "[tv_wonder_ceremony|E]：The Water Festival Begins"
 tv_engineering_department.491.d: "The channels are garlanded, sluices blessed, and workshops quieted for a year of water rites. Water is made to look obedient, which everyone who has ever watched a flood knows is a bold theological claim. Production bends so the complex can claim sacred order through the [tv_wonder_ceremony|e]. Engineers watch priests bless what they would rather inspect, and priests watch engineers measure what they would rather sanctify. Between them, the water keeps moving."
 tv_engineering_department.491.a: "Let the waters turn."
 tv_engineering_department.501.t: "[tv_wonder_ceremony|E]：Deep Drainage Begins"
 tv_engineering_department.501.d: "Engineers drive the drainage works downward into the mining city. The shafts will be nearly silent for a year while pumps, braces, and channels conquer the depths. Miners dislike quiet almost as much as water, but both must be endured before deeper wealth can be claimed. The [tv_wonder_ceremony|e] here is not gentle; it is a bargain with darkness, damp, and patience. When the works breathe at last, the city will know how far below fear it can reach."
 tv_engineering_department.501.a: "Drain the dark."
 tv_engineering_department.511.t: "[tv_wonder_ceremony|E]：The Star Catalog Begins"
 tv_engineering_department.511.d: "The observatory closes itself around lamps, tables, and disciplined sleeplessness. Astronomers mark one star after another, not as scattered lights, but as entries in a public order that future scholars can test. Legislation slows while the court lends attention to sky and instrument. The [tv_wonder_ceremony|e] will not end in spectacle today; it will end when the heavens have been copied with enough patience to become useful."
 tv_engineering_department.511.a: "Let them count the sky."
 tv_engineering_department.521.t: "[tv_wonder_ceremony|E]：The Eclipse Proclamation Begins"
 tv_engineering_department.521.d: "The observatory has issued its prediction: an eclipse will come, and the court will be ready to name it before fear can name it first. Priests, scholars, sailors, and skeptics all now glance upward with different hopes. Each month that passes tests the claim. If the sky obeys the tables, the [tv_wonder_ceremony|e] will become proof that the realm can read heaven without surrendering to it."
 tv_engineering_department.521.a: "Watch the heavens."
 tv_engineering_department.522.t: "[tv_wonder_ceremony|E]：The Eclipse Arrives"
 tv_engineering_department.522.d: "The light changes exactly where the observatory said it would. Crowds fall silent, but the silence is not panic; criers have already told them what the learned tables foretold. The [tv_wonder_ceremony|e] becomes public certainty in the space between sun, shadow, and breath. When the light returns, the court does not merely claim wisdom. It has demonstrated timing, courage, and command of wonder itself."
 tv_engineering_department.522.a: "Let the realm remember the prediction."
 tv_engineering_department.531.t: "[tv_wonder_ceremony|E]：Tribute Received"
 tv_engineering_department.531.d: "Another subject contribution enters the Palace of Nations. It is displayed with polished care: not merely wealth, but an argument about rank made visible to every envoy who passes through the hall. The tribute gallery grows more persuasive with each offering because subordination, like glory, becomes easier to believe when it has architecture. The ceremony advances one measured act of obedience at a time."
 tv_engineering_department.531.a: "Record the tribute."
 tv_engineering_department.541.t: "[tv_wonder_ceremony|E]：The Embassy Quarter Begins"
 tv_engineering_department.541.d: "Foundations are marked for the embassy quarter beside the Palace of Nations. Foreign houses will gain doors, courtyards, servants' passages, and all the small practical dignities that make diplomacy a daily presence rather than an occasional visit. The [tv_wonder_ceremony|e] now waits on a district built for other courts to inhabit. A palace can command attention; an embassy quarter teaches attention to stay."
 tv_engineering_department.541.a: "Build places for foreign eyes."
 tv_engineering_department.500.t: "[tv_wonder_ceremony|E]：The Wonder Is Inaugurated"
 tv_engineering_department.500.d: "The [tv_engineering_department|E] has completed the [tv_wonder_ceremony|e], and the monument now stands as a permanent sign of the realm's ambition. Scaffolds are gone, ledgers are sealed, and the public has begun the work that no engineer can finish: deciding what the wonder means. Some will call it glory, some excess, some proof that the age has changed. All of them will have to look at it. That is already a form of victory."
 tv_engineering_department.500.a: "Let the age remember it."
 tv_engineering_department.600.t: "[tv_wonder_construction|E]：A Wonder of the World Is Completed"
 tv_engineering_department.600.d: "News arrives from [SCOPE.sCountry('tv_wonder_builder_country').GetName]: a world wonder has been completed at [SCOPE.sLocation('tv_wonder_completed_site').GetName]. Reports differ on its expense, beauty, purpose, and wisdom, but they agree on one point. The work is too large to remain local. It has entered the common conversation of rulers."
 tv_engineering_department.600.a: "The world has heard."

