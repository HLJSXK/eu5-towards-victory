 tv_engineering_department.551.t: "[tv_wonder_ceremony|E]：The Scholars Assemble"
 tv_engineering_department.551.d: "The University City lowers its voice into study. Masters, students, copyists, and officials gather around lecture lists and disputed readings, turning the completed streets into a year-long convocation. The [tv_wonder_ceremony|e] will not be hurried. It asks the realm to trade administrative speed for a syllabus that can outlast the current court."
 tv_engineering_department.551.a: "Let the scholars take their year."
 tv_engineering_department.552.t: "[tv_wonder_ceremony|E]：The Collegiate Hall Begins"
 tv_engineering_department.552.d: "Plans for the Collegiate Hall are sealed beside the University City. The new hall will give masters a place to quarrel formally, students a place to become less certain in useful ways, and the crown a structure through which learning can be recognized without being wholly tamed. The [tv_wonder_ceremony|e] now waits on doors, benches, statutes, and a roof under which study can claim permanence."
 tv_engineering_department.552.a: "Build a house for argument."
 tv_engineering_department.561.t: "[tv_wonder_ceremony|E]：The Dome Is Veiled"
 tv_engineering_department.561.d: "The great dome is veiled for consecration. Priests mark thresholds, singers rehearse the measured order of reverence, and the court accepts a year in which legitimacy must move more slowly so sanctity can move carefully. The [tv_wonder_ceremony|e] asks the realm to wait beneath a covered sky until the temple is ready to open its heavens."
 tv_engineering_department.561.a: "Let the dome be sanctified."
 tv_engineering_department.571.t: "[tv_wonder_ceremony|E]：The Pilgrim Stair Opens"
 tv_engineering_department.571.d: "The tower temple's stair is given to pilgrims for a year of ascent, pause, chant, and sore feet. Workshops complain as labor bends toward processions, but the [tv_wonder_ceremony|e] is meant to teach height through effort. Each step turns the tower from an object into a route, and each route makes devotion visible."
 tv_engineering_department.571.a: "Let them climb."
 tv_engineering_department.572.t: "[tv_wonder_ceremony|E]：The Temple School Begins"
 tv_engineering_department.572.d: "Teachers, clerks, and builders mark the foundations of a temple school beneath the tower. The [tv_wonder_ceremony|e] now waits on classrooms where doctrine can become habit, literacy, and argument disciplined by ritual. A tower can draw eyes upward; a school will teach voices what to say when they look."
 tv_engineering_department.572.a: "Build the school."
 tv_engineering_department.581.t: "[tv_wonder_ceremony|E]：The River Fair Begins"
 tv_engineering_department.581.d: "Booths, barges, toll tables, and festival banners gather along the widened river. Trade slows as the river is asked to become spectacle before it returns to being artery. The [tv_wonder_ceremony|e] will spend a year making merchants, boatmen, and officials perform the new order of water together."
 tv_engineering_department.581.a: "Let the river learn its new crowd."
 tv_engineering_department.582.t: "[tv_wonder_ceremony|E]：The Canal Office Begins"
 tv_engineering_department.582.d: "Surveyors mark a permanent office for the canal authority. The building will not be grand enough to rival the riverworks, which is precisely why it matters: sluices, disputes, tolls, repairs, and dry-season complaints need a place where responsibility cannot hide. The [tv_wonder_ceremony|e] now waits for administration to acquire walls."
 tv_engineering_department.582.a: "Give the river a desk."
 tv_engineering_department.591.t: "[tv_wonder_ceremony|E]：The Admiralty Office Begins"
 tv_engineering_department.591.d: "The shipyard sets aside ground for an admiralty office. Launchways and cranes may build ships, but fleets also require orders, charts, inspections, and officials with the patience to make timber become policy. The [tv_wonder_ceremony|e] now waits for the yard to gain a naval mind."
 tv_engineering_department.591.a: "Build the office."
 tv_engineering_department.601.t: "[tv_wonder_ceremony|E]：Bastions Under Trial"
 tv_engineering_department.601.d: "The Star Fortress City begins a year of trials. Engineers test angles, gunners test fields of fire, and workers discover that a wall designed for mathematics still has to be paid for by muscle. Production slows as the [tv_wonder_ceremony|e] teaches the fortress to answer theory with stone."
 tv_engineering_department.601.a: "Test every angle."
 tv_engineering_department.602.t: "[tv_wonder_ceremony|E]：The Arsenal Quarter Begins"
 tv_engineering_department.602.d: "Foundations are marked for an arsenal quarter inside the fortress city. It will bind repair shops, powder stores, and mustering yards into one disciplined district. The [tv_wonder_ceremony|e] now waits on the part of the fortress that makes defense repeatable after the first alarm fades."
 tv_engineering_department.602.a: "Build the arsenal quarter."
 tv_engineering_department.611.t: "[tv_wonder_ceremony|E]：Signal Fires Are Lit"
 tv_engineering_department.611.d: "Watch posts along the wall begin a year of signal practice. Smoke, flame, riders, and local markets all bend around the new rhythm, and trade suffers while every route learns to notice warnings first. The [tv_wonder_ceremony|e] makes vigilance public enough that even routine travel feels observed."
 tv_engineering_department.611.a: "Keep the watch bright."
 tv_engineering_department.621.t: "[tv_wonder_ceremony|E]：Master Armourers' Hall Begins"
 tv_engineering_department.621.d: "The armory marks foundations for a hall of master armourers. The greatest weapon stores cannot depend only on iron and ledgers; they need skilled hands able to judge failures before battle does. The [tv_wonder_ceremony|e] now waits for craft to acquire a permanent court."
 tv_engineering_department.621.a: "Build for the masters."
 tv_engineering_department.631.t: "[tv_wonder_ceremony|E]：The National Catalog Begins"
 tv_engineering_department.631.d: "The Library of Nation begins its catalog. Scholars close doors, unroll inventories, and slow the country's lawmaking machinery while they teach memory to find itself again. The [tv_wonder_ceremony|e] is not a parade but an index: quiet, exacting, and powerful once complete."
 tv_engineering_department.631.a: "Let the catalog grow."
 tv_engineering_department.632.t: "[tv_wonder_ceremony|E]：The Legal Deposit Office Begins"
 tv_engineering_department.632.d: "Builders mark the legal deposit office beside the library. From here, books, decrees, copies, and arguments will be gathered not as favors but as obligations. The [tv_wonder_ceremony|e] now waits for the room where the realm's written memory will stop depending on accident."
 tv_engineering_department.632.a: "Build the office of memory."

