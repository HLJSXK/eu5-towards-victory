 tv_engineering_department.10.t: "Great Engineer Has Died"
 tv_engineering_department.10.d: "Our Great Engineer has passed away. The Engineering Department will remain without its master builder until a successor is appointed."
 tv_engineering_department.10.a: "We must appoint a successor."
 tv_engineering_department.20.t: "Wonder Project Collapses"
 tv_engineering_department.20.d: "The reserve of domestic support has drained away. With the great project now indefensible, the Engineering Department must abandon the locked wonder and bear the disgrace."
 tv_engineering_department.20.a: "A bitter end."
 tv_engineering_department.100.t: "Noble Houses Rally"
 tv_engineering_department.100.d: "Several noble houses have decided that the wonder will magnify their own memory as much as the realm's. Their support echoes through court."
 tv_engineering_department.100.a: "Let them be seen."
 tv_engineering_department.101.t: "Noble Backlash"
 tv_engineering_department.101.d: "Rumors spread that the wonder will consume noble privilege without returning sufficient honor. Support among the aristocracy falters."
 tv_engineering_department.101.a: "Their pride is expensive."
 tv_engineering_department.102.t: "Burghers See Opportunity"
 tv_engineering_department.102.d: "Guildmasters and financiers begin to speak of contracts, roads, warehouses, and future crowds. Their enthusiasm gives the debate new momentum."
 tv_engineering_department.102.a: "Prosperity has a persuasive voice."
 tv_engineering_department.103.t: "Merchants Count the Cost"
 tv_engineering_department.103.d: "Some burghers now warn that the wonder will tie up labor, credit, and transport. Their caution chills public confidence."
 tv_engineering_department.103.a: "Ledgers can wound as sharply as speeches."
 tv_engineering_department.104.t: "Clerical Blessing"
 tv_engineering_department.104.d: "Prominent clergy frame the wonder as a visible sign of order and devotion. The debate gains a solemn, reassuring tone."
 tv_engineering_department.104.a: "A useful blessing."
 tv_engineering_department.105.t: "Sermons Against Excess"
 tv_engineering_department.105.d: "Preachers condemn the project as vanity dressed in stone. The charge finds listeners among those already uneasy with the cost."
 tv_engineering_department.105.a: "Faith can also refuse marble."
 tv_engineering_department.200.t: "A Wonder Unit Completed"
 tv_engineering_department.200.d: "Another section of the wonder has crossed a visible threshold. Scaffolds come down, overseers mark the completed unit, and the public can finally see that the impossible is becoming stone."
 tv_engineering_department.200.a: "Keep the work moving."
 tv_engineering_department.201.t: "The Wonder Rises"
 tv_engineering_department.201.d: "All four great parts of the wonder now support a higher common level. The project no longer looks like a promise; it looks like a monument."
 tv_engineering_department.201.a: "Let the realm see it."
 tv_engineering_department.202.t: "Wonder Construction Complete"
 tv_engineering_department.202.d: "The Engineering Department has declared the construction phase complete. The material depot is dismantled, the work crews withdraw, and the unfinished question now becomes how this monument will be consecrated."
 tv_engineering_department.202.a: "Prepare the ceremony."
 tv_engineering_department.300.t: "Survey Completed"
 tv_engineering_department.300.d_high: "The survey returns with excellent readings. The chosen ground can bear ambition, supplies can reach it, and the work crews see a path through the terrain."
 tv_engineering_department.300.d_mid: "The survey returns with usable readings. The site will not make the work effortless, but the Engineering Department can now plan around its limits."
 tv_engineering_department.300.d_low: "The survey returns with troubling readings. The site can still be declared, but the Engineering Department warns that a different location may serve the wonder better."
 tv_engineering_department.300.a: "Review the result."
 tv_engineering_department.310.t: "Hidden Foundations"
 tv_engineering_department.310.d: "Surveyors uncover stable ground and old stone beneath the proposed works. The wonder's possible scale looks more generous than first assumed."
 tv_engineering_department.310.a: "Excellent."
 tv_engineering_department.311.t: "Treacherous Ground"
 tv_engineering_department.311.d: "The ground shifts where the first maps promised certainty. Additional supports will narrow the wonder's practical scale."
 tv_engineering_department.311.a: "Adjust the plans."
 tv_engineering_department.312.t: "Clear Supply Lines"
 tv_engineering_department.312.d: "The survey finds routes that can carry stone, timber, and tools with less friction than expected."
 tv_engineering_department.312.a: "Mark them carefully."
 tv_engineering_department.313.t: "Broken Approaches"
 tv_engineering_department.313.d: "Roads, waterways, and staging grounds prove worse than the first reports claimed. Logistics will be harder to tame."
 tv_engineering_department.313.a: "We will compensate."
 tv_engineering_department.314.t: "Order in the Field"
 tv_engineering_department.314.d: "The measuring crews settle into a clean rhythm, turning rough observations into a practical system for future labor."
 tv_engineering_department.314.a: "A good habit."
 tv_engineering_department.315.t: "Survey Confusion"
 tv_engineering_department.315.d: "Contradictory maps and rival overseers slow the work. The Engineering Department loses confidence in its future organization plan."
 tv_engineering_department.315.a: "Untangle it."
 tv_engineering_department.320.t: "Special Instruments Requested"
 tv_engineering_department.320.d: "The surveyors request costly instruments and specialist artisans. Funding them should improve the scale assessment."
 tv_engineering_department.320.a: "Pay for precision."
 tv_engineering_department.320.b: "Make do with what we have."
 tv_engineering_department.321.t: "Prestige of Expertise"
 tv_engineering_department.321.d: "The Great Engineer asks the court to publicly back a controversial logistics method. Lending the realm's prestige may make the supply plan more convincing."
 tv_engineering_department.321.a: "Stake our name on it."
 tv_engineering_department.321.b: "No public endorsement."
 tv_engineering_department.322.t: "Guild Coordination"
 tv_engineering_department.322.d: "Urban suppliers can help standardize the survey records, but they expect concessions for the disruption."
 tv_engineering_department.322.a: "Lean on the guilds."
 tv_engineering_department.322.b: "Avoid new obligations."
 tv_engineering_department.401.t: "The Meditation Begins"
 tv_engineering_department.401.d: "The completed wonder is veiled in silence. Priests, engineers, and royal observers withdraw from ordinary spectacle so that a year of austerity can give the monument its final meaning."
 tv_engineering_department.401.a: "Let the year turn."
 tv_engineering_department.410.t: "Envoys Requested"
 tv_engineering_department.410.d: "A neighboring court asks that we send an emissary to witness the inauguration of its grand axis. Attendance will place our name among those who saw the new monument first."
 tv_engineering_department.410.a: "Send the emissary."
 tv_engineering_department.410.b: "Decline the invitation."
 tv_engineering_department.411.t: "An Emissary Arrives"
 tv_engineering_department.411.d: "The invited court has accepted. Another foreign emissary joins the ritual procession, and the wonder's ceremonial progress advances."
 tv_engineering_department.411.a: "Receive them with honor."
 tv_engineering_department.412.t: "Invitation Refused"
 tv_engineering_department.412.d: "The invited court has refused to send an emissary. The ceremony must find its audience elsewhere."
 tv_engineering_department.412.a: "Invite another neighbor."
 tv_engineering_department.421.t: "The Triumph Parade Begins"
 tv_engineering_department.421.d: "Banners are raised along the axis, but the parade still lacks its proof. Only victory in war will give the Military City the triumph it demands."
 tv_engineering_department.421.a: "Then victory must come."
 tv_engineering_department.431.t: "The Civic Festival Begins"
 tv_engineering_department.431.d: "The city opens its ordered squares to a year of ceremonies, games, processions, and public instruction. Workshops slow, but the people learn the shape of civic discipline."
 tv_engineering_department.431.a: "Let the citizens gather."
 tv_engineering_department.461.t: "The Free Trade Festival Begins"
 tv_engineering_department.461.d: "Merchants, envoys, and brokers fill the harbor with promises of open exchange. Revenue tightens for a time, but the port will speak a language foreign courts understand."
 tv_engineering_department.461.a: "Open the quays."
 tv_engineering_department.500.t: "The Wonder Is Inaugurated"
 tv_engineering_department.500.d_sacred_1: "Blood seals the Golden Sanctuary. The realm's crown authority now shines through a sacred monument built to awe every witness."
 tv_engineering_department.500.d_sacred_2: "A year of austerity completes the Ascetic Mountain. Its silence becomes a school of discipline and inquiry."
 tv_engineering_department.500.d_sacred_3: "The cabinet kneels into its new sacred order. The Theocratic Center stands as a monument to clerical authority."
 tv_engineering_department.500.d_axis_1: "Foreign emissaries have crossed the Sun King Axis and seen the realm's glory arranged in stone."
 tv_engineering_department.500.d_axis_2: "Victory has given the Military City its triumph. The monument now belongs to soldiers, banners, and public memory."
 tv_engineering_department.500.d_axis_3: "The Civic Capital has completed its festival of rational order. Its squares now teach obedience long after the crowds disperse."
 tv_engineering_department.500.d_port_1: "The Golden Trade Port has been bought into legend, auction by auction, until wealth itself seemed to inaugurate the harbor."
 tv_engineering_department.500.d_port_2: "Heavy ships have passed the Imperial Naval Port in review. The sea now recognizes the monument's authority."
 tv_engineering_department.500.d_port_3: "The Free Trade Metropolis has completed its festival of open exchange. Foreign tongues, contracts, and privileges now anchor the harbor's reputation."
 tv_engineering_department.500.d: "The Engineering Department has completed the wonder ceremony, and the monument now stands as a permanent sign of the realm's ambition."
 tv_engineering_department.500.a: "Let the age remember it."

