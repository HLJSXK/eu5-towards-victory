 tv_engineering_department.7309.t:0 "Keys of Granada and Courtly Concord"
 tv_engineering_department.7309.d:0 "Envoys, translators, notaries, water overseers, palace guards, protected households, artisans, and foreign observers assemble inside the Alhambra. The palace cannot be inaugurated as a normal court. Its proof begins when the victor can preserve symbolic keys, treaty rolls, safe-conduct passes, and water courts while war still gives the settlement real stakes."
 tv_engineering_department.7309.a:0 "Open the treaty court."
 tv_engineering_department.7310.t:0 "Victory Near The Red Walls"
 tv_engineering_department.7310.d:0 "The treaty court waits for a real war or peace window. Granada must remain controlled, the palace must not look sacked, and the settlement must be witnessed before victory becomes ordinary occupation. This validation is deliberately not a timer. The Alhambra proves itself when a war result can be turned into restraint, not when a monthly bar fills."
 tv_engineering_department.7310.a:0 "Validate the capitulation window."
 tv_engineering_department.7311.t:0 "Mercy, Tribute, or Deterrence"
 tv_engineering_department.7311.d:0 "The treaty branch defines the palace's memory. Mercy protects households and artisans, tribute makes surrender profitable, and deterrence warns future rebels through guarded audiences. Each path risks a different failure. Safe-conducts can be dishonored, water courts can be neglected, and foreign copies can record coercion instead of concord."
 tv_engineering_department.7311.a:0 "Write a merciful concord."
 tv_engineering_department.7311.b:0 "Bind tribute to protected order."
 tv_engineering_department.7312.t:0 "The Treaty Is Witnessed"
 tv_engineering_department.7312.d:0 "The symbolic keys are presented in the Hall of Ambassadors. Translators read the terms, water is poured for the protected courts, artisans and households are named, and foreign observers receive copies. The reward remains prestige and diplomatic reputation because the Alhambra has proved that conquest can become a governed court rather than an undisciplined prize."
 tv_engineering_department.7312.a:0 "Seal the palace treaty."
