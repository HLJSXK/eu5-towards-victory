 tv_engineering_department.1686.t:0 "The Treaty Court Opens"
 tv_engineering_department.1686.d:0 "With the war over Granada now won or ended, the treaty court can finally open. The symbolic keys, the protected households and elites, the artisan rosters, the acequia water courts, the safe-conduct passes, and the foreign treaty copies are all laid before the sponsor for capitulation terms."
 tv_engineering_department.1686.a:0 "Open the treaty court."
 tv_engineering_department.1687.t:0 "The Clauses Are Read"
 tv_engineering_department.1687.d:0 "Each clause is read and tested: the keys as a symbol of surrender, the households against reprisal, the artisans against flight, the acequia courts against sabotage, the safe conducts against banditry, and the foreign copies against forgery."
 tv_engineering_department.1687.a:0 "Read the treaty clauses aloud."
 tv_engineering_department.1688.t:0 "A Clause Is Challenged"
 tv_engineering_department.1688.d:0 "A dishonored safe conduct, a raided workshop, or a disputed acequia court threatens to unravel the treaty before it is witnessed by foreign courts."
 tv_engineering_department.1688.a:0 "Press for mercy and reconciliation."
 tv_engineering_department.1688.b:0 "Accept a narrower, harder settlement."
 tv_engineering_department.1689.t:0 "The Treaty Is Witnessed"
 tv_engineering_department.1689.d:0 "The keys, households, artisans, acequia courts, safe conducts, and foreign copies are all accounted for. The Treaty of Capitulation is witnessed and sealed."
 tv_engineering_department.1689.a:0 "Seal the treaty."
 tv_engineering_department.1690.t:0 "Securing the Red Fortress"
 tv_engineering_department.1690.d:0 "Before the palace can be trusted to the new order, the Gate of Justice, the Hall of Ambassadors, the Court of the Lions, the palace water channels, and the walls overlooking the vega must all be secured."
 tv_engineering_department.1690.a:0 "Begin securing the palace."
 tv_engineering_department.1691.t:0 "The Palace Guard Reports"
 tv_engineering_department.1691.d:0 "Each point is inspected: the Gate of Justice for crowd control, the Hall of Ambassadors for intrigue, the Court of the Lions for symbolic damage, the water channels for sabotage, and the vega walls for raiders."
 tv_engineering_department.1691.a:0 "Receive the palace guard's report."
 tv_engineering_department.1692.t:0 "Overreach At The Gate"
 tv_engineering_department.1692.d:0 "Heavy-handed guards at the Gate of Justice, a plundered chamber in the Hall of Ambassadors, or a raid on the vega threatens to turn stewardship into occupation."
 tv_engineering_department.1692.a:0 "Rein in the guards and make amends."
 tv_engineering_department.1692.b:0 "Accept harsher, narrower occupation terms."
 tv_engineering_department.1693.t:0 "The Red Fortress Is Secured"
 tv_engineering_department.1693.d:0 "The Gate of Justice, the Hall of Ambassadors, the Court of the Lions, the water channels, and the vega walls are all secured under the new order."
 tv_engineering_department.1693.a:0 "Confirm the palace is secure."
