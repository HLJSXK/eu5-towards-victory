 tv_engineering_department.1686.t:0 "The Palace Changes Hands"
 tv_engineering_department.1686.d:0 "Granada has fallen, and the war that decided it is won. The Alhambra's treasury, garrison, chancery, water administration, and religious endowments must now pass from the Nasrid order to the new sovereign, office by office."
 tv_engineering_department.1686.a:0 "Take up the inheritance."
 tv_engineering_department.1687.t:0 "The Treasury Ledgers"
 tv_engineering_department.1687.d:0 "The Nasrid treasury office holds the tax rolls, tribute records, and coin reserves of the emirate. Its fate will shape how the new order is remembered."
 tv_engineering_department.1687.a:0 "Keep the treasury officials at their posts."
 tv_engineering_department.1687.b:0 "Retrain the office for the new administration."
 tv_engineering_department.1687.c:0 "Seize the reserves and dismiss the officials."
 tv_engineering_department.1688.t:0 "The Alcazaba Garrison"
 tv_engineering_department.1688.d:0 "The Alcazaba's garrison, the palace's old defenders, awaits word on whether it will serve, be reformed, or be disbanded outright."
 tv_engineering_department.1688.a:0 "Take the garrison into service."
 tv_engineering_department.1688.b:0 "Reform the garrison under new officers."
 tv_engineering_department.1688.c:0 "Disband the garrison and sell its arms."
 tv_engineering_department.1689.t:0 "The Scribal Chancery"
 tv_engineering_department.1689.d:0 "The chancery's translators and notaries drafted the very terms of capitulation. Their pens, and their loyalties, are now in question."
 tv_engineering_department.1689.a:0 "Retain the scribes in their offices."
 tv_engineering_department.1689.b:0 "Fold the chancery into your own administration."
 tv_engineering_department.1689.c:0 "Disperse the scribes and claim their archive."
 tv_engineering_department.1690.t:0 "The Acequia Administration"
 tv_engineering_department.1690.d:0 "The acequia courts govern the channels that carry water from the Sierra Nevada into the palace gardens and the city below. Whoever controls them controls Granada's lifeblood."
 tv_engineering_department.1690.a:0 "Leave the water courts to their own judges."
 tv_engineering_department.1690.b:0 "Reorganize the water rights under new officials."
 tv_engineering_department.1690.c:0 "Strip the channels' revenues and sell the water rights."
 tv_engineering_department.1691.t:0 "The Religious Endowments"
 tv_engineering_department.1691.d:0 "The waqf endowments fund mosques, hospices, and charitable foundations across the city, including the palace's own mosque. Their disposition will be watched closely, by the faithful and by foreign courts alike."
 tv_engineering_department.1691.a:0 "Leave the endowments to their founders' intent."
 tv_engineering_department.1691.b:0 "Redirect the endowments to the new order's foundations."
 tv_engineering_department.1691.c:0 "Liquidate the endowments and claim their revenues."
 tv_engineering_department.1692.t:0 "The Reckoning Of Governance"
 tv_engineering_department.1692.d:0 "Five offices have passed from one order to another. Whether Granada remembers this as a concord, an efficient administration, or a plunder now depends on the balance of what was kept, reformed, and seized."
 tv_engineering_department.1692.a:0 "Read the reckoning."
 tv_engineering_department.1693.t:0 "The Alhambra Endures"
 tv_engineering_department.1693.d:0 "The palace's fate is now settled."
 tv_engineering_department.1693.concord.d:0 "Mercy has governed the transfer. The treasury, garrison, chancery, waterworks, and endowments alike were kept intact wherever possible, and foreign courts speak of the Alhambra as proof that conquest need not consume what it wins."
 tv_engineering_department.1693.administration.d:0 "Reform has governed the transfer. Office after office was reorganized under the new order, and the Alhambra now stands as a working palace of efficient, if unsentimental, governance."
 tv_engineering_department.1693.extraction.d:0 "Extraction has governed the transfer. The palace's offices were stripped of what they held, and the Alhambra now stands garrisoned rather than governed, its treasures gone to fund the crown that took it."
 tv_engineering_department.1693.a:0 "Confirm the Alhambra's new order."
