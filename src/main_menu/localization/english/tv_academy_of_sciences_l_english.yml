l_english:
 # ── Academy of Sciences ────────────────────────────────────────────────────────
 # IO type auto-derived keys (engine looks these up by the IO type name)
 tv_academy_of_sciences: "Academy of Sciences"
 tv_academy_of_sciences_desc: "An international institution founded upon the completion of the Academy of Sciences (Phase I). Each realm maintains its own independent Academy, serving as the seat of scholarly inquiry and the gateway to the Research Mechanism."
 tv_academy_assembly: "Academy Assembly"
 tv_academy_assembly_desc: "The Academy Assembly is where Academy members vote on scientific laws."
 diplomatic_status_tv_academy_of_sciences_name: "Academy of Sciences Member"
 diplomatic_status_tv_academy_of_sciences_tooltip: "This country has founded its own Academy of Sciences and participates in the Research Mechanism."
 tv_academy_of_sciences_list_who_tt: "Academy of Sciences members"
 io_opinion_tv_academy_of_sciences: "Fellow Academy of Sciences Member"
 TV_ACADEMY_IO_LEADER: "President of the Academy"

 # ── Academy laws ─────────────────────────────────────────────────────────────
 tv_science_factions: "Scientific Factions"
 TV_SCIENCE_FACTIONS_LAW_CATEGORY: "Scientific Factions"
 TV_SCIENCE_FICTIONS_LAW_CATEGORY: "Scientific Factions"
 tv_academy_leadership: "Leadership"
 TV_ACADEMY_LEADERSHIP_LAW_CATEGORY: "Leadership"

 tv_academy_research_priority_law: "Research Priority"
 tv_academy_research_priority_law_desc: "The Academy's formal curriculum tells scholars which questions deserve funding, praise, and patience. Each priority changes the rhythm of discovery and the costs the state accepts in the name of knowledge."
 tv_academy_research_priority_balanced_policy: "Balanced"
 tv_academy_research_priority_balanced_policy_desc: "Natural philosophy, instruments, and medicine share halls, budgets, and public honor. No single faction gains enough command to reshape the institution."
 tv_academy_research_priority_theory_policy: "Theory First"
 tv_academy_research_priority_theory_policy_desc: "The blackboards fill with geometry, astronomy, and the hidden rules of nature. Discoveries arrive from principles first, though builders must satisfy scholars who demand costly precision."
 tv_academy_research_priority_application_policy: "Application First"
 tv_academy_research_priority_application_policy_desc: "Inventors, surveyors, and mechanics receive the first audience. Their tools make construction leaner and more practical, even as speculative inquiry loses some of its favored quiet."
 tv_academy_research_priority_medicine_policy: "Medicine First"
 tv_academy_research_priority_medicine_policy_desc: "Anatomists, apothecaries, and hospital reformers set the agenda. Their work is expensive and methodical, but the realm learns to resist contagion with disciplined care."

 tv_academy_research_openness_law: "Research Openness"
 tv_academy_research_openness_law_desc: "Every manuscript must decide where it belongs: in the state archive, in a school library, in the hands of printers, or across a foreign border. This law defines who may carry Academy knowledge into the world."
 tv_academy_research_openness_closed_policy: "State Seclusion"
 tv_academy_research_openness_closed_policy_desc: "Ledgers, diagrams, and correspondence are sealed beneath official wax. Fewer rumors escape the Academy, and the court finds it easier to keep the country steady."
 tv_academy_research_openness_school_control_policy: "School Supervision"
 tv_academy_research_openness_school_control_policy_desc: "Recognized schools guard their methods through guild-like discipline. The estates appreciate orderly supervision, but the pace of discovery slows under permissions and jealous masters."
 tv_academy_research_openness_school_free_policy: "School Freedom"
 tv_academy_research_openness_school_free_policy_desc: "Lecturers, students, and printers decide how quickly arguments should travel. Debate grows sharper and faster, and a better informed populace is slower to take desperate causes."
 tv_academy_research_openness_international_policy: "International Openness"
 tv_academy_research_openness_international_policy_desc: "Foreign letters are opened beside domestic theses, and visitors find a chair at the table. The realm gains prestige among scholars, though rivals watch every exchange with growing suspicion."

 tv_academy_research_risk_law: "Research Risk Management"
 tv_academy_research_risk_law_desc: "Discovery is never perfectly tame. The Academy must decide whether bold claims are dangers to be contained, errors to be corrected, or opportunities too rare to smother."
 tv_academy_research_risk_mandatory_review_policy: "Mandatory Review"
 tv_academy_research_risk_mandatory_review_policy_desc: "Every dangerous claim passes through clerical and scholarly examination before receiving a public seal. The process reassures the faithful guardians of learning."
 tv_academy_research_risk_conservative_policy: "Conservative Security"
 tv_academy_research_risk_conservative_policy_desc: "Experiments are repeated, instruments checked, and conclusions written only when the ink can bear scrutiny. Caution becomes its own engine of steady progress."
 tv_academy_research_risk_high_breakthrough_policy: "High-Risk Breakthroughs"
 tv_academy_research_risk_high_breakthrough_policy_desc: "A few sealed rooms are left to daring minds, dangerous apparatus, and theories that respectable lecturers dislike. The Academy may leap forward, but its clerical allies grow uneasy."

 tv_academy_research_funding_law: "Research Resource Allocation"
 tv_academy_research_funding_law_desc: "Science follows silver as surely as ink follows the pen. By naming its patrons, the Academy decides which interests will shape laboratories, libraries, and appointments."
 tv_academy_research_funding_private_policy: "Private Patronage"
 tv_academy_research_funding_private_policy_desc: "Noble houses endow chairs, cabinets of curiosities, and favored scholars. Their gifts stabilize learned life while giving aristocratic patrons a louder voice."
 tv_academy_research_funding_guild_policy: "Guild Patronage"
 tv_academy_research_funding_guild_policy_desc: "Guild halls send coin, apprentices, and workshop problems to the Academy. Their practical demands sharpen research, but production bends under committees and inspection."
 tv_academy_research_funding_royal_policy: "Royal Priority"
 tv_academy_research_funding_royal_policy_desc: "The crown makes the Academy a matter of state. Projects move quickly under royal authority, and the court pays handsomely for the privilege of command."
 tv_academy_research_funding_international_policy: "International Cooperation"
 tv_academy_research_funding_international_policy_desc: "Foreign instruments, visiting fellows, and shared subscriptions keep the laboratories alive. The realm becomes a partner in a wider republic of letters, and a more visible rival."

 tv_academy_technology_spread_law: "Technology Diffusion Regulations"
 tv_academy_technology_spread_law_desc: "A discovery is not complete when it is proven; it must still find hands capable of using it. This law governs the path from lecture hall to workshop, court office, and market stall."
 tv_academy_technology_spread_laissez_faire_policy: "Laissez-Faire Diffusion"
 tv_academy_technology_spread_laissez_faire_policy_desc: "Printers, itinerant lecturers, and ambitious craftsmen carry new methods wherever profit or curiosity leads them. Institutions spread through the realm with little official restraint."
 tv_academy_technology_spread_private_policy: "Privatized Research"
 tv_academy_technology_spread_private_policy_desc: "Patrons and companies claim discoveries as guarded property. Workshop owners benefit from exclusive methods, and burgher interests rise with every licensed secret."
 tv_academy_technology_spread_state_standard_policy: "State Standardization"
 tv_academy_technology_spread_state_standard_policy_desc: "The Academy writes approved tables, measures, and procedures before adoption begins. The state gains cleaner methods and better research, but the court must fund the bureaucracy."

 tv_academy_academic_prestige_law: "Academic Prestige"
 tv_academy_academic_prestige_law_desc: "A realm that praises scholarship must decide what praise is worth. The Academy may offer silence, titles, money, or scholarly renown, each with a different claim on the public imagination."
 tv_academy_academic_prestige_none_policy: "No Rewards"
 tv_academy_academic_prestige_none_policy_desc: "Discoveries enter the minutes without ceremony or purse. The work remains its own reward, and no new faction gathers around the promise of honors."
 tv_academy_academic_prestige_titles_policy: "Titles and Nobility"
 tv_academy_academic_prestige_titles_policy_desc: "Great scholars may receive titles, arms, and a place near old families. Ambition quickens research, while nobles resent the dilution of inherited dignity."
 tv_academy_academic_prestige_money_policy: "Monetary Rewards"
 tv_academy_academic_prestige_money_policy_desc: "Solved problems and celebrated treatises earn direct payment from the court. Scholars answer quickly to coin, and the treasury feels every triumph."
 tv_academy_academic_prestige_reputation_policy: "Prestige Rewards"
 tv_academy_academic_prestige_reputation_policy_desc: "The Academy pays in medals, printed fame, and ceremonies that belong to scholars rather than diplomats. Research accelerates, but public glory is spent inward."

 tv_academy_leader_gender_law: "Leader Gender Restriction"
 tv_academy_leader_gender_law_desc: "The Academy decides whether the office of Chief Scientist remains reserved for men or may be held by any qualified scholar."
 tv_academy_leader_gender_male_only_policy: "Male Only"
 tv_academy_leader_gender_male_only_policy_desc: "The Chief Scientist must be a man. Female characters cannot be selected for the office while this policy is active."
 tv_academy_leader_gender_unrestricted_policy: "Unrestricted"
 tv_academy_leader_gender_unrestricted_policy_desc: "The Academy judges candidates by learning and service rather than gender. Any otherwise eligible character may be selected as Chief Scientist."

 # ── Academy join event (tv_academy.1) ────────────────────────────────────────
 tv_academy.1.t: "Academy of Sciences Founded"
 tv_academy.1.d: "Our scholars have completed the Academy of Sciences. This institution shall serve as the seat of inquiry, where the greatest minds of the realm gather to unlock the secrets of nature and advance the frontiers of knowledge."
 tv_academy.1.a: "Let learning begin."
 tv_science_m1_io_grant_tt: "We can now use the [tv_academy_of_sciences|e] Mechanism. See the International Organization interface."

