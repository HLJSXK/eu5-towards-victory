 # ── Chief Scientist death event (tv_academy.10) ──────────────────────────────
 tv_academy.10.t: "Chief Scientist Has Died"
 tv_academy.10.d: "Our Chief Scientist has passed away. The position is now vacant; Concentrated Research will be suspended until a new Chief Scientist is appointed."
 tv_academy.10.a: "We must appoint a new Chief Scientist."
