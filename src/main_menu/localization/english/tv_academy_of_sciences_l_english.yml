l_english:
 # ── Academy of Sciences ────────────────────────────────────────────────────────
 # IO type auto-derived keys (engine looks these up by the IO type name)
 tv_academy_of_sciences: "Academy of Sciences"
 tv_academy_of_sciences_desc: "An international institution founded upon the completion of the Academy of Sciences (Phase I). Each realm maintains its own independent Academy, serving as the seat of scholarly inquiry and the gateway to the Research Mechanism."
 diplomatic_status_tv_academy_of_sciences_name: "Academy of Sciences Member"
 diplomatic_status_tv_academy_of_sciences_tooltip: "This country has founded its own Academy of Sciences and participates in the Research Mechanism."
 tv_academy_of_sciences_list_who_tt: "Academy of Sciences members"
 io_opinion_tv_academy_of_sciences: "Fellow Academy of Sciences Member"
 TV_ACADEMY_IO_LEADER: "President of the Academy"

 # ── Academy laws ─────────────────────────────────────────────────────────────
 tv_science_factions: "Scientific Factions"
 TV_SCIENCE_FACTIONS_LAW_CATEGORY: "Scientific Factions"
 TV_SCIENCE_FICTIONS_LAW_CATEGORY: "Scientific Factions"

 tv_academy_research_priority_law: "Research Priority"
 tv_academy_research_priority_law_desc: "Sets which branch of scholarship the Academy treats as its public priority. This law has no gameplay effects yet."
 tv_academy_research_priority_balanced_policy: "Balanced"
 tv_academy_research_priority_balanced_policy_desc: "The Academy keeps theoretical, applied, and medical inquiry in careful balance."
 tv_academy_research_priority_theory_policy: "Theory First"
 tv_academy_research_priority_theory_policy_desc: "The Academy gives pride of place to abstract inquiry and natural philosophy."
 tv_academy_research_priority_application_policy: "Application First"
 tv_academy_research_priority_application_policy_desc: "The Academy favors inventions, instruments, and useful techniques."
 tv_academy_research_priority_medicine_policy: "Medicine First"
 tv_academy_research_priority_medicine_policy_desc: "The Academy focuses its learned attention on anatomy, treatment, and public health."

 tv_academy_research_openness_law: "Research Openness"
 tv_academy_research_openness_law_desc: "Sets how freely Academy knowledge may circulate among schools, patrons, and foreign correspondents. This law has no gameplay effects yet."
 tv_academy_research_openness_closed_policy: "State Seclusion"
 tv_academy_research_openness_closed_policy_desc: "Research records remain under close state supervision."
 tv_academy_research_openness_school_control_policy: "School Supervision"
 tv_academy_research_openness_school_control_policy_desc: "Recognized schools control the circulation of their own findings."
 tv_academy_research_openness_school_free_policy: "School Freedom"
 tv_academy_research_openness_school_free_policy_desc: "Schools and scholars decide how their work is shared."
 tv_academy_research_openness_international_policy: "International Openness"
 tv_academy_research_openness_international_policy_desc: "The Academy welcomes correspondence and exchange with foreign scholars."

 tv_academy_research_risk_law: "Research Risk Management"
 tv_academy_research_risk_law_desc: "Sets the Academy's official tolerance for uncertain experiments and dangerous claims. This law has no gameplay effects yet."
 tv_academy_research_risk_mandatory_review_policy: "Mandatory Review"
 tv_academy_research_risk_mandatory_review_policy_desc: "Risky claims are examined before the Academy lends them authority."
 tv_academy_research_risk_conservative_policy: "Conservative Security"
 tv_academy_research_risk_conservative_policy_desc: "The Academy prefers slow, repeatable progress over reckless novelty."
 tv_academy_research_risk_high_breakthrough_policy: "High-Risk Breakthroughs"
 tv_academy_research_risk_high_breakthrough_policy_desc: "The Academy allows daring inquiries when the possible discovery is great enough."

 tv_academy_research_funding_law: "Research Resource Allocation"
 tv_academy_research_funding_law_desc: "Sets which patrons and institutions shape the Academy's material support. This law has no gameplay effects yet."
 tv_academy_research_funding_private_policy: "Private Patronage"
 tv_academy_research_funding_private_policy_desc: "Private patrons sponsor scholars and decide which projects deserve attention."
 tv_academy_research_funding_guild_policy: "Guild Patronage"
 tv_academy_research_funding_guild_policy_desc: "Guilds and learned corporations provide the Academy's practical support."
 tv_academy_research_funding_royal_policy: "Royal Priority"
 tv_academy_research_funding_royal_policy_desc: "The crown reserves favored resources for Academy projects."
 tv_academy_research_funding_international_policy: "International Cooperation"
 tv_academy_research_funding_international_policy_desc: "The Academy accepts cooperative funding and shared materials from abroad."

 tv_academy_technology_spread_law: "Technology Diffusion Regulations"
 tv_academy_technology_spread_law_desc: "Sets how discoveries should pass from the Academy into workshops, courts, and markets. This law has no gameplay effects yet."
 tv_academy_technology_spread_laissez_faire_policy: "Laissez-Faire Diffusion"
 tv_academy_technology_spread_laissez_faire_policy_desc: "New techniques spread through printers, workshops, and patrons with little formal restraint."
 tv_academy_technology_spread_private_policy: "Privatized Research"
 tv_academy_technology_spread_private_policy_desc: "Discoveries are treated as property of their sponsors and research circles."
 tv_academy_technology_spread_state_standard_policy: "State Standardization"
 tv_academy_technology_spread_state_standard_policy_desc: "The Academy and state codify preferred methods before wider adoption."

 tv_academy_academic_prestige_law: "Academic Prestige"
 tv_academy_academic_prestige_law_desc: "Sets how the realm formally honors scholarship. This law has no gameplay effects yet."
 tv_academy_academic_prestige_none_policy: "No Rewards"
 tv_academy_academic_prestige_none_policy_desc: "Discoveries are recorded without formal rewards."
 tv_academy_academic_prestige_titles_policy: "Titles and Nobility"
 tv_academy_academic_prestige_titles_policy_desc: "Great scholars may be honored with titles and noble dignity."
 tv_academy_academic_prestige_money_policy: "Monetary Rewards"
 tv_academy_academic_prestige_money_policy_desc: "Scholarly achievement is rewarded with direct payment."
 tv_academy_academic_prestige_reputation_policy: "Prestige Rewards"
 tv_academy_academic_prestige_reputation_policy_desc: "Discoveries bring public honor and ceremonial recognition."

 # ── Academy join event (tv_academy.1) ────────────────────────────────────────
 tv_academy.1.t: "Academy of Sciences Founded"
 tv_academy.1.d: "Our scholars have completed the Academy of Sciences. This institution shall serve as the seat of inquiry, where the greatest minds of the realm gather to unlock the secrets of nature and advance the frontiers of knowledge."
 tv_academy.1.a: "Let learning begin."
 tv_science_m1_io_grant_tt: "We can now use the [tv_academy_of_sciences|e] Mechanism. See the International Organization interface."

