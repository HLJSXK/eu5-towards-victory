 # Towards Victory — Diplomatic Prediction Localization (English)

 tv_diplo_prediction.1.t: "A Question for Christendom"
 tv_diplo_prediction.1.d: "The Western Schism has divided Catholic Europe between rival claimants. Careful envoys may read the balance of cardinals, patrons, and councils before the final settlement."
 tv_diplo_prediction.1.a: "The Roman claimant will prevail."
 tv_diplo_prediction.1.b: "The rival claimant will prevail."
 tv_diplo_prediction.1.c: "This quarrel is too uncertain."
 tv_diplo_prediction_western_schism_papal_tt: "Predict that the Papal States claimant will win the Western Schism."
 tv_diplo_prediction_western_schism_opponent_tt: "Predict that the schism opponent will win the Western Schism."

 tv_diplo_prediction.2.t: "The Future of Anatolia"
 tv_diplo_prediction.2.d: "Anatolia's beyliks contest the inheritance of power. The strongest among them may found a lasting order, or the Ottomans may rise above their rivals."
 tv_diplo_prediction.2.a: "The current strongest beylik will remain dominant."
 tv_diplo_prediction.2.b: "The Ottomans will become dominant."
 tv_diplo_prediction.2.c: "The struggle is not ours to judge."
 tv_diplo_prediction_rise_ottomans_current_tt: "Predict that the current strongest beylik will still lead when the situation resolves."
 tv_diplo_prediction_rise_ottomans_tur_tt: "Predict that the Ottomans will lead when the situation resolves."

 tv_diplo_prediction.101.t: "Prediction Vindicated"
 tv_diplo_prediction.101.d: "Our diplomats correctly foresaw the outcome of the Western Schism. Foreign courts now speak of our judgment with new respect."
 tv_diplo_prediction.102.t: "Prediction Disproved"
 tv_diplo_prediction.102.d: "The Western Schism has ended against our expectations. Even skilled envoys cannot always master the currents of faith and politics."

 tv_diplo_prediction.201.t: "Anatolian Forecast Fulfilled"
 tv_diplo_prediction.201.d: "Our prediction for the rise of Anatolia's dominant power has proven correct, strengthening our reputation for diplomatic foresight."
 tv_diplo_prediction.202.t: "Anatolian Forecast Failed"
 tv_diplo_prediction.202.d: "The balance of power in Anatolia resolved differently than we expected. The lesson will still sharpen our future diplomacy."

 tv_diplo_prediction.correct.a: "Our judgment was sound."
 tv_diplo_prediction.incorrect.a: "We will learn from this."
 tv_diplo_prediction_major_reward_tt: "Gain 30 Prediction Score and 30 Diplomatic Victory Points."
 tv_diplo_prediction_regional_reward_tt: "Gain 20 Prediction Score and 20 Diplomatic Victory Points."
