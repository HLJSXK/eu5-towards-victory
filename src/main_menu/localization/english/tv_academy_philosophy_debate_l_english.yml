 tv_academy_philosophy_debate_position: "Local Debate Progress"
 tv_academy_philosophy_debate_position_desc: "Measures the Academy's local philosophy debate movement toward acceptance or rejection of the current issue. Reaching 100 accepts the issue; reaching 0 rejects it."
 tv_academy_world_debate_situation: "Academy World Debate"
 tv_academy_world_debate_situation_desc: "Countries with an Academy of Sciences enter the world debate stage around the same philosophy."
