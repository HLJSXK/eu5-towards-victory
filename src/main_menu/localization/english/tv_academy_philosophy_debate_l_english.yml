 STATIC_MODIFIER_DESC_tv_academy_debate_prediction_expectations: "Publicizing the prediction hands the new method a victory anyone can see: it did not merely explain the past, it named the world in advance and was proved right before witnesses, and the crowd will now expect such feats again."
 STATIC_MODIFIER_DESC_tv_academy_debate_printed_law_standardization: "Standardized printed law proves the press can serve royal administration with speed and consistency, and acceptance gains a strong institutional argument."
 STATIC_MODIFIER_DESC_tv_academy_debate_private_lecture_strain: "A focused lecture lets the Chief Scientist convert a small number of pivotal listeners quickly, but the extra labor strains the Academy's most important advocate."
 STATIC_MODIFIER_DESC_tv_academy_debate_private_pilot_interrogation: "Private questioning keeps the pilot useful to the officials but denies the debate a public witness. Court caution slows acceptance without ever quite calling the story false."
 STATIC_MODIFIER_DESC_tv_academy_debate_private_rankings: "Keeping the rankings private lets the court offices manage embarrassment and favors behind closed doors. Bureaucratic discretion is preserved, but the claim that merit can stand in open daylight is weakened."
 STATIC_MODIFIER_DESC_tv_academy_debate_private_trials: "Keeping the trials private preserves caution and prevents a single visible mistake from humiliating the Academy, but it also denies the Scientific Revolution the public proof its supporters had been hoping for."
 STATIC_MODIFIER_DESC_tv_academy_debate_provincial_disruption: "Bringing the provincial candidate to court turns meritocracy from a theory into a visible ladder. Local elites resent the disturbance, for talent can now climb past their patronage entirely."
