 STATIC_MODIFIER_DESC_tv_academy_debate_scandal_sheet_crackdown: "Punishing the printer restores visible order by making the scandal an example, but it also teaches every onlooker that press freedom ends where court embarrassment begins."
 STATIC_MODIFIER_DESC_tv_academy_debate_sealed_cargo_order: "Sealing the cargo heads off disorder and rumor, but it also keeps discovery abstract and in the officials' keeping. The debate loses momentum, for the public is denied its most immediate proof."
 STATIC_MODIFIER_DESC_tv_academy_debate_service_rolls: "Counting disciplined service widens merit beyond the examination hall without letting go of evidence. The professional military approves, for long service becomes a legible qualification rather than a sentimental plea."
 STATIC_MODIFIER_DESC_tv_academy_debate_simplified_tariffs: "Cutting the schedule down turns world trade from accidental privilege into a system one can actually read. Merchants can plan against clear rules, which strengthens acceptance, even as the old customs rents quietly dry up."
 STATIC_MODIFIER_DESC_tv_academy_debate_standard_military_contracts: "Standard production ties manufactories to state capacity, since weapons, uniforms, and supplies grow reliable once workshops can repeat one specification; the professional military supports the reform because predictability wins in the field."
 STATIC_MODIFIER_DESC_tv_academy_debate_standard_weights: "One standard across the realm makes distant markets comparable and enforceable, so world trade appears a lawful system rather than a chain of local sleights. Clerks and merchants alike inherit a shared language of measure."
 STATIC_MODIFIER_DESC_tv_academy_debate_subject_catalogue: "A catalogue by subject quietly makes the Renaissance habits of comparison and classification ordinary, giving scholars a modest but steady reason to back the new issue."
 STATIC_MODIFIER_DESC_tv_academy_debate_textbook_review: "Another season of review reassures the cautious teachers and their conservative patrons, but it treats print's power to standardize knowledge as a risk best delayed."
 STATIC_MODIFIER_DESC_tv_academy_debate_trade_embassy_reception: "Receiving the envoys in open hall treats world trade as diplomacy conducted by contract as much as by envoy. The gain is modest, for closer contact opens opportunity even as it lets a rival's influence into the room."
 STATIC_MODIFIER_DESC_tv_academy_debate_visible_port_closure: "Turning the foreign hulls away makes safety visible by pinching the flow of trade. The debate loses ground, for foreign exchange is treated as the illness itself, even as the public applauds a harbor acting decisively."
 STATIC_MODIFIER_DESC_tv_academy_debate_waterwheel_disruption: "Building the works proves manufactories can command natural force, not merely herd workers together, so the argument surges forward; nearby communities bear the disruption of new channels, water rights, and altered routines."
 STATIC_MODIFIER_NAME_tv_academy_debate_artisan_demonstrations: "The Artisan's Knowledge: The register admits the artisan's result alongside the learned ones."
 STATIC_MODIFIER_NAME_tv_academy_debate_avoided_foreign_claim_crisis: "Foreign Claim: Peace -- let the rival keep its paper coast."
 STATIC_MODIFIER_NAME_tv_academy_debate_battered_chart: "The Sailor's Chart: The pilots pin the chart above the great table and set a course by it."
 STATIC_MODIFIER_NAME_tv_academy_debate_bespoke_supply_networks: "Military Contract: We would rather keep each supplier's own hand."
 STATIC_MODIFIER_NAME_tv_academy_debate_bills_of_exchange: "Bills of Exchange: The Academy endorses the bill of exchange as lawful tender of trust."
 STATIC_MODIFIER_NAME_tv_academy_debate_broadsides_watch: "The Anonymous Broadsides: The watch is set to trace the paste back to whoever mixed it."
 STATIC_MODIFIER_NAME_tv_academy_debate_cabinet_of_curiosities: "Native Envoy's Account: The clerks file the account among the cabinet's curiosities."
 STATIC_MODIFIER_NAME_tv_academy_debate_capital_certification: "A School Outside the Capital: Not until the capital sets its seal."
 STATIC_MODIFIER_NAME_tv_academy_debate_catechism_lessons: "The Catechism Draft: We send it to the printing house before the arguments can catch up."
 STATIC_MODIFIER_NAME_tv_academy_debate_central_print_office: "The University's Own Press: We would have every press in the realm answer to one office."
 STATIC_MODIFIER_NAME_tv_academy_debate_ceremonial_patronage: "The Patronage Ledger: The court's giving stays ceremonial, a matter of form."
 STATIC_MODIFIER_NAME_tv_academy_debate_child_labor_rules: "Child Labor Petition: The Academy sets an age to the bench and lets the work go on."
 STATIC_MODIFIER_NAME_tv_academy_debate_civil_posts_separate: "Veterans' Service Rolls: The ministries keep the civil rolls and the muster rolls apart."
 STATIC_MODIFIER_NAME_tv_academy_debate_civil_press_boundary: "A Press in the Barracks: We keep the presses to civil business alone."
 STATIC_MODIFIER_NAME_tv_academy_debate_clergy_marriage_jurisdiction: "The Marriage Court: Marriage stays where it has always been settled, in the clergy's own courts."
 STATIC_MODIFIER_NAME_tv_academy_debate_clerical_discipline: "The Clergy Divided: The Crown binds the clergy to the doctrine they serve."
 STATIC_MODIFIER_NAME_tv_academy_debate_clock_discipline: "Clock Discipline: The bells are hung, and the day is cut to their measure."
 STATIC_MODIFIER_NAME_tv_academy_debate_closed_royal_accounts: "The Crown's Accounts: The court keeps its accounts locked and its numbers to itself."
 STATIC_MODIFIER_NAME_tv_academy_debate_commission_review: "Merit on the Battlefield: The board enters proven command into the record of qualifications."
 STATIC_MODIFIER_NAME_tv_academy_debate_common_army_oath: "The Army's Oath: We bind the whole camp with one oath before local custom can divide it."
 STATIC_MODIFIER_NAME_tv_academy_debate_consensus_delay: "The Catechism Draft: The draft goes back to committee for another round of consensus."
 STATIC_MODIFIER_NAME_tv_academy_debate_corrected_charts: "Mapmaker's Correction: The corrected coast is entered on the master chart, boundary and all."
 STATIC_MODIFIER_NAME_tv_academy_debate_court_masque: "Court Masque of Renewal: The Crown pays for music, costumes, and stagecraft."
 STATIC_MODIFIER_NAME_tv_academy_debate_court_order_preserved: "The Provincial Prodigy: Admirable, from a safe distance."
 STATIC_MODIFIER_NAME_tv_academy_debate_court_style_uniformity: "Local Language Answers: We hold every paper to the one court hand."
 STATIC_MODIFIER_NAME_tv_academy_debate_crown_discovery_lock: "Merchants Want Charter: Not so fast -- the shore answers to the Crown."
 STATIC_MODIFIER_NAME_tv_academy_debate_customs_house_routine: "Free Port Proposal: We reject the experiment and keep the gates."
 STATIC_MODIFIER_NAME_tv_academy_debate_established_routes: "Map of Trade Winds: The captains hold to the routes their fathers sailed."
 STATIC_MODIFIER_NAME_tv_academy_debate_experiment_code: "The Academy Experiment Code: The clerks rule the columns and pass the pen for signatures."
 STATIC_MODIFIER_NAME_tv_academy_debate_familiar_accounts: "Double-Entry Before the Bench: We keep the accounts our clerks already know by heart."
 STATIC_MODIFIER_NAME_tv_academy_debate_funded_trade_escorts: "Naval Escort Debate: The Crown funds escorts for every profitable horizon."
 STATIC_MODIFIER_NAME_tv_academy_debate_globe_lessons: "School Globe: The globe is set in the schoolroom for every pupil to turn."
 STATIC_MODIFIER_NAME_tv_academy_debate_gold_rumor_speculation: "Rumor of Gold: We let greed pull the oars for once."
 STATIC_MODIFIER_NAME_tv_academy_debate_guild_apprenticeship_preserved: "Workshop School: We send the boys back to the guild masters."
 STATIC_MODIFIER_NAME_tv_academy_debate_harbor_exhibition: "Harbor Crowd: The strange goods are laid out where the harbor crowd can lay hands on them."
 STATIC_MODIFIER_NAME_tv_academy_debate_icon_local_truce: "The Icon in Question: Not every quarrel needs a verdict."
 STATIC_MODIFIER_NAME_tv_academy_debate_informal_army_credit: "Army Pay Delay: We pass the hat among the private lenders one more time."
 STATIC_MODIFIER_NAME_tv_academy_debate_laboratory_safety_rules: "The Laboratory Accident: The workmen fit new guards to the bench and light the next trial."
 STATIC_MODIFIER_NAME_tv_academy_debate_liability_restraint: "The Merchant Widows' Fund: A debt belongs to a face, not a fund."
 STATIC_MODIFIER_NAME_tv_academy_debate_licensed_wit: "Satire of the Old Masters: Let them laugh; laughter has its uses."
 STATIC_MODIFIER_NAME_tv_academy_debate_limited_exam_scandal: "Examination Fraud: We void the worst papers and say nothing of the rest."
 STATIC_MODIFIER_NAME_tv_academy_debate_local_contract_forms: "Language of Contracts: Let each market keep its own tongue."
 STATIC_MODIFIER_NAME_tv_academy_debate_local_language_access: "Local Language Answers: The board accepts answers written in the plain provincial hand."
 STATIC_MODIFIER_NAME_tv_academy_debate_local_measures_preserved: "Standard Weights: Every town keeps its own measure."
 STATIC_MODIFIER_NAME_tv_academy_debate_local_order_preserved: "A Peasant's Petition: Every stream is best judged by its own mill."
 STATIC_MODIFIER_NAME_tv_academy_debate_local_pulpits: "The Licensed Pulpit: Let the old pulpits be."
 STATIC_MODIFIER_NAME_tv_academy_debate_manufactory_fire_codes: "Fire in the Yard: The Crown writes firebreaks and inspections into the model."
 STATIC_MODIFIER_NAME_tv_academy_debate_maritime_insurance_pool: "Insurance for Ships: The Academy enters maritime insurance into the record."
 STATIC_MODIFIER_NAME_tv_academy_debate_measured_ruins: "A Ruin Measured: The surveyors' figures are printed for every workshop."
 STATIC_MODIFIER_NAME_tv_academy_debate_measurement_standard: "The Measurement Standard: The Academy casts one rule, one weight, one measure for all provinces."
 STATIC_MODIFIER_NAME_tv_academy_debate_merchant_capital_pool: "Merchant Capital Pool: The Crown lets the merchants bind their purses into one."
 STATIC_MODIFIER_NAME_tv_academy_debate_mission_priority: "Clergy Ask for Mission Rights: No coast is truly found until a soul is saved upon it."
 STATIC_MODIFIER_NAME_tv_academy_debate_named_method: "The New Method Named: The word is spoken into the record, and the movement takes its name."
 STATIC_MODIFIER_NAME_tv_academy_debate_observation_tables: "A Table of Observations: The scribes copy the table into the record, line by patient line."
 STATIC_MODIFIER_NAME_tv_academy_debate_observational_collections: "The Natural History Cabinet: We arrange the drawers by what our eyes report, not what the books decreed."
 STATIC_MODIFIER_NAME_tv_academy_debate_old_customs_controls: "Smuggler's Map: Into the fire with it."
 STATIC_MODIFIER_NAME_tv_academy_debate_open_chair_competition: "Scholar Demand for Open Chairs: The Academy throws its own chairs open to open competition."
 STATIC_MODIFIER_NAME_tv_academy_debate_orderly_bankruptcy: "The Shame of Bankruptcy: The Academy writes orderly bankruptcy into lawful procedure."
 STATIC_MODIFIER_NAME_tv_academy_debate_orderly_proceedings: "Poets at the Debate: A rhyme outruns a ruling."
 STATIC_MODIFIER_NAME_tv_academy_debate_patron_rights_confirmed: "Scholar Demand for Open Chairs: We leave the chairs in the hands that endowed them."
 STATIC_MODIFIER_NAME_tv_academy_debate_patronage_buried: "Clean Ink, Dirty Hands: Some ledgers are best left unopened."
 STATIC_MODIFIER_NAME_tv_academy_debate_plain_contract_forms: "Contract in Plain Language: The Academy requires that every contract speak in plain words."
 STATIC_MODIFIER_NAME_tv_academy_debate_pooled_risk_fund: "The Merchant Widows' Fund: The clerks enroll the pooled fund as a civic protection."
 STATIC_MODIFIER_NAME_tv_academy_debate_port_credit_shock: "Port Investors Panic: We let the frightened money walk away."
 STATIC_MODIFIER_NAME_tv_academy_debate_prediction_expectations: "A Prediction Comes True: Criers carry the calculation and its keeping through the streets."
 STATIC_MODIFIER_NAME_tv_academy_debate_printed_law_standardization: "The Proclamation in Print: The Chancery orders every proclamation set in one standard type."
 STATIC_MODIFIER_NAME_tv_academy_debate_private_lecture_strain: "Private Lecture at Dusk: The Chief Scientist detains the pivotal few until they understand."
 STATIC_MODIFIER_NAME_tv_academy_debate_private_pilot_interrogation: "Returned Pilot: We take his account behind a closed door."
 STATIC_MODIFIER_NAME_tv_academy_debate_private_rankings: "Public Ranking List: Best settled behind closed doors."
 STATIC_MODIFIER_NAME_tv_academy_debate_private_trials: "The Public Demonstration: The doors stay shut, and the trials keep to the back room."
 STATIC_MODIFIER_NAME_tv_academy_debate_provincial_disruption: "The Provincial Prodigy: The Academy summons the stranger to court and a seat near the front."
 STATIC_MODIFIER_NAME_tv_academy_debate_provincial_training: "A School Outside the Capital: The Crown grants the provincial school a seat at the examinations."
 STATIC_MODIFIER_NAME_tv_academy_debate_quarantine_precautions: "Disease Report: The physicians are funded, and the ships sail with their cautions stowed aboard."
 STATIC_MODIFIER_NAME_tv_academy_debate_quarantine_reform: "Port Quarantine: Inspectors are trained to keep the harbor open and clean at once."
 STATIC_MODIFIER_NAME_tv_academy_debate_quiet_courtyards: "Student Disputation: Quiet down, before the courtyard becomes a second chamber."
 STATIC_MODIFIER_NAME_tv_academy_debate_rankings_suspended: "Boycott by Old Families: The Crown suspends the rankings until the great houses return."
 STATIC_MODIFIER_NAME_tv_academy_debate_reformed_colonial_charters: "Colonial Charter Abuse: The Academy rewrites the charters, clause by watchful clause."
 STATIC_MODIFIER_NAME_tv_academy_debate_restricted_correspondence: "Open Correspondence: Not a page leaves these walls."
