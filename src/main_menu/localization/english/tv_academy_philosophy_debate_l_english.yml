 tv_academy_debate.116.a: "The table takes note."
 tv_academy_debate.116.d: "This month's policies and public deeds have added real weight to the current issue. The debate is leaning toward acceptance."
 tv_academy_debate.116.t: "The Debate Tips Our Way"
 tv_academy_debate.117.a: "The table takes note."
 tv_academy_debate.117.d: "This month's policies and public deeds have taken weight away from the current issue. The debate is leaning toward rejection."
 tv_academy_debate.117.t: "The Debate Tips Against Us"
 tv_academy_debate.118.a: "Send our delegation."
 tv_academy_debate.118.d: "Every country with an Academy of Sciences has gathered around the same philosophical issue. Our Academy will send its own delegation and watch where the argument leads."
 tv_academy_debate.118.t: "The World Takes Its Seats"
 tv_academy_debate.119.a: "Record the verdict."
 tv_academy_debate.119.d: "The world debate has a verdict: the issue is accepted. Our Academy advances the philosophy sequence and lets the idea take root at home."
 tv_academy_debate.119.t: "The World Debate Says Yes"
 tv_academy_debate.120.a: "Record the verdict."
 tv_academy_debate.120.d: "The world debate has a verdict: the issue is rejected. Our Academy closes the file and moves on to the next step in the sequence."
 tv_academy_debate.120.t: "The World Debate Says No"
 tv_academy_debate.121.a: "Seal the file."
 tv_academy_debate.121.d: "The world debate never reached a verdict. Our Academy files the issue away and moves on to the next step in the sequence."
 tv_academy_debate.121.t: "The World Debate Fizzles Out"
 tv_academy_debate.122.a: "Note the shift."
 tv_academy_debate.122.d: "This month's politics and public mood have shifted a few chairs at the table. At least one debate seat now backs the current issue."
 tv_academy_debate.122.t: "A Chair Slides Toward Support"
 tv_academy_debate.123.a: "Note the shift."
 tv_academy_debate.123.d: "This month's politics and public mood have shifted a few chairs at the table. At least one debate seat now stands against the current issue."
 tv_academy_debate.123.t: "A Chair Slides Toward Opposition"
 tv_academy_debate.124.a: "Note the shift."
 tv_academy_debate.124.d: "This month's politics and public mood have shifted a few chairs at the table. At least one debate seat no longer clearly backs or opposes the current issue."
 tv_academy_debate.124.t: "A Chair Slides to the Fence"
 tv_academy_debate.125.a: "Note the vacancy."
 tv_academy_debate.125.d: "A regular at the table can no longer attend. This month's tally leaves the corresponding seat vacant."
 tv_academy_debate.125.t: "A Chair Sits Empty"
 tv_academy_debate.2000.a: "The clerks distribute the summary to every bench."
 tv_academy_debate.2000.b: "We strike the sharpest lines before anyone can quote them."
 tv_academy_debate.2000.d: "After three days of tangled claims, the chair reduces the argument to a brief that even the restless back benches can follow. Half the room calls this clarity. The other half calls it a trap with excellent penmanship.\n\n#Y This event appeared because a local debate is under way, and it can surface under any debate issue.#!"
 tv_academy_debate.2000.t: "The Chair's Summary"
 tv_academy_debate.2001.a: "The ushers wave the crowd toward the open doors."
 tv_academy_debate.2001.b: "Peace, before the benches learn to riot."
 tv_academy_debate.2001.d: "Students, clerks, idle nobles, and citizens with suspiciously excellent hearing pack the galleries. Every strong line now travels farther than the speaker intended, and gossip, unlike scholarship, has never once needed a footnote.\n\n#Y This event appeared because a local debate is under way, and it can surface under any debate issue.#!"
 tv_academy_debate.2001.t: "Crowded Galleries"
 tv_academy_debate.2002.a: "The scholars trace the quotation back to its true source and disown it."
 tv_academy_debate.2002.b: "Let the dead man's words work for us a little longer."
 tv_academy_debate.2002.d: "A copied line from a respected authority appears to favor the new argument. The wording is convenient, the ink is fresh, and several scholars have suddenly discovered a passionate interest in handwriting analysis.\n\n#Y This event appeared because a local debate is under way, and it can surface under any debate issue.#!"
 tv_academy_debate.2002.t: "A Useful Misquotation"
 tv_academy_debate.2003.a: "The old note is entered as evidence, exactly as the ancients left it."
 tv_academy_debate.2003.b: "We question whether a dead man still gets the last word."
 tv_academy_debate.2003.d: "An old commentary emerges from the Academy library with a note in the margin sharp enough to cut both sides. By noon, every faction claims the dead commentator as an ally, which is a comfort, since he can no longer object.\n\n#Y This event appeared because a local debate is under way, and it can surface under any debate issue.#!"
 tv_academy_debate.2003.t: "Margins of the Old Book"
 tv_academy_debate.2004.a: "The Chief Scientist detains the pivotal few until they understand."
 tv_academy_debate.2004.b: "Let the candles burn out unattended."
 tv_academy_debate.2004.d: "As the chamber empties, the Chief Scientist offers to gather a few decisive listeners before the candles burn low. Confusion can still be turned into conviction tonight, if someone is willing to pay for the wax.\n\n#Y This event appeared because a local debate is under way, and it can surface under any debate issue.#!"
 tv_academy_debate.2004.t: "Private Lecture at Dusk"
 tv_academy_debate.2005.a: "The clerks receive minutes exact enough to bind every clause."
 tv_academy_debate.2005.b: "We let the argument stay unwritten a little longer."
 tv_academy_debate.2005.d: "Before the Academy's arguments can touch policy, ministry clerks demand minutes exact enough to file, quote, and delay. No idea in this kingdom has ever outrun a sufficiently determined filing clerk.\n\n#Y This event appeared because a local debate is under way, and it can surface under any debate issue.#!"
 tv_academy_debate.2005.t: "Minutes for the Ministries"
 tv_academy_debate.2006.a: "The scribes append the requested caution to every copy."
 tv_academy_debate.2006.b: "Let the idea stand on its own reasoning, unadorned."
 tv_academy_debate.2006.d: "Religious figures ask that the disputed proposition be wrapped in moral caution before anyone dares to call it wisdom. Every new idea, it seems, must first apologize for existing.\n\n#Y This event appeared because a local debate is under way, and it can surface under any debate issue.#!"
 tv_academy_debate.2006.t: "A Moral Preface"
 tv_academy_debate.2007.a: "The burghers see their names printed beside the argument."
 tv_academy_debate.2007.b: "We decline to sell the truth a subscription."
 tv_academy_debate.2007.d: "Burghers offer to fund pamphlets, copied notes, and coffeehouse discussion, provided their names sit close enough to the title. Patronage, it turns out, has always preferred a byline to a footnote.\n\n#Y This event appeared because a local debate is under way, and it can surface under any debate issue.#!"
 tv_academy_debate.2007.t: "Merchant Subscription"
 tv_academy_debate.2008.a: "The courtyard fills with young voices arguing past dusk."
 tv_academy_debate.2008.b: "Quiet down, before the courtyard becomes a second chamber."
 tv_academy_debate.2008.d: "Students stage their own version of the debate in the courtyard, proving once again that enthusiasm can be louder than preparation, and considerably cheaper to arrange.\n\n#Y This event appeared because a local debate is under way, and it can surface under any debate issue.#!"
 tv_academy_debate.2008.t: "Student Disputation"
 tv_academy_debate.2009.a: "A clerk reads the foreign letter aloud to the full chamber."
 tv_academy_debate.2009.b: "Into the archive, quietly, where foreign ink cannot embarrass us."
 tv_academy_debate.2009.d: "A foreign scholar sends a careful letter, folded like evidence and read like gossip. Its argument is precise enough to help the Academy, and foreign enough to make every listener wonder who truly benefits from hearing it aloud.\n\n#Y This event appeared because a local debate is under way, and it can surface under any debate issue.#!"
 tv_academy_debate.2009.t: "Letter from Abroad"
 tv_academy_debate.2010.a: "The chamber watches the device perform, and believes its own eyes."
 tv_academy_debate.2010.b: "Interesting, but hardly conclusive."
 tv_academy_debate.2010.d: "A working instrument is carried into the debate chamber and placed where theory can no longer pretend to be alone. Its gears, lenses, or measures do not settle every question, but they make old abstractions sweat, and a few old men along with them.\n\n#Y This event appeared because a local debate is under way, and it can surface under any debate issue.#!"
 tv_academy_debate.2010.t: "Instrument in the Hall"
 tv_academy_debate.2011.a: "The tune spreads from tavern to tavern, gathering listeners and slander alike."
 tv_academy_debate.2011.b: "Silence the singers before the melody outlives the argument."
 tv_academy_debate.2011.d: "The issue escapes the Academy as a street song, half misunderstanding and half recruitment. By sunset, people who could not name the proposition can hum its sharpest insult from memory.\n\n#Y This event appeared because a local debate is under way, and it can surface under any debate issue.#!"
 tv_academy_debate.2011.t: "A Street Song"
 tv_academy_debate.2012.a: "The judges rule that the new argument has survived every blow."
 tv_academy_debate.2012.b: "Old wisdom needs no new witnesses."
 tv_academy_debate.2012.d: "A respected opponent challenges the new claim under rules strict enough to make evasion visible. The hall grows quieter, not because tempers have cooled, but because everyone can now count the blows out loud.\n\n#Y This event appeared because a local debate is under way, and it can surface under any debate issue.#!"
 tv_academy_debate.2012.t: "Formal Challenge"
 tv_academy_debate.2013.a: "The gavel falls, and the committee is made to choose."
 tv_academy_debate.2013.b: "Not yet."
 tv_academy_debate.2013.d: "Everyone knows another month of debate will produce longer speeches, not better reasons. The committee has begun perfecting its objections instead of testing them, an old and comfortable vice.\n\n#Y This event appeared because a local debate is under way, and it can surface under any debate issue.#!"
 tv_academy_debate.2013.t: "Committee Exhaustion"
 tv_academy_debate.2014.a: "The Academy commissions a fresh translation, ink and argument together."
 tv_academy_debate.2014.b: "The word our fathers used will do."
 tv_academy_debate.2014.d: "Two translations of the same key term produce two different futures for the realm. Each side insists the other has mistranslated not only the word, but the entire age it was written in.\n\n#Y This event appeared because a local debate is under way, and it can surface under any debate issue.#!"
 tv_academy_debate.2014.t: "Translation Quarrel"
 tv_academy_debate.2015.a: "The canvas hangs in the hall where every eye must pass it."
 tv_academy_debate.2015.b: "Doctrine needs no gallery."
 tv_academy_debate.2015.d: "An artist paints the issue as a scene so flattering to novelty that even its opponents stop to inspect the colors. The argument, it seems, has finally learned to wear light instead of merely quoting it.\n\n#Y This event appeared because a local debate is under way, and it can surface under any debate issue.#!"
 tv_academy_debate.2015.t: "Allegory on Canvas"
 tv_academy_debate.2016.a: "The bailiff opens a calm inquiry, letters and rumors alike."
 tv_academy_debate.2016.b: "Every paper in the room, seized before dusk."
 tv_academy_debate.2016.d: "A sealed accusation claims the debate is a plot, a vanity, or both. The handwriting is conveniently unfamiliar, and the room suddenly develops a keen interest in studying the door.\n\n#Y This event appeared because a local debate is under way, and it can surface under any debate issue.#!"
 tv_academy_debate.2016.t: "Anonymous Denunciation"
 tv_academy_debate.2017.a: "The lamps stay lit, and the room is kept in session until dawn concedes something too."
 tv_academy_debate.2017.b: "Let pride sleep on it."
 tv_academy_debate.2017.d: "By candlelight, tired opponents accidentally admit which points they can no longer deny. No one calls it agreement yet, but everyone in the room hears the shape of it, the way one hears rain before the first drop lands.\n\n#Y This event appeared because a local debate is under way, and it can surface under any debate issue.#!"
 tv_academy_debate.2017.t: "Consensus After Midnight"
 tv_academy_debate.2018.a: "The clerks strike every name from the papers before the marking begins."
 tv_academy_debate.2018.b: "We leave the names where an examiner can see them."
 tv_academy_debate.2018.d: "Before a single mark is set down, the examiners would strike every name from the papers, leaving only the argument and the penmanship to speak. Birth complains, bitterly, that the ink has gone blind and can no longer tell a great house from a grocer's son.\n\n#Y This event appeared because the current debate issue is Meritocracy.#!"
 tv_academy_debate.2018.t: "The Nameless Papers"
 tv_academy_debate.2019.a: "We ask the parchments to answer to evidence, not to etiquette."
 tv_academy_debate.2019.b: "The court honors service handed down like an heirloom."
 tv_academy_debate.2019.d: "The great houses arrive with genealogies polished like altar plate, each parchment insisting that the capacity to govern descends through a bloodline as surely as a set of silver spoons.\n\n#Y This event appeared because the current debate issue is Meritocracy.#!"
 tv_academy_debate.2019.t: "Genealogies on the Table"
 tv_academy_debate.2020.a: "The Academy summons the stranger to court and a seat near the front."
 tv_academy_debate.2020.b: "Admirable, from a safe distance."
 tv_academy_debate.2020.d: "From a province the court could not find on its better maps, a candidate untangles in one evening a problem the favorites have circled warily for weeks.\n\n#Y This event appeared because the current debate issue is Meritocracy.#!"
 tv_academy_debate.2020.t: "The Provincial Prodigy"
 tv_academy_debate.2021.a: "The clerks lay the bargain open on the record."
 tv_academy_debate.2021.b: "We let the coin quietly find its office."
 tv_academy_debate.2021.d: "While the debate still rings in the hall, a lucrative office is promised in a lower corridor to a donor's son, whose chief qualification is a father with a generous ledger.\n\n#Y This event appeared because the current debate issue is Meritocracy.#!"
 tv_academy_debate.2021.t: "Purchased Office"
 tv_academy_debate.2022.a: "The board enters proven command into the record of qualifications."
 tv_academy_debate.2022.b: "The sword, like the title, is best kept in the family."
 tv_academy_debate.2022.d: "Officers rise to argue that a command earned under fire should weigh more in the ledger of appointments than a name inherited from men long in their tombs.\n\n#Y This event appeared because the current debate issue is Meritocracy.#!"
 tv_academy_debate.2022.t: "Merit on the Battlefield"
 tv_academy_debate.2023.a: "The council sends the nephew to the same trial as any stranger."
 tv_academy_debate.2023.b: "We grant the favor and keep the peace of the court."
 tv_academy_debate.2023.d: "The royal tutor petitions for a cabinet seat on behalf of a nephew of rare brilliance, though every witness in the room seems far surer of the kinship than of the brilliance.\n\n#Y This event appeared because the current debate issue is Meritocracy.#!"
 tv_academy_debate.2023.t: "The Tutor's Nephew"
 tv_academy_debate.2024.a: "First let the work be shown; the sermon can wait."
 tv_academy_debate.2024.b: "The parish seal is required before the examiner's ink."
 tv_academy_debate.2024.d: "The clergy propose that no man hold public office without a certificate of good morals, making virtue the gate at which ability must stop and ask leave to pass.\n\n#Y This event appeared because the current debate issue is Meritocracy.#!"
 tv_academy_debate.2024.t: "Clerical Certificates"
 tv_academy_debate.2025.a: "The guild halls open their benches to any candidate the work itself will test."
 tv_academy_debate.2025.b: "We keep the old letters and the old learning as our measure."
 tv_academy_debate.2025.d: "The city guilds offer practical trials for accountants, engineers, and clerks, insisting that a hand steady over real timber and real ledgers can prove what a polished quotation never will.\n\n#Y This event appeared because the current debate issue is Meritocracy.#!"
 tv_academy_debate.2025.t: "Guild Tests"
 tv_academy_debate.2026.a: "The chamber lets the muddy petition be read from the floor, boots and all."
 tv_academy_debate.2026.b: "Every stream is best judged by its own mill."
 tv_academy_debate.2026.d: "A village schoolmaster sends up a plain question, whether a mind born beneath a thatched roof is any less a mind, and the petition arrives in the marbled chamber with the mud of the road still on its shoes.\n\n#Y This event appeared because the current debate issue is Meritocracy.#!"
 tv_academy_debate.2026.t: "A Peasant's Petition"
 tv_academy_debate.2027.a: "We post the rankings and keep the empty benches."
 tv_academy_debate.2027.b: "The Crown suspends the rankings until the great houses return."
 tv_academy_debate.2027.d: "Several great families threaten to withdraw their sons from the Academy should the open rankings proceed, apparently mistaking an empty bench for a winning argument.\n\n#Y This event appeared because the current debate issue is Meritocracy.#!"
 tv_academy_debate.2027.t: "Boycott by Old Families"
 tv_academy_debate.2028.a: "The Crown clears the whole examining board from their chairs."
 tv_academy_debate.2028.b: "We void the worst papers and say nothing of the rest."
 tv_academy_debate.2028.d: "A leaked answer key makes an awkward thing plain: with a heavy enough purse and a steady enough hand, the appearance of merit can be counterfeited outright.\n\n#Y This event appeared because the current debate issue is Meritocracy.#!"
 tv_academy_debate.2028.t: "Examination Fraud"
 tv_academy_debate.2029.a: "The list goes up on the gate for every passer-by to read."
 tv_academy_debate.2029.b: "Best settled behind closed doors."
 tv_academy_debate.2029.d: "The reformers want the results nailed to the gate where every family may read, in plain figures, exactly what their influence failed to buy.\n\n#Y This event appeared because the current debate issue is Meritocracy.#!"
 tv_academy_debate.2029.t: "Public Ranking List"
 tv_academy_debate.2030.a: "The board accepts answers written in the plain provincial hand."
 tv_academy_debate.2030.b: "We hold every paper to the one court hand."
 tv_academy_debate.2030.d: "Provincial candidates ask leave to answer in the plain administrative tongue of their own districts, rather than in the ornate court style that judges the courtier before it judges the clerk.\n\n#Y This event appeared because the current debate issue is Meritocracy.#!"
 tv_academy_debate.2030.t: "Local Language Answers"
 tv_academy_debate.2031.a: "The reformers enter the day's failure into the record as evidence."
 tv_academy_debate.2031.b: "One slip does not unmake a lineage."
 tv_academy_debate.2031.d: "A hereditary official fails, in full view of the hall, at the very task the debate has been insisting ought to be tested.\n\n#Y This event appeared because the current debate issue is Meritocracy.#!"
 tv_academy_debate.2031.t: "Hereditary Office in Crisis"
 tv_academy_debate.2032.a: "The Academy throws its own chairs open to open competition."
 tv_academy_debate.2032.b: "We leave the chairs in the hands that endowed them."
 tv_academy_debate.2032.d: "The Academy's own scholars demand that its teaching chairs be won in open contest rather than handed down from a patron to whichever protege happened to be standing near him.\n\n#Y This event appeared because the current debate issue is Meritocracy.#!"
 tv_academy_debate.2032.t: "Scholar Demand for Open Chairs"
 tv_academy_debate.2033.a: "We enter proven years of service into the reckoning for office."
 tv_academy_debate.2033.b: "The ministries keep the civil rolls and the muster rolls apart."
 tv_academy_debate.2033.d: "Veterans lay their service rolls on the table and ask, plainly, whether long years of disciplined duty count as merit, or merely as a ledger of scars.\n\n#Y This event appeared because the current debate issue is Meritocracy.#!"
 tv_academy_debate.2033.t: "Veterans' Service Rolls"
 tv_academy_debate.2034.a: "Let the mark stand, favorite or no."
 tv_academy_debate.2034.b: "The Crown orders the favorite a fresh trial and a fresh chance."
 tv_academy_debate.2034.d: "A candidate dear to the Crown performs wretchedly in a supervised trial, and there are far too many witnesses for the failure to be quietly forgotten.\n\n#Y This event appeared because the current debate issue is Meritocracy.#!"
 tv_academy_debate.2034.t: "The Crown's Favorite Fails"
 tv_academy_debate.2035.a: "The Academy voids the tainted papers before the whole hall."
 tv_academy_debate.2035.b: "Some ledgers are best left unopened."
 tv_academy_debate.2035.d: "The investigators find that the cleanest papers on the examination table were copied out fair by the dirtiest patronage network in the realm.\n\n#Y This event appeared because the current debate issue is Meritocracy.#!"
 tv_academy_debate.2035.t: "Clean Ink, Dirty Hands"
 tv_academy_debate.2036.a: "The Crown grants the provincial school a seat at the examinations."
 tv_academy_debate.2036.b: "Not until the capital sets its seal."
 tv_academy_debate.2036.d: "A provincial school sends word that it can raise capable officials without a single lesson in court polish, and asks only that its graduates be allowed to sit the same examinations.\n\n#Y This event appeared because the current debate issue is Meritocracy.#!"
 tv_academy_debate.2036.t: "A School Outside the Capital"
 tv_academy_debate.2037.a: "The Crown swears the examiners its protection under seal."
 tv_academy_debate.2037.b: "Better not to wake the great houses."
 tv_academy_debate.2037.d: "Before they will set the results on the gate, the examiners ask the Crown for a sworn shield against the reprisals certain great houses are already promising them in quiet corridors.\n\n#Y This event appeared because the current debate issue is Meritocracy.#!"
 tv_academy_debate.2037.t: "Oath of the Examiners"
 tv_academy_debate.2038.a: "The torso is set on a plinth in the Academy hall."
 tv_academy_debate.2038.b: "We lock it away among the cabinet's curiosities."
 tv_academy_debate.2038.d: "Laborers turn up an ancient marble torso, its limbs long gone but its argument disturbingly whole. Artists crowd the trench and swear the stone has answered questions the commentaries kept promising to reach next year.\n\n#Y This event appeared because the current debate issue is Renaissance.#!"
 tv_academy_debate.2038.t: "A Torso Unearthed"
 tv_academy_debate.2039.a: "The physicians open the body before the assembled court."
 tv_academy_debate.2039.b: "Not before this court, and not today."
 tv_academy_debate.2039.d: "Physicians petition to hold a sanctioned dissection before courtiers and scholars. The old diagrams lie politely on the table, but the physicians warn that no amount of politeness has ever made a drawing true to the body beneath it.\n\n#Y This event appeared because the current debate issue is Renaissance.#!"
 tv_academy_debate.2039.t: "Anatomy Before the Court"
 tv_academy_debate.2040.a: "The design is praised and set as the model for the chapel."
 tv_academy_debate.2040.b: "Let the altar keep its ancient shape."
 tv_academy_debate.2040.d: "A painter unveils a chapel design in which arches, saints, and shadows all obey a single measured vanishing point. Some call it reverence made clearer; others mutter that geometry has come to stand rather too close to the altar.\n\n#Y This event appeared because the current debate issue is Renaissance.#!"
 tv_academy_debate.2040.t: "Perspective in the Chapel"
 tv_academy_debate.2041.a: "We open the treasury and let the court commission freely."
 tv_academy_debate.2041.b: "The court's giving stays ceremonial, a matter of form."
 tv_academy_debate.2041.d: "Artists lay a ledger on the table showing which workshops changed the month a patron paid, and which sermons only praised the change once it was already carved, painted, and delivered. Inspiration, the columns suggest, keeps a treasurer.\n\n#Y This event appeared because the current debate issue is Renaissance.#!"
 tv_academy_debate.2041.t: "The Patronage Ledger"
 tv_academy_debate.2042.a: "The tutor is given a public chair and an audience."
 tv_academy_debate.2042.b: "We keep such lessons behind closed doors."
 tv_academy_debate.2042.d: "A humanist tutor argues that a ruler should read history for instruction, not ornament. Several nobles hear the word \"instruction\" and at once begin wondering precisely who is to be instructed into surrendering his old habits.\n\n#Y This event appeared because the current debate issue is Renaissance.#!"
 tv_academy_debate.2042.t: "The Humanist Tutor"
 tv_academy_debate.2043.a: "Let them read, salt fish and Cicero alike."
 tv_academy_debate.2043.b: "The copies are confined to scholars' hands."
 tv_academy_debate.2043.d: "Cheap printed copies of the classical poets turn up on the stalls beside account books and salt fish. The Academy discovers, to its discomfort, that the old authors sound rather different when read by people who paid the market price for them.\n\n#Y This event appeared because the current debate issue is Renaissance.#!"
 tv_academy_debate.2043.t: "Classics in the Market"
 tv_academy_debate.2044.a: "We hold that beauty can school the mind in truth."
 tv_academy_debate.2044.b: "The Academy grants doctrine the higher seat."
 tv_academy_debate.2044.d: "An artist and a theologian fall to quarreling over whether beauty teaches truth or merely lures the soul away from it. The Academy sits and listens while brushwork and doctrine take turns accusing each other of vanity.\n\n#Y This event appeared because the current debate issue is Renaissance.#!"
 tv_academy_debate.2044.t: "Artist Versus Theologian"
 tv_academy_debate.2045.a: "The Crown pays for music, costumes, and stagecraft."
 tv_academy_debate.2045.b: "No, spare the realm a costumed sermon."
 tv_academy_debate.2045.d: "Courtiers propose a grand masque to celebrate rebirth, order, and the Crown's impeccable taste. All agree the doctrine would prove far more persuasive with music, costumes, and a generous sheaf of invoices.\n\n#Y This event appeared because the current debate issue is Renaissance.#!"
 tv_academy_debate.2045.t: "Court Masque of Renewal"
 tv_academy_debate.2046.a: "The surveyors' figures are printed for every workshop."
 tv_academy_debate.2046.b: "Old stones make poor schoolmasters."
 tv_academy_debate.2046.d: "Surveyors take the measure of the ancient ruins and turn up proportions that quietly embarrass the realm's living builders. The stones say nothing in reply, which only makes their arithmetic the harder to interrupt.\n\n#Y This event appeared because the current debate issue is Renaissance.#!"
 tv_academy_debate.2046.t: "A Ruin Measured"
 tv_academy_debate.2047.a: "We read the essays into the record without asterisk."
 tv_academy_debate.2047.b: "The salon is waved off as mere drawing-room talk."
 tv_academy_debate.2047.d: "A salon of learned women sets essays circulating that make the Academy look rather smaller than it likes to claim. The arguments arrive polished, attached to no chair or title, and inconveniently hard to wave away.\n\n#Y This event appeared because the current debate issue is Renaissance.#!"
 tv_academy_debate.2047.t: "Women's Learning Salon"
 tv_academy_debate.2048.a: "The Academy hires copyists and philologists to render it whole."
 tv_academy_debate.2048.b: "We set it aside for careful review first."
 tv_academy_debate.2048.d: "A Greek manuscript arrives carrying just enough ambiguity to start three arguments and found one school.\n\n#Y This event appeared because the current debate issue is Renaissance.#!"
 tv_academy_debate.2048.t: "Translation of a Greek Text"
 tv_academy_debate.2049.a: "The fresco is given the great wall of the Academy hall."
 tv_academy_debate.2049.b: "Peace; let the walls stay silent."
 tv_academy_debate.2049.d: "A fresco shows the realm stepping out of shadow into measured light. It is not in the least subtle, which is precisely why it works.\n\n#Y This event appeared because the current debate issue is Renaissance.#!"
 tv_academy_debate.2049.t: "Fresco of the New Age"
 tv_academy_debate.2050.a: "We make the new proportions the taught rule."
 tv_academy_debate.2050.b: "The old masters keep their bench and their rules."
 tv_academy_debate.2050.d: "The traditional masters of the guild refuse the new proportions outright, dismissing them as foreign vanity dressed up in a ruler and compass.\n\n#Y This event appeared because the current debate issue is Renaissance.#!"
 tv_academy_debate.2050.t: "The Old Workshop Resists"
 tv_academy_debate.2051.a: "The best of their lines are woven into the Academy's own case."
 tv_academy_debate.2051.b: "A rhyme outruns a ruling."
 tv_academy_debate.2051.d: "The poets set about turning the issue into quotable lines, a thing that may prove useful and is beyond doubt dangerous.\n\n#Y This event appeared because the current debate issue is Renaissance.#!"
 tv_academy_debate.2051.t: "Poets at the Debate"
 tv_academy_debate.2052.a: "We let the brush show the ruler as a man of learning."
 tv_academy_debate.2052.b: "The portraitist keeps the sacred distance of old."
 tv_academy_debate.2052.d: "The royal portraitist proposes to paint the ruler in the humanist manner, close and lifelike, rather than at the old sacred distance.\n\n#Y This event appeared because the current debate issue is Renaissance.#!"
 tv_academy_debate.2052.t: "The Prince's Portrait"
 tv_academy_debate.2053.a: "The new festival days are entered on the civic calendar."
 tv_academy_debate.2053.b: "No, the year's days are not ours to rearrange."
 tv_academy_debate.2053.d: "Scholars propose reshaping the civic festivals around learning, the arts, and civic pride, until the year's holy days and market days begin to look like an argument over what the realm chooses to honor.\n\n#Y This event appeared because the current debate issue is Renaissance.#!"
 tv_academy_debate.2053.t: "A New Calendar of Festivals"
 tv_academy_debate.2054.a: "The foreign master is given a studio and pupils."
 tv_academy_debate.2054.b: "We thank him warmly and send him on his way."
 tv_academy_debate.2054.d: "A foreign master offers techniques the local artists resent for being at once foreign and plainly better, so that every compliment paid to the visitor lands among them like a correction.\n\n#Y This event appeared because the current debate issue is Renaissance.#!"
 tv_academy_debate.2054.t: "The Imported Master"
 tv_academy_debate.2055.a: "The shelves are recast by subject, cover to cover."
 tv_academy_debate.2055.b: "We put every volume back where tradition kept it."
 tv_academy_debate.2055.d: "The humanists reorder the Academy library by subject rather than by the inherited tradition of the shelves, and all at once the old books begin introducing themselves to unfamiliar neighbors.\n\n#Y This event appeared because the current debate issue is Renaissance.#!"
 tv_academy_debate.2055.t: "The Library Reordered"
 tv_academy_debate.2056.a: "The Crown funds new squares, facades, and public works."
 tv_academy_debate.2056.b: "A cautious purse raises no monuments."
 tv_academy_debate.2056.d: "Urban reformers argue that streets, squares, and facades can school the citizens in better taste, provided the treasury will accept that stone is now a syllabus.\n\n#Y This event appeared because the current debate issue is Renaissance.#!"
 tv_academy_debate.2056.t: "The City as Classroom"
 tv_academy_debate.2057.a: "Let them laugh; laughter has its uses."
 tv_academy_debate.2057.b: "The bailiffs gather every printed copy by dusk."
 tv_academy_debate.2057.d: "A biting satire makes the old authorities look pompous, which is effective and a touch unfair; by noon half the Academy is laughing and the other half is quietly counting the copies.\n\n#Y This event appeared because the current debate issue is Renaissance.#!"
 tv_academy_debate.2057.t: "Satire of the Old Masters"
 tv_academy_debate.2058.a: "The Academy takes double-entry as its standard of proof."
 tv_academy_debate.2058.b: "We keep the accounts our clerks already know by heart."
 tv_academy_debate.2058.d: "A merchant accountant unrolls his ledger before the Academy and pairs each claim with its answering entry, credit against debit, until the columns close upon themselves. The arithmetic is dry and merciless, and for once more persuasive than any speech from the floor.\n\n#Y This event appeared because the current debate issue is Banking System.#!"
 tv_academy_debate.2058.t: "Double-Entry Before the Bench"
 tv_academy_debate.2059.a: "The bankers' roll is read into the record, seal by seal."
 tv_academy_debate.2059.b: "Enough. The roll never leaves this chamber."
 tv_academy_debate.2059.d: "Bankers arrive with a roll of noble debts, twice sealed and once already whispered over in the corridors. It shows that several proud houses stand upright only on the credit they denounce in public.\n\n#Y This event appeared because the current debate issue is Banking System.#!"
 tv_academy_debate.2059.t: "A Roll of Noble Debts"
 tv_academy_debate.2060.a: "We grant interest its due, then bind it with law."
 tv_academy_debate.2060.b: "The Academy lets the preacher's condemnation stand as its verdict."
 tv_academy_debate.2060.d: "At dawn a preacher turns interest into a sin plain enough for every debtor to feel in his own purse. By noon the Academy is quarreling over whether regulation purifies credit or merely hands vice a tidy receipt.\n\n#Y This event appeared because the current debate issue is Banking System.#!"
 tv_academy_debate.2060.t: "A Sermon Against Usury"
 tv_academy_debate.2061.a: "The Crown sets its seal to the new public bank."
 tv_academy_debate.2061.b: "We let the charter wait for a promise worth its wax."
 tv_academy_debate.2061.d: "City burghers draft a public bank propped on the Crown's promise. On paper it offers stability, and then, politely, invites the whole room to ask what that promise itself is worth.\n\n#Y This event appeared because the current debate issue is Banking System.#!"
 tv_academy_debate.2061.t: "A Public Bank on Paper"
 tv_academy_debate.2062.a: "The mints are opened and the coinage struck true again."
 tv_academy_debate.2062.b: "Silence, before the whispers empty every purse."
 tv_academy_debate.2062.d: "Rumor swears that the coin in every purse is thinner than the Crown's word, and the markets begin to weigh trust as carefully as they weigh silver.\n\n#Y This event appeared because the current debate issue is Banking System.#!"
 tv_academy_debate.2062.t: "Debased Coin Panic"
 tv_academy_debate.2063.a: "We set a rule around every coin a depositor entrusts to us."
 tv_academy_debate.2063.b: "The hall records the loss as a private misfortune and moves on."
 tv_academy_debate.2063.d: "A widow comes before the Academy with a receipt, a vanished dowry, and a voice too steady to be waved aside. What had been an argument over banking rules now has a face, and it is watching the bench.\n\n#Y This event appeared because the current debate issue is Banking System.#!"
 tv_academy_debate.2063.t: "The Widow's Deposit"
 tv_academy_debate.2064.a: "The clerks draft the credit law plain enough to bind Crown and lender alike."
 tv_academy_debate.2064.b: "Mind whose need you keep waiting at the counter."
 tv_academy_debate.2064.d: "An emergency loan is asked in the Crown's name; the bankers answer first with silence, then with conditions. The hall learns that unclear banking law can leave even royal need standing at the counter.\n\n#Y This event appeared because the current debate issue is Banking System.#!"
 tv_academy_debate.2064.t: "Royal Loan Refused"
 tv_academy_debate.2065.a: "The Academy endorses the bill of exchange as lawful tender of trust."
 tv_academy_debate.2065.b: "Coin in the hand outweighs ink on the page."
 tv_academy_debate.2065.d: "Merchants lay out letters, seals, and signatures showing how wealth can cross a border while the guarded carts are still arguing over which road to take. The paper looks fragile, right up until everyone notices how much coin it commands.\n\n#Y This event appeared because the current debate issue is Banking System.#!"
 tv_academy_debate.2065.t: "Bills of Exchange"
 tv_academy_debate.2066.a: "The forged book is exhibited as the case for enforceable standards."
 tv_academy_debate.2066.b: "We hang the clerk and let his betters keep their patrons."
 tv_academy_debate.2066.d: "The ledger is elegant, balanced, and false. Its columns keep the calm beauty of good order, which somehow makes the theft hidden inside them feel like an insult aimed at arithmetic itself.\n\n#Y This event appeared because the current debate issue is Banking System.#!"
 tv_academy_debate.2066.t: "The Ledger That Lies"
 tv_academy_debate.2067.a: "The Academy brings clerical lending under the same law as any other."
 tv_academy_debate.2067.b: "Peace with the cloister, for now."
 tv_academy_debate.2067.d: "Monasteries and church offices open their records just far enough to reveal a web of loans, pledges, and quiet exemptions. The debate discovers, with some awkwardness, that sacred hands can also reckon interest.\n\n#Y This event appeared because the current debate issue is Banking System.#!"
 tv_academy_debate.2067.t: "The Cloister's Credit Chest"
 tv_academy_debate.2068.a: "The Crown steps between the two crowds with a set of new rules."
 tv_academy_debate.2068.b: "Bar the doors, before debt turns into blood."
 tv_academy_debate.2068.d: "Debtors and creditors clash outside a city bank, each side brandishing contracts like wounds and calling the other robbery with neater handwriting. The Academy can no longer pretend that banking reform is only a quarrel among ledgers.\n\n#Y This event appeared because the current debate issue is Banking System.#!"
 tv_academy_debate.2068.t: "City Bank Riot"
 tv_academy_debate.2069.a: "We untie the ribbon and read every farmer's book aloud."
 tv_academy_debate.2069.b: "The old collectors keep their ribboned books and their comfortable shadows."
 tv_academy_debate.2069.d: "Tax farmers protest that transparent finance would make their trade less profitable, which is true and therefore very poorly received. Their ledgers arrive bound in ribbon, as though ribbon could dress rents up as service.\n\n#Y This event appeared because the current debate issue is Banking System.#!"
 tv_academy_debate.2069.t: "Accounts Tied in Ribbon"
 tv_academy_debate.2070.a: "The lecture halls take up the reckoning of compound interest."
 tv_academy_debate.2070.b: "What the debtor cannot count cannot frighten him."
 tv_academy_debate.2070.d: "A mathematician works compound interest across a clean slate, and several listeners look as though the chalk has just named them by name. What had passed for a merchant's habit becomes, line by line, a law of numbers.\n\n#Y This event appeared because the current debate issue is Banking System.#!"
 tv_academy_debate.2070.t: "A Scholar of Interest"
 tv_academy_debate.2071.a: "The clerks enroll the pooled fund as a civic protection."
 tv_academy_debate.2071.b: "A debt belongs to a face, not a fund."
 tv_academy_debate.2071.d: "Burghers propose a pooled fund for sailors' families, failed caravans, and the quiet disasters that trail a journey which never came home. The plan makes risk look less like fate and more like something a room of clerks can count together.\n\n#Y This event appeared because the current debate issue is Banking System.#!"
 tv_academy_debate.2071.t: "The Merchant Widows' Fund"
 tv_academy_debate.2072.a: "The foreign house is admitted, its every clause under the realm's watch."
 tv_academy_debate.2072.b: "We keep the realm's purse speaking its own tongue."
 tv_academy_debate.2072.d: "A foreign banking house offers expertise, capital, and a contract whose clauses are too neat to be entirely innocent. Supporters see imported knowledge; opponents see the realm's purse learning to speak with a foreign accent.\n\n#Y This event appeared because the current debate issue is Banking System.#!"
 tv_academy_debate.2072.t: "Foreign Banker Arrives"
 tv_academy_debate.2073.a: "The confession is printed and posted where the counting houses will read it."
 tv_academy_debate.2073.b: "Quietly, then; let the old man keep his pension."
 tv_academy_debate.2073.d: "A tired mint officer admits that the old coinage survives on tolerated confusion: clipped weights, private exceptions, and ledgers no one has quite dared to reconcile.\n\n#Y This event appeared because the current debate issue is Banking System.#!"
 tv_academy_debate.2073.t: "Mint Officer's Confession"
 tv_academy_debate.2074.a: "The paymasters settle the wages through the clarified banking practice."
 tv_academy_debate.2074.b: "We pass the hat among the private lenders one more time."
 tv_academy_debate.2074.d: "Soldiers wait outside the pay office while the treasurers argue over methods, reserves, and signatures. The debate suddenly acquires boots, hunger, and a very concrete sense of the hour.\n\n#Y This event appeared because the current debate issue is Banking System.#!"
 tv_academy_debate.2074.t: "Army Pay Delay"
 tv_academy_debate.2075.a: "The Academy requires that every contract speak in plain words."
 tv_academy_debate.2075.b: "We leave the fine print to those trained to read it."
 tv_academy_debate.2075.d: "Reformers bring a financial contract written so an ordinary reader can see exactly what binds him. The lawyers look as if someone has thrown open a window in the dead of winter.\n\n#Y This event appeared because the current debate issue is Banking System.#!"
 tv_academy_debate.2075.t: "Contract in Plain Language"
 tv_academy_debate.2076.a: "The Academy writes orderly bankruptcy into lawful procedure."
 tv_academy_debate.2076.b: "A ruined name pays what coin cannot."
 tv_academy_debate.2076.d: "A ruined merchant argues that an orderly bankruptcy saves workshops, creditors, and families far better than public disgrace ever managed. The moralists hear mercy; the bankers hear salvage.\n\n#Y This event appeared because the current debate issue is Banking System.#!"
 tv_academy_debate.2076.t: "The Shame of Bankruptcy"
 tv_academy_debate.2077.a: "We open the Crown's own accounts to the same daylight we demand of others."
 tv_academy_debate.2077.b: "The court keeps its accounts locked and its numbers to itself."
 tv_academy_debate.2077.d: "The Academy proposes a simplified royal account: figures enough to prove confidence, not so many that every court faction can sharpen a knife on them. The room at once asks where, precisely, that line is to be drawn.\n\n#Y This event appeared because the current debate issue is Banking System.#!"
 tv_academy_debate.2077.t: "The Crown's Accounts"
 tv_academy_debate.2078.a: "The pilots pin the chart above the great table and set a course by it."
 tv_academy_debate.2078.b: "We know tavern ink when we see it."
 tv_academy_debate.2078.d: "A sea-stained chart reaches the Academy, its coastlines refusing to lie flat against any known map. The blots look like tavern evidence until the copyists notice that every crooked line still points stubbornly west.\n\n#Y This event appeared because the current debate issue is Discovery of the New World.#!"
 tv_academy_debate.2078.t: "The Sailor's Chart"
 tv_academy_debate.2079.a: "A clerk calls the chamber to order and lets the pilot speak before every bench."
 tv_academy_debate.2079.b: "We take his account behind a closed door."
 tv_academy_debate.2079.d: "A pilot returns with salt crusted in his coat, fever still in his bones, and a story that repeats itself too exactly to be waved off as delirium. The Academy must decide whether the realm hears the tale as testimony or buries it as a secret.\n\n#Y This event appeared because the current debate issue is Discovery of the New World.#!"
 tv_academy_debate.2079.t: "Returned Pilot"
 tv_academy_debate.2080.a: "No coast is truly found until a soul is saved upon it."
 tv_academy_debate.2080.b: "The Academy seats the missionary and the surveyor at one table."
 tv_academy_debate.2080.d: "The clerics argue that discovery without conversion is merely wandering with better maps. The Academy's debate is torn between souls, surveys, and the awkward question of who is entitled to name a new shore first.\n\n#Y This event appeared because the current debate issue is Discovery of the New World.#!"
 tv_academy_debate.2080.t: "Clergy Ask for Mission Rights"
 tv_academy_debate.2081.a: "The seal is pressed, and harbors gain owners before they gain names."
 tv_academy_debate.2081.b: "Not so fast -- the shore answers to the Crown."
 tv_academy_debate.2081.d: "Merchants offer to fund voyages, provided the Crown lets them name harbors they have not yet laid eyes on. Their confidence is useful, expensive, and already busy pressing a seal onto empty water.\n\n#Y This event appeared because the current debate issue is Discovery of the New World.#!"
 tv_academy_debate.2081.t: "Merchants Want Charter"
 tv_academy_debate.2082.a: "We let the account rewrite what we thought we already knew."
 tv_academy_debate.2082.b: "The clerks file the account among the cabinet's curiosities."
 tv_academy_debate.2082.d: "A translated account from across the sea contradicts half the Academy's assumptions, and sounds not the least bit impressed by any of them. The room discovers that the new world has not been sitting silent, waiting politely to be described.\n\n#Y This event appeared because the current debate issue is Discovery of the New World.#!"
 tv_academy_debate.2082.t: "Native Envoy's Account"
 tv_academy_debate.2083.a: "The physicians are funded, and the ships sail with their cautions stowed aboard."
 tv_academy_debate.2083.b: "Fair coasts have foul fevers."
 tv_academy_debate.2083.d: "Physicians warn the Academy that new shores may bring fevers along with coastlines. The supporters of discovery must now prove that prudence can be stowed aboard the same ships as curiosity.\n\n#Y This event appeared because the current debate issue is Discovery of the New World.#!"
 tv_academy_debate.2083.t: "Disease Report"
 tv_academy_debate.2084.a: "We do not strike our colors for one empty harbor."
 tv_academy_debate.2084.b: "Enough. No more hulls into the dark."
 tv_academy_debate.2084.d: "An expedition fails to return, and the empty harbor makes its argument with better timing than any lecturer. Opponents call the silence proof; supporters answer that the unknown was never going to surrender politely.\n\n#Y This event appeared because the current debate issue is Discovery of the New World.#!"
 tv_academy_debate.2084.t: "Missing Expedition"
 tv_academy_debate.2085.a: "The strange goods are laid out where the harbor crowd can lay hands on them."
 tv_academy_debate.2085.b: "We keep the cargo under lock until the ledgers agree."
 tv_academy_debate.2085.d: "The harbor fills with people craning to watch strange goods come off the boards. Each object turns into a small ambassador, lending the Academy's argument color, weight, and something the crowd can actually point at.\n\n#Y This event appeared because the current debate issue is Discovery of the New World.#!"
 tv_academy_debate.2085.t: "Harbor Crowd"
 tv_academy_debate.2086.a: "The corrected coast is entered on the master chart, boundary and all."
 tv_academy_debate.2086.b: "Back to the old map, if you please."
 tv_academy_debate.2086.d: "A mapmaker scrapes away a traditional boundary before witnesses and inks a coast where certainty used to sit. The rasp of the knife sounds small, until the room grasps which authority has just lost its ink.\n\n#Y This event appeared because the current debate issue is Discovery of the New World.#!"
 tv_academy_debate.2086.t: "Mapmaker's Correction"
 tv_academy_debate.2087.a: "The dockyards are opened, and timber is cut for ships meant to survive the open sea."
 tv_academy_debate.2087.b: "We keep our hulls within sight of home."
 tv_academy_debate.2087.d: "Naval officers tell the Academy that discovery cannot be sailed on ceremonial timber. If the realm wants the ocean turned into a road, it must pay for ships built to outlast a parade.\n\n#Y This event appeared because the current debate issue is Discovery of the New World.#!"
 tv_academy_debate.2087.t: "Naval Officers Demand Funds"
 tv_academy_debate.2088.a: "We let greed pull the oars for once."
 tv_academy_debate.2088.b: "The chair denounces the rumor from the floor of the chamber."
 tv_academy_debate.2088.d: "Reports of gold spread faster than any reliable latitude. Supporters argue that greed can be harnessed before it hardens into policy by accident; opponents warn that the Academy is mistaking fever for evidence.\n\n#Y This event appeared because the current debate issue is Discovery of the New World.#!"
 tv_academy_debate.2088.t: "Rumor of Gold"
 tv_academy_debate.2089.a: "The Academy drafts a reply that concedes the rival not one league of coast."
 tv_academy_debate.2089.b: "Peace -- let the rival keep its paper coast."
 tv_academy_debate.2089.d: "A rival court claims the new coast first and sends letters polished smooth with confidence. All at once the Academy's question is no longer only whether the coast exists, but whether silence would hand it to someone else.\n\n#Y This event appeared because the current debate issue is Discovery of the New World.#!"
 tv_academy_debate.2089.t: "Foreign Claim"
 tv_academy_debate.2090.a: "The chamber praises the admission and enters the new figure without a blush."
 tv_academy_debate.2090.b: "We keep the miscalculation between these four walls."
 tv_academy_debate.2090.d: "The Academy's favored cosmographer admits that a major distance estimate was wrong. The error looks small on parchment only because parchment, mercifully, is flat.\n\n#Y This event appeared because the current debate issue is Discovery of the New World.#!"
 tv_academy_debate.2090.t: "Cosmographer's Error"
 tv_academy_debate.2091.a: "The paymaster opens his purse, and the chaplain his arguments, until the crews relent."
 tv_academy_debate.2091.b: "The sea keeps its own counsel."
 tv_academy_debate.2091.d: "Sailors refuse another voyage until the omens are answered, and every official explanation only seems to make the signs more stubborn. The Academy must decide whether fear at sea is a matter of pay, of persuasion, or of providence.\n\n#Y This event appeared because the current debate issue is Discovery of the New World.#!"
 tv_academy_debate.2091.t: "Sailors' Superstitions"
 tv_academy_debate.2092.a: "The Academy rewrites the charters, clause by watchful clause."
 tv_academy_debate.2092.b: "We call the whole experiment home."
 tv_academy_debate.2092.d: "A charter holder abuses distant authority before the principle has even won its argument at home. The scandal hands the opponents a sharp question: if discovery begins this badly, what exactly is being accepted?\n\n#Y This event appeared because the current debate issue is Discovery of the New World.#!"
 tv_academy_debate.2092.t: "Colonial Charter Abuse"
 tv_academy_debate.2093.a: "The seedlings are sent out to every willing field in the realm."
 tv_academy_debate.2093.b: "Behind the fence it stays."
 tv_academy_debate.2093.d: "A strange crop survives in the Academy's test garden, stubbornly green where theory had promised only rumor. Farmers, merchants, and skeptics gather around the leaves, because the unknown has finally become something a man can water.\n\n#Y This event appeared because the current debate issue is Discovery of the New World.#!"
 tv_academy_debate.2093.t: "Imported Crop"
 tv_academy_debate.2094.a: "The realm proclaims its right to sail wherever a keel can reach."
 tv_academy_debate.2094.b: "We will not trade solid ground for imagined shores."
 tv_academy_debate.2094.d: "Diplomats ask whether shores still half-imagined by mapmakers can already be carved up with ink. All at once the Academy's argument is not only about what exists, but about who may claim the right to arrive there first.\n\n#Y This event appeared because the current debate issue is Discovery of the New World.#!"
 tv_academy_debate.2094.t: "Treaty of Unknown Shores"
 tv_academy_debate.2095.a: "Copies of the grammar pass from the Academy benches to the pulpits alike."
 tv_academy_debate.2095.b: "Scripture before syntax."
 tv_academy_debate.2095.d: "A missionary arrives with a grammar of a tongue no courtier can pronounce without humility. The pages prove that discovery has voices, rules, and meanings of its own, and is not merely a set of coastlines waiting to be named.\n\n#Y This event appeared because the current debate issue is Discovery of the New World.#!"
 tv_academy_debate.2095.t: "Missionary Grammar"
 tv_academy_debate.2096.a: "The Crown underwrites the expedition against wind and wave alike."
 tv_academy_debate.2096.b: "We let the frightened money walk away."
 tv_academy_debate.2096.d: "A storm splinters the ships readied for the next voyage, and the port's confidence cracks nearly as loudly as the masts. Investors who praised discovery yesterday now pore over the wreckage like accountants of fear.\n\n#Y This event appeared because the current debate issue is Discovery of the New World.#!"
 tv_academy_debate.2096.t: "Port Investors Panic"
 tv_academy_debate.2097.a: "The globe is set in the schoolroom for every pupil to turn."
 tv_academy_debate.2097.b: "For learned hands only."
 tv_academy_debate.2097.d: "A new globe is carried into the Academy schoolroom, round enough to make the old wall maps look embarrassed. Students turn it by hand, and the room discovers that geography can shift beneath one's fingers.\n\n#Y This event appeared because the current debate issue is Discovery of the New World.#!"
 tv_academy_debate.2097.t: "School Globe"
 tv_academy_debate.2098.a: "The clerks cart the pamphlets to every stall and street corner."
 tv_academy_debate.2098.b: "We keep the run among scholars until such ink is safe to read aloud."
 tv_academy_debate.2098.d: "The first pamphlet run comes off the press still smelling of ink, finished before the censors have finished deciding what a pamphlet legally is. The type is already broken up for the next job; the ruling, one suspects, will arrive around the same time as the second edition.\n\n#Y This event appeared because the current debate issue is Printing Press Applications.#!"
 tv_academy_debate.2098.t: "The First Pamphlet Run"
 tv_academy_debate.2099.a: "The charter is sealed and the presses join the roll of honest trades."
 tv_academy_debate.2099.b: "We would sooner license each press one by one, by its own name."
 tv_academy_debate.2099.d: "The printers come before the Academy asking for a charter, a guild hall, and a name in law, before yet more presses take up residence in cellars and borrowed kitchens.\n\n#Y This event appeared because the current debate issue is Printing Press Applications.#!"
 tv_academy_debate.2099.t: "The Printers' Petition"
 tv_academy_debate.2100.a: "We will not let the church decide which books are born guilty."
 tv_academy_debate.2100.b: "The index is approved, and every printed argument waits upon the censor's mark."
 tv_academy_debate.2100.d: "The clergy propose an index of dangerous books, drawn up with great care and longer than most libraries. The students, hearing the list read aloud, take it for a reading list and copy down every title.\n\n#Y This event appeared because the current debate issue is Printing Press Applications.#!"
 tv_academy_debate.2100.t: "The Index of Dangerous Books"
 tv_academy_debate.2101.a: "The presses are turned toward reform, one cheap sheet at a time."
 tv_academy_debate.2101.b: "Enough, before every hedgerow preacher keeps a press of his own."
 tv_academy_debate.2101.d: "Cheap printed prayer sheets reach the villages faster than the official sermons that were meant to precede them. A parish priest complains that his congregation now corrects his readings from folded paper kept warm in a pocket.\n\n#Y This event appeared because the current debate issue is Printing Press Applications.#!"
 tv_academy_debate.2101.t: "Prayer Sheets for a Penny"
 tv_academy_debate.2102.a: "We will not muzzle the press for printing what the court would rather bury."
 tv_academy_debate.2102.b: "The bailiffs close the shop and return its type to the case."
 tv_academy_debate.2102.d: "A printer sets court gossip beside serious argument on the same sheet, and finds both columns sell equally well. The philosophers are appalled to learn how near their reasoning sits to a duchess's indiscretions, and how much thinner the crowd is on their side of the page.\n\n#Y This event appeared because the current debate issue is Printing Press Applications.#!"
 tv_academy_debate.2102.t: "The Scandal Sheet"
 tv_academy_debate.2103.a: "At last, a diagram that stays exactly where its author set it."
 tv_academy_debate.2103.b: "The committee holds the book back for another season of review."
 tv_academy_debate.2103.d: "A printed textbook carries corrected diagrams into every school in a single season, each copy identical to the last down to the smallest figure. What once took a copyist a winter to spread, and to spoil, now travels in weeks without a single wandering pen to blame.\n\n#Y This event appeared because the current debate issue is Printing Press Applications.#!"
 tv_academy_debate.2103.t: "The Corrected Textbook"
 tv_academy_debate.2104.a: "The treasury opens, and the mills are turning again by week's end."
 tv_academy_debate.2104.b: "We will print within our means, or not at all."
 tv_academy_debate.2104.d: "The paper makers send word that debate cannot be printed on enthusiasm alone; the rag pickers are empty-handed and the mills stand quiet. Every stirring speech in the chamber, it turns out, is measured in bales that no one has bought.\n\n#Y This event appeared because the current debate issue is Printing Press Applications.#!"
 tv_academy_debate.2104.t: "The Paper Shortage"
 tv_academy_debate.2105.a: "Let them shout, the walls have carried worse."
 tv_academy_debate.2105.b: "The watch is set to trace the paste back to whoever mixed it."
 tv_academy_debate.2105.d: "Anonymous broadsides take up the issue with such thundering vigor that even its allies begin to edge away from the paste on the walls. Support like this, one supporter mutters, is the kind a man survives rather than enjoys.\n\n#Y This event appeared because the current debate issue is Printing Press Applications.#!"
 tv_academy_debate.2105.t: "The Anonymous Broadsides"
 tv_academy_debate.2106.a: "We answer them in the same ink, and on the same day."
 tv_academy_debate.2106.b: "A dog barking across the border need not be answered."
 tv_academy_debate.2106.d: "A foreign press reprints the Academy's arguments with fresh errors, sharpened insults, and genuinely impressive speed. The scholars can scarcely decide whether to be flattered by the theft or wounded by the spelling.\n\n#Y This event appeared because the current debate issue is Printing Press Applications.#!"
 tv_academy_debate.2106.t: "A Foreign Press Reprints Us"
 tv_academy_debate.2107.a: "The scribes are set before the presses and taught the trays of type."
 tv_academy_debate.2107.b: "No craftsman should be pressed out of his own bread."
 tv_academy_debate.2107.d: "The scribes warn that movable type will starve honest hands and dishonest abbreviations in equal measure. Their petition is, as ever, beautifully lettered, and there is something mournful in a craft that pleads for its life in its own finest script.\n\n#Y This event appeared because the current debate issue is Printing Press Applications.#!"
 tv_academy_debate.2107.t: "The Scribes' Protest"
 tv_academy_debate.2108.a: "The Chancery orders every proclamation set in one standard type."
 tv_academy_debate.2108.b: "We keep our proclamations as the heralds have always cried them."
 tv_academy_debate.2108.d: "The officials discover that a printed proclamation reaches the people before rumor has time to edit it, word for word as the Crown intended. It is a novel and slightly unsettling experience for a government to be quoted correctly.\n\n#Y This event appeared because the current debate issue is Printing Press Applications.#!"
 tv_academy_debate.2108.t: "The Proclamation in Print"
 tv_academy_debate.2109.a: "The book is legalized and reissued, wrapped in official annotation."
 tv_academy_debate.2109.b: "Off the shelves with every last copy."
 tv_academy_debate.2109.d: "A banned book grows popular precisely because it is banned, as books will sometimes do out of sheer spite. The censor who condemned it has, without meaning to, written the most effective advertisement of the season.\n\n#Y This event appeared because the current debate issue is Printing Press Applications.#!"
 tv_academy_debate.2109.t: "The Success of a Forbidden Book"
 tv_academy_debate.2110.a: "The university is granted a press within its own walls."
 tv_academy_debate.2110.b: "We would have every press in the realm answer to one office."
 tv_academy_debate.2110.d: "A university petitions for a press of its own, weary of begging the city printers to set sober scholarship ahead of ballads and playbills. Its scholars would rather wait on their own ink than on a tradesman's sense of priorities.\n\n#Y This event appeared because the current debate issue is Printing Press Applications.#!"
 tv_academy_debate.2110.t: "The University's Own Press"
 tv_academy_debate.2111.a: "The presses run again, this time to print the corrections."
 tv_academy_debate.2111.b: "A falsehood set in type is still a falsehood, only faster."
 tv_academy_debate.2111.d: "One faulty printed table carries the same error, faithfully and identically, through several hundred copies. Print, it is quietly noted, has learned to be wrong with a consistency the old copyists never managed.\n\n#Y This event appeared because the current debate issue is Printing Press Applications.#!"
 tv_academy_debate.2111.t: "The Multiplied Error"
 tv_academy_debate.2112.a: "We let the tune carry what our footnotes never could."
 tv_academy_debate.2112.b: "The magistrates order the ballad struck from the presses."
 tv_academy_debate.2112.d: "A printed ballad explains the whole debate badly, memorably, and to a tune no one can shake before nightfall. The philosophers wince at the rhymes; the streets, meanwhile, are humming their argument back at them.\n\n#Y This event appeared because the current debate issue is Printing Press Applications.#!"
 tv_academy_debate.2112.t: "The Ballad of the Question"
 tv_academy_debate.2113.a: "The court finds for the printer and lets the pamphlet stand."
 tv_academy_debate.2113.b: "Costly wit, this. Let him pay for it."
 tv_academy_debate.2113.d: "A noble sues a printer for making old privilege look ridiculous in cheap, legible type. The offending pamphlet did not so much argue against his rank as set it plainly on the page, where anyone with a penny could laugh.\n\n#Y This event appeared because the current debate issue is Printing Press Applications.#!"
 tv_academy_debate.2113.t: "The Noble's Libel Suit"
 tv_academy_debate.2114.a: "The editions go to press in every tongue the realm speaks."
 tv_academy_debate.2114.b: "We will keep the argument to a single official tongue."
 tv_academy_debate.2114.d: "The printers propose editions in several languages at once, which would make the argument far harder to fence in. A thought that already refuses to stay in one book now proposes to escape into every mouth in the realm.\n\n#Y This event appeared because the current debate issue is Printing Press Applications.#!"
 tv_academy_debate.2114.t: "The Edition in Many Tongues"
 tv_academy_debate.2115.a: "The regimental presses are set to work turning out manuals and sheets."
 tv_academy_debate.2115.b: "We keep the presses to civil business alone."
 tv_academy_debate.2115.d: "The officers request printed drill manuals and technical sheets, each copy identical so that no company learns the maneuver a different way. What the philosophers debate as principle, the sergeants would like delivered as instructions, correctly numbered.\n\n#Y This event appeared because the current debate issue is Printing Press Applications.#!"
 tv_academy_debate.2115.t: "A Press in the Barracks"
 tv_academy_debate.2116.a: "So be it, fame sells as many pages as truth does."
 tv_academy_debate.2116.b: "The Academy sets the authors' names back above the printer's."
 tv_academy_debate.2116.d: "A printer grows famous enough to irritate the scholars who actually wrote the words he is celebrated for setting. He is invited to dinners, quoted in salons, and praised for sentences he merely spaced evenly.\n\n#Y This event appeared because the current debate issue is Printing Press Applications.#!"
 tv_academy_debate.2116.t: "The Famous Printer"
 tv_academy_debate.2117.a: "Ink dries faster than a censor's caution."
 tv_academy_debate.2117.b: "The Academy waits, exactly as the process requires."
 tv_academy_debate.2117.d: "The censor deliberates so long that the issue is in danger of dying quietly and politely in a locked drawer. No verdict has been refused; it is simply that the ink of the decision seems reluctant ever to dry.\n\n#Y This event appeared because the current debate issue is Printing Press Applications.#!"
 tv_academy_debate.2117.t: "The Censor's Delay"
 tv_academy_debate.2118.a: "The Crown declares its confession a rule of state."
 tv_academy_debate.2118.b: "We keep the royal faith to the chapel and let silence do the rest."
 tv_academy_debate.2118.d: "The courtiers finally ask aloud what the antechambers have whispered for a season: should the Crown's faith stand in the open as a rule for the whole realm, or remain a private habit, professed by chapel attendance and the occasional well-judged silence?\n\n#Y This event appeared because the current debate issue is Confessionalism.#!"
 tv_academy_debate.2118.t: "The Crown's Confession"
 tv_academy_debate.2119.a: "We order every parish to keep its register in one steady hand."
 tv_academy_debate.2119.b: "The registers stay in the parish chest, as they always have."
 tv_academy_debate.2119.d: "Reformers lay a stack of parish registers before the Academy and make their case plainly: belief, marriage, and birth cannot guide policy until the state can read them all in one steady hand. The clerks, for their part, look delighted.\n\n#Y This event appeared because the current debate issue is Confessionalism.#!"
 tv_academy_debate.2119.t: "The Parish Registers"
 tv_academy_debate.2120.a: "The Crown grants a license to every pulpit that would speak for orthodoxy."
 tv_academy_debate.2120.b: "Let the old pulpits be."
 tv_academy_debate.2120.d: "Now that doctrine has begun to sound like government, the pulpit no longer feels merely local. Preachers want to know plainly: when every sermon can be mistaken for policy, who is permitted to speak for orthodoxy?\n\n#Y This event appeared because the current debate issue is Confessionalism.#!"
 tv_academy_debate.2120.t: "The Licensed Pulpit"
 tv_academy_debate.2121.a: "The bishop's visitors shutter the family chapel until its rites conform."
 tv_academy_debate.2121.b: "We let the old family keep its candles."
 tv_academy_debate.2121.d: "A great house keeps up a chapel rite that no longer fits the confession now taking shape. Its defenders call the practice family honor; its opponents call it a loophole with candles.\n\n#Y This event appeared because the current debate issue is Confessionalism.#!"
 tv_academy_debate.2121.t: "The Noble Chapel"
 tv_academy_debate.2122.a: "We send it to the printing house before the arguments can catch up."
 tv_academy_debate.2122.b: "The draft goes back to committee for another round of consensus."
 tv_academy_debate.2122.d: "Scholars produce a catechism short enough for a child to memorize and sharp enough for grown men to quarrel over. Its margins, crowded with rival hands, already look like a battlefield.\n\n#Y This event appeared because the current debate issue is Confessionalism.#!"
 tv_academy_debate.2122.t: "The Catechism Draft"
 tv_academy_debate.2123.a: "The jurists write minority protection into the confession itself."
 tv_academy_debate.2123.b: "Best make no promises we may have to keep."
 tv_academy_debate.2123.d: "Elders of a minority community come to the Academy with a petition folded under careful seals. They do not deny the realm's confession; they ask only what obedience will buy them - protection, or merely a quieter kind of exclusion.\n\n#Y This event appeared because the current debate issue is Confessionalism.#!"
 tv_academy_debate.2123.t: "The Minority Petition"
 tv_academy_debate.2124.a: "We bind the whole camp with one oath before local custom can divide it."
 tv_academy_debate.2124.b: "The regiments keep the oaths their fathers swore."
 tv_academy_debate.2124.d: "Officers warn that soldiers who pray in a dozen different parishes still stand in the same line of battle. They want one oath, strong enough to bind the camp before local custom can pull it apart.\n\n#Y This event appeared because the current debate issue is Confessionalism.#!"
 tv_academy_debate.2124.t: "The Army's Oath"
 tv_academy_debate.2125.a: "The summons goes out, and the synod is called before witnesses enough to bind memory."
 tv_academy_debate.2125.b: "Least said, soonest mended."
 tv_academy_debate.2125.d: "Someone proposes a formal synod, with witnesses numerous enough that no faction can later pretend the hard words were never spoken. Doctrine would leave the Academy as a public settlement, sealed and dated, rather than as a rumor.\n\n#Y This event appeared because the current debate issue is Confessionalism.#!"
 tv_academy_debate.2125.t: "The Synod Summons"
 tv_academy_debate.2126.a: "A clerk reads the foreign letters into the record, signatures and all."
 tv_academy_debate.2126.b: "We keep our confession a domestic matter and return the letters unopened."
 tv_academy_debate.2126.d: "Letters arrive from co-religionists abroad, full of encouragement, unsolicited advice, and signatures too prominent to ignore. Their backing strengthens the argument in the hall - and makes every listener wonder who else, across the border, is listening.\n\n#Y This event appeared because the current debate issue is Confessionalism.#!"
 tv_academy_debate.2126.t: "Foreign Co-Religionists"
 tv_academy_debate.2127.a: "The revised calendar is proclaimed, crossed-out feast days and all."
 tv_academy_debate.2127.b: "Custom is a calendar no decree can rewrite."
 tv_academy_debate.2127.d: "Reformers spread a revised holy calendar across the table and discover, feast by feast, that every crossed-out day trails neighbors, guilds, and grandparents behind it. The state may align sacred time, it seems, but never quietly.\n\n#Y This event appeared because the current debate issue is Confessionalism.#!"
 tv_academy_debate.2127.t: "The Feast-Day Reform"
 tv_academy_debate.2128.a: "The new primers are approved for every schoolroom in the realm."
 tv_academy_debate.2128.b: "Let each schoolmaster teach his own."
 tv_academy_debate.2128.d: "New schoolbooks reach the Academy with doctrine printed beside the spelling lists, the sums, and the civic maxims. Children will learn their letters and the realm's confession from one and the same page.\n\n#Y This event appeared because the current debate issue is Confessionalism.#!"
 tv_academy_debate.2128.t: "The Confessional Primer"
 tv_academy_debate.2129.a: "Marshals set a fixed route and a fixed hour for the pilgrimage."
 tv_academy_debate.2129.b: "We leave the pilgrims to their own ancient discipline."
 tv_academy_debate.2129.d: "A pilgrimage tips from devotion into street violence where rival sermons, old badges, and new slogans all crowd onto the same road. The Academy must judge whether an inherited custom can be disciplined without being broken.\n\n#Y This event appeared because the current debate issue is Confessionalism.#!"
 tv_academy_debate.2129.t: "The Pilgrim Riot"
 tv_academy_debate.2130.a: "We give confession a court of its own for every hearth in the realm."
 tv_academy_debate.2130.b: "Marriage stays where it has always been settled, in the clergy's own courts."
 tv_academy_debate.2130.d: "Jurists propose marriage courts recognized by the state and ruled by confessional law. What families once carried quietly to a familiar priest may soon arrive instead with seals, clerks, and a shelf of precedent.\n\n#Y This event appeared because the current debate issue is Confessionalism.#!"
 tv_academy_debate.2130.t: "The Marriage Court"
 tv_academy_debate.2131.a: "The synod fixes one rule for the image, and calls it settled."
 tv_academy_debate.2131.b: "Not every quarrel needs a verdict."
 tv_academy_debate.2131.d: "A church image turns into more than paint and wood the moment preachers, worshippers, and officials all insist it proves their side. The question is no longer whether the image is beautiful, but who may say what devotion means.\n\n#Y This event appeared because the current debate issue is Confessionalism.#!"
 tv_academy_debate.2131.t: "The Icon in Question"
 tv_academy_debate.2132.a: "The Crown throws its protection over the preachers across the frontier."
 tv_academy_debate.2132.b: "Peace, before a sermon starts a war."
 tv_academy_debate.2132.d: "Preachers slip across the frontier with sermons sharp enough to win converts and complaints in equal measure. Their doctrine strengthens the debate at home, but now every border village carries a diplomatic echo back into the halls.\n\n#Y This event appeared because the current debate issue is Confessionalism.#!"
 tv_academy_debate.2132.t: "The Border Preachers"
 tv_academy_debate.2133.a: "The collectors add a school levy to every parish assessment."
 tv_academy_debate.2133.b: "No new tax, whatever we choose to call it."
 tv_academy_debate.2133.d: "Officials propose a dedicated levy for the confessional schools, arguing that doctrine taught cheaply is doctrine forgotten quickly. The villages, however, hear the word \"school\" and quietly count the word \"tax.\"\n\n#Y This event appeared because the current debate issue is Confessionalism.#!"
 tv_academy_debate.2133.t: "The Confession Tax"
 tv_academy_debate.2134.a: "The Crown binds the clergy to the doctrine they serve."
 tv_academy_debate.2134.b: "We let the clergy keep the privileges of their order."
 tv_academy_debate.2134.d: "Clergy who once spoke as a single estate now split over the new confession: should it discipline them as servants of a doctrine, or shield them as guardians of an inherited privilege?\n\n#Y This event appeared because the current debate issue is Confessionalism.#!"
 tv_academy_debate.2134.t: "The Clergy Divided"
 tv_academy_debate.2135.a: "We take the recantation and spare the man his humiliation."
 tv_academy_debate.2135.b: "The opponent is made to recant on his knees, before the whole hall."
 tv_academy_debate.2135.d: "A prominent opponent offers to recant, if only the Academy will spare him the ritual humiliation. Some read mercy as a proof of confidence; others read it as a squandered chance to make resistance tremble.\n\n#Y This event appeared because the current debate issue is Confessionalism.#!"
 tv_academy_debate.2135.t: "The Public Recantation"
 tv_academy_debate.2136.a: "The census-takers sort every community into its confessional column."
 tv_academy_debate.2136.b: "What is counted is easily hunted."
 tv_academy_debate.2136.d: "Bureaucrats ask to count every community by its confession, promising that neat columns are calmer than loose rumors. The minority elders notice, without saying so, that a column can become a target quite as easily as a tool.\n\n#Y This event appeared because the current debate issue is Confessionalism.#!"
 tv_academy_debate.2136.t: "The Confessional Census"
 tv_academy_debate.2137.a: "The royal formula is proclaimed from every market cross."
 tv_academy_debate.2137.b: "Back to the drafting table with it."
 tv_academy_debate.2137.d: "Advisers draft a royal formula meant to sound ancient by tomorrow morning and inevitable by next week. The words are polished enough to shine - which is not at all the same thing as being settled.\n\n#Y This event appeared because the current debate issue is Confessionalism.#!"
 tv_academy_debate.2137.t: "The Crown's Formula"
 tv_academy_debate.2138.a: "The clerks read every column aloud to the full table."
 tv_academy_debate.2138.b: "We call it merchant arithmetic, and turn the page."
 tv_academy_debate.2138.d: "Harbor clerks unroll ledgers of salt, silk, spice, freight, and insurance across the Academy table, one column crowding the next. Every figure insists that distant prices already govern the realm, whatever landed honor pretends not to smell.\n\n#Y This event appeared because the current debate issue is Global Trade.#!"
 tv_academy_debate.2138.t: "Harbor Ledgers"
 tv_academy_debate.2139.a: "The Crown grants the quarter its warehouses and its guards."
 tv_academy_debate.2139.b: "Guests at the wharf, never partners in it."
 tv_academy_debate.2139.d: "Foreign merchants ask for warehouses, lodging, and watchmen of their own beside the harbor. The request sounds merely practical, until the room realizes it would give distant markets a permanent address, a doorplate, and quite possibly better locks than the Crown's.\n\n#Y This event appeared because the current debate issue is Global Trade.#!"
 tv_academy_debate.2139.t: "Foreign Merchant Quarter"
 tv_academy_debate.2140.a: "We cut the schedule down to rules a merchant can read."
 tv_academy_debate.2140.b: "A familiar tangle is safer than a strange order."
 tv_academy_debate.2140.d: "A customs review turns up duties so tangled that profitable cargo is punished by accident while favored goods drift through by habit. The schedule has become a policy quarrel written entirely in crossed-out numbers.\n\n#Y This event appeared because the current debate issue is Global Trade.#!"
 tv_academy_debate.2140.t: "Tariff Confusion"
 tv_academy_debate.2141.a: "The cargo is opened where every nose in the hall can judge it."
 tv_academy_debate.2141.b: "We put it to tax before it can testify."
 tv_academy_debate.2141.d: "A spice cargo is broached before the Academy, and the room fills with a scent no inland tax register has ever managed to record. All at once the distant islands feel less like rumor and more like an argument that has turned up wearing cinnamon.\n\n#Y This event appeared because the current debate issue is Global Trade.#!"
 tv_academy_debate.2141.t: "Spice Cargo"
 tv_academy_debate.2142.a: "We answer that a full warehouse honors the realm no less than a field."
 tv_academy_debate.2142.b: "The chair reassures the landed benches that fields come first."
 tv_academy_debate.2142.d: "Inland nobles warn that ocean trade is teaching the realm to bow to warehouses instead of fields. Their speeches arrive polished, wounded, and wholly convinced that wealth ought still to smell of turned earth.\n\n#Y This event appeared because the current debate issue is Global Trade.#!"
 tv_academy_debate.2142.t: "Port Nobles Object"
 tv_academy_debate.2143.a: "The Academy enters maritime insurance into the record."
 tv_academy_debate.2143.b: "Every man drowns on his own account."
 tv_academy_debate.2143.d: "Merchants lay storm accounts, wreck inventories, and survivors' statements before the Academy. Their argument is blunt as a bosun: a realm that would share distant profit must first learn to share distant loss.\n\n#Y This event appeared because the current debate issue is Global Trade.#!"
 tv_academy_debate.2143.t: "Insurance for Ships"
 tv_academy_debate.2144.a: "The clerks redraw the legal routes to match the smugglers' craft."
 tv_academy_debate.2144.b: "Into the fire with it."
 tv_academy_debate.2144.d: "A seized map marks coves, warehouses, quiet roads, and trusted signals with more diligence than any customs register ever mustered. The illegal network is a great embarrassment, chiefly because it works.\n\n#Y This event appeared because the current debate issue is Global Trade.#!"
 tv_academy_debate.2144.t: "Smuggler's Map"
 tv_academy_debate.2145.a: "The council bargains a set of protections for the docks."
 tv_academy_debate.2145.b: "We clear the quays and set the cranes moving again."
 tv_academy_debate.2145.d: "Dockworkers still the cranes, ropes, carts, and shouting that make trade look effortless from inside a council chamber. They put one plain question to the Academy: why should widening commerce make every wage feel smaller?\n\n#Y This event appeared because the current debate issue is Global Trade.#!"
 tv_academy_debate.2145.t: "Dock Labor Strike"
 tv_academy_debate.2146.a: "The rival envoys are received in the open hall."
 tv_academy_debate.2146.b: "Courtesy at the gate, and no farther."
 tv_academy_debate.2146.d: "A rival court sends merchants bearing gifts, draft contracts, and compliments buffed until they very nearly pass for friendship. Every offer carries the faint, familiar scent of opportunity mixed with leverage.\n\n#Y This event appeared because the current debate issue is Global Trade.#!"
 tv_academy_debate.2146.t: "Rival Trade Embassy"
 tv_academy_debate.2147.a: "The traders' scales give way to one standard across the realm."
 tv_academy_debate.2147.b: "Every town keeps its own measure."
 tv_academy_debate.2147.d: "Traders arrive with scales, stones, stamped bars, and accusations enough to fill half the market towns in the realm. Fraud here has grown so local that men now defend it as tradition.\n\n#Y This event appeared because the current debate issue is Global Trade.#!"
 tv_academy_debate.2147.t: "Standard Weights"
 tv_academy_debate.2148.a: "The Academy joins caravan to convoy as a single system."
 tv_academy_debate.2148.b: "We keep each route to its own privilege."
 tv_academy_debate.2148.d: "Inland caravan masters and sea captains wrangle over which route deserves the Crown's coin. In the Academy chamber, road dust and salt spray are each offered as proof that the realm must learn to treat distance as one connected thing.\n\n#Y This event appeared because the current debate issue is Global Trade.#!"
 tv_academy_debate.2148.t: "Caravan and Convoy"
 tv_academy_debate.2149.a: "The Crown endows a school for navigation and contracts."
 tv_academy_debate.2149.b: "Let the counting-table stay in the family."
 tv_academy_debate.2149.d: "Burghers propose teaching navigation, contracts, and languages as serious public knowledge. The notion unsettles everyone who would rather commerce stayed a family secret with a counting table attached.\n\n#Y This event appeared because the current debate issue is Global Trade.#!"
 tv_academy_debate.2149.t: "Merchant School"
 tv_academy_debate.2150.a: "The grain keeps moving, under a watchful eye."
 tv_academy_debate.2150.b: "We bar the export gates until the fields recover."
 tv_academy_debate.2150.d: "A poor harvest makes every export look like treason to a hungry town. Merchants insist their contracts keep tomorrow's grain moving; the crowd at the door wants to know why tomorrow's trust should outrank tonight's bread.\n\n#Y This event appeared because the current debate issue is Global Trade.#!"
 tv_academy_debate.2150.t: "Export Panic"
 tv_academy_debate.2151.a: "Inspectors are trained to keep the harbor open and clean at once."
 tv_academy_debate.2151.b: "We turn the foreign hulls away at the mole."
 tv_academy_debate.2151.d: "Quarantine officials slow the trade and offer survival as their defense. Merchants call each delay a lost season; the physicians answer that the busiest harbor in the world is worthless if it lands the next funeral.\n\n#Y This event appeared because the current debate issue is Global Trade.#!"
 tv_academy_debate.2151.t: "Port Quarantine"
 tv_academy_debate.2152.a: "The Crown funds escorts for every profitable horizon."
 tv_academy_debate.2152.b: "The sea insures no one."
 tv_academy_debate.2152.d: "Merchants demand escorts and admirals demand funds, a match no one has ever called cheap. The Academy hears a simple question dressed in expensive clothes: if trade is now global, must the state guard every horizon it profits from?\n\n#Y This event appeared because the current debate issue is Global Trade.#!"
 tv_academy_debate.2152.t: "Naval Escort Debate"
 tv_academy_debate.2153.a: "We strike the locks off the old monopoly."
 tv_academy_debate.2153.b: "The masters keep their charters intact."
 tv_academy_debate.2153.d: "Overseas traders lay their contracts beside the city guild charters and call the old monopolies beautiful chains. The masters bristle, though the younger merchants can already hear distant markets rattling the locks.\n\n#Y This event appeared because the current debate issue is Global Trade.#!"
 tv_academy_debate.2153.t: "Guild Monopoly Challenge"
 tv_academy_debate.2154.a: "The Academy fixes one wording for every contract."
 tv_academy_debate.2154.b: "Let each market keep its own tongue."
 tv_academy_debate.2154.d: "Translators bring three versions of the same trade contract to the Academy, and only one of them would have saved the cargo. The room learns, a little late, that a fortune can drown inside a single ambiguous clause.\n\n#Y This event appeared because the current debate issue is Global Trade.#!"
 tv_academy_debate.2154.t: "Language of Contracts"
 tv_academy_debate.2155.a: "We admit that distant prices now steer us."
 tv_academy_debate.2155.b: "Blame the speculators, naturally."
 tv_academy_debate.2155.d: "Word arrives that a price has shifted abroad, and local plans collapse before the officials can finish insisting that foreign markets are far away. The Academy hears the distance between ports shrink until it fits inside a single number.\n\n#Y This event appeared because the current debate issue is Global Trade.#!"
 tv_academy_debate.2155.t: "Distant Price Shock"
 tv_academy_debate.2156.a: "The Crown charters the free port."
 tv_academy_debate.2156.b: "We reject the experiment and keep the gates."
 tv_academy_debate.2156.d: "Reformers sketch a harbor where the Crown taxes movement instead of throttling it at every gate. The customs men call it reckless; the merchants call it the first honest map of how goods have been moving all along.\n\n#Y This event appeared because the current debate issue is Global Trade.#!"
 tv_academy_debate.2156.t: "Free Port Proposal"
 tv_academy_debate.2157.a: "We set our sails by the charts, not by habit."
 tv_academy_debate.2157.b: "The captains hold to the routes their fathers sailed."
 tv_academy_debate.2157.d: "Navigators unroll wind charts across the Academy table, and the old routes suddenly look less like tradition than superstition under sail. Even the captains who scoff cannot stop stealing glances at the lines.\n\n#Y This event appeared because the current debate issue is Global Trade.#!"
 tv_academy_debate.2157.t: "Map of Trade Winds"
 tv_academy_debate.2158.a: "The clerks and looms are brought under one roof."
 tv_academy_debate.2158.b: "We leave each craftsman his own doorway."
 tv_academy_debate.2158.d: "A merchant lays out the case for gathering spinners, finishers, clerks, and overseers beneath a single roof. The bell above the yard sounds less like a tool than a new argument about how work should be ordered, and who holds the ordering.\n\n#Y This event appeared because the current debate issue is Factory Production.#!"
 tv_academy_debate.2158.t: "Workshop Under One Roof"
 tv_academy_debate.2159.a: "Inspectors are posted at the manufactory gates."
 tv_academy_debate.2159.b: "Only the maker knows the true weave."
 tv_academy_debate.2159.d: "Guild masters arrive bearing warped cloth, brittle tools, and finishing so hurried it reads like an accusation. Scale, they warn, multiplies errors as briskly as it multiplies goods.\n\n#Y This event appeared because the current debate issue is Factory Production.#!"
 tv_academy_debate.2159.t: "Guild Master's Complaint"
 tv_academy_debate.2160.a: "We set the river to work at the wheels."
 tv_academy_debate.2160.b: "The engineers are sent home with their drawings rolled up."
 tv_academy_debate.2160.d: "Engineers sketch a water-driven process that would pull, pound, and turn with an appetite no pair of hands can satisfy. The river stops looking like scenery and begins to look like a laborer waiting to be hired.\n\n#Y This event appeared because the current debate issue is Factory Production.#!"
 tv_academy_debate.2160.t: "Waterwheel Proposal"
 tv_academy_debate.2161.a: "Enough hand-wringing; they have earned their pay."
 tv_academy_debate.2161.b: "The registers are closed to the new hands."
 tv_academy_debate.2161.d: "A manufactory hires women in numbers too large to be waved off as household help. What began as a matter of wages becomes an argument about custom, discipline, and who may stand plainly inside the new economy.\n\n#Y This event appeared because the current debate issue is Factory Production.#!"
 tv_academy_debate.2161.t: "Women at the Looms"
 tv_academy_debate.2162.a: "The clerks draw up standing contracts for every input."
 tv_academy_debate.2162.b: "We let the harvest set the pace, as it always has."
 tv_academy_debate.2162.d: "Production stalls because wool, timber, dye, and ore still arrive by village habit rather than manufactory appetite. The benches wait idle while the countryside insists that supply has its seasons, its neighbors, and its old obligations.\n\n#Y This event appeared because the current debate issue is Factory Production.#!"
 tv_academy_debate.2162.t: "Raw Material Bottleneck"
 tv_academy_debate.2163.a: "The Crown writes firebreaks and inspections into the model."
 tv_academy_debate.2163.b: "Gather the sparks in one shed and you build a pyre."
 tv_academy_debate.2163.d: "A workshop fire leaves scorched beams, ruined stock, and a crowd of witnesses already deciding what the flames have proven. Some read danger in concentration itself; others read it in concentration left unwatched.\n\n#Y This event appeared because the current debate issue is Factory Production.#!"
 tv_academy_debate.2163.t: "Fire in the Yard"
 tv_academy_debate.2164.a: "The bells are hung, and the day is cut to their measure."
 tv_academy_debate.2164.b: "Peace, before the hours become jailers."
 tv_academy_debate.2164.d: "Managers hang bells and clocks where masters once trusted to habit. The workers soon learn that time can be made a supervisor, one with no patience and no need to sleep.\n\n#Y This event appeared because the current debate issue is Factory Production.#!"
 tv_academy_debate.2164.t: "Clock Discipline"
 tv_academy_debate.2165.a: "Every workshop is bound to a single specification."
 tv_academy_debate.2165.b: "We would rather keep each supplier's own hand."
 tv_academy_debate.2165.d: "The army offers a contract large enough to make every workshop owner count his benches twice. The condition is plain: the Crown wants parts and cloth that match, not the charming variations of each town.\n\n#Y This event appeared because the current debate issue is Factory Production.#!"
 tv_academy_debate.2165.t: "Military Contract"
 tv_academy_debate.2166.a: "One rule for the crest is one rule for the bench."
 tv_academy_debate.2166.b: "The crest is granted its exemption; the burgher is refused."
 tv_academy_debate.2166.d: "A noble estate opens a great workshop with admirable confidence, then objects the moment burghers ask for the same liberty. The Academy is invited to discover whether scale becomes respectable only when it wears a crest.\n\n#Y This event appeared because the current debate issue is Factory Production.#!"
 tv_academy_debate.2166.t: "Noble Estate Workshop"
 tv_academy_debate.2167.a: "The Academy sets an age to the bench and lets the work go on."
 tv_academy_debate.2167.b: "No, not with these hands."
 tv_academy_debate.2167.d: "Parish leaders arrive with names, ages, and smaller hands than the debate had cared to imagine. The question is no longer whether manufactories make more, but what kind of labor they may be allowed to consume.\n\n#Y This event appeared because the current debate issue is Factory Production.#!"
 tv_academy_debate.2167.t: "Child Labor Petition"
 tv_academy_debate.2168.a: "The Academy blesses parts that answer to a gauge, not a name."
 tv_academy_debate.2168.b: "We keep the mark of the maker's own hand."
 tv_academy_debate.2168.d: "Artisans lay out a neat row of parts that change places without complaint. Half the chamber sees faster repair and steadier supply; the other half hears the quiet funeral bell of individual craft.\n\n#Y This event appeared because the current debate issue is Factory Production.#!"
 tv_academy_debate.2168.t: "Standard Parts"
 tv_academy_debate.2169.a: "We rule the workshop by its own ledger."
 tv_academy_debate.2169.b: "The owners keep their columns to themselves."
 tv_academy_debate.2169.d: "Accountants lay waste, delay, spoilage, and idle hours in columns so tidy they feel like an accusation. What once hid inside dust and habit becomes a public question of management, discipline, and blame.\n\n#Y This event appeared because the current debate issue is Factory Production.#!"
 tv_academy_debate.2169.t: "Factory Accounts"
 tv_academy_debate.2170.a: "The Crown spends to cushion the villages as the benches fill."
 tv_academy_debate.2170.b: "Slowly, before the fields empty."
 tv_academy_debate.2170.d: "Peasant spokesmen complain that manufactory demand draws hands from the fields and daughters from household arrangements. The Academy hears not merely a grievance against production, but the creaking of an entire rural order.\n\n#Y This event appeared because the current debate issue is Factory Production.#!"
 tv_academy_debate.2170.t: "Rural Displacement"
 tv_academy_debate.2171.a: "The Academy takes the machine apart to build its own."
 tv_academy_debate.2171.b: "Foreign iron carries a foreign hand."
 tv_academy_debate.2171.d: "A foreign machine is carried into the Academy with unfamiliar bolts and very familiar ambition. Its admirers see a design that can be copied; its enemies see another realm reaching a metal hand into local workshops.\n\n#Y This event appeared because the current debate issue is Factory Production.#!"
 tv_academy_debate.2171.t: "Imported Machine"
 tv_academy_debate.2172.a: "The Crown pays for cleaner flues and lets the fires burn."
 tv_academy_debate.2172.b: "We push the furnaces past the city wall."
 tv_academy_debate.2172.d: "Townsfolk remind the Academy that productive smoke is smoke all the same. Window ledges, lungs, and laundry lines are entered as witnesses against any theory that treats output as proof enough.\n\n#Y This event appeared because the current debate issue is Factory Production.#!"
 tv_academy_debate.2172.t: "Coal Smoke Argument"
 tv_academy_debate.2173.a: "The clerks price each finished piece and post the rate."
 tv_academy_debate.2173.b: "Enough; a wage is not a tally."
 tv_academy_debate.2173.d: "Owners propose paying by the piece, so every finished length of cloth, polished tool, or packed crate becomes at once a wage and an accusation. The workers hear arithmetic trying to become a foreman.\n\n#Y This event appeared because the current debate issue is Factory Production.#!"
 tv_academy_debate.2173.t: "Piecework Pay"
 tv_academy_debate.2174.a: "The manufactory opens a school at its own gate."
 tv_academy_debate.2174.b: "We send the boys back to the guild masters."
 tv_academy_debate.2174.d: "Reformers propose training workers inside the manufactory, where the lesson opens at the bench and closes in a counted batch. Guild masters notice at once that apprenticeship is being asked to lend out its own vocabulary.\n\n#Y This event appeared because the current debate issue is Factory Production.#!"
 tv_academy_debate.2174.t: "Workshop School"
 tv_academy_debate.2175.a: "The Academy spends its name to mend the inspection."
 tv_academy_debate.2175.b: "We say the fault lies in the very size of it."
 tv_academy_debate.2175.d: "A large batch fails inspection in full view: seams split, fittings crack, and the enemies of scale look almost grateful for the evidence. The question is whether the failure condemns the system, or only the inspectors.\n\n#Y This event appeared because the current debate issue is Factory Production.#!"
 tv_academy_debate.2175.t: "Quality Scandal"
 tv_academy_debate.2176.a: "The Crown lets the merchants bind their purses into one."
 tv_academy_debate.2176.b: "We will not let a committee own a trade."
 tv_academy_debate.2176.d: "Merchants propose pooling capital vast enough to raise a manufactory no single family could command. The money arrives not as a purse but as a committee, with ledgers and patience.\n\n#Y This event appeared because the current debate issue is Factory Production.#!"
 tv_academy_debate.2176.t: "Merchant Capital Pool"
 tv_academy_debate.2177.a: "So be it, let the whistle keep the hour."
 tv_academy_debate.2177.b: "The magistrate orders the whistle stopped."
 tv_academy_debate.2177.d: "A new factory whistle splits the day with admirable efficiency and unbearable certainty. It tells workers when to begin, neighbors when to complain, and reformers that discipline can now be heard three streets away.\n\n#Y This event appeared because the current debate issue is Factory Production.#!"
 tv_academy_debate.2177.t: "The First Whistle"
 tv_academy_debate.2178.a: "The scribes copy the table into the record, line by patient line."
 tv_academy_debate.2178.b: "One swallow does not make a summer."
 tv_academy_debate.2178.d: "Column after column of repeated observations is set before the Academy, each entry too plain to dazzle and too consistent to wave away. The ancient authorities still command the room; the figures, however, have quietly stopped bowing to them.\n\n#Y This event appeared because the current debate issue is Scientific Revolution.#!"
 tv_academy_debate.2178.t: "A Table of Observations"
 tv_academy_debate.2179.a: "The clerks print the empty result beside the famous one."
 tv_academy_debate.2179.b: "We let the famous result keep its reputation a while longer."
 tv_academy_debate.2179.d: "A celebrated result is repeated before careful witnesses and simply declines to appear. The silence after the empty trial is mortifying, and it is also the first wholly honest sound the chamber has heard all week.\n\n#Y This event appeared because the current debate issue is Scientific Revolution.#!"
 tv_academy_debate.2179.t: "The Failed Replication"
 tv_academy_debate.2180.a: "We follow the symbols wherever the necessity leads."
 tv_academy_debate.2180.b: "Chalk is not wisdom."
 tv_academy_debate.2180.d: "A mathematician renders the disputed natural question into symbols so spare that several officials look personally accused by their clarity. What had passed for philosophy now lies on the page as a chain of necessity, link by unforgiving link.\n\n#Y This event appeared because the current debate issue is Scientific Revolution.#!"
 tv_academy_debate.2180.t: "A Proof in Symbols"
 tv_academy_debate.2181.a: "The treasurer counts out coin for lenses, screws, and brass."
 tv_academy_debate.2181.b: "Trinkets, the lot of it."
 tv_academy_debate.2181.d: "An instrument maker arrives with lenses, screws, brass fittings, and the serene certainty of a man who has decided that scholars simply need better hands. Better tools, he insists, do not yield better toys; they yield better truth.\n\n#Y This event appeared because the current debate issue is Scientific Revolution.#!"
 tv_academy_debate.2181.t: "The Instrument Maker's Claim"
 tv_academy_debate.2182.a: "The clerks rule the columns and pass the pen for signatures."
 tv_academy_debate.2182.b: "We would sooner trust a gentleman's word than a clerk's column."
 tv_academy_debate.2182.d: "Reformers propose a code for witnessing, recording, and repeating experiments: columns, signatures, and enough procedure to make every informal genius sigh into his sleeve. Trust, they argue, ought to leave a paper trail.\n\n#Y This event appeared because the current debate issue is Scientific Revolution.#!"
 tv_academy_debate.2182.t: "The Academy Experiment Code"
 tv_academy_debate.2183.a: "We will not ask the heavens for permission to look."
 tv_academy_debate.2183.b: "The scholars trim the model until it no longer troubles the pulpit."
 tv_academy_debate.2183.d: "The clergy warn that the new model rearranges rather more than the heavens. If the sky can be argued from observation, then sermons, courts, and crowns may each be asked, in time, to explain what else they have inherited without proof.\n\n#Y This event appeared because the current debate issue is Scientific Revolution.#!"
 tv_academy_debate.2183.t: "The Clerical Cosmology Objection"
 tv_academy_debate.2184.a: "Criers carry the calculation and its keeping through the streets."
 tv_academy_debate.2184.b: "A lucky guess, nothing more."
 tv_academy_debate.2184.d: "A calculation names the very hour of a natural event, and the event arrives with uncomfortable punctuality. For one long moment, even the skeptics must decide whether coincidence has lately taken up mathematics.\n\n#Y This event appeared because the current debate issue is Scientific Revolution.#!"
 tv_academy_debate.2184.t: "A Prediction Comes True"
 tv_academy_debate.2185.a: "The workmen fit new guards to the bench and light the next trial."
 tv_academy_debate.2185.b: "We put out the fires and lock the laboratory doors."
 tv_academy_debate.2185.d: "A demonstration bursts apart with force enough to settle, at least, the question of whether experiment has energy. Smoke drifts along the rafters while both sides hurry to claim the wreckage as evidence.\n\n#Y This event appeared because the current debate issue is Scientific Revolution.#!"
 tv_academy_debate.2185.t: "The Laboratory Accident"
 tv_academy_debate.2186.a: "The register admits the artisan's result alongside the learned ones."
 tv_academy_debate.2186.b: "Rough hands, rougher proof."
 tv_academy_debate.2186.d: "An artisan settles in an afternoon a practical problem that scholars have spent weeks dressing in Latin. When his tool chest lands on the table, several elegant commentaries suddenly look very heavy indeed.\n\n#Y This event appeared because the current debate issue is Scientific Revolution.#!"
 tv_academy_debate.2186.t: "The Artisan's Knowledge"
 tv_academy_debate.2187.a: "We arrange the drawers by what our eyes report, not what the books decreed."
 tv_academy_debate.2187.b: "The curators leave every specimen under the label it inherited."
 tv_academy_debate.2187.d: "Collectors propose a cabinet where shells, bones, seeds, and stones are arranged by observed likeness rather than inherited category. The old labels still slide neatly into the drawers, which is precisely the trouble.\n\n#Y This event appeared because the current debate issue is Scientific Revolution.#!"
 tv_academy_debate.2187.t: "The Natural History Cabinet"
 tv_academy_debate.2188.a: "The couriers ride out with the letters unsealed to every academy."
 tv_academy_debate.2188.b: "Not a page leaves these walls."
 tv_academy_debate.2188.d: "Scientists ask to publish letters and results across borders before their rivals can. What began as private ink now resembles a race to decide whether truth belongs to guarded rooms or to everyone quick enough to answer the post.\n\n#Y This event appeared because the current debate issue is Scientific Revolution.#!"
 tv_academy_debate.2188.t: "Open Correspondence"
 tv_academy_debate.2189.a: "The printer sets the footnote in type, exactly as it was written."
 tv_academy_debate.2189.b: "We strike the footnote and let the master rest undisturbed."
 tv_academy_debate.2189.d: "A revered authority is contradicted in a footnote so courteous it feels cruel. The page says almost nothing loudly, and yet every defender of inherited wisdom somehow hears it from across the hall.\n\n#Y This event appeared because the current debate issue is Scientific Revolution.#!"
 tv_academy_debate.2189.t: "The Old Master Contradicted"
 tv_academy_debate.2190.a: "We stake our name on the result, in front of everyone."
 tv_academy_debate.2190.b: "The doors stay shut, and the trials keep to the back room."
 tv_academy_debate.2190.d: "The Chief Scientist wants a public experiment where failure would be impossible to hide. The proposal thrills the galleries and terrifies everyone who would prefer uncertainty to keep behind closed doors.\n\n#Y This event appeared because the current debate issue is Scientific Revolution.#!"
 tv_academy_debate.2190.t: "The Public Demonstration"
 tv_academy_debate.2191.a: "The Academy casts one rule, one weight, one measure for all provinces."
 tv_academy_debate.2191.b: "Let each province keep its own yardstick."
 tv_academy_debate.2191.d: "Researchers complain that every province measures nature with a different tool and an equal quantity of pride. The Academy at last understands how short a distance a fact can travel when every ruler, weight, and vessel insists on speaking its own dialect.\n\n#Y This event appeared because the current debate issue is Scientific Revolution.#!"
 tv_academy_debate.2191.t: "The Measurement Standard"
 tv_academy_debate.2192.a: "The registrar files every failure where the successes are kept."
 tv_academy_debate.2192.b: "We keep our failures to ourselves, as reputations require."
 tv_academy_debate.2192.d: "Scholars propose studying errors as data, a suggestion that quietly threatens a great many careers. All at once, every botched calculation, cracked lens, and spoiled sample looks less like shame and more like evidence that arrived at an inconvenient hour.\n\n#Y This event appeared because the current debate issue is Scientific Revolution.#!"
 tv_academy_debate.2192.t: "The Dissection of Error"
 tv_academy_debate.2193.a: "The masons raise the tower, and the watchers take their salaried nights."
 tv_academy_debate.2193.b: "A borrowed roof serves for a clear night."
 tv_academy_debate.2193.d: "Astronomers ask for a permanent observatory, since the sky stubbornly refuses to attend meetings held indoors. A tower, a set of instruments, and salaried watchers would turn scattered nights of argument into a standing discipline.\n\n#Y This event appeared because the current debate issue is Scientific Revolution.#!"
 tv_academy_debate.2193.t: "The Royal Observatory"
 tv_academy_debate.2194.a: "The chamber admits the turning model into the record as proof."
 tv_academy_debate.2194.b: "We admire the toy, then set it back among the diagrams."
 tv_academy_debate.2194.d: "A mechanic sets a model on the table and turns the crank. Gears translate an invisible natural process into plain motion, and the whole room leans forward before anyone remembers to look dignified.\n\n#Y This event appeared because the current debate issue is Scientific Revolution.#!"
 tv_academy_debate.2194.t: "The Mechanic's Model"
 tv_academy_debate.2195.a: "To the press, and let it fall where it will."
 tv_academy_debate.2195.b: "The manuscript returns to the drawer until the patrons cool."
 tv_academy_debate.2195.d: "A treatise lies ready for the printer, sharp enough to overturn a doctrine and costly enough to offend nearly everyone who funds the Academy. The pages are dry; only the courage is still wet.\n\n#Y This event appeared because the current debate issue is Scientific Revolution.#!"
 tv_academy_debate.2195.t: "A Dangerous Publication"
 tv_academy_debate.2196.a: "We swear to shield whoever reports what the instruments say."
 tv_academy_debate.2196.b: "The masters remind the assistants to know their place."
 tv_academy_debate.2196.d: "The assistants ask for protection should their results contradict a patron, a teacher, or the Crown's favorite theory. They are willing to measure honestly; they are not willing to be ruined for reporting what the instruments plainly say.\n\n#Y This event appeared because the current debate issue is Scientific Revolution.#!"
 tv_academy_debate.2196.t: "The Experimental Oath"
 tv_academy_debate.2197.a: "The word is spoken into the record, and the movement takes its name."
 tv_academy_debate.2197.b: "Best leave it nameless a while yet."
 tv_academy_debate.2197.d: "Someone gives the method a name, and all at once a loose cluster of habits becomes a movement. Friends repeat the word with relief, opponents with alarm, and the undecided with the uneasy sense that history may be about to need a label.\n\n#Y This event appeared because the current debate issue is Scientific Revolution.#!"
 tv_academy_debate.2197.t: "The New Method Named"
