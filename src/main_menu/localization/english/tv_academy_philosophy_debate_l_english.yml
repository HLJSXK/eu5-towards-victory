 STATIC_MODIFIER_DESC_tv_academy_debate_artisan_demonstrations: "Admitting artisan evidence widens truth-making beyond classical learning and shows the room that tested practice can correct a learned theory, the sort of correction that keeps recurring once it is allowed even once."
 STATIC_MODIFIER_DESC_tv_academy_debate_avoided_foreign_claim_crisis: "Avoiding provocation lets caution define policy. Stability holds, since the court refuses a distant quarrel, but the debate retreats hard from treating discovery as something worth contesting."
 STATIC_MODIFIER_DESC_tv_academy_debate_battered_chart: "Trusting the chart lets practical seafaring evidence challenge inherited geography head-on. The debate swings hard toward acceptance, because the maritime merchants can now point to a route a man might actually sail rather than a rumor swapped over ale."
 STATIC_MODIFIER_DESC_tv_academy_debate_bespoke_supply_networks: "Keeping bespoke supply shelters older contractors and local methods but makes the case for manufactories less urgent, leaving production a network of favors and adaptations instead of a system of repeatable standards."
 STATIC_MODIFIER_DESC_tv_academy_debate_bills_of_exchange: "Endorsing bills of exchange makes banking reform useful to trade rather than merely tidy in the ledger, giving maritime merchants a practical reason to back the new system."
 STATIC_MODIFIER_DESC_tv_academy_debate_broadsides_watch: "Hunting the authors calms the officials and eases the pressure in the streets, but it casts anonymous print as a threat rather than a sign of a widening debate."
 STATIC_MODIFIER_DESC_tv_academy_debate_cabinet_of_curiosities: "Treating the account as a curiosity guards the old geography by shelving unfamiliar testimony in a cabinet instead of the argument. The debate retreats sharply as living knowledge is turned into ornament."
 STATIC_MODIFIER_DESC_tv_academy_debate_capital_certification: "Requiring capital certification keeps provincial training subordinate to the center. Central bureaucrats approve, for competence still passes through the familiar offices, seals, and court standards."
 STATIC_MODIFIER_DESC_tv_academy_debate_catechism_lessons: "Printing the catechism turns confessional doctrine into instruction that can be repeated in every classroom and pulpit, pushing acceptance forward while provoking the clergy who dislike the chosen wording."
 STATIC_MODIFIER_DESC_tv_academy_debate_central_print_office: "Centralizing the presses satisfies the officials who prefer every press to answer upward, but it denies the universities a plain demonstration of scholarly self-direction."
 STATIC_MODIFIER_DESC_tv_academy_debate_ceremonial_patronage: "Keeping patronage a matter of ceremony spares the treasury and keeps art subordinate to court display, but it leaves renewal hostage to private accident rather than public commitment."
 STATIC_MODIFIER_DESC_tv_academy_debate_child_labor_rules: "Labor rules keep the manufactory argument alive while conceding that production cannot be divorced from moral supervision; clergy and peasants partly approve because the reform now carries limits rather than pure expansion."
 STATIC_MODIFIER_DESC_tv_academy_debate_civil_posts_separate: "Keeping civil posts separate preserves the bureaucratic claim that offices belong to paperwork, schooling, and court procedure. It slows the meritocratic case by declaring one proven form of service beside the point."
 STATIC_MODIFIER_DESC_tv_academy_debate_civil_press_boundary: "Keeping the presses civil reassures the conservative officers that barracks discipline will not be rewritten by printed sheets, but it denies the press a genuinely useful technical role."
 STATIC_MODIFIER_DESC_tv_academy_debate_clergy_marriage_jurisdiction: "Keeping marriage in the existing clergy courts protects an old jurisdiction and wins clerical approval, but it denies the confessional state a powerful institution reaching right into the household."
 STATIC_MODIFIER_DESC_tv_academy_debate_clerical_discipline: "Backing discipline makes the confession more than a clerical possession - a rule that can bind even churchmen - advancing acceptance sharply while angering the clergy attached to corporate privilege."
 STATIC_MODIFIER_DESC_tv_academy_debate_clock_discipline: "Accepting clock discipline makes the manufactory a new social order of measured labor rather than a larger room of tools, so progress climbs sharply; the gain is balanced by peasant and worker resentment at being ruled by the bell."
 STATIC_MODIFIER_DESC_tv_academy_debate_closed_royal_accounts: "Closed accounts protect the court's management and spare the bureaucrats from defending every figure in public; they also make banking reform look like a discipline pressed on subjects while the Crown quietly exempts itself."
 STATIC_MODIFIER_DESC_tv_academy_debate_commission_review: "Recognizing battlefield merit gives the reform a martial constituency and shows that competence can be proven under pressure, not merely on paper. The professional soldiery gains a reason to stand behind the debate."
 STATIC_MODIFIER_DESC_tv_academy_debate_common_army_oath: "A common oath turns confession into a shared military discipline, giving the new settlement a practical force it never had in pulpits and court language alone."
 STATIC_MODIFIER_DESC_tv_academy_debate_consensus_delay: "Delaying for consensus keeps the peace among rival clerical readers, but every extra revision chips away at the claim that the settlement is ready to be accepted."
 STATIC_MODIFIER_DESC_tv_academy_debate_corrected_charts: "Accepting the correction makes the New World debate an institutional act of revision, not merely a traveler's claim. Scholarly authority shifts toward evidence able to redraw inherited knowledge."
 STATIC_MODIFIER_DESC_tv_academy_debate_court_masque: "Funding the masque dresses Renaissance renewal as a public court ritual, helping acceptance modestly by binding the issue to spectacle and prestige, all at a genuine cost to the treasury."
 STATIC_MODIFIER_DESC_tv_academy_debate_court_order_preserved: "Praising the prodigy from a distance lets the court applaud ability without letting it unsettle a single appointment. Order holds, but the debate notes that talent can still be kept politely on the far side of the door."
 STATIC_MODIFIER_DESC_tv_academy_debate_court_style_uniformity: "Requiring the court style keeps the standard uniform and comfortable for central officials, but it lets cultivated language sift the candidates before ability is ever allowed to speak plainly."
 STATIC_MODIFIER_DESC_tv_academy_debate_crown_discovery_lock: "Keeping discovery under Crown lock preserves legitimacy and central control, but it leaves every voyage waiting on cautious official timing. The debate loses momentum as eager backers are held at arm's length."
 STATIC_MODIFIER_DESC_tv_academy_debate_customs_house_routine: "Rejecting the experiment keeps the customs houses predictable and protects the officials who know every gate by name. But it frames world trade as a danger to be penned in, rather than a flow to be governed."
 STATIC_MODIFIER_DESC_tv_academy_debate_established_routes: "Holding to the old routes honors the captains who trust the seamanship they inherited. But it leaves the debate treating wind-knowledge as a curiosity, never as a system fit to carry world exchange."
 STATIC_MODIFIER_DESC_tv_academy_debate_experiment_code: "Adopting the code turns experimental credibility into a shared institution rather than a point of personal honor. The paperwork weighs on everyone, but acceptance grows easier once witnesses can lay one trial's record beside another's."
 STATIC_MODIFIER_DESC_tv_academy_debate_familiar_accounts: "Keeping the older accounts spares the clerks and offices that know the old forms, but it lets ambiguity stay respectable and slows the room's acceptance of banking discipline."
 STATIC_MODIFIER_DESC_tv_academy_debate_funded_trade_escorts: "Funding the escorts makes world trade a strategic project the Crown stands behind, not a private gamble. Acceptance rises sharply as distant commerce is visibly protected, though the treasury groans and the sea-merchants sink deeper into the debate."
 STATIC_MODIFIER_DESC_tv_academy_debate_globe_lessons: "Public teaching spreads the New World argument through steady instruction rather than spectacle or crisis. The gain is modest, but public opinion drifts toward acceptance as students learn the new geography as ordinary knowledge."
 STATIC_MODIFIER_DESC_tv_academy_debate_gold_rumor_speculation: "Using gold rumors as funding accepts a morally dubious motive while keeping discovery in motion. The debate gains modest ground as private appetite is turned into voyages, though the side effects mark the speculative risk in that bargain."
 STATIC_MODIFIER_DESC_tv_academy_debate_guild_apprenticeship_preserved: "Keeping guild apprenticeship preserves the old ladder of skill, patronage, and urban standing, so the debate turns decisively against manufactories because training stays tied to the institutions most threatened by factory discipline."
 STATIC_MODIFIER_DESC_tv_academy_debate_harbor_exhibition: "Public display turns distant discovery into evidence ordinary onlookers can touch. The gain is modest, since curiosity runs broad but shallow, yet public opinion begins to lean toward acceptance."
 STATIC_MODIFIER_DESC_tv_academy_debate_icon_local_truce: "Avoiding a ruling keeps the local peace around the image, but it leaves devotion undefined and weakens the case for a disciplined confession."
 STATIC_MODIFIER_DESC_tv_academy_debate_informal_army_credit: "Another informal loan gets coin into the soldiers' hands without admitting the old channels are broken; the price is renewed dependence on private creditors who profit from leaving reform unfinished."
 STATIC_MODIFIER_DESC_tv_academy_debate_laboratory_safety_rules: "Improving safety treats the accident as a failure of procedure rather than of experiment itself, so momentum survives, at a practical cost and with a little more caution built into every future demonstration."
 STATIC_MODIFIER_DESC_tv_academy_debate_liability_restraint: "Rejecting novel liability reassures conservative lawyers that responsibility should stay fixed to visible persons and old contracts, but it weakens the case for banking as organized trust."
 STATIC_MODIFIER_DESC_tv_academy_debate_licensed_wit: "Letting the satire circulate hands reformers a popular language against stale authority, but the gain stays modest, for ridicule persuades some and hardens others."
 STATIC_MODIFIER_DESC_tv_academy_debate_limited_exam_scandal: "Voiding only the worst papers contains the scandal and spares the sitting examiners, protecting administrative calm while quietly implying that fraud is tolerable, provided it is hidden well enough."
 STATIC_MODIFIER_DESC_tv_academy_debate_local_contract_forms: "Letting each market keep its own tongue preserves a familiar authority in every port. But it leaves long-distance exchange at the mercy of mistranslation, and keeps the whole question stubbornly provincial."
 STATIC_MODIFIER_DESC_tv_academy_debate_local_language_access: "Permitting local answers separates competence from courtly polish, letting provincial talent be judged on administration rather than accent. Local communities gain confidence that the door is not reserved for the capital's manners."
 STATIC_MODIFIER_DESC_tv_academy_debate_local_measures_preserved: "Every town keeping its own measure protects customary market authority and lets each keep a familiar fraud under a familiar name. It badly weakens acceptance, for world trade cannot grow without a measure held in common."
 STATIC_MODIFIER_DESC_tv_academy_debate_local_order_preserved: "Returning the petition guards administrative order, but it leaves the local hierarchy to decide whether lowborn talent may so much as be heard."
 STATIC_MODIFIER_DESC_tv_academy_debate_local_pulpits: "Preserving local custom reassures the parishes that no familiar voice will be silenced, but it leaves doctrine too uneven to carry acceptance with any force."
 STATIC_MODIFIER_DESC_tv_academy_debate_manufactory_fire_codes: "Regulation admits that large workshops carry new risks yet treats them as a reason to govern manufactories rather than abandon them; the gold pays for inspections, firebreaks, and safer storage."
 STATIC_MODIFIER_DESC_tv_academy_debate_maritime_insurance_pool: "Entering maritime insurance into the record turns world trade from a reckless wager into a disciplined pooling of risk, and makes acceptance easier for anyone who has ever feared sudden ruin."
 STATIC_MODIFIER_DESC_tv_academy_debate_measured_ruins: "Printing the figures lets the material evidence of antiquity discipline present practice, strengthening acceptance through craft, proportion, and the cooperation of artists and scholars."
 STATIC_MODIFIER_DESC_tv_academy_debate_measurement_standard: "A standard measure makes observations comparable across provinces, giving the Scientific Revolution a practical infrastructure for shared evidence. The strong progress comes from turning scattered experiments into a common language, paid for in coin."
 STATIC_MODIFIER_DESC_tv_academy_debate_merchant_capital_pool: "Legalizing pooled capital gives manufactories a financial body large enough to match their physical ambition, so acceptance advances sharply as scale becomes investable and banking-minded burghers see a path from ledger to workshop."
 STATIC_MODIFIER_DESC_tv_academy_debate_mission_priority: "Mission priority narrows discovery into a clerical errand before the Academy can treat new lands as an empirical problem. The clergy approve, but acceptance slows as survey, trade, and testimony are all made to kneel behind conversion."
 STATIC_MODIFIER_DESC_tv_academy_debate_named_method: "Embracing the name turns scattered practices into a recognizable program, making acceptance easier to organize and to defend. The same clarity, however, also helps the opponents gather themselves against it."
 STATIC_MODIFIER_DESC_tv_academy_debate_observation_tables: "Trusting the patient table gives the debate a reproducible footing: the issue no longer leans on one dazzling claim but on evidence any cautious scholar may check for himself, and the record of it earns quiet credit over time."
 STATIC_MODIFIER_DESC_tv_academy_debate_observational_collections: "Building the cabinet turns observation into a durable institutional habit, though it advances acceptance more gently than a proof, a prediction, or a public experiment would."
 STATIC_MODIFIER_DESC_tv_academy_debate_old_customs_controls: "Into the fire it goes, preserving the old customs order and denying the smugglers any victory of ideas. It also burns the evidence that the lawful routes have grown less sensible than the outlaw ones."
 STATIC_MODIFIER_DESC_tv_academy_debate_open_chair_competition: "Opening the chairs turns meritocracy on the Academy itself, proving it will test its own posts before it lectures the realm. Scholars gain support as their careers cease to hang on a patron's goodwill alone."
 STATIC_MODIFIER_DESC_tv_academy_debate_orderly_bankruptcy: "Legal bankruptcy treats failure as a managed financial event rather than a moral collapse, which strengthens the banking case for predictable rules; conservative moral authorities object, since disgrace loses some of its disciplinary bite."
 STATIC_MODIFIER_DESC_tv_academy_debate_orderly_proceedings: "Expelling the poets preserves the seriousness of procedure but drains the debate of its public energy; the bureaucratic guardians of orderly deliberation grow stronger as the issue retreats into controlled rooms."
 STATIC_MODIFIER_DESC_tv_academy_debate_patron_rights_confirmed: "Confirming patron rights reassures those who fund and shield the Academy's posts, but it leaves scholarship tethered to inherited favor rather than open comparison."
 STATIC_MODIFIER_DESC_tv_academy_debate_patronage_buried: "Burying the investigation shields the patrons from scandal and lets the noble households keep the examination as one more channel of influence. The debate retreats, for merit is permitted to wear borrowed handwriting."
 STATIC_MODIFIER_DESC_tv_academy_debate_plain_contract_forms: "Plain contracts make banking reform visible to people who usually meet finance only as fine print; public opinion warms, because reform now guards comprehension and not just the balance sheet."
 STATIC_MODIFIER_DESC_tv_academy_debate_pooled_risk_fund: "Recognizing pooled risk makes banking reform socially useful rather than merely profitable; burghers take satisfaction, since their financial institutions are treated as civic protection instead of clever speculation."
