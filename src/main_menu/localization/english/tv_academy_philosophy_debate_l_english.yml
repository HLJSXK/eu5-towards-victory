 tv_academy_debate.116.a: "The table takes note."
 tv_academy_debate.116.d: "Recent policy and public action have strengthened the argument for the current Academy issue. The local debate moves toward acceptance."
 tv_academy_debate.116.t: "Debate Momentum Rises"
 tv_academy_debate.117.a: "The table takes note."
 tv_academy_debate.117.d: "Recent policy and public action have weakened the argument for the current Academy issue. The local debate moves toward rejection."
 tv_academy_debate.117.t: "Debate Momentum Falters"
 tv_academy_debate.118.a: "Send our representatives."
 tv_academy_debate.118.d: "Countries with an Academy of Sciences have entered a world debate around the current philosophical issue. Our Academy will take part and record where the argument leads."
 tv_academy_debate.118.t: "A World Debate Opens"
 tv_academy_debate.119.a: "Record the conclusion."
 tv_academy_debate.119.d: "The world debate has reached an accepting conclusion on the current philosophical issue. Our Academy advances the philosophy sequence and lets the related institution take root across the country."
 tv_academy_debate.119.t: "The World Debate Accepts"
 tv_academy_debate.120.a: "Record the conclusion."
 tv_academy_debate.120.d: "The world debate has reached a rejecting conclusion on the current philosophical issue. Our Academy closes this issue and advances the philosophy sequence."
 tv_academy_debate.120.t: "The World Debate Rejects"
 tv_academy_debate.121.a: "Seal the archive."
 tv_academy_debate.121.d: "The world debate has ended without a clear conclusion. Our Academy files the current philosophical issue away and advances the philosophy sequence."
 tv_academy_debate.121.t: "The World Debate Ends Inconclusively"
 tv_academy_debate.122.a: "Record the shift."
 tv_academy_debate.122.d: "This month's political and social conditions have changed part of the roundtable. At least one debate seat now supports the current philosophical issue."
 tv_academy_debate.122.t: "A Debate Seat Turns Supportive"
 tv_academy_debate.123.a: "Record the shift."
 tv_academy_debate.123.d: "This month's political and social conditions have changed part of the roundtable. At least one debate seat now opposes the current philosophical issue."
 tv_academy_debate.123.t: "A Debate Seat Turns Opposed"
 tv_academy_debate.124.a: "Record the shift."
 tv_academy_debate.124.d: "This month's political and social conditions have changed part of the roundtable. At least one debate seat no longer clearly supports or opposes the current philosophical issue."
 tv_academy_debate.124.t: "A Debate Seat Turns Neutral"
 tv_academy_debate.125.a: "Record the vacancy."
 tv_academy_debate.125.d: "A special participant at the roundtable can no longer attend. This month's cleanup has vacated the corresponding debate seat."
 tv_academy_debate.125.t: "A Debate Seat Falls Vacant"
 tv_academy_debate.2000.a: "Publish the summary."
 tv_academy_debate.2000.b: "Redact the dangerous passages."
 tv_academy_debate.2000.d: "After three days of tangled claims, the chair reduces the argument to a brief that even the restless back benches can follow. The room changes as soon as everyone can see what is truly being disputed."
 tv_academy_debate.2000.t: "The Chair's Summary"
 tv_academy_debate.2001.a: "Keep the doors open."
 tv_academy_debate.2001.b: "Clear the galleries."
 tv_academy_debate.2001.d: "Students, clerks, idle nobles, and citizens with suspiciously excellent hearing pack the galleries. Every strong line now travels farther than the speaker intended."
 tv_academy_debate.2001.t: "Crowded Galleries"
 tv_academy_debate.2002.a: "Correct it publicly."
 tv_academy_debate.2002.b: "Let the ambiguity work."
 tv_academy_debate.2002.d: "A copied line from a respected authority appears to favor the new argument. The wording is convenient, the ink is fresh, and several scholars are suddenly very interested in handwriting."
 tv_academy_debate.2002.t: "A Useful Misquotation"
 tv_academy_debate.2003.a: "Treat the old note as evidence."
 tv_academy_debate.2003.b: "Challenge the authority of the note."
 tv_academy_debate.2003.d: "An old commentary emerges from the Academy library with a note in the margin sharp enough to cut both sides. By noon, everyone claims the dead commentator as an ally."
 tv_academy_debate.2003.t: "Margins of the Old Book"
 tv_academy_debate.2004.a: "Authorize the lecture."
 tv_academy_debate.2004.b: "Save their strength."
 tv_academy_debate.2004.d: "As the chamber empties, the Chief Scientist offers to gather a few decisive listeners before the candles burn low. Confusion can still be turned into conviction, if someone pays the evening's cost."
 tv_academy_debate.2004.t: "Private Lecture at Dusk"
 tv_academy_debate.2005.a: "Give them exact minutes"
 tv_academy_debate.2005.b: "Keep the argument informal"
 tv_academy_debate.2005.d: "Before the Academy's arguments can touch policy, ministry clerks demand minutes exact enough to file, quote, and delay."
 tv_academy_debate.2005.t: "Minutes for the Ministries"
 tv_academy_debate.2006.a: "Add the preface"
 tv_academy_debate.2006.b: "Refuse the preface"
 tv_academy_debate.2006.d: "Religious figures ask that the disputed proposition be wrapped in moral caution before anyone dares to call it wisdom."
 tv_academy_debate.2006.t: "A Moral Preface"
 tv_academy_debate.2007.a: "Accept the subscription"
 tv_academy_debate.2007.b: "Reject commercial noise"
 tv_academy_debate.2007.d: "Burghers offer to fund pamphlets, copied notes, and coffeehouse discussion, provided their names sit close enough to the title."
 tv_academy_debate.2007.t: "Merchant Subscription"
 tv_academy_debate.2008.a: "Let them argue"
 tv_academy_debate.2008.b: "Ban the gathering"
 tv_academy_debate.2008.d: "Students stage their own version of the debate and demonstrate that enthusiasm can be louder than preparation."
 tv_academy_debate.2008.t: "Student Disputation"
 tv_academy_debate.2009.a: "Read it aloud."
 tv_academy_debate.2009.b: "File it quietly."
 tv_academy_debate.2009.d: "A foreign scholar sends a careful letter, folded like evidence and read like gossip. Its argument is precise enough to help the Academy, and foreign enough to make every listener wonder who benefits from hearing it aloud."
 tv_academy_debate.2009.t: "Letter from Abroad"
 tv_academy_debate.2010.a: "Trust the demonstration."
 tv_academy_debate.2010.b: "Call it preliminary."
 tv_academy_debate.2010.d: "A working instrument is carried into the debate chamber and placed where theory can no longer pretend to be alone. Its gears, lenses, or measures do not settle every question, but they do make old abstractions sweat."
 tv_academy_debate.2010.t: "Instrument in the Hall"
 tv_academy_debate.2011.a: "Let the song spread."
 tv_academy_debate.2011.b: "Suppress the song."
 tv_academy_debate.2011.d: "The issue escapes the Academy as a street song, half misunderstanding and half recruitment. By sunset, people who could not name the proposition can hum its sharpest insult."
 tv_academy_debate.2011.t: "A Street Song"
 tv_academy_debate.2012.a: "Back the new argument."
 tv_academy_debate.2012.b: "Back the old reading."
 tv_academy_debate.2012.d: "A respected opponent challenges the new claim under rules strict enough to make evasion visible. The hall grows quieter, not because tempers have cooled, but because everyone can now count the blows."
 tv_academy_debate.2012.t: "Formal Challenge"
 tv_academy_debate.2013.a: "Force a decision"
 tv_academy_debate.2013.b: "Postpone"
 tv_academy_debate.2013.d: "Everyone knows another month of debate will produce longer speeches, not better reasons. The committee has begun perfecting its objections instead of testing them."
 tv_academy_debate.2013.t: "Committee Exhaustion"
 tv_academy_debate.2014.a: "Sponsor a new translation"
 tv_academy_debate.2014.b: "Keep the traditional wording"
 tv_academy_debate.2014.d: "Two translations of the same key term produce two different futures for the realm. Each side insists the other has mistranslated both the word and the age."
 tv_academy_debate.2014.t: "Translation Quarrel"
 tv_academy_debate.2015.a: "Exhibit the work"
 tv_academy_debate.2015.b: "Keep art out of doctrine"
 tv_academy_debate.2015.d: "An artist paints the issue as a scene so flattering to novelty that even its opponents stop to inspect the colors. The argument has learned to wear light."
 tv_academy_debate.2015.t: "Allegory on Canvas"
 tv_academy_debate.2016.a: "Investigate calmly"
 tv_academy_debate.2016.b: "Seize the papers"
 tv_academy_debate.2016.d: "A sealed accusation claims the debate is a plot, a vanity, or both. The handwriting is conveniently unfamiliar, and the room suddenly studies the door."
 tv_academy_debate.2016.t: "Anonymous Denunciation"
 tv_academy_debate.2017.a: "Keep them in session"
 tv_academy_debate.2017.b: "Adjourn with dignity"
 tv_academy_debate.2017.d: "By candlelight, tired opponents accidentally admit which points they can no longer deny. No one calls it agreement yet, but everyone hears the shape of it."
 tv_academy_debate.2017.t: "Consensus After Midnight"
 tv_academy_debate.2018.a: "Adopt anonymous scoring."
 tv_academy_debate.2018.b: "Keep names visible."
 tv_academy_debate.2018.d: "The examiners propose removing names from the papers before judgement. Birth complains that ink has become blind."
 tv_academy_debate.2018.t: "Anonymous Examination"
 tv_academy_debate.2019.a: "Question the trees."
 tv_academy_debate.2019.b: "Honor hereditary service."
 tv_academy_debate.2019.d: "Great houses bring polished family trees to prove that service is inherited like silver."
 tv_academy_debate.2019.t: "Genealogies on the Table"
 tv_academy_debate.2020.a: "Invite them to court."
 tv_academy_debate.2020.b: "Praise them from afar."
 tv_academy_debate.2020.d: "A candidate from a distant province solves a problem that court favorites have avoided for weeks."
 tv_academy_debate.2020.t: "The Provincial Prodigy"
 tv_academy_debate.2021.a: "Expose the sale."
 tv_academy_debate.2021.b: "Accept the arrangement."
 tv_academy_debate.2021.d: "A lucrative office is quietly offered to a donor's son during the debate."
 tv_academy_debate.2021.t: "Purchased Office"
 tv_academy_debate.2022.a: "Recognize battlefield merit."
 tv_academy_debate.2022.b: "Preserve noble command privilege."
 tv_academy_debate.2022.d: "Officers argue that command earned under fire should count more than old names."
 tv_academy_debate.2022.t: "Merit on the Battlefield"
 tv_academy_debate.2023.a: "Demand open assessment."
 tv_academy_debate.2023.b: "Grant the favor."
 tv_academy_debate.2023.d: "The royal tutor requests a cabinet post for a brilliant nephew, though every witness seems more certain of the family tie than of the brilliance."
 tv_academy_debate.2023.t: "The Tutor's Nephew"
 tv_academy_debate.2024.a: "Require ability first."
 tv_academy_debate.2024.b: "Accept moral certification."
 tv_academy_debate.2024.d: "Clergy propose that no one should hold public office without moral certification, making virtue the gate through which ability must ask permission."
 tv_academy_debate.2024.t: "Clerical Certificates"
 tv_academy_debate.2025.a: "Add practical tests."
 tv_academy_debate.2025.b: "Keep classical credentials."
 tv_academy_debate.2025.d: "City guilds offer practical trials for accountants, engineers, and clerks, insisting that a hand steady over real work can prove what polished quotations cannot."
 tv_academy_debate.2025.t: "Guild Tests"
 tv_academy_debate.2026.a: "Admit the petition."
 tv_academy_debate.2026.b: "Return it to local authorities."
 tv_academy_debate.2026.d: "A village schoolmaster asks whether talent born beneath a thatched roof is still talent, and the question enters the chamber with mud on its shoes."
 tv_academy_debate.2026.t: "A Peasant's Petition"
 tv_academy_debate.2027.a: "Let them boycott."
 tv_academy_debate.2027.b: "Suspend the ranking."
 tv_academy_debate.2027.d: "Several noble families threaten to withdraw their sons from the Academy if open rankings proceed, mistaking absence for an argument."
 tv_academy_debate.2027.t: "Boycott by Old Families"
 tv_academy_debate.2028.a: "Purge the examiners."
 tv_academy_debate.2028.b: "Quietly invalidate only the worst papers."
 tv_academy_debate.2028.d: "A leaked answer key reveals that merit can be imitated by money with excellent penmanship."
 tv_academy_debate.2028.t: "Examination Fraud"
 tv_academy_debate.2029.a: "Post the rankings."
 tv_academy_debate.2029.b: "Keep rankings private."
 tv_academy_debate.2029.d: "Reformers want the results posted where every family can see what influence did not buy."
 tv_academy_debate.2029.t: "Public Ranking List"
 tv_academy_debate.2030.a: "Permit local answers."
 tv_academy_debate.2030.b: "Require court style."
 tv_academy_debate.2030.d: "Provincial candidates ask to answer in local administrative language rather than courtly style."
 tv_academy_debate.2030.t: "Local Language Answers"
 tv_academy_debate.2031.a: "Use the failure as proof."
 tv_academy_debate.2031.b: "Shield the office."
 tv_academy_debate.2031.d: "A hereditary official fails publicly at the exact task the debate claims should be tested."
 tv_academy_debate.2031.t: "Hereditary Office in Crisis"
 tv_academy_debate.2032.a: "Open the chairs."
 tv_academy_debate.2032.b: "Confirm patron rights."
 tv_academy_debate.2032.d: "Academy scholars demand that teaching posts be competed for, not inherited from patrons."
 tv_academy_debate.2032.t: "Scholar Demand for Open Chairs"
 tv_academy_debate.2033.a: "Count service in appointments."
 tv_academy_debate.2033.b: "Keep civil posts separate."
 tv_academy_debate.2033.d: "Veterans ask whether years of disciplined service count as merit or merely scars."
 tv_academy_debate.2033.t: "Veterans' Service Rolls"
 tv_academy_debate.2034.a: "Let the result stand."
 tv_academy_debate.2034.b: "Order a second trial."
 tv_academy_debate.2034.d: "A favored candidate performs badly in a supervised trial and everyone notices."
 tv_academy_debate.2034.t: "The Crown's Favorite Fails"
 tv_academy_debate.2035.a: "Publicly void them."
 tv_academy_debate.2035.b: "Bury the investigation."
 tv_academy_debate.2035.d: "Investigators find that the cleanest exam papers came from the dirtiest patronage network."
 tv_academy_debate.2035.t: "Clean Ink, Dirty Hands"
 tv_academy_debate.2036.a: "Recognize the school."
 tv_academy_debate.2036.b: "Require capital certification."
 tv_academy_debate.2036.d: "A provincial school claims it can train officials without court polish."
 tv_academy_debate.2036.t: "A School Outside the Capital"
 tv_academy_debate.2037.a: "Swear protection."
 tv_academy_debate.2037.b: "Refuse to provoke great houses."
 tv_academy_debate.2037.d: "Examiners ask the Crown to protect them from noble retaliation before they publish results."
 tv_academy_debate.2037.t: "Oath of the Examiners"
 tv_academy_debate.2038.a: "Exhibit it at the Academy."
 tv_academy_debate.2038.b: "Store it as a curiosity."
 tv_academy_debate.2038.d: "Laborers uncover an ancient marble torso, broken at the limbs but disturbingly complete in its argument. Artists crowd around it and insist that stone has answered questions the commentaries kept postponing."
 tv_academy_debate.2038.t: "A Newly Found Torso"
 tv_academy_debate.2039.a: "Permit the lesson."
 tv_academy_debate.2039.b: "Forbid the spectacle."
 tv_academy_debate.2039.d: "Physicians ask to conduct a sanctioned anatomical lesson before courtiers and scholars. The old diagrams remain polite on the table, but the physicians warn that politeness has never made a body true."
 tv_academy_debate.2039.t: "Anatomy Before the Court"
 tv_academy_debate.2040.a: "Celebrate the method."
 tv_academy_debate.2040.b: "Demand traditional forms."
 tv_academy_debate.2040.d: "A painter unveils a chapel design where arches, saints, and shadows obey the same measured vanishing point. Some call it reverence made clearer; others call it geometry standing too close to the altar."
 tv_academy_debate.2040.t: "Perspective in the Chapel"
 tv_academy_debate.2041.a: "Expand court patronage."
 tv_academy_debate.2041.b: "Keep patronage ceremonial."
 tv_academy_debate.2041.d: "Artists bring a ledger showing which workshops changed when patrons paid, and which sermons merely praised change after it was already carved, painted, and delivered. Inspiration, the ledger suggests, has a treasurer."
 tv_academy_debate.2041.t: "Patronage Ledger"
 tv_academy_debate.2042.a: "Invite them to lecture."
 tv_academy_debate.2042.b: "Keep tutors private."
 tv_academy_debate.2042.d: "A humanist tutor argues that rulers should read history as instruction, not ornament. Several nobles hear the word \"instruction\" and immediately wonder who is being instructed to surrender old habits."
 tv_academy_debate.2042.t: "The Humanist Tutor"
 tv_academy_debate.2043.a: "Let the market read."
 tv_academy_debate.2043.b: "Restrict copies to scholars."
 tv_academy_debate.2043.d: "Cheap copies of classical verses appear beside account books and salt fish. The Academy discovers that old authors sound different when read by people who paid market price for them."
 tv_academy_debate.2043.t: "Classics in the Market"
 tv_academy_debate.2044.a: "Defend artistic inquiry."
 tv_academy_debate.2044.b: "Side with theology."
 tv_academy_debate.2044.d: "An artist and a theologian quarrel over whether beauty teaches truth or merely distracts the soul from it. The Academy listens as brushwork and doctrine accuse each other of vanity."
 tv_academy_debate.2044.t: "Artist Versus Theologian"
 tv_academy_debate.2045.a: "Fund the masque."
 tv_academy_debate.2045.b: "Avoid theatrical doctrine."
 tv_academy_debate.2045.d: "Courtiers propose a grand performance celebrating rebirth, order, and the Crown's excellent taste. Everyone agrees the doctrine would be more convincing with music, costumes, and invoices."
 tv_academy_debate.2045.t: "Court Masque of Renewal"
 tv_academy_debate.2046.a: "Publish the measures."
 tv_academy_debate.2046.b: "Treat them as antiquarian trivia."
 tv_academy_debate.2046.d: "Surveyors measure ancient ruins and discover proportions that embarrass current builders. The stones say nothing, which makes their arithmetic harder to interrupt."
 tv_academy_debate.2046.t: "A Ruin Measured"
 tv_academy_debate.2047.a: "Welcome the essays."
 tv_academy_debate.2047.b: "Dismiss the salon."
 tv_academy_debate.2047.d: "A salon of learned women circulates essays that make the Academy look smaller than it claims. Their arguments arrive polished, unattributed to any chair, and inconveniently difficult to dismiss."
 tv_academy_debate.2047.t: "Women's Learning Salon"
 tv_academy_debate.2048.a: "Sponsor translation"
 tv_academy_debate.2048.b: "Delay for review"
 tv_academy_debate.2048.d: "A Greek text arrives with enough ambiguity to start three arguments and one school."
 tv_academy_debate.2048.t: "Translation of a Greek Text"
 tv_academy_debate.2049.a: "Place it in the Academy"
 tv_academy_debate.2049.b: "Keep walls neutral"
 tv_academy_debate.2049.d: "A fresco depicts the realm stepping from shadow into measured light. It is not subtle, which is why it works."
 tv_academy_debate.2049.t: "Fresco of the New Age"
 tv_academy_debate.2050.a: "Enforce the new curriculum"
 tv_academy_debate.2050.b: "Respect workshop custom"
 tv_academy_debate.2050.d: "Traditional masters refuse new proportions, calling them foreign vanity."
 tv_academy_debate.2050.t: "Old Workshop Resists"
 tv_academy_debate.2051.a: "Use their language"
 tv_academy_debate.2051.b: "Expel the poets"
 tv_academy_debate.2051.d: "Poets begin turning the issue into quotable lines, which may be useful and is definitely dangerous."
 tv_academy_debate.2051.t: "Poets at the Debate"
 tv_academy_debate.2052.a: "Accept the style"
 tv_academy_debate.2052.b: "Keep the old iconography"
 tv_academy_debate.2052.d: "The royal portraitist proposes painting the ruler in humanist style rather than sacred distance."
 tv_academy_debate.2052.t: "The Prince's Portrait"
 tv_academy_debate.2053.a: "Adopt the new festivals."
 tv_academy_debate.2053.b: "Keep the old festival order."
 tv_academy_debate.2053.d: "Scholars suggest reshaping civic festivals around learning, arts, and urban pride, until the year's holy and market days begin to look like an argument about what the realm honors."
 tv_academy_debate.2053.t: "New Calendar of Festivals"
 tv_academy_debate.2054.a: "Hire the master."
 tv_academy_debate.2054.b: "Decline politely."
 tv_academy_debate.2054.d: "A foreign master offers techniques that local artists resent for being both foreign and better, and every compliment paid to the visitor lands like a correction."
 tv_academy_debate.2054.t: "Imported Master"
 tv_academy_debate.2055.a: "Accept the new order."
 tv_academy_debate.2055.b: "Restore the old shelves."
 tv_academy_debate.2055.d: "Humanists reorder the Academy library by subject instead of inherited shelf tradition, and suddenly old books begin introducing themselves to new neighbors."
 tv_academy_debate.2055.t: "Library Reordered"
 tv_academy_debate.2056.a: "Back the urban program."
 tv_academy_debate.2056.b: "Keep art indoors."
 tv_academy_debate.2056.d: "Urban reformers argue that streets, squares, and facades can teach citizens better taste, provided the treasury accepts that stone is now a syllabus."
 tv_academy_debate.2056.t: "The City as Classroom"
 tv_academy_debate.2057.a: "Let satire circulate."
 tv_academy_debate.2057.b: "Confiscate the copies."
 tv_academy_debate.2057.d: "A biting satire makes old authorities look pompous, which is effective and slightly unfair; by noon, half the Academy is laughing and the other half is counting copies."
 tv_academy_debate.2057.t: "Satire of the Old Masters"
 tv_academy_debate.2058.a: "Adopt double-entry standards."
 tv_academy_debate.2058.b: "Keep older accounts."
 tv_academy_debate.2058.d: "A merchant accountant opens a ledger before the Academy and matches every claim to a counterclaim. The arithmetic is dry, merciless, and suddenly more persuasive than rhetoric."
 tv_academy_debate.2058.t: "Double-Entry Demonstration"
 tv_academy_debate.2059.a: "Use the roll as proof."
 tv_academy_debate.2059.b: "Suppress the roll."
 tv_academy_debate.2059.d: "Bankers arrive with a roll of noble debts, sealed twice and whispered over once. It shows that several proud estates stand on credit they publicly despise."
 tv_academy_debate.2059.t: "Noble Debt Roll"
 tv_academy_debate.2060.a: "Defend regulated interest."
 tv_academy_debate.2060.b: "Condemn the practice."
 tv_academy_debate.2060.d: "At dawn a preacher turns interest into a sin that every debtor can understand. By noon the Academy is arguing whether regulation purifies credit or merely gives vice a receipt."
 tv_academy_debate.2060.t: "Sermon on Usury"
 tv_academy_debate.2061.a: "Charter the bank."
 tv_academy_debate.2061.b: "Delay the charter."
 tv_academy_debate.2061.d: "City burghers draft a public bank backed by Crown promise. The plan offers stability on paper and then invites everyone to ask what the promise itself is worth."
 tv_academy_debate.2061.t: "Public Bank Proposal"
 tv_academy_debate.2062.a: "Reform the coinage."
 tv_academy_debate.2062.b: "Blame rumor-mongers."
 tv_academy_debate.2062.d: "Rumor claims the coin in every purse is thinner than the Crown's promise. Markets begin weighing trust as carefully as silver."
 tv_academy_debate.2062.t: "Debased Coin Panic"
 tv_academy_debate.2063.a: "Regulate deposits."
 tv_academy_debate.2063.b: "Treat it as private misfortune."
 tv_academy_debate.2063.d: "A widow comes before the Academy with a receipt, a lost dowry, and a voice too steady to dismiss. What had sounded like an argument over banking rules now has a face in the hall."
 tv_academy_debate.2063.t: "Widow's Deposit"
 tv_academy_debate.2064.a: "Clarify the law."
 tv_academy_debate.2064.b: "Threaten the bankers."
 tv_academy_debate.2064.d: "An emergency loan is requested in the Crown's name, and the bankers answer with silence, then conditions. The hall learns that unclear banking law can make even royal need wait at the counter."
 tv_academy_debate.2064.t: "Royal Loan Refusal"
 tv_academy_debate.2065.a: "Endorse bills of exchange."
 tv_academy_debate.2065.b: "Restrict paper instruments."
 tv_academy_debate.2065.d: "Merchants lay out letters, seals, and signatures showing how wealth can cross borders while guarded carts are still choosing a road. The paper looks fragile until everyone notices how much coin it commands."
 tv_academy_debate.2065.t: "Bills of Exchange"
 tv_academy_debate.2066.a: "Use it to demand standards."
 tv_academy_debate.2066.b: "Punish only the clerk."
 tv_academy_debate.2066.d: "The ledger is elegant, balanced, and false. Its columns possess the calm beauty of order, which makes the theft behind them feel like an insult to arithmetic itself."
 tv_academy_debate.2066.t: "Fraudulent Ledger"
 tv_academy_debate.2067.a: "Bring them under law."
 tv_academy_debate.2067.b: "Exempt religious credit."
 tv_academy_debate.2067.d: "Monasteries and church offices open their records just far enough to reveal a web of loans, pledges, and quiet exemptions. The debate discovers that sacred hands can also count interest."
 tv_academy_debate.2067.t: "Clerical Credit Chest"
 tv_academy_debate.2068.a: "Mediate with new rules."
 tv_academy_debate.2068.b: "Close the bank temporarily."
 tv_academy_debate.2068.d: "Debtors and creditors clash outside a city bank, each side waving contracts like injuries and calling the other side robbery with better handwriting. The Academy cannot pretend that banking reform is only an argument among ledgers."
 tv_academy_debate.2068.t: "City Bank Riot"
 tv_academy_debate.2069.a: "Audit the farms."
 tv_academy_debate.2069.b: "Preserve tax custom."
 tv_academy_debate.2069.d: "Tax farmers object that transparent finance will make their profession less profitable, which is true and therefore very badly received. Their ledgers arrive tied in ribbon, as if ribbon could make rents look like service."
 tv_academy_debate.2069.t: "Tax Farm Accounts"
 tv_academy_debate.2070.a: "Teach the method."
 tv_academy_debate.2070.b: "Keep the calculation obscure."
 tv_academy_debate.2070.d: "A mathematician demonstrates compound interest on a clean slate, and several listeners look as if the chalk has named them personally. What had seemed like merchant habit becomes a law of numbers."
 tv_academy_debate.2070.t: "Scholar of Interest"
 tv_academy_debate.2071.a: "Recognize pooled risk."
 tv_academy_debate.2071.b: "Reject novel liability."
 tv_academy_debate.2071.d: "Burghers propose a pooled fund for sailors' families, failed caravans, and the quiet disasters that follow a broken journey home. The proposal makes risk look less like fate and more like something that can be counted together."
 tv_academy_debate.2071.t: "Merchant Widow Fund"
 tv_academy_debate.2072.a: "Invite them under regulation."
 tv_academy_debate.2072.b: "Keep banking domestic."
 tv_academy_debate.2072.d: "A foreign banking house offers expertise, capital, and a contract whose clauses are too neat to be innocent. Supporters see imported knowledge; opponents see the realm's purse learning a foreign accent."
 tv_academy_debate.2072.t: "Foreign Banker Arrives"
 tv_academy_debate.2073.a: "Publicize the confession."
 tv_academy_debate.2073.b: "Retire them quietly."
 tv_academy_debate.2073.d: "A tired mint officer admits that the old coinage routine survives on tolerated confusion: clipped weights, private exceptions, and ledgers no one quite dares to reconcile."
 tv_academy_debate.2073.t: "Mint Officer's Confession"
 tv_academy_debate.2074.a: "Use banking reform to pay them."
 tv_academy_debate.2074.b: "Borrow informally again."
 tv_academy_debate.2074.d: "Soldiers wait outside the pay office while treasurers argue over methods, reserves, and signatures. The debate suddenly has boots, hunger, and a very practical sense of time."
 tv_academy_debate.2074.t: "Army Pay Delay"
 tv_academy_debate.2075.a: "Require plain contracts."
 tv_academy_debate.2075.b: "Keep elite legal forms."
 tv_academy_debate.2075.d: "Reformers bring a financial contract written so ordinary readers can understand what binds them. The lawyers look as if someone has opened a window in winter."
 tv_academy_debate.2075.t: "Contract in Plain Language"
 tv_academy_debate.2076.a: "Legalize orderly bankruptcy."
 tv_academy_debate.2076.b: "Keep disgrace as punishment."
 tv_academy_debate.2076.d: "A ruined merchant argues that orderly bankruptcy saves workshops, creditors, and families better than public disgrace ever has. The moralists hear mercy; the bankers hear salvage."
 tv_academy_debate.2076.t: "Bankruptcy Shame"
 tv_academy_debate.2077.a: "Publish it."
 tv_academy_debate.2077.b: "Keep accounts closed."
 tv_academy_debate.2077.d: "The Academy proposes a simplified royal account: enough figures to prove confidence, not enough to let every court faction sharpen a knife. The room immediately asks where that line is drawn."
 tv_academy_debate.2077.t: "Crown Account Published"
 tv_academy_debate.2078.a: "Trust the chart."
 tv_academy_debate.2078.b: "Dismiss it as tavern ink."
 tv_academy_debate.2078.d: "A battered chart reaches the Academy with coastlines that refuse to fit any known map. Its stains look like tavern evidence until the room notices that every wrong line still points west."
 tv_academy_debate.2078.t: "The Sailor's Chart"
 tv_academy_debate.2079.a: "Hear them publicly."
 tv_academy_debate.2079.b: "Question them privately."
 tv_academy_debate.2079.d: "A pilot returns with salt in their clothes, fever in their bones, and a story that repeats itself too clearly to be waved away. The Academy must decide whether the realm hears the tale as evidence or as a secret."
 tv_academy_debate.2079.t: "Returned Pilot"
 tv_academy_debate.2080.a: "Grant mission priority."
 tv_academy_debate.2080.b: "Balance mission with survey."
 tv_academy_debate.2080.d: "Clerics argue that discovery without conversion is only wandering with better maps. The Academy's debate is pulled between souls, surveys, and the uncomfortable question of who gets to define a new shore first."
 tv_academy_debate.2080.t: "Clergy Ask for Mission Rights"
 tv_academy_debate.2081.a: "Issue a charter."
 tv_academy_debate.2081.b: "Keep discovery under Crown lock."
 tv_academy_debate.2081.d: "Merchants offer to fund voyages if the Crown lets them name harbors they have not yet seen. Their confidence is useful, expensive, and already trying to put a seal on empty water."
 tv_academy_debate.2081.t: "Merchants Want Charter"
 tv_academy_debate.2082.a: "Let it reshape the debate."
 tv_academy_debate.2082.b: "Treat it as curiosity."
 tv_academy_debate.2082.d: "A translated account from across the sea contradicts half the Academy's assumptions without sounding impressed by any of them. The room discovers that the new world has not been waiting silently to be described."
 tv_academy_debate.2082.t: "Native Envoy's Account"
 tv_academy_debate.2083.a: "Fund precautions and proceed."
 tv_academy_debate.2083.b: "Use disease as warning."
 tv_academy_debate.2083.d: "Physicians warn the Academy that new shores may bring fevers as well as coastlines. Supporters of discovery must now prove that prudence can travel on the same ships as curiosity."
 tv_academy_debate.2083.t: "Disease Report"
 tv_academy_debate.2084.a: "Continue the program."
 tv_academy_debate.2084.b: "Suspend voyages."
 tv_academy_debate.2084.d: "An expedition fails to return, and the empty harbor argues with better timing than any lecturer. Opponents call the silence evidence; supporters answer that the unknown was never going to surrender politely."
 tv_academy_debate.2084.t: "Missing Expedition"
 tv_academy_debate.2085.a: "Display the goods."
 tv_academy_debate.2085.b: "Seal the cargo."
 tv_academy_debate.2085.d: "The harbor fills with people eager to see strange goods unloaded. Each object becomes a small ambassador, giving the Academy's argument color, weight, and something the crowd can point at."
 tv_academy_debate.2085.t: "Harbor Crowd"
 tv_academy_debate.2086.a: "Accept the correction."
 tv_academy_debate.2086.b: "Restore the old map."
 tv_academy_debate.2086.d: "A mapmaker erases a traditional boundary in front of witnesses and inks a coast where certainty used to sit. The scrape of the knife sounds small until everyone realizes what authority has just lost."
 tv_academy_debate.2086.t: "Mapmaker's Correction"
 tv_academy_debate.2087.a: "Fund oceanic preparation."
 tv_academy_debate.2087.b: "Keep fleets coastal."
 tv_academy_debate.2087.d: "Naval officers tell the Academy that discovery cannot be sailed on ceremonial timber. If the realm wants the ocean to become a road, it must pay for ships prepared to survive more than a parade."
 tv_academy_debate.2087.t: "Naval Officers Demand Funds"
 tv_academy_debate.2088.a: "Use greed to fund voyages."
 tv_academy_debate.2088.b: "Denounce the rumor."
 tv_academy_debate.2088.d: "Reports of gold spread faster than reliable latitude. Supporters argue that greed can be harnessed before it becomes policy by accident, while opponents warn that the Academy is mistaking fever for evidence."
 tv_academy_debate.2088.t: "Rumor of Gold"
 tv_academy_debate.2089.a: "Contest the claim."
 tv_academy_debate.2089.b: "Avoid provocation."
 tv_academy_debate.2089.d: "A rival court claims the new coast first and sends letters polished smooth by confidence. Suddenly the Academy's question is not only whether the coast exists, but whether silence would make it belong to someone else."
 tv_academy_debate.2089.t: "Foreign Claim"
 tv_academy_debate.2090.a: "Praise correction as science."
 tv_academy_debate.2090.b: "Hide the error."
 tv_academy_debate.2090.d: "The Academy's favored cosmographer admits that a major distance estimate was wrong. The error is small on parchment only because parchment is mercifully flat."
 tv_academy_debate.2090.t: "Cosmographer's Error"
 tv_academy_debate.2091.a: "Pay and persuade them."
 tv_academy_debate.2091.b: "Accept their fear as wisdom."
 tv_academy_debate.2091.d: "Sailors refuse another voyage until omens are answered, and every official explanation seems to make the signs more stubborn. The Academy must decide whether fear at sea is a problem of pay, persuasion, or providence."
 tv_academy_debate.2091.t: "Sailors' Superstitions"
 tv_academy_debate.2092.a: "Reform charters."
 tv_academy_debate.2092.b: "Revoke the experiment."
 tv_academy_debate.2092.d: "A charter holder abuses distant authority before the principle has even won the argument at home. The scandal hands opponents a sharp question: if discovery begins this badly, what exactly is being accepted?"
 tv_academy_debate.2092.t: "Colonial Charter Abuse"
 tv_academy_debate.2093.a: "Promote the crop."
 tv_academy_debate.2093.b: "Keep it contained."
 tv_academy_debate.2093.d: "A strange crop survives in the Academy test garden, stubbornly green where theory expected only rumor. Farmers, merchants, and skeptics gather around the leaves because the unknown has become something that can be watered."
 tv_academy_debate.2093.t: "Imported Crop"
 tv_academy_debate.2094.a: "Assert navigational rights."
 tv_academy_debate.2094.b: "Refuse distant entanglement."
 tv_academy_debate.2094.d: "Diplomats ask whether shores still half-imagined by mapmakers can already be divided by ink. The Academy's argument is suddenly not only about what exists, but about who may claim the right to arrive there first."
 tv_academy_debate.2094.t: "Treaty of Unknown Shores"
 tv_academy_debate.2095.a: "Circulate the grammar."
 tv_academy_debate.2095.b: "Keep it for missions only."
 tv_academy_debate.2095.d: "A missionary arrives with a grammar of a language no courtier can pronounce without humility. The pages prove that discovery has voices, rules, and meanings of its own, not merely coastlines waiting to be named."
 tv_academy_debate.2095.t: "Missionary Grammar"
 tv_academy_debate.2096.a: "Guarantee the expedition."
 tv_academy_debate.2096.b: "Let investors retreat."
 tv_academy_debate.2096.d: "A storm breaks ships prepared for the next voyage, and the port's confidence cracks almost as loudly as the masts. Investors who praised discovery yesterday now study the wreckage like accountants of fear."
 tv_academy_debate.2096.t: "Port Investors Panic"
 tv_academy_debate.2097.a: "Make it public teaching."
 tv_academy_debate.2097.b: "Keep it for experts."
 tv_academy_debate.2097.d: "A new globe is carried into the Academy schoolroom, round enough to make old wall maps look embarrassed. Students turn it by hand, and the room discovers that geography can change under one's fingers."
 tv_academy_debate.2097.t: "School Globe"
 tv_academy_debate.2098.a: "Distribute it widely."
 tv_academy_debate.2098.b: "Confine it to scholars."
 tv_academy_debate.2098.d: "The first pamphlet run finishes before the censors finish deciding what a pamphlet is."
 tv_academy_debate.2098.t: "First Run of Pamphlets"
 tv_academy_debate.2099.a: "Recognize the guild."
 tv_academy_debate.2099.b: "Keep presses licensed case by case."
 tv_academy_debate.2099.d: "Printers ask for legal recognition before more presses appear in basements and borrowed kitchens."
 tv_academy_debate.2099.t: "Printer's Guild Petition"
 tv_academy_debate.2100.a: "Reject broad indexing."
 tv_academy_debate.2100.b: "Approve the index."
 tv_academy_debate.2100.d: "Clergy propose an index of dangerous books, which the students immediately want to read."
 tv_academy_debate.2100.t: "Clerical Index"
 tv_academy_debate.2101.a: "Use print for reform."
 tv_academy_debate.2101.b: "Restrict village printing."
 tv_academy_debate.2101.d: "Cheap printed prayer sheets reach villages faster than official sermons."
 tv_academy_debate.2101.t: "Cheap Prayer Sheets"
 tv_academy_debate.2102.a: "Defend press freedom."
 tv_academy_debate.2102.b: "Punish the printer."
 tv_academy_debate.2102.d: "A printer publishes court gossip beside serious argument and sells both equally well."
 tv_academy_debate.2102.t: "Scandal Sheet"
 tv_academy_debate.2103.a: "Adopt it."
 tv_academy_debate.2103.b: "Review it for another season."
 tv_academy_debate.2103.d: "A printed textbook spreads corrected diagrams through schools in one season."
 tv_academy_debate.2103.t: "Corrected Textbook"
 tv_academy_debate.2104.a: "Subsidize paper."
 tv_academy_debate.2104.b: "Limit print runs."
 tv_academy_debate.2104.d: "Paper makers warn that debate cannot be printed on enthusiasm alone."
 tv_academy_debate.2104.t: "Paper Shortage"
 tv_academy_debate.2105.a: "Tolerate them."
 tv_academy_debate.2105.b: "Hunt the authors."
 tv_academy_debate.2105.d: "Anonymous broadsides support the issue with such vigor that even allies look nervous."
 tv_academy_debate.2105.t: "Anonymous Broadsides"
 tv_academy_debate.2106.a: "Answer in print."
 tv_academy_debate.2106.b: "Ignore foreign noise."
 tv_academy_debate.2106.d: "A foreign press reprints Academy arguments with errors, insults, and impressive speed."
 tv_academy_debate.2106.t: "Foreign Press Copies Us"
 tv_academy_debate.2107.a: "Retrain scribes for presses."
 tv_academy_debate.2107.b: "Protect manuscript work."
 tv_academy_debate.2107.d: "Scribes warn that movable type will starve honest hands and dishonest abbreviations alike."
 tv_academy_debate.2107.t: "Scribes' Protest"
 tv_academy_debate.2108.a: "Standardize printed law."
 tv_academy_debate.2108.b: "Keep proclamations traditional."
 tv_academy_debate.2108.d: "Officials discover that printed proclamations reach people before rumor edits them."
 tv_academy_debate.2108.t: "Royal Proclamation Printed"
 tv_academy_debate.2109.a: "Legalize and annotate it."
 tv_academy_debate.2109.b: "Expand confiscations."
 tv_academy_debate.2109.d: "A banned book becomes popular because it is banned, as books sometimes do out of spite."
 tv_academy_debate.2109.t: "Forbidden Book Success"
 tv_academy_debate.2110.a: "Grant the press."
 tv_academy_debate.2110.b: "Centralize printing."
 tv_academy_debate.2110.d: "A university requests its own press to avoid begging city printers for sober priorities."
 tv_academy_debate.2110.t: "University Printer"
 tv_academy_debate.2111.a: "Create correction sheets."
 tv_academy_debate.2111.b: "Use it against print reliability."
 tv_academy_debate.2111.d: "One bad printed table spreads the same error through hundreds of copies."
 tv_academy_debate.2111.t: "Errors Multiply"
 tv_academy_debate.2112.a: "Use popular print."
 tv_academy_debate.2112.b: "Suppress vulgar argument."
 tv_academy_debate.2112.d: "A printed ballad explains the debate badly but memorably."
 tv_academy_debate.2112.t: "Ballad of the Issue"
 tv_academy_debate.2113.a: "Protect the printer."
 tv_academy_debate.2113.b: "Fine the printer."
 tv_academy_debate.2113.d: "A noble sues a printer for making old privilege look ridiculous in affordable type."
 tv_academy_debate.2113.t: "Noble Libel Suit"
 tv_academy_debate.2114.a: "Publish them."
 tv_academy_debate.2114.b: "Keep one official language."
 tv_academy_debate.2114.d: "Printers propose editions in several languages, making the argument harder to contain."
 tv_academy_debate.2114.t: "Multilingual Edition"
 tv_academy_debate.2115.a: "Approve military printing."
 tv_academy_debate.2115.b: "Keep presses civil."
 tv_academy_debate.2115.d: "Officers request printed drill manuals and technical sheets."
 tv_academy_debate.2115.t: "Press in the Barracks"
 tv_academy_debate.2116.a: "Use the fame."
 tv_academy_debate.2116.b: "Recenter scholars."
 tv_academy_debate.2116.d: "A printer becomes famous enough to annoy scholars who wrote the actual words."
 tv_academy_debate.2116.t: "Printer Becomes Celebrity"
 tv_academy_debate.2117.a: "Bypass the delay."
 tv_academy_debate.2117.b: "Respect the process."
 tv_academy_debate.2117.d: "The censor takes so long that the issue risks dying politely in a locked drawer."
 tv_academy_debate.2117.t: "The Censor's Delay"
 tv_academy_debate.2118.a: "Make confession public policy."
 tv_academy_debate.2118.b: "Keep court faith private."
 tv_academy_debate.2118.d: "Courtiers ask whether the Crown's faith should stand in public as a rule for the realm, or remain a private habit spoken through chapel attendance and careful silences."
 tv_academy_debate.2118.t: "Confession of the Court"
 tv_academy_debate.2119.a: "Require registers."
 tv_academy_debate.2119.b: "Leave records local."
 tv_academy_debate.2119.d: "Reformers place parish registers before the Academy and argue that belief, marriage, and birth cannot guide policy until the state can read them in a steady hand."
 tv_academy_debate.2119.t: "Parish Registers"
 tv_academy_debate.2120.a: "License sermons centrally."
 tv_academy_debate.2120.b: "Preserve local preaching custom."
 tv_academy_debate.2120.d: "As doctrine becomes government, the pulpit no longer feels merely local. Preachers ask who may speak for orthodoxy when every sermon can sound like policy."
 tv_academy_debate.2120.t: "Sermon Licensing"
 tv_academy_debate.2121.a: "Enforce uniformity."
 tv_academy_debate.2121.b: "Tolerate the chapel."
 tv_academy_debate.2121.d: "A noble house maintains a chapel practice that no longer fits the emerging confession. Its defenders call it family honor; its opponents call it a loophole with candles."
 tv_academy_debate.2121.t: "Noble Chapel Dispute"
 tv_academy_debate.2122.a: "Print and teach it."
 tv_academy_debate.2122.b: "Delay for consensus."
 tv_academy_debate.2122.d: "Scholars produce a catechism brief enough for children to memorize and sharp enough for adults to argue over. Its margins already look like a battlefield."
 tv_academy_debate.2122.t: "Catechism Draft"
 tv_academy_debate.2123.a: "Define legal protection under confession."
 tv_academy_debate.2123.b: "Avoid guarantees."
 tv_academy_debate.2123.d: "A minority community sends elders to the Academy with a petition folded beneath careful seals. They do not deny the realm's confession; they ask whether obedience will mean protection or only quieter exclusion."
 tv_academy_debate.2123.t: "Minority Petition"
 tv_academy_debate.2124.a: "Issue the oath."
 tv_academy_debate.2124.b: "Keep old oaths."
 tv_academy_debate.2124.d: "Officers warn that soldiers who pray in different parishes still stand in the same line of battle. They want one oath strong enough to bind the camp before local custom pulls it apart."
 tv_academy_debate.2124.t: "Army Oath"
 tv_academy_debate.2125.a: "Summon the synod."
 tv_academy_debate.2125.b: "Avoid spectacle."
 tv_academy_debate.2125.d: "A formal synod is proposed, with witnesses numerous enough that no faction can later pretend the hard words were never spoken. Doctrine would leave the Academy as a public settlement, not a rumor."
 tv_academy_debate.2125.t: "Synod Summons"
 tv_academy_debate.2126.a: "Accept their letters."
 tv_academy_debate.2126.b: "Reject foreign influence."
 tv_academy_debate.2126.d: "Letters arrive from foreign co-religionists, full of encouragement, advice, and signatures too prominent to ignore. Their support strengthens the argument and makes every listener wonder who else is listening."
 tv_academy_debate.2126.t: "Foreign Co-Religionists"
 tv_academy_debate.2127.a: "Reform the calendar."
 tv_academy_debate.2127.b: "Keep local feasts."
 tv_academy_debate.2127.d: "Reformers spread a revised holy calendar across the table and discover that every crossed-out feast has neighbors, guilds, and grandparents attached to it. The state can align sacred time, but not quietly."
 tv_academy_debate.2127.t: "Feast Day Reform"
 tv_academy_debate.2128.a: "Approve them."
 tv_academy_debate.2128.b: "Keep schools doctrinally local."
 tv_academy_debate.2128.d: "New schoolbooks arrive at the Academy with doctrine printed beside spelling, sums, and civic maxims. Children will learn their letters and the realm's confession from the same page."
 tv_academy_debate.2128.t: "Confessional Schoolbooks"
 tv_academy_debate.2129.a: "Regulate the pilgrimage."
 tv_academy_debate.2129.b: "Let custom rule."
 tv_academy_debate.2129.d: "A pilgrimage spills from devotion into street violence after rival sermons, old badges, and new slogans meet on the same road. The Academy must decide whether custom can be disciplined without being broken."
 tv_academy_debate.2129.t: "Pilgrim Riot"
 tv_academy_debate.2130.a: "Establish the courts."
 tv_academy_debate.2130.b: "Leave marriage to existing clergy courts."
 tv_academy_debate.2130.d: "Jurists propose marriage courts recognized by the state and ruled by confessional law. What families once carried to familiar clergy may soon arrive with seals, clerks, and precedent."
 tv_academy_debate.2130.t: "Marriage Court"
 tv_academy_debate.2131.a: "Set a confessional rule."
 tv_academy_debate.2131.b: "Avoid ruling."
 tv_academy_debate.2131.d: "A church image becomes more than paint and wood once preachers, worshippers, and officials all insist it proves their point. The question is no longer whether the image is beautiful, but who may say what devotion means."
 tv_academy_debate.2131.t: "Icon Debate"
 tv_academy_debate.2132.a: "Protect the preachers."
 tv_academy_debate.2132.b: "Restrain them."
 tv_academy_debate.2132.d: "Preachers cross the frontier with sermons sharp enough to win converts and complaints. Their doctrine strengthens the debate at home, but every border village now has a diplomatic echo."
 tv_academy_debate.2132.t: "Border Preachers"
 tv_academy_debate.2133.a: "Levy the tax."
 tv_academy_debate.2133.b: "Refuse the tax."
 tv_academy_debate.2133.d: "Officials propose a dedicated levy for confessional schools, arguing that doctrine taught cheaply will be doctrine forgotten quickly. The villages hear the word \"school\" and count the word \"tax.\""
 tv_academy_debate.2133.t: "Confession Tax"
 tv_academy_debate.2134.a: "Back discipline."
 tv_academy_debate.2134.b: "Back clerical privilege."
 tv_academy_debate.2134.d: "Clergy who once spoke as a single estate now divide over whether the new confession should discipline them as servants of a doctrine or protect them as guardians of inherited privilege."
 tv_academy_debate.2134.t: "Clergy Split"
 tv_academy_debate.2135.a: "Accept the recantation."
 tv_academy_debate.2135.b: "Demand public shame."
 tv_academy_debate.2135.d: "A prominent opponent offers to recant if the Academy spares them a ritual humiliation. Some see mercy as proof of confidence; others see a missed chance to make resistance tremble."
 tv_academy_debate.2135.t: "Public Recantation"
 tv_academy_debate.2136.a: "Count them."
 tv_academy_debate.2136.b: "Refuse the count."
 tv_academy_debate.2136.d: "Bureaucrats ask to count communities by confession, promising that columns are calmer than rumors. Minority elders notice that a column can become a target as easily as a tool."
 tv_academy_debate.2136.t: "Confessional Census"
 tv_academy_debate.2137.a: "Proclaim it."
 tv_academy_debate.2137.b: "Return it for revision."
 tv_academy_debate.2137.d: "Advisers draft a royal formula meant to sound ancient by tomorrow morning and inevitable by next week. The words are polished enough to shine, which is not the same as being settled."
 tv_academy_debate.2137.t: "The Crown's Formula"
 tv_academy_debate.2138.a: "Read the ledgers aloud."
 tv_academy_debate.2138.b: "Dismiss merchant arithmetic."
 tv_academy_debate.2138.d: "Harbor clerks spread ledgers of salt, silk, spice, freight, and insurance across the Academy table. Every column insists that distant prices already shape the realm, even when landed honor pretends not to notice."
 tv_academy_debate.2138.t: "Harbor Ledgers"
 tv_academy_debate.2139.a: "Grant the quarter."
 tv_academy_debate.2139.b: "Refuse special rights."
 tv_academy_debate.2139.d: "Foreign merchants ask for warehouses, lodging, and their own watchmen near the harbor. The request sounds practical until everyone realizes it would give distant markets a permanent address inside the realm."
 tv_academy_debate.2139.t: "Foreign Merchant Quarter"
 tv_academy_debate.2140.a: "Simplify tariffs."
 tv_academy_debate.2140.b: "Keep the schedule."
 tv_academy_debate.2140.d: "A customs review reveals duties so tangled that profitable cargo is punished by accident while favored goods slip through by habit. The schedule has become a policy argument written in crossed-out numbers."
 tv_academy_debate.2140.t: "Tariff Confusion"
 tv_academy_debate.2141.a: "Display the cargo."
 tv_academy_debate.2141.b: "Tax it quietly."
 tv_academy_debate.2141.d: "A spice cargo is opened before the Academy, and the room fills with a scent no inland tax register has ever captured. Suddenly distant islands feel less like rumor and more like an argument with cinnamon on its sleeves."
 tv_academy_debate.2141.t: "Spice Cargo"
 tv_academy_debate.2142.a: "Challenge their claim."
 tv_academy_debate.2142.b: "Reassure landed privilege."
 tv_academy_debate.2142.d: "Inland nobles warn that ocean trade teaches the realm to honor warehouses more than fields. Their speeches arrive polished, offended, and entirely certain that wealth should still smell like earth."
 tv_academy_debate.2142.t: "Port Nobles Object"
 tv_academy_debate.2143.a: "Recognize maritime insurance."
 tv_academy_debate.2143.b: "Treat loss as private risk."
 tv_academy_debate.2143.d: "Merchants place storm accounts, wreck inventories, and survivor statements before the Academy. Their argument is blunt: a realm that shares distant profit must also learn to share distant loss."
 tv_academy_debate.2143.t: "Insurance for Ships"
 tv_academy_debate.2144.a: "Reform legal routes."
 tv_academy_debate.2144.b: "Burn the map."
 tv_academy_debate.2144.d: "A seized map marks coves, warehouses, quiet roads, and trusted signals with more care than any customs register. The illegal network is embarrassing because it works."
 tv_academy_debate.2144.t: "Smuggler's Map"
 tv_academy_debate.2145.a: "Negotiate protections."
 tv_academy_debate.2145.b: "Break the strike."
 tv_academy_debate.2145.d: "Dockworkers stop the cranes, ropes, carts, and shouting that make trade look effortless from a council chamber. They ask why expanding commerce should make every wage feel smaller."
 tv_academy_debate.2145.t: "Dock Labor Strike"
 tv_academy_debate.2146.a: "Receive them openly."
 tv_academy_debate.2146.b: "Restrict their access."
 tv_academy_debate.2146.d: "A rival court sends merchants with gifts, draft contracts, and compliments polished until they almost pass for friendship. Every offer smells faintly of opportunity and leverage."
 tv_academy_debate.2146.t: "Rival Trade Embassy"
 tv_academy_debate.2147.a: "Standardize weights."
 tv_academy_debate.2147.b: "Preserve local measures."
 tv_academy_debate.2147.d: "Traders arrive with scales, stones, stamped bars, and accusations from half the market towns in the realm. Fraud has become local enough to defend as tradition."
 tv_academy_debate.2147.t: "Standard Weights"
 tv_academy_debate.2148.a: "Link caravan to convoy."
 tv_academy_debate.2148.b: "Keep route privileges separate."
 tv_academy_debate.2148.d: "Inland caravan masters and sea captains argue over which route deserves state support. In the Academy chamber, road dust and salt spray are both presented as proof that the realm must learn to treat distance as one connected system."
 tv_academy_debate.2148.t: "Caravan and Convoy"
 tv_academy_debate.2149.a: "Fund the school."
 tv_academy_debate.2149.b: "Leave training to families."
 tv_academy_debate.2149.d: "Burghers propose teaching navigation, contracts, and languages as serious public knowledge. The suggestion unsettles everyone who prefers commerce to remain a family secret with a counting table attached."
 tv_academy_debate.2149.t: "Merchant School"
 tv_academy_debate.2150.a: "Regulate but continue trade."
 tv_academy_debate.2150.b: "Halt exports broadly."
 tv_academy_debate.2150.d: "A poor harvest makes exports look like treason to hungry towns. Merchants insist that contracts keep future grain moving; the crowd outside wants to know why tomorrow's trust should outrank tonight's bread."
 tv_academy_debate.2150.t: "Export Panic"
 tv_academy_debate.2151.a: "Improve quarantine systems."
 tv_academy_debate.2151.b: "Restrict foreign ships."
 tv_academy_debate.2151.d: "Quarantine officials slow trade and claim survival as their defense. Merchants call every delay a lost season; physicians answer that a busy harbor is still useless if it imports the next funeral."
 tv_academy_debate.2151.t: "Port Quarantine"
 tv_academy_debate.2152.a: "Fund escorts."
 tv_academy_debate.2152.b: "Let merchants self-insure."
 tv_academy_debate.2152.d: "Merchants demand escorts and admirals demand funds, a partnership no one calls cheap. The Academy hears a simple question in expensive clothing: if trade is now global, must the state guard every horizon it profits from?"
 tv_academy_debate.2152.t: "Naval Escort Debate"
 tv_academy_debate.2153.a: "Break the monopoly."
 tv_academy_debate.2153.b: "Preserve guild privilege."
 tv_academy_debate.2153.d: "Overseas traders lay their contracts beside the city guild charters and call the old monopolies beautiful chains. The masters bristle, but the younger merchants can already hear distant markets rattling the locks."
 tv_academy_debate.2153.t: "Guild Monopoly Challenge"
 tv_academy_debate.2154.a: "Standardize trade languages."
 tv_academy_debate.2154.b: "Keep local contract forms."
 tv_academy_debate.2154.d: "Translators bring three versions of the same trade contract to the Academy, and only one of them would have spared the cargo. The room discovers that profit can drown in a single ambiguous clause."
 tv_academy_debate.2154.t: "Language of Contracts"
 tv_academy_debate.2155.a: "Accept global exposure."
 tv_academy_debate.2155.b: "Blame speculators."
 tv_academy_debate.2155.d: "News arrives that a price changed abroad, and local plans collapse before the officials can finish insisting that foreign markets are far away. The Academy hears the distance between ports shrink into a number."
 tv_academy_debate.2155.t: "Distant Price Shock"
 tv_academy_debate.2156.a: "Charter the free port."
 tv_academy_debate.2156.b: "Reject the experiment."
 tv_academy_debate.2156.d: "Reformers sketch a port where the Crown taxes movement instead of strangling it at every gate. Customs men call it reckless; merchants call it the first honest map of how goods already move."
 tv_academy_debate.2156.t: "Free Port Proposal"
 tv_academy_debate.2157.a: "Adopt wind routing."
 tv_academy_debate.2157.b: "Keep established routes."
 tv_academy_debate.2157.d: "Navigators unroll wind charts across the Academy table, and old routes suddenly look less like tradition than superstition with sails. Even the captains who scoff keep glancing at the lines."
 tv_academy_debate.2157.t: "Map of Trade Winds"
 tv_academy_debate.2158.a: "Back the model."
 tv_academy_debate.2158.b: "Keep dispersed workshops."
 tv_academy_debate.2158.d: "A merchant lays out the case for bringing spinners, finishers, clerks, and overseers beneath one roof. The bell above the yard sounds less like a tool than a new argument about how work should be ordered."
 tv_academy_debate.2158.t: "Workshop Under One Roof"
 tv_academy_debate.2159.a: "Enforce quality standards in manufactories."
 tv_academy_debate.2159.b: "Preserve guild inspection."
 tv_academy_debate.2159.d: "Guild masters arrive with samples of warped cloth, brittle tools, and finishing so hurried it feels like an accusation. They warn that scale can multiply errors as efficiently as it multiplies goods."
 tv_academy_debate.2159.t: "Guild Master's Complaint"
 tv_academy_debate.2160.a: "Build the works."
 tv_academy_debate.2160.b: "Refuse mechanized pressure."
 tv_academy_debate.2160.d: "Engineers sketch a water-powered process that would pull, pound, and turn with an appetite no hand can match. The river suddenly seems less like scenery and more like an employee waiting to be hired."
 tv_academy_debate.2160.t: "Waterwheel Proposal"
 tv_academy_debate.2161.a: "Defend wage work."
 tv_academy_debate.2161.b: "Restrict hiring custom."
 tv_academy_debate.2161.d: "A manufactory hires women in numbers too large to be dismissed as household help. What began as wages becomes an argument about custom, discipline, and who may stand visibly inside the new economy."
 tv_academy_debate.2161.t: "Women at the Looms"
 tv_academy_debate.2162.a: "Organize supply contracts."
 tv_academy_debate.2162.b: "Limit production to supply custom."
 tv_academy_debate.2162.d: "Production stalls because wool, timber, dye, or ore still arrives by village habit rather than manufactory appetite. The machines and benches wait while the countryside insists that supply has seasons, neighbors, and old obligations."
 tv_academy_debate.2162.t: "Raw Material Bottleneck"
 tv_academy_debate.2163.a: "Regulate manufactories."
 tv_academy_debate.2163.b: "Condemn large workshops."
 tv_academy_debate.2163.d: "A workshop fire leaves scorched beams, ruined stock, and a crowd of witnesses ready to decide what the flames have proven. Some see danger in concentration; others see danger in leaving concentration unregulated."
 tv_academy_debate.2163.t: "Fire in the Yard"
 tv_academy_debate.2164.a: "Accept clock discipline."
 tv_academy_debate.2164.b: "Limit work rules."
 tv_academy_debate.2164.d: "Managers hang bells and clocks where masters once relied on habit. Workers quickly discover that time can become a supervisor with no patience and no need to sleep."
 tv_academy_debate.2164.t: "Clock Discipline"
 tv_academy_debate.2165.a: "Accept standard production."
 tv_academy_debate.2165.b: "Keep bespoke supply."
 tv_academy_debate.2165.d: "The army offers a contract large enough to make every workshop owner count their benches twice. The catch is simple: the Crown wants parts and cloth that match, not charming local variations."
 tv_academy_debate.2165.t: "Military Contract"
 tv_academy_debate.2166.a: "Apply rules equally."
 tv_academy_debate.2166.b: "Exempt noble workshops."
 tv_academy_debate.2166.d: "A noble estate opens a large workshop with admirable confidence, then objects when burghers ask for the same freedom. The Academy is invited to discover whether scale is modern only when it wears a crest."
 tv_academy_debate.2166.t: "Noble Estate Workshop"
 tv_academy_debate.2167.a: "Set labor rules and continue."
 tv_academy_debate.2167.b: "Shut the model down."
 tv_academy_debate.2167.d: "Parish leaders arrive with names, ages, and smaller hands than the debate has been willing to imagine. The question is no longer whether manufactories produce more, but what kind of labor they are allowed to consume."
 tv_academy_debate.2167.t: "Child Labor Petition"
 tv_academy_debate.2168.a: "Promote standard parts."
 tv_academy_debate.2168.b: "Keep craft variation."
 tv_academy_debate.2168.d: "Artisans bring a neat row of parts that can trade places without complaint. Half the chamber sees a future of faster repair and steadier supply; the other half hears the quiet funeral bell of individual craft."
 tv_academy_debate.2168.t: "Standard Parts"
 tv_academy_debate.2169.a: "Use the accounts."
 tv_academy_debate.2169.b: "Avoid intrusive accounting."
 tv_academy_debate.2169.d: "Accountants lay out waste, delay, spoilage, and idle time in columns so tidy they feel accusatory. What once hid inside dust and habit now becomes a public question of management, discipline, and responsibility."
 tv_academy_debate.2169.t: "Factory Accounts"
 tv_academy_debate.2170.a: "Manage transition."
 tv_academy_debate.2170.b: "Slow expansion."
 tv_academy_debate.2170.d: "Peasant spokesmen complain that manufactory demand pulls hands from fields and daughters from household arrangements. The Academy hears not merely an objection to production, but the creaking of an entire rural order."
 tv_academy_debate.2170.t: "Rural Displacement"
 tv_academy_debate.2171.a: "Copy and adapt it."
 tv_academy_debate.2171.b: "Reject foreign machinery."
 tv_academy_debate.2171.d: "A foreign machine is carried into the Academy with unfamiliar bolts and very familiar ambition. Its admirers see a design that can be copied; its enemies see another country reaching a metal hand into local workshops."
 tv_academy_debate.2171.t: "Imported Machine"
 tv_academy_debate.2172.a: "Regulate smoke and continue."
 tv_academy_debate.2172.b: "Limit industrial sites."
 tv_academy_debate.2172.d: "Urban residents remind the Academy that productive smoke is still smoke. Window ledges, lungs, and laundry lines become witnesses against any theory that treats output as proof enough."
 tv_academy_debate.2172.t: "Coal Smoke Argument"
 tv_academy_debate.2173.a: "Permit regulated piecework."
 tv_academy_debate.2173.b: "Ban piecework."
 tv_academy_debate.2173.d: "Owners propose paying by the piece, so every finished length of cloth, polished tool, or packed crate becomes both wage and accusation. Workers hear arithmetic trying to become a foreman."
 tv_academy_debate.2173.t: "Piecework Pay"
 tv_academy_debate.2174.a: "Fund workshop schools."
 tv_academy_debate.2174.b: "Keep guild apprenticeship."
 tv_academy_debate.2174.d: "Reformers propose teaching workers inside manufactories, where the lesson begins at the bench and ends in a counted batch. Guild masters notice that apprenticeship is being asked to share its own vocabulary."
 tv_academy_debate.2174.t: "Workshop School"
 tv_academy_debate.2175.a: "Improve inspection and continue."
 tv_academy_debate.2175.b: "Blame scale itself."
 tv_academy_debate.2175.d: "A large batch fails inspection in public: seams split, fittings crack, and the opponents of scale look almost grateful for the evidence. The question is whether the failure condemns the system or merely the inspectors."
 tv_academy_debate.2175.t: "Quality Scandal"
 tv_academy_debate.2176.a: "Legalize the pool."
 tv_academy_debate.2176.b: "Forbid such concentration."
 tv_academy_debate.2176.d: "Merchants propose pooling capital large enough to build a manufactory no single family could command. The money arrives not as a purse, but as a committee with ledgers and patience."
 tv_academy_debate.2176.t: "Merchant Capital Pool"
 tv_academy_debate.2177.a: "Defend the new discipline."
 tv_academy_debate.2177.b: "Silence the whistle."
 tv_academy_debate.2177.d: "A new factory whistle divides the day with admirable efficiency and unbearable certainty. It tells workers when to begin, neighbors when to complain, and reformers that discipline can be heard from three streets away."
 tv_academy_debate.2177.t: "The First Whistle"
 tv_academy_debate.2178.a: "Trust repeated observation."
 tv_academy_debate.2178.b: "Treat it as anomaly."
 tv_academy_debate.2178.d: "A patient table of repeated observations is laid before the Academy, each line too ordinary to dazzle and too consistent to ignore. The old authorities remain impressive, but the numbers have begun refusing to bow."
 tv_academy_debate.2178.t: "Table of Observations"
 tv_academy_debate.2179.a: "Publish the failure."
 tv_academy_debate.2179.b: "Hide the failed trial."
 tv_academy_debate.2179.d: "A celebrated result is repeated before careful witnesses and refuses to appear. The silence after the failed trial is embarrassing, but it is also the first honest sound the chamber has heard all week."
 tv_academy_debate.2179.t: "Failed Replication"
 tv_academy_debate.2180.a: "Accept mathematical method."
 tv_academy_debate.2180.b: "Demand plain tradition."
 tv_academy_debate.2180.d: "A mathematician turns the disputed natural question into symbols so spare that several officials seem personally accused by the clarity. What had sounded like philosophy now sits on the page as a chain of necessity."
 tv_academy_debate.2180.t: "Mathematical Proof"
 tv_academy_debate.2181.a: "Fund new instruments."
 tv_academy_debate.2181.b: "Distrust tool-made claims."
 tv_academy_debate.2181.d: "An instrument maker brings lenses, screws, brass fittings, and the serene confidence of someone who knows scholars need better hands. Better tools, they insist, do not make better toys; they make better truth."
 tv_academy_debate.2181.t: "Instrument Maker's Claim"
 tv_academy_debate.2182.a: "Adopt the code."
 tv_academy_debate.2182.b: "Keep gentlemanly trust."
 tv_academy_debate.2182.d: "Reformers propose a code for witnessing, recording, and repeating experiments, complete with columns, signatures, and enough procedure to make every informal genius sigh. Trust, they argue, should leave a paper trail."
 tv_academy_debate.2182.t: "Academy Experiment Code"
 tv_academy_debate.2183.a: "Defend inquiry."
 tv_academy_debate.2183.b: "Soften the model."
 tv_academy_debate.2183.d: "Clergy warn that the new model rearranges more than the heavens. If the sky can be argued from observation, sermons, courts, and crowns may all be asked to explain what else they have inherited without proof."
 tv_academy_debate.2183.t: "Clerical Cosmology Objection"
 tv_academy_debate.2184.a: "Publicize the prediction."
 tv_academy_debate.2184.b: "Call it coincidence."
 tv_academy_debate.2184.d: "A calculation names the hour of a natural event, and the event arrives with uncomfortable punctuality. For a moment, even the skeptics have to decide whether coincidence has learned mathematics."
 tv_academy_debate.2184.t: "A Prediction Comes True"
 tv_academy_debate.2185.a: "Improve safety and continue."
 tv_academy_debate.2185.b: "Suspend experiments."
 tv_academy_debate.2185.d: "A demonstration explodes with enough force to settle the question of whether experiment has energy. Smoke drifts through the hall while both sides claim the wreckage as evidence."
 tv_academy_debate.2185.t: "Laboratory Accident"
 tv_academy_debate.2186.a: "Admit artisan evidence."
 tv_academy_debate.2186.b: "Keep scholarly hierarchy."
 tv_academy_debate.2186.d: "An artisan solves a practical problem that scholars have spent weeks dressing in Latin. When the tool chest is set on the table, several elegant commentaries suddenly look very heavy."
 tv_academy_debate.2186.t: "Artisan Knowledge"
 tv_academy_debate.2187.a: "Build the cabinet."
 tv_academy_debate.2187.b: "Keep old classifications."
 tv_academy_debate.2187.d: "Collectors propose a cabinet where shells, bones, seeds, and stones are arranged by observed likeness rather than inherited categories. The old labels still fit the drawers, which is precisely the problem."
 tv_academy_debate.2187.t: "Natural History Cabinet"
 tv_academy_debate.2188.a: "Open correspondence."
 tv_academy_debate.2188.b: "Restrict exchange."
 tv_academy_debate.2188.d: "Scientists ask to publish letters and results across borders before rivals do. What began as private ink now looks like a race to decide whether truth belongs to guarded rooms or to everyone quick enough to answer."
 tv_academy_debate.2188.t: "Open Correspondence"
 tv_academy_debate.2189.a: "Keep the footnote."
 tv_academy_debate.2189.b: "Remove it."
 tv_academy_debate.2189.d: "A revered authority is contradicted in a footnote so polite it feels cruel. The page says almost nothing loudly, which somehow makes every defender of inherited wisdom hear it."
 tv_academy_debate.2189.t: "Old Master Contradicted"
 tv_academy_debate.2190.a: "Hold it publicly."
 tv_academy_debate.2190.b: "Keep trials private."
 tv_academy_debate.2190.d: "The Chief Scientist wants a public experiment where failure would be impossible to hide. The proposal thrills the galleries and terrifies everyone who prefers uncertainty to have closed doors."
 tv_academy_debate.2190.t: "Public Demonstration"
 tv_academy_debate.2191.a: "Standardize measurement."
 tv_academy_debate.2191.b: "Accept local measures."
 tv_academy_debate.2191.d: "Researchers complain that every province measures nature with different tools and pride. The Academy realizes that a fact can travel only so far when every ruler, weight, and vessel speaks its own dialect."
 tv_academy_debate.2191.t: "Measurement Standard"
 tv_academy_debate.2192.a: "Record errors openly."
 tv_academy_debate.2192.b: "Preserve reputations."
 tv_academy_debate.2192.d: "Scholars propose studying errors as data, a suggestion that threatens many careers. Suddenly every failed calculation, cracked lens, and spoiled sample looks less like shame than like evidence with inconvenient timing."
 tv_academy_debate.2192.t: "Dissection of Error"
 tv_academy_debate.2193.a: "Build or fund it."
 tv_academy_debate.2193.b: "Use temporary observations."
 tv_academy_debate.2193.d: "Astronomers ask for a permanent observatory because the sky refuses to attend meetings indoors. A tower, instruments, and salaried watchers would turn scattered nights of argument into a standing discipline."
 tv_academy_debate.2193.t: "Royal Observatory"
 tv_academy_debate.2194.a: "Treat models as evidence."
 tv_academy_debate.2194.b: "Treat models as illustrations only."
 tv_academy_debate.2194.d: "A mechanic sets a model on the table and turns the crank. Gears translate an invisible process into motion, and the room leans forward before anyone remembers to look dignified."
 tv_academy_debate.2194.t: "Mechanic's Model"
 tv_academy_debate.2195.a: "Publish it."
 tv_academy_debate.2195.b: "Delay publication."
 tv_academy_debate.2195.d: "A treatise lies ready for the printer, sharp enough to overturn a doctrine and expensive enough to offend nearly everyone who funds the Academy. The pages are dry; only the courage is still wet."
 tv_academy_debate.2195.t: "Dangerous Publication"
 tv_academy_debate.2196.a: "Protect the assistants."
 tv_academy_debate.2196.b: "Require deference."
 tv_academy_debate.2196.d: "Assistants ask for protection if results contradict patrons, teachers, or the Crown's favorite theory. They are willing to measure honestly, but not to be ruined for noticing what the instruments say."
 tv_academy_debate.2196.t: "Experimental Oath"
 tv_academy_debate.2197.a: "Embrace the name."
 tv_academy_debate.2197.b: "Avoid naming it."
 tv_academy_debate.2197.d: "Someone gives the method a name, and suddenly a cluster of habits becomes a movement. Friends repeat it with relief, opponents with alarm, and undecided listeners with the dangerous feeling that history may need a label."
 tv_academy_debate.2197.t: "The New Method Named"
 tv_academy_world_debate_situation: "Academy World Debate"
 tv_academy_world_debate_situation_desc: "Countries with an Academy of Sciences enter the world debate stage around the same philosophy."
