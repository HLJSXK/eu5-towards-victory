 tv_trade_customs_union_law: "Customs Union"
 tv_trade_customs_union_law_desc: "The league harmonizes tariffs and ledgers, gaining smoother trade at the cost of local fiscal control."
 tv_trade_customs_ledgers_policy: "Shared Tariff Ledgers"
 tv_trade_customs_ledgers_policy_desc: "Ports exchange rates and exemptions, making trade easier while loosening local supervision."
 tv_trade_customs_bureau_policy: "League Customs Bureau"
 tv_trade_customs_bureau_policy_desc: "A permanent customs office enforces common ledgers, enlarging the same gains without adding new obligations."
 tv_trade_customs_code_policy: "Compulsory Tariff Code"
 tv_trade_customs_code_policy_desc: "The league imposes a binding tariff code, greatly improving trade while empowering merchant estates."

 tv_trade_maritime_convoys_law: "Maritime Convoys"
 tv_trade_maritime_convoys_law_desc: "The league organizes convoy protection for sea routes, trading sailors and naval upkeep for safer commerce."
 tv_trade_private_convoys_policy: "Licensed Private Convoys"
 tv_trade_private_convoys_policy_desc: "Private captains receive convoy letters, extending sea trade at the cost of sailors."
 tv_trade_league_escorts_policy: "League Escort Offices"
 tv_trade_league_escorts_policy_desc: "League offices coordinate escort schedules, expanding the same maritime benefits."
 tv_trade_armed_convoys_policy: "Armed Convoy Mandate"
 tv_trade_armed_convoys_policy_desc: "Armed convoys become compulsory, opening distant routes while straining sailors and naval budgets."

 tv_trade_merchant_courts_law: "Merchant Courts"
 tv_trade_merchant_courts_law_desc: "Commercial disputes move into shared courts, increasing merchant capacity and inland trade for administrative cost."
 tv_trade_arbitration_panels_policy: "Port Arbitration Panels"
 tv_trade_arbitration_panels_policy_desc: "Port panels settle contracts quickly, but require court spending."
 tv_trade_league_courts_policy: "League Merchant Courts"
 tv_trade_league_courts_policy_desc: "Standing merchant courts broaden the same commercial advantages without adding further costs."
 tv_trade_commercial_code_policy: "Binding Commercial Code"
 tv_trade_commercial_code_policy_desc: "A binding code greatly favors league commerce, though foreign diplomats dislike its hard edges."

 tv_trade_staple_monopolies_law: "Staple Monopolies"
 tv_trade_staple_monopolies_law_desc: "The league reserves key staple markets, raising trade-center strength and income while narrowing import flexibility."
 tv_trade_registered_staples_policy: "Registered Staple Markets"
 tv_trade_registered_staples_policy_desc: "Registered staples concentrate trade through approved markets, improving income but reducing import flexibility."
 tv_trade_league_staples_policy: "League Staple Charters"
 tv_trade_league_staples_policy_desc: "League charters deepen staple control, magnifying the same commercial gains."
 tv_trade_exclusive_staples_policy: "Exclusive Staple Rights"
 tv_trade_exclusive_staples_policy_desc: "Exclusive rights make staple markets formidable, but consumers and estates resent the squeeze."

 tv_trade_investment_code_law: "Investment Code"
 tv_trade_investment_code_law_desc: "The league formalizes overseas finance, making foreign construction cheaper while increasing bureaucracy."
 tv_trade_counting_house_loans_policy: "Counting-House Loans"
 tv_trade_counting_house_loans_policy_desc: "Merchant banks fund ventures abroad, improving production and foreign construction at bureaucratic cost."
 tv_trade_joint_stock_charters_policy: "Joint-Stock Charters"
 tv_trade_joint_stock_charters_policy_desc: "Joint-stock charters scale the same investment engine without expanding the administrative burden."
 tv_trade_permanent_factories_policy: "Permanent Foreign Factories"
 tv_trade_permanent_factories_policy_desc: "Permanent factories transform league investment abroad, but bureaucracy and local control both suffer."

