 tv_engineering_department.1678.t:0 "A Keeper for Peter's Tomb"
 tv_engineering_department.1678.d:0 "Before the threshold can open, a cardinal administrator, a diocesan bishop, a relic custodian, an alms prefect, and an artist canon must each be named to their office over the apostolic tomb."
 tv_engineering_department.1678.a:0 "Begin the naming of officials."
 tv_engineering_department.1679.t:0 "The Keys Are Offered"
 tv_engineering_department.1679.d:0 "Each office is tested: the administrator's ledgers, the bishop's discipline, the custodian's care of relics, the prefect's honesty with alms, and the canon's judgment over commissioned art."
 tv_engineering_department.1679.a:0 "Weigh how each official performs."
 tv_engineering_department.1680.t:0 "The First Scandal"
 tv_engineering_department.1680.d:0 "A missing relic, a misspent alms purse, or a factional bishop threatens to discredit the office before the dedication can proceed."
 tv_engineering_department.1680.a:0 "Investigate and discipline the office."
 tv_engineering_department.1680.b:0 "Overlook it for a narrower dedication."
 tv_engineering_department.1681.t:0 "The Sacred Office Confirmed"
 tv_engineering_department.1681.d:0 "The cardinal administrator, diocesan bishop, relic custodian, alms prefect, and artist canon are all confirmed in office over the apostolic tomb."
 tv_engineering_department.1681.a:0 "Confirm the sacred offices."
 tv_engineering_department.1682.t:0 "The Doors Behind the Keeper"
 tv_engineering_department.1682.d:0 "Behind the newly named officials, the relic inventory, alms ledger, pilgrim threshold, choir offices, and chapel patronage must all be organized before the basilica can serve its full apostolic charge."
 tv_engineering_department.1682.a:0 "Begin organizing the apostolic duties."
 tv_engineering_department.1683.t:0 "The Charge Is Divided"
 tv_engineering_department.1683.d:0 "Each duty is divided among clergy and lay staff: the relic inventory catalogued, the alms ledger balanced, the pilgrim threshold staffed, the choir offices scheduled, and the chapel patronage assigned."
 tv_engineering_department.1683.a:0 "Divide the duties among the staff."
 tv_engineering_department.1684.t:0 "Whispers Beneath the Dome"
 tv_engineering_department.1684.d:0 "A miscounted relic, an unbalanced ledger, or an idle choir office spreads whispers of neglect beneath the dome."
 tv_engineering_department.1684.a:0 "Correct the neglect and re-audit."
 tv_engineering_department.1684.b:0 "Quietly narrow that duty's scope."
 tv_engineering_department.1685.t:0 "The Apostolic Threshold Sealed"
 tv_engineering_department.1685.d:0 "The relic inventory, alms ledger, pilgrim threshold, choir offices, and chapel patronage are all in order, and the apostolic threshold is sealed under recognized clergy obligation."
 tv_engineering_department.1685.a:0 "Seal the apostolic threshold."
