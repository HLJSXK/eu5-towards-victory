 tv_engineering_department.1678.t:0 "A Keeper for Peter's Tomb"
 tv_engineering_department.1678.d:0 "The basilica doors, high altar, relic inventories, pilgrim hostels, and alms ledgers are prepared, but the threshold cannot open until a sacred official is named to keep the apostolic tomb."
 tv_engineering_department.1678.a:0 "Prepare to name the official."
 tv_engineering_department.1679.t:0 "The Keys Are Offered"
 tv_engineering_department.1679.d:0 "A Cardinal Administrator brings ledgers but risks the alms accounts. A Diocesan Bishop brings discipline but risks the choir offices. A Relic Custodian brings devotion but risks the pilgrim threshold. An Alms Prefect brings charity but risks chapel patronage. An Artist Canon brings splendor but risks the relic inventory."
 tv_engineering_department.1679.a:0 "Install the Cardinal Administrator."
 tv_engineering_department.1679.b:0 "Install the Diocesan Bishop."
 tv_engineering_department.1679.c:0 "Install the Relic Custodian."
 tv_engineering_department.1679.d:0 "Install the Alms Prefect."
 tv_engineering_department.1679.e:0 "Install the Artist Canon."
 tv_engineering_department.1680.t:0 "The First Scandal"
 tv_engineering_department.1680.d:0 "The office's own weakness has produced its first dispute. It can still be corrected in full, at a cost to the sponsor's own standing, or quietly overlooked for a narrower dedication."
 tv_engineering_department.1680.a:0 "Investigate and discipline the office. (-3 prestige)"
 tv_engineering_department.1680.b:0 "Overlook it for a narrower dedication."
 tv_engineering_department.1681.t:0 "The Apostolic Threshold Sealed"
 tv_engineering_department.1681.d:0 "The sacred official is confirmed in office, the apostolic service duties are all in order, and the threshold opens under recognized clergy obligation."
 tv_engineering_department.1681.a:0 "Seal the apostolic threshold."
