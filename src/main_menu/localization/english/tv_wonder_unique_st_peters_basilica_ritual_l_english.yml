 tv_engineering_department.5055.t:0 "A Keeper for Peter's Tomb"
 tv_engineering_department.5055.d:0 "The dome rises over the apostle's grave, but a basilica without a named guardian is only a monument. Before the threshold can open, Rome must choose who will answer for the tomb: a cardinal administrator to command with full authority, a diocesan bishop to anchor pastoral care, a relic custodian to guard the confession itself, an alms prefect to account for every offering, or an artist canon to keep the fabric's glory legible. Each candidate carries their own following, and the dome will remember whichever hand first holds the keys."
 tv_engineering_department.5055.a:0 "Open the search for Peter's keeper."
 tv_engineering_department.5056.t:0 "The Keys Are Offered"
 tv_engineering_department.5056.d:0 "Five hands reach for the same office. The cardinal administrator offers unmatched authority but answers first to the curia; the diocesan bishop offers pastoral legitimacy but limited command over relics and alms; the relic custodian offers unimpeachable care of the confession but little standing over clergy; the alms prefect offers transparent ledgers but a thin claim to sacred authority; the artist canon offers a basilica worthy of the dome but treats duty as decoration. Rome must weigh legitimacy, competence, and faction before the keys are pressed into any single palm."
 tv_engineering_department.5056.a:0 "Name the sacred official."
 tv_engineering_department.5057.t:0 "The First Scandal"
 tv_engineering_department.5057.d:0 "Whichever hand took the keys, that hand's weakness now shows. Relics go unaccounted, alms vanish into private accounts, pilgrims are turned from the threshold, or a patron's faction is caught treating the confession as a stage for its own ambitions. The dedication cannot proceed while the fault stands unanswered, but correcting it in full may cost the very authority Rome just bestowed."
 tv_engineering_department.5057.a:0 "Investigate and discipline the official."
 tv_engineering_department.5057.b:0 "Overlook the fault for a narrower dedication."
 tv_engineering_department.5058.t:0 "The Sacred Office Confirmed"
 tv_engineering_department.5058.d:0 "The scandal answered or absorbed, the keeper's authority survives its first test. Clergy, custodians, and the faithful now know who speaks for Peter's tomb, and the dedication can proceed on that name alone. Rome seals the office not as a courtesy title but as a working charge over the basilica's every sacred function."
 tv_engineering_department.5058.a:0 "Confirm the sacred official's charge."
 tv_engineering_department.7317.t:0 "The Doors Behind the Keeper"
 tv_engineering_department.7317.d:0 "An official now holds the keys, but keys alone do not run a basilica. Behind the high altar wait duties no single hand can perform unassisted: the relic inventory over the tomb, the alms ledger that funds the poor and the fabric alike, the pilgrim threshold that must judge who may approach, the choir offices that keep the hours sung, and the chapel patronage that lesser families still hope to claim. Rome must decide how these duties are divided before the basilica can call itself a working house of the apostle."
 tv_engineering_department.7317.a:0 "Open the register of apostolic duties."
 tv_engineering_department.7318.t:0 "The Charge Is Divided"
 tv_engineering_department.7318.d:0 "Under the sacred official's seal, the duties are entrusted one by one. Clerks are set over the relic inventory, sworn auditors take the alms ledger, gatekeepers are posted at the pilgrim threshold, cantors are assigned to the choir offices, and a chapel's patronage is granted or withheld from the families who petition for it. Each entrustment is a small charter in itself, and each can be honored or betrayed independently of the others."
 tv_engineering_department.7318.a:0 "Entrust the apostolic duties."
 tv_engineering_department.7319.t:0 "Whispers Beneath the Dome"
 tv_engineering_department.7319.d:0 "One of the entrusted duties falters under its own weight. The relic clerks cannot account for a reliquary, the alms ledger shows a suspicious gap, pilgrims complain of being turned away without cause, the choir offices fall into disorder, or a patron family is caught treating its chapel as a private fief. The basilica's claim to disciplined service is only as strong as the weakest duty left unanswered."
 tv_engineering_department.7319.a:0 "Discipline the lapse and restore the ledger."
 tv_engineering_department.7319.b:0 "Let the lapse stand and narrow the dedication's claim."
 tv_engineering_department.7320.t:0 "The Apostolic Threshold Sealed"
 tv_engineering_department.7320.d:0 "Relics accounted, alms recorded, pilgrims admitted in good order, the choir singing its hours, and every chapel's patronage settled, the basilica's duties close into a single working charter. Peter's tomb is no longer only a dome to be admired but a service the faithful can rely upon. Rome seals the threshold and lets the apostolic see stand open."
 tv_engineering_department.7320.a:0 "Seal the apostolic threshold."
