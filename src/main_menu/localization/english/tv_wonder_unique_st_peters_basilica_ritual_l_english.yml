 tv_engineering_department.1678.t:0 "The Chair Falls Vacant"
 tv_engineering_department.1678.d:0 "The tomb's threshold, high altar, and treasury stand ready, but the chair of the Archpriest has stood empty since the last tenure ended. The basilica cannot be dedicated to a living institution until the office is filled and, in time, refilled again."
 tv_engineering_department.1678.a:0 "Open the succession."
 tv_engineering_department.1679.t:0 "Filling the Chair"
 tv_engineering_department.1679.d:0 "Whenever the chair falls vacant, Rome must again decide how the office's standing passes to the next hand. A papal appointment keeps the office steady and unremarkable. A vote of the chapter's canons wins zeal and pace, at a political price and some loss of what came before. A kinsman installed as coadjutor compounds the office's authority fastest of all, at the cost of the clergy's goodwill."
 tv_engineering_department.1679.strong.d:0 "The chair's standing already commands wide recognition. Whoever fills it next inherits an office at the height of its authority, for better or worse."
 tv_engineering_department.1679.final_risk.d:0 "This is the last tenure before the office is sealed, and its standing so far has been modest at best. Whoever is named now carries the last real chance to lift the chair's authority before it is judged."
 tv_engineering_department.1679.a:0 "Appoint the Archpriest by papal decree."
 tv_engineering_department.1679.b:0 "Elect the Archpriest through the canons' chapter. (-2 prestige)"
 tv_engineering_department.1679.c:0 "Install a kinsman as coadjutor. (Clergy estate satisfaction cost)"
 tv_engineering_department.1680.t:0 "The Unbroken Chair"
 tv_engineering_department.1680.d:0 "Three tenures of the Archpriest's chair have passed, each shaped by how its authority was handed to the next. What the office accumulated across appointment, election, and patronage alike is now sealed into the basilica's permanent standing."
 tv_engineering_department.1680.a:0 "Seal the apostolic succession."
