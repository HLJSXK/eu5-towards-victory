 # ── Regional Governor random events ────────────────────────────────────────
 tv_govhouse.100.t: "[tv_local_governor|E]：Private Toll Stations"
 tv_govhouse.100.d: "[SCOPE.sCharacter('tv_gov_event_governor').GetShortNameWithNoTooltip] has raised temporary tax barriers along the roads and ports around [SCOPE.sLocation('tv_gov_event_location').GetName], claiming they are needed to cover local expenses. Merchants protest that every cart and hull is being taxed twice, while local nobles welcome anything that shields their markets from outsiders. The [tv_govhouse|E] ledger looks healthier, but every new coin reminds the capital that distant officials are learning to interpret the law for themselves."
 tv_govhouse.100.a: "Permit the temporary tolls."
 tv_govhouse.100.b: "Send inspectors to dismantle them."

 tv_govhouse.101.t: "[tv_local_governor|E]：Colonial Merchant Riot"
 tv_govhouse.101.d: "[SCOPE.sCharacter('tv_gov_event_governor').GetShortNameWithNoTooltip] has ordered merchants near [SCOPE.sLocation('tv_gov_event_location').GetName] to trade only through a chartered company. The port has gone quiet, tax collectors wait beside empty quays, and several captains now hire armed escorts while insisting they are merely protecting their goods. Monopoly makes revenue easier to count, and teaches local capital how powerful collective resistance can be."
 tv_govhouse.101.a: "Force the port open."
 tv_govhouse.101.b: "Concede limited free trade."

 tv_govhouse.102.t: "[tv_local_governor|E]：Gifts from Indigenous Envoys"
 tv_govhouse.102.d: "Envoys from communities near [SCOPE.sLocation('tv_gov_event_location').GetName] have brought gifts to [SCOPE.sCharacter('tv_gov_event_governor').GetShortNameWithNoTooltip]. They ask for protection, exchange, and rituals both sides can understand, not abstract law written in a faraway court. Our answer will decide whether the frontier remembers this meeting as an alliance or a warning."
 tv_govhouse.102.a: "Accept tribute and offer protection."
 tv_govhouse.102.b: "Trade gifts for guides and intelligence."

 tv_govhouse.103.t: "[tv_local_governor|E]：A Governor's Marriage Alliance"
 tv_govhouse.103.d: "[SCOPE.sCharacter('tv_gov_event_governor').GetShortNameWithNoTooltip]'s family has arranged a marriage with a powerful house near [SCOPE.sLocation('tv_gov_event_location').GetName]. Local elites are already gathering around the governor, and the wedding speeches treat empire, family, and land as one interest. At court, another meaning is plain enough: an appointed official is being adopted by the society they were sent to govern."
 tv_govhouse.103.a: "Recognize the marriage."
 tv_govhouse.103.b: "Require central registration."

 tv_govhouse.104.t: "[tv_local_governor|E]：Pirates Raid the Coast"
 tv_govhouse.104.d: "Pirates have struck shipping off [SCOPE.sLocation('tv_gov_event_location').GetName], and surviving vessels return with burned spars and contradictory testimony. [SCOPE.sCharacter('tv_gov_event_governor').GetShortNameWithNoTooltip] requests ships and soldiers, yet reports also claim the governor's clerks are speaking quietly with pirate captains. On frontier seas, smugglers, privateers, and lawful traders are often separated by a single permit."
 tv_govhouse.104.a: "Suppress the pirates."
 tv_govhouse.104.b: "Let the governor recruit them quietly."

 tv_govhouse.105.t: "[tv_local_governor|E]：Secret Local Recruitment"
 tv_govhouse.105.d: "[SCOPE.sCharacter('tv_gov_event_governor').GetShortNameWithNoTooltip] argues that central support is too slow and has begun recruiting soldiers around [SCOPE.sLocation('tv_gov_event_location').GetName]. The roads are safer, but the payroll is opaque, and local magnates are sending their own young men into the force. If the capital approves, the frontier grows safer; if it does not, safety itself may become the governor's private asset."
 tv_govhouse.105.a: "Recognize the new troops."
 tv_govhouse.105.b: "Order the private force reduced."

 tv_govhouse.106.t: "[tv_local_governor|E]：Missionaries and Soldiers Clash"
 tv_govhouse.106.d: "Missionaries have publicly accused [SCOPE.sCharacter('tv_gov_event_governor').GetShortNameWithNoTooltip] of allowing the garrison to seize grain around [SCOPE.sLocation('tv_gov_event_location').GetName]. The soldiers answer that order will collapse faster than theology if the army goes hungry. Religion and administration are not natural allies on the frontier; they are merely walking the same road for now."
 tv_govhouse.106.a: "Back the missionaries."
 tv_govhouse.106.b: "Back the garrison requisitions."

 tv_govhouse.107.t: "[tv_local_governor|E]：Gold Veins Discovered"
 tv_govhouse.107.d: "An expedition has found gold-bearing rock near [SCOPE.sLocation('tv_gov_event_location').GetName]. The news travels faster than paperwork, drawing settlers, merchants, gamblers, and craftsmen down the roads. [SCOPE.sCharacter('tv_gov_event_governor').GetShortNameWithNoTooltip] asks for mining rules before the wealth reaches every pocket except the treasury."
 tv_govhouse.107.a: "Establish mining order."

 tv_govhouse.108.t: "[tv_local_governor|E]：The Governor Falls Silent"
 tv_govhouse.108.d: "War, shipwreck, or simple weather has cut off contact with [SCOPE.sCharacter('tv_gov_event_governor').GetShortNameWithNoTooltip]. The last letter from [SCOPE.sLocation('tv_gov_event_location').GetName] is already stale, and local clerks, officers, and merchants are governing by necessity. When a premodern empire's orders arrive too late, the absence itself begins to harden into an institution."
 tv_govhouse.108.a: "Let local officials govern for now."

 tv_govhouse.109.t: "[tv_local_governor|E]：Frontier Plague"
 tv_govhouse.109.d: "Disease has entered [SCOPE.sLocation('tv_gov_event_location').GetName] by trade, troop movement, or both. [SCOPE.sCharacter('tv_gov_event_governor').GetShortNameWithNoTooltip] orders quarantine, caravans halt at barriers, and prayers rise alongside accusations. People soon decide that plague is no accident, but a sign of foreign rule and gubernatorial failure."
 tv_govhouse.109.a: "Quarantine the infected districts."

 tv_govhouse.110.t: "[tv_local_governor|E]：Military Funds Diverted"
 tv_govhouse.110.d: "Funds assigned to the garrison near [SCOPE.sLocation('tv_gov_event_location').GetName] have been traced to private works sponsored by [SCOPE.sCharacter('tv_gov_event_governor').GetShortNameWithNoTooltip]. Soldiers are unpaid, discipline is fraying, and patrols are demanding compensation from nearby settlements. The danger of distant fiscal oversight is not that accounts can be falsified; it is that order may collapse before the truth arrives."
 tv_govhouse.110.a: "Audit the military accounts."

 tv_govhouse.111.t: "[tv_local_governor|E]：Settlers and Locals Fight"
 tv_govhouse.111.d: "A dispute over land, water, and trade near [SCOPE.sLocation('tv_gov_event_location').GetName] has turned violent. Settlers demand protection for their improvements, while local residents insist that old boundaries are being erased piece by piece. Whatever [SCOPE.sCharacter('tv_gov_event_governor').GetShortNameWithNoTooltip] decides, the losing side will remember this judgement for years."
 tv_govhouse.111.a: "Support settler self-defense."
 tv_govhouse.111.b: "Force both sides to pay compensation."

 tv_govhouse.112.t: "[tv_local_governor|E]：A Grand Provincial Celebration"
 tv_govhouse.112.d: "[SCOPE.sCharacter('tv_gov_event_governor').GetShortNameWithNoTooltip] plans a great parade and celebration in [SCOPE.sLocation('tv_gov_event_location').GetName], full of banners, music, soldiers, and gifts. Local elites are ready to attend, while common people count the food, labor, and taxes such spectacle will consume. Premodern authority must be seen, but visibility is never cheap."
 tv_govhouse.112.a: "Let the celebration be magnificent."
 tv_govhouse.112.b: "Cut the ceremonial expense."

 tv_govhouse.113.t: "[tv_local_governor|E]：A New Frontier Faith"
 tv_govhouse.113.d: "Around [SCOPE.sLocation('tv_gov_event_location').GetName], missionary phrases, local stories, and merchants' rites have blended into a new religious current. Its followers call it mutual understanding between old and new powers; traditional authorities call it dangerous heresy. [SCOPE.sCharacter('tv_gov_event_governor').GetShortNameWithNoTooltip] must decide whether this frontier synthesis is a bridge or a crack."
 tv_govhouse.113.a: "Tolerate the new teaching for now."
 tv_govhouse.113.b: "Declare it heresy."

 tv_govhouse.114.t: "[tv_local_governor|E]：The Garrison Acclaims the Governor"
 tv_govhouse.114.d: "The garrison at [SCOPE.sLocation('tv_gov_event_location').GetName] has sworn public loyalty to [SCOPE.sCharacter('tv_gov_event_governor').GetShortNameWithNoTooltip], arguing that the governor protects pay, land, and honor better than a distant court. The banners still name the state, but the soldiers are looking at a person. If we do not act, frontier security may become the cloak of semi-independent power."
 tv_govhouse.114.a: "Reaffirm that the army serves the state."

 tv_govhouse.115.t: "[tv_local_governor|E]：Chartered Company Demands Autonomy"
 tv_govhouse.115.d: "The company handling trade around [SCOPE.sLocation('tv_gov_event_location').GetName] accuses [SCOPE.sCharacter('tv_gov_event_governor').GetShortNameWithNoTooltip] of obstructing profit and demands judicial, fiscal, and even military rights. Its representatives promise prosperity if commercial judgement is allowed to move faster than bureaucracy. Granting this will give the empire trade, and a new political actor that knows how to bargain."
 tv_govhouse.115.a: "Grant commercial privileges."
 tv_govhouse.115.b: "Permit harbor autonomy only."

 tv_govhouse.116.t: "[tv_local_governor|E]：Settler Fleet Arrives"
 tv_govhouse.116.d: "A fleet carrying poor families, debtors, and adventurers has arrived at [SCOPE.sLocation('tv_gov_event_location').GetName]. [SCOPE.sCharacter('tv_gov_event_governor').GetShortNameWithNoTooltip] requests land, seed, and tools so the newcomers can quickly become taxpayers and militia. Frontiers do not expand by conquest alone, but also by those willing to wager their future on strange soil."
 tv_govhouse.116.a: "Distribute land and supplies."

 tv_govhouse.117.t: "[tv_local_governor|E]：Ancient Ruins on the Frontier"
 tv_govhouse.117.d: "Road workers near [SCOPE.sLocation('tv_gov_event_location').GetName] have uncovered old inscriptions and buried chambers. Scholars want surveys, missionaries want proof of providence, and officers care mostly about rumored treasure. [SCOPE.sCharacter('tv_gov_event_governor').GetShortNameWithNoTooltip] asks how to proceed. The ruins are silent, but every interpretation will shape frontier memory."
 tv_govhouse.117.a: "Fund scholarly surveys."
 tv_govhouse.117.b: "Fold the ruins into imperial myth."

 tv_govhouse.118.t: "[tv_local_governor|E]：Governor Refuses a New Decree"
 tv_govhouse.118.d: "After a new central law reached [SCOPE.sLocation('tv_gov_event_location').GetName], [SCOPE.sCharacter('tv_gov_event_governor').GetShortNameWithNoTooltip] delayed enforcement, claiming the text misunderstands local conditions. Local elites support the delay, and common people prefer familiar rules. Distant governors often hold the practical right of interpretation; once stable, interpretation becomes autonomous tradition."
 tv_govhouse.118.a: "Allow local interpretation."
 tv_govhouse.118.b: "Order immediate enforcement."

 tv_govhouse.119.t: "[tv_local_governor|E]：A Frontier Hero Rises"
 tv_govhouse.119.d: "An officer, explorer, or merchant has won sudden fame near [SCOPE.sLocation('tv_gov_event_location').GetName]. People say this figure understands the frontier better than [SCOPE.sCharacter('tv_gov_event_governor').GetShortNameWithNoTooltip], and taverns are already embroidering the story. A hero can become the state's banner or the core of a local faction; what matters is who gives them a place first."
 tv_govhouse.119.a: "Bring the hero into the system."
 tv_govhouse.119.b: "Let the governor suppress the legend."

