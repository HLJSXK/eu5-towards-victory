 tv_govhouse.40.t: "[tv_war_tent|E]：A Tactic from the War Tent"
 tv_govhouse.40.d: "The [tv_grand_general|E] has laid a new tactical proposal before the [tv_war_tent|e]. Maps have been pinned, officers have stopped pretending not to favor their own schools of war, and the current campaign waits for a single approved idea to become doctrine. Approving the proposal will make the tactic active for the current war; rejecting it keeps the current approach unchanged. The choice is not merely technical. It tells every army in the field what kind of risk the center is willing to bless."
 tv_govhouse.40.a: "Approve Steady Advance."
 tv_govhouse.40.b: "Approve Careful Advance."
 tv_govhouse.40.c: "Approve Rapid Advance."
 tv_govhouse.40.e: "Approve Ambush."
 tv_govhouse.40.f: "Approve Surprise Attack."
 tv_govhouse.40.g: "Approve Guerrilla Tactics."
 tv_govhouse.40.h: "Approve Besiege and Reinforce."
 tv_govhouse.40.j: "Approve Capital Raid."
 tv_govhouse.40.k: "Approve Defensive Counterattack."
 tv_govhouse.40.l: "Approve Forced March."
 tv_govhouse.40.m: "Approve Encirclement."
 tv_govhouse.40.i: "Reject the proposal."
 tv_govhouse.41.t: "[tv_war_tent|E]：Offensive Plan Engaged"
 tv_govhouse.41.d: "War has begun against the target named in our offensive [tv_war_plan|e]. The [tv_war_tent|E] turns months of preparation into siege timetables, marching routes, supply expectations, and stricter command discipline. Officers who once called the plan theoretical now discover that theory has boots. Every accumulated point of progress becomes an instruction carried toward the front. The campaign begins with less improvisation than our enemies may hope."
 tv_govhouse.41.a: "Put the plan into motion."
 tv_govhouse.42.t: "[tv_war_tent|E]：Defensive Plan Engaged"
 tv_govhouse.42.d: "We are now fighting a defensive war. The [tv_war_tent|E] unfolds its prepared [tv_war_plan|e]: fort ledgers, reserve routes, fallback lines, and battlefield doctrine written before panic had a chance to hold the pen. What looked cautious in peacetime now looks like foresight. Garrisons receive clearer orders, commanders recognize their assigned ground, and the enemy meets not scattered fear but rehearsed resistance. Defense, when prepared, has a memory."
 tv_govhouse.42.a: "Put the plan into motion."

