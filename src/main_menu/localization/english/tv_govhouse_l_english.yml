 # ── Training outcome events ──────────────────────────────────────────────────
 tv_grand_general.1.t: "[tv_grand_general|E]：A General Honed"
 tv_grand_general.1.d: "The rigorous training regimen has borne fruit. Our [tv_grand_general|E] emerges from the yard sharper, stronger, and more tactically astute than before. Officers who expected ritual drill instead found forced marches, map exercises, night alarms, and arguments conducted over muddy tables. The body has been tested, but so has judgment. The [tv_govhouse|e] now commands a mind more willing to turn hardship into method. Every campaign after this will inherit the discipline of the training ground."
 tv_grand_general.1.a: "Let the next campaign learn from the yard."

 tv_grand_general.2.t: "[tv_grand_general|E]：Peerless Under Heaven"
 tv_grand_general.2.d: "There is nothing more our [tv_grand_general|E] can learn from training. Every drill has become rehearsal, every test a confirmation, every objection another chance to prove mastery already achieved. Their military genius has reached its pinnacle, and even the instructors now sound like witnesses rather than teachers. This mastery flows upward, inspiring the ruler to new heights of strategic vision. A realm can be governed by many talents, but it is altered by a mind that makes war feel legible."
 tv_grand_general.2.a: "Our realm commands the greatest military mind of the age."

 tv_grand_general.3.t: "[tv_grand_general|E]：A Path of Mastery"
 tv_grand_general.3.d: "The training has honed our [tv_grand_general|E]'s skills to a fine edge. The staff can see it in the way they read terrain, correct captains, and grow impatient with vague courage. A new military discipline now opens before them, not as a lesson but as a calling that will shape every future order. The [tv_govhouse|e] waits for the choice, because institutions become different under different kinds of genius. Choose the path they shall walk."
 tv_grand_general.3.a: "Pursue the Offensive Path (进攻)."
 tv_grand_general.3.b: "Pursue the Defensive Path (防御)."
 tv_grand_general.3.c: "Pursue the Tactical Path (战术)."

 tv_grand_general.4.t: "[tv_grand_general|E]：Forged in a Hundred Battles"
 tv_grand_general.4.d: "Every path of military mastery has been walked to its end. Our [tv_grand_general|E] has studied attack, defense, maneuver, patience, violence, supply, and the harder art of knowing which one matters now. There is nothing left to teach them of war as a system, but skill still lives in the person who must decide under rain, smoke, hunger, and fear. The [tv_war_tent|e] has gained a commander whose education is complete but whose edge can still be sharpened. That is a rare and dangerous blessing."
 tv_grand_general.4.a: "The realm is fortunate to command such a warrior."

 tv_grand_general.5.t: "[tv_grand_general|E]：Peerless Under Heaven"
 tv_grand_general.5.d: "Our [tv_grand_general|E] has transcended the limits of both skill and technique. They no longer merely apply doctrine; they make doctrine look like a slow description of decisions already made. There is no greater military mind alive, and everyone in the [tv_war_tent|e] knows it even when pride prevents confession. This perfection now elevates even the ruler, who cannot stand near such clarity without seeing farther. The realm has acquired not only a commander, but a standard by which command itself will be judged."
 tv_grand_general.5.a: "Our realm commands the greatest military mind of the age."

 tv_grand_general.6.t: "[tv_grand_general|E]：Wounded in Training"
 tv_grand_general.6.d: "An accident during training has left our [tv_grand_general|E] with a lasting injury. The yard went silent faster than any command could have made it, and even hardened officers looked away while the physicians worked. They carry the wound with stoic resolve, turning pain into another kind of discipline. Yet the body keeps its own ledger. If training continues without care, this mark may one day demand payment in full."
 tv_grand_general.6.a: "We shall pray for a swift recovery."

 tv_grand_general.7.t: "[tv_grand_general|E]：Old Wounds Reopened"
 tv_grand_general.7.d: "The rigors of training have proven too much. The old injury tore open again under strain, and this time no physician, prayer, or shouted order could close it. Our [tv_grand_general|E] died on the training grounds, among maps, weapons, and the discipline that had once made them formidable. The [tv_govhouse|e] loses more than an officer; it loses the person around whom military obedience had organized itself. The yard will be cleaned, but it will not feel ordinary for a long time."
 tv_grand_general.7.a: "A heavy loss. We shall find a worthy successor."

 tv_grand_general.8.t: "[tv_grand_general|E]：A General Lost"
 tv_grand_general.8.d: "Fate is cruel. An accident during training has taken our [tv_grand_general|E] from us before their potential could be fully realized. One moment the yard was a place of improvement; the next it was a court of stunned witnesses. Plans that assumed their future command now look suddenly foolish, as if ink itself had overreached. The [tv_war_tent|e] must learn to speak without the voice it expected to hear. What might have been is now a military secret no one can use."
 tv_grand_general.8.a: "We shall honour their memory and continue."

 tv_grand_general.9.t: "[tv_grand_general|E]: A Cold Dispatch"
 tv_grand_general.9.d: "A dispatch from the [tv_grand_general|E] reaches the court with every courtesy intact and every warmth removed. The orders are correct, the requests are reasonable, and the silence between the lines is unmistakable. Some slight, delay, or private calculation has cooled their loyalty to the Crown."
 tv_grand_general.9.a: "Trust thins by small degrees."

 tv_grand_general.10.t: "[tv_grand_general|E]: Shared Purpose"
 tv_grand_general.10.d: "The [tv_grand_general|E] has answered a difficult request without bargaining for advantage. Officers report that the command tent speaks of the Crown with unusual steadiness, and even rival ministers admit that obedience can still be made honorable."
 tv_grand_general.10.a: "Let that confidence be remembered."

 tv_grand_general.11.t: "[tv_grand_general|E]: A Reward Expected"
 tv_grand_general.11.d: "The [tv_grand_general|E] asks for a visible reward: pay for retainers, gifts for officers, and enough royal favor to prove that service is noticed. The sum is not ruinous, but refusal would be read less as thrift than as distrust."
 tv_grand_general.11.a: "Pay the reward."
 tv_grand_general.11.b: "Refuse the demand."

 # ── Governor death event ────────────────────────────────────────────────────
 tv_govhouse.1.t: "[tv_local_governor|E]：A Governor Has Died"
 tv_govhouse.1.d: "One of our [tv_local_governor|E]s has died. Letters from the governed region already arrive in a different tone, as local clerks, soldiers, merchants, and petitioners test how much authority remains when the appointed hand is gone. Until a new governor is assigned, the region no longer receives [tv_govhouse|E] bonuses. Frontier rule is rarely an abstraction for long; it has names, habits, enemies, and rooms where people wait for orders. One of those rooms is now empty."
 tv_govhouse.1.a: "We must appoint a replacement."

 tv_govhouse.2.t: "[tv_grand_general|E]：The Grand General Has Died"
 tv_govhouse.2.d: "Our [tv_grand_general|E] has died. The news reaches the [tv_govhouse|e] as both a personal loss and an institutional alarm, because command does not pause merely because a commander has fallen. Officers lower their voices, governors wonder which petitions should wait, and the [tv_war_tent|e] feels suddenly too large. Until a successor is appointed, the realm will lack its supreme military commander. Empty authority invites questions, and questions travel quickly through conquered lands."
 tv_govhouse.2.a: "We must appoint a successor."

 # ── Balance-of-power backlash events ───────────────────────────────────────
 tv_govhouse.10.t: "[tv_govhouse_power_balance|E]：Murmurs in the District"
 tv_govhouse.10.d: "A district under the [tv_govhouse|E] has found its daily petitions rerouted through military clerks and quartermasters. Market disputes now wait beside fodder inventories, marriage complaints beside road watches, and every answer returns with the same clipped hand. The people know exactly whose seal now matters. Local elders still bow to the civil magistrate, but they glance over his shoulder before they speak. The [tv_grand_general|E] has not seized the district, yet the district has begun to behave as if seizure already happened. That is how authority first changes shape: not with trumpets, but with forms.\n\n#R WARNING: This event appeared because your [tv_grand_general|E] controls at least 25% of the [tv_govhouse_power_balance|E].#!"
 tv_govhouse.10.a: "Let the district learn which seal answers."
 tv_govhouse.10.b: "Buy enough quiet for the streets."

 tv_govhouse.11.t: "[tv_govhouse_power_balance|E]：Seal and Sword"
 tv_govhouse.11.d: "Orders drafted in the palace now return with soldiers' annotations. Some corrections concern roads and supplies, but others concern who may command whom, and that ink is harder to ignore. The scribes pretend the notes are practical improvements. The ministers pretend not to notice that every practical improvement narrows their own room to act. To insist on the old chain of authority would cost the realm more than dignity. The sword has not broken the seal, but it has learned to lean on it.\n\n#R WARNING: This event appeared because your [tv_grand_general|E] controls at least 25% of the [tv_govhouse_power_balance|E].#!"
 tv_govhouse.11.a: "Let the sword write in the margin."
 tv_govhouse.11.b: "Make the rebuke public enough to hurt."

 tv_govhouse.12.t: "[tv_govhouse_power_balance|E]：Noble Coldness"
 tv_govhouse.12.d: "Noble houses mutter that the [tv_govhouse|E] treats old privilege as another supply ledger. At their tables, the wine is poured with ceremony and the insults are poured more carefully still. Younger heirs ask whether lineage now matters less than a horse count. Older lords answer by sending fewer men, fewer letters, and fewer sincere smiles. Their banquets grow colder and their promises thinner. The court can ignore the chill, but frost has a talent for spreading through stone.\n\n#R WARNING: This event appeared because your [tv_grand_general|E] controls at least 25% of the [tv_govhouse_power_balance|E].#!"
 tv_govhouse.12.a: "Let the great houses sulk behind silver cups."
 tv_govhouse.12.b: "Remind them that blood still has a chair."

 tv_govhouse.13.t: "[tv_govhouse_power_balance|E]：The Interrupted Inquiry"
 tv_govhouse.13.d: "Scholars report that archives, instruments, and correspondence have been requisitioned for military administration. A cabinet of maps has become a marching index, and a set of lenses now measures powder stores instead of stars. The assistants complain softly, because soldiers with polite orders are still soldiers. No one calls this hostility to learning; they call it necessity, which is necessity's favorite disguise. Research must wait for marching orders. The [tv_govhouse|E] has borrowed the mind of the realm and promised to return it later.\n\n#R WARNING: This event appeared because your [tv_grand_general|E] controls at least 25% of the [tv_govhouse_power_balance|E].#!"
 tv_govhouse.13.a: "Let the notebooks march with the wagons."
 tv_govhouse.13.b: "Keep the inquiry alive with capital wealth."

 tv_govhouse.20.t: "[tv_govhouse_power_balance|E]：A Province Turns Sour"
 tv_govhouse.20.d: "A whole province now feels the [tv_govhouse|E] pressing through tax rolls, patrols, and forced cooperation. One town complains of requisitioned grain, another of soldiers sleeping in civic halls, a third of judges waiting for military countersignature. None of these grievances is large enough to be called rebellion. Together, they are large enough to change the sound of every marketplace. What began as irritation has spread from town to town. The province has not risen, but it has stopped believing patience is rewarded.\n\n#R WARNING: This event appeared because your [tv_grand_general|E] controls at least 50% of the [tv_govhouse_power_balance|E].#!"
 tv_govhouse.20.a: "Let the province swallow its bitterness."
 tv_govhouse.20.b: "Pay for reconciliation before it learns a harder name."

 tv_govhouse.21.t: "[tv_govhouse_power_balance|E]：A Writ Overruled"
 tv_govhouse.21.d: "The [tv_grand_general|E]'s staff has quietly countermanded a royal writ. The parchment still bears the ruler's name, but the order beneath it has been made conditional, delayed, and finally made irrelevant. Courtiers study the contradiction as if staring long enough might turn it into procedure. Provincial officers have already learned the lesson and begun asking the [tv_war_tent|E] which commands truly matter. Pretending this is ordinary administration will cost legitimacy. Confronting it will shake the realm because everyone now knows there is something to confront.\n\n#R WARNING: This event appeared because your [tv_grand_general|E] controls at least 50% of the [tv_govhouse_power_balance|E].#!"
 tv_govhouse.21.a: "Let the writ die quietly in its folder."
 tv_govhouse.21.b: "Read a public decree loudly enough to steady the realm."

 tv_govhouse.22.t: "[tv_govhouse_power_balance|E]：Nobles Withdraw"
 tv_govhouse.22.d: "The nobility no longer complains in whispers. Hunting parties become councils, councils become accusations, and every old family suddenly remembers an older right. They withhold cooperation from the [tv_govhouse|E] with the elegance of people who call obstruction tradition. Even loyal houses ask whether obedience to soldiers diminishes their birth. The demand is simple: prove aristocratic rank still matters. If the court refuses, noble silence may become more expensive than noble fury.\n\n#R WARNING: This event appeared because your [tv_grand_general|E] controls at least 50% of the [tv_govhouse_power_balance|E].#!"
 tv_govhouse.22.a: "Let their heraldry freeze on the wall."
 tv_govhouse.22.b: "Give precedence back its old perfume."

 tv_govhouse.23.t: "[tv_govhouse_power_balance|E]：Notes Confiscated"
 tv_govhouse.23.d: "Research notes have been seized as if they were campaign plans. Marginalia, diagrams, and unfinished calculations now sit under lock beside lists of horses and powder. The officers say knowledge must serve security. The scholars reply, very carefully, that security rarely recognizes knowledge before it has gagged it. Learned men now ask whether the court values discovery or obedience. A country can make a laboratory afraid, but fear is a poor assistant.\n\n#R WARNING: This event appeared because your [tv_grand_general|E] controls at least 50% of the [tv_govhouse_power_balance|E].#!"
 tv_govhouse.23.a: "Let the work wait behind the lock."
 tv_govhouse.23.b: "Spend capital prosperity to keep the lamps lit."

 tv_govhouse.24.t: "[tv_govhouse_power_balance|E]：A Gallery Put to the Torch"
 tv_govhouse.24.d: "A work of art has become a token in the struggle over prestige. Officers close to the [tv_govhouse|E] call it a useless luxury kept alive by vain patrons. The court calls it memory, devotion, and proof that power can preserve more than roads and rations. Servants move through the gallery with buckets, blankets, and the miserable caution of people who know beauty is flammable. The [tv_grand_general|E] has not ordered a bonfire, but their ascendancy has made one thinkable. If the work burns, the smoke will smell of more than paint.\n\n#R WARNING: This event appeared because your [tv_grand_general|E] controls at least 50% of the [tv_govhouse_power_balance|E].#!"
 tv_govhouse.24.a: "Let the canvas become smoke."
 tv_govhouse.24.b: "Spend prestige to make the gallery untouchable."

 tv_govhouse.25.t: "[tv_govhouse_power_balance|E]：A Studio Falls Silent"
 tv_govhouse.25.d: "An artist has angered officers close to the [tv_grand_general|E]. Perhaps the insult was deliberate, perhaps a careless sketch found the wrong eyes, or perhaps power simply dislikes mirrors. The studio has fallen silent except for the scraping of hurriedly covered work. Protecting the artist now means finding a more valuable life to place in the path of blame. Everyone understands the exchange before anyone names it. The [tv_govhouse|E] has made art political enough to become dangerous.\n\n#R WARNING: This event appeared because your [tv_grand_general|E] controls at least 50% of the [tv_govhouse_power_balance|E].#!"
 tv_govhouse.25.a: "Close the studio and call it prudence."
 tv_govhouse.25.b: "Put a minister between the brush and the blade."

 tv_govhouse.30.t: "[tv_govhouse_power_balance|E]：An Area Refuses the House"
 tv_govhouse.30.d: "Across an entire area, local patience collapses at once. Villages that never agreed on boundaries now agree on resentment, and towns that competed for favor now trade complaints like coin. The [tv_govhouse|E] has become the face of every order, tax, and humiliation. Even routine patrols are greeted as proof that no one in the capital listens unless boots are involved. The anger is not yet organized, which makes it easier to dismiss and harder to measure. An area does not refuse loudly at first; it begins by refusing to believe.\n\n#R WARNING: This event appeared because your [tv_grand_general|E] controls at least 75% of the [tv_govhouse_power_balance|E].#!"
 tv_govhouse.30.a: "Let disbelief settle into the soil."
 tv_govhouse.30.b: "Drown the grievance in paid pacification."

 tv_govhouse.31.t: "[tv_govhouse_power_balance|E]：The State Bows"
 tv_govhouse.31.d: "Courtiers now ask permission where they once gave orders. The [tv_grand_general|E]'s authority has become a second constitution written in command seals. Ministers still sit in their appointed chairs, but the room leans toward the military desk before debate begins. Servants carry documents by instinct to the office most likely to answer. The ruler may still speak first, yet everyone waits to hear who speaks last. A state can bow so gradually that it mistakes the motion for balance.\n\n#R WARNING: This event appeared because your [tv_grand_general|E] controls at least 75% of the [tv_govhouse_power_balance|E].#!"
 tv_govhouse.31.a: "Let the state bend until it calls bending order."
 tv_govhouse.31.b: "Spend stability to make refusal audible."

 tv_govhouse.32.t: "[tv_govhouse_power_balance|E]：The Nobles Close Ranks"
 tv_govhouse.32.d: "Great houses form a defensive circle around their privileges. They send cousins instead of heirs, compliments instead of commitments, and ceremonial gifts chosen to remind us of older bargains. They will not be ruled by soldiers unless the court openly restores aristocratic weight. The [tv_grand_general|E] can command obedience, but noble cooperation has always lived in softer places. Every closed rank makes the realm feel less like a hierarchy and more like a negotiation with knives hidden under lace. The court must decide whether to bruise pride or feed it.\n\n#R WARNING: This event appeared because your [tv_grand_general|E] controls at least 75% of the [tv_govhouse_power_balance|E].#!"
 tv_govhouse.32.a: "Let noble satisfaction collapse behind polite bows."
 tv_govhouse.32.b: "Put more weight back into aristocratic hands."

 tv_govhouse.33.t: "[tv_govhouse_power_balance|E]：A Season of Empty Desks"
 tv_govhouse.33.d: "The scholars' desks sit empty while clerks drag their work into military stores. Drafts are bundled with requisitions, specimens are packed beside spare buckles, and correspondence is delayed until it has been made useful to command. Whole months of thought vanish into the machinery of control. The [tv_academy_of_sciences|E] can protest, but protest is slow and orders are fast. Students learn that silence is safer than curiosity. A season lost to obedience may take years to replace.\n\n#R WARNING: This event appeared because your [tv_grand_general|E] controls at least 75% of the [tv_govhouse_power_balance|E].#!"
 tv_govhouse.33.a: "Let research grow thin in the shadow of command."
 tv_govhouse.33.b: "Drain the capital so thought survives the season."

 tv_govhouse.34.t: "[tv_govhouse_power_balance|E]：The Cabinet Under the Sword"
 tv_govhouse.34.d: "The cabinet has become an obstacle to the [tv_grand_general|E]'s command. Its members argue, delay, and cling to the old comfort that advice can restrain power. By nightfall, messengers carry proposals that sound less like reform than removal. By morning, either the ministers will be gone, or the ruler must prove obedience in a more personal way. The chamber smells of wax, sweat, and decisions no loyal subject should have to witness. When the sword enters government, even survival begins to look like surrender.\n\n#R WARNING: This event appeared because your [tv_grand_general|E] controls at least 75% of the [tv_govhouse_power_balance|E].#!"
 tv_govhouse.34.a: "Let the cabinet fall silent by morning."
 tv_govhouse.34.b: "Make the ruler pay what the ministers cannot."

 # ── Grand General traits ─────────────────────────────────────────────────────
 # Offense path (进攻)
 tv_gg_offense_1: "Aggressive Commander I"
 tv_gg_offense_1_desc: "This general favours bold offensives, driving their troops forward with relentless discipline and fire."
 desc_tv_gg_offense_1: "This Grand General is an Aggressive Commander. Their bold tactics push troops to fight with greater discipline and ferocity."
 tv_gg_offense_1_die_desc: "[CHARACTER.GetSheHe|U] was an aggressive commander who led from the front. [CHARACTER.GetHerHis|U] relentless fighting spirit will be sorely missed."
 tv_gg_offense_2: "Aggressive Commander II"
 tv_gg_offense_2_desc: "Refined aggression and heightened morale make this general a terror on the offensive."
 desc_tv_gg_offense_2: "This Grand General is a seasoned Aggressive Commander. Refined offensive tactics and inspiring presence push troops to new heights of ferocity."
 tv_gg_offense_2_die_desc: "[CHARACTER.GetSheHe|U] was a master of aggressive warfare. Our enemies breathe easier knowing [CHARACTER.GetSheHe] can no longer lead the charge."
 tv_gg_offense_3: "Warlord"
 tv_gg_offense_3_desc: "This general's mastery of offensive warfare is complete. Their presence on the battlefield turns the tide before the first blow is struck."
 desc_tv_gg_offense_3: "This Grand General is a Warlord whose mastery of offensive warfare is complete. [CHARACTER.GetHerHis|U] battlefield instincts can turn the tide before the first blow is struck."
 tv_gg_offense_3_die_desc: "[CHARACTER.GetSheHe|U] was a true Warlord, the likes of which our realm may never see again. The battlefield will feel emptier without [CHARACTER.GetHerHim]."

 # Defense path (防御)
 tv_gg_defense_1: "Stalwart Defender I"
 tv_gg_defense_1_desc: "This general's soldiers hold their ground like iron, conserving strength where others squander it."
 desc_tv_gg_defense_1: "This Grand General is a Stalwart Defender. Their troops hold the line with iron discipline, conserving strength where others would waste it."
 tv_gg_defense_1_die_desc: "[CHARACTER.GetSheHe|U] was a stalwart defender whose soldiers never broke rank. The walls feel thinner without [CHARACTER.GetHerHim]."
 tv_gg_defense_2: "Stalwart Defender II"
 tv_gg_defense_2_desc: "Tactical genius for defensive warfare — no siege line can break them, no ambush can rout them."
 desc_tv_gg_defense_2: "This Grand General is an accomplished Stalwart Defender. Tactical genius for defensive warfare means no siege line can break them and no ambush can rout them."
 tv_gg_defense_2_die_desc: "[CHARACTER.GetSheHe|U] could hold any position no matter the odds. Our enemies will test our defences anew, knowing [CHARACTER.GetSheHe] is gone."
 tv_gg_defense_3: "Unbreakable"
 tv_gg_defense_3_desc: "This general has turned defense into an art form. Enemies crash against their lines like waves against stone."
 desc_tv_gg_defense_3: "This Grand General is Unbreakable. [CHARACTER.GetHerHis|U] mastery of defensive warfare turns fortification into an art form — enemies crash against [CHARACTER.GetHerHis] lines like waves against stone."
 tv_gg_defense_3_die_desc: "[CHARACTER.GetSheHe|U] was a general who could not be broken — yet in the end, even the unbreakable must fall. Our realm is the poorer for [CHARACTER.GetHerHis] passing."

 # Tactics path (战术)
 tv_gg_tactics_1: "Tactician I"
 tv_gg_tactics_1_desc: "Swift marches and precise sieges mark this general's campaigns — always where the enemy least expects."
 desc_tv_gg_tactics_1: "This Grand General is a Tactician. Swift marches and precise sieges mark their campaigns — always arriving where the enemy least expects."
 tv_gg_tactics_1_die_desc: "[CHARACTER.GetSheHe|U] was a cunning tactician whose campaigns were always one step ahead. The maps look different without [CHARACTER.GetHerHis] bold arrows."
 tv_gg_tactics_2: "Tactician II"
 tv_gg_tactics_2_desc: "Superior coordination and battlefield awareness give this general a decisive edge in maneuver warfare."
 desc_tv_gg_tactics_2: "This Grand General is an accomplished Tactician. Superior battlefield coordination and strategic foresight give [CHARACTER.GetHerHim] a decisive edge in maneuver warfare."
 tv_gg_tactics_2_die_desc: "[CHARACTER.GetSheHe|U] outmaneuvered every opponent [CHARACTER.GetSheHe] ever faced. Our forces will feel less nimble without [CHARACTER.GetHerHis] brilliant mind."
 tv_gg_tactics_3: "Grand Strategist"
 tv_gg_tactics_3_desc: "The complete tactician — their campaigns end before they begin, opponents outmaneuvered before a single battle is fought."
 desc_tv_gg_tactics_3: "This Grand General is a Grand Strategist. [CHARACTER.GetHerHis|U] campaigns end before they begin — opponents outmaneuvered before a single battle is fought."
 tv_gg_tactics_3_die_desc: "[CHARACTER.GetSheHe|U] was the greatest strategic mind of [CHARACTER.GetHerHis] age. Some say [CHARACTER.GetSheHe] could win wars without drawing a sword. We shall not see [CHARACTER.GetHerHis] like again."

 # Injury trait
 tv_gg_injured: "Battle Scar"
 tv_gg_injured_desc: "A lingering injury from an intensive training accident. Further training risks reopening the wound — with fatal consequences."
 desc_tv_gg_injured: "This Grand General carries a lasting battle scar from a training accident. Further training risks reopening the wound — with fatal consequences."
 tv_gg_injured_die_desc: "[CHARACTER.GetSheHe|U] bore [CHARACTER.GetHerHis] wound with stoic resolve for years. In the end, the old injury claimed what the battlefield could not."

