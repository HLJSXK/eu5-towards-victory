 # ── Training outcome events ──────────────────────────────────────────────────
 tv_grand_general.1.t: "A General Honed"
 tv_grand_general.1.d: "The rigorous training regimen has borne fruit. Our Grand General emerges sharper, stronger, and more tactically astute than before."
 tv_grand_general.1.a: "Every campaign now makes us stronger."

 tv_grand_general.2.t: "Peerless Under Heaven"
 tv_grand_general.2.d: "There is nothing more our Grand General can learn from training — their military genius has reached its pinnacle. This mastery now flows upward, inspiring even our ruler to new heights of strategic vision."
 tv_grand_general.2.a: "Our realm commands the greatest military mind of the age."

 tv_grand_general.3.t: "A Path of Mastery"
 tv_grand_general.3.d: "The training has honed our Grand General's skills to a fine edge. A new military discipline now opens before them — choose the path they shall walk."
 tv_grand_general.3.a: "Pursue the Offensive Path (进攻)."
 tv_grand_general.3.b: "Pursue the Defensive Path (防御)."
 tv_grand_general.3.c: "Pursue the Tactical Path (战术)."

 tv_grand_general.4.t: "Forged in a Hundred Battles"
 tv_grand_general.4.d: "Every path of military mastery has been walked to its end. Our Grand General has nothing left to learn of the art of war itself — but their personal military skill still has room to grow."
 tv_grand_general.4.a: "The realm is fortunate to command such a warrior."

 tv_grand_general.5.t: "Peerless Under Heaven"
 tv_grand_general.5.d: "Our Grand General has transcended the limits of both skill and technique. There is no greater military mind alive. This perfection now elevates even our ruler."
 tv_grand_general.5.a: "Our realm commands the greatest military mind of the age."

 tv_grand_general.6.t: "Wounded in Training"
 tv_grand_general.6.d: "An accident during training has left our Grand General with a lasting injury. They carry it with stoic resolve — but the wound may one day prove fatal if they train again without care."
 tv_grand_general.6.a: "We shall pray for a swift recovery."

 tv_grand_general.7.t: "Old Wounds Reopened"
 tv_grand_general.7.d: "The rigors of training have proven too much. The old injury has torn open again — and this time, there is no recovery. Our Grand General has died on the training grounds."
 tv_grand_general.7.a: "A heavy loss. We shall find a worthy successor."

 tv_grand_general.8.t: "A General Lost"
 tv_grand_general.8.d: "Fate is cruel. An accident during training has taken our Grand General from us. They died before their potential was fully realised."
 tv_grand_general.8.a: "We shall honour their memory and continue."

 # ── Governor death event ────────────────────────────────────────────────────
 tv_govhouse.1.t: "A Governor Has Died"
 tv_govhouse.1.d: "One of our regional governors has died. Their governed region no longer receives Governor's House bonuses until a new governor is assigned."
 tv_govhouse.1.a: "We must appoint a replacement."

 tv_govhouse.2.t: "The Grand General Has Died"
 tv_govhouse.2.d: "Our Grand General has died. The Governor's House will remain without its supreme military commander until a successor is appointed."
 tv_govhouse.2.a: "We must appoint a successor."

 # ── Balance-of-power backlash events ───────────────────────────────────────
 tv_govhouse.10.t: "Murmurs in the District"
 tv_govhouse.10.d: "A district under the Governor's House has found its daily petitions rerouted through military clerks and quartermasters. The people know exactly whose seal now matters.\n\n#R WARNING: This event appeared because your Grand General controls at least 25% of the Balance of Power.#!"
 tv_govhouse.10.a: "Let the district bear it."
 tv_govhouse.10.b: "Spend gold to calm the streets."

 tv_govhouse.11.t: "Seal and Sword"
 tv_govhouse.11.d: "Orders drafted in the palace now return with soldiers' annotations. To insist on the old chain of authority would cost the realm more than dignity.\n\n#R WARNING: This event appeared because your Grand General controls at least 25% of the Balance of Power.#!"
 tv_govhouse.11.a: "Yield formal authority."
 tv_govhouse.11.b: "Spend stability on an open rebuke."

 tv_govhouse.12.t: "Noble Coldness"
 tv_govhouse.12.d: "Noble houses mutter that the Governor's House treats old privilege as another supply ledger. Their banquets grow colder and their promises thinner.\n\n#R WARNING: This event appeared because your Grand General controls at least 25% of the Balance of Power.#!"
 tv_govhouse.12.a: "Accept noble resentment."
 tv_govhouse.12.b: "Move court values toward aristocracy."

 tv_govhouse.13.t: "The Interrupted Inquiry"
 tv_govhouse.13.d: "Scholars report that archives, instruments, and correspondence have been requisitioned for military administration. Research must wait for marching orders.\n\n#R WARNING: This event appeared because your Grand General controls at least 25% of the Balance of Power.#!"
 tv_govhouse.13.a: "Let research be delayed."
 tv_govhouse.13.b: "Draw resources from the capital."

 tv_govhouse.20.t: "A Province Turns Sour"
 tv_govhouse.20.d: "A whole province now feels the Governor's House pressing through tax rolls, patrols, and forced cooperation. What began as irritation has spread from town to town.\n\n#R WARNING: This event appeared because your Grand General controls at least 50% of the Balance of Power.#!"
 tv_govhouse.20.a: "The province must endure."
 tv_govhouse.20.b: "Fund a provincial settlement."

 tv_govhouse.21.t: "A Writ Overruled"
 tv_govhouse.21.d: "The Grand General's staff has quietly countermanded a royal writ. Pretending this is ordinary administration will cost legitimacy; confronting it will shake the realm.\n\n#R WARNING: This event appeared because your Grand General controls at least 50% of the Balance of Power.#!"
 tv_govhouse.21.a: "Concede the loss of authority."
 tv_govhouse.21.b: "Stabilize the realm by public decree."

 tv_govhouse.22.t: "Nobles Withdraw"
 tv_govhouse.22.d: "The nobility no longer complains in whispers. They withhold cooperation from the Governor's House and demand proof that aristocratic rank still matters.\n\n#R WARNING: This event appeared because your Grand General controls at least 50% of the Balance of Power.#!"
 tv_govhouse.22.a: "Let their anger stand."
 tv_govhouse.22.b: "Restore aristocratic precedence."

 tv_govhouse.23.t: "Notes Confiscated"
 tv_govhouse.23.d: "Research notes have been seized as if they were campaign plans. Learned men now ask whether the court values discovery or obedience.\n\n#R WARNING: This event appeared because your Grand General controls at least 50% of the Balance of Power.#!"
 tv_govhouse.23.a: "The work will resume later."
 tv_govhouse.23.b: "Spend the capital's prosperity."

 tv_govhouse.24.t: "A Gallery Put to the Torch"
 tv_govhouse.24.d: "A work of art has become a token in the struggle over prestige. The Governor's House sees a useless luxury; the court sees a wound to memory.\n\n#R WARNING: This event appeared because your Grand General controls at least 50% of the Balance of Power.#!"
 tv_govhouse.24.a: "Let the work burn."
 tv_govhouse.24.b: "Spend prestige to shield the collection."

 tv_govhouse.25.t: "A Studio Falls Silent"
 tv_govhouse.25.d: "An artist has angered officers close to the Grand General. Protecting the studio now means finding a more valuable life to place in the path of blame.\n\n#R WARNING: This event appeared because your Grand General controls at least 50% of the Balance of Power.#!"
 tv_govhouse.25.a: "The artist is sacrificed."
 tv_govhouse.25.b: "A minister will take their place."

 tv_govhouse.30.t: "An Area Refuses the House"
 tv_govhouse.30.d: "Across an entire area, local patience collapses at once. The Governor's House has become the face of every order, tax, and humiliation.\n\n#R WARNING: This event appeared because your Grand General controls at least 75% of the Balance of Power.#!"
 tv_govhouse.30.a: "Let the area bear it."
 tv_govhouse.30.b: "Pour money into pacification."

 tv_govhouse.31.t: "The State Bows"
 tv_govhouse.31.d: "Courtiers now ask permission where they once gave orders. The Grand General's authority has become a second constitution written in command seals.\n\n#R WARNING: This event appeared because your Grand General controls at least 75% of the Balance of Power.#!"
 tv_govhouse.31.a: "The state must bow."
 tv_govhouse.31.b: "Spend stability to resist."

 tv_govhouse.32.t: "The Nobles Close Ranks"
 tv_govhouse.32.d: "Great houses form a defensive circle around their privileges. They will not be ruled by soldiers unless the court openly restores aristocratic weight.\n\n#R WARNING: This event appeared because your Grand General controls at least 75% of the Balance of Power.#!"
 tv_govhouse.32.a: "Let noble satisfaction collapse."
 tv_govhouse.32.b: "Give aristocracy a stronger hand."

 tv_govhouse.33.t: "A Season of Empty Desks"
 tv_govhouse.33.d: "The scholars' desks sit empty while clerks drag their work into military stores. Whole months of thought vanish into the machinery of control.\n\n#R WARNING: This event appeared because your Grand General controls at least 75% of the Balance of Power.#!"
 tv_govhouse.33.a: "Research will suffer."
 tv_govhouse.33.b: "Drain the capital to preserve it."

 tv_govhouse.34.t: "The Cabinet Under the Sword"
 tv_govhouse.34.d: "The cabinet has become an obstacle to the Grand General's command. By morning, either the ministers will be gone, or the ruler must prove obedience in a more personal way.\n\n#R WARNING: This event appeared because your Grand General controls at least 75% of the Balance of Power.#!"
 tv_govhouse.34.a: "The cabinet is lost."
 tv_govhouse.34.b: "Break the ruler's strength instead."

 # ── Grand General traits ─────────────────────────────────────────────────────
 # Offense path (进攻)
 tv_gg_offense_1: "Aggressive Commander I"
 tv_gg_offense_1_desc: "This general favours bold offensives, driving their troops forward with relentless discipline and fire."
 desc_tv_gg_offense_1: "This Grand General is an Aggressive Commander. Their bold tactics push troops to fight with greater discipline and ferocity."
 tv_gg_offense_1_die_desc: "[CHARACTER.GetSheHe|U] was an aggressive commander who led from the front. [CHARACTER.GetHerHis|U] relentless fighting spirit will be sorely missed."
 tv_gg_offense_2: "Aggressive Commander II"
 tv_gg_offense_2_desc: "Refined aggression and heightened morale make this general a terror on the offensive."
 desc_tv_gg_offense_2: "This Grand General is a seasoned Aggressive Commander. Refined offensive tactics and inspiring presence push troops to new heights of ferocity."
 tv_gg_offense_2_die_desc: "[CHARACTER.GetSheHe|U] was a master of aggressive warfare. Our enemies breathe easier knowing [CHARACTER.GetSheHe] can no longer lead the charge."
 tv_gg_offense_3: "Warlord"
 tv_gg_offense_3_desc: "This general's mastery of offensive warfare is complete. Their presence on the battlefield turns the tide before the first blow is struck."
 desc_tv_gg_offense_3: "This Grand General is a Warlord whose mastery of offensive warfare is complete. [CHARACTER.GetHerHis|U] battlefield instincts can turn the tide before the first blow is struck."
 tv_gg_offense_3_die_desc: "[CHARACTER.GetSheHe|U] was a true Warlord, the likes of which our realm may never see again. The battlefield will feel emptier without [CHARACTER.GetHerHim]."

 # Defense path (防御)
 tv_gg_defense_1: "Stalwart Defender I"
 tv_gg_defense_1_desc: "This general's soldiers hold their ground like iron, conserving strength where others squander it."
 desc_tv_gg_defense_1: "This Grand General is a Stalwart Defender. Their troops hold the line with iron discipline, conserving strength where others would waste it."
 tv_gg_defense_1_die_desc: "[CHARACTER.GetSheHe|U] was a stalwart defender whose soldiers never broke rank. The walls feel thinner without [CHARACTER.GetHerHim]."
 tv_gg_defense_2: "Stalwart Defender II"
 tv_gg_defense_2_desc: "Tactical genius for defensive warfare — no siege line can break them, no ambush can rout them."
 desc_tv_gg_defense_2: "This Grand General is an accomplished Stalwart Defender. Tactical genius for defensive warfare means no siege line can break them and no ambush can rout them."
 tv_gg_defense_2_die_desc: "[CHARACTER.GetSheHe|U] could hold any position no matter the odds. Our enemies will test our defences anew, knowing [CHARACTER.GetSheHe] is gone."
 tv_gg_defense_3: "Unbreakable"
 tv_gg_defense_3_desc: "This general has turned defense into an art form. Enemies crash against their lines like waves against stone."
 desc_tv_gg_defense_3: "This Grand General is Unbreakable. [CHARACTER.GetHerHis|U] mastery of defensive warfare turns fortification into an art form — enemies crash against [CHARACTER.GetHerHis] lines like waves against stone."
 tv_gg_defense_3_die_desc: "[CHARACTER.GetSheHe|U] was a general who could not be broken — yet in the end, even the unbreakable must fall. Our realm is the poorer for [CHARACTER.GetHerHis] passing."

 # Tactics path (战术)
 tv_gg_tactics_1: "Tactician I"
 tv_gg_tactics_1_desc: "Swift marches and precise sieges mark this general's campaigns — always where the enemy least expects."
 desc_tv_gg_tactics_1: "This Grand General is a Tactician. Swift marches and precise sieges mark their campaigns — always arriving where the enemy least expects."
 tv_gg_tactics_1_die_desc: "[CHARACTER.GetSheHe|U] was a cunning tactician whose campaigns were always one step ahead. The maps look different without [CHARACTER.GetHerHis] bold arrows."
 tv_gg_tactics_2: "Tactician II"
 tv_gg_tactics_2_desc: "Superior coordination and battlefield awareness give this general a decisive edge in maneuver warfare."
 desc_tv_gg_tactics_2: "This Grand General is an accomplished Tactician. Superior battlefield coordination and strategic foresight give [CHARACTER.GetHerHim] a decisive edge in maneuver warfare."
 tv_gg_tactics_2_die_desc: "[CHARACTER.GetSheHe|U] outmaneuvered every opponent [CHARACTER.GetSheHe] ever faced. Our forces will feel less nimble without [CHARACTER.GetHerHis] brilliant mind."
 tv_gg_tactics_3: "Grand Strategist"
 tv_gg_tactics_3_desc: "The complete tactician — their campaigns end before they begin, opponents outmaneuvered before a single battle is fought."
 desc_tv_gg_tactics_3: "This Grand General is a Grand Strategist. [CHARACTER.GetHerHis|U] campaigns end before they begin — opponents outmaneuvered before a single battle is fought."
 tv_gg_tactics_3_die_desc: "[CHARACTER.GetSheHe|U] was the greatest strategic mind of [CHARACTER.GetHerHis] age. Some say [CHARACTER.GetSheHe] could win wars without drawing a sword. We shall not see [CHARACTER.GetHerHis] like again."

 # Injury trait
 tv_gg_injured: "Battle Scar"
 tv_gg_injured_desc: "A lingering injury from an intensive training accident. Further training risks reopening the wound — with fatal consequences."
 desc_tv_gg_injured: "This Grand General carries a lasting battle scar from a training accident. Further training risks reopening the wound — with fatal consequences."
 tv_gg_injured_die_desc: "[CHARACTER.GetSheHe|U] bore [CHARACTER.GetHerHis] wound with stoic resolve for years. In the end, the old injury claimed what the battlefield could not."

