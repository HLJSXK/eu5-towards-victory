 # ── Governor's House (总督府) ─────────────────────────────────────────────────
 # IO type auto-derived keys
 tv_govhouse: "Governor's House"
 tv_govhouse_desc: "The [tv_govhouse|E] is the administrative apparatus of a conquering empire. Established when the realm controls 200 locations, it organises the appointment of [tv_local_governor|e]s over conquered regions and commands the [tv_grand_general|E], the supreme military commander of the realm."
 diplomatic_status_tv_govhouse_name: "[tv_govhouse|E] Member"
 diplomatic_status_tv_govhouse_tooltip: "This country has established a [tv_govhouse|E] to administer its conquered territories."
 tv_govhouse_list_who_tt: "[tv_govhouse|E] members"
 io_opinion_tv_govhouse: "Fellow [tv_govhouse|E] Member"
 TV_GOVHOUSE_GRAND_GENERAL: "Grand General"
 TV_GOVHOUSE_GRAND_GENERAL_MALE:0 "Grand General"
 TV_GOVHOUSE_GRAND_GENERAL_FEMALE:0 "Grand General"
 tv_govhouse_authority:0 "Governor's Authority"
 tv_govhouse_authority_desc:0 "Represents the administrative and military authority wielded by the [tv_govhouse|E]. High authority enables more effective governance of conquered territories."
 tv_govhouse_power_balance:0 "Balance of Power"
 tv_govhouse_power_balance_desc:0 "The actual distribution of power between the [tv_grand_general|E] and the Crown. Higher [tv_govhouse_power_balance|e] on the [tv_grand_general|e]'s side increases the risk of backlash events."
 tv_govhouse_power_equilibrium:0 "Balance of Power Equilibrium"
 tv_govhouse_power_equilibrium_desc:0 "The balance of power moves toward this value each month, up to 1% at a time."
 tv_govhouse_power_consolidation:0 "Power Consolidation"
 tv_govhouse_power_consolidation_desc:0 "Personal power accumulated by the [tv_grand_general|E] while in office. It pushes [tv_govhouse_power_balance|e] toward the [tv_grand_general|e], raises dismissal and replacement costs, and immediately resets when the [tv_grand_general|e] leaves office."
 TV_GOVHOUSE_GENERAL_TAB: "Grand General"
 TV_GOVHOUSE_GENERAL_TAB_TOOLTIP: "[tv_grand_general|E] management"
 TV_GOVHOUSE_CURRENT_GENERAL_LABEL: "Current [tv_grand_general|E]:"
 TV_GOVHOUSE_NO_GENERAL: "None appointed"
 TV_GOVHOUSE_AUTHORITY_LABEL: "Governor's Authority:"
 TV_GOVHOUSE_POWER_BALANCE_CARD_TITLE: "Balance of Power"
 TV_GOVHOUSE_POWER_BALANCE_TOOLTIP: "The left side represents the [tv_grand_general|E]; the right side represents the Crown. [tv_govhouse_power_balance|E] moves toward equilibrium by up to 1% each month."
 TV_GOVHOUSE_POWER_BALANCE_GENERAL_SIDE: "[tv_grand_general|E]"
 TV_GOVHOUSE_POWER_BALANCE_CROWN_SIDE: "Crown"
 TV_GOVHOUSE_POWER_SEGMENT_0: "@warning_icon! <25%: Quiet. No balance backlash events."
 TV_GOVHOUSE_POWER_SEGMENT_1: "@warning_icon! 25-49%: Mild backlash can occur."
 TV_GOVHOUSE_POWER_SEGMENT_2: "@warning_icon! 50-74%: Stronger backlash; rare court losses."
 TV_GOVHOUSE_POWER_SEGMENT_3: "@warning_icon! 75-100%: Severe backlash; cabinet danger."

 # ── Governor's House laws ───────────────────────────────────────────────────
 tv_govhouse_laws: "[tv_govhouse|E] Laws"
 TV_GOVHOUSE_LAWS_LAW_CATEGORY: "[tv_govhouse|E] Laws"
 tv_govhouse_grand_general: "[tv_grand_general|E]"
 TV_GOVHOUSE_GRAND_GENERAL_LAW_CATEGORY: "[tv_grand_general|E]"
 tv_govhouse_governor_functions: "Local Governor Functions"
 TV_GOVHOUSE_GOVERNOR_FUNCTIONS_LAW_CATEGORY: "Local Governor Functions"

 tv_govhouse_expedition_goal_law: "Expedition Goal"
 tv_govhouse_expedition_goal_law_desc: "The [tv_govhouse|E] decides whether expansion should follow ports, conquests, settlers, or tributary rulers."
 tv_govhouse_trade_posts_policy: "Trade Posts"
 tv_govhouse_trade_posts_policy_desc: "Ports, markets, and shipping lanes define the expedition. Overseas commerce grows cheaper and richer, but inland control remains thin."
 tv_govhouse_conquest_colony_policy: "Conquest Colony"
 tv_govhouse_conquest_colony_policy_desc: "The House claims land for permanent rule. Taxes rise modestly, while garrisons, rebels, and bureaucracy grow with them."
 tv_govhouse_frontier_settlement_policy: "Frontier Settlement"
 tv_govhouse_frontier_settlement_policy_desc: "Migrants, farms, and towns take priority. Population and assimilation improve, while early revenue remains modest."
 tv_govhouse_tributary_system_policy: "Tributary System"
 tv_govhouse_tributary_system_policy_desc: "Influence flows through dependent rulers. Administration is light and tribute useful, but direct control and subject loyalty suffer."

 tv_govhouse_governor_appointment_law: "Governor Appointment"
 tv_govhouse_governor_appointment_law_desc: "This law defines who becomes a [tv_local_governor|E] and whose interests shape the frontier administration."
 tv_govhouse_royal_appointment_policy: "Royal Appointment"
 tv_govhouse_royal_appointment_policy_desc: "Officials arrive from the central court. Their loyalty steadies legitimacy and control, though estates resent the crown's hand."
 tv_govhouse_hereditary_nobility_policy: "Hereditary Nobility"
 tv_govhouse_hereditary_nobility_policy_desc: "Local noble houses turn office into inheritance. Noble power and satisfaction rise, concentrating frontier rule in aristocratic hands."
 tv_govhouse_merchant_tax_farming_policy: "Merchant Tax Farming"
 tv_govhouse_merchant_tax_farming_policy_desc: "Merchants and companies contract for government. Burgher power grows, and trade income rises."
 tv_govhouse_military_land_grants_policy: "Military Land Grants"
 tv_govhouse_military_land_grants_policy_desc: "Commanders receive lands for service. Sieges and army tradition improve, but legitimacy suffers."

 tv_govhouse_local_autonomy_law: "Local Autonomy"
 tv_govhouse_local_autonomy_law_desc: "The House fixes how much power is kept by the center and how much remains in colonial, local, or subject hands."
 tv_govhouse_strict_direct_rule_policy: "Strict Direct Rule"
 tv_govhouse_strict_direct_rule_policy_desc: "Important decisions remain under central control. Taxes and control improve, but estates resent the pressure and unrest mounts."
 tv_govhouse_limited_autonomy_policy: "Limited Autonomy"
 tv_govhouse_limited_autonomy_policy_desc: "Local councils, guilds, and nobles receive limited authority. Stability and production improve, while direct state returns fall."
 tv_govhouse_chartered_colonies_policy: "Chartered Colonies"
 tv_govhouse_chartered_colonies_policy_desc: "Chartered groups govern in the state's name. Migration and burgher power grow while expansion stays cheap."
 tv_govhouse_vassal_autonomy_policy: "Vassal Autonomy"
 tv_govhouse_vassal_autonomy_policy_desc: "Existing elites and institutions remain in place. Conflict eases, but assimilation and religious integration slow sharply."

 tv_govhouse_religious_mission_law: "Religious Mission"
 tv_govhouse_religious_mission_law_desc: "This law determines whether faith remains outside the frontier state or becomes one of its instruments."
 tv_govhouse_secular_governance_policy: "Secular Governance"
 tv_govhouse_secular_governance_policy_desc: "Religious authorities do not direct frontier rule. Tolerance rises, but conversion loses momentum."
 tv_govhouse_official_mission_policy: "Official Mission"
 tv_govhouse_official_mission_policy_desc: "The state sponsors missionary work. Conversion strengthens, while clergy influence and diplomatic friction rise."
 tv_govhouse_religious_orders_policy: "Religious Orders"
 tv_govhouse_religious_orders_policy_desc: "Religious orders join military and administrative work. Conversion, morale, and clergy influence surge."
 tv_govhouse_religious_tolerance_policy: "Religious Tolerance"
 tv_govhouse_religious_tolerance_policy_desc: "Many faiths are allowed to coexist. Tolerance rises, while religious unity advances slowly."

 tv_govhouse_frontier_military_law: "Frontier Military"
 tv_govhouse_frontier_military_law_desc: "The frontier must be defended; this law names the force expected to hold it."
 tv_govhouse_regular_garrison_policy: "Regular Garrison"
 tv_govhouse_regular_garrison_policy_desc: "Central standing troops hold frontier posts. Discipline and defenses improve, but maintenance is costly."
 tv_govhouse_local_militia_policy: "Local Militia"
 tv_govhouse_local_militia_policy_desc: "Colonists and locals organize their own defense. Costs fall and levies grow, but central control weakens."
 tv_govhouse_military_colonies_policy: "Frontier Military Colonies"
 tv_govhouse_military_colonies_policy_desc: "Soldiers settle, farm, and guard the frontier. Control, prosperity, and soldier growth improve, while society becomes more military."
 tv_govhouse_mercenary_system_policy: "Mercenary System"
 tv_govhouse_mercenary_system_policy_desc: "Private forces and mercenaries provide flexible strength. Mobility improves, but war exhaustion worsens."

 tv_govhouse_imperial_integration_law: "Imperial Integration"
 tv_govhouse_imperial_integration_law_desc: "The empire chooses whether conquered lands remain colonies, become dominions, enter the state, or are stripped and abandoned."
 tv_govhouse_permanent_colony_policy: "Permanent Colonies"
 tv_govhouse_permanent_colony_policy_desc: "Colonies remain attached to the mother country for the long term. Subject income is steady, but bureaucracy and independence pressure build."
 tv_govhouse_dominion_status_policy: "Dominion Status"
 tv_govhouse_dominion_status_policy_desc: "Colonies gain broader self-rule. Stability and loyalty improve, while direct central revenue declines."
 tv_govhouse_imperial_province_policy: "Imperial Provinces"
 tv_govhouse_imperial_province_policy_desc: "Frontiers are folded into the formal realm. Assimilation, integration, and development rise at great bureaucratic cost."
 tv_govhouse_plunder_evacuate_policy: "Plunder and Evacuate"
 tv_govhouse_plunder_evacuate_policy_desc: "The House extracts goods without seeking durable rule. Production rises, while control, prosperity, and integration decay."

 tv_govhouse_grand_general_power_law: "[tv_grand_general|E] Power"
 tv_govhouse_grand_general_power_law_desc: "This law defines how the [tv_grand_general|E] is expected to use military authority: campaign outward, hold the frontier, or command every army."
 tv_govhouse_general_marching_orders_policy: "Marching Orders"
 tv_govhouse_general_marching_orders_policy_desc: "The [tv_grand_general|E] is appointed for campaigns beyond the frontier. A clear mandate makes the office easier to obey."
 tv_govhouse_general_marching_orders_policy_effect_tt: "Newly appointed [tv_grand_general|E]s start with #G +10%#! loyalty."
 tv_govhouse_general_garrison_orders_policy: "Garrison Orders"
 tv_govhouse_general_garrison_orders_policy_desc: "The [tv_grand_general|E] keeps provincial administration under military protection, making appointed governors more effective in the regions they hold."
 tv_govhouse_general_garrison_orders_policy_effect_tt: "[tv_local_governor|E] task and function effects are #G 20%#! stronger."
 tv_govhouse_general_supreme_command_policy: "Supreme Command"
 tv_govhouse_general_supreme_command_policy_desc: "The [tv_grand_general|E] becomes the visible center of all military planning. Command grows sharper, but loyalty to the court is harder to assume."
 tv_govhouse_general_supreme_command_policy_effect_tt: "Newly appointed [tv_grand_general|E]s start with #R -10%#! loyalty. [tv_war_tent|E] General Tactics effects are doubled, and [tv_war_plan|E] progress accumulates twice as fast."

 tv_govhouse_administrative_function_law: "Administrative Function"
 tv_govhouse_administrative_function_law_desc: "This law decides which local bonus a [tv_local_governor|E]'s Administrative skill provides."
 tv_govhouse_admin_control_registers_policy: "Control Registers"
 tv_govhouse_admin_control_registers_policy_desc: "Survey books, seals, and review offices make frontier authority legible. Each governor Administrative skill point grants +0.1% local maximum control."
 tv_govhouse_admin_control_registers_policy_effect_tt: "Each point of @adm![adm|E] on a [tv_local_governor|E] provides #G +0.1%#! @max_control!$MODIFIER_TYPE_NAME_local_max_control$."
 tv_govhouse_admin_development_surveys_policy: "Development Surveys"
 tv_govhouse_admin_development_surveys_policy_desc: "Governors are ordered to map roads, fields, wells, and workshops before issuing commands. Each governor Administrative skill point grants +0.00001 local monthly development."
 tv_govhouse_admin_development_surveys_policy_effect_tt: "Each point of @adm![adm|E] on a [tv_local_governor|E] provides #G +0.00001#! @development!$MODIFIER_TYPE_NAME_local_monthly_development$."
 tv_govhouse_admin_production_offices_policy: "Production Offices"
 tv_govhouse_admin_production_offices_policy_desc: "Provincial clerks focus on output quotas, storage rules, and marketable goods. Each governor Administrative skill point grants +0.1% local production efficiency."
 tv_govhouse_admin_production_offices_policy_effect_tt: "Each point of @adm![adm|E] on a [tv_local_governor|E] provides #G +0.1%#! @production_method!$MODIFIER_TYPE_NAME_local_production_efficiency$."

 tv_govhouse_diplomatic_function_law: "Diplomatic Function"
 tv_govhouse_diplomatic_function_law_desc: "This law decides which local bonus a [tv_local_governor|E]'s Diplomatic skill provides."
 tv_govhouse_dip_construction_charters_policy: "Construction Charters"
 tv_govhouse_dip_construction_charters_policy_desc: "Governors bargain with guilds, contractors, and town elites to make public works cheaper. Each governor Diplomatic skill point grants -0.2% local construction cost."
 tv_govhouse_dip_construction_charters_policy_effect_tt: "Each point of @dip![dip|E] on a [tv_local_governor|E] provides #G -0.2%#! @construction!local construction cost."
 tv_govhouse_dip_pop_advancement_policy: "Population Advancement"
 tv_govhouse_dip_pop_advancement_policy_desc: "Local privileges and petitions are used to open paths into better occupations. Each governor Diplomatic skill point grants +0.5% local population promotion speed."
 tv_govhouse_dip_pop_advancement_policy_effect_tt: "Each point of @dip![dip|E] on a [tv_local_governor|E] provides #G +0.5%#! @population!$MODIFIER_TYPE_NAME_local_pop_promotion_speed$."
 tv_govhouse_dip_settlement_patronage_policy: "Settlement Patronage"
 tv_govhouse_dip_settlement_patronage_policy_desc: "The governor's household sponsors families, contracts, and settlement rights. Each governor Diplomatic skill point grants +0.001% local population growth."
 tv_govhouse_dip_settlement_patronage_policy_effect_tt: "Each point of @dip![dip|E] on a [tv_local_governor|E] provides #G +0.001%#! @population!$MODIFIER_TYPE_NAME_local_population_growth$."

 tv_govhouse_military_function_law: "Military Function"
 tv_govhouse_military_function_law_desc: "This law decides which local bonus a [tv_local_governor|E]'s Military skill provides."
 tv_govhouse_mil_order_patrols_policy: "Order Patrols"
 tv_govhouse_mil_order_patrols_policy_desc: "Patrol routes, watches, and rapid punishments keep disorder from gathering strength. Each governor Military skill point grants -0.2% local unrest."
 tv_govhouse_mil_order_patrols_policy_effect_tt: "Each point of @mil![mil|E] on a [tv_local_governor|E] provides #G -0.2%#! @rebels!$MODIFIER_TYPE_NAME_local_unrest$."
 tv_govhouse_mil_frontier_levies_policy: "Frontier Levies"
 tv_govhouse_mil_frontier_levies_policy_desc: "Governors maintain household rolls and local drill grounds for emergency musters. Each governor Military skill point grants +0.2% local army levy size."
 tv_govhouse_mil_frontier_levies_policy_effect_tt: "Each point of @mil![mil|E] on a [tv_local_governor|E] provides #G +0.2%#! @levy!$MODIFIER_TYPE_NAME_local_army_levy_size_modifier$."
 tv_govhouse_mil_fortress_engineers_policy: "Fortress Engineers"
 tv_govhouse_mil_fortress_engineers_policy_desc: "Military governors spend their attention on walls, storehouses, and artillery platforms. Each governor Military skill point grants +0.5% local fort defense."
 tv_govhouse_mil_fortress_engineers_policy_effect_tt: "Each point of @mil![mil|E] on a [tv_local_governor|E] provides #G +0.5%#! @defensive_military_stance!$MODIFIER_TYPE_NAME_global_defensive$."

 tv_govhouse_governor_duty_tendency_law: "Duty Tendency"
 tv_govhouse_governor_duty_tendency_law_desc: "This law biases how [tv_local_governor|E]s choose their [tv_governor_autonomous_task|E] during yearly reassessment."
 tv_govhouse_duty_restore_policy: "Focus Restoration"
 tv_govhouse_duty_restore_policy_desc: "The House tells governors to make damaged provinces breathe again before chasing other priorities."
 tv_govhouse_duty_restore_policy_effect_tt: "Adds #G +30%#! weight to the Restore Prosperity [tv_governor_autonomous_task|E]."
 tv_govhouse_duty_integrate_policy: "Focus Integration"
 tv_govhouse_duty_integrate_policy_desc: "The House tells governors to turn conquered administration into ordinary government."
 tv_govhouse_duty_integrate_policy_effect_tt: "Adds #G +30%#! weight to the Integrate Region [tv_governor_autonomous_task|E]."
 tv_govhouse_duty_religious_unity_policy: "Focus Religious Unity"
 tv_govhouse_duty_religious_unity_policy_desc: "The House tells governors to press frontier religion toward the state faith."
 tv_govhouse_duty_religious_unity_policy_effect_tt: "Adds #G +30%#! weight to the Convert Religion [tv_governor_autonomous_task|E]."
 tv_govhouse_duty_cultural_unity_policy: "Focus Cultural Unity"
 tv_govhouse_duty_cultural_unity_policy_desc: "The House tells governors to draw frontier identities into the realm's cultural order."
 tv_govhouse_duty_cultural_unity_policy_effect_tt: "Adds #G +30%#! weight to the Convert Culture [tv_governor_autonomous_task|E]."
 tv_govhouse_duty_recruitment_policy: "Focus Recruitment"
 tv_govhouse_duty_recruitment_policy_desc: "The House tells governors to keep frontier manpower ready for war."
 tv_govhouse_duty_recruitment_policy_effect_tt: "Adds #G +30%#! weight to the Strengthen Recruitment [tv_governor_autonomous_task|E]."
 tv_govhouse_duty_order_policy: "Focus Order"
 tv_govhouse_duty_order_policy_desc: "The House tells governors to make order visible before unrest learns to organize."
 tv_govhouse_duty_order_policy_effect_tt: "Adds #G +30%#! weight to the Strengthen Order [tv_governor_autonomous_task|E]."

