 TV_GOVHOUSE_POWER_BALANCE_TOOLTIP: "The left side represents the Grand General; the right side represents the Crown. The balance moves toward equilibrium by up to 1% each month."
 TV_GOVHOUSE_POWER_BALANCE_GENERAL_SIDE: "Grand General"
 TV_GOVHOUSE_POWER_BALANCE_CROWN_SIDE: "Crown"

 # ── Conquest M1 IO creation tooltip ─────────────────────────────────────────
 tv_conquest_m1_govhouse_tt: "Establish the Governor's House to administer conquered territories and appoint a Grand General."

 # ── IO Leader management (Grand General) ────────────────────────────────────
 tv_appoint_conquest_general_leader: "Appoint Grand General"
 tv_appoint_conquest_general_leader_desc: "Appoint one of our characters as Grand General of the realm. The Grand General can be trained to improve their military skill and develop one of three specialised military trait paths."
 tv_remove_conquest_general_leader: "Dismiss Grand General"
 tv_remove_conquest_general_leader_desc: "Remove the current Grand General. The position will remain vacant until a new Grand General is appointed."
 tv_change_conquest_general_leader: "Replace Grand General"
 tv_change_conquest_general_leader_desc: "Replace the current Grand General with another character."
 tv_select_grand_general: "Select Grand General"
 tv_no_grand_general_available: "@trigger_no! No eligible characters are available."

 PERFORM_tv_appoint_conquest_general_leader_ACTION_SETUP: "When we appoint a Grand General."
 PERFORM_tv_appoint_conquest_general_leader_ACTION_LOG: "We appointed [SCOPE.sCharacter('target').GetShortNameWithNoTooltip] as Grand General."
 PERFORM_tv_appoint_conquest_general_leader_ACTION_MAP: ""

 PERFORM_tv_remove_conquest_general_leader_ACTION_SETUP: "When we dismiss the Grand General."
 PERFORM_tv_remove_conquest_general_leader_ACTION_LOG: "We dismissed the Grand General."
 PERFORM_tv_remove_conquest_general_leader_ACTION_MAP: ""

 PERFORM_tv_change_conquest_general_leader_ACTION_SETUP: "When we replace the Grand General."
 PERFORM_tv_change_conquest_general_leader_ACTION_LOG: "We appointed [SCOPE.sCharacter('target').GetShortNameWithNoTooltip] as the new Grand General."
 PERFORM_tv_change_conquest_general_leader_ACTION_MAP: ""

 # ── Train action ─────────────────────────────────────────────────────────────
 tv_train_grand_general: "Train Grand General"
 tv_train_grand_general_desc: "Subject our Grand General to a year of intensive training. This increases court expenses by 10% for one year. At the end of training, one of several outcomes occurs: a gain in military skill, advancement along a military trait path, or — rarely — injury or death."

 PERFORM_tv_train_grand_general_ACTION_SETUP: "When we begin training the Grand General."
 PERFORM_tv_train_grand_general_ACTION_LOG: "We began training the Grand General."
 PERFORM_tv_train_grand_general_ACTION_MAP: ""

