 # ── Governor's House (总督府) ─────────────────────────────────────────────────
 # IO type auto-derived keys
 tv_govhouse: "Governor's House"
 tv_govhouse_desc: "The Governor's House is the administrative apparatus of a conquering empire. Established when the realm controls 200 locations, it organises the appointment of governors over conquered regions and commands the Grand General — the supreme military commander of the realm."
 diplomatic_status_tv_govhouse_name: "Governor's House Member"
 diplomatic_status_tv_govhouse_tooltip: "This country has established a Governor's House to administer its conquered territories."
 tv_govhouse_list_who_tt: "Governor's House members"
 io_opinion_tv_govhouse: "Fellow Governor's House Member"
 TV_GOVHOUSE_GRAND_GENERAL: "Grand General"
 TV_GOVHOUSE_GRAND_GENERAL_MALE:0 "Grand General"
 TV_GOVHOUSE_GRAND_GENERAL_FEMALE:0 "Grand General"
 tv_govhouse_authority:0 "Governor's Authority"
 tv_govhouse_authority_desc:0 "Represents the administrative and military authority wielded by the Governor's House. High authority enables more effective governance of conquered territories."
 tv_govhouse_power_balance:0 "Balance of Power"
 tv_govhouse_power_balance_desc:0 "The actual distribution of power between the Grand General and the Crown."
 tv_govhouse_power_equilibrium:0 "Balance of Power Equilibrium"
 tv_govhouse_power_equilibrium_desc:0 "The balance of power moves toward this value each month, up to 1% at a time."
 tv_govhouse_power_consolidation:0 "Power Consolidation"
 tv_govhouse_power_consolidation_desc:0 "Personal power accumulated by the Grand General while in office. It immediately resets when the Grand General leaves office."
 TV_GOVHOUSE_GENERAL_TAB: "Grand General"
 TV_GOVHOUSE_GENERAL_TAB_TOOLTIP: "Grand General management"
 TV_GOVHOUSE_CURRENT_GENERAL_LABEL: "Current Grand General:"
