 # ── IO Description ─────────────────────────────────────────────────────
 tv_diplomatic_alliance_desc: "The [tv_diplomatic_alliance|E] is a grand coalition of nations united in pursuit of diplomatic supremacy. Led by its [tv_alliance_advocator|E], the Alliance coordinates foreign policy, establishes shared protocols, and votes on laws governing cooperation between its members."

 # ── Law Category Descriptions ──────────────────────────────────────────
 tv_court_protocol_desc: "Determines the level of diplomatic formality and legitimacy recognition between Alliance members."
 tv_information_network_desc: "Governs how intelligence, cartography, and communications are shared within the Alliance."
 tv_commerce_consensus_desc: "Sets the rules of maritime commerce, trade agreements, and navigational rights for Alliance members."
 tv_faith_harmony_desc: "Determines the Alliance's stance on religious tolerance and ideological cohesion."
 tv_colonization_sphere_desc: "Defines how Alliance members divide and respect each other's colonial spheres of influence."

